      say I don't see that at all.</p>
      <p>&gt; fits into a square</p>
      <p>And you think this helps readability? I don't.<br>
      And really, based on other things you wrote,<br>
      you shouldn't either!  :-/</p>
      <p>&gt; The t horizontal bar is short towards the right side,<br>
      &gt; so keeping it withing the square, but it doesn’t hurt.</p>
      <p>No? I think it hurts plenty. Horizontality and a strong<br>
      head are how the "t" supports readability. Neither are there.</p>
      <p>&gt; quirky ... eases recognition of word images</p>
      <p>When applied without an understanding of<br>
      readability, it can only do so by dumb luck.</p>
      <p>I'm the biggest fan of divergence in order to improve<br>
      readability! But the good foundation has to be there,<br>
      otherwise it's just random noise.</p>
      <p>&gt; Readability: “the ease with which the eye can<br>
      &gt; absorb the message and move along the line.”</p>
      <p>This I don't agree with. An essential dimension of<br>
      readability is duration/length. Without including this<br>
      any definition just won't cut it in my book, so to speak.</p>
      <p>&gt; kerning ... is “cheating” with a revival of a metal face</p>
      <p>For some reason I don't have a problem with that sort<br>
      of thing. And few people -like Dan Carr- seem to, really.</p>
      <p>For one thing, a discerning typographer could always file<br>
      down sorts to make them fit better (although of course it<br>
      takes too much effort to do it to pages and pages of text).</p>
      <p>&gt; Karsten has explained my point about italics fitting better,<br>
      &gt; by mentioning how the characters “fill the square”.</p>
      <p>(We're sort of migrating across threads now, but OK.)</p>
      <p>The big problem with this direction of thought is that<br>
      it's the lack/weakness of serifs promoting the boxiness,<br>
      not the slant. This is even before we get into the issue<br>
      of the detriment of boxiness to readability...</p>
      <p>The fact is that italics, due to the need to limit breakage<br>
      and hence kerns, are necessarily fitted more poorly <cite>in the<br>
      pre-digital era!</cite></p>
      <p>&gt; it always seems like there is too much space around these in the roman. </p>
      <p>The fatal flaw of this logic is the assumption that only black space<br>
      conveys information*. Not to mention the direct opposition to the<br>
      other thing in Oneleigh that Karsten points out: irregularity.<br>
      The two combine to imbalance the leveraging of notan.</p>
      <p>* A natural symptom of creation-centric (as opposed to<br>
      user-centric) design and/or the perception that a font<br>
      is a bunch of shapes (as opposed to a notan machine).</p>
      <p>hhp</p>
