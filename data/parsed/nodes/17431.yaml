      <p>One thing about italics, at least in the pre-digital era, was that they fitted a lot better than romans, without kerning.</p>
      <p>This was an idea I discovered and explored in Oneleigh Italic, where I was able to design the face no kerning between lower-case letters, and only one or two Cap-lowercase kerns.</p>
      <p>I'm not convinced this smooth fit is necessarily an advantage, as it can tend towards an indiscriminate greyness; but on the other hand, roman text is prone to occasionally exhibiting really awkward glyph combinations which can't be good for fluent reading.</p>
