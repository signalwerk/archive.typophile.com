      <p>[I must apologize in advance for a very long post!]</p>
      <p>I am not an advocate of sanserifs either. Spectrum italic is really interesting. But I think it tends to being monotonous. This may relate to </p>
      <p>Nick Shinn:<br>
      "One thing about italics ... was that they fitted a lot better than romans, without kerning. ... This was an idea I discovered and explored in Oneleigh Italic, where I was able to design the face no kerning between lower-case letters, and only one or two Cap-lowercase kerns."</p>
      <p>Yes! This is the game, not only for italics: keep letterforms as compact as possible and avoid elements extending too far, yet at the same time make it LOOK vivid and irregular. By the way of irregularity and readability. In "The Case for Legibility", p.77, John Ryder shows a nice illustration of the different slants in minuscules of Jenson italic, and mentions that this unfortunately has been evened out in certain re-cuts.</p>
      <p>John Hudson:<br>
      My use of "regarded as readable" is a bit ambivalent indeed.<br>
      On the one hand, I doubt the value of readability tests. As you  also seem to imply, you can never be sure WHAT the results actually proove -- that people are used to certain forms? or that certain forms are "objectively more readable" by whatever criteria? These tests can only show THAT, at a particular time and place, people read certain typefaces faster than they read other ones.<br>
      But I didn't intend to make a difference between "scientifically provable" readability and merely "felt" readability. My emphasis was on "FORM PER SE being more readable" which notion doesn't make any sense to me. See the following off-topic part.</p>
      <p>This may be a bit off-topic, but ...</p>
      <p>hhp:<br>
      "Karsten, the total relativism of readability is a fallacy, and a damaging one."</p>
      <p>Sorry, I am "relativist" by default. Yet I am not fond of this term -- whenever I encounter it in philosophical writings, it is the last weapon used by naive-realist dogmatists. Ernst von Glasersfeld has some nice reply to that in his "Radical Constructivism" (the book's biggest fault is its silly title).   ;-)</p>
      <p>That aside ... you don't need to convince me of the advantages of fraktur. Yes, it is more condensed and its baroque-by-default forms may allow for more variation than roman. BUT: Give someone a text set in fraktur to read, and he will be in trouble. What IS readability? Of course you can conceive of some criteria and "measure" fraktur and roman against them, "objectively." (Now you have to tell me what "objective" means. HAVING some criteria at all? How do you decide which criteria are the relevant ones?) But then you also have to tell the rest of the world (Germans included) that fraktur is "objectively" better and they should learn to read it -- so obviously there is more to readability than criteria like letters per page, &amp;c.<br>
      Roman typefaces of the last decades have proven that much is possible in this domain too, in terms of readability as well as expression. It is a fact: We are USED to reading roman letterforms.<br>
      (I don't regret that. Except maybe for the long-s / end-s distinction which nicely indicated where you could divide a word, and where you couldn't.)</p>
      <p>The link to your website, part 2: I haven't been at ATypI Leipzig, and only heard about the panel discussion. (Volker Küster was my type design teacher.)<br>
      I cannot help thinking that "modernizing fraktur for contemporary use" is cheating. The result will either be too much of fraktur and of no use, or not fraktur any more ... There already were such attempts, around 1930, to "modernize" textur type and bring them "up to date." Element, National and Tannenberg. If you study these typefaces carefully you will realize that they are the exact equivalent to Futura and its contemporaries -- reduction. If you look at National you'll notice the normalized S and s and k forms, or the one-storey a (this is Futura translated into blackletter!), but also the additional vertical part to the r's ear and the additional vertical connecting part at the e's slope -- both of which have a visual function, but can also be interpreted to utter a deep misunderstanding of textur laws of form. These are very extreme examples (in many respects) but, to me are proof that something is wrong about this approach.</p>
      <p>Which finally leads me back to the topic ... </p>
      <p>I consider it more fruitful to study good fraktur and textur type, or early roman types like that of Sweynheym &amp; Pannartz, to find out if they have features which would enhance type today. For me this is not particular letterforms but very "abstract" things like a dark color (remember the complaints about Dolly on a thread next door? someone got it but didn't understand), compact letterforms which make spacing and kerning easier (see Nick's remark above), or a certain irregularity (like varying slants in italics). Unfortunately, Grotext is not finished yet which is such an experiment.</p>
      <p>Hope I did not waste your time. ;-)</p>
      <p>Karsten</p>
