      <p>Karsten has explained my point about italics fitting better, by mentioning how the characters "fill the square". The character forms that differ most between roman and italic are v and w. In combination with round characters, it always seems like there is too much space around these in the roman. Some digital romans address this by giving v and w negative sidebearings, not something that was done in metal. Many others, like Adobe Garamond, have negative sidebearings and also negative kerning.</p>
      <p>The round forms of v and w in the italic "fill the square" better.</p>
