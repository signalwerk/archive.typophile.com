      <p>Norbert, I don't really buy that italic was ever as readable as Aldus's Roman. What Jenson and Griffo and Garamond figured out was, I think, how to make type *more* readable than written letters. </p>
      <p>I forget where I read that the most readable is lower case serif type, and whenever you depart from it it slows the reader down. I believe it. </p>
      <p>My question was, given that italic is slower, what can you do to reduce the difficulties. Thanks, Maxim, for the example of Carter's National Geographic italic. It solves the problem, it seems, by making an italic the same weight and width as the roman. That works admirably for his purpose, but wouldn't be so good as a companion italic. So of the different ways you can move toward the roman, which is most helpful? Or are there othere ways to achieve greater readability, other than increasing width, reducing slant, increasing weight?</p>
