      <p>Thank you for the legibility and readability definitions!</p>
      <p>"I would put Companion higher on ‘readability,’ though neither face is really aiming for that as a priority."<br>
      "Incidentally, by contrast [with Jenson], the italic of ‘Goodchild,’ Nick’s Jenson-inspired font, is much more regular."</p>
      <p>So you tend toward the rather calm or modest typefaces. ;-)  It cannot be denied that Oneleigh is expressive, yet the exaggeration makes it easy to see the principles at work. These don't differ from the ones in Adobe Jenson Italic, though in Jenson they are much more subtle. Even in Jenson Italic, the t bar is very short, the f endings are far from being swashy. Especially note the y which tries to be compact; this becomes more obvious if compared to the swash alternate y. Part of the evenness in turn seems to result from similarly wide counters.<br>
      Another interesting thing which I see in Jenson Italic is that e.g. m n r stems are leftside curves while i or t stems are rightside curves. This may also add to (I think) legibility &amp; thus readability.<br>
      A lot of kerning doesn't mean cheating at all, and digital type need not imitate letterpress type. Not even in a revival. What I am interested in is to keep efforts in type design reasonable. One aspect is to avoid too much kerning, and "compact" letterforms help a lot. I see that this sounds worse than it is meant -- I don't make squarish letterforms myself and do kern terribly much.</p>
      <p>Karsten</p>
