      <p>John,<br>
      I don't know if you count me as one of the "other respondents [who] seem to have assumed that he meant something else" or not. I assure you that the word "regarded" is the prime factor I addressed. "Regarded" is more often what we act on than what may be indicated in any data collected. Too often people look at the conclusion drawn or postulated reasoning for the effect being measured instead of scrutinizing the way the testing was done and what we may draw from that limited spectrum. Testing that measures complexity and redundancy of saccades in types in use today can easily be "regarded" as a measure for types to come in use in the future. I don't pretend to know what they will be any more than the  blackletter reading people of years past knew would come after their time. The concept of "habitualization" has never been fully addressed perhaps because it is too difficult to measure. Those who make type selection decisions make their decisions mostly on what they "regard" as the best selection whether it in fact is or not. They may listen more to those who TO THEM are "regarded" to be the experts whether they in fact are or not.<br>
      My intent with all of this is that we not close the doors to what might prove to be a better tool or methodology because "the theory on which they have spent a lifetime threatens to be swept away.”</p>
      <p>ChrisL</p>
