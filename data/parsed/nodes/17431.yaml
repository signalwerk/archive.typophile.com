    html: "<p>I think Norbert is right that for e.g. Aldus' contemporaries, italic text was closer to what they were reading on a daily basis than the more formal roman types, and that readers were equally comfortable with both and may even have been more comfortable reading the italic types. It is important to remember that our contrastive use of italics in predominantly roman text is a later convention, and that the primary distinction is between formal and cursive writing models, between the book hand and the chancery hand. This is a distinction that is not limited to the Latin script: you find exactly the same thing in other mature manuscript traditions, e.g. Hebrew (with the added, third class of the semi-formal rashi style). The convention of use is not usually contrastive of different kinds of text within the same book, but contrastive of different kinds of books.</p>"
