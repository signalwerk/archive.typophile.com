      <p>Interesting. I see what you mean about Poetica. I think Poetica looks great large, but in small sizes--and not very small at that--it crashes in readibilty, whereas Adobe Jenson keeps on reading well at small sizes. Part of this is Poetica's narrowness, which in large size gives it tension and drama, whereas at small becomes very difficult to read. Jenson is wider--the m is 25% wider than Poetica, which is a lot--so that is an important factor, but I also wonder whether the darker weight and flairing stems of Jenson, and their affect on color is also helpful. </p>
      <p>By the way comparing Poetica and Adobe Jenson at small sizes will show anybody who is doubtful that this readability stuff is for real. In large size both are perfectly legible, in the sense of telling readily one letter from another. But at small size the difference in readability is dramatic.</p>
      <p>As you can tell, I am a big fan of Slimbach, especially his italics, which I think are really strong.</p>
