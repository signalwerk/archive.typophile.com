      <p>&gt; it allowed them to get more words on a page</p>
      <p>But -as I once tried to explain in my Daidala interview- narrow type isn't necessarily more economical; for the simple reason that you're losing apparent size in the process. Basically, it depends on the proportion of line breaks. Which is why Luce and Fournier called their narrow type "poetique": poetry -generally- breaks after every line, and that makes narrow type directly more economical.</p>
      <p>Also, I have actually heard an expert or two claim that the view that Aldus used italic type because it was narrow because he was making smaller books is ballony.</p>
