      <p>Well, Aldus did use italic types for text in his smaller format books, and used roman in the larger and grander productions like the <em>Hypnerotomachia,</em> but it would indeed be reductionist balloney to claim that the motivation was economical. Unfortunately, most of the other motivations ascribed to Aldus by print historians are also dubious, because the people making them are print historians and they've largely ignored the manuscript culture within which Aldus is producing his books.</p>
      <p>We shouldn't imagine that because Aldus is doing something that has not been done before <em>in type</em> that he is doing something that has not been done before. He is applying the conventions of formal book hand and cursive chancery hand usage that were well established in Italian humanist manuscript production. The formal book hand is used in larger format volumes, usually prestigious productions intended to be experienced as objects of beauty as well as texts to be read. The chancery hand is used in more quickly produced, smaller books or booklets whose function is to transmit the text in a plain and convenient format. I've seen dozens of both kinds of manuscript books. Aldus was simply applying the distinction that already existed in the new medium of type. Unfortunately, most commentators on printing history know very little about manuscript production, so credit Aldus with the invention of the small format pocketbook, rather than the adaptation of an existing model to the new technology and market.</p>
