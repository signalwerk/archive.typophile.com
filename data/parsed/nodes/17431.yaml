      <p>I am by no means an historian and have no developed theories nor have authoritative reference material to back it up, but it seems that even in the earliest of comparisons between Roman (inscription based) and italics (cursives) that indeed italics seem not only more fluid but facilitate reading.<br><img src="/sites/default/files/old-images/arrighi_italics.png"><em>Arrighi's letterfoms</em></p>
      <p>It may (and I emphasize 'may') be that informal penned forms were originally the most common expression of individual written communication (handwriting). Since most literate individuals can quickly write and decipher the majority of other peoples' handwriting, we may have developed a mental facility for decripting diverse and variable script forms. </p>
      <p><img src="/sites/default/files/old-images/coornhert_incunab2.png"><a href="http://www.psymon.com/koster/coornhert.html" target="new"><em>Officia Ciceronis</em>(1561)</a></p>
      <p>Even in the poor reproduction above, to me it seems easier to read the italics.</p>
      <p>Since most italic typefaces remain faithful to the earliest of typeface designs, and since the earliest of italics approximated Chancery scripts, the visual link back to human written forms remain.</p>
