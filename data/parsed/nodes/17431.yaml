      <p><em>What Jenson and Griffo and Garamond figured out was, I think, how to make type *more* readable than written letters.</em></p>
      <p>But they were building on top of a distinction that had already been made, between formal book hands and running chancery hands, and which already exhibited different levels of readability. The key distinction, in the manuscript tradition, is of speed: the formal book hand is written slowly, without returning strokes, and tends to be more regular and less compressed. The running hand is faster, and with this comes slant and compression. What is interesting is that development of the less readable italic type followed that of the more readable roman, and was very popular both with printers -- since it allowed them to get more words on a page -- and with the reading public.</p>
      <p>Robert Bringhurst made the observation, during his keynote address at the ATypI conference in Vancouver, that at the time we are talking about everyone who was a reader was also a writer (usually in both sense of the word), and so recognised letterforms not only as a consumer but as a maker. This is similar to the point Norbert is making, I think. To know forms manually, through the regular making of them, may contribute to facility in cognitive recognition. So while italics may never have been more readable than romans, I have no trouble with the notion that italics may have been more readable for renaissance readers than they are for us.</p>
