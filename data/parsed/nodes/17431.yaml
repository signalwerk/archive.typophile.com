      <p>Actually, I think the opposite is true. To me the Roman reads much better than the italic.<br>
      I interpreted Williams question to be about the readability of italics among themselves, not so much compared to their upright counterparts.</p>
      <p>To me, the main issue with Italics is that they have sufficient separability from the upright to be noticeable without being alarmingly different in color. Since it is rare to see long passages of italic text, readability issues (tiring of the readers eyes) are not very relevant. What is sometimes done to create separation from roman is to slightly condense the italic yet lighten the weight a bit to counterbalance the color change. As Adam mentioned the Sabon went the other direction but was still handled quite well. It isn't so much how you do it as how well you do it.</p>
      <p>ChrisL</p>
