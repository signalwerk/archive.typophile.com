      <p>William, I apologize ahead of time if this doesn't follow the original intent of your topic, but I've thought more about the cognitive relationship between italics and handwriting.</p>
      <p>Up until recently, handwriting was an individual's most common means of informal communications and also the most practiced. Thoughts and feelings translated by one's mind through manual activity into visual notations that are then fed back through the eye for mental confirmation must have some benefit in one's ability to read script(my personal musing with no facts).</p>
      <p>Now all daily written communication (business and personal) is done by keyboard or phone keypad, with less time writing with pen or pencil. Eventually our facility for written communication will be heavily screen and typing based. In time reading and writing handwritten scripts will become less common and more difficult.</p>
      <p>Whether or not that might have any bearing on our ability to read italics is yet to be seen, that is of course, if there's any correlation at all between the ability to handwrite and the recognition of script forms.</p>
      <p>On a personal note, for decades, I hand print my notes and letters much faster and more legibly using roman letters. My own handwriting has deteriorated and is slower for me to do than writing block letters within the past ten years. I would also say that at least 70% of my daily reading is done on screen, and maybe less than 2% of what I read is someone else's personal handwriting.</p>
      <p>I bring these thoughts up as just an awareness that may or may not have an affect on how the majority of us read and write. If it does, then that will affect how, why and what new typefaces are designed for... roman, italics, scripts, et al.</p>
      <p>Signing off... no more off-topic intrusions.</p>
