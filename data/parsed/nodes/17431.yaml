      <p>I think Oneleigh and Adobe Jenson are much different in principle. Compare the a and c in the two faces. The stress in the a and c in Adobe Jenson--based on the calligraphic italic of Arrighi--is the same, with just some variation due to the width of the a. In Oneleigh the stress on the a and c seem to me to be quite different. The more uneven stress in Oneleigh is one contributor to the quirky feeling. </p>
