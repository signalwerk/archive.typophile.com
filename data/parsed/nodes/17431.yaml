      <p>Thanks, Karsten, I now see what you mean--and I do think this might contribute to the success of the Adobe Jenson italic. Nicely observed. </p>
      <p>These features are a part of the very clever way Slimbach handles the extremes of the strokes as they reverse themselves. This way he is able to introduce a lot of 'flare' to the strokes, which is part of the overall look of the italics, and which gives them a lot of energy but keeps them readable. The roman of Adobe Jenson has a lot of flare in the stems also, so it also unites the look, even though the models from the roman and italic are from different people. </p>
      <p>I see that Centaur's italic doesn't have the flare, so perhaps this is Slimbach's innovation. Impressive!</p>
