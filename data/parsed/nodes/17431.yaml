      <p>I would tend to agree with Paul and Adam, and taking it slightly further I would say that in most cases, what makes a legible roman makes a legible italic, for example: simple terminals, wide apertures, a reasonably large x-height, etc.</p>
      <p>Something you probably wouldn't expect (and which some may disagree with me about) is that swashier caps (within reason) tend to <em>improve</em> legibility! I think this is mainly because it's an indication that the caps were designed to fit with the italic, as opposed to being ripped from the roman and skewed.</p>
