      <p>When I wrote that "m n r stems are leftside curves while i or t stems are rightside curves," reference is neither to serifs nor to overall slant, but to the form/shape of the stems themselves:<br>
      -- with n m r, vertical stems are like this: )<br>
      -- with i t u, vertical stems are like this: (</p>
      <p>"I think Oneleigh and Adobe Jenson are much different in principle. Compare the a and c in the two faces. The stress in the a and c [...]"</p>
      <p>When using the word "principle" I didn't appeal to stress but to the square-trick in which respect they share a lot. When talking about stress however, you are definitely right. Btw, Oneleigh is very "Goudy" as regards stress! This kind of stress is Goudy type design humor at its best.</p>
      <p>hhp:<br>
      "fits into a square" -- "And you think this helps readability? I don’t."</p>
      <p>There is no direct link between fitting-into-a-square and readability. In my post I made two sections, (1) describes what I mean by "compactness", and (2) mentions that *some* effects of trying to keep letters compact (like different slants) enhance readability (for which I gave my then-definition).<br>
      The square-trick just makes type designer's job easier. We may not cut letters into lead blocks any more, but even with the latest and most advanced technology, the basics have not changed: Each letter is placed in a box with leftside and rightside flesh, and if you find that a particular pair would need special adjustment, you kern it. But: Kerning = hard work. So: If you have a chance to avoid it, do it. ;-)</p>
      <p>About irregularity and readability. In his text about Today Sans Serif, Albert-Jan Pool made an interesting remark: "It [Today] looked so irregular, with each character featuring its own peculiarities. To my eyes it was sparkling with detail in all of its elements. It was one big idiosyncrasy. I showed him [Volker Kuester] my design and told him that I was striving for evenness and harmony by repeating as many forms as possible. Volker explained to me that he was doing exactly the opposite in order to achieve the same goal. This was how I started to get a visual grip on the interaction of readability and legibility [...]" In Robert Norton: "Types Best Remembered," Parsimony Press 1993.</p>
      <p>"But if you’re saying that we’re agreeing completely, needless to say I don’t see that at all."</p>
      <p>Never mind.</p>
