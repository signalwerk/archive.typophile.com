      <p>hhp:<br>
      I don't get your point. You are argueing as if you want to counter me, but what you say actually supports me.</p>
      <p>KL -- "keep letterforms as compact as possible and avoid elements extending too far"<br>
      hhp -- "This is anti-readability."<br>
      KL -- "make it LOOK vivid and irregular."<br>
      hhp -- "This is artificial and not inherently supportive of readability."</p>
      <p>Too quick. Let me illustrate what I mean. Nick's Oneleigh Italic, at <a href="http://www.shinntype.com" target="new">www.shinntype.com</a> (left column, 4th from bottom), is a really good example. It combines both aspects:<br>
      (1) Letterforms are very compact. By "compact" I mean things like: Hooks at n m i are rather small, so the n or m fits into a square. p descender slant is very steep. f is anything but swashy which avoids collision. (If you [hhp] like it more swashy, it's no problem to do this by calt where the surrounding letter allow it.) The t horizontal bar is short towards the right side, so keeping it withing the square, but it doesn't hurt. The k bottom finial extends below the baseline, this again keeps the entire form within a square and avoids possible white space (and thus kerning) rightside. The g's lower bowl does not extend much either. &amp;c.<br>
      (2) Nevertheless -- maybe because of this -- the type looks very quirky. Which I find *enhances readability* (let me define: eases recognition of word images). Like, it is easy to make out p's alone by the different descender slant, the s by its movement to the left (again to fit the square, obviously), the k by descending below the baseline. &amp;c. There is nothing "artificial" about it and can be fully accounted for by reason. ;-)</p>
      <p>Nick Shinn:<br>
      "Whaddaya want, the Mickey D of typefaces?"</p>
      <p>:) Readable, legible ... there's a distinction, but in English terminology I don't know which is which. </p>
      <p>Karsten</p>
