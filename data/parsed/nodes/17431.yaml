    <p>John Berry <a href="http://www.creativepro.com/story/feature/21312.html">notes</a> that Mark van Bronkhorst's <a href="/node/add/wiki?edit%5Btitle%5D=old%20style" title="Create node &quot;old style&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">old style</a> <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italic</a> for his typeface Verdigris is exceptionally <a href="/node/19563" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">readable</a>. <a href="http://store.adobe.com/type/browser/F/MINP/F_MINP-10005310.html">Minion's italic</a> is also quite successful in this respect, I think. </p>
    <p>I would be interested in people's views on what makes for a readable italic. For example, old style italics tend to have a great variety of different slants to the letters. Does making them more uniform help readability, or not? Do wider letters help? Handling of <a href="/node/14546" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Contrast</a>? Smaller or bigger 'serifs'?</p>
    <p>I understand that often there is a desire to have the italic 'dance' more than the roman, and accept some lesser readibility for the sake of emphasis or decorative force. Still, within these constraints, how do people view the problem? </p>
    <p>Also discussions of italics seem to be very rare, compared to discussions of romans. Any good references?</p>
