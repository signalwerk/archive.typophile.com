    <p>I would be interested in people's views on what makes for a readable italic. For example, old style italics tend to have a great variety of different slants to the letters. Does making them more uniform help readability, or not? Do wider letters help? Handling of <a href="/node/14546/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Contrast</a>? Smaller or bigger 'serifs'?</p>
    <p>I understand that often there is a desire to have the italic 'dance' more than the roman, and accept some lesser readibility for the sake of emphasis or decorative force. Still, within these constraints, how do people view the problem? </p>
