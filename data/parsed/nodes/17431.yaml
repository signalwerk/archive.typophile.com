      <p>I always try to avoid the psychological aspect. Comparing readability of fraktur vs roman may be easy though -- I would not consider a type readable if readers have to guess first whether a form represents an A or U, or an S or G, or a long-s or f. Comparing readability of two serif typefaces may be a bit more difficile; the measure today is reading speed, which includes questions like, we filmed his eye movement and made sure he viewed all text, but did he understand it? So it even touches the meaning of "reading." (I know, this is also covered by text related questions to be answered.) But my point is, if by tests we find out about reading speed, do we get to know MORE than this fact, more than information about reading speed related to texts set in a certain typeface (in a certain size, with certain leading, spacing, printed in a certain color -- black is not the same as black --, by a certain printing method, on a certain paper, of a certain texture, and color &amp;c)? Similarly, what does it mean if the outcome of such a reading test is that "black on white is more readable than blue on yellow"? Which blue, which yellow, what were the lightning conditions, or the atmosphere in the room? You can make everything look scientific by systematizing factors and eliminating others. But which factors are important and which aren't? My point is, by the sole fact that a typefaces is "read" a higher speed, which inferences may we draw, and what would be over-interpretation?</p>
      <p>But, after Bill's last clarifications, this turns out to be off-topic musing.</p>
