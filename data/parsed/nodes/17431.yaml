      <p>But the National Geographic Caption typeface was never intended to be a companion to a roman in the sense that the regular italic type was. It is an example of an italic designed to be used alone, and also at a smaller size than the regular types.</p>
      <p>My Constantia italic is another example of a wide italic, proportionally similar to the roman and, generally, setting only slightly shorter than the same text in the roman. In this case, of course, the aim was not general readability but specific readability in the context of ClearType screen rendering. In that case is it slightly lighter than the roman, and intended to be a companion to it and not a stand alone italic type.</p>
