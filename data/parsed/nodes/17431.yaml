      <p><em>But this nicely indicates that whether roman, italic, blackletter are <strong>regarded</strong> as being more readable is a matter of habitualization rather than any form per se being more readable.</em> [My emphasis]</p>
      <p>Karsten is right that what people <em>regard</em> as more readable isn't necessarily related to whether that form is actually more readable. I'm not sure that this is the point that Karsten was intending to make, and other respondents seem to have assumed that he meant something else, but that word 'regarded' is key. In determining whether one form of lettering is actually more readable than another, one needs to compare speed and accuracy test results for competent and habitual readers of either form. Obviously if someone had spent his whole life reading fraktur and is suddenly presented with roman type, he is likely to find the latter more difficult to read. But it is an error to presume from this experience that fraktur is per se more readable than roman.</p>
      <p>As I wrote above, I have little doubt that renaissance readers found italic text to be easier to read than we find it, but that is an entirely different question from whether they actually found it to be as easy to read as roman. And that in turn is a different question from which they <em>regarded</em> as easier to read. I might regard typeface X as more readable than typeface Y, but until I do a comparative test of reading speed and accuracy for both types, I have to accept that my perception may be incorrect.</p>
