      <p>Readability and contrast-with-Roman are necessarily strongly opposed, for the simple reason that -hopefully- the Roman is the one made highly readable! That said, the dimension of difference that might least impede readability in an italic is color. So I think the "best" general italic is one with slight slant, a little bit of compression, maybe slightly smaller on the body, and visibly lighter in color. Also, to prevent it from skewing the "voice" of the Roman in an arbitrarily fluid/casual direction, the "ideal" italic is structurally quite close to the Roman. Hmmm, Harrier anyone?  :-)</p>
      <p><a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a></p>
      <p>BUT: Since an italic <cite>is</cite> generally for subordinate snippets, its readability requirements are on the order of display types (ie not very great). Just as long as errant fixations are not triggered though.</p>
      <p>hhp</p>
