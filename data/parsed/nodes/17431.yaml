      <p>Legibility: "the ease with which one letter can be told from the other".<br>
      Readability: "the ease with which the eye can absorb the message and move along the line."</p>
      <p>p. 85, Types of Typefaces, by J. Ben Lieberman, 1967. This page also has pictures of Beatrice Warde of Monotype and Paul A. Bennet of Linotype, to whom the book is dedicated. I suspect the distinction of legibility and readablity at least goes back to them.</p>
      <p>So I think Karsten, you mean 'legibility'.  </p>
      <p>Oneleigh has its charm, but I do think readability is compromised. In the accompanying note on the face, Nick says that the italic is influenced by Goudy's 'Companion' typeface. Looking at Companion in Mac McGrew's book, the stress is more regular, but the strokes less 'within the box'. For example the k descends more below the basline, and to the right, requiring kerning. Oneleigh follows other Goudy italics in the rounded shoulders that Karsten points out. I would put Companion higher on 'readability,' though neither face is really aiming for that as a priority. </p>
      <p>The challenge I am interested in here is how to achieve both expressiveness, which I think is to an extent desirable even in a text italic, and readability.</p>
      <p>Adobe Jenson has a great variety of slopes in the italic, but to me is more balanced and even in color than Oneleigh. The quirky look of Oneleigh is no doubt a deliberate goal of Nick, but here I am interested in how Slimbach pulls off the even color inspite of the variety of slants. It does have a *lot* of kerning, which you could say is "cheating" with a revival of a metal face, but the resulting look is great, which for me justifies it. </p>
      <p>Incidentally, by contrast, the italic of 'Goodchild,' Nick's Jenson-inspired font, is much more regular. Nick says he wanted to get away from the usually more calligraphic look of Jenson revivals. Also he gives it a large x height, so it is a different animal--more modern, as he says.</p>
