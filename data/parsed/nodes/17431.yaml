      <p>Verdigris Italic has quite open counters, especially in the h m n u -- their shoulders are not the typical sharp angles but round. This can already be found in the italics of Goudy's Truesdell and Village. It looks like Goudy adopted a form of shoulders which he first employed in his Mediaeval. Personally I like this trick because it allows to keep letterforms narrow.</p>
      <p>"I don’t really buy that italic was ever as readable as Aldus’s Roman. ... I forget where I read that the most readable is lower case serif type, and whenever you depart from it it slows the reader down. I believe it."</p>
      <p>No talk about textur/fraktur goes without the obligatory Bismarck quote, that no type is more readable than fraktur (as opposed to roman type), which is to amuse the audience: Nobody would subscribe to this TODAY. But this nicely indicates that whether roman, italic, blackletter are regarded as being more readable is a matter of habitualisation rather than any form per se being more readable. Maybe we are already moving away from (serif) roman, towards sanserif, and in some decades nobody would question that sanserifs are "most readable," and who needs these disturbing serifs which are a mere reminiscence of another technique of producing letterforms.</p>
