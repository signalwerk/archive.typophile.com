    html: <p>Impressive in that it is a strong, distinctive design idea carried through consistently. I like the art deco look also. Once you have solved the mwz to your satisfaction, I think it would be worth experimenting with different widths of counters, stems and spacing, to see if you can improve legibility without losing the 'look'.  <br> <br>Since this will obviously be used only for short names and titles, such as the name of a restaurant, legibility is not the main thing, but still is always a consideration.  <br> <br>I think the v solution is clever, but you might try making it a bit wider. I agree with Dav on the need to polish the x and s. The top of the f I think is the only solution so far that needs to be changed. The notch at the top is distracting as it doesn't read 'f' right away.</p>
    html_clean: <p>Impressive in that it is a strong, distinctive design idea carried through consistently. I like the art deco look also. Once you have solved the mwz to your satisfaction, I think it would be worth experimenting with different widths of counters, stems and spacing, to see if you can improve legibility without losing the 'look'.  <br> <br>Since this will obviously be used only for short names and titles, such as the name of a restaurant, legibility is not the main thing, but still is always a consideration.  <br> <br>I think the v solution is clever, but you might try making it a bit wider. I agree with Dav on the need to polish the x and s. The top of the f I think is the only solution so far that needs to be changed. The notch at the top is distracting as it doesn't read 'f' right away.</p>
