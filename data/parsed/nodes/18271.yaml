    <p>Hello everyone,</p>
    <p>I was wondering if someone could help me. I used two different fonts for this invitation. I think one of them is “Poetica” (don’t know for sure) and the other? I made this by hand (cutting out the letters and sticking them onto another piece of paper and making a copy of that), so there is no electronic file left too look at. </p>
    <p>I want to make a new invitation using the same type, but I want to make it in Indesign at my school so if your looking at this and have an opinion about the (mis)use of these two fonts together feel free to comment.</p>
    <p>Thanks for reading any help greatly appreciated.</p>
