      <p>I don't see the advantage in doing what you are saying, Will. I assume you are not talking about creating a knock-off so how does it help? Why would you want to "correct" someone else's work? There is no short cut if you want to design an original face. Doing the work is part of the design and gives you knowledge. What would you learn from a Paint-by-Numbers set? Nothing but staying within the lines. If you are in a hurry to do a design of a typeface, then type design is not the best choice for a profession.<br>
      Have their been people who have borrowed bits and pieces of other's digital fonts to make their own? Probably so but my guess is that their results were not as good as the original.</p>
      <p>ChrisL</p>
