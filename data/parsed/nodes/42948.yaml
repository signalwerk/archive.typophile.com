    <p>I'm wondering, do any type designers out there (who are willing to fess up) decide to create a face with a lot of the same qualities of something pre-exisiting and use the pre-existing face as a template to start from. basic stroke width, height, general shape etc... is this taboo? do you think there are a lot of commercial types out there that were created in this manner? i love drawing a face from ground up but sometimes isn't it nice to improve on an existing model? I heard the typeface General was something like this. Based on Helvetica but with better spacing. thoughts?</p>
    <p>_will</p>
