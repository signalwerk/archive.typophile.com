      <p>Will, my 2 cents worth:<br>
      For me, designing type is about coming up with something that is of my own. I am more likely to avoid looking at other faces for ideas or ways of solving problems than seeing what the masters have done and following their ways. That is not to say that what I come up with will be better or even as good as what has been done in the past. I am just increasing the odds of it being my own ideas and solutions that surface. It may even be that I end up reinventing the wheel and doing what is tried and true over again. That does not bother me because the struggle I will have gone through will have taught me much more than just following existing models. I think looking at a type design problem in a naive way is healthy and enlightening. It may take longer to achieve a product and it may be frustrating at times but I still think it is the best approach for me. Will my results be truly innovative or noticeably "new"? Who knows. That is not my intention. Will my work become accepted by flocks of users? Probably no more chance of that than anything else being done. I am just casting my bread upon the waters and letting happen whatever happens. My way does not look like a sound business model so I don't advise it for those with a burning need for financial success. It is simply what I want to do right now.</p>
      <p>ChrisL</p>
