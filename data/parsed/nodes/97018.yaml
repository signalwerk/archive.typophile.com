  html: |-
    <p>We would like to share with the community the release of our lastest project called Neuron.</p>
    <p>Neuron is a fresh and modern sans-serif family with a neutral and soft appearance that make it very versatile. Its possibilities are increased not only by the inclusion of true italics but by the coverage of Latin, Central European and Cyrillic characters also. The italic variants have a slight cursive influence but keep their sleekness at the same time.</p>
    <p><img src="http://typophile.com/files/banderas_neuron2_behance.jpg"></p>
    <p>Best regards,<br>
    Sergio</p>
