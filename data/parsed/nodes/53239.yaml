    <p>If you are reading this you may as well be aware of me as a designer. <em>(Maybe also by one of my former aliases — Forma/formlos/...)</em> And as such I am currently looking for a new job/(paid)internship/placement. Wherever this may be — I am considering relocating. I previously focused quite heavily on brand development, corporate design and typography. Hmm, what else. I've been working in design for 10 years now, in Europe <em>(Austria, the UK, Italy)</em>. My past work has been featured in various design related publications. <em>(And — You may have seen <a href="http://for.ma/blog/?p=292" target="_blank" rel="nofollow">my 'Typophile T'</a> up there. ;)</em></p>
    <p>If you have any questions concerning me or my past and future work, let me know — <em>mail(at)davidhubner.com</em>. Thank you, Dav.</p>
    <p>— <a href="http://for.ma/dav/DavidHubner_CV.pdf" title="Dav(id Hubner), CV" target="_blank" rel="nofollow">Curriculum Vitæ</a> <em>(PDF)</em><br>
    — <a href="http://for.ma" title="Forma" target="_blank" rel="nofollow">Forma</a> <em>(Design)</em>, <a href="http://for.ma/formlos" title="formlos" target="_blank" rel="nofollow">formlos</a> <em>(Design/Type)<br>
    </em>— <a href="http://for.ma/folio/" title="Forma, Folio" target="_blank" rel="nofollow">Folio</a> <em>(Forma)</em>, <a href="http://for.ma/folio/fff/" title="Forma/formlos, Folio" target="_blank" rel="nofollow">Folio</a> <em>(Forma/formlos)</em></p>
    <p><em>Like what you see?</em><br>
    Hire me!</p>
