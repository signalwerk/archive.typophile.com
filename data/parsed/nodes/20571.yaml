    <p>Hey everyone! </p>
    <p>This is my first post, I hope you can help. </p>
    <p>I am looking for a typeface for the BURMA SHAVE logo. I know that it is most likely handlettered, and if so, can you suggest a very very similar font?</p>
    <p>Thanks so much.<img src="/sites/default/files/old-images/Burma-shave-logo_6460.jpg"></p>
