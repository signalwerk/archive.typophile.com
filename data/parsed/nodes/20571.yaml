      <p>The problem you will have trying to match it with a single font is that the lowercase is basically like a glyphic italic* with minor swash, and the cap B and S are both swash scripts.</p>
      <p>Take a look at a few of the script and italic faces on <a href="http://www.fontmesa.com/font_index.htm" target="new">FontMesa.com</a> and see if you like them (though the scripts are connected, the have the feel).</p>
      <p>*FYI -- "glyphic italic"<br>
      Nick Shinn's <a href="http://www.myfonts.com/fonts/shinn/beaufort/condensed-heavy-italic/" target="new">Beaufort Condensed Heavy Italic</a> has a similar "feel" in the lowercase, but a font is more precise and consistent than a handlettered sign.<br><img src="/sites/default/files/old-images/Beaufort_hvy-ital_4690.png"></p>
