    html: <p>Marcel Duchamp said "The only thing worse than a serif typeface is a sans-serif typeface," and invented Dingbats as a reaction to what he called "the tyranny of the alphabet." Other Dadaists, perhaps misinterpreting his comment, strived to create faces that were neither serif nor sans-serif, and among the styles to arise from these efforts were slabs and flares. This is recounted on p216 of <em>I Did Seek The Serif</em> by Egbert Gebbinforte, Harper-Mifflin Books, 1998.</p>
