      <p>One of my fondest memories of design school at Carnegie Mellon was hearing Dick Beaman, my art history professor, recite by heart (and with great gusto) a DaDa poem in a lecture hall filled with 19 year olds. Dick was a grey-haired man with middle aged paunch and looked more like an accountant than a painter. He had a very subtle humor which took some time to sink in for most students. His loud, screaming presentation of the DaDa poem well exceeded his usual mild inflectioned presentation. At that moment, all who had yet to "get him" quickly "got him".</p>
      <p><a href="http://306.exeter.edu/publications/exeter/alumni_profiles/beaman_28.htm">http://306.exeter.edu/publications/exeter/alumni_profiles/beaman_28.htm</a></p>
      <p>ChrisL</p>
