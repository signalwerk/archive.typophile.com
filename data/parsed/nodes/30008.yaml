    html: |-
      <p>Sans-serif type got respect after Dada, not from it. Dada (along with other things) made rule-breaking much more acceptable (at least in the art world), and probably inspired some of the appearance of sans type in areas other than the commercial jobs where it was seen before. But what really brought out sans type was the work done at the Meisterschule and the Bauhaus, which became an international phenomenon after the publication of Tschichold's <em>The New Typography</em>. </p>
      <p>Style movements are related to the attitudes and needs of a society, and as we understand them they are constructs of historians who create  terminology that eases discussion. It's important to keep that in mind because there are a lot of styles that get lumped together (ie. arts and crafts, art nouveau, and jungendstil) and in-between periods that get lost in the cracks.  Going much deeper than that is the sort of thing that could fill up an entire graduate education.</p>
