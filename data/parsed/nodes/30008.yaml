      <p>I am still incredulous and very skeptical that these (anti)artists actually randomly chose the word dada. But that's just me. That there was a Dada exhibit in Paris and NYC goes against the grain of the spirit of Dada. But even this is too codifying for a process that attempted to take the rug out of the rug that someone is standing on. </p>
      <p>So to ask what typefaces the Dada people used is absolutely absurd (but not absurd like the dada way, whatever that may be).</p>
