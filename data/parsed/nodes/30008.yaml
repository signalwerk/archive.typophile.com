      <p>In 1969 I won the Art prize at school. The arrangement was that you went to the bookstore and chose the book you'd like, and then it was delivered to the school, who put the appropriate label in it, and stamped the school crest on the cover in gold foil. This was thought out in the days when cloth covers were the norm, so it was a shock at first to receive my prize from the headmaster and see the crest disrespectfully slapped onto the Hans Arp work shown on the cover. But really, was that brilliant or what?!</p>
      <p><img src="/sites/default/files/old-images/Dad_4990.jpg"></p>
