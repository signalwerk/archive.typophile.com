      <p>MissG I would recommend Lewis Blackwell's <a href="http://www.amazon.com/20Th-Century-Type-Remix-Lewis-Blackwell/dp/392725889X/sr=1-6/qid=1165814529/ref=sr_1_6/104-0486363-1791103?ie=UTF8&amp;s=books" class="link-external">20th Century Type:remix</a> to you for an overview of the relationship between various art movements &amp; typographic design in the last 100 years. It should be in your college library. It has some dada imagery, but this thread is already visually richer than many books I know of.</p>
