  html: <p>During Dadaism, what kind of typography was used? I know for a fact that because of the war, everyone was very much against it and started desining outrageous things so does that mean that san serif came to be when designers took off the serifs of Roman influenced lettering? Is that the cause of it and is that how Bauhaus took san serif a step further? where does slab serif come into all this though? And during the 20th century, we see a variety of movements fron Art Deco to Art Noveau to the hippy 70's style type. Is this because society's attitudes changed towards lifestyles etc that everything stated having 'styles-movements' to them? Is it because people wanted to see new innovative things that made designers experiment more with type? what is your theory?</p>
