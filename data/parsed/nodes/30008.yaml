      <p>Kurt Schwitters also designed a 'Systemschrift' (a typeface designed in a systematic way as to represent sounds) in three different variants, but it was never produced as a typeface then. Schwitters just used it in some of his posters and he published an article in the Dutch avantgarde magazine 'i10' about his proposal of this typeface.</p>
      <p>The article (with some illustrations of his proposal for this typeface) is reprinted in Kurt &nbsp;Schwitters: Das literarische Werk. Book 5 ('Manifeste und kritische Prosa') edited by Friedhelm Lach. (1998) Köln. DuMont Verlag<br>
      (unfortunately only in German)</p>
      <p>One of the three variants of his Systemschrift was published as a digital typeface by The Foundry several years ago. You can find it on:<br><a href="http://www.foundrytypes.co.uk">http://www.foundrytypes.co.uk</a></p>
      <p>Go to 'Foundry typefaces' and to 'Architype collection 2'</p>
      <p>One of Schwitters theories for his typeface was that since vowels are pronounced longer and stronger than consonants the letters for vowels should be broader and bolder than the letters for consonants. Also the vouwels are therefore round and the consonants are (rect)angular.</p>
