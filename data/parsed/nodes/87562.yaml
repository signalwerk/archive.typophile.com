    <p>Hello people,</p>
    <p>Something very simple has been bothering me for a while now. The Grade for loq quality printing is usually the thickest (darkest). As far as I know, ink will spread more on low quality print/paper than high quality print/paper, and thus type will look darker on low quality print/paper. To compensate for this spreading, doesn't it make much more sense to make everything THINNER (LIGHTER)?</p>
    <p>I am sure there's a logical explenation for it, but I just don't get it. The inktraps make sense, because they compensate for the higher degree of spreading ink. Making everything darker, however, doesn't make much sense to me.</p>
    <p>Cheers,<br>
    Jasper</p>
