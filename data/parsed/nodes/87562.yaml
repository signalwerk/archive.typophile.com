      <p>Interesting question, Jasper. It would be useful to have more info about it.</p>
      <p>AFAIK, grades are not used just in view of printing quality. Example: text over a yellow background would be clearer if set with a slight darker grade, while over a soft gray background a lighter grade may be the best option. Another possibility is to combine bold from a lighter grade inside texts with a darker bold in titles –to enforce an overall even type colour.</p>
      <p>Considering the way many contemporary fonts are built (in order to keep legibility under unfavourable conditions) I thought grades for low quality printing would be subtly changed in two aspects: reduced contrast and weight.</p>
      <p>The first change avoids excessive variations that can result from low print quality. In an extreme scenario, thin parts tends to be supressed while the thicker ones tend to be bolder. With less contrast, this effect is reduced –again, due to a more even type colour. The second change ensures thin elements will keep expressiveness. But the thicker change may not be overdone or it will cause the problem you noted.</p>
      <p>Althought these two changes are present is some fonts (Mercury, Chronicle), in other the grades are just thicker (Greta, Quiosco, The Serif). So, it seems there is another element to be considered when producing grades.</p>
