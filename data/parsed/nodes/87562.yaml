      <p><cite>Is this 'vanashing thins' effect still an issue today?</cite></p>
      <p>Surely. There are many printed materials still suffering with this. Cheap softcover pocket books and small newspapers are usual examples. And an outdated printing technology is a typical low quality printing situation.</p>
      <p>The newspaper you refer seems not to fit the low quality category.</p>
