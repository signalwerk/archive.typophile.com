      <p><cite> &gt; The Grade for lo[w] quality printing is usually the thickest (darkest).</cite></p>
      <p>I’m not sure where you get this from. Perhaps you are conflating several different concepts in your use of the term “grades.”</p>
      <p>The way the term is applied to fonts aimed at newspapers, it usually refers to a range of “weights” (not really weights, per se — hence the specific term “grade”) encompassing both lighter and darker variations. The whole point of a graded series is to be able to select the variation that best suits one’s printing environment. </p>
      <p>In some cases, one part of a newspaper might be more heavily inked and benefit from a lighter grade, while another part of the paper might be printed on a higher quality paper (like a photo-heavy insert) and warrant a medium grade. The purpose, in these situations, is to be able to select different grades for different printing conditions so that the overall effect is one of consistency.</p>
      <p>Here’s some of the marketing text from Font Bureau’s Readability Series PDF:</p>
      <p>“Font Bureau has prepared four closely-spaced grades tuned to the variety of performance to be expected from a range of platemaking technologies and presses. Newspapers using transitional or hybrid output methods should really benefit from use of these fonts. A paper that prints feature or advance pages directly to negatives might do so with one version of the font, while choosing a lighter version for pages that go through paste-up (which typically increases dot gain and weight of the type). Text can be freely moved from section to section without affecting copyfit, since all weights are designed on a single set of character widths. Properly used, these fonts guarantee a consistent quality of text reproduction from front to back. Papers using only one production method still benefit from the grades, as they can choose the weight best matching their inking.”</p>
      <p>Hoefler &amp; Frere-Jones speak similarly about their graded series:<br>
      <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100017" title="http://www.typography.com/fonts/font_overview.php?productLineID=100017">http://www.typography.com/fonts/font_overview.php?productLineID=100017</a><br>
      <a href="http://www.typography.com/ask/recentTopic.php?rtID=89" title="http://www.typography.com/ask/recentTopic.php?rtID=89">http://www.typography.com/ask/recentTopic.php?rtID=89</a></p>
      <p>Now, if you’re using the term “grade” to refer to different size-specific (so-called “optical”) variants, then the slight weight difference has nothing to do with targeting different printing environments. The fact of the matter is that generally when you have the same typeface reproduced at different sizes, the smaller sizes will tend to appear optically lighter than the larger sizes. </p>
      <p>To compensate for this, a size-specific design for smaller sizes will generally have a slightly heavier stem weight compared to a larger variant of the same style. </p>
      <p>Of course, stem weight is only one of the adjustments that might be made between size-specific variants. And, as you correctly surmised, if the type is intended for a printing environment with heavy ink gain, then in fact the stem weight on a smaller size might not need to be heavier. With heavy inking, the gain will be proportionally larger for a smaller size type and so, in fact, a lighter stem may be called for under certain circumstances. But these circumstances are fewer and fewer as offset printing quality seems to only get better.</p>
      <p>When you’re talking about grades, there are many interrelating factors and it’s difficult to make blanket statements.</p>
