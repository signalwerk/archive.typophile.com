      <p>Hi Adrian - what version of MS Word are you using?</p>
      <p>The preview edition of MS Word in Office 2010 (for Windows) introduces support for a few OpenType typographic features, including stylistic alternates.</p>
      <p>Unfortunately you won't find this support in older versions of Office for Windows, or in the Mac Office 2008 version.</p>
      <p>All the best,</p>
      <p>Bill Davis</p>
