    html: |-
      <p>Yes. Use the feature clig (contextual ligatures). For a beginning or end of word it helps to use a lookup along with classes for letters.</p>
      <p>Example:</p>
      <p>@Letters = all letters except space</p>
      <p>   feature clig {<br>
         lookup clig_dsend {<br>
         ignore sub d' s' @Letters;<br>
         sub d' s' space by d_s.end;<br>
         } clig_dsend;</p>
