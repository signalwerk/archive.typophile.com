      <p>Hello all, my first post here.<br>
      Having created a 'salt' feature for Stylistic Alternates in my OT-PS fonts with FontLab,<br>
      I find that MS-Word cannot see them.<br>
      In Word, RIGHT-CLICK on text, select FONT &gt; ADVANCED &gt; STYLISTIC SETS: 'Default' appears.<br>
      Clicking on this drop-down reveals Set 1, Set 2 Set 3 etc.<br>
      So how does 'Set 1' relate to a feature in the OT font table?<br>
      Should the 'salt' feature be linked in some way to ''Set 1'?<br>
      FontLab forum offers now clue, nor does anything I can find on the net.</p>
      <p>I note that some designers are using Stylistic sets to address different page layout apps like Illustrator, XPress, InDesign. Set 1 for Ill/InDes, Set 2 for XPress etc.</p>
      <p>Thanks for any insight,<br>
      Adrian</p>
