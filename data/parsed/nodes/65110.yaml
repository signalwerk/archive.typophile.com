    html: |-
      <p>Some would consider what follows a hack, but if Word only supports stylistic sets . . .</p>
      <p>Put the same substitutions you have in your salt feature in a Stylistic Set feature, say SS01. You can have both salt and SS features with the same substitutions.</p>
      <p>(I believe FontLab has an example of the exact syntax for Stylistic sets ... it is not hard to write.)</p>
      <p>Recompile, write off, (purge older version of the font) and and turn on SS01 in Word.</p>
