    <p>I’m looking for an invite to sign up on this site, and I don’t know of anyone registered already off-hand so I figured I’d ask around on the graphic-related forums that I frequent.</p>
    <p>For those of you who have no idea what I’m babbling about, here is what <a href="http://ffffound.com"><strong>FFFFOUND!</strong></a> is about...</p>
    <dl>
    <dt></dt>
    <dd><a href="http://ffffound.com">	<strong>FFFFOUND!</strong></a> is a web service that not only allows the users to post and share their favorite images found on the web, but also dynamically recommends each user’s tastes and interests for an inspirational image-bookmarking experience!!</dd>
    </dl>
    <p><em>Examples of tagged images:</em>
    </p><ul>
    <li><a href="http://objectsinspaceandtime.com/~/fish/sb/shit/tipsfordesignerswhowanttobeffffound00.gif"><strong> Image A</strong> </a></li>
    <li><a href="www.slanted.de/images/lisa01.jpg"><strong>Image B</strong></a></li>
    </ul>
    <p>Anyway...check it out, if you haven’t already. I would be most appreciative to anyone willing &amp; able to give me an invite!</p>
    <p>Thanks,<br>
    Amanda</p>
