    <p>I've just been handed an important piece of work generated elsewhere which extensively uses Bodoni throughout web and app implementation. Before I throw my toys out of the pram I'd like to go in with an alternative slab that reads well at all sizes in the digital sphere. Any suggestions/advice would be greatly appreciated.<br>
    Thankin' you in advance<br>
    Marco</p>
