      <p>You could try Monotype's <a class="freelinking external" href="http://www.fonts.com/font/monotype/amasis-etext" rel="nofollow">eText version of Amasis</a>.</p>
      <p><a class="freelinking external" href="http://www.webtype.com/font/gizare-family/" rel="nofollow">Giza RE</a> and <a class="freelinking external" href="http://www.webtype.com/font/ibisre-family/" rel="nofollow">Ibis RE</a> from Font Bureau's <cite>Reading Edge</cite> collection could work very well.</p>
      <p>Nick Shinn's <a class="freelinking external" href="http://www.myfonts.com/fonts/shinn/bodoni-egyptian-pro/webfont_preview.html" rel="nofollow">Bodoni Egyptian Pro</a> also looks really good at small sizes.</p>
