  html: <p>I need to design a novel. It’s hardboiled detective fiction, contemporary, with a strong nostalgic tinge but not retro in way that’s arch or jokey. It is also a bit quirky, not straight-ahead tough guy standard fare. Literary. I want something strong and lean but with that hint of suppleness even whimsy. I am looking at Filosofia but see that people have their doubts about it as a text face, though using InDesign it looks pretty good.</p>
  html_clean: <p>I need to design a novel. It’s hardboiled detective fiction, contemporary, with a strong nostalgic tinge but not retro in way that’s arch or jokey. It is also a bit quirky, not straight-ahead tough guy standard fare. Literary. I want something strong and lean but with that hint of suppleness even whimsy. I am looking at Filosofia but see that people have their doubts about it as a text face, though using InDesign it looks pretty good.</p>
