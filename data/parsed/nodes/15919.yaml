    html: <p>Just a personal take on this, but both Filosofia and Zocalo seem a little pinched to me for hard-boiled detective fiction. I think of that genre as looser than that, and I would look at wider faces with a smaller number of characters per pica. And I would stay away from faces that have a big thick/thin contrast (these hard-boiled guys are heavy, right?). Sorry I don’t have a specific suggestion (something like a Caslon maybe?).</p>
