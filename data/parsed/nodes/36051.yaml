    <p>Hello all, just a note to let you know that the Helvetica film DVD is now available for pre-order. More info here: <a href="http://www.helveticafilm.com/shop.html" title="http://www.helveticafilm.com/shop.html">http://www.helveticafilm.com/shop.html</a></p>
    <p>The DVD includes 95 minutes of bonus material... we basically edited 41 short interview segments, each around two to five minutes long. If you've seen the film, you'll have an idea of the format of these. </p>
    <p>We'll definitely post Quicktimes of several of them in the next few weeks... any requests?</p>
    <p>Cheers,</p>
    <p>-Gary</p>
    <p><strong>Helvetica DVD Bonus Features:</strong></p>
    <p>Massimo Vignelli:<br>
    On his introduction to graphic design<br>
    The 1972 New York Subway map<br>
    Post-modernists and the “flower children”</p>
    <p>Wim Crouwel:<br>
    His “Proposal for a New Alphabet”<br>
    Pencil vs. Mouse<br>
    The audience for good design</p>
    <p>Matthew Carter:<br>
    How technology has affected type design<br>
    The Neue Haas Grotesk specimen book<br>
    On the reader’s awareness of typefaces</p>
    <p>Mike Parker:<br>
    On Helvetica and Jackson Burke</p>
    <p>Otmar Hoefer and Bruno Steinert on how they got involved in type</p>
    <p>Bruno Steinert on Helvetica and the Macintosh</p>
    <p>Hermann Zapf:<br>
    On his career<br>
    Thoughts on Helvetica</p>
    <p>Hoefler and Frere-Jones:<br>
    Font stories<br>
    Their specimen book collection<br>
    The Gotham project</p>
    <p>Erik Spiekermann:<br>
    Typomaniac<br>
    My favorite letter is…<br>
    His approach to design<br>
    On Arial…</p>
    <p>Neville Brody:<br>
    The Face and Arena<br>
    The role of typography in advertising</p>
    <p>Michael Bierut:<br>
    On Helvetica and branding</p>
    <p>Paula Scher:<br>
    The “mean” Modernists<br>
    Technology and her design process<br>
    On record cover design</p>
    <p>Stefan Sagmeister:<br>
    On music packaging<br>
    One typeface is not enough<br>
    On designing for an audience</p>
    <p>David Carson:<br>
    His approach to design<br>
    Thoughts on Helvetica</p>
    <p>Danny van den Dungen:<br>
    The origin of the name Experimental Jetset<br>
    The relationship between designer and subject matter<br>
    On punk rock and Modernism</p>
    <p>Michael C. Place:<br>
    The value of good design<br>
    On the public’s awareness of graphic design<br>
    Brockmann gets in the picture</p>
    <p>Norm:<br>
    The Simple typeface<br>
    Favorite letters</p>
    <p>Rick Poynor:<br>
    The future...</p>
