      <p>I often read people that don't like helvetica and oppose univers to it, just saying it's so much better. For me, this is the result of a misunderstood of modernism and what swiss designers where trying to achieve at this time, and still. There has already been a long talk here about helvetica and i don't want to start the fight again :)</p>
      <p>What is really really interesting  about a Frutiger interview is that he could help people to understand what modernism was looking for. For me, one of the most interesting thing (i think it's in the movie his son made) is the comparison with water. The look for the purity of the form is an essential idea in modernism. With helvetica this purity has been sold as neutrality, meaning you can use it for anything what, i agree, is wrong. But helvetica and univers (and most of frutiger faces) achieve to reach this purity, this "universality" of the shape, each by different ways. I like both.</p>
      <p>Edit: okay Gary, thanks for the explanation. My point was absolutely not to say something was missing or incorrect in your movie and i hope you did not feel it this way.</p>
