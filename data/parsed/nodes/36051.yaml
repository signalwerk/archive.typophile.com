    html: |-
      <p>@Stewf:<br>
      "Hmm, I beg to differ. Carson’s was the only segment that could have been left out of an otherwise perfect set of interviews."</p>
      <p>Carson looking at that set of index cards with words on them was very good, I thought. It really showed the opposite end of the spectrum advocated by Wim Crouwel or Vignelli, as represented by Helvetica. It was a nice way to show that, yes, Helvetica does have it's purpose, but no, it's not for every purpose.</p>
      <p>Remembering the post-movie questions at Typecon, it's good to remember that not everyone who is going to see the movie is in Spiekermann-lingo a "Typomaniac". At least Carson wouldn't put the audience to sleep.</p>
      <p>But that's why the DVD extras will be nice, for those of us who actually <em>want</em> to hear the Moderns rambling on about the virtues of Helvetica.</p>
      <p>I only wish that there were some mention about Univers, which should possibly make it into the extras?</p>
