      <p>Wow... Joe, I truly appreciate your opinions on this, but the tone of your manifesto is really disappointing. You're basically venting on the entire home video industry's approach (or lack thereof) to accessibility, and focusing it on me and this film. When I said I'd discuss DVD accessibility with you when I met you at the Toronto screening, I meant excactly that, that we'd discuss it, that I wanted your input. But I refuse to feel that if I can't incorporate every single one of your "suggestions," then I'm irresponsible and uncaring.</p>
      <p>In the manifesto you've woven in comments and attitudes from other people, not me, including some quotes from others in this thread. Again, you're venting on others here, but blurring it and transferring it to me. Every time you use the term "you," you're accusing <cite>me</cite> of something... like I've been oppressing deaf and blind people for decades??? Jesus, I just made a little film about Helvetica. C'mon, Joe. I know your heart is in the place on these issues, but I don't like getting publicly attacked for things I haven't done, and for opinions that aren't mine.  </p>
      <p>The plan has <cite>always</cite> been to have subtitles on the disc, and I'll do the best I can to take your suggestions into account regarding their quality and legibility. And I guess I forgot to mention in the email I sent you that I personally transcribed the film for the subtitles, so there won't be any spelling errors. I'll make the DVD as accessible as I can, given the budget and time constraints that any independent film producer is always under. And on that front, are there any documentaries on DVD, self-released by independent producers, that have adhered to every one of the requirements of the Clark Manifesto?</p>
      <p>Again, I think your heart's in the right place here, Joe. But blaming me publicly, with the tone you've taken, for all the frustrations of disabled people when it comes to enjoying films is misplaced. </p>
      <p>Cheers,</p>
      <p>-Gary</p>
