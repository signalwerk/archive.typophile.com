      <p>Maybe someone can speak to this further, but I got the sense when I was originally contacting people about the film that Frutiger wasn't doing interviews anymore, for health reasons... or maybe he's just plain reclusive now. And his nephew did do that piece for German television about him a few years back.</p>
      <p>I'll have to go back through the extras and check on Univers shout outs. Crouwel discussed it, and of course there were mentions of Univers during the other interviews we did, but getting into Univers in any sort of in-depth way in the film required a lot more back-story, showing examples, how it differs from Helvetica, who Frutiger was. There's only so much you can do in 80 minutes, and in order to try to keep things focused on Helvetica, we decided not to go down that route. Ditto with Arial. </p>
      <p>But I'm sure there are several examples of Univers in the film anyway, on street signs, etc... a few had to have slipped in. So get the pause button on your remotes ready...</p>
      <p>Cheers,</p>
      <p>-Gary</p>
