    <p>I've been using a typeface from some drawers labelled "Runnymede", and I'm wondering if one can buy it. (And I hope the answer is "no", or at least "not digitally".) It looks like this.</p>
    <p><a href="http://www.thomaslevine.com/Typography/businesscards/12846622_WUQFP#964011598_7kLsu-A-LB" title="Photo &amp; Video Sharing by SmugMug" rel="nofollow"><img src="http://www.thomaslevine.com/Typography/businesscards/IMG2884/964011598_7kLsu-M-2.jpg" title="Photo &amp; Video Sharing by SmugMug" alt="Photo &amp; Video Sharing by SmugMug"></a></p>
    <p>So can I buy this? If so, where? And I wouldn't be surprised if it also goes by another name. Does it?</p>
