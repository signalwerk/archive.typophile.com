    <p>I wonder wether freefonts do really perform as appetizers to customers who might eventually buy more or the whole package. The monthly reports are overloaded with hundreds of $00.00-lines (costs a lot of paper when doing accounts).<br>
    Also I know that in some cases the give-away helped getting a typeface more polular. But then, does it pay off?<br>
    Anyone sharing experience with own freefonts-policy?</p>
