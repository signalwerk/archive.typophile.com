    html: |-
      <p>A little OT: I've been using the two Museo fonts frequently, now that I have several weights.</p>
      <p>Museo Sans looks so clean and legible as text - I wondered why. I had thought the common wisdom was to never use a geometric for text, cause it'll "look like Swiss cheese" with all those little circles.</p>
      <p>I see now, although the "o" is a perfect circle, the other rounded letters are slightly narrower. So, to my eye, Museo Sans text harmonizes well with other geometric display fonts, and doesn't have the "circle problem". </p>
      <p>I have learned so much from Typophile and MyFonts. Two years ago I used nothing but the OS and Adobe fonts I had installed, plus a bunch of free ones of limited usefulness. My main interest was illustration and graphics - I was ignorant about the history and proper use of type. I never learned anything about typography from the free sites.</p>
      <p>Now I'm slowly building a professional font library.</p>
