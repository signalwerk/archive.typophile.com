      <p>Jackson,</p>
      <p>Just a hunch, I have no facts whatsoever. I was hoping the MyFonts people would step up and straighten me out on this.</p>
      <p>Like I said above, it only works when the quality of the type is up to the task. Your average Joe font marketed in this way will go nowhere but the quality and appeal far above average work of a Jos will rise to the task.</p>
      <p>The 50 hot new fonts list gives you a 50 day window to move into the longer lasting and more telling "Best Sellers" list. That is a big leap done by only a few. It also depends on who you are marketing to. There are far more hobbyist scrapbookers out there who buy cute illustration fonts from MyFonts than large text superfamilies from MyFonts.  The multiuser multi license Superfamily buyers are more likely to buy from a Font Beaureau or a FontShop than at MyFonts.</p>
      <p>ChrisL</p>
