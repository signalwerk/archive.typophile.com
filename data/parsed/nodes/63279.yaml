    votes: null
    html: <p>The only person I know of who seems to be selling lots of fonts that have appetizers is Jos. Personally I think that this has more to do with his designs being good than with giving away a few free weights. And I don’t see many users clamoring for the giveaways—the people out there asking for free fonts are open-source pundits and web designers who want a lot more than just a free weight here and there. I think that it makes more sense to try and market by offering something people really want. Sell cheap web font licenses on Kernest. Offer heavy discounts to noncommercial users and students who can’t afford or can’t justify an expensive family for a single project with no commercial return.</p>
