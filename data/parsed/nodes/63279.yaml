    html: |-
      <p>Perhaps it is not that the same people who download the freefonts return and buy the paid fonts. It seems to me it is more about how the free fonts may generate traffic to your site and cause a buzz which livens up the marketing ears out in web land. I personally feel that many (if not most?) free font downloaders are only interested in getting things for free.<br>
      The point of free font marketing is positioning yourself in the market so that you get brand recognition and can play the hits game better. Resellers like MyFonts use hits and sales to push type vendors work further up the food chain.</p>
      <p>ChrisL</p>
