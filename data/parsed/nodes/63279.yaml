    html: |-
      <p>I wish the MyFonts guys (Nick?) would chime in and clarify this for me.  It appears to me that a free download of a font counts to the database as a transaction in such a way that it counts as a sale in their "Hottest Fonts",  "Hot New Fonts", and  "Biggest Sellers" algorithm.  The point is, if you put a free font as part of a larger family and let the free fonters of the world download it ad nauseam, the zero dollar sale counts as a sale none the less and boosts the type family high up on the lists. Granted, the free fonts net zero dollars but they do push visibility high enough and long enough that the rest of the family shows up as being "Popular" as well.<br>
      It is like buying a balloon, you don't pay for the air but nobody sees the balloon very well without it.  Out of sight, out of mind.</p>
      <p>This does not work for everyone.  You still have to have high quality desirable type for sale. The people who pay for type are discerning and won't buy crap just because it is high on some list.</p>
      <p>ChrisL</p>
