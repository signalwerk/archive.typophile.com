      <p>I'm a self-employed graphic designer, I have mostly small jobs, and therefore limited funds for fonts.</p>
      <p>Speaking for myself - any font with a free weight that was obviously a quality font family, I ended up buying other weights - IF each was less than $21. It got my attention. I felt I got a deal.</p>
      <p>Otherwise I'd wait til the font was on special at MyFonts. Some never are, of course.</p>
      <p>Museo, Museo Sans, Galette, Paragraph, Paracaps, Tenby, Sovba are the ones I'm thinking of. </p>
      <p>I like Cora free weight a lot, but I can't spend $35 each for the other weights, so I end up never using it.</p>
