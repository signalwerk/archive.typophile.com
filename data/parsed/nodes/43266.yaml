  html: |-
    <p>My aunt wants me to create a mock "Sexiest Man Alive" magazine cover for her boyfriend's birthday. Does anyone know what the font for "Sexiest Man Alive" is, or one that is similar? Its the same on each annual issue.</p>
    <p>For the "People" logo, I just downloaded a high-res image of an original mag cover and made a path around the logo. So I don't need that.</p>
    <p><img src="/sites/default/files/old-images/11_27_06_UPC_300x400_4210.jpg"></p>
