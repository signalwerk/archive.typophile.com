      <p>It's funny that <em>People</em> switched to <a href="http://typographica.org/001063.php">Verlag</a> shortly after <em>Us</em> magazine redesigned using Relay. You'd think they'd want to set themselves apart rather than mimic.</p>
      <p>Perhaps I have the chronology backwards. Someone correct me if I'm wrong.</p>
