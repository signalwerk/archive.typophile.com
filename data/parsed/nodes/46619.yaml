      <p>Hi Mandelbort,<br>
      welcome to Typophile.</p>
      <p>Here’s a list of script typefaces. I’m not saying that they are particularly similar to your sample, because that heavily depends on whether you want to emulate the overall appearance, whether you’re looking for the same writing tool or for certain letterforms. Scripts are quite unique.</p>
      <p><a href="http://www.fontshop.com/search/?q=Brush+Script&amp;site=d&amp;sample_text=Padres&amp;sample_size=96">Brush Script</a> is an old fart. <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a>’s <a href="http://www.fontshop.com/fonts/singles/mark_simonson/kinescope/?sample_text=Padres&amp;sample_size=144">Kinescope</a> is a lot nicer. So is <a href="/node/12272" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tomáš Brousil</a>’s <a href="http://www.fontshop.com/fonts/singles/suitcase/bistroscript_regular/?sample_text=Padres&amp;sample_size=144">Bistro Script</a>. <a href="http://www.fontshop.com/fonts/singles/elsner_flake/la_salle_regular_ot/?sample_text=Padres&amp;sample_size=144">La Salle</a>.</p>
      <p>There’s <a href="http://www.houseind.com/index.php?page=showfont&amp;id=27">Las Vegas Fabulous</a> by <a href="/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a>. Their <a href="http://www.tdc.org/news/2008Results/Sable.html">Sable</a> wil be released soon.<br>
      Letterheadfonts have several script fonts, American style, too: <a href="http://www.letterheadfonts.com/fonts/ballparkscript.shtml">Ball Park</a>, <a href="http://www.letterheadfonts.com/fonts/mariescript.shtml">Marie</a>, <a href="http://www.letterheadfonts.com/fonts/cosmiccursive.shtml">Cosmic Cursive</a>. And FontBros offer <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=ALSO-MESR">Metroscript</a>, <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=BLVI-PASC">Parsley Script</a> and <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-COSE">Coffee Service</a>, among others.<br>
      Two more essential addresses for nice retro and not-so-retro script fonts: <a href="http://www.sudtipos.com/">Sudtipos</a> and <a href="http://www.fontdiner.com/">Fontdiner</a>.<br>
      F</p>
