      <p>Hi Mandelbort,<br>
      welcome to Typophile.</p>
      <p>Here’s a list of script typefaces. I’m not saying that they are particularly similar to your sample, because that heavily depends on whether you want to emulate the overall appearance, whether you’re looking for the same writing tool or for certain letterforms. Scripts are quite unique.</p>
      <p><a href="http://www.fontshop.com/search/?q=Brush+Script&amp;site=d&amp;sample_text=Padres&amp;sample_size=96" rel="nofollow">Brush Script</a> is an old fart. <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>’s <a href="http://www.fontshop.com/fonts/singles/mark_simonson/kinescope/?sample_text=Padres&amp;sample_size=144" rel="nofollow">Kinescope</a> is a lot nicer. So is <a href="/wiki/Tomas%20Brousil" class="freelinking" rel="nofollow">Tomas Brousil</a>’s <a href="http://www.fontshop.com/fonts/singles/suitcase/bistroscript_regular/?sample_text=Padres&amp;sample_size=144" rel="nofollow">Bistro Script</a>. <a href="http://www.fontshop.com/fonts/singles/elsner_flake/la_salle_regular_ot/?sample_text=Padres&amp;sample_size=144" rel="nofollow">La Salle</a>.</p>
      <p>There’s <a href="http://www.houseind.com/index.php?page=showfont&amp;id=27" rel="nofollow">Las Vegas Fabulous</a> by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>. Their <a href="http://www.tdc.org/news/2008Results/Sable.html" rel="nofollow">Sable</a> wil be released soon.<br>
      Letterheadfonts have several script fonts, American style, too: <a href="http://www.letterheadfonts.com/fonts/ballparkscript.shtml" rel="nofollow">Ball Park</a>, <a href="http://www.letterheadfonts.com/fonts/mariescript.shtml" rel="nofollow">Marie</a>, <a href="http://www.letterheadfonts.com/fonts/cosmiccursive.shtml" rel="nofollow">Cosmic Cursive</a>. And FontBros offer <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=ALSO-MESR" rel="nofollow">Metroscript</a>, <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=BLVI-PASC" rel="nofollow">Parsley Script</a> and <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-COSE" rel="nofollow">Coffee Service</a>, among others.<br>
      Two more essential addresses for nice retro and not-so-retro script fonts: <a href="http://www.sudtipos.com/" rel="nofollow">Sudtipos</a> and <a href="http://www.fontdiner.com/" rel="nofollow">Fontdiner</a>.<br>
      F</p>
