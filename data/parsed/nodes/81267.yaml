    <p>I see Linotype has issued a PostScript version of Pilgrim, and there is also an issue from Paratype (same one?). Neither has old-style figures or small caps, even the "Pro."</p>
    <p>Back when we were using the Linotron 202, there was a supplemental font that had the os figs, both italic and roman, and small caps in roman.</p>
    <p>Does anyone know of a foundry that has issued Pilgrim (or Bunyan) that includes these?</p>
