    html: |-
      <p>Hello griffisse. I think the term you are looking for is “type designer”, not typographer. The former design typefaces, the latter composes the text – much like Leica make photographic cameras and photographers uses them. There are thousands of people drawing type now, but only very rarely do I get excited. If I were to pick just one, I’d choose Carl Crossgrove’s <em>Beorcana.</em> Fellow Typophile Florian Hardwig wrote <a href="http://typographica.org/typeface-reviews/beorcana/">some words for Typographica</a> when it was released back in 2006.</p>
      <p>— 14 years in the making. More slow type please!</p>
