    <p>Hello. Pretty simple I want to know more Type Foundry for inspiration and graphic design purposes.<br>
    Mine :<br>
    - Optimo<br>
    - Lineto<br>
    - Colophon<br>
    - Village<br>
    - Nouvelle Noire</p>
    <p>Single typographer and other than latin alphabet type designer are welcomed as well.<br>
    Have nice day, thank you !</p>
