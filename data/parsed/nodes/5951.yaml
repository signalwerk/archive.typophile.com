    html: <p>Yeah, it’s interesting. It’s a basic gestalt issue. Because   <br>two of six characters are treated diﬀerently, the two are   <br>going to stand out more than the ones I’m trying to   <br>emphasize.  <br><br>I tried some of what you’re (Graham) showing. By   <br>introducing the bars under the u and e I was trying to   <br>make the overall color more even.  I supposed it’s a   <br>toss-up as to which are more successful (underlines vs.  <br>color vs. weight change). All the approaches seem a   <br>tad awkward. A good sign that the idea itself is ﬂawed?  <br><br>Also, I’m glad you see this as more of a fashion thing   <br>than a non-proﬁt thing. It’s intentional. Volume isn’t the   <br>non-proﬁt itself, that’s just the name of the “program”   <br>they’re developing. It’s aim is to promote and preserve   <br>lower Manhattan lifestyle to the general public, not to   <br>other organizations or businesses.  <br></p>
