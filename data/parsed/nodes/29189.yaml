  html: |-
    <p>Does anyone else have problems with Magazines who request photographs for their articles that you shot or other imagery and promise since they ‘don’t have a budget’ that they will ‘definitely’ give proper credit to the photographer?</p>
    <p>Out of the dozen or so magazines in the last 2 years I’ve had photographs published, the ones that don’t pay often tell me that they will give credit, and so far only 20% have done so when the magazine is printed.</p>
    <p>Are they all just a bunch of merchant bankers? </p>
    <p>magazine 'Helix' from Australia and the UK 'Design Week'.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/merchantbankers_3721.jpg"></div><p></p>
