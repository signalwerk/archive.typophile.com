    html: |-
      <p>&gt; The curves in the shoulder and the joint of /m n u h/ are simply ugly.<br>
      I wanted to give it a sense of a serif italic, but in hindsight I think the thin part is too long; the weight needs to be distributed more so the shape can be a firm bow like in the regular.</p>
      <p>&gt; On second thought, the thin joints in both the regular and the italic are too thin. Try adding 5-10 units and you will probably see a much more even colour + better legibilty.<br>
      You don't seem to get the concept of this typeface. I'm giving it this extreme contrast in the joints on purpose. As riccardo says it creates a nice stencil-like effect. That's what it does at display size, and at body copy size it melts so much together that it just flows and reads well. Admittedly I'm not quite there yet with the italics, but that's the general concept, purpose and effect. Adding weight to the joints and I almost see no point in doing this typeface anymore.</p>
