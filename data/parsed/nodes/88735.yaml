    <p>Hello, I've been a member of Typophile for a while now but I don't think I ever posted any of my typefaces. So here's Dagon Sans, which is far from finished.</p>
    <p>I thought it would be nice to make a modern sans serif with high contrast but concentrated near the stems so the general structure remains like a sans serif instead of a semi-sans hybrid.</p>
    <p>The file attachment function is giving errors and I couldn't upload the main typeface here for some reason, so here's a link to it:</p>
