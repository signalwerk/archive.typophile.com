    html: |-
      <p>To all: could you tell me what you don't like about the "Super Italic"? I admit it needs some work but I like the concept myself. Obviously it wasn't meant to be used just like a regular italic. It's a bit more like a script written in marker.</p>
      <p>Riccardo: I made the |H| quite wide on purpose. Dagon is quite humanist in regard to letter widths. I suppose it could be a little bit more narrow, but then I should do the same to |M| and |N|, shouldn't I?<br>
      What specifically needs work in the stem? The subtle weight build-up above the lower joint was done on purpose.</p>
      <p>Jasper: I'm just working on the basic weight right now. When I'm done with that (the basic letters at least) I will start working on Extra Light and Black, provided the construction of the typeface allows such extreme weights.</p>
      <p>a - I disagree about the bowl being too large (the typeface is supposed to be quite open) but I'm curious why you think so.<br>
      b - Another humanist element, though I admit it might look more stable when I bring that joint down more.<br>
      c/e - You're right! I will fix that.<br>
      s - I think the top terminal could be a bit more subtle indeed. I didn't want the |s| to be too open though. I want a few subtle quirks in there.<br>
      t - You're right. Thanks!<br>
      italic - Strange I didn't notice that; I optically fixed them in both the italic and "super italic" but apparently not enough in the italic.</p>
    html_clean: |-
