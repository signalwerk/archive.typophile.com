      <p>Wow! This is beautiful! Make it into a complete family (with weights and such) amd you've got yourself a succesful typeface! I agree with hrant and riccardo that the second italic needs work, or just forget about it.</p>
      <p>Regular:<br>
      - bowl of /a/ is too large<br>
      - Bottom left of bowl of /b/ curves up too much.<br>
      - /c/ and /e/ are leaning backward<br>
      - terminals in /s/, especially the top one, curve inward too much. Make them slightly 'flatter'.<br>
      - Bottom of /t/ curves up too much and is too wide.</p>
      <p>italic:<br>
      The thin joints are too thin.</p>
      <p>Keep going!</p>
