      <p>Try it. 5-10 units won't make it a different typeface. It'll just make it feel a bit more stable. The thing with that stencil effect, is that it doesn't shine through in letters without joints, like o, making them stand out. You have to find a balance between the stencil effect and a coherent texture and even colour. It's your baby. Your choice. I'm just givin' you my opinion.</p>
      <p>Cheers!<br>
      Jasper</p>
