    html: |-
      <p>First make the 'normal' italic work. Than you could perhaps start thinking about the 'extra' italic.</p>
      <p>On the 'normal' italic:</p>
      <p>The curves in the shoulder and the joint of /m n u h/ are simply ugly. They look hastily drawn and overly quirky. That same area in is better in /a b d g p q/ but still not there. It has to look fluid to the eye, not forced. The harmonizer from RMX tools will help your curves look better.</p>
      <p>On second thought, the thin joints in both the regular and the italic are too thin. Try adding 5-10 units and you will probably see a much more even colour + better legibilty.</p>
      <p>Cheers,<br>
      Jasper</p>
