    <p>Hello, I'm new here so I thought I'd just say hi.  I'm not a graphic designer or typographer or anything like that... I just really like finding and enjoying new fonts.  It seems like I found a great forum to talk to others who also enjoy this as well as meet some designers who are using new and different fonts in their projects, as well as meet some designers who are actually <strong>making</strong> new fonts themselves!</p>
    <p>One question... is this forum part of <a href="/wiki/https%3A/%252Fitunes.apple.com/us/app/tapatalk-hd-for-ipad/id481579541%3Fmt%3D8" class="freelinking" rel="nofollow">Tapatalk</a>, the iPad app?  I usually use my iPad for forums, so it'd be awesome if you guys were on there.</p>
    <p>Well at any rate, I just wanted to say hi.  Looking forward to discovering some fun new fonts with you all :)</p>
