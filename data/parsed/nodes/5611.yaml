      <p>Thanks for your ideas and critiques - I will try to put a few of them to work - in the meantime, I had already fleshed out a few things and this is where I am so far - I tried to find a middle ground between the two and chose requiem using its italics and small caps so that I could have the breathing room while keeping the font closer to the same origin - whaddya think? Also, I too was worried about using the fleur at too small of a size so I kept it rather large on many of the pieces in the stationery. I have tried other configurations of the text and my eye keeps coming back to this one as being the most consistent with his traditional tastes. Here is one of the other options I played around with. BTW the tan is PMS 871 metallic gold not just a dirty tan as it may appear. I also am uploading a sample with the new type, a sample with the positions changed and a bolder fleur and a sample with a truncated fleur. <br> <br>Does anyone have a suggestion on a way to keep the typestyles and flavor of this rendition but eliminate the near miss between the R in Center and the f in for? <br> <br></p>
