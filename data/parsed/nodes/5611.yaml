    html: <p>The fleure-de-lis you created is lovely but i second (or third Ben's comment that it is too light) I too prefer your first design with all roman characters. <br> <br>Have you thought of using an ampersand instead of "and"? You could use a flourishy type to mirror the fleure-de-lis and better intergrate the symbol with the type. <br> <br>The Composition seems too symetrical and yet not symetrical enough.  I'll try to clarify. Because the words are so balanced small Big small, then Big small Big I want them to be exactly centered but because "aesthetic" has more letters than "Implant" it's just a little off. That said I'm not so sure about my ampersand suggestion. Placing it smack dab in the center of all that type may put too much emphasis on the character. How does it look if the type is to the right of the symbol, kind of tucked into the downward curly-Q?</p>
