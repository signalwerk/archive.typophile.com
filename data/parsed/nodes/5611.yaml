    html: <p>In this instance, perhaps, the fleur de lis doesn't need to be big and bold. I wonder if the focus shouldn't be upon the company name and the fleur used as accent.  This leaves the fleur open for size interpretation as well as allowing it to be light, airy, elegant, and a little non-descript.  <br> <br>I like the idea of mixing scripts, in this application, with the roman. However what if you chose a lighter version of bickham and made it larger, even to the point of mixing in (joining) with the others?</p>
