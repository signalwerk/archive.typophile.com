    html: "<p>The second worst design project is the one where you are in contact with the owner, but where the decisions are made by the the owner's wife. <br> <br>The worst design project is the one where you are in contact with the owner, but where the decisions are made by the the owner's wife and she wants the new logo to be identical to the new chairs, or rugs, or carpets... <br> <br>Of the the designs I like the first one best, the one that isn't mixing regular and italic. <br> <br>What they need is a new name. If they're not already doing so, they will sooner or later start to say \"C.A.I.D.\", which is even worse than the long name. <br> <br>But I guess wanting to create a new name is wishful thinking, there's nothing doing when dealing with a small firm, let alone a small firm where design decisions is made by the owner's wife. <br> <br>Come to think of it: the *very worst* design project is the one where you are in contact with the owner, but where the decisions are made by the the owner's wife and she wants the new logo to be identical to the new chairs, or rugs, or carpets... and their son or daughter has passed the first year in the art school. <br> <br>Well, make the most of it. <br> <br>-- <br>S</p>"
