      <p>Hi Haley,<br>
      I’m a reluctant Barcelona-resident. The architecture here is... um.. well there’s Gaudi which is supposed to be fabulous. And it is I guess if your are interested in medieval-style production methods. Since architects and urban planners have forgotten that buildings and streets, and indeed cities are for people, Barcelona is like most larger city: a place you just want to get out of after a while.<br>
      But sure, I’m always up for a coffee if you feel like ;)</p>
      <p>/Fredrik</p>
