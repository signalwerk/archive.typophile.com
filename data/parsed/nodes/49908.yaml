      <p><cite>backslash (not “backspace”)</cite></p>
      <p>Euh ...</p>
      <p>While I’m waiting for CS4, I’m thinking of smart things to do with the paragraph style linked GREP searches. So far, I’ve come up with two things that we now do manually:</p>
      <p>1. We regularly use old fonts, with its medieval numbers in a separate font. Naturally, we insert them as character styles with some search&amp;replacing. Now, all we have to do is saying “\d” -&gt; “Oldstyle” character style in the style for our body text. Yippeee!</p>
      <p>2. It’s quite handy to see figure and table references marked in color while doing page layout. How about “([Ff]igure|[Tt]able)\s\d+)” -&gt; “Highlite”, where the “Highlite” character style contains a big fat underline in some brilliant color. When done, de-select “Underline” in the highlite style, and the marks disappear. Need them again? Set “Underline” back on, and there they are again.</p>
      <p>(A provisional #3 would be to automatically format all caps words with small caps — I could use that for <em>some</em> of my styles.)</p>
      <p>Anyone else? ;-)</p>
