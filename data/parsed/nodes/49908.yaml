    html: |-
      <p>I agree that having a non-breaking “/” would help. We started breaking at slashes because of URLs. Other breaking characters are: slash(/), back-slash(\), underscore(_), ellipse(...), commercial-at(@), any dash (en-dash, em-dash, etc). We also have some heuristics that allow breaks at periods that try to break URLs but not abbreviations.<br>
      You can use find/change to do the application of no-break (but you have to use GREP).<br>
      In the “Find what:” field of the GREP panel in Find-Change type these 5 chars: (./.)<br>
      This means “an expression containing any character followed by / followed by any character”.<br>
      In the “Change to:” field enter: $1<br>
      This means “use the first expression that was found”.<br>
      Now, next to the “Change Format:” area, click the magnifier and choose “no break” from “Basic Character Formats”<br>
      You can hit the buttons “Find”, “Change”, “Find Next”, “Change”, ... until you feel comfortable enough to hit “Change All”</p>
      <p>BTW, in CS4 you can dynamically apply character formatting (like no-break) to GREP expressions. Powerful but somewhat daunting.</p>
      <p>eric</p>
