      <p>Theunis, thanks for taking the time to explain. Yes, I did figure out that preceding the character with a backslash (not “backspace” as you mistakenly typed) works by “turning off the special meaning of the following character”.</p>
      <p>Thanks too for pointing out the special case of anychar-period-space. I had completely overlooked it.</p>
      <p>And, yes, I did spend several hours reading up on GREP. Fascinating!</p>
