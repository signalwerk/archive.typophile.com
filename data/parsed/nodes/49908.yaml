      <p>Thanks, the discretionary hyphen solution did not work, perhaps because ID is assuming these to be two different words.</p>
      <p>But selecting the whole string and applying “No Break” worked. Is there a way I can use a macro or find-and-replace command to apply No Break to any character string that has the “/” character in it? This is a 300-page book!</p>
      <p>The / can appear anywhere in the string, even at the beginning. The string length can be up to 20 characters long. The source is in MS Word. I don’t mind running a macro in Word before pasting in ID but can an ID “No Break” command even be pre-applied in Word?</p>
      <p>Ideally, ID should have a non-break “/”. Much like a non-break space. Or a way of restricting the characters that should be allowed to break the line.</p>
