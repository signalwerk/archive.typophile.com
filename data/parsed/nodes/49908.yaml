    <p>Windows XP/SP3. InDesign CS3.</p>
    <p>In a text I am setting, there are strings of characters that include the / (forward slash) character, such as “a3e/cf6” (without the quotes). I want these character strings to be treated like a single word, without any breaks at line ends (hyphenation is off). Unfortunately, ID, in its wisdom, breaks the string thus “a3e/” with “cf6” wrapping to the next line. </p>
    <p>How can I restrict ID to breaking lines only at spaces and at no other character? These strings appear several times in the text and any solution should ideally be global; it would be too much to manually process each of these occurences.</p>
    <p>And, apart from the forward slash, are there any other non-space characters at which ID breaks lines?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/33893" class="topic-previous" title="Go to previous forum topic">‹ GDF file format</a> <a href="/node/48519" class="topic-next" title="Go to next forum topic">How to increase zoom factor in Fontlab ›</a></div>
