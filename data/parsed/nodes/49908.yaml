      <p>Kimag, in case you haven’t figured it out by now:</p>
      <p><cite>The middle period was not interpreted literally but as a wildcard character.</cite></p>
      <p>Well, not just that middle period! The period “.” is always a wildcard character, but in <em>Search</em> only. To search for a literal period, prefix it with a backspace. This must be used on <em>every</em> “special” character in the “Search” box as well as in the “Replace” box. An important note: the specials are different for Search and for Replace, i.e., while you can <em>Search</em> for a wildcard character, you cannot just <em>replace</em> it again with that “same” wildcard (“.” to “.”). The period in the replacement field is just that, a period.</p>
      <p>So, to search for three periods in GREP mode, enter “(\.\.\.)”. (That would find three periods.) To search for ’any character period any character”, it gets slightly so complicated. If you grok the previous paragraph, you might think “.\..” does the trick. Well ... almost. The <em>space</em> also matches “any character” (as does, IIRC, the paragraph return), which would put “No Break” onto every last character plus period plus the next space. You might want to search here for a “word” character on the left and right of the period — that’s alphabetics plus numerics plus perhaps some loose change, and its wildcard in search mode is “\w”. Putting it together, that makes the Search “(\w\.\w)” and the Replace “$1”.</p>
      <p>But wait! You don’t have to put “$1” in the Replace field (which means “the first parenthesized found expression), as there is only one item in the Search field that you want replaced entirely. You can remove the parentheses and use “$0” instead (which means “the entire found expression”) [*]. But again, hey, all you want to change are <em>attributes</em>, so it is enough to entirely clear the Replace field, and just select “No Break” in the Replace with Format box. (Additional notes: if there is <em>no</em> text in the “Replace With” box and <em>no</em> formatting in the “Replace with Formatting” box, all found occurrences will be deleted. Also, be sure there is not a single —invisible— space in the Replace With box!)</p>
      <p>So we end up with “\w\.\w” in Search, nothing at all in Replace, and No Break in Replace with Format.</p>
      <p>[*] In case you are wondering how to use “$1” properly, this works nicely. Notice the escaped parentheses.</p>
      <p>Search: “\((\d+)\)”<br>
      Replace: “[$1]”</p>
      <p>This will search for “(“, any sequence of numbers, then “)”, and replace it with Found Expression #1 — which is the “\d+” part —, surrounded by square brackets. In case you want to experiment with this any further, look up any standard GREP reference on the web (as InDesign is for the largest part compliant). For any variations on the above, remember the square brackets are ’special’ in Search but not in Replace.</p>
      <p>To have a little fun, try this. Search for “(\w\w\w) \w+\1\&gt;”. It will find any consecutive words with the same three ending characters (“present management”, “secure pressure”; “matter transmitter” has four). Also try this one: “(\w)(\w)(\w)\3\2\1” — this will find ’partly palindromes’ — words with the same three characters double in reverse order (“dif” in “diffident”, “tal” in “installation”).</p>
