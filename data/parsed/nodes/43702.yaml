      <p>I think that the main problem with TeX, and its variants, is that it has become somewhat trapped in a vicious circle. It is widely perceived as only being for suitable for writing scientific/mathematical papers with a result that only scientists and mathematicians tend to use it. This also means that most of the books and websites written about it tend to come from that angle which can put people off who are from the arts side of things. This is quite unfortunate, as TeX does produce very good looking documents and, once one has got to grips with it, it is relatively easy to use. Indeed, I don't use anything else for my day-to-day work and hate it when I am forced to do something on Microsoft Word or Open Office.</p>
      <p>I think that where the TeX and the Document Preparation Systems are particularly strong is not as a replacement for DTP software but as a replacement for a word-processor. Therefore their target market is unlikely to be designers for whom DTP software offers WYSIWYG control.</p>
      <p>As I see it, the great advantage of TeX is that one can just type the document, without worrying at all about formatting, and then have TeX automatically convert that into something that could quite acceptably be published. Whilst DTP software gives the designer finer control, I certainly wouldn't like using InDesign every time I write a letter.</p>
      <p>A good example of where I think TeX is particularly useful if if one works in a field where documents with numbered paragraphs are the norm. Getting a word processor to do this accurately is a complete pain, unless one has preprepared the document and I think the same applies to most DTP (though I'm not an InDesign expert). With TeX, it is simply a case of putting two lines of code at the top of the document. Then you can forget about it, knowing that no matter how much you mess around with and revise the document, the numbers will always be right!</p>
      <p>There are few difficulties (some historic) that I think are unfortunate:</p>
      <p>1) Sticking my neck on the line a bit, I think that plain TeX is now much more intuitive for most people to use than LaTeX, despite the common perception of the opposite. LaTeX very much forces the user into using the LaTeX "house style", which although results in good looking documents, requires quite a lot of hackery to change. Plain TeX, gives the user more of a blank sheet from which to work. Since the advent of Word Processors and the like this much less of a problem than it was in the early 80s: most people are now quite comfortable with deciding what their section headings and the like should look like and the LaTeX defaults can somewhat get in the way.</p>
      <p>2) Computer Modern is, ermm..., interesting as a default typeface choice! </p>
      <p>3) The learning curve is still near vertical...For example, the two lines of code I was talking about above are:</p>
      <p>\newcount\parnumber \parnumber =0<br>
      \everypar{\advance\parnumber by1 \the\parnumber. }</p>
      <p>I think XeTeX, ConTeXt and LyX are, however, helping alleviate these. I especially think that if LyX could produce "purer" TeX and then strapped onto XeTeX (which has excellent OpenType support and avoids all of the old font problems associated with TeX), then its popularity would increase a lot. </p>
      <p>-Jacob</p>
