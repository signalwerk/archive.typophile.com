    html: <p>This isn’t just a TeX thing, it’s an open source thing. I tried using TeX, and like a lot of F/OSS software, it just wasn’t worth the bother. Indesign is just so much easier to use for everything I need to do that it more than justifies the cost of the software. No screwing around with dependencies, X, or compiling, I just install it and it works. For me it always comes back to that old saying “Free software is only free if you time is worth nothing.” My time is worth enough to keep me far, far away from TeX.</p>
