      <p>I'm not a designer as such, but rather an author who also designs. So, from a strictly design point of view, I can see how Tex may not be ideal. But from an author's point of view, Tex is more useful than anything else that I've used for document creation. A large chunk of that usability derives from the fact that I can create tex files which can be typeset, converted to online formats, and manipulated in many other ways. One of the problems I had with my early books (e.g. rosslaird.info/grain/ ) was that once the design was completed using InDesign, the text was pretty much set into that format, and it was quite difficult to extract material in such a way that the extraction (e.g. for web excerpts) was seamless and standards compliant. Futzing around between InDesign and standards-compliant html (not to mention css) has not, in my experience, been very fun. But Tex obviates all that. I simply create my documents in plain text, using ReStructured Text or something similar, then run the text through LaTeX and whatever other automated process I want, so that at the end I have Tex, html (with css), or whatever. From a document management point of view this is perfect: transportable, centralized, simple.</p>
      <p>I have not used XeTex, but I do use all of my OpenType fonts with Tex. And as far as typesetting goes, the Tex algorithm is/was (I think) the basis for the algorithms used in current software such as InDesign. I am not an expert in this area, but I have never heard anyone say that Tex typography is inferior to any other system. Usually what I hear is that it is superior (but that may just be geek-speak). Sure, Tex requires knowledge of the markup; but actually not too much, and these days most people who are involved with the production of fine documents (for the web or elsewhere) are familiar with markup. </p>
      <p>I suppose much of this boils down to familiarity, workflow, and interface. I've used pretty much everything available since 1986, and my preference, overall, is for Tex. But as I said, design is only one part of what I do, so for those whose main gig is design, Tex may not be ideal. (I'm thinking here of fixed documents that will not be required to have online versions, for example.) But for me, I appreciate Tex's way of preserving the plain text and using it with great flexibility. And the output looks great too.</p>
      <p>Ross</p>
