      <p>I agree that it's odd that the text-markup systems haven't been more widely discussed.  Some of it may be timing: in their heyday of only a decade or so between the phototypesetting era and the DTP era, there wasn't much time for markup technology to get much of a foothold. And once the Mac/PageMaker combo came along, the markup systems could never be more than a tiny niche market.</p>
      <p>Markup systems imply a certain amount of programming, or at least an understanding of text processing.  That's pretty far away from most designers' experience, and perhaps requires a lot more explanation than the history writers want to spend on what seems to be a dead market.  (Although ironically, the entire web design field is based on much of the same markup languages.)</p>
      <p>In fact, I think you'll find that very little information about phototypesetting is mentioned in the histories, either.  It's usually glossed over in generic terms, as a stopgap between letterpress and digital.</p>
      <p>I did dig up my copy of Richard Rubinstein's <cite>Digital Typography,</cite> published in 1988, and found that he describes details and provides examples of several markup systems, including TeX, troff (or other RUNOFF descendents), as well as PostScript and other page description languages.</p>
      <p>As an old-time user of troff-like systems (I once wrote a troff clone for a Royal laser printer, circa 1984), and a sometime-user of TeX systems, I'd have to count most of markup technology as a good pioneering try, but in the end either too specific or too technical to make much of a difference in typographic history. As you mention, troff, TeX, and to  some extent Scribe has been used in the CS community for typesetting of papers and books.  However, I believe these markup systems have been used primarily for more functional reasons, rather than reasons of typographic quality, including:</p>
      <ol>
      <li>Restricting texts to being formatted in a house style.
      </li><li>Representing mathematical formulas in an acceptable notation.
      </li><li>Being "programmable," in terms of being a tool in a batch-oriented process run automatically.
      </li></ol>
      <p>These reasons are quite valid in their context. But if you look at TeX without math formatting, you find an obscure system with odd formatting defaults that only does decent typography with a lot of work. Troff is even more basic, with little to no typographic control, as you mentioned. Scribe had interesting potential, but was sold off and apparently abandoned long before its time in the limelight. (Brian Reid once worked for my father, I think just before Brian wrote Scribe.)</p>
      <p>Perhaps later histories will revise the view that all digital typography started with the Mac.  But I'm not certain that the message will be that the earlier digital typography had been so unfairly pushed under the mat.</p>
      <p>--John</p>
