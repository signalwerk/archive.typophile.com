      <p>I'm not one to argue that TeX is good for all typesetting purposes or to argue that it doesn't have a steep learning curve, and all those probably are reasons for its relative obscurity outside of technical fields. However, I hate to let a thread like this go by without at least mentioning that it's gotten much easier to install TeX and friends in Windows and Mac in recent years. No compiling or worrying about dependencies. Nice GUI editors that help you with all the commands you may not remember. I'd hate for anyone who hasn't tried TeX to be unduly frightened of the experience.</p>
      <p>The most important thing I had when learning TeX was an expert to whom I could ask questions. Often things were easy once I was pointed in the correct direction.</p>
      <p>st</p>
