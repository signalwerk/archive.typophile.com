      <p>Computer Modern was a bit of a no brainer, as "Modern" had been the main type used for scientific and academic documents for 150 years.<br>
      All the sorts are well established.<br>
      It is actually very "disambiguous" for things like math, as its complex forms enable great distinction between all kinds of glyphs. For instance, the pot-hook serifs on the italic prevent entanglement of superior and inferior letters with numbers in complex formulae--an advantage that becomes apparent when comparing with the ClearType math font.</p>
