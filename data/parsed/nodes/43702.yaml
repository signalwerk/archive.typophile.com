      <p>Everyone, thanks for the thoughtful comments. </p>
      <p>John Labovitz: Thanks for the pointer to Rubinstein's book; I will have to try to find a copy. Those are some good points you make.</p>
      <p>Nick Shinn: Didn't intend to sound like I was complaining; I'm more curious to find out why markup-based systems seem to have remained unknown outside their little ghetto. There have been some good histories of TeX written by people who have more insiders' knowledge than I do (Nelson Beebe's "The Design of TeX and METAFONT: A retrospective" is useful but is more from a computer science point of view than a typographical one).</p>
      <p>Ross Laird: Good point about being able to process the text in other ways. </p>
      <p>Jacob H: Very true about the numbered paragraphs. I have had the unpleasant experience at work recently of having to revise a 700 page technical document (with 8 levels of section numbering (yuck!)) in Microsoft Word. It is the sort of job that a system like TeX/LaTeX is made for (except that it would have to be extended to handle 4 more levels of section numbering).</p>
      <p>And as for Computer Modern -- the best thing I can say about it is that a book set in CM looks a lot better than one that was written on a typewriter, which was not uncommon in the early 1980s (especially computer science texts from the UK). I use XeTeX and it works quite nicely with Adobe Garamond Premier Pro.</p>
      <p>A note to James Puckett regarding free and open-source software: Typophile.com appears to be hosted on the Linux operating system, running the Apache web server, which are open source.  <a href="http://toolbar.netcraft.com/site_report?url=http://www.typophile.com" title="http://toolbar.netcraft.com/site_report?url=http://www.typophile.com">http://toolbar.netcraft.com/site_report?url=http://www.typophile.com</a> But your point about what your time is worth is well taken. TeX vs desktop publishing is a bit like ham radio vs cell phones -- you have to be something of an enthusiast to make it do everything it's capable of.</p>
      <p>There are cases where TeX and friends are used as "back ends" for formatting output produced by other software. DocBook markup can be handled that way. The TeX showcase has an example of a catalog generated directly from a database and formatted using TeX; that would be difficult to do with a WYSIWYG DTP system, I would think.<br>
      <a href="http://www.tug.org/texshowcase/en_gb_eclipse_114.pdf" title="http://www.tug.org/texshowcase/en_gb_eclipse_114.pdf">http://www.tug.org/texshowcase/en_gb_eclipse_114.pdf</a></p>
      <p>I've had good results using TeXShop on the Mac, using LaTeX markup and XeTeX so that I can use the fonts normally installed on my computer. It is nearly WYSIWYG; the generated PDF is displayed in a window right beside the markup editor window, and you can run TeX on it by pushing a single key. </p>
      <p>troff seems to have run its course. The last book I saw that was set with troff was in 1995 or so. Apparently there is now a version of troff that will use OpenType fonts, but I haven't tried it.</p>
      <p>So it would seem that the answer to my original question is that markup based systems like TeX and troff are not mentioned in mainstream histories of typography for cultural reasons. There is not much awareness of them outside the world of mathematics and science; they wouldn't come to the attention of someone who didn't have to set complex mathematics. This isn't surprising given that, in their heyday, using them required a computer that cost a 5 or 6 figure sum and had to be kept in an air-conditioned room.</p>
      <p>Maybe there should be another thread: "TeX &amp; troff -- The Ham Radio of Typesetting?"</p>
      <p>:-)</p>
      <p>Jim Tubman<br>
      Calgary, Alberta, Canada<br>
      "The Stampede City"</p>
