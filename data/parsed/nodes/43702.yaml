      <p>Ross:</p>
      <p>Sorry, I wasn't being very clear. What I should have said is that DTP software tends to make it easier for designers to exploit a fine degree of control because the setting is conducted on a "trial and error" basis. The most notable example would be with images. In any WYSIWYG software, one can usually just drag the image around the page until its position looks right, even if that is 2.45387cm from the margin. With TeX, one has to specify the image's location and then compile the file to check, which is considerably more time consuming. Another example would be font sizes. With most DTP software, to try all 20 font sizes between 8pt and 10pt in 0.1pt increments is simply a case of pressing a button 20 times. In TeX, one would have to edit the tex file, save, compile and open the PDF 20 times. Although this can be done quite quickly with a good text editor, it still is a more lengthy process. I think with TeX one has to have a clear idea in one's mind as to how the final document will look, as experimentation is a bit of a pain to carry out.</p>
      <p>This is not necessary a problem, indeed pre-DTP, publishing was more like working with TeX in that the designer would have to specify the design and have proofs printed without being able to play with a faithful resolution on a screen. However, I don't think I'd like to set any full-colour magazines in TeX!</p>
      <p>BTW, have a look at XeTeX...it has two advantages over plain TeX in that it will happily operate in UTF-8 and will use any font installed on your system (or even a font-file not installed if you specify the path) without the need for any conversion.</p>
      <p>Nick:</p>
      <p>That's a fair point and I was being a bit flippant. However, I do think that the CM Serif is not Knuth's best work. For instance, his CM Sans-serif is considerably better and, of course, he collaborated extensively with Zapf, both of which suggest that a better default face would have been possible.</p>
      <p>Of the typefaces now available, Palatino is probably the most popular for people not using CM but there are also TeX versions of Bondoni and Didot which I think would be better Modern choices as defaults.</p>
      <p>-Jacob</p>
