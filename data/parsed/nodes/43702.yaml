      <p>Jacob;</p>
      <p>I'm curious to know where "DTP software gives the designer finer control." I don't use DTP software, at least not for a few years, and I imagine it has come a long way. Tex seems to be able to do all sorts of crazy stuff that I never use  -- like, for example, being able to flow text into all kinds of mathematically-defined shapes. In Peter Wilson's manual for the memoir class there's a poem that has been formatted as a swirl on the page, and that's pretty cool. But I suppose what I'm asking is: does DTP software offer something typographical that Tex can't do? Or do you mean that DTP software offers easier ways of doing certain typographical functions -- which I could easily understand. Just curious.</p>
      <p>Ross</p>
      <p>Oh, and about Computer Modern: Yup, a strange choice. You'd think that Knuth, who worked with Zapf, would have chosen Palatino at least. I'm sure glad that I have access to all of my OpenType fonts in Latex, thanks to John Owens: <a href="http://www.ece.ucdavis.edu/~jowens/code/otfinst/" title="http://www.ece.ucdavis.edu/~jowens/code/otfinst/">http://www.ece.ucdavis.edu/~jowens/code/otfinst/</a></p>
