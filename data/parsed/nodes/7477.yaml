  html: <p>Hello! <br>I've been doing some letterpress printing and experimenting at a printer's place here in my city and he showed me something very curious. It's a 12pt square type with a full "Hail Mary" on it. It's so small you have to use a magnifying glass to read it, but it's there and it's readable. We haven't tried to print it. I forgot to ask if the printer and owner ever tried. <br>It's exactly like any 12pt type but instead of a letter it the entire prayer. Unfortunately I don't have any pictures of it right now... <br> <br>What I'm wondering is, does anyone here know how this thing was made? Anyone know other similar things? <br> <br>Thanks!</p>
