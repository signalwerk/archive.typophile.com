    <p>I need some feedback from some experts on my personal identity, I definitely respect everybodys knowledge and opinions on these forums, so anything would be helpful. The logos are just for a personal mark right now, nothing serious...maybe down the line sometime soon. My name might accompany it pd are my initials, or another idea I have is anyword that starts with p and design example: pangea design.</p>
    <p></p><div class="imageWrap"><img src="/files/pd.png"></div><p></p>
    <p>Specifically I am wondering about what other contrasting colors might work with this logo, and the fact that when viewed smaller you lose the 3D Escher effect. </p>
    <p></p><div class="imageWrap"><img src="/files/pd2.png"></div><p></p>
    <p>Here is option numer two. I love this logo myself, I really think it pays homage to the Bauhaus and maybe even El Lissitzky. But everybody I’ve ran it past for critique says they read the word pool.  I see it, but like I said I have emotional attachment issues to this one.  If you guys/gals tell me it reads pool I will catalog it and wait for some high end pool supply company to come along and pitch it to them.</p>
    <p>-Patrick Dakin</p>
