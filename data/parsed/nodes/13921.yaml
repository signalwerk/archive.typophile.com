    <p>I'm in the midst of digitizing, on a PC, an old Art Nouveau typeface. I wish to share this with a Mac user on OS X 10.3.9.</p>
    <p>My understanding is that OS X users can use Win TT fonts just fine. Several online resources confirm this and I've forwarded to her the directions for properly installing the font that these resources advise.</p>
    <p>No luck. She states that her "computer acknowledges it but displays only a few rectangles." (the notdef glyph, I presume). She also finds that the font works perfectly on her boyfriend's PC.</p>
    <p>I'm wondering if there are any cross platform font makers here or others who may be able to shed some light on this subject.</p>
    <p>I began this font using a template to create a new Unicode, Regular style font. I then pruned many of the characters slots that are outside the Windows 256-character ANSI set. I've now created, so far, only the cap A through M in their appropriate places.</p>
    <p>I've specified Unicode Version 1. Mac Roman is included as a Platform. I've checked the Mappings and all 13 characters created thus far are mapped correctly to both the Win Unicode and Mac Roman platforms.</p>
    <p>I'll likely end up going the conversion or Opentype route in the end, but would sure like to find out what's up here.</p>
