      <p>Thank you for responding, Bruno. However, it isn't encoded as a Symbol font. I had it as Mac Roman and "Microsoft Unicode BMP only". I just took a look at Arial and it is encoded as above but also adds "Unicode 2.0 and onwards semantics, BMP only".</p>
      <p>I'll try adding that third encoding and see if it works in Mac OS X.</p>
