      <p>Most likely that it is a cmap issue. The Win TTF is probably Symbol encoded which does not get recognised on the Mac. The Mac cmap needs proper index encoding (0-255).</p>
      <p>Only then will a Symbol font work properly on the Mac.</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
