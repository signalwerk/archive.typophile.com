      <p>There are two simple ways to change the look of the Leopard dock to a non-"3D" style:</p>
      <p>1. Move the dock to the left or right side of the screen (Apple menu &gt; Dock &gt; Position on Left/Right), or</p>
      <p>2. Open Terminal and type:</p>
      <p><code>&nbsp;&nbsp;&nbsp;defaults write com.apple.dock no-glass -boolean YES</code></p>
      <p>&nbsp;&nbsp;&nbsp;killall Dock</p>
      <p>The alternate dock is quite nice.</p>
