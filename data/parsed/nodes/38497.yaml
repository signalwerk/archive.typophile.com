    html: |-
      <p>Hi guys:</p>
      <p>I went to the Apple Store Sunday. And I brought with me, DST's Estilo to evaluate the Leopard's opentype capabilities. First off, Pages nor TextEdit recognized the lowercase of the font. And <em>yes</em> I made sure the caps lock was off. I also could not substitute the character I wanted in Pages (just like now) but the shocker- in TextEdit too. In Tiger I can add any glyph I like even if it does not recognize it in TextEdit. But now both of those are dumb in Leopard.</p>
      <p>Interestingly, Bickham Script that comes with the Adobe Creative Suite installed on all the demo machines works just fine- in Pages and TextEdit. I added alternates with foreign accents and it worked okay for me. So I have no idea why the inconsistency. Perhaps the fonts are programmed differently?</p>
      <p>I also have Papyrus Condensed to show off:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture1_4055.png"></div><p></p>
      <p>MS sans:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture2_5744.png"></div><p></p>
      <p>The renderer is different too.</p>
      <p>a zoom of Papyrus condensed taken within FontBook in Leopard:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/papyruscondensedzoom_5773.png"></div><p></p>
      <p>A zoom of the old Papyrus from my Tiger machine:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Papyrusregularzoom_6574.png"></div><p></p>
      <p>MS Sans very zoomed:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mssanszoom_5337.png"></div><p></p>
      <p>But here is an inconsistency:</p>
      <p>Bickham Script within Pages in the new Leopard:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bickham_zoom_3580.png"></div><p></p>
      <p>Notice the grayscale anti-aliasing in Pages is not used in Font Book. Why? And Why use the colorized antialiasing period- it makes you blink. I think it's terrible.</p>
      <p>I tested Time Machine and I got it not to restore a bunch of iPhotos and apps I deleted- so no- I'm not impressed. In fact, I'm not overly impressed with anything. Even cover flow is not so hot. Font icon previews are really useless anyways. Ag is not very helpful.</p>
      <p>Spotlight on the other hand is very fast. Spaces looks useful. And that's about it...... </p>
      <p>Mike Diaz ;-/</p>
    html_clean: |-
