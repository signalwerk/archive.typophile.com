      <p>Upgraded few hours ago and have been testing it for various stuff.</p>
      <p>So far this has been the smoothest OSX to date. Everything is faster in general.</p>
      <p>Here are few things font-related:</p>
      <p>The Quicklook is really useful for previewing fonts before installing. In previous versions if you clicked on the font file you'd invoke FontBook which would display it's own preview. This one leaves FB alone and gives you the repertoire: </p>
      <p><a href="http://img139.imageshack.us/img139/6286/40354017qn8.png" title="http://img139.imageshack.us/img139/6286/40354017qn8.png">http://img139.imageshack.us/img139/6286/40354017qn8.png</a></p>
      <p>It also renders a thumbnail of each font's "Ag" and gives it that icon. This is sort of cool in CoverFlow, which is a good way to browse esoteric fonts.</p>
      <p><a href="http://img457.imageshack.us/img457/3209/19474539gp6.png" title="http://img457.imageshack.us/img457/3209/19474539gp6.png">http://img457.imageshack.us/img457/3209/19474539gp6.png</a></p>
      <p>Helvetica Neue is now included with OSX. 55 has friends now.</p>
      <p><a href="http://img134.imageshack.us/img134/3158/97858410pc6.png" title="http://img134.imageshack.us/img134/3158/97858410pc6.png">http://img134.imageshack.us/img134/3158/97858410pc6.png</a></p>
      <p>You can print a fontbook directly from Font Book by select font + print. It formats the fonts and everything, but the information is lacking. There are better solutions out there like FontDoc and FontParade, but it's a good start for quick stuff.</p>
      <p><a href="http://img134.imageshack.us/img134/9640/37052834zx6.png" title="http://img134.imageshack.us/img134/9640/37052834zx6.png">http://img134.imageshack.us/img134/9640/37052834zx6.png</a></p>
      <p>Per-application activation is a nice touch, but Linotype Font Explorer X does a better job and doesn't hog Font Book. It runs smoothly under Leopard.</p>
    html_clean: |-
