      <p>I'm using an old 1.5 GHz PowerBook with 1 Gb of RAM and can attest that the whole thing is far snappier than Tiger. I'm surprised, since most system upgrades just add bloat. However, I'm happy to report that this cat seems really tightly engineered. It also seems to be handling virtual memory better, though I have yet to really test it out with Word, Photoshop and InDesign all running together.</p>
      <p>My fave features so far: Spaces (I've got separate spaces for iCal, Mail, Surfing and Real Work™) and QuickLook (damn brilliant!). Type looks crisper somehow; dunno if the antialiasing algorithms have been tweaked. I don't use Font Book, so I can't attest to how that is working, but the latest version of Suitcase Fusion seems to be working fine. (As does Photoshop CS2, so far).</p>
      <p>Also, the new system voice, Alex, is quite charming. He even takes breaths before beginning a new sentence. Still, I can't quite get used to the translucent menu bar. It's growing on me...</p>
      <p>I've got a sample of Papyrus Condensed to post. But, the "Insert image" link doesn't seem to work in Safari 3.</p>
      <p>--m</p>
    html_clean: |-
