      <p><a href="http://en.wikipedia.org/wiki/Mac_OS_X" title="http://en.wikipedia.org/wiki/Mac_OS_X">http://en.wikipedia.org/wiki/Mac_OS_X</a></p>
      <p>Cheetah was Mac OS 10.0. It was <em>painfully</em> slow on the G4/533Mhz I was using at the time. It lacked the "Quartz Extreme" acceleration introduced with 10.2, so all advanced graphics processing was handled by the (probably slow) CPU. I loved it because I could use a *nix system at work, but it was pretty sad overall. Most design apps were run in Classic, which at that point wasn't fully functional. If I remember correctly, the Chooser was buggy--and this was a time when I needed to use the Classic Chooser to select printers for Classic apps. The 10.1 upgrade was free, and Apple provided disks to any users who wanted them. In those days, the "big cat" code names weren't used in marketing materials, so it's no wonder that people aren't familiar with them. </p>
      <p>Speaking as a fearless early adopter, I would have to say the 10.5 upgrade was relatively smooth. I haven't experienced any major disasters so far...</p>
