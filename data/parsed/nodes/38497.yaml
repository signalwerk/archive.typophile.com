      <p>I have an old copy of Adobe Garamond Pro OpenType that I could never use effectively because I don't have proper apps like InDesign.  In Pages, the Tiger typography panel never gave me any options with this font; now, with Leopard, I get (true) small caps, rare/historical ligatures, lining and old-style figures, contextual alternatives, swash caps, etc.  I could also add glyph variants from the character palette.</p>
      <p>Zaner Super Pro Opentype also never worked well for me under Tiger, but the Pages typography panel under Leopard now offers stylistic and contextual alternatives (all worked) but I still couldn't add all of the glyphs from the character palette with this font. :(</p>
      <p>So, Opentype support does not appear to be complete, but perhaps a tad better?</p>
      <p>-don</p>
      <p>"There are 10 types of people in the world: those who can count in binary and those who can't."</p>
