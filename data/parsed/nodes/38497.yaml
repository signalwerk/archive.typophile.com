    html: |-
      <p>Font Book is massively improved, has auto-activation, and now fonts show previews right in the Finder (Abc text rendered in the font shows as the file icon)! You can use the new Quick Look feature on font files, too -- just select a file in the Finder, hit the space bar, and a window pops up instantly to show you the whole character set of that font! I'm going to have to rethink my whole management strategy, I think for a lot of people apps like FontExplorer will no longer be necessary. I haven't tested it extensively, of course, so once the gloss wears off there will surely be shortcomings I don't notice. But in terms of type, Leopard is a winner without a doubt.</p>
      <p>Leopard is a fantastic upgrade, the Finder in general is improved in so many ways. Time Machine really is as good as it sounds -- after years of using various unix tools to get compact, differential versioned backups, it's built into the system now with one click. it's fast, space efficient, and very well-designed in terms of how it lays out the backup files. Pretty much the best functionality of all the different unix backup utilities, the only drawbacks seeming to be the limited support of backup destinations and the minimalist configuration interface. Tying in rsync and some spotlight-powered inclusion/exclusion filters to Time Machine would create the ultimate desktop backup system.</p>
      <p>Speed is good on my dual G5, the same or slightly better than Tiger was -- I'm sure on the intel systems it will be noticeable faster. This is, no bones about it, a fantastic OS release.</p>
