    <p>Greetings everyone<br>
    Searched far and wide and I haven't found an exact answer to this one so I thought I would post it to the forum<br>
    What is the typeface used for movie theater marquee letters, such as these shown <a href="http://flickr.com/photos/emily_paup/302756590/">here</a>?  Looks like <a href="http://fontshop.com/fonts/singles/fontfont/ff_din_ot_black/">FF Din</a> is fairly close, but its curves seem to be a little flatter than those in the marquee letters; anyone have an exact match?<br>
    Thanks in advance for any assistance!<br>
    sno-man</p>
