    html: |-
      <p>One of the major changes to the previous version of DIN 1450 is that the new version does not anymore take the capital height in mm as a reference for defining type sizes. In the new version, requirements for type sizes are related to the x-height. This way of defining requirements for type sizes is likely to be adapted by other DIN norms in the future. It will also influence the way German legislation will be defining such requirements. </p>
      <p>The EC seems to be heading in the same direction. The new legislation on ‘the provision of food information for consumers’ (i.e. packaging etc.) specifies that ‘mandatory particulars […] shall be printed […] in characters using a font size where the x-height […] is equal or greater than 1,2 mm.’ Regulation No 1169/2011, Chapter IV, Section 1, Article 13.2, Page L 304/29 <a href="http://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=OJ:L:2011:304:0018:0063:EN:PDF" title="http://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=OJ:L:2011:304:0018:0063:EN:PDF">http://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=OJ:L:2011:304:0018...</a><br>
      FYI: The typeface is a customized version of DTL Albertina :–)</p>
      <p>For those who like to think that it is not really possible to define the size of a typeface by its x-height, I’d like to refer to the new ‘x-Tools for Adobe InDesign’ <a href="http://www.x-tools.eu" title="http://www.x-tools.eu">http://www.x-tools.eu</a></p>
