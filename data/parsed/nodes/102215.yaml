      <p>Recently, Monotype released quite a promising range of <a class="freelinking external" href="http://www.fonts.com/search/all-fonts?searchtext=etext#product_top" rel="nofollow">eText typefaces</a>. As far as I can judge from the screen, they would also serve as a ‘caption’ size, as Adobe and others call it. They are primarily marketed as Web or e-Reading fonts, but I suppose that many of these fonts would also<br>
      – do better in small print than their regular companions (and in regular print sizes as well, I’m afraid …).<br>
      – meet the requirements for ‘consulting text’ (small print such as footnotes and captions which contains additional information to the main text) as defined in the new DIN 1450 norm.</p>
      <p>Just to show that the new DIN 1450 does not just try to implement an old norm for signage (i.e. the strict use of sans serifs in the neo-grotesque style) on books.</p>
