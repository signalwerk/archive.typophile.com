      <p>Together with prof. Florian Adler, Ivo Gabrowitsch (FSI), Ralf Herrmann, Otmar Hoefer (Linotype), Peter Karow (ex URW), prof. Indra Kupferschmid and several experts on issues concerning low vision, optics and lighting, I have been working on the new DIN 1450. Please allow me to serve you with some facts in this discussion.<br>
      – DIN norms are not laws, they are norms. Their use can be enforced by contracts or laws, but that is subject to business- or political discussions and decisions.<br>
      – DIN is not stately-owned, the DIN norms are defined by its committee members. It is up to the designers and their organisations to either leave that work up to bureaucrats, other specialists, fellow-designers or to take a seat in a DIN committee …<br>
      – Unlike the previous version, DIN 1450 does not prescribe the use of sans serif typefaces for almost any kind of typography. In the informative section, the new DIN 1450 recommends the use of sans serif typefaces for public signage, but not for any text in the public space.<br>
      – DIN 1450 does not prescribe the use of Frutiger, let alone Neue Frutiger or Neue Frutiger 1450. Frutiger is included in a list of typefaces which are mainly recommended for signage. Frutiger 1450 has not been included in that lists, because at the time DIN 1450 was approved by the committee, Frutiger 1450 was not available and maybe even not planned for yet.<br>
      – DIN 1450 does not include a specific typeface design (such as DIN 1451 on typefaces does, it includes DIN 1451 Mittelschrift and DIN Engschrift).<br>
      – DIN 1450 does not prescribe the use of sans serif typefaces for medical packages or medical information leaflets.<br>
      – DIN 1450 distinguishes between several kinds of texts: Display text, reading text, caption / consultatory text, signage. For each kind of text an appropriate range of sizes has been defined. Type sizes are referred to by the x-height in mm, related to typical viewing distances. Appropriate typefaces for these kind of texts are indicated by ranges for aspects such as stroke weights and counter width in percentages related to their x-height. Display typefaces are not subject to any requirements, except for a minimum x-height.<br>
      – Next to the normative part, DIN 1450 has an informative section. For signage, the list of recommended typefaces shows a clear preference for Humanist Sans Serif and Grotesque (and not for Geometric Sans and Neo-Grotesque)*.  The list includes includes Calibri, Frutiger, Myriad, Thesis –The Sans, Verdana and Wayfinding Sans, just to name a few.<br>
      – DIN 1450 does not prescribe a seriffed-one, a zero-with-dot or a crooked-l. In the informative section it is recommended to use these kind of variations when means of positioning or indication (i.e. typography and/or context) fail. Note that most traffic sign systems have been designed in such a way that ambiguity between letters and figures is virtually impossible. Let alone most documents. Ambiguity is likely to occur in IBAN and BIC codes, captchas and other nerdy inventions.**</p>
      <p>* I would rather recommend FontShop’s FontBook app to figure out what typefaces belong to these classes than the current classification which Monotype uses on fonts.com though. To me, it is totally unclear what reasoning they may have followed to come up with the idea that, next to Frutiger, Univers Next also is a Humanist Sans Serif:<br>
      <a href="http://www.fonts.com/browse/classifications/humanistic-sans" title="http://www.fonts.com/browse/classifications/humanistic-sans">http://www.fonts.com/browse/classifications/humanistic-sans</a></p>
      <p>** In my personal view it would rather make sense to fight against ambiguous coding systems rather than wasting our times with slot-filling projects such as adding or substituting decent letterforms by the aforementioned poppycock. Unless for Designers’ Reasoning of course. If I were Frutiger and dead, I’d be rotating in my grave in turbo-mode …</p>
