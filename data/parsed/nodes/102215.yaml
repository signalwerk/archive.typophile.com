    <p>Hi,</p>
    <p>I would be glad to have your opinion concerning the <a href="http://www.linotype.com/1196254/NeueFrutiger1450-family.html" rel="nofollow">Neue Frutiger 1450</a> released by Monotype.  I've also seen that they have published an article : "<a href="http://www.linotype.com/en/6990/din1450.html" rel="nofollow">DIN 1450 – the German standard on legibility of texts</a>" which could be seen as a marketing argument to justify, and sell this 1450 serie. (Maybe I'm wrong?).</p>
    <p>I've seen some tough feedbacks on Twitter  today by some weel known and hi-skilled type designers :</p>
    <blockquote class="twitter-tweet" lang="fr"><p>The typeface Frutiger myth was just devastated by a marketing trick today.— Typofonderie (@typofonderie) <a href="https://twitter.com/typofonderie/status/322309179450740736" rel="nofollow">11 avril 2013</a></p></blockquote>
    <blockquote class="twitter-tweet" lang="fr"><p>Wow. A way to get customers to pay for new licenses to a design they’ve already licensed three times, at least! Hole in one, right?— Dan Reynolds (@typeoff) <a href="https://twitter.com/typeoff/status/322315210172030977" rel="nofollow">11 avril 2013</a></p></blockquote>
    <blockquote class="twitter-tweet" lang="fr"><p>@<a href="https://twitter.com/typeoff" rel="nofollow">typeoff</a> But Dan, it's nova nova nova new neu 2.0 premier pro E — AND has a dot in the zero, ftw— Hoefler&amp;Frere-Jones (@H_FJ) <a href="https://twitter.com/H_FJ/status/322318541980323841" rel="nofollow">11 avril 2013</a></p></blockquote>
    <p>Concerning the article Din 1450 :</p>
    <blockquote class="twitter-tweet" lang="fr"><p>@<a href="https://twitter.com/mark_barratt" rel="nofollow">mark_barratt</a> That article is misleading for marketing sake.— Indra Kupferschmid (@kupfers) <a href="https://twitter.com/kupfers/status/322312528950611968" rel="nofollow">11 avril 2013</a></p></blockquote>
    <p>So, I would like to have more feedbacks  (140 char. is really short), more opinions about this typeface.<br>
    What you think about the font itself ?  The need of such release ?  The legibility issue ?</p>
    <p>Thanks</p>
