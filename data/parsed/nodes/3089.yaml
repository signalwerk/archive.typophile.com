    html: <p>It resembles Radiant in some of its Photo-Lettering forms, but that's about as close as I could find for thick-thin sans (as Photo-Lettering called them). <br> <br>At least a few forms still live as digital fonts, such as the <a href="http://www.philsfonts.com/detail.html?sku=AG61706201P1" target="_blank">PL version from Agfa</a> seen here at Phil's Fonts.</p>
