  html: |-
    <p>Hey everyone,</p>
    <p>I'm doing some research into how to compare two typefaces for similarity. So far, I've come up with the list below - like a checklist for comparing two fonts. I'd say I'm missing a lot of good measures. Are there any others I should include?</p>
    <ul><li>serif style</li>
    <li>single versus double sided</li>
    <li>symmetrical or asymmetrical</li>
    <li>bracketed or not</li>
    <li>x-height</li>
    <li>terminal style</li>
    <li>aperture size</li>
    <li>axis</li>
    <li>single vs double "a"</li>
    <li>binocular vs monocular "g"</li>
    <li>proportion of the bowl of an "R" to its legs</li>
    <li>roundness of round shapes</li>
    <li>shape and size of "i" dot</li>
    </ul><p>Thanks,<br>
    Aaron</p>
