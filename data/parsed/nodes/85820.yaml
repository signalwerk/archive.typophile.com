    <p>Hello, all.</p>
    <p>I acquainted myself with font production the weekend before last and constructed a typeface for a piece of fiction I'm working on in OpenType format using the tool FontForge.</p>
    <p>It's a fictional flowing script which is generally meant to be written in a bottom-to-top fashion.  A given syllable tends to be continuous along a centerline, starting with a consonant sound or hard-start mark, and each character maps one-to-one to a phoneme.</p>
    <p>My biggest headache with implementing this at present is alignment issues which occur under windows.  I heard about a negative-space hinting mechanism used for keeping the gap-pairs in lowercase Ms and Ws continuous, and given the characters this occurs most with (they map to 'a', 'o' and 'm') I'm guessing it's the culprit.</p>
    <p><img src="http://evanbalster.com/wreath/fontbugs.png"></p>
    <p>Outlined in red are my main worries.  The yellow box highlights a lesser alignment issue.  Note that this was rendered with notepad32 and rotated.  The properly-aligned versions of the problem letters are initial forms joined to the hard-start glyph.</p>
    <p><a href="http://evanbalster.com/wreath/font-test.html" rel="nofollow" class="link-external">Here's</a> a webpage where the font can be experimented with.  Combining marks (like 'Th', 'Thh', 'Zh', 'Sh', 'Ch') don't seem to work except under Firefox/Windows and so must be entered with the number keys, Q and X.</p>
