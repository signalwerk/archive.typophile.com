  html: "<p>Dear all, <br> <br>I have been asked to provide some input for a friends independent fashion boutique. The challenge is to aid in the development of an online presence and also for a variety of planned print materials. The current font choices for the two shop names don't really work as well as they probably should (and I've never been a fan of Copperplate Gothic - for some reason it was popular as a display font when I was completing my architecture studies - and that was the mid 1990s!). The loose brief is below: <br> <br>\"Illustration with improved fonts listing only shop names and a heading somewhere that says: <br>'Contemporary jewellery, clothing and objects - Australian made and designed.'\" <br> <br> <br> <br>The overall feel as described by the client/owner is: <br> <br>\"Inspiration for site: a jungle and garden with a touch of Alice in Wonderland...............\" <br> <br>The suggestions which I have made so far have not really hit the mark and I would appreciate any suggestions which anyone has. Last suggestions were two emigre fonts: 'Brothers' for Alice &amp; 'Priori Sans' for Ivy. <br> <br>Please fire away. <br> <br>Grant Dunlop <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/54202.jpg\" alt=\"Alice &amp; Ivy (existing)\"></p>"
  html_clean: "<p>Dear all, <br> <br>I have been asked to provide some input for a friends independent fashion boutique. The challenge is to aid in the development of an online presence and also for a variety of planned print materials. The current font choices for the two shop names don't really work as well as they probably should (and I've never been a fan of Copperplate Gothic - for some reason it was popular as a display font when I was completing my architecture studies - and that was the mid 1990s!). The loose brief is below: <br> <br>\"Illustration with improved fonts listing only shop names and a heading somewhere that says: <br>'Contemporary jewellery, clothing and objects - Australian made and designed.'\" <br> <br> <br> <br>The overall feel as described by the client/owner is: <br> <br>\"Inspiration for site: a jungle and garden with a touch of Alice in Wonderland...............\" <br> <br>The suggestions which I have made so far have not really hit the mark and I would appreciate any suggestions which anyone has. Last suggestions were two emigre fonts: 'Brothers' for Alice &amp; 'Priori Sans' for Ivy. <br> <br>Please fire away. <br> <br>Grant Dunlop <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/54202.jpg\" alt=\"Alice &amp; Ivy (existing)\"></p>"
