    <p>I am 21 years old and next may i will be graduating having completed a graphic design hnd. <br> <br>We have an end of year show at 'the workstation' Sheffield, where Designers Republic are based. <br> <br>The reason i am posting is to ask advice. . . <br> <br>Even though a few design consultancies and agencies come along to the end of year final show which is highly recognisable for being a good standard, i have been thinking about something else. <br> <br>I am quite a good designer, i dont mean to be modest but i may have a junior design job secured for next january, have had my work exhibited in a gallery in London, and a few designers say the overall quality is good. <br> <br>Putting that aside should i send out a promotional pack to design agencies throughout the UK, fairly near Sheffield, to invite people to come visit me and hopefully with my portfolio i might secure some interest. <br> <br>I am just trying to take some initiative, what does everyone think?</p>
