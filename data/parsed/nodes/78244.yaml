    html: <p>If the paper is coated and typography uses computer to plate technology and the raster is at least 175 lpi the result should be okay. But the barcode should be changed to black. Otherwise it is dark enough to change it to black and nobody will notice. You can experiment overprinting 100% black over 100% yellow to get your greenish hue and not to distort letter clarity if the typography is so so.</p>
