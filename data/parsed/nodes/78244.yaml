    html: <p>I suspect the printer doesn't accept spot color files either because a) they do a lot of quick-and-dirty gang printing; or b) they will be using a digital press, neither of which bodes particularly well for using the CMYK build. Strictly black type would eliminate any unpleasant surprises...</p>
