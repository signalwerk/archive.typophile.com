      <p>I'm not sure exactly what the point size is of that type, but it doesn't look too small to me to print well if you've got a good printer. But you really need to talk DIRECTLY to the printer to get their input.  </p>
      <p>If you decide to play it safe and print the text in black and the rest in that dark color, be sure that the color is different enough from the black that it definitely looks different. Otherwise it might look like they were both supposed to be the same color but something went wrong.</p>
      <p>And if you end up using 2 colors, you might consider doing the small type in black but the large book title in the color.</p>
