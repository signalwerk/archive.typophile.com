    <p><strong>The third issue of <a href="/wiki/Building%20Letters" class="freelinking" rel="nofollow">Building Letters</a> — Tsunami Edition is available on-line. Order now and support those in need.</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bl3magazine-on_6312.jpg"></div><p></p>
    <p>The third issue of Building Letters is dedicated to Sri Lanka and Thailand, and it features interesting articles by Tom de Gay, <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a>, <a href="/wiki/Max%20Kisman" class="freelinking" rel="nofollow">Max Kisman</a>, <a href="/wiki/Fiona%20Ross" class="freelinking" rel="nofollow">Fiona Ross</a> and <a href="/wiki/Donald%20Beekman" class="freelinking" rel="nofollow">Donald Beekman</a>. As usual, it contains a <strong>CD with 25 free fonts</strong>, this time donated by <a href="/wiki/Pieter%20van%20Rosmalen" class="freelinking" rel="nofollow">Pieter van Rosmalen</a>, Seonil Yun, José Scaglione, David Březina, José Louis Coyotl Mixocatl, <a href="/wiki/Stefan%20Hattenbach" class="freelinking" rel="nofollow">Stefan Hattenbach</a>, Bram Pitoyo, Tomáš Brousil, <a href="/wiki/Richard%20Kegler" class="freelinking" rel="nofollow">Richard Kegler</a>, <a href="/wiki/Veronika%20Burian" class="freelinking" rel="nofollow">Veronika Burian</a>, Jürgen Weltin and Ludmila Lorenz. All fonts are <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> and with one exception, they contain glyphs necessary for typesetting of all Latin-script European languages (complete <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> set Latin Extended A), so you can set Maltese, Welsh, or Esperanto in them; some faces contain special features, alternate glyphs, decorative glyphs, alternative numerals, ligatures, or small caps.</p>
    <p>Although the TV cameras are long gone from the places hit by the tsunami, aid is still needed. This is why all profit from the sales (after deduction of hard costs) will be donated to a respected charity Direct Relief International (<a href="http://www.directrelief.org" title="http://www.directrelief.org">http://www.directrelief.org</a>), which will use the money to help those hit by the 2004 tsunami.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/building-letters-3-cover_4288.jpg"></div><p></p>
    <p>The magazine size is A5, it has 64 full colour pages, it is published in a limited run of 1000 numbered copies, and it is <strong>on sale now for 35 €</strong> (aprox. $43) at <a href="http://www.buildingletters.org" title="http://www.buildingletters.org">http://www.buildingletters.org</a>. Also, the site will publish information on how much money was collected, and finally, it will publish a report from Direct Relief on the use of the donation.</p>
