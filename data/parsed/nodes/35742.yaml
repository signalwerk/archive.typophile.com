    html: |-
      <p>Hey, Shane, I like a clean, basic website like yours, but I agree with Patty about the drop-down navigation. It's a bit confusing that the headers WORK and INFO look like separate menu items and then they don't bring anything up. If you keep the drop-down menu, maybe you could integrate the section names into the lists -- by removing the dotted lines beneath INFO and WORK, for instance.</p>
      <p>Also... I'm not sure it's a good idea to have a practically empty page as the starting point... Think of that page as a cover for a book or printed portfolio of your work... You could use that space to say or show something about yourself -- it's the first impression you are making to a stranger visiting your site for the first time! Do you really want him or her to be greeted with a white page that says "NAVIGATE!"?</p>
    html_clean: |-
