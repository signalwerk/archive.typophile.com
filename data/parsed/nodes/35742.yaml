      <p>Thanks guys. Eyehawk, in reference to your statement about it possibly appearing passe. My only response is that far too often I come across design and illustration sites that are difficult to navigate, graphically/aesthetically distracting, etc. I figured I would go in the complete opposite direction, strip it down as much as possible so that my work is all that is influencing the viewer, and that the user experience isn't aggravating or annoying. That said, I too feel its a tad on the boring side, and I've got about 12 other comps with some fancy elements. I may end up having to implement one of those if too many people are concentrating on the boring/plain-ness of the site and not my work.</p>
      <p>Again, thanks for the feedback!</p>
