      <p>I see what you mean, Stewf.  Those numbers may be indicative of how Monotype has lost touch with creative professionals. Their percentage to them dwindles, yes, but what is the true market potential?  If we could compare FontFont/FontShop and Font Bureau, I would bet that those two would have a greater share to design professionals than Monotype even in this crappy market.<br>
      Monotype may just say, hey, that is only 25% of our sales and just ignore it.  A better business decision would be to see if there was room to increase that percentage. This is similar to what GM did several years back.  They decided to ignore the European market because it was a small chunk of their sales.  They assumed they had the American market all locked up with their big cars and always would.  Along came Japan later and GM was left in the dust wondering why all those "Buy American" slogans were not working anymore.  The Japanese built a better mouse-trap and the GM execs were left in their board rooms to to ruminate on their collective hubris.<br>
      Soon all those old guys who are the historic connections for sales in OEM will retire and Monotype will be left wondering what happened!</p>
