      <p>My hunch is that it's simply about priorities. I don't know how much of Monotype Imaging’s sales come from what they call the "<a href="http://monotypeimaging.com/Markets/CreativePro.aspx" rel="nofollow">creative professionals</a>" market, but from what I last saw of their public financials a few years ago it wasn't a high percentage. (It's probably not an accident that it's the last item in the "Markets" menu on their website.)</p>
      <p>Yves may have a point: for this ownership it's all about columns in a spreadsheet. They are running a business, not following a passion. And it shows. Compare this output to any of the font vendors or retailers who are (still) run by people who really care about type and are willing to make decisions from time to time that don't necessarily enhance the immediate bottom line.</p>
