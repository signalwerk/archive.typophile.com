      <p>I disagree with that conclusion.<br>
      Extenders must serve some function, or else they would not have evolved and ﬂourished (so to speak).</p>
      <p>I always design typefaces so that the letters combine nicely into attractive-looking word shapes.<br>
      Doesn’t everyone?<br>
      Surely we can’t all be wasting our time?<br>
      Don’t we believe that type design is NOT about the individual letters, but about creating a system of combining glyph shapes?<br>
      Don’t we ﬁnesse our glyph shapes and spacing in a metrics window, looking at whole words?</p>
      <p>If the glyphs don’t ﬁt together nicely into words, then they are harder to read individually as letters (crowding).<br>
      So even if people do not “read” word shapes, good word shape is an indication that letters will be optimally readable.</p>
      <p>Whatever, I doubt scientists will ever be able to disabuse type designers and graphic designers from the myth of the nicely shaped word.</p>
      <p>And, when it comes to cursive handwriting, surely word shape is indispensible to the reading process.</p>
