      <p>I think there's a huge disconnect between how psychologists try to operationalize their terms and how typographers and type designers use the same words in talking about their work.</p>
      <p>Psychologists have operationalized ‘word-shape’ as 1) the more or less complex (for upper and lower case words) envelope structure formed by tracing the exterior outline of the word at it’s boundary, or 2) the raw pattern of neutral, ascending and descending characters in their specific sequences. For All Caps, these are just rectangular. The only thing that changes is aspect ration or horizontal width.</p>
      <p>For the typographer and type designer, word-shape issues are almost totally across-the-word issues like the optical-grammatical or gestalt integrity of the word as an an independent, distinct or autonomous, internally integrated visual unit made of parts (letters) and part primitives (strokes). This than involves spacing, and the counterbalancing of the sub-components of the glyphs so they [adding] — the part primitives — [end of addition] work together seamlessly across the word, while keeping their proper saliences and preserving or enhancing their independent cue values, so envelope structure and raw pattern hardly ever come into it. The belief is that gestalt integrity issues are at bottom functional issues with aesthetic spin-off values.</p>
      <p>As a result it just sounds wrong to suggest that a typeface should not be evaluated on its ability to generate a good word shape. That's not exactly what Kevin said. Kevin said the <em>readability and legibility</em> of a typeface should not be evaluated on its ability to generate a good word shape.</p>
      <p>I think the important issues here are the issues of construct validity and valid inference. Does the presumed fact that letters are used (Kevin) or the hypothetical conjecture that quantization into role-units is the central mechanism (Peter) in the perceptual part of word recognition imply that gestalt integrity issue are not of some importance functionally? It could be that the legibility of the letters <em>plus</em> their ability to contribute to distinct or autonomous, internally integrated visual units is fundamental to readability, because the balancing of saliences and cue values helps the <em>cortical integrational mechanisms</em> in the visual cortex underlying visual word-recognition to run smoothly. This relates to the visual span and uncrowded window “bottleneck" issues that Gordon Legge and Denis Pelli raise.</p>
      <p>Legibility itself is controversial as a construct. It could refer to 1) distinguishing one letter from another — telling them apart. This is mainly how it is used by Kevin in some of his collaborations, and underlies the construction of confusion matrixes. Legibility could also refer to 2) perceptual discrimination at thresholds (distance, visibility, driving speed) of affordance in word and letter identification contexts — accurately and quickly making out what’s there. This is how it is used in the Clearview Highway tests. Legibility could also refer to how well a type performs (because of the letter shapes, or the spacing or the size or the leading) in speed of reading tests. This is how it is used by Miles Tinker in his typographical factors series of tests. (Tinker used absolute values, but performance curves typically show that there is initially a) a steep climb, which b) bends at a knee (what Tinker focussed on), leading into c) a wide plateau, at the end of which is d) a gradual decline. All these — the steepness of the climb, the location (b.i)  and (b.ii) angularity of the knee, the extent and flatnesss of the plateau — may vary for different factors (weight, size, set) with different types.)</p>
      <p>I suggest we think of legibility as an integral value relating to all of these measures, including the width of the plateau, and distinguish it from readability as characterized by Matthew Luciesh which relates to things like the efficiency of the cortical integrational routines and the visual side of text-navigation issues. These kinds of efficiencies don't show up easily in standard performance measures (which relate to simple affordance, more than ease), but become evident with time on task.</p>
      <p>In psychology there is a sizeable literature on unitization. Unitization is the perceptual learning mechanism whereby people group or “chunk together” smaller object features (maybe letters, or possibly role-units) into larger wholes over training (Goldstone, 1998, 2000). See also: Grossberg, S. (1991b). Unitization, automaticity, temporal order, and word recognition. What unitization is, is still controversial, but Leslie Blaha and James Townsend appear to show that unitization at the feature level is characterized by a shift from extreme limited to extreme super capacity processing (as is exhibited in the word superiority effect). When typographers and type designers look at gestalt effects or optical-grammatical integrity issues ("word-shape”), they seem to be concerned with effective unitization.</p>
      <p>So a closer look at unitization, a broader understanding of word-shape, a more diversified notion of legibility, and a differentiated notion of readability as a distinct dimension might bring modern psychology and typography closer together.</p>
