      <p>John writes: <em>"And I'm not sure that any typographer's concept of a simple word shape corresponds at all to the kind of boxes around the outside of letters that seem to be the interpretation of the phrase illustrated by the psychologists.”</em></p>
      <p>Here are three examples of typographers who support the word shape model:</p>
      <p>1. Rolf Rehe in <em>Typography: How to make it most legible</em> (1974, p.35) shows an illustration of an envelope around a word and writes:<br>
      <em>"Words are perceived by their specific word-shape outline, which is unique for lowercase words. Once the outline of the word has been perceived and stored in memory, future recognition or recall of the word takes place without letter-by-letter deciphering."</em><br>
      (While the book is older, Prof. Rehe continues to supports the word shape model. I spoke with him at the RIT Reading Digital conference, and he is quite charming.)</p>
      <p>2. James Felici in <em>The Complete Manuel of Typography</em> (2003, p.43) shows an illustration of the top half and bottom half of a word and writes:<br>
      <em>"Our comprehension of the text we read is based largely on the tops of lowercase letters, the bottom halves consisting mostly of “legs and feet.” The top sample here (bottom half of word) is impossible to decipher, but the middle sample (top half of word) is comprehensible. Rendering those shapes into patterns enables us to recognize whole words and phrases at a glance."</em></p>
      <p>3. Jost Hochuli in <em>Detail in Typography</em> (2008, p.24) shows an illustration of an envelope around a word and writes:<br>
      <em>"Given that an adult reader’s eye registers not individual letters but whole words, or parts of them, it is not surprising that words play a particularly important role in the reading process."</em><br>
      ___<br>
      Since starting to work on typography, I have heard frequently from people about the word shape model. I don’t think I’m fighting a ghost. I am hopeful that the word shape model is quickly forgotten and that Peter and others build a more useful model that can explain current findings about how we read and predict new discoveries.</p>
