      <p>Thanks, Kevin. I thought I had a copy of the Hochuli book, but apparently I jettisoned it. The second example you give, from Felici, is a different topic, although equally wrong-headed. I came across the same view expressed in a video by Doyald Young: the phenomenon that the top half of Latin letters are easier to recognise in isolation from the bottom half is misinterpreted as implying that we 'read the tops of letters'.  But that, like Hochuli's statement, seems to me simply sloppy thinking. I suppose that doesn't disqualify it from being evidence of 'what typograhers believe', but Rehe's statement is the only one that seems to me to amount to a strong statement of belief in a particular mechanism.</p>
