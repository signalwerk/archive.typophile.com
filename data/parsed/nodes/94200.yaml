      <p>That’s one thing.</p>
      <p>However, you’ve overstepped the mark in suggesting that choosing readable typefaces has nothing to do with word shape.  (“I hope that it is clear that the readability and legibility of a typeface should not be evaluated on its ability to generate a good word shape.”)</p>
      <p>As John and I have argued, while typographers may mistakenly believe the “simple” or “box” outline is the correct scientiﬁc theory, when it comes to evaluating the readability of faces—and choosing which to use—our notion of readability will indeed favor types that “generate a good word shape”, because we’re not thinking about a simple box outline, but considering rhythm, color, letterspacing, &amp;c. </p>
      <p>In particular, word shapes are very instructive about vertical proportion, which is crucial in choosing a type that’s most readable for a speciﬁc setting—the convention of small x-height in book faces, for instance.</p>
