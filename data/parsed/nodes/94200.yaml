      <p><em>If the glyphs don’t ﬁt together nicely into words, then they are harder to read individually as letters (crowding).</em></p>
      <p>That's not what crowding is.</p>
      <p>There are any number of good reasons why type designers work at producing sets of signs that harmonise in various ways and have the result of producing 'attractive-looking word shapes'. Some of these reasons are aesthetic, and no less important for that fact, while others are functionally important for reading (targeting a particular spatial frequency channel; producing perceptually even arrangement of features through good proportion and spacing). So yes, one could say that production of nice word shapes is sometimes or often an indicator that a typeface is probably doing right a number of things that contribute to both beauty and functionality, but if word shape itself is not constitutive of reading, then I think Kevin is right to say that it is not in itself an evaluative criterion for legibility or readability. Why not? Because it is fairly easy to conceive of forms of 'attractive looking word shapes' whose beauty comes from different kinds of letter relationships than those that contribute to good readability. Indeed, there are numerous styles of calligraphy that are based on such conceptions, that are valued for the beauty of their word shapes even though these are not readily readable.</p>
      <p><em>And, when it comes to cursive handwriting, surely word shape is indispensible to the reading process.</em></p>
      <p>I don't think we have the evidence to be able to say that. An equally plausible hypothesis is that what is important in reading cursive handwriting is the ability to distinguish significant letter features from insignificant joining strokes. As someone who finds it much easier to identify Arabic letters in the traditional cursive styles than in the flat modes of many typefaces (in which the strokes that are significant parts of the letter in the traditional styles become merely a connecting line between fragments), I suspect letter feature recognition plays the same role in reading regardless of whether the letters are disconnected or joined.</p>
