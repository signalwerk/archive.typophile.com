      <p><em> … it is fairly easy to conceive of forms of 'attractive looking word shapes' whose beauty comes from different kinds of letter relationships than those that contribute to good readability. </em></p>
      <p>Yes, but as a measure of readability, one wouldn’t be assessing word shapes for such extraneous qualities of “beauty” as being tarted up with ﬂourishes, but for how nicely the glyphs ﬁt together. That’s the attraction of good typography.</p>
      <p><em>…contribute to both beauty and functionality…</em></p>
      <p>I’m sorry I mentioned the word attractive. This has nothing to do with beauty and aesthetics conceived as the opposites of functionality. Sure, there are many aspects of how type looks which are not functional to decoding text, but there is also an area of overlap where functionality may be assessed by aesthetic judgement. If a word looks like its letters ﬁt together nicely according to a coherent, well-proportioned scheme, that indicates it will be quite readable.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typog_4224.jpg"></div><p></p>
      <p>In this example, compare a word set in one typeface with the same word set in a mix of fonts. The aesthetic qualities of the one-font word concern a design which organizes its elements for readability according to a set of visual principles that coalesce into a style.</p>
      <p>The word composed of perfectly legible letters that don’t match has a nasty word shape, both in its garbled outline and in the unevenness of color, with some glyphs crowded together while shunning others, creating gaps and pockets in the outline that upset the matrix. (Although no doubt priming analytical thinking…)</p>
