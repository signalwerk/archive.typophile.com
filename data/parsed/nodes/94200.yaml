      <p>[Hrant] “…no worse than a model that ignores the obvious and relies on flawed empirical testing.”</p>
      <p>You might be interested to know about Hans Werner Hunziker’s claim in <em>Im Auge des Lesers</em>, that “Die periphere Unscharfe ist kein Fehler des Systems. Sie vereinfacht und comprimiert die Wahrnemung.” [The peripheral un-sharpness isn't a flaw in the [perceptual] system — it simplifies and complements perception.]</p>
      <p>Most studies of peripheral vision are focused on the negative effects of crowding on object identification in the parafovea and the “bottleneck” introduced by the fairly narrow width of the visual or uncrowded span. Hunziker is more focused on the positive effects of the loss of acuity in the periphery. Acuity is <em>Scharfe</em> in German and <em>scherpstelling</em> in Dutch, i.e., sharp-rendering. Jerome Lettvin: Things are less distinct as they lie farther from my gaze.</p>
      <p>In the “crowding” literature there is the perception that feature-detection is preserved, but feature integration is messed up with the result that what we see sidelong while fixating elsewhere is a jumbled percept. Jerome Lettvin: It is not as if the things go out of focus—but rather it’s as if somehow they lose the quality of form.</p>
      <p>While Rosenholtz and colleagues use a summary statistics representation to help provide a visualization of the representation of shape and location information at the feature-level of printed text in the periphery that illustrates the limitations (see: <a href="http://typophile.com/node/92761" title="http://typophile.com/node/92761">http://typophile.com/node/92761</a>), Hunziker uses spatial frequency band-pass filtering to explore the positive effects: what unsharp-rendering does to joins, hatched lines, expression, ambiguous and impossible figures, flicker and dark-light styling (notan) in parafoveal vision. See: <a href="http://books.google.ca/books?id=8EWbTwAPxrsC&amp;printsec=frontcover&amp;dq=%22im+auge+des+lesers%22&amp;hl=en&amp;sa=X&amp;ei=JlPzT_u0FenF0QG03bXYCQ&amp;ved=0CDIQ6AEwAA#v=onepage&amp;q=%22im%20auge%20des%20lesers%22&amp;f=false" title="http://books.google.ca/books?id=8EWbTwAPxrsC&amp;printsec=frontcover&amp;dq=%22im+auge+des+lesers%22&amp;hl=en&amp;sa=X&amp;ei=JlPzT_u0FenF0QG03bXYCQ&amp;ved=0CDIQ6AEwAA#v=onepage&amp;q=%22im%20auge%20des%20lesers%22&amp;f=false">http://books.google.ca/books?id=8EWbTwAPxrsC&amp;printsec=frontcover&amp;dq=%22i...</a> , page 32 and 33. I don’t know how to reconcile the two accounts, but essentially, for Hunziker, unsharp rendering makes some things more salient and others less intrusive, which probably benefits saccade planning and the subsequent foveal uptake of information around fixation. At least, I think that’s Hunziker’s point.</p>
      <p>I raise this, because being aware of this parafoveal preview benefit dimension is also relevant to ease.</p>
