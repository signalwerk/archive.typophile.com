      <p>&gt; Kevin has addressed an issue that doesn’t exist.</p>
      <p>I wish that were true. I’ve been told by many typographers that we recognize words by simple word shape, and the idea frequently appears in typography texts. I’m not terribly interested in arguing if anyone still believes this, as I hope that everyone moves on to more interesting theories of reading (and I’ll note here that Peter Enneson and William Berkson do not argue for simple word shape).</p>
      <p>My goal with this paper was to bring modern psychology and typography closer together. For a long period of time typography has had little influence on reading psychology and reading psychology has had little influence on typography. Since writing this paper I have been involved in a number of collaborations that I would consider very successful. I am hopeful that such collaborations lead to interesting benefits for both typography and reading psychology.</p>
