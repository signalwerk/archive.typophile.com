      <p>[James Felici as quoted by Kevin] <em>Our comprehension of the text we read is based largely on the tops of lowercase letters, the bottom halves consisting mostly of “legs and feet.</em></p>
      <p>Consider this very recent paper:<br>
      Perea, M., Comesaña, M., &amp; Soares, A.P. (in press).<br>
      “Does the advantage of the upper part of words occur at the lexical level?”<br>
