      <p>Kevin, the examples you give are rationalizations—peoples’ idea of the state of scientiﬁc understanding of reading, not how they choose type. In practice, the Rehe paradigm would be interpreted with regards to the plastic categories by which we categorize typefaces, primarily x-height size, because that’s just about all the simple outline model reveals (apart from ascender overshoot of cap height, relative lengths of ascenders vs. descenders, and particularly florid /f’s). </p>
      <p>And typographers, even though they may believe the “top half of the letters” theory, don’t just look at the top of words when choosing types, carefully censoring the irrelevant nether regions with a piece of paper…<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Hamburgefonts_4563.png"></div><br>
      …but would, if they are concerned with that aspect of readability, interpret it as mitigating against Futura-ish styles, with their samey /a and /o, and in favor of a humanist sans or an old style serif face, because those have the greater variety in the upper-x height region.<p></p>
      <p>How else could one directly implement such precepts?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Mantovani1_5864.png"></div><br>
      I mentioned the more typeface-speciﬁc word-shape appraisal method above, which takes into account ﬁner-grain qualities, e.g. the balance of letter space, the harmony of curves, and the relative proportions of counters: this is the most probing word-shape appraisal method, employing as it does taste (acquired aesthetic discrimination), but it is not strongly related to any one in particular of the scientiﬁc word-shape paradigms.<p></p>
      <p>Theory and belief don’t translate directly into practice, they’re not coincident, yet they don’t contradict one another.</p>
