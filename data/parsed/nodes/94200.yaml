      <p><em>...it's my personal analysis (intuitive, not scientific) of what distinguishing characteristics there are in words that could explain their ability to distinguish.</em></p>
      <p>How about letter shapes? Or if you want to get complex, how about patterns of letter-distinguishing features? Why intuit that an object made up of letters is distinguished by something other than letters? What is salient about the baboon study is that orthographic processing is taking place at a high level of competence and reliability, and I doubt very much if word shape is even capable of providing the kind of distinctions necessary. Word shape is a pretty crude signifier for orthographic processing, because so many words and non-words have very similar shapes, e.g. bed bcd, the tke.<br>
      ____</p>
      <p>Kevin: <em>I’ve been told by many typographers that we recognize words by simple word shape, and the idea frequently appears in typography texts.</em></p>
      <p>Does it? What I've heard and read often is that 'We read whole words', but I've seldom encountered this presumed process described in detail, let alone specifically in terms of 'simple word shapes'. And I'm not sure that any typographer's concept of a simple word shape corresponds at all to the kind of boxes around the outside of letters that seem to be the interpretation of the phrase illustrated by the psychologists. Remember, typographers are the same folk who are always banging on about the importance of the white, so any concept of word shape held by typographers seems bound to involve a figure/ground relationship.</p>
