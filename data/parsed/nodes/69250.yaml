    <p>First post, no longer stalking the forums! Hooray!</p>
    <p>Anyway, I need some help. I'm working on my personal portfolio and obviously have to create an ID for myself as a motion graphics designer. I've more or less decided on the following:</p>
    <p><a class="freelinking external" href="http://www.midmotion.com/m_bw.gif" rel="nofollow">http://www.midmotion.com/m_bw.gif</a></p>
    <p>But I've worked myself into a corner, perhaps because of the line weight of the logo. I can't figure out what I should do with the type at this point, or even whether it should be an extension of the logo or at the bottom.</p>
    <p>Does anyone have any ideas for a suitable typeface?</p>
