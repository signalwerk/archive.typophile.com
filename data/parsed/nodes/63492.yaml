    html: |-
      <p>What if a chapter starts with a long poem, and rewrite is not an option?<br>
      Shold one:<br>
      A. Drop cap the first instance of prose text. (might fall on the next page, or even further down the queue)<br>
      B. Abandon drop caps in that chapter.<br>
      C. Attempt to drop cap the first line of the poem (might look mighty weird.)</p>
      <p>So far, I am leaning towards B<br>
