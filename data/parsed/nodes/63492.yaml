    html: |-
      <p>It could be "27" dropped or raised followed by "thousand and 546 customers..." or even "27," followed by "546 customers..."<br>
      The main reason for drop caps in commercial and editorial applications is to grab attention. It is even more attention grabbing when there are numbers involved so I don't see why they should be treated as an exception.<br>
      Another great one would be a drop cap question mark in Spanish or a drop cap # in a text dealing with html or coding.</p>
