    html: |-
      <p>This is more of a raised cap<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/P1130804_5547.JPG"></div><br>
      It's interesting how the whole number "18" is raised. In the case of 2010 which is longer it might be more problematic to drop the whole thing. But it's very eye catching editorially: it's obviously a year and it makes people want to know what happened in 2010 but I think aesthetically it depends on how condensed the drop cap face is and how wide the column of text is.<p></p>
