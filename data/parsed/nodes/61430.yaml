    <p>Hi All,</p>
    <p>I am currently working on a small exhibition for university alumni. Because of budget and the lack of visuals, I will be relying on mainly on typography. It would be great if I could pick the brains of the more experienced designers here.</p>
    <p>I am just wondering if there is any rules of thumb for determining type size when reading from a wall (or is it just a matter of testing it out?). In particular, how would one size lengthier blocks of text, such as the introduction. What other considerations should I keep in mind when designing in this context?</p>
    <p>Thanks in advance!</p>
    <p>Cheers,<br>
    E.</p>
