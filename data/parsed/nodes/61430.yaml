    html: |-
      <p>The AIA's Architectural Graphic Standards has some information on this. It's a relatively expensive book, but well worth it for much more than just that tidbit of info. There are some other books dealing specifically with exhibit graphics, but I'm not sure of the titles. The problem with the AIA book is that it deals strictly with size and not type selection and spacing. As mentioned above testing is the best way to go.</p>
      <p>My key bit of advice, based on seeing this mistake many times, is to use a scale figure on any elevation drawings you make. Most designers are more experienced with print and page design. They tend to forget that a wall is not the same as a page and I've seen many exhibit graphics with text placed at the viewer's waist or even knees.</p>
