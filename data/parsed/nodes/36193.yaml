    html: |-
      <p>I prefer the first group, too, because the horizontal line joined with the “p” resembles a tire mark — as if the word “Short Stop” has been moving on high speed and just come to a stop with squeaking tires.</p>
      <p>On the negative side, “FOOD MART” is in disharmony with “Short Stop”, because the two fonts are too similar to each other. There is a typography principle saying, “don’t put similar typefaces together — use either the same one or distinctly different ones.” In this case, the letters of “FOOD MART” appear too wide and too thin — because they are, in comparison to the letters of the dominant “Short Stop”. My recommendation: Try change the font of “FOOD MART” to the same as “Short Stop”, and if “FOOD MART” as a whole come out too narrow, try increase its letter spacing.</p>
    html_clean: |-
      <p>I prefer the first group, too, because the horizontal line joined with the “p” resembles a tire mark — as if the word “Short Stop” has been moving on high speed and just come to a stop with squeaking tires.</p>
