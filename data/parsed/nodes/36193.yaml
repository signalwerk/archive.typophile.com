      <p>Shadow on top of the line looks *way* better to me. Otherwise it’d be very wired, as the descender of the “p” would appear shortened.</p>
      <p>The new typeface for “FOOD MART” looks great, and I agree that the letter spacing needs to be reduced as a result (as in #2 from your latest batch).</p>
      <p>The lines at the sides of “short stop” aren’t much of a improvement to the logo, but they don’t hurt either. If you do want to include them, I’d definitely go with #2 from your latest batch, and I’d further decreased the thickness of the lines — to equal that of the base line (separating “short stop” from “FOOD MART”). I’d even consider giving them shadows, too, for consistency with “short stop”.</p>
