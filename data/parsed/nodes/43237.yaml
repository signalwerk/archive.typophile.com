    <p>Hello</p>
    <p>I've been working on a logo for a church as a freelance gig for the last couple of months. I've gone through several revisions with them, and have narrowed the logo down to a finalist. I think the chosen logo fits the church; it's modern enough to appeal to the local suburban community, but doesn't completely do away with tradition either.</p>
    <p>I'm at the point where it's time for final tweaks. This is always easier said then done. I'm still reletively fresh out of school, so I'm still somewhat inexperienced in completely finalizing my concepts.</p>
    <p>Any help or advice would be very appreciated, especially for the symbol.</p>
    <p>Thanks</p>
    <p>Michael</p>
