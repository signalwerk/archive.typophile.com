      <p>This is great.  Any time you can design a logo for a church where the client doesn't demand a cross is a success.  (I designed a logo for the church I work for, and everyone flipped when I even suggested not using a cross.  Then I recently used it in an application and was told it wasn't "Christian" enough ... I really can't win with these folks, but I've already said too much about my own problems.)</p>
      <p>The only issue I have is that I also see hands first, and then the dove.  Is there any way you can make the hands a bit more subtle so that the dove is more dominant?  (Maybe have the hands overlap so they're not so discrete.)  The former definitely has a "happy hands" feel to it, and then one says, "Oh, but it's also a dove."  I imagine saying, "Oh, a dove ... but it's also hands - neat!" would be a better response.  Overall, though, it's very nice.</p>
