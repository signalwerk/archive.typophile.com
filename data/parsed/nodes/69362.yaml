    html: |-
      <p>If I understand the RFP correctly, what they want is a simple way of dealing with a situation where glyph variants are semantically significant to their user community. From experience of working with very similar material, I'm sure they get text submitted to them using all sorts of random kludges - for instance, I worked for a while on a book that had a lot of Greek coins, where the author had typed Cyrillic che to represent the Hellenstic-Roman shape of Greek koppa, and the element symbol from set theory for lunate epsilon. It's time-consuming to fix a book-length manuscript full of this kind of thing, and it requires knowing more about epigraphy than most editors/typesetters do. So I think they want to create an integrated system that channels people into doing things the "right" (i.e., standards-compatible) way.</p>
      <p>One large problem, as John says, is that even if all the pieces of what they want are individually doable, making the whole thing work well may not be. If the workflow involves an author typing her/his text in a word-processing program, and then a publisher moving this into a page layout program and/or into a website management system - all the while maintaining control over minor variations in glyph forms that are of stylistic or chronological relevance - well, how do you manage all the variables? Is the author using Mellel on Mac or OpenOffice on Linux? Or do you create a workflow that only allows Word 2010 on Windows? And my limited knowledge of TEI does not suggest to me any easy way to make the whole thing compatible with TEI XML while retaining all glyph-variant information: perhaps if I actually read the spec I'd find something, but it seems at first glance like it would require a fair bit of scripting to get glyph-level information out of one system and into another.</p>
      <p>What they need is a team, not a type designer, and I really wonder if they budgeted in accordance with what they're asking for.</p>
