    <p>Dumbarton Oaks Research Library and Collection Publications is EXTENDING our call for bids to create new scholarly inscription font. We are inviting professional type designers to submit bids for the creation of Athena Ruby, a font for the publication of inscribed coins, seals, and other objects from the Byzantine world. We are extending the bidding process through May 21, 2010.</p>
    <p>We would really love to see more bids from designers interested in this unique opportunity. This typeface will be used by Byzantine scholars world wide in the study of ancient material culture. You can be a part of the proud history of this contribution to the scholarly community!</p>
    <p>For complete specifications for the Athena Ruby typeface and the bidding process, please go to <a href="http://www.doaks.org/publications/athena_ruby_bids.html" title="http://www.doaks.org/publications/athena_ruby_bids.html">http://www.doaks.org/publications/athena_ruby_bids.html</a>.</p>
    <p>if you have any questions or concerns about the bid specifications, please contact us at <a href="mailto:AthenaRuby@doaks.org">AthenaRuby@doaks.org</a></p>
