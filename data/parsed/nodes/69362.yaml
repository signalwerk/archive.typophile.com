      <p>Eben, the point of having a transcription font like Athena Ruby is to transcribe text in a way that represents the physical appearance of that text. But at the same time, you want that text to be searchable based on the underlying character. Eleven different shapes of the letter Alpha are still all the letter Alpha. Ideally, you want users to be able to do two things: to search for text and to search for uses of particular variant letters, since both of these are of interest to students of numismatics and sigillography: what a text says and what a text looks like. A scholar wants to be able to say ‘Show me all the coins/seals that include the following word’ and also to say ‘Show me all the coins/seals that use this particular form of Alpha’.</p>
      <p>And as I hope this makes clear, no, I am not talking about using MS Word. :)</p>
      <p>___</p>
      <p>David: <em>...as John says, is that even if all the pieces of what they want are individually doable, making the whole thing work well may not be.</em></p>
      <p>I don't think I said that. I said that the actual type design bit was easy, but I don't think the rest of it is not doable. I do think that it will take some time to pulls all the pieces together, and fully expect the process to involve things like proposing new characters to the UTC, extending the TEI XML to include glyph variant information, mapping this information to OTL features via style sheets. All doable, but yes, more than just designing a typeface.</p>
