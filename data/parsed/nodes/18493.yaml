    html: |-
      <p>Another way of looking at this though, is that Windows fonts are relatively untested on Mac OS. If a font developer is developing a “Windows” TrueType font, they may not bother testing to see if it works properly on Mac OS. This may be particularly true for greymarket/free fonts, which I’ve experienced problems with. In the case of legacy font files, I’m not sure there is anyone necessarily at fault. It may be that the font worked fine on the OS for which it was intended.</p>
      <p>In general, if the font was built according to spec, it should work. However, I think it is perfectly rational for for a printer to want to avoid them. Licensed fonts from major foundries are not likely to be the problem, of course.</p>
