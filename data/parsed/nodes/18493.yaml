    html: |-
      <p>A TrueType font must contain a ‘cmap’ table for the platform you want to use.  In the old days, this meant that a TrueType font that only had a Windows ‘cmap’ table would not work on Mac OS and vice-versa, because without that table, the OS couldn’t figure out how to map characters to glyphs in the font.</p>
      <p>These days, almost all recent-vintage fonts have Unicode ‘cmap’ tables, and current versions of both Windows and Mac OS X know how to use them.  However, older programs may not react well to fonts that are missing the ‘cmap’ for your particular text encoding.  In general, though, if it <em>looks</em> like the font is working, it’s working.  Just keep these things in mind (for example, if you send a job using such a font out for printing, then if the printer is using an older OS or older version of the program, you may run into difficulties).</p>
