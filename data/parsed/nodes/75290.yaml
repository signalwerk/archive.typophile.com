      <p><strong>Toning down the Latin characters</strong></p>
      <p>I had taken "Tuffy" as my starting point and transformed the Latin letters to be roughly the right size and boldness. </p>
      <p>However this was not enough and I still had to make the characters  a little less strident.  This was done by making the stroke width of the Latin characters narrower than the stroke width of the Hebrew. The stroke width of the numerals was somewhat between these. However this wasn't enough! </p>
      <p>I then changed the shape of some Latin glyphs to make them less dominating. For instance, as verticals are so dominating, I tilted some of them slightly. The tilt is just enough to weaken the appearance of the stroke. Another device was to choose a variant of the letters a, e, g, etc that would be less dominant (usually the script version). Also some of the horizontals can be tilted in A, B, E, F etc. </p>
      <p>I also made the Hebrew fairly high indeed almost as high as the Latin uppercase. </p>
      <p>Another way of reducing the difference in appearance between Latin and Hebrew is to increase the strength of the verticals in the Hebrew and reducing the strength of the horizontals. This goal is aided by making the Hebrew letters a bit narrower and taller.  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/_20101015_latin_letters_4538.jpg"></div><p></p>
