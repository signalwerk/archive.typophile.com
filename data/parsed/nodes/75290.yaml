      <p>I agree.</p>
      <p>Sans here means usually mono-width of the strokes. David is not really mono-width.</p>
      <p>Plus, Hebrew is vertical dominant, while Latin is horizontal. I think that you refer to this.</p>
      <p>But Hebrew and Latin can be "matched", even where Hebrew is vertical dominant, and where Latin is horizontal dominant, by apply a well-known graphic art principal referred to as "color" - the overall color of the texts; meaning, the relationship between the black or filled in areas of the page, and the white spaces, the unfilled in areas of the page.</p>
      <p>The goal is to create a balance or harmony between the black and white of the lines of type.</p>
      <p>I say "lines of type" and not the entire page.</p>
      <p>Why?</p>
      <p>If it were the entire page, and the text had increased leading or line-spacing, then the Hebrew type (if matched to the Latin - as opposed to the Latin being matched to the Hebrew) would need wider widths and increased white space inside the letter strokes.</p>
      <p>Altering the letter and word spacing would look wierd, and be incompatibe with the Latin.</p>
