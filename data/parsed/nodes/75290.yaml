      <p>What do I mean by  "Matching Hebrew and Latin"?</p>
      <p>First, lets clear out of the way, what it doesn't mean!  I did not want to make changes to the Hebrew letters<br>
      to give them the style of a Western Alphabet, nor did I want to make changes to the Latin characters to give then a Hebrew appearance.  Each would retain its identity. </p>
      <p>The matching is achieved by balancing boldness, horizontal and vertical features and angularity.</p>
