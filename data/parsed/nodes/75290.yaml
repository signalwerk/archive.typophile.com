      <p>In general, I'm of the opinion that in harmonising different script one should focus on overall weight and proportion, with secondary attention to featural harmonisation only within the limits of the cultural conventions of the individual scripts, e.g. one should avoid trying to make Hebrew look like Latin or Latin look like Hebrew. That said, there are situations in which the overall context of a piece of lettering or typography admits of such things. The images below are from the Holocaust memorial at the Jewish cemetery in Prague. Within the overall architectural and graphic context of the memorial, the decision to write the Czech text with a Hebrew ductus makes good sense and is visually arresting:</p>
