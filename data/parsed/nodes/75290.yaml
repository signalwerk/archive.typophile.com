    html: |-
      <p>There are a few typefaces called Stam, based upon one common ancient design.</p>
      <p>One is basic, and the others have embellishments. The latter are used for titling. Until about 40 years ago, Stam was popular in Israel, as it preserved a traditional look.</p>
      <p>Stam is an acronym for three ritual objects: Sefer Torah, Tefillin, and Mezuzot, and often refers to the composition performed by Jewish ritual scribes in composing these objects.</p>
      <p>The actual type design that they use is not Stam, but actually Ktav Stam, which is quite different.</p>
      <p>Clearly, the design of Stam, many centuries ago, was modeled after Ktav Stam.</p>
      <p>The ' after the S apparently is an allusion to its being an acronym, or has no meaning at all. Often, matters in the Letraset of Israel catalogue were made simply for legal reasons. I met the old owner in the mid eighties.</p>
      <p>Letraset of Israel was notorious to producing popular designs with minor differences, and subtle name changes, to avoid payment of royalties.</p>
      <p>I believe that this is why Henri Friedlaeder wanted to offer special insights, because I sent him a modest royalty check, as I felt it was the right to do. He liked that sincerity.</p>
