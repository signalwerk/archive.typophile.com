      <p>This list of things I've compiled may help you:<br>
      (Sorry, it's missing a bibliography - I can put that together later.)</p>
      <p><strong>On designing Hebrew and Latin type<br>
      for simultaneous use:</strong></p>
      <p>1. Respect must be taken for the merits of the traditional forms of each script<br>
      2. There are two poles in which to take pairing Hebrew and Latin: First, is to try and make the the Hebrew and Latin as close as possible. Second, to try and contrast between the two as much as possible. The best method is probably somewhere along the axis between these poles where it is made to match the Latin but still provide contrast.<br>
      3. The foremost goal of a family containing both is to produce a similar color; however texture between scripts is both inherent and necessary for distinction.<br>
      4. Sharing proportions seems ideal, for example aligning the Hebrew body height with the Latin x-height, but in reality the best proportions for use with u&amp;lc Latin is somewhere between the cap- and x-height. Extenders may want to follow similar measurements with the Latin extenders - but only if that is feasibly allowed by the proportions of the Latin glyphs and Hebrew body height.<br>
      5. Characteristics from Latin can successfully shared with Hebrew by using similar shapes of serifs and "pen marks" respectively, as will as similar terminals.<br>
      6. It should be noted that, when used with Latin lowercase only, the Hebrew body can successfully use the Latin's x-height. When used with uppercase, it should usually be scaled to cap-height.</p>
      <p><strong>Things to keep in mind when designing Hebrew fonts:</strong></p>
      <p>1. Hebrew does not sit on a baseline but rather hangs.<br>
      2. Hebrew can be better understood in the same way Latin can by categorizing the glyphs into rounded, square, and diagonal forms.<br>
      3. It can also be better understood by categorizing in terms of structure of joins: whether the roof connects to stems smoothly or with two connecting strokes.</p>
      <p><strong>Hebrew "Serif" or "Pen Mark"</strong></p>
      <p>According to hafont.com, a Hebrew word for the "serifs" is עוקץ, which, translated means barb, or sting. Because thed finishing marks are Hebrew, we should therefor use this Hebrew name—transliterated awkyts. Thus: Awkyts fonts and Sans-Awkyts fonts. Since sans does mean without, and many fonts are already referred to as "sans", continuing to use the term sans is best.</p>
