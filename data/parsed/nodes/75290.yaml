    html: |-
      <p>The illustration is crude, I admit. It was to illustrate that Hebrew does have, natively, the materials needed, if desired, to create a writing system similar to that of the Latin alphabet, where one has an upper case (modern square script - the Kaph at the beginning of both sentences), a lower case (ancient Semitic), and italics where the lower case (cursive) has a cursive quality. (The semi-cursive "Rashi" script could have been considered as well.)</p>
      <p>One could do the same with Georgian, by using the current Mhedruli script as the basis for the cursive italic lower case, and the old Hutsuri script for everything else.</p>
      <p>And Armenian already has an upper and lower case, and the cursive could be obtained from Armenian handwriting.</p>
      <p>But Greek has a problem, it seems to me. The existing Greek lowercase is cursive already. A non-cursive Greek lower case could, I suppose, be derived from Cyrillic as a model.</p>
