      <p>Homogenizing all these alphabets sounds great in theory. And it would be extremely interesting. But no one ever said they need to be the same. And you have to ask if making them work the same and have all the same types of emphasis makes these languages no longer themselves. What I mean is, if Hebrew is Hebrew, let it be Hebrew. Your example does use only Hebrew, but from widely varying eras. I think native Hebrew speakers wont except it. At the same time, speakers of Latin-like languages might like it better. I think Hebrew cursive / italics would work, and, as it seems, sometimes Israeli newspapers and magazines do use computer generated slanted versions. But from what I understand, most people don't think cursive are formal enough for most jobs, although it's great for handwriting.</p>
      <p>In my opinion, we should let Hebrew be Hebrew and English be English. At the same time improvements and developments come along, sometimes only as trends. So I think, yes, italic is feasible, but a bicameral alphabet ain't gonna happen for Hebrew. :)</p>
