      <p><strong>Appearance of parallel texts.</strong></p>
      <p>A translation or a transliteration of the Hebrew, is by definition secondary in importance to the original Hebrew.  The "toning down" of the Latin that I have described above goes a long way to achieving this also in appearance.</p>
      <p>However there is still more to do and some changes to the Hebrew may be necessary.<br>
      A page of Hebrew and a page of Latin usually a quite different overall appearance. The Hebrew page appears as horizontal gray stripes with a fairly large horizontal space between the lines.  In contrast, the Latin page looks a more uniform gray. </p>
      <p>For "Mike Hebrew", the horizontal grey stripes are less obvious for a number of reasons.</p>
      <p>a) The font does not have strong horizontals at top or bottom of the glyphs.<br>
      At the top, most of the "horizontals" are tilted so it's not clear exactly  where the top of the line is. This effect is enhanced by the fact that the horizontals differ greatly in length.</p>
      <p>b) The baseline is made less sharp by having various letters or parts of letters not quite reach the baseline or extend slightly below it. For example the legs of the Het are of different length. Additionally, in "Mike Hebrew" the letters often overlap, for instance the lower left of letters Bet, Caf, Nun, Ayin, Peh and Tsadeh may go underneath the following letter (to its left).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/_20101015_parallel_texts_6045.jpg"></div><p></p>
      <p>I should emphasize that all these considerations are for "Mike Hebrew" and a matching set of Latin for another Hebrew font could be quite different.  However all of the design issues listed here would have to be considered.</p>
