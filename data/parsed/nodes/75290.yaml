      <p>So, the height of the Hebrew is somewhere between the x-height of the lowercase and the cap-height of the uppercase, as you mention. </p>
      <p>I propose that the distance of the height is determined by the width - (where the width of most of the Hebrew letters is wider, then their height is lower; where the width of most of the Hebrew letters is narrower, then their height is taller) - and the stroke width - (where the stroke width of the Hebrew letters is wider, then their height is lower; where the stroke width of the Hebrew letters is narrower, then their height is taller).</p>
      <p>These two factors determine compatible appearance, the amount of text within a given area, and the matching 'color' of the text.</p>
