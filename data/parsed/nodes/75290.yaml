    <p>This post describes how I have created matching Hebrew and Latin for my own font "Mike Hebrew".</p>
    <p>I did not add this post to the "Creating a Merger of a Latin and a Non-Latin Font Style" because many of the replies did not deal with designing fonts.  Furthermore don't want to be involved in criticizing other people's fonts, other people or to argue about history etc.</p>
    <p>This design problem  will be different for each kind of Hebrew font.  If the Hebrew font is Frank Ruel then the solutions will be quite different to solutions that would be appropriate if the Hebrew font is Levenim.  The is NO SINGLE SOLUTION. </p>
    <p>What I write here only applies to matching the Hebrew and the Latin letters in my own "Mike Hebrew" font.<br>
    The early versions of this font did not have a matching set of Latin characters which caused two problems:</p>
    <p>a) When Hebrew was displayed or printed, and it contained a few English words, numerals or even Western punctuation the resulting use of the my computer's default Western font was sometimes hideous.</p>
    <p>b) On a page with columns of Hebrew and parallel English translation, the baselines of the English did not line up correctly with the Hebrew.  Also the English usually dominated the page if the point size was the same.</p>
    <p>It proved difficult to find matching Latin fonts to fix these problems so  I developed "Mike Hebrew" with a set of Hebrew, Latin, numerals, punctuation, currency symbols and so on that would all match.</p>
