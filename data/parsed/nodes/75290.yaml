      <p>&gt;&gt; An o-ketz is used long before hafont.com decided it was a good word for a serif.</p>
      <p>Of course. But I had never seen it used anywhere before, so that is what I quoted.</p>
      <p>&gt;&gt; A good Hebrew font does not reach the x-height of the lowercase English letter, because then it will appear too small in comparison with the English font.<br>
      &gt;&gt; A good Hebrew font does not reach the x-height of the uppercase English letter either, because then it will appear too big in comparison with the English font.</p>
      <p>You must have misunderstood. I said:<br>
      <em>4. Sharing proportions <strong>seems</strong> ideal, for example aligning the Hebrew body height with the Latin x-height, but in reality the best proportions for use with u&amp;lc Latin is somewhere between the cap- and x-height. Extenders may want to follow similar measurements with the Latin extenders - but only if that is feasibly allowed by the proportions of the Latin glyphs and Hebrew body height.</em></p>
      <p>What I meant was, for most cases, where the the text is in both upper- and lowercase, you should make the Hebrew body height somewhere between the cap- and x-height of the Latin. But for the rare case when the latin is in lowercase only, the Hebrew should align at the x-height <em>optically</em>.  (Read: very slightly larger than x-height, to compensate for extenders.Likewise, when the latin is all-caps, then the hebrew should align to cap-height <em>optically.</em> Understand what I mean?</p>
      <p>&gt;&gt; What is a serif? Many scholars belief that it was an area on a letter intended for ink to gather. I think that this opinion is lame, for many fonts have serifs that play an important part in the attractiveness of the entire design.</p>
      <p>My understanding was that serifs where calligraphic finishes at the ends of strokes, at least in Latin designs. People speculate these originated from inscriptions in stone, where they were used sort of as a grid. Others point out these were probably first written on somehow by a scribe. Whatever the case, no one knows the true original purpose of serifs. Regardless, they serve a purpose for many fonts today.</p>
