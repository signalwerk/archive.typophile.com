      <p>An o-ketz is used long before hafont.com decided it was a good word for a serif.</p>
      <p>First, hafont.com is no Eliezer Ben-Yehuda, who defined much of modern Hebrew from its usage in ancient Hebrew. Eliezer made mistakes.</p>
      <p>What is a serif? Many scholars belief that it was an area on a letter intended for ink to gather. I think that this opinion is lame, for many fonts have serifs that play an important part in the attractiveness of the entire design.</p>
      <p>Only diagonal lines reach below the baseline. Most Hebrew fonts do not have diagonal lines; hence, most Hebrew fonts sit firmly on the baseline.</p>
      <p>A good Hebrew font does not reach the x-height of the lowercase English letter, because then it will appear too small in comparison with the English font.</p>
      <p>A good Hebrew font does not reach the x-height of the uppercase English letter either, because then it will appear too big in comparison with the English font.</p>
      <p>Rather, a good Hebrew font will be below the x-height of the uppercase English letter, and below the x-height of the lowercase English letter, and the stroke widths should match.</p>
