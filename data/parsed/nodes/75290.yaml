      <p>I like Mike Hebrew very much.</p>
      <p>I don't think it matches the English at all, although it too is very good.</p>
      <p>The Hebrew has many diagonals, and descenders. The Engish does not, though both are informal.</p>
      <p>I would draw an English set with the Hebrew attributes, stroke widths, etc., much like the Hebrew. I suggest that the Hebrew letters should never touch. This is difficult with descenders. To achieve this, OpenType and Volt can be used, with many additional alternative glyphs, and ligatures. GOSUB can address these replacements automatically.</p>
      <p>So, whenever a string of characters are entered at the keyboad, that string will be replaced or SUBstituted by a different group from the font.</p>
