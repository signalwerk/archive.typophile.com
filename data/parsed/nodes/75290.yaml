      <p>I was looking through the various Hebrew faces on MyFonts to find out if the glyph repertoire of Code Page 1255 was indeed typical. I noticed that - as for Roman fonts - there were many display faces, many sans-serif faces, many calligraphic faces... but not that many classic faces.</p>
      <p>Looking at Frank Ruehl as displayed there, it seemed like that face showed its age, and gives a visual impression more like a Scotch Roman than Times Roman. So I thought to look through and see what there was that could be used instead of it.</p>
      <p>Looking through hundreds of faces, I found these:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/lighthouse/hamuel-nine-five/" rel="nofollow">Hamuel 95</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/lighthouse/kitra-77/" rel="nofollow">Kitra 77</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/masterfont/le-be-mf/" rel="nofollow">LeBe</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/masterfont/mimi-mf/" rel="nofollow">Mimi</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/masterfont/frenkel-mf/" rel="nofollow">Frenkel</a></p>
      <p>Now, there were other ones also suitable for text use. I excluded Mugdar from consideration as I thought of it as specialized, like Optima. And not being a reader of Hebrew, I couldn't tell if <a class="freelinking external" href="http://new.myfonts.com/fonts/masterfont/parshanut-mf/" rel="nofollow">Parshanut</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/masterfont/or-halevana-mf/" rel="nofollow">Or Halevana</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/masterfont/new-livorno-mf/" rel="nofollow">New Livorno</a> might have been considered acceptable for standard text use, and so I erred on the side of caution and dropped them from the list.</p>
      <p>And many other fine faces I excluded from consideration as being calligraphic in nature, although for a face to be calligraphic appears to be more normal in Hebrew typography than in Latin typography.</p>
      <p>It is, of course, the people who live in Israel and use Hebrew who would know what aesthetic to apply to Hebrew typefaces, but I am curious as to whether my guess as to what looks ordinary like Frank Ruehl, but a bit cleaner and more modern than it, is correct.</p>
