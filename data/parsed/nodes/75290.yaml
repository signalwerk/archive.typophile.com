      <p>Here is a rough sketch of what Hebrew might look like if existing scripts for the language were used to give it upper and lower case, and italics, in imitation of Roman script, but without taking any letterforms from an external source:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hulc2_6425.jpg"></div><p></p>
      <p>The text used is from the United Nations Declaration of Human Rights. The first sentence is normal, the second in italics. Note that the italics are, like Roman italics, sloped forwards in the direction of reading - and, thus, to the left, not to the right.</p>
