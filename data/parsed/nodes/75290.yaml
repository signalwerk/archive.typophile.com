      <p><strong>Appearance of embedded Latin words, phrases, or short sentences in Hebrew text.</strong></p>
      <p>The design of "Mike Hebrew" is intended to have the Latin blend in an unobtrusive manner. A short run of Latin characters should not disturb the appearance of a page of Hebrew.  The "toning down" of the Latin characters I have described above seems to solve this problem.</p>
      <p>The rag-bag of characters such as currency, copyright, ampersand etc are designed to work with both English text and Hebrew text although in "Mike Hebrew" working well with Hebrew is given precedence.</p>
      <p>Israelis often use Western punctuation such as comma, period, quotes etc with their Hebrew and the result can be hideous unless they are designed to match the Hebrew first and the Latin second.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/_20101015_embedded_latin_example_4913.jpg"></div><p></p>
