  html: |-
    <p>I'm new to font creation and have almost finished making a font based on an artists hand writing. The problem I have is when I go to "Quick Test" the font the glyphs appears small while the cursor itself if huge (see pic). This also happens when I generate the font and test in Illustrator. I'm sure it's something simple but I was unable to find where to change this value. I would prefer not to recreate the font from scratch. Thanks in advance. Cheers</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/example_8.jpg" width="1366" height="768" alt="">
