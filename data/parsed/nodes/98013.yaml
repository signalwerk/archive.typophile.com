    html: |-
      <p>You probably need to resolve exactly how someone should read this. I had a bit of a time parsing the letters into something pronounceable. If I.T. is an acronym for information technology, then maybe distinguish it a bit more. I am not too familiar with that field, but the name doesn't immediately sound like a brand - more like the name of a sector of that industry. </p>
      <p>/c/ feels too wide - maybe try something more like your original sketch.<br>
      The latest /o/ is nicely improved.<br>
      The thinking behind the latest changes to /it/ is good but the execution doesn't work.<br>
      /s/ leans backward and feels a bit too imprecise for what I am inferring that you are trying to communicate.</p>
