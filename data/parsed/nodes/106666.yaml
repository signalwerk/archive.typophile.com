    html: <p>This is presumably due to RichEdit's font fallback mechanism. I'm guessing there is some piece of metadata missing in the Lucida font that RichEdit is looking for as an indicator of support for particular Unicode ranges. So eveb though the font contains cmap support for the characters you want, RichEdit is switching to a fallback that it knows supports them. Yes, 'tis frustrating.</p>
