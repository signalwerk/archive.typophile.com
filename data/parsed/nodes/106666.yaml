  html: <p>Does anybody have any idea why is Microsoft doing this? Why can't it render the font as Lucida and instead chooses Arial if the typeface has the characters?</p><div class="imageWrap"><img src="http://typophile.com/files/monte 1_3704.png"></div><div class="imageWrap"><img src="http://typophile.com/files/monte 2_5445.png"></div><p></p>
