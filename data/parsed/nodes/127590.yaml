  html: |-
    <p>Good Evening,<br>
    I am Developing a font consisting of around 25000 Glyphs. It consists of All Mushaf (Quran) complete words, with complete Aeraab and all symbols. I've done around 20000 Words created in Fontlab by insert component Technique, Font size in .vfb is around 8MB and after Adding Glyph Substitutions in VOLT, the size goes to around 14MB. I've only used 4 Features in VOLT, Init, Medi, Final &amp; Liga. Not Cursive or Mark Positioning &amp; nothing else. My Font consists of around 20,000 Glyphs which needs to be defined as simple Substitution. I add 20,000 substitution in VOLT. I've also used very small names for my Glyphs to save the space in my font or Volt, Like I define Alif.Isolated with only "aa" and also same for Bay.Initial I just put "bi" in my font.<br>
    I got the problem when I compile the font it gives me Compilation Failed error in VOLT. I noticed after around 3,000 Glyphs Volt shows Compilation Error. Until 3,000 Substitutions it is compiling. I've to add 20,000 Substitutions. I am using VOLT 1.4.<br>
    Any help or idea, how to do this. I remember people added 30,000 glyph substitution in Urdu Nastaleeq Font.<br>
    This is simple Substitution case, Needs Suggestion, where am I wrong, or its VOLT error and how to overcome it.</p>
