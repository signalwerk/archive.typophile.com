    html: |-
      <p>You know, that's a great point that email in browsers could be generally @font-face enabled. Sweet!</p>
      <p>In my case, I get my work email in Outlook, but my personal email in gmail, usually in Chrome. (And both sometimes in my iPhone's Mail app, which also supports @font-face.) So my personal email may always support @font-face, I suppose. Assuming that gmail passes through the inline CSS to the browser or viewing app, mind you.</p>
      <p>One complication for @font-face in email even in the future will be that it presumably won't play well with anybody who doesn't want other people leaching their bandwidth. Folks generally do that via checking the referrer string in the get request. To make this work with email, I think the font hoster would have to allow "localhost" as a referrer, but that would enable *anybody* to borrow the code and use the same font in email (though not for external web sites), with the original host footing the bill for the bandwidth. Leastways that's what it seems like at first thought.</p>
      <p>Maybe I'm missing something, but it seems to me that because of this, web fonts for email would be pretty much be restricted to Google Web Fonts.</p>
      <p>T</p>
