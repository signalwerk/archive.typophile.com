    html: |-
      <p><cite>Any idea of when email will support @font-face?</cite></p>
      <p>It’s not a problem of e-mail per se, but of rendering engines used by e-mail software (for example, Outlook is using Word’s HTML rendering because they couldn’t afford to license IE’s one – I’m not kidding). Since most e-mail clients can display images hosted on remote servers, there’s no reason why they couldn’t do the same with remotely hosted fonts.</p>
    html_clean: |-
