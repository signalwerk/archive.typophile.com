    html: <p>To insure that the recipient can see your message as you designed it, create a pdf with fonts embedded, and send it as an attachment. You could also create a Rich Text Format document (.rtf in Windows). Emails received on mobile devices or received via audio (yes, that's possible too) might not even be able to see attachments, though.</p>
