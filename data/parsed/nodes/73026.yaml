  html: |-
    <p>I've made a basic (very basic) font based on an italian gothic script. At the moment I've included lowercase letters, some contextual alternates, basic punctuation and common accented glyph for italian. </p>
    <p>[for some reasons I can't insert images: you can see the pdf and my  <a href="http://www.flickr.com/photos/danielecapo/4876239508/" rel="nofollow">flickr page</a>]</p>
    <p>This 'gotica corsiva' was used in XIV century to write books in italian language, hence the copies of Dante's Commedia, etc. are written in that way.</p>
    <p>You can find images on the web, searching for 'gotica corsiva'<br>
    <a href="http://www.uniurb.it/Filosofia/bibliografie/paleografia/gotica_corsiva.htm" rel="nofollow">http://www.uniurb.it/Filosofia/bibliografie/paleografia/gotica_corsiva.htm</a><br>
    <a href="http://storiaepolitica.forumfree.it/?t=46050878" rel="nofollow">http://storiaepolitica.forumfree.it/?t=46050878</a></p>
    <p>You can download my version of it, called guido, here: <a href="http://www.danielecapo.com/downloads/guido-beta.otf" rel="nofollow">www.danielecapo.com/downloads/guido-beta.otf</a> (SIL open font license: <a href="http://scripts.sil.org/OFL" rel="nofollow">scripts.sil.org/OFL</a>)</p>
