      <p>Better. Here's my take on it if you don't mind :) -</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/card-2_5249.png"></div><br>
      <code></code><p></p>
      <p>1. space lines closer together<br>
      2. use smaller font size - just try printing out what you have at the moment, it will look ZOOMED IN<br>
      3. remove periods after CELL/EMAIL/WEB and get rid of all caps<br>
      4. use "email" instead of "e-mail"<br>
      5. add www. to the web address - I know that it's not needed, but it looks more conventional this way<br>
      6. add country code to the phone number<br>
      7. put it all on a white background - there is some reasonably priced black/white duplex stock available</p>
      <p>Also I would strongly suggest to NOT use a Gmail address, or any shared email service provider for that matter. Why would I want to email Google when you have your own domain?</p>
      <p>--</p>
      <p>If it were my card, I would also drop cell/email/web altogether. In fact, I would've also dropped the web address, set the email address to <em>me@gigliopierluigi.com</em> and painted <em>gigliopierluigi.com</em> purple. Like so:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/card-2-b_6721.png"></div><br>
      <code></code><p></p>
      <p>But it's me, I just like it minimalistic :)</p>
