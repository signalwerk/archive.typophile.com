    html: |-
      <p>The front is centered and emphatically justified, and the back is neither.</p>
      <p>The use of all caps gives too much emphasis to the relatively unimportant words <em>cell</em>, <em>e-mail</em>, and <em>web</em>.</p>
      <p>The large and uneven space following the words <em>cell</em>, <em>e-mail</em>, and <em>web</em> is distracting. I suggest a smaller, even space, achieved either by centering all 3 lines or by keeping the left alignment but not aligning the telephone number, email address, and URL on a tab. Another possibility would be to omit the words <em>cell</em>, <em>e-mail</em>, and <em>web</em> entirely, because it's fairly obvious what those things are.</p>
      <p>To my American eyes, the space before and after the dash in the telephone number looks too big. Is that the convention for Italian telephone numbers?</p>
