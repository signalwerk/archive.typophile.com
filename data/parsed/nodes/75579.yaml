      <p>I'd agree on leaving off cell/e-mail/web, unless you've got more than one phone number on there I don't see any reason to label any of those.</p>
      <p>Also, on the front side of the card the spacing of "graphic" and "designer" seems a bit awkward to me. I'd probably uniformly align "brand + graphic designer" under your name.</p>
