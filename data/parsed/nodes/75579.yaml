      <p>Why periods after «e-mail» and «web»? They're not abbreviations. «Cell» also isn't the sort of abbreviation that I'd put a period after. But maybe this is local usage.</p>
      <p>Why is «web» highlighted? Is it more important than the other 2 things?<br>
      (Also notice that while it's highlighted in terms of color value, in terms of brightness the pink stands out <em>less</em> than the white. To my eye – and depending on how the print is, etc. – these 2 variables of hue and brightness/contrast work against each other, which may be problematic.)</p>
      <p>Seeing that your URL is [lastname] [firstname], would it make sense to have your logo that way round too?</p>
