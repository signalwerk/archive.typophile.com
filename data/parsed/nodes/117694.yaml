    html: <p>Can't find a match but don't think it's a font, rather a custom lettering for the movie. My suggestion would be to start with <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/mostra-nuova" rel="nofollow">Mostra Nuova</a> mixing Heavy and Heavy Alternate C to get a closer /C. But that would let a lot of work...</p>
