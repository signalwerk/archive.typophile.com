    <p>Hey guys</p>
    <p>First and foremost :<br>
    we (at fluonoir) would like to send you all our best seasonal wishes.</p>
    <p>I'm in the middle of the design of our business cards and would love to receive your feedback.</p>
    <p>Several things have to be said :<br>
    everything (1) &amp; (2) is going to be (black) hot foiled stamped on black plike™ paper except for the (fn) sign on the (2) which will be embossed (hope I use the right english terminolgy).</p>
    <p>What do you think of the design ?</p>
    <p>Virginie<br>
    <a href="mailto:virginie@fluonoir.com">virginie@fluonoir.com</a><br>
    <a href="http://www.fluonoir.com" title="www.fluonoir.com">www.fluonoir.com</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ishot-8_6250.jpg"></div><p></p>
