    html: |-
      <p>So I ordered and just received samples of both Plike and Curious Skin. And my first impressions are the exact opposite of drduckling's.</p>
      <p>Skin feels and looks pretty much like a high quality (matte) cotton paper. </p>
      <p>Plike though is absolutely amazing. It has a texture of a "wet silk" textile or .. uhm .. a very fine chamois. It is also <em>extremely</em> matte. For example, the burgundy sample showed no visible highlights whatsoever when I looked at it from every angle against a light that was 2 feet away. It was really quite something.</p>
      <p>Also, for what it's worth I didn't manage to leave any fingerprints on Plike even though I was sweating with excitement :-) Skin though managed to accumulate few dozens of white speckles by merely being pulled out of the envelope.</p>
    html_clean: |-
