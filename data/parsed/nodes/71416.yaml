    html: |-
      <p>Oldnick, </p>
      <p>Scaling and rotation in FontLab Studio is of course based on integer coordinates, so there are limitation. If you perform multiple additive small operations (scale up-down-up-down, rotate with small degrees back-forth-forth-back etc.), you'll get accumulated rounding errors. One way to avoid it or minimize it is to set the UPM size of the font higher for the design process (UPM = 3000 or even 10,000).</p>
      <p>Fontographer 5, which allows fractional coordinates, is free from those accumulated rounding errors, so in this sense it is very much like Freehand, and somewhat similar to Illustrator. </p>
      <p>In FontLab Studio 6, we won't be able to allow fractional coordinates, unfortunately (since the integer coordinates are buried in many places of the code), but in a later version we do plan to do it.</p>
