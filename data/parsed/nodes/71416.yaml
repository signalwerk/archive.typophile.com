    html: |-
      <p><img src="/sites/default/files/old-images/McKenna_Remix_5121.png"></p>
      <p>The trick for importing is to set the ascent at 100% of the em square height, then add spacer tick marks to the glyphs delineating the top and bottom of said square. Once all of the glyphs are imported, drag a guideline to mark the baseline of the type, and make a note of its vertical position. Then, reset your ascent to match the vertical area above this guideline, and your descent to match the vertical area below. Then, select all characters and shift them down the same number of units as the descender.</p>
    html_clean: |-
