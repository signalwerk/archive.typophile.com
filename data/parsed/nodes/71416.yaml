    <p>Hello there everybody, I've been looking for some information on this forum for a while now and I've registered to ask one question so if you can help me it would be great.<br>
    The problem is that now when I paste some element(s) from Illustrator (CS5) to FontLab (5.0.4) the pasted glyph is for some reason bigger that it should be because I've set 1000pt height in Illustrator and UPM Size in FontLab at 2000 so it should work perfectly and it DID but now, for some (to me) unknown reason it doesn't... And also I've noticed that when I copy the letter (for instance C) and paste it into FontLab it gets bigger (to the height of the Č - the height of the ascender) BUT when I copy letter C and ALSO the letter Č than C is pasted much smaller, something like it should be at 2000 UPM but it still doesn't fit perfect.</p>
    <p>So please if anyone has any answer I would be very grateful :)</p>
