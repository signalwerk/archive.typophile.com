  html: <p>Does anyone know what font is used on Oprah's magazine, i.e. the "O" as well as the caption beneath of "THE OPRAH MAGAZINE"?  What would you suggest as the most similar fonts to hers that are available in Word?  Thanks for your help!</p><div class="imageWrap"><img src="http://typophile.com/files/OprahMagazine_5026.jpg"></div><p></p>
