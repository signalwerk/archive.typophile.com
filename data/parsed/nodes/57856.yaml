      <p>Interesting! I quite like this :)<br>
      I think E and F need to be more divergent. And V and U. And I find L confusing.<br>
      I think AGOQSX need a little overshoot. And I'd think about making the Z have corners on the outside, rather than curves.<br>
      Keep going :)</p>
