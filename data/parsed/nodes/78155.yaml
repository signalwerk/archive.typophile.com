      <p>@oneweioranother<br>
      If you are thinking I'm kidding about not finding Helvetica a readable text face- having to read a whole textbook set in Helvetica really drove me nuts. I was continually having to re-read paragraphs because my brain insisted on seeing letters instead of words. The font is just too regular for extended text. I know a lot of designers disagree, but I really don't like to see more than one paragraph at a time set in Helvetica. Not that I'm against all sans settings. Just not Helvetica (and really not Univers).</p>
