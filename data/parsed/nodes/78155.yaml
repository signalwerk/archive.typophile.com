    html: |-
      <p>This sounds like a piece of bad research, if accurately reported, as the report doesn't mention any control for time. Of course, if you have to spend ten minutes deciphering a paragraph, reading it slowly and repeatedly, you are more likely to remember it. </p>
      <p>The idea of high readability, at least for non-fiction, is that you can read quickly for meaning, and remember what *you* find valuable, not what is forced upon you by repetition from having to puzzle it out.  </p>
      <p>Also for extended text if it is really difficult to read, you are not likely to read it at all.</p>
