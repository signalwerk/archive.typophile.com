    <p>Saw this article <a class="freelinking external" href="http://www.dailymail.co.uk/news/article-1347058/Why-ugly-fonts-messy-handwriting-make-easier-remember-youve-read.html" rel="nofollow">here</a> today, here's an excerpt:</p>
    <blockquote><p>
    Texts in easy-to-read typefaces make it harder to recall information than if it is presented in less legible formats, research suggests</p>
    <p>A study by Princeton University found that a significant number of those tested could recall more information when it was presented in unusual typefaces rarely used in textbooks. </p>
    <p>The research suggests that introducing 'disfluency' - by making information superficially harder to understand - deepens the process of learning and encourages better retention.</p>
    <p>The psychologists said information which has to be actively generated rather than 'passively acquired' from simple text is remembered longer and more accurately.</p>
    <p>The study raises questions over how much fonts like Times New Roman and Arial, which are used in the majority of academic books, help readers revise for tests.
    </p></blockquote>
    <p>and</p>
    <blockquote><p>
    He said the study showed the whole history of typography was had missed the point when it comes to learning.</p>
    <p>Mr Lehrer said: 'It has been a movement towards easy to read fonts. We assume that anything which makes it easier to see the content is a good thing.
    </p></blockquote>
    <p>Jonah Lehrer's take on it is <a class="freelinking external" href="http://www.wired.com/wiredscience/2011/01/the-benefit-of-ugly-fonts" rel="nofollow">here</a></p>
    <p>The study, Fortune favors the <strong>Bold</strong> <em>(and the Italicized)</em>: Effects of disfluency<br>
    on educational outcomes can be read <a class="freelinking external" href="http://web.princeton.edu/sites/opplab/papers/Diemand-Yauman_Oppenheimer_2010.pdf" rel="nofollow">here</a>.</p>
    <p>Thoughts anyone? Did Emigre have exactly the right idea then after all, and are the rest of us <em>really</em> missing the point? </p>
    <p>Perhaps there are holes and flaws in this study. One group's retention rate was tested with material set in Monotype Corsiva, Comic Sans Italicized and Haettenshweiler whilst the group being compared against in the study were reading material set mostly in Helvetica and Arial (legible?), could it just mean reading material in profusely overused typefaces bores the reader easier and allows for laziness.</p>
