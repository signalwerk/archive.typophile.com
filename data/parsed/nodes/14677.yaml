      <p>Mike don't apologize. Please.</p>
      <p>I suppose I'm trying to keep temptation from out of everyone's path. Which is, of course, in itself a completely unrealistic thing to do. If you are tempted by something and want it badly enough you won't stop looking until the so-called itch has been scratched. So to speak.</p>
      <p>As I posted previously I did have second thoughts. But, obviously I didn't pause long enough. It comes down to trust. If we had a wiki full of "evil sites not to visit" would it become a bad thing? Or would it be educational. There isn't a black or white. I know that it would be used for evil and good. Gray is my color today.</p>
      <p>For the record, I wasn't the moderator in this instance. I did ask for Mike to remove the URL and didn't intend to remove it. Well, not today anyway. But, I would have done it eventually. </p>
      <p>How can we approach this? Putting it in the uppercase would be like preaching to the converted. Should there be a wiki? A wiki specific to sites that are wide-spread already but that need to be pointed out as bad? </p>
