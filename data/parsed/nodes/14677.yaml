      <p>Allow me to hem and haw. Is that the right phrase?</p>
      <p>First. I don't take back my stating that education is important. Very important. </p>
      <p>This topic went to bed with me and haunted my dreams. Call me paranoid. We have had a few ugly instances on Typophile in which I have had to archive and delete entire threads because of threats, veiled and otherwise, from lawyers, as well as to protect friends and other typophiles.</p>
      <p>I think we need to make it a habit and a rule of thumb not to post URLs to sites. However, getting the word out to foundries, for warning, can be done through me if need be. Also, if you have a question about a suspicious site, contact one of the moderators. I am personally involved in a private alert group. This is the best way to get sensitive material shared.</p>
      <p>So, I guess I am retracting my second retraction.</p>
