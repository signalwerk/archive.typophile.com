      <p>I think some folks in this thread may not understand the ubiquity of the site in question. Far more know about this site than know about Typophile. del.icio.us is a good indicator of a site's popularity and link volume. The fact that its popularity exceeds that of <em>any other font site</em> -- commercial or free -- shows where the the bulk of the web is going for fonts. It's already out there, and already Google PageRanked up the yizzang. The likelihood that those who are apt to use pirated fonts will discover the site through Typophile is very low. They know about it already.</p>
      <p>We are being naive if we believe this forum can prevent traffic to the site. What we <em>can</em> do, as a body that cares deeply about the craft and industry, is document the problem and educate the public.</p>
