      <p>The ad is probably generated automatically by an ad service a la GoogleAds. I don't think this is a Linotype gig.</p>
      <p>This is exactly the sort of site that chafes my hide raw. goodfonts.org is hugely popular, probably the most-bookmarked font site on <a href="http://del.icio.us/search/all?search=fonts" rel="nofollow">del.icio.us</a> (see "essential fonts") and constantly linked at "design" weblogs as an "awesome resource". Font archives like goodfonts.org that mask themselves as legitimate can deal a significant blow to the industry that underground piracy never can. They turn an uneducated public into unwitting pirates. The notion it breeds: "If I can freely download gobs of professionally made font families from the web, why should I ever pay for a font?"</p>
