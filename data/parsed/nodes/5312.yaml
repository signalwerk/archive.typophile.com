    date: 2004-06-23T11:06:00
    date_raw: 23 Jun 2004 — 11:06am
    votes: null
    html: <p>Hi Shawn, <br> <br>Great concept . . . Right away I am wanting to know what I need to buy new shoes for! (all women love shoes, don't they?!) <br> <br>Is this a postcard or a folded invite? <br> <br>I think the first color scheme works best . . . you could try leaving the cover the full black bleed and on the inside (or back) have the "flood of pink" as Joseph suggested. This color of pink to me, however, reminds me more of a baby announcement rather than a bachelorette party . . . <br> <br>I like the contrast of Stuyvesant with Brothers -- I don't think the layout works as well anymore; with this new font you may need to  experiment with some different ways to present the type. <br> <br>I am still leaning towards the first cover design you presented, I love the bold stamplike quality of it,  it really makes a statement compared to the other designs. Perhaps you could try some sort of decorative swoop or accent on the shoe that would tie in the new Stuyvesant font used on the inside? I don't know if that would work, but it might sparks some ideas for you. <br> <br>Props on the idea, Shawn, your concept definitely states "classy and fun."</p>
