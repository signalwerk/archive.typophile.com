    html: <p>Hello Shawn <br> <br>really nice idea! <br> <br>I like the simplicity of the card and i think Brothers are the right choice. <br> <br>Anyway if you need a font to make contrary to Brothers and make a connection to "fabulous" i would recommend Stuyvesant and a more round and shophisticated design to the shoe. So you will have two levels. The retro simple lettering of the accompaning text and the "fabulous" lettering of the key words (shoes, Fabulous, Megan Dunning). <br> <br>I tried something to show the contrast of the fonts and my recommendation for the colour, but i will send my proposal only if you ask me to, because maybe you don't want to get disturbed by "other's designs" and also because the last time i did it there was a negative reaction. So tell me. <br> <br>Nice idea, anyway. Have a nice day too. <br> <br>christos</p>
