  html: <p>Hello All - <br> <br>My wife is having me design the invitation for her  sisters bachelorette party.  They want it to be classy and fun.  They are all real girly girls and my wife loves the shoe concept that I came up with for the card.  I am wondering what advice you can give me for a good companion to Brothers Regular.  I have the rest of the card done in Brothers Reg also, I think it is too much - - and hard to read at smaller sizes.  Whadayathink? <br> <br>thanks</p>
