  html: |-
    <p>Hello! </p>
    <p>Is there any easy way to auto align/kern numbers in indesign. I am working with 100+ business cards and am trying to align telephone numbers. Trying to find a quick way to save time.</p>
    <p>Would appreciate any guidance</p>
    <p>Thanks!</p>
