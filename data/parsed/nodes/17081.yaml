    date_raw: 4 Jan 2006 — 11:54am
    votes: null
    html: <p>I would check out the postal regulations on this and any envelope before conceptualizing a design. <a href="http://www.wausaupapers.com/Resources/ten.aspx" rel="nofollow">Wausau Paper has a good overview worth consulting</a>. Nothing's worse than making a great envelope only to have the USPS reject it -- believe me, it's happened.</p>
  - id: 102519
    user: 9720
    date: 2006-01-04T11:58:00
    date_raw: 4 Jan 2006 — 11:58am
    votes: null
    html: |-
      <p>I think the concept of 'hidden' (while it applies to the design of both objects) needs to be more obviously connected between the two. </p>
      <p>I would be intrigued by a similar use of the hole-punching on the envelope. Perhaps just a small monogram of your initials in the return address area (matching the style of the card) that shows a hint of dark paper inside a light envelope (or vice versa... dark envelope -- like the card -- showing a light letterhead through). </p>
      <p>Just a thought. I'm all for matchy-matchy sets when it comes to stationery systems. Maybe that's a bit boring to you, but I find it strengthens the impact of the concept if everything is closely unified.</p>
  - id: 102520
