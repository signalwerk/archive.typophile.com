      <p>Well, if this is meant to be a set, I don't see much relationship between the envelope and the business card. So I will look at them separately, then.</p>
      <p>That said, I LOVE the technique on the card! A tad bit time consuming to do by hand, though. Would be very cool to do a laser die-cit, but I understand cost restraints. (I'm guessing this is a personal self-promotion item?) The kerning on the smaller white type seems awfully tight, but that might just be because I can't see it up close.</p>
      <p>The envelope also is quite dynamic in a very different way than the card. While the card is subtle, the envelope is energetic. Nice added touch to have a message on the inside... BUT usually when you open a piece of mail, don't you run a blade through the edge? The recipient might never see your message, as they wouldn't necessarily open the flap that way.</p>
  - id: 102515
    user: 9293
    date: 2006-01-04T11:50:00
    date_raw: 4 Jan 2006 — 11:50am
    votes: null
    html: |-
      <p>It is meant to be a set, hopefully my letterhead and compliment slip will bring everything together, if not l may have to re-work the card or envelope.  I have a very tight budget, so die cutting is out of the question.  </p>
      <p>I was initially stuck on the concept for my card, and after experimenting with my new found tools l created the card.  What l liked about it was the subtlety, with my name being somewhat concealed/hidden.  I have attempted to carry the idea of 'hidden' through to the envelope design, using a variant on a camoflage pattern[Royal Navy colour pantones].  But this has the opposite effect in the context of an envelope, making it standout.</p>
      <p>The disruptive typeface may not be seen.  Most people l have asked tear open their envelopes, but l run the risk of my greeting meassage being missed.</p>
      <p>thanks.</p>
  - id: 102517
