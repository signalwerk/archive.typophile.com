      <p>Thanks for the link to the site.  The envelope guidelines seem very restrictive, but l have seen mail art in the LA based Arkitip magazine, so l assume they are leanient to some extent.  The envelope will be mainly used in the UK, so l cannot see any problems as any stamp marks are situated at the top of the envelope.</p>
      <p>I also like coherent stationary, l will have to look at my work afresh tomorrow evening and see what l think.  Thanks for the advice,<br>
      l am now off down the pub for a pint of guiness, yumyum.</p>
