    <p>I am currently working on a new businesscard and envelope.  All criticism is much appreciated.</p>
    <p>The businesscard was created by pattern cutting tools l purchased at a secondhand shop, using them as a cheap alternative to die cutting.  The front has a braile type texture created by piercing from behind[jpeg3]</p>
    <p>My envelope is based on WW2 Dazzle patterns, with the inside incorporating a font l created.  The font was developed from patterns found inside envelopes and pay slips, designed to hide/distort content.</p>
    <p>Thanks.</p>
