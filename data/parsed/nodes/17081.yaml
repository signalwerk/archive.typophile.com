    html: |-
      <p>Michael, I had thought of that advice also, but noticed that Alex ('dole scum') is in the UK and the envelope was addressed for Italy. I have no knowledge of British or European mail standards, so I didn't comment on that aspect. </p>
      <p>It's always good advice to check with the local postal service when designing mail, especially for business use. </p>
      <p>(Though, in reality, my experience with the USPS has been <strong>fabulous</strong> when it comes to delivering unique 'mail art' that doesn't conform to standards, even internationally. This is <em>not</em> the same for bulk business mail though, where the rules are much stricter.)</p>
