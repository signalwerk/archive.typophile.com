      <p>Hello All, </p>
      <p>First time post. I am very interested in the font knowledge that is abundant on this site. I have a similar problem with the font family of Gotham. Except my issue is we receive the files from a publisher in PDF format. They are using CS2 and exporting from it to pdf. We are a little different from print in that we need fonts to be searchable and the need to be able to bookmark the text. For some reason we are experiencing more problems lately with bad encoding of some fonts. Gotham is on top of our list recently. Every time we try to highlight and paste the text or bookmark it, it is creates bad characters. </p>
      <p>What happens when we bookmark the Gotham font, is Acrobat's 8 version of bad font. It's the alien in a box. This is an issue that we are coming across more and more. A little background on the PDF's is they are untouched in the sense that we are not distilling, optimizing, enhancing, or any other compression. We are using the original files exported from InDesign CS2.</p>
      <p>Thanks for any help or suggestions it would be greatly appreciated!</p>
      <p>Erik</p>
