    <p>Hi Everybody</p>
    <p>New to this forum. Thought that I might try to post a problem that we're having.</p>
    <p>We have a new font from HTJ - it's the font Gotham in OTF, we are using for a client.</p>
    <p>The problem is that we have made some documents with the font, using Gotham Book, Gotham Ultra and Gotham Bold.<br>
    Suddenly after a couple of days, the Gotham Book is displayed as a Gotham Black Italic on the screen , on print and PDF.</p>
    <p>However when you select the text, InDesign shows that it is a Gotham Book (as it's supposes to be). But text is Black Italic!<br>
    Now if you choose the "Find font" menu in InDesign the Gotham Book is named "Gotham" not Gotham Book or Black Italic!! Only Gotham. Wired. And if your try to replace the font - nothing happens.. even if you replace the font to eg. Times.. the font is replaced to Times. When trying to replace back to a Gotham Book, the displays as Black Italic.</p>
    <p>Any way, so we tryied to copy the contents to a new document, same, the problem is carried forward. However if you make a new text box in the new document, and aplly it a a Book it displays fine (only that text box) until you save the file and opens the file again, then the new textbox is Black Italic!!!!</p>
    <p>We have found that exporting the document to an INX file and open the INX in InDesign again the fonts are correct. But this is not a solution since this we have a huge amount of documents that we copy from.</p>
    <p>We're using Mac 10.4.9/10 and InDesign CS (not CS2 or CS3). Same things happens and on a windows pc. We have cleared every font cache, testet on 10.5 and a fresh install of 10.4 - moved all fonts out etc.<br>
    We have opened the documents in CS2 and CS3 - here the problem is gone and everything is fine. We're using some automatic stuff which only works in CS...</p>
    <p>Anyone have any idea on wy this is happening?</p>
    <p>Thanks</p>
    <p>Thomas</p>
