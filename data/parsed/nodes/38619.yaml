      <p>I am wondering if any of this is related to another misbehaviour in InDesign I noticed this week. I had to generate a number of fonts in Mac PS Type 1 format where roman and italic members are stylelinked. Some of these fonts have the words 'Pi' and 'Exp' in their familynames (e.g. 'Myfont Exp' and 'Myfont Pi').</p>
      <p>These fonts function perfectly in regular Cocoa apps like Pages and TextEdit and also in Microsoft apps like Word X. But in InDesign CS/CS2/CS3 (and other Adobe apps too) the font menu did not display them properly. The other fonts I generated are perfectly fine - 'Myfont Txt-Regular' and  'Myfont Txt-Italic' have one entry in the font menu with 'Regular' and 'Italic' in a submenu– but the ones named Pi and Exp have seperate entries in the font menu, and are not stylelinked at all.</p>
      <p>It appears to me that Adobe apps treat Exp and Pi fonts as something special, and I am curious what that is.</p>
