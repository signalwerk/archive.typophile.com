      <p>Here is some information that might shine some light on the issue (but I don't know what the exact problem described here was).<br>
      In InDesign, we wanted faces to be somewhat independent from the families. We didn't want the older style "bold" &amp; "italic" toggles because they were too limited, but thought some separation between the 2 would be useful with character styles, etc.  (<em>Today I think I would not have them separated at all.</em>)<br>
      Anyway, in some fonts the regular face is called "Regular" in others, "Roman", in some it is an empty string. If we have text with "Helvetica" as the family, and "" as the face, we want it to work as expected when changing the family to "Bembo" which doesn't have a "" face, only "Regular".  So, ... there are some synonyms for regular:<br>
      <strong>Roman, Regular, Book, Plain, Normal, R</strong><em> (for J fonts)</em><br>
      We have a similar list of italic synonyms:<br>
      <strong>Italic, Oblique, Slanted, Cursive, Inclined</strong></p>
      <p>It sounds like there might have been strange issues with the default face (default = empty string).</p>
