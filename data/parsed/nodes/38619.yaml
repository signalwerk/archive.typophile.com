      <p>I corrected a typo in my previous post and it moved it to the end.  Hmmm.  Won't do that again.<br>
      There are definitely bug fixes &amp; heuristic improvements made to this area for CS2 &amp; CS3 -- I couldn't list them off the top of my head, but this has been a problematic area over the years.<br>
      Here is some additional detail that may explain it:<br>
      For each font family (e.g. Gotham) we create a table in the document that maps each face name to a postscript name. It sounds like in CS the table got screwed up somehow and the blank string got mapped to the postscript name for "gotham black italic".  INX recreates this table from scratch. The bug appears to be that this table is bad. (Copying text to a document that never used gotham can copy the bad table.) Perhaps the document was modified on a machine without a full installation of the font?<br>
      Either way, it sounds like the correct answer is to upgrade if possible.</p>
