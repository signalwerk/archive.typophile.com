      <p>Here's my theory:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/win_weights_4914_3908.png"></div><br>
      In the above chart (kindly posted by Thomas to the Build forum earlier), note that for the horizontal grouping "400 regular", 900 heavy (also the value for Ultra) is outside the range.<br>
      Therefore, perhaps the application does not consider Ultra to be part of the "Book=400" family, and is looking for a "Regular" to go with Ultra, and the next number down, Black Italic (800), is being designated thus.<br>
      And, as a Gotham "Regular", it takes precedence over Gotham "Book", as the Regular of the family to display.<p></p>
