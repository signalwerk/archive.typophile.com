    date: 2008-06-12T09:29:00
    votes: null
    html: |-
      <p>I don't mind this at all. As others have said, it's distinguishing itself for a new audience. That audience is those under this category: "Exchange for the rest of us." (taken from Apple's own mouth) The "rest of us" means people who want centralized syncing of their devices but aren't IT professionals and just want that convenience at home.</p>
      <p>Personally, I think it's a bit fluffy, but it does hit a lot of the right notes, given their goals.</p>
      <p>By the way, the cloud image refers to the centralized server that manages all of this cross-device syncing. Apple refers to this as "the cloud":</p>
      <p><em>"MobileMe stores all your email, contacts, and calendars on an online server — or “cloud” — and pushes them down to your iPhone, iPod touch, Mac, and PC. When you make a change on one device, the cloud updates the others. Push happens automatically, instantly, and continuously. You don’t have to wait for it or remember to do anything — such as docking your iPhone and syncing manually — to stay up to date."</em></p>
