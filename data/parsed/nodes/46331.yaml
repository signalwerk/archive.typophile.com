    votes: null
    html: |-
      <p><em>It look thrown together and not finished. What I don’t have a problem with is the idea of mixing a more structured typeface with a more relaxed “handwritten” one. It just does not look professional at all.</em></p>
      <p>I think James Puckett said it best... This is no mistake... They're doing this on purpose, not because they are naïve, but because they are going after a certain look for a certain "audience" or "target" (as they say in advertising).</p>
      <p>I have problems with design that deliberately dumbs things down, because I think that involves a negative value judgement of others (I feel that it is akin to "talking down" to someone), but maybe other people have problems with design that tries to educate or elevate, or that simply tries to be well-made or appropriate (maybe "good taste" is not always "right"). And I know I'm opening a huge can of worms here, because how do you define "well-made" or "appropriate"? No matter how much theory and objectivity you can come up with, there is always a human being making decisions, be it at the design-decision level or at the money-making level.</p>
      <p>Maybe I should give a concrete example. I once designed a book about a professional soccer team, and I wanted to print the cover with a matte finish. When the printer found out, he said, "Oh, just make a glossy cover; that's what soccer fans (the audience for the book) are going to go for." (I should mention that this all took place in Argentina, not the U.S., but maybe it is still a valid story.) I ended up having my way with the matte finish, and the book sold well -- I don't think the cover's finish would make it or break it. But that doesn't prove or disprove anything -- it's just one little example, and it bears no comparison to something as massive as the iPhone or .mac accounts.</p>
