      <p>I'm curious Carlo, what specifically makes you hate this logo so much? </p>
      <p>Personally, I don't see much wrong with it. I think it's a very approachable logo, that's still clean with a strong concept. As Nick pointed out "Saving to the Cloud" and for years, the Internet was always visualized as a cloud, especially in data flow diagrams. It's interesting that Apple took that visual idea and made it more "congruent" and "tangible", instead of this implied empty space that things just "happen" in. It's now a destination, that seems very welcoming and more importantly, safe. Since you'd be relying on it to keep all your important data (contact info, calendars schedules, files...) there, secure.</p>
