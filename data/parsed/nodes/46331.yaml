      <p>&gt;I think there is little use in being cynical about this</p>
      <p>I don't think anyone is consciously trying to be cynical about it. The cynical view is a product of the 20th century, which made mainstream culture cynical.</p>
      <p>I was aiming to go beyond cynicism. I was sarcastic and satirical with my list of descriptive words. At the same time I was 90% neutral—the words I chose describe the logo's qualities, but that doesn't mean I hate it. It just isn't for me.</p>
      <p>The point: Apple are catering to the lowest common demoninator, and that philosophy produces awful design. The same kind of philosophy produces awful industrial design like the Ford Crown Victoria. It's a bad logo, and anyone who defends it as having aesthetic merit is defending bad design and the philosophy of pandering to the lowest common demoninator.</p>
      <p>It could also be said that this badly-designed logo reflects Apple's willingness to pollute the world with such banality in pursuit of the almighty dollar, which is not so mighty these days. When I called it "visual pollution", I meant it. It looks like rubbish and it stinks. That last bit really is cynical.</p>
      <p>I still think they could have captured their target market sector with a more tasteful design. We could be living in a more tasteful world if only marketing people stuck to their job and let designers do theirs properly.</p>
      <p>j a m e s</p>
