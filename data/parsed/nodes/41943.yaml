  html: <p>A few years back when film was still the main format submitted to magazines the company I art direct for had the magazine dimensions set at 8x10.5". Now with digital images being 98% of our magazine I am finding my self cropping near 1 inch off the images. Is creating a magazine at 8x12" too skinny or too expensive? What are your thoughts?</p>
  html_clean: <p>A few years back when film was still the main format submitted to magazines the company I art direct for had the magazine dimensions set at 8x10.5". Now with digital images being 98% of our magazine I am finding my self cropping near 1 inch off the images. Is creating a magazine at 8x12" too skinny or too expensive? What are your thoughts?</p>
