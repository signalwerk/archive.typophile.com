    html: |-
      <p>Could have to do with film format vs digital image ratio(s). 8*10.5 inch almost corresponds with 4 by 5 film (there even is a film format 8 by 10 inches). Digital camera’s (esp r SLR’s) have sensors that correspond with 24*36 mm film format, most of them also can deliver High Def like ratio’s that are 'thinner'. As a lot of image content is used for the new media these modern image ratio’s gain ground. </p>
      <p>Re format: I like the squarer format better. Also a consideration: spreads look better.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
