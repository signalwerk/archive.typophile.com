    html: <p>The 8x10" format was chosen to reduce costs after publishers learned that they could sell magazines with a catchy photo and type than with a large format and illustrated covers. IIRC magazines started shrinking in the late 1960s, and by the early 1980s almost all magazines and comic books were printed in the smaller sizes.</p>
