    html: |-
      <p>I think I'm pulling for 5, 7 and 8.</p>
      <p>For #5: I love the screened back 79 and the variation in weight. I would maybe try the same treatment in small caps with a different font. Maybe Gotham HTF or something of that nature and Kern it out a bit. But it's a nice design.</p>
      <p>For #7: This is my favorite. It's very clean and modern with the brackets containing things nicely and giving a slightly organic elegance to the whole composition. Maybe also try this treatment with a box around it instead of the brackets just to see how it works. Well done here.</p>
      <p>For #8: I again love the variations in weight and the small caps of the Café on top. Nicely treated with it bumping up to the 't'. And you did a nice job maintaining a good evenness of the air around café on the bottom and right. Maybe try one with seventy in the same font as nine but in a heavier weight.</p>
      <p>Beautiful treatments all around. I think that's DIN in #2, is it not? One of my favorite fonts, but a bit too rigid and technical for a café.</p>
      <p>I think you've done splendidly with #7. My favorite hands down.</p>
      <p>Mind if I ask what font that is?</p>
