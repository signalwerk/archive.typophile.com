    html: "<p>Probably the st lig belongs in 'hlig' (which is activated alongside 'dlig' in current Adobe UIs). <br> <br>There are a bunch of other rarer f-ligs sith letters such as b, j, k, and sometimes t. They are rare in the sense that most typefaces don't have them, but if present they would go in standard ligatures. <br> <br>Also, once you get out of the realm of normal text faces, and push into things like script or handwriting fonts, there may be many more standard ligatures. <br> <br>Finally, Adobe is fond of the \"Th\" ligature - as am I - and puts it in standard ligatures ('liga'). However, there is some debate as to whether it belongs in the standard ligatures or it should be discretionary. I prefer it in standard ligatures, myself. <br> <br>Setting which ligatures the app uses would be interesting, but would have to interact with specific fonts. Maybe one of these days, though. You can always put in a feature request at: <a href=\"http://www.adobe.com/support/feature.html\" target=\"_blank\">http://www.adobe.com/support/feature.html</a> <br> <br>Regards, <br> <br>T</p>"
