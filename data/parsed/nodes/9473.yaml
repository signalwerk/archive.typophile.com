      <p>The principle I use is, if a ligature is used to avoid unsightly classes then I include it in the Standard ligatures. If it has a distinctive swash or connecting stroke that distinguishes it from the letter pair, I include it in the Discretionary ligatures:</p>
      <p>Standard:</p>
      <p>    sub f f i -&gt; ffi;<br>
          sub f f l -&gt; ffl;<br>
          sub f f t -&gt; fft;<br>
          sub f f y -&gt; ffy;<br>
          sub f t y -&gt; fty;<br>
          sub f f -&gt; ff;<br>
          sub f i -&gt; fi;<br>
          sub f j -&gt; fj;<br>
          sub f l -&gt; fl;<br>
          sub f r -&gt; fr;<br>
          sub f t -&gt; ft;<br>
          sub f y -&gt; fy;<br>
          sub t r -&gt; tr;<br>
          sub t t y -&gt; tty;<br>
          sub t t -&gt; tt;<br>
          sub t y -&gt; ty;<br>
          sub longs t -&gt; longst; </p>
      <p>Discretionary:<br>
          sub c k -&gt; ck;<br>
          sub c t -&gt; ct;<br>
          sub s p -&gt; sp;<br>
          sub s t -&gt; st;<br>
          sub t z -&gt; tz;<br>
          sub Q u -&gt; Qu;<br>
          sub T h -&gt; Th;</p>
