      <p>Using GREP you can control which ligatures can appear in a text. Simply: apply Character Style 'liga' or 'dlig' to particular glyph combinations:</p>
      <p>Find: fi|ffi|fl|ff<br>
      Replace: Character Style 'liga'</p>
      <p>Find: Th|gg<br>
      Replace: Character Style 'dlig'</p>
      <p>You have to set your Character Styles before - just turn on the required OT feature. Using nested Paragraph styles, you can easily apply the rules to several Paragraph Styles at once.</p>
