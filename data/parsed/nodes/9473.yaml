      <p>It would be nice if InDesign -- or any layout program -- would allow custom selection of ligatures from all the ligature features. Of course, my theme song "let the end user modify the font" would resolve that, but FontFont has lately prohibited people who actually use fonts from using them to best advantage.</p>
      <p>A good number of fonts could use more ligatures, esp. in italic: g_g, g_y, z_z, z_y, and so on. Sometimes roman too -- gg, as in "struggle" can appear as an awful blot. Adobe Jenson comes to mind, as seen in <cite>The Pacific</cite> (World War II as brought to you by the Venetians).</p>
      <p>And never forget that Kafka was a halfhearted halfback . . .</p>
