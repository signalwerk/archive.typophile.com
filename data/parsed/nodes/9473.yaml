  html: "<p>So, my company bought one of the brand-new FontShop OpenType faces, FF Nexus, and as I was dropping it into our templates to test size and leading I noticed a very odd thing. As part of the standard ligatures, the s_t combination was included. This particular ligature is not one I expected to see in the standard set, especially since the discretionary ligatures contains the rest of the historical ligatures (c_t, f_s, etc.) <br> <br>Of course, this causes a problem, as in order to get any ligatures, I have to turn on the standard set, but then I automatically get the s_t ligature. Which of course, I don't want. <br> <br>FontShop has offered to fix this for me (very nice of them indeed) by removing the s_t ligature, but it's got me wondering, should there be a standard for OpenType of which ligatures should be in the standard set? <br> <br>My preference for the standard set would be: <br> <br>f_f <br>f_i <br>f_l <br>f_f_i <br>f_f_l <br> <br>The discretionary set can contain the rest. I'd love to see a function built into InDesign that lets you set which ligatures the program uses, but I suppose that's another question entirely.</p>"
  html_clean: "<p>So, my company bought one of the brand-new FontShop OpenType faces, FF Nexus, and as I was dropping it into our templates to test size and leading I noticed a very odd thing. As part of the standard ligatures, the s_t combination was included. This particular ligature is not one I expected to see in the standard set, especially since the discretionary ligatures contains the rest of the historical ligatures (c_t, f_s, etc.) <br> <br>Of course, this causes a problem, as in order to get any ligatures, I have to turn on the standard set, but then I automatically get the s_t ligature. Which of course, I don't want. <br> <br>FontShop has offered to fix this for me (very nice of them indeed) by removing the s_t ligature, but it's got me wondering, should there be a standard for OpenType of which ligatures should be in the standard set? <br> <br>My preference for the standard set would be: <br> <br>f_f <br>f_i <br>f_l <br>f_f_i <br>f_f_l <br> <br>The discretionary set can contain the rest. I'd love to see a function built into InDesign that lets you set which ligatures the program uses, but I suppose that's another question entirely.</p>"
