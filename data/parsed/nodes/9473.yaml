      <p>@ Bhikkhu Pesala</p>
      <p>fi and fl (present in the standard encoding and with Unicode points), but (f_i and f_l [additionally and without Unicode in case of new Adobe fonts]) f_j, f_f and so on.</p>
      <p>I likewise would put longs_t into the liga-feature, although it does not necessarily improve the legibility. The t in longs_t is often much more different in comparison to the single t, than b, i and so on are different in longs_b, longs_i and so on.</p>
      <p>I don’t see any reason for putting the longs-ligatures into the hlig-feature. In case of P22 Stickley the longs-ligatures are even in the hist-feature (sub s i by longs_i), which is absurd in my opinion.</p>
      <p>Generally I either would put each ligature, that improves the legibility and that is not just decorative into the liga feature or I simply would follow the way, that Adobe goes with regard to these features, because if everyone programs the features totally different, each font needs a manual and it is hard to switch from one font to another one.</p>
