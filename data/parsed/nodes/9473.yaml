      <p>Note that some of this stuff can be done through substitutions and kerning. For example, the gj that Frode mentioned at the moment looks awful in the flash title here in Williams Caslon Text-Italic, but with the kerning that is in the font—and doesn't show in flash—it forms a reasonable looking ligature. </p>
      <p>If I remember rightly John Hudson has argued that in general it is better—because of tracking—to have contextual alternatives combined with kerning instead of substitutes of ligatured glyphs. Interesting idea.</p>
