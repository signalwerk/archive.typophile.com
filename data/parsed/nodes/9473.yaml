      <p><em>because of tracking</em></p>
      <p>Not primarily because of tracking, although tracking can be better accommodated using a non-ligature approach. Contextual alternates generally result in a smaller, more efficient glyph set than ligatures, and easily produce arbitrary combinations of e.g. diacritic glyphs in 'ligated' sequences which would require hundreds of ligatures. In fonts that support GPOS mark positioning, using contextual alternates avoids the complexity of enumerated anchor attachments on ligature glyphs.</p>
