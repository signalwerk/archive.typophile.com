    <p>Does anybody have any suggestions for quality DVD’s available for purchase that address type design and/or typography? </p>
    <p>And, does anybody know if David Weiss’s “Farewell, Etaoin Shrdu” (1980) (about the last day of the Linotype machines at the NYT) is available for purchase in any format?</p>
    <p>Thanks in advance,<br>
    Craig Eliason.</p>
