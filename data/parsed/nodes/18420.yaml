      <p>"A wonderful 45-minutes documentary created by Frutiger’s nephew Christoph Frutiger who is a professional camera operator. The film is beautifully shot and very thoughtful"</p>
      <p>For once I'd like to disagree with you Adam. ;)<br>
      I purchased the film with great expectations, and yes, maybe Christoph is a professional camera operator and did very poethic shots, but he does not care much about typography or type design. I found that there is an enourmous amount of personal information about Frutiger's life that I would have easily omitted. I was quite frustrated, as not much from the art of Mr. Frutiger was extracted and too much drama was added. </p>
      <p>This is just my opinion, but I felt like if a great opportunity was lost... a well meritted homage to one of the greatest type designer and a great contribution to type history.</p>
      <p>I'll have to see it again for the third or fourth time, and see if my opinion changes, but I was indeed disapointed...</p>
      <p>no one take it personal!<br>
      cheers,</p>
