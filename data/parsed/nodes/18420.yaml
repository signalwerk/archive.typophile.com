      <p>In Spain there is a say that says "rectificar es de sabios"...<br>
      Something like, "it is never to late to change an opinion"...</p>
      <p>As said I have revisited Adrian's Frutiger DVD,<br>
      "The man of black and white" and would like to<br>
      retract and extend about my comments.</p>
      <p>I did enjoy the very well done documentary<br>
      about this Master's life and i think it is a very complete piece,<br>
      very carefuly documented and put together,<br>
      in a short development of a time line,<br>
      and with lots of love and care for subject.</p>
      <p>The work of Frutiger is treated with beautiful respect,<br>
      and his comments are extremly inteligent and deep.<br>
      All toghether a very recomended view to anyone who<br>
      cares about subject and has the same fascination about<br>
      letterforms, symbols, type and design as we all here share,<br>
      and to whom we all owe to Mr. Frutiger.</p>
      <p>I think my previous posting had more to do regarding style.<br>
      I think it doesnt help being a designer myself (not a type designer),<br>
      engaged to a documentarist cinematographer,<br>
      and also being young and pasionate....</p>
      <p>What I intended to say in my previous posting,<br>
      and which opinion the third viewing of the film didnt alter,<br>
      is that i have certain stylistics dislikes with how some images,<br>
      the music and the off-voice is treated. </p>
      <p>I even switched a couple of times in between the english version<br>
      and the french one too. in order to check my thinking, but<br>
      for me too many zoom in and zoom out effects,<br>
      extreme orchestation in music, overacted translations,<br>
      would be the remarks...</p>
      <p>But again, those are just stylistic considerations,<br>
      that should not rest any value to a great work about a great Master,<br>
      done with lots of respect and love. </p>
      <p>For that I'd like to congratulate Christoph.</p>
      <p>Btw. I ordered my copy from Linotype<br>
      and seems to be multiregion, or at least work in the US region code.</p>
      <p>Oh. Adam,<br>
      if you wish I could traslate the content to Spanish,<br>
      so you could add an extra language to the polish new version.<br>
      I would not mind doing it, but you should have to dubbe it for me. ;)<br>
      Anyhow I'll see you in NYC and we can talk more about it.</p>
      <p>BUY THIS DVD. IS WORTH EVERY PENNY!</p>
      <p>Giovanni Jubert.</p>
