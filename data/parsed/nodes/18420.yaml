    html: |-
      <p>Gjubert, </p>
      <p>actually, what I liked about the film was that it showed Frutiger as somebody who is much more than "just a type designer". I think showing typography on film just won't work and I'm grateful that Christoph did not attempt that. For that, we have Frutiger's books. But the film beautifully puts together some of Frutiger's creation in context of the Swiss surroundings, nature and Frutiger's philosophy. I had hoped that it won't be a just another "tell me the Frutiger facts that I didn't know" production because -- well, I know quite a few *facts* so I wasn't looking for them. </p>
      <p>Sufficient to say that I was supposed to do a 1.5-hour lecture on Frutiger's work for a small group of students in Warsaw two weeks ago. On the train, on my way to Warsaw, I watched the film -- it has been lying around on my shelf for half a year or so but I only decided to see it in the last moment, so to say. After I watched the film, I immediately decided that I'll cut my own content of the lecture by half and will show the film to the students. Within one day -- when I was already there -- I translated and -- heh heh -- dubbed myself all the commentary into Polish and home-produced a Polish version. It took me about 7 hours, credit to the wonderful Apple GarageBand 3, and it was the first time in my life that I did such a thing :) </p>
      <p>The students loved the film as a complement to my 45 minutes of "Frutiger facts". I'd like to get the film published in Poland (with my Polish translation) :) </p>
      <p>Another great video that I can recommend is the Golgonooza video (<a href="http://www.manifoldmedia.com/">http://www.manifoldmedia.com/</a> ). It is a documentation of Dan Carr's punchutting work made by Gahlord Dewald. I liked it as well. </p>
      <p>A.</p>
