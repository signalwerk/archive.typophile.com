    <p><a href="http://www.typecamp.org" rel="nofollow">www.typecamp.org</a></p>
    <p>Most of us need to make the time to go out on walks, swim, collect little bits of things, take photos, get drunk (or not), talk to friends, etc. So, you have to wonder, who wouldn’t want to spend 5 nights on an island while talking about and working with type? British Columbia in the summertime is heaven on earth—a place where most people would be happy to kick back and relax for a week, but if you’re into typography you can relax your body and exercise your brain at the same time. Three typographers, Marian Bantjes, Shelley Gruendler and Ross Mills will offer differing and convergent approaches to type in a relaxed but structured program over six days. Participants will be reintroduced to some type basics as well as learn through observation and applications of how to think of type in new ways. Through a series of lectures and workshops, you will be as immersed in type as you are in nature. The group is limited to a maximum of 20 participants, so it will be close-knit and hands-on. Be prepared to get your hands dirty in some form or another and to come away with an experience to fuel your future projects.</p>
    <p>This is appropriate for anyone interested in typography and design, although you should be conversant enough to talk about type in basic technical terms. Our “back to basics” pre-session isn’t that basic. Optional sessions will include visiting the rules of typography, but most of our time will be spent in a more inquisitive approach.</p>
    <p>For more information, go to <a href="http://www.typecamp.org" rel="nofollow">www.typecamp.org</a></p>
