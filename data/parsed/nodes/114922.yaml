      <p>This lettering is a pastiche of styles. Note for example the median spurs -- found in many wild west fonts --and the foxtail terminals There are some fonts that catch some of the flavor of the lettering. For example, Exocet by Jonathan Barnbrook <a href="http://www.emigre.com/EF.php?fid=95" title="http://www.emigre.com/EF.php?fid=95">http://www.emigre.com/EF.php?fid=95</a> and the Dogma movie font, a fan effort as  Avqest <a href="http://www.fontspace.com/gemfonts/avqest" title="http://www.fontspace.com/gemfonts/avqest">http://www.fontspace.com/gemfonts/avqest</a>. Also some other fonts by Jonathan Barnbrook, including Mason <a href="http://www.emigre.com/EF.php?fid=104" title="http://www.emigre.com/EF.php?fid=104">http://www.emigre.com/EF.php?fid=104</a> and Jeremy Dooley's Newcomen<br>
      <a href="http://www.myfonts.com/fonts/insigne/newcomen/" title="http://www.myfonts.com/fonts/insigne/newcomen/">http://www.myfonts.com/fonts/insigne/newcomen/</a><br>
      Don</p>
