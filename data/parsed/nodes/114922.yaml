      <p>Hi Ryuk, thanks for the link to St Bernardine. If we click on the image of the bottle we get an enlarged view that shows more of the label than was in Adam's Image. In addition to EVIL SPIRITS It shows a full uppercase alphabet. This is simply a set of Tuscan Roman letters. In the context of the label I expect that these are Ouija board letters. Digital fonts Captain Howdy <a href="http://haroldsfonts.com/portfolio/capn-howdy/" title="http://haroldsfonts.com/portfolio/capn-howdy/">http://haroldsfonts.com/portfolio/capn-howdy/</a><br>
      Don</p>
