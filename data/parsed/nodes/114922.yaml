      <p>Can't agree more with Don. Definitely custom (and by <a class="freelinking external" href="http://www.stbernadine.com/clients/evil-spirits-distillery" rel="nofollow">St Bernardine</a>).<br>
      Reminds me also on construction this <a class="freelinking external" href="http://typophile.com/node/114413" rel="nofollow">previous discussion</a> too: initials /E and /S from one side, /V, /I, /L, /P, /R and /T (cross-shaped) from the other.<br>
      For initials and rather using a /3 instead of a /E: I like <a class="freelinking external" href="http://www.myfonts.com/fonts/letterheadfonts/lhf-billhead-1890" rel="nofollow">Billhead LHF</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/coffee-bin-fonts/letterhead" rel="nofollow">Letterhead</a>; Adding also <a class="freelinking external" href="http://decadetypefoundry.bigcartel.com/product/appleton-font" rel="nofollow">Appleton DTF</a>, <strong><a class="freelinking external" href="http://creativemarket.com/Aditsaputra/15306-Midnight-Show-typeface" rel="nofollow">Midnight Show</a></strong> (possibly my best "out-of-the-box" solution), <a class="freelinking external" href="http://creativemarket.com/twicolabs/21073-TM-Stanley" rel="nofollow">Stanley</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/countryroad.php" rel="nofollow">Countryroad</a> and <a class="freelinking external" href="http://creativemarket.com/twicolabs/15341-Sly" rel="nofollow">Sly</a><br>
      For the rest: <a class="freelinking external" href="http://creativemarket.com/Aditsaputra/13450-LongMarch" rel="nofollow">Long March</a>, <a href="/wiki/https%3A/%252Fcreativemarket.com/Aditsaputra/15306-Midnight-Show-typeface" class="freelinking" rel="nofollow">Midnight Show</a> (again), <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/ambrosia.php" rel="nofollow">Ambrosia</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/cavalero.php" rel="nofollow">Cavalero</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/dickinson.php" rel="nofollow">Dickinson</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/euphoria2.php" rel="nofollow">Euphoria</a> (good candidate cleaning up all flourishes), <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/firehouse.php" rel="nofollow">Firehouse</a> and <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/ironhorse.php" rel="nofollow">Iron Horse</a> (good option too mainly because of glyph x-height)</p>
