    <p>Here's the logo and some additional information: <a href="http://i.imgur.com/90M7zzt.png" title="http://i.imgur.com/90M7zzt.png">http://i.imgur.com/90M7zzt.png</a></p>
    <p>For those interested in the job (contact me at <a href="mailto:cwrichardkim@gmail.com">cwrichardkim@gmail.com</a>):<br>
    The Old<br>
    We find that our current logo has a range of issues:<br>
    1) It’s too bland.  We strived for simple, but ended up with bland.<br>
    2) Unrelatable to our primary audience (college students)<br>
    3) We strove for: Sleek, high quality, class, professional, fun</p>
    <p>The New<br>
    We’re looking for a new identity for our upcoming expansion<br>
    1) Color scheme.  Finding a color scheme that fits us is our primary mission.  The colors have to work across the platform<br>
    2) More fun while keeping the quality.  Our userbase consists primarily of college students looking for a pizza deal and an upcoming concert. We’re looking for a way to keep the sleek and simple image but add a splash of personality<br>
    3) Minimal changes to the current logo.  We still want our image to be continuous and recognizable after the change<br>
    4) Adjectives: Sleek, simple, fun, reliable, likable, lighthearted, going out</p><div class="imageWrap"><img src="http://typophile.com/files/Desktop HD_6482.png"></div><p></p>
