      <p>The only official DIN Light (&amp; Bold) font I know of is this:</p>
      <p><a href="https://www.fontfont.com/fonts/din">https://www.fontfont.com/fonts/din</a></p>
      <p>«DIN Pro Light» is the most current version of these fonts. Older versions (PostScript Type 1 or TrueType) have been called just «DIN Light».</p>
      <p>The «Altsys Metamorphosis» info entry was probably added by a conversion tool when those fonts were (unofficially) converted to TrueType.</p>
      <p>(The DIN family from FontFont is based on the German DIN 1451 standard, the design of which was made by engineers and never included a light weight. That’s why I think you are looking at some version of FF DIN here. There is also DIN Next by Linotype, which is not identical, it has a light weight, but its name always included the «Next» suffix.)</p>
