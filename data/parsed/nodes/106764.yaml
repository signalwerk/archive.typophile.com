    <p>Hi, I am a research scholar and am currently working with a designer and a publisher on my first academic publication. My question concerns the two fonts used on the cover title – DIN-Bold and DIN-Light. The problem is, I don’t know much about font licensing, but want to be on the right side of the law. I have realized that both my publisher and my designer are reluctant to buy the font licenses themselves, so it is now up to me to do the right thing. My designer asked me that I will have to acquire the license online. I tried to find the font, but there are several different DIN fonts around the web. I can’t figure out which of the many DIN fonts available online are these 2 particular fonts. When I asked my designer to be specific about them, they replied, the font files are named "DINB___.ttf" and "DINL___.ttf", and the info says: “Font Name: DIN-Bold; Version: Altsys Metamorphosis:6/5/02; TrueType Outlines.” Which confused me further. Can anybody guide me to the link of the specific font one needs to buy to fix this? I have found some websites which are offering “DINB___” and “DINL___” fonts to be downloaded for free; does it mean these are free fonts? But I can’t find a website which offer licensing for these 2 specific fonts...?! :(</p>
    <p>My second question is: who is responsible for a font used in the cover title anyway – the designer, the publisher or the author? Something tells me its not the author's responsibility, but I might be wrong...? :) Thanks!</p>
    <p>Reshma</p>
