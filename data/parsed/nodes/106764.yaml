      <p>Actually, every person who has the font on their machine as font software is suppose to have the license. Additionally, the EULA (End User Licensing Agreement) may stipulate that the font cannot be embedded in a PDF file, or not so embedded without an additional licensing fee, which would mean the "ink" printer (if there is one) would also need to have a license. There may be further licensing fees if the book is to be distributed in digital form as a PDF.</p>
      <p>EULA's vary widely across the many publishers of fonts. And some largish companies in Europe are seeing a potential gold mine in font licensing. That they are thinking more of commercial advertising than academic use is unfortunate, but there you are.</p>
      <p>I'd say your designer is treating you rather shabbily, though of course, that is a quick reaction by someone in the states (who works in scholarly publishing), and may be unfair in this particular case.</p>
      <p>If the publisher and designer are asking you, the author, to bear all font licensing costs, I'd seriously suggest that you consider OpenSource fonts, which typically have no cost, and no restrictions.</p>
      <p>Here is one such:</p>
      <p><a href="http://openfontlibrary.org/font/osp-din">http://openfontlibrary.org/font/osp-din</a></p>
      <p>Here are a couple more:</p>
      <p><a href="http://graphicdesign.stackexchange.com/questions/7178/din-font-free-alternative">http://graphicdesign.stackexchange.com/questions/7178/din-font-free-alte...</a></p>
      <p>This is exactly where designer should be helping you, rather than simply being an artist &amp; then claiming the cost is your problem. </p>
      <p>Edit:</p>
      <p>While not DIN, Lato is a good, OpenSource font Here's a couple links:</p>
      <p><a href="http://www.latofonts.com/">http://www.latofonts.com/</a><br><a href="http://www.google.com/fonts/specimen/Lato">http://www.google.com/fonts/specimen/Lato</a></p>
      <p>For your amusement &amp; education, you might enjoy the Wikipedia entry on DIN fonts...</p>
      <p><a href="http://en.wikipedia.org/wiki/DIN_1451">http://en.wikipedia.org/wiki/DIN_1451</a></p>
      <p>Note that at the bottom of the article in Wikipedia, there *seem* to be a couple downloads of DIN as OpenSource...</p>
