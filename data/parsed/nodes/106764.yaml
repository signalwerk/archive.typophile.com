      <p>In this case the designer is most probably the person who needs to license the fonts, as the designer is the person actually using the fonts. But if you are asking the designer to supply you with the designer’s original files (as opposed to the designer supplying you with a PDF file with the fonts embedded), then in that case you both need to license the fonts.</p>
      <p>An interesting question is just where the designer got these converted TrueType fonts, if he or she didn’t license the originals.</p>
