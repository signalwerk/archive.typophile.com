      <blockquote><p>You mean this font is an "unofficial" version? What are the legal implications of using that, then?</p></blockquote>
      <p>"Unofficial" doesn't necessarily mean "illegal". Some licenses allow or used to allow format conversion or modifications for your internal use.</p>
      <blockquote><p>EULA's vary widely across the many publishers of fonts. And some largish companies in Europe are seeing a potential gold mine in font licensing.</p></blockquote>
      <p>I can assure you FontFont isn’t one of those. The standard license covers PDF embedding for print and digital distribution (PDF, epub3 ...). (Though it doesn’t allow modification of the fonts, and for embedding in apps or editable documents a different license is required.)</p>
