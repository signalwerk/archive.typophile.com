    <p>I shall arrogantly tell you how my friends found out about my acceptance to college.</p>
    <p>I posted this as my Facebook status:</p>
    <p><cite>Thomas Levine is appalled at Cornell University’s use of Arial in the “Congratulations” banner.</cite></p>
    <p>Then I posted <a class="freelinking-external" href="https://web.archive.org/web/20080706171526/https://selfservice.admissions.cornell.edu/images/Accepts.jpg">this image</a> with the following comment.</p>
    <p><cite>I think they normally use Frutiger everywhere else. Why did they have to use Arial here? If they have Frutiger, they must also have Helvetica.</cite></p>
    <p>That really was the first thing I noticed after I realized that I had been accepted.</p>
