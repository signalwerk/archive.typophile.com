    html: "<p>Thanks for the comments and encouragement. <br> <br>If you look closely, you'll see that, while Century Catalogue is clearly based on Century Oldstyle, there are more differences than the length of ascenders and descenders (yes; Oldstyle has short descenders to the point of stubbiness). Overall, it is both lighter and has increased contrast between thick and thin strokes. Individual glyphs have been updated thus: <br> <br>lower bowl of g is more like the classical, calligraphic design than the somewhat \"Hershey's Kiss\" shape in Oldstyle <br> <br>s and z serifs are more vertical <br> <br>U and H are wider <br> <br>C stress is more vertical <br> <br>design of Q is Baskervillian, Oldstyle's is same as Century Expanded <br> <br>$ has two vertical strokes <br> <br>The italic tells an entirely different story than the roman, however; it's more clearly based on Baskerville Italic than Century Oldstyle Italic. Overall, the main differences are that Century Catalogue Italic is expanded a fair amount, and the descenders have been shortened. Other than that, there are very few differences except that the exaggerated slant of A V and W has been removed. <br> <br>Overall, I really like the effect of all the differences in the Roman; it seems to combine the comfort of Century Oldstyle with the more refined atmosphere of fine printing in the style of Baskerville. <br> <br>By the way, I've placed 200dpi scans of Century Oldstyle (and a number of other pages of the 1923 ATF catalouge) online here: <a href=\"http://levien.com/type/atf_1923/\" target=\"_blank\">http://levien.com/type/atf_1923/</a> <br> <br>I can make high quality 2400 dpi scans available to anyone interested; the roughly 30M per page filesize makes me reluctant to just throw them up on the server.</p>"
