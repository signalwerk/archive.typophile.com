    html: <p>McGrew's American Metal Typefaces explains that Century Catalogue is Century Old Style with taller ascenders. --The descenders look longer also. MF Benton was such a great craftsman, that I suspect trying to change it will be a lesson in how smart his decisions were. <a href="http://fontbureau.com/" target="_blank">Font Bureau</a> has successfully revived and expanded a lot of Benton stuff, with great craftsmanship, so be sure to study what they have done. You've chosen a terrific face to work on.  </p>
