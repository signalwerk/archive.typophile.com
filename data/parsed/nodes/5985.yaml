    html: "<p>I can't tell how close to the original this is, since I'm not too familiar with the original (and the '23 ATF specimen I used to have is back at UCLA). <br> <br>Revivals: I rarely like them, but if you're going to do this I think your idea to try to improve it will save it from banality. On the other hand, it takes an experienced hand to improve on such a good design, so stay on your toes - and don't do anything drastic!  :-) <br> <br>Besides the \"f\" I can't see any lc glyph that really needs help. And I wouldn't lengthen the descenders (at least not for the text sizes), because you'd be wasting setting economy with little gain in return. A good way to determine vertical proportions is this: the \"g\" should look <i>slightly</i> cramped*. The biggest thing I might change would be making the caps smaller. And what about the numerals? I might make them hybrids. <br> <br>* Which actually ties in to the \"ugliness\" I was talking about elsewhere. <br> <br>hhp <br></p>"
