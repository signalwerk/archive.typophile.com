  html: <p>Hi all, <br> <br>I'm trying to learn font design by closely studying the works of the masters. To that end, I've traced Century Catalogue from the ATF library. This version is scaled for 18pt size; I'm probably going to use this as a testbed font for my wacky ideas about how to do optical scaling. <br> <br>I believe this is a fairly faithful rendering of the original ATF metal font. Of course, that means there are a bunch of things I would do differently - lengthen the top of the f, make the descenders a little longer (with, perhaps, some strengthening of the lower bowl of the g), and probably making the serifs on the u more "modern". <br> <br>I can imagine using this font to do math books; it feels like a cleaner cousin of Monotype Old Style No. 2 that was used by, among others, Letterproef Van de Garde to do, in my opinion, some of the finest math typesetting in print. <br> <br>Criticism is welcome. <br> <br><img src="http://www.typophile.com/forums/messages/29/42392.gif" alt="First prototype, ATF Century Catalogue revival"></p>
