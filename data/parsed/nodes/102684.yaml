    <p>Greetings community,</p>
    <p>I'm currently working on a two letter logo combining the letters HB. I've currently got it set in a modified (the B) but am struggling to find a sans face that pairs well and has enough weights to complete the company name and a lighter descriptor underneath. I've looked at quite a few faces—FF Clan, FF Marselis and Proxima Nova to name a few—but just am not yet satisfied with the results.</p>
    <p>There is a great article written by the designer regarding its creation. I don't have an extensive knowledge of what pairs really well together so I am looking for suggestions. Any would be appreciated. </p>
    <p><a href="http://ilovetypography.com/2011/10/05/the-making-of-ff-tundra/" title="http://ilovetypography.com/2011/10/05/the-making-of-ff-tundra/">http://ilovetypography.com/2011/10/05/the-making-of-ff-tundra/</a></p>
    <p>Thanks.</p>
