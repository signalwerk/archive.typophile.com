    html: |-
      <p>For Print On Demand, Lulu is good for simple things, or Blurb or Lightning Source for more advanced or higher-quality projects. Stay away from Createspace; their quality is bad and they have ridiculously rigid design constraints.</p>
      <p>These places are only for book printing; I haven't done any other types of jobs with online shops.</p>
