    <p>For printed pieces I mostly use good local printers, but for low-budget projects I occasionally use online print shops. Does anyone have recommendations for online printers that have decent quality at a reasonable price?</p>
    <p>(I think this has been discussed before but I can't locate the thread.)</p>
