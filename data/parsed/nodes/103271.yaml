      <blockquote><p>&gt; … we ought to pack at least as many characters into each Russian line as we do in English, i.e. at least 66 characters (including spaces and punctuation). Fewer characters per line will inevitably result in undesired variation in word spacing and/or too much hyphenation.</p>
      <p>This makes absolutely no sense. As I already said, one should take into account two facts: the average length of words (in characters) is larger in Russian, and the average width of characters (in ems) is larger in Cyrillic.</p></blockquote>
      <p>To understand the rationale, imagine the average word length of some fictional language being 30 characters. How do you set this with an average character count of 70 per line? You'd have huge word space and hyphenation problems. So what do you do? You put more characters into each line. Which comes at a price: your typesize goes down. It would be very hard to set justified text for books in that language. Luckily, we don't have have to deal with average word lengths of 30 characters. </p>
      <p>The question still stands: What is the ideal number of characters per line in Russian text?</p>
      <p>The ideal parameters for setting English text don't seem to apply for at least three reasons: a) Russian has  a substantially different average word length, b) Cyrillic has different font metrics, and c) Russian is an inflected language.</p>
      <p>HK, maybe you could ask the Storm people in the Czech Republic. Govinda should have their email address.</p>
      <p>Greetings</p>
      <p>Michael</p>
