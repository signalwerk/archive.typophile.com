      <blockquote><blockquote>I found there Eric Gill's statement: "Practiced readers do not read letter by letter or even word by word, but phrase by phrase.</blockquote>
      </blockquote>
      <blockquote><p>What does that even mean? What is 'reading' in the context of Gill's assertion? If he means we comprehend the meaning of text via phrases, fair enough, because that's how most linguistic communication works thanks to syntax and morphology. But if he's suggesting that 'practiced readers' perceive phrases as units, bypassing word recognition, he's making an assertion unsupported by any empirical evidence. Even for languages such as Thai that do not use spaces to visually differentiate words within phrases, there is no evidence that phrases are the perceptual units of reading or, indeed, that they can be, since so many phrases exceed the length of a single saccade.</p></blockquote>
      <p>Hi John. Not sure which of the two he means. From my own experience I can say that subtle adjustments in text design can result in a noticeable increase in the speed at which I can read German or English text. I'd be highly interested to understand how this works. It could be entirely individual, or there could be absolutes. Bringhurst tends towards the existence of absolutes. I tend to agree with him.</p>
      <p>Greetings</p>
      <p>Michael</p>
