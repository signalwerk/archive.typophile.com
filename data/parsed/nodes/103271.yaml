      <p>@ilyaz:<br>
      <cite>Obviously, you do not care about your reader’s experience. All you care about is your CPU temperature when you typeset your text…</cite></p>
      <p>The conclusion is unwarranted. While additional CPU effort can improve the spacing of a paragraph, for example through the use of the justification algorithm devised by Donald Knuth for TeX, making the CPU work harder will not improve hyphenation.</p>
      <p>Hyphenation is determined by the dictionary used by the program to show places where words can be broken. Since there will always be words that are absent even from a large dictionary, this means that if you don't want to burden the user of a word processing program with manually indicating possible points of hyphenation, the remaining alternative is to use a line length that will produce acceptable results even if words are never broken.</p>
    html_clean: |-
