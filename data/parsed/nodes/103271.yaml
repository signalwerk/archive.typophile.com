      <blockquote><p>Why don't you run tests, show typophiles the output, and ask what feels better;</p></blockquote>
      <p>Yes, that is of course our last resort. We are, though, trying to avoid this empirical process. In the course of setting type in forty languages for several decades, we've realized that following an authority is a time saver and will consistently yield good results, not always perfect, but certainly good, often very good. Perfection comes with individual fine-tuning, but to do that you need a panel of experienced readers for each language, ideally in close vicinity to control the environment. </p>
      <p>So I was hoping, and am still hoping, to find the Russian Bringhurst.</p>
      <blockquote><p>your question cannot be solved by equations and I doubt it can be answered from general principles.</p></blockquote>
      <p>In English it definitely works. We start with the parameters for an average of 66/67 characters per line. It is quite ideal for most English texts, faces, and line lengths. From there we fine-tune. </p>
      <blockquote><p>Here I ran tests comparing Brill (which I like)</p></blockquote>
      <p>Do you prefer it over Times or Baskerville? In your sample, which I printed out, it looks very good, and very different from Times. Is Brill easier to read, comprehend?</p>
      <p>Your 9.4/12 Times sample is set with larger word space, and therefore looks more like English text. Which I like. But how does it look to a Russian reader?</p>
      <blockquote><p>which gave this resulting pdf output.</p></blockquote>
      <p>Beautifully done. Thank you so much. Of your six samples, I am attracted to  10/12 Brill and 9.4/12 Times. Here we have an average of 61 characters per line. The color is fairly even. Would be interesting to hear from Russian readers.</p>
      <p>My question remains: Hasn't anyone in Russia done all this already and published the results? As much fun it is to experiment, it does feel like reinventing the wheel.</p>
      <blockquote><p>Sizes were adjusted to get the same counts.</p></blockquote>
      <p>Excellent. You probably could push Times to 9.5 or 9.6. </p>
      <blockquote><p>That's the kind of thing I do to make choices (from my preference for TeX, you can guess that I am no editor, but an academic).</p></blockquote>
      <p>:)  Never worked with TeX. We sometimes use InDesign, but mostly our own software which was developed for us in the 80s.</p>
      <p>Greetings</p>
      <p>Michael</p>
