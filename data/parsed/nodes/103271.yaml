      <blockquote><p>I found there Eric Gill's statement: "Practiced readers do not read letter by letter or even word by word, but phrase by phrase.</p></blockquote>
      <p>What does that even mean? What is 'reading' in the context of Gill's assertion? If he means we comprehend the meaning of text via phrases, fair enough, because that's how most linguistic communication works thanks to syntax and morphology. But if he's suggesting that 'practiced readers' perceive phrases as units, bypassing word recognition, he's making an assertion unsupported by any empirical evidence. Even for languages such as Thai that do not use spaces to visually differentiate words within phrases, there is no evidence that phrases are the perceptual units of reading or, indeed, that they can be, since so many phrases exceed the length of a single saccade.</p>
