      <p>&gt; <em>"do those word-length numbers include wordspace?" I'd say be definition, they do. Without wordspaces you do not have a word. </em></p>
      <p>One should handle definitions with care.  The next thing to say after what you did would be that “line length includes the LF and CR, since without them you do not have a line”.</p>
      <p>&gt; <em>don't we generally want to avoid as much hyphenation as we can?</em></p>
      <p>No.¹⁾</p>
      <p>&gt; <em>Don't we want to keep the line length no longer than just eye-movement will allow? (I.e., not require head movement, or as Nick Shinn called it, "angle of vision.")</em></p>
      <p>You got this upside down.  “The general” eye-movement allows enormous angle of vision.  I think what is applicable here is the REM’s amplitude — do not know the proper term….  I do not even know whether saccades are powered by the same muscles as the larger scale movements….</p>
      <p>  ¹⁾ Only when this does not contradict other goals.  Doing typesetting is making compromises.  And what one decides when compromising depends on the context.  In typesetting, it depends on the target audience.</p>
