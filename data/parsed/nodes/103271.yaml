      <blockquote><p>does anyone know of a style manual for Russian? I’m looking for the Russian equivalent of the “Chicago Manual of Style.”</p></blockquote>
      <p>AFAIK, there is <em>no single reference resource</em> in Russian that would address all those aspects of editorial style covered by the English-language style manuals, like Chicago, Hart’s, Butcher’s, etc. That information is spread around a great number of books on editing, copy-editing, proofreading, typesetting, book design, etc. Two biggest names in Russian sub-editing and copy-preparation are <a href="http://genhis.philol.msu.ru/article_169.shtml" rel="nofollow">Alexander Reformatsky</a> (1900–78) and <a href="http://ru.wikipedia.org/wiki/Мильчин,_Аркадий_Эммануилович" rel="nofollow">Arkady Milchin</a> (1924–).<br>
      </p><blockquote>do those word-length numbers include wordspace? Because I always thought English was closer to 4 than 5. So I’m wondering if -without wordspace- the Russian would be 5.36 instead.</blockquote><p></p>
      <p>The information on the average word length varies widely. I don’t know if the numbers I’ve referred to include word spaces. What I, like everyone else, do know from practical experience is that Russian copy is usually <em>longer</em> than English. Remember <em><a href="http://stbridelibrary.bigcartel.com/product/typographia-polyglotta" rel="nofollow">Typographia Polyglotta</a></em>?  There the Russian version of the same text is 15 per cent longer than the English (of course, that percentage varies with translation). No wonder the maximum allowable <a href="https://listserv.heanet.ie/cgi-bin/wa?A2=typo-l;qg9BAA;199902162030350500" rel="nofollow">number of hyphenated lines</a> in Russian is greater than in English.</p>
