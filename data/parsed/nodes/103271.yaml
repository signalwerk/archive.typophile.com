      <p>Incidentally, here's the thread that discussed the ideal line length for English at some great length:</p>
      <p><a href="http://www.typophile.com/node/78173" title="http://www.typophile.com/node/78173">http://www.typophile.com/node/78173</a></p>
      <p>If the normal word length in Russian is longer than in English, that means that shorter line lengths cause problems sooner; and yet, on the other hand, the nature of the lowercase alphabet means that longer line lengths probably also cause problems sooner - and so <em>any</em> line length likely means more compromises.</p>
      <p>Given a 10 Didot point body, 68mm equals 181 ems, incidentally.</p>
