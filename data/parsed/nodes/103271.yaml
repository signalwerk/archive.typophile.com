      <p>We're not really there yet, but we're getting closer. Thanks, guys.</p>
      <p>Maxim, from what I can gather, Felici's measure is based on space (measurable in picas, or mm), not on the number of characters. </p>
      <p>The 6.36 average length of Russian words is very interesting information. Taking that number into consideration, we ought to pack at least as many characters into each Russian line as we do in English, i.e. at least 66 characters (including spaces and punctuation). Fewer characters per line will inevitably result in undesired variation in word spacing and/or too much hyphenation.</p>
      <p>Russian is generally an inflected language. Inflected languages are better set with smaller word spaces. This is one more reason to pack at least 66 characters into each line, for ideal sustainable reading.</p>
      <p>Has anyone in Russia researched reading comprehension vis-à-vis typography? </p>
      <p>Also, does anyone know of a style manual for Russian? I'm looking for the Russian equivalent of the "Chicago Manual of Style." </p>
      <p>           <a href="http://www.amazon.com/Chicago-Manual-Style-16th-Edition/dp/0226104206/ref=sr_1_1?ie=UTF8&amp;qid=1369488480&amp;sr=8-1&amp;keywords=chicago+manual" title="http://www.amazon.com/Chicago-Manual-Style-16th-Edition/dp/0226104206/ref=sr_1_1?ie=UTF8&amp;qid=1369488480&amp;sr=8-1&amp;keywords=chicago+manual">http://www.amazon.com/Chicago-Manual-Style-16th-Edition/dp/0226104206/re...</a></p>
      <p>Would be great to find something like this in Russian, for Russian.</p>
      <p>Greetings</p>
      <p>Michael</p>
