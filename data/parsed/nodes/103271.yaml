      <blockquote><p>Has anyone heard of an ideal number for Russian?</p></blockquote>
      <p>In Russian a lot has been written on the allowable range of line lengths. Most recommendations or requirements express the line measure in ‘kvadrats’ and their fractions. One kvadrat equals 4 ciceros or 48 Didot points (in German those measurement units are known as <em>Konkordanzen</em>).</p>
      <p>National Industrial Standards (GoSTs) used to be strictly enforced in Soviet printing industry. After the fall of Communism they were replaced by the Sanitary Rules and Norms (SanPiNs), very similar to GoSTs. </p>
      <p>Just one example. The <a href="http://verstka.otrok.ru/law/bv.html" rel="nofollow">SanPiN 1.2.1253-03, 06.15.2003</a> (<em>Hygienic requirements to the book editions for adult readers</em>) stipulates, among other things, that<br>
      </p><blockquote>3.2.2. In the editions of the first category, with the font size of the main and the auxiliary texts larger than 10 point, the minimal line measure should be no shorter than 3 ¾ kvadrats (68 mm); the maximal line measure, the typeface, and the extent of the auxiliary text are not subject to regulation.’</blockquote><p></p>
      <p>In his book <em><a href="http://www.amazon.com/The-Complete-Manual-Typography-Setting/dp/0321127307/ref=sr_1_cc_1?s=aps&amp;ie=UTF8&amp;qid=1369444386&amp;sr=1-1-catcorr&amp;keywords=The+Complete+Manual+of+Typography%3A+A+Guide+to+Setting+Perfect+Type" rel="nofollow">The Complete Manual of Typography: A Guide to Setting Perfect Type</a></em> (Berkley: Peachpit Press, 2002) James Felici suggests that<br>
      </p><blockquote>the optimal line length is between one and a half and<br>
      two times the length of the lowercase alphabet.</blockquote><p></p>
      <p> Mind you, the English alphabet has 26 letters, and the Russian 33… Is the Russian optimal line length between 50 and 66 characters? </p>
      <p>One can come to the similar numbers (49–65 characters) by comparing the <a href="http://www.globallanguages.com/en/news/GlobalCommunicator/archives/GC_67_200805/fl_1.php" rel="nofollow">average word length</a>: 5.1 letters in English, and 6.36 in Russian.</p>
    html_clean: |-
