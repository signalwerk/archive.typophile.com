      <p><em>Inflected languages are better set with smaller word spaces.</em></p>
      <p>What is the reasoning behind this?</p>
      <p>I'm frankly surprised that the average Russian word length is only 6.36 letters. My experience of typesetting Russian text is that it contains a <em>lot</em> of very long words, but perhaps that is in part due to the nature of the texts I have been working with (literary or scholarly, so not a day-to-day vocabulary). Even on a fairly generous measure, I find that the quantity of hyphenated line breaks in justified Russian text massively outnumbers that of English, and even with that amount of hyphenation  the count of over-wide word spaces and the risk of rivers remains higher than for English. Of the many scripts and languages with which I work, I think typesetting Russian text is one of the most difficult things to do well.</p>
