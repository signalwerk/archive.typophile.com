      <p>Thanks for your post, John. </p>
      <blockquote><blockquote>Inflected languages are better set with smaller word spaces.</blockquote>
      <p>What is the reasoning behind this?</p></blockquote>
      <p>Reading comprehension. </p>
      <p>I quote from Robert Bringhurst's brillant book <em>The Elements of Typographic Style<em>:</em></em></p>
      <blockquote><p>Language has some effect on the word space as well. In highly inflected languages, such as Latin, most word boundaries are marked by grammatical tags, and a smaller space is therefore sufficient. In English and other uninflected languages, good word spacing makes the difference between a line that has to be deciphered and a line that can be efficiently read.</p></blockquote>
      <p>There must be Russian research into all this. We just have to find it.</p>
      <blockquote><p>Even on a fairly generous measure, I find that the quantity of hyphenated line breaks in justified Russian text massively outnumbers that of English, and even with that amount of hyphenation the count of over-wide word spaces and the risk of rivers remains higher than for English. Of the many scripts and languages with which I work, I think typesetting Russian text is one of the most difficult things to do well.</p></blockquote>
      <p>Same here. It's a challenge. But I'm sure we can find a set of parameters that enable increase sustained reading.</p>
      <p>Greetings</p>
      <p>Michael</p>
