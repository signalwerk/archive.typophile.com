      <p>In "Choosing line length depending on the font size" (<a href="http://typophile.com/node/103329" title="http://typophile.com/node/103329">http://typophile.com/node/103329</a>) ilyaz goes from posting the question, to this thread where he is posting the answers.</p>
      <p>Twice in this thread he said, "this question makes no sense." I think he meant, "this question makes no sense to me."</p>
      <p>ilyaz is full of emphatic certanties: "I would not!" "I see no problems." "Definitely not!" "readers expectations in this language are very different from expectations of English readers!" If there were an absolute answer and a one-size-fits-all formula, this thread would have been over long ago. Discussion helps bring things into perspective; pontificating does not.</p>
      <p><em>"I have looked a bit more into this notion and cannot confirm it. For the usual text faces it is more like 2.2 times the length of the lowercase English alphabet, not 1.5-2.0."</em> Based on 67 characters per line (which I generally tend to agree with), including punctuation and spaces, you are correct.</p>
      <p><em>"do those word-length numbers include wordspace?"</em> I'd say be definition, they do. Without wordspaces you do not have a word. You'd have one word (6.36 characters times the number of words) in a line.</p>
      <p>Getting away from formulas, don't we generally want to avoid as much hyphenation as we can? Don't we want to keep the line length no longer than just eye-movement will allow? (I.e., not require head movement, or as Nick Shinn called it, "angle of vision.") Somewhere between the two probably lies the best answer.</p>
      <p>As far as point size, set a few pages in different point sizes from 9 to 11 points and read (and have others read) them. You don't need as expert to tell you which is more comfortable. Since the line length is fixed at 90 mm, maybe another factor for point size should be the age of the reader. Are there going to be more people over 40 as the intended audience? Go with a larger point size. And vice-versa. Of course, we then get into the area of comprehension....</p>
