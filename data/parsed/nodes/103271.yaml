      <blockquote><p>Incidentally, here's the thread that discussed the ideal line length for English at some great length:</p>
      <p><a href="http://www.typophile.com/node/78173" title="http://www.typophile.com/node/78173">http://www.typophile.com/node/78173</a></p></blockquote>
      <p>Thanks, quadibloc. Good resource. </p>
      <p>I found there Eric Gill's statement: "Practiced readers do not read letter by letter or even word by word, but phrase by phrase. It seems that consensus of opinion favors an average of 10-12 words per line."</p>
      <p>Can we find the Russian readers' consensus of opinion? There must be data.</p>
      <p>If the average Russian word length is 6.36, plus a space, and we put 11 words in each line, 7.37 x 11, the ideal number of characters per line would be about 81. </p>
      <p>Maybe 10 words per line is acceptable (Russian readers are reportedly more comfortable with hyphenation than English readers). So 10 x 7.37, i.e. 74 characters per line, might be okay. </p>
      <p>No matter how I look at it, the ideal number of characters in Russian text seems to be higher than in English.</p>
      <p>Greetings</p>
      <p>Michael</p>
