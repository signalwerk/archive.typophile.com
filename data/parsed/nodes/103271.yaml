      <p>AFAIU, all you need to care about is the width of the column, the font, and the fontsize.  Given this, the number of characters would be decided by the typesetting process into a suitable average number of characters for line for a given (sub)language.</p>
      <p>So instead of what you did, the question one may ask could be: “given that we typeset English so that the average area of the character is 3mm², should we use a smaller font size to compensate for a larger average width of Russian letters?”  (Or for longer average length of word? ;-)</p>
