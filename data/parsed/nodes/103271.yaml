      <p>&gt; … <em>we ought to pack at least as many characters into each Russian line as we do in English, i.e. at least 66 characters (including spaces and punctuation). Fewer characters per line will inevitably result in undesired variation in word spacing and/or too much hyphenation.</em></p>
      <p>This makes absolutely no sense.  As I already said, one should take into account two facts: the average length of words (in characters) is larger in Russian, and the average width of characters (in ems) is larger in Cyrillic.</p>
      <p>And, given that, it is not surprising that the <em>expectations</em> of the readers are also very different.  For example, the Russian analogue of the Chicago manual of style (I have it scanned, but do not remember where it is now; it was published about ’64, and AFAIK, was not reprinted) says that “for the purpose of rapid-delivery typography” (newspapers etc.) more than 8 hyphenated lines in sequence should be avoided.  ;-)</p>
      <p>I also have heard that for best results, one should compensate for larger average widths by making the spacing between words larger.  (Fortunately, PDFTeX now allows overriding the “width of space” provided in the font by the user-specified amount.  Unfortunately, hyphenation of TeX can’t be tuned from its English defaults — the style allows up to 3 hyphenated lines in sequence.)</p>
