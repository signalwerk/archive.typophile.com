      <p>The Cyrillic alphabet is very similar to the Latin in general appearance, although the lower case edges towards small capitals. This, if anything, in my opinion would make the ideal line width somewhat shorter in Cyrillic than in Latin.</p>
      <p>However, since the ideal line width in English is quite short - 1 1/2 alphabets of 26 letters - I'm not sure that there is much room for people seeking to engage in fine book typography in Russian to take this into account.</p>
