    <p>Hey Typophiles,</p>
    <p>This is my first post on here but I’ve been reading the forums a bit for the past year or so. </p>
    <p>Anywho, I plan on creating a typeface for use on the web and I haven’t ever done that...sooo I was wondering if anyone had some advice from experience and examples if possible.</p>
    <p>I’ve been examining Verdana’s development and other current web standard typeface features, but I’m just looking for some things to keep in mind when designing this typeface. </p>
    <p>This typeface will be used as body copy and that will be its primary use. I might extend it later but right now the plan is just to develop a nice typeface for use on a website I’m creating.</p>
