      <p>If you’re making a pixelfont, set the UPM to 1000 and use a grid of 125 for everything (including kerning, vertical metrics, etc.) so when you set the point size to 8 at 72 dpi (a pseudo-standard of sorts) it all clicks.</p>
      <p>hhp</p>
