  - id: 386467
    user: 1250
    date: 2010-01-01T08:56:00
    date_raw: 1.Jan.2010 8.56am
    votes: null
    html: |-
      <p>Yes.</p>
      <p>Of course if your font is very large (which rarely makes sense though) you get in trouble, so you might use 20. Nothing in between works well* because Windows uses a nominal dpi of 96, so you want 75% (72/96) of the number to result in an integer. The problem with anything besides 8 is that the user needs to be aware of what size to use for it to click.</p>
      <p>* Remember, it has to divide 1000 evenly.</p>
      <p>hhp</p>
