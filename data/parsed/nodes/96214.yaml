  html: <p>I'm after people's thoughts on which currency symbols should be added to a text font (Latin extended A). It makes sense to add symbols for currencies used by countries which use this character set, but what about ₹, ฿, ₫ etc.? And it's plausible that end users might also need deprecated currency symbols like French Franc. There doesn't seem to be a standard set. Adobe Source Sans, for example, includes Vietnamese dong but not Thai Baht. It's a question of where to draw the line, so... where do you draw the line?</p>
