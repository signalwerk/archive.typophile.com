    html: |-
      <p>I have designed currency symbols for fonts that would only be used in the context of guidebooks and as such were designed to be mindful of other fonts being used in those books (and similar work with arrows, referencing your other thread). Without knowing the intended use it is difficult if not impossible to anticipate and if someone is planning to use your symbol with a different font other technical factors would be considerations, such as relative metrics and the overall look and feel. </p>
      <p>I have no working knowledge of these considerations but based on recent discussions here regarding deviations from conventional text and display character designs in, for example, Cyrillic scripts, it might be worth doing some research into these conventions before including these signs. What seems to suit the design of a text face aimed at Latin usage might not match relative conventions in fonts designed exclusively for or targeted towards text settings for Thai.</p>
      <p>From my limited experience as a type consumer I must say that the inclusion of additional character support is welcome but it is not always clear how useful those additional characters will be.</p>
