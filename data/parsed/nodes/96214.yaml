      <p>Thai newspapers moved from Thai to Arabic numerals in the early eighties, and publishers followed suit. These days Thai numerals are seen only commonly on currency.</p>
      <p>I'd include the Baht, and the other ones, as they only take a minute or two to design. As a designer, the extra characters are a sign of a good quality font.</p>
      <p>On a related note, the Numero sign (№) is quite useful to include too.</p>
