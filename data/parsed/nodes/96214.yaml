      <p>Perhaps the thinking with Adobe Source Sans was that currency symbols should fall in line with the language support for the font. With the exception of the Rupee sign this would seem to make sense for Source Sans and explain the exclusion of the Thai Baht sign for example.</p>
      <p>It would also be worth considering in the context of the design of a given typeface. So, having the Thai Baht sign in a font which does not contain any Thai characters could be redundant, as it would not be matched to the look and feel of any particular Thai script.</p>
