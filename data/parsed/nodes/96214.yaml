      <p>As you say, the font doesn't need to include support for a given writing system for it to warrant including the currency symbol associated with that writing system (because you might want to do business there with the Latin script). On the other hand (and probably for reasons of automatic Latin support) every currency (except maybe sea-shells :-) <em>does</em> have a three-letter acronym:<br>
      <a href="http://en.easy-forex.com/int/currencyacronyms.aspx" title="http://en.easy-forex.com/int/currencyacronyms.aspx">http://en.easy-forex.com/int/currencyacronyms.aspx</a></p>
      <p>I think you should include a currency symbol based on: how easy it is to make (which is why you might see a Baht more often than a Rupee); and/or the country's GDP (or a more refined economic measure like how much international business is conducted there).</p>
      <p>On the other hand, there's money to be made by <em>not</em> including exotic characters and waiting for the right people to pay you extra to add them.  :-&gt;</p>
      <p>hhp</p>
