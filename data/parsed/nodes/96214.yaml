    html: <p>I considered this, but the Baht symbol is not particularly Thai looking, just a B with a vertical bar through it (most currency symbols are distinctly Latin in appearance). There are many situations where a currency symbol would be needed, even outside that symbol's language - an English language guidebook to Thailand, for example. I know the chances of anyone needing the character are slim, but if somebody does need it, and they overlook my (or anyone's) font because it doesn't include it, then that's a sale lost for the sake of saving all of five minutes by not including the symbol. All very hypothetical, I know, but you have to try and cater for as many users as possible. I'd put a Baht symbol in a font over a Costa Rican Colon, or a Nigerian Naira, despite the writing system of the base alphabet, because <cite>I</cite> think it's more useful to my customers (I have sold a fair amount of fonts in Thailand, but as far as I recall, none in Nigeria!)</p>
