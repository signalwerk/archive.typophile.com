      <p>A wiring diagram looks like a simple grid with a few switches and things here and there.<br>
      Actual wiring often looks like a tangled mess of wires that may or may not have anything to do with each other. My impression, just looking at the diagam is that they want to show that the routes are convoluted.</p>
      <p>What your version shows is that there really wasn't any need to track the garbage with radio transmitters :o).</p>
      <p>-=®=-</p>
