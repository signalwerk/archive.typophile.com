    <p>Here's a graphic that appeared in the July 25 <em>Boston Globe</em> illustrating an <a class="freelinking external" href="http://www.boston.com/lifestyle/green/articles/2009/07/25/mit_scientists_track_trash_to_final_resting_places/">article</a> on how MIT researchers are using tiny transmitters to track where garbage goes after it's collected at the curbside in Cambridge, MA. Here's the graphic that appeared in the <em>Globe</em>:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/trash__1248501404_7956_4732.gif"></div><br>
    After puzzling over it for a while, I realized that this is what they're trying to show us:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/trash2_4621.jpg"></div><br>
    Is this just design run amok, or are they deliberately trying to make a simple process appear complicated and wasteful?<p></p>
