  html: <p>A <a href="/wiki/decorative" class="freelinking" rel="nofollow">decorative</a> typeface with a second <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a> inset within the main <a href="/wiki/outlines" class="freelinking" rel="nofollow">outline</a>. The <strong>inline</strong> stroke is typically much thinner than the main type outline. Sub-types of inline include centered stroke and offset stroke.</p>
