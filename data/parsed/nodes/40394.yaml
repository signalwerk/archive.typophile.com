  html: <p>A <a href="/node/add/wiki?edit%5Btitle%5D=decorative" title="Create node &quot;decorative&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">decorative</a> typeface with a second <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a> inset within the main <a href="/node/add/wiki?edit%5Btitle%5D=outlines" title="Create node &quot;outlines&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">outline</a>. The <strong>inline</strong> stroke is typically much thinner than the main type outline. Sub-types of inline include centered stroke and offset&nbsp;stroke.</p>
