    <p>So i've gotten pretty good at setting type and modifying existing faces.. i mean, i'm at least confident in my skills up to where i'm at, but i really feel like to push my skills i really need to explore hand lettering further.. can anyone recommend any books on hand lettering, sign painting, or calligraphy? i could use some jumping off points to do my own work, as well as some good reference material. <br> <br>ready to spend some money on amazon.com tonight! <br> <br>thanks in advance. <br> <br>ben</p>
