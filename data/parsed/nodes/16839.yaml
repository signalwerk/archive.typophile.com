      <p>" anyone working on parametric or other font development tool that does this?"</p>
      <p>I have been working on a biological tool that does this, for 28 years now.<br>
      Here's my method:<br>
      1. draw a font for a particular size and "make it right."<br>
      2. take the same font, set it at 1/2 the size you designed it for originally, or 2x that size.<br>
      3. Correct the second size so it has the same color as the first,<br>
      4. look at your new size range.<br>
      5. Improve it.<br>
      6. make other sizes in between or extrapolate for sizes outside the existing range.<br>
      7. edit.</p>
      <p>"make it right" being a relative term that only you (and your client), can determine, "the same color" is achieved by making smaller sizes wider, darker and more generously spaced (there are further tips elsewhere I'm sure), while making larger sizes involves the opposite effects.</p>
