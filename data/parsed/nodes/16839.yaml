      <p>The best way to learn is, to compare different sizes auf the "same" design form "good" sources - mostly lead metal specimens. </p>
      <p>There are many ways you can go, depending on the nature of the design. Some designers made the steams and the spacing wider the lower the optical size goes. For a sans the right way, but many designers perform the same for serif faces. But on serif designs you have more options. You can all combine it for your personal taste. </p>
      <p>1. change the steam wide<br>
      2. change the serifs boldness (higher/bolder)<br>
      3. change the character (roundness) of the serifs<br>
      4. change the length of the serifs (affects the spacing issue)</p>
      <p>A lot of the old serif faces seem to prefer a medium grow in the steam wide and a strong grow on the serifs plumpness (high) and/or serifs length. (On designs for the Linotype system you will note, the serifs are more plumper compared to hand setting designs - because the spaceing was not so fexible.)</p>
      <p>The "disadvantage" of this (compared to made the steams and spacing wider only) could be, if the user uses this typeface on the wrong size (a 9pt optimized face in 14pt or more) it will look really clumsy. The other way would look sharp but bolder.</p>
      <p>Some Glyphs like g,f,t and r need more attention, they will change their character more than other glyphs, if they become more optimized for lower sizes - 8,9,10 pt.</p>
      <p>Punctuation marks and accents need to be more enlagered than other parts of the design. The accents have to be really high compared to display sizes (20pt and more). A gap you will note very often on todays optical tuned book faces.</p>
      <p>All this and more should you help. A clever program can be the first step - I don't know such a program :-), but it will not free you from your own brains work!</p>
      <p>Since this is really an interesting question, I hope others will join too and enlighten us all. </p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
