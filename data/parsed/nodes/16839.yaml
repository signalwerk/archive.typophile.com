      <p>Thanks, David. I found this general comment in "TeX Unbound" by Alan Hoenig, pp. 272--273:</p>
      <p>"The letter spacing---space between characters---must be increased, strokes must be thickened, contrast between thick and thin strokes reduced, and counters (islands of space surrounded entirely by ink, like the interior of the `o' or the top of the `e') need to be larger".</p>
      <p>There is also a nice graph on page 86 illustrating the nonlinear variation of optical scaling parameters with respect to design size.</p>
      <p>I invite anyone else with other tips/references to bring them forth-)</p>
      <p>Best<br>
      Idris</p>
      <p>PS single quotes look really bad in this web font. Is there a better to do, e.g., `o'?</p>
