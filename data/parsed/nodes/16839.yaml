    <p>Hi all,</p>
    <p>I am interested in optical scaling: Aside from MultipleMaster, are there any techniques for developing fonts finely tuned to point size? </p>
    <p>Related, given two fonts of one general design, each tuned to a particular and specific point size, how does one determine whether the two fonts are, indeed, appropriate at their respective sizes? I am aware that the differences between, e.g., 8pt and 12 pt are not linear. Are there any guides or tools besides direct observation?</p>
    <p>In particular, I would be interested in how I can use either Studio5 or FontMaster (I have the light version) to pull this off. </p>
    <p>Is anyone working on parametric or other font development tool that does this? The open source FontForge has a "metafont" utility that tries to do something in this regard, but it's still quite rudimentary.</p>
    <p>I really don't want to spend countless hours mastering the MM method if there is a better alternative...</p>
    <p>Best to all<br>
    Idris</p>
