    html: |-
      <p>95% of optical scaling is just the following:</p>
      <p>1: Making strokes thicker and contrast less. Doing a stroke offset operation is very close to the way ATF did this a hundred years ago.</p>
      <p>2. Increasing the letterspacing.</p>
      <p>3. Stretching the shapes to be a bit wider. The ATF examples do quite a bit of this, to my eyes too much. I think the "how much" depends on the font.</p>
      <p>4. Shortening the extenders, especially descenders.</p>
      <p>I've been experimenting with FontForge scripts to automate steps 1-3; the descenders you'll have to do by hand. Unfortunately, the stroke offset operation in FontForge (there called "Expand Stroke") is slow and buggy, so the results are not that great. I'm sure FontLab could do the job way better.</p>
      <p>Of course, the remaining 5% is hand-tweaking the results so that they're really good.</p>
      <p>I'm not convinced that opening the counters is all that important. Probably depends on whether the counters are smallish in display sizes, as they are in most Garamonds. There's  a bit more writeup on the ATF Garamonds in the <a href="/wiki/optical%20scaling" class="freelinking" rel="nofollow">optical scaling</a> wiki entry here.</p>
      <p>The other issue is the size of the apertures, which are really small in some geometric sans families like Avant Garde. You'd want to open those up when doing an optically scaled variant. I notice that almost all of the classic ATF fonts have nice large apertures, so this wasn't a serious problem for them.</p>
