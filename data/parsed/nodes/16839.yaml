      <p>I just thought I'd post more details on my experiments with scripted optical scaling using FontForge. Here are two PDF files intended to more or less replicate the 1923 specimen page for ATF Century Catalogue (p210 in <a href="http://levien.com/type/atf_1923/" rel="nofollow">this folder</a>), one optically scaled, the other not.</p>
      <p><a href="http://levien.com/type/myfonts/cent.pdf" title="http://levien.com/type/myfonts/cent.pdf">http://levien.com/type/myfonts/cent.pdf</a></p>
      <p><a href="http://levien.com/type/myfonts/cent_noscale.pdf" title="http://levien.com/type/myfonts/cent_noscale.pdf">http://levien.com/type/myfonts/cent_noscale.pdf</a></p>
      <p>And the FontForge script I used is here:</p>
      <p><a href="http://levien.com/type/myfonts/optical.pe" title="http://levien.com/type/myfonts/optical.pe">http://levien.com/type/myfonts/optical.pe</a></p>
      <p>Basically, I just used the script, but with a few tweaks. First, I took 14 units off both left and right sidebearings, because I spaced the font for a 10pt intended size, while the outlines are at a design size of 18pt. There's more spacing work to be done. Incidentally, in this sample there is no kerning, which of course is important. Of course, kerning was not standard in 1923, and my purpose here was more about seeing how closely I could match the metal than making the best digital font.</p>
      <p>Second, I faked the small caps using the following recipe: use normal caps from scaled size of about 1/2 the normal size, enlarged mathematically to 2/3 the normal size. So, for 12pt, I used caps from the 6pt scale, printed at 8 points.</p>
      <p>Third, I tweaked the descenders on the 6pt size by hand. For jpq, I lifted them up 40 units, and for gy I squooshed by 96% vertically, origin set to x-height line. Then, I squooshed everything by 104% vertically. I would do things a little differently, but it's surprising how closely this matches the color of the ATF original, down to the relative darkness of a couple of glyphs including 'g' and 'R'.</p>
