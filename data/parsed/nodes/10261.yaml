  html: <p>Hi! <br>I was looking for the name of one of my fonts at Google and found it at <a href="http://www.fontpool.com" target="_blank">www.fontpool.com</a>. <br>This site has nothing to offer than links to MyFonts, which might be okay, but is it legal to copy all the font samples from MyFonts (or from anywhere else) and publish them on a site without a license? <br>I would like to ask the webmaster but I couldn't find  an imprint on this site, not even an eMail address. <br> <br>Ralf</p>
  html_clean: <p>Hi! <br>I was looking for the name of one of my fonts at Google and found it at <a href="http://www.fontpool.com" target="_blank" class="link-external">www.fontpool.com</a>. <br>This site has nothing to offer than links to MyFonts, which might be okay, but is it legal to copy all the font samples from MyFonts (or from anywhere else) and publish them on a site without a license? <br>I would like to ask the webmaster but I couldn't find  an imprint on this site, not even an eMail address. <br> <br>Ralf</p>
