    <p><a href="http://i52.tinypic.com/rvymfm.jpg" title="http://i52.tinypic.com/rvymfm.jpg">http://i52.tinypic.com/rvymfm.jpg</a> - Old Newsletter<br>
    <a href="http://i51.tinypic.com/2lndzyx.jpg" title="http://i51.tinypic.com/2lndzyx.jpg">http://i51.tinypic.com/2lndzyx.jpg</a> - New WIP Newsletter</p>
    <p>So I'm having to redesign a newsletter for a start-up technology company and what the previous designer left behind was a little...cute and whimsical, instead of clean and professional. The typefaces in my up-to-date version is Times new roman 10 pt for the body at 14pt leading, News Gothic headings. I have some questions and I'd like some critique!</p>
    <p>Typefaces - I've used Futura, News Gothic and Gotham for their other collateral. Which one for headings, and what is a good compliment for body text? I've tried all of them as body text and its not working out very well..I need a modern looking complimentary typeface that reads well in news column format.</p>
    <p>Photos - as you can see I'm trying for a cleaner, modular layout with the images. Is it working or not? what can I do to improve the look? I want it clean, tidy and impressive looking.</p>
    <p>Photo captions - what size should I use, what positioning and what typeface?</p>
    <p>Overall Layout - any critique or ideas are welcome! I'm eager to learn anything I can from more experienced designers and typographers. </p>
    <p>Thanks!</p>
