      <p><cite>I guess my problem is just good checking how the type looks in reality, not while displayed . . .</cite></p>
      <p>Reality is that there are lots of ways to put ink on paper. Another reality is that putting pixels on the screen is an equally important feature of "type." Or even words on an old-fashion TV set, as with advertising.</p>
      <p>High-resolution offset printing is only one of these. What to test for -- and what weights &amp; details of a font you decide to offer -- depends on where you perceive a market for it's use.</p>
