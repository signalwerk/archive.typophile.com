      <p><em>Will it be a mistake: to print the typeface on a variety of popular devices, to test the details, angles and weights; if any wrong effect appears frequently - check it; then try printing it on a silkscreen or offset to see how it behaves in better quality?</em></p>
      <p>I'd say that would be a good idea. If something shows up really weird on laserprint or high-quality inkjet, they will probably also be weird on offset -- even if that is much higher quality.</p>
