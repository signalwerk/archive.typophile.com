      <p>I guess my problem is just good checking how the type looks in reality, not while displayed. And, as I understand, the only "non-deceptive" solution is a high-quality offset print. (Because below there is a plenty of devices generating more and more odd effects like "it's good to see you, but I won't depend on you").</p>
