      <p>Right. But since I discovered my home printers produce unrepetitable effects (once a stem is too thin, once - thick), I started to use them for checking glyph outlines in big magnifications only. I am sure I could "dedicate" the typeface for my printers, anyway ;)</p>
      <p>Will it be a mistake: to print the typeface on a variety of popular devices, to test the details, angles and weights; if any wrong effect appears frequently - check it; then try printing it on a silkscreen or offset to see how it behaves in better quality?</p>
