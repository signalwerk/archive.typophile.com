    html: |-
      <p>Laser prints can be a deceptive form of print proofing, as toner is very black and has a lot of "gain".<br>
      Chances are your typeface will look weaker when printed by offset than on your studio printer.<br>
      Not such a problem for sans faces, but quite significant for serif designs.</p>
      <p>The other thing is, offset is much sharper.</p>
    html_clean: |-
