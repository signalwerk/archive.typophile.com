    date_raw: 8 Jan 2009 — 8:08am
    votes: null
    html: <p>I don't know much about low-quality printing, but I'd say the same is true if you are going to use high-quality offset printing, between 2,400-3,600 dpi. This is especially important if there is any contrast in the letterforms. You are apt to find that fine lines are too fine. Probably less of an issue with a sans, but maybe not. For instance, new designers sometimes specify a .25-point rule, because it looks fine on the output of a laser printer. They are usually disappointed when the book comes out. It takes a .33-point rule to work with high-resolution offset printing, esp. on uncoated paper.</p>
