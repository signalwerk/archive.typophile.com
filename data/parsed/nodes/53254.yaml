    <p>Is there something like a print proofing before release of a typeface needed? I have  created a sans-serif for general use in short texts and wonder if printing it in a few places would help me in better adjusting the outlines (ink traps etc).<br>
    I know that Mr José Scaglione had a speech of such stuff at ATypI. Maybe it is not necessary and I am just too nervous?</p>
    <p>Thanks.</p>
