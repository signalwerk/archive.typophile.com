      <p>in my opinion the top two ideas are the strongest, elegant without looking old</p>
      <p>however the first thing i read is W O P, when i assume it should read W &amp; P, perhaps look at the spacing between the W and P, or alter the flourishes so they don't overlap as much and don't create an O shape?</p>
      <p>would also suggest you take another look at the colour, the green you've used gives the monogram a cosmetics product feel</p>
      <p>hope that helps</p>
