      <p>Definitely top left. Nice and clean and simple. Make sure to give it lots of white space when you use it on anything like your invitation/programs/thank you cards/etc. If it were me, I'd play around with the color a bit more, but that's only personal taste. I get more of a 90s feel from that kind of green. But as long as there's no pink in the wedding too, it should be fine :)</p>
      <p>penn</p>
