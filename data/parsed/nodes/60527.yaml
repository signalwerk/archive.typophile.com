    html: |-
      <p>Thanks all,</p>
      <p>The different versions wern't really meant as 'versions' more as applications of the same mark. The main mark is the one top-left.</p>
      <p>@ Peter; I don't think that O you're seeing is a real problem. Most will know our initials and would be less quick in thinking there's an O in there. </p>
      <p>@ Peter &amp; Penn; The color isn't set in stone yet and I've yet to see it printed. I was looking for a nice greyish green, but I agree this might give it a soaplabel feel.</p>
      <p>@ Filip; The top-right swash of the W is the bottom swash of the P but mirrored. I had tried to give the mark some balance with it, but I can see it isn't working 100% yet.</p>
      <p>@ Ed; I had started out with an '&amp;' in the mark, but it made it feel crowded (and I really dislike the ampersand in Bickham). I also tried a more curved line through the E, but that (to me at least) stood out even more, as now the line repeats the straight lines of the W.</p>
      <p>I will play around with the color and the top-right swash of the W. Again, thank you all for commenting.</p>
