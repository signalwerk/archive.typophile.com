    date: 2004-01-11T08:49:00
    votes: null
    html: "<p>The texture is wonderful! And that count for a lot. <br>The overall spacing could be just a hair tighter, but your blank space is too narrow. <br>And I think you have room for an italic, which I'd make lighter and softer, and inclined a fair amount. <br> <br>Micro stuff: <br>- \"c\" and \"y\" don't have enough \"abruptness\". <br>- I'd move the bar of the \"f\" to the right. <br>- \"t\" is too extreme. <br>- \"D\" is too narrow. <br>- Head of the \"P\" is too small. <br> <br>But I don't get your semi-serif decisions in the UC. <br> <br>hhp <br></p>"
