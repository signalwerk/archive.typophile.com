    date: 2003-04-22T23:31:00
    votes: null
    html: <p>This is great. We need semi-serifs, and this is a nice toothy one! I think you're making the "fauve" look really work, and some of the stuff (like the "t") is very interesting - but I'd have to think about those a bit more. <br> <br>For starters, I would recommend making the ascenders slightly taller. And your inclination angle is 4 degrees (right)? I would go for a nice integer slope, maybe 1/15 (=~3.81 degrees), so you can manually control your slopes during font editing pretty easily. <br> <br>BTW, could we see a character set? <br> <br>hhp <br></p>
  - id: 69817
    user_id: 618
    user_name: aquatoad
    user_path: null
    date_raw: 23 Apr 2003 — 6:37am
    date: 2003-04-23T06:37:00
    votes: null
    html: "<p>For starters, it is strictly illegal for you to work on anything other than Pill Gothic until it is brought to the rabid masses :-) Seriously. <br> <br>I also like what you have working here. Did you use the wireframe + brush + cleanup technique on this one? My guess is no, but just curious. Also, the slope is intended to compensate for backslanting in a semi serif right? While it's balancing nicely now, did you try it a bit less, perhaps half of current? The reason is I'm wondering if people will pass over your design because \"there's only italics.\" <i>On a side note: Hrant, please explain in more detail the benefit of having the slope as an integer for \"font editing.\" </i> <br> <br>I think some of your spacing issues are coming from the length of your serifs on many of the characters in addition to the ear on the g. I'm looking specifically at the top of the i, p, n, r, v. Compare the top serif of the n with the top of the m. I might even reduce all the x-height, left-pointing serifs to (or slightly less than) the current m. This might allow it to be balanced with less sloping. <br> <br>Toothy is good. Lots of sparkle coming off this one. Keep at it, your stuff is very nice. <br> <br>Regards, <br>Randy</p>"
  - id: 69818
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 23 Apr 2003 — 9:19am
    date: 2003-04-23T09:19:00
    votes: null
    html: <p>&gt; please explain in more detail the benefit of having the slope as an integer <br> <br>Well, you should use a measurement that's most convenient to work with. Degrees are really an arbitrary unit in digital type design - slopes on the other hand have an inherent usefulness. <br> <br>For example, let's say that -because of the admittedly established practice of using degrees- you want an angle of about 12 degrees. Doing a Tangent on that and then inverting it, you get ~4.7, so you would choose 5 (which comes back to ~11.3 degrees). Now that you have a slope of 1/5, you know that for every +5/-5 units you move vertically, you need to move +1/-1 unit horizontally. It's not only easier to work with, it reduces rounding issues too. <br> <br>BTW, Randy has a point about the inclination angle (assuming there will be an italic down the line). If you reduce it* you will have room for more incline for your italics. Otherwise you can use the same angle for the italic, but you'll have to make it ridiculously cursive for it to stand out, and you'll still have problems - the main functional distinction of an italic (to a user, if not a chirographer) is its slant. <br> <br>* But not below 1 degree, or ~1/57 - or better 1/50, 1/55 or 1/60 for convenience. In practice it seems that any slope less than about 1/30 will start getting problematic at smaller sizes. I use 1/16 for Patria Italic (and Harrier) - I have a preference for powers of 2. <br> <br>hhp <br></p>
