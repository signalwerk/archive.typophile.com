    date: 2003-04-23T11:17:00
    votes: null
    html: <p>Good stuff. Like the uppers so far.  I also like the reduced slant, it's feeling much less "italic." The spacing seems to be much better as well. The serifs could all possibly come in a bit more for tighter spacing needs. <br> <br>Yeah I hear you on the technical side. Nothing says you have to do this yourself though. Have you sent Pill to any distributers? They would gladly do it for you, might take some percentage points off the royalty but after all, this is supposed to be an escape not a headache :-) In my amature opinion, you have incredible instincts for type design. Let someone with incredible instincts for delta hinting do that, and focus on the fun part.  <br> <br>Randy</p>
  - id: 69821
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 23 Apr 2003 — 1:42pm
    date: 2003-04-23T13:42:00
    votes: null
    html: "<p>Christian, you don't need a \"perfect\" font - it depends mostly on what your customers expect. Emigre fonts for example have minimal kerning pairs (I think Mrs Eaves has 40-something), but a lot of people have drooled over them. The more you can do the better, but don't get discouraged from publishing your work. Plus a lot of the automatic stuff does serve adequately - like the autohinting in FontLab. The only technical skill I can think of that truly requires a good handle is base spacing. <br> <br>Looking at the PDF: <br>1) I think \"a\" and \"g\" are slightly too large. <br>2) I think the new ear of the \"g\" is super. <br>3) I prefer the new non-descending \"f\". <br>4) Those double-dots on \"i\" and \"j\" are distracting. <br>5) I'm starting to think that the \"t\" needs a more \"normal\" tail - and more horizontal presence. <br>6) Try to give the tail of the \"y\" more presence. <br>7) Some of the color is off - like the \"o\" is much darker than the \"n\". <br>8) I think 2 degrees (or ~ 1/30 :-) is better than 4. <br> <br>hhp <br></p>"
  - id: 69822
    user_id: 1316
    user_name: piccic
    user_path: null
    date_raw: 8 Aug 2003 — 5:08am
    date: 2003-08-08T05:08:00
    votes: null
    html: "<p>It is very comfortable to read. Call it \"type design as an escape\"!  <br>I really think you could use even less inclination, like Hrant says. <br>I agree on the \"i\" and \"j\" dots as well: try to break them using some angularity. <br>Same goes for the \"y\": experiment with the tail or the whole letter. <br>I think the \"a\" needs just minor adjustment. It's very good. <br> <br>A separate note on spacing: I would not call spacing \"a tachnical skill\" as Hrant did. It's as much important as the design itself, maybe more. As long as you care about spacing good since the early stages of a design, you will very likely need minimal kerning. Of course it depends on the design, but I would not use automated tasks of the software.</p>"
