    date_raw: 12 Jan 2004 — 4:43am
    date: 2004-01-12T04:43:00
    votes: null
    html: "<p>Hi Christian. <br> <br>Magically Delicious! <br> <br><i>I still have spacing issues to resolve, though.</i> <br>One i notice is due to the structure of the t. Given your angle, you can afford a bit more length to the left than usual, but the crossbar is now über left. Otherwise I don't find the over all structure too extreme. <br> <br>Also note the path gremlin in the upper case W. <br> <br>I like the UC. Fits like a champ. The new s is super BTW. One stylistic question I would explore were it my baby: what about beaks instead of teardrop terminals on the a, c, r (kinda like the s only heavier)? Might be more in keeping with the overall toothy quality. The others are ok now, just thought it might be worth exploring? <br> <br>Cheers, <br>Randy <br> <br>(you are a busy man)</p>"
