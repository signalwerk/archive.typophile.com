      <p>Here is another pdf. Randy, good call on the serifs. As for the slant, I'm still trying things. To be honest, I just obliqued the characters at two and four degrees. As for pill gothic. I'll get back on it. Up to this point I have mostly done type design as an escape. It's relaxing. So generally I have avoided most of the really tedious technical aspects of producing a professional font. I'm getting more excited about things like kearning pairs and stuff, but I don't know if I will ever really get into hinting. I'm just waiting for ultra high resolution displays. <br> <br></p>
