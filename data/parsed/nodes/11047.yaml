    date: 2003-10-13T09:40:00
    votes: null
    html: <p>Nice! nice! <br> <br>• The lowercase 'w' seems a little wide, but because you used this latin-looking text I can't see it in context. :^) <br>• The lowercase 's' seems too big <br>• Both your cap 'S' and your lowercase 's', the serifs seem a bit chunky. <br>• As your typeface in general has a (to my eyes anyway) forward slant, I think both 'S' and 's' need to be slanted forward a bit more. <br> <br>I still enjoy the irregularity and hope for a full fleshed out family. Some day. ;^)</p>
  - id: 150371
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    date_raw: 12 Jan 2004 — 4:58am
    date: 2004-01-12T04:58:00
    votes: null
    html: <p>Christian, <br> <br>This face has the most potential of any you've posted. Once <br>Pill Gothic is out the door you should give it your full attention. <br> <br>I am not a believer in Hrant's light italic ideas. The italic <br>should contrast with the roman by a change in design and  <br>slope, not weight. Color should be even throughout the <br>typeface's styles. <br> <br>Hrant is right about the 'f' crossbar and I think it carries  <br>over to the 't' as well, as Randy said.  <br> <br>The overall spacing is just right. If anything, it's too tight.  <br>The 'tt' spacing (see "shatter") is evidence of that. Any <br>tighter and it would require a ligature. But Hrant is right on  <br>the spacebar.</p>
  - id: 150372
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    date_raw: 13 Jan 2004 — 5:23am
    date: 2004-01-13T05:23:00
    votes: null
    html: <p>Ok, I printed this one up... <br> <br>- Your combo glyphs are screwy. I am not a path master so <br>I don't know what went wrong, but the 'W', 'fl' and 'ff' ligs are <br>messy where they overlap. You can see it in the PDF on <br>screen and when printed it goes white. <br> <br>- Color is perfect. Don't change a thing. Dark is in, and for <br>good reason. <br> <br>- I think the ascending 2 is ok. I always thought it was too <br>squashed to be lc. I can see how it's unnerving for those of <br>us who aren't used to it, but I think it works. <br> <br>- Looks like you've tightened the 'tt' kern. The touch looks  <br>ok at the small size, but any larger might be a problem. I <br>suppose this is a good time for me to request a display <br>version for larger sizes. ;) <br> <br>- Randy is right on the 3. Maybe if you shorten and lighten  <br>that bottom stroke it will clean up.</p>
