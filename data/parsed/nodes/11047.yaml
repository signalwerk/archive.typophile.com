    html: "<p>Nice. I like it. <br> <br>Two further comments (preferences really): <br>1. The ascending 2 looks great alone, but in the 12 combo seems strange. Probably just my eyes used to convention, so it's a minor quibble. <br>2. The overall color seems a bit dark for my taste. <br> <br>ok one more: The bottom of the 3 looks a little wonkey. The placement of the corner seems consistent. Maybe it is the upward angle at the end. Typically it should follow more like the 5.</p>"
