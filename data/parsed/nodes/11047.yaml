      <p>I've toned down the wacky character widths, and added some small caps. I agree that the spacing is nearly as important as the design of the glyphs. When I took my first font into fontographer, I was terribly depressed at the result. I had worked for hours, focusing on each letter, and the text setting looked like garbage. I didn't realize it at first, but the spacing was the real problem. <br> <br>That being said, changing character widths and shapes in this font has made a world of difference in the text setting. The best example is the g. I still have spacing issues to resolve, though. <br> <br></p>
