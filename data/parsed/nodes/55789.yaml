    <p>Hi,</p>
    <p>Working on a website that needs a clear hand-written-style font, easily readable at smaller ( &lt; 14pt) sizes. Marker Felt fits the bill, though I'm personally not a fan. I was wondering if anyone could answer the following questions...</p>
    <p>1. Marker Felt comes packaged with my OS (OSX), but I can't seem to find any licensing information associated with it, and have found earlier versions available in numerous places for free / donation. Apple don't seem to offer it for sale and neither do any of the major internet font sellers. So how does my use of it stand? Can I use it for free?</p>
    <p>2. If anyone has any alternatives to Marker Felt they think I might prefer, I would appreciate it.</p>
    <p>Thanks a lot.</p>
