    html: |-
      <p>No worries about Nara, she is no little teenager. She turned 20 this year.</p>
      <p>This is a fact, and quite some story. Nara was designed as a student project of Andrej Krátky at the Prague Academy in the late 1980s. As you can imagine, it wasn't very easy to digitise fonts back than, certainly not in communist Czechoslovakia. Andrej drew all letters 20cm large, and all points coordinates had to be measured on a milimeter paper, and <a href="http://typed into" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://typed into</a> METAFONT which than generated the outlines. He abandoned the project before Fontographer became available.</p>
      <p>For the past 2-3 years I worked closely with Andrej and Nikola Djurek to complete the typeface, and now more than 20 years after first sketches were completed, we can present it to public.</p>
    html_clean: |-
      <p>No worries about Nara, she is no little teenager. She turned 20 this year.</p>
      <p>This is a fact, and quite some story. Nara was designed as a student project of Andrej Krátky at the Prague Academy in the late 1980s. As you can imagine, it wasn't very easy to digitise fonts back than, certainly not in communist Czechoslovakia. Andrej drew all letters 20cm large, and all points coordinates had to be measured on a milimeter paper, and <a href="http://typed into" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">http://typed into</a> METAFONT which than generated the outlines. He abandoned the project before Fontographer became available.</p>
      <p>For the past 2-3 years I worked closely with Andrej and Nikola Djurek to complete the typeface, and now more than 20 years after first sketches were completed, we can present it to public.</p>
