    <p>Hello</p>
    <p>I’m a grad student working on a research project involving non-static logo systems: ID systems comprised of some elements that are consistent and other elements that change from one implementation to another. The most well-known example is probably the MTV logo — the shape and configuration are consistent but the color, patterns and animation style are always changing. Other examples are the “Nick Jr.” pre-school Nickelodeon tv identity (illustrations of parent and child animals) and of course the Google logo.</p>
    <p>Can you think of other examples? Or even better, have you seen anything written about this that I could track down? In books, in magazines, on blogs, whatever. If you have ideas or resources to share I would really appreciate it.</p>
    <p>Thanks,</p>
    <p>Rob</p>
