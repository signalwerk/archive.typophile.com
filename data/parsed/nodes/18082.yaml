    html: |-
      <p>FontShop: same grid/boxes/colours, but the fonts change.</p>
      <p>The logo for the ATypI conference in Copenhagen 2001 was cery cool. I can’t find a sample online. I have the T-shirt, but it’s only non-static when I move. For the animation (as i recall), the 5 characters were split in half horizontally, and the top and bottom parts wandered/jiggled around, slowly and slighty.</p>
      <p>I change the typefaces of my logo every few years. Presently my website logo is animated. It’s done by cycling about 40 different applications of the “noise” filter to the same file.<br>
      </p><div class="imageWrap"><img src="/files/shinntype.gif"></div><p></p>
