      <p>I personally like <a href="http://www.myfonts.com/fonts/ef/zapf-renaissance/" rel="nofollow">Zapf Renaissance</a>, which is familiar and friendly like Palatino, but enough different not to be overworn. See <a href="http://typophile.com/node/4782" rel="nofollow">this helpful Typophile thread</a> on the difference between B and H - the only difference I can see is tracking, but that's just the low-res preview.</p>
      <p>ITC Galliard is in the extended family of Garamond, but crisper. It feels a little cold to me, though, even though that might work ok with the Gotham.</p>
      <p>A large optical scale of Centaur might also fit the bill, but it hasn't been released yet. Another classic that might work is <a href="http://www.fonts.com/FindFonts/HiddenGems/Perpetua.htm" rel="nofollow">Perpetua</a>.</p>
      <p>One new font by a living designer that deserves more attention is Cycles by <a href="http://www.stonetypefoundry.com/" rel="nofollow">Sumner Stone</a>.</p>
