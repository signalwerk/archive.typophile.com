    <p>I would like it to have a crispness in the serifs that will give it a sparkle at large sizes, say 90pts headlines. Currently, our Adobe Garamond looks blobby to me if it gets too large</p>
    <p>So far, I've come across 2 faces that generally have the feel I'm looking for : Mercury and Requiem both by HoeflerF-J <a href="http://www.typography.com/catalog/mercurydisplay/index.html" title="http://www.typography.com/catalog/mercurydisplay/index.html">http://www.typography.com/catalog/mercurydisplay/index.html</a>  <a href="http://www.typography.com/catalog/requiem/roman.html" title="http://www.typography.com/catalog/requiem/roman.html">http://www.typography.com/catalog/requiem/roman.html</a></p>
    <p>Requiem might be a little too fine to surprint pictures.<br>
    I'd like to avoid a didot type of approach--it's too stiff; needs more personality</p>
    <p>This display face would most likely be partnered with the sans serif Gotham (now, I really sound like a broken record--hell, I should get a commission!) by HoeflerF-J: <a href="http://www.typography.com/catalog/gotham/index.html" title="http://www.typography.com/catalog/gotham/index.html">http://www.typography.com/catalog/gotham/index.html</a></p>
    <p>I'm project I'm working on is a magazine redesign for an ultra-affluent market demographic dealing with boats. So, I'll be surprinting water and sky pretty often. </p>
    <p>Any suggestions?</p>
