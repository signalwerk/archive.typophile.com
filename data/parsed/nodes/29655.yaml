      <p>Josh Darden's Freight family--text serif, text sans, and serif display--meets all your requirements perfectly. Also check out his Corundum. Joshuadarden.com</p>
      <p>Swift and NuSwift, its counterpart with oldstyle figures. The crispest serif fonts in the produce section!</p>
      <p>Stone Serif and Stone Sans. Warnock Pro from Adobe.</p>
      <p>Besides Reminga by Xavier Dupré, mentioned above, there's also his new Zingha, which is even snappier. Dig that lower-case a...!! Check out both at fontshop.com</p>
      <p>Problem with Gotham: no oldstyle figures, which are increasingly in demand for style reasons. Check out Darden's Freight Sans as a really fine alternative.</p>
      <p>Your requirements demand more than two weights per family, and all these have at least three, very important for flexibility in use as you mention.</p>
