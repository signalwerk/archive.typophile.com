      <p>Tomas, beautiful! Děkuji!<br>
      I love the ‘g’.<br>
      I know, it’s a freebie, so I’m not really entitled to make any demands – but as you laudably have included all those diacritics, do you think it’s possible to do an ‘ß’, too? And in case you find that unsuitable for a unicase face, is there a technical way to automatically substitute ‘ß’ by ‘ss’? I just stumbled across this minor flaw: By assigning Metalista to a little text in InDesign, all the ‘ß’ instances just disappeared. No warning, no empty box, nothing.</p>
      <p>F</p>
