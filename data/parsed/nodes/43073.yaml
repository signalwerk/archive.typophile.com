      <p>Thanks, Tomas! You've fixed it :)</p>
      <p>Florian, I think the easiest solution would be to put two S into the ß glyph slot. But this post wasn't posted in the critique section, so we're content with what we get ;)</p>
      <p>Edit: Using the "All Caps" feature in InDesign automatically turns the ß to SS, so that could serve as workaround.</p>
      <p>Jens</p>
