    html: |-
      <p>Just quickly, at 5 am ... The best thing would be to download the demo version, test it, and decide for yourself.&nbsp;&nbsp;:)</p>
      <p>Three things that come to my mind: BezierMaster’s bolding function gives better results than FLS’s. The way the FontMaster modules deal with OT features is quite smart — they generate a font-specific feature file from a big one and omit specific substitutions if required glyphs are missing in the font. Also, you only need to set up a .cha file (which links glyph IDs, glyph names, Unicode codepoints) once and do not need to care for these things any more.</p>
