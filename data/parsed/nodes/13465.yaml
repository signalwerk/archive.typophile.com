    html: |-
      <p>&gt;and the instructors would just let it slide, knowing full well what was up. Is that commonplace?</p>
      <p>I’ve had some of my students cheat in this manner, but no so blatantly. Plagiarism is not always immediately apparent. If I didn’t notice it at first, I’m hesitant to bring it up, because I feel stupid for not having called them on it immediately. I wouldn’t want to make them redo an entire project because I had failed to point out a mistake earlier, that would be my fault, wouldn’t it? Because I had failed to draw the distinction between homage and plagiarism. So, if I notice plagiarism, I check with other staff, and give the student the benefit of the doubt that they didn’t know what they did was wrong, explain why it was, don’t make them redo the project, and apologize for having to give them a lower mark for the work.</p>
      <p>Usually, plagiarization is not so blatant as the 3 grey blobs.<br>
      But just suppose it was a slightly different color, slightly different arrangement of 3 blobs…</p>
      <p>***</p>
      <p>But hey, this is a typography forum.<br>
      Plagiarism is no big deal in type design — large software companies have appropriated others’ type designs with impunity. Looks like it’s infectious.</p>
      <p>***</p>
      <p>File sharing:</p>
      <p>With the present consensus on the acceptability of file “sharing”, this kind of plagiaristic design behavior may well now only be considered wrong for not giving accreditation: recycling a design, even copying files, is the way of the future. You know what they say — embrace the technology, the law is out of date…</p>
    html_clean: |-
