    <p>Hello, it's my first day here. I wonder if I could get some piece of advice on a font I've been playing with for some time. I'm not sure about the widths of 'A', 'Z' and 'z'. 'K' and 'k' might be a bit too wide, but I sort of like them. Shouldn't 'K' be more consistent with 'R'?<br>
