      <p>&gt; I don’t like the “extended” version</p>
      <p>OK, but type design being a largely servile craft, it's<br>
      useful to tame -although never ignore- one's preferences.<br>
      It really is true that in this case (and really most such<br>
      cases) two-pixel spacing will improve readability.</p>
      <p>The use of "Extended" is indeed a sort of pseudo-standard,<br>
      but it's quite an unfortunate one, and not <cite>too</cite> widely spread.<br>
      Except for perhaps a minor font-menu advantage, there's every<br>
      reason to do the right thing and call them what they are: Tight/Loose.</p>
      <p>But if you must keep the confusing terminology,<br>
      at least make the 2-pixel-space one the Regular,<br>
      and call the other one Narrow or Condensed...</p>
      <p>hhp</p>
