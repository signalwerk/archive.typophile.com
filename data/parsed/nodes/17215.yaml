    html: |-
      <p>&gt; if you set the tracking of the normal pixel<br>
      &gt; font at 125, you will have an extended version</p>
      <p>This is 90% OK, but not totally, because there are often "boundary conditions" that need to be exceptions (like the right side of the "r"). Brute tracking adjustments tend to throw off kerning as well (and Mana for example has 1400+ kern pairs).</p>
      <p>Also, for fonts that -properly- have 2 pixels of interletter space, using negative tracking to get a Tight version can lead to collisions.</p>
      <p>hhp</p>
