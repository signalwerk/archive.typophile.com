      <p>First thing: if this is for setting paragraphs (as opposed to buttons and such) make your interletter spacing 2 pixels, not 1. This might seem counter-intuitive, but it's the key to readability (at any PPEM above 9, especially for a widish font like this, especially at 1-pixel stems). If you're worried about economy (which applies a lot less to [onscreen] text than buttons) then it's actually better to make your letters narrower.</p>
      <p>I might give the lc ascenders one more pixel (and then raise the bar of the "f").<br>
      But leave the cap height where it is.</p>
      <p>Make the "t" and the "f" wider.<br>
      The "f" doesn't need more right sidbearing though.</p>
      <p>Caps: the "R", "X" and "Z" are unhappy. The "N" is too wide.<br>
      If you're worried about the "A" looking too narrow, lower its bar.</p>
      <p>The numerals are actually very very good.<br>
      You might just try lowering the waist of the "4".</p>
      <p>No time to look at the non-alphanumerics, sorry.</p>
      <p>hhp</p>
