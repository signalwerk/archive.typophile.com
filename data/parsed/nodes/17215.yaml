      <p><cite>Thank you, Hrant!<br>
      I added one pixel.. seems to have helped a little.<br>
      To tell the truth, I don’t like the “extended” version - it’s a sort of a byproduct to me that doesn’t take much effort to build.</cite><br>
      =====================</p>
      <p>Well i think that developing an "extended" (adding one pixel space) version of a pixel font, is not needed at all. </p>
      <p>Since web designers / developers will use them within Photoshop and Flash, if your font is developed at 1000 UPM size and the grid step is at 125 (125x125 = 1 pixel) then it will be used at size 8.</p>
      <p>So in Photoshop if you set the tracking of the normal pixel font at 125, you will have an extended version, thus having one more pixel space in each glyph. If you set it at 250 you will have 2 pixels space and so on...</p>
      <p>In Flash you do this by entering 1 in the tracking field for adding one pixel space to each glyph, 2 for adding two pixels space and so on...</p>
      <p>;o)</p>
      <p>When i will have my pixel fonts ready i intend to have as much guide info for using pixel fonts as i can...</p>
