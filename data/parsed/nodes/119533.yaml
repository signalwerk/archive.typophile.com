      <p>Mission Gothic Bold (LostType) was a decent match to "PORK CHICKEN BEEF," but not a match to anything else. And I had no luck with Google fonts. </p>
      <p>Signal seems to be your best bet for all the sans-serif type, with just a customization on the tail of the Q.</p>
