    html: |-
      <p><cite>It sounds like Firefox's liga (standard ligatures) feature is on by default? </cite></p>
      <p>It depends on the type size. </p>
      <p><cite>Do Safari &amp; Chrome have liga turned on by default?</cite></p>
      <p>AFAIK not. But there are extensions for Safari and Chrome to set "rendering:optimizeLegibility" for every page automatically. </p>
      <p><cite>Can anyone confirm the class based kerning works in either Chrome, Firefox or Safari?</cite></p>
      <p>It is triggered the same way as the ligature support.</p>
    html_clean: |-
