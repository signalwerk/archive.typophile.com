    html: <p>The point of the CALT feature is to improve the text display for certain letter combinations. So turning it on by default is the recommended behavior&nbsp;– in contrast to something as DLIG, SSxx and the like.</p>
    html_clean: <p>The point of the CALT feature is to improve the text display for certain letter combinations. So turning it on by default is the recommended behavior&nbsp;– in contrast to something as DLIG, SSxx and the like.</p>
