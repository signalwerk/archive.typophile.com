    date_raw: 26 Feb 2012 — 3:13am
    votes: null
    html: <p><code>calt</code> should be on by default, if your font is using it for a non-default substitution, then you are using the wrong feature tag (note, the substitution can still be contextual but under a different tag, e.g. <code>dlig</code>, this is very legitimate).</p>
