      <p>Safari and Chrome support the basic features in recent version.<br>
      Firefox as well and any OT features called with a -moz syntax: <a href="http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype-features/" title="http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype-features/">http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype...</a><br>
      Depending on the browser and the font-size one might need to set:<br>
      text-rendering: optimizeLegibility;</p>
