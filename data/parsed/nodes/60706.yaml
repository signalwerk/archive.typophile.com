  html: |-
    <p>A question for type designers and foundries. Are you populating the description and/or license fields in your OpenType fonts?</p>
    <p>We're investigating a new bug that limits these fields to 5,000 characters (edit: regardless of encoding). Need to determine if this limit is unrealistic.</p>
    <p>Cheers, Si</p>
  html_clean: |-
