    date_raw: 8 Aug 2009 — 2:47am
    votes: null
    html: |-
      <p>The SIL Open Font License is around 4600 chars, so is probably safe. We do expect people to put the full OFL license in their fonts. It seems to me that having the complete 'rules of use' (EULA) in the font itself would increase the chances that users actually follow them. And that would be a good thing, right?</p>
      <p>There is already a license URL field that gives a link to an external EULA, so the main license field seems like it should be used for that purpose - to show the complete license. Although it does not affect OFL-licensed fonts, you probably need to fix the bug, or potentially face a vendor who wants to have their full EULA in the font (which should be their right) and can't, and accusing MS of not giving them the right to properly communicate their EULA. :-)</p>
      <p>Victor</p>
    html_clean: |-
