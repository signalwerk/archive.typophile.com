      <p>There are two ways to approach it. If you are just starting out, the look of a virginal empty page could be a little intimidating (heck, it still gives me the shivers) and starting a layout with predetermine grid settings might help you out to overcome that, or it might drive you deeper into a corner and inhibit imagination. Another way, is to sketch the initial layout, get your copy onto the page, then play with it for a little while on a purely aesthetic level, before setting for a particular grid system. Once you get a little more experience, you'll begin relying more on particular combination that you've found to work well, but in order to get there, it might help to start by working "organically".</p>
      <p>Just my two cents.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
