      <p>Read this and think about it:</p>
      <p>I spent six years in Art School (took a bit longer than I wanted, hah) studying Illustration and Graphic Design (and Fashion, Fine Arts, Painting, Drawing, Lithography, etc), after fiddling around with doing lay–outs for my ‘High School’ magazine for three years. Then I went into pro illustration and visualising, doing design jobs on the side (paste up, anyone remember that?)<br>
      Next I discovered the Mac (somewhere in the later part of last century), taught myself QuarkXPress. Did Graphic Design. With Quark for 14 years. Switched to InDesign when OS X became ‘it’. Worked with ID for the last 6 or 7 years and now you want me to tell you how to do the MOST SIMPLE JOB THERE IS?</p>
      <p>Learn! Experience! Teach yourself! The Internet is there to help you, giving you the opportunity to look at a lot of stuff. And ID has a very good Help-function.</p>
      <p>(Sorry if this is rant-ish — young people are so… depending… kind of… What about being self-sufficient?)</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
