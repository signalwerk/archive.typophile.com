    <p>The Ascender 2010 Font Pack is the first product designed to showcase the new OpenType typographic features in Office 2010. The Ascender 2010 Font Pack includes 14 fonts for only $14.99, including new and enhanced versions of the Comic Sans &amp; Trebuchet fonts.</p>
    <p>Elk Grove Village, IL -- July 6, 2010 -- Ascender Corporation, a leading provider of advanced font products, announced today a new collection of OpenType™ fonts created specifically for use in Microsoft™ Office 2010. The Ascender 2010 Font Pack features 14 fonts with enhanced OpenType features that showcase the advanced typographic features new to Microsoft Word 2010 and Microsoft Publisher 2010.</p>
    <p>Ascender 2010 Font Pack showcases new OpenType font features in Microsoft Office 2010</p>
    <p>Included in the Ascender 2010 Font Pack are new and enhanced versions of Microsoft's popular Comic Sans™ and Trebuchet™ fonts, along with fancy script and display fonts developed by the type design team at Ascender. Each font was optimized to support Office 2010's new OpenType typographic features. Also included in the Font Pack is a set of templates for Word 2010 and Publisher 2010 that show off the fonts in action.</p>
    <p>The Ascender 2010 Font Pack is priced at $14.99 with a single user license and is available for immediate download exclusively from Ascender's FontMarketplace.com website. The Ascender 2010 Font Pack is packaged with an automatic installer for Microsoft Windows.</p>
    <p>"The new versions of Comic Sans and Trebuchet have a lot of great OpenType features" said Vincent Connare, the original designer of the fonts. "My hat's off to Ascender for creating swashes and other delightful flourishes that give these fonts a breath of fresh air."</p>
    <p>Office 2010 has many new features to let users be more creative and expressive. The new OpenType font features in Word 2010 and Publisher 2010 allow users to select various advanced typographic features that can be built into OpenType fonts. This includes ligatures, number forms &amp; spacing, contextual alternatives and stylistic sets. The Ascender 2010 Font Pack includes a 14 page User Guide with detailed samples of each font and the features it has that are supported in Office 2010.</p>
    <p>"The new Microsoft Office 2010 already has a significant base of customers, including over 9 million downloads of the beta version." said Ira Mirochnick, President at Ascender Corporation. "These new OpenType fonts provide Office 2010 customers with an affordable set of creative tools that tap into exciting new font features in Word 2010 and Publisher 2010."</p>
    <p>The Ascender 2010 Font Pack contains the following fonts: Comic Sans 2010 (including new italic and bold italic fonts), Trebuchet 2010 (including new black &amp; black italic fonts), Impact™ 2010, Pokerface™ 2010, Rebekah™ 2010 and Rebus Script™ 2010. This diverse selection of font styles and weights are great for home and business projects, expanding the typographic creativity and professional look of documents.</p>
    <p>The Ascender 2010 Font Pack requires Microsoft Office 2010, or an application that supports OpenType typographic features (i.e.Adobe Creative Suite, QuarkXPress, Mellel). For more information or to download the font pack visit: <a href="http://www.fontmarketplace.com/font/ascender-2010-pack.aspx" title="http://www.fontmarketplace.com/font/ascender-2010-pack.aspx">http://www.fontmarketplace.com/font/ascender-2010-pack.aspx</a> </p>
    <p><a href="http://www.ascendercorp.com/pr/2010-07-06/" title="http://www.ascendercorp.com/pr/2010-07-06/">http://www.ascendercorp.com/pr/2010-07-06/</a></p>
