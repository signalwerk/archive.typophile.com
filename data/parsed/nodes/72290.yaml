      <p>@ Christopher Slye  - Down below are the guideline issued by Finance Ministry in regards to Indian Rupee symbol design competition. </p>
      <p>According to guidelines : <a href="http://www.saveindianrupeesymbol.org/2010/06/indian-rupee-symbol-guidelines.html" title="http://www.saveindianrupeesymbol.org/2010/06/indian-rupee-symbol-guidelines.html">http://www.saveindianrupeesymbol.org/2010/06/indian-rupee-symbol-guideli...</a></p>
      <p><strong>. A participant can send a maximum of two entries.<br>
      . The symbol has to be in the Indian National Language Script or a visual representation.<br>
      . The symbol should be applicable to standard keyboard.</strong></p>
      <p>But RTI (Right To Information)had already exposed that he is Non-eligible candidate for Indian Rupee Symbol Design Competition as he had violated the Indian Rupee Symbol Design competition guidelines .</p>
      <p>According to guidelines one candidate could send maximum two design entries but <strong>he had submitted a total of four designs.</strong></p>
      <p>Second violation of guideline is the symbol itself, as <strong>it's not applicable to standard keyboard or Unicode enable.</strong>(Controversial guideline)</p>
      <p>Violations are not stopping here according to information and broadcasting minister Ambika Soni "The new rupee symbol partially resembles the Devanagri ‘Ra’ and Roman capital ‘R’ without the stem coupled with two parallel lines – in line with Finance Minister Pranab Mukherjee’s vision for a symbol which reflects and captures Indian ethos and culture."</p>
      <p>But using roman script/English alphabet in designing the New Indian rupee symbol is also a violation of guideline according to the guideline <strong>"The symbol had to be in the Indian National Language Script".</strong></p>
      <p>But according to National language Script English is not included in that list till this date.</p>
      <p>More over RTI Activist exposed : Mismanagement and violation of guidelines in “Indian Rupee Symbol” design competition.</p>
      <p>According to RTI Documents : <a href="http://www.saveindianrupeesymbol.org/2010/06/down-below-are-rtis-filled-by-rti.html" title="http://www.saveindianrupeesymbol.org/2010/06/down-below-are-rtis-filled-by-rti.html">http://www.saveindianrupeesymbol.org/2010/06/down-below-are-rtis-filled-...</a></p>
      <p> <strong>  1. Non-eligible candidate was shortlisted in top five finalists. As candidate had submitted four designs.<br>
         2. One finalist was in contact with Finance Ministry and RBI prior to competition.<br>
         3. Design concept or brief was not put in front of jury along with Indian Rupee symbol design.<br>
         4. No marks or grades were allotted to selected (2644) candidates design entries, in the process of shortlisting top five finalist design entries.<br>
         5. Jury had spends less than 20 seconds on each design entries to analyze it .<br>
         6. Three jury member were absent in two days long meeting dated 29th Sept. and 30th Sept. 2009.<br>
         7. One jury member from Ministry of Culture was absent on the day of final presentation.<br>
         8. All seven jury member had never meet in this whole selection process in any given time.<br>
         9. No records are available with Finance Ministry which could indicated, how many total design entries Finance Ministry had received ?</strong></p>
