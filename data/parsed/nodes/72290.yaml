      <p>David, Unicode doesn't do temporary codes, so this would need to go through the whole Unicode and ISO 10646 proposal and balloting processes before it gets a standard code assigned. Since the symbol has official backing from the Indian government, I wouldn't anticipate any problems in that process, but it will still take time.</p>
      <p>Michael Kaplan has suggested, however, that the encoding could be handled as a reference glyph change for U+20A8. That seems to me a sensible idea, since it would not require any updates to system and application software, and only updates to some existing fonts.</p>
    html_clean: |-
