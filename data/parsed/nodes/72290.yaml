      <p>Andreas: <em>It’s quite obvious how the glyph will look like in Arial or Comic Sans. But how … in Times, Bodoni, Garamond? The nature of the two horizontal strokes still leaves much to be determined.</em></p>
      <p>I suspect that the top bar, which in a Devanagari type should probably correspond to the head stroke, in European type styles will conform to the weight of the bar of the euro, yen and sterling.</p>
      <p>Frankly, it's not a very happy shape, and yet more evidence of what I stated when the euro symbol arrived on the scene: currency symbols should not be invented by designers, they should be invented by market grocers writing with jiffy markers on cardboard boxes. As a more general rule, people inventing new signs for <em>writing</em> systems should write them, not treat them as architectural projects. And they should certainly be aware that a shape that works nicely in a monoline, sans serif form isn't necessarily going to work well when subjected to higher contrast and variable stroke axis.</p>
      <p>Anyhoo... here's a quick run at a Brill rupee symbol.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/brupee_4690.png"></div><p></p>
