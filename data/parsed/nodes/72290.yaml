    html: |-
      <p>Good question, James. In the other two-bar currency symbols, one has the option to reduce to one bar in heavy designs and know that the symbol will still be recognisable. [In TTF one can also use hints to collapse two bars to a single bar at small sizes in low resolutions.] But in the new rupee symbol one of the bars also functions as a head stroke, so there's no way to remove the lower bar without risking confusion with the Devanagari letter र. I think the solution in a heavy design would probably be to drop the lower bar so that it crosses the stroke reversal going into the leg.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hvrupee_5244.png"></div><p></p>
      <p>I'd say this is pushing legibility of the symbol.</p>
      <p>The committees that decide on new currency symbols never seem to have someone like me on board, whose first instinct in any situation is to ask ‘What are the ways in which this could all go horribly wrong?’</p>
