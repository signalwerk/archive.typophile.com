      <p>Your observation about other two-bar currency symbols is correct, Bill. But in this case the top bar isn't crossing a symbol as in the euro or yen, it is forming the head stroke. It's more part of the structure than something crosses the structure.</p>
      <p>I suppose one could apply the analysis that this is not, in fact, a two-bar symbol, but a single cross bar applied to a shape that includes a head stroke like र. In that case, a rational argument can be made for allowing the bars to have different weights, with the cross bar being lighter than the head stroke. But rational arguments do not guarantee pleasant glyphs.</p>
