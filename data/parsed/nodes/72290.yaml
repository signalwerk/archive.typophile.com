      <p>There are, practically, going to be three different models for this symbol, based on usage.</p>
      <p>The official version, as designed by Mr Kumar, will presumably appear on bank notes and coins.</p>
      <p>A vernacular written version will presumably develop in India, and I suspect it will be a र, written with one of the two typical ducti that writers of Devanagari employ, with a crossbar through it. Understanding these ducti will be useful for makers of handwriting fonts (Ray, I think your construction is atypical: either the head stroke is written first as a separate stroke, or the body is written first and then the head stroke added above; in a lot of informal Devanagari handwriting, the head stroke ends up being above the body of the letter, rather than attached to it). This form will be used mainly in conjunction with Indic style numerals. It is worth noting that different Indian scripts have their own numeral symbols, and that there may be localised vernacular forms of this currency symbol that derive from the way the individual scripts are written, or something more Latin R-like may be preferred on the basis of national script neutrality. [There are at least some people in India who favour a distinct rupee symbol for each script, which could still happen alongside the official federal version.]</p>
      <p>A Latinised form will harmonise with European fonts and will be used primarily in the context of European numerals. In language tagged text, an OTL 'locl' variant could be used to switch between a European styled and Indian styled rupee symbol.</p>
