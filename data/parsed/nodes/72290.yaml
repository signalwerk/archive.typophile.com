      <p><em>compare all the crossing bars of your regular and bold $, ¢, £, € and Rupee glyphs. What you show is highly inconsistent.</em></p>
      <p>Well, good. I'm glad you noticed. Yeah, of course the crossbars are inconsistent. I never even considered having evenly weighted crossbars as being something that would be desirable. Why would I want that? Why would that be something anyone would want to attain unless I were entering some kind of even crossbar font contest. The crossbars don't need to relate to one another in currency symbols. They can, and it certainly looks fine in light weights. But what's the advantage? They aren't usually seen together. Numerals are their natural companions. A yen and Euro can have thinner crossbars, a cent and sterling can have thicker. Does it look good with numerals. Then the crossbars are the correct thickness. In my example, my dollar sign cross strokes happen to be short. Of course I don't want to match them to the Euro. They need to be fattened up, they need presence. The thickness is determined by the density and relation to numerals and my particular mood. Looking good with numerals trumps all. That's the most important thing. Although Ke$ha complicates things. Why, Ke$ha?</p>
      <p>It's hard to guess how grocers will write the rupee. From my marker scrawlings, it seems more practical to increase the size of the top bowl and diminish the tail. I tried drawing about 100 of these but I am not an Indian grocer.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/100_6001.png"></div><p></p>
      <p>All that I've discovered it that the new rupee symbol is really god damn hard to draw and that I'm very glad I'm not an Indian grocer. Maybe it'll relate to the R because of the Rs. Anyway. Grocers, please get to work and figure this out for us.</p>
