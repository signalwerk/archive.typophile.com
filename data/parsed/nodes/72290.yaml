      <p>Andreas,</p>
      <p>My document gives the designer because this is the result of a contest. That's part of the history of the character. I did the same thing in <a href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3392.pdf" title="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3392.pdf">http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3392.pdf</a> the proposal to encode the Kazakh TENGE SIGN.</p>
      <p>As to your second point, well, you're just wrong. Firstly, using Devanagari RA as obviously as you did in your font would be inappropriate for a Latin-based font, and moreover a lot of Indians use other scripts and feel that Hindification via Devanagari is not a good thing.</p>
      <p>Secondly, the thing WAS IN FACT devised as an amalgam of Devanagari RA and the right half of Latin R. And so far the most successful designs for the character I have seen have taken R as the starting point. Just as the most successful EURO SIGNs take C as their starting point.</p>
