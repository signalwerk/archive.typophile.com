      <p>Forrest: <em>As a practical matter, how does this come into use? That is, how do office workers and designers get this added to fonts they have? What happened when the Euro symbol was adopted?</em></p>
      <p>The euro symbol was a different beast in terms of software support, font updates, etc.. It was something that was added to existing 8-bit Latin codepages, and hence to all fonts that claimed support for those codepages, and of course to any font that one realistically wanted to license in a European market. It was a huge, huge undertaking.</p>
      <p>As far as I know, only Apple among the major OS makers have 8-bit codepages for Indic scripts, with few fonts targeting those codepages. Microsoft's support for Indic scripts has always been Unicode-centric, and I didn't notice any IBM or other codepages for Indic scripts. So there will be a lot less pressure to update the majority of fonts, which do not support Indic scripts. The rupee symbol will probably be like the majority of currency symbols in Unicode that are only found in fonts that support particular languages/scripts, or in fonts that aim to support complete Unicode blocks.</p>
