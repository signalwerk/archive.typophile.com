      <p>Michael,<br>
      I have two concerns about your document.</p>
      <p>1) An ISO proposal document should not appear as a memorial to a single person who has invented a miserable glyph for a character he not invented.</p>
      <p>2) quoting from <a href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3862.pdf" title="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3862.pdf">http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3862.pdf</a>,<br>
      p. 1:<br>
      <cite>The shape of the currency sign has been specified as “an amalgam” of the DEVANAGARI LETTER RA, and the LATIN CAPITAL LETTER RA and it is likely that many fonts will take the Latin capital letter as the starting point for design, to harmonize with European digits and other currency signs.</cite></p>
      <p>Drop the whole bit. It only pretends to make assumptions manifest which are utmost questionable. This is not any good.<br>
      (Personally, I doubt that a Roman base glyph per se fits better to digit glyphs which originate from India; see my previous post  ;-)  cheers</p>
