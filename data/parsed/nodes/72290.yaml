      <p>Monetary symbols born of any era have problems in typographic transition.  The U.S. Dollar is no prize either in a heavy weight, particularly the double bar variety. The new Rupee is no worse than the rest.  The slash lines are what mark all of them as monetary.  The problem the Euro had was that it was too exact when first released.  Now what has happened to it will happen to the Rupee as well. Five hundred type designers will putz with it to make it fit their own typefaces and a general feeling of what reads as the symbol will evolve and make itself known with time. At least this new Rupee does not have a construction diagram to go with it.  I take it as a fun exercise and am happy it is not more styled or designed as to be impossible to adapt.</p>
      <p>There will be rumbles of discontent until the real code point is fixed. Then we will just all go to work and draw it like we always have.</p>
