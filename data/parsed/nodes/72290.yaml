      <p><cite>Which isn't the way it looks in Kumar's design.</cite></p>
      <p>Of course not.</p>
      <p>As has been said before many times, the way and mode these “designs” (Euro, Rupee) are presented is misleading. It is plainly wrong to represent it as a technical drawing, cf. the Euro introduction.<br>
      The visual essence of such a sign (not ‘symbol’ btw) is its graph, the skeleton. The *rendering* of the sign’s skeleton is something else. Something very important, naturally.  That is what has been ignored again. </p>
      <p>As John Hudson repetedly remarked, a monetary sign should get “invented” rather by people who actually write it. Instead we witnes again a competion which is ruled by bloody laymenship sailing under the label “design”.</p>
      <p>Why is WRITING not recognized being a design discipline?</p>
      <p>I have read statements which favour the new sign being based on a Latin shape rather than on a Devanagari one. Considering the countries multiscriptive reality that has a point in terms of attempting neutrality. But if so: is the attachment of a Devanagari-headbar onto a Latin R-glyph such a good idea? The winning “designer” seems not to have bothered himself with such thoughts. Instead he was inspired by the Indian flag (!) and created an Roman-Indian bastard. If that is design, then throwing mud and mustard into one bucket is cooking.  ;-)</p>
      <p>However, we’ll sort it out. No choice.</p>
