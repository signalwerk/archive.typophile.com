      <p>As to encoding, M. Everson announced that he is preparing a proposal already.</p>
      <p>Now to the glyph. What I have seen so far very much reminds me of the Euro-glyph mess we had some years before. Well, the fontist community sorted it out rather quickly and trashed the initial “official” version.<br>
      What is that spell laying on introduction of new monetary signs? A government honours a “design” which again is of much frankensteinian technocratic inventiveness but next to nothing of typographic feeling. A bastard base glyph out of Devanagari RA and of Latin R! A clash of typographies – or a great moment of globalisation? </p>
      <p>It’s quite obvious how the glyph will look like in Arial or Comic Sans. But how … in Times, Bodoni, Garamond? The nature of the two horizontal strokes still leaves much to be determined. I’m curious to what life this creature will grow.</p>
