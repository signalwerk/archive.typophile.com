      <p><em>The crossbars don't need to relate to one another … They aren't usually seen together.</em></p>
      <p><em>The are. Just one sample, from <a href="http://www.ft.com/home/uk" title="http://www.ft.com/home/uk">http://www.ft.com/home/uk</a> :</em></p>
      <p>It doesn't matter. They're not together. Even if they were on the same line, the strokes wouldn't need to match. In heavy weights, the top of a T and bottom on an L don't need to match. The crossbar of an A and a crossbar of H don't need to match. The strokes of a seven and four don't need to match. When you're adjusting weight and trying to harmonize with other glyphs, there are many options, one of which is changing the weight of strokes. A euro is dense. A sterling is less dense. By restricting crossbar thickness variation, you have one less tool in your toolbox for dealing with the problems that arise in heavier weights. On course, if you're making book and light, you have the option of unifying strokes with little consequence.</p>
      <p>The mistake I made with my rupee was not using a similar strategy to what I used for the sterling and using a thinner middle crossbar. I think it might be sensible to look towards numerals for the rupees construction and ignoring the R altogether. The sample shown in the <a href="http://www.nytimes.com/2010/07/16/business/global/16rupee.html?_r=1&amp;src=busln" rel="nofollow">Times article</a> shows a straight horizontal stroke, which you could relate to the treatment of the stroke on of your seven. Maybe not a copy of the 7 stroke but somehow related, rather than using the R stroke as a cue. Maybe the top bar could relate to the 7, 5 or, if available, a flat topped 3. The middle could relate to the middle of a 3. You can start with an R if you like but eventually, your rupee will have to get along with numerals. When I make a euro, I use the zero as a starting point because it's not going to be hanging out with letters very often.</p>
