  html: |-
    <p>Ampersand brings together experts from all aspects of web typography, including branding and editorial designers, web developers, visual designers, browser makers, and type designers. The purpose is to provide the audience with a full picture of what typography can and should be on the web today.</p>
    <p>This year’s speakers include David Jonathan Ross, Dan Rhatigan, Jen Simmons (of Mozilla), Bianca Berning (Dalton Maag) and Michael Johnson (Johnson Banks).<br>
    Check out the full line-up here: <a href="https://2018.ampersandconf.com/">https://2018.ampersandconf.com/</a></p>
    <p>Use AMPERSAND10 to get 10% off all tickets including workshops.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/ampersand-social.png" width="1856" height="859" alt="Ampersand 2018">
