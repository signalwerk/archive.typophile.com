      <p>Wow, Jared comes out of nowhere with a nice slabby list.</p>
      <p>wyclef - Conduit is bizarre indeed, intentionally. I get the feeling you're not ready to buy any new fonts, so why don't you let us know what you've got and then we can be more helpful in suggesting a City pair. If you <em>are</em> willing to invest in some new type, may I suggest <a href="http://www.fontshop.com/search/?q=FF%20DIN" rel="nofollow">FF DIN</a>, <a href="http://www.fontshop.com/search/?q=diamante" rel="nofollow">Diamante</a>, and <a href="http://www.fontshop.com/fonts/downloads/linotype/eurostile_std_ot_virtual/" rel="nofollow">Eurostile</a>  as a tamer alternatives to Conduit.</p>
