    html: |-
      <p>Perhaps you can't find it because it's actually called "<a href="http://www.myfonts.com/fonts/berthold/city-bq/medium/" rel="nofollow">City BQ</a>" by Berthold. What you're looking at on Font101 is an illegitimate version. </p>
      <p>Here's some good alternatives from other foundries:</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/font_bureau/dispatch_condensed_bold/" rel="nofollow">Dispatch Condensed Bold</a> by Cyrus Highsmith (Font Bureau)</p>
      <p><a href="http://www.fontshop.com/fonts/singles/linotype/memphis_bold/" rel="nofollow">Memphis Bold</a> by Chauncey H. Griffith (Linotype)</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/monotype/rockwell_1/" rel="nofollow">Rockwell</a> by F.H. Pierpoint (Monotype)</p>
      <p><a href="http://www.fontshop.com/fonts/singles/linotype/stymie_medium/" rel="nofollow">Stymie Medium</a> by Morris Fuller Benton (Linotype)</p>
      <p><a href="http://www.fontshop.com/fonts/singles/paratype/geometric_slabserif_712_bold_ot/" rel="nofollow">Geometric Slabserif 712 Bold OT</a> by F.H. Pierpoint (Bitstream)</p>
      <p><a href="http://www.fontshop.com/fonts/singles/primetype/qugard_slab_caps_medium_lf/" rel="nofollow">PTL Qugard Slab Caps</a> by Ole Schafer (Primetype)</p>
