    <p>Could someone advise me on what would be a decent cost for me to purchase this specimen book. I have the option but have no idea on value.</p>
    <p>This image is not of the actual book, but of roughly similar condition. Cover knocked about a bit, with few fingerprints. internally, a few fingerprints on a couple of pages, and foldouts well creased.</p>
