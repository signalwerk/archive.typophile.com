    html: <p>I would put up a search on eBay. These show up every once in a while but they rarely break the $100 mark. These were printed in an enormous edition, can't recall it off the top of my head. Everyone interested in typography or letterpress already seems to have a copy. In the end, ATF still had so many of them they were used as fuel to heat the facilities.</p>
