    html: |-
      <p>Hi Mark</p>
      <p>That would have been in St Paul, I'd guess. :—) Those were good formative years for me.</p>
      <p>Someone sent me a bunch of big old ATFs (pre-1923) a short while back as the result of a favor I did. Smelly, but turn-of-the-century smelly. I love books that smell.</p>
      <p>But I've always favored the BB&amp;S cat over ATF for some reason. Bit more funk to it I think. Whenever I see one on eBay I bid as they never ever sell for what they are worth. Probably have a half-dozen of em here and there. I really have to get serious about weeding my library!!! Still, never had a Hansen, which sort of bugs me, hmmm.</p>
