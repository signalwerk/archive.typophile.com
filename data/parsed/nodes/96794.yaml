    html: |-
      <p>Relative to the em, there is more variety in x-height than in cap height.<br>
      For obvious reasons.</p>
      <p>So, because in U&amp;lc text x-height is more indicative of apparent size than cap height, one does see clear differences in apparent size between different typefaces—at the same point size—even though, were their x-height to be equalized (by varying point size) and text compared, they might look the same size.</p>
