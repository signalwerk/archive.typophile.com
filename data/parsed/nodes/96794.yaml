    <p>Hey a fontlab newbie question here.<br>
    I have opened two two fonts names frutiger and Gill sans in fontlab to see their construction(cap height and ascender height.<br>
    But i noticed something different. while the cap height of frutiger is around 1400, but the cap height of gill sans is only 680. What is the ideal sizes(from ascender to descender)? i heard it should not be more than 1000? and also what happens if it is more than 1000. I didn't see any problem with frutiger.<br>
    Thanks<br>
    Typogruffer</p>
