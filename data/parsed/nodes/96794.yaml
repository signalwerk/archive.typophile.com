      <p>And/but looking for an "ideal" is misleading. Although in the past (as John's comparison helps reveal) there was more of a "pseudo-standard"* in terms of vertical proportions, these days we see more freedom there. Any "ideals" are more like general guidelines (which don't even always apply): make the caps shorter than the ascenders; make the descenders shorter than the ascenders; let the cap accents float a bit above the top limit.</p>
      <p>* And within a given foundry (like ATF) often a strict standard.</p>
      <p>As for the 1000 issue: it's a legacy limitation... which does not however make it totally irrelevant.</p>
      <p>hhp</p>
