    html: |-
      <p>No matter how many units your Em is it gets scaled to fit in the "real" size. So 12 pt type will always fit in a 12/72 inch space... BUT "fit" does not mean what you might expect, since parts of a font (like the cap accents) can actually go over the upper or lower bounds (and it's the bounds* that are made to fit within the point size); also, you tend to leave some talus (AKA "internal leading") above the ascenders and below the descenders too.</p>
      <p>* Which BTW is not the same thing as ascender + descender...  :-)</p>
      <p>hhp</p>
