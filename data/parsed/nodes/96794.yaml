    html: <p>These fonts have different em unit definitions. My guess is that the Frutiger you are looking at is a TrueType version with a 2048 unit em, while the Gill Sans is a PostScript version with a 1000 unit em. The measurements of e.g. cap height are relative to the em, so in fact the Frutiger and Gill cap heights are almost identical.</p>
