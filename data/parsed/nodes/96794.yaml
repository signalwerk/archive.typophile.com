      <p>The em (also called the body height) is what is scaled, so it represents the height that will equal 12pt when the font is set at 12pt</p>
      <p>Units per em defines the grid on which the outline is defined. The PostScript standard prior to OpenType was 1000 units per em. Most TrueType fonts were traditionally 2048 units per em. but this was not a requirement. In OpenType, either flavour of font may have any positive integer number of units per em, but for legacy and compatibility reasons 1000 is still recommended for PostScript OTF.</p>
      <p>The ascender-to-descender height is often close to the em height, but that is not a requirement either: some fonts are 'cast small on the body', and a few may be taller than the em.</p>
