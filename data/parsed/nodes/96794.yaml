      <p>The apparent size of a (Latin) font comes almost entirely from the x-height region.</p>
      <p>Caecilia: I guess I remember wrong; I thought its ascenders and descenders overshot the Em bounds (which is what I'm calling "cheating"). But here's an example I'm sure of: at some point sizes the bitmap renderings of the old MS Core Fonts exceed their nominal point size* (ascender to descender).</p>
      <p>* I mean factoring in the 96/72 business.</p>
      <p>hhp</p>
