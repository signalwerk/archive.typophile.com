    html: <p>Differences in size between fonts at the same nominal size may be either apparent or actual. I would consider actual size differences to be differences between the ascender height and descender depth relative to the em. So, for instance, Monotype Perpetua is a type that is cast small on the body, i.e. the ascender-descender height is notably shorter than the em, and hence shorter than most other fonts. Apparent size difference is most likely, in Latin type, to be a result of difference in x-height and letter width, independent of the ascender-descender height relative to the em.</p>
