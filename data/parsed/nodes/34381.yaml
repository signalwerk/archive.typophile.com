      <p>"THE WORD 'LONDON' &amp; OLYMPIC RINGS<br>
      The designers deliberately avoided using sporting images or pictures of London landmarks. Instead the capital city's name is written in lower case.</p>
      <p>The objective in resisting an iconic image was to emphasise that while the Games is hosted in London, it is not just for London, but also for the UK and for the world.</p>
      <p>Putting London in lower case and in cartoon writing is a "disgrace" to the city, says Mr Autry, and there's an imbalance in having the word London and the Olympic rings both in the top half of the logo.</p>
      <p>"The word London is in an inelegant font, which devalues London as a city," he adds. "It looks like a child's writing."</p>
      <p>The font is called 2012bold and has been designed specifically, says corporate graphic designer Simon Murray.</p>
      <p>"The style of a handwritten font helps to carry through the contemporary theme. It is quite refreshing that they have used a font that is completely unrelated to the standard Johnston typeface used on tube maps and generally associated with London."</p>
