      <p>The font, like the mark, is inappropriate. It is trying too hard to get attention, screaming for attention. The whole thing is like an ad for a children's television program, or for candy for children, and that's not the Olympics. </p>
      <p>The Olympics is big fun, but there is also a sense of history and grandeur about it. A great mark and the typography combined will get both joy and grandeur. The multi-colored rings do succeed at that. There is an aura about the Olympics, the 'Olympic Spirit'. Both this mark and its typography totally miss out on it.  </p>
      <p>It is as if the designer thought dignity and respect for the hard work of the athletes, and the celebration of multi-national cooperation is 'not cool' and should be avoided. </p>
      <p>I think that is the reason for the anger. If you think the concept of the Olympic spirit is horsesh*t, that is your privilege. But to do a mark that contradicts the positive emotional meaning of the Olympics is bad design, and a huge missed opportunity.     </p>
      <p>By comparison, look at the Olympic logo of the upcoming Chinese Olympics:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OlympicLogoChina_4101.gif"></div><br>
      .<br>
      It manages to have dynamism and a sense of fun, but gets in both the reference to history, the Chinese location--by using the Chinese 'seal' style logo and brush writing of the words--and a sense of dignity given by the symmetry and the 'foundation' position of the multicolored rings. There may be better Olympic symbols, I don't know, but this is quite well done.<p></p>
