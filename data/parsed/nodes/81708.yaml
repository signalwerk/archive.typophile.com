      <p>I am not 100% about the US but in the Uk the minimum wage act means that offering an unpaid internship is illegal.</p>
      <p>I have however been on a couple of minimum wage paying internships which proved very good as learning experiences.<br>
      I would happily intern at any design studio whose work i admired - my ability to learn from those better than me is the only criteria i feel is important.</p>
      <p>Will</p>
