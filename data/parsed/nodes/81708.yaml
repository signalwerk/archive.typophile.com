    <p>With Summer fast approaching, many will begin to look for internships and apprenticeships in the world of type design. Let's pool what we know. Paid or unpaid, what opportunities do you see out there? Who typically accepts interns? Who amongst you have apprenticed to learn the craft?</p>
    <p>If you're an independent type designer, or run a small foundry, what would be your criteria for selecting an incoming intern or apprentice?</p>
