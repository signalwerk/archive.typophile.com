      <p>Dalton Maag does take interns, and we usually require people to stay between two to three months. All our work experiences are unpaid. Will's assertion about minimum wage is correct in as far as it depends what the intern does. If the intern is actively involved in the company's business, then minimum wage applies. However if it's a 'voluntary work experience' or 'study period' where the intern does not productively contribute to the business the M-W does not apply.</p>
      <p>Our interns are not involved in our day-to-day business but work on their own projects. Depending on their experience they may have to start off painting letters using brushes and b/w gouache paint to learn to see before we let them near any digital equipment. Once in Fontlab they learn the basics of the program and expand their design to the full Latin alphabet. Throughout this process the intern benefits from our team's experience and access to resources (computer, printer, internet etc). If the intern is talented, and we do ask him/her to contribute, the work is paid. Simple.</p>
      <p>And before anyone asks, we have no spaces until January 2013.</p>
      <p>Bruno Maag</p>
