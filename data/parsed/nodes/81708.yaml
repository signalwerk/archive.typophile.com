      <p>I'm currently interning part-time and have spoken to several (small) design and publishing companies here in Brighton who rely quite heavily on interns. From the company's side, they really just want somebody who's clued up enough to be a real help, so they'll review applicants' CVs carefully. At interview, they'll make sure the person isn't weird, but also go through a portfolio to see what skills they can bring and develop.</p>
      <p>&gt;in the Uk the minimum wage act means that offering an unpaid internship is illegal.</p>
      <p>Still, according to YouGov, 40% of interns here are not paid or receive expenses only. I think people assume the minimum wage doesn't apply somehow. For me it's a personal choice. I'd certainly consider an expenses-only type internship if such a thing existed; it would depend on the job description.</p>
