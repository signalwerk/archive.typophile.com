    <p>Hello All,</p>
    <p>I’m designing a clean, chic website for public relations client. typography is not my strength, so i am calling on the gods to help me. I’ve currently got helvetica neu 95<br>
    with a -10 kerning, but it needs the eye of a master given that this site will be so minimal in its design, its all about the font...</p>
    <p>here is the link,</p>
    <p><a href="https://web.archive.org/web/20080906204813/http://www.studiopyro.net/clients/HSPR/" title="http://www.studiopyro.net/clients/HSPR/">http://www.studiopyro.net/clients/HSPR/</a></p>
    <p>Many thanks,</p>
    <p>J</p>
