      <p>Does this firm specialize in PR for clients with super wide monitors?</p>
      <p>Anyway, Neue Helvetica is not a bad choice, but it won’t add any distinctiveness, either. Try finding something that pushes the same buttons but can stand out in a room full of neo-grotesques, maybe <a href="https://web.archive.org/web/20080906204813/http://www.fontshop.com/fonts/downloads/garagefonts/freight_sans/">Freight</a> or <a href="https://web.archive.org/web/20080906204813/http://christianschwartz.com/neutra2.shtml">Neutraface No. 2</a>.</p>
