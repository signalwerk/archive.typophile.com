    <p>I have been trying to identify the fonts used in this logo as I have been asked to create a print document based on it, however the company that designed the logo originally is not being forthcoming with the information ... see the attached image, best quality I have available to me</p>
    <p>I believe the second part of the font is "frutiger light" from the people at Adobe, but I have not been able to identify the first part, I think that maybe the serif on the 'h' in 'school' might help to identify it,</p>
    <p>kind regards</p>
    <p>Michael</p>
