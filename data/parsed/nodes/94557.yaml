    <p><strong>Hello Typophiles!</strong><br>
    --------------------------------------------------<br>
    We are proud to announce our new release!<br>
    --------------------------------------------------</p>
    <p><a href="http://www.myfonts.com/fonts/tipotype/sedan?refby=tipotype" rel="nofollow"><strong>"SEDAN"</strong> by Sebastián Salazar:</a> a roman text font focused on the proportions and morphology of early Baroque type faces. The constructional principle of Sedán is still Renaissance, but its expression and details are drawn from the typography of the 17th and 18th centuries.</p>
    <p>In larger sizes, is elegant and eye-catching; in the smaller sizes, however, Sedán seems to be very legible despite its spicy characters.</p>
    <p><a href="http://www.myfonts.com/fonts/tipotype/sedan?refby=tipotype" rel="nofollow"><br>
    <img src="http://ferfolio.com/files/Tipografia/Sedan_1.jpg" alt="SEDAN" title="SEDAN"></a><br>
    <a href="http://www.myfonts.com/fonts/tipotype/sedan?refby=tipotype/" rel="nofollow"><br>
    <img src="http://ferfolio.com/files/Tipografia/Sedan_2.jpg" alt="SEDAN" title="SEDAN"></a><br>
    <a href="http://www.myfonts.com/fonts/tipotype/sedan?refby=tipotype/" rel="nofollow"><br>
    <img src="http://ferfolio.com/files/Tipografia/Sedan_3.jpg" alt="SEDAN" title="SEDAN"></a></p>
    <p>Available in <strong>MyFonts</strong>, and as allways: <strong>40% OFF for Latin Americans</strong> on TipoType, and a lot of typefaces to come this year... Hope you like!</p>
    <p>----------------------<br>
    Best Regards<br>
    <a href="http://www.tipotype.com" rel="nofollow"><strong>TipoType.com</strong></a></p>
