    html: |-
      <p>Malcolm, do you mean the Ek module of the Ikarus system? The interesting thing is that the underlying system is radically different. Ikarus "knows" what stems are, and therefore preserves them. RMX has, to put it bluntly, not much idea what stems are. The whole power comes from the designed bold. One system cannot do without special hints, the other one needs a bold.</p>
      <p>I made a comparison between the results of the Ek module and the RMX tools.</p>
      <p>This is the unscaled version, which I show here so you can see which of the differences in the condensed stem from the slightly different input shapes:</p>
      <p><img src="/sites/default/files/old-images/Leipziger_regular_5226.gif"></p>
      <p>top: Ikarus, bottom: OpenType</p>
      <p>This one is automatically condensed:</p>
      <p><img src="/sites/default/files/old-images/Leipziger_condensed_5741.gif"></p>
      <p>top: Ikarus, bottom: Font Remix Tools</p>
      <p>The results are surprisingly similar. However, I believe the results of the Remix Tools are better because the horizontal proportions are not chosen by an intelligent program but are influenced by the rhythm of black and white found in the manually designed bold. I like the overall rhythm of the RMX version better, although the g is somewhat too narrow. With the help of the RMX Tuner it is very easy to quickly and intuitively adjust the width of individual letters, though.</p>
