      <p>Terrance:<br><cite>Do you make a separate font for SC, alternates, etc., or do you use OpenType coding?</cite></p>
      <p>Nowadays these things would typically be implemented as OpenType features. If you use "add suffix" in the RMX Scaler this automatically generates the new glyphs such as small caps as copies in the same font.</p>
      <p>In case you know that the application you use the fonts in does not support the necessary OpenType feature you may still want to use the "old-fashioned" system of putting the small caps or alternates into a separate font. </p>
      <p>Adam Twardoch made some interesting points in this thread: <a href="http://typophile.com/node/32455">http://typophile.com/node/32455</a></p>
