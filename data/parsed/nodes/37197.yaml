      <p>Difficult to make a comparison there. As far as I know, Superpolator improves interpolation and the like but does not aim at changing individual glyph shapes. It is a different tool for different tasks.</p>
      <p>The Remix Tools essentially allow to scale glyphs while avoiding the nasty side effects that mess up stroke characteristics. This may not sound very exciting at first but it saves a great deal of time.</p>
