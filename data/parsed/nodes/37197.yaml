    <p>Hi all,</p>
    <p>I am happy to announce the first public version of my Font Remix Tools for FontLab.<br>
    If you have an MM font with a weight axis these tools allow you to generate true small caps, tabular figures or even true condensed versions in a single step with an easy to use dialogue.<br>
    The Remix Tools come with an installer so you do not need any FL scripting knowledge to get them to work.</p>
    <p>More info and download at:<br><a href="http://justanotherfoundry.com/tools/RMX">http://justanotherfoundry.com/tools/RMX</a></p>
    <p>Sorry for crossposting if you have already read this.</p>
    <p>Enjoy!<br>
    Tim</p>
