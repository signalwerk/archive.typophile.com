    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_5632.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/phone number_3857.png"></div><p></p>
    <p>My client asked me to create their menu for them but I cannot figure out the main font ("Sakura Bana" and the phone number).<br>
    I've tried WhattheFont but I could not identify the font I needed. Since the file's PDF was exported from Adobe Illustrator, the font's information is not available in the properties...</p>
    <p>If there needs to be more information regarding this then I will be more than happy to add it. I suppose the next resource I could turn to is to contact the card designer him/herself (...though the card was made over a year ago). </p>
    <p>Thank you!</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
