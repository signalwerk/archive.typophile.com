    <p>Hello everyone,<br>
    I have finally figured out a way to create my own bitmap console font for linux, and I am working on making a versal esszet. However, my design skills are very lacking, and I was hoping you could give me some pointers to my first try. What I've got so far is: </p>
    <p>.........<br>
    .........<br>
    .........<br>
    .000000..<br>
    00...00..<br>
    00..00...<br>
    00.00....<br>
    00.00....<br>
    00..00...<br>
    00...00..<br>
    00...00..<br>
    00...00..<br>
    00.000...<br>
    .........<br>
    .........<br>
    .........</p>
    <p>I'm not quite sure how to get a good image of it in use. I have the .psf.gz files if anybody wants to take a look.<br>
    Thanks!<br>
    Glen W.</p>
