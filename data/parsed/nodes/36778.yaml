      <p>Lots of questions come to mind; some you may not want the beholder to have to ask. What is Michael Greco? Who is Michael Greco? Is Michael Greco a pair of last names that make a firm or company name? These questions come of the type in 'michael greco' looking too [kind of overbranded] to be a simple first and last name.<br>
      Having the luxury of seeing several different specimens, and looking up roadrunner.com to find that it's an internet service provider and most likely not Michael's employer, I get the feeling that Michael Greco is a consultant, marketer or strategist.<br>
      My advice would then be to add a word such as 'Consultant' to the design, just to fix the trouble with ambiguity.<br>
      Beyond that, the type alignment in these designs is too predicable. I think the best direction to work in is D-E.</p>
