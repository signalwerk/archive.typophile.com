    <p>I have been asked by a former collegue to critique some business card designs. I have been doing product design for the last several years and I'm feeling a bit rusty. I was wondering what some of you thought about the designs he sent me. He was the manager of a team of product managers for computer accessories (mice, hubs, etc.)</p>
    <p>I sincerely appreciate any feedback you may provide.</p><div class="imageWrap"><img src="http://typophile.com/files/bc2007_mg2_4180.jpg"></div><p></p>
