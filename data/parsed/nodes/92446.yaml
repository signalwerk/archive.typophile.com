      <p>Hi Bahman, </p>
      <p>Did you inspect our templates? They cover global mark positioning, followed by an optional round of manual tuning. If you then work with the font in Tasmeem, you will see that while our font layout engine avoids collisions intelligently. Kerning we do away with, that's a leftover from metal typesetting.</p>
