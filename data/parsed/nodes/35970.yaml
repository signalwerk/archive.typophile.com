      <p>A normal ellipse would be like trailing off something, or a longer pause.</p>
      <p>For example, "It's just… I want to do the right thing".  It's not too highly used in academic writing, but in literary writing, it's a good bit more so, and so having something to distinguish between the two is very useful.</p>
      <p><em>It's just…he called out for help: “help me… I'm […]&nbsp;dying.”</em></p>
      <p>So here you have normal ellipses in and out of the quote, with my shortening the quote (which might have been, who knows, "help me… I'm hurt and I'm dying."</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
