    <p>Greetings typophiles.</p>
    <p>I need to work with some text for an anthology which has had certain passages excised by its editor. Its important to denote where the removed passages occur. Normally I would use the ellipsis character (…) but in this case the ellipsis already occurs frequently in the original text. So the problem is how to typographically mark the distinction in the text between the “voice” of the editor and that of its original author.</p>
    <p>Is there a convention for handling this? I'm considering using an ellipsis wrapped in square brackets([…]) for the editor's deletions, which seems – to my eyes at least – to do the job, but it is an intuitive rather than an informed choice. I would be grateful for any suggestions or guidance you might have.</p>
    <p>Many thanks!<br>
    John F</p>
