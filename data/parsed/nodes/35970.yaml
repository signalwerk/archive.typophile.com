      <p>The brackets are encouraged by both MLA and MHRA, and verily helpful when the source text contains lots of ellipses (somewhat common in literature).  So for instance to take out a random chunk of my signature line, “El futuro es una línea […]&nbsp;nosotros mismos”.  However, they're also discouraged in APA, Chicago, and Bluebook, so, take that as you will.</p>
      <p>As to jupiterboy's comment, there is a Unicode slot for ellipsis, U+2026, but not for the others because they carry two separate semantic meanings.  With OpenType you could set up a ligature for the sequence U+2026, U+002E (period), that would be a correctly spaced four-period sequence.  But I Just went ahead and spaced my elipsis so that adding another punctuation mark would be properly spaced.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
