      <p>Ellipsis, ellipses. God save me. I should have a dictionary attached to my arm.</p>
      <p>Thanks for the reply. Looks like you are using the brackets with missing quoted material, and the plain ellipsis for the pause. What I'm more familiar with is the Chicago style usage where the ellipsis is for either situation, and how you snug it up to the letters tells the reader where the missing information was. I'll be on the lookout for this now. I glanced through the Chicago ellipsis and bracket section and didn't notice any bracketed ellipsis. This is has been a hot topic in my home for several years. Sad.</p>
