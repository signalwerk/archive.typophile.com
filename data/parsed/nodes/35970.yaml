      <p>As far as the ellipsis points themselves go, there are a variety of styles -- AP (Associated Press), for example, sets three closed-up periods in a row -- no spaces in between. I forget MLA style, but as I remember, it has more to do with how many periods are used when a comma is also in play, and where the comma goes (e.g., play . . . ,) when a final period is in play (aka four-dot ellipses) e.g., play. . . .) Much of this depended on the sentence structure before the material was elided.</p>
      <p>Chicago, at least at one time, recommended a fixed space between the periods in the ellipsis, I believe a three-to-em space, which is more than a word space in most modern settings. There are pluses and minuses to each style. By in large, we prefer a justifying word space between the periods, the minus here being that the space will vary a bit between the various ellipsis on a page, depending on the space used in individual lines.</p>
      <p>Now you <cite>could</cite> use closed-up periods (i.e.,"AP style") for material elided by the editor, and spaced periods for material the author had elided. But on balance, I prefer what you propose - using brackets around whatever you use for standard ellipsis. Any method you pick should have a note about the style used to distinguish material elided by the author as opposed to the editor.</p>
      <p>FWIW</p>
