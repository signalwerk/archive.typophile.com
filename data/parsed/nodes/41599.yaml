    html: <p>You'll definitely want to adjust the kerning manually. A lot of type designers spend more time on this than on the "black" shapes, and I would venture most would agree that a sort-of-crappy font can be rescued into at least mediocre-levels if the kerning and metrics are impeccable. That said, I would also definitely revisit a lot of these glyph shapes. If you're going for quirky and wonky, everything seems a bit too rigidly lined up; if you're going for geometric simple forms, it seems a bit too playful. I don't think this is close to being ready for a commercial release yet, but if it's something you really care about it definitely has potential.</p>
