    <p>Never made a font before. I've done hand-lettering and messed around making logos. Actually this font started as a logo for a brass band, and then for some reason I decided to do up a whole font. At this point I'm wondering if it's worth continuing and e.g. trying to sell it on one of those online font stores.</p>
    <p>If it's any good, what do I do next?</p>
    <p>PS The kerning is what TypeTool2 did automatically. I did some manual kerning and then lost it all somehow.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture2_5526.png"></div><p></p>
