      <p>I can see the potential of this, but it still needs lotsa work to make it attractive enough. I would first make sure that your glyph shapes make music together. Maybe you should cut all the glyphs (from scratch, with your basic idea in mind) out of black paper and see what happens. At this stage I wouldn't put to much energy in kerning. </p>
      <p>Maybe you find <a class="freelinking external" href="http://briem.ismennt.is/2/2.3.5a/2.3.5.03.capitals.htm" rel="nofollow">this link</a> about spacing useful.</p>
