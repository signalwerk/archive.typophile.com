      <p>I’ll think of some others later that helped me personally, but the thread of the year has to be the <a href="https://web.archive.org/web/20081007162401/http://typophile.com/froggy">’Froggy’ critique thread</a>—and those that followed it. </p>
      <p>Seeing Chris Lozos come into his own as a type designer has been really exciting, and his beautiful spirit has been a blessing to us all on Typophile. </p>
      <p>Matthew Carter liked ’Now Sans’ better at TypeCon 2006, I think, but I’ll always have an affection for the Frog :)</p>
