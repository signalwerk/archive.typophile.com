    <p>Just a bit of fun really.</p>
    <p>What were the best (or worst) threads/comments/wiki articles/battles/&amp;c. in 2006?</p>
    <p>Was there a thread that you found particularly insightful? Was there one that began interestingly, but you just simply ignored after it descended into flames? Was there one thread that made you split your seams with laughter at each succeeding comment? Was there a bit of information that somehow saved your hide? Was there one that was just simply too silly to spend time commenting on?</p>
    <p>Let’s hear your thoughts!</p>
