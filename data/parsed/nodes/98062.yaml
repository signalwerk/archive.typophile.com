    html: <p>Agree with Hrant. A possible pitfall of this kind of tool (with full respect and appreciation to Yanone's effort) is that it may give the user the wrong assumption that all curves have to be smooth. If you disagree with me, just run Speed Punk on renowned typefaces, especially Adobe ones like Adobe Garamond, Minion, Jenson, Arno, and their italics. Would you say they are bad typefaces because Speed Punk gives you bad results?</p>
