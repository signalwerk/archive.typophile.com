      <p>I have only learned recently (two years after the first working prototype of Speed Punk) how to properly read the illustrations and make good use of them. Now being even more fascinated by the tool.</p>
      <p>Today I let myself be carried to the extreme to say that curvature continuity across oncurve points is a necessity! It’s what happens left and right of them and with the curve as a whole (across multiple segments) that makes a difference. What Mark said.<br>
      Tension and curvature continuity don’t contradict each other.</p>
      <p>The cross reference to Garamond, Minion, Jenson, Arno is somewhat pointless because the originals to these designs were made without the technical constraints of the Beziér curve. It’s because we are required today to place points in often awkward locations like geometrical extremes why a tool like Speed Punk and curvature continuity is boss.</p>
      <p>Start paying more attention to the quality of the curvature distribution rather than continuity alone. See first showing above.</p>
