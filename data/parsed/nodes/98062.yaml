    html: |-
      <p>In my past life as an industrial designer I learned 3D modelling and in that world, mathematically perfect continuity is king. When I took my first type design class I was taught to draw in (gasp!) Illustrator and found the lack of curvature continuity analysis tools frustrating. I later moved on to Fontlab and then RoboFont but missed porcupine analysis from my Rhino3D days.<br>
      Needless to say I fell in love with speedpunk when I hear it existed…</p>
      <p>Anyways, after that love letter, here are a couple videos explaining continuity and continuity analysis. They're aimed at 3D modellers, but are very understandable and well worth a watch to better grasp what SpeedPunk does and why it makes for nice outlines.</p>
      <p><a class="freelinking external" href="http://cadjunkie.com/1113/continuity-101" rel="nofollow">http://cadjunkie.com/1113/continuity-101</a></p>
      <p><a class="freelinking external" href="http://cadjunkie.com/1117/continuity-102-analysis" rel="nofollow">http://cadjunkie.com/1117/continuity-102-analysis</a></p>
