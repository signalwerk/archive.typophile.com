    date: 2013-01-13T23:19:00
    date_raw: 13 Jan 2013 — 11:19pm
    votes: null
    html: <p>That's a different sort of question. As Tim Ahren's says regarding RMX Harmoniser -- which automates adjustment of curve smoothness -- don't go to the hospital if you're not sick. If the curves are the way you want them to be, and you are satisfied with the results, changing them to achieve mathematically better balanced smoothness is unnecessary. But that is a different thing from positing a strong hunch that a particular kind of design requires imbalanced curve smoothness. The real question to ask regarding a typeface like Turnip -- or any typeface, really -- and tools like Speed Punk or RMX Harmoniser is whether balancing the smoothness of curves mathematically significantly affects the shapes at all? My experience with RMX Harmoniser is that pretty much any curve involving one or more intermediate nodes can be expressed in a multitude of ways, most imbalanced in one way or another and one that is balanced.</p>
