    date_raw: 13 Jan 2013 — 8:50pm
    votes: null
    html: <p>I think you are still not understanding what Speed Punk does. In order for your statement to be true, it would be <em>necessary</em> for curves through nodes in an M-Formula design to be mathematically imbalanced, but that is not the case. What Speed Punk indicates about curves is mostly independent of design, i.e. it indicates how a curve continuing through a node is mathematically defined, not what the shape of the curve is or how it relates to other curves. It might be helpful to look again at the illustrations in Yanone's original post, and to realise that in every case the curves illustrated could be otherwise defined mathematically while retaining their shapes.</p>
