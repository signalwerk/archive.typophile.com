      <p>1. A curve may have an overall pleasing shape, but may carry even a slight sense of displacement at an intermediate node point. This will become more evident at large sizes, but since we're dealing with scaleable outline technologies, why not optimise the smoothness <em>if smoothness is the effect you are seeking.</em></p>
      <p>2. I use RMX Harmoniser in part as a tool to check my work, to determine whether the curves I have created are as smooth as I want them to be (again, presuming that smoothness is what I'm after), and I can imagine Speed Punk being similarly used. Both can be useful training aids, helping you understand how smooth curves are best expressed as beziers, and hence improving your use of the tools to achieve your design goals.</p>
      <p>3. I'm a smooth kinda guy, and I like my curves curvaceous.</p>
