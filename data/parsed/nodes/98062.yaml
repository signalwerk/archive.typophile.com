      <p>Calibri was built as a quadratic multiple master, and one of the reasons for that was that the rounded corners were too tight to cleanly convert back and forth between cubic and quadratic outlines. So the illustration in the other thread of Speed Punk applied to a converted-to-cubic Calibri outline seems to me not very useful.</p>
      <p>As Yanone says, Speed Punk -- like Tim Ahren's excellent RMX Harmoniser tool -- is concerned with what happens on either side of a cubic node on a continuous curve. This seems to me to have nothing to do with the so-called M-Formula, Hrant, which is about breaking curves with angles and the resulting relationship of interior and outer shapes.</p>
