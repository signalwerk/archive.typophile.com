      <p>On another related note, from what I remember from English Classes and such, that you can really hyphenate a word anywhere, as long as you place the hyphen in between syllables, and not just arbitrairly in between two letters. For instance, the word typophile could be hyphenated as:</p>
      <p>typ-ophile<br>
      typo-phile<br>
      typophi-le</p>
      <p>Is this incorrect? I only ask because if this rule is kosher, then you don't need to sit with the OED and a editing buddy, assuming though that you can sound out your syllables.</p>
      <p>P.S.- I am not familiar with Canadian, as I am English, the ones that live in America, not in England.</p>
