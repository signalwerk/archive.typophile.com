      <p>This is an old thread, but has become relevant to us lately. I'm an editor at a Canadian magazine. We've just completed a redesign, and suddenly the hyphenation is terrible. It's not just a question of US vs. Canadian vs. UK style (they're all slightly different). Some of the breaks InDesign/InCopy is making aren't acceptable in any dictionary AFAIK. We use Canadian Oxford as our main dictionary, but we'd be willing to use another for hyphenation if InDesign would just do so consistently.</p>
      <p>I can't see how the change in body font could affect hyphenation, and our prefs haven't changed with the redesign, as far as we can tell. Any thoughts?</p>
      <p>By the way, Track and Kern asks whether you can just break by syllable. That's not always true. From what I remember, US hyphenation tends to break according to the way a word is spoken and UK hyphenation tends to break according to word origin (so a break would fall right before a suffix, even if the pronounced syllable breaks elsewhere). Canadian probably falls in the middle. There are other subtleties that some publications follow, such as not breaking on so-called "liquid ells," a final syllable ending (usually) in "le." We avoid breaking bub-ble, for example.</p>
