      <p>From my experience, and from what I hear others say, is that generally the proofing tools within InD are crap, especially the dictionary. In any language, its garbage as far as I am concerned, and I use it in english. I am forever adding word to the damn thing that should most certainly be part of its lexicon already. You may consider integrating <a href="http://www.adobe.com/products/incopy/index.html" rel="nofollow">Adobe InCopy</a> into your workflow, as it seems to be something that major publications use now. Essentially, its the linking program that combines the editing capabilities of a processing application with the design capabilities of the layout program. I have never personally used this program, so I have no idea if it is worth the expense, or the hassle of teaching your department. I have heard from a few though, that it works as a great solution to link editors and copywriters with their designer counterparts. </p>
      <p>Hope that helps.</p>
