      <p>There are a number of bugs that pop up with adding a user dictionary to the stock ID dictionary, with both both CS2 and CS3. We've reported this to Adobe, they have acknowledged it, and it *may* change in future releases. We go through bloody hell to use a custom dictionary, and vigilance is required to make sure the correct dictionary is in play with each job.</p>
      <p>As to the hyphenation of "typophile":</p>
      <p>The usual practice, in the States anyway, is that single vowels stay up. The proper hyphenation is typo-phile.</p>
      <p>You will find some of those who don't break before a liquid ell (good idea) extending the notion, so that bubbling is not breakable. I've always felt that bub-bling is OK, bub-ble is not.</p>
      <p>Remember that disallowing hyphen points always involves a compromise: word spacing will be more uneven.</p>
