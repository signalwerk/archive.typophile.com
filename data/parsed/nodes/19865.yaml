    <p>HI All,<br>
    I'm having major problems getting the Candian dictionary in InDesign to work in my documents. Our text is breaking in horrible ways right now after I've tried to fix it. Needless to say, my co-workers are angry at me. It was my idea to switch our dictionary to Canadian from US. </p>
    <p>After we typeset stories the editors check it for "bad breaks". I thought this was a ridiculous waste of time since we had a Canadian dictionary within the progam that we could apply to our documents. The "bad breaks" occur because the auto-hyphenation of the US dictionary which we've been using up until now. We want our words to break in the Canadian style.</p>
    <p>My question is this:</p>
    <p>I've changed the InD dictionary preferences of all the computers in the art dept. to the Canadian dictionary. We flowed in our text and typeset it but now how it's hyphenating is worse than ever. It's breaking in very un-canadian and un-american ways.<br>
    I can't figure out what I've done wrong and the editors are really annoyed with me. Also, in my preferences, I have "Merge User Dictionary" checked off. </p>
    <p>When I'm in a document and go to the dictionary, it's default is ENG. USA  and Language: USA</p>
    <p>We haven't created a new template for this issue, so I wonder if that's the problem?</p>
    <p>Has Adobe played a cruel joke on us? Is there really no Canadian dictionary or like many others, do they just lump us in with the US figuring we're all the same?</p>
    <p>Thanks so much for any help or any suggestions anyone can offer.</p>
    <p>I'm going to hide out in the bathroom 'til this all blows over.</p>
    <p>-S</p>
