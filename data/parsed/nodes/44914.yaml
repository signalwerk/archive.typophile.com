      <p><cite>we invariably consider semiotics which consists of semantics (the relation between signs and the concepts they represent), syntax (the formal relation between signs in a system), and pragmatics (the study of signs in use)</cite></p>
      <p>Where did you get that from? Morris? Bense? ... For a clearer (and at the same time obscurer) conception of what semiotics is about, have a look into Peirce's own writings. It's worth the efforts.<br>
      You'll quickly find out that there is no stand-alone science 'semiotics' as which it is sold here and there. Whenever Peirce talks about signs, he does so in a strictly epistemologic sense and in the context of his three categories, cosmology, etc. Once scholars started extracting something like 'semiotics' from this corpus, they ridiculed rather than improved it.<br>
      Also, the time when designers thought they need semiotics' vocabulary to give themselves a scientific touch hopefully is over since one or two decades now.&nbsp;&nbsp;;-)</p>
