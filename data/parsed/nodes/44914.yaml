      <p>What I found was this article (<a href="http://www.signographie.de/cms/upload/pdf/signogr_einfuehr_1.0.pdf" rel="nofollow">German</a> and <a href="http://www.signographie.de/cms/upload/pdf/signography_intro_1_eng.pdf" rel="nofollow">English</a>). Actually, this belongs to my category "designers thought they need semiotics' vocabulary".<br>
      A few remarks about the first part of this introduction, "What is a sign?":<br>
      A. Stoetzner's use of semiotics' vocabulary indicates that he does not know much about it. Semiotics and semiology are not the same, as he suggests with "(semiotics or semiology, teaching of signs in a most general sense)". What he gives as definition of "sign" leans towards Morris whose take was fashionable in the 80s when the <em>Handbook</em> was written, but has already been criticised 40 years earlier (see below). Stoetzner cannot be blamed for citing from Noeth's <em>Handbook of Semiotics</em>, but he can be blamed for obviously not having read anything else. In the last sentence of the first part he reveals his complete misconception of semiotics when he criticises semioticians, again confounding them with semiologists: "Strangely enough, semiologists have hardly considered so far what is most commonly regarded a sign: the graphic sign." Since semiotics, regarded as epistemology, is concerned with sign-an-sich, of course "the graphic sign" is part of its domain.<br>
      John Dewey had a nice closing sentence, in an article criticising Morris' take on Peirce: "'Users' of Peirce's writings should either stick to his basic pattern or leave him alone." That was written in 1946 (article in J.o.Ph.) and is still true.</p>
      <p>If you, like Stoetzner, think that graphic signs have been neglected by semioticians, then you should have a look into periodicals like <em>Semiotica</em> where you'll find articles like M. Nadin's <em>Interface design: A semiotic paradigm</em>, also there was an entire issue titled <em>The semiotics of the visual: On defining the field</em>. (These issues are from the 80s too.) So if Stoetzner refers to semiotics' shortcomings for the sake of justifying his own project, he doesn't do himself a favor.</p>
      <p><cite>Remember I’m speaking from more of a linguistic point of view.</cite></p>
      <p>You should decide. Semiotics or linguistics? Semiotics is much broader and, regarded as epistemology, includes but is not restricted to language.</p>
      <p><cite>An idea I had was to study a few areas around the city and design some typefaces for THAT specific area. Reflect the mood of that area through the type.</cite><br>
      <cite>Then make installations using these typefaces to show the voice of that area.</cite></p>
      <p>This sounds like an interesting project. My question is, why theory at all? I think that you don't need any. If your approach is a sentimental and emotional one (reacting against what you perceive as decline of visual culture), then why not argue like that and forget about the pseudo-scientific paint? There is nothing bad about it -- I would consider this as the more honest approach.</p>
