    <p>Hey - thought I'd shed a little insight to a project im working on...</p>
    <p>I am studying the evolution of language and how graphic design and technology is constantly morphing our visual language into areas we have to adapt to. Im finding interesting links between the creations of ancient Hieroglyphics to modern pictographs in the category of signography - aesthetically and conceptually.</p>
    <p>I feel that modern advancements such as the rise of the home computer are ruining the beauty and respect that typography deserves. Basing my investigations on these evolutionary theories I'd like to predict the future of our visual language in the commercial world and raise awareness to the graphic design industry. With major brands and commercialism constantly climbing - I feel that is it time to address our means of displaying visual language for we as Designers are the ones controlling it (everything you read has gone through some form of printing press &amp; designer)</p>
    <p>TYPE AS IMAGE is a central focus to these sets of ideas - when designers think of typography, we invariably consider semiotics which consists of semantics (the relation between signs and the concepts they represent), syntax (the formal relation between signs in a system), and pragmatics (the study of signs in use). </p>
    <p>My aim (at this pint of the project) is to bring meaning back into typography based on the placement area it is set in, namely public spaces. Typography is embedded into our everyday life therefore it becomes part of us and our culture. </p>
    <p>Using type as image I'd like to let the area it is set in talk about the type as opposed to the type talk about the area.</p>
    <p>I like the first project on this site:</p>
    <p><a href="http://www.dancemade.com/" title="http://www.dancemade.com/">http://www.dancemade.com/</a></p>
    <p>^ The digitalized geometric typeface is moving forward in time and the process of making the wooden typographic installations allows the overall process to be much more powerful.</p>
    <p>Hope all this makes some kind of sense.</p>
    <p>What are you thoughts on it?</p>
    <p>I have all these ideas but typographically they seem hard to solve.</p>
    <p>Any help, ideas, recommended artists appreciated!!</p>
    <p>Any questions just ask.</p>
    <p>Thanks.</p>
