      <p><em> “ I’d like to predict the future of our visual language. I have all these ideas but typographically they seem hard to solve.”</em></p>
      <p>What do you exactly mean with “typographically,” Adam ?<br>
      Needless to say, it is still true that if you want to learn new things, you should try reading old books. The map is not the territory. Shaping context and connections is an act of architecture ; a new form of space requires a new form of architecture, and spaces made of information requires information architecture.<br>
      Hope this helps a bit.</p>
