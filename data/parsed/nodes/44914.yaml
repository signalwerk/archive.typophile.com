      <p><cite>I am studying the evolution of language and how graphic design and technology is constantly morphing our visual language into areas we have to adapt to.</cite></p>
      <p>Clearly <em>someone</em> has adapted to these areas, or they wouldn’t be there in the first place.</p>
      <p><cite>I feel that modern advancements such as the rise of the home computer are ruining the beauty and respect that typography deserves.</cite></p>
      <p>That’s rubbish. Talk about that with some older designers who lived through metal type and phototype about it. You should also talk to Simon Daniels at Microsoft and the Cleartype font type designers, who are bringing fabulous, respectable type to the world’s most common computing platform. And interview some authors of books on typography that have only seen print because of what cheap computing has done for the cost of publishing, or Gary Hustwit, who was able to produce a feature film homage to typography because of computers.</p>
      <p><cite>With major brands and commercialism constantly climbing…</cite></p>
      <p>Branding and commercialism are not new or becoming any more a part of our society than they ever were, it’s just that different things are getting all of the attention. Do you think that the royalty of feudal nations had all those flags and crests just because they looked cool? And the visual branding of Christian myth and the sale of indulgences really wasn’t all that different from Coke ads, except that Coke doesn’t have eternal damnation backing it up. Read Steve Heller’s <a href="http://www.designobserver.com/archives/036544.html#more" rel="nofollow">latest bit about designers seeing armageddons that aren’t really there.</a> Paula Scher’s <a href="http://creativity-online.com/?action=news:article&amp;newsId=124983&amp;sectionId=pov" rel="nofollow">Advertising got Better</a> is a bit of tangentially related food for thought.</p>
      <p><cite>…for we as Designers are the ones controlling it…</cite></p>
      <p>No, the clients who pay for it all are the ones controlling it. Outside of some art galleries, designers don’t have an audience if they aren’t producing stuff that the clients are willing to pay for. They’re the ones creating whatever it is that needs to be communicated. They’re the ones who have a message to get out. Designers are somewhat incidental, and as the success of Head-On and its amateur advertising has shown, crafty clients can do just fine without designers.</p>
      <p><cite>when designers think of typography, we invariably consider semiotics which…</cite></p>
      <p>Actually, I’m pretty sure that most designers don’t. Semiotics is more of an academic thing than something designers invariably think of.</p>
      <p><cite>My aim (at this pint of the project) is to bring meaning back into typography based on the placement area it is set in, namely public spaces.</cite></p>
      <p>What meaning has really been lost? Isn’t the essence typography the communication of some other meaning?</p>
      <p><cite>The digitalized geometric typeface is moving forward in time…</cite></p>
      <p>So is almost everything else in the universe. Everything we produce is a product of its own time; type that references the past are as a much an expression of the contemporary and its infatuation with history as “new” designs are.</p>
      <p><cite>…the wooden typographic installations allows the overall process to be much more powerful.</cite></p>
      <p>Or do they just move the whole thing somewhere less noticeable?</p>
      <p>Right now I think that you’re in a place a lot of us end up in academically: you have a lot of interesting thoughts that have probably been influenced by a lot of interesting reading, but you aren’t sifting out the ideas that are just, well, wrong. Proceeding will be a lot easier if you can sift the good ideas from the bad and justify their rightness. Christians have a parable about a wise man building his house on the rocks of the beach and not the sand. It applies here.</p>
