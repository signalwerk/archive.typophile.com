      <p>@ Karsten Lücke</p>
      <p>Yes, I can be blamed of having not read much about semiotics. But I do not have any misconception of semiotics, because I just have no conception of semiotics at all. You’re right, I don’t know much about it. The reason is: I simply don’t think I need it.</p>
      <p>I am basicly a practical graphic professional who is *to a certain extend* in need of some theory. A theory which is a *tool*. The craftsman has no mercy with a knife which isn’t sharp. Therefor, as a designer, I don’t think I need a semiotics’ vocabulary, or very little of it.</p>
      <p>I once tried to start studying semiotics with Umberto Ecco’s “Introduction…”. Around page 40 I was fed up and abondoned the volume: unreadable. Later I thought I’ll look into Nöth and get some useful overview. The treatise came out being nothing else than a fat who-has-written-what-and-when-account. Every semiotist (or semiologist?) seems to have his privat theory. Well then, was my conclusion, there’s obviously no other way out: do it yourself.</p>
      <p>When a comprehensive volume about an established subject proves outdated after only two decades, then this subject doesn’t deserve to be called a science – or the author did it completely wrong. What a need shall I have of such a kind of theory? Who really cares about the loads of paper produced by semioticians? Why does semiotics do not appear on graphic designer’s timetables? Why does nearly no one in the real world care about semiotics at all, left aside the semioticians themselves?</p>
      <p>Everyone may come to his own answer to that. But many lines in this thread reveal a terrific lack of conceptions among you, fellow graphic designers (sorry for that). The least we graphic people need is to cover that misery by a theorie’s vocabulary which is incoherent, diffuse and scholastic. What we need instead, if ever, is a straight-forward theory of graphic communication, of graphic systems, of graphic means, of the graphical as such. This is what I propose with my humble outlines of a subject called “signography” (which is yet far from being an elaborate system). The mere fact that a lot of signographic concepts being coherent or neighbouring semiotic concepts just lies in the nature of the subject. For me, that fact is no reason to subordinate my thinking under the rules of an established scholastic tradition. I know, that makes me a persona non grata for a certain faculty…</p>
      <p>By the way, the article “Signography as a subject in its own right” was launched to a british magazine by linguist Hartmut Stöckl, who is now teaching at Salzburg University. For my own part, I welcome any effort to develop *useful* theory for the graphic business.   A:S</p>
