    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writing%20Systems" class="freelinking" rel="nofollow">Writing Systems</a> : <a href="/wiki/Syllabaries" class="freelinking" rel="nofollow">Syllabaries</a> : Cypriot</strong></p>
    <p>The Cypriot <a href="/wiki/syllabary" class="freelinking" rel="nofollow">syllabary</a> was used in Cyprus from the eleventh century BCE to around the end of the third century BCE. It was used for writing two languages: the Arcado-Cypriot dialect of ancient <a href="/wiki/Greek" class="freelinking" rel="nofollow">Greek</a> and an unknown language referred to as "Eteo-Cypriot" that was used in parts of central Cyprus during the classical period. The script contains at least 55 phonetic characters plus a punctuation mark (used for separating words or word groups) and a simple system of numerals.</p>
    <p>In origin the Cypriot syllabary is clearly related to <a href="/wiki/Linear%20A" class="freelinking" rel="nofollow">Linear A</a> and <a href="/wiki/Linear%20B" class="freelinking" rel="nofollow">Linear B</a>, though not especially closely; the immediate ancestor is probably the poorly known Cypro-Minoan script of the Late Bronze Age. During the archaic and classical periods, the Cypriot syllabary existed in two quite different regional varieties: the "standard" syllabary used in central and eastern Cyprus and the "Paphian" syllabary used in western Cyprus. Numerous other variations of glyph shape exist within the known corpus, some probably regional, some probably chronological, and some probably technical or stylistic.</p>
    <p>Only inscriptions on durable materials have survived: carved in stone, incised in clay, painted on clay, stamped on metal coins, or incised in metal. Most surviving inscriptions are very short; only a few are longer than 100 characters, and only one, the Idalium tablet, exceeds 1000 characters.</p>
    <p>The Cypriot syllabary is a simple <a href="/wiki/script" class="freelinking" rel="nofollow">script</a> without any shaping behavior, written in horizontal lines. The standard syllabary was normally written from right to left; the Paphian syllabary was usually written from left to right at Paphus, but usually from right to left around Curium.</p>
    <p>The phonetic characters represent vowels or CV syllables. This structure is ill-suited to the Greek language, which (like most Indo-European languges) is prone to complex consonant clusters. Therefore, multiple characters may be needed to write what would be a single syllable in speech: for example, the phrase "Δάματρι κὰς Κόραι" ("to Demeter and Kore"), pronounced as six syllables, is written with nine characters, <em>ta-ma-ti-ri ka-se ko-ra-i</em>. It will also be noted that the syllabary omits many phonemic distinctions used in the spoken language, such as voice and aspiration.</p>
    <p>The Cypriot syllabary has been included in the <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> standard since version 4.0, and is located with other historic scripts in Plane 1.</p>
    <p>For further information, see:<br>
    O. Masson, <em>Les inscriptions chypriotes syllabiques: recueil critique et commenté.</em> 2nd ed. Paris: E. de Boccard, 1983.<br>
    T. B. Mitford and O. Masson, "The Cypriot syllabary." In <em>The Cambridge Ancient History,</em> 2nd ed., vol. 3 part 3: <em>The Expansion of the Greek World, Eighth to Sixth Centuries B.C.,</em> pp. 71–82. Cambridge: Cambridge University Press, 1982.</p>
