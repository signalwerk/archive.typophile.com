      <p>Hello Theunis de Jong. Thank you for your help. I am using the default Calibri 6.18 in Windows 10 also. </p>
      <p>So, the problem is that Adobe world-ready composer is automatically switching the "a" + "U+02BE" combination to "U+1E9A". You are right, this does not occur if a typeface is being used which does not have "U+1E9A" e.g. Lucida Sans Unicode.</p>
      <p>As you know, when we type "f" + "i" we get the "FB01" ligature (provided the ligature is available in the font and the feature is turned on) so I thought the problem may be fixed by turning off ligatures but this did not fix it.</p>
      <p>I see that in Libux Libertine, U+1E9A is in fact just the base character "a" without the accent so it makes sense that when "a" + "U+02BE" is turned to "U+1E9A" the diacritic disappears.</p>
