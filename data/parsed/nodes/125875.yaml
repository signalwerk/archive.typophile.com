      <p>InDesign has some not well-described behavior with respect to nonspacing accents: if you insert a base glyph and an accent <em>and</em> the font contains a combined glyph for these, ID will use that glyph instead of the two separate ones. You can see that if you type "Tẚrīkh" with a single "ẚ" character [U+1E9A] and with separate glyphs for the \a and Hamza. To see what happens, also open the Glyphs panel.<br>
      In the first word, you cannot move the cursor 'between' the two characters; in the second, you can, but if you select the \a you will see that the character is not selected in the Glyphs panel (usually, a single selected character gets highlighted in this panel). If you select just the Hamza, the Glyphs panel will report you selected the combined character!</p>
      <p>Looking at your samples, I'd guess that Libertine does not contain a combined 'ẚ' character, and so you get the separate nonspacing Hamza glyph over the \a – badly positioned, because the Hamza glyph's position is – necessarily – "generic"; it does not 'know' over what character it gets positioned.[1]</p>
      <p>I cannot replicate the problem with italicized text, though. What exact version number of Calibri are you using? If this differs from mine (6.18, default for Windows 10), it might be an additional problem in the OpenType encoding. Also, check if the characters \a, Hamza, and U+1E9A (their combo) are available in both your regular and italic Calibri.</p>
      <p>[1] Okay, I just downloaded Libertine O and checked. The off-center Hamza in the combined character is as-is, in the Regular font. But the Italic font contains an unwelcome surprise: the combined character 'ẚ' U+1E9A <em>is missing its Hamza</em> ! So that, at least, is not on InDesign to blaim.</p>
