      <p>&gt;In GDI cleartype, this'd have to be one miraculous tweak my man.&lt;</p>
      <p>Exactly.  Likely to be many many lesser tweaks rather than one miraculous tweak.</p>
      <p>Also, the goal is not about the emulation of manual hinting. GDI was perfectly suited to needing labour intensive human intervention to give satisfactory font rendering. DirectWrite seems not hungry for it, which makes sense looking at the way the OS is going.</p>
