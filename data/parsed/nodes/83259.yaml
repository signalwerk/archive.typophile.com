    <p><a href="http://code.newtypography.co.uk" title="http://code.newtypography.co.uk">http://code.newtypography.co.uk</a></p>
    <p>I have posted a few posts of screenshots of tests with Werner Lemberg's work-in-progress 'ttfautohint' tool.</p>
    <p>The aim of my tests is to compare Windows GDI and DirectWrite output of ttfautohint hinted fonts against the original hinted fonts.</p>
    <p>In general the tool is working well, but naturally some glitches to still iron out. Lazy person auto-instructing for truetype fonts, comparable to manual instructing, could be in reach.</p>
    <p><img src="https://lh6.googleusercontent.com/-pe3JdBPj0zo/TgM4I-Djz0I/AAAAAAAAASE/xA2-cmKjNog/1308833824956.png"></p>
