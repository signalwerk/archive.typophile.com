    html: |-
      <p>I think that most of the autohinter outputted fonts produces slightly more compact text horizontally, i.e. slightly shorter lines.</p>
      <p>At some small ppem the autohinted output creates taller x height, or is it the manual hinting creating a shorter x-height?</p>
      <p>The first test version of ttfautohint was tending to flatten curves somewhat at certain ppem sizes - a good example is the shot you linked to above. That issue has now been reduced and is still being improved upon.  As i understand the problem, GDI has more agressive vertical filtering compared to OSX Quartz or Freetype. GDI agressively switches stray pixels outside snap zones to white and inside zones to black, to give that typical ClearType sharpness at baseline etc. The key will be to tweak the autohinter to output instructions to give a tiny bit less harsh rendering.</p>
