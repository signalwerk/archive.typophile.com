      <p>&gt;&gt;At some small ppem the autohinted output creates taller x height, or is it the manual hinting creating a shorter x-height?&lt;&lt;</p>
      <p>The manual hinting in this case makes things shorter, but it could also make it larger. The point is, the x-height is a decision that a human made. I think that having control over the height zones would be an important option with the autohinter. </p>
      <p>Jason</p>
