    html: |-
      <p>If you want a monotone colored image, you can create an opacity mask in illustrator.</p>
      <p>Fill a rectangle with color behind the image, select both image and rectangle and choose Make Opacity Mask in Transparency palette menu.</p>
      <p>To correct for the negative image, show thumbnails in same menu and check invert Mask.</p>
      <p>Use the bars in the color palette for the color you want.</p>
