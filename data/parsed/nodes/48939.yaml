    html: |-
      <p>There is another way, but it may not have quite the result you're looking for and involves Photoshop too:  Basically convert your colour image to Grayscale (Image&gt;Mode&gt;Grayscale), then convert it to a Bitmap image (Image&gt;Mode&gt;Bitmap - set the output resolution at at least 300dpi).  You then end up with a 1bit image:  Take this into Illustrator and select the desired colour and drop it onto the image.  You then have something akin to what you're looking for.  The shame is that in Macromedia Freehand (RIP), you could drop a grayscale image (not a bitmap) into it and colourise it the same way much like Quark does/did, and it would be great.  I'll never understand why Illustrator doesn't do this - especially now that Adobe bought up Macromedia!</p>
      <p>Good luck</p>
      <p>JH</p>
