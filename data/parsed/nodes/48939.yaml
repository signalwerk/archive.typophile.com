    html: |-
      <p>If you are using Photoshop you can also add an adjustment layer (on the bottom of the layers pallet, click the black &amp; white circle) then choose gradient map. Then choose white and your colour, you can then choose the amount of white verses colour by sliding the stoppers.</p>
      <p>This technique is more useful for when you want to use more then two colours. </p>
      <p>Also very useful for changing the colour of an object that is already full colour, say you have a red truck and you want to make it green. First use another adjustment layer to greyscale the section that you want to change (use a mask on the adjustment layer to isolate the section you want to change), then use the gradient map layer to have; black, your new colour say green, then white. Again use the mask to isolate the section you want, and try sliding the stoppers until you get a desirable outcome.</p>
      <p>Sorry to digress.</p>
      <p>Good luck</p>
