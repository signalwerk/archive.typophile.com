    html: <p>This is easy in CS3, but not in earlier versions. Open the file and select EVERYTHING visible. Click on the color guide icon on the right–it’s the one that looks like a fan of swatches. Within Color Guide, click the tiny color wheel icon (edit colors) to open the Live Color menu. Select the "Grayscale" color group and you’re done.</p>
