    <p>I'm wondering if there are any typefaces that you've seen a lot of in your country/city/region, but that barely seem to be known elsewhere?</p>
    <p>For instance (maybe because I'm keeping an eye out for it) here in Sweden, <a class="freelinking external" href="http://www.bertholdtypes.com/font/boton/pro/" rel="nofollow">Boton</a> seems to be in just about every other ad these days, yet I've never seen it anywhere else.</p>
