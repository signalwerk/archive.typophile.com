      <p>I don’t think its pedigree is quite as bad as Hutt suggests.<br>
      It’s an Elzevir: upscale, French.<br>
      BBS and Linotype had Elzevirs in the early twentieth century, neither deplorable.<br>
      But no, never a popular style, and completely out of favor in the West during most of the Soviet era.</p>
      <p>**</p>
      <p>In Canada, Rod MacDonald’s revival of <a href="http://www.myfonts.com/fonts/mti/cartier-book/" rel="nofollow">Cartier</a>, the first Canadian type design (1967), is often used for Canadiana.</p>
