      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1901_Berthold_Latinskii_2_3672.gif"></div><br>
      In USSR that was <a href="http://paratype.com/pstore/fonts/Literaturnaya.htm" rel="nofollow">Literaturnaya</a> (née Lateinisch; H.Berthold, 1901). It was ubiquitous. This is what Allan Hutt, a great typographic expert and a devout communist, wrote about it, in total frustration:<br>
      <blockquote><em>The survival of this De Vinne-style type, from the worst design period of old Imperial Germany, in the premier Socialist country in the latter part of the twentieth century, is a typographical phenomenon as unique as it is deplorable</em>.<br>
      <dl>Allen Hutt. “A revolution in Russian typography”. <em>Penrose Annual</em>, Volume 61. New York: Hastings House, 1968</dl>
      </blockquote>
      <p></p>
