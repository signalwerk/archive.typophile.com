    html: <p>Kerning will improve the colour especially the RAD and UAT. The alignment of the Ss with DUATE is a bit mechanical and will look better if you align them by eye. ABC FACULTY OF is very light, because of the tracking rather than the tint, and may also be aligned optically with the G </p>
