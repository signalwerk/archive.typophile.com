  html: "<p>This is my first post to these forums although I have read with great interest here for a while. <br> <br>I am currently working on a wordmark project for a faculty within a university. They have used a logo previously, but have decided to get rid of the logo as it was cumbersome to incorporate two logos (the university's logo is required and standardized across campus) all the time. The budget does not allow for a custom font. <br> <br>There are two distinct target audiences: students and \"money\" people (primarily faculty and donors). <br> <br>I am by no means a highly experienced typographer, so I would love to get some feedback with regards to what we have so far. The powers that be seem pleased with it, but I would rather be nit-picky amd ask the experts now rather than once it's too late. Thanks muchly! <br> <br>P.S. I was asked to \"disguise\" the school's name. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/68080.gif\" alt=\"wrodmark draft\"></p>"
