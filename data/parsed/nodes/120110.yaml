      <p>I found the exact font listed as "Ultraname", dated 1992, as a shareware font. It does not appear to be available currently in all the major shareware collections on the web though -- at least under that name.</p>
      <p>[EDIT]<br>
      I just got an email from the person who had the font listed as "shareware"; that was an error on his part. Gary Elfring published the font so it was commercial.</p>
