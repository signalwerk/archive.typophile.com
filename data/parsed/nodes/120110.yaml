      <p>As far as I can deduce, Gary Elfring created the EARTH typeface family in the 1970's for use as a phototype font - a method of storing typographic characters on small film strips. These characters could be individually exposed using phototypesetting equipment and then pasted-up to form complete words or layouts. The completed layouts were then re-photographed and delivered to clients as slides, strips, or prints. This process was particularly popular with film studios who used phototypes/filmotypes for titling.</p>
      <p>However, digital technologies rendered phototypesetting obsolete towards the late 1980's. A few of the more unique typefaces designed for this process became unusable when phototype equipment was eventually phased out. Unfortunately, EARTH is one of those typefaces.</p>
      <p>Elfring Fonts did create a digital version in the early 90's but, for reasons unknown, modified many of the characters. Perhaps there was a potential licensing issue as many companies used the EARTH typeface in logos.</p>
      <p>Dan X. Solo probably had access to the requisite phototype equipment as many of his books were published during the 70's and 80's when phototypesetting was the lettering standard. This is also true of any other samples you may find. Most will be from the 70's to the very early 90's. I've seen it listed by Dan as EARTH/EARTHDAYS, and elsewhere as TELEMETRY - though this is likely just a clone of Elfring's digital EARTH font.</p>
      <p>OTHER APPEARANCES<br><strong>Sheller-Globe Corporation - Superior/RV/Coaches (Circa 1976)</strong> (logotype)<br><strong>Frederik Pohl - Gateway (1977)</strong> (title lettering, chapter headings) (<a href="http://smsa.org.au/assets/gateway-frederik-pohl.jpg">http://smsa.org.au/assets/gateway-frederik-pohl.jpg</a>)<br><strong>Warren Presents Alien Invasions Comix (1979)</strong> (title lettering)<br><strong>Charles Platt - Dream Makers: The Uncommon People Who Write Science Fiction (1980)</strong> (title lettering)<br><strong>Blade Runner (1982)</strong> (license plate props)<br><strong>TSR Star Frontiers Game (1982)</strong> (logotype)<br>
      --- There's also a font based on this lettering known as Zebulon.<br><strong>Automan (1983)</strong> (opening titles)<br><strong>Quentin Corporation Disk Drives (1984)</strong> (logotype)<br><strong>The Terminator (1984)</strong> (opening titles, marketing materials)<br><strong>Tightrope (1984)</strong> (opening titles)<br><strong>Airwolf (1984)</strong> (opening titles)<br>
      --- The Airwolf Themes CD authors digitally remade the titling font as CairnsAIRWOLFBold and CairnsAIRWOLFExtraBold for exclusive use.<br><strong>Humanoid Defender (1985)</strong> (opening titles)<br><strong>Disneyland Star Tours Starspeeder Service Poster (1987)</strong> (logotype)<br><strong>Terminator 2: Judgment Day (1991)</strong> (opening titles, marketing materials)<br>
      ---A lighter weight used for the credits block on posters also resembles EARTH DEMI.<br><strong>Terminator 3: Rise Of The Machines (2003)</strong> (opening titles)<br>
      ---It should be noted that Pacific Title &amp; Art Studio likely has/had a phototype copy of the typeface. Whether or not they digitized it for T3's titles is unknown but it looks a lot sharper and steady than its previous optical appearances.</p>
      <p><strong>Hitachi</strong> also used it on various products and <strong>Roland</strong> also used it on much of their sound equipment.<br>
      --- As mentioned above, there is also a font based on the Roland equipment lettering called PBIO.</p>
      <p>@jjdowney_1980<br>
      I can understand your ongoing quest to find a complete character set but I don't think it's very likely. Between the sources above you can determine the missing letters of the EARTH typeface. Some of the printed sources are also much sharper than the rounded/wobbly quality of the optical film titles. You could always contact Gary Elfring and see if he would be able to recreate a more accurate digital version for you.</p>
