  html: <p>This is a post regarding  DAN SOLO and is book ART DECO. There is a font in the book called EARTH. I am of the opinion that is more to this alphabet than what is shown in the book. I do believe that there are more characters and punctuation and numbers. And so I do believe that the name in the book is not real name of this font. <img src="/sites/default/files/old-images/alpha earth1_3573.jpg"> There are bound to be other books. With this alphabet in it and sources out there. With so many tv shows and movies using the font there is more to this than just what is shown. The DAN SOLO CAT of 4000 plus font samples shows there is more letters in this set. So where is the source of this font called EARTH. Where did DAN get it from and were are the studios and companies getting the other variations.  Any information please help.</p>
