    date_raw: 14 Mar 2009 — 12:13pm
    votes: null
    html: <p>I think the first of the "city" fonts to go were Venice (sort of scripty) and San Francisco (ransom-note style) bitmap fonts. New York, Geneva, Chicago, Monaco and Symbol (the math Greek system font) got outlined updates at some point after System 6, when TrueType was introduced, at the time as a low cost alternative to PostScript, alongside the early Apple (rebranded from Canon) inkjet printers. The Chicago bitmap font had some changes earlier than that, removing the running man and a few other decorative characters from the font.</p>
