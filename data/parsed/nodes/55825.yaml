      <p>In answer to the question you meant to ask, I wasn't aware that Avant Garde ever was one of the Mac's system fonts.</p>
      <p>In answer to the question that you actually asked, the original Mac OS fonts were the bitmapped "city" fonts: Chicago, Geneva, Monaco, New York, etc. One or two of them were dropped pretty early (my guess is probably with System 3 in 1986, when the preferred format changed from FONT to NFNT plus FOND resources), and some of the others never made the transition to outlines with System 7 in 1991.</p>
