    html: <p>I think it was bundled with the LaserWriter (not entirely sure - I didn't have one myself, though I used one at work c. 1990), but I'm pretty sure it was never bundled with the Mac OS. I think they added bitmap versions of the original LaserWriter fonts to the OS releases - Times, Helvetica, Courier, and Symbol - starting around System 3, but not the later ones, until they used some of them (e.g., Zapf Dingbats) to replace "city" fonts in System 7.</p>
