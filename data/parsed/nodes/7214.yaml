  html: <p>This font is still very much in the rough stages. I'm still playing with some of the letterforms. The letters were drawn and scanned in, then fontified using Font Creator Program. (I know, I know, but new computer first, then I see about new software.) Some resizing is possible, but beyond minor deformation, the letter needs to be redrawn. Let me know what you think. Help on spacing would be good, too. I'm having trouble making it work with the oblique letters. (From this sample, I see the y has too much space on the right. *sigh*) <br> <br><img src="http://www.typophile.com/forums/messages/29/51503.gif" alt="Quilljoy sample"></p>
  html_clean: <p>This font is still very much in the rough stages. I'm still playing with some of the letterforms. The letters were drawn and scanned in, then fontified using Font Creator Program. (I know, I know, but new computer first, then I see about new software.) Some resizing is possible, but beyond minor deformation, the letter needs to be redrawn. Let me know what you think. Help on spacing would be good, too. I'm having trouble making it work with the oblique letters. (From this sample, I see the y has too much space on the right. *sigh*) <br> <br><img src="http://www.typophile.com/forums/messages/29/51503.gif" alt="Quilljoy sample"></p>
