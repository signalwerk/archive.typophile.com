    html: <p>Yes, I'm keeping the hand-drawn aspect. I've printed samples of this off, and I was surprised at how much it looked like I'd lettered the page. (Dumb, but it's what happened.) <br> <br>I've already got some ligatures drawn - but not fontified - as well as all the capital letters. Terminal letters too, so that, for example, that <b>r</b> isn't going to necessarily reach across toward the next word. <br> <br>I don't, however, have the ability to make an OT font. Everything I produce is open source though, so interested third parties could take my glyphs and build their own. <br> <br>Watch this space.</p>
