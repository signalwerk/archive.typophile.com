    html: <p>How about Google Books? For Melville, for example, they have full view versions of Moby Dick, Omoo, Typee, and White Jacket, each with several drawings. Another example is <a class="freelinking external" href="http://books.google.com/books?id=qR0XAAAAYAAJ&amp;printsec=frontcover&amp;dq=sailing&amp;lr=&amp;as_brr=1&amp;cd=1#v=onepage&amp;q&amp;f=false" rel="nofollow">Sailing Alone Around the World</a> by Joshua Slocum. Some books list illustrations in the TOC, others you have to scroll through. For inspiration as to titles, and a few included illustrations, try <a class="freelinking external" href="http://books.google.com/books?id=MU0qAAAAYAAJ&amp;printsec=frontcover&amp;dq=A+collection+of+books,+pamphlets,+log+books,+pictures,+etc.,+illustrating&amp;lr=&amp;as_brr=1&amp;cd=2#v=onepage&amp;q=A%20collection%20of%20books%2C%20pamphlets%2C%20log%20books%2C%20pictures%2C%20etc.%2C%20illustrating&amp;f=false" rel="nofollow">this.</a></p>
