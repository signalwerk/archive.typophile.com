  html: |-
    <p>Hi All,</p>
    <p>Hope you can help me find these images....I'm looking for illustrations that were used within old books (think of Moby Dick?) to show what fisherman or sailors faced back in their day. Or perhaps to tell a dramatic fictional tale.</p>
    <p>Examples would be sailors facing rough seas, turbulent travel, fighting off an adversary (large squid, etc.), but all developed as dramatic, detailed line drawings.</p>
    <p>Really hope that you know...been racking my brain and searching online for a while now!</p>
    <p>Cheers,<br>
    Justin</p>
