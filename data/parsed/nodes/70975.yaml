      <p>Google Rockwell Kent Moby Dick: images.</p>
      <p>Kent knew what sailors faced, as he had had a few sailing adventures himself.<br>
      His book <em>N by E</em> recounts the tale of a trip he made to Greenland in the 1920s, including shipwreck, with 100 of his woodcuts and beautiful typography.</p>
