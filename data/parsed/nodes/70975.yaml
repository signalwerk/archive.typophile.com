      <p>Dover Publications sells collections of old illustrations for use as clip art. They have several books of whaling/seafaring illustrations. Don't know if the illustrations date back to the 1800s, though. You can order their books online, and larger bookstores often carry some of them.</p>
      <p>Home page -- doverpublications.com<br>
      Some of their nautical books -- <a href="http://store.doverpublications.com/0486437418.html" title="http://store.doverpublications.com/0486437418.html">http://store.doverpublications.com/0486437418.html</a></p>
