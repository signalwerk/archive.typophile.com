  html: |-
    <p>I recently created a newer version of a connecting script font for a client who uses it as a cheaper alternative for wedding envelopes. The older version worked well and had loads of contextual ligatures with swash versions in stylistic sets. For the newer version I restructured the stylistic sets that were for caps so there are now 5 complete Uppercase sets.</p>
    <p>Problem now is that 3 sets of ligatures h_y l_y and p_y along with the ending and swash versions of each no longer work in InDesign. If I type in any of those combinations I get an empty glyph cell. In the glyph palette if I hover over it, the index numbers and such are all correct, but it appears empty and so stylistic sets of these also don't work. I don't think its a code problem, because its the same as the older version that works. I have other similar ligatures like t_y with the same format of feature code and they work fine. I also noticed in Font Explorer it showed no problems until I type one of the bad ligatures into the preview. Then I get a warning that the font is corrupt. </p>
    <p>So now I'm thinking my only alternative may be to use a copy of the older vfb file before adding cap sets and updating it all again. That would probably take a long time. If I do that what is the best way to bring in kerning. Its a large font with 1054 glyphs, uses some class kerning, but since its fully connecting the kerning is not terribly extensive. I'm even wondering if I might be able to copy over and arrange all the glyphs and classes to match and then just copy over the entire kern feature. …or would that create a possible disaster? Any useful tips here would be most helpful.</p>
