    votes: null
    html: |-
      <p>The reason that happens is because the feature source code is not stored in the generated font. It gets compiled. So when you import the font back into FontLab, it must decompile the feature code. Some of the original structure is lost, even though it is (usually*) functionally equivalent.</p>
      <p>One way to get around this is to export the classes and feature code from the original .vfb. Of course, if that's where the problem was, maybe not. It would be worth testing the OT features of the imported font in FontLab--as it interprets them--to see if the behavior in InDesign is present.</p>
      <p>* There are some OT features that FontLab doesn't know about that may be present if the font was not created in FontLab. But that's not going to be the case with your font.</p>
    html_clean: |-
