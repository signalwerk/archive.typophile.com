      <p><em>I have heard of FontLab .vfb files getting corrupted</em></p>
      <p>I have experienced it, and it's no fun. Generally, the only way to correct the problem is to generate a font, and open it up in FontLab. This procedure usually removes the voodoo hidden deep inside the original .vfb, but you have to check your Font Info, Classes and Features to make sure that they haven't changed.</p>
