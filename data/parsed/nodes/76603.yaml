    html: |-
      <p>BTW, I say this because I'm pretty sure OT fonts can't get corrupted the way old PS fonts could. The reason they did (on the Mac, anyway) was to do with the fact that they were stored as resources (i.e., in the resource fork of a file). Because of the way resources worked on the old MacOS (pre-10.0), any font files that were installed had to be open (for read and write) while in use, and if a file was open when a system crash happened, it could be corrupted. Since installed fonts were always open, that made them vulnerable to corruption. Fonts don't work that way anymore on MacOS 10.0 and later (except in the Classic environment, but hardly anyone uses that anymore, and it's not even possible on 10.5 and later or on Intel-based Macs).</p>
      <p>That said, I have heard of FontLab .vfb files getting corrupted.</p>
