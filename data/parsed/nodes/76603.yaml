      <p>The name of the new version has pro at the end to distinguish it from the previous. I don't think it's a cache problem. I used the cache deleting features in Font Explorer and even tried restarting.</p>
      <p>I did open up the font itself in FontLab. That changes around the names of classes, but the code was essentially the same and the glyph slots were all intact. I tried copying just the affected ligatures back in and deleted all the contextual elements for them. The same ligatures still would not come in. Very frustrating. The older version that I tried that worked was a ttf version of OpenType. I'm wondering if that might make a difference, but I'm not sure. </p>
      <p>When I made the updated version with all the stylistic sets for caps I rearranged the sets and changed orders around a bit. I don't see any for the lowercase where I've changed the hierarchy, but that's the one thing that I keep thinking might be involved. I also wonder if fonts just go corrupt sometimes without any noticeable changes that should affect them. When I worked at AG some of our old PS fonts would just stop working and I couldn't always find a clear answer even though an archived version still worked.</p>
