    <p>Hello,</p>
    <p>I created logo for dentist Dr. Meurer &amp; Dr. Palazis. What do you think about the way, form and the main solution. The brief is small and simply: the identity have to be strong, clear and not cheap, Bulgary under dentists :) So I created something where the phylosophy hide in the letters... the sign consists both with “p” and “m” and build together the form of tooth.</p>
