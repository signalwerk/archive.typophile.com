      <p>The first aid cross in the center has a weird thinness to it, that brings too much attention to it. I would try and beef it up a bit, which might require shrinking it’s overall size to accommodate for it’s new heftiness. </p>
      <p>Unless, you’d rather use a lighter weight for the text... this would make the logo “pm” pop more, creating a different contrast.</p>
      <p>-Andrew</p>
