      <p>I don't have a beef with the book - if readers want more than a general introduction, there's Heller and beyond.</p>
      <p>But I would like to see more articles in general interest periodicals that don't start at square one when it comes to type, that assume there is a prosumer reader with some background knowledge.<br>
      You'd think no-one had ever written an intro-to-fonts book, that there wasn't a large population of typographers in the workforce.<br>
      What if every movie article featured a history of film and name-checked Eisenstein, The Jazz Singer, Monroe and Avatar?</p>
      <p>So the next challenge for Mr Garfield, once his book has educated a few Guardian readers on the basics, is to take journalistic type writing to the next level.</p>
