      <p><em>...the distinction between "oldstyle", "transitional", and "modern" serif faces </em></p>
      <p>The technicalities are irrelevant.<br>
      Movie reviews don't go on about f-stops, depth of field and cutting techniques.<br>
      Book reviews don't deconstruct the grammatical devices of authors.<br>
      Interviews with celebrities are about them and how they deal with their work, not the work per se.</p>
      <p>Most general media coverage concerns the meta-world of the subject, leaving the technicalities to trade media.</p>
      <p>90% of the stroies in the arts section of a periodical could be rewritten with a typographer as subject, without changing the format.</p>
      <p>Take the <a href="http://www.theglobeandmail.com/news/arts/movies/psycho-the-mother-of-all-horror-movies/article1776820/" rel="nofollow">piece</a> in today's <em>Globe</em> about a new release of Psycho, with a "newly reconstituted soundtrack".<br>
      Of course, the article doesn't tell you a damn thing about how the sound has been reconstituted! (That would indeed be mere technicality!)<br>
      It's just a plot spoiler, with a few Hitchcock tidbits and comments from name critics.<br>
      This kind of press-release coverage could be easily written about a type revival.</p>
      <p>Every time one accesses a memory, one changes it, an act of subtle refreshment which explains the function of such articles in reaffirming the the cultural canon.</p>
