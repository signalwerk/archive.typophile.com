      <p>It's true that an article about type in a general-interest periodical is more likely to be read by someone with a knowledge or interest in type.</p>
      <p>What I am claiming, though, is that the writers of articles like the one under discussion are probably correct in assuming that the accessibility of an article would be too limited if even the most basic background of knowledge about type were to be assumed.</p>
      <p>The basic background that an introductory book on the subject would supply - like the distinction between "oldstyle", "transitional", and "modern" serif faces - isn't something people need to know to use Microsoft Word.</p>
      <p>And, on top of that, because typography is a specialized topic of limited interest, a general-interest magazine has to assume that an article on that subject might be the first one many of its readers have seen. With the stock market - well, the business section of the paper is designed for businessmen. And the ups and downs of the stock market affect most people's jobs. So they can assume that people have heard of mercantilism and Adam Smith and John Maynard Keynes - in fact, they probably learned about mercantilism versus Adam Smith in school, when they were being taught about the causes of the American Revolution.</p>
      <p>We live in a world ruled by money and not by art.</p>
      <p>And Adam Smith might well be the Bodoni - or the Steinitz - of economics; Keynes would be its Nimzovitch (its Zapf?).</p>
