      <p>John, you haven't addressed my two main points.</p>
      <p>"Most" people don't read every article in every periodical.</p>
      <p>The constituency of those who know a bit about type is not solely the professional hard core of graphic designers and their ilk.<br>
      It also includes "graphic artists" as Pamela Pfiffner terms them in her Adobe book, numbering the increase in their ranks wrought by Adobe graphics software as 25-fold.<br>
      As well as those who may use type in their professional work with more than a passing interest, there are those who use it recreationally, and amateurs.<br>
      There is a mixed bag at Typophile. You describe yourself as a computer programmer, for instance.</p>
      <p>Secondly to such users, there is the general reader of inquiring mind. Such readers can piece together a story from bits of information -- I'm rather like that when I read the business section of the paper: I don't invest or follows stocks or have a great knowledge of management theory and business personalities, but I have a general sense of what's happening in the business world. It's not like every article in the business section needs to explain what the prime rate is -- although they do go on a lot about Keynes (the Bodoni of economics, I assume).</p>
