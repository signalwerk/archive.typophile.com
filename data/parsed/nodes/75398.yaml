      <p>@Nick Shinn:<br>
      <cite>What if every movie article featured a history of film and name-checked Eisenstein, The Jazz Singer, Monroe and Avatar?</cite></p>
      <p>Unfortunately, most members of the general public <em>are</em> <strong>completely</strong> ignorant of typography. Unless someone, say as a child, had enough of an interest in printing to pick up a book on the subject - or remembers stuff from junior high shop class - there's nothing much in popular culture to create an awareness of type.</p>
      <p>That is, of course, until Windows 3.1 came along, though, I have to admit. (The Mac used funny names for all of its typefaces in the beginning.)</p>
      <p>Here's just one example. Remember the book <em>The Rule of Four</em>, that came out shortly after <em>The DaVinci Code</em>? The author was able to go on an interview, and go on about how the <em>Hypnerotomachia Poliphilii</em> was this incredibly obscure book that he discovered in his research. When, of course, most introductory books on typography include photographs of a page or two of the first edition of that book, because it illustrates Jenson's roman type. (The French edition is also often used to illustrate Garamond.)</p>
      <p>These days, most people can tell you what Times Roman is, because they've seen it in the drop-down menu on Microsoft Word. And they may even know that there are 72 points in an inch.</p>
      <p>But, no, they don't have a clue who Frederic W. Goudy was, or Morris Fuller Benton, or even Hermann Zapf. Never mind Sumner Stone. And they're not likely to any time soon.</p>
