    <p><a href="http://www.granshan.org/" title="http://www.granshan.org/">http://www.granshan.org/</a></p>
    <p>Now in its 5th year, the "Eastern" Type Competition continues to<br>
    evolve and add new scripts. Designers of the newly added Arabic and<br>
    Indic* scripts should take heed, since there are no fewer than four<br>
    experts in each of those scripts deciding who ends up competing for<br>
    the 1000 Euro top prize. Also for this year only Latin is back on the<br>
    menu! The entry fee is a modest 20 Euro.</p>
    <p>* Devanagari, Tamil and Bengali.</p>
