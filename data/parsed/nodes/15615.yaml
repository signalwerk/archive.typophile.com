      <p>&gt;Oh-ho, typo and powerpoint is like fire and water.</p>
      <p>Why do you say that? If you're using an up to date Windows version of PPT the type should hold together pretty well on-screen. I'd agree that your best bet would be to keep it simple - don't go over the top with drop shadows, colors and transitions. Unless your audience is made up of a group of elite type designers using Comic Sans for the titles would be more than appropriate, otherwise maybe Arial Rounded for the titles. I'm sure some of those on the list will have some more imaginative choices. </p>
      <p>I've not used PPT on the Mac but I've seen some of the results on screen and for whatever reason the spacing is often messed up. Don't know if it's the type of font (Type 1 v TTF) or another problem. When asked, the engineers say that the most recent versions use the system renderer, and most Mac text looks fine elsewhere, so I don't understand why the results look bad. </p>
      <p>Cheers, Si</p>
