      <p>"I’ve not used PPT on the Mac but I’ve seen some of the results on screen and for whatever reason the spacing is often messed up. Don’t know if it’s the type of font (Type 1 v TTF) or another problem. "</p>
      <p>Some of the PPT issues on the Mac are related to fonts but TrueType is not the problem.  Macs use Truetype just fine. Problems arrive when you choose the version of say Times for example that is native to PC but show it on a Mac. The Mac takes its version of Times as a substitute but the metrics are not the same so spacing gets messed up.  The only thing you can do is always use the bundled Microsoft fonts on all the machines that touch the PPT file.  This is limiting for typography and can be complicated by versions of PPT being mixed.<br>
      The other thing is that Microsoft does not spend a lot of effort porting PPT to Mac since most Mac people are not fond of it (or else MS just doesn't care about us).<br>
      I always use Adobe's PDF to make presentations.  It does a much better job than PPT on any platform and you can embed fonts so typography is not limited to the Microsoft bundle of wonders.</p>
      <p>ChrisL</p>
