    html: <p>Depends which Windows you have; if you have Vista or above, there are the new cleartype fonts (Calibri, Cambria etc). If you're working onscreen, Georgia is very nice, and allround compatible (can be used for print as well). I think some systems have versions of Baskerville, Palatino or Garamond, but I don't know which versions.</p>
