  html: |-
    <p>Hi everyone,</p>
    <p>i wanted to ask what would be a good default windows and Mac OS default installed sans serif font for text and headlines.</p>
    <p>Its for use in a word template that is going to be used by different departments, and i can't push them to invest in buying a font since there's to much departments involved and everybody wants something else therefore they decided to use a default font.</p>
    <p>I really don't want to use Arial, something with a bit of character would be nice</p>
    <p>thnx in advance for all the great help!</p>
