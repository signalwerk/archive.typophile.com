      <p>i think there is a confusion between hardware, software and data.</p>
      <p>i'll quote wikipedia for that one:</p>
      <p>«Computer software (or simply software) is that part of a computer system that consists of encoded information (or computer instructions), as opposed to the physical computer equipment (hardware) which is used to store and process this information. <strong>The term is roughly synonymous with computer program but is more generic in scope.</strong>»</p>
      <p>but more important is this quote, which i think is correct:</p>
      <p>«Relationship to data<br>
      Software has historically been considered an intermediary between electronic hardware and data, which later the hardware processes according to the sequence of instructions defined by the software. As computational science becomes increasingly complex, the distinction between software and data becomes less precise. Data has generally been considered as either the output or input of executed software. However, data is not the only possible output or input. For example, (system) configuration information may also be considered input, although not necessarily considered data (and certainly not applications data). The output of a particular piece of executed software may be the input for another executed piece of software. Therefore, software may be considered an interface between hardware, data, and/or (other) software.»</p>
