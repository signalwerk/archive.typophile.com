      <p>Hi,<br>
      When I need to convert a font I use my old standby FontHopper. EULAs' aside, when a job is on my desk and Calfisch Script bold is needed I breakout Fonthopper and I convert. You may call me what you wish, but EULAs are an absurd reality. You can call me what you want, but really think about this, if Adobe can have a patent on a typeface (I'm thinking AGaramond here) that is not only from derivative work, but also quite like (think only a loupe could show us most any difference)  another font (think Berthold Garamond) then an EULA is not quite the Magna Carta, is it? </p>
      <p>When big type plagerizes, they put on the happy face of "Adobe Original" for Coronos.</p>
      <p>Big Type plays to the hype that when fonts (wrongly called software) are stolen that somehow the designers are going to die penniless. Guess what, if all of us paid for every font, somehow type designers would still die penniless. Long before postscript democracy of fonts was around Max Miedinger died penniless. His font was tied to one Big Type company. They sold it and sold it and we curse it as helvetica.  If ITC had the license he still would have died penniless. Did pirates make him die penniless? NO!</p>
      <p>Big type puts the squeeze on designers, smaller founderies and customers. Big Type stays big as long as they dominate the market. To the point now, where small type is really just a minor league for Big Type, they act much the same, but they don't quite have the libraries that do not have to follow fashion to keep food on the table.</p>
      <p>I do believe in order and am mostly a lawful type, but I hate it when issues regarding fonts have an unbalanced moral thermometer. You have a right to kick me for converting a font, but please scream to the mountain tops about big type too! </p>
      <p>There is a good chance that if I'm booting "Antique Olive Nord" and I start making some bucks with it that at some point being a pirate will be too risky to my reputation or my clients reputation, that the font will be bought to cover this risk. I've yet to see Bitstream say something like "our Swiss is really Helvetica and we should pay a royalty to Linotype." Believe you me they have made more money than you or I have in dealing with "pirated" material.</p>
      <p>Sincerely,<br>
      Rodrigue Planck</p>
      <p>The Truth shall set you free</p>
