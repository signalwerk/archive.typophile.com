    html: <p>ok I finished the bold version so here it is. <br>I think it's primary use should be in titles etc. Not for large bodies of text. <br> <br><img src="http://www.typophile.com/forums/messages/29/1621.gif" alt="bingos.gif"> <br> <br>I ofcourse apologize for the strange text. When you finaly manage to think of a text containing all the letters. It turns out to be a rather strange one.</p>
