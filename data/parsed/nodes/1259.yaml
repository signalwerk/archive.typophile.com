    html: <p> I normally stay away from the pixel fonts as I hardly ever have anything positive to say. This however, is very, very nice. It looks like it has potential as a real vector font too. Excellent "g". Perhaps the "Q" could do with a more distinctive tail. Is this standard leading or has it been increased for the demo? It looks like you could lead a little closer. </p>
