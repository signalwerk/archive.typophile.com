    html: "<p>thanx Martin <br> <br>I understand the feelings about the \"Q\" so I tried some other ones but I didn't came up with any nicer ones, which would fit the rest of the capitals. I'll try some more later. <br>You were right about the leading, I tend to overdo it. This time a little less. <br> <br>I made some small changes: the horizontal bar in the \"f\" moved one pixel up. <br>And the \"f\",\"l\" and \"t\" have a pixel less white to their rights. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1614.gif\" alt=\"bingo7update.gif\"></p>"
