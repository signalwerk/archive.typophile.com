      <p>It looks like the latin counterpart of <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=MS-Windows-Fonts&amp;ffam=MV%20Boli%20-%20Regular&amp;fid=a7e3822358f6dcb2f986a68cf24721b2&amp;fsize=60&amp;text=MM%20Beauty&amp;wrap=2" rel="nofollow">MV Boli</a></strong> a font supplied with MS Windows.<br>
      From Microsoft site:</p>
      <blockquote><p>MV Boli font was first introduced with Windows XP to support Thaana script, which is used for the Dhivehi language of the Maldives. Thaana font is similar to the Arabic script and is written right to left.</p></blockquote>
      <p><a href="http://www.microsoft.com/typography/fonts/family.aspx?FID=251" title="http://www.microsoft.com/typography/fonts/family.aspx?FID=251">http://www.microsoft.com/typography/fonts/family.aspx?FID=251</a></p>
