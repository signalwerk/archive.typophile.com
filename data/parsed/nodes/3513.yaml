    <p>This is for an architect turned contractor. I'm trying for contractor sturdiness with a dash of architect sensitivity. I also wanted to provide a recognizable mark that could evolve. He's very happy with this itteration, but I'm feeling a bit out of my element solely working with type so I thought I'd try some trained eyes. Thanks. <br> <br>The logo will primarily be on white on black, (truck, signs). I'm struggling w/ forcing a black "box" for printing on white t-shirt.</p>
