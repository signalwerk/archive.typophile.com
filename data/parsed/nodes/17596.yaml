    html: |-
      <p><em>Randy:</em><br>
      I create my accented glyphs as one of the later things I do in a design. Once I've designed the accents, tested them briefly with Spanish, German, and French, and feel that they are appropriate weight and size, I start placing anchors for everything. This usually takes a bit of time to get right, as deciding what the optical centers for your glyphs and accents are is more of an art than a strict number. To help speed placing along, I start with anchors in the center of the glyph (halfway from furthest left edge to the furthest right edge). The scripts for placing anchors does this automatically for me. I then check and adjust as need be. Depending on the design of the typeface this can be a lot of adjustment or not so much adjustment (geometric Sans? very simple. very calligraphic Roman? lots of adjustment). </p>
      <p>With my anchors placed, I run my script and start to check the glyphs. Some accents, such as the cedilla and ogonek, need to be further incorporated into the design. Most glyph, however, if the anchors were placed well, are done.</p>
      <p>I sometimes go a bit overboard and do accent designs for capitals, lowercase, and small capitals. That's why my script allows one to have different designs for each: otherwise creating all of those glyphs by hand would take far too long.</p>
