    <p>For all who may find them useful, I've just posted a series of <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a>/<a href="/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a> scripts for typeface design/production. These scripts have been developed for the way that I work, so your milage with them may vary. Currently they have all been tested with <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> 4 and <a href="/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a> 1.1 on the Mac. There are scripts for automatic placing of accents, dealing with development VFB files with lots of overlaps and composites, quickly generating multiple <a href="/wiki/instances" class="freelinking" rel="nofollow">instances</a> of a <a href="/wiki/MultipleMaster" class="freelinking" rel="nofollow">MultipleMaster</a> typeface for testing, and a couple of other things.</p>
    <p>The scripts can be found at <a href="http://www.benkiel.com/typeDesign/" title="http://www.benkiel.com/typeDesign/">http://www.benkiel.com/typeDesign/</a></p>
