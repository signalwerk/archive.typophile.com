    <div class="info">Submitted by <a href="/user/42980" title="View user profile.">studiozwei</a> : 15.Mar.2009 2.23pm </div>
      <p>The ISTD awards 2009 are an opportunity for all practising designers to submit their work to be judged by today’s leading graphic design and typography specialists.</p>
    <p>Categories range from book design, packaging, and signage to digital media and integrated campaigns as well as type design.</p>
    <p>To enter, your work must have been published between 1st January 2007 and 31st January 2009. Typography should be an integral part of the design solution. There are three types of awards:</p>
    <p>Certificate of Excellence<br>
    Awarded to all finalists – Work accepted as being eligible for a Certificate of Excellence shows a high standard of design in conjunction with a high standard of typography.</p>
    <p>Premier Awards<br>
    Awarded to outstanding submissions in each category – Premier Awards are chosen from the work that has met the criteria for a Certificate of Excellence, but which is also outstanding in the view of the majority of the jurors.</p>
    <p>Winner of the ISTD International Typographic Award 2009<br>
    Nominated from the overview of all Premier Awards, in all categories. – Awarded to the item judged to be a significant typographical achievement, which catches the imagination of all the jurors, and exemplifies outstanding typographic excellence.</p>
    <p>The winning work will be featured on the ISTD website and in the ISTD 2009 Awards Publication.</p>
    <p>The deadline for entries is 31 March 2009.</p>
    <p>http://awards.istd.org.uk</p><div class="imageWrap"><img src="http://typophile.com/files/ISTDawards_3728.jpg"></div><p></p>
