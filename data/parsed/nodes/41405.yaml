    <p>We announce the release of the new html website, easy to use and to bookmark.<br>
    Along with the new site... some new typefaces: </p>
    <p>Prelo (<a href="http://www.dstype.com/prelo.html" title="http://www.dstype.com/prelo.html">http://www.dstype.com/prelo.html</a>)<br>
    Glosa (<a href="http://www.dstype.com/glosa.html" title="http://www.dstype.com/glosa.html">http://www.dstype.com/glosa.html</a>)<br>
    and Estilo Text, (<a href="http://www.dstype.com/estilo_text.html" title="http://www.dstype.com/estilo_text.html">http://www.dstype.com/estilo_text.html</a>)</p>
    <p>all with pdf's available for download. </p>
    <p>Comments are welcome.<br>
    Dino dos santos<br>
    DSTYPE</p>
