    <p>MAISON &amp; OBJET, a world-class fashion home collections exhibition, is the final station where you colud see the top designers around the world glow. And MAISON &amp; OBJET’s sustainability in city like Paris, a fad-leading shrine, can definitely tell the role it play in the world-class quality home collections.</p>
    <p>Every year, the limit-breaking designs &amp; break-through ideas turn out to be a legend in MAISON &amp; OBJET. It will not be any framewrok restained here! ”Create under given, think beyond the limit”. Let’s elevate a whole new level of china design for Paris together!</p>
    <p>You will get the chance to put your design under the world of fashion’s attention, MAISON &amp; OBJET. All you need is winning the gold medal of FRANZ AWARD 2011. Dare you to compete with Lalique, Haviland and Fairmon for the world-class order given by top buyer around the world? Show us your ambition!</p>
    <p>Eager for overnight success? What are you waiting for? Join FRANZ AWARD 2011 right now!</p>
    <p>Gold Award Winner (1)	NT$500,000, a cup, a certificate of merit, an opportunity to participate in M&amp;O<br>
    Silver Award Winner (1)	NT$250,000, a cup, a certificate of merit<br>
    Bronze Award Winner (1)	NT$100,000, a cup, a certificate of merit<br>
    Creative Design Award Winner (1)	NT$50,000, a certificate of merit<br>
    Creative Marketing Award Winner (1)	NT$50,000, a certificate of merit<br>
    Excellence Award Winners (several)	NT$10,000, a certificate of merit</p>
