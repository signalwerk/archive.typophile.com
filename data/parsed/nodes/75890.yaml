      <p>I'm glad that link turned out to be helpful. These discussions piqued my random and boundless curiosity, and I expected there would be resources out there - since languages, unlike high-tech electronics, don't change rapidly, for example, I've found many helpful foreign-language dictionaries now in the public domain on Google Books.</p>
      <p>Amazingly enough, but again, not surprisingly, since it is a work that's been around a long time, after my recent web searches turned up a mention that many editions of the Talmud copied the exact pagination of one particularly good early edition, I checked Google Books, and indeed there are several volumes of the Talmud there complete with the Mishnah in the middle and the Gemara around it.</p>
      <p>On the <a class="freelinking external" href="http://www.archive.org/web/web.php" rel="nofollow">Smithsonian "Wayback Machine" site</a>, a translation of the Talmud into English that isn't even in the public domain yet has been kindly made available with the authorization of the copyright owners. A charitable organization dedicated to preserving books in the Yiddish language has put quite a few books up there.</p>
      <p>And you probably already know about <a class="freelinking external" href="http://www.hebrewbooks.org/" rel="nofollow">this site</a>.</p>
