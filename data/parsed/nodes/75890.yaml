      <p>John Savard,</p>
      <p>In Hebrew, when one person does something especially kind and good for another, the other person responds with the following phrase:</p>
      <p>ישר כחך</p>
      <p>This is pronounced: "Yashar Kocha'cha". Some say, "Yashar Koach".</p>
      <p>This means, "Your strength was correct".</p>
      <p>In English, we say, "More power to you".</p>
