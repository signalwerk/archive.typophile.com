      <p>Shva<br>
      <a href="http://en.wikipedia.org/wiki/Shva" title="http://en.wikipedia.org/wiki/Shva">http://en.wikipedia.org/wiki/Shva</a><br>
      From Wikipedia, the free encyclopedia</p>
      <p>ְ<br>
      IPA	/e/, Ø<br>
      Transliteration	e, nothing<br>
      English example	men<br>
      Example</p>
      <p>The word shva in Hebrew. The first vowel (marked with red) is a shva itself.<br>
      Other Niqqud<br>
      Shva · Hiriq · Zeire · Segol · Patach · Kamatz · Holam · Dagesh · Mappiq · Shuruk · Kubutz · Rafe · Sin/Shin Dot<br>
      Shva or, in Biblical Hebrew, Sh'wa (Hebrew: שְׁוָא‎) is a Hebrew niqqud vowel sign written as two vertical dots "ְ" underneath a letter. In Modern Hebrew, it indicates either the phoneme /e/ or the complete absence of a vowel (Ø), whereas in Hebrew prescriptive linguistics, four grammatical entities are differentiated: resting (naḥ / נָח), moving (na / נָע), floating (meraḥef / מְרַחֵף) and "bleating" or "bellowing" (ga'ya / גַּעְיָה). In earlier forms of Hebrew, these entities were phonologically and phonetically distinguishable, but the two variants resulting from Modern Hebrew phonology no longer conform to the traditional classification, e.g. the (first) Shva Nach in the word קִמַּטְתְ (fem. "you crumpled") is pronounced /e/ (/kiˈmatet/) instead of being mute, whereas the Shva Na in זְמַן ("time") is mute (/zman/).<br>
      It is transliterated as "e", "ə", "'" (apostrophe), or nothing. Note that usage of "ə" for shva is questionable: transliterating modern Hebrew shva with ə or ' is misleading, since it is never actually pronounced [ə] – the vowel [ə] does not exist in modern Hebrew – moreover, the vowel [ə] is probably not characteristic of earlier pronunciations either (see Tiberian vocalization → Mobile Shwa = Shwa na'). .<br>
      A shva sign in combination with the vowel diacritics patáẖ, segól and kamáts katán produces a "ẖatáf": a diacritic for a "tnuʿá ẖatufá" (a "fleeting" or "furtive" vowel).</p>
      <p>Pronunciation in Modern Hebrew</p>
      <p>In Modern Hebrew, shva is either pronounced /e/ or is mute (Ø), regardless of its traditional classification as shva naḥ (שְׁוָא נָח) or shva na (שְׁוָא נָע), see following table for examples. The Israeli standard for its transliteration[1] is /e/ only for a pronounced shva na (i.e., one which is pronounced /e/) and no representation in transliteration if the shva is mute.<br>
      In Modern Hebrew, a shva is pronounced /e/ under the following conditions:[2]</p>
      <p>Condition for /e/ pronunciation of shva in Israeli Hebrew	Examples	Examples for silent shva (since condition does not apply)<br>
      In Hebrew	IPA	translation	In Hebrew	IPA	translation<br>
      1. When under the first of two letters, both representing the same consonant or consonants with identical place and manner of articulation:	שָׁכְחוּ	/ʃaχeˈχu/	they forgot	מָכְרוּ	/maχˈru/	they sold<br>
      שָׁדַדְתְּ	/ʃaˈdadet/	you (f.) robbed	שָׁלַלְתְּ	/ʃaˈlalt/	you (feminine) negated<br>
      2. When under the first letter of a word, if this letter is י (/j/), ל (/l/), מ (/m/), נ (/n/) or ר (/r/)[*]:	נְמָלִים	/nemaˈlim/	ants	גְּמָלִים	/ɡmaˈlim/	camels<br>
      מְנִיָּה	/meniˈja/	counting	בְּנִיָּה	/bniˈja/	building<br>
      3. When under the first letter of a word, if the second letter is א (/ʔ/), ה (/h/) or ע (/ʕ/ or /ʔ/):	תְּאָרִים	/teaˈrim/	titles	מִתְאָרִים	/mitʔaˈrim/	outlines<br>
      תְּמָרִים	/tmaˈrim/	dates<br>
      4. When under the first letter of a word, if this letter represents one of the prefix-morphemes<br>
      ב (/be/) = amongst others "in",<br>
      ו (/ve/) = "and",<br>
      כ (/ke/) = amongst others "as" or "approximately",<br>
      ל (/le/) = amongst others "to", dative marker and verb prefix in infinitive,<br>
      ת (/te/) as future tense verb prefix:<br>
      בְּרֵיחָהּ	/berejˈχa/	in her scent	בְּרֵיכָה	/brejˈχa/	pool<br>
      בְּחִישָׁה	/beχiˈʃa/	in sensing	בְּחִישָׁה	/bχiˈʃa/	stirring<br>
      וְרוֹדִים	/veroˈdim/	and (they) tyrannize	וְרוּדִים	/vruˈdim/	pink (m.p.)<br>
      כְּרָזָה	/keraˈza/	as a thin person	כְּרָזָה	/kraˈza/	poster<br>
      לְפָּרִיז	/lepaˈriz/	to Paris<br>
      תְּבַלּוּ	/tevaˈlu/	you (m. p.) will have a good time	תְּבַלּוּל	/tvaˈlul/	cataract<br>
      5. (In non standard language usage) if one of the morphemes mentioned above (ב /be/, ו /ve/, כ /ke/, ל /le/ or ת /te/) or one of the morphemes מ /mi/ ("from") or ש /ʃe/ ("that") is added as a prefix to a word, which without this prefix begins with a letter marked with a shva pronounced /e/ under the above conditions, this shva will retain its /e/-pronunciation also with the prefix:	מִצְּעָדִים	/miʦeaˈdim/	from steps	מִצְּמָדִים	/miʦmaˈdim/	from pairs<br>
      מִצְעָדִים	/miʦʔaˈdim/	parades<br>
      מִרְוָחִים	/mirevaˈχim/	from blanks	מִרְוָחִים	/mirvaˈχim/	intervals<br>
      standard: מֵרְוָחִים –/merevaˈχim/<br>
      לְאֲרָיוֹת וְלְנְמֵרִים יֵשׁ פַּרְוָה	/learaˈjot velenemerim…/	Lions and tigers have fur	standard: וְלִנְמֵרִים /…velinmeˈrim…/<br>
      וְכְּיְלָדִים שִׂחַקְנוּ בַּחוּץ	/vekejelaˈdim…/	And as children we played outside	standard: וְכִילָדִים – /veχilaˈdim…/<br>
      6. (Usually – see Counterexamples[**]) when under a medial letter, before whose pronunciation a consonant was pronounced:	אִשְׁפְּזוּ	/iʃpeˈzu/	they hospitalized	אִישׁ פְּזוּר דַּעַת	/iʃ pzur ˈda.at/	an absentminded man</p>
      <p>Counterexamples<br>
      *^ One exception to rule 2 seems to be מְלַאי /mlaj/ "inventory"; the absence of a vowel after the מ (/m/) might be attributable to the high sonority of the subsequent liquid ל (/l/), however compare with מְלִית (/meˈlit/, not /*mlit/) "filling (in cuisine)".<br>
      **^ Exceptions to rule 6 include פְּסַנְתְּרָן (/psantˈran/, not */psanteˈran/ – "pianist"), אַנְגְּלִית (/aŋˈɡlit/, not */aŋɡeˈlit/ – "English"), נַשְׁפְּרִיץ[1] (/naʃˈprit͡s/, not */naʃpeˈrit͡s/ – "we will sprinkle"), several inflections of quinqueliteral roots – e.g.: סִנְכְּרֵן[2] (/sinˈkren/, not */sinkeˈren/ – "he synchronized"); חִנְטְרֵשׁ[3] (/χinˈtreʃ/, not */χinteˈreʃ/ – "he did stupid things"); הִתְפְלַרְטֵט[4] (/hitflarˈtet/, not */hitfelartet/ – "he had a flirt") – and several loanwords, e.g. מַנְטְרַה (/ˈmantra/, not */mantera/ – "mantra").<br>
      [edit]Traditional classification</p>
      <p>In traditional Hebrew grammar, shvas are in most cases classified as either "shva na" (Heb. שווא נע) or as "shva naḥ" (Heb. שווא נח); in a few cases as "shva meraḥef" (Heb. שווא מרחף), and when discussing Tiberian pronunciation (ca. from the 8th until the 15th century) some shvas are classified as "shva ga'ya" (Heb. שווא געיה).<br>
      A shva is categorized according to several attributes of its grammatical context. The three categories of shva relevant to standard grammar of Modern Hebrew are "shva na", "shva naḥ" and "shva meraḥef"; the following table summarizes four distinguishing attributes which determine these categories:<br>
      Does the shva supersede a vowel or no vowel in the word's non inflected form?<br>
      Is the preceding letter pointed with a "short" or a "long" niqqud-variant?<br>
      Is the following letter, when בג״ד כפ״ת, pointed with a dagesh qal or not?<br>
      Is the letter which is pointed with shva assigned to the preceding or to the following syllable?<br>
      To help illustrate the first criterion (existence or non-existence of a vowel in the word's non inflected form), the "location" of the shva, i.e., the place within the word where the lack of vowel is indicated by it, is marked within the phonemic transcription with an orange linguistic zero: Ø; if existing, the corresponding vowel in the basic (non inflected) form of the example is also marked in orange.<br>
      type of shva		example		non inflected form of example		standard syllabification		attributes:<br>
      vowel / no vowel?	short / long?	dagesh / no dagesh?	preceding / following?<br>
      na	עֵרְבוֹנוֹת	/erØvoˈnot/	(deposits)	עֵרָבוֹן	/eraˈvon/	(deposit)	עֵ—רְבוֹ—נוֹת	vowel	long	without	following<br>
      naḥ	עֶלְבּוֹנוֹת	/elØboˈnot/	(insults)	עֶלְבּוֹן	/elØˈbon/	(insult)	עֶלְ—בּוֹ—נוֹת	no vowel	short	with	preceding<br>
      meraḥef	יֶאֶרְכוּ	/je.erØˈχu/	(they will last)	יֶאֱרַךְ	/je.eˈraχ/	(it will last)	יֶ—אֶרְ—כוּ	vowel	short	without	preceding<br>
      [edit]Shva Na<br>
      In most cases, traditional Hebrew grammar considers shva na to be an entity that supersedes a vowel that exists in the basic form of a word but not after this word underwent inflection or declension. Additionally, any shva marked under an initial letter is classified shva na.<br>
      Merely identifying a given shva as being a "shva na" offers no indication as to its pronunciation in Modern Hebrew; it is however relevant to the application of standard niqqud, e.g.: a בג״ד כפ״ת letter following a letter marked with a shva na may not be marked with a dagesh qal (Modern Hebrew phonology sometimes disagrees with this linguistic prescription, as in זִפְּזְפּוּ – "they zapped" – in which the second pe is pointed with a dagesh qal although preceded by a shva na), or: the vowel preceding a letter marked with a shva na must be represented by the "long" niqqud-variant for that vowel: qamats and not pataḥ, tsere and not segol etc.[↑]. Furthermore, in standard syllabification, the letter under which a shva na is marked is grouped with the following syllable.<br>
      The Academy of the Hebrew Language's transliteration guidelines[1] specify that shva na should be transliterated only if pronounced in Modern Hebrew, in which case "e" be used for general purposes and "ĕ" for precise transliteration. Generally shva na is sometimes transliterated "ə"; concerning Modern Hebrew pronunciation however this symbol is misleading, since it is commonly used in linguistics to denote the vowel Schwa, which does not exist in Modern Hebrew.<br>
      A shva na can be identified as such by means of the following criteria:<br>
      when marked under the first letter of a word,<br>
      when marked under the first of two identical letters,<br>
      when it's the second of two shvas marked under two consecutive letters (except when marked under the last letter of a word),<br>
      when the letter before the one under which it is marked is marked with a "long" niqqud-variant,[↑]<br>
      when marked under a letter with a dagesh ḥazaq (historically an indicator of gemination).<br>
      For a more detailed account, see Tiberian vocalization → Vowels.<br>
      [edit]Shva Naḥ<br>
      Traditional Hebrew grammar defines shva naḥ as indicating the absence of a vowel. In Modern Hebrew, some shvas classified as shva naḥ are nonetheless pronounced /e/ (e.g. the shva under the second dalet in the word שָׁדַדְתְּ – /ʃaˈdadet/ – "you (f.) robbed"; see table above).<br>
      In all but a small number of cases, a shva not conforming to the criteria listed above is classified shva naḥ. This offers no conclusive indication as to its pronunciation in Modern Hebrew; it is however relevant to the application of standard niqqud, e.g.: a בג״ד כפ״ת letter following a letter marked with a shva naḥ must be marked with a dagesh qal (Modern Hebrew phonology sometimes disagrees with this linguistic prescription, as in לְפַסְפֵס – "to miss" – in which the second pe lacks a dagesh qal although preceded by a shva naḥ), or: the vowel preceding a letter marked with a shva naḥ must be represented by the "short" niqqud-variant for that vowel: pataḥ and not qamats, segol and not tsere etc.[↑]. Furthermore, in standard syllabification, the letter under which a shva naḥ is marked is grouped with the preceding syllable.<br>
      The Academy of the Hebrew Language's transliteration guidelines[1] specify that shva naḥ should not be represented in transliteration.<br>
      [edit]Shva Meraḥef<br>
      "Shva meraḥef" is the grammatical designation of a shva which does not comply with all criteria characterizing a shva na (specifically, one marked under a letter following a letter marked with a "short", not a "long", niqqud-variant[↑]), but which does, like a shva na, supersede a vowel (or a shva na) that exists in the basic form of a word but not after this word underwent inflection or declension.<br>
      The classification of a shva as "shva meraḥef" is relevant to the application of standard niqqud, e.g.: a בג״ד כפ״ת letter following a letter marked with a shva meraḥef should not be marked with a dagesh qal, although the vowel preceding this letter could be represented by the "short" niqqud-variant for that vowel.[↑] This reflects sometimes, but not always, pronunciation in Modern Hebrew, e.g. מַלְכֵי ("kings of") is commonly pronounced in accordance with the standard form, /malˈχej/ (with no dagesh qal in the letter kaf), whereas כַּלְבֵי ("dogs of"), whose standard pronunciation is /kalˈvej/, is commonly pronounced /kalˈbej/ (as if there were a dagesh qal in the letter bet). In standard syllabification, the letter under which a shva meraḥef is marked is grouped with the preceding syllable.<br>
      [edit]Shva Ga'ya<br>
      "Shva Ga'ya" designates a shva marked under a letter that is also marked with the cantillation mark "ga'ya", or "meteg", e.g. the shva under the letter bet in the word בְּהוֹנוֹת ("toes") would normally be classified a shva na and be transliterated "e": "behonót" (or according to the precise standard[1], "ĕ": "bĕhonót"), however, if marked with the ga'ya cantillation mark, , this shva is classified as shva ga'ya, and the transliteration reflecting its historical pronunciation would be "bohonót".<br>
      [edit]Tnuʿá ẖatufá ("fleeting" or "furtive" vowel)</p>
      <p>Within niqqud, vowel diacritics are sorted into three groups: "big", "small" and "fleeting" or "furtive" ("tnuʿót gdolót" – "גדולות", "tnuʿót ktanót" – "קטנות" and "tnuʿót ẖatufót" "חטופות"), sometimes also referred to as "long", "short" and "very short" or "ultrashort". This grouping might have correlated to different vowel lengths in earlier forms of Hebrew (see Tiberian vocalization → Vowels; spoken Israeli Hebrew however does not distinguish between different vowel lengths, thus this orthographic differentiation is not manifest in speech).<br>
      The vowel diacritics classified as "ẖatufót" ("fleeting") all share the common feature of being a digraph of a "small vowel" diacritic (patáẖ, segól or kamáts katán) plus a shva sign. Similarly, their names are derived from the respective "small vowel" diacritic's name plus the adjunct "ẖatáf": "ẖatáf patáẖ", "ẖatáf segól" and "ẖatáf kamáts".<br>
      As with a shva na, standard (prescribed) syllabification determines that letters pointed with a "fleeting vowel" diacritic be considered part of the subsequent syllable, even if in modern Hebrew pronunciation this diacritic represents a full-fledged syllable, thus e.g. the phonologically trisyllabic word "הֶעֱמִיד" ("he placed upright"), pronounced /he.eˈmid/, should standardly be syllabified into only two syllables, "הֶ—עֱמִיד" ("he—ĕmíd").<br>
