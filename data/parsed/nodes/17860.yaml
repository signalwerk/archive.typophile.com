    <p>Greetings,</p>
    <p>This would be my first post here on Typophile. I’ve been searching the internet for a site that analyzes some of the more highly regarded typefaces in history (Baskerville, Bodoni, Gill Sans, Goudy {insert face here}, Cooper, etc.) and deconstructs them in a fashion that describes what is conveyed buy each face’s individual characteristics. </p>
    <p>I know that here you have the Typowiki reference, but this just gives a history of each typeface. I’m looking for a more critical analysis. Am I asking too much? Should I look at these faces with a broader eye? Should I look more towards the period from whence these faces emerged?</p>
    <p>Any links or book suggestions would be well appreciated.</p>
    <p>I love this website, and I find it refreshing that I wasn’t the only one scratching out early font ideas on my notepad instead of listening to my government lecture in high school!</p>
    <p>.lazyeye.</p>
