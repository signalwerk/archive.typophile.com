    user: 1250
    date: 2012-04-02T21:48:00
    date_raw: 2 Apr 2012 — 9:48pm
    votes: null
    html: |-
      <p>Brian, thanks for inviting me to comment on this design.</p>
      <p>I think you're doing a number of things right. I like the<br>
      narrowness, the vertical proportions, the color and most<br>
      of all your lack of fear in terms of not clinging to a tired<br>
      black-marking method - you're thinking of what this<br>
      needs to be doing, as opposed to where it's supposed to<br>
      be coming from.</p>
      <p>It is however probably a bit too tight.</p>
      <p>I love seeing the black pushed around to allow the white<br>
      to sing in unison. As you're seeing it's tricky though. But<br>
      don't worry too much about breaking any of the cliché<br>
      rules - especially in immesive reading they become really<br>
      pointless. Also don't be afraid of being a little Po-Mo; it's<br>
      entirely human to be unsure, and type is for humans.</p>
      <p>BTW, that large "n" in your most recent post make me<br>
      think you should look at FF Avance. Keep in my though<br>
      that Evert was a Modernist.</p>
      <p>For the Hebrew, I can only offer tentative observations,<br>
      but it does seem to me that it can't fully inherit the Latin's<br>
      narrowness. Your vertical proportions seem to make good<br>
      sense though.</p>
      <p>hhp</p>
