  - id: 502918
    user: 39424
    date: 2012-04-01T17:35:00
    date_raw: 1 Apr 2012 — 5:35pm
    votes: null
    html: |-
      <p><img src="http://21326.info/work/alpine/Alpine-20120401-small.png"><br>
      <a href="http://21326.info/work/alpine/Alpine-20120401.png" rel="nofollow">Larger image</a></p>
      <p>Here's another update. I've tried to fix most of the things you guys have mentioned. I'm also experimenting with wedge baseline serifs for the 'd' and 'u', is it working? I hope I'm not being to radical with some of the uppercase. I'm going to have to work on the 'R' for sure.</p>
      <p>I decided to remove most inside serifs in an attempt to improve <em>notan</em> aspects. I was originally thinking removing the bottom left serifs would improve it. It <em>does</em> make an interesting interlocking pattern, but it doesn't help the word image at all, in my opinion.</p>
      <p><img src="http://21326.info/work/alpine/bouma.jpg"><br>
      <img src="http://21326.info/work/alpine/notan-counters.png"></p>
      <p>Of course, it really looks unusual. I think it would probably trip me up in running text. Also, the counters don't really <em>look</em> like anything. In a way it's visually messy. I had thought about this, and as I said, I decided that I should remove the inside facing serifs.</p>
      <p><img src="http://21326.info/work/alpine/notan-counters2.png"></p>
      <p>I realized it would be excellent for two reasons: 1) this helps reinforce the relation ship between letters, which is what <em>word image</em> is all about. 2) the counter form actually <em>looks</em> like a simplified 'n'. Other similar letters will do the same. So except in the case where the serif is needed for color or helps make it "work" better, I'll be removing inner serifs. The serifs also seem to create a fairly even, rhythmic line, except where the counters are opened up. I think this also helps recognition of letterforms.</p>
      <p>I had been thinking of this before the thread came up, about emphasizing the most important parts in the recognition of glyphs. <a href="http://typophile.com/node/91645" title="http://typophile.com/node/91645">http://typophile.com/node/91645</a> The research of Frederic Gosselin is fascinating, although I think it's fairly obvious to most of us here. For one thing, from the outset I made a large hood on the 'f'. I'm thinking I may try reworking the 'a' based on that research as well.</p>
      <p>On the Hebrew: Trying and get a handle on the relative proportions for everything as early as possible. If able, I want to make the Hebrew and Latin share any vertical metrics they can, however not much works there. Maybe I can relate the flag of the <em>lamed</em> to the Latin accents. This current Hebrew might be too playful to really work in text, as well, but I'm working on it. I'll be doing print tests as soon as I get enough glyphs finished for it to really mean something. Text at medium-to-small sizes is what I'm going for.</p>
      <p><img src="http://21326.info/work/alpine/Alpine-20120401-f.jpg"></p>
      <blockquote><p>Not sure if a /v/ like that works...</p></blockquote>
      <p>I'm not either! Actually, that's the first time I've ever made one like that. Sometimes you just get peculiar ideas about how letters can be built when you've spent too much time playing with them. Thanks for the input btw Jasper.</p>
      <blockquote><p>/a/ needs work.</p></blockquote>
      <p>What exactly do you think the problem is? :)</p>
      <p>Also, thanks to Martin Silvertant who gave me some much needed input on <a href="http://fav.me/d4uigkw" rel="nofollow">dA</a>.</p>
