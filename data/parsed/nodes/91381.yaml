    html: |-
      <p>Alright, I've finally uplaoded a PDF. I have now drawn a full set of caps. The PDF has some pangrams as well as actual text setting. No numerals yet. The name has also now been changed to <em>Hemlock</em>. I like that name better, more about that is at the end of the first post.</p>
      <p><strong>Some notes:</strong><br>
      z: it is a bit quirky. I haven't printed my test pages yet so I don't really know how well it will work.<br>
      n,m,h: Martin had said on dA that it looks a bit like a man standing with his legs far apart and feet to the sides. I've found that I think the size of the gap is distracting, so I've condensed these letters a bit.<br>
      caps: I'm having a bit of trouble with the proportions right now, so bear with me.</p>
      <p>I don't want to make this too old-fashioned, but make a contemporary design with the warmth of old metal book faces. So bear that in mind. Hopefully the spacing is better than before, although I'm not at a point where I can start kerning yet.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hemlock-20120413_6021.png"></div><p></p>
      <p>One last thing: I need to set Hemlock aside so I can focus on Neuton. So I may be neglecting this thread for a while.</p>
