    <p>I’m in need of some real expert advice here from experienced type designers.</p>
    <p>I basically want this shape of the O. I want it to feel like a square O with rounded corners. End of story.</p>
    <p>But…</p>
    <p>…the problem is that it makes my eyes see the square to much and I want it to feel more round when I look at it, but with “logically” the same shape. </p>
    <p>I can imagine there is some optical trick to pull here, but what?</p>
    <p>Is there better ways where to put the nodes?</p>
    <p>Does anybody understand what I mean, I think this could be misunderstood easily due to my bad english =)</p>
    <p>Thanks in advance, and regards from Sweden.</p><div class="imageWrap"><img src="/web/20080906164455im_/http://www.typophile.com/files/expert_trick_to_do_3713.jpg"></div><p></p>
