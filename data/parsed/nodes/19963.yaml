      <p>In font lab:</p>
      <p>1. Select the whole glyph. </p>
      <p>2. paste to mask, so the original outline is in the background.</p>
      <p>3. shift and hold, then click on the bezier knots and slide them away from the corners. The shift-and-hold, then click will move the knots while keeping the handles in the same place. </p>
      <p>4. Then adjust the handles so the outline moves back closer to the mask, but with a smoother join of curve-to-straight. </p>
      <p>This process I think is one way of getting you to the ’dynamic curves’ that the Underware folks write about.</p>
