    html: "<p>I would make one other suggestion: The points where the straights change to curves should usually be aligned between the outer and inner paths. This is particularly true with a (somewhat) geometric design such as yours. As you have it now, the inner curves start sooner than the outer curves, making the curves thicker than the straights.</p>"
