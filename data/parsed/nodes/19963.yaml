      <p>That’s called the “bone” effect, where the ends looks like they’re bulging out. The easiest way to fix it is to give the curves more room into the straights. A more sophisticated way, but one that’s more “brittle” and more work, is to not make the straights totally straight - to give them a very gentle intasis, as Cynthia Batty calls it; or extasis, as... those obsessed by sex and/or drugs call it.  ;-)</p>
      <p>BTW, my customers are <cite>lucky</cite> I don’t design like I drive!<br>
      :-P</p>
      <p>hhp</p>
