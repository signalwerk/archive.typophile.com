    <p>Ok, I've been searching all moring and haven't had a clear defining answer yet. I would like to know how to use the % symbol properly in my technical writing.</p>
    <p>ie. The motor speed is set in the range of 0 to 100%.</p>
    <p>Is there to be a percent sign after the 0 as well? Do I just spell out the word percent at the end? HELP!!</p>
