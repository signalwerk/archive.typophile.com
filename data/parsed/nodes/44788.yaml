      <p>The <cite>Chicago Manual of Style, 15th Ed.</cite> gives the following guideline:</p>
      <p><strong>9.19</strong> <em>Percentages.</em> Percentages are always given in numerals. In humanistic copy the word <em>percent</em> is used; in scientific and statistical copy, or in humanistic copy that includes numerous percentage figures, the symbol % is more appropriate.<br>
      <em><br>
      Only 45 percent of the electorate voted.<br>
      With 90–95 percent of the work complete, we can relax.<br>
      A 75 percent likelihood of winning is worth the effort.<br>
      Her five-year certificate of deposit carries an interest rate of 5.9 percent.<br>
      Only 20% of the ants were observed to react to the stimulus.<br>
      The treatment resulted in a 10%–15% reduction in discomfort.<br>
      </em></p>
