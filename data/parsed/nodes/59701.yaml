    html: |-
      <p>SunnyGosal -</p>
      <p>Consider whether your bumper sticker will be appearing on a long-haul semi truck or a neighborhood delivery vehicle. The legibility of the DIN-Interstate-Clearview highway fonts is tested and scored in the context of headline display letters on stationary signs posted along state or federal highways, and I don't know if it's all that applicable in the context of a bumper sticker that's to be seen at local stop lights and businesss parking lots. A non-highway sans font might serve your purposes better.</p>
    html_clean: |-
