    html: |-
      <p><a href="http://www.clearviewhwy.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Clearview</a> — American highway<br><a href="http://www.fontshop.com/fonts/downloads/elsner_flake/din_mittel_ot/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">DIN Mittel</a> — German highway<br><a href="http://www.fontshop.com/fonts/downloads/elsner_flake/din_mittel_ot/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Interstate</a> — Canadian highway</p>
      <p>I think the "invisible/boring/familiar" approach should be strongly considered (Helvetica?). It <em>is</em> somewhat ironic making an eye-catching bumper sticker, taking drivers attention away from the road, in the spirit of driving safety.</p>
      <p>Without getting into a scientific debate, I would recommend upper and lowercase over caps (Bhouma, 1971) and opening up the tracking a bit (Pelli, 2008).</p>
      <p>It may be worth finding out the predominant road-sign typeface in your clients region and select the same so it blends in with the typographic landscape.</p>
      <p>Additionally, you may want to take the "+ frequency of exposure = good" approach. Following that logic you could rationalize using basterdized Airal caps. An interesting challenge. To counterbalance attention to the road with attention to the sticker while communicating a message.</p>
