    <p>Hello all,</p>
    <p>Recently I've been commissioned to design a basic bumper sticker/decal. You've seen them before "HOW'S MY DRIVING? 1-800-555-5555". I'm looking for suggestions on typefaces to use. Legibility is essential, as the bumper sticker/decal has size limitations and will be read while in movement. </p>
    <p>I'm reaching out to the typography community for suggestions - You input would be most appreciated.  </p>
    <p>Sunny.</p>
