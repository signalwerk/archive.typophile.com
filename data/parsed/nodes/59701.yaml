    html: |-
      <p>@ChristppherDean</p>
      <p>Both Standard Highway Alphabet and Clearview are used in both the USA and Canada. </p>
      <p>In fact, Canada embraced Clearview much faster than the US did. I believe that Canada does not have the federal equivalent of the FHWA, so these decisions were able be made on the municipal and provincial level without approval from the federal government.</p>
      <p>At last count, Clearview was being used in Quebec, Ontario, Alberta, Manitoba, Saskatchewan, British Columbia.</p>
