    html: "<p>Some of the most legible typefaces are the ones that designers hate, like Arial and Souvenir. Designers avoid them because they're bland and boring, but there's a reason folks keep using them: Their lack of subtle refinement makes them easy to read under less-than optimal conditions (e.g., driving past at 70 mph).</p>"
