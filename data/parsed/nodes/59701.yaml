      <p><cite>A non-highway sans font might serve your purposes better.</cite></p>
      <p>WHile I disagree with your argument regarding the applicability of the testing and research to this use, it is still probably a good idea to use a non-highway type of alphabet. Don't ever pass up an opportunity to instill your brand on the public. Your decision on what font to use on the bumper sticker should be coordinated with the entire identity process of the organization you are working for.</p>
      <p>How did that old bumper sticker go? "HOW IS MY DRIVING? Call 1-800-EAT SH*T"</p>
