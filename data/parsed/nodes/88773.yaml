    <p>Embossanova was inspired by Bodoni and Lubalin Graph, an unlikely pairing says Stephen Boss, the type designer designer and owner of the digital type foundry Emboss Fonts.</p>
    <p>Initially the design started off as a rather elongated geometric serif typeface but after the renderings were digitized, the process took on a life of its own. The capital S became the key character, setting the tone for the entire set of glyphs.</p>
    <p>The typeface has received very positive feedback, here is a tweet from fonts.com: @fontscom Check out Embossanova, a wonderful<br>
    new release from @stephenboss2000! <a href="http://bit.ly/v0NEAc" title="http://bit.ly/v0NEAc">http://bit.ly/v0NEAc</a> #fonts #typography</p>
    <p>Embossanova (and Emboss' complete library) can be purchased exclusively at Fonts.com, Linotype and ITC.</p>
    <p><a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=922170" rel="nofollow">http://www.fonts.com/findfonts/detail.htm?productid=922170</a><br>
    <a class="freelinking external" href="http://www.linotype.com/750383/ElefontEmboss-family.html" rel="nofollow">http://www.linotype.com/750383/ElefontEmboss-family.html</a><br>
    <a class="freelinking external" href="http://www.itcfonts.com/fonts/detail.htm?ProductID=922170" rel="nofollow">http://www.itcfonts.com/fonts/detail.htm?ProductID=922170</a></p>
    <p>___________________</p>
    <p>About Emboss<br>
    Emboss Fonts creates highly personalized fonts for the Mac &amp; PC, Stephen Boss (owner) has been designing fonts since the Mid Nineties. In addition to designing fonts for distribution, he consults on custom corporate projects. The foundry currently has several new designs in queue.</p>
