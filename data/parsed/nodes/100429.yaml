      <p>I'm not sure there's any unused room in the Dutch layout, and I <em>am</em> pretty sure people hate learning new things that seem trivial (like a new key on a keyboard).* But my own point was that "IJ"/"ij" exists as a unity, and it's better to have a smarter font than a dumber one (even if a spell-checker can sometimes help).</p>
      <p>* Although a nice "behind-the-scenes" [Shift-]Alt-something should work well.</p>
      <p>Also, I personally don't trust spell-checkers too much; I have a problem with <em>Word's English spell-checker</em> about once a week, nevermind something cheesy somebody might be using for a less-supported language.</p>
      <p>hhp</p>
