    html: <p>IJ/ij was a separate key on Dutch typewriters, and it is only since the advent of computers and hardware based on US models that it has not been readily available for input as a separate character. That doesn't stop some Dutch publishers from routinely replacing all occurences of i+j in Dutch texts with the Unicode ij digraph character. Why do they do this? Because in Dutch orthography this digraph has behaviours in casing, spacing and accentuation that differ from the i and j as independent letters. There are means to apply these behaviours to i+j, but it is much easier to do so with the ij character.</p>
