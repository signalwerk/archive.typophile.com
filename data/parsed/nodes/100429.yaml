    <p>Hi friends,</p>
    <p>I'm developing a script font that relies on Contextual Alternates for the script connections.</p>
    <p>After I've added a<br>
    <code><br>
      # Latin<br>
      script latn;<br>
        # Dutch<br>
        language NLD;<br>
              sub i j by ij; # Dutch ij<br>
    </code><br>
    to the font, the Contextual Alternates feature is not applied anymore when the language in InDesign 7.0.4 is set to Dutch.<br>
    The other languages work as expected.<br>
    The Contextual Alternates features does not contain any Script/Language tags, only default Script/Language substituations.</p>
    <p>Does anyone have experience with this?<br>
    Thank you.</p>
