      <p>My keyboard is the French Canadian keyboard (I mean what is printed on the keys corresponds to the Canadian French CSA layout) but I have to switch all the time between layouts because the position for the characters used in LaTeX are not handy with the Canadian French CSA layout; I also use the US extended keyboard layout (I thus need to know where the characters are because they are not printed on the keys).  So I am well aware of the limitations of keyboards. I also have layouts I made for myself with SIL Ukelele.</p>
      <p>On the other hand, the Canadian French CSA keyboard does not contain the oe ligature(*) and, so far as I know, people rely on the spell checker for it and, in my opinion,  it does a good job. </p>
      <p>Whether the Dutch spell checker is as useful with ij ligatures, I don't know. I just downloaded the OpenOffice nl_NL dictionary and it contains more than 9700 entries with the ij ligature. I am not saying that adding an ij character on the keyboard could not be beneficial but I fail to see how it could improve much the final text, whether printed or for the screen. </p>
      <p>(*) On the mac, you need to type ALT q to get œ.</p>
