      <p><em>I could also switch from Dutch to English for the corresponding word; can that be done in standard text editors so that Fiji would not be written with a ligature?</em></p>
      <p>I think it's a pretty safe bet that any text processor that enables you to set the language as Dutch is going to let you set the language to something else. Language tagging is pretty standard in text processing these days, because spellchecking, hyphenation etc. all rely on it.</p>
      <p>My Leiden client, Brill, regularly use the Unicode IJ/ij digraph characters, but in the fonts I made for them they also wanted the kind of Dutch-specific ligation proposed in this thread.</p>
