      <p>Thomas, </p>
      <p>well, I would call it Vista-specific in so far that Windows Vista is the first operating system that bundles WPF. Essentially, WPF is the new (alternative) graphic subsystem that is pre-installed on Vista, but can also be retroactively installed on Windows XP and probably Windows 2000. </p>
      <p>It is, surely enough, a good reason why font developers should be phasing out Type 1 fonts and offer modern font formats (OpenType PS, OpenType TT) at least as an alternative. </p>
      <p>A.</p>
