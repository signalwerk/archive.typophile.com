    <p>In another forum where I deal regularly with font questions, I am starting to get questions about Vista's [lack of] support for Type 1 (commonly and incorrectly called PostScript) fonts. Anyone else starting to face this issue? </p>
    <p>I know Fonts.com has posted that they will try to create PFM files (which are required for Vista to use a Type 1 font) for users of their fonts who run into problems.</p>
