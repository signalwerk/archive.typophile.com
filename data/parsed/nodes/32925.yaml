      <p>&gt; <em>just yesterday someone posted on the AAUP designers list lamenting the lack of italic small capitals in Garamond Premier Pro, &amp; why weren’t they there</em></p>
      <p>What?! Garamond Premier Pro (roman &amp; italic) not only has small caps for Latin, it has them for extended Latin, Greek and Cyrillic. <a href="http://www.adobe.com/type/browser/pdfs/GRPP/GaramondPremrPro-It.pdf" rel="nofollow">Here's the complete glyphset.</a> (PDF file)</p>
      <p>That person must be confusing Garamond Premier Pro with Adobe Garamond Pro, two different type families. Yes, the italic fonts of the latter do not have small capitals. This must be due to historical reasons; I believe slopped small caps don't exist in the source material. Also, some purists think that slopped (bold or regular) small capitals and capitals, and the bold italic style overall are mere aberrations, because they are later developments and kind of "overkill" (like underlining something that is already set in bold). Bringhurst has a short section somehow related with this, <em>3.4 Tribal Alliances &amp; Families</em>.</p>
      <p>&gt; <em>don’t all OpenType fonts have Italic small caps</em></p>
      <p>That's one of the misconceptions about OpenType. Some users think that just because a font is in OpenType format, it contains small caps, old style figures, alternate glyphs, broad language support and all the other niceties, when in fact it might not be the case. Differentiating between 'Std' and 'Pro' helps a bit, but even the designation 'Pro' doesn't guarantee that two font families have the same feature richness.</p>
