      <p>&gt; <em>I don’t see the need for Type 1 font support going away anytime soon for the graphic industry</em></p>
      <p>The Type 1 font format is around 25 years old. Only 256 glyphs can be encoded in each font. There is no support for Unicode or layout features (stylistic or linguistic). Are these enough reasons for you?</p>
      <p>Anyway, if support for the Type 1 format goes away in the near future, that might only happen at the operating system level. It's likely that Adobe apps will continue to support Type 1 after that. For example, the new InDesign CS3 still supports Multiple Master fonts despite the fact that Adobe stopped making new MM (and Type 1) fonts back in 1999.</p>
