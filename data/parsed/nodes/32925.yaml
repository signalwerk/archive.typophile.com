      <p>I know, Miguel but that's the state of things. And it isn't just the AAUP -- Remember the poster on this board who was grousing that there were a bunch of Adobe fonts in OpenType that didn't have any more characters than the old Type 1 fonts? </p>
      <p>And no, she wasn't confusing Premier Pro with AG, just "Couldn't find them on the Glyph Pallet." Well, it <cite>is</cite> a "full pallet." There are better ways to "find" them, once you know they really are there.</p>
      <p>As to using "slopped" roman or bold small caps for the italic, no, it isn't usually done. This isn't out of ignorance. There are a fair number of typographers in the AAUP, who know type quite well. The usual attitude is if you don't have a small cap, use the full cap. Life will go on. I'd bet what happened is that she'd decided on small caps for some level of subheads, &amp; ran into a subhead with italic in it, &amp; didn't want to change the subhead style if it could be avoided.</p>
      <p>A problem with faking any kind of small caps is you have to do a pretty good job of it, or someone in the "book" audience (readers, as well as editors) will notice, grimace, &amp; write a letter to the publisher. It isn't so much a problem of overkill; more like deciding to put on a Shakespeare play using an open set but period costumes.</p>
