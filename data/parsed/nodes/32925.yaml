      <p>What lack of support? You need PFB and PFM files, as you do on all versions of WIndows. (On older versions of Windows you could install ATM, which would create PFM files from PFB+AFM+INF. But starting with Windows 2000 ATM was not required to use Type 1 fonts on Windows.)</p>
      <p>If somebody has been shipping Windows Type 1 fonts without PFMs, well, that would be a mistake.</p>
      <p>Now, there also is the fact that Windows Presentation Foundation doesn't support Type 1 (nor did its predecessor, GDI+). But that's not really a Vista-specific issue.</p>
      <p>Regards,</p>
      <p>T</p>
