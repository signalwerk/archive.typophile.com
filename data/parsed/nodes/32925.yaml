      <p>Hi Thomas,<br>
      WPF *is* pre-installed on Vista. :)<br>
      While it's true that one can uninstall it manually from the "Turn Windows features on or off" Control Panel applet, it is there, on by default. The assemblies are in %windir%\Microsoft.NET\Framework\v3.0\WPF\ directory. From my personal experience, OEMs like Dell also leave it on. I got a new home laptop recently from Dell, and I was able to install the gorgeous Seattle PI Newsreader app (<a href="http://seattlepi.nwsource.com/newsreader/" title="http://seattlepi.nwsource.com/newsreader/">http://seattlepi.nwsource.com/newsreader/</a>) on it very quickly thanks to that. It's so much easier on eyes than the web version.</p>
      <p>I agree with your opinion regarding Type 1 fonts, however I'm still interested in learning how much existing customer scenarios and workflows rely on those fonts today. [We've had some customer concerns in the past regarding lack of Type 1 support in WPF.]</p>
      <p>Best regards,<br>
      Mikhail</p>
