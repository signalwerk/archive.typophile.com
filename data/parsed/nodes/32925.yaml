      <p>Hi,<br>
      I'd like to clarify this a little bit. As of Windows Vista, Windows includes three different components with their own text rendering engines:</p>
      <p>1. GDI (used in most Win32 applications). GDI supports TrueType (.TTF/.TTC/.OTF), Type 1 (*.PFM/*.PFB, plus some multiple master font support if one types the complete face name correctly), OpenType CFF (OpenType fonts with CFF outlines, .OTF), bitmap fonts (.FON) and very old vector font format fonts (also typically .FON).</p>
      <p>2. GDI+ (used either directly through public GDI+ API or through .Net Windows Forms component.) GDI+ supports TrueType fonts (.TTF/.TTC/.OTF).</p>
      <p>3. WPF (used through the new WPF APIs shipping with .Net 3.0.) WPF supports TrueType (.TTF/.TTC/.OTF), OpenType CFF (OpenType fonts with CFF outlines, .OTF), and the new composite font file format that is used to describe international font linking and fallback logic (.CompositeFont).</p>
      <p>Please let me know if you have specific customer feedback (assuming it's OK to share, of course) on the lack of Type 1 support in WPF.</p>
      <p>Thanks in advance, and best regards,<br>
      Mikhail Leonov<br>
      WPF Text Team, Microsoft Corporation</p>
