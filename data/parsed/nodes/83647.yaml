    html: |-
      <p><em>1. What do you mean by "final production directories"?</em></p>
      <p>My font outlines make extensive use of overlaps and composite characters. Before I can use them to produce final fonts I have to break down many composite characters and remove the overlaps. To keep these “flat” files from getting mixed up with my original files I put them into their own directories.</p>
      <p><em>2. What is an "interpolated instance"? ( I keep trying to find out what exactly interpolation means in font design, and I still have no idea.)</em></p>
      <p>An interpolated instance is a font that was interpolated from two or more master fonts. <a href="http://www.youtube.com/watch?v=Ii9WSPFll7M" rel="nofollow">Watch Erik's video for an explanation.</a></p>
      <p><em>3. "Generate kern files for instances"?</em></p>
      <p>I do my kerning in Metrics Machine and interpolate in Superpolator. I use Metrics Machine to export the interpolated kerning from my Superpolator UFO files to an AFDKO-compatible feature file that can be compiled into final fonts.</p>
      <p><em>4. "Dekink interpolated instances with RMX harmonizer"? What does this mean, and what if I can't afford that app? Is there another way to do it?</em></p>
      <p>Remix Harmonizer is part of Tim Ahrens Font Remix suite of tools. It's sort of like 1000-grit wet sandpaper for bezier curves. It can automatically fix “kinks“, which are funky math problems that occur in bezier curves as a result of batch processes, including interpolation. Basically, it fixes a lot of wonky little details that would take me hours to find and correct manually. </p>
      <p><em>5. What's an "interpolated font"?</em></p>
      <p>That's the same thing as the interpolated instance described above.</p>
      <p><em>6. What do you mean by "flat font"? I know what decompose is, though.</em></p>
      <p>A flat font is a flat with <em>no</em> overlaps.</p>
      <p><em>7. What are "glyph indices"?</em></p>
      <p>Each glyph has a index number that orders it within the font. For some reason this is the default order for the glyph palette in Adobe apps. Because I do not add glyphs to fonts in a logical order I sort them to match my logically-sorted encoding files.</p>
      <p><em>8. What do you mean by "test final proof"?</em></p>
      <p>I have a final test proof file that I use to make sure everything prints correctly in Indesign.</p>
