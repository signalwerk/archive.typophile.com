  html: <p>I keep seeing this term from Pro font designers. Apparently this is the last stage of font development and some use Fontlab to do it, and others use Adobe Font DKO. I went to the Adobe Font DKO webpage and almost downloaded it, but I don't know what exactly I would use it for, or how to learn about how to use it.</p>
