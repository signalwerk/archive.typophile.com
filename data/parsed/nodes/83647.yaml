      <p>"Mastering" is a term that different people probably use slightly differently, but in my view it involves everything that means turning a typeface design into a shipping font. </p>
      <p>Checking of the quality of outlines and their compatibility with requirements of font format specification can be seen as "mastering" though most people consider it a part of the design process. </p>
      <p>Depending on one's perspective, writing code for OpenType Layout features can be seen as "design" or "mastering", since some people consider OpenType Layout as much as essential part of the design decision-making process as spacing and kerning, while others consider it more akin to hinting. </p>
      <p>In some cases, hinting can be seen as making design decisions, but is more likely to fall into the "mastering" category. </p>
      <p>Other typical elements of "mastering" include checking and fixing of: Unicode encoding, glyph naming, glyph ordering, family naming, linespacing consistency, as well as lots of other technical parameters such as embedding settings, version records, Panose information, and it some cases some additional technical parts. </p>
      <p>Mastering is often tied directly to quality assurance (testing and proofing). </p>
      <p>Currently, one universal checklist for all these aspects does not exist. But tools such as FontLab Studio along with the FontQA plugin, Adobe FDK (especially compareFamily but also other tools of the package), Microsoft FontValidator, Area51, FeatureProof, Microsoft VOLT &amp; VTT, and DTL OTMaster can all be useful in the process of mastering. </p>
      <p>Best,<br>
      Adam</p>
