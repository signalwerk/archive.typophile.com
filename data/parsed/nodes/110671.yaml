    html: |-
      <p>@baxendale</p>
      <p>ttfautohint relies on the same TrueType interpreter that exists in the open-source Ubuntu operating system.<br>
      It's been a couple of years in development and has become, with each new iteration, more and more capable.<br>
      As far as Frode's statement:</p>
      <p>&gt;<em>“Re. autohinting: If you are making quality type, you need to hire a TrueType hinter or spend time learning it. Or wait 5–10 years. Or more. Or less.”</em></p>
      <p>Well, let me just say that my day in day out experience with ttfautohint - applying it to a wide variety of fonts and then examining the results closely in a variety of browsers on Windows - tells me Frode is wrong.</p>
      <p>(Plus, I doubt if we could even agree on a definition of what constitutes "quality" in a webfont. So I certainly don't want to argue with him further. I just don't want you to be biased before you've had a chance to see for yourself.)</p>
      <p>Bottom line: I think you'll like the results ttfautohint gives you. If you don't, let me know. I'll be glad to take a look.</p>
      <p>rich</p>
