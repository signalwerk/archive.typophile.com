      <p>On shapes: When I drew <a href="https://monokrom.no/fonts/aften/design" rel="nofollow">my (first) low resolution text face</a>, I did the proofing solely on screen. Looking at how the screen – in fact lots of screens – interprets shapes was important, because I learned I got better results by rethinking some of the optical tricks I usually apply to print faces.</p>
      <p>On hinting: Type used online should, generally, have hinting instructions – most likely TrueType hinting. This can be done manually, or automatized. You would need to go outside of Glyphs to do this.</p>
      <p>On vertical metrics: <a href="http://www.google.no/url?sa=t&amp;rct=j&amp;q=&amp;esrc=s&amp;source=web&amp;cd=7&amp;ved=0CGsQFjAG&amp;url=http%3A%2F%2Ftypophile.com%2Fnode%2F78279&amp;ei=DIDiUu-bG4rnygOgrICoDg&amp;usg=AFQjCNHDkv7BA-pUU4QV86eGxWdY9zyN7g&amp;sig2=aza0Zf4EfBwWvDTK2pL4yg&amp;bvm=bv.59930103,d.bGQ" rel="nofollow">Vertical metrics</a> for the web is a hornet’s nest. </p>
      <p>On font formats: WOFF, EOT, TTF &amp; SVG.</p>
