    html: |-
      <p>1) Vertical Metrics shortcut:<br>
       Run your font through the Font Squirrel generator. It will automatically measure and change the vertical metrics. Transplant those vertical metrics to the originals.<br>
      (Caveat: I believe you still can't run a font with more than 600 chars in it on Font Squirrel.)</p>
      <p>Note: Make sure the embedding bit is set for Installable. Otherwise the font might malfunction if IE is a part of your test suite. </p>
      <p>2) Hinting for Truetype</p>
      <p>TT hinting is necessary for the font NOT to look like hell in browser's running on versions of Windows. As Frode testified.<br>
      So....<br>
      Either output a new original TTF with the updated vertical metrics (changing the vertical metrics after font generation can be done but you'll have to turn to special tools for that - better they should be in the font from the start) or make a new source file (vfb, sfd) that has Truetype curves.<br>
      Once you've got that, output the font as a TTF without any hints provided by Fontlab or FontForge or whatever other app you're using that might try to add TT hints.<br>
      Download ttfautohint.<br>
      <a href="http://sourceforge.net/projects/freetype/files/ttfautohint/" title="http://sourceforge.net/projects/freetype/files/ttfautohint/">http://sourceforge.net/projects/freetype/files/ttfautohint/</a><br>
      Latest version is .97<br>
      There's a GUI for both Mac and Windows included. Use one of those - easiest way. Self explanatory. Employ common sense.<br>
      The TT hinted file will be a bit bigger than the original.  Check it out visually in a HTML page and if it looks good, it is good.<br>
      A Drag and Drop test page that makes testing (within a limited charset at the moment) very easy, is located here:<br>
      <a href="http://readableweb.com/tests/draganddrop/font-tester-8.1.htm" title="http://readableweb.com/tests/draganddrop/font-tester-8.1.htm">http://readableweb.com/tests/draganddrop/font-tester-8.1.htm</a></p>
      <p>Ya want/need help? Or got a lot of fonts to process and don't have the time and/or expertise?<br>
      Drop me a line on my blog Readableweb.com. I THINK it will make it to my inbox if, if Media Temple continues to behave itself.</p>
      <p>rich</p>
