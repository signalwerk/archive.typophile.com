    <p>I've created multiple typefaces over the last few years  and was recently asked to create a typeface for a client based on the custom made logo. I've created the type and I've made it work in Glyphs. So good so far.<br>
    The client specifically said that the typeface is going to be used on web and mobile applications.  It's a really bold header typefaces which shouldn't be used very small because of readability, but I'm curious if there is any thing I should be aware of while creating or exporting the typeface that has to do with the online use. I know there used to be different ways of implementing a typeface on a website that have an effect on the typeface, but thats not my responsibility. </p>
    <p>I would love to know if any of you know if there are implications on my side while creating the typeface in Glyphs. Anyone?</p>
