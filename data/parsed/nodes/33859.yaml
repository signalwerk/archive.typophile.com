    html: "<p>Even so, there's a lot of \"customising\" going on in design; best example (at least from the top of my head): the customised Century Schoolbook for Ikea. I can't really think of any others right now, but I knów there's a lot of them. As far as selling the font afterwards as being your own creation, that's a different question, but you might want to contact Eduardo Recife from <a href=\"http://www.misprintedtype.com/\" title=\"www.misprintedtype.com/\">www.misprintedtype.com/</a> for information. He practically doesn't do anything but mixing and messing up existing fonts ;-) Don't get me wrong, I absolutely love his work, and not just his fonts!</p>"
