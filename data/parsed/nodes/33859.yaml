    html: |-
      <p>Here's something I wrote about myself &amp; my work a few months back. It seconds your opinion, Haley, about it being very hard to make anything original... After all, for every single thing there can only be one pioneer.</p>
      <p>In my opinion innovation is overrated. Everything has been done before &amp; the only thing left for us to do is to add personal flavour. My work is merely a reflection of personal taste &amp; skills. You can't hide the things that inspire and I've never had the intention to do so in any way. I'm not ashamed of my muse &amp; everything I do can be seen as an ode to her. I can’t take credit for my own work ‘cause even if the apprentice should exceed his master, the honour still belongs to the latter. I’m a thief of ideas. I steal with my eyes the creations of other people’s minds and use their blueprints as my guide. But always with love and respect for what I’ve seen –secretly hoping that one day I too will be copied in some kind of poetic justice where the hunter gets hunted, inspiring others with what I admire and pass the torch, so to speak. I can only pray to become a chackle in the chain of inspiration, bringing life to new creations &amp; encourage them to breed.<br>
      Most of my friends &amp; family think of me as being creative, but I beg to differ. I just think I have a good eye for detail &amp; the stamina to apply this to my work. In graphic design you always need to find the right balance between clarity &amp; aesthetics. I always opt in favour for the latter. Even the simplest design can eat up a whole lot of my time 'cause I like to explore all possibilities before settling with a final result &amp; although the last word may suggest otherwise, I'll take quality over quantity anytime.</p>
