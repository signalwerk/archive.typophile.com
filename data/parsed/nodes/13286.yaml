    <p>*** NOTE: I am not wearing any hats but my own with this entry. ***</p>
    <p>I am <em>sick</em> to <em>death</em> of comparisons that arise every year as we enter conference season. Specifically, the comparison of ATypI to TypeCon. Yes, both conference happen to share the topic of type. But, why compare? Why not just love? I guess I sit in a tough place. I love both. Some might say ATypI is more academic. Others say TypeCon isn't serious enough. I hate to break it to you people, but both conferences have both qualities. Where TypeCon is less expensive, ATypI gives you the opportunity to mill around during lunch and watch your heroes eat. Where ATypI bends toward specific corners of typographic theory, TypeCon gets to move into Type use in Graphic Design. Even these are gross generalizations. ATypI has three tracks, argued to be a good thing because you get choice. TypeCon has one track allowing us to not pine and winge over the speakers we are missing. </p>
    <p>Compare for yourself. </p>
    <p><a href="http://www.atypi.org/07_Helsinki/30_program/20_main_program" rel="nofollow">ATypI</a> and <a href="http://www.typecon.com/speakers/" rel="nofollow">TypeCon</a></p>
    <p>Both conferences have their share of high-brow talk and low-fi fun. Don't hate, participate!</p>
