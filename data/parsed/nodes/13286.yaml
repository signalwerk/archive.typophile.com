      <p>Dan, you little devil's advocate, ::wink:: I never said they serve the same audience. I only said they have many similarities and I did call to attention two places at which they diverge from one another. I also didn't say that students should attend both. My checkbook can attest to the fact that I couldn't attend both accept for a few lucky circustances this year. Location and cost are a total factor, I agree. I also agree that more graphic designers attend TypeCon. Hmm. Me thinks that I didn't write in English and wrote, instead, in Tiffanese. </p>
      <p>Dan, I was attempting to start the conversation, which inevitably happens every year, off on a good note. </p>
      <p>Yes. Cost is a factor. Yes. Location is a factor. Yes. If you are a student that lives on a pauper's budget you more than likely can't make it to both or either one for that matter. Yes. Yes. and. Yes.</p>
