      <p>[devil's advocate]</p>
      <p>Tiffany, it is unreasonable to expect that TypeCon &amp; ATypI Conferences serve the same audiences (except perhaps in the one year out of four that ATypI comes to North America). Most designers, especially students, young designers, busy designers, or poor designers, cannot be expected to afford to attend both conferences. Those who can afford both get the reward of attending both ;-)</p>
      <p>The rest have to make decisions. It does come down a bit to funding. Location &amp; cost are a factor, and interest is another. It is not unreasonable to expect more graphic designers to attend TypeCon than ATypI. Font Technicians who can only make one conference should pick the ATypI. The conferences are not the same. If they were the same, then they could please eveyone by just happening once, not twice, right?</p>
      <p>[/devil's advocate]<br>
      __<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
