    date_raw: 31 Dec 2004 — 9:38am
    votes: null
    html: <p>Noah, I think a study of <a href="http://briem.ismennt.is/index.htm" target="_blank">briem's guide</a> to type would be helpful to you. He explains there how the curved strokes need to be thicker than the stems in order to look the same and other things, these tricks will enable you to keep your playful shapes, but make the face more balanced and polished. For example, the vertical part of your bowls on bcd need to be thicker to balance the stems.  <br> <br>Also you might have a look at <a href="http://www.myfonts.com/fonts/linotype/itc-tempus/" target="_blank">Tempus</a> and other Grimshaw fonts to see how he is able to make informal faces very balanced but still lively.</p>
    html_clean: <p>Noah, I think a study of <a href="http://briem.ismennt.is/index.htm" target="_blank" class="link-external">briem's guide</a> to type would be helpful to you. He explains there how the curved strokes need to be thicker than the stems in order to look the same and other things, these tricks will enable you to keep your playful shapes, but make the face more balanced and polished. For example, the vertical part of your bowls on bcd need to be thicker to balance the stems.  <br> <br>Also you might have a look at <a href="http://www.myfonts.com/fonts/linotype/itc-tempus/" target="_blank" class="link-external">Tempus</a> and other Grimshaw fonts to see how he is able to make informal faces very balanced but still lively.</p>
