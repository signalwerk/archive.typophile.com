    html: <p>Honestly, these letterforms look completely arbitrary to me. Briem's guide (especially <a href="http://briem.ismennt.is/2/2.3.4a/2.3.4.01.exercise1.htm"> this part</a>), to which William posted a link, is almost the extreme opposite of your project, so I think it can be a good reference. <br> <br>Anyway, if you really really want to go the 'naive' way, I'd suggest you to apply randomness to all details in your font. The accented characters, for example, they shouldn't be the same base character with the diacritics on top of it.</p>
