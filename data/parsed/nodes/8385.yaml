    html: <p>Is this "undesigned" aspect why only two people have offered criticism? I know the face is very rough, but I'm not certain what specifically needs changing. the "a" needs to be a tad thicker on the right of the counter at the top, the "g" as well. The "A" is thick on the left. These I can see (having printed the sample (11pt) also, the bowl of the lc "p" needs to touch the baseline and the x-hight is too much. Agree, disagree? The S needs to be smoother, too, I think.</p>
