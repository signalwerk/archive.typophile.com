    html: "<p>I think the core of this challenge is that it's a roman face with an angled broken vertical stroke of the dollar sign. There are plenty of fonts with a broken stroke on the $, but in all the italics I've looked at, the upper curve is to the right of the tail, as opposed to directly above like the sample here. So it must be a one-of-a-kind design -- I just can't figure out which one. <br> <br>So, a plea for a hint: is it available on MyFonts, Stewf?</p>"
