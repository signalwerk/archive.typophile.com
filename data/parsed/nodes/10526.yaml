  html: "<p>I'm keen to use Cochin as my text face for a book I'm designing. But I've just discovered it has no en dash. It seems to me I have two options: simply use a hyphen instead (ugh) or borrow the en dash of another typeface. Any font seemed to work fine. Since I am not a typographer I figure those are my only two options. Am I right?</p>"
