      <p>I used Photoshop CS2 and got the following:</p>
      <p>(c-100, m-65, y-0, k-30)<br>
      R: 28<br>
      G: 72<br>
      B: 130</p>
      <p>(c-100, m-10, y-0, k-10)<br>
      R: 0<br>
      G: 145<br>
      B: 205</p>
