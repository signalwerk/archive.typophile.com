    html: |-
      <p>Ah, you're right - it's not even close. So an interesting question results: can grading not be properly applied to positive versus negative setting of text? Maybe it can only be properly applied to combat inking variance (like at Font Bureau). I wonder because Montalbano (who's known to be technically quite proficient) probably would have liked to make Clearview's "B" and "W" cuts uniwidth, but maybe thought the spacing compromise was too great*; but Stone <em>does</em> regularly shoot for it**. And Hagmann goes all the way.</p>
      <p>* Although accommodating halation might have been a special factor in Clearview.</p>
      <p>** <a href="http://www.stonetypefoundry.com/halofontspage.html" title="http://www.stonetypefoundry.com/halofontspage.html">http://www.stonetypefoundry.com/halofontspage.html</a></p>
      <p>hhp</p>
