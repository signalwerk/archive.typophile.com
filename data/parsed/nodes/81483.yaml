      <blockquote><p>the consistent metrics across the set of fonts are a requirement for the fonts to qualify as grades.</p></blockquote>
      <p>Makes sense*, but does it have to be across the whole set? For example in Clearview, if there are <em>pairs</em> of fonts (a "B" and a "W") that are slightly different weights as well as being uniwidth**, each pair could be said to form a (minimal) graded system, making the typeface as a whole a set of graded fonts.</p>
      <p>* Although of course it's not a <em>sufficient</em> condition.<br><a href="http://typophile.com/node/100708">http://typophile.com/node/100708</a></p>
      <p>** BTW, do you think "uniwidth" is a good term?</p>
      <p>hhp</p>
