    html: |-
      <p>Some typeface families designed for wayfinding address similar optical issues as <a href="http://www.stonetypefoundry.com/halofontspage.html">Sumner Stone does with his ‘Halo’ fonts</a>, including FF Info, FF Transit, and <a href="http://clearviewhwy.com/WhatIsClearviewHwy/Compare/compareClearview6w_5w.php">Clearview Highway</a>. I don’t know whether their metrics are consistent across the variations – which would be a requirement for qualifying as ‘graded’, no?</p>
      <p>“[…]&nbsp;each of the six weights of ClearviewHwy are available in a positive contrast version (white type) designated as “W”, and negative contrast version (black type) designated as “B”, and have been tailored by optimizing the stoke widths for the viewing application.” — <a href="http://clearviewhwy.com/WhatIsClearviewHwy/SystemAttributes/posNegConVersions.php">clearviewhwy.com</a></p>
      <p>“In FF Info the difference between the various weights (Normal, Book, Medium, Semi-Bold and Bold) has been designed to compensate for this effect. For example, white text set in Book weight on a black background is optically the same as black text set in Medium on a white background. With back-lit signs dark text appears thinner, in which case the Semi-Bold weight would be appropriate.” — <a href="https://www.fontfont.com/fonts/info-display">FontFont</a></p>
      <p>“Front and Back are subtle variations which compensate for the visual distortion that appears on illuminated signs which are either backlit or lit from the front. These variants are also useful for the compensation sometimes required by white text on a black background.” —  <a href="https://www.fontfont.com/fonts/transit-front-negativ">FontFont</a></p>
