    html: <p>Stumbled across this list while I updated my own one. Like Florian mentions, the consistent metrics across the set of fonts are a requirement for the fonts to qualify as grades. As such, neither the Guardian series, nor Lexicon, Ruse, Info, Transit or Clearview are graded sets in the traditional sense. I’d be curious to find more. Until now <a class="freelinking external" href="http://kupferschrift.de/cms/2012/05/multi-axes-families/" rel="nofollow">my list looks almost identical.</a></p>
