    <p>Some fonts have grades. For every weight there is a variation with a very slight bit of added weight to all the strokes. (Not to be confused with <a class="freelinking external" href="http://typophile.com/node/67229" rel="nofollow">optical scaling</a>.)</p>
    <p>These are the graded typefaces I know:</p>
    <p><a class="freelinking external" href="http://www.typography.com/fonts/font_features.php?featureID=54&amp;productLineID=100032" rel="nofollow">Chronicle</a> Text Grade 1<br>
    Chronicle Text Grade 2<br>
    Chronicle Text Grade 3<br>
    Chronicle Text Grade 4</p>
    <p><a class="freelinking external" href="http://www.stonetypefoundry.com/magmaoverview.html#Top" rel="nofollow">Magma</a><br>
    Magma Halo</p>
    <p><a class="freelinking external" href="http://www.typography.com/fonts/font_features.php?featureID=1&amp;productLineID=100017" rel="nofollow">Mercury</a> Text Grade 1<br>
    Mercury Text Grade 2<br>
    Mercury Text Grade 3<br>
    Mercury Text Grade 4</p>
    <p><a class="freelinking external" href="http://www.stonetypefoundry.com/muncoverview.html#Top" rel="nofollow">Munc</a><br>
    Munc Halo</p>
    <p><a class="freelinking external" href="http://www.suitcasetype.com/index.php?lmut=en&amp;part=fonts&amp;font=29&amp;sub=styles" rel="nofollow">Tabac</a> G1<br>
    Tabac G2<br>
    Tabac G3<br>
    Tabac G4</p>
    <p><a class="freelinking external" href="http://www.stonetypefoundry.com/tuffoverview.html#Top" rel="nofollow">Tuff</a><br>
    Tuff Halo<br>
    Tuff School<br>
    Tuff School Halo</p>
    <p>Do you know more typefaces with grades?</p>
