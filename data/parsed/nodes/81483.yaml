    <p>Some fonts have grades. For every weight there is a variation with a very slight bit of added weight to all the strokes. (Not to be confused with <a href="http://typophile.com/node/67229" title="Click to visit an external URL." class="freelink freelink-external freelink-external">optical scaling</a>.)</p>
    <p>These are the graded typefaces I know:</p>
    <p><a href="http://Chronicle" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Chronicle</a> Text Grade 1<br>
    Chronicle Text Grade 2<br>
    Chronicle Text Grade 3<br>
    Chronicle Text Grade 4</p>
    <p><a href="http://www.stonetypefoundry.com/magmaoverview.html#Top" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Magma</a><br>
    Magma Halo</p>
    <p><a href="http://Mercury" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Mercury</a> Text Grade 1<br>
    Mercury Text Grade 2<br>
    Mercury Text Grade 3<br>
    Mercury Text Grade 4</p>
    <p><a href="http://www.stonetypefoundry.com/muncoverview.html#Top" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Munc</a><br>
    Munc Halo</p>
    <p><a href="http://Tabac" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Tabac</a> G1<br>
    Tabac G2<br>
    Tabac G3<br>
    Tabac G4</p>
    <p><a href="http://www.stonetypefoundry.com/tuffoverview.html#Top" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tuff</a><br>
    Tuff Halo<br>
    Tuff School<br>
    Tuff School Halo</p>
    <p>Do you know more typefaces with grades?</p>
