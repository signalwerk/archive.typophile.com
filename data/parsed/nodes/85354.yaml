      <p>Funny isn't it —&nbsp;that you have to be reminded of the wonderful fonts which you have spent hundreds on. I bought Fedra Serif a while back, and I actually really like it for this purpose. I also love Sirba and PF Centro Serif Pro, but I can't justify the expense given that I already have Fedra.</p>
      <p>Thank you all for your wonderful suggestions.</p>
      <p>I'm just messing around with the InDesign file at current — and having compared to magazines such as NewScientist, Time and Newsweek, it all seems that they are set at 7.5 pt. But this seems frighteningly small, even though this figure has been thrown around on the web too after a Google search. Does this sound OK? And I have the leading at 11 pt — this seems right, too. Any suggestions would be appreciated.</p>
      <p>Thanks!</p>
