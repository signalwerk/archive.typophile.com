  html: |-
    <p>Hi guys,</p>
    <p>I am currently in love with the font <a class="freelinking external" href="http://www.typotheque.com/fonts/greta_text" rel="nofollow">Greta Text</a> and would love to use this font for a student magazine. However, everyone else on the team feels it's a bit too serious looking. I disagree, but what can I say. I am basically looking for a serif font that is between Greta Text and <a class="freelinking external" href="http://www.fontshop.com/fontlist/families/ff_tisa/" rel="nofollow">FF Tisa</a> which was deemed <em>too</em> "friendly". </p>
    <p>It's body copy this would be for. Since everyone has suddenly become a typography expert on the team — I think I'll need a couple of suggestions to woo them. I'm basically looking for something between the two — contemporary enough, not too serious, but not as friendly (I don't know where they came up with this!) as FF Tisa. </p>
    <p>Also, each page of the magazine is 210 x 297 mm — if people would have any idea what size in points the body copy should be, along with any line-spacing suggestions, that would be extremely helpful. The magazine is currently at 9.3 pts (I think) Freight Sans, but that's too large in my opinion. I come from a background in web design, so I'm not really experienced enough and don't want to mess it up.</p>
    <p>Thanks for your help.</p>
    <p>Edmund.</p>
