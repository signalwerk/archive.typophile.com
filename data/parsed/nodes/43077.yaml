      <p>Their is a plug-in called ’Better Handles’ <a href="http://www.nineblock.com/products.html" title="http://www.nineblock.com/products.html">http://www.nineblock.com/products.html</a> that allows much more advanced control of handles and I believe will work similar to the precision allowed in Fontlab.</p>
      <p>I preferred Illustrator to draw characters until I realized the subtle distortion and extra time it created in drawing glyphs. </p>
      <p>The other problem is that if you follow Fontlab’s guide to drawing characters in Illustrator with the grid set to match Fontlab’s whole point integer’s, you end up working at such a scale in Illustrator that there isn’t much room to work with more than a few characters without running off the pasteboard, requiring the use of layers or separate Illustrator files.</p>
      <p>It is much easier and efficient to work in Fontlab and use Illustrator occasionally for select elements to assist in the process.</p>
