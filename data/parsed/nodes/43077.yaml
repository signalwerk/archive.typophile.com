    <p>As some of you say they prefer Illustrator to draw their glyphs, and then copy them to fontlab, I just asked myself: Is there a way to handle tangents of the curves in illustrator in a way similar to Fontlab?<br>
    In Fontlab, I can klick on a tangent handle, then moving it with the cursor keys, having very detailed control (sometimes I even count the steps I move a handle, to reach symmetry, similarity to other glyphs, etc.)<br>
    In Illustrator, it seems the only way is to drag the handle with the mouse, so there is no “numeric control” over the handle. There *is* control for points on the curve, you can select them and move them by mouse or keyboard.</p>
    <p>As I use Illustrator as a ... well, illustration tool as well, I’d often wish that I could control the handles in a similar way to fontlab.<br>
    So how do those who draw their glyphs in Illustrator do the detailed systematic fiddle work on their curves? Intuition? A good eye? A secret Illustrator mode I do not know yet?</p>
    <p>Thanks<br>
    Sebastian</p>
