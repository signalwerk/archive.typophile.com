    <p>NY Times actually, lol, I dare you not to read an article titled "A Subway Typeface History" that includes the quote: ..."a battlefield filled with typographers and color-experts locked in mortal combat." Ahhh, the splackle of clashing color swatches and pica rules in the morning.</p>
    <p>Cheers!</p>
