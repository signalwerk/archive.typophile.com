    <p>Hi All,<br>
    This is my first time posting, and I would love some feedback about a few logos I have been working on. The logos are for a new wine bar located in Kennebunk, ME. The typical patron will be the working professional, wine enthusiasts, and the influx of tourists who visit the area every summer. It will be located in an old barn that has been renovated, but still hold the charm and rustic ambiance of the barn. All my client really expressed is that he didn’t want anything with the generic grapes and vines wrapped around the logo. The attached logos are the second round that I will be showing him. I originally showed him about 12 (4 different concepts with three executions). He chose two concepts that he liked, and I have gone back to fine tune them a bit. I would love to hear any comments you have about these, I am at the point now where I need another designer’s eye and am open to all constructive criticism.</p>
    <p>Thanks!</p>
