    date_raw: 30 Oct 2008 — 7:36am
    votes: null
    html: <p>I guess the wine stain is the more successful option, if I have to pick. No offense, but both a wine bottle stain and grapes are the most obvious clichés in the world of wine-related design. Not that you have to totally revamp it, I think they both communicate wine, but I would play with the cliché a bit -- how could these old stand-bys of wine packaging be tweaked to be seen in a new way? I would check out thedieline.com, you can see some of the best new wine packaging in the marketplace. The sans type you're using is close, but not quite right, too. The lower-case "l" in particular is bothersome, it's a bit too modern looking. I would look for something a bit rougher looking, that gives off the feel of 19th and early 20th century metal type.</p>
