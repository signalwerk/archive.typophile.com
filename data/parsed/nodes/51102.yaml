      <p>Thanks for the comments. This is actually for a wine bar and not a label. But thanks for the link! Always love to look at new designs. I hadn't realized that the stain was so cliche, I had done a lot of research on wine bar logos, and hadn't seen anything like that before. Maybe I was looking in the wrong places... I wouldn't like to revamp since I don't think there is enough time. I guess I should probably go back and work with them a little more. I did realize that the grapes have been used a lot before, but I tried to use it in a different way. Trying to make it look like grapes as well as a wine glass. As for the type, I agree with you that it is not quite right. I want to find another one to use with it. any suggestions? </p>
      <p>Thanks again for the comments, and more of them would definitely be appreciated. :)</p>
