  html: |-
    <p>Hello, this is my first post here.<br>
    I would like to have some critique about my tumblr <a href="http://epictype.tumblr.com/">Epic Type</a>. This is personal training for lettering, type drawing and  typographic composition, that is why I need your feedback. I use Inkscape to make this compositions.<br>
    As you can understand, my goal is not to make font families but to create font specimens. Because I'm not ready yet to draw a entire typeface, I made this blog as a training place.<br>
    Please tell me what do you think about it.<br><img src="/sites/default/files/old-images/g4080_6093.png"></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/exquis.png" width="600" height="499" alt="">
