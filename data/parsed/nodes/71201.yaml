      <p>Hm... I'd be willing to be that use of Inkscape may be causing you some problems. </p>
      <p>One thing font software looks for that Inkscape does not are off-point extrema; are you making sure you don't have any? If you aren't, doing so may help you smooth out the a and u. Also, if you ever change your mind and decide to expand this into a full typeface, it would save you a lot of redrawing trouble.</p>
