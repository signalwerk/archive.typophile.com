    html: <p>«g» «o» and «ul» are not so bad, but «a» is need really lot of changes. You need to draw better intersections between verticals strokes and curbes. You try to vectorial drawing reflect the letterforms that you thinked. With a little perseverance you can get to draw from a to z and go gradually improving the leterforms. Keep going.</p>
