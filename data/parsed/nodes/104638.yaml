    <p>Have definite plans to add .SVG sooner in webfonts development categories sooner..</p>
    <p>Cheers n Regards<br>
    Novotype - WebFonts Unleashed<br>
    E : <a href="mailto:fonts@novotype.asia">fonts@novotype.asia</a></p>
