      <p>I isolated the letters of the type in the linked image in Photoshop and saved them back as a JPG.  Then using teh "WhatTheFont" tool at MyFonts.com, I found one font with four possible weights/variants for it:</p>
      <p>1. <a href="http://new.myfonts.com/fonts/efscangraphic/harlow-sh/solid-regular/" title="http://new.myfonts.com/fonts/efscangraphic/harlow-sh/solid-regular/">http://new.myfonts.com/fonts/efscangraphic/harlow-sh/solid-regular/</a> - Harlow Solid SH Regular<br>
      2. <a href="http://new.myfonts.com/fonts/imageclub/harlow/solid/" title="http://new.myfonts.com/fonts/imageclub/harlow/solid/">http://new.myfonts.com/fonts/imageclub/harlow/solid/</a> - Harlow ICG Solid<br>
      3. <a href="http://new.myfonts.com/fonts/linotype/harlow/solid/" title="http://new.myfonts.com/fonts/linotype/harlow/solid/">http://new.myfonts.com/fonts/linotype/harlow/solid/</a> - Harlow Solid<br>
      4. <a href="http://new.myfonts.com/fonts/agfa/harlow/solid-plain/" title="http://new.myfonts.com/fonts/agfa/harlow/solid-plain/">http://new.myfonts.com/fonts/agfa/harlow/solid-plain/</a> - Harlow Solid Plain</p>
      <p>From what I can see, they're a pretty close fit.  Unfortunately, they're not a exact fit since the image's font has a very clean cut to the edges and ends of the letters while Harlow is very rounded.</p>
      <p>Maybe someone else can find a better match.  :)</p>
      <p>Edit: Looks like Mark and I found the same thing.  Though comparing the two, Harlow's rounded while the original's font isn't.</p>
