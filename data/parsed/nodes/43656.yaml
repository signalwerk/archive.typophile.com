    <p>[First in bad english, in spanish bellow]</p>
    <p>Hello everybody<br>
    I would like to know how to make a good kerning work. It exists some method to make it with order and diffuseness?<br>
    In addition, my language (Spanish) includes difficult pairs, or at least not including within test texts: ¿T, íl, fí, ¡J, etc...<br>
    Thank you again.<br>
    Kinds Regards.</p>
    <p>Juan Pablo</p>
    <p>††††††††††††††††††††††††††††††††††††††††††††††††††††††††††</p>
    <p>¿Cómo andan?<br>
    Me gustaría saber de qué forma realizan el trabajo de kerning. ¿Existe algún método para hacerlo con orden y prolijidad?<br>
    Además el idioma español incluye pares dificiles, o al menos no incluidos dentro de los típicos textos de prueba: ¿T, íl, fí, ¡J, etc...<br>
    Agradezco por adelantado.<br>
    Saludos a todos.</p>
    <p>Juan Pablo</p>
