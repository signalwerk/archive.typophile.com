  html: |-
    <p>hello</p>
    <p>I'm beggining to design my websites, by my own hands (writing code) and I would like to know your experience on how can I improve my typesetting on the web.</p>
    <p>you can take a look on my first design on progress at elecronicq.info/blog</p>
    <p>I'm using Anonymous Pro, linked from google fonts (please note that i'm having some issues on firefox*...<br>
    at first, I know I'm using a monospace font but I would like to know your opinion on how to improve readability on large blocks of text. using css?.. or?..<br>
    this is my electronic media project, but soon I'll work on my letterpress project (I own a heidelberg windmill) you can take a look on the web sketch at cargocollective.com/leftoverprints </p>
    <p>take care and thanks in advance for your words! :) </p>
    <p>*for some reason it's displaying the default monospace on your system. if anyone knows how to solve this, please let me know!</p>
