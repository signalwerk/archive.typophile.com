      <p>Welcome to the dark side.</p>
      <p>Since I'm not much of a type <em>user</em> (I just make the stuff) I myself<br>
      can't be too helpful in terms of how to leverage particular fonts, but<br>
      what I would offer is what might be the single most useful "big secret"<br>
      of typefaces: a font's color (meaning weight), spacing and vertical<br>
      proportions* are intertwined (which means they have to be balanced**)<br>
      and where a font lies on this spectrum determines its ideal point size.</p>
      <p>* Mostly the relative size of its x-height.</p>
      <p>** This is why -contrary to what some will have you believe- some<br>
      fonts are better than others, and some fonts are just plain lousy.</p>
      <p>hhp</p>
