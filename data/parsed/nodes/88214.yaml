      <p>&gt;What's a good way to find the typeface in different uses???<br>
      In addition to going into book stores, looking at magazines, newspapers, ads, web sites, etc., you can check out <a href="http://fontsinuse.com/" title="http://fontsinuse.com/">http://fontsinuse.com/</a>.</p>
      <p>Also in addition to experimenting on your own, you can follow discussions on Typophile. But do check out the work of those posting, and see if you like it, and take that into account in assessing their comments. Also you can ask specific questions about specific faces—that is likely to get more useful responses, I think.</p>
