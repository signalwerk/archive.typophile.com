    <p>Hey everyone,</p>
    <p>I'm a fairly experienced designer who has recently fallen in love with typography. I'm not sure why it took me so long - but I figure it's better late than never. As a result, I've started to carefully select and purchase a few typefaces that have caught my eye.</p>
    <p>What I'm wondering is - how to recommend really mastering a typeface (is that possible?).  What I mean is, if you have a typeface like HF&amp;J Requiem - what are the best ways to educate yourself to fully maximize it's potential?</p>
    <p>I've thought about gathering different images that use Requiem - but I'm not quite sure how to go about this. Is there a resource available for this that I'm not aware of? I'd love to see how other designers have used it - what works... what doesn't... what fonts can potentially be paired with it.  What types of applications it could be used for?</p>
    <p>Requiem is just one example.  There are about five typefaces that I'd like to take this focus on.</p>
    <p>Any thoughts or suggestions would be deeply appreciated.</p>
    <p>Thanks!</p>
    <p>Jason</p>
