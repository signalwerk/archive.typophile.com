      <p>A nice exercise we did in school:</p>
      <p>Print out 5 arbitrary glyphs from a given typeface. Examine these glyphs closely. Then try and draw some of the missing glyphs (without referencing the font file on your computer).</p>
      <p>This helps you understand the structure of the typeface, and it's quite fun to see how different (and often awkward) your solution is compared to the original.</p>
      <p>Hopefully this will help you understand how the design of the typeface lends itself to certain settings. </p>
      <p>And if you have the scratch: go to <a href="http://www.typecamp.org" title="www.typecamp.org">www.typecamp.org</a></p>
