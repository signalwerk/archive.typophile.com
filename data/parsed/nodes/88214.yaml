      <p>While there may not be set pieces, like scored music which may be performed with specific instruments, it’s nonetheless possible to execute the classic layout formats of various genres, in combinations of different typefaces.</p>
      <p>But where can you do this with a real purpose?</p>
      <p>Why not start a web site at which to carry out your exploration, and document it?</p>
      <p>As a type designer, I certainly get to know the types I’m designing (if they’re retail and I’m working from scratch, not commissioned for a specific project which acts as a testing ground), by making specimen banners for MyFonts, and PDF specimen “books”, some with <em>faux</em> specimens of ads, posters, packaging &amp;c. But you would have the advantage of being able to mix several faces in one piece, rather than just use one typeface at a time, which is the norm for type specimens </p>
      <p>Emigre has produced specimens which involve combinations of their fonts -- most notably starting with <em>Emigre</em> magazine twenty years ago. And Typotheque has sample layouts, an advanced form of type tester harking back to some of the old Linotype manuals.</p>
