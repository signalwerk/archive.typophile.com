      <p>The difference are pretty obvious if you check out these examples:</p>
      <p><a href="http://www.myfonts.com/fonts/urw/grotesk/" title="http://www.myfonts.com/fonts/urw/grotesk/">http://www.myfonts.com/fonts/urw/grotesk/</a></p>
      <p><a href="http://www.myfonts.com/search?search%5Btext%5D=akzidenz+grotesk" title="http://www.myfonts.com/search?search%5Btext%5D=akzidenz+grotesk">http://www.myfonts.com/search?search%5Btext%5D=akzidenz+grotesk</a></p>
      <p>I personally prefer Akzidenz, but A. That's just me, and B. If the ID manuals suggest URW, yu might need to go with that.</p>
      <p>Minion and Caslon could both work with either, but you should pick one and stick with it.</p>
      <p>Minion is more clean and modern looking than Caslon, so that could factor in your decision.</p>
