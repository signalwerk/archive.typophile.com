    <p>I've been working at my current job since Feb, the identity manuals we have suggest URW Grotesk as the typeface. Previous to working here, I had heard about Akzidenz Grotesk and am wondering what the differences/similarites are. Which do you prefer?</p>
    <p>Also, I have paired URW Grotesk with Minion or Caslon (not URW Antiqua, I do not like that face). Is there a better option? Also are there display faces you might recommend paring with them? I want to have some opinions and options before purchasing more of the URW Grotesk family.</p>
    <p>Thanks for your help!</p>
    <p>jessi.long</p>
