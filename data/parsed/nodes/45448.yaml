      <p>It seems pretty clear to me: taxpayers give money to the government, the goverment gives money to the University of Reading, Reading gives money to a type designer, who goes to work at Monotype, and folk in the typography department at Reading provide input and advice on the work...</p>
      <p>All with the aim of teaching Monotype how to make digital versions of their old typefaces that don't look like crap. One might say that it's about time.</p>
