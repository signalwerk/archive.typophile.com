  html: |-
    <p><a class="freelinking external" href="http://www.reading.ac.uk/about/about-listjobs.asp?url=http://www.info.rdg.ac.uk/newjobs/details.asp?RefernceNumber=RMT1/" rel="nofollow">This</a> just went online. Details on the link; this is the important bit: </p>
    <p><cite><br>
    An exciting and challenging Knowledge Transfer Partnership has been established between the University of Reading's School of Arts &amp; Communication Design and Monotype Imaging Ltd.</cite></p>
    <p>The 24-month project aims to utilise academic expertise to recapture know-how embedded in Monotype's library drawings for legacy technologies, and formulate a testing and development process to generate new, extended character set typefaces. Building on the recognised quality of Monotype's library new, multi-script typeface families will be developed during the project. The role will be based at Monotype in Redhill, Surrey. </p>
    <p>You will have a BA 2.1 or above or a MA in Typography or related field with experience in digitising and testing typefaces. You will have some experience of developing extended character set typefaces, and preferably some experience with non-Latin typeface design. You will be proficient in Fontlab, with demonstrable experience of developing OpenType fonts. You will have strong research and documentation skills, and good communication skills. You will be organised, meticulous, and a good collaborator.<br>
    </p>
