    date_raw: 17 May 2008 — 6:16pm
    votes: null
    html: |-
      <p>Indeed this is an abbreviated  description. No students are involved, although I suspect that graduates may apply. </p>
      <p>The scheme is part-funded by the company, part by the UK Technology Transfer Board. The University employs the designer, who gets seconded to the company, and provides the academics' time for contribution. The day-to-day reality looks very much like the person is employed by the company, but with close contribution by the academics involved. </p>
      <p>The objective is to enable companies to capitalise on expertise in UK universities for strategic benefits. The scheme has been very successful, but this is the first such project focused on typography (full details <a class="freelinking external" href="http://www.ktponline.org.uk/default.aspx" rel="nofollow">here</a>).</p>
