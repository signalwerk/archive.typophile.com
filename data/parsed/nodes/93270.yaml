      <p>Quoted from an <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/16233/" rel="nofollow">old thread at MF</a> about the same logo:</p>
      <blockquote><p>Originally quoted from <a href="http://www.artofjamesbond.com/concept.htm" title="http://www.artofjamesbond.com/concept.htm">http://www.artofjamesbond.com/concept.htm</a><br>
      The ‘007’ logo was devised by Joseph Caroff and first appears on the US posters in the familiar format that uses the ‘7’ to form the handle of a pistol. The UK posters used a variation of the old Pan Books logo and the Caroff version did not appear in Britain until it was used on the quad poster for On Her Majesty’s Secret Service in 1969. Caroff’s 007 logo quickly became one of the most instantly recognisable trademarks of the series and appeared in many variations in the campaigns that followed.</p></blockquote>
      <p>So apparently not a font but a custom woodmark. Anyway, you can reproduce it using <a class="freelinking external" href="http://www.dafont.com/007-goldeneye.font" rel="nofollow">007 Golden Eye</a> font by Filmhimmel.</p>
