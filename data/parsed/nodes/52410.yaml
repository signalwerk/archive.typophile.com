    <p>Hi all,</p>
    <p>I’ve been banging away turning <a href="http://www.typophile.com/node/51521">what started as a harmless diversion</a> into a working typeface. This is my first script type, so it took some doing getting high/low joins and alts. At the moment I’m fleshing out the uppercase which is trickier than I expected. </p>
    <p>Here are some talking points:</p>
    <p>• I’m thinking of calling it Moped Script. Thoughts?<br>
    • I have alts that create a non-looped version. Should loops be default, or straight?<br>
    • Occasionally loops crash into neighbors. I don’t want to add letterspacing. What do you think of the contextual alts in these cases? (I like the descenders, but not ascenders)<br>
    • Should I make the caps work in all cap setting? Is it important that they physically connect to the lowercase<br>
    • Any other thoughts or ideas that could make this better?</p>
    <p></p><div class="imageWrap"><img src="/files/moped_5504.gif"></div><p></p>
    <p>Cheers,<br>
    Randy</p>
