    html: |-
      <p>Randy! I’m glad you took my advice. I’ll take credit for it, even tho all I did was complain that you don’t release enough. It looks beautiful.</p>
      <p>&gt; • I’m thinking of calling it Moped Script. Thoughts?</p>
      <p>Perfect</p>
      <p>&gt; • I have alts that create a non-looped version. Should loops be default, or straight?</p>
      <p>Straight. Loops in the Swash or salt slots. No connectors is Moped Sans.</p>
      <p>&gt; • Occasionally loops crash into neighbors. </p>
      <p>calt or ligs.</p>
      <p>&gt; • Should I make the caps work in all cap setting? Is it important that they physically connect to the lowercase</p>
      <p>Not if there is a Moped Sans</p>
      <p>&gt; • Any other thoughts or ideas that could make this better?</p>
      <p>Add a light weight. I think there is enough character in the bones of this thing that you won’t lose much when the stroke is thinner.</p>
