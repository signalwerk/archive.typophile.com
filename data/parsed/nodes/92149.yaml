  - id: 506093
    user: 8393
    date: 2012-04-18T01:33:00
    date_raw: 18 Apr 2012 — 1:33am
    votes: null
    html: |-
      <p>Thank you all for your input ...</p>
      <p>@Bert : its a font for a graphicdesign studio of me and my friends. We will just use it for the logotype and for headlines on the business cards, billings and on the website etc. Thats why I started with the extrablack. Normaly I start with the regular style. But we are not sure if we really need it. So I decided to do the extrablack first, because we have a "deadline". If I have have more time I will finish the rest of the font.</p>
      <p>It looks really close too National even if it wasnt a font I looked especially on while designing the glyphs. And like Penn said before it altough looks a bit like Maple and Supria. I think you can not make font in this direction (Helvetica lookalike) without finding similarities to other already excisting. Every of these fonts is really beautiful but every font has something negligibe that we didnt like much. National for example has an ugly italic (in my opinion).</p>
      <p>Actually I looked a bit at Franklin Gothic and Optima while designing. Thats how my font got the irregular thick stems like you can see best in the A.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_007_6473.jpg"></div><p></p>
      <p>@ penn : I first wanted to complete the diacritics in their overall look. After I put them over each glyph via components I decompose the letters and change them with consideration in the particular letter. For example the "A" has slighly bolder and twisted accent grave than the "a". And the circumflex on the "a" is wider than on the "i".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_008_4988.jpg"></div><p></p>
      <p>@ eliason : I changed the bowl/stem on b again. Maybe you like the new version on the right side more!?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_006_4653.jpg"></div><p></p>
      <p>Thank you all for your help.</p>
      <p>kind regards, steven</p>
    html_clean: |-
