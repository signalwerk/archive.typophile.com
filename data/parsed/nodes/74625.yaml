    html: |-
      <p>I'm confused ;-) If the pdf document uses The Sans Office and some graphic designer must continue designing the magazine and the font files aren't available, could he use The Sans or should he buy The Sans Office also? </p>
      <p>As I understand it it is just a regular The Sans, but slightly adapted (not in appearance!) to make it work in Microsoft Office better? The designer can use just the regular The Sans in Indesign?</p>
