    <p>In the eternal quest to save greenbacks I'd like to find a room-mate at the Sonesta* for Thursday, July 7 (when I'll be arriving after midnight actually) to Monday, July 11 (let me know if you plan on leaving on the Sunday instead). The last time I roomed with anybody was TypeCon-SF in 2004, and although that worked out super I hope you'll understand that I would give preference to people I've actually met, and second to people who I've got to know online.</p>
    <p>* I spent a good deal of time looking around and<br>
    nothing strikes nearly as good a balance in terms<br>
    of cost and convenience.</p>
    <p>If you're interested please email me: hpapazian at gmail dot com.</p>
    <p>Fingers crossed...</p>
    <p>hhp</p>
