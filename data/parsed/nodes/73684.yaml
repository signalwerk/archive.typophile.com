      <p>Not sure if you want/need any more suggestions, but how about Graphik maybe: <a href="http://commercialtype.com/typefaces/graphik" title="http://commercialtype.com/typefaces/graphik">http://commercialtype.com/typefaces/graphik</a></p>
      <p>Or if you want something that's actually Swiss, Replica might be interesting too (it's a bit fresher than Akkurat, and I think less frequently used too):<br>
      <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Replica/" title="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Replica/">http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Replica/</a></p>
      <p>More classic/closer to what you had with ARS Maquette:<br>
      Theinhardt from Optimo (also a Swiss foundry)<br>
      <a href="http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=22" title="http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=22">http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=22</a></p>
      <p>You might also want to look through this list over at FontShop:<br>
