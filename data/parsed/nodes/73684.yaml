  html: |-
    <p>Greetings Folks,<br>
    I'm looking for a suggestion for a modernist typeface or two to use for a mid-century, Europeanish card game...something slightly swiss and a bit serious.<br>
    I know the usual suspects, but I've been looking at some wildcards: FF BAU, Akkurat, DIN ROUNDED, FOUNDERS GROT, and ROUTER (which would really soften up the look and lower the age group).</p>
    <p>Any wild and crazy suggestions?</p>
