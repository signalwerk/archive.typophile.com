    votes: null
    html: <p>Sergio, <br> <br>I wonder what this might look like, if you combined Grandes and Casas onto the same line (about the same size as Prefabricadas, but emphasized through color only vs. size+color), then juxtapositioned the logotype with the graphic mark, and possibly even broke through the rectangle of the graphic with some of those horizontal lines. This would make a much less tidy design, which might not imply prefab as well, but it might be worth exploring. <br> <br>Aloha! <br>Scott</p>
