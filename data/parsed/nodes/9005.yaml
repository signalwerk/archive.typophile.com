    html: <p>Hi, I really like your logo, and i presume you're brazilian just like me. I just think that the clear lines are just too clear... It's beggining to lose the limits of the square. I checked the colors, and it seems that in CMYK, they are below or around 10 %, which is a huge problem if you intend to print it in newspapers, photocopies, fax. And I agree about the gaps. <br> <br>Daniel</p>
