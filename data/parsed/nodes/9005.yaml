  html: <p>hi folks, I would like to show my last work, it's a logotype for a company of prefabricated wooden house. <br>company's name was a problem, it's too long "grandes casas prefabricadas", means big  prefabricated houses. <br> <br>crits welcome.<img src="http://www.typophile.com/forums/messages/29/64399.jpg" alt=""></p>
