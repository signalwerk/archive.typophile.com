    date_raw: 1 Feb 2005 — 5:25am
    date: 2005-02-01T05:25:00
    votes: null
    html: <p>Sergio, you fall into the trap that I see designers posting here often do. Why does all type have to flush left and right?. First thing I would do is find the smallest size you will ever use the mark and make that work. Then I would do the same thing with the largest use. I would also make it work in black and white first. I'm not in love with 3 sizes of type. I would tend to make Casas dominate and make Grandes and Prefabricadas the same size. Just some thoughts</p>
  - id: 58808
    user_id: 2172
    user_name: Chris Rugen
    user_path: null
    user_image: /files/pictures/picture-2172.gif
    date_raw: 1 Feb 2005 — 6:37am
    date: 2005-02-01T06:37:00
    votes: null
    html: "<p>Generally, I like the logo. It's visually striking and shows some sophistication. <br> <br>I agree with Daniel about the type not needing to align like that, but if 'grandes casas' is what you want to emphasize, then it's not a big deal. I understand the desire to have a strong rectangular 'notional space' for the logo. However, 'prefabricadas' does start to lump up and become hard to read at that size.Though, I'm sure that's a hard problem to avoid at small sizes. <br> <br>The kerning needs work. 'Casas' has gaps like this: CA SA S and 'prefabricadas' has a gap like this PREF ABRICADAS. These should be fixed.</p>"
  - id: 58809
    user_id: 2236
