      <p><img src="http://www.graphicdeclaration.com/images/canadianflag_remix_fv.jpg"></p>
      <p>Beefed up the line work, developed the feet into my usual foot ware interp, tweaked this and tweaked that. Image size on tees will be about 7 1/4" wide by 6" high on your garden variety lg male., and available in any many colors.</p>
      <p>Today I received my Krink K-66 Steel Tip Paint Markers (w00t!!) - should have the poster camera ready by the end of the weekend :) ... !!!</p>
      <p>'I love deadlines. I like the whooshing sound they make as they fly by.'<br>
      (Douglas Adams)</p>
