    <p>If you should collect a visual documentation of the different forms of writings, would you keep separated the writing ones (calligraphy/lettering/handwriting, epigraphy, signage, graffiti) and the typographic ones (printed pages, typeface showings)?</p>
    <p>I know, very likely it depends on how you will access and use the material, but I am undecided since I'm unsure at which degree I would differentiate various forms of of writing.</p>
