    html: |-
      <p>Thanks Tiffany, but I was not thinking of "type classification". I rate "script-like alphabets" born in the realm of type design as a sub-genre of the latter. I was thinking about an archive of scripts meaning scriptures, how the forms evolved and mutated along history. For Latin, but not only Latin.</p>
      <p>My question was on whether it would make more sense to keep the more recent typographic forms (last 500 years) from the other forms of writing, which nonetheless are constantly renewing outside the typographic form (see for example tag writing in graffiti, which started in the US but became a kind of exposed writing all over the world…)</p>
