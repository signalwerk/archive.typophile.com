    <p>First Iteration, </p><div class="imageWrap"><img src="http://typophile.com/files/typophile_5710.jpg"></div><p></p>
    <p>This is the first try-out for the brand communication of "yello", ....bright &amp; warm :)<br>
    The idea is to portray the word as a single syllable rather than a color (metaphorically ie)<br>
    The target audience is "middle-class .. mobile device users aged from 18 onwards", The usp<br>
    of this brand is to celebrate one of the oldest &amp; the most used art-form known to man: Speech.</p>
    <p>Please do review the two variations</p>
    <p>PS: this might be insensitive to the minorities ( the mute ), .but I'll be considering them too once the first bit kicks off, ..</p>
    <p>thanks in adavnce<br>
    -Dhyani</p>
