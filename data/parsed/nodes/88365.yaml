    html: |-
      <p>Mr is right, what the logo needs to pull it together is an encapsulating graphic, the speech bubble idea would work well. </p>
      <p>Even thought the the font style is right it just needs refining.</p>
      <p>Be careful with the y at the beginning of the word, as the descender tends to move your eye away from the word. In this case an upper case y could work better, Try moving lifting the letter up and reforming the stroke junction back down closer to the baseline. </p>
      <p>I agree with the  comments about the l's, try clipping the tops slightly as they do tend to break up the word.</p>
