      <p>I think you got the feeling in it, it just needs refinement. The 2nd Looks very friendly and warm. The sharp bit on the y on the first logo doesn't fit in with the friendliness of the rest. </p>
      <p>In both versions the y is far too wide. The o looks a bit slanted to the right. 'Bright &amp; warm' needs a different typeface and a larger size. A simple, clean typeface, with an open ampersand. The tails on the two l's could be a bit larger/longer IMO.</p>
      <p>Cheers!</p>
