    <p>Need a help with OT code :)</p>
    <p>Have two versions of ligatures, s_t, and s_t.salt for example.</p>
    <p>I write code</p>
    <p>feature dlig { # or liga<br>
      sub s t by s_t;<br>
    } dlig;</p>
    <p>feature salt {<br>
      sub s_t by s_t.salt;<br>
    } salt;</p>
    <p>with this code replacing of s_t not work when I turn on both features.</p>
    <p>Maybe someone known how to do?</p>
    <p>Thanks in advance!</p>
