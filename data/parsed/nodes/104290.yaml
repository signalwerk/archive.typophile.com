      <p>The characters used were indeed not touched by the "ban" which concerned only a limited portion of the areas namely (from the last lines of <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" rel="nofollow">NamesList.txt</a>)</p>
      <pre>@@	FFF80	Supplementary Private Use Area-A	FFFFF
      @@	10FF80	Supplementary Private Use Area-B	10FFFF
      </pre><p>I am afraid I was also misled by the meaning I was giving to the word "private" (that has a completely different meaning in cryptography).</p>
