      <p>Concerning the original question, I suggest having a look at <a href="https://www.typotheque.com/articles/opentype_features_in_web_browsers" rel="nofollow">Opentype features in web browsers</a> by Gustavo Ferreira on typotheque. There is a <a href="https://www.typotheque.com/articles/opentype_features_in_web_browsers_-_tests" rel="nofollow">series of tests</a>, and in particular for <a href="https://www.typotheque.com/articles/opentype_features_in_web_browsers_-_tests#liga" rel="nofollow">liga</a>, standard ligatures. Unfortunately, the syntax varies from browser to browser. I managed to get the ligatures working with Chrome on Mac OS X 10.8 (with a webkit font) with the following settings (a list copied from the site so as to cover most browsers and situations)</p>
      <pre>font-feature-settings: "liga" on;   
      /* vendor-prefixes */
      -moz-font-feature-settings: 'liga=1';
      -ms-font-feature-settings: "liga" on;
      -webkit-font-feature-settings: "liga" on;
      -o-font-feature-settings: "liga" on;
      </pre><p>and Chrome even accepted those weird ligatures I imagined as some kind of test after reading the initial post:</p>
      <pre>lookup ligaStandardLigaturesinLatinloo {
        lookupflag 0;
          sub \A \B  by \C;
          sub \uF0987 \u100987  by \Z;
      } ligaStandardLigaturesinLatinloo;

      feature liga {
        script DFLT;
           language dflt ;
            lookup ligaStandardLigaturesinLatinloo;
        script latn;
           language dflt ;
            lookup ligaStandardLigaturesinLatinloo;
      } liga;
      </pre><p>The font was made with FontForge (with the graphic interface) and the above feature file is the output from FontForge (and such a feature file can also be used in FontForge with Merge feature file; I prefer using feature files for contextual ligatures and alternates but for liga, the graphic interface works comfortably). As a conclusion, ligatures are not automatic, and also Chrome does not reject disallowed input (I am not sure I like that).</p>
      <p>All that being said, I must confess I am also puzzled by the original post. Concerning the letter uni0451, it is normally obtained using a keyboard by first typing a key corresponding to dieresis, and then the key corresponding to uni0435; the final effect is that a single character is entered into the text, and it is uni0451. There is no need of a feature file for that, the keyboard layout sends the right character, uni0451, to the text editor. Everything works fine as long as those three characters are in the font (and you have the appropriate keyboard).</p>
