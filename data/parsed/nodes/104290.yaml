      <p>I believe the dieresis at U+00A8 is what most of us think of as a "legacy" dieresis. It originated back when only the first 127 characters of ASCII were fixed. In many 8-bit ASCII encodings, there was a dieresis at A8. </p>
      <p>It should live on only for the proper reading of older texts, before Unicode. (Unless there is any need for a spacing modifier dieresis, as I don't believe Unicode has one.) Any new use as a  combining diacritical should be U+0308. </p>
      <p>Having said that, most font designer's don't bother with including <strong>any</strong> of the combining diacritics, which makes their fonts not proper Unicode.</p>
