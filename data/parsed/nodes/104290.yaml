  html: |-
    <p>The problem:<br>
    I want sequence of U+0435 (CYRILLIC SMALL LETTER IE, name "uni0435") and U+00A8 (name "dieresis") chars to be substituted by U+0451 (CYRILLIC SMALL LETTER IO, name "uni0451") char.<br>
    I want sequence of U+F0987 (Supplementary Private Use Area, name "uF0987") and U+100987 (Supplementary Private Use Area, name "u100987") chars to be substituted by "myglyph1" glyph ("myglyph1" has no Unicode position).<br>
    I want sequence of U+F0986 (Supplementary Private Use Area, name "uF0986") and U+100986 (Supplementary Private Use Area, name "u100986") chars to be substituted by "myglyph2" glyph ("myglyph2" has no Unicode position).<br>
    I want sequence of "uni0451", "myglyph1" and "myglyph2" glyphs to be substituted by "myglyph3" glyph ("myglyph3" has no Unicode position).</p>
    <p>So that if I have uni0435 + uni00A8 + uniF0987 + uni100987 + uniF0986 + uni100986 sequence, I want it all to be substituted by "myglyph3" glyph.</p>
    <p>I thought about this kind of opentype code:</p>
    <p><code><br>
    languagesystem DFLT dflt;<br>
    languagesystem cyrl dflt;<br>
    languagesystem latn dflt;<br>
    feature ccmp { # Glyph Composition / Decomposition<br>
     # DEFAULT<br>
    lookup ccmp0 {<br>
        sub uni0435 dieresis by uni0451;<br>
        sub uF0987 u100987 by myglyph1;<br>
        sub uF0986 u100986 by myglyph2;<br>
        sub uni0451 myglyph1 myglyph2 by myglyph3;<br>
    } ccmp0;<br>
     script cyrl; # Cyrillic<br>
    lookup ccmp0;<br>
     script latn; # Latin<br>
    lookup ccmp0;<br>
    } ccmp;<br>
    </code><br>
    (or feature "dlig")</p>
    <p>and MS VOLT lookup source:</p>
    <p><code><br>
    DEF_LOOKUP "l002" PROCESS_BASE PROCESS_MARKS ALL DIRECTION LTR<br>
    IN_CONTEXT<br>
    END_CONTEXT<br>
    AS_SUBSTITUTION<br>
    SUB GLYPH "uni0435" GLYPH "dieresis"<br>
    WITH GLYPH "uni0451"<br>
    END_SUB<br>
    SUB GLYPH "uF0987" GLYPH "u100987"<br>
    WITH GLYPH "myglyph1"<br>
    END_SUB<br>
    SUB GLYPH "uF0986" GLYPH "u100986"<br>
    WITH GLYPH "myglyph2"<br>
    END_SUB<br>
    SUB GLYPH "uni0451" GLYPH "myglyph1" GLYPH "myglyph2"<br>
    WITH GLYPH "myglyph3"<br>
    END_SUB<br>
    END_SUBSTITUTION<br>
    END<br>
    </code></p>
    <p>and I tried to ship font using MS VOLT, but this compiled feature becomes unavailable in Chrome browser (Firefox is OK, I didn't test IE10). How can I solve the problem with Microsoft VOLT or FontLab?</p>
