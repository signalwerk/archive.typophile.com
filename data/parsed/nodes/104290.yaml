      <p>Michel: Look at the codepoints that comment is applied to more carefully. That comment is applied to explicitly unassigned blocks which are never supposed to be used. It is NOT applied to the three Private Use Area code blocks. At least, that's how I read it. As the characters under discussion are in PUA, and not in any of these reserved non-character blocks, I don't see how this is relevant.</p>
      <p>Examples of reserved non-characters: FDDO, 2FF80-2FFFF, EFF80-EFFFF....</p>
      <p>The three PUA blocks:</p>
      <p>U+E000..U+F8FF (though some of these have been used for Variation Selectors and other oddities)<br>
      U+F0000..U+FFFFD (Supplemental Private Use Area A)<br>
      U+100000..U+10FFFD (Supplemental Private Use Area B)</p>
