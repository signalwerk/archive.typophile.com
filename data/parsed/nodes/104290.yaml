      <p>@Thomas,</p>
      <p>I agree it's "stupid" ("not the sharpest knife in the drawer" is gentler, maybe?), but I'll stick with it not being proper Unicode, for the following reason. Remember, the consortium put their foot down on assigning any more codepoints to accented characters. IIRC, at that time, they allowed they'd never intended to give so many accented characters codepoints anyway, such characters were <strong>suppose</strong> to be constructed using base characters and combining diacritics.</p>
