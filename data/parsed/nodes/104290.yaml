      <p>Ah! I see.</p>
      <p>Yes, in Unicode the "Private Use Areas" are special zones for people to use the character codes for basically whatever they want. Apps are generally expected to be able to handle and process PUA characters. They are not unusual in the field—particularly the first Private Use Area in the Basic Multilingual Plane has been used pretty extensively....</p>
