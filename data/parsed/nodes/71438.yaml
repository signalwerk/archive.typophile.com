      <p>"Arno", a lengthy post about FLS's font naming interface in a discussion about FOG made me assume that you imply a relevance for FOG too.<br>
      As to different categories of font editors: Category I font editors serve to draw and generate fonts. Import/export of a binary font involves interpretation so that a font is not necessarily "the same" in terms of data before import and after export (FM, FOG, FLS). Category II font editors serve to edit fonts and keep binary fonts intact. Open/save of a binary font and changing individual bits does not affect the rest of the font (TTX, OTM). Add a "more or less" to each of the preceding sentences.</p>
