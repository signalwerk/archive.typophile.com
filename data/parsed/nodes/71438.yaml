      <p>G T, </p>
      <p>neither Fontographer nor FontLab Studio are perfect clones of anything, but I would say that Fontographer is closer to Freehand and FontLab Studio is closer to Illustrator. But FontLab Studio's drawing tools have also been heavily inspired by Fontographer (to ease the transition). In general, Fontographer is simpler in the sense that there is practically one way to draw, while in FontLab Studio there are numerous ways. </p>
      <p>I would say that the best method is to download demo versions of both applications (available from <a href="http://www.fontlab.com" title="http://www.fontlab.com">http://www.fontlab.com</a> ) and give them both a try. </p>
      <p>Best,<br>
      Adam</p>
