    html: |-
      <p>@ Karsten</p>
      <p>The name table editor, that is integrated in FLS, is not only useful, if you want to import and edit an existing font. In FLS you have the option "Export only OpenType name records - ignore default names". This option in combination with the name table editor is very useful. And all I wanted to say, was, that more people would use the name table editor, if the required records would be marked by a color and if the panel would be higher and the scrollable list longer.</p>
      <p>If Nick wishes, that FLS is getting the same panel as Fontographer, he indicates, that it is harder to name a font with FLS. But the reason are not primary cryptical terms, but the different handling of the font formats and the bugs in FLS. The Fontographer panel looks more straightened up, which is an improvement, yes. But if you have a look at the dumped name and CFF table, you may wonder, why the terms from the OT specification shall be less clear than the fantasy terms, that the Fontlab developers have used.</p>
      <p>There is often a need for correcting something with TTX. But if the terms, that the editor uses, are different from the terms, that you find in the specification, it is harder to keep the overview.</p>
