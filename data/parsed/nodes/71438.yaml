      <p>Fontographer will exist in parallel to FontLab Studio/TypeTool line. While it can be considered a "middle" product, its target audience is different. </p>
      <p>Fontographer is a full-scale font editor for those who want to draw, not engineer fonts. TypeTool can be considered an entry point into FontLab Studio, which will always be a top-line tool for those who make fonts for living :)</p>
      <p>With Fog5 release and its support for VFB font data format, it can be easily integrated into FontLab Studio-based workflow, as a "drawing tool".</p>
