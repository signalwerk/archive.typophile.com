    html: |-
      <p>As Yuri says: we consider Fontographer 5 as an "alternative UI" over FontLab Studio. Both editors are full-scale font editors, with the following difference:<br>
      * FontLab Studio allows precise control over all aspects of the font, and includes several different ways to draw outlines (PostScript Bezier curves, TrueType B-splines, Sketch mode, VectorPaint etc.), has a number of different panels, Python scripting, class kerning, Font Info and Preference windows that go over dozens of pages.<br>
      * Fontographer includes lots of automated algorithms for things like family naming, linespacing, autohinting, and just has, principally, "one solid method" to do each thing. Its user interface is simpler than that of FLS. </p>
      <p>But both editor produce high-quality fonts with pretty much all of OpenType font format's functionality (though Fontographer does not have a built in OT feature editor, you can use an external text editor to write the feature definitions). </p>
      <p>TypeTool is a good entry point to FontLab Studio. People who learn TypeTool will be able to switch to FontLab Studio at some point. Fontographer is different, so switching from TypeTool to Fontographer or from Fontographer to FontLab Studio means, that you have to le-learn some things. But many will find that Fontographer is "just the thing" for them, probably those who find TypeTool too simple and FontLab Studio too complex :)  </p>
      <p>Also: TypeTool is $99, Fontographer is $399, FontLab Studio is $649. So it's our approach of making a line of products at different pricing points, so everyone can find something for her or his pocket. </p>
      <p>Also, the official <a href="http://forum.fontlab.com/fontographer-b8.0/" rel="nofollow">discussion board</a> for Fontographer 5 is open. We're gathering feature suggestions for future versions at the "Fontographer Wish List" sub-board there. </p>
      <p>Best,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
