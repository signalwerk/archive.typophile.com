      <p>"Arno Enslin" -- <cite>the main problem with the actual name panel of FontLab is [...] that the names are used for different purposes dependent from the font format</cite></p>
      <p>Then you should love FM which has separate sets of names for different font formats.</p>
      <p>With FM, FLS5 and FOG5, there is a font naming interface and generation method for everyone, from completely-manually over semi-automatic to completely-automatic. Each approach has its advantages and disadvantages. I am pretty happy that this kind of automatism finally made it into a font editor. No need any more for worries and how-tos. Make a WWS-compliant/WPF-compatible family without much ado. What more do you want?</p>
      <p>"Arno Enslin" -- <cite>That is regarding to the name table editor. Fontographer does not have a name table editor. [...] Another [FLS] improvement would be an item (question mark) next to all fields, that popups a customizable help on click.</cite></p>
      <p>FOG never had a name table editor. It doesn't need one. FOG is meant to make making fonts easy. Obviously your needs and FOG's features are incompatible, so your complaint just doesn't make sense. Also, font editors serve to make fonts first of all, not to modify them. Even FLS is not ideal for the latter task for which other tools exist (like OTM which provides a description next to each name table record).</p>
    html_clean: |-
      <p>"Arno Enslin" -- <cite>the main problem with the actual name panel of FontLab is [...] that the names are used for different purposes dependent from the font format</cite></p>
      <p>Then you should love FM which has separate sets of names for different font formats.</p>
      <p>With FM, FLS5 and FOG5, there is a font naming interface and generation method for everyone, from completely-manually over semi-automatic to completely-automatic. Each approach has its advantages and disadvantages. I am pretty happy that this kind of automatism finally made it into a font editor. No need any more for worries and how-tos. Make a WWS-compliant/WPF-compatible family without much ado. What more do you want?</p>
      <p>"Arno Enslin" -- <cite>That is regarding to the name table editor. Fontographer does not have a name table editor. [...] Another [FLS] improvement would be an item (question mark) next to all fields, that popups a customizable help on click.</cite></p>
      <p>FOG never had a name table editor. It doesn't need one. FOG is meant to make making fonts easy. Obviously your needs and FOG's features are incompatible, so your complaint just doesn't make sense. Also, font editors serve to make fonts first of all, not to modify them. Even FLS is not ideal for the latter task for which other tools exist (like OTM which provides a description next to each name table record).</p>
