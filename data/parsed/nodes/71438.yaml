      <p>@ Karsten</p>
      <p><cite>Labels in both apps' naming dialogs do not need to match any spec's descriptions because, as FOG5's terminology indicates, there is no 1:1 match.</cite></p>
      <p>But there would be only advantages in taking the terms from the OT specification.</p>
      <p><cite>Name IDs' descriptive names are just that and differ even in Apple's original TT spec and MS's/Adobe's OT spec.</cite></p>
      <p>The differences are not big:</p>
      <p><a href="http://developer.apple.com/fonts/TTRefMan/RM06/Chap6name.html" title="http://developer.apple.com/fonts/TTRefMan/RM06/Chap6name.html">http://developer.apple.com/fonts/TTRefMan/RM06/Chap6name.html</a><br>
      <a href="http://www.microsoft.com/typography/tt/ttf_spec/ttch02.doc" title="http://www.microsoft.com/typography/tt/ttf_spec/ttch02.doc">http://www.microsoft.com/typography/tt/ttf_spec/ttch02.doc</a><br>
      <a href="http://www.microsoft.com/typography/otspec/name.htm" title="http://www.microsoft.com/typography/otspec/name.htm">http://www.microsoft.com/typography/otspec/name.htm</a></p>
      <p>And since when is the fact, that there is more than one description of anything, an argument for adding more descriptions? A 2:3 match is better than a 1:4 match, especially if an existing description is meaningful.</p>
