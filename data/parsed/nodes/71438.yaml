          &lt;/namerecord&gt;</p>
      <p>&lt;!-- Preferred Subfamily --&gt;<br>
          &lt;namerecord nameID="17" platformID="3" platEncID="1" langID="0x409"&gt;<br>
            TypographicStyleName<br>
          &lt;/namerecord&gt;</p>
      <p>  &lt;/name&gt;</p>
      <p>  &lt;CFF&gt;</p>
      <p>    &lt;CFFFont name="PostScriptFontName"&gt;</p>
      <p>      &lt;!-- Bug? May be caused by AFDKO 2.5. --&gt;<br>
            &lt;version value="001.001"/&gt;</p>
      <p>      &lt;!-- Bug? Messed up. This also happens in FLS. --&gt;<br>
            &lt;Notice value="Copyright"/&gt;</p>
      <p>      &lt;!-- Bug? Messed up. This also happens in FLS. --&gt;<br>
            &lt;Copyright value="Trademark"/&gt;</p>
      <p>      &lt;FullName value="FullFontName"/&gt;<br>
            &lt;FamilyName value="StylingGroupName"/&gt;</p>
      <p>-------------</p>
      <p>Seems to be closer to the specification, but different from the naming model, that Adobe has used up till the FontFolio 11. And different from the output of FLS. Correct?</p>
