    html: |-
      <p>@ Yuri</p>
      <p>I think the main problem with the actual name panel of FontLab is not, that the name-descriptions are cryptical in a way, that there is a need to change them to fantasy names, but the fact, that the names are used for different purposes dependent from the font format, that you generate. In case of Type 1 the user has to care about the field "Menu Name". In case of OpenType he hasn’t. The field "Family Name" can have different meanings. In case of Type 1 it is the typographic family name. In case of OpenType it is dependent from the content of the fields on the OpenType-specific panel. If the fields on that panel are empty, the "family name" goes to both platforms, Mac/NameID-1 and PC/NameID-1. If they are not empty, it goes to PC/NameID-1 only. And NameID 4 should be dependent from the flavor (PostScript or TrueType). But FontLab always imports the PostScript name to PC/NameID-4.</p>
      <p><cite>We are not planning to completely remove name table editor from future FLS</cite></p>
      <p>If this means, that you want to remove it partly, I am disappointed. I think, that more people would use it, if the panel wouldn’t be so damn small. You loose the orientation in a scrollable list, in which only a few lines are visible. And I have another idea: Next to every NID-PID-line should be a question mark. If the user clicks on the question mark, a field with the info about the name, which is taken from the specification, should pop up. So please keep in mind, that simplification is not necessarily less confusing, but ask yourself instead, whether the reason for the confusion with the names were the many sections and the cryptical names, or the different handling for the different font file formats. The user should not compelled to change a name, if he wants to generate another font format, except from PC/NameID-4. But in case of PC/NameID-4 the line could be split. And all this could be improved with one or two decent mark colors.<br>
      Another improvement would be an item (question mark) next to all fields, that popups a customizable help on click.</p>
      <p>I hope I did not make mistakes in this message with regard to the meaning of the names, but the panels are so confusing, that I always have to be very concentrated and in the work of font naming, when I try to remember the meaning. And the last time, that I have generated a Type 1 font, was a year ago. (This does not mean, that FontLab shall not care about Type 1 naming anymore!)</p>
