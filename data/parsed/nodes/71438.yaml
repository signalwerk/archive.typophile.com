    html: |-
      <p>I guess I know how to use FLS.&nbsp;&nbsp;;-)</p>
      <p>Labels in both apps' naming dialogs do not need to match any spec's descriptions because, as FOG5's terminology indicates, there is no 1:1 match. Not in FOG. Nor in FLS. The point of FOG's dialog is that designers do not need to care what the name table looks like. (Name IDs' descriptive names are just that and differ even in Apple's original TT spec and MS's/Adobe's OT spec.)</p>
