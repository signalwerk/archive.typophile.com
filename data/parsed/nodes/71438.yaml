      <p><cite>However, I do like the sound of automated family naming. Can we have that in FontLab too?!</cite></p>
      <p>I prefer to set the names on the field "Additional OpenType names" in FontLab. Although you can import the names to that field in FontLab, I would dislike fantasy names like "typographic family". You will neither find that name in any specification nor is the Four-styles-sub-family (Windows GDI) not a typographic family. But you are right, that the names field is better in Fontographer 5.</p>
      <p>The scrollable list on the field "Additional OpenType names" would profit from a bigger panel in FontLab Studio. And required namerecords could be marked with a different color. The screen is big enough for bigger info and option panels. Using FontLab on a netbook does not make much sense. Alternatively a full size modus for the option and the info panel would be helpful in FLS.</p>
