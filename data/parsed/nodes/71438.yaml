      <p>Arno, while I respect your "programmer's" approach to font naming (and I confess that I often work the same way) that one was added because we had no better idea for naming (including non-English) at that time. Direct access to the name table was a "last resort" for those who need a full control over naming.</p>
      <p>There was at least two products after that which gave us much better understanding of font naming: both in font formats and applications. What you can find in Fog5 is a simplified implementation of the "font names theory" which is done by Adam in a past year.</p>
      <p>We are not planning to completely remove name table editor from future FLS, but since Font info will be completely re-done in FLS7 (and improved in FLS6), I hope that eventually you will agree that new names for font names is a good thing :)</p>
