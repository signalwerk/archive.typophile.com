    <p>I'm testing Triplex Italic on a book about indigenous recipes but I dislike Triplex regular, it's so sloppy and goofy, specially on headlines.</p>
    <p>So please suggest some regular (not italic) sans serif companions.</p>
    <p>Triplex Italic and it's match will be runing side by side so they must have a similar color and character.</p>
    <p>What would you suggest?</p>
    <p>Héctor</p>
