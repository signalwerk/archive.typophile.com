    html: <p>U&amp;lc was always 11 x 14.75 until around 1998 when they switched to a smaller 8.5 x 11 format. As for margins etc., the design is quite varied over their 25+ years as a print publication, so you will have to check specific issues for those details. try a university library for back issues. Also, check out the great book on the history of U&amp;lc edited by John Berry and published by <a href="http://www.markbattypublisher.com/servlet/book_view?number=23">Mark Batty</a>.</p>
