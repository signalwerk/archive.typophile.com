    html: <p>I like the handwritten/script font much better than the more corporate looking sans serif logos. The handwritten ot me fits better and sort with the theme. I am not sure you need all of the arrows on either side. Maybe some sort of mark with just one arrow like the north arrow on a map in the same sort of style as the type like you have done. I don't know if thats been overplayed, just an idea.</p>
