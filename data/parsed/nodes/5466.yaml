  html: <p>yesterday i got a little job from a friend that has to be finished on monday. they need a logotype for a cd-rom student guide in vienna. its called "viennavigator". it has to work on that blue background because it's the ci color of the publishing house which distributes the product. <br> <br>i'd be thankful for any suggestions. <br> <br><img src="http://www.typophile.com/forums/messages/29/39886.gif" alt="draft 1"> <br><img src="http://www.typophile.com/forums/messages/29/39887.gif" alt="draft 2"></p>
