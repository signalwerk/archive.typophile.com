    <p>Hello!<br>
    I have a trouble when I upload my glyph from illustrator to Font Lab. The font is quiet complicated, it's supposed to have a kind of texture. It's all traced and all shapes are supposed to be closed (I used the pathfinder). But when I copy/paste the font, it gives me the result as in the picture attached...<br>
    Would any one have an idea of what could be wrong and how could I repare it? </p>
    <p>I'm struggling since 3 days. Getting Crazy! Pleaaase.<img src="/sites/default/files/old-images/Capture d’écran 2014-08-15 à 19_6285.18.45.png"></p>
