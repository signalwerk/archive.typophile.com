    html: <p>While I agree with Bob that it likely has too many points, you can prove that by downloading a Demo copy of Glyphs (<a href="http://www.glyphsapp.com">www.glyphsapp.com</a>) and try pasting the same art into that editor. If something similar occurs, then your art has a problem.</p>
