    html: |-
      <p>I'm impressed how you've reacted to this whole situation. </p>
      <p>I don't generally prefer semi serif designs (what's the point?) but I did say I'd give some critique so here goes ;)</p>
      <p>The overall colour of the face is quite dark, making me think it's intended for small sizes; however the spacing is rather tight, so I'd want to change one of those variables and have a particular target size in mind. Wordspace is also rather narrow.</p>
      <p>You have a good grasp of the stroke modulation, but there are a couple of weird spots (the bowl of the /a/ has a thinning unrepeated in other letters, and the pointed crossbars of /f/ and /t/ are problematic).</p>
      <p>I think a smaller x-height would suit this classical style of letterform better.</p>
      <p>There's some peculiarity with your bowl curves on /BDPRbmnp/. In a face like this (classical proportions, geometric forms) I'd expect the curves to be completely smooth, not cuspy. The /q/ and /b/ don't necessarily have to relate, but I think the /q/ is out of character with the geometric feel.</p>
      <p>Thin strokes are a bit inconsistent. Take the /M/ and /N/ where you flare the thins, but the /KVWXY/ don't have comparable styling.</p>
      <p>/mnpru/ have curved instrokes at the spurs, which doesn't fit the expectation created by /BDPRbd/.</p>
      <p>I'd make the vertical serifs on /cfsz/ more prominent or you might end up with uneven colour in paragraphs.</p>
      <p>The /g/, I'd keep as an alternate but it's going to be a deal-breaker for text settings. There's enough personality in the rest of the face to attract people, without a fetishist /g/.</p>
      <p>Outstroke of /s/ should be clipped perpendicular to the ductus like the /cert/.</p>
      <p>Those diagonal serifs on /GVWvwy/ aren't working yet.</p>
