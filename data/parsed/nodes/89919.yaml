      <p>I'm not a big fan of semi-serifs, but I have to admit - this one works.<br>
      Reminds me of Infrared font considering semi-serifs.<br>
      I love the /g/ and /&amp;/, I prefer the standard one story /a/  in /@/ though. Italics seem slightly too thin compared to normal in my opinion - the contrast in a block of text is distracting. If you want weight differentation for emphasis then sure but I guess when they're both (roman &amp; italic) meant as one weight, they should be more consistent.<br>
      As for the /u/ I prefer the full-serifed one, but as i mentioned - I don't usually "dig" semi-serifs so I might be biased.<br>
      Great job overall! Looking forward to seeing it finished.</p>
