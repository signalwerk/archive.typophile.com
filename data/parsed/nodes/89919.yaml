      <p>From the time I started thinking about the italics I was sure I wanted them to be very divergent from the roman (lowercase)*. They stand out, more than ordinary italics do, but I don't see this as a con. As long as the weights/kerning of the italic and roman harmonize well with each other, I'm pleased. I feel that if I additionally drew normal italics, as a second (first) choice, I'd be over-seasoning my meal.</p>
      <p>The regular italic uppercase has different shaped serifs (just that weight, because I'm testing), but I guess will smoothen them out again. I'm not sure about that.</p>
      <p>Thanks for your nice comments!</p>
      <p>* This choice may be influenced by my recent tendency to draw textura in the last few months, although you can't really say there is much structural affinity.</p>
