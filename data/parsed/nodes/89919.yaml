    <p>On sunday I felt I needed to create a typeface to be able to live with myself. From scratch and in absence of any direct influence. Here's what it has become so far.</p>
    <p>What my purpose for this typeface is:<br>
    -Relatively big x-height (attenuation of hierarchy)<br>
    -Some caps with similitude to the lowercase (e.g B, C, D, P, R) (attenuation of hierarchy)<br>
    -Semi Serif with more contrast (without resembling Rotis)<br>
    -Combine modulation of stroke with a geometric feel<br>
    -Character set will contain old-style figures, ligatures, alternates<br>
    -Modest language coverage<br>
    -Experiment with interpolation: extra light version will be more geometric, fat version will have a much more modulated stroke.<br>
    -Italics with a moderate 5° slope<br>
    -Redemption</p>
    <p>(Sorry for the text sample, it's InDesign's optical kerning, which is too tight.)</p>
