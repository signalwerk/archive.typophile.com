    html: |-
      <p>Juergen and Thingy are bang on, it's a typeface called Brunel and is used on the dozen-plus mainline stations on Network Rail that are not owned/operated by individual train operating companies (TOCs). Rather like its predecessor, Rail Alphabet, it exists in positive and negative formats. I have a feeling it is now being used on South West Trains stations out of London Waterloo.</p>
      <p>IIRC the typeface itself was designed by David Quay on behalf of an agency for Network Rail (then Railtrack), the name of which escapes me at present, after the 1994 privatisation/dismantling of British Rail. The system was nice - each station had its own sub-idents within the main branding framework.</p>
      <p>I'll try to post more tomorrow... (I'm not on my normal machine).</p>
      <p>BTW, Ben, I'm loving your work (and the influences you cite). Got a whole lot of time for Carnet and am now enjoying looking at your flickr site.</p>
    html_clean: |-
