      <p>Hi Nick, I shop at Albert Heijn on the Nieuwmart 'op de Dam'.</p>
      <p>No a complete pdf of the font does not exist and I think it prudent not have one in the current climate of plagiarism. </p>
      <p>The Tesco font would put me off shopping there! I can see there are some resemblances but these maybe just part of a general influence of the English tradition that designers such as Jeremy Tankard has also tried to achieve in his designs. Jeremy whose I much admire worked at Wolff Olins as a graphic designer, we were also doing commissioned for them at this time. We seemed to be working in the same area without realising it until later, trying to pin down an English approach that had its roots in Granby, Gill and Johnston and further back into 19th century sans. I think Jeremy did some work for the Heathrow Express which also has this 'Englishness' about it. I think we all achieved what we set out to do, Jeremy with his wonderful Bliss and The Foundry with Foundry Sterling.</p>
