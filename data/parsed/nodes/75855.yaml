    html: |-
      <p>Hi Bendy, thank you for your interest in my production process. 1998 was a long time ago. Since then I have started to draw on screen but on certain typefaces I still draw with a pencil, first sketching and then with a harder pencil on tracing paper. I usually begin with 'hamburgefontsiv' and I can move the letters around on the table and make various combinations to see how the letters relate to one another. It is probably not an efficient way but then I never worry about being efficient—I am not trying to produce a 48 weight family in on year! I alway feel safer drawing. I know exactly what I am doing whereas drawing on screen I always worry and feel unsure if the line is what I really envisaged. I want the computer to make the compromises to my drawings.</p>
      <p>Sketching and drawing is always for me the best and quickest way of realising an idea. That was how I was trained in the pre-Mac days. At art school we had life drawing classes everyday and I was quite good at it, drawing letters is easy after that.  I can draw a perfect freehand 's' without recourse to using French curves. I am proud of that skill.</p>
