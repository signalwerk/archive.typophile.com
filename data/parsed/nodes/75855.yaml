      <p>Thanks David, for the insight into your creative process.</p>
      <p>I like what you say about not letting the computer make the compromises to your drawings. I've so far been occupied mainly with simple bezier curves drawn straight on the screen, but have recently also started drawing by hand and then digitising — I know this is a backwards way to learn! I think there's a very different quality and level of complexity in hand-drawing (to match the drawn contours properly, the curves need more nodes). I find both techniques satisfying and I hope, as I develop my own technique, there'll be some interplay between the two.</p>
