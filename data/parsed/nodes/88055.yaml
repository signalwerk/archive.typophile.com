      <p><em>…probably I can't understand all the stylistic undertones that there are between typographic, lettering, or type that imitates lettering or a fashionable script font!!! and I would like to learn it, to clarify my mind and bringh the right decision.</em></p>
      <p>You can learn by playing around with the type.</p>
      <p>For instance, if something like the Hill Station label could be set with a script font that has contextual alternates, it would be possible to set the label two ways, once with the Contextual Alternates feature applied, and once with it off. At the same time, you could humanize the “on” version further by varying the indent of each line, and the leading. You might even add bounce by manually adjusting baseline shift. And apply manual kerning for a more uneven fit.</p>
      <p>Then you can compare the “typographic” version with the more artful mimicry of handwriting, and see which works best for the design brief.</p>
      <p>(It would also be possible to apply de-regularizing typographic effects to a non-script font, and even throw glyph rotation into the mix; this would produce a pointedly arty, non-professional, hand-made effect.)</p>
