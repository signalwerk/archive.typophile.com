      <p>No one writes labels anymore, they use a handwriting font.<br>
      And who has a typewriter?<br>
      But the Hill Station label isn’t a poor fake.<br>
      This branding signifies upscale short-run “home-made” quality, not big factory, by referencing low-tech type/lettering on a plain label. The pretense doesn’t matter, to the extent that the repetitive glyphs and regularity of leading and flush left aren’t even a problem. The intent is to signify a product’s position in the marketplace, not to deceive the shopper with a trompe-l’œil effect.</p>
      <p>Compare with a similar idea, photographed in a Paris market in 1973. In those days, it would have been quite acceptable for the <em>maman</em> who lovingly made the beautiful preserve to have also lovingly made a label with beautiful writing.</p>
      <p>But today, if one were to take the Hill Station label at face value, it appears that the writing was done by a six-year old who has yet to master cursive and capitals, or an adult who has regressed to that level. </p>
      <p>What is it about something so crude and naïve that you find good and beautiful?</p>
      <p>Would the Hill Station labels have been spoiled if they looked less like a typeface, and more like real writing, having been done with an OpenType font that utilized contextual alternates to do away with obvious glyph repetitions?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG0013_5843.jpg"></div><p></p>
