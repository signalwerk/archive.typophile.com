      <p>Sorry, I had no idea I was being aggressive.<br>
      Just pursuing an idea that interests me.</p>
      <p><em>I think that everybody can understand that they are typesetting!!!</em></p>
      <p>I don't think that thought ("is it type or writing?") occurs to most people, even designers.<br>
      I have trained myself to spot the difference by looking for repeated glyphs, because I'm very much involved with the process of making OpenType fonts that mimic handwriting. But that's unusual.</p>
      <p>Nonetheless, I do think that the overall effect of the Hill Station labels is typographic, rather than lettering—not just the font, but, as I mentioned, the setting, which is flush left and evenly leaded.</p>
      <p>But whatever the viewer may or may not be aware of, be they shoppers, designers, typographers or type designers, I do think it's important that you, Swan, have a clear strategy vis-à-vis whether you want to create an effect which is typographic, lettering, or type that imitates lettering. </p>
      <p>Or do you just want a fashionable script font?</p>
