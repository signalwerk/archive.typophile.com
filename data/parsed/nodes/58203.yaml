    <div class="info">Submitted by <a href="/user/3095" title="View user profile.">billdavis</a> : 20.May.2009 7.19am </div>
      <p>Ascender Corp is pleased to announce that Friar Pro™ is now available at <a class="freelinking-external" href="http://www.ascenderfonts.com/font/friar-pro.aspx">AscenderFonts.com</a>, and in honor of Memorial Day it will be donating 100% of the proceeds to the <a class="freelinking-external" href="http://www.fallenheroesfund.org">Fallen Heroes Fund</a> for all font sales through June 30, 2009.<br>
    </p><div class="imageWrap"><img src="/files/friar_3534.png"></div><br>
    Friar Pro is a brand new revival of a truly American design by this country’s most prolific type designer, Frederic W. Goudy. ‘Friar’ was originally completed in 1937 and was a ground breaking approach to type design. Goudy designed Friar by combining various lettering styles from the fourth through seventh centuries into a type design rather than slavishly follow a single model. <p></p>
    <p>Steve Matteson developed Friar Pro as a tribute to Goudy and his joy of type design and typographic exploration. Steve created a complete character set with OpenType typographic enhancements to give the Friar Pro font an authentic appearance to the original. The OpenType features in Friar Pro includes alternative letterforms, ligatures and ornaments designed by Goudy for creating dignified typographic arrangements. Friar Pro is a beautiful design which imparts a scribal appearance to any document including greeting cards, certificates and official papers.</p>
    <p>Friar Pro is available for instant download in both TrueType and OpenType formats for Windows and Mac OS X from <a href="http://www.ascenderfonts.com/font/friar-pro.aspx" title="http://www.ascenderfonts.com/font/friar-pro.aspx">http://www.ascenderfonts.com/font/friar-pro.aspx</a> </p>
    <p>A 10 page Type Specimen booklet in PDF format showcasing Friar Pro is also available for free download from <a class="freelinking-external" href="http://www.ascenderfonts.com/font/friar-pro.aspx">AscenderFonts.com</a>.</p>
    <p>In honor of Memorial Day, Ascender Corp. is proud to announce that it will donate 100% of all proceeds from the sale our newest font, Friar Pro, from now through June 30, 2009 to the <a class="freelinking-external" href="http://www.fallenheroesfund.org">Intrepid Fallen Heroes Fund</a>. This non-profit organization supports the men and women of the Armed Forces, including families of military personnel lost in service to America, and for severely wounded military personnel and veterans.</p>
    <p>Contact: Bill Davis<br>
