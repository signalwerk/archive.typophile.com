      <p>I have added a list of major changes in 4.7.3 to the announcement: </p>
      <p><a href="http://www.fontlab.com/The-News/Announcements/Fontographer-4.7.3/" title="http://www.fontlab.com/The-News/Announcements/Fontographer-4.7.3/">http://www.fontlab.com/The-News/Announcements/Fontographer-4.7.3/</a></p>
      <p>Unfortunately, we don’t have a list of changes for the earlier minor updates handy. But mostly, these were bugfixes resulting from the porting of Fontographer 4.1 to Mac OS X — no features added or principal functionality changes. </p>
      <p>Regards,<br>
      Adam</p>
