      <p>"EMPIRE" looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=House-Industries&amp;ffam=Neutra%20Text%20-%20Demi%20Bold&amp;fid=591c1e12b842f438fb20429634ea9626&amp;fsize=60&amp;text=EMPIRE&amp;wrap=2" rel="nofollow">Neutra Text (Demi Bold)</a></strong> by House-Industries + the outline</p>
      <p>"cake" could be <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/apricot/" rel="nofollow">Apricot</a></strong> by Canada Type (2005) which seems to be based on <strong>Romany Script</strong> digitized by Dan X. Solo</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
