  html: |-
    <p>I am looking an example of a well designed layout for a dictionary definition. I attached a photo of an example. Does anyone know of or have examples of printed definitions with carefully chosen typography and spacing? Or digital examples? perhaps the heading on a webpage, where the main heading is the business's name (i.e. pentagram) and beneath the heading is the pronuncation (i.e. /ˈpen(t)əˌɡram/) along with the type of speech (i.e.), the definition itself, and the origin of the word (i.e. origin: Greek, "pentagrammon").</p>
    <p>They can be non traditional layouts as well. I am mainly looking for font pairings. I realize this is very specific, but any help would be much appreciated. Even if you can't find examples perhaps suggestions of font pairings, spacing, what words to italicize etc.&nbsp;</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/Screen%20Shot%202017-06-02%20at%203.31.04%20PM.png" width="724" height="1000" alt="love [luv] (noun) a deep, tender, strong feeling of affection toward a person; an intense emotional attachment" title="love definition">
