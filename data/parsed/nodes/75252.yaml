      <p>Israel: <em>I hope that these folks lose their battle against Microsoft on the grounds that the State of Israel acknowledged that US Copyright law overrides Israeli law when Israel signed the Berne Convention in 1988.</em></p>
      <p>You misunderstand, badly, what the nature of the Berne Convention is. No country acknowledges that the laws of another country override its own. Under the Berne Convention, countries agree to grant, within their jurisdictions, the citizens or corporate entities of other countries the same intellectual property rights and protections that they grant to their own citizens and corporate entities. In other words, under US law an Israeli citizen or corporation would have the same rights and protections as US citizens or corporations, and under Israeli law a US citizen or corporation would have the same rights and protections as Israeli citizens or corporations.</p>
      <p>Also, it was the USA who only acceded to the Berne Convention in 1988. Israel ratified the Convention in 1969.</p>
      <p><em>Hence, American creativity excels where Israeli creativity is stifled...</em></p>
      <p>I don't see any stifling of Hebrew type design or font development in Israel. It appears to be thriving.</p>
