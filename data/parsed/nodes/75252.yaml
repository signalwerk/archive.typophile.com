      <p>It's a tough call, in the example of your second post. I would say that the second party <em>should</em> owe the first party money. It's really a matter of conscience for the second party, because even though they are not technically breaking any laws, they are using something that should have been, for the most part, someone else's.</p>
      <p>I think originality in a typeface depends upon it being significantly different enough from other designs. But just measuring the cap-height, extenders lengths, and x-height and having them the same could still have an original design, since there's a lot in structure a typeface could change. The same is true for Hebrew. The difference has to be significant, but even that is a bit ambiguous.</p>
