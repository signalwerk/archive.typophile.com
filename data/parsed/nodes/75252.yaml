      <p>In your fist paragraph, you seem to assert that this is a case of non-legal infringement upon the first party's rights, while in the second paragraph you see to allude to the most difficult and gray area of US Copyright law, called a derivative work.</p>
      <p>For example, I look upon Van Gogh's Starry Starry Night, and am inspired. I create Palatino, as my interpretation of Van Gogh's classic work of art.</p>
      <p>This is deemed a derivative work.</p>
      <p>In the first paragraph, you claim that I owe money, morally but not legally.</p>
      <p>I counter that I am willing to pay money, but that act implies the first party has a right, which I think was stolen. I'll give him money, but not acknowledge his rights (which I feel that he does not have).</p>
