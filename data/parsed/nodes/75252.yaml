    <p>What constitutes originality in a typeface?</p>
    <p>For example, say a typeface has a basic look and feel, but its side-bearings (the spaces between the letters) are adjusted so the letters fit together better, the vowel and diacritic marks are better aligned to the letters, and their distance from the letters is improved.</p>
    <p>Is that creative originality to render the Hebrew typeface to become a person's intellectual property?</p>
