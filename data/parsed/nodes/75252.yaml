      <p>Would we promote it, define it etc., creative work would be hindered or destroyed. Hence, we prefer to limit design rights to making a design patent etc. to sort the true defenders of their rights from the greedy. And allow a creative form of derivative works. Let each judge decide, says American law.</p>
      <p>For this reason and others, I feel our legal system, though not perfect is superior to laws in Israel. American laws are closely derived from Talmudic law, while Israeli, ironically Jewish, is not.</p>
