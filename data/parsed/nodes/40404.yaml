  html: |-
    <p>In reference to the publishing house operated by Aldus Manutius (Italian <em>Manuzio</em>) in Venice between 1494 and 1515. Also types used by Manuzio and in most instances cut by <a href="/node/14191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Francesco Griffo</a> de&nbsp;Bologna.</p>
    <p>Metal, digital and optical revivals resembling the types of Aldus and Griffo are sometimes known as&nbsp;Aldines.</p>
