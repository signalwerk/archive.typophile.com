  html: |-
    <p>In reference to the publishing house operated by Aldus Manutius (Italian <em>Manuzio</em>) in Venice between 1494 and 1515. Also types used by Manuzio and in most instances cut by <a href="/wiki/Francesco%20Griffo" class="freelinking" rel="nofollow">Francesco Griffo</a> de Bologna.</p>
    <p>Metal, digital and optical revivals resembling the types of Aldus and Griffo are sometimes known as Aldines.</p>
