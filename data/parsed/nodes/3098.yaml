    date: 2004-02-12T12:36:00
    date_raw: 12 Feb 2004 — 12:36pm
    votes: null
    html: "<p>Whether or not you choose to do spec work or whether this can be considered such (and I would suggest that you seriously think about this - many here have talked about it before: <a href=\"http://www.typophile.com/forums/messages/30/16481.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/16481.html</a> as well as participating in the Typophile contests too), Tanya has an excellent point:  <br> <br><b>Stay away from gradients.</b> <br> <br>Sure  they look cool, but gradients make things harder to see, read and reproduce. Especially letters. Gradients can cause problems when going to print. Gradients are hard to control in terms of colour matching. <br> <br>Choose one colour. The blue at the right hand side of the logo looks kind of neat... <br> <br>Speaking strictly about the work you are showing here: <br> <br>- What are you trying to show? Do you just want to make the letters look 'technical'? Is it a requirement that the letters be used? Is there already a symbol? <br> <br>- The gaps in the letterforms, while not totally objectionable don't really seem to look consistent. Is there a rule that you could invent and follow about the gaps? <br> <br>- The logo seems to scale okay, which is one of the virtues of using sans-serifs if you need to go small. <br> <br>Additionally I can say from experience: you don't need to participate in a contest to get into the graphic design field. If you start designing things, even in a small way and study as much as you can you will find conversation and word of mouth can go a long way to establishing your reputation. <br> <br>Jon</p>"
