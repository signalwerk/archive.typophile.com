  html: |-
    <p>I have taken it upon myself to design a smallcaps version of the OFL licensed Gentium font.<br>
    For copyright reasons, it is called GsmCaps for now.</p>
    <p>I also made a semi-sans serif version of Gentium, called GsemiSans.</p>
    <p>Both were really learning processes for me, and I plan to use them for an upcoming project. I may submit them to SIL, I don't know yet.</p>
    <p>Thanks for any comments and critisisms; I am a complete beginner, with no formal training.  But I just love typography!</p>
    <p>Gentium original: <a href="https://web.archive.org/web/20140911204204/http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium_samples" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium_samples">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium...</a></p>
    <p>(Tell me if the PDFs don't work for you, and I know one of the fonts is not serif, but I had to pick a forum.)</p>
