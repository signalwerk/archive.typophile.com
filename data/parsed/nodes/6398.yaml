    html: <p>thanks for the replies! <br> <br>hrant - I have been worried that the 1 px difference presents a usage problem, but this was the cleanest way to create an accurate slab version of the regular weight. <br> <br>I'm also working on a more 'proper' bold with the same height as the regular. <br> <br>also, yes the 'k' and the '2' are definitely presenting problems - 3px wide diagonals are too thick, 2px are too thin.</p>
