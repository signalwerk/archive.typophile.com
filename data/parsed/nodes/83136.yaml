    <p>Hi,</p>
    <p>Could someone let me know why symmetrical letters (A, V, etc.) don't have a perfect symmetrical form. Is there a particular reason why the angles and thickness of the two strokes in each letter vary?</p>
    <p>I've attached references for this. The blue filled part represents the original letter, and the red outlined form is the flipped version.</p>
    <p>Also is it wrong for the letters to have a perfectly symmetrical form?</p>
    <p>Thanks,<br>
    Sulekha</p>
