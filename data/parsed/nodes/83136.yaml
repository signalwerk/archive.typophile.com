    html: <p>My guess is that none of those weights was a master font and they all have uncorrected one-unit rounding errors as a result of interpolation. It's fairly common in type families and usually such errors can only be seen by someone who is measuring for them. Either that or the symmetric versions you created were made in a tool that does not round all points to integers and your new points are sitting on fractional coordinates.</p>
    html_clean: <p>My guess is that none of those weights was a master font and they all have uncorrected one-unit rounding errors as a result of interpolation. It's fairly common in type families and usually such errors can only be seen by someone who is measuring for them. Either that or the symmetric versions you created were made in a tool that does not round all points to integers and your new points are sitting on fractional coordinates.</p>
