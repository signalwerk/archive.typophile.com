    <p>Hi,</p>
    <p>I'm using <a href="http://www.linotype.com/44246/chaparralproregular-font.html" rel="nofollow">Chaparral Pro</a> as copy in a book I am writing about school yearbooks.</p>
    <p>Because the book also has magazine style sections, I'm trying to find sans serifs which work well with Chaparral.</p>
    <p>I was thinking of using <a href="http://www.typodermic.com/31.html" rel="nofollow">Expressway</a> by Ray Larabie, but I always get the feeling they clash a little.</p>
    <p>-&gt; Any suggestions on what sans work well with Chaparral?</p>
    <p>The overall look I am trying to achieve is 'fresh', 'reservedly exciting', and 'confident'.</p>
    <p>Thanks for your drips of knowledge.</p>
