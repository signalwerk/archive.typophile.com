    <p>We are trying to re-brand an auction services company. They list your product for you on multiple engines and manage the whole process from listing to shipping (focus: large clients with lots of products)</p>
    <p>I am looking for recommendations for a typeface that will be used next to a mark and in text on their collateral materials (For the mark, we're going for something kind of like a DNA strand - semi-scientific feel but still ultra hip)</p>
    <p>Any suggestions?</p>
