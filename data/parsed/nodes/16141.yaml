    date_raw: 9 Nov 2005 — 4:13pm
    votes: null
    html: <p>Okay you are narrowing it down but I have a problem wiht making it both Ultra Cool and Scientific. Ultra Cool seems to be grungy (I could be wrong) and Scientific seems to be on the Eurostyle feel all lower case (but I could be wrong again). I would go another direction all together, I would explore a unique mark that was not plugged into a category.</p>
