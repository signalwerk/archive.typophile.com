    html: |-
      <p>now you know my stress! I have been racking my brain on how to come up with something. Maybe these thoughts will help (I appreciate the discussion by the way, this is really helping).</p>
      <p>I wouldn't say grungy for "Cool" maybe a better word would be "hip". They want to use orange as their main accent color. This color to me puts them in the "Dot Com" arena. They actually are a dot com, but they want to move out of that area a little bit while still keeping the edgy dot com "hip" factor. Throw in a slice of scientific and we have a real Frankenstein don't we?</p>
