    html: |-
      <p>Once you expand the archive, all you have to do is copy/move the programs `potrace' and `mkbitmap' to a directory on your path. (I've added so much stuff to my path, I don't recall what is there by default.) Most likely /usr/local/bin will be on your path, so I suggest moving there. (First, open Terminal and type </p>
      <p>echo $PATH</p>
      <p>to see what's on your path, and if /usr/local/bin is there, cd to the expanded folder (potrace-1.8.mac-[ppc/intel]) and type</p>
      <p>sudo mv potrace /usr/local/bin</p>
      <p>give your password, and do the same with mkbitmap. You're done, with no doorstop.</p>
