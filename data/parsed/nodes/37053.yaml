    html: |-
      <p>By the way Steve, the formats that you were trying to save to in Illustrator, SVG and EPS are vector outline formats. Saving a bitmap to either of those formats doesn't change the nature of the file, and when FF tries to open an EPS or an SVG it is looking for a vector document.</p>
      <p>Saving to either a .tiff or .jpeg should work because their nature is that of a bitmap image. </p>
      <p>But why Potrace/FF wouldn't accept a .PNG is beyond me since that is the better and more open format, and is widely used by the FOSS/UNIX/LINUX community...</p>
