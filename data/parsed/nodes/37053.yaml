    html: |-
      <p>There is <a href="http://cetus.sakura.ne.jp/softlab/b2p-home/" rel="nofollow"><strong>png2bmp</strong></a> that converts <code>.png</code> files to <code>.bmp</code> format. If you have lots of <code>.png</code> files, and <code>png2bmp</code> is installed, then you only <code>cd</code> to the directory where the <code>.png</code> files are and type</p>
      <p>&nbsp;&nbsp;<code> for i in *.png; do png2bmp $i; done</code></p>
      <p>and you get all the corresponding <code>.bmp</code> files. You can also pipe the output of <code>png2bmp</code> into <code>potrace</code> so as to get all the <code>.eps</code> or <code>.svg</code> files.</p>
      <p>For me that's enough. In fact, if I can avoid opening fontforge, I like it better, and it is in fact easy to write a script that starts with <code>.png</code> files with properly chosen names and generates a <code>.sfd</code> file where all the <code>.bmp</code> bitmaps are in the background of their corresponding character; that's just the kind of facility I like with fontforge.</p>
      <p>Michel</p>
      <p>PS. If you don't know how to compile <code>png2bmp</code>, <a href="http://www.iro.umontreal.ca/~boyer/typophile/png2bmp-1.6-powerpc.pkg.zip" rel="nofollow"><strong>here</strong></a> is a compiled version for a ppc with OS X 10.4 (I am not sure it requires 10.4) ready to be installed (in package form). Don't click twice on <strong>here</strong> else the package is loaded twice.</p>
    html_clean: |-
