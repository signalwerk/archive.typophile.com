    html: |-
      <p>You could install into /usr/bin, which is already on your path.</p>
      <p>To create /usr/local/bin</p>
      <p>sudo mkdir /usr/local/bin</p>
      <p>Then you will have to add /usr/local/bin to your path. How to do that depends on what shell you are using. For bash (now the default on OS X), edit or create .bash_profile and add the lines:</p>
      <p>PATH=$PATH:/usr/local/bin<br>
      export PATH</p>
    html_clean: |-
