  html: |-
    <p>Hi,</p>
    <p>I know that purchasing a font or having one come with you computer does not mean you can use it anyway you desire. People and companies have bought font license assuming they own it and can use it for websites. Their license did not include web usage and they have run into legal issues or can potentially run into legal issues in the future. </p>
    <p>(As far as I know) The standard fonts that come with Mac and Windows computer come with a license for printed material. Purchasing fonts as well comes with a license for printer material. Does that include silk screening on clothes or does that require purchasing a separate license? </p>
    <p>Thank you</p>
