      <p>Speaking as someone who was diagnosed with ADD as a teen, (I sometimes wonder if I was a case study for the definiton of the term) there are some specific things that come to mind, such as keeping column width relatively narrow, keeping the margins fairly large and clean, and opening the leading a bit.</p>
      <p>One of the coping techniques taught to students is to cover the facing page of textbooks with a blank piece of paper and another piece of paper to guide your eye down the page. I think words per line is more important than actual font size, overall. Reading long lines of text is tedious for most, but can really cause frustrating problems for the attention deprived as they try to find the first word in the next line. After a reading the same line twice a few times, the minds of some can decide to think about other things, even while their eyes continue to scan down the page.</p>
      <p>Also, special attention should be placed on the use of visual aides, where possible, like a well made graph or illustration or well chosen photograph to give the reader a break to absorb before continuing.</p>
      <p>Of course, a lot of this depends on what type of project you are working on... I'm thinking here of textbooks.</p>
      <p>However, do post back about any resources you find on the subject, it's never something I actively looked for, but I would definitely be interested to hear the conclusions of people who actually study this.</p>
