      <p>"Now ADD and recovering from substance abuse are not exactly the same things"</p>
      <p>Well...there's a pretty big gap there, I think. ;o)</p>
      <p>That said, in general, it seems that everyone is in agreement that 'good information design' benefits everyone. </p>
      <p>The core issue with my ADD is that I don't like to stick with one task for an hour at a time. I'd rather (and sometimes need to) jump between 2 or 3 tasks constantly over 3 hours rather than spend one solid hour on each. Someone mentioned WIRED, and though I don't know how it is today, around 5 years ago it was a very ADD-centric design. Most of the magazine was chopped up in to small bits. Sidebars, half-page columns. Lots of grids and info design. And, yea, a few large articles.</p>
      <p>Again, I know I said it tongue in cheek, but 'don't make it boring' seems to ring true. When designing, try to break the content up into digestible chunks.</p>
      <p>We ADD folks love short story compendiums more so than the epic novel. ;o)</p>
      <p>As for type size, at least for me, that wouldn't matter too much. Readable is readable independent of ADD. (but that's just me)</p>
