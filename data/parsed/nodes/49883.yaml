      <p><cite>ADD in all it’s forms is so common place,</cite></p>
      <p>I believe in this context the word you want is "commonplace"</p>
      <p><cite>at some point one has to ask; is it really a disorder at all, or just the way some people are.</cite></p>
      <p>I'm trying to figure this out. You mean it is only a disorder if there is an outside agent, like a virus or bacteria? So diabetes &amp; auto-immune "problems" aren't "disorders," but "just the way people are"?</p>
      <p><cite>Maybe the real problem is bad disign and lack lustre, lazy, boring education systems.</cite></p>
      <p>Long ago, say before 1960, schools were viewed as places where one could go to get information (then called "knowledge") more quickly than if left to their own devices. In general, if you did poorly, it was because you didn't work hard enough. Always exceptions to this, of course.</p>
      <p>40-some short years later, if you don't do well, it is somebody else's fault. The teachers. The educational system. The student is never to blame. In passing, I expect we'll soon pass laws providing parents that can't afford them access to helicopters -- in the interest of fairness, of course.</p>
      <p>* * *</p>
      <p>Vis-a-vis education, there is an interesting example in this thread.</p>
      <p><cite>. . . I was taught that a comfortable line length for text is 10 to 12 words, or 55 to 65 characters.</cite></p>
      <p>This may be true. It has been around a long time, since before the 1960s anyway. Almost a canonical proclamation. But consider: most of the studies that are that old need repeating; the statistical methods of the first half of the 20th century were generally not too good.</p>
      <p>Secondly, does the 55 to 65 characters include word spaces? If the "55 to 65" does not include word spaces, we have an average word about 5.4 to 5.5 characters long. That would let in "their". A short word like "the" would let in a long one, such as "because". But if wordspaces are included in the count, you have to back off almost one letter for average word length -- "they" becomes an example of average length.</p>
      <p>Prolix stuff, "their", "the" &amp; "because," right?</p>
      <p>Why do I ask? Because justification takes place only by varying word spaces. Ten words on a line have 9 wordspaces; 12 words 11 wordspaces. So let's suppose that the last word in a line is "strength" or "thought". Let's assume the space of an average letter is half an em (500 units). "Strength" &amp; "thought" cannot be hyphenated. If they won't fit on the line, the wordspaces in the line must be varied to either bring them up or take them down. That's about 4 ems of space for "strength"; 3.5 ems for "thought" (OK, "t"'s aren't 500 units, but there is always women, with a "w" &amp; "m").</p>
      <p>Let's also suppose a word space is 250 units -- four-to-em.</p>
      <p>Pursuing further: with 10 words per line (nine spaces), that extra 4 ems that won't fit means the word spaces must take on the extra .44 ems, and are now .69 ems. The word spaces on this line more than double. Or, you could try to bring the word up. No, it won't fit.</p>
      <p>Granted, the numbers used here take on an almost-worst-case scenario -- the word almost fits or just barely doesn't fit. But it happens, and there are longer words than "strength" or "thought" or "women's". </p>
      <p>What is the point? The point is that one design school  dicta: "Keep the line length to 55 to 65 characters" has a consequence. It seems to conflict with another one: "Keep word spacing even."</p>
      <p>You do the math. If you come out anywhere near my numbers, the complaint about education should be not that it is too boring, but that it is too incomplete.</p>
      <p>Looping back, it may be true that a text prepared especially for people with ADD needs to be designed a certain way, I don't know. But that does not mean these design principles don't have compromises. And it certainly doesn't mean a designer should be "creative," their job here is to be effective -- To look at the audience, not their own boredom quotient.</p>
