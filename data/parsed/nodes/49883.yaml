    <p>I need to do some research on designing for an audience with adult attention deficit disorder.</p>
    <p>I understand that establishing a clear hierarchy and keeping things clean are essential starting points, but I'm hoping to find some articles, books, and good examples to help me really grasp all of the things I need to consider. Personal observations are also welcome.</p>
    <p>I'll be going to a specialty design book store this weekend (SWIPE in Toronto). Every time I step in there I feel overwhelmed, so I'm hoping if I have some good suggestions I'll know where to start.</p>
    <p>Thanks!</p>
    <p>(Wasn't sure if this should be posted to General Discussions or Design...)</p>
