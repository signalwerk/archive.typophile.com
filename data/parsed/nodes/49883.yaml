      <p>Ricardo,</p>
      <p><cite>One can learn so much from trial and error, though — from trying different things and seeing the results with one’s own eyes.</cite></p>
      <p>Yes. And I have to admit I sandbagged you just a bit. Actually, I do think that 10-12 words per line is about right. But I also think this is more like 72-73 characters per line. And the .7 em-wordspace line does happen, even with  75-character line, esp. if that unhappy sequence falls on the first line of a paragraph.</p>
      <p>I've used the above example before, but usually with people who have a host of hyphenation "don't" rules.    I'm sure you can create your own examples. </p>
      <p>What I was really aiming at is the notion of audience.  A generalization to be sure, but one big difference between an artist and a typical graphic designer is the artist gets to pick his/her audience. If the work only appeals to a small number of people, that's ok.</p>
      <p>That's not true for a designer who's been hired for a task. And what that task is varies a lot as well. I'd assume with most book design, we can assume that the buyer/reader bought the book because of the author or the topic. The reader wants the book, and will even put up with a bit of bad design and still read it. I'd imagine it is just the opposite with an advertisement. The hoped-for reader does *not* want to read the ad, it is the designer and copywrier's job to lure them in.</p>
      <p>But in both cases, the designer serves other people's goals, not purely their own. The same would be true for designing material for people with ADD. The only way to find out what is most effective is to study that audience, who likely both does &amp; does not want to be there. And as always, theories should taken with skepticism; be tested against observation where the goal is not to prove the theory, but to see what's really going on.</p>
