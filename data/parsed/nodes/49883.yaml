      <p>"ADD in all it’s forms is so common place, at some point one has to ask; is it really a disorder at all"</p>
      <p>A lot of disorders are disorders only in the context of this particular modern life. IMHO, ADD is more about the brain being different. You either accommodate the different brain, or you accommodate the workplace by altering the brain. Both are valid, just different solutions.</p>
      <p>That said, the arts tend to have a high ratio of ADD folks. I'm sure it's no accident. ;o)</p>
      <p>As for it being an issue in the schools, it's definitely an issue, but I think it's partly an issue of the rather formulaic and structured school system we have in a large part of the US. The schools have to genericize the curriculum to (attempt to) accommodate everyone rather than having the ability/opportunity/resources to tailor it to each child's strengths.</p>
      <p>In context that we can understand, it's like being told to create design solutions for a french restaurant, a fortune 500 bank, and a punk band with just Helvetica and canary colored copy paper. ;o)</p>
      <p>(which actually sounds like a fun challenge, now that I think about it...)</p>
