      <p>For some years I designed a lot of books for a publisher catering to the recovery market: adults trying to re-build lives after succumbing to substance abuse. At the same time I was designing a lot of poetry and literature; I had much better understanding and expertise in those areas. So it took the publisher and me a few tries to get me on the right track, and design for people whose comprehension abilities were not the same as the literati.</p>
      <p>Now ADD and recovering from substance abuse are not exactly the same things, but I think some of the same principles will apply.</p>
      <p>It ended up that clear visual hierarchies was the most compelling bit of advice I got from the publisher, as has been noted above. The books were written with clear text hierarchies. I had to reinforce them visually. Organization was key here.</p>
      <p>Many typographers hate to hear a client ask "Please make the type a bit bigger." It was indeed necessary for these books. Many of these readers had a tough time getting from the start of a line of type to the other, so we used shorter measures and larger type.</p>
      <p>I ended up with files that had lots and lots of text style sheets, to accommodate both the text and visual hierarchies. Just marking up the ms so I could get through it when it came time to compose pages was a major chore.</p>
      <p>Perhaps in addition to going to a specialty design store this weekend you may wish to visit a good book store that has a section devoted to these matters. Hazelden was the publisher for whom I was designing. I have not done anything for them for 10 years, but I'm sure they've published newer books for the same readers.</p>
      <p>Good luck.</p>
      <p>powers</p>
