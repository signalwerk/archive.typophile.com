    <p>Independent foundries:</p>
    <p>I am interested in seeing aproximately what percentage of income comes from each retail outlet.</p>
    <p>Most serious foundries would be signed up with two or three, I assume.</p>
    <p>Example:</p>
    <p>Myfonts.com: 40%<br>
    fonts.com (monotype): 30%<br>
    fonthaus.com: 10%<br>
    foundry website: 10%<br>
    veer: 10%<br>
    etc.</p>
    <p>Any information would be appreciated and useful as well. Currently I am only signed up with myfonts.com, but I would like to do some revenue projections. This could be useful information for other smaller foundries to tweak thier marketing.</p>
    <p>Thank you,</p>
    <p>JDooley</p>
