      <p>Nipper.<br>
      Francis Barraud inherited a friend’s dog when he died, and also his gramophone with a recording of his voice.<br>
      The dog would listen to his dead master’s voice through the horn, intrigued.<br>
      Barraud painted this scene, and subsequently sold it to the Berliner gramophone company (perhaps inspired by Pears’ use of Millais’ “Bubbles”).<br>
      This image of Nipper became the trademark of the Victor Company (the successor of Berliner), and then RCA (the successor of Victor).<br>
      Obviously, it symbolizes veracity of sound reproduction—as well as the attraction of listening to the product.</p>
