    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SaharaBodoni_numbers_5701.jpg"></div><p></p>
    <p>I know what this font is (Sahara Bodoni), but I'm looking for other options in this vein. Modern with very thick thicks and thin thins. And I'm really just looking for the numbers – have to be beautiful. And it would be a bonus if there's anything that's not quite as extended as Sahara, even though I love that they're fat, the application I need them for wants two-digit combinations to be closer to square than rectangular/horizontal.</p>
    <p>Any ideas?</p>
