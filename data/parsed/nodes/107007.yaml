    html: |-
      <p>If you're working on Windows, FontCreator has changed a lot recently.<br>
      It was once totally TrueType centric but not so anymore. OTF is well supported.<br>
      It opens and exports to the WOFF format quite nicely.<br>
      It's got ttfautohint 9.5 built in.<br>
      It's got it's own project format now.</p>
      <p>And AFAIK, it's the only editor that supports Microsoft's Color Fonts spec. </p>
      <p>I very much like it for some things - working with composites is sometime easier in it. And I like the interface. I wish other font editors were as friendly.  (This is, for me, the major sticking point about FontForge. It's a very capable program but visually I'm repulsed by it. It doesn't reveal what I need to see, easily.)</p>
      <p>In my experience - no one tool has it all.  And I agree with Frank that that's a healthy thing.</p>
