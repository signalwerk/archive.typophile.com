    html: |-
      <p>Alan: ‘<em>Which is the best? Well that would depend on your other criteria - as they all have their own merits/disadvantages, costs, feature lists and learning curves.</em>’</p>
      <p>I fully agree. Since the mid 1980s I have worked with different font production tools; ﬁrst IKARUS and not much later Fontographer. In the course of time I have seen other applications being developed and, of course, together with URW++ we developed our own suite of font production tools. </p>
      <p>Our tools ﬁt our needs best, because they were tailor-made for us. That doesn’t imply that this is the case for others too. I think it’s quite human to think that the tools one uses are the best, and often it looks to me that users of a certain tool want to convince the rest of the world that their tools are the best. If other people follow you, they prove you are right. And people often like to be part of a community.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Basically this is not a problem, but in case a monoculture is developed in education, i.e. education based on one speciﬁc tool,  this is wrong IMHO. And I have seen this happen and this resulted in replies from students when I showed <a href="http://www.youtube.com/watch?v=uOsYMctPRNg" rel="nofollow">functionality</a> not covered by their favorite tool, i.e. their lecturer’s, preferred tools like: ‘<em>Okay, we will wait until this will become available for the tool we use.</em>’<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Perhaps circumventing limitations is ﬁne if you have more time than money, but from a production point of view it makes sense to combine tools then (for drawing, for generating fonts, for adding OT Layout features, etc.). Or even switch to another tool. So, in education <em>all</em> tools should be discussed.</p>
      <p>Ramiro: ‘<em>FontMaster (A bit outdated and not user friendly IMHO)</em>’</p>
      <p>Perhaps I’m a bit biased, but I think the FM is actually quite user-friendly and not outdated at all. FM uses a nice versatile ﬁle system, has a lot of powerful batch-functionality built-in (for instance the OT Layout features subsetting is <strong>very</strong> user-friendly), has very good autohinting capabilities, and IMHO a <a href="http://www.youtube.com/watch?v=Z6qOc6Ktzds" rel="nofollow">nice interface</a> for drawing glyphs (but, as mentioned above, it was mostly tailor-made for DTL). Also the (batch) <a href="http://www.youtube.com/watch?v=5WNDdGu9Pqg" rel="nofollow">autotracer</a> is excellent.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;FM supports the IKARUS format, which may not be important to you, but it is for (very) large software companies which use our tools still (especially in the Far East). And FM is the only tool available that offers manual digitizing with a tablet, as far as I know.</p>
      <p>However, if you compare it with your favorite tool, then perhaps FM has a steep learning curve because it handles things differently. And if you want a native Mac OS X version, you will have to wait for the new edition (see the ﬁrst link above). And if you’re a novice and you’re not thinking of handling many font files, then FM is perhaps not the best choice. And in case you want to apply deltahints, FontLab Studio is the only application mentioned here that offers this option.</p>
      <p>Ramiro: ‘<em>There other less powerful (but easier) options like: - Fontographer</em></p>
      <p>Well, if you combine Fontographer with DTL OTMaster, you have a very powerful combi. Generate a glyph database in Fontographer (using its quite good drawing capabilities), generate an OT Layout features ﬁle in OTM (with the forenamed subsetting), and combine this in Fontographer. Or add colored glyphs using OTM. </p>
      <p>Alan: ‘<em>You might want to think about and tell us what other features you require (and will require in the future), whether cost is a factor etc - otherwise this thread is probably not much help.</em>’</p>
      <p>Yes, deﬁne your needs ﬁrst. </p>
      <p>FEB</p>
