      - Fontlab<br>
      - FontForge (GNU/free and a bit complicated if you compare it with the others)<br>
      - FontMaster (A bit outdated and not user friendly IMHO)</p>
      <p>There other less powerful (but easier) options like:<br>
      - Fontographer<br>
      - TypeTool<br>
      - FontCreator (0nly for PC)</p>
      <p>My personal advice: choose between the first three in this list. </p>
      <p>Cheers.</p>
