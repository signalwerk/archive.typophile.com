    html: |-
      <p>1) I'm not sure this is what's causing your problem, but if you try to save an OTF font, and you have the "Export only OpenType name records" option off in Preferences, <em>and</em> you have not filled in the "Other Names" page in the Font Info screens, FontLab will quit unexpectedly (OS X).</p>
      <p>2) <a href="http://groups.msn.com/FontLab/_whatsnew.msnw" title="http://groups.msn.com/FontLab/_whatsnew.msnw">http://groups.msn.com/FontLab/_whatsnew.msnw</a>  (The fact that it is hosted through MSN Groups sucks, but the good news is that at some point in the near future it will move to FontLab's own site, according to the FontLab people.)</p>
      <p>3) You have to manually "turn off" the red marks after fixing the glyphs--they are a nice touch, but not dynamically self-updating. Right-click on a glyph cell and choose Mark &gt; None. BTW, you can use this marking facility however you want, for example, to help keep track of glyphs you are working on. I have even seen Python scripts that mark characters with different colors based on certain criteria. I'm not quite that sophisticated myself (yet).</p>
