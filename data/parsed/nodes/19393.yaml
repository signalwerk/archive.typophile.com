    <p>Now and then I read a thread the essence of which is "I'd like to.. but the <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a> says..."<br>
    So I've got a question: SO WHAT?</p>
    <p>Specifically, what makes the EULA binding and enforceable, given your local laws regarding contracts, standard agreements, consumer rights, and EULAs in particular; and also the intellectual property and fair use laws?</p>
    <p>(For example, I recall a case where a student was given the right to resell Microsoft software; the license prohibited it, but it was found unfair.)</p>
    <p>I read the discussions posted here before, and also elsewhere, but didn't find anything convincing either way.</p>
