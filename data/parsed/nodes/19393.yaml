      <p>Your distinction is valid, but the point is that a contract, let alone a contract such as this, does not exhaust, or even accurately reflects, the rights of the parties.</p>
      <p>So, sure, I'm making a legal argument (my legal training is in fact quite extensive, so I definitely do not condone piracy), but isn't it important to all of you? Why do you automatically assume that if a EULA says something you have to abide by it?</p>
