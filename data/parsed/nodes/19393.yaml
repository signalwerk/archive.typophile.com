      <p>Typequake,</p>
      <p>I’ve spent some time thinking about this over the weekend. Unlike other forms of IP, historically the EULA has been the primary (and in many cases only) line of defense for type makers against the misuse of their IP. So you’re not going to find many type designers that will support this line of reasoning. Theoretically if there were some kind of test case that threw out the validity of software EULAs then where would that leave type designers? </p>
      <p>So in the spirit of this thread I offer you this bad poetry…</p>
      <p>with copyrights in question,<br>
      but trademarks looking fine,<br>
      EULA’s your only protection,<br>
      against many a typo crime.<br>
      So any type designer,<br>
      that says EULA terms are moot,<br>
      has shot themselves (and their colleagues)<br>
      squarely in the boot* </p>
      <p>*edited from foot.</p>
