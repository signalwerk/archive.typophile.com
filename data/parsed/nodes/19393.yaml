      <p>I've spent time too, discussing the issue with a professor of law who specializes in IP, but knows nothing about fonts and can't tell Fairfield from a chesterfield. </p>
      <p>He believes US courts are inclined to enforce EULAs, but thinks the argument against EULAs has a fair chance.</p>
      <p>As for this: "Unlike other forms of IP, historically the EULA has been the primary... line of defense for type makers against the misuse of their IP"</p>
      <p>you should be clear that a eula is a contract, so it binds ONLY the parties who agreed to it. Intellectual property rights are enforceable against third parties. This means that if you find a font library that fell off a truck, you can embed the fonts in a pdf or use them in a tattoo.</p>
