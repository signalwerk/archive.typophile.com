      <p>If you think of a font EULA as a written agreement between a font maker and their customer, the customer really has two choices if they don't like the terms of the agreement - they can either ignore it in the knowledge that there will likely be no repercussions, or they can take their business elsewhere. A third option, the one usually mentioned here, is to talk to the font maker and try and work something out. </p>
      <p>Cheers, Si</p>
