      <p><cite>This means that if you find a font library that fell off a truck, you can embed the fonts in a pdf or use them in a tattoo.</cite></p>
      <p>Does that mean the person whose truck it fell off of violated the EULA by redistributing? </p>
      <p>One common EULA feature that I have personally violated many, many times is right to pass fonts off to a printer. According to many EULAs, the prepress person is supposed to license the font also, particularly if they are working with native files. For lithographic printing, it is often necessary for the prepress person (which used to be me) to have the native InDesign or Quark files to set up the color separations. Designers typically can't do this themselves for a variety of reasons. In the shops where I worked, I don't think anyone seriously considered  licensing the fonts again for my use. Also, not being a Typophile(TM) at the time, I don't think the licensing issues ever occured to me. </p>
      <p>As composite digital printing becomes more common, documents will be submitted more as PDF files, which is more often allowed.</p>
