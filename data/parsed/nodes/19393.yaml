      <p>&gt; if you don’t like people enforcing IP law</p>
      <p>Is this meant as a joke?</p>
      <p>It should be stressed that the EULAs of American font companies do not enforce the laws of the United States. On the contrary, these US companies in fact **replace** the US laws by their own private "company laws".</p>
      <p>For instance in the Adobe EULA we read:</p>
      <p>"Adobe ... expressly disclaim all ... whether by statute, common law, ... or otherwise".</p>
      <p>In Europe, a state is defined as a "law state" ("Rechtsstaat" in Germany, "état de droit" in France, etc.). The word "law state" does not seem to exist in the American language, since the USA is obviously not a law state (in the sense of "Rechtsstaat" or "état de droit").</p>
      <p>In a law state, it is not possible that companies replace the laws of the state by their "own laws" ("company laws", "private laws"). Since America is not a law state, Adobe can expressly replace the US laws ("whether by statute, common law, ... or otherwise") by its own private "Adobe laws", and in fact the Adobe EULA makes these "law replacements" to a large extent (with the consequence that the Adobe EULA is illegal and invalid in Europe).</p>
      <p>As regards this situation, I made this cynical remark</p>
      <p><a href="http://www.sanskritweb.net/fontdocs/fstype.bas" title="http://www.sanskritweb.net/fontdocs/fstype.bas">http://www.sanskritweb.net/fontdocs/fstype.bas</a><br>
      (REM *** E.g. if bit 15 is set, this means that ....)</p>
