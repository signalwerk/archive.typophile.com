      <p><cite>KL, you’re referring to the process of incorporation, but the substance is presumably invalid.</cite></p>
      <p>I was referring to going into a contract by intention: EULAs are not "smuggled" into a purchase as you suggested but are essential part of it. As you know, you don't "buy" fonts (just like you don't "buy" design work) but a license to use it. The license fee is determined by how extensive your use is. And the EULA is a standardized agreement for assumed standard cases.<br>
      Even if some national laws nullify parts of the agreement, still the essense of "purchasing" a font is getting a license whose details are defined in the EULA. (Like, in Germany you do have some rights as a customer, whether the terms of sale mention them, don't mention them, or even say the opposite.)<br>
      And that US copyright law outrightly disrespects type designers' work is still another story.</p>
