      <p>Restrictive EULAs are a good reason not to "buy" fonts, since, obviously, most foundries don't consider your payment a purchase. And quite like any other licensing agreement on the planet, you will never ever own the font as your own.</p>
      <p>I am a letterpress printer and the process tends to require that digital fonts need be modified if they are to appear as they are supposed to when printed. If the manufacturer of a font forbids modification, I don't "lease" their precious commodity.</p>
      <p>How many folks actually even buy fonts that a manufacturer would actually risk discouraging even one sale? If folks who bought fonts paid attention and obliged by the terms of agreement, foundries would be out of business. Is it really the consumer's fault that digital foundries have no other way of protection? If one chooses to freely coattail on unlicensed (and thereby unprotected) font formats, why is the onus placed on the end user?</p>
      <p>Gerald<br>
      The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
