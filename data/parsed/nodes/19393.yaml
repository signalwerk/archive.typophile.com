    html: <p>Si, thanks for that, but I am raising a legal issue here. There is a strong argument to be made that a EULA is NOT a written agreement between a maker and a consumer, and also that the agreement may not be binding or enforceable. For comparison, the sign at the entrance to a parking garage may say that by paying and entering the driver assumes all liability and waives all claims against the owner/operator - and while the consumer has the option to take her business elsewhere, the law in some jurisdictions is that the notice has no effect no matter how phrased.</p>
