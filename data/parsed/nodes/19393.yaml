      <p>Mr. Typequake:<br>
      &gt; I read the discussions posted here before, and also elsewhere, but didn’t find anything convincing either way.</p>
      <p>Mr. Daniels:<br>
      &gt; Yikes! Maybe I should change my icon! </p>
      <p>The problem with Typophile is that, whenever someone asks a serious question, for instance here about the validity of EULAs, the discussion usually very fast degenerates into off-topics such as</p>
      <p>- Wow, a nice typeface<br>
      - I should redesign my logo<br>
      - I prefer beer brewed by ...</p>
      <p>Here in Europe, most EULAs concocted by American companies are illegal. The reason why Microsoft (the corporation Mr. Daniels is working for) is under constant supervision by the European Union as a law breaker is because Microsoft is stubbornly breaking European law.</p>
      <p>Memorize this:</p>
      <p>*** Whoever thinks EULAs of font outfits are legal and valid ***<br>
      *** should have his head examined by a shrink in a loony bin. ***</p>
      <p>Below I attach an English translation of the section of the German Civil Code containing a long list of illegal and invalid provisions in EULAs.</p>
      <p>German Civil Code - Bürgerliches Gesetzbuch (Excerpt)<br>
      ...<br>
      Section 2: Shaping contractual obligations by means of standard business terms</p>
      <p>§ 305 Incorporation of standard business terms into the contract<br>
      (1) Standard business terms are all contractual terms pre-established for a multitude of contracts which one party to the contract (the user) presents to the other party upon the conclusion of the contract. It is irrelevant whether the provisions appear as a separate part of a contract or are included in the contractual document itself, how extensive they are, what script is used for them, or what form the contract takes. Contractual terms do not constitute standard business terms where they have been individually negotiated between the parties.<br>
      (2) Standard business terms are incorporated into the contract only if, during the conclusion of the contract, the user<br>
      1. expressly draws the other party's attention to them, or if, on account of the way in which the contract is concluded, an express reference to them is unreasonably difficult, he draws his attention to them by means of a clearly visible sign at the place where the contract is concluded and<br>
      2. gives the other party, in a reasonable manner that also appropriately takes account of any physical handicap of the other party discernible by the user, the possibility of gaining knowledge of their content,<br>
      and if the other party agrees that they are to apply.<br>
      (3) Subject to observance of the requirements set out in subsection (2) above, the parties may agree in advance that particular standard business terms will apply to a particular type of legal transaction.</p>
      <p>§ 305a Incorporation in special cases<br>
      ...</p>
      <p>§ 305b Precedence of individually negotiated terms<br>
      Individually negotiated terms take precedence over standard business terms.</p>
      <p>§ 305c Surprising and ambiguous clauses<br>
      (1) Provisions in standard business terms which in the circumstances, in particular in view of the outward appearance of the contract, are so unusual that the contractual partner of the user could not be expected to have reckoned with them, do not form part of the contract.<br>
      (2) In case of doubt, standard business terms are interpreted against the user.</p>
      <p>§ 306 Legal consequences of non-incorporation and invalidity<br>
      (1) If all or some standard business terms have not become part of the contract or are invalid, the remainder of the contract continues to be valid.<br>
      (2) Where provisions have not become part of the contract or are invalid, the content of the contract is determined by the statutory rules.<br>
      (3) The contract is invalid if one party would suffer unreasonable hardship if he were bound by the contract even after the amendment provided for in subsection (2) above.</p>
      <p>§ 306a No circumvention<br>
      The rules in this section apply even if they are circumvented by other arrangements.</p>
      <p>§ 307 Review of subject-matter<br>
      (1) Provisions in standard business terms are invalid if, contrary to the requirement of good faith, they place the contractual partner of the user at an unreasonable disadvantage. An unreasonable disadvantage may also result from the fact that the provision is not clear and comprehensible.<br>
      (2) In case of doubt, an unreasonable disadvantage is assumed if a provision<br>
      1. cannot be reconciled with essential basic principles of the statutory rule from which it deviates, or<br>
      2. restricts essential rights or duties resulting from the nature of the contract in such a manner that there is a risk that the purpose of the contract will not be achieved.<br>
      (3) Subsections (1) and (2) above, and §§ 308 and 309 apply only to provisions in standard business terms by means of which provisions derogating from legal rules or provisions supplementing those rules are agreed. Other provisions may be invalid under subsection (1), sentence 2, above, in conjunction with subsection (1), sentence 1, above.</p>
      <p>§ 308 Clauses whose validity depends on an appraisal<br>
      In standard business terms the following terms, in particular, are invalid:<br>
      1. (period for acceptance or performance)<br>
      a provision by which the user reserves the right to an unreasonably long or inadequately specified period for acceptance or rejection of an offer or for performance; this does not include reservation of the right to perform only after expiry of the period for revocation or return under §§ 355 (1) and (2) and 356;<br>
      2. (additional period for performance)<br>
      a provision by which the user, in derogation from legislative provisions, reserves the right to an unreasonably long or inadequately specified additional period within which to perform;<br>
      3. (right of termination)<br>
      the stipulation of a right for the user to free himself, without an objectively justified reason specified in the contract, of his duty to perform; this does not apply to a contract for the performance of a recurring obligation;<br>
      4. (right of amendment)<br>
      the stipulation of the user's right to alter or depart from the promised performance, unless, taking into account the user's interests, the stipulation to alter or depart from performance is reasonable for the other party;<br>
      5. (fictitious declarations)<br>
      a provision whereby a declaration of the user's contractual partner is deemed or not deemed to have been made by him if he does or fails to do a particular act, unless<br>
      a) he is allowed a reasonable period within which to make an express declaration and<br>
      b) the user undertakes to draw to his attention at the beginning of the period the particular significance of his conduct; this does not apply to contracts in which the whole of Part B of the contracting rules for award of public works contracts is incorporated;<br>
      6. (fictional receipt)<br>
      a provision which provides that a declaration by the user of particular importance is deemed to have been received by the other party;<br>
      7. (winding-up of contracts)<br>
      a provision by which, in the event that one of the parties to the contract terminates the contract or gives notice to terminate it, the user can demand<br>
      a) unreasonably high remuneration for the utilisation or use of a thing or a right or for performance made, or<br>
      b) unreasonably high reimbursement of expenditure;<br>
      8. (unavailability of the object of performance)<br>
      a stipulation permitted under 3. above of the user's right to free himself of his obligation to perform the contract if the object of the performance is not available, unless the user agrees<br>
      a) to inform the other party immediately of the unavailability, and<br>
      b) immediately to refund counter-performance by that party.</p>
      <p>§ 309 Clauses whose invalidity is not subject to any appraisal<br>
      Even where derogation from the statutory provisions is permissible, the following are invalid in standard business terms:<br>
      1. (price increases at short notice)<br>
      a provision which provides for an increase in the remuneration for goods or services that are to be supplied within four months of the conclusion of the contract; this does not apply to goods or services supplied in the course of a recurring obligation;<br>
      2. (right to refuse to perform)<br>
      a provision by which<br>
      a) the right under § 320 of the contractual partner of the user to refuse to perform is excluded or restricted, or<br>
      b) a right of retention of the contractual partner of the user, in so far as it arises from the same contractual relationship, is excluded or restricted, in particular by making it subject to recognition by the user of the existence of defects;<br>
      3. (prohibition of set-off)<br>
      a provision by which the contractual partner of the user is deprived of the right to set off a claim which is undisputed or has been declared final and absolute;<br>
      4. (notice, period for performance)<br>
      a provision by which the user is relieved of the statutory requirement to give notice to the other party to perform or to fix a period for performance or supplementary performance by him;<br>
      5. (lump-sum claims for damages)<br>
      stipulation of a lump-sum claim by the user for damages or for compensation for reduction in value, if<br>
      a) the lump sum in the cases in question exceeds the damage expected in the normal course of events or the reduction in value which normally occurs, or<br>
      b) the other party is not given the express right to prove that damage or reduction in value has not occurred or is materially lower than the lump sum agreed;<br>
      6. (penalty)<br>
      a provision by which the user is entitled to receive payment of a penalty in the event of non-acceptance or late acceptance of performance, delay in payment or in the event that the other party withdraws from the contract;<br>
      7. (exclusion of liability for death[ 4 ], injury to body and health and for gross fault)<br>
      a) (death and injury to body and health)<br>
      exclusion or limitation of liability for losses arising out of death, injury to body or health caused by negligent breach of duty by the user or a deliberate or negligent breach of duty by his statutory agent or a person employed by him to perform the contract;<br>
      b) (gross fault)<br>
      exclusion or limitation of liability for other losses caused by a grossly negligent breach of duty by the user or a deliberate or grossly negligent breach of duty by a statutory agent of the user or by a person employed by him to perform the contract;<br>
      a) and b) above do not apply to restrictions of liability in the terms of transport, authorised in accordance with the Passenger Transport Act, of trams, trolley buses and motor vehicles in scheduled services, in so far as they do not derogate, to the detriment of passengers, from the Regulation concerning the terms of transport by tram and trolley bus and by motor vehicles in scheduled services of 27 February 1970; b) above does not apply to restrictions of liability for State-approved lottery or raffle contracts.<br>
      8. (other exclusions of liability in the event of breach of duty)<br>
      a) (exclusion of the right to withdraw from the contract)<br>
      a provision which, upon a breach of duty for which the user is responsible and which does not consist in a defect of the thing sold or the work, excludes or restricts the other party's right to withdraw from the contract; this does not apply to the terms of contract and tariff rules referred to in No. 7 on the conditions set out therein;<br>
      b) (defects)<br>
      a provision by which, in contracts for the supply of new, manufactured things or of work,<br>
      aa) (exclusion and reference of claims to third parties)<br>
      claims against the user on account of a defect as a whole or with regard to individual elements of it are excluded entirely, restricted to the assignment of claims against third parties, or which make the pursuit of legal proceedings against third parties a condition precedent;<br>
      bb) (restriction to supplementary performance)<br>
      claims against the user are restricted, entirely or with regard to individual elements, to a right to supplementary performance, unless the other party is given an express right to claim a price reduction if supplementary performance is unsuccessful or, except where the defects liability is in respect of building work, to choose to terminate the contract ;<br>
      cc) (expenditure incurred in the course of supplementary performance)<br>
      the user's obligation to bear the expenditure necessary for supplementary performance, in particular the costs of carriage, transport, labour and materials, is excluded or restricted;<br>
      dd) (withholding of supplementary performance)<br>
      the user makes supplementary performance conditional on the prior payment of the entire price or, having regard to the defect, an unreasonably high proportion thereof;<br>
      ee) (time-limit for notice of defects)<br>
      the user fixes a period within which the other party must give notice of non-obvious defects which is shorter than the period permitted under ff) below;<br>
      ff) (facilitation of limitation)<br>
      facilitates the limitation of claims on account of defects in the cases set out in § 438 (1), No. 2 and § 634a (1), No. 2, or, in other cases, results in a limitation period of less than one year from the date on which the statutory period of limitation begins; this does not apply to contracts in which the whole of Part B of the contracting rules for award of public works contracts is incorporated;<br>
      9. (period of recurring obligations)<br>
      in a contractual relationship concerning the periodic delivery of goods or the periodic supply of services or work by the user,<br>
      a) a contract duration which binds the other party for more than two years,<br>
      b) a tacit extension of the contractual relationship which binds the other party for a period of more than one year in each particular case, or<br>
      c) to the detriment of the other party, a period of notice to terminate the contract which is more than three months prior to the expiration of the initial or tacitly extended period of the contract;<br>
      this does not apply to contracts for the supply of things sold as a unit, to insurance contracts or contracts between the owners of copyrights and of claims and copyright collecting societies within the meaning of the Protection of Copyrights and Related Rights Act;<br>
      10. (change of contract partner)<br>
      a provision whereby in sales contracts, contracts for the supply of services or contracts for work a third party assumes or may assume the rights and obligations of the user under the contract, unless the provision<br>
      a) specifies the third party by name, or<br>
      b) gives the other party the right to withdraw from the contract;<br>
      11. (liability of an agent on conclusion of the contract)<br>
      a provision by which the user imposes on an agent who concludes the contract for the other party,<br>
      a) the agent's own liability or duty to perform the contractual obligation without having made an express and separate declaration in that regard, or<br>
      b) where the agent lacks authority, liability which exceeds that under § 179;<br>
      12. (burden of proof)<br>
      a provision by which the user alters the burden of proof to the detriment of the other party in particular by<br>
      a) imposing the burden in respect of circumstances which fall within the scope of the user's responsibility, or<br>
      b) requiring the other party to acknowledge particular facts;<br>
      Subsection b) above does not apply to acknowledgments of receipt which are separately signed or bear a separate, qualified electronic signature;<br>
      13. (form of notices and declarations)<br>
      a provision by which notices or declarations to be given to the user or third parties are subject to a stricter requirement than the need for writing or to special requirements with regard to receipt.<br>
      ...</p>
