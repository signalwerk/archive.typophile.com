      <p>Karsten,</p>
      <p>I did not suggest eulas are smuggled, and I didn't allude to anyone's folly. I have no agenda here :-)</p>
      <p>The fact that a eula is a "license" doesn't decide the issue. Vendors will always try to dictate the terms of a deal, and may use whatever legal terms they want, yet the law may say something different. Recall my original microsoft example? Here's another, from a completely different field:</p>
      <p>A manufacturer supplies goods (say toys) to a retailer, but doesn't get paid for 60 days. What happens if the retailer goes bankrupt? The manufacturer loses the goods and becomes just another creditor (who gets little). So the manufacturer says: "I am not selling you the goods, but retain them as my property and give them to you on consignment (that means that you sell them on my behalf and I pay you a commission; you never get title to the goods). If you go bankrupt, I reclaim my property."  Does this work? Maybe, depending on the law of the land. Do you see my point?</p>
      <p>As for embedding, I meant that a court may be more inclined to view embedding as a consumer prerogatie, given that embedding really doesn't cause the supplier any harm.</p>
      <p>Cheers.</p>
