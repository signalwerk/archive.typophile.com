    html: |-
      <p>Your combination (Garamond Premier/Myriad) is pretty good. It also would go very well with Minion/Myriad and with Novel/Myriad. Leading and margins are also very good.</p>
      <p>Between the serifs, I think the decision would be made according to OpenType features you may need (Minion does not have small caps numbers, for example).</p>
      <p>About headers, I think it's better to use also Myriad, in a bolder style. To mix Myriad and Frutiger, two very near sans, is not recommended. It's also possible to adopt a third font in a clearly different style. Anyway, I'd preffer to use just two fonts in a nice, clear design as yours.</p>
