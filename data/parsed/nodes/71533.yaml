    <p>Hi there,</p>
    <p>I have been reading the forums for quite a long time, and now I need some advice.</p>
    <p>I am working on a document of intermediate size (more or less a hundred pages, think of it as a "mini thesis"). I am using XeLaTeX to typeset it, and I was wondering if any of you can help me with the font choice.</p>
    <p>For the moment, I opted on Garamond Premier for the text (I really like serif fonts), and Myriad for the headers – see the example PDF file (in french…). I tried a couple fonts for the text (I had a hard time deciding wether I should use Arno, Granjon, Minion or Garamond), but I think this combination is OK in term of readability. For the headers, I tried Frutiger (I like it, but I'm not sure it is "strong" enough to get the reader to focus) and Cronos.</p>
    <p>Does any of you can offer some advice about what other fonts can fit?</p>
    <p>Best</p>
