      <p>These are all very helpful comments, thank you very much.</p>
      <p>I asked my friend about it and indeed he confirmed there is another "protein s", lower case, so actually I am restricted to the use of regular capitals.</p>
      <p>&gt;&gt; <cite>What’s so ugly about a capital S, as in “protein S”? That’s not ugly; that’s what it’s called. And what’s wrong with roman numeral III in caps?</cite></p>
      <p>For me, it's not about ugliness of capitals. It's about the beauty and usefulness of small caps. NOT to use small caps in the cases I listed in my first post, would be just a decision because of professional conventions, not aesthetics.</p>
      <p>&gt;&gt; <cite>The only one of your examples that really cries out for small caps might be the DESCARTES acronym.</cite></p>
      <p>Well, that's another point. My view on typography can be rather black&amp;white. That is to say: if I set the S of "protein S" in regular capital, hence I do the same with the C in "protein C". Off course. But then, why would I use small caps in any case? Setting, for example, DESCARTES in small caps and leaving the roman numerals for what they are, isn't that just an unmotivated, arbitrary choice?</p>
      <p>Shouldn't I better skip the whole concept of small caps, in order to be consistent and logical? Or does that way of thinking lack a certain typographic flexibility?</p>
