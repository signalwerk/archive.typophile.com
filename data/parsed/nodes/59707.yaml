    html: <p>If you are a designer, as opposed to, say, a stylist, you need a working knowledge of the conventions the expected audience will have. Especially true in a dissertation, a work establishing that someone should be admitted to a select community. Unless they are an Einstein, a dissertation is not the place to make waves, and in any case, it is not your place to make them.</p>
