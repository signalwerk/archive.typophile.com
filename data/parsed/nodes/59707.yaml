      <p> An engineer's viewpoint:<br>
       “BASIC" and "UNIX" should be small-caps.  But you can't do that with "C", so "C++" &amp; "C#" also need full caps.  Make sure the operators in “C++” fit nicely; I've seen too many fonts (<em>e.g.</em>, Georgia as used on this site) where the `+' marks were too high or low.  And although the language is officially called "C#", do check if "C♯" might look better.<br>
      —Joel</p>
