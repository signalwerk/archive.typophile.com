    <p>Hello everyone,</p>
    <p>Upcoming days, I'll be working on the design of a dissertation. A friend of mine is becoming a real doctor. In these collection of scientific articles, which, all together, form the body of the dissertation, lots &amp; lots of abbrevations are used, in various kinds. For example:</p>
    <p>protein S, protein A, type III, PS antigen, VTE, ATE, acronyms like 'DESCARTES'.</p>
    <p>For me, it's all mambojambo, but I wanted to be clear and straightforward and set all these abbrevations in (spaced) small caps.<br>
    That's quite a tough job of typographic handwork but I think it's necessary, or at least the best solution.</p>
    <p>Am I right with this?</p>
