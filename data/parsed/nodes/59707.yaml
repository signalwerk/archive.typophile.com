      <p>Don't take my rant personally, Jorik. It's been building for a while.</p>
      <p>I'm just reacting to a trend I sense. After a period (phototype and early digital) when small caps were practically non-existent and sorely missed, suddenly now the pendulum seems to have swung the other way. </p>
      <p>Seems like everyone wants to apply small caps whenever capitals are removed from lowercase. Small caps have become some badge of typographic sophistication, and who doesn't want to be sophisticated? The more you use, the more sophisticated you are, right?</p>
      <p><cite> &gt; Setting, for example, DESCARTES in small caps and leaving the roman numerals for what they are, isn’t that just an unmotivated, arbitrary choice?</cite></p>
      <p>I suppose one might think so. But if setting a long acronym in small caps, in order to prevent a dark reading distraction in the text, causes one to also set roman numerals in small caps, wherein they become momentarily confusing to the reader and unclear as roman numerals . . .  then I would suggest that (paraphrasing Emerson) "a foolish consistency is the hobgoblin of little caps."</p>
