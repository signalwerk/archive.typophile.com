      <p><cite>In phototype setting times (no small caps available) it was common to set full cap acronyms half a point smaller.</cite></p>
      <p>Interesting observation. My experience (back to 1980 anyway) runs the other way, in phototype setting times, designer's dealing with extended text would choose a font that had small caps available. Sort of an extension of the thinking from hot metal; most type shops would have four or five or even six type families appropriate for setting extended text, and the designer would choose from those.</p>
      <p>I suppose advertising design and composition might have been different.</p>
      <p>Which maybe points up the range of responses in this thread. Type designers tend to think in theoretical terms, where the only theory at play is typographic theory.</p>
      <p>Type users split into at least two groups. One is broadly termed ephemeral printing, where the display type may be most important and chosen first. Usually the amount of text is so small that manipulation of characters or their setting is not a problem. Another group would be book typography, which has different expectations about a reader (including how many hours he/she has to spend with the text). I suppose today another would be the use of type on the web, and for all I know, that breaks into multiple uses as well.</p>
      <p>Sounding my overused trumpet yet again, The purpose of almost all type is for communication, usually in the form of reading, not hanging on a museum wall. Once you agree on that point, how you view an audience becomes a key concept. And how the (graphic) designer treats that audience is equally key; rarely is it correct for the designer to further their agenda. To do so moves you back toward "audience" in an artistic context; a work hanging on a museum wall.</p>
