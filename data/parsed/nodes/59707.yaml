      <p>Also, I note that protein S is one of the items you listed. A solitary S is notorious for looking like a lower case S when set in small caps. Now I am about as far from a scientist as one can get, but if there is a protein s as well as a protein S, using the small caps might create massive confusion, and perhaps ruin the dissertation.</p>
      <p>Sometimes with technical stuff you have to eat your pride and accept ugly. (Your job becomes one of minimizing the amount of ugly, instead of the usual task of eliminating it.)</p>
