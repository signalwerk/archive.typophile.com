      <p>What Kent said. Learn to stop worrying and love the cap! There’s nothing wrong with unambiguity. Yes, it might stick out. But:<br>
      1) ‘C#’ will <em>always</em> stick out, no matter if it’s set in caps, smaller caps, spaced caps, small caps, or even lowercase. So do figures (Yes, old-style figures aswell).<br>
      2) A scientific text is not a novel. Even there, even color is nice, but not an end in itself.<br>
      F</p>
