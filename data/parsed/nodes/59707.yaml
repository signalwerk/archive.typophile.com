      <p>&gt; Why does everyone hate caps so much?</p>
      <p>The problem with full cap acronyms is that they alter the visual color of the page. Like bold type, or lining numerals, they make little blobs of heavy ink usage on the page. These can impede reading ... the eye is drawn to the heavy area, breaking away from where it was, and then must fight its way back. </p>
      <p>That is the real reason why typographers use small cap acronyms, old style figures, and italic instead of bold for emphasis, with the exception of books designed to make the eye jump to certain locations (dictionaries and key words in a textbook, as examples).</p>
      <p>Some people say they use them because they like the look of them, or that they are different. For me that isn't enough.</p>
      <p>A single letter in full caps is not a problem, except that of consistency. I always had problems with US when dealing in small caps, as it looks like the word us went set in SC. I always tried to get editor's permission to use USA instead.</p>
