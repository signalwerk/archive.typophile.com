      <p>Smallcaps are used in mathematical texts to typeset words like THEOREM but I don't remember having seen them for acronyms though Knuth's Computer Modern font, that is used by the American Mathematical Society,  has smallcaps that are quite easy to access.</p>
      <p>Knuth himself, for words like MIX (his computer language), uses CM Typewriter. Here is the word BASIC in CM Roman, CM Typewriter and CM Roman smallcaps.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/basic_6727.jpg"></div><br>
      You can see that the cap height of the typewriter font is between that of the small cap and that of the fullcap.<p></p>
      <p>Here is C++ in CM Roman  and CM Typewriter<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Cplusplus_4086.jpg"></div><br>
      Michel<p></p>
