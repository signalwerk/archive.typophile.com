      <p>Yes, I'm quite aware of the problem. Small caps aren't the only solution and not always the most appropriate. As I suggested, adding some extra air can also be effective. I think we can agree that even color is the common goal. </p>
      <p>I have no objection to small caps in general. Hell, I use them all the time myself. What I'm [over] reacting to is an unexamined notion that "Two or More Caps Together" in text automatically signals "Use Small Caps."</p>
