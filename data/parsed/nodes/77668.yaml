      <p>Thank you to everyone!!</p>
      <p>In the end my client wanted to maintain the leaf, so I adjusted it and made it more legible as suggested.</p>
      <p>It still need some tweaking , but I think that the major part it's done.</p>
      <p>@ Sevag Blanc: thanks for taking the time to give me ideas! I will definetly take these in consideration but for the colour I guess I can't do much as the logo will be printed in cardboard most of the times :(</p>
      <p>@apankrat : thank you for the constructive comment, you got the idea perfectly.</p>
      <p>@Luma Vine: Damn, in this logo sea it seems that having an original idea is becoming more dificult day after day... I haven't seen that before anyway, but I'll stick to a different leaf style..  I have tight, really tight deadlines for this logo so , as the two companys are in different part of the world and, most important, they offer different services, I'll stick to this concept.</p>
      <p>Again, thanks to everyone for taking the time and let me know what do you think of this upgrade!</p>
