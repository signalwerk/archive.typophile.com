    <p>Hi everybody,</p>
    <p>I just finished the first concept for a renewable energy company called "Natural Power". This italian company sells solar panels, geotermic and wind mills solutions and needed a strong and expandable logo.</p>
    <p>I created the below concept focusing on their primary comunication needs: Eco friendly and Professional looking.</p>
    <p>The logo needs tweeking here and there, but just consider the idea that's behind this concept. Also consider that this logo will be used almost Everywhere stamped on Cardboard, to maintain it's eco-friendly image.</p>
    <p>Here is it:</p>
