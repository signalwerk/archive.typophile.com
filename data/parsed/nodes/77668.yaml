    html: |-
      <p>While I do enjoy logos that have a hidden element, I would say this one is much too subtle. </p>
      <p>I also agree with Bloodtype about the leaf as a "green" element being a bit played out and a bit unrelated to the company. If you want to continue with the leaf, you could hint at the vein that runs down the center, and I would definitely make the stem wider. If not, I'd love to see some reference to solar energy, geothermic energy, windmills, etc. It would hep you work stand out from the sea of 'green' logos out there.</p>
