  - id: 445998
    user_id: 26767
    user_name: Bloodtype
    user_path: null
    date_raw: 3 Jan 2011 — 1:28pm
    date: 2011-01-03T13:28:00
    votes: null
    html: <p>I really do think we pander too much to clients these days. Time was, you would be able to say, "this leaf idea of yours has been done to death. If you want to stand out, I strongly suggest taking a more original path", and you'd be listened to. Respect for the design profession has taken a nosedive in the past few years, partly due to the proliferation of software and DIY possibilities, but also because we're willing to take it. I know I've been guilty of it in the past, but I hope I've learned from it. If someone says they can't see any difference between my work and some stock logo, or slideshow website, then I'm happy to let them go that way.</p>
