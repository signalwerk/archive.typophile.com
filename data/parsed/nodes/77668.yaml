    html: |-
      <p>I think the original logo is great. The leaf is indeed too subtle and something needs to be done about it, but the modesty of the type decoration is exactly what makes the logo. It is also a nice play on the "natural" aspect - just the natural type with a slight tweak that's sufficient for its purpose (and in this it is different from Sevag's options that are IMO just way in-your-face obvious). Concept-wise I think it's fine too. Leaf = trees = nature, not a big stretch by any means.</p>
      <p>I would consider tightening Natural and perhaps using a bit heavier weight (to make the leaf stand out more).</p>
      <p>(edit) What could be an interesting thing to try is to build an Objectified-style logo out of devices/gadgets they are dealing with. Though I guess this could come out as clone of Objectified design... in any case, just a thought.</p>
