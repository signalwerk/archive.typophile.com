    <p>We want to use this font, Kaczmarek, for the promo title graphics for a new show on CBS Television Network. I can't seem to find where to buy it. I've tried "What the font" and googled it pretty deeply, but not a trace of the word Kaczmarek is related to a font name as far as I can find. And of course I've been to most of the major on-line type foundries and they don't have it either. It has some very unique character shapes, like the angle on the ascenders.</p>
