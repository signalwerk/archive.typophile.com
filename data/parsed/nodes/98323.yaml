    html: <p>Tricky situation! Yeah I don't have an answer but I'd be interested in what others have to say. I think your idea of doing the two different "editions" at two different shops may be the easiest way to handle it, assuming the difference between the deluxe and standard editions is great enough. Otherwise I'd suggest your last option of getting it all done offset if the budget allows. But I don't really know... :-/</p>
