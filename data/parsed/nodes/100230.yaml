      <p>Come one people... there is no need to fight to each other.<br>
      We are all passionate about type! And I guess we can all agree that the history of type is so coiled and complicated, that's is very difficult to know exactly which font is the original one, which ones are original digitalizations (based on scans), and which ones are rip-offs (digitally duplicated and renamed).</p>
      <p>To make things even more complicated, pretty much all the Letraset fonts have been digitized by URW in the early days of Ikarus (in many cases without the consent of the designers, and without paying royalties to the designers), and URW have sub-licensed that font data to a lots of other people... So, many of the so called rip-off, are actually sub-sub-sub-licensed versions of the URW data... while other are simple revivals based on scans. Those fonts are still floating around and will continue to be online forever (both for sale and for free), and the legal versions of the digitized Letraset fonts are in many cases much more illegitimate than the free versions.</p>
      <p>To make things much more complicated.. in the US is completely legal to digitize fonts from old specimens scans.. so there are many digitalizations done, not only by amateurs but mostly by foundries (big and small). Some foundries ask for permission (which is great) but not all, since it's not a requirement to do so. And in many cases the designers are death also, so there is no one to ask permission for. As a result, about 90% (or more) of commercial digital fonts are revivals, or "modernizations" of old designs.</p>
      <p>Also, the fact that there are many "legal clones" (think Helvetica/Arial, Palatino/Book Antiqua, etc...) make it really hard to understand how all this things works for the people that are not deep into this subjects (the average user).</p>
      <p>Users are typically accused of piracy... but what about the foundries?  They started it all :)<br>
      "One of the most important methods of mechanical development to affect typefounding was the invention of a method where the matrices could be made by the electrotyping process. This practice bypassed the cutting of punches, allowing a foundry to duplicate a competitors type by simply purchasing a font and then molding each character in wax and obtaining by electro-deposit a copy from which to manufacture a set of matrices.<br>
      Perfected in 1845 by Edwin Starr in Philadelphia, the method initiated the pirating of printing types on a large scale. It also contributed greatly to the difficult of identifying a type, as the same design appeared under a dozen of different names.<br>
      The final mayor contribution to the multiplication of new types was the matrix-engraving machine. Invented by Linn Boyd Benton in 1885, this device eliminated the need for hand-cutting a steel punch."<br>
      Anatomy of a Typeface, Alexander Lawson</p>
      <p>BTW: Harassing users for asking type ids, it's like abusing the most defenseless of the herd. Most of the people asking for font ids and searching for downloads are not "hedonistic vultures", they are simply people that don't know enough about how typefaces are made, basically because they think that fonts "just come on the computer" (as I used to think a few years ago). Once that people learn more about type, and learn about the designers, they start caring and buying fonts (as I do now). Educating those user in a friendly way is much better than harassing them.</p>
