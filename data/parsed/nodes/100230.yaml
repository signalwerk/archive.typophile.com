      <p>Mike, I'm sorry, I can't afford to waste time following the antics in Mos Eisley. I pick my fights very carefully. This is not a crusade - it's a defensive action (even if it's long overdue).</p>
      <p>It's not just about you (just like it's not just about me). In fact I think you're far better than most. But yet you fail to see the problem. I say this not only based on how you react to me actions, but because of your <em>lack</em> of action in certain telling situations.</p>
      <blockquote><p>You clearly think that identifying fonts for a large group of posters is tantamount to disrespecting commercial font-makers.</p></blockquote>
      <p>Incorrect.<br>
      Besides being illogical, that would be far too dogmatic. You're reading things into my posts that make it easier to attack me; you're not actually addressing my contentions. When I say -and it's clear to anybody paying attention- that I haven't been confronting people merely <em>asking</em> for type IDs and you still come back with the same false accusation*, I don't know what to think about your clarity of thought. Although I personally don't feel comfortable IDing fonts for strangers, I don't expect people to follow suit. I'm not asking anybody to stop doing that. That's what I call pragmatic.</p>
      <p>* Which, as you can see, is contagious.</p>
      <blockquote><p>Which would you have us do?</p></blockquote>
      <p>What I <em>do</em> expect (and only because it's a big way of making this place healthy) is for people to care about the making of type, not just satisfying their urge to ID type. When somebody with a good nose says "be cautious", don't have a raging reaction. Don't use ideas like "All Font Makers should know the business model they are working under does not protect them" to justify riding roughshod over the rights of designers. That sort of thing. Simple, old-fashioned mindfulness. Minding the community, the vehicle that allows you to derive the pleasure, not just the pleasure itself.</p>
      <p>And I've stated all this before (in a reply to Ryuk about a week ago) but clearly not enough people are paying enough attention.</p>
      <p>You seem to care about more than IDing*. But some people here clearly don't. And <em>you</em> need to confront them just as much as I do - in fact perhaps more, so you avoid people thinking that <em>all</em> type-ID people are scum.</p>
      <p>* <a href="http://typophile.com/node/100241" title="http://typophile.com/node/100241">http://typophile.com/node/100241</a></p>
      <p>Why do you think there's near-zero interaction between people who frequent the ID section versus people who frequent the other sections? Is this a healthy situation? No. Is it correctable? Yes.</p>
      <blockquote><p>I made Gradl Max</p></blockquote>
      <p>Which explains why you're more sensitive than most. But you're not the only one here, and you shouldn't align yourself fully with one group, while only ever attacking the other group. I've seen many cases where somebody like you should have been on my side; but you only ever defend people who -from your own characterization of yourself- you should not blindly agree with, or even turn a blind eye to.</p>
      <p>hhp</p>
