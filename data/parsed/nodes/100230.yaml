      <p>Tabasco is a very old font, digitized by various people (as well as many other Letraset and metal typefaces). Some digital versions are free, some are commercial, some has better quality, some others are crappy... but none of them is more legitimate or illegitimate than the others (As long as they are original digitalizations from scans, and not duplication of an existing digital version).<br>
      Assuming that a font is illegitimate just because it's free, it's a wrong assumption.</p>
