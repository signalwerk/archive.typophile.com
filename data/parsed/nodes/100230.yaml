      <p>Hrant - Working a long stretch of 13 hour night shifts has made it difficult to defend myself against your accusations - especially regarding disrespect to those I'll call font-makers. This has been especially hurtful. If you find the time, please see <a href="http://old.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=129006" target="_blank" rel="nofollow">this running MyFonts WTF thread</a>. If you do a browser Search on 'Mike', there will be lots of hits - but, starting at about the 17th hit, who I am typographically will become evident. It includes <strong>the utmost respect for type designers and makers.</strong> Add to that plenty of posts trying to educate errant posters and literally hundreds of moderator edits removing references in posts to ripoff clones and bad links.</p>
      <p><em>What's unethical is ignoring the dedication and effort that goes into making a font for the base personal pleasure of IDing a font, often for somebody who might use the information to pirate the font.</em></p>
      <p>Here is the heart of the problem between us. You clearly think that identifying fonts for a large group of posters is tantamount to disrespecting commercial font-makers. Who makes up that group? Well ... among many others, that would be the home scrapbooker, the fellow looking to mimic an album cover for a friend and - the really hard nut for you - the small-time designer with zero budget.</p>
      <p>You assume that they will not buy an identified commercial font. In the case of the first two, odds are high that you are right. These are people knowing little about fonts in general and totally ignorant of font ethics. They are probably not going to buy a font for their little home project - and, in my view, so what? By providing an ID and commercial link, there's a chance they might make the expenditure. If, instead, they go out and download the font from the Internet without paying, the font-maker has lost nothing. This user was never a potential customer.</p>
      <p>You think that this situation cheapens Typophile ... but <em>how</em> exactly? Do you imagine that future posters seeking IDs scan through prior posts at all? No, they don't. Thinking this is a place to get fonts identified (imagine that), they simply post and await an answer. No idea of what Typophrant stands for.</p>
      <p>That leaves the small-time designer with zero budget. My argument is exactly the same except that this poster is at least a little more likely to pay for a font.</p>
      <p>In any case, I see two approaches to how you would prefer we handle the posts by this group of posters (the majority of posters, I believe):</p>
      <p>1)  Challenge them up front about their intentions (how did that go for you?). Yeah, that will make font buyers out of them and improve the perception of this forum. I don't think so.</p>
      <p>2) Ignore their requests. I suspect that this is what you'd like us to do with those you consider "suspect".</p>
      <p>Which would you have us do? You claim to be a pragmatist. I say that I am more pragmatical. Your approach pretty much negates any possible font purchase. Mine makes it a possibility. We font ID hobbyists are clearly held in much disdain by you - and yet we provide much more potential income for font-makers than your extreme approach. Friendly and helpful versus confrontational and nonhelpful. Which further aids font-makers, eh?</p>
      <p>Regarding two other accusations thrown my way ...</p>
      <p>1) Why haven't I posted challenges to those who have shown clear intent to pirate or against obvious pirate fonts?</p>
      <p>Really simple: My work schedule is stretches of 13-hour night shifts - which allows me to, um, binge-post when <em>not</em> working and by the time I see them, those posts have already been challenged. Redundancy is pointless.</p>
      <p>2) If my disdained-by-you group of hobbyist font IDers had ever actually made a font, we'd have more empathy with font-makers.</p>
      <p>I played around plenty with creating fonts. Sought out lots of educational info from lots of sources -including Typophile forums. Eventually, I made <a href="http://www.myfonts.com/fonts/freshair/gradl-max/" target="_blank" rel="nofollow">Gradl Max</a>. After basic, very time-consuming fontmaking, I had to learn kerning (not perfect, I know) and worked hard on extrapolating lots of glyphs that didn't exist in Gradl's lettering.</p>
      <p>In conclusion, I practice my hobby in a way I believe best respects font-makers. I do so, as well, in a way that respects the posters you seem to see as horrible lowlifes.</p>
    html_clean: |-
      <p>Hrant - Working a long stretch of 13 hour night shifts has made it difficult to defend myself against your accusations - especially regarding disrespect to those I'll call font-makers. This has been especially hurtful. If you find the time, please see <a href="http://old.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=129006" target="_blank" rel="nofollow">this running MyFonts WTF thread</a>. If you do a browser Search on 'Mike', there will be lots of hits - but, starting at about the 17th hit, who I am typographically will become evident. It includes <strong>the utmost respect for type designers and makers.</strong> Add to that plenty of posts trying to educate errant posters and literally hundreds of moderator edits removing references in posts to ripoff clones and bad links.</p>
      <p><em>What's unethical is ignoring the dedication and effort that goes into making a font for the base personal pleasure of IDing a font, often for somebody who might use the information to pirate the font.</em></p>
      <p>Here is the heart of the problem between us. You clearly think that identifying fonts for a large group of posters is tantamount to disrespecting commercial font-makers. Who makes up that group? Well ... among many others, that would be the home scrapbooker, the fellow looking to mimic an album cover for a friend and - the really hard nut for you - the small-time designer with zero budget.</p>
      <p>You assume that they will not buy an identified commercial font. In the case of the first two, odds are high that you are right. These are people knowing little about fonts in general and totally ignorant of font ethics. They are probably not going to buy a font for their little home project - and, in my view, so what? By providing an ID and commercial link, there's a chance they might make the expenditure. If, instead, they go out and download the font from the Internet without paying, the font-maker has lost nothing. This user was never a potential customer.</p>
      <p>You think that this situation cheapens Typophile ... but <em>how</em> exactly? Do you imagine that future posters seeking IDs scan through prior posts at all? No, they don't. Thinking this is a place to get fonts identified (imagine that), they simply post and await an answer. No idea of what Typophrant stands for.</p>
      <p>That leaves the small-time designer with zero budget. My argument is exactly the same except that this poster is at least a little more likely to pay for a font.</p>
