      <p>You're right that it's all very complicated, and large companies are indeed often guilty. But that does not excuse anybody else being guilty (it's highly irresponsible to encourage others to act unethically by pointing out guilty people*) and this is not about specifics: we can discuss -even argue about- what font has what sort of legitimacy; everybody makes mistakes, and everybody should be open to changing his mind, and even apologizing. That's not the point. The point is when you don't care about the people whose work you so enjoy identifying, the people who happen to be the reason the place you're enjoying exists, you will find yourself confronted by people who do care about those things. Caring is a Good Thing. <em>That</em> is not complicated.</p>
      <p>* And you of all people should appreciate the difference between legal and ethical.</p>
      <p>BTW: You should have noticed that I haven't been "harassing" the people who <em>ask</em> for IDs (except when they boast of pirating fonts, which is rare) because as you say they mostly have no idea (and are -individually- too transitory to matter). They're not the ones who make Typophile. The people I confront are those that are doing damage by not caring. The people who recommend fonts without caring about their legitimacy, who <em>never raise a finger</em> to correct any sort of damaging behavior, caring only about satisfying their personal pleasure.</p>
      <p>hhp</p>
