    html: |-
      <p>I like the feel of this! Interesting design.<br>
      Just remember that those sharp corners and points, and details like the top of the "t", will not come out as sharp (and not exactly the same anyway) in a tattoo – and then continue to blur for the rest of the subject's life. How large is this going to be?<br>
      Depending on intended size, I'd say don't be too "sophisticated" in the micro details. Like, I might strengthen the crossbars of the "t"s, and not let the top left of "i" and "t" taper into a point, but make it a bit blunter. </p>
      <p>Does the "i" need more overshoot on the x-line?<br>
      Also, the tittle looks a bit shy and awkward rather than full of intent to me.</p>
      <p>Funny with the ball terminal on the "e", but you might want to fiddle some more with it, its rotation and oblong-ity seems a bit uncomfortable. Have you tried a lachrymal?<br>
      The "e" might also look like it's leaning forward? (But I haven't had enough coffee.)</p>
