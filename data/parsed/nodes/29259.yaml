    <p>I know you’ve all have been itching for a chance to get back at Chris Lozos after his shameless scare tactic posters series, right? Right?</p>
    <p>Well, here’s your chance, ladies and gentlemen. Though I have to admit that mine, being hastily made at 12:30 am, neither have the proper visual substance nor word/sentence pun.</p>
    <p>You know, actually this topic would be a nice chance to get a visual overview of the many faces that we all made, completed or not.</p>
    <p>Of course you are welcome, too, Chris. I was just kidding :)</p>
    <p>Allright, let’s get grilling.</p>
    <p></p><div class="imageWrap"><img src="/files/glasses_5125.png"></div><p></p>
