  - id: 52317
    user: 909
    date: 2004-11-16T11:31:00
    date_raw: 16 Nov 2004 — 11:31am
    votes: null
    html: <p>Windows Type 1 fonts always worked fine for me in InDesign on Mac OS (even back in ID 2 on OS 9). Just had to put them in either the shared Adobe fonts folder, or the ID private fonts folder, per the documentation. <br> <br>Note that a Windows Type 1 font consists of two parts, the .PFB and .PFM files. Also, as always you need to make sure that you don't have any conflicting fonts installed that use the same names. Mac OS, and OS X even more so, ships with a bunch of TrueType fonts (now packaged as dfonts) that have the same names as common Type 1 fonts. <br> <br>Regards, <br> <br>T</p>
