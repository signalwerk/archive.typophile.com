  html: <p>I guess this should really be in Build, but that topic seems to be locked ...  <br> <br>In the InDesign manual it states pretty clearly that PC fonts, TT and T1, should be available to InDesign on OSX when put in InDesign's own Fonts folder. Neither me nor my printer have been able to get this to work. Is this one of those, er, 'unfeatured documenteds' like the InDesign Interchange format? <br> <br>TIA, <br> <br>Rob</p>
