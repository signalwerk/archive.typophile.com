    html: "<p>I apoligize for the misspell; I was thinking about it's visual characteristics as opposed to what it was going to say. <br> <br>I really want to avoid the word \"express\" though.  I constantly see that word being used for logistics, transportation via air, road or train and many other trade companies - even credit cards (American Express).  I think it's one of those words like \"soft\" at the end of software companies, or even more generic than that.  In this industry though, people use company suffixes like \"express\", \"global logistics\", \"logistics\", \"transportation\",  etc. way too much.  Federal Express even realized how generic the words really are and went with something more unique: FedEx. <br> <br>\"Connect\" can be kind of cliche too, like express, but it fits since carriers really aren't that connected to the border.  They often cross blindly and find out if the shipment was not released when they arrive.  This happens because they are working on assumptions and information from sources they cannot control.  Our software tries to directly connect them with their border crossing activities rather than going through brokers over the phone.   It also works in the literal sense since a major component of our software is called the Customs Internet Gateway, which is the connectivity module that sends and receives digital messages directly from Canada customs.  That's why I think \"direct\" can be a very good word for a tagline and I'm very appreciative for this suggestion.  I makes a lot of sense to me. <br> <br>Does anything I've said help clarify what the service does?</p>"
