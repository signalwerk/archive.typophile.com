    html: <p>Still looking through magazines it seems if I ever did put an ad in one, we'd stand out quite a bit.  9/10 companies use italics in the company name, tagline or both.  If they don't, they use an arrow or a swoosh.  I'm glad BorderConnect doesn't use any of these.   <br> <br>I also notice that delivering shipments "on time, every time" is a popular phrase that everyone copies off each-other.  Most of them say they provide everything from e-commerce to warehousing to frieght forwarding to whatever.  It's funny because if every company does everything, what's the point of letting people know?  It seems that nobody is doing anything different.  Well, there was this "Plan Bee" company that really had something neat going for it.  DHL's ad was good too. <br> <br>I know BorderConnect doesn't even compete in the slightest with any logistics company (not even the same thing in the slightest), but there really isn't much to look to with respect to people in the same industry other than maybe carriers and companies targeting the drivers themselves. <br> <br>Anyway, looking forward to trying out those modifications and seeing how they look.</p>
