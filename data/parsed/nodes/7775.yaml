    date_raw: 20 Nov 2004 — 3:46pm
    votes: null
    html: "<p>I know I tried the sentence case on the old fonts and never liked any of them, but I didn't try it with the new sans.  When I get back to work tomorrow, I'll post up a sentence case dax, italic dax and sentence case with and without italics of the one I have now.   <br> <br>I usually stay away from italics though because it looks cheesy most of the time.  I only use it to highlight a word or two within a phrase or sentence.  That's where I've seen the best results myself anyway.  When I think of italics, I think of those trucker and logistics logos where everything is in italics.   Actually, I was just looking in a logistics magazine to try and deduce the marketing direction and culture of other compnaies and I came across this company: <a href=\"http://www.amerijet.com/\" target=\"_blank\">http://www.amerijet.com/</a>   That logo looks like ****.  Here is another one in the same magazine: <a href=\"http://www.averittexpress.com/\" target=\"_blank\">http://www.averittexpress.com/</a>.  These guys have no sense of good marketing as they are watering down the meaning of their brands, declassifying their niches and generally look like poop.  There are hundreds of these companies in the trade industry and have given italics a really bad name.  In a way, not using italics would stand out more. <br> <br>However, I'll be sure to try it just in case.  I don't want to miss out on a positive change simply because I'm biased. <br> <br>Thanks again Dan for your great comments.</p>"
