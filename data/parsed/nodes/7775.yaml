is for carriers, I want to let them know that.  Note that I don't mean drivers because they have no authority to make the purchase.  I've found that only operations directors or even the evp/vps/etc. typically sign on to our system, not the dispatcher managers or drivers.  So, it needs to appeal to them while also letting them know the service is really meant to help the dispatch personnel and the drivers. <br> <br>I also want to convey that BorderConnect allows a carrier to basically cross the border more reliably/predictably because they are now empowered to make decisions before the last minute with this real-time information. <br> <br>I'm finding it hard to convey this brand though.  It's hard not to use cliches like arrows which are very, very abused in this industry.  I also want to avoid swooshes and the like obviously.  I want to make something that is not trendy.  I strive to make the mark/type reflect the qualities of the service and the name itself.  I like it when logos have a logical purpose to them while being intuitive as well.  I'm just not very skilled at doing that. <br> <br>Here are some versions I have made myself.  I'd feel very appreciative if anyone can critique them and help me focus on an idea that actually works.  Please be very critical and let me know what you think.  I'm just getting frustrated, not being a real designer or anything (just a software programmer).</p>
