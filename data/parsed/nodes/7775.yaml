    html: "<p>Wow, those were some nice suggestions DeWitt Brinson.  I too am a big fan of the B in Dax.  I tried a lot of fonts and kept switch back to Dax every time just for the B.  I also really like how soft the C and the o read together while not being too round and bubbly. <br> <br>Some of your taglines were very good.  Actually, the one that says, \"We'll get your truck through, damn it\" was hilarious.  I know this was not serious, but it made laugh out loud a bit and put a smile to my face.  However, \"Borders were made for crossing\" is fantastic.  I liked that one so much that I took out all the logos/marks and just kept the font with this tagline.  Here it is: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/53996.gif\" alt=\"\"> <br> <br>I'm really liking this so far.  Thanks so much for all of your input.  This is making me feel a lot more confident that the this is going right direction after several days of being stumped.  I guess I should have given that tagline more thought.  That's why I develop software instead <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
