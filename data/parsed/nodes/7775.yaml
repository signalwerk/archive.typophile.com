    html: "<p>As you can see, I've tried to use lines or frames to communicate the word \"border\".  There actually isn't a lot of well-known companies that have Border in it's name, but for us, it's rather fitting seeing as  we can show a carrier's entire border status in real-time and keep a record of it for 20 years if necessary. <br> <br>The first logo tried to make use of the blue on the site, but I realized that it looked kind of watered down and the greens stood out a lot better.  I think a lot of companies don't really use these colours so they look pretty unique to me.  Besides, a company that sort of competes with us is blue and when I think of maps and borders, I think of land which is brown and green.  I happen to like green better.  Early versions of the software that ran in test used orange and brown actually.  While I can make good use of stylesheets, fonts and padding (I think anyway), it wasn't really working. <br> <br>So, after I decided to go with greens I thought making a frame of a circle would work with the typeface and create a border.  I used a series of connecting arrows to build the frame, which tries to emphasis the connecting-border.  The arrow shows some direction, but it really doesn't suggest that your trucks can get through the border easily.  It makes a \"C\", which also is one of the letters, but I think it looks like garbage and the \"C\" is pretty cliche so off to design #3. <br> <br>In #3, I decided to move the letters closer-together.  This made it look better because the logo wasn't so wide and it gave the feel that the letters \"connected\" better.   I took this concept a little further and tried to illustrate that the letters were connecting as you can see with the 'o' and the first 'n'  I only wanted to use straight lines because lines can resemble borders.  I think it looks clean and has something going for it, but it's noticable from far away so it's pretty worthless seeing as this logo is being posted up on walls, billboards next to border locations across canada and the us possibly. <br> <br>In #4, I went with the literal interpretation of a border and just added an arrow.  This one looks like crap but it was just a thought. <br> <br>#5 is pretty neat but isn't noticable enough.  The O is like a frame or border in of itself and it illustrates the connecting theme.  #6 tries to do the same thing with an actual logo. <br> <br>#7 was just an experiment, something to connect the letters in an interesting way and create a mark in the type. <br> <br>As for the tagline, please don't put too much stock into it because I haven't really thought about it.  I just think I need something there to give the logo more of a rectangular look, otherwise the type just looks too wide.</p>"
