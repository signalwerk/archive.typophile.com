      <p>Thanks for the post. I am very happy with the sales of display fonts, specifically Egyptian, Clarendon, most of the slab genre, etc. For me, this has been a good year and I hope that it will continue. So to answer your question, yes display fonts of the older sort, i.e., nineteenth century in origin have been good for me and if I see a trend in this direction, it certainly is in the slab genre, if evidence of this can be found at myfonts. I like to divide the type world into display and text. A few can make great or at least very good text faces but this is hard. If they are good they will find an audience, and some on myfonts and other places developed in the past year are quite good. The display genre is important because many designers, I think, are always looking for unusual display types, thus for example the development of very heavy slab or sans serif fonts. I also see a proliferation of calligraphic types, many quite good.</p>
      <p>I hope this is an adequate answer. Thanks Nick.</p>
