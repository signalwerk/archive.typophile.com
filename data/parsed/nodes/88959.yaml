      <p>Sorry, I think you and Chris are thinking of Hammersmith Bridge, from where Cobden-Sanderson dumped the Doves Press type into the Thames. The association of St Mary's Putney doesn't have anything to do with type, but rather, in a way, with the Occupy movement. At least, that's the reason for starting my walk there. In 1647, the church was the site of the Putney Debates, where the Grandees and Levellers in the New Model Army debated the constitution of post-Civil War England. It is one of the great moments in radical history, when the notion of electoral suffrage independent of property were given voice, famously in the statement of Colonel Rainsborough:</p>
      <blockquote><p>For really I think that the poorest hee that is in England hath a life to live, as the greatest hee; and therefore truly, Sr, I think itt clear, that every Man that is to live under a Government ought first by his own Consent to put himself under that Government; and I do think that the poorest man in England is not at all bound in a strict sense to that Government that he hath not had a voice to put Himself under.</p></blockquote>
      <p>I figure a walk from one of the early sites of radical political history to the most recent, 365 years later, will have something of the flavour of a pilgrimage. Ironically, the route takes me up the King's Road and past Buckingham Palace. London's good at imposing historical significance.</p>
