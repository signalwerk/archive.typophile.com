    <p>While we engage in soothsaying for 2012, would it also be possible to identify the trends of the past year?</p>
    <p>**</p>
    <p>I don’t know how typical Shinntype is, but here’s our retrospective:</p>
    <p>Our best-selling “new’ retail typeface was Bodoni Egyptian Pro, an upgrade to a face that had been selling steadily for over a decade. One of the reasons it did well was because it was e-mail marketed to those who had already licensed the “legacy” version, and quite a few decided to upgrade. (New weights, features and language support had been added.) Also, the slab genre, which had become very popular in the previous decade (notably through the Clarendon revival, the success of Archer, and the influence of <em>The Guardian</em>), was still going strong.</p>
    <p>We also had some good corporate sales of Beaufort (another face designed in the ’90s).</p>
    <p>Our largest commissioned design was in the rounded sans category—a genre, like slab, that has been popular for a while.</p>
    <p>Webfonts has emerged as a new market for us, but not huge. We expect it to grow, but it’s hard to say by how much.</p>
    <p>**</p>
    <p>As our established catalog continues to perform, I decided to move away from developing large-family faces in generic styles, to making more novel display faces. </p>
    <p>**</p>
    <p>What has been the experience of other foundries/type designers?</p>
