    html: |-
      <p>Grapes, minus the initial G, is Adobe Caslon Italic:</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/adobe-caslon/" title="http://www.myfonts.com/fonts/linotype/adobe-caslon/">http://www.myfonts.com/fonts/linotype/adobe-caslon/</a></p>
      <p>Didn't find an exact match for the initial G, but Notera and Abuelito are close:</p>
      <p><a href="http://www.myfonts.com/fonts/mawns/notera/" title="http://www.myfonts.com/fonts/mawns/notera/">http://www.myfonts.com/fonts/mawns/notera/</a><br>
      <a href="http://www.myfonts.com/fonts/corradine/abuelito/" title="http://www.myfonts.com/fonts/corradine/abuelito/">http://www.myfonts.com/fonts/corradine/abuelito/</a></p>
      <p>Pressed appears to be a distressed version of Copperplate Gothic, or possibly Copperplate Gothic Hand:</p>
      <p><a href="http://www.myfonts.com/fonts/adobe/copperplate-gothic/" title="http://www.myfonts.com/fonts/adobe/copperplate-gothic/">http://www.myfonts.com/fonts/adobe/copperplate-gothic/</a><br>
      <a href="http://www.myfonts.com/fonts/wiescherdesign/copperplate-gothic-hand/" title="http://www.myfonts.com/fonts/wiescherdesign/copperplate-gothic-hand/">http://www.myfonts.com/fonts/wiescherdesign/copperplate-gothic-hand/</a></p>
      <p>As for Magical, SimpleLife is very close. I didn't find anything as close in my search.</p>
