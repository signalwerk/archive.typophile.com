      <p>Problem to me is 'MAGICAL' and 'PRESSED' look both hand-done (all repeating letters are different)...<br>
      'PRESSED' is some kind of hand-drawn <a href="/wiki/http.myfonts.com/search/copperplate%2Bgothic" class="freelinking" rel="nofollow">Copperplate Gothic</a>.</p>
