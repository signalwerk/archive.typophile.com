    <p>Hey guys. I need to translate a piece of advertising at my agency but the guys who were working on it before I arrived didn't leave the text editable. Could you help me identify these various fonts? I found one very similar for the "MAGICAL" image (SimpleLife) but I'd like to know the original font as well, if there is one.</p>
    <p>Thanks!</p>
