    html: <p>Despite glaring similarities, can one accuse Myriad of being just a copy of Frutiger? Is Times Roman only a copy of Plantin, Sabon of Garamond? Type design is evolutionary, there are very few true originals. One might even consider Myriad an improvement on Frutiger with its true italics (linotype came out with true italics after Myriad), many widths and weights.</p>
