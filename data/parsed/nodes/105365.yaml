    html: |-
      <p>Did you find a problem with FontForge? For me the script</p>
      <pre>---- fnt2ufo ----
      #!/usr/bin/env fontforge -lang=ff

      Open($1);
      Generate($1:r + ".ufo");
      Quit(0);
      ---- cut here ---
      </pre><p>appears to work. With linux or OS X, a simple</p>
      <pre>find . -name "*.otf" -exec fnt2ufo {} \;
      </pre><p>should do the job for all otf font files in the current directory and subdirectories. If that is not fast enough (due to one call to fontforge for each file) you can reduce the number of calls to one reusing some code of <a href="http://fontforge.org/scripting-tutorial.html" title="http://fontforge.org/scripting-tutorial.html">http://fontforge.org/scripting-tutorial.html</a></p>
