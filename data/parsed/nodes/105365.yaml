    votes: null
    html: |-
      <p>More that two months afterwards! You are lucky I did not scrap those files. Here is the answer I had prepared for your post.</p>
      <p>----<br>
      Here is a trace searching for a particular problem in the .fea files that were generated</p>
      <pre> find . -name "*.fea" -exec grep 'by[ ]*;' {} \; | sort | uniq -c
       102        sub [\uniF661 ]' [\slash \fraction \uni2215 ]' [\uniF661 ]'  by ;
        12        sub [\uniF661 ]' [\slash \fraction ]' [\uniF661 ]'  by ;
       128        sub [\zero ]' [\slash \fraction ]' [\zero ]'  by ;
      </pre><p>This found all feature files and searched in them for lines where 'by ;' is written. There is a total of 102 + 12 +128 =242 lines. Those are the 242 lines that cause the problem with the 242 ufo files. </p>
      <p>After executing </p>
      <pre>find . -name "*.fea" -exec sed -i .orig '/by[ ]*;/d' {} \;
      </pre><p>
      to remove those lines, FontForge accepted the ufo files as input without scrapping the features.</p>
