    date_raw: 9 Aug 2013 — 4:25pm
    votes: null
    html: |-
      <p>Now I remember that you have been using the <a href="http://fontforge.github.io/en-US/downloads/mac/" rel="nofollow">github version of FontForge</a>. If so, and if FontForge.app is in /Applications then save the following lines in a file, say sfnt2ufo</p>
      <pre>#!/Applications/FontForge.app/Contents/Resources/opt/local/bin/fontforge -lang=ff
      Open($1);
      Generate($1:r + ".ufo");
      </pre><p>Then execute the command</p>
      <pre>chmod 755 sfnt2ufo
      </pre><p> and put the file <code>sfnt2ufo</code> somewhere in your path (one of the folders listed when you type <code>echo $PATH</code>). Then, and only then, you can execute (in any folder)</p>
      <pre>find . -iname "*.[ot]tf" -exec sfnt2ufo {} \;
      </pre><p>to process all ttf and otf files or simply use</p>
      <pre>sfnt2ufo &lt;fontfile&gt;
      </pre><p>to get the corresponding ufo of one particular font file.</p>
