    <p>I haven’t used to many serifs in corporate identity’s lately and am a bit rusty when it comes to the newest faces around. Can anyone help me find a beautiful classic serif preferably a new design with a special take on ancient italian styles (not french didot look = too soft and female). Keywords are classical but modern, solid and professional not quirky and charming. I just need to hear what you think are good serifs then I can look them up to see if I find something interesting then maybe I can provide you all with a more specific topic question:-)</p>
