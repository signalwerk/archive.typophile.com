  html: |-
    <p>Hey all, I’m trying to identify the typeface used for the nameplate over at <a href="http://www.lactualite.com">www.lactualite.com</a>.  If anyone can help me out, it’d be much appreciated.  Thanks!</p>
    <p>EDIT: While we’re at it, I’m also trying to identify the other typeface(s) used on their magazine covers. <a href="https://www.rogersmagazines.com/images/act/images/ACT_covers_manger_memoire.JPG">https://www.rogersmagazines.com/images/act/images/ACT_covers_manger_memoire.JPG</a></p>
