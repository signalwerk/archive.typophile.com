  html: <p><img src="http://www.typophile.com/forums/messages/29/2633.jpg" alt="heaventica-01.jpg">  <br> <br> This is a basic lowcases-only font. <br>One idea is to put circles inside as many letters as possible. Another solution i am thinking about is to put kind of a dingbats-like symbols. <br> <br>At the moment the numeric letters are missing, and i am still wondering how to refine v/w s and z.</p>
