    html: |-
      <p>In my opinion, ttx is much more likely to leave the font intact than fontforge. I'd first try using ttx and an xml parser, to keep things simple (that requires a font that is properly restored if you apply ttx once to get the .ttx file, and then ttx on the resulting .ttx file). If you simply want to replace strings, it is then quite simple. Here is an example (tested with the macport python26 @2.6.7_1+ucs4 on OS X 10.5 and 10.6). First run <code>ttx -i</code> on <code>filename.ttf</code> or <code>filename.otf</code>. Then run <code>python substs.py filename.ttx</code> where <code>substs.py</code> is a file containing</p>
      <pre># -*- coding: utf-8 -*-
      from xml.etree.ElementTree import ElementTree
      import sys

      tree=ElementTree()
      tree.parse(sys.argv[1])

      p=tree.find("name")
      for r in p.findall('namerecord'):
        id=int(r.get('nameID'))
        if   id == 0:
          r.text="Copyright © 1642-2011".decode('utf-8')
        elif id == 5:
          r.text="Version 299.z"
      tree.write("tmpout.xml")
      </pre><p>(<em>mutatis mutandis</em>). You then add to the file <code>tmpout.xml</code> the following first line<br>
      <code><br>
      &lt;?xml version="1.0" encoding="ISO-8859-1"?&gt;<br>
      </code><br>
      rename the resulting file fontname.ttx and then run ttx on it to get your new font.</p>
      <p>A bash script file that applies ttx, then calls the python script, adds the first line, and finally applies ttx back again   is less than 20 lines long.</p>
