    <p>I am currently considering the idea of cross-branding distribution opportunities with several manufacturers with whom I have OEM deals. As envisioned, I would offer several thematic packages, as well as my entire collection, as add-ons to their product lines.</p>
    <p>The fonts in the original OEM packages have customized copyright agreements, identifying the manufacturers as licensed distributors, and also include the manufacturer's logo as a glyph within the fonts included. Ideally, I would like to be able to include the same things in the co-branded fonts. And, ideally, I would like to automate the procedure, since I'm looking at approximately 600-650 fonts in each of several packages.</p>
    <p>I imagine that inserting the glyph isn't a problem, if the slot already exists in the source font (no change in the GlyphIndex required), but I wonder about two other, slightly more complicated, changes. The first is the copyright DATE, which varies according to the creation date of the font; the second is the version number, which I would like to uptick one notch in all cases.</p>
    <p>Off-the-shelf doable? Custom scripting doable? Just a pipe dream?</p>
