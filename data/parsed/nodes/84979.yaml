      <p>I once had to customize the font copyright message on around 2 kilofonts. I need it done  in two days and I didn't have time to get into scripting. On a spare laptop I installed Fontlab and a task automator.</p>
      <p><a href="http://www.spacetornado.com/DoItAgain/" title="http://www.spacetornado.com/DoItAgain/">http://www.spacetornado.com/DoItAgain/</a></p>
      <p>It actually plays Steely Dan "Do it again" when you start it up.</p>
      <p>I arranged the windows, rehearsed, recorded the sequence, speed it up and let it rip. It's inelegant but it got the job done by morning. Which is good because I made a typo and had to start all over again.</p>
      <p> . . . and just be careful not to bump the mouse.</p>
