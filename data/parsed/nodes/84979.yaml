      <p>Cool, Michael!</p>
      <p>------------------------</p>
      <p>Note, that it is not necessary to decompile the whole fonts with TTX, but the name table only (and the cff table, if present and if you also want to replace the copyright info there). The table can be merged into the source fonts with TTX. This is faster and the risk to damage anything is lower.</p>
