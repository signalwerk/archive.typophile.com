  html: <p>Funny thing I just ran across, a logo I did a while back, admitting I didnt spend a whole of time with this, I still think the choice over mine was much more political than anything. <br> <br>So the FMUGAZ (Flash &amp; Multimedia Users Group of Arizona) is who this is for. The guy that runs it is a bit of a dink. Some dumb kid that wouldn't know if good design punched him in the face. Whats funny is this kid applied to work for my firm some time back, and after I turned down his application, he actually asked if he could intern for free. Even then I told him I didn't think it would be a great fit. So long story short, I make a presentation at this users group (which is not run by Macromedia for the record) The topic, Flash search engine optimization (for those in the know, we call this throwing darts in the dark <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">), durning such event I made reference to the fact that Macromedia was notorious for "poor support", more like "non-existant •••• support", but that aside the point. So this guy at some point before this presentation asked me to please help in designing a logo for the group, this is what I came up with <a href="http://www.kylehildebrant.com/downloads/fmug_logo_comps.pdf" target="_blank">http://www.kylehildebrant.com/downloads/fmug_logo_comps.pdf</a> <br>and here is what they chose (not long after my presentation)<a href="http://www.azflash.org" target="_blank">http://www.azflash.org</a>  <br> <br>Later I was asked not to participate in the group, due to my "Negative Talk" twards Macromedia. <br> <br>Haha, it all cracks me up. I just have a hard time thinking that the chosen logo was bettern than mine (and yes this sounds egotistical, but ohhwell). <br> <br>hildebrant. <br> <br>PS. In 3/4 drunk, so I will probably regret this in the morning.</p>
