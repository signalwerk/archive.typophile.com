    html: "<p>I like the logo they chose, although it is rough around the corners.  I like the one they chose because it fits a 'user group' attitude, and the other looks like it's more for an event or award show.   There's another factor I think is probably going on: these guys aren't designers, and they don't want to have a logo they can't use loosely.  Do you really think these guys could follow through with your identity across an entire site?  Its better to leave superior design for larger projects where you can manage more details across all the collateral.   Have a look at their Web site.. their logo fits better with what they are comfortable, thus I think it's better.  That's a hard lesson I think a lot of logo designers need to learn. </p>"
