    html: "<p>I'm a member of that user group, and I just discovered this thread. Just so the record is straight: <br> <br>1) The winning logo was chosen by a group vote. It had nothing to do with diplomacy. <br>2) The \"dink\" Kyle refers to happens to be a respected Flash developer. Aside from running the user group, he wrote a book on Flash basics for O'Reilly (which will be on shelves soon), tech edited several others, writes articles on Flash for InformIT.com, and works at KnowledgeNet, a very reputable eLearning company. <br>3) The manager of the group never touched the graphics for the group's web site. Everything on the site was done by group members who volunteered their time and energy. <br>4) As I recall, Kyle's removal from the group was the result of several malicious posts that both insulted group members and had no purpose other than to slam Macromedia. The posts were neither constructive nor useful for anyone but Kyle. The group manager received several complaints about Kyle's posts from group members. The manager then replied to Kyle on the list with the utmost diplomacy. Kyle's attitude was childish at best. The group manager acted on behalf of the group, and we applaud his efforts. <br> <br>Kyle, the group has done a lot of good for a lot of people. You got yourself kicked off the list. And that's no reason to publically insult anyone but yourself.</p>"
