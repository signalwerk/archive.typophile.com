    html: |-
      <p>Be careful with choosing the appropriate weight of Didot to reverse out of black. The high contrast on the 96 point master may make the delicate serifs disappear.</p>
      <p>I am conflicted about using H&amp;FJ Didot for luxury brands. It is an exceedingly beautiful face, but risks overuse and is often oddly paired with Helvetica--see Harper's Bazaar or luxurycollection.com for examples.</p>
      <p>In my eye,luxury brands typically choose serif families with small caps and oldstyle figures, because your average MS Word user doesn't have easy access to those characters and so see those as unique and exclusive.</p>
      <p>I would look at Joanna (there is a hard-to-find Postscript version with SC and OsF), Proforma, Whitman Display, Charter, Miller, Mercury, Farnham, Absara, Scala.</p>
      <p>David</p>
