    <p>By expensive I mean Tiffany's &amp; Co. or Kate Spade, maybe the expensive is in the simplicity and elegance, definitely the timelessness. So no script or handwritten, will be in lowercase.</p>
    <p>This font is for a logo (black type on white bg) for a high-end wedding and event photographer if that helps, which it probably doesn't. </p>
    <p>Thanks for any help...and I'll be sure to link you to the finished article so you can see what it looks like.</p>
    <p>Al</p>
