      <p>Tom,</p>
      <p>You should just email me and ask! To save you the trouble, it's a filled-weight version of Rudolf Koch's Prisma which I've designed with Alex Rich and Rafael Koch. The font is soon to be completed and released with Lineto in a new multi-weight upper and lowercase revision named Prismaset.</p>
      <p>Stephen was on the right track with Kabel: Prisma shares many characteristics with Kabel since they were both designed by Rudolf Koch.</p>
