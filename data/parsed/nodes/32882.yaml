    <p>I'm trying to identify this typeface. Its a pretty lo res sample I know, at first I thought it may be rounded (similar to VAG rounded perhaps) but as I look at it more I'm not entirely sure that it is.</p>
    <p>Here is a link to a couple more pics which may or may not be of further help<br>
    <a href="http://www.practise.co.uk/work/2005/otto-spooky.html" title="http://www.practise.co.uk/work/2005/otto-spooky.html">http://www.practise.co.uk/work/2005/otto-spooky.html</a></p>
    <p>Any ideas greatly appreciated!</p>
    <p>Thanks</p>
    <p>Tom</p>
