      <p>Wow – I think we can feel really privileged to have you on this thread, James! Thanks a lot for the link to your blog.</p>
      <p>I am very happy to hear that Justin Howe’s research did not get lost with his untimely death. He was supposed to give a talk at the St Bride conference in 2004 about his research, but he was ill that day. A few weeks before his death, when he was still curator at the Type Museum in London, I visited the Type Museum. In the generous manner that was typical of him, he gave me a short presentation about the talk he wanted to give at St Bride – essentially the same information that you published now on your blog. Of course, in my stupidity, I didn’t write anything down, and when he died, I already thought this information was lost forever. Justin had also prepared some new illustrations for his talk which he showed me on his power book. I hope, one day you can publish these illustrations as well, in memory of Justin…</p>
      <p>Here are some pictures of the type specimen and the matrices of Caslon Egyptian, taken by Justin. The type specimen and the matrices are at the Type Museum. If we compare the printed letters with the matrices, the newly added characters (described in the article on James Mosley’s blog) can be seen clearly.</p>
