    html: <p>The term Egyptian arises from coincidental connection. Napoleon did a big PR tour that wound through Egypt where his archaeological team picked up and deciphered the Rosetta stone, which lead to a huge boom in Egyptology. At the time Egyptology was funded primarily via tomb robbing, so Britain was overwhelmed with looted Egyptian artifacts, sort of like Banshees albums in the 1980s. Slab serifs came and went along with the trend of propping a mummy up in the corner of one's dining room; and so the two are inextricably linked.</p>
