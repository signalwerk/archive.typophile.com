      <p>And it's a Wikipedia entry with no citations... now that's a useless source if I ever saw one.</p>
      <p>I double-checked in <em>Typographic Design,</em> <em>Stop Stealing Sheep,</em> <em>A Type Primer,</em> and <em>ETS 3.0</em> and there isn't a single mention of the idea that the name comes from the publications about Napoleon's journeys. </p>
      <p>Google books has a scan of <a href="http://books.google.com/books?vid=OCLC25353829&amp;id=Np0LAAAAIAAJ&amp;pg=PA1&amp;lpg=PA1&amp;dq=Description+de+L%E2%80%99Egypte#PPA1,M1" rel="nofollow">Description de L’Egypte</a> and it is most certainly not printed with a slab face. <em>Typographic Design</em> presents the idea of a connection between popular type and Egypt mania, and since Meggs is one of the writers, I'm sticking with that one. </p>
      <p>Edit: The version on Google books is from 1845, the original was 1809. This still negates the story, as slabs appeared in 1815. I'll be at the Library of Congress next week and double check the 1809 edition, assuming that they have one.</p>
      <p>Now I have a Wikipedia entry to fix...</p>
