      <p><em>For God’s sakes. Well, at least you inadvertently pointed to where you stole the image from.</em></p>
      <p>Actually, I first came across it in another book, "London, A Great City" published by the Folio Society. Is scanning an image from a book and posting it on a web forum considered theft? I suppose I should have asked the Alfred Dunhill Museum for permission to reproduce their painting, but in reproducing low-res scans to illustrate a point in an online thread, I don't think people usually go to that length, so I'm just following general practice. Or do you think one should do better?</p>
      <p><em>By the way, printers’ ink balls.</em></p>
      <p>Gosh.</p>
      <p>Speaking of Mr Johnston's book, I came across this quote in it, from Richard Austin's "Address to Printers", 1819, concerning the problems with the ultra fine details of modern type, "Besides this, in the drawing of the letters, the true shape and beauty are lost; and instead of consisting of circles, and arcs of circles, so agreeable to the eye, some of them have more the appearance of Egyptian characters than good roman letter."</p>
      <p>Where did type founders of Austin's day get their knowledge of what an Egyptian character looked like? I would guess from Edmund Fry's "Pantographia", published in 1799 if I recall correctly, which attempted to show all the alphabets used by all languages around the world. So I wonder what the page(s) on Egyptian type look like in Fry's book?</p>
      <p><em>slab serif and egyptian are synonyms,</em></p>
      <p>That's always beeen my understanding. I named my slab-serif take on Bodoni "Egyptian" partly for that reason, as well as others, but most logically because the serifs don't look at all like slabs in the Light and Thin weights.</p>
      <p>But for encompassing a variety of typefaces, rather than weights, "Slab" is more practical, which is no doubt why the FontBook uses it as a category, to include many hefty-serifed faces (eg for news text) that are not at all "Egyptian".</p>
