      <p>I’m not sure I can follow that without blushing. In any case I have been reading Typophile Forum to learn, rather than to offer my opinions. (I do enough of that in my job.) But it’s true that having seen a recommendation that people should go out and get hold of The Nymph and the Grot (1999) I thought, first of all, that the book may not be so easy to get hold of (but don’t let me put anyone off buying it – sales help the St Bride Library). Secondly, that some interesting things about early sanserifs (or Egyptians) and slab-serifs were found after it was published – many of them by Justin Howes. If he had not died so shockingly suddenly a couple of years ago he might have contributed to this thread. Should have, for sure.</p>
      <p>So I thought of doing so myself, and signed up – but then my piece got far too long to post, so I put it under the heading ‘The Nymph and the Grot, an update’ on the Typefoundry blog (<a href="http://typefoundry.blogspot.com/" title="http://typefoundry.blogspot.com/">http://typefoundry.blogspot.com/</a>). That is where to find it, along with some other miscellaneous things. It won’t be the last word on the topic (I hope), but may answer some questions.</p>
