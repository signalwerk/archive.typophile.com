      <p>"Caslon’s “Egyptian”, it must be assumed, is not then an experiment that merely chops the serifs off a slab-serif style" </p>
      <p>No – that was the bright idea of the type historian A. F. Johnson, who dated the Figgins slab-serif 1815 (which is on the title page of the specimen) and the Caslon sanserif 1816. Therefore... But it helps to get outside the typefoundry and to look around a bit.</p>
      <p>One of my favourite images is this one (which I put in the original Nymph &amp; Grot), published in 1808, a project for a vast pyramid outside Portsmouth, the Royal Navy base, to commemorate Nelson at Trafalgar and Stuart at Maida (no, I had never heard of him either – but there is Maida Vale in London as well as Trafalgar Square). The pyramid makes an Egyptian connection, but the lettering was described as 'the earliest form of Roman character'. </p>
      <p>I'm sorry this one never got built – but there are plenty of other examples of sanserifs before 1816, ususally conveying some idea of an early and 'primitive' form. Not unrelated to Tschichold's idea of the Grotesk as pure and basic, in some ways.</p><div class="imageWrap"><img src="http://typophile.com/files/Wood - Pyramid_4860.jpg"></div><p></p>
