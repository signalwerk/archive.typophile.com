      <p>Caslon's "Egyptian", it must be assumed, is not then an experiment that merely chops the serifs off a slab-serif style -- which seems to be the consensus in the general type histories -- it is a mature design, derived from many decades of development by architects, sign painters, cartographers and stone masons. Tombstones are another, clearly dated, source of 18th century sans lettering.</p>
