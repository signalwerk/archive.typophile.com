    html: |-
      <p>That plaque doesn't look right. Surely its architect would have done a better job of configuring the plaque to accomodate the general's name.</p>
      <p>Perhaps the monument was originally created for someone with a shorter name. (The fortunes of war...)</p>
      <p>Another reason that the plaque looks like a revision is the naive quality of the lettering (note the "flipped" stress of De and A), compared to the sophistication of the other metalwork.</p>
      <p>However, even if the plaque is later than the monument, it would be difficult to date without some form of historical documentation (such as a photo or engraving of the monument which showed the plaque).</p>
      <p>At least it's not <a href="http://typefoundry.blogspot.com" rel="nofollow">Trajan or Bembo.</a></p>
