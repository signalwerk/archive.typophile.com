      <p>Why slab?</p>
      <p>Slabs serif faces were more often referred to as "Antique" in type specimens of the early 19th century.</p>
      <p>The first sans serif type was published in a Caslon specimen of 1816 (there are no extant examples of it in use), and named "Egyptian".</p>
      <p>In applying the term "Egyptian" to a sans serif, at first, there may have been the association with something ancient and primitive -- this is James Mosley's thesis for the cultural space the sans came from, as told in "The Nymph and the Grot".</p>
      <p>Updike (Printing Types, Volume II), mentions in an anecdotal footnote that in a "London Jest Book" of 1806 (unfortunately, an internet-quality reference...) there is a joke about an Irishman's reaction to a "Fashionable Egyptian Sign Board". There is no way of knowing wheher the lettering thereon, in which the "thin strokes were as thick as the thick strokes" was a sans or slab. Anyway, the signpainters were ahead of the typefounders.</p>
      <p>Updike conjectured that there was some racial correspondence between the dark weight of the style and the Egyptian term, however, this was probably the influence on him of a later 19th century concept, encapsulated in the term from the title of the explorer Stanley's book "The Dark Continent", dark meaning undiscovered, unilluminated by civilization, and with dark-skinned inhabitants. However, even then this racist premise was often understood to refer to sub-Saharan Africa, not Egypt and the northern Arab territories.</p>
      <p>There were in fact quite a few Egyptians in Paris in Napoleon's day -- they were Mamelukes, a caucasian ethnic group, originally abducted to Egypt as slaves, but who had become its rulers. Many of them, male citizens of the Ottoman Empire, made their way to France with the returning French army, and subsequently formed a divsion in Napoleon's army, featuring prominently in military parades, their exotic uniforms creating a fashion craze. Girodet, a leading painter of the time, was fascinated by the Orient and had several of them living in his house -- he did a series of portraits of them, and used his guests to populate his large painting "The Revolt of Cairo". So in France at least, the Egyptian phenomenon was all about the exotic novelty of the Orient. And French fashions quickly crossed the Channel to London. </p>
      <p>So I'm sticking with the theory that while there may be several contributing factors to the Egyptian name, really it's just something that was trendy at the time, taken up by type founders because it looks cool in print (to typophiles) -- the only word with three different consecutive letters with lower-case descenders. Eventually, it settled on the slab-serif genre.</p>
      <p>Bear in mind that, as Alastair Johnston explained in "Alphabets to Order", the people responsible for 19th century specimen books were dada poets.</p>
