      <p>Let me ask you this, why would you want the Clashmore word mark as opposed to the avatar you have. It, the avatar, is much more interesting, individualistic and thought provoking than a series of san serif letters strung together with no distinguishing marks other than some of them are altered characters.</p>
      <p>Michael</p>
