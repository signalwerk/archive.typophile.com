    <p><strong>The International Council of Graphic Design Associations</strong> (Icograda) is the professional world body for graphic design and visual communication. Founded in London in 1963, it is a voluntary coming together of associations concerned with graphic design, design management, design promotion, and design education. Icograda promotes graphic designers' vital role in society and commerce. Icograda unifies the voice of graphic designers and visual communication designers worldwide.</p>
    <p><a href="http://www.icograda.org" title="http://www.icograda.org">http://www.icograda.org</a></p>
