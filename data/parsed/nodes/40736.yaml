      <p>Yes I do have two<br>
      Both are use to working with small design studios and small design budgets.<br>
      Both tend to work well and you can talk to humans.</p>
      <p>One is (I’ve used for 2-color jobs)<br>
      Patane Press<br>
      228 E 125th St<br>
      New York, NY 10035-1738<br>
      Phone:  (212) 289-1440<br>
      (I don’t think they have a website - but they do have an FTP site)</p>
      <p>The other is (I’ve used for 4/c Rack Cards, 4/c Biz Cards, etc. — and yes, nice job, short runs!)<br>
      Popular Printing<br>
      224 West 35th Street (Between 7th &amp; 8th Ave)<br>
      New York, NY, 10001<br>
      <a href="https://web.archive.org/web/20080706083941/http://popularprinting.com/" title="http://popularprinting.com">http://popularprinting.com</a></p>
      <p>P:(212)560.9529<br>
      F:(212)560.9528</p>
      <p>I’ve used both in the past 2 years.</p>
