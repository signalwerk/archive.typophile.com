    <p>Hey there,</p>
    <p>Can anyone recommend a good printer in nyc.  I have a pretty complicated job to print and would like to work with a printer who has experience workin with small design studios on shorter run high detail projects.</p>
    <p>Any recommendations would be really helpful.<br>
    thanks a lot in advance!</p>
