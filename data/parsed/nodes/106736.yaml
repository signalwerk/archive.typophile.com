    html: |-
      <p>From the txt file in the copy folder I have:</p>
      <p>ABOUT THE FONT</p>
      <p>'TELFORD' is a high quality font containing full hinting for correct rendering<br>
      at small point sizes and a total of 926 kerning pairs for correct character<br>
      spacing. It is supplied 'as is' and no waranty is implied or given by the<br>
      author. The font is suitable for both headlines and body text, and should<br>
      render well down to 8 point. The font contains a full range of upper and lower<br>
      case letters together with the figures 0 to 9, a full range of punctuation,<br>
      but no diacritics. It was hand traced in order to achieve a high quality outline<br>
      and compiled using Type Designer 3.1. This font represents aproximately 400<br>
      manhours of work.</p>
      <p>The latest version of this font is always available for download from the<br>
      file list of the fonts conference on the Cix conferencing system. The author<br>
      would appreciate notification of any problems experienced with this font<br>
      together with any suggestions for improvements.</p>
      <p>Roger White,<br>
      1, Owens Close,<br>
      Rugeley,<br>
      Staffs,<br>
      WS15 2YH,<br>
      England.</p>
