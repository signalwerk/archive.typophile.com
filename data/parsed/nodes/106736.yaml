    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SourceOfRipOrScan_6264.jpg"></div><br>
    While researching Roger White's "Carolus" for <a href="http://typophile.com/node/106734" title="http://typophile.com/node/106734">http://typophile.com/node/106734</a> I came across this squared sans serif that he calls "Telford."  It looks like it was created by Photolettering or Filmotype in the 1960s as an exercise in optical stretching of font width. There is also an outline version and italics.<br>
    Does anyone know anything about the source font?<br>
    Thanks.<br>
    Don<p></p>
  html_clean: |-
