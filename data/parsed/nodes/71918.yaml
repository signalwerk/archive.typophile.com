    html: |-
      <p>I don’t see the benefit of having an extra place for ‘Solved IDs’. (I am also opposed to the idea of having style categories, see the comments in <a href="http://www.typophile.com/node/65232" rel="nofollow">this older thread</a>.)</p>
      <p>In my opinion, this overcomplicates things. We have a well-established system that helps distinguish between solved and unsolved requests: the titles of solved threads are edited and marked with ‘(x)’, the solution and credits are added. </p>
      <p>Moving solved threads to an extra forum adds another work step that needs to be performed manually by the moderators. At the moment, we have around 15 requests per day, almost 500 every month. Just saying.</p>
      <p>And when to move them? We see so many threads where there is no easy, definitive answer – lettering work where suggesting alternates is all we can do, custom and modified type, obscure freebies, pre-digital typefaces etc. There is always someone who has some valuable information to add, even after the correct (or supposedly correct) answer was given (and credited). This openness would be lost if we immediately consign all threads that have received one plausible answer to some ‘dead’ archive.<br>
      Most IDers are not willing to observe several separate lists.</p>
      <p>Many of the posters on the Type ID Board are first-time visitors, many of them not returning. If a solved thread was moved from the original forum, chances are the original poster would not find back the thread, and start another one on the same subject.</p>
      <p>Back to the question of benefit. Having an archive is a great thing. However, when people want to know which typeface is used for, say, the ‘Kings Of Leon’ cover, they don’t care whether this has been filed as ‘solved’, ‘partially solved’, ‘yet unsolved’, or maybe in a completely inappropriate place like the ‘Design’ forum. They should be able to perform a search and find the relevant thread(s). (At the moment, this is something that <a href="http://www.google.com/search?q=site:typophile.com/node/%20Kings%20of%20Leon" rel="nofollow">works with external search engines</a>, but still is <a href="http://typophile.com/search/node/Kings%20Of%20Leon%20type%3Atypeid" rel="nofollow">impossible using the built-in search</a>.)</p>
      <p>My vote is for Riccado’s latter suggestion: let’s get rid off the ‘Solved IDs’ fora.<br>
      Florian</p>
