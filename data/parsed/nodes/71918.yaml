    html: |-
      <p>I think Florian is perfectly right.<br>
      At most, we could borrow some functionality from the WTF forum, as in placing the solved status and attribution into some sort of metadata, in order to make titles less cluttered.<br>
      Even if not, it would be nice if there were an interface for moderators with radio buttons (unsolved/solved/partially/not a font/similar, ecc.) and a text input for attribution (linked to the users database, of course).<br>
      Then the system could be instructed either to display such information through the title or by other means.</p>
