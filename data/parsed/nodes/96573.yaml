    votes: null
    html: <p>The value of the OS/2 typo ascender added to the depth of the typo descender should sum to the em height. So the values that Karl suggests should work for you. I would consider an actual ascender height of 697 to be 'cast small on the body', though. In general you want the actual ascender and descender height and depth to be close to the OS/2 typo values and hence close to the em size.</p>
