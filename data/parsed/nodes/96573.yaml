    html: |-
      <p>Assuming you are using FontLab try this. In the 'Key dimensions' panel, change your Ascender to 807, keep your Descender as -193 and keep your Caps height at 697. In the 'TrueType-specific metrics' panel tick the box to 'Set custom values' and set the values as below:</p>
      <p>[OS/2]<br>
      TypoAscender: 807<br>
      TypoDescender: -193<br>
      TypoLineGap: 200<br>
      WinAscent: 950<br>
      WinDescent: -250<br>
      [hhea]<br>
      Ascender: 950<br>
      Descender: -250<br>
      LineGap: 0</p>
      <p>Hopefully this should work if I understand your issue correctly.</p>
    html_clean: |-
