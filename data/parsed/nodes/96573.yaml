    html: |-
      <p>That looks pretty sound, Karl. However, if the actual ascender height in the font -- e.g. measured to the top of the lowercase d, the usual PS measurement -- is 950, then Topy might want to consider scaling his outlines down. At present the implication of 950 + 193 is that the total ascender + descender height is greater than the em height, which is usually not a good idea.</p>
      <p>Topy, note that 'TrueType-specific metrics' in the FontLab UI is a misnomer, since these OS/2 and hhea values also apply to PS OpenType.</p>
