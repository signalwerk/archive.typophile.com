  - id: 523661
    user: 1262
    date: 2012-09-25T12:00:00
    date_raw: 25 Sep 2012 — 12:00pm
    votes: null
    html: |-
      <p>The em is what is scaled. So, for instance, if text is set at 12pt then it is the em height that is 12pts high. So the relative sizing of the actual outlines to the em determines whether the font looks small or large or similar relative to other fonts at the same nominal size. If your ascender and descender lengths are significantly shorter than the em, the font will look small compared to most other fonts at the same size. If they are taller than the em, not only will the font look larger than other fonts it might also appear too tightly line-spaced in typical leading situations.</p>
      <p>Note that some software makes use of font vertical metrics to determine default leading, while other software uses explicit leading set by the user. MS Wordpad is a good example of the former, and Adobe InDesign of the latter. Hence, you want to set the vertical metrics to produce what you consider the desirable linespacing in Wordpad, but also to scale your outlines relative to the em such that your font is of similar size to other fonts. There is no absolute standard -- and there are reasons why one might choose to make an individual font 'small on the body' -- but general practice is to make the Latin ascender and descender heights sum quite close to the em height.</p>
      <p>Having established the ascender and descender heights and corresponding Typo vertical metrics, you can increase linespacing by increasing the TypeLinegap value. You then need to also increase the Win and hhea metrics values by the same amount. Typically, this is done by either splitting the increase equally or proportionally across the two Win metrics values, or by adding it all to the WinAscent value.</p>
