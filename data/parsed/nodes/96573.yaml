    <p>I ran FontQA and got these errors:</p>
    <p>"Not all OS/2-sTypoAscender values are matching the required value. OS/2-sTypoAscender: 750, required: 950"</p>
    <p>"The OS/2-sTypoDescender value does not match the required value OS/2-sTypoDescender: -250, required: -193"</p>
    <p>Font's UPM is 1000. Ascender: 950. Descender: -193. Caps height: 697. Ascenders are also 697 tall (for a reason) and decenders go to -193 (also for a reason). Going to be postscript OT, that's why I thought it would be safe to leave the TT-specific metrics to automation. Apparently not the way to go? I tried to make some sense of the Vertical metrics How-To, but still not sure what to do. That How-To is quite dated, anyone know is it still valid today?</p>
