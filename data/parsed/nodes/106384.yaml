      <p>Thanks, Kent,</p>
      <p>I think you must be correct since I notice that there is also a Tibetan example on that page which <em>doesn't</em> display on my system. If I install Kailasa on my system, the Tibetan example does display but is clearly not in the same font as Dzongkha.</p>
      <p>I was under the impression that web font support wasn't available in Leopard, but I must be wrong on that count.</p>
      <p>Thanks for solving this and letting me keep what little remaining hair I have left.</p>
      <p>André</p>
