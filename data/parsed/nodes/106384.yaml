      <p>If you inspect the markup for the Dzongkha example, you’ll see that there is a <code>span</code> tag that has the following attribute: <code>style="font-family: Jomolhari, sans-serif;"</code></p>
      <p>Perhaps that <a href="http://en.wikipedia.org/wiki/Jomolhari_%28typeface%29" rel="nofollow">Jomolhari font</a> is being served up somehow through one of their many scripts.</p>
