    <p>This is probably more of a Mac System question rather than a font question, but this is driving me crazy and I thought perhaps someone here would know what's going on.</p>
    <p>BACKGROUND:</p>
    <p>I'm working with a rather ancient computer which uses MacOS 10.5.8 and Linotype FontExplorer 1.2.3 (i.e. the free version which I think is now discontinued).</p>
    <p>I try to keep the number of fonts installed on my system to the absolute bare minimum and then use FEX to activate others as needed. The ONLY fonts actually installed are as follows (listing families only rather than individual fonts):</p>
    <p>/System/Library/Fonts/: Aqua Kana, Geneva, Helvetica/Helvetica MM, Helvetica Neue, Keyboard, Last Resort, Lucida Grande, Monaco, Symbol, Times/Times MM</p>
    <p>/Library/Fonts/: Courier, Courier New, Geeza Pro, Hiragino Kaku Gothic, Arno Pro</p>
    <p>Currently NOTHING else is activated.</p>
    <p>THE ODDITY:</p>
    <p>I noticed while visiting wikipedia's list of pangrams that many of the non-roman examples given were displayed as missing-character boxes. Given my minimalist set of installed fonts, this is to be expected. What I was surprised by, though, was the fact that the Dzongkha example is being displayed in well-rendered tibetan characters. None of the fonts listed above include tibetan. If I copy and paste the text into TextEdit it is displayed as LastResort, so it appears that TextEdit is aware of the fact that I have no tibetan fonts installed, whereas safari is not. </p>
    <p>So where is this font actually coming from? I've checked every font folder I know of (i.e. System/Library/Fonts, /Library/Fonts, ~/Library/Fonts, as well as the adobe font folders in Application Support (not that Safari should have access to those anyway) using <code>ls -a</code> and confirmed that I have no hidden font files. I've used EasyFind to search the entire drive including package contents and hidden system folders for either "kailasa" or "kokonor" (the only tibetan fonts included with Leopard AFAIK) and the only copies I have are those in my folder of removed system fonts, which should all be inactive. I've ran <code>atsutil databases -remove</code> to get rid of the system font caches; I've deleted safari's caches; I've deleted my FontExplorer preferences; all to no avail --  Safari remains convinced that I have a Tibetan font installed (it *looks* like Kailasa, though I can't swear to this).</p>
    <p>Now, I have no objection to having a computer which can speak (or at least render) Dzhongka, but it's driving me nuts that I can't figure out where this font is coming from. Are there any other locations not mentioned above where OS X and/or Safari and/or FontExplorer might look for fonts?</p>
    <p>Mystified,<br>
    André</p>
