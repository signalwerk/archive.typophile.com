      <p>Typeface names can become Trademarks (or Registered Trademarks). I do not know what the procedure is to do this myself. But I would recommend doing it.</p>
      <p>You cannot *copyright* a typeface name, I think. You can only copyright the source code of a font. Font source code data may be copyrighted as a literary work, like other computer programs. This is done through the copyright office of the country you live in (I believe that the US Copyright Office is in Washington, D.C.). Other countries have copyright agreements with the US; therefore, it is usually not necessary to register this copyright elsewhere.</p>
