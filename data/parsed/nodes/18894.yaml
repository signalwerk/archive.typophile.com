      <p>Some offbeat suggestions...</p>
      <p>Belgian beer: <strong>Trois Pistoles</strong>, a hearty (9% ABV) cask-conditioned ale (comes in a champagne-style bottle).</p>
      <p>German beer: <strong>Burgerbrau Roggenbock</strong>, an unfiltered rye bock (serious sedimentation) with a delightfully different flavor; <strong>Aecht Schenkerla Urbock Rauchbier</strong>, made with smoked malt, redolent of olives(!).</p>
      <p>Russian beer: <strong>Baltika No. 4, 6 &amp; 9</strong> - No. 9 calls itself "Pale Beer," but it's robust and has a kick (8% ABV); No. 6 is a porter, rich and full-bodied; and No. 4 is an unfiltered wheat ale, one of the tastiest light-colored beers I have ever encountered.</p>
      <p>American Beer: <strong>Cave Creek Chili Beer</strong>, not because it's superior beer, but because each bottle is conditioned with a chili pepper. Drink one of these puppies, and you'll be calling for a cold one (but NOT another CCCB)...</p>
