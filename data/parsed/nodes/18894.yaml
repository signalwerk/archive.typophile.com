      <p>Well, here's a sure-fire way to protect your typeface names and build a brand for yourself, and it will only cost you another beer at TypeCon Boston this summer.</p>
      <p><em><strong>Brand Thy Self</strong></em><br>
      I've been both fascinated and enamored of your user handle "dezcom" (and I vaguely remember what it stands for, but that's neither here nor there in the matter). It's a fairly small field of type foundries and designers, so branding yourself will stand as both memorable and irrefutable as to the source of any of your typefaces.</p>
      <p>Dezcom NOW, or Dez Leporello, or Dz Align Sans, or CL NOW, all can easily be branded and trademarked at the same time since your "prefix" becomes the actual distiguishing name.</p>
      <p>It's why Aaron Burns <em>insisted</em> that "ITC" preceded every licensed release (except for the few ITC sub-licensed) and why several type suppliers and vendors still use prefixes today. But personally, I think "Dezcom" or even "Dez" is quite catchy, and you can even use your avatar as a brandmark.</p>
      <p>Trying to trademark and brand three new type families is far more difficult and costly than building a single brand with three available products (in this case typefaces).</p>
      <p>Now if that's not worth a beer, I don't know what is. :-O</p>
