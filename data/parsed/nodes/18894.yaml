      <p>Chris, what are you intending to protect legally?<br>
      As Dan mentioned, a typeface name (a name of an actual product) can be trademarked after a moderate search of like sounding and spelling names within the industry or market of the product.</p>
      <p>A registered trademark requires extensive tradename research (legal fees) before you can even apply, then more application fees, a period open for contention, then more legal fees for actual registration. It's really all about "trade" protection, or to disuade "competitors" from capitalizing on the brand investment and product name equity of the originating company.</p>
      <p>If a "brand" is big enough or well known enough, its protection will go beyond the actual product category and marketplace. An example would be if you tried to register a trademark for a typeface named <em>Corvette</em>.</p>
      <p>A name won't protect the typeface itself, if that's what you're hoping to do. If you are interested in "branding" a typeface, it requires more than just protecting the name as well.</p>
      <p>Let me know... I'll help if I can.</p>
