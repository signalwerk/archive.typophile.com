    html: |-
      <p>As usual, an excellent work from TypeTogether. Some small observations:</p>
      <p>1. bottom part of g seems a bit rigid and large. It could be narrower.</p>
      <p>2. ordinal in numero sign seems to be a zero, but it would be a superscript |o| because Nº abbreviates the word <strong>N</strong>umer<strong>o</strong>.</p>
      <p>3. section has a nice and original design, but I guess it would be considered too fancy or not easily recognizable in Law texts, where it is largely used.</p>
