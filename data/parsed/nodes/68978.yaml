    <p>Abril, the new typeface by Veronika Burian and José Scaglione is on the way. It is a font family engineered mainly for newspapers and magazines that features friendly and elegant styles for headlines and robust and economic styles for text. For the first time ever, we will be posting images showing the progress of the develoment of a font family. So stay connected to our Flickr group!</p>
    <p><a href="http://www.flickr.com/photos/typetogether/sets/72157623684586626/" title="http://www.flickr.com/photos/typetogether/sets/72157623684586626/">http://www.flickr.com/photos/typetogether/sets/72157623684586626/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/april-in-progress_5897.jpg"></div><p></p>
