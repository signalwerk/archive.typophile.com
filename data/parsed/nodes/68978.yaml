      <p>I just saw this.<br>
      Very cool of you to do this!<br>
      How open are you to critiques?</p>
      <p>FWIW, in Armenian "Abril":<br>
      1) Is the name of the month (no big surprise).<br>
      2) Means "to live", a lyrical contrast to the Armenian Genocide which we commemorate on April 24.<br>
      3) What I long wanted to name a daughter, but when the time came my wife objected.  :-/</p>
      <p>Then there's Victoria Abril, a fabulous actor.</p>
      <p>hhp</p>
