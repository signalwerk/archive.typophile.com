    html: |-
      <p>According to <a class="freelinking external" href="http://www.bastillebastille.com/music/" rel="nofollow">their website</a>, the font is called "bastillefont". As many of this kind of job, it is deeply rooted in <a class="freelinking external" href="http://www.myfonts.com/search/futura" rel="nofollow">Futura</a>. This one looks mainly like a redrawn/roughen/hand-shaped version of it (see printscreen below).<br>
      As you're mainly after this kind of /A (which could easily be done starting from /A, removing middle crossbar and "closing" the resulting triangle): <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/diamonds/" rel="nofollow">Diamonds</a>, <a class="freelinking external" href="http://26plus-zeichen.de/en/fonts/tj-evolette-a/" rel="nofollow">Evolette A</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/matchandkerosene/lightyears" rel="nofollow">Lightyears</a>, many ones at <a class="freelinking external" href="http://www.tendollarfonts.com/" rel="nofollow">TenDollarFonts</a> (TWOFACED, Echelon, Rathe, Parqa, Fonecian, Finding 57, Harf 77, Labieno, Positano, Marina, Alumia...)<br>
      More inspiration: <a class="freelinking external" href="http://experimentalsans.tumblr.com/" rel="nofollow">I Am So Tired With Your Experimental Sans</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-3_4169.png"></div><p></p>
