    html: |-
      <p>According to <a href="http://www.bastillebastille.com/music/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">their website</a>, the font is called "bastillefont". As many of this kind of job, it is deeply rooted in <a href="http://www.myfonts.com/search/futura" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Futura</a>. This one looks mainly like a redrawn/roughen/hand-shaped version of it (see printscreen below).<br>
      As you're mainly after this kind of /A (which could easily be done starting from /A, removing middle crossbar and "closing" the resulting triangle): <a href="http://www.myfonts.com/fonts/hvdfonts/diamonds/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Diamonds</a>, <a href="http://26plus-zeichen.de/en/fonts/tj-evolette-a/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Evolette A</a>, <a href="http://www.myfonts.com/fonts/matchandkerosene/lightyears" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lightyears</a>, many ones at <a href="http://www.tendollarfonts.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">TenDollarFonts</a> (TWOFACED, Echelon, Rathe, Parqa, Fonecian, Finding 57, Harf 77, Labieno, Positano, Marina, Alumia...)<br>
      More inspiration: <a href="http://experimentalsans.tumblr.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">I Am So Tired With Your Experimental Sans</a></p>
      <p><img src="/sites/default/files/old-images/Untitled-3_4169.png"></p>
