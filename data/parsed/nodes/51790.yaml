  html: |-
    <p>It was announced in the news last week that <a class="freelinking external" href="http://www.circuitcity.com/" rel="nofollow">Circuit City</a>, a major US electronics retailer, has filed for bankruptcy protection amid a weak economy. According to <a class="freelinking external" href="http://money.cnn.com/2008/11/10/news/companies/circuit_city/index.htm" rel="nofollow">CNN</a>, the company plans to keep its remaining stores open through bankruptcy proceedings and encourages consumers to continue shopping at its stores.</p>
    <p>Typophiles, how can you as type and/or graphic designers help Circuit City in these pressing times?</p>
    <p>// TYPE BATTLE 29</p>
    <p>Design a new logo (or logotype) for Circuit City. Extra points for creating additional branded examples to support your design.</p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
    <p>// REQUIREMENTS</p>
    <p>- Image size: 550 width x 400 height. 72 dpi<br>
    - Color: We usually stipulate black and white, but not this week!<br>
    - Format: JPG or PNG</p>
    <p>// ABOUT TYPOPHILE <a href="http://www.typophile.com/typebattles" rel="nofollow">TYPE BATTLES</a></p>
    <p>This is your chance to stretch your type muscles on a weekly basis. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
    <p>Link directly to this battle: <strong><a href="http://www.typophile.com/battle29" rel="nofollow">http://www.typophile.com/battle29</a></strong><br>
    Link to the battle directory: <a href="http://www.typophile.com/typebattles" title="http://www.typophile.com/typebattles">http://www.typophile.com/typebattles</a></p>
