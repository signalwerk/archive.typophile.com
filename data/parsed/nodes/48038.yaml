    <p>I'm looking for more info about "Lining Gothic No. 544" that I found in the<br>
    "AMERICAN SPECIMEN BOOK OF TYPE STYLES- Complete Catalogue of Printing Machinery and Printing Supplies", 1912 from American Type Founders Company.</p>
    <p>Infos like:<br>
    -Who draw it?<br>
    -Is any digitalisation known?</p>
    <p>I also would like to know if some one here can provide a good digitalization of those pages.</p>
    <p>Thanks in advance<br>
    António Fonseca</p>
