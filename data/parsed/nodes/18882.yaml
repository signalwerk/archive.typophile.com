    votes: null
    html: |-
      <p>If I can add a small comment.</p>
      <p>Type 1 fonts permit stroke-based outlines. Most of<br>
      the type 1 fonts have a PaintType defined to be 0,<br>
      but if you set it to be 1, and define StrokeWidth to be<br>
      the pen thickness (30 is thin, 100 is thick), then<br>
      outlines are stroked. This can be used to thicken<br>
      fonts (not recommended though!), but it can also be used<br>
      to render fonts as strokes only.</p>
      <p>The change in the PaintType value and the addition of StrokeWidth<br>
      parameter can be done in a standard text editor on the “pfa” version<br>
      of a type 1 font.</p>
      <p>If this sounds too technical, I apologize. I will try<br>
      better next time.</p>
      <p>Luc</p>
