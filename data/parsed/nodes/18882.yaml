    html: |-
      <p>If I remember correctly, Type 3 allowed practically any PostScript function to be used, including strokes, grayscale, conditional statements—anything pretty much. This is how random fonts like Beowolf were possible. It was also used for clip art fonts with complex images. The downside: no hints, so if all you wanted to do was to make a normal font, it looked like crap on a 300 dpi laser printer. </p>
      <p>I do recall a company selling Type 3 fonts based on strokes. The advantage they touted was that you could squeeze or stretch the fonts without the kind of distortions you would get with outline fonts. Unfortunately, since the fonts were composed of unvarying strokes, the designs were limited and lacked optical corrections.</p>
      <p>I also seem to recall that the original version of Courier that was built into the original LaserWriter was stroke-based.</p>
