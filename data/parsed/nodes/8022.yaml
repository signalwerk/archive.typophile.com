    <p>Hello <br> <br>My name is Ragnar and I am from Iceland. I am currently studying graphic design at the Iceland Academy of the Arts for a Bachelor Degree and will be graduating in spring 2005. Right now I am wondering how I should continue my education. <br> <br>I have a lot of interest in typographic design. Not designing typefaces as such but the act of designing with typefaces. <br> <br>So I was wondering if someone here could point to me to schools that offer MA programs in typographic design or something similar. They can be anywear in the world. I am open to anything! <br> <br>Thanks alot, <br> <br>Ragnar Freyr <br><a href="https://web.archive.org/web/20080706105606/http://www.onrushdesign.com/" target="_blank">www.onrushdesign.com</a></p>
