  html: |-
    <p>Hi,</p>
    <p>I see lots and lots of geometric sans faces in magazines and advertisements around the world. Gotham and all it's relatives like Avenir Next and Neutraface 2 seem to be quite popular among designers. </p>
    <p>And very often I see serif faces like Freight, Chronicle, and Farnham used with them.</p>
    <p>And new slab serifs seem to pop up here and there all the time.</p>
    <p>I imagine seeing a typeface trend. Am I wrong or right?</p>
    <p>But even more I am wondering what will be the next big thing in typeface design. What kind of typefaces and combinations will we see in magazines in the future?</p>
    <p>I really look forward on hearing your thoughts on this. </p>
    <p>Thank you,<br>
    Sami</p>
