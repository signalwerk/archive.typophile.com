  html: |-
    <p>Last week, the typography team at Target was asked to give a presentation to a segment of the corporation. We had a lot of fun and wonderful feedback from our co-workers. It was a great way to show the unitiated what a real-life typesetter/typographer does. I thought I'd share just a portion of our presentation here. We took our lead from Ellen Lupton's "Type Crimes" concept from her <a href="http://www.papress.com/thinkingwithtype/index.htm" rel="nofollow">Thinking with Type</a> book. </p>
    <p>You can see some of the slides we created <a href="http://ravenmn-typographypowerpoint.buzznet.com/user/photos/" rel="nofollow"><strong>here</strong></a></p>
