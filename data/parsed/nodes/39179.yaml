    <p>Im designing a clock and I am looking for a nice typeface to use for the numbers. I would like to use a font that has a lot of character to each number, while not becoming to fancy or overbearing. This clock will be in a semi-modern location but I would like to keep a link to the past (or something pretty classic). Please let me know what you think.</p>
