      <p>Even a TrueType font contains algorithmic elements: it may contain a sequence of instructions to carry out hinting.</p>
      <p>It's true that the bulk of what a font contains is simply data, point coordinates, which another program reads in order to draw the shape specified for a given glyph.</p>
      <p>But in some cases, data can be licensed in the same fashion as computer programs: for example, a company might license you a database of names and addresses - and supply you with it only in an encrypted form that could be read by the program that would print your allowed number of mailing labels.</p>
      <p>The important thing is that by recognizing fonts as software, their creators gain an additional element of legal protection. Even in jurisdictions where typeface designs lack legal protection, the font, as a specific binary sequence to be given to a computer, still enjoys full copyright protection. While, even where typeface designs are protected, that protection runs for a much shorter term, similar to that for patents.</p>
      <p>So I don't see how treating fonts as software is a bad thing - it seems to me it's a very good thing for typeface designers.</p>
