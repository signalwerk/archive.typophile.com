      <p>It seems that software "can" be a text file but for me, it must do more than just present the captured text on demand. It makes sense that there are commands given and resources consulted for decision on what is to be presented or executed.<br>
      An ascii file of just typed text, like the text of an email, can only present the captured text as it was with the caveat of allowing formatting changes--size, weight, etc..  Even formatting changes require a savvy application which "reads"the text file and allows you to select options.<br>
      A typeface file is a set of captured data and selection system that has the intelligence to make itself usable to other software and hardware in many selectable ways.  It may not be totally self-enabling and require other players to complete the task requested (InD, MS-Word, OS, Hardware...).<br>
      If you think of a text file as a cooked dish, it only allows eating and saving for eating later, without outside intervention. You may then think of a typeface file as a smart recipe book which can call up its ingredients and allow the user to combine them in countless ways.  The application software is like the chef, who puts all the ingredients together in the way requested and presents them on demand.<br>
      The stove, refrigerator, utensils, etc.. are the hardware tools needed to do the job. The operating system is the software that allows all of the various players to interact with each-other in a selectable and logical way.</p>
