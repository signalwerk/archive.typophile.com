      <p><em>…the bulk of what a font contains is simply data, point coordinates…</em></p>
      <p>It is indeed "simply" data, because it is written directly as digital media, and that's what makes it akin to code.<br>
      It is not data which is a measurement of analog objects or events, or for that matter of digital events.<br>
      The font does not exist outside its digital being, so it is not the kind of "factual information about something" which we normally consider data to be. It is the thing itself, <em>sine qua non.</em><br>
      Just as surely, a program is "simply" code.</p>
