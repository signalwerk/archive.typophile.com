    <p>Hi,</p>
    <p>I know that OpenType fonts can be considered as software due to OpenType features (which as I understand are actually small scripts). But can TrueType and PostScript Type 1 fonts (I basically mean any font the does not have the .otf file extension) be considered as software?</p>
    <p>Thanks</p>
    <p>Edit – I have changed the title to cover all types of fonts, not just TrueType and Type 1.</p>
