      <p>Oldnick explained it very well: </p>
      <blockquote><p>Harvard Cyberlaw defines software as "the programs or other 'instructions' that a computer needs to perform specific tasks." In the case of a font, the specific task is to render letterforms of a certain design. Period.</p></blockquote>
      <p>Essentialy what a piece of software does is to take the information given by the user, or by another piece of software, interpret it and display it in another way.</p>
      <p>The stress here is "or by another piece of software" since many (most) programs' can only operate if they interact with other programs. That is where Christoph Knoth is wrong:</p>
      <blockquote><p>The specific task to render a font is done by the font renderer of an application that takes font data as an input. So only the combination of renderer and font is software.</p></blockquote>
      <p>Sure, you cannot use font file without, say a text editor, but you also cannot use text editor, without an operating system (and you cannot have an OS, without BIOS). Does that text editors are not software?</p>
