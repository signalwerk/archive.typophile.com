      <p>First of all I will clarify why I asked this question; I am just starting to design typefaces of my own, which hopefully I will sell at some point in the future. As a result of this I have become more and more interested in aspects of the type design other than just the design part, including the retail of fonts. I have been aware for sometime that most foundries sell fonts as "font software", but I could never understand exactly why. It seemed strange to me that they were calling these things software, and I presumed that most end users did not necessarily think of fonts as software.</p>
      <p>The only reason I could think of (not knowing the technical details of fonts) as to why foundries would sell fonts as software was for legal reasons, and having more protection of software than just data. If this was the case then it seemed slightly misleading to consumers. So I asked the question here to see if there really was one defining factor of fonts that made them software.</p>
      <p>When I asked the question I knew that there was going to be a mixed response, because the definition of software is so difficult anyway. And as we have seen there are differences in opinion as to why fonts are software. I am neither against, nor for the way fonts are called software, I just think there should be a discussion amongst type designers about whether this is the correct, and best way to sell fonts.</p>
      <p>From the response here, it seems that the current way fonts are sold as software seems the best model. However, with the introduction of webfonts, the appearance of many new smaller foundries, piracy, and the long predicted end of print, I foresee that the way fonts are sold will probably have to change, but that is another discussion entirely.</p>
      <p>I would be interested to know in more detail the history of this subject; when were fonts first sold as software etc. Can anybody can point to some documentation?</p>
