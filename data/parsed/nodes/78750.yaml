      <p>My concern is not if fonts are software - it seems evident that they are. As with MP3's you can't make digital copies and sell them. However with an MP3 usually you can't take the licensed music it contains, record your own cover of it, and sell that. The "software" has changed, but the song has not. The creator of the song is owed. Not so with fonts (in the US).</p>
      <p>So.. is a font like a song? Now that is an interesting question with blurry edges. At first I thought "it's easier to look at a song and see if it's a cover".. but what about a sample, or a single borrowed line, or a chorus? I'd be curious to know how these cases are handled as they are more akin to font - remixing, reviving etc.</p>
