      <p>Well thanks for your comments everybody. I was hoping my post would start a hearty discussion and it did. I would like to reflect on some of the comments in the thread.</p>
      <p>If the US copyright office says fonts are software then this only means that under US copyright law fonts are <em>classified</em> as software. To me that does not necessarily mean that they <em>are</em> software. At this point I am really trying to understand, from a purely technological point of view, whether or not they are.</p>
      <p>I think it is important to make comparisons to mp3s, movies, even text files etc, because I would say these are the most closely related kind of "business model" there is; consumers paying money online and then downloading some data (which most of the time is only licensed, everything on iTunes and even ebooks from Amazon are only licensed not sold). By understanding a wider range of services we can improve the understanding of our own services.</p>
      <p>I do not think that type foundries are trying to trick 'dimwits' into thinking fonts are software. If selling fonts as software gives greater copyright protection then it is understandable that they would currently be licensed like this. However, I do think it is important that the end user is also able to understand exactly what (and why it is software) they are paying for.</p>
      <p>My own personal interest in this matter is driven by my inquisitive nature; if I am going to be licensing fonts then I need to understand what exactly it is I am licensing and also the best way to do this. I also think that this might make in interesting thesis for my master's degree (yes I really am an interested type designer!)</p>
      <p>Thanks</p>
