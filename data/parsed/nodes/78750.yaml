      <p>The distinction between character and glyph, which has emerged recently and come to exist as a well-understood philosophical concept, is, in a practical sense, politically predicated on both the Unicode Consortium, and the Microsoft-Adobe instituted OpenType, and dependent on the Internet.</p>
      <p>The distinction between character and glyph says something about the relationship between text and rendering, software and hardware, but the meaning is elusive. And this is what makes type design so interesting, among other things.</p>
