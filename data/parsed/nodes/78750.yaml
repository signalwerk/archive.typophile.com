      <p>Randy:</p>
      <p>&gt; So.. is a font like a song? Now that is an interesting question </p>
      <p>A good example is the famous song „Still got the Blues“ (1990) by Gary Moore, who died two days ago on 6th February 2011.</p>
      <p>The district court in Munich in Germany ruled in 2008 (LG München I, 03.12.2008 - 21 O 23120/00) that the song "Still got the Blues" was a copyright infringement of the older German song „Nordrach“ (1974).</p>
      <p><a href="http://www.justiz.bayern.de/gericht/lg/m1/presse/archiv/2008/01717/index.php" title="www.justiz.bayern.de/gericht/lg/m1/presse/archiv/2008/01717/index.php">www.justiz.bayern.de/gericht/lg/m1/presse/archiv/2008/01717/index.php</a></p>
      <p>The highly interesting point of this court judgment is the fact that Gary Moore committed copyright infringement, because the song „Still got the Blues“ is <strong>very similar to, but not identical with</strong> the older song „Nordrach“.</p>
      <p>Remember: Most fonts are <strong>very similar to, but not identical with</strong> other fonts.</p>
      <p>If fonts were copyrightable, then most fonts were copyright infringements, because most fonts are very similar to, but not identical with other fonts.</p>
      <p>The Munich court ruled:</p>
      <p><strong>"There are differences, but the similarity is striking."</strong></p>
      <p>("Es sind Unterschiede vorhanden, aber die Ähnlichkeit ist so frappierend.")</p>
      <p><a href="http://www.aufrecht.de/urteile/urheberrecht/still-got-the-blues-oder-auch-nicht-gitarrensolo-verletzt-urheberrecht-lg-muenchen-i-urteil-vom-03122008-az-21-o-2312000.html" title="www.aufrecht.de/urteile/urheberrecht/still-got-the-blues-oder-auch-nicht-gitarrensolo-verletzt-urheberrecht-lg-muenchen-i-urteil-vom-03122008-az-21-o-2312000.html">www.aufrecht.de/urteile/urheberrecht/still-got-the-blues-oder-auch-nicht...</a></p>
