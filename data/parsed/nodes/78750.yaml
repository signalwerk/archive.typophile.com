      <p>pseudo:</p>
      <p>&gt; <cite>I would be interested to know in more detail the history of this subject; when were fonts first sold as software etc. Can anybody can point to some documentation?</cite></p>
      <p>I happen to have on my bookshelf many of the old catalogs and books of the 1980s, e.g. numerous Linotype catalogs and Compugraphic catalogs, and the old URW books, and I also have the old printed Adobe PostScript reference and cookbook manuals of the 1980s and many other similar books of the late 1980s and early 1990s.</p>
      <p>If you look through these old books, you will find nowhere a text passage, where fonts are called "software" or "computer programs" etc.</p>
      <p>For instance, in the Linotype catalog of 1985, which contained a description of how Linotype digitized its fonts with the URW Ikarus system, Linotype used the technical term "digital font" and described fonts are digital data, but Linotype never said that fonts are "software" or "computer programs".</p>
      <p>The same is true for the original Adobe PostScript manuals. For instance, in the Adobe Reference Manual of 1985, page 62, we read this definition by John Warnock:</p>
      <p><strong>"font = set of graphic shapes that define the current typeface."</strong></p>
      <p>Nowhere the word "software" is used for Type 1 fonts by the Adobe managers Geschke and Warnock, the editors of these PostScript books.</p>
      <p>At that time, for Adobe, a Type 1 font was a collection of graphic shapes or graphic outlines of characters (the word glyph came later), but not a computer program.</p>
      <p>(Note: An exception were the "Type 3" fonts, which were full-fledged PostScript programs as already stated above by Luc Devroye).</p>
      <p>When Adobe started to sell Type 1 fonts, however, the Adobe marketing department decided to cheat dimwitted font buyers by telling them the legal fairy tale that Type 1 fonts are "computer programs" and "software".</p>
