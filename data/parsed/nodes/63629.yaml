  html: |-
    <p>Marimekko is a Finnish company making textiles and clothing. They've been a minor success around the world, especially since Jacqueline Kennedy bought and wore their clothes in the sixties. Lately they were in the news, when they sued Dolce &amp; Gabbana for copying their classic Unikko (Poppy) pattern.</p>
    <p>I updated their logo, and made two families reflecting the logo, which weas originally made in 1954 from Olivetti typewriting. With both type and logo I would have liked to go further, but they wanted to keep fairly neutral look, so there you go.</p>
    <p>Old and new logo<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Marimekkologo_3638.png"></div><p></p>
