    html: |-
      <p>Hello Again.</p>
      <p>LamaKova, you are correct there is a  lighter shade which would be interesting, but I was actually thinking of the jewel tone arils (see picture)</p>
      <p>1.) I still see some spacing issues that are more apparent with the tighter kern.<br>
      Alaskan; I think of the space between letters as if they are vessels that could contain water and even though the shapes are different between the different letterforms the amount of liquid would be the same or equal.<br>
      2.) The counter space inside the "e" will most likely be problematic when reproducing the logo at much smaller size.</p>
      <p>3.) The relationship with the qualifier "bistro" may also be too small, unbalanced and illegible when reduced, for something like a business card or hang tag.</p>
      <p>Great work.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pomegranate_05_6610.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/180px-Pomseeds2_5349.jpg"></div><p></p>
