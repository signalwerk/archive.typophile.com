      <p>If you need a text face to go with Antique Olive, consider Quimera from PampaType. It has the same reverse contrast: <a href="http://www.pampatype.com/php/2008/Especimen.php?&amp;pag=pag_E_Quimera.html" title="http://www.pampatype.com/php/2008/Especimen.php?&amp;pag=pag_E_Quimera.html">http://www.pampatype.com/php/2008/Especimen.php?&amp;pag=pag_E_Quimera.html</a></p>
