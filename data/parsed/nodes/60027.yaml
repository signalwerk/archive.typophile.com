    html: |-
      <p>Here's a way to fix it.<br>
      1. Open the Character panel and attach it to the side of the column of minimized panels<br>
      2. Attach a panel that can be resized (e.g. Table Styles) below the Character panel<br>
      3. Use the grip above the Character panel (see highlighted in red in the image below) to change the width of the column of panels</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IDCS3_panels_6642.png"></div><p></p>
