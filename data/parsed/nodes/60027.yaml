    html: |-
      <p>It never had a resize grip, that's why you can't change it back.</p>
      <p>Attach another panel at the bottom that <em>has</em> a resize grip (drag it by its label towards the bottom of the character panel until you see a blue line, then release). Although you can change the width of the character panel now, with some experimentation I still can't make the new width "stick". As soon as I drag ways the attached panel it snaps back to default width.</p>
      <p>If that doesn't work, you can always try resetting the program preferences.</p>
