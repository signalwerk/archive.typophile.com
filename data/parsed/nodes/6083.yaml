    html: <p>Haven't had time to work on Sonoma recently, but the weeks ahead look promising. I did have time to find a couple designs that not only have half-serifs, but also have flares for balance. <br> <br><a href="http://www.myfonts.com/fonts/bitstream/seagull/">Seagull</a>, by Adrian Williams and Bob McGrath, has a design based on handlettering, with asymetrical serifs, where with start of the serif stroke draws the balancing flare. <br> <br><a href="http://www.myfonts.com/fonts/linotype/sierra/">Sierra</a>, by Kris Holmes, has flares which occupy a greater portion of their side of the stem than Avance or Sonoma, starting to flare about halfway down, and ending closer to vertical.</p>
    html_clean: <p>Haven't had time to work on Sonoma recently, but the weeks ahead look promising. I did have time to find a couple designs that not only have half-serifs, but also have flares for balance. <br> <br><a href="http://www.myfonts.com/fonts/bitstream/seagull/" class="link-external">Seagull</a>, by Adrian Williams and Bob McGrath, has a design based on handlettering, with asymetrical serifs, where with start of the serif stroke draws the balancing flare. <br> <br><a href="http://www.myfonts.com/fonts/linotype/sierra/" class="link-external">Sierra</a>, by Kris Holmes, has flares which occupy a greater portion of their side of the stem than Avance or Sonoma, starting to flare about halfway down, and ending closer to vertical.</p>
