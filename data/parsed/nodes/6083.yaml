    html: "<p>Actually I think your spacing is in fact too tight overall. However: <br>1. It seems that some areas (like the \"ven\" sequence) are fine, and in fact some are too loose - so it's still too uneven to tell. <br>2. There's no easy way to be sure anyway without a physical printout in the intended medium  - probably through lino, right? <br> <br>The \"s\" is in fact too dark - because of its density it always has to be lighter than you think. <br> <br>&gt; Is it normal to have 26x26 kerning pairs to make all upper case text look alright? <br> <br>No, although I happen to think it's a great idea to use such an exhaustive matrix to loosen all-caps setting. <br> <br>Your \"bdpq\"... it depends who you ask: some designers will say they are \"wrong\". But I think they're more than fine. In fact, I've only seen such a wonderful \"d\" structure one other place - in my Patria... :-&gt;  But be careful of getting too attached to individual glyphs: taming overly flamboyant characters can be very painful but is usually necessary. <br> <br>Your main problem right now is the \"g\" (by far the most difficult character in Latin). Don't let dogma ruin it for you. Some otherwise wonderful designs (like Matrix) really need a much smarter \"g\". <br> <br>As for your uppercase forms, what I might advise is something I hinted at in the thread about Avance: go orthodox. Those puppies are really gloriously stiff - it's all they got - let them shine in their own way. <br> <br>BTW, your comma is amazing! But do make its tail longer. <br> <br>hhp <br></p>"
    html_clean: "<p>Actually I think your spacing is in fact too tight overall. However: <br>1. It seems that some areas (like the \"ven\" sequence) are fine, and in fact some are too loose - so it's still too uneven to tell. <br>2. There's no easy way to be sure anyway without a physical printout in the intended medium  - probably through lino, right? <br> <br>The \"s\" is in fact too dark - because of its density it always has to be lighter than you think. <br> <br>&gt; Is it normal to have 26x26 kerning pairs to make all upper case text look alright? <br> <br>No, although I happen to think it's a great idea to use such an exhaustive matrix to loosen all-caps setting. <br> <br>Your \"bdpq\"... it depends who you ask: some designers will say they are \"wrong\". But I think they're more than fine. In fact, I've only seen such a wonderful \"d\" structure one other place - in my Patria... :-&gt;  But be careful of getting too attached to individual glyphs: taming overly flamboyant characters can be very painful but is usually necessary. <br> <br>Your main problem right now is the \"g\" (by far the most difficult character in Latin). Don't let dogma ruin it for you. Some otherwise wonderful designs (like Matrix) really need a much smarter \"g\". <br> <br>As for your uppercase forms, what I might advise is something I hinted at in the thread about Avance: go orthodox. Those puppies are really gloriously stiff - it's all they got - let them shine in their own way. <br> <br>BTW, your comma is amazing! But do make its tail longer. <br> <br>hhp <br></p>"
