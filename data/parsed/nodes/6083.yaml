    html: "<p>This is going to totally disappoint Christian, but I've radically changed the feel of Sonoma. I dug this heap out of the garage a couple weeks ago and gave it some good polish. But I've learned lots and developed a certain taste since I worked on the poor thing last so a good polish turned into an overhaul. So I present the new Sonoma: <br> <br><a href=\"http://www.xtypa.com/ext/sonoma/sonomaspec.gif\"> Um, Click Here</a> (cause image uploading is broken) <br> <br>There is a pdf version of this specimen <a href=\"http://www.xtypa.com/files/sonomascintillatingspecimen.pdf\">over here</a> and if you'd like so see a pdf of the same specimen layout as the old Sonoma but with the updated design, take a look <a href=\"http://www.xtypa.com/files/sonomaharoldbloom.pdf\">over there</a>. Let me know what you think. I like how things are going so far, but I'd like to hear if this looks like a design that people would want to actually use for, you know, a real project. <br> <br>If you're interested in knowing more about this update, there's a bit more detail over on my <a href=\"http://www.xtypa.com/\">type design work blog</a></p>"
