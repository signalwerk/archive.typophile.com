    html: "<p>I've been trying to figure out what I like so much about this  <br>face. I've decided it's the clunkiness of the serifs combined  <br>with the overall inconsistency. It's really alive. I've long <br>loved the clunkyness of slab serifs, but most are a little too  <br>mechanical for my liking-- too perfect. This has more   <br>vitality. <br> <br>I think it looks great in the setting. I would polish a few   <br>characters, but nothing to change the overall feel. And   <br>don't even think about taming the k. If you really want to   <br>make a font to set a book in, start over. If you want a really   <br>funky cool something for small blocks of copy, you're right  <br>on. <br> <br>A few suggestions: The spur on the d and the q have got to <br>go. They are awkward, and don't fit the other characters.   <br>They imply a line that doesn't line up with anything else.   <br>The d could take a cue from the a. I would work on the   <br>terminals on the S, the j and the y. The terminals on the C   <br>and the G are also a little awkward. The G feels a little   <br>heavy. <br> <br>Don't polish too much though. It would be a shame to loose <br>the rough, chunky feel that makes this face so cool.</p>"
    html_clean: "<p>I've been trying to figure out what I like so much about this  <br>face. I've decided it's the clunkiness of the serifs combined  <br>with the overall inconsistency. It's really alive. I've long <br>loved the clunkyness of slab serifs, but most are a little too  <br>mechanical for my liking-- too perfect. This has more   <br>vitality. <br> <br>I think it looks great in the setting. I would polish a few   <br>characters, but nothing to change the overall feel. And   <br>don't even think about taming the k. If you really want to   <br>make a font to set a book in, start over. If you want a really   <br>funky cool something for small blocks of copy, you're right  <br>on. <br> <br>A few suggestions: The spur on the d and the q have got to <br>go. They are awkward, and don't fit the other characters.   <br>They imply a line that doesn't line up with anything else.   <br>The d could take a cue from the a. I would work on the   <br>terminals on the S, the j and the y. The terminals on the C   <br>and the G are also a little awkward. The G feels a little   <br>heavy. <br> <br>Don't polish too much though. It would be a shame to loose <br>the rough, chunky feel that makes this face so cool.</p>"
