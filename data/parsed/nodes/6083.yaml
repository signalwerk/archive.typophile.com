    date: 2005-04-27T06:59:00
    date_raw: 27 Apr 2005 — 6:59am
    votes: null
    html: <p>I agree that the figures are wide, and sometimes I think they look too big. <br> <br>One way of solving it is by making the shorter. And smaller, in consequence. This typeface is narrow, so I guess it is appropriate to have narrow figures. <br> <br>In general, I think that typefaces with low x-height are the ones that benefit more from having this kind of "floating" oldstyle figures (figures taller/higher than the x-height). But this is a typeface with a generous x-height, so I think the figures should be closer to the x-height. (But don't align them with the x-height! :-)</p>
