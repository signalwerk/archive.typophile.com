post:
  id: 6083
  user: 1290
  date: 2003-01-12T08:09:00
  date_raw: 12 Jan 2003 — 8:09am
  votes: null
  html: "<p><img src=\"http://www.typophile.com/forums/messages/29/4283.gif\" alt=\"Sonoma\">  <br>  <br><a href=\"http://www.xtypa.com/ext/sonoma/sonoma_v1.pdf\">PDF</a> - <a href=\"http://www.xtypa.com/ext/sonoma/sonoma_v1.gif\">GIF</a> - <a href=\"http://www.xtypa.com/004/\">Project History</a>  <br>  <br>Sonoma is my first serious attempt at completing a font. I was inspired by Evert Bloemsma's Avance to build a font with severely asymmetrical serifs. In the spirit of not wandering aimlessly, my goal is to make a font with which I can set papers for my college courses.  <br>  <br>At the moment, I've completed the lower and upper case basic alphabet. I want to reorient myself now before I embark on the full character set. I have a few concerns:  <br>  <br>1 The character spacing seems wrong. Maybe it's too tight?  <br>2 Some characters (<b>e</b>, <b>s</b>, etc...) seem too dark. Maybe this is caused by the spacing?  <br>3 The character spacing for upper case only works when preceding lower case. Is it normal to have 26x26 kerning pairs to make all upper case text look alright?  <br>4 Some of my glyph shapes (<b>d</b>, <b>g</b>, <b>k</b>, <b>q</b>) may be too crazy for a typeface intended for continuous text. Should I cave in an conventionalize them? (I refuse to budge on <b>Q</b>; the tail stays)  <br>5 The bowls in <b>b</b>, <b>d</b>, <b>p</b>, and <b>q</b> may be too large.  <br>6 My upper case forms are rough because I have less practice drawing them. Any ideas for improvement?  <br>  <br>I may be overlooking far larger problems here. If so, please set me straight! Assistance will save me trouble down the road and will be tremendously appreciated.</p>"
  html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/29/4283.gif\" alt=\"Sonoma\">  <br>  <br><a href=\"http://www.xtypa.com/ext/sonoma/sonoma_v1.pdf\" class=\"link-external\">PDF</a> - <a href=\"http://www.xtypa.com/ext/sonoma/sonoma_v1.gif\" class=\"link-external\">GIF</a> - <a href=\"http://www.xtypa.com/004/\" class=\"link-external\">Project History</a>  <br>  <br>Sonoma is my first serious attempt at completing a font. I was inspired by Evert Bloemsma's Avance to build a font with severely asymmetrical serifs. In the spirit of not wandering aimlessly, my goal is to make a font with which I can set papers for my college courses.  <br>  <br>At the moment, I've completed the lower and upper case basic alphabet. I want to reorient myself now before I embark on the full character set. I have a few concerns:  <br>  <br>1 The character spacing seems wrong. Maybe it's too tight?  <br>2 Some characters (<b>e</b>, <b>s</b>, etc...) seem too dark. Maybe this is caused by the spacing?  <br>3 The character spacing for upper case only works when preceding lower case. Is it normal to have 26x26 kerning pairs to make all upper case text look alright?  <br>4 Some of my glyph shapes (<b>d</b>, <b>g</b>, <b>k</b>, <b>q</b>) may be too crazy for a typeface intended for continuous text. Should I cave in an conventionalize them? (I refuse to budge on <b>Q</b>; the tail stays)  <br>5 The bowls in <b>b</b>, <b>d</b>, <b>p</b>, and <b>q</b> may be too large.  <br>6 My upper case forms are rough because I have less practice drawing them. Any ideas for improvement?  <br>  <br>I may be overlooking far larger problems here. If so, please set me straight! Assistance will save me trouble down the road and will be tremendously appreciated.</p>"
