    html: <p>I think of the stressless 0 as being a Gill-y feature, but that's based on gut feel rather than actual knowledge, so I'm probably out to lunch. If you're not going to use that, then I think you ought to make the 0 more ovoid. It really strongly resembles an oversized 'o' right now. <br> <br>I don't think the numerals are too wide. I guess I am kind of curious why the 1's serif structure is different from the letters', though. <br> <br>"Bitey" means the way the two serifs close in on the middle of the 3 makes it look like it's biting itself. It's too closed in, I would say.</p>
