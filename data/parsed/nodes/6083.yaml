    html: <p><i>The character spacing seems wrong. Maybe it's too tight?</i> <br> <br>I think it's just right. Many modern faces are too loose. <br> <br><i>Some of my glyph shapes (d, g, k, q) may be too crazy for a typeface intended for continuous text. The bowls in b, d, p, and q may be too large.</i> <br> <br>Naw, they're not too crazy. I think the biggest problem is <br>the bowl of the 'g' is too small in comparison to the others <br>which are lovely.</p>
