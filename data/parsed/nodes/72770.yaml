    html: |-
      <p>Hola Fernando. Well, it seems that sans projects always receive much more contributions than serif ones. My two cents:</p>
      <p><strong>01</strong>: about acute, what I told about Fénix applies here too. But I must add that Libertad acute has a wonderful shape, really handsome.</p>
      <p><strong>02</strong>: I like your f descender, but I believe it needs the same bottom cut as thorn descender.</p>
      <p><strong>03</strong>: your alternates for a and k are insightful and welcome, especially the 5th k and the 4th a. I don't like alternate s because its curves seem to be irregular –and so it does not fit to font overall regularity.</p>
      <p><strong>04</strong>: very nice numbers! I guess oldstyle 6 and 9 will work better with a somewhat bigger "o" to compensate the area "lost" due to out-of-lining arcs. Some test besides other oldstyle numbers would confirm or not my impression. Anyway, I don't like 5 vertical stem. It makes the glyph appear a bit inclined towards left. Maybe a small inclination in the stem solves this.</p>
      <p><strong>05</strong>: W could be a bit narrowed.</p>
      <p><strong>06</strong>: as it's intended to small sizes, comma and apostrophe may benefit with a stronger tail.</p>
      <p><strong>07</strong>: I second Thomas opinion about r.</p>
      <p>I like very much general text effect. Very clear, regular and legible. Glyphs d, p, q, h, m, n and g are perfect. I surely would use it with alternate a #4.</p>
      <p>Keep the great work.</p>
    html_clean: |-
