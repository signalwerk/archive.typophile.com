      <p>Hmm, 4 &amp; 6 of JPG 10 have some potential. I still say get rid of the outlines around the type. If you like this font, you can always go into illustrator -&gt; type-&gt; create outlines. This will make the type into vector shapes. Then you can select "expand" from the top tool bar. This will make it to where you can go through and delete those stroke lines around the type.</p>
      <p>I do think it's going in a direction at least. I'd say put some effort into making it read "Easy Soul" and making it look clean and professional. You might end up with a fairly nice portfolio piece at the least.</p>
      <p>courtney</p>
