    <p>Hi</p>
    <p>I´m doing a logo for a Jazz / Soul Band, named EC[easy]. This Jazz / Soul band is new and they haven´t got any logo yet.</p>
    <p>My problem is that I´m stuck with my idea... So I wonder if anyone could give critiques... suggestions... for this logo.</p>
    <p>The band itself doesn´t have a logo and they asked me to make one. Something that describes in a few words: </p>
    <p>- new<br>
    - soul<br>
    - jazz<br>
    - easy (EC)</p>
    <p>Other questions?</p>
    <p>- Is this logo proper for music industry and for a Jazz / Soul Band?<br>
    - Is there some proper font that I instead could use to make an logo for the band?</p>
    <p>Here is a link to the band: </p>
    <p><a href="http://profile.myspace.com/index.cfm?fuseaction=user.viewprofile&amp;friendid=166131331" title="http://profile.myspace.com/index.cfm?fuseaction=user.viewprofile&amp;friendid=166131331">http://profile.myspace.com/index.cfm?fuseaction=user.viewprofile&amp;friendi...</a></p>
    <p>Many Thanks,</p>
    <p>Ted</p>
