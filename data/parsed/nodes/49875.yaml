      <p>Too much. Way too much. Get rid of the splatter/stroke type. It doesn't serve a purpose. A great mantra..."Keep it simple stupid". I swear one day I am going to make myself a t-shirt so I can wear it while I'm working on projects. :) I am also plagued by the overwhelming want to put colors and colors and stuff everywhere...but...</p>
      <p>I think you are trying too hard. The cool thing (but hardest part) about design is that you are suppose to make it look effortless. It's suppose to look like you just sort of made it in a few minutes. But behind it all, there are hours upon hours of work and tweaking and kerning and frustration and then finally...SUCCESS!</p>
      <p>Also, the swirl doesn't read as an e, it's reads as a swirl. I do kind of like how you have the top of the s sort of following the o. That's a nice little piece there. But step back a little and clean it up. Jazz is all about the off beat. (I have played instruments for about 12 years now, including some jazz) Jazz is about the energy. You can show those things without making the text do them. It's cool to see how you're working though.</p>
      <p>courtney</p>
    html_clean: |-
