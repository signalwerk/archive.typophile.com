    <p>Well, thanks to Eric I was browsing the Neufville site, and to my very<br>
    pleasant surprise discovered that José Mendoza y Almeida’s Pascal face,<br>
    originally released in foundry metal towards the end of the 1950s, is<br>
    finally available digitally, in a high-quality and “official” version!</p>
    <p><a href="http://www.neufville.com/FontData/_Pascset.htm">http://www.neufville.com/FontData/_Pascset.htm</a></p>
    <p>For now only the display cut is available, but the text cuts are<br>
    planned, and to me at least that’s where the design really sings.<br>
    Although the metal Pascal I own only goes down to 30 point, the<br>
    smaller samples I’ve seen (not easy to find mind you) are great.<br>
    That said, the sparkle of this display cut is really captivating.</p>
    <p>Ladies and gentlemen, this is one fine piece of work. I rarely get<br>
    this glowing about a font, so I hope discerning typographers will<br>
    take the time to look at it closely, hopefully purchase it*, and<br>
    undoubtedly use it to great effect. From what I understand Mendoza<br>
    y Almeida was personally involved in this new digital release, and<br>
    I think one can tell.</p>
    <p>* I actually had trouble figuring out how and where to<br>
    buy it, but I’ve just asked Neufville for clarification.</p>
    <p>In the caps the comparison with Optima is inescapable. But in the<br>
    more important lowercase it goes where Optima’s manner is simply<br>
    too prissy, its gown too delicate, its complexion too pallid.</p>
    <p>Pascal is to Optima what Princess Stephanie is to Grace Kelly.<br>
    To me at least, much more alive and interesting.</p>
    <p>hhp</p>
