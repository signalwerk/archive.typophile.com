  html: "<p>Today I was at the Getty Museum, and they had an exhibit <br>called \"Devices of Wonder\". Anyway, throughout the exhibit <br>as well as the support materials they're using a couple of <br>nice typefaces, a sans and a serif, which look related. <br> <br>The sans especially looks very familiar, but I just can't <br>put my finger on it (all I know is, it looks very Unger). <br>As for the serif, it looks like a variant of a recently <br>released font, but there's some notable differences. <br> <br>So here's a scan: <br><a href=\"http://www.themicrofoundry.com/other/getty.gif\" target=\"_top\">http://www.themicrofoundry.com/other/getty.gif</a> <br> <br>I'd really like to find out what these <br>two fonts are, and who designed them. <br> <br>Note: Please do not email me any fonts! <br>I'd just like to know what the fonts are. <br> <br>Thanks. <br> <br>hhp</p>"
  html_clean: "<p>Today I was at the Getty Museum, and they had an exhibit <br>called \"Devices of Wonder\". Anyway, throughout the exhibit <br>as well as the support materials they're using a couple of <br>nice typefaces, a sans and a serif, which look related. <br> <br>The sans especially looks very familiar, but I just can't <br>put my finger on it (all I know is, it looks very Unger). <br>As for the serif, it looks like a variant of a recently <br>released font, but there's some notable differences. <br> <br>So here's a scan: <br><a href=\"http://www.themicrofoundry.com/other/getty.gif\" target=\"_top\">http://www.themicrofoundry.com/other/getty.gif</a> <br> <br>I'd really like to find out what these <br>two fonts are, and who designed them. <br> <br>Note: Please do not email me any fonts! <br>I'd just like to know what the fonts are. <br> <br>Thanks. <br> <br>hhp</p>"
