  html: |-
    <p> This is from a book printed in the mid ’60s, on a typesetting machine that allowed for ligatures (I’ve seen some ‘ﬃ’s) but not kerning—even the italic is unkerned. My scanner doesn’t work under Linux, so I have a photo; if higher quality is needed for an ID I’ll scan it again.<br>
     Some features of the font I’ve noticed:<br>
    • The leg of the `Q' begins on the bottom-outside of the circle.<br>
    • Quotes &amp; apostrophes are smaller than the commas.<br>
    • Four-headed `W' with separate serifs.<br>
    • The left leg of the `M' is slightly slanted, the right leg is straight.<br>
    • The square brackets `[]' have curved tops &amp; bottoms and little something-or-others on their sides.<br>
     I'll try whatthefont again after I get a high-quality scan; right now it's just suggesting distressed fonts.<br>
    —Joel<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Just_in_Time_6690.png"></div><p></p>
