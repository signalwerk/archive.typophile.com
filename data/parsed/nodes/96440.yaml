      <p>If you like that kind of thing, try to get your hands on a copy of Harry Nilsson's <em>Son of Schmilsson</em> album, the original 1972 vinyl edition. The whole album jacket, <a class="freelinking external" href="http://4.bp.blogspot.com/-2oYGA95F13A/Tvyonxe68xI/AAAAAAAAIv8/5dXygX8j1M4/s1600/front.jpg" rel="nofollow">front</a> and <a class="freelinking external" href="http://4.bp.blogspot.com/-Qa5_FLDYuqY/TvyooDDJbLI/AAAAAAAAIwI/84FbUDQIXl8/s1600/back.jpg" rel="nofollow">back</a>, and a complete lyric sheet inside, were all lettered by hand (by Peter Agapiou) in a glorious sanguine style. </p>
      <p>The music is pretty good, too.</p>
