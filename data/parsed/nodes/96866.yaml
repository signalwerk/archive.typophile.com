    html: |-
      <p>Thanks for the replies. My initial plan was to have it monospaced but after developing it some letters didnt suit being the same width such as the i. Departing from the grid definately seems like a good idea. </p>
      <p>The terminals were originally set as straight 45 degreed lines but I ended up going with the curves to make it a bit different. In the end I would quite like to have the curved and straight options available.</p>
      <p>I had considered Maurits as the name. I put down Riley after Bridget Riley but its all still in consideration and open to offers.</p>
