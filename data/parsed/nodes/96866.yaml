  - id: 524758
    user: 1551
    date: 2012-10-02T17:42:00
    date_raw: 2 Oct 2012 — 5:42pm
    votes: null
    html: <p>Visual coherence is much more important than relationship to the grid, in my opinion, but then I've never tried to stick to a grid. If you have the marked depth illusion on all the characters, then those that are impossible will have even more punch, I think. Remember they will be in words, so the conflict between possible and impossible will have its own play. I think having the terminal curves and width more consistent will help a lot. This part needs to be a bit more uniform, I think. Eg the C terminals are different.</p>
