    html: |-
      <p>An Escherian font is a nice idea, and I really like your curvy terminals.</p>
      <blockquote><p>all characters are the same width except for the m w and i</p></blockquote>
      <p>I can't think of a good reason to do that... Either all the characters should be the same width (AKA monospace font) which can be a useful feature, or let each character be the width it needs.</p>
      <p>BTW, call it Maurits.</p>
      <p>hhp</p>
