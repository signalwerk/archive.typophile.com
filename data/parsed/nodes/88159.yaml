  html: |-
    <p>dear friends Typophiles!<br>
    i am glad to present my new typeface: square serif typeface for many purposes in Latin, Greek and Cyrillic, in six weights with original italics, alternatives, few ornamentals, small capitals and three sets of digits. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BanderaPro_550_01_5553.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BanderaPro_550_02_5990.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BanderaPro_550_03_4793.png"></div><p></p>
    <p>Bandera Pro has the same proportions as sans serif <a class="freelinking external" href="http://type.org.ua/osnova/" rel="nofollow">Osnova Pro</a> typefamily, so they can work together.</p>
    <p><em>Bandera</em> is Spanish for ‘flag’. and Bandera is a symbol of Ukrainian fighting for freedom for many years.</p>
    <p>please look closer: <a class="freelinking external" href="http://new.myfonts.com/fonts/andrijtype/bandera-pro/" rel="nofollow">BanderaPro@myfonts</a><br>
    and see more pictures <a class="freelinking external" href="http://type.org.ua/bandera-pro/" rel="nofollow">here</a>.</p>
