      <p>An em is a width dimension equal to the height of the type being used. Thus 1 em of any font gives a square (as opposed to rectangular) area.</p>
      <p>When an em is divided by 1000, the only term I have heard is unit. Unit is not a consistent unit -- in older systems units were 18 or 54 to the em. The closest one could come to a standard definition is that the unit is the smallest amount that an em could be split into when providing different widths for glyphs.</p>
      <p>If I am not mistaken, one of the sales points of the Monotype system early in the last century was that it used 54 units per em, while Linotype machines were at 18 units per em.</p>
