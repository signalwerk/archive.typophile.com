      <p>David --</p>
      <p>I don't doubt that you encountered many unitized drawings. You were at Linotype toward the end, right -- late 70s? As I alluded to in my post, the Linotype photo typesetters were unitized. The early machines were constrained to 18 units. The V-I-P was able to handle a finer system of 54 units. I would expect this is what you were drawing for, right?</p>
      <p>Also, the TTS system was 18 units, IIRC. (I remember an anecdote from Mike Parker: something to the effect that Jackson Burke lamented that much of his reign at MLCo consisted of overseeing the continual revision of Corona to the TTS system as newspapers desired to increase their body sizes.)</p>
      <p>I also wouldn't be surprised if faces that were originally Monotype faces maintained their original 18-unit widths when done up for Lino (even in metal) -- e.g., TNR. And, of course, Sabon complied with 18 units to be "cross-platform."</p>
      <p>My original point was that unitized widths were not an inherent restriction of metal Linotype, in order to counter Don's earlier recollection.</p>
      <p>-- K.</p>
