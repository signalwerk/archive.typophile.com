      <p>&gt; <em>Foundry types had scalar widths</em></p>
      <p>If you mean that traditional typefounders had a kind of unit system for letters, of the kind that Monotype used in order to justify its lines, I'm doubtful if this was ever the case: the width of hand-cast type depends on the setting of the registers of the mould, and is beyond the control of the punchcutter or matrix maker. Given the idiosyncracies of individual casters, it can be different every time a new fount is made. To be sure modular ‘self-spacing' type was introduced at the end of the 19th century – but only when long-haul hand setting of type was nearly over.</p>
      <p>As for the exactly regular modular spaces of Aldus, which Peter Burnhill thought he had detected, judging from my limited experience as a compositor I think these would be very unhelpful. The classic set is thin, mid and thick – or 5, 4 and 3 spaces to the em quad. Their odd combinations produce subtle increments, or reductions (or whatever the opposite of increment is), which are a godsend when a line is just too loose or just too tight, as often happens. But judging what just too loose, or just too tight, or indeed just right, all mean is a matter of feedback through your fingers. The number of words to be spaced varies unpredictably from line to line, and you may want bigger spaces between two l's than two o's. Setting type well by hand is not a completely rational and mathematical business, thank goodness.</p>
