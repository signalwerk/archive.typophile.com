      <p>Widths were, I believe a characteristic of both. When I was at Linotype I found many drawings on an 18 unit system and all the new faces we made were on 54 units. There are unit systems hiding in other places as well. E.G. Highway Gothic, we found, was made on a 10 unit system, most likely we surmised, to make the composition of road signs much easier for USDOT employees in a the precomputer age. </p>
