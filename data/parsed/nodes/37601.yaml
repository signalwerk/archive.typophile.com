      <p>I meant toward the end of "American" Linotype. My recollection of the history was that MLCo was sold off to Allied Chemical in 1979, and then moved offshore not too long thereafter (what I call "the end").</p>
      <p>By "unitized widths" I mean a system of discreet and relatively coarse divisions of the em. Is this what you mean as well?</p>
      <p>Obviously, there was a minimum discreet increment for the drafting and machining of Linotype characters. Off the top of my head, I think it was 0.00025 inches. So, I suppose you could say that the Linotype used a 333-unit system (for 12-point type; more like 4000 units for 72 pt). But I don't think that's what we're talking about.</p>
      <p><cite> &gt; All pre-digital systems needed to count and move in increments coarser than those of the grid </cite></p>
      <p>Almost all; but not quite.</p>
      <p>Yes: from what I know, the Monotype composition system (in metal) employs a mechanical calculator -- justifying by basically adding up character widths in the line and then calculating the wordspace by distributing the leftover space when the compositor indicates an end-of-line. Different arrangements of the matrix-case (i.e., which characters are in which unit row) require different cylinders for the composing machine, in order to properly calculate the line. (That is, the machine needs to "know" whether the n character is 9 or 10 units in the particular face at hand.)</p>
      <p>In distinct contrast, however, the Linotype justifies by a purely mechanical means. The space bands are wedge shaped. As the compositor reachs the end of a line and decides where to break, the wedges are then physically forced upward to push out the line before casting the slug. No discreet increments (smooth, evenly tapered wedge) = no math = no calculation necessary. So, no organized system of widths needed.</p>
      <p>On the other hand: yes, the early Linofilm photosetters rely upon a writing prism that travels at a constant speed, and I believe justification is achieved through some kind of calculation. (My understanding of this system is not as thorough.) Factors such as the speed of the drive and the minimum amount of time required to open and close the shutter have some bearing on the constraints of advance widths. </p>
      <p>The V-I-P, developed later, employs a stepping motor and can move discontinuously (even standing still!), which allows more flexibility (thus, 54 instead of 18 units).</p>
      <p>-- K.</p>
