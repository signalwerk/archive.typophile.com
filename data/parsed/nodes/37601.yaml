      <p>Thanks for the summary Kent. I think "No discreet increments (smooth, evenly tapered wedge) = no math = no calculation necessary. So, no organized system of widths needed." this may be theoretically true, but practically everything was on unit systems because of the plethora of mechanisms and the eternal shortage of steady hands. </p>
      <p>Cheers, and thanks!</p>
