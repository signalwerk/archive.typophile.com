      <p>As Bill points out, Don, unitized widths were a characteristic of Monotype and not of Linotype.</p>
      <p>The Monotype system employed a matrix-case which was typically 15 x 15. All characters in a given row needed to have the same set width. So, designs were restricted to a system which divided the em into 18 units (not all increments were used for each font). This unitized system was also integral to the calculations of the Monotype justification method.</p>
      <p>The Linotype, on the other hand, had no unitized width restrictions. However, it was not possible to have any kerns (character elements projecting beyond the metal body), which was possible in Monotype. Also, most Linotype families had two styles on a single matrix, which meant that the two designs had to have the same widths -- i.e., be "duplexed". There were usually options for Roman duplexed with Italic or Roman duplexed with Bold. This had a distinct advantage for certain types of typesetting, but a distinct challenge to the type designer.</p>
      <p>As Bill notes, early Linotype photo-typesetters did have unitized systems, because of certain mechanical restrictions in the advance drive motor. Also, in the newspaper industry, TTS was a pervasive standard which required unitized widths, and this was applied to Linotype newspaper types.</p>
      <p>Regarding the original question, I've never heard that capitalization made any difference. An em is as has been described. I've always heard the units used in digital font applications referred to as "em units" -- which for Postscript fonts is 1/1000th of an em.</p>
      <p>-- K.</p>
