      <p>Having a limited number of character widths in a font does provide a certain rigor and discipline to the type design.<br>
      And the reductive duplexing of roman and italic (eg Sabon, Optima, Univers) gives a distinctly modern character to typefaces designed with that in mind.</p>
      <p>With so many options for width now, and global kerning, it's easy to be sloppy, and the aesthetic departs from one which is "scalar" -- i.e. having an inbuilt, mandated predisposition towards harmonic relationships between character widths.</p>
      <p>Foundry types had scalar widths (and this goes at least as far back as Manutius, see <em>Types of Space</em>, a very practical reason being that this facilitated justification. The system incorporated a variety of space characters, so that "s+hair space=n" (or something like that, I'm not familiar with the exact maths).</p>
