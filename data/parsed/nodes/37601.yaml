    html: |-
      <p>Starting with the book Typographical Printing Surfaces by Legros and Grant, and then reading between the lines of the ATF catalog - there's a table where it gives the actual widths of the different spaces that are billed as "3 to em" and "5 to em" in different point sizes - it appears that their foundry types were indeed made to a unit system, but unlike Monotype's, it did not scale with the size of the type.</p>
      <p>Instead, the width of every type slug, whatever the point size, was an integral multiple of 1/4 of a point. So foundry type was unitized, and the evidence of that can be found.</p>
