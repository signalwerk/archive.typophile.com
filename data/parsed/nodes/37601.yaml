    <p>Hey everybody, the relative size unit <strong>Em</strong> measuring type size is capitalized in the context of digital type in order to distinguish it from the smallest unit in font editors which is all lower case <strong>em</strong>, right? So in a PostScript Type1 font the Em measures 1000em. Is that assumption correct? In books about letterpress however the Em is spelled in all lower case. Does anybody know of the historic background and the rational behind this and do you think these units should be spelled consistently? After all the notation for a metric meter won't change wether you measure steel or hardwood floor... </p>
    <p>Thanks!<br>
    Hannes</p>
