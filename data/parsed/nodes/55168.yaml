    html: |-
      <p>Just use something that looks okay visually in your font.  This is like asking if the acute accents should be more vertical or horizontal or if the dot of the umlaut should be in line with the i.  The answer is Yes and No at the same time :)</p>
      <p>Spanish also uses -er and, much less commonly, -os and -as.  There was a thread back a while ago asking if there was a way to automagically figure this out and the result was that for some languages like Russian it's impossible because of declensions.</p>
      <p>In my current text font I'm placing all ordinals the same, but with a slight underline.  In Spanish this is quite common and (almost) expected.  In English and other languages it's not a bother.  There's another set of superiors ('script') to go with the math set.  But that's just one solution among many.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
