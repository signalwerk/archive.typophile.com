    html: "<p>Don't forget caps: if an ordinal is used in, say, a date that's set in all caps, shouldn't the ordinal be in caps too?</p>"
    html_clean: "<p>Don't forget caps: if an ordinal is used in, say, a date that's set in all caps, shouldn't the ordinal be in caps too?</p>"
