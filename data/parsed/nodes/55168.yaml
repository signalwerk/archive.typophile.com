    html: |-
      <p>Nick, that's a good question.  In all caps situations, roman numerals are generally used which avoids the question, and in dates ordinals aren't used at all.</p>
      <p>In older times in such situations, I see it put in all (small raised) caps or with a large tilde with small caps.  I think if someone abbreviated María as M.A with a small cap A with tilde (which is hypothetical, I've never seen it that way), they'd be quite confused, ditto for HRMNOS with a (single long) tilde over the small capped (baseline) rmnos.</p>
      <p>In modern day applications I generally it's not uncommon to see the lowercase used if another avoidance technique isn't used.  If perchance your small cap and numerators have a similar or same height / weight, that might be a good option.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
