      <p>Well, once I say it's not going to be used too much I'm of course going to find examples.</p>
      <p>I found one today at a restaurant, a printed announcement from 1777.  It had a few typographic niceties that I'll post later in the general forum, but of interest here, the abbreviations for an all caps line were done also in all caps, raised to match caps-line.  They  appeared to be either small caps or the next size down caps for the type face.  In any case, that probably will work best.  Take your small caps and instead of aligning them to the baseline, pop them up to align their caps height with that of your normal caps.  Will post the picture when i get it (friend had the higher quality camera so gotta wait for him to e-mail it to me)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
