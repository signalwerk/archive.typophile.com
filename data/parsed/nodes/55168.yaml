    <p>How are the ordmasculine ordfeminine used? If ordinals are used for 1st, 2nd, etc., I assume they are positioned to work best with figures and figure height--hence I position them to align with numerators. But what of the ords? are they positioned vertically in the same place or with the superior figures?</p>
    <p>ChrisL</p>
