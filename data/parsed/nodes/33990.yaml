    <p></p><div class="imageWrap"><img src="http://typophile.com/files/burgues_3638.jpg"></div><p></p>
    <p><strong><a href="http://www.sudtipos.com/fonts/97" rel="nofollow">Burgues Script</a></strong> is the new project of the Sudtipos foundry, based on the ornate lettering of calligraphy teacher Louis Madarasz (1859–1910). As with previous major type releases, we invited some very talented artists to collaborate on the <strong><a href="http://www.veer.com/download/pdf/burguesscript.pdf" rel="nofollow">PDF type guide</a></strong>. Thanks to Horacio Lardies, Florencia Kohan, Mariano Lopez Hiriart and Jose Ignacio Fernandez, who illustrated the words that Alejandro Paul designed.</p>
