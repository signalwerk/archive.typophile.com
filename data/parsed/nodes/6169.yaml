  html: "<p>i was thinking today... you know you see those catchword fonts sometimes that have logotypes like \"the,\" \"for,\" \"of the,\" \"and,\" etc. I was thinking i would like to come up with some kind of list that lists some of the most common. I'd like this list to be multi-lingual, too, including any language that uses the latin alphabet and actually has catch words (articles and prepositions mostly i guess). Anyhow, looking at LettError's Salmiak (and racking my own brain) i got: <br> <br><b>English</b> <br>and, the, of, at, RSVP, etc., www., com, dot, inc., ltd., of the, for <br> <br><b>Spanish</b> <br>el, la, de, del, de la, por, para, por el, por la, al, a la <br> <br>so there's a bit of a start. if anyone could help compiling this list (or correcting my Spanish) please tell me your catchwords. thnx for looking. <br></p>"
  html_clean: "<p>i was thinking today... you know you see those catchword fonts sometimes that have logotypes like \"the,\" \"for,\" \"of the,\" \"and,\" etc. I was thinking i would like to come up with some kind of list that lists some of the most common. I'd like this list to be multi-lingual, too, including any language that uses the latin alphabet and actually has catch words (articles and prepositions mostly i guess). Anyhow, looking at LettError's Salmiak (and racking my own brain) i got: <br> <br><b>English</b> <br>and, the, of, at, RSVP, etc., www., com, dot, inc., ltd., of the, for <br> <br><b>Spanish</b> <br>el, la, de, del, de la, por, para, por el, por la, al, a la <br> <br>so there's a bit of a start. if anyone could help compiling this list (or correcting my Spanish) please tell me your catchwords. thnx for looking. <br></p>"
