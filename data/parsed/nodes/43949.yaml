      <p>I very much like the degraded edges on the letter forms.  That's the best part of this.</p>
      <p>Even the base, un-degraded font is very difficult to read. Possibly it would be easier to read if it weren't outlined -- if it were just black text on white background. </p>
      <p>The black virus splotches aren't good.  They are just distracting and I'm still not sure what everything says after trying to read it for several minutes.</p>
      <p>Keep the overall form and the pattern of degraded edges.</p>
