    <p>Hello there,<br>
    My names Mike and I go to College for Creative Studies in Detroit Michigan. In my type 4 class we had to create our first ever type face, my concept is "degradation over time." I started with a base face which has a modular look to it in order to provoke the idea that even a seemingly perfect type face will degrade and become imperfect over time. My type teacher posed the idea to add a second system to my face that would degrade it...something that would exist on its own, something non modular. Since my face looks ver tech like I decided to give it a virus..no, not a computer virus..the EBOLA virus, which in its stages eats away at you insides then finally your flesh. There are 3 faces on my spec poster my base face (non degraded), my 2nd face (more degraded) and my 3rd face the most degraded. Take a look at let me know what you think! </p>
    <p>thanks alot,<br>
    Mike</p>
    <p>check it out here:</p>
    <p><a href="http://flickr.com/photos/mikeshanoski/2393367811/sizes/o/" title="http://flickr.com/photos/mikeshanoski/2393367811/sizes/o/">http://flickr.com/photos/mikeshanoski/2393367811/sizes/o/</a></p>
