      <p>This is the thread to go for when you want to know more about the correct release date of the Grotesk typefaces by Schelter &amp; Giesecke.<br>
      <a href="http://typophile.com/node/19482" title="http://typophile.com/node/19482">http://typophile.com/node/19482</a></p>
      <p>‘1825’ for ‘schmale magere Grotesk’ is a mistake from this article by Handover:<br>
      <a href="https://www.flickr.com/photos/winkelhaken/sets/72157640577654825/with/12341235703/" title="https://www.flickr.com/photos/winkelhaken/sets/72157640577654825/with/12341235703/">https://www.flickr.com/photos/winkelhaken/sets/72157640577654825/with/12...</a><br>
      This is the German translation in Monotype Nachrichten. The original version can be found here:<br>
      P.M. Handover, Grotesque Letters, Monotype News Letter 69, March 1963</p>
      <p>James Mosley shows an older German sans serif from 1858 here:<br>
      <a href="http://www.typophile.com/node/46184" title="http://www.typophile.com/node/46184">http://www.typophile.com/node/46184</a> </p>
      <p>The book ‘Handbuch der Schriftarten’ by Wetzig, Seemann 1926 lists more German sans serifs of older date (i.e. before 1858). Wetzig does not mention any sources for these dates, and I have not really succeeded in verifying any of these ‘earlier German sans serifs’ yet …</p>
