      <p>Schlank can be translated as slim. In current type terminology it would be called thin condensed or light condensed.<br>
      Within the context of German type terminology around 1900, Breit is the formal opposite of Schlank, it can be translated as wide or broad. Today one would call such a face bold extended. Some of the typefaces that used to be called Breit, are wider than the extended typefaces of today. Many foundries did not use the word ‘normal’. Instead, type could be called either mager (regular) or fett (bold), or either schlank (thin condensed) or breit (bold or bold extended). And then of course there is breit mager, which would now be light or regular extended.<br>
      Or what do you mean by idiosyncrasy?</p>
