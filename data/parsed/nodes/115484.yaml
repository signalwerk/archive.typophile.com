      <p>Wolfgang Homola did the most extensive research on the Grotesk typefaces from Schelter &amp; Giesecke so far:</p>
      <p>Type design in the age of the machine. The ‘Breite Grotesk’ by J. G. Schelter &amp; Giesecke. Wolfgang Homola, 2004. That is the title of his Dissertation he did for his MA in Typeface Design at the Department of Typography and Graphic Communication at the University of Reading.</p>
      <p>It is not available through the Reading website anymore, but I found it here:<br>
      <a href="http://www.pdfio.com/k-1973302.html" title="http://www.pdfio.com/k-1973302.html">http://www.pdfio.com/k-1973302.html</a></p>
