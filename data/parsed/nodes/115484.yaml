    <p>In the course of the XIX th century, there were two countries that launched the new production of sans serif typefaces: England and Germany. The most famous German foundry was Liepzig-based <strong>Schelter und Giesecke</strong> which gave grotesk typefaces from 1825. Other German foundries like <strong>Berthod</strong> and <strong>Stempel</strong> will produce grotesks but at the end of the century.</p>
    <p>The only references of <strong>S&amp;G</strong> grotesks belonged to the last quarter of the XIX th century: <em>Schelter Grotesk, Schlanke Grotesk, Breite Grotesk</em>.<br>
    Designer Nick Curtis attempted to reproduce the style of these typefaces.</p>
    <p>1. Is there any leads to pinpoint the very first German grotesks from 1825?<br>
    2. Is there any book dedicated to the <strong>Schelter und Giesecke</strong> foundry?</p>
