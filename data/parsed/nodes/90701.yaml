    html: <p>Hrant, we're talking about measures of comparison, a basic principle of which is that you need to isolate the factors that are unique to the things being compared, and identify a common factor or factors. In the case of text, given the particularities of writing systems and of individual styles within those writing systems, proportion of white isn't the easiest measure available, it is the only common measure. This is not to say that there are not other common measures that would apply to some particular set of compared examples -- slant is a common measure by which italics can be compared, for example, but not romans --, only that when you take all text, in toto, the only common basis on which they can <em>all</em> be compared is relative proportion of white. And I don't think Noordzij is making this point in order to suggest that comparing different examples of writing in this way is a useful exercise, but to stress the universality of the proportional role of the white in all the world's writing systems.</p>
