      <p>I didn't say anything about an <em>expanded</em> skeleton. What I was talking about is the strong sense of structure, and the fact that even though the edges do not follow a traditional or tool derived relationship there is no sense of structural wobble in Legato. Contrast this with types that attempt a traditional edge relationship but fail because of lack of experience or skill of the designer (the Typophile critique forums have plenty of examples): they're less a 'norm-violation' than Legato, but also less structurally sound because what happens in their edge relationships introduces wobble in the perception of the shapes. This is important, and I think it is key to the success of Legato's systematic approach to edge relationships: even though no writing tool or manipulation can create quite those 'strokes', one can impose a hairline skeleton on the Legato letters and see that a) it is a strong structural form and b) the relationships of the edges to that skeleton are systematic and consistent. <em>They're just not tool based.</em></p>
      <p>Now here is an interesting idea: since the relationship of edges to a structural skeleton in Legato do seem to follow a consistent, systematic approach, would it be possible to algorithmically expand that skeleton to produce these kinds of relationships? That seems to me a practical question that could be practically explored. Why would one bother? Well, it would settle the question of how illusory or not the perception of a skeletal structure in Legato is. What it wouldn't do it settle how important that perception -- illusory or not -- is to the readability of the type. I theorise that it is important because what we recognise in reading -- at text sizes in any case -- is <em>shapes</em> not edge relationships, and hence edge relationships need to support the perception of shape not undermine it (which is why wobble is a problem).</p>
