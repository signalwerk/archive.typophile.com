      <p>Three sentences and a source attribution is a lot?</p>
      <p>I do like what you say about script culture, and that what is remarkable about Legato is just how comfortably it sits within the Latin script culture, despite doing things that I would considered strong norm-violations. What I said about my analysis of Legato provides an elaboration of just that.</p>
      <p>In the context of this thread it might be interesting to point out that Bloemsma's vantage point in the introduction of his norm violations is the consideration of how the whites sit inside the black and how they co-relate in the context of the word. The outcome is a distinctive contribution to the consolidation of the word, which is his avowed aim.</p>
