      <p><em>…some systematic way of looking at the white space…</em></p>
      <p>It is determined by the relative scale of the tool size to the letter height.<br>
      The white space is what’s left over after the ink/paint has been applied.<br>
      This applies even to constructed brushwork.</p>
      <p>Constraints include the complexity of letterform, and the amount of words in the page layout.</p>
