      <p>Carl, </p>
      <p>You say you are fascinated with what Noordzij says about the white but are wondering if there’s some structured way you can speak about type using the concept of white space.</p>
      <p>I see chapter 1 of <em>The Stroke</em> as a manifesto about something that eludes ‘structural’ description, and less about the ‘synergy’ between the ‘white’ and the ‘black,’ than about the centrality of the white.</p>
      <p>In writing, that is, when it comes to readability, it's all about the white. The black of the letter must be close enough to conventional forms to be identifiable — and these vary from type to type and script to script — but when it comes to words and texts (which are what writing puts in place) the white is primary. If there is no equi-valence between the whites inside the letters  and the whites between the letters, and if there is no disruption between the white of the word and the white space between words, the word disappears because the word-image as a bounded visual gestalt or unitary object-like entity falls apart.</p>
      <p>However, while you can get a precise or ‘structural’ description of the black, even when the shapes deviate from the strokes of writing in systematic (and unsystematic!) ways, you can only gauge the whites of the word according to their comparative ‘weights’ or valence.</p>
      <p>I said the white eludes structural description, but it is possible to talk about the hierarchy of the whites in typography.</p>
      <p>Peter Enneson</p>
