      <p>Hrant: <em>You can respect the white, and try to make it happy, but as long as you're only marking the black it's all an illusion.</em></p>
      <p>If Noordzij were talking about the <em>shape</em> of the white, I'd agree that there are specific situations in which the marking of the black determines the shape of the white such that the latter must be considered secondary. By the same token, though, if one were to manipulate the pen to shape the white in some particular way, that would subjugate the black to the white, and I'm not sure the situation is much changed if one creates the black/white edges in some independent way: decisions about shapes affect adjacent shapes.</p>
      <p>But Noordzij is <em>not</em> talking about the shape of the white, he is talking about 'the relative proportions of the white in the word', in the context of comparing different examples of writing. His point, and I think it is a sound one, is that if one seeks a single common measure by which one can compare <em>any</em> two or more examples -- regardless of script, age, style -- then the only measure available is relative proportion of the white, because all other aspects of the examples introduce too many variables. In particular, note that the stroke itself does not provide such a measure.</p>
