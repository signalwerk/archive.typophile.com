      <p>John, when I use norm in these contexts, I'm not using it in the sense of standard or model (an ‘ought’), but in the sense of conventional pattern (or ‘is’) that has accrued over time. Violation in these contexts is just deviation from that evolved conventional pattern. Any feature manipulation away from a conventional base is norm violation.</p>
      <p>My use of the term stems from my reading of Douglas Hofstadter's “Letter Spirit: Esthetic Perception and Creative Play in the Rich Microcosm of the Roman Alphabet” in <em>Fluid Concepts and Creative Analogies: Computer Models of the Fundamental Mechanisms of Thought</em> and papers he did with Gary Mcgraw and John Rehling in the aftermath of his critique of Donald Knuths essay in <em>Visible Language</em> on the Concept of a Metafont.</p>
      <p>For Hofstadter, “norm violation is the name of the game in creation.”</p>
      <p>I once did an an analysis of Legato on Typophile that shows how, starting from an expansion-with-contrast reduction base (the sans serif), a clever series of norm violations are introduced which have the result of producing a humanistic sans, namely one that approaches the conditions of translation.</p>
