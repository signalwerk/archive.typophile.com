      <p>I know what drawing an outline is, and I know how adjusting it in font creation software is done. I also know what marking the boundary of a form— where form and counter form meet — is or amounts to, but I must confess, I don't know what <em>designing</em> the boundary is.</p>
      <p>In drawing an outline or marking and adjusting the boundary of a form (“the black”) I think “the pen” can provide a notional reference axis. This is different than setting up the shapes delivered by the pen as the norm. What I've been calling norm-violation (vis à vis the pen — systematic, across the character set; or ad hoc, in a glyph-by-glyph manner) I can conceive of as enhancing readability. </p>
      <p>To me Legato introduces non-incidental norm-violation of a complex and systematic sort, and I think there is at least a theoretical basis for thinking it enhances readability.</p>
