      <p>@carlgraham7:</p>
      <p>1. Is this for a masters or PhD?</p>
      <p>2. Where are you studying?</p>
      <p>3. Who is your supervisor?</p>
      <p>4. “<em>since he was 10. He’s 54 now, so that’s like, forever (44 years)</em>.” — lose the ‘like’ if you want to be taken seriously. Seriously. (deliberate use of rhetoric). Watch the capitalization.</p>
      <p>5. “a neater outter form is valued more than the <a>color</a> or visual density of the words.” — In a document as formal as a thesis, <strong>never</strong> cite Wikipedia as a source (unless of course you are making a statement to the effect of “Wikipedia defines typography as…). It has been my experience that a professor won’t even dignify the work with a mark. Even at an undergraduate level. It will simply be returned to you with comment to the effect of “re-submit this after you have conducted a literature review.” Regardless of it’s lack of credibility, it can change over time resulting in differennt interpretations of your work. Typo on outter = outer.</p>
      <p>6. I agree with Nick. You need to operatinalize your terms. This means to define what <strong>you</strong> mean when you use a word in your paper. Not a formal declaration of the word’s meaning in every context in every dictionary in the world. Just for the purpose of your paper. This prevents potential misinterpretation and is standard practice in virtually all writing at a graduate level and beyond.</p>
      <p>7. The structure of your current writing is remarkably close to the APA structure of a manuscript. I encourage you to move forward in that direction to formalize your work. See:</p>
      <p>American Psychological Association, (2009). <em>Publication Manual of the American Psychological Association (sixth edition)</em>. American Psychological Association. Washington, DC, United States.</p>
      <p>Continue with your literature review and remember to stay focused. It feels very daunting at first and is very easy to shot-gun off into too many directions, but as you proceed with your reading, it gets easier and easier to determine what is relevant and what is not.</p>
