      <p>Peter, I don't think the notion of 'norm-violation' is very helpful, at least not without the kind of nuance in the interpretation of the words that requires quite a lot of explication. I think it is possible to approach type design in relationship to written forms in a variety of ways without evoking 'norms' or suggesting that some of these ways represent violations. My own approach is to recognise that -- presuming one is designing for a cultural script, i.e. one that has evolved over time in the literary life of communities with particular histories -- almost all scripts have originated in and/or passed through writing, and this process has established the shapes of the signs as expressed by particular tools and movements. Hence, reference to those tools and movements is a legitimate and sensible aspect of typeface design, and what is important here is not that this anchors types to 'norms' of letter shape or stroke modulation but that it anchors them within the script culture.</p>
      <p>One of the things that is interesting to me about Legato is just how comfortably it sits within the Latin script culture, despite doing things that would be considered norm-violations in your analysis. I think this comes from the strength of structure -- the sense of a skeleton even though the edge relationships plainly demonstrate that none can exist -- and also the quality and measure of tension in the "strokes", which although being differently arrived at is of a similar tenor to that found elsewhere in the line of 'humanist sans' derived from more traditional constructions.</p>
    html_clean: |-
