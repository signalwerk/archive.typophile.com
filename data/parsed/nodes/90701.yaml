      <p>&gt;  the relative proportions of the white in the word</p>
      <p>What he's talking about is "negative space", which is the space around an object. It's an important concept in graphic design. Sounds like he's focused on the space immediately around the characters themselves, rather than the entire page or sign.</p>
      <p>I wouldn't call it "the white" because that's only accurate when writing on a white surface. If a sign has white type on a red background, for instance, the negative space is red.</p>
      <p>&gt; The white of the word is the only thing all the<br>
      &gt; various kinds of writing have in common.</p>
      <p>I haven't read his writing, but my offhand impression is that his comment doesn't seem very useful. The negative space is dictated by the shapes of the letters. If the negative spaces have common traits, it's because the writing itself has common traits.</p>
