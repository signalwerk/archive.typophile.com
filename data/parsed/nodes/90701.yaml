      <p>Michael; <em>do not understand how you can call it the </em>[<em>moving</em>]<em> front when pen manipulation affects the left and right side of the form.</em></p>
      <p>Noordzij is asking the question 'What happens in the stroke when the pen is manipulated?', and tries to come up with a systematic terminology, independent of particular tools or techniques, within which to answer that question. I don't think that's 'obfuscation'. I also think that it is an approach that is of very little use or interest to a calligrapher, which is perhaps what you are expressing. Noordzij's analysis is of use and interest to people who need to look at and think about writing, not to writers, and still less to readers. I've found it useful in two areas in which I'm involved: palaeography and type design, the latter involving making letters from thought rather than from movement.</p>
