      <p>Michael, I don't think we're disagreeing. It is precisely because I don't think the thought of letter design can be disassociated from the movements of the tool -- although the association can be stretched and bent in various ways, some of which may be fruitful -- that I find Noordzij's analysis of the results of those movements to be useful.</p>
      <p>You have the particular facility of being able to perform with your hand what I can only perform with my mind and translate into technology. I have found Noordzij's analysis of the stroke very helpful in understanding what is possible in terms of the results of manipulation: he helped me to see and understand things in writing. I can understand how, to you, as a scribe, his analysis seems unnecessary and probably a complication of things that are easy or self-evident. But I don't think he is presenting these ideas for the benefit of scribes and calligraphers.</p>
