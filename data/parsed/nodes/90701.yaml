      To me Legato in essence proves -or at least<br>
      demonstrates- that any expanded-skeleton<br>
      approach to type design (chirography being<br>
      the pinnacle of this) is an arbitrary constraint,<br>
      at least in terms of reading.</p>
      <p>hhp</p>
