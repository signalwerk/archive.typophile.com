    <p>Hey guys, I was reading Gerrit Noordzij's translated "The Stroke: Theory of Writing" and am trying to get my head around applying the idea of white space to all forms of writing,</p>
    <p>as he says:</p>
    <p>"Writing rests on the relative proportions of the white in the word. The various kinds of writing with their various constructions and their various strokes can be compared with each other only in terms of the white of the word – every comparison requires a vantage point that makes things comparable. The white of the word is the only thing all the various kinds of writing have in common. This universal vantage point holds for handwriting and typography alike, for ancient writing as well as modern writing, for western writing as well as the writing of other cultures, in short, it holds for writing."</p>
    <p>I'm doing research for my thesis on urban street typography in Metro Manila (Philippines). This is the link to the current research online: <a href="http://www.whoiscarlgraham.com/urbantype/jeepneytypography.htm" title="http://www.whoiscarlgraham.com/urbantype/jeepneytypography.htm">http://www.whoiscarlgraham.com/urbantype/jeepneytypography.htm</a> </p>
    <p>I am fascinated how Noordzij says this but am wondering if there's some structured way I can speak about the type using the concept of white space. I loved "The stroke of the pen," but I'm still trying to fully grasp the concepts covered as I feel they can really help me with my thesis.</p>
