    html: <p> Nicholas - This is nasty good stuff. And nice craft pulling it off. There should be more monocase fonts (or unicase) on the market. And there's not enough icelandic inline/gothic fonts out there either.<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Certainly t26 would be interested in something like this. Or IHOF. (Look at James Grieshaber's excellent Gothic Gothic). I don't see it as short-lived (Hrant do you mean here today, gone tomorrow?). I see it as a niche face in a more classical sense. For example, Downer's Ironmonger is a niche typeface that people would use when appropriate, but nobody is going to log on and buy it for run-of-the-mill work. <br> <br>Nice work. <br> <br> <br>BTW, a member of this forum is Phil Foss®. Maybe you can work out a royalty arrangement. <br> <br>Phil? <br> <br> <br>bj </p>
