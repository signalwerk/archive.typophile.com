  html: |-
    <p>This is a typeface I began after an inspiring tour of Iceland. Initially, I was only interested in spelling the name of the country, but I have continued to work with the letterforms and now find myself with a monocase alphabet and some rudimentary numbers. <br> <br>Again at this point I am wondering if it is worth filling in the gaps in this typeface and whether there is a market for a titling face like this in today's type market. <br> <br>your comments will be greatly appreciated. <br> <br>thanks, Nicholas. <br> <br><img src="http://www.typophile.com/forums/messages/29/1024.gif" alt="your_file_name.gif"></p>
