    html: "<p>thanks for all the input so far. I knew that if I posted my work I would get a great response from this community. <br> <br>Phil - I adopted the Icelandic word for waterfall (Foss) as the name for this face, as they were so prevalent and spectacular over there. It also didn't hurt that it was one of the few pronouncable words I found in Icelandic. <br> <br>If you are interested in a distraction, the photo gallery that this type was created for can be found here: <a href=\"http://feltron.com/island\" target=\"_top\">http://feltron.com/island</a> <br> <br>I love the 3 in 1 suggestion, so I've got a lot of work ahead, but the murmurs of approval are inspiring. <br> <br>thanks, nick.</p>"
    html_clean: "<p>thanks for all the input so far. I knew that if I posted my work I would get a great response from this community. <br> <br>Phil - I adopted the Icelandic word for waterfall (Foss) as the name for this face, as they were so prevalent and spectacular over there. It also didn't hurt that it was one of the few pronouncable words I found in Icelandic. <br> <br>If you are interested in a distraction, the photo gallery that this type was created for can be found here: <a href=\"http://feltron.com/island\" target=\"_top\" class=\"link-external\">http://feltron.com/island</a> <br> <br>I love the 3 in 1 suggestion, so I've got a lot of work ahead, but the murmurs of approval are inspiring. <br> <br>thanks, nick.</p>"
