      <p>Chinese typefaces' classification is obviously very different from that of latin/western scripts. That said, you could look for a "gothic" style (<a href="http://en.wikipedia.org/wiki/East_Asian_sans-serif_typeface" title="http://en.wikipedia.org/wiki/East_Asian_sans-serif_typeface">http://en.wikipedia.org/wiki/East_Asian_sans-serif_typeface</a>).<br>
      Please note also the difference between traditional and simplified Chinese.</p>
