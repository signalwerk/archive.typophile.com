      <p>In the context of Chinese, the typeface style that you're looking for is called <em>Heiti</em> (黑体 <em>hēitǐ</em>) or simply <em>Hei</em>.</p>
      <p>In Japanese, it is called <em>Gothic</em> (ゴシック体 <em>goshikkutai</em>), and in Korean, it is called <em>Dotum</em> (돋움 <em>dotum</em>), though before the mid-1990s it was called <em>Gothic</em> (고딕체/고딕體 <em>godikche</em>) like Japanese.</p>
      <p>In terms of font suggestions, consider Adobe Heiti Std Regular, which is bundled with a wide range of Adobe applications, including Adobe Reader. Contact me offline for details.</p>
