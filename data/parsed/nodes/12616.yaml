    <p>Hello typophiles,</p>
    <p>This is my first post in the critique section. I recently made this logo for an Artificial Intelligence symposium at the Radboud University in Nijmegen, The Netherlands. I'm pleased with it, it portrays the "motion" aspect well I think. Please tell me what you think.</p>
