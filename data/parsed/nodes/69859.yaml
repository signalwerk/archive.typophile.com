    <p>Hey all,<br>
    this question is probably asked a dozen times before, but I did a (very) quick search and didn’t find anything relevant.</p>
    <p>I’ve long been a big fan of fonts and typography. But lately I’m interested in learning more about it. And more specifically type design. So I’ve been reading and looking all over the internet for more info. But I’m getting a bit lost in here. So. To have a better understanding of what I’m looking for, I’m now interested in buying a good book on the basics of type design. Oh and it would also be good if it doesn’t only contains the basics, and goes even further on the more advanced stuff.</p>
    <p>Thanks in advance,<br>
    Leo</p>
    <p>PS: Any must-read internet links on the subject (for beginners) are always appreciated.</p>
