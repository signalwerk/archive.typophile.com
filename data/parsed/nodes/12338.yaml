    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Conferences" class="freelinking" rel="nofollow">Conferences</a> : TYPO Berlin</strong></p>
    <p>An annual conference held every May at <a href="/wiki/Haus%20der%20Kulturen%20der%20Welt" class="freelinking" rel="nofollow">Haus der Kulturen der Welt</a> in Berlin. The conference is organized by <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> but at TYPO Berlin 2005 -- the tenth such conference -- <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> announced that it would be his last year as an organizer.</p>
