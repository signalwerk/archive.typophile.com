    html: <p>Thank you for good suggestions, Marc, Stefan, and Dan! <br> <br>Marc, <br>Farnham was a very good idea! So was FF Bau and FF Super Grotesk B, but after having tested, it seems to me that these two font packages don't comprise Latin-1 characters and special characters. That's really sad, because the two, the FF Super Grotesk B in particular, had that something "extra". In fact they would have been my first choice. :-( <br> <br>Dan, <br>I must say I like the Avenir Next, too. It sails up as one of my personal favorites right now. But is the Avenir Next Italic a true italic? Sabon Next is a font that many have recommended to me. The big "risk" - to put it that way - is that it may be too similar to Garamond? Anyway, I will definately consider it! <br> <br>Stefan, <br>as I write this, it seems to me that the Mac Rhino website is down. They had problems when I tried to access their site earlier today, too, so I have not had the oportunity to take a closer look on their fonts. <br> <br>Stefan, Dan, and Marc, <br>Thanks again. So far. <br> <br> <br>WW</p>
