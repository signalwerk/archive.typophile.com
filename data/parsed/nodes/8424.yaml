    html: "<p>Frutiger and Helvetica are solid but boring. They've been used, used and used again. <br> <br>If I was in you're shoes, I'd look at Farnham as a serif, and FF Bau  or FF Super Grotesk B as sans options. <br> <br>Farnham, recently released from exclusivity by Font Bureau, is a lively serif that won't alarm a conservative audience, but looks like it would a lot of fun to work with. You could use it for display purposes, too. <br> <br>FF Bau and FF Super Grotesk B (note the B: it's the version with the two-story a and g) offer more interest and character than Helvetica, and their liveliness, especially in the bold and black weights, would match Farnham's \"exuberance,\" as the Font Bureau site puts it. <br> <br>You might consider adding a slab serif to the mix for display purposes. Since you'd be using it sparingly, as a spice rather than a main ingredient, something a little quirky, like Oxtail (from PsyOps), might work.  <br> <br><a href=\"http://www.fontbureau.com/fonts/Farnham\" target=\"_blank\">http://www.fontbureau.com/fonts/Farnham</a> <br> <br><a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11312.0.0\" target=\"_blank\">http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11312.0.0</a> <br> <br><a href=\"http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=super+grotesk+b&amp;image.x=27&amp;image.y=10\" target=\"_blank\">http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=super+grotesk+b&amp;image.x=27&amp;image.y=10</a> <br> <br><a href=\"http://www.psyops.com/html/spec_oxtail.html\" target=\"_blank\">http://www.psyops.com/html/spec_oxtail.html</a></p>"
