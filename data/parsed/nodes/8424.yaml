    html: <p>William, I'm quite fond of Helvetica Neue as well. If you decide to go with Frutiger instead, take a look at Frutiger Next, a revised version of the family released a few years ago. It includes, amoung other things, a true italic (instead of the old <i>obliques</i>). <br> <br><a href="http://www.linotype.com/53781/frutigernext-family.html" target="_blank">http://www.linotype.com/53781/frutigernext-family.html</a> <br> <br>Another interesting headline option, if you like Frutiger's work, is the new version of Avenir that Adrian Frutiger created last year with Akira Kobayashi, Avenir Next. This version of Avenir is far superior to the original 1988 release. It has a better family system (more clear differentiation of the various weights), condensed weights, small caps, and old style as well as lining figures. Plus, it is available in OpenType format. <br> <br><a href="http://www.linotype.com/90672/avenirnext-family.html" target="_blank">http://www.linotype.com/90672/avenirnext-family.html</a> <br> <br>For the body text, I recommend Sabon Next, which was designed by one of Typophile's best contributors, Jean Fran</p>
