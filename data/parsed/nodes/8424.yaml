  html: |-
    <p>I'm planning a design/layout makeover for a security and defence policy magazine. 58 pages approx, full color, pictures; "Neewsweek format". <br> <br>Open for suggestions for font combinations for body text and headings. As for the body text font is concerned, readability is important of course, but it must not be too gray or conservative. And it's definately good if it came in a range of variations, such as thin/normal/semibold/bold, condendensed/narrow, etc. <br> <br>When it comes to the sans serif for headings and small articles, I'm quite fond of Helvetica New. Would that be a very bad choice (I mean, is it too boring?) I like the Frutiger too, though. <br> <br>Suggestions? Advices? Thanks in advance! <br> <br>William W.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/7617" class="topic-previous" title="Go to previous forum topic">‹ On the design and imposition of Title Pages</a> <a href="/node/8438" class="topic-next" title="Go to next forum topic">Free PS brushes ›</a></div>
