    html: |-
      <p>I assume that when you say "Type 1 hinting" you also include OpenType CFF hinting. I'll refer to them collectively as "PostScript hints" as they are associated exclusively with PS style outlines.</p>
      <p>The devices that NEVER pay attention to PostScript hints are those using Apple's rasterizer, namely Macs and iOS devices. Depending on the settings used with FreeType, FreeType MAY ignore the PostScript hints.</p>
      <p>That leaves all versions of Windows, most Adobe applications, and many things using FreeType as all being things that DO use the PostScript hints. Also many printing devices, but given today's print resolutions hinting isn't usually a very big deal.</p>
      <p>The list is pretty much the same for using TrueType hints, as far as I know. Also, the PS hints may be used as the source for TT hints in conversion.</p>
      <p>Cheers,</p>
      <p>T</p>
