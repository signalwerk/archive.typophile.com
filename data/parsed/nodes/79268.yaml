    <p>I understand what Type 1 hinting is and why it was important in 1992.</p>
    <p>But none of the devices I use on a daily basis pay attention to Type 1 hinting. </p>
    <p>So is there a class of modern devices that still care about Type 1 hinting?</p>
    <p>Or do we pay attention to Type 1 hinting purely for backward optimization?</p>
