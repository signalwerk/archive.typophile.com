    html: <p>limiting to 1000 does limit the drawing flexibility, though.  I much prefer 2048 and the math is quite easy for it as well.  Those of us from the now ancient 8 bit era are quite familiar with factors of 16 even if through digital images.  Also, I like to assume even numbers for all dimensions unless I am really stuck. [Actually, I work hard to make everything a factor of eight because that gives more rotational possibilities to the handles that control curvature.] This makes it easy to spot errors because any odd numbered measure is a red flag.  After the fun work is done and you are down to the nitty-gritty last tinkers, I am glad I have the option to do a tweener ;-)  When I first started designing type, one unit of a 1000 upm seemed so tiny. Now it feels massive.  Several years ago, Akira Kobayashi told a wonderful story about his visit with Zapf. While he was showing Herman some drawings, Herman took a look and said "This stem is a bit wider than that one." It turned out that even through advanced years and failing eyesight, Mr Zapf could still spot a one unit difference with assurance.  It took me a few years at this kind of work but now I find that distinction quite normal even to me--but I am 20 years younger than Herman, too bad I have not yet achieved his skill ;-)</p>
