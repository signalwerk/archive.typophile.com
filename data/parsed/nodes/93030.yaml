      <p><em>We could use some sort of United Font Designers... ;-)</em></p>
      <p>Which would probably work to everyone’s advantage until the enterprise became successful enough to be bought out by the Elephant in the Room—which shall remain nameless—or sued into nonexistence for some alleged patent infringement—which appears to be Apple’s preferred method of protecting its market share.</p>
      <p>There is undeniable value in having one’s fonts listed on the big sites. Sheer gravity attracts many potential buyers, and sophisticated search/sort/tag routines can drive a lot of traffic to one’s wares which might not have otherwise shown up. The large aggregators advertise aggressively and cover the infrastructure costs. In other words, yes: they provide a valuable service, which would be expensive to replicate.</p>
      <p>On the other hand, independent foundries provide the products which the behemoths flog so effectively: in other words, it’s a symbiotic relationship. The problem is, the mutual nature of this interdependency isn’t reflected in the revenue and risk-sharing terms offered. Half a loaf may be better than none; 20% to 40% of a loaf is another matter entirely.</p>
