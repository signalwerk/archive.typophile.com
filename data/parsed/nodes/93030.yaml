      <p>Those percentages are excessive for essentially acting as a distributor. Although as distributors it’s not surprising that they’re unwilling to take on risk; it’s your product after all, not theirs. They’re just helping you sell it. </p>
      <p>Setting up your own store is a partial solution, although the setup and upkeep is not trivial. The sales I make through my store are only about half as many compared to the sales I make through online middlemen. So, if I dumped my third-party distributors, maybe it would be a wash. The extra money I would make on direct sales would compensate for the sales lost not dealing with a distributor. Except right now I’m making money on both, so I would actually lose money if I went totally independent, as well as the extra exposure being on a big site provides.</p>
      <p>So, yeah, set up your own store – or maybe ask around about joining some other small foundry’s store that’s a good fit; that kind of mutual cooperation and assistance seems like a worthwhile path to explore. </p>
      <p>And still look for bigger distributors who don’t insist on a huge cut. For us small foundries I suspect there’s no room for negotiation with them. Unless you’ve got something really hot that the distributor wants, it’s no big deal to them if they don’t sign you up.</p>
      <p>David</p>
