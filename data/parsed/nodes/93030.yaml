      <p>Ryan,</p>
      <p>The liability issue really wasn’t the main point: it simply served to emphasize that “partnering” with these distributors has taken on a rather lop-sided meaning—as have a lot of other terms in the virtual economy, such as “free” and “unlimited.” Generally, one walks hand-in-hand with a partner; when the relationship is unequal, it feels more like the partner is acting as if he has a hold on another part of one’s anatomy.</p>
      <p>Bottom line: foundries create the products, the mass marketers sell them. Without product, the mass marketers got nothing; without the mass marketers, foundries would have to create their own markets, advertise, develop and maintain sophisticated e-commerce websites, and handle all the nuts-and-bolts little problems that attend everyday life.</p>
      <p>So, once again: it’s a symbiotic relationship. The proceeds ought to be divvied up accordingly.</p>
