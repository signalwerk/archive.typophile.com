    <p>I would love some feedback on the logo for Headfood.<br>
    Headfood is the new canteen for Vega the Brand Communication School. Vega is South Africa’s premium school of design and branding. The idea is for the canteen to create food culture activities. It is the opposite of fast food and we want people to cerebrate their food (correct spelling - cerebral + celebrate ). The basic premise is that good food please all the sense and thereby<br>
    stimulate the minds of young designers and innovators. The canteen will combine good natural food with technology like fingerprint identification for account holders and a beautiful stark interior.</p>
    <p>I used Joshua Darden’s great Omnes font for the logo. Any feedback - spacing, legibility? I plan to use Omnes for all Menu boards and associated communication, and would like to laser cut the logo out of thick wood at the entrance.</p>
    <p>please help?</p>
