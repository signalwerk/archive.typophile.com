    html: "<p>Hrant, thanks for the feedback and sorry for the late reply. I can't say much about designers being prettier, since most designers I work with are guys. Don't underestimate the gals in CS, though <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">. However, you are right in saying that music and CS are not so easy to combine sometimes. I am still working on it myself <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">. <br> <br>I am fine with combining different typefaces -- in fact, I believe I won't be able to meet all my needs with just one typeface, and I am definitely not going for austerity. Artistic or expressive would be more like it, I guess.  <br> <br>In the meantime, it occurred to me that I will probably need even different body typefaces: Lyrics are usually set sans serifs (am I right?), while I'd use a Serif typeface for a report. Currently, I am using the Sigler Jazzfont (<a href=\"http://www.jazzfont.com\" target=\"_blank\">http://www.jazzfont.com</a>) to set music, which is nice for the music and the chords, but too \"over the top\" for lyrics and directions for anything but Big-Band charts (IMHO). On the other hand, a plain Sans Serif like Arial looks kinda weird combined with it. Is there something that might go well with it? <br> <br>By the way, if anyone wants to recommend their own fonts, feel free to do so!</p>"
