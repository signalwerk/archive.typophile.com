    html: "<p>&gt; I love working with designers <br> <br>Me too - they're prettier. <br>I'm a CalStateNorthrigde SECS (School of Engineering and Computer Science - cool, huh? :-) grad myself. <br> <br>Generally you'd choose two typefaces, one for body and one for headings/titling. If you want a really austere look you would choose one typeface that's a large family with both text and display cuts. <br> <br>The thing is, you seem to have a lot planned for your CI, in terms of subject matter. The only way to accomodate all the things you list is to go for neutrality, and to me that's a lousy basis for a CI. As much as we think programming is an art as high as music, the general perception does not agree, and a good CI needs to be obliging to its audience, not a primadonna. <br> <br>So I think you should either have groups of fonts you use, or possibly find a font with multiple \"persona\" of which there aren't many (the recent Siemens face is one, but that's not commercially available). I'm talking the display component here: for the text component it might make sense to play it [relatively] safe and choose something like Adobe's Warnock (which does have different cuts, btw) for all the \"groups\". <br> <br>hhp <br></p>"
