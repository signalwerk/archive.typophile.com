  html: <p>Well, I hope this question is not too basic for this forum... <br> <br>Let me give you some background. I am a Computer Science student, but have been working with designers for years, thus acquiring a fair share of awareness for good typography and design (I love working with designers, by the way -- the company I work for has a nice working environment and it is nice to collaborate with people that are experts in a different trade). At least I'm more aware than the average CS nerd, I guess <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. <br> <br>What I am trying to do is to find a collection of typefaces that I can use for all my personal type-related needs. E.g. <br> <br>- Letters and invoices (for the occasional consulting gig) <br>- Articles (typeset with LaTeX. Did I mention I'm a nerd?) or even my upcoming diploma thesis <br>- Headings on my web sites <br>- Printed music (that is, lyrics and chords) <br> <br>You could say that I am trying to establish a CI for myself. So how does one go about searching the myriad of haystacks of fonts out there? And how do I come up with a collection of typefaces that actually look good used together? <br> <br>I guess I also should mention I'm not necessarily looking for freebies here. While I'm on a student budget, I am a firm believer of "a worker is worth his wages". I enjoy being paid for my (non-GNU) programming work,  and I have a distinct feeling typographers feel the same way <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. I am ready to pay a reasonable price for good fonts. So I hope you will not perceive this as a plea to get free fonts. <br> <br>Thanks in advance for your help!</p>
