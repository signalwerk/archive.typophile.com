    <p>Hi there,<br>
    my first topic/post. And it’s about an pixelfont I want to use for my website. The name is RT Pixa.<br>
    I thought it would be nice to have a sans/serif-pixelfont-family of my own with swash italic and a real sc-font. It is quit tall and i think it has a good legiblility. But I don’t know what to do to make it an working font.</p>
    <p>Measurements:<br>
    Ascender 9 px<br>
    Caps 8 px<br>
    SC 7 px<br>
    x height 7px<br>
    decender -3 px</p>
    <p>So I have 12 px bodyheight without Cap accents. what I heard about pixelfonts is that i have to divide the postscript square with the bodyheight (1000 / 12 is 83,3 which doesnt work) looking at other pixelfonts like underwares Unibody didn’t help me. The other thing I heard is that I should use the measurements of an 8 pixelfont (125 units) and go over the ps-square. I use an mac but want to make it an free openTypefont for windows, too. So what shoul I do? Thanks, Eric.</p>
    <p>P.S.: the italics are raw beta</p>
