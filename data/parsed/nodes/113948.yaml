    html: <p>The Fontry claims that <a href="http://old.myfonts.com/fonts/fontry/arb-44-chicago-modern/" target="_blank" rel="nofollow">their version</a> of Alf Becker's Chicago Modern Thick and Thin is the most accurate. I've always liked this original version more than the Players typeface it inspired - perhaps because it was a hand drawn alphabet I see as masterful artwork.</p>
