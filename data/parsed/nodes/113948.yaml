    html: |-
      <p>Many thanks Fivos for finding the Jackaman and Harvey fonts, and for the information that the digital fonts are based on the Players typeface designed by by Adrian Williams in the 1970s.<br>
      After checking the three fonts I find that both Steve Jackaman and Thomas E. Harvey created generally similar but independent digitizations of the players typeface. The Steffmann version, when sizes are adjusted to enable comparison, and allowing for accumulated  conversion errors, is a point for point digital match with Thomas E. Harvey's font, although some tinkering was done.<br>
      I see that Nick Curtis digitized, as Stoney Island NF,  a 1930s design by Alf Becker named Chicago Modern Thick and Thin.<br>
      The Players typeface looks somewhat similar to Becker's design.<br>
      Don</p>
