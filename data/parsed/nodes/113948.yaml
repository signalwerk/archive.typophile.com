    <p>Dieter Steffmann is well known for his creative appropriation of  digitized fonts. I like the design of his Kalenderblatt Grotesk and wonder where it came from. The original font is most likely German Jugendstil from about 1910.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/KalenderblattBySteffmann_3995.jpg"></div><br>
    <a href="http://www.dafont.com/kalenderblatt-grote.font" title="http://www.dafont.com/kalenderblatt-grote.font">http://www.dafont.com/kalenderblatt-grote.font</a><br>
    Don<p></p>
