      <p>Here are a few additional faces suggested.</p>
      <p>FF Mister K by Julia Sysmäläinen - Not the most legible, but wonderfully informal. I love the cross-out version as well.<br><a href="https://www.fontfont.com/fonts/mister-k">https://www.fontfont.com/fonts/mister-k</a></p>
      <p>Notera by Måns Grebäck - Another informal script.<br><a href="http://www.myfonts.com/fonts/mawns/notera/">http://www.myfonts.com/fonts/mawns/notera/</a></p>
      <p>Instant Vivd and Instant Quick by Jérome Knebusch - A very nice, restrained but still handwritten face. A nice mix of handwriting and type design.<br><a href="http://www.batfoundry.com/catalogue_6_instant_.html?lang=2">http://www.batfoundry.com/catalogue_6_instant_.html?lang=2</a></p>
      <p>Scripto by Franck Jalleau - Informal script with lots of good alternates and Open Type tricks up its sleeve.<br><a href="http://www.batfoundry.com/catalogue_7_scripto_.html#">http://www.batfoundry.com/catalogue_7_scripto_.html#</a></p>
