    <p>Normally, I hate when clients request to use a “handwriting” typeface because I personally think if you want handwriting, you should actually use handwriting and scan it. Unfortunately, this is not always possible especially with clients that like to change copy at the last minute.</p>
    <p>So last week I posted up a question on Twitter asking for suggestions for a handwriting face that isn’t too scripty/brushy and doesn’t suck. The Twitter conversation can been see here: <a href="https://twitter.com/realdougwilson/status/438050628548325376" title="https://twitter.com/realdougwilson/status/438050628548325376">https://twitter.com/realdougwilson/status/438050628548325376</a></p>
    <p>Here is a condensed list of the faces I found most useful.</p>
    <p>Roller Script by Nick Cooke - Lots of good alternates and both a rough and smooth version.<br>
    <a href="http://www.g-type.com/rollerscript-font" title="http://www.g-type.com/rollerscript-font">http://www.g-type.com/rollerscript-font</a></p>
    <p>Fresco Script by Fred Smeijers - Not sure I like the lc “g” but it fits in the bigger family of Fresco. Good amount of weights as well.<br>
    <a href="https://ourtype.com/#/try/fresco-script/" title="https://ourtype.com/#/try/fresco-script/">https://ourtype.com/#/try/fresco-script/</a></p>
    <p>Suomi Hand Script by Tomi Haaparanta - More “aggressive” than some of the others, but still has a good feel.<br>
    <a href="http://www.fontshop.com/fonts/downloads/suomi_type_foundry/suomi_hand_script_ot/?affId=98220" title="http://www.fontshop.com/fonts/downloads/suomi_type_foundry/suomi_hand_script_ot/?affId=98220">http://www.fontshop.com/fonts/downloads/suomi_type_foundry/suomi_hand_sc...</a></p>
    <p>ErikRightHand &amp; JustLeftHand by  Erik van Blokland and Just van Rossum- Two variations on proper handwriting.<br>
    <a href="https://www.fontfont.com/fonts/erikrighthand" title="https://www.fontfont.com/fonts/erikrighthand">https://www.fontfont.com/fonts/erikrighthand</a></p>
    <p>Signature by Henrik Kubel - Loose, marker feel.<br>
    <a href="http://www.a2-type.co.uk/html/signature.html" title="http://www.a2-type.co.uk/html/signature.html">http://www.a2-type.co.uk/html/signature.html</a></p>
    <p>Caflisch Script by Robert Slimbach - Obviously a classic, but I feel this is too used and not unique enough.<br>
    <a href="http://www.myfonts.com/fonts/adobe/caflisch-script/" title="http://www.myfonts.com/fonts/adobe/caflisch-script/">http://www.myfonts.com/fonts/adobe/caflisch-script/</a></p>
    <p>I would love suggestions for additions to this list. Remember, the face needs to have a handwritten feel and not too fancy/scripty or brush script.</p>
