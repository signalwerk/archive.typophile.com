      <p>In most cases, once a designer licenses a font, he can use it for any project he wants. What foundries are most concerned about is how many machines the font is being used from, not how many copies of a product will be produced.</p>
      <p>With Myriad, or almost any other big name font, you can either design a logo, so set text in a book that will be sold 10 million times. Doesn't matter.</p>
      <p>But, you are of course free to stipulate other conditions in your EULA. If you want to charge an extra licensing fee for certain projects and/or print runs, go for it. But you may need to come up with a good marketing concept to explain your reasoning to designers…</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
