      <p>Careful what you compare: An Ad agency that wants to distribute a font to 300 designers worldwide isn't paying $40. They need to pay for a license for each workstation, and that amount grows if they add workstations. Though most foundries offer quantity discounts, agencies routinely discover the cost effectiveness of custom type, especially if they will have it exclusive from its inception. Custom type allows them to own the font (forever, or just for a few years), without any additional cost in licenses.</p>
      <p>The gray area being introduced by embedding issues has got a lot of people thinking that fonts are like repro art. When you sell a font, as long as the license is agreed on and paid, typically the foundry can't tell the licensor what to do with the font. How would that be policed? In every other type format, once you got the font (discs, strips, matrices, etc) into your shop, you could use it for as much or as little as you want. This may be repetitive, but printed copies of a document are not equivalent to digital copies of a font. When a magazine uses a font, they have a license to use it every month, for everything, big and small.... If they choose to use it for headings on 4 pages, that doesn't make it cheaper for them. It's like a chair: put plastic on it and forbid anyone from sitting in it, or use it every day for decades. You're paying for rights, not actual uses. I can't tell the La-Z-Boy slaesman I should pay less because I'll only be putting plastic on it and looking at it.</p>
