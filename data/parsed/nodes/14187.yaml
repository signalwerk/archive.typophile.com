    <p>I have been busy recently with trying to find out what goes in the market of Custom Typefaces. A collegue asked me to make a typeface for him from his logo. So he wants a price from me.<br>
    It's not easy to find out what reasonable prices are for creating custom fonts. And then the licences. Does the client want it exclusive, and if yes, for how long. There seem to be different licences for magazines, corporate material, websites, etc. etc. </p>
    <p>The question I hear very often is; "Why should we pay for an expensive licence when I can just buy the font for 40 dollars?"<br>
    Graphic designers buy more often single fonts or families. They very often use them for different projects, not just the one they bought it for. If they decide to use later on it in a magazine they go "why not, I bought it already".</p>
    <p>My question is; should they contact the licencor to discuss the licence for using this particular font in a magazine? Or can they just use it? </p>
    <p>Can anyone shed some light on this?</p>
    <p>Thnx,<br>
    ®ené</p>
