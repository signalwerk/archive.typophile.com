      <p>I see it the same, but I think the biggest problem is verification. How can a foundry check whether the purchaser is telling the truth? If you licence a font for a magazine you know that that isn't done on one workstation. But would you sue someone for that?<br>
      Very often the graphic designers descide what font to use. I've been in the business for 10 years now and I haven't heard any graphic designer talking about an expensive licence, simply because it's not worth it to the client. They expect all fonts are standard on the PC. Verdana will do just fine. </p>
      <p>I think the whole font licencing business is a gentleman's agreement. I wish there were more gentlemen so there were less font piracy. </p>
      <p>Regards,<br>
