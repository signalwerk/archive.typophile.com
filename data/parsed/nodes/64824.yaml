    <p>Hi everyone</p>
    <p>Last night I was looking to see if there was a version of Frutiger that one can license for web usages (e.g. using "font-face"). I came across this site and wanted to get some feedback on whether it's legit or not and would you use them in web design projects:</p>
    <p><a class="freelinking external" href="http://www.rubicon.ca/index.htm" rel="nofollow">http://www.rubicon.ca/index.htm</a></p>
    <p>I have to admit that I'm relatively new to the field of typography so I thought I could get some feedback here. I'm guessing just by the descriptions on his site that these probably are knockoffs that one wouldn't use in print as mistakes are much easier to see in print than they are on the web. Perhaps more importantly, I get the vibe that they might be illegal. Are they? </p>
    <p>If they are legal do you think that one would be able to really notice the differences between these fonts and the originals on the web at about body sizes (say about 14-17px)? </p>
    <p>Thanks,<br>
    Besim</p>
