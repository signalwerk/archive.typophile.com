      <p>quadibloc:</p>
      <p>&gt; <cite> "The fact that a font design has entered the public domain does not impair the ability of someone to copyright a True Type font, which is a sequence of bits, that draws that font."</cite></p>
      <p>Digitising an old public domain work, i.e. converting it into "a sequence of bits", does not resuscitate the dead copyright. Here are a few examples:</p>
      <p>1) Project Gutenberg (<a href="http://www.gutenberg.org" title="www.gutenberg.org">www.gutenberg.org</a>) digitised, i.e. converted to ASCII files, innumerable public domain literary works, but this did not resuscitate the dead copyrights.</p>
      <p>2) If you convert an old public domain shellac gramophone record or an old vinyl phonograph record into a digital compact disk, you do not resuscitate the dead copyright.</p>
      <p>3) If you photograph an old public domain analogue Kodak photography using a digital camera, you do not resuscitate the dead copyright.</p>
      <p>etc. etc. etc.</p>
      <p>So, for example, if you digitize the public domain "Stempel Garamond" (aka "Original Garamond") by converting it to a TTF font and rename it to "Aldine 430"</p>
      <p>see <a href="http://www.sanskritweb.net/forgers/bitstream2.pdf" title="www.sanskritweb.net/forgers/bitstream2.pdf">www.sanskritweb.net/forgers/bitstream2.pdf</a>, page 4 and page 12</p>
      <p>you do not resuscitate a dead copyright nor a dead design right (which in the case of the 1925 "Original Garamond" or "Stempel Garamond" never existed).</p>
      <p>For the USA copyright law, also consider the "Sweat of the brow" doctrine:</p>
      <p><a href="http://en.wikipedia.org/wiki/Sweat_of_the_brow" title="http://en.wikipedia.org/wiki/Sweat_of_the_brow">http://en.wikipedia.org/wiki/Sweat_of_the_brow</a></p>
