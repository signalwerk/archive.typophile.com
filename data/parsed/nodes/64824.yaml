      <p>Thanks everyone for the comments so far. The more I look into the more skeptical I'm becoming of Sanskrit's claims. I still have a few questions I think would help clear the confusion that newbies might have. </p>
      <p>So are the copyright rules separate for the font design and the actual .ttf file itself? </p>
      <p>He's basically saying copyright has expired on these digital files that were released in 1982. This seems off as most copyright laws last 50-70 years after the author's death (including in Germany). I couldn't find any information that stated that software is exempt from this. If software is exempt from this, where does that leave font files which differ greatly from software in that a font doesn't become outdated like software does  (No one is really developing for the Apple Lisa anymore but Helvetica sure isn't going away).</p>
      <p>I'm sure there are many designers/developers out there who are not familiar with copyright laws regarding font files. I would imagine that searching for a legal version of famous fonts like Frutiger, Optima, etc would be a common thing and that others would also find the same site. This is the only site that I found that claims to have legal versions available to use for @font-face usage. If what he has is illegal then what can be done to stop it? </p>
      <p>I would much rather prefer that a search would land someone to this thread where they can be lead to some answers that provides a clearer picture of what the case actually is than a one-sided argument that to the novice that makes it seem legitimate to use these files.</p>
      <p>Thanks again,<br>
      Besim</p>
