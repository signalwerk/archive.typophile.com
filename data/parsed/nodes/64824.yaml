      <p>This was all <a class="freelinking external" href="http://blogs.adobe.com/typblography/2006/01/legal_protectio.html" rel="nofollow">summarized nicely by Thomas</a> four years ago. Money quote:</p>
      <p><cite>However, even without copyright protection for the design of a font (in the US), digital fonts are widely recognized (in the US and many other countries) as being protected by copyright as computer software. This principle has been explicitly upheld in US federal district court in the very informative <a class="freelinking external" href="http://lw.bna.com/lw/19980303/9520710.htm" rel="nofollow">summary judgment rulings</a> in the Adobe v SSI case (1997). So, when font pirates talk about how what they're doing is legal because fonts aren't protected by copyright under US law, we know this simply isn't true.</cite></p>
