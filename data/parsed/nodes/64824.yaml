      <p>I didn't think font piracy was that widespread.</p>
      <p>People who want lots of fonts can buy cheap font collections, they can download many free fonts, and one particular brand of word processor happens to come with a giant chunk of the Bitstream collection of fonts.</p>
      <p>So, while there may be sites hosting pirated fonts, and there is a potential for fonts being installed on more machines than they're licensed for in offices that aren't paying attention to this, while font piracy probably is more widespread than software piracy is now, I would have thought that it was still on the same order of magnitude.</p>
