      <p>@christopher slye</p>
      <p>Actually Chris, for good or ill, case law is moving away from the reasoning in that one single lone ruling in Adobe v SSI. Which was, after all, in 1997. The image I find striking is that, in 1997, there probably was not a single laptop in the courtroom. Today there would probably be a dozen if not more. Don't underestimate changes in the Zeitgeist.<br>
      There are pirate sites out there, right? Why doesn't Adobe or Microsoft or Monotype or all together sue the pants off those responsible? Frankly, I believe it's partly because if it wound up in court with a serious adversary and unfavorable facts the plaintiffs might not be happy with the results.<br>
      1997 is twelve Internet years ago. (Them's like doggie years to you 'n' me. But you're too young, I think, to remember *that* TV commercial. Only near-geezers remember Lorne Greene.)<br>
      Anyway, better off keeping things fuzzy and issuing veiled threats like:<br>
      "good luck in court with all that!"<br>
      (Just the truth as I see it, Chris, and I would do the same myself. And perhaps you didn't mean it that way, either. I just don't think that trying to create a chill effect helps anybody.)<br>
      But the bottom line is, once fonts become common components of web pages, good luck in the everyday world with this:<br>
      <em>However, even without copyright protection for the design of a font (in the US), digital fonts are widely recognized (in the US and many other countries) as being protected by copyright as computer software. This principle has been explicitly upheld in US federal district court in the very informative summary judgment rulings in the Adobe v SSI case (1997). So, when font pirates talk about how what they’re doing is legal because fonts aren’t protected by copyright under US law, we know this simply isn’t true.</em></p>
      <p>I just don't think any of that will end up being particularly relevant, that's all. Or any of our opinions, either. People are going to do what they are going to do.<br>
      And <strong>then</strong> what are you going to do?</p>
      <p>BTW - Here's a <a href="http://www.alistapart.com/comments/real-web-type-in-real-web-context/P10/#14" rel="nofollow">link</a> to a quick couple of paragraphs about me explaining to my wife about fonts as copyrighted software and what she can and cannot "legally" do. I don't think her reaction is untypical.</p>
