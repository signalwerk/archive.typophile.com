      <p>@sii's fictional phone call recipient:</p>
      <p>"It's Tiger again. Hey, I hope you didn't actually buy the fonts from Monotype with my credit card so there's a paper trail leading back to us. I've got deep pockets, I could end up in court like NBC! I hope you got them from a web site or p2p. I mean, couldn't you just take a font that ships with Windows out of the font folder and work with that? Even better, forget @font-face and just use the font to create images or use Flash. Fonts linked using @font-face usually look like crap, anyway. Or, even better, use a free font and *add* Monotype's name in! Maybe they'll issue a takedown notice and I can make a few bucks with a counter-suit."</p>
      <p>@uli</p>
      <p>My understanding of the position taken by the vast majority of font creators is as follows. (And if anyone feels I've got it wrong, please, please correct me. I'm trying to present this neutrally and factually.)</p>
      <p>When it became possible to record the visual features of a typeface as numbers within a computer file, the fact that the typeface could not be copyrighted, did not mean that the computer files which digitally describe them could not be copyrighted. These files are protectable as literary works.<br>
      As far as type designs that were clearly in the public domain or clearly the product of someone else, the same holds true. The original type design cannot be copyrighted but the digital file describing it can.<br>
      So, even though a font re-creates a typeface design that is clearly in the public domain, that fact is inapplicable in determining whether it's digital representation is, or is not, copyrightable as a literary work.<br>
      In regards to typefaces, the adoption of digital technology reset the clock so to speak - the previous 550 years of typeface design for print and the hand-done faces before that no longer count for anything in regard to whether a font can be copyrighted.<br>
      Once a typeface is digitized, the resulting files are copyrightable and will be so for the life of the creator plus 70 years. (I think that's the current term in the USA. Works done for hire have a longer lifespan.)<br>
      Anyway, that's the position as I understand it.</p>
      <p>Regards, </p>
      <p>rich</p>
