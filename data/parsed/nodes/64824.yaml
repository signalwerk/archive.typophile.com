      <p>It requires the "sweat of the brow" to create a .ttf file for, say, my own imitation of Caslon. Fonts are created by drawing, not scanning. (Although some font construction programs may attempt to make a first-cut version of a font from a scan.)</p>
      <p>As it happens, font designs weren't protected at all by copyright or patent law (despite some foundries obtaining design patents for their fonts anyways) until, possibly, very recently. So the only thing type foundries had were their trademarks - and some had been aggressively suing people who listed which knockoff fonts looked like which original fonts. (This apparently has been happening recently - books on typography were published in the phototypesetting era that had such lists, but now I hear of websites being sued.)</p>
      <p>While the intellectual property of original type designers is certainly more important to protect than those of knock-off type designers, given that original type designs don't enjoy much protection, the claim that a .ttf file lacks normal copyright protection would threaten the intellectual property rights of the original designers of typefaces, not just those of knock-off font makers.</p>
