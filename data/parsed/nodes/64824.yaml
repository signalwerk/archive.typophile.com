    html: <p>Uli, signatory nations to Berne Convention on copyright agree to extend to works of foreign origin <em>the same protection that they grant to domestic works</em>. In other words, German copyright applies to Linotype fonts in Germany, US copyright applies to Linotype fonts in the USA, Canadian copyright applies to Linotype fonts in Canada, etc. What matters is not law of the country of origin of the work but that of country in which an infraction may occur (and, of course, the willingness and ability of a company to combat infractions in that local jurisdiction).</p>
