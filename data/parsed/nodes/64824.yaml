      <p>@uli</p>
      <p>The theory I stated above is not my own. It's an attempt to summarize, as neutrally and impartially as possible, the theory I believe most font designers subscribe to as to why their font files are copyrightable in the face of two things:<br>
      1) The fact that typefaces are not copyrightable at all in the USA.<br>
      2) The fact that, in countries where typefaces can be copyrighted, many fonts are based on typefaces in the public domain. (As you point out quite clearly.)<br>
      I am assuming - in an attempt to explain the theory - that there must be a "transforming moment" where the digital description of the typeface becomes something that can be copyrighted.<br>
      It's just a question at what point in the process that transformation occurs.</p>
      <p>Intellectually, I have my own thoughts of course, but those are private until I choose to share them. So please understand that your statement, "apply your own theory", is a misstatement. It's not my theory.</p>
      <p>That said, the answers which must be given based on the position I stated previously are:</p>
      <p>1) Yes<br>
      2) Yes<br>
      3) Yes</p>
      <p>That's what the theory says.<br>
      So as to not leave the elephant sitting alone in the room: Do I believe that would be the answer you would get from the average computer user?<br>
      No.<br>
      And that's the real problem, not who is technically legally correct. A "law" that fifty million people choose to disobey - no matter what the reason - isn't much good for anything.</p>
      <p>Regards,</p>
      <p>rich</p>
