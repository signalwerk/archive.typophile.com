    html: |-
      <p>Matthew, is your font OpenType PS (.otf extension)? If so, the generated font shouldn't have ANY flat kerning. The kerning in OT PS fonts should all be handled in the 'kern' feature. So, you should use class-based kerning. In addition, go to FontLab's preferences and under Generating OpenType...-&gt;Kerning, deactivate the option Export old-style non-Opentype... and tick the box at the bottom that reads Generate OpenType 'kern' feature...</p>
      <p>Also, <a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=1109" rel="nofollow">some more stuff to fry your brain</a> :)</p>
