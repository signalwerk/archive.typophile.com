    <p>I've been trying all morning to get kerning to show up in CS2 apps and MS Word using an opentype font I'm working on. I've read up on the fontlab group and on here to see if I could get some more info, but it feels like I've tried everything.</p>
    <p>I'm working on a Mac and with Fontlab Studio 5.</p>
    <p>I created a font that contains a kern opentype feature and have converted it to a flat table also.</p>
    <p>It's got around 150 kerning pairs and I'm not using class based kerning.</p>
    <p>I'd like this font to be as compatible as possible with old and new apps.</p>
    <p>Any ideas?</p>
