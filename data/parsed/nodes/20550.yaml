    html: |-
      <p>Miguel, </p>
      <p>&gt; The kerning in OT PS fonts should all be handled<br>
      &gt; in the ‘kern’ feature. So, you should use<br>
      &gt; class-based kerning</p>
      <p>The one does not imply the other. You may have GPOS "kern" feature kerning and not use classes at all, i.e. only use pair positioning. For example, all Microsoft ClearType collection fonts (which are in OpenType TT format rather than OpenType PS, but that's secondary), use GPOS "kern" feature kerning but do not use classes. </p>
      <p>Regards,<br>
      Adam</p>
