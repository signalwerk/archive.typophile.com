    html: |-
      <p><cite>A Type Primer by John Kane.</cite></p>
      <p>It should be everyone’s first. Reading Kane cleared up all the confusion I was left with after reading the usual stuff. </p>
      <p><cite>Perhaps Elements of Typographic Style is a bit heavy for a beginner, or do you disagree?</cite></p>
      <p>I tried reading it early on and was really confused as to why my professor wanted me reading all this pretentious nonsense that no editing department would ever go with. I often use it as a reference, particularly for terminology, but as a student I find the advice in it is usually too impractical to be of much real value. Professors who insist we read Bringhurst will usually see our work as boring, dated, or stuffy if we put the ideas into practice. And all three of my design jobs have explicitly stated not to follow Bringhurst.</p>
    html_clean: |-
