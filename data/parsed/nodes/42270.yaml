    <p>Hi there,<br>
    I'm doing a quick survey to ask, 'what was your first book about typography?'<br>
    Particularly, which books were on your first year (freshman) university/college/apprenticeship reading list?  And which of these was the first that you bought, read, and referred to early on in your typographic education.</p>
    <p>For me it was James Felici's Complete Manual of Typography.</p>
