      <p>I believe I bought both Bringhurst's <em>The Elements of Typographic Style</em> and Craig's <em>Designing with Type</em> at the same time in the RISD bookstore, but I only take one with me wherever I go. Guess which one ;-) .</p>
      <p>EDIT: Per Ryan's request, I'll make it more explicit. I had been into type for several months before buying Bringhurst, but as soon as I sat down with it, I knew I was passionate about what it detailed. Just one of those classics (if I can call it that after only two years). Craig was certainly not bad, but I read it after reading most of Bringhurst, and there wasn't too much new information in there. Some practical knowledge, though, and a better introduction to identifying common typefaces than Bringhurst.</p>
