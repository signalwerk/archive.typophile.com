    html: |-
      <p><cite>Perhaps Elements of Typographic Style is a bit heavy for a beginner, or do you disagree?</cite></p>
      <p>It was a touchstone for me. When I was in school (not a very good design school) it was all backlash and '70s freedom. There was very little taught about classic geometry and structure. Everything was stagnant and the Mac was about to hit. Elements was the real deal—it had all the knowledge my teachers didn't have, which is exactly what I wanted. I think the book works as a read, but also a great reference. I still look things up in it all the time.</p>
    html_clean: |-
