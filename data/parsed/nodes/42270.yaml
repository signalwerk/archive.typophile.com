    html: |-
      <p>In 1973, I had just gotten my journeyman's card as a hot-metal hand compositor. I had worked as an apprentice comp for 5 years. Though I had never read anything about "typography," I was excited about setting type for books. That summer I spent 5 weeks at the Vermont farm of the great type teacher Ray Nash. I read both volumes of Updike's "Printing Types" and talked with Ray and the handful of other students about what I had read.</p>
      <p>When I had time I watched the Watergate hearings on TV.</p>
      <p>Discovering the richness of typography in Updike made me go back to college, finish the final semester for a BA in English, and then commit to becoming a typographer. Here I yam, 35 years later.</p>
      <p>powers</p>
