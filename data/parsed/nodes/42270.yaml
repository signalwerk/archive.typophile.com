      <p>I became interested in type* long after I'd graduated college.  I've done a lot of internet research &amp; went to TypeCon in 2006, but my first real typography book is "About Alphabets" by Zapf, which I read last year.  Since then, I've gotten a bunch from the library.  I'm still quite new to it all, though.</p>
