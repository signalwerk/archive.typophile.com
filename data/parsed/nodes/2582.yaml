    html: <p>One thing you can do is visit the indispensable newseum.org , go to the "Today's Front Pages" section, see if the paper you want entered that day (it's highly variable), download the PDF (sometimes a bitmap PDF though) and check in the doc info for the font names. Custom faces often have unpublished names however, but you can always sic Google on it. <br> <br>hhp <br></p>
