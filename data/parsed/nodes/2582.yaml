  html: <p>After visiting family on the west coast over the holidays, I returned home the long route due to snow in Chicago, (over 24 hrs city hopping on standby). The upside was that I got to gander at several newspapers along the way (New York Times, the Washington Post, USA Today, San Jose Mercury News and San Francisco Chronicle). I was too shot to compare from a content standpoint, but it was interesting from a design perspective. The SF Chronicle is a lovely looking paper, tops of the group in my opinion. <br> <br>I've spent a bit of time researching the Chronicle redesign and didn't find too much (it was Danilo/Black job I think, but their site lays claim only to the sunday edition). Anyone know what the type is and who did it (not the condensed sans, the serif headline and body)? It is a beautiful combination of fresh character and legibility. By contrast, the others looked stale (suprising to me, even Gulliver in USA Today seemed blah). <br> <br>The San Jose Merc type is ugliness personified (IMHO) despite it's redesign. <br> <br>In the end content is king, but a casual design survey was fun. <br> <br>Cheers, <br>Randy </p>
