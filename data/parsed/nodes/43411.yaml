    html: |-
      <p>This isn't Gotham.</p>
      <p>Colors has used a variety of sans-serifs over the years: Franklink Gothic back in the Tibor Kalman years, and Avenir more recently. In fact, I believe that's Avenir on the cover in your "colors20" sample.</p>
      <p>The body copy in 22 is a humanist sans of recent vintage: it's not FF Kievit, but it's in that ballpark.</p>
    html_clean: |-
