      <p>R.: <cite>According to what German native speakers say, pronouncing the last syllable of ‘Heidrich’ as a rhyme for ‘fish’ comes closer to the original sound than making it rhyme with ‘big’ or ‘sick’.</cite></p>
      <p>It's the name of a Pole, though, and even if Poles imitate the German vowels for Heidrich, I doubt they use the German ich-Laut /ç/ for the final consonant. They use a sound identical to the German ach-Laut /x/, which doesn't sound anything like 'sh' in English. In any case, as in Zurich, the usual anglicization of the German ich-Laut is also 'k'.</p>
      <p>If you can pronounce the names with sounds not normally used in English, like the ach-Laut or nasalized vowels in French, that's fine, but it is perfectly acceptable (and arguably desirable) to replace those sounds with English near-equivalents when saying these names in an English context.</p>
