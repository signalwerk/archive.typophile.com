      <p>Seymour Chwast is American, so Chwast is pronounced KWÄST as <a class="freelinking external" href="http://www.loc.gov/nls/other/sayhow.html" rel="nofollow">the NLS pronunciation guide</a> has it or /kwɑːst/ in IPA (in the NLS transcription, ä represents the vowel of PALM).</p>
      <p>Heidrich would be pronounced /ˈxeidrix/ according to Polish pronunciation rules, although I don't know if Poles would imitate the German pronunciation for the non-native sequence 'ei'. HAY-drick would be an acceptable anglicization, or HIGH-drick if the Poles indeed imitate German pronunciation for the vowels.</p>
      <p>For Andrzej (/ˈandʐej/ in Polish), ÄND-zhey would indeed be the closest to the original pronunciation, but ÄND-ray (= anglicized pronunciation of André) is also close enough in my opinion and is in fact the only anglicization I've heard for this Polish name.</p>
      <p>Excoffon (/ɛkskɔfɔ̃/ in French) would be ex-caw-FAWN following the usual method of pronouncing French names for American English. Likewise, pay-NYO is usual for Peignot.</p>
    html_clean: |-
