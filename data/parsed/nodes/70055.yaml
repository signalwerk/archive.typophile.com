      <p>You’re certainly right, Jongseong, saying that Poles do not use the German ‘Ich-Laut’ when pronouncing Heidrich’s name. I just wanted to make a point in favour of using the final consonant of ‘fish’ when rendering the German sound in English — although this may have been less than relevant in the present case. The ‘sh’ sound permits to come a bit closer to the original consonant and may not sound all too strange in rare names; the established anglicisation should, of course, be used if there is one.</p>
      <p>Whether the German and Polish ‘ach’ sound or the nasalised ‘o’ is perceived as difficult to pronounce depends on the variety of English you’ve grown up with. Given that KatRanPress seems to be neither a Scotsman nor a Brit, your suggestions may work best. Apologies for any incorrect information!</p>
