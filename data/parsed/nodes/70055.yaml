    <p>On Wednesday I'm giving a <a class="freelinking external" href="http://www.pecha-kucha.org" rel="nofollow">Pecha Kucha</a> talk about <a class="freelinking external" href="http://www.katranpress.com/stamps_about.html" rel="nofollow">postage stamps by type designers</a>, and there are a few names I'm sure how to pronounce. Would anyone be willing to offer advice on pronouncing the following?</p>
    <p>Excoffon (as in Roger)<br>
    Andrzej Heidrich<br>
    Chwast (as in Seymour)<br>
    Peignot (as in Peignot &amp; Sons)</p>
    <p>Many thanks.</p>
