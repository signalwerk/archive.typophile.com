      <p>According to what German native speakers say, pronouncing the last syllable of ‘Heidrich’ as a rhyme for ‘fish’ comes closer to the original sound than making it rhyme with ‘big’ or ‘sick’. So, ‘High-drish’, stressed on the first syllable, should be okay. For ‘Andrzej’, I would suggest ‘Unn-jay’, the stressed first syllable rhyming with ‘fun’, the second with ‘play’.</p>
      <p>The pronunciation of ‘Excoffon’ can be transcribed as ‘Ex-ko-fõ’. ‘Ex’ is like ‘specs’, ‘ko’ may have vowel like ‘blow’, the vowel in the stressed last syllable should be nasalised as some Englishmen do in words like ‘chanson’. In ‘Peignot’, try to avoid using in a diphthong in the first syllable in favour of something like the first vowel of ‘Pepita’; the second syllable is like a British pronunciation of ‘new’ with a vowel of the ‘blow’ type, i. e. ‘Pe-nyow’.</p>
