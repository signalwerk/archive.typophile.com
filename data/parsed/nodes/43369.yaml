      <p>Um, at the risk of faulty cut and paste again, here is about "Times Modern" from the Wikipedia:</p>
      <p>"On 2006-11-20, Times newspaper unveiled Times Modern, as the successor of Times Classic.[9] Designed for improving legibility in smaller font sizes, it uses 45-degree angled bracket serifs. The font was published by Monotype as EF Times Modern. The font was designed by Research Studios, led by Ben Preston, Deputy Editor of The Times, in partnership with Neville Brody, former art director of The Face, and lead designer on Actuel, City Limits and Arena magazines. The design team included Ben Preston, David Driver, Mike Prowse, Chris Davalle, Kathleen Wyatt Research Studios: Neville Brody, Jon Hill, Luke Prowse."</p>
      <p>Since Dux = Luke Prowse <a class="freelinking external" href="http://www.typophile.com/node/29521" rel="nofollow">drew Times Modern</a> he was evidently indulging in a bit of wry inside humor that I totally didn't get last night.</p>
