      <p>There is absolutely nothing wrong with Times for books. Never has been. It is a perfectly good face for books. As with all faces, one has to be careful about how it is used. </p>
      <p>In metal Times, oldstyle figs and smalls were available, and even a long-descender version, which was splendid.</p>
      <p>Today there are several "Times" versions to choose from, and when a typographer works out how a book is to look, and looks at all the versions and chooses the right one, a fine looking book can be made.</p>
      <p>The thing most people don't "want to stare at for long stretches of time" is poorly-set type. Do not decide against Times or any other typeface because it is overused. Choose typefaces that are right for the project. That's the only criterion.</p>
      <p>powers</p>
