      <p>I agree with gulliver: Adobe Times Ten in OpenType is the biggest, best proportioned and snappiest Times on the market, and being able to shift globally to oldstyle figures makes it right for books too. It's the only one with OSFs, as far as I know. But that's if you have to use Times at all; it is, after all, the most over-exposed typeface on earth now.</p>
      <p>The problem with Plantin is choosing between the light weight, which is too light for reliable use under 11 pt, or the regular weight, which is a little too black and clumps up. But I love the look and proportions for Plantin and always have. Depends on your point size and the paper. Plantin Light works with smooth or coated stock but not below 11pt. The toothier the stock the better the regular weight looks.</p>
      <p>Be sure to buy your OpenType Plantin from Monotype...they have OSFs; Adobe's OT does not.</p>
