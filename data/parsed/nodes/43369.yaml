    html: <p>I agree, the distinction is subtle (do you know how the faces are related?), and I think Plantin would be better. I think it has a little more character, and its sturdy serifs and color make it more comfortable for reading. Times is another face that looks spiky in digital format. Get the size and leading right and Plantin will look classic. The advantage you have is that they are similar in proportion, and few laypersons will know the difference.</p>
