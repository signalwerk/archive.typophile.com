      <p>&gt; I really can’t see any reason to use Times in a book other than to suggest office documents or a newspaper. It’s a very dull-looking face, and not the sort of thing most people want to stare at for long stretches of time. And the italic is sort of ugly.</p>
      <p>I can't agree with that. Times is a fine face for books. It is extremely readable (in the right size, measure, margins and leading). And ugliness of the italics is a designers opinion (with which I fail to agree). Many, many books (generally 20 years or more ago) were set in it, and I have never heard of people having trouble reading it "for long stretches of time."</p>
      <p>All that said, I will agree that the font is overused, and therefore would not use it unless forced to somehow. But it is not a poor font based on other merits.</p>
