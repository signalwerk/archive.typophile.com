    <p>just a quick question. For a simple book design i am obliged to use times. I think Plantin would be a subtly better option. Is this just my opinion (caused by the over-use of times?) or do i actually get the thing right for once? The book needs a regular, an italic and a bold italic (possibly also smallcaps) in 10pt.</p>
    <p>thanks for your response.</p>
