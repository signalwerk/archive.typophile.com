      <p>If you really are obliged to use Times, then I'd recommend using <a href="http://www.myfonts.com/fonts/adobe/times-ten/" rel="nofollow">Adobe Times Ten,</a> which has been designed, spaced, and otherwise optimized for smaller text sizes.</p>
      <p>It's the only Times to use for text, in my opinion, except for perhaps <a href="http://www.myfonts.com/fonts/adobe/times-europa/" rel="nofollow">Times Europa,</a> although that's also a step or two removed from Times.</p>
      <p>While I'm no huge fan of Times New Roman and its variants generally, I have seen the family used beautifully in some instances.</p>
      <p>David Thometz</p>
