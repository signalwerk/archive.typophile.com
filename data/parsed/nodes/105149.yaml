      <p>It's not "in the public domain,"* but I've used Slimbach's Cronos for elementary-school-related things and thought it worked very well. It's highly friendly and legible, a very interesting sans serif. You'd probably want to pair it with a serifed face, though not necessarily.</p>
      <p>* In fact, no digital fonts are in the public domain, though some are voluntarily distributed for free, and others are pirated and made available for free against the designer's wishes.</p>
