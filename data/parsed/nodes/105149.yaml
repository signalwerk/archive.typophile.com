      <p>For a free, opensource, quality serif typeface, good for extended text settings, try Gentium:</p>
      <p><a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=gentium" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=gentium">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=gentium</a></p>
      <p>For a sans serif - good for headlines and smaller portion of texts - you could try Lato:</p>
      <p><a href="http://www.latofonts.com/lato-free-fonts/" title="http://www.latofonts.com/lato-free-fonts/">http://www.latofonts.com/lato-free-fonts/</a></p>
      <p>Hope this helps.</p>
