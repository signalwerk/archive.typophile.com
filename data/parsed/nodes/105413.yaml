    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hsb_text_4725.png"></div><p></p>
    <p>The letters are very plain and vertical, squashed together quite close, so the automatic online identifiers can't distinguish them.   To my uneducated eye, the most distinctive feature is that the lower-case s appears to have a round top but a flat bottom.   Unfortunately there are no uppercase letters or numerals in my sample.</p>
