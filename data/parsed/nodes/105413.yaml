    html: "<p>Hard to say, blurry, super tight tracking... It's obviously a geometric sans, similar to <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/avant+garde\" rel=\"nofollow\">Avant-Garde Gothic</a> or <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/futura\" rel=\"nofollow\">Futura</a>. Feels \"freebie\" too. Some you might like: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/mti/century-gothic\" rel=\"nofollow\">Century Gothic</a>, <a class=\"freelinking external\" href=\"http://www.dafont.com/champagne-limousines.font\" rel=\"nofollow\">Champagne &amp; Limousines</a>, <strong><a class=\"freelinking external\" href=\"http://www.dafont.com/geo-sans-light.font\" rel=\"nofollow\">Geo Sans Light</a></strong> (possibly matching). Actually, many freebies that you could find <a class=\"freelinking external\" href=\"http://www.dafont.com/theme.php?cat=501\" rel=\"nofollow\">here</a>) would do the job.</p>"
