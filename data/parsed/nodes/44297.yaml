    html: |-
      <p>Click on Resources (top right), go to Typography 101 and see that about all of the fonts Jonathan Hoefler presents as examples for different type styles are inspired by/revivals of older typefaces.</p>
      <p>BTW, Arial is already “inspired by” Helvetica.</p>
