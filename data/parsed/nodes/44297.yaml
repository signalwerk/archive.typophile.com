    <p>Hi, I’m looking for fonts that were inspired by/ derivatives of older fonts such as Arial, Baskerville, Bembo, Helvetica, Univers for a font encyclopedia kind of book we are writing. can anyone help?<br>
    Does anyone know of a website that could tell me?<br>
    Thanks!</p>
