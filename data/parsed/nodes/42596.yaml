      <p>You're scanning this guy in? I'd go for one of the thin sharpies and try again. Put more of your own natural touch to the letters. (I highly doubt you draw a lower case g like that.)</p>
      <p>A good thing to do is open up other fonts in your editing program, or in Illustrator, and  look at the details of each letter-form.</p>
      <p>But don't be afraid of the Comic Sans comparison. If you're just getting into designing a font, you could do worse :)</p>
