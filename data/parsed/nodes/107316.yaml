      <p>As far as I'm concerned this website is becoming intolerable and it is almost unusable. </p>
      <p>I have sent emails to tech support re: "Service Temporarily Unavailable" and various other spurious server error messages - all to no avail. Not even the courtesy to respond. </p>
      <p>I am more than willing to contribute to the Typophile forums - if only the server didn't pull the plug on me after a couple of minutes. It has got so bad that the server has been not accepting my password at log in and when I request another the system just freezes, or I get multiple reset links in my inbox. Aaaarrrrrggggggh! from a very annoyed occasional (when it lets me in) user.</p>
      <p>This service is frankly outrageous and laying the blame on the "Chinese Hackers" has gone way past a joke. Yeah -right. Please fix it or put it out of it's misery!</p>
      <p>P.S. Just so you realise that I do know what I'm talking about regarding support, let me state:- In association with my business partner (cyclone systems.co.uk) we supply internet web hosting services via our <a href="http://www.cylonet.com" title="www.cylonet.com">www.cylonet.com</a> site with guaranteed 24x7x365 server support service included. If we supplied a service that was marginally as poor this one is - we would be out of the game!</p>
