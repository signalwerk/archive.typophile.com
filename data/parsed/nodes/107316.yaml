    date: 2013-11-24T09:19:00
    date_raw: 24 Nov 2013 — 9:19am
    votes: null
    html: |-
      <p>Unfortunately there is no true alternative yet. TypeDrawers is a good forum, but it is not meant as a Typophile replacement, since it has a much narrower focus with restrictions concerning content and things like user names. Typedia could have become a vivid typography forum but they closed the forum in 2011. All other typography forums I know of are just sub-forums of design forums. No other (English) site has a similar focus as Typophile.<br>
      Based on my experience with running a vivid German typography forum since 2001, I plan to set up an English copy early 2014. It will be a full-fledged community site with all the bells and whistles one would expect from such a site nowadays. So there is hope. :-) </p>
      <p>Still, I am also hoping that all the Typophile discussions will someday be “freed” from the current software and moved somewhere where they can at least be browsed without problems as an archive.</p>
    html_clean: |-
