    date_raw: 1 Oct 2003 — 9:50am
    votes: null
    html: <p>One visual problem I'm having with this is how many typefaces there are in this one logo. I'm afraid that I would try to find a family that was both sans and serif, or sans with a smallcaps. Something that didn't clash too much with the one you apparently have to use. And I also agree that it seems very horizontal.</p>
