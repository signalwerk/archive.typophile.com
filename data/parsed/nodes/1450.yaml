    html: <p>Karl, I'm sorry but your client is asking you to design a Blivit, you know 10lbs of s(word) in a 5lb bag. I think you should campaign to have the overall idenity be split from the brand name. Isn't the overall idenity somewhere else on the communication. The brand and its sub brand should stand alone. Thats my opinion, Dan</p>
