    html: |-
      <p>Ludwig, </p>
      <p>1. Implementing script- and language-specific OpenType processing is by no means quite simple. </p>
      <p>2. Nonetheless, applications are easier upgraded than fonts. Once a font is released to the public, it's difficult to make fixes because you introduce the possibility of incompatible versions with an identical name floating around. </p>
      <p>3. InDesign is a huge project, an application written from scratch. Each version adds more typographic refinement but obviously, it's impossible to do everything at once. But my guess is that script- and language-specific OpenType processing is on the developers' priority list. </p>
      <p>4. Very simply, never take anything for granted. </p>
      <p>A.</p>
