      <p>Miguel — Thanks for the info. But what do you mean by 'improved'? Either language tags are supported, or they are not. At the moment they are not, in InDesign CS2.</p>
      <p>What's so difficult? The user can specify which language applies to what string of text already, so that the program is able to use the proper dictionary (for hyphenation and spell check). Using this information, the OT engine could easily look for language tags in the font and apply the associated lookups. Obviously, the tags used by the app should match the OT tags, but I can't imagine Adobe failing to have consistent tag naming conventions.</p>
