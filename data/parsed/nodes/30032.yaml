    votes: null
    html: <p>Paul — All right. But it was quite disenchanting a surprise to me, to learn the industry's OT-savviest application doesn't support one of OpenType's imho most indispensable attributes yet. I took this for granted, since all the documentation on OT discusses language systems specific rules at length, Adobe people are giving talks about it at ATypI, and, not in the least, because Adobe ships Pro fonts that, for years now, are equipped with language specific substitution exceptions. Also, I fear that support for language system tags is not on InDesign developers' priority list, which would explain why they didn't take care of this quite simple (?) upgrade thus far. After all, it's like about over a decade now, since the OT format was designed. I imagine at the moment the InDesign team are already busy enough with porting InDesign to the new MacIntel, which adds to my apprehension of lacking OT language support in InDesign releases in the near future, let alone the next one.</p>
