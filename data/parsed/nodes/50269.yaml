    <p>My new typeface “Recovery” is now available from <a href="www.typetrust.com" rel="nofollow">TypeTrust.</a> Recovery is a reinterpretation of Charles Coiner’s letter designs for the National Recovery Administration and M.F. Benton’s typeface “Eagle Bold” which was based on Coiner’s work. Recovery comes in one weight with small caps, fractions, and an extended character set.</p>
    <p>View and buy it <a href="http://typetrust.com/font/recovery" rel="nofollow">here: http://typetrust.com/font/recovery</a></p>
    <p>And the <a href="http://www.typetrust.com/fonts/specimen_pdfs/TypeTrust-Recovery.pdf" rel="nofollow">PDF is here</a>.</p>
    <p>Thanks to Silas Dilworth for his invaluable assistance with the production of this typeface.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/recovery_release_5416.jpg"></div><p></p>
