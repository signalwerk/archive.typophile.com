      <p><em>Nick, If Recovery is a copy, then what is FB Eagle?</em></p>
      <p>A respectful copy.</p>
      <p><em>James never referred to anything as a mistake on Benton’s part.</em></p>
      <p>"Recovery drops Benton’s too-narrow S..."</p>
      <p><em>“Fiddling with some character widths and metrics” is one of the greatest technological advantages we have today in chasing a well-designed and well-proportioned typeface.</em></p>
      <p>Well, that's debatable. The design and proportions of a typeface bear an intimate relationship to the technology used at the time it's made. So fiddling isn't really a technological advantage, because all eras have technology that can be used to finesse widths and metrics.</p>
      <p>But the point I was making was not about the merits of tinkering per se, but that Recovery is claimed to be a "reinterpretation", not a close revival with one letter redesigned and a lot of subtle nuancing. Looking at Coiner's letters (are there more than four in this style?) one would expect a reinterpretation to be much different than closely following in the footsteps of Benton and Berlow.</p>
      <p>Look, I've done revivals, and while I think original work deserves more respect, I don't think there's anything inherently wrong with doing them, although it's an ethical minefield. What prompted me to contribute to this thread was the gap between James' ambitious conception of the amount of socially relevant meaning that can inform a typeface, and the reality of releasing a close copy as one's first commercial type design. At Typecon, he showed me an original design he was working on, so I was disappointed to see Recovery and not that. </p>
      <p>Hopefully he will give me similar consideration next time I post a new release in this forum...</p>
