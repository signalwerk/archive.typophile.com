      <p>Similarly, a typeface can be interpreted.  Coiner's work was invariably filtered by Benton's experience and the technology of their day, and further augmented by Font Bureau to meet the demands of the <em>Publish!</em> project.  James has chosen to interpret Coiner's and Benton's work, contributing a certain degree of nuance that many will find valuable and preferable to other reproductions.  Recovery is recognizably rooted in the ATF Eagle specimen.  For that it is an interpretation, however faithful you wish to judge it.  Recovery comes after FB Eagle, so we respectfully call it a "<em>re</em>interpretation".  There's nothing dubious about the word.</p>
      <p>I believe "a lot of subtle nuancing" is a considerable contribution to breathing new life into a typeface.  In any sort of design practice, nuance is the fine line between a desirable work and something less preferable.</p>
      <p>James may have come across as ambitious in his artist's statement <em>slash</em> ad copy, but such is the nature of marketing.  He's an inspired and disciplined new talent.  I don't think it's fair to scold him for being so.  I personally pushed him to work on the Recovery PDF so as to explain his intentions with this project, so blame me for fostering his lofty claims.  His passion for this stuff is however evident and valued.  Recovery is an excellent first release.</p>
