      <p>A few things:</p>
      <p>I meant no disrespect to Benton. But I don’t think that Eagle Bold was a perfect typeface (nor do I consider my work perfect), and I hardly think that my saying so is any sort of attack on a great designer.</p>
      <p>As for the revival/reinterpretation argument, at the end of the day it’s a relatively trivial argument over semantics. Maybe revival would be a better word. Maybe it’s the word I would have used if I had the decades of experience under my belt that Nick does. But it was not chosen to try and raise myself up over any other designer. Nor was it used to imply that Recovery is an original design. </p>
      <p>The essay in the Recovery specimen isn’t great. I’ll probably end up rewriting it. But it’s really just ad copy—it’s not like this is appearing in <em>Baseline</em>. In retrospect, I overstressed the importance of Coiner because I felt that his contribution to the design of Eagle is neglected—the entire design is usually attributed to Benton. This was not meant as a slight to Benton, although I see how it can be interpreted that way.</p>
      <p>And as for my original works, they’re coming. Recovery was done as a break from art school before getting back to the original stuff. The face I showed at Typecon is a very ambitious design; I doubt it will see a release for at least a few years. Then again, with the job market the way it is, I may have time to get it done by spring ;)</p>
