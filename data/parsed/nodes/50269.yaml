      <p>Nick, If Recovery is a copy, then what is FB Eagle?</p>
      <p>I don't believe it's a "diss" to make considered, subjective changes when producing a digital revival, especially if they are measured and intended by the designer and preferable to the user.  In addition to the more notably redrawn "S", Recovery exhibits what I would argue to be a more balanced visual equality.  The repositioning of counters/bowls alone is a notable departure from what James rightfully refers to as Benton's "quirky gothic letters".  James never referred to anything as a mistake on Benton's part.</p>
      <p>I also respectfully object to your tone.  "Fiddling with some character widths and metrics" is one of the greatest technological advantages we have today in chasing a well-designed and well-proportioned typeface.  We learn through play, and if Benton were to work in FontLab today, I'm sure he'd fiddle a symphony.</p>
