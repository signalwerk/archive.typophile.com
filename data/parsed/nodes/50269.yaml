    html: |-
      <p>I haven’t actually licensed FB Eagle, so I can’t go into too much detail based on the specimen I have. Coiner’s letters for the NRA often feel a little harder and draw more attention and I tried to work that into Recovery. FB Eagle Bold feels a little lighter, some angles and points aren’t as sharp, and overall it feels a little quieter, perhaps because Dave drew it to work alongside the book weight. There are also some letters in both that depart pretty dramatically from the quirky gothic letters by Benton: Recovery drops Benton’s too-narrow S, FB Eagle uses a different K for example. </p>
      <p>Eagle also features a much larger character set and fractions, whereas FB Eagle adds a lowercase.</p>
