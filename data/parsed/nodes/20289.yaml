    html: |-
      <p>there is actually a "cheat" to this also.<br>
      it is not recommended for longer texts but it can come in handy at times. (I use it mostly to correct the left hand positioning of two lines of headlines when big capitals seem to have a bad vertical alignment.) </p>
      <p>before your hanging indent numeral or bullet, type a [space],<br>
      then assign a massive negative tracking to that space (i.e. -1000)<br>
      and the numeral/bullet will indeed hang from the left hand side of your text frame.<br>
      copy/paste this character ([space]) as neccessary.</p>
      <p>best regards,<br>
      tobias</p>
