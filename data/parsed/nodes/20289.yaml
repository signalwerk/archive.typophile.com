    <p>Okay, okay, forget the argument about how such things might hinder readability for their lack of differentiation from the body text matter.</p>
    <p>Now how exactly can you make them in InDesign or a page layout program? Because, rather ironically, I've had more success achieving them in MS Word.</p>
