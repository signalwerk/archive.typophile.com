    date: 2006-05-29T03:52:00
    date_raw: 29 May 2006 — 3:52am
    votes: null
    html: |-
      <p>Or a plus and minus left indent setting on style sheets/format. For example, if the bullet was to hang 2mm outside the left margin of the body text, all body text would be indented 2mm while bullet text would be lefthand indent 2mm, first line indent -2mm. With numerals (especially those that go above 10) you might want to include a right aligning tab so that they all align on the righthand side.<br>
      This will mean that your text box should start 2mm before your lefthand margin and be 2mm wider than your measure.<br>
      For shorter pieces of text (or for working out your layout) the indent to here character would solve the problem too.<br>
      Tim<br>
      {edit I should have added that you will need to set the bullet as this – bullet_tab_copy or in the case of right aligning numeral – tab_numeral_tab_copy}</p>
