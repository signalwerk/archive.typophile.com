      <p>Wouldn't your spell checker Hag this as errors?</p>
      <p>When floppy disks were still really floppy (and could be stapled to a printout), they were prone to having bad sectors. Rather than asking authors a new disk for a single bad sector, I usually just typed those missing 512 bytes from the manuscript. Then, being apprehensive at my typing skills, I would spell-check it. And sure enough, then a customer complained about his text describing lots of "pubic areas".</p>
