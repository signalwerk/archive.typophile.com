  html: |-
    <p>I occasionally have to convert the text of an out-of-print book into an editable digital file for a new edition, when the publisher no longer has (or never had) a computer file of it. OCR errors are inevitable, some of them quite hilarious.</p>
    <p>Is there a name for OCR errors, especially the unintentionally humorous ones? I submit that they be called Checkered Hags. Here's the story: In a book about Indy car racing that I was OCRing, my OCR program had trouble with the f-l ligature. Instead of f-l, it responded with uppercase H. And of course the numerous checkered flags encountered in a book about auto racing became checkered Hags. (I had to check all H's in the OCRed text when I noticed this.)</p>
    <p>Gary</p>
