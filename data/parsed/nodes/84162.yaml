      &nbsp;&nbsp;&nbsp;	sub N' by N.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub O' by O.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub P' by P.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub Q' by Q.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub R' by R.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub S' by S.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub T' by T.begin;<br>
