    html: |-
      <p>nailed it</p>
      <p><code><br>
      feature calt {<br>
      &nbsp;&nbsp;&nbsp;	@IGNORE = [A-Z a-z A.begin - Z.begin ampersand quotedbl numbersign dollar percent ampersand |craploads more here| ];<br>
      &nbsp;&nbsp;&nbsp;	@CAPS = [A-Z];<br>
      &nbsp;&nbsp;&nbsp;	ignore sub @IGNORE @CAPS';<br>
      &nbsp;&nbsp;&nbsp;	ignore sub @IGNORE space @CAPS';<br>
      &nbsp;&nbsp;&nbsp;	sub A' by A.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub B' by B.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub C' by C.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub D' by D.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub E' by E.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub F' by F.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub G' by G.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub H' by H.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub I' by I.begin;<br>
      &nbsp;&nbsp;&nbsp;	sub J' by J.begin;<br>
