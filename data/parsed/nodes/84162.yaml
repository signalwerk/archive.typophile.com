    html: |-
      <p>You know, if you are careful to keep each block of GIDs contiguous, you can shorten 26 lines of that code to:</p>
      <p>sub [A - Z]' by [A.begin - Z.begin];</p>
      <p>See: <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#2.g.i" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#2.g.i">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.htm...</a></p>
      <p>Cheers,</p>
      <p>T</p>
