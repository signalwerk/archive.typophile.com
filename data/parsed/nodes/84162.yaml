  html: |-
    <p>I don't know much about the use of conditions in creating a font. To try and get this to work I generated a glyph for the letter A and called it A.begin. I then changed the glyph and added this rule in the Open Type console:</p>
    <p>feature diff {<br>
     substitute period space A' by A.begin;<br>
    } diff;</p>
    <p>But it didn't work.</p>
    <p>I'm a programmer so I get logical conditions but I just can't find the documentation for this. Any pointers will be much appreciated.</p>
