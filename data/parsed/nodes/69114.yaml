    html: |-
      <p>The student-teacher relationship is more like the customer-supplier relationship these days.<br>
      One's students are one's clients, so they expect value for money.<br>
      After all, they're investing in getting a good job, the education is incidental.<br>
      Actually, I'm not totally cynical, I think student power is a necessary corrective to unfettered authoritarianism.<br>
      It's good to accommodate it within the system, which is more civil than externally through no-holds-barred "rate your prof" web sites.</p>
      <p>Having done some teaching at Ontario colleges, I have been asked to distribute student-feedback questionnaires to students (taking up valuable teaching time while they fill them out!) so that they can let the powers that be know whether I'm up to scratch. Of course, with transparency, these are eventually forwarded to me (without student names, although it's pretty easy to figure out who says what). It's somewhat galling at first, but the good thing is when the head of faculty says sure, many of them think typography is the dullest, least creative, most useless part of graphic design, but we know better. And it can give a teacher a good indication of some areas where improvement may be necessary.</p>
