    html: |-
      <p>I see the loonies are running the asylum over on the other side of the pond these days. LOL I mean...if you are interviewing for a job with 8 year olds. Personally, I'd find that a waste of time more than anything else. Children do not know the appropriate questions to ask of a teacher. What are they going to ask...questions that make sense to them, of coruse. I can see the list:</p>
      <p>1) How much homework would you give?<br>
      2) How much fun learning will there be, i.e. field trips, etc?</p>
      <p>I, honestly, would not have known what questions to ask myself, if I were that age. They are being put in a bad position. Infact, I would say that if they want valuable feedback, don't ask the kids, ask the parents.</p>
      <p>I do agree with Nick. I have to fill those questionaires out after every class. Of course, I do mine online. But, I feel, relatively, sure that the teacher can tell who is saying what. I mean, my typography teacher knew me, I'm sure. After all, I had the attitude Nick speaks of, "Dullest, least creative, subject around" going in. However, that all changed first week. Why? Well, my teacher challenged me to do better with every project, think outside the box with every response.</p>
