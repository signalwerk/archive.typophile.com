      <p>I bought the first series on DVD in November, and saw Confidential then. I live in Germany, and we have the same DVD encoding here that they use in the UK.</p>
      <p>Anyway, why wait until July to buy the US DVDs? Season 1 has been on sale in North American format in Canada since February. Amazon.ca ships to the US, too. It just costs a bit more…</p>
      <p>I noticed on your profile that you are from Maryland. I'm from Baltimore originally, and grew up watching the old Doctor Who on MPT! </p>
      <p>I've seen some "Doctor Who" free fonts on the internet, but they all looked auto-traced.</p>
