      <p>I live in the US so I have to download the episodes with bit torrent after they're broadcast in the UK, and haven't downloaded any Who Confidential episodes, are they worth it, or should I wait for the DVDs? (I'm assuming the best of the confidential would be bonus features on a DVD).<br>
