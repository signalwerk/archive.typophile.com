    html: |-
      <p>I guess you'll get better answer pointing directly to Alexia Roux's <a class="freelinking external" href="http://alexiaroux.fr/portfolio/memoire" rel="nofollow">portfolio</a>. You'll probably note she used to different sans, one is own Alexia Roux's custom typeface called 'Perception' (as seen <a class="freelinking external" href="http://alexiaroux.fr/wp-content/uploads/2014/07/391.jpg" rel="nofollow">here</a>) and the one you're after which I wasn't able to positively identify.</p>
      <p>EDIT: after further inspection the second one could be <a class="freelinking external" href="http://www.myfonts.com/fonts/hurme-design/hurme-geometric-sans-2" rel="nofollow">Hurme Geometric No.2</a>. At least I can't see any contradiction with it (/a, /0, /1, /2, /3, /5, /8, /G, /M, /L, /S...).</p>
