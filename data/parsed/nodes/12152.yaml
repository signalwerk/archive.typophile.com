  html: <p>I added entries for <a href="/wiki/Edward%20Johnston" class="freelinking" rel="nofollow">Edward Johnston</a>, <a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a>, <a href="/wiki/William%20Morris" class="freelinking" rel="nofollow">William Morris</a>, <a href="/wiki/Dard%20Hunter" class="freelinking" rel="nofollow">Dard Hunter</a>, <a href="/wiki/Victor%20Hammer" class="freelinking" rel="nofollow">Victor Hammer</a>, <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>, <a href="/wiki/Hartley%20%2526%20Marks" class="freelinking" rel="nofollow">Hartley &amp; Marks</a> (link probably won't work due to a bug in the Typowiki parser), <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a>, <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a>, and <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a> (who will probably be bemused by what I chose to write about him). All of those are sketchy, to greater or lesser degrees, but you gotta start somewhere. I note without comment that a lot of you are writing about yourselves and your / your company's products. I thought some history might be nice to have as well, especially as a lot of this stuff isn't yet in <a href="http://www.wikipedia.org/" rel="nofollow">the Wikipedia</a> (although I suppose I should add some of this to that as well). Feel free to annotate, correct, or rewrite my deranged scribblings, and drop me a note or a comment and let me know what you think.</p>
