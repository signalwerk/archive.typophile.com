    html: <p>the silver fern and the colour black (as in all the sports teams ..all blacks, black caps,black socks....) the colours teal, green &amp; blue. the koru, the err kiwi, these we see everywhere, and seem to be the default icons when designing a logo for anything new zealand.  <br>You could try looking at the native plants and birds (other than the kiwi) as these have many distinctive aspects to them. <br>maps of the world with new zealand in the centre. <br>as for a new zealand typeface, I will have to think.</p>
