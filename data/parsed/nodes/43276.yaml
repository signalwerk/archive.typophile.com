    <p>Hi everybody</p>
    <p>I´m designing a logo for a friend of mine, a human resources consultant . I came up with these 4 ideas, but somehow they all seem familiar to me; i did it all from scratch and tried to be as original as possible, but at the end i wonder if they are very similar to some others already existing. The copy reads "human connection" in spanish. I´ll appreciate your help.</p><div class="imageWrap"><img src="http://typophile.com/files/conexion humana_4059.gif"></div><br>
    Thanks, and best regards.<p></p>
