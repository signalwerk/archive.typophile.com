    <p>Hello fellow typophiles,</p>
    <p>I’m going to be moving to Providence in the fall, as my boyfriend attends Brown for playwriting.</p>
    <p>I currently don’t know anyone in the Providence area, and am hoping to connect with some type/design people.</p>
    <p>Any typophiles in providence? Or know anyone in the area?</p>
    <p>I’m also going to reach out to the RISD community, but thought I would start here.</p>
    <p>Thanks!</p>
    <p>Jeremy</p>
