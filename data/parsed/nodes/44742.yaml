    <p>Hello everyone, Ive a problem which im not sure whether this is the right place or not, but i thought i’d throw it out there to see what people on here thought on the matter..</p>
    <p>Right then, just so you know, Ive professionally been designing for screen based medias for 10+ years now and whenever ive done designs in the past, for say a new web site, ive always set the text in Photoshop that i intend to display as HTML type to ’aliased’ (or ’non anti-aliased’ to those that wrongly refer to it). This has been so that the client (and any other coder/designer picking up this project at a later date) can clearly see a distinction between the use of images and HTML type. I know that presenting a flattened .jpg this way is a massive presumption that the client will have &lt; IE6 since that browser cant render HTML type as anti-alias but it is, for now, still the majority browser... so this is where my problem lies.</p>
    <p>I had my boss come to me the other day complaining that the screen shot i had sent him for prior approval (copy errors etc) wasnt ’the best ever we could visually provide the client’... I was sat there with my anti-aliasing HTML Mac trying to explain the hows and whys of my actions before finding a PC with IE6 to demonstrate my point. I also had to state that his new laptop was running Vista/IE7 and it anti-aliases the type and thats why other websites on his screen looked really nice, compared to the printed out ’aliased’ HTML type version i had designed in his hand. I also pointed out that the low client expectation level is covered this way, and should the client have IE7 not IE 6 upon its HTML build then it will only look better than what i originally delivered as a flat .jpg screenshot.</p>
    <p>and no, my boss isnt an art director, nor a senior designer type, hes the top level management company type boss so you know.</p>
    <p>So anyway, my predicament is: should i start to anti-alias all my HTML example text in photoshop cos of IE7 now anti-aliasing? or stay designing the way i do??</p>
    <p>any thoughts, advice or similar experiences please</p>
