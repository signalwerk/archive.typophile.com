    html: <p>The light weight of Carol Twombly's <a href="http://new.myfonts.com/fonts/adobe/lithos/" rel="nofollow">Lithos Pro</a> might be a good match. It isn't angular like the treatment of rho in the chirograph, but it references early Greek inscriptional lettering and would harmonise nicely, I reckon.</p>
