  html: |-
    <p>Hi everyone!</p>
    <p>Does anyone know of a single typeface that has sans serif, serif, stencil, and inline (or outlined) styles? Again, I'm looking for a single typeface that has all of these styles included—I know, quite a tall order, but I'm curious if one exists. <a href="http://www.typonine.com/fonts/font-library/audree/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Audree</a> is the only one I know that comes close. It has a so-called normal style, but not a pure sans serif.</p>
    <p>Thanks!</p>
