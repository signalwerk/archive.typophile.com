    <p>Hi Typophilologists ~</p>
    <p>I'm looking for a font to use for a tattoo.</p>
    <p>I'd like it to feel 'antique-old printing-press', without being too ornate and 'olde englishy' - something that has some flourishes, but not TOO many.  (I'm sorry i don't know the names of fonts off hand to reference.)</p>
    <p>I like the font used in the attached (from an old Bible) - anyone know what that is? - but it's a LITTLE too baroque/ elaborate.</p>
    <p>Suggestions are MUCH appreciated!</p>
    <p>Thank you!</p>
    <p>Ryan in San Francisco</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Old-Bible-Font-2B_6520.gif"></div><p></p>
