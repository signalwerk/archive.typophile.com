    html: <p>My apologies Kirnath, I wasn't accusing; just making an observation. This, at least to my eyes, clearly started out life as Trajan and was modified by adding the swash details.  Also, each letter was altered by changing or clipping one or more serifs as well as clipping the ascender on the 'N' and extending the peak of the 'A'. While it might be presumptuous of me to say so, I think this was an attempt to avoid copyright infringements.</p>
