    html: |-
      <p>The music symbols in Unicode are intended for occasional use within typical text, not as a basis for musical notation layout, which typically requires specialised software. The best quality modern music notation output I've seen is from the open source <a href="http://lilypond.org/web/">LilyPond</a> program, which seeks to emulate traditional music engraving.</p>
      <p>For some kinds of music, a simpler, font-level solution is possible. I use the very good and easy-to-use <a href="http://marello.org/projects/caeciliae">Caeciliae</a> OpenType font for Gregorian notation. It relies on something like InDesign in order to work.</p>
