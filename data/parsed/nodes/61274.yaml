    html: <p>You can find musical symbols in the range 1D100-1D1FF. See the unicode chart <a href="http://unicode.org/charts/PDF/U1D100.pdf" title="http://unicode.org/charts/PDF/U1D100.pdf">http://unicode.org/charts/PDF/U1D100.pdf</a>. There are balinese musical symbols in the range 1B61-1B7C. There are also 266D    MUSIC FLAT SIGN, 266E    MUSIC NATURAL SIGN and 266F    MUSIC SHARP SIGN</p>
