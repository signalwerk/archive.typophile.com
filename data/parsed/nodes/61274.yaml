      <p>You can get Lilypond font files from <a href="http://sysinf0.klabs.be/usr/share/lilypond/" title="http://sysinf0.klabs.be/usr/share/lilypond/">http://sysinf0.klabs.be/usr/share/lilypond/</a>. In the left panel, choose "2.8.7 &gt; fonts &gt; otf" and then select a font, say emmentaler-11.otf (I guess 11 is the optical size). To download you click (or right click) on the  blue arrow (Action = Download file) in the top right panel.</p>
      <p>Michel</p>
