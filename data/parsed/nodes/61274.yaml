      <p>In the <a href="http://lilypond.org/doc/v2.12/Documentation/"><strong>LilyPond documentation</strong></a>, it is worth having a look at the <a href="http://lilypond.org/doc/v2.12/examples"><strong>examples</strong></a> with LiLypond input and pdf output.</p>
      <p>I had a look at LilyPond's musical fonts. LilyPond  uses in particular an otf font where the musical symbols are in the Private/Corporate area (from E100 to E27A).</p>
      <p>Michel</p>
