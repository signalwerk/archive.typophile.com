      <p>While it's not a standard for typesetting music <em>per se</em>, Garageband is bundled on every new Mac, and it uses a pair of Truetype fonts to display its music notation. The encoding of these internal fonts does not appear to align to the Unicode positions for musical note glyphs.</p>
      <p>The fonts are located in the package contents/Resources folder of the Garageband application.</p>
