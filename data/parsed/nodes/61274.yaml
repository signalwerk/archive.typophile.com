    html: |-
      <p>PS: <em>Music is an universal language, there should be a Unicode for it.</em></p>
      <p>Music is not a language. Music is culturally-specific and not universal, although most cultures share similar musical concepts. Musical notation varies across cultures and standard Western musical notation can't even capture the expression of some Western music, let alone music from other cultures; this is why some modern composers invent their own notation systems or add new expressive marks to the standard notation. As far as I know, there also isn't any way to indicate a liquescent in standard Western notation, although one can in Gregorian notation. This is a good indicator of how music notation systems evolve for the purpose of particular types or styles of music, and are not universal in what they are able to record.</p>
