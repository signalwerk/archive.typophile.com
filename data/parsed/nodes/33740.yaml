      <p>Hi,</p>
      <p>I had been thinking about that, my concern was budget though. I like to believe that even a student designer should be paid 75% the rate of a working pro. The budget for this logo is a to low to pay a student what I’m thinking would be reasonable rates (ideally I think a student should still get between 700-900).</p>
      <p>It’s a decision I’m having a hard time with, the client is very good to me.<!--
