    <p>Hi all,</p>
    <p>I’m new here and decided to post my question here as it seems like a rather mature forum. :)</p>
    <p>Anyway, time’s tight for me I have a client who needs some logo work done. I had informed him that I am simply to busy, but that there be some options. Here’s what I was thinking:</p>
    <p>The background:<br>
    - The client has a very distinct and clear idea of what they want.<br>
    - A limited budget.<br>
    - They are a good past client.<br>
    - This is a small side venture for them (hence the budget constraints).</p>
    <p>The plan:<br>
    - Possibly use a company like logoloft.<br>
    - I have mentioned the idea to the client so they are aware, and beyond the cost they would pay me to be a go between and most likely to do final tweaks.</p>
    <p>Why Logoloft:<br>
    - It fits the budget constraints.<br>
    - There is a clear vision to start with.<br>
    - Even if they get the logo 70% of the way that’s time saved for me. I can then just come in a spice it all up and add finishing touches.</p>
    <p>The downsides:<br>
    - There are many people with a strong opinion about places like logoloft.</p>
    <p>My general outlook is the same way I look at development, it’s business and you need to consider not only the quality but general feasibility in everything that you choose. </p>
    <p>I’m hoping that perhaps some people here may have experience with logoloft (or other such companies) and may be able to point me in a reliable direction. Or in general just be able to recap their experiences with companies like logoloft. :)</p>
    <p>Thanks for anytime you spend following up on this thread,<br>
    cmarley</p>
