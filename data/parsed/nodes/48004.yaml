  html: |-
    <p>Hello, I am wondering if anyone has used or is using this new Universal Type Server by Extensis. My creative department has been using LinoType Font ExplorerX for some time now and it isn't bad, but I feel we should be on a server based system so we can track usage and purchases and what fonts we actually own and which ones are download by some HACKS! hahahaha!</p>
    <p>Any feedback would be greatly appreciated. If anyone is in the Boston/NYC area I would love to check it out in action too!</p>
    <p>Thanks</p>
