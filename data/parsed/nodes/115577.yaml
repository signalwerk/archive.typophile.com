    <p>ISIA Urbino Type design Week 2014<br>
    with Fred Smeijers</p>
    <p>Period: July 28 / August 1<br>
    Costs: 500€<br>
    Deadline: May 26</p>
    <p>Launched in 2011, the ISIA Urbino Type Design week is a one-week intense course in typeface design, held at the ISIA, High Institute for Applied Arts in Urbino.<br>
    The 2014 Type Week promises to be a unique, multi-faceted, and practical experience in learning about type, having as a guest tutor a reference name in the world of type – Fred Smeijers.<br>
    The ISIA Type Design Week 2014 will take place between July 28 through August 1, on the premises of ISIA, the High Institute for Applied Arts, a former convent in the heart of the Renaissance town of Urbino.</p>
    <p>The ISIA Type Design Week 2014 is lead by Fred Smeijers with Riccardo Olocco and Jonathan Pierini.</p>
    <p>We’re looking for students and professionals in the field of graphic, typographic, and typeface design with a passion for type.</p>
    <p>To apply, send your CV and a short portfolio of your work in PDF format before May 26, 2014. Send your email with your name, family name, birthday, address (street, city, state, country) telephone, e-mail, school or office to <a href="mailto:biblioteca@isiaurbino.net">biblioteca@isiaurbino.net</a></p>
    <p>Visit <a href="http://isiaurbino.net/typeweek">http://isiaurbino.net/typeweek</a> for more information</p>
