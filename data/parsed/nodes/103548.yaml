    <p>Hello,</p>
    <p>I recently did some typesetting at Jarrolds Print Museum, in Norwich, England.</p>
    <p>I printed with a wood letter typeface, called 'Sans Bold "34". I've created a logo out of this font, and now want to use it for the rest of the identity. Is anyone familiar with this typeface, and could you recommend a computerised version?</p>
    <p>Thanks,</p>
    <p>Harry Hepburn</p><div class="imageWrap"><img src="http://typophile.com/files/Wood-Letter-for-forum_6089.png"></div><p></p>
