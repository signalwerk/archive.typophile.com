    html: |-
      <p>I agree with aluminum that to get an exact match it would be best to work direct from your own images rather than trying to find a font that precisely matches "Sans Bold 34."  Each wood type foundry used its own numbering system, so a similar font from another foundry might be sold as Gothic 55 or Grotesk 101. Also some foundries used different names/numbers for different font sizes.<br>
      If I recall correctly, wood type foundries did not have the equivalent of the electrotyping process used by metal type foundries to precisely copy the typefaces of competitors. So exact copies of wood type would have been labor intensive and would cut into profits.<br>
      The only way you might be assured of an exact match is if the digital font designer  cites your foundry. I note that your source is at a museum in the UK, so I presume that this is a British foundry.<br>
      However, you might be in luck. The Mecanorma font <a href="http://www.myfonts.com/fonts/itfmecanorma/british-inserat/" rel="nofollow">British Inserat</a> is based on a British source and looks close for the letters BMAREK shown in your sample. Note that R lacks the the kick at the end of the leg.<br>
      Good luck with your project.<br>
      Don</p>
