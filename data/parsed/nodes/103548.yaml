      <p>Here's one where BMAREK more or less match your image letterforms and there is a range of weights. It's <a href="http://www.myfonts.com/fonts/flat-it/dharma-gothic/" rel="nofollow">Dharma Gothic</a> Your specimen seems to be between the ExtraBold and Heavy. Seems narrower than your specimen.<br>
      Here's one based on 1898 woodtype where BMARE more or less match your image letterforms but at a lighter weight: <a href="http://www.myfonts.com/fonts/hvdfonts/cheap-pine/" rel="nofollow">Cheap Pine</a>.  But K seems different. Same issues with <a href="http://www.myfonts.com/fonts/mti/industrial-gothic/" rel="nofollow">Industrial Gothic</a>.<br>
      Might be a closer digital font.<br>
      Also, as you perhaps already know, some people are recreating actual woodtype. Here's one that is close <a href="http://www.virginwoodtype.com/AWT%20Catalog/pages/Sans%20Serif%20Cond%20No%203_jpg.php" rel="nofollow">American Wood Type Mfg. Co. Catalog/Sans Serif Cond No 3</a>.<br>
      Don</p>
