    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: American Type&nbsp;Founders</strong></p>
    <p>American typefounding agglomeration formed in 1892, eventually containing most of the American typefounding industry. In the 1890s, sorting through the libraries that were merged in and deciding what to keep and what to get rid of was handled by <a href="/node/16054" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joseph W. Phinney</a>. <span class="caps">ATF</span>’s early success owed quite a bit to the technical genius of <a href="/node/16219" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linn Boyd Benton</a>, inventor of the pantographic engraver. Ultimately, <span class="caps">ATF</span> owned the rights to one of the world’s greatest libraries of original typefaces, with many of the <span class="caps">ATF</span>-era designs created by Linn Boyd Benton’s son, <a href="/node/13617" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Morris Fuller Benton</a>.</p>
    <p>Foundries that were incorporated into <span class="caps">ATF</span> include: <a href="/node/add/wiki?edit%5Btitle%5D=Barnhart%20Brothers%20and%20Spindler" title="Create node &quot;Barnhart Brothers and Spindler&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Barnhart Brothers <span class="amp">&amp;</span> Spindler</a> (1911); <a href="/node/add/wiki?edit%5Btitle%5D=Binny%20%26%20Ronaldson" title="Create node &quot;Binny &amp; Ronaldson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Binny <span class="amp">&amp;</span> Ronaldson</a> (1892); <a href="/node/add/wiki?edit%5Btitle%5D=Boston%20Type%20Foundry" title="Create node &quot;Boston Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Boston Type Foundry</a> (1892); <a href="/node/13553" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bruce Type Foundry</a> (1901); <a href="/node/add/wiki?edit%5Btitle%5D=Central%20Type%20Foundry" title="Create node &quot;Central Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Central Type Foundry</a> (1893); <a href="/node/17063" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Dickinson Type Foundry</a> (1892); <a href="/node/add/wiki?edit%5Btitle%5D=Farmer%2C%20Little%20%26%20Co." title="Create node &quot;Farmer, Little &amp; Co.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Farmer, Little <span class="amp">&amp;</span> Co.</a> (1892); <a href="/node/add/wiki?edit%5Btitle%5D=Inland%20Type%20Foundry" title="Create node &quot;Inland Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Inland Type Foundry</a> (1912).</p>
    <p>By the 1920s <span class="caps">ATF</span> was the dominant player in the world’s printing equipment market. Not just fonts, but entire printing plants were on offer. This strong position did not continue, due to the ever-changing nature of the printing industry. In 1934 <span class="caps">ATF</span> reorganized under bankruptcy protection, and never regained its former glory. The company failed to keep up in the phototype era, and failed completely in the digital&nbsp;era.</p>
    <p>Kingsley, a manufacturer of imprinting and marking equipment, acquired <span class="caps">ATF</span> in 1986, and the type division became <a href="/node/add/wiki?edit%5Btitle%5D=Kingsley/ATF%20Type%20Corporation" title="Create node &quot;Kingsley/ATF Type Corporation&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Kingsley/<span class="caps">ATF</span> Type Corporation</a>. The foundry closed in 1993 with an ingnominious backruptcy auction. These days the only sign of <span class="caps">ATF</span> fonts is in licensing deals with experienced digital foundries such as <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream</a> and <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a>.</p>
