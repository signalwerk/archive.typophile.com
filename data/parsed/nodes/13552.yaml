    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : American Type Founders</strong></p>
    <p>American typefounding agglomeration formed in 1892, eventually containing most of the American typefounding industry. In the 1890s, sorting through the libraries that were merged in and deciding what to keep and what to get rid of was handled by <a href="/wiki/Joseph%20W.%20Phinney" class="freelinking" rel="nofollow">Joseph W. Phinney</a>. ATF's early success owed quite a bit to the technical genius of <a href="/wiki/Linn%20Boyd%20Benton" class="freelinking" rel="nofollow">Linn Boyd Benton</a>, inventor of the pantographic engraver. Ultimately, ATF owned the rights to one of the world’s greatest libraries of original typefaces, with many of the ATF-era designs created by Linn Boyd Benton's son, <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a>.</p>
    <p>Foundries that were incorporated into ATF include: <a href="/wiki/Barnhart%20Brothers%20and%20Spindler" class="freelinking" rel="nofollow">Barnhart Brothers &amp; Spindler</a> (1911); <a href="/wiki/Binny%20%2526%20Ronaldson" class="freelinking" rel="nofollow">Binny &amp; Ronaldson</a> (1892); <a href="/wiki/Boston%20Type%20Foundry" class="freelinking" rel="nofollow">Boston Type Foundry</a> (1892); <a href="/wiki/Bruce%20Type%20Foundry" class="freelinking" rel="nofollow">Bruce Type Foundry</a> (1901); <a href="/wiki/Central%20Type%20Foundry" class="freelinking" rel="nofollow">Central Type Foundry</a> (1893); <a href="/wiki/Dickinson%20Type%20Foundry" class="freelinking" rel="nofollow">Dickinson Type Foundry</a> (1892); <a href="/wiki/Farmer%2C%20Little%20%2526%20Co." class="freelinking" rel="nofollow">Farmer, Little &amp; Co.</a> (1892); <a href="/wiki/Inland%20Type%20Foundry" class="freelinking" rel="nofollow">Inland Type Foundry</a> (1912).</p>
    <p>By the 1920s ATF was the dominant player in the world’s printing equipment market. Not just fonts, but entire printing plants were on offer. This strong position did not continue, due to the ever-changing nature of the printing industry. In 1934 ATF reorganized under bankruptcy protection, and never regained its former glory. The company failed to keep up in the phototype era, and failed completely in the digital era.</p>
    <p>Kingsley, a manufacturer of imprinting and marking equipment, acquired ATF in 1986, and the type division became <a href="/wiki/Kingsley/ATF%20Type%20Corporation" class="freelinking" rel="nofollow">Kingsley/ATF Type Corporation</a>. The foundry closed in 1993 with an ingnominious backruptcy auction. These days the only sign of ATF fonts is in licensing deals with experienced digital foundries such as <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a> and <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>.</p>
