    <p>Does anyone know if “one” is allowed to scale (proportionately, of course) barcodes? There might be regulations on this but I cannot seem to find any when I “googled” it. I am working on a DVD package and I would like to scale down the barcode (aka the UPC code) to fit better into the layout. I’ve often wondered this but have never asked.</p>
    <p>(this is the small box that has black lines, white bkgd, used for retail purposes)</p>
    <p>I am under a tight deadline and won’t be able to ask my client until tomorrow afternoon. And it would surely help to know tonight. Thanks!</p>
