      <p>I have seen on many packages the proportions of the UPC code rectangle changed. The height and scale of the bars does not seem to be relevant to a a proper read. Just don’t squoosh the numbers and it should turn out fine.</p>
      <p>Still, I would hope someone with more expertise can confirm or deny this.</p>
