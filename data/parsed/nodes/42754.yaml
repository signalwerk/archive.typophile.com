      <p>Interesting. I'm certainly not a top-flight designer, but generally have no problem getting the rates I quoted above, or only slightly less. I have heard of designers getting as much as $100/page. And as I said above, my page rate does include the jacket.</p>
      <p>Charles - yes, I did work with Mary M.</p>
      <p>One of the reasons I like book design is that there is a structure. There are editors for the editing (altho an eagle eye designer is always appreciated) and production managers to handle the printing. Schedules are *generally* reasonable. The scope of your job is clear, and the fee structure is also transparent. When I do work for other types of clients I often find myself having to pick up far more of their end than I want to. They don't always understand or appreciate exactly what I do. And furthermore they think they own you, that it's ok to call friday evening and expect something first thing monday, failing to grasp that you have other jobs, other commitments, and perhaps even a life. The art directors, editors and production managers I deal with in book publishing generally have the same investment in the project that I do - we all want to make the book the best it can be, but it isn't our "baby". Or, that is, we have a lot of babies and have to find time for all of them. Most of the time when I stray outside of book design I end up regretting it.</p>
