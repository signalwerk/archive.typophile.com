      <p><cite>Charles - are you working in Quark or InDesign? As I am sure you know, Quark lets you save your kerning tables for other jobs.</cite></p>
      <p>We now work in InDesign. Before 2007, we worked with our implementation of TeX, which let us have almost all the features of OpenType. The problem was dealing with color management, and it was almost unsurmountable. Too, both Larry Tseng &amp; I are getting on, as they say. Using TeX made us dependent on Larry, and our database fonts made us dependent on me.</p>
      <p>We now use only OpenType fonts. I have never gotten a font from a foundry I considered adequate for our work, at least not <cite>economically</cite> adequate. But I've said this before, just rehashing old news. Arno needs work with the punctuation, and the superscripts for note calls. Too, I have never liked Adobe's too-tight kerning. IMSLTHO, Arno needs other touches, like separate arithmetic operators (plus, minus, multiply, etc.) for lining versus old-style numbers. What comes with the font is a compromise in size &amp; height, not right for either figure style. Etc.</p>
