    html: <p>I just picked my copy of the Graphic Artists Guild book - it is so old (1997) that it discusses cutting up galleys and distinguishes between the "dummy" and the "mechanicals". Back in those days they estimated $8-25 per page for dummy; $15-40 for mechanicals, exclusive of jacket or design. Since these two processes have now folded into one, I'd be curious to see what this book recommends as a per page rate for illustrated books.</p>
