      <p>Let me confirm what charles_e says, but from the other side of the table. The press where I am design &amp; production manager is not located at a university, but we publish in that realm, and are active in the Association of American University Presses. Design fees for trade or scholarly books start a bit lower than the fee charged by the well-known designer Charles mentions and go to about that upper limit: design fee only, for which I get specifications and a Quark or InDesign file upon which the compositor can base its work. Shops I hire for trade or scholarly book composition charge pretty much what Charles notes. Most of those shops give us a per-page charge and a photo placement charge. Illustrated books are considered individually: a 4-c book throughout, with tint bleeds, might get a different fee than a duotone book with photos placed on white. &amp; jackets or covers are of course additional.</p>
      <p>The highest fees for museum catalogs I have heard come from one of the top-flight Manhattan designers of this sort of book. Six years ago, when I was trying to establish a fee for a freelance job, I had no idea what to charge. I consulted this pal, who told me a decent fee would be about $20 per page, to include design and composition; editorial alts to be extra. Knowing that my university press client would not pay that I came in at around $12 / page, plus air fare for two trips to the campus to work on photo sequencing and design. I felt like I was making huge bucks on that.</p>
      <p>The only time I see the sort of fees Patty cites are when I approach big-dog designers on special projects. They tell me the fee they’d charge for a corporate book, and then we negotiate down. The prices I get are still pretty stratospheric for my market, but we at times pay them for this kind of expertise.</p>
      <p>I don’t pay folks to deal with printers. That’s my job, and is dependent in large on relationships built over many years, relationships I cannot necessarily count on freelancers to have.</p>
      <p>powers</p>
