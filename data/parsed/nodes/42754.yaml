      <p>The jacket is inseparable from the design of the book's interior in my line of work. I realize that's not the case in other types of publishing. I found that it was easier to get a publisher to wrap their mind around a flat per page rate all in (and much less work for me) than if I broke it down too far. I can do that if they ask to but they don't. And it would come out more or less the same.</p>
      <p>Jackets can command more like $1500 from trade publishers. More if you are doing custom work - photoshop, commissioning illustration, hand lettering, etc.</p>
      <p>And yes, I work on books that often have images on every page, or several. Each page/spread requires individual attention.</p>
      <p>Charles - are you working in Quark or InDesign? As I am sure you know, Quark lets you save your kerning tables for other jobs.</p>
