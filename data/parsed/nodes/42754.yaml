      <p>Will,</p>
      <p>I'd point out one large difference; Patty is including the jacket with the charge for the interior. A jacket design would add at least another $800 to the book. The two are usually separate in university press publishing -- for example, I'll design an interior, but will not touch a jacket. There are people who will do both, but there are also people who prefer to do just jackets, or occasionally, like me, just interiors.</p>
      <p>If you sum the costs, say $800 for the jacket, $700 for the interior design, and $2,500 for comp, thats $4,000. If it is a 250-page book, that's $16 a page. That would cover about 20 images, text size B&amp;W. That is a little less than what Patty's talking about, but I imagine the art books she deals with have rather more image requirements.</p>
      <p>Ah well, back to taking apart &amp; re-doing Arno. It would add 4-6 hours for every job if I don't re-kern &amp; re-write the features. With Arno, it'll take a week, but after the first 10 books, we'll be money ahead.   </p>
      <p>Charles</p>
      <p>Edit:</p>
      <p>Will, good duotone work costs more than 4-c work. At least from us. Note I said "good."</p>
