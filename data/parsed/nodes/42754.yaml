    html: |-
      <p><cite>For a non-profit publisher or university press I’d probably charge the lower end of my scale - i.e. about $40/page (with the caveats above) for an illustrated book. For a non-illustrated book either around $20-25/page all in - plus extra for aa’s.</cite></p>
      <p>No university press I know of would pay that much, esp. for a non-illustrated book. Typical design fees for the interior of a university press book with a few illustrations range from $600 to $850 for a complicated text. This for a 6-1/8 x 9-1/4 trim, with anywhere from 500,000 to 1,500,000 characters. </p>
      <p>Composition is around $1.50/M characters, with a $0.50 per-page make-up fee. If you're setting a 2,800 character page, that would sum to around $4.75-$5.00 per page if the manuscript is supplied editorially correct on disk. We get a rather hefty penalty if there are fewer than 400,000 total characters. Placing illustrations with caption is around $2.50 each. Improving the usually terrible images is rather more. Alterations around $1.35 per occurrence (not line, that went out with repro). Paper proof sets extra. </p>
      <p>A rather well-known designer (whose book on design is often recommended on Typophile) has a minimum of $800 for a text interior -- that's design only, composition would be extra, but along the lines of the paragraph above.</p>
      <p>The jacket is on top of that.</p>
      <p>I guess things are far different in the commercial world; I've noticed students graduating from design school seem to expect a higher starting salary than I get now.</p>
      <p>An illustrated book can be far different, it depends on what is needed.</p>
      <p>I've been doing the composition bidding for my company since 1980. We use more or less the prices I've mentioned, and we are considered a little pricey. We only deal with university presses; I don't feel comfortable venturing guesses about commercial publishing. They do require faster schedules.</p>
      <p>I do know of museum catalogs going for $20,000 back in the late 1980s (just design &amp; layout), but you could count the number of people who got that kind of work with available fingers &amp; toes.</p>
