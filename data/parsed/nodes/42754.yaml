      <p>This is a great thread.  My background is mostly in magazine design, but since I started my own business 6 years ago. I have started to do more book projects.  Of all the work i do, it is the most interesting, but least lucritive part of my business.  The company I do most of my book work for produces some pretty nice, high-end, design, art &amp; architecure books.  But they have a take-it-or-leave-it price policy, that doesn't make any adjustments for complexity of the book that goes like this: $1000 for the cover; $800 for the dummy design that can include 8-10 spreads; and then $20 per page for production (and there are at least 2-3 rounds of edits that are included in that).  The rates haven't changed in at least 6 years. On some with little text, and large photos (they take care of all prepress and production) this doesn't work out TOO bad, but on others, they get so complex, and someetimes they have so many changes, that I end up making nothing. They will almost never pay more for extra work or complexity. Hence, i don't do that many projects for them any more, even though i would like to.</p>
      <p>Alll my other projects, i quote a rate.</p>
      <p>Since I do like doing books, I plan to actively look for new book projects this year. I really would like to have a better idea what other publishers pay.  Will have to do some math on Patty's numbers, because while it seems a lot lower that these guys pay, since it sounds like the cover and initial design stage are included in the page rate, maybe it's not quite as bad.</p>
      <p>Patty, your work l;ooks great, by the way.</p>
