      <p>My fee quoted above includes the cover design.</p>
      <p>I don't do a lot of non-illustrated books and those I do are usually for trade publishers, not university publishers. I have done art books for university presses (Yale and Princeton) and their fees are commensurate with what I quoted above. I do have one publisher client who pays a bit less - more like $30/page but their books have very little text, they are mostly picture/caption, so once you have the grid and sequence it goes very quickly. I do a lot of cookbooks, where the composition is far more involved than, say, a novel.</p>
      <p>It's much more common to use a per word rate than per character for text-only books. It can range from 3 to 7 cents a word depending on the publisher. I used to do a complicated x per page + y per picture + z per word type of formula but life is too short for that.</p>
      <p>I charge a fairly hefty fee for dealing with the printer basically because I hate doing that and would rather the publisher/client take care of it themselves.</p>
      <p>Charles's quotes seem low to me. Even 10 or 15 years ago you could get $5 or more per picture. But like I said, I find it easier to establish a page rate all in. Seems to work ok for me, as long as there is some flexibility on both ends.</p>
