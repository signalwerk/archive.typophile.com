      <p><cite>It’s much more common to use a per word rate than per character for text-only books. It can range from 3 to 7 cents a word depending on the publisher.</cite> </p>
      <p>Again, must be a difference between trade publishers and university presses. I've bid a lot of jobs, including long-term contracts prepared by the presses, and never seen a per-word quote. (We too work with Yale Press; but I'd guess Patty works with the Mary M side.)</p>
      <p>The reason image work costs rather more is that you can be asked to spend so much time on each one. If you are given a picture, told where to crop it, how big it should be, where to place it, etc., it doesn't take much time. That's the $2.50 price -- actually, the $2.50 is just to place it with the caption, we also charge a minimum of $5.00 more to deal with as an image.</p>
      <p>If you are given a picture and have to do that work yourself, the time can rise sharply. If you are asked to improve the image quality, the time can really rise. My partner does the best image work at our shop; and to fix a color image takes at least 1 hour, and that's just to correct the color balance &amp; enhance detail. Black &amp; white can take 20 minutes each. None of our customers will pay the costs of this work, it has to be "subsidized" by the text profit. &amp; BTW, our shop time is a bit higher than Patty's. When all is said &amp; done, if we have to scan the image, prepare it (includes "image enhancement") &amp; place it, our typical charge is about $15 for B&amp;W continuous tone, and $25 for color. That still doesn't quite cover all our costs, the text subsidizes the art. If there isn't much text, you (well, we) would have to charge more. But it doesn't sound like you are being asked to do that amount of work.</p>
      <p>And yes, dealing with a printer can be time consuming. Esp. if you do the color management work (and you'd better; the number of printers who do a good job of this is quite small). You can ask for their numbers, but about half the time what they give you is nonsense. Then, if you care, there needs to be a test &amp; you have to work out the numbers for them. If it's color job, work to their proof system; they can be expected to get their presses to match their proofer -- well, not all can at first, but it's a good starting place.</p>
      <p>etc.</p>
      <p>EDIT: I'm sorry, one of the reasons I got off on this &amp; gave such detail is that it points out there are different markets, different pricing structures, different rates, and different schedules. When you are starting to work in an area, a book dealing in generalities like the one referenced above, can be misleading. It all depends on a particular market.</p>
