      <p>In November, 2006 I asked that question of Typophile stalwart pattyfab, aka book designer Patricia Fabricant, who replied:</p>
      <p>For an illustrated book for a commercial publisher, I usually charge between $40 and $50 per page. That includes design, layouts, typesetting plus one round of revised, additional corrections at $50/hour. Does not include picture research, scanning, retouching art, or dealing with the printer.</p>
      <p>For a non-profit publisher or university press I’d probably charge the lower end of my scale - i.e. about $40/page (with the caveats above) for an illustrated book. For a non-illustrated book either around $20-25/page all in - plus extra for aa’s.</p>
    html_clean: |-
