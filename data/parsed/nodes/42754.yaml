    <p>I am new here and found this site when I was searching for an answer to my subject question</p>
    <p>I recently was asked to help with the design of a 100pg, 10X10, hardcover book.<br>
    All photos and what is going to be the text will be provided. I am only providing </p>
    <p>*cover design<br>
    *font<br>
    *all layout<br>
    *find book printer</p>
    <p>I am more of a graphics/branding guy so this is new for me. I do not want to turn it down because it could help me and the person who asked is a friend. This would be funded by a company and they want to make 1000 books.</p>
    <p>If anyone could help I would greatly appreciate it. Ask me questions as well if needed.</p>
    <p>Thanks</p>
