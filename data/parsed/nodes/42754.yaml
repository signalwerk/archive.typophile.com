      <p>&gt;&gt; I’d point out one large difference<br>
      It’s all a matter of how you parse it, Charles. There’s really no difference. We just calculate our costs differently. I don’t bring design &amp; composition costs for a jacket or cover into calculations of per-page costs for text design &amp; comp. That’s all.</p>
      <p>&gt;&gt; The jacket is inseparable from the design of the book’s interior in my line of work.<br>
      I entirely agree with that, and that is the way most of our books are treated. Again, I was relating some accounting practices.</p>
      <p>&gt;&gt; good duotone work costs more than 4-c work<br>
      I was only relating design costs as I have experienced them, Charles, not the work it takes to make duotones print well. Designers I work with will often give us a lower rate if they are doing a design that is only two colors, and does not involve a range of page tints and type colors. It does not mean that design of duotone books is not quite complex and even difficult; it just reflects what I’ve been charged. That’s all.</p>
      <p>&gt;&gt; I’m certainly not a top-flight designer<br>
      I’m not sure that’s true, Patty. I just looked at your www site. You get a lot of good work, work a lot of book designers would like to do, if only they had the skills to master those kinds of design. (I speak from very close personal experience here.)</p>
      <p>I also am very happy that I’ve restricted my work to book design. I have done other sorts of graphic design work (ad agency type director), and none gives me the satisfaction book work does.</p>
      <p>And many others feel the same way. There is no dearth of designers who want to concentrate on book work, despite its lower wages. &amp; some are very good. I have just recently met with several recent design school grads who wish to eschew the allure of flash and color and work with books. At times I have hired some, and gotten good work, but work that comes only with a good deal of mentoring.</p>
      <p>Justin: good luck with this project; have fun.</p>
      <p>powers</p>
