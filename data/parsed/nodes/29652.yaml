    <p>Heya,</p>
    <p>I’m working on setting a (vaguely) diplomatic edition of one of Christine de Pisan’s lesser known works. The scribe uses a pied de mouche to start off what can only loosely be called paragraphs, and then indents all text that comes after. I found this article:</p>
    <p><a href="http://typophile.com/node/17478">http://typophile.com/node/17478</a></p>
    <p>which sort of tackles what I’m going for, but I’m wondering if there’s a way to negatively indent the first line of a paragraph rather than indenting all following lines (which would be a pain because I used hard returns between every line to imitate the manuscript). I hope it’s something simple I’m just not getting.</p>
