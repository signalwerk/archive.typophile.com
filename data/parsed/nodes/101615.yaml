    <p>Hello!</p>
    <p>Last year I created the Magical Unicorn Typeface: A typeface, while flawed, still managed to capture the spirit of these noble animals in graphemes. However, it wasn't the end, a continuation of the Unicorn Typeface was a must.</p>
    <p><img>http://www.arthus.nl/pegacorn/pegacornABC.gif</p>
    <p>The Unicorn-Pegasus letters are an development of the Unicorn font. With the translation of the original drawings to the usable Unicorn font, many details disappeared and the hand-drawn character was lost. This series of initials is extremely detailed and compared to the Unicorn Font, no shapes have been cut. Each Unicorn-Pegasus is complete, from the tip of the horn to the far end of the tail. </p>
    <p>While the images might become available in the future (or become vectorized as a companion weight for the Magical Unicorn &amp; Unicorn Sans weights) I hope this approach towards type might open the discussion about the requirement of horns or hooves for better readability.</p>
    <p>More information and images can be found on: <a class="freelinking external" href="http://www.arthus.nl" rel="nofollow">my portfolio</a> or for more images on <a class="freelinking external" href="http://www.behance.net/gallery/Unicorn-Pegasus-Initials/7721763" rel="nofollow">Behance</a>.</p>
