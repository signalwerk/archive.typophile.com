      <p>&gt;&gt;<em>I still think the spacing is really awkward. The inspiration by vintage lettering can account for the poor letter shapes.</em></p>
      <p>It might be safe to guess that the 'rv' combination was not used in the cigar brand name. It's also possible that some of these letters are inventions to make up for gaps in the original lettering sample(s). Even with those excuses, I would say that the kerning of LHF fonts is not always what they seem to spend their time on. Maybe with display fonts it's assumed the graphic artist using them will 'tweak' the tracking as needed.</p>
      <p>- Mike Yanega</p>
