    html: |-
      <p>I am glad you like most of our fonts. But I really don't care if someone doesn't like a font. Please reread my response more carefully and you will see that I was referring to Mike Yenga's assertion:</p>
      <p><strong>"...that the kerning of LHF fonts is not always what they seem to spend their time on."</strong></p>
      <p>That is a different matter all together. I don't know how Mike knows what we spend our time on. But when I personally hand kern every single character with every other character, so that every single possible combination in the font has been covered -- that takes at least an entire day, in some cases even two. Furthermore, if Mike found a problem with the kerning of a font he purchased, I wish he would have given us a chance to make it right.</p>
      <p>That said, it is true that some fonts simply don't work. And I would agree that Labelle is one of those that has bothered me for some time now. The characters don't seem to work well together. But this has nothing to do with the kerning.</p>
      <p>The quality Letterhead Fonts offers is <strong>very</strong> important to me. I am removing Labelle from the site now (as I often do with fonts I feel aren't up to par). I will be happy to give any one who purchased LHF Labelle credit towards another font.</p>
      <p>--Chuck<br>
      Letterhead Fonts</p>
