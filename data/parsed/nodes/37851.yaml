      <p>Every single letter combination in each of our fonts is kerned by hand. The last font I kerned had over 9000 pairs. Kerning is most definitely something we spend time on.</p>
      <p>Furthermore, if there is a font that you purchased from us and you unhappy with it, we will fix it to your satisfaction. Customer service is also a big priority with us.</p>
      <p>The only way I can see that you could come to the conclusion you have is if you are using a program that doesn't display the kerning correctly, such as Word or Photoshop CS. That would explain your misunderstanding.</p>
      <p>--Chuck<br>
      Letterhead Fonts</p>
