      <p>&gt; <em>Every single letter combination in each of our fonts is kerned by hand. The last font I kerned had over 9000 pairs. Kerning is most definitely something we spend time on.</em></p>
      <p>On a general and somewhat related note – not to diminish the quality of Letterhead Fonts, because certain types of faces and especially scripts <em>do</em> require lots of kerning because of their very nature – the amount of kerning pairs is not automatically a reference for the quality of a typeface. One could argue that a font with an impressive amount of kerning pairs is a font that was poorly spaced to begin with. :^)</p>
      <p>This statement <em>isn't by any means related to Letterhead Fonts in particular,</em> just a general remark for educational purposes aimed at our new users.</p>
