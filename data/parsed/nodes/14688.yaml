    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 18.Aug.2005 2.36pm </div>
      <p>—<br>
    Anyone who hasn’t been to <a href="http://www.fontbureau.com/">The Font Bureau, Inc</a> recently might have missed their two newest additions, <a href="http://www.fontbureau.com/fonts/TruthFB">Truth FB</a> designed by David Berlow and <a href="http://www.fontbureau.com/fonts/Minah">Minha</a> designed by Jacqueline Sakwa. </p>
    <p>—<br>
    <strong>Truth</strong> was originally available only on Apple Computers and even then only in 1 weight under the name of Charcoal. Now that the handcuffs are off, David has taken the typeface on a little journey and added seven weights for us. The idea of using what was once a “computer font” for anything else is now being questioned and I personally look forward to how people will use it.</p>
    <p>—<br>
    <strong>Minah</strong> is a friendly, elegant, and feminine calligraphic sans with a small body and long limbs. While it is available in 4 weights, the details that make is so original are maintained throughout.</p>
