    <p>Hello, </p>
    <p>I was wondering if anyone knew the names of the flowers that are depicted in the supplemental ornament set of the poetica font family — specifically, the flowers associated with the letters f, g, h, i, and j. (these are the five characters that depict just a head of a blossom, no leaves). </p>
    <p>thanks !<br>
    -claudia</p>
