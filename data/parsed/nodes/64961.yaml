      <p>Lol thanks... The project is for my type class and my type professor is a self proclaimed type guru (she has the credentials to justify it). However the entire semester has been nothing other then critiques. which is informative but not as instructive as one would hope for. The whole purpose of this project was to design an invite based on the text provided. There is text for the invite itself as well as text for the rsvp card. The entire project needs to fit within standard size envelopes to reduce cost to the "client"as well as show typographic hierarchy. I came up with going for a playing card theme because i was in Vegas at the time for the LIA Judging session( like Cann but cooler because i work for them lol). Since I came up with that concept i have evolved from using the backs of the playing cards as my "visual" element, to using the glyphs on the cards, and finally landed on a black and white drawing of the king and queen of hearts (vectorized) that I'm quite happy about. The only thing now is taking by black and white "visual" element and using it to work with my text. I thought i could do it by keeping all the words compiled in a box like I've shown you but ill admit I've never attempted a composition like that before ( and never really taught about using a grid)</p>
      <p>hope this helps</p>
