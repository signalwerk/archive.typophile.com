    html: |-
      <p>Yeah, it still has a lot of problems, one being the pinball issue. I think you're still doing too much, with sizes and weights and overall composition. It just looks messy, and unless that's what you we're going for, you really have to change quite a lot. It still needs to be simplified a LOT. It's very difficult too pull off a composition that works in this way, so make your life easier and the piece better by doing less. This may sound odd and boring, but I feel it's the only way forward. As this is a piece of communication, you want it to communicate, clear and simple. </p>
      <p>I would start with an empty document, as working on the same document all the time can lead to a kind of blindness. Start afresh and start putting in one element at the time, starting with the most important parts. Try to get one element to the point that it looks and feels good, then start adding other elements. I would keep the secondary information simple in their design, without fancy type, size and weight changes. </p>
      <p>As for the typefaces, I would really advise you to pick a different combination, as these two don't work together. If you want to work with the lighter geometric typeface, I would put another geometric typeface next to it, like futura, avant garde, serif gothic. Or if you want to go for contrast I would advise you to work with Bodoni. If, on the other hand, you want to work with the Helvetica you've used, I would just make everything helvetica, so throw out the geometrical typeface. </p>
      <p>I hope this helps.</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
