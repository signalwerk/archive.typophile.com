      <p>I still feel it's not coherent enough and the composition as a whole is too patchy. I think there is a lack of real focus points in the design. It is not clear which information is the most important, and has to be read first. </p>
      <p>I think you've made it pretty hard for yourself working with different typefaces, weights, directions etc. It lacks focus and a clear idea in my opinion.</p>
      <p>What can be done to make this work? I think you have to make a pretty radical change. You are working with at least four different typefaces at the moment, which don't really work together IMO. They all have very different characteristics, so this makes it hard to create coherence. I would cut down the amount of typefaces to a maximum of two. Find two that complement each other, rather than bite eachother. You can still work with different weights, but I would try working with different weights from the same family. </p>
      <p>Now you've combined very light with very fat weights, this could be interesting, but looks messy and slightly arbitrary at the moment. You could give different weights to different kinds of information, but be more consistent, and try to find a balance between fat and light.</p>
      <p>To make your life a lot easier I would throw out the direction changes, it overcomplicates the design and is hard to read. Also, limit the amount of information on the strictly neccesary, I think there is too much going on right now. Find out which information has 1st priority, which 2nd, 3rd etc. and build you design up accordingly.</p>
      <p>Grids are nice things, but they only will help you find solutions, in helping you organise and balance your content. The hard work still has to be done by you though.</p>
      <p>Keep us informed on your progress. good luck!</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
