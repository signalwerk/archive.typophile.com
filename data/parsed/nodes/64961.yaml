      <p>@ Patricia</p>
      <p>It is not enough, that your work looks different from classical typography. The white rooms just look like rests. But they are very important. If your square would be a room, but not a plane, I would get a panic attack. Like Miro I am also amateur.</p>
      <p><cite>But I’m not 100% sure if that’s correct.</cite></p>
      <p>This means, that you were not able to exclude, that it is correct?</p>
      <p>@ Evan</p>
      <p><cite>Grids are like rules.. and rules are meant to be broken. But you have to know the rules before you can break them.</cite></p>
      <p>Rules are meant to be followed. If they would be meant to be broken, the break would belong to the rules and resistance would be an illusion. The resistance is part of one or more other rules. Everything follows rules. As harder the amount and the core of rules are to define, as easier they can be confused with chaos. Chaos is the chorus of all rules. If you are in unison with the chaos, the chaos permits you to recognize and emphasize one or more rules. The order condenses in the selection of rules. Not tooooooo bad for two hours of sleep.</p>
