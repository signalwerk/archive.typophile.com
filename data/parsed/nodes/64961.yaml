    html: |-
      <p>I think my biggest criticism is still your lack of grid.</p>
      <p>Start with a document that is something like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/gridexample_3653.gif"></div><p></p>
      <p>Then use it! Check out <a href="http://www.aisleone.net/2009/design/myths-misconceptions-about-grid-systems/" target="_blank" rel="nofollow">this article on grids</a> and spend a little time on <a href="http://www.thegridsystem.org/" target="_blank" rel="nofollow">this website</a>.</p>
      <p>A poster that uses type somewhat similarly can be seen <a href="http://www.singstatistics.co.uk/" target="_blank" rel="nofollow">here</a>.</p>
      <p>Make invisible boxes that fit together with even spacing for all your words and use things like tracking and size (and condensed or bold or extended fonts) to fill those boxes. Not exactly like the image below, but you kind of get the idea..<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/grid2_6591.gif"></div><p></p>
      <p>Don't be afraid to break your grid! That is a great way to create interest or focal point.</p>
      <p>Oh, and if your instructors have not taught you about grids, be sure to ask for it! Grids are like rules.. and rules are meant to be broken. But you have to <em>know</em> the rules before you can break them.</p>
      <p>I hope that is helpful!</p>
      <p>evan</p>
      <p><a class="freelinking external" href="http://www.evanmade.com" rel="nofollow">http://www.evanmade.com</a></p>
    html_clean: |-
