  html: |-
    <p>Hi everyone,</p>
    <p>I’m looking for typefaces with a similar feel to Virus fonts <a class="freelinking-external" href="http://virusfonts.com/spec%20sheets/tourette.html">“tourette”</a>.  Namely, typefaces that use long, thin lines with a sort of ornate or disturbing quality.  I’m quite confident I’m going to have to create a custom font for this project but I could use some inspiration!</p>
    <p>Thanks!</p>
