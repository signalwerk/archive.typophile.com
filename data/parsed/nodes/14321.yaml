    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">How-To</a>&nbsp;: How to Construct Obliques from Upright&nbsp;Letterforms</strong></p>
    <p>The following instructions were kindly provided by <a href="/node/13682" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">David Berlow</a>:</p>
    <p>Aside from the argument of terms, and what is <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Italic</a>, if you are making a sloping style to compliment a non-sloping style, here is the general start to a <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> design.<br>
    All ascents and descents, <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-heights</a>, <a href="/node/20273" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">cap heights</a> and figure heights stay the same. (that’s the good news).<br>
    The widths are between 92% and 96% of the non-sloping style, the main stems are 94% to 98% of the non-sloping style. The actual percentages you choose are ball-parked by the overall width and weight of the source, but depend ultimately on the eyes in your head. The reason for this is that the sloping of a style makes it wider, and heavier to the eye, and you need to fix that first, before you even&nbsp;slope. </p>
    <p>After you do, (8-11 degrees according to taste, size of use, and speed of traffic, you have lots of curves and diagonals to correct:<br>
    Curves between 4 and 5 o’clock and 10 and 11, you need to push out, between 1 and 2 o’clock, and 7 and 8 o’clock. pull in.<br>
    The diagonals fall into two disturbed groups as well. The ones that, in house framing, would have stopped the slope from happening, need to be thinned, those that helped push it over need to be thickened.<br>
    Then, you have to choose whether you’re going to put all the points on extrema, and if so, you have to re-digitize, or if you use the green gem in <span class="caps">FL</span> to fix it up for ya, you’ll want to make a copy to the mask beforehand, so you can see where that tool fails.<br>
    Spacing should be about the same as the non-sloping style and you should be ready to&nbsp;proof…</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/13743">Tips for Constructing True Italics</a><br><a href="http://typophile.com/node/27520">The Importance of an&nbsp;Oblique</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.marksimonson.com/article/128/fake-vs-true-italics">Fake vs. True Italics</a> by <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a><br><a href="http://typographica.org/001029.php">Ain’t What <span class="caps">ITC</span> Used to Be</a> at <a href="/node/12035" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographica</a></p>
