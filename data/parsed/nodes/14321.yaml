    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/How-To" class="freelinking" rel="nofollow">How-To</a> : How to Construct Obliques from Upright Letterforms</strong></p>
    <p>The following instructions were kindly provided by <a href="/wiki/David%20Berlow" class="freelinking" rel="nofollow">David Berlow</a>:</p>
    <p>Aside from the argument of terms, and what is <a href="/wiki/Italic" class="freelinking" rel="nofollow">Italic</a>, if you are making a sloping style to compliment a non-sloping style, here is the general start to a <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> design.<br>
    All ascents and descents, <a href="/wiki/x-height" class="freelinking" rel="nofollow">x-heights</a>, <a href="/wiki/cap%20height" class="freelinking" rel="nofollow">cap heights</a> and figure heights stay the same. (that’s the good news).<br>
    The widths are between 92% and 96% of the non-sloping style, the main stems are 94% to 98% of the non-sloping style. The actual percentages you choose are ball-parked by the overall width and weight of the source, but depend ultimately on the eyes in your head. The reason for this is that the sloping of a style makes it wider, and heavier to the eye, and you need to fix that first, before you even slope. </p>
    <p>After you do, (8-11 degrees according to taste, size of use, and speed of traffic, you have lots of curves and diagonals to correct:<br>
    Curves between 4 and 5 o’clock and 10 and 11, you need to push out, between 1 and 2 o’clock, and 7 and 8 o’clock. pull in.<br>
    The diagonals fall into two disturbed groups as well. The ones that, in house framing, would have stopped the slope from happening, need to be thinned, those that helped push it over need to be thickened.<br>
    Then, you have to choose whether you’re going to put all the points on extrema, and if so, you have to re-digitize, or if you use the green gem in FL to fix it up for ya, you’ll want to make a copy to the mask beforehand, so you can see where that tool fails.<br>
    Spacing should be about the same as the non-sloping style and you should be ready to proof…</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/13743" rel="nofollow">Tips for Constructing True Italics</a><br>
    <a href="http://typophile.com/node/27520" rel="nofollow">The Importance of an Oblique</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://www.marksimonson.com/article/128/fake-vs-true-italics" rel="nofollow">Fake vs. True Italics</a> by <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a><br>
    <a href="http://typographica.org/001029.php" rel="nofollow">Ain't What ITC Used to Be</a> at <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a></p>
