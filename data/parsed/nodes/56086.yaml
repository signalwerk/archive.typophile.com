  html: |-
    <p>I recently purchased a few weights of Mark Jamra's Expo Serif:</p>
    <p><a href="http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09" title="http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09">http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09</a></p>
    <p>Not only am I exceedingly impressed with this font family, or rather, full type system, but I also received a lovely letterpress broadside in the mail. </p>
    <p>All in all it was an excellent customer experience. Among other things, I had a question and it was answered promptly by Mr. Jamra himself. Their prices are quite reasonable, too.</p>
    <p>Cheers,</p>
    <p>Christian.</p>
