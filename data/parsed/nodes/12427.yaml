    html: <p>The D/speech bubble is a good concept; but right now it needs work to be obvious. I think it needs more weight to stand on its own. Also, the way that the speech arrow flows into the D seems awkward. I think this element needs to stand out a little more. Maybe you could try shifting it a little farther up on the stem of the D.</p>
