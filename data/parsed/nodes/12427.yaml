    html: <p>Que? erm yes well eh heh. of course it will be much smaller, and i will have to work out at which point sizes it will most legible etc etc. my main concern at this point is whether it is viable,whether the typeface of the logo symbol is not putridly horribly distorted beyond all recognition, and whether the concept is a go. from then on i can work out the rest in detail (thismayseem like a backwards way of going about things, but, hey.) as for usage, it will be appearing on all manner of material, from web to print. my initial thoughts are that the 'd'/speech bubble should eventually be able to work on its own, without the supporting type...</p>
