  html: |-
    <p>I offer this challenge one more time: Strictly from memory, list the real name or usernames of three of this site’s admins. </p>
    <p>Now write a couple of sentences documenting the personal background or merely the administrative approach of one admin. Do you know anything about them?</p>
    <p>Next, explain exactly how one would contact <em>any</em> admin or <em>a specific</em> admin. I mean exactly.</p>
    <p>Admins need to be listed by full name and username, with a way to contact them. When one merely wishes to contact any admin, that has to be possible too.</p>
