    html: |-
      <p>When offering my services as an Admin, I was explicit that I have no interest in being a Moderator. </p>
      <p>I have no problem with being a janitor and cleaning up the trash as I go along, but I am quite frankly not interested in fielding a barrage of messages from all and sundry. </p>
      <p>If greater visibility becomes a requirement, then I will likely rethink my service.  </p>
      <p>I thought the short-lived flag feature was promising. I look forward to its reinstatement.</p>
