    html: |-
      <p>Consider the medium, and the client.<br>
      Choose a version which you have seen in a particular medium, and liked (performance varies by medium), and one which has a suitable tone for your project—there are some which are bookish, others which are more corporate, still others which are more suitable for retail.</p>
      <p>Bear in mind that not all Garamonds have Garamond in the name, e.g. Sabon, Verdigris.</p>
