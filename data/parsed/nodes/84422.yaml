      <p>If the company's brand uses "Garamond" without being more specific, and you have all those variants at your disposal, this can only mean one thing — playtime!</p>
      <p>When setting a headline or text, pit several variants against one another, tweaking each according to its needs to try and make it the best looking. For heads, play with kerning and tracking, for text, h&amp;j's.</p>
      <p>You might even consider mixing them up in the same document.</p>
