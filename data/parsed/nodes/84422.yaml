    html: |-
      <p>For which purpose and which printing condition?</p>
      <p>Garamonde Premiere Pro from Adobe is the most extensive Garamond interpretation and close to the original. Its outlines have subtitles that are best fit for good printing conditions. For general office use Adobe Garamond Pro might be the better choice, if you don't need opticals (versions for small text and big headlines) or italic small caps. </p>
      <p>However, if you print in a language with diacritical marks, then you might check if those characters collide with a previous lowercase /f/ of the two Adobe Garamonds and use a different version of Garamond. In that case I would advise you to resort to Sabon or to Stempel Garamond. A free version of Stempel Garamond, which has some flaws however, can be found on <a class="freelinking external" href="http://www.garamond.org" rel="nofollow">garamond.org</a>, which is an updated version of the original – and older version – in the <a class="freelinking external" href="http://www.artifex.com/downloads/" rel="nofollow">URW font package: Garamond Nr.8</a></p>
      <p>Monotype Garamond and the pre-packed Garamond on Windows and Mac are actually “mistitled”, they are no Garamond, they are designed by Jannon, a historical confusion.</p>
    html_clean: |-
