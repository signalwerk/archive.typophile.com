      <p>Hi Eric</p>
      <p>- what Peter Larson said.</p>
      <p>And a shameless plug for <a>more background reference</a> should you need it.</p>
      <p>From the resources you say you have at your disposal, try to avoid the ITC Garamond (also Apple Garamond if you have it); they are both artificially condensed and look weird on the line. I have never used the Simoncini, so wouldn't comment, but the Garamond Three is a Linotype digitisation of the the old ATF Garamond, which, like the Monotype Garamond (as Peter says) is a historical misattribution. That leaves Garamond Premiere Pro and Adobe Garamond Pro, both of which will serve you well in a variety of weights, styles, sizes and applications.</p>
      <p>There is also <a>LP Old Claude</a> for when you get bored...</p>
