    html: <p>I was always surprised how well ITC Garamond worked for the small text in the MacWarehouse catalog (that would be in the early '90s), as in my prior experience with it as phototype it usually fell apart in small text, due to the limitations of that process, which were overcome by direct-to-plate laser imaging. With digital, it was suddenly like the printed offset image had the detail that was previously only visible in an RC (resin coated) proof.</p>
