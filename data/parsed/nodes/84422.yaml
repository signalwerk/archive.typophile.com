      <p><em>…try to avoid the ITC Garamond…</em></p>
      <p>ITC Garamond is a brilliant Postmodern interpretation.<br>
      It has more pizzazz than the sober Adobe Garamonds, and may be just what you need.<br>
      The condensed styles are a tour-de-force, so unusual for a garalde.<br>
      As I said, try it and make up your own mind.</p>
      <p>The Condensed is <strong>not</strong> artificial, as can be seen by scaling it horizontally to the same width as the normal:</p><div class="imageWrap"><img src="http://typophile.com/files/Ss_6017.png"></div><p></p>
