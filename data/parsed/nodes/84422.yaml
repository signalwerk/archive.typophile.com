      <p>Primarily for publications such as brochures and newsletters. In addition to that it will be used for larger pieces such as banners and signage. The print conditions will be good. Never on newsprint or anything like that. I started a new job recently and my company uses Garamond in it's branding.</p>
      <p>I have multiple versions on my computer which is why I am confused. I want to make sure I am using the best version. I have Simoncini Garamond, Garamond Premiere Pro, Adobe Garamond Pro, ITC Garamond, Garamond, and GaramondThree. That is a lot of versions. And I didn't even know that it was released under other names too. That gives me even more to chose from. Good to know though.</p>
      <p>Thanks for the advice Nick. I will read online and see if I can find out more about each one and that will help me chose the right version for the job.</p>
