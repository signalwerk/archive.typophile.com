    <p>Hello,<br>
    To most, this question might be incredibly basic.<br>
    First, I'm using Fontographer (ie: no [open type] features window)<br>
    Second, I've created all my glyphs that I want to program actions to, so this is my last step.<br>
    I've tried accessing and modifying features from existing fonts in a demo version of FontLab but it never properly outputs my font with the same "OpenType font cannot be generated due to an error in feature-definition file." But the .fea I've tried in the past was taken straight from Adobe Garamond Pro (not that I would have published someone else's feature code, just a test) — same result.</p>
    <p>Its a fair amount of features I'd like available in the font I've created: some case sensitive punctuation, numerals, small caps, &amp; ligatures.</p>
    <p>What options do I have to learn more about this to just punch it out. Seems like basic language but its just not going through. This isn't something I haven't done a bit of research on initially: I'm posting now to get some more in-depth answers.</p>
    <p>Thanks so much in advance everyone.</p>
