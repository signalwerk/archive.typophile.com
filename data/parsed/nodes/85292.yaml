    html: |-
      <p>Feature code is compiled when an OTF is created, so the code you're seeing for Arno Pro has been decompiled by FontLab-- probably not the best model from which to learn. The FreeFontPro VFB that comes with FontLab would make for a better practical example.</p>
      <p>Names preceded by '@' are classes, which can be defined in FontLab's Classes panel, or by declaring them in the lower part of the OpenType panel.</p>
    html_clean: |-
