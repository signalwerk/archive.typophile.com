      <p>"I'm fail to see how generating fonts with empty characters just to make bad code compile is better than refusing to compile the bad code in the first place."<br>
      1. I made a Roman font, ca 1500 glyphs with a lot of OT features (all mine from a to z)<br>
      2. I made a Bold font with the same glyph coverage but f_f ligature (by accident)<br>
      3. I merged the .fea file from my Roman<br>
      4. My new Bold has one empty slot named "f_f" so I am able to fill it and receive good, fully working font.<br>
      I think that makes more sense than receiving error, after all my code is <strong>good.</strong><br>
      (I wish FF send a warning in that case)</p>
