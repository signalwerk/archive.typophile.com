    html: |-
      <p>"onum1" by "onum2" </p>
      <p>is recognized because of class declarations where "onum1" might be the default figures and onum2 wold be the oldstle figures.</p>
      <p>Your feature code would use the @ sign to indicate a class, as in: sub @onum1 by @onum2;</p>
      <p>The names you input for classes as you design the font are most often swapped out by the software as it outputs your OTF file. To test this,  design a font with odd class names and then output it as an otf.  Then open the otf inFontLab and look at the OT code.  You will see that your class names have been mapped to other ones.</p>
