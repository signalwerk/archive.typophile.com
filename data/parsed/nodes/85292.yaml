    html: |-
      <p>Don't start with OpenType features by using a big feature file ripped from a complex font. Make your own feature file, adding features and relevant classes one at a time, testing each one as you go. But if you generate test fonts directly into the Adobe application fonts folder it's a pretty quick process.</p>
      <p>Also, Adobe has provided some great documentation in the form of the <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">OpenType Feature File Specification.</a></p>
      <p><cite>FF generates necessary (empty) slots so there are no problems with missing glyphs.</cite></p>
      <p>I'm fail to see how generating fonts with empty characters just to make bad code compile is better than refusing to compile the bad code in the first place.</p>
    html_clean: |-
