    html: |-
      <p>I've never been quite sure what typeface they used for the kind of soup, if it was a typeface. It may have been custom or hand-lettered, even though it's very plain. I sometimes imagine there was an old guy at Campbell's whose job it was to design and letter the cans. He'd been there forever. They couldn't let him go, he was like family. Finally, some time in the Seventies, he retired or died, and they started using type on the cans. Or something like that.</p>
      <p>For "TOMATO" <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/itc_mixage_2/?sample_text=TOMATO&amp;sample_size=36" rel="nofollow">ITC Mixage</a> is very close if you condense it a bit. (It's condensed soup, so it's okay.)</p>
      <p>Both "Campbell's" and "SOUP" go way back to when labels were mostly drawn by hand. You won't find fonts that match exactly.</p>
