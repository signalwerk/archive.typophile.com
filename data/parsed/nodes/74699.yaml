    <p>Hi Everyone,</p>
    <p>I'm brand new to typography and just starting my first typography 1 course; one of our assignments is to find print examples of typefaces from a list composed by my instructor. I've found nearly all of them (14/18) but I'm having trouble finding these last 4. I just  bought the latest editions of In Style, Details, Cosmopolitan, and Glamour to try and find adverts with these typefaces but I'm not really having any luck training my eye up. I've spent the last two days combing through newspaper adverts, yellow pages adverts, and these magazines and it hasn't jumped out at me. So here are the typefaces I'm looking for:</p>
    <p>Optima<br>
    DIN<br>
    Times New Roman<br>
    Bembo</p>
    <p>and I could do with a better example of Eurostile but it isn't necessary... Thanks to anyone that could help me out.</p>
