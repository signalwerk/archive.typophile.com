    html: |-
      <p>You could purchase FontLab, and after a fairly steep learning curve, produce professional quality fonts.<br>
      For simple fonts there is an online program called FontStrut <a href="http://fontstruct.com/">http://fontstruct.com/</a><br>
      For a free program that can produce good quality fonts you might consider FontForge. You might start by reading the wiki article about the program <a href="http://en.wikipedia.org/wiki/FontForge">http://en.wikipedia.org/wiki/FontForge</a><br>
      If you are familiar with Adobe Illustrator, it can be used to design fonts.<br>
      Don</p>
