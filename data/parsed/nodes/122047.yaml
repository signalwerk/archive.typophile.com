    <p>Hello All,</p>
    <p>I am looking for a free small x-height serif font that has the minimum printing space usage characteristics of Linden Hill but is a regular serif and not a slab serif.</p>
    <p>I would also like to know if it  is possible to design fonts using a computer instead of manually drawing  them on a drawing board. If it is, what are some good application programs to use to design fonts.</p>
    <p>Thanks for any feedback you can provide.</p>
    <p>Jim Williams</p>
