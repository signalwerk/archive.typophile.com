      <p>Azlah, nice.</p>
      <p>&gt; The 2 words transaltes to : Happy Feast Day</p>
      <p>Plus they sound very close: “3eed sa3eed”. BTW, that “3” is actually a funky way to transcribe the Arabic letter ’ain - it looks like it, just h-flipped!</p>
      <p>This sort of alliteration is easy in Arabic since all words are based on three-consonant roots, and these roots are conjugated (?) to form related meanings.</p>
      <p>BTW, I was pleased to see a nice new mosque (dubbed the “Blue Mosque”, I think) in Yerevan during my recent trip there - here are some photos:</p>
      <p>The facade on the street:<br>
      </p><div class="imageWrap"><img src="/files/YRVNmosque1_3493.jpg"></div><p></p>
      <p>Detail of the facade:<br>
      </p><div class="imageWrap"><img src="/files/YRVNmosque2_6545.jpg"></div><p></p>
      <p>The mosque:<br>
      </p><div class="imageWrap"><img src="/files/YRVNmosque3_5593.jpg"></div><p></p>
      <p>Detail from the mosque:<br>
      </p><div class="imageWrap"><img src="/files/YRVNmosque4_5700.jpg"></div><p></p>
      <p>hhp</p>
