    <p>Hello Typophiles,<br>
    From the beginning till the end of the current Lunar month, Muslims are allowed to eat and drink ONLY before dawn and after sunset. One day is left to celebrate the end of this fasting month and the beginning of a new  Lunar month. This day is widely Known as 3idilfitri during which Muslims exchange visits, SMS, postcards and emails congratulating one another.<br>
    <a href="http://en.wikipedia.org/wiki/Hari_Raya_Aidilfitri" title="http://en.wikipedia.org/wiki/Hari_Raya_Aidilfitri">http://en.wikipedia.org/wiki/Hari_Raya_Aidilfitri</a></p>
    <p>So far, I have received hundreds of postcards out of which I have selected this one for its Outstanding Arabic Calligraphy and more importantly because it has just been designed by a new Typofile <a href="http://typophile.com/user/15002">Fan</a> who seems to be too shy to share.<br>
    </p><div class="imageWrap"><img src="/files/3idFitr_5409.gif"></div><br>
    Non-Muslim Typophiles may also send this postcard to their Muslim friends who will definitely extend their sentiments to you with a Very Merry Christmas and a Happy New Year.<p></p>
    <p>Peace with <a href="http://www.crAUSwords.com/flowers/WFlowers.htm">Flowers</a></p>
