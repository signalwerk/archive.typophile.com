    html: <p>Jeremy Tankard's <a class="freelinking external" href="http://typography.net/fontfamilies/view/28" rel="nofollow">Bliss</a> but you'll need to customized it to recreate 'edexcel' lettering (squooshing, reducing /d ascender and reworking /c terminals to fit /e outline shape)</p>
