    html: <p>Another good book that I've found somewhat helpful <br> is <i> The Art of Hand Lettering</i> by Helm Wotzkow. The hand  <br>lettering part isn't too relevant these days, but it <br> covers the basics of good spacing, proportion, etc. <br> <br>It's relatively easy to find at used book  shops and  <br>it's usually under $5.</p>
