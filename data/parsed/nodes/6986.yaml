    html: <p>i am not very sure about this, but afaik, these  <br>terms come from the old type "cases". <br> <br>when using metal type, each character is  <br>constructed as a little piece of... metal. to  <br>organize these pieces, typesetters use a wooden  <br>box, divided in several "cases", each case  <br>corresponding to a specific character. <br> <br>the uppercase characters are saved in the upper  <br>cases of the box, and the lowercase in the lower  <br>cases. simple as that. <br> <br>i don</p>
