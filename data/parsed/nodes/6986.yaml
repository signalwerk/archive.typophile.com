    html: <p>Gerald, of course, knows well of which he speaks.  <br> <br>If you would like a visual and/or documentation to back you up, get ahold of a copy of <i>A Short History of the Printed Word</i> by Warren Chappell. There is an illustration and a concise description of the cases in Chapter III (pp. 52-53 in the first edition).  <br> <br>You should be able to find a copy at any decent library. <br> <br>This book was also recently reprinted and updated, published by Hartley &amp; Marks, with the additions provided by Robert Bringhurst, if I recall correctly. I presume that they reproduced the original illustrations. <br> <br>-- Kent. <br></p>
