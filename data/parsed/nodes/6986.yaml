  html: <p>Hi everyone, I am a graphic design student and for part of my assignment I need to explain the terms uppercase and lower case and their origins. If anyone knows of a good resource site I can research I would be delighted. So far I have run web searches but I can never seem to find any relevant information. Your help would be much appreciated.</p>
