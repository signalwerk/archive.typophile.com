    html: <p>Paul would be right about this. Early on, the majuscule was kept in one case (drawer), the minuscule in another. But at the top of the cabinet (of drawers) were a set of slanted banks. This is where the compositor would put the cases when setting type. The top one was for the majuscule (uppercase) and the bottom for the minuscule (lowercase). Later on, combinations such as the California job case or the Yanbkee job case incorporated both the majuscule and minuscule into one case. <br> <br>But the case itself is divided into sorts. The phrase "out of sorts" is said by some to derive from the situation of running out of a particular character. Sorts are also know as additional runs of a certain character. You might order, for instance, a six-inch line of lowercase e sorts to replensish your stock.</p>
    html_clean: <p>Paul would be right about this. Early on, the majuscule was kept in one case (drawer), the minuscule in another. But at the top of the cabinet (of drawers) were a set of slanted banks. This is where the compositor would put the cases when setting type. The top one was for the majuscule (uppercase) and the bottom for the minuscule (lowercase). Later on, combinations such as the California job case or the Yanbkee job case incorporated both the majuscule and minuscule into one case. <br> <br>But the case itself is divided into sorts. The phrase "out of sorts" is said by some to derive from the situation of running out of a particular character. Sorts are also know as additional runs of a certain character. You might order, for instance, a six-inch line of lowercase e sorts to replensish your stock.</p>
