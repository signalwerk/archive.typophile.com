      <p>thank you for your reply Chris. I probably haven't made myself clear enough. I'm new to these forums. When I said 'experimental work' I guess I was referring to for example the works of Sandberg, Peter Willberg and more recently the alphabet created by Mathias Schweizer.</p>
      <p>I have done an extensive amount of research not only about space in typographic design but i have also tried to compare it to use of space in fine art such as Matisse's paper cut outs, installations by Rachel Whiteread, type design 'miniscule' by Thomas Hount-Marchard etc.</p>
      <p>To my way of thinking, space is the core quintessential of typographic letterforms and typographic design. My aim is to visually express my statement.</p>
      <p>So far I have broken down some existing fonts such as Bebmo &amp; Gill and created a typology of that font.</p>
