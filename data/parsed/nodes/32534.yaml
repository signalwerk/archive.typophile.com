      <p>Ana,<br>
      Space is an equal and integral partner in both typeface design and page layout of typography. The two forces of positive and negative require each-other to exist. I am not sure what is meant by experimental work since all work has some degree of it. Gui Bonsieppe of the Ulm School (Hocheschool Fur Gestaltung, Ulm), published an article in about 1958 in the Ulm Journal about the use of space in layout and how it improves comprehension. I wish I could find my copy for you! There have been numerous experimental movements in typography from DaDa, Bauhaus, Russian Constructivists, Swiss Modernists, and many more contemporary ones that have pushed the space and interaction threshold.<br>
      Is there some specific notion you are looking at?</p>
      <p>ChrisL</p>
