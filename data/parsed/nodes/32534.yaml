    html: <p>Letterforms on a printed page can only be comprehended in conjunction with the unprinted areas (on the same page) as they activate and regulate light. The objective was to analyse how familiar are we with the structure of these letterforms if they are not in their usual form ie. cut up. I was also intrigued to find out not only how a person will construct a letterform but also where it will be placed on A4 page. This was a very simple experiment, you might think even childish, but  it was very interesting to see how designers react when asked to put a letterform together. Some were nervous because they struggled with what looks like a simple task, some took a long time and some appeared frustrated with themselves.</p>
