      <p>" I shall attempt to expose the significance of the space in typographic design, starting from exploring form &amp; counterform, then moving onto figure and ground, foreground and background and finally object and environment."</p>
      <p>This is great, and I wish you well. I also would like to point out that type made for reading, has three distinct "grounds." Wheather one considers white space inside or outside of the letter, "ground" is clearly one thing, Among the forms, on the other hand, I consider those that repeat with any sort of frequency, like the main stems of H, E, L and P for example, as a secondary background against which the unique forms play. It is the unique forms then, like bottom of j or bar of H that are what we read with, and by the way design with. </p>
      <p>Cheers!</p>
