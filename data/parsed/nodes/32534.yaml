      <p>Kris, </p>
      <p>Noordzij's history is not really correct, or at least is misleading. Hebrew and I believe other semitic languages had word spacing all along--you can see it in the Dead Sea Scrolls and even more ancient stuff. The Irish were re-introducing word spacing, not inventing it. Apparently with vowels--which Greek and Latin used and Hebrew did not--it is more possible to read without word spacing. </p>
      <p>I got into a discussion via e-mail with Peter Enneson and Gerrit Noordzij about this, and ended up quoting to them the rules from the Talmud--well before the 9th century--specifying precisely how much to space words and letters.</p>
      <p>So the Irish monks were re-introducing word spaces, and I would think were probably aware of Hebrew, Syriac, etc, which used them. </p>
      <p>That being said, the reintroduction was, as Noordzij says, a big deal. I recently saw the exhibition of early Bible manuscripts here at the Smithsonian museum, and it was thrilling to see the great jump in readability of the Carolingan minscule--in the hand of Alcuin himself!--and the introduction of word spaces by those Irish monks. </p>
      <p>Ana, when you cut up the letters and re-arrange parts you are destroying the 'notan' that is there (strongly) in Bodoni. </p>
      <p>Mark, you're right. Sorry for my sloppiness, I didn't check carefully.</p>
