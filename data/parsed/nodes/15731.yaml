      <p>It looks like Berthold is set up to help you with this. See <a href="http://www.bertholdtypes.com/purchase/licensing.html">http://www.bertholdtypes.com/purchase/licensing.html</a></p>
      <p>Per Font Corporate licenses…</p>
      <p>One Site  US $3,750.00 / EUR 3.750,00 per font style<br>
      One Country  US $5,000.00 / EUR 5.000,00 per font style<br>
      Worldwide  US $7,500.00 / EUR 7.500,00 per font style </p>
      <p>They also suggest contacting them directly for custom licenses. </p>
      <p>I’m pretty sure the current Linotype license does not allow renaming (as this dilutes trademark protection) and I’d guess Berthold has a similar position. Any name change would need to be negotiated with the IP’s owner - eg “Helvetica Neue for Company X” might be allowed.</p>
      <p>Hope this helps. Si</p>
