      <p>If you buy from Linotype directly, or from FontShop, you can’t modify the font without special permission:</p>
      <p>“2.4 Modifying the Font Software is prohibited, even in the event that it is necessary for fulfilling personal design requirements. If the licensee wants to make modifications, consent and permission has to be obtained from Linotype Library GmbH. Non-compliance with this provision voids any and all support rights and warranties granted by Linotype Library GmbH and represents a violation and breach of this license agreement.<br>
      Furthermore, if the licensee or a third party or parties effect modifications to the Font Software despite the prohibition against such modifications, Linotype Library GmbH becomes the owner of that modified data.<br>
      Specifically, it is prohibited to change or modify the Font/Trademark names used as identifying tags in the Font Software in any form or manner. If such changes or modifications become necessary, prior written consent has to be obtained from Linotype Library GmbH.”<br>
      See <a href="http://www.linotype.com/1710/licenseagreement-folder.html?PHPSESSID=414c21404c4f1e292f6270336592fc10"> this page.</a></p>
      <p>But…</p>
      <p>If you buy from Myfonts, the EULA offered states:<br>
      “2.4 You may modify the Font-Software to satisfy your design requirements. Such modifications are in every respect subject to this Font-Software License Agreement.”<br>
      See <a href="http://www.myfonts.com/viewlicense?id=8"> this page.</a></p>
      <p>If you buy Helvetica Neue from Adobe, it’s hard to say. The EULA states:<br>
      “14.7.4 You may convert and install the font software into another format for use in other environments, subject to the following conditions: A computer on which the converted font software is used or installed will be considered as one of your Permitted Number of Computers. Use of the font software you have converted will be pursuant to all the terms and conditions of this agreement. Such converted font software may be used only for your own customary internal business or personal use and may not be distributed or transferred for any purpose, except in accordance with Section 4.4 of this agreement.”</p>
      <p>Make of all this what you will. Caveat emptor!</p>
