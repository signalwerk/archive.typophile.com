      <p>Here’s a response to your first question:<br>
      Helvetica Neue LIGHT for text? How cruel! Is this a government document? </p>
      <p>; )</p>
      <p>I have had the most difficulty lately trying to read books set in light weights of Helvetica, and I’m not that old. The problem is twofold: Helvetica (as offered digitally) is spaced more for display than for text. Any use of any weight of Helvetica below 12 point requires some positive tracking; letters bleed together, destroying letter and word recognition.  Also, Helvetica’s lettershapes push the boundary of ambiguity, meaning, a, e, s, all look the same, rn = m, and in English, you don’t want that kind of confusion. The deadly regularity of the strokes combined with the tight spacing makes for a singularly unreadable mess. Consider using a better-spaced type to start with, like Akzidenz Grotesk! Its proportions and spacing make it much more comfortable to read, though smaller sizes might require additional tracking. </p>
      <p>I’m sorry, the problem is threefold: Why a light weigh for text? It’s stylish, I’m well aware, but is it readable? How much text is there? What size are you setting all this text? Could you consider a different style of sans, a Humanist, for example, to make reading easier and gain some economy of space in the bargain? Are you stuck with AG and Helvetica? Several families of <a href="http://www.fonts.com/FindFonts/detail.htm?query=mundo&amp;pid=403346&amp;page_id=20513&amp;grab_id=0">Sans</a> offer a variety of weights for text and display and are more suited for extended reading. I wouldn’t recommend any light weight for text sizes. </p>
      <p>Now back to regularly scheduled EULA discussion.</p>
