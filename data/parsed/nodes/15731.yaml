    html: |-
      <p>In this specific case looking for loopholes or looking at the least restrictive license available from a reseller is the wrong approach. Even if the corporation is tiny, the fact that they want to distribute customized versions of the fonts should dictate that they work with the font owner directly. Even if they find a loophole that lets them do this, what happens when they want to do something that’s definitely not allowed? What do they do when they need another 500 licenses and the old EULA has gone away? </p>
      <p>Looking for the best deal or EULA is a good approach for personal or limited use, but it doesn’t always scale at the corporate level. </p>
      <p>So again find myself on the same page as Tiffany. If the vendor is not offering you the licensing rights you need negotiate with them, and if you make no progress go elsewhere. Problems occur when designers back themselves into a corner on font choice and the vendor isn’t flexible - this was the case with my company. Until recently a company using Verdana as their corporate font had limited legal options if they needed a Type 1 version or a modified character or three.</p>
    html_clean: |-
