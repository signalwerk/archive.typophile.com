    <p>What would be the typographic ramifications of using Akzidenz Bold for headlines and Helvetica Neue Light for text?</p>
    <p>Furthermore, what would be the licensing ramifications of creating a custom font to be “distributed” corporation-wide, with a tighter tracked/kerned version of Akzidenz Bold and calling it, say, “Corporation X Headline” and mixing it with Helvetica Light as-is and calling it, say, “Corporation X Text”?</p>
