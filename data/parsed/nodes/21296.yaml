      <p>thoughts on site: the left bottomhand is getting better. it doesnt look AS disjoined from the rightside any longer but i'm still not a fan of the weaving colors in the way you have made them do this. perhaps it's just that they are underneath the text and it catches your eye in a bad way? i still like the first design better. and yes, this is because of your column layout. the first site just has a feeling that someone who had an idea of what they are doing designed it. i dont think there's anything majorly wrong with it, i think you should use that as your skeleton and upgrade your logo.</p>
      <p>thoughts on logo redesign: i'm not a fan of this redesign. yet. maybe if you reduced the space between the words, killed the arc-ing effect you have on it and started without a line around the edges you'll be able to see the obvious problems. i'd suggest starting bare bones with the logo, in it's own file, away from the web application and playing with joinging some of the parts of the letters? i'd also maybe try a big 8 to the left and a three nine speeled out to the right? the position of the spelled out three to the left is confusing. see if you  can pack them in together? </p>
      <p>but please post again with an update. it's always exciting to see the process. you just had it down on that first website attempt. nice job</p>
