      <p>woah, easy fella!  I sounds like you've checked out the screenshots without actually reading my comments on it (although thats not an accusation!)</p>
      <p><cite>-<br>
      Screenshot_003 tries to deal with this issue by introducing the ubiquitous navigation tabs. But i dont like it. It looks cheap.</cite></p>
      <p><cite>What to do?</cite></p>
      <p><cite>Well, i think I might take everyones advice and simply upgrade the existing design. To start i think i’ll give it new fresher colours, and new logo, and some subtle curves. That should go a long way towards livening it up.</cite></p>
      <p><cite>Thoughts?<br>
      -</cite></p>
      <p>I'm not trying to show off any Photoshop skills at all (to be honest, they're infantile at best anyway).  </p>
      <p>Also, I disgree with you about needing a concept.  A concept can easily be mistaken for a gimmick.  A web page doesnt have to be cool, or have something special, it needs to be functional.  I think its much more about giving people access to information and having them feel good about the experience.</p>
      <p>I'm not trying to discredit a well thought out and nicely executed concept.  There's always a place for that.  But I dont think its the holy grail.</p>
      <p>I'll be back with more updates at some stage.  I've appreciated everyones comments so far,  and value all of your opinions, but lets keep it objective and possibly constructive if we can - much appreciated.</p>
