      <p>i agree with the above post. the first rendition looks more sophisticated and seems to match your company statement in a much better way. it's not without flaw and it definitely needs refinement, but there is structure and a sense of an underlying grid taking place.</p>
      <p>the second option feels wimpy and lost. the elements have nearly no relation to each and the overlapping lines and angled text is annoying to look at. too much is happening at the bottom. i'd say just stick with the first approach, work it out a little more, work in some new colors, perhaps from the second variation and play with your grid strucutre. i also feel the design 839 logo at the bottom right of that version is too large and oddly placed in the brown box</p>
