      <p>Thanks guys.  </p>
      <p>well, it seems that the original design at <a href="http://www.design839.com" title="www.design839.com">www.design839.com</a> is overwhelmingly more popular than the attempted redesign so far.  I'm getting a little bit confused at which design specifically people are talking about though.  </p>
      <p>WM, your comments make sense, cheers, thanks for the thoughtful input.</p>
      <p>ill sans and dezcom: when you say '1st one' do you mean the original (<a href="http://www.design839.com" title="www.design839.com">www.design839.com</a>) or the first redesign (screenshot.gif)?</p>
      <p>Since your comments, i've done some more variations on the redesign.  Lets call these screenshot_003 and screenshot_004 respectively.</p>
      <p>I think screenshot_004 is a stronger design, and it still has the solid content grid, which i never had intention of getting rid of, because I think it does work well.  My only concern is that the navigation isnt obvious enough.  Hidden away in the bottom left corner, attached to the footer, this could easily be mistaken for a tagline, and might read "About advertising web print contact", which is just odd if you say it out loud.</p>
      <p>Screenshot_003 tries to deal with this issue by introducing the ubiquitous navigation tabs.  But i dont like it.  It looks cheap.</p>
      <p>What to do?</p>
      <p>Well, i think I might take everyones advice and simply upgrade the existing design.  To start i think i'll give it new fresher colours, and new logo, and some subtle curves.  That should go a long way towards livening it up.</p>
      <p>Thoughts?</p>
