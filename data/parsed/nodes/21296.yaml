    html: <p>Not loving the tabs--at all. You're using cheap tricks here with the bevels, gradients, drop shadows. I think you need to think about this website long and hard. Remember that its not just a page with page and tabs, its a fun interaction for the user. Make it stand out conceptually. I don't care how amazing you are with photoshop and HTML, if you dont have a  concept, its gonna show immediately. Sorry if Im harsh but you're heading the wrong direction.</p>
