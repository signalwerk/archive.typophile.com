    <p>Heya,</p>
    <p>I'm between projects which is a perfect time to have a look at redesigning my own website.</p>
    <p>So, I think the original design <a href="http://www.design839.com/old_website/" rel="nofollow">http://www.design839.com/old_website/</a> is uninspired, bland, and a little bit dot.com-ish.  It was put together in a few hours about a year ago.  I'm embarassed by it, and typically dont refer people to it.</p>
    <p>Here's a start on a redesign.  I'd like it to be fairly informal, unpretentious and maybe even a little bit fun.</p>
    <p>Any constructive criticism very welcome.</p>
    <p>Cheers - Jonny</p>
    <p><strong>Live site:</strong><br>
    <a href="http://www.design839.com/" rel="nofollow"><strong>31st Aug 2006</strong></a></p>
