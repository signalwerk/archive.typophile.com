    <p>Hi,</p>
    <p>Does anyone know the typefaces that are used in Chanel No 5, Calvin Klein Obsession and Yves Saint Laurent's Opium perfumes?</p>
    <p>Obsession: <a href="http://ecx.images-amazon.com/images/I/31AKuqDjJdL._SL500_AA280_.jpg" title="http://ecx.images-amazon.com/images/I/31AKuqDjJdL._SL500_AA280_.jpg">http://ecx.images-amazon.com/images/I/31AKuqDjJdL._SL500_AA280_.jpg</a><br>
    Chanel No 5: <a href="http://www.cheap-perfume.co.uk/wp-content/uploads/2008/02/chanel-no-5.jpg" title="http://www.cheap-perfume.co.uk/wp-content/uploads/2008/02/chanel-no-5.jpg">http://www.cheap-perfume.co.uk/wp-content/uploads/2008/02/chanel-no-5.jpg</a><br>
    Opium: <a href="http://img2.timeinc.net/instyle/images/2006/products/November/BFF/101106_yvessaintlaurent_a.jpg" title="http://img2.timeinc.net/instyle/images/2006/products/November/BFF/101106_yvessaintlaurent_a.jpg">http://img2.timeinc.net/instyle/images/2006/products/November/BFF/101106...</a></p>
    <p>Also, if you know the typefaces used in ANY other famous perfumes, I'd love to know.</p>
    <p>Thank you so much in advance.</p>
