      <p>Sorry to burst your bubble, but most famous perfumes have custom designed logos.</p>
      <p>That being said, <a href="http://www.fontshop.com/fontlist/alternatives/trajan/?&amp;sample_text=OBSESSION" rel="nofollow">Perpetua Titling</a> comes pretty close to Obsession, and you can approximate the Chanel logo with <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">H&amp;FJ Gotham</a>.</p>
