    html: |-
      <p>It's unavailable for licensing due to trademark disputes. More <a href="http://www.typophile.com/node/30859">here</a>:</p>
      <blockquote><p>Scangraphic’s Digital Type Collection (which included Haas Unica) was purchased by Elsner + Flake in 2003, to which they added font-specific Euro and @ symbols in 2004. The revamped typeface was set to be sold by Scangraphic and its distributors, but Linotype is currently preventing the release, citing trademark violations. Although similarities to other typefaces often occur between foundries, it is rare that one finds typefaces that have been shelved indefinitely due to such resemblances. In truth, the real problem lies within a dispute over who owns the name Haas Unica, rather than any resemblance infringment.</p></blockquote>
    html_clean: |-
