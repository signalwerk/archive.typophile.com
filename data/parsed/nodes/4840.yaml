      <p>&gt; I’m quite sure that those have been transferred either to Linotype GmbH or to their new owner Monotype Imaging </p>
      <p>If this were true, then Monotype would have registered the new ownership. What is more, Monotype would have been under obligation to register the new ownership, because only the owner registered as the owner of the trademark is the owner of the trademark. And this registered owner is Heidelberger Druckmaschinen, which also made a more recent registration for the trademark "Hass" for entire Europe:</p>
      <p><a href="http://www.sanskritweb.net/temporary/haas2.gif">http://www.sanskritweb.net/temporary/haas2.gif</a></p>
      <p>Incidentally, someone else registered "Haas Grotesk":</p>
      <p><a href="http://www.sanskritweb.net/temporary/haas3.gif">http://www.sanskritweb.net/temporary/haas3.gif</a></p>
      <p>At the Linotype and the Monotype website, e.g. here</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/helvetica.gif">http://www.sanskritweb.net/temporary/helvetica.gif</a></p>
      <p>it is claimed:</p>
      <p>"Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH."</p>
      <p>But this is not true.</p>
      <p>Helvetica is a trademark of Heidelberger registered in the U.S. Patent and Trademark Office. The managers of Monotype are able to see this at the website of the U.S. Patent and Trademark Office, namely here</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/helvetica2.gif">http://www.sanskritweb.net/temporary/helvetica2.gif</a></p>
      <p>so that it is apparent that the managers of Monotype make intentionally false statements at the Monotype website.</p>
      <p>While Monotype registered several "crap fonts", e.g. "Basic Commercial",</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/basic.gif">http://www.sanskritweb.net/temporary/basic.gif</a></p>
      <p>the important trademarks, e.g. for Helvetica, are still registered for Heidelberger Druckmaschinen AG at the U.S. Trademark Office.</p>
      <p>And in Germany as well as in entire Europe, Helvetica is also registered for Heidelberger Druckmaschinen only, not for Monotype nor for Linotype:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/helvetica3.gif">http://www.sanskritweb.net/temporary/helvetica3.gif</a></p>
      <p>The Monotype managers are mentally capable of seeing this. Therefore it is ricidulous that they deceive buyers about the trademark registration at the Monotype website.</p>
      <p>At the Monotype subsite</p>
      <p><a href="http://www.monotypeimaging.com/aboutus/trademarks.aspx">http://www.monotypeimaging.com/aboutus/trademarks.aspx</a></p>
      <p>apparently most "Linotype Corp." trademark statements, such as e.g.</p>
      <p>"Aldus" is a trademark of Linotype Corp. registered in the United States Patent and Trademark Office...</p>
      <p>are false, as you can see for yourself by checking the website of the US Trademark Office here</p>
      <p><a href="http://www.uspto.gov/main/trademarks.htm">http://www.uspto.gov/main/trademarks.htm</a></p>
