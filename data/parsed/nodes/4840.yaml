    html: <p>Dunno — maybe a bad reason… or two. Part of it is Gurtler’s mystique. Another is the amazing “rationalization” exercise Team 77 carried out in making it (elaborated just as amazingly in a small publication I have a copy of). I guess the main reason I can cling to is that it’s not “naive”. Most old grots (like Akzidenz) are like backwards villagers to me, and new grots (like <span class="caps">FF</span> Bau) are urbanites <i>pretending</i> to be villagers. In comparison, Unica is like an urbanite who has had to move in with his villager in-laws, but has decided to make the best of it. <br><br>On the other hand, I suspect this is exactly why some people think Unica is not in fact a grot — it’s a geo in grot’s clothing. <br><br>hhp <br></p>
