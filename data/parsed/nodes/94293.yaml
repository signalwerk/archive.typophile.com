      <p>Couldn't find something even loosely similar. Makes me thinking to some <a class="freelinking external" href="http://www.myfonts.com/foundry/Scholtz_Fonts/" rel="nofollow">Scholtz Fonts</a>. I would probably classify it as "<a class="freelinking external" href="http://www.myfonts.com/search/tag%3AArabic/fonts/" rel="nofollow">Arabic</a> <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Abrushdrawn" rel="nofollow">brushdrawn</a> <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Aink" rel="nofollow">ink</a> <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Acalligraphic/fonts/" rel="nofollow">calligraphy</a>".<br>
      Some fonts, probably useless: <a class="freelinking external" href="http://www.myfonts.com/fonts/scholtz/silken/" rel="nofollow">Silken</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/la-figura/" rel="nofollow">La Figura</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/scholtz/certificate/" rel="nofollow">Certificate</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/scholtz/ability/" rel="nofollow">Ability</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/garagefonts/mockingbird/" rel="nofollow">Mockingbird</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/glc/1871-dreamer-script/" rel="nofollow">Dreamer Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typesetit/cherish/" rel="nofollow">Cherish</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/yevida/" rel="nofollow">Yevida</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/corradine/sensual/" rel="nofollow">Sensual</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/swan-song/" rel="nofollow">Swan Song</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/autographis/naomi/" rel="nofollow">Naomi</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/autographis/constanza/" rel="nofollow">Constanza</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/scholtz/lovers-pro/" rel="nofollow">Lovers</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/santangeli/" rel="nofollow">Santangeli</a></p>
