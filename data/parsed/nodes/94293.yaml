      <p>Not done by brush, but with a broad nib quill.</p>
      <p>@OT: You are probably not up to date with the definition of a ‘font’, as practiced on this site, as opposed to ‘lettering’. To make a long story short: there are fonts inspired by / based on this style of lettering (or calligraphy). The best known is Zapf Chancery. Start there and find similar fonts with more flourishes and swashes.</p>
