    html: <p>For a client I generally quote 3 weeks for an original individual weight. Week one the basic glyph set (UC, lc, figs, punct.), week two the sorts and accented glyphs, week three the final productizing. Spacing and kerning are part of the process throughout. If there are multiple weights and MM is used, it shortens the timeframe considerably. But then I work sort of fast.</p>
