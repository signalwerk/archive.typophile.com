  - id: 274190
    user: 1043
    date: 2008-04-22T07:36:00
    date_raw: 22 Apr 2008 — 7:36am
    votes: null
    html: <p>In the case of Aaux (the font family in your example image), the foundry has chosen to put each font style into its own family of one. This is not an uncommon practice and is done mainly to avoid cross-platform document compatibility problems due to differences in the way font families are handled on Macs and PCs. There isn't any simple way to change the way a font's names are set up. It's one of the more complicated areas of font development. If you know what you are doing, you could do it with TTX, but I wouldn't recommend it. I would agree with Jens--it would be best to contact the foundry.</p>
