    <p>Here is the problem:<br>
    I have multiple instances of identical type families that should be merged into a single suitcase.<br>
    It becomes very tedious to scroll through huge blocks of the same typeface that should be nested into the same suitcase.<br>
    Is there a way to group these families into a single suitcase through the use of a freeware application or other means?<br>
    I am using 10.5.</p>
    <p>I have attached an image for reference.</p>
    <p>Thank you!</p>
