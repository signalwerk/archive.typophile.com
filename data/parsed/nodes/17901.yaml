  html: |-
    <p>Heya IDers,</p>
    <p>This mob cant find their original artwork and their designer has gone out of business (i wonder why..!).  I suggested total rebranding, but they’re happy with the general vibe they already have.</p>
    <p>So instead, i’m going to reimplement their logo.  Of course, the first thing i’ll be doing is loosing that gawd awful white glow.</p>
    <p>Anyway, first look at this and i swore it was Adobe’s open type caslon.</p>
    <p>But on closer inspection, the cap of the uppercase ‘A’ isnt consistent, and the slab serifs are slightly wider on adobe caslon.</p>
    <p>For all intents and purposes, i could probably get away with it, but now its just bugging me!</p>
    <p>Any help much appreciated.</p>
    <p>Cheers - JonnySchneider</p>
