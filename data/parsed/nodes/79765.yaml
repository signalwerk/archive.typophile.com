    <p>Hello,  These are two logo options shown on a rough mock up of the Uride homepage and header space available.  The intended message is  U (you) ride.       I'm not a graphic designer so these are only conceptual.  </p>
    <p> Uride.ca is a carpool/rideshare site across canada. Carpoolers primarily fall into the 25-40 age group and will use the site for school, public, and work commutes.  A green approach to helping the planet.  </p>
    <p> Please let us know which logo you would choose. </p>
    <p> We are looking for the most brandable, marketable, printable logo.</p>
    <p> Thank you for taking the time.</p>
