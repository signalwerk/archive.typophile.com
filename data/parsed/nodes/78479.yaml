      <p>@Ivan: <em>…these new barbaric types…</em></p>
      <p>They weren't types then (1805), only lettering.<br>
      The sample you show is a block cut inserted into type matter, and the artist responsible has created a deliberately crude parody.<br>
      Such was the opprobrium attached to this putatively primitive style that type founders were slow to render it in print, long after its use had become widespread in other media.</p>
      <p>Is there a term for the phenomenon whereby somebody or something acquires the term by which it is derided, as a badge of honor? It's an ancient practice; the Cynics of Ancient Greece were quite literally dogs.</p>
      <p>I suspect there was an element of irony at play, as type founders proudly adopted the name Gothic, by which their clients half-mockingly referred to the new style.</p>
