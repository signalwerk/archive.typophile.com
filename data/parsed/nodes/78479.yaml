      <p>Medieval blackletter being called Gothic was a disparaging term from the Renaissance applied to most, if not all Medieval art and architecture, associating it with the European tribes that had destroyed Rome and the classical civilization the Renaissance was trying to revive. I presume pre-blackletter calligraphy such as uncials was also considered gothic.</p>
      <p>19th Century sans-serif type got called Gothic by people who thought it resembled blackletter and Grotesque by people who thought it was ugly. I'm not sure if the term gothic was being used for type and lettering before the Victorian Gothic-revival style of architecture and decorative arts.</p>
      <p>Blackletter tends to be called gothic in the context of calligraphy rather than type. Blackletter type being called gothic is often simply due its association with gothic music and fashion, eg. on free font sites.</p>
