      <p>For those who are not familiar with French, it should be mentioned that e.g. the "Dictionnaire de l'édition. Français-Anglais. Anglais-Français" by Philippe Schuwer, published in 1977, did not yet contain the word "sans serif" as a French word.</p>
      <p>The expressions "Sans", "Serif", "Sanserif", "Sans serif", "Sans-serif" etc. were not listed at all in the French section of this bilingual dictionary of 1977.</p>
      <p>The expressions "Sans serif", "Serif" and "Sanserif" were only found in the English section of this bilingual dictionary, with translations into French words.</p>
      <p>This means that before the computer and internet age, the French did not use the so-called "French" expression "sans serif".</p>
