      <dl>
      <dt>The Russian for blackletter is <em>готический шрифт</em> [<em>goticheskii shrift</em>]. Predictably, the names of American sans-serifs are transliterated:<br>
      <blockquote></blockquote></dt>
      <dd><em>Авангард Готик</em></dd>
      <dd><em>Белл Готик</em></dd>
      <dd><em>Леттер Готик</em></dd>
      <dd><em>Ньюс Готик</em></dd>
      <dd><em>Франклин Готик</em>, etc.
      </dd>
      </dl>
      <p>Sans-serifs are commonly known as <em>рубленые</em> [<em>rublenye</em>, ‘hewn’] or <em>гротески</em> [<em>groteski</em>]. One sans-serif variety used to be called <em>древний</em> [<em>drevnii</em>, ‘antique’].</p>
