  html: <p>I have not been able to find out why san serif fonts such as Franklin Gothic are called Gothic. Fraktura and similar blackletter typefaces are also called Gothic. Can anyone point me to a book/text/site, where this difference — or similarity in name — originated? Or, may I hear from an expert in the house?</p>
