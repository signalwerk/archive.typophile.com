      <p>To increase the complexity of the problem and partially explain what Justin_Ch wrote above: “Gothic” as a denomination for blackletter (handwritten or printed) only refers to a certain form of blackletter, which is also termed Textura or Textualis (see <a href="http://en.wikipedia.org/wiki/Blackletter#Textualis" title="http://en.wikipedia.org/wiki/Blackletter#Textualis">http://en.wikipedia.org/wiki/Blackletter#Textualis</a>). Fraktur is another branch of broken letterform.<br>
      For a start in books on the topic I'd recommend “Blackletter: Type and National Identity”, ed. by Peter Bain/Paul Shaw, or if you read German, Albert Kapr’s “Fraktur. Form und Geschichte der gebrochenen Schriften”. For the sanserif Gothic, James Mosley’s “The Nymph and the Grot. The revival of the sanserif letter” was already mentioned.</p>
