      <p>&gt; <cite>I have not been able to find out why san serif fonts such as Franklin Gothic are called Gothic</cite></p>
      <p>Linguistic explanation:</p>
      <p>In order to describe a new phenomenon, at first, various already existing words denoting something else are used metaphorically to describe the new phenomenon.</p>
      <p>Usually, one of these words used metaphorically to describe the new phenomenon becomes the predominant word, and the others words often fall into disuse.</p>
      <p>In the case of the new phenomenon of the sans serif typefaces at the beginning of the 19th century, three metaphorical words describing something else were used to describe the new phenomenon of sans serif typefaces:</p>
      <p>- "doric"<br>
      - "grotesque"<br>
      - "gothic"</p>
      <p>The metaphorical word "doric" fell into disuse both in America and in Europe and is no longer used for sans serif typefaces at all, but it is still mentioned in Webster's Third New International Dictionary of 1961.</p>
      <p>The metaphorical word "grotesque" became the predominant word in Europe, especially in Britain and Germany, for describing sans serif typefaces metaphorically.</p>
      <p>The metaphorical word "gothic" became the predominant word in America for describing sans serif typefaces metaphorically.</p>
      <p>If you look into the British encyclopedia "Glaister's Glossary of the Book", second edition 1979, sub voce "gothic", "grotesque", "doric", you will discover</p>
      <p>- that the word "gothic" is not used metaphorically for sans serif fonts,<br>
      - that the word "grotesque" is used metaphorically for sans serif fonts,<br>
      - that the word "doric" is no longer mentioned at all.</p>
