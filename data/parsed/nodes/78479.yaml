    html: <p>In Latvia blackletter started to fade out around 1930. So the books and newspapers printed before were and still are referred to as printed with "Gothic letters" - Gotu burti. And if you mention to anybody "gothic" the first association is "Blackletter". Sans Serif were usually referred as Block letters - Bloka burti.</p>
