  html: <p>A <a href="http://www.typecon2003.com/programsched.cfm">schedule of events</a> has been posted on the <a href="http://www.typecon2003.com">TypeCon2003</a> website. 68 <a href="http://www.typecon2003.com/speakers.cfm">speakers</a> and four days of great programming. Additional details about individual sessions will follow. We've also posted a list of <a href="http://www.typecon2003.com/auction.cfm">auction items</a> donated so far. Our British friend <a href="http://www.housestylegraphics.com">Dave Farey</a> will serve as auctioneer once more, and it promises to be great fun. Some treasures await... it's also for a good cause, as all auction proceeds go to SOTA activities, such as subsidizing student admission, and keeping conference registration fees low for professionals. <br> <br>Digital Font Production 101 (Bitstream) and DFP 201 (FontLab), plus Ilene Strizver's Gourmet Typography workshop are now closed. The other <a href="http://www.typecon2003.com/workshops.cfm">11 classes</a> are filling fast, and the conference is nearing capacity. Now is the time to <a href="http://www.typecon2003.com/register.cfm">register</a> if you plan to join us in Minneapolis July 17-20. Email <a href="mailto:tamye@typesociety.org">us</a> for more info. <br></p>
