    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Amberlith</strong></p>
    <p>Amberlith is an orange gel adhered to clear acetate. It was used as a way to <a href="/wiki/knock%20out" class="freelinking" rel="nofollow">knock out</a> or separate areas of camera ready art for different color or screen treatments. The orange film was cut and stripped away with a knife or <a href="/wiki/swivel%20knife" class="freelinking" rel="nofollow">swivel knife</a>. The orange was clear enough to be seen through for cutting purposes but opaque to light from the lithographic film it was exposed to.</p>
