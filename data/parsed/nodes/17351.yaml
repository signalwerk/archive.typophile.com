    <p>Amberlith is an orange gel adhered to clear acetate. It was used as a way to <a href="/node/add/wiki?edit%5Btitle%5D=knock%20out" title="Create node &quot;knock out&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">knock out</a> or separate areas of camera ready art for different color or screen treatments. The orange film was cut and stripped away with a knife or <a href="/node/add/wiki?edit%5Btitle%5D=swivel%20knife" title="Create node &quot;swivel knife&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">swivel knife</a>. The orange was clear enough to be seen through for cutting purposes but opaque to light from the lithographic film it was exposed&nbsp;to.</p>
