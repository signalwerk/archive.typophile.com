    html: "<p>What PDF? <br> <br>-- <br> <br>I think what you're trying to do is quite hard. Others who have made fonts like this have stuck to highly decorative results (which is a lot easier), while you seem to be trying to shoot for text. Barnbrook's Priori (from Emigre) is something you might like to look at for possible ideas. <br> <br>I think you're mostly on the right track, but some glyphs go too far while others are a bit too reserved. That first \"t\" and certainly that first \"o\" are examples of going too far, while most of the letters are too docile; I think you need some docility, especially among more frequent letters (like the \"e\" - which I think is just right there), but some of your glyphs which are just pushy enough are: the second \"k\", \"r\", \"w\" and \"z\". The \"g\" is really wonderful, just a little too strong on the finish of the tail. <br> <br>The caps seem more properly balanced (considering their role), although it would be nice to have some fancier alternates. Your \"A\", third \"K\", second \"R\", \"U\" and \"W\" are very nice, while the second \"Y\" for example seems too much here, and maybe things like the \"C\" need slightly more flair. <br> <br>hhp</p>"
    html_clean: "<p>What PDF? <br> <br>-- <br> <br>I think what you're trying to do is quite hard. Others who have made fonts like this have stuck to highly decorative results (which is a lot easier), while you seem to be trying to shoot for text. Barnbrook's Priori (from Emigre) is something you might like to look at for possible ideas. <br> <br>I think you're mostly on the right track, but some glyphs go too far while others are a bit too reserved. That first \"t\" and certainly that first \"o\" are examples of going too far, while most of the letters are too docile; I think you need some docility, especially among more frequent letters (like the \"e\" - which I think is just right there), but some of your glyphs which are just pushy enough are: the second \"k\", \"r\", \"w\" and \"z\". The \"g\" is really wonderful, just a little too strong on the finish of the tail. <br> <br>The caps seem more properly balanced (considering their role), although it would be nice to have some fancier alternates. Your \"A\", third \"K\", second \"R\", \"U\" and \"W\" are very nice, while the second \"Y\" for example seems too much here, and maybe things like the \"C\" need slightly more flair. <br> <br>hhp</p>"
