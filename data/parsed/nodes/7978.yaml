  html: "<p>Fellow colleagues, <br> <br>Let me show you my first major typographic work: Poverty. <br> <br>It's a font based in early Renaissance typefaces as well as inscriptional letters found in paintings from the XVI and XVII centuries. <br> <br>At present it's optical size its suitable for display. Maybe, in the future, I will create another version for text use. Italics may come as well.  <br> <br>After having been working on this font for as long as I can remember I have a reached a point where your help is needed, my eye may bypass some details clearly visible to an experienced type designer. <br> <br>Hope you like it!</p>"
  html_clean: "<p>Fellow colleagues, <br> <br>Let me show you my first major typographic work: Poverty. <br> <br>It's a font based in early Renaissance typefaces as well as inscriptional letters found in paintings from the XVI and XVII centuries. <br> <br>At present it's optical size its suitable for display. Maybe, in the future, I will create another version for text use. Italics may come as well.  <br> <br>After having been working on this font for as long as I can remember I have a reached a point where your help is needed, my eye may bypass some details clearly visible to an experienced type designer. <br> <br>Hope you like it!</p>"
