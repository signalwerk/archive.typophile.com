      <p>Adobe Acrobat now includes a sans serif Simplified Chinese font (AdobeHeitiStd-Regular) that can be used for authoring purposes, and we also bundle this font with many of our other applications (when it is localized for China). It's a very good design, and covers GB 18030, meaning that all of the hanzi in the URO and Extension A are included, to the tune of 30K glyphs. We purchased this design from Changzhou SinoType.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br><a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
