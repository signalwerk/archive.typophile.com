      <p><strong><em><a href="http://www.linotype.com/13446/helveticaroman-font.html" rel="nofollow">According to Linotype:</a></em></strong></p>
      <p>Many customers ask us what good non-Latin typefaces can be mixed with Helvetica. Fortunately, Helvetica already has Greek and Cyrillic versions, and <a>Helvetica™ World</a> includes a specially-designed Hebrew Helvetica in its OpenType character set. But Linotype also offers a number of CJK fonts that can be matched with Helvetica.</p>
      <p><strong>Chinese fonts that pair well with Helvetica:</strong><br>
      <a href="http://www.linotype.com/110191/dfhei-family.html" rel="nofollow">DF Hei</a> <em>(Simplified Chinese)</em><br>
      <a href="http://www.linotype.com/110207/dfhei-family.html" rel="nofollow">DF Hei</a> <em>(Traditional Chinese)</em><br>
