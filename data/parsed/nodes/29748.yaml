      <p><strong><em><a href="http://www.linotype.com/13446/helveticaroman-font.html">According to Linotype:</a></em></strong></p>
      <p>Many customers ask us what good non-Latin typefaces can be mixed with Helvetica. Fortunately, Helvetica already has Greek and Cyrillic versions, and <a>Helvetica™ World</a> includes a specially-designed Hebrew Helvetica in its OpenType character set. But Linotype also offers a number of CJK fonts that can be matched with Helvetica.</p>
      <p><strong>Chinese fonts that pair well with Helvetica:</strong><br><a href="http://www.linotype.com/110191/dfhei-family.html">DF Hei</a> <em>(Simplified Chinese)</em><br><a href="http://www.linotype.com/110207/dfhei-family.html">DF Hei</a> <em>(Traditional Chinese)</em><br><a href="http://www.linotype.com/110368/dflihei-family.html">DF Li Hei</a> <em>(Traditional Chinese)</em><br><a href="http://www.linotype.com/110533/dfphei-family.html">DFP Hei</a> <em>(Simplified Chinese)</em></p>
      <p><strong>Japanese fonts that pair well with Helvetica:</strong><br><a href="http://www.linotype.com/110162/dfgothic-family.html?DSESSID=&amp;PHPSESSID=a04b0657aaf1e74cf0314ee8b3f82f6c">DF Gothic</a><br><a href="http://www.linotype.com/110152/dfgothicp-family.html?DSESSID=&amp;PHPSESSID=a04b0657aaf1e74cf0314ee8b3f82f6c">DF Gothic P</a><br><a href="http://www.linotype.com/110223/dfhsgothic-family.html?DSESSID=&amp;PHPSESSID=a04b0657aaf1e74cf0314ee8b3f82f6c">DFHS Gothic</a></p>
      <p><strong>Korean fonts that pair well with Helvetica:</strong><br><a href="http://www.linotype.com/110320/dfkgothic-family.html?DSESSID=&amp;PHPSESSID=a04b0657aaf1e74cf0314ee8b3f82f6c">DFK Gothic</a></p>
