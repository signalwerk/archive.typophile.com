    <p>I am looking for a Chinese character set that has similar qualities to a modern san serif like Univers, Frutiger or Helvetica. (meaning not script)<br>
    If anyone has a suggestion or could even direct me to a Chinese foundry or type designer, I would be eternally grateful.</p>
