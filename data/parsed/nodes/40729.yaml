      <p>"And maybe later still contextual alteration will become integral to our thinking &amp; design rather than being a tacked on way of killing pesky spacing problems. Maybe."</p>
      <p>“solutions that worked yesterday or today might not work tomorrow” </p>
      <p>Just think back a few decades to hot metal type. Kerning was nearly impossible and side-bearings were one-size-fits-all. Then. phototype and later digital came along and these old patterns were broken, albeit oftentimes abused. OpenType brings potential for both terrific solutions as well as overuse and butchery. After that experimental plunge, the future will be better. If we don't push the envelope however, we will be stuck with the limitations of yesterday. Old farts like me won't be the ones who make the difference though. Young people who have never experienced the limitations impost by type frozen in metal form will not be stymied by the appearance of a closed door. They will just walk through and do new and better things with type than my generation because they see no boundaries and have no fear to overcome.</p>
      <p>ChrisL</p>
