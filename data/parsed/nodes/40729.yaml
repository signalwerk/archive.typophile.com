    html: |-
      <p>There are many characters that present problems in certain combinations or sizes. I am very fond of serifs on i and j, but they do make bad combinations with r, g and others with a protruding top right. Or the double-decker g (whatever you want to call it): starts getting blotchy at certain sizes, which is what automatic optical sizing could take care of, but also a replacement below a certain size. Or insert one or two different g's in the gg combination. The get really noticeable, and in English, double-g appears frequently. In German, ch, sch and ck are pronounced as one sound, as ck is in English. The c always looks too far from the h or the s, and in metal we had ligatures for these (as for tz by the way), also a time-saving device. I cannot kern the c for these combinations, as they would look bad in all the other languages. </p>
      <p>When we designed the typeface for Glasgow in 1999, I wanted to have different combinations – kind of ligatures – for the different ways certain diphtongs are pronounced in English. Like ea as in reading or in leading (the typographic type), ow as in low or cow, o as in rose or in lose, etc. Not new signs as in some attempts for more phonetic English, but just different ways to show these letters in context.  At the time that would have meant calling up a dictionary and then insert glyphs from separate fonts. That was deemed to difficult for your ordinary graphic designer, as it would have forced him to install many fonts for just the one weight. Today that would be quite reasonable to implement.</p>
