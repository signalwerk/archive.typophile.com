      <p><strong>The curly a-d-i-l-u principle</strong><br>
      How it works, the curls serve to emulate the presence of serifs. In theory they help form better bouma. In practice they work very well as a stylistic attraction and a fairly transparent structural readability enhancement device.</p>
      <p>The calt feature will substitute straight-stemmed <strong>a-d-i-l-u</strong> for <strong>g</strong>.</p>
      <p><strong>g</strong> is the only exception. For every other combination the curls are useful.</p>
      <p>j a m e s</p>
