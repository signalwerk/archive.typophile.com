      <p>Thanks everybody! That's great.</p>
      <p>What I wanted to do with this thread was see if there were any more Calluna like examples that I might have missed. Because this is an emerging thing it would be easy to miss something. </p>
      <p>Chris, would you be willing to let me show some of Froggy's Alts during a talk?</p>
      <p>Paul, I didn't think that I would find anybody doing anything in a 'thorough manner' yet. 'Thorough manner' meaning letting nearly all glyphs be contextually shaped. That would be too complicated and is too large a cultural shift to have happened yet, if indeed it is desirable at all. As far as best courses I am not sure. What you are describing makes sense - or perhaps even a less aggressive model where you kern before you look for contextual Alts to solve problems. </p>
      <p>Long term I hope we will just keep sharing and then it may emerge that certain letters in pairs &amp; tripples become common targets for alteration. And maybe later still contextual alteration will become integral to our thinking &amp; design rather than being a tacked on way of killing pesky spacing problems. Maybe.</p>
