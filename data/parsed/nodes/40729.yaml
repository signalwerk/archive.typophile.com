    html: |-
      <p><em>What kinds of context might cause you reduce the internal white space of a letter in a word?</em></p>
      <p>Where a letter with a long left entry letter follows an r the serif is dropped. This does two things: it clears up the ugly collision of the serif with the top of the r and it also allows me to position the letters closer together, reducing the white space caused by the shape of the r.</p>
      <p>A similar thing happens following the г (ghe) in the Cyrillic portion of the font.</p>
      <p>The Greek implementation is different, because there are no serifs, but certain letters create lots of white space when adjacent to each other, e.g. the combination στ as in the word Χριστου. So I have variants with shorter horizontal bars that are used contextually.</p>
      <p>I should mention again that I'm talking here about something that is intended as a display face, and it has design features that are more exaggerated than they would probably be in a text face, e.g. the serifs are longer.</p>
      <p>But this leads me to wonder if perhaps you are asking your question backwards? Instead of asking if anyone is making fonts that use contextual alternates to improve letter fit, you could ask if anyone is deliberately breaking the canons of text face design, e.g. with regard to serif length, in the knowledge that such alternates can be used to adjust the resulting word shaping. In other words, are people deliberately setting out to make letter fit more challenging in order to collect stylistic dividends in other areas?</p>
