    html: |-
      <p>Chris: <em>Initially, calt was for non-Latin scripts where typical type techniques were unable to adequately display the language.</em></p>
      <p>I don't think that is the case with the calt feature, Chris, although the statement is true of OpenType as a whole, in the sense that Microsoft originally developed the technology with a focus on complex scripts. If you look at the calt feature description in the OpenType Layout tag registry, you will see that it was registered by Adobe. When looking at the early registered tags, i.e. those registered by Adobe and Microsoft often prior to any actual implementation in either fonts or software, one can usually guess what the initial intent of the tag was based on who registered it. Adobe's tags largely cover features that they anticipated needing for fonts in their library, and the only non-Latin scripts they were dealing with at that time were East Asian. Microsoft's tags were much more focused on non-Latin fonts, but they tended, at that time, to define specialised tags for specific script purposes rather than generic tags that could be used in variable ways for different scripts (hence the dedicated Indic layout features).</p>
      <p>Also note that the calt feature, while on by default, may be turned off by the user, so it is ill-suited to situations in which a layout feature is needed 'to adequately display the language'. The calt feature is great for discretionary contextual variants, things that enliven or improve the display of text, but it shouldn't be relied upon for anything like basic text shaping of the sort that makes text decipherable.</p>
