    <p>I am working on a proposal for a talk and I wanted to get the up to the minute info - So, ( and assuming it doesn't violate an NDA!)...</p>
    <p>Are you, or do you know of anyone making text faces with contextual alternates to improve letter fit? This could be anything from ligatures beyond the call of Unicode, to Sliced off serifs, to even deeper changes in letterforms. </p>
    <p>I know many people are and have made Display faces that do this - I am asking specifically about Text faces.</p>
    <p>Thanks!</p>
