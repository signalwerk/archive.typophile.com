    date: 2008-01-10T02:38:00
    votes: null
    html: <p>Eben, there are many typefaces that do this to some small extent, but I don't think there are many that do so in a thorough, consistent manner, as i think you're wanting to find. What i think the best approach to implementing contextual alternates in this manner is to fix as many fit problems as possible before you begin fixing problems using kerning. so the fitting priorities would be to 1) ensure good fitting of default letterforms to avoid as many spacing problems as possible 2) once fitting is set, provide contextual alternates in as many places as possible to resolve fitting problems 3) as a final resort, use kerning to solve the most difficult problems. This is not to say that kerning is undesirable and may actually be a better option than 2 in many cases. in the most difficult cases 1, 2, &amp; 3 might need to be employed. of course i haven't had a chance to put this to the test in my current work yet, but i intend to experiment with this as much as time will allow for as i'm developing my typeface project this year.</p>
