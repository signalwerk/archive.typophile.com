      <p>I see another issue specific to German: We have lots of prefixes and compound nouns written in one word and you could argue that you should not use ligatures "across the border" of two parts of a word. In Fraktur this is even obligatory as far as I know.<br>
      Then, if you do not use ligatures in some cases an alternative, shorter f can be handy for combinations such as fl fi fb and so on. I personally would never include an fb or fk ligature in my fonts.<br>
      You could try something similar in English: whereas an fl ligature makes sense in "flying" it looks somehow odd to me in "briefly" because the fl does not really "belong together". But you can certainly argue whether visual, linguistic or consistency matters are most important.</p>
