      <p>Chris, you could save yourself some typing. Instead of...</p>
      <p>sub T’ [Y] by T.Lft;<br>
      sub T’ [V] by T.Lft;<br>
      sub T’ [W] by T.Lft;<br>
      sub T’ [Z] by T.Lft;<br>
      sub T’ [h] by T.Lft;</p>
      <p>...you can do this:</p>
      <p>sub T' [Y V W Z h] by T.Lft;</p>
      <p>Putting glyphs in brackets means, in effect, "any one of these glyphs". So, the brackets are unnecessary if there is only one glyph between them.</p>
