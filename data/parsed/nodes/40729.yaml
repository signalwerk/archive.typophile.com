    html: |-
      <p>I'm not sure that contextual alternates improve fit, as a general principle, although they can be used to that effect.</p>
      <p>Consider the comparison with kerning.<br>
      Sure, you can tighten up "holes" in many text combinations, but not all of them.<br>
      So doing it in some places may draw attention to where it's not done, which is counterproductive.<br>
      One has to be very thorough with the use of alternates.</p>
      <p>Nonetheless, like kerning, contextual alternates enables a new kind of fit, or colour, for text.</p>
      <p>Another issue is the very nature of type as standard shapes.<br>
      I suspect there is something useful to the perceptual process of reading in having character shapes consistent from one instance to the next, because if differences are detected, that may prompt a regressive saccade.<br>
      Nonetheless, type design is an agglomeration of deviations from basic forms, little "cheats" -- making the crossbar slightly higher than centre, vertical strokes thicker than horizontal, etc., etc.--to pre-empt the eye's susceptibility to optical illusion. So the question is, how much tweaking is too much, and like all good type design, it becomes a matter of the designer's discretion, not rule-of-thumb.</p>
      <p>***</p>
      <p>Eben, your subject is Softmachine's raison d'être.<br>
      Although primarily not conceived of as a text face, it does work as such, better than I would have expected.<br>
      Even colour is considered essential for text setting, and Softmachine achieves this -- though not in the usual manner. It is generally considered that even colour depends on a balance of variety in internal and external negative and positive space; however, Softmachine's consistency is in the uniformity of proximity spacing. IMO, this uniformity provides a sufficient matrix for readability. </p>
      <p>I conclude that a uniform matrix of some kind is required for reading, a background field upon which the variety of informational form can make sense. The eye/mind being flexible, it can adapt to different visual premises for typographic text (Hudson's Readerability Principle).</p>
