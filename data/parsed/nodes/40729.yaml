      <p>Eben, Yes. Froggy has several uses like that using calt. I have alternate T Y V Z g y glyphs to avoid holes and collisions.</p>
      <p>Here is a snippet of my calt code:</p>
      <p>feature calt { # Contextual Alternates<br>
      	 script latn; # Latin<br>
      	sub T' [Y] by T.Lft;<br>
      	sub T' [V] by T.Lft;<br>
      	sub T' [W] by T.Lft;<br>
      	sub T' [Z] by T.Lft;<br>
      	sub T' [h] by T.Lft;<br>
      	sub [Y] T' by T.Rgt;<br>
      	sub [V] T' by T.Rgt;<br>
      	sub [W] T' by T.Rgt;<br>
      	sub [C] T' by T.Rgt;<br>
      	sub [T] Y' by Y.alt;<br>
      	sub [T] V' by V.alt;<br>
      	sub [I] Y' by Y.alt;<br>
      	sub [I] V' by V.alt;<br>
      	sub [T.Lft] Y' by Y.alt;<br>
      	sub [T.Lft] V' by V.alt;<br>
      	sub [C] Y' by Y.alt;<br>
      	sub [Z] Y' by Y.alt;<br>
      	sub [Z] V' by V.alt;<br>
      	sub T.sc' [Y.sc] by T.sc.Lft;<br>
      	sub T.sc' [V.sc] by T.sc.Lft;<br>
      	sub T.sc' [W.sc] by T.sc.Lft;<br>
      	sub T.sc' [Z.sc] by T.sc.Lft;<br>
      	sub [Y.sc] T.sc' by T.sc.Rgt;<br>
      	sub [V.sc] T.sc' by T.sc.Rgt;<br>
      	sub [W.sc] T.sc' by T.sc.Rgt;<br>
      	sub [C.sc] T.sc' by T.sc.Rgt;<br>
      	sub [T.sc] Y.sc' by Y.sc.alt;<br>
      	sub [T.sc] V.sc' by V.sc.alt;<br>
      	sub [I.sc] Y.sc' by Y.sc.alt;<br>
      	sub [I.sc] V.sc' by V.sc.alt;<br>
      	sub [T.sc.Lft] Y.sc' by Y.sc.alt;<br>
      	sub [T.sc.Lft] V.sc' by V.sc.alt;<br>
      	sub [C.sc] Y.sc' by Y.sc.alt;<br>
      	sub [Z.sc] Y.sc' by Y.sc.alt;<br>
      	sub [Z.sc] V.sc' by V.sc.alt;<br>
      } calt;</p>
      <p>ChrisL</p>
