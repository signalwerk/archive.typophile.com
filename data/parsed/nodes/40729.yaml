      <p>Eben, I just shipped a beta version of a new typeface to a client. I can't show it yet, but it includes a lot of contextual lookups including many that are designed to improve fit. Technically it is a display face, in the sense that it is intended to use at larger sizes, but the contextual rules are worked out with text in mind. There are contextual substitutions for fit in Latin, Greek and Cyrillic. In the Latin and Cyrillic these involve variants with entry serifs removed for use after certain letters (f,g,r,x,y); in the Greek, there are variants of pi, sigma and tau with shorter horizontal extensions to reduce the white space between certain combinations of letters. [This is only scratching the surface of what this font does though: the compiled font is almost 2MB and 40% of the font size is taken up by the GSUB table. There were times working on the contextual rules when I thought my head might explode.]</p>
      <p>Si mentioned Tom Milo's work with Arabic. Regarding fit, you might take a look at his illustration of the ruqah style on page 125 of the <em>Language Culture Type</em> book, showing five different variations of the same words, each of a different horizontal length. Obviously, this suggests interesting solutions for justified text.</p>
      <p>Tom asked me a very similar question to yours at a Unicode conference a couple of years ago, wondering if there were any types that applied variation for fit to the Latin script. At the time I wasn't aware of any, other than the above mentioned display face that I was already working on at that time.</p>
