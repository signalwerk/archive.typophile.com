    html: |-
      <p>Eben: <em>what was the reason for your project’s contextual variations?</em></p>
      <p>There are several different classes of contextual variations in the new display face, but the ones that relate most directly to the topic of this thread either remove serifs selectively to avoid ugly combinations, or reduce the size of word-internal white spaces, or both. The design is based on an expansion stroke model, with some natural variation in the presence/absence of serifs anyway (the ascenders in the basic style do not have serifs, for example, following the French rondo model), so removing serifs and changing the way strokes start makes more sense than merely shortening the serifs.</p>
