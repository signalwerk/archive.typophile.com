      <p>John, <em>"...the exchangeables in ClearType involve different currencies...."</em><br>
      You mean the addition of 'color' to a 'b&amp;w' specification? otherwise, No comprendo. The 'exchange rate' may be different, and the 'granularity' may be reduced, but the issues are identical in all Latin text - big things, little things, inside, outside, black space, white space &amp; round-eyed brains.</p>
      <p><em>"...to handle fit without knowing whether subpixel positioning..."</em><br>
      ...is to mentally fuse rendering and layout — something I've already defused to prove cleartype non-useless. </p>
      <p><em>"...then all things, including contextual variants, should be on the table."</em><br>
      And to paraphrase from <em>Jaws</em>, you're gonna need a bigger table. </p>
      <p>Read Eriks, not to mention our typographic past, carefully. fi fl ch ck tz. What do they have in common? A stroke with a tiny remainder, then a stroke (or significant remainder) following. cfijklrstvwyz plenty-trouble. abdeghmnopqu not so much trouble. Which leaves the 'x' factor. :-)</p>
      <p>Why do you think I'm 'so opposed' to Kevlar's letter-only-reading theory and them thar read-a-hillbillies insistence on readability as 'exclusively' a software engineering problem? lol, It's certainly not because my opinion counts outside of mine own clientele — it's because I can count in 'alphabet arithmetic' and apply it to the issue, everywhere it exists. You do to, if you think about it.</p>
      <p>Tim, <em>"an fl ligature makes sense in “flying” it looks somehow odd to me in “briefly” because the fl does not really “belong together”</em><br>
      You're young, so I'll not give up, but honestly I think that's not real.</p>
      <p>Cheers!</p>
