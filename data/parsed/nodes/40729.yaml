    votes: null
    html: |-
      <p>Chris, re. the 'calt' feature: <em>John, Is that because some applications don’t support it well or because it can’t perform the needed functions?</em></p>
      <p>The 'calt' feature is discretionary. It is recommended to be on by default but an app with a decent OpenType Layout UI will make it possible for the user to turn off the calt feature (as e.g. InDesign does). You do not want to associate any layout that is necessary for normal display of a complex script language with a feature that can be turned off, because turning off the feature would render the text unreadable.</p>
      <p>Aside from that, though, most complex scripts require a number of different features for language shaping and, typically, interaction between those features and the shaping engine. In theory one could use something like the 'calt' feature, only permanently active, to perform Arabic script shaping. But it is faster (character processing is faster than glyph processing) and more reliable to allow the shaping engine to analyse the text and call appropriate features such as 'init', 'medi' etc, rather than have the font analyse the glyph string and perform contextual lookups.</p>
