      <p><cite> hmmm. that’s not really how i see the issue. </cite></p>
      <p>I didn't mean to imply that you see the issue as a 'pesky problem'. If that's the impression that you or anyone else had I apologize for putting words in your mouth.</p>
      <p>My intent was to rhetorically contrast what I think we have to begin with - which is looking at the problem from the position we occupy now in which contextual shapes are a new idea/opportunity that we are starting to wrap our heads around. A position in which contextual shapes is a question that is likely to be considered near the end of a font's development when we find we could alter our basic shape to solve a problem, or kern or both. Or we could make an Alt. And maybe Kern it if it's used more than once. </p>
      <p>This would be in contrast with a point that we might occupy later where practical experience allows us to integrate what we have learned much earlier on in new fonts design. Maybe even at the earliest moments where we are sketching out ideas. Once we are doing that we might start to include new less obviously problematic letter pairs in our thinking because context has become something we take for granted not something exceptional.</p>
      <p><cite> overagressive </cite></p>
      <p>Sorry, I didn't mean to cast judgement there either; just to characterize one process as more confident/intgrated in it's approach than another. In other words I didn't meant to use aggressive in the pejorative sense of the word.</p>
      <p><cite> i see the use of contextual alternates as a possible solution to problems in notan/bouma formation.</cite><br>
      Agreed!</p>
      <p><cite> Edward DeBono </cite></p>
      <p>I am pretty sure that old solutions will keep working! ;-) </p>
      <p>On the other hand I also think that people gravitate to what feels good and it may be that like real wood vs fake the subtle improvements that I suspect can be brought about by using contextual shapes in a body of text may simply be more pleasant and come to dominate because they are feel better. Maybe. Contextual shapes won't ever be the only factor in what feels good in text but it seems to me like it could be a factor in time.</p>
      <p>Thanks Chris!</p>
