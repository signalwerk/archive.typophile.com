      <p>BTW. The talk I am planning on giving is in Buffalo at Typecon. It will be my framing of the question what Contextual Alternates can do for Text. Right now my plan is to give an overview of the question ( probably not soooo different from what I have written here ) and then go through what I currently think are leading candidates to consider using in a text face using examples from the scribal tradition, from lettering, stone carving, and of course what has been done already in Opentype. The deadline for submitting materials is coming up so I am gathering up what I have. Lida Cardozo has agreed to help me as well which is very exciting.</p>
      <p><cite> Old farts like me won’t be the ones who make the difference though. </cite></p>
      <p>I don't know about that. You have seized the bull by the horns as far as I can see! </p>
      <p>But I do agree that especially when it comes to text it is hard to shift from an old reliable system/approach into a new and not fully explored area. And when you are making text it's also appropriate worry that what you are doing may end up being showy rather helpful. So with text we are culturally hemmed in by the apparent success that exists ( which is I think substantial! ), and the real danger of the new upsetting the apple cart. Still, obviously I think it's worth the attempt.</p>
