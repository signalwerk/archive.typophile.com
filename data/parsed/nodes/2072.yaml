    html: "<p>Daniel, just wanted to say stay away from Didones unless you're setting them at pretty large sizes. I have to contend with Bodoni Book as part of my <a href=\"http://www.vpl.ca\">library's</a> CI. <br> <br>I've found that I really can't go any smaller with the logo at this site without it looking blurry and nasty and illiciting strong negative comments from many quarters. So my experience is it's less about coldness than resolution of the fine serifs and radical think and thins at smaller sizes. <br> <br>BTW: If you stare at the line 'Vancouver Public Library', the words appear to grow in size with 'Library' beginning to look positively large compared to the 'Van'. An optical illusion that makes me crazy. <br> <br>Let us know how your refinements go. <br> <br>Jon</p>"
