    html: <p>As for the prevalence of Georgia on the web, I believe weblogs using Movable Type or Blogger as backend use Georgia in their default CSS stylesheets. So there's a good bit of it out there, but that doesn't necessarily make it bad.  <br> <br>IMO, having a well-designed page that mimics a printed page will look outstanding with Georgia as body text, certainly better than any other commonly-available Web font.</p>
