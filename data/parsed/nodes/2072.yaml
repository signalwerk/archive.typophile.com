    html: <p>Jon, thanks for your suggestions.  I'm pretty familiar with CSS; the layout you see is pretty close to CSS 2.0 and XHTML strict validation.  It's also tableless, by the way.   <br> <br>The problem I have is that Georgia is the font used by just about everyone today.  There is no other font that works as well for screen display, which is why I use it for the body text.  But I'm also attempting to create some sort of semi-unique look, and in my mind, Georgia is not the way to go with headings if that's my goal.  I liked the way Bookman is just slightly reminiscient of typewriters, and how it contrasts with the more flowing, elegant Georgia. <br> <br>But on the other hand (and this is a powerful counter indeed) i really don't know jack about typography.  Any other reasons besides cross-compatibility that you would recommend Georgia?</p>
