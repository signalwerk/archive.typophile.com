  - id: 16414
    user: 2332
    date: 2003-11-20T08:47:00
    date_raw: 20 Nov 2003 — 8:47am
    votes: null
    html: "<p>Daniel P: I think that specifying Bookman as first choice is okay, but then follow with Georgia and serif of Georgia, Times, serif. <br> <br><i>The problem I have is that Georgia is the font used by just about everyone today. There is no other font that works as well for screen display, which is why I use it for the body text. But I'm also attempting to create some sort of semi-unique look, and in my mind, Georgia is not the way to go with headings if that's my goal.</i> <br> <br>In a case like this you are on the horns of a dilemma. I don't think that typographic branding or identity can be accomlished easily on the web without the use of graphics, Flash or SVG. <br> <br>Consistency and pleasant on-screen presentation <b>can</b> be achieved in your type and you can rely more on your colour scheme, page layout, and page title header for ID and brand distinction. <br> <br>If preserving Bookman is that important and you have about 10-20 titles to set each quarter, I think that it's reasonable to make title GIFs by hand. As long as you are aware of the threshold that Hrant has indicated and can live with that for an odd user or two. <br> <br>In a case like this, plan a single title block size  (that maybe allows for two lines) and build all your titles as layers in the same document over time. It will help speed you production and maintain consistency. <br> <br>I was just reviewing your site, and I like its look. It looks educated but friendly in a newspapery kind of way with the all cap titles. And in truth, using Georgia doesn't make me think I'm at any other site than The Metatastic Whatnot. <br> <br>Jon (the over-explainer)</p>"
    html_clean: "<p>Daniel P: I think that specifying Bookman as first choice is okay, but then follow with Georgia and serif of Georgia, Times, serif. <br> <br><i>The problem I have is that Georgia is the font used by just about everyone today. There is no other font that works as well for screen display, which is why I use it for the body text. But I'm also attempting to create some sort of semi-unique look, and in my mind, Georgia is not the way to go with headings if that's my goal.</i> <br> <br>In a case like this you are on the horns of a dilemma. I don't think that typographic branding or identity can be accomlished easily on the web without the use of graphics, Flash or SVG. <br> <br>Consistency and pleasant on-screen presentation <b>can</b> be achieved in your type and you can rely more on your colour scheme, page layout, and page title header for ID and brand distinction. <br> <br>If preserving Bookman is that important and you have about 10-20 titles to set each quarter, I think that it's reasonable to make title GIFs by hand. As long as you are aware of the threshold that Hrant has indicated and can live with that for an odd user or two. <br> <br>In a case like this, plan a single title block size  (that maybe allows for two lines) and build all your titles as layers in the same document over time. It will help speed you production and maintain consistency. <br> <br>I was just reviewing your site, and I like its look. It looks educated but friendly in a newspapery kind of way with the all cap titles. And in truth, using Georgia doesn't make me think I'm at any other site than The Metatastic Whatnot. <br> <br>Jon (the over-explainer)</p>"
