    html: "<p>You are able to specify a range of fonts in decreasing order of preference in your stylesheet, so when you specify your font (please forgive me I haven't tried to read your site's code or stylesheets) you do something like: <br> <br>p { <br>font-family: Bookman, Georgia, serif; <br>font-size: 1em; <br>line-height: 1.35em; <br>} <br> <br>In this example: everything inside a paragraph tag will be Bookman if available, Georgia if Bookman isn't, and whatever the browser understands is its default serif type if the first two aren't available. The text would be set at the browser's default size and the leading is 1.35 times the browsers default text size. <br> <br>Personally I would specify Georgia, serif for everything and leave it at that. I wouldn't get into automated graphics unless you have the technical chops and patience to do so (though I know from experience that automated graphics can be very useful). <br> <br>One of the hardest lessons for me to learn is that typography on the web, even with powerful <a href=\"http://www.webstandards.org\">web standards</a> such as CSS, is that it's a thing that's best controlled by making suggestions about what you prefer, rather than imposing your will.</p>"
    html_clean: "<p>You are able to specify a range of fonts in decreasing order of preference in your stylesheet, so when you specify your font (please forgive me I haven't tried to read your site's code or stylesheets) you do something like: <br> <br>p { <br>font-family: Bookman, Georgia, serif; <br>font-size: 1em; <br>line-height: 1.35em; <br>} <br> <br>In this example: everything inside a paragraph tag will be Bookman if available, Georgia if Bookman isn't, and whatever the browser understands is its default serif type if the first two aren't available. The text would be set at the browser's default size and the leading is 1.35 times the browsers default text size. <br> <br>Personally I would specify Georgia, serif for everything and leave it at that. I wouldn't get into automated graphics unless you have the technical chops and patience to do so (though I know from experience that automated graphics can be very useful). <br> <br>One of the hardest lessons for me to learn is that typography on the web, even with powerful <a href=\"http://www.webstandards.org\" class=\"link-external\">web standards</a> such as CSS, is that it's a thing that's best controlled by making suggestions about what you prefer, rather than imposing your will.</p>"
