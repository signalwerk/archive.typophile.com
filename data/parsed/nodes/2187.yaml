    date: 2003-12-29T09:06:00
    date_raw: 29 Dec 2003 — 9:06am
    votes: null
    html: "<p>Hrant:<i>...if I were a Japanese calligrapher (something twice removed from reality :-) I would start a new school were you draw hair-thin outlines, not bodies.</i> <br> <br>This still strikes me as a highly artificial way of arriving at your precious notan: you need to know exactly what the filled in result is going to look like even as you are drawing the outlines. It seems to me that there is much to be said for working directly with the notan, i.e. in solid black and white, and your objection to stroke-based processes doesn't necessarily preclude other methods. A couple of possibilities: <br> <br>1. Design type on black scratchboard, removing the surface to expose the white area in and around the black letterforms. <br> <br>2. Design type on black paper using white paint to define the space around and within the letterforms.</p>"
  - id: 17511
    user: 1947
    date: 2003-12-29T09:32:00
    date_raw: 29 Dec 2003 — 9:32am
    votes: null
    html: <p>I dont no nutin about this notan, but I wonder if any of you have ever watched a master Japanese or Chinese calligrapher write out a poem.  <br> <br>The ones I have watched stand there for several moments meditating on the paper in front of them, and then abruptly begin writing. Its over almost before it starts, pure expression and emotion from the master through the brush to the paper. Hardly a moment to think. <br> <br>Just an observation. <br> <br>Now back to the nothing of notan.</p>
  - id: 17512
    user: 1250
    date: 2003-12-29T10:45:00
    date_raw: 29 Dec 2003 — 10:45am
    votes: null
    html: "<p>&gt; you need to know exactly what the filled in result is going to look like <br> <br>Here you're touching on what might be called \"arbitrariness\", and this is in fact one reason some people love chirography: it brings a tangible order to creation, since a physical tool (either in the first-hand or virtually) helps you decide where things end up. That's why I say that chirography is a great practical shortcut. <br> <br>But the catch is two-fold: <br>1) There's no reason to believe that the reader needs what the hand favors. <br>2) Control shouldn't be the objective. Letting go -accepting the arbitrariness of it all anyway- helps you escape the confines of chirography. <br> <br>The reason the \"moving front\" precludes good notan (a notan that the <i>reader</i> needs) is simply that the White is made subservient to the Black (and it doesn't matter what color the two are). It is made subservient to satisfy the creator, but at the expense of the user. <br> <br>The tricky thing though is that -in type design- you can't create the White the same way as you create the Black. In Latin type design especially with its \"atomic\" Blacks it's hard to take the White seriously: it exists in a half-world - some of it is internal to the Black, but some of it takes shape only when multiple Blacks come together - something that happens outside the control of the type designer. This complexity makes chirography even more appealing... but it's still a cop-out. <br> <br>-- <br> <br>James, I've only seen oriental calligraphy on TV, but I respect it because it doesn't pretend to be anything besides self-expression - Art. It doesn't pretend to be very good at conveying the literal text. The same goes for that Jack Stauffacher stuff*: I don't mind people setting very large type in color at an angle and slamming the letterpress as long as they admit to doing it as self-expression. <br> <br>* <a href=\"http://www.creativepro.com/story/feature/20603.html\" target=\"_blank\">http://www.creativepro.com/story/feature/20603.html</a> <br> <br>BTW, oriental calligraphers certainly don't think notan is nothing. <br> <br>hhp <br></p>"
