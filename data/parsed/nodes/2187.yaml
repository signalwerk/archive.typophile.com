  - id: 17501
    user: 1353
    date: 2003-12-19T15:06:00
    date_raw: 19 Dec 2003 — 3:06pm
    votes: null
    html: "<p>Hrant, <br>&gt; I guess it's sort of \"metaphysical\", <br> <br>Yes, it is. <br> <br>&gt; but at least you can show examples in black &amp;  <br>&gt; white, so to speak!  <br> <br>Then please show us some examples of good and bad notan! (best in a new thread ;-) <br> <br>&gt; chirography says that the two edges of the black <br> <br>Pardon the ignorance: what are the 'two edges of the black'? <br> <br>&gt; [...] Without his \"help\", <br> <br>I haven't read his 'Letterletter' (yet), but I've heard that he is less dogmatic than you consider him to be... <br> <br>BTW, you're using this 'notan' concept just to deny chirographic type. First, I think you don't need to go that far to do that, and second, I'd like to <i>see</i> an example of (what you think it is) <i>good</i> notan. <br> <br> <br>John: <br>&gt; Notan is about 'dark and light', not just the  <br>&gt; extremes of black and white.  <br> <br>Correct. I'm with my Japanese dictionary here, and 'no-tan' is defined as 'light and shade'. 'No' means dark, dense, while 'tan' means shallow. It's a density-thing, not a duality-thing...</p>"
  - id: 17502
    user: 1250
    date: 2003-12-19T15:18:00
    date_raw: 19 Dec 2003 — 3:18pm
    votes: null
    html: "<p>Eduardo, I will write an article on this, not just a post. Patience, grasshopper!  ;-) <br>(And your instincts are right: the refutal of chirography is one of the lesser things notan is good for.) <br> <br>I will just point out this to clarify for now: in chirography, the \"two edges of the black\" are related by their being at the extremes of the moving broad pen. <br> <br>-- <br> <br>The essential problem with Noordzij isn't that he's deceptive or unintelligent (in fact he seems to be the opposite of those things), it's that he has no respect for typography. As Kinross has conveyed in a now-obscure article, Noordzij sees printing as a fall (compared to handwriting). And that's actually reflected in my own \"micro-impressions\" of his writings: his opinions make sense in proportion to their <i>distance</i> from type. <br> <br>hhp <br></p>"
