    html: "<p>Here are some early sketches of one of my typefaces  <br>(Coquette): <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/21251.jpg\" alt=\"coquette1\"> <br> <br>You can tell I was in a boring meeting when I did this one  <br>(\"Information Gathering\"--ha!). I had a full-time job at the  <br>time. I was supposed to be taking notes, but I usually did  <br>doodles like this instead. <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/21252.jpg\" alt=\"coquette2\"> <br> <br>Both of these are actual size (at 72dpi) and are typical of  <br>the size I work at when I'm working on an idea for a  <br>typeface. I use to work larger, but I found that it is easier to  <br>get the proportions I want at this size, maybe because it's  <br>closer to the size it will be used. My sketches don't get  <br>much tighter than this either. I scan in the sketches and use  <br>them as a rough guide when I redraw the characters in  <br>the computer. <br> <br>Here are some unfiled sketches: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/21253.jpg\" alt=\"sketches\"></p>"
