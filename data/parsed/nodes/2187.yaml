    html: <p>&gt; [...] one of the most widespread and obvious  <br>&gt; applications of notan in Japanese aesthetics is  <br>&gt; calligraphy. <br> <br>So Hrant completely distorted the original meaning of this word?... Anyway, if 'notan' = 'relationship between black and white', then it's obvious to me that good notan for Japanese is one thing, good notan for Latin is another completely different thing, almost the opposite. <br> <br>BTW, what's the difference between 'notan' and 'color'?</p>
