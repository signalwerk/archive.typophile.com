    html: "<p>I don't do much sketching, as I tend to work out stuff directly on the computer. But here is a picture of my sketches for the SBL Hebrew typeface. This is the first time I've used this approach: writing letters with a broad-nib pen. This was mainly of value in determining good proportions and for getting the relative weight of stems correct (especially the median weight of diagonal strokes that is important for Hebrew because of the steep ductus). If you compared these sketches to the final font, you would find that a lot of details are different, but the overall proportions of the letters are about the same. <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/21171.jpg\" alt=\"SBL Hebrew sketches\"> <br> <br>You should take a look at Jeremy Tankard's <a href=\"http://www.typography.net\">website</a>. In the 'history' section for each typeface, he shows pages from his notebooks.</p>"
