  - id: 17504
    user: 1262
    date: 2003-12-19T18:34:00
    date_raw: 19 Dec 2003 — 6:34pm
    votes: null
    html: '<p><i>I will just point out this to clarify for now: in chirography, the "two edges of the black" are related by their being at the extremes of the moving broad pen.</i> <br> <br>In broad-nib chirography, yes. A more general description would be that, in chirography, the edges of the black are determined by the nature of the writing tool. If the writing tool is a pointed split nib or, referring back to Japanese calligraphy, a brush, the relationship of the edges of the black are determined by pressure. The key aspect of chirography is that it is made up of strokes, not outlines, so the relationship of the edges of the black is always the relationship of two sides of a single stroke.</p>'
