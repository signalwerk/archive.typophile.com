  - id: 17496
    user: 1250
    date: 2003-12-19T09:19:00
    date_raw: 19 Dec 2003 — 9:19am
    votes: null
    html: "<p>Distorted? If I'm using the word confusingly, let me know and I'll find another - I even enjoy that! But nobody can own a concept (except if you have a beefy legal department, I guess), and when I say notan I mean the idea that Black and White are part of one thing, and in a given purpose their relationship has to make sense. Certainly favoring the Black makes sense in calligraphy for practical reasons, but in digital type design (where you make outines) they are essentially of equal importance - even though they exist in different forms: the Black is defined atomically, while the White is defined partly atomically (the insides of letterforms) and party through groupings of multiple letters. <br> <br>As for the difference between Japanes and Latin type design, certainly optimal notan is different for each (partly due to the current state of each on the evolutionary path away from chirography) - but I don't think it's fundamentally different. An actual fundamental difference is between display and text type, both of which of course exist in both scripts. <br> <br>In text design, good notan is [mostly] good boumas. <br> <br>hhp <br></p>"
  - id: 17497
    user: 1353
    date: 2003-12-19T10:26:00
    date_raw: 19 Dec 2003 — 10:26am
    votes: null
    html: <p>&gt; If I'm using the word confusingly [...] <br> <br>Well, sometimes it's really confusing, maybe because <br>it's too abstract in your definition? <br> <br>&gt; But nobody can own a concept [...] <br> <br>Ok, I wasn't trying to accuse you of anything... Sorry. <br> <br>&gt; when I say notan I mean the idea that Black and  <br>&gt; White are part of one thing, and in a given  <br>&gt; purpose their relationship has to make sense. <br> <br>I guess I understand it, but, again, isn't this too <br>generic? <br> <br>&gt; in digital type design (where you make outines)  <br>&gt; they are essentially of equal importance [...] <br> <br>Ok, agreed. <br> <br>&gt; As for the difference between Japanes and Latin  <br>&gt; type design, certainly optimal notan is different <br>&gt; for each (partly due to the current state of each <br>&gt; on the evolutionary path away from chirography) - <br>&gt; but I don't think it's fundamentally different. <br> <br>But, the fact that Latin text requires 'even color' (space <br>between letters = space inside counters) while in  <br>Japanese any attempt to evenness is impossible; isn't <br>this a fundamental difference too (regarding notan)? <br></p>
  - id: 17498
    user: 1250
    date: 2003-12-19T11:00:00
    date_raw: 19 Dec 2003 — 11:00am
    votes: null
    html: "<p>&gt; it's too abstract in your definition? <br> <br>Let me try this: <br>Notan is the relationship between but also the unity of positive and negative spaces. Like Yin/Yang. <br> <br>I guess it's sort of \"metaphysical\", but at least you can show examples in black &amp; white, so to speak! <br> <br>&gt; isn't this too generic? <br> <br>If by \"generic\" you mean \"too theoretical\", then I would point to a gem of an example that brings it all into the real world: chirography says that the two edges of the black must be related - this means you can't really contol notan fully - this can only be done through <i>outlines</i>. Chirography precludes optical effects, trapping, and all those <i>typographic</i> subtleties. It's kiddie type design. <br> <br>If you mean \"obvious\", I would raise a caution: Noordzij talks the talk when it comes to notan, but his \"moving front\" clearly violates notan's primacy (in the realm of type if not chirography). It's sweetly ironic that the wonderful formalization of chirography performed by Noordzij allows one to fight it better. Without his \"help\", I for one wouldn't have such a solid explanation of how chirography fails. <br> <br>&gt; Latin text requires 'even color' .... while in <br>&gt; Japanese any attempt to evenness is impossible; <br> <br>Hey, you've make me realize something great! Japanese is a great counterpoint (pardon the pun) against mainstream beliefs about what Latin type should be: Totally even color* is bad for readability (no matter the writing system). Sure Japanese is much harder to enslave in terms of even color, and maybe that makes it \"snap out of it\" and not suffer under such a fallacy. The uneven color in Janapese is actually a huge functional benefit. Latin has yet to grasp that (although it has had a hint of it in the past, like in some Eastern European efforts). <br> <br>* BTW, I forgot to address a previous question of yours: the difference between color and notan is that the former is merely a measure of darkness. The idea of Texture though is another animal, but you could say it fits within notan nicely. As for Rhythm, there is none. <br> <br>-- <br> <br>Something else about the origins of the term \"notan\": as far as I know the Japanese use it within calligraphy, rock gardening, and many other forms of expression. I would propose that it's not well suited to any calligraphy that needs to convey textual content, and if I were a Japanese calligrapher (something twice removed from reality :-) I would start a new school were you draw hair-thin outlines, not bodies. <br> <br>hhp <br></p>"
  - id: 17499
    user: 1262
    date: 2003-12-19T14:09:00
    date_raw: 19 Dec 2003 — 2:09pm
    votes: null
    html: <p><i>...if 'notan' = 'relationship between black and white'...</i> <br> <br>Actually, 'black and white' is misleading. Notan is about 'dark and light', not just the extremes of black and white. One of the most important traditional uses of notan is in <i>sumi-e</i> painting, which typically involves a full range of greys.</p>
