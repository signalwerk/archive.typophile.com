    html: "<p>No, not the letterforms, just the shading pattern. <br> <br>Speaking of shading in the context of sketching type, Gerrit Noordzij discusses a kind of shading as a sketching technique on pages 51-52 of <i>Letterletter</i>: <br> <br><i>The moving counterpoint is conveniently represented by zigzag shading which evokes the shape very quickly. Different levels of articulation are reached with different densities of shading. The effectiveness and speed of this method can persuade students to abandon drawing outlines, and only then can design start. The speed also encourages them to make the alternatives they would otherwise only talk about. So we got used to a practice of discussing design by quickly shading the subjects of the discussion.</i> <br> <br>I've experimented a little with this technique, and think it has a lot of value. Earlier this year, I watched Erik van Blokland sketch some letters in this way -- he's had a lot more practice at it than I have -- and was impressed by the speed with which one got a sense of letter as a solid thing.</p>"
  - id: 17474
    user: 1250
    date: 2003-11-25T22:26:00
    date_raw: 25 Nov 2003 — 10:26pm
    votes: null
    html: "<p>But of course GN's moving point/counterpoint is a direct violation of notan. By tying the two edges of the Black, you fail to fully control what <i>really</i> counts in perception: the boundary between Black and White. If we mean to take the needs of the reader seriously, and we carry the GN theory to its terminus, its only justification is in effect WRBWWRM - and we know that's bollocks. <br> <br>Any simulation of a tool (a broad-nib pen) that's not actually used towards the given functionality (reading) is not Design, it's Art. It's a combination of insular self-expression and ideological lethargy. Any disciple of GN can make wonderful, usable fonts (in fact they would have an advantage in doing so, as so many Dutch designers have demonstrated). But he can never mark true cultural progress. <br> <br>Do you prefer the deep ocean, or the fish market? <br> <br>hhp <br></p>"
  - id: 17475
    user: 1262
    date: 2003-11-25T22:43:00
    date_raw: 25 Nov 2003 — 10:43pm
    votes: null
    html: "<p>Hrant, I considered leaving out the single mention of the moving counterpoint in my quote from Noordzij, because I don't think one has to accept that aspect of his ideas in order to appreciate the usefulness of shading as a technique in sketching type. It isn't even necessary to sketch in a way that represents the moving counterpoint. <br> <br>You might consider this: shading letters produces immediate notan, while drawing outlines certainly does not. You can shade letters at a comfortable size -- a couple of inches tall for caps, say -- and immediately step back with a reducing glass* and get a sense of how they are going to work as type. <br> <br>* I thoroughly recommend all type designers invest in a reducing glass. Fiona Ross pulled one out of her bag when we were looking at some 144pt Arabic sketches a couple of years ago: it was wonderful because one could actually get a sense of how the letters were going to work at smaller size. Very useful device: almost as essential as a linen tester.</p>"
  - id: 17476
    user: 1250
    date: 2003-11-26T07:44:00
    date_raw: 26 Nov 2003 — 7:44am
    votes: null
    html: <p>&gt; appreciate the usefulness of shading as a technique in sketching type. <br> <br>There's no doubt it's useful. It saves time and nicely abstracts the presence of the hand in the forms. But it ties you to the hand, so the results are regressive. The reader's eye never asked for help from the writer's hand. <br> <br>As for notan, on paper shading gets you to a black shape faster, but there's good notan and bad notan. The act of shading creates a relationship between the two "moving points" at the extremes. You cannot have both that and a sound relationship between the black and the white. You cannot for example account for optical scaling or trapping. But most of all you're limiting yourself in structure. It's like exploring by hugging the coast of your own continent, while the liberation from the hand -and hopefully the subsequent reliance on the true nature of readability- is the astrolabe that allows the discovery of new continents. <br> <br>The reason to draw outlines (and then fill them in, sure) is simply that that's what the represents what the reader sees. Shading represents more what the designer wants to express. <br> <br>BTW, didn't you say you generally draw directly on the computer anyway? <br> <br>&gt; It isn't even necessary to sketch in a way that represents the moving counterpoint. <br> <br>Are you sure? How would somebody like van Blokland justify the deviation? They would see it as "arbitrary". <br> <br>BTW, what's the stronger reduction glass you've found? <br> <br>hhp <br></p>
  - id: 17477
    user: 1262
    date: 2003-11-26T11:30:00
    date_raw: 26 Nov 2003 — 11:30am
    votes: null
    html: "<p>I disagree that shading, per se, necessarily ties you to either abstracting the presence of the hand in the forms or to any fixed relationship between the moving edges of the extremes. Noordzij uses shading in a particular way, but it is far from the only way. I'm interested in shading as a technique to put down ideas quickly, not to force my ideas into a particular model. Yes, I generally draw directly on the computer, but when I'm sitting in a cafe I sometimes draw letters and work out ideas that I later implement on the computer, usually without reference to the drawings, which are part of the thinking process not capital-D Designs. <br> <br> <br>My reducing glass isn't particularly strong: it's a typical artist lense. Still very useful, especially if your office isn't big enough to stand far enough away from your screen to judge a typeface <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
