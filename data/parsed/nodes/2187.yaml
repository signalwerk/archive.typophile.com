    html: <p>It's not just funny, it's hilarious. <br>I guess the Japanese make mistakes too - just look at Pearl Harbor. <br> <br>On the other hand, you could say that good notan depends on the purpose of the given design - like how there's a difference between display and text type. So you could say that notan in calligraphy (something serving to convey humanity expressively) has different requirements than notan for a text font (something serving to convey textual content smoothly). <br> <br>hhp <br></p>
