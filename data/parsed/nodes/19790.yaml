  html: |-
    <p>I’m looking for something like this. The G looks a bit like Base-9, but everything else is way off. I have an idea, that I’ve seen the font before, but nothing pops up in my mind.</p>
    <p>See it here: <a href="http://www.papermag.com/modules/archive/uploaded_images/1307_ct_kal_penn.jpg" title="http://www.papermag.com/modules/archive/uploaded_images/1307_ct_kal_penn.jpg">http://www.papermag.com/modules/archive/uploaded_images/1307_ct_kal_penn...</a></p>
    <p>or</p>
    <p><a href="http://www.papermag.com/images/comingsoon.gif" title="http://www.papermag.com/images/comingsoon.gif">http://www.papermag.com/images/comingsoon.gif</a></p>
    <p>Regarding Base-9 (and base-12) I must say I really like the font, when all letters are capitalized, but I don’t quite like it, when it’s lower case. I feel the the upper-cases coould be put together with something else. Something similar but without the pointy/sharp ends. Any ideas on how an alternative lowercase base-nine could look (and what the name of that font would be)?</p>
    <p>Thanks</p>
