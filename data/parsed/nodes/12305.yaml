    <p>I am pleased to announce the opening of my <a href="http://www.omine.net/" rel="nofollow">personal foundry</a>.<br>
    Three new typefaces are available for now, exclusively in the OpenType format.</p>
    <p><em>The typefaces</em><br>
    <a href="http://www.omine.net/maest.htm" rel="nofollow">Maest</a> is an unusual script typeface constructed with straight lines. It features 4 styles of figures (tabular lining, tabular oldstyle, proportional lining, proportional oldstyle), swash capitals, ending forms, f-ligatures, and 3 weights (from regular to black).</p>
    <p><a href="http://www.omine.net/bunker.htm" rel="nofollow">Bunker</a> is a versatile stencil type family with lowercase characters and a extensive character set that covers the Latin, Central European, Turkish and Baltic codepages. This type family is comprised of 4 interchangeable styles (a character occupies the same advance-width in all of the fonts) and features 4 styles of figures.</p>
    <p><a href="http://www.omine.net/gotica.htm" rel="nofollow">Gotica Lumina</a> is a new blackletter. The soft version features gentle contours that contains no corners. The sharp version, more suitable for display usage, is more rigid and slightly lighter than the soft one. There is an alternate font* for each style, and all fonts have 4 styles of figures, standard ligatures and discretionary ligatures.</p>
    <p>* The alternate characters are also available in the "main" font, through the "salt" feature, but considering the current general lack of support to this specific OpenType feature, alternate fonts have been made available.</p>
    <p><em>50% off until May 31!<br>
    Promotional price valid for Gotica Lumina, Bunker and Maest.<br>
    Check the prices by following the links above or directly at <a href="http://www.myfonts.com/foundry/ominetype/" rel="nofollow">MyFonts</a>.</em></p>
