      <p>Frode, I did have more subtle versions in mind, but I figured that subtlety doesn't work that well on the internet. You get from 5Star what we are experiencing here in the US: completely hallucinatory arguments. </p>
      <p>The individual mandate was a Republican idea, backed by Republicans for 20 years. The idea was to find a way to cover the uninsured while keeping a privately run, insurance-company based health care. </p>
      <p>Upon Obama backing it, Republican Senators who had sponsored bills with it, repeatedly, suddenly discovered that it was against freedom and started voting against it and screaming with outrage. </p>
      <p>They didn't introduce any new arguments, they just flipped on a dime for political reasons. Now Justice John Roberts, the notoriously conservative Chief Justice of the supreme court specifically argued that the individual mandate was *not* an impingement on individual freedom, because it was just a tax penalty, and did not affect a person's choices other than that. </p>
      <p>Roberts was exactly right. And the act does not tell anyone which insurance to buy, which doctor to see, etc. It is largely a free-market system, with increased regulation to lower costs, and a subsidy to cover those left out in the current system. It is no way a 'government takeover of health care,' such as England's National Health Service—which by the way works very well for half the price, and covers everyone. </p>
      <p>The fact that the super-conservative Chief Justice argues that it's not a 'government takeover' will have no influence on people like 5Star, though. It's all slogans and hysteria. Reality has nothing to do with it. </p>
      <p>I've been posting reasoned arguments on my blog for a bit over a year an a half. This blunt-force unfunny satire has got more than double the hits in 6 hours than anything I've posted. Not good, but there is the reality we're dealing with here in the US.</p>
