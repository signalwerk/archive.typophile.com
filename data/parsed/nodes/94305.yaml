      <p>In the United States, they passed a law that said that health insurance companies couldn't "discriminate" against people who were HIV-positive.</p>
      <p>Since insurance is a private agreement between two parties, and is therefore based on actual risk, this meant that it was no longer possible for an individual to purchase health insurance at a reasonable rate. Only employer health plans continued to exist.</p>
      <p>The government brought in COBRA to allow people to keep their employee plans after they left their jobs.</p>
      <p>So while employers and insurance companies are involved, individuals can't choose to pick their own health insurer, so effectively the situation is already not much different from state-run medicare, except for being messier and more complicated.</p>
