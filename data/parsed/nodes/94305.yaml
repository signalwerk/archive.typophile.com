    html: |-
      <p>@hrant:<br>
      I've corrected my post.</p>
      <p>@oldnick:<br>
      Well, you may not have intended to make a political comment, but it seemed to me that what you wrote could be interpreted as such a comment, and one that was factually incorrect - Obama, and not Mitt, might be your man even if the election is about money for you, depending on where you want the money to go.</p>
      <p>Before the 2008 election, some commentator dared to go on record saying the unthinkable: if a terrorist attack happened shortly before the election, this would boost John McCain's popularity, leading to his winning by a landslide.</p>
      <p>In my opinion, that's just about what <em>did</em> happen, except, of course, in reverse. Just before the election, <em>the stock market crashed</em>.</p>
      <p>Historically, the Democratic party is identified with unionized labor, with protecting American jobs, with concern for the working class and the poor. Which is more popular than being identified with big business and the moneyed interests, even if it could be argued that favoring them is the "rational" way to make more jobs in the long term.</p>
      <p>(On the other hand, the Republicans are also identified with a vigorous foreign policy and with social conservatism. These things play better electorally: I'm surprised a Populist party hasn't risen up to offer Americans the "best of both worlds", or at least what they seem to really want.)</p>
      <p>Given this, just as John McCain, who wasn't promising to pull out of Afghanistan and Iraq with the kind of haste that lost Vietnam, was seen as the better choice to confront al-Qaeda, Barack Obama, from the party of FDR, would have been seen as the better choice to keep a stock market crash from causing another Depression and vast human misery.</p>
      <p>My conclusion from this was that America wasn't really "ready" for a black President - he got elected due to a "perfect storm", as it were - and so the Republicans could run just about anyone and win the next election.</p>
      <p>Just about. Not someone from the extreme lunatic fringe, though. Unfortunately, the Republicans seemed bent on doing just that - and now we have Mitt Romney, a moderate Republican who is currently doing his best to convince his party, that, no, really, he is from the lunatic fringe after all.</p>
      <p>But, on the other hand, the committee system, which, through pork-barrel politics, strongly encourages Americans to re-elect incumbents to both houses of Congress, means that if Americans do re-elect Obama, he is unlikely to have filibuster-proof majorities in both houses of Congress.</p>
      <p>Normally, this would just mean that he would have to rule as a politician and not a dictator. Since today's Republican party has a policy of "my way or the highway", though, essentially nothing of importance can get done to address economic problems unless the Republicans can get the credit... which will be an argument for many to vote for Romney, even though such behavior should not be rewarded.</p>
      <p>I supported G. W. Bush's policies in the War on Terror, so I'm no left-wing radical, but the current behavior of the Republican party dismays me.</p>
    html_clean: |-
