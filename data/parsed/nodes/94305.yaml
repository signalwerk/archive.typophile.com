      <p>Since all we're doing is tossing out opinions here, I gotta side with Hrant on this one. It's all about the money, and this particular logo treatment is, quite frankly, a brilliant solution to saying precisely that, without actually saying so. In other words, it's a brilliant piece of linguistic legerdemain.</p>
      <p>Think about it: over the years, there have been several discussions about how humans appear to have an inbred ability to unscramble misspelled words and eke out the intended meaning. That's precisely what this logo does: the R is only suggested, so you read what's actually there: OMNEY. So, you say “What the hell is OMNEY? That makes no sense. Obviously, someone was not paying attention when they spent God knows how much money putting this logo together. Because, when you rearrange the letters just ever so slightly—just a tad, just a smidgen—they spell MONEY. Now, MONEY makes sense!”</p>
      <p>Which means that this logo accomplishes <em>precisely</em> what it set out to do brilliantly: it's all about the money! And, hey: this Mitt guy—he's knows his way around money. If it's all about the money, Mitt is your man...</p>
