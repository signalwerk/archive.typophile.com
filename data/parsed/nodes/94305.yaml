      <p>Quadibloc, that's in the right direction, but not completely accurate. If you have the money, in the US you can buy whatever health insurance or health care you want. That is 'freedom' in the Conservative's book—price never enters—and that won't change under Obamacare. </p>
      <p>If the issue for Conservatives were the practical constraints of price, then the first thing they should be complaining about are the over 30 million who are priced out of insurance, or denied insurance at reasonable prices because of preexisting conditions. But Republican minority leader of the Senate Mitch McConnell said today "that's not the issue," in refusing to answer what the Republicans would do about the 30 plus million.</p>
      <p>Of course, the reality is that there all kinds of practical constraints in a very messy system, if you can even call it that. It starts with the mandate that all hospitals have to provide care, whether or not people can pay, and extends to half of health expenditures in the country I believe being through medicare, and most insurance (irrationally) being through employers. By the way medicare part B is purchased through insurance companies, so it is a hybrid system. </p>
      <p>But now we are talking reality. When you start getting real—unlike 5Star or Mitch McConnell—then you realize that only a heavily regulated or government-owned system can supply health care to all affordably. That is what all industrialized countries except us do, much cheaper and generally with good results. If we were resolved to do it, instead of squabbling constantly with fantasy ideological arguments, we could do it very well.</p>
