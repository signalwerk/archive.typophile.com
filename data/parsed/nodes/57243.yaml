    html: <p>Thanks, that is very interesting. I particularly liked his contrast of pattern vs rhythm. Olson likes typefaces to have not simply pattern, but rhythm, by which means that they have a sense of momentum or forward motion. His illustration of how Klavika does this, as contrasted with one of this other faces was revealing.</p>
