  - id: 473790
    user: 7783
    date: 2011-08-12T07:25:00
    date_raw: 12 Aug 2011 — 7:25am
    votes: null
    html: |-
      <p>No rules above and below the logo. Getting too "design trickery"</p>
      <p>The strongest part of this logo is the distinctive deco lettering for the name. As others have noted, the rest of the elements do not reflect this same design era. I think you can get away with it in the tagline (tho consider adjusting the E crossbars and the size of the R bowl, join of the N etc for a more arts and crafts feel).</p>
      <p>On the symbol, consider a redraw finding your inspiration from arts and crafts sources. Eg Batch Elder tiles, Mackintosh, Green and Green etc. I can see it going more Japanese in influence or possible more organic William Morris. The direction should reflect the jewelry. It could even be that the fish/mark are a supporting brand theme vs part of the logo. Eg...  A fish print varnished on the package. A koi papercut etc</p>
      <p>Also not sure about the E and inverted E together. I'd just go with one.</p>
      <p>If I had to choose from above I go with the "Better Balance?" one.</p>
      <p>Nice job!</p>
    html_clean: |-
