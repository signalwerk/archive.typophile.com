    html: |-
      <p>@apankrat - aren't you the one who suggested using it as a vignette? </p>
      <p>I guess it comes down to your vision of hierarchy.  Do you want the symbol or the name to be dominant?  What do you want people to look at first?  I agree with apankrat that in the last version the name is dominant, and the symbol is downplayed.  But that may be exactly what you want.  To make the symbol dominant, you are going to have to beef it up more and make it a lot larger and refine the details.  I think one reason the stroke wasn't working for me is that it looked like you clicked stroke and left it at that.  The double line idea could work, but it would need a lot of finesse in the details, and probably reworking some of problems with congestion in the center.  That would move it away from a stroke look to something more intentional and designed.  </p>
      <p>There is something smart about how the name is the only part with that weight and the rest is matched thin lines.  It does create a clear hierarchy.  The last version is growing on me.  Good job.</p>
    html_clean: |-
