    html: <p>Belotti Bold is atrocious from a typographic perspective, but from a branding perspective it is very fitting. The ugly rounded bloated hippie font is consistently used on Oregon's every changing repertoire of <a class="freelinking external" href="http://michaelprincip.com/oregon_uniset.html" rel="nofollow">uniform/helmet combinations</a>. It fits with the innovative aspect of the Oregon offense. And don't forget, Eugene is one giant hippie commune!</p>
