    <p>So my brother-in-law is taking me to the Cincinnati airport on New Year's day (yeah, I'm shipping him a good bottle of Scotch to make up for it) and we're listening to the Rose Bowl on a local radio station. The announcers are complaining about how hard it is to identify the Oregon State players, and one of them says that not only are the white letters with a yellow outline hard to read, but the font is ugly too.</p>
    <p><a href="http://www.nikeblog.com/wordpress/wp-content/uploads/2009/08/Oregon-Ducks-Football-Jersey-LeGarrette-Blount.jpg">http://www.nikeblog.com/wordpress/wp-content/uploads/2009/08/Oregon-Duck...</a></p>
    <p><a href="http://dienu.files.wordpress.com/2009/11/oregon.jpg">http://dienu.files.wordpress.com/2009/11/oregon.jpg</a></p>
