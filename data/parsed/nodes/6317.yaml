    html: <p>Eduardo was on the right track. There is a face similar to Aurora called <a href="http://www.myfonts.com/fonts/ef/anzeigen-grotesk/ef/testdrive.html?s=where%a0the%a0action%a0is&amp;p=48" target="_blank">Anzeigen Grotesk</a>, and I'm pretty sure that's what it is. Certain characters are different (M, W, w, V, v, A) but otherwise they are almost identical.</p>
