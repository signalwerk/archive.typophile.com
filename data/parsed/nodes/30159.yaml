    <p>Hi All,</p>
    <p>I am back with another mystery (for me anyway). Thank you again to those that have helped me previously. </p>
    <p>Southwest Airlines uses this Script font on the nose of several aircraft that carry  special paint schemes.</p>
    <p>I have tried "El Greco", "Florens" and "Calligraphy" by Cassidy &amp; Greene. I do not think it is "Flourish" by Judith Suttcliffe from the Cassidy &amp; Green site, but I can no longer download that font to test it either way. Here is an example:</p>
    <p><a href="http://img.photobucket.com/albums/v319/windchill/cali_one.jpg" title="http://img.photobucket.com/albums/v319/windchill/cali_one.jpg">http://img.photobucket.com/albums/v319/windchill/cali_one.jpg</a></p>
    <p>Any help would be greatly appreciated.</p>
    <p>Brian</p>
