    html: |-
      <p>@Mike,</p>
      <p>The signmaker I use a lot to produce by designs still works this way when outdoor lettering has to withstand the elements for a long time. They cut the stencils on the same machine used for vinyl lettering, just reversed, and then — after applying the vinyl on the substrate — paint in the exposed areas, mostly using rollers... Multiple colour jobs are just repeat exercises (wait until paint is dried, apply different stencil/frisket, paint, etc.).</p>
      <p>A very long time ago I used to illustrate with airbrush — using friskets all the time (cut by hand, of course). The (self adhesive) material itself was called Frisket (still have some Letraset branded lying around). Its guess its one of those cases where a brand name became generic (like aspirin).</p>
      <p>BTW The oldfashioned way to work was by using stencils cut out of paper, weighing it down on the illustration board with whatever was at hand (eg pieces of leading from a print shop ; )). Soft edges could be created by gently pulling up the edges. Those were the days…</p>
      <p>@Brian: Dont despair, I think someone will come with an answer to your question!</p>
