      <p>I can accept that. I took a class in hand lettering/calligraphy, and I could see it being custom (especially because it says "California"- it reminds me of a good wine label, and Cali's well known for their wineries).</p>
      <p>I am assuming those are vinyl graphics. I have to admit I'm in the habit of assuming digital type is used whenever vinyl graphics are concerned, only because that's what I do for a living, and it's just so rare to see something truely custom-tailored like that.</p>
      <p>Next time though, I'm going to get that cigar. :-)</p>
