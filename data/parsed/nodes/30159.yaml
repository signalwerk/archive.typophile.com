      <p>Thanks Bert. A 'vinyl frisket' was a new term for me, but Google searches quickly helped understand that it's like an adhesive stencil -- just lift out the letters cut from the vinyl where you want the paint, and then peel away the rest of the  vinyl after the paint dries.  Apparently a plotter-like gadget can be used to make the frisket rolls, and even cut the letters (?)</p>
      <p>Now, back to the question of what font was used -- I'm still of the opinion that this was a custom font, or custom lettering used to make the frisket masters.</p>
      <p> - Mike Yanega</p>
