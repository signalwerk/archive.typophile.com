      <p>I do think this is custom calligraphy (probably a custom font). The work of Arthur Baker, or Philip Bouwsma, comes to mind.  Bouwsma's <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.9383.0.0&amp;attributes.sampleSize=48&amp;sampleText=California&amp;sampleSize=32" rel="nofollow">'Mantegna'</a> shows a lot of similarities to my eye, but there are also similarities to his recent <a href="http://www.myfonts.com/fonts/canadatype/torquemada/" rel="nofollow">Torquemada</a>, done for Canada Type.</p>
      <p> - Mike Yanega</p>
