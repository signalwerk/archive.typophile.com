      <p>I agree vinyl would probably not work on a jetliner. I don't pretend to know all the techniques used, but it seems like some method might be used to transfer an outline that was font-based on to the fuselage, so that the painter can reproduce logotype lettering as exactly as possible.  Airlines like Alaska, or Horizon Air, that use script logo types, must have a way to make sure the lettering is duplicated exactly.</p>
      <p>Do we have anyone here with experience about commercial airline lettering?</p>
      <p>  - Mike Yanega</p>
