  html: <p>Linotype have announced their 2003 competition. <br> <br>It's free to enter, but a winning entry is obliged to sign up to Linotype Licensing. On the other hand, there are monetary and other prizes, non-winners are often offered licensing as an option, plus the jury this year is stellar. <br> <br>If you need to choose one competition this year, this one is it. <br> <br><a href="http://www.graphicsiq.com/news/314-GraphicsIQ%20News%20Stories2.html" target="_blank">http://www.graphicsiq.com/news/314-GraphicsIQ%20News%20Stories2.html</a> <br> <br><a href="http://www.fontexplorer.com/FontStore?URL=http://www.fontexplorer.com/isroot/FontStore/content/03_company/content/comp_09_linoevents_f/Contests/4thTDC/home_contest.html" target="_blank">http://www.fontexplorer.com/FontStore?URL=http://www.fontexplorer.com/isroot/FontStore/content/03_company/content/comp_09_linoevents_f/Contests/4thTDC/home_contest.html</a> <br> <br>hhp <br></p>
