    html: |-
      <p>Your sample image is a combination of upper and lower case, resized to the same height. It may also have had some individual letters' weights altered. Or, it's possible (I think unlikely, but would be glad to be wrong) that a matching font exists.</p>
      <p>There are many different implementations of Cassandre's 1937 Peignot, and some foundries have created more than one version. There are many variations, both subtle and major, among these designs; for instance, some have a rounded lower case 'w' and some have sharp connections. They include:</p>
      <p>Adobe (multiple)<br>
      Berthold<br>
      Font Company<br>
      George Williams<br>
      Linotype (multiple)<br>
      SWFTE (a clone-maker)<br>
      URW (multiple, including a set that also has Microsoft as a copyright owner)<br>
      Numerous implementations that don't include any creator's names</p>
      <p>And there are implementations with different names:<br>
      Exotic 350 (Bitstream)<br>
      Greyhound (B&amp;P Graphics / Softmaker)<br>
      MontereyFLF (Casady &amp; Greene)<br>
      Morris (Opti/Castcraft)<br>
      Pare (Bay Animation - distributed with Broderbund products))<br>
      PeignotNeu (Watanabe)<br>
      Penguin (Corel - may be renamed from URW or Bitstream)<br>
      Pennsy (Primafont)<br>
      Penultimate (FontBank)<br>
      Penwin (SWFTE)<br>
      Penyae (WSI - probably a clone)<br>
      Peoria (Softmaker)<br>
      An assortment of Southern Software ripoffs (Carnati, Creme, Jabot, Paquette)</p>
