  html: |-
    <p>Does one exist? I really like the way TransType 3 Pro performs in its conversion process, but it would be more flexible if a command-line tool existed that did the same thing at at least nearly the same quality.<br>
    I've tried FontForge and it doesn't do such a good job on some TTFs I've tested. Sometimes it doesn't even convert the outlines to PS and the end/starting node(s) are not aligned properly but instead off by a few pixels creating an ugly jagged effect :/ Unfortunately also most online font converters do the same thing (bad quality).</p>
    <p>Any ideas? Can be a program/script (ie. python) and run on Win/Mac/Linux no problem, I got all three OS's :)</p>
