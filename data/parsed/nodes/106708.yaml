    html: |-
      <p>Té: ‘<em>[…] a dummy digital signature. Dunno if it's still Good Enough […]</em>’</p>
      <p>Yes, adding a dummy ‘DSIG’ will do the trick. One can generate one with for instance FontForge and just copy it to other TTF fonts. At DTL we use OTM for this, of course, but surely there are other tools for this purpose too. I don’t know whether it is available still, but quite some time ago the free command-line utility <em>Addtable.exe</em> worked for us as well.</p>
      <p>FEB</p>
