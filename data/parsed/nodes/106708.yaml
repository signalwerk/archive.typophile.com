    html: |-
      <p>Jens, as I understand it, MS Word will not use OpenType features with a ttf font unless the font has a digital signature. Expensive. However, with Word, the same font will use the same OT features if the font is in otf format.</p>
      <p>All more evidence for the hypothesis that there is (currently) no intelligent life beyond earth, because within 250 years of discovering radio wave communications, any species self-destructs.</p>
