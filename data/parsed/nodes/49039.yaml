    <p>My first post here. I had already graduated from college when I discovered graphic design. I’ve been trying to soak up as much information as possible on my own, and I would really appreciate feedback. Please destroy as much as you want.</p>
    <p>These are ideas for cards for my business (an economics firm). They want a general thank you card, which would be used for our clients, primarily colleges and workforce boards. As a bit of explanation, the flourishes on the card with the thank you in the bottom left corner are supposed to be turning into wheatfields (my company is located in a very wheat-ish part of the country).</p>
    <p>Preferences? Do none of them work? What tweaking should I do? Oh, and I just noticed that I never fixed the serifs on the bottom of the Y in the calligraphic card. Heh.</p>
    <p>Thanks</p>
