    <p>Hello,</p>
    <p>Recently I designed a book using Mardersteig's Dante. I have used it in the past with great satisfaction, and it is my favourite font for offset.</p>
    <p>The publisher decided to start printing on demand (POD) with Lightning Source, but Dante comes out very pale (see small sample).</p>
    <p>I was thinking of using Williams Caslon, as I have bought it recently for another job, but I am afraid it will still be too light.</p>
    <p>I looked at Dante Medium, but for some reason the charm of Dante Std is gone.</p>
    <p>What alternative would you advice?</p>
    <p>This edition uses Lightning Source lightly cream 6x9 format. Type is currently set as 12/14.4.</p>
    <p>I was considering using Merlo, but I can't find it in OpenType. Since I am using XeLaTeX, OpenType would help my job considerably.</p>
    <p>Thank you for any advice or tips you could spare,</p>
    <p>Guido</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/sample_68.jpg" width="1183" height="420" alt="">
