    html: |-
      <div class="comment-spam-body"><p>I agree 100%. I would call it "soulless". No soul, no heart, utter inability to convey beauty.</p>
      <p>One of the things that kills the type is the subtle shiny gloss left from the toner. Even after weeks it does not go away, like cellophane wrap. </p>
      <p>Sadly, I had no choice, the publisher is trying to survive, and POD is one of the ways they are trying.</p>
      <p>Having looked carefully to the paper and the toner ink they use, I think I will settle with Merlo, 11.3/14.4. I could change it, but then I would have to adjust the grid, so much work.</p>
      <p>Thank you for your notes.</p>
      </div>
