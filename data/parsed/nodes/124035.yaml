    html: <p>I guess I am a ludite in this respect. I loath Print On Demand, which I like to call Print No Demand, though in two moments of weakness I allowed a publisher to do two books of mine that way (via Lightning Source). Many fonts do not work well with POD. Aldus works. Sabon is ok. That was a few years ago. Of course there are others, and more by now, which work reasonably well. My favourite Centaur wouldn't work. But I loath POD in principle. No edition. Poetry books and academic books spilling out at a tumbling rate, with no financial input, so to speak, from the publisher, largely ignored by book stores and reviewers. Lightning Source (and others) trying to leave their mark discreetly on the last page but with no feeling, no understanding . . . don't let me go on . . . I won't be able to stop.</p>
