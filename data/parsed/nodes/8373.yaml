  html: <p>Hi, <br> <br>This is a question to any earlier users of FLab's ScanFont. A fair few months ago I tried a free version of ScanFont 3 for Mac. I bought the full version of v4 a few days ago, but I am beginning to wonder if my memory is playing tricks on me. <br> <br>Did earlier versions of ScanFont allow you to name a glyph quicky within ScanFont itself by selecting its seperated out cell and entering it's name into a field in a floating properties style window? Or is my memory playing tricks on me? <br> <br>If it did, then can it still do so or has that feature been dropped? <br> <br>Hope someone can help <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> (Why don't I just re-install the earlier ScanFont? One snapped powerbook and one failed email backup!)</p>
  html_clean: <p>Hi, <br> <br>This is a question to any earlier users of FLab's ScanFont. A fair few months ago I tried a free version of ScanFont 3 for Mac. I bought the full version of v4 a few days ago, but I am beginning to wonder if my memory is playing tricks on me. <br> <br>Did earlier versions of ScanFont allow you to name a glyph quicky within ScanFont itself by selecting its seperated out cell and entering it's name into a field in a floating properties style window? Or is my memory playing tricks on me? <br> <br>If it did, then can it still do so or has that feature been dropped? <br> <br>Hope someone can help <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> (Why don't I just re-install the earlier ScanFont? One snapped powerbook and one failed email backup!)</p>
