      <p>This was dealt with only ten days ago (see <a href="https://web.archive.org/web/20081007180242/http://typophile.com/node/39225#comment-240506">this comment</a>), so why two new threads (including <a href="https://web.archive.org/web/20081007180242/http://typophile.com/node/39657">this one</a>) for the same issue ...<br>
      Also see <a href="https://web.archive.org/web/20081007180242/http://typophile.com/node/32164">this proposal</a> and google for even more related threads.</p>
      <p>Indeed most applications have a serious problem with accessing unencoded glyphs. But this is the problem of these applications, not of fonts. It is not up to font developers to work around applications’ shortcomings (mostly). And it has nothing to do with type designers being kind or not-so-kind.&nbsp;&nbsp;;-)</p>
      <p>PUA may allow MUFI for faster decisions and agreement among members, but PUA per definition excludes the idea of ’standard’.</p>
