    html: "<p>Wow, what an interesting typeface this is! I really liked your idea of putting together \"upper-lower\" parts of letters from both languages to conceive a new face. <br> <br>Issues I think you should consider: i+j looks like a \"y\". the \"p\" is very courageous, maybe make a subtler version of it? <br> <br>The false \"dagesh dots\" that make the \"f\" and the \"m\" make those letters a bit hard to decypher, I'm trying to think of maybe a different way to incorporate them... Maybe consider using a false Arabic \"hamsa\" instead of Hebrew \"dagesh\"? <br> <br>The \"e\" is also a bit harsh for me, but I'm all run out of ideas on this one... :&gt; <br> <br>Basically that's a very well-done, innovative study of semitic letterforms. I'm very surprised to see it coming all the way from Antwerpen! Good job.</p>"
    html_clean: "<p>Wow, what an interesting typeface this is! I really liked your idea of putting together \"upper-lower\" parts of letters from both languages to conceive a new face. <br> <br>Issues I think you should consider: i+j looks like a \"y\". the \"p\" is very courageous, maybe make a subtler version of it? <br> <br>The false \"dagesh dots\" that make the \"f\" and the \"m\" make those letters a bit hard to decypher, I'm trying to think of maybe a different way to incorporate them... Maybe consider using a false Arabic \"hamsa\" instead of Hebrew \"dagesh\"? <br> <br>The \"e\" is also a bit harsh for me, but I'm all run out of ideas on this one... :&gt; <br> <br>Basically that's a very well-done, innovative study of semitic letterforms. I'm very surprised to see it coming all the way from Antwerpen! Good job.</p>"
  - id: 32479
