  html: <p>Hello, <br> <br>for my final project at university I'm making a (latin) typeface that is inspired by the hebrew as well as the arab scripts. What I really want to do is to make a typeface that is inspired by two very different and almost opposite scripts (though I found there are also a lot of similarities between them). So what I did in the end is that the bottom part of my typeface is arab inspired and the upper part is hebrew inspired. I have an example here ... does anyone have any suggestions, things that I did that I really shouldn't do or do different ?? All comments are welcome. <br> <br>Ine <br> <br><img src="http://www.typophile.com/forums/messages/4100/33944.gif" alt="example"></p>
