    votes: null
    html: <p>Congrats! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>I agree with Meir on his remarks though. <br>I think the key for solving the weaker letters would be to refare to the direction and dynamics of the letter rather than only to its final shape. <br>The 'e' for example is a classic case where the mix does resemble the desired shape but the directions of the two scripts are opposite, more or less like the political situation here, it makes the letter unquite and tense. So to give us more hope of finding a mutual language in the middle east (and to further develope your already excelent project) try to find a way for the opposite energies to combine towards coexistance.</p>
    html_clean: <p>Congrats! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>I agree with Meir on his remarks though. <br>I think the key for solving the weaker letters would be to refare to the direction and dynamics of the letter rather than only to its final shape. <br>The 'e' for example is a classic case where the mix does resemble the desired shape but the directions of the two scripts are opposite, more or less like the political situation here, it makes the letter unquite and tense. So to give us more hope of finding a mutual language in the middle east (and to further develope your already excelent project) try to find a way for the opposite energies to combine towards coexistance.</p>
  - id: 32480
    user: 1250
    date: 2004-04-22T09:49:00
    date_raw: 22 Apr 2004 — 9:49am
    votes: null
    html: "<p>Wow. This is as well-executed as it is fascinating, and sensitive! A font might not suddenly cause the warmongers to lay down their arms, but thinking about peace can only help. <br> <br>This is the only font I've seen that combines two scripts to convey a third! When I write my book :-) about formal \"migrations\" in writing systems this will definitely be included. And there's some great details that help it avoid being a gimmick (unlike FF Falafel, which I find unsatisfying). Like the way you've carried over some phonetic stuff is really cool: the \"b\" has the dot from Arabic baa', the \"p\" has the triple-dot from the Farsi pe, and the \"y\" has the double from the Arabic yaa'! Very clever. And I like that the \"i\" has two dots to contrast it against the \"j\". <br> <br>Legibility: there do seem to be problems, but I think you want to maintain <i>some</i> ambiguity. <br> <br>Stylistically the only big problem is the \"a\": that thin line isn't cutting it. You can try either using the capital form, or giving the \"a\" an ascender to gain room in the x-height - note that in the \"a\" the bowl is more important than having a strong top. <br> <br>I do however see a major \"ideological\" issue: if you really want to make the Hebrew and Arabic equals, it's not working - the former is too strong here. There are some details (like most of the terminals) that are pushing the whole too far towards Hebrew. I can thing of four things you can try, probably in some combination: <br> <br>1) Keep the x-height stuff Hebrew-looking, but make the ascenders Arabic (like the descenders). What's nice about this approach is that Hebrew is essentially an \"x-height\" script while Arabic is the opposite, so it makes perfect sense! <br>2) You're mixing Hebrew and Arabic style dots. I wouldn't get rid of all of the former (like in the \"m\" it's great), but maybe shift the balance a bit to the latter. <br>3) Add more angularity. Especially in the \"diagonals\", like u/v/w. This will make it feel like some Arabic newspaper fonts, while angularity seems to be much less common in Hebrew settings. <br>4) Those tagin (\"crowns\"?) are too evocative of the torah. I would either remove them, or add some qur'aan marks - there's a whole constellation of them, some very beautiful. But personally I would avoid both - after all, you don't have to be religious to benefit from Hebrew or Arabic. <br> <br>But please, whatever you do, do finish and release this font! <br> <br>hhp <br></p>"
    html_clean: "<p>Wow. This is as well-executed as it is fascinating, and sensitive! A font might not suddenly cause the warmongers to lay down their arms, but thinking about peace can only help. <br> <br>This is the only font I've seen that combines two scripts to convey a third! When I write my book :-) about formal \"migrations\" in writing systems this will definitely be included. And there's some great details that help it avoid being a gimmick (unlike FF Falafel, which I find unsatisfying). Like the way you've carried over some phonetic stuff is really cool: the \"b\" has the dot from Arabic baa', the \"p\" has the triple-dot from the Farsi pe, and the \"y\" has the double from the Arabic yaa'! Very clever. And I like that the \"i\" has two dots to contrast it against the \"j\". <br> <br>Legibility: there do seem to be problems, but I think you want to maintain <i>some</i> ambiguity. <br> <br>Stylistically the only big problem is the \"a\": that thin line isn't cutting it. You can try either using the capital form, or giving the \"a\" an ascender to gain room in the x-height - note that in the \"a\" the bowl is more important than having a strong top. <br> <br>I do however see a major \"ideological\" issue: if you really want to make the Hebrew and Arabic equals, it's not working - the former is too strong here. There are some details (like most of the terminals) that are pushing the whole too far towards Hebrew. I can thing of four things you can try, probably in some combination: <br> <br>1) Keep the x-height stuff Hebrew-looking, but make the ascenders Arabic (like the descenders). What's nice about this approach is that Hebrew is essentially an \"x-height\" script while Arabic is the opposite, so it makes perfect sense! <br>2) You're mixing Hebrew and Arabic style dots. I wouldn't get rid of all of the former (like in the \"m\" it's great), but maybe shift the balance a bit to the latter. <br>3) Add more angularity. Especially in the \"diagonals\", like u/v/w. This will make it feel like some Arabic newspaper fonts, while angularity seems to be much less common in Hebrew settings. <br>4) Those tagin (\"crowns\"?) are too evocative of the torah. I would either remove them, or add some qur'aan marks - there's a whole constellation of them, some very beautiful. But personally I would avoid both - after all, you don't have to be religious to benefit from Hebrew or Arabic. <br> <br>But please, whatever you do, do finish and release this font! <br> <br>hhp <br></p>"
