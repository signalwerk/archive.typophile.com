      <p>Some of the other Arkandis typefaces look interesting, although I did not find Universalis particularly impressive. From the <a class="freelinking external" href="http://arkandis.tuxfamily.org/" rel="nofollow">site</a>, though, while the logo says "Free fonts for free publication", on <a class="freelinking external" href="http://arkandis.tuxfamily.org/adffonts.html" rel="nofollow">this page</a> it is noted that the GPL v2 applies with the <em>font exception</em>.</p>
      <p>So I don't think you have to GPL any text you typeset in these faces. I'm not sure how else the GPL could be a concern.</p>
