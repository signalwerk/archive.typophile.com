    <p>Hi all, </p>
    <p>I’m currently working on a brief that required a typeface that is quite modern (not overtly so), but has some sort of suggestion of traditional, almost decorative details in its characters/ligatures. </p>
    <p>I was having a look at Leitura by the DS type foundry (<a href="http://www.dstype.com/specimens.html" title="http://www.dstype.com/specimens.html">http://www.dstype.com/specimens.html</a>), but not quite what I’m after... </p>
    <p>I understand it may be a confusing question, but any help would be greatly appreciated. Oh, and I don’t mind if I have to add in the decorative elements myself, but it would be nice if the font somewhat suggested them. </p>
    <p>Cheers!<br>
    Ben</p>
