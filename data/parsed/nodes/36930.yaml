    html: |-
      <p>Juan Pablo's typeface has been released by Veer as <a href="http://www.veer.com/products/typedetail.aspx?image=CTT0000250#specimen" rel="nofollow">Beauchef</a>.</p>
      <p><em>Beauchef is a grotesque sans serif in the DIN tradition. Designed originally to support the typographic needs of an advanced mathematical thesis paper, Beauchef knows how to let the information take the spotlight, but still retains enough attitude to convey energy and zeitgeist. Beauchef is readable and clear, with a crisp accuracy you and balanced geometry based on tabular numerals. Humble, yet expressive. Simple, yet avant-garde.</em></p>
      <p>Beauchef has a personality perfectly suited for authoritative short paragraphs, headlines, chapter headings, and declarations of principles, rich computer graphics and the like. But it can also speak clearly in long text passages.</p>
      <p>The font family features small caps, fractions, superior, inferior and lining numerals, plus full Western European language support.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CTT0000250_P_6135.GIF"></div><p></p>
