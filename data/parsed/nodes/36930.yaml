    html: |-
      <p>I'm crying of happines. I am the typographer who design this font...<br>
      It's true... "M" can have some problems, but this is not a final version. I designed this font at the time I was designing the infography. And I think this is not the final version. I remember I fixed the "M" when I change the numbers from oldstyle to caps.<br>
      Many books are working with "ugly" typefaces, but too cools and with a fresh look. And I wanted to design an special font, because a great designer in Chile give me the great oportunity to work with him...</p>
      <p>I thinked that nobody will like to my font. I designed 3 weights in about 2 weeks... I will have to end it, and talk with some foundry that want to sell it. (I have about 150 characters by weight)</p>
      <p>Thank you</p>
      <p>Don't forget to read <a class="freelinking external" href="http://letritas.blogspot.com" rel="nofollow">"letritas"</a></p>
