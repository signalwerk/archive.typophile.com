    html: |-
      <p>Thanks K.C.<br>
      I suspected this may be the case, because there are about 6 other fonts that I'm interesting in featured in similar documents that didn't make it to digital format.  One of them is called Boldface by IBM and was used on IBM typewriters such as the Composer and Executive.  I'm considering creating digital copies of those fonts, but then there are copyright issues and I don't know the origins of those designs, making contact difficult.</p>
      <p>I agree it does look like a variation of the Times format, but with a distinctive and very round 'o', a wide 's' with a flattened top and thick upper ends to the top right of the 'm', 'n' &amp; 'r'.  The original document may have been typed or come from a letterpress (or whatever mechanical method was used back then), but I think the version I scanned was printed or photocopied.  I'm not 100% sure though, so it may have been an original master.</p>
