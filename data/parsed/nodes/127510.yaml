      <p>It’s a variation of Times, perhaps a typewriter version as opposed to a computer typeface (something about your sample suggests ink on paper, not toner on paper). Unfortunately, that combination of numerals and letters doesn’t appear to match a single digital typeface.</p>
      <p>Berthold used to market a version of Times (Times BQ) that is very close to your sample—save for the numerals—but it is no longer on the market:<br><a href="https://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=Times%20BQ%20-%20Roman&amp;fid=8bc0de76663723fe01f1974619d55915">https://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ff...</a></p>
      <p>If you pair the letters from Times with the numerals from Symbol, you can approximate the look:<br><a href="https://www.myfonts.com/fonts/linotype/times/">https://www.myfonts.com/fonts/linotype/times/</a><br><a href="https://www.myfonts.com/fonts/adobe/symbol/">https://www.myfonts.com/fonts/adobe/symbol/</a></p>
