      <p>I'm no lawyer, but here are my two cents:</p>
      <p>Don't be so cowed by corporations and their marketing preferences that you cede your First Amendment rights*. Spell the names right, avoid libelous or defamatory remarks, and you'll be fine. You're under no obligation to include a TM, or R, or to set the company/product name in ALL CAPS, or InterCaps, or whatever other ridiculous mannerisms a company's marketers affect.</p>
      <p>In other words, set the type credits the way you want to. Give them as little or as much space as you deem appropriate, or omit them altogether. You're the publisher.</p>
      <p>*Assuming you're a U.S. citizen/publisher.</p>
