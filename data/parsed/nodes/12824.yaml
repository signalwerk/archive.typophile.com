      <p>I think that the real question here is a redactionary one. Almost every book mentions trademarks these days (i.e., Coca-Cola, MS-Windows, etc.), and 99% of the time, these are not properly attributed. Ideally, when the text is edited, the copy-editor who flag-down and research every mentioned trademark. Then the very last page of the book could have all of the trademarks listed together in full legalese is six-point condensed light type, or something ridiculous. At least then they are in there, and you have yourself covered, should anything come up (which it wouldn't).</p>
      <p>It is mis-uses of big-company trademarks that I would worry about more (i.e., the Coca-Colas and the Microsofts, etc.). Typefaces are trademarked so that others do not make fonts that us the same name (or something deceptively similar). Designing a new font &amp; selling it under the name <strong>Ef Ef Metaa</strong> ist just asking for trouble.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
