    <p>Hi, I'm hoping someone can advise me on this one small question. </p>
    <p>In our books, we usually list the typeface(s), and sometimes the designer, such as:</p>
    <p>Type set in <em>Typeface</em><br>
    or<br>
    Typeface: <em>Typeface</em> by <em>Designer</em><br>
    or<br>
    Typeface: <em>Foundry  Typeface</em></p>
    <p>This info typically goes in the colophon, or sometimes on the copyright page. Recently, I found this little tidbit in one foundry's EULA:</p>
    <p><em>The names of these typefaces are registered trademarks of [Foundry], and as such may only be used in keeping with accepted trademark practice, including identification of the trademark owner's name and only in conjunction with output produced using this font software. </em></p>
    <p>What is "accepted trademark practice"? (I looked through the Typowiki and didn't find anything.) It seems extreme to do something like:</p>
    <p>Typeface: <em>Typeface</em>TM by <em>Designer</em><br>
    <em>Typeface</em> is a registered trademark of <em>Foundry</em></p>
    <p>How would you handle this? Any advice?</p>
