      <p>I guess the question is, do I find out what “accepted trademark practice” means... or just go with the flow?</p>
      <p>Here are some credits in books I pulled off my shelf:</p>
      <p>- "Set in 12-point Minion by the Perseus Books Group"</p>
      <p>- "Text set in Electra"</p>
      <p>- "The text of this book is composed in Bauer Bodoni and Helvetica Condensed Light with display in Helvetica Condensed Bold."</p>
      <p>- "The text face is <em>Alisal</em>, designed by Matthew Carter from Carter &amp; Cone. The headlines and labeling are set in various weights of <em>Faceplate</em>, designed by Rodrigo Xavier Cavazos from Psy/Ops."</p>
      <p>- "Typest [sic] in 10/12pt Palatino by Intype, London"</p>
      <p>- "Composed in Scala and Scala Sans, typefaces designed my Martin Majoor in 1994."</p>
      <p>Based on these samples I gather that no publisher is putting a little TM or (R) after names of typefaces. The last one is from the <em>Chicago Manual of Style</em> and I tend to defer to them.   (Although... <a href="http://www.fontfont.com/press_release.html" rel="nofollow">the FontFont site</a> does use the (R) registered trademark symbol after Scala, I can't read their EULA without buying anything, so I don't know whether or not it includes any language like the quote in my original post.)</p>
