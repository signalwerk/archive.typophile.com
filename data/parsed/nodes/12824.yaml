      <p><strong>hrant: <em>Anybody who ever thinks that has to be completely bonkers.</em></strong></p>
      <p>Sigh...H-man, when are you gonna learn: punctuating your arguments with insults doesn't make them more persuasive arguments; if anything, it makes them <em>less</em> persuasive, because you seem compelled to add a spurious <em>ad hominem</em> element to them.</p>
      <p>And it might also be productive for you to stop for a moment to consider the possible consequences of your continuing campaign against EULAs. As things currently stand, although a EULA is a legally binding contract, virtually all foundries treat them as gentlemen's agreements. The rest of the world is not so understanding. Assume for a moment that you wanted to purchase an automobile on time, as most folks do. You go to the dealership, select an auto to your liking, and are handed a purchase contract. If, at this point, you were to say, "I do not accept this contract because it exploits the working man," do you think for an instant that you would drive out of that lot in that car? Even if you were to keep silent and sign the contract, with the intent of ignoring it once you got what you wanted, it wouldn't take long for the repo man to show up and reclaim the car.</p>
      <p>Thankfully, font foundries do not employ such measures against people who fail to live up to their end of the contract...but what if they <em>did</em>?  Consider for a moment this scenario which, unless I have a gift for clairvoyance of which I was hitherto unaware, is purely hypothetical:</p>
      <p>A major distributor of fonts who is also a major player in professional imaging decides that your attitude toward EULAs is actually the one which prevails in the marketplace. In response to this scofflaw attitude, a new font format (for argument's sake, let's call it OpenType 2) and a new imaging protocol (let's call it Postscript 4) are developed which <strong>require</strong> the purchaser to register a font online before it can be installed, much like the registration systems now employed by other software manufacturers. In order to install the font, you must accept the EULA; if you attempt to install the font on more machines than the number for shich you have purchased a license, you will be unable to. To round out the picture, let's say that our hypothetical Postscript 4 will only accept this new font format and will only allow you to image the fonts which have been registered in this manner. And every time you upgrade computers, you will have to go through a process of unregistering and verifying delection all of the fonts on your old computer, and installing and reregistering them on your new box.</p>
      <p>Probable? Likely? Even possible? It doesn't matter. If the major players became convinced that their economic interests are being threatened, they <em>will</em> take  measures to protect themselves. Well, think again. Let's keep the agreements gentlemanly...and while, we're at it, let's keep the debate here gentlemanly, as well.</p>
