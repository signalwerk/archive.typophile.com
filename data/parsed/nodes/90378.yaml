      <p>Free alternatives are:</p>
      <p>URW Garamond No8 (Stempel Garamond): <a href="https://github.com/rbrito/urw-garamond/tree/master/orig/ttf" title="https://github.com/rbrito/urw-garamond/tree/master/orig/ttf">https://github.com/rbrito/urw-garamond/tree/master/orig/ttf</a><br>
      This one is can be used without concern, the quality is quite alright, it is an older digitalization of Stempel Garamond which is now free. However in this version the small caps are actually petite caps and the old style figures have way too much distance between the figures, at least in the software I use. If you use it with lining figures and normal capitals for abbreviations it will serve your well. </p>
      <p>EB Garamond is an ambitions project as it aims to be true to the original Garamond. It is currently in development and the status is beta or alpha even for bold and italics.<br>
      Regular: <a href="https://github.com/georgd/EB-Garamond/tree/master/otf" title="https://github.com/georgd/EB-Garamond/tree/master/otf">https://github.com/georgd/EB-Garamond/tree/master/otf</a><br>
      Italics and Bold: <a href="https://github.com/georgd/EB-Granjon/tree/master/OTF" title="https://github.com/georgd/EB-Granjon/tree/master/OTF">https://github.com/georgd/EB-Granjon/tree/master/OTF</a></p>
      <p>So tradeoffs everywhere... The Adobe Garamond isn't that expensive for a font.</p>
