    html: |-
      <p>For a font or face in alpha, expect roughness of all kinds; hinting/kerning, if any, somewhat short of exact; not all glyphs there yet; glyphs reshaped, sometimes drastically, as time passes. This sort of thing. Very similar to programs, in fact.</p>
      <p>In beta, a face would be mostly finished but in need of tuning. You may get some odd OpenType substitutions, including none. A beta test needs a lot of pathological test cases to weed out the bogosity. Again, just like programs. Do your French and German quotes sit right where they should? What happens if you turn on historical ligatures within small-caps within swashes?</p>
    html_clean: |-
      <p>For a font or face in alpha, expect roughness of all kinds; hinting/kerning, if any, somewhat short of exact; not all glyphs there yet; glyphs reshaped, sometimes drastically, as time passes. This sort of thing. Very similar to programs, in fact.</p>
