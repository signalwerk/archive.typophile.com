    <p>A few weeks ago downloaded Adobe Garamond Pro for free.  Thought the site was legitimate because it included ads for legit sites selling fonts (e.g. fonts.com).  Seen statements that AGP is not not available free, but those are a couple of years old, so thought AGP had been freed.</p>
    <p>Now worried that's not so.  Will delete AGP if pirated.  Hope not.  Love Adobe Garamond; others don't compare.  Can't justify buying it.  Not a designer, just a writer with newfound font fetish.</p>
    <p>What's the truth about Adobe Garamond Pro's copyright status, cost at this point in time?</p>
  html_clean: |-
