      <p>Thanks T.R.-</p>
      <p>I know what alpha vs. beta vs. 1.0 vs. the rest mean in the context of general software development, testing, and use.  I've experienced all of them both as a programmer and as a user. (1.0: "It's beta, but we have cash flow problems." :-)</p>
      <p>I don't know what's implied by these terms for a digital typeface.  If EB Garamond were still in an alpha state for its roman fonts, would that mean "Don't complain to us if it crashes your typesetting/wordprocessing/whatever program, and there's a good chance it will", or "It's supposed to look like original Garamond, but only some of the characters are close", or "might look fine at 12 pts but could look wacky at 36 pts--and again, don't complain to us"?  I'm a novice in this world, so I don't have a sense of what sorts of things count as showstoppers, and what sorts of things count as annoyances which one can choose to work around.  I've noticed no problems or things that bother me so far using EB Garamond's roman, italic, and bold at text sizes with XeLaTeX.  I've learned to notice certain things about fonts in recent months, but I'm sure that miss a lot.  Maybe for a designer there can be glaring problems with a typeface that make "alpha" the appropriate term, while I just blithely abuse readers by giving them documents in the same typeface.</p>
      <p>(Yes, URW Garamond No. 8 is the one I haven't found moving--thanks for clarification Andre.)</p>
