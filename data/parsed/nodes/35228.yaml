      <p>Sorry about the link, you caught me with my pants down...<br>
      Well , before I noticed I didn't attach the image to the post. :)</p>
      <p>I doubt the script is handwritten, it must be a font. There's not too many scripts around that it could be?<br>
      :) j/k</p>
      <p>On another note,<br>
      would there be any rational to use a geometric Futura for a romantic/period theme?<br>
      Perhaps, is it a case of the recent popularity of hairline fonts, or perhaps a hairline font does fit the theme and outweights the coldness of a geometric... since it's such a small weight perhaps the geometric attributes don't come into effect anyways?<br>
      Nah, probably just a favorite type of the designer.</p>
      <p>What do you think?</p>
