    html: |-
      <p>Michel, my apologies, you are correct about the letter <strong>t</strong>. (Shame on me, I should have noticed!) MyFonts has some info on <a href="http://www.myfonts.com/foundry/ef-typeshop/" rel="nofollow"><strong>Walter Florenz Brendel</strong></a>, which explains a bit about the slight variations from Futura. And I guess that at least in the case of <a href="http://www.myfonts.com/fonts/ef-typeshop/volkswagen/" rel="nofollow"><strong>TS Volkswagen</strong></a>, he is slyly winking at those who know that Futura has been the typeface used by Volkswagen since the 1960s, when Helmut Krone created <a href="http://www.enchorial.com/HelmutKronePages/HelmutKroneCh4_p68_69.htm" rel="nofollow"><strong>those iconic ads</strong></a>...</p>
      <p>As for that other website, my advice is... don't go there.</p>
