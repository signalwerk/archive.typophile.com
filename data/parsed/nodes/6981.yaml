  html: <p>I'm designing a character to be featured on a label for a 1Kg couscous package. The product will be sold in Morocco. The name of the product is 'La Rifaine' and it refers any woman from the region of 'Rif' in Morocco. So I decided to design a female character from this region. <br> <br>Here are two designs, the first has the woman wearing a scarf that also covers her neck. The second is more revealing.. <br> <br>Both are still in concept and final work will be cleaned up. Any feedback I can get will be much appreciated (color, line, composition, proportions, subject..) <br> <br>Thanks <br> <br>http://www.raioo.com/logos/photos/berkasha_10.jpg <br>http://www.raioo.com/logos/photos/berkasha_11.jpg</p>
  html_clean: <p>I'm designing a character to be featured on a label for a 1Kg couscous package. The product will be sold in Morocco. The name of the product is 'La Rifaine' and it refers any woman from the region of 'Rif' in Morocco. So I decided to design a female character from this region. <br> <br>Here are two designs, the first has the woman wearing a scarf that also covers her neck. The second is more revealing.. <br> <br>Both are still in concept and final work will be cleaned up. Any feedback I can get will be much appreciated (color, line, composition, proportions, subject..) <br> <br>Thanks <br> <br>http://www.raioo.com/logos/photos/berkasha_10.jpg <br>http://www.raioo.com/logos/photos/berkasha_11.jpg</p>
