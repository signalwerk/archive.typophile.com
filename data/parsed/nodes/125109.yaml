      <p>It’s almost as though before submitting a post, a user should be asked to tick a box saying “This is <strong>not</strong> a type ID request” and if they <em>don’t</em> tick it, it gets rerouted to the ID board and kept off the main feed!<br>
      I assume it would be too complex a development task to have the capability to move a post to the ID board after it’s posted? (I can imagine a scenario where if - say - three readers flag a post by hitting a certain link, it would automatically get kicked across...)<br>
