    <p>It seems if there's an open input field on Typophile, someone is going to stick a Type ID request in it. </p>
    <p>Don't get me wrong - I love a good challenge as much as the next Typophile, but I see all the Type ID requests getting in the way of more meaningful interactions. </p>
    <p>Seeing as Typophile has always been more democracy than dictatorship, what say you? Is it a problem, or should I just get over it?</p>
    <p>Shall we draft a policy together on when and where it's appropriate?</p>
    <p>Please! Weigh in, as this affects us all.</p>
    <p>//Jared</p>
