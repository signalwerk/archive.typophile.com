      <p>If you're playing the home game, here's what new in the world of Type ID wrangling:</p>
      <p>I've created a few recipes that flag our engine, preventing certain Type ID posts from the Communities area.</p>
      <p>To see the magic, try posting to any Community with the words "what," "font," "is," and "this" is any combination. (what is this font, what font is this, what this font is, what font this is)</p>
      <p>There are some other recipes in play. If anyone would care to do the analysis, help me find the most common 3-4 trigger words or phrases and we'll add them to the engine.</p>
      <p>Thanks!</p>
