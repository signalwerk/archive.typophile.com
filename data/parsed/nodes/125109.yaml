      <p>It's certainly true that there a number of other good places to get type IDs. I've heard the argument that type IDs are a "gateway drug" :-) for more meaningful involvement in the wonderful world of type. In some cases that's true, but it's probably more often a way to end up with a pirated copy of the font... Some previous users weren't even shy about being "collectors", and willing to help people to that end. Watching this happen probably does more damage to meaningful participation than anything else.</p>
      <p>At some point in the past IDs were moved to their own ghetto so the rest of us didn't have to watch. Personally I'd rather see the whole ID scene nixed from here, but I guess the ghetto is a decent compromise. The problem now is the Feed being infested with ID requests, which is inevitable. What I hope isn't inevitable is laxness in dealing with it. I suspect most people are simply not paying enough attention to not do that; they just need an alert, and directions to the ghetto. People who ignore a couple of warnings probably don't care about the integrity of Typophile, so they should be banned. Which BTW means no "guest" log-ins (at least not outside the Type ID section).</p>
