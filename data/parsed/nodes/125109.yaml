    html: |-
      <p>As a typophile who is not a designer, my interest IS primarily the Font ID area, but as I do not get the site by RSS feed I did not realize that the ID stuff is 'clutter' to the rest of the community. The notion of being 'ghetto-ized' is perhaps an unfortunate use of the word, but I think separating the ID requests from other discussions makes sense. Frankly, the revived Type ID Board still seems struggling to find a format and a useful user interface. I think Stephen Coles ('Stewf') has done a nice job with his fontid.co site, and I had been helping there until I saw Typophile had been resurrected. Now I shuttle back and forth between the two sites. Typophile had an ID group that included many designers, but it seems that most of them have gone elsewhere, or are no longer interested in Font ID's. This is unfortunate, because as Hrant mentioned this site was a 'gateway' for me to meet designers who were generous enough to help with the ID Guides on my bowfinprintworks.com web site. </p>
      <p>Rather than dropping font ID, I would like to see it restored to something more like its earlier form. If it needs to be cut away from the other discussions that would be fine with me, especially if it had its own feed.</p>
      <p>- Mike Yanega</p>
