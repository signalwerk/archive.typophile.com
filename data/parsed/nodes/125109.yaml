    html: <p>As excited as I was for the relaunch, I rarely visit. I was turned off by the feed-as-front page concept with its crazy stream of Type ID requests and "guests." Case in point, there is a Type ID request at the top of the feed right now that contains a huge image blowing all other content out of the water. When visiting the new Typophile, it's no longer evident there is great content or discussion to be had. I always valued the discussion forums and felt they built a great sense of community, but the front page as it stands is like a bad Twitter feed full of thoughtless people I didn't choose to follow.</p>
