      <p><em>I am stuck at the part where it tells me to create a black to white gradient and to “screen” blend it onto the previous blend. Is there something I’m missing to achieve this? I have followed every step told to me, and when I blend the gradient with the shape it ends up looking deformed.</em></p>
      <p>Mike, I just looked at the tutorial. What they mean by “Screen blending mode” is an option you select in the Transparency palette... All you have to do at that point in the tutorial is to select “Screen” from the pop-up menu (in the illustration that accompanies that step, look for the Transparency palette, and you’ll see what I mean). Don’t blend any gradients at that point.</p>
      <p>Good luck,<br>
      Ricardo</p>
