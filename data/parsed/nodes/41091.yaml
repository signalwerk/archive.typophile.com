    html: |-
      <p>Probably not the best place to ask for detailed help.</p>
      <p>The tutorial uses the word “blend” a little too much (or Adobe does)... The “Blend” they are referencing in the second section (after you make the grayscale gradient circle) is found in the TRANSPARENCY palette. Don’t try to use the Object &gt; Blend menu command or tool. The little pop-up menu at the top left of the transparency window lets you change how an object “blends” with other art below it... by setting it to “Screen”, the gradient will only lighten up what it is on top of (the green note head).</p>
      <p>I’m not sure this is the best way to create this art. For one thing, it is referencing Illustrator version 9... you could create the 3-D green globe a number of other ways in later versions of Illustrator.</p>
      <p>I’m curious as to why you don’t use/follow the tutorials on the Illustrator discs, or the ones on Adobe’s site?</p>
