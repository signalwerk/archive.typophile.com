    <p>Hi everyone, I am new to graphic design. Do you know any good beginners tutorials for Adobe Illustrator CS3?</p>
    <p>Also, I know basic knowledge of the program, and have been trying to finish one of the tutorials off of this website: <a href="http://www.ndesign-studio.com/resources/tutorials/itune-icon/" title="http://www.ndesign-studio.com/resources/tutorials/itune-icon/">http://www.ndesign-studio.com/resources/tutorials/itune-icon/</a></p>
    <p>I am stuck at the part where it tells me to create a black to white gradient and to “screen” blend it onto the previous blend. Is there something I’m missing to achieve this? I have followed every step told to me, and when I blend the gradient with the shape it ends up looking deformed.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/41087" class="topic-previous" title="Go to previous forum topic">‹ Garamond-esqe Typeface</a> <a href="/node/41085" class="topic-next" title="Go to next forum topic">Computer/Technology Icons ›</a></div>
