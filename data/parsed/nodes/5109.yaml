    html: <p>&gt;&gt;However, the two biggest things in my opinion are fewer bugs, and significantly better performance <br> <br>You're probably right. <br>I've worked for software companies quite a bit and they are almost always the biggest improvements in any new version. <br>Its a shame that customers can't see the value in those improvements (or that marketing departments can't see that customers <b>do</b> see the value...) <br>If only new versions could be marketed as <i>"Less buggy and slow than the thing we sold you 2 years ago"</i>, then there wouldn't be the need for so many new features, which end up introducing new bugs, and slowing the whole thing down again.</p>
