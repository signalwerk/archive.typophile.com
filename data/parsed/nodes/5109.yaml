    html: "<p>My absolute favorite is Real World InDesign. The new CS edition is just shipping in about a week (Amazon lists availability in 11-12 days). It also seems to be the favorite reference of my fellow Adobe-ites. <br> <br>Now, depending on what your approach and background are, and what you are looking for, there may be another book that would also be good to have. But Real World InDesign is the indispensable reference, covering both how to do things, overall complex concepts, and very importantly *why* you would want to do (or not do) certain things. I've had two copies of the ID2 version: one for the home, and one for the office. On those occasions when I need to do something or figure out some InDesign behavior I am not understanding, Real World InDesign has come through pretty much every time. <br> <br>On top of that it is very well written, being both clear and humorous while conveying complicated ideas. <br> <br>I hope that helps! <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems <br> <br> <br></p>"
