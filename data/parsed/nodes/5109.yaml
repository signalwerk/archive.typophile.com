    html: <p>As someone trying to extend the usable life of my old blue+white G3 (450mhz/768MB RAM), would you imagine CS to be a net positive, or a negative compared to Indesign 2? I don't feel like I need the features (and am wary of the lack of backwards compatibility), but is it really noticably faster/more stable? If Apple can do it with OSX, no reason Adobe can't, I suppose!</p>
