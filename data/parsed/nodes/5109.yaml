    html: '<p>InDesign CS has a fair number of new features. Highlights are here: &lt;<a href="http://www.adobe.com/products/indesign/newfeatures.html" target="_blank">http://www.adobe.com/products/indesign/newfeatures.html</a>&gt; <br> <br>A really big (5.7 MB) PDF listing new features is here: &lt;<a href="http://www.adobe.com/products/indesign/pdfs/indesign_nfhs.pdf" target="_blank">http://www.adobe.com/products/indesign/pdfs/indesign_nfhs.pdf</a>&gt; <br> <br>However, the two biggest things in my opinion are fewer bugs, and significantly better performance. <br> <br>Also newly available is the "PageMaker Plug-in Pack" which adds some additiojnal features. &lt;<a href="http://www.adobe.com/products/indesign/pm_pack.html" target="_blank">http://www.adobe.com/products/indesign/pm_pack.html</a>&gt; <br> <br>Hope that helps.... <br> <br>T</p>'
