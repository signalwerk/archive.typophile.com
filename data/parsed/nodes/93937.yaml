  html: |-
    <p>I'm looking for body fonts that pair well with these heading fonts:</p>
    <p>News Gothic Condensed Bold<br><a href="http://www.fontshop.com/fonts/singles/bitstream/news_gothic_bold_condensed_ot/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.fontshop.com/fonts/singles/bitstream/news_gothic_bold_condensed_ot/</a></p>
    <p>News Gothic Extra Condensed Bold<br><a href="http://www.fontshop.com/fonts/singles/bitstream/news_gothic_bold_extra_condensed_ot/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.fontshop.com/fonts/singles/bitstream/news_gothic_bold_extra_condensed_ot/</a></p>
    <p>Any suggestions would be great. As an aside, should the body serif also be condensed, or is it fine to pair a condensed sans headline with a non-condensed body serif. </p>
    <p>Thankyou</p>
