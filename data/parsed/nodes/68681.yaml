      <p>Sorry for the very late reply, I have been very busy but felt I should reply none the less. Thankyou for the comment Arthus I appriciate the constructive feedback and agree with it all. The only main adjustment to the Bauhaus font was ading some curve shapes and draggin off the ends so like you suggested more playing around could form a stronger design along side with better letter spacing.</p>
      <p>I chose magenta because it was the colour which best stood out to me, I know that's not a good reason to justify the colour choice but I went with it anyway. Thankyou again for the feedback!</p>
