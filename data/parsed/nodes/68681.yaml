    html: |-
      <p>The brief shouldn't matter, you should come up with what you think is right, if it isn't in your briefing, it's your own choice, so that's +1 for your solution.</p>
      <p>Since it's such a broad subject, and the briefing doesn't mention anything we should I think refrain from adding other types of 'enviromental' typography. </p>
      <p>For your design, it bold, that's nice, but I would play more with the various glyphs, and especially some optical adjustments. For instance Beauty looks like it has run into a concrete wall with the 'uty' all pushed together, so bring 'Bea' closer together, or do some adjustments on the 'uty'. This doesn't have to be spacing, but you can also play around with the inner shapes, there is a lot of potential in the t-gap for that. Then again, 'around' looks too wide again, so try to bring it a bit together letterwhite-wise.</p>
      <p>I think the main issue is that you left the type too much as it was originally, the Bauhaus font, or was it mentioned in the brief that you could not edit it ? You should otherwise play around with the forms and make them really unique, and perhaps more flowing as a road without going back to the cliche Bauhaus typeface glyphs (especially the 'a')</p>
      <p>I'd also regrain from using the bauhaus type anywhere else on the poster aside from the title, in the small text it's way too black and closely spaced, making it hard to read.</p>
      <p>Finally, I'm not sure of magenta, but then again I'm not from the UK so don't know which colors should be accociated with road signage or other road markings.</p>
      <p>Don't let my comments put you off though ! I like the road (excuse the pun) you took with this assignment, it works nicely and combines type and a message (or has the potential to)</p>
