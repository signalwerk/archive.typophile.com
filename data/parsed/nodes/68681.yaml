      <p>Given that it's a museum exhibit specifically about typography, I'd be worried that the use of Bauhaus would potentially deceive--given that Bauhaus was an art movement much larger than just typography. </p>
      <p>In other words, in seeing this poster for a museum exhibit, I'd assume it's an exhibit feature works from the Bauhaus movement. </p>
      <p>That's not to say your concept isn't sound. I'd stick with it. But try working on a type treatment of your own that isn't specifically using the Bauhaus typeface.</p>
