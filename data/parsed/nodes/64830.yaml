    html: <p>Looking really good. Maybe even try it as a screen face because it has the geometric structure that I think would lend well to the screen and small print sizes. However, it would also excel at large poster sizes because of the quirkiness to some of the letterforms.  But I think that the 's' in both capital and lowercase could be tweaked to fit the rest of the forms. I'm also into the lowercase 'n' but the notches of the black lowercase 'm' don't need to be there. The alternate capital 'M', capital 'G', lowercase 'a' and capital 'R' are my favorites. Can't wait to set this when it's done.</p>
