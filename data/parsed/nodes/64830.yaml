      <p>@ Matt<br>
      If you chose to follow the principle of rotation, I think you should also give an /a/ with a rotated bowl a shot. (Perhaps needless to mention: also /g/, forgot to include that in the example above)</p>
      <p>@ Hrant (&amp; Matt, of course)<br>
      Yes, this is the more conventional approach, and yes, I agree that conventions are not to be slavishly followed. Following the chirographic "grid" will however provide a better flow in running text, reflection will (to some extend, depending on the contrast and shape of the bowls) break the rhythm and single out the letters with reflected bowls (as it does in this case).<br>
      I am not sure what the intented use of this typeface is (running text or display?), so I can't really say what is the appropriate solution for this design. You know best, Matt.</p>
      <p>Interestingly, the lc d in Perpetua is a mix of reflection and rotation.<br>
      Even if the shape of the bowl suggests that it is reflected, the contrast follows the principle of rotation, thus softening up the reflected axis.</p>
