    html: |-
      <p>A layperson’s observations:</p>
      <p>I get what you’re trying to do with the curved/straight/nonexistent connections and I think it comes out the most in the lowercase character set, except it’s missing the ‘no connections’ bit (unless you count the ‘k’). I don’t know if you’re dead set on that characteristic only coming out in the uppercase, but you could try it in the lowercase as well. It might solve the issues you’re having with the ‘m.’ Another thing you can try—you might already have but it hasn’t shown up in the variations so far—is curving the outside corners of the ‘m’ and keeping the middle straight (basically a reverse of the second to last variation you posted upthread). It may prove useful when you work on the ‘w,’ which segues nicely into my second overall observation which is that the angular letters of the alphabet don’t seem to fit the rest of it yet. You’ve got good things going with curved and straight uppercase letters like ‘G,’ ‘R,’ and ‘U,’ and the totally curved letters like ‘C’ and ‘O’—love the squashiness of that one, by the way—work as well, but the totally angular letters like ‘A,’ ‘W,’ etc. look like they could have come from any sans-serif. I’m not a fan of the middle of the ‘W’ going up to the cap height; I’d also rather see it resemble a double-U more than a double-V. A separate tail on the ‘Q’ is more quirky looking too.</p>
      <p>The fourth ampersand from the left fits with your lowercase letters better because of the one corner in the counter as opposed to two, but the one in black matches the uppercase more. </p>
      <p>For the numbers, the 3 and the 5 are looking a bit off; I want to say it’s because the connections are in the middle of the numbers rather than a little higher? It’s not so bad on the 3, but quite noticeable on the 5.</p>
      <p>I like the flat bottomed letters better; the flat topped ones look like they’re about to leap off the screen and stab me. I get a softer, almost leafy feeling from the typeface so far (may or may not be what you’re going for), rather than a scary, futuro-gothic vibe the flat topped letters give off.</p>
    html_clean: |-
