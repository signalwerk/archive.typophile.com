      <p>I like the middle Ss, the last one seems to again cross over into "it's about to stab me" territory. It looks interesting by itself but when you typeset it in a phrase it's quite weird.</p>
      <p>I miss the curved top though. Having both the top and bottom squared off gets too sci-fi and doesn't fit well next to the 'e' and the 'a.' I don't know if this was intentional or not, but in the bottom curve of the 'C' and the 'G,' that corner gets a little thinner than the rest of the stroke, because the inside radius is a bit larger than it would need to be for a monoweight stroke... would it be possible to bring that into the S? I know the issue is that the letter has so many turns at once, but the tight rounded corners you got going on in these latest versions don't quite fit with the rest of your letterforms.</p>
