      <p>I see you caught the issue of bdgpq needing tapering where curves join the straight stems, looks much better now. That really bugged me in the earlier drafts. I think you need to do the same for the middle join on the "a" as well.</p>
      <p>Also, in order to make the horizontal and vertical strokes LOOK the same thickness (monoline appearance) you need to make the verticals a little thicker than the horizontals. In this weight I imagine 5-10% would be about right.</p>
      <p>Cheers,</p>
      <p>T</p>
