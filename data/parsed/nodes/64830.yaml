      <p>What Elias describes would cause the font to more closely follow the chirographic "grid"* which is not something to ignore; however I would contest that -especially in a design such as this- there is more to gain by following other ideals, not least lateral symmetry (but also structural divergence). For example the "d" in Perpetua might seem jarring, but I feel that makes it more of a "d" and less of a "p".</p>
      <p>* Not a cartesian grid, but still a system that parts "snap" to.</p>
      <p>I really like the most recent "S" - it just needs the top-left corner to be brought in slightly.</p>
      <p>hhp</p>
