      <p>&gt; you could try [‘no connections’] in the lowercase as well.</p>
      <p>I was thinking along those lines too. The lowercase "e"<br>
      and "a" are perhaps the best candidates to introduce gaps.</p>
      <p>&gt; It might solve the issues you’re having with the ‘m.’</p>
      <p>Yes - maybe try a rounded-outsides arch like Olga suggests, but have the middle vertical not touch it! That might seem drastic, but if this font is supposed to be more than an exercise, worrying about what's already out there is very important - and frankly there's a lot of stuff like this already. So I would introduce some... quirks (!) into this design - but judiciously.</p>
      <p>--</p>
      <p>Some specifics:</p>
      <p>J: longer serif.<br>
      Q: much more bravado in the tail. The alt is nice though.<br>
      R: firmer leg, maybe totally straight.<br>
      S: at first I didn't like it at all, but now I think it might only need some shifting around.<br>
      U: narrower.</p>
      <p>r: if you're keeping the apertures in "g", "p" and "q", this should have it too.<br>
      s: try making it narrower.<br>
      t: I would lose the left bar.</p>
      <p>numerals: still very erratic.</p>
      <p>&amp;: give yourself more time, observing quirky ampersands. Like here:<br>
      <a href="http://www.flickr.com/photos/x1brett/4133496052/" title="http://www.flickr.com/photos/x1brett/4133496052/">http://www.flickr.com/photos/x1brett/4133496052/</a></p>
      <p>There are also a lot of polish issues, but I guess those should wait.</p>
      <p>hhp</p>
