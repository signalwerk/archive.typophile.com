    <p>I'm looking for some feedback as I work out the details of this typeface. There two main quirks/characteristic that I think should be defining for this typeface: 1) some bowls and stems connect with one with curved stroke and one straight stroke 2) some strokes don't connect connect to the stem at all.</p>
    <p>The issue I'm facing is where to use these quirks and how to reflect the style in the rest of the characters.</p>
    <p>Here's the current character set:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/test1_4365.png"></div><p></p>
    <p>And here are the original characters with some alternate options<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/test2_3508.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/test3_5342.png"></div><p></p>
