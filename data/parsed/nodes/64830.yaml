      <p><em>I’m not opposed to cerulean’s idea but I’m not sure how each would benefit from being different. What characteristics of the uppercase and lowercase are you thinking I could utilize for each?</em></p>
      <p>I'm just figuring this out as I write, but to my eye, with the capital, balance becomes more urgent; but with the lowercase, openness and  consistency come to the fore as more important. Caps can be self-standing; lowercase wants to flow. So, looking at the "Sally sells seashells" pic, I'd build on the dark gray /S/ (as you're doing), but for the lowercase go back to developing the black /s/ (which looks quite good with /e/ and /a/, for example).</p>
