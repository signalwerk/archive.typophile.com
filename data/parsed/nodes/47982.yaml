      <p><a href="http://www.proximasoftware.com/fontexpert/" rel="nofollow">FontExpert</a> has the ability to print out specimens of selected fonts on your system.</p>
      <p>It sounds ideal for your needs.</p>
      <p>"Print Fonts<br>
      FontExpert 2007 can print selected fonts. It is easy to print character map, "water flow" or face name reports for selected fonts, either installed or uninstalled. You can customize and format page headers and footers as desired, for example, by adding the name of your company. "</p>
