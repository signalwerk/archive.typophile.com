      <p>Old fashioned? The earliest Greek inscriptions have a form that could be called sans serif, and it can be argued that the earliest letter forms in recorded history are sans serif.</p>
      <p>"Modern" by definition is that which is functional, legible, and suits the task for which it is intended. A serif type is easier to read for long stretches. Publishers are not tied to this convention because it is traditional, but because it is functional (i.e. modern).</p>
      <p>If the magazine in question is intended to be browsed, not read, a sans serif type would work. If the articles are long, however, a modernist would choose a more functional and reader-friendly serif type.</p>
