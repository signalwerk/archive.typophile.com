      <p>You really should firm up the font before you decide on the size. (And I'm not crazy about Neo Sans as a text font. It seems more suited to headings.)</p>
      <p>Some fonts can be set smaller if they have a large x-height. For instance ITC Garamond can be several point sizes smaller than Adobe Garamond due to the radically different x-heights. (There will also be leading issues.)</p>
      <p>And if you can't print it locally, save it as a PDF and take that file somewhere that you can make a printout.</p>
