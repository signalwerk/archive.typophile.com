      <p>Please use a serif type for body copy. After about a page of reading sans serif, your readers will tire. I know there are a lot of people out there who defend the use of sans as a text face. They are used to reading small amounts of information at a time (say, no more than three paragraphs), and for this sort of thing, sans is fine. Any book or magazine intended for continuous reading, and published by a major publisher, is always set in a serif type.</p>
      <p>As groundbreaking as "The New Typography" was, even Jan Tschichold was willing to admit this. All his later book typography was set in serif type.</p>
