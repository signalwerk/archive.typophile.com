      <p>Simon --</p>
      <p>Depends on your audience. Middle-aged readers tend to like larger type, because for most of us it's getting harder to read the really small stuff; but younger readers may like it small (though not tiny). The art director for a New York book publisher I spoke with recently pointed out that, if she used a small type size in a book aimed at a young demographic, the younger readers would perceive it as a book for old people, and not buy it. </p>
      <p>And although it's a good rule of thumb that serif faces are more often best for extended text, there are more important things than whether a typeface has serifs or not. I just got through reading a novel, quite happily, that was typeset in Optima. (It all depends on the spacing, of course. Sans serifs, especially light weights, are always getting tracked too tight in text; that kills readability.</p>
      <p>Mário Feliciano designed his FTF Stella as a text face for a surf magazine. I don't know how closely the readers of "Surf Portugal" read the text, but he said that when he tried using a serif typeface, they complained. Stella is a humanist sans; that's the direction to go, if you're looking for sans serifs typefaces that might actually work in extended text. </p>
      <p>In general, I think sans serifs in text need narrower columns (unjustified) than serif faces – but that of course all depends on the individual face. And on everything else about how it's spaced.</p>
