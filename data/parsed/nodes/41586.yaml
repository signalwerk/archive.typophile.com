    <p>Hi all.  I'm currently putting a magazine together for someone, and on one particular article that spreads out over three pages there's a lot of text to get in (not to mention pics).  Anyway, this got me to thinking; is there a recognized size for type in magazine articles?  Currently I have the type in the aforementioned article at 6.5pts, but seeing it in the screen its hard to really tell if 6.5pts is a tad too small for magazine print.  Before anyone suggests printing it out I have to say I have a Dell printer that wont work with my Macs, so that's a non starter.  Anyone with experience care to help me?</p>
    <p>Thanks in advance</p>
    <p>Simon (Mr.Gone)</p>
