      <p>I'll just chime in and say I agree that you need to test the typeface on the printed page. Even if you only shape some text into the desired column width with several different point sizes and leading adjustments. Even for a graphic design magazine 6.5 pt (especially 5.5 pt) is far too small if the text is meant to be read. </p>
      <p>Many typefaces do not look the same on the monitor as they do on the printed page. The big boys would even suggest printing it on the same press and same paper intended for use. This isn't always possible, of course, but do what you can to get it as close to final. If not you could be surprised, for instance, at how light the text might print once it is on that gloss text weight paper at 3600 dpi compared to a quick print out on a 1200 dpi printer using offset paper. But, at least you'll have an idea.</p>
