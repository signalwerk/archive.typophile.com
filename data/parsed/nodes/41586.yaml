      <p>I have been art directing publications for over 4 years now and every<br>
      magazine uses 7.5 typeface. All were Serif body copy.<br>
      It depends on your page size, I am guessing that you are using a standard size so<br>
      that should be fine. As for serif or sans, well it depends on your audience<br>
      Sans has a more modern feel, where serif is more a matter of fact.<br>
      Helvetica Nue is a clean family to use that does not draw attention to it's self.<br>
      If you want a font with a touch of flavour try a Humanist face such as Aaux Pro.<br>
      With all that make sure you have the leading set at 9 pt (if 7.5 is what you go with).</p>
