      <p>Actually I recommend you print it out BEFORE you are too far down the road. As a designer who works in old media (print) I cannot emphasize enough how very important it is to see the printed page. For example, to view my work at true actual size, I need to view it at 137%. Viewing it at 100% is extremely misleading. But... 137% looks huge on the monitor. It can get very confusing. I learned the hard way, when my printer was on the fritz, that you really need to look at printouts - trimmed down. There are a couple of books I'd love to redo with the type a little smaller. You need to invest in a printer that will work with your Mac. </p>
      <p>You are getting this advice from a lot of people; it would behoove you to heed it.</p>
