    html: "<p>New typefaces! GOTHAM and GOTHAM CONDENSED <br> <br>     I'm delighted to introduce the first of many new typefaces  <br>     designed exclusively for The Hoefler Type Foundry by Tobias  <br>     Frere-Jones: <br> <br><a href=\"http://www.typography.com/catalog/gotham\" target=\"_top\">http://www.typography.com/catalog/gotham</a> <br> <br>     A native New Yorker, Tobias celebrates his return to the city  <br>     with GOTHAM, a new family of sans serifs in regular and  <br>     condensed. Gotham takes both its name and its inspiration <br>     from a type of public lettering common to New York -- these <br>     are the plainspoken alphabets of shop windows and billboards, <br>     rendered in paint, plaster, neon, glass and steel, which every <br>     designer has admired at one time or another. <br> <br> <br>Special Offer! <br> <br>     Right now, get Gotham Condensed for less than half price when  <br>     you buy Gotham:  <br> <br><a href=\"http://www.typography.com/catalog/gothamcondensed\" target=\"_top\">http://www.typography.com/catalog/gothamcondensed</a> <br> <br> <br>------------------------------------------------------------------------- <br> <br>Final Days -- Save $100 on Hoefler Text &amp; Hoefler Titling <br> <br>     Time's running out on our special offer on Hoefler Text and  <br>     Hoefler Titling. Now through next Friday, July 5, you'll save <br>     $100 when you order both fonts together: <br> <br><a href=\"http://www.typography.com/catalog/hoeflertitling\" target=\"_top\">http://www.typography.com/catalog/hoeflertitling</a></p>"
