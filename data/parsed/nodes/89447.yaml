  - id: 492900
    user: 31798
    date: 2012-01-27T07:35:00
    date_raw: 27 Jan 2012 — 7:35am
    votes: null
    html: |-
      <p>AFAIK, the restriction that font names must begin with an alphabetic character only holds true for the PostScript Name.</p>
      <p>Since there are various different name fields within a font, I suspect that you may have mistyped the name in one of those fields and that InDesign is getting the name from that field whereas other applications are getting the name from somewhere else. In FontLab, double check that the name used in the Font Names, OpenType-Specific Names, and Additional OpenType Names all contain 47 rather than 74 and that your PostScript Name is something like 'FortySevenHalfTon'.</p>
      <p>André</p>
