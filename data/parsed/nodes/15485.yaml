    html: |-
      <p>Paul, if you use MakeOTF (from the <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a>) you only have to specify 5 names for each font, and 3 of those are simply straightforward. MakeOTF will take care of the rest.</p>
      <p>The structure of the each entry in the <code>FontMenuNameDB</code> file is:<br>
      <code>[PostScriptName]<br>
      f=FamilyName<br>
      s=StyleName (a.k.a. Subfamily name)<br>
      c=WindowsCompatibleMenuName<br>
      c=1,MacintoshCompatibleMenuName</code></p>
      <p>Here are some of the entries for Minion Pro, for example:<br>
      <code>[MinionPro-Regular]<br>
      	f=Minion Pro<br>
      	s=Regular<br>
      	c=Minion Pro<br>
      	c=1,Minion Pro</code></p>
      <p>[MinionPro-It]<br>
      	f=Minion Pro<br>
      	s=Italic<br>
      	c=Minion Pro<br>
      	c=1,Minion Pro Ital</p>
      <p>[MinionPro-Bold]<br>
      	f=Minion Pro<br>
      	s=Bold<br>
      	c=Minion Pro<br>
      	c=1,Minion Pro Bold</p>
      <p>[MinionPro-BoldIt]<br>
      	f=Minion Pro<br>
      	s=Bold Italic<br>
      	c=Minion Pro<br>
      	c=1,Minion Pro Bold Ital</p>
      <p>[MinionPro-Medium]<br>
      	f=Minion Pro<br>
      	s=Medium<br>
      	c=Minion Pro Med<br>
      	c=1,Minion Pro Med</p>
      <p>[MinionPro-MediumIt]<br>
      	f=Minion Pro<br>
      	s=Medium Italic<br>
      	c=Minion Pro Med<br>
      	c=1,Minion Pro Med Ital</p>
      <p>As you see, the PostScriptName takes the general form of FamilyName-StyleName (it can't be longer than 31 characters, so the StyleName portion sometimes needs to be abbreviated. Another important thing is the hyphen; some applications rely on its presence to sort the fonts in the menu).<br>
      The FamilyName and StyleName are straightforward. Each of these has to be limited to 31 characters.<br>
      The WindowsCompatibleMenuName is used for style linking and family subgrouping on Windows. There can only be a maximum of 4 fonts with the same WindowsCompatibleMenuName within the same typeface family.<br>
      The MacintoshCompatibleMenuName is usually based on the WindowsCompatibleMenuName, and it needs to be different for each font in the family. These Windows and Mac names are limited to 31 characters as well.</p>
      <p>That's as easy as it can get, I think. All Adobe fonts are built this way and they seem to work just fine across applications and operating systems.</p>
