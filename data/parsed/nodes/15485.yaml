      <p>If it's an OpenType font, it would be the "Mac Name" on the OT Specific Names panel. I discovered this while working on Proxima Nova. Fonts with names longer than 29 characters in that field don't show up in the font menu in Word (Quark, too, I seem to recall). </p>
      <p>(So, Proxima Nova Extra Condensed Extrabold Italic was a definite no go. I shortened it to Proxima Nova ExCn Extrabld It. I developed a consistent abbreviation scheme for all 42 fonts.)</p>
