    <p>Setup:<br>
    I own a MacBook Pro i7 2,8 Ghz processor with 8 GB memory, 250 MB SSD, Lion installed (10.7.4) with FontLab 5.1.2 (4447).</p>
    <p>Problem:<br>
    Crashes constantly (ten times a day) an irregular but usually when editing in glyph-window-mode.</p>
    <p>Any one else with similar setup – do you have this problem?</p>
    <p>Right now I’m looking for replacement software like ”Glyphs” any suggestions?</p>
    <p>–FontLab, SHAPE-UP!!!<br>
    In one years time I’m going to need retina-supported software as well!</p>
    <p>BW,<br>
    KTKM<br>
    (Frustrated but devoted FL-User since 2004)</p>
