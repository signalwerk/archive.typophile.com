      <p>I have been using RoboFont over the summer and plan to continue using it. FontLab is still part of my toolbox, and probably will stay there. I haven't made anything from start to finish in it yet, and I definitely don't feel as fluent with it as I am with FontLab yet. But it also took some time to get accustomed to FontLab.</p>
      <p>Seems to me that RoboFont's biggest fans are developers who are big users of UFO and Python, and who want total control over their workflow (as opposed to a workflow that's dictated by the font editor). It fits right in with the other existing UFO-centered tools better than FontLab. Plus, you can endlessly customize it using Python, and this is a big part of its appeal. Out of the box, it's not as capable as FontLab, but it's not meant to be. It's intended as a glyph editing and drawing component of a larger set of tools. So, comparing it to FontLab is a bit of apples and oranges.</p>
