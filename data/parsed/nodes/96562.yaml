      <p>Mike,</p>
      <p>well, it's difficult to explain. Most functionalities have a different approach. For example, we have unlimited layers which includes any numbers of outlines and bitmaps (color, grayscale or b/w). Glyph design and spacing happens in one unified window, which supports any OpenType features including Indic and Arabic shaping. The "blind" implementation of Multiple Master is replaced by a very different approach to interpolation across different masters. Character sets, encodings, codepages are seriously revamped. Etc. etc. </p>
      <p>All this has serious implications to the workflow. I think you're right to assume that quite a few of functionalities that you've mentioned will be unified in the new app.</p>
