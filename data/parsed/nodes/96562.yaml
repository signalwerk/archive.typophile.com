      <p>Actually, no, Chris. The format of the .flc file is unique to FontLab. Nothing to do with feature file syntax.</p>
      <p>What you want is the "Save features…" command in the little pop-up menu on the top left corner of the OpenType panel. This will export everything in feature file syntax, including the kerning classes and kern feature. </p>
      <p>Note: Confusingly, RoboFont puts all your classes into its Groups feature. However, groups in RoboFont are not used by OpenType features. I'm not sure what they are good for. In any case, there is a RoboFont extension I would recommend called Groups2Features that does finish the job, allowing you to move any of your classes from groups into your feature code. I would also recommend the FeaturePreview extension.</p>
    html_clean: |-
