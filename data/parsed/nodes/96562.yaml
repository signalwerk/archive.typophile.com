      <p>Robofont is great. But one major issue with it now is that it is conceived as a glyph editor and doesn't provide tools for hinting. You can autohint with the AFDKO on generating a OTF, or with ttfautohint if you're doing TrueType, and that's basically it. I have a few few fonts with PS links in FontLab. In Robofont I will just loose this information and have to rely on what a tool is doing automatically. With the demand for webfonts, this is not enough. So just for that, FontLab is still a major, functional and advanced tool.</p>
      <p>The great strength of Robofont is the UFO workflow and community. While robofont has nothing for hinting, you ***could*** build your own tool for it (or for whatever else), and attach it to Robofont as a plugin or as an external tool like MetricsMachine. That is already happening with RoboHint: <a href="http://vimeo.com/38350058" title="http://vimeo.com/38350058">http://vimeo.com/38350058</a></p>
      <p>As far as FontLab goes, sure last years have been annoying as hell. And surely when you pay for a product you expect it to work well. But as font makers, don't we also experience the difficulty of producing software that has to work in different environnements over a long period of time? Sometimes you get requests and just can't answer them in a timely matter because you have to finish a project or find out what is causing that problem. Would you really like your customers to treat you like an idiot because kerning is suddently not working in Word after they updated their computers?</p>
      <p>Beating on the FontLab guys relentlessly just shows a lack of respect and understanding.</p>
      <p>(And I have my share of unanswered questions/requests on the FontLab forum)</p>
      <p>Now it would be great to get an answer there: <a href="http://typophile.com/node/36474?page=1" title="http://typophile.com/node/36474?page=1">http://typophile.com/node/36474?page=1</a><br>
      :)</p>
