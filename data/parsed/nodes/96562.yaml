      <p>Octopi,</p>
      <p>yes, that's right. We won't be releasing a new major upgrade of FontLab Studio based on the old codebase. Maintaining it has become increasingly complex. </p>
      <p>The new font editor we're working on, which we'd like to release in 2013, won't be a direct continuation of the current FontLab Studio as we know it today. </p>
      <p>Of course we will be offering discounted pricing for all existing users of FontLab Studio (and for users of other our products accordingly) -- just as we had offered discounted pricing in the past for, say, users of Fontographer who'd like to purchase FontLab Studio.</p>
      <p>We think that for some time, users will find it useful to have both products. It's likely that some of the "font tech trickery" features which are part of the current FLS won't be included in the new product. </p>
      <p>I'm excited to say that we've shown an early preview of our new font editor at ATypI in Hong Kong last week, both publicly and, in more depth, privately to some respected type designers, and they reacted very positively to what they have seen. </p>
      <p>This gives us strength to continue our efforts to create the best tool for type design on the market. Many thanks for your continued support! </p>
      <p>Best,<br>
      Adam</p>
