      <p>Oh, well that's a simple answer: Paste them into the beginning of your feature code. (Actually, they can go anywhere as long as they precede the features that use them.)</p>
      <p>I actually don't put my feature code directly into my font editor (either FontLab or RoboFont). Instead I do this:</p>
      <p><code>include (features.fea)</code></p>
      <p>...where <code>features.fea</code> is a text file (containing all my feature code) in the same directory as my font source file (.vfb or .ufo). I use TextMate or BBEdit to edit the code. Once it's saved, I can test the features in the font editor just as if I had typed them into my font editor. </p>
      <p>This has two big advantages: Better code editing tools (like code completion and complex search and replace) and the ability to share the same feature code across a family of fonts.</p>
      <p>You can use <code>include</code> multiple times for multiple files if you need to break things up more or have exceptions that don't apply to every member of a font family (like maybe all style don't have small caps). You can also use <code>include</code> in a <code>.fea</code> file if you want (though this tends to just make things more complex).</p>
