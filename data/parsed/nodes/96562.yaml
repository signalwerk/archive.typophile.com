    html: |-
      <p>Bill, I assume you mean the FontBureau folks? Since they were big sponsors for RoboFont, they probably had great input on what went into it and became committed to using it because of their involvement.  I don't think the "Best Stuff" comment is applicable or even important.  My guess would be that the Brothers Berlow needed something that fit into their workflow and were sick and tired of waiting for FontLab to fix their mess. You have worked with FB so you know more than I but it seems to me that they had a set of tools from several sources (Metrics Machine included) that did everything but be a drawing tool. They then made RoboFont into their drawing tool and kissed the bug-infested prior software of choice goodbye. They have the developers of RoboFont on speed dial and are listened to quickly there.<br>
      This has nothing to do with "best stuff" and everything to do with an efficient production process that is not held hostage by the snail-paced exterminators at FontLab.<br>
      Personally, I have all three applications (RoboFont, Glyphs, and FontLab). My problem is that everything I have in process was begun in FontLab and I have had difficulty switching over without spending my time learning the new ones instead of finishing what I have on the front burner now. I will begin my next "from scratch" font with RoboFont to give it a shot [I too am sick of the slow pace in bug fixes--notice I say bug fixes and not "new features" because new features just bring new bugs].</p>
      <p>As to your question?  I don't know what other people use.  Perhaps you could post it as a survey question on Typophile and see?</p>
