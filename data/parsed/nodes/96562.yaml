      <p>Don't forget that class definition syntax is a bit different than in FontLab. In FontLab you do this:</p>
      <p><code>myclass: a b c d e</code></p>
      <p>In AFDKO syntax you would do this:</p>
      <p><code>@myclass = [a b c d e];</code></p>
      <p>If you export your classes from FontLab into a text file, it does the conversion for you.</p>
