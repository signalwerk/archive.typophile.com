    html: |-
      <p>I totally sympathize with the tenor here. We at FontLab tremendously respect our user community, and have been working hard. </p>
      <p>However, the fact is: the current codebase of FontLab Studio was written on Windows and was then ported to Mac OS 9, then to PowerPC Carbon on Mac OS X, and then to Intel Carbon on Mac OS X. It's like a wardrobe that you kept dismantling and reassembling three or four times, each time you move. The fourth iteration will squeak and wobble no matter what you do. We've had three full-time developers working primarily on stability of FontLab Studio 5.1 for over a year now, and you can see the results. They are, well... (Please note that, despite the fact that it was three man-years of development, we decided to release FontLab Studio 5.1 for free to all existing users.)</p>
      <p>This only confirms the decision we made three years ago to build up a completely new codebase from scratch (Victoria). Since then, a second team of three developers has been working on this under the greater-than-ever Yuri Yarmola. </p>
      <p>*Finally*, at ATypI Hong Kong (next week) we'll be showing the first application based on the Victoria technology. </p>
      <p>It won't be the new FontLab Studio this time, but let me just say that it opens 200 UFOs in under 25 seconds total, is very stable and I think many of you will like it a lot, whether you're on FontLab Studio, Fontographer, Glyphs, RoboFont or FontForge. </p>
      <p>For the first time ever, we won't have to deal with a huge effort of porting code between Mac and Windows (we can release applications for both platforms practically from the same core), so we can concentrate on the *relevant things*, not on aligning some stupid dialog boxes and making sure that copy-paste of text doesn't crash the application. </p>
      <p>It took Adobe many years to develop InDesign 1.0 because they could not develop PageMaker any further. It took Apple many years to develop Mac OS X 10.0 because they could not develop Mac OS 9 any further. They needed fundamental change. </p>
      <p>And yes, some people actually moved away from Mac OS 9 to Windows in that process. Some switched back over to Mac OS X. And quite a few switched to Mac OS X from Windows even though they had never used a Mac before. </p>
      <p>However: in both Apple's and Adobe's cases, people were frustrated because it took the companies so long, and the very initial releases of the products were also frustrating to some. </p>
      <p>Yet, if you use InDesign on Mac OS X now, and perhaps think back to PageMaker on Mac OS 9, I'm not sure you would want to ever go back. </p>
      <p>So, as for FontLab Studio: there will be one more version of FontLab Studio 5.x for both Mac and Windows available this year. It will be maintenance release with a few potentially useful features. </p>
      <p>A brand-new font editor will follow, based on Victoria. Some 60-70% of the new editor are ready, but there are still some major parts missing. It will be free of all those frustrating limitations we had to live with for the last 5-10 years which were part of FontLab Studio. I might even say, it'll be free of quite a few frustrating limitations that any type designer had to live with, regardless of the tools they use. </p>
      <p>It certainly won't be the old shit. It'll be a fundamental change. </p>
      <p>Perhaps it'll be new shit. You'll be the judge. But I cannot say "available now" just yet — sorry. </p>
      <p>I've been on this bumpy ride of Victoria development for three years now. It's been the busiest and the most exciting time since I joined FontLab. To me, and people who have seen it, the results are absolutely breathtaking. </p>
      <p>So, prepare yourselves to join the last bit of the bumpy ride in 2013. Don't hold your breath quite now, save that for later. But please keep your fingers crossed for us. </p>
      <p>By all means, if FontLab Studio 5.x is causing you pain, use Glyphs or RoboFont until then. Since the Victoria-based font editor will be an entirely new product anyway, we'll need to win over the users of existing apps to switch — be it our own or someone else's apps. </p>
      <p>Did I say 2013? Yes, I did say 2013. And we mean it. </p>
      <p>Best regards,<br>
      Adam</p>
