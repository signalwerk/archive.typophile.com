      <p>David - I 'm primarily sending out PDFs. InDesign takes full advantage of PS and Illy features when you place native files. Place an Illustrator EPS - you will see a white background - .ai - gone. It's very rare someone asks me for a packaged ID file, basically only on really large signage like billboards. A lot of billboard printers and a few national magazines also ask for layered native files from PS and Illustrator. As long as I'm getting proofs I don't worry…<br>
      peace</p>
