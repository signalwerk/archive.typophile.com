    html: |-
      <p>Re "At the last adobe roadshow the guy there said that the future lies in using pdfs instead of eps/tiffs...."</p>
      <p>It can become a bit baffling when you find an orphaned PDF on your desktop and aren't sure whether you should open it in Photoshop,  Illustrator, or just Acrobat; I think there's some value in using the least complex file format suitable for a given image.</p>
      <p>And if you're going through iterations of your Photoshop/Illustrator artwork, saving with different version numbers, it's handy to just save off a 'flat' EPS/TIFF with the same name each time, so that links in my Quark/InDesign doc can just be updated.</p>
