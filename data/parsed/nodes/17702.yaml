      <p>Good explanation istitch.<br>
      quote - As for transparent backgrounds, tiffs can do layers the same way PSDs can, and illustrator opens an EPS just as easily as an AI, so what’s the attraction of leaving a file in adobe native format?</p>
      <p>InDesign is built to use the native formats of Illustrator and Photoshop. So why struggle? It also handles transparency better from these formats.<br>
      A lot of these ideas come from working with Quark. I am not talking about Quark.<br>
