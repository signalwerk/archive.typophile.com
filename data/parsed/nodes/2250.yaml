    html: <p>I bought the Octavo CD of Bodoni's "Manuale" but didn't think the resolution (300 dpi?) was sharp enough for a really good inspection of the type. <br> <br>I guess I'm spoiled by my plain ol' $150 desktop scanner (Snapscan), which is like a microscope, at least 1200 dpi, if I recall.</p>
