  votes: null
  html: "<p>Hello, <br> <br>it's now half a year that <b>I am searching for a website that was offering high quality scans (300 DPI) of some really old books</b> (from the 14th to 19th century I think). <br> <br>As far as I remember it was in italian or spanish, a kind of an online exhibition of a museum or a foundation. There were italian, spanish, french, german and english books. Per book there were at least 3 scans. Mostly one of the title page, some illustrations and the colophon. <br> <br>And I tell you, the illustrations in those books were more than fantastic! As I first saw it I was thinking \"now that's for sure the best way to study old faces online\". <br> <br><b>Now, can somebody help me out with the URL?</b> (I've lost it due to a hard drive crash..) <br> <br>The only thing that comes close to it is <a href=\"http://wally.rit.edu/cary/cc_db/subject_library.html\" target=\"_blank\">http://wally.rit.edu/cary/cc_db/subject_library.html</a> but it is still miles away of the material offered on the other website. <br> <br>Thank you, <br>Roman Schechtel <br>(for german readers: <a href=\"http://www.designmadeingermany.de/forum.php4?thread_ID=3549\" target=\"_blank\">http://www.designmadeingermany.de/forum.php4?thread_ID=3549</a> )</p>"
