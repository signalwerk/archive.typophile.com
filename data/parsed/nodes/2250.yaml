    html: "<p>Octavo rules. <br> <br>I recently did a little \"experiment\" in separating the ink and the impression from letterpress. <br>Instead of the front, I took the <i>backside</i> of the impression of a large \"R\" from an Octavo book... <br> <br><img src=\"http://www.typophile.com/forums/messages/30/21488.jpg\" alt=\"R_f&amp;b.jpg\"> <br> <br>then flipped it horizontally and inverted the brightness: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/21489.gif\" alt=\"R_noink.gif\"> <br> <br>So that's the impression itself (although somewhat damped by the consistency of the paper). <br> <br>hhp <br></p>"
    html_clean: "<p>Octavo rules. <br> <br>I recently did a little \"experiment\" in separating the ink and the impression from letterpress. <br>Instead of the front, I took the <i>backside</i> of the impression of a large \"R\" from an Octavo book... <br> <br><img src=\"http://www.typophile.com/forums/messages/30/21488.jpg\" alt=\"R_f&amp;b.jpg\"> <br> <br>then flipped it horizontally and inverted the brightness: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/21489.gif\" alt=\"R_noink.gif\"> <br> <br>So that's the impression itself (although somewhat damped by the consistency of the paper). <br> <br>hhp <br></p>"
