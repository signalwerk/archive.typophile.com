    <p>Greetings, fontologists. I’m putting together a fan site for the really quite good British band Pure Reason Revolution, and am stumped when it comes to the font they use in their graphic profile. Nothing that follows the general lettershape of the font has a an A or U like what I’m looking for.</p>
    <p>Here’s a URL for their logo (Hope it doesn’t break the forum):</p>
    <p><a href="http://www.brick-yard.com/base%20images/library%20images/bands/pure%20reason%20revolution/PPR%20-%20logo250.jpg" title="http://www.brick-yard.com/base%20images/library%20images/bands/pure%20reason%20revolution/PPR%20-%20logo250.jpg">http://www.brick-yard.com/base%20images/library%20images/bands/pure%20re...</a></p>
    <p>I’d be grateful for any assistance, as this band has such an awful offical site that a professional fan site is direly needed.</p>
