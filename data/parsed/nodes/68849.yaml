      <p>@Richard</p>
      <p>Yes, page load time is a big deal. But the subroutinization thing only works for OpenType CFF (not TrueType), and nobody who knows what they're doing is going to use OpenType CFF at all today, because of the rendering issues in current Windows browsers.</p>
      <p>Now, that being said, there is also a less-general TrueType concept, the composite glyph, which uses other things as components. Not as strong a general function, but it is handy for accented characters, and makes uncompressed TTFs noticeably smaller than they might otherwise be.</p>
      <p>Cheers,</p>
      <p>T</p>
