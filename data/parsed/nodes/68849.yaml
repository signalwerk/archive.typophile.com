      <p>I am not surprised that all the various compression options are at least vaguely similar in effect. However, the point remains that not everyone controls their own web server, and that "raw" fonts are going to be a significant proportion of web fonts being viewed for a couple of years, at least.</p>
      <p>The web font advantages of subroutinization are certainly temporary. But as long as it works correctly, there's no reason NOT to do it, and making the native fonts smaller is good.</p>
      <p>It's unfortunate that the current subroutinization code in FontLab has a bug, but that doesn't mean subroutinization is a bad thing.</p>
      <p>Regards,</p>
      <p>T</p>
