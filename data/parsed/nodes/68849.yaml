    html: |-
      <p>In the AFDKO 1.6 library that is incorporated into FontLab Studio 5, there is a bug concerning the "depth" of recursive subroutines, which results in very modular, repetitive typefaces to compress very well but actually invalidate the spec, so Mac OS X revokes them. The AFDKO 2.5 library that is available as a standalone product and will be incorporated into Fontographer 5 and FontLab Studio 6 no longer has this bug. </p>
      <p>As an interim measure, I do recommend turning the CFF compression off in FontLab Studio. </p>
      <p>Regards,<br>
      Adam</p>
