    html: <p>Compressing outlines is useless. Fonts are small enough. And the hinting of a compressed font is often misinterpreted, if you open it in FontLab. In most cases it is a violation of licenses, but I for my part don’t contact foundries in cases, in which I am able to tune or correct fonts, remapping of characters for example. Well, if I can avoid it, I don’t use FontLab for those corrections, but many people use it. And there may be cases, in which you want to open your own OTF in FontLab. Except from that I think, there was a problem with the AFDKO (the autohint program), if the outlines are compressed.</p>
