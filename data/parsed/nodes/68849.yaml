    html: |-
      <p>@Arno</p>
      <p>My comments about "not everyone controls their own server" refers to Gzip, not WOFF. The server doesn't unpack them, but it has to know about which files are Gzipped.</p>
      <p>I wasn't in any way objecting to using WOFF, just pointing out that there is a significant chunk of web font delivery out there that is neither WOFF nor EOT, and a noticeable chunk of users can't easily use Gzipped fonts (or don't know how to change their server configuration), meaning that there is still an advantage to natively compressed fonts.</p>
      <p>But what I'm missing the boat on is, nobody who is sane wants to serve OpenType CFF fonts as web fonts now anyway, as their rendering in Windows browsers sucks. The browsers-of-the-future that render them well will probably all have built-in WOFF support, so my point is doubtless moot.</p>
      <p>I still like smaller font files "just in principle," though.  :)</p>
