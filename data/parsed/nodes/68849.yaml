      <p>&gt; Compressing outlines is useless. Fonts are small enough.</p>
      <p>Until you start getting into web fonts which need to get downloaded for every visitor, and whose file size directly relates to the page load time.</p>
      <p>Of course, using Gzip on the font files on the server may provide similar or sufficient compression benefits. It would be interesting to compare CFF compression rates. But not everyone has complete control over their server-side compression, so providing a more compact font is probably a Good Thing, if those fonts might be used directly as web fonts.</p>
      <p>Cheers,</p>
      <p>T</p>
