      <p>@ Thomas</p>
      <p>With regard to the hinting I only saw the FontLab bug, when it decompiles fonts. More to the point, I saw a problem with hint substitution and counter hints (vstem3/hstem3) in the small letter m, as far as I remember. Formerly I first generated fonts with FontLab, then I used the autohint program, that belongs to the AFDKO and in the end I tried to correct a few things in FontLab. And FontLab did damage the hinting on opening the fonts (but not on generating them). (Meanwhile I use the AFDKO autohinting program directly in FontLab.) The hints are likewise in the cff table and the subroutine compression applies also to the hints.</p>
      <p>And with regard to the server I don’t understand, what you mean. Converting fonts to the woff format is a question of seconds. In the woff format even digitally signatures survive. The subroutine compression changes fonts, woff or gzip don’t. And the server does not make a difference between woff and otf. By the way, I may be wrong, but does the server really unpacks gzipped files? Or does the browser unpack them? If the server unpacks them, where is the advantage of gzipped files, except from sparing storage on the server? Well, I should google for the answer.</p>
      <p>Thomas, I am burning to see Adobe’s new PS hinting tutorial. Do you know, if it is already finished?</p>
