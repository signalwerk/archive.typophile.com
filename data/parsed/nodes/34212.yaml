      <p>In general, this has to do with <a href="http://www.myfonts.com/activity/hinting/" rel="nofollow">hinting</a>. Most fonts simply don't look good in small screen sizes unless they're extensively tweaked ("hinted") with low resolution in mind. Fonts such Verdana, Arial or Times New Roman have undergone months of manual hinting done by best experts in the field. </p>
      <p>A.</p>
