      <p>A great trick is to use layers in PhotoShop. Just duplicate the textlayer several times. Play with the settings (eg bottom smooth, second layer sharp with 50&amp; opacity, and so on). This way the end result is way beyond what PS can do out of the box.</p>
      <p>Another trick is to build the type-images at twice or thrice the required size and downsample them in the end, where the different GIF-settings provide alternative endresults.</p>
