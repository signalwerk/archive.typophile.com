  html: <p>I don't really know if I'm in the right forum, but this is my problem - I have chosen Perla for my logotype and posted another topic about that a while ago when I needed help to make an image out of it. Every single person I asked - and I talked to about ten or so - gave me different solutions how to do that, but I followed Lherrou's advice - thank you!  :-) But I took the easy suggestion and not the one including CSS. It worked, but the font looks "grainy" and not sharp enough. My question is - does the "CSS way" make the font sharper? Or is there another way I can do that? I paid quite a lot for that font and I love it and it's a big part of my web site so it's really bad if I can't make it look better. Would be really grateful for some help!  :-)</p>
  html_clean: <p>I don't really know if I'm in the right forum, but this is my problem - I have chosen Perla for my logotype and posted another topic about that a while ago when I needed help to make an image out of it. Every single person I asked - and I talked to about ten or so - gave me different solutions how to do that, but I followed Lherrou's advice - thank you!  :-) But I took the easy suggestion and not the one including CSS. It worked, but the font looks "grainy" and not sharp enough. My question is - does the "CSS way" make the font sharper? Or is there another way I can do that? I paid quite a lot for that font and I love it and it's a big part of my web site so it's really bad if I can't make it look better. Would be really grateful for some help!  :-)</p>
