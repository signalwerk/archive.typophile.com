      <p>BTW the Alt is for grabbing the active window.<br>
      Without the Alt it grabs the whole screen, which is generally less useful.</p>
      <p>&gt; I don’t know how it’s going to look when I load it up.</p>
      <p>It will look the same, unless you scale it, which is almost never<br>
      a good idea however. But it will look a bit lighter on Macs.</p>
      <p>If you're trying to figure out how large your images<br>
      will come out on your users' screens, all you have to<br>
      do is factor in your own screen's size, comparing it<br>
      to the typical screen size, which is about 1024×768.</p>
