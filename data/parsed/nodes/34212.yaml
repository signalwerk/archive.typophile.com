      <p>Yep, I would use Perla in large sizes only on screen, generally bigger than 48 pt. And use it for display purposes (headings and such), not lengthy copy.</p>
      <p>As for the "ideal" size of a web page, it depends on your content, layout, and audience. You're probably fine with a design that has an overall width of less than 1024 pixels these days. Just keep your line length around 66 characters for copy or it will become difficult to read.</p>
