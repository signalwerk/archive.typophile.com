      <p>On Windows you do a screen grab by hitting the Alt-PrintScreen key sequence;<br>
      then you do a Paste in Photoshop. On Mac I think it's Shift-Option-1 or something,<br>
      I forget; then you load up the screen grab file that's on the desktop.</p>
      <p>Hinting and kerning are different things. The kerning you might need<br>
      to worry about is manual spacing adjustments between letters in a given<br>
      setting to make the spaces balance. But in Word this is quite tedious, so it<br>
      might be better here to nudge things around in Photoshop.</p>
      <p>Small, for a normal font, is less than about 24 pt (18 pt in "native"<br>
      Windows). But for a font like Perla the threshold is much higher.</p>
      <p>hhp</p>
