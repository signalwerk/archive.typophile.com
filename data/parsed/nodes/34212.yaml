      <p>If you're making an image out of the font, CSS has nothing to do with it (it has nothing to do with rendering quality anyway), and what you're encountering is the limits of resolution of the screen: there aren't enough pixels to make small text look very nice (especially for something as expressive as Perla). One thing you should check is that (if you're using Photoshop) the text rendering (the "aa" field) is set to "Smooth" and not "None". But if it is set to smooth and you're still unhappy then it means there's only one way to go: painting the individual pixels by hand to get the maximum quality. The thing is, this is pretty hard to do yourself, and pretty expensive to get somebody else to do.</p>
      <p>But I'm sort of guessing here, and I might be off concerning<br>
      what you're unhappy with, so showing an image would help.</p>
      <p>hhp</p>
