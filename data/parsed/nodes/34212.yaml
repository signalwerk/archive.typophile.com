      <p>There really is no way you are going to be able to use this typeface any any size smaller than what you see there online without massive hand tweaking at the pixel level. The stroke width contrasts in this face are just too extreme.</p>
      <p>That said, I'm always up for a challange and managed to come up with this::</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/perla_4284.gif"></div><p></p>
      <p>Still needs a lot of tweaking but is maybe passable. I took your source file, reduced it to 50% using bicubic interpolation, duplicated the layer, set the top layer to 'multiply' mode, then tweaked the opacity of the top layer to suit.</p>
      <p>I then merged that and reduced it down to 75% of that.</p>
      <p>The next step would be to go back in at the pixel level and make sure the horizontal strokes are truly just one pixel thick.</p>
    html_clean: |-
      <p>There really is no way you are going to be able to use this typeface any any size smaller than what you see there online without massive hand tweaking at the pixel level. The stroke width contrasts in this face are just too extreme.</p>
      <p>That said, I'm always up for a challange and managed to come up with this::</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/perla_4284.gif"></div><p></p>
      <p>Still needs a lot of tweaking but is maybe passable. I took your source file, reduced it to 50% using bicubic interpolation, duplicated the layer, set the top layer to 'multiply' mode, then tweaked the opacity of the top layer to suit.</p>
      <p>I then merged that and reduced it down to 75% of that.</p>
      <p>The next step would be to go back in at the pixel level and make sure the horizontal strokes are truly just one pixel thick.</p>
