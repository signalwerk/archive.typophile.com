      <p>Kis had agreed to leave The Netherlands after learning punchcutting. I'm pretty sure you wouldn't like to engage in the cyberspace equivalent. :-)  So since you're bereft of a practical place to leave to...</p>
      <p>It's not my invention, and I wouldn't call it "cunning" - although there typically is an "Ah! Why didn't I think of that?!" moment when one finds out the (main) trick: in terms of bezier mechanics, you simply need to think of a 4×4 subgrid. This is actually patented, but the patent owners (not me) have decided not the enforce it.* The way you get to a 4×4 subgrid pixelfont varies; ideally you use the Ultrafonts converter (don't ask for it dude) which saves you a <cite>lot</cite> of time, by taking a GIF image of a glyph matrix and spitting out a TT font; but you can roll your own too.</p>
      <p>* Like Mercedes does (used to do?) a lot in the interest of safety. Pure class.</p>
      <p>The thing is though, the bezier mechanics is the (potentially) tedious, but easy part; the really hard, zen-mastery part is striking a quite peculiar balance, one not present in either 1-bit pixelfonts or outline fonts: a balance between design fidelity, crispness, and even color. When you get "in the zone" of this balance, it's really quite unlike anything else in type design, and it's very brain-draining to keep properly focused. Somewhat like kerning, but without anything to write on paper to keep yourself on track, and with a lot more guesswork, experimentation and definitely way more squinting. You literally find yourself moving your upper body like a cobra in a trance. And all this doesn't even address the gamma issue: between platforms, but also between normal and "reverse-video" setting.</p>
      <p>A totally different way is not to use an outline font, but to use something like BitFonter (now available for Windows - yay!) to produce a "true" bitmap font, which now can be grayscale, or even full color. But pixelfonts still have the advantage of being easier to deploy and more robust, especially cross-platform from what I gather.</p>
      <p>hhp</p>
