    <p>Well, I thought this would be easy to find, but it's proven difficult.  It's not your standard Pro Block or Varsity.. more like a hybrid semi-serif.  It's close to Varsity, but small differences (long middle and exaggerated serifs on E, lowered R centerline, right-angle serifs on S characters) make me think it's either custom, or another lesser-known font.  Any ideas?</p>
    <p>Sorry for the small sample, but these five letters are all I've got!</p>
    <p>(note: This is not the same font used on their vintage jerseys, <strong><a class="freelinking external" href="http://www.fansedge.com/Images/Product/51-29/51-29902-F.jpg">shown here</a></strong>.  It's a new style for this year, a modernized vintage, if you will.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sixerslou_3566.jpg"></div><p></p>
