  html: <p>is scary! <br> <br>this came to me from another list - don't know if its been mentioned here...I just had to post it...its so funny. <br>(clip) <br>Mood-Supporting Typeface Manipulation <br> <br>Looking at the typesetting for various books over the years it's become apparent that typeface can be used to support the mood of a message. An author should be able to select a section of text in a word processor and choose from menu items like Tense, Suspenseful, Angry, or Serene and have that supported by things like amount of kerning, serifs, even-ness of character spacing, line spacing, italicization, line weight, and character shape. The author should only have to worry about mood, not how the mood is achieved. <br> <br></p>
  html_clean: <p>is scary! <br> <br>this came to me from another list - don't know if its been mentioned here...I just had to post it...its so funny. <br>(clip) <br>Mood-Supporting Typeface Manipulation <br> <br>Looking at the typesetting for various books over the years it's become apparent that typeface can be used to support the mood of a message. An author should be able to select a section of text in a word processor and choose from menu items like Tense, Suspenseful, Angry, or Serene and have that supported by things like amount of kerning, serifs, even-ness of character spacing, line spacing, italicization, line weight, and character shape. The author should only have to worry about mood, not how the mood is achieved. <br> <br></p>
