    html: <p>There are a few other examples of different text faces being used in the same book, although not for emotive purposes. In A.S. Byatt's <i>Babel Tower</i> the novel within the novel is set in a different typeface, and in the first chapter of Umberto Eco's <i>Baudolino</i> different typefaces are used to indicate different texts in a palimpsest, including remnants of erased text.</p>
