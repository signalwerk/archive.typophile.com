    html: <p>I realize I'm resurrecting this thread from the bottom, but I've been away, so forgive my lateness with this comment. <br> <br>Have any of you read <i><a href="http://www.amazon.com/gp/reader/0375703764/ref=sib_dp_pt/102-4692538-5006533#reader-link">House of Leaves</a></i> by Mark Danielewski? It's an example book design (its interior) that becomes actively and even inextricably woven into the narrative. <br> <br><a href="http://www.amazon.com/gp/reader/0375703764/ref=sib_dp_pt/102-4692538-5006533#reader-page">Here's</a> a good example of a few of the more conservative type styles in action. You have the narrator in Courier and the text of a manuscript he's reconstructing in one serif, and the editor in another (I don't have it with me to venture a guess). Then, whenever the word 'house' appears, it's in blue (or grey, depending on the edition). You can also see the labrynthian footnotes coming into play. There are also sections that have red strikethrough to indicated changes made by the manuscript</p>
