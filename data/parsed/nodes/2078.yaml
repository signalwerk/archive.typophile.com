    html: "<p>I don't get your point. <br> <br>-- <br> <br>There's a difference between display and text fonts. Anybody who can't see that has a black hole where his theory should be. Theory is no replacement for practical experience, but only theory can help forge new ground, the prerequisite of cultural progress (as opposed to merely paying the bills). <br> <br>This difference between text and display affects the nature of expressiveness. What I mean for example is that Massin's \"concrete typography\" stuff -which to me has always seemed deathly boring, because it's so obvious- is only partially related to expressiveness in text design, which has to be supremely subtle to work right. <br> <br>For a long time I'd been looking for a text counterpart to the Massin stuff, and Avital Ronell's efforts (like \"The Telephone Book\") were interesting, but still largely in the realm of display. I ended up finding (thanks to a Typo-L member) one single instance -but a superb one- of what I was looking for, in the unlikeliest of places: a trashy fantasy novel! It's called \"The Interior Life\", and in it the author, Katherine Blake (an alias), who also directed the typography, uses different fonts (all texty) to express the mundane versus exciting components of a contemporary housewife's medieval romantic adventures. It's a 300-page novel with a lot of interweaving of realities so to speak, so it must have been a lot of work to set in such an elaborate system, and there can't even be any proof that it actually works! But just the fact that somebody (who isn't even a professional designer) has done it makes me happy, and really, if you don't believe it can work, you can't believe making new text fonts is worth the effort. <br> <br>hhp <br></p>"
