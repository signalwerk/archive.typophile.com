    html: <p>There are a few reasons (from my understanding) that Snookie's idea wouldn't work. First, the effect would be so subtle and so out of place (unexpected) in a novel full of running text, that all it would likely do is register as an odd visual aberration that makes reading more difficult or confusing, rather than more 'experiential'. <br> <br>Without tapping into a certain degree of conscious comprehension (and overt design manipulation), the effect would be uncontrollable. The landscape of the page in a novel (to me) is too susceptible/ sensitive to visual changes for the effect to work on a subtle text level. How is the reader going to pick up the purpose the individual contrasts spread over an entire novel? The interrelationship (gestalt, I suppose) would be very difficult to maintain, if not impossible, particularly if they need to change the subtle effects regularly to maintain their effect, as </p>
