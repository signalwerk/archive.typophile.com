    html: <p>I donno but if a novel needs mood supporting typefaces - maybe its not a very good novel to begin with. <br> <br>I agree with Tiffany - function before form here. your reading a story! On top of that - defining the mood with pre-sets such as typography might even diminish its worth. Most people have made up their own imagery that they like to escape into when picking up a book. If your messing with it and explaining to them exactly how "scary" or "angry" the mood is in this paragraph then you've just changed the readers path which was flowing just fine and pretty organically until you changed the face. <br> <br>if it calls for such intrusive visual clues like that perhaps it should be a movie instead. <br></p>
