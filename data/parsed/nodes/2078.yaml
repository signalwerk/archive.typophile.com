    html: "<p>In my edition of <i>Babel Tower</i>, the main story is set in Bembo; there are a lot of narrative threads, but one involves the principal character becoming involved in the legal defence of a novel charged with obscenity. Large sections of the novel in question are interwoven into the narrative, and are set in Joanna. The contrast works very well in the well-printed hard cover edition: both types are good text faces, and Joanna nicely captures the modernity of the novel within the novel. It works less well in the paperback edition, in which the text is too small and too badly printed for the difference between the types to be obvious to the average reader.</p>"
