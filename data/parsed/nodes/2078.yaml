    html: <p>John, nothing is ever so absolute. And one man's soup is another man's poison. <br> <br>A typographer's responsability is to apply his skills, knowledge and talent to make the reading experience as good as possible (with subtlety admittedly being a key ingredient), and richness of expression is generally relevant. It doesn't matter how good/bad you or I think the content is. <br> <br>In the same way that different books benefit from different font choices, different facets of a given book can benefit from different fonts. Otherwise we don't really need designers. <br> <br>hhp <br></p>
