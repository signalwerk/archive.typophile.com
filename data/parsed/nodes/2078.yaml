    date_raw: 17 Nov 2003 — 5:27am
    votes: null
    html: <p>I have no problem with mixing typefaces to elucidate stories within stories, parallel stuff, and whatnot. As far as I am concerned this can be done as structural typography, which need not have anything to do with overtly expressive typography.  <br> <br>But the kind of "mood-supporting" typography which I understand to be the original basis of this thread strikes me as akin to a dramatic reading, complete with theatrical effects. In general, I don't care for it myself. <br> <br>To continue the metaphor, selecting a typeface for a book (here I'm thinking mostly of a "reading" book -- as opposed to reference, or how-to, or coffee-table) is not unlike casting a voice actor for a book-on-tape. To a certain extent, casting just the right voice may enhance the listener's experience of the text. And, certainly, casting a poor voice actor will get in the way of listening. But beyond a basic level of competence, it probably makes a small and subtle, if any, difference. <br> <br>But there will be no point to having James Earl Jones read these certain passages while Jeremy Irons breaks in to read those others. Unless, like I said, you're casting a dramatic reading -- in which case you have a different animal, and most likely not what the author had in mind. <br> <br>-- K. <br> <br> <br></p>
