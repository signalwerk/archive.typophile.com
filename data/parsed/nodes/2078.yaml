    html: <p>&gt;Thus the typesetting system would have to make an ongoing series of changes to keep renewing the desired transient effect. <br> <br>Like smell. The muffin shop located in the subway continuously vented the air from its ovens into the underground mall. But that was not sufficiently motivating, because once people had been in the mall for 15 seconds, they would tune out the marvelous aroma as "background". So the muffin shop would vent periodically, to keep potential customers aware. <br> <br>But continuous text is surely not like that, the premise being that typographic nuance is subconscious, yet still meaningful.</p>
