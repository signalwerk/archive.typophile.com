    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 3.Aug.2007 12.37am </div>
      <p>BLAMBOT COMIC FONTS &amp; LETTERING<br>
    NEWS – AUGUST 2007<br>
    <a href="http://www.blambot.com" title="http://www.blambot.com">http://www.blambot.com</a><br>
    <a href="http://www.comiclettering.com" title="http://www.comiclettering.com">http://www.comiclettering.com</a></p>
    <p>Hey, guys!  Am I TIRED. SDCC knocked me for a loop, but I’ve still got font-i-ness for ya…</p>
    <p>NEW FREE FONT – POTTY MOUTH BB<br>
    <a href="http://www.blambot.com/fonts.shtml" title="http://www.blambot.com/fonts.shtml">http://www.blambot.com/fonts.shtml</a><br>
    It seems like every few months someone e-mails me and asks what font do people use when they have a character swear in symbols instead of words.  At first I thought they were being silly…then I realized, “Hey! Why isn’t there a font JUST for that?”  And now there is! POTTY MOUTH is 52 hand-drawn symbols for cursing, cussing, swearing and all out poopy-talk. It even comes with a PDF format reference chart so you can see which key does what.<br>
    Click here for a preview:<br>
    <a href="http://www.blambot.com/stuff/preview_pottymouth.jpg" title="http://www.blambot.com/stuff/preview_pottymouth.jpg">http://www.blambot.com/stuff/preview_pottymouth.jpg</a></p>
    <p>NEW PRO FONT?<br>
    You’ll notice there’s no new Pro font this month.  That happened for two reasons:</p>
    <p>SAN DIEGO COMIC CON<br>
    <a href="http://www.blambot.com/forum/viewtopic.php?t=1219" title="http://www.blambot.com/forum/viewtopic.php?t=1219">http://www.blambot.com/forum/viewtopic.php?t=1219</a><br>
    Click the link above to check out some choice SDCC photos!  A good time was had by all. Partied a little, had a great meeting over at Dark Horse (more news on that when I get the ’ok’.), and got to talk to a lot of great creators.</p>
    <p>NEW BLAMBOT.COM COMING SOON<br>
    There’s a site redesign coming soon! Not a massive shift from what’s there now (if it ain’t broke, don’t fix it), but a streamlined, remodeling that I’m hoping to have done by the next update. It will include an expanding content area, larger overall interface, more efficient font menu, and a less cluttered look.</p>
    <p>IF YOU READ THIS FAR, I SALUTE YOU!<br>
    <a href="http://www.yousendit.com/" title="http://www.yousendit.com/">http://www.yousendit.com/</a><br>
    I get asked a lot about how graphics folks can send big files without cluttering up their webspace, avoiding e-mail quotas, or without actually having any webspace of their own.  Check out YOUSENDIT at the link above. A very handy way to send your art files with no fuss or muss!</p>
    <p>See you next month when I’ve finally recovered from SDCC and website redesigning!</p>
    <p>~N</p>
