    html: <p>Depends. One major factor is the scope, or scale. <br> <br>((speaking generally) <br>If you had a competition among a small, tight-knit online community, <br>or among a group of friends, with the <br>winner getting a pat on the back, then the question of <br>whether to include staff submissions wouldn't be an issue. <br>The overriding factor would be, Let's have some fun. <br> <br>When you include big-name judges and cash and prizes, <br>when you get exposure at major design portals, <br>then you widen the scope and heighten the expectations. <br> <br>So Jared and Joe now have to weigh <br>the joy of submitting and the competitive desire to WIN <br>against the perception of wrongdoing should one of them win. <br> <br>That's a tough call, but it's easy for outsiders. <br> <br>Last year, this issue was discussed, if only briefly.  <br>Because I was going to be involved in producing the <br>Tshirts, I renounced <br>my eligibility. It can't hurt to err on the side of caution. <br> <br>At the same time, I can see where J&amp;J are coming from. <br>Some of the initial designs were lacking, and Joe's pride <br>kicked in + they conceived this online type oasis, <br>and they spend money out of pocket to make it hum.  <br>It must be weird not to be able to submit to your own contest. <br> <br>(you could still create stuff, submit stuff, post stuff, get feedback <br>and just refrain from sending your stuff to the judges) <br> <br>? <br> <br>anyway, I would hope that we don't suck all the fun <br>out of this before it even starts. <br> <br>that would suck. <br> <br> <br>bj</p>
    html_clean: <p>Depends. One major factor is the scope, or scale. <br> <br>((speaking generally) <br>If you had a competition among a small, tight-knit online community, <br>or among a group of friends, with the <br>winner getting a pat on the back, then the question of <br>whether to include staff submissions wouldn't be an issue. <br>The overriding factor would be, Let's have some fun. <br> <br>When you include big-name judges and cash and prizes, <br>when you get exposure at major design portals, <br>then you widen the scope and heighten the expectations. <br> <br>So Jared and Joe now have to weigh <br>the joy of submitting and the competitive desire to WIN <br>against the perception of wrongdoing should one of them win. <br> <br>That's a tough call, but it's easy for outsiders. <br> <br>Last year, this issue was discussed, if only briefly.  <br>Because I was going to be involved in producing the <br>Tshirts, I renounced <br>my eligibility. It can't hurt to err on the side of caution. <br> <br>At the same time, I can see where J&amp;J are coming from. <br>Some of the initial designs were lacking, and Joe's pride <br>kicked in + they conceived this online type oasis, <br>and they spend money out of pocket to make it hum.  <br>It must be weird not to be able to submit to your own contest. <br> <br>(you could still create stuff, submit stuff, post stuff, get feedback <br>and just refrain from sending your stuff to the judges) <br> <br>? <br> <br>anyway, I would hope that we don't suck all the fun <br>out of this before it even starts. <br> <br>that would suck. <br> <br> <br>bj</p>
