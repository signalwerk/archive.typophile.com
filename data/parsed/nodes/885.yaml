    html: <p>Look, I don't know precisely why my design was chosen (although I'm happy and grateful it was), but there was nothing in the guidelines saying you had to use type. Other than including the name "Typophile" and sticking to certain practical limitations, pretty much anything could qualify. <br> <br>A purely typographic solution is an obvious choice for a Typophile shirt because of the general subject matter, but that's just one possibility. Why limit it to that? And, after all, the other one that was chosen (which I think is a really cool shirt, by the way) was an <i>illustration</i> and didn't have any more type on it than mine.</p>
