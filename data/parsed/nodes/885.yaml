  - id: 6518
    user: 1250
    date: 2003-08-14T22:57:00
    date_raw: 14.Aug.2003 10.57pm
    votes: null
    html: <p>The submitter's responsability is limited to the piece(s) submitted, not the <i>result</i> of the competition. The result is the responsability of the organizers* and jury. As for the submission guidelines, I don't think it would have been smart to have a strict typographic requirement (that would have potentially excluded genial non-typographic submissions), but maybe a nudge in that direction would have been helpful. I mean like in your case, since you make great fonts as well as lettering, it might have prompted you to submit a typographic piece instead, and it might still have won! On the other hand, such a nudge would have to be endorsed by the jury, and I'm not sure they would have gone for it. <br> <br>* To be fair, the organizers did a superb job overall (as I've said before). The only thing that was a no-no was allowing submissions from Typophile staff. <br> <br>&gt; the other one that was chosen ... was an illustration <br> <br>Yeah, but not of a dog or broadnib pen or a paintbrush, but of a <i>typecase</i>. Plus the original version (which for some reason lost the "California Job Case" punchline) had type in it. <br> <br>The kind of shirt I personally would have ideally liked to see chosen would convey the passionate and technical discussions of type that we have here. It's hard to do that without being trite, and I know that my own submissions failed pretty badly overall. <br> <br>All I know is, this is type-land, so the ideal shirt would be typographic. <br> <br>hhp <br></p>
