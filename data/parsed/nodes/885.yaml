    html: <p>Hrant, that's good food for thought. It definitely crossed my  <br>(our) minds last year and clearly there are trade-offs. In the  <br>end, I (we) just wanted to raise the bar and ensure a shirt  <br>we could be proud of (and wear!) was in the running. Toward  <br>the middle of the contest it was very clear there were plenty <br>of good options and I quit submitting. <br> <br>In the end, when the designs went to the judges, they were  <br>all presented anonymously. The judges didn't know they  <br>picked Mark Simonson's design. <br> <br>Anyone else feel like 'staff' submissions dilute the  <br>credibility of the contest or of Typophile? I tend to think  <br>that if we were a corporation it would smell fishy, but that  <br>since our whole mantra is open collaboration that I want to  <br>contribute just like anybody else. On the other hand, we  <br>will be receiving more corporate sponsorships of this  <br>contest this year... <br> <br>Sorry, my thoughts are all over the place. But, the last thing  <br>I would want is for someone to cry foul or feel the contest  <br>was somehow loaded or unfair.</p>
