  - id: 6516
    user: 1250
    date: 2003-08-14T18:23:00
    date_raw: 14.Aug.2003 6.23pm
    votes: null
    html: <p>Hey, I personally discuss <i>chocolate</i> on Typophile! Lettering obviously has a lot of synergy with type, even more than aviation has synergy with boating... So it's fruitful to discuss it, at length even. I do it myself, to the extent of the little I know about it. But discussion aside, it's not crazy to think that something as singular as a logo on a mass-produced t-shirt benefits by being focused on the topic. The two popular-vote shirts didn't have the superb execution of the jury winner, but they were more appropriate, more in tune with the entity they were conveying. <br> <br>I might be sounding like a fundamentalist, but focus in a visual piece is a virtue, right? <br> <br>-- <br> <br>I was wondering why the jury chose a lettering piece. Because it was well-executed? Or if you look at the jury members, you might see a tendency to favor "organic" things. I love animals, but if you don't really like type that much, maybe you shouldn't spend so much time with it? John Downer for example is a highly skilled and talented letterer, and he seems to be increasingly focusing on that instead of type design. I still hope he has some great secret type design he'll spring on us (I mean besides Paperback, which so far is disappointing), but if he's more in harmony with lettering, why force it? Focus is good. <br> <br>hhp <br></p>
