    html: "<p>Florian: thanks for posting that article. It caused quite a bit of introspection. I do think that Indigineous panders to caracature, but it was not intended to be hurtful, but playful. It was helpful to learn more about the climate that Neuland was introduced into, and who adopted it. Also to read more about the deco connection, which I wasn't aware of, but which shows up in my design more overtly. Probably not a bad thing that it stays on my hard drive. I wonder what others think about that. I honestly don't care. As far as it depends on me, I want to be about peace.</p>"
