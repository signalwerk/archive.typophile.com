      <p>Brioso Pro Poster: Lighter than Papyrus, but has the same rough edge. This typeface is pure elegance and looks great at 300pt. They do have other cuts for smaller sizes. EDIT:Not african feeling though (to me).</p>
      <p>EDIT: Olduvai is not intended to feel African in any way. The archeology angle is a big burial mound of schtick that my *ahem* marketing team came up with.</p>
      <p>Side note: I did draft up a font a couple of years ago in the flavor Neuland (but more calligraphic). I was chuckling because if you want it to be "ethnic" choose Neuland. Hawaiian? Check. African? Check. Amazon? Check. I'm not saying, mind you that this makes any sense, or has any cultural sensitivity, but Neuland is pretty unique in it's ability to resonate with so many people on this level. It's called Indigenous, and it is growing cobwebs. Somehow, whenever I set out to draw a display face, it evolves into some crazy long project with text companion and blah blah blah.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_3446.gif"></div><p></p>
