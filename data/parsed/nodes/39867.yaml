      <p>MissT: Indigenous Text?<br>
      Paul: Aaaaaaaaaaaaaaaaaaaahhh. I know.</p>
      <p>The discussion about type parody vs cultural sensitivity is an interesting one, that I don't want to side track. Type parody might be damaging in a butterfly flaps its wings in Montana and a typhoon strikes Mauritius kind of way. Some will argue that type parody is directly offensive and damaging. I just don't have a good answer, you have to pick a typeface. Chances are you're awareness of the design history and use of a font will be lost subtleties on most audiences. Still, not sure that means you need to go find a font that Joe Starbucks will overtly say is Tiki lettering. But then <a href="http://www.flickr.com/photos/89239849@N00/1253968262" rel="nofollow">Tiki lettering has it's place</a>. Like I said, I don't have a good answer. Just go with Olduvai. Muuuuuuhahahahahahahaha. Or not.</p>
