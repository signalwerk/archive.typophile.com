    html: <p>Something else to consider is that if you really want to reflect Africa, look at color. The generic green, red, white and yellow colors that are often used to represent Africa have been used in some parts of the continent for so long that nobody even remembers what they originally stood for; using colors appropriate for these particular people could be more evocative than type could ever be alone.</p>
