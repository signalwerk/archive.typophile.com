    <p>Dear Typohiles,</p>
    <p>This is my first post -- I've been learning from watching you smart folks for months, and now I'm in a situation where I could use a little of your expertise...</p>
    <p>I am doing the titling for a documentary about a trip to a childrens orphanage in Africa and the director is in love with Papyrus. I can't stand the font (and from doing a papyrus thread search, I've gathered that most of you feel the same way).</p>
    <p>Can anyone suggest some Papyrus alternatives? The font will be used for names of people and places, as well as short &amp; long quotes. </p>
    <p>I've been scouring my library and myfonts.com for something that I might be able sell to the director as a better alternative -- perhaps something elegant, friendly, and with a slightly "african" feel -- but I thought I would put the question to you, the ultimate type experts.</p>
    <p>Thanks in advance for your time, and any input is very much appreciated.</p>
    <p>Regards,<br>
    Julia</p>
