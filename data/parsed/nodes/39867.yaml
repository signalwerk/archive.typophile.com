      <p>I can't thank you all enough for the many excellent suggestions here.</p>
      <p>Paul - thank you for the gentle correction, I realized after posting that using the word "African" as an adjective was inaccurate and a little on the ignorant side. I should have come back to correct myself, but got carried away with work. Thanks for not flaming me :)</p>
      <p>James - I am in complete agreement with you, and am trying to steer the director and editor down a different road by giving some other options. But showing them an alternative to Papyrus that is close will at least demonstrate that I am listening to them as well.</p>
      <p>Plato does look like a great alternative, and I am loving the hand-lettered Olduvai as well -- especially because it is a film about a travelling performing arts camp, with emphasis on hands-on artistic expression and experience. Palatino would be great for smaller/longer bits of text, perhaps to pair with another more overtly stylized display font?</p>
      <p>...I'm interested in every font suggested here -- I've got some work to do!</p>
      <p>Thank you all again, your feedback has helped immensely.</p>
