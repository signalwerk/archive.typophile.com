      <p>I went with the more chisled 'C' and changed the 'G' to match. I've been wanting to keep a hand-wrought feel to the glyphs, but not too rough. Thanks for the criticism I've already recieved. Noted and acted on. More is welcome. So easy to become used to the faults and not see them anymore. Also easy to look back and have trouble seeing what difference the hours of work have made.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TextTwoTest581_6289.gif"></div><p></p>
