      <p>First, I can't believe I haven't updated since October. But I supose I've saved you a lot of very minor revisions. I'm constantly amazed by how little my changes are visible- but yesterday I made minor but extensive updates that I feel really improved the overall colour. I still see problems everywhere- but I would be grateful for any critisism. Remembering that I am aiming at a hand-wrought but formal display face.</p>
