    html: |-
      <p>A nice face! The quirks are generally quite appealing IMO.<br>
      The upper/lower terminals on /C/ and /c/ are opposite from what I'd expect, which is weird to my eye.<br>
      The curve of /t/ is a great idea, but perhaps could be done in a more subtle way so as not to jump out so much.<br>
      Middle vertex of /W/ seems unresolved.<br>
      /Y/ could use some rebalancing.<br>
      Top of /a/ (the two-story one) looks a bit wimpy.<br>
      /x/ may be too narrow. Perhaps /X/ too.<br>
      This has a nice character to it, and it's well suited to going off with alternates as you've begun to do.</p>
