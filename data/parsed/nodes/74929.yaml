    html: |-
      <p>I really like this face and really like the way you have presented your examples. (Can you tell I was typographically raised on the type specimen books of the '20s and '30s and The Fleuron!) </p>
      <p>I'm especially enamored of the ranging figures. Not many faces have them (I mean in proportion to those faces with non-ranging figures!) The old-face slant on the /e/ is also a particular love of mine. </p>
      <p>I prefer the wonky /t/ "subtle-ized". I just want the upper termination in /C/ to match the one on the /G/.</p>
      <p>Look forward to your next display as pure eye-candy!</p>
      <p>Clair</p>
