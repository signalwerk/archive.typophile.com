      <p>(Also I am making the same mistake with generating too much glyphs to early in the progress and having to change lots of them about 5-10 times. I discovered that I can minimize this by starting early with different weights. So I see pretty early in the progress how some troublesome glyphs have to look like. Maybe this will help you too.)</p>
