      <p>Interesting start.</p>
      <p>Something that bothers my eyes, but it doesn't mean I'm right :)</p>
      <p>/Y/ - looks like it's slanted to the left side.<br>
      /K/ - Leg seems to close to the stem. Maybe try to rotate it so it has more angle between stem and leg. Same goes for /R/.<br>
      /k/ - Maybe it's too wide?<br>
      /O/ - Is maybe falling on the left side?<br>
      /Q/ - same.</p>
      <p>Maybe I'm more geometrical guy, but maybe you can try to make a couple of alternatives, another versions of some glyphs?</p>
