  html: |-
    <p>Part of making my first text font was trying to make all the mistakes possible, so I could learn about what goes into making a complete typeface. One mistake was to get ahead of myself in creating glyphs, and I find myself making that mistake again- but I can't help adding alternates. I would like to iron out kinks in the glyphs before moving on- so any help- pointers etc. will be greatly appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TextTwoTest579_6547.gif"></div><p></p>
    <p>The PDF is the vector version of the jpeg.</p>
