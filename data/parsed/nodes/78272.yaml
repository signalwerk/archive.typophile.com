  html: |-
    <p>Hey Folks,</p>
    <p>I'm trying to ID the typeface used in this F.W. WOOLWORTH Sign. Any ideas??</p>
    <p>It looks like a more squat version of Bodoni.. But I can't tell if that's from the distortion of the old photo, or whether the typeface is actually like that.</p>
    <p>Thanks!</p>
