      <p>I am certain;ly not a lawyer, so take the following as just another laymen's opinion.<br>
      The main crux seems to be if you draw it yourself from scratch and draw your own outlines. That does not mean a complete new design.  There are a zillion Caslon and Garamond inspired faces out there. People look at specimen books and make ther own drawings legally.  The big thing is the use of the name.  If someone has trademarked or copyrighted the name (don't ask me which term is correct) then you can't use the name without permission. An example is, you cannot put out a face called "Ed Interlock" even if it looks nothing like the original.<br>
      I recall that Christian Schwartz did a face based on lettering he saw on industrial buildings in Pittsburgh. It sounds like your project falls in that arena.</p>
      <p>ChrisL</p>
