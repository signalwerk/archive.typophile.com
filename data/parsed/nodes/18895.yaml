  html: <p>I absolutely love the custom handlettering style from the early 60s (think <a href="http://www.houseind.com/index.php?page=showfont&amp;id=150&amp;subpage=viewfontsinuse" rel="nofollow">Ed Interlock</a> type of stuff) and I'd love to make a font like that of my own.. In fact, I already am making one at the moment. I found this lovely looking custom type on a movie poster from the early 60s that I'm basing my font on but I'm curious about the legalities of it, and what's considered fair and legal when you're inspired by something. The poster in question certainly didn't contain a full alphabet, so the vast majority of the letters/font is completely original work, just in the same style. That makes me think I'd be okay considering basically all of the most well-known fonts from history are basically copies of typography from antique books, and many type designers out there seem to base many of their designs on old lettering found in books and whatnot..</p>
  html_clean: <p>I absolutely love the custom handlettering style from the early 60s (think <a href="http://www.houseind.com/index.php?page=showfont&amp;id=150&amp;subpage=viewfontsinuse" rel="nofollow">Ed Interlock</a> type of stuff) and I'd love to make a font like that of my own.. In fact, I already am making one at the moment. I found this lovely looking custom type on a movie poster from the early 60s that I'm basing my font on but I'm curious about the legalities of it, and what's considered fair and legal when you're inspired by something. The poster in question certainly didn't contain a full alphabet, so the vast majority of the letters/font is completely original work, just in the same style. That makes me think I'd be okay considering basically all of the most well-known fonts from history are basically copies of typography from antique books, and many type designers out there seem to base many of their designs on old lettering found in books and whatnot..</p>
