    <p>Hey guys,<br>
    I was wondering about the vertical positioning of Hyphen, minus and N dash. Should all the three be at the same distance from the the base line or should the hyphen be higher and the minus and em/en dash be lower? Most of the posts talk about the width but not the vertical positioning. Also is figure height same as x-height( used here <a href="http://www.microsoft.com/typography/developers/fdsspec/maths.aspx" title="http://www.microsoft.com/typography/developers/fdsspec/maths.aspx">http://www.microsoft.com/typography/developers/fdsspec/maths.aspx</a> description of plus sign)</p>
