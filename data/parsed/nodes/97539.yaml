      <p><em>I would say slightly below.</em></p>
      <p>Well, if you want the hyphen and dashes in all-caps settings to appear below the centre line, you could do that, but why would you want to, especially when those caps typically have waist features such as the bar of the H and the middle of the B above the centre line? Indeed, the easiest and least visually disruptive way to position the hyphen/dash height in all caps settings is to align it to the H bar.</p>
