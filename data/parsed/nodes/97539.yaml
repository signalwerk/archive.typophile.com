      <p>If you do not have it already you may find <a class="freelinking external" href="http://www.designersreviewofbooks.com/2011/02/designing-type/" rel="nofollow">Karen Cheng's fantastic book <em>Designing Type</em></a> very helpful. It is always useful for things like this to look at what others have done and fonts like Cambria, Georgia or Verdana might be good places to start looking.</p>
      <p>With regard to mathematical typography and typesetting I would highly recommend the <a class="freelinking external" href="http://www.tiro.com/projects.html" rel="nofollow">Mathematical Typesetting booklet</a> edited by Ross Mills and John Hudson and I daresay that John may be able to recommend other sources and further reading on the subject if he sees this.</p>
      <p>With regard to your initial question, in my (extremely limited) experience they tend to be but others here will no doubt have much more informed opinions.</p>
