      <p>Regarding weight, I usually have the en dash and em dash of the same thickness, but the hypen is considerably heavier.</p>
      <p>Now, who here provides kerning for  dashes so that they overlap when typed in sequence? This supports their use in bibliographical entries, where a sequence of joined em dashes is conventionally used to replace repeated author citations, e.g.</p>
      <p>Furtzwangler, J. <em>Water polo my way. Harvard University Press, Cambridge MA. 1982.</em></p>
      <p>———————— <em>More water polo my way. Privately published. 2005.</em></p>
      <p>———————— <em>The Furtzwangler way to better water polo.</em> Wetwings Publishing. San Antonio TX. 2008.</p>
