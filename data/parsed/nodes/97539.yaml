    html: |-
      <p>When a continuous-line appearance is needed several times in an InDesign document, I create a character style for it that has tight kerning. Makes it easy to adjust the spacing of all occurrances later, if needed, plus you can temporarily make that style a different color so you can immediately see if you've applied that style to some text or not. </p>
      <p>Also works for underlines used to make rules on a form (although I normally prefer to create rules by a different method).</p>
