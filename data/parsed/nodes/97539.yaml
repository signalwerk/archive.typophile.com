    html: |-
      <p>It makes sense to align the hyphen and dashes, and for common text use they should normally be slightly above centred on the x-height. In all-caps settings they need to be raised to be slightly above the centre of the cap height; this is why many OpenType fonts contain 'case' feature variants of the hyphens and dashes.</p>
      <p>Mathematics is a different beast altogether. There is a central horizontal axis running through each line of an equation, normally centred on the (lining) numeral height, to which operators are aligned.</p>
    html_clean: |-
