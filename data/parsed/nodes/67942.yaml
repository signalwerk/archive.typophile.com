      <p>I can only agree with most of what has been said already (I'm Danish). The ø without the bar in the counter has been seen before (for example in the logo of <a class="freelinking external" href="http://www.foroya.fo/" rel="nofollow">Føroya Banki</a>. The Faroese use ø as well) and would be definitely be idenfied as an ø. Only problem is that it attracts too much attention. So it really depends on the purpose of your typeface. For a corporate typeface it might work, for body copy it is far more distracting than a slight uneveness in colour.</p>
      <p>Regarding the colour, pay attention to Frode's advice. It might be necessary to break the bar in three (but not always), whereas it is almost always necessary to thin the strokes of the o where the bar crosses.</p>
      <p>Bon courage.</p>
