      <p>Oh, of course. One of the phenomena I find fascinating is that straight lines of different length not only may appear to be of different thicknesses, when they are actually identical, but that a long line may appear thicker than a shorter line in some situations but thinner in other situations. This is affected not only by whether the line is vertical or horizontal, but also by what else is happening in the glyph, i.e. it's an aspect of overall spatial frequency.</p>
