    <p>Hi everyone,</p>
    <p>in my current font (<a href="/wiki/Brevier%20Ten" class="freelinking" rel="nofollow">Brevier Ten</a>) Ø and ø bar does not extend through the center counter of the O, o instead it only extends from the outer portions of the letter. </p>
    <p>A bar through the center would certainly be more legible but with a broken bar texture/color would be way better and I think it would match the overall type design better, too (similar thing going on with $ and ¢).</p>
    <p>Since Brevier Ten is a typeface for body copy, question is if those broken bars are too hard to read or acceptable. </p>
    <p>What do Danish and Norwegian readers think about that? :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bild-3_3967.jpg"></div><p></p>
