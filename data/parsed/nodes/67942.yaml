      <p>Speaking as a norwegian: NO, this is not working. Not at all. To a native reader it is just really annoying.<br>
      But by all means include it in the font as a stylistic or titling alternate - it looks kinda cool and could perhaps be used for effect, even though it is unreadable for running text.<br>
      The slash should always cross the O completely. For bolder weights the tight counter space may call for more creative solutions like this, of course - but such a glyph design for a light weight is not good. It may look clever and stylish, but it just shows ignorance about the languages it is used for.<br>
      Nice typeface, though - very open and friendly. :)</p>
