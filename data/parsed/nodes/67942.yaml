    html: <p>I have to agree with Nick here. Your "o" may have the same thickness as the "O", but its counter is also smaller, so that a slash of the same actual thickness looks thicker. You have nice open forms so using the same stroke thickness for lowercase and uppercase may work in general, but in the "ø" the stroke density is greater so you do need the optical correction. Squint and try to compare the apparent thickness of the two slashes.</p>
