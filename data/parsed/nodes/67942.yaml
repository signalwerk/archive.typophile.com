    html: <p>I haven't set Danish type, or whatever, but I believe that while letter shapes are very language specific, typographic proportion is universal (at least within the broad Latin/Cyrillic/Greek scripts). So if the lower case "o" has a relationship with the upper case "O", then the thickness of the slash will share the same relationship, and be thinner in the lower case ø.</p>
