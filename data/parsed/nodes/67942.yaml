    html: |-
      <p>Hi,</p>
      <p>I don't speak danish, but I do think that the Ø is more than simply an alternate version of O, it's a character of it's own, just like Ü, Ä, Ö etc. in german. It would be wrong to treat these as 2nd rate. I think it looks quite interesting for a logo, but would not work for texts. I think the real challenge here is to work with the Ø and create it in such a way that it doesn't become to dark, or too cluttered. I think it's very much a question of optics. You could work with a tapered stroke, or ink traps to avoid too much density. Consider it a challenge, rather than a hassle.</p>
      <p>Jeffrey</p>
