    html: <p>I try to think of instances like this as important parts of the visual cadence of a written language. We shouldn’t try eliminating that character for the sake of obsessing over technical notions of what makes for perfect color, more legible type, etc.. People read just fine with all these little imperfections, and can even read just fine under dreadful conditions such as comic books that use handwriting fonts, in all caps, with centered type, on horrid paper. If you aren’t designing type system with special legibility requirements then just relax.</p>
