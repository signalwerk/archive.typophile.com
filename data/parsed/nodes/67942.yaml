      <p>Einfach writes: <cite>My "o" has just the same thickness then "O", so no relationship in thickness there. Furthermore you would not try to make small caps thinner, just because they where smaller.</cite></p>
      <p>Actually, I might. I certainly would today, even if I haven't always.</p>
      <p>When I was learning the basics of type design, I spent a lot of time opening existing fonts and examining details of how curves were drawn, thicknesses of different parts of letters, etc. I recommend it.</p>
      <p>Just for a comparison, vertical stroke thicknesses in a few typefaces, especially but not only sans serifs.</p>
      <p>Adobe Garamond Pro Regular<br>
      D: 82<br>
      d: 74<br>
      small cap D: 76</p>
      <p>Hypatia Sans Pro Regular<br>
      D: 81<br>
      d: 78<br>
      small cap D: 81<br>
        (if I were re-doing it today, I'd probably make the small caps a tiny bit thinner.)</p>
      <p>Franklin Gothic Book<br>
      D: 171<br>
      d: 157</p>
      <p>Myriad Pro Regular:<br>
      D: 87<br>
      d: 88 (!)</p>
      <p>Helvetica LT Std<br>
      D: 97<br>
      d: 88</p>
      <p>Calibri<br>
      D: 172<br>
      d: 166<br>
      small cap D: 170</p>
      <p>Corbel<br>
      D: 163<br>
      d: 155<br>
      small cap D: 157</p>
