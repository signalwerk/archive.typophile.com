    html: <p>I really like it. (Thanks, Miss Tiffany for re-attaching the image, as I  got an error msg when trying to view the original.) Personally, I like the contrast between the simple letterforms and the more organic outgrowths; sort of like the letters were man-made and left out in the woods for a long time and all these things started growing out of them. Wish I could see it more clearly, and would really like to see it in color(s). What I like most about this face is that it seems you really enjoyed creating it!</p>
