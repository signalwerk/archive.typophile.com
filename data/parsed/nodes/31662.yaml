    html: |-
      <p>The ornaments are really great, but I'm afraid I'm going to have to agree with the others on the used font.<br>
      Did you design all the ornaments yourself or just took bits &amp; pieces from existing ornamental dingbats? I did a few  "collages" of dingbats about 2 years ago &amp; I wanted it to look more ornamental, but I haven't really found any nice ornamental dingbats. I used a lot of pieces from Ardenwood (<a href="http://www.myfonts.com/search?search%5Btext%5D=ardenwood" title="http://www.myfonts.com/search?search%5Btext%5D=ardenwood">http://www.myfonts.com/search?search%5Btext%5D=ardenwood</a>) which has an original look to it.</p>
