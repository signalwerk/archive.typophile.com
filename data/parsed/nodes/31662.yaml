      <p>Hello Marcio,</p>
      <p>This strikes me as something more along the lines of custom lettering than something I would create a typeface out of. The idea of growth from the letter is fun, but the letters themselves seem very stiff. Is that Akzidenz Grotesk? I can't quite tell. You might consider having the skeleton be more humanist and letter geometric.</p>
      <p>I've also taken the liberty to re-attach the image here. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Helena_4869.gif"></div><p></p>
