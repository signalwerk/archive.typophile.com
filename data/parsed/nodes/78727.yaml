    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Lexicon</strong></p>
    <p><img src="http://upload.wikimedia.org/wikipedia/commons/2/2d/LexiconSpecimen.png" img=""></p>
    <p>Lexicon (designed in 1992 by Bram de Does) is pre-eminently suitable for output on laser and other low-resolution printers and for typesetting in small sizes.<br>
    Lexicon is therefore the perfect typeface for use in office correspondence) and applications that require highly economical setting (dictionaries, Bibles, timetables, encyclopedias etc.). Lexicon has been used for example in Van Dale's Het Groot Woordenboek der Nederlandse Taal.</p>
    <p>Main groups</p>
    <p>Lexicon consists of two main groups: Lexicon No.1 and Lexicon No.2. Lexicon No.1 has short stems (ascenders and descenders); Lexicon No.2 has 'normal' stems. Both groups share the same widths thus making it possible to change fonts without reflowing text.</p>
    <p>The weights</p>
    <p>Each main group contains 12 variants: six upright weights (A to F) and six italic weights (A to F). A is the regular weight, and F is the boldest weight.</p>
