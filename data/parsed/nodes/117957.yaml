      <p>Carolyn, please post your question in the Font ID forum:<br>
      <a href="http://typophile.com/typeid" title="http://typophile.com/typeid">http://typophile.com/typeid</a></p>
      <p>&gt; they can't figure out what font the designer used </p>
      <p>They don't sound very professional. Most professional designers keep file copies of every job. There's no need to "figure out" what font was used, they open the file and the software tells them exactly what font was used.</p>
      <p>&gt; so I can make them all the same</p>
      <p>If you're making them all the same, is it necessary to match what was done previously? Might be a good opportunity to update your logos.</p>
