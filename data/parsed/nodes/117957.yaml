    <p>I work for an automotive group and we just bought a new dealership, so there are 8 total. I'm having the hardest time trying to figure out what fonts we have in our logos so I can make them all the same. They were designed by one of our vendors, who says that due to the formatting, they can't figure out what font the designer used (who is no longer employed with their company). Can anyone help me out? I need to know the names of the fonts for the dealership names, not the part that says Chevrolet. I would really appreciate any wisdom anyone has to offer. Thank you!</p>
