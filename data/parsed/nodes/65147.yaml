  html: |-
    <p>A new subsection has been added to <a href="http://www.backpacker.gr" rel="nofollow">backpacker.gr</a>, named "in use", where selected examples of BP fonts in use are presented.</p>
    <p>I would appreciate it if anyone who has used (succesfully, based on his judgment) a BP font in his work send me at least one screenshot (jpg, 72dpi, height &lt;= 800px) together with a small description of the corresponding work (just send it via email at <a href="mailto:contact@backpacker.gr">contact@backpacker.gr</a>). The work will be presented in backpacker.gr with a reference to the name(s) and url of the designer(s).</p>
    <p>Thanks in advance for your help.</p>
