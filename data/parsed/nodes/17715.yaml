  html: <p>Has anybody used <a href="wiki/Jim Spiece" class="wiki-create">Jim Spiece</a>’s revival of <a href="wiki/William Addison Dwiggins" class="wiki">Dwiggins</a>’ <a href="wiki/Winchester" class="wiki-create">Winchester</a>? Is it as good, as a design and as a revival, as one would hope? I’m surprised I haven’t come across more excitement about it, since it ought to be the most characterful digital Dwiggins on the market, and it’s obviously a real book weight.</p>
  html_clean: <p>Has anybody used <a href="wiki/Jim Spiece" class="wiki-create link-lost">Jim Spiece</a>’s revival of <a href="wiki/William Addison Dwiggins" class="wiki link-lost">Dwiggins</a>’ <a href="wiki/Winchester" class="wiki-create link-lost">Winchester</a>? Is it as good, as a design and as a revival, as one would hope? I’m surprised I haven’t come across more excitement about it, since it ought to be the most characterful digital Dwiggins on the market, and it’s obviously a real book weight.</p>
