    votes: null
    html: |-
      <p>It has been regularized and none of the lovely quirks which rightly belong in it are there. Most glaringly it is missing the uncial forms. (Please, if I’m wrong post a link. Myfonts does not show these glyphs.) Granted it probably wouldn’t be as commercial, but it isn’t a proper revival without those forms. It isn’t as warm or friendly either.</p>
      <p>Dwiggins theorized that the “Roman” alphabet was developed for Latin and then the Romance languages, and so, when reading those language the “Roman” alphabet suited it very well. However, when it came to English, the alphabet didn’t quite work. This is where the uncial forms help. Or so Dwiggins thought. I don’t agree. I find the uncial G in his setting disturbing. But, by jiggity, he put the uncial forms in there so why aren’t they there?</p>
      <p>If you are lucky enough to get your hands on the “Postscripts on Dwiggins” Chapbook set, it has it in there in all of its glory.</p>
