    <p></p><div class="imageWrap"><img src="http://typophile.com/files/l2_4572.gif"></div><p></p>
    <p>Letter.2, the 2nd type design competition organized by the Association Typographique Internationale, is open for submissions until August 15. All type designs finalized between August 2001 and August 2011 are eligible for entering this contest. The jury will meet in Buenos Aires in October 2011 and will make a selection of winning entries based on their design excellence. The winning designs will be exhibited at the 2012 ATypI conference.</p>
    <p><a class="freelinking external" href="http://letter2.org/" rel="nofollow">Visit letter2.org now</a></p>
