    html: <p>If you are confident in your Illustrator/lettering/design skills, you might try redrawing it yourself in AI. If you are less confident about doing it yourself, you might hire someone else to do this task for you. For logos in particular, I find that a lettering option is typically better than a font option, particularly in cases like these.</p>
