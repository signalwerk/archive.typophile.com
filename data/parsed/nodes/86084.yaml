  html: <p>I was curious to know who is the originator of this typeface and who makes it. You know, like when you go to wikipedia and search "Optima" it tells you a little history of the font. I've seen TF Arrow used so many times, but I don't know anything about it! Just curious if anyone knows anything!</p>
