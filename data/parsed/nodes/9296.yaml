    html: "<p>Thomas got the URL slightly wrong: <a href=\"http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4\">this one</a> works for me. <br> <br>Other resources: <a href=\"http://www.emigre.com/eprSSi.php\">press release</a> from Emigre. A <a href=\"http://www.allcompu.com/typejudg/judge.htm\">news report</a> on the decision. A recent <a href=\"http://www.boingboing.net/2004/12/26/can_you_copyright_a_.html\">BoingBoing</a> discussion thread, and our <a href=\"http://www.typophile.com/forums/messages/30/56647.html\">followup discussion</a>. <br> <br>Just now, I found a great <a href=\"http://www.smu.edu/csr/Sum98-4-Mezrich.pdf\">criticism</a> of Whyte's ruling from the Computer Law Review and Technology Journal. They say, \"this ruling appears inconsistent with the current state of copyright law as it applies to fonts and typefaces.\" They <i>also</i> make clear that the decision <i>is</i> binding authority, at least in the Northern District of California. I'm not a lawyer any more than Thomas is (thank God!), but I can call bullshit on Wilhelm when I see it.</p>"
    html_clean: "<p>Thomas got the URL slightly wrong: <a href=\"http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4\" class=\"link-external\">this one</a> works for me. <br> <br>Other resources: <a href=\"http://www.emigre.com/eprSSi.php\" class=\"link-external\">press release</a> from Emigre. A <a href=\"http://www.allcompu.com/typejudg/judge.htm\" class=\"link-external\">news report</a> on the decision. A recent <a href=\"http://www.boingboing.net/2004/12/26/can_you_copyright_a_.html\" class=\"link-external\">BoingBoing</a> discussion thread, and our <a href=\"http://www.typophile.com/forums/messages/30/56647.html\" class=\"link-lost\">followup discussion</a>. <br> <br>Just now, I found a great <a href=\"http://www.smu.edu/csr/Sum98-4-Mezrich.pdf\" class=\"link-external\">criticism</a> of Whyte's ruling from the Computer Law Review and Technology Journal. They say, \"this ruling appears inconsistent with the current state of copyright law as it applies to fonts and typefaces.\" They <i>also</i> make clear that the decision <i>is</i> binding authority, at least in the Northern District of California. I'm not a lawyer any more than Thomas is (thank God!), but I can call bullshit on Wilhelm when I see it.</p>"
