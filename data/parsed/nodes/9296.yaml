    html: "<p>Mr Simonson's example is very helpful to make clear a distinction which lies at the bottom of this threat: <br> <br>&gt; Photographers do not directly type out RGB values for  <br>&gt; each pixel when they take a photograph. Yet, this does  <br>&gt; not prevent photographs from being copyrighted. Would  <br>&gt; a photographer be unentitled to copyright protection if  <br>&gt; he were unable to recognize patch of data from a digital  <br>&gt; photo file? <br>&gt; <br>&gt; [Second paragraph omitted as taken for granted.] <br> <br>In case of a photograph, you can protect the photograph, not just one form of representation (whether analog, i.e. as negative or as a print on whatever material, or digital, i.e. in whatever file format actually used). <br> <br>In case of a typeface design, you may protect one form of representation, say as a PostScript program. <br>See the difference? <br>  <br>Nice that there is at least *some* kind of protection but not one that makes a type designer happy. <br> <br>Karsten <br> <br> <br>Hello Mr Berkson! My family name means \"whole\" (more exactly: something missing or left out, like a whole in a fence) or, typographically speaking, \"spatium\" and definitely, it is not a pseudonym.  ;-)</p>"
