diting program. <br> <br>Nobody in the font industry is mentally able to write the source code of a \"font software program\" with the consequence that nobody is allowed to claim copyright to \"font software programs\". Of course, I too am not mentally able to write the source code of \"font software programs\". However, as opposed to Mr. Slimbach, I do not claim copyright to \"font software programs\". Therefore I need not be mentally able to write the source code of fonts. <br> <br>The notice \"Copyright by Adobe\" included in a font can be ignored, unless Adobe proves that the source code of the \"font software program\" was written by a person who is mentally able to write the source code of \"font software programs\". If you show him the above example of the source code of a font by Adobe and he cannot say WHICH glyph is drawn by this source code, you know that he is taking the court judges for a ride. <br> <br>ANOTHER EXAMPLE <br> <br>Let's assume George Bush, who is unable to write PostScript programs, buys a PostScript printer and writes a letter with a word processor. If George Bush makes a printout of his letter, the PS printer driver (= this is a non-human entity!) automatically (!) generates a PS program and sends it to the printer. Is George Bush the \"author\" of this \"software program\" according to the Copyright Act? No, because George Bush is unable to write PS programs and therefore he cannot be the author of any PS programs. <br>  <br>The same is true with PS Type 1 fonts (and with OTF fonts containing PS Type 1 Bezier curves). And the same is also true if a person COULD write PostScript programs, but DOES NOT do so. The copyright act requires both, as far as fonts are concerned: A person who CAN write the source code of \"font software programs\" and who actually DOES it. It is not enough, if Adobe tells the Copyright Office that there COULD perhaps exist somewhere an author who perhaps COULD write the source code of a \"font software program\". <br> <br>Those who are not familiar with copyright law may wonder why the copyright acts of all nations require HUMAN beings as \"authors\". This is because the \"work\" is defined as a \"personal\" (= human) creation in all copyright acts. Therefore mountains and lakes, flowers and trees, apes and monkeys, machines and computers and computer programs cannot be the authors of copyrighted works. The same is true of lawcourt judgements: They must be made by HUMAN judges. Apes and monkeys will not do. Nor will computer programs do that automatically generate the judgements. <br> <br>Wilhelm Ohnesorg</p>"
