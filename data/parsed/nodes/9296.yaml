    html: "<p>\"No-Worry Willy\": your Bush example supports Judge White's ruling. Bush's letter is copyright under US law the moment he writes it. What is copyright is the unique words of the letter, not the typewriter or word processor or pen or ink he uses. In the case of a font what is unique are the points and handles and metrics. That is what King was forbidden to copy in the case in question.</p>"
