    html: '<p>You got the conclusion wrong in your title. Today, virtually all fonts are issued in the form of outline font software which is indeed protected by copyright in the US. This is borne out by the reference you cite: <br> <br>"However, scalable fonts are, in the opinion of the Copyright Office, computer programs, and as such are copyrightable" <br> <br>"... the Copyright Office is persuaded that creating scalable typefonts <br>  using already-digitized typeface represents a significant change in the <br>  industry since our previous [September 29, 1988] Policy Decision.  We <br>  are also persuaded that computer programs designed for generating <br>  typeface in conjunction with low resolution and other printing devices <br>  may involve original computer instructions entitled protection under the <br>  Copyright Act.  For example, the creation of scalable font output <br>  programs to produce harmonious fonts consisting of hundreds of <br>  characters typically involves many decisions in drafting the <br>  instructions that drive the printer.  The expression of these decisions <br>  is neither limited by the unprotectable shape of the letters nor <br>  functionally mandated.  This expression, assuming it meets the usual <br>  standard of authorship, is thus registerable as a computer program."  57 <br>  FR 6202."</p>'
