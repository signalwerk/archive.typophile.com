    html: "<p>A SOURCE CODE EXAMPLE <br>(Postscript to my above message) <br> <br>The following paragraph enclosed in brackets contains the source code of ONE glyph of a \"font software program\". Adobe claimed at court that the source code of this \"font software program\" was written by Mr. Robert Slimbach. However, Mr. Slimbach is mentally unable to explain to the court WHICH glyph is draw by this source code of \"his\" font software program, because he never wrote the source code of \"his\" font software program. Therefore Mr. Slimbach cannot be the author of \"his\" font software program and therefore \"his\" font software program cannot be protected by copyright. <br> <br>(50 506 hsbw 0 49 vstem 101 40 vstem 269 40 vstem 357 49 vstem -124 42 hstem 635 41 hstem 135 -124 rmoveto 158 113 156 123 hvcurveto 0 88 -40 68 -83 77 rrcurveto -107 98 -35 39 0 50 rrcurveto 37 27 23 32 vhcurveto 21 0 30 -8 31 -21 rrcurveto 8 -6 6 -2 14 0 rrcurveto 19 14 18 14 hvcurveto 18 -21 28 -56 vhcurveto -143 -123 -143 -119 hvcurveto 0 -104 59 -68 71 -70 rrcurveto 55 -56 84 -77 0 -59 rrcurveto -40 -39 -22 -30 vhcurveto -24 0 -25 5 -36 30 rrcurveto -7 6 -6 3 -12 0 rrcurveto -22 -13 -18 -18 hvcurveto -29 33 -21 47 vhcurveto closepath 40 348 rmoveto -120 120 -6 70 0 44 rrcurveto 0 50 19 29 33 28 rrcurveto 0 -82 27 -43 107 -102 rrcurveto 78 -74 44 -62 0 -91 rrcurveto 0 -41 -8 -39 -40 -36 rrcurveto 0 81 -35 48 -99 100 rrcurveto closepath endchar) <br> <br>In \"Circular 61\" (= \"Copyright Registration of Computer Programs\") of the United States Copyright Office, the person who claims to have written the source code of a \"font software program\" must deposit 50 pages of \"his\" source code and must prove that \"he\" as a human being has written the source code. Therefore it is not enough to declare at the Copyright Office that a non-human machine or a non-human dissembler program has automatically generated the source code by disassembling the font file previously created by a font editing program. <br> <br>Nobody in the font industry is mentally able to write the source code of a \"font software program\" with the consequence that nobody is allowed to claim copyright to \"font software programs\". Of course, I too am not mentally able to write the source code of \"font software programs\". However, as opposed to Mr. Slimbach, I do not claim copyright to \"font software programs\". Therefore I need not be mentally able to write the source code of fonts. <br> <br>The notice \"Copyright by Adobe\" included in a font can be ignored, unless Adobe proves that the source code of the \"font software program\" was written by a person who is mentally able to write the source code of \"font software programs\". If you show him the above example of the source code of a font by Adobe and he cannot say WHICH glyph is drawn by this source code, you know that he is taking the court judges for a ride. <br> <br>ANOTHER EXAMPLE <br> <br>Let's assume George Bush, who is unable to write PostScript programs, buys a PostScript printer and writes a letter with a word processor. If George Bush makes a printout of his letter, the PS printer driver (= this is a non-human entity!) automatically (!) generates a PS program and sends it to the printer. Is George Bush the \"author\" of this \"software program\" according to the Copyright Act? No, because George Bush is unable to write PS programs and therefore he cannot be the author of any PS programs. <br>  <br>The same is true with PS Type 1 fonts (and with OTF fonts containing PS Type 1 Bezier curves). And the same is also true if a person COULD write PostScript programs, but DOES NOT do so. The copyright act requires both, as far as fonts are concerned: A person who CAN write the source code of \"font software programs\" and who actually DOES it. It is not enough, if Adobe tells the Copyright Office that there COULD perhaps exist somewhere an author who perhaps COULD write the source code of a \"font software program\". <br> <br>Those who are not familiar with copyright law may wonder why the copyright acts of all nations require HUMAN beings as \"authors\". This is because the \"work\" is defined as a \"personal\" (= human) creation in all copyright acts. Therefore mountains and lakes, flowers and trees, apes and monkeys, machines and computers and computer programs cannot be the authors of copyrighted works. The same is true of lawcourt judgements: They must be made by HUMAN judges. Apes and monkeys will not do. Nor will computer programs do that automatically generate the judgements. <br> <br>Wilhelm Ohnesorg</p>"
