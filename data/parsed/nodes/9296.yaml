    html: "<p>The legal information given by Mr. Thomas Phinney is incorrect. This is understandable because Mr. Phinney is paid by Adobe for his task of promulgating erroneous legal information. <br> <br>1) Adobe vs. SSI (1998) <br>This \"decision\" cannot be quoted, firstly because it is not a supreme court decision and secondly because it was a settlement. Mr. Phinney should publish the text of this \"decision\" if he thinks otherwise. <br> <br>2) Copyright Office [September 29, 1988] Policy Decision <br> <br>Mr. Thomas Phinney does not mention the decisive requirements, (1) firstly that a computer program is only protected by copyright if it is a creative work, (2) secondly if the author of this creative work is a human being that has written the source code of this computer program. <br> <br>Note to (1) creative work <br>Most fonts are not creative work, but instead copies or clones or imitations of existing fonts. For instance, Adobe's Garamond is an imitation of the original Garamond and hence not creative work. <br> <br>Note to (2) source code <br>The author of the font as computer program must have written the source code himself. The Copyright Office requires that the source code is submitted in the case of a litigation. But this requires that there exists a person (= a human being) that has written the source code of the program. However, it seems that there does not exist any font, the source code was written by a human being, because nobody except the programmers of Fontlab, Fontographer etc. are mentally able to do that. <br> <br>Example: Neither Mr. Thomas Phinney nor Mr. Robert Slimbach nor any other person at Adobe wrote the source code of the font \"Adobe Garamond\" because none of these persons is mentally able to write the source code of a computer program that handles mathematical Bezier curves. And therefore there does not exist any source code written by Mr. Thomas Phinney or Mr. Slimbach and hence the \"Adobe Garamond\" is not protected by US copyright. <br> <br>Wilhelm Ohnesorg, Germany</p>"
    html_clean: "<p>The legal information given by Mr. Thomas Phinney is incorrect. This is understandable because Mr. Phinney is paid by Adobe for his task of promulgating erroneous legal information. <br> <br>1) Adobe vs. SSI (1998) <br>This \"decision\" cannot be quoted, firstly because it is not a supreme court decision and secondly because it was a settlement. Mr. Phinney should publish the text of this \"decision\" if he thinks otherwise. <br> <br>2) Copyright Office [September 29, 1988] Policy Decision <br> <br>Mr. Thomas Phinney does not mention the decisive requirements, (1) firstly that a computer program is only protected by copyright if it is a creative work, (2) secondly if the author of this creative work is a human being that has written the source code of this computer program. <br> <br>Note to (1) creative work <br>Most fonts are not creative work, but instead copies or clones or imitations of existing fonts. For instance, Adobe's Garamond is an imitation of the original Garamond and hence not creative work. <br> <br>Note to (2) source code <br>The author of the font as computer program must have written the source code himself. The Copyright Office requires that the source code is submitted in the case of a litigation. But this requires that there exists a person (= a human being) that has written the source code of the program. However, it seems that there does not exist any font, the source code was written by a human being, because nobody except the programmers of Fontlab, Fontographer etc. are mentally able to do that. <br> <br>Example: Neither Mr. Thomas Phinney nor Mr. Robert Slimbach nor any other person at Adobe wrote the source code of the font \"Adobe Garamond\" because none of these persons is mentally able to write the source code of a computer program that handles mathematical Bezier curves. And therefore there does not exist any source code written by Mr. Thomas Phinney or Mr. Slimbach and hence the \"Adobe Garamond\" is not protected by US copyright. <br> <br>Wilhelm Ohnesorg, Germany</p>"
