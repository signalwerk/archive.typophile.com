    html: <p>Wilhelm has obviously not actually read the material. I put up a link to the Adobe vs. SSI decision. There was a settlement in the case, but only after Judge Whyte made a SUMMARY JUDGMENT on many of the key issues in the case. Wilhelm and others should read that at the provided link, and familiarize themselves with what a summary judgment is. <br> <br>I'm not a lawyer, I don't even play one on TV, and I'm not paid to provide legal information. I'm just reading stuff and providing some links and quotes. <br> <br>Incidentally, the very first Type 1 fonts were in fact programmed in raw code form without a visual tool. I am myself quite capable of programming PostScript in this fashion, and even recently did so for a project, but I sure wouldn't bother doing a font that way. <br> <br>Cheers, <br> <br>T</p>
