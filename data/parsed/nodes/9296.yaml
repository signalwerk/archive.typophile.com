    html: "<p>From the summary judgment: <br> <br>\"The code is determined directly from the selection of the points. Thus, any copying of the points is copying of literal expression, that is, in essence, copying of the computer code itself.\" <br> <br>Similar reasoning applies, of course, to compiled code: just because the programmers at Adobe didn't handcode the x86 instructions themselves (they were compiled from C++ source code, which Adobe keeps secret) doesn't give you the right to peddle CS warez on streetcorners. <br> <br>The inexorable conclusion is that \"What, Me Worry?\" Wilhelm is talking out of his a<a href=\"http://en.wikipedia.org/wiki/Rectum\"></a>ss. And I say this as someone who is not at all convinced that Whyte's opinion would hold up under rigorous scrutiny. <br> <br>[For the record, above I misremembered my sparring partner the last time around - it was John Hudson, not Thomas. Sorry!]</p>"
