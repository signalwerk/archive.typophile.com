    html: <p>Here is the ACTUAL portion of text from Circular 61 without Mr. Ohnesorg's additions <br> <br>For published or unpublished computer programs, send one copy of identifying portions of the program (first 25 and last 25 pages of source code) reproduced in a form visually perceptible without the aid of a machine or device, either on paper or in microform, together with the page or equivalent unit containing the copyright notice, if any. <br> <br>For a program less than 50 pages in length, send a visually perceptible copy of the entire source code. For a revised version of a program that has been previously published or previously registered or that is in the public domain, if the revisions occur throughout the entire program, send the page containing the copyright notice, if any, and the first 25 and last 25 pages of source code. If the revisions are not contained in the first 25 and last 25 pages, send any 50 pages representative of the revised material in the new program, together with the page or equivalent unit containing the copyright notice, if any, for the revised version.</p>
    html_clean: <p>Here is the ACTUAL portion of text from Circular 61 without Mr. Ohnesorg's additions <br> <br>For published or unpublished computer programs, send one copy of identifying portions of the program (first 25 and last 25 pages of source code) reproduced in a form visually perceptible without the aid of a machine or device, either on paper or in microform, together with the page or equivalent unit containing the copyright notice, if any. <br> <br>For a program less than 50 pages in length, send a visually perceptible copy of the entire source code. For a revised version of a program that has been previously published or previously registered or that is in the public domain, if the revisions occur throughout the entire program, send the page containing the copyright notice, if any, and the first 25 and last 25 pages of source code. If the revisions are not contained in the first 25 and last 25 pages, send any 50 pages representative of the revised material in the new program, together with the page or equivalent unit containing the copyright notice, if any, for the revised version.</p>
