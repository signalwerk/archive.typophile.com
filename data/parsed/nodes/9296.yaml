    date_raw: 1 Mar 2005 — 9:12am
    votes: null
    html: <p>As someone who has sparred with Thomas on this issue before, I do not fine Wilhelm's arguments compelling. I am particularly skeptical of the assertions that (a) only Supreme Court decisions can stand as precedent and (b) that using a tool to mediate between the creative work and the "source code" used to represent a font invalidates any copyrightability. <br> <br>Here's an interesting <a href="http://www.asianlaws.org/cyberlaw/library/ip/copy_font.htm">summary</a> from Asian School of Cyber Law. <br> <br>The law seems a bit gray to me; there is enough contradictory precedent, law, and policy to keep a fleet of lawyers comfortably employed for a while. However, in light of the Adobe vs. SSI settlement, no ethical person would release a copy or digitally derived clone of a font.</p>
    html_clean: <p>As someone who has sparred with Thomas on this issue before, I do not fine Wilhelm's arguments compelling. I am particularly skeptical of the assertions that (a) only Supreme Court decisions can stand as precedent and (b) that using a tool to mediate between the creative work and the "source code" used to represent a font invalidates any copyrightability. <br> <br>Here's an interesting <a href="http://www.asianlaws.org/cyberlaw/library/ip/copy_font.htm" class="link-external">summary</a> from Asian School of Cyber Law. <br> <br>The law seems a bit gray to me; there is enough contradictory precedent, law, and policy to keep a fleet of lawyers comfortably employed for a while. However, in light of the Adobe vs. SSI settlement, no ethical person would release a copy or digitally derived clone of a font.</p>
