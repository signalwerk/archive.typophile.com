    html: '<p>Not just Adobe, I believe - large sections of the type industry were involved in lobbying. An organization called TypeRight did much of the legwork, as I understand it. <br> <br>And there was a case that upheld many key principles of intellectual property law for fonts: Adobe vs. SSI (1998). You can find the decision here: &lt;<a href="http://directory.serifmagazine.com/ethics_and_law/copyright/judgement.php4" target="_blank">http://directory.serifmagazine.com/ethics_and_law/copyright/judgement.php4</a>&gt; <br> <br>A few key pieces: <br>"...the court finds that the Adobe font software programs are protectable original works of authorship." <br> <br>"...the court finds that the typeface designs are statutory subject matter entitled to patent protection." <br> <br>Cheers, <br> <br>T</p>'
