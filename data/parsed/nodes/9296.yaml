    html: "<p>One other thing about the relationship between the PostScript code and what happens in a font design program:  <br> <br>It's not like a drawing program (say Illustrator) which completely hides the \"code\" from you. In a font design program, you are constantly aware of the coordinates of each point, how they relate to one another, distances between, angles, alignment and on and on--precisely the same numbers that end up in the font. It's not like you just draw a character and the computer does the rest. More like designing a very precise and efficient connect-the-dot, except with Bezier curves.</p>"
