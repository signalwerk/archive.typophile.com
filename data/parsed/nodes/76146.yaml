  html: |-
    <p>Today we advised a client to digitise his own handwriting so he can use it as part of his corporate identity. He likes the idea very much. I know of software and sites like yourfonts.com where you can upload your handwritten glyphs so they make a font out of it. It's under $10, not even a large amount when the result is awful. Have any of you had any experience with this site?<br>
    My main worry is that yourfonts.com creates a font solely made out of single characters, not out of sentences which will flow much more.<br>
    I would like to do it myself, but perhaps using the yourfonts.com-font is a good starting point?<br>
    Suppose I do it myself, what should I charge? Any ideas on how much time this will take?</p>
