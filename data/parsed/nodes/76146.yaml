    html: |-
      <p>A lot depends on how cursive the writing is.<br>
      These days, a good cursive handwriting font is a huge undertaking, due to the amount of OpenType contextualization that is now employed. However, if the writing is more like printing, with discrete letters, then it's a lot easier to make.<br>
      Perhaps you could suggest your client writes in more of that style?</p>
