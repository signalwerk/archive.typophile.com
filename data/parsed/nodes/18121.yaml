    html: |-
      <p>Oh, before I sign off a little clarification:</p>
      <p>It says on the Forums page that the Type Identification Board is sponsored by FontShop, and there occasionally is some advertising on the site, plus there are quite a few paying members.</p>
      <p>Don't be mistaken -- I don't see <em>any</em> of this money, not one cent. I wouldn't want to neither, but the fact still remains that I invest real actual time into this place, and quite a substantial amount even, for free. I used to participate in General Discussions, and I used to pull off double the ID's I do now. Not anymore, as I don't have any time left besides my family, my work, my independent graphic design activity, my rock band, and my three (soon four) writing assignments.</p>
      <p>Please don't think I'm playing the victim here -- I like doing this, because it allows me to give to the community, to provide a real and valuable service. I'm not complaining, but maybe a reminder of the proper context was in order.</p>
      <p>As I said before -- more later.</p>
