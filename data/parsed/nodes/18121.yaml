      <p>OK, it's 01:45 am now, and I had to drive all the way back to work to print the remainder of the 192 page book I designed the past two weeks, as they need to be proof-read by my colleague first thing this morning. While the prints are rolling out of the machine, I'll tell you guys a little story.</p>
      <p>Once upon a time, I was a 'regular' visitor of Typophile. Managed to pull off a couple of successful ID's, built up a little rep, got friendly with a number of people. In those days, the Stewfmeister literally owned this place.</p>
      <p>At some point, the tagging, (x)-ing and renaming of successful identifications was introduced. It was a vast improvement for the reasons we all know, but Stephen once explained me how much work it was. He had to open <em>every single thread,</em> check if it was identified and by whom, double-check both sample and result to assess if the identification was correct, then go to the Admin side and tag and rename the thread. All went well until I noticed that -- as traffic started to exponentially grow -- Stephen appeared to have trouble keeping up. I <em>did</em> know he was a busy guy, being co-owner of Typographica and actively involved in a couple of other type websites, but it still came to a point where I started to get annoyed by the lateness of the tagging.</p>
      <p>Did I start a thread on the forum to whine about it? Nope, I sent an offline e-mail to Stephen, offering to help him with the maintenance of the Type ID Board. And now it's me who's head honcho of this place.</p>
      <p>I realise this might sound like I'm ticked off, but don't worry, I'm not. That's why I first cleaned some of the backlog before replying. I just wanted to put some stuff into context.</p>
      <p>The prints are all done, so I'll continue with some 'splainin' of the current situation tomorrow. Then, after that, I'll peek into my crystal ball and tell you what might be in store for this area once Typophile finally gets out of Beta.</p>
      <p>Bear with me, it'll be worth it.</p>
