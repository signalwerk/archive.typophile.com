      <p>One benefit to the IDers is that we don't spend time reading threads that are already answered. It would be great if there was a way for us to set a flag for Yves (or whoever has Closeout authority) that says we <em>think</em> we have solved the question. Then those threads can be checked more quickly to get concurrence and closure by the moderator.</p>
      <p>Would that be possible?</p>
      <p>- Mike Yanega</p>
