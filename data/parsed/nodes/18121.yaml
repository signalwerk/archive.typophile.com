      <p>A few options to weed out solved IDs would help.<br>
      A good way would be to have 3 tabs up the top to open up seperate sub pages which could be:<br>
      1) Unanswered posts<br>
      2) Pending posts (replied to but not officially solved) and<br>
      3) Solved posts.<br>
      This way people could look in a more focused and uncluttered way.<br>
      And in each seperate sub page/section you could have a few options for each like:<br>
      1) omit posts older than X-days.<br>
      2) omit "cold" posts after x-days of inactivity.<br>
      3) Flag "Hot" topics to appear at the top of the list..<br>
      ETC ECT</p>
