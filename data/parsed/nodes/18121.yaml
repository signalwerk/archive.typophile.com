      <p>While driving home I realised I forgot to answer Patricia's original question:</p>
      <p>Whenever my daytime job starts spilling over into my downtime -- which is never really 'down', but what's in a name -- my voluntary work is the first thing to be sidetracked. I've been racing against the clock to design this book, so that's why I couldn't keep up with the maintenance of the Board lately. Today I sacrificed my lunch break to clean at least the current page, and I'll see what more I can do this weekend.</p>
      <p>As long as the new functionality of typophile isn't implemented, this will be a recurring situation. It has always been like that in the past, it will be like that in the foreseeable future.</p>
      <p>I will take into consideration any and all applications for assistance and pass it on to J'n'J, but please keep in mind I'm just the cleaning lady here -- it's not up to me to decide whose profile can be upgraded and granted moderator access.</p>
