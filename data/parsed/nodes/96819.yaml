    html: |-
      <p>I have nativity in three scripts (including Arabic) and can read five languages; I've made fonts both for scripts I can read languages in and scripts I can't, and I've come to believe that you don't need nativity in a script (which practically has very little to do with spoken language) to make acceptable fonts (although you certainly do need nativity to <em>innovate</em> in a script). The central things are observation and thought. However as a rule it take many years to accumulate enough of those two things to get quality results.</p>
      <p>BTW don't conflate "type design" with "typesetting".</p>
      <p>hhp</p>
