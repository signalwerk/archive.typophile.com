  html: <p>The Legibility Group is a series of newspaper types produced by <a href="/node/13676" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mergenthaler Linotype</a>. Members of the group include <a href="/node/add/wiki?edit%5Btitle%5D=Ionic" title="Create node &quot;Ionic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ionic</a> (1925), <a href="/node/13378" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Excelsior</a> (1931), <a href="/node/add/wiki?edit%5Btitle%5D=Paragon" title="Create node &quot;Paragon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Paragon</a> (1935), <a href="/node/add/wiki?edit%5Btitle%5D=Opticon" title="Create node &quot;Opticon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Opticon</a> (1935-6), and <a href="/node/add/wiki?edit%5Btitle%5D=Corona" title="Create node &quot;Corona&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Corona</a> (1941).</p>
