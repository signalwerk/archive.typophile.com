      <p>Hmph. One of the things that influences my buying of a font is the extent of a family.<br>
      I want small caps; I want <em>italic</em> small caps! If there’s a bold, a want bold small caps and bold italic small caps! All with matching OS figs (in the small caps font, please: why the Roman would contain the os figs and the small caps would contain lining figs is completely beyond me, but coming from a country with letters and numbers combined for postal codes it is a major major pain for typesetting.)</p>
      <p>Am I the last designer on earth who uses such things for the sake of consistency? I don’t want these things as extra styles, I <em>need</em> them so that if I’ve decided on the use of small caps in my document I can use them throughout and not be faced with that hideous conundrum of encountering eg. “USA” in an italic section or bold heading and having to decide ... now do i fake it (bad), break editorial style and set in caps (bad) or change the style throughout just to accomodate this incomplete font set (highly undesirable)?</p>
      <p>Furthermore, if a serif face has a matching sans, I need it all to match: os figs, scaps etc.</p>
      <p>As much as i love and use Eureka &amp; Eureka Sans, the Sans italic has no os figs! What kind of BS is that? I have literally had to change to lining figs throughout a document because of this.</p>
      <p>Perhaps I’m too uptight. But the main reason that designers give for buying type being “appropriateness for their message” and, essentially, recognizable, quirky style just makes me roll my eyes, throw my hands up in the air and give up on typography forever.</p>
      <p>sorry. got a little ranty.</p>
      <p>-marian</p>
