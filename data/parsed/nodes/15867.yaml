      <p>True, Dan. <a href="http://www.linotype.com/matrix" target="new">Linotype Matrix</a> seems to have the makings of a good trypographic periodical.</p>
      <p>There are inherent pitfalls in creating a <em>U&amp;lc</em> clone by a single foundry, large or small. For one thing, there is a certain bias to content and a danger of seeming too much “advertorial” than editorial.</p>
      <p>In 1990, Agfa launched a large format type magazine called <em>26</em> which lasted a short while since by corporate standards <em>sales</em> did not offset or justify the cost of publication. The attempt was valiant but no one seems to recall the existence of <em>26</em>. </p>
      <p>If a company measures “success” of a publication strictly against the sale of fonts and within the advertising budget, then it is doomed to fail.</p>
