      <p>» <em>Gotta sell quite a few $40 units to warrant production, printing, and mailing a mag of U&amp;lc’s quality</em></p>
      <p>It’s true that printing and paper costs are higher now, but if you recall for the first year or two of publication U&amp;lc was printed on low grade newsprint with black ink only. The “quality” of U&amp;lc was in its layouts and content, plus a bullpen of some of the best designers of that time. </p>
      <p>Also, Aaron Burns initially focused on creating a mailing base of only type specifiers (built from mailing lists from PLINC, other type houses and subscription list from Graphic Design USA) and colleges with art programs. The ratio of type buyers to readership was extremely high. Eventually U&amp;lc sold ad space as well.</p>
      <p>Developing a direct mail piece in <em>magazine-like</em> format by a foundry or font distributor would be quite costly today. A better approach would be to consider it a true publication, maybe quarterly. The production and printing cost, like any other magazine, would be paid in part by the advertisers, subscribers (if you are charging a fee) and direct purchase (instead of “newsstand” sales, it would be single issues ordered via internet, like <a href="http://www.artdesign.fr/boutique_us/liste_produits.cfm?type=23&amp;num=0&amp;code_lg=lg_us" target="new">étapes:international</a>). </p>
      <p>All in all, it would still be major undertaking.<br>
      Hmmmm... guess we need to come up with another schema. ;-)</p>
