    <p>Not sure if this has been brought to anyone’s attention on the Forum, but I just reviewed a survey in Oct. issue of <em>Graphic Design USA</em> on the <a href="http://www.gdusa.com/issue_2005/10_oct/lookout/lookout.php" target="new">Type Purchasing marketplace</a> from the type specifier’s viewpoint.</p>
    <p>Of note (by the readers surveyed):</p>
    <p>Do you have purchasing influence with regard to type and fonts?<br>
    YES 88%,	NO 12%</p>
    <p>How many designer font users or specifiers are there in your department or firm?<br>
    1-2  38%, 	3-5  21%<br>
    6-10  13%, 	11-15  11%,<br>
    16-25  8%, 	25+  9%</p>
    <p>Which operating system does your company use for those purposes?<br>
    macintosh 88%, window 38%,	both 26%</p>
    <p>Many of the comments by graphic designers are notable in terms of why and how the make decisions on buying fonts, but several comments just sound like “the smart thing to say.”</p>
    <p>COMMENT BY GRAPHIC DESIGNER: <em>Before computers changed the designer’s toolbox, type houses would provide large catalogues that displayed all manner of type style, size, specification tables (remember “specing type”?) and the like, for a wide variety of font families. We kept a huge library of these catalogues that we would “troll” for the appropriate font. The web has pretty much replaced this huge library, but nothing beats having the font resources right at hand.<br>
    Obviously we cannot purchase every available font on the planet so I would suggest to type designers and foundries that they send more mailers, promotions and reminders that they have the right “building block” at the “right time” for the design I am putting together.</em> — Ron Kalina, Kalina Design, Exton, PA</p>
    <p>The survey is followed by several pages Type Designers’ questions &amp; answers.</p>
