    <p>Hi everyone,</p>
    <p>I am starting an R&amp;D company - advanced theoretical analysis of stuff, mostly math/computer science/physics/biotech. I'm not here to boast though, I've been working with several of my friends, full-time designers on the company's typography, as I am an amateur typophile.</p>
    <p>All the proposal's that my friends came up with, were sans-serifs, stuff like you can see Nokia, Google, etc. do. </p>
    <p>My question for you is - do you think sans-serif font is the only possible option to express the ideas of doing research, the lightness of knowledge etc? Can one design a typographical identity of a research company based on a serif font? It seems to be a trend - everywhere in Poland universities are redesigning their logos abandoning old serif typefaces to sans-serif's.</p>
    <p>Can one find a serif font that would embody the modernity, innovative and light feeling of research, without looking old-fashioned and depreciated? What do you think?</p>
