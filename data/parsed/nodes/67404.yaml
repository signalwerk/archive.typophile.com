      <p>Google uses a serif (although I guess they use a sans-serif as their secondary typeface for all of their various web apps).</p>
      <p>I think one of the reasons we tend to associate serifs (as a genre, which is problematic, but I will get to that) with stuffiness is that most of the serifs that are included with our OSes and bundled with Adobe CS are very much based on more classical letterforms, and are more apt for setting text rather than display work. This is fine; if you're going to have typefaces bundled with your software you want them to be workhorses.</p>
      <p>But check out FontShop's Type Trends 2010 page: <a href="http://www.fontshop.com/blog/?cat=76" title="http://www.fontshop.com/blog/?cat=76">http://www.fontshop.com/blog/?cat=76</a> . Notice how the serifs are chunkier and more apt for the kind of display work you're looking at. They don't seem stuffy at all. I think if you look at some of the more recent serifs, you may find what you are looking for.</p>
      <p>EDIT: I guess what I'm really saying is that slab serifs are what you're looking for. But not stuff like Rockwell or Clarendon — you want the more humanist forms of recently-released slabs.</p>
