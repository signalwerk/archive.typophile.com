    html: <p><a href="http://www.identifont.com/show?3XD" rel="nofollow">Sassoon Primary</a> was done by Rosemary Sassoon and Adrian Williams and is a commercial font. No freefont. Please purchase it via one of the vendors in the link. Your above mentioned site is in no way reliable. Better go to fontsquirrel.com for quite reliable free fonts.</p>
