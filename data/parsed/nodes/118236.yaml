    <p>Hi!</p>
    <p>I'm illustrating a children's book and i was looking for free fonts. I bumped into Sassoon Primary. I downloaded it from ufonts.com, it says it's free.</p>
    <p>Is this website reliable? I need to know because it'll be troublesome to get into legal issues later!</p>
    <p>Thanks! :)</p>
