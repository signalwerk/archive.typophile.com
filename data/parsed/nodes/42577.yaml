      <p><strong>Dutch:</strong></p>
      <p>een (or één) = eerste = 1e<br>
      twee = tweede = 2e<br>
      drie = derde = 3e<br>
      vier = vierde = 4e<br>
      vijf = vijfde = 5e<br>
      zes = zesde = 6e<br>
      zeven = zevende = 7e<br>
      acht = achtste = 8e<br>
      negen = negende = 9e<br>
      tien = tiende = 10e</p>
      <p>elf = elfde = 11e<br>
      twaalf = twaalfde = 12e<br>
      dertien = dertiende = 13e<br>
      veertien = veertiende = 14e<br>
      and so forth - 15e, 16e, 17e</p>
      <p>twintig = twintigste = 20e<br>
      eenentwintig = eenentwintigste = 21e<br>
      tweeëntwintig = tweeëntwintigste = 22e<br>
      drieëntwintig = drieëntwintigste = 23e<br>
      vierentwintig = vierentwintigste = 24e<br>
      and so forth - 25e, 26e, 27e</p>
      <p>honderd = honderste = 100e<br>
      and so forth</p>
      <p>I believe officially numbers to twenty are written out full in Dutch; één, twee, drie .. elf, zestien, etc. (1, 2, 3 ... 11, 16). The factors of ten aswell; twintig, dertig, veertig (20, 30, 40). And also the rounded numbers above that; honderd, driehonderd, duizend, vijftienhonderd, achttienhonderd, etc. (100, 300, 1000, 1500, 1800).<br>
      Additionally for 1e, 2e and 3e, etc. also in use is/was: 1ste, 2de, 3de, etc.<br>
      The difference between 'een' and 'één', I think, is usually made if it stands next to the word 'een' in a text, which means 'a' or 'an' (a house) in Dutch. Or if you want to emphasize that it is <em>really</em> only one of something.</p>
      <p>Other Dutch speakers, please correct any mistakes I may have made. :)</p>
