    <p>I'd like to draw on the collective multilingual knowledge of the Typophile community to assemble the different forms of ordinal numbers in various languages.</p>
    <p>A brief refresher for those who need it: <em>Ordinal</em> means the form of a number when it indicates "order" -- for example, in English the ordinal form of "one" is "first."</p>
    <p>I'm also interested in the abbreviated forms.</p>
    <p>To start us off . . .</p>
    <p><strong>English</strong>:</p>
    <p>one = first = 1st<br>
    two = second = 2nd <em>(2d is also acceptable in some style guides)</em><br>
    three = third = 3rd <em>(3d is also acceptable in some style guides)</em><br>
    four = fourth = 4th<br>
    five = fifth = 5th<br>
    six = sixth = 6th<br>
    seven = seventh = 7th<br>
    eight = eighth = 8th<br>
    nine = ninth = 9th<br>
    ten = tenth = 10th</p>
    <p>eleven = eleventh = 11th<br>
    twelve = twelfth = 12th<br>
    thirteen = thirteenth = 13th<br>
    fourteen = fourteenth = 14th<br>
    and so forth: 15th, 16th, 17th, 18th, 19th</p>
    <p>twenty = twentieth = 20th<br>
    twenty-one = twenty-first = 21st<br>
    twenty-two = twenty-second = 22nd<br>
    twenty-three = twenty-third = 23rd<br>
    twenty-four = twenty-fourth = 24th<br>
    and so forth: 25th, 26th, 27th, 28th, 29th</p>
    <p>one hundred = one hundredth = 100th<br>
    and so forth: 101st, 102nd, 103rd, 104th . . .</p>
    <p>I think that covers all the patterns in English.</p>
    <p>I realize some other languages have genders, which may further complicate matters.</p>
    <p>Who's next?</p>
    <p>-- Kent.</p>
