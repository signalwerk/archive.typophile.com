      <p>Thomas --</p>
      <p>Well, I happen to be working on Whitman superscript/ordinal letters right now, so that piqued my curiosity. But in addition to being a typophile, I also have a fascination with linguistics, so it's a little bit of both fueling my interest.</p>
      <p>I don't really have a grand scheme in mind, certainly nothing as ambitious as a contextual {ordn} feature. I doubt that would be of any practical benefit.</p>
      <p>But I thought the discussion might be of general interest to the type design community. And I am interested to see if there is any use out there that is unfamiliar and eye-opening.</p>
      <p>I'm aware that, strictly speaking, the {ordn} feature really refers only to superscripted abbreviations -- which is a purely typographic convention, and really only a limited one, with seemingly no application to many languages.</p>
      <p>So, really there are three semantic layers. There's the ordinal form itself (which is an essential semantic element); then there's the convention for abbreviation; and then there's potentially a typographic tradition of superscripting the abbreviation. I'm always interested in understanding the linguistic elements behind the typographic traditions and conventions.</p>
      <p>But, practically speaking, I was pretty much planning to put a complete superscripted l.c. alphabet* in the {ordn} alignment -- different from the {sups} alignment. Just of good measure. I suppose to some extent, I am curious about the minimum letters required to handle the most common uses of superscripted ordinal abbreviations. I figure I should try to be aware of which of these would actually qualify as true "ordinals."</p>
      <p>*(unaccented -- unless I can discover a convincing argument for an é or è in French.)</p>
      <p>-- K.</p>
