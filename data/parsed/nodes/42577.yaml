      <p>It would be helpful to identify the cases where the ordinal forms of the language may cause ambiguities when old-style numerals are used.</p>
      <p>In Greek, I think there is a way of forming ordinals by attaching an omicron at the end of the arabic numerals. Then you don't want to have a font where it is difficult to distinguish the zero and a small omicron. In Georgia (the font you are probably reading this in), for example, 19ο (nineteenth) and 190 (one hundred ninety) are not the easiest to tell apart, though to its credit it does its best to make the troublesome letters distinguishable on screen.</p>
