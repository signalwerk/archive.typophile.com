      <p>Ordinals in Polish</p>
      <p>Ordinals declines like other adjectives in Polish, it means the ending of the word changes depending on<br>
      1) a number (single, plurar)<br>
      2) a gender (masculine/feminine/neuter gender)<br>
      3) a declension (8 forms: Rzeczownik, Mianownik, Dopełniacz, Celownik, Biernik, Narzędnik, Miejscownik, Wołacz)</p>
      <p>It gives such a big amount of possible combinations I'd write examples <strong>only for single/masculine/rzeczownik forms</strong>.</p>
      <p>Here in Poland we got three ways of writing orinals: full name; only ending after the numeral and dash; dot after the numeral.<br>
      However the best solution is to write whole words, other possibilities apply if you are short of space for a whole words, they can be long. It means you'd rather don't meet a 1-szy or 1. in a book, but you may spot it in mags, letters, etc. Grammar rules allow all three forms. So here it goes:</p>
      <p>num:[basic form/declined form [1],[2],[3]]<br>
      1: jeden/(1st) pierwszy,1-szy,1.<br>
      2: dwa/(2nd) drugi, 2-gi, 2.<br>
      3: trzy/(...)trzeci, 3-ci, 3.<br>
      4: cztery/czwarty, 4-ty, 4.<br>
      5: pięć/piąty, 5-ty, 5.<br>
      6: sześć/szósty, 6-ty, 6.<br>
      7: siedem/siódmy, 7-my, 7.<br>
      8: osiem/ósmy, 8-my, 8.<br>
      9: dziewięć/dziewiąty, 9-ty, 9.<br>
      10: dzesięć/dziesiąty, 10-ty, 10.</p>
      <p>11: jedenaście/jedenasty, 11-ty, 11.<br>
      12: dwanaście/dwunasty, 12-ty, 12.<br>
      13: trzynaście/trzynasty, 13-ty 13.<br>
      14: czternaście/czternasty, ...<br>
      15: piętnaście/piętnasty<br>
      16: szesnaście/szesnasty<br>
      17: siedemnaście/siedemnasty<br>
      18: osiemnaśice/osiemnasty<br>
      19: dziewiętnaście/dziewiętnasty</p>
      <p>20: dwadzieścia/dwudziesty,20-ty, 20.<br>
      21-29: dwadzieścia + [basic form 1 to 9]/dwudziesty + [declinated form 1 to 9]</p>
      <p>30: trzydzieści/trzydziesty<br>
      31-39: trzydzieści + [basic form 1 to 9]/trzydziesty + [declinated form 1 to 9]</p>
      <p>40: czterdzieści/czterdziesty<br>
      41-49: czterdzieści + [basic form 1 to 9]/czterdziesty + [declinated form 1 to 9]</p>
      <p>50: pięćdziesiąt/pięćdziesiąty<br>
      51-59: pięćdziesiąt + [basic form 1 to 9]/pięćdziesiąty + [declinated form 1 to 9]</p>
      <p>60: sześćdziesiąt/sześćdziesiąty<br>
      61-69: sześćdziesiąt + [basic form 1 to 9]/sześćdziesiąty + [declinated form 1 to 9]</p>
      <p>70: siedemdziesiąt/siedemdziesiąty<br>
      71-79: siedemdziesiąt + [basic form 1 to 9]/siedemdziesiąty + [declinated form 1 to 9]</p>
      <p>80: osiemdziesiąt/osiemdziesiąty<br>
      81-89: osiemdziesiąt + [basic form 1 to 9]/osiemdziesiąty + [declinated form 1 to 9]</p>
      <p>90: dziewięćdziesiąt/dziewięćdziesiąty<br>
      91-99: dziewięćdziesiąt + [basic form 1 to 9]/dziewięćdziesiąty + [declinated form 1 to 9]</p>
      <p>100: sto/<strong>setny</strong>, 100-ny, 100.<br>
      101: sto jeden/ <strong>sto</strong> pierwszy, 101-szy, 101.</p>
      <p>Counting from 100 you don't decline hundreds only singles and decimals UNLESS it is the EXACT number, so you decline eg. 100th word (setne słowo).</p>
      <p>Cheers,<br>
      Antoni</p>
