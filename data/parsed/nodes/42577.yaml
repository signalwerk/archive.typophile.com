      <p>Spanish has variant forms in the written out numbers (e.g., decimoprimero and undécimo for eleventh), and after about 20 people don't really remember how to say them anyways like in English, but here goes.  Most numbers change as follows:</p>
      <p>Segundo (masculine singular)<br>
      Segunda (feminine singular)<br>
      Segundos (masculine plural)<br>
      Segundas (feminine plural)</p>
      <p>All numbers ending in -ero (1st and 3rd) also have a variant form used when placed in front of masculine singular nouns:</p>
      <p>Primer (masculine singular in front of noun)<br>
      Primero (masculine singular elsewhere)</p>
      <p>The abbreviations are formed by using the number in digit form plus a period and a raised lowercase ending (underlined in the examples).  In practice the period can be placed directly beneath the letter or omitted. Note in my examples I'm not superscripting the letters because I can't on here.  Unicode has º and ª, but not the er, os, and as variants.</p>
      <p>1 uno/una = primer/o/a/os/as = 1.er 1.o 1.a 1.os 1.as<br>
      2 dos = segundo/a/os/as = 2.o 2.a 2.os 2.as<br>
      3 tres = tercero/a/os/as = 3.er 3.o 3.a 3.os 3.as<br>
      4 cuatro = cuarto/a/os/as = 4.o 4.a 4.os 4.as<br>
      5 cinco = quinto/a/os/as = 5.o 5.a 5.os 5.as<br>
      6 seis = sexto/a/os/as = 6.o 6.a 6.os 6.as<br>
      7 siete = séptimo/a -or- sétimo/a/os/a = 7.o 7.a 7.os 7.as<br>
      8 ocho = octavo/a/os/as = 8.o 8.a 8.os 8.as<br>
      9 nueve = noveno/a/os/as -or- nono/a/os/as = 9.o 9.a 9.os 9.as</p>
      <p>10 diez = décimo/a/os/as = 10.o 10.a 10.os 10.as<br>
      11 once = undécimo/a/os/as -or- decimoprimero/a/os/as -or-onceno/a/os/as = 11.er 11.o 11.a 11.os 11.as<br>
      12 doce = duodécimo/a/os/as -or- decimosegundo/a/os/as -ordoceno/a/os/as = 12.o 12.a 12.os 12.as<br>
      13 trece = decimotercero/a/os/as -or- decimotercio/a/os/as = 13.er 13.o 13.a 13.os 13.as<br>
      14 catorce = decimocuarto/a/os/as = 14.o 14.a 14.os 14.as<br>
      15 quince = decimoquinto/a/os/as = 15.o 15.a 15.os 15.as<br>
      16 dieciséis = decimosexto/a/os/as = 16.o 16.a 16.os 16.as<br>
      17 diecisiete = decimoséptimo/a/os/as = 17.o 17.a 17.os 17.as<br>
      18 dieciocho = decimoctavo/a/os/as = 18.o 18.a 18.os 18.as<br>
      19 diecinueve = decimonoveno/a/os/as -or- decimonono/a/os/as = 19.o 19.a 19.os 19.as</p>
      <p>20 veinte = vigésimo/a/os/as = 20.o 20.a 20.os 20.as<br>
      21 veintiuno = vigésimo primero / vigésimo primera/os/as = 21.o 21.a 21.os 21.as<br>
      30 treinta = trigésimo/a/os/as = 30.o 30.a 30.os 30.as<br>
      40 cuarenta = cuadragésimo/a/os/as = 40.o 40.a 40.os 40.as<br>
      50 cincuenta = quincuagésimo/a/os/as = 50.o 50.a 50.os 50.as<br>
      60 sesenta = sexagésimo/a/os/as = 60.o 60.a 60.os 60.as<br>
      70 setenta = septuagésimo/a/os/as = 70.o 70.a 70.os 70.as<br>
      80 ochenta = octogésimo/a/os/as = 80.o 80.a 80.os 80.as<br>
      90 noventa = nonagésimo/a/os/as = 90.o 90.a 90.os 90.as<br>
      100 cien/ciento = centésimo/a/os/as = 100.o 100.a 100.os 100.as<br>
      123 ciento treinta y tres = centésimo vigésimo tercer/o/a/os/as = 123.er 123.o 123.a 123.os 123.as </p>
      <p>And so on.  i don't feel like tying out the rest, but basically you have</p>
      <p>[number] + [period] + [raised er/o/a/os/as]</p>
      <p>With the er only being used for 1 and 3.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
