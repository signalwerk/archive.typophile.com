      <p>(Brand new user here)</p>
      <p>The rule in Danish is very simple: add a period after any cardinal number to turn it into an ordinal number, so ‘4.’ means ‘4th’, for example.</p>
      <p>1 en/et = første = 1. [‘En’ is common, ‘et’ is neuter—no other numerals are declined according to gender in Danish]<br>
      2 to = anden = 2.<br>
      3 tre = tredje = 3.<br>
      4 fire = fjerde = 4.<br>
      5 fem = femte = 5.<br>
      6 seks = sjette = 6.<br>
      7 syv = syvende = 7.<br>
      8 otte = ottende = 8.<br>
      9 ni = niende = 9.<br>
      10 ti = tiende = 10.</p>
      <p>11 elleve = ellevte = 11.<br>
      12 tolv = tolvte = 12.<br>
      13 tretten = trettende = 13.<br>
      14 fjorten = fjortende = 14.<br>
      15. femten = femtende = 15.<br>
      16 seksten = sekstende = 16.<br>
      17 sytten = syttende = 17.<br>
      18 atten = attende = 18.<br>
      19 nitten = nittende = 19.</p>
      <p>20 tyve = tyvende = 20.<br>
      21 enogtyve = enogtyvende = 21.<br>
      22 toogtyve = toogtyvende = 22.<br>
      23 treogtyve = treogtyvende = 23.<br>
      – &amp;c. The formula is [single number + ‘og’ + multiple of ten, written as one word for numerals under 100].</p>
      <p>30 tredive = tredivte/tredvte = 30. [Both forms are accepted]<br>
      40 fyrre = fyrretyvende = 40.<br>
      50 halvtreds = halvtredsindstyvende = 50.<br>
      60 tres = tresindstyvende = 60.<br>
      70 halvfjerds = halvfjerdsindstyvende = 70.<br>
      80 firs = firsindstyvende = 80.<br>
      90 halvfems = halvfemsindstyvende = 90.</p>
      <p>100 (et) hundred/hundrede = hundrede = 100. [Both ‘hundred’ and ‘hundrede’ are accepted as the cardinal number, only ‘hundrede’ as the ordinal number]<br>
      101 (et) hundred(e) og en/et = (et) hundred(e) og første = 101.</p>
      <p>200 to hundrede = to hundredede = 200.<br>
      201 to hundrede og en/et = to hundrede og første = 201.<br>
      &amp;c.</p>
      <p>1.000 = tusind/tusinde = tusinde = 1.000. [‘Tusind’ and ‘tusinde’ both accepted as cardinal, only ‘tusinde’ as ordinal]<br>
      1.001 = (et) tusind og en/et = (et) tusind og første = 1.001.<br>
      1.100 = et tusind et hundred(e) = et tusind et hundrede = 1.100. <em>— OR:</em><br>
      1.100 = elleve hundred(e) = ellevehundrede = 1.100.<br>
      1.101 = elleve hundred(e) og en/et = elleve hundred(e) og første = 1.101.</p>
      <p>2.000 = to tusind(e) = to tusinde = 2.000.<br>
      2.100 = to tusind(e) et hundred(e) = to tusind(e) et hundred(e) = 2.100. <em>— OR:</em><br>
      2.100 = enogtyve hundred(e) = enogtyve hundrede = 2.100.<br>
      &amp;c.</p>
      <p>1.000.000 = en million = millionte = 1.000.000.<br>
      2.000.000 = to millioner = to millionte = 2.000.000.</p>
      <p>1.000.000.000 = en milliard = millardte = 1.000.000.000.<br>
      &amp;c.</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>Notes:</p>
      <p>1. ‘100’ and ‘1.000’ can be said with or without the cardinal ‘1’ before them, as in English. If no cardinal is said, there is no indefinite article (as there would be in English), since the indefinite article is the same as the cardinal number one. So ‘hundred(e) og fjorten’ is the same as ‘a hundred and fourteen’, while ‘et hundred(e) og fjorten’ is the same as ‘one hundred and fourteen’.</p>
      <p>2. Unlike in English, an ordinal followed by a noun is not always used with a definite article: ‘for otteogtredivte gang’ (‘for <em>the</em> thirty-eighth time’), ‘jeg bor på niende sal’ (‘I live on <em>the</em> ninth floor’), &amp;c.</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>To be honest, there are few points in this list I’m not entirely sure of. For one thing, I’m not sure if ‘101st’ should properly be written out as ‘(et) hundred(e) og første’ or ‘(et)hundred(e)ogførste’. I <em>think</em> the first is the only correct option, but I can’t find any definitive answer from Dansk Sprognævn (the Danish Language Council).</p>
      <p>And some of these are so extremely rare as ordinal numbers that I had to look them up to find out what their ordinal forms are. I’ve never seen or heard ‘milliardte’ used. I also don’t think most Danes are aware the ordinal form of ‘hundred(e)’ is just ‘hundrede’. My first guess at spelling it, before checking with the dictionary, was ‘hundredende’, which is how anyone would most likely say it out loud.</p>
