      <p>I adore the word <em>sinaasappelsap</em>, as well. And now <em>achtentachtigste</em>, too. :-)</p>
      <p>&nbsp;</p>
      <p><cite>It’s interesting that the rule for abbreviation is so simple. I would think this could lead to some confusion. But perhaps Danes don’t abbreviate ordinals that often.</cite></p>
      <p>Actually, no, it very rarely leads to any problems or misunderstandings. The only ambiguity is when the ordinal is last in a sentence, since it is then indistinguishable from a cardinal; but even in such situations, context is usually enough to differentiate them quite easily.</p>
      <p>Ordinals of more complex numbers are usually avoided in speech, though. Instead of saying <em>seks hundrede og toogtres tusind fire hundrede og seksogfirsindstyvende</em> (662,486th), most people would paraphrase and say <em>nummer seks hundrede og toogtres tusind fire hundrede og seksogfirs</em> (number 662,486) instead. This also goes (even more so, actually) for numbers that end in 100, 1,000, 1,000,000, 1,000,000,000, &amp;c., since those have such awkward ordinal forms.</p>
      <p>&nbsp;</p>
      <p><cite>Maxim — Declining ordinals? Yikes.</cite></p>
      <p>You should try Finnish, then. No genders, thankfully, but all numerals (cardinals and ordinals alike) are declined in all <a href="http://www.cs.tut.fi/~jkorpela/finnish-cases.html" title="Finnish cases" rel="nofollow">15 or so cases</a> both in the singular and the plural (yes, numerals in Finnish have both singular and plural forms! I’ll just ignore them here, though). And for complex numbers, <em>all</em> constituents of the numeral have to be declined, so ‘three hundred and fifty-seventh’ in the allative case, for example, would literally be ‘to-third to-hundredth to-fiftieth to-seventh’. And they’re written as one big long word, too (but that goes for all numerals).</p>
      <p>A simple example, since the entire system is too complex to even hint at here, using 357th to go by:</p>
      <p>Formula (see below for abbreviations and explanation):<br>
      [Num]. [C nom] [C part] [C gen] [C ess] // [O nom] [O part] [O gen] [O ess]</p>
      <p>3. kolme kolmea kolmen kolmena // kolmas kolmatta kolmannen kolmantena<br>
      100. sata sataa sadan satana // sadas sadatta sadannen sadantena<br>
      5. viisi viittä viiden viitena // viides viidettä viidennen viidentenä<br>
      10. kymmenen kymmentä kymmenen kymmenenä // kymmenes kymmenettä kymmenennen kymmenentenä<br>
      7. seitsemän seitsemää seitsemän seitsemänä // seitsemäs seitsemättä seitsemännen seitsemäntenä</p>
      <p>Putting those together to form 357 is quite simple:</p>
      <p>C nom: kolmesataaviisikymmentäseitsemän<br>
      C part: kolmeasataaviittäkymmentäseitsemää<br>
      C gen: kolmensadanviidenkymmenenseitsemän<br>
      C ess: kolmenasatanaviitenäkymmenenäseitsemänä</p>
      <p>O nom: kolmassadasviideskymmenesseitsemäs<br>
      O part: kolmattasadattaviidettäkymmenettäseitsemätta<br>
      O gen: kolmannensadannenviidennenkymmenennenseitsemännen *<br>
      O ess: kolmantenasadantenaviidentenäkymmenentenäseitsemäntenä</p>
      <p>Abbreviations:<br>
      C = cardinal<br>
      O = ordinal<br>
      nom = nominative<br>
      part = <a href="http://en.wikipedia.org/wiki/Partitive_case" title="Partitive case" rel="nofollow">partitive</a><br>
      gen = genitive<br>
      ess = <a href="http://en.wikipedia.org/wiki/Essive_case" title="Essive case" rel="nofollow">essive</a></p>
      <p>The singular stem (and the plural stem in many words, but thankfully not in the ordinals) is used to form all cases except the nominative and partitive, which often have stems of their own. It exists in two <a href="http://en.wikipedia.org/wiki/Consonant_gradation#Finnish" title="Gradation in Finnish" rel="nofollow">grades</a>, strong and weak. The genitive singular always gives the weak grade, while the essive singular always gives the strong grade (this isn’t true for all declensions, but it’s true for the numerals). It is thus necessary to know both the nominative and partitive for both the singular and plural, as well as the genitive and the essive singular, for any word in order to be able to decline it correctly.</p>
      <p>&nbsp;</p>
      <p>As numerals, the Finnish do the same as the Danes and Germans: add a simple period after the last number. To be honest, I’m not sure how they handle the cases. With cardinals, they simply add the (vowelless) case ending to the number, separated (as is common in Finnish) by a colon, so ‘in 357 houses’ would be written as <em>357:ssä talossa</em> (or <em>kolmessasadassaviidessäkymmenessäseitsemässä talossa</em>). But it doesn’t seem likely that ‘in the 357th house’ would be written as <em>357.:ssä talossa</em> (or <em>kolmannessasadannessaviidennessäkymmenennessäseitsemännessä talossa</em>).</p>
      <p>* That word took about half an hour to type. Cripes.</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>All right, moving on to something slightly easier: Chinese.</p>
      <p>In Chinese, to make a cardinal into an ordinal, you simply prefix it with the character 第 (dì). It’s always written out as a character, and it’s spoken where and as it’s written, whether the numeral itself is written as Chinese numeric characters or as Arabic numerals.</p>
      <p>Thus:</p>
      <p>1 <em>or</em> 一 (yī) =&gt; 第1 <em>or</em> 第一 (dì yī)<br>
      36 <em>or</em> 三十六 (sānshíliù) =&gt; 第36 <em>or</em> 第三十六 (dì sānshíliù)</p>
      <p>A lot simpler. ;-)</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>I’d give you some info on Irish ordinals, as well, but I can barely wrap my head around half of those myself, so I should do some more research before trying my hand at it. Irish numerals are notoriously complex and tricky.</p>
