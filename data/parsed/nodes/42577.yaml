      <p>So, today is still the most seldom, still most useful day of the year, so let's give an example of Hungarian.</p>
      <p>In Hungarian you write ordinal numbers as in Danish, German, Polish (and several other European traditions): with a period following the Arabic numeral: 1., 2., 3., etc. so that's simple. The first ten are spelled out (cardinal ~ ordinal)</p>
      <p>1 egy ~ első 1.<br>
      2 kettő ~ második 2.<br>
      3 három ~ harmadik etc.<br>
      négy ~ negyedik<br>
      öt ~ ötödik<br>
      hat ~ hatodik<br>
      hét ~ hetedik<br>
      nyolc ~ nyolcadik<br>
      tíz ~ tizedik</p>
      <p>Basically the rule is (except for the first three; they always seem to be special cf. one ~ first, two ~ second... uno ~ primero) to add -Vdik where V stands for a vowel harmonising with the vowels of the word (vowel harmony is a basic feature of Hungarian) [and some minor vowel length changes in the stem might take place].</p>
      <p>Purely technically, Hungarian ordinals can also take one of the 20+ cases and be in singular as well as plural (cf. Finnish), but that's really not what you are looking for* ;-). In most such cases, you'd write it out. (Again, technically, one would write it with number, dot, dash, ending: 1.-ben (first[inessive case])). When writing dates (which are spoken with the ordinal in possessive form (Hungarian marks linguistically what is possessed as opposed to what is possessing in most IE languages (genetive case)) they have a slightly different writing rule, as in not writing/dropping the dot, just writing "május 1-én" e.g. (May 1-[possessive marker][superessive case] meaning "on the 1st of May")</p>
      <p>_____<br>
      * You really don't want to go into that, as there are more than just the ca. 50 combinations of cases and singular/plurar, as Hungarian marks several other things, as. e.g. possession and the person and number of possessor on the item as well, and additionally, whether the possession is in singular or plurar... so that adds up. -- However as opposed to fully inflecting languages, it's comparably easy, you can imagine it as a building kit, just adding modules (so you don't have to remember 6x2x25x2x... endings, just 6+2+25+2+... endings which you can combine then in 6x2x25x... ways... it's soo simple!</p>
      <p>This cannot comete with the "somewhat constructed" Finnish riiuuyöaieuutiset (‘news about intentions for a dating night’), but one the (acutally atypical) Hungarian vowel-word is: "fiaiéi" which means "his sons' somethings (that were referred to previously)". And merely formally, you could go on saying fiaiéiéiéiéiéiéi... forever, if those somethings together again possess several somethings possessing together several somethings... but THAT's constructed (and noone could track it, right?), while the first could happen in a real conversation...</p>
