      <p>Somebody correct me if I'm wrong, but French is (with the numeral suffixes in superscript):</p>
      <p>1 un(e) = premier/première = 1er/1re<br>
      2 deux = deuxième = 2e<br>
      3 trois = troisième = 3e<br>
      ...</p>
      <p>The rest just follow the same pattern: add "-ième" to the cardinal number, add a superscript 'e' to the numeral. I'm pretty sure even numbers that end with a 1 just add "-ième" (e.g. vingt et unième, 21e). I've also seen a superscript "ième" after the numeral but I'm not sure how common that is.</p>
      <p> - Lex</p>
      <p>EDIT: Fixed spelling of "trois".</p>
