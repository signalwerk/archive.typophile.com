  - id: 263061
    user_id: 24678
    user_name: daniele capo
    user_path: null
    user_image: /files/pictures/picture-24678.jpg
    date_raw: 2 Mar 2008 — 3:06am
    date: 2008-03-02T03:06:00
    votes: null
    html: |-
      <p>In Italian</p>
      <p>1 - uno - primo/prima - 1º/1ª (maculine/feminine)<br>
      2 - due - secondo/seconda - ———<br>
      3 - tre - terzo/terza<br>
      4 - quattro - quarto /quarta<br>
      5 - cinque - quinto/quinta<br>
      6- sei - sesto/sesta<br>
      7 - sette - settimo/settima<br>
      8 - otto - ottavo/ottava<br>
      9 - nove - nono/nona<br>
      10 - dieci - decimo/decima</p>
      <p>Then from 11<br>
      11 - undici (you can form the number from the numbers uno and dici for dieci-ten) unidicesimo/undicesima (formed from undici and esimo)<br>
      12 - dodici - dodicesimo/dodicesima<br>
      13 - tredici - tredicesimo/tredicesima<br>
      14 - quattordici - quattordicesimo/quattordicesima<br>
      15 - quindici - quindicesimo/quindicesima<br>
      16 - sedici - sedicesimo/sedicesimi<br>
      17 - diciassette - diciassettesimo/diciasettesima<br>
      18 - diciotto -diciottesimo/diciottesima<br>
      19 - diciannove - diciannovesimo/diciannovesima</p>
      <p>Now, from 20<br>
      20 - venti - ventesimo/ventesima<br>
      21 - ventuno -ventunesimo/ventunesima (you form numbers vent(i)-uno; venti-due; venti-tre and so on, the ordinals follow ventiduesimo, ventitreesimo,..., ventinovesimo)</p>
      <p>30 - trenta - trentesimo (and, trentuno, trentadue, etc., the ordinals trentunesimo, trentaduesimo)<br>
      40 - quaranta<br>
      50 - cinquanta (cinque+anta)<br>
      60- sessanta<br>
      70 - settanta (sette+anta)<br>
      80 - ottanta (otto+anta)<br>
      90 - novanta (nove+anta)</p>
      <p>100 - cento - cento - centesimo/centesima<br>
      centoun, centodue, ecc.<br>
      1000 - milleuno, ecc.</p>
      <p>10000 - diecimila (dieci+mila, where mila is 1000), ecc., ordinal: diecimilesimo (who needs this word?)<br>
      100000 - centomila (cento+mila) ecc. ordinal: centomilesimo<br>
      1000000 - un milione, ordinal: milionesimo</p>
      <p>of course, for ordinals number you have plurals form for masculine and feminine (sing. primo/prima - plur. primi/prime).</p>
