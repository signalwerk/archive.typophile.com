      <p>The German rule is pretty much the same as the Danish: add a dot after the number. Boring, huh? ;°)<br>
      Dan once <a href="http://www.flickr.com/photos/typeoff/876524974/" rel="nofollow">found a gravestone</a> that exhibits an abbreviated notation more like it is common in English or French – but that’s absolutely unusual.</p>
      <p>Apart from the 4 declensions (neuter, female, male, plural), there is the form that one would use in enumerations: with -tens</p>
      <p>1 eins (<em>n</em> ein, <em>f</em> eine, <em>m</em> einer <em>pl</em> einen) = erstens (<em>n</em> erstes, <em>f</em> erste, <em>m</em> erster, <em>pl</em> ersten) = 1.<br>
      2 zwei = zweitens (zweites, zweite, zweiter, zweiten) = 2.<br>
      3 drei = drittens (drittes, dritte, dritter, dritten) = 3.<br>
      4 vier = viertens = 4.<br>
      5 fünf = fünftens = 5.<br>
      6 sechs = sechstens = 6.<br>
      7 sieben = siebtens/siebentes [latter is formal and unusual] = 7.<br>
      8 acht = achtens = 8.<br>
      9 neun = neuntens = 9.<br>
      10 zehn = zehntens = 10.</p>
      <p>11 elf = elftens = 11.<br>
      12 zwölf = zwölftens = 12.<br>
      13 dreizehn = dreizehntens = 13.<br>
      14 vierzehn = vierzehntens = 14.</p>
      <p>20 zwanzig = zwanzigstens = 20.<br>
      21 einundzwanzig = einundzwanzigstens  = 21.<br>
      22 zweiundzwanzig = zweiundzwanzigstens  = 22.</p>
      <p>100 (ein)hundert = hundertstens (hundertstes, hundertste, hundertsten)  = 100.<br>
      101 (ein)hundert(und)eins = hunderterstens  = 101.</p>
      <p>1000 (ein)tausend = tausendstens (tausendstes, tausendste, tausendster, tausendsten)  = 1000.</p>
      <p>F</p>
