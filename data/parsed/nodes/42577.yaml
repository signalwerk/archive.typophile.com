      <dl>The way the ordinals are formed in Russian is pretty complex.<br>
      First, their form depends on the <em>gender</em> (male/female/neutral), e.g., 1st:<br>
      <dd>(m) 1-й;<br>
      (f) 1-я;<br>
      (n) 1-е.</dd>
      </dl>
      <dl>Second, their form varies with the <em>number</em> (singular/plural):<br>
      <dd>(m,s) 1-й; (m,p) 1-е;<br>
      (f,s) 1-я; (f,p) 1-е;<br>
      (n,s) 1-е; (n,p) 1-е. </dd>
      </dl>
      <dl>Third, their form depends on the case of <em>declension</em>. There are six cases in modern Russian: nominative, genitive, dative, accusative, instrumental, and prepositional:,<br>
      <dd>(m,s,n) 1-й;<br>
      (m,s,g) 1-го;<br>
      (m,s,d) 1-му;<br>
      (m,s,a) 1-го;<br>
      (m,s,i) 1-ым;<br>
      (m,s,p) 1-ом.<br>
      </dd></dl>
      <p>So every ordinal number can easily have up to 36 forms, many of which <em>look</em> and <em>sound</em> the same. Cool, huh?</p>
