  html: |-
    <p>Hello All,</p>
    <p>Does anyone know how to use InDesign for documents with heavy use of hierarchy and numbering?<br>
    2.0</p>
    <p>2.1</p>
    <p>2.2</p>
    <p>Are there any default settings I could use?</p>
    <p>Thanks for your help.</p>
