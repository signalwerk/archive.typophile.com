    html: |-
      <p>The feature exists, is powerful but works in a very different way than Word's.</p>
      <p>You must create paragraph styles activating the <strong>bullets and numbering</strong> options. It's needed one style for each level in your hierarchy.</p>
      <p>Something like this (the capture is in Portuguese, but you can identify the items as their position is the same):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/idnumbers_3871.png"></div><br>
      .<br>
      In the paragraph style you define the level (nível) and set the format. Usually, numeration will be continuous whitin a chapter.<p></p>
      <p>When setting second- or third-level styles, you need to define where numeration will restart. Here you see a second-level paragrapf settings:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/idnumbers2_4392.png"></div><br>
      .<br>
      The option I chose makes numeration for second-level titles restart every time a new first-level appears. The result is this:<p></p>
      <p>1. Nononononon<br>
      1.1 nononon<br>
      1.2 nononon<br>
      2. Nononon &lt;– a first-level paragraph makes the 2.n numbers restart<br>
      2.1 nononon<br>
      2.2 nononon<br>
      etc.</p>
      <p>Please note that ID keeps the numerations independent. So if you don't have a first-level paragraph in any place on the text, the second-level numeration will appear like this:<br>
      0.1 nononon<br>
      0.2 nononon<br>
      etc.</p>
      <p>This is a powerful feature which lets you apply detailed format to numbers apart of the paragraph style itself and build a structured document. I suggest you to take a look on the InDesign Help about this feature.</p>
