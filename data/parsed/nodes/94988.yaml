      <p>I’m very impressed with this typeface, but not as a work commissioned for the Olympics.</p>
      <p>Sorry, but the (albeit lovely) bounce of this type design really doesn’t reﬂect the discipline and rigor involved in athletic training and competition. Although a few sports/games do have elements of freestyle.</p>
      <p>Would it not be possible to write a PR release free of bullshit?</p>
      <p>Let’s face it, this represents the international tourism cliché of Brazil, it’s a Mardi Gras carnival font.</p>
      <p>Just substitute “dance” for “sport” and “dancer” for “athlete” in the PR, and it makes perfect sense. That can’t be right, sport isn’t dance.</p>
