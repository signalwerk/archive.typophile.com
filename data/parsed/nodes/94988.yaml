    html: |-
      <p>Nick, the money comes from the spectators, so the font is for the spectators, not the athletes, and watching the Olympics hasn't been about discipline and rigor for quite a number of years now. Now it's just a great vacation or a decent staycation; I've done the former in Barcelona and the latter in LA, and there was nothing strenuous about them! Offhand I can only think of the 24 Hours of Le Mans as being strenuous for spectators.</p>
      <blockquote><p>Would it not be possible to write a PR release free of bullshit?</p></blockquote>
      <p>The spinners getting this sort of thing financed would be out of a job without it. Consider all the "anchor" and "upward movement" BS involved in the selling of the new Turkish Lira symbol (which I actually find quite decent of itself). Just go with the flow, and focus on the actual font.</p>
      <p>hhp</p>
