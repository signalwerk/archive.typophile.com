    html: |-
      <p>I think of the Olympics as an event, and not as a 'local happening'. I guess in its purest state the Olympics were once upon a time marketed as being all about athletic achievement.  And to me - having spent a lifetime in sport - I feel that this go 'round in London is bang on the money.</p>
      <p>Everything about the 2012 Olympic event is raw to the bone. The sites, the font, the logo, the army, the ground to air missile launch sites, the brand police, even the local issue of traffic control is raw to the bone, mean, nasty stuff. It all competes in harmony with the force an any of the Olympic athletes. </p>
      <p>Brazil 2016 seems to be more about a temporal event place - interpretation - disassociated from the Olympic competitions brute force energy. Brazil 2016 might just turn out to be a like a smoothie you'd buy at the local convenience store. </p>
      <p>n.</p>
