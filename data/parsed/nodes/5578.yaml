  html: |-
    <p><a href="https://web.archive.org/web/20081121141419/http://www.thestar.com/NASApp/cs/ContentServer?pagename=thestar/Layout/Article_Type1&amp;call_pageid=971358637177&amp;c=Article&amp;cid=1089370222549&amp;tacodalogin=no" target="_blank">Toronto chooses Terminal Design's Clearview for new street signs.</a> <br> <br>The article said "That such tweaking makes Clearview easier for seniors to read is not the hollow assertion of designers but was proved out on the street by several tests." <br> <br>Does anyone know how these tests are being conducted? <br> <br>Is upper lower case really more legible in this case? We're not talking about a paragraph, just a couple of words. Would contrast (weight?) be more important than shape of the words? <br> <br>I'm just thinking out loud, cos the <a href="https://web.archive.org/web/20081121141419/http://www.manic.com.sg/blog/archives/000170.php" target="_blank">road signs</a> from where I am are driving me loony. I find the old ones more readable, and I wish I knew why.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081121141419/http://www.typophile.com/node/5721" class="topic-previous" title="Go to previous forum topic">‹ Does this classic typeface fly in a technology piece?</a> <a href="/web/20081121141419/http://www.typophile.com/node/5710" class="topic-next" title="Go to next forum topic">Things to do in Vienna ›</a></div>
