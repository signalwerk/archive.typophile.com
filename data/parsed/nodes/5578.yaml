  - id: 39917
    user: 2021
    date: 2004-07-12T10:09:00
    date_raw: 12.Jul.2004 10.09am
    votes: null
    html: "<p>Karen, several reasons. <br> <br>1. Aesthetic: The old ones had a consistency of form and content, with embossed lettering. So, putting neatly printed flat \"expressway\" lettering (functionalist U&amp;lc modernism) in funky old decorative frames just doesn't look right. these are aesthetic objects, as well as functional. <br> <br>2. Complex outline of signs. The irregular shape of the signs may create distracting irregular negative spaces with the irregular \"word envelopes\" of the names. Especially when the street name is crammed in with the neighbourhood graphics. <br> <br>3. Clutter. The integration of BIA (Business Improvement Area) \"neighbourhood\" designations, as shown in the Star article you linked to, is poorly executed. Hopefully the design consultants can get this standardized. <br> <br>One good thing about the new system, it can be changed/repaired quickly. When the new signs were put up in our area, and \"Geoffrey St\" was mis-spelled \"Goeffrey St\", they fixed it within a couple of weeks. <br> <br></p>"
