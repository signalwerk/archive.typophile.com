    html: <p>In the sample of the new sign published in the Star article, the Mixed case Clearview legend is crammed into an uncomfortably sized white field. There is very little space top and bottom.  <br> <br>When we were developing Clearview our field tests pointed to the need for a reasonalbe amount of space around the legend. Lack of such a field always reduced its legibilty.  <br> <br>Also it's hard for me to tell from the example what version of Clearview they are using. I have a feeling its an older version.  <br> <br>3M, as part of their original investment in the early research funding was given around 100 sets of the fonts for their clients use. This may be one of those instances. <br> <br>Karen (and anyone else), if you are interested in the details of Clearview's development, I have a pdf that explains it some. It is rather large to post here, 1.4megs, but if you contact me I would be happy to e-mail it to you. </p>
    html_clean: <p>In the sample of the new sign published in the Star article, the Mixed case Clearview legend is crammed into an uncomfortably sized white field. There is very little space top and bottom.  <br> <br>When we were developing Clearview our field tests pointed to the need for a reasonalbe amount of space around the legend. Lack of such a field always reduced its legibilty.  <br> <br>Also it's hard for me to tell from the example what version of Clearview they are using. I have a feeling its an older version.  <br> <br>3M, as part of their original investment in the early research funding was given around 100 sets of the fonts for their clients use. This may be one of those instances. <br> <br>Karen (and anyone else), if you are interested in the details of Clearview's development, I have a pdf that explains it some. It is rather large to post here, 1.4megs, but if you contact me I would be happy to e-mail it to you. </p>
