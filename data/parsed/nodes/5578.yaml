    html: <p>I think you're spot on with those three points. I found the old Toronto signs had a nice old world charm about them.  <br> <br>But do you know why all Caps (old) signs in my second link appear more readable than the Rotis (new) ones?  <br> <br>I find the new ones very hard to read, and at least one other person (ok, another designer) claimed that the new signs almost caused him to have an accident. <img src="https://web.archive.org/web/20081121141419im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
