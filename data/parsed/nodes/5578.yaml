    html: <p>Karen, <br> <br>1. Rotis has legibility problems, in particular it's too high-contrast for this kind of application. Also some letterforms are confusing, for instance the way the "c" is just the "e" without a fine horizontal crossbar. <br> <br>2. The letterpsacing is too large, particularly in relation to the word spacing. Or are they going for the DotCom look? <br> <br>3. I'm guessing this example is tracked out, and they use the condensed to accomodate really long names. But it would have been better to maintain a constant letterspacing on all signs, and here, for instance, just center the words. <br> <br>4. Perhaps not enough contrast between white lettering and green background.</p>
