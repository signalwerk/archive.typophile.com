  html: |-
    <p>Hi all! </p>
    <p>I'm a new member to this forum, but often come here to look at things/derive inspiration. </p>
    <p>I am a GD student at Anderson University in Anderson, SC. Our school is very small in terms of students, but the GD program is strong and almost always has award winning designers graduating. I am currently a sophomore in the program and am absolutely loving it so far!</p>
    <p>That being said, during the past month to a month and a half, we have been given the opportunity to design a typeface from scratch - from sketching, to hand rendering, to scanning and pathing in Illustrator, to creating an opentype version of the typeface. I've put a lot of work into this project, so I guess I just wanted some feedback on it!</p>
    <p>I have posted the specimen book on issuu.com, so you can read about the face and the concept behind it. </p>
    <p>Without further ado, I give you all Quest!</p>
    <p>[[http://issuu.com/gagelagreca/docs/quest]</p>
    <p>]</p><div class="imageWrap"><img src="http://typophile.com/files/tsp7_6434.png"></div><p></p>
