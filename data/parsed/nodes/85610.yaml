    votes: null
    html: |-
      <p>There are still some stupid bugs when it comes to installing fonts. For example, on Windows 7 you still can't drag a font from a double-clicked zip file into the Windows fonts folder. You have to drag it to another folder first, and then into the fonts folder.</p>
      <p>On Mac OS Lion the user's fonts folder is inside the hidden Library folder.</p>
      <p>I never use the »double click and then click the install button« way, but I agree, if users can double click on an installer, they can also double click on the fonts ;)</p>
