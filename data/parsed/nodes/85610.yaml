    html: |-
      <p>IIRC, the Blaktur CD by House Industries came with an installer. Shouldn't be too hard to build on a Mac if you have the dev tools installed. I don't know about other systems though. There probably will be users who need to install the fonts on a system you haven't thought of ;)</p>
      <p>Personally, I don't like installers. Just give me the plain font files ;) But for novice users it may be easier than to install fonts manually.</p>
