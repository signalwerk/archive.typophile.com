  html: |-
    <p>I'd like to convert all (or most) of my Type 1 fonts to OpenType.</p>
    <p>Crossfont seems able to do this, and it claims to preserve all character outlines, metrics and hinting.</p>
    <p>Just to mnake sure: will there be any kind of degradation in quality when I convert Type 1 to OpenType?</p>
    <p>Thanks.</p>
