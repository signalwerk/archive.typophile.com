  html: |-
    <p>Hi typophiles,</p>
    <p>recently I stumbled across a Type-ID-topic which conclusion was Helvetica Rounded Bold Condensend and I thought what serif would match it. Instead of doing a exhausting research I took the oppotunity and started one by myself. And this changed into a project further than just adopting charasteristics of Helvetica Rounded Condensed but more into something with a own style. And this is the first result. </p>
    <p>Please tell me what you think.<br>
    Is it worth going on with it?<br>
    Is it too close to something existing?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hel-rou-bol-con-ser_specimen1_4610.jpg"></div><p></p>
    <p>Thanks in advance</p>
