    <p>Hi everybody! This is my first post in this forum. </p>
    <p>I am creating a font for my native Javanese script recently added to Unicode. The script is a complex Indic-type script.<br>
    My font was autohinted in FontForge using steps explained <a class="freelinking external" href="http://sourceforge.net/apps/trac/fontforge/wiki/FontForge%27s%20TTF%20hinting%3A%20how%20it%20works" rel="nofollow">in here</a>.<br>
    With FontForge's autohinting, my font looks decent and readable on-screen. </p>
    <p>Unfortunately the font looks very distorted on Adobe Reader. I've noticed the distortion only happened to my font. Other fonts used in the PDF document look fine.<br>
    <img src="http://typophile.com/files/SampleAdobeReader.png"></p>
    <p>Strangely, it looks not distorted on Foxit Reader.<br>
    <img src="http://typophile.com/files/SampleFoxitReader.png"></p>
    <p>Please help me how to properly autohint in FontForge so the result will not looks distorted on Adobe Reader. Thanks.</p>
