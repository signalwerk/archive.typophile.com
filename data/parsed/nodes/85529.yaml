      <p>The problem I am seeing? Look at the screenshots above. Why the font looks ugly in Adobe Reader, but looks good on OS and other applications? Is there something missing or wrong in this <a class="freelinking external" href="http://sourceforge.net/apps/trac/fontforge/wiki/FontForge%27s%20TTF%20hinting%3A%20how%20it%20works" rel="nofollow">autohinting steps in FontForge</a>?</p>
      <ul>
      <li>In Settings -&gt; PS Hinting, turn diagonal hinting on.</li>
      <li>Autohint (NOT Auto Instruct) the font.</li>
      <li>In Element -&gt; FontInfo -&gt; PS Private, add these entries (FF will provide default values): BlueValues, OtherBlues, StemSnapH, StdHW, StemSnapV and StdVW.</li>
      <li>Now the font can be auto-instructed. </li>
      </ul>
      <p>Here's how the font looks on OpenOffice in Windows XP with ClearType turned on.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Typophilesample_5238.png"></div><br>
      And here's how it looks on Adobe Reader in Windows XP. Spaces between stems sometimes too wide and sometimes too narrow or missing.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Typophilesampleadobe_5987.png"></div><p></p>
