  html: |-
    <p>I am looking for a typeface to set the following quote:</p>
    <p>"I write without seeing. This is the first time I have ever written in the dark…not knowing whether I am indeed forming letters. Wherever there will be nothing, read that I love you."</p>
    <p>It's from a letter (roughly mid 1700s). I intend to get this as a tattoo, so I'd like it either professionally set or hand drawn. I'm a competent typographer but for this I need a true artist. </p>
    <p>Can anyone offer any suggestion on where I might start?</p>
    <p>Thank you so much.</p>
    <p>Tim</p>
