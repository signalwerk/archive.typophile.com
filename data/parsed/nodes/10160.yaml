    html: <p>I have a similar logo (the way it looks on my business card if you take off the 3d effect) and layout for my personal identity. I like the simplicity. I don't think you need the web address since you have an email. It is obvious you have a domain and if people want to put out the effort to look you up they won't have a problem. <br> <br>I don't like the line between the icon and type. It feels uneccessary. A solution may be to make your icon black and alchion white. If you do decide to use a line make it go straight up. It is fighting with the icon being diagonal. <br> <br>I would like to "design" spread under Alchion to the exact width. It feels too small and since the type is leaning against the icon it seems justifying it to the right doesn't seem---right. <br> <br>I don't know if any of these suggestions will work, I would just like to see more options.</p>
