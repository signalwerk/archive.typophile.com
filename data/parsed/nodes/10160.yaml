  html: <p>This is the business card for my studio Alchion Design Lab (formerly Design Alchemy). Fonts used are Wedding Sans (modified) and Normetica (modified). I did a set of old style numerals based on Wedding Sans, as well as new @ symbol based on my logo+ a few alternate characters. <br>Color-Orange will be custom mix of flourecent and standard orange, this will be more vibrant that straight orange but not quite flourecent (I have not done this type of tweak in orange yet, but it worked well last time I did this type of mix in yellow.  <br>Paper is still a consideration- I like Yupo and well as Touch</p>
  html_clean: <p>This is the business card for my studio Alchion Design Lab (formerly Design Alchemy). Fonts used are Wedding Sans (modified) and Normetica (modified). I did a set of old style numerals based on Wedding Sans, as well as new @ symbol based on my logo+ a few alternate characters. <br>Color-Orange will be custom mix of flourecent and standard orange, this will be more vibrant that straight orange but not quite flourecent (I have not done this type of tweak in orange yet, but it worked well last time I did this type of mix in yellow.  <br>Paper is still a consideration- I like Yupo and well as Touch</p>
