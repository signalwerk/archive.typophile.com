    date_raw: 13 Apr 2005 — 7:47pm
    votes: null
    html: <p>I think the line would work if you made it entirely vertical.  <br> <br>I went to your website and I expected it to be more of the style of your card. Your card has a very clean tech feel and the website has so much going on with no definitive logo. I would make your card look more like your website with type going vertically and horizontaly, or make your website look like your card (which I would prefer to see) with a clean style. I know you aren't finished with it yet, but I just wanted to throw that out. <br> <br>One more thing- I see what you are doing with the corners of your card, making them the same shape that is in your logo. I think it may come off the viewers like the printer did a poor job of rounding the corners instead of noticing it has the same edges as the icon. I would just round them off. It will be cheaper also.</p>
    html_clean: <p>I think the line would work if you made it entirely vertical.  <br> <br>I went to your website and I expected it to be more of the style of your card. Your card has a very clean tech feel and the website has so much going on with no definitive logo. I would make your card look more like your website with type going vertically and horizontaly, or make your website look like your card (which I would prefer to see) with a clean style. I know you aren't finished with it yet, but I just wanted to throw that out. <br> <br>One more thing- I see what you are doing with the corners of your card, making them the same shape that is in your logo. I think it may come off the viewers like the printer did a poor job of rounding the corners instead of noticing it has the same edges as the icon. I would just round them off. It will be cheaper also.</p>
