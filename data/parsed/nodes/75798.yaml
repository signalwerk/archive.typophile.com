      <p>Alec... the classification may lead you in many directions and there are not many true fonts listed on the standard sites, but look up Rotunda.</p>
      <p>Most of the foundries would not know it if bit them in the ass, they classify many of them wrong, so do some research. You may end up finding reference that you can use or "old" fonts that would help you draw/extrapolate your own.</p>
