  html: |-
    <p>Hi typophiles, Block02 is the new experimental fontface by BlueTypo inspired in patterns and dotted typography, performs well in large sizes. The principal function is decorative.<br>
    This font is optimized for Flash and it is best displayed at a font-size of 32.</p>
    <p>download:<br>
    <a href="http://fontstruct.fontshop.com/fontstructions/show/210018" title="http://fontstruct.fontshop.com/fontstructions/show/210018">http://fontstruct.fontshop.com/fontstructions/show/210018</a></p>
