    html: |-
      <p>Many well-known typographers and type designers live on the gulf islands, so much that they have been nicknamed the “Typographic Archipelago.” John Hudson is on Gabriola Island, Ross Mills and Shelley Gruendler on Galliano Island, Marian Bantjes on Bowen Island, and Robert Bringhurst on Quadra Island.</p>
      <p>Vancouver is quite a ways from Victoria, btw. What with needing to wait for the ferry, it is nearly a three hour trip all told, although only half of that is ferry transit time per se. Seattle with its faster catamaran service, right from downtown, combined with minimal wait times, is effectively nearly as close.</p>
