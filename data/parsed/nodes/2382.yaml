  html: <p>I've heard on and off that zero-width glyphs cause problems here and there, but I don't remember ever seeing a broad answer about it. I know that some people give such glyphs (like the stand-alone floating accents) a minimal width (like 2 ems?) to avoid any issues, but in a pixelfont for example this wouldn't work well. Does TT hinting provide any avenue? <br> <br>Any insights at all appreciated. <br> <br>hhp <br></p>
