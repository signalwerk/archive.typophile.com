    date: 2003-12-12T14:41:00
    date_raw: 12 Dec 2003 — 2:41pm
    votes: null
    html: <p>I'm not sure what you're building, but be careful if you're doing anything involving color overlaying of characters -- I once built a zero-width font to create flag icons for an multi-language magazine, to facilitate pasting the icons within a QXP text flow. Each flag was 3 or 4 characters, with each character a different color of the flag. We tested it for film output on a Scitex RIP with no problem, but when we changed pre-press houses at the last minute, the new place couldn't get them to output as anything but 4-color black squares on their Linotype RIP. They had to do some sort of mystery trapping magic (that I was not privy to) to fool the machine. </p>
    html_clean: <p>I'm not sure what you're building, but be careful if you're doing anything involving color overlaying of characters -- I once built a zero-width font to create flag icons for an multi-language magazine, to facilitate pasting the icons within a QXP text flow. Each flag was 3 or 4 characters, with each character a different color of the flag. We tested it for film output on a Scitex RIP with no problem, but when we changed pre-press houses at the last minute, the new place couldn't get them to output as anything but 4-color black squares on their Linotype RIP. They had to do some sort of mystery trapping magic (that I was not privy to) to fool the machine. </p>
  - id: 19300
    user: 1250
    date: 2003-12-12T21:02:00
    date_raw: 12 Dec 2003 — 9:02pm
    votes: null
    html: <p>It makes sense to make them [near-]zero-width because you can then place them -left aligned- on any other character. Sometimes that results badly (like on a dotless-i), but it seems like the best default scheme, no? Unless there's special code somewhere to ignore the metrics and render the accent centered/spanning the middle of the base character? I know keyboards have "deadable" characters that only render out in combinations of base+accent, but I think that's only a keying thing, not encoding. <br> <br>Patrick, I wonder if kerning pairs (between non-zero-width glyphs) would help. <br> <br>hhp <br></p>
    html_clean: <p>It makes sense to make them [near-]zero-width because you can then place them -left aligned- on any other character. Sometimes that results badly (like on a dotless-i), but it seems like the best default scheme, no? Unless there's special code somewhere to ignore the metrics and render the accent centered/spanning the middle of the base character? I know keyboards have "deadable" characters that only render out in combinations of base+accent, but I think that's only a keying thing, not encoding. <br> <br>Patrick, I wonder if kerning pairs (between non-zero-width glyphs) would help. <br> <br>hhp <br></p>
  - id: 19301
    user: 1026
    date: 2003-12-13T10:59:00
    date_raw: 13 Dec 2003 — 10:59am
    votes: null
    html: <p>Would it be possible to make your dicritics one pixel wide, and kern them -1 pixel with every glyph in the font? I imagine that'd be a breeze with class-based kerning in FL. That's not a very elegant solution, but in effect you'd have zero-width characters.</p>
