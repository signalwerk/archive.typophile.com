    html: |-
      <p>Here is a link to <a href="http://www.myfonts.com/fonts/fontbureau/hightower/" target="new">Hightower</a> at MyFonts where you can test drive to match the sample.</p>
      <p>(I ID’d it using the <a href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" target="new">Serif Font ID Guide</a>. The ‘a’ is the fourth type, so is the ‘y’ and the ‘R’, and then you look for the R in the 53 fonts that will show as matches for those three letters)</p>
      <p>- Mike Yanega</p>
