    html: "<p><i>Take a look at the crossbar of the e in the word 'ampersand' for example, there is a loss of both focus and contrast.</i> <br> <br>Yes, this is because the FontFocus technique really works in the x direction. The issue with the crossbar of the 'e' is that it always perfectly preserves the vertical proportions of the original glyph. Hinting-based techniques will increase or decrease the counter size to get better grid alignment. <br> <br>Whether this is a good thing or a bad thing seems to me a judgement call. Obviously, if the overriding goal is maximal contrast, then you want hinting. On the other hand, hinting loses things such as consistency between sizes. Note that the space between the two monocles of the 'g' is considerably larger in the nominal 11pt Consolia than either the nominal 12 or nominal 9. <br> <br>hrant: Yes, 100 dpi is universal on desktops, and resolutions higher than 130 dpi or so are rare even on laptops. Over the long term, I think it's inevitable that mainstream displays will reach 200 dpi. It all depends on whether you're trying to solve immediate problems or design for the future; I tend to do more of the latter in my own work, but there's a lot to be said for making users happy now.</p>"
