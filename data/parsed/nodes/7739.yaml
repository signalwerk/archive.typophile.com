    html: <p>I think I'll try Firefox soon. <br> <br>&gt; This simple setting (that needs to be set <br>&gt; separately for each encoding) makes Firefox <br>&gt; automatically enlarge all type that is smaller <br>&gt; than the defined threshold. <br> <br>Does it propagate the font size increase to the other/larger sizes, or does it just truncate up the bottom end? If it's the latter, that can disrupt proper information hierarchy through size (although that's admittedly not as bad as illegibility). <br> <br>&gt; ClearType definitely remains OFF on my machine. <br> <br>It's interesting to hear that from such a "progressive" user. But I trust your judgment. <br> <br>&gt; What I'm really missing now is a well-done <br>&gt; superhinted monospaced font that renders in <br>&gt; two-pixel stems in the common screen sizes <br>&gt; in the regular cut, and in three or four-pixel <br>&gt; stems in the bold. <br> <br>Would you settle for a pixelfont? You'd have to switch fonts with size however. How does Mana-16 look on your screen? It's not monospaced though. <br> <br>BTW, don't the existing MS core fonts render with 2-pixel stems at your "ideal" size of 18? Oh, they do, but they become anti-aliased... What if you fooled with GASP tables to switch off anti-aliasing? <br> <br>hhp</p>
