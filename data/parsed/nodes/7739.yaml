    html: "<p>So Vincent, I guess the colorful fur doesn't bother you? <br> <br>Adam, very useful feedback - thank you. <br> <br>The semi-serif thing is coming from the need to make some letters fill the width while others are wide enough (or too wide, like the \"m\"). As far as I can tell virtually all mono fonts have this to some extent, usually on the \"i\" and \"el\". The thing is, when you have too few of them, they make the font less harmonious. That and the need to fill the space make me think that more serifs (often just half-serifs) can help. <br> <br>Here's a fake code setting I'd love to hear comments on: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/54374.gif\" alt=\"Coda14R\"> <br> <br>It's 14 pixels tall (lc). I think it would be the Regular weight, and would get both lighter and darker companions. I can make a 12, but I don't think I should go below that. If I made a 16 (one pixel shorter than the font in Adam's screen grab) I would probably need to increase the width from 9 to 11, or 12. <br> <br>hhp</p>"
