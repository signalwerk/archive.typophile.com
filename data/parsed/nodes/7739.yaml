    html: "<p>Cool comparison! Thanks. <br> <br>So you're saying that your bottom sample <i>does</i> use y-direction a-a, but cannot yet do that in conjunction with subpixel <i>positioning</i>, right? (This is getting complicated...) <br> <br>Speaking of cascading :-) here are two resultant questions: <br>1) Do you know why they're only turning on the y-direction now and not since the beginning? <br>2) To get basically vertical, non-subpixel [rendering] of a-a in a non-y-enabled engine, why not render a 3x2 grid per pixel (instead of a 3x1), and then: do your CT magic in the x direction; but sample it down to grays (in the \"normal\" a-a way) in the y direction? Performance? Wait a second: I think I might have just described what y-enabling basically is! And maybe if it is a performance issue they were waiting for computers to get fast enough... <br> <br>-- <br> <br>&gt; the resolution of your display is simply too small. <br> <br>1) Yes, but it's also typical of users. <br>2) For some reason those smaller-size samples you once posted didn't suffer from this. Also: CT doesn't suffer from it, neither does the (more-blurry) MacOS rendering, and in fact I think neither the full-fuzz stuff (like Photoshop). That's why I was saying there seem to be \"flavors\" of blur; maybe it's due to some parts of your rendering being very crisp and others very blurry? <br> <br>hhp</p>"
