    html: <p>Correct. I have two apps that can show aspects of the new CT rendering for Longhorn, but neither can show all aspects together <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br><i>1) Do you know why they're only turning on the y-direction now and not since the beginning?</i> <br> <br>They hadn't worked out the math for the interaction of the CT colour rendering in the x-direction and the greyscale in the y-direction. They also hadn't figured out how best to apply it. Beat Stamm's first trials turned on the y-direction smoothing at all sizes but made it progressive. But eventually they decided that this should be design-specific, so should be controlled via an update to the gasp table. The latter has not been published yet. <br> <br> <br>Raph, I've afraid I also have problems with your FontFocus example, and my resolution is high (146 ppi). I'm not sure exactly what the problem is, but the symptom is a kind of sparkle. Take a look at the crossbar of the e in the word 'ampersand' for example, there is a loss of both focus and contrast. <br> <br>If you sent me your mailing address (to tiro[at]tiro.com) I will pass it along to Geraldine Wade at MS, who can send you a copy of <i>Now read this.</i> There will also be copies in London at Typotechnica in February, for those who didn't get them at ATypI.</p>
