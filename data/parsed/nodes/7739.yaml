    votes: null
    html: <p><i>On the other hand, once you resort to [some] blur and fringing, why would you still get malformed rendering in places, like the spine of the "S"/"s"? </i> <br> <br>I haven't thoroughly analyzed the new ClearType tech, but it seems to me that the rendering is not fundamentally based on traditional antialiasing. Rather, results seem to be consistent with rendering to a bitmap with 3x the horizontal resolution, then filtering the result to bring it to an RGB subpixeled image with the worst of the color fringing suppressed. <br> <br>If that's the case, then near-horizontal strokes will more closely resemble old-style monochrome TT rendering than Mac OSX-style grayscale. <br> <br>I'm not saying they really are going to a bitmap; from what I know of previous generations of the technology, it's most likely that they are going to an intermediate grayscale bitmap (with 3x the horizontal rez as mentioned above), then doing massive contrast enhancement along with the color-fringing filtering. If you read the CT patents, you'll find quite a bit of nonlinear filtering machinery that should be capable of these operations. <br> <br>The remaining trick, of course, is to tune everything, and supply the hints in the font files, so that it all looks good. I think MS and its stable of font designers have done that, thanks to their ability to invest massive amounts of time, energy, and money.</p>
