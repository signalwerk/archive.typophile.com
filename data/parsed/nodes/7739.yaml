    html: "<p>Sergej,  <br> <br>in my programming work, I often work in a column mode, where I can make rectangular selections in the text editor.  <br> <br>Example: when editing feature definition files, after having pasted some glyph names from Microsoft Excel, I want to be quickly able to type \"sub\" and \"by\" in the appropriate positions. Or, for example, type \".ss02\" at the end of some glyph names that are aligned in a column. See:  <br><a href=\"http://www.twardoch.com/tmp/dlig.png\" target=\"_blank\">http://www.twardoch.com/tmp/dlig.png</a> <br> <br>Programming often involves putting repeating or similar sequences in different arrangements. Your  eye needs to jump up and down often, when comparing, for example, two different function definitions. Just like the baseline gives an unified horizontal text structure in a normal reading process, monospace metrics provide a vertical visual aid. It's much easier to notice if a line is \"off by one\" or that you have mistyped some variable name if your text is aligned in monospace blocks.  <br> <br>As mentioned before, currently, for most of my monospace stuff I stick to Lucida Console which has the nice property of having quite short ascender and descender. This actually doesn't disturb me at all -- I can read it very easily despite minimal interline spacing. Kudos to Bigelow &amp; Holmes!  <br> <br>Regards,  <br>Adam</p>"
    html_clean: "<p>Sergej,  <br> <br>in my programming work, I often work in a column mode, where I can make rectangular selections in the text editor.  <br> <br>Example: when editing feature definition files, after having pasted some glyph names from Microsoft Excel, I want to be quickly able to type \"sub\" and \"by\" in the appropriate positions. Or, for example, type \".ss02\" at the end of some glyph names that are aligned in a column. See:  <br><a href=\"http://www.twardoch.com/tmp/dlig.png\" target=\"_blank\" class=\"link-external\">http://www.twardoch.com/tmp/dlig.png</a> <br> <br>Programming often involves putting repeating or similar sequences in different arrangements. Your  eye needs to jump up and down often, when comparing, for example, two different function definitions. Just like the baseline gives an unified horizontal text structure in a normal reading process, monospace metrics provide a vertical visual aid. It's much easier to notice if a line is \"off by one\" or that you have mistyped some variable name if your text is aligned in monospace blocks.  <br> <br>As mentioned before, currently, for most of my monospace stuff I stick to Lucida Console which has the nice property of having quite short ascender and descender. This actually doesn't disturb me at all -- I can read it very easily despite minimal interline spacing. Kudos to Bigelow &amp; Holmes!  <br> <br>Regards,  <br>Adam</p>"
