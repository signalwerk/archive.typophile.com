    votes: null
    html: "<p>On my 100dpi Powerbook I use a monospace font for almost all my writing: programming, e-mails, diary, conference write-ups and MyFonts newsletters. In programming I've always liked to have similar lines lining up exactly: array[i] should align perfectly with array[j] and array[k]. The visual tidiness is a reminder of their semantic similarity. In other types of writing, I like to notice stray spaces, lowercase l's, and periods as I type. This is made more difficult if the speed at which the cursor moves is not proportional to the typing speed. To a writer, the w is just as important as the i. When proof-reading too, I find errors easier to spot in monospace: I suppose the seductive wordshapes put me off. <br> <br>I use black-on-white Monaco 10 (1-pixel stems) for e-mail, where I spend a lot of time, white-on-black Bitstream Vera Bold 13 (2 pixels) for programming, and white-on-black Monaco 11 (1 pixel) for my Unix terminal. I should probably change the last one since the bold is synthesized and only legible in context (amazing how an m can be read easily even if it's a solid rectangle). <br> <br>What a shame that writing and typography have merged in today's applications, and that the perfection attained by WordPerfect 5.1 for writers will not return any time soon.</p>"
