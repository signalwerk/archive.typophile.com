    html: <p><i>...why would you still get malformed rendering in places, like the spine of the "S"/"s"?</i> <br> <br>Design. This version of ClearType applies font smoothing in the x-direction only, which means that shallow horizontal curves will still be visibly 'stepped'. This is often noticeable in S/s and in some forms of the letter a (e.g. Helvetica). In the Windows XP and earlier versions of ClearType, this was true of all sizes, which is why display-size type actually looks worse in CT than with traditional anti-aliasing, which smooths in both directions. The new version of ClearType, which will ship with Longhorn, applies greyscale anti-aliasing in the y-direction at sizes detemined by the designer in a new gasp table (see page 14 of <i>Now read this</i>). The CT test app I have which  can use sub-pixel positioning does not yet use the y-direction anti-aliasing, so I can't show this very well in text samples. <br> <br>Below is a cascade of ppem sizes for the Consolas S, the top line with the current CT rendering and the bottom with the new y-direction antialiasing activated. Note that the gasp table settings in this font are preliminary, and the final version may differ. Note also that this image uses up all 256 Gif colours, so may not provide total fidelity. <br> <br> <br><img src="http://www.typophile.com/forums/messages/30/54489.gif" alt="Consolas y-AA"></p>
