    html: |-
      <p>Claudio, I will some day start a text version for this, but I'm not planning on starting that endeavor right away. I guess it's good to start with a more exuberant cut like this and them tame it down to a text face.</p>
      <p>I also think it's a bit impossible to design the letters without working on spacing too. Roughly, the spacing I have here is the result of the designing of the Leters and balancing with the negative space.. But I'll go over it again of course.</p>
      <p>Ben, I wasn't thinking of those swashes, but I guess it could be an idea. It Would match the alternative J. But I'm not planning on making lot's of swashes :)</p>
      <p>Jan, Thanks for the input. Maybe the B has a bit of flaccid belly, I have to look into that. On the ornamented six, I was planning to use the spiral on the upper part, maybe it will work better.</p>
      <p>And yes, there will be a long tail Q, of course. :)</p>
