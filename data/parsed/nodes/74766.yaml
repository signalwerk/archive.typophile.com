      <p>Apologies for the errors, here go the corrections:<br>
      Philips - you're right the contours are not merged yet. Normaly I merge these kind of intersections only at the end.<br>
      Meanwhile here goes a zoom on a numeral.</p>
      <p>About that 'flowing' feel on the italics, that is actually something I'm trying to achieve. I think I will call it Cursive instead of Italic.<br>
      It turned into quite a separate font, I guess. The letters are a bit more calligraphic, the angle is very different, and the barbs and some serifs turned into more organic terminations. Here goes an example of the "G".</p><div class="imageWrap"><img src="http://typophile.com/files/G_3951.jpg"></div><p></p>
