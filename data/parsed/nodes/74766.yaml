  html: |-
    <p>Hello guys, this is a display font i've been working on for some time. I' am now getting close to finish. Its a two weight family with regular and italic (more cursive perhaps). This a sample of the regular weight.</p>
    <p>it will be a somehow playful font with a fair range of ligatures and ornaments, and a set of ornamental figures.<br>
    It's called Aria in reference to its musical mood.</p>
    <p>Could guys tell me what you think? Anything you would fix or change. Any thought please.</p><div class="imageWrap"><img src="http://typophile.com/files/aria_2_6329.jpg"></div><p></p>
