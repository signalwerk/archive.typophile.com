      <p>Speaking of hitting what you're not aiming for, Wernher von Braun was the architect of Hitler's V-2 rocket, but after the war he became high-profile NASA scientist. When he was lionized in the 1960 biographical film <em>I Aim at the Stars</em>, satirist Mort Sahl suggested the subtitle <em>But Sometimes I Hit London</em>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/I_Aim_at_the_Stars_poster_3666.jpg"></div><p></p>
