    <p>In <em>Matrix</em> 8, "How Far the Abracadabra", Philip Gallo writes:</p>
    <p>"I once heard that Ed Benguiat, when questioned what prompted ITC Benguiat, said, 'I was shooting for Times Roman'." </p>
    <p>Is there any other source for this, or is it strictly apocryphal?</p>
