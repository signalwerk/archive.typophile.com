      <p>According to the <em> Glossary of Typesetting Terms</em> (by Richard Eckersley, Richard Angstadt, Charles M. Ellertson, Richard Hendel, Naomi B. Pascal, Anita Walker Scott. Chicago: University of Chicago Press, 1994), these are called <em>logotypes</em>: </p>
      <p><img src="http://books.google.com/books?id=oeTnynRiN8AC&amp;pg=PA63&amp;img=1&amp;zoom=3&amp;hl=en&amp;ots=luJLnJZ2yr&amp;sig=ACfU3U2owDFQmTLs0J37mfvTIzs58a1tYA&amp;w=1280" width="600" height="933" border="2"></p>
      <p>Not many [display] fonts have them. Of the more recent designs <a href="http://www.terminaldesign.com/customfonts/nowplaying/" rel="nofollow">Now Playing</a> (by James Montalbano; Terminal Design) comes to mind first. Its font complement includes the <a href="https://www.terminaldesign.com/wp-content/uploads/2014/01/nowplaying.pdf" rel="nofollow">logotypes</a> AND, AT, AVEC, CON, THE, and WITH.</p>
    html_clean: |-
