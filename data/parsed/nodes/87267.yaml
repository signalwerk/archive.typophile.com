    <p>In a perfect world I'd have gorgeous handwriting and could use my actual signature for my business logo. But it isn't, and I don't, so I can't. That said, I'm looking for a typeface with a handwritten feel that's airy (but not too thin-- medium weight would be ideal) and cheerful but not childish. I've spent hours digging through MyFonts.com but I haven't come up with something that's quite what I'm after. </p>
    <p><a href="http://www.ajw-design.net" rel="nofollow">Here's</a> an example of my current logo. I don't hate it, but my biggest problem with that typeface is the long descender on the J-- it's a pain to design around, so I'm looking for something with a descender that's shorter or on more of an angle. I get the feeling that might be a tall order, though. Curse my inconvenient initials!</p>
    <p>Thanks in advance.</p>
