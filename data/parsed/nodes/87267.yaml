      <p>@joshua After a few dozen iterations of this logo, I'm starting to agree that I'll have to hire a lettering artist. When I did my first version of the logo long ago I did indeed attempt to draw/trace my own signature, but it didn't go well simply because my handwriting does not a good logo make. It so happens that a friend of mine does lettering and she offered to work with me when I mentioned my difficulties, so I'm hoping I'll finally have a version of my logo I actually like!</p>
      <p>@JamesM Thanks! I almost used Sugar Pie, but it was a little too cartoony. Though it suits <a href="http://www.ajw-art.com" rel="nofollow">my illustration style</a>, I'm going for a look that's fun but still professional. I wish I could think of a good example. As Joshua suggested, I'm near the point where I'll have to contract this out.</p>
