      <p>You really need to do custom lettering for this. If anyone can buy the same font as you and duplicate it just by typing your initials, it's not really a logo, is it? Try sketching what you want and then tracing over it in Illustrator. Or, outline a font that's close and adjust the outlines. Or, use a digital tablet to draw the lettering. Or, hire a lettering artist to work with you.</p>
      <p>Good luck!</p>
