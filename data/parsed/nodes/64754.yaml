      <p>Still very charming, from a designers perspective i appreciate the hand-drawn, it's a personal preference.<br>
      Although there's one thing that the hand-drawn version does better than the latest—the balance of negative space around the inside perimeter of the olive to the logotype. it sits more comfortably inside. the latest version has a bit too much visual tension around the tops of serifs in the "H".</p>
      <p>However, i still feel that the "tagline" is too small in comparison to the mark. When the mark is reduced (used small) the "tagline" appears diminutive and unimportant. </p>
      <p>Is it a tagline or part of the name?<br>
      i feel it's less of a tagline and more as part of the name. For example, i think of fedex's tagline. It was; "when it absolutely positively has to be there overnight". If you look at Fedex truck today, you'll see the logo with Fedex Ground, Fedex Home Delivery, Fedex Freight, etc.</p><div class="imageWrap"><img src="http://typophile.com/files/fedex-logo-1_4939.jpg"></div><p></p>
      <p>all said, i really like the logo and the name. i hope the service will be as good as the mark portrays it to be :)<br>
      M</p>
