    html: |-
      <p>Does it really need the qualifier; "events and occasion" locked up to the logo?<br>
      Can it be known by context and used separately to get the idea across? For example, the "events and occasions" copy could be part of the description in an ad, or even the first line of information in the address block on a business card. The thought is, you're going to be in a marketplace that your market will know what you do — people know if you go to restaurant you can order food, one doesn't have to advertise "food sold here."</p>
      <p>If you do decide to keep the copy with the logo, the copy "events and occasion" as it stands now, locked up to the logo, may be too small for reduction. You may want to try it on a business card to see how it works. Also, if they plan on embroidery, the smaller type may not render nicely.</p>
      <p>By the way, still a big fan of the hand rendered drawings you posted months ago.<br>
      Nice work:)</p>
