  html: <p>Just thought I'd warn you all to bring bug repellent with you or buy it when you get here.  I walked to the bus stop this morning (a route that takes me right past the convention center) and got bit at least four times by mosquitoes.  They're not usually too bad in downtown, but I just wanted to warn all of you.  :-)</p>
