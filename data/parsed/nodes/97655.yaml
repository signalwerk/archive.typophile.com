      <p>Apple ordered to re-write 'inaccurate' Samsung statement</p>
      <p>Apple has 48 hours to re-write a statement on its website relating to its design rights dispute with Samsung, UK judges have ruled.</p>
      <p>Apple was forced on 18 October to publish a message making it clear that Samsung had not infringed the iPad's registered design.</p>
      <p>However Samsung complained the statement Apple had posted did not comply with the court order.</p>
      <p>Judges agreed and have told Apple it must be removed within 24 hours.</p>
      <p>A new, compliant version must then be posted.</p>
      <p>Michael Beloff QC, representing Apple, told judges that the company had thought that it had complied with the court order.</p>
      <p>"It's not designed to punish," he said.</p>
      <p>"It's not designed to make us grovel. The only purpose must be to dispel commercial uncertainty."</p>
      <p>He asked that the company be given 14 days to post the replacement - but the request was firmly denied.</p>
      <p>Lord Justice Longmore told Mr Beloff: "We are just amazed that you cannot put the right notice up at the same time as you take the other one down."</p>
      <p>Sir Robin Jacob added: "I would like to see the head of Apple [Tim Cook] make an affidavit about why that is such a technical difficulty for the Apple company."</p>
      <p>Apple told the BBC it did not want to comment further.<br>
      'Horse's mouth'</p>
      <p>Samsung complained that the notice posted by Apple was "inaccurate and misleading" because it added comments about other rulings in Germany and the US that had gone in the iPad-maker's favour.</p>
      <p>"This has received enormous publicity and has perpetuated confusion as to Samsung's entitlement to market the Galaxy tablet computers in issue," a Samsung lawyer said in a written statement to judges.</p>
      <p>"It has created the impression that the UK court is out of step with other courts."</p>
      <p>The UK's ruling applies to the whole of the EU.<br>
      Samsung Galaxy Tab 10 A UK judge said Samsung's product was not as "cool" as the iPad, and would not be mistaken for it</p>
      <p>The court order is the latest twist in an ongoing legal saga involving the two companies.</p>
      <p>Apple brought the case to the UK courts, alleging that Samsung's Galaxy Tab 10 had infringed the design of its iPad.</p>
      <p>But in July, Judge Colin Birss disagreed on the grounds that Samsung's product was not as "cool".</p>
      <p>His ruling meant that Apple was denied the opportunity to impose a sales ban on Samsung's products.</p>
      <p>Apple was unsuccessful in appealing the ruling, and was ordered to place a notice on its website, newspapers and magazines explaining that Samsung had not infringed its designs.</p>
      <p>The intention, judges said, was not to make Apple "grovel", but to remove "commercial uncertainty" surrounding Samsung's products.</p>
      <p>"A consumer might well think: 'I had better not buy a Samsung - maybe it's illegal and if I buy one it may not be supported'," Sir Robin said.</p>
      <p>"Apple itself must (having created the confusion) make the position clear: that it acknowledges that the court has decided that that these Samsung products do not infringe its registered design.</p>
      <p>"The acknowledgement must come from the horse's mouth."</p>
      <p>from <a href="http://www.bbc.co.uk/news/technology-20165664" title="http://www.bbc.co.uk/news/technology-20165664">http://www.bbc.co.uk/news/technology-20165664</a></p>
