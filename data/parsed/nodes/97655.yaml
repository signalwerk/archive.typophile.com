      <p>I'm getting way off topic here, but the "Paul [McCartney] is dead" rumor was based in part on the Abby Road cover, in which Paul was barefoot and out of step with the others, and some viewed it as a symbolic funeral procession. I recently saw a link to some outtakes from that photo session which I thought were interesting.</p>
