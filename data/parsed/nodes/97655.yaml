  html: |-
    <p>There's been a major change in Apple leadership, and conceivably it could affect Apple's use of fonts down the road.  </p>
    <p>Senior vice President Scott Forstall, who many thought might be the next CEO when Tim Cook eventually retires, has lost his job. The Apple press release puts it more delicately — "Scott Forstall will be leaving Apple next year and will serve as an advisor to CEO Tim Cook in the interim" — but his duties have been reassigned to other vice-presidents and it's likely that he's being kept on for a few months as "an advisor" just for contractual reasons.</p>
    <p>Forstall was senior vice president of iOS Software, and his duties included overseeing software interfaces.  Jonathan  Ive (Apple's senior designer) will now be in charge of interface design. It's been previously known that Ive and Forstall had very different views on interface design.</p>
    <p>Time will tell if Ive makes any typeface-related changes now that he's in charge.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Scott-Forstall_4614.jpg"></div><p></p>
