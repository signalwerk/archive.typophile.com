    <p>Yesterday, during an ophthalmological exam, I learned that I had an incipient cataract on my left lens. It wasn't visible through the usual instruments, but could be detected empirically by shining very bright light to the retina, after which I could achieve 20/20 vision. Without the light, the eye could only be corrected to 20-30. Lens replacement surgery can correct the problem, but nowadays there are a number of choices of lenses, with at least four types used widely in the U.S., one of which was approved as recently as last year. </p>
    <p>As a community of type designers and typographers, we all make similar demands on our eyes. I wonder if any you have had recent experiences of this kind and might have advice you're willing to share. I should add that my eyes are in general good health, the only quirk being a shifting astigmatism in the left eye. </p>
    <p>With best wishes to you all,<br>
    Scott</p>
