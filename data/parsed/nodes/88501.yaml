      <p>I've known several people who've had cataract surgery and it went well in each case. It's a pretty routine procedure these days. The surgery only takes about 25 minutes and they don't even need to put you to sleep, they just give you medication to put you in a state of deep relaxation, and you go home a few hours later.</p>
      <p>Be aware that if your cataract is so slight that it currently doesn't create a serious problem, your insurance may not cover it yet. It may be necessary to wait until it progresses a bit further.</p>
      <p>And speaking as someone who has two doctors in the family, my general advice is to rely on the advice of medical professionals regarding choice of lenses and so forth. Make sure you've got a good doctor, of course, get a 2nd opinion, and do some research in respected medical journals if you wish.</p>
