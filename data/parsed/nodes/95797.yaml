  html: <p>Unfortunately it's a photo of a photocopy, but hope someone can help identify this splendid Modern italic from Rome, 1911. Found in the <cite>Catalogo dei punzoni e delle matrici orientali e latini</cite> from the Tipografia Poliglotta Vaticana.</p><div class="imageWrap"><img src="http://typophile.com/files/italic_4135.jpg"></div><p></p>
