    html: <p>It is very reminiscent of <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/madison-antiqua/pro-italic/glyphs.html" rel="nofollow">Madison Antiqua</a>, which, according to Jaspert, Berry and Johnson's Encyclopedia, was originally called Amts-Antiqua, and issued in 1909 by Stempel. It also says the typeface was redesigned in 1965, maybe that's when the descender of the lc f was cut off at the baseline etc.</p>
    html_clean: <p>It is very reminiscent of <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/linotype/madison-antiqua/pro-italic/glyphs.html" rel="nofollow">Madison Antiqua</a>, which, according to Jaspert, Berry and Johnson's Encyclopedia, was originally called Amts-Antiqua, and issued in 1909 by Stempel. It also says the typeface was redesigned in 1965, maybe that's when the descender of the lc f was cut off at the baseline etc.</p>
