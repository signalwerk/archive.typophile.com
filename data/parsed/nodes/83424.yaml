  html: |-
    <p>I originally posted the sample on the <a class="freelinking external" href="http://typophile.com/node/83405" rel="nofollow">ID Board</a> and got a 'similar' hit with Xctasy Sans. The file is a first attempt and I'd like some opinions on:</p>
    <ul>
    <li><strong>Size: </strong>I started in Illustrator with the sample as a template but when I brought the characters into FontLab--even though I resized them by 600% to be almost 42 pt.--they're still a fraction of the default background shapes. What should I shoot for point size-wise?</li>
    <li><strong>Case/Alternates: </strong>Probably more of a personal preference but I'm not sure I'd like to see a l/c with this. Instead, I like the idea of alternates but unsure of where to place them on the char map in FontLab...?</li>
    <li><strong>Shape: </strong><br>
    -Unsure about the top-heavy B<br>
    -Is the top of the Z too short?<br>
    -I think the X cross either too high or too narrow<br>
    -I would prefer 'K' similar to X &amp; Y (a higher horizontal center)<br>
    -Should V &amp; W follow suit with the rounded N &amp; M?</li>
    </ul>
    <p>Thank you for your input!</p>
    <p>Wanda.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DecoFace_4533.jpg"></div><p></p>
