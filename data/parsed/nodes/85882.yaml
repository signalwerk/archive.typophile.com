  html: |-
    <p>This cover of the 32nd annual Best of News Design book was designed by Adonis Durado, design director of the Times of Oman &amp; Al Shabiba in Muscat, Oman.</p>
    <p>As he explains in <a class="freelinking external" href="http://www.snd.org/2011/09/meet-the-man-behind-the-cover/" rel="nofollow">this article</a>, Durado used Whitman (designed by Kent Lew) as the main text, and chose Ingeborg Block (by Michael Hochleitner) for the nameplate.</p>
    <p>No photos, just typography on this cover. I think it looks great. Anyone care to discuss the design and typography of this cover?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SND32-cover_4426.png"></div><p></p>
