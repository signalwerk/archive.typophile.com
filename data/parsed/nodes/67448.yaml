      <blockquote><p>Monika Italic is a direct knock-off</p></blockquote>
      <p>It's not. </p>
      <p>Both are different in lot's of the small details. And both seem to be independent revivals of an alphabet first published in "Script and Manuscript Lettering", published by the Higgins Ink Company in 1944.<br>
      <a href="http://www.tiendadelweb.com/121073846013P-script-and-manuscript-lettering-higgins-ink-co-brooklyn-ny-36-pages-1946" title="http://www.tiendadelweb.com/121073846013P-script-and-manuscript-lettering-higgins-ink-co-brooklyn-ny-36-pages-1946">http://www.tiendadelweb.com/121073846013P-script-and-manuscript-letterin...</a></p>
      <p>The same set of alphabets, in a much bigger reproduction, was also featured in Architectural Lettering for Plans and Ornamental design. by Arthur E. Burke. 1953<br>
      <a href="http://openlibrary.org/books/OL6130009M/Architectural_lettering_for_plans_and_ornamental_design" title="http://openlibrary.org/books/OL6130009M/Architectural_lettering_for_plans_and_ornamental_design">http://openlibrary.org/books/OL6130009M/Architectural_lettering_for_plan...</a></p>
      <p>There is no reason to remove the link to Monika Italic</p>
