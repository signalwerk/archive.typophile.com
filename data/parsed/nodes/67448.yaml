      <p>Jajaja.. lol.... I'm not defending anyone in particular. Just contributing some facts when I think I have some evidence.</p>
      <p>Here is one you will like: Saginaw is a commercial TreacyFaces font<br>
      <a href="http://www.treacyfaces.com/050806_TFSaginaw_2c5a.html" title="http://www.treacyfaces.com/050806_TFSaginaw_2c5a.html">http://www.treacyfaces.com/050806_TFSaginaw_2c5a.html</a><br>
      The light weight is awesome, and true to the original (See the image at the bottom of the TreacyFaces page).<br>
      The bold, instead, is ugly and has lost all the charm.</p>
      <p>It was digitized from The Headliners New York, Inc., a hand lettering artist company that also created a few phototype fonts, but went out of business pretty soon.</p>
      <p>It was a style of hand lettering typically used for Cars advertising, in particular Pontiac cars, from 1955 to 1957, like this vintage ad:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/pontiac_3449.png"></div><p></p>
