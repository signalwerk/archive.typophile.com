    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hideko_typofile_4784.png"></div><br>
    Hideko is a visually unique font that has the essence of both serif and san-serif fonts through integrating the body structure of san-serif while retaining the calligraphy from serif. Hideko was inspired by synthesizing Japanese calligraphy and western letters. During the process of creating Hideko, I attempted to make a font only for oriental use, but the result is a font with versatile uses. This multicultural font is most effectively used for oriental restaurants but is also ideal for western cafes, posters, books, etc. Along with the cultural synthesis of Japanese and western letters, Hideko features various ligatures, stylistic alternates, fractions, and languages as well.<br>
    Hideko is available at <a href="http://new.myfonts.com/fonts/khaito-gengo/hideko/" title="http://new.myfonts.com/fonts/khaito-gengo/hideko/">http://new.myfonts.com/fonts/khaito-gengo/hideko/</a><p></p>
