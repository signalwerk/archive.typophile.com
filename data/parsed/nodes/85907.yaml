      <p>There is a tradition of brush lettering in the West, and typefaces derived from such lettering.<br>
      Maiandra and Baker Signet come to mind. Recently, Capucine.<br>
      Western "brush" types suggestive of Eastern culture: Papyrus, Hiroshige.<br>
      Auriol was made in France at a time when there was a Japanese influence on art there, and, with its disconnected strokes, has more of the look of Japan—at least, the clichéd national image that exists in the West.</p>
      <p>Although this face doesn't overtly signify Japan, which would be unfortunate anyway, it could certainly be used for things Asian, and it would be good for "organic" uses too.</p>
