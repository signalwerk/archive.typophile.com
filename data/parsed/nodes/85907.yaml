      <p>Yes, Nick, I was about to say this would be a nice substitute for Maiandra, which may be a bit overused. Very legible for text, informal, graceful, just different enough to attract a closer look at the piece.</p>
      <p>I had a customer who unfortunately considered Comic Sans(!) her "friendly signature font." With difficulty, I persuaded her to accept Maiandra for her trifold business advertisement (a Bed &amp; Breakfast). Hideko would've worked well. Like you, I don't see it as particularly Asian.</p>
