      <p>Thank you for the comments both of you. and yes, I actually agree with you guys about Hideko does not signify Japan well. I am from Japan, and I've been writing Japanese for more than 20 years, and I applied the stroke of Japanese letter, and especially at the end of the stroke. but when I made the font it has lack of legibility... so I took in more part of western letters in order to keep legibility.<br>
      maybe I should make true Japanized english word with Japanese calligraphy brush. Do you guys think it'll be demand for that kind font?</p>
