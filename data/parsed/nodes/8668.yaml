    html: <p>i'll let others pipe in with a more technical critique, but i just have to say that i love the feeling of "spontenaiety." I think it goes very well with your meaning of "in the wind." <br>I think you have a fairly good feel for your thicks and thins, just take a look at your letters and try to make sure that they have a (somewhat) consitent axis concerning your thicks and thins. Also it seems to me that the "Dans le" part is plenty heavy while the "vent" part is a bit lighter. However, I think i like the "vent" better than what precedes it. Anyhow, enough of my rambling... G'luck with it! Oh and perhaps you might want to duplicate your above post to the "Logos Critique" section, there are some great eyes that haunt that section, dunno if they'll find your posting here.</p>
