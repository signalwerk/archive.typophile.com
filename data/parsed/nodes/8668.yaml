      <p>Here is an update, <br> <br>I wasn't sure at first about Paul's comment for thinning but after messing with it, I was more convinced. I think it will help improve legibility at small sizes which is nice. I worked on thinning the letters and getting more uniformity with my thick and thins, baseline and heights. I also tried to change the s a bit so it wouldn't look like a "y" (got the comment from 2 people now). <br> <br>I know this needs more work, any other pointers would be very appreciated <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><img src="http://www.typophile.com/forums/messages/29/63040.jpg" alt="Dans le vent signature"></p>
