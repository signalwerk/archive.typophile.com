      <p>Typography aside, I'd worry that at that small size, the ink will bleed over time and you'll be left with an illegible blur. I've only got limited tattoo experience, though, so talk to your artist about it.<br>
      Don't bother with serifs at that size. I'm not sure how much detail you'll be able to get. Maybe Futura would work, though I'm not sure that jives with the verse you've picked. I'll let others add further to the discussion.</p>
