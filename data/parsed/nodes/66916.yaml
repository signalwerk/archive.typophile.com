    <p>I was hoping that you guys could help me out. I am by no means a typographer of any sort, so I was hoping to get your help. I would like to get the following verse in a tattoo on my right calf, and was hoping I could get your opinions on fonts, spacing, kerning and all that good stuff.</p>
    <p>"Though I walk through the valley of the shadow of death, I will fear no evil, for you are with me; your rod and your staff, they comfort me."</p>
    <p>That is the verse I was planning on, and I was hoping to run it just under half way around my calf and then rap to the next line, so I'm guessing it would have to be about 16pt, hoping for no longer than 3 lines long... I don't know if this would be adequate information.. That would make the width about 3.5 to 4 inches across..</p>
    <p>Again, I don't know if this info makes sense... Think any of you could help me out?</p>
