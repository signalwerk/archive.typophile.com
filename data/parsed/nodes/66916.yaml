      <p>The most important thing is to find a tattooist who knows what they're doing, and if possible one who is specialized in letters/text.<br>
      The second most important thing is not to make it too small. Blurring is definitely a factor, as is stretching, depending on location/exposure etc.</p>
      <p>Hrant, the spiral idea is very good! I've been thinking about getting something like that.</p>
      <p>BTW, some nice (and some less nice) text based tattoos here:<br>
