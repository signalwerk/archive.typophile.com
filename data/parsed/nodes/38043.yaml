    <p>I'm fascinated by professions that rely on both mathematical, technological skill (like Bézier curves) plus creativity and imagination. </p>
    <p>This test proved interesting to me, and I'm curious what other typophiles see? (I'll post my results later, I don't want to skew your impressions.)</p>
    <p>The Right Brain vs Left Brain Test<br>
    Do you see the dancer turning clockwise or counter-clockwise?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dancer_4783.gif"></div><p></p>
    <p>If clockwise, then you use more right side of the brain.<br>
    If counter-clockwise, then you use more left side of the brain.<br>
    <a href="http://www.news.com.au/dailytelegraph/story/0,22049,22535838-5012895,00.html" rel="nofollow">More details about the right and left brain activities can be found here.</a></p>
