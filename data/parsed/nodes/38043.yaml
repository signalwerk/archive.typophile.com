    html: |-
      <p>Well, the ambiguity is akin to the Necker Cube illusion: A silhouette with no depth cues makes front and back indistinguishable. </p>
      <p>I am highly skeptical of the claim that it tests left- or right-brained thinking, because  the whole idea of left-brained or right-brained people comes from a gross oversimplification of neuroscience.</p>
      <p>I had to struggle for several minutes to see counterclockwise motion, because there are a number of depth cues present that favor clockwise: the circles that the figure's hand and foot trace in the air are seen from slightly above, and she spends more time facing toward you than away from you, just as a real dancer usually would when pirouetting for an audience. So clockwise is more aesthetic, but also more logical. Interpreted as counterclockwise, the spinning figure is seen from slightly below, and therefore does not appear to be perpendicular to the floor (which we are certainly seeing from above or there would be no reflection), but tilting backwards, and so the motion does not look as much like natural human motion following the laws of physics as the clockwise view does.</p>
