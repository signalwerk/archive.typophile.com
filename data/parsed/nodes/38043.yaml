    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bild1_3786.png"></div><p></p>
      <p>If you look at a single frame of the animation you can easily see her turned away or looking towards you. Whatever you choose to see. Since every frame can be viewed in two ways it's up to you.<br>
      But within the animation the brain has to decide for one direction. Otherwise the change of the black figure would make no sense. It is a known fact that the brain, presented with a decision with two equal choices, will rather "invent" slight differences than make no decision at all. It's part of human's survival strategy.<br>
      The decision making in this case is somewhat "chaotic", this is why the results may be different each time you try. But when the brain has decided for one direction it usually sticks to that direction. Again: this is the only logical way to make sense of the animation.<br>
      The connection to brain sides makes a nice headline, but is not very plausible.</p>
    html_clean: |-
