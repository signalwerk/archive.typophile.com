    <p><strong>Linotype’s LinoLetter for December 2006 – Celebrating the Holiday Season and Our 120th Anniversary</strong></p>
    <p>Check out the full version of this month's newsletter at the Linotype website: <a href="http://www.linotype.com/38-21233/issue200612.html" title="http://www.linotype.com/38-21233/issue200612.html">http://www.linotype.com/38-21233/issue200612.html</a></p>
    <p><em>Content Preview:</em> Like presents tucked away under a tree, this month’s LinoLetter has a number of surprises in store for readers. First the fonts: This December, we are pleased to introduce a brand new type system! Called Generis, this system’s typefaces take on a rather generic appearance, allowing them to fit almost any design brief. </p>
    <p>Second, we’d like to call your attention once more to Pirouette. We first featured this copperplate script face in 2004. Now two years later, we’ve upgraded it further so that it includes contextual features, making it easier than for Pirouette to look like handwriting. In terms of information, we have three treats set aside: Linotype.com now has a Font Feature page devoted to holiday fonts and type ornaments. Additionally, we’ve brought out another edition of our typographic advice column, “Akira Says …” And last but not least, 2006 represents Linotype’s 120th Anniversary! We’ve decided to celebrate by printing a book that is both humorous and full of historical tidbits. You can find more information about this book and all of December’s surprises below.</p>
    <p>Don’t forget: Customers who purchase an OpenType Bundle before the end of 2006 will receive a Mac mini – absolutely free!</p>
    <p><a href="http://www.linotype.com/38-21233/issue200612.html" rel="nofollow">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="https://www.linotype.com/newsletter.html" rel="nofollow">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
