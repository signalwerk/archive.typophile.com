      <p>I'd ask for a little more than minimal compensation. It sounds like it's a moneymaking proposition for them, and I don't get the sense they're being completely upfront when they say they make no money on the client. While technically true, no doubt they're counting on the "atttach rate" to sell printing and/or services.</p>
      <p>Best of luck!</p>
