  html: |-
    <p>This isn't the first time somebody has asked to redistribute one of my free fonts, but something struck me as a little bit different here. Might anyone have suggestions on how I should deal with it? I've granted generous licences for minimal compensation before to a couple small game developers (since the fonts are free already I just asked for some copies of the games) but this outfit seems in a different sort of position. I'm not sure what it is exactly, but it feels different.<br>
    This inquiry is specifically about my font <a href="http://www.1001fonts.com/font_details.html?font_id=2585" rel="nofollow">Bolonewt</a>.</p>
    <p><cite>Hello from good old germany ;)</cite></p>
    <p>We are developers of a photobook solution, that we license to digital<br>
    printing houses.<br>
    Our photobook client is installed more than 100.000 times in germany,<br>
    and<br>
    even in Israel.<br>
    We want to include some new fonts in the next version of our client, so<br>
    we<br>
    are searching<br>
    around for some public domain or freeware fonts we can include in our<br>
    setup.</p>
    <p>We found your webpage and find some of your fonts very useful for our<br>
    photobook client.<br>
    Would it be possible, that we can include some of your fonts in our<br>
    photobook client and<br>
    redistribute them with the setup?<br>
    The photobook software is always freeware for the end user. We do not<br>
    make<br>
    any money<br>
    with the the download or installation of the photobook client.</p>
    <p>It would give us great pleasure if we can use some of your fonts. Of<br>
    course<br>
    we will credit<br>
    your fonts/webpage in the help file of the software.</p>
    <p>Best regards<br>
    Thomas Bauer</p>
    <p>__PRINTAHEAD - digital print<br>
    solutions______________________________________</p>
    <p> <a href="http://www.minibits.de" title="www.minibits.de">www.minibits.de</a><br>
    - softwareentwicklung - webengineering - consulting -</p>
