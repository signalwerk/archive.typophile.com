    <p>Hi everyone,</p>
    <p>I just wanted to promote my brand new type portfolio: DIEU ET MON DROIT.</p>
    <p>It's gathering some fonts that I've drawn, redrawn, customized or tweaked. You might have seen them in a magazine or a corporate identity and wondered what the hell was the font!? Otherwise, you'll discover my creations and feel free to leave your feedback down there.</p>
    <p>URL: <a href="http://www.dieuetmondroit.co.cc" title="www.dieuetmondroit.co.cc">www.dieuetmondroit.co.cc</a></p>
    <p>Enjoy your visit!</p>
