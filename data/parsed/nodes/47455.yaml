    <p>Hi there, </p>
    <p>I'm working on a minor update to my design co.'s logotype. </p>
    <p>Originally my goal was to improve its look and legibility at small sizes, but upon recommendation from a very talented type designer friend, I revisited the form of the tail on the Q "to play up its weird, organic shape, to balance it better with the "O" part, and by extension balance the Q better with the A." as he put it.</p>
    <p>What I did to the Q tail:<br>
    * Heavier at bottom<br>
    * Curvier curves<br>
    * Tail extends deeper into the center of the O<br>
    * A little longer<br>
    * Added a bit of flatness to the pointy ends</p>
    <p>The total effect seems to feel more calligraphic, definitely clearer<br>
    at smaller sizes. I worry I lost a tiny dash of the personality of the<br>
    original "slug", but maybe that can be reasserted, or maybe it's not<br>
    such a big deal.</p>
    <p>If I stick with this direction, it seems like the A needs a bit of<br>
    "dressing up" to match. Especially after adding that vertical flatness<br>
    to the sides of the Q's tail's tips, the current contrast with the Q<br>
    makes the A feel even more like a plain-jane rounded sans.</p>
    <p>So, how am I doing? Any suggestions on the "A"? Leave it alone? The original was better?</p>
