      <p>&gt;It would be a buggy tool full of memory leaks causing random crashes. It had a great UI and some nice features, but the actual code was... not the most stable or well-commented. That’s why Adobe didn’t just sell it off to somebody else when we acquired Ares (to whom the FontStudio rights had reverted).</p>
      <p>Yes I remember the crashes (do a save everytime you make a change and keep a backup handy!) I would have to assume that these bugs would have been removed by now if development had continued. :-)</p>
      <p>&gt;Seriously, if you liked FontStudio, you should spell out what exactly you liked about it and bug the FontLab folks to add that to FontLab Studio or Fontographer or something.</p>
      <p>The great thing I found when working with FontStudio was to be able to drop a scanned image into a character cell knowing that the program had not distorted or rescaled the image. I have made the request to the FontLab developers for a more informative properties box for controlling imported images from way back to version 3. Still waiting.</p>
