      <p>I agree that some of the intuitiveness indeed I find in FontLab, too (otherwise I wouldn’t work with it).<br>
      And I am happy about it. Yes, FontStudio was very very intuitive and for some type of work as for example spontaneous experimental type designs I still am afraid of changing. FontLab is great for real text designs and added some great features!! But some little things still I find too complicated as for example cutting out entire curve segments. I find it a bit complicated to have to cut some points with that knife tool to do so, because otherwise he only cancels points instead of the whole segments. Painstaking thing when wanting to work very fast with copied segments. (Would be happy if someone teaches me right!) But nevertheless..</p>
      <p>&gt;I wonder what kind of tool it would be now if it’s development had continued.</p>
      <p>I wonder, too, and most of all I always wondered about how anyone could to font designs with Fontographer in the past. Horrible program;-)</p>
      <p>Salute to all FontStudio lovers!<br>
      Stefan</p>
