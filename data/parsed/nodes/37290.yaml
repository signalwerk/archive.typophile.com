      <p>It would be a buggy tool full of memory leaks causing random crashes. It had a great UI and some nice features, but the actual code was... not the most stable or well-commented. That’s why Adobe didn’t just sell it off to somebody else when we acquired Ares (to whom the FontStudio rights had reverted).</p>
      <p>Seriously, if you liked FontStudio, you should spell out what exactly you liked about it and bug the FontLab folks to add that to FontLab Studio or Fontographer or something.</p>
      <p>Regards,</p>
