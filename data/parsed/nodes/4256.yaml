    html: "<p>Just to be clear: Bembo didn't exist before 1928. The earlier types that it was based on didn't have a name as such, and I wouldn't call them earlier versions of Bembo. That would be like calling the New Testament an earlier version of the movie <i>The Passion of the Christ</i>. <br> <br>Anyway, for samples of Aldus Manutius' printing, which might have examples of the typeface that inspired Bembo, try one of these: <br> <br>The Art of the Printed Book, by Joseph Blumenthal <br>An Atlas of Typeforms, by Sutton and Bartram <br> <br>Incidentally, the book that inspired the name was called <i>De Aetna</i>, by Bembo (the cardinal, not the font), published in Venice in 1495.</p>"
