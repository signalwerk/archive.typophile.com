  html: <p>any idea where i could start digging to find samples of different stages of this more than 500 yrs old typeface? any tips for bibliography, or even links for online stuff? how often has this typeface been redrawn, which ones were successful, which ones weren't? would love to get really deep into this typeface. cheers, <br>c</p>
