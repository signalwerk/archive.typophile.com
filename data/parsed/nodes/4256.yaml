    html: "<p>Well, for starters, the face we know as Bembo is from 1928. It was a modern revival of the faces which were cut for Aldus Manutius over 500 years ago. The name comes from the name of an author of a book that Aldus published. The face went into disuse after Aldus until it was revived as Bembo. <br> <br>Off the top of my head, here are some good sources of information about Bembo: <br> <br>A Tally of Types, by Stanley Morison <br>Printing Types: An Introduction, by Alexander Lawson <br>Twentieth Century Type Designers, by Sebastian Carter</p>"
