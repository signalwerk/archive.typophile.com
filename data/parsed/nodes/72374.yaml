      <p>The 's kerning is fixed in the 1.4 release (among other things that people have reported).</p>
      <p>Indeed I put a lot of work on it, but since this was my first font, and it was a learning experience, I think that releasing it for free was a good deal.</p>
      <p>I get lots of feedback and learned a lot from that feedback. That is priceless.<br>
      And, it get a lot of promotion and coverage, thats is priceless too.</p>
      <p>So, enjoy the font!<br>
      I enjoined a lot on the making and improving process, and meet a lot of people that was king enough for suggesting tips and ways to make it better.</p>
      <p>I will love to see what you ended up with.<br>
      Can you post an image of the business card?</p>
      <p>Thanks<br>
      Pablo</p>
