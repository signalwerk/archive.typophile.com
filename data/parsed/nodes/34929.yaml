      <p>Patty,</p>
      <p>I do have a cell phone - but honestly, it is only used in the car...and only if I’m not the one driving.</p>
      <p>AT&amp;T where we are has very little power, I can’t even use an AT&amp;T cell phone from my home - no signal.</p>
      <p>As for calls on a “digital” situation - I love SKYPE. I call my family in England - and it’s crystal clear. My stepson calls his friend in Korea on it - complete with cameras to they can see each other and have a grand conversation.</p>
      <p>There is always new technology around the corner - but I really feel Apple has hurt themselves on this one. By keeping it exclusive to AT&amp;T cuts a huge hunk out of the market - and by informing us that this is “first generation” with new improvements to be sold shortly - well, I don’t want to be the first kid on the block anymore.</p>
      <p>I’m a big fan of Apple - but this product just isn’t for me.</p>
      <p>And on a personal note to jselig - check with your phone company. Mine offered me a great savings by combining Internet with Cable TV with phone - and they threw in all the long distance phone call making I can handle to the USA mainland — which j’adore!</p>
