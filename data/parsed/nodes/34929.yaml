      <p>Crap. I had totally written off the need to get an iPhone since I have a very capable Samsung Blackjack (see my user experience critique of the <a href="http://idlemode.com/2007/06/29/user-experience-critiquesamsung-blackjack/">Blackjack at Idlemode</a>.) But, having hefted one, and resized a web page and watched the screen scale in real-time... I’m now eating my words and jonesing for one badly.</p>
      <p>It really does change the game. Windows Mobile — with it’s chunky pixel icons, its bitmap fonts, and it’s lack of transitions — by comparison feels about 10 years old when you’re holding an iPhone in your hand. I feel sorry for anyone who has to make calls on a RAZR.</p>
      <p>Back to reality for a second... I think I’m still committed to waiting for the second gen iPhone when it’s on a real (3G) network and when I can get more storage for my $599.</p>
