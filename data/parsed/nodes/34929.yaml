      <p>I’ve been on vacation since last week, but I stopped at an Apple store in DesMoines last Friday and got one. I like it a lot. Typing is fine. The screen is beautiful. It’s not as cool when AT&amp;T coverage and WiFi is lacking (unsurprisingly). The reason I decided to get it was so I could carry fewer gadgets without losing their usefulness. Instead of having to choose between  carrying a cell phone, a Palm Pilot, an iPod, a pocket camera, and a note pad, I can have all five in one tiny device. Having the Internet too is icing on the cake.</p>
      <p>(Posted from my iPhone.)</p>
