    <p>Hi,</p>
    <p>Can anyone recommend a good companion to the Appleseed font? <a href="https://web.archive.org/web/20080905213007/http://fonthead.com/font-sampler.php?l=1&amp;font=appleseed" title="http://fonthead.com/font-sampler.php?l=1&amp;font=appleseed">http://fonthead.com/font-sampler.php?l=1&amp;font=appleseed</a> </p>
    <p>Ideally I am looking for something which is like a regular non-italic version of the same face but without the rough edges. I wish to use it for a poster heading titled ’Sun &amp; Wind’ with ’Wind’ being in the Applescript font.</p>
    <p>Thank you in advance for any suggest<!--
