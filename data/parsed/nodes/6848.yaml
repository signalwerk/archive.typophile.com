    html: <p>A couple of comments at the 'Making Faces' seminar in New York last week are relevant to the issue of whether the 'brief' for Compatil is a good or a misguided idea. <br> <br>Matthew Carter was asked about his redesigns of Cheltenham for the New York Times. The questioner noted that some of the titles that had before been in different typefaces were now being taken over more and more by Cheltenham. Was this a loss? <br> <br>Carter said that whether to use more or fewer faces was really a matter for the Times to decide, but he personally didn't really see any advantage to a great many faces. He explained that historically the same face was just not available in different sizes and weights, so newspapers were more or less forced to use many typefaces. He did note that he designed, IIRC, five different versions of Cheltenham for the Times, for different uses.  <br> <br>The other comment was from David Berlow in answer to a question about the proliferation of families with a huge variety of weights and widths - much in evidence in both the Font Bureau and the HFJ foundry's faces. He retorted "We didn't start this you know," --explaining that the demand for a variety of weights and widths came from publications themselves. <br> <br>Reinforcing the merit of a variety of weights was another comment from Matthew Carter. He was in general refreshingly modest, but one slide he was clearly proud of, saying 'this is where I earn my keep.' It was a picture of a serif face with 3 different weights superimposed. The lines of the different weights were close, but the relationship between the different weights was clearly non-linear, and the serifs and joins were treated differently.    <br> <br>What I took from this was that all the optical and other adjustments of a face for different sizes and uses in a publication is actually quite useful and valuable, but the multiplication of faces in a single publication is questionable.</p>
