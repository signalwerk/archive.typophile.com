    html: "<p>Typographic maturity: the realization that self-expression on the part of the designer has to be subservient to the needs of the users. Also, the implementation of a rich functional palette, as opposed to pretty formalisms. For example, in the case of Compatil, having all the fonts render out at predictable color levels is more important than some designer's preference that slab serifs are more pretty when dark. <br> <br>hhp</p>"
