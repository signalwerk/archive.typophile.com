    html: '<p>Corporate ASE is a type system with three separate families: a serif, a slab serif, and a sans serif. Compatil has four: a Venetian serif, a transitional serif, a slab serif, and a humanist sans serif. <br> <br>The letter widths of individual letters in each of the four Compatil families are the same. This is not a monospaced font! "i" is still narrower than "w"</p>'
