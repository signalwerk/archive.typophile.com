    html: <p>On second thought ... I suppose the glyphs themselves seem a little ... erm ... safe for me. Which does translate into corporate, which doesn't mean it is necessarily a bad thing. <br> <br>However, before digital type, before photocomposition, Dwiggins (and many others) were designing for Linotype with all sorts of constraints and still managed to create beautiful type that worked and looked good in spite of those constraints.</p>
