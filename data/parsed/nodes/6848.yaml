    html: <p>Let explain me a bit more, <br> <br>I have nothing against such concept of various styles on a same family (well I have done one myself, hum). There is some good use of that, and many families demonstrated good design solution for that concept for long (JvK, Unger, Stone, Majoor, etc). <br> <br>But what I can't "accept" on Compatil is the way they tried to fit all forms on one same unique structure, missing that the different style can stick to same set of basic forms. Its a too universal approche for my eye. <br> <br>"Oldstyle" have some obvious characteristics, "Sans" others, etc. If not adjusted with sensibility, your design quickly became a monster, and some element of Compatil are like that, the various styles can't be "Compatibles." <br> <br>Another thing (from my actual knowledge, based on the type specimen), is pretending doing a universal family but providing no italic is a bit bizarre. <br> <br>Last, when you look at the design itself of the letterforms, well, the letterforms not balance well to the eyes, like the Frutiger Next too when Avenir Next is wonderful compared.</p>
