    html: <p>A number of designers dislike Compatil (and Unica, and other rational fonts), and some of them possibly because they consider themselves artists (whether they admit it or not), and the worlds of expression and logic are partly opposed. So something that makes a lot of sense is in a way threatening to the "culture" of some type designer. Artists can make some types of fonts better than craftsmen, and the other way around too. But even though no person is purely one or the other, the more you're close to one extreme of the axis the more liable you are to focus your hatred on the other extreme. Very few people can be both at one extreme and appreciative of the other extreme. <br> <br>hhp</p>
