    html: <p>&gt;how many weights is too many? <br> <br>Maybe I wasn't clear. What I understood is that a multiplication of weights for different sizes and purposes is useful, but that different faces, with different underlying structures, such as an old face and slab face is a problem. <br> <br>How many weights it would seem is dictated by the needs of the publication. Newspapers, which have a lot of information and charts and pictures to present, often in narrow columns - and which want to be 'skimmable' - seem to have a much higher demand than most books.</p>
