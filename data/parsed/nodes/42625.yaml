      <p><cite> I think the am is a little loose still. The ea could be a hair loose too. (In both sizes.) </cite></p>
      <p>Yes, I think you are right. That might be a place for special logo oriented letter shape alteration. Either the left outer serif on the m, or the tail of the a or a bit of both.</p>
      <p>You could also just open everything up to match the a/m relationship. If it was going to be used very small I might go that route. For use at larger sizes I would pull the m in tighter.</p>
