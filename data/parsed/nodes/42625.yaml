    html: <p>This font was designed to be set tighter I think - so when you open it up for logo use if you want to make it splendid instead of very good you have to change the shapes of the letters. I think it is quite good now. I might add a hair more space between the s &amp; c to get that last little bit of what's possible before you edit outlines. BTW I think the wider spacing works better &amp; is needed because the bright colors and the relative darkness of them interferes with reading the letter shapes a little. The extra space leps you find the forms. What if the puddle were slightly less high? Or higher? How does that feel? What if the puddles were just a bit lower?</p>
