    html: |-
      <p><cite> While the latter may well benefit from changing the letterforms, I think the former won’t. </cite></p>
      <p>Making adjustments to letters isn't easy and it isn't as if you are going off the rails here - it's really just a question of how far you feel like taking it. Theoretically you could make adjustments for any optical size that was different than the one the font was designed to be used in. Unless you want to second guess the designer, in which case you can have at the intended sizes too. I tend to want to do all that. Then there is the question of specific letter relationships and the question of being eye catching. Either of those could also drive you to adjust letters - especially in a logo. In your logo though the color is the eye catcher. For me this is what's left: the r keeps grabbing my attention because it feels too dark/heavy to me. But that may just be me. I would probably try a bit more space between the s&amp;c again as well.</p>
