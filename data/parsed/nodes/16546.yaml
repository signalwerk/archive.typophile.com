      <p>Bembo, like most classics, is horribly overused.<br>
      Whenever I see a new "fine book" (especially an art book) set in Bembo or Perpetua, I immediately close it. Reading that stuff atrophies the brain.<br>
      I prefer more innovative redesigns; so, Mark von Bronkhorst's Verdigris, rather than Robin Nicholas' Bembo Book.<br>
      IMHO, Nimrod and Barclays are Robin Nicholas' best work.</p>
