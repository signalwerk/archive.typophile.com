      <p>To tell the truth, I hadn't looked too closely at the Verdigris letterforms until typequake's comment. First time I saw Verdigris, I thought Bembo-ish for some reason.<br>
      Generally, I support new designs rather than close revivals of well-worn faces.<br>
      So, in the context of recommending an alternative to Bembo Book, I was thinking of something that would be old-style, in a traditional vein without being a specific revival, and would have some heft to it. Verdigris sprang to mind, perhaps because I had recently seen a print sample of it from Faces, the UK distributor.</p>
      <p>Anyway, looking at it more closely, and comparing with Galliard and Sabon, I would agree with George's astute observation of its marked pen-formed quality, and add that while Sabon has a roundness, and Galliard a pointedness, which integrate lettershape with detail, Verdigris has an angularity (perhaps due to the "pen") that contrasts form with detail, more in keeping with an Incunable such as Bembo. For instance, the slabishness of Verdigris' serifs, and the way the round-to-stem joints cut in with a little straightness. </p>
      <p>When one designs, no matter the ostensible sources and intentions, one also thinks creatively with hand and eyes, which operate in a dimension somewhat opaque to rational thought, so, not through a lack of sincerity, one's rationalizations can never be relied upon to tell the whole story.</p>
