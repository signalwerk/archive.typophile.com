    html: |-
      <p>Alexander,</p>
      <p>Generally I suggest finding out who originally designed or released the typeface and buying from them. It's possible to get ITC fonts from Linotype, Monotype fonts from FontShop, and any other combination you can think of. Linotype doesn't make it any easier, as they tend to somehow attach their label to many fonts from other foundries (Take "the source of the originals" with a grain of salt). </p>
      <p>Monotype originally released Bembo in hot metal. The first digital version (the same one everyone sells) has consistently been criticized for being badly-adapted for digital imaging and offset printing: it's too light. The new Monotype Bembo Book is intended to restore some of the satisfying color and feel of the metal Bembo in a digital format. For this reason, I recommend buying Bembo Book from Monotype (fonts.com or monotypefonts.com). Another substantial benefit to buying the new version is that it is available in OpenType Pro version complete with small caps, oldstyle figs and more, for only slightly more than the price of the regular family.</p>
