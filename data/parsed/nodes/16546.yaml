      <p><em>Surely the problem with old digital Bembo is it’s just rubbish, rather than it’s being an overused classic?</em></p>
      <p>I don't think it's rubbish, but the x-height is a bit big, and the finish a bit light for "normal" text sizes.</p>
      <p>While Bembo Book has more elegant proportions than the original digital Bembo, its detailing is not as graceful. While it is advertised as suitable for 10-18 pt size, many will prefer to use it smaller.<br><img src="/sites/default/files/old-images/bem.jpg"><br>
      In this comparison, the first digital Bembo is on the left, a scan of 14pt letterpress on uncoated stock (from Morison's "First Principles") in the middle, and Bembo Book at right.</p>
      <p>BTW, I would have liked to have compared a super high-res scan of all 3 printed at the same size on the same stock, but this was the best I could do.</p>
      <p>Printed on coated paper, letterpress Bembo has less spread than the sample here.</p>
