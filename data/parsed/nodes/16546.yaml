    html: "<p>Others are the late Franko Luin's <a href=\"http://www.linotype.com/509/griffoclassico-family.html\">Griffo Classico</a> and Bitstream <a href=\"http://www.paratype.com/btstore/fonts/Aldine-401.htm\">Aldine 401</a>, which is derived from Linotron Bembo, one of the sources for Yan's Aetna. I'd say Bembo Book is best for text, Aetna for titling; Griffo Classico has a pleasant, if rather inappropriate, homeliness. Of course there's also digital Poliphilus (a rough-edged version of Griffo's type in a later form), which doesn't really work in my view: Bringhurst says that in digital printing Poliphilus has finally come into its own, as if the novelty of the distressed look which is so noticable in its digital form were more than recompense for the loss of a beautiful and readable text type.</p>"
