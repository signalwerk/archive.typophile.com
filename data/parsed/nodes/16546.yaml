      <p>Hi Nick,<br>
      Surely the problem with old digital Bembo is it's just rubbish, rather than it's being an overused classic? Bembo Book is hardly overused - indeed it's depressing how little it's being used so far in setting mass-produced books; and most people haven't read much metal Bembo for a long time. Of course it would be wonderful for those who happen to be interested to see books set in a wider palette of types, but that doesn't make Verdigris better than Bembo Book - indeed it seems to me worse, like a reworking of metal Bembo to match the contemporary fashion for all things open, clean but warm, and unintimidating. Bembo Book is, by contrast, almost counter-cultural, and to me the most beautiful digital type yet made. Thank God Monotype didn't produce something like Matthew Carter's Yale instead, though of course that's excellent in its own way.</p>
