  html: |-
    <p>Working on a typeface where the client wants to have 45 pts on all sides of the glyph basically. It's a monospaced Chinese font. I have the metrics set so 45 pts are on either side for side bearings, I have 45 pts added onto the cap height for the ascender, and 45 added to the baseline to get the descender. The client wants the highlighted text to go below the text 45 pts...but when I export, it won't highlight that increment. What am I doing wrong? </p>
    <p>Here is the font info box:</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2014-01-30 at 3_4403.39.08 PM.png"></div><p></p>
    <p>Here are the highlighted characters in comparison. The image on the left is the way they want it to appear when it's highlighted (so there is a little more space below the descender); the right shows the way it is currently appearing- cutting off right below the character. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/reference_012714_03_3710.jpg"></div><p></p>
    <p>Any help on this is appreciated. </p>
    <p>Thanks!!</p>
