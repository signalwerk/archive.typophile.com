      <p>You can assign Private Use Area codes to those glyphs. Or you make those glyphs OpenType alternates to existing glyphs: sub B by B.alt<br>
      So if you change the font, it can change to the respective B.alt in the new font or fall back to B if there is no B.alt.</p>
