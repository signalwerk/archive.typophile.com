      <p>Generally, I think the designer calls the glyphs B.alt1, B.alt2, etc. and on into private use unicode they go until the designer then assigns one alternate version of any character to each Opentype stylistic set, which are like a private features area. Then the designer, or their support, show/tell your users which stylistic set contains which alternate(s). The fonts are installed, and the stylistic sets then appear in menus familiar with opentype, where your users who listened or looked at a guide, can select which stylistic set to change the B to. </p>
      <p>I may sound harder than taking a train to Fiji, but it's pretty easy.</p>
