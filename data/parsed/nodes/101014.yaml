    html: |-
      <p>The real problem here is lack of adequate application support. Any layout feature can, in theory, support type 3 one-to-one-of-many subsitutions, as Ralf suggests using with 'salt', but that in turn requires an application to be able to access enumerated GSUB variants.</p>
      <p>As Charles notes, there are only 20 stylistic sets, which is probably plenty for the intended use of those features, i.e. to access sets of related glyph variants, not variants of individual glyphs. For the latter, the Character Variant features exist, there are 100 of them and they are explicitly intended to be used with type 3 lookups, but that takes us back to where we are in the first paragraph: lacking appropriate application support.</p>
      <p>The good news, such as it is, is that support for enumerated variants is built into CSS3's typography support, so this is an area in which browsers are leapfrogging existing layout apps. We built a font for Byzantine sigillography that makes extensive use of the character variant features, and its very cool to see it <a href="http://people.mozilla.org/~jdaggett/tests/byzantineseal.html">working in Firefox</a>.</p>
