    html: |-
      <p>Well, with using stylistic sets, it can be like taking a train to Fiji. There are only 20 stylistic sets. If you want each set to control a single character alternate, and there are (for example) 3 variants each of 26 caps, you can't get there -- you run out of track at Arica...which looks like a lovely spot if you have Spanish &amp; some money...</p>
      <p>Further, I can't see how SALT will let you have individual control over which of three variants for however many caps...</p>
      <p>Private use encoding has it's own problems, but (forgive me) since yours doesn't seem like a font to be used for a multipurpose document, you could do that, and let the user hunt &amp; peck from the glyph pallet. As long as you use the same Unicode number (in PU) for each variant across the weights, it should work.</p>
