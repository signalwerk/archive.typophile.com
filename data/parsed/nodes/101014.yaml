    <p>Hi! I'm designing a layered typeface with three weights and some extra glyphs (ligatures, swashes and some weird alternates). I made open type feature for ligatures and kerns but I let some extra glyphs without feature. When I use those glyphs and I change the weight, the glyph doesn't change. For example, if I write "BARCELONA" with one of my extra B's, and I change the weight, it change all the word except the B.<br>
    I've been looking the generated file and it seems that those extra glyphs without feature doesn't have UICODE names, so when we change the weight, they doesn't change. I've tryied to use the option GLYPHS&gt;GLYPHS NAME&gt;GENERATE UNICODE but it doesn't work.<br>
    Anyone knows what can I do to generate the same UNICODE names on the three weights.<br>
    Thanks for your help and sorry for my english!<br><img src="/sites/default/files/old-images/Imagen-31_4053.jpg"></p>
