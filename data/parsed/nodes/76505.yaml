    html: <p>Fontstandards.org is solely concerned with technical aspects relating to the planning and production of font files. So the scope is more narrowly delineated. More importantly though, fontstandards.org is based on the fully featured MediaWiki system – the same as Wikipedia uses. This allows for tracking of changes, full revision history, and discussions can be done behind the individual articles on special pages.</p>
