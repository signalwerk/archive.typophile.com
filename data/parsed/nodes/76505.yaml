  html: |-
    <p>I have set up a wiki dedicated to the technicalities of font production and their related topics. I invite you to join, add and edit content. Please use your real name and include a short description of who you are when signing up. You have to be signed up to edit the content, but the content is readable by everyone. The project is fully non-commercial, but you are of course free to use the information in the wiki to produce commercial fonts. Don't worry about entering complete data, editing is what the wiki system is good at.</p>
    <p>Feel free to spread the word about <a class="freelinking external" href="http://fontstandards.org/" rel="nofollow">http://fontstandards.org/</a>.</p>
    <p>Hope to see you there!<br>
    Claus Eggers Sørensen</p>
