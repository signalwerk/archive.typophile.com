  html: <p>I was at the Oregon Coast this summer and took a picture that I thought might interest, or at least temporarily entertain, some of you. <br>According to the <a href="http://www.tillamookair.com" target="_blank"> Tillamook Air Museum</a>, these letters are 100 feet tall (30.48 meters). Is this the largest Helvetica in the world? What would the point size be? <br> <br> <br><img src="http://www.typophile.com/forums/messages/30/49587.jpg" alt="Giant Helvetica"></p>
