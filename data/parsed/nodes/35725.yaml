    <p>Another Typophile Exclusive!</p>
    <p>David Berlow, design innovator and co-founder of The Font Bureau, Inc., was presented with the 2007 SOTA Typography Award. A heartfelt and humorous tribute was given by David's friends and colleagues during TypeCon2007 in Seattle - Roger Black, Matthew Carter, Allan Haley, Cyrus Highsmith, and Mike Parker. A standing ovation ended the ceremony for David, and SOTA is delighted to pay tribute to this amazing designer with a great heart, a great hand, and a great spirit. Thanks to to all the lovely people who participated in this endeavor, and to David, for his outstanding work and his mentoring of burgeoning talent.</p>
