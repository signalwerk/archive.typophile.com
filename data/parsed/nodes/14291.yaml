    html: <p>It looks like one of the <a href="http://www.bestflashanimationsite.com/pixel-fonts/">Pixel Fonts created to provide legibility</a> at very small screen sizes in Flash. Of course it also looks like just about every screen font when set with an X height of 5px and no antialiasing.</p>
