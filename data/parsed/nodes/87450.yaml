  html: |-
    <p>Electronic Text Readers (eReaders) that allow different user specific fonts to be used, some require 4 font styles of the font that user chooses:</p>
    <p>regular<br>
    bold<br>
    italic<br>
    bold italic</p>
    <p>Please tell me if there is any user friendly, newbie / easy to use font software that allows these 4 font styles to be created, preferably free font software or free online font software.  </p>
    <p>The font software should also allow this font file naming convention / allow flexibility in font file naming:<br>
    [name]-Regular.ttf<br>
    [name]-Bold.ttf<br>
    [name]-Italic.ttf<br>
    [name]-BoldItalic.ttf</p>
