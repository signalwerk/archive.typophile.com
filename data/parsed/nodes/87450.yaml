    html: <p>Any automated solution is going to produce spotty results, at best, especially when generating pseudo-italics. Slanting type changes the sidebearings on most characters and tends to create spacing issues, which generally need to be resolved manually.</p>
    html_clean: <p>Any automated solution is going to produce spotty results, at best, especially when generating pseudo-italics. Slanting type changes the sidebearings on most characters and tends to create spacing issues, which generally need to be resolved manually.</p>
  - id: 484463
    user: 45774
    date: 2011-11-18T12:01:00
    date_raw: 18 Nov 2011 — 12:01pm
    votes: null
    html: <p>If you only need the four styles, because the Ereader does not accept font families with less than four members, you could simply copy the regular style three times and just change the internal names and some other values. All the four styles would look the same. You could use TTX or FontForge for this.</p>
