      <p>TTX is quite a program though difficult to get it started on Windows.  @ Arno Enslin has posted on Typophile about this.   I even tried it on Fedora Linux.  I am not a techie.  I wanted to find that start icon or file to get it going and it was not easy, just could not do it.</p>
      <p>FontForge was easy to get on Fedora Linux because it is also free software and was usable opposite to TTX.  I tried on it though I felt it was confusing as I only a newbie and a non-techie.</p>
      <p>So if either Arno Enslin or someone who is a font expert with TTX or FontForge and has a few minutes to spare please could you do the @ Arno Enslin recommendation for these 2 fonts for US Dollar 20 please:</p>
      <p><a href="http://ia700302.us.archive.org/17/items/BbtFont/" title="http://ia700302.us.archive.org/17/items/BbtFont/">http://ia700302.us.archive.org/17/items/BbtFont/</a><br>
