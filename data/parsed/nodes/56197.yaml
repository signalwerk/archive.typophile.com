      <p><strong>For Immediate Release</strong><br>
    De Pinte, Belgium - March 24, 2009</p>
    <p><strong>OurType presents Ludwig — a new typeface by Fred Smeijers</strong></p>
    <p><strong>Ludwig – a contemporary grotesque for text</strong><br>
    OurType Ludwig is the latest typeface designed by <a href="/wiki/Fred%2520Smeijers" class="freelinking">Fred Smeijers</a>. Based on first German ‘grotesque’ sanserifs made in sizes suitable for texts, Ludwig embodies Smeijers’s personal vision of how an early 19th-century sanserif design might look and perform today.</p>
    <p>“Ludwig charms simply by being there, without looking too smooth and beautiful,” says Smeijers. “Capturing that charm -- a certain clumsiness typical of early sanserifs -- was not an easy task, yet Ludwig gets it right.”</p>
    <p>Ludwig is designed as a companion to OurType Arnhem. Their contrasts are complementary while their proportions are the same. Ludwig and Arnhem also share most weights, which makes the two designs at once well suited and effective counterparts.</p>
    <p>Great for packaging, striking in headlines, catchy in posters and, above all, remarkably pleasant in text, Ludwig surprises -- and delivers -- with its all-round qualities.</p>
    <p>Ludwig comes in a family of forty-eight fonts, with eight weights and three widths of roman and italic designs, and is available in OpenType STD and PRO, covering Basic Latin and Latin Extended character sets. Display styles are underway and scheduled for release later this year.</p>
    <p><strong>About Fred Smeijers</strong><br>
    Fred Smeijers is a type designer, writer and educator. He specializes in typographic research and development for product manufacturers. Among his retail typeface designs are FF Quadraat and FF Quadraat Sans, TEFF Renard, DTL Nobel and OurType Arnhem, OT Fresco and OT Sansa. Smeijers has also designed corporate type families for Philips, OCÉ, Canon-Europe, Heijmans and TomTom.</p>
    <p>Born in the Netherlands, Smeijers studied graphic design at the Academy of Art in Arnhem. His career began in the mid-1980s with Océ, at that time just entering the field of typography with laser printers. Work there set the pattern for Smeijers’s long engagement with type design at its most functional -- as part of product design. In 1990, Smeijers co-founded the design group Quadraat in Arnhem, the name also given to his first typeface, FF Quadraat, published in 1992. His work of the 1990s included the expansion of the Quadraat family, type and lettering projects for Philips, collaboration on Martin Majoor’s Telefont type design, typefaces such as TEFF Renard and Romanée, and his first book Counterpunch (Hyphen Press). </p>
    <p>On receiving the Gerrit Noordzij Prize in 2000, Smeijers’s achievements in typeface design practice, research and education were formally recognized. The prize included a retrospective exhibition of his work, opening first in The Hague in 2003 and in London the following year. The exhibition also marked the publication of his second book, <em>Type now</em> (Hyphen Press).</p>
    <p>Fred is the co-founder and creative director of <a href="http://www.ourtype.be/">OurType</a>. </p>
    <p><strong>About OurType</strong><br>
    Founded in 2002, OurType is an independent type foundry led by Fred Smeijers, Corina Cotorobai and Rudy Geeraerts. Its signature collection consists of premium typeface designs that respect traditional values and yet are tailored to contemporary needs. In addition to its reknown designers, Smeijers and Verheul, OurType also publishes fonts from some of the best young talents: Nikola Djurek, André Leonardt, Merel Matzinger, Artur Schmal, Thomas Thiemich, Hendrik Weber, and Maurice Göldner.</p>
    <p>The OurType collection is available at <a href="http://www.ourtype.com" title="http://www.ourtype.com">http://www.ourtype.com</a>.</p>
