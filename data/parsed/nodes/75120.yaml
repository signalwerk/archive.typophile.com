      <p>Andreas, thanks for sharing these information. Nice to see a type designer finnaly using combining symbols. Except for MS Unicode fonts –like Arial– I did not see any font using this until now. The project I'm doing includes this fine resource –and I also added some variations beyond Unicode– as I believe this is a very useful feature.</p>
      <p>How did you build Symboljet regarding the usual A-Z, 0-? glyphs? The font ignores them?</p>
