      <p>Often I listen, at work, to Alabama 3's "Hits and Exit Wounds". Musically accomplished, witty, profane, something for everyone.</p>
      <p>Slightly tangential - I had a phone call from one of those machines which convert a text message to voice in a Hawking-esque manner. All it said was: "What are you wearing?". I can perhaps just see the point of this sort of call being made in person, but surely the use of an intervening service denies the perpetrator all the fun. Later that day I found that a friend of my daughter had texted her to ask what she was wearing to a party that night, and mistakenly sent it to our home number.</p>
    html_clean: |-
