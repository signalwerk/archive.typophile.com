    html: |-
      <p>I experienced sensory deprivation once, when I had my tonsils taken out. The anaesthetic blocked all sensory inputs, so I was not in pain from the operation, but I was still able to consciously think.</p>
      <p>As for the music I listen to, </p>
      <p>There's pop music... ABBA, Carly Simon, Herb Alpert and the Tijuana Brass, Sergio Mendes and Brasil '66, Petula Clark, Dusty Springfield, Al Hirt, Sandie Shaw, Mary Hopkin, Lesley Gore, Brenda Lee, The Beach Boys</p>
      <p>Easy listening... Percy Faith, Bert Kaempfert, Paul Mauriat, James Last, Frank Chacksfield, Barbra Streisand, Judy Garland, Felix Slatkin, Walter Wanderley, Horst Jankowski, Fausto Papetti, Geoff Love, Billy May, Enoch Light, Tony Mottola, Kiri te Kanawa, Linda Ronstadt</p>
      <p>Jazz... Dave Brubeck, Lionel Hampton</p>
      <p>Folk... Lester Flatt and Earl Scruggs, The Seekers, Celtic Woman, Harry Belafonte, Neil Diamond, Don Messer and his Islanders, The New Christy Minstrels</p>
      <p>Big Band</p>
      <p>Broadway (and also West End)... Elaine Page, Sarah Brightman</p>
      <p>Soundtracks... Star Wars, Superman, Flashdance, Silent Running</p>
      <p>Electronic... Gershon Kingsley, Hot Butter</p>
      <p>Other...  Leroy Anderson, Olivia Newton-John, Animusic, Nana Mouskouri (her early Hadjidakis material more than her later pop phase), Mason Williams, Mike Oldfield</p>
      <p>Recently, I've been rediscovering a lot of forgotten minor one-hit-wonders in rock and roll, like the Murmaids, Merrilee Rush, Minnie Ripperton, Patience and Prudence, and some rather more successful, like Vanity Fare, Ian and Sylvia, The Three Degrees, Susan Jacks, and European artists, like Caterina Valente, Dalida, Vicky Leandros, Jeanette, France Gall, Laila Kinnunen, Pirkko Mannola, Brita Koivunen...</p>
      <p>This is just a sampling, but I'm sure it's enough to convince many that my musical taste is execrable...</p>
