    html: <p>kcrw is great, and they (MBE) have a lot of their sessions archived. Two sessions to listen to, Beck with the Falming Lips and Paul Weller. <a href="http://www.kcrw.com/cgi-bin/db/kcrw.pl?show_code=mb&amp;tmplt_type=program" target="_blank">http://www.kcrw.com/cgi-bin/db/kcrw.pl?show_code=mb&amp;tmplt_type=program</a> <br> <br>Two other sites worth visiting include <a href="http://www.kexp.org/" target="_blank">http://www.kexp.org/</a> and <a href="http://www.jazzfm.com/" target="_blank">http://www.jazzfm.com/</a>  <br> <br>jazzfm has an awsome program called the "Late Lounge" 2pm pacific time. They'll play the likes of Massive Attack , Thievery Corporation and Underworld in the same session. <br> <br>If that's your type of music, run out and get Winter Chill <a href="http://www.amazon.com/exec/obidos/ASIN/B000075A1U/qid=1045664794/sr=2-1/ref=sr_2_1/002-2493026-7641656" target="_blank">http://www.amazon.com/exec/obidos/ASIN/B000075A1U/qid=1045664794/sr=2-1/ref=sr_2_1/002-2493026-7641656</a> <br></p>
