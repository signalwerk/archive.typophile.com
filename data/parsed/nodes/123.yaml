    html: |-
      <p>&gt;I stumbled upon a CD my sister forgot</p>
      <p>More family stuff:</p>
      <p>It was a great loss when my son left home and took all his CDs with him, several of which I had become quite attached to (I missed the boy too). The other day I felt like a bit of Schnittke, in particular the Kronos recording of the String Quartets (great sleeve design BTW, featuring Alias' Granite face), but it was gone with Eric. So I went down to the local classical store to see if I could get a copy, but they didn't have one. Desparate for a Schnittke fix, I bought "Oleg Kagan plays Schnittke". Really enjoying Concerto No. 3 for Violin.</p>
      <p>Always liked Peggy Lee but never heard her early work with Benny Goodman. My dad has a compilation album in his car, which he's lent me while he's on vacation, so I popped it on, and was gobsmacked -- she sounded so different then, and even more world-weary.</p>
    html_clean: |-
