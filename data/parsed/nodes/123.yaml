      <p>It is indeed totally muscular. Raw farm California take on the whole thing. Know the HP Lovecraft and haven't listened to it for ages. I'm sure it is quite dated. The other Pink Floyd that is outstanding are the live cuts from Ummagumma. Love it. Also the first four Grateful Dead albums are quite good but maybe the best is the first Quicksilver Messenger Service LP.</p>
      <p>If you want to hear a really screwed up take that was actually made because they hated the hippies, the first Alice Cooper is more psychedelic than almost anything. Drunken anger from Phoenix Arizona mixed with a love for show tunes.</p>
