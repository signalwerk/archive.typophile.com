      <p>@Vilbel</p>
      <p>Vletrmx21 is certainly a top Ae for me, why the <em>Garbage</em> EP finishes so well.</p>
      <p>If you like a bit harder stuff with EBM influences, look into Trentemøller's <em>The Last Resort</em> (the double version). It's Haujobb + Autechre—the glitch of Ae with the harder/darker beats of Haujobb. His other stuff doesn't hold up as well for me, but <em>TLR</em> has some great moments: <em>Polar Shift, Take Me Into Your Skin, Always Something Better,</em> and <em>Killer Kat (Bonus Track)</em>.</p>
      <p>Haujobb have been a favorite since the mid '90s, constant growth and progression from them. I like <em>Ninetynine</em> for its minimalism and detail, so the connection to Ae and the like is easy for me.</p>
      <p>Hecq also does a fantastic remix of Metric from Haujobb's <em>Vertical Theory</em> (which is how I found Hecq in the first place).</p>
      <p>Circuitous as always.</p>
