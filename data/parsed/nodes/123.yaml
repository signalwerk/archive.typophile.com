      <p>George Jones (Country), Norah Jones (Pop), Dan Tyminski (bluegrass), Sam Cooke (soul/R&amp;B), Kitka (Bulgarian/Eastern Europe), Beatles (Pop), Canadian Brass (Classical), Pedro Infante (Mexican), Miles Davis (Jazz), Astrud Gilberto (Brazilian Jazz), Ladysmith Black Mambazo (a capella African Vocal), Marty Robbins (Country), Jimi Hendrix (Rock), Stan Kenton (Big Band), Arturo Sandoval (Jazz), Swingle Singers (a capella Classical), Bob Dylan (Folk), Altan (Irish), Al Green (soul/R&amp;B), Dolly Parton (Bluegrass), Los Tres Diamantes (Mexican Trio), John Lee Hooker (Blues), Connie Smith (Country), Beatrice Adriana (Rancheras), etc. mixed in with some that I didn't know I had, or who it is. </p>
      <p>In my car I am locked out of the iPod controls, so I wait until I get home to see who it was.</p>
      <p>This is such a blast. Sometimes the mix gets so incongruous I have to laugh out loud while driving down the road. It would be fun to make a radio station using this shuffle feature, just to imagine people all over the place going, "What the H...?"</p>
