      <p>Chris Dean: [<em>Prince</em>]<em>still rips on guitar (check out his solo at 3:27 covering My Guitar Gently Weeps) but seldom show-boats like this on any of his recorded work.</em></p>
      <p>Thanks again for that link, although I see it has now been blocked by YouTube. Remembering it prompted me, last night, to watch the London 'Concert for George'. I have to say that Eric Clapton's more restrained solo on 'While my guitar gently weeps' moved me more than Prince's. It's always breathtaking to see a virtuoso like Prince playing at the edge of control, but Clapton managed something that stayed relevant to the song itself. To make this, barely, relevant to type, it reminds me of the difference between being impressed by display typography that draws all sorts of attention to itself independent of the content, and that feeling one gets when typography just seems to perfectly fit the text.</p>
      <p>The other highlight of the London concert was Anoushka Shankar conducting her father's composition while <a>Clapton impressively handled the Indian time signature</a>.</p>
