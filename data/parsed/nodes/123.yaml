      <p>Mosh,</p>
      <p>I understand why you wouldn't want to label Siousxie and the Banshees/Creatures and being Goth, however they did have serious impact on the scene itself. I was involved in the Goth/Industrial scene for sometime throughout the 90's and they were at the forefront of what was happening musically. (I remember some of my friends used to cry when Siousxie would come on stage. :) ) Robert Smith once said that he and Siousxie never intended for people to categorize them in this manner, they don't consider themselves a part of any scene or genre – but they are flattered all the same.</p>
      <p>I am not that familiar with the goth scene anymore (I still stick to the oldies) but it seems that this genre has morphed itself into contemporary "alternative" hard rock/punk. I can't give any examples as I avoid these records like the plague. I truly believe the goth scene died mid-nineties. Though, Peter Murphy is on tour again, I will be seeing him next week in Portland and I CANNOT wait. :)</p>
      <p>Interpol, great band, and yes, obviously influenced by Joy Division, another one of my favorites. No matter how awful some may perceive Ian Curtis' voice to be, I still hear sweetness in songs like "Atmosphere." I highly recommend picking up some JD on vinyl – there is a quality to the music that is lost in other mediums. Early New Order did quite well with carrying on the Warsaw/Joy Division sound, but as soon as they went into mainstream discos, there wasn't much left for me to really enjoy. </p>
      <p>Anyone ever hear New Order's Video 5-8-6? (intense, bass driven, 28 minute track)</p>
