      <p>Of course, Finland, like any other country, has a wide variety of musical genres that people enjoy.</p>
      <p>In looking up modified versions of Christmas carols on YouTube that extolled Cthulhu, I found out about Hatsune Miko. And from Hatsune Miko, I found out about the Ievan Polkka. And clicking on related links led me to Kun Mun Kultani Tulisi.</p>
      <p>When I first heard it, I mistakenly thought it must have been a traditional Irish song translated into Finnish, but no, it is an old traditional Finnish song (or an old traditional Finnish poem set anew to music by Loituna; I am not yet certain which one).</p>
