    html: "<p>&gt;&gt;When I saw these guys bowing a guitar like a  <br>cello I had to look again. <br> <br>Would that be like Jimmy Page was doing in 1969, or a different technique to that? (Cello implies a slightly different action, but I'm not sure how precise you're being). My 11 year old son plays guitar and I was thinking of giving him a bow for christmas - he was blown away when he saw page using a bow on Dazed &amp; confused on the new DVD, but if there are other people who have used other approaches with bows I'd be keen to find out about them. <br> <br>As for today's music: <br>Led Zeppelin (of course) <br>NOFX <br>Frank Sinatra <br>Naz Nomad &amp; the Nightmares <br>Steel Pulse <br>Glen Millar <br>Buzzcocks <br>System of a Down <br>Pink Floyd</p>"
