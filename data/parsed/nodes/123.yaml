      <p>Tiff, you had me up until Def Leppard... =) </p>
      <p>Speaking of the UK... I found this podcast, <em><a href="http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewAlbum?playlistId=73799641&amp;selectedItemId=73799641" rel="nofollow">Not Your Usual Bollocks</a></em> (iTunes link requires v4.9). Very tasty, half hour block of various indie tracks with very little talk. The host plays some obscure stuff (to my ears) - Brit electronica, German electronic. He mixes in just enough recognizable stuff from Kasabian, Autolux, Aphex Twin, to keep it at least a tad familiar. Very highly recommended! (Isn't it rare to find a podcast you can actually recommend?)</p>
