      <p>I can listen to almost anything when I am lettering or designing logos, but when I am doing actual calligraphy I need something with a hypnotic groove. Last night I just could NOT get into a project so I set the alarm for 5 AM and turned on entranced.fm on the itunes radio stream. With the right beat I can get into the flow instantly instead of banging my head against the wall.</p>
      <p>My main playlist right now is Bombay Dub Orchestra, Gotan Project (nuevo tango),Beyman Brothers and everything and anything by Leonard Cohen (I saw him in concert last month and it was the most amazing stage performance by a musician I've seen in my life.) So "I'm Your Man" is definitely on my list. Even though they are ancient, I still find that Pat Metheni's OffRamp, Brian Eno's Thursday Afternoon or The Pearl and Keith Jarrett's Koln concert get me into a great creative space.</p>
    html_clean: |-
