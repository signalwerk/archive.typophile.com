      <p>As a fan of 30 years, I personally feel that almost everything post Emancipation is garbage. Live, he still rips on guitar (check out his solo at 3:27 covering <a href="http://www.youtube.com/watch?v=zByqXu6nGYA" rel="nofollow">My Guitar Gently Weeps</a>) but seldom show-boats like this on any of his recorded work.</p>
      <p>NPG is by far the worst band he’s ever played with. Why he still carries their sorry asses around, I’ll never understand.</p>
      <p>In my opinion, some of his better work includes:</p>
      <p><a href="http://grooveshark.com/#!/search?q=this+is+not+music%2C+this+is+a+trip" rel="nofollow">This is Not Music, This is a Trip</a> — B side of Alphabet Street 12" single (1st one on this list, crap quality)<br>
      <a href="http://www.dailymotion.com/video/xtsgax_prince-cloreen-bacon-skin_music#.UQCLFKWpXBJ" rel="nofollow">Cloreen Bacon Skin</a> — Crystal Ball (fantastic liner notes on this track with the original release)<br>
      <a href="http://grooveshark.com/#!/search?q=animal+kingdom" rel="nofollow">Animal Kingdom</a> — The Truth (A sweet bonus acoustic album that came with Crystal Ball)<br>
      <a href="http://grooveshark.com/#!/search?q=bob+george+prince" rel="nofollow">Bob George</a> — Black Album<br>
      <a href="http://grooveshark.com/#!/search?q=erotic+city+dance+mix" rel="nofollow">Erotic City (dance mix)</a> — I got this as a CD single import from France. Set me back $50.</p>
      <p>More commercially:</p>
