    html: |-
      <p>There are two soundtracks, that I really love: <em>Dead Man</em> by Neil Young and <em>Stalker</em> by Edward Artemiev.</p>
      <p>From a certain point of view <em>Stalker</em> is also a movie about silence. It is such a great masterpiece. The partly synthesizered sound of the draisine, when it is rolling over the tracks, in the first quarter. Tarkowski was such an ingenious man, really, that are the people, which let me think: Yes, the human species is worth to survive. Some of you, Mario Feliciano for example, let me think this, too.</p>
      <p><em>not however if you keep worrying about your 77 cents per minute, which would presumably make the overall experience less enjoyable :-).</em></p>
      <p>I think I wouldn’t. And I doubt I would fall into sleep. Probably I would try to imagine a thought as a material thing or I would try to hear the music stored in my head. Something like that. I assume I would directly start with 90 minutes. The next floating station is not far away from here.</p>
      <p><em>BTW, some people listen to music in there, but in my view that's just diluting the experience.</em></p>
      <p>Yes. When I had edited my post, I had clarified, that I don’t plan to hear music stored in a MP3-player. A few times in my life, I have dreamed music in half-sleep-phases, which was very impressive, because I could not remember, that it was music, which I ever had heard before. And it was very real. I am fascinated by the power of the brain, when the consciousness is partly turned off. I mean the condition, in which your brain does not waste resources for existential things of everyday life. And I never was endeavored to extend my mind with the help of drugs. Well, I have tried hash, but I don’t like it to give myself into the hands of those substances. And somehow the effect of this soft drug was already too extreme. I never would try LSD or Psilocybin.</p>
  - id: 406572
    user: 1262
    date: 2010-04-13T16:35:00
