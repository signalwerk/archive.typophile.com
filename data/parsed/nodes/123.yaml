      <p>Tiffany, I am right there with the Def Leppard. I have a secret collection of Def Leppard on vinyl and am always on the hunt for old paraphernalia, such as t-shirts and pins. Every once in a while I pull out the ole' "Historia" video colleciton on VHS, that is when I am near a VCR, which is rare. And then I totally play air guitar and imagine what my life would be like if I had followed my teen-age dream and married Joe Elliot. It is a sickness…</p>
      <p>Sampling a lot of new stuff <a href="http://www.audioscrobbler.com/user/zara" rel="nofollow">right now</a>, but there are a couple of albums I can't stop listening to that should make it onto this year's list of best releases:</p>
      <p>Sufjan Stevens, <a href="http://www.pitchforkmedia.com/record-reviews/s/stevens_sufjan/illinois.shtml" rel="nofollow"><cite>Come on, feel the Illinoise!</cite></a> Beautiful, dramatic, a truly stunning piece of work. Highly recommended!<br>
      <a href="http://clapyourhandssayyeah.com/store.php" rel="nofollow">Clap Your Hands Say Yeah</a><cite>, Debut release. A few of us TypeCon attendees are lucky enough to have nabbed the very last tickets for a sold-out show next week in Brooklyn, all thanks to my favorite <a href="http://typophile.com/user/7003" rel="nofollow">ghost</a>.</cite></p>
