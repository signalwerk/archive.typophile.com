      <p><strong>Theatre</strong>: <em>A Little Night Music</em> and <em>Sweeney Todd</em> - Stephen Sondheim, music and lyrics.  (Both librettos by Hugh Wheeler who, you can be sure, played a big part in supplying, uncredited, lyric ideas and song titles.) And with orchestrations by genius Jonathan Tunick - far and away the greatest orchestrator to ever work on Broadway.<br>
      (My parents started taking me to Broadway shows from the age of eight, but even still, this stuff is definitely 'acquired taste'. But what a wonderful acquisition it's been. I can't live without listening to Night Music or Sweeney at least a couple of times a year. For the uninitiated, there's Tim Burton's treatment of Sweeney as a movie with Johnny Depp, just a few years back, where one can see a terrific movie and get the characters and story line so essential to appreciating the full theatre scores. Moreso than any other theatrical songwriter I can think of, Sondheim's music and lyrics only fully come to life when you understand the larger narrative within which the songs function. Few people know that the lyric to 'Send In The Clowns' isn't just some loose theatrical metaphors pieced together - they are very specific to a character in a very specific situation within a larger narrative.)</p>
      <p><strong>Joni Mitchell</strong>:  Joni's 'jazz period' which to me, means everything she did that had Jaco Pastorius playing fretless electric bass behind her. The studio albums 'Hejira', (Jaco plays on four of the tracks), 'Mingus', 'Don Juan's Reckless Daughter'.  Also the live concert recording 'Shadows and Light', where the band includes Randy Brecker on sax, Pat Metheny on electric guitar, keyboardist Lyle May, along with Jaco on bass. </p>
      <p>Also, my son's been playing a lot of Irish folk music around the house lately - from Pandora via iPhone piped to speakers via bluetooth. Quite infectious.</p>
