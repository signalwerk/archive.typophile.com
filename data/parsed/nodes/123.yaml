      I had bought the album when it came out in ’67, but it went AWOL years ago.<br>
      Listening to it again, what a strange album.<br>
      Of course, quite a bit derivative of Sgt. Pepper, but lots of very well put together original stuff, and some jammin’.<br>
      <em>2,000 Light Years From Home</em> is awesome!<br>
      Step right up…<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/rolling-stones-their-satanic-maj-467667_3864.jpg"></div><p></p>
      <p>Other than that, have tried very hard to like the new Feist, Coldplay and Florence, but failed.<br>
      Still listening to Arcade Fire’s <em>The Suburbs</em>, IMO the best rock album in a long time.</p>
