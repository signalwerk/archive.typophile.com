      <p>Hrant: <em>…nature's music makes ours seem idiotic.</em></p>
      <p>I live in a rural environment on an island in one of the most biologically diverse places in North America. I walk in the woods or on the beaches almost every day. I listen with pleasure to the sounds that nature produces. And I have to say that a very large amount of the sounds produced by individual species of animals and birds are limited and repetetive. I think you would be hard pressed to find another species that produces anything like the range of sounds that humans make, or that orders those sounds in so many different ways.</p>
