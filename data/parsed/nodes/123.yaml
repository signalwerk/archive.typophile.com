      <p>Not listening to anything right now. But this month we go to 4 chamber orchestra concerts each weekend. Part of the International Chamber Orchestra Festival. In addition to the local band, the Saint Paul Chamber Orchestra, 4 other bands are coming from Europe and the SF Bay Area (poor guys, it is butt-freezing cold here this month; at last, thank god).</p>
      <p>This is an amazing concentration of chamber orchestras: some of the best on the planet.</p>
      <p>Twenty concerts for $100. Everything from baroque to Right Now.</p>
