    html: "<p>&lt;em&gt;How long do bows last when you're using them on a guitar? And is there a reason for choosing one type of bow over another, or is it just a matter of taste?&lt;/em&gt; <br> <br>The bow I use isn't mine - the guy that used to play bass with me owns a viola (but never plays it), so I borrowed the bow. It's lasted a good 4 years now. <br> <br>Back to the thread's original subject (although derailing a bit), I'd like to hear people's thoughts on the new Belle &amp; Sebastian, \"Dear Catastrophe Waitress\". I really can't see it as B&amp;S... it's a nice pop album, but it's just not the same band. I wonder if it was the lineup changes that got them to change this much, or if Stuart wanted to try something new... or maybe Trevor Horn did have a big influence as producer. <br>The sound is much more polished, a far cry from the signature B&amp;S lo-fi-ish sound, and I'm not sure about some of the lyrics: \"I'm sorry if he hit you with a full can of coke, it's no joke / Your face is bleeding\". <br>I'll go back to \"If you're feeling sinister\"...</p>"
    html_clean: "<p>&lt;em&gt;How long do bows last when you're using them on a guitar? And is there a reason for choosing one type of bow over another, or is it just a matter of taste?&lt;/em&gt; <br> <br>The bow I use isn't mine - the guy that used to play bass with me owns a viola (but never plays it), so I borrowed the bow. It's lasted a good 4 years now. <br> <br>Back to the thread's original subject (although derailing a bit), I'd like to hear people's thoughts on the new Belle &amp; Sebastian, \"Dear Catastrophe Waitress\". I really can't see it as B&amp;S... it's a nice pop album, but it's just not the same band. I wonder if it was the lineup changes that got them to change this much, or if Stuart wanted to try something new... or maybe Trevor Horn did have a big influence as producer. <br>The sound is much more polished, a far cry from the signature B&amp;S lo-fi-ish sound, and I'm not sure about some of the lyrics: \"I'm sorry if he hit you with a full can of coke, it's no joke / Your face is bleeding\". <br>I'll go back to \"If you're feeling sinister\"...</p>"
