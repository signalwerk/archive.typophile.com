      <p>I was lucky enough to see Bauhaus playing in Mexico City four or five years ago. Marvellous. The place where they played in was closed the day after because it was in a very ruined and dangerous state and was not designed to hold so many people. :) Nobody died the day of the concert, though.</p>
      <p>I was a big Cure fan for maybe ten years, but I think the "good" Cure's final record was Disintegration. Others might disagree. The old material is powerful as ever to me. Same with the Banshees' catalogue.</p>
