      <p><cite>There’s nothing quite like the sound of myriad acres of quiet.</cite></p>
      <p>I never was in the painted desert, but real silence is indeed something, that most citizens don’t know. Probably the painted desert is not totally silent, but quiet enough, only filled by noises, that point out the silence.</p>
      <p>There are these mind-blowing salt water tanks. I have read the first time about them in a book by Stanisław Lem. The name of the story is <cite>the conditional reflex</cite>, as far as I remember. In the absence of stimuli you seem to loose orientation and your mind is filling the space, that normally is filled by the environment.</p>
      <p>---------</p>
      <p>Just now I am hearing Kaly. The name of the album is <em>Electric Kool  Aid</em>.</p>
