      <p>For me, Christmas is all about nostalgia, so every year I dig out the Christmas vinyl.</p>
      <p>First on deck:<br>
      Phil Spector's Christmas Album--Props to Phil for keeping the spoken intro in "White Christmas". </p>
      <p>Also kinda kitschy:<br>
      A Liberace Christmas--As good an excuse as any for Lee to use the top octave!<br>
      Doris Day: Here Comes Santa Claus --makes me feel like a five-year old in a world with no cares.<br>
      Gene Autry: He'll be Coming Down the Chimney--"Yes by Gosh by Jimminy, he'll be coming down the chimney", a lyrical gem, and love the sound effects!</p>
      <p>On the serious side:<br>
      A Festival of Lessons and Carols as Sung on Christmas Eve in Kings College Chapel Cambridge (1954)--Awesome old-school aristocratic accent of Sir John Sheppard, reading the lessons, and the schoolboy choristers are quite angelic.</p>
      <p>Music for the Feast of Christmas (Ely Cathedral, c.1960)--A lot of really old tunes, 15th-17th century, with, for some reason, Messaien's "Les Anges".</p>
      <p>**</p>
      <p>I go to church at Christmas for the carols. Bit of a cheat, as I'm not religious.</p>
