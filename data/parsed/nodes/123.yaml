      <p>Nono, Siouxie never really was Goth, not a single moment. The Creatures were to experimental for that label and the Banshees too pop.</p>
      <p>That said, at the moment I'm pretty straightforward into retro80s THE-Bands. Athelete, Engineers, Arcade Fire, Snow Patrol, The Faint, Te Doves... stuff like that. </p>
      <p>The new Porcupine Tree album is fairly good, although not as breathtaking as the last three outings. </p>
      <p>Jem is surprisingly good pop. </p>
      <p>The new Mars Volta is pretty much the same as the last album, there is no other band like that, at the moment. </p>
      <p>There's some good German bands at the moment, Bosse, Tomte, Niels Frevert, Kettcar. </p>
      <p>The new New Order is, alas, boring as hell. I think I should just buy the Saville-covers and leave the actual CD in the stores. Same goies for the new Tori Amos CD, very been-there-done-that, but with the addition that not even the coverdesign is pleasant. </p>
      <p>The Tord Gustavsen Trio (on the great ECM label) is wonderful stuff, great Jazz. </p>
      <p>These days, thanks to iTunes, my listening habits have changed a bt. Where formerly any new CD would run for a few days in the studios CD-Player, now a new-bought album will get MP3-d pronto and put into the maelstrom of thousands of tracks played at random in itunes, so here in the studio AC/DC is followed by Schubert, Chet Baker by Slime. It makes for pretty weird surprises, but I haven't digitalized my whole CD-collection yet. As I have an ipod in my car now as well, the same principle applies there. As a result, my listening habits have a bit... fractalized, strangely enough. </p>
      <p>Looking forward to Roisin Murphys first solo-album «Ruby Blue», shame about Moloko, though. ro is a great singer and Herbert should guarantee a nice soundtrack... but Moloko was one of the best pop bands these recent years, along with Lamb, who seem to be vanishing as well.</p>
      <p>HD Schellnack</p>
