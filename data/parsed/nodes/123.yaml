    html: |-
      <p>@mili:<br>
      <cite>Quadibloc, fascinating to see Laila Kinnunen, Pirkko Mannola and Brita Koivunen on your list. Have they ever recorded in English? Or do just enjoy the beautiful sound of Finnish?</cite><br>
      Actually, at least some of them have recorded a few items in English.<br>
      The reason I had even heard of them is because, since YouTube has reached an agreement with the music companies, I had been searching YouTube to listen to interesting items there.</p>
      <p>So, first I searched for versions of Lesley Gore's hit song "You Don't Own Me" sung in other languages. In this way, I discovered Dalida, who sang the Italian version, "Va Tu Sei Libero".<br>
      Then I looked at some of her other songs, and found that she sang the novelty song "Itsy-Bitsy Teenie-Weenie Yellow Polka Dot Bikini" in a French version, "Un Tout Petit Bikini". I then went searching to discover how many other languages this song had turned up in.</p>
      <p>At least this is one version of the story. Also, in searching for other versions of songs that Nana Mouskouri had sung, particularly her early material written by Manos Hadjidakis, I found one song by Hadjidakis that apparently she had not recorded. (Actually, she had done so, but only in a French version: "C'est Joli la Mer".)</p>
      <p>I had not remembered that Brenda Lee's hit song, "All Alone Am I" was a modified version (an instrumental bridge became the chorus/refrain, the chorus/refrain became the ordinary part of the song, the ordinary part of the song was dropped) of one of Hadjidakis earliest songs, made famous in a movie about World War II.</p>
      <p>Perhaps to the Greeks it is as strongly identified with Jenny Karezi and the movie, the way "As Time Goes By" is with Casablanca to English speakers, that Nana Mouskouri saw no need to sing "Min Ton Rotas Ton Ourano" in Greek. Later on, Anna Vissi would sing it.</p>
      <p>In any event, my investigations into that song led me to other Greek artists, such as Vicky Leandros, and thus to the Eurovision Song Contest. So I might have encountered Dalida through that route instead of a search directly related to Lesley Gore.</p>
      <p>Brita Koivunen recorded, or at least performed, "Ma, He's Making Eyes at Me" in Finnish, but I recognized the tune, as "Mamma, Tuo Mies Mua Tuijottaa".</p>
      <p>Laila Kinnunen recorded a few songs in English, such as "Girl Don't Come", "I Will Follow Him", "Who's Sorry Now", "Who's Sorry Now", "You've Lost that Loving Feeling", and, in Finnish, she recorded "Everybody Loves a Lover" as "Kellä Kulta Sillä Onni".</p>
      <p>Pirkko Mannola is the one who recorded "Pikku Pikku Bikinissä", which started me looking for other artists from Finland that turned up as related suggestions in her search results; she sang a duet with Brita Koivunen, and she also sang together with Laila Kinnunen and one other artist for a version of "Three Coins in the Fountain". Another rock and roll success in the English-speaking world she brought to Finland was "Kumipallo": "Rubber Ball".</p>
      <p>On the other hand, I found "Det Finns Ingenting Att Hämta" in Swedish, sung by Anna-Lena Löfgren, and "Schuld War Nur der Bossa Nova" in German, sung by Manuela, but I haven't found the Finnish version yet.</p>
