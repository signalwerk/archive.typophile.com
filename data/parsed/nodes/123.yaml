      <p>Nina: <em>…some people listen to music in there, but in my view that's just diluting the experience.</em></p>
      <p>I'm sure you're right in terms of the full experience of sensory deprivation, but there are some pieces of music I would really like to listen to while all my other senses were minimally stimulated. Thomas Tallis' <a href="http://www.youtube.com/watch?v=aMz7ufLN-L4" rel="nofollow"><em>Spem in alium</em></a> would be top of the list. The depth and complexity of the 40-part polyphony is so demanding and begs to be allowed to overwhelm all other senses: even closing my eyes immediately and completely changes the experience of the music, so I can imagine how doing away with awareness of my chair, etc. would probably intensify it even more.</p>
