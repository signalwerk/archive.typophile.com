    html: <p>I’ve always had a soft spot for Stevie Winwood, along with Marriott and Burdon, because they were so young and soulful, barely older than me when I was ﬁrst getting into pop music. A vicarious blackness, indeed. But by the time I went to art school in 1970 I really wanted to listen to stuff that was totally cosmic, eclectic and bizarre, or just plain obscure. So yes, I dug Trafﬁc’s funky jamming, but was more into Mahavishnu and Zawinul. And you will still ﬁnd me rummaging through old vinyl stores looking for albums on labels such as Turnabout and Nonesuch.</p>
