    html: |-
      <p>James - the RIAA keeps labels honest as well as serves as their police. Some of the biggest rip-offs in the music industry were perpetrated by "independent" labels, of course there is no shortage of stories about the majors, but at least they have to more or less play by the rules and pay me my royalties.</p>
      <p>Young bands get taken advantage of a lot. The first single from one of my bands was put out by an "indie". I have never received one penny even though I wrote both of the songs and played guitar. The person running the indie has declared bankruptcy several times over. Ironically one of the songs from that single was covered by the Red Hot Chili Peppers, resulting in a really good last couple of years royalty wise. Even more ironic is that I have never listened to their version of the song.</p>
      <p>So unless you are buying a Sun Ra CD from Sun Ra himself - someone is in the middle and chances are they are up to no good.</p>
      <p>pbc</p>
