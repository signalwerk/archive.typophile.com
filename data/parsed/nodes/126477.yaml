    <p>Hello Typophiles! </p>
    <p>Last week we launched a font subscription service for designers called <a href="https://vimeo.com/fontstore/intro">Fontstore</a>. Fontstore is a growing library of brand-new fonts that are designed with graphic designers’ everyday needs in mind. Instead of paying for each font separately, you can now subscribe to the entire Fontstore library of exclusive fonts for a low monthly subscription fee of $15. We've started the service with introductory 75 families, but we'd be adding new fonts every month while your subscription fee shall remain same, forever. </p>
    <p><a href="http://www.fontstore.com">www.fontstore.com</a></p>
    <p>I hope you like it.</p>
    <p>Best regards,<br>
    Satya Rajpurohit</p>
