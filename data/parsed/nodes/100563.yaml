    <p>Hello all,<br>
    I'm a university student studying graphic design. A couple years ago I got the typography bug and now it's probably a full blown obsession. As a directed study for school, I've selected to create my own typeface. My plan is to create roman lower and upper and italics by the end of the semester. One of the problems has been finding a process getting good feedback because of the lack of people experienced people around me. So I've come here to hopefully learn and get good critique.</p>
    <p>My current plan is to do all the letters on paper with pencil, then ink, which will be scanned in to take to a yet undecided program and fixed. Is there a standard program that would allow me to do kerning tables and such? I've looked into FontLab and Font Forge, but haven't used anything yet. </p>
    <p>Secondly, I would like to ask for some feedback on my preliminary letters. I've attached a couple images of my first forms. The plan is to create a contemporary serif, with a little humanist feel. I've been experimenting also with a very high x-height and some features that would be interesting at display size but disappear as body text. Please don't hold back!</p>
