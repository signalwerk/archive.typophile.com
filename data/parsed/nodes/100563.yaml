      <p>Let's just say I'm a type design enthusiast, rather than a type designer. So keep that in mind when reading this.</p>
      <p>I attended a week long type design workshop recently. What I learned is that although I love handwork, and meticulously drawing and inking each letterform at large sizes -- it might not be the best workflow to get to a coherent typeface design. Why? Because there's a tendency to make each glyph look very nice, but that workflow doesn't allow you to see how the glyphs interact with each other at a more regular size, be it 12 pixels or 9 points.</p>
      <p>I found that sketching on cheap paper was a way to quickly test out shapes. If a shape looks OK, then quickly redraw it in your font editing software. If you redraw it without bothering to scan your sketch you might find that you quickly become better with bezier curves, and that you can iterate at a faster pace. </p>
      <p>This also means you don't have to spend time drawing every glyph perfectly on a larger sheet of paper. You just need to start with some base glyphs, space them as well as you can, and then print them out to see if they are or are not working together. If you post your tests to typophile you will get some good feedback. As it is, these large letterforms you've posted -- they're not a typeface. They're just nice drawings.</p>
      <p>Search this forum for which glyphs to start with. It will be something like:</p>
      <p>Lowercase:<br>
      Start with "o" an "n" then do print tests of "onononon" and adjust/correct spacing.<br>
      Fill in the rest of the glyphs in the word "adhesion." This contains most of the DNA for the rest of the glyphs.</p>
      <p>Uppercase:<br>
      HAQR (as, similarly, these will contain alot of DNA for the other caps)</p>
      <p>Once you have a few glyphs you can use this tool to generate words:<br>
      <a href="http://www.adhesiontext.com/" title="http://www.adhesiontext.com/">http://www.adhesiontext.com/</a></p>
      <p>In this way, you are prototyping a typeface design, rather than drawing letters on paper. This was a revelation to me, as I admit that I tend to get too precious with my drawings, which is a barrier to rapid prototyping and fast improvement.</p>
      <p>Software:<br>
      If you decide to buy Glyphs do not buy it from the Apple App store. I implore you! Don't make the mistake I did. Apple is extremely slow at approving software updates so those of us who stupidly purchased from the app store are stuck with older versions (my version doesn't work well on OS 10.6.8).</p>
      <p>Everyone has a different workflow and this one may or may not work for you!</p>
