      <p>Often, college-style typefaces are octagonal in construction too, so you could search for keywords such as "octagonal", "college", "varsity", and "sport".<br>
      Other than the very good suggestions from Alaskan, if you’re not particularly interested in quality, or are looking for a clumsy feel:<br>
      <a href="http://www.dafont.com/theme.php?cat=104" title="http://www.dafont.com/theme.php?cat=104">http://www.dafont.com/theme.php?cat=104</a></p>
