    html: |-
      <p>The style is called "Slab Serif" or Egyptian. There are several fonts with these characteristics. If you are a printer, your client should have the rights to use the font and therefore provide you with the font. If you want to have those copyrights yourself, you can find many <a href="http://new.myfonts.com/search/slab+serif+college+egyptian/fonts/" rel="nofollow">fine slab serif fonts here on myfonts.com.</a></p>
      <p>Personally, I think <a href="http://new.myfonts.com/fonts/exljbris/museo-slab/" rel="nofollow">Museo Slab is especially gorgeous.</a> And if you really want to look hip, you can't beat the sleekness of <a href="http://www.houseind.com/fonts/neutrafaceslab/fontspecimens" rel="nofollow">Neutraface Slab.</a> College kids and sports fans could really swoon over that stencil version of Neutraface Slab. </p>
      <p>If your target market is women &amp; men of all ages, check out <a href="http://typography.com/fonts/font_overview.php?productLineID=100033" rel="nofollow">Archer by Hoefler &amp; Frere-Jones.</a> Sure, it was deisnged for Martha Stewart - but that's why it's just so darn classy. I can see women choosing this font on a shirt for a gift for their man. (And, he'd actually like it!)</p>
