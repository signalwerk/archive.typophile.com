  html: |-
    <p>Hello all</p>
    <p>I am trying to design a classic looking book using initials for each chapter. Problem is that the chapters are facsimiles of old articles and cannot be changed. Some articles start with a number as the first character and some even start with quotation marks. All the good looking initial fonts I have seen so far do not include numbers or special characters, only upper case letters A-Z. Any ideas on how to design the page to work around this? Any good fonts to use as initials with a centaur font main text?</p>
    <p>Best regards<br>
    Geir Rosset<br>
    Oslo<br>
    Norway</p>
