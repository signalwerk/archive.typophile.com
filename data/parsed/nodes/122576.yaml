      <p>I assume you try to use some freefonts for the initials, because professional fonts have usually all necessary glyphs inside. So: Don’t use freefonts. </p>
      <p>Don’t know which style you want to have with your initials, but <a href="http://www.identifont.com/show?35V1" rel="nofollow">Centaurea Outline</a> could give a nice pairing with Centaur.</p>
