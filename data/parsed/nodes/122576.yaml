  - id: 597347
    user: 58010
    date: 2015-01-15T08:31:00
    date_raw: 15 Jan 2015 — 8:31am
    votes: null
    html: |-
      <p>You might want to post an example of the font you're using, and as Renko suggested you might switch to a different font.</p>
      <p>If the initial font you're using doesn't have numbers, a workaround might be to spell out the words — "Three" instead of "3".  </p>
      <p>In the case of a quotation mark starting the article, I'd probably use a regular quotation mark and then the next character would be large, as a large quote mark by itself would look weird. If your style is to make the initial caps flush left, do that and hang the small quote mark off to the left of the initial cap (probably raised above the baseline so it's near the top of the initial cap).</p>
