    html: "<p>Sure, makes sense.  A company like McDonald's can afford (and likely needs to afford) lawsuits to prevent the dilution of their brand. <br> <br>I'm not sure if the same is true for the aforementioned company in question. <br> <br>Here's some more info that I found on the subject: <br> <br>Copyright infringement requires \"substantial similarity\" of protected elements, whereas the test for traditional trademark infringement is \"confusing similarity.\" That is, the test for trademark infringement asks whether the ordinary buyer -- not looking for subtle differences or fine details -- would believe both products (or services) came from the same source. The key to trademark infringement is \"likelihood of confusion,\" i.e., whether two marks are sufficiently alike to cause consumer confusion as to their source or origin. Courts consider the following factors in determining likelihood of confusion:  <br> <br>1. Similarity of the conflicting marks;  <br>2. Relatedness or proximity of the two companies;  <br>3. Strength of the senior users mark;  <br>4. Marketing channels used;  <br>5. Degree of care likely to be used by purchasers in selecting the goods;  <br>6. The \"second comers\" intent in selecting its mark;  <br>7. Evidence of actual confusion;  <br>8. Likelihood of expansion in product lines  <br> <br> <br>TIP: To constitute trademark infringement, the two marks don't have to be exactly alike -- just confusingly similar. Unlike most things in life, close is good enough. Under the Trademark Dilution Act of 1995, which became law in 1996, the owner of a \"famous\" trademark can now stop someone from using its trademark if it tends to weaken, blur or tarnish the famous mark. Unlike traditional trademark law, which still applies, with trademark dilution you do not have to show any likelihood of confusion over the source or sponsorship of the goods or services. Trademark dilution is described in greater detail later in this article. <br> <br> <br>Trademark Dilution  <br> <br> <br>Trademark dilution refers to the whittling away of a famous trademark's distinctiveness through unauthorized use. Under federal trademark dilution law, the owner of a \"famous\" mark is entitled to stop another person's commercial use of its mark that dilutes, blurs or tarnishes its \"distinctive quality.\" Unlike traditional trademark infringement, neither likelihood of confusion, nor competition between the parties' goods is required.  <br> <br> <br>What the federal trademark dilution statute does (15 U.S.C. 1125(c)) is make parody and satire, especially in advertisements and commercials, a high risk endeavor. For example, where there's a negative or unwholesome connotation about a \"famous\" mark, courts are likely to enjoin use.  <br> <br>TIP: Trademark dilution only applies to strong marks. Dilution can occur when a well- recognized mark is parodied in an advertisement, even if there is no likelihood of confusion1.  <br> <br> <br></p>"
