    html: "<p>Well, context always helps. Like in choosing that \"secondary typeface\". But... <br> <br>- The hole in the \"ra\" needs help. You can't tighten the letters up too much more, but you might extend the beak of the \"r\" further down (be careful of making it look retarded though) and/or you can extend the right side of its foot serif. You might also try taking the beak of the \"r\" over and above the \"a\" (like in the original Cheltenham), assuming that much flair suits the client. <br>- The \"g\" is standing out, the way binocular \"g\"s tend to do during deliberative reading. You might not have to go to a monocular form, but it's gonna have to become much more straight-laced. <br> <br>Secondary typeface: although I don't like Futura, it might work here. <br> <br>Oh, and your thin vertical bar will have to change weight <br>with the size the logo is rendered (or actually, viewed) at. <br> <br>hhp <br></p>"
    html_clean: "<p>Well, context always helps. Like in choosing that \"secondary typeface\". But... <br> <br>- The hole in the \"ra\" needs help. You can't tighten the letters up too much more, but you might extend the beak of the \"r\" further down (be careful of making it look retarded though) and/or you can extend the right side of its foot serif. You might also try taking the beak of the \"r\" over and above the \"a\" (like in the original Cheltenham), assuming that much flair suits the client. <br>- The \"g\" is standing out, the way binocular \"g\"s tend to do during deliberative reading. You might not have to go to a monocular form, but it's gonna have to become much more straight-laced. <br> <br>Secondary typeface: although I don't like Futura, it might work here. <br> <br>Oh, and your thin vertical bar will have to change weight <br>with the size the logo is rendered (or actually, viewed) at. <br> <br>hhp <br></p>"
