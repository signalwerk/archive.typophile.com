    html: |-
      <p>Hey,</p>
      <p>I can answer this, if it hasn't already been solved?</p>
      <p>Caslon V was commissioned in 2003 by Fabien Baron, as a headline typeface for Vogue Paris (Hence the "V"). To my knowledge, it's not available to licence or buy.</p>
      <p>/T</p>
