    html: |-
      <p>It depends on which letters you need to make “come together” with your logotype.<br>
      There are mid-weight script typefaces which may be close but you’ll have to add any eventual interlocking by redrawing parts of them, so I’m not sure using a typeface is the best solution.</p>
      <p>Maybe you could start from something like this: <a href="http://www.myfonts.com/fonts/schizotype/gelato-script/" title="http://www.myfonts.com/fonts/schizotype/gelato-script/">http://www.myfonts.com/fonts/schizotype/gelato-script/</a> or this <a href="http://www.myfonts.com/fonts/bluevinyl/fancier-script/" title="http://www.myfonts.com/fonts/bluevinyl/fancier-script/">http://www.myfonts.com/fonts/bluevinyl/fancier-script/</a> but not sure it’s the best way to go: if you need to produce a similar logo, you have to draw it freehand.</p>
