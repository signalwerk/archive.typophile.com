  html: <p> I'm designing a ruler with millimeter marks on it, with requirements for numbers every two millimeters. Currently I'm setting it at 4.5pt Univers Condensed and it looks pretty good, but I'd love some other suggestions for condensed fonts that are highly legible at small sizes. Thanks in advance for any help anyone can offer. </p>
