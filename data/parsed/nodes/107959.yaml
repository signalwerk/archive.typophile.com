    <p>Hi! I've been trying to figure out what Font this is for a while now. I've used the google search terms "Modern sans serif font with line through middle," and other variations on this. Pier 1 Imports used this font throughout their store with all their branding for the fall/winter 2013 retail season. I just fell in love with the font and I'd love to use it in some of my designs. </p>
    <p>Any ideas?</p>
