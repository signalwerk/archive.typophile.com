      <p>Something between <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/kabel" rel="nofollow">Kabel</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/geometric-415/" rel="nofollow">Geometric 415</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/metro-2/" rel="nofollow">Metro #2</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/dhsans/" rel="nofollow">DH Sans</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/grouptype/grosse-pointe-metro/" rel="nofollow">Grosse Pointe Metro</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/examiner-nf/" rel="nofollow">Examiner</a>.<br>
      For the rest, <a class="freelinking external" href="http://typophile.com/node/94337#comment-514276" rel="nofollow">Kaleidoscope Magazine</a> is using a font called <a class="freelinking external" href="http://kaleidoscope-press.com/" rel="nofollow">AMB Kabel Ten</a> possibly by <a class="freelinking external" href="http://www.ok-rm.co.uk/#/project/kaleidoscope-13/" rel="nofollow">OK-RM</a>, <a class="freelinking external" href="http://typophile.com/node/97891#comment-529470" rel="nofollow">Snowdon Blue</a> <a class="freelinking external" href="http://www.snowdon-review.com/#/review-overview/" rel="nofollow">Snowdon</a> by <a class="freelinking external" href="http://www.ok-rm.co.uk/#/project/snowdon-review-2/" rel="nofollow">Matthew Fenton for OK-RM</a> and <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/513425" rel="nofollow">Verities Magazine</a> Scotland by <a class="freelinking external" href="http://www.haakonspencer.com" rel="nofollow">Haakon Spencer</a>.<br>
      You may like also <a class="freelinking external" href="http://swisstypefaces.com/fonts/euclid-bp/all-styles" rel="nofollow">Euclid</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/circe" rel="nofollow">Circe</a>, <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T1795" rel="nofollow">TJ Evolette</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/diamonds" rel="nofollow">Diamonds</a></p>
