    html: |-
      <p>Hi Steven<br>
      This is looking pretty polished already. It definitely looks friendly and useable. I love the proportions and design. There's a nice amount of space overall (because I'm currently struggling with spacing in my font!). Your a reminds me a bit of Chaparral.<br>
      The two things that jump out at me are your Q and the vertical serifs. The Q I think could try a straighter southwest curve and tail. The vertical serifs on CEFGSTZs and z seem too straight to me, especially against the curves serifs of adhijklmnpqr and u. I'm not sure what the solution is, but perhaps they need to be wider and/or shorter?<br>
      Could W be a touch wider or Z narrower? Could the knee of k be a bit lower? I love the shape.<br>
      The capitals with curves look like their sidebearings might be a bit wide.<br>
      The two heavy strokes of M are not balanced, I think. L looks narrow.<br>
      Well done with this, it'll be really nice :)</p>
