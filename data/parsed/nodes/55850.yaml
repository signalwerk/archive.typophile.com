    html: |-
      <p>Thank you so far for your comments. I have uploaded a new PDF (_002.pdf) and changed some points you mentioned. The major changings are at the k and Q shown at the picture. Also I tried to correct the diagonal contrast a bit and the sidebearings of the round capitals.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/QQkk_4222.gif"></div><p></p>
      <p>I designed the font for small sizes from about 7 to 9 points. This is the regular weight but maybe I should make a little lighter version and make the semibold versionout of this!? </p>
      <p>I wanted to achieve a calligraphic, fresh and smooth look but on the other hand it should have a classic and not too clean apperance. Fonts I looked at were mostly Rialto, Maiola, Palatino and Dolly.</p>
      <p>"cfr" have pen shaped terminals and the "s" have a single sided serif like in venetian faces. If I would change the serif of the "s" and make it pen shaped like "cfr" the "z" would be the only letter that matches the spured serifs of the capitals. </p>
      <p>And thanx Hrant for warning me about the name Apollonia. Maybe someone has a better name for it. I am grateful for every suggestion.</p>
