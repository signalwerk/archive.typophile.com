    user: 13487
    date: 2009-03-14T03:51:00
    date_raw: 14 Mar 2009 — 3:51am
    votes: null
    html: |-
      <p>This is looking good! What's it for? I'm assuming text (and looking at the vertical metrics, I'm guessing books rather than newspapers)? It'd be great to have a bit more info.</p>
      <p>Here are a few comments, be sure to have salt ready.</p>
      <p>It's great to see bdpq executed like this. If you don't mind telling, where do these come from (read, what other fonts were you looking at while making them)?</p>
      <p>I really like the "a" too – it's beautiful.</p>
      <p>I wonder about the terminals on the "c", "f" and "r" (the latter seems a bit too soft/bulbous/stubby in context). Have you tried using it on the "s" as well? Because with its rather long straight serifs, the "s" looks surprisingly hard/determined/closed in comparison. Then again, comparing with the caps (see below) maybe the "s" is cool, and it's that c/f/r terminal that is too soft?</p>
      <p>I'm not sure about the "k"; it looks beautiful by itself, but seeing it in text* I'm wondering if the leg might need more air.<br>
      * Assuming this is meant for text.</p>
      <p>Looking at the caps: Is it intentional that they're notably spikier/"harder" than the lowercase? The "C" looks especially Dracula-esque ;-). (It might also be leaning left a bit.)</p>
      <p>There seems to be something slightly lopsided about the weight/contrast on the "M". Also, the heavy diagonal of the "A" might be a hair heavier than say the one on the "N"?</p>
      <p>The "Q" is an interesting experiment! Something slightly Non-Latin-looking about it. But it doesn't quite work for my eyes yet. It has a slightly uncomfortable lean/twist, and looks kind of large; the tail may also be looping up a bit too much, almost clashing with say a following "u".</p>
      <p>"T" might be a bit wide? Also, I think your "To" is overkerned.</p>
      <p>"W" might be a bit heavy (though it might just look like that on my printout), and slightly unbalanced.</p>
      <p>By the way, please switch off automatic ligatures in InDesign when making your samples as long as you don't have any. ;-)</p>
      <p>I'm beginning to note some interesting stylistic confluences in the Serif board. Must be something in the air. :-)<br>
      I'll be curious to see this progress.</p>
