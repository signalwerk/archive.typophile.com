      <p>Well, both* can work, but first you should decide the intended point size of the design; although the process of designing will always reveal unexpected useful directions, eventually you to have make willful decisions on them. So the necessary darkness, proportions and spacing will come out only once you make the intended size decision.</p>
      <p>* And there's a third option: lightening. Although I'm starting to think that maybe it's not impractically dark after all.</p>
      <p>hhp</p>
