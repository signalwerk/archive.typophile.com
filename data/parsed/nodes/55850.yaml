      <p>Ok, I say what I think:</p>
      <p>- The serifs of the lowercase have a peculiar shape, I would like to see the same kind of logic applied to the capitals too.<br>
      - I would also try to make the foot serifs of n,m, etc. more asymmetric.<br>
      - I think you can also try different alternatives for Q, maintaining the same concept of a single movement.</p>
