  html: |-
    <p>HI,<br>
    My community club is celebrating its 90th anniversary. I said I would make banquet table cards in a 1919 style of lettering. I volunteered cause I knew if someone else did it, we'd end up with Comic Sans and it would irritate me all evening. </p>
    <p>What would a suitable 1919 font be? I thought of Belwe, Bolton, Bernhard Modern, or Windsor. Am I right? </p>
    <p>I also thought of a Rennie MacIntosh style, but the members might not recognize that at all. </p>
    <p>It has to be very legible cause the lights may be dimmed, and some of the old-timers are past 80, so their eyes aren't what they used to be.  </p>
    <p>THANKS in advance!</p>
  html_clean: |-
