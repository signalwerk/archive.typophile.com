      <p>The outstretched arms are a visual platitude, a cynical attempt at crowd-pleasing, comparable to a political promise of less taxes. As HG Frankfurt concluded, "Sincerity is bullshit" -- and happy happy joy joy, aspiration and outreach are not the purpose of government (although they may be suitable for some government departments). This has certainly been proven as democratic governments have cracked down on civil liberties in the wake of 9/11 and 7/7. Regulation and enforcement are a responsibility of government, and by ignoring that aspect, the new logo becomes Orwellian.</p>
      <p>***</p>
      <p>The outstretched arms are reminiscent of that classic Canadian debacle of public art/design, the WW2 VC pilot's memorial on University Avenue, Toronto, known as <a href="http://spacing.ca/art-how-did-that-get-there.htm" rel="nofollow">Gumby Goes to Heaven</a>, which is often referenced whenever Torontonians talk about bad public art.</p>
    html_clean: |-
