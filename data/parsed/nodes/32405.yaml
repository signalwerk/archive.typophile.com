      <p>@ Nick Shinn - 25.Mar.2007 10.52am</p>
      <p>That "receding perspective" Star Wars logo on that poster you've displayed there (second from top) was the logo that was drawn by Dan Perri.</p>
      <p>The logo I drew is presented in that additional poster you presented, third from the top (or, the last one presented at the bottom of your stack of images).</p>
      <p>Dan Perri was contracted to design the titles(*) for the film ("Star Wars" later titled "Star Wars, Episode IV...").  Thus, that receding perspective logo he drew; which, however, didn't work visually for George when he applied it to the screen, in the title treatment.</p>
      <p>Thus, the logo (last poster in your stack there) I drew for the Exhibitor's Bid Brochure ("STAR WARS" stacked on two lines), which George liked, he used to replace Perri's logo.  That's how my logo ended up being the main title treatment and, of course, trademarked in use for the entire film episodes, all, as also marketing of the film, etc.</p>
      <p>I also designed a poster for John Williams and touring symphony performance of the soundtrack, which George liked and used as Christmas cards for Lucasfilm later, as also some marketing elements I designed later once the logo I designed/drew was just about everywhere used for everything.</p>
      <p>(*) titles for a film, or, a "title treatment" is the visual stream of typed information that is embedded in a motion picture to present a film's credits;</p>
      <p>Whereas, a "logo" is the name or title of a film only.</p>
      <p>Thus, a title treatment INCLUDES a logo or title-in-type but also includes the full array of credit information, and is a "treatment" or type of animation-of-sorts that is embedded in a film (how the typed information is designed to show visually, etc., a "treatment" of "title").</p>
