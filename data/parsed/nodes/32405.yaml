  html: |-
    <p>While Googling the name of Helvetica's designer, Max Miedinger, I came upon <a href="http://suzyriceimage.com/AUTOBIOGRAPHY_2.html" target="_blank" rel="nofollow">this startling account</a> by Susan Elizabeth (Suzy) Rice, creator of the Star Wars logo.</p>
    <p>If her words are to be taken literally, then Joseph Goebbels designed a typeface! I'm thinking that perhaps he gave the order to start using sans serif faces, but as far as designing a face himself... Sheesh. Does anyone have information on this, or any idea what book about German type design Ms. Rice might be referring to? (And Gary Hustwit, do you have any thoughts on this?)</p>
  html_clean: |-
    <p>While Googling the name of Helvetica's designer, Max Miedinger, I came upon <a href="http://suzyriceimage.com/AUTOBIOGRAPHY_2.html" target="_blank" rel="nofollow">this startling account</a> by Susan Elizabeth (Suzy) Rice, creator of the Star Wars logo.</p>
    <p>If her words are to be taken literally, then Joseph Goebbels designed a typeface! I'm thinking that perhaps he gave the order to start using sans serif faces, but as far as designing a face himself... Sheesh. Does anyone have information on this, or any idea what book about German type design Ms. Rice might be referring to? (And Gary Hustwit, do you have any thoughts on this?)</p>
