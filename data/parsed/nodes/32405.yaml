    html: <p>It's worth noting that the Star Wars logo's typeface-style borrowing from Planet of the Apes's typeface style may not be serendipitous. Star Wars was perhaps the most thoroughly marketed science-fiction film up until the time of its release. The previous record holder was Planet of the Apes. The folks marketing Star Wars studied Planet of the Apes's marketing campaign when they were designing their own campaign, so they would have been heavily exposed to that logo.</p>
