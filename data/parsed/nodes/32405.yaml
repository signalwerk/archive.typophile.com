      <p>I have read most of that (rambling…) post by Ms Rice &amp; there are a lot of inaccuracies in there. Especially about the Nazi's having designed the forerunner of Helvetica. (BTW The german spelling of Helvetica is Helvetica and NOT Helvetika).<br>
      Another miss: the alleged authorship of the early Disney-cartoons. It is widely accepted nowadays that Mr Disney's collaborators had a greater part that they got credited for, especially Ub Iwerks who gave life to Mickey Mouse.<br>
      My conclusion: it's a lot of b*llsh*t.</p>
