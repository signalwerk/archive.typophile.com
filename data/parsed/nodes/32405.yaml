      <p>According to MyFonts, Schelter Grotesk was originally called Breite Grotesk, and appeared "in the 1886 specimen book of the Schelter &amp; Giesecke foundry". The specimen there does look more like Helvetica than Akzidenz Grotesk does.</p>
      <p>However, the original Breite Grotesk seems not to have been identical to the the Schelter Grotesk specimen on MyFonts:</p>
      <p><a class="freelinking external" href="http://www.flickr.com/photos/20994543@N04/4552638955/" rel="nofollow">http://www.flickr.com/photos/20994543@N04/4552638955/</a></p>
      <p>Instead, that looks simply like many of the other sans-serif faces of the same period, without much that suggests, at least to my untrained eye, that it is a precursor of Helvetica, which differs in important ways from the old Grotesques.</p>
