      <p>im not really sure how much this scheltersche-helvetica-link is a PR-story to sell FF Bau and how much it is really worth. when looking at the german specimen book that is available to me (a fat one by bauersche schriftgiesserei around 1900), many grotesks at that time (or earlier, in the 1880ies) could've been a precedessor to helvetica, altough they're wackier than scheltersche. but then again, why look 70 years from the starting point of helvetica, why not a bit less and look at AG?</p>
      <p>but im by no way an expert myself, so this is all speculation and i would be very interested in hearing eriks extended view of this issue, and why exactly he thinks scheltersche grotesk is the father of helvetica.</p>
