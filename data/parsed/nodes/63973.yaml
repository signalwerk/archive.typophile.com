    html: <p>IMVHO very interesting. Descenders are typically shorter than ascenders because they play a lesser role in making the font legible. If you want to look at asymetric serifs which work very well, check Ambroise from Jean-François Porchez and note how he follows the ductus to achieve this. You can also balance the serifs on a diagonal (NW with SE and SE with NW on the I for example); or you can alter the design of the serifs so they are visually the same length despite not being the same length (unfortunately the Marcellin Legrand has not been digitised yet, or this would give you a great example for your V &amp; X serifs). Just ideas, of course. I am not an expert like the others are.</p>
    html_clean: <p>IMVHO very interesting. Descenders are typically shorter than ascenders because they play a lesser role in making the font legible. If you want to look at asymetric serifs which work very well, check Ambroise from Jean-François Porchez and note how he follows the ductus to achieve this. You can also balance the serifs on a diagonal (NW with SE and SE with NW on the I for example); or you can alter the design of the serifs so they are visually the same length despite not being the same length (unfortunately the Marcellin Legrand has not been digitised yet, or this would give you a great example for your V &amp; X serifs). Just ideas, of course. I am not an expert like the others are.</p>
