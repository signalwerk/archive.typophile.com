      <p>Hi Thomas</p>
      <p>Nice to see some cool caps. </p>
      <p>One thing I notice is that some letters need optical correction to share the same baseline, cap-height or x-height.<br>
      I think your 'A' looks too short. The asymetrical serifs on the 'H' makes the it look a bit out of balance. Especially the lower right one looks too long in my opinion. Maybe one of the legs needs to be flipped so the serifs get mirrored. The 'I' might have the same asymetrical issue. The 'M' could need a wee bit more white in the right counter. (does that make sense?) Pull the right leg a bit to the right. There is something about the curves in the 'O' which needs tweaking. Some parts look a llittle wobbly. Also look at optical correction of this letter. A little more overshoot to make it appear the same heigth as  the rest of the letters.<br>
      'W' and 'V' need to drop a little more below the baseline to fit the other letters' heights.</p>
      <p>Once again I like the overall look of your typeface. </p>
      <p>Magnus</p>
