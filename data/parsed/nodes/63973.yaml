      <p>Hi Thomas</p>
      <p>I agree with the above. As a first attempt it is very good.<br>
      Some letters do need work as Tomi said.<br>
      The 'o' looks a bit strange. Maybe too much broadnib going compared to the rest of the letters. It is a bit squarish looking. Try making it rounder.<br>
      I think the 'e' needs a redrawing. It needs more weight to the bottom left and needs a bit of a straightening up. It is tilting a bit to the right. Try looking at some typefaces’ 'e's and 'o's. See how the weight is distributed  diffenrently. Also take a look at 'c' while you're at it. I know you haven't got a 'c' in your example but it doesn't hurt to read ahead. ;-)<br>
      The 'r'. Try lowering the joint of the arm a bit down on the stem and thicken the arm.<br>
      I think the top of the 'f' is 'curling' a little bit too much. Maybe it is just me.</p>
      <p>Anyway nice work.</p>
