      <p>Ah nice. Much better.</p>
      <p>I know I told you to thicken the arm of the 'r'. But I could have explained m yself better.<br>
      The place where the arm joins the stem is maybe a little too thick now compared to letters like 'm' and 'n'. See attached image.<br>
      I like the 'f' but I can't quite see the exact shape of the terminal in your example. Can you make a bigger image or maybe a pdf?<br>
      I think the 't' is too light at the bottom.</p>
      <p>On drawing a 'g'. How do you draw your other letters? Do you start with pen and paper doing sketches or are you at it directly on the computer? I think it is easier to make quick sketches on paper to get the basic idea of the shape. Do a bunch. Do some with a broadnib pen too to get an idea of contrast. Then pick the best and refine it. Then transfer it to the computer either by scanning or eyeballing your sketch.<br>
      In Fontlab you can then fiddle with points until you are satisfied. But starting in Fontlab can be hard if you have no idea of where to put the points to begin with.<br>
      Here I am pretending that you are using Fontlab but of course any font software of your choice will do.</p>
      <p>Looking forward to seeing the next letters.</p>
      <p> </p><div class="imageWrap"><img src="https://web.archive.org/web/20150124145415im_/http://typophile.com/files/r_5694.png"></div><p></p>
