      <p>IMVHO, what the g needs is mostly to be less flowing, at the moment, it is very 'diagonal', whereas your typeface calls for something more orthogonal (vertical v. horizontal). I would not go as far as Ambroise or Didot Elder, but look at least at Bodonis, Didots etc. then mend your design, without copying what you see.</p>
      <p>The solution used by the outstandingly fantastic minuscule is mostly for characters with very small ascenders &amp; descenders. It can be seen in fat Bodonis too.</p>
      <p>As always, I might be wrong.</p>
