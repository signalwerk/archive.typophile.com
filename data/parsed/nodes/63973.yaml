      <p>Understood. Beware, though, that the spacing is an integral part of the design of a character/glyph. When you space out more, you'll be tempted to enlarge some of the glyphs so they don't float too much. </p>
      <p>IMVHO, as it stands, the z looks a little too wide, the w a little too wide too (and a bit too similar to two siamaese-v ), the t is too weak in general (and you may need to make a choice about the upper left part: vertical or diagonal, not in-between), the b is weaker than the d (are you sure you got your optical correction right at the bottom?), the i si too narrow. It is, however, difficult to tell inside a word. Try just presenting the glyphs next to each other and tell us which are your reference glyphs (the ones you think are successful and you don't want to change).</p>
      <p>ps. f may look too weak too and y too weak at the bottom. The horizontal bar of the f and t don't have to be at the same height as the serifs of the x-height glyphs. Lower them and your character may find their balance. </p>
      <p>pps. Good work all in all.</p>
