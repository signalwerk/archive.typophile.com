    html: |-
      <p>Personally I don't think settling for a non-polished result is a good reason to give a font away; because people will form an impression of your work which will affect whether they will eventually pay real money for any font you make in the future! The only reason I can think of to stop a font early is: it was just an exercise anyway and you've learned what you could from it; or you think it was (or has become) a bad idea in terms of potential sales.</p>
      <p>So I think this can be "foundry material" (hopefully that doesn't mean fit for a hellbox :-) as long you stick to it and polish it to a really nice lustre.</p>
      <p>BTW, about taking a break: it seems to work for many people (including myself), even when you don't see anything to improve! But know that the hibernation period might need to be in weeks, not days.</p>
      <p>hhp</p>
