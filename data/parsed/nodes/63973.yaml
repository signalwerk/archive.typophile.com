      <p>Hi, Thomas-</p>
      <p>If this is your first attempt, my hat off to you; it has a very nice feel to it, especially considering your attempt to create a font for small size use. More narrow design would work against that goal.</p>
      <p>I did notice some of the mistakes I made with my first fonts: 'm' is a bit wide, top of 'a' comes a bit too far to the left (overall width is good), your 'u' is a bit too wide (compare 'n' and 'u', and since 'u' is open on top, and 'n' is open on bottom, u should be a little bit narrower. And indeed, your 'e' does need some work. Your arm of 'r' is a bit thin: I did that too when I first started; I just cut the 'n' and fiddled with it a little to make it work. It needs more mass on the arm. Your 'f' seems odd as well. Why did you decide to slant the terminal? You can always do that with a ligature, if you want to leave room fo the dot of the i. I would also work a bit more with 'o': the width of it looks good, but it seems to try to be an italic. Keep the basic shape more upright, and work with counter shape to give it some diagonal stress.</p>
      <p>But like I first said: a very good start.</p>
