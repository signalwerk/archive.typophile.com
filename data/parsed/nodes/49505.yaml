      <p>As no one else seems to be able to identify this font, my suggestion would be to go to <a href="http://www.sudtipos.com" title="www.sudtipos.com">www.sudtipos.com</a> and try to find something close to this.  Sudtipos is probably a good choice for this kind of font.</p>
      <p>Alternatively, you could try <a href="http://www.letterheadfonts.com" title="www.letterheadfonts.com">www.letterheadfonts.com</a></p>
      <p>JH</p>
