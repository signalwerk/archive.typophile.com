  html: |-
    <p>Hello,</p>
    <p>I've used a font in Microsoft Word, which works fine except when I need to type circumflex-accented glyphs.<br>
    In general, I've noticed that when you type a circumflex, before typing the letter you want to accentuate, you temporarily get the ASCII circumflex. Then, when you type the letter, say "a", the correct circumflex is used in the pre-built accented glyph.<br>
    So, in the present case, when I type "^" plus "a", Microsoft Word changes to Times. This behaviour rang a bell, so I opened the font in FLS and the ASCII circumflex is missing from the problematic font file. My assumption is that as Word can't find that glyph (ASCII circumflex), it switches to another default font.</p>
    <p>2 questions:</p>
    <p>– Is it a Microsoft Word "bug"?</p>
    <p>– How can you avoid such a problem if you design a typeface and don't feel like drawing the ASCII circumflex?</p>
    <p>Thanks &amp; best,</p>
    <p>Mathieu</p>
