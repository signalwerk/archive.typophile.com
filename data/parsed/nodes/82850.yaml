    html: <p>From your description of the symptoms, I would say yes. I would also point out that this is not a character that no one ever uses—you used it yourself when you typed the sequence for acircumflex. Leaving out a standard character that applications expect to be present, you risk having things like this occur. Whatever benefits you think it may provide, it's probably not worth it, as your problem illustrates.</p>
