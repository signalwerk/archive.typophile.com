    html: |-
      <p>"Can anyone recommend a typeface that ’looks’ spoken?"<br>
      The short answer is, any typeface that has quotation marks would do something of the sort (so to speak). "Does this look spoken?" Hope so.:) Sure, you can throw a speech balloon around anything and make it "spoken" as well... or can you?... There is a much longer answer that goes back to the notion that all type selection is a choice between one "tone of voice" and another. This has broken up a bit with the advent of fonts popular because they include in their design predefined faults associated with poor output (grunge) or limited compositional capabilities (monospace or stencil). Some of the examples above with grunge in a balloon make the point quite well that the more personality in the design, the less range of spoken word can be effectively carried, even <em>with</em> a balloon. Another example of this would be to visualize the stencil font appearing elsewhere on your screen in either quotes or a balloon. How many tones of voice would that carry effectively? So what looks spoken? Or what doesn't look spoken? Point size and other composition requirements are important obviously, but just what tone of voice is to be conveyed should be explained before a range of choices could possibly be explored, in my opinion. If on the other hand a speech balloon is inevitable, then comic book lettering is going to be the choice through sheer familiarity of the user.</p>
      <p>"...speak into a mic and see what comes out..." lol, good luck. Or I should say, reverse it (at least in your mind), and try making a tone of voice for just a few 1000 fonts.</p>
      <p>Cheers!</p>
