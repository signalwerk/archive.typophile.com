    <p>Hello all,</p>
    <p>Well here is a good one for anyone who wants a challenge!</p>
    <p>I am currently designing an advert in which the headline copy is a transcript from a phone conversation. Initially I thought about a handwritten typeface to make it look more relaxed, informal, etc. Most typefaces that I found are not quite right as they are too stylised or the balance between the characters are too eratic.</p>
    <p>So The question I am setting...</p>
    <p><strong>Can anyone recommend a typeface that 'looks' spoken?</strong></p>
    <p>Many thanks<br>
    Javier</p>
