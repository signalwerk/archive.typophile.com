    <p>I noticed that FontFont sells every style for Western and Eastern European encodings of FF Kievit, but not the Cyrillic and other varieties as well. The latter is sold by Paratype, either through the FontFont or Paratype online stores. Where can I get the "omnibus" edition with all languages and styles? </p>
    <p>Actually I have the same question regarding ITC Charter, as I get confused by its distribution by different vendors as well. Is this an issue of licensing, or of farming out the work to create all the localized glyphs?</p>
    <p>thanks,<br>
    Enrico</p>
