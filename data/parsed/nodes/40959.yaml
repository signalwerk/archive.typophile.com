      <p>Hi Enrico. FontShop does indeed sell every version of FF Kievit. Perhaps you missed a few because you were browsing our site with the non-Western fonts filter turned on. See the top of your search results page to see if that's the case, but <a href="http://www.fontshop.com/search/?q=kievit&amp;nw=1&amp;site=d&amp;num=100" rel="nofollow">here's a list of all the FF Kievit packages</a>.</p>
      <p>Twardoch's recommendation is the best one. FF Kievit Pro includes all the multilingual character sets in a single, convenient OpenType font for each style.</p>
      <p>For your future reference <a href="http://www.fontshop.com/fontfeed/archives/opentype-fontfonts-and-the-languages-they-speak/" rel="nofollow">here's a table of all the OpenType FontFonts and which languages they support</a>.</p>
