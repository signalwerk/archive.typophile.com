    html: |-
      <p>Final suggestion, involving a bit of dark magic:</p>
      <ul>
      <li>place pdf in inDesign</li>
      <li>draw a paper-colored box covering the logo</li>
      <li>set the box's transparency to multiply, so it becomes transparent (make sure in your flattener preview for "Affected Graphics" the whole logo turns pink)</li>
      <li>make a transparency flattener preset with "Convert All Text to Outlines" checked</li>
      <li>export a new PDF, using the new flattener preset</li>
      <li>open the new PDF in illustrator!</li>
      </ul>
