    <p>Quick technical question, and sorry if it's silly:<br>
    I have a PDF with a wordmark that I need to use. The wordmark is set using a font that I don't have (and don't plan on getting for this one job). The PDF is displaying fine (as the font is embedded) but if I open the PDF in Illustrator it replaces the font.</p>
    <p>Now: Do I *need* to ask for a new PDF with outlined fonts, or is there any way to somehow outline/vectorize the fonts inside the PDF? I do need the logo in vector form, if at all possible.</p>
