      <p>I followed Dan's (Pica Pusher's) method and find it very handy. Thanks Dan.<br>
      A note to InDesign CS4 users: In order to select the transparency flattener preset in the Advanced panel of the Export Adobe PDF dialog, you have to change your compatibility from the default "Acrobat 5 (PDF 1.4)" to an older standard. Acrobat 4 (PDF 1.3) works.</p>
