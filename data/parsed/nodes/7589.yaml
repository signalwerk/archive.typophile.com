    html: "<p>Hi Paul, <br> <br>I've used Indy for a while, and I'm still learning about typography proper (I don't think you ever stop), but these are the settings I'm currently using: <br>(Using justified body text as an example) <br>1. In InDesign&gt;Preferences&gt;Composition: Turn on \"Show H&amp;J Violations\" (this will highlight tight or loose lines for you) <br>2. In the Paragraph Palette, check if you want hyphenation or not, then in the pull-down menu turn on the Paragraph Composer. (There's also a \"Balance Ragged lines\" option here that I haven't explored yet. That doesn't apply here anyway.) <br>In the Justification... section: <br>Wordspacing: 80%, 100%, 133% (The wordspacing only works when your text is justified. Set \"Desired\" to less than 100% to tighten wordspacing IF it needs it. Storm fonts seem to set pretty tight to me at these settings.) <br>Letterspacing: 0, 0, 0 ( I still have things to learn so I stay the hell away from letterspacing anything but SCaps!) <br>Glyph Scaling: 98, 100,102% (or don't use at all - check if it helps or not) <br> <br>Then when you see a highlighted line showing a H&amp;J violation, select the line and you can kern the Wordspacing only (not the letterspacing!) by Option-Command-Delete to remove word space, or Option-command-Backslash to add wordspace.  <br> <br>If you're hypenating text, set the hyphenation slider to 2 or 3 notches to the left of center. <br> <br>Needless to say, if anyone here knows InDesign and typography and can see from my settings that I'm wrong or could improve it, PLEASE let me know!!</p>"
    html_clean: "<p>Hi Paul, <br> <br>I've used Indy for a while, and I'm still learning about typography proper (I don't think you ever stop), but these are the settings I'm currently using: <br>(Using justified body text as an example) <br>1. In InDesign&gt;Preferences&gt;Composition: Turn on \"Show H&amp;J Violations\" (this will highlight tight or loose lines for you) <br>2. In the Paragraph Palette, check if you want hyphenation or not, then in the pull-down menu turn on the Paragraph Composer. (There's also a \"Balance Ragged lines\" option here that I haven't explored yet. That doesn't apply here anyway.) <br>In the Justification... section: <br>Wordspacing: 80%, 100%, 133% (The wordspacing only works when your text is justified. Set \"Desired\" to less than 100% to tighten wordspacing IF it needs it. Storm fonts seem to set pretty tight to me at these settings.) <br>Letterspacing: 0, 0, 0 ( I still have things to learn so I stay the hell away from letterspacing anything but SCaps!) <br>Glyph Scaling: 98, 100,102% (or don't use at all - check if it helps or not) <br> <br>Then when you see a highlighted line showing a H&amp;J violation, select the line and you can kern the Wordspacing only (not the letterspacing!) by Option-Command-Delete to remove word space, or Option-command-Backslash to add wordspace.  <br> <br>If you're hypenating text, set the hyphenation slider to 2 or 3 notches to the left of center. <br> <br>Needless to say, if anyone here knows InDesign and typography and can see from my settings that I'm wrong or could improve it, PLEASE let me know!!</p>"
