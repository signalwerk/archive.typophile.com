      <p>I just took a gander at the previous post, there are definitely some very nice improvements with this set.</p>
      <p>Are you planning to keep all the fonts the same weight or do a bolder version also?<br>
      I'd be interested to see what the LJ combination looks like now with the tighter spacing.</p>
      <p>Some nit-picky things to consider:<br>
      I think the W needs to be slightly wider (maybe 1.5 times the width of the X) and the M strokes seem thin compared to the N (consider pulling the inside points down to thicken the M a little more). At least from a distance the M needs to be meatier.</p>
      <p>You might want to consider closing the bowls of the 6 and 9, or at least one of them. The top tip of the 1 seems slightly over pronounced, could you curl it back like the U? The 8 seems squooshed on the bottom (is it as long as the 0?). Finally, the 4 still seems narrow, it's definitely the curve of the stroke. Have you consider opening the top more, like this: <a href="http://flickr.com/photos/rehvonwald/361027843/" title="http://flickr.com/photos/rehvonwald/361027843/">http://flickr.com/photos/rehvonwald/361027843/</a></p>
      <p>There are my opinions, take them for what their worth. Either way, you have a nice looking font on your hands and will look awesome on a jersey. I love that R! This font definitely has character.</p>
    html_clean: |-
