    <p>Hello again</p>
    <p>Thanks for the input before, <a href="http://typophile.com/node/40047" title="http://typophile.com/node/40047">http://typophile.com/node/40047</a>, i thought I'd make a new thread to get it noticed.</p>
    <p>I have modified it and I would like to know what you all think. Legibility and the 'colour' are of importance, I don't want some looking too dark.</p>
    <p>There will be no lowercase as this typeface is intended for use on the back of football shirts.</p>
    <p>I look forward to hearing from you.</p>
    <p>Tom</p>
