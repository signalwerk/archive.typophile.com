    html: |-
      <p>Tom: I started a new thread only to attach my suggestions PDF, I'm not attempting to hijack your font or anything alike that.</p>
      <p>And I mean no disrespect to your lovely letters, I just thought it be easier to illustrate my suggestions by modifying your existing PDF letters. I made adjustments to the L,J,1,4 and 6. Take them with a grain of salt. The spacing isn't adjusted properly to reflect my changes.</p>
      <p>While making these changes I realized that the LJ combo might actually be First Initial Last Name. In which there would should be more space between the LJ, which would break up the forming "U". I can't think of any other times LJ are side by side that you might encounter, but I could be wrong.</p>
      <p>I hope you find my suggestions helpful. This is really turning into a nice font.</p>
      <p>The PDF can be found here: <a href="http://typophile.com/node/40559" title="http://typophile.com/node/40559">http://typophile.com/node/40559</a></p>
