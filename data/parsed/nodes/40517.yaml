      <p>I didn't try a combination of my J with your L, give that one a gander and see if that might sway you more. Anything to help break up that "U" that's forming. I actually felt kinda bad straightening your L out, the curves in your letters make the font unique. Straightening the L just made it seem less unique.</p>
      <p>What about the 1 and 4? I didn't do much with the 4, just extended it slightly more to the left, so the entire shape was maintained. The 1 however, I mimicked the curve of the U more.</p>
