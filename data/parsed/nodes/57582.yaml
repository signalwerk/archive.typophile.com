    <div class="info">Submitted by <a href="/user/3095" title="View user profile.">billdavis</a> : 1.May.2009 12.28pm </div>
      <p>To help celebrate <a class="freelinking-external" href="http://www.freecomicbookday.com">Free Comic Book Day</a> the <a class="freelinking-external" href="http://www.ascenderfonts.com/info/comic-book-fonts.aspx">AscenderFonts.com</a> website is offering a select range of comic-style fonts at 50% now through Sunday, May 3rd. The fonts are in both TrueType and OpenType formats, and the selection of fonts on sale includes the font everyone loves to hate: <a class="freelinking-external" href="http://www.ascenderfonts.com/font/comic-sans-family.aspx">Comic Sans</a>!</p>
    <p></p><div class="imageWrap"><img src="/files/comics_4007.jpg"></div><p></p>
    <p><em>Hurry - this 50% off sale ends Sunday, May 3. Check it out the fonts on sale at: </em><a class="freelinking-external" href="http://www.ascenderfonts.com/info/comic-book-fonts.aspx">http://www.ascenderfonts.com/info/comic-book-fonts.aspx</a></p>
    <p>Free Comic Book Day is this Saturday May 2, 2009. It is held on the first Saturday in May at participating comic book specialty shops across North America and around the world. These stores give away comic books absolutely free to anyone who comes into their shops. Comic books are fun to read and are an original American art form. For more information and to find a participating comic book specialty store visit <a class="freelinking-external" href="http://www.freecomicbookday.com">http://www.freecomicbookday.com</a><br>
    </p><div class="imageWrap"><img src="/files/savethedate_square250x250_5332.jpg"></div><p></p>
