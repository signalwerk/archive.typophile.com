      <p>If you like Vera, try the Vera derivative <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page" rel="nofollow">DejaVu</a>.</p>
      <p>While Bitstream Vera Sans' <cite>Embedding</cite> field shows as blank for me, DejaVu Sans' <cite>Embedding</cite> field correctly shows as <cite>Installable embedding allowed</cite>.</p>
      <p>The Bitstream Vera package contains 10 fonts, and has not been updated since 2003. The DejaVu package currently contains 21 fonts, and is updated every month.</p>
