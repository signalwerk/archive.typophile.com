    <p>hi there,</p>
    <p>i'm looking for a "good" sans family free font that license allows embedding. as far as i remembered bitstream's vera was a good choice, but when i try to embedd it (in adobe designer) it gives me the message that vera's font license does not allow embedding?!</p>
    <p>i'm looking for at least 2 faces because i'm doing business forms design which need dynamic contents (pre-filled by the system and/or the user), so i need a least a regular and bold face :)</p>
    <p>any further suggestion for an alternative to vera?</p>
    <p>thanks: lars</p>
