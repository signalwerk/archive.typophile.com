      <p>&gt;i’m doing business forms design which need dynamic contents</p>
      <p>That techncially narrows the choice to 'editable' or 'installable' embedding (Print and preview won't cut it), and perhaps is why you're having difficulty locating fonts. Having said that, if you find a free font you like, I can't see why the creator wouldn't be willing to set the font to editable if you were to ask - probably something they just overlooked.</p>
