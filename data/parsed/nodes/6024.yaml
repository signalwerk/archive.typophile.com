    html: <p>It looks like one of the 300 Handwritten Fonts that were issued by ClickArt in 1995 on a CD collection, but looking through that catalog didn't show the same font. There are some similar fonts issued by various foundries. I have collected roughly 500 fonts of this hand printed style (including the ClickArt fonts) in <a href="http://bowfinprintworks.com/Script11Pg1.html" target="_blank">Part 11</a> of my Script Font ID Guide, but you should realize that this font style can be easily and cheaply created. There are more freeware and one-of-a-kind handprinted fonts than you can start to hunt through, so my advice is usually just find something similar, and go with that.</p>
