  html: <p>Someone at my studio modified this font a few years ago and changed the name from the original. We are trying to track down the original so the client can buy it, but nobody can even find it now... If anyone has any pointers, it would be much appreciated!<img src="http://www.typophile.com/forums/messages/83/42595.jpg" alt=""></p>
