    html: "<p>Randy, I think you might have actually gone too far: don't lose the straight segments on the insides of the counters (not just for aesthetic reasons, but also for easy interpolation). Here's an idea: where the flats are in the Heavy, keep at least some flatness in the lighter weights, but make them angled (not horizontal), and <i>then</i> flowing into the curves. Did I explain that OK? <br> <br>One other thing: you're getting this strange \"butt jut\" at the lower-left of the \"e\", even though the stem is straight (pun unintended). Maybe shorten the straight part of the stem? <br> <br>Yeah, and the \"f\" height. <br> <br>BTW, I don't know if you realize, but you're moving into Unger terrority here... Which to me is a Good Thing. Curiously though, I know of only one other instance of people making type like Unger: the recent Dagen fonts. Maybe his style is slightly too fringe to imitate comfortably. <br> <br>hhp <br></p>"
