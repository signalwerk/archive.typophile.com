    html: "<p>Hey, that UC looks exactly right! Very nice work. And the semi-serif action is great - I wonder if you should turn some of the full-serifs (like on the right leg of the \"A\") into semis. <br> <br>Don't you think they're a little bit too small? I actually like smallish caps (especially since they alleviate the need for \"true\" smallcaps - which very few people actually end up using), but maybe a hair larger would make them more in their [alphabetic] character. <br> <br>Some specifics: <br>A: I might make the top curl less pronounced - maybe with a short flat segment on the top-left. Your structure is working great when on the bottom (\"V\", etc.) but seems too soft on top. <br>B: If you can do so without destroying the rigidity, try curving the top and bottom more out, to couteract the optical effect of bowing in. <br>M: Isn't working. <br>S: Too sharp inside. <br>U: What about a full right stem? <br> <br>This font is getting amazing - I feel like squeezing the glyphs to get some chocolate icecream out of them! Cooper Black as a triathlete. Or a female bodybuilding champion. If so, here's a source for names: <a href=\"http://www.fitnesspros.com/womenbuilders.html\" target=\"_blank\">http://www.fitnesspros.com/womenbuilders.html</a> <br> <br>hhp <br></p>"
