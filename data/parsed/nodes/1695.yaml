    html: "<p>:-) <br> <br>For the record it's <br>Chagrin (shuh-grin):<i>A keen feeling of mental unease, as of annoyance or embarrassment, caused by failure, disappointment, or a disconcerting event: To her chagrin, the party ended just as she arrived.</i> <br> <br>My fingers really like putting a r before the g. One the humorous things about it is that it fits nicely into the tradition of font names being mispronounced (ie peignot!). Isn't that something to shoot for? <br> <br>Others that I considered: <br>Chagrin <br>Salvo <br>Caedmon <br>Kortes <br>Katin <br> <br>- Randy</p>"
    html_clean: "<p>:-) <br> <br>For the record it's <br>Chagrin (shuh-grin):<i>A keen feeling of mental unease, as of annoyance or embarrassment, caused by failure, disappointment, or a disconcerting event: To her chagrin, the party ended just as she arrived.</i> <br> <br>My fingers really like putting a r before the g. One the humorous things about it is that it fits nicely into the tradition of font names being mispronounced (ie peignot!). Isn't that something to shoot for? <br> <br>Others that I considered: <br>Chagrin <br>Salvo <br>Caedmon <br>Kortes <br>Katin <br> <br>- Randy</p>"
