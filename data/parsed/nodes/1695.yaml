    html: "<p>First of all, I think Chagrin is superior to Calcite, and certainly to the other fonts mentioned. It's novel without feeling affected. <br> <br>Although I personally don't like very dark weights, it seems the Heavy embodies the most interesting essence. The other two weights don't seem genuine enough, especially not the Regular. <br> <br>Your serif tests at the bottom give me an idea: maybe this is a good design to implement the concept that different weight can sometimes have different structures. Specifically, I see the Heavy as being happiest in the \"Serif 2\" scheme (the \"Serif 1\" has too many serifs), while the Regular might really get into its own as a sans. Which might mean the Bold should be a semi? <br> <br>Also, some of the structures aren't translating well from the Heavy down to the Regular. Like the upper arm of the \"a\" is wonderfully short in the Heavy, but too long in the Regular. And the \"e\" is superb in the Heavy, but gets too square as it gets lighter. <br> <br>So I suspect you're doing the \"weight loss\" too literally - I'd give the lighter weights more roundness for example. <br> <br>BTW, that \"rationalist\" lc \"s\" (the one where the stroke stress is vertical) is just great. And your vertical proportions are right on. <br> <br>Lastly: I'm getting a tingle when I think about italic possibilities for this... <br> <br>hhp <br></p>"
