    date_raw: 23 Oct 2003 — 8:20am
    votes: null
    html: "<p>OK, I have some more feedback based on the cavalry PDF. Interestingly, the Regular seems to have more problems that the Heavy, and the Bold consistently has just a diluted subset of those. <br> <br>Overall: <br>- Are you doing something funky with your \"f\" height? It might make sense since it's the only ascender that's not a stick, but if so it's too pronounced. <br>- I'd make the left part of the bar of the \"f\" longer. <br>- Those asymmetrical foot serifs (and not just the nice long right sides in the \"f\" and \"r\") are great. <br>- Love the dots! <br>- The \"k\" is a conundrum. I'm not sure about that separation. <br>- I'd give the \"el\" a stronger foot half-serif. <br>- I'd give the \"q\" a stronger ear. <br>- The bottoms of \"v\" and \"w\" are too soft. <br>- I'm thinking your \"y\" should be v-style. <br> <br>Regular: <br>- The \"a\" is attractive, but it seems to have bypassed your early move to more curviness, and it's not \"belonging\" with the rest. Note that making it conform would actually make it very Ungerish. <br>- The leg of the \"k\" ends too delicately. <br>- I think the \"o\" is too square. <br>- The \"r\" beak is weak. <br>- There's something wrong with the \"s\". The terminals seem off, especially the top. <br>- The \"t\" is too shy. <br>- The right-bottom of the \"x\": same problem as the \"k\". <br> <br>Heavy: <br>- You need some of that straighness in all the arches (like in the \"h\"). <br> <br>BTW, I'm really liking the idea of structural divergence between the Heavy and the others. <br> <br>hhp <br></p>"
