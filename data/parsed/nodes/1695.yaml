    html: <p>Hi Typophiles, <br> <br>Here are some caps for you to chew on. These were a royal pain in the posterior. (A shoutout to Christian Robertson for his encouragement on them). The results, I think, happily relate to the lc. I intoduced the semi serifs because there is a little semi serifage happening in the lc, but also because it countered the woodtype tendency and leaves it feeling fresh. After developing this weight I'm pretty sure it will not be a straight interpolation to the regular weight. Too many quirks at this size. <br> <br>(BTW I will be reproportioning the lc, per your comments Eduardo, William) Thanks one and all! <br><img src="http://www.typophile.com/forums/messages/29/24147.gif" alt=""></p>
