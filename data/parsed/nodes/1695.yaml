    html: "<p><img src=\"http://www.typophile.com/forums/messages/29/23854.gif\" alt=\"\"> <br> <br>This close up shows what I did with the foot serifs. As you can see they are a natural extrapolation from the heavy weight. Seeing all the ducks in a row, do you still think they are too chunky? I slanted them both forward as a practical space issue in the black. No room for any other kind of treatment. I don't think it changes the original too much. It might even make it a little more *icy*. <br> <br>You can also see the interpolation changes the width of the bold and heavy weights but the regular remains at original width. <br> <br>Finally, the g: I'm gonna reserve judgement on it until I've drawn a regular g so I can see what it looks like across all weights. The problem I saw with the original g is that it looks less like a g and more like a c + j (essentially what it is). It was my least favorite of the old set so I was hankering for change. We'll see. <br> <br><i>Will any of your stuff be available in the near future?</i> <br>I sure hope so. The only font that is anywhere close to ready is the jensonesque serif. That will hopefully be available in 2004. Can't say where yet. This has a long way to go, but I hope to finish it before spring. Given that this hobby has become a serious time gobbler, it'd be nice to see a some coin from the efforts! <br> <br>Cheers. <br>Randy</p>"
