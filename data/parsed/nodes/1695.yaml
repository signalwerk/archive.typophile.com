    html: <p>I've always thought that Calcite nodded to some of Neville Brody's work, like <a href="http://www.myfonts.com/fonts/adobe/industria/">Industria</a> for example. When looking at the examples of Chagrin, I can't help but be reminded of both Berhold's <a href="http://www.myfonts.com/fonts/berthold/city/">City</a> and Zuzana's <a href="http://www.myfonts.com/fonts/emigre/cholla/">Cholla</a>. These aren't bad things. In fact, I love this type of character squarishness. <br> <br>Chagrin has a friendlier feel to me, as compared to the others mentioned above. I'd have to say that I actually prefer the first version of the serif. It's more distinctive from the other variation. Although the second one blends better with the sans and semiserif weights, maybe that's the point.</p>
    html_clean: <p>I've always thought that Calcite nodded to some of Neville Brody's work, like <a href="http://www.myfonts.com/fonts/adobe/industria/" class="link-external">Industria</a> for example. When looking at the examples of Chagrin, I can't help but be reminded of both Berhold's <a href="http://www.myfonts.com/fonts/berthold/city/" class="link-external">City</a> and Zuzana's <a href="http://www.myfonts.com/fonts/emigre/cholla/" class="link-external">Cholla</a>. These aren't bad things. In fact, I love this type of character squarishness. <br> <br>Chagrin has a friendlier feel to me, as compared to the others mentioned above. I'd have to say that I actually prefer the first version of the serif. It's more distinctive from the other variation. Although the second one blends better with the sans and semiserif weights, maybe that's the point.</p>
