    html: "<p><i>It seems the Heavy embodies the most interesting essence. The other two weights don't seem genuine enough, especially not the Regular.</i> <br>This is definitely true. The heavy makes the most of the square/round contrast while the regular just seems square.  <br>  <br><i>So I suspect you're doing the \"weight loss\" too literally - I'd give the lighter weights more roundness for example.</i> <br>Agreed. More roundness in the regular would make it more texworthy also. The trick is keeping the flavor of the heavy, with a different structure! Back to the drawing board for that. <br> <br><i>Your serif tests at the bottom give me an idea: maybe this is a good design to implement the concept that different weight can sometimes have different structures. Specifically, I see the Heavy as being happiest in the \"Serif 2\" scheme (the \"Serif 1\" has too many serifs), while the Regular might really get into its own as a sans. Which might mean the Bold should be a semi?</i> <br> <br>Hmm, that's a thought I hadn't considered. Are there other fonts that do this successfully? My guess is that the serifs are going to be what keeps the the regular weight looking like it's part of the same family after I add more roundness. Anybody else have thoughts about this idea? <br> <br><i>Lastly: I'm getting a tingle when I think about italic possibilities for this...</i> <br>I'm just gonna oblique it! Ha! <br> <br>Thanks, <br>Randy</p>"
