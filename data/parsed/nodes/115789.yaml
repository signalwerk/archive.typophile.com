      <p>Two reasons to back in history again:</p>
      <p>Nicolas Jarry was of the greatest French calligraphers of his time. Take a close look at his roman lower case letters. This was done 80 years before Bickham.<br>
      <a href="http://digitalcollections.nypl.org/items/510d47da-e952-a3d9-e040-e00a18064a99" title="http://digitalcollections.nypl.org/items/510d47da-e952-a3d9-e040-e00a18064a99">http://digitalcollections.nypl.org/items/510d47da-e952-a3d9-e040-e00a180...</a></p>
      <p>The second reason is the ‘thermoprint effect’. Jarry’s calligraphy probably does not show that much relief as with thermoprint or letterpress. But his guilded letters surely did …</p>
      <p><a href="http://www.christies.com/lotfinder/books-manuscripts/bailly-jacques-and-jarry-nicolas-5662584-details.aspx" title="http://www.christies.com/lotfinder/books-manuscripts/bailly-jacques-and-jarry-nicolas-5662584-details.aspx">http://www.christies.com/lotfinder/books-manuscripts/bailly-jacques-and-...</a></p>
      <p>Note the resemblance of Nicolas Jarry’s calligraphy with the Roman du Roi and that he wrote these pages roughly 30 years before the committee of the Académie des Sciences started to work on the Romain du Roi.</p>
