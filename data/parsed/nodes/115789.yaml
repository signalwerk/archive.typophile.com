      <p>Dear Fournier,</p>
      <p>the engraved letters by Laurent et Deberny on their ‘Feuille de lettres d’affiches’ are from 1837:<br>
      <a href="https://www.flickr.com/photos/36088795@N03/5801922724/" title="https://www.flickr.com/photos/36088795@N03/5801922724/">https://www.flickr.com/photos/36088795@N03/5801922724/</a><br>
      Depending on which kind of letters you define as ‘engraved’ (outline, outline filled with patterns of parallel lines, outlines filled with ornamental structures or elements) there are many more examples of letterpress typefaces that are older than that. Some of them are older than Senefelders first lithographic prints (1797). The book ‘Type – A visual history of Typefaces and Graphic Styles, Volume 1, 1628 – 1900 by de Jong, Purvis and Tolenaar, Taschen 2009 could be good and well documented starting point for an investigation on where to find such examples. The idea of filling an outline with an engraved pattern is not bound to letterpress or lithography though. You’ll find some engraved letters in George Bickham’s Universal Penman from 1843 too, and that’s copperplate engraved writing and lettering.</p>
