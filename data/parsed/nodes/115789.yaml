      <div class="comment-spam-body"><p>OK I'll kick this off with some simple stuff.<br>
      The rise of lithography, with its ability to print finely detailed lettering was a real challenge to the makers of typefaces. As type-making techniques improved type-makers were increasingly able to approach the detail of lithography and win back some the advertisers who had abandoned type in favor of lithographed ads.<br>
      I suggest that the adoption by type foundries of the technique of shading part of the letter to mimic the work of an engraver on metal or an incised letter in stone was part of this effort.<br>
      What would be interesting would be to identify the first use of this technique. I don't know off hand if this was a late 19th century innovation, or whether it dates back to the 18th century or earlier. Any info from our type historians?<br>
      Don</p>
      </div>
