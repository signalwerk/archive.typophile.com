    <p>Engraved letters were produced in the last third of the XIX th century for display purposes.<br>
    In the early XX th century, type designers fashioned hot metal typefaces based on these letters.<br>
    Morris Fuller Benton, Frederic Goudy, Robert Wiebking, among others.</p>
    <p>How do you define these letters in terms of style and how do you explain their many social uses throughout decades and centuries?<br>
    Your interpretation is needed…</p>
