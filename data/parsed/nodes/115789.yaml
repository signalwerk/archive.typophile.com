      <p>I think I see what you mean now. Many foundries rather tried to keep up with trends in lettering and in engraving than initiating these themselves. I do not think that we can generalize this though. Especially when it comes to the point where one wants to find out who initiated a particular style, it will be difficult to trace back wether the hen or the egg was around first. I would not know what sources the Inland Foundry used to create their typeface Blair in 1900.<br>
      <a href="http://dailytypespecimen.com/image/33012533820" title="http://dailytypespecimen.com/image/33012533820">http://dailytypespecimen.com/image/33012533820</a>  but I am sure there are several other foundries which had such a typeface way before that time. The same is probably true for Monotype Engravers. Business Cards and letterheads were not the typical jobs one would use a complicated and expensive machine like that of Monotype or Linotype for. Especially in their early years both companies were busy with adapting text typefaces for their machines. Foundry type was their main source of inspiration. They did some typefaces for headlines as well, but theses were intended for use on title pages of books and smaller head- und sublimes in newspapers or as headings in classified ads.</p>
