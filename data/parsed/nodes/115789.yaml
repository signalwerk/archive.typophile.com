      <p>Your input is interesting.<br>
      What I noticed is that the hot metal type equivalents of the engraved letters are encapsulated by an exaggerated transitional type by Benton, an incised copper type by Goudy and a wide and square gothic by the Inland Type Foundry.<br>
      The first use of these letters is sign display for shops and artisans. But it changes throughout the XX th century.</p>
