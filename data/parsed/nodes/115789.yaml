      <p>Dear Maxim, thanks for illuminating this thread with a properly embedded image!</p>
      <p>When it comes to Copperplate Script, I have seen many uses of it on letterheads. Maybe it was less used on business cards. Perhaps too female for businessmen? I recall having seen it on the small letterpress printed cards that parents used to send in celebration of the birth of a child though (What’s the proper english term for that?). I’ll look for these in the family albums next time I visit my parents. </p>
      <p>When it comes to Copperplate Script, we have to remind that it is what it says: A script engraved in copperplate. The copperplate engravers reproduced (their own) handwriting. But not only the italics one may write with the pointed flexible nib. In Bickhams Universal Penman you’ll also find fine examples of the English Court Hand, Blackletter as well as lower case letters matching the capitals of ‘Engravers Roman’. Which is way before Baskerville, Didot and Bodoni reproduced that kind of letters as printing types.</p>
      <p><a href="http://upload.wikimedia.org/wikipedia/commons/8/81/Bickham-ABC.png" title="http://upload.wikimedia.org/wikipedia/commons/8/81/Bickham-ABC.png">http://upload.wikimedia.org/wikipedia/commons/8/81/Bickham-ABC.png</a></p>
      <p>Take a close look at the last four letters in the sentence ‘Engrav’d by George Bickham Senr.’ and you’ll see what I mean. Note that Bickham is a rather late example.</p>
