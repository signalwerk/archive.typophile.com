      <p>Perhaps thermography has something to do with this.<br>
      In it, powder is mixed into the ink, which swells and sets once heat is applied, after the job has been printed.<br>
      So, by using a “copperplate” style, one may inexpensively imitate proper engraving, with either letterpress or offset lithography.</p>
      <p>I know nothing of the history of this process, having become familiar with it in the 1970s.<br>
      I found that Souvenir looked quite good with thermography, but I didn’t attempt to imitate the classic engraving look.</p>
      <p>The “minting” of Copperplate Gothic may well have been intended to counteract the loss of sharpness that occurred in non-engraving typography.</p>
