      <p>I think that you will find many example of ‘engraved’ letters amongst the initials as can be found in letterpress printed printed books from the 16th century:<br>
      <a href="https://www.flickr.com/photos/bookhistorian/" title="https://www.flickr.com/photos/bookhistorian/">https://www.flickr.com/photos/bookhistorian/</a><br>
      This book here seems to have been printed in Milano in 1514. It shows initials with patterns of parallel engraved lines:<br>
      <a href="https://www.flickr.com/photos/bookhistorian/sets/72157634023958756/with/8995866410/" title="https://www.flickr.com/photos/bookhistorian/sets/72157634023958756/with/8995866410/">https://www.flickr.com/photos/bookhistorian/sets/72157634023958756/with/...</a><br>
      It seems that these initials were usually cut in wood, but one would have to take a closer look to find out what it is that we are looking at in this case.<br>
      But I think, that these initials started their life as letterpress-equivalents to the illuminated initials of the written books from before that time:<br>
      <a href="https://www.flickr.com/photos/e-codices/" title="https://www.flickr.com/photos/e-codices/">https://www.flickr.com/photos/e-codices/</a><br>
      Several book and printing historians claim that the first printed books were sold with blank spaces on the positions where one would expect illuminated initials. This would at least explain that some libraries have books with those blank spaces in their collections. The idea was that the buyer would have the initials added by an artist of his choice, just as the buyer would go to a bookbinder to have the book bound according to his demands. After the printers found out that many of their customers did not have their books illuminated anymore, they came up with letterpress initials.</p>
