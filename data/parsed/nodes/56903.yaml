      <p>Eben, I was able to find the phrase using Google Books: "En general cada país tiene el idioma que merece." (<a href="http://books.google.com/books?id=cItdAAAAMAAJ&amp;q=%22cada+país+tiene+el+idioma+que+merece%22&amp;dq=%22cada+país+tiene+el+idioma+que+merece%22&amp;lr=&amp;client=safari&amp;pgis=1" rel="nofollow">Link</a>.)</p>
      <p>The source, <em>El otro Borges</em> ("The Other Borges"), is a book of interviews spanning the years 1960 through 1986.</p>
      <p>When I was living in Buenos Aires, I heard a similar phrase: "Cada país tiene el gobierno que se merece." Which means, "Each country has the government it deserves." (!) I'm not sure which phrase came first, or if it's just an old saying that gets changed from time to time.</p>
