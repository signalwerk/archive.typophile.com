      <p>Thanks everybody! Dan, Will do. Matthew, you make a very good point. I will see if I can find out more about the quote. I do recall Borges lapsing into a very old fashioned way of thinking when it came to nationality eg that he was willing to generalize, albeit in a witty way. Also, I think holding position seriously in this sense was maybe outside of his interests*. But people are sloppy and it could well be that it is not his or that a character of his says it.</p>
      <p>I don't have my Library here in Reading, and the Uni is closed for a while now, so finding those references is not going to happen quickly.</p>
      <p>For example, "Borges: I think that the meanings are more or less irrelevant. What is important, or the two important facts I should say, are emotion, and then words arising from emotion. I don't think you can write in an emotionless way. If you attempt it, the result is artificial. I don't like that kind of writing. I think that if a poem is really great, you should think of it as having written itself despite the author. It should flow." <a href="http://www.wooster.edu/artfuldodge/interviews/borges.htm" title="http://www.wooster.edu/artfuldodge/interviews/borges.htm">http://www.wooster.edu/artfuldodge/interviews/borges.htm</a></p>
