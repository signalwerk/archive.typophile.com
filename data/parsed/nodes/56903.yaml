      <p><em>Ricardo, interesting. I’ll need to go and look it up to see the context. I’m only familiar with a handfull of his interviews.</em></p>
      <p>Hey, guifa, Eben has provided a link to an interesting-looking interview (above): </p>
      <p><a href="http://www.wooster.edu/artfuldodge/interviews/borges.htm" title="http://www.wooster.edu/artfuldodge/interviews/borges.htm">http://www.wooster.edu/artfuldodge/interviews/borges.htm</a></p>
      <p>For instance, at one point Borges says of Federico García Lorca, "And then, it was a lucky think [sic]  for him to be executed. Best thing to happen for a poet." A somewhat poor translation, but that quote is pure evil, and pure Georgie. ;-D</p>
      <p>But also check out his comparison of languages:</p>
      <p>"I don't think languages are essentially synonymous. In Spanish it is very difficult to make things flow, because words are over-long. But in English, you have light words. For example, if you say <em>slowly, quickly</em>, in English, what you hear is the meaningful part of the word: <em>slow-ly, quick-ly</em>. You hear <em>slow</em> and <em>quick</em>. But in Spanish you say <em>lentamente, rapidamente</em>, and what you hear is the <em>-mente</em>. That is gratis, so to say. A friend of mine translated Shakespeare's sonnets into Spanish. I said that he needed two Spanish sonnets to a single English one, since English words are short and to the point, but Spanish words are over-long. And English also has a physical quality to it. Well, in English, you can say: <em>to explain away</em>. In Kipling's <em>Ballad of East and West</em>, an English officer is pursuing an Afgan horse thief. They're both on horseback. And Kipling writes: 'They have ridden the low moon out of the sky./ Their hooves drum up the dawn.' Now you can't <em>ride the low moon out of the sky</em> in Spanish, and you can't <em>drum up the dawn</em>. It can't be done. Even such simple sentences as <em>he fell down</em> or <em>he picked himself up</em>, you can't do in Spanish. You have to say <em>he got up the best he could</em> or some lame paraphrase. But in English you can do much with verbs and positions. You can write: <em>dream away your life; live up to; something you have to live down</em>. Those things are impossible in Spanish. They cannot be done. Then you have compound words. For example you have <em>wordsmith</em>. It would be in Spanish <em>un herrero de palabras</em>, rather stilted, rather uncouth. But it can be done in German you can make up words all the time, but not in English. You are not allowed the freedom that the Anglo-Saxons had. For example, you have <em>sigefolc</em>, or <em>victorious people</em>. Now in Old English, you don't think of these words as being artificial, but in Spanish it can't be done. But of course, you have what I think is beautiful in Spanish: the sounds are very clear. But in English you have lost your open vowels."</p>
