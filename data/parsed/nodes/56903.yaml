      <p>I can't find the original Spanish.  Logos dictionary seems to be the only source for it in Spanish or really English for that matter.  I've tried a variety of different possible original Spanishes and nothing comes up.  It also doesn't seem like something Borges would say anyways, though I could certainly see him having included it in a story as a line from a narrator or character.</p>
      <p>Just be careful, it's very (extremely) likely he didn't actually say it.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
