      <p><em>What, pray, is going on with Georgia here...</em></p>
      <p>You most likely have an old version of Georgia installed. I noticed the same thing on my Mac. I checked and there was an up-to-date version (with all the CE characters) in /Library/Fonts/, but there was also an older version (with just the basic Latin set) in ~/Library/Fonts/, which was probably put there when I installed Office 2004. I'm not sure how the system chooses which version to use when there is more than one installed, but it was apparently using the older one. I removed the old version from ~/Library/Fonts/ and the correct Georgia characters immediately appeared on this page in the example texts above.</p>
    html_clean: |-
