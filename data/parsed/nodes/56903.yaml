    <p>In general, every country has the language it deserves. -Jorge Luis Borges </p>
    <p>So far I have german:<br>
    Im Allgemeinen hat jedes Land die Sprache, die es verdient.</p>
    <p>and Hungarian<br>
    Általában minden országnak olyan nyelve van, amilyet megérdemel.</p>
    <p>(I am still looking for the original Spanish)</p>
    <p>Thanks!</p>
