    html: |-
      <p><em>“The power of large font size to enhance emotion effects may, for instance, be one reason why headlines written in big letters are popular and evidently successful in the yellow press media.”</em></p>
      <p>Or vice versa.</p>
      <p>That’s how art directors, graphic designers and typographers invest display type with “aesthetic” tonality or para-textual meaning, and consequently how it’s read. One is accustomed to respond to a title or headline with a value judgement (emotionally-driven), namely, whether one should continue with the document and dive into the body text.</p>
      <p>This isn’t a “yellow press” phenomenon, but deeply embedded in the culture:<br><img src="/sites/default/files/old-images/lindisfarne-big_3597.jpg"></p>
