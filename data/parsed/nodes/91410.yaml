      <p>Okay, so you want favorite cursives. The probable is that there are many different types of script font. Brush is totally different from Shelley, and would be used in totally different situations. Then there are the pseudo handwriting fonts. Again, a different purpose.</p>
      <p>Most good typographers will have different favorites for each use.</p>
