  html: |-
    <p>The first draft of this post for <a class="freelinking external" href="http://arabictype.wordpress.com" rel="nofollow">my blog</a> was completed in April. However, the graphics needed for the post, among other issues stood in the way of publishing it.</p>
    <p>In this article I try to explain to the young Arabic font designer three areas that require attention in font design:</p>
    <ol>
    <li> Readability</li>
    <li> Aesthetic principles</li>
    <li> Style</li>
    </ol>
    <p>I analysed the elements of Arabic type style and identified the following factors:</p>
    <ol>
    <li> Overall form</li>
    <li> Contrast</li>
    <li> Treatment of outline and ends</li>
    <li> Weight</li>
    <li> Oblique</li>
    <li> Width (condensed/extended)</li>
    </ol>
    <p>Using morphological analysis, I constructed a table that could help in generating Arabic font styles by varying the degree of the style elements I list above. Being the second day of Eid, I offer the table as a <a class="freelinking external" href="http://arabictype.files.wordpress.com/2011/11/arabicfontgenerator.pdf" rel="nofollow">downloadable goodie</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/arabicfontgeneratorsmall_4345.jpg"></div><p></p>
