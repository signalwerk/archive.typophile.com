    html: |-
      <p>Yeah, those Moorstation-fonts are made ‘quick and dirty’ — presumably by scanning artwork and tracing these autostyle.</p>
      <p>Re your original question, I HAVE seen this letter(style) somewhere. In my mind it’s somehow connected with Albrecht Dürer, which would place it in the 16-hundreds. And I have a feeling that it has been republished in a Dover book, somewhere in the 70’s (eg 30+ years ago).</p>
      <p>But this is all conjecture (and proof that the mind really withers with aging, haha).</p>
