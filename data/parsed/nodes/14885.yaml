  html: |-
    <p>I found this in a small Dutch mid-20th-century speciman book while doing research for my Raffia presentation at ATypI_Vancouver. It looks like metal—see the top right hand corner. Does anyone know who made it / what foundry, etc. I’d like to see more of the letters in the font, because the way the flourishes interweave at bottom left is distinctive for this sort of letter, and anticipates the pattern in the flourishes in Raffia.</p>
    <p><a href="http://www3.sympatico.ca/penneson/ALKMAAR_S.pdf">http://www3.sympatico.ca/penneson/ALKMAAR_S.pdf</a></p>
