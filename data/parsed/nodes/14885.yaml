    html: <p>Thanks Tiffany. I am familiar with Nicolette Grey’s books on lettering, but I haven’t come across this particular specimen or others in the font there. This kind of letterform originated with the practice of drawing large versal with the same broadpen as used for writing text or notes in musical scores. Typographic versions of such versals are not unusual, but the raffia-like flourishes embodied in the bottom left and top tight corner of the specimen I showed are. Mostly the flourishes are of the type shown in the top left corner.</p>
