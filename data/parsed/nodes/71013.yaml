  html: |-
    <p><strong>Typographic sins</strong> are those little things novice designers, students and Mr. and Mrs. Desktop Publisher always do with type. You know, putting 2 spaces between sentences, using dumb quotes instead of smart quotes, etc. Well, in an effort to educate the public (or at least entertain those of us who know better), I have designed a poster with 34 typographic sins that I hope people don't commit. Some, like those mentioned above are obvious, others are a little more obscure. I letterpressed my poster at <a href="http://www.rowleypress.com" target="_blank" rel="nofollow">Rowley Press</a> and you can purchase them on my web site: <a href="http://www.jimgodfreydesign.com" rel="nofollow">jimgodfreydesign.com</a>. </p>
    <p><strong>Save the typographic soul of a loved one, or your own.</strong></p><div class="imageWrap"><img src="http://typophile.com/files/typeSins_closeUp02_6195.jpg"></div><p></p>
