  html: |-
    <p>dear typophiles, <br>i'm posting my latest project: fra, a display font based on the lettering on a sketch by italian renaissance artist fra bartolomeo. <br> <br>i'm presenting two versions. i started with a design, that wasn't very close to the original drawings. after i got feedback, that it was to reserved and geometric i decided to draw a new version. <br>by now, i hate the first version, but i'm not quite sure if the second attempt is heading in the right direction, even though i like it much more. please tell me what you think. <br>is it too calligraphic ot should be even less "sharp"? what about the serifs, should i keep the edges or round them up? <br> <br><img src="http://www.typophile.com/forums/messages/29/55804.gif" alt=""> <br> <br>regards,  <br>titus <br> <br></p>
