    html: |-
      <blockquote><p>Whitney Greek was a four-year project, designed by H&amp;FJ in consultation with Gerry Leonidas, Senior Lecturer in Typography at the University of Reading. For Whitney, Leonidas advocated the adoption of two distinct formal vocabularies for the Latin and Greek ends of the type family, an approach supported by the unique characteristics of the Greek language.</p></blockquote>
      <p>I took that to mean the drawing skills were H&amp;FJ, the thinking was Leonidas. Could be wrong, of course. Anyway, reading what Mr. Leonidas has to say generally could only be helpful...</p>
