    <p>H&amp;FJ's Greek and Cyrillic for Whitney seem to be a product of considered research:<br>
    <a href="http://www.typography.com/fonts/whitney/features/whitney-multiscript-language-support" title="http://www.typography.com/fonts/whitney/features/whitney-multiscript-language-support">http://www.typography.com/fonts/whitney/features/whitney-multiscript-lan...</a></p>
    <p>I'm wondering if anybody can spot small or large issues with any of it. I know such a discussion would help me greatly improve my own Greek and Cyrillic skills, so I hope you won't be shy!</p>
    <p>hhp</p>
