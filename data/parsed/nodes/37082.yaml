    <p>I've been looking here and Google for a little while now, and I am still having trouble finding what font was used for the logo on MacGyver.  Was this one of those custom hand-drawn logos, or is it a font (based on a font)?  Any help/answers are greatly appreciated.  Thanks in advance everyone!</p>
