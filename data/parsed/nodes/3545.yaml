    html: "<p>Of course. Beer is what makes the posts really flow!  :-) <br> <br>&gt; your favorite beer label <br> <br>I think a beer label is one important thing, but its role in the bottle/can as a whole is an even more important thing. Take Suntory for example: not a remarkable label, but in the context of the can -an accurately modeled miniature keg- it's wonderful. <br> <br>One of my most memorable labels was of a beer from Congo, called \"Ngok\". It has a nasty alligator on it - made me feel like I was lost in a jungle having my last beer (which made it taste much better than it really was). Another nice label was La Ballena (from Puerto Vallarta), where the label was shaped like a whale - and that beer only came in oversized bottles. <br> <br>BTW, there's a wonderful book you should get: <br>\"Labels of Distinction - Microbrewery Label Design\" by S Drate and T Olejar. <br>I bought it because one day I will redo my foundry identity based on inspiration from it. <br>Here's probably the most outlandish example (which will NOT be my inspiration :-). <br> <br><img src=\"http://www.typophile.com/forums/messages/30/28355.jpg\" alt=\"cochonne\"> <br> <br>And a classic lambic beer label: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/28356.jpg\" alt=\"lambic\"> <br> <br>I love ovals, for some reason. <br> <br>hhp <br></p>"
    html_clean: "<p>Of course. Beer is what makes the posts really flow!  :-) <br> <br>&gt; your favorite beer label <br> <br>I think a beer label is one important thing, but its role in the bottle/can as a whole is an even more important thing. Take Suntory for example: not a remarkable label, but in the context of the can -an accurately modeled miniature keg- it's wonderful. <br> <br>One of my most memorable labels was of a beer from Congo, called \"Ngok\". It has a nasty alligator on it - made me feel like I was lost in a jungle having my last beer (which made it taste much better than it really was). Another nice label was La Ballena (from Puerto Vallarta), where the label was shaped like a whale - and that beer only came in oversized bottles. <br> <br>BTW, there's a wonderful book you should get: <br>\"Labels of Distinction - Microbrewery Label Design\" by S Drate and T Olejar. <br>I bought it because one day I will redo my foundry identity based on inspiration from it. <br>Here's probably the most outlandish example (which will NOT be my inspiration :-). <br> <br><img src=\"http://www.typophile.com/forums/messages/30/28355.jpg\" alt=\"cochonne\"> <br> <br>And a classic lambic beer label: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/28356.jpg\" alt=\"lambic\"> <br> <br>I love ovals, for some reason. <br> <br>hhp <br></p>"
