    html: <p>I don't know if it's a font actually (hope you're not expecting one reproducing Hulk's face trough letters ;) may be more a custom lettering or a heavily squooshed font... Part of the very specific /U bottom, it could be approximate with any generic fat black sans of your choice (<a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/univers/" rel="nofollow">Univers Extra Black</a>, <a class="freelinking external" href="http://www.myfonts.com/search/helvetica" rel="nofollow">Helvetica</a> (Black or Compressed), <a class="freelinking external" href="http://www.myfonts.com/search/compacta" rel="nofollow">Compacta</a>, <a class="freelinking external" href="http://www.myfonts.com/search/impact" rel="nofollow">Impact</a>, <a class="freelinking external" href="http://www.myfonts.com/search/haettenschweiler" rel="nofollow">Haetschenweiler</a>...) and manipulate it. The closest I was able to find is <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/francker" rel="nofollow">Francker Ultra Black</a> though which comes very close. If you still need this logo, it is freely available to download <a class="freelinking external" href="http://www.brandsoftheworld.com/logo/hulk" rel="nofollow">here</a>.</p>
