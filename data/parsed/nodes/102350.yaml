    html: <p>I don't know if it's a font actually (hope you're not expecting one reproducing Hulk's face trough letters ;) may be more a custom lettering or a heavily squooshed font... Part of the very specific /U bottom, it could be approximate with any generic fat black sans of your choice (<a href="http://www.myfonts.com/fonts/linotype/univers/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Univers Extra Black</a>, <a href="http://www.myfonts.com/search/helvetica" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Helvetica</a> (Black or Compressed), <a href="http://www.myfonts.com/search/compacta" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Compacta</a>, <a href="http://www.myfonts.com/search/impact" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Impact</a>, <a href="http://www.myfonts.com/search/haettenschweiler" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Haetschenweiler</a>...) and manipulate it. The closest I was able to find is <a href="http://www.myfonts.com/fonts/linotype/francker" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Francker Ultra Black</a> though which comes very close. If you still need this logo, it is freely available to download <a href="http://www.brandsoftheworld.com/logo/hulk" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
