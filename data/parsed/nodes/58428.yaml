      <p>As I recall NuSwift was leaked to the ‘community at large’ by an avid collector of typefaces who worked at a certain location of the dutch equivalent of Kinko’s, in the mid nineties. The guy swapped all kinds of coporate fonts he came by in his job with other collectors. </p>
      <p>I know this because I used to moderate a DTP/Quark-forum in that period.</p>
