    html: <p>Jan, I doubt that there is a font called NuSwift. That name has been mentioned a couple of times on Typophile, but almost always by a single poster, mondoB. In <a href="https://web.archive.org/web/20150123130243/http://typophile.com/node/29655" rel="nofollow">this thread</a>, he wrote “Swift and NuSwift, its counterpart with oldstyle figures.” Hence, I assume it is just another (unofficial/made-up/wrong) name for Swift 2.0. I posted the link to the PDF, so that Mads can confirm if that is the typeface he is looking for.</p>
