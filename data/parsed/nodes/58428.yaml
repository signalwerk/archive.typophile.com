      <p>Hi<br>
      I have just received the following message from Visualogik:</p>
      <p>Dear Mr. Ludvigsen,<br>
      Thank you for your interest in our products and services.</p>
      <p>NuSwift is a custom corporate font that we have produced for the dutch energy provider Nuon; the font is exclusively in use by Nuon and Nuon affiliates.</p>
      <p>It is based upon Swift 2.0 designed by dutch type designer Gerard Unger (<a href="https://web.archive.org/web/20150123130243/http://www.gerard-unger.com/" title="www.gerard-unger.com">www.gerard-unger.com</a>); we have also produced these Swift 2.0 fonts.</p>
      <p>Attached I'm sending you a type specimen of Swift 2.0; the fonts are available with extended character sets (both Latin1 and Latin 2 - central european and baltic), in PostScript Type1, TrueType and OpenType formats.</p>
      <p>You can obtain a licence for the standard fonts with us, but we can also provide you with a custom or corporate version of the font(s); (custom) font production is our specialty.</p>
      <p>If you want me to make you a quotation, please let me know which styles/ weights you would like to have, for how many cpus/ users, and at how many locations/ adresses, if more than one.</p>
      <p>Met vriendelijke groet,</p>
      <p>Best Regards,</p>
      <p>Bien à vous,</p>
      <p>Hans van Leeuwen.</p>
