      <p>‘Dead’ is probably the wrong word here… It is my understanding that <em><a href="http://one-d.ru/index.php?option=com_content&amp;task=view&amp;id=63&amp;Itemid=63" rel="nofollow">Sovremennaya Kyrillitsa</a></em> (‘Modern Cyrillic’), dedicated to the <a href="http://tdc.org/news/2005atypiciviltype.html" rel="nofollow">tercentenary of Russian Civil Type</a>, was a one-off event. I was on the jury, and I don’t remember hearing of any plans to turn it into a recurring affair (once every few years or so).</p>
      <p>There was a similar competition held in Moscow ten years earlier, <em><a href="http://www.itcfonts.com/Ulc/2541/Kyrillitsa.htm" rel="nofollow">Kyrillitsa ’99</a></em>. In their putting together <em>Modern Cyrillic</em> its organisers seemed to be encouraged and inspired by the success of that contest</p>
    html_clean: |-
