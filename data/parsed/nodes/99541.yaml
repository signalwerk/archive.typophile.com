    html: |-
      <p>Have you tried adding more contrast? Just kidding.</p>
      <p>In addition to turning on the path direction indicators, perhaps also make sure that you're not running an automatic path direction action as a last step before exporting the OT font. It looks like you have a pretty complex set of outlines, and I've seen rare cases where FontLab gets the path direction wrong. Admittedly, this is usually (always?) before removing overlaps, but it wouldn't hurt to manually check it and then make sure it stays that way.</p>
