    date: 2013-01-12T07:27:00
    date_raw: 12 Jan 2013 — 7:27am
    votes: null
    html: |-
      <p>While overlaps should be avoided within a single glyph, two separate glyphs overlapping shouldn't cause an issue like this. But if there are any overlaps within the affected glyphs, make sure to remove them before generating.</p>
      <blockquote><p>How can I check the direction of each glyph</p></blockquote>
      <p>In the FontLab's Preferences under <code>Glyph Window &gt; Outline drawing</code>, make sure <code>Show contour direction</code> is checked. A small blue arrow at the first point of each contour indicates path direction.</p>
    html_clean: |-
