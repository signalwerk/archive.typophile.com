    html: |-
      <p>The redesign of Helvetica Neue to make the characters a little more structurally unified fits better to the pixel grid (or at least seems to), making it easier to read on screen. The slight differences that the original Helvetica has between characters (well, the ones the Neue alters) make it easier to read on print (by making the characters more distinguishable).</p>
      <p>But, I'll pull a quote from your article to get the true opinion flowing:<br>
      "For the longest time I used Helvetica and Helvetica Neue interchangeably and really had no preference for either of them."  One just does one job slightly better than the other, that's about it.</p>
      <p>Regarding your opinion on which is superior, I was referring to the section just above that block of text. It seemed to be implied that your preference was very slightly towards Neue.</p>
