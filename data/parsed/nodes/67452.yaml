    <p>Hey everyone, I am sure that some of you will like this: I wrote an article about Neue Helvetica on my blog and then Erik Spiekermann joined in (as he was a design consultant for the face) and things got awesome. Today he emailed me some scans of the original marketing materials from the 80's. You can download and view them from the article's comments section. I hope you like it.</p>
    <p><a class="freelinking external" href="http://travisneilson.com/thought/old-vs-neue/" rel="nofollow">http://travisneilson.com/thought/old-vs-neue/</a></p>
