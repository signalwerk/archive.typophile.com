      <p>Thanks for liking the article. I appreciate the read. I did not, however, conclude that Neue Helvetica was superior. In fact what I said was:</p>
      <p>"Of course this study only concerns two weights from each family, and is therefore slightly limited in its scope.<br>
      I am not recommending that in all cases this is true for all applications, but for this study, the winner is Hel­vetica Neue with three out of four votes!"</p>
      <p>I have not heard that the original Helvetica is better for print before. Why do you say so? Is that your opinion, or is there data to back that up?</p>
