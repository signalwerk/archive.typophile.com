  html: |-
    <p><a class="freelinking external" href="http://www.captcha.net/" rel="nofollow">CAPTCHA</a> and the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Word_superiority_effect" rel="nofollow">word superiority effect</a> (WSE).</p>
    <p>I have noticed facebook and other sites are starting to use real words more often (as opposed to <a class="freelinking external" href="http://en.wikipedia.org/wiki/Pseudoword" rel="nofollow">pseudowords</a> &amp;c.) thus making them significantly easier to recognize. Does anyone know if this is on purpose?</p>
  html_clean: |-
    <p><a class="freelinking external" href="http://www.captcha.net/" rel="nofollow">CAPTCHA</a> and the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Word_superiority_effect" rel="nofollow">word superiority effect</a> (WSE).</p>
    <p>I have noticed facebook and other sites are starting to use real words more often (as opposed to <a class="freelinking external" href="http://en.wikipedia.org/wiki/Pseudoword" rel="nofollow">pseudowords</a> &amp;c.) thus making them significantly easier to recognize. Does anyone know if this is on purpose?</p>
