      <p>Keeping in mind, of course, that CAPTCHÆ can be and are defeated relatively trivially and guarantee a site becomes inaccessible to blind people.</p>
      <p>There is a general trend toward asking mild skill-testing questions instead (“Is fire hot or cold?”), though this does not solve the problem of hiring Third World workers to solve CAPTCHÆ en masse. It is somewhat amazing we’re still using these relics.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
