      <p>&gt; though this does not solve the problem of hiring Third World workers to solve CAPTCHÆ en masse</p>
      <p>This is a variant of the <em>porn monkey</em> attack, where people would answer a CAPTCHA in order to access free porn. While this kind of attack on CAPTCHAs is frequently discussed, no one seems to know of this actually happening. Real attacks do come from computer programs that try to recognize CAPTCHAs.</p>
