    date_raw: 16 Oct 2009 — 9:20am
    votes: null
    html: <p>Allowing words instead of pseudowords adds the benefit of the possibility of using scanned texts, so that the decoding can not only verify a human reader, but also as a side effect advance the deciphering of scans. See <a class="freelinking external" href="http://recaptcha.net/learnmore.html" rel="nofollow">this page about reCAPTCHA</a>.</p>
