    html: |-
      <p>Using words do make it easier for people to solve the CAPTCHA, but it also makes it much easier for a computer program to solve. Using words is a terrible idea if a site is trying to stop frequent attacks from computer programs, but probably just fine if the site isn’t expecting someone to write custom programs to break your CAPTCHA.</p>
      <p>I worked on a project where we investigated how to build a CAPTCHA that would be recognizable by people, but not by computer programs.<br>
      <a href="http://research.microsoft.com/en-us/um/people/kumarc/pubs/chellapilla_chi05.pdf" title="http://research.microsoft.com/en-us/um/people/kumarc/pubs/chellapilla_chi05.pdf">http://research.microsoft.com/en-us/um/people/kumarc/pubs/chellapilla_ch...</a></p>
      <p>Interestingly, computer programs recognize single characters at a higher rate than people. To build an effective CAPTCHA you need to make it difficult for the computer program to segment the location of each of the characters.<br>
      <a href="http://research.microsoft.com/en-us/um/people/kumarc/pubs/chellapilla_ceas05.pdf" title="http://research.microsoft.com/en-us/um/people/kumarc/pubs/chellapilla_ceas05.pdf">http://research.microsoft.com/en-us/um/people/kumarc/pubs/chellapilla_ce...</a></p>
