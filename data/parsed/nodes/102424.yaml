    html: <p>When you kern you're adjusting the distance between characters so the spacing looks uniform. Since characters have different shapes, some must be closer together than others to create spacing that appears uniform. There is a subjective element to it, but bad kerning is usually pretty obvious. If you Google "how to kern" you'll find articles that give tips. You could also post an example of type you've kerned to get suggestions.</p>
