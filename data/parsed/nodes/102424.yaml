      <p>Yes, kerning is a matter of personal taste. Which is not the same as saying anything is correct. Kerning is a matter of harmonious spacing, that is, everything needs to work well together. Often, a change to a kerning pair shows a difference in one's notion of proper character fit, so a change in one kern value will lead to others.</p>
      <p>Occasionally though, changing the kerning of a single glyph does not affect other spatial relationships -- witness Slimbach's notion of the proper kerning of an apostrophe versus what other equally skilled people deem correct.</p>
      <blockquote><p>Professional type designers spend a lot of time carefully spacing and kerning typefaces to look just so. Generally, any extra input from the end-user is not needed</p></blockquote>
      <p>Extra "input" needed? No, but quite often fixes are needed by the "professional user." And by that I mean the professional type designer gets things wrong, usually by omission, occasionally by error. I'm not speaking of a difference in preference about spatial relationships here.</p>
      <p>But there is no need to give the "professional type designer" input. Many "professional type designers" don't live in a world populated by sentient authors, editors, typesetters, and readers. Very hard to convince them otherwise -- usually a wasted effort. Just fix things and get on with life.</p>
      <p>Edit:</p>
      <p>This is particularly true in your situation, a logo. Presumably, there aren't many letters involved. A type desigenr, working on an entire font, has to make compromises in order to get all the letters to work well together. With your rather limited set, and a purpose that isn't "continuous reading," decisions will likely be different. You can can still get things wrong, of course, but that's different than claiming there is a single "right."</p>
