      <p>Not just personal taste – you might want to loosen kerning for a tiny use and tighten it for giant use just out of production considerations.</p>
      <p>It is almost always necessary to consider kerning for headlines to articles too and certain character pairs can cause problems in a document (this is especially true when you encounter something a type designer would not necessarily consider when setting the kerning for example a numeral/letter combination).</p>
      <p>I was shown two ways of considering kerning –&nbsp;one is to print it out and turn it round; the other was to partially close eyes and squint at the setting on screen – this reduces the characters to a blur and lets you pick out the space in between.</p>
      <p>Tim</p>
