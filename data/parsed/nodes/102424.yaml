      <p>No, it is a good point Nick. </p>
      <p>Another point is, with short copy, it depends on the words themselves. If I were setting</p>
      <p>WAWA BOX</p>
      <p>in a logo-type environment, kerning between all the letters could be tighter than if the two words were</p>
      <p>WARP DRIVE </p>
      <p>and certainly tighter than would be appropriate in the font itself, which has to work when setting long runs of text.</p>
