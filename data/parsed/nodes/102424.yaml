      <p>What about the word 'minimum' that a lot of typedesigners use to set the white space they like as a basic setting with the typeface and most important the type size involved? By the way, in a logo or in a name (like a movie title) you have to deal with characters as if it where individuals. The concept 'typeface' should not be important. Often in a logo you can alter some characters (although a type designer is often not happy about that) so that you are really creating a logo and not simply a headline or typed title. It has to become a form of its own.<br>
      When a typeface is made originally as a textface, often other choices are made according to letterform and use of white than you are dealing with in a logo or movie title.</p>
