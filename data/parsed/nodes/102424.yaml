  html: |-
    <p>I'm working on a logo for my personal website and would like to have it appear professional. I'm the type who can keep moving around the pixels when I design (eg. Webdesign) and find it difficult to close a project down. I think it's difficult to find websites that show "this is how it should be done." The vast majority of websites only explains the concepts(kerning tracking etc.) and not how you do it. </p>
    <p>Therefore, this question: Is kerning a matter of personal taste?</p>
