      <p>Personal taste yes, but within the culture of professional typography—which encompasses the efforts of type designers, kern algorithm programmers and typographers.</p>
      <p>There are, and have been, various conventions and philosophies of how to space letters. Here’s an example of “tight but not touching” from the 1960s:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Pepsi_1968_3905.png"></div><br>
      If you decide that the time is right to revive such spacing in your wordmark, you will have to do it manually, because neither built-in metrics nor InDesign’s “Optical” will produce this result.<p></p>
      <p>Not only should you consider each individual letterspace in a wordmark, and manually kern where you see ﬁt, but you might also consider modifying letter shapes for improved overall color.</p>
      <p>Herb Lubalin’s masthead for Avant Garde magazine (which begat the typeface) originated, I surmise, from him working with one of his favorite types, Futura. I made the example below to show a possible interim stage in his design of the masthead. The idea is that you can only get so far—in certain kinds of wordmark—without going beyond off-the-shelf type.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AGs_4209.png"></div><br>
      My apologies if this old stuff is out-of-date, but it does offer a perspective and, being an extreme, clearly represents the principles involved.<p></p>
      <p>In recent years, many OpenType fonts have been published with alternate glyphs, which enables some customization of wordmarks, without having to “create outlines” in Illustrator.</p>
