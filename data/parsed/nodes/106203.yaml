    <p>Typophiles here might be interested in this praiseworthy endeavour by a programmer who’s designing his own monospace font for coding. For now, one weight and one style only, but he seems to have quite a few optical sizes in mind (probably without him even realizing what that means).</p>
    <p>The designer/developer (Pablo Caro) explicitely asks for criticism, so he can take constructive feedback into account while developing further. His sample text settings were posted on <a href="/wiki/https%3A/%252Fnews.ycombinator.com/" class="freelinking" rel="nofollow">Hacker News</a> (a popular forum for coders and programmers), where they’re being discussed. By hackers. For typophiles it’s anyhow interesting to read how programmers rationalize about type design, without the burden (?) of tradition and jargon: <a href="https://news.ycombinator.com/item?id=6354396" title="https://news.ycombinator.com/item?id=6354396">https://news.ycombinator.com/item?id=6354396</a></p>
    <p>I fancied both communities — the type design pro’s and the hacker type-n00bs ;-) — might find each other on this occasion. I cross-post the link to this thread on Hacker News, so that programmers could learn how typophiles discuss type design.</p>
    <p>The original blog post with samples of the font(s) under discussion <a class="freelinking external" href="http://pcaro.es/p/hermit" rel="nofollow">is here</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hermit_11pt_3457.png"></div><p></p>
