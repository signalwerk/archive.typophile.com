    html: "<p>Colin - a lot of variables come into play, but <br>as a general rule, don't mess with the point <br>size, the tracking, or the character width. <br> <br>Break the rules for feature layouts, of course. <br> <br>Not sure what you mean by leaving white space. <br>Do you have a scan? <br> <br>You can air out copy but not *too much*. <br> <br>Also, read Tim Harrower's book...mentioned <br>before at typophile. <br> <br>If you have time, touch the copy, or have <br>an editor help you touch it. Some of the <br>most precise editing comes when you are forced <br>to fit something into a confined space. <br>You see things you normally wouldn't see. <br> <br>among other things: <br> <br> <br>_ edit widows <br> <br>_ cut redundant, \"no ••••\" quotes <br> <br>_ look at paragraph structure (either tighten or loosen based on reporter's writing style) <br> <br>_ increase/decrease size of art <br> <br>_ increase/decrease # of columns / page layout <br> <br>_ bust out a pull quote or an infographic <br> <br>_ as a last resort, run a house ad, or better yet, <br>set your type in Zapf Dingbats. <br> <br>bj <br> <br> <br></p>"
    html_clean: "<p>Colin - a lot of variables come into play, but <br>as a general rule, don't mess with the point <br>size, the tracking, or the character width. <br> <br>Break the rules for feature layouts, of course. <br> <br>Not sure what you mean by leaving white space. <br>Do you have a scan? <br> <br>You can air out copy but not *too much*. <br> <br>Also, read Tim Harrower's book...mentioned <br>before at typophile. <br> <br>If you have time, touch the copy, or have <br>an editor help you touch it. Some of the <br>most precise editing comes when you are forced <br>to fit something into a confined space. <br>You see things you normally wouldn't see. <br> <br>among other things: <br> <br> <br>_ edit widows <br> <br>_ cut redundant, \"no ••••\" quotes <br> <br>_ look at paragraph structure (either tighten or loosen based on reporter's writing style) <br> <br>_ increase/decrease size of art <br> <br>_ increase/decrease # of columns / page layout <br> <br>_ bust out a pull quote or an infographic <br> <br>_ as a last resort, run a house ad, or better yet, <br>set your type in Zapf Dingbats. <br> <br>bj <br> <br> <br></p>"
