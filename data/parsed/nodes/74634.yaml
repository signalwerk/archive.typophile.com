      <p>Right, I guess I haven't worded myself clearly enough, sorry.</p>
      <p>I'll put it another way: do you think that it's OK that automatic hyphenation (in TeX) uses the same weight/style for hyphen as the hyphenated word is, even if the entire paragraph is set in a different weight/style?</p>
      <p>If you think it should rather use the weight/style of the paragraph, do you perhaps have any idea how to change it?</p>
