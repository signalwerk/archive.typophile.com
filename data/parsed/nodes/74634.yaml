  html: |-
    <p>Hello,</p>
    <p>I'd like to ask if there is any standard on what the hyphen should be like when hyphenating a word in bold, italics &amp;c.? Should it be bold/… too? (I assume it's a single word in bold/… within an entire paragraph in a regular face.)</p>
    <p>If there is no standard, what would you say the common practice is?</p>
    <p>Thanks in advance :)</p>
