      <p><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.68.0.5&amp;attributes.sampleSize=48&amp;sampleText=Clue&amp;sampleSize=96&amp;attributes.paraSize=14&amp;paraSize=14" rel="nofollow"><strong>ITC Kabel Ultra</strong></a> is sorta close.</p>
      <p>I found a closer match in an old Photo-Lettering, Inc. sample book, but the typeface is referenced by a number and not a name.</p>
      <p>Parker Bros., originally in Salem, Mass., had a big in-house design and ad agency in its heyday. The game "Clue" probably pre-dates ITC which was founded in 1970, so if the game graphics hasn't been updated since then, it was probably done on using photo headline font.</p>
      <p>-------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
