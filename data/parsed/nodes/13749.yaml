      <p>Penned forms in a loose "Carolingian" style are so hard to exactly match since they've grown like weeds in so many "freebie" font sites.</p>
      <p>Except for the cap "R" you can come close to replicating the sample with <a href="http://www.fontcraft.com/scriptorium/previews/publius.jpg" target="new" rel="nofollow">Publius</a> if you "embold" and extend the characters.</p>
      <p>Sorry, that's all I could find.</p>
