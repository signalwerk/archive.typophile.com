      <p>The new version is a huge improvement. Well done.</p>
      <p>I still would like to see oldstyle figures for verse numbers (which Times New Roman actually does have, in some versions), or at least reduced size lining figures.</p>
      <p>The italic is much more readable than the blackletter, and the two-column setting helps.</p>
      <p>Some of your quotes are still straight.</p>
      <p>You might try reducing your type size by one or two points, but keeping the leading the same. I think that will greatly help your readability overall — smaller type, more space between the lines. This is generally easier to reads than large type, tightly spaced.</p>
