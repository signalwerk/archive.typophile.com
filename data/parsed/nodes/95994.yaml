    html: |-
      <p>Try something other than Times for your body text. A classic serifed font should work well. Perhaps then you can set the biblical extracts in a compatible sans serif — or vice versa.</p>
      <p>I do think the blackletter is too disruptive and unreadable. I might simply use italics, or a second color. If you must use blackletter, though, why not find one that's more open and readable, like Clairvaux? Or simply set the titles ("Acts 1:9–11") in blackletter, and leave the text in roman? Or just use a blackletter drop cap or something?</p>
      <p>I recommend old-style ("lowercase") numerals, and en dashes as opposed to hyphens in verse numbers. You use them sometimes, but not always.</p>
      <p>You do not need quote marks around the biblical passages; a change of font (and, probably indent) is enough.</p>
      <p>I would set the verse numbers in the text in a different color (red) or in light grey.</p>
      <p>If you set the extracts narrower, with a large right margin, and the commentary narrower, with a large left margin, or some such arrangement, you could make an interesting visual alternation between text and commentary, while suggesting two columns or trains of thought.</p>
      <p>The main thing, though, is to find an alternative to the blackletter you're using.</p>
      <p>Super quick sample of a different approach, just to give you some things to think about:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_5452.png"></div><p></p>
