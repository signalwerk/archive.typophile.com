    html: |-
      <ul>
      <li> As previously mentioned, blackletter only makes sense if you are attempting to reproduce some specific printing of the Bible.
      </li><li> Your use of a bold weight within the body of your text is distracting.  Italics are a less disruptive way of providing emphasis.  Similarly, SHOUTING is rude.
      </li><li> Small numbers should generally be written out; e.g., "2" in the first sentence should be "two".
      </li><li> Consider block indenting long quotes.
      </li><li>Your double quotes are a mix of straight quotes and curly ("typographer's") quotes.  You should choose one convention and stick with it; typographer's quotes lead to better looking spacing.
      </li><li>Your measure is much too long.  You can fix this by increasing your left/right margins, and increasing the size of your type.
      </li><li>Your top/bottom margins seem very narrow.  Play with them in order to choose a reasonable aspect ratio for your page space.
      </li><li>The absence of hyphenation (and center justification) leads to very uneven spacing between words, which is disruptive.
      </li><li>Try decreasing your inter-paragraph space and indenting your paragraphs; it would tend to flow better.
      </li><li>Your ordinal indicators could be written as superscripts.
      </li><li>Play with your leading; it seems a bit large with your main body typeface (though not in the blackletter portions...)
      </li><li>The center/bold section headings are rather typewriter-y.
      </li></ul>
      <p>These are just very quick comments. Many of the things that I've commented on look like default settings rather than deliberate choices on your part; if this is so, you may want to consider going through a couple of books on typography and print design.  I've found <cite>The Elements of Typographic Style</cite> by Robert Bringhurst an excellent and accessible introduction to typography in general, and <cite>Book Typography: A Designer's Manual</cite> by Michael Mitchell and Susan Wightman to be an excellent introduction to book design.</p>
