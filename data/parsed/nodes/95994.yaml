    html: |-
      <p>The bold type is a very bad idea: it fragments the text and actually reduces the readability of the document. As soon as one engages with the page, one's eye is drawn to these passages, but they don't make sense without the connecting text. This is lousy text articulation, and there is good reason why, in +550 years, this has never become one of the norms of typography.</p>
      <p>As for reflecting a 'revolutionary' content of the theology... well, no, it just makes you look like a typographical crank, the documentary equivalent of someone ranting on a street corner. Theological arguments must hold their own in the norms of reasoned discourse, and dressing them up with idiosyncratic emphasis is likely to make readers question that ability.</p>
