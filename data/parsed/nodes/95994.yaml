      <p>The above opinions are solid, but mainstream. Specifically:<br>
      - Blackletter <em>can</em> make sense beyond mere historicism - it has a flavor and relevance all its own. That said, it certainly is difficult finding a blackletter than can work in a sophisticated way.<br>
      - Although Bold is indeed almost always too disruptive, do consider using a Demi for emphasis (if available). To me that's even more elegant and functional than using Italics.</p>
