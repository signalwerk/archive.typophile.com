    html: "<p>Have you try contacting the <a class=\"freelinking external\" href=\"http://hafontia.com\" rel=\"nofollow\">author</a> regarding a possible web use of BN Pinky? That may be easier... To me, it looks like some sort of <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/din\" rel=\"nofollow\">DIN</a> Condensed (Mono)/<a class=\"freelinking external\" href=\"http://www.myfonts.com/search/isonorm\" rel=\"nofollow\">Isononorm</a>. As you're apparently after a font for web-purpose only, here some in the same vein and I'm sure they can be used for your website (main difference on /R leg): <a class=\"freelinking external\" href=\"http://www.fontsquirrel.com/fonts/Miso\" rel=\"nofollow\">Miso</a>, <a class=\"freelinking external\" href=\"http://www.impallari.com/dosis\" rel=\"nofollow\">Dosis</a>, <a class=\"freelinking external\" href=\"http://fontfabric.com/static-free-font\" rel=\"nofollow\">Static</a>, <a class=\"freelinking external\" href=\"http://26plus-zeichen.de/fonts/melbourne\" rel=\"nofollow\">Melbourne</a></p>"
