  html: |-
    <p>Greetings folks. I hope this isn't entirely off topic for the ID forum. </p>
    <p>I found this sans serif on dafont.com that I really love: <a class="freelinking external" href="http://www.dafont.com/bn-pinky.font" rel="nofollow">http://www.dafont.com/bn-pinky.font</a> Although it is free to use, the TTF  files themselves appear to be restricted for conversion, which means I cannot use them for my website as I had hoped. </p>
    <p>I was wondering if any of you respected experts might be able to suggest a typeface that is similar in feel to BN Pinky?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bn_pinky_6048.png"></div><p></p>
    <p>Thank you in advance!</p>
