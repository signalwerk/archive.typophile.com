      <p>I have a bias towards thick lines and forms. I think the 3rd in the post above is working nicely, because you're using one form in two ways. You can read into this however you like, but to me, it's about design economy &amp; flexibility.</p>
      <p>I think the mark should sit alone when presented to people who know you're a designer.</p>
      <p>You could also produce a version of that mark with your name / trade <strong>modestly</strong> set below it - for when people need to know your name.</p>
      <p>Arbi Ayvazian or Ayvazian Design</p>
      <p>(Though it looks like you'll need to use something slim and condensed. :)</p>
      <p>In all instances where you've included the full word "design" into the mark, it looks amateur, and it is literally drowning the monogram. The mark is about you, not about the word "design".</p>
