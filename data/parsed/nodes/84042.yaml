  html: |-
    <p>Top paragraph is how FF5/XP renders locally installed Droid Sans (TTF). Bottom paragraph is how the same combination renders @font-face version courtesy of FontSquirrel's webfont kit generator.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/droid-sans_4634.png"></div><br>
    <code></code><p></p>
    <p>If I understand correctly, latter is .woff, <em>but</em> if I change @font-face statement to reference .ttf only, I am still getting the same appearance. Moreover, Google Fonts serves .woff as well and it looks like the top version. The same goes for WebType.</p>
    <p>Any thoughts as to why this could be happening?</p>
