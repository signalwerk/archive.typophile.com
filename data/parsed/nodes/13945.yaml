    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: Garage&nbsp;Fonts</strong></p>
    <p><a href="http://www.garagefonts.com"></a>GarageFonts was established in 1993, primarily as a vehicle to distribute some of the first typeface designs created for Raygun magazine. From the beginning, GarageFonts has always been on the cutting edge of new typeface design. It started as a small library of trend setting designs and continues to grow into a varied collection of original, accessible text and display&nbsp;typefaces.</p>
    <p>GarageFonts is now owned and maintained by <a href="/node/13437" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Phils Fonts</a>.</p>
    <p><strong>External Links</strong><br><a href="http://www.garagefonts.com/">GarageFonts.com</a><br><a href="http://www.fontshop.com/fonts/foundry/garagefonts/">GarageFonts</a> at&nbsp;FontShop</p>
