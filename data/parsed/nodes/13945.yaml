    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Garage Fonts</strong></p>
    <p><a href="http://www.garagefonts.com" rel="nofollow">GarageFonts</a> was established in 1993, primarily as a vehicle to distribute some of the first typeface designs created for Raygun magazine. From the beginning, GarageFonts has always been on the cutting edge of new typeface design. It started as a small library of trend setting designs and continues to grow into a varied collection of original, accessible text and display typefaces.</p>
    <p>GarageFonts is now owned and maintained by <a href="/wiki/Phils%20Fonts" class="freelinking" rel="nofollow">Phils Fonts</a>.</p>
