      <p>Hi Katherine,</p>
      <p>I assume you already have been to these places:<br>
      <a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Typowiki on Frutiger</a>, <a href="http://www.google.com/search?q=site:typophile.com%20frutiger" rel="nofollow">Google search for Frutiger on typophile.com</a></p>
      <p>You can find <a href="http://www.linotype.com/fontsinuse-f.html" rel="nofollow">several samples of the Frutiger typeface in use</a> on the Linotype website; including works for brands/companies like Bang &amp; Olufsen, Deutsche Post or Mitsubishi.<br>
      And, of course, it still is willingly used for signage systems, too. Only recently, I saw it at the <a href="http://www.lvb.de/" rel="nofollow">Leipzig public transport</a>.<br>
      F</p>
