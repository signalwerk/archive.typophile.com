    html: |-
      <p>I hate doing layouts in Word because InDesign is far superior for page layout, but if I must use Word I do my layout directly in Word. </p>
      <p>Anytime you convert a file from one format to another there may be opportunities for things to go wrong, and apparently that's happening when you go from InDesign &gt; RTF &gt; Word.</p>
