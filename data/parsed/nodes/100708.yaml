    <p>So I just saw Sybille Hagmann's Axia typeface<br>
    <a href="http://tinyurl.com/aoupbe9" title="http://tinyurl.com/aoupbe9">http://tinyurl.com/aoupbe9</a><br>
    and one notable thing is that both Roman and Italic in all four weights (plus two stencil styles) are what I call uniwidth, meaning a given glyph is the same set-width across the board. I'm a fan of that sort of thing, but I thought that beyond a narrow range of color it backfires (based on my work on Patria, where I made the Regular and Demi uniwidth, but resorted to what I call "fixed-offset"* for the Light and Bold**). Any opinions from users or observers welcome.</p>
    <p>* Which is where two fonts become uniwidth when a certain tracking value is applied.</p>
    <p>** Which is even pretty light for a Bold.</p>
    <p>hhp</p>
