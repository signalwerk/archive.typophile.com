    html: <p>There was only room for two faces on a mat as far as I know. But in some cases both a weight difference and an italic of the same typeface might be offered as the alternate in two different sets of matrices--so for example you could get Memphis Medium duplexed with its Italic, or you could get Memphis Medium duplexed with Memphis Bold. So they'd all share advance widths.</p>
