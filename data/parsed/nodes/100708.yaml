      <p>Pablo, Jürgen, I'm embarrassed to say I didn't know about those being uniwidth! Thank you.</p>
      <p>Linotype has a nice history of "normalization" (e.g. Compatil) and Kobayashi is a major talent so I'm sure they did a good job with those. However Axia's weight range (from Light to Black) is a good deal bigger than those (as well as Asap's and Mantika's), which is why I wonder how well it works. In my experience the <em>widths</em> of the "outlying" weights have to strain too much to accommodate being uniwidth; the Light becomes too wide, and the Black too narrow. But maybe I'm missing something.</p>
      <blockquote><p>you mean like Linotype</p></blockquote>
      <p>If you mean the 18-unit (or later 54-unit) system, not that either; what I mean is that the "a" for example is the same set width in any weight/style. Or maybe you meant Linotype's "duplexing", where the Italic glyphs matched the set widths of the Roman ones; that's closer, but nothing to do with <em>weight</em> throwing a wrench in it.</p>
      <p>hhp</p>
