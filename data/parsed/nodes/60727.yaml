  html: |-
    <p>Alright Sans is a contemporary grotesk typeface. Simple and clean, with a warm, slightly humanist flavour, Alright Sans is fresh take on the traditional sans-serif. With a robust set of typographic features and 16 styles, Alright is ready to be used for just about anything.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AlrightSans-TT-1_3876.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/AlrightSans-TT-2_5614.gif"></div><p></p>
    <p>Available now at <a href="http://new.myfonts.com/fonts/okay-type/alright-sans/<br />
    " rel="nofollow">MyFonts</a>, and very soon from <a href="http://www.typetrust.com" rel="nofollow">TypeTrust</a> and others.</p>
    <p>-<br>
    Jackson Cavanaugh<br>
    Okay Type &amp; Design<br>
