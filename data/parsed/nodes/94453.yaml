    html: |-
      <p>Unfortunately, only similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/drescher-grotesk-bt/" rel="nofollow">Drescher Grotesk</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/century-gothic/" rel="nofollow">Century Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/neuzeit-grotesk/" rel="nofollow">Neuzeit Grotesk</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/synthview/novecento/" rel="nofollow">Novocento</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/digi-grotesk/" rel="nofollow">Digi Grotesk</a><br>
      Remaining unsolved on <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/?q=submarine" rel="nofollow">WhatTheFont Forum</a> too. Many letters (/C, /G, /C, /E...) look really irregular in form and weight (manually boldened?). The more I look at it the more I think it's handdrawn and/or a font mix. /S is very <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/century-gothic/" rel="nofollow">Century Gothic</a>, /C <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/drescher-grotesk-bt/" rel="nofollow">Drescher Grotesk</a>, /M could even come from <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-din/" rel="nofollow">DIN</a>...<br>
      Same vein: <a class="freelinking external" href="http://www.radimpesko.com/fonts/fugue" rel="nofollow">Fugue</a>, <a class="freelinking external" href="http://www.colophon-foundry.org/fonts/raisonne" rel="nofollow">Raisonne</a>, <a class="freelinking external" href="http://www.colophon-foundry.org/fonts/apercu" rel="nofollow">Aperçu</a>, <a class="freelinking external" href="http://www.abstractfonts.com/font/12605" rel="nofollow">Am Sans</a></p>
