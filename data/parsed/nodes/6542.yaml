  html: <p>The cheap (GAP like) Japanese clothing store Uni Glo in Wimbledon (London) has t shirts with Linotype fonts, Stop, Crillee, Slipstream and another for sale as a joint venture with Lino and the cheap jean retailer.  <br> <br>They are white, with black text that just repeat Stop, Stop, Stop, or Crillee Crillee Crillee or just Slipstream and finally a digital LED ASCII character set on each set. They also had some student designs that might not be Linotype tshirts. <br>  <br>They had them on the Manikins at the front of the store. I thought they just got them from Oxfam and stuck them under the button up shirts for the third world peasant look. <br> <br>The end is near!</p>
