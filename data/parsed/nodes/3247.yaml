    html: "<p>I think that's a typeface. Here's why: <br>Compare the S. On the left it looks like a capital form, on the right it looks lowercase. At the very least there is no reason that they should be different in a custom logo of this genre. The K is definitely capital. I don't think we're looking at a custom unicase logo, but two weights of a font scaled to acheive the purpose. <br> <br>They wouldn't be the first company who could afford better but chose not to. <br> <br>For all that guessing you'd think I'd hazard a guess on the font? <br>I have no idea :-) <br> <br>Randy (Apex came to mind, but it's not that)</p>"
