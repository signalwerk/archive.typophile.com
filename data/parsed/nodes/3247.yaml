    html: <p>I just came across <a href="http://thetvroom.com/area-c/tvfonts/section-front.shtml" target="_blank"> this site</a>, which has "Skyward" fonts made to mimic. <br>The original font is attributed to X&amp;Y Design, the only links for which I <br>could find related to furniture design. <br> <br>Note that Skyward Regular has a lc e and n which, if blown up to match <br>the size of the other (uc) letters, has about the right weight. PC only (again). <br></p>
