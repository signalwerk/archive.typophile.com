    html: |-
      <p>If not FontForge, what else ;)</p>
      <p>My experience is very positive, actually it is the sole font editor that I've ever used. The most important "feature" of FontForge (besides being free, as in freedom, software), is its very responsive maintainer who has always been more than willing to implement features or fix bugs mostly within few hours. Thanks to its freeness, I can now even implement the features I want, patches are always welcomed.</p>
      <p>As far as Arabic is concerned, it supports all OpenType features that I ever needed (mark positing, glyph substitution, contextual and non-contextual and so on). It has a powerful GUI where all OpenType work can be done, but also supports Adobe OpenType feature files and can merge them to existing fonts or generate them from existing features in the font. Also, unlike Volt, it preserves existing OpenType tables and the font and thus can be further edited.</p>
      <p>It has also have powerful scripting, both Python and its own scripting languages, that simplify many repeated tasks, but also allowed me to do many neat tricks.</p>
      <p>I developed many Arabic fonts using FontForge, lastly is my <a href="http://amiri.sourceforge.net" title="Click to visit an external URL." class="freelink freelink-external freelink-external"> Bulaq Naskh revival</a>, and there are more Arabic fonts in the pipeline.</p>
