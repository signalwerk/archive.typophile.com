    <p>Hi there.</p>
    <p>Another newbie question :)</p>
    <p>Do you use FontLab to generate OpenType features of Arabic script? When I try to compile/generate some font with fina, medi and init features, generated output is always deformed or reordered. So I tried to write complex (=unstable) scripts to generate VOLT code from FontLab font, but it's sometimes unreliable.</p>
    <p>Any suggestions?</p>
