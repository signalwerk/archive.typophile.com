      <p><em>If not FontForge, what else ;)</em><br>
      Thank you Dr. Hosny for the positive and informative comments. Perhaps you can re-publish them in a new thread devoted to Arabic on FontForge. </p>
      <p>In the past I briefly tried FontForge on Ubuntu (Linux) Operating System and it worked well. Today I installed it on Snow Leopard (it is displayed within the X11 protocol which has to be installed as well) and it looks great on a big screen. However it kept crashing when I tried to delete a glyph outline I am not sure if it is the X11 or FF that is causing this.</p>
      <p>Your generous commitment to free type and wide experience in Arabic type design emboldens me to suggest that you kindly compile and publish a detailed explanations of key steps in the use of FF for Arabic.  That would be a great service to the community.</p>
      <p>For example is there an 'empty' FF OT file for Arabic that can be the basis for a designer to "fill in" the glyphs of his or her design? I mean one in which الل the basic glyphs are named and displayed, with standard substitution and other tables necessary for the correct operation of Arabic (Persian Urdu, etc.) will be included in the file.<br>
      ألف شكر و بارك الله جهودك</p>
