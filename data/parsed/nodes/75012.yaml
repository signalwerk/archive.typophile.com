      <p>AFAIK, people who do Arabic fonts with FontLab always use Volt, actually any one doing complex OpenType layout and using FontLab seems to be using Volt as well. The other option is to write feature files by hand and compile it externally using AFDKO which what FontLab is using under the hood anyway.</p>
      <p>Myself, I like to keep my glyph design and OpenType works always in sync, so I use a font editor that can do both reliably.</p>
