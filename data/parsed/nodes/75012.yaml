    html: <p>I wrote a preliminary tutorial in Arabic while ago, it can be found <a href="http://www.ojuba.org/wiki/docs/%D8%AA%D8%B7%D9%88%D9%8A%D8%B1_%D8%A7%D9%84%D8%AE%D8%B7%D9%88%D8%B7" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>, I did not manage to finish it, unfortunately, but is should cover the basics. Having a font template is a nice idea, I don't currently have one for that purpose, but you can use the <a href="http://svn.arabeyes.org/viewvc/art/khotot/kacst/one/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">KACST One</a> font as a base (the font itself is GPL, but the layout code has all been done by me and I put it into public domain). As part of the Bulaq Naskh revival, there will be a font with a simplified subset of glyph alternate and more conventional OpenType code (i.e. more widely supported than the current Amiri font) and I hope to provide it a template for other to use freely.</p>
