    html: |-
      <p>The jet behind the singer looks like something from the late 50's or 60's. If the cover art was prepared then the font would probably have been photo-composition Note that the S seems out of alignment -- tilted left -- as if it had been poorly applied. If so, then the font was probably something sold by a French equivalent to Letraset. Noting Ryuk's search results, the font was probably never converted to digital.<br>
      The font has a high waist and an N where the diagonal intersects halfway up the right hand stroke.<br>
      NT Cornelia has a similar N.<br>
      High waisted fonts were popular before 1900 but few have been digitized.  There is at least one high waisted font, but it has serifs. This is <a href="//www.myfonts.com/fonts/adobe/eccentric/" rel="nofollow">Eccentric</a> designed by Gustav F. Schroeder in 1881 and published by Adobe and others.<br>
      Don</p><div class="imageWrap"><img src="http://typophile.com/files/Eccentric@Adobe_3476.jpg"></div><br>
      MyFonts blurb:<br>
      "Eccentric is an all-capital, narrow-bodied, monoline display face that could be described as high waisted. With cross-bars and main junctures more than halfway up the letterforms, every letter - except the W - has a long-legged appearance."<br>
      Don<p></p>
