    html: |-
      <p>Well it was a stab in the dark. But you are right, in the 1950's and early 60s in the Anglosphere, almost everyone looked "neat" even pop singers. Was this also true of the Franco world? Or had the 5 day unshaven look already arrived? I defer to pop culture experts.<br>
      As an alternative to photo-composition, the letters could have been selectively  stretched in Illustrator or Photoshop to create a high waist effect.<br>
      An easy font to make, which has with some appeal, as laurent's post indicates. I'm surprised that there seems to be nothing on the market, or released as an amateur creation.<br>
      Don</p>
