    html: <p>I had a hunch this was a new photo taken in front of an old airplane. It had nothing to do with the typography. In the 1950s, when you saw a dude with three days' beard and a jacket that didn't fit, he wasn't a pop star, he was a homeless guy. <a class="freelinking external" href="http://www.bertrandbelin.com/" rel="nofollow">A quick Google search</a> confirmed that this album was released on May 27, 2013.</p>
