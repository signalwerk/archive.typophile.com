    <p><img src="/sites/default/files/old-images/1-DA_Header_6329.png"><br>
    Alphabet Soup Type Founders and Michael Doret are proud to announce the Release of Dark Angel, a “blackletter/hybrid” font. This font had its genesis in a logo sketch for the Anaheim Angels baseball team—thus its name.<br>
    Type purists may be appalled by the lack of adherence to traditional forms, but the font should be seen as only “in the spirit of” blackletter, and attempting something that hasn’t been seen or done before—something that feels traditional, yet at the same time fresh and perhaps unexpected.</p>
    <p><img src="/sites/default/files/old-images/2-DA_Header_5479.png"></p>
    <p>Dark Angel can be purchased in its regular solid form, or as Dark Angel Underlight—a handtooled font. If these two fonts are purchased together, the Family package will contain a third font—Dark Angel Highlight. With this font layered over the basic font, you can achieve two–color typesetting when the highlight and the base font are assigned two different colors.<br><img src="/sites/default/files/old-images/3-DA_3Fonts_5571.png"><br><img src="/sites/default/files/old-images/4-DieYoung_3979.png"><br>
    With Stylistic Alternates you can go either “Plain” or “Fancy”, changing the look of your copy to suit your needs. Compare the two samples below. Some characters have multiple alternates.<br><img src="/sites/default/files/old-images/5-Plain_Fancy_5122.png"><br>
    And furthermore…<br><img src="/sites/default/files/old-images/6-LCswashes_4997.png"><br><img src="/sites/default/files/old-images/7-Special_3566.png"><br>
    Dark Angel has enough language support to make the builders of Babel envious—its 1,163 glyphs can be used to set copy in 59 different languages. From A to Z: Afrikaans, Albanian, Basque, Bemba, Bosnian, Catalan, Cornish, Croatian, Czech, Danish, Dutch, English, Esperanto, Estonian, Faroese, Filipino, Finnish, French, Galician, Ganda, German, Hungarian, Icelandic, Indonesian, Irish, Italian, Kalaallisut, Kamba, Kikuyu, Kinyarwanda, Lithuanian, Luo, Malagasy, Malay, Maltese, Manx, Morisyen, North Ndebele, Norwegian Bokmål, Norwegian Nynorsk, Nyankole, Oromo, Polish, Portuguese, Romansh, Sango, Shona, Slovak, Slovenian, Somali, Spanish, Swahili, Swedish, Swiss German, Turkish, Welsh, and last (but not least) Zulu.<br><img src="/sites/default/files/old-images/8-Babel_5253.png"><br><img src="/sites/default/files/old-images/9-Abandon_6266.png"><br>
    For more detailed information please download <a href="http://www.michaeldoret.com/AlphabetSoup/DarkAngel_Manual.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">“The Dark Angel Manual”</a> pdf (1.1 MB).<br>
    Dark Angel on <a href="http://www.myfonts.com/fonts/alphabetsoup/dark-angel" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a><br>
    Coincidental to the release of Dark Angel on MyFonts, Alphabet Soup is running a Special Promotion: 25% off this font for a limited time.<br>
    Dark Angel Design and Art: Michael Doret<br>
    Dark Angel OpenType Programming: <a href="http://canadatype.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Patrick Griffin/Canada Type</a></p>
