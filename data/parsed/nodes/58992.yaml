      <p>I'd try shaping some more letters to see what overall direction and characteristics develop before thinking about spacing. Find out whether this will have stress, and if so how much. Set lines of letters to see whether the x-height pleases your eye. Find out what style of serif works. Learn about optical correction and how to harmonise the different glyphs. Start with the letters that spell 'Hamburgefontsiv' so you can get a variety of shapes with which to experiment. It's generally a good idea to think about what you want your font to do: text, display, large size, small size, screen use...</p>
      <p>Then go back and forth as many times as you can, tweaking and undoing, printing and refining, shaping and spacing. The process is what makes it work, and at this stage you don't have a whole lot of letters to play with.</p>
