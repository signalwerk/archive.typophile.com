    <p>So a few days ago I began work on my very first typeface. I am a graphic design student and I haven't built up a great sensitivity to type yet so i would like to get some feedback on the very early stages of my font. </p>
    <p>These are the only letters that i have so far, I wouldn't say they are complete in any regards but they are the first to have form. I think that the next letters I will work on will be the lower case and uppercase E as well as the lower case and upper  case C. </p>
    <p>I was hoping to get some feedback on multiple aspects of the font. First of all, I would like some feedback on the negative space. So far there hasn't been any work on actual letter spacing so I don't need feedback on that this early in the process but I would like to know about how well the counters work and the space around the letters. Secondly I would like some feedback on the stresses and on the stroke weight. Specifically I would love some feedback on the lowercase a. I have been having some trouble in getting it to match with the other characters. Also, as I don't even know what I don't know I would like any other feedback that may be offered. </p>
    <p>I thank you in advance for anyone willing to lend their experience and insight. The font is very early in its creation (i haven't even thought of what to call it when it's finished) and it will most likely change very very drastically before it is finished.</p>
    <p><a class="freelinking external" href="http://img521.imageshack.us/img521/3598/fontv.png" rel="nofollow">http://img521.imageshack.us/img521/3598/fontv.png</a></p>
