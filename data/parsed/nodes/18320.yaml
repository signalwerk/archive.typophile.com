      <p>Since your budget allowed for Mercury, perhaps you could go for:</p>
      <p>IF friendly, TRY Whitney<br>
      IF modern, TRY Gotham<br>
      IF corporate, TRY Unit</p>
      <p>As it highlight each school within the university I’d just question if the university hopes friendly, modern or corporate. Once you can tell us which one of those we might be able to narrow it down.</p>
