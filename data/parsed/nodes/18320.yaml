    <p>Hi,</p>
    <p>I’m designing a large booklet for a university in my community. I am using Hoefler and Frere-Jones’ <a href="http://www.typography.com/catalog/mercurydisplay/index.html">Mercury Display</a> and <a href="http://www.typography.com/catalog/mercurytext/index.html">Mercury Text</a> throughout, but I would like to compliment these by using a sans serif font for subheadings, captions, etc. Suggestions?</p>
