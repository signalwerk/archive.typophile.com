      <p>Garth, I second Tiffany’s recommendations. Gotham and Whitney were both published by Hoefler &amp; Frere-Jones, the minds behind Mercury. You can’t do too much better. (Unless your budget has been blown on Mercury. ;-)</p>
      <p>Unit is also a great and very useful typeface from the rockstar duo of Erik Spiekermann on vocals and bass, and Christian Schwartz on lead guitar. </p>
      <p>And if you stick around for a few hours some type designers will stop by and suggest their own work.</p>
