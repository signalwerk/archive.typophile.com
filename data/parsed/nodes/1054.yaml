    html: <p>So these fonts were being sold retail, but then were bought out and pulled out? That's pretty interesting (and equally rare). Doesn't the client mind that it's too late to make it exclusive, at least not totally? <br> <br>&gt; what should a type designer charge <br> <br>It depends on your personal circumstances (like where you live, and what reputation you have), but I'd say around $1500, plus-minus $500, for a typical three-font family, for one or two years. No fancy hinting or character sets. <br> <br>hhp <br></p>
