  html: <p>I am switching from PC to Mac and there are a few fonts that I want to take with me. What is the best program that I could buy that would convert the fonts?</p>
comments:
  - id: 238529
    user_id: 19052
    user_name: brandons
    user_path: null
    date_raw: 9 Nov 2007 — 6:23pm
    date: 2007-11-09T18:23:00
    votes: null
    html: <p>The fonts on your PC will almost certainly work on the Mac too, no conversion necessary, especially if they're in TrueType or OpenType format. If that's not the case, I remember using <a href="http://www.asy.com/scrcf.htm" rel="nofollow">CrossFont</a> back in the day, but there may be something better out there now.</p>
  - id: 238543
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    date_raw: 9 Nov 2007 — 7:42pm
    date: 2007-11-09T19:42:00
    votes: null
    html: <p><a href="http://www.fontlab.com/cgibin/t.cgi?a=310911&amp;e=font-converter/transtype/" rel="nofollow">TransType</a> is the finest converter. But if you want to keep legal, you should check the EULAs for your fonts. Most foundries don't allow conversions. You can also ask the source retailer to convert the fonts for you.</p>
  - id: 238556
    user_id: 1794
    user_name: Typography.Guru
    user_path: null
    date_raw: 10 Nov 2007 — 12:01am
    date: 2007-11-10T00:01:00
    votes: null
    html: <p>And PostScript Type1 fonts can be used with the Adobe apps if you put them in one of the Adobe font directories.</p>
  - id: 238597
    user_id: 14556
    user_name: cuttlefish
    user_path: null
    date_raw: 10 Nov 2007 — 9:10am
    date: 2007-11-10T09:10:00
    votes: null
    html: |-
      <p>There was once a freeware utility called TT Converter that would convert Windows .TTF files into MacOS 9 TrueType suitcases (sometimes taking system-crashing corruption with them). Under MacOS X that's no longer necessary. TTF files <em>are supposed to</em> work natively. A few of them just won't, but they may have been technically flawed to begin with.</p>
      <p>For the PostScript fonts, yeah, you will have to go with one of the above suggestions, or maybe open the fonts in <a class="freelinking external" href="http://fontforge.sf.net/" rel="nofollow">FontForge</a> and save them out to a Mac usable format.</p>
