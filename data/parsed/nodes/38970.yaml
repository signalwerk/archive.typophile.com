  - id: 238597
    user: 14556
    date: 2007-11-10T09:10:00
    date_raw: 10 Nov 2007 — 9:10am
    votes: null
    html: |-
      <p>There was once a freeware utility called TT Converter that would convert Windows .TTF files into MacOS 9 TrueType suitcases (sometimes taking system-crashing corruption with them). Under MacOS X that's no longer necessary. TTF files <em>are supposed to</em> work natively. A few of them just won't, but they may have been technically flawed to begin with.</p>
      <p>For the PostScript fonts, yeah, you will have to go with one of the above suggestions, or maybe open the fonts in <a class="freelinking external" href="http://fontforge.sf.net/" rel="nofollow">FontForge</a> and save them out to a Mac usable format.</p>
