    html: <p><a href="http://www.fontlab.com/cgibin/t.cgi?a=310911&amp;e=font-converter/transtype/" rel="nofollow">TransType</a> is the finest converter. But if you want to keep legal, you should check the EULAs for your fonts. Most foundries don't allow conversions. You can also ask the source retailer to convert the fonts for you.</p>
