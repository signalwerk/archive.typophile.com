      <p>For the PostScript fonts, yeah, you will have to go with one of the above suggestions, or maybe open the fonts in <a class="freelinking external link-external" href="http://fontforge.sf.net/" rel="nofollow">FontForge</a> and save them out to a Mac usable format.</p>
