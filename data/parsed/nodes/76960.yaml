    html: <p>Since single story versions have fewer horizontal strokes to stack up, they are often attractive alternatives for fonts with relatively thick horizontals, such as monoline or low-contrast sans faces. (Especially true for /g/.) Note that Gill Sans Ultra (to name one example) switches over to the single-story form.</p>
