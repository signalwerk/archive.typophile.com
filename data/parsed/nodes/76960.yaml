    html: <p>I've heard it said that the lc italic /g/ used when setting mathematical equations should be single-story, but have not yet heard a convincing rationale for why this should be true. I've seen it done both ways, and it doesn't seem to make a difference in legibility to my eyes. If anything, making /q/ and /g/ distinct is a very good reason to use a double-story /g/. I've seen one book that skimped on the typography and blindly adhered to the single-story rule and ended up using a very sans-looking single-story lc italic /g/ with Times italic to very poor effect.</p>
