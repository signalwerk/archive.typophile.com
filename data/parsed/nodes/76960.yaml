      <p>Well, in a text font, such as you'd use for a book, you typically use the two-story variants of both letters. This helps people distinguish between a, q, and g. In italics, the a normally goes to one story, but the g more often than not keeps both stories. (But there are some text fonts with a one-story g.) </p>
      <p>In any other kind of font, though, there aren't really rules. I'd say (non-italic) fonts with a two-story g probably almost always have a two-story a, but the reverse isn't true—tons of sans serif fonts have a two-story a and a one-story g.</p>
