    <p>Just wondering if there is any technical protocol for creating a double or single story of each character? I initially thought sans serif leaned towards single story characters and vice versa (serif typefaces were typically two story) but I see this isn't mandatory. </p>
    <p>According to the ever-correct Wikipedia, there is no technical right or wrong.<br><a href="http://en.wikipedia.org/wiki/G">http://en.wikipedia.org/wiki/G</a><br>
    &amp;<br><a href="http://en.wikipedia.org/wiki/A">http://en.wikipedia.org/wiki/A</a></p>
    <p>Does anyone have any recommendations or preferences when you create these letters in a new typeface?</p>
