    html: <p>Hi Paul, <br>Looking at your photographs I keep thinking of Franklin Gothic. It may be the foreigner's romantic view of early 20th Century New York but, to me, those desolate industrial spaces are calling for some of Benton's faces. <br> <br>I think a nicely spaced and carefully sized Franklin Gothic Heavy would work very well for titles and, specially, captions. And if you print photopolymer-letterpress it will help convey the strong human-scale dimension of that face. <br> <br>Raph Levien has on his site some <a href="http://levien.com/type/atf_1923/" target="_blank"> images</a> of the 1923 ATF specimen book, with nice samples of both Franklin and News Gothic. <br><a href="http://www.linotype.com/12600/itcfranklingothicheavy-font.html?PHPSESSID=0b3163a10bba60888762e3d419511cb3" target="_blank">Link</a> to Linotype's ITC Franklin Gothic. <br> <br>I hope this helps, your work is really good and, regardless of your type choice, I'm sure it will be a beautiful book.</p>
