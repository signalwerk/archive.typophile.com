    html: <p>I was originally using metrics, which seemed quite uneven. optical kerning improves the evenness, but doesn't actually make it look right. <br> <br>Does anyone have opinions on Storm Andulka? I've been looking at Storm's samples and I like it very much. I'm considering using it for text, and using Mrs Eaves for the titling capitals. I have a hard time trusting my judgement based on someone else's text samples (in Czech!).</p>
