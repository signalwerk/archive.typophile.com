    html: <p>How about Vendetta? It's got a bit of quirkiness that adds character (No pun), but it's not silly. It has an edginess that would stand up to the blackness of the photos (I took a peek; rich work�I think your font is going to have some substance to it.) If you remain attached to  Mrs. Eaves, using it as display type and Baskerville for body copy would not be amiss. They are conceptual cousins. It's just that Baskerville can be a bit thin.</p>
