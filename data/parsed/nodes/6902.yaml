    html: <p>Thanks for all the advice, everyone. <br>I've been experimenting a lot, and nothing looks as good as Mrs. eaves for the title page and cover type. But it's not working for the body copy, partly because of the low x-height and partly because of the messed up letterspacing.  <br> <br>Of everything I've looked at for the text, the two faces that look best are baskerville (which I guess eaves is based on) and cochin. <br> <br>Do you think it's strange to use two different serif text faces like this? They won't be on the same page as each other ... the mrs. eaves will only be at the front of the book, since there won't be display copy used with the text. <br> <br>One thing I find I like for this project is a capital W without a center serif (as in the baskerville and the eaves, but not the cochin). I know this sounds nitpicky, but it stands out for me since the title starts with W.</p>
