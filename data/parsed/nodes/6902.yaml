  html: <p>Hello, <br>I'm looking for advice on type for an artist's book. The book will be mostly photographs, printed in warm quadratone, one to a page (in some cases one to a spread). There will type on title pages, acknowledgements, and on a one or two page essay. The type is set simply, fairly large (13pt) and the essay is set with very large margins. Page size is 15 x 13 inches. <br> <br>The photographs are dense and lush, but of stark subject matter, and formally could be seen as late modern. The overall time feel of the images is "some time in the 20th or 21st centuries."  <br> <br>I've expermimented with a couple of treatments, including sans serif (which just seemed to plain in the context of the work) and traditional serif faces like Garamond and Bembo, which seemed to "retro" and to overemphasize that aspect of the work. <br> <br>My current mockup uses Mrs. Eaves. I like the general look of it, but the letterspacing in the body copy is kind of wonky. Also, it seems kind of trendy right now ... I'd prefer something with a similar feel but fresher. <br> <br>As a final note, I may end up having the text printed letterpress from plates made from digital files. Mrs. Eaves seems designed to give a "letterpress look" and I'm not sure if it's a good idea to print a face that mimics letterpress on an actual letterpress. However, I may end up printing conventionally, so ideally I'll use a type that would work with either approach. <br> <br>Any thoughts on what I might look at? <br>Some samples of the photographs are at <a href="http://www.paulraphaelson.com" target="_blank">www.paulraphaelson.com</a> <br> <br>Thank you very much for any help.</p>
