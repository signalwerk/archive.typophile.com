    html: <p>&lt;font class="dontLookLikeCrap"&gt; <br>Thank you, Jesus, for the kind words about my work. <br> <br>I'm interested in earlier the remark that Mrs. Eaves' spacing is fixed by Indesign. I thought this might be the case and printed a sample; indesign definitely flowed the paragraph better, but the letterspacing within the words was about the same. Is there a preference or something within the program that can adjust this? <br> <br>I've also been looking at Veljovic. The color is a bit light, but otherwise I like the type very much.  <br> <br>I'm definitely sticking to serif fonts .. my experiments with sans serif just haven't worked out for this project. <br>Still looking, but I'm considering all the suggestions here and I greatly appreciate all the input. <br>&lt;/font&gt;</p>
