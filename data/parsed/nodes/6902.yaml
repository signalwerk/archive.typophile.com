    html: <p>Of the suggestions above, my favorite is the Wilson. If the Mrs Eaves is working for you, the Wilson will probably work just as well or better. <br> <br>Especially if you're going to go through with the photopolymer, I might also suggest Centaur. The current digitization suffers from being a bit thin and spidery, but cranking up the press gain could fix that. I'm working on optically scaled versions, but it's going to be quite some time before those are ready. <br> <br>The Sierra Club has used Centaur in their photo books to great effect. I was just looking at "This is the American Earth".</p>
