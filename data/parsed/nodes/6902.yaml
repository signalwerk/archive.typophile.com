    html: "<p>Regarding your question about word spacing in InDesign: <br> <br>Open the Paragraph palette. In the fly-out menu, choose Justification. Then set the Desired value to something less than 100% to tighten the word spacing. (I've used values as low as 40%-50% for headlines.) <br> <br>Note that the Minimum and Maximum settings only come into play when text is justified, and that your Minimum percentage must always be smaller than the Desired setting.</p>"
