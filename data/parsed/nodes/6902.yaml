    html: "<p>If you want a Mrs Eaves that actually works for text, try The Foundry's Wilson: <br><a href=\"http://www.foundrytypes.co.uk/foundry_wilson/wilson.html\" target=\"_blank\">http://www.foundrytypes.co.uk/foundry_wilson/wilson.html</a> <br>For one thing, it's not trendy at all - it's pretty rare. <br> <br>Another option is to use InDesign, since its optical spacing fixes Mrs Eaves's horrid spacing. <br> <br>Photopolymer letterpress printing: since letterpress has notable gain while offset doesn't, you can't really have the same exact font come out nice on both mediums. But if you find a typeface that has many weights in a very tight range (or if you manage to tweak the weight of the font yourself, or maybe outsource that task) then you could just swap the two weights as needed. Just watch the linebreaks if the two weights are not uniwidth. <br> <br>hhp</p>"
    html_clean: "<p>If you want a Mrs Eaves that actually works for text, try The Foundry's Wilson: <br><a href=\"http://www.foundrytypes.co.uk/foundry_wilson/wilson.html\" target=\"_blank\" class=\"link-external\">http://www.foundrytypes.co.uk/foundry_wilson/wilson.html</a> <br>For one thing, it's not trendy at all - it's pretty rare. <br> <br>Another option is to use InDesign, since its optical spacing fixes Mrs Eaves's horrid spacing. <br> <br>Photopolymer letterpress printing: since letterpress has notable gain while offset doesn't, you can't really have the same exact font come out nice on both mediums. But if you find a typeface that has many weights in a very tight range (or if you manage to tweak the weight of the font yourself, or maybe outsource that task) then you could just swap the two weights as needed. Just watch the linebreaks if the two weights are not uniwidth. <br> <br>hhp</p>"
