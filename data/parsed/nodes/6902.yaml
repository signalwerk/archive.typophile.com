    html: <p>Some really good suggestions here. <br> <br>Keep in mind that with traditional letterpress, depending on the font and paper choice, the line weights can tend to come out appearing just a tad narrower than with other printing methods. <br> <br>Have you considered using Democratica as a typeface? It's got a twist to it, and I particularly like combining the cap and lowercase letterforms in the same word, as they have the same height.  <br> <br>Might be a bit trendy, tho.</p>
