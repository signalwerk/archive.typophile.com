      <p>I didn't see the gas pump or a pick (and I'm a guitarist). Most picks have two rounded corners and one pointy one - more of an isosceles triangle than an equilateral one.</p>
      <p>Maybe use the nozzle of the gas pump rather than the pump itself, or a Jerry can with a spout.</p>
      <p>I don't get the typeface choice. It says neither "Rock" nor "Fuel" to me. This would be a great opportunity to use an old-timey sign painter style script. Check out <a href="http://www.houseind.com/index.php?page=showfont&amp;id=23" target="_blank" rel="nofollow">House</a> or <a href="http://letterheadfonts.com/" target="_blank" rel="nofollow">Letterhead</a> for some options (watch out for Letterhead's DRM). I'd even grunge up the whole thing to make it look like peeling paint.</p>
      <p>The colours work well. Very gas-station-like.</p>
      <p>Overall, could use some tweaking, but I like the direction.</p>
      <p> - Lex</p>
