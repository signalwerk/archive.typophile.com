      <p>1 - Looks like "cock fuel" - probably not the image the band wants. Even though the blackletter form of 'r' is correct, you'll probably want to cheat it to look more like a conventional 'r', or even capitalize "Rock".</p>
      <p>2 - Maybe put the fuel tank before "ROCK FUEL" or even find a way to integrate it into the 'R'.</p>
