    html: |-
      <p>Jim --</p>
      <p>A: Bembo Semibold (Monotype)-- <strong>Nope.</strong><br>
      B: Bembo Book (Monotype)-- <strong>YES!!!! Wheehee!</strong><br>
      C: Bembo Schoolbook (Monotype)-- <strong>Nope.</strong><br>
      D: Bembo Semibold Small Caps?? *shrug* -- <strong>Nope.</strong> But you're close.</p>
      <p><em>Annoying message No. 2</em> &gt;<br>
      Though we are comparing low resolution screen rendered versions of <em>most</em> of the specimens, they are all done to scale.</p>
      <p>When a person asks what typeface something is set in, it really depends on many variables. But when a person wants a font identified, one must really be a detective:</p>
      <p>- When was it done?<br>
      - How big is the original sample?<br>
      - What do you know about the production of the sample?<br>
      - Why does it look subtly different than the samples you can find online?<br>
      - If it's Bembo (or insert another type name here) why can't I match it?<br>
      To list just a few key questions.</p>
