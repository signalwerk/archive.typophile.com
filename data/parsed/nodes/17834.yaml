    html: |-
      <p>The samples were done or rendered at 60 pts and the image is at 100% (though it depends on what display settings your monitor is set at).</p>
      <p>One of the samples is hot metal, the others are all digital.</p>
      <p>A 60 pt hot metal type is designed differently than an 18 point hot metal type even though they are the same "typeface". Some digital foundries will or are trying to adapt for scalable fonts, while most produce a single master regardless of scale.</p>
      <p>This is not meant as good or bad practice, but it will account for why certain pre-digital display size typefaces output differently than their digital counterparts.</p>
      <p><em>Annoying message No. 3</em> &gt;<br>
      An <em>expert</em> typographer will take into account all variants and renditions of a typeface. What works at 10 point for text may not work at all for display sizes. Selecting one foundry's font for body copy and another foundry's font of the same typeface for large display sizes may be what it takes to make the difference.</p>
