    votes: null
    html: |-
      <p>Selecting Bembo for the challenge was stricly based on getting a clean sample of the hot metal version at 60 pts. as well as there being several digital font versions available.</p>
      <p>Bembo is essentially a text face, and scrutinizing it at large point sizes is almost pointless, unless it's going to be set for display. Selecting a typeface for bodycopy should always be done by examining blocks of text printed at high resolution (1200 dpi+). A pdf specimen file would give you such options for printing at hi-res, but sadly, such specimens are not always available for today's type specifiers.</p>
