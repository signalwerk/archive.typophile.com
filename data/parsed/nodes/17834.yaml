      <p><em>Yet more annoying messages</em> &gt;</p>
      <p>Asking the Typophile forum members for a font/typeface ID is taking only a small part of the vast type expertise they offer for free, and even less than can be actually learned about type and how best to use it.</p>
      <p>There seems to be a deepening and widening gap between graphic designers who can name a font and those who can use it well. Getting a chance to learn about the <em>black arts</em>, and what your mother wouln't teach about type is a gift that can be had, at least in part, from active participation in the forum.</p>
      <p>Finding out a font name is okay, but learning about type is better.</p>
