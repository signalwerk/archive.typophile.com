    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: William&nbsp;Thorowgood</strong></p>
    <p>In 1794 <a href="/node/16721" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Thorne</a> had purchased the foundry of <a href="/node/add/wiki?edit%5Btitle%5D=Thomas%20Cottrell" title="Create node &quot;Thomas Cottrell&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Thomas Cottrell</a>, a former employee of <a href="/node/add/wiki?edit%5Btitle%5D=William%20Caslon" title="Create node &quot;William Caslon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">William Caslon</a>, which had been founded in 1757 when Cottrell and <a href="/node/add/wiki?edit%5Btitle%5D=Joseph%20Jackson" title="Create node &quot;Joseph Jackson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joseph Jackson</a> were fired in a wage dispute. Upon Thorne’s death in 1820 the foundry was purchased at auction by <a href="/node/16722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">William Thorowgood</a> using money he had won in a lottery. Though he was never involved in the type founding business before this Thorowgood made the foundry initially successful by publicizing Thorne’s typefaces. Many of the types identified as Thorowgood’s are actually the designs of Robert Thorne. Thorowgood went on to issue new specimens and added more typefaces including Frakturs, Greeks, and Russian types which he obtained from the <a href="/node/add/wiki?edit%5Btitle%5D=Breitkopf%20and%20H%C3%A4rtel" title="Create node &quot;Breitkopf and Härtel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Breitkopf and Härtel</a> foundry of Leipzig, Germany. In 1828 he also purchased the <a href="/node/add/wiki?edit%5Btitle%5D=Edmund%20Fry" title="Create node &quot;Edmund Fry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Edmund Fry</a> foundry which had a large collection of foreign language types as well. Robert Besley became a partner in the firm in 1828, and on Thorowgood’s retirement in 1849 Besley took over the&nbsp;foundry.</p>
