    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : William Thorowgood</strong></p>
    <p>In 1794 <a href="/wiki/Robert%20Thorne" class="freelinking" rel="nofollow">Robert Thorne</a> had purchased the foundry of <a href="/wiki/Thomas%20Cottrell" class="freelinking" rel="nofollow">Thomas Cottrell</a>, a former employee of <a href="/wiki/William%20Caslon" class="freelinking" rel="nofollow">William Caslon</a>, which had been founded in 1757 when Cottrell and <a href="/wiki/Joseph%20Jackson" class="freelinking" rel="nofollow">Joseph Jackson</a> were fired in a wage dispute. Upon Thorne’s death in 1820 the foundry was purchased at auction by <a href="/wiki/William%20Thorowgood" class="freelinking" rel="nofollow">William Thorowgood</a> using money he had won in a lottery. Though he was never involved in the type founding business before this Thorowgood made the foundry initially successful by publicizing Thorne's typefaces. Many of the types identified as Thorowgood's are actually the designs of Robert Thorne. Thorowgood went on to issue new specimens and added more typefaces including Frakturs, Greeks, and Russian types which he obtained from the <a href="/wiki/Breitkopf%20and%20H%C3%A4rtel" class="freelinking" rel="nofollow">Breitkopf and Härtel</a> foundry of Leipzig, Germany. In 1828 he also purchased the <a href="/wiki/Edmund%20Fry" class="freelinking" rel="nofollow">Edmund Fry</a> foundry which had a large collection of foreign language types as well. Robert Besley became a partner in the firm in 1828, and on Thorowgood's retirement in 1849 Besley took over the foundry.</p>
