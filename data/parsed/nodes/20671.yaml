      <p>The best graphic design forum or prepress forums that I have used and frequented is at Software-Robotics.Com, they make prepress Xtensions and Plug-Ins and have a really industrial strength support forum.  Their products are all heavily supported, that’s how I found the prepress forum there, I use their automatic PDF workflow called PDF-X-Robot.</p>
      <p>You don’t have to be a customer, even the software support folks help non-customers there for unrelated prepress issues.  There’s about 1200 users on that prepress forum from around the world, designers, publishers, prepress and printers.  I’ve learned allot on there and find it more direct and less cluttered than most communities &amp; prepress forums mentioned above.  </p>
      <p><a title="graphic design school forums prepressforums.com computer to plate forums" href="http://software-robotics.com/graphic-design-prepress/" target="_top">Graphi Design &amp; PrePress Forums</a></p>
      <p>I’m a prepress manager in agraphic design company, we provide graphic design services and i teach a few prepress classes in a graphic design school from time to time.</p>
