    <p>Has anyone been involved much with a prepress/printing forum?<br>
    There are so many out there, but its hard to come across a group of people as friendly and helpful as typophile members.  So im curious about where you all might turn if you have a prepress topic to discuss?</p>
    <p>Cheers. JonnySchneider</p>
