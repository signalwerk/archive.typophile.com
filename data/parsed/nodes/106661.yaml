    date_raw: 19 Oct 2013 — 6:49am
    votes: null
    html: <p>I find there is a problem with the lower case |u| because it's a reversed |n|. You have to adjust the width of the |u| It should be slightly narrower than the |n|. You will probably has to change the way that the serif is actually drew. Good start overall, but some round letters have a roundness problem, see the |S, s, o,| This problem is on all round letters. Keep going.</p>
