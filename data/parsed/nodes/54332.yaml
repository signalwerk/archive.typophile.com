    <p>Hi folks.  First time poster, long time lurker on Typophile.  </p>
    <p>I'm looking to get some feedback and/or ideas about a poster I'm designing for an event called "Four to the Floor."  I was fooling around with more normal poster designs when I noticed the curious reflectivity of a lowercase "ft" onto a lowercase "tf".  I've tried to play that out, though I don't totally like how the white text fits in.  Any suggestions would be appreciated!  </p>
    <p>Thanks.  </p>
    <p><a href="http://i39.tinypic.com/24wymh2.png" title="http://i39.tinypic.com/24wymh2.png">http://i39.tinypic.com/24wymh2.png</a></p>
