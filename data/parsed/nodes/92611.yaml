    html: <p>Backslanted original means mirrored form for the engraver, which is regular slant and of course favors righthanded craftsmen. The more common slant is of course a pain for the same guy… But these people were exceptionally skilled, so… (Note that intaglio printing requires a mirror image.)</p>
