    html: <p>Although the illustration shows a right hand, backslanting could also be a natural consequence of ledt-handedness. Even if this isn't the case, indicating emphasis by slanting doesn't really dictate that the direction of the slant can only go one way. Nicolette Larson notes that backslanted foundry type first appeared in the 1820s, most likely as a novelty.</p>
