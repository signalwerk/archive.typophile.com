    <p>Hi,<br>
    I came accross backslanted text in a few plates from Jan van den Velde's Spieghel der Schrijfkonste and came to wonder what it stood for.<br>
    In the examples I found the text seems to be introducing something else but I can be wrong.</p>
    <p>Any help, references or other examples would be much appreciated!</p>
    <p><img src="http://28.media.tumblr.com/tumblr_laajonXPZE1qc9u1ro1_500.jpg"><br>
    <img src="http://zigzaganimal.be/wp-content/uploads/2011/01/specimen_grave_van_den_velde_1605.jpeg"></p>
