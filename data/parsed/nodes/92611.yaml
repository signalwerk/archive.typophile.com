    html: |-
      <p>Thank you for these indications and leads. In a very short allusion to van den Velde in Dutch Type, Middendorp writes that his handwriting had been adapted for print by engravers. Both steps are impressive.<br>
      Showing off must have been an important motivation but I'd be surprized if this very unnatural way of differenciating text didn't have another one. Still from Middendorp's short allusion: 'Gerrit Noordzij has written that this type of calligraphy is the purest expression of the mannerist attitude, which "creates its own little cosmos amidst the chaos". (Letterletter 14, 1996)'<br>
      My first thought was irony, which I read about some time ago but can't remember where, though it's maybe a little early for this. Would you know where to look for early/-iest examples of ironic use of backslanted lettering?</p>
      <p>Nick,<br>
      thank you for the reference. If she writes more on the subject, do you know where should I look for this text by Nicolette Larson?</p>
