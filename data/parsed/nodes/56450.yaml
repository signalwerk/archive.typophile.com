    html: |-
      <p>That last one sure is interesting. It looks like a fruit (with the ear like a leaf) or a sleeping baby curled up. What about disconnecting the bowl from the tail completely? I love it.</p>
      <p>If I were to suggest one main thing it would be to make it more quirky. It looks a bit like a standard sans with some customised bits added on. Take N for example. It has a very different style to B or E. Or Z and K. Now you've got the underlying shapes there, I'd go really mad with the curves, see which ways they can be pushed then start bringing the glyphs back in towards each other so they harmonise. Like Craig said, add more floop!</p>
      <p>Did you try B with the top curve continuing into the counterspace rather than the bottom one? And what about an arched M rather than pointy? T looks dark. E and F have dark middle strokes. In fact generally the horizontal strokes 'should' be a few units thinner than the vertical ones. j descends too far. Crossbars on f and t could be a touch lower.<br>
      The caps look quite narrow.</p>
      <p>Just my thoughts, see what you think, play with the floop and see what happens :)</p>
