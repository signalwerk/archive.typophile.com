      <p>I think you could dial back the lift of v/w/y. The idea is a nice one but it just goes a bit too high IMO.<br>
      My eye wants the bottom of l (lowercase L) to taper in the other direction. i too.<br>
      Some lingering "straightforward functional sans" remains in many of the caps - basically every curveless capital letter (AEFHILMNTXYZ) needs more "floop"!<br>
      The "harmonization" already mentioned would include reconciling the different terminals (e.g. bottom ends of j and t.<br>
      I like the capital U and V particularly.</p>
