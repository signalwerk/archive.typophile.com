    <p>hi all,</p>
    <p>i saw the logo for FX’s new television show “Dirt.” here it is:</p>
    <p></p><div class="imageWrap"><img src="/files/dirt_3777.jpg"></div><p></p>
    <p>of course, i’m curious about the “i.” here’s a show synopsis:</p>
    <p>“Courteney Cox stars as Lucy Spiller, the hard-driving Editor-in-Chief of tabloid “Dirt” and “Now” magazines. Lucy has a maniacal dedication to finding the truth, for reasons even she has yet to fully fathom. With the help of Don Konkey, a schizophrenic paparazzo blessed with a genius for getting the money shot, Lucy exposes the hidden truth behind celebrity lives - and also determines their fate.” (from fxnetworks.com)</p>
    <p>any thoughts on why the “i” is upside down?</p>
    <p>jarrod</p>
