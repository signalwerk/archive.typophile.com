      <p>Wild guesses:</p>
      <p>To make it something more memorable than plain text.</p>
      <p>To create an ’exclamation point’ recalling the sensationalism of tabloid press.</p>
      <p>Interestingly, the ’i’ is shifted down, putting the dot below the baseline, perhaps a metaphor for something buried or underground, reinforcing the dirt. I was pondering this already, thanks to heavy advertisement featuring ’Digging in the Dirt’ by Peter Gabriel.</p>
