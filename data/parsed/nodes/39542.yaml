    html: |-
      <p>I don't know if you will even get this since its down on the newest board but, sometimes its not that bad, but for me...99% condensed is bad. We only have condensed Bodoni, Helvetica condensed and Runic or something condensed.... Work computers doesn't have that many good typefaces since they mostly download them for free. I'm thinking of putting some of mine on cd’s and uploading or just buying some. It kinda sucks buying for a wealthy company out of pocket but then again I've got my designer side to me.<br>
      See last night I was engraving three glass plaques, they were curved into a crescent which is something that is usually sandblasted. If it goes too far right or left then the laser will not engrave since It thinks its flat and all the same thickness as the center most point. In order to have all the type to a point to where it stays in the engraving zone it has to be pretty small. I made it that way. I personally like lots of white space but they don't. They want a maximum of a half inch border and centered. They said it was too small, that I didn't have to make it ALL smaller, I said that if the logo and the 'presented to' and the year was the same size then the name and the body copy would be insignificant. They said just squeeze it, I did. they said "not that much" I said it would have to if it is engraved. It was condensed about 50%. ugh</p>
      <p>Chase Langdon</p>
