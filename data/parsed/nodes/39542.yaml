    html: |-
      <p>I feel your pain, Chasography. I don't know where it starts or how it happens, but irreverence towards typography is a common problem here, too. I really cannot believe it when I open a file and find type condensed as much as 85%...sometimes even more. I've made similar statements to yours in front of the group, and they nod in agreement, then go on offending. It's as if they are insisting that I don't know what I'm talking about just because I talk like I know what I'm talking about.</p>
      <p>I have learned to do things correctly without asking permission. I no longer mention that I've found condensed type in a file, I just correct it, reduce the point size to fit and save over. I'm a vigilante, for cryin' out loud! I'm pretty sure my supervisors appreciate my efforts even though they might be totally unaware that it is happening.</p>
      <p>Unfortunately, I cannot get my hands on every file.</p>
      <p>Agreed regarding centering, and I'm going to add exaggerated drop shadows to your rant.</p>
      <p>I've gotten the impression that most of the people using this site are professionals...art directors and junk...pretty sure they all completely understand, only they have the good fortune of being in charge!</p>
