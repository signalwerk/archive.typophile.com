  html: <p>I was just told to squeeze in my body copy in order to fit it rather than size it proportional to its original intent. I makes me feel so dirty and sinful even thought I don't believe in God. Well I believe God is made up of ligatures, yeah that’s it. I told them that squeezing type is wrong, If you designed a typeface would you want to see it squeezed to fit on some huge billboard? I think not. One wouldn't skew a painting, One shouldn't skew type. If its too small to size it correctly then you should work larger. If fact work as large as you can. Working large is fun, really it is. The 'center' tool is the Devil.</p>
