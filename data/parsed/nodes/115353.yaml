      <p>Modern Font Editors moves to a browser based solutions, where <a class="freelinking external" href="http://www.fontark.net" rel="nofollow">FontArk</a> is the pioneer and leading vecrtor type design tool.<br>
      You can export the font as OTF file and move to other font editors for advance features.<br>
      Fontark saves a LOT of time spent on the technical side of font design by working on multiple glyphs simultaneously, and constructing the basic characters shape with the Skeleton feature.<br>
      Fontark's UI is the simplest (No complex and hidden menus and commands), yet it's system is most sophisticate. considering the ability to simply modify groups of characters, including the entire character set at once (when suitable) Fontark cuts off up to 90% of the repetitive, quite pointless, intersect-copy-paste-fit-merge operations, and represent a completely new and enjoyable type design experience.</p>
      <p>Still in beta and under development Fontark has some limitations, most of which can be fulfilled with other font editors, the rest will be removed quite soon as it's being developed pretty fast.</p>
      <p>Using Fontark is completely free at the moment (and won't make you broke when a payment system will be suggested), and demands no download/installation what so ever (provided you're equipped with a Chrome/Safari browser), you can even test it without signing up... just click the start button, no questions asked.</p>
      <p>Support and guidance are given gladly and on the spot as well.</p>
      <p>Recommended warmly.</p>
