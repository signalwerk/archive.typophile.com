    html: |-
      <p>Bob is right. For a simple export of a letter, or group of letters in an eps/ai file etc, open the file in illustrator, select a letter or group of letters, copy, and paste into a new AI file. Usually this selection does not fill the page. Transform it by resizing so that it fills a good proportion of the page. Copy the result to the clipboard. Paste the result into a glyph in Fontlab. Resize -- should not be a major change if it filled a page in AI.<br>
      And edit. Often path direction is opposite to Fontlab -- if you are working with ps outlines. Close open contours. Edit and you have your result. Hope this is a clear explanation.<br>
      Don</p>
