    html: |-
      <p>Thanks hrant. </p>
      <p>We're well aware to the limitations of skeletons when it comes to type design. In fact you can create and design fonts with Fontark regardless to the skeleton even now. You can go straight to the Outline layer and draw anything you like in any way you like.</p>
      <p>Fontark's Skeleton feature gives two important and fundamental advantages...1. speed of constructing the basis of the characters (by the time you'll scan, trase and refine your hand drawn character you can create from scratches several characters including unique outline details (depending on the complexity) of those drawn by hand by you, and probably enjoy it more). 2. characters connectivity, once you've built up your characters skeleton (or make use of an existing template) and connect it to the SX system, the whole font comes alive and you can control it in so many ways (weights, proportions, caps and soon contrast and much more) it's just worth any effort.</p>
      <p>The Skeleton is the basis for quite a lot, but you're not limited to and by it, it won't suit all designers, but used wisely (and developed properly on Fontark's side) it can take type design to a completely new level.</p>
