      <div class="comment-spam-body"><blockquote><p>Fontlab is a tool I would very much like to explore and have seen a couple of short tutorials on it's use.</p></blockquote>
      <p>If you haven't already bought FontLab Studio, please take a look at Glyphs before you do. It's much easier to learn and use, plus the developer is extremely responsive to fixing bugs and is quite helpful in other ways too. There are other reasons to look at other apps too. 1) Glyphs is cheaper, and 2) FontLab is working on a replacement app for FontLab Studio. It's anyone's guess when they'll have it ready for prime time despite their ongoing promises that it will be "soon".</p>
      <p>One caveat, though. If you do decide to go with Glyphs, don't buy it from the Apple app store. Buy it direct from glyphsapp.com. You'll get updates and bug fixes much faster that way. You can get a Demo Version here: <a href="http://www.glyphsapp.com/get-glyphs" title="http://www.glyphsapp.com/get-glyphs">http://www.glyphsapp.com/get-glyphs</a></p>
      </div>
