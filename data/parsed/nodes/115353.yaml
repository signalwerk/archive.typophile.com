    <p>Hi all. I'm new to this forum and thought I'd introduce myself as well as post a question. I've been involved in lettering for about 40years now through the sign industry and as of late been exploring font design. Although I have been drawing by hand for all this time I have begun to really enjoy the creative avenues opened up with tools like illustrator.</p>
    <p>My question is...I've recently learned/heard that illustrator cs6 and font lab no longer "co-operate". Fontlab is a tool I would very much like to explore and have seen a couple of short tutorials on it's use. Is this in fact true and would love about the experience of others in this aspect. Further to this subject is that I own 2 licensed versions of the adobe suites, cs6 for mac and cs4 for pc and am trying to decide about which tool to continue using.</p>
    <p>Thanx in advance</p>
