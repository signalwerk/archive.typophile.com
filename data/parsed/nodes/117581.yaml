    html: |-
      <p>In addition to the feedback already given, I wouldn't make such prominent use of script faces. With every text you add in script, the other texts become less prominent and less impressive. You might want to use a script for the name and use a roman typeface for the lines you have set in a script typeface. You need to focus more on the hierarchy of the typography.</p>
      <p>I also have to ask why you would want to censor our feedback. Why should we go easy on you? So you don't have much experience yet, I don't think you should expect us to be vile in our comments either way. If I ask for feedback I want it uncensored. It might hurt, but I will learn a lot more from it. By "going easy" on you, you might not get the most out of feedback.</p>
