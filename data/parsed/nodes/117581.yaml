      <p>Since you posted this a few weeks ago you're probably not still looking for feedback, but:</p>
      <p>What about this wine makes it different than other wines? Who's going to drink it? How are you going to appeal to that person? Since it's an Australian wine, maybe you can look into using Australian typefaces?</p>
