    <p>Hello everybody!</p>
    <p>I have just started my graphic design course and the assignments require us to get feedback from other people. My current assignment is to design a wine label and get feedback.</p>
    <p>If anyone can help and give me some constructive criticism on my designs, it will be greatly appreciated! I'm still getting used to photoshop, illustrator etc etc. So please take it easy on me and please keep in mind that these are just quick drafts to give you an understanding of how I want my designs to look. </p>
    <p>THANK YOU! (:</p>
