    html: |-
      <p>I like the lettering in "Ben's Blend". If you did that using bezier curves I would say its pretty good for an Illustrator beginner.  If not learn bezier curves by trying to reproduce this lettering curve by curve. The yellow outline with the red inside is too busy - Make the outline stroke thinner. Better still make the outline thicker with a lighter color, but do not add an outline stroke.The thin red type on black is illegible - use a thicker font and/or much lighter red.<br>
      And the grapes are distorted - why not use illustrator's brush mode to make a simple illustration for the grapes instead this nondescript photo?<br>
      Good luck.</p>
