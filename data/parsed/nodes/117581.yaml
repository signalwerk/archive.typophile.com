      <p>Welcome to Typophile. </p>
      <p>As others have mentioned, the grapes don't look right, it looks like the proportions have been altered by reduction of the height. </p>
      <p>And in the small type, the combination of burgundy type on a black background can be difficult to read because of the low contrast, especially for older customers, or for anyone in dim lighting. I'd suggest a lighter type color (maybe that light yellow you're using) for the small type, and switching to a bolder script.</p>
