    <p>Hi there, hope this is the right forum for this thread. Reading "A Short History of the Written Word" by Chappel and Bringhurst I stumbled upon this sample of a typeface "cut by Jacques-Louis Vafflard for Francoise-Ambroise Didot" in 1781, as reported in the book. As you may see, the style is very different from the usual romantic Didot type - more calligraphic and with a humanistic/old style feel, in some way. Since this is the first time that I see a Didot typeface with such a flavour, I would be interested in knowing more. Has there been any contemporary revival of this particular Vafflard cut? By the way, googling for "Jacques-Louis Vafflard" reported no results, while a Pierre-Louis Vafflard is quoted as Ambroise Firmin Didot's master. Thanks for any help.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vafflard02_5754.jpg"></div><p></p>
