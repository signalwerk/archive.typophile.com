      <p>Thanks Mike! Hrant, I've had a look at Tuleu, and I see it as descended from the key early Didot that Walter Tracy was so interested in, which is either Vafflard's third manner or Vibert's first manner (don't remember which), and which Tracy thought was the first modern type. I mean the roman of course. But even the italic might have seeds in Vafflard's first italic -- if we only had a complete setting of it. Astounding that Vafflard's first manner type appears to have been used for a year and a half max - - then abandoned. After that, ugliness reigns for a century. Nor is there a hint that it was sold to a provincial printer/founder or anything like that. It is almost as if there was an historical imperative to destroy it. The Tuleu g obviously comes from Baskerville, who seems to have been, for the French, the Jerry Lewis of the 19th century. </p>
      <p>The stagnancy of 19th century is strange. Just as English printing was mired in low quality modern (i.e. 99% of the 19th c English books you will see in any sale are printed in hideously thin modern), the French seem to have been mired in the over-technical forms of the very late 18th-early 19th century Didots. They're fussy and ultimately not easily readable, but at the very least they are heavier than the contemporaneous English types. You wonder how printers and the public could possibly have preferred them to the pleasant Jannon types that were masquerading as Garamond during this period. </p>
      <p>I find the Tuleu italic a little messy both stylistically and aesthetically -- and conceptually. You want a plain, emphatic italic? Then you wouldn't stick that silly k in the middle of it. And the f form is as unnatural as it is in the early American italics that are also trying to become slanted romans.</p>
      <p>Re Morison, Jeff Level had the intriguing idea that an ideal italic should be fully calligraphic but upright. I don't accept this idea, and I don't imagine you would, but it is interesting nonetheless, and it would be nice to see more designers trying it out. </p>
      <p>Tuleu really is a missing link. It would be interesting to trace the development from 1800 to 1900. We don't seem to know enough about the terribly slow typographical progress of that century, compared to the 18th and the 20th. I imagine it's because printing historians don't find it stylistically interesting. But just as we are beginning to find Victorian architecture considerably less repulsive than we used to, might we not be on the verge of coming to an accommodation with common Victorian type? </p>
      <p>Speaking of italic, I like, for display, the type I showed here. I have tried to adapt it to text sizes, but I don't think it's a good idea for submersive reading.</p>
