      <p>Although both the Didots and Bodoni are best known for their eponymous Modern style typefaces, earlier in their careers there were types from both foundries that are more Transitional in character, influenced by both Baskerville and Fournier. I think you're definitely seeing a Fournier influence here (and perhaps some Luce). </p>
      <p>If Bill Troop is still wandering through these parts occasionally, then that "Vafflard" in the thread title should surely grab his attention. If I recall correctly, he spent quite a bit of time on a Vafflard-based design years ago. He was posting in another thread not that long ago. Dunno if he's still lurking about, but he might be a good source of information.</p>
      <p>-- Kent.</p>
