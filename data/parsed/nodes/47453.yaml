      <p>Bill, I hope somebody can convince you to finally release this thing.</p>
      <p>One thing about the GIF images you've posted: it seems like you've used a funny palette, I'm guessing the old MacOS 8-bit palette. This is causing a lot of half-bitting (look at the "teeth" on vertical edges) which is distracting, and detracting from the work. In fact the bodies of some letters aren't even solid black. You only need a 16-color palette (even with that red border) but it has to have enough grays in it. Use Adaptive when you map down.</p>
      <p>hhp</p>
