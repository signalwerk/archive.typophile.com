      <p>Many, many thanks for kind remarks, Hrant - - </p>
      <p>re the gifs, what I did was pdf from Quark 7 to Acro 8, then screen shot via Vista snipping tool. Acro 8 has default rendering settings that make no sense to me: 'smooth text for monitor' rather than LCD and custom resolution of 110 pixels/inch rather than recommended system setting of 140. And snipping tool no doubt has various unknowns. I didn't do the screen shot direct from Quark so I would avoid all the clutter. However, comparing the two onscreen, the Acrobat is grey, not black, like the Quark is. Doubtless if I had any idea what I was doing it could all be better. I can see that the screen shots should be much better, but getting them there at all seemed to me miraculous enough. </p>
      <p>I can identify three problems finishing the type.</p>
      <p>1. I like to work collaboratively, and I truly believe type should be a collaborative event. But Matthew Carter disagrees, and told me so from the very start of this project: 'When are you going to fly solo?' I still haven't answered that question and it continues to haunt me. </p>
      <p>2. I don't have a deadline. It's amazing what you can finish when you have a deadline. When you don't have a deadline, you spend a week on things that are really fascinating like, 'What size, really, should the command and period be?' -- things that, mercifully, under deadline, you can't get too involved with.</p>
      <p>3. The legal situation isn't clear. Ask Adobe and they say they own the design. Carol said, 'just release it, nobody will care, so long as you don't use our trademarked name.' I expect she was right.</p>
