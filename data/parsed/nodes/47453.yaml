    html: <p>I'll send you a copy if you really want - - it would be interesting to get some feedback. In my later versions I used the fitting of Vafflard as near as I could get - - it is mathematically exact. Of course, a replica is only really useful at the design size of 18 pt - - so say 14-24. Italics are a problem. Vafflard had a gorgeous italic but neither Unger nor I have - - when last I checked - - succeeded in finding more than a few letters of it. Unger, by the way, believes that the font is almost identical to Adobe Garamond, and he illustrates this quite convincingly in the article that Wolfgang cites. I worked on this design with Robert Slimbach for two years without Robert ever remarking on it. It just shows that there are lots, and lots, and lots of different ways of looking at type.</p>
