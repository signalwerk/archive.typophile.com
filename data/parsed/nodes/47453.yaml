      <p>OK, here are some images, and I can already see a lot of things I don't like. For example, my numbers are terribly lacking in spirit. I reproduced the thickness of the type much as Updike had. That is not too far away from Didot's own printing in this type, but nothing can compare to the exceptional blackness, and the razor thinness of the finest details. In spite of having put so much work into it, I can honestly say I am glad I did not release it. It needs rethinking. After this, I'll post the Adobe version. The image Nicola posted is the darkest I have seen yet, and I like the meatiness, but Vafflard's is not a heavy type, so keep that in mind while comparing.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/prospectus detail_3955.GIF"></div><p></p>
      <p>and the full page</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/prospectus full page_4361.GIF"></div><p></p>
