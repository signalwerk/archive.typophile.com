    html: |-
      <p>How wonderful to see this great print, the 'Prospectus' here!</p>
      <p>Looking at this - - it's in Updike - - was one of the most thrilling moments of my type life. I saw it when I was just starting out in type and reading Updike - - around 1992 or 1993 - - and at once started digitizing it. I wanted something that would reproduce not just the image I beheld in the Prospectus, but the feeling of it. It remains for me the most beautiful type I have ever beheld, but it is not until you see how Didot actually printed with it that you understand just how beautiful it can be. </p>
      <p>I was working with Jeff Level at the time. We sent my earliest drafts to David Berlow, who thought that it looked too much like Fairfield, which had just been revived by Linotype. That was a very acute remark, because Fairfield was undoubtedly influenced by this type. Jeff also sent it to Robert Norton, because he thought it could be an interesting challenge to the Microsoft people with the kind of hinting they were then doing. Norton didn't want it for Microsoft, for obvious reasons, but was tremendously supportive of the approach I was taking, which was to permit the letterforms to have obvious faults. The question then becomes - - which faults are aesthetically useful in the digital type, and which are not? We all spent countless hours on these questions. Matthew Carter was also a great help with the type at this time, and later. He was to use a similar approach in his revival of Monticello. I had been attacked so vigorously for sticking to this principle that I was very glad to have his support.</p>
      <p>'Adagio Didot 48', released through Precision Type around 1995 or 6, was derived from this type although it can be difficult to see the relationship. It is not easily available and has very little to do with the aesthetic feeling of the 'Prospectus' type. </p>
      <p>My version of the 'Prospectus' page caught Robert Slimbach's attention - - was it in 1996? He asked what could be done with a multiple master in size and weight, and a couple of weeks later, we had a new typeface closely based on this type - - which Veyrin identifies as 'Vafflard's First [of three] Manner'. After a while, we signed a contract for typeface known as 'Valerie' (after Balzac's heroine) -- the first Adobe Original text family from an outside designer. </p>
      <p>Carol Twombly warned me at this early stage. 'Robert has art-directed several projects for Adobe over the years. Not a single one has ever been released. This is his last chance. Are you sure you want to take this risk?'</p>
      <p>I paid no heed. I loved Robert! It was fantastic working with him! </p>
      <p>Things started going wrong a few months later . . . do I have to tell the rest of the story again?</p>
