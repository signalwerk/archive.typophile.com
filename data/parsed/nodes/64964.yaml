    <p>(T.O., AKA, Toronto)</p>
    <p>Or, (Mmmm) tea party, if it comes right down to it. :o)</p>
    <p>who's in?</p>
    <p>When? Dec. 17 is out for me (my son's birthday) but otherwise, I'm open to suggestions</p>
    <p>Where? Some place central &amp; on a transit route, not too pricy or trendy (read not overly crowded and loud) . The closer to Union Station, the better for me, and, as it happens, there is no shortage of pubs (and what have you) in that area.</p>
