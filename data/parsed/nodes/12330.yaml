    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Amondó Szegi</strong></p>
    <p>Amondó Szegi is a Hungarian freelance designer, painter and performer. He has previously worked as a newspaper editor, bookshop assistant, electrician and boilerman. Amondó is the co-founder of <a href="/wiki/Fontana%20Type%20Foundry" class="freelinking" rel="nofollow">Fontana Type Foundry</a> and has designed typefaces for six years. He currently lives with his family in Szeged.</p>
    <p>Typefaces by Amondó Szegi: <a href="http://www.p22.com/ihof/mantra.html" rel="nofollow">Mantra</a>, <a href="http://www.p22.com/ihof/telegdi.html" rel="nofollow">Telegdi</a></p>
