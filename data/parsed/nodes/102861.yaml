    <p>Hi everyone,</p>
    <p>I'm having some issues with a truetype web font conversion on FontSquirrel. The resulting truetype hints look as good as they can on Windows, but at 13 pt and 18pt only, the overshoots on rounded glyphs render strangely. I haven't found a solution for this yet, but I'm hoping someone might be able to help me get to the bottom of this. </p>
    <p>Is it possible that the truetype hinting instructions are affecting rendering on OSX? I've read that hints are mostly ignored by this operating system in favor of something more built in, so I'm a little confused.</p>
    <p>Are there certain tests I should run, or is there more information that would be helpful in understanding the issue?</p>
