      <p>I don't think the problem is with overshoots, though. It looks to me that every glyph exhibits this issue, note that the top horizontal strokes of the Z, E, F, T, all look "thick". I think it's just that in the case of the rounds, you're only seeing this effect in a more limited area, while in characters with vertical strokes it's just not that noticeable. </p>
      <p>But no, TrueType instructions aren't causing this effect.</p>
