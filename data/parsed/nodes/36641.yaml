  html: |-
    <p>Hi<br>
    I’m looking for a display serif, it needs to be strong, sharp and modern (something like Mercury from HFJ). It would be used for headlines in a newspaper. Farnham is also pretty close, but these feel a bit overused around here. I have always liked the fonts of Gerard Unger, but clients don’t seem to understand him around here.<br>
    It would need at least Regular and Bold, but a Light would be great.</p>
