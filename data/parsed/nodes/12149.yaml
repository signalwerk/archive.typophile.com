    <p>i remember about a year or so ago i was dreaming that typophile would have its own wiki, and now it does! hoorah! i’ve had some fun updating some entries thus far, but i’ve noticed that the wiki can be hard to get around in if the authors of articles forget to leave out a navigation line at the head of the article. I propose that we copy the navigation line that can be found at the begining of the page for designers so that the top of the page reads something like this for each article:<br>
    <strong><a href="/wiki/Indices" class="wiki">Indices</a> : <a href="/wiki/Designers" class="wiki">Designers</a> : Gerald Giampa</strong><br>
    this makes it easier to navigate so that you don’t have to back your browser out of an article to get back to the indicies and you don’t have to go up top to the typowiki link and then click on the indices link, anyway... it just makes things easier. Help keep our wiki clean!</p>
