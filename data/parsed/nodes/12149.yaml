    html: <p>well it’s been what, 6 months? and it seems more and more people are getting comfortable with using the <a href="/wiki/typowiki" class="wiki">typowiki</a>, and i love it. but it can always be improved upon. I just wanted to bump this thread so that it gets renewed attention. Just to simply restate my original sentiment, let’s try to make the wiki as navigable as possible by leaving bread crumbs (see above). At the very least, i think linking back to the Indices page at the top of each article is a good idea, with complete strings of breadcrumbs being preferable. As moderator with responsiblity for the wiki, i try to make sure that these are there, but i can’t go back and check all of the almost 1000 articles now. So, if you come across a page that you see needs to be enhanced, either change things yourself (c’mon, get yer feet dirty!) or bring issues to my attention. thanks for your attention and all your contributions to the wiki. i think it’s beginning to become a good resource for research and answering questions, but we’re not even close to scratching the surface of its potential. let’s keep up the good work and i’m sure it’ll get there in time.</p>
