      <p><strong>Diacritics – should we use it or not...</strong><br>
      I found a problem. In the Designers list, there was name of Vojtěch Preissig written with correct diacritics. But Vojtěch Preissig is mentioned in other wiki entries as <code>[[Vojtech Preissig]]</code> and this is therefore not connected with <code>[[Vojtěch Preissig]]</code> entry.</p>
      <p>I suggest NOT TO USE DIACRITICS in names of wiki entries - this solution will also help people without particular keyboard layouts to entry the wiki links. But we should USE DIACRITICS in the description fields to publish correct spelling.</p>
      <p>Another soultion is to map Vojtěch Preissig to <code>[[Vojtech Preissig]]</code> using <code>[[Vojtěch Preissig|Vojtech Preissig]]</code>, but this somehow doesn’t work for me.</p>
