      <p>this is a new idea:<br>
      since tracking changes to the wiki can be kind of a chore with comparing changes by looking at each version of an articl separately, i propose wiki authors add notes to describe changes made to articles. This would happen by authors manualy adding comments to the end of the article that would look something like this:</p>
