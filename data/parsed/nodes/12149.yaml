      <p>There is a revision history; we’ve just not figured out how to make it available to all users. This is on our list of to-do’s so you can rollback any given wiki entry to see what revisions have happened to it, and who made them.</p>
      <p>As for the breadcrumb (Wiki &gt; Designers &gt; Gerald Giampa) it’s my understanding that this is not standard navigation for a wiki, which tends to be a little more free-form. Adding a series of Indices is our little twist to allow the wiki to take the place of the (former) Open Directory Project. No use keeping both around with all that the Wiki is capable of.</p>
