    html: |-
      <p>You can use Helvetica for a text font, sure. We set the journal <cite>boundary 2</cite> which uses Helvetica. Aside from watching the leading, you need to watch the character fit &amp; word spacing. Space values are that way, they all relate. The usual problem with a sans for text is somebody gets the word spacing too tight. The second most common problem is selecting a font where the character spacing is too tight.</p>
      <p>Having said that, unless your school was comprised of a bunch of modernists or font addicts who don’t mind being reminded for 200 pages that it’s the 50th anniversary of Helvetica, why select it.</p>
      <p>As for the best layout program, it is the one you already know how to use. Forgive me, but you don’t sound too familiar with book work. Why add to the chore by using a program you’re not comfortable with?</p>
