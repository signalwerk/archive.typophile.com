    html: |-
      <p>I think I’ve personally noticed nearly everything in the united states is Garamond. Although it’s kind of a default, it is a safe bet for a classic book. As for Helvetica, Most of us have read (I think) “A History of Graphic Design” by Philip B. Meggs, which is done in Helvetica, is around 500 pages, and perfectly legible. Aside from the cover, I’d call it a successful design. Just watch the leading. More importantly than Garamond, Bodoni, or Helvetica though, you’d want it to match any theme or mood in the book.</p>
      <p>As for InDesign or Quark, I know a lot of seasoned vets who prefer Quark for books (largely because of the custom kerning abilities), but my comfort zone is InDesign, and i’ve not had a problem laying out a book with it.</p>
