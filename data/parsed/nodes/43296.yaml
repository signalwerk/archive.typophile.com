    <p>Hi fellows! :D How are you?<br>
    I was invited to design a book for my old school!<br>
    The book’s theme is the school’s 50th aniversary (1957-2007)!<br>
    I was thinking about Helvetica for obvious reasons...<br>
    But the book has almost 200 pages... Helvetica is a sans-serif!<br>
    Any sugestions? I really appreciate any response! </p>
    <p>Thanks in advanced!<br>
    J</p>
