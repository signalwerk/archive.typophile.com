      <p><cite>I was thinking about Helvetica for obvious reasons...</cite></p>
      <p>It is obvious if your school was composed only of type addicts. It might be appropriate if a very popular magazine or newspaper of the time — popular in Portugal — used Helvetica.</p>
      <p>If what you are after is an allusion to the times, it is hard for someone in the States to know what might be appropriate in Portugal. But certainly we can say that font selection should be made on the basis of what your general audience will appreciate &amp; understand.</p>
      <p>Where you as designer fit in is to avoid the pitfalls an amateur would be apt to make. For example, if it were the States, a Bodoni might be selected (<cite>Life</cite> magazine, which many people read). But Bodoni’s are tricky, they fared poorly when rendered in photocomp, and many fared worse in PostScript. So, if the book is comprised mostly of photographs, and will be printed on a coated stock, you can probably find a Bodoni that will work. But if it is mainly text &amp; will be printed on an uncoated stock, I’d skip the problems of Bodoni &amp; get your allusion to the times by using something like Franklin Gothic Condensed for display. Again, this for the States; a far as I know, it would be inappropriate for Portugal.</p>
    html_clean: |-
