    html: |-
      <p>The picture is an ornamental keystone. It marks the apax at the crown of a vault or arch (I don't dare to say which). A keystone locks the other pieces of a vault or arch into position.</p>
      <p>This is one coat of arms (one family). The shield is made out of two 'important' families (the red and white) because of a marriage between the two (red and white) creating one family thus one shield (one coat of arms).</p>
      <p>If the vector art is going to be in black and white there are rules how to represent the colors (the color silver is a doted pattern etc.). You can look it up in a book or ask your local genealogy society (you can ask your local city/village museum if there are any or at city hall).</p>
      <p>The helm and mantling are also significant, but I can't recall why.</p>
      <p>Best of luck.</p>
