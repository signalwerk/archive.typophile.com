    <p>For any NYC area typophiles still looking for a way to study typeface design this fall: SVA will be offering a version of my sold out workshop from this past summer, <a class="freelinking external" href="http://www.schoolofvisualarts.edu/ceCourseFinder/app?sDay=0&amp;sTime=0&amp;sLoc=&amp;sDept=&amp;sCourse=GDC-4458-A&amp;sInstructor=&amp;sKeyword=" rel="nofollow">Turning Letters Into Type</a>, on Monday nights from Sept. 20 through Dec. 13 (and again in the spring, so the two could also be taken in sequence as beginner and advanced versions). </p>
    <p>There are still some spaces available and registration is <a class="freelinking external" href="http://www.schoolofvisualarts.edu/ceCourseFinder/app?sDay=0&amp;sTime=0&amp;sLoc=&amp;sDept=&amp;sCourse=GDC-4458-A&amp;sInstructor=&amp;sKeyword=" rel="nofollow">here</a>. The summer workshop was super fun, be great to have you along this fall!</p>
