    html: <p>This is a bit off-topic, but Joe said <i>"Seriously, handwriting fonts are way in"</i> and I just noticed yesterday that Phil's Fonts has started selling a CD of 300 Handwriting fonts for $289 from The Type Marketing Co. Turns out that these are not new handwritten fonts at all (I wrote to Phil's pointing this out, because I want to believe they didn't know this), but the same ones that WSI took and re-named from the 1995 ClickArt Handwritten Fonts CD. These fonts are scattered all over the web, all using names with the form <i>Somebodys</i> Hand. These fonts have had a way of showing up over and over again, because they have that sort of anonymous look, but I have the original ClickArt CD, which I got in return for giving permission to include my printing as one of the 300 fonts (called 'Bowfin' in the original, but renamed 'Marions Hand' by WSI). <br> <br>ClickArt (actually T/Maker Co.) no longer exists as a separate entity, having been taken over by Broderbund, which in turn became part of The Learning Company, but I have never heard that Weatherly Systems Inc (WSI) had the rights to those fonts. The fact that they stopped selling them directly years ago reinforces that idea, but these fonts with their everyday anonymity have taken on a life of their own through third parties , like Expert Software and the Type Marketing Company who have repackaged and sold the same collection. <br> <br>I plan to keep blowing the whistle about this until it stops or gets cleared up.  <br> <br>Ok, I'll get off my soapbox now. Thanks for bearing with me.</p>
