    html: "<p>Just buy it. Just did a great job with it and you Just can't ignore  <br>that Just's lefthand is better than his right.  <br> <br>Translated: <br>Yoost buy it. Yoost did a great job with it and you Yoost can't ignore  <br>that Yoost's lefthand is better than his right. <br> <br>Seriously, handwriting fonts are way in (scripts are too, but less  <br>so) and Just Lefthand is an excellent choice. It's got enough flare  <br>to give it some polish, but is convincingly spontaneous because <br>it is not too decorative or ornate.</p>"
