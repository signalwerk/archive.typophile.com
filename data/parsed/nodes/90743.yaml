      <p><cite>correct amount of space (kerning) between uppercase letters (as in a full word set in uppercase)</cite><br>
      That would be spacing. Kerning is applied between pairs of letters.</p>
      <p>Nitpicking aside, I second what Luma Vine said.</p>
