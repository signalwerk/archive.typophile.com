    <p>Hi all</p>
    <p>I’m looking for a really nice handwriting font - any suggestions? </p>
    <p>I saw a copy of Arena in the UK with Beyonce on the cover that was good, and going back a few months Wired used a nice one on the cover.</p>
    <p>It’s to be used alongside Helvetica Neue for names of interviewees in a sports magazine.</p>
    <p>Any help very much appreciated as always.</p>
