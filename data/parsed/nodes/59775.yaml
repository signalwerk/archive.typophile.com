    html: |-
      <p>Well Dave, you seem to have a good start with Cantarell. I like the character of this font. It seems very clean and easy to read.</p>
      <p>However (and you knew it was coming), many of the curves just seem wrong. It's not exactly your fault, either. It has to do with the lack of precision when working with FontForge's Spiro capabilities. I would recommend converting the curves back into cubic splines and then manually fine-tuning them. This will help with the color and evenness of the glyphs in the font, and it will make it easier to read. For example, the 'a' and 'e' caught my eye first because the curves seemed especially lumpy. At certain points each glyph appears either overly wide or overly skinny.</p>
      <p>When looking at the characters beyond Basic Latin, I noticed a few irregularities. I think that the small letter eth (ð) could benefit from some reworking. A good article to look at would be <a class="freelinking external" href="http://briem.ismennt.is/2/2.11/2.1.4.eth.htm" rel="nofollow">this one</a>. A few diacritics could use some touch-ups as well, such as <code>breve</code>, <code>hungarumlaut</code>, <code>macron</code>, and <code>ogonek</code>.</p>
      <p>On a less-significant/purely-technical note: it would be more correct to rename your 'italic' faces as 'oblique' faces because the style of the font has not been changed to accommodate the standards of italic typefaces. If you want to make an italic version, more is needed than just slanting the regular face.</p>
      <p>I am not the most experienced typophile, and I'm sure someone else could chime in and provide more comments but I hope this helps.</p>
