    html: |-
      <p>I second Wesley's advice about the different curve types. Each curve type lends itself to a certain curve "flow", and when converting twice (from Spiro → cubic → quadratic splines) without any corrections inbetween, you are sure to end up with uneven curves and too many points.</p>
      <p>About the wide and skinny parts: I think you've got the stroke contrast not quite right in many of the glyphs. Try writing your letters with a broad-nib pen to see where the thick and thin parts end up. This image shows the original letters on the left and my corrected versions on the right, with slightly increased stroke contrast to make it clearer:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cantarell_6081.png"></div><p></p>
      <p>The red ellipse represents the broad nib. Of course you have to apply optical corrections to the stroke widths where needed later, but you get the idea ...</p>
      <p>How important is hinting on the Google Android platform, which you target? On Windows, TT fonts without hinting look pretty bad. Especially for screen fonts, there should be good hinting. But that's something to care about later, first try to improve on the glyph designs.</p>
