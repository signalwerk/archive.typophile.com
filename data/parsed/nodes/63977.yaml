      <p>A couple of the fonts in House’s <a class="freelinking-external" href="http://www.houseind.com/fonts/signpainterfontkit/viewfonts">Sign Painter Font kit</a> are pretty close, but still not an exact match. Is there a reason that it needs to be EXACTLY this font? Some suggestions that have been made would be so close that without side-by-side comparison 95 people out of 100 would not know they were different. </p>
      <p>- Mike Yanega</p>
