    <p>Hi,</p>
    <p>I am a student looking for a typeface for the identity of a lighting design company. I am trying to avoid VAG Rounded which seems to fit but I want something a bit less commercially used. I tried id'ing these fonts on the whatthefont site but the suggestions were off. Any help would be appreciated for any of these links: These seem to share some similarities with VAG rounded but are off in a nice way.</p>
    <p><a href="http://www.robvanhoesel.nl/index.php?/identities/kop/" title="http://www.robvanhoesel.nl/index.php?/identities/kop/">http://www.robvanhoesel.nl/index.php?/identities/kop/</a></p>
    <p><a href="http://www.robvanhoesel.nl/index.php?/identities/graphic-design-festival-breda/" title="http://www.robvanhoesel.nl/index.php?/identities/graphic-design-festival-breda/">http://www.robvanhoesel.nl/index.php?/identities/graphic-design-festival...</a></p>
    <p>Thanks for your help!<br>
    Amrita</p>
