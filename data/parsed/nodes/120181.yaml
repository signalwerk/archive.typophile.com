  html: |-
    <p>Hello,</p>
    <p>I am currently having a problem with finding the right heading font for an Italian Food blog. </p>
    <p>This blog is written by an Italian where she shares the authentic Italian recipes and cooking practices. The objective is to communicate the authenticity and tradition behind this italian recipes, but also look fresh and modern, as we focus on working with a step-by-step approach that helps making the recipes easier to make rather than the typical "only-text-and-one-marvellous-photo-of-the-end-product" food blog. So, in it's essence it has to communicate that is traditional and easy to learn.</p>
    <p>We are currently using two typefaces for the website, Minion pro and Avenir Lt. These fonts have been choosen based on these two communication objectives, creating a contrast of modern and traditional, and we are unsureif sticking with these two or if using a third font specifically for the heading would be beneficial. </p>
    <p>I am leaving attached some concepts I am currently working on, as well as the link to the page of the current recipe.</p>
    <p>Recipe page: <a href="http://italianaddiction.com/recipe/italian-tripe/">http://italianaddiction.com/recipe/italian-tripe/</a></p>
    <p>Your feedback and/or comment would really be helpful and we are looking forward in hearing your opinions.</p>
    <p>Thank you for your attention,<br>
    Pierluigi</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Concept%205.jpg" width="1100" height="2282" alt="">
