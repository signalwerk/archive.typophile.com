      <p>I’m a very good friend of the guy behind Bountee. Steve Hunt is his name and a good bloke he is too. You might have heard of them as they do lots of competitions and things with the <a class="freelinking-external" href="http://drawn.ca/">Drawn!</a> blog.</p>
      <p>The Bountee shirts are print-on-demand and as an early pre-launch guinnea pig, I can vouch for the quality. If the system is still the same as it was to begin with you get to set the price of the shirts, so if you just need a run for yourself you can set the price at cost.</p>
      <p><a class="freelinking-external" href="http://www.bountee.com/">bountee.com</a></p>
      <p>*Edit. Looks like Bountee is down for maintenance. Well worth checking back though ...</p>
