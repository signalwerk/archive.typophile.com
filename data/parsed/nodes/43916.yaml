  html: |-
    <p>I’ve never made a T-shirt before. I’ve obviously seen various sites where you can easily make your own shirt, but I haven’t bought shirts from all of them, so I don’t know how they come out. I saw <a class="freelinking-external" href="http://www.typophile.com/node/32867">this post</a>, but I couldn’t find a “Which place is best” type of post. Does anyone have recommendations about where to get T-shirts made?</p>
    <p>I’ll probably need a few dozen of them, but they wouldn’t all be exactly the same.</p>
    <p>Most important to me is that the material be of high quality.</p>
    <p>I’ll find a T-shirt forum and post there if I don’t get answers to this quesion here.</p>
    <p>I was originally thinking I’d get them from a website, but it could also be a place that doesn’t sell things over the internet if it’s near New York City.</p>
