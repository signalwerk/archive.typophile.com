  html: |-
    <p>Hello. First post here on Typophile!<br>
    I'm looking for a versatile script font that is feels Italian (maybe a little handwritten, but not brushed). While that doesn't seem too bad add the additional asks of: bold, skewing towards modern and non-rustic. Eventually, this will be seen in print and broadcast.</p>
    <p>Thanks!</p>
