      <p>Well, it may all depend on which Baskerville you look at:<br>
      <a href="http://www.myfonts.com/search/baskerville/fonts/" title="http://www.myfonts.com/search/baskerville/fonts/">http://www.myfonts.com/search/baskerville/fonts/</a><br>
