      <p>Yeah, I've looked at every single Baskerville I could find, but they all feel heavier and more square-ish than this. But now I am more or less convinced that this is indeed <em>a</em> Baskerville,  only a cut which is not available today in digital form. Thanks for your help.</p>
      <p>If anyone knows a Baskerville with this round feeling, I'd really appreciate a tip.</p>
