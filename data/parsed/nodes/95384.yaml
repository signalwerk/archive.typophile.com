    <p>I really enjoy reading this serif, and I believe it's a Caslon, but unfortunately it does not match any digitized set I have come across. I would be very thankful for any suggestions for what might resemble this.</p>
    <p>Sorry for the lousy image; I don't have a proper camera at hand.</p>
