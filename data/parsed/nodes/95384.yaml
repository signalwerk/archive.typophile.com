    html: <p>Thanks, Jan. This is one of the things that has me confused. That glyph belongs in Baskerville, but the letters don't have that characteristic wide feeling that comes with Baskerville. I find the round and balanced shape much more reminiscent of Caslon... But then I don't really know this stuff, so I'm thankful for any kind of input.</p>
