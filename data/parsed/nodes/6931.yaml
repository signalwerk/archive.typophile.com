    html: "<p>Nice - like a 21st century Interstate. <br> <br>I think you need to ramp up the stroke contrast towards the dark end - it looks sort of bloated like this, especially in the tight joins, like the bottom of the \"b\". <br> <br>The only lc glyphs that are bothering me are the \"k\" (too narrow, too grot), and the \"r\" (too shy). I do have a \"macro\" suggestion though: add some shears, like at the stem-tops of the \"i\" and \"j\", and the bottoms of the \"v\" and \"w\". <br> <br>In the UC, the \"J\" is imbalanced, and I might try shearing off the point at the bottom of the V of the \"M\" - it feels too sharp. Also, I'd make the head of the \"P\" larger, relieve the blotting in the tail of the \"Q\" (not sure how) and slighly lighten the bottom-right curve of the \"S\". <br> <br>Your hybrid nums are quite nice to me. The \"2\" seems to need a more curvy spine, I'm not sure about the \"4\", and the top of the \"7\" seems a bit thick.</p>"
    html_clean: "<p>Nice - like a 21st century Interstate. <br> <br>I think you need to ramp up the stroke contrast towards the dark end - it looks sort of bloated like this, especially in the tight joins, like the bottom of the \"b\". <br> <br>The only lc glyphs that are bothering me are the \"k\" (too narrow, too grot), and the \"r\" (too shy). I do have a \"macro\" suggestion though: add some shears, like at the stem-tops of the \"i\" and \"j\", and the bottoms of the \"v\" and \"w\". <br> <br>In the UC, the \"J\" is imbalanced, and I might try shearing off the point at the bottom of the V of the \"M\" - it feels too sharp. Also, I'd make the head of the \"P\" larger, relieve the blotting in the tail of the \"Q\" (not sure how) and slighly lighten the bottom-right curve of the \"S\". <br> <br>Your hybrid nums are quite nice to me. The \"2\" seems to need a more curvy spine, I'm not sure about the \"4\", and the top of the \"7\" seems a bit thick.</p>"
