      <p>Hello again, <br>so here's what i've been working on. i changed some of the stroke contrasts, like in the "b", "d", "n" etc., not only in the bold version but in all styles. also i'm back to "normal" numerals for now (but i'm also still working on the hybrids).  <br>as some people seem to have problems with the "y", i made an alternate version for text sizes. up to now it's only in the regular style, since i'm still not sure if i like it.  <br>Hrant, i didn't have time to try out your suggestion to add shears yet, but hopefully i will get to that later. <br>thanks again for all comments, i really appreciate it. <br> <br>hanno <br> <br> <br> </p>
