    html: <p>Hi Hanno, <br> <br>nice work so far. <br> <br>But the y doesn't really do it for me either. I find it a bit irritating, especially at text sizes. Its vertical descender has an optical tendency to the right (which may be partially due to the angled terminal). Maybe design an alternate version for text sizes (and leave the vertical descender to Displays sizes)? <br> <br>S and s show a slight tendency to tip over to the right. (The S/s is almost always the character that's the most difficult to balance perfectly.) <br> <br>The s and o look a tiny bit too small (next to the m, for instance). <br> <br>The O (and Q and o) <i>might</i> need some optical compensation (rotate the bowl a tad counterclockwise?). Expecially next to the e, the o shows a slight tendency to the right. <br> <br>The same goes for the D, which looks a bit top-heavy. <br> <br>The t stem looks a bit heavy. <br> <br>I'm not sure whether I like the J. Maybe include an alternate version? <br> <br>The rounded square dots are nice, indeed. <br> <br>Regards <br>jpg</p>
