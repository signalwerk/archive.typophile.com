      <p>hello everybody,  <br>here's a new pdf showing some more glyphs and the three different weights i'm working on. unfortunately i haven't been able to work on most of the suggestions you made, but i will get to that soon.  <br>to answer aaron's question: of course i thought about how to create something unique. the idea behind tramway was to create a font based more on rounded squares than on circles, that has a technical feel to it (that is, I think, what jon called "sturdy" and "boxy"), but that is working in small text sizes as well. the boxyness of the basic letterform, the lc 'o', is also how came up with the rounded punctuation. <br>In order to keep the font legible i try not to break too many conventions. This is why it doesn't look very unusual when you first look at it.  <br>I think it's the details that make this font unique: it's "boxyness", the emphasis on the vertical und some unusual letterforms. <br> <br>until then...  <br>hanno <br> <br></p>
