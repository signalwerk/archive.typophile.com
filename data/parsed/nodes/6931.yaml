    html: |-
      <p>New here eh? Welcome to typophile. <br> <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>It just seemed right to me to draw the y like this, since the whole font has such a strong vertical emphasis.<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p></p><p> <br> <br>It occurs to me that too much agreement between characters in their stress makes long stretches of body copy tiring to read. If all characters try to be as vertical as possible, you might end up with too consistent a pattern to be scanned quickly. Instead, angling the right stroke of the y makes it easier to distinguish for instance from the j which is predominantly vertical. Another nice thing about angling the stroke of the y is that many english words end in the letter y and so the end of the word slants and has a more recognizable shape. <br> <br>punctuation - I'm liking the rounded square in your punctuation. <br>B - Need to optically lighten where the two strokes of the bowls come together. <br>G - Looks like it's falling over left. Extend the upper arm. <br>J - Stroke coming off the top there is a bit confusing. It's having trouble spacing with the I and I have a feeling it won't space well with the other capitals either. If you can come up with a good reason to keep it, maybe it should be shortened and lightened some. <br>N - Angled stroke might be too light. <br>M - I like the shape of this glyph on its own but it belongs to some other type. The miter on the two sloped strokes is the only pointed join in the capitals. <br>Q - Maybe it's caused by the angled terminus of the stroke but the tail looks closer to the left side of the bowl. Needs some optical compensation. <br>numerals - I like the four numerals you have in the sample paragraph, especially the 1 and 7. Wouldn't mind seeing the rest. <br> <br>I don't have perfect typeface recall like some of the folks here, so I can't give you names, but this looks very similar to many other designs I've seen around. Is there some guiding principle that you started from to arrive at these shapes? Did you plan how you might arrive at something different than what's out there already? I ask because I spend a good amount of time trying to imagine designs that haven't already been built and I'm curious if others do the same and how.</p>
