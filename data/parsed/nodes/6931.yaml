    html: <p>Hanno, <br> <br>I like this okay. It's very sturdy. I like especially the boxyness of the 'S' and the shaping of the P and R. The 'a' is nice too. <br> <br>A couple of things that I noticed. To my eye the 'C' doesn't appear to have enough weight. I think the 'J' needs to be wider or something. Maybe it shouldn't go beyond the baseline. The 'K' looks droopy compared to letters B E F H P and R. Upper arm terminates to low on the vertical I think. I like the 'Q' but I think the slight angle on the tail's terminus doesn't fly. I'd leave it horizontal. I'd think it's okay on the 'p' if it was angled the other way and on the 'q' it looks alright. <br> <br>I like the rounded square dots a lot. Oh yeah. <br> <br>The lc 'y' just doesn't do it for me. What about a hooked stem like the 'g'? Maybe terminate the 'v' portion of the glyph above the baseline? <br> <br>This might be nice in a heavy black weight too. <br> <br>Keep it up. <br> <br>Jon</p>
