    html: <p>My <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a> has been used for text in both magazines and books. You could eg use it at 10 point in narrower magazine columns and at 11 point in wider book columns. I've also seen it recently used well at 10 point in a small paperback, like the old Penguin pocket books (column measure 19 picas). The bold weight is really a semi-bold, if that's what you're looking for. You would want something else in display; it's been paired with Caslon 540 and Big Caslon, as well as Knockout and Archer.</p>
