    html: |-
      <p>The Janson/Kis typeface is one of the most beautiful old-style faces, at least Tschichold thought this way. Interview Magazine is using it for example, and it is a commonly used book typeface. The regularly used version is Janson Text, however recently a complete rework of the typeface was released, called Kis Antiqua Now. </p>
      <p>Kis Antiqua Now has 4 weights and two display cuts. The reinterpretation turned out great in my opinion, the capitals are now in a more contemporary size relation compared to the lower case characters. On the page it looks great, not as monotonous as some recent typefaces.<br>
      <a href="http://www.fonts4ever.com/portrait_typeface.php?language=en&amp;id=5" title="http://www.fonts4ever.com/portrait_typeface.php?language=en&amp;id=5">http://www.fonts4ever.com/portrait_typeface.php?language=en&amp;id=5</a></p>
