  html: "<p>I'm redesigning a journal with two sections: the first rather magazine-y (three columns, plenty of images, dense), the second somewhat bookish (two columns, more leading, calm and sober). Weights/styles: regular and italic, and perhaps also a medium. Grades would sure come in handy with the difference in density between the two sections, but I'd like your suggestions even if it doesn't have them. I'm looking for a humanist serif with a contemporary feel to it -- more chunky (I guess) than a typical book face, but not all slabby and stuff. Suggestions? I have some options listed, but I want to keep an open mind.</p>"
  html_clean: "<p>I'm redesigning a journal with two sections: the first rather magazine-y (three columns, plenty of images, dense), the second somewhat bookish (two columns, more leading, calm and sober). Weights/styles: regular and italic, and perhaps also a medium. Grades would sure come in handy with the difference in density between the two sections, but I'd like your suggestions even if it doesn't have them. I'm looking for a humanist serif with a contemporary feel to it -- more chunky (I guess) than a typical book face, but not all slabby and stuff. Suggestions? I have some options listed, but I want to keep an open mind.</p>"
