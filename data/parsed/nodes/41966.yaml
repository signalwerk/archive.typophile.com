      <p>You can already do this in Reader. Go to <strong>Edit &gt; Preferences &gt; Accessibility</strong>. Then, under <strong>Document Colors Options</strong>, click the <strong>Replace Document Colors</strong> checkbox. Next, click the <strong>Custom Color</strong> radio button. Then click the <strong>Page Background:</strong> button and select a color from the standard palette, or click <strong>Other Color...</strong> and create your own color. The selected color shows up on the screen but doesn't print. You can also change the text color if you want to, using the <strong>Document Text:</strong> button. These choices are "sticky" and apply both to the file you have open and to any files you open subsequently.</p>
      <p>This won't do any good on the web, though, because -- nominally -- the webmaster can't control how users have their Reader set up. (Actually, I can think of at least one way to do it automatically, but imposing that on users doesn't seem ethical to me.)</p>
