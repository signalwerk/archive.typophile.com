    <p>Here is a suggestion for the improvement of Acrobat Reader.</p>
    <p>Make a setting so that you can choose a cream paper background rather than just standard screen white. So that when a document is put on the web it looks more like print on paper. Maybe also make that background colour non-printing so that it doesn't look awful when output to a b&amp;w laser printer.</p>
    <p>I know one could do something like this now, by setting the page colour in the document preparation program like InD or Quark or LaTeX. But putting it into Acrobat Reader with a simple switch to turn it on or off would make it a lot simpler.</p>
    <p>What do you guys think?</p>
