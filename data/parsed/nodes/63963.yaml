      <p>Yes, the hinting is lost -- so, particularly on screen, the type looks horribly. Fortunately, it's nigh on invisible on the output of a high-resolution machine. But try to convince your client of that.</p>
      <p>The practice of outlining type was generally advised because of missing fonts, back in "the day" when PDFs were not around. Nowadays, proper software should embed all used fonts (or a subset thereof) in a PDF. All Adobe programs will do that. And sending a PDF to your printer is the recommended way, over sending original files.</p>
      <p>There are a few rare occasions in which you'd really want to outline everything, and these guys tend to prefer EPS as well, rather than PDF. (Screen print? Cutters? Maybe engravers as well?) They may use old software to drive their rare machines for their niche markets, rather than up-to-date PDF rasterizers.</p>
