    <p>How much distortion occurs when the type is outlined in Illustrator? I have always been under the impression that when sending files to printer/engraver, it was always best to provide the native files, with images sized in Photoshop, placed in a document layout program, font files and any cure adjustment files necessary.</p>
    <p>The question has been floating around our office over some business cards. They want to send out the files with the type outlined in Illustrator. I was taught this is a no no.</p>
    <p>Any suggestions?</p>
