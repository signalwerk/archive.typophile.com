      <p>You don't explicitly state exactly <em>what</em> the clock is to show, nor <em>how</em> it is to show it.</p>
      <p>Here is something I made for my Windows computer desktop. It shows me the date and day of the week as well as the time, and it uses an "odometer" animation for the minutes.</p>
      <p>I do not intend this as an entry into your contest, of course, as it is not only too small (not nearly enough pixels), but also much too amateurish. I just want to show you what is possible. This is my solution to a problem of "minutes are too coarse; seconds are too anal-retentive". </p><div class="imageWrap"><img src="http://typophile.com/files/clock-demo_3684.png"></div><p></p>
