    <p>Greetings All,</p>
    <p>I'm a software developer that's created a clock app that lets users upload digital clock designs and share them with others.  In the app, the designs are pulled from the web and the clock representation changes periodically to give you something interesting to look at.  As typography professionals and enthusiasts, I thought some of you may appreciate seeing numerals rendered in different styles, and maybe even have an idea for a design of your own.  Currently the app is available for iOS devices (iPhone/iPod/iPad), and I am giving it away free for a while.</p>
    <p>If you are interested in checking it out, you can learn more here:<br>
    <a href="/wiki/https%3A/%252Fwww.clockton.com" class="freelinking" rel="nofollow">https://www.clockton.com</a></p>
    <p>If anyone has any feedback on the overall look and feel of the app, I would be happy to hear your thoughts!</p>
    <p>Sincerely,<br>
    Evan</p>
    <p>p.s.  I am also running a clock design competition on 99designs right now.  If you think you have an award-winning design, you might want to consider submitting it.<br>
    <a class="freelinking external" href="http://99designs.com/other-art-illustration/contests/create-digital-clock-clockton-199820" rel="nofollow">http://99designs.com/other-art-illustration/contests/create-digital-clock-clockton-199820</a></p>
