      <p>You need to reduce the height of U a little bit more to optically balance it with the curved tops of all the other letters. At the moment it looks taller even though it is actually a little shorter.</p>
      <p>I don't notice any difference between your two different overall heights, except when you overlay them. I like FANO. There is a nice, chunky, slightly-industrial look to them.</p>
      <p>I think you need to do something with B to make the top loop a little smaller than the bottom. It looks a bit top-heavy at the moment.</p>
