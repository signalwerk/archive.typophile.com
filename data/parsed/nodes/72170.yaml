    <p>I have modified a font to create the logotype of a clothing accessories company that I'm starting. Some of the changes I've made was changing the "B" to look more like the "O" at the end so that the letter forms create almost a mirror symmetry (i.e. the F mimics the A, the U mimics the N, and the B mimics the O). Originally the B was not curved off as much as it is here. This, in comparison to the other letters made the B seem smaller and weaker. To compensate, I shortened the stem height of the U at the top and the F, A, and N at the bottoms. Based of a height of 72 points in illustrator, I reduced them by one point in one version and by 2 points in another. I'm really pulling hairs here, but thought I'd open it up to the community here to see if anyone had an opinion.</p>
    <p>P.S. I've also made other changes to the original by making them all exactly the same width (not by stretching the whole letter, but by moving the stem node by node to keep the integrity of the line weights). I also modified the middle "bridge" (don't know the actual typographic term for them) element of the F and the A so they were at the same height and had the same thickness. I changed the humps of all the letters (like the top of the F, the A, and the N) so they all had the same curved shape, etc.</p>
    <p>So here are my questions to the community:</p>
    <p>1. Do you have an opinion on which stem height looks more right to you?</p>
    <p>2. Are there any overall glaring issues anyone has given I've tweaked the original font quite a bit. I'm being as sensitive as I can using what I know about typography, but haven't officially taken classes in it, so I'm open to criticism.</p>
    <p>3. If anyone would like to see the progression of how I got to this point, I'd be happy to post that as well.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bufano_stemcomparison_4919.jpg"></div><p></p>
