    html: |-
      <p>Thanks, Ratbaggy. </p>
      <p>The U and the N are very close to the original font and actually work quite well outside the logotype. You guys are all definitely pros as you have taken the things that I've changed about the original letters and spotted them instantly as "mistakes".</p>
      <p>My question, is how critical does a logo need to be typographically correct? What I had determined as king were the following:</p>
      <p>1. That all 6 letters are exactly the same width. I know this is breaking the rules since part of what gives letters in a family balance is varying their shapes and sizes slightly. Instead, I was aiming for having perfect symmetry. 6 letters. All exactly the same width.</p>
      <p>2. I wanted a B that looked interesting on its own. The original B does work better as a font letter. But as a logo identity (I'm imagining it as a belt buckle for example), this stylized curvy one, I like better. Unfortunately, now that I twisted the B away from its original more blocky shape, it's throwing all the pro's off on the "U". Poor "U". It wasn't his fault, lol.</p>
      <p>3. Again to achieve perfect symmetry (if I wanted to stack them in a pattern on a fabric, for example), I can't space them closer or further apart. Each letter is not only exactly the same width, but spaced exactly the same amount of space from each other.</p>
      <p>I love this website. You guys all called me out instantly on what was wrong, even though I had done it intentionally.</p>
      <p>@ riccard0<br>
      I did try cutting the stems matching the curve of the "O" as reference as an option a while back. Although it looked interesting, the "F", "A", and "N" started looking like fangs so I had to pull it back to the original blocky shapes.</p>
      <p>Thanks for all the feedback. This is great.</p>
