    html: "<p>U and n need to be narrower than the O and B because they have more white inside. I'd even make U slightly narrower than n. I also think the U in the post before mine is moving in the right direction. Perhaps those innermost nodes shouldn't be that high. Your F needs less space on it's right side. Type isn't about math, it's about optics. Here's an idea for you: if you double up that A, and make two legs (the first one's right, and the second one's left) overlap, you only need to remove a slice of the top and the crossbar to get a nice mirroring.</p>"
