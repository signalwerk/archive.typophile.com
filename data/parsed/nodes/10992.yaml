  - id: 69517
    user: 1431
    date: 2003-04-21T08:47:00
    date_raw: 21 Apr 2003 — 8:47am
    votes: null
    html: <p>In response to John, I also noticed it has some art deco and techno-like feel to it. It wasnt my intent at all though. I began this assignment thinking I would create a typeface that juxtaposed the disco era with hieroglyphics. After playing around with many different forms I noticed that they all had a "space-like" feel to them.  <br> <br>Disco + Hierpgyphics = Spaceballs?    <br> <br>sweet! <br> <br>But now I need to name it, and I cant decide on a name at all.  Any ideas? <br> <br></p>
    html_clean: <p>In response to John, I also noticed it has some art deco and techno-like feel to it. It wasnt my intent at all though. I began this assignment thinking I would create a typeface that juxtaposed the disco era with hieroglyphics. After playing around with many different forms I noticed that they all had a "space-like" feel to them.  <br> <br>Disco + Hierpgyphics = Spaceballs?    <br> <br>sweet! <br> <br>But now I need to name it, and I cant decide on a name at all.  Any ideas? <br> <br></p>
