      <p>I would be embarassed to show my school papers, hurridly  <br>written and fraught with inaccuracies. Then again, I keep  <br>posting my first revision fonts that are equally unpolished. <br> <br>I added some figures and some refinement to the spacing.  <br>The numerals are still a little lumpy. I'm starting to think  <br>that this font isn't nearly as vanilla as I had hoped. I can't  <br>help but add some quirks. <br> <br>Tiffany--I didn't graduate when I should have. I recently  <br>reapplied and am finishing a few generals. <br> <br></p>
