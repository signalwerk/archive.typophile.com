    html: <p>Christian, this looks really nice. <br> <br>The <b>X</b> and <b>x</b>(esp.) really lean to the left. <br> <br><b>c</b>, <b>e</b> - look good in text but look like they might be leaning too much to the right. <br> <br><b>K</b> - the upper arm appears too short and consequently looks like it is falling. <br> <br><b>O</b> - Looks a little too small and black. probably okay for the <b>Q</b> (though i agree with kris that the Q tail looks like it's flapping in the breeze. I like its shape but maybe closer to the form above and moved to the left? <br> <br>The stomach of the D is cool, but it's alarming me here. <br> <br>In your text setting <b>a</b> looks like it has too much space after. Especially <b>ar</b> and <b>an</b> but <b>at</b> is okay and <b>al</b>...but then you might not even be at this stage yet. <br> <br>Jon</p>
