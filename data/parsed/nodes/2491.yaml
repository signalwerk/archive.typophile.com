    html: "<p>Vanilla transitional, eh? I guess there's a limit to how much chocolate oldstyle I can consume...  :-) <br> <br>I think it's pretty cool. It seems to have some Times and some Rotis in it, but it's clearly original too. The only \"macro\" thing I'd change is pull in the descenders a hair. Some \"micro\" stuff: <br>- The \"J\" seems out of character. <br>- I like the \"K\"! Very self-assured. <br>- The \"t\" needs a stronger right side. <br> <br>And yeah, the spacing needs mucho trabajo. <br> <br>hhp <br></p>"
