    html: <p>Well sir, I don't know quite what you mean by 'vanilla' but <br>I'll give ye a bit of feedback anywho. <br> <br>f - something wrong with the crossbar, too light? <br>o- seems too heavy to me, sticks out a bit. <br>k- too heavy as well <br>j - I'd sharpen up the tail a bit, it seems too blunt. <br>p- the bowl is a tad askew, it looks a little odd. <br>Q- the tail looks like it's flapping in the breeze. <br> <br>Overall it is rather cohesive and pleasant on the eye.  <br>Having said this, I didn't print it out, I'm still waiting for the <br>bloody thing to arrive. </p>
