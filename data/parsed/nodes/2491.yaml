    html: |-
      <p>I smoothed out some lumpiness, and added some  <br>rudementary spacing (no kerning yet). The previous spacing  <br>was InDesign optical (they tend to do better on the sans).  <br>Thanks for the comments. I've incorporated a bunch into  <br>this version (I even changed the spelling of Joyce--oops).  <br>I never really liked the Q. It's too presumptuous for vanilla. <br>I switched it for something a little more appropriate. I've  <br>only got six or seven hours in this experiment so far, but <br>I think I will definitely use it for my next paper--I just need  <br>to add some figures, an italic, small caps and more  <br>punctuation...  <br> <br>Hrant--good call on the Times reference. I did look at it  <br>quite a bit. I wanted it to feel a little more up to date,  <br>though (hence, Rotis, I guess, though I wouldn't have  <br>thought of that). <br> <br></p>
