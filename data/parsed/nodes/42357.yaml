  html: |-
    <p>Houschka Rounded is released this week.</p>
    <p>It is very comprehensive with multi-lingual coverage, featuring a standard character set, contextual and stylistic alternates, lining and old-style numbers, both proportional and tabular, small caps, and 3 extra stylistic sets (as shown on the pdf). </p>
    <p> Houschka Rounded has six weights ranging from a very thin Thin to Extra Bold.</p>
    <p>The Thin style may be the thinnest rounded (terminals) font ever! Magnify the 5-spread pdf and have a look.</p>
    <p><a href="http://www.type.co.uk/pdfpreview/F007329.pdf" rel="nofollow">Houschka Rounded</a></p>
