    <p>Letterpress Printing Course at The Cooper Union Wednesday June 4-July 30 2008!</p>
    <p>“Letterpress Printing on the Vandercook Press” </p>
    <p>In this class conducted in the Cooper Union letterpress studio students will learn the basics of printing in letterpress. You will learn how to set type using wood and metal typefaces and how to print your work on the studio’s Vandercook presses. This will be a hands-on class that will suit those who love design and typography but need a reprieve from the computer screen. This course will be an in-depth experience in letterpress for those interested in taking things beyond basic hand-set type composition. We will explore ways that images, foil stamping, die cuts, scoring and perforation can be incorporated in your designs to achieve great effects. During class the students will have time to work on projects of their own using the studio facilities (primarily the Vandercook presses) and to troubleshoot problems encountered with the ass<!--
