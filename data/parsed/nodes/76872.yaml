  html: |-
    <p>Does anyone know what this font it? It was on a random poster I took a photo of and I can't figure out what it is. </p>
    <p>The ascenders are slanted at the top; the capital E's middle arm is shorter than the top and bottom; and the lowercase "e"'s terminal ends short.</p>
    <p>I would be grateful for any help!</p>
