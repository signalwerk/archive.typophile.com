  html: |-
    <p>Has anyone encountered an interesting hand-lettered or type-set "Q.E.D." before? It's used to mark the end of a mathematical proof. The contemporary digital version is, unfortunately, the "tombstone," a simple black square  (yawn). </p>
    <p>Thanks!</p>
    <p>Rob Kimmel</p>
