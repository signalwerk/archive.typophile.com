      <p>For $300 (US) it's a pretty standard price for a big family–and a bargain compared to some of the families in the $1000+ range. I'd buy the big set and recoup the cost by using it in projects for other clients down the line, not to mention other projects for this client. Treat the cost as an investment, not just $300 spent on one cheap identity job.</p>
      <p>If the big pack is just too expensive, however, it seems like light+medium would be a lot more useful than light+regular; light and regular are just too similar to build an effective hierarchy.</p>
