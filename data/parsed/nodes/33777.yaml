      <p>Do you need to use all uppercase on the "and more"... maybe it's my time spent on the net, but uppercase tends to SCREAM too much for my taste -- especially when it's only used on "half" a logo.</p>
      <p>Overall, I wonder if the face (this is Galliard, yes?) is a little too "middle-of-the-road"... it has some nice curves, but it's also kind of angular. The squared-off dot in the "i"s would stand out more in a more organic, curved face. Maybe even Galliard Italic? On the other hand, a more modern/geometric/tech face would likely convey the "industrial" quality of the company (if, indeed, it is more of a B-to-B rather than consumer enterprise). </p>
      <p>The overall letter spacing seems a bit open too, though I tend to subscribe to the "tight but not touching" school when it comes to logos and headlines.</p>
      <p>I kinda like the mark/dingbat, but it _is_ pretty generic. Maybe the ornate panel would work better _inside_ the box rather than outside, as you are selling ceilings, not exterior walls.</p>
      <p>I just keep thinking about how you could convey "above-ness" or "overhead-ness" in a design. Try to think of how others do it, like Travellers insurance (they've "got you covered" with an unbrella), or maybe look at roofing company logos. Don't steal, just get inspired. I keep (mentally) coming back to the ceiling of the Sistine chapel for some reason... the "ultimate" ceiling i suppose.</p>
    html_clean: |-
