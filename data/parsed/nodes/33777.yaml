      <p>Collin, here's my wandering thoughts on the subject...</p>
      <p>It's a crap name and one of those banal and cheesey business naming conventions of the 1980's like World of Chairs, Worktops 'r' Us, Ovens Etc, Supadoors.</p>
      <p>But it does have a quality you could play with. Think of it as two surnames and it sounds a bit like a business partnership from the 1800's possibly founded by Dr Samuel Ceilings and the Reverand Quentin More to promote, as they might have put it "the edification of interior heavens".</p>
      <p>Combine that with your father being "very old fashioned/traditional" and that he's probably been in the business for a good number of years now and you have a possible solution...</p>
      <p>...design it in the style of shop and truck signage from, say the 1880's to 1900, or any classic period.</p>
      <p>Make it a period study or revisionist exercise or parody or whatever by looking at font's and ornate embelishments / flourishes / devices from a particular era.</p>
      <p>Here's just one reference I found quickly... <a href="http://www.signmuseum.com/" title="http://www.signmuseum.com/">http://www.signmuseum.com/</a></p>
      <p>Maybe have the name in all capitals with a ceiling rose style graphic* between them for symmetry...</p>
      <p>CEILINGS * AND MORE</p>
      <p>You could go with deep bold colours with strong contrast or blended natural tones and textures. Maybe even incorporate a "SINCE 1978" style phrase.</p>
      <p>BTW Does Ceilings need to be plural? Flooring tends not to be pluralised. Too late to change it I guess?</p>
