    <p>Hello, I am currently trying to create a logo for a construction company, but the name is so vague that I cannot think of any mark that is suitable. I have done all the conceptual work - mind mapping, sketching, word association, image searching, etc - but still cannot think of anything suitable.</p>
    <p>I think it may be partially because I am creating the logo for my father's business (note: I am a design student currently completing my Des BA) and thus I am too close to it, so now I ask you all for help with coming up with a suitable idea. It has been quite a challenge for me (frustratingly so as usually these things are not so difficult for me) so I hope you all can provide some insight be it a word, an image, a concept, a typeface, whatever you can provide.</p>
    <p>I really appreciate any help anyone could provide.</p>
    <p>The company name is: Ceilings and More (note: the word "and" is spelled, not "&amp;", and he is very adamant about that).</p>
    <p>Thanks again everyone, I hope to be posting later with some critique of some kind of logo!</p>
    <p>___________________________</p>
    <p>APPENDED: attached is a digital sketch of one of my concepts. Any feedback would be greatly appreciated. Feel free to rip it and be as honest as possible too, I am not attached to it: it is just some of my work, it's not me!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ceilings_4963.jpg"></div><p></p>
