      <p>My first impression of the logo was that it'd be for an office supply company.</p>
      <p>It seems unfitting to use a serif font for a construction company. Construction is mainly about robustness, not delicateness. Plus, the delicate aspect is already sufficiently represented by the ornamental symbol on the left. Therefore, a sans serif font should be more suitable here -- a tall and narrow one, if you want the text to have some elegancy and less massiveness.</p>
      <p>Also, the two colors used are both a bit pale, which does not only enforces the "more delicate than robust" impression, but also could be problematic if the logo is used in single color situations. Have you thought about how a greyscale version is supposed to look like?</p>
