      <p>Stylize a sophisticated/clean length of crown molding - and set the word 'Ceilings' upon it. Allow the 'g' to descender below the top line of the crown molding.</p>
      <p>Underneath the length of crown molding set an ampersand and the word 'more'.</p>
      <p>The ampersand will associate with the 'g' descender', thus giving the composition a wholeness, a completivity (new word!), unity.</p>
      <p>__________<br>
      Hiro</p>
