    <p>About a year ago I made a comment in one of these nodes about how the world doesn’t really need any more type designers, that there are plenty of excellent typefaces to go around, and way to many crappy ones littering our culture.</p>
    <p>Today, my boss told me that I could shop for some type to use in some posters rather than go with the Marker Felt that we had handy in our type library. Dream come true. So I went shopping. It started here, with a search for the classic Mr. Dom Casual, which took me to <a class="freelinking-external" href="https://web.archive.org/web/20081122110041/http://typophile.com/node/19380">this node</a>.</p>
    <p>I honestly cannot believe how many incredible, beautiful typefaces I just looked at through the links provided there. I’m in awe. The people who create these things are obviously incredibly talented, well-studied, and rehearsed; and I imagine they come from all walks of life...the last thing I want to do is stifle the next up-and-comer. If that’s you, pay attention to these people and follow your dreams. </p>
    <p>Thank you all for giving people like me the tools we need to make the world a more beautiful place.</p>
