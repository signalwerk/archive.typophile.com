's more in the vein of a Mittelschrift. Still, I'm keeping it in my list. <br><img src="http://www.typophile.com/forums/messages/83/19651.gif" alt=""> <br> <br>Then we fall into the really similar "Dax" looking fonts.  <br>Flux (a slight bit too round) <br><img src="http://www.typophile.com/forums/messages/83/19652.gif" alt=""> <br>Praxis (stems) <br><img src="http://www.typophile.com/forums/messages/83/19653.gif" alt=""> <br>and Dax (variable stroke, overused) <br><img src="http://www.typophile.com/forums/messages/83/19654.gif" alt=""> <br> <br>I almost feel that Praxis could be modified very slightly to get what I want, although I may change my views after reviewing the fonts listed. <br>Very interesting thread. Thanks everyone. <br></p>
