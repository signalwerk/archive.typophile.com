    html: <p>There are a number of stemless 'tech'-look fonts shown in the <a href="http://bowfinprintworks.com/BauhausFaces.html" target="_blank">Bauhaus-style Font ID Guide</a>. Some that I thought might be worth considering are T-26's 'Flux' (Part 3 of the Guide); 'Leger' (also T-26) in Part 4, and Tabasco in Part 6. There are others but you know best what you are looking for. Even good old <a href="http://www.fonts.com/findfonts/detail.asp?pid=204425" target="_blank">Bernhard Gothic</a> has stemlessness going for it. It shows that sometimes even 'old' can look 'tech' if you wait long enough. ;-)</p>
