  html: <p>I'm looking for a font for a technology company <br>(logo and text). I love FF Dax but it seems to be coming into overused and the narrowing of the stroke at intersections makes large letters look more like a font for commercial shops.  <br>I really want to keep the stemless "m" and "n" as well as the general open shape of the "a". So far, I've only found two fonts that have the same feel as Dax. Marten and Modula. The first one isn't very readable (rounded endings) and the second one is polluted by extra stems everywhere. <br>Any suggestions for something like FF Dax? <br>Thanks. <br> <br>Here's a sample of Dax by the way. <br><img src="http://www.typophile.com/forums/messages/83/19563.gif" alt="FF Dax sample"></p>
