    html: <p>My point about the Bauhaus-style fonts is that even though many of the samples in the Guide are modern fonts, their simplified geometric forms owe very much to the styles of Herbert Bayer and his stylistic movement. Sans serif styles were already a measure of simplification over serif fonts, and the Bauhaus-style carries it further by reducing many of the forms to as simple a shape as possible. Bayer even wanted to reduce the alphabet to <a href="http://bowfinprintworks.com/BauhausFaces7.html" target="_blank">uncials</a> to simplify it to its limit, I guess. The arc-shaped 'n' in so many of these styles is one of the earmarks to me, but the stemless 'n' (as in Dax and Bernhard Gothic) is a stylistic compromise to retain a bit more of the familiar form. The (to me) grotesquely ugly square 'tech' look takes this simplification to the direction of avoiding curved lines, and I think begins to lose contact with anything human (hence the 'tech' label). You can have it, if it means draining all the life out of the letters. Cunieform letters also avoided curves, but for a reason related to the medium (clay) and the writing tool (stylus) that makes much more human sense than today's computer-drawn squares. Sure, LCD technology (and it's predecessors) depended on straight line segments to render alphanumeric characters, but that is now 20-30 years old. How does a style derived from that look become symbolic of 'high tech'? And while I'm ranting, how about the fact that 'Eurostile/Microgramma', which is apparently the epitome of the Tech-Look, is over 40 years old!</p>
