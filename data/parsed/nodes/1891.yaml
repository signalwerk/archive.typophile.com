    html: <p>Thanks Mike, I have had your bauhaus page booked marked for some time now. It's nice to see you pop up like that. You actually identified Marten for me a few months ago. <br> <br>I think that the context has changed enormously these past 10 years for so called tech fonts. They seem to have been appropriated by the youth scene in particular (rave, clubs, parties, dj events, sci-fi tv and movies, etc). <br>The more established ones like Eurostile and Handel are now widely seen in shops everywhere (even my laudraumat uses Eurostile for signage). <br> <br>Parallel to that, the real high tech field has changed dramatically during the same period. The desired image of dynamic, young, fun, and hip from the 90's (Yahoo, Amazon, eBay, Marimba, ...) has now been changed back to the more conservative image of serious (restrained), professional and efficient.  <br> <br>In that context, I think that its now very tricky to use a "tech" font for a tech company. Bauhaus lines (stemlessness for one) conveys efficiency and modernism to me. The tech side must still be present as a somewhat "square" look, although it must be much more subtle than before. Most important though, the conservative, professional but forward looking image must comes from a well balance (humanist?) body type font with clean lines (sans-serif). <br>These are the parameters I'm trying to play with. <br> <br>For reference, I've played with latest suggestions. Here we go... <br> <br>Infinity, Armada and Prosper are too squarish. They could easily be used for rave ads. <br>Infinity <br><img src="http://www.typophile.com/forums/messages/83/19647.gif" alt=""> <br>Armada <br><img src="http://www.typophile.com/forums/messages/83/19648.gif" alt=""> <br>Prosper <br><img src="http://www.typophile.com/forums/messages/83/19649.gif" alt=""> <br> <br>Bernhard Gothic shows its age (t and a). <br><img src="http://www.typophile.com/forums/messages/83/19650.gif" alt=""> <br> <br>Apex-sans is quite nice, but it's more in the vein of a Mittelschrift. Still, I'm keeping it in my list. <br><img src="http://www.typophile.com/forums/messages/83/19651.gif" alt=""> <br> <br>Then we fall into the really similar "Dax" looking fonts.  <br>Flux (a slight bit too round) <br><img src="http://www.typophile.com/forums/messages/83/19652.gif" alt=""> <br>Praxis (stems) <br><img src="http://www.typophile.com/forums/messages/83/19653.gif" alt=""> <br>and Dax (variable stroke, overused) <br><img src="http://www.typophile.com/forums/messages/83/19654.gif" alt=""> <br> <br>I almost feel that Praxis could be modified very slightly to get what I want, although I may change my views after reviewing the fonts listed. <br>Very interesting thread. Thanks everyone. <br></p>
