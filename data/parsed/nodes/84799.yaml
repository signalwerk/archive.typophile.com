    html: |-
      <p><cite>ould it be it finds outlines that overlap not directly but one knot is placed on top of an other knot?</cite></p>
      <p>It works by making two copies of a glyph. All components in each glyph are decomposed, then the remove overlaps function is applied to one copy. Then all anchor point locations in both copies are dumped to strings, the strings get hash()ed, and then the hashes are compared. If they don't match, the glyph is assumed to contain overlaps. The downside to this method is that glyphs with lots of anchor points will take a long time to check.</p>
