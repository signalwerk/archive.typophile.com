    date: 2011-09-02T12:27:00
    date_raw: 2 Sep 2011 — 12:27pm
    votes: null
    html: |-
      <p>Hi James,</p>
      <p>thanks for the idea about how to detect overlaps. I hope you don't mind, I rewrote your script to use pure FontLab, no RoboFab. That way it runs a lot faster. Additionally, I stop the comparison of points of a glyph as soon as a difference is found, that makes it faster too. And the last thing, you don't need to add the temporary glyphs to the font window. Drawing stuff on screen repeatedly makes things slow. I just make copies in memory using the copy constructors for <code>Font()</code> and <code>Glyph()</code>. The script now takes 1 second as compared to 258 seconds before on one of my fonts ;)</p>
      <pre>#FLM: Mark Overlaps JK

      # make a copy of the current font
      f = Font(fl.font)

      for glyphIndex in range(len(f.glyphs)):
      	g = f[glyphIndex]
      	if len(g.components) &gt; 1:
      		# only decompose composites made up of more than one component
      		g.Decompose()
      	if len(g) &gt; 0:
      		# glyph has outlines
      		g2 = Glyph(g)
      		g2.RemoveOverlap()
      		if len(g) != len(g2):
      			# different number of nodes
      			fl.font[glyphIndex].mark = 10
      		else:
      			# check nodes
      			for nodeIndex in range(len(g.nodes)):
      				n = g.nodes[nodeIndex]
      				n2 = g2.nodes[nodeIndex]
      				if len(n) != len(n2):
      					# nodes don't have the same number of points
      					fl.font[glyphIndex].mark = 20
      					break
      				else:
      					# check points
      					for pointIndex in range(len(n.points)):
      						if n[pointIndex].x != n2[pointIndex].x or n[pointIndex].y != n2[pointIndex].y:
      							fl.font[glyphIndex].mark = 30
      							break
      fl.UpdateFont()
      </pre>
