    html: |-
      <p>Georgia Pro has just been published.</p>
      <p>I would say <a href="http://new.myfonts.com/fonts/shinn/scotch-modern/" rel="nofollow">Scotch Modern/Micro</a>, but I am somewhat biased :-) Small caps and figure variants, ligatures, and the italic has Swash Caps for all cap setting. Plus arrows and manicules.</p>
      <p>Bulmer<br>
      Eames Century Modern</p>
