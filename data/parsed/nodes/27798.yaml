    html: |-
      <p>I just stumbled across this old thread.</p>
      <p>"URW Garamond No. 8" is a digitization of the old Compugraphic rip-off font "Garamond Antiqua", later also called "CG Garamond Antiqua" and much later sold as "CG Garamond" by Monotype and also supplied by HP with its Laserjet printers.</p>
      <p>For source see "THE type BOOK" by cg Compugraphic Corp., Wilmington 1988</p>
      <p>This huge law book</p>
      <p><a href="http://delegibus.com/2008,2.pdf" title="http://delegibus.com/2008,2.pdf">http://delegibus.com/2008,2.pdf</a></p>
      <p>is typeset using URW Garamond No. 8</p>
