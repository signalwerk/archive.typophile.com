    html: |-
      <p>You're not off to a bad start. Here are some of my thoughts though with what you've shown here:<br>
      -Steer away from outlined type. It feels too weak for the strength you want to communicate.<br>
      -Make sure all your elements are perfectly aligned. Use guides, grids, rules, etc. Be as precise as you can, because with today's software, it's easy to be.<br>
      -You've already done this, but don't worry about color until you come up with a solid mark.<br>
      -Stay away from 3-D effects like embossing and drop-shadow.<br>
      -Do research.<br>
      Google "steel" and flip through the photographs<br>
      Go to <a href="http://www.istockphoto.com" title="www.istockphoto.com">www.istockphoto.com</a> and do the same thing (stay away from the vector art there though, it may be too cartoony for what you're after)<br>
      Go to Wikipedia and read up</p>
      <p>Hope some of this helps. Good luck.</p>
      <p>penn</p>
