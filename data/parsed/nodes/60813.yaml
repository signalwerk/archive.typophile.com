      <p>I think if you take the rivets out of the middle option and paint the mark in one color, you will have an <em>excellent</em> mark. Rebar is going to be easy to see and it won't be as decorated and fancy compared to how it is now. Then pair it with a larger bolder type (perhaps set it in two lines) and that's it, you got a winner.</p>
      <p>PS. Oh, and if you feel like keeping rivets, consider moving them into the whitespace between I's vertical strokes.</p>
