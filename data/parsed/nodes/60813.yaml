    html: |-
      <p>I agree that it needs to be one color because splitting it up compromises legibility. I can see a roman numeral two and a 3, or Il3. Stick to one color, or keep each letter completely one color. </p>
      <p>I think the rivets could work well, but they're not quite right yet. Maybe use them on the outer corners to rivet the whole logo to the background? Play around.</p>
      <p>I'd also try Bolling Steel on two lines because right now, it's too small compared to the mark, and it risks being read as "Boiling Steel" which is, well, just weird. Setting it in all caps might be the problem? Small caps may help, or perhaps all lowercase? It's one of those words that needs precise kerning, too, so once you settle on a layout and/or font, kerning could make you crazy. </p>
      <p>Once you're crazy, you'll officially be an experienced designer. :)</p>
