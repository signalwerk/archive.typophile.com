    html: |-
      <p>first row, first column. i thought that one had a certain elegance in the shape to the "crest," and i could picture that as a placard welded onto steel. or riveted--i would like to see what 4 small white circles, on in each corner, would look like. </p>
      <p>i think steel--rivets. but don't overdo it.</p>
      <p>also, with steel, who knows, maybe there's no reason to go color. i don't mind the use of white, grey, and black. however, regardless of color, the value of the two forms, the I and the B bother me. because the I beam is white it stands out most clearly, and i read this as IB--the letter I, the letter B. so try switching their colors.</p>
      <p>that might not work tho--seems tricky to make a letter have an I beam without saying I.</p>
