    <p>I found the name of this font to be sand. But I have bought over 65 fonts and this is the first time I found only available for Apple sysytems. Does anyonne know if there's a Similar version to this for Windows, or is there simply a windows version of this font and somehow I missed this?<br>
    Thank you!</p>
