    html: |-
      <p>The typeface is "Sand" <a href="http://new.myfonts.com/fonts/apple/sand/sand/" title="http://new.myfonts.com/fonts/apple/sand/sand/">http://new.myfonts.com/fonts/apple/sand/sand/</a> and currently is not available for sale by third-party firms.</p>
      <p>A somewhat similar font free for personal use is SilkRoad <a href="http://www.dafont.com/silkroad.font" title="http://www.dafont.com/silkroad.font">http://www.dafont.com/silkroad.font</a><br>
      Blemished has a rough look as well: <a href="http://www.dafont.com/blemished.font" title="http://www.dafont.com/blemished.font">http://www.dafont.com/blemished.font</a><br>
      Lastly, To Forgive is of the same ilk as the others: <a href="http://www.dafont.com/to-forgive.font" title="http://www.dafont.com/to-forgive.font">http://www.dafont.com/to-forgive.font</a></p>
      <p>Hope this info helps.</p>
