  html: |-
    <p>The 2008 <a class="freelinking external" href="http://www.wells.edu/bkarts/institute.htm" rel="nofollow">Book Arts Center Summer Institute</a> at Wells College offers two week-long classes. I will be teaching Introduction to Typeface Design "Stems and Beziers" July 6-12 and Sara Soskolne will be teaching "More than the Sum of Its Parts: Turning Letters into a Typeface" July 20-26.</p>
    <p>One past participant of my course won a TDC award in 2007 and is now on staff at a leading foundry. Sara Soskolne works as a typeface designer for Hoefler &amp; Frere-Jones, and has taught at Yale University. You can <a class="freelinking external" href="http://www.wells.edu/pdfs/Book_Arts_Summer_2008.pdf" rel="nofollow">read more</a> about these classes and first-class offerings in calligraphy, binding, and letterpress.</p>
    <p>Wells College is located on the shores of Lake Cayuga, in scenic Aurora, New York near Ithaca and Syracuse.</p>
