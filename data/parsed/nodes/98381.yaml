    html: |-
      <p>Hrant: <em>your "structure" might be understood as "expanded skeleton" </em></p>
      <p>Which would be a mistake. If I'd meant skeleton, I would have said skeleton. What I am talking about might be considered the opposite of an expanded skeleton: a perceptual shape within the black. It is easy to see how this shape is perceptually subject to the relationship of opposing outlines, without falling back on a notion of these as expansions of a skeleton. As I've pointed out in the past, Legato possesses a strong sense of structure that is not reducible to a skeleton through manipulation of the outlines, which would be the case for skeleton expansion (or stroking).</p>
      <p><em>To me it all boils down to the "total" black/white border</em></p>
      <p>It cannot boil down to that in the case of text type at typical sizes, because at those sizes we don't perceive the borders, we perceive the shapes.</p>
