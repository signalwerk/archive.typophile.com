      <p>John, your "structure" might be understood as "expanded skeleton" (which I feel is irrelevant). But even if you mean structure in terms of black bodies, I think it's dangerous to think in those terms; to me it's all about notan. So yes, don't look at the two outlines... but that's because it's not two outlines; in a way it's actually one -potentially complex- outline; or maybe no "outline" at all... To me it all boils down to the "total" black/white border (which even exceeds the letter boundary).</p>
      <p>hhp</p>
