    html: |-
      <p>Everyone is telling you: your question can't we answered in the abstract, as it depends on the context of a design. In other words it's the wrong question to ask if you want to improve a design. </p>
      <p>A good new typeface has: A. a good design idea--something it's trying to do that makes design sense; B. It is carried out consistently; C. It is carried out well artistically. Often you don't know whether your design idea is good—or whether you can make it good—until you try B. and C. </p>
      <p>Inside and outside curves and how they relate should flow out of your design idea. And that can only be judged in the context of, say half or more of the alphabet (eg hamburgerfontsiv). Then you can ask: was this a good design idea? Should it be changed, or is some of the execution flawed that I should fix before going on? If some characters are flawed, how?</p>
