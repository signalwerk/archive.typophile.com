    <div class="info">Submitted by <a href="/user/1503" title="View user profile.">joe graham</a> : 14.Sep.2009 8.46am </div>
      <p>Organon comprises two distinctive new families from type designer Nick Cooke, Organon Sans &amp; Organon Serif, released through his G-Type foundry and distributed by Fontworks UK Ltd (<a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a>).</p>
    <p>Cooke’s six weight Organon Sans &amp; Serif typefaces complement eachother wonderfully to create an elegant, legible and thoughtfully designed suite of fonts. Tapered stems give the Organon OpenType fonts an attractively robust appearance.</p>
    <p>All fonts contain 4 sets of numerals (lining, old-style, proportional, tabular) plus Small Caps, ligatures, discretionary ligatures and CE language support. In addition the Sans versions contain extra OT style sets with alternate lower case y, infant a, and double decker g.</p>
    <p>Organon is available from Fontworks UK Ltd and online at <a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a></p>
    <p>Information about Fontworks:<br>
    Fontworks UK Ltd is the UK’s most respected type distributor, representing over 100 foundries worldwide and offering a huge range of fonts from major players (Adobe, Linotype, Monotype, Berthold, ITC, Bitstream), leading independents (Emigre, Font Bureau, T-26) and cutting edge micro foundries such as Virus, Alias, Acme, G-Type, and Device.</p>
    <p>We are a leading provider of custom fonts and type design services to the corporate, advertising and design sectors. The company has evolved into a multi-disciplined ‘Type Consultancy’ advising on font licensing and legality, plus many technical and Corporate Identity issues.</p>
    <p>Information about Nick Cooke / G-Type:<br>
    G-Type founder Nick Cooke released his first collection of typefaces in 1999, including the families Houschka and Nubian, and the single fonts Geetype and Gizmo. He has designed fonts which are in use by leading companies and publications including Laura Ashley, Tesco, MacUser, Sainsbury’s, The Mail On Sunday, Nectar and South West Trains. </p>
    <p>Chevin is highly prominent as Royal Mail’s Corporate Font. His first OpenType release was a wonderful pen script called Olicana which was voted one of the 10 best releases of 2007 by typographica website. The recent Houschka Pro and Houschka Rounded families followed Cooke’s signage typeface for Morpeth town centre’s wayfinding system.  </p>
    <p>Fontworks UK Ltd<br>
    <a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a><br>
    t: +44 (0)20 7226 4411<br>
    e: sales@type.co.uk</p><div class="imageWrap"><img src="/files/Organonbanner560_6576.gif"></div><p></p>
