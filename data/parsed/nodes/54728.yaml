    <p>Not directly type related: I visited an exhibition of African &amp; Oceanic Arts at <a href="http://www.beyeler.com/fondation/e/html_11sonderaus/01_aktuelle/intro.htm" rel="nofollow">Fondation Beyeler</a> today and was stunned by these anthropomorphic figures from Papua New Guinea alternately called <em>yipwon</em> or <em>aripa</em>.<br>
    Their proportions are a bit impractical for the web. :-)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/yipwon_3542.jpg"></div><p></p>
    <p>They're fairly large, some almost life-size, some even slightly taller; and the ones I saw were between 200 and (probably) close to 500 years old. According to this little leaflet I got at the exhibition, these figures were supposed to (spiritually) help the hunt; they are embodiments of spiritual beings moving back and forth between the spheres of the real and the spiritual, and (this is not in the leaflet) their formal execution seems to echo this (non-exclusive) duality by making the "empty space" just as palpable as the "real material", giving equal value to the tangible and the imagined. They're thereby also implying impressive volume while in fact they're usually fairly two-dimensional (this is in the leaflet again).</p>
    <p>I tried to find a book on these, but books on Oceanic Art seem to treat these figures rather marginally, and the exhibition catalog was prohibitively expensive. :-|  Does anyone know about these? There isn't even a Wikipedia page.</p>
    <p>By the way, being in a museum that usually shows modern art, the exhibition combined these figures with Matisse paintings hung in the same room. I couldn't help but feel his modern treatment of the white (like here in <a href="http://www.passion-estampes.com/deco/affiches/matisse/matissealgueblanche.jpg" rel="nofollow">"Algue blanche sur fond rouge et vert"</a>) feels strangely forced in comparison with the gracious whitespace in the yipwon.</p>
    <p>More yipwon pictures:<br>
    (Googling for those is… funny.)<br>
    <a href="http://www.egodesign.ca/fr/article.php?article_id=342&amp;page=3" rel="nofollow">Ego Design: Oceania</a><br>
    <a href="http://www.metmuseum.org/toah/ho/10/ocm/ho_1978.412.854.htm" rel="nofollow">Metropolitan Museum</a><br>
    <a href="http://fr.encarta.msn.com/media_461550081_761572534_-1_1/Yipwon_(Papouasie-Nouvelle-Guin%C3%A9e).html" rel="nofollow">French Encarta</a><br>
    <a href="http://www.denverartmuseum.org/explore_art/collections/objectDetails/objectId--104907" rel="nofollow">Denver Art Museum</a><br>
    <a href="http://www.michaelhamson.com/Sept-06158.htm" rel="nofollow">Michael Hamson Oceanic Art</a></p>
