    <p>This is not a bona fide identification post, but I do need some recommendations. </p>
    <p>I'm not sure if I'm asking for too much here, but I'm looking for a serif font with a full set of numerals (old style figures, proportional lining figures, tabular lining figures) and I would also like the old style figures to have a slightly higher x-height than the non-numerals. </p>
    <p>I find true old style figures hard to use especially when you need to set it together with text (such as US$120,000). I never really know what to do as uppercase looks too large and small caps for US$ look too small. </p>
    <p>Any suggestions / recommendations / links about old style numerals are welcome. Thanks!</p>
