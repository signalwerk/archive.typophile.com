      <p>Hi Karen, my <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a> has a full set of figures, and the old style "x-height" is higher than the lower case x-height. You can find some examples <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/ot/" rel="nofollow">here</a>, and more on the PDF linked at the bottom of the page. As well as the four styles, old style and lining, both proportional and fixed width, there are superiors, inferiors, and lining figures at small caps sizes. These later, which are a bit unusual, I find quite useful, and they may be what you are looking for. </p>
      <p>This is, as the name indicates, intended for text sizes. The bold and the italics work for headings say at 14pt, but the heading sizes are yet to come...</p>
      <p>For true display sizes you can match with Big Caslon, Caslon 540, and the new award winning <a class="freelinking external" href="http://letter2.org/winner/william" rel="nofollow">William.</a>, though I'm not sure where to get that latter one, which is pretty impressive.</p>
