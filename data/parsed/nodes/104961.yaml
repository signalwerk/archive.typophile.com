    <p>Unless you’ve been living in a secluded yurt for the past few days (although you’d probably still be checking your phone, don’t lie), I’m likely not the first person to tell you about Matthew Butterick’s <em><a class="freelinking external" href="http://practicaltypography.com/" rel="nofollow">Practical Typography</a></em>, a new read in a long line of essential reads on typographic rules. Butterick’s writing is especially refreshing and particularly useful for explaining these sometimes confusing and cryptic details to the novice or the first-year design student. </p>
    <p>The suggestions on <a class="freelinking external" href="http://practicaltypography.com/how-to-pay-for-this-book.html" rel="nofollow">how to pay for this book</a>, however, are leaving me indecisive and guilt-ridden. Paying for the book by purchasing a font doesn’t seem like a bad idea—I wish I could buy everything in fonts! However, with my options ranging between $90–120 (for one weight of Concorse or Equity) and $5 (suggested cash payment), should my payment level be based on my intended use of the book? My bank statement? My Klout ranking? </p>
    <p>Does the type community suffer from an embarrassment of [free] online riches (*cough* Typophile *cough*) so that paying for a good one seems impractical? While much effort in the industry is focused on educating users about investing in licenses to quality fonts, are we giving away too much of our expertise on the web? Who hasn’t benefitted from these resources?</p>
    <p>So, here’s my experiment in reader-supported publishing: I’m going to let you, dear Typophile reader, decide what I should pay for <em>Practical Typography</em>. <a class="freelinking external" href="http://www.surveymonkey.com/s/K36T5QM" rel="nofollow">Feel free to take this survey</a>, which will close on Friday, August 2, 2013. </p>
    <p>What if fonts become a new digital currency, like <a class="freelinking external" href="http://en.wikipedia.org/wiki/Bitcoin" rel="nofollow"> bitcoins</a>? Now that’s the most practical idea I’ve come up with today.</p>
