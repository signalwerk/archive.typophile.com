  html: |-
    <p>Typekit, purchase, rental, DRM, etc .. it's all good, but here is an idea that can be easily implemented right now and that will cover the <strong>100%</strong> of the web design community needs.</p>
    <p><em>An online service that for a monthly fee allows rasterizing unlimited amount of text in a specific typeface. You select the typeface, the size and the color and it gives you a transparent PNG back. Licensed for a web use PNG that is. </em></p>
    <p>If you think for a moment how <em>exactly</em> non-standard fonts are used in the web design, it will immediately make perfect sense. They are used sparingly for headers, menus and such and they are always rasterized. The web designers need the PNGs, not the OTFs or TTFs. So sell them just that.</p>
    <p>If the service fee is reasonably low (something like $10 per year per font, or perhaps $50 for the buffet), this will open up existing font portfolios to a much much wider designer audience. It should also curb the piracy to a certain degree, because people are stealing fonts predominantly for the online use.</p>
    <p>Additionally, this should allow for using custom rasterizers that are font- or foundry-specific. Case in point - <a class="freelinking external" href="http://typophile.com/node/57114">Effra</a> from Dalton Maag.</p>
    <p>MyFonts, for example, already have all the technology in place to make this happen. Just needs a trip to a lawyer and a web interface. It all can be up and running in a matter of weeks.</p>
