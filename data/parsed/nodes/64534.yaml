      <p>I realize that this being Typophile, we tend to put a higher value on type, but I think, in general, most web designers are perfectly happy with graceful desegregation of @font-face selections to system font-stacks. That's still preferable over having to server custom images. </p>
      <p>I think small sites will still be OK with the 'image as headline' option but since they're small sights, I'm not sure how much demand there'd be for online rasterization services for that. If I'm using a custom face on my site, I'd like want a license to it anyways for my print material.</p>
      <p>I hate to shoot down the idea, I think it's something worth exploring, I just to clarify what the market demand might actually be for that before undertaking such a project.</p>
