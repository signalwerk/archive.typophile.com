      <p>"All modern browsers resize images along size with the text. Not perfectly"</p>
      <p>exactly. 12pt type as an image scaled to 24pt is going to look like crap.</p>
      <p>"there is an alt attribute in the img tag "</p>
      <p>There's various limits with the number of characters that can be used for that in both browsers and in terms of screen readers and SEO.</p>
      <p>"Pre-rasterized text is nothing new and there is a set of SEO techniques for it."</p>
      <p>And they are less than perfect once you factor in accessibility and usability issues.</p>
      <p>"though properly optimized PNGs will probably add up to significantly less than all the javascript bloat that comes with an average page nowadays."</p>
      <p>Most of the javascript (when properly implemented) would be cached from page to page. Custom PNGs would not.</p>
      <p>It's not a terrible idea from 'can it be done' standpoint, it's just what we were doing circa 5 years ago. sIFR is a better option than that in a lot of cases, and @font-face is even better.</p>
      <p>Having font licensing issues trump web site user's needs isn't very pragmatic, IMHO. Granted, I'm more of a web designer than type designer. ;)</p>
