      <p>Thomas, thanks for the reply. </p>
      <p>The point I am trying to make is that the use of images for headers, menus, etc. is already an established practice. </p>
      <p>If you look through a <a class="freelinking external" href="http://creattica.com/css/latest-designs">Creattica</a> or <a class="freelinking external" href="http://patterntap.com/tap/collection/headers">PatternTap</a> collections, you may notice how wide-spread its use actuallt is. For example, have a look at <a class="freelinking external" href="http://www.curbinnovative.com">this site</a>, which is quite typical as far as the use of technique goes. Even larger sites, like <a class="freelinking external" href="http://www.jivesoftware.com">Jive</a> and <a class="freelinking external" href="http://www.akamai.com">Akamai</a> use it.</p>
      <p>No reason not to offer a special font licensing option for these cases. There is a lot of smaller designer shops working on smaller projects that can't really justify paying $200 for a font family, do not really need the actual OTFs, but would gladly use it for their designs. Offering them rasterized option not only means a better looking web, fewer reasons to look at the piracy and an additional revenue stream for the foundries, it also builds the relationship with them and makes them more likely to purchase the real deal later on. Similar to how village does it with their "taster option".</p>
