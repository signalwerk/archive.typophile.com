    html: |-
      <p>@epsilicon</p>
      <p>I've been looking at the source code for Facelift.<br>
      Thanks for posting this. I've become re-interested.<br>
      Just as the increase in bandwidth has made @font-face a viable proposition so too, might some of these image replacement techniques be worth a second look.<br>
      Some sites might not want to settle for the fallback font-family. On a well-optimized site the performance hit for this kind of stuff might be acceptable if not over-used.</p>
      <p>Designers certainly want the kind of "graceful degradation" that fonts-as-images provide. But are they willing to put up with the unwanted side-effects?</p>
      <p>&gt;This is an ugly practice, doesn’t scale, doesn’t reflow, &gt;etc.</p>
      <p>It scales somewhat but gets fuzzy. However, if there were onzoom or ontextsize change events built into browser javascript engines a true re-scaling could be achieved.<br>
      (FF is finally, at least, providing a javascript property for detecting the zoom level. But no events as yet.)<br>
      I've done some research and proof-of-concept work on this aspect of scaling and browser capabilities.<br>
      Reflow can be achieved right now, using javascript and Ajax. Kind of a production, though. Don't know if it's worth the hassles. Easier to apply it only to short headlines far left aligned!</p>
      <p>This as a service? Not optimistic about that, but who knows.</p>
      <p><a href="http://readableweb.com">Rich</a></p>
