      <p>That's what we are still doing circa now. There is a lot of web designers that use pre-rendered text in their designs. What I have suggested is going to simplify their life, and give foundries more control over what's happening with their fonts in the online context.</p>
      <p>I fully understand that rendering on the end device is far better than pre-rendering, and I do not disagree that latter is full of problems as per your list. Font-face adoption for the design (as opposed its support in browsers) still has a long way to go, and the pre-rendered text is here to stay for a while. All I am saying that there is no reason not to improve at least some aspects of it.</p>
