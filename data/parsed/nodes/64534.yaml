    date_raw: 23.Nov.2009 8.25pm
    votes: null
    html: <p>Personally, I would like it if in addition to the ambitious schemes still in development for web fonts, it were possible to use the standard bitmap font file formats that are used with Linux in conjunction with web pages. Yes, such fonts would not scale well, but at least it would allow people to draw their own fonts for use with their web pages without waiting for the development of new technology. Of course, that would have been even more true years ago, since now it seems like the web font standard is coming soon.</p>
