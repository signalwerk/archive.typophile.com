    html: |-
      <p><em>- more troublesome for users to resize</em></p>
      <p>Not really. All modern browsers resize images along size with the text. Not perfectly (no cubic spline interpolation), but very much passably.</p>
      <p><em>- harder to select</em></p>
      <p>Agreed.</p>
      <p><em>- useless for body text (screen readers and google need to see text)</em></p>
      <p>Not really, there is an alt attribute in the img tag and there's also that placing the text in the div with a very large offset and using the image as div's background. There's probably something else. Pre-rasterized text is nothing new and there is a set of SEO techniques for it.</p>
      <p><em>- a pain to maintain</em></p>
      <p>The pain is already there. See below :-)</p>
      <p><em>- adds bandwidth issues</em></p>
      <p>Agreed, though properly optimized PNGs will probably add up to significantly less than all the javascript bloat that comes with an average page nowadays.</p>
      <p>--</p>
      <p>I am not saying that this is a pretty technology. I am saying that there is a set of established practices that are lacking proper type licensing support at the moment. And that it is almost trivial to satisfy this need. Designers are getting an access to more fonts, foundries are getting additional revenue without releasing vector data, the web practices stay the same.</p>
