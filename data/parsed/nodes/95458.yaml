    <p>I'm not sure what to make of <a class="freelinking external" href="http://www.myfonts.com/fonts/national-eating-disorders-assn/annes-hand/" rel="nofollow">this</a>. It is a pretty crappy handwriting font, one you could find by the millions on freefont sites. It has no special features, no ligatures, nothing to make it stick out form all other handwriting fonts. More authentic would be to just write something yourself, it would be prettier too, and just as (il)legible. I mean, not to slag of using fonts for a good cause, and I understand the concept, but is this all you can come up with? Why not work with a typedesigner with an interest in the cause and work with him/her to create something that has actual typographic value. </p>
    <p>I don't see people buying it for these fonts, why should I not donate to this cause directly, and just leave the fonts to be? It's like the homeless guy selling ugly postcards, and I tend to give him some money, but tell him he can keep the cards for himself. I don't want to be unreasonable, but surely, if one wants to use the selling of fonts to raise funds and grab attention for a cause, it should at least be a decent quality font, right?</p>
