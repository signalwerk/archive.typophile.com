      <p>This is a delicate matter, I’m starting to realize, due to the involvement of her brother as the type designer, and I apologize if I’m being inconsiderate.<br>
      You’re right Jeffrey, the type could have been better done, but frankly I don’t think he could have produced the quality of design you’d like to have seen, based on the fonts that he has published. I can understand that he would want to do this as his tribute to her, and make her look good in the banner ad, but he was probably too close to do his best creative direction and contract out design where necessary—it happens in self-publishing, especially in the graphic design industry. I’ve produced quite a few font promotions for myself that in retrospect would have been better if someone else had done them. Pro bono work, too, can often lack the rigor of what takes place in a more formal professional process.</p>
