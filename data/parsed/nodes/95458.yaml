      <p>I think the design of it all is indeed not fitting for the serious subject, I'm not saying it should be looking like a gravestone, or something very depressive. But it should communicatea clear message, with fitting means, this tries to cater to the market, by imitation. Probably this has to do with, as Nick mentions, the self-publishing aspect of it. Probably he wanted to do it, and the association decided to go along with it (why not, it does no harm). But with more distance, reflection, better art direction and clear objectives, this could have been much stronger.</p>
      <p>Another thought that came to me, is that it seems like the font-buying public seems big enough to release a font for charity. It sure has grown, but still, it seems to me to be rather a niche market, with the biggest buyers being the big corporations (multi-seat licensing etc), not individuals. Many individual designers still don't know one pays to use a font (trust me, I have seem many examples), so why would those that do buy fonts pay this kind of money, when there are so much better fonts around, at a lower price, or even for free. But obviously it says even more about the fact that making a font is really so easy, that everyone can do it.</p>
      <p>I believe that if they insisted to release the font in this state, they should have made it donation-wareat a pay-what you-want model, and present it on a seperate website, let all the world know about the backstory to get people to the site. I believe this would also make the whole thing more effective.</p>
