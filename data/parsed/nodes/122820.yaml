      <p>If you read the magazine <a href="http://issuu.com/aurevoirmagazine/docs/aurevoir_n1_single">http://issuu.com/aurevoirmagazine/docs/aurevoir_n1_single</a> you will note that this lettering is used only for the title. The body text is in something more conventional.<br>
