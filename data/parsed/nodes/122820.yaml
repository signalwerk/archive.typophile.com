      <div class="comment-spam-body"><p>If you read the magazine <a href="http://issuu.com/aurevoirmagazine/docs/aurevoir_n1_single" title="http://issuu.com/aurevoirmagazine/docs/aurevoir_n1_single">http://issuu.com/aurevoirmagazine/docs/aurevoir_n1_single</a> you will note that this lettering is used only for the title. The body text is in something more conventional.<br>
      The models are also conventional -- starved waifs.<br>
      As for the lettering, I suggest that Larish Neue is the closest. It has the distinctive serif treatment and a similar look and feel.<br>
      Don</p>
      </div>
