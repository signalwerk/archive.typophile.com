    html: |-
      <p>hi boros ... i grabbed two recent examples that i've done (right two) and simulated something quickly in illustrator (left). Maybe these will be helpful.</p>
      <p>best suggestion is to NOT drop the loop down, just across.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/y_4597.png"></div><p></p>
      <p>typically, you want to match the stress of your roman, if it has one.</p>
      <p>perhaps you could scrap the roman 'by' and try italic forms?</p>
      <p>also, there's a great opportunity to use a loopy/swashy tail (bottom horiz. stem) on your Z to add some Zest. Maybe a tail on your R/</p>
      <p>good luck</p>
