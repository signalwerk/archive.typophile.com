    html: |-
      <p>Physically, the top of the "y" is aligned with the top of the "A", if I understood correctly what eliason and innovati suggested. But it may not be a thing of mathematics here, and now that you told me, the "by" seems to me also to be a bit high. I'll do some tests tomorrow at work that follow your suggestion.</p>
      <p>eliason and beejay I think you're asking too much from me. I will look in my archive for italic forms and test them with the swash. For amusement I will try drawing the "by" myself, although I'm certain I couldn't do a better job than what I ended up with here (+ minor tweaks). I feel that this swash is a sensitive area in the whole concept. Maybe contrast added by a different typeface than Versailles would be very welcomed here. I am still afraid, though, about one thing: Versailles is a pretty complicated typeface (to my eyes) and adding another detailed face next to it might be too much. If the main font would be a sans serif, a swashy italic form for the "by" would surely look sweet, I think.</p>
      <p>But as I've learned in my short time here, rationalizing may not lead to the best results. So enough talking - on to testing.</p>
      <p>innovati, your thoughts are very encouraging. I enjoy this more than I can say.</p>
