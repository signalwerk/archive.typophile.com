      <p>Hi Boros!</p>
      <p>Well, I’m certainly not qualified to teach you much about calligraphy nor drawing. However, if you did try drawing this y, even just a little—even if you have bad penmanship then you can get a better feel for how the loop is supposed to behave. Script and swashes are elevated forms of our human writing.</p>
      <p>I’m really not much help, but I for sure like your concept thus far.</p>
      <p>Mikey :-)</p>
