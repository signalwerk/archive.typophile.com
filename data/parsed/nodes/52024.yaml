      <p>Thanky you! Indeed, trying to draw the swash with a fountain pen revealed more natural shapes than what I had in my mind.</p>
      <p>As an added bonus, the results also filled the space below the "b".</p>
      <p>Here's what I settled on. This one seems to me more "alive", although I'm not sure if it isn't a bit too sharp. Or if the loop reads like a "v".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logosharpswash_3796.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sharpswash_4052.jpg"></div><p></p>
      <p>A loopier one, like the ones in Beejay's beautiful drawings, may also seem to be a good idea, but I need to work on this one:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo roundswash_3621.jpg"></div><p></p>
      <p>As for setting the "by" in cursive italics, I'm not sure, although maybe a sans serif "by" would do the trick here. Here's a very lame version with Avenir Medium Oblique for "by". Why not?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sansseriflogo_6686.jpg"></div><p></p>
      <p>----</p>
      <p>I'm afraid to start working on the R and the Z, as Beejay suggested. First of all, I couldn't do it, second I think it would crowd things a little for this heavy face. It would probably work with a lighter one, though.</p>
      <p>----</p>
      <p>Thank you again. I kind of like the first version, the one with the sharp swash. What do you think?</p>
