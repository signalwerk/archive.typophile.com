    <p>Hello everybody!</p>
    <p>My client is a fashion stylist and runs a (stylish) men's clothes boutique.</p>
    <p>For the logo I've settled on the Versailles Bold typeface but I felt the caps with their sharp serifs could be sweetened with a swash of the "y". Also, the swash would imitate a signature, in my mind.</p>
    <p>Now I'm not a type designer and I shouldn't probably play with things I don't quite grasp.</p>
    <p>I'm very curious about what you think.</p>
