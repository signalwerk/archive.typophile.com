    html: |-
      <p>I love the "R" in Luxury Diamond </p><div class="imageWrap"><img src="http://typophile.com/files/luxuryR_5594.jpg"></div><p></p>
      <p>It reminds me of Prada's "R".</p>
      <p>Thank you for answering, Fabulous. Please, give me some hints about what is there to be done. Is the loop too tight? Is the diagonal too thick? Is the whole thing completely bogus and I need to start all over again? How much liberty can one take when creating a swash? What are the rules?</p>
      <p>I am a self-thought graphic designer and I never took typography classes. It may sound silly, bu here's what I reasoned when drawing the swash: I imagined holding a broad pen in my hand and drawing the "y" with the flourish. The diagonal of the swash parallel with the stem in the y should end up being of the same visual thickness. Other than that, I figured the whole thing should look harmonious (the length of the descender + the swash I tried to balance with the rest of the uppercase letters).</p>
      <p>I know that professionally speaking I should let someone who actually draws type do this thing, but I'm passionate about typography and I aspire to understand the upper crust of its mysteries.</p>
      <p>I hope I did not offend anybody. I'm not looking for a quick tutorial, I want to understand what would be some basic guidelines in creating this swash.</p>
