      <p>Haven't read every word of the thread, but... in those last couple versions, you are drawing WAY to much attention to the "by". This is the least important word in your logo and is drawing the most attention. I could actually see it working better without the "by" in it all together. Just come up with some other way to separate "trends" and the name. </p>
