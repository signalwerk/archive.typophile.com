    <p>A page description programming language developed by <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> founder John Warnock and others in the mid 80s. As it relates to typography, the term is used to describe <a href="/wiki/font" class="freelinking" rel="nofollow">font</a>s written in PostScript.</p>
    <p>See also: <a href="http://www.adobe.com/products/postscript/pdfs/postscript_is_20.pdf" title="http://www.adobe.com/products/postscript/pdfs/postscript_is_20.pdf">http://www.adobe.com/products/postscript/pdfs/postscript_is_20.pdf</a></p>
