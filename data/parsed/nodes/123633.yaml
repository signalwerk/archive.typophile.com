  html: |-
    <p>I realise that in this day and age one is probably expected to have a moderately larg browser window, but nevertheless I like to use my brower non-maximized.  This causes the right menu bar to overlap with the forum listings and the top menu with the top-left logo, as shown in the attached screenshot. </p>
    <p>One possible solution to the forum listing issue is to make <code>#squeeze</code> be <code>overflow-x: auto</code>, which requires me to scroll horizontally to see the rightmost parts of the table, but that's perfectly fine. The top menu seems a bit trickier to do something about with the current CSS, which seems to rely pretty heavily on absolute positioning. The top menu isn't that much of an issue though, so feel free to ignore that.</p>
