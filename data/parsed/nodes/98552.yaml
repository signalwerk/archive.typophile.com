      <p>Taking into account the dates, it may prove difficult to find a modern digital font to match. I don't know if it helps, but the closer I can find -based on the provided numerals- is <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=Probert%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=b5cf8c87cfca48c278eacf2830747e13&amp;wrap=2&amp;text=0123456789" rel="nofollow">Probert</a></strong> free font by Neale Davidson<br>
      |4| is way off, but the rest of digits are quite close.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
