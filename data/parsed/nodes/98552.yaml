    <p>Hi</p>
    <p>I've been drawing a blank trying to find out what the attached font is.</p>
    <p>It was used by a swiss watch movement manufacturer on obsolete date indicators (the bit  that tells you the date in the little window on your watch dial) from 1969 until around 1980.</p>
    <p>They were printed on water slide transfers (decals), applied to a plastic wheel that frequently breaks. I'm looking to get replica tranfers made up, but can't work out what font was used.</p>
    <p>I've a (much) larger blown-up scan of the full wheel if  it helps?</p>
    <p>Thanks</p>
    <p>Andy</p>
