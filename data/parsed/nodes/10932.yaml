    <p>This not very pleasant typeface is used in an altar missal published by Benziger Brothers Inc. around 1956 (the book has no publication date, but Cardinal Spellman's introduction is dated the feast of St Basil the Great, 1956). The type is used in two sizes 14pt (shown here) and 12pt. A different typeface is used for italics, suggesting that this face might not have an italic. Anyone recognise it? <br> <br><img src="http://www.typophile.com/forums/messages/83/8547.jpg" alt="Missale Romanum 14pt"></p>
