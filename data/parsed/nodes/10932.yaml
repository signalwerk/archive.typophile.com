    date_raw: 9.Apr.2003 10.10pm
    votes: null
    html: <p>Theo <br> <br>De Vinne was very influential in his time, and for good reason. His faces weren't the best, in retrospect they were awful, but his instincts were right on the mark. There were a lot of variants to his "family." This is not De Vinne No. 11. Thought I said that. We don't have really good records of specimens and their positioning during this very exciting period of printing history. <br> <br>De Vinne is important because he was a printer with scholarly interests. He is the first to point out that Gutenberg may indeed have invented the type mould. Something the scholars of the period were unable to fathom. His writings were important and influential. Updike followed in his footsteps. He was a revivalist *before" Morris. We probably wouldn't be discussing anything type related here and now had this dude not lived. <br> <br>This is De Vinne inspired face. I don't know the exact name of this particular typeface or the rip off foundry that produced it. And I don't care.</p>
    html_clean: <p>Theo <br> <br>De Vinne was very influential in his time, and for good reason. His faces weren't the best, in retrospect they were awful, but his instincts were right on the mark. There were a lot of variants to his "family." This is not De Vinne No. 11. Thought I said that. We don't have really good records of specimens and their positioning during this very exciting period of printing history. <br> <br>De Vinne is important because he was a printer with scholarly interests. He is the first to point out that Gutenberg may indeed have invented the type mould. Something the scholars of the period were unable to fathom. His writings were important and influential. Updike followed in his footsteps. He was a revivalist *before" Morris. We probably wouldn't be discussing anything type related here and now had this dude not lived. <br> <br>This is De Vinne inspired face. I don't know the exact name of this particular typeface or the rip off foundry that produced it. And I don't care.</p>
