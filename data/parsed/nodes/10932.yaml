    html: <p>John <br> <br>This is a near De Vinne. There were a lot of variants of this and become known as the De Vinne family in the US. These were known as romanisch, romisch, romaans in European enboldened renditions. Very late nineteenth century. <br> <br>De Vinne No. 11 is very similar except the lowercase c shown here is wrong and, interestingly, wrong for the face. <br> <br>Is this a pop quiz? or?</p>
