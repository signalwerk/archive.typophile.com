    html: <p>John <br> <br>Thought you might find this interesting.  <br> <br>DeVinne is derived from Elzevir or French Oldstyle faces. But most importantly, the display DeVinne "is credited with bringing an end to the period of overly ornate and fanciful display faces of the nineteenth century, and with restoring the dignity of plain roman types." !!! <br> <br>This from McGrew's American Metal Typefaces of the Twentieth Century.</p>
