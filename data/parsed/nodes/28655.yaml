      <p>Tim,<br>
      I can't speak for Nick but it makes sense to me.  IMHO, The serif on the lining figures hits the baseline and emphasizes it. The stem of the 4 on the oldstyle figures comes below the line and gets the feel of a decender.  Putting a serif on it would make too strong a horizontal pull below the baseline and give a line of figures too wavy of a look and fight the supposedly stronger baseline in lower case.</p>
