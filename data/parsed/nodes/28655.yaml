      <p>I do think that, as James' posting indicates, the shapes of the numbers are not as settled those as of the roman letters. And so the designer has a little more latitude with them. </p>
      <p>In Paul Shaw's 'letter tour' of lower Manhattan that I went on a month ago we saw a lot of stone carved letters where eg, 1931 had only the 9 descending, not the 3. There were a number like this, with other letters same height on the top and the 9 descending. They were perfectly readable and didn't look odd; in fact many were quite nice. </p>
      <p>Obviously a lot has to do with context. If you have an old style font, not following the convention for text figures is going to look out of place. But eg in an address or date or more modern face variations may look good.</p>
