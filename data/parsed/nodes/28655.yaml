      <p><em>It often seems to me that there is just as much ‘information’ in a 2 as there is in a 4 in some typefaces and perhaps they should be given equal height. Nick, why does your 4 lose the serif?</em></p>
      <p>I often "cheat" on the height of oldstyle 2, making it slightly higher than the top of the 3.</p>
      <p>Chris is right about the serif. I think it's for standing on, so if the letter is sitting on the baseline with the leg hanging, then the toe drops down.</p>
      <p>**</p>
      <p>At Typecon, Akira Kobayashi recalled the anecdote of how, with trepidation, he asked Adrian Frutiger if it would be OK for Linotype to add old style figures to the Frutiger face. No problem, said AF, and drew the designs on the spot, in a couple of seconds (Akira showed the sketch): but here's the kicker -- he drew the 4 standing on the baseline, not sitting. However as eventually implemented, it's sitting. I didn't have a chance to ask Akira about this (my reputation is churlish enough), but I did wonder.</p>
      <p>**</p>
      <p>Choz -- You should try a version where your proportions are strictly conventional for OSF. Your treatment of detail, and curve shapes, are unusual enough that I don't think you will be compromising your design by doing that, and you will gain in "disambiguation".</p>
