      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Austinfigs_4431.png"></div><p></p>
      <p>I wasn't going to do old style figures for this face, I mean, it's a modern.<br>
      However, after implementing both proportional and tabular figures in OpenType, I realized that because of the way InDesign implements OT figures, it's either one style or four (because if the font contains only proportional and tab lining figures, the palette nonetheless shows old style figures as an option). So I made the old style figures -- or perhaps they should be called postmodern figures. What do you think, is this a travesty?</p>
