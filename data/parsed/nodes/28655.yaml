    html: <p>Assuming calligraphy as the spring of typography, in old-style typefaces (used as fonts) text figures are usually the same height as a lowercase x, they are not capitals, nor uncial, they are 'minuscule'. The ductus is the number, direction and sequence of the strokes that makes up a character. These days, some typefaces intended for text even make old-style figures the default numerals. FontShop, for example, usually makes old-style figures the default; Adobe doesn't. But it can vary from font to font.</p>
