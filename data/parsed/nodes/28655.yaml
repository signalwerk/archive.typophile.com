    <p>Traditionally, the 0, 1, 2 are on the base, the 3, 4, 5, 7, 9 descend, and the 6, 8 ascend.</p>
    <p>How important is that? If a font includes <a href="/wiki/text%20figures" class="freelinking" rel="nofollow">text figures</a>, do people expect them to follow that specific pattern, or just whatever looks nice?</p>
    <p><a href="http://en.wikipedia.org/wiki/Text_figures" title="http://en.wikipedia.org/wiki/Text_figures">http://en.wikipedia.org/wiki/Text_figures</a></p>
