    html: |-
      <p><cite>Christopher, why do you think the ball terminals were removed on the 6/9?</cite></p>
      <p>The theories above are as good as any. I remember talking with Robert about it at the time he made the changes, but I don't remember him explaining that. (Which is not to say I didn't just forget!)</p>
      <p>What's most interesting to me is that there is an overall improvement -- in that the figures just harmonize with the text more. Utopia is a good case for the this particular thread, I think, because the original figures always struck me as a little forced; they conform to the rules of how non-lining figures should be, but they were perhaps lacking design maturity, and never looked comfortable to me. Robert has learned a lot about such things since the early days when he made Utopia, so I think it's reflected in the changes. The figures are, overall, a bit smaller in scale, and all the ascending and descending figures don't look so stretched out. The proportions of each shape are more pleasant.</p>
      <p>Anyone designing non-lining figures who thinks, "Just change the 3 to align with the lowercase x-height and descender height" might also take some time to actually <em>look</em> at the results. It's often not so simple.</p>
      <p>Of course the other thing going on with Utopia, I think, is that it's a sort of transitional-modern, and non-lining figures just don't always work as well with such designs. I use Utopia Std for a newsletter I make, and I think the lining figures work better -- so as much as I love Utopia, I still am hesitant to use its non-lining figures.</p>
      <p>Probably this is why such typefaces -- used so often for magazines and such -- often have more diminutive lining figures or some hybrid. There is less tradition with these more modern styles, and they often benefit from more experimental approaches, at least for type designers with good eyes who are willing to look and think about it.</p>
