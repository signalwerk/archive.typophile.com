    html: |-
      <p>I am guessing the process was this. First a decision to shorten the ascenders and descenders. Second, seeing that the terminals on the 6 and 9 would get crowded with the heavy strokes of the eye of the 6 and 9. Hence the idea of using a pointed terminal to reduce crowding. </p>
      <p>However, in the 235 you have the ball terminals opposite a thin part, so they don't crowd so much, meaning put too much weight together. And an important part of the 'look' of Utopia comes from the ball terminals on the a and c. The ball terminals on the 235 echo and reinforce this, particularly on text figures, which will go with the lower case. Also if you change 235 you probably have to change them on the lining figures, and further lose harmony with the face. </p>
      <p>Hence this compromise to achieve the goal of making the text figures more compact.</p>
    html_clean: |-
