      <p>This is great feedback. Several voices gives a far richer impression than one could. Phinney's blog is great example of thoughtful passion for a field without zealotry, and I'veenjoyed it for a while. The traditionalist view, in this case is important to me to understand.</p>
      <p>Anyone here who is inclinded to care knows that my most traditional fonts are pretty 'out there'; most are far past that. Nevertheless, I try to borrow legibilty and other tricks from the classical camp, so that the fonts can offer more utility than most display styles.</p>
      <p>In this case, I'm working on a postmodern tall rectangular face with just enough ornamentation to seem... retro? It's a gift for my wife. Line figures were boring, text figures seem to both read better and add to the plyfulness intended. So, I've arranged the letters into the traditional lining, then fiddled with it very slightly. The current arangement <em>seems</em> to be classical, except the 4 sits on the baseline.</p>
