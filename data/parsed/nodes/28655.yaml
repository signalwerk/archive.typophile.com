      <p>Linda-<br>
      In any artwork I do, I try not to discard a rule until I have a reason, and cant have that until I understand the rule. Looking at a display font, one could think, "oh, look, a display font with text figures, how interesting", or they could say, "hmmm, I wonder why the numbers are all crooked-like. How lame." I'd prefer the former, if that was the intention. !Exclamachine's agenda is to make bizarre fonts that are more typographer-friendly, so I'm attacking that from several angles.</p>
      <p>As far as the legibility, I will be doing a good bit of work on the weight, contrast and spacing. I will keep fidling with contours until I get a more pleasant 'carved' look. The above is pretty early on, with just the basic forms of the glyphs defined.</p>
