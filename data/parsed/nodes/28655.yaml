      <p>Most of what I read here makes sense to me. I have seen a lot of the exceptions to which people are referring. The ascending 5 can look pretty cool and -- more to the point -- quite normal in some typefaces. My own opinion is that the figures should be made to blend in pleasantly with the text, and that is much more tricky than just following rules. Really, a lot of non-lining figures look bad because the designer just "made the 4 descend" without considering how it harmonizes with text. (I've had my own trouble with this very thing, so I sympathize.) I also am always interested to see cases of "semi-lining" figures and other strange hybrids. They can be educational case-studies about what works and what doesn't.</p>
      <p>If you want to see an interesting real-world case, check out the changes in the non-lining figures between the original, Type 1 version of Utopia, and the figures in the OpenType version.</p>
