    <p>Hello Folks</p>
    <p>i've restarted the Règles:Zéro e-zine project.<br>
    this morning i quickly put a new page for last issues download here : <a href="http://www.regleszero.fr" title="http://www.regleszero.fr">http://www.regleszero.fr</a></p>
    <p>the dot com was down for a while, shoted in the back by advertisers :(</p>
    <p>The 3rd issue is on the way, and the theme will be generative artworks (processing, flash, vvvv, ...) and what they do with types and letter shapes.</p>
    <p>i'm also looking for contributors and present some fresh new alphabets, feel free to contact me  : shadeone(at)gmail(dot)com  if you have something to submit</p>
    <p>cheers</p>
    <p>---S</p>
