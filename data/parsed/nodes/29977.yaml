    <p>We always knew we’d resuscitate Typophile Books, we just didn’t know how or when. Well it has happened and just in time for the holidays! We realize that we need to dust off our keyboard and update it, but for now check out what is available to you.</p>
    <p><a href="http://typophile.com/books">http://typophile.com/books</a></p>
    <p>Topics include: Type Design, Type Design: History, Type Design: Lettering, Type Specimens, Typography, Graphic Design, Graphic Design: History, Information Design, Interaction and Web Design, Packaging Design, Publication Design, Advertising Design, Environmental Design, Illustration, Book Arts, Fine Arts, Industrial Design, Printing Arts, Printing History, Book History, and Critical Writing.</p>
