    html: |-
      <p>I agree that the text seem heavy, dark, and even a bit awkward. Maybe cosmos isn't so good for books. I wonder if the average reader would get distracted by the design of the typeface? </p>
      <p>The text box is OK although it seems like the top and bottom margins are nearly equal and the right margin could be a bit more generous. </p>
      <p>That grey bar at the top is sort of clunky. Really, you have 3 important elements on a page like this -- the text box, the header and the folio. You can work these 3 elements to make something quite nice. The grey bar is superfluous. As it is, I see something rather default, ie: folio goes in the centre at the bottom. You could try something else.</p>
      <p>As a guide book I imagine the other pages are a lot more complex and will require fine attention to the typographic details. Have you worked on the hardest pages of the book yet?</p>
      <p>I love climbing, mountaineering and wilderness guide books. Unfortunately they are almost all quite horrible to read. So please make a nice one!</p>
      <p>More on Cosmos: I looked again and I don't think its up for the task. Does it have small caps, and non-lining numerals?</p>
      <p>At the very least you've made me want to visit Kazalnica.</p>
