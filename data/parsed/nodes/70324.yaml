      <p>Hello, JanekZ!</p>
      <p>Be careful with consistency in managing the paragraphs. Use either indented paragraphs, or split all paragraphs with a line space. On your page you have three different paragraphs: indented, separated by a line space, and that final "Enjoy...", not indented and not separated.</p>
      <p>Also try centering the "Preface" and the folio on the text box, not on the page - it might look better.</p>
      <p>Otherwise the justification looks quite good. Try showing us a page spread.</p>
