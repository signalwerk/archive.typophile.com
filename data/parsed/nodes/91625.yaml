    <p>Hello,</p>
    <p>for a personal project I am in search of a high-quality serif font with a beautiful swash style and nice ligatures.</p>
    <p>One such font that I love is "Sauna", especially the swash italic style<br>
    <a href="http://www.myfonts.com/fonts/underware/sauna/swash-italic/" title="http://www.myfonts.com/fonts/underware/sauna/swash-italic/">http://www.myfonts.com/fonts/underware/sauna/swash-italic/</a></p>
    <p>Another font that I use to love is "Livory", with it's great shape and beautiful ligatures. <a href="http://www.hvdfonts.com/#76-Livory" title="http://www.hvdfonts.com/#76-Livory">http://www.hvdfonts.com/#76-Livory</a><br>
    Unfortunately it has no swash style :)</p>
    <p>So, what I am searching is a kind of hybrid version of  "Sauna swash" and "Livory",  a font which has a nice feminine vibrancy.</p>
    <p>Thanks.</p>
    <p>Kind regards,<br>
    Dennis</p>
