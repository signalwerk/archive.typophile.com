      <p>I put a full set of Swash Caps in <a href="https://www.fontfont.com/fonts/oneleigh/packages#45484" rel="nofollow">FF Oneleigh Pro</a>. There is also a swash “t” which will ligate with many other lower case characters, not just “c” and “s”. It’s very good value—six multi-featured OpenType fonts for $85.</p>
      <p>I’ve never considered it a sexualized design however, it’s just an oldstyle with somewhat traditional swashes. I see the flourishes as an extension of contrast with the roman, in mixed font settings. But perhaps roman is from Mars (the default of course) and italic from Venus, if you want to get cute or political.</p>
