    <p>Speaking of "<a href="/wiki/Elements%20of%20typographic%20style" class="freelinking" rel="nofollow">Elements</a>" ... <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Bringhurst</a> mentions in version 2.5 that <a href="/wiki/Oldrich%20Menhart" class="freelinking" rel="nofollow">Oldrich Menhart</a>'s "<a href="/wiki/Manuscript" class="freelinking" rel="nofollow">Manuscript</a>" has not yet been digitized and I agree it's a shame. Is there any certain reason? Is this a proprietory face or something?</p>
    <p>If it's up for grabs for digitization, where would I find printed samples? Can you pick me some up in Prague, Rich?</p>
  html_clean: |-
    <p>Speaking of "<a href="/wiki/Elements%20of%20typographic%20style" class="freelinking link-lost" rel="nofollow">Elements</a>" ... <a href="/wiki/Robert%20Bringhurst" class="freelinking link-lost" rel="nofollow">Bringhurst</a> mentions in version 2.5 that <a href="/wiki/Oldrich%20Menhart" class="freelinking link-lost" rel="nofollow">Oldrich Menhart</a>'s "<a href="/wiki/Manuscript" class="freelinking link-lost" rel="nofollow">Manuscript</a>" has not yet been digitized and I agree it's a shame. Is there any certain reason? Is this a proprietory face or something?</p>
    <p>If it's up for grabs for digitization, where would I find printed samples? Can you pick me some up in Prague, Rich?</p>
