    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Patricia Lillie</strong></p>
    <p>Along with producing popular shareware fonts in the 1990s, Patricia designed several dozen typefaces and picture fonts for foundries such as <a href="/wiki/Image%20Club" class="freelinking" rel="nofollow">Image Club</a>, <a href="/wiki/EyeWire" class="freelinking" rel="nofollow">EyeWire</a>, <a href="/wiki/T.26" class="freelinking" rel="nofollow">T.26</a>, and <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a>.</p>
