    <p>I don't know if there is a similar tradition out of europe ... at the first of december we open ”doors or windows” of an advent calendar until the 24.th of december. On the german type related blog ”Slanted" i offer one in this year, where i show a small amount of my collection of wrapping papers of oranges. Every day i'll add a new one. Perhaps someone is interested in regarding ...<br>
    <a href="http://www.slanted.de/node/1561" title="http://www.slanted.de/node/1561">http://www.slanted.de/node/1561</a></p>
