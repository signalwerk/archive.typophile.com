    date: 2007-12-05T15:00:00
    date_raw: 5 Dec 2007 — 3:00pm
    votes: null
    html: <p>Thanks Tiffany. I have a lot of them, but i stopped collecting because of not knowing where to store more big boxes with a lot of sheet of papers in it ;-) and I'm really no "good" collector – because i hate to press these papers. In my opinion they loose their souls. I love to touch the papers and to hear the rustling sound of the paper. But i collected them at stores around the corner while buying fruits. Sometimes i can't resist ... Here in Germany there is one really professional collector. His name is Dirik von Oetttingen and his collection is about 40.000 papers. There are a lot of very fine and very old papers, while mine are really common. He published a fine book now, where you can stare at old sicilian ornaments, and more ... it's written in german, but even if you aren't able to read german it's worth regarding. (http://www.amazon.de/Verhüllt-verführen-Die-Welt-Orange/dp/3930752476/ref=pd_bbs_sr_1?ie=UTF8&amp;s=books&amp;qid=1196890004&amp;sr=8-1)</p>
