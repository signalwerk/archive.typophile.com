    <p>Hello all,</p>
    <p>I'm a touch nervous about submitting this to the board; I've been lurking here for awhile and have been very impressed with the quality of stuff that shows up, but here it goes...</p>
    <p>I am a music student studying vocal performance/opera, but currently employed doing some basic design work as an intern at a pharma company.  One thing that I've seen in the level of performing that I do is a lack of design consideration/awareness in promotional materials for small, less-funded groups or individual performers (including web, print, resumes, etc.).  I have been toying with the idea of starting some type of design business/cooperative to provide some low-cost, coherent design for these types of people to try and give them a better chance to launch/improve their careers.  Mostly, it would probably be just me (for the time anyhow) working in a freelance way, but eventually, I would like to get some other people collaborating.</p>
    <p>About the logo: I was aiming towards something that was a little more friendly and warm that would be welcoming to people who don't necessarily know a lot about design.  The elevated red box came after deciding (at least for the moment) on the name "updraft" for the organization, and provided a bit of motion to help tie in the name.  It's still a work in progress, but I'd appreciate any comments to help direct my work.  Thanks!</p>
