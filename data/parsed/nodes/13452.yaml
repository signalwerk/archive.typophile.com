      <p>I don't mind the concept as much as formlos, but I have a few comments:</p>
      <p>1) The orange on blue combination is creating a vibration that's driving my eyes nuts. They either need to be further apart in value (degree of black/darkness) or not <a href="http://www.cyber-prof.com/mdia1194/Lesson%203/lesson3-color-wheel.htm" rel="nofollow">complimentary opposites</a>. The effect in print could be even worse. </p>
      <p>2) The grid of sqares is not an organized grid. The rows should align, otherwise it'll look sloppy. The colors make the misalignment harder to see and therefore seem more accidental. I assume it is.</p>
      <p>3) The mark and the type don't feel integrated enough to me (though, I like the typeface and they aren't at odds with each other). Part of this may be the 3 colors in the mark vs. the black in the type. Your logo is 4 colors. Do you really want to pay for 4-color jobs every time your logo is involved? Why not narrow down to two? What about blue and red? The box could be blue and the type and jumping box could be red. It'll also make a conceptual connection. Black and one other color will keep most of your jobs down to 2-color.</p>
      <p>Fundamentally, it's all about having a clean concept. Does 'updraft' refer to the (intended) cooperative nature of Updraft itself or the effect on the client using Updraft? Right now, the mark feels more like the latter, because the uplifted square is visually, tonally, and spatially different than the others.</p>
      <p>That nicely curling 'f' in the name might be a nice visual element to play with. It reminds me of an upwardly curling draft/curl of steam.</p>
      <p>Hope this helps.</p>
