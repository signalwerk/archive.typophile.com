    html: <p>As I understand it type design in Thailand is undergoing a bit of a slump.  <br> <br>K. Punlop seems to be the main commercial font vendor, and Pongsathorn Sraouthai leads certain Open Source efforts. As I understand it neither vendor is actively making OpenType Thai fonts. I think one of the official Thai Linux implementations uses fonts designed outside of Thailand, by Yannis Haralambous (I could be wrong). <br> <br>Most of the Thai fonts Microsoft ships were acquired from a company called Unity Progress which has gone out of business.  <br> <br>Cheers, Si</p>
