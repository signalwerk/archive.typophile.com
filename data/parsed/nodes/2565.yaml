    html: <p>Jesus and Mary. So I figured out how to add my own custom embedding range for the Thai characters in the PUA. Thought I was on the home stretch. Had already opened the champagne even. But when I embed (choosing Basic Latin, Thai, &amp; my custom PUA) I still get my jacked up glyphs.  <br> <br>So...until I embed, I assume Windows is handle glyph processing. I.e., Windows is controlling which glyphs appear for which character code. At that point, in the right contexts, 0xE9 is being represented by any of u+0E49, u+F706, u+F70B, or u+F714. [based on certain APIs, correct?]  <br> <br><img src="http://www.typophile.com/forums/messages/4101/23683.gif" alt=""> <br> <br>Once I embed however, it seems that Windows glyph processing is beaten down by Flash's big clumsy stick. Even though my PUA glyphs are [supposedly] embedded, they're no longer being called. Notice below that (1) the first cluster's tone mark is too high, (2) is perfect, (3)vowel collides with the ascender, &amp; (4) well, the consonant should be subbstituted so you can see the vowel below. <br> <br><img src="http://www.typophile.com/forums/messages/4101/23684.gif" alt=""> <br> <br>I'm working under the impression - correct me if I'm way off base - that even though Flash is somewhat Unicode savvy, it works with the codepage of your OS. So, theoretically, if I localize my machine (XP Pro) for Thai, Flash shouldn't have problems with the Thai codepage. But that's not what I'm seeing. I'm getting the same output whether I'm localized for English, Thai, or a good ol' southern drawl.  <br> <br>Is there a way around this? I'm beginning to feel even dumber than usual. I'm starting to dream about this for Chrissakes.</p>
