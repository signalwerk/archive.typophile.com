    html: "<p>OK, so I think I figured out what the problem is—now it's just a matter of developing some sort of cheap work around. Hopefully one that's not too clumsy. If anyone's listening to me talk to myself, feel free to chime in with your opinion. <br> <br><b>The problem:</b> <br> <br>(1) Flash only enjoys working with the native codepage of the OS that it's working with. So Flash on my US version of Windows XP spits out the text formatting from the the 874 Thai codepage. So that: as I'm typing, Windows handles the text processing &amp; all is good, but when I'm done Flash takes over and fu©ks it all up. <br> <br>(2) It's possible to call up Unicode points using variables in dynamic text fields—which seems like it would sort everything out. But it's [seemingly] impossible to embed the necessary characters from the PUA—so this too is useless. Well, since the end user would have to have the font installed to see things correctly. <br> <br>(3) It's also possible to use external UTF8 encoded files (a la Notepad) to generate Unicode characters in Flash, but the same embedding problems apply. I don't know the Actionscripting for that anyway :-/ <br> <br><b>The solution:</b> <br> <br>(1) Theoretically, users running Windows Thai edition won't have any problem using the font as it conforms to the 874 codepage. So in this case no fix is necessary.  <br> <br>[<i>downfall:</i> I still need to test this on Windows Thai] <br> <br>(2) It seems, for 2000 and XP users, that a font could be built using GPOS and GSUB to do the vowel positioning and/or substitution. I.e., the vowels could be removed from the PUA,placed in points in the 1252 codepage, and that way they could be embedded in Flash.  <br> <br>[<i>downfall:</i> apps &amp; OSs that don't like GPOS &amp; GSUB will be screwed] <br> <br>(3) Or I could build a propietary keyboard driver, and map the variously positioned vowels (once again, placed in the 1252 page) to different key combinations.  <br> <br>[<i>downfall:</i> non-standard and clumsy text imput method] <br> <br>Argh.</p>"
