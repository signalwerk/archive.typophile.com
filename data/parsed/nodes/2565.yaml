  html: "<p>Maybe there's some Flash guru out there who can sort this out for me. I'm trying to finish putting together a Thai display face, and I'm running into massive problems with Flash. Here's the deal: <br> <br>As I'm typing along, all is happy &amp; good. Vowels sit where they should, and all is peaceful in the world. <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/23271.gif\" alt=\"\"> <br> <br>As soon as I'm done typing &amp; select the text frame, everything turns to chaos &amp; damnation. I <i>think</i> what's happening is this: the vowels which showed up as I was typing are in the Unicode PUA, and they're being substituted for the vowels in the Thai range. E.g., U+706 <i>should</i> be there, but instead U+0E49 is. <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/23272.gif\" alt=\"\"> <br> <br>Also, when I turn on aliasing, all the diacritics completely disappear. Huh? <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/23273.gif\" alt=\"\"> <br> <br>Anyone ever encountered this sort of thing? Is there anyway around it? Does Flash just not work with the 874 codepage? Everything works smashingly in Microsoft Word, etc. Sorry for the huge attachments.</p>"
  html_clean: "<p>Maybe there's some Flash guru out there who can sort this out for me. I'm trying to finish putting together a Thai display face, and I'm running into massive problems with Flash. Here's the deal: <br> <br>As I'm typing along, all is happy &amp; good. Vowels sit where they should, and all is peaceful in the world. <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/23271.gif\" alt=\"\"> <br> <br>As soon as I'm done typing &amp; select the text frame, everything turns to chaos &amp; damnation. I <i>think</i> what's happening is this: the vowels which showed up as I was typing are in the Unicode PUA, and they're being substituted for the vowels in the Thai range. E.g., U+706 <i>should</i> be there, but instead U+0E49 is. <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/23272.gif\" alt=\"\"> <br> <br>Also, when I turn on aliasing, all the diacritics completely disappear. Huh? <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/23273.gif\" alt=\"\"> <br> <br>Anyone ever encountered this sort of thing? Is there anyway around it? Does Flash just not work with the 874 codepage? Everything works smashingly in Microsoft Word, etc. Sorry for the huge attachments.</p>"
