    html: <p>&gt;type design in Thailand is undergoing a bit of a slump <br> <br>That's probably an understatement :-/ I know a handful of people from Thailand, but none of them are type designers. Artists &amp; farmers mostly. One of them lives upstairs and has a localized Thai OS, but he's in Chiang Mai until the end of the month. So testing isn't a huge problem - just a waiting issue. <br> <br>In the meantime, I've figured out how to make the diacritics and vowels sit in the right places by using ActionScript to import UTF-8 encoded .txt files. But I still can't alias and/or embed the fonts without problems. <br> <br>I've thrown together <a href="http://www.eightyproof.com/image/bitthai/none.gif" target="_blank"> a file comparing several fonts</a> - and I'm led to believe it's an issue with Flash and not with the fonts. I've got Unity Progress' Dillenia, PSL's Chamnarn, Norasi (which is one of Yannis Haralambous' fonts), Tahoma, and my Daasaang.  <br> <br>(1) <a href="http://www.eightyproofpress.com/image/bitthai/alias.gif" target="_blank"> aliasing seems to work fine now</a>; (2) <a href="http://www.eightyproofpress.com/image/bitthai/embed.gif" target="_blank"> embedding causes the diacritics to shift</a>; (3) <a href="http://www.eightyproofpress.com/image/bitthai/alias_embed.gif" target="_blank"> aliasing <i>and</i> embedding causes the diacritics to disappear</a>. Problem 2 might be caused by Flash only embedding the Unicode points within the Thai range - because the 874 codepage calls up the correctly placed diacritics from the PUA. <br> <br>I suppose I just need to find a Flash guru to sort me out. In the meantime though I will try to contact some of the folks you've suggested Hrant. Thanks again.</p>
