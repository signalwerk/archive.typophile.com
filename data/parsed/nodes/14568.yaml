    html: |-
      <p>Thanks to all for the feedback.  I knew I would get some quality critique here.  I must confess, this is a rushed/beta version.  Sorry to heap a half-baked site on you all!</p>
      <p>I’m glad everyone appreciates the simplicity.  I strive for it.</p>
      <p>None of my designs are available for retail licensing (yet).  There will certainly be links or disclaimers soon.  I’m keeping the Portfolio section slim for now... just a taste of my design sensibilities/capabilities.</p>
      <p>The opening image will be randomly selected from snapshots of my fonts in use or my custom lettering work (or even doodles).  A bit of entertainment/stickiness value not unlike what I have set up on my other site... <a href="http://silasdilworth.com" title="http://silasdilworth.com">http://silasdilworth.com</a></p>
      <p>Yes, the opening image is of my business card mockup.  Is the D-shaped die-cut overkill?  I haven’t printed them yet because I’ll be relocating next month.</p>
      <p>Regarding the navigation oversights and inconsistencies, I’m certainly taking this baby back to the drawing board with all that was noted above.  Thanks for the attention to these details.</p>
    html_clean: |-
