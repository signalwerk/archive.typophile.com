    html: |-
      <p>The clean black and white design is striking, and the typefaces strong. I think your home screen is visually significantly stronger than the others, because of the visual contrast of the two cards. They others are a bit grey and weak compared to the dramatic opening screen.  </p>
      <p>Antiphrasis’ idea is good for the services screen. Also on the portfolio screens, think about balancing the showings vertically, so there are blacker weights mixed through the showing. Look at FontBureau’s showings for examples. You might try adding a single large character on the right also, to see if that helps or hurts. </p>
      <p>Also it would help if you would have navigation to page through your portfolio without going back to the home screen. See Jim Parkinson’s site for an example. Incidentally, both Parkinson’s and FontBureau’s sites are excellent models of well-designed type sites, in my opinion.</p>
    html_clean: |-
