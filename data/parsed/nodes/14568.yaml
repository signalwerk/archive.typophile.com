    html: |-
      <p>Silas,</p>
      <p> The site is beautifully exectuded. I love the restrained, understated design. The emblem is brilliant. Love the di cut on the card. Is that standard biz card dimensions or wider?</p>
      <p>A few notes about the User Experience (UX):</p>
      <p>1. Navigation Design: it would be prefereably to, however subtly, visually differentiate the navigation label/link (“portfolio” etc.) to reflect the current location within the IA (info architecture).</p>
      <p>2. The “email away” link on the about page may confuse users. Most would be expecting a mailto: link, rather than a link to the contact section. Either change the wording, or make it an actual mailto: link.</p>
      <p>3. Contact form: it’s unclear that all fields are required. Also it would be smart to use a script to clear the field when the user clicks on it, thus saving them the step of having to select the text b4 entering their data. For that matter, having the cursor be in the name field on page load is also a good idea.</p>
      <p>4. Typo nitpick: do you need the colon after section headers (“About:”)?</p>
      <p>Nice work.</p>
      <p> -t</p>
