      <p>The most obvious problem (which I'm surprised nobody has pointed out yet) is that there's no way this will be read as "Cream5". In fact there seems no logical/predictable way to read that "5".</p>
      <p>I know it's tempting to "show off" by splicing a numeral into a word (even if some people would accuse you of reviving a 90s motif) but if you want it to actually work one direct way would be to make the end flourish form the "5".</p>
      <p>hhp</p>
