    html: |-
      <p>It seems that's a 32-bit version and won't work on 64-bit systems.<br>
      However, MS updated it around the time of Vista but they published the link for just the 32-bit version because the 64-bit version didn't have an installer. <a class="freelinking external" href="http://answers.microsoft.com/en-us/windows/forum/windows_7-files/32-bit-extensions-for-64-bit-windows-font/1904ca19-d99a-497f-b8b8-56b6341ccc49" rel="nofollow">See here for details</a>, plus there's a Dropbox link for 64-bit near the bottom of the page. It's a .dll file; you put it in “C:\Windows\System32\” folder, open command prompt as admin and type the following to activate it:</p>
      <p>%windir%\System32\regsvr32.exe %windir%\System32\TTFExtNT.dll</p>
