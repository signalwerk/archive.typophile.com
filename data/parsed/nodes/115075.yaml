  html: |-
    <p>Hi there,</p>
    <p>I would like to ask if someone has a recipe for exploring a content of OpenType font. OK, I know, that the Glyph Panel in InDesign is pretty comprehensive — I can filter the Small Caps, I can filter Oldstyle Figures, I can filter Ornaments, or even Ligatures , but I am looking for some way to get a summary like this:</p>
    <p>FontName.otf:<br>
    This font contains:<br>
    Extended Latin A &amp; B<br>
    Greek<br>
    Discretionary Ligatures<br>
    Oldstyle Figures<br>
    Small Caps<br>
    …</p>
    <p>Thank you.</p>
