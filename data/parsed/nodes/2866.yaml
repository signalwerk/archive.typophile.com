    html: <p>Thanks, Alyce -- a detail of the image you used is the startup image on my computer. I'm very surprised to hear, however, that the Tenniel illustrations aren't in the public domain. Tenniel's been dead for nearly 100 years! Oh well, don't tell Bettmann I scanned it out of my <i>Annotated Alice</i>. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
