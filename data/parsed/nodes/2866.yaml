    html: <p>Cheshire, Public domain? Probably. However, we had the art budget and a reputable source so we spent the money. The price was cheap to protect ourselves and the client.  <br> <br>Have you seen the Pennyroyal editions of Alice? They were designed and illustrated by Barry Moser. Illustrations, page design and typography are all beautiful. Check out his Richard Nixon-inspired Humpty Dumpty. <br> <br><a href="http://www.nal.vam.ac.uk/exhibits/artofthebook/alice.html" target="_blank">http://www.nal.vam.ac.uk/exhibits/artofthebook/alice.html</a> <br><a href="http://www.moser-pennyroyal.com/alice/aliceindex.html" target="_blank">http://www.moser-pennyroyal.com/alice/aliceindex.html</a></p>
