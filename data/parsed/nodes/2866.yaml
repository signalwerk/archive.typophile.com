    html: "<p>Cheshire, BTW, I like your cheshire cat on your Web site. As an Alyce (pronounced Alice, just spelled with a y) and a cat lover it ocurred to me to use the cheshire cat in my own stationery, etc. Your tie in is obviously much closer. Several years ago I bought one-time usage rights from Bettmann Archives for the original Tenniel illustration, for a Friskies magazine project. Here's the image:  <br> <br><a href=\"http://www.victorianweb.org/graphics/tenniel/alice/6.4.html\" target=\"_blank\">http://www.victorianweb.org/graphics/tenniel/alice/6.4.html</a></p>"
