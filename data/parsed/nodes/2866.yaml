    html: <p>Mark,  I'll never watch a period film the same way again. I found myself wondering about the Disney film "Newsies," since newspapers seem to be a stumbling block for many of the films you cited.  <br> <br>Living in Los Angeles we are able to recognize many film locations. Downtown, in particular gets used a lot. 7th Street was recently dressed to look like New York for the next Spiderman movie. Fake signage was up for about a week � our Metro station even had a New York subway sign added. I wonder how many tourists were totally confused.  <br> <br></p>
