  html: |-
    <p>Downturn was most directly inspired by letters painted on the wall of an old medical warehouse in Washington, D.C.. Other inspirations include lettering on manhole covers, metal signs and machinery in New York and DC.</p>
    <p>Its quirky letterforms and deliberately uneven color reflect the typographic naiveté of signpainters and engineers more interested in impact than consistency. (That’s not a general dig at signpainters, just the typographically naive ones).</p>
    <p>Chunky, in-your-face letters make Downturn appropriate for posters, packaging, headlines and other places you need a big impact.</p>
    <p><a href="http://new.myfonts.com/fonts/dunwich/downturn/" rel="nofollow">Downturn is available for licensing at MyFonts—$25 per weight, $90 for the family.</a> Web embedding licenses will be available at a later date.</p>
    <p><a href="http://dunwichtype.com/pdfs/Downturn_Specimen.pdf" rel="nofollow">Click here to download a PDF specimen.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Downturn_PosterTP_6412.jpg"></div><p></p>
