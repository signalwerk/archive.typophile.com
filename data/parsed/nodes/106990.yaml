    html: |-
      <p>One approach is to use a font that mimics the type of handwriting that was taught in schools -- but is now being dropped because of the attitude that in the age of keyboarding "nobody writes by hand!" Other options are to use a font that avoids too much variation in the flow of the lower case letters. Webfonts should be available for most of the fonts listed below.<br>
      So you might try:<br>
      * Tim Ryan's School Script from Monotype<br>
      <a href="http://www.myfonts.com/fonts/mti/school-script/" title="http://www.myfonts.com/fonts/mti/school-script/">http://www.myfonts.com/fonts/mti/school-script/</a><br>
      * Monoline Script from Monotype -- very regular appearance<br>
      <a href="http://www.myfonts.com/fonts/mti/monoline-script-mt/" title="http://www.myfonts.com/fonts/mti/monoline-script-mt/">http://www.myfonts.com/fonts/mti/monoline-script-mt/</a><br>
      * Jack Edmondson's Wisdom Script and Yellow Design Studio's variation as<br>
      Thirsty Script -- use the light weight<br>
      <a href="http://www.myfonts.com/fonts/yellow-design/thirsty-script/" title="http://www.myfonts.com/fonts/yellow-design/thirsty-script/">http://www.myfonts.com/fonts/yellow-design/thirsty-script/</a><br>
      *Martin Wait's William Lucas<br>
      <a href="http://www.fonts.com/font/itc/williamlucas" title="http://www.fonts.com/font/itc/williamlucas">http://www.fonts.com/font/itc/williamlucas</a><br>
      * Robert Hunter Middleton's Coronet<br>
      <a href="http://www.myfonts.com/search/coronet/fonts/" title="http://www.myfonts.com/search/coronet/fonts/">http://www.myfonts.com/search/coronet/fonts/</a><br>
      Don</p>
