  html: |-
    <p>Been tasked with designing an online writing space using a handwritten-looking font. Most seem pretty terrible for the task of writing/reading 3-4 paragraphs, but I'd still like to give it a good shot.</p>
    <p>Any suggestions for a web font that looks handwritten/scripty and remains somewhat usable for medium-form writing and reading?</p>
