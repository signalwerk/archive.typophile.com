      <p>Adam,</p>
      <p>Thanks for your detailed reply -- this does clarify things quite a bit and I suspect I now understand where the problem lies. I've been thinking about the cross-feature lookup calls in the same way as I think of procedure calls which is apparently not a good metaphor. Your response makes it clear that I'll simply have to duplicate the lookups in each feature since what I was trying to do was essentially alter the order in which lookup C, D, and E were applied in the different features.</p>
      <p>André</p>
