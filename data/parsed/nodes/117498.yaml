      <p>Interesting idea, a swirly font that combines a swirl with a ball terminal at one end and a plain swirl at the other end. Here are two fonts that give you your choice of these two effects. Janda Hide And Seek <a href="http://www.myfonts.com/fonts/kimberly-geswein/janda-hide-and-seek/" title="http://www.myfonts.com/fonts/kimberly-geswein/janda-hide-and-seek/">http://www.myfonts.com/fonts/kimberly-geswein/janda-hide-and-seek/</a> and Emploi <a href="http://www.myfonts.com/fonts/paratype/emploi/" title="http://www.myfonts.com/fonts/paratype/emploi/">http://www.myfonts.com/fonts/paratype/emploi/</a> Emploi might be more to your taste than Janda Hide And Seek. If you can tinker with fonts Emploi could be edited to give it balls where you want them.<br>
      Don</p>
