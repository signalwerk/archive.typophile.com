    <p>Hello everybody </p>
    <p>Here I am again with 2 posters for Amnesty international campaigns.<br>
    The one is about "controling arms" around the world, inspired from<br>
    a song of Toto ("rains down in Africa").<br>
    The other poster (mistreat - Miss Treat) is made<br>
    for the Violence Against Women campaign. </p>
    <p>Any comments?</p>
