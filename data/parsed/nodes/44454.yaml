    html: |-
      <p>The way composites work in FL, a composite glyph cannot be a component. In other words, a component can only be one step removed from the original. So, when you use Generate Glyphs to make your ffi by telling FL to combine f and fi, FL sees that fi contains two components, it copies them separately to the new glyph rather than treating them together as a single component in the new glyph. In fact, if you try to do an end-run around this behavior by, say, deleting the dotlessi component and replacing the f with fi (using the Component Properties inspector), you will see that neither fi or any other composite glyphs are available.</p>
      <p>Slant and rotate are not supported, but it is possible to flip horizontal, flip vertical, and rotate 180° by editing the scale values in the Component Properties inspector panel:</p>
      <p>To flip horizontal, enter -100% for the x scale value.<br>
      To flip vertical, enter -100% for the y scale value.<br>
      To rotate 180°, enter -100% for both x and y scale values.</p>
      <p>I stumbled onto this recently when I imported a FOG file using Foglamp. The FOG file contained some components that were rotated 180°. Note that you need to correct the path direction after decomposing if you flip horizontal or vertical.</p>
