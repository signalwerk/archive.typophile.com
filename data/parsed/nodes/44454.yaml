      <p>OK, so we know this extremely basic, extremely time-saving, extremely easy-to-program session save is something we want.</p>
      <p>Now back to something more basic. Like the simple matter of opening a metrics window. Why is that I can use the shortcut shift-alt-m to open a metrics window if the font window is active but not if the a glyph window is active (that glyph window being, usually, the place from which I will want to open a metrics window in the first place? </p>
      <p>Funnily enough, if I use customize and assign 'open metrics window' to control-K, as in Fog, the function behaves differently, more sensibly, and does work from the glyph window.</p>
      <p>OK, enough fooling around. I now have several open windows I wish to close quickly. </p>
      <p>On the Mac I can do this quickly with command-W. On many, many sensible Windows programs, including most browsers, I can do this with control-W. I can do this with my hands on the home keys quickly and efficiently (because I have remapped useless caps-lock to either useful command or control depending on platform).</p>
      <p>I know I can do it with control-f4 in Windows but this is just too annoying. Does Fontlab allow us to assign a key for the 'close window' command? Not that I can see. Is there any other way around this?</p>
