      <p>Mark, to be honest, that's how I recalled it - - OK, so we have a bug when it isn't working. At least we know that.</p>
      <p>Here's an interesting bit of behaviour - - don't know whether it's good or not -- what do others think? </p>
      <p>USING COMPOSITES: I make an fi lig out of f and dotlessi. I now make an ffi lig out of fi and what I'll call 'short f'. If it were Fontographer, I'm reasonably sure that the fi constituent of ffi would be seen as a single unit. Not so in Fontlab. The individual constituents -- f and i -- can be moved separately, in spite of their having been called as composites from fi. </p>
      <p>Needless to say, it's intended, as a just-before-final-production step, to decompose all the composites, and then, fog-style, remove overlap -- assuming that fontlab does that properly.</p>
      <p>I think on balance, I dislike this behaviour. If I decided to tighten the spacing between f and i in the fi lig, I think I would want that to be reflected in ffi, and it doesn't look like it would happen. I think it would happen that way in Fog but I haven't yet checked.</p>
      <p>By the way, my old Fog 5 beta from 1996 seems to work in Vista - - with Win98 compatibility selected or something like that. STILL the only way to get 3200% zoom in a font editor! Studio did 800% and Flab still only does 400 ? ? ? I know there's a kludge around it, but I have heard horror stories in connexion with that particular kludge.</p>
      <p>Let's just pause for a moment to drool over Fog's ability not just to scale but to rotate and slant composites - - which can sometimes be a very graceful and rapid way to turn a comma into persuasive left &amp; right quotation marks. </p>
      <p>Could we see some of that, soon, . . . . . . ?</p>
