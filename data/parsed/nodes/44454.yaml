      <p>I think these would really be nice additions. Funny thing is that this actually implies two options per each behavior:</p>
      <p>As regards the Glyph Window behavior, when you move a node, handle, anchor, component in one master will move it in other masters too. There,<br>
      (1) move to exactly the coordinates it receives in the current master (absolute)<br>
      (2) move at the same dx/dy at which it was moved in the current master (relative)*</p>
      <p>Similar in the Metrics/Kerning Window behavior, when adjusting sidebearings or kerning in one master, adjust them in the other masters too. There,<br>
      (1) change to exactly the same value(s) defined for the current master (absolute)<br>
      (2) change at the same difference as for the current master (relative)*</p>
      <p>* If a node has been moved 10 down and 20 left in one master, it will be moved 10 down and 20 left in all other masters.</p>
      <p>So, this were <em>two</em> additional options. Maybe three radio buttons (mutually exclusive) right in the top part of the Masters panel.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Apply adjustments to:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;() current master only<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;() all masters absolute<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;() all masters relative<br>
      So it shows which master you are currently in, which masters are affected by your operations, and how.<br>
      I could even think of one more thing, to do the change only in a specific other master, so we end up with this:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Apply adjustments to:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;() current master only<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;() [Wt1 Wd0] absolute<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;() [Wt1 Wd0] relative<br>
      where [Wt1 Wd0] represents a popup list from which one can select either "all" or the name of a specific master.&nbsp;&nbsp;;-)</p>
