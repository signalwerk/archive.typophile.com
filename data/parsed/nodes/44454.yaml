      <p>Thomas, I agree that the editor can do what it likes with composites -- just like Fog always did. But just what _is_ the latest scoop on composites in PS fonts? I just remember the conventional wisdom that composites, though at one time used in Adobe fonts, are not recommended anymore.</p>
      <p>Back to David. Most people with a product go about improving it somehow over the years. It is really kind of spooky the way T1/CFF is changing so very little. Maybe it's time for a new look at what type could be doing? Why is Adobe letting the technology remain so static? Aesthetically, we're on total overload - - so maybe it's time to look at some hard technology issues? </p>
      <p>Speaking of slow progress, it is a year since we looked at Fontlab 5.01; now we're at 5.04. When is this company going to address simple focus issues? </p>
      <p>FOR EXAMPLE: </p>
      <p>I am in the glyph window. I am sequentially evaluating each glyph in a simple one-axis, two-master font.</p>
      <p>I start with !. I use the slider to go from -500 to +1500, looking for anomalies and problems. </p>
      <p>OK. I looked at that glyph, Now I want to go the next glyph. </p>
      <p>Can I use the control-right bracket key to advance to the next glyph?  ?  ? </p>
      <p>NO ! </p>
      <p>That's because focus is on the MM slider. </p>
      <p>I have to click on to the glyph window, then press control-right bracket, and then move the mouse back over to the wretched MM slider again.</p>
      <p>WHAT ? ? ? ?</p>
      <p>Why doesn't control-right bracket (advance to next character) work, no matter where mny focus is ? </p>
      <p>Why hasn't this bug YET been fixed? </p>
      <p>Thomas, earlier I had somewhat clumsily asked the question,</p>
      <p>"I presume this is because such composites [slanted, rotated] are not valid type 1 instructions. Are they a part of CFF?</p>
      <p>What other things are there in CFF that are possible but that font editors are not letting us do ? ? ? ?"</p>
      <p>Are you indirectly answering the question and saying that there are no new composite features we don't know about in CFF? </p>
      <p>Also, not to open a can of worms, and at the risk of exposing my ignorance even further, but I remember, when I was starting out, that there was quite a bit of talk about subroutines; you never seem to hear about them now. Anything worth investigating there? </p>
      <p>Back to Fontlab bugs. Using control-right-bracket, above ascii 128, the glyph window and the metrics window seem to use different encoding - - - still. </p>
      <p>Am I the only one to find this an embarrassing bug?</p>
