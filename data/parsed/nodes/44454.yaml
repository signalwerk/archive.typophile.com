      <p>Tim, I like that use of the make master feature - - very clever! </p>
      <p>But still - - we need that button. I decide to lengthen the right serif of f by ten units. That needs to happen in the other 7 masters . . . immediately. One keystroke -- not more -- needs to enable the feature.</p>
      <p>Speaking of peeves - - what is the so-called 'workspace' feature?</p>
      <p>Every time I ask Fontlab for a session saver feature someone points out to me that FL already has the great save workspace feature. Can anyone tell me what this does and why it's great? I have exported a hundred workspaces without ever once succeeding in saving my 'session'. Everyone must know what a session saving feature is -- as in most browsers today - - Your session is the open files, windows, toolbars - - everything you're working on before you press the session-save button. Session save restores that with one button -- or less if program startup invokes session-save.</p>
      <p>This is PARTICULARLY desirable for the complex file/window setups we are likely to have in font work.</p>
      <p>So what is save workspace and how does that answer this problem?</p>
