      <p>I am not sure whether you are aware of the Make Master function. Although it is not nearly as convenient as the proposed feature would be it can be used as some sort of workaround. If I make changes to the regular and want to transfer them to the bold, this is what I do:</p>
      <p>1<br>
      Before I make the changes, I define a new axis. You could call it "old-new" or "design" but typically I can't be bothered to rename it and leave the default name "width" even though it is not appropriate.</p>
      <p>2<br>
      I then make the changes to the regular, at wt0 wd0 (the new regular).</p>
      <p>3<br>
      I use the Make Master function in Tools &gt; Action on the master wt1 wd0 (the new bold), which transfers the change to the bold.</p>
      <p>4<br>
      Then I can remove the wd axis. This would typically be be at wd0 but if you want the changes to the bold either stronger or weaker than in the regular you can choose any other position. But then you need to  replace wt0 wd1 (the old regular) with wt0 wd0 (the new regular) first.</p>
      <p>This brings me to another refinement of the feature described above: you could let the user specify that the changes should be transferred to the other master(s) 1:1, or weakened, or emphasized.</p>
      <p>I was thinking about writing a macro that transfers the difference between the mask and the normal outline to the other masters, which would save adding the axis and, as I believe, reflect the way most designers work with the mask as the "old" version and the normal outline as the "current".</p>
