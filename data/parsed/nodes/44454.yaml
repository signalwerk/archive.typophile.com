      <p>Two things I would change:</p>
      <p>1. Tools &gt; Action - The fact that "Action" is singular instead of plural hides the fact that it can do multiple things. When I was just beginning with the interface, this really frustrated me. I knew there was a whole list of things I could do, but I kept forgetting where the list was located.</p>
