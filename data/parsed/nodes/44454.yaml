    <p>Pursuant to the old thread on FontLab Interface Peeves, <a href="http://typophile.com/node/32709" title="http://typophile.com/node/32709">http://typophile.com/node/32709</a>, I'd like to take up this issue again. In response to that thread, we got some MW improvements in 5.03 which I am trying to get my head around, having been away from font design for the past year.</p>
    <p>I would like to focus on one of the old suggestions, which is for a mode that would cause whatever you are doing to be done on all masters (when you press a key to activate this mode). So, for example, you're in a 4-master font. You move a point and some handles - - everything that you're doing happens in the other three masters. Or you're in the metrics window. You've noticed that you stupidly have sidebearing values of 5 and 5 for the = glyph. You need at least 40, you now realize. Why should you have to enter those values 4 times? Or do that cursor-key movement four times? </p>
    <p>Obviously, it's dangerous to work like this if you don't know what you're doing, but then everything about working with multiple masters requires a lot of concentration. So what? So you concentrate.</p>
  html_clean: |-
    <p>Pursuant to the old thread on FontLab Interface Peeves, <a href="/node/32709/" title="http://typophile.com/node/32709">http://typophile.com/node/32709</a>, I'd like to take up this issue again. In response to that thread, we got some MW improvements in 5.03 which I am trying to get my head around, having been away from font design for the past year.</p>
    <p>I would like to focus on one of the old suggestions, which is for a mode that would cause whatever you are doing to be done on all masters (when you press a key to activate this mode). So, for example, you're in a 4-master font. You move a point and some handles - - everything that you're doing happens in the other three masters. Or you're in the metrics window. You've noticed that you stupidly have sidebearing values of 5 and 5 for the = glyph. You need at least 40, you now realize. Why should you have to enter those values 4 times? Or do that cursor-key movement four times? </p>
    <p>Obviously, it's dangerous to work like this if you don't know what you're doing, but then everything about working with multiple masters requires a lot of concentration. So what? So you concentrate.</p>
