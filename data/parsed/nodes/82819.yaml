    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Florentin2D_720x360_04_6250.png"></div><p></p>
    <p>Angular Old Style by Viktor Kharyk is usable as display font, for non-formal texts, especially poetry, for children books and virtual games about adventures, history, and pirates and includes some original ornament set. By stylistic it connects with Italian Renaissance,Czechian types of the first half of 20th century and cut technology.<br>
    Open Type (technical support by Constantine Golovchenko) has such Stylistic Sets:<br>
    ss01 changes numerals to lower case,<br>
    ss02 changes Cyrillic vowels on stressed vowels with acute,<br>
    ss03 changes грн. and  руб. on currency signs,<br>
    ss04 activates the Balkan alternates in italic.<br>
    Basic alphabets have also initial forms usable with init or swsh or from table Glyphs.<br>
    Special system helps to set Cyrillic stressed vowels from keyboard using vowel+%.<br>
    Type family includes 4 text fonts and 4 display ones and supports European Latin and European Cyrillic.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Florentin2D_720x360_01b_4740.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Florentin2D_720x360_06_3972.png"></div><p></p>
