    html: |-
      <p>To my knowledge there’s nothing like a universal minimum margin in modern book design, at least in a technical way. It mostly depends on the means you are going to use for printing, binding, etc. and what you consider would be comfortable for the reader. Find out how it is going to be printed and ask about limitations, if you can have bleeding, etc. If possible see examples, ask questions, make tests.</p>
      <p>If you like to define a harmonic margin structure look for known proportions, they can give you a good starting point: medieval, 3/4, there are many “formulas”... it would also be a good start to define the page, margins, and everything in picas and points - it will make things easier when defining line heights, typography and overall measures.<br>
      Also look for books in similar sizes, it will give you an idea of how the margins, type and space look and feel.</p>
      <p>What kind of book is it anyway, is it an illustrated/art book?</p>
      <p>Regards,</p>
