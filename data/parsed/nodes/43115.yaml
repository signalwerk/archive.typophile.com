    html: <p>My books, however bound, always have .75 to one inch left and right margins and never less. Hardbacks open fairly flat but paperback binding really chews up the inside margin space and the reader needs the extra relief. In my view, .25” inside gutter is totally wrong and you’re just asking for trouble.</p>
