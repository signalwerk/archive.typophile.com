    <p>Hi,</p>
    <p>I’m designing a book and I need some advice from designers who have experience with printing. I am particularly interested in getting recommendations on the size of the margins to avoid printing issues. </p>
    <p>Here are my specs:<br>
    Pages: 288 pages<br>
    Inside Margin: 0.5 inches<br>
    Outside: 0.25 inches<br>
    Top: 0.25 inches<br>
    Bottom: 0.5 inches</p>
    <p>In many of the books and websites I’ve read, it seems 0.5 inches is the minimum margin recommendation for all sides. However, when I look at my favorite design books, some of them cut it quite close with less than 0.25 inches margin. I like my book to have an outside margin of 0.25 inches. How do I make sure the printer doesn’t overtrim the document down beyond 0.25 inches?</p>
    <p>thanks in advance!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/43099" class="topic-previous" title="Go to previous forum topic">‹ Novell.com Redesign</a> <a href="/node/42996" class="topic-next" title="Go to next forum topic">Help re H&amp;FJ's Archer ›</a></div>
