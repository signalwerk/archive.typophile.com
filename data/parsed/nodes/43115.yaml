      <p>A good printer will compensate for creep (that is the loss of width of a books pages in the final trim, based upon paperthickness and location of pages in a section — excuse my poor english) by reducing the innermargins. So your outer margin can be safe and steady…<br>
      But I concurr with other respondents here: a quarter of an inch is dangerously little. Especially when you take into account the common practice of libraries to rebind (in hardcover) a lot of books, which requires an extra trim.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
