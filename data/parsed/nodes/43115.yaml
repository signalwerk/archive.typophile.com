      <p>I’m afraid that if I picked up a book with a quarter inch outside margin I would put it down again immediately as an abomination. Add to that that the inner margin is double the outer margin, whereas it should be the other way round if anything, and I think you have a recipe for disaster.</p>
      <p>Just my two cents.</p>
