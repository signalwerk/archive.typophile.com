      <p>The only place I have seen quarter inch margins is in paper backs (the cheapies) where they are trying to cram as much into the page as possible. Less than a quarter and bad trimming/folding can cut text off. A quarter inch is 1.5 picas ... I like to see the text indent that wide, let alone the margin.</p>
      <p>&gt; How do I make sure the printer doesn’t overtrim the document down beyond 0.25 inches?</p>
      <p>Pray. A lot.</p>
