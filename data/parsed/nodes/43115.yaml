      <p><cite>I’m designing a book and I need some advice from designers who have experience with printing.</cite></p>
      <p>You can’t be a book desiner if you don’t understand printing. You can be a <cite>stylist</cite> like the people who put ever-larger tailfins on late 1950s automobiles.</p>
      <p>If it is a sheet-fed press, the fingers need some gripping room. Call the printer &amp; ask; just which margin &amp; how much depends on the press &amp; workflow. But of course, printers can print full bleeds on 4 sides (3, really), so you don’t absolutely have to have margins at all. Usually, full bleed costs more, if for an entire book.</p>
      <p><cite>when I look at my favorite design books, some of them cut it quite close with less than 0.25 inches margin. I like my book to have an outside margin of 0.25 inches,</cite></p>
      <p>Well, you’ll have a pleased audience of at least one. Probably a few more, since you’ve apparently seen other design books that use .25 inch margins.</p>
      <p>If you are talking about how far pictures can extend into a margin, that is one thing. If you are talking about text, quite another.</p>
      <p>Most book designers take their task as presenting the author’s work. From the tenor of your post, you seem to see the job of designing differently.</p>
      <p>Charles Ellertson</p>
