    html: |-
      <p>Due to exigencies of large-scale printing and production, most book printers will cite as much as 0.125 inch to be an acceptable tolerance in trimming and recommend that any element that is not intended to bleed should be *at least* 0.25 inch from the trim. If you want that margin to appear consistent throughout the book, I’d make it larger. Not every printer imposes with adequate compensation for creep.</p>
      <p>Regarding inner margin, the safest bet is always to get a dummy from the manufacturer and evaluate your page design in relation to the physical object. My gut tells me that half an inch is too tight.</p>
      <p>— K.</p>
