      <p>.25” margin is generally considered safe, but I have to agree with Eluard that it’s crazy tight. What is your trim size? What kind of book is it, an illustrated book or a reading book? If the former you may be able to pull it off, if the latter your readers will probably hate you. I really wouldn’t put text that close to the edge of the page. Pictures... well ok if you insist.</p>
      <p>Your inside margin should be a little more, as you’ve specified, to avoid the text falling into the gutter, but depending on how it’s being bound, 1/2” might be tight as well.</p>
