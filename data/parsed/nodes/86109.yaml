  html: |-
    <p>Hi all,</p>
    <p>I'd really appreciate some advice. </p>
    <p>I'm looking for a strong business like sans serif with personality to use throughout a travel website. It will be for the company tagline. Client wants something that is business like without being too corporate. I'd looked at Proxima Nova and Rooney web - is there something between these two that might work?</p>
    <p>Help me Typophile, you're my only hope. Any thoughts much appreciated. </p>
    <p>Oh they need to support latin language character set and serveable via Fontdeck, Typekit or similar.</p>
    <p>Cheers, Matt</p>
