      <p>I'd say definitely NOT Walbaum or Clarendon. Using those will put you in the dangerous territory of mixing serifed typefaces on the same page. You need something to contrast with Garamond, and Clarendon and especially Walbaum are too close.</p>
      <p>And I'm going to have to give yet another differing opinion and suggest Franklin Gothic. For no other reason than I really like Frankoin Gothic, and I think it goes nicely with Garamond (in particular, Adobe Garamond).</p>
    html_clean: |-
      <p>I'd say definitely NOT Walbaum or Clarendon. Using those will put you in the dangerous territory of mixing serifed typefaces on the same page. You need something to contrast with Garamond, and Clarendon and especially Walbaum are too close.</p>
      <p>And I'm going to have to give yet another differing opinion and suggest Franklin Gothic. For no other reason than I really like Frankoin Gothic, and I think it goes nicely with Garamond (in particular, Adobe Garamond).</p>
  - id: 277131
