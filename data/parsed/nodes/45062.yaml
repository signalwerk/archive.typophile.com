    date: 2008-05-07T06:09:00
    date_raw: 7 May 2008 — 6:09am
    votes: null
    html: <p>Franklin Gothic will sit very well with Adobe Garamond; they both have the classic feel that lends credibility to a piece. Syntax could work, but Myriad/Fruitiger would be a better humanist to go with as they have a little less personality on their own. IMHO Syntax works best on its own; that way it doesn’t distract from the copy, and there’s enough contrast in the weights that it makes a fine all-around book face.</p>
