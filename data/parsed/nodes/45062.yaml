    <p>hello everybody,</p>
    <p>i have a litl question , i'm making a book for typografie class and i decided to use adobe garamond,for the headings i'd like to use annother font than adobe garamond, but i'm kind of looking for some advice / opinions on what you fine people think works best.</p>
    <p>i'm sort of limited with my licensed fonts to choose from but here are some options:</p>
    <p>-ITC franklin gothic<br>
    -Syntax<br>
    -Walbaum<br>
    -Univers<br>
    -Clarendon</p>
    <p>i'd really appreciate all the help everyone</p>
    <p>have a nice day</p>
