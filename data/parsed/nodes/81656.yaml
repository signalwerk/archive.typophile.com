  html: |-
    <p>I've made multiple pdfs from my indesign files and combined them in preview to make one big pdf. I have no problems viewing it in preview but when I or my client try to open it in Acrobat it crashes or gives this error message: Cannot extract the embedded font xxxxx. Some charcters may not display or print correctly. </p>
    <p>Does anyone know what the problem is or how to fix it?</p>
