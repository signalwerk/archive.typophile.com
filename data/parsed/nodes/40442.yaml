      <p>The ß looks like Bodoni Antiqua from Berthold (see attached sample from the Guide). However the ’f’ doesn’t match. Most Bodonis have a flat-topped ’t’, but your newspaper doesn’t — also like Bodoni Antiqua. It’s hard to see if the same type was used for the text, as well as the headlines, but you might be able to use the Serif Font ID Guide if you have a good look at the letters. </p>
      <p>- Mike Yanega</p>
