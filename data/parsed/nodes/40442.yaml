    <p>gotta love xmas visits home... the family found an old local newspaper in the isolation of their home while renovating and thought they’d keep it for me. I posted the pictures below to my flickr account and hope the links will work.</p>
    <p><a href="http://www.flickr.com/photos/memostothefuture/2147312308/">anyone recognize the headline font?</a><br>
    I find the “ß” and “f” in here quite beatiful. <a href="http://www.flickr.com/photos/memostothefuture/2147312276/"> here is a closeup</a>.</p>
    <p>and just for fun - <a href="http://www.flickr.com/photos/memostothefuture/2147312316/">check out this W</a>. is that an infinity symbol in there?</p>
    <p>(couple more shots in my flickr stream, if you like)</p>
