    html: |-
      <p>This is an old design and probably in several fonts.<br>
      For example see capital letter P in Collins Florets <a href="http://www.myfonts.com/fonts/wiescherdesign/collins-florets/mn/glyphs.html" title="http://www.myfonts.com/fonts/wiescherdesign/collins-florets/mn/glyphs.html">http://www.myfonts.com/fonts/wiescherdesign/collins-florets/mn/glyphs.html</a><br>
      You could use as is or smooth the looping curves in a font editor.<br>
      The bottom of the thick part is supposed to be irregular, like a vine leaf.<br>
      Don</p>
