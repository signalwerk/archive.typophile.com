    html: |-
      <p>I'd recommend starting with a few simple exercises to get rid of blank page syndrome - start by enlarging some letters from one of your own typefaces, or some favorite fonts, then get out the tracing paper and just practice for a while to get used to it. Then move on to copying the letters rather than tracing over them. The next step is practice modifying the letters. All of this will simply serve to get you comfortable with the process and improve your hand skills. When you're feeling more confident, try doing some simple monoline sketches to act as a sort of skeleton, then flesh out the shapes or trace over them using brushes or flexible steel nibs, etc. The thing to remember is that is that takes time and patience and A LOT of letter drawing to get good at it.</p>
      <p>Have fun with it!</p>
      <p>~ Laura</p>
