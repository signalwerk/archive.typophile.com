      <p>Go buy some calligraphy books, buy some nibs and pens and inkwells, and practice some calligraphic letterforms. You'll learn to appreciate every part of the letter.</p>
      <p>Get a sketchbook with grids and draw. Then draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw, draw. Then some more. The more you draw the better and more familiar you will become with the letters. :) </p>
      <p>Mike's advice, "Stay loose with no expectations, have fun with it all most importantly and let things naturally develop from there," is probably the best advice to have. Wise words!</p>
