    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Andrea Tinnes</strong></p>
    <p>Andrea Tinnes is a type and graphic designer based in Berlin, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a>. Her design practice is focused on client-based as well as self-initiated projects. Through her own label, <a href="/wiki/typecuts" class="freelinking" rel="nofollow">typecuts</a>, she publishes as well as promotes all her type designs. In addition to her design practice Andrea works as Adjunct Professor at the Bergen National Academy of the Arts in Norway where she teaches courses in type and typography.</p>
    <p>Designed PTL Skopex for <a href="/wiki/primetype" class="freelinking" rel="nofollow">primetype</a>.</p>
