    html: <p>The dot of an i is (with the exception of Turkish and Azerbaijani) not an accent and does not impart extra information, so it can be subsumed by the f without causing confusion. You want to be sure of whether you're looking at an accent or an unusual serif, because it changes what you read.</p>
