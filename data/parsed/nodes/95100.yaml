  html: |-
    <p>Ligatures for ff, fi, fl, ffi and ffl seem to be quite common, but I (being a copywriter, not a professional) cannot remember having ever seen a ligature for ffè -- which could be put to use in making a nice Italian caffè. Can anyone point me out to instances of this ligature (or other ligatures of an f followed by a letter with a grave accent)? Or is it inexistent? And if so, why would that be?<br>
    Thanks, Bart</p>
