      <p>Happy non gimmicky? Hm… <a href="http://www.klim.co.nz/national_samples.php" rel="nofollow">National</a> strikes me as quite happy, but maybe that's just me. <a rel="nofollow">(It has a bit of a crazy smile.)</a></p>
      <p>But really, this depends such a lot on context. If the rest of your mailer is «funny» maybe you'll need a very dry font to not let it get too silly. If the layout is «dry» the type has to work more. Quite hard to suggest fonts out of the blue.<br>
      Also: How much text, how large?</p>
