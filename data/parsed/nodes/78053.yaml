    html: |-
      <p>Thanks for the kind words, people.</p>
      <p>Andrij, I would love to do an alternate set of glyphs for Cyrillic, as working on the Cyrillics was quite a challenge, and a lot of fun.</p>
      <p>However, I'm afraid that would be a waste of my time, financially, for various reasons.<br>
      I would be more likely to do Greek.<br>
      I haven't done Cyrillics for the Display and Text weights, either, again for financial reasons. I doubt I will get a return on the investment I made in doing the Cyrillics that I have, but I couldn't resist doing them, at least for the basic version of the typeface.</p>
