    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Font_disp_5894.png"></div><br>
    The FF Fontesque OpenType upgrade presents an interpretation of the typeface that is more sophisticated than the original grunge-era rendering, with the addition of finely-detailed display cuts, increased language support, and many OpenType features — most notably a pseudo-random effect.  <p></p>
    <p><strong>“RANDOM” FEATURE:</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_aabbcc_4149.png"></div><br>
    The Contextual Alternates feature of OpenType has been exploited to create a pseudo-random effect. There are alternate glyphs for every character (including all spaces, accented characters, punctuation, figures, ligatures, &amp;c.) so that each is represented by two different glyphs. Most alternates are similar in structure but slightly different in proportion, alignment, and detail, so that the overall effect enhances the original premise of Fontesque—the appearance of graceful, whimsical hand lettering without mechanical repetition.<p></p>
    <p>The "random" effect is automatic. Here's what happens behind the scenes:</p>
    <p>1. Toggle<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_Kissing_6617.png"></div><p></p>
    <blockquote><p>This causes every other character in text to be a “calt” glyph, so that when a character is doubled, the two glyphs are different (note double “s”). It also provides two different “looks”—useful for optimizing the appearance of display settings. And of course, further refinement may be made by manual selection from the glyph palette.</p></blockquote>
    <p>2. Proximity<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_Raisin_5944.png"></div><p></p>
    <blockquote><p>When an alphabetic or numeric character repeats, separated by a single character, the second instance is programmed to be the other glyph for that character. Therefore, the closest that a glyph may repeat is when separated by three characters. So, with just two sets of glyphs and the “Toggle + Proximity” system, repetition will not occur until the fifth character. This works because there are no languages in which an alphabetic character appears three times in succession (with the exception of a few German words).</p></blockquote>
    <p><strong>ALL CAPS:</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_figs_5727.png"></div><p></p>
    <blockquote><p>“All caps” (case) feature includes:<br>
    - monetary symbols<br>
    - lining figures<br>
    - brackets<br>
    - hyphens &amp; dashes<br>
    - guillemets</p></blockquote>
    <p><strong>OPTICAL SIZES:</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_ns_5014.png"></div><p></p>
    <blockquote><p>The addition of display weights emphasizes how the Fontesque OpenType makeover presents a more sophisticated interpretation of the typeface than the original grunge-era rendering, with carefully refined drawing of the glyphs. Now there are three optical sizes: Display, Normal, and Text.</p></blockquote>
    <p><strong>ORNAMENTS:</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_Orn_6025.png"></div><p></p>
    <blockquote><p>Each font now includes all 59 ornaments, and they have been rationalized:<br>
    	1. The same number of ornaments in each font.<br>
    	2. No “flipped” versions of ornaments.<br>
    	3. Ornaments are weighted according to the font they are in.<br>
    	4. Light and Regular weights have “open” ornaments,  Bold and Extra Bold weights have “solid” ornaments.</p></blockquote>
    <p><strong>GERMAN:</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_SS_4206.png"></div><p></p>
    <blockquote><p>Cap Eszett in all styles.</p></blockquote>
    <p><strong>CYRILLIC:</strong><br>
    As with the original Latin script version, the Cyrillic is assiduously sick, and (so far), quite unlike any other Cyrillic typeface.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_Cyr_5021.png"></div><p></p>
    <p><strong>SUPERFAMILY!</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font_Sans_5313.png"></div><br>
    The sans too has been upgraded, although not to the extent of the serifed Fontesque.<br>
    Fontesque Sans Pro features oldstyle and lining figures, ligatures, ornaments, and full European Latin script coverage, but no 'random' feature or Cyrillic.<p></p>
    <p>The new Fontesques are available at FontShop in these formats:<br>
    - OT<br>
    - Pro<br>
    - Office<br>
    - Web</p>
    <p><a href="http://www.fontshop.com/search/?q=fontesque+pro&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=fontesque+pro&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=fontesque+pro&amp;x=0&amp;y=0</a></p>
