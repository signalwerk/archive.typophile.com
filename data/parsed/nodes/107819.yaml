    html: |-
      <p>I have been down this path, with regard to vertical writing in MS Word.</p>
      <p>For reasons unknown, at least to me, MS Word requires that an OpenType/CFF font include the 'vrt2' GSUB feature. MS Word is simply checking for its presence. If the font does not include this GSUB feature, I suggest that you clone the 'vert' GSUB feature to create the 'vrt2' GSUB feature.</p>
