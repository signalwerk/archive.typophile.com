  html: |-
    <p>What's your strategy for left sidebearings on script caps? I'm not taking about scripts where all caps would be legible. I'm taking about scripts with swishy swash script caps where words in all caps will look terrible anyway. Right sidebearings are easy to do because they can be tested against lowercase in words. But what about the left?</p>
    <p>In the past I've used sentence endings to gauge the spacing. For example:</p>
    <p>Yeah. Apes attacked.</p>
    <p>I adjust the left sidebearing on the A so the word space after the period feels right. Whaddya think?</p>
