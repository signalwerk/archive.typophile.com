      <p><cite>I adjust the left sidebearing on the A so the word space after the period feels right.</cite></p>
      <p>And what if a sentence starts with an 'A'?<br>
      After all, it would get the same left sidebearing.<br>
      Are you sure you wouldn't test it against a left margin of text, to see the vertical alignment against next sentences?<br>
      As for your example, I think it I would solve it with a kern ...<br>
      Although swashes are, indeed, difficult to space, especially in the middle of a phrase.</p>
