      <p>Thank you for your answer. My Idea was to use a main body of 10pt, so you suggest to avoid the Amerigo at that size.</p>
      <p>Unfortunately the set of possible fonts with math support is somewhat limited (<a class="freelinking external" href="http://www.tug.dk/FontCatalogue/mathfonts.html" rel="nofollow">http://www.tug.dk/FontCatalogue/mathfonts.html</a>). A suitable selection of fonts is:</p>
      <p>Antykwa family, but I think it is too fancy for a long text:<br>
      <img src="http://www.tug.dk/FontCatalogue/anttor/anttor.png"><br>
      <img src="http://www.tug.dk/FontCatalogue/anttor/anttor-math.png"></p>
      <p>Computer Concrete, that I really like:<br>
      <img src="http://www.tug.dk/FontCatalogue/ccr/ccr.png"><br>
      <img src="http://www.tug.dk/FontCatalogue/ccr/ccr-math.png"></p>
      <p>Artemisia gives the idea of a handwritten serif font:<br>
      <img src="http://www.tug.dk/FontCatalogue/gfsartemisia-euler/gfsartemisia-euler.png"><br>
      <img src="http://www.tug.dk/FontCatalogue/gfsartemisia-euler/gfsartemisia-euler-math.png"></p>
      <p>Always nice Garamond:<br>
      <img src="http://www.tug.dk/FontCatalogue/garamond/garamond.png"><br>
      <img src="http://www.tug.dk/FontCatalogue/garamond/garamond-math.png"></p>
      <p>Palatino:<br>
      <img src="http://www.tug.dk/FontCatalogue/palatino/palatino.png"><br>
      <img src="http://www.tug.dk/FontCatalogue/palatino/palatino-math.png"></p>
      <p>And finally the Times, that I really can not stand:<br>
      <img src="http://www.tug.dk/FontCatalogue/txfonts/txfonts.png"><br>
      <img src="http://www.tug.dk/FontCatalogue/txfonts/txfonts-math.png"></p>
