  html: |-
    <p>Dears, </p>
    <p>We've faced little concern about using United. As we love this typeface for a titling, we don't like it to as much to use it in the rest of text. This is a question if you have ever found a typeface companion for it. We need some military looking stuff for such logotype like this <a href="http://goo.gl/WK1ob" title="http://goo.gl/WK1ob">http://goo.gl/WK1ob</a></p>
    <p>Thank you!</p>
    <p>Best,<br>
    W.</p>
