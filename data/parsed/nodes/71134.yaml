      <p>Ooops! Sorry. I know that is always a risky way to answer, but you must excuse my narrow view of the typophile community. I rarely track any threads outside of the Type ID Board. I certainly meant no slight to Hanno Bennert.</p>
      <p>In a way, I suppose I have slighted two communities, although honestly I believe many non-commercial fonts are comparable quality to many commercial fonts (see, I did it again). However techno sans fonts are one of the most popular amateur designer projects, and that was the reason for my leaning that way (plus the fact that commercial site searches found nothing especially close).</p>
      <p>I will try to be more careful in the future.</p>
      <p>- Mike Yanega</p>
