    html: |-
      <p>Much clearer version available on their annual report here:<br>
      <a href="http://www.met.police.uk/annualreport/pdfs/mpa_mps_2004_05.pdf" title="http://www.met.police.uk/annualreport/pdfs/mpa_mps_2004_05.pdf">http://www.met.police.uk/annualreport/pdfs/mpa_mps_2004_05.pdf</a></p>
      <p>I've got a feeling that this is a customised sans. I think Wolff Olins may well have done the brand...? See this report from 1997:<br>
      <a href="http://www.morrisinquiry.gov.uk/downloads/evidence-inq-103.pdf" title="http://www.morrisinquiry.gov.uk/downloads/evidence-inq-103.pdf">http://www.morrisinquiry.gov.uk/downloads/evidence-inq-103.pdf</a></p>
      <p>Also on Wally Olins own biog website:<br>
      <a href="http://wallyolins.com/biog.htm#" title="http://wallyolins.com/biog.htm#">http://wallyolins.com/biog.htm#</a></p>
      <p>I think Yves is right: Tagline is a condensed version of Univers (not sure which weight without checking) but I have a feeling you want to know the Metropolitan Police font.</p>
      <p>The stresses are oblique (see M and N). Notably, the P's are different top and bottom. Bottom P looks Myriad-ish but the rest isn't Myriad. I don't think I have ever seen an R with a tail like that.</p>
