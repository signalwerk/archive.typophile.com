      <p>The free font Sansman Bold is very close, save for the stroke ends (see the capital F):<br>
      <a href="http://www.whatfontis.com/Enter-Sansman-Bold.font?text=LevFlx" title="http://www.whatfontis.com/Enter-Sansman-Bold.font?text=LevFlx">http://www.whatfontis.com/Enter-Sansman-Bold.font?text=LevFlx</a></p>
      <p>So that means if you want a dead-on match, it has to be Serpentine:<br>
      <a href="http://www.myfonts.com/fonts/linotype/serpentine/" title="http://www.myfonts.com/fonts/linotype/serpentine/">http://www.myfonts.com/fonts/linotype/serpentine/</a></p>
