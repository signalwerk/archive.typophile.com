    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1-DA_Header_6329.png"></div><br>
    Alphabet Soup Type Founders and Michael Doret are proud to announce the Release of Dark Angel, a “blackletter/hybrid” font. This font had its genesis in a logo sketch for the Anaheim Angels baseball team—thus its name.<p></p>
    <p>Type purists may be appalled by the lack of adherence to traditional forms, but the font should be seen as only “in the spirit of” blackletter, and attempting something that hasn’t been seen or done before—something that feels traditional, yet at the same time fresh and perhaps unexpected.</p>
