      <p>Weird indeed...<br>
      Maybe this is an problem related to how Typophile server handles/stores images.<br>
      "image_155.jpg" (the last portion of link) is a very generic and common filename<br>
      and in some weird way it might have been (erroneously) re-used by the Typophile server.</p>
      <p>Mike could you try to use the link on a different browser (Internet Explorer, Firefox, Opera, etc) to check if you get the same result?<br>
      Another option could be to clear the cache of your current browser.</p>
