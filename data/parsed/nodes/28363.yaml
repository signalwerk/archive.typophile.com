    html: <p>While I'd be interested in such a shortcut myself, obviously it would still only provide a rough idea of what you'll get when you spit the document out as a hardcopy. Even with a hi-res display and your text-rendering engine tuned right up, you're still looking at clumsy pixels on the screen, thus your display will never provide a decent representation of good crisp ink (or even half-assed toner for that matter).</p>
