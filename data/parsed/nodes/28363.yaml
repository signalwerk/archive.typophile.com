    <p>Dear Typophiles,</p>
    <p>I'm wondering whether it is possible to teach Indesign CS2 the actual DPI-value of my screen, so it displays an object that is 10cm wide as 10cm in 100% Zoom. At the Moment, I have to zoom to about 130% to get an 1:1 equivalent, which is not very handy...</p>
    <p>I remember Xpress 4.0, where this was possible, so maybe Indesign can do it as well? Changing the DPI-value on system level (Windows) doesn't seem to change anyting.</p>
    <p>Thanks for your help<br>
    Sebastian</p>
