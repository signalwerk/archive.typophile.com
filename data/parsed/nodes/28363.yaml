      <p>Screens are measured in PPI. Yes, I'm being at tad anal.</p>
      <p>Anyhoo, seems that these easiest solution is to hold a ruler up to the screen, and then adjust the zoom until it's 1 to 1. </p>
      <p>At that point, I don't know if InDesign can 'save' a zoom as a preference or not.</p>
