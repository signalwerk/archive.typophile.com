      <p>"Though it’s still not logical that I have to zoom to 131% to get a 100% view :)"</p>
      <p>There is no standard monitor PPI, as such, it's impossible for software to really know what it needs to size it at on-screen.</p>
      <p>Rumour has it that OSX.5 will finally have resolution-independant screen rendering:</p>
      <p><a href="http://mnteractive.com/archive/resolution-independance-in-osx-leopard/" title="http://mnteractive.com/archive/resolution-independance-in-osx-leopard/">http://mnteractive.com/archive/resolution-independance-in-osx-leopard/</a></p>
      <p>It's been a long time coming, so I'm hoping it happens.</p>
