    <p>have posted two articles on my <a class="freelinking external" href="http://arabictype.wordpress.com about " rel="nofollow"> blog</a> about the characteristics of Arabic type. I have grouped the characteristics in four categories:</p>
    <p>1. General characteristics: that relate to the representation of the Arabic alphabet and number of glyphs needed in the font files.</p>
    <p>2. Inherited characteristics: what Arabic type has taken from the calligraphic representation of Arabic text.</p>
    <p>3. Acquired characteristics: how print and digital technologies have affected the shape of Arabic characters. Special focus was made on the introduction of the Linotype hot metal system and the resultant Simplified Arabic style.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SimplifiedArabicConcept_3566.jpg"></div><p></p>
    <p>4. Visual characteristics: this will be focus of the next article in the series and will speak about the visual design principles that are not always followed in the design of Arabic type.</p>
