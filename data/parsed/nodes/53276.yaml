    <p>Can anyone recommend a book printer that can do a casebound book with perfect registration? There are bleeding elements at the thumb margin throughout. The printer needs to be able to deliver seamless baseline backup.</p>
    <p>We need to go to press ASAP.</p>
    <p>Some sample pages are here:<br>
    <a href="http://typedeskref.com" title="http://typedeskref.com">http://typedeskref.com</a></p>
    <p>I'll check back here later tonight.</p>
    <p>Thank you so much!</p>
    <p>Theo</p>
