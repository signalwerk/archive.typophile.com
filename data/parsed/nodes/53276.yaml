      <p>I think all of us who routinely deal with Thomson-Shore, Sheridan, Friesens, Maple Vale, Edwards Brothers, etc. have our favorites. Our reasons are almost never ones that point to a "clearly better" printer. </p>
      <p>For example: some have an excellent price, but a relatively untrained person on the preflight program. That can cost you time; in fairness, it can also save you problems in that you get to review EVERYTHING the preflight program kicks out. 90+% of what's raised in preflight is trivial, you'd tell them to run the job, but you'll spend time tracking the thing down. Some printers, like some comps, make reasonable assumptions. That cuts down the number of issues raised, but at a slightly increased risk of miscommunication or error. Etc.</p>
      <p>For example: some printers don't publish, or won't work with you, on dotgain. Saying the dotgain is "20%" doesn't tell you much about the shape of the total curve. Yup, it is 20% at 50% black, but the curve is far from a straight or "pre-definable" line. Etc.</p>
      <p>For example: some printers routinely stock the paper you want. Etc.</p>
      <p>For example, some printers use a slightly grayer ink -- pluses and minuses.</p>
      <p>Etc.</p>
