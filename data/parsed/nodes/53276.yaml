      <p>Oh! Hello Mr Ellertson, it is a pleasure to be chatting with you. <em>The Glossary of Typesetting Terms</em> is a great book. It was indispensable for fact checking and comparison while writing my book.</p>
      <p>Thanks for bringing that to my attention. Thinking down that line, I'm now looking at the thumb tabs on Eckersley's <em>The Telephone Book</em>.</p>
      <p>I meant your latter idea of press check: stepping foot in the press room. Make friends with the pressman, break out the loops, get my hands dirty, shoot the shit, and take smoke breaks.</p>
      <p>I like your term "digital blues." The first time I received one of those, I thought it was a joke, then I got <em>blue</em>.</p>
      <p>I like press rooms. Plants, not so much (but I guess they're necessary for the jumbo jobs). My favorite small shop unfortunately had to close its doors a few years back after the junky pressman went on a bender and never came back. Three different freelance pressmen couldn't get the press running correctly after his departure. They found the press had been fixed, or rather rigged to work by cramming screwdrivers and bubble gum in it.</p>
      <p>Fueled by cocaine and smack, my man the junky played that two color Ryobi like a violin. We printed a <em>four</em> color job with flawless registration and sent it off to the binders. In the end, it was masterpiece. I sure do miss him.</p>
