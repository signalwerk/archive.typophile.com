      <p>Just for the fun of it, &amp; since I too was involved with writing a glossary (<cite>Glossary of Typesetting Terms</cite>, Chicago, University of Chicago Press, 1994) What do you mean by "press check"? What I call "blues", as opposed to "digital blues"? Or when you're at the plant, see a sample of each sheet as it first comes off the press (after running enough sheets to get the inking right), approve it, or make changes, sometimes meaning a new plate, before running that plate? The latter is what I call a "press check." </p>
      <p>Yes, they charge for that. Book printers are getting so they charge for traditional blues, which BTW also delay the book a bit. And the biggest source for error in what you're after would come with machine folding &amp; trimming; even traditional blues won't show that since they are hand-folded.</p>
