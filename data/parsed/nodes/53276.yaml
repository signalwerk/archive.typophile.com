      <p>But when I am in the press room with the pressman, checking the first sheets of each sig, that's a "press check." No printer worth its salt should charge for that. In fact, the really good ones will have an apartment with a kitchen stocked with food basics, a wireless set-up, and a good TV available for you over the days you'll be there. At Transcontinental's plant in Beauceville, Quebec, they have a sweet suite right in the printing plant. It make a press check so easy. But I digress.</p>
      <p>powers</p>
