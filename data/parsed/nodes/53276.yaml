    html: |-
      <p>I also did a book once with thumb tabs on the fore-edge. Ours bounced about a 6 point range, like Will's. Also acceptable for our title. Back-up was pretty good, not perfect. This was a 2-color job; I assume sheet-fed, but could have been web, I suppose -- too long ago to recall.</p>
      <p>The variance is probably going to be greatest when crossing actual signatures. </p>
      <p>The other thing to consider is not to make the tab element too shallow or too narrow. The deeper (i.e., taller) the tab, the less the bounce will seem. Also, if a tab element is too narrow, then you're more likely to notice the variations in edge trim. Binding creep and how many pages in the signature will affect how much variance in trim. I would be prepared for as much as 4–6 points difference there too.</p>
      <p>So, for instance don't try to go for exactly half a circle, or you'll only end up disappointed.</p>
      <p>-- Kent.</p>
