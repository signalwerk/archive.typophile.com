      <p>Registration on the tabs varied by maybe 6 points. &amp; it is very noticeable when you look at the foredge. The book was notch bound, so, yes, sigs were notched and folded as they came off the web. All this is acceptable for this title.</p>
      <p>Web is cheaper and faster than sheetfed; that can often be a factor. In general web work is not as good for halftones as sheetfed, but many printers are getting better results on web presses. I do not have a general attitude about whether to print web or sheet. Each book is judged on its own needs. </p>
      <p>ALSO: I just checked with my man at Sheridan. They do not charge for "press checks," when you are in the press room while the book is running. They do charge for "press tests" as I described them above. They will help folks get discounts at hotels.</p>
      <p>I never do a press check on a single-color book. You are going to have to live with some bounce on the back-up and registration of those thumb tabs if you work with any of the standard North American book printers such as those mentioned earlier in his thread. And a press check will not reveal the extent of the bounce. You will only see that when you see sample bound books. </p>
      <p>powers</p>
