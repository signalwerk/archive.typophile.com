      <p>REGISTRATION: Now I see what you are getting at. You have thumb tabs that have to back up since they show on versos and rectos. So, OK: you can get them backed-up well on the sheet. But there will be some variation from page to page in each section the thumb tabs define. That's inevitable because of folding variances. As we've said earlier.</p>
      <p>I'm looking right now at a book we published that has two-color thumb tabs (printed on rectos only, on a web press). As soon as the designer came up with the idea, I pointed out that there'd be some variation within the 25-30 pages called out by each thumb tab. Fine with me. I had no problem, and no one else squawked. It was part of a trade-off involving money and time.</p>
      <p>PRESS CHECK: Are you sure they did not say they'd charge $400 for a "press test," meaning that they'd print a sample sig for you ahead of the full run so you can make sure the thing will come out as you want it to? That is a common practice; it is what I do when I print a book of duotones in North America: I have them gang lots of the art onto a sheet, with some type, and have them run that. The usual cost is indeed about $400. That's a "press test" in my jargon.</p>
      <p>But when I am in the press room with the pressman, checking the first sheets of each sig, that's a "press check." No printer worth its salt should charge for that. In fact, the really good ones will have an apartment with a kitchen stocked with food basics, a wireless set-up, and a good TV available for you over the days you'll be there. At Transcontinental's plant in Beauceville, Quebec, they have a sweet suite right in the printing plant. It make a press check so easy. But I digress.</p>
      <p>powers</p>
