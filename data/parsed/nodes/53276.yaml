      <p>When you say "casebound" do you mean signatures (either sewn or notch bound)? I don't know of any folding equipment that is "perfect" -- trimming either, for that matter. I think the old standard was 3/64 (inch), but you don't see much even that good these days.</p>
      <p>I'd also note that book printers usually specialize into very short run (under, say, 600 copies), short run (under, say, 5,000 copies, sometimes 3,000), and long run. Most of the long-run printers will have binding equipment at their plant, but some of the short-run printers have to sub out casebinding.</p>
      <p>If the book is under 5,000 copies, you might make an inquiry of Thomson-Shore</p>
      <p><a href="http://www.thomsonshore.com" title="http://www.thomsonshore.com">http://www.thomsonshore.com</a></p>
      <p>Be sure they know your particular situation; they will likely give you the truth about their capabilities even if they can't do the job.</p>
