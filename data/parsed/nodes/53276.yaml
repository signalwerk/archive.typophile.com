      <p>Your web page says it is printed at Sheridan. Is that just placeholder copy?</p>
      <p>With today's platemaking/imposition equipment, back-up of pages is generally excellent. But as Charles points out, the folding is the problem. This is the least precise operation in the book printing process. Those big press sheets go through that folder at lightning speed, bumping into the {I'm not sure what the proper term is for this machine part, so I'll call them . . .} "guards" and onto the next fold. So while pages may back up perfectly, the alignment of running heads or first text lines from one signature to the next, and within signatures will be less than perfect.</p>
      <p>You do not get perfection from a printer such as Sheridan or Thomson-Shore. You get damn good commercial book printing at good prices and reasonable schedules. But you will not get your casebound book in less than 5 weeks unless you do some special pleading. If you want perfection you'll have to try one of the really top-notch German or Italian printers. Take a big bag of money with you.</p>
      <p>I designed and managed production on an Oak Knoll book a few years ago. I was under the impression that they always used Sheridan. The printing on that book came out well. I also work with Transcon: prices not so good as Sheridan or T-S, but the work is good. Also try Friesens in Altona, Manitoba or Maple-Vail, an excellent shop.</p>
      <p>I gotta catch a bus. I may have more to add in an hour or so when I get to the salt mine.</p>
      <p>powers</p>
