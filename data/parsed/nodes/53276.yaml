      <p>Theodore,</p>
      <p>What Will and I (&amp; others) are trying to gently say is that what you ask is impossible -- That was my wife's term; she's been involved in book printing even longer than I, and specializes in helping people who lack some area of knowledge in bringing a (book) project to it's end. Sometimes, when the project &amp; budget require it, she winds up making the trip to Europe for a press check, sometimes the need is to deliver 100 copies in a few days for a museum opening, the rest to be printed conventionally for sale. There are all kinds of *perfects*.</p>
      <p>As to negotiating quality control in a contract, you first have to know what is possible, then what is reasonable, esp. for a certain cost. I know a lot of people who specify certain composition standards who do not in fact know what is possible with setting a text -- they try to impose limitations on spacebands in H&amp;J along with rules about what can and cannot be hyphenated, number of hyphens in a row, on &amp; on. There are all kinds of tricks I can play if a customer is willing to pay for the handwork, but in the end, you will always have compromises with a text; you reach a point where you either have to set the text as written or rewrite it.</p>
      <p>Well, that is composition, where I defer to few. Will Powers has the hands-on expertise in printing, so I'll defer to him there.</p>
      <p>As for your current problem with Sheridan, ask what their standard is -- ask what they can hold. If it is 3/64ths, that means your thumbnail bleeds are off by a maximum of a touch over 3 points, &amp; what shows is on the edge away from the binding. Binding &amp; paper have flex, even if it could be perfect imposition, folding &amp; binding, it wouldn't always *appear* that way.</p>
      <p>Oak Knoll, like other publishers, use Sheridan for a reason. That reason is price.</p>
