      <p>I went to college for everything BUT design. Afterward, I just took the minimal technical courses at night until I had a portfolio. The night design courses, with 30 or more students, were a complete waste of time; the teacher was less talented than I was! Everything I know I learned on my own or on the job. We are all self-taught every time we get another software program and we all keep up on our own. </p>
      <p>Mentors and internships are the key way to get into most fields; if an art school gives you access to the right mentors and internships, then that's your justification for going to art school. Strong portfolios lead to more work as you network and become appreciated. No client ever asked me about my formal education; they just want to evaluate my samples.</p>
