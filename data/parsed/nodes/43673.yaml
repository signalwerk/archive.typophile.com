      <p>Even as screwed up as the school I’ve been at is, I still learned a hell of a lot from studying under the lot of talented and successful working designers who teach there, much more than I did from my internships. Michael Beirut wrote about there being two kinds of design programs, crazy fine art programs where students learn about art and how to do wildly creative work, and schools that help students churn out a really slick portfolio that will get them a job. If you go to one of the former, you’ll learn a hell of a lot and that paper really will mean something. The important part is making the effort to find the right school. </p>
      <p>The downside, of course, is having to put up with batshit crazy design teachers who have boring clients and live vicariously through their students.</p>
