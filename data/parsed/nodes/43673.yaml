    html: <p>Like MondoB I have no formal design training - studied fine art in college. Took a few useless night school courses too. Really learned on the job. I don't think a design degree is at all necessary to become a successful designer. It's more about networking, having a really good attitude, taking whatever they throw at you on the job and doing it without complaining, being resourceful, and trying to befriend the senior designers with the hope that they will give you extra responsibility.</p>
