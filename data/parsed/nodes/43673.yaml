    <p>Some of you may remember me from a few days ago when I wrote a really long post about working in the industry of graphic and web design.</p>
    <p>The resounding response on a couple different forums was that although working in the industry would be easier with a design degree / diploma, it isn't necessary.</p>
    <p>So my next and probably final question is this. From the standpoint of someone who doesn't have a lot of money, what do you think the better decision would be. Investing in a 4 year program where I'm going to learn little of relevance, but emerge with a great piece of paper, or attempt to find work with a local studio as an intern where I can begin to network.</p>
    <p>One of my concerns is that having no formal education could be devastating in 10 years if there were great shifts in the industry that leave me with no real credentials and severely limited working potential.</p>
    <p>I look forward to hearing your opinions, you've all been very helpful so far.</p>
