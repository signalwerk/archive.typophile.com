    date_raw: 19 Sep 2009 — 7:08am
    votes: null
    html: <p>Interesting, all these fonts are close relatives, but don't have the same whipped cream kind of feel, they're more tech-y. I know I need to keep the look of this font, this client is very fussy about that. Luckily it is very geometric and the client doesn't have high production values. I used a scan and duplicated letters, and only needed one, K, which I made. Not the most typophilic solution, but it got it out the door! Thanks everybody for your knowledge, it helped me make a decision on what to do next!</p>
