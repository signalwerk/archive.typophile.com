      <p>The overall shape of Pluto Outline does look like the sample, for at least the letters shown, but the shading boundaries are different. Pluto Outline is shown in a couple of the Dan Solo books for Dover, including the Solotype Catalog, but I don't know of a digital version.</p>
      <p> - Mike Yanega</p>
