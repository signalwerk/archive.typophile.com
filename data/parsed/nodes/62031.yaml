  html: <p>Can anyone identify this? It seems really familiar, like a Letraset or Typositor font from the 70s, but it's not exactly Chromium and Identifont doesn't have it. My intuition says it's named Hot Dog, but it isn't the Hot Dog that's out there now. </p><div class="imageWrap"><img src="http://typophile.com/files/SCN_hotdog_3867.jpg"></div><p></p>
