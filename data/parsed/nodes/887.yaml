  html: "<p>The TypeCon2002 TypeGallery is an unjuried showcase of new type designs and typography from around the world. The TypeGallery will be on exhibit continuously during TypeCon2002, July 12-14, 2002, in Toronto, Ontario, Canada. An online exhibition will go live at the TypeGallery website after the close of the conference. <br> <br> <br>GUIDELINES FOR SUBMISSION <br>------------------------- <br> <br>- Any designer or foundry (commercial or independent) may submit a maximum of three new type designs for inclusion in the TypeGallery. <br> <br>- Fonts may be commercially available, proprietary or not available for distribution. Samples of hand-lettering may also be submitted. <br> <br>- Type designs must have been completed and/or released between July 2001-July 2002. <br> <br>- Each submission should be printed at 11 x 17 inches or A3 in size, and mounted flush to white foamcore board. Unmounted entries will NOT be exhibited.  <br> <br>- Entries may be in black-and-white or color. <br> <br>- Boards should show one typeface or family in an optimal setting (showing the full character set is recommended). <br> <br>- A typographic piece which is not a type specimen showing may also be exhibited. All fonts used must be noted. <br> <br>- Include the name of the font(s), type designer, graphic designer, foundry, postal address and telephone number, email address, and website URL. <br> <br>- Please do not include advertising literature or pricing in specimens or other artwork to be exhibited. <br> <br>- All submissions must arrive at the SOTA/TypeCon offices by July 8, 2002. <br> <br>- Submissions will not be returned, but may be picked up in person at the end of the conference. Please notify us in advance if you wish to pick up your submission(s). <br> <br>Selections from the TypeGallery at TypeCon2002 will be displayed on the TypeGallery website at <a href=\"http://www.typegallery.com\" target=\"_top\">http://www.typegallery.com</a>. So that we may include your submissions in this online showcase, please email 72 dpi JPEGs, GIFs or PDFs to mailto:<a href=\"mailto:tamye@typesociety.org\">tamye@typesociety.org</a>. Again, please include the name of the font(s), type designer, graphic designer, foundry, postal address and telephone number, email address, and website URL. Electronic files must be received by July 8, 2002. <br> <br>PLEASE NOTE: There is no fee to have work exhibited in the TypeGallery. In return, we ask that you sign your submission(s) and donate them to the SOTA auction, TypeCon's fundraising event featuring typographic treasures. Conference attendees will be delighted to take home the unique pieces of typographic art featured in the TypeGallery. By donating your TypeGallery submissions, you will assist in SOTA's efforts to present future quality programming. <br> <br>Please send all submissions (well-packaged to prevent damage) to: <br> <br>Society of Typographic Aficionados <br>PO Box 770 <br>Buffalo, NY 14213 <br>USA <br> <br>TEL 716-885-4490 <br>FAX 716-885-4482 <br>                               <br>Questions?  Email mailto:<a href=\"mailto:tamye@typesociety.org\">tamye@typesociety.org</a>. For further information about TypeCon2002, please visit the conference website at <a href=\"http://www.typecon2002.com\" target=\"_top\">http://www.typecon2002.com</a>.</p>"
