      <p>СПБ is a wonderful city where I was privileged to spend a summer (and White Nights) long ago.  And Pushkin's famous second line seems made for typographers.  Alas, I can't justify the trip right now, but I hope those attending Atypi СПБ will have time to look around.  Still, if I could go I'd have even more qualms about armies of occupation, including our own.</p>
      <p>David</p>
