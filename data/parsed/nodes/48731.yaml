    date: 2008-09-11T10:40:00
    date_raw: 11 Sep 2008 — 10:40am
    votes: null
    html: |-
      <p>It is very easy. Bus stop is between arrivals and departures, about 100m to the left as you exit the terminal. SPb Pulkovo 2 is quite small terminal, no chance to get lost there.</p>
      <p>Bus will stop at "Moskovskaya" metro station which is on the "blue" line. If you just go on to the north and exit on "Nevsky Prospect" - that will be as close to the "center" as it can be. Or you can change to the red line on "Tekhnologichesky Institute" (just walk on the opposite side of the station, no need to use stairways or elevators) and exit on "Ploschad Vosstania". If you want to go to Hotel Moscow, you need to change at "Nevsky Prospect" to "Gostinyi Dvor" and take another 2 stops to "Ploschad Alexandra Nevskogo". Which is located *in* the hotel.</p>
      <p>This is the map (in Russian, but you have to learn a bit of it anyway :-):<br>
      <a href="http://maps.yandex.ru/metro.xml?mapID=500" title="http://maps.yandex.ru/metro.xml?mapID=500">http://maps.yandex.ru/metro.xml?mapID=500</a></p>
      <p>More travel info is here:<br>
      <a href="http://www.atypi.org/05_Petersburg/travel" title="http://www.atypi.org/05_Petersburg/travel">http://www.atypi.org/05_Petersburg/travel</a></p>
      <p>Airport:<br>
      <a href="http://www.pulkovoairport.ru/eng/" title="http://www.pulkovoairport.ru/eng/">http://www.pulkovoairport.ru/eng/</a></p>
      <p>This is the info about the shuttle buses:<br>
      <a href="http://www.pulkovoairport.ru/eng/transportation/shuttle_bus/" title="http://www.pulkovoairport.ru/eng/transportation/shuttle_bus/">http://www.pulkovoairport.ru/eng/transportation/shuttle_bus/</a></p>
      <p>It will take 15-20 minutes from the airport to the metro station, Pulkovo is quite close to the city.</p>
