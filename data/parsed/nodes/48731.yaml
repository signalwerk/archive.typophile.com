      <p>As my esteemed colleague Göran already has told you I will be there as well. Thanks to sauna pictures from their relaxation area of unearthly tackiness we chose the <em>Hotel Moscow</em>. These are now unfortunately removed.</p>
      <p>My plan is to cover some impressions of the conference on my blog <a class="freelinking external" href="http://typografism.se/" rel="nofollow">Typografism</a>. It's usually in Swedish and deals with the kind of stuff that other, <em>better</em>, bloggers, like James Mosley misses out on. For instance the fact that Simon de Colines during a period included <a class="freelinking external" href="http://typografism.se/?p=176" rel="nofollow">killer rabbits</a> on his book covers. Also featured are rebuses of Swedish type designers (I'm particularly happy with <a class="freelinking external" href="http://typografism.se/wp-content/uploads/rebus1.gif" rel="nofollow">this one</a>, even if it's in Swedish you can figure it out) and reflections on ornament, Ben Shahn and my brief adventures as a Commodore 64 type-designer.</p>
      <p>A brief summary in English could of course be added to the St Petersburg blogposts as an attempt to establish myself as an important type blog authority of international reputation. </p>
      <p>I expect some assistance from Göran (<em>this will be first time he hears of it, btw</em>) in covering the Typetech part. </p>
      <p>See You there!</p>
      <p>ƒ</p>
