    html: <p> This is really a nice typeface.  the one thing i did notice is that towards the end of the alphabet, the faces seem to get more 'curvy', or they don't seem to be as fluid as the front half  of the alphabet.  Like in the W or X... there seems to be more curves in it than any other letters, ...or maybe this was more obvious on these two than the rest. <br> <br>still, nice work! </p>
