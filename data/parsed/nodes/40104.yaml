      <p>I don't know if this works withing your scheme of things, or if there's enough to make a thesis, but it may be interesting to explore vernacular typographic nuances in global brands, particularly in categories where the audiences are predominantly external - airlines, tourism, ethnic cuisine, etc.</p>
      <p>On the one extreme are brands where the typography often overtly reflects regional influences.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Thai_6176.jpg"></div>.<div class="imageWrap"><img src="http://typophile.com/files/Mex_6065.jpg"></div>.<div class="imageWrap"><img src="http://typophile.com/files/Singapore_5942.jpg"></div>.<div class="imageWrap"><img src="http://typophile.com/files/Emirates_6590.jpg"></div><br>
      .<p></p>
      <p>On the other are brands that seek to articulate certain favourable aspects of their regional origins by subtle typographic devices, but choose to be, by and large, international in expression:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Incredible_India_Logo_4100.jpg"></div>. <div class="imageWrap"><img src="http://typophile.com/files/JAL_mark_6026.jpg"></div><br>
      .<p></p>
      <p>One may also look at categories where brands of regional origin went through redesigns to shed vernacular elements in an effort to gain greater international acceptance. Hankook and LG are two brands that did it in their own different ways.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Hankook_5963.jpg"></div>.<div class="imageWrap"><img src="http://typophile.com/files/lg_logo_6366.jpg"></div><br>
      .<br>
      Finally there are the international brands that adapt to vernacular typography in local markets:<br>
      .<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Coke_4664.jpg"></div><br>
      .<br>
      .<p></p>
      <p>So what are the typographic nuances/devices that convey regional flavour? How subtle can these interventions be and still communicate effectively? To what extent can you go before the 'interestingly exotic' becomes 'uncomfortably foreign'?  How far can typography reflect regional forms and still stay 'on brand'?</p>
      <p>Maybe worth a look :)</p>
