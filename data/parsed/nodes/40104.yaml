      <p>Thanks for responding Nick. I think that the problem with the concept of tone etc. is as you say, quite subjective and I’m concerned that I may end up going down the road of type classification which presents a lot of potential traps. To kick it out there a bit further, I think that you could argue (as Bruno Maag has) that the Roman’s Trajan was the first example of lettering being used as a branding tool and onwards and upwards from there.</p>
      <p>I was pottering around with the idea of neutrality and sans serif (with a nod to Kai Bernau and his recent type face) and how this concept extends into branding in supposed neutral zones such as airports etc.</p>
      <p>And then there is also the concept of 'white writing' or 'transparency' where there is a deliberate attempt not to influence tone and we can see examples of this in such things as goverment documents which employ 'Type Writer' style fonts.</p>
      <p>Do type faces help to progress brand...Well often times I suppose the type design is re-designed but the core elements of the brand stay the same no? This may suggest that type design is part of the top soil we associate with brand design and not integral to its DNA - or is it?</p>
