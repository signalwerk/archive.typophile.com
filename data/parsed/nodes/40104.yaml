      <p>Yeah. I think you're onto something there Nick if we can hammer it down a bit more. If I have you right, you're suggesting that a bespoke type face might be as viable in the future as the traditional marque. So this means that the type face is doing all the work instead of the logo. I like it.</p>
      <p>Quite recently I have been doing research into other areas of design and I came across Naoto Fukasawa who has a very interesting approach design.</p>
      <p><a href="http://www.businessweek.com/innovate/content/jun2007/id20070629_200809_page_2.htm" title="http://www.businessweek.com/innovate/content/jun2007/id20070629_200809_page_2.htm">http://www.businessweek.com/innovate/content/jun2007/id20070629_200809_p...</a></p>
      <p>One big issue faced by any large corporation is winning the hearts &amp; minds of people, not just consumers but perhaps more importantly the people who help bring a brand to life, the employees. Naturally you need employees to live the brand and take it in as a way of thinking, so what approach can you take in order to make this happen? One possible suggestion would be to create some interplay between the brand and the employee/consumer. However, the big question is how can this be achieved?</p>
      <p>Is it necessary to break away from rigidity of certain identity guidelines? Is it possible to develop an identity that allows employees the ability to choose how they would like to see the brand represented? Are there any current examples of this now?</p>
