    html: <p>What about "Where Type has become Brand and what made it happen" or "Can type alone equal brand? The next step for corporate typography..." i.e. is there an example of a typeface alone (the letters alone rather than a hackneyed collection of the few letters from a logotype like you sometimes get with e.g. Coca-Cola) connoting all the brand values of a company. So "The logo is dead...long live the font". There have been many relatively recent examples of a logo/marque/visual device being used alone without typography; can this situation be reversed so that one doesn't need a logo but just a font? (Does the 'global village' with its plethora of languages/alphabets/letterforms even allow for that?) or is logo everything?</p>
