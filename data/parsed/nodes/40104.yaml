      <p>Arun</p>
      <p>That is a very interesting take I would never have considered that. I will have to give that some thought as it gives a more global perspective (something an MA project wouldn’t suffer from). I presume getting type right in those cases must be a slow process - little too much and its too kitsch, little too subtle and its lost. </p>
      <p>I’m inclined to agree with James though that the ‘next step’ is humanism and it will be interesting to see it played out. We are possibly seeing quite a bit of it already with looser styles. This may stem from other developments outside of design that appear to be influencing our general psyche.</p>
      <p>Will we start to see a move away from machined looking design? More freestyle?</p>
      <p>I like the concept behind the Bugatti and the idea that the entire car itself represents the marque. No longer will we have the age old acid test of ‘Now take away the logo and see if you can still tell that it's blah blah blah’ the brand will be completely represented in itself.</p>
      <p>Is identity design becoming more amorphous?  </p>
      <p>Does anyone agree with this statment?</p>
