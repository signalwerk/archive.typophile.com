    html: <p>What about the requirement/expectation that a brand has a <em>tone of voice</em>, and the way a typeface is chosen specifically to support or even <em>be</em> that tone of voice (this may be a little subjective but it certainly doesn't depend on the past too much since the corporate typeface business is relatively young and thriving(?), the oldest I can think of being London Underground and the 1916+ Johnston font) chosen for clarity and differentiation in an already busy environment. Branding (and associated typography) is just the same but on a much bigger scale; i.e. there's a lot of noise that a company must rise above if it even to be considered let alone be recognised, then cherished and ultimately advocated. Does a font really help or are branding agencies and/or typeface designers pulling a fast one? (Not necessarily my view but may stimulate discussion.)</p>
