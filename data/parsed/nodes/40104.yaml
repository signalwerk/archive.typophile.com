    <p>Hello Typophile. </p>
    <p>I am in the process of researching a possible question on Type &amp; Branding (with a capital ‘B’) for an MA thesis. </p>
    <p>I have a fair knowledge of typography and type design but I am stuck on trying to find an angle which isn’t just based on an historical analysis. I need a question that opens up the possibility of exploration.</p>
    <p>If any of you out there have any suggestions I would be really grateful.</p>
    <p>I look forward to hearing from you.</p>
    <p>Many thanks.</p>
    <p>Brian</p>
