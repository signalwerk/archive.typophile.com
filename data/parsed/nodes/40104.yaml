      <p>Brian, Armin -- Helvetica alone is an over-ripe plum for the picking. So many companies use Helvetica or a close variant like Akzidenz et al, for their logos, and as Nick Shinn has pointed out, the thing has become the de facto voice of corporate facism.</p>
      <p>I don't know about "facist" connotations, but certainly you could say "blandness" and "homogeniality". Helv is like a dark blue corporate suit---thousands of companies are able to differentiate themselves with different shades (individual logo designs), yet they are all cut from the same basic cloth.</p>
      <p>That's paradoxical.</p>
      <p>How can it be? The answer isn't too hard to figure out, but an etensive explanation might make fascinating reading.</p>
      <p>Then again I could be barking up an ersatz tree with plastic leaves that taste horrible.</p>
      <p>j a m e s</p>
