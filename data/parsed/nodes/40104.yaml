      <p>Brian,</p>
      <p>I'm not quite sure what you are trying to do for your thesis, but the moment I read Type &amp; Branding my mind went into a few examples:</p>
      <p>Apple used Garamond for a while, including during the launch of the iMac in all its candy colored glory (you know, the ones that said YUM in big Garamond, which legend has it was condensed an extra 80% or something like that). You could pinpoint an Apple ad instantly through the use of Garamond. Then one day, bam, Myriad! A complete 180-degree turn in type and brand association.</p>
      <p>A smaller brand, but McSweeney's also uses Garamond until it bleeds.</p>
      <p>Volkswagen and Futura. There is a custom Futura version somewhere just for VW. And it goes all the way back to the iconic Lemon ad.</p>
      <p>Martha Stewart Living and all of the custom H&amp;F-J fonts they use.</p>
      <p>The examples are many -- you could do a whole chapter on Helvetica alone (American Airlines, American Apparel, Parmalat) -- and you could do an interesting study of what fonts make recurring appearances in certain industries, as well as seeing which typefaces become instantly recognizable and associated with a certain brand. Sounds like an interesting challenge. Good luck.</p>
