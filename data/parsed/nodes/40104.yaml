      <p><em>..what may be an interesting concept is that the recent film serves as the death notice for the popularity of fonts like Helvetica.</em></p>
      <p>Your main statement is 25 words or less. It's perfect. I would go ahead and write about that. You cannot possibly miss.</p>
      <p><em>What is the next step?</em></p>
      <p>Humanism. Humanism on digital stilts is the next step. Modernism is a mixed blessing in retreat. There is always a backlash going on. At the same time every shift in typographic style and taste is inescapably retro.</p>
      <p><em>...is logo everything?</em></p>
      <p>i m a g e&nbsp; is everything. Technology is making culture more type-saturated and type-savvy. More type is used in more applications than ever before.</p>
      <p><em>I think he’s pushing the idea of ‘type as product’ and ‘brand extension’, translating a type faces core design elements into another area.</em></p>
      <p>The nearest thing I can think of in that vein is <a href="http://images.google.com/images?gbv=2&amp;svnum=10&amp;hl=en&amp;q=%22bugatti+veyron%22&amp;btnG=Search+Images" target="_new" rel="nofollow">the resurrected Bugatti's use of the EB monogram of legendary marque's founder, Ettore Bugatti.</a></p>
      <p>The EB monogram appears thruout the vehicle, on the engine heads, on each appliance on the dashboard. Look for pics of the inside of the car.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bugatti4_5317.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bugatti1_6533.jpg"></div><p></p>
