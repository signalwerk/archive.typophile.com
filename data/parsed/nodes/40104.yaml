      <p>Armin, James,</p>
      <p>Thanks for posting. I guess Helvetica could be the most topical of all fonts and the most widely recognised. I think also that a backlash (in answer to the Gary Hustwits film) would be topical and possibly needed. The film seems to pay only meek lip service to the counter argument and concerns itself only with Helvetica’s use in lettering. All mentions of Helvetica’s success in continuous text are neatly done away with and I would agree with Paul Rands view that as body text it’s not great.</p>
      <p>What may work about Helvetica is that it is construed as ‘received pronunciation’; a one tone fits all approach. More recently are we starting to see foundries produce popular fonts with a little more character and personality? The fact that The Guardian’s Egyptian face came partially from the teams search for a replacement for Helvetica interests me. Was it changing times that inflected the fonts design? A little more bite? A little less neutral?</p>
      <p>I think what may be an interesting concept is that the recent film serves as the death notice for the popularity of fonts like Helvetica. Is modernist, corporate design finally dead? What is the next step?</p>
      <p>I basically need to find an edge to this thesis that deals with more than just examples of different fonts and their uses within identity design. </p>
      <p>It’s tricky because if I had it my way (and perhaps one day I might!) I would write a straight thesis on type in branding but I think my supervisor is pushing me for something more. I think he’s pushing the idea of ‘type as product’ and ‘brand extension’, translating a type faces core design elements into another area  (i.e. a brand of Helvetica soap, nice clean and neutral). </p>
      <p>He gave me Franco Maria Ricci as an example. It's kinda confused me.</p>
