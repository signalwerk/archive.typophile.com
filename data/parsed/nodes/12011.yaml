    <li><a href="https://web.archive.org/web/20190728111827/http://www.cdt-uba.org/">Carrera de Diseño de Tipografía (<span class="caps">CDT</span>-<span class="caps">UBA</span>)</a> (1 and a half-year postgraduate course) at <a href="https://web.archive.org/web/20190728111827/http://www.uba.ar/">Universidad de Buenos Aires (<span class="caps">UBA</span>)</a>, Buenos Aires, Argentina<br>
