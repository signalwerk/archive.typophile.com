    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: Education</strong></p>
    <p><strong><a href="/wiki/Type%20design" class="freelinking" rel="nofollow">Type design</a> (strictly)</strong></p>
    <ul>
    <li><a href="/wiki/MA%20Typeface%20Design" class="freelinking" rel="nofollow">MA Typeface Design</a></li>
    <li><a href="http://new.typemedia.org/" rel="nofollow">Type &amp; Media</a> (1-year postgraduate course) at <a href="/wiki/Royal%20Academy%20of%20Art" class="freelinking" rel="nofollow">KABK</a>, Den Haag, The Netherlands<br>
    Teachers: <a href="/wiki/Jan%20Willem%20Stas" class="freelinking" rel="nofollow">Jan Willem Stas</a>, <a href="/wiki/Erik%20van%20Blokland" class="freelinking" rel="nofollow">Erik van Blokland</a>, <a href="/wiki/Peter%20Verheul" class="freelinking" rel="nofollow">Peter Verheul</a>, <a href="/wiki/Frank%20Blokland" class="freelinking" rel="nofollow">Frank Blokland</a>, <a href="/wiki/Petr%20van%20Blokland" class="freelinking" rel="nofollow">Petr van Blokland</a>, <a href="/wiki/Fran%C3%A7oise%20Berserik" class="freelinking" rel="nofollow">Françoise Berserik</a>, <a href="/wiki/Peter%20Bi%C4%BEak" class="freelinking" rel="nofollow">Peter Bilak</a>, <a href="/wiki/Robin%20Kinross" class="freelinking" rel="nofollow">Robin Kinross</a>, <a href="/wiki/Paul%20van%20der%20Laan" class="freelinking" rel="nofollow">Paul van der Laan</a>, <a href="/wiki/Frans%20van%20Mourik" class="freelinking" rel="nofollow">Frans van Mourik</a>, <a href="/wiki/Christoph%20Noordzij" class="freelinking" rel="nofollow">Christoph Noordzij</a>, <a href="/wiki/Just%20van%20Rossum" class="freelinking" rel="nofollow">Just van Rossum</a>, <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a><br>
    Language: English
    </li>
    <li><a href="http://www.cdt-uba.org/" rel="nofollow">Carrera de Diseño de Tipografía (CDT-UBA)</a> (1 and a half-year postgraduate course) at <a href="http://www.uba.ar/" rel="nofollow">Universidad de Buenos Aires (UBA)</a>, Buenos Aires, Argentina<br>
    Director: <a href="/wiki/Rub%C3%A9n%20Fontana" class="freelinking" rel="nofollow">Rubén Fontana</a>. Academic coordinator: Marcela Romero. Teachers: Carlos Carpintero, Miguel Catopodis, Pablo Cosgaya, Aldo De Losa, Griselda Flesler, Ruben Fontana, Tomás García Ferrari, Víctor García, Patricio Gatti, Horacio Gorodischer, Alejandro Lo Celso, Darío Muhafara, Betina Naab, Alejandro Paul, Mariana Podetti, María Eugenia Roballos, Eduardo Tunni, Marcela Romero, José Scaglione, Andrés Torresi.<br>
    Language: Spanish
    </li>
    <li>The <a href="http://coopertype.org" target="_blank" rel="nofollow">Type@Cooper</a> certificate programs at the Cooper Union in New York City. Language: English
    </li>
    <li>Certificate of Advanced Studies (CAS) Type Design at <a href="http://weiterbildung.zhdk.ch/angebot.php?id=3119" rel="nofollow">Hochschule der Künste</a>, Zürich, Switzerland. 1-year part-time program.
    </li><li>Master of Advanced Studies (MAS) in Type Design and Typography at <a href="http://weiterbildung.zhdk.ch/angebot.php?id=3116 " rel="nofollow">Hochschule der Künste</a>, Zürich, Switzerland. 2-year part-time program.<br>
    Teachers: <a href="/wiki/Hans-J%C3%BCrg%20Hunziker" class="freelinking" rel="nofollow">Hans-Jürg Hunziker</a>, <a href="/wiki/Andr%C3%A9%20Baldinger" class="freelinking" rel="nofollow">André Baldinger</a>, <a href="/wiki/Rudolf%20Barmettler" class="freelinking" rel="nofollow">Rudolf Barmettler</a>; guest lecturers have included <a href="/wiki/Hans%20Eduard%20Meier" class="freelinking" rel="nofollow">Hans Eduard Meier</a>, <a href="/wiki/Robin%20Kinross" class="freelinking" rel="nofollow">Robin Kinross</a>, <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a>, <a href="/wiki/Gerard%20Unger" class="freelinking" rel="nofollow">Gerard Unger</a>, <a href="/wiki/Erik%20van%20Blokland" class="freelinking" rel="nofollow">Erik van Blokland</a>, <a href="/wiki/Jeremy%20Tankard" class="freelinking" rel="nofollow">Jeremy Tankard</a>, <a href="/wiki/Bruno%20Maag" class="freelinking" rel="nofollow">Bruno Maag</a>, <a href="/wiki/Luc%28as%29%20de%20Groot" class="freelinking" rel="nofollow">Luc(as) de Groot</a>, <a href="/wiki/Ole%20Sch%C3%A4fer" class="freelinking" rel="nofollow">Ole Schäfer</a>, <a href="/wiki/Peter%20Bi%C4%BEak" class="freelinking" rel="nofollow">Peter Bilak</a><br>
    Language: German (plus some French &amp; English)
    </li>
    <li>‘DSAA Création Typographique’ (2-year program) at <a href="/wiki/%C3%89cole%20Sup%C3%A9rieure%20Estienne%20des%20Arts%20et%20Industries%20Graphiques" class="freelinking" rel="nofollow">Ecole Estienne</a>, Paris, France<br>
    Language: French
    </li>
    <li>3-year Bachelor program in Type Design &amp; 1-year ‘Meisterschüler’ program at <a href="/wiki/Hochschule%20fuer%20Grafik%20und%20Buchkunst" class="freelinking" rel="nofollow">Hochschule für Grafik und Buchkunst</a>/Academy of Visual Arts in Leipzig, Germany<br>
    Supervised by <a href="/wiki/Fred%20Smeijers" class="freelinking" rel="nofollow">Fred Smeijers</a><br>
    Language: German (English?)
    </li>
    <li>Master’s degree at <a href="http://www.cegestalt.com/diseno.html" rel="nofollow">Centro de Estudios Gestalt</a>, Veracruz, Mexico<br>
    Language: Spanish
    </li><li>Non-academic: <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a> Operated by <a href="/wiki/David%20Berlow" class="freelinking" rel="nofollow">Berlow</a> and others in <a href="http://www.fontbureau.com/info/" rel="nofollow">Boston, USA</a>, with design collaborators including Roger Black, Cyrus Highsmith, Jill Pichotta, and others, as <a href="http://www.typophile.com/node/40360#comment-249066" rel="nofollow">suggested by Paul</a></li>
    </ul>
    <p>See also: <a href="http://www.typeworkshop.com/index.php?id1=references" rel="nofollow">Studying type design</a> by Luc Devroye.</p>
