    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Zapfino</strong></p>
    <p><a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>’s Zapfino is a fine, elegant script typeface based on <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>’s beautiful calligraphy. What would have on its own been a graceful and beautiful font has, over the years, served as a testbed for advanced typographic technologies, to the point that the most current implementation of Zapfino as of this writing, <a href="http://www.linotype.com/61924/zapfinoextra-family.html">Zapfino Extra Pro</a>, has achieved what seems to be limited sentience. It has an extensive, pan-European character set (barring Greek and Cyrillic, and with many of the diacritical characters drawn by <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a> in close consultation with Zapf), each character form has at least four alternates to make the script flow more naturally, and it has an exceedingly complex set of ligatures and automatic substitutions (implemented by <a href="/node/12151" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Hudson</a> for the <a href="/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> version shipped with Mac <span class="caps">OS</span> X, and by <a href="/node/12241" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adam Twardoch</a> for the Zapfino Extra Pro (Contextual) <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> version available from Linotype). It is a challenging typeface to set and rewards&nbsp;experimentation.</p>
    <p>More information about the various Zapfino fonts, including <span class="caps">PDF</span>s, can be found at the <a href="http://www.linotype.com">Linotype’s website</a> on its <a href="http://www.linotype.com/61924/zapfinoextra-family.html">Zapfino font family page</a>.</p>
