    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Zapfino</strong></p>
    <p><a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>'s Zapfino is a fine, elegant script typeface based on <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>'s beautiful calligraphy. What would have on its own been a graceful and beautiful font has, over the years, served as a testbed for advanced typographic technologies, to the point that the most current implementation of Zapfino as of this writing, <a href="http://www.linotype.com/61924/zapfinoextra-family.html" rel="nofollow">Zapfino Extra Pro</a>, has achieved what seems to be limited sentience. It has an extensive, pan-European character set (barring Greek and Cyrillic, and with many of the diacritical characters drawn by <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a> in close consultation with Zapf), each character form has at least four alternates to make the script flow more naturally, and it has an exceedingly complex set of ligatures and automatic substitutions (implemented by <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a> for the <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> version shipped with Mac OS X, and by <a href="/wiki/Adam%20Twardoch" class="freelinking" rel="nofollow">Adam Twardoch</a> for the Zapfino Extra Pro (Contextual) <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> version available from Linotype). It is a challenging typeface to set and rewards experimentation.</p>
    <p>More information about the various Zapfino fonts, including PDFs, can be found at the <a href="http://www.linotype.com" rel="nofollow">Linotype's website</a> on its <a href="http://www.linotype.com/61924/zapfinoextra-family.html" rel="nofollow">Zapfino font family page</a>.</p>
