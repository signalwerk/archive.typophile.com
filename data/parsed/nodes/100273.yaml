    <p>I'm trying to find Miscellaneous Symbols and Pictograms (1F500 to 1F5FF) in FontLab. I can't seem to locate the relevant page under Codepages or Unicode ranges.</p>
    <p>Is there any way to search in FL?</p>
    <p>Thanks.</p>
