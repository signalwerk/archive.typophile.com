      <p>Thanks Jens. I tried it and it doesn't work. I noticed on the uranges.dat  file when opened in TextEdit shows just the start and end code points, each followed by a comma then the range name, like so:</p>
      <p>0x2460,0x24FF,Enclosed Alphanumerics<br>
      0x2460,0x2473,    Circled numbers<br>
      0x2474,0x2487,    Parenthesized numbers<br>
      0x2488,0x249B,    Numbers period<br>
      0x249C,0x24B5,    Parenthesized Latin letters<br>
      0x24B6,0x24E9,    Circled Latin letters<br>
      0x24EA,0x24EA,    Additional circled numbers </p>
      <p>Yours, however show start,end,start   no comma then range name.</p>
      <p>I tried:<br>
      0x1F500,0x1F5FF, Pictograms     but that didn't work either.<br>
      It's also difficult to know exactly where to put the data.</p>
      <p>That would be a great idea Hrant - It would be so easy for FontLab to have a page available where one could  just copy and paste the data from the internet into the uranges.dat file.</p>
      <p>Nick</p>
