    html: |-
      <p>"uranges.dat" is a text file and can be edited with any plain text editor, e.g. TextEdit if you're on a Mac (make sure to save the file as plain text, not formatted text after any changes).</p>
      <p>You have to add a line for each of your new Unicode ranges with its first and last code point, like this:</p>
      <p><code>0x1D7F6,0x1D7FF,     Math digits monospace<br>
      0x1F500,0x1F5FF,1F500 Pictograms<br>
      0x1F680,0x1F6C5,1F680 Transport and Map Symbols<br>
      0x20000,0x2A6DF,20000 CJK Unified Ideographs Extension B</code></p>
      <p>After a restart of FontLab, the new Unicode range entries will be displayed in the drop-down menu.</p>
