      <p><cite>"Uli, that’s because “forgery” is the wrong word. You should have noticed by now that you’re the only person who uses it this way."</cite></p>
      <p>Cerulean (Mr. Pease):</p>
      <p>Mazzone uses the word "copyfraud" instead of "(copyright notice) forgery".</p>
      <p>I suggest that you read his highly instructive 70-odd-page treatise about "copyfraud" published in this American law journal:</p>
      <p>see <a href="http://papers.ssrn.com/sol3/papers.cfm?abstract_id=787244" title="http://papers.ssrn.com/sol3/papers.cfm?abstract_id=787244">http://papers.ssrn.com/sol3/papers.cfm?abstract_id=787244</a></p>
      <p>I repeatedly said that fonts are non-copyrightable and that users who, by way of EULA, pay for "copyright" licences to non-copyrightable fonts must be considered utter dimwits who can be most easily taken for a ride.</p>
      <p>In his treatise, Mazzone came to the conclusion that not only ordinary Americans, but even American law students are dimwitted to such extent that they can be tricked into believing that they have to pay for "copyright" licences to non-existing copyrights, e.g. even for the "privilege" to quote from the American constitution. Mazzone writes on page 1028:</p>
      <p><cite>"A stunning example: A pocket version of the Constitution popular among law students contains a copyright notice, along with the admonition that “[n]o part of this publication may be reproduced or transmitted in any form or by any means . . . without permission in writing from the publisher. Whatever the Constitution’s framers and ratifiers had in mind when they authorized Congress to create copyright law, they surely did not expect that somebody would one day claim a copyright in the Constitution itself."</cite></p>
      <p>Is America an asylum for dimwits?</p>
