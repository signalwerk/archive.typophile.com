      <p>Agendia &amp; Co: I fail to see "many similarities" except that all three belong to the same genre, to which you may also add Jeremy Tankard's Alchemy and others. I only speak of same genre, not same quality.</p>
      <p>Whether plagiarism or not depends. I assume Ralf knows his own outlines well enough to see if somebody merely moved some nodes or changed details, indicated by his remark "They even kept all my beginner’s mistakes from 2004."<br>
      With Aura/Korsen it <em>could</em> be a different case: The simpler the idea, the more geometric or pixelated typefaces get, and the coarser their grids, the more likely it is that such typefaces look very much the same. But it seems it <em>is not</em> a different case as indicated by details: e.g. in <em>both</em> typefaces, the rounding in bottom horizontal of "e" and top horizontal of "a" direct outwards rather than inwards (as would seem more "natural" to me).</p>
