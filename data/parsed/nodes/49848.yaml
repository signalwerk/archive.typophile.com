  html: |-
    <p>In August 2008 someone from Brest, France bought my font Logotypia Pro from MyFonts:<br><a href="http://www.myfonts.com/fonts/fdi/logotypia-pro/">http://www.myfonts.com/fonts/fdi/logotypia-pro/</a></p>
    <p>That same person is also registered for the website of a type foundry from Brest, France:<br><a href="http://www.gasoligne.com/">http://www.gasoligne.com/</a></p>
    <p>One month after the purchase a new font is released at this foundry:<br><a href="http://www.myfonts.com/fonts/gasoligne/urqinoa/">http://www.myfonts.com/fonts/gasoligne/urqinoa/</a></p>
    <p>Every glyph was modified more or less, but looking at the character map there is no doubt, that this font is directly based on the digital data of my font Logotypia Pro. They even kept all my beginner's mistakes from 2004. </p>
    <p>Here is an overlay of both fonts:<br><img src="/sites/default/files/old-images/Bild12_3455.png"></p>
    <p>So, if you are a typedesigner, please have a look at their <a href="http://www.gasoligne.com/download.htm">current</a> and <a href="http://www.gasoligne.com/in_progress.htm">future</a> designs to check if one of your fonts was also ripped off.</p>
