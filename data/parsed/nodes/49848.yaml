      <p>Wow, what have I started here!? ;-)</p>
      <p>On the matter of inspiration vs. rip-offs:<br>
      There is no useful font without inspiration from other typefaces. We always built our work on other peoples work. But that's not the point here. In every little detail, in every curve and anchor point of Logotypia Pro I made lots of design decisions. No other type designer would make these choices in an identical way, even if this person would digitize my font from a print-out. So when I look at the font mentioned in the first post, I clearly see a font, that was build from the outlines of Logotypia Pro. This is a violation of the End User License Agreement and must be stopped. It's not a question of an "inspired" type design.<br>
      I contacted the Gasoligne foundry and they took their website down within minutes after my email and also asked MyFonts to remove the fonts. There is nothing more for me to ask for. I don't know if their other fonts are rip-offs. That's why the title of this thread has a question mark and that's why I asked other designers to have a look at the Gasoligne fonts. </p>
      <p>I also knew the name and address of the Gasoligne owner when I started this thread, but there was no need to point this information out to anybody here. I have no reason to denunciate or defame the Gasoligne owner in any way aside from the (to me obvious) case of Logotypia vs. Urqinoa. He has made a mistake and he has reacted as quickly as possible when it came to light. So I'm fine with that and I don't hold a grudge against him (any more). We all make mistakes sometimes, don't we?</p>
