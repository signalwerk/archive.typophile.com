      <p>Much to my surprise, Myfonts alias Bitstream removed the forgeries:</p>
      <p><a href="http://www.myfonts.com/fonts/gasoligne/urqinoa/">http://www.myfonts.com/fonts/gasoligne/urqinoa/</a></p>
      <p>The is astonishing, because the Bitstream outfit sells thousands of forgeries, besides its own forgeries made by David Berlow, Matthew Carter, Mike Parker and the other rip-off experts who forged the Linotype fonts described in <a href="http://www.forgers.de/bitstream2.pdf">http://www.forgers.de/bitstream2.pdf</a>.</p>
      <p>For historians of font forgeries, I append a few statements about this Gasoligne font forging outfit from the shut-down website:</p>
      <p><strong>Legal Notices:</strong></p>
      <p>GASOLIGNE TYPOFONDERIE<br>
      SARL GASOLIGNE<br>
      503 431 405 RCS BREST<br>
      FRANCE<br>
      APE 1813Z<br>
      TVA CEE</p>
      <p>GASOLIGNE INC.<br>
      8 RUE JEAN GOSSET<br>
      29200 BREST<br>
      FRANCE</p>
      <p>France: <a href="http://www.gasoligne.com/">http://www.gasoligne.com/</a></p>
      <p><strong>Blurb:</strong></p>
      <p>Gasoligne® is a new french independent digital type foundry, born from the passion of 2 brothers for grafizm.<br>
      Gasoligne® designs, manufactures and sells high quality typefaces.<br>
      This website is the best and first place in the world to find our typefaces.</p>
      <p>Professionnels.<br>
      Nous réalisons des polices d'écritures générales disponibles à la vente auprès des professionnels et particuliers, mais réalisons également tous types de commandes spéciales.<br>
      En effet l'identité d'une marque, d'une société passe par son logo, sa communication commerciale et publicitaire mais plus encore que le message lui-même, l'écriture dessinant ce message devient identitaire. C'est pourquoi nous réalisons également des polices d'écritures exclusives. Nous pouvons également décliner une police à partir de votre logo. Nous répondons à toutes vos demandes.</p>
      <p>Qualité et fiabilité.<br>
      Nous proposons à la vente nos créations de polices d'écritures, mais avant cela nous étions nous-mêmes clients et le sommes toujours ! C'est pour cela que nous apportons à nos créations ce que nous attendons des autres : des réalisations rigoureuses. Avant toute mise en vente nous réalisons de multiples tests et essais de nos créations en version béta, qui sont remaniées de très nombreuses fois jusqu'à ce que nous en soyons rééllement et complètement satisfait. Votre satisfaction est la nôtre.</p>
      <p>Expérience.<br>
      Fort de plusieurs années de créations dans le monde du graphisme et de la calligraphie, le développement professionnel nous a amené à cette typofonderie qui constitue l'aboutissement d'un projet. Mais ce projet marque désormais le commencement d'un nouveau développement dont de nombreux partenaires professionnels font déjà partie.</p>
      <p><strong>Latest Forgeries:</strong></p>
      <p>September 2008<br>
       Urqinoa™ now available on myfonts.com<br>
       Veeko Wide™ is a "starlet" on myfonts.com !<br>
      August 2008<br>
       NeborgSans™ is a "starlet" on myfonts.com !<br>
       Roundabats™ now available on myfonts.com<br>
       Veeko Wide™ now available on myfonts.com<br>
       Neborg™ &amp; NeborgSans™ at 30% off on myfonts.com ! (end 01 sept)<br>
       NeborgSans™ now available on myfonts.com<br>
      New fonts in progress: Barobats™ &amp; Practicitymap™</p>
