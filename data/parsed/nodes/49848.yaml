      <p>What qualifies as a rip off?</p>
      <p>In my opinion most type design starts from some other type design.</p>
      <p>At school I was taught to draw type based on the ancient Roman style, namely the capitals on Hadrian's column. </p>
      <p>Is Trajanus a rip off then?</p>
      <p>I don't think so.</p>
      <p>I am 69 years old, soon to be seventy. I started out as a lettering artist at a large London advertising agency in the fifties. These were the days before photosetting and digital type. Every art director at that company would ask me to draw the headlines "like" some typestyle or another.</p>
      <p>Having read most of the posts here, it seems to me that there is a difference between plagiarism and copyright theft. I have assumed that by rip off, plagiarism is what is meant.</p>
      <p>Bob</p>
