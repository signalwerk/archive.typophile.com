      <p>One suggestion I hope @limi would follow: Whenever you design a logo and you're inexperienced start in this order:</p>
      <ul>
      <li>Get some paper and a pencil. Draw. Write. Associate... For a few days.</li>
      <li>Evaluate what you've drawn and find good and weak points of your best designs. And the ideas/impressions they give. Ask a few people you know what they think these designs provoke in them.</li>
      <li>Put your design into a computer. <strong>Most important: forget about colour for now</strong>. Do it all in black and white. No greys allowed either.</li>
      <li>When you think you're done and others approve it, go and do the full colour version of your logo.</li>
      </ul>
      <p>Most professionals still work in this order. Amateurs tend to do the opposite. Start from the last one and go upwards. Don't do the same mistake yourself.</p>
