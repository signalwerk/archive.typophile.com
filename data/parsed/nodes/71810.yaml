      <p><em>I've made the wings with 80% opacity as an interpretation of the light coming through in wings of a real bf.</em></p>
      <p>This sort of conceptual 'development' would be fine as one component across an identity, but for the logo (as you've presented it) the rationalisation is really clutching at straws.</p>
      <p>Now I'm trying to find the right font for this little insect and figure out how to get it to effect the type somehow (the butterfly effect concept).</p>
      <p>I'd suggest researching the butterfly effect theory and background – any good design outcome starts with research and understanding. Here's an interesting diagram straight from the Butterfly effect wiki page...which I would have thought would be the starting point of any insight into the theory/effect.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/800px-TwoLorenzOrbits_6012.jpg"></div><p></p>
      <p><em>I used to work in the architecture field and we've always wondered if there's really any 'new' design any more, as everything evolves out of inspiration of something else that has been already created. I've also always wondered if a design is ever truly finished. Seems like drawing that line is the biggest challenge.</em></p>
