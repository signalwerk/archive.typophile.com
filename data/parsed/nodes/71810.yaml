      <p>Hi all.<br>
      In regards to the wings, this is a simple side view of the butterfly. Not a perspective. We see only one side of the wings, the left side. I wanted it to be as simple as possible but still recognizable. I've made the wings with 80% opacity as an interpretation of the light coming through in wings of a real bf.     </p>
      <p>Now I'm trying to find the right font for this little insect and figure out how to get it to effect the type somehow (the butterfly effect concept).  @wongxiao, I agree about the splitting of words with colors. It's confusing, unless there's a clever way to do this while keeping it clear it's only one word. I'm trying other ways to impact the font. I'm sure it's there, I just need to find it :)</p>
      <p>@moggycat, I like your philosophical angle. I used to work in the architecture field and we've always wondered if there's really any 'new' design any more, as everything evolves out of inspiration of something else that has been already created. I've also always wondered if a design is ever truly finished. Seems like drawing that line is the biggest challenge.</p>
