    <p>Hi all,</p>
    <p>I've designed the following logo for my husband's start-up. I'd appreciate your opinions.</p>
    <p>Here's a quick blurb about the concept:<br>
    I started by playing around with the letters CCI (the system which is the core of the company) which came to visually depict a butterfly - CIC (imagine the C on the right as a mirror image). It made a lot of sense. For me a butterfly is a symbol of new and fresh beginnings. It's light weight and easy and something everybody wants around - just like the company's products.<br>
    When I showed it to the guys they were even more excited because it reminded them of the butterfly effect which relates to the Chaos theory (<a href="http://en.wikipedia.org/wiki/Butterfly_effect" title="http://en.wikipedia.org/wiki/Butterfly_effect">http://en.wikipedia.org/wiki/Butterfly_effect</a>). It can get complex, but in short it is the idea that even small things can have the greatest impacts. Simple and profound.</p>
    <p>Anyhow, this butterfly went through several revisions until reaching this final one. To enhance the BF effect concept, as it flies over the word Nuveon, it effects the letters by changing their colors from blue to a complimentary yellow. The color of the E is a mix between the yellow and blue to indicate partial change that will be complete once the bf has passed the letter. Makes sense?</p>
    <p>Thanks for your input.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nuv_0630_5255.gif"></div><p></p>
