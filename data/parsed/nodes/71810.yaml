      <p>Alaskan: I think you and DavM are interpreting the logo differently; you are seeing one set of wings (say, the butterfly's left side). DavM is interpreting the butterfly to have one wing on the left and one on the right, (hence the alpha blending of the two wing shapes), and we're seeing sort of an incorrect perspective here. To be honest, I'm not totally sure which one is the original intention....</p>
      <p>I know it's a very attractive idea, but I would strongly consider rethinking the "butterfly changing the letters" concept. The usage of color to set off two un-spaced words is so common, I can't imagine how you'll overcome the immediate reaction in peoples' minds to interpret it this way...but perhaps I'm just not imaginative enough. On a side note, if you ever found yourself in need of an an animated version, say, for a TV commercial (hey, anything's possible, right?), the element of motion would convey the idea unequivocally.</p>
