      <p>I understand constructing the letters make for these kind of forms, but optically the n/u looks a lot wider than the o (even though they might not be). I don’t think the letterforms are especially interesting in themselves, but they also lack overshoots and appear to be heavier in the horizontals compared to the verticals (optically correct monoline is not actually monoline). </p>
      <p>Your butterfly is not such a bad idea, only it does not look very much like one now. The body is out of style with everything else in the logo, and the wings are maybe a little too rigdid? I’d love to see a head or some antennas on there. Colourwise it’s not very butterflyish.</p>
      <p>The colour, as Riccarod mentions, are troublesome. A logo needs to work in b/w, and with the current concept you’ll loose everything. </p>
      <p>That said, I think this could evolve into a fairly decent logo with a little help.</p>
