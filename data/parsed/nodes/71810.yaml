      <p>Thanks for your honest feedback.</p>
      <p>@frode frank, I took your suggestion and modified the bf to look more like one. I really liked the simplicity of it's 'body' so I left it as is. </p>
      <p>The reason for the multiple colors at the font is to reinforce the concept by having the bf impact elements as it flies above them. I like the yellowish color juxtaposing the dark blue because it seems like the bf 'turns the letters on' as it flies above them. I've created 2 different color palettes and 2 ways of handling the font. One with 2 colors, the other with just 1 color at different opacity. </p>
      <p>I've changed the font: I think this one works better. Looks more unified. All letters are at the same hight. I've modified the N a bit to make it even more unified (removed a little line it had). Also it seemed to me more like a tech startup co. font than the previous.</p>
      <p>@Ratbaggy, it'll help if you're a bit more specific. What makes it feels like technology from 10 years ago (gosh, I think I still had a Windows computer back then. The horror!). Does it look more current now, after I've modified it? I'm actually facing a bit of a challenge as this company offers products some of which are geared for more traditional clients (i.e. car manufacturers factories here in Germany), that's why I initially kept dark blue as one of the colors as I see it as more of a traditional color.  </p>
      <p>Thanks again for your feedback.</p>
