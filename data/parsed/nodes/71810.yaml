      <p>I enjoyed reading the following comments on this design project. There are many different interpretations of good design meaning there is good design and there is better design. I think the following discussion has been a effective design process - a well balanced discussion between laziness and overly imaginative art. By laziness I mean it's easy to just create something that communicates the idea of your company, this could of been done in a few minutes. However, you have invested time and energy in this project in an endeavor to produce a logo that is well thought and meaningful. On the other-hand, logo design is not creative art it is design (a concept poorly understood). </p>
      <p>My opinion is keep going - produce as many logo's as possible, write a list of single word adjectives that describes your company and create a simple logo and then get feedback. Exactly, the process your undergoing. You obviously enjoy art and design. </p>
      <p>Rest assured, you get to point realizing after all - we are polymorphic and need to draw the line eventually and this what will define your company. If you feel stuck employ a designer. Cheers.</p>
