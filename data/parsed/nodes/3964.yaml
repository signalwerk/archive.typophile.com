  html: <p>Take a look at Jonathan Barnbrook's <a href="http://www.emigre.com/EF.php?fid=197" target="_blank">Priori</a> (from <a href="http://www.emigre.com/" target="_blank">Emigre</a>) an eclectic set of display faces. It is similar to Jonathan Hoefler's <a href="http://www.typography.com/catalog/proteus/index.html" target="_blank">Proteus Project</a>, in the sense that a given underlying structure becomes the base for a mixture of eclectic fonts that somehow work very well together. <br> <br>I'm not saying Priori and Proteus Project look similar, I'm just noticing a similarity in the approach to building the family. <br> <br>Is this a fair comparison? Are there other font families that take a similar approach? What do you think?</p>
  html_clean: <p>Take a look at Jonathan Barnbrook's <a href="http://www.emigre.com/EF.php?fid=197" target="_blank" class="link-external">Priori</a> (from <a href="http://www.emigre.com/" target="_blank" class="link-external">Emigre</a>) an eclectic set of display faces. It is similar to Jonathan Hoefler's <a href="http://www.typography.com/catalog/proteus/index.html" target="_blank" class="link-external">Proteus Project</a>, in the sense that a given underlying structure becomes the base for a mixture of eclectic fonts that somehow work very well together. <br> <br>I'm not saying Priori and Proteus Project look similar, I'm just noticing a similarity in the approach to building the family. <br> <br>Is this a fair comparison? Are there other font families that take a similar approach? What do you think?</p>
