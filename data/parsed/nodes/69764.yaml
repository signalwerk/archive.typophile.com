  html: <p>I'm currently finishing up my first year of studying graphic design but I find myself already looking ahead towards grad school. While my dream is to receive my MFA from CalArts, I can't help but think realistically and speculate my chances of getting into the program. Don't get me wrong, I'm very proud and confident in the work that I've produced thus far, but I also go to a normal public university. While I absolutely love my instructors and believe in their abilities, my school isn't necessarily known for it's art department, and we have limited resources, especially when compared to our somewhat of a neighbor VCU (about 2 hours away). It's hard not to think that they've already got the upper hand for acceptance into grad programs and even the career field considering how well known and prestigious their program is. At the same time I truly believe that I'm just as hungry and have an equal amount of passion for design as any of those arrogant Richmond kids do, and that's what drives me to learn more and become better. But is that enough to mold me into a worthy CalArts student?</p>
  html_clean: <p>I'm currently finishing up my first year of studying graphic design but I find myself already looking ahead towards grad school. While my dream is to receive my MFA from CalArts, I can't help but think realistically and speculate my chances of getting into the program. Don't get me wrong, I'm very proud and confident in the work that I've produced thus far, but I also go to a normal public university. While I absolutely love my instructors and believe in their abilities, my school isn't necessarily known for it's art department, and we have limited resources, especially when compared to our somewhat of a neighbor VCU (about 2 hours away). It's hard not to think that they've already got the upper hand for acceptance into grad programs and even the career field considering how well known and prestigious their program is. At the same time I truly believe that I'm just as hungry and have an equal amount of passion for design as any of those arrogant Richmond kids do, and that's what drives me to learn more and become better. But is that enough to mold me into a worthy CalArts student?</p>
