    html: <p>Speaking as someone without a design degree (my degree is in English), I can say that when I've been looking for jobs, the fact that I didn't have a design degree kept me from getting called for interviews, so I never had the chance to show those people my portfolio (even though I had ten years of experience). So although those hiring might really only care about what's in your portfolio, there's a good chance they might not call you to look at your portfolio without an applicable degree.</p>
