      <p>When you finish your studies and move to real world, your degree is of not much use. Design companies look at your portfolio, not your degree.</p>
      <p>I went to two different design colleges, but never got a degree. I was hired due to my portfolio. Nobody asked for a degree.</p>
      <p>If you have talent, hone it and get better; use your hours to get better at what you do, and how you do it. I actually believe that 10 000 hours of work makes you good. But take care to have a life as well; burrowing into one direction is not getting you anywhere. Be curious. And keep learning the tools of the trade; if your skills on Illustrator prevent you from doing what you want to do, it means you need more studying. That's how I made it.</p>
      <p>Good luck.</p>
