    html: |-
      <p>sii said: "Only problem with this approach is that third-party apps may not follow that convention and you’ll get fake italics - unless MacOS is clever enough to block this."</p>
      <p>In Mac OS X, as far as I am aware, this is indeed true.<br>
      By default in Cocoa apps, and Carbon apps that use ATSU (which is about 99% of them these days), if the current face has no italic/oblique or bold available, the respective menu items/buttons will be dimmed.<br>
      Nonetheless, software can programmatically request a closest match for a face that has no italic, which will return an italic face from similar font family that has the same traits (proportional, serif, same weight, &amp;c.). The app can then accept this alternative, or reject it and have an oblique algorithmically generated instead.<br>
      For apps that use QuickDraw for text (BBEdit &lt; version 8, maybe others?) oblique is always generated if one doesn't exist.</p>
