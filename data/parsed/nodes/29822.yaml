    html: |-
      <p>There are more differences in character sets than just Arabic and Thai. Lucida Grande has many more characters that Lucida Sans Unicode is missing (I'm comparing Lucida Grande version 5.0d8e1 with Lucida Sans Unicode version 2.03). Lucida Sans Unicode is pretty old and my guess is that Microsoft did not get it updated recently. So Lucida Grande supports some Unicode ranges that were not yet assigned at the time when Lucida Sans Unicode was built, for example Latin Extended Additional (starting with U+1E00 Ḁ). L. Grande has polytonic Greek, many more historical and Asian Cyrillic characters (e.g. U+0468 Ѩ), many more Latin Extended-B characters (e.g. U+0222 Ȣ). The design of some characters has been corrected or updated, e.g. the commaaccent characters (e.g. U+0137 ķ), the phonetic U+0251 (ɑ), the Cyrillic U+0444 (ф) and U+046A (Ѫ), and many others. </p>
      <p>The hinting differs greatly: the stems in Lucida Sans Unicode turn into two pixels at 15 ppem while in Lucida Grande they only do so at 18 ppem. The 17 ppem size of Lucida Grande uses 1-pixel stems plus antialiasing, which does not at all work well in the normal Windows 2000/XP rasterizer. This is evidence that the font has not been hinted with Windows in mind but was specifically hinted for Mac OS X where it works great. However, in Windows XP ClearType, it is Lucida Grande that performs better than Lucida Sans Unicode, which evidently has been "overhinted" and displays a weird high linear contrast up to 24 ppem, while the stems in Lucida Grande appear pleasantly equalized already from 18 ppem on. </p>
      <p>These would be the first quick observations from my side. </p>
      <p>A.</p>
