      <p>I think what he means is that you're trying to use OTL as a kludge for something which would be much better achieved through a keyboard layout which either maps the vowel + number sequences to precomposed glyphs or which maps numbers to combining accents.</p>
      <p>The problem with what you're doing is that á isn't a ligature of a + 2. By treating it as such, your text stream is still going to consist of a2 even if á appears on screen which is going to interfere with search algorithms, etc., and which means that type entered in your font isn't going to work when you switch to another font.</p>
      <p>If you prefer to enter pinyin characters this way, a keyboard layout is going to work with any font which contains the required glyphs, and isn't going to lead to problems with searching or displaying text.</p>
      <p>André</p>
