      <p>I cannot support too forcefully the notion that the font is the wrong place to address a matter better handled by input method: for example, if you want to type 2nd-tone "a" in MS Word, you could set its automated spell-checking to replace an "a" followed by a "2" with á.  Alternatively, there used to be Word macros for this. </p>
      <p>In addition it is worth noting that Unicode officially uses carons (a.k.a. hačeks) rather than breves to indicate pinyin's 3rd tone.  Thus Unicode's official description for ǚ (U+01DA) is "Latin small letter u with diaeresis and caron."  I wish it were an independent character, just in case I wanted to use a breve, as some folks do, but it isn't.  So if I wanted to put 3rd-tone ü in a font with a breve instead of a caron I'd probably still encode it at U+01DA.  But in fact I've given in and use carons when adding tone-marked pinyin vowels to a font: Unicode long since decided Chinese was "ideographic" (over sinologists' preferred "logographic"), in comparison with which haček vs. breve is small potatoes.</p>
      <p>David</p>
