    <p>Hi everybody,<br>
    I'm new to font design. I just started following some Youtube tutorials and some posts in this website. but I have a few issues with ligatures. I apologize if this topic was already covered.</p>
    <p>I wanted to make a font with ligatures of the 4 tones of chinese pin yin.<br>
    usually these tones are defined by numbers. from 1 to 4.<br>
    so I wanted them to appear when I type a vowel + number. something like this:<br>
    a + 1 = ā<br>
    a + 2 = á<br>
    a + 3 = ă<br>
    a + 4 = à<br>
    same thing with e i o u<br>
    I made new font with Fontlab, added the glyphs a_1, a_2, a_3 and a_4 of the ligatures ā á ă à just to try with these. after it works I will add other vowels. then I made a liga feature<strong><br>
    feature liga {<br>
      sub a one by a_1;<br>
      sub a two by a_2;<br>
      sub a three by a_3;<br>
      sub a four by a_4;<br>
    } liga;</strong><br>
    1- In the preview panel I noticed that it works fine in the "OpenType features" panel (left) but it doesn't work in the "preview" panel (middle). is this normal?</p>
    <p>2- when I generate the font as otf and then install it in the font folder and try it in MS Word, it didn't work.<br>
    it shows a1a2a3a4 instead of  āáăà<br>
    but when I change the liga feature (removing the numbers) into <strong><br>
    feature liga {<br>
      sub a b by a_1;<br>
      sub a c by a_2;<br>
      sub a d by a_3;<br>
      sub a e by a_4;<br>
    } liga;</strong><br>
    it works in MS Word when I type:<br>
    a + b = ā<br>
    a + c = á<br>
    a + d = ă<br>
    a + e = à<br>
    but this is not how I wanted it. I wanted it with the numbers 1,2,3,4.<br>
    so is it not possible to use the numbers (one, two, three...) in the ligatures? or is it an issue with MS Word?<br>
    I will be very grateful if anyone has any suggestions.</p>
    <p>thank you for your time.</p>
    <p>NoahVN</p>
