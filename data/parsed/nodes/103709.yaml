  html: |-
    <p>I'll be short: Cern &amp; Cern Display are my choice. I may buy Vaud &amp; Vaud Display as well. Price: The entire Cern family (40 weights) is available for $49 for a limited time. (same price for 40 weights of Vaud family). I intend to buy them instead of Helvetica Neue (just need something helvetica-ish, neutral, familiar, relatively modern looking, a bit unusual, rare etc. for personal use and some occasional website design). </p>
    <p>Links:<br>
    Cern:<br>
    <a href="https://creativemarket.com/ianlynam/6742-Cern-Cern-Display" title="https://creativemarket.com/ianlynam/6742-Cern-Cern-Display">https://creativemarket.com/ianlynam/6742-Cern-Cern-Display</a></p>
    <p>Vaud:<br>
    <a href="https://creativemarket.com/ianlynam/6728-Vaud-Vaud-Display?utm_source=cmembed&amp;utm_medium=link&amp;utm_campaign=6728" title="https://creativemarket.com/ianlynam/6728-Vaud-Vaud-Display?utm_source=cmembed&amp;utm_medium=link&amp;utm_campaign=6728">https://creativemarket.com/ianlynam/6728-Vaud-Vaud-Display?utm_source=cm...</a><br>
    or here:  <a href="http://www.myfonts.com/fonts/wordshape/vaud/" title="http://www.myfonts.com/fonts/wordshape/vaud/">http://www.myfonts.com/fonts/wordshape/vaud/</a></p>
    <p>I thing they're excellent value for money. Any thoughts?</p>
