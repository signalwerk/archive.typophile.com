      <p>I like the first version of the mark better. How would the first version look if the 'C's interlocked (black overlaps blue on left, blue overlaps black on right)? </p>
      <p>Just a note - Century Gothic is Monotype's "rip-off" version of Avant Garde. See <a href="http://www.ms-studio.com/articlesarialsia.html" target="_blank" rel="nofollow">here</a> for more info. I'd recommend using either Avant Garde or Futura rather than Century Gothic.</p>
      <p> - Lex</p>
