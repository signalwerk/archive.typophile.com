      <p>Hmm... I hadn't really thought about it that way, Paul. I'll have to think about it for a little while to see if I can find a way to convey more flexibility. </p>
      <p>Though... I'm not really sure it needs to convey flexibility. They are a firm that specializes in plan implementation -- drafting development regulations and preparing infrastructure financing studies. On the one hand one might think "a consultant should be flexible and accomodating to a clients needs," but on the other hand plans and regulations are notoriously inflexible.</p>
      <p>Perhaps the interlinking designs could communicate that unified, hand-in-hand partnership with the clients...?</p>
      <p>Duncan</p>
