    <p>This is a logo that I am working on for a firm that "prepares development codes." It is a pro bono job that I am doing for a friend, but of course I want it to look nice. I am having some trouble with the typesetting of the name around the symbol. </p>
    <p>Please tell me what you think. Any recommendations, advice or critiques will be warmly welcomed.</p>
    <p>Duncan Robertson</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/CodeStudio_LogoCritique_6209.png"></div><p></p>
