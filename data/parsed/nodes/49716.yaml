      <p>The RayBan logo comes directly from Native American glasses... I have seen them in the Nelson Atkins in Kansas City but I can't seem to find any pictures online.  But I know that the tribe was not called "rayban" but the type they used looks almost identical to it.</p>
      <p>So it's custom...</p>
