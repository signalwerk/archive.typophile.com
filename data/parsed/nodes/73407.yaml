    <p>Does anyone have any experience printing on specialty paper?<br>
    I'm a complete newb when it comes to commercial printers.</p>
    <p>Most online printers have such bad quality paper stock, I want to use my own stock paper from a specialty mill.</p>
    <p>The stocks I want to use are typically 110lb to 120lb and do not really work well with laser, I would need an offset printer or some other alternative?</p>
    <p>Are there any online places that specialize in printing on specialty papers that except full color files?</p>
    <p>Would it be better to just go to a local printer with my paper?</p>
    <p>Also how does the paper size and cut work in offset printers? I can order many different size papers, but which sizes work best for a printer? Say I need business card size or invitation, how exactly do the printers print the sizes, before or after they are cut?</p>
    <p>I know about letterpress and litho, but that is out of my price range ( I think). What I really want is to order some great specialty paper and hand it over to an offset printer with my files and say how much..finding out how to do that is more difficult than I though it would be.</p>
    <p>Any advice appreciated, </p>
    <p>Cheers.</p>
