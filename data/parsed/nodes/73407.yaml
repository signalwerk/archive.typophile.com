    html: |-
      <p>I feel there could be a new generation of printers out there. A new private press.</p>
      <p>Many people working in print now have been working since the 1970s and they are a bit stuck in their ways. First thing out of their mouth is usually, "When I started we did paste-up and you don't even know what that is, you punk." And they drive around in cameros with fuzzy dice dangling from the mirror. And they recollect the 80s and 90s where the money was big, the parties were wild and the coke shipped clean and direct from a cartel.</p>
      <p>Many printers haven't aligned themselves service-wise with how the world is now. And nor have the paper companies: their product is all tied up in levels of distribution, each distributor pulling in their cut.</p>
      <p>Recently a printer visited me because he wanted me to print with him. He brought in a bunch of pizza fliers and blow-in ads for magazines and newspapers. I'm like, "Why are you showing me this junk? I get it in the mail every day."</p>
      <p>I want to print things that honor the tree-matter used in the process. This usually would mean short runs with innovative techniques (how it folds, how it binds, etc etc). It's hard to find a printer who will work with you in this way.</p>
      <p>But they are out there. You have to find them and make a relationship. A good printer helps with the creative -- if they are good and you have a good relationship with them, they are likely to provide ideas of paper, techniques and ways to limit costs.</p>
      <p>In any case: I've spoken with some printers about bringing in my own stock. They are reluctant, but you can get the paper specs from the manufacturer then send the specs to the printer to ensure it will work on their machine with their inks.</p>
      <p>The horrifying thing you learn about is make-ready. Say I want 60 envelopes printed. I would have to buy about 120 envelopes, because 60 will shoot through the press and into the waste. (No different than screen-printing really.)</p>
      <p>Back to the notion of private press: I see people (designers/artists) buying letterpresses, risographs, and more professional silkscreening equipment. I hope this continues to grow.</p>
      <p>Alternatively, most of the online stuff is gang-run on a given stock. This makes it cheaper, but it sounds like you would prefer to do custom work.</p>
