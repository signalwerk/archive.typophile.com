      <p><em>The mark-up on the paper is not exactly bumping up the bottom line a whole lot for smaller jobs of 300-500, which is what I'm looking for.</em></p>
      <p>The per-unit cost is going to look outrageous no matter what, with a quantity that small. Since you can get ten to twelve up (depending on bleed) on a standard letter-size sheet, your printer is likely to use as many--or more--sheets setting up this job than actually printing it.</p>
