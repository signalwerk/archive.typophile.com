    html: |-
      <p>&gt; Say I need business card size or invitation, how<br>
      &gt; exactly do the printers print the sizes, before or<br>
      &gt; after they are cut?</p>
      <p>Depends on the specifics of the job, but typically printers will use large sheets and will print several copies per sheet, then cut them apart after they're dry. Printing multiple copies on each sheet greatly reduces the length of time that the printing press is tied up with the job.</p>
      <p>But for small jobs -- like a few hundred flyers that are 8.5 x 11 -- a printer may just put the job on a small press and print them 1-up, since the entire job will only take a few minutes to print anyway.</p>
      <p>&gt; Would it be better to just go to a<br>
      &gt;  local printer with my paper?</p>
      <p>Most online printers are in the business of providing cheap printing, so it's unlikely they'd work with special stocks just for you, so a local printer might be your best bet. However it's very unusual for a customer to provide their own stock, so they'd probably increase the price since they aren't getting their markup, and you'd need to give them plenty of extra sheets for test copies during setup and so forth. </p>
      <p>If it's an unusual stock, keep in mind that the printer may have no experience printing on it and the results may not be optimal.</p>
