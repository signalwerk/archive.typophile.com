      <p><cite>Would it be better to just go to a local printer with my paper?</cite></p>
      <p>You need to go to a local printer and they will order the paper for you. Good printers will probably not let you supply the paper because it’s not cost-effective to do business with people too cheap to pay the paper markup. Just call up some printers and ask to talk to someone in sales.</p>
