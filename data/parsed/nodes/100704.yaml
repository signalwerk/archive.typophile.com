    html: <p>Should be their corporate typeface simply called "RWC" and, according to this <a class="freelinking external" href="http://www.typophile.com/node/84132#comment-479129" rel="nofollow">previous discussion</a>, designed by <a class="freelinking external" href="http://www.witekite.com/" rel="nofollow">Witekite</a>. It somehow mixes influences from <a class="freelinking external" href="http://www.myfonts.com/search/handel+gothic" rel="nofollow">Handel Gothic</a> (as suggested by Mans) and <a class="freelinking external" href="http://www.myfonts.com/search/akagi" rel="nofollow">Akagi</a>.</p>
