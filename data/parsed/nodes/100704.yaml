    html: |-
      <p>“RUGBY WORLD CUP” looks almost like Frutiger, though not quite.<br>
      “ENGLAND” could be Handel Gothic.<br>
      The numbers look custom-made, and not very well at that.<br>
      [Edit:] Unless it’s available in more weights than the one on MyFonts, the numbers are <em>not</em> in Dairyland. They are too thin.<br>
      <a class="freelinking external" href="http://www.myfonts.com/search/Dairyland/fonts/" rel="nofollow">http://www.myfonts.com/search/Dairyland/fonts/</a></p>
