    html: <p>And I think Alaskan's point on Mac "elegance and professionalism" is a good starting point. Spend some time browsing the Apple site, product literature, etc., and look at what sort of graphic elements they tend to use. What sort of qualities does that look represent or bring to mind? How can you use some of those elements or ideas to reflect those same qualities in the logo for this shop?</p>
