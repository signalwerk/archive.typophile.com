      <p>Ratbaggy is correct, these are all pretty illegible...and the color makes it much worse. I can't stress how important it is to work <strong>ONLY in black and white </strong> until the mark is final, THEN add color last. If you're new to logo design, you really have to trust me on this one. Really!</p>
      <p>Oh, and for what it's worth, I never show a client ANYTHING I wouldn't put in my portfolio and bring to a job interview. You're the designer, not them, and if you show them ten designs, I can pretty much promise they'll pick the absolute worst one, then ... they'll ask you to make it bigger and add a glow. Then, you're stuck creating something you're ashamed of.</p>
      <p>Frankly, none of these designs would have ever left my computer. None of them come even close to the elegance and professionalism Mac buyers are drawn to - and trust. (This comment was typed on a 2009 Macbook Pro.)</p>
      <p>Show clients your best, even if they're a personal friend. If they hate it, you'll learn from their critique why and how to do better. Oh, and tell clients it's ok to hate it, because really it IS ok. A designer needs the truth to do their best work. I always insist clients don't coddle me. I'm not a tortured artist who'll cry if they don't buy my masterpiece, I'm a business partner.</p>
      <p>/end unsolicited, not-design-specific advice</p>
