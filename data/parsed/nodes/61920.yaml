    html: |-
      <p>Uh, there's a pretty big difference between first subpixel font ever and first one you're aware of.  I hate to be the one to break it to you, but the Apple ][gs shipped with one in ROM; you missed this boat by more than 30 years.</p>
      <p>The GameBoy Advance homebrew development community has been using them actively for more than ten years.  I released a program that automatically dumped SPAA fonts for the GBA in probably 2003 or so.  My old webpage has a 3xV (typically 2) font on it - significantly smaller than yours.</p>
      <p>Please don't claim first ever when you haven't even tried looking to see if someone beat you to it.  There are three bitmapped subpixel fonts on the first page of google hits for subpixel font.</p>
      <p>This isn't actually impressive at all; the font on the GRC page from ten years ago looks just as good as this does.  This is just a two-filter matrix applied to a larger font.  Big whoop.</p>
      <p>You'll find people get really bitter when you claim to have beaten them to the punch on something that's actually 30+ years old.</p>
      <p>It's dishonest.</p>
      <p>John Haugeland is <a href="http://fullof.bs/" title="http://fullof.bs/">http://fullof.bs/</a></p>
