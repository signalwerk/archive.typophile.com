      <p><cite>However, the method Gibson describes can also be viewed as a limitation of the way the machine generates color, rather than as a technique intentionally exploited by programmers to increase resolution</cite></p>
      <p>That's a little like saying that the method Ford describes can also be viewed as a limitation of the way engine blocks stably store gasoline, rather than as a technique intentionally exploited by engineers to derive motive force from explosions.</p>
      <p>You know, in that it's completely wrong-headed and ignores the clearly stated intents of the programmers in question when explaining their system in public.  And also, that it misses the significant increase in resolution as compared to the prior text system, which used how the monitor actually worked to produce letters that looked less good.</p>
      <p>It would be best if you considered the quality of the sentiment before citing it as contrary evidence.  Whoever wrote that is the reason Wikipedia is not taken seriously as a source.</p>
      <p><cite>The definition did not chime with what I would describe as a plagiarist so I looked up the definition of plagiarism in the Oxford English Dictionary. It said to ’take (the work or idea of someone else) and pretend it is one’s own work’.</cite></p>
      <p>Contrary to popular belief, the OED isn't actually a very good lexicon; they shovel anything they can half-explain sideways into the book, because size, rather than selectivity or quality, is the OED's selling point.  A better dictionary of British English is the Collins; I personally prefer the American Heritage.</p>
      <p>That said, yes, that's exactly what's being done here.  To take the idea of someone else and pretend it is one's own work.  I fail to see why that's difficult to associate.</p>
