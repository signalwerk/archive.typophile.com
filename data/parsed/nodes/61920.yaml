      <p>Fact is, this is brilliant work. It's perfectly fine that it may be copied work (or derived from another work), even if he was not aware of the prior works. He's not selling it as original art, but if he does, he would be fine there too because it IS original work. And besides, it's a typeface, not the Mona Lisa (sorry miha, it's good but not a priceless work of art).</p>
