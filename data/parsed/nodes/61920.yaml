    html: <p>The Atari home computer systems (late '70s/early '80s) used a similar system with the character set. The "high res" graphics mode actually addressed half a "color clock" on color tv screens. To get a fully white dot on a black background, you had to plot two adjacent coordinates. Otherwise you would get a red or blue dot. You could also get solid red or solid blue by plotting only the odd or even coordinates. It worked very similar to the Apple II. In fact, Pinball Construction Set was able to be ported to the Atari with very little modification because of this (not to mention the fact that they had the same microprocessor).</p>
