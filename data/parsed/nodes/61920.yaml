      <p>In case if you are asking when I am going to finish my typeface: I am working on it! Special characters and feautures are nice, but they do take their time. I also see that accompaining website would be appropriate (not on its very own domain though).</p>
      <p>"<cite>icons shouldn’t be subpixel anti-aliased. They’d be visibly improved only to about 30% of customers, and visually impaired to nearly 70%.</cite>"<br>
      I think they should be. Nothing wrong if they aren't, but why not take the advantage of the hardware.<br>
      Is there any source for the 30% claim? I don't think it's true. I think the majority of web users use LCD screens with RGB order of subpixels, on which the subpixel information is displayed correctly. According to <a href="http://www.microsoft.com/typography/cleartypefaq.mspx" rel="nofollow">Microsoft</a>: "a very small number have a striping order of BGR [on which subpixel design isn't displayed properly]."<br>
      Of course there are users browsing on rotated mobile devices and other display technologies, but they are in minority. I can't check my typeface on CRT display, but Steve Gibson's <a href="http://www.grc.com/ctwhat.htm" rel="nofollow">opinion</a> is "sub-pixel rendering is better than nothing on CRT's", so it can't look bad in absolute terms.</p>
      <p>This is just … web design. Sites aren't displayed optimally for a small number of visitors in a vaste range of cases: for example because of having javascript turned off, no Flash or just too old plugin, outdated browser, (old) mobile device, setting of non-native monitor resolution, zooming in and displaying blurred pictures etc.</p>
      <p>"<cite>three different versions of each glyph, one for each possible subpixel x-starting-position</cite>"<br>
      I won't deny that this thought didn't cross my mind :-)</p>
