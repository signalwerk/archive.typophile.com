      <p>Thomas</p>
      <p>I'm glad you trawled through the long list as I gave up when I didn't immediately see a definitive 'answer'.</p>
      <p>I understand that Miha has conceded that the claim 'first handmade subpixel type' would be inaccurate but that he believes the prior existence of a 'type family' has not been proven.</p>
      <p>I have looked at the example John gave me <a href="http://www.mrob.com/pub/xapple2/index.html" title="http://www.mrob.com/pub/xapple2/index.html">http://www.mrob.com/pub/xapple2/index.html</a> which contained two images showing a pixel font with upper and lower case, in 'thick' and 'thin'.</p>
      <p>If a typeface simply with more than one weight can by definition be called a family, then it's a family. In my eyes, however, the normal expectation of a 'family' for a regular text font is to see at least italic versions of roman and bold as well. As I personally would have difficulty in describing just any two weights a family I looked up a dozen or so definitions and the combination roman-italic-bold-bold italic was generally given as the basic example of a font family which matches the family Miha has designed.</p>
      <p>So, among all John's links was there an example of 'handmade subpixel type' we can all see that shows a typeface with a family of weights rather than just 'thick' and 'thin'? This would solve the dispute very simply. Without one I can understand why Miha is sticking to his 'first' as his type is based on a traditional type family.</p>
      <p>If Miha's claim is proven to be inaccurate then perhaps the 3 pixel x-height is new? I'm sure John will let us know if he thinks it's not.</p>
