      <p>Incidentally with regard to color blind effects, it depends on the kind of color blindness in question.  There are two general groups of color blindness: people whose cones for one or more color ranges have developed to report as a different range (most common) and people whose cones for one or more color ranges are absent, either because they didn't develop or because they were destroyed, typically due to disease.</p>
      <p>People whose cones are for the wrong color (say, red-as-green, green, blue, the most common color blindness type) will see roughly the same quality that normal visioned people will see.  Those people still respond to the third light color, but cannot differentiate it between that and the other color stimulus.  The blue light is caught, but is responded to as green.  There is a minor difference in that the human eye is more sensitive to certain light ranges - we're much better at green than blue, which is why YUV encodes only one quarter the blue range to save on bandwidth - then when one of the photoreceptors reports in the wrong range, it reports a diminished signal, so it's like having dark stripes on whichever of the color pair is less responsive, but the human visual cortex is made to remove partial alpha patterns, so that doesn't really matter much in practice (which is also why most SPAA systems don't try to adjust their output to the sensitivity range of each color).</p>
      <p>People whose sensitivity to a color is absent will see a significantly degraded quality of text, because there will be stripe gaps in important curves and angled lines, and the human brain doesn't like to guess, because that leads to optical illusions, so it decides you must be looking through a fern instead, and interprets the missing rows as a second mask of vertical lines, which is very distracting.  However, this kind of color blindness is rare.</p>
      <p>You can tell the difference by holding up a white board with primary red, green and blue circle on it.  People whose sensitivity is there but mis-labelled will see red, green and green, or whatever.  People whose sensitivity is absent will see red, green and black, or whatever.</p>
      <p>If they see two colors, one repeated, they'll report a quality font rendering.  If they see two colors and black, they'll report a very poor font rendering.</p>
