      <p>Gingerbeard Man: here's the Win98 (?) tool I threw together a billion years ago to dump them.  It looks kind of broken in Vista, due to changing border sizes, but it's usable; in XP mode in Win7 it works exactly as expected.  It's going to dump a horizontal PNG with Microsoft's cleartype filter.  I confess to a strong preference for Microsoft's filter over Apple's.</p>
      <p>The two pulldowns at the bottom are the character range to dump (you can do limited ranges, or it's good up into unicode.)  It isn't smart enough to skip unimplemented characters.</p>
      <p><a href="http://sc.tri-bit.com/outgoing/DumpFont.exe" title="http://sc.tri-bit.com/outgoing/DumpFont.exe">http://sc.tri-bit.com/outgoing/DumpFont.exe</a></p>
      <p>Please note that both my tool and the Ruby tool are fundamentally flawed: they're generating images, which are not equivalent to a subpixel font because they lock the characters into one of the three primary physical positions.  I re-render each character individually to keep from generating weird pseudo-kerning effects.  (The ruby script might too; I haven't looked.)  However, real SPAA requires a live font engine with knowledge of the screen and access to a vector font; image dumps can never be a real subpixel font (it could be faked with three subpixel image sets and some complex positioning, I guess.)</p>
      <p>Obviously, as an executable from the internet, scan it seventy five bujillion times with antivirus.</p>
      <p>John Haugeland is <a href="http://fullof.bs/" title="http://fullof.bs/">http://fullof.bs/</a></p>
