      <p>Thomas, do you really think John Haugeland is right? I've asked for a handmade subpixel type family already in my first reply to him, but really couldn't find any. Is there a specific link that convinced you? <a class="freelinking external" href="http://web.archive.org/web/19990128033152/http://www.airwindows.com/shareware/fonts/index.html" rel="nofollow">The link</a> to time machine looked promising on the first sight, but there is only greyscale antialiasing.</p>
      <p>The criticism for my title could be that it is just nitpicking – heck, the difference between first whole family and first typeface with one style is small, it's just a small step forward with evolutionary nature. Thinking more if this title really matters I came to conclusion that it doesn't, typeface is already special, it would be more important to make it better than wasting my energy here. Besides, there is a possibility that we can't know the truth because such typeface isn't/wasn't documented on internet. I didn't change the title because it would look like that I believe John Haugeland is right.</p>
