      <p>"Very neat. But alpha blending to anything other than white will be cumbersome. "</p>
      <p>It's actually not too bad.  Using the 1,2,3,2,1 filter which may be read about at GRC, you get color balance without burn or channel burn, and since it's so small, you can implement it in the registers on basically any modern embedded CPU (or in matrices in a SSE machine, but I can't imagine anyone would worry about font alpha on a processor that large.)</p>
      <p>I had subpixel truetype with alpha rendering working for full-screen 8-pixel Arial on the GameBoy Advance (an arm7 running at 16mhz) in single frames (1/60, roughly, of a second.)  The GameBoy Advance is approximately half of nothing, in terms of processing power.</p>
      <p>Granted, all I was doing was using <a href="http://freetype.org" rel="nofollow">FreeType 2</a>, so my role in that work was basically typing #include and hitting compile, but the point is, alpha actually isn't expensive at all, in any practical sense.  You spend a whole lot more CPU power alpha blending every single window border on a Vista machine running Aero without DX10 shaders.</p>
      <p>It's basically a blitter, honestly.  Generate the font grid and then apply it to the background like you would an alpha texture.  It's pretty much the same thing you'd use to draw sprites on a Commodore 64, but with three multiplies per pixel (or four shifts and an XOR, if you do your old-bear reading.)</p>
