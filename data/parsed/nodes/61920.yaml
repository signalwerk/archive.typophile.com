      <p>It's worth noting that sensitivity to color fringing of ClearType (et aliae) varies very much by the individual, and it's a fairly small minority that are highly bothered by it. So "it bugs me" is not the same as "it is objectively worse."</p>
      <p>That being said, as somebody who likes ClearType and normally sees a substantial improvement by it, the difference between the two samples does not seem all that great, and if 10% or more are bothered by the color fringing, maybe straight greyscale would be preferable.</p>
      <p>Cheers,</p>
      <p>T</p>
