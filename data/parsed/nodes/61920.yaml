      <p>I know there is a nitpicking from my side, because difference between first such typeface versus type family (more weights) is a rather small, and maybe just unimportant … (I changed the title only once, to reflect this).</p>
      <p>Because there were (are) very impolite posts not showing a type family – but million other things instead, I didn't want to change it. Ironically, if he said he was sure there was such type <em>families</em> before, but just can't find anything, I would change it as well. Even more ironically, I think the title such as "<em>The name</em>, a 3px x-height typeface" would be better.</p>
      <p>Maybe it was a mistake not responding to his lies after I saw discussion is impossible. And now, I just can't change the title, because regular users of Typophile may think I am indeed dishonest … and after thousands of words and dozens of links which no regular user clicked on &amp; studied them it may really seem so :-(<br>
      _</p>
      <p>Matt, thanks!</p>
      <p>Fran, I am noob myself (sorry if you are not!). I wanted to make the format as simple as possible for designers. And you are right about hex values, but you couldn't know that typeface is not finished in this aspect either. There are no lines under capitals because I haven't added them yet. Also, in the last posted file there should be no red dots in bold italic.<br>
      Relation between white/red/"black": all "black" dots under one glyph represent the width of that glyph, from left sidebearing to the right. But a part of the glyph can extends even more on the left or to the right, this is why there is sometimes white dot after the red (see <em>f</em> for example). A glyph ends with another red dot (which is used for next glyph). But what if glyph is the last in the line? There should be another red dot to "stop" it. (but if you look at my example you will notice there is no dot after z :))<br>
      The beauty of this is that you can move glyphs around in any way you want, and make it look exactly as you want (I made the curly border, for example). The downside is you can't use exactly red pixels elsewhere (and some other colors for additinal weights and feautures).</p>
