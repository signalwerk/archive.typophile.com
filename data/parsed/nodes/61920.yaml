      <p><cite>"You’d be a fool to think you could find proof of anything in a quick web search."</cite></p>
      <p>Actually, I was able to find quite a bit of proof with quick google searches some time, and I documented such here.  Perhaps you should catch up on the thread before making further sweeping generalizations.</p>
      <p>Patents exist for the sole reason of establishing order of primacy proof.</p>
      <p>It is amusing to see you say "you'd be a fool to think you could do that thing you just did a couple of days ago", though.</p>
      <p><cite>"As far as Asperger’s Syndrome goes, I do have some knowledge of it from my brother."</cite></p>
      <p>I am not interested, and I confess to having a very difficult time believing someone who has this terrible affliction in their family would make such a crass and grossly inappropriate claim in public.  Do not follow this line of reasoning any further.  Your behavior is highly inappropriate.</p>
      <p><cite>"I certainly wasn't trying to shame you."</cite></p>
      <p>Riiiiiiight.  You just speculated on my mental health in public based on a dislike for the things I said, and told me to go to a doctor and ask whether I had mental health problems because I chose to stand up and say "this dishonesty isn't right."</p>
      <p>You undermine yourself by saying such transparent things.  </p>
      <p><cite>"“I would make an example by claiming rights to some of your work, but I can’t find any.”</cite></p>
      <p>Whatever anyone has said about you, I think you must agree that the above statement is both aggressive and deeply unpleasant."</p>
      <p>I most certainly do not.  It's a simple thing to say: I'd try to show you how it feels for someone to make a claim to your work inappropriately, but I spent about 30 seconds looking for some and gave up because it was boring to search for things I couldn't find under a relatively common name.  There's nothing aggressive or unpleasant about it.  I think you should read the things you're saying to me before making so much as a single more comment about my being unpleasant; your behavior is far worse than that about which you complain (which seems to be de rigeur here.)</p>
      <p>Certainly someone who speculates about people's mental health in public should feel it relatively difficult to claim that someone else who said "I stopped googling" is being unpleasant.</p>
      <p><cite>"Just because I haven’t as yet made my work available on the Worldwide Interweb, it doesn’t mean I haven’t done any"</cite></p>
      <p>(blinks)  Who said you hadn't done any?  I just said I couldn't find some to use as an example.  It's not really fair for you to get angry at me for things I didn't say.</p>
      <p><cite>"and your rank arrogance"</cite></p>
      <p>Ah yes, I'm the aggressive one.  For saying I couldn't find something on Google which apparently isn't on the web at all.  Which empowers you to call me "rank arrogan[t]", because apparently either arrogance has an aroma or a position in a heirarchy.</p>
      <p><cite>"in suggesting that you would, “make an example by claiming rights” to it is hopefully beneath you."</cite></p>
      <p>I can't even figure out what you're trying to say.  It should be beneath me to describe as a thought experiment that hypothetically I made claim to your work while saying I was pretending it to show you why it was hurtful?</p>
      <p>... I just don't see what you're angry about here.</p>
      <p><cite>"“If I’m happy about the new video game I just wrote, should I call it the first video game ever?”</cite></p>
      <p>Hell yeah!"</p>
      <p>At this point it becomes clear that I should not be listening to you.  You are advising me to be dishonest on grounds of pride.</p>
      <p>No thanks.</p>
      <p><cite>In that moment in time. It may be cheeky, it may be flawed.</cite></p>
      <p>No.  It's called a "blatant lie".  If you are unfamiliar with the difference between cheeky and flawed, and lying openly about your accomplishments to garner notoriety, then I'm just not sure what to tell you.</p>
      <p>It is never appropriate to claim a world first when you know for a fact it isn't true.  Lying has nothing to do with being proud or being cheeky.  It has to do with having a serious character failure and an infamiliarity with basic adult behavior.</p>
      <p>The reason the word "liar" hurts so much is that you're supposed to be horrified at the idea of being one.  It's not an invitation to mince it into carefully re-framed spin that makes it look like repeated false claims to world firsts are just someone taking pride in their work.</p>
      <p>They aren't, and it's a sentiment which is toxic to civilization.  It's so toxic in fact that it's illegal in most of the modern world for a journalist to knowingly lie.</p>
      <p>Any further advice you give on what makes it okay to make statements which one knows to be false will make it fundamentally impossible to listen to you, I'm afraid.  If your goal is to talk, great, keep it up.  If your goal is to discuss and be listened to, find something to say which isn't pretending it's okay to lie in public because it makes you feel good.  It isn't, and merely reciting the idea makes most listener's stomachs queasy.</p>
      <p><cite>These words weren’t carved in stone, they were genuine feelings expressed by someone whom it would be difficult to label a rip-off merchant.</cite></p>
      <p>Making claims to world firsts isn't a "genuine feeling", it's a falsehood.  This isn't a therapy session.  It's a known to be false claim to accomplishment which is being published and re-published, and no matter how many times you try to find some way to slice and dice that until it looks like something different, that remains the fundamental nature of this issue.</p>
      <p><cite>whom it would be difficult to label a rip-off merchant.</cite></p>
      <p>It'd also be difficult to label them a basketball player.  Luckily I didn't use either phrase.  Please refrain from further straw men.</p>
      <p><cite>"but maybe focus your energy on other projects"</cite></p>
      <p>This isn't a project.  This is a promise to an aggrieved friend.</p>
