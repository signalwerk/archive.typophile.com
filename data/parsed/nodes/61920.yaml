      <p>"But can’t you see the joy in the title; this is an artist expressing their pleasure in a job well."</p>
      <p>Joy does not excuse falsehood.  If I'm happy about the new video game I just wrote, should I call it the first video game ever?</p>
      <p>"Miha hasn’t ripped them off."</p>
      <p>We disagree.  My opinion is that claiming the first ever is an enormous ripoff to the dozens of people who beat him to it by decades.</p>
      <p>I would make an example by claiming rights to some of your work, but I can't find any.</p>
      <p>"Believe me, I know what it’s like when an idea I’ve had gets nicked before I’ve had a chance to put it out there."</p>
      <p>That's a very different situation.  Being beaten to the punch is a bear, sure, but that isn't what's happened here at all.  Miha would need a time machine and 30 years of time gasoline for this viewpoint to be appropriate.</p>
      <p>"Miha hasn’t deprived anyone else of income or kudos"</p>
      <p>The former, no.  The latter, we disagree: Google now attributes this significant technical success of yester-year to Miha.  That is depriving the appropriate people of kudos.</p>
      <p>"The wording of the title of his/her offering is relatively unimportant."</p>
      <p>The fact that someone looking into the history of subpixel fonts now thinks that Miha came up with this in 2009 is contrary to this viewpoint.</p>
      <p>However, this is a matter of opinion, so I cannot say that you are wrong, only that we disagree strenuously.</p>
      <p>I appreciate that you've become civil.</p>
