      <p>"This is really cool!</p>
      <p>How did you decide how to choose the pixel colors to address the subpixels? Are you using the [1/9,2/9,3/9,2/9,1/9] filter described by Steve Gibson in the link you mentioned above?"</p>
      <p>No, this is a simple boolean channel rendering.  This is subpixel, but it isn't anti-aliased.</p>
      <p>If you take the time to write out each combination of the three channels in a pixel, then do the math to see what they turn up, you get the top eight colors from ANSI, except with gray as black instead.  A web designer would call them #000, #00F, #0F0, #0FF, #F00, #F0F, #FF0 and #FFF.  Each F is an on (or "white") subpixel, and each 0 is an off (or "black") subpixel.</p>
      <p>The key to understanding the effect is to forget about the relationship between color channels and composite pixel color, and instead to view things like the cerebral cortex does - as a black mask over a varying-color background.</p>
      <p>The brain processes the mask _before_ it composites the color.  The fineness of the subpixel line is present explicitly because it is position independant of color.  Color is honestly forgotten.  You forget it too.</p>
      <p>Look at the top of a capital A.  It'll just be one sub-pixel, but it still looks black in a white background, even though whatever pixel that's in is down one color channel.  Why isn't it magenta, yellow or cyan?</p>
      <p>Because the brain sees a black mask there, and interprets the background color as an iridescent range which is *later* blended together.</p>
      <p>GRC's 1,2,3,2,1 filter is for anti-aliasing within that mask.  The reason that filter exists is that raw anti-aliasing spreads artifacts over the color channels, which then become visible as net color changes.  </p>
      <p>But this font isn't anti-aliased at all.  It's subpixel.  The two are seperate concepts which can be applied together, but have not been here.</p>
      <p>GRC's capital A example is exactly what's going on here: there is no anti-aliasing at all, but since the effect of subpixel is stronger than AA, it still looks better than AA.</p>
      <p>1,2,3,2,1 is about doing both at the same time while managing color fringes.</p>
