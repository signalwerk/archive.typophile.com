      <p><cite>Firefox warned me against accessing the website John supplied, so, from a different website <a href="http://www.freepatentsonline.com/4079458.pdf" title="http://www.freepatentsonline.com/4079458.pdf">http://www.freepatentsonline.com/4079458.pdf</a>, I see the inventors for Patent 4079458 ’High resolution character generator’ are listed as: Rider, Ronald E. (Menlo Park, CA) and Lampson, Butler W. (Portola Valley, CA) with Assignee as Xerox Corporation. Where’s Wozniak? Where’s Apple?</cite></p>
      <p>Apple and Xerox have a long standing relationship.  HRCG is Apple's commercialization of Xerox' technology.  It's relatively easy to find examples of output, or to get copies of the DOS Tool Kit ][ disk, which still has a copy of HRCG, for emulators.  This is the relationship which later led Apple to commercialize Xerox' GUI technology as the Lisa, then later the Macintosh.  Most of the technologies commonly ascribed to Apple's early wizardry actually came from the Xerox Palo Alto Research Center.</p>
      <p><a href="http://www.mrob.com/pub/xapple2/index.html" title="http://www.mrob.com/pub/xapple2/index.html">http://www.mrob.com/pub/xapple2/index.html</a></p>
      <p><cite>In the patent I do not see any typefaces let alone type families</cite></p>
      <p>Not particularly surprising.  However, with cursory research, they're easily findable, for example at that page I just gave you.  They're also all over a bunch of my other links.  I'm sure you'll manage.</p>
