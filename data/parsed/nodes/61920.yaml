      <p>I totally agree with Thomas on which fonts can comprise a font family.</p>
      <p>A type family is based on the unique characteristics of a single typeface, eg, Arial (Regular), and contains fonts which vary the weight and/or width of that original weight. Even 'super' families such as ITC Stone (which has four subgroups - serif, sans serif, informal and humanistic) are still derived from the basic shape and character a single typeface. A "group of fonts meant to work well together" is just that. I don't think it even has a name unless it is 'sympathetic fonts'.</p>
      <p>The simple visual demonstration of a type family is Univers (see below).</p>
      <p>Adobe sells Univers as a 'type family': <a href="http://store4.adobe.com/cfusion/store/html/index.cfm?event=displayFontPackage&amp;nr=0&amp;store=OLS-US&amp;code=1791&amp;newsample=hello&amp;view=View" title="http://store4.adobe.com/cfusion/store/html/index.cfm?event=displayFontPackage&amp;nr=0&amp;store=OLS-US&amp;code=1791&amp;newsample=hello&amp;view=View">http://store4.adobe.com/cfusion/store/html/index.cfm?event=displayFontPa...</a></p>
      <p>Adobe sells separate fonts grouped together as 'collections', eg:<br>
      <a href="http://store4.adobe.com/cfusion/store/html/index.cfm?&amp;store=OLS-US&amp;event=displayFontPackage&amp;code=1914" title="http://store4.adobe.com/cfusion/store/html/index.cfm?&amp;store=OLS-US&amp;event=displayFontPackage&amp;code=1914">http://store4.adobe.com/cfusion/store/html/index.cfm?&amp;store=OLS-US&amp;event...</a></p>
      <p>Strike throughs and underlines aren't additional weights in a font family because the weight of type they underline or strike through already exists. They are an extension of an existing weight. (Has the confusion arisen because software programs behind the scenes treat each extension or added style/effect as a separate weight, or are they created by automatically stylising an existing weight?) Programs like Word then muddy the waters further by allowing a weight like Arial Italic to be both a separate font AND a 'style' of Arial Regular! </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Univers_4771.png"></div><p></p>
