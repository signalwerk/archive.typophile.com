      <p>DontBugMe: That would be primarily because I haven't claimed to have achieved anything here.  That said, subpixelling an icon is tremendously simple work; subpixelling the YouTube icon is about a ten minute job.  Give it a try yourself, using the rules I outlined above, the tutorial I wrote on how to do that in 2005, or the editor I half-wrote and posted in the links.</p>
