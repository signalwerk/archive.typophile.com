      <p>Sorry to divert from the actual typefaces Miha is trying to produce – the topic is not one I am familiar with but I'm finding it quite interesting. The 'John Haugeland' question is impossible to avoid. His 'educational' posts are well tempered and informative and add to the topic. The 'first' related posts are something else. As John keeps on berating people for not reading what he says I have been trying to follow through on his weblinks but so far I am struggling to see in them any physical examples that prove that the current claim 'First handmade subpixel type family, ever' is totally erroneous. My total ignorance of the subject matter is a hindrance but I have already come up against a few problems:</p>
      <p>Wozniak for the honour first 'handmade subpixel typeface'? Or not?</p>
      <p>John Haugeland claims:<br>
      "Here’s HRCG (High-Resolution Character Generator), which is Apple doing a handmade subpixel type family in 1976, US Patent 4079458."</p>
      <p>Firefox warned me against accessing the website John supplied, so, from a different website <a href="http://www.freepatentsonline.com/4079458.pdf" title="http://www.freepatentsonline.com/4079458.pdf">http://www.freepatentsonline.com/4079458.pdf</a>, I see the inventors for Patent 4079458 'High resolution character generator' are listed as: Rider, Ronald E. (Menlo Park, CA) and Lampson, Butler W. (Portola Valley, CA) with Assignee as Xerox Corporation. Where's Wozniak? Where's Apple?</p>
      <p>In the patent I do not see any typefaces let alone type families and the patent seems to be concerned with 'character generation' which is an automatic process not a 'handmade' process.</p>
      <p>Then on the Wikipedia page on subpixel rendering  <a href="http://en.wikipedia.org/wiki/Sub_pixel_rendering" title="http://en.wikipedia.org/wiki/Sub_pixel_rendering">http://en.wikipedia.org/wiki/Sub_pixel_rendering</a> does not appear to tally with John's opinions. It currently reads:</p>
      <p>    Originally invented by IBM in 1988, subpixel rendering . . .</p>
      <p>    Subpixel Rendering and the Apple II:</p>
      <p>    It is sometimes claimed (e.g. by Steve Gibson) that the Apple II supported an early form of subpixel rendering in its high-resolution (280x192) graphics mode. However, the method Gibson describes can also be viewed as a limitation of the way the machine generates color, rather than as a technique intentionally exploited by programmers to increase resolution.. .</p>
      <p>    While the quote from Apple II inventor Steve Wozniak on Gibson's page seems to imply that Apple II graphics programmers routinely used subpixel rendering, it is difficult to make a case that many of them thought of what they were doing in such terms.</p>
      <p>Plagiarism</p>
      <p>John says</p>
      <p>    "Grow up. Plagiarists - that word means “someone who steals someone else’s credit”, not work - deserve a lot worse than a series of originally polite but increasingly disappointed comments giving concrete counter-examples."</p>
      <p>The definition did not chime with what I would describe as a plagiarist so I looked up the definition of plagiarism in the Oxford English Dictionary. It said to 'take (the work or idea of someone else) and pretend it is one's own work'.<br>
      So John, I will refrain from telling you to "grow up", but you are plain and simply wrong in your definition of plagiarism. You have to steal the work first before you can steal credit for it. Miha did not steal Steve Wozniak's work, anyone else's work, nor pretend it was his own work. Yes, he claimed to be a 'first' but he did not steal someone else's work and pass it off as a 'first', he applied it to his own work. But I agree Miha's claim should be accurate and thus changed if proven false. Similarly you should retract your claim of plagiarism as it is based on your faulty definition and is not true.</p>
      <p>Conflict resolution</p>
      <p>Given my ignorance and the esoteric nature of the topic it would appear to me the accuracy of Miha's claim to 'First handmade subpixel type family, ever' would be simply resolved by John supplying not a multitude of ripostes and weblinks but a simple image (with provenance) that we can all see immediately proves his point. To do this, in my mind, it must satisfy all the following criteria in order to convince Miha his claim needs to be amended:</p>
      <p>    a subpixel font showing a family of weights, not just a single weight, which have not been generated automatically but where the subpixel composition of the different weights of characters was selected and refined by human not machine.</p>
      <p>I hope Miha is happy that my wording matches his claim.</p>
