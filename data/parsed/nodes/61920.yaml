  date_raw: 12 Sep 2009 — 9:51am
  votes: null
  html: |-
    <p>It has x-height of 3 pixels, it is italic, inspired by old masters and most important – made by hand. You must not look too closely, because colors get visible. It's work in progress. Here:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/sbpx_3996.png"></div><br>
    I am also writing a program which will set text automatically. These horizontal lines in the picture is actually information about glyph unicode value and positioning.<p></p>
    <p>It can be used in favicons and for … well, one reason is enough :-)</p>
    <p>Scroll down for additional weights of roman, <strong>bold</strong> &amp; <em><strong>bold italic</strong></em>.</p>
    <p>The title was "First Handmade Subpixel Type Family, Ever*".<br>
    [* Moderator's note: Miha's enthusiastic use of the claim "first ever" has been seriously challenged by StoneCypher. Read on for the drama and sub-pixel intrigue, if you dare!]</p>
    <p>PS: <a class="freelinking external" href="http://mrl.nyu.edu/~perlin/homepage2006/tinyfont/index.html" rel="nofollow">Ken Perlin's work</a> is interesting too.</p>
