      <p>Thank you for your kind comments! I had similar feelings, this is why I hurried and just had to post the typeface even with some glyphs not done.</p>
      <p>Darrel: You can start by reading the two links I posted above and then study The bee's knees in detail. If you look at italic <em>l</em> or <em>[</em> you will notice how pixels start to repeat and how diagonals are made.</p>
      <p>I think legibility is the same or just minutely better for colour blind people. There was already discussion of this on Typophile, but some arguments were not even mentioned (for example, various combinations of color blindness type and text color give different legibility).</p>
      <p>I decided to make the hard glyphs on the end … my excuse is until I finish program for automatic layout I can't quickly enough test them. Indeed the "e" and "s" are the most problematic. Maybe I can help with a <em>two</em> pixels x-height font? (<a href="http://typophile.com/node/51521#comment-311880" rel="nofollow">here</a>)</p>
