    html: |-
      <p>Believe me, I am amused myself :-). Specially when thinking whether it's worth to do monospaced numerals, case-sensitive parentheses and such.</p>
      <p>Some colors were copied form Windows rendering and maybe mixed further (I have saved them in palette a very long time ago).  I have five shades of both blue and red and three grays, but it's more important how you combine these colors.</p>
      <p>In italic, stem is just a little less than 1 pixel wide. It is mostly presented with two pixels of red and blue: sometimes, it's dark red &amp; light blue (pixel seems to be more on left); dark blue &amp; light red (pixel seems to be more on the right); or both pixels of equal lightness. Actually I use this mentioned filter, but more from experience.</p>
      <p>Italic glyphs always start with red and end with blue, because this way they can be set in words together without problems. For some glyphs, such as en dash, 70% (or less) gray color is used.</p>
      <p>Hardware may be a problem, but most LCDs have the same positioning of subpixels.</p>
