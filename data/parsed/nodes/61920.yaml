      <p>What Miha made is actually a single font with several faces, not a family at all.  Citation should be easy for people here to find, since they're so many type enthusiasts, but since a person doesn't make claims without evidence, you can find such discussions in Meggs (aka "Typographic Design: Form and Communication", doesn't show up until the yellow 2006 edition, so if you have the cyan 2002 you won't find it) as well as in one of the iF yearbooks, where I initially learned this (not sure, think it's 2005.)</p>
      <p>But I wasn't going to argue that, because what Miha meant was clear, so I figured I'd just work with what Miha thought the terminology meant.  'Cause you know, that isn't a first either.</p>
      <p>John Haugeland is <a href="http://fullof.bs/" title="http://fullof.bs/">http://fullof.bs/</a></p>
