      <p><em><strong>Thomas Phinney</strong></em>: That usually means one of four things.  I was wondering whether you could distinguish between them, or offer an alternative.</p>
      <p>1) I'm misremembering.<br>
      2) I'm citing a source correctly, but that source is full of crap (eg wikipedia).<br>
      3) I'm citing an obsolete or archaic source (books that have since been superceded), or a source affected by language differences (eg british english, translation)<br>
      4) It's a matter of divided opinion, of which I am unaware.</p>
      <p>Are any of those four cases what's happening here?</p>
      <p>I should also point out for the record that Adobe uses the nomenclature I gave.  There was an old technology on the NeXT called "multiple master fonts", which were awesome: they were hand-hinted explicitly scalable fonts, so the artists could set algorithms for how the fonts thickened, and so the end user could just drag a slider each to set the boldness and the italicness of the font.  (I believe the technology failed because they were preposterously difficult even for professionals to make.)  Adobe used the nomenclature "derived faces", and described sets of "multiple master fonts" as a family.  So, for example, the MMF family that came with the NeXT was [jensen, miriam, kepler, something-forgotten], and you could buy other families - four or five fonts each, generally - for $80, which back then was an absolute steal.</p>
      <p>Also, all the old typesetting books I inherited from my grandfather use the term as I had believed and presented.</p>
      <p>Thank you for clarification on the matter.</p>
      <p>John Haugeland is <a href="http://fullof.bs/" title="http://fullof.bs/">http://fullof.bs/</a></p>
