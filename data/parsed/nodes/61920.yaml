      <p>The possibility of subpixel lettering isn't exactly exclusive to LCD monitors, but they certainly help.</p>
      <p>Long ago I used to do subpixel editing for graphics in Pinball Construction Set on the Apple ][, including lettering with a technique not entirely unlike what is shown here. Back then, though, it was the limitations of the graphics system, including the relatively low screen resolution that made it possible, though crude, on a CRT monitor.</p>
