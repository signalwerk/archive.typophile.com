      <p>Aluminium:</p>
      <p>"Has anyone built a chart that shows the relation between the specific colors needed to trigger the individual combination of sub-pixels?"</p>
      <p>On RGB (~80% of the market), the web color #RGB, where for each pixel you want dark you fill in a 0, and for each color you want light you fill in F.  So, for example, if you want the right and center subpixel mask-black, but the left unmask-white, it's #F00, or bright red.  </p>
      <p>On BGR (~20% of the market), use #BGR instead.</p>
      <p>There are only eight colors per arrangement, and in the real world, only RGB and BGR exist.  </p>
      <p>The germane observation though is that this is actually a boolean triple, not a color.  The reason that it matters which screen orientation is used is that these are images, not a font; a subpixel bitmap font is just a collection of boolean or integer valued pixels, as some grayscale range.</p>
      <p>This is a serious problem in practice: one of five of your customers using LCD screens will not be able to read this font.  It'll look like tiny color blobs.  Larger fonts can usually be resolved with some head pain, but at this scale, the human can't usually put it together if the color set is wrong.</p>
      <p>An example of where this matters is the Nintendo DS.  That device has two screens.  The manufacturer of the screens (Sharp) put the connection cable on the bottom edge.  To save on extra cable, Nintendo installs the top screen upside-down and reverses its addressing order so that it shouldn't affect programmers.</p>
      <p>Except that changes the top screen to BGR, so if you want to do subpixel on the DS, you have to have *both* orderings (or an actual font).</p>
      <p>An actual font would just be {1,0,0}, {0,1,0}, ... , and the colors would be worked out at runtime to match the monitor in use.  A font renderer would, as such, also be able to position the font characters at subpixel boundaries instead of pixel boundaries, since it's just a big 3:1 boolean mask it's painting, instead of precalculated color pixels meant to trigger the subpixel effect.  That means 3x the fine-grained positioning of the spacing between letters, and if you're a fontographer, you know how important that is for kerning, for justification and so on.</p>
      <p>Which isn't Miha's fault: subpixel bitmap font software is brutally difficult to find and has essentially no customer penetration, so unless you're also writing the dependant software (which is why you see this in cases like the nintendo ds, where that's always the case, but not on PCs), it's generally an exercise in futility to attempt that sort of font.</p>
      <p>Just saying.</p>
