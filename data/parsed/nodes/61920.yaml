      <p>Very neat. But alpha blending to anything other than white will be cumbersome. Using your palette and brush method you’ll basically have to redo it all each time. With a more automated method you could do alpha blending in each RGB channel separately.<br>
      <code><br>
             dst.r += (src.r - dst.r) * alpha.r;<br>
             dst.g += (src.g - dst.g) * alpha.g;<br>
             dst.b += (src.b - dst.b) * alpha.b;<br>
      </code></p>
