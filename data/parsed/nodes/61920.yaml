      <p>@Miha:</p>
      <p>Yes, I really think he's right. A regular and a bold isn't much of a family, but it's a family, so even that version of your claim isn't technically true. Of course, when you wrote the original post you only had one face, right, so you're kind of retconning the whole thing when you retitle your post, no?</p>
      <p>Not that I think this is the biggest deal in the known universe. But then again, dang, anybody who is seriously into type must be obsessed by minutiae. Comes with the territory, right?</p>
      <p>@Stonecypher (John):</p>
      <p>What I'm saying is that Corbel and Constantia, for example, are two distinct font families, and that you're in a very tiny minority (like &lt;1%) to define them otherwise. If you can find any typesetting book that has two fonts with unrelated designs, by different people, with completely different names, which calls these two fonts part of the same family, I'd love to see it.</p>
      <p>I'm rather familiar with Adobe's multiple master fonts, having done my MS thesis on multiple master technology, and working in Adobe's type group for over 11 years. I never heard anybody use the term "derived faces" the way you do. (There is a font production The set of multiple master fonts that were described as a family would be an upright and an italic, or those plus some expert set or something. It's not like Adobe would lump Minion and Myriad (not "miriam") together and claim they were one family.</p>
      <p>I'm not sure where you think Adobe uses the nomenclature you gave as far as the definition of "family." For example in the glossary of type terminology on the Adobe web site, the definition of both "family" and "font family" reads: <cite>"A collection of faces that were designed and intended to be used together. For example, the Garamond family consists of roman and italic styles, as well as regular, semi-bold, and bold weights. Each of the style and weight combinations is called a face."</cite></p>
      <p>So, the example certainly doesn't support your idea. You can choose to read "designed and intended to be used together" as broader than I believe the writer of that sentence intended, I suppose.</p>
      <p>Cheers,</p>
      <p>T</p>
