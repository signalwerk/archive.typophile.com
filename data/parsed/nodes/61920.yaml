      <p>.</p>
      <p>Here's Tonc's Text Engine, a standard library in almost every GBA and DS toolchain, which is portable and has builds for a dozen or so handheld devices, including basically everything targetted by DevKitPro.  It's a real subpixel font engine: it has subpixel positioning, subpixel kerning, more than a dozen fonts with a variety of faces and the ability for users to add more, and can support color subpixel text.  TTE began in 2004 if I remember correctly, though it was actively maintained until 2008.</p>
      <p><a href="http://www.coranac.com/tonc/text/tte.htm" title="http://www.coranac.com/tonc/text/tte.htm">http://www.coranac.com/tonc/text/tte.htm</a></p>
