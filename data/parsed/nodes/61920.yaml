      <p><cite>simple image (with provenance) that we can all see immediately proves his point.</cite></p>
      <p>Er, I provided several.  I even took the time to point out which ones had such screen shots.</p>
      <p>However, if you cannot be bothered to click several links before telling me I haven't made my point, here's one of many such examples, which is in the monochrome editor, but otherwise contains all the information you need.  This is a grid mapping; it reduces in width by half when displayed, but could not be done so in realtime due to the way Apple ][ character sets were loaded into video memory during the boot process for an application.</p>
