    html: |-
      <p><cite>I have yet to see a cleartype or sub-pixel implemention where I am not noticeably distracted by the color fringing.</cite><br>
      I am not very distracted by colors on my 17″ laptop with 133 PPI, which is higher than an usual display. On the other hand, I can still clearly see colors (if I don't sit too far away) on an average display. It distracts me, but grayscale rendering is even more blurry and that distracts me even more.<br>
      I also don’t like aliased fonts (OK, there are <a href="http://typophile.com/battle03" rel="nofollow">exceptions</a>). Aliased font like Georgia wasn’t even made for LCD display and I don’t think the old master had this in mind when he designed it for the CRT screens. However, I think I could get used to aliased fonts with very carefully antialiased curves. For example, <a href="http://www.themicrofoundry.com/manademo/" rel="nofollow">Mana</a>.</p>
      <p><cite>While it can not perfectly match the detail of the colored pixel version, it is preferably to me for the lack of color fringing.</cite><br>
      Well, it is your opinion … but this is partly my fault. Color fringing is actually too pronounced and if I continue with this typeface, I will find a better balance between fringing and blurriness. There is also something else: When I was doing this typeface, I started with colors which were produced by Windows ClearType GDI rendering. I changed them just a little and didn't do a research to find out what are actually the best colors. Read it in <em><a href="http://typophile.com/node/71019" rel="nofollow">this thread</a></em>, where I criticized that the lightness of red/blue colors is programatically symmetrical, but not perceptually.</p>
      <p><cite>I think that all the attention to colored pixels is unnecessary and actually distracting.</cite><br>
      I mainly share your opinion for regular and bold weight, but not for italic and bold italic. I think subpixels can really help in displaying a nice italic font without too much blurriness. Well, an example of my font with different levels of color fringing would be nice (I hope I can manage to post it soon – made with filters)</p>
      <p>PS: Thank you for your comments! At last, some argumented criticism :-)</p>
