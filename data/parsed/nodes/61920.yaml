      <p>"Another sub-pixel typeface could have been created in the time it took John to craft all his posts. John, why don’t you post some of your work?"</p>
      <p>I did.  Maybe you should actually take the time to read the thread soon.</p>
      <p>"Let’s talk about that instead of sitting here wasting time on this battle of the alpha males."</p>
      <p>Yeah, an alpha male is actually someone who gets into physical fights in order to secure breeding rights, not someone who stands up against an ethical wrong.</p>
      <p><em><strong>Typerror</strong></em>: I appreciate the show of support.</p>
      <p><em><strong>Thomas Phinney</strong></em>: Depends on how you look at it, if you'll pardon the pun.  I have seen smaller fonts, but they aren't complete, and they aren't families.  I've seen fonts that are taller but thinner (and made one such.)  I've seen fonts which are shorter but wider.  I have not seen subpixel fonts with this small a text footprint, which is the metric I usually use personally.  I have actually seen (and personally written) binary fonts smaller than this - I made a complete IBM high ascii codepage in 3x4 pixel - but it's whole pixel, not subpixel, and also not antialiased (it was made to make a game called Rogue on the old Sega VMU, which had a 48x32 monochrome discale screen.)</p>
      <p><em><strong>Aluminum</strong></em>: Cute.  You're welcome for that detailed answer I gave you to your question, by the way.</p>
      <p><em><strong>Miha</strong></em>: You're just looking for excuses at this point.  That font does have bold and italic variations.  You'd know that if you had just looked once at the rest of the examples; that's from the original list, and the original link shows the rest of that family, which not only has bold and italic, but also outline, emboss and ridge.  So do half a dozen other links from that list.  Stop claiming knowledge on the topic when you won't even read the links given to you.</p>
      <p><cite>I’ve asked for a handmade subpixel type family already in my first reply to him, but really couldn’t find any.</cite></p>
      <p>That's because you won't read the links given to you.  I even pointed one out explicitly from the list before you went onto this new tangent as being families at various sizes, weights, slantings and so forth.  It's the one that comes from archive.org.  There are half a dozen families on that page alone.  I've also reminded you about this twice; it's clear that the reason "you can't find any" is because you refuse to read the people who are showing you where they are.</p>
      <p><cite>but there is only greyscale antialiasing.</cite></p>
      <p>Right, which is why the second paragraph reads as this exactly opposite statement:</p>
      <p><cite>Airwindows formally thanks Microsoft for devising ClearType, and thereby figuring ways to add strange color casts to type on LCD screens, while simultaneously reinventing a technique they may well have first heard of from me.</cite></p>
      <p>Maybe you should look again?  Those are not grayscale anti-aliased (well, all subpixel fonts are actually grayscale anti-alised; it's images imitating subpixel fonts which have colors.  But I already explained that to you, and it appears you weren't listening.)</p>
      <p>Willful ignorance is not a good excuse for false claims.</p>
      <p><cite>I didn’t change the title because it would look like that I believe John Haugeland is right.</cite></p>
      <p>Yep.  That's exactly why I tried to be harsh with you: it's the only way to reach people who are digging in their heels, refusing to believe the obvious truth, taking only cursory examples out of single points full of lists of evidence, missing the text that comes up by the second paragraph even when the link list explicitly points it out beforehand in prophylaxis, and _still_ manages to think it isn't true.</p>
      <p>Unfortunately, Aluminium has already used the Fox News joke.</p>
      <p><cite>heck, the difference between first whole family and first typeface with one style is small, it’s just a small step forward with evolutionary nature.</cite></p>
      <p>Well, it would be, if the first time this was invented this hadn't been deployed as a family.  As you've already been notified repeatedly, of course, the earliest example I've been able to find is the Apple ][, wherein bold, italic and bold-italic were part of the very first family, so there's no evolution involved, that's just how it was done from day one.</p>
      <p><cite>Thinking more if this title really matters I came to conclusion that it doesn’t, typeface is already special</cite></p>
      <p>Good, then you should have no problem removing the false claim, since it doesn't matter to you, and resting solely on the special-ness of the typeface.</p>
      <p><strong><em>Muji</em></strong>: "So, among all John’s links was there an example of ’handmade subpixel type’ we can all see that shows a typeface with a family of weights rather than just ’thick’ and ’thin’?"</p>
      <p>Yes, the very first example has normal, bold, italic, bold-italic, underline, bold-underline, and cursive, bold-cursive, underline-cursive and bold-underline-cursive (which may or may not be a separate font depending on how you look at it, as it only replaces the letter faces and the digits.)</p>
      <p>Also, several of the gameboy advance and DS examples I gave have entire families, and as I pointed out, I converted about a dozen of Microsoft's fonts at various weights, slants and sizes (mind you, I had to go back and hand-pixel them, because ClearType's hinting falls apart below eight pixel em-height.)</p>
      <p>Furthermore, the archive.org site has about three times as much work as I did, and beat me to the punch by some unknown amount of time, but at least seven years and probably substantially more than that.</p>
      <p><cite>perhaps the 3 pixel x-height is new?</cite></p>
      <p>Nope.  Indeed I've seen subpixel fonts with x-heights of two.  At this size, I often find it more productive to discuss em-heights; the small glyph height at this size often has to vary (for example, most hand-drawn small fonts of em-height 4 have an x-height of 2, but allow lower case S, Z and so on to go up to 3.)  Also, it's occasionally important to discuss raw glyph height, because at this size sometimes a letter with a descender is up-shifted positionally to make due.</p>
      <p><cite>I looked up a dozen or so definitions and the combination roman-italic-bold-bold italic was generally given as the basic example of a font family</cite></p>
      <p>Well, I wasn't really going to bring this up, because a lot of people are going "waaaah argument", but I guess I kind of have to now.  </p>
      <p>A font family has nothing to do with its faces; a font family is a group of fonts meant to work well together.  An example of a font family in the modern era with which most are generally familiar is candara, consolas, corbel, calibri, constantia and the ugly one.  The misunderstanding that a family means its faces comes from the older days of machine typesetting where a font was just a font, and had one glyph per index and that was it; at that time, bold/italic/bold italic would just be shipped as separate fonts, usually with b/i/bi on the end of their names (you can still see that on the system bitmap fonts in Vista boxes), and at that time it seemed natural, as they were a set of fonts meant to work well together, to refer to them as a family.</p>
      <p>What Miha made is actually a single font with several faces, not a family at all.  Citation should be easy for people here to find, since they're so many type enthusiasts, but since a person doesn't make claims without evidence, you can find such discussions in Meggs (aka "Typographic Design: Form and Communication", doesn't show up until the yellow 2006 edition, so if you have the cyan 2002 you won't find it) as well as in one of the iF yearbooks, where I initially learned this (not sure, think it's 2005.)</p>
      <p>But I wasn't going to argue that, because what Miha meant was clear, so I figured I'd just work with what Miha thought the terminology meant.  'Cause you know, that isn't a first either.</p>
      <p>John Haugeland is <a href="http://fullof.bs/" title="http://fullof.bs/">http://fullof.bs/</a></p>
    html_clean: |-
