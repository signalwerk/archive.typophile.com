      <p>Here's HRCG (High-Resolution Character Generator), which is Apple doing a handmade subpixel type family in 1976, US Patent 4079458:</p>
      <p><a href="https://www.patentstorm.us/patents/4079458/claims.html" title="https://www.patentstorm.us/patents/4079458/claims.html">https://www.patentstorm.us/patents/4079458/claims.html</a></p>
      <p>Three years later they released a font editing application, US patent 4345244.  It's basically what you're doing right now in Photoshop, except that it also had a grid 2:1 mode (because apple screens weren't actually 3-color back then).</p>
      <p>By the way, Apple originally did it actually by hand: numbers in code.  Using a paint program like the one they released in 1979 isn't by hand at all.  But they had that as a sale product on the market in 1979, and more than four hundred fonts were released by people like you.  This was a product you could buy in Radio Shack in the Carter era, during the Arab Oil Embargo.</p>
      <p>None of those font authors claimed to be the first, though.</p>
      <p>.</p>
      <p>Here's a collection of hand-made subpixel fonts (he brags about how hand-made anti-aliasing makes a difference, and brags about how Microsoft heard about the Cleartype practice from him) for the Mac from _1999_, which went offline in 2006, but is still held on the Wayback Machine, offering eleven different face families at varying scales, boldness and italicness of which five are lost forever:</p>
      <p><a href="http://web.archive.org/web/19990128033152/http://www.airwindows.com/shareware/fonts/index.html" title="http://web.archive.org/web/19990128033152/http://www.airwindows.com/shareware/fonts/index.html">http://web.archive.org/web/19990128033152/http://www.airwindows.com/shar...</a></p>
      <p>.</p>
      <p>Here's the list of Microsoft patents that apply to subpixel bitmapped rendering.  Just replace the patentstorm number with the one you want to see.  6,188,385; 6,219,025; 6,239,783; 6,307,566  These are all from the early 1990s.</p>
      <p>.</p>
      <p>Here's the Chinese doing it for Han in 1985:</p>
      <p><a href="http://www.springerlink.com/content/1953461l532x341g/" title="http://www.springerlink.com/content/1953461l532x341g/">http://www.springerlink.com/content/1953461l532x341g/</a></p>
      <p>.</p>
      <p>I half-wrote a bitmap subpixel font editor in 2006 for the web:</p>
      <p><a href="http://sc.tri-bit.com/outgoing/fonteditor/" title="http://sc.tri-bit.com/outgoing/fonteditor/">http://sc.tri-bit.com/outgoing/fonteditor/</a></p>
      <p>.</p>
      <p>Here is a hand-made subpixel font demo for the GameBoy Advance from the 2005 GBAX coding competition.  It is a larger type family than the one here.  It's near the end; search for guyfawkes.</p>
      <p><a href="http://gbax.gp2x.de/gbax2005.html" title="http://gbax.gp2x.de/gbax2005.html">http://gbax.gp2x.de/gbax2005.html</a></p>
      <p>.</p>
      <p>Here's AstroStorm, a game written for a 2002 competition for the commodore 64, with subpixel bitmap font face rendering and subpixel *level* rendering, from hand drawn fonts.  This is primarily hilarious because the Commodore 64 died long before screens which could ever have rendered this game, which the author notes in his readme.txt in the competition entry.  It's a programmer joke.</p>
      <p><a href="http://www.cling.gu.se/~cl3polof/minigame/results.html" title="http://www.cling.gu.se/~cl3polof/minigame/results.html">http://www.cling.gu.se/~cl3polof/minigame/results.html</a></p>
      <p>.</p>
      <p>Here's XFT, which has been doing this since 2003:</p>
      <p><a href="http://www.freedesktop.org/wiki/Software/Xft" title="http://www.freedesktop.org/wiki/Software/Xft">http://www.freedesktop.org/wiki/Software/Xft</a></p>
      <p>.</p>
      <p>Here's Anti-Grain Geometry, a graphics engine which can subpixel render vector fonts at any angle since 2004, because it's actually subpixel rendering, not just pre-calculating colors:</p>
      <p><a href="http://www.antigrain.com/" title="http://www.antigrain.com/">http://www.antigrain.com/</a></p>
      <p>He has an extremely long and detailed explanation of half a dozen forms of subpixel rendering, from 2007.</p>
      <p><a href="http://www.antigrain.com/research/font_rasterization/index.html" title="http://www.antigrain.com/research/font_rasterization/index.html">http://www.antigrain.com/research/font_rasterization/index.html</a></p>
      <p>.</p>
      <p>Here's Cairo Graphics, which can do the same thing since 2005:</p>
      <p><a href="http://cairographics.org/" title="http://cairographics.org/">http://cairographics.org/</a></p>
      <p>.</p>
      <p>Here's Adobe GIL, which can do the same thing since 2006:</p>
      <p><a href="http://opensource.adobe.com/wiki/display/gil/Generic+Image+Library" title="http://opensource.adobe.com/wiki/display/gil/Generic+Image+Library">http://opensource.adobe.com/wiki/display/gil/Generic+Image+Library</a></p>
      <p>.</p>
      <p>Here's SubLCD, which can do the same thing since 2007:</p>
      <p><a href="http://www.oyhus.no/SubLCD.html" title="http://www.oyhus.no/SubLCD.html">http://www.oyhus.no/SubLCD.html</a></p>
      <p>.</p>
      <p>Here's a Nintendo DS universal text reader from February of this year which uses a different subpixel font.</p>
