      <p>John, if someone googles "first subpixel font" or whatever, they'll only find Miha's claim to it (plus your numerous counter-claims), not the definitive answer. You'd be a fool to think you could find proof of anything in a quick web search. As far as Asperger's Syndrome goes, I do have some knowledge of it from my brother. I am certainly no psychologist; I suffer from depression and I hate it when people say they're depressed when what they really mean is temporarily sad. Suffering from mental illness has given me some perspective and a keen interest in the whole spectrum, I certainly wasn't trying to shame you.</p>
      <p>"I would make an example by claiming rights to some of your work, but I can't find any."</p>
      <p>Whatever anyone has said about you, I think you must agree that the above statement is both aggressive and deeply unpleasant. Just because I haven't as yet made my work available on the Worldwide Interweb, it doesn't mean I haven't done any, and your rank arrogance in suggesting that you would, "make an example by claiming rights" to it is hopefully beneath you.</p>
      <p>"If I'm happy about the new video game I just wrote, should I call it the first video game ever?"</p>
      <p>Hell yeah! In that moment in time. It may be cheeky, it may be flawed. These words weren't carved in stone, they were genuine feelings expressed by someone whom it would be difficult to label a rip-off merchant. And if a google search proves him wrong then so be it, or if he contends it doesn't, then argue away forever, but maybe focus your energy on other projects, as I hope to do mine.</p>
      <p>Anyway, that was my best attempt at proper writing.<br>
      Nice chatting with you,<br>
      Owen</p>
