      <p>So, how to continue? With further additions, of course:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/roman_tr_5609.png"></div><br>
      There are some glyphs that are not yet ready, but generally speaking I added:<p></p>
      <ul>
      <li>superscript and subscript numerals in both lining and old-style forms (quiet <em>unusual</em> for (sub)pixel font, isn't it?;))</li>
      <li>predefined fractions which are in <a class="freelinking external" href="http://blogs.adobe.com/typblography/latin_charsets/Adobe_Latin_4.html" rel="nofollow">Adobe Latin 4</a> – OK, some may use some help</li>
      <li>arrows + some triangles, also in Adobe Latin 4</li>
      <li>some currency glyphs</li>
      <li>I just started adding accented characters</li>
      <li>case sensitive forms (dashes, parentheses etc)</li>
      </ul>
      <p>How is a web designer going to use the typeface?<br>
      I also thought about Photofont, but it doesn't support type families (or does its use become unnecesary complicated). Furthermore, it doesn't support both lining &amp; old-style figures and other feautures. To be fair, this is not supported by CSS either (!).<br>
      Using the sIFR-like method is in my opinion the best. I think I will take parts of sIFR and make it appropriate for my typeface. I am doing text layout program in Flash anyway.<br>
      Using sIFR-like plugin for webpages has the following benefits:</p>
      <ul>
      <li>it is automatic and text is easy to change and style (with html and css)</li>
      <li>if user scales the webpage, the typeface should be changed to a bigger system font – instead of smoothing the type and breaking a subpixel effect like in static images</li>
      <li>users on iPhone see the regular text (if rotated, subpixel effects on iPhone don't work)</li>
      <li>it is also easier to "install" than sIFR because typeface is already saved in proper format</li>
      <li>it suggests the idea that The Flea's Knees should be used only in extremely small quantites (like in headlines, but just the opposite size)</li>
      </ul>
      <p>Another option is use in predesigned pictures.</p>
      <p>Personally I think that such small text should be used very rarely. I made it because I like the optical illusion and making something in a "new" way.</p>
      <p>And now a question … has anybody brave tried doing a small subpixel font or maybe just some glyphs? I would be glad to see some other examples. I can only study the work of Ken Perlin – subpixel typefaces from decades ago don't work anymore on LCD screens, and there are no 1x magnifications of fonts made for game devices.</p>
