      <p>DevilsAdvocado: no.  Subpixel antialiasing is the practice of using the independant color channels in the pixel as if they were distinct grayscale positions, instead of using them as color, in order to triple the effective horizontal resolution (assuming a standard three-band arrangement like one finds in most LCD, plasma and OLED monitors), along with a little math hokey pokey to prevent color fringing.</p>
      <p>You can see the difference by zooming way in on a screenshot of traditional AA and subpixel AA.  The subpixel AA has colored edges because it's using the physical position of color channels like a mask, which the eye can sort out when it's at scale.  There's an earlier post on this same blog about the youtube favicon; that's an example of the effect (the newer one, which is nicer, has colored edges because they're the rightmost and leftmost channel - red or blue respectively - being turned off to get graceful curves.</p>
      <p>It's the difference between old style anti-aliasing and ClearType, if you're a windows user; ClearType is Microsoft's sub-pixel technology.</p>
      <p>If you're interested, here's a pretty good beginners' tutorial.  <a href="http://www.grc.com/ctwhat.htm" title="http://www.grc.com/ctwhat.htm">http://www.grc.com/ctwhat.htm</a></p>
      <p>Subpixel antialiasing isn't actually antialiasing; it's a different addressing mechanism for physical screen positions.  Boolean SPAA looks better than most antialiasing, but you can mix antialiasing with SPAA (that is, in that GRC tutorial, use the narrow grid but then use grayscale anyway) and get really gorgeous results.</p>
      <p>The downside is the math for that is moderately expensive, because you have to do some filtering (usually a 1-2-3-2-1 filter) to get it to work, so if you're working on an embedded or portable device, you can expect slow results or large battery draw or both, depending on the device.</p>
      <p>But it's totally worth it.</p>
      <p>John Haugeland is <a href="http://fullof.bs/" title="http://fullof.bs/">http://fullof.bs/</a></p>
