      <p>SexyRobot: what you're looking for is called "kerning", and is handled by most type systems, including bitmapped font type systems.  As these are actually images, not a font at all, there is no kerning information, and as such you would have to position them manually.  Since these are images, not a subpixel grid, you are constrained to whole-pixel positioning, which loses the 3x kerning benefit normally inherent in a subpixel type system.</p>
      <p>However, this is actually an understandable limitation of this work: subpixel bitmapped font systems are barely present at all, and difficult even for programmers to locate and use, let alone people who don't work with code.</p>
      <p>There is a subpixel font system from 2003 in pure portable C on my webpage if you want it, but the work involved with converting this image set of letters into an actual subpixel font is significant; it means writing something to break down the color channels independantly and re-assemble the grid.</p>
      <p>On the bright side, an actual subpixel font would not be locked to RGB screens, as this one is, so if you intend to use it in software without losing 20% of your customer base immediately, you should probably get cracking.</p>
