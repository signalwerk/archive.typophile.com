      <p>David Jones, thank you very much for the link! I really didn't know wether it was my typeface that it was first or not, but now all doubts are gone. Well, probably mine is still the first type family [like it says in the title], but anyway: all the glory should go to <strong><em>Ken Perlin</em></strong>! :-)</p>
      <p>About his font: he actually had a little different intentions than me. I also wanted to design the smallest typeface, but with style comming before being the smallest (actually, I like style in both italics). My typeface has 1 pixel lower x-height, but has ascenders &amp; descenders; and even by cropping them I wouldn't fit more text than him.</p>
      <p>I like his typeface! But for my taste there are a bit too much pronounced colors. Despite stronger colors it has one huge difference: not all its glyphs are made the same, which leads me to conclusion that it was actually at least partially programmed. I would love to know more! If it was programmed, rendering engine was probably programmed specifically for this font. In this case, I would still consider it "handmade", and mine respect would even deepen.</p>
      <p>Maybe it's strange, but I am not dissapointed because of this. I think I am getting more excited!</p>
      <p>Matt Sephton: "<cite>I recommend ignoring John Haugeland</cite>"<br>
      I will, I see it was my mistake responding. His posts are actually the most impolite I've seen for some months on Typophile.</p>
      <p>Tobias, I think that you can't do it as easily. While alpha is correct, <em>color</em> should change too. Because I used a consistent color pallete searching &amp; replacing each color with a different set of colors would be trivial. I used 4 shades of red, 5 of blue and I think 3 grays. With white as a background.</p>
      <p>"<cite>Actually, the proportions and slant of the italic also suggest Fournier to me. Congratulations on the first manual subpixel French neo-classical type.</cite>"<br>
      John, this was almost exactly what I tried. I wanted to do a garamond-styled italic. I have still more room for experimetations. I will certainly try more slanted italic "A" and "f". Also I really love OsF, they are really appropriate.</p>
      <p>This time, there is no update in design, I am too busy reading retweets :-P. But just for fun, can you guess what is below:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/wtf2_6716.gif"></div><br>
      Original size is in my post with specimen of bold italic.<p></p>
