      <p><strong>Squidbilly</strong><br>
      "<cite>Sooooo miha is dishonest for not thoroughly researching some obscure font that hasn’t been in use for over a decade that no one has ever heard of?</cite>"</p>
      <p>No, Miha is dishonest for claiming first ever without having put in any serious effort to find out whether that's true.  (I maintain that not google searching the simplest possible phrase, subpixel font, is evidence that no serious effort was put in.)</p>
      <p>Don't worry, Erly, I know yew kin't reed tew gud-like.  I'll try to speak slower when you're around next time.  (Miha: it's a reference to the television show from whence he draws his username and icon, not slander.)</p>
      <p><strong>Miha</strong></p>
      <ol>
      <li>"<cite>I am very sorry if I was dishonest, I had no such intentions.</cite>"
      <p>I realize that.  The reason for the journalistic precept of not making sweeping statements without researching them first is to prevent unintentional dishonesty from still making one dishonest.  Notably, your blog entry's title has not yet changed, nor has yet the text been amended; noting a wrong as intentional doesn't mean you shouldn't still clean it up.</p></li>
      <li>"<cite>I suggested that maybe this is first such font for LCD screens</cite>"
      <p>Well, you'd be wrong there too.  Hence the bit about "please try checking before making the claim."  Don't worry, Dorothy, you'll get there.  Eventually.</p>
      <p>The Apple Newton and the Palm III both had SPAA color fonts.  Incidentally, your font isn't for LCD screens; it's for right-bar screens.  Many screens that aren't LCD are right-bar, and many LCD screens aren't right-bar.  For example, the two screens on the Nintendo DS, which have had SPAA fonts in commercial use for nearly five years, are aligned differently to save on cable length, so your font doesn't apply to one of (I think the top, but forget) those screens.</p>
      <p>I'm sure there are earlier examples of LCD screens SPAA fonts, but I'm not a fontologist with a domain name that implies a deep familiarity with type, so I can only think of about a dozen counter-examples off of the top of my head.  (Without research, the gameboy advance, the nintendo ds, the palm 3 and all following it, windows mobile both as bitmap and as cleartype, my apple iphone, the sega nomad, the apple newton, the google android, my canon vixie hf-200 camcorder's screen, the cybiko in monochrome, the Sony PSP, the Game Park GP-32 and all following it, and just to make it a baker's dozen, let's say the Nintendo DSi is a different machine than the DS.)</p>
      <p>But that's cool: if you don't know enough about the thing you're saying "first ever" in public about to think of those dozen plus obvious examples off the top of your head, there's always research.</p>
      <p>Try it some time.</p></li>
      <li>"<cite>I also did a google search</cite>"
      <p>Wow, one whole google search?  That must have taken ages; I can see why you'd be surprised that such thoroughness might come up empty handed.</p>
      <p>So far I've been unable to think of a reasonable google search which doesn't find an example in the first two pages.  Let's call it Google Anti-golf.</p>
      <p>What search did you use, please?  I'm unable to replicate your failure even at the single attempt level.  (Note the lack of pluralization in order to help you understand the quality and diligence of your research before declaring a world first, by the way.  It's instructive.  And hilarious.  But mostly instructive.)</p>
      <p>If you didn't look at the second page of results, then it's a little easier to find queries that might fail; I've tried around 40 so far, and two have so far failed to give a first page result.</p>
      <p>And as we all know, there are only in fact ten things on the web, so looking at a second page before declaring a world first would be a waste of time.</p></li>
      <li>"<cite>but I found only automatically rendered subpixel fonts.</cite>"
      <p>Well, that's curious.  They're not hard to find.  For example, my old website, sc.tri-bit.com, has four rendered PNGs of complete SPAA fonts in every flag combination of [bold, italic, underline, strike-through] (16 renders per font per size) at about half a dozen sizes per font, covering the entire publically released microsoft T series (tahoma etc), V series (verdana etc) and C series (candara etc).</p>
      <p>I mean it's not like they're on a page rank six blog too, or anything.  Really, really hard to find stuff.</p>
      <p>And I mean, in the two minutes it took me to stop sadbear laughing, I found about a dozen bitmap SPAA rendered fonts in things like FLTK and older projects from SWAG.</p>
      <p>One of my font renders was the default font in the linux shell compiled for the Nintendo DS, last time I looked, if I remember correctly (if I'm wrong, Pepsiman will set me straight, but I think he was using one of my Consolas renders.)</p>
      <p>So yeah.  I guess you looked pretty hard, huh?</p></li>
      <li>"<cite>Only later there was a comment that it is indeed not the first font</cite>"
      <p>Yeah, generally people can't leave comments about the wrongness of a claim to a world first before the claim is published.  "Only later" is a side effect of our not being able to see web articles through time.  You know, not being John Pertwee, it's a little hard to rustle up that kind of defiance of physics just to get some luls in on a blog.</p></li>
      </ol>
      <p>Please amend the article and title (and this doesn't mean to a third wrong guess, this means to something simple and factual like "my first subpixel bitmap font").  The mistake is excusable; to err is human.  Making a new false guess claim after your last false guess claim didn't work out isn't fixing an error, it's repeating an error.</p>
      <p>Subpixel fonts are nothing new.  They're 30 years old in a field with a 40 year consumer presence.  You aren't getting a first here.  Stop pretending, please.</p>
      <p>-</p>
      <p>John Haugeland is <a href="http://fullof.bs/" title="http://fullof.bs/">http://fullof.bs/</a></p>
