    html: |-
      <p>I use Photoshop – when you see one pixel enlarged, you can control just its one color. But if you were watching physical pixel very closely (with microscope) you could find its three subpixels were changing. This thing is possible because of hardware. Specifically, this works only on LCD screens.</p>
      <p>When you mix a color for one pixel, you use three sliders: each slider is actually for one subpixel. The tricky part is that you have to imagine color components, because full pixel colors which are displayed are confusing.<br>
      (Read about it on <a href="http://en.wikipedia.org/wiki/Subpixel_rendering" rel="nofollow">Wikipedia</a> and <a href="http://www.grc.com/cleartype.htm" rel="nofollow">here</a>.)</p>
      <p>I was thinking more why I started italic and not roman. I think because of all beautiful color patterns at 1600%. Also a little suprising fact, maybe: in all lowercase letters there are <em>only three gray pixels</em> (and all three are in "z")! Else are colors. Evenmore: in italic, there are no spaces between letters visible at 1600%.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ipsum_3674.png"></div><br>
      This typeface is best seen on monitors with higher PPI (I have 133).<p></p>
