      <p>Oh, also:</p>
      <p><cite>When you mix a color for one pixel, you use three sliders: each slider is actually for one subpixel.</cite></p>
      <p>Yeah, this isn't actually correct.  This is correct when-and-only-when Photoshop's color model matches the monitor's color model.  PNG has color model adjustment because that's essentially never true; even disregarding things like color temperature, the color base constants aren't actually fixed points, but rather chosen points in a range, and many manufacturers use subtly different colors (which is why photoshop has all that color registration stuff, so that different monitors working on adjacent projects wouldn't cause clashing results.)  That has to do with what the underlying chemistry of the dyes used to mask the LEDs, dope the phosphors or light the OLED/Plasma are, and are the reason why certain manufacturers have such better performance in certain color ranges.</p>
      <p>This is why Samsung makes a five channel monitor, too.</p>
      <p>What you tried to say was:</p>
      <p>"In a three color colorspace, the color output value can be used as a lightness control when thinking of the subpixels as grayscale values rather than chrominances.  This is compounded by the fact that I'm working in Photoshop, which is going to screw with the colors I output in ways I apparently don't understand, which is why I'm having such difficulty with straight lines.  But that's cool, because everyone's monitor is just like mine, which is why my LCD font looks wrong on about 20% of LCDs, and works on lots of CRTs and OLEDs and so on."</p>
      <p>Stop using PNG for SPAA unless you're going to learn colorspaces, which are hard for color scientists (no, that's really a job), so you won't.  Photoshop and PNG conspire to try to fix your work in colorspace, which is usually a good idea but murderous to SPAA.  Switch to Targa or TIFF instead.  PNG is lossless in a lot more ways than pixel values, and you actually want colorspace channel loss here, because otherwise it screws with your per-pixel calibration.</p>
      <p>Incidentally, a photoshop user should be intimately familiar with that colorspaces don't match, that photoshop colorspace isn't monitor colorspace even when the names match, and that photoshop can switch between colorspaces within a single document, so those sliders obviously aren't subpixel values.</p>
