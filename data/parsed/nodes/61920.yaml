      <p>It only shows one of the weights at a time, but given the limitations of the machines of the late 1970s, and the fact that it's discussing the font name, character set and weight on screen, I hope you'll trust that screenshot in as far as to actually look this stuff up before questioning its already linked veracity again.</p>
      <p>Frankly I'm not used to being asked to repeat easy research on grounds that the proof already given is too voluminous.  It's quite frustrating, as is the exceptionally poor behavior of the people complaining about my behavior.  A fine round of Tu Quoque for all.</p>
