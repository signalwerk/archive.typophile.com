      <p>Bloodtype: </p>
      <p>"This suggests that you hold designers generally in low esteem"</p>
      <p>It's an understandable mistake to make. I didn't make that comic, nor did I write that text, actually.  It comes from a website called <a href="http://businessguysonbusinesstrips.com/" title="http://businessguysonbusinesstrips.com/">http://businessguysonbusinesstrips.com/</a> .  My attention to that comic was the claim that developers were stupid, by someone with limited grammar skills.</p>
      <p>I have a great respect for designers, because they fulfill one of the few roles in the software development process I cannot fulfill myself.  The reason my relationships with my designers are so good is that I take very good care of my staff and respect them for their work.</p>
      <p>"Miha’s exuberance in finishing a wonderful typeface comes from an artistic temperament that you most likely don’t have."</p>
      <p>You're welcome to your opinion.  I would point out that you don't actually know anything about me other than how I react to false claims by a typographer.</p>
      <p>"You may think more logically in zeroes and ones, rather than laterally and creatively."</p>
      <p>I may.  Or I may not.  Speculation doesn't do you much good here, and I'm actually closer to being an artist than I am to a developer, though neither label applies particularly well.</p>
      <p>"I don’t know if it has been suggested to you that you might have borderline Asperger’s syndrome"</p>
      <p>Please be serious.  An Asperger's victim doesn't communicate well with others, and would never have written any of this in the first place, no matter how they felt.  I don't think you should probably attempt to make future psychological assessments of people you don't know.  It's not very compelling.  But that's just my opinion.</p>
      <p>Incidentally, I very much hope there are no Asperger's victims reading this.  If there are, you just made them all very sad, by pretending that a guy who's angry must have their disease, and that their disease causes angry behavior.  It does not, and it's inappropriate to use psychological disorders to shame people in public, because the people who actually have those disorders can become very hurt by that.</p>
      <p>"I think your talents lie more in the programming area than in design."</p>
      <p>You know as little about my talents as you do about my mental state, good sir.  I am disinterested in future speculation on the matter, though I've no doubt that won't stop you from trying.  Typically after Asperger's, the armchair psychiatrist goes for obsessive compulsive disorder, depression, schizophrenia or schizoaffective disorder, psychosis, paranoia (as was used earlier by someone else who is confused about what they understand) or psychopathy.</p>
      <p>It's a hilariously varied, unrelated and inapplicable bunch, but I'd like you to have a broad palette to choose from when feigning the ability to diagnose people as a medical doctor.</p>
      <p>If you're looking for something more exotic, Porphyria is nice this time of year.</p>
      <p>"Most people looking at your website would conclude that it could do with a designer’s touch."</p>
      <p>That would be because the CSS is currently broken by a malfunctioning SEO plugin that I'm too lazy to fix.  A swing and a miss; the design was actually made by one of the most successful video game artists in the Nintendo gaming community, and I get compliments on the skin at the rate of several a day from strangers.</p>
      <p>I tried looking for your web page to offer return commentary, but Google has no idea who you are, other than a largely obscured linkedin page.</p>
      <p>My opinion, given the success rate of your guesses, is that you should probably stop.</p>
