    html: <p>A major issue with new versions of Windows on older hardware is BIOS compatibility. Installing Windows XP on a machine that was not designed and built for it can cause problems with power management, speed, and even some application running. <br> <br>Regarding particular specs, you probably want no less that 512MB of RAM and at minimum a 40GB hard drive. If you can afford to double those, so much the better.</p>
