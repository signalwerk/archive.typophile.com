    html: "<p>The current exchange rate is approx. 1.30 CAD to 1.00 USD. <br> <br>The Ethiopic script is not technically complex, just large. Keyboard layouts are complex, because you input the consonant a vowel separately in order to get the single syllable character. I did include one OpenType Contextal Alternate &lt;calt&gt; feature for Nyala Ethiopic: an Ethiopic number feature that draws a line above and below multiple numerals. This is a feature of the script found in manuscripts but, until now, has not been done in type. I used VOLT for this, but it is the sort of substitution feature that can also be done in FontLab.</p>"
    html_clean: "<p>The current exchange rate is approx. 1.30 CAD to 1.00 USD. <br> <br>The Ethiopic script is not technically complex, just large. Keyboard layouts are complex, because you input the consonant a vowel separately in order to get the single syllable character. I did include one OpenType Contextal Alternate &lt;calt&gt; feature for Nyala Ethiopic: an Ethiopic number feature that draws a line above and below multiple numerals. This is a feature of the script found in manuscripts but, until now, has not been done in type. I used VOLT for this, but it is the sort of substitution feature that can also be done in FontLab.</p>"
