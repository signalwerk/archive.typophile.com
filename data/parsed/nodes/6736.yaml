    date: 2004-09-27T07:22:00
    date_raw: 27 Sep 2004 — 7:22am
    votes: null
    html: "<p>All Creative Suite products come in three language editions: Western/International (the one developed and sold by Adobe), Central European and Middle East (both developed by Winsoft <a href=\"http://www.winsoft.fr/\" target=\"_blank\">http://www.winsoft.fr/</a> and sold by its distributors). Note that the CE/ME versions of InDesign or Illustrator aren't just the Western versions with some plugins. Some of the core functionality has been changed/extended. So for example, it is not possible to install \"ME plugins\" onto a regular InDesign, but instead, you need to install the entire new InDesign ME. BTW, it is very unfortunate that one cannot install InDesign Western and InDesign ME on the same machine.  <br>The Central European version includes tools for working with Central and Eastern European languages (Polish, Russian, Czech, Ukrainian, Hungarian etc.), while the Middle East version includes _everything that the CE version has_ plus support for Arabic and Hebrew.  <br>Adam</p>"
    html_clean: "<p>All Creative Suite products come in three language editions: Western/International (the one developed and sold by Adobe), Central European and Middle East (both developed by Winsoft <a href=\"http://www.winsoft.fr/\" target=\"_blank\" class=\"link-external\">http://www.winsoft.fr/</a> and sold by its distributors). Note that the CE/ME versions of InDesign or Illustrator aren't just the Western versions with some plugins. Some of the core functionality has been changed/extended. So for example, it is not possible to install \"ME plugins\" onto a regular InDesign, but instead, you need to install the entire new InDesign ME. BTW, it is very unfortunate that one cannot install InDesign Western and InDesign ME on the same machine.  <br>The Central European version includes tools for working with Central and Eastern European languages (Polish, Russian, Czech, Ukrainian, Hungarian etc.), while the Middle East version includes _everything that the CE version has_ plus support for Arabic and Hebrew.  <br>Adam</p>"
