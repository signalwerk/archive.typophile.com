    <p>Hi Everyone,</p>
    <p>I am doing a project at uni where I need to hand carve the Arabic words ’halal’ and ’haraam’. I do not speak or write the language, but appreciate the beauty of the script. Unfortunately I cannot seem find to any examples of these words written by hand on the internet, and I would much rather use a hand-written type specimen rather than a digitally typeset one because I feel it conveys the beauty and fluidity of the language far better.</p>
    <p>I was hoping someone could point me in the right direction of some specimens, or even if someone knew Arabic themselves it would be amazingly generous if they could provide a basic specimen and be showered in thanks for the rest of eternity?</p>
    <p>Huge thanks,</p>
    <p>Rafe</p>
