    html: |-
      <p>To me the stress needs to go on the top right corner of the a on the inside of the open counter. The joins still need something to raise them, maybe you could investigate how they change if you try painting this up with a brush and ink. Load up the brush and try repeating one group of letters at a time (ave &amp; ailey) until you get a really smooth fast movement, I suspect the joins on ave are too contrived, because those of ailey work better and that the painting exercise will give you more modulation of stroke.<br>
      Tim</p>
