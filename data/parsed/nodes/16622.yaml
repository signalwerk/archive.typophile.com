      <p>The internship is going great! I love the Art Directors at RCA, they’re both really fun, knowledgable and talented. My boss who oversees all the creative work, both print and video is awesome as well. I often find myself staying late even though I’m not getting paid. I don’t know how I’m going to be able to go back to school in the spring. :-/ The lack of monetary income is the only downside. Manhattan has been a great expereience, beside the fact that I can’t freakin find another part time job….so many résumés and interviews but still nothing. It’s a good thing I had a decent savings before I got here.</p>
      <p>I hope to make a good judgement on this city by the time I leave and then after school spend some time on the west coast (San Francisco area) since a good portion of the design industry seems to be happening out there now. That is all dependednt on me finding a job etc, still too far away to really plan for though! Thanks for asking!</p>
