    <p>Ok, so I was bored on my train ride this weekend and so I took out my sketchbook and started drawing. I digitized it a work today. I’ve never really ventured into drawing a ‘custom’ script so I tried it with my name. Thoughts? I know it still needs refining but general ideas about it would be awesome! Critiques, opinions, thoughts, comments etc are all welcome!</p>
