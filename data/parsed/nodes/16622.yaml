      <p>I’ve been lurking around for a while, and finally decided to get in on the action. This caught my eye, and begged me to post my thoughts.</p>
      <p>The first thing I noticed was that the “ave” and the “iley” look like separate designs. The “ave” has a twisted, unconventional feel to it, while “iley” looks like more of a traditional script. Also, the curly piece at the top of the “D” looks a bit forced, I like how the “B” looks and would try and model the “D” after it. The dot on the “i” is awesome, make sure you keep it as this progresses. I would love to see this deveop into a finished piece, please continue posting your updates.</p>
      <p>Travis</p>
