      <p>Hi guys:</p>
      <p>The disdain I have for PDF font licensing is the same disdain I have for buying a home in 'sub-division', condo, etc. You buy a house then you are forced to pay a monthly Home Owners Association (HOA)- for what- a mowed lawn?</p>
      <p>I challenge any foundry to tell me how often a 'joe-blow' kinda guy buys a one-time license for sending PDF to a friend or co-worker. </p>
      <p>As in: "Hey font company guy, yah its me again, I need another license, because when I used that first license to send my resume to my homegurl- (she's like smart 'n stuff with the graphics)- she said it kinda sucks and I needed to change some stuff around again, so heres another $12 or $19 bucks" (MIMBO version)</p>
      <p>NOT!!!</p>
      <p>I think the PDF fee is mainly targeted at the corporate, periodical, publishing users. They can afford to pay those fees and (maybe) if I was a type designer I would justify it because of the large scale of transmissions. But really, small frys like myself cannot be the target user. I just can't see it. Most EULA's don't make that distinction between big guys and you and me. If they did this topic would not exist.<br>
      So when I see that clause in the license (WINK WINK) I know who there really talking to!</p>
      <p>Here are some things I will and will not do.</p>
      <p>1. I never ever lend fonts.<br>
      2. I don't steal fonts, or mp3's for that matter.<br>
      3. But If I had a laptop I would put it on the laptop even if the EULA said only one machine- but not many foundries do.<br>
      4. Fonts from old computers I take to the new computer as in all cheesy win 3.1 fonts from  my i386, I have copy on my mac- WIDE LATIN ANYONE?</p>
      <p>In the words of Judge Hatchett: "Don't get me testifying up in here",</p>
      <p>Mikey</p>
      <p>As of right now I don't know how I feel about the EULA's that compel you to pay extra to make flash animations for the web</p>
