      <p>Well, I'm surprised at the comparison: disobeying the EULA vs. drugs and murder. You certainly made your position clear!</p>
      <p>My point was legal. A EULA is a standard contract, and not everything that it is says is legally binding (enforceable). By this I don't mean to deprive anyone of the fruit of their labour. I am simply saying that the rights of providers and consumers are determined by the entirety of the legal system, of which the EULA is only a part. Mystical reverence of the EULA is naive and inappropriate.</p>
      <p>I also object to the term piracy and similar terms invented by pharmas, motion picture associations etc. These terms serve only to delegitimize a healthy debate surrounding the scope of the rights in intellectual property. The society that created IP rights has the right to define them. Just because someone has an economic interest does not mean they have a legal right.</p>
      <p>Best,</p>
