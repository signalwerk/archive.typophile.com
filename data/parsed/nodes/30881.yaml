      <p>With respect to fonts, I don't think anyone would disagree with this principle... </p>
      <p>"The way the system should work is, you buy something, you own it." </p>
      <p>But in most cases font EULAs don't take anything away from this, they add rights you wouldn't normally get if you purchased a CD or a book - for example the right to distribute an infinite number of copies of the font, providing they are embedded in a document file or PDF, the right to modify the font and commercially exploit that modified font, the right to make five copies and install them on different devices, the right to download the font to a laser printer to improve printing performace, the right to use the font as the basis of a logo for a billion dollar corporation, etc., etc.,</p>
