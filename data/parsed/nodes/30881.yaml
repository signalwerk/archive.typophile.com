      <p>From both sides of the aisle, I feel a EULA should allow for a job to be printed by the client. (I don't mean any printimng of any thing using that font. I mean the job the designer sent them.)<br>
      Embedding a font in a PDF for the purpose of sending it to your client or offset printer is the best solution and should always be allowed without an extra fee. What the client bought from the designer was that document and they should be able to print it. If they choose to make a new document ontheir own inhouse, then they should license their own copy. Embedding is far more preferable to me than sending a copy of the font to the printing firm along with the InD files.</p>
      <p>ChrisL</p>
