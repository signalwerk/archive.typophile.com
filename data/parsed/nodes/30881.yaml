      <p>Can't there be a middle ground between "I own this therefore am free to do whatever I want with it, give it away to all my friends, resell it, make oodles of money off it" and "I am leasing this for personal use only on my computer network and if I try to actually use it in a job I'm forced to cough up a small fortune for the right to embed it in a pdf or give the font along with the job to my client"?</p>
      <p>I know this ground has been trod before, but as a freelance designer who wants to obey the EULA but feels like my hands are frequently tied, hired by clients who don't have deep corporate clients, I find myself all too often in EULA violation. While I understand and respect intellectual property rights I do feel like the EULAs don't really serve the End User much at all.</p>
