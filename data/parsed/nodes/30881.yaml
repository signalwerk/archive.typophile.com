      <p><em>I’m forced to cough up a small fortune for the right to embed it in a pdf or give the font along with the job to my client”?</em></p>
      <p>Those are two different issues.<br>
      For the first, many foundries (such as mine) allow embedding in pdfs. So you should use their fonts.<br>
      For the second, if your client wants to do typesetting using a non-bundled font that you spec, s/he should licence it as well. Sure, you may balk at having to use common fonts, but the difficulty is with you or your client, not the foundry.</p>
