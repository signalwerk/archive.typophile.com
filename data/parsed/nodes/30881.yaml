      <p>A LOT of foundries require an additional fee to embed the font into a pdf.</p>
      <p>While I'll agree that the client should buy their own license if they intend to continue to use the font (hard to enforce I know) I feel that it's excessive have to purchase an additional license in order to send the font to a printer along with a specific job.</p>
      <p>As I've said before, overly restrictive EULAs IMHO just encourage piracy. Or discourage designers from purchasing fonts, which serves no one.</p>
      <p>The fact is that there will always be people trying to get around the rules no matter how loose or tight they are. I'm sure most of the users of this forum have, at some time, used a font they didn't license. There will always be clients who balk at an additional fee (which is why I build it in beforehand). But for most of us, it seems there should be a set of rules that are simple, clear, fair, and mutually beneficial to the designer and the foundry.</p>
