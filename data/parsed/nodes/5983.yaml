    html: <p>Heinz Schumann's <a href="http://www.myfonts.com/fonts/urw/stentor/t/testdrive.html?s=farbband&amp;p=48" target="_blank">Stentor</a> has a similar feel, but without the quirky angularity. <br> <br>I've skimmed through the Jaspert 'Encyclopaedia of Type Faces" and that's about the closest I saw. I wonder if someone like Dieter Steffmann, who didgitizes a lot of German and old typefaces, has seen this one. I will try writing to him about it.</p>
