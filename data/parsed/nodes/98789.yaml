    <p>Hello,<br>
    I have created some really big .ttf-fonts: About 2.2 MB each! The fonts are display/logofonts, with a lot of graphic-effects such as scratches,<br>
    holes, etc. Are there any way to reduce the fontsizes? The goal is to make them ready also for webfont usage ...<br>
    Thank you for any assistance in this case ;-)<br>
    Best, Morten</p>
