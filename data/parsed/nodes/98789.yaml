      <p>When using the optime function in FontLab it is a good idea to first copy al the glyphs to the Mask layer. It makes it very clear if glyphs have changed (to much).<br>
      And for web you can use other formats than TrueType, so you could start with OpenType CCF and see what filesize you get after conversion. EOT and WOFF will give you a reduced filesize.</p>
      <p>@hrant. Very clever but reminds me much of the old converted TrueType's.... brrrr</p>
