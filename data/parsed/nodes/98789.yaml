    html: |-
      <p>There are two possible problems, with different solutions. One is the overall font size which may be a factor in loading time as a webfont, and the other is glyph complexity.</p>
      <p>Some older systems, with less computing power or memory, are not able to render over-complex fonts. If your glyph complexity is the result of scanning artifacts with superfluous nodes, etc., the solution is a lot of detail work to clean them up. FontLab's "optimize" function can sometimes help, but its results need to be reviewed.</p>
      <p>The effect of the overall font size varies with your audience. Two megabytes over a relativel hi-speed internet connection isn't the worst thing in the world (the font is only downloaded once), but it could be very painful over slower connections. Reducing individual glyph complexity will help, but probably not significantly. </p>
      <p>You can reduce the number of glyphs, use 'composed' glyphs (where parts of glyphs refer to parts of other glyphs instead of having separate outlines). This does NOT work for opentype fonts, but it does for TrueType. There are probably some other methods that I'm not aware of.</p>
      <p>- Herb</p>
