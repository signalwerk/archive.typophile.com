    html: "<p>Sally: <br> <br>I tried the mathmatical/literal alignment in ealier development of the logo w/out the \"HAYES GREEN BEACH\", but it didn't seem to work visually. I have tried to create an optical alignment, or rather, balance. Similar to how the bottom edge of the \"G\" crosses the baseline, the bowl of the \"B\" crosses the imagined vertical line. The left side is a little more complicated with the graphic. I considered the direction of the angle, the overall shape and the lighter color of the graphic in determining relative balance between it and the byline. I could be wrong, but that was my reasoning. I used the old squinting technique</p>"
    html_clean: "<p>Sally: <br> <br>I tried the mathmatical/literal alignment in ealier development of the logo w/out the \"HAYES GREEN BEACH\", but it didn't seem to work visually. I have tried to create an optical alignment, or rather, balance. Similar to how the bottom edge of the \"G\" crosses the baseline, the bowl of the \"B\" crosses the imagined vertical line. The left side is a little more complicated with the graphic. I considered the direction of the angle, the overall shape and the lighter color of the graphic in determining relative balance between it and the byline. I could be wrong, but that was my reasoning. I used the old squinting technique</p>"
