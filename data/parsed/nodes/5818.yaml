  - id: 41390
    user: 2923
    date: 2004-08-03T14:04:00
    date_raw: 3 Aug 2004 — 2:04pm
    votes: null
    html: "<p>SO far - my favorite is the centered between lower left and b (sally's #2), but it might be the lines that are making that such a strong alignment. Would a full justification work - it came up in sally's previous post and it didn't look bad - it would get rid of the doubt.  <br> <br>I have to say though that I worry about this should it be presented at a much smaller size - you run the risk of fill in in letters like the R, A, P, etc. once it gets on press - partly will depend on stock. If you will keep it this size (on one line) could you maybe use a more open version of the face? <br> <br>What will the uses of this version of the logo be? Or will this be the \"official\" logo? <br> <br>I really wasn't against #1 in your original post, while I understand that you want to keep emphasis on HGB, I think that in the uses when it is necessary to have that identifying tagline, it should be easily legible. The problem is when you add in Hayes Green Beach (something that is merely clarifying) you end up having to reduce the Memorial Hospital (something which is important information). Which do you sacrifice for the other? I think the sacrifice of Memorial Hospital at smaller sizes may be a little too much. However - I do think the size in the 1st one could come down or be lighter to make it recede a little more. <br> <br>Having said that mouthful - I love all three of your original concepts - very clean, very corporate - nice - I really like #2 hope you can use that for someone else someday.</p>"
