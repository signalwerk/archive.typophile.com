  html: |-
    <p>Here is the info i can provide:</p>
    <p>The Typeface chosen for the headlines is <a href="/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a> from Hoefler, you can see it here, i might variate the weight from article to article, but usually go with medium.<br>
    (see here: <a href="http://www.typography.com/catalog/gotham/more5.html" target="_top" rel="nofollow">http://www.typography.com/catalog/gotham/more5.html</a>}</p>
    <p>It will be for a magazine about culture and life on a danish island called "funen" - it's qualities (the ones we try and get across atleast) are that of hardworking, sturdy, stabile, well crafted, down to earth exelence.</p>
    <p>I hope to print on white uncoated paper, around 100-120 gsm</p>
    <p>The body copy i hope to set in three collumns</p>
    <p>format - close to a regular a4</p>
    <p>i'll look forward to any well qualified bids on a serif body copy face (also used bigger for pull quotes)</p>
