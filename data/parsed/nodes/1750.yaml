    html: <p>Yes, the 505 is nice too. Both the 505 and Linoletter are by André Gürtler (the latter with Reinhard Haus). The earlier Egyptienne F is Frutiger's. <br> <br>BTW, didn't <i>Eye</i> recently pick up one of these Egyptians for its Reviews section? I don't have a copy here so I can't check which one. <br> <br>Hrant, what's so *infamous* about Linoletter? Did I miss that episode of <i>60 Minutes</i>? <br> <br>-- K.</p>
