    date_raw: 1 Aug 2002 — 7:54am
    date: 2002-08-01T07:54:00
    votes: null
    html: <p> &gt; what's so *infamous* about Linoletter? <br> <br>Well, actually I guess it's not famous enough to be *infamous*... But it's the type of design (hyper-rational eurocratic*) that gets a bad rap among today's oh-so-intuitively-talented "artiste"s; and the -admittedly rare- comments I've read about it were negative. <br> <br>* A Gurtler specialty. I don't like bureaucracy, but I actually don't think he was guilty of that - I personally love the guy. Unica rules. And the Egyptian505 numerals are what they need to be. <br> <br>hhp </p>
