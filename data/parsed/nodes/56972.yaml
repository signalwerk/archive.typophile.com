    html: |-
      <p>We are a blog, among other things: <a class="freelinking external" href="http://typophile.com/uppercaseblogs" rel="nofollow">http://typophile.com/uppercaseblogs</a>. I have been interested to see the quality of the uppercase blogs at Typophile improving as more people get into it. Because it has such a broad base of authors, the content quality varies, but you get some esoteric things you might not find anywhere else. </p>
      <p>I have have sometimes debated whether to post on my Typophile uppercase blog or on my site <a class="freelinking external" href="http://betatype.com" rel="nofollow">http://betatype.com</a>. It seems like if you are interested in spending the time and posting nearly every day, you could gain a readership on your personal type blog. If you are interested in posting from time to time, but want to reach a broad readership and get feedback, the uppercase blogs are a good place to write.</p>
      <p>For now, I have decided to use Betatype as a project blog and post to my Typophile blog if there is a typographic point of interest somewhere else on the web. In reality, I post very rarely to either :(</p>
    html_clean: |-
