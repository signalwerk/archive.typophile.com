      <p>“I find in terms of font, fun is characterized as childish, cliche even kitsch. Would you agree?”</p>
      <p>It’s like furniture. </p>
      <p>What most big-box furniture stores call ’modern’ is really something designed in 1980 that is really big and poofy.</p>
      <p>Furniture snobs, though, tend to use ’modern’ to refer to mid-century pieces created by the likes of the Eames.</p>
      <p>So, mass market: fun = comic sans<br>
      Type and design market: fun = highly functional typefaces with a strong personality</p>
      <p>I think those in the industry would use the term ’novelty’ over ’fun’ to describe the often goofy looking ’childish’ faces.</p>
      <p>“Dancing is fun, but not marching. “</p>
      <p>You need to rent Stripes again, Nick. ;o)</p>
