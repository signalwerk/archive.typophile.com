      <p>“Bounce” is the quintessential feature of fun type.<br>
      That’s a lettering term to describe not being rooted to the baseline.<br>
      Rotation—not being strictly vertical—could be construed as a side effect of bounce, as could “wander”, which would mean that letterspacing is irregular; rotation and wander are what happen when there’s bounce, as the trampolinist demonstates.</p>
      <p>Dancing is fun, but not marching. </p>
      <p>Any typeface can be bounced, and thereby funnified, so it’s a typographic aspect of layout, not in the font per se.<br>
      I suppose the typographer could also play with size and scaling (horizontal to vertical proportion).</p>
      <p>However the same principle of deviation from strict regularity may be applied to the design of glyphs.<br>
      In small degree, this provides wit; a bit more and it becomes cuteness; further still, and into the indiscriminate area of professional sloppiness, or vernacular amateurism. But keep going and you end up with something like Fontesque, in which not only is the quality of bounce embedded, but there is also pointed deviation from regularity in counter size, serif size, stroke width, terminal treatment (i.e. arbitrariness in use of ball or adnate terminals) and serif genre (i.e. bracketed, slab, or hooked).</p>
      <p>Further with the dance metaphor, syncopation is good, emphasizing an off-beat. So there is some organizing principle in the disarray of fun. Going totally free-form is generally outside the comfort zone.</p>
      <p>In any design context, there is a norm, so a type choice which is slightly more irregular than normal for that kind of work will start to be fun, along the axis of wit to cute to cloying to...naff.</p>
