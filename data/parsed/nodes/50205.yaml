      <p>Well topucafo, i feel that a font doesn’t have to be too expressive in itself to emote the message. </p>
      <p>For instance, take a font, reduce the letter spacing and put them on black as negative space, it will create a real tension in layout. Now again take the same font, give it some free space, use bright colours and you will see that same font will emote Joy.</p>
      <p>The final appeal depends a lot on the composition and visual treatment also.</p>
