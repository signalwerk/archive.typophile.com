      <p>Here are some nice vertical-stress fonts: <a href="http://new.myfonts.com/fonts/shinn/scotch-modern/" rel="nofollow">Scotch Modern</a>, a Walbaum (Storm's <a href="http://new.myfonts.com/fonts/storm/walbaum-text/" rel="nofollow">Walbaum Text</a> is nice if you're looking for something with lower contrast), <a href="http://new.myfonts.com/fonts/fontbureau/miller/" rel="nofollow">Miller</a>, maybe <a href="http://new.myfonts.com/fonts/linotype/didot/" rel="nofollow">Didot</a> if you're going very high contrast, <a href="http://new.myfonts.com/fonts/shinn/worldwide/" rel="nofollow">Worldwide</a> (but that's probably too heavy), and <a>Whittingham</a> (another Scotch revival).</p>
      <p>Other, slightly crazier ideas include Perpetua (probably x-height too small), Fenice, New Caledonia, or <a href="http://new.myfonts.com/fonts/fontbureau/farnham/" rel="nofollow">Farnham</a> (display weights should be nice and light).</p>
      <p>Hope this helps.</p>
