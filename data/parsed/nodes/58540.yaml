      <p>Christian</p>
      <p>It is not that I think that the "wild and crazy" w should not have been a part of the font, just maybe in a secondary position... as the alternate. To me as a calligrapher/lettering artist I think they stick out as a sore thumb! Not ugly mind you!  but maybe like a disruptive child in a classroom. Purely and simply subjective on my part... not to cast aspersions. I see a more cohesive flow in the second eg. Especially for text.</p>
      <p>Nice work by the way, as always a class act.</p>
      <p>Michael</p>
