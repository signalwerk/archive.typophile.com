    <p>Hi All,</p>
    <p>I posted a question a while back about a suitable replacement for Our Bodoni Light for body copy in a Magazine. The whole idea was scrapped for a few months and now I'm having another go at it. The mag is a lifestyle title, focusing on fashion, food, culture, celebrity etc. It targets upper middle class Canadians. I'm looking for something with a vertical axis and a fairly large x-height that doesn't feel too dark on the page as the mag is quite text heavy. I've tried out several other Bodonis and think it's best to stray away from them. We use Trade gothic for headers and captions and I'm having some difficulty finding something that fits. I'm stumped.</p>
    <p>Any suggestions??</p>
  html_clean: |-
