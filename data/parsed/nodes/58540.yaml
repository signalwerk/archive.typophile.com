    html: |-
      <p>Michael:</p>
      <p>When designing a historically-based typeface as a survey of a genre - in the case of Brunel, the English Moderns released by a number of foundries (including but not limited to the work of the Caslon foundry and John Isaac Drury) between about 1790 and 1850, as Matthew Carter's Miller is a survey of Scotch Romans from a number of different punchcutters - rather than a revival of a specific typeface, one of the main challenges is deciding which divergent forms are worth keeping, and how to prioritize them. It's the same old problem any responsible designer runs into when reviving something old: how do you balance making an accurate record of what existed while making something relevant to contemporary typography?</p>
      <p>In the case of the italic v and w, Paul felt that the earlier, more idiosyncratic forms of v and w, which are structurally quite similar to the Transitionals that came just before the first Moderns (i.e. the work of Richard Austin or John Baskerville), were interesting and beautiful, and well worth making the default form in part because they make a statement about the early Moderns, which tended to be much more organic than the later ones. This form was simplified over the following decades into the simpler, more familiar v and w, and we have included those as alternates as well. I'm generally not fond of stuffing fonts full of alternates, because I feel that they can quickly turn into a type designer avoiding making choices about what a typeface should look like, but in this case the alternate v and w seemed necessary, as they were also historically accurate and important.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Brunelvw_5524.gif"></div><p></p>
      <p>(edited - my image didn't show up the first time around)</p>
