      <p>From Hrant’s link: <em>In relation to the example of the artist, he doesn’t create art purely to make money, that’s merely a beneficial side-effect. He does it because he’s passionate about art and enjoys what he does. The same should apply to design.</em></p>
      <p>This is a bogus argument that’s used to keep weirdo artists in their place, impoverished, on the margins of society.</p>
      <p>It’s also very Freudian, locating work as an unpleasant aspect of the Performance Principle which drives the capitalist economy.</p>
      <p>But why shouldn’t everybody enjoy their work, not just artists? That certainly seems to be the direction the economy is headed, with <em>nobody</em> getting paid for content creation, on the theory that if they enjoy it, no remuneration required—but what I really meant with my egalitarian argument is that <em>everybody</em> should enjoy their work and get paid for it!</p>
      <p>(Except of course when they volunteer, in those exceptions I quoted above, from the AIGA, and one would hope they enjoy such contributions.)</p>
