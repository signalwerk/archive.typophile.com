      <p>David, if the way you "communicate" is called Berlowese, what should we call the way you "listen" to what people are actually saying, in plain language? BTW, I only detest certain individuals, and extremely few; corporations don't deserve such emotions.</p>
      <p>Chris, it's pretty simple: the biggest losers from spec work aren't the young, up-and-coming designers whose time isn't so valuable yet anyway - it's the big, tight-ship, over-charging studios (that as a rule produce culturally lethargic work). And they don't just lose money by losing given commissions - every time a beginner wins a spec commission (which means he has more talent than average), what it would cost for a studio to hire him goes up too.</p>
      <p>It's not that I want designers to be taken advantage of - quite the contrary! I simply believe that a berserker crusade against any and all spec work does most of us harm, especially culturally: no matter what your vocation, if you're only interested in money, I don't feel the world really needs you. Plus it really makes no sense to neuter natural human competitiveness - we have to properly leverage it instead.</p>
      <p>Don't believe the hype - think for yourself and don't be a tool for the holy cows of the design world.</p>
      <p>hhp</p>
