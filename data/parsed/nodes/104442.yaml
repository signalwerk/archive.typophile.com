      <p>&gt; harmful to designers and clients alike</p>
      <p>Yes, that's something that's not often talked about, but while the client may save some money in the short term, it's often a bad decision long term.</p>
      <p>The first step in a design project, especially identity projects, generally should be research. But with most spec projects the design work is being done by someone who knows little about their company, products and services, history, competitors, future plans, etc. </p>
      <p>And some of this information — especially future plans — is not available via Google; you've got to actually talk to management. Without this info you're basically providing top-of your-head, generic ideas that may not serve them well long-term.</p>
