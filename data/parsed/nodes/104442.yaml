      <p>Hrant, have you actually read what the AIGA and RGD web sites have to say, publically? (See my links above.)<br>
      They are cognizant of the grey areas involved, e.g. the AIGA:</p>
      <p><em>What is spec work?<br>
      AIGA acknowledges that speculative work—work done prior to engagement with a client in anticipation of being paid—occurs among clients and designers. Yet not all unpaid design work is considered “spec work.” In fact, unpaid work may take a number of forms:</em></p>
      <p><em>Speculative or “spec” work: work done for free, in hopes of getting paid for it<br>
      Competitions: work done in the hopes of winning a prize—in whatever form that might take<br>
      Volunteer work: work done as a favor or for the experience, without the expectation of being paid<br>
      Internships: a form of volunteer work that involves educational gain<br>
      Pro bono work: volunteer work done “for the public good”<br>
      Not all of the above are considered speculative work, and in fact many designers choose to do unpaid work for a variety of reasons. Students and professionals may draw different lines on what constitute unacceptable practices. In each case, however, the designer and client make the decision and must accept the associated risks.</em></p>
      <p>Fascist posturing?</p>
