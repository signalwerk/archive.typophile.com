      <p>David, "design contests", also known as asking designers to work on a speculation basis or "on spec", are controversial. I won't go into the whole thing as we've discussed it here before, but most of your submissions will come from amateurs and students. A pro making a good living is unlikely to do design work for free, unless perhaps it's for charity or there's a huge potential payoff. </p>
      <p>A vague promise of profits someday or a potential job generally don't mean much. If you really want to hire someone, do it the regular way and post an ad, interview people, review their portfolios, and hire someone. Or if money is tight, hire freelancers to do individual jobs.</p>
    html_clean: |-
