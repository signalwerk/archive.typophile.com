      <p>Hrant, are you an active member of any graphic design organisations? Or are you, indeed, actively involved in the graphic design business at all? I ask, not to be unkind, but simply because you don't seem to show much understanding of how that business and its professional organisations operate. The sheer number of freelancers in the graphic design field make the notion that 'large design studios' -- who? -- control the professional associations unrealistic.</p>
      <p>As Nick -- someone who is active in graphic design organisations -- points out, there are ways to organise competitions that are acceptable within the professional practice policies of these organisations. Personally, if I were interested in holding a design competition, especially as part of a product development process, I would contact AIGA or Icograda or one of the other large design organisations and ask them to help me shape it in a way that they would endorse, and which would then make the competition attractive to their members.</p>
