      <p>According to the U.S. Department of Labor, an intern must be paid minimum wage (or more) unless the following criteria are met:</p>
      <p>1. The internship ... is similar to training which would be given in an educational environment;<br>
      2. The internship experience is for the benefit of the intern;<br>
      3. The intern does not displace regular employees...;<br>
      4. The employer that provides the training derives no immediate advantage from the activities of the intern; and on occasion its operations may actually be impeded;<br>
      5. The intern is not necessarily entitled to a job at the conclusion of the internship; and<br>
      6. The employer and the intern understand that the intern is not entitled to wages for the time spent in the internship.</p>
      <p><a href="http://www.dol.gov/whd/regs/compliance/whdfs71.pdf" title="http://www.dol.gov/whd/regs/compliance/whdfs71.pdf">http://www.dol.gov/whd/regs/compliance/whdfs71.pdf</a></p>
      <p>One of the most valuable experiences of my career was an internship (paid) in the design department of a corporation. Although I did useful work for them, the department manager viewed it as an education experience for me and would have me attend meetings, visit suppliers, etc even though I served no useful purpose at those, it was just so I could observe and learn.</p>
      <p>But over the years at other places I've also seen interns given tasks like buying donuts, running errands, getting the manager's car washed, etc. Zero educational value.</p>
