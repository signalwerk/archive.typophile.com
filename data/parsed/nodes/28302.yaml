      <p>One thing that is quite interesting is the distribution of sales for different fonts in the library.</p>
      <p>If you order the fonts in the Adobe Type Library by sales rank, and then do a bar graph of the units or dollars sold, it looks like a parabolic curve. It's really striking, and surprised me when I first saw the figures. It's like (speaking off the cuff here, without looking at figures) even the twentieth ranked font probably sells 50x as much as the median ranked font.</p>
      <p>I assume it's similar for any type foundry with a large number of fonts, but I'd be curious to hear confirmation of that theory....</p>
      <p>T</p>
