    html: |-
      <p>Royalties range from around 15% to 65%. The rate is negotiated between the designer and the distributor and depends on a lot of factors, mainly how much or how little effort the distributor puts into promotion. Exclusivity is another big determining factor as well as whether the designer did all the development work themselves or collaborated on development with the distributor. Of course, if a designer sells directly, he or she gets the whole amount, minus transaction costs, promotion, and support.</p>
      <p>Given this, I have set up a little scenario. Let's say you are a type designer with fonts being sold at three different distributors at royalty rates of 15%, 50%, and 65%. Let's say you would like to earn $30,000 per year from font sales. Let's also assume you only sell single fonts at a retail price of $30 each. Here is how it looks:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/scenario_4304.gif"></div><p></p>
      <p>(The bottom row represents an average of the other three rows.)</p>
      <p>This is of course over simplified. Most designers also sell fonts in sets at a discounted price and multi-user licenses at a discounted price. This means less income per font or per user, so you have to sell more to make up the difference. In practice, though, discounts like this tend to increase sales. </p>
      <p>Another factor is the retail price. A high price will bring in more money per font, but may result in lower sales. A lower price may increase sales but bring in less money. It's not easy to determine the best price for a font.</p>
      <p>Of course, this simple scenario does not include things like development, support, or marketing costs. And lastly, you have to have fonts that people want to buy. This may seem obvious, but is easier said than done.</p>
