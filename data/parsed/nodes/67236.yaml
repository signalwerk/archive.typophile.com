      <p>Thanks so much, everyone.  Really appreciated.  Here's what I've decided to do (in case anyone finds themselves in a similar situation).  </p>
      <p>Explain to the client that their wishes will be respected, but that it would be poor form on my part if I didn't talk a little about Papyrus.  Tell them that it has a low value perception etc., and that holistic health practices do not have to equal hand hewn, scratchy or ethnic typeface styles.  What I think of when I think of their practice is: clarity, strength, flexibility (arcs and curves), leanness and light.  I'll then show them good examples of design for such studios and bad design using Papyrus. Then give them examples of their logo with Papyrus and with the typefaces I will choose. </p>
      <p>I'll ask them to think about it for a few days before deciding and if, in the end, they still want Papyrus, then I'll do that for them.</p>
      <p>EDIT: Adding this comment from a friend, because it's funny: '...letting her know<br>
      that you would use it if required helps.  Too bad you can't mention that<br>
      "If you do force me to use it, I will never be able to admit performing<br>
      this service for you, and would have to take my name off of all documents<br>
      associated with your design package."'</p>
