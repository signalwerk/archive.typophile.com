      <p>Nick &amp; quadibloc, I understand the stance but have to voice a little disagreement on this one. The merits or demerits of the typeface's aesthetic characteristics aside, the ubiquity  of papyrus can't possibly stem from the fine-tuned tastes of the world's tweeners personalizing their diary blogs...the face was obviously meant to project a specific communicative intent—ancient, foreign, egyptian, crumbling scroll, etc.,—but there are few applications I can think of that would make good use of what this typeface says visually...(maybe the Stargate franchise?) (Also, is it odd to admit typefaces speak to me?)</p>
      <p>It'd be hard to deny papyrus is overused and abused as by everybody with a computer who can call it up among their twenty or so pre-installed fonts. When I see it in the world, I find it's almost always a lazy shorthand attempt to communicate "creative" or "funky" or "tweener diary" or "yoga" or "sci-fi movie" or "organic aisle" or "candles by Jan" or "asian restaurant" or "bong shop" or "tattoo parlor" or "office party memo" or "gardening supplies" and on and on and on</p>
      <p>But here's what honestly gets my goat about this one: Papyrus speaks, and speaks loudly—but what it says, is "I'm funky and creative and unique" in a way that is so painfully common, comfortable, familiar, underwhelming, thoughtless, default, a little bit ugly, and herd-instinct-approved. It's like the PT Cruiser of typefaces...</p>
