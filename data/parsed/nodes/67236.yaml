      <p>There are two contradictory principles at work here.</p>
      <p>Firstly, a typeface is one of many tools that a designer uses to create a page, an identity, a signage system, whatever.<br>
      So fixating on Papyrus is not conducive to the synergy of a good design, and constrains originality and the development of something custom tailored to the client.</p>
      <p>Secondly, it's unavoidable that when "everybody" has a computer and a font as distinctive as Papyrus is bundled with Apple, Microsoft, and Corel, there is going to be consumer awareness of this professional tool--and a little knowledge is a dangerous thing. Papyrus certainly picked up a lot of good karma being used for the captioning in Avatar. Damn, it's so easy to recognize with its humunguous extenders. What other typefaces are like that? Delphin is all I can think of.</p>
      <p>So it's a real challenge for designers to deal with their clients' font-specific prosumer tastes, especially when these tastes are shared by the target market.</p>
      <p>Why not develop two treatments, one of which uses Papyrus, and market test them?<br>
      After all, it's just a tool--surely there must be some way for a designer to put her stamp on it and use it in a subtle and creative way? (Easy for me to say!)</p>
    html_clean: |-
      <p>There are two contradictory principles at work here.</p>
      <p>Firstly, a typeface is one of many tools that a designer uses to create a page, an identity, a signage system, whatever.<br>
      So fixating on Papyrus is not conducive to the synergy of a good design, and constrains originality and the development of something custom tailored to the client.</p>
      <p>Secondly, it's unavoidable that when "everybody" has a computer and a font as distinctive as Papyrus is bundled with Apple, Microsoft, and Corel, there is going to be consumer awareness of this professional tool--and a little knowledge is a dangerous thing. Papyrus certainly picked up a lot of good karma being used for the captioning in Avatar. Damn, it's so easy to recognize with its humunguous extenders. What other typefaces are like that? Delphin is all I can think of.</p>
      <p>So it's a real challenge for designers to deal with their clients' font-specific prosumer tastes, especially when these tastes are shared by the target market.</p>
      <p>Why not develop two treatments, one of which uses Papyrus, and market test them?<br>
      After all, it's just a tool--surely there must be some way for a designer to put her stamp on it and use it in a subtle and creative way? (Easy for me to say!)</p>
