      <p>Nick, Paul: Fonts don't work in a vacuum. Whether a font<br>
      is "right for the job" depends on how people see the font, and<br>
      that is certainly affected by how/where they see the font used.<br>
      Ignoring that fact is something an artist would do.</p>
      <p>And there's a critical difference between something like Papyrus<br>
      and something like Gotham*: the latter has a much more "generic"<br>
      appearance, while the former is in-your-face. Designers who use<br>
      Gotham are -hopefully- shooting for subtlety, knowing very well<br>
      that almost everybody will barely even notice what it is. Papyrus<br>
      is nothing like that.</p>
      <p>* Although that's over-used too.</p>
      <p>hhp</p>
