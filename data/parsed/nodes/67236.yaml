      <p>To develop on that: Gotham is a face that can be used to produce strong contemporary multi-line settings (e.g. tightly leaded all caps) that give typographic structure to a layout, whereas Papyrus tends to float, its effectiveness coming from its display-lettering qualities, i.e. the hand-made, textured finish of its letter forms.</p>
