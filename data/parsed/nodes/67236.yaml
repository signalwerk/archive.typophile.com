  html: |-
    <p>I have a client who would like to use Papyrus in their branding, alongside the logo I designed for them (logo attached).  They mentioned that something similar would be ok, so I'm scratching to find something that would suit them (think personal trainer who uses yoga in her practice and likes tribal design) and not make me feel professional pain.  I would love to hear some suggestions.</p>
    <p>I'd also love to hear how others tactfully deal with clients that want to use fonts (or other design elements) that you just can't bring yourself to use?  How do you tell them that their choices are... less than ideal?</p>
    <p>Thanks!</p>
