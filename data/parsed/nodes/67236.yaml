      <p>You really just need to defend your work and your creation. Do your best to explain why you design things the way you do – ie. why you use a certain typeface or colour. As long as you put thought into what you're designing, you should be able to defend it and hopefully the client will understand. In a perfect world, it would work every time, but some clients won't budge and then you also need to learn to let things go. </p>
      <p>As for the client who wants Papyrus, try explaining to them how overused Papyrus is and how you want to help them be more distinctive that every other fitness/yoga/tribal brand. Maybe she'll understand and at least you tried.</p>
