      <p>Wow.  That's a lot to respond to... </p>
      <p>Everyone will have their own idea as to what works and what doesn't and I think all the above opinions are valid for the person who wrote them... not necessarily for me, but I find all opinions valuable in one way or another, if for nothing else than to clarify my own thoughts.</p>
      <p>That fact that Papyrus is often used by the lay-person is not it's only problem, but this does reflect poorly when used poorly and there are a lot of instances where that happens.  I don't often see it used well, as has been suggested.  This leads to a wider low opinion of businesses that use this font and so of course I don't want my clients or my work in that kind of company.  To steal a phrase from hrant: "Fonts don't work in a vacuum".</p>
      <p>As to it being commonly reviled being due to the fact that it's commonly used:  There are fonts that have been around longer and are used more often that I have zero problem with. Helvetica, although much maligned by some (i think it's the boredom factor), is a well-designed font.  </p>
      <p>Papyrus, as Nick says, is a novelty font.  There's a reason it is in the "fun" collection in Font Book.  It's very gimmicky looking and just far too literal. It doesn't belong in anyone's visual/corporate ID or branding, in my opinion... unless it's theme or feel appropriate, say a spa that using Egyptian Threading as one of it's services or Chinese massage... or a child's class project on South East Asia.</p>
      <p>I also believe it is inherently flawed, although put this down to personal preference if you like.  It's descenders are different lengths, ascenders are even, but too tall.  This lack of consistency in appearance does actually make it break down at small sizes and in certain mediums.  The chips out of it don't help either, although I wouldn't say they were aggressive and could work on other type-faces, but taking an idea to farcical extremes never did it any favours in terms of concept.  I'll say one thing in it's favour.  It has generous counter-spaces.  I like that.  I think it's one of it's saving graces.</p>
      <p>My response to Papyrus has nothing to do with the prevailing design brain.  This is for branding purposes, not a movie poster.  I can guarantee you that my client doesn't perceive her business as a novelty.  I didn't actually realise how much hate their was for it until I was asked to use it and thought: "You must be kidding." and started looking around for ways I could express this to my client without causing offence.</p>
      <p>Don:  Thanks for the suggestion.  I did consider Elli actually, but the client loves flow and I think Elli might be a little too sharp and I would prefer to use something more regular for type that will be used with a logo for better reproduction at small sizes in a variety of media. </p>
      <p>Typodermic and xo: Heh.</p>
