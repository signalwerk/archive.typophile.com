    html: |-
      <p>One factor to think about here is something Mark Simonson noted a while ago. Amateurs tend to be attracted to "highly flavored" faces, because they are noticeably distinctive to everyone, and can make a strong visual statement on their own. </p>
      <p>But that very strength has two problems: 1. It makes them less flexible, and less easy to harmonize with other design elements and 2. It also can make them go stale more quickly.</p>
      <p>I think these two factors mean that the highly flavored face needs to really work graphically for the use, if it is not to go stale for those who use the shop or services.</p>
