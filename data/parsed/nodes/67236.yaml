      <p><em>Whether a font is "right for the job"...</em></p>
      <p>Yes, that is important. But this thread addresses the "professional pain" that Papyrus causes.<br>
      So I think I can be forgiven for not wandering off topic, although not, apparently, for being an artist.</p>
      <p>[Papyrus] <em>is in-your-face. Designers who use Gotham are -hopefully- shooting for subtlety...</em></p>
      <p>This is a slightly different idea than what I had mentioned earlier, "...[Papyrus is] a very demonstrative "display" face, the design of which tends to overshadow the typographer's contribution..."</p>
      <p>To develop on that: Gotham is a face that can be used to produce strong contemporary multi-line settings (e.g. tightly leaded all caps) that give typographic structure to a layout, whereas Papyrus tends to float, its effectiveness coming from its display-lettering qualities, i.e. the hand-made, textured finish of its letter forms.</p>
