      <p>Papyrus was, when it first came out, a well-designed and original font. It's subsequent fate can't detract from that, and its overuse results from how well it communicates... a message that is much in demand of late.</p>
      <p>What is the difference between elitism and serving one's client as best one can? Obviously, it's motive: is it "my fellow typographers will laugh at me", or "your potential customers will laugh at you"?</p>
      <p>People who aren't typographers will notice they've seen Papyrus before at this New Age bookstore or that yoga center or the other T-shirt store or restaurant and so on. Having a unique and original typographic identity is a good thing that ordinary people appreciate. So it is perfectly legitimate to look for an alternative to Papyrus.</p>
      <p>The problem may be finding one. There are several - there have been threads here discussing this issue before in which many candidates were presented - but since none of them communicates the same thing in the same way as Papyrus, which alternative is suitable would have to be carefully chosen. Thus, for example, in some cases, one could use Ondine (also fairly widely used, though) instead of Papyrus, and in others it would be a very bad choice for a replacement.</p>
      <p>I mentioned Tuff: going in a different direction, one could consider Present.</p>
