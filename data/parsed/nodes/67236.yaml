    html: |-
      <p>Papyrus is a lovely face.</p>
      <p>I don't think overuse is the issue, because picky designers use stuff like Gotham which is all over the place.<br>
      The problem is that it's a face used by a lot of amateurs, and it looks damn good in their hands.<br>
      It's embarrassing for professionals to put themselves on a par with amateurs by using it.<br>
      It's common, or "naff" as the Brits say these days.<br>
      And it's not as if you can get designy or ironic with it, as is sometimes possible with Comic Sans.<br>
      Another thing, it's a very demonstrative "display" face, the design of which tends to overshadow the typographer's contribution, which is the main reason that designers avoid new and novelty faces.</p>
      <p>Compounding the problem is the fact that there are no adequate recherché substitutes.<br>
      Stewf's list demonstrates that.<br>
      Like Trajan, Papyrus is a well-proportioned and distinctive face with a lot of nicely rendered microdetail, so that it renders well at different sizes and in different environments.<br>
      So until someone comes up with another face which can match its qualities, tough.</p>
