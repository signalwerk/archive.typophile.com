      <p>&gt; Far too many of the denizens of Typophile are more<br>
      &gt; involved with style than design</p>
      <p>The word "style" is commonly used where referring to design trends, I use it myself all the time, but actually I think what we're talking about here is more in the realm of fashion rather than style. </p>
      <p>An example of the difference is if you looked at photo of a person taken in 1870, you'd probably have no idea if the clothes they were wearing were in fashion that year, but you could instantly tell if that person had style.</p>
      <p>Same thing with design. Just because a font or a design element is out of fashion (due to overuse, for example) doesn't necessarily mean it's got bad style. Helvetica, for example, is a good font, but it's out of fashion at the moment.</p>
