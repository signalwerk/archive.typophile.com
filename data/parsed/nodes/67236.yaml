      <p>Nick, what I was trying to say is that popularity of fonts as measured by sales doesn't necessarily reflect what's "in fashion" to professional designers, since pros probably make up only a minority of their customers, and many sales of Helvetica to pros are because it's a font they need rather than one they'd prefer to use. </p>
      <p>Just as the best-selling shirt in the U.S. probably isn't the shirt that a fashion designer would buy, or the best-selling couch probably isn't the one an interior designer would buy. </p>
      <p>I've got nothing against Helvetica, I use it all the time. But my sense is that most pros tend to stay away from it due to overuse and its association with work done a few decades ago.</p>
      <p>I agree with you that this is conjecture.</p>
