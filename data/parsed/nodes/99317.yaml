  html: |-
    <p>I'd like to have a little help on the following problem, thanks a lot!</p>
    <p>1.)   After exporting as OpenType Ps from Fontlab 5.1.2 (mac), my font looks/works great in Indesign and Illutrator. No problem. All kerning info is okay. But on the same computer (mac osx 10.6.8) in Word: no kerning info(!) AND the characters are cut-off on the upper part. (images below)</p>
    <p>2.)   On a Windows computer there's a similar problem:<br>
    (in Word) No kerning info and the characters are also cut-off. This time they're not cut off on the upper part but exactly on the Baseline.</p>
    <p>3.)    In the Windows-typespecimen some characters (for example the A) is cut-off on the left side. I guess that has something to do with the fact that the A crossed the line in the glyph window. I there any way to retain all the character-info on the left side of the line?</p>
    <p>4.)    In the fontbook and Mac typespecimen there's no problem at all. </p>
    <p>(I already did update the Kern-feature in the Kerning Assistance window.)</p>
    <p>I really don't know how to solve this problem, is there anyone with some advice?</p>
