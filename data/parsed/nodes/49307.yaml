    html: |-
      <p>The Niamey African Reference Alphabet has a number of problems, and so far as I can tell it was never widely adopted. In particular, I've not seen the lowercase eth form used in any African texts, so I think this introduction -- and the innovative uppercase form to distinguish it from the barred D -- was a non-starter. The display in the chart on the Wikipedia page shows a Croatian-style barred lowercase d instead of an eth as in the original Niamey document, adding to the confusion. In all the African orthographies I researched, the Ɖ was the uppercase of ɖ.</p>
      <p>If you look at <a href="http://www.bisharat.net/Documents/Niamey78annex.htm" rel="nofollow">Don Osborne's page on the Niamey alphabet</a>, you'll see that the French language version of the report did not show any uppercase letters. One of the books I consulted in my research in 1998 was <em>A thesaurus of African languages</em> by Mann and Dalby, the (English language) text of which is set in all lowercase letters. It presents a revised African Reference Alphabet that incorporates new letters proposed by the authors, including the inverted v as an a vowel variant.</p>
    html_clean: |-
