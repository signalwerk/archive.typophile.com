    html: |-
      <p>James, I recently did a project with MS specifying a glyph set for a pan-African UI font (much of the work based on research I originally did for them in 1998). I've got reasonably good data for about 200 African languages (mostly in paper form); from this research and from discussions on software Africanisation forums I've long since come to the conclusion that trying to target specific language coverage is a bad idea unless the number of languages is small. OpenType GPOS mark positioning makes it relatively easy to target the majority of African languages without needing to compile data about individual languages, which is difficult to come by.</p>
      <p>Note that some diacritic letters needed for African alphabets are not individually encoded in Unicode: they rely on combining mark characters. These can be handled using GSUB in the ccmp feature, but it is much more flexible to handle them with GPOS mark positioning.</p>
      <p>I gave a presentation on Latin glyphs for African fonts as part of a workshop with MS and Diane Collier at TypeCon in Buffalo (other presentations dealt with indigenous African writing systems). I've uploaded my slides to </p>
      <p><a href="http://www.tiro.com/John/African%20Presentation.pdf" title="http://www.tiro.com/John/African%20Presentation.pdf">http://www.tiro.com/John/African%20Presentation.pdf</a></p>
      <p>I don't know how useful they are without commentary, but feel free to contact me if you have questions.</p>
