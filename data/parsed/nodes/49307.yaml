      <p>I think some of the orthographies are still in flux. I remember back in the early 1990s when a book designer needed some Pan-Nigerian characters. Zapf had made a font for Pan Nigerian, but the designer want to use something different.</p>
      <p>Somebody with some official connections got involved in all this, and I was told that when a unified Pan Nigerian character set was first proposed, some people wanted a dot under characters (e,i,o, &amp; s, I believe); others wanted a bar below. A compromise was reached, whereby a bar with rounded corners was used -- it could also be thought of as an extended dot. Anyway, I made the characters up with that mark.</p>
      <p>Last year we set a book which had some Pan Nigerian, and at first, the author wanted those old marks, but in proof changed to wanting the dots, as shown at </p>
      <p><a href="http://en.wikipedia.org/wiki/Pan-Nigerian_Alphabet" title="http://en.wikipedia.org/wiki/Pan-Nigerian_Alphabet">http://en.wikipedia.org/wiki/Pan-Nigerian_Alphabet</a></p>
      <p>FWIW</p>
