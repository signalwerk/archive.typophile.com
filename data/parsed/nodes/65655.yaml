  html: |-
    <p>I was given the responsibility of designing the programme for my church choir's Christmas concert at the last minute, and threw one together in a single evening. So it's very basic, and I was very limited in my type choices, but I thought typophiles would appreciate a seasonally-appropriate example of multiscript typography (it's a Korean church in France). Sorry about the picture quality.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cantate1_5243.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/cantate2_4679.jpg"></div><p></p>
    <p>The Korean typefaces used were Munchebu Jemok Batangche (문체부 제목 바탕체; "Ministry of Culture titling serif") for the display and Nanum Myeongjo (나눔명조) for the text. The Latin uses Arno.</p>
