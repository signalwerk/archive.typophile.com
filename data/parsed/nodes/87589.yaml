    <p>I've been looking for quite some time now and have found relatively few typefaces which support the Pan-Nigerian and other assorted orthographies. As I am attempting to provide support for these orthographies in my typeface, I'm trying to find examples which provide properly constructed glyphs. So far, beyond the basic system fonts, I've really been limited to Gentium. As I want to make sure these characters are designed appropriately, I'd be extremely appreciative if anyone had any other references or tips.</p>
    <p>Thank you!</p>
