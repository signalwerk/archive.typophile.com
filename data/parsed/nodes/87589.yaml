      <p>Some related Tipophile threads:<br>
      <a class="freelinking external" href="http://typophile.com/node/78082" rel="nofollow">Eng and N with hook</a><br>
      <a class="freelinking external" href="http://typophile.com/node/73886" rel="nofollow">K with hook and others</a></p>
      <p>I also read Wikipedia pages for all documented African languages and also all pages for the base character letters, which link to unsuspect diacritical combinations. Note sometimes the English Wikipedia page for a given language may be not the more informative one.<br>
      .</p>
      <p><strong>John Hudson,</strong></p>
      <p>as usual, you kindly help us a lot with your deep knowledge. I was unaware about the pan-African support provided by Ebrima.</p>
      <p>How could I get more info about the languages targeted by Ebrima? I saw the font have precomposed vowel+ogonek and vowel+cedilla to all vowels. I cannot find most of these combinations in the research I did and would like to know about the languages actually using them.</p>
      <p>Besides this, some African combinations were not included in Ebrima, as Open O with dieresis (used in Dinka) or W with hook (used in Puguli). So I believe Ebrima development narrowed the language support according to some criteria to avoid the massive combinations one find in SIL fonts or African Serif.</p>
      <p>Any info on this will be very welcome.</p>
