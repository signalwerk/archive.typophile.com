      <p><em>Precomposed diacritics are only used in Ebrima if they were either encoded as such in Unicode, or involved merging of outline (as in the case of the letters with ogonek etc.).</em></p>
      <p>We generally follow the same principle in our SIL fonts. We used to include around 800 additional combinations primarily to provide better support for AAT, but we're removed those in the version that will come out next year.</p>
      <p>As for the Capital Latin Gamma (uni0194), we choose to keep it on the baseline. That seems to be reasonably well-accepted. On an interesting historical note, the Practical Orthography for African Languages (POAL) from 1927/1930, which influenced many alphabets of West Africa, has it on the baseline, but with a <em>flat</em> bottom.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/POAL-1930a_6712.jpg"></div><p></p>
