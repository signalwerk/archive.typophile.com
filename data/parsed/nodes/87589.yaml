      <p>Hi,</p>
      <p>From the data collected for the African Localization Network, I've seen nasalization of vowels indicated with cedilla, tilde above, tilde below or some nasal consonant after.</p>
      <p>The cedilla is recommended in Cameroon since the 1970s/1980s so I doubt this will be replaced by the ogonek. In other countries some dictionaries use the cedilla to indicate some other feature (like advanced tongue root).</p>
      <p>The tilde below are used at least in Sara-Ngambay in Tchad (I don't know if this was in the recent official alphabet, but at least it has been used for a few decades) or in some languages in Côte d'Ivoire (even if the -n is recommended there).</p>
      <p>In Senegal, there's some nasalized consonant or semi-vowels indicated with a circumflex, but it's not generalized.</p>
