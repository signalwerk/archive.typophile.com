      <p>Igor, when I was researching African languages in the late 1990s, I spent a week at the African Studies library at Northwestern University. While there, I noted the instability of many orthographies, and inconsistency in the use of diacritics. Sometimes this inconsistency seemed to reflect either particular mechanisms of text production, i.e. what characters were available on a particular typewriter, and sometimes the influence of colonial languages or the native language of linguists/missionaries involved in alphabet development. So one of the things I noted was that nasalisation -- which is an optional feature of many African orthographies -- was sometimes indicated with a tilde above the vowel, sometimes with an ogonek, and sometimes with a cedilla. I believe the latter is really a variant of the ogonek resulting from the presence of the cedilla on French typewriters. I suspect as orthographies become stabilised, some of this variation is likely to disappear, but my recommendation to Microsoft for Ebrima was to support the variants I had documented in my earlier research for them.</p>
      <p>The open o with dieresis should be supported in Ebrima with mark positioning for the combining dieresis character. Precomposed diacritics are only used in Ebrima if they were either encoded as such in Unicode, or involved merging of outline (as in the case of the letters with ogonek etc.). A huge number of additional diacritics are supportable with mark positioning.</p>
      <p>The Puguli alphabet is pretty new, and I'm not sure it was even defined when I was conducting research on African languages. If they're using the w with hook, then that should be added to Ebrima.</p>
