      <p><strong>John</strong>, thank you very much for the information. It's amazing how rich the study of alphabets could be.</p>
      <p><em>Another question:</em> in Ebrima the cedilla is linked to the first leg in H+cedilla and to the second one in A+ and uni0245+cedilla. I cannot find information about where the cedilla would be placed. Are there any known cultural or language preference on this issue?</p>
      <p>Actually, the criteria used in Ebrima is very near the way I built my project. My early idea was to include all base+diacritic combination as precomposed glyphs, but after some research (and helpful threads in Typophile) this proved not good. So I added all Unicode precoposed glyphs plus all <em>problematic</em> combinations. By problematic I mean the situations where diacritic is merged with or touch the base letter, and also combinations using uni0332, as the underline must match the base width.</p>
      <p>This gives an idea:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Base_6173.gif"></div><p></p>
      <p><strong>James</strong>, I sent you some material. Hope it helps.</p>
