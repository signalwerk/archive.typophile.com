      <p>Well, of course there were Zapf's fonts. I had these back in the mid 1990s, but don't think I kept them. I made up some of the needed characters in a different font for the University of New Mexico press to set a book. Things wound up where a U.N. representative looked the characters over &amp; both said they were OK and pleaded for more fonts with the correct characters. But nobody ever took things further. I'm sure your work will be appreciated.</p>
      <p>One thing I do remember was some wanted the underdot a dot, some wanted a bar. There was a compromise, where a bar with rounded corners was used. I think that got changed; I imagine the shapes of things are undergoing a certain standardization.</p>
