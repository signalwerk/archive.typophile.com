      <p>To my semi-amateur eye:<br>
      m - the left half looks wider than the right one<br>
      t - the ascender seems too high<br>
      g - looks good but probably falls out from the general context<br>
      7 - falls to the left<br>
      Also I doubt about some width in the UC, for example, such wide G.<br>
      Speaking about the overall style, I like it pretty much.</p>
