    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Klingspor</strong></p>
    <p>Gebrüder Klingspor </p>
    <p>Offenbach, Germany. Formaly known as <a href="/wiki/Rudhard%27sche%20Giesserei" class="freelinking" rel="nofollow">Rudhard'sche Giesserei</a>, renamed on January 1 1906 to Gebrüder Klingspor.</p>
    <p>Well kown for designs from <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> and <a href="/wiki/Walter%20Tiemann" class="freelinking" rel="nofollow">Walter Tiemann</a>. Also sold designs from <a href="/wiki/Peter%20Behrens" class="freelinking" rel="nofollow">Peter Behrens</a>, <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a>, <a href="/wiki/Otto%20Hupp" class="freelinking" rel="nofollow">Otto Hupp</a>, <a href="/wiki/Otto%20Eckmann" class="freelinking" rel="nofollow">Otto Eckmann</a>, <a href="/wiki/Rudo%20Spemann" class="freelinking" rel="nofollow">Rudo Spemann</a>, <a href="/wiki/Victor%20Hammer" class="freelinking" rel="nofollow">Victor Hammer</a> and <a href="/wiki/Hans%20K%C3%BChne" class="freelinking" rel="nofollow">Hans Kühne</a>.</p>
    <p>During the 1950s, the foundry's operations closed. <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>, who had owned the foundry for over a decade, continued distributing most of the typefaces. Many of the typefaces are sold in digital format today by <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a> (the German Linotype AG purchased D. Stempel AG in 1985).</p>
    <p>Today, the majority of Klingspor paraphenailia, including type specimens and books printed in Klingspor faces, as well as many handwritten pieces by Koch and other designers, are housed in the <a href="/wiki/Klingspor%20Museum" class="freelinking" rel="nofollow">Klingspor Museum</a> in Offenbach. Their website is <a href="http://www.klingspor-museum.de" rel="nofollow">klingspor-museum.de</a>.</p>
    <p>The Klingspor foundry, as well as its suceeding museum, have always had a close relationship with the Offenbach School of Design, which has had various names but has been known as the <a href="/wiki/HfG%20Offenbach" class="freelinking" rel="nofollow">HfG Offenbach</a> since 1970.</p>
