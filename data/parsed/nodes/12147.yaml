    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;:&nbsp;Klingspor</strong></p>
    <p>Gebrüder&nbsp;Klingspor </p>
    <p>Offenbach, Germany. Formaly known as <a href="/node/add/wiki?edit%5Btitle%5D=Rudhard%27sche%20Giesserei" title="Create node &quot;Rudhard'sche Giesserei&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rudhard’sche Giesserei</a>, renamed on January 1 1906 to Gebrüder&nbsp;Klingspor.</p>
    <p>Well kown for designs from <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Walter%20Tiemann" title="Create node &quot;Walter Tiemann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Walter Tiemann</a>. Also sold designs from <a href="/node/add/wiki?edit%5Btitle%5D=Peter%20Behrens" title="Create node &quot;Peter Behrens&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Peter Behrens</a>, <a href="/node/13485" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Karlgeorg Hoefer</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Otto%20Hupp" title="Create node &quot;Otto Hupp&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Otto Hupp</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Otto%20Eckmann" title="Create node &quot;Otto Eckmann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Otto Eckmann</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Rudo%20Spemann" title="Create node &quot;Rudo Spemann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rudo Spemann</a>, <a href="/node/12143" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Victor Hammer</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Hans%20K%C3%BChne" title="Create node &quot;Hans Kühne&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hans Kühne</a>.</p>
    <p>During the 1950s, the foundry’s operations closed. <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a>, who had owned the foundry for over a decade, continued distributing most of the typefaces. Many of the typefaces are sold in digital format today by <a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a> (the German Linotype <span class="caps">AG</span> purchased D. Stempel <span class="caps">AG</span> in&nbsp;1985).</p>
    <p>Today, the majority of Klingspor paraphenailia, including type specimens and books printed in Klingspor faces, as well as many handwritten pieces by Koch and other designers, are housed in the <a href="/node/13012" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor Museum</a> in Offenbach. Their website is <a href="http://www.klingspor-museum.de">klingspor-museum.de</a>.</p>
    <p>The Klingspor foundry, as well as its suceeding museum, have always had a close relationship with the Offenbach School of Design, which has had various names but has been known as the <a href="/node/12107" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">HfG Offenbach</a> since&nbsp;1970.</p>
