    date_raw: 4 May 2004 — 10:45pm
    votes: null
    html: <p>Sorry to hear that your newspaper's printer can't handle mid-90s technologies. Bummer. <br> <br>Just to elaborate on that, I've been told of a newspaper production system that requires that the Type 1 fonts and matching AFM files be actually loaded onto the RIP. Not much to be done about that one. But for anything less extreme, remember that once a PostScript flavored OpenType font is in a print stream, it literally is a Type 1 font. Same for it being in a PDF. <br> <br>What types of files does this newspaper printer accept, exactly? PDF? <br> <br>Cheers, <br> <br>T</p>
    html_clean: <p>Sorry to hear that your newspaper's printer can't handle mid-90s technologies. Bummer. <br> <br>Just to elaborate on that, I've been told of a newspaper production system that requires that the Type 1 fonts and matching AFM files be actually loaded onto the RIP. Not much to be done about that one. But for anything less extreme, remember that once a PostScript flavored OpenType font is in a print stream, it literally is a Type 1 font. Same for it being in a PDF. <br> <br>What types of files does this newspaper printer accept, exactly? PDF? <br> <br>Cheers, <br> <br>T</p>
