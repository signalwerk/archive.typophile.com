  - id: 14961
    user: 909
    date: 2004-04-02T00:44:00
    date_raw: 2 Apr 2004 — 12:44am
    votes: null
    html: "<p>I'm sure most of these folks are long gone, but most and perhaps all of these kinds of problems are generally due to incorrect system software configurations (ATM version, driver version, etc.) and are not intrinsic in the fonts themselves. <br> <br>People having these sorts of problems should first consult the OpenType readme, at <a href=\"http://www.adobe.com/type/opentype\" target=\"_blank\">http://www.adobe.com/type/opentype</a>. <br> <br>On the off chance these folks are still around, I will pose some specific questions.... <br> <br>Peter: <br> <br>More information please. As far as we are aware, there are no known printing compatibility issues involving normal RIPs and OpenType. What model of RIP, and most importantly what level of PostScript? What error message or problems occur? What driver version are you using? What OS version? What app and version? <br> <br>The only RIP I have ever seen that simply could not handle OpenType also couldn't print TrueType. They were part of a specialized newspaper system that required AFM files and Type 1 fonts only. However, it's possible there is some component in the workflow that creates a problem with OpenType. <br> <br>David: <br> <br>Again, more information would be helpful. What app are you printing from? Have you tried the OpenType version of Myriad, or just the MM version? What version of OS X? <br> <br>Brenda: <br> <br>Generally speaking, OpenType fonts work just fine with QuarkXPress 4.11. What specific problem are you having? What OS are you on, what version of ATM are you running, what kind of printer, and what printer driver? <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>"
    html_clean: "<p>I'm sure most of these folks are long gone, but most and perhaps all of these kinds of problems are generally due to incorrect system software configurations (ATM version, driver version, etc.) and are not intrinsic in the fonts themselves. <br> <br>People having these sorts of problems should first consult the OpenType readme, at <a href=\"http://www.adobe.com/type/opentype\" target=\"_blank\">http://www.adobe.com/type/opentype</a>. <br> <br>On the off chance these folks are still around, I will pose some specific questions.... <br> <br>Peter: <br> <br>More information please. As far as we are aware, there are no known printing compatibility issues involving normal RIPs and OpenType. What model of RIP, and most importantly what level of PostScript? What error message or problems occur? What driver version are you using? What OS version? What app and version? <br> <br>The only RIP I have ever seen that simply could not handle OpenType also couldn't print TrueType. They were part of a specialized newspaper system that required AFM files and Type 1 fonts only. However, it's possible there is some component in the workflow that creates a problem with OpenType. <br> <br>David: <br> <br>Again, more information would be helpful. What app are you printing from? Have you tried the OpenType version of Myriad, or just the MM version? What version of OS X? <br> <br>Brenda: <br> <br>Generally speaking, OpenType fonts work just fine with QuarkXPress 4.11. What specific problem are you having? What OS are you on, what version of ATM are you running, what kind of printer, and what printer driver? <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Manager <br>Fonts &amp; Core Technologies <br>Adobe Systems</p>"
