  html: |-
    <p>I’m applying to a school for digital media and would like to hear some professional opinion. The work sample is a logotype and a graphical profile (choice of colors and typefaces) for a digital media campaign aimed at young people (18—26). The purpose of the campaign is to improve the housing situation for young people in bigger cities through promoting community living in a fresh way.</p>
    <p>Does it appeal to the target audience? Are the type choices appropriate?<br>
    Any other thoughts, opinions, ideas?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/kollektiv_profile_4376.png"></div><p></p>
