    html: <p>You're getting some good and needed feedback on the kerning, so I'll focus on another issue. Is "connecting health and performance" part of this logo unit, or is it a separate element that will be used liberally on varying applications? If it is separate I have no issue, but if it is part of the unit I think it needs to feel like it is. Right now, it is too distant and lonely. <br> <br>Aloha! <br>Scott</p>
