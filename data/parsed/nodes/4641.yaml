    html: <p>hrant has the right idea.  Rick, look at 2 letter together, with your fingers covering the others.  then look at 3 together, then 4, etc... it's not mathematical, just perceptual.  the kerning needs just a little help in LANDMARK, and even more help in HEALTHCARE.   <br> <br>but what bothers me is the thin part on the R in LANDMARK...unless you made more thin parts on other letters...maybe. <br> <br>why the triangular icon?</p>
