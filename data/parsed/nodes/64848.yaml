    <div class="info">Submitted by <a href="/user/827" title="View user profile.">Ale Paul</a> : 30.Nov.2009 6.02am </div>
      <p></p><div class="imageWrap"><img src="/files/typophilebiographer_4372.jpg"></div><p></p>
    <p>We are proud to announce the release of <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000505" rel="nofollow">Biographer</a></strong>, a mild upright script drawn by Angel Koziupa, with Alejandro Paul art directing and producing. Elegant but quite reminiscent of roman forms and proportions, Biographer keeps the calligraphy mostly toned down, but its ascenders and descenders occasionally flare out in final swashy confidence. As usual with Sudtipos fonts, alternates are plenty and the personal touch is never amiss. Biographer could be great for women’s lit and poetry book covers, but also for products packaging where conveying comfort and peace of mind is of importance. An extensive range of languages are covered (Western and Eastern European, Baltic, Turkish, Maltese and Celtic)</p>
    <p><a href="http://www.sudtipos.com" rel="nofollow">Sudtipos fonts</a><br>
