    <p>I thought I read in a review of the new Steve Martin fiilm (and book) Shopgirl that one of the main characters was a font designer. I googled and found out it was not a typo.</p>
    <p><a href="http://www.microsoft.com/typography/links/news.aspx?NID=5142" title="http://www.microsoft.com/typography/links/news.aspx?NID=5142">http://www.microsoft.com/typography/links/news.aspx?NID=5142</a></p>
    <p>Wondering if there are any other movie characters who are font designers? Once in a while you catch someone who is a graphic designer or illustrator But even that is pretty rare.</p>
    <p>Anyone care to share their cinematic knowledge or is this the only example?</p>
