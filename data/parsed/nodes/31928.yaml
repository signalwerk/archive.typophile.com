    html: |-
      <p>The arrangement of the dates/names/tags is off. Dates are too tight to names compared to the names|tags spacing (partially due to the optical shift from thick to thin). Also, the date numbers and names are not optically aligned on the left; for example, look at the "10" above "Julie." These two bits of text might be <em>metrically</em> aligned, but they look out of whack. To make them jive I think you need to hang the arm of the "1" ever so slightly to the left (same goes for the bottom 2 dates).</p>
      <p>And watch that accent over MENDÉZ.</p>
    html_clean: |-
