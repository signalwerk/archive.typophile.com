      <p>Those dates are still a problem, perhaps worse now as they're floating away from the names, mainly due to the fact that you're trying to make room for that accent in Rebeca's last name. I'd suggest bringing the size  of the dates down a bit so that the accent can fit under "PM" and then you can tighten up the leading between the dates &amp; names.</p>
      <p>The left-alignment of the dates &amp; names still looks off as well. To totally solve this problem you might sheer the beaks off of the "1"s, although that's rather drastic.</p>
      <p>Finally, make sure that "PM" is top aligned with the numbers; at the moment they're super-scripted a bit too high for your purposes.</p>
