    html: |-
      <p>Made a few minor updates to Chennai. There are three main styles. The swash alternates add more of the curved stems/tails (line 1 and 7). The stylistic alternates convert the lowercase simple forms to more traditional, Futura like forms and the caps are the traditional forms for X W Y and A, etc, and B, D, P, etc. are not longer rounded (scattered through the preview). The titling alternates get rid of the "tails." (line 2) </p>
      <p><a class="freelinking external" href="http://www.insignedesign.com/downloads/ChennaiC2.pdf" rel="nofollow">Chennai PDF here.</a></p>
      <p>Please take a look and give me some feedback. How is the 'e' looking?</p>
      <p>I've also attached a preview of Chennai Slab. The lowercase ball terminals on the s are a problem. I am thinking that for the black weight, I will drop the ball terminals.</p>
      <p><a class="freelinking external" href="http://www.insignedesign.com/downloads/ChennaiSlabC.pdf" rel="nofollow">Chennai Slab PDF here.</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Chennai-Slab-Sample-Page-Source_6198.png"></div><p></p>
      <p>Looking forward to your comments! They are always useful.</p>
      <p>Thanks,</p>
      <p>JDooley</p>
