  html: |-
    <p>Chennai is a simplified sans serif that was first available in 2007. It also includes a number of more traditional alternate forms. I enjoying coming back to older work and making modifications and adding additional weights, and am planning a rounded slab serif based on this design. I've attached a preview image below including the thin, regular and black weights. I welcome constructive comments. Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Chennai-Sample-Page-Source_6450.png"></div><p></p>
