    <p>Hi!... This is my first post. </p>
    <p>I'm interested in records&amp;archives and in History.</p>
    <p>In an exhibition at the municipality of Bordeaux (France) on the IIWW and the Spanish inmates in German Lagers, I have seen this document: </p>
    <p> <a href="http://www.composicionapilable.net/wp-content/uploads/2011/02/buchenwald.jpg" title="http://www.composicionapilable.net/wp-content/uploads/2011/02/buchenwald.jpg">http://www.composicionapilable.net/wp-content/uploads/2011/02/buchenwald...</a></p>
    <p>I wonder if you can help me to identify the typography.... It looks like a Bauer Beton or an ITC Lubalin Graph, but.... the date is 1942-1944.</p>
    <p> Thank you very much for the contributions of all of you</p>
