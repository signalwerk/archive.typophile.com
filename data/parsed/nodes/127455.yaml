  html: |-
    <p>I am about to update all of our food labels to the new 2018 fda guidelines. But these new rules are making it a bit more difficult to fit the nutrition facts into the space available. FDA only specifies the use of Helvetica black and regular.  Does anyone know if it is okay to use a condensed version of Helvetica? I thought everything was fitting until I got down to the Vitamin info, which requires a fairly wide space, even with abbreviations.<br>
    FDA hasn't responded to my questions, so I am asking here to see if anyone has any insight.</p>
    <p>The size of the nutrition fact area, right now, is 1.75 x 2.75.</p>
    <p>Thank you,<br>
    Abbie</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/reg_display_narrower.jpg" width="525" height="825" alt="Nutrition Facts Label" title="Nutrition Facts Label">
