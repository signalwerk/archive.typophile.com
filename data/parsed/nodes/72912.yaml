    <p>My application recently got denied for a masters in type design program. I learned from one of the jurors/professors that my portfolio needed to be 'less pragmatic and ordinary commissioned work'. He further noted that they were looking for work that contained more personal and experimental projects. This was my first time applying for a masters program and I unfortunately created my portfolio based on projects that I've done as an in-house graphic designer.</p>
    <p>I want to reapply for the program next year but before I do, I want to ensure that I know how to best approach the creation of my new portfolio. </p>
    <p>Question:<br>
    That said, would it be a total faux-pas to reach out to the professor again, the one who had already taken the time to give me his feedback, --to see if I can get a tour of his school and request to see their student mid-term critiques? The last thing I want to do is come off like I'm brown-nosing in any way. Thoughts anyone?</p>
