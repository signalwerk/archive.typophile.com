    <p>205 publishing house (books and fonts) launches a new font family!<br>
    Norr: Composed of 4 cuts (Sans, Round, Fine and Brick), this font traverses 4 typographical universes with the characteristic to have an identical width for all styles for a simplified use.</p><div class="imageWrap"><img src="http://typophile.com/files/Norr-205_1-Typophile_4103.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Norr-205_2-Typophile_6342.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Norr-205_6-Typophile_4842.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Norr-205_10-Typophile_4595.jpg"></div><p></p>
