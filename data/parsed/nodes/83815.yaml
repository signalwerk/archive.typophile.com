    html: <p>Regular Google searches do not find file names (unless, of course, a Web page contains the file name as text). So, for instance, if I search for a file that I know to exist on my Web server, e.g. apollonius.gif, it doesn't show up in Google. I am sure that Google are able to index file names, and could provide search functions explicitly targeting file names -- and also explicitly searching in .css files --, and also sure that they do such things internally. But this functionality is not available in the public search engine. The advanced search options only list document formats (PDF, DOC, PPT, etc.) in which to search, not Web source or style formats.</p>
