      <p>Thanks John! </p>
      <p>What I was hoping to find was text content found in a CSS file rather than a file name. </p>
      <p>There may be reasons why this isn't easy or possible to do but if it were possible that would be a very useful thing to font developers because then you could see who uses your stuff ( a little interesting) but also how they use it ( very interesting! ).</p>
