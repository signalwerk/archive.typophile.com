    html: |-
      <p>Google does index images. you can search via filename via Google's image search. </p>
      <p>That said, they likely do not index CSS files. CSS files aren't content...like HTML and Images are, so there's no reason for Google to index them.</p>
      <p>Granted, Google certainly has the capability. See their source code search: <a href="http://www.google.com/codesearch" title="http://www.google.com/codesearch">http://www.google.com/codesearch</a></p>
