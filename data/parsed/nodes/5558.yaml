  - id: 39787
    user: 2139
    date: 2004-07-12T22:24:00
    date_raw: 12 Jul 2004 — 10:24pm
    votes: null
    html: "<p>I like your lighter version Fourte better. After a lot of going back and forth and scanning, I swear the newest version flows better to me. I suppose this is because there is a better balance between positive and negative space in the characters, and once my mind gets used to filling in the blanks, it flows. Not so many tiny blobs of black to stop my eye every other word. <br> <br>I think you can give the w and v the same treatment. I've done it already on my machine, and think it looks better still. However, I'm not so sure tweaking your design and posting it is something that ought to be done, so I leave it up to you to try it if you like. <br> <br>Hint though: just two mouse clicks on the w, and one click on the v. Check it out and see what you think. <br> <br>Also, while I really like the uniformity of your new numerals, they look like they belong to a relative of this font, and not necessarily this one. Try narrowing the widths by one pixel. </p>"
    html_clean: "<p>I like your lighter version Fourte better. After a lot of going back and forth and scanning, I swear the newest version flows better to me. I suppose this is because there is a better balance between positive and negative space in the characters, and once my mind gets used to filling in the blanks, it flows. Not so many tiny blobs of black to stop my eye every other word. <br> <br>I think you can give the w and v the same treatment. I've done it already on my machine, and think it looks better still. However, I'm not so sure tweaking your design and posting it is something that ought to be done, so I leave it up to you to try it if you like. <br> <br>Hint though: just two mouse clicks on the w, and one click on the v. Check it out and see what you think. <br> <br>Also, while I really like the uniformity of your new numerals, they look like they belong to a relative of this font, and not necessarily this one. Try narrowing the widths by one pixel. </p>"
