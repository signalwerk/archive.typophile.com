    date_raw: 12 Jul 2004 — 12:36pm
    votes: null
    html: "<p>Andrew, <br> <br>Very nice pixel font. In many ways, this is the most elegant pixel font I've seen. Why? 1) because it embodies the original spirit of pixel fonts as I understand it: clear type at ridiculously small sizes, and 2) because it employs creativity to complete the character set that would otherwise be impossible at such a small size. <br> <br>I've played with using negative space in similar ways with many of my smaller fonts (toto classic for example), in effect, looking for an overall balance in the character set as a whole. I've not been able to pull it off to my satisfaction. <br> <br>You, in my opinion, have. <br> <br>I know that this is an impossible request, but, is there anything you can do to the v and w to make them look less \"cursive\"?</p>"
    html_clean: "<p>Andrew, <br> <br>Very nice pixel font. In many ways, this is the most elegant pixel font I've seen. Why? 1) because it embodies the original spirit of pixel fonts as I understand it: clear type at ridiculously small sizes, and 2) because it employs creativity to complete the character set that would otherwise be impossible at such a small size. <br> <br>I've played with using negative space in similar ways with many of my smaller fonts (toto classic for example), in effect, looking for an overall balance in the character set as a whole. I've not been able to pull it off to my satisfaction. <br> <br>You, in my opinion, have. <br> <br>I know that this is an impossible request, but, is there anything you can do to the v and w to make them look less \"cursive\"?</p>"
