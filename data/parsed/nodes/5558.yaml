    html: <p>originally I was intending for the numerals to seem too big, as whenever I've had numerals consistent with the other characters they seem to get lost in the fray.  that said, I do think I prefer the numerals in this new version, which are only slightly larger than the lowercase characters... <br> <br><img src="http://www.typophile.com/forums/messages/29/40596.gif" alt="fourte 3"> <br> <br>the height of the 'l' has been shortened by 1 px - it might not last to the final version but I do think it sits better in body text this way. <br> <br>regarding the 'w' and 'v' - the 'w' is definitely an improvement, but I'm a little uncertain about the current 'v' as the form seems to be nearly breaking up visually. <br> <br>anyway, thanks again</p>
