    html: "<p>How far back are you going with this? There is so much to explore, but still hard to be consequent: The comma originated from a lowered, reduced, virgulae (slash). W was two u’s merged together. Many such historical letter variants have their own Unicode slot, as for example the superscript e above. (In fact, the modern dieresis and raised e lived side by side in late medieval/early renaissance manuscripts and printed books.)</p>"
