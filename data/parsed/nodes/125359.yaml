    <p>Hi everyone<br>
    We are two young graphic designers from Switzerland that are obsessed with type. We just started designing our first typeface and our biggest problem is that we don’t really have anyone experienced to critique our typeface and show us “how it’s done”. So please, rip it to shreds :)<br>
    Also English is not our first language so excuse us if we used the wrong typographic terms. We hope it’s still readable.</p>
    <p>The idea of the typeface:<br>
    We wanted to create a modern typeface that references and gets people interested in the history of how the individual letters developed and came about. Thats why there are uncoventional characters for a grotesque typeface and also why a lot of characteristics (hard counters that connect to the stem) reference old blackletter style.<br>
    For example the diaeresis (¨) was first an e that was written above the letter to modify the sound of the vowel.<br>
    Also we used the old characters of the long s and the old variant of the hyphen.<br>
    For the look and feel we referenced the classic german grotesque typefaces of the 18th century (venus, royal, ideal grotesk to name a few).</p>
    <p>The typeface is in no way finished or even close to it, so most of it is up change. Our current plan looks like this(if in your experience a different workflow would be better please tell us):<br>
    - Create a basic typeface weight with all Letters (numbers still missing)<br>
    - Get as much feedback and critique as possible and also take a hard look at the typeface ourselves (current stage)<br>
    - Finish the first weight (additional Glyphs, Kerning, Hinting)<br>
    - Expand it, create Light, Italics, Bold and more versions of the first weight</p>
    <p>We don’t really think that we will have a final version in the next months so we are just beginning!</p>
    <p>We are really excited to hear your feedback on our first attempt on a typeface</p>
