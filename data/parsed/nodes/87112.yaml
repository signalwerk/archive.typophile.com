      <p>Sorry, "nice typography" is not sufficiently countercultural:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/98_cover_us_5618.jpg"></div><p></p>
      <p>**</p>
      <p>To insert an image, use PNG or JPG.<br>
      No spaces in the file name.<br>
      Make it max 588 pixels width, to avoid scrollbar.<br>
      Also, it might not load if too big a file size.</p>
