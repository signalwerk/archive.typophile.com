    <p>It's an old problem, but a good new initiative.<br>
    Let's help them with nice typography !</p>
    <p>If you send a mail to <a href="mailto:99@baronvonfonthausen.com">99@baronvonfonthausen.com</a>,<br>
    you will get an automated respond with a pdf with<br>
    the pictures as shown below in outlines.</p>
    <p>No strings attached.</p>
    <p>Feel free to use and share it !</p>
    <p>Regards,<br>
    Fonthausen (Jacques)</p>
