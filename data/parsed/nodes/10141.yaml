    html: <p>Hey Stephanie, I attended an exhibition called 'Sensacional!' at the AIGA in NYC some time ago, it was awesome. It showcased some wonderful mexican wrestling posters that where printed on these huge man made presses. <br>    What was so fascinating was that the letters where cut out from uncommon materials like linoleum tiles, carpeting, old rugs, cardboard, cloth, ect; basically, anything that would hold ink. The letters were then pasted onto pieces of wood and ready for printing.  <br>    What was so cool though was that the letters where made from different materials which yielded different printing results. Some letters, for instance, had fuzzy edges because they were cut from rugs, and others had different patterns on them due to the patterns that where on the tile. All these differences coud be found on the same poster, very cool. I visited a Barnes and Noble and they had the book for sale, you can check it out, or maybe search the net for any info on the exhibit. <br> <br>IM</p>
