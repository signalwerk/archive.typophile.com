  - id: 64355
    user: 6245
    date: 2005-04-08T12:22:00
    date_raw: 8.Apr.2005 12.22pm
    votes: null
    html: <p>Having been a calligraphy instructor for over 25 years myself (amoung several other lettering arts pursuits). Consistency is the key to calligraphy. There are different kinds of consistency. Their are the classic forms of calligraphy, then there are the more modern forms of expressive calligraphy. Which type of consistency one strives for depends on what form of calligraphy you are creating. <br> <br>Most people erroneously refer to calligraphic and lettering work as "fonts" for the simple reason that it is the only term they are familiar with. The average individual knows nothing about the "arcane art" of letterforms, their use, history or creation. Even the majority of professional art directors who should know better.</p>
