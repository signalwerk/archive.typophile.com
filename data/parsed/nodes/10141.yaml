    html: "<p>I think if one wants to 'jump right in' to informal calligraphy (as distinct from formal calligraphy of the kind that usually begins by learning a particular hand), it is best to avoid letterforms entirely for the first while, and simply explore the range of marks that can be made with the writing implements. I have a book by a German calligrapher that demonstrates this teaching technique: his students begin with abstract mark making. Calligraphic ideas of balance, harmony, stress, etc. are all clearly in evidence, but divorced from letterforms. Only in the second phase of the teaching do student progress to working with actual letters.</p>"
