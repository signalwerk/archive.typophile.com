    html: "<p><i>...the highest compliment one's calligraphy can receive is if people think it's a font</i> <br> <br>I would take that to refer to finish, i.e. to the measure of control and cleanness in the forms, rather than to their structural consistency. Of course, this presupposes calligraphy in which control and cleanness are desired goals, as they generally are for beginners: one should master the controlled before trying to master freedom, which is much more difficult.</p>"
