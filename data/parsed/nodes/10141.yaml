    date: 2005-04-08T17:24:00
    date_raw: 8.Apr.2005 5.24pm
    votes: null
    html: "<p>Don, I actually wasn't trying to be inventive there - for a change! :-) That's my literal rendering of the hand we learned in class (called \"Italic\" by the instructor), with some minor variations (like the \"7\", which I made less frail) - but also that \"alternate\" binocular \"g\". Even that swash \"A\" was one of the forms prescribed in class. (The one \"structural\" thing I regret btw  is not giving the \"M\" a swash on its bottom-right.) <br> <br>&gt; what inspired you to pursue calligraphy, and what do you hope to gain from it? <br> <br>Well, unless you've been lurking here for a while, you might not know that I'm actually firmly opposed to chirographic* type; although I do think it can look beautiful** sometimes, I also think it is regressive all of the time. I equate it with celebrating the past at the expense of building the future; but I guess everybody needs to party sometimes. <br> <br>* A nicely focused term I got from John. <br> <br>** Ex Ponto is one of the very few fonts I've ever bought. <br> <br>But no matter what I think of chirographic type, I'm all for <i>learning</i> - I'd like to be able to [better] grasp the chirographic observations people make when discussing type, something not uncommon. I'll be teaching a type design class at ArtCenter starting in May, and this makes me just that little bit more prepared. (I've also done some letterpress, and I learned a <i>lot</i> from that.) <br> <br>Plus it's nice to be able to write well - people like that. I mail out things often, and I wouldn't mind some more flair but also discipline in the addresses and short notes that I write. To this end I plan on formulating my own \"hand\" - and I already know it will have a Carolingian lc \"a\"; and quite a sinister \"g\". <br> <br>But I have to tell you, my first choice was Mandarin Chinese. I would have taken that class instead, except that instructor had a lisp - can you believe that?! <br> <br>-- <br> <br>&gt; That's both cool and sad at the same time. <br> <br>Nicely expressed. <br> <br>-- <br> <br>&gt; I would take that to refer to finish <br> <br>Yes, but it's still a bit paradoxical. <br> <br>&gt; one should master the controlled before trying to master freedom <br> <br>I think there are pros and cons to both strategies, and some irreversible repercussions. Like it might in fact be [even] harder to master freedom once you've mastered control... There's something to be said for jumping right in, something there's no other way to attain. In fact that's another reason I dumped the Mandarin class: it didn't feel right; I'd really much prefer learning it on the streets of Shanghai or something. It seem to me there's something essentially wrong with formal education of natural language. But often it's all we have. <br> <br>hhp</p>"
