    html: <p>&gt; my constructed letterforms don't come out the <br>&gt; way I wish they would. This makes me think that <br>&gt; there must be something to this calligraphy <br> <br>This is a classical mental path, but it looks only to the well-publicized schools of thought in type design. There is another way - although it's quite hard to elaborate on - I'm working on it. I'm happy with my own "constructed" forms - because they're not constructed (in the way you probably mean it). That said, I'm not ecstatic about my forms - there certainly is a lot of room for improvement, but it's a room that can't be filled by chirography - that would be running back inside. <br> <br>hhp</p>
