    date_raw: 8.Apr.2005 10.42am
    votes: null
    html: "<p>I guess it's a multi-faceted thing to say and consider. He was referring to the importance of consistency. But I see a problem with that on two levels: <br>-Structural: I don't know any calligrapher who thinks that all letters should be structured the same. My teacher himself adds swashes, variant forms and whatnot. And quite ironically, with OpenType especially <i>fonts</i> are increasingly adopting variant forms... <br>-Finish: This could make more sense, but I actually don't think it does either. If I want consistency, I <i>will</i> use a font. In this age, assuming you think calligraphy is useful (and I for one think it is), the point should be celebrating the fauve, inconsistent aspect. On the other hand I don't think one should intentionally go crazy with inconsistency. So for myself I've sort of arrived at this compromise: to try to make my letters consistent, but withouth using guides of any kind; and to not obsess about extender length for example; etc. I'm still working on getting comfortable with this though. <br> <br>hhp</p>"
