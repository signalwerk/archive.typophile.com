    html: <p>"I wasn't criticizing the author's use of the word font" <br> <br>No poblem Hrant, I didn't think you were. On the other hand, I do lamenting the fact that most graphic art "professionals" don't know the difference. Even if she had an editor, most editors wouldn't know the difference either. <br> <br>It's true, one of the most popular segments of type design today seems to be creating fonts that can be used to fake writing done by hand. Myself, I make a distinction between "calligraphic fonts" and informal "handwriting/hand-printed" fonts. Myself, I applaud the professional designs of fonts like Zapfino (pretty, but limited in its uses) and Bickham Script (well done, but not representative of George Bickham's work). <br> <br>As an artist, I find it hard to get excited about most "handwriting/hand-printed" fonts. Probably because I can produce these whenever I want for myself (though I know this isn't the case for everyone so they have a place too). But another reason I'm not fond of this genre of font design is probably because I think you're right. The direct mail industry, no doubt, drives the "handwriting/hand-printed" craze. principally used to dupe people into thinking they've received something with a personal touch (for a change). I find such disingenuous creations to have a dark spirit</p>
