    <p>We have a new book in to set, the font(s) specified is Skolar, which we will have to buy.</p>
    <p>Whenever possible, I try to use whatever distributor gives the most money to the designer. So, I don't know if I can get closer to filling David Březina pockets by buying from Rosetta rather than MyFonts, but I'd think so. Any way to get more to him?</p>
    <p>TIA</p>
    <p>Charles</p>
