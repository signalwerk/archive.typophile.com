      <p>As far as I understand, this is the base differences between the different methods of using fonts on the web (besides PDF)</p>
      <p>Providing some protection against download is the big advantage of flash (and probably silverlight) implementations of fonts for web usage. Cufon re-encodes the file and *can* secure it to a domain, but enterprising folk could reverse engineer it to get the font back much easier than they could with flash. fLIR or facelift, uses PHP to create an image with the font in it, but that font has to exist somewhere on the server and could also be reverse-engineered. @font-face, in its current form, provides little to no protection. </p>
      <p><em>Another layer of potential complexity for web use: documents or applications? At Ascender Corp. we consider this an important distinction. We have licensed our fonts to a wide variety of websites for use with web-based applications. In these apps the fonts reside on the server but are not downloaded to the client. In the case of @font-face (web fonts), Cufon, Flash, Silverlight, etc. the font files are downloaded to the client as part of the document (albeit temporarily in most cases). So my point here is that web-based applications should also be added to Tiffany’s new chart :)</em></p>
