    html: |-
      <p>Randy, to my chagrin, <em>the list</em> is yet to emerge. What has emerged is lots of discussion of why that list is a pain to create. Lots of whine, no cheese. </p>
      <p>Stuff like @font-face won't work unless foundries let go of some fears.</p>
      <p>Permit me to give you guys a gentle ribbing. Right now font licensing so complex that licensors can't just focus on the right typographic solution, they have to navigate cumbersome EULAs and nuanced embedding permissions. (Foundry A has these flavors, Foundry B has these other flavors.)</p>
      <p>Consider how the iTunes music store made it easier to <del>buy</del> license music than to download it illicitly. Seriously. Win, win. Yes, music is still downloaded and shared illicitly, but the default is that it's just easier to buy it. This is an analogy, and not a perfect one, but I think it has merit. Companies that make it easy (and have quality type) will win -- that's why I was motivated to start the list. </p>
      <p>The complexity is the foundries' problem to solve, not your customers'.</p>
