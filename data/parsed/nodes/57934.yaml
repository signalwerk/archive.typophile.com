      <p>sIRF is a secure font embedding tool. Technically almost all fonts should be allowed to be used with it (I've personally not come across any EULA's that forbid flash embedding).</p>
      <p>Font-face and cufon are not 100% secure. I'm interested in a list that allows for these in their EULA's because cufon is like 100000000000x easier to set up than sIRF.</p>
      <p>Cufon is not flash, just to clarify.</p>
