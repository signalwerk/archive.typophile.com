    html: <p>There's a PDF embedding topic I'd like to see addressed, although there aren't a lot of people in my situation. We submit new business proposals to various government agencies in response to RFPs, BAAs, etc., and the agency always wants a PDF in addition to the hard copies and Word files. The PDF isn't public in the sense that it's included in a product we sell to the general public, or posted on a web site, but it's hard to see it as workflow or internal distribution. What kind of a license do I need? Is the regular license OK, or do I have to buy an embedding license?</p>
    html_clean: <p>There's a PDF embedding topic I'd like to see addressed, although there aren't a lot of people in my situation. We submit new business proposals to various government agencies in response to RFPs, BAAs, etc., and the agency always wants a PDF in addition to the hard copies and Word files. The PDF isn't public in the sense that it's included in a product we sell to the general public, or posted on a web site, but it's hard to see it as workflow or internal distribution. What kind of a license do I need? Is the regular license OK, or do I have to buy an embedding license?</p>
