      <p>Looks like we need to update our EULA :)</p>
      <p>We have always allowed PDF embedding for workflow and internal uses and do also allow secure web embedding in PDF and flash, which covers sIFR and i think Cufon too.</p>
      <p>We do NOT allow font-linking, in sense that the font files reside on a server. If i understand Font-face correctly, then this is not covered.</p>
      <p>We're collaborating with a web company on a font-license scheme which will allow fonts to be linked to a website easily and painlessly. It should be launched very soon.</p>
