      <p>Any embedding permissions chart will be pretty massive... a few of the potential options just for PDF...</p>
      <p>PDF Embedding<br>
      - Basics<br>
      -- No PDF embedding allowed<br>
      -- Print &amp; preview only<br>
      -- Editable okay (forms)<br>
      -- Must subset<br>
      -- Must encrypt<br>
      -- Must password protect<br>
      - Distribution of PDF including the fonts<br>
      -- Workflow only distribtion (to service providers like printers, proofreaders)<br>
      -- Limited organizational distribution (within organizations)<br>
      -- Limited geographical distribution (within a specific worksite)<br>
      -- Extended distribution (eg. distribution via email)<br>
      -- Unlimited distribution (ie posted to Web)<br>
      -- Commercial distribution (ebooks)</p>
      <p>For each of these the answer for any given vendor will be yes/no/requires extended license</p>
    html_clean: |-
