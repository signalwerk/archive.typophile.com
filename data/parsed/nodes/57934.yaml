    html: |-
      <p>Sii is correct...using the term 'secure' in the EULA is only going to add confusion. </p>
      <p>If it's on a web page viewable on my machine then I already have the files on my machine in some digital form already. </p>
      <p>As much as I'd like to see a license that merely stated 'you can use this in digital file' or 'you can't use this in digital files', unfortunately, it seems like we need to create a matrix to fully compare all these options:</p>
      <p> - PDF<br>
       - Cufon<br>
       - @font-face<br>
       - Flash<br>
       - others? (Silverlight? SVG? Etc...)</p>
      <p>And then those that refer to 'secure' of any of the above would need a superscripted reference with small print defining what they actually mean by the term.</p>
