      <p>Si: <em>Almost anything short of posting the font to the web in raw form can be negotiated, if the price is right.</em></p>
      <p>Heck, if the price is right, posting the font to the web in raw form would be fine too. Hence my position on all this: I care less about the format and the security model per se than about the viability of the associated business model. Which is why most discussion on web fonts seems to me to come from the wrong end: it's looking for a magical technical solution that will satisfy current business models, rather than asking what kind of business models will be possible with the technical developments before us.</p>
      <p>And 'the ugliness of the Web' is pretty insignificant aspect of what we're looking at, which is font linking and embedding in live electronic documents, online applications, cloud computing, etc. I suspect that foundries, taking an ad hoc approach to online technologies -- PDF? Okay. Flash? Okay. sIFR? Okay. -- are going to find it harder and harder to establish grounds on which to say 'Not okay!' to future developments.</p>
    html_clean: |-
