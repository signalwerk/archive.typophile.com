  html: |-
    <p>Help create the list of pioneering foundries who are not afraid of the digital future. (Did that sound like an agenda? Oops.)</p>
    <p>Shout out the type foundries that allow web and other digital embedding (<a href="/wiki/%40font-face" class="freelinking" rel="nofollow">@font-face</a>, <a href="/wiki/sIFR" class="freelinking" rel="nofollow">sIFR</a>, <a href="/wiki/Cufon" class="freelinking" rel="nofollow">Cufon</a>, <a href="/wiki/Flash" class="freelinking" rel="nofollow">Flash</a>, etc.</p>
    <p>_ It's time to put an end to the ugliness of the web.<br>
    _ Time to change the licensing model: sell fonts to designers and web hosts and not to every single reader/device owner.<br>
    _ Time to let the desktop publishing mindset die like <a href="/wiki/rubylith" class="freelinking" rel="nofollow">rubylith</a> and the <a href="/wiki/linotype" class="freelinking" rel="nofollow">linotype</a>.</p>
    <p>Note: Tiffany started a list here, but it quickly <a href="http://typophile.com/node/56316" rel="nofollow">became a discussion</a>. (A discussion worth reading, but it wasn't a list.)</p>
    <p>I'll start the list:</p>
    <p><a href="/wiki/Type%20Together" class="freelinking" rel="nofollow">Type Together</a>: <a href="http://www.type-together.com/" title="http://www.type-together.com/">http://www.type-together.com/</a></p>
