    <p>Thanks to all for your expertise. I'm a graphic designer; my focus was always more on illustration, but I've learned a LOT that I needed to learn about typography by lurking here. </p>
    <p>Here's a question:<br>
    A while back I bought Body Copy Sans Pro by Bergsland.<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/bergsland/body-copy-sans-pro" rel="nofollow">http://www.myfonts.com/fonts/bergsland/body-copy-sans-pro</a><br>
    It filled a gap in my text font collection; I had no "elegant" formal sans for such things as an invitation to a classy event; all were more utilitarian. </p>
    <p>I use the font way less than I expected, because I'm uncertain what display or headline font to use with it. I'm concerned I'll choose something that clashes; contemporary display fonts don't look right at all.</p>
    <p>What harmonizing headline font would you use with this body font if you wanted a distinctive, elegant look? What about Sigvar Bold?<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/softmaker/sigvar-serial" rel="nofollow">http://www.myfonts.com/fonts/softmaker/sigvar-serial</a></p>
    <p>Or something like Bernhard Bold, even with the swash capitals?<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/bernhard-modern" rel="nofollow">http://www.myfonts.com/fonts/bitstream/bernhard-modern</a></p>
    <p>I was also considering one somewhat decorative with an Art Nouveau flavor, Letterhead Fancy Caps or Beaumarchais...Am I completely off base?<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/coffee-bin-fonts/letterhead" rel="nofollow">http://www.myfonts.com/fonts/coffee-bin-fonts/letterhead</a><br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/scriptorium/beaumarchais" rel="nofollow">http://www.myfonts.com/fonts/scriptorium/beaumarchais</a></p>
    <p>What about an upright script like Adore or Serena or even Pendulum?<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/adore" rel="nofollow">http://www.myfonts.com/fonts/canadatype/adore</a><br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/serena/" rel="nofollow">http://www.myfonts.com/fonts/canadatype/serena/</a><br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/pendulum/" rel="nofollow">http://www.myfonts.com/fonts/canadatype/pendulum/</a></p>
    <p>Thanks in advance for your help! ~ Dina</p>
