      <p>Matthew Carter's Miller, although it has unbracketed serifs, is even more legible and well-proportioned than Century Expanded. This is good, for why bother to set out to make a font with flaws... but that means it doesn't closely resemble the typefaces of the bad old days.</p>
      <p>So it might be that Hercules or Benton Modern Display are more like what he is looking for...</p>
      <p>It's also possible that Scotch Modern or Scotch Modern Display, from ShinnType, would work; but Scotch Micro, like Miller, avoids the flaws of the old Scotch Romans. It's possible that the other versions do as well, and I'm not interpreting the appearance of the large specimens properly; the text specimen here</p>
      <p><a href="http://new.myfonts.com/fonts/shinn/scotch-modern/">http://new.myfonts.com/fonts/shinn/scotch-modern/</a></p>
      <p>in the sample text starting with "Recontextualizing" shows a beautiful, legible, and well-proportioned type - a good Scotch Roman instead of a bad one.</p>
