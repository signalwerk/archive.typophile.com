      <p><em>Miller, although it has unbracketed serifs...</em></p>
      <p>It doesn't. It has subtly bracketed serifs, which is one of the features that makes it easier on the eye than more extreme Romantic and Victorian types.</p>
      <p>A common feature of many Victorian types is the tightly curled c and e, in which the bottom stroke curves upwards almost to touch the part of the letter above. Miller does not do this, and nor does the scan of the page provided by ‘plenipotentiary’. In fact, if you compare the proportions and treatment of letters in that sample with Miller, you will see that they are quite close; much more so than with Scotch Modern, which follows the tightly curled model.</p>
      <p>Here is a comparison, showing what I mean. From top to bottom: the scanned book, Miller Roman, Scotch Modern:</p>
      <p><img src="/sites/default/files/old-images/cometh_5064.gif"></p>
      <p>Of course, Miller isn't a perfect match. Apart from inconsistent details such as the top of the t, Miller's heavier weight gives a different overall impression.</p>
