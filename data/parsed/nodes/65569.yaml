      <p>Regarding the type, one type this reminds me of is Bell. It might be available in a digital form. I was fortunate to work at a press in Portland, The Anthoensen Press, years ago, and they had a few old original fonts of Bell. It is a very nice face of similar style. It might be suitable for your project.</p><div class="imageWrap"><img src="http://typophile.com/files/BellMT_6479.png"></div><br>
      Though the serifs are not quite as slab like as the original, I don't know, now I am thinking the Scotch might be better, or the other imaged above.<br>
      Scanning and using Fontographer is a possibility.<br>
      Aside from the fact that I am 2 years late, the Bell face is a little shown face with unique characters and I could only find this peck of a sample.<br>
      Maybe I'll dig up a better one just for the record. I wonder how this project turned out.<p></p>
