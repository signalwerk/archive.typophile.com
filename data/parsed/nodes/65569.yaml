    <p>Hey all,</p>
    <p>My company is planning to do a reprint of sorts of a historical text that was originally printed in 1833 in Missouri. We'll re-typeset it, and we'd like to match the original typeface as closely as possible. </p>
    <p>So, question #1: Can anyone recommend some good digital typefaces that look like 19th-century serif book fonts? Thus far, the closest I've come is some form of Century, and I'm not wild about it.</p>
    <p>Question #2: A (non-designer) colleague of mine has a contact who has been talking to him about our predicament. The contact has suggested that we send him scans of the original, which he will send to some third party company who will then create an "exact match" typeface from the digital scans. I'm a little wary of this approach (not least because the characters aren't always crystal clear in the original). Does anyone have experience with this sort of thing? Can you provide recommendations?</p>
    <p>Thanks!</p>
