    html: <p>I re-read Sii's original comment and then I had to go read the actual EULA. It clearly describes an exception to the no embedding portion of the agreement. It allows you to use it for basic Flash (SWF) files, not the dynamic use that your generator requires. (Kudos to H&amp;FJ for having a helpful FAQ to accompany their EULA.)</p>
