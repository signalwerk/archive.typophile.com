    <p>Hi all!</p>
    <p>The US election may be over, but I'm noticing a lot of designers "borrowing" from his brand's look. So in that spirit, I built this quick flash app to make your own Obama-style graphics!</p>
    <p>Link: <a href="http://rocdove.com/blog/obama-graphic-generator/109" title="http://rocdove.com/blog/obama-graphic-generator/109">http://rocdove.com/blog/obama-graphic-generator/109</a></p>
    <p>Anyway, thought typophiles might get a kick out of it. If you come up with something clever, post it! I'd love to see what other people come up with.</p>
    <p>-Brendan</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/changethistext_3737.jpg"></div><br>
    (my submission)<p></p>
