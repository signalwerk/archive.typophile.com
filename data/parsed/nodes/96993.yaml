    html: |-
      <p>I picked the Cheng book up early this year, when I decided it was time to try moving from casual playing around in TypeTool to proper typeface design.  For a rank amateur wanting to learn how things actually work, IMO it's fantastic -- simple, easy to read and understand, and full of vital information.  It's probably a useful reference even for more experienced designers.  It only specifically deals with serif and sans-serif roman letters (no italic, cursive, blackletter, non-Latin languages, etc.) but many of the principles shown seem pretty generally applicable.</p>
      <p>I'm definitely going to pick up Bringhurst when I can, but I heard there's a new edition coming out in a few months so I'm waiting for that.  I'll add Lawson and Tracy to my list as well... unfortunately, it looks as though the Tracy book is out of print and impossible to find (except in the exhorbitantly expensive rare used books category).</p>
