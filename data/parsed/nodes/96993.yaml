    html: |-
      <p><em>Do you think that those 3 are essentials before the Design Type book?</em><br>
      No.  You're not going to get any more practical use out of a type design book than Cheng's.<br>
      The Elements of Typographic Style is really more about setting type.<br>
      Anatomy of a Typeface is a book of personal opinions about faces that have already been designed.  Letters of Credit is quite good though.</p>
