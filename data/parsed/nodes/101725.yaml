    html: |-
      <p>Well, a nice Bodoni Book would be welcome. Here's how you start: don't look at any drawings. Instead, go find some books printed letterpress, set in 10 to 12 point, that you think good. You know, where the lower-case "o" isn't just a pair of tiny parentheses with a maybe mistaken hairline joining them?</p>
      <p>Now, make it look like that, at least in terms of stroke contrast, when printed offset on uncoated stock (try Glatfelter's Natures Natural), where the plate was made directly from the typesetting file.</p>
      <p>In fact, a very useful Bodoni Book project would be a roman and italic, one for coated papers, one for uncoated. The stroke contrast is just that important with Bodoni. Far as I'm concerned, they could share a semibold, if you feel that necessary.</p>
      <p>Otherwise, I'm with HVB -- the 40 or 50 Bodoni's we already have are good enough, condensed or otherwise.</p>
