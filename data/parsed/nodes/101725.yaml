      <p>Nick, Mary Mendell (now retired &amp; making rather nice etchings) &amp; I tried to get Berthold Bodoni (Antiqua) to work for a number of projects. It was always "not quite" -- the contrast is not correct for the way these books are printed. (2400 dpi / direct to plate / offset press)</p>
      <p>[Shameless plug for Mary] <a href="http://mmartwork.squarespace.com/galleries" title="http://mmartwork.squarespace.com/galleries">http://mmartwork.squarespace.com/galleries</a> </p>
      <p>I actually made up a Bodoni Book starting from a Linotype roman &amp; Monotype italic digital version (yes Hrant, all purchased under the old, old Adobe license). It was useful, and a couple of those books did wind up in book shows, but I never felt it was really any good. A case of "Well, that's better than anything we have" rather than "That's good." </p>
      <p>And that's not good. It would be tough, but do-able, I think. Question is whether or not there would be a market. As a typesetter who sells services, I figured designers would just use something else, which is why I never took it any farther.</p>
