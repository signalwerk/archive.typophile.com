      <p>Jason, that thin-thick circumflex could indeed be seen as beautiful of its own, but my contention is actually that it doesn't fit the Didone ideology. One that's symmetrical, with a thick join and thinning ends (or maybe even the other way around) makes more sense to me.</p>
      <p>Concerning the numerals: they have "funny" contrast because they come from Eastern writing systems. On some level making them feel different than the alphabetics can make sense, but -again- in a Didone that doesn't click for me. I would prefer to see "rationalist" numerals where the stroke thickness matches that of the alphabetics. There are surprisingly few people who do this: Catich, Harvey, Bouwsma... and yours truly. :-)  BTW see this thread: <a href="http://typophile.com/node/99144" title="http://typophile.com/node/99144">http://typophile.com/node/99144</a></p>
      <p>Also concerning numerals, when it comes to old-styles ones (that extend above/below a horizontal band) there's a nice old French twist (which I actually find more functional, since it causes numeral strings to sit vertically more in-line with the alphabetics) where the "3" and "5" sit high, not low. See just past the half-way point here: <a href="http://fontfeed.com/archives/figuring-out-numerals-the-sequel/" title="http://fontfeed.com/archives/figuring-out-numerals-the-sequel/">http://fontfeed.com/archives/figuring-out-numerals-the-sequel/</a></p>
      <p>BTW, if you're liking this line of development take a long, close look at the Romain du Roi.</p>
      <p>Nick, I agree that that sort of thing deserves investigation, but to me popularity isn't necessarily conducive to functionality.</p>
      <p>hhp</p>
