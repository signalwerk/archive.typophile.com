      <p>With regard to Charles' Bodoni Book idea, I've also thought that this would be a useful thing to have. I admire ITC Bodoni as a kind of archaeological exercise, but think it captures too much of the artefacts of a particular technology (printing from metal types). I'd like to see similar attention to the weights and proportions of Bodoni's original types but translated into cleaner forms representative of and suited to today's technologies.</p>
      <p>As Charles says, the hairline contrast in Bodoni really recommends differing fonts for different output/paper conditions, or something like 'grades' as used in newspaper typography.</p>
