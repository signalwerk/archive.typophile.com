      <p>One thing that's been rolling around in my head for a while now is that the non-alphabetics of Didone fonts often don't work well. This might be because people have had trouble properly detaching them from chirography (the virtual "painting" of letterforms via the hand using an imaginary marking tool). For example look at the circumflex -and the discussion surrounding it- here: <a href="http://www.flickr.com/photos/martinmajoor/8224390209/" title="http://www.flickr.com/photos/martinmajoor/8224390209/">http://www.flickr.com/photos/martinmajoor/8224390209/</a></p>
      <p>More significantly, numerals in Didone fonts often don't follow the logic (with Didones being essentially about logic, even if, yes, you can still write them with certain marking tools manipulated a certain way) of the alphabetics. And I personally think straight quote marks work better than "correct" curly ones in such designs.</p>
      <p>So maybe your design can stand out by treating the non-alphabetics in a newer (specifically more ideologically robust) way. That would be contemporary. Or at least not archaic.</p>
      <p>hhp</p>
