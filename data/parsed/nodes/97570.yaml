    html: |-
      <p>Elegant and interesting. But I’m wondering why you didn’t make the Decorative glyphs a stylistic set in the main fonts, rather than doing them as uppercase/lowercase in the decorative fonts. Using a stylistic set would give print users the full range of glyphs (decorative case, uppercase and lower (small caps) case) in a particular weight with proper kerning between glyphs.</p>
      <p>David</p>
