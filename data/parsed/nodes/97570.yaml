  - id: 529075
    user: 33417
    date: 2012-11-04T10:52:00
    date_raw: 4 Nov 2012 — 10:52am
    votes: null
    html: |-
      <p>Hi David. thanks for the compliments :)<br>
      A Stylistic Set would make total sense to me as well, however the font was primarily designed for the web, mainly for the Google Web Fonts Library, and that means I couldn't use open type features, since, as far as I know, you can't use them through Google's "embedding" method.<br>
      I thought of making a print and web version but that might end up being confusing, and so I just shared the files like that.<br>
      But, who knows, I might work a bit more on that in the future, also the ligatures on the decorative styles are made with kern pairs (O+O and H+E) surely not the best solution, but it was a way to try to bring some interesting shapes to the web.<br>
      Natanael</p>
