    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cinzel_low_4017.png"></div><br>
    Hi people I would like to introduce you to my latest design, Cinzel.<br>
    Cinzel is a typeface inspired in first century roman inscriptions, and based on classical proportions. However it’s not a simple revivalism. While it conveys all the ancient history of the latin alphabet it also merges a contemporary feel onto it. <p></p>
    <p>More info:<br>
    <a href="http://www.behance.net/gallery/Cinzel-Typeface/5654455" title="http://www.behance.net/gallery/Cinzel-Typeface/5654455">http://www.behance.net/gallery/Cinzel-Typeface/5654455</a></p>
    <p>Thanks!</p>
