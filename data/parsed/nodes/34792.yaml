    html: <p>I'm 100% against pirating fonts but I think that as for music and as for movies, the type designers has to find a way to sell their fonts. House Industries work out a fetish concept for their typefaces, I don't know if it will work but it has the advantage of being original. I think that time has changed and that the new generation of type designers has to deal with it. I'm really curious of how they will solve it and I don't think that stopping to work with type because of pirating is the solution.</p>
