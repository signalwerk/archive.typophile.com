      <p>The thing with piracy Robert is that most people who don't pay for a font wouldn't pay for that font. If they can't get your font for free, they'll just get some other font for free; they generally wouldn't pay for your font anyway, because they don't think this stuff is worth money. So mainly all it does is increase the variety of the fonts we see used out there, without hurting designer profits much. It's unnerving, but we shouldn't let it rattle us.</p>
      <p>hhp</p>
