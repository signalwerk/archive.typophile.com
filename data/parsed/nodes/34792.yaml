    html: <p>I think Robert is also considering some foundries as pirates who have taken his designs, digitized them, and are now making money from them. But, Hrant you are right. Pirates wouldn't pay for he font to begin with ... BUT ... that is still generalizing. I've seen statements such as, "I'm only using these to test the font then I'll license it if the design is improved." I'm all for a good test drive, but I think this is where the real problem comes from. Designers who aren't willing to go through the proper routes to test and license their fonts.</p>
