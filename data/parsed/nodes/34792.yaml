  html: |-
    <p>My career began in 1942 as an apprentice in the composing room. Because of WWII I was able to get several jobs; working at the College Press under the tutiledge of Richard Hoffman and a night job at LA Type casting the first arrival of Times Roman.<br>
    Because of the pursuit of the alphabet it led to working with some of the best in the busines: Saul Bass, Herb Rosenthal and Charles Eames. My commercial career began in the early 1960's with the revival of Jugenstill fonts and becoming an agent for Bertold.<br>
    I was able to bring on the photolettering market many original design under the name of Facsimile Fonts and later FotoStar International.<br>
    My hobby is letterpress printing and I still cast type on the Linotype and Ludlow. I presently write under the name of Dr. Type in the magazine Recognition Revue. I am no longer working with type fonts because of the pirating.</p>
