      <p>&gt; Robert is also considering some foundries<br>
      &gt; as pirates who have taken his designs</p>
      <p>Oh. That's better termed plagiarism. And it <em>used to be</em> a big problem; it's notable that it happens very rarely these days, and when it does, or when it's perceived to have happened, like in Segoe, the outcry is palpable. Typophile actually serves as a great backlash mechanism in such cases, and the font houses do pay attention. So Robert, this might actually be a great time to resume your retail type design work!</p>
      <p>(I just hope Uli doesn't jump in though...)</p>
      <p>&gt; Designers who aren’t willing to go through the<br>
      &gt; proper routes to test and license their fonts.</p>
      <p>But that's an education issue, not a "prohibition" issue.</p>
      <p>hhp</p>
