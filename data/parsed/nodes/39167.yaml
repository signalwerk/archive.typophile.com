    <p>Hi fellow Typophiles. I was looking through some old vintage labels on eBay and I found this one below. The listing says "old brewery stock" Tivoli Brewing Company original <em>Mile Hi</em> beer bottle label.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/milehi_5904.JPG"></div><p></p>
    <p>I was wondering if anyone here would know what font is being used for "Mile Hi".</p>
    <p>Thanks :)</p>
