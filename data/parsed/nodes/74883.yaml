    <p>The Polish New Art Foundation ZNACZY SIE announces an international type design competition to commemorate the birth centennial of Czesław Miłosz - a poet, writer, translator and Nobel Laureate. All currently enrolled undergraduate and graduate students are invited to participate. Veronika was invited to be part of the jury, together with Pilar Cano, Barbara Kȩsek-Bardel, Robert Oleś and Kuba Sowiński. For more information go here.</p>
