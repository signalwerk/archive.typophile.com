    <p><a href="http://www.typography.com/catalog/requiem/" title="View it from H&amp;FJ" rel="nofollow">Requiem</a> seems to have become to books what Trajan is to movies: it's used everywhere. There's no shortage of <a href="http://www.amazon.com/gp/product/1581346735" rel="nofollow">examples</a> [<a href="http://www.amazon.com/gp/product/1581345801" rel="nofollow">1</a>, <a href="http://www.amazon.com/gp/product/0375412018/" rel="nofollow">2</a>, <a href="http://www.amazon.com/gp/product/0393317552" rel="nofollow">3</a>, <a href="http://www.amazon.com/gp/product/0195149173" rel="nofollow">4</a>, <a href="http://www.amazon.com/gp/product/1581347510" rel="nofollow">5</a>] and the typeface seems especially popular with Christian publishers. But I'm not complaining. I love Requiem and I can't get enough of it. But I'd like to hear what you think. Are you tired of seeing it on books? Have some examples of where Requiem is used well and where it's not?</p>
    <p>I personally can't get enough of the capital "R" and "Y."</p>
  html_clean: |-
    <p><a href="http://www.typography.com/catalog/requiem/" title="View it from H&amp;FJ" rel="nofollow" class="link-external">Requiem</a> seems to have become to books what Trajan is to movies: it's used everywhere. There's no shortage of <a href="http://www.amazon.com/gp/product/1581346735" rel="nofollow" class="link-external">examples</a> [<a href="http://www.amazon.com/gp/product/1581345801" rel="nofollow" class="link-external">1</a>, <a href="http://www.amazon.com/gp/product/0375412018/" rel="nofollow" class="link-external">2</a>, <a href="http://www.amazon.com/gp/product/0393317552" rel="nofollow" class="link-external">3</a>, <a href="http://www.amazon.com/gp/product/0195149173" rel="nofollow" class="link-external">4</a>, <a href="http://www.amazon.com/gp/product/1581347510" rel="nofollow" class="link-external">5</a>] and the typeface seems especially popular with Christian publishers. But I'm not complaining. I love Requiem and I can't get enough of it. But I'd like to hear what you think. Are you tired of seeing it on books? Have some examples of where Requiem is used well and where it's not?</p>
    <p>I personally can't get enough of the capital "R" and "Y."</p>
