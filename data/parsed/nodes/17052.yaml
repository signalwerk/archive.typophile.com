      <p>I agree completely. The interiors of fiction and trade nonfiction take so little time to produce that there is no reason on earth that at least the title page can't be designed late in the game to reflect the cover treatment.</p>
      <p>I was once hired to design only the interior of a cookbook. I asked to see the cover and they told me it didn't have to match. After I had produced a set of samples they decided I was right after all, they should match, so they sent me the cover, which was hideous. I redesigned the interior to match, reluctantly. Then when I got the finished book they had redesigned the cover (still hideous) and it no longer matched the interior I had done. Unbelievably frustrating.</p>
