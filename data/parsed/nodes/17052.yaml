    html: |-
      <p>While I understand the publishing practice of shopping-out covers to experienced designers while fumbling horribly with the interiors in-house (which is not to say I think this is a good idea in any way, shape or form -- interiors just don't get the respect/attention they should/deserve), what boggles me is that I've found resistence to connecting the two participants to discuss their design(s). I have a couple of clients where the conventional situation is reversed (the publisher's production manager is also a designer and so handles the covers, while shopping the interiors out). I (freelance) design primarily interiors and time and time again I've found a brick wall at publishers' production departments when I ask to see what the cover designer's up to, or suggest I touch base with the cover designer to pass along a sketch of the titlepage I'm working on. Again, I understand that covers "need" to be all flash and eye-candy, but it just seems like screaming common sense that the cover and title page should at least use the same display type. This is one of a handful of things that simply makes my head hurt in commercial book design. Don't get me wrong, I love my clients and the freedom they give me to do my job, but in many instances I'd almost appreciate less freedom so that we could both better serve the book.</p>
      <p>Luckily I also run a small press of my own so that I can design books from top to bottom as cohesive/organic objects, from materials, to type, to design.</p>
