      <p><em>...half of the display settings I see use the Requiem Text master, </em></p>
      <p>Display styles are great for most purely typographic settings, but it may be that some of these uses have the type surprinted over images, where the designer felt that a stronger presence was necessary. </p>
      <p>There is also the in-store situation to consider -- a publisher I've done work for has bookstore shelving set up in his office, so he can place prototype cover designs in a retail setting, and see how they fare from the other side of the room. He is also concerned that small images of the book cover, in his trade catalog and online, should show well. There is a marketing merit to this approach, but I've found that it skews my design work to be horsier than I would ideally prefer -- my benchmark being holding the book.</p>
