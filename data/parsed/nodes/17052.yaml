      <p><em>It seems odd to me that publishers would use two designers</em></p>
      <p>Not really.<br>
      The cover design is all about marketing and the book as product -- a complex business concerning how it is positioned. I've done some cover design work for a publisher which has at least a dozen categories of fiction, and much time was spent positioning the book with regards to the author's prominence in the marketplace, and nailing the exact genre. You have to know how big to make the author's name in relation to the title -- that kind of stuff is crucial! I was paid a good freelance dollar, but the interior of the books were handled in-house, less expensively.</p>
      <p>Compared to all that, the design of the interior is not such an issue.</p>
      <p>Now, if the book buyer is a browser in a bookstore, who picks up the book and makes a purchasing decision based on the thing in their hands, that would put more emphasis on the interior, but that's nowhere near as important as getting the browser to even pick the book up in the first place. And if they're buying it from Amazon....</p>
