      <p>Jonathan, I've noticed similarly odd choices elsewhere. I think some graphic designers/art directors are attracted to the more robust forms of smaller optical weights for display/headline size, partially because they're taught to make headlines pop and have weight, as opposed to unity and grace.</p>
      <p>At least that's my theory. I suppose we designers just want to do it our own way, original intent be damned.</p>
