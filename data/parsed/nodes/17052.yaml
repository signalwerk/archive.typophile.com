      <p>Thank you everyone for your very nice comments about Requiem!</p>
      <p>I've also noticed that the fonts get used far more often in large sizes than in small, which almost makes me regret the winter I spent creating proper optical sizes for the family. The strangest part of this is that half of the display settings I see use the Requiem Text master, not the Display or Fine tunings that were specially made for large sizes. I don't know whether designers are proofing their work only casually, or whether the "Text/Display/Fine" nomenclature isn't sufficiently intuitive; right now I'm struggling to finish a book that uses Requiem Display for its chapter headings, Requiem Text for its cover (?), and Requiem Fine for its text (!?), choices that I can't imagine were made intentionally. Any chance that those hairline serifs made for 48pt would be readable at 11pt is wholly obliterated by the choice of stock: the book uses a bright white stock with a heavy gloss coating, making the whole enterprise really unbearable!</p>
      <p>Regarding the insides and outsides of books, my experience is consistent with all of yours: within the publishing industry, there's an entrenched division between these two departments. Years ago, when Barbara de Wilde was at Knopf, she asked me to design a typeface specifically for the work of William Maxwell, as Knopf was preparing to publish a collection of his short stories. We spent some time writing a colophon, which described the typeface in both historical and cultural terms, and how it was that we came up with a design that we hoped would be sympathetic with Maxwell's writing. The book came out, the cover was lovely, and Barbara was thoughtful enough to include a "Typeface design by" credit on the inside flap. And inside, ran the colophon:</p>
      <p><cite>A NOTE ON THE TYPE</cite></p>
      <p><cite>This book was set in Janson, a redrawing of type cast from matrices long thought to have been made by the Dutchman Anton Janson, who was a practicing type founder in Leipzig during the years 1668-87...</cite></p>
