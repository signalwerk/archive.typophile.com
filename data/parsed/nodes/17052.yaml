    html: "<p>Over here, when it comes to fiction, book interiors are always designed by a different person than the cover. While various freelance and in-house designers and fine artists are hired to do the covers, most often an entire group of books have similar interiors. It saves a lot of expenses and serves other two purposes: to promote recognizability of the publishing house and to create a feeling that the next book the buyer is looking at has the same qualities, as the one before that looked quite the same. Unfortunately, that sometimes results into great incompatibility between the inside and outside of the book. And yes, the best book designs here are, more often than not, spoofs of foreign examples.</p>"
