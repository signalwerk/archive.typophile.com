      <p>It is mindboggling how much bad typesetting you see out there. I've worked with editors and designers who don't even know what a ligature is. This is a product of the Mac age - now designers are expected to be typesetters as well - when that used to be a specialty. They never learn proper rules regarding H&amp;Js, expert collections, small caps, ligatures, fractions, etc.</p>
      <p>I don't know that a letter would make that much difference but it doesn't hurt to try - address it to the art director.</p>
