      <p>Thanks for the offer Peter, but I'm lucky enough to work with clients who do actually understand that interior design involves more than just flowing the content. I had a contract a couple of years ago to design &amp; set a collection of letters. The pay was lousey but it was a book/author I felt strongly about so spent a good amount of time developing the design and sent in a set of comps. What I got back essentially amounted to "we know this is how the book should be done, but it's not what the editor had in mind." And what did the editor have in mind? Thinner margins, smaller type, less leading. That is, make it cheaper to print. That, in a nutshell, is the mentality of many publishers, and as publishing is a business, I suppose it should be. However, I'm lucky to have a few steady clients who want well designed &amp; set books, and because I've had the opportunity to design a few of them, my portfolio has been fairly successful at bringing in more of the same kind of work.</p>
      <p>As for that contract a few years ago, I turned it down and haven't worked with the publisher since.</p>
    html_clean: |-
      <p>Thanks for the offer Peter, but I'm lucky enough to work with clients who do actually understand that interior design involves more than just flowing the content. I had a contract a couple of years ago to design &amp; set a collection of letters. The pay was lousey but it was a book/author I felt strongly about so spent a good amount of time developing the design and sent in a set of comps. What I got back essentially amounted to "we know this is how the book should be done, but it's not what the editor had in mind." And what did the editor have in mind? Thinner margins, smaller type, less leading. That is, make it cheaper to print. That, in a nutshell, is the mentality of many publishers, and as publishing is a business, I suppose it should be. However, I'm lucky to have a few steady clients who want well designed &amp; set books, and because I've had the opportunity to design a few of them, my portfolio has been fairly successful at bringing in more of the same kind of work.</p>
      <p>As for that contract a few years ago, I turned it down and haven't worked with the publisher since.</p>
