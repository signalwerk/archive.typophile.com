    <p>Even before <a href="/wiki/AutoCAD" class="freelinking" rel="nofollow">AutoCAD</a> decided to acknowledge the existence of <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a>, artists and designers have been asking for a <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> version of the Isonorm draughtsman's face. A lot of creative people are eagerly waiting to misuse this geometrically-constructed standard letterform for their free-wheeling design. So now, at last, you can have some fun.</p>
