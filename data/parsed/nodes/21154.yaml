    <p>Hello Folks,<br>
    I was just handed a pretty amazing job.  I can't really go into detail, but I basically will need to define how my client is going to market their HD DVD's.  Part of this exercise will include advice on cutting edge printing techniques.  Think liquid foils, spot UV's, clear foil spot varnishes...the sky is the limit and so is their budget.</p>
    <p>I would be grateful for any ideas/applications you've come across lately.  They could be types of inks, printing processes, maybe even amazing papers you've seen or used.  If I can get a sample somehow please pass that info along as well (i.e. paper mill, magazine, or printer info).</p>
    <p>Thanks in advance.  </p>
    <p>Best,<br>
    Peter.</p>
