      <p>Hi Peter</p>
      <p>What an insanely great project! Many terrific suggestions here, including the unusual substrate-and-ink combos, and the Crystal Raster/FM screening plus Hexachrome high-end stuff.</p>
      <p>My suggestion would be to use holographic foils as the substrate for some or all of the design; you could use an opaque white ink (possibly silkscreened) in combination with the transparent spot/cmyk inks to produce some fairly nice eye-candy...</p>
      <p>"The thermographic suggestion is a good one. I have seen so many magazine covers lately that have started to use this technique." </p>
      <p>I think you'll find that is just a double-hit spot varnish going on the magazine covers... and the whole cover is processed on a single 6 colour press. Sometimes for a really thick one we might silkscreen an ultraviolet-curing varnish.</p>
      <p>Real thermography is a little-used labour-intensive process whereby enamel crystals are sprinkled by hand over the still-wet ink and then passed under a heat source to melt them and raise the surface/volume of the ink with a super gloss. The difference is that real thermography will crack when flexed, whereas a spot varnish won't, which makes it more suitable for the magazine covers.</p>
      <p>Thermography used to be <em>de rigeur</em> for society cards and stationery, but like deckle edges, chromo-lithography and gravure printing, it's increasingly rare. I last saw it done commercially in the early 90s.</p>
      <p>Love the idea of sending the whole lot to the monastery, Bert.</p>
