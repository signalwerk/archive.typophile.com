    html: <p>Someone mentioned Agfa Crystal Raster screening. Adobe almost had a product based on the same stochastic, frequency-modulated screening technique years ago. I happened on a local print shop here in SF (Clubcard) that uses the stochastic screening for 4- and 6-color work that really gives stellar results in layouts with mixed photos/type/art. Type at any size, reversed, or odd colors, comes out crisp and fine, and photos look like you're looking at the object in the photo. Veer has been printing some of their catalogs using the new screening, but I think it looks less impressive (less sharp) on the soft papers they specify. None of this gives a particularly snazzy impression, but it does significantly improve the overall quality of offset impressions, especially using 6 colors. Add some iridescent foil and blind embossing and that will "make it pop", as they say.</p>
