      <p>i love the paper named neobond, used for the sauna-book from underware. i got some samples, i had it under the shower for two minutes, waited half an hour and it was in a pretty good state already again. you can also take with you in the sauna and put it in the oven or the microwave afterwards to dry.</p>
      <p>sadly enough, there arent too many weights for this paper, 90 and 180 only i think :(</p>
      <p>if you wanna research, i had the idea of using temperate-dependeable ink where one would have to rub over the printed parts (= make them a bit hotter than normal room temperature or something) to see everything.</p>
