      <p>soy based inks and washable papers, blind embossing, fluorescent boosters for bright colors, satin finish instead of gloss or matte, metallic touch-plates, higher than normal line screen, transparent spot colors, split fountains...</p>
      <p>A few of these things I have no experience with. I have seen transparent spot colors, the ink chemists that I work with at the shop I am usually at make us these, I'm not sure how. We had one job in which we had to smoothly blend a series of 8 transparent spot colors into one another. It may have not looked nice the way they had designed it, but it could be something really cool if done in an elegant way. Blind embossing is snazzy, I think, and it isn't something done very often. Consider maybe a intricate pattern to give the paper a unique texture. Split fountains are neat, you always get amazing color combinations with this technique. You probably already know about adding a fluorescent booster to achieve spectacularly bright colors. I once worked with a project printed at a 600 line screen, that could be interesting.</p>
