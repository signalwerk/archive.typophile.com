      <p>I got some samples of some inks here a while back that actually change color due to environmental conditions, typically heat. One of the samples has a image printed on it, and then it was covered with a black ink, obscuring everything. When you touched it, the image would slowly be revealed as the black would go from opaque to completely transparent. Another one of the examples was a coffee cup that was printed with a similar ink, red perhaps, and it would indicate the level of the liquid in the container through another heat reaction. So, as you drank the coffee, obviously the reaction on the outside of the beverage would slowly move down the side of the cup, until it was empty. </p>
      <p>This will take a bit of research on the internet, but I am sure you can find it.</p>
      <p>The thermographic suggestion is a good one. I have seen so many magazine covers lately that have started to use this technique. Interesting how it's the new fad. Basically, they just take an intricate pattern, and use a clear gloss (laminate type overlay) and print over the entire cover. Think of those cheap business cards that you get at Office Max, that have the raised type, that doesn't really feel like ink; this is the same process.</p>
