      <p>Years ago, when I worked at making things out of steel, I worked for a company that was designing and building the first generation of high speed sorting conveyors for Canada Post... It was fascinating to watch when they were testing the equipment, and loads of fun to see how how many parcels it could mangle in a very short space of time when thing went really wrong and how much mail it could put in the wrong bins in a couple of seconds when it failed to read addresses.</p>
      <p>I,ve always written addresses exactly where the post office tells me to.</p>
