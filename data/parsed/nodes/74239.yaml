      <p>@etl</p>
      <p><em>lower than "2.75 inches from the bottom..." Do you mean not below 2.75" from the top of the envelope?</em></p>
      <p>No, I mean from the BOTTOM of the envelope; e.g.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/usps_3550.png"></div><p></p>
      <p>If the return address falls within the OCR Read (red) area, chances are very good that your customer will end up sending themselves mail, as in the example I noted.</p>
      <p><em>Specifically the window of 5" wide by .625" tall from the bottom corner?</em></p>
      <p>Specifically, from the BOTTOM RIGHT-HAND SIDE (the orange area). This area is reserved for USPS barcoding and, if you do not cede this territory to them, they WILL claim it by pasting a white sticker on the envelope and printing their barcode there; therefore, unless the return address is very short, don't put it there...period.</p>
      <p>FURTHERMORE, if the envelope is used for a mass mailing AND carries an endorsement--i.e, Address Service Requested, Change Service Requested, Forwarding Service Requested--the return address MUST be printed in the upper left-hand corner. (§4.2)</p>
