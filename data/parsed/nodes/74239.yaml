      <p>@James M</p>
      <p><em>I used to have a client who printed massive amounts of direct mail marketing -- literally millions of letters each month -- and they dealt with the post office constantly on issues like this. They found that many post office regs which sounded like ironclad rules were actually just preferences, and you can often get away with designs that are supposedly not allowed.</em></p>
      <p>No: the regulations are rules, not preferences. However, depending on the customer (massive amounts of direct mail marketing carries some weight) and the variance (would not affect operations downstream), the bulk mail supervisor or the postmaster at the receiving post office CAN, at his or her discretion, waive certain regulations. For instance, if a mailing piece does not conform to allowed proportions but the variance is small, the piece may be accepted. On the other hand, if barcode geometry and/or placement do not conform (hence affecting its mailability down the line), either the piece will be rejected or the mailer will lose the automation discount which, although a matter of only a few cents per piece, can add up to some serious money if the mailing is large.</p>
      <p>If you have questions about what's permitted and what's not, every bulk mail acceptant center has a Mailpiece Design Analyst who can review your proposal and tell you whether or not it will fly.</p>
