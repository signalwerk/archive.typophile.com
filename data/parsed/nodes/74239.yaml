    <p>Hi.  I'm working on a stationery system for a friend.  One of the two no. 10 envelope contenders is a solution of running the address along the bottom left edge of the envelope.</p>
    <p>seen here:</p>
    <p><a class="freelinking external" href="http://s157.photobucket.com/albums/t77/EricTLarsen/graphics%20misc/?action=view&amp;current=lmfaEnvelope.jpg" rel="nofollow">http://s157.photobucket.com/albums/t77/EricTLarsen/graphics%20misc/?action=view&amp;current=lmfaEnvelope.jpg</a></p>
    <p>Sometime shortly after i showed it to my friend i thought i'd remembered hearing *somewhere* that the USPS doesn't like type on the bottom edge of an envelope because of the way they stamp/mark the envelopes.  I spent an hour last night slogging through the USPS Domestic Mail Manual and i haven't been able to decipher anything definitive.  </p>
    <p>I hope that some of you with better printing experience than i could let me know if you've encountered this in the past or know the answer as to whether or not it's forbidden?  (help.)</p>
    <p>Thanks in advance for any remarks.</p>
