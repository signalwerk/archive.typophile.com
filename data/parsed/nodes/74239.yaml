      <p>The US Postal Service doesn't recommend type any lower than 2.75 inches from the bottom ofthe envelope because that's the OCR Read area. When I was working for a printing company several years ago, one of our customers insisted that--for aesthetic reasons-- she wanted her return address within that zone. When most of the letters (primarily invoices) she sent ended up being delivered right back to her, she relented.</p>
      <p>Placing type across the bottom of the letter is like shooting yourself in the foot: the USPS reserves an area approximately 5" wide and .625" tall from the bottom left-hand edge of the envelope for barcoding. Anything that intrudes into that area is likely to be covered by a white sticker.</p>
      <p>P.S. Evidently, you slogged right by this...</p>
      <p><a href="http://pe.usps.com/text/dmm300/102.htm" title="http://pe.usps.com/text/dmm300/102.htm">http://pe.usps.com/text/dmm300/102.htm</a></p>
