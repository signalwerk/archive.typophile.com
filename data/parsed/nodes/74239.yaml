      <p>I used to have a client who printed massive amounts of direct mail marketing -- literally millions of letters each month -- and they dealt with the post office constantly on issues like this. They found that many post office regs which sounded like ironclad rules were actually just preferences, and you can often get away with designs that are supposedly not allowed.</p>
      <p>BUT... there's always the chance that it'll get returned, so it's safer to stick with the official guidelines.</p>
