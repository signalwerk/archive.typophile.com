      <p>I'm totally with Chris on this one.</p>
      <p>Putting the return address on the bottom is like putting a handle inside a coffee cup. What price "cute"?</p>
      <p>Even if no mail was ever returned to the sender, why would anyone ever risk covering up the name of the sender?</p>
      <p>The whole idea of addressing an envelope is to make it easy for the Post Office to deliver the piece, and in case the addressee's address is incorrect, or the addressee moved or died, to return it to the sender. Putting the address on the bottom is killing two birds with one stone: impeding the Post Office in doing it's job, and potentially obscuring the name of the sender, robbing the sender of visibility, and if the return address is really covered over, possibly having the piece treated as junk mail.</p>
      <p>While you're at it, use the full 9 digit zip+4 code.</p>
      <p>Re The Eye Chart Envelope: the Post Office charges more if the address is not parallel to the longest dimension of the envelope.</p>
