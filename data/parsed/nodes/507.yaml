    date: 2002-04-29T12:22:00
    votes: null
    html: <p>My recollection about the Licko effort that Ole mentioned is that this was Zuzana's contribution to an article in one of the design magazines a couple years back. I thought it was <i>Critique</i> -- but I couldn't find the article in my collection, so perhaps it was another.  <br> <br>If I remember correctly, the magazine asked several designers to revamp a logo or a design. Zuzana was asked to update Helvetica. In her response, I think she said that she didn't feel that Helvetica should be redesigned, but that it could benefit from a true italic and so that's what she contributed. <br> <br>I don't think the project was ever meant as anything more than an exercise. <br> <br>-- Kent.</p>
