    html: <p>the other thing that needs to be understood here keith is that i started my career being as naive as the next guy that posts here. i was only concerned with hip/cool. i then moved into the educated and conservative idealism of a type snob (much like hrant). but as a true postmodernist, i am now in a phase of rebirth and am moving back over to the other side. it's just not that fun being a typographic stick in the mud all the time. you have to have some fun.</p>
