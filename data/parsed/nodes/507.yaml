    date_raw: 9 May 2002 — 11:24am
    date: 2002-05-09T11:24:00
    votes: null
    html: <p> I used to cringe at Avant Garde Gothic too, but these days I view it more as an interesting experiment in geometric sanserifs and ligatures. You must admit, it does have a wide array of innovative ligatures. Unfortunately, these aren't included with most digital cuts of the face. <br> <br>The fact that Avant Garde Gothic looks terribly dated today may have more to do with its overuse (much like the much-maligned Helvetica) than with its intrinsic design. When it is used well (and, admittedly, that is an extremely rare occurrence) it can shine. <br> <br>Like Helvetica, it is at its strongest when used as a display font rather than a text face. <br> <br>Having said that, however, I also should admit that I rarely (if ever) use it. <br> <br>I can, however, envision a day (perhaps in the far-flung future :D ) when it might become fashionable again. After all, who would have thought that woodcut fonts would have ever returned to a state of vogue? Yet they have, several times, and they still pop up in stunning design even today. Again, it's all in how they are used. <br> <br>David <br>(Seemingly becoming a homely font sympathizer in general) <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
