    html: "<p>From the PDF listed below: <br><b>Modernism &amp; Postmodernism</b> <br><i>from Lecture by Jeffrey Keedy, April 1998</i> <br>modern = contemporary <br>modernism = ideology <br>postmodernism = a concept for a minute <br>Modernism = style and ideology, articulation of form, formalist, rationalist <br>Postmodernism = reaction, but not a rejection of Modernism. Erasing of boundaries, theory of discourse (most rejected) <br> <br>Again. An interesting read is J. Keedy's article in the last edition of Emigre --- Modernism 8.0 --- the top link has a summation. <br> <br>Some interesting reading for all of you. <br> <br><a href=\"http://www.patricking.com/bitch/\" target=\"_blank\">http://www.patricking.com/bitch/</a> <br><a href=\"http://art.bgsu.edu/~childers/writing2.html\" target=\"_blank\">http://art.bgsu.edu/~childers/writing2.html</a> <br><a href=\"http://www.fawny.org/typoexpoagogo.html\" target=\"_blank\">http://www.fawny.org/typoexpoagogo.html</a> <br><a href=\"http://www.new-series.org/?kinross\" target=\"_blank\">http://www.new-series.org/?kinross</a> <br><a href=\"http://www.typotheque.com/articles/fuse.html\" target=\"_blank\">http://www.typotheque.com/articles/fuse.html</a> <br><a href=\"http://www.typotheque.com/articles/EK_PhD_bibliography.html\" target=\"_blank\">http://www.typotheque.com/articles/EK_PhD_bibliography.html</a> <br><a href=\"http://ndm.si.edu/EXHIBITIONS/mixingmessages/essay/typo/t_b.L3.9.html\" target=\"_blank\">http://ndm.si.edu/EXHIBITIONS/mixingmessages/essay/typo/t_b.L3.9.html</a> <br><b>PDF</b> <a href=\"http://www.foothill.edu/fac/manske/Lecture_notes/PDF/Postmod_Graphic_Des.pdf\" target=\"_blank\">http://www.foothill.edu/fac/manske/Lecture_notes/PDF/Postmod_Graphic_Des.pdf</a> <br><a href=\"http://art.bgsu.edu/~childers/radical.html\" target=\"_blank\">http://art.bgsu.edu/~childers/radical.html</a></p>"
