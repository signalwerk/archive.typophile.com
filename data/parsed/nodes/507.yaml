      <p>What I like about Helvetica these days is its blandness. I a design surrounding where Kievit, Thesis et al have become the new Helvetica in their everyday use, I think a relatively underdesigned font such as Helvetica has a certain simplistic flair, a stupidness for lack of better words, that just works. Same goes, to a lesser degree, for DIN, for Courier and for some other fonts. Absurdely,  feel the same way about Garamond these days. Grossly overused, I find myself using it more and more often, because it IS so commonplace. Much as I love well-done typophile fonts and always hunt for notoverused serif and sans-serif typefaces, I find myself coming back to Helvetica (or similar-looking fonts such as FFBau, Galaxie Polaris or RKW Sans, which is a remix of Helvetica BQ we did with URW++) and Garamond again and again. I recently did a book-design and used Franklin for that, a font I haven't touched in well over a decade. But its crude mixture (in my mind) of simplicity and america-advertising-noise aswell as a certain Kalmanesque feeling made it the only viable option. Sometimes the wrong font is really the only right choice. Maybe I'm just tired of the delicateness of all these new, well-done typefaces and look for something clumsy and plain and stupid and honest?  </p>
      <p>HD Schellnack</p>
