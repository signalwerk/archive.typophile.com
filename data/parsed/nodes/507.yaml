    html: <p>keith, i think avant garde has too much character and is much too geometric. i don't really put helvetica into that same category as avant garde. i think avant garde is more of a display than anything else. you could never set copy in it. univers on the other hand is just not a very handsome face. i've seen many of my contemporaries at art center come over to the darkside on the univers/helvetica issue. univers is just too organic in it's letterforms. i'd rather use akzidenz or even frutiger over univers. helvetica is more ridged than universe that's obvious but why use a half breed face like universe that doesn't do a good job of being either geometric or humanist.</p>
