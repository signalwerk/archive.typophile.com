    html: "<p>Jay, I hope you realize how patient and polite I've been with you, for all your pointless arguments and name-calling. <br> <br>Typography is not totally subjective. There is some science in it. Some conclusions were drawn from empirical research, not just subjectivity, especially when it comes to legibility. Though they are not always so dependable. <br> <br>Regarding schools, I think Tiffany pretty much said what I wanted to say. The school I went to, Emily Carr Institute in Vancouver, is arguably the top art school in Canada. They have a reputation of being 'arty-farty' and really have an attitude. It is probably the coolest school to be in Canada right now. That to me is a problem. People want to go there because it is cool, not because they want to learn. I was doing a project for a client last month and he told me 'to go crazy with it'... 'you're from Emily Carr, man!'. How do you think I felt then? I don't want to be streotyped, and I think I have my own agenda of being a designer. To me, bad teachers are the ones who spoon-feed their students and hope that they'll turn their students into exact copies of themselves. On the other hand, good teachers give students access to differing opinions and let them think for themselves, and ultimately making them good designers in their own rights. It is a teacher's job to let them think for themselves: what is good design? What is design even? Whatever that might be. The job of the teacher is to provide guidance in order to help them to fulfill their own personal goals. The least a teacher could do is to embrace the difference of his/her students.</p>"
