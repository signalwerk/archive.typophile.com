      <p>As another so called 'New Media Designer' I just thought I'd offer my perspective.</p>
      <p>"New Media Designers" work on the screen. Only a fool would ever set text for reading in Helvetica on screen as it would be even less legible than it's printed counterpart. Reading off the screen is a bitch full stop - why make it more painful?</p>
      <p>Helvetica Neue is a useful display face. For people like myself it's a great way to get into display typography because it has so many different weights and variants. If you're ten years older than me you'll hate it because it was old hat when you were a young designer.</p>
