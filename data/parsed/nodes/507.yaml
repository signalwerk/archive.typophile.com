    html: <p>As primarily a writer and reader, and secondarily a typofile, I emphatically agree with those who say that Helvetica is a rotten text face.  <br> <br>A whole page of Helvetica, especially set wide, is an actual pain to read. I want to kick the person who designed the page whenever I see such a horror. <br> <br>I really think this is something that can be settled by testing. If you set a page in Helvetica and in, say Adobe Caslon or any of the classic serif types, and ask people I bet you you will get an overwhelming majority of people who say that the Helvetica is harder to read.  <br> <br>The merits of Helvetica as a display face are a matter of taste, but as a text face I think that those who say it is readible are radically and provably wrong, wrong, wrong.  <br> <br>After years of cursing pages - especially letter sized - with Helvetica I thought that no sans could be even decent for extended text. I was astonished by the PDF of Vesta at GerardUnger.com, which is quite readable.  <br> <br>The Humanist sans generally are much better in readibility - Bliss is my favorite for its elegance, but I still can't see the point of using a sans for extended text. They have a lot of other good uses, of course.     <br> <br> </p>
