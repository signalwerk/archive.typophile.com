    html: <p>william... realistically with the ideal of "cool" out there who is going to be setting things in caslon. you'll look like an old fart. but maybe you are (and that's cool with me). these typefaces though great where built stylistically for different types of output. i'm not dismissing the past because reading a book set in metal that has been letterpressed is a pleasure (i own a letterpress so it's known that  i love the stuff) but most things aren't done that way anymore and in case you haven't noticed we aren't going back anytime soon. as far as books go, yes, nobody wants to see cool and hip when they are reading the latest pulp novel but we are talking about moderate amounts of copy here e.g. annual reports. as far as helvetica as a display it's one of the better faces out there. it is much closer to being geometric, which make it a shoe in for display. that's why you see so much of it in use as display. this argument is getting very boring for me by now. i'd rather discus something more interesting like postmodernism vs. modernism. helvetica is a great face this has been decided by the collective not just me.</p>
