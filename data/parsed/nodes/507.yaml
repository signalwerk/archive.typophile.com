    html: <p>iota, the popularity of helvetica stems way beyond the fact that a flash in the pan group (who i do in fact love) like the designers republic use of it. it even goes further then the fact that it is just a great all around face. it's popularity stems from the fact that postmodernism has eaten itself alive and returned to it's roots in modernism. the modernist aesthetic is alive and kicking again because of postmodernism. how ironic it is but then again it can be expected from a movement as ironic as postmodernism. because helvetica rose to the forefront of the modernist movement it has become a shoe in as far as the retro mimicry of postmodernism is concerned. but it's the fact that it is such a great face that people have fallen in love with it again.</p>
