      <p>Whoa there,<br>
      Seven fingers. Don't make me break those two extras by punchin you in the nose. I happen to be a New Media Designer (which I agree is a strange title) but you have to admit it's much easier to say than mutidisciplinary proponent of aesthetics specializing in the application of current and emerging methods of application. Did you ever stop to think that the reason NMD's use helvetica so much is because they are getting paid to do so. I'm sorry but I have to quote snoop dogg when I say "Don't hate the player hate the game." I also am a bit miffed about the over saturation of the media and over use of certian techniques but you have to remember that these old washed up art directors are looking for those "catch phrase" designers to do something "hip" and "new" but then force them to copy eachother. I'd have to say that if you want to gripe talk to the old farts who still use Quark and lay everything out in sabon about loosening the reigns and letting us go to town. I promise you I would never use Helvetica again if I could make the same money using cabinet, or eiko, or damske, or Chola, or..you get the point.</p>
