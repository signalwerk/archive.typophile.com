    html: <p> I'm going to slightly disagree here and admit that I actually LIKE Helvetica. (GASP!) <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> I mean the font, not most uses of it. <br> <br>Unfortunately, it's become so commonplace and so accessible that it's very often ruthlessly abused by unskilled hands. <br> <br>Computers have aided and abetted this trend, but it was true even before the days of desktop publishing. Helvetica began suffering its vicious cycle of abuse in the '60s and '70s, as "generic" became a trendy design thing. <br> <br>In my opinion, Helvetica (whether the original or the "Neue" series) is at its most beautiful when used as a display font (perhaps the way some woodcut faces would be used), taking advantage of its range of weights and widths as well as its graceful and more subtle shapes. It should be incorporated into the design, rather than simply plastered mercilessly across a page like so much eggshell latex semi-gloss paint. The IRS and Adobe Acrobat will spend decades in Purgatory for their crimes against Helvetica. <br> <br>Don't malign the font just because 99% of its users are abusing it. Hasn't it been through enough pain? After all, this plain "generic" font became as popular as it is (before computers) for a reason. <br> <br>Arial can't claim this. It was hacked out, mass-marketed and force-fed to hapless computer consumers. <br> <br>A few moments spent flipping through any preferred design annual or an issue of "Graphis" proves how stunningly Helvetica can be used, in the right hands. <br> <br>David <br>(Helvetica sympathizer) </p>
