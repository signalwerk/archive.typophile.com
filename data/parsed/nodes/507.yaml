    html: <p>tiffany you are always a pleasant voice of reason. believe it or not though i don't quite agree with you on the whole generalization issue. like i said before i think we under value generalizations in today's culture because they aren't p.c.. current postmodern thought dictates that we shouldn't be hasty and that we should step back and analyze every possibility until we are impotent to make a decision. i think this is a horrible way to approach things. though it may be too much for some of you to hear, i think generalizations are very valuable. general consensus becomes cultural fact. it doesn't matter if it is scientifically true or not it is true to the culture and that is what matters at the moment. this can be illustrated by the culture of of the 1950's when maybe 90%, or so, of america believed that god actually was real. it did not matter that science would make major movements to over throw this idea (or at the very least drastically alter it) latter on changing the reality of culture. if you were alive in the 1950's it was indisputable fact that god was real. i'm not naive enough to say that generalizations are always true though a lot of the time they are. i'm just a realist who says they are the truth at the moment as far as you and i are concerned and that's all that really matters. i think we are all tired of hearing that one exception to a generalization as though it changes the truth of that generalization e.g. all black labs are black (generalization) but my cousin has a black lab that is albino (exception) so not all black labs are black. this just gets stupid because the fact still remains that 99.9% of black labs are black. there is always an exception to any generalization but that does not make the generalization false. that is the beauty of the generalization, they are flexible. granted you are right too but i think you are to quick to dismiss a generalization because of a weak exception. <br> <br>as far as the donkey thing goes you're reading too much into it. i'm only using it as a surface level example. and i'm not sure i understand your last comment, so please expound. <br> <br>anonymous, just because your a huge wimp doesn't mean i forgot about you. what kind of wuss makes a post as anonymous and asks me my credentials. you won't even list your name. i'm surprised you even know what art center is but the fact that you do says it all. let's see what you have to say about any issues here and then we'll talk credentials. <br> <br>and hrant. i don't really think you can be that lost its all pretty simple. just take off your rose colored glasses of idealism and look at the reality of it all.</p>
