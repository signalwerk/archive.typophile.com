    html: <p>ethen, in reply to your other post which i neglected to see initially. you bring up an age old question here &lt;joke&gt;. design and style are very interrelated. i know many here would tell you that you should pay no attention to trend and just follow the standards that have been passed down for years (which were in fact just trends at some point themselves) but i think this is unrealistic. your job as a designer is to provide a service to your client. in many cases but not all that can be to zig instead of zag. this is an attempt to help them stand out. as far as the trend you are sighting, it really depends on how large it is and how entrenched your client is or should be in relation to it. weather to follow a trend or forge a new trend is very dependent on this issue. that being said there is also the element of the designers personal voice. i think this is important too. you need to love what you do and clients in the end will love you because of it. nobody likes a zombie robot that produces something with no soul. anyway i guess that's a good enough start on such a huge topic.</p>
