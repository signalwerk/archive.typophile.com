    votes: null
    html: <p>What a great discussion! Sorry to have been travelling. First of all, a little historical perspective -- I was there, boots on the ground (joke), when Neue Haas Grotesk was introduced. I thought it was heaven-sent. The only guy setting it in the US soon thereafter was Roy Rothstein of Type&amp; Art in Cleveland. Up until then the only decent sans serif we had was News Gothic. In Europe there was Akzidenz Grotesk. I simplify but only because there's enough text posted here already. When my 25-year hitch with Polaroid ended and they decided to do all the design in-house, converting everything to Helvetica, my parting shot was "Congratulations, your typeface can be seen on every airport toilet throughout the free world."  <br> <br>Even so, Helvetica is a usable face, Avante Garde an abomination. It simply can't be read. NHG when set by the Swiss was eminently readable in at least three languages.  <br> <br>Thirdly, there is a difference between being educated and learning. My late Mass. Art schoolmate and friend, Jacqueline Casey, blossomed as a great designer at MIT in spite of a ho-hum curriculum. The same can be said of her colleague, Muriel Cooper. I think it's all about intellectual curiosity, and if one doesn't have it, it doesn't matter where he or she has been "educated." </p>
