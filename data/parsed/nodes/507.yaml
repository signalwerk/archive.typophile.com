    html: |-
      <p>PS:<br>
      As an example, I work on flyers, a brochure and a flash-based Site for suchthilfe.direkt, a local drug-aid and habilitation center. My idea is that, well, drugs and their usage is overdramatized in the media. I didn't want to show junkies and opted instead for something that struck me during the days of research and photoshooting in their facilities: It's mostly a very efficient, very bureaucratic job they do. The whole streetworker-cliché I had in mind just doesn't hold true, they're justr professionals doing their best in their field. It's all pretty banal, it LOOKS and FEELS banal. And that, imo, was good.<br>
      So we took very very nondescript photos, very downscale, very everyday. I wanted to emphasize that drug-abuse and thus drug-aid is normal, is mundane, is a job like everything else. Instead of showing the fear-inducing imagery of other campaingns, I opt for, more or less... a kind of down-to-earthiness :-D</p>
      <p>And damn, I spent WEEKS deciding on the design and the typeface. Frustrating, annoyinbg weeks. It all still felt too much like advertising, it pushed up too many emotions, it jst did not feel cool enough, bland enough, simple enough. </p>
      <p>The final design is as simple as can be and the typeface, of all the choices available, is UNIVERS. definitively not a typeface I use often these days. Univers... simple, honest, straightforward. No real ligatures, no OSFs, no Caps, overused and still kind of the ugly girl at the dance party. And it fit perfectly. </p>
      <p>And it's quite often the same with Helvetica. The bad font is sometimes the only viable option. </p>
      <p>HD Schellnack</p>
