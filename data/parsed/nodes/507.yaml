    html: "<p>It's strange that you think type only communictes to designers. Only designers who ignore craft think type is made for them. Some of the best design work relies very heavily on the type. <br> <br>As for what I personally prefer: I would ideally like to make the best type the world has ever seen (I would like to surpass Granjon - it's a dream, hey), and be recognized for that by my peers. I don't give a rat's arse who uses the results, mostly because participating in this Cool Capitalism (which I admit to having to do to some extent, but a lot less than the average graphic designer) reduces my appetite. I'd rather not help sell CRAP to the same vultures who drive their gold Cadillac Escalades to the latest Hollywood releases. <br> <br>hhp <br></p>"
