      <p>At small sizes, the "Car Care" will simply disappear… In fact, it's so marginalized in this design, you have to ask if it's really necessary. "AutoDTL" would be a stronger mark standing on its own, and the brand name already signals the industry.</p>
      <p>I would also design the wordmark in 1 color first, and then supply different fills as potential looks. If it doesn't stand up as an outline, it simply won't last more than a few years. Look at how many fills Apple has applied to their mark. It's been everything from a shiny piece of candy to brushed aluminum, from rainbow to pure white. An outline allows you to have diversity and flexibility while building brand equity.</p>
