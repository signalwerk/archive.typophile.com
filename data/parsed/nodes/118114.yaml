    html: <p>It was a good idea to eliminate "car care".  Regarding the "a", I agree that the lower-case looks nice but I'd probably capitalize it the same way you do when writing it. Also the spacing between the letters needs some tweaking. For example compare the big space to the right of the cap A to the tight space between u and t.</p>
