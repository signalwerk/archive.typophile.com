      <p>Pull a book text off the web. Project Gutenburg, maybe. Then set it as a trade book. Work out the problems. Start with prose, fiction or non-fiction. Then do the same with a poetry text. Work your way up to a complex academic work with all sorts of apparatus. Wrap your brain and eyes around long text. Find typographers who'd be willing to critique your work. Revise the work. Then you'll have the beginnings of a portfolio and you can start looking for staff work or freelance work.</p>
      <p>Forty years ago I'd have suggested serving an apprenticeship, but that's gone these days.</p>
      <p>There are many days when I wished I had done more formal study in graphic design or commercial art. Just to have my eyes open a bit wider than they usually are.</p>
      <p>Good luck. Keep your eyes on this site; at times we have enlightening discussions.</p>
      <p>powers</p>
