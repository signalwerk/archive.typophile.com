      <p>Book interior design is fine, but remember that a degree in graphic arts could be a disadvantage. Rich Hendel use to say that the best training for book interior designer was to be a compositor -- or a simply a reader.</p>
      <p>Remember that what's hot or new in the design world may address only a very small audience, which in a book is usually the wrong audience.</p>
      <p>Of course, Rich's degree was in commercial art, so it can't be too great a disadvantage . . .</p>
