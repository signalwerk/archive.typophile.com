      <p>If you are young and want to work with type, consider motion and the internet, rather than print.<br>
      Wouldn't those be growth areas, and don't they have room for growth?<br>
      Do you like Trollbäck's work?<br>
      For the internet, the challenge is to get things which are pretty basic to print (which I'm sure you're already familiar with through your studies) to work online, in html and flash. And you have to wrap your head around screen rendering and hinting, and if you can figure that out, and how to make type look good on screen, then that would be valuable to typography.</p>
