    <p>Hi Everyone..I'm new to Typohile, and I would like to know what process I should undertake in order to become a typographer. I have already graduated college with a degree in graphic design, but I would love to specialize in typography. Any ideas? Directions?</p>
    <p>Thank you!<br>
    Erin</p>
