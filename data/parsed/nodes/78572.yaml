    html: <p>Consider that 26 letters can form 676 pairs, (without considering uppercase/lowercase) and if we refer to the study made by Hrant, the letter Q , for example, can be found in only 4 pairs(as opposed by 52), J in 8,  Z in 9 and X in 11 etc.</p>
