      <p>Well, you can see her work <a class="freelinking-external" href="http://www.crystalgenes.net/">here</a>. I guess I should mention that she’s my girlfriend, and we do wedding photography. She’s the brains of the outfit; I’m just the assistant and am also rebuilding her web site.</p>
      <p>You’re both right; the font is a little over-worked, especially the “G”, but I didn’t create it. I guess as I get closer to a final design, I’ll convert it to SVG and trim off some the excess fluff. And though I do like the unique, whimsical nature it creates, readability is a real issue with it.</p>
      <p>Nobody has any suggestions on what to do with the word “Photography”?</p>
