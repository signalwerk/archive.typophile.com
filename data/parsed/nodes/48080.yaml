      <p>To begin I would also like to compliment Penn&amp;Ink on your logo</p>
      <p>I don’t know it seems that there is so much going on on the left side that by the time my eye works it’s way to the name it’s exhausted. Wedding Photography is all about simplicity and capturing the moment. If it’s strictly wedding photography i’d suggest trying to marry the CG (no pun intended) and try to do a word mark. </p>
      <p>So in my opinion scale back on the vector imagery and focus on the name. If what you have posting is the direction you’re going in, maybe the photography can be underneth nestled (but not to close) to the decender of the y in Crystal. </p>
      <p>Keep us updated</p>
