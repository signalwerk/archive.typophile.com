    <p>Hello all, I just discovered this forum and this is my first post.</p>
    <p>I’m redesigning a photographer’s website/logo/identity, and having a hard go of it. The problem is that I need to incorporate the words “Crystal Genes Photography” into the logo. Here’s where I’m at:</p><div class="imageWrap"><img src="/files/trythree_3571.png"></div> Sorry that it’s not more polished. The original plan was to have the word “Photography” under her name, and in a separate font. Now I’m toying with the idea having all the text horizontal, so what you see is the very definition of “work in progress”.<p></p>
    <p>I really need suggestions of how to get the word “Photography” into this design, and would be very grateful for any input. Thanks!</p>
    <p>- ben</p>
