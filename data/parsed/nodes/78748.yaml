    <p>Sample can be seen in screenshot:</p>
    <p><a href="http://gamrreview.vgchartz.com/image/31/advance-wars-dual-strike/77667/#media" title="http://gamrreview.vgchartz.com/image/31/advance-wars-dual-strike/77667/#media">http://gamrreview.vgchartz.com/image/31/advance-wars-dual-strike/77667/#...</a></p>
    <p>Examples in the screen shot include numerals "10" and abbreviation "DEF" below as well as words "FAMICOM" and "BATTLE" above.</p>
    <p>Font seems to be all-caps.  The game frequently applies a "halo" effect to type set in this font.  </p>
    <p>Any help appreciated.</p>
