    html: "<p>Wait a minute, either my Math is off our yours: Nine letters do not work out as nine separate ligatures, more like four and a half. ;) <br> <br>Ideally you should probably strive to end up with a lot less ligatures than that, that is unless you don't need the mark to be legible at all. Ligatures are neither always appropriate nor possible, as certain letter combinations resist attempts at (*ahem*) ligaturization in a most stubborn manner. Maybe you could single out one or two interesting letter combinations in your mark and see how you go. <br> <br>Anyway, if you really do feel your idea could end up producing a great result, then don't waste time: get to it <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
