  html: "<p>I am working on a logo mark. It seems appropriate that I may want to design my own ligatures for the company name.  The company name is 9 letters long. <br> <br>My question is: On average how long does it take to design 9 ligatures? <br> <br>I don't have the time frame to spend too much time doing this, but I feel this undetaking could prove  <br>to be a great result. <br> <br>Any suggestions would be appreciated.</p>"
