    html: <p>Sure its possible. Many typefaces start out as word shape sketches. When you are designing a logo, you have much more freedom than in a typeface. For instance, in the word Typophile, the letter T will only be followed by the letter y, o by p, and so on. In a typeface, the letter T must be able to be followed by 255 other characters. <br> <br>Of course, what style you want to use, plus what materials you will be using (and your skill with them) will determine the time needed. <br> <br>What is the company name?</p>
