    <p>Hello,</p>
    <p>Can anyone recommend similar typefaces to PTL Skopex Serif?<br>
    <a href="http://typecuts.com/fonts.php?kid=1" title="http://typecuts.com/fonts.php?kid=1">http://typecuts.com/fonts.php?kid=1</a></p>
    <p>Basically, a modern serif with some interesting features, such as fancy ligatures, etc. Small caps, and both lining/non-lining numerals would be a bonus.</p>
    <p>Thank you very much!</p>
    <p>Max</p>
