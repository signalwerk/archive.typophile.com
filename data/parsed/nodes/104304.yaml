    html: |-
      <p>liga = ligatures which you want to be on by default, but which can be deactivated by the user.<br>
      dlig = ligatures which you want to be off by default, but which can be activated by the user.<br>
      rlig = ligatures which you want to be on and which cannot be turned off. Or at least that's the theory. Unfortunately, this feature is not implemented by many otherwise OT-savvy applications, probably due to the fact that the adobe feature registry* had originally specified that this feature was restricted to arabic. This  was (IMO) a rather dumb thing to do even if arabic processing was what originally motivated the desire for this feature.</p>
      <p>André</p>
      <p>*http://partners.adobe.com/public/developer/opentype/index_tag3.html</p>
