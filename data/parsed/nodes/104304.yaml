      <blockquote><p>rlig = ligatures which you want to be on and which cannot be turned off. Or at least that's the theory. Unfortunately, this feature is not implemented by many otherwise OT-savvy applications, ...</p></blockquote>
      <p>I'd say fortunately. Too many type designers are apt to think, "oh, this <strong>should</strong> be this way, I'll make it required." rlig should be used when the alphabet (script) itself requires the ligature, not otherwise.</p>
      <p>Take the fi ligature for one example. And suppose you do have a swoopy "f", which collides with the tittle of the i, so you make fi and ffi required ligatures.</p>
      <p>And I have an old-school customer who insists that ligatures should not be used with a setting size greater than 18-point. Or, while you don't claim to support Turkish, someone selects your typeface for a text that contains some Turkish words, a few of which are spelled with a dotted i following an f...</p>
      <p>Now of course any comp worth her salt can achieve this even if you've used rlig, but it's handwork they shouldn't have to go through. Be real careful with rlig assigments, indeed, with anything that substitutes your judgement for an editors or experienced compositors judgement.</p>
      <p>If this gives you more time on your hands, make up a separate set of number glyphs for setting proportions versus tabular figures. Make the 1, 3, 4, 5, and 7 fit that *required* common body...</p>
