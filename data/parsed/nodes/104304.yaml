    html: |-
      <p>I see your point, but the example you're using seems to be one of a poor implementation rather than a problem with the available features.</p>
      <p>The case where the absence of 'rlig' implementation created problems for me was a slightly different one. I was working on a design which contained a large number of ligated forms which were implemented using contextual forms of each letter rather than preformed ligature glyphs. This was done to allow accented characters to occur in ligatures, and to allow ligated sequences of more than three characters without creating a huge number of precomposed forms.</p>
      <p>The contextual substitutions were still triggered by 'liga' (in some cases) and 'dlig' (in others) rather than 'calt' since these forms performed the function of ligatures and 'calt' already included a variety of substitutions which served a very different function.</p>
      <p>Each type of ligation required two substitutions of the following form:</p>
      <p>1. sub @class1' @class2 by @class1joined;<br>
      2. sub @class1joined @class2' by class2joined;</p>
      <p>The following problem arose:</p>
      <p>If, in a sequence such as XYZ, where ligation was possible between all three characters, but the user only wanted to ligate X and Y, Y would still end up appearing in the form appropriate for joining to Z, but Z would not change accordingly and the results would be not only awful, but entirely illegible.</p>
      <p>To solve this, the first substitution was performed by 'dlig' and the second by 'rlig', which still gives the user full control over whether to ligate or not, but avoids issues at feature boundaries. Unfortunately, I did most of my initial testing in InDesign (where this works) before I discovered that programs like photoshop don't implement 'rlig'.</p>
      <p>It seems to me there should be at least one feature available which has an 'always on' status which is available for <em>every</em> script, and at the moment rlig is the only registered feature which even remotely fit the bill in the above example.</p>
      <p>André</p>
