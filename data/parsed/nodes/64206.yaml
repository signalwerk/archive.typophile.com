    <p>Is the C in Crate and Barrel also from Helvetica?  The C in the logo looks like it was cut out of a perfect circle, but neither the O nor C take this shape in Helvetica or Helvetica Neue.  Or is that part custom?</p>
    <p><a href="http://upload.wikimedia.org/wikipedia/en/thumb/5/51/CrateandBarrelLogo.svg/141px-CrateandBarrelLogo.svg.png" title="http://upload.wikimedia.org/wikipedia/en/thumb/5/51/CrateandBarrelLogo.svg/141px-CrateandBarrelLogo.svg.png">http://upload.wikimedia.org/wikipedia/en/thumb/5/51/CrateandBarrelLogo.s...</a></p>
