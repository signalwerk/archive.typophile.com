    html: "<p> Miles, pretty interesting. I think with the various-sized \"thorns\" it will print well: the less the size/resolution, the more the small ones will drop out, but you'll always have some. The only thing that bugs me is the blue: to me it's saying \"ethereal\" more than \"earthy\". I guess blue is their corporate color... Try putting some green in it (towards the color I've heard called \"petrol\"). I mean next time.  :-) <br> <br>Legibility: if the nature of the company makes it so that its name is already in the user's mind when seeing the logo, it's great. But for first-time exposure you might like to make the \"s\" more curvy, and the \"h\" with a longer ascender and narrower body. <br> <br>BTW, the animated thing on the site is very nice! Seen that way, it definitely looks more animalistic. And a cool three-letter domain? They must be rich...  :-) <br> <br>&gt; corpoarte values, namely 'alive', natural' and 'wild' <br> <br>Does the CEO dress up in bear skins?  ;-) <br>(Maybe these days that's his cover...) <br> <br>&gt; 'white occult' <br> <br>Nice. It's always great to have a cool name for a style. <br> <br>hhp </p>"
    html_clean: "<p> Miles, pretty interesting. I think with the various-sized \"thorns\" it will print well: the less the size/resolution, the more the small ones will drop out, but you'll always have some. The only thing that bugs me is the blue: to me it's saying \"ethereal\" more than \"earthy\". I guess blue is their corporate color... Try putting some green in it (towards the color I've heard called \"petrol\"). I mean next time.  :-) <br> <br>Legibility: if the nature of the company makes it so that its name is already in the user's mind when seeing the logo, it's great. But for first-time exposure you might like to make the \"s\" more curvy, and the \"h\" with a longer ascender and narrower body. <br> <br>BTW, the animated thing on the site is very nice! Seen that way, it definitely looks more animalistic. And a cool three-letter domain? They must be rich...  :-) <br> <br>&gt; corpoarte values, namely 'alive', natural' and 'wild' <br> <br>Does the CEO dress up in bear skins?  ;-) <br>(Maybe these days that's his cover...) <br> <br>&gt; 'white occult' <br> <br>Nice. It's always great to have a cool name for a style. <br> <br>hhp </p>"
