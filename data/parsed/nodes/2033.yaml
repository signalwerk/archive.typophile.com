    html: "<p>Hrant, i knew you'd get here. <br>there is a small use version <br><!---Attachment: small_ish.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">small_ish.swf<br><a href=\"http://www.typophile.com/forums/messages/29/small_ish.swf\"><b>small_ish.swf</b></a> (1 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br>simplified for printing on pens and other small promotional items. <br>the blue was intended to be a balance for the wildness of the style, blue would add a little cool conservatism (if at all possible with something like this).  <br>Your points about legibility are true, I only hope that people learn to read it, however, the ad campaign is a pun on german words that usually en with \"isch\", so it would be \"erot\" nandthen the logo, hopefully teaching the viewer the pronunciation of the onamatopaic (sp) name.<p></p>"
    html_clean: "<p>Hrant, i knew you'd get here. <br>there is a small use version <br><!---Attachment: small_ish.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">small_ish.swf<br><a href=\"http://www.typophile.com/forums/messages/29/small_ish.swf\" class=\"link-lost\"><b>small_ish.swf</b></a> (1 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br>simplified for printing on pens and other small promotional items. <br>the blue was intended to be a balance for the wildness of the style, blue would add a little cool conservatism (if at all possible with something like this).  <br>Your points about legibility are true, I only hope that people learn to read it, however, the ad campaign is a pun on german words that usually en with \"isch\", so it would be \"erot\" nandthen the logo, hopefully teaching the viewer the pronunciation of the onamatopaic (sp) name.<p></p>"
