  html: "<p>following some corpoarte values, namely 'alive', natural' and 'wild', i came up with this logo, based on anime style. It's an element of  <br>a style that i'm working on called 'white occult'. <br>the logo has been launched now, and there'[s also a 3d version and an animated version too, but I''ve posted it here since I feel i need to 'air' it in a critical forum. Logos like these tend to be dffficult to critique since they have to be analysed in the context of competitors logos, the visual culture of the audience, and the internal culture of the company. however, i'm interested in any negative/posative associations you may have, and since it's part of ongoing research, any typographic directions identifiable within logo design. Oh, in case you can't read it, we named the company 'ish' (www.ish.com). This work was done while working at an agency called Lucky. <br><!---Attachment: ish_logo.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">ish_logo.swf<br><a href=\"http://www.typophile.com/forums/messages/29/ish_logo.swf\"><b>ish_logo.swf</b></a> (94 k)</td></tr></tbody></table></center><!---/Attachment-!--><p></p>"
  html_clean: "<p>following some corpoarte values, namely 'alive', natural' and 'wild', i came up with this logo, based on anime style. It's an element of  <br>a style that i'm working on called 'white occult'. <br>the logo has been launched now, and there'[s also a 3d version and an animated version too, but I''ve posted it here since I feel i need to 'air' it in a critical forum. Logos like these tend to be dffficult to critique since they have to be analysed in the context of competitors logos, the visual culture of the audience, and the internal culture of the company. however, i'm interested in any negative/posative associations you may have, and since it's part of ongoing research, any typographic directions identifiable within logo design. Oh, in case you can't read it, we named the company 'ish' (www.ish.com). This work was done while working at an agency called Lucky. <br><!---Attachment: ish_logo.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">ish_logo.swf<br><a href=\"http://www.typophile.com/forums/messages/29/ish_logo.swf\" class=\"link-lost\"><b>ish_logo.swf</b></a> (94 k)</td></tr></tbody></table></center><!---/Attachment-!--><p></p>"
