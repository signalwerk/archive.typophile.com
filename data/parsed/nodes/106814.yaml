      <p>The upper case is somewhat similar to the lower case of Harold Lohner's Vine MonogramsInline <a href="http://www.fontbros.com/families/vine-monograms" title="http://www.fontbros.com/families/vine-monograms">http://www.fontbros.com/families/vine-monograms</a>. Harold notes that "The design was inspired by letters made for machine 'pantograph' engraving."<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/VineMonogramsInlineHL_3841.jpg"></div><br>
      Don<p></p>
