    html: |-
      <p>Hi Don, thanks for your input</p>
      <p>It's that A that I have never seen before.<br>
      But anyway I notice now that the A has been hand (or pantograph) engraved, and that he has modified the "leg" endings compared to the letter set, for example.<br>
      I could re-design them but I'm not sure that the engraving machines would be able to read the design. I'll have to try it out.</p>
