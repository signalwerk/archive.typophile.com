      <p>There are so many.<br>
      I could recommend one of mine.<br>
      But I think the best thing you could do is go to a bookstore and look through a few magazines, and find ones whose body text you like and that you think would be suitable for your layout, client and readers.<br>
      You don’t have to copy the fonts or setting exactly, but it will help focus your thinking.</p>
