  html: |-
    <p>Hello all.<br>
    I’m looking to an alternative / similar face to American typewriter.<br>
    as I like the way it feels handmade and a bit loose.<br>
    But something bothers me about the serifs.<br>
    But I don’t want anything as stiff as Rockwell but perhaps something in between?</p>
    <p>It needs to ideally be a bit girly</p>
    <p>Any ideas would be much appreciated </p>
    <p>Cheers </p>
    <p>Mr Brown</p>
