      <p>Dan, that's Hebrew, not Yiddish. </p>
      <p>Kaas's Hebrew characters are no more 'black letter' than many heavy Hebrew faces, such as Masterfont's Hayim. Since unlike latin script the Hebrew script traditionally has no circular parts, it cannot have one of the defining the characteristics of blackletter: the broken straight strokes that replace circular arches, and that give the style its name in German.</p>
      <p>The Ashkenazi letter styles using high contrast and hair line terminals may have been influenced by black letter latin scripts. However in the square script with the opposite contrast from latin--heavy horizontals and light verticals--these features look very different from latin black letter. In any case, these letter styles long exist and do not need inventing. </p>
      <p>In general, it is easier to harmonize a Latin and Hebrew script if both of them are of lower contrast, such as in the example Dan gives. This minimizes the opposite stress of the two scripts.  It may well be easier to harmonize a 'broken' latin letter style, as it is more square, like the Hebrew.</p>
