      <p>"Hrant, Japanese is reasonably plastic, but when you're dealing with ideograms composed of graphemes or radicals, you have to be careful about how you distort the strokes if you want the result to be readable. You have to be pretty sensitive to how Japanese is read before you can start making alterations to forms for aesthetic purposes. I think you're right that outsiders can have more fun with this than native readers and writers, but they still have to be pretty conversant with the language first."</p>
      <p>What Forrest wrote is exactly what I meant, Hrant. You should stop seeing any consideration as an assault on "cultural identities". I just reported what some Japanese friends answered me on the issue: most graphic designers in Japan are attracted to play with Latin forms because they are simple, and thus more bendable in formal terms. With its complexity of visual structure, I think no contemporary designer would pick up the challenge of designing entirely experimental Kanji sets.<br>
      While this may happen for Katakana and Hiragana.<br>
      Which are simpler in visual terms. That's all.</p>
      <p>The cradle of printing history was referred to the Western countries of course. You are boring.<br>
      Leave the US and come back to the old continent (at least with your mind). Or to Africa. Cool.</p>
