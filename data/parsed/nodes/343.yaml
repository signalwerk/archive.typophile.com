    html: '<p>Hi again all, <br>I have a few questions which I am asking people for my dissertation (big thanks to Dan already for answering them x). Would anyone who would not mind being quoted in my dissertation please send me an email regarding these questions? I am looking specifically for those with typographic qualifications or those who now work in typography, but anyone with an opinion to share or a particular insight is more than welcome to reply. <br> <br>Here are the questions: <br> <br>1. Firstly, could you please describe your occupation and explain your connection to typography and specifically Blackletter type. <br> <br>2. What is your opinion of Blackletter/Roman hybrid fonts. Are there any that you believe have been successful? <br> <br>3. Do you believe Blackletter type has a place in contemporary typography, or will it always be regarded as a relic from the past? <br> <br>4. What are your suggestions for “saving” Blackletter and having it used as a body text once more? <br> <br>5. Is Blackletter worth saving? If so, why? <br> <br>6. Why are you personally fascinated by Blackletter (I am assuming you  are from your involvement on the type forums!)? <br> <br>Any answers will be most appreciated. <br> <br>Please email responses to <a href="mailto:cassie_v_leedham@yahoo.co.uk">cassie_v_leedham@yahoo.co.uk</a> - i would prefer private responses to posts. <br> <br>Thanks everyone! <br> <br>Cass x</p>'
    html_clean: '<p>Hi again all, <br>I have a few questions which I am asking people for my dissertation (big thanks to Dan already for answering them x). Would anyone who would not mind being quoted in my dissertation please send me an email regarding these questions? I am looking specifically for those with typographic qualifications or those who now work in typography, but anyone with an opinion to share or a particular insight is more than welcome to reply. <br> <br>Here are the questions: <br> <br>1. Firstly, could you please describe your occupation and explain your connection to typography and specifically Blackletter type. <br> <br>2. What is your opinion of Blackletter/Roman hybrid fonts. Are there any that you believe have been successful? <br> <br>3. Do you believe Blackletter type has a place in contemporary typography, or will it always be regarded as a relic from the past? <br> <br>4. What are your suggestions for “saving” Blackletter and having it used as a body text once more? <br> <br>5. Is Blackletter worth saving? If so, why? <br> <br>6. Why are you personally fascinated by Blackletter (I am assuming you  are from your involvement on the type forums!)? <br> <br>Any answers will be most appreciated. <br> <br>Please email responses to <a href="mailto:cassie_v_leedham@yahoo.co.uk">cassie_v_leedham@yahoo.co.uk</a> - i would prefer private responses to posts. <br> <br>Thanks everyone! <br> <br>Cass x</p>'
