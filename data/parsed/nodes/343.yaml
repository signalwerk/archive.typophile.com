    html: "<p>The opinion of Germans concerning blackletter is paradoxical: on the one hand they know -and feel- the most about it, but on the other they're more concerned with feeling less guilty about the Nazis than typographic richness and integrity. I think a revival might have to come from outside. <br> <br>There has however been some great news lately showing that Germans are perhaps finally getting over WWII*, and this is good news for Fraktur. I won't go into why I think this is happening, lest I trigger another war of words about the Middle East. <br> <br>* Some pertinent BBC.com stories: <br><a href=\"http://news.bbc.co.uk/2/hi/europe/3897885.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/europe/3897885.stm</a> <br><a href=\"http://news.bbc.co.uk/2/hi/uk_news/magazine/3104469.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/uk_news/magazine/3104469.stm</a> <br><a href=\"http://news.bbc.co.uk/2/hi/europe/3055264.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/europe/3055264.stm</a> <br><a href=\"http://news.bbc.co.uk/2/hi/uk_news/3909635.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/uk_news/3909635.stm</a> <br> <br>hhp</p>"
