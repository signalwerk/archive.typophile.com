      <p>There are certain styles of blackletter that are used for heavy metal bands and the like because of their association with Nazism.</p>
      <p>There are other styles with no such association, however; they were used for the names of newspapers until the 1960s in the English-speaking world.</p>
      <p>Today, no thread on the readability of such faces still survives, so I think I can comment briefly on this here. In addition to unfamiliarity,  some letters are very similar to one another - the Hebrew script, ironically, has the same problem. This seems to indicate a lower legibility (which is not the same as readability) objectively.</p>
      <p>Because readability is not the same as legibility of individual letters, because they read words by overall shape; Hrant's "bouma", Fraktur users managed nicely. (Note that Hebrew doesn't even have small letters or much in the way of ascenders and descenders (it has some, i.e. lamed) so it's shortchanged in this department as well.)</p>
      <p>But that fact is hardly an argument for switching to Fraktur. There is no reason I know of, or think of, to believe that Fraktur typefaces would be more readable than Roman typefaces if we became more familiar with them. If anything, it would appear that once familiarity was no longer a problem, the objective decrement in legibilty (more similar letters, more visual "noise") would at least slightly reduce reading performance.</p>
      <p>This, though, does <em>not</em> mean that type designers shouldn't go to such letterforms as those of the rotunda for inspiration. In that area, there is no issue with either legibility or familiarity, so instead of just display faces evoking a past time period, it is perfectly possible to design an original typeface suited to ordinary body text... or even dictionaries, classified ads, and telephone books.</p>
      <p>And, at least, if the result is a gradual drift towards something like Fraktur, that would be the result of the new faces being better; a changeover inspired by a government edict, however well-intentioned, runs the risk of being wrong.</p>
      <p>Oh, and speaking on the identification of Fraktur with the Nazis: the Nazis came to power in 1933; they promoted Fraktur strongly shortly after that until 1941, and as we all know, World War II started in 1939. So Nazi Germany's contacts with the outside world (of most forms, other than bullets and bombs, that is) would have been quite limited in the post-Fraktur era. Thus, it is quite natural that people would have identified things with Germany and Nazism that they saw associated with them back when German films and magazines and so on were actively circulating in their countries. After 1941, Germany was no longer creating much of a typographic impression of itself in the Allied world. So it's only in a distorted hindsight that the 1941 decree makes the identification misguided.</p>
