      <p>In the spirit of the original question (having to do with the contemporary relationship between Blackletter and violent subculture and only secondarily, nazism), the appearance of the more extreme versions IS aggressive. My own disaffiliation for it has nothing to do with Hitler et al. nor even with its adoption by many that promote (at least in 'fashion' or 'sytle' if not in actual practice) violent imagery, the Snoop posture... err POSTER, being a fine example, but rather with the underlying reason for both... it is an oppressive looking graphic iconography.</p>
      <p>as to the comment re: "the classic leftist bad habit of not bothering to match sentiment with commitment or diligence. In other words, the Rule of Thumb wins out over knowing where to stop.", i would love to refute any diss of the left and would here, if its own elemental fatuity did not get in the way of any possible meaning.</p>
      <p>and, no, The swastika was NOT relatively obscure before its adoption by NS. This simple figure predates writing in the west by several centuries, was in use by cultures diverse enough to be unaware of each other's existence on every continent on the planet and was still in broad illustrative and decorative use when those asshole appropriated it for their own use. </p>
      <p>As a staple of Celtic graphic illustration, I still use it, though not usually the squared off version, which is as ugly as many of the early gothic blackletters.</p>
      <p>geo.</p>
