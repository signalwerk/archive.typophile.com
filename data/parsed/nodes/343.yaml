    date: 2005-04-03T15:46:00
    votes: null
    html: <p>Forrest, interesting. <br> <br>&gt; It's somewhat hypocritical to admire the music and deplore the ideology <br> <br>I don't think so, because anything tangible (like a melody or a shape) has its own life so to speak. <br> <br>-- <br> <br>&gt; "Cultural identity" is an unquantifiable simulacrum. <br>&gt; It never means the same thing to any two given people. <br> <br>I'm sorry us humans have such unmeasurable and variable emotions, oh alien robot overlord. Since you can't measure them on your big stick, you must destroy them, certainly. Especially when they interfere with Good Business. <br> <br>Just keep pillaging non-Western museums and I'm sure you'll get over your -deserved- cultural inferiority complex eventually. <br> <br>hhp</p>
