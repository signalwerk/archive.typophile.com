    html: <p>What of the numerous Christian books and Bibles in Blackletter caligraphy? This certainly has nothing to do with Nazis. <br>I don't even think Nazi when I see most blackleter fonts.  Fette Fractur and those like it do however create the image in my mind.  I don't think Fracturs or any font or style of font should be banned. Mass murders and ill treatment of people should be banned, not the type that just happened to be in use at the time. <br> <br>ChrisL</p>
  - id: 2048
    user_id: 1085
    user_name: dan_reynolds
    user_path: null
    date_raw: 9 Aug 2004 — 1:58am
    date: 2004-08-09T01:58:00
    votes: null
    html: <p>Chris, <br> <br>blackletter type relates to Bibles in two distinct ways, both of which are often misunderstood. As you alluded, medieval manuscripts were normally written with calligraphic hands that acted as the influence for the the first typefaces. <br> <br>The "gothic" style of lettering (i.e., texturas) probably developed in the Ille de France concurrently with the advent of Gothic Architecture. As French art and culture (including gothic architecture) spread across Europe by storm, these scripts were passed along as well, although every one (country) wrote them a little differently. Interesting to note that neither Gothic architecture nor gothic scripts ever took a firm hold in Italy (where the <i>italic</i> types that we use today were formuated). <br> <br>Gutenberg copied the format of the medieval manuscript (very quickly and <i>very</i> well) for his first Bibles. The catholic church in Germany continued to set Latin text in Gutenberg-like texturas for generations (this might be a bit of a generalization). <br> <br>What really made <i>Fraktur</i> <b>the</b> German typeface was the printing of the complete Luther translation of the Bible in it, during the 1530s. The Lutheran Bible (in German) remained set in the Fraktur variety of blackletter until the 1960s! <br> <br>The Luther Bible is oftenregarded as the definitive book of the German language. In fact, Luther practically invented <i>hochdeutsch</i> when he wrote it, because he needed to find a langauge that would universally be understood. Even today, German-speaking countries have a range of perlexing dialects. And, it was <b>the Bible</b> after all... talk about a good seller. <br> <br>So, the Luther Bible was the first book printed in the modern German language, and it was printed in Fraktur. This is hard to fight against. It was the standard setter. How could one set German in anything else? <br> <br><b>Well</b>, after the 1800s, a lot of Germans started setting a lot of German books in serif type, because a lot of serif typefaces are easier too read than a lot of Frakturs (I like Hrant's theory that Fraktur Boumas are inherently more legible, but <i>design</i> plays a large role in the translation of this theory... some Frakturs, like some latinate Serif faces, are just <b>bad</b> for use in text). Books that were originally written in other languages, and books that were aimed at the scholarly, upper class (think a special edition of Goethe's <i>Faust,</i> for instance) were now being printed in latinate serif type (called <i>Antiqua</i> in German). Books for the masses, and newspapers, remained in Fraktur until the very end... which was Hitler's banning of Fraktur in 1941, and West Germany's quick, unfounded, association of Fraktur type with Nazism immediately after the war's close. <br> <br>So, Bibles and Blackletters go hand-in-hand, <i>in more ways than one.</i></p>
