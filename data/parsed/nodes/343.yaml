    html: <p>Hi Dan <br> <br>Thanks so much for your advice. I am indeed reading Blackletter:Type and National Identity right now and finding it fascinating reading! As for my German - more than a little rusty! If only Blackletter was popular in France.... <br> <br>I have done a fair bit of reading already and I have been surprised by the lack of information (in English) that there is out there. I have already read every book in my library that says anything about Blackletter and it didn't take too long!  <br> <br>As for the children's book and cookery book idea - of course you are right. But the Yiddish book - I meant that using Blackletter in a modern day context for something such as a history of Yiddish would be detrimental. If Blackletter is to be accepted into modern culture as anything but a decorative font, it needs to be used with something other than a historical topic.  <br> <br>I hope I can make some interesting points along the way, anyhow! I will be using this place as a sounding board for ideas for my dissertation, so I really appreciate you taking the time to reply. <br> <br>Cass</p>
