    date_raw: 25 Mar 2005 — 9:00am
    date: 2005-03-25T09:00:00
    votes: null
    html: "<p>I had a feeling: don't know if it could be useful, but I see that most forum discussions become misdirected because of it: the word used to identify a thing and its perception. <br> <br>In this case: \"Blackletter\". It occurred to me when Josh Griffing mistook the cathegory name/subgenre (Fraktur) with the whole category (Blackletter). <br> <br>My idea to help discussions (in general as well) would be this: considered we are each one from a different country it's great we can use English, but wouldn't it be useful to see which terms are used in our own languages? <br>I think it would be enormously helpful to see the whole picture in a clearer light. <br> <br>I start with my beloved Italian. We do not have more technical terms like \"Blackletter\" or \"Gebrockene Schriften\". We call it \"Gotico\", which, in all senses and with all that the word can evoke is \"Gothic\". <br> <br>But here, the way people superficially use it, is very precise in its loose definition. And as you use it, they tell you it's \"something Nazi\" (the Fraktur) or something generically \"old-style\". <br>While many people (even the most ignorant) are responsive when you talk them of \"Lineare\" or \"Senza Grazie\" (Sans-Serif) or \"Graziato\" (Serif), or \"Calligrafico\" (Script) they are often very quick to refuse your \"Gotico\", since it's \"outdated\" and \"evokes Nazism\". <br> <br>Picking up once again Hrant's interest (which is mine as well) we may consider Italian culture \"needed\" to keep its distance from Nazism for decades after WW2, since we'd been allies with it. How do you think is \"Blackletter\" perceived in Japan, for example, considered they were Germany's allies as well? <br> <br>You should see how the political debate here in Italy still spins around this issue, in an era where it does not make actual sense to still speak of \"Fascism\" or \"Communism\" except as referring to History. Politics seems such a farce today I can't really see why people keep clung to the use of these \"labels\". <br> <br>I find difficult to grasp any actual connection between our post-structural politic parties and their previous historically-soaked counterparts. We live in a sort of \"non-historical\" time, where History's faults has become good mostly used as a childish offense. Ignorance (in any field) seems inevitably interlocked with Pride, and they both prosper. <br>Or is this vision biased by the fact I, myself I'm ignorant about what actually \"Politics\" should be, and that I was born in 1969, already so distant from the War? <br>Is this too off-topic?</p>"
  - id: 2071
    user_id: 5156
    user_name: roland_scriver
    user_path: null
    date_raw: 2 Apr 2005 — 3:48am
    date: 2005-04-02T03:48:00
    votes: null
    html: <p>Great subject for a dissertation Cassie! <br> <br>I guess that you are aware of a trend in the U.K for Blackletter particularly in design work for fashionable/trendy clothing companies; even Liberties on Regent street has used it in their point of sale. But I have a theory that there is a lot more to this interest. <br> <br>Partly it has a lot to do with the recycling of symbols; in the sense that Blackletter has become associated in a contemporary sense with alternative, and even pop culture in the West thanks to its use in the identities of contemporary Rock and R&amp;B acts, and has therefore once again become familiar to our eyes from the point of readability. Blackletter now stands for an acceptable form of rebellion, and has become less associated with Nazi Germany particularly with the younger generations. This association with rebellion has been passed down to us from the 60's and the use of what we would call Second World War memorabilia by American motorcycle gangs as 'cheap riding gear'( Check out page 38,'Hell's Angel, the Life and Times of Sonny Barger and The Hell's Angels Motorcycle Club' published by Fourth Estate). This side of the theory relies on what Claudio called a "non historical time", in that a symbols association can alter with the passage of time. <br> <br>The other part to my theory relates to what is going on throughout Europe at different levels, but particularly on a subcultural basis, and with relevance to countries with a Celtic and Germanic heritage of which the UK is part. <br> <br>There is a growing interest in our individual cultural heritage in relation to a growing belief that globalization is leading to the Americanisation of European identities. Sub culturally this can be seen in the Black Metal scene in Norway (read 'Lords of Chaos' by Michael Moynihan and Didrick Soderlind) where this belief has played a part in the development of a scene that is now international. The same mass interest has been seen in the rise of popularity in History and and European Mythology (see 'Lord of the Rings', the forthcoming 'Beowulf' film, and the forthcoming Ridley Scott film about the Crusades). <br> <br>From the English point of view I think we look at the languages and culture of Europe and see a sense of identity we crave when we consider that our cultural invaders from America use the same language as ourselves, and with the dominance of American media over here, it seems that there is very little we can do to stop our assimilation. <br>For this reason we look for our identity in our nearest cultural neighbors which I believe are those in Northern Europe, and the Celtic countries Scotland, Ireland and Wales; and in this sense I believe that the use of Blackletter as well as Uncials, Semi-Uncials and other decorative Medieval lettering is being used to give a sense of identity that is not Americanised. <br> <br>I know many of these issues are not strictly type related, but they are to do with culture of which language is a part.  <br> <br>By the way I do have good friends who are American, no offence intended.</p>
