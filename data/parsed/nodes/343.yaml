    html: <p>I haven't read the whole thread so don't know if this was mentioned. But Hitler outlawed blackletter a few years into his regime, due to its relatively lower legibility as text. He said, "It's preposterous to maintain this typeface which gives one a headache simply because of its supposedly Germanic traits." (In HITLER'S TABLE TALK 1941-44)</p>
