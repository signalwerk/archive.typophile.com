    date_raw: 12 Jun 2003 — 9:59pm
    date: 2003-06-12T21:59:00
    votes: null
    html: <p><i>It stems from the postwar sentiment to reject anything and everything that could even remotely be connected with NS, a great example of the classic leftist bad habit of not bothering to match sentiment with commitment or diligence.</i> <br> <br>To be fair to postwar German social democrats, cultural de-Nazification was vigorously imposed by the occupying powers, particularly the Americans in West Germany, and those responsible can't be expected to have had a nuanced and informed sense of the role of blackletter in German history longer than twenty years. This was one of the topics discussed at the blackletter panel in Leipzig. One of the interesting aspects of this period is that the Soviet occupiers in East Germany really didn't seem to care one way or the other about blackletter, probably because they lacked any understanding or interest in the blackletter vs. antiqua debate of what was, for them, a foreign script. This is one of the reasons why interest in blackletter persisted in East Germany (e.g. by Albert Kapr in Leipzig) when it was still virtually taboo in the West.</p>
