    html: "<p>Although I think <i>banning</i> Helvetica (or any font, even Comic Sans :-) is counterproductive, in the blackletter/Helvetica comparison, reducing usage of the latter certainly has more merit, because: many people who want to ban blackletter are motivated by policital manipulation; blackletter has functional merit, which has yet to be really explored; and Helvetica is a poor type design. <br> <br>Hate is indeed too strong an emotion to feel for a font, but it's not too strong an emotion to feel for the motivations behind the contemporary denigration of blackletter. <br> <br>BTW, some good news: <br><a href=\"http://news.bbc.co.uk/2/hi/europe/3897885.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/europe/3897885.stm</a> <br>So maybe a blackletter revival will first come from within Germany after all. <br> <br>hhp <br></p>"
