    date_raw: 19 Jul 2004 — 9:38am
    date: 2004-07-19T09:38:00
    votes: null
    html: <p>I took a look at your website, LHOON, and I must say that I disagree with you about Helvetica. <br> <br>While I am saddend by the supression of blackletter, amoung other things, in late 20th C design, I think that responding to this by turning around and trying to "eliminate" Helvetica is silly. How different is this from designers who tried, and are trying to elimiate blackletter from the typographic pallette? There was a time when blackletter was comparatively as ubiquitous as Helvetica is today (esp. in Germany). <br> <br>Just as Tschichold, later in life, looked back at his <i>New Typography,</i> and saw parallels between its polemic and fascism, current "blacklashing" against Helvetica by a tiny minority of designers is just as bad. <br> <br>Helvetica became one of the most used computer fonts in the world because it had alrady been used successfully for two and a half decades in metal and film form! It wasn't the Mac (or the PC) that made Helvetica so ubiquitous, it was swiss designers themselves. Already in the 1970s, American designers were writing articles in design journals decrying how Helvetica had taken over the world. <br> <br>And lastly, regarding a comment on your site, I find it unlikely that "Hitler" would rejoice at the triumph of Helvetica in the world. While Helvetica is a descendent of German sans serif typefaces, these were NOT the sorts typefaces that the NS supported the usage of. They disapproved of modernism in virtually all of its manifestations. <br> <br>"Hate" is just too string for anything, especially something like typefaces or type choices (and I'm a TYPE designer!). Aren't there better things in the world to fight against, and collect petitions for the abolition of, than Helvetica?</p>
  - id: 2046
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 19 Jul 2004 — 10:27am
    date: 2004-07-19T10:27:00
    votes: null
    html: "<p>Although I think <i>banning</i> Helvetica (or any font, even Comic Sans :-) is counterproductive, in the blackletter/Helvetica comparison, reducing usage of the latter certainly has more merit, because: many people who want to ban blackletter are motivated by policital manipulation; blackletter has functional merit, which has yet to be really explored; and Helvetica is a poor type design. <br> <br>Hate is indeed too strong an emotion to feel for a font, but it's not too strong an emotion to feel for the motivations behind the contemporary denigration of blackletter. <br> <br>BTW, some good news: <br><a href=\"http://news.bbc.co.uk/2/hi/europe/3897885.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/europe/3897885.stm</a> <br>So maybe a blackletter revival will first come from within Germany after all. <br> <br>hhp <br></p>"
