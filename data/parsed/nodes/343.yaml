    votes: null
    html: <p>&gt; why did the nazis feel they had to pretend that this wasn't a simple practical measure.  <br> <br>Because they were commited to an idea of German national culture that required the preservation and celebration of anything distinctively German. The only way to get rid of something so obviously German as blackletter, was to deny its Germanity. <br> <br>I also think it was a characteristic of Nazism to require an <i>ideological</i> reason for everything, so 'simple practical measures' were unlikely to be acknowledged as such. If it is possible to relate your ideology to absolutely every aspect of life, you can present this as evidence of the universal truth of your ideology.</p>
  - id: 2030
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 12 Jun 2003 — 3:32pm
    date: 2003-06-12T15:32:00
    votes: null
    html: <p><i>Why is hating blackletter -by associating it with the Nazis- seemingly encouraged by most people? Especially when you consider that the Nazis disowned it!</i> <br> <br>I don't think it is actively encouraged; it just isn't discouraged and most people don't know any better. The vast majority of people have no idea about the Bormann memo or the official rejection of blackletter by the Nazi regime. All they know is that in every WWII film they have ever seen blackletter is used for Nazi documents, signage, etc. And when game developers produce the latest version of Castle Wolfenstein or Day of Defeat, what do they use to evoke the WWII period? Blackletter.</p>
  - id: 2031
    user_id: 851
    user_name: johnbutler
    user_path: null
    date_raw: 12 Jun 2003 — 3:51pm
    date: 2003-06-12T15:51:00
    votes: null
    html: <p>First of all, most of the anti-blackletter sentiment and false association with NS is among modern Germans, not Americans. It stems from the postwar sentiment to reject anything and everything that could even remotely be connected with NS, a great example of the classic leftist bad habit of not bothering to match sentiment with commitment or diligence. In other words, the Rule of Thumb wins out over knowing where to stop. <br> <br>Second, I wouldn't say that most Americans consider it "OK to hate Germans in general" and don't understand where you get this crazy notion. It may have been true after the war, but most Americans today have a rather neutral or favorable opinion of Germany and Germans, notwitstanding the usual bickering over the recent Iraq war. Personally I wouldn't trade my Audi for any American car on the market, and I love traveling in Germany. <br> <br>If you read the rest of Bain &amp; Shaw's book, you will see that today blackletter is mostly associated with <i>Heimatkitsch</i>, goth music, and certain subcultures in Germany. Certain styles (Schaftstiefelgrotesks like Element, Tannenberg and Deutschland) are definitely and perhaps correctly associated with NS. And blackletters of all types are routinely commandeered by lunatic fringe designers.  <br> <br>But the mistake of permitting that fringe to get away with "making those types their own" is what grates on me the most. Of course, others make this same argument about the swastika, but I can't go that far. The swastika was relatively obscure before its adoption by NS, whereas blackletter was a centuries-old institution with origins and roots both inside and outside what is now Germany. <br> <br>The only way to counter this is to start using blackletters again for general purposes--even body text! (Yeah, I know, good luck selling a client on that. :-) So far I only see them in reprints. <br> <br>There's also the readability issue, which is already discussed in another thread.</p>
