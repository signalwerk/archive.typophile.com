    html: "<p>I retain just a reflection from my tirade: <br>I'm still curious to know if there's been some interesting use of Blackletter in Japanese design. <br>From what I get, Japanese get interested in Latin since its forms are bendable and easy to play with, coming up with variations. <br>A friend told me most designers tend to look at the Latin typefaces as fun and exciting for their variety, and for the immediate generic feeling they convey. <br> <br>But what kind of typography did we have in Japan while Europe was the cradle of printing history? And during World War 2? I'd love to hear a Japanese designer on this.</p>"
