    html: <p>Hey everybody <br> <br>Well, I have been hiding out in my dark little studio writing my dissertation and it is coming along nicely. It has changed a little bit in that it is now more focused - it is an examination of the relationship between Blackletter and alternative culture and why they are drawn to it. Specifically, I am looking at Heavy metal and rock music fans (think motorhead logo etc), hip hop and rap fans (eg. Cypress Hill logo) and members of Black and Hispanic gangs in America who often use Blackletter for their identifying gang tattoos. <br> <br>It is getting really interesting. I am looking at cognitive and contextual reasons for them choosing Blackletter and I have a few new theories of my own which I will share with you when I get some evidence to back them up! But in the meantime, any opinions relating to this subject would be most welcome. <br> <br>Hope you are all good and happy! <br> <br>Cass x</p>
