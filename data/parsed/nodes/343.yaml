    html: <p>An interesting point, John. <br> <br>I do not believe that most ordinary Germans object to blackletter for headlines and subheads (the Frakfurter Allgemeine uses 16pt or so textura subheads in its columns to this day.) There would probably only be widespread irritation if it were used as body text in a book... the usual "man kann das nicht lesen." <br> <br>And Hrant, I'm trying hard to disagree about the Yiddish idea but can't. :-) In addition, there were a number of Jewish type designers... I believe Berthold Wolpe was Jewish. He studied under Koch and fled to London in 1935. He designed a blackletter called Sachsenwald-Gotisch. Some more details can be found <a href="http://www.gazette.de/Archiv/Gazette-Mai2001/Willberg.html">here</a>. I haven't been able to locate a specimen. (Perhaps Andreas has one?)</p>
