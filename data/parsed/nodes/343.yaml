    html: "<p>&gt; The only way to counter this is to start using blackletters again for general purposes <br> <br>Yes! Just thrust the iron into the fire. <br> <br>And I was thinking that the ideal type of place to do that would be \"The History of Yiddish\" or something! You would have a colophon explaining the whole sordid affair, and how it doesn't make sense to hate blackletter. <br> <br>But you would need a new breed of blackletter. <br>Broken record, I know: <a href=\"http://www.themicrofoundry.com/ss_fraktur2.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_fraktur2.html</a> <br> <br>hhp <br></p>"
