      <p>And, as Yaronimus wrote:<br>
      <cite>some people forget that befor the nazi party rised, jews lived in germany, were german citizens, and were proud germans. they loved the german culture and called them selves "german of moses religion" (free translation). they talked german and read and breathed german.</cite></p>
      <p>Precisely what I meant. Edith Stein reflects on this, as she saw Nazism grow, and felt her german heritage and what she cherished as a german woman.</p>
      <p>And I quite like Laibach, since their musical and visual work is ambiguous enough to make you grasp how easily ideologies are tied to visions, ideals distorted, but nonetheless a value is always something people (think to) see.<br>
      Malevolence and ignorance are inextricably tied, so I think it’s not a solution to simply “cast aside a characteristic”, but more to get actual communication work. This is never attained by analysis.</p>
