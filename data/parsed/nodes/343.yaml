      <p>Hrant, I have ignored your suggestions about publishing a book about Yiddish in black letter because I wanted to be courteous. </p>
      <p>But if you insist: it's an embarassingly stupid idea. Getting enough of a readership for any book on Yiddish to justify the expense of publishing a book is difficult enough. To put it in a font that most people today would have difficulty reading would assure no sales. And anyway so far as I know Latin black letter has nothing to do with the history of Yiddish language (which is written in Hebrew script), so there would be no aesthetic point. </p>
      <p>As to any political point. There is no Jewish movement to ban black letter, and never was. And there is no current movement of any kind to ban black letter. So there is no point in a movement to counteract a non-existent movement that for some bizarre reason you feel should be passionately hated. </p>
      <p>If people want to revive blackletter--and in fact it seems to be more and more popular--then either create wonderful new typefaces that look fresh and have blackletter heritage--like Fakir and Litteratra--or use traditional styles in visually interesting ways. I for one will look foreward to seeing them. </p>
      <p>As to learning more about Hebrew script, just go to <a href="http://www.masterfont.co.il/" title="http://www.masterfont.co.il/">http://www.masterfont.co.il/</a>.  You will find 'chayim' under 'chet'-- the eighth letter of the Hebrew alphabet.</p>
