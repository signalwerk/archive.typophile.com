  html: "<p>{Over in the Design area, there's a thread called \"Overused Typefaces\"* which has sprouted an interesting discussion about blackletter. I'm trying to redirect it over here. I was going to call this new thread \"OK to Hate\", considering my post below, but I realized it needed to be broader. <br> <br>* <a href=\"http://www.typophile.com/cgibin/show.pl?4100/7580\" target=\"_blank\">http://www.typophile.com/cgibin/show.pl?4100/7580</a> <br>Starting: Tuesday, June 10, 2003 - 10:41 am} <br> <br> <br>&gt; a revival of blackletter may be helped along by its role in an interesting historical situation. <br> <br>I have a short-story-length expose boiling over in my head about this at the moment, but for now let me ask this \"set-up\" question: <br> <br>Why is hating blackletter -by associating it with the Nazis- seemingly encouraged by most people? Especially when you consider that the Nazis disowned it! Is it perhaps because it also seems to be OK to hate Germans in general (at least in the US)? It can't be anti-Semitism, since very few people know/believe the (false) story that blackletter was Jewish. Is it because people need something to hate? Is it due to brainwashing? Or what? <br> <br>&gt; why did the nazis feel they had to pretend that this wasn't a simple practical measure. <br> <br>Maybe because they could get more milage out of it by pretending it was part of fighting Jews. <br> <br>hhp <br></p>"
