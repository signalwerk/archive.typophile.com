      <p>I am very sorry we now can no longer have what could have been – as usual – an insightful and informed contribution by our Typophile member Georg, a.k.a. Bleisetzer, which sadly passed away last July.<br>
      I learned about that from his daughter Hannah. I often become aware of a person’s value and then I discover he/she’s just dead.</p>
      <p>And I do think it is totally inadequate to use the term "nazi". Nazism, as any other phenomena and as many varied terms often used so erratically, was something complex and not something to be used as a label.</p>
