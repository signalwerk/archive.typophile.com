      <p>although i am writing in this thread too late, there are just some little things i want to say about blackletter.</p>
      <p>some people forget that befor the nazi party rised, jews lived in germany, were german citizens, and were proud germans. they loved the german culture and called them selves "german of moses religion" (free translation). they talked german and read and breathed german.</p>
      <p>disowning blackletter as the nazis do, sounds so irrational, it's like disowning arian features like blond hair. but, the nazis were far from being reasonable.. hitler disowned the german people when he found out that "they wasn't worthy" for him.</p>
      <p>i think that nowadays we should cast aside things like general views, opinions and characteristic of an entire culture and people (and i won't use the word race). claiming jews are against blackletter? huh?<br>
      my knowledge about this is quite small, but there is something problematic with the question. im a jewish man, an israeli. i also have european features, but that's not all who i am. i have a personality above my origin and so does every jew. jew do not obtain homogenic opinions, we don't share one brain. </p>
      <p>furthermore - i think blackletter is cool. i love arabic type. i love gothic architecture and german culture, and i love arabic music. i am trying to trancend above general views about people. i am above hating all germans, or the german language for instance because what the nazis did. im trying to see a more incitive view of the different cultures, and so should every man. we can't assume such general opinions before we have really made a good contact.<br>
      i don't think jews are against blackletter. it might be that one of the symbols, gathered in the jewish and western collective memory of the hollocaust, was unfortunately the blackletter. was unfortunately swastika, or german laguage. but that doesn't meen all think the same.</p>
