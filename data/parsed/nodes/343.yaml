    date_raw: 21 Nov 2004 — 11:57am
    date: 2004-11-21T11:57:00
    votes: null
    html: <p>John, I haven't even heard abouth this book. It sounds fascinating! Unfortunately, Amazon.de reports that it is sold out, and no used copies are available. ZVAB doesn't even list it in its database, and it goes without saying that our college library doesn't have it* :-/ <br> <br>I would like to see this. I'll keep looking around for it. If any of the Germans reading this have a copy, or know where I could get one, please let me know. <br> <br>The history of German unification is fascinating. In AP European History, we had to memorize both it, and the unification of iItaly. I found the unification of Italy rather dull, and have forgotten it entirely. <br> <br>While Napoleon's ravaging Central Europe certainly raised the level of "German" consciousness (just see Goethe's letters from his mother!), and Napoleon's political tinkering allowed German unification to happen sooner, I'm not too sure that those wars had a direct role in German unification. <br> <br>In my vague opinion, I think that the sheer force of the Hollenzollern family's will led to Germany's unification (plus late breaks by a cunning Bismark and a stupid Napoleon III). The ravaging wars of the 1600s (mainly the 30 years war) more or less "created" the House of Brandenburg. But for the next two centuries, many other Germans saw the Hollenzollern Prussians as bullies. However, like the French monarchs of the 1000s</p>
