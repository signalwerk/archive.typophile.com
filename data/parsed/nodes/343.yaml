    html: <p>Cassie, great to see such budding interest in blackletter, and great to have you on Typophile too! <br> <br>Although time heals all, the reason I think something like a book about Yiddish would be "optimal" is that currently -as you say- the negative associations of blackletter are too strong for it to be used neutrally; for example if you use it for a children's book you'll surely be accused of trying to raise the next generation of Neo-Nazis; not to mention the compounding of the legibility issue for youngsters. Because blackletter's main liability is that it's perceived as being anti-Semitic, using it in the <i>opposite</i> light seems like the key (along with an expansive colophon about the "situation"). On the other hand, I agree that it doesn't have to be -and yes, quite probably <i>shouldn't</i> be- historical. <br> <br>hhp</p>
