    date: 2005-04-02T09:30:00
    votes: null
    html: "<p>I retain just a reflection from my tirade: <br>I'm still curious to know if there's been some interesting use of Blackletter in Japanese design. <br>From what I get, Japanese get interested in Latin since its forms are bendable and easy to play with, coming up with variations. <br>A friend told me most designers tend to look at the Latin typefaces as fun and exciting for their variety, and for the immediate generic feeling they convey. <br> <br>But what kind of typography did we have in Japan while Europe was the cradle of printing history? And during World War 2? I'd love to hear a Japanese designer on this.</p>"
  - id: 2075
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 2 Apr 2005 — 9:48am
    date: 2005-04-02T09:48:00
    votes: null
    html: "<p>&gt; Japanese get interested in Latin since its forms are bendable <br> <br>1) The Japanese are interested in Latin (in fact they look up to it) because the US defeated them in WWII. The effect of their capitulation -especially when you consider their erstwhile obsession with Honor- is at the heart of their current mindframe, including matters typographic. <br>2) To me Japanese seems more bendable than Latin, not least due to its two levels of color. I would guess that Japanese designers are simply more conservative with their own script - and this is typical of virtually all peoples: Anglos for example merrily reform -and even replace- the scripts of other cultures, but they throw monumental hissy-fits when you suggest that Latin could use help. <br> <br>&gt; Europe was the cradle of printing history <br> <br>? <br> <br>hhp</p>"
  - id: 2076
    user_id: 5605
    user_name: Forrest L Norvell
    user_path: null
    date_raw: 3 Apr 2005 — 12:29am
    date: 2005-04-03T00:29:00
    votes: null
    html: "<p>The Japanese fashion industry is obsessed with blackletter. Check out <a href=\"http://www.s-inc.com/hnaoto/\">h.Naoto Blood</a>, where blackletter type becomes a design element on the distressed fabrics of their most out-there designs. Blackletter is used as a signifier of Western exoticism, Victorian-era fetishization of childhood (cf. ref. Japanese \"elegant lolita\" culture), and spoOoOoky Gothicness. There was a good article about the Gothic Lolita scene, which has been a dominant trend in Tokyo's Harajuku fashion district for a good five years now, in the <a href=\"http://www.nytimes.com/2005/03/13/fashion/13GOTH.html?pagewanted=all&amp;position=&amp;pagewanted=all\">New York Times</a> (unfortunately, it's disappeared into the archives). Anyone with access to a good Japanese bookstore is encouraged to pick up a copy of Gothic &amp; Lolita Bible to see how this works out in practice. <br> <br>What interests me about this phenomenon is how closely it mirrors the American goth / industrial subculture's fascination with incorporating Japanese language text into their own designs. The Japanese have created this weird steampunk vision of morbid Victoriana, where Japanese evokes postapocalyptic futurism to the goths. I guess we all yearn for the exotic. <br> <br>Hrant, Japanese is reasonably plastic, but when you're dealing with ideograms composed of graphemes or radicals, you have to be careful about how you distort the strokes if you want the result to be readable. You have to be pretty sensitive to how Japanese is read before you can start making alterations to forms for aesthetic purposes. I think you're right that outsiders can have more fun with this than native readers and writers, but they still have to be pretty conversant with the language first. <br> <br>It would be interesting to see what people could do with the archaeographic forms or Japanese / Chinese calligraphy, which use forms that are considerably freer in their rendering. <br> <br>Re: black metal, tastes vary. Some of my favorite music is black metal, although John is right in saying that black metal reflects deep-seated unease to the point of atavism in its outlook. The original black metal scene was full of neo-Nazis, xenophobes, homophobes, and pretty much every other form of violent European white male thuggery. It's somewhat hypocritical to admire the music and deplore the ideology, but hey, people still go see Wagner's operas all the time. And yes, black metal bands love not only blackletter but the extreme plasticity of letterform that blackletter reflects: just look at a few black metal band logos, and you'll see what I mean. It's strange to me that blackletter doesn't get used more than it does. Typically it's used by the bands that are trying to sound more medieval and primitive and less extreme or thrashy, much like you'd expect.</p>"
