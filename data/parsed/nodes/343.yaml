    html: "<p>Greetings Cassie, <br> <br>Sorry I haven't responded earlier. I hope to send you some answers to your questionnaire shortly. <br> <br>But I would like to mention one book I picked up at the recent Prague conference. It's a doctoral dissertation by Silvia Hartmann entitled <i>Fraktur oder Antiqua: die Schriftstreit von 1881 bis 1941.</i> Published in 1998, second edition in 1999, by Peter Lang GmbH in Frankfurt.  <br> <br>It exhaustively analyzes minutes and correspondence among the governments, proponents of Antiqua and defenders of Fraktur up until (and slightly past) the Verbot in March 1941. It includes monotone facsimiles of typewritten letters, escalating in desperation and absurdity near the end. Some of the letters are in a Fraktur typewriter font! The quality of reproduction is poor, but I'll try to post some scans. I always knew such typewriters existed but couldn't find samples after years of searching. <br> <br>I'm about 50 pages into this 450-page book after two months of on-and-off reading (on my best days I can finish two pages) and it combines the dryest of academic and bureacratic German. Not rip-rooaring so far... a lot of he-said-she-said... but it paints a clearer picture than anything that came before, and for that I am grateful to Dr. Hartmann. I expect it to become more interesting further into the book, especially when the Schaftstiefels start waddling in. <br> <br>It is important to remember that the German language as we foreigners are taught is a gross oversimplification of what it used to be, which is more than one dialect of arguably more than one language. The greatest solidifying forces of the modern written German language are Goethe's literature and Luther's Bible translation. In the 1800s, German nationalization--for better or worse--was as much about consolidating a common laguage and identity as anything else. You can't so easily amass power when the people you want working for you can't understand you. I see the assertion of some common \"Germanness\" as a sign of desperation more than anything else. My knowledge of 17th-to-19th-century European history is too spotty to speculate accurately, but I think this desperation may have arose in the wake of what other adjacent empires were doing or had recently finished doing on Prussian and Saxon soil. There were regional differences within Germany just as in any other nation that had to be overcome. More complex than the puerile extrapolation of cultural meaning from the purely mathematical classification of \"red states\" and \"blue states.\" <br> <br>As an aside, I was born into a military family that moved around a lot, but by age seven we settled into a relatively isolated part of the United States (the rural South) and I spent the rest of my childhood there surrounded by strange dialect, strange customs and patently offensive ideas about \"race\" and \"revival\" and a few other chestnuts. Our schools were effectively segregated ad hoc. I was lucky to have parents who knew what to look out for and keep me from falling in with friends who susbscribed to these things (the military culture had long since developed a very simple and effective means of dealing with ignorance) and I never quite assimilated. I had escape fantasies from the beginning, in fact. But what I observed coming back after a few years in college is that the Southern accent has completely left younger children. Their televisions teach them how to talk, think and feel. They all still know rednecks, they make fun of them now, and being one is now more a sign of rebellion and is often as artificial as being, say, a \"goth.\" (Heh.) Mullets are even cultivated out of conscious irony rather than plain ignorance. But I don't know if this is any sign of advancement. From where I look, they're merely exchanging one mass culture for another one. <br> <br>To be sure, I don't feel any sense of elitism for observing this. On the contrary, I think it happens everywhere, and there is an impulse in many (most?) people to see the others surrounding them as not clued in on what they know. In my own more discouraged moments, I see my fascination with Blackletter and automated fine typography as my own not being clued in on what everyone else already knows. But I say fück it, it gives me great pleasure, so why not plow ahead. (Thanks to the typophile censor engine for necessitating the umlaut.) I'll let others experience and preserve the fascination of professional football, prime-time home renovation documentaries, and Univers on a damn Swiss Grid. <br> <br>There has been a lot written about Blackletter for German, cos that's where it last had massive use, especially in text sizes. What I would like to see is an analysis of what happened to Blackletter outside of Germany, and I suspect that you will find that it wasn't discarded for its own faults, but because Antiqua designs of particularly high quality appeared here or there at this or that time, became quickly fashionable and successful enough as to set a standard. And I think this happened long before there was anything close to an actual \"Germany.\" Before there were nation-states at all as we know them. We should probably turn this around and ask not why Fraktur failed, but why Antiqua succeeded. And I suspect it has less to do with how the letters looked and more to do with the parts you can't see, for example what mechanical innovations and economic demand  coincided with Antiqua types' introduction... did printers simply happen to be able to print more as a result of faster presses, more paper, growing literacy--did the letter shapes themselves ever play much of a part in their own success? <br> <br>The main problem I have about the Fraktur v Antiqua argument is the \"versus.\" The idea that you must discard the other when choosing the one makes no sense to me. And if people find it hard to read, well boo farking hoo. Oh no, we wouldn't want to learn something new, now would we?! <br> <br>[panting exhaustedly] <br> <br>Welcome to the show!</p>"
