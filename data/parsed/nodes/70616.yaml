    <p>Introducing Mytype time. Every minute get a new image in this fun clock. </p>
    <p>typotherapy+design put on a show of eye-popping type-based posters called MyType. The show featured posters of original typefaces designed by creative director Noël Nanton. The limited-edition posters reflecting his own, very new take on classic modernist typography.</p>
    <p>Download it for free.</p>
    <p><a href="http://itunes.apple.com/ca/app/mytype-clock/id371038016?mt=8" title="http://itunes.apple.com/ca/app/mytype-clock/id371038016?mt=8">http://itunes.apple.com/ca/app/mytype-clock/id371038016?mt=8</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MyTypeClock-Ad1_5887.jpg"></div><p></p>
