      <p>I've licensed Sophisto and used it for the corporate identity of a regional hospital. It works brilliantly both as a display and a text face in a wide variety of applications, and has all the necessary bells and whistles to set even the most demanding corporate material.</p>
      <p>And what about <a href="http://www.vllg.com/Village/GalaxiePolaris/mudTyper+Weights/" rel="nofollow">Galaxie Polaris</a>? More generous in width, a nice tension in the superellipse curves, has all the feature-rich OpenType goodness, and it's very subtle in its modernity. A sure winner.</p>
