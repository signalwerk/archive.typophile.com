    <p>Hi there, I was wondering if anyone had any ideas of a typefaces that are suited to body copy for corporate literature. Previously the designs in question used arial, but they are keen to 'push the boat out'(!) and go for something a little more contemporary and funky. any suggestions?</p>
    <p>I'm talking about a company involved in finance etc so a suitable typeface should evoke solidarity and dependability, not too 'fun' for want of a better word.</p>
    <p>Any thoughts at all are greatly appreciated.</p>
    <p>R.</p>
