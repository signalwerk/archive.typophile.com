    <p>Epitet, subtle compact type family with modern mixture of geometrical and simple shapes, comes in 6 weights, from Thin to Bold. It is a clean elegant sans serif typeface, with small x-height, highly legible in all sizes.</p>
    <p>Very versatile and comprehensive , Epitet can be used in wide range of corporate and editorial possibilities.</p>
    <p>I'm sure Epitet could get even more epitets, but the appropriate use of Epitet would be the biggest one it could get.</p>
    <p><a href="http://www.tourdefonts.com/index.php?/font-catalog/epitet/" title="http://www.tourdefonts.com/index.php?/font-catalog/epitet/">http://www.tourdefonts.com/index.php?/font-catalog/epitet/</a></p>
