      <p>@frode frank. Thanks! I really like it too.</p>
      <p>@sii. It seems to me that putting holes or spaces into a character is not something they can claim is intellectual copyright. I'm sure there are plenty of examples of characters with holes in them — see an inverted Rosewood for example. Sure, the font file itself is their intellectual property, but you can't copyright a idea (at least under US law). It is like building a car. You can design a car to be environmentally friendly, but that doesn't stop another car maker from trying to make an environmentally friendly car too. In fact, an article on TypeRight seems to back up this line of thought <a href="http://www.typeright.org/feature4.html" title="http://www.typeright.org/feature4.html" rel="nofollow">http://www.typeright.org/feature4.html</a>.</p>
