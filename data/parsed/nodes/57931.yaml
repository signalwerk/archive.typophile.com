  html: |-
    <p>I don't know if this is already posted here, but I saw this when browsing the web:</p>
    <p><em>"Ecofont</em></p>
    <p>The prints we make for our 'daily use' not only use paper, but also ink. According to SPRANQ creative communications (Utrecht, The Netherlands) your ink cartridges (or toner) could last longer.<br>
    SPRANQ has therefore developed a new font: the Ecofont.</p>
    <p>"After Dutch holey cheese, there now is a Dutch font with holes as well."</p>
    <p>Appealing ideas are often simple: how much of a letter can be removed while maintaining readability? After extensive testing with all kinds of shapes, the best results were achieved using small circles. After lots of late hours (and coffee) this resulted in a font that uses up to 20% less ink. Free to download, free to use."</p>
    <p>It can be downloaded for free. To download and for more information, see here:</p>
    <p><a class="freelinking external" href="http://www.ecofont.eu/ecofont_en.html" rel="nofollow">http://www.ecofont.eu/ecofont_en.html</a></p>
    <p>What do you guys think of it?</p>
    <p>Kind regards,<br>
    Martijn</p>
