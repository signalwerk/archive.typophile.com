    <p>An Ethical Question: Is it Kosher to look at OpenType feature code of existing fonts?<br>
    In my effort to learn to code assorted Opentype features, I come to the conclusion that I could learn more quickly if I were able to look at feature codes from OTF fonts. I have seen nothing in the EULAs about it and I don’t plan to copy and paste it into my own fonts.  I just want to see what it looks like.  This sort of thing was common in HTML code borrowing several years back as well.<br>
    Above all, I don’t want to be guilty of stealing other peoples work so I am asking.</p>
    <p>ChrisL</p>
  html_clean: |-
