      <p>I forgot:<br>
      &gt; This entire discussion is about a fringe human activity.</p>
      <p>No, I think buying stuff and making money from their use is normal; but the idea of "professionalism" over-riding more mainstream human behavior (like looking at something that's right in front of you) is not.</p>
      <p>--</p>
      <p>Just to clarify (not least to myself), I am arguing for two things:</p>
      <p>1) A reduction in clauses which end up hurting most everybody. I might even come to think the no-mod clause is a necessary evil* (if only because of an alleviation from #2 below); but not the other two I mention above.<br>
      2) The implementation of a document parallel to the EULA, something<br>
      that would simply communicate the true, human <cite>expectations</cite> of the font house. This would be a non-binding, non-threatening frank letter of sorts, which helps non-nasties feel comfortable, hence more likely to be amicable... and buy stuff!</p>
