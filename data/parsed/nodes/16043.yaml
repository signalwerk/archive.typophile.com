      <p>Hrant, we're talking about ownership of rights to a particular product and the licensing of those rights to other parties. You comment about the Garamond revival is completely irrelevant and, worse, a red herring. The question of ownership of design is not being discussed. What is being discussed is ownership of rights to something that has been made and is being licensed. Whether those rights include design rights at all is irrelevant. If I make a digital font, I have certain rights associated with that product irrespective of whether the design is a revival or original, and I can choose to license some or all of these rights, exclusively or non-exclusively, to another party. And those rights definitely do include the right to determine whether or not this product may be decompiled or derivative products made from it. The maker is under no obligation to give you any rights at all beyond those identified in law as fair use, and he can determine what rights he will license to you and at what price. You determine whether or not you are willing to pay that price.</p>
      <p>Discussion between licensers and licensees are a really good idea, and this can and does lead to mutually beneficial, negotiated agreements or special arrangements (individualised EULAs). But it all comes back to the point of commerce at some stage: will you pay the asking price for the rights being offered. If you pay the asking price while planning to take more rights than are being offered, you are a swindler. Tiffany isn't extremist or even more than usually professional, she's just honest: she knows what she is purchasing and that she doesn't have a right to more than she is purchasing. Does that make her a freak and her actions contrary to what you have decided is 'human nature'?</p>
