      <p><em>Professionalism is a fringe human activity.</em></p>
      <p>But we're talking about licensing of professional tools. This entire discussion is about a fringe human activity.</p>
      <p>All you are expressing is the self-interest of the licensee who wants as much as possible for as little as possible, to which you've added your stated intent to take whatever rights you think are reasonable even if you have not paid for them.</p>
      <p>The seller of font licenses wants to get as much money as possible and to maintain the ability to make more money, hence limitations on the rights granted by the license.</p>
      <p>Obviously the self interest of the licensee and the self interest of the licenser need to be negotiated and to meet somewhere in the middle. But the place where they meet is <em>the point of commerce.</em> That is the only fair place to determine what is acceptable to both parties: the point at which one person says 'I am willing to pay the price asked for this collection of usage rights' or 'I am not willing to pay the price asked for this collection of usage rights'. And if you decide that you are not willing to pay the price asked, <em>don't buy the license.</em> Assuming rights that are not yours is as much theft as taking anything else that belongs to someone else.</p>
