      <p>Here's something for nut fractions:</p>
      <p>feature frac {</p>
      <p>sub @FIGURES' slash by @sups2;<br>
      sub slash' @FIGURES @FIGURES by nut2;<br>
      sub @FIGURES @sups2' nut2 by @sups;<br>
      sub slash by nut;<br>
      sub [nut2 nut] @FIGURES' by @sinf;<br>
      sub @sups2' nut by @sups;<br>
      sub @FIGURES' @sups2 by @sups;<br>
      sub @sinf @FIGURES' by @sinf;<br>
      sub @sups @sups2' by @sups;</p>
      <p>} frac</p>
      <p>***</p>
      <p>It uses scientific inferiors and superiors, rather than the larger numerators and denominators.</p>
      <p>The "nut" glyph is a horizontal bar for single-digit denominators.<br>
      the "nut2" glyph is a horizontal bar for double-digit denominators<br>
      @sups2 is an alternate set of scientific superiors with extra sidebearing width, to sit centred on top of double-digit denominators.</p>
      <p>The trick is negative sidebearings on the nuts. You can quote me on that.</p>
      <p>This works for fractions from 0/0 to 99/99.<br>
      It won't do "fractions" where the numerator is larger than the denominator, but those aren't fractions, are they? (although such larger values are used in ratios).<br>
      More complex nut fractions may still be made with this feature in InD, doing them as two separate fractions back-kerned together.</p>
