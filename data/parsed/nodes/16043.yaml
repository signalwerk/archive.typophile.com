      <p>Hrant, you misunderstood my post. I assume you are alluding to my question to the ATypI list. I posted that question specifically to see how foundries would respond. I already  knew the answer. To say I was surprise is wrong. I was basically just double-checking myself. I am not a lawyer. I have no hopes of becoming a lawyer. And, I don't mind asking what could be considered stupid questions in order to get a clear answer.</p>
      <p>Until recently, as it happens, there was a rather large foundry who's EULA did have a clause like that. I need to track down an old copy of it. But, they no longer do that.</p>
      <p>I have more flaws that that, Hrant. In fact, if that is a flaw I welcome it. As my other flaws are real flaws and need my attention more urgently.</p>
      <p>If anything in a EULA is unreasonable, then a person who <em>might</em> license the type has two choices. Don't license the type or call the foundry and see if there isn't another license they can purchase which would allow them to do what they need to do.</p>
      <p>On the other hand. If anything in a EULA is unreasonable, then a person who <em>has already</em> licensed the type has two choices. Use a different typeface or call the foundry and see if there isn't another license they can purchase which would allow them to do what they need to do. </p>
      <p>If someone enters into a business deal signing the contract thinking they might make changes to what they think is unreasonable I think they probably deserve whatever happens. If they choose not to enter into conversation before signing and work toward a more reasonable contract then I don't see why they deserve something more reasonable after the fact. </p>
      <p>Yes. <em>THAT</em> is me being hard-nosed. But, I firmly believe in conversation with the foundries before and after the fact.</p>
