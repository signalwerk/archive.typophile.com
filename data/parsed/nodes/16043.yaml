      <p><em>Ridiculous demands can be made when giving gifts, but not when the other person is paying for something.</em></p>
      <p>You have this completely backwards. A gift is something freely given and shouldn't have any conditions attached. When something is purchased, a contractual relationship exists, and it is precisely within such a relationship that conditions and demands may apply. In the case of fonts, it is precisely the license terms that are being purchased. They are, in fact, what is being bought: not the bits and bytes that make up the font but the terms under which it may be used.</p>
      <p>Why is it ridiculous for a EULA to say that using the font does not extend to decompiling it and examining the contents? Simply because tools happen to exist that enable this? Or simply because Hrant Papazian has decided that he thinks it is ridiculous?</p>
      <p>I don't have such a clause in any of my EULAs, but if I wanted to have one it would be my right to include it and your right to decline to purchase such terms of use. You have no right at all to purchase precise contractual terms and then just go ahead and take more for yourself. When what is being sold are usage rights, taking additional rights that you have not purchased is as much theft as using an unlicensed copy of a font. Digital media seems to have confused a lot of people about the nature of usage rights, but the model is really identical to that used for photography and traditional illustration. You are buying rights, not a thing that you can use however the heck you feel like using it. Tiffany's attitude is simply a normal professional one, and is not at all 'extreme'.</p>
