      <p>I almost hate to jump in on this, but I will. I can't recall ever seeing a "don't-look" clause in a font EULA, but I might have seen a "don't-reverse-engineer" clause, which is much more likely to be in any kind of software EULA (such as a font). Then it's a matter of interpretation as to whether opening an OT font in FontLab and checking out the OT code constitutes reverse engineering.</p>
      <p>That's why lawyers have jobs. Personally, I would like to say that it does not constitute reverse engineering as long as you are not trying to re-create the particular font with all of its OT behavior. But a lawyer's take may be very different.</p>
      <p>Regards,<br>
      tim</p>
