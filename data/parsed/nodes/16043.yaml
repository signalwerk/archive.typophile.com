      <p>Chris, Simon must have been talking about me.</p>
      <p>Recently Tiffany was surprised that people thought they should only abide by the EULA they purchased a font under, and not a stricter EULA that was implemented <cite>afterwards</cite>... I think that's extreme - as extreme as a person completely ignoring a EULA. That's all. Tiffany is a great person - but Chris seems to be inheriting one of her very few flaws!  :-)</p>
      <p>&gt; it never hurts to ask the foundry.</p>
      <p>When it's a gray area, I totally agree. When you want to get permission for something that the EULA forbids (and expect to pay $ for it) likewise. But to check that the font house doesn't actually mean something in the EULA? That seems dumb.</p>
      <p>The key concept here is Reasonability. I feel that's what's required most in human relationships. Making more money is not a Core Value to me. So let me ask: is it reasonable to expect a type designer (especially one doing a faithful revival for example) to pay out amounts to his sources of inspiration?* Likewise, anybody who expects to be able to place unreasonable clauses in a business agreement and get away with it is either nuts or needs to accept that what goes around comes around. Behavior is contagious. Humans are heuristic, while formalism (i.e. a EULA) is not - with the mismatch forcing us to choose between reasonable behavior versus parasitism.</p>
      <p>* Never forgetting that creativity never happens in a vacuum.</p>
      <p>Neither the vagaries of commerce nor the inspirational convenience of death remove an individual's responsability to treat his fellow man reasonably. Not selfishly.</p>
      <p>hhp</p>
