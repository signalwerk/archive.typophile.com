      <p>Font EULAs are not written for people like Chris, or Hrant or me. They're written for people like Tiffany - people who want to just get on and do their job, set text, embed fonts in PDFs, work from home or the road and in rare cases modify a font. </p>
      <p>So the EULAs won't adequately deal with the type of research that Chris would like to do. Asking the designer is the most ethical answer. But opening fonts in FontLab in the privacy of your own home and not bragging about it publicly is the most common. </p>
      <p>Type Designers aren't generally stupid, they know that FontLab and other tools reveal the inner-workings of their fonts, so you can't, with a straight face, claim these routines as a trade secret. No EULA is going to stop people from learning techniques in published fonts. Increasingly I think designers and foundries realize this and have become more open about sharing their ideas - this forum is a testament to that.</p>
      <p>That's not to say a unique approach or piece of OT code isn't protectable. If you don't publish the fonts just the results (the new PLINC project might fall into this bucket) then your trade secrets could be kept secret. Likewise, say if House felt that the Ed Interlock code was novel they could try for patent protection. But I just don't think putting a "don't look" clause in a EULA is helpful.</p>
    html_clean: |-
      <p>Font EULAs are not written for people like Chris, or Hrant or me. They're written for people like Tiffany - people who want to just get on and do their job, set text, embed fonts in PDFs, work from home or the road and in rare cases modify a font. </p>
      <p>So the EULAs won't adequately deal with the type of research that Chris would like to do. Asking the designer is the most ethical answer. But opening fonts in FontLab in the privacy of your own home and not bragging about it publicly is the most common. </p>
      <p>Type Designers aren't generally stupid, they know that FontLab and other tools reveal the inner-workings of their fonts, so you can't, with a straight face, claim these routines as a trade secret. No EULA is going to stop people from learning techniques in published fonts. Increasingly I think designers and foundries realize this and have become more open about sharing their ideas - this forum is a testament to that.</p>
      <p>That's not to say a unique approach or piece of OT code isn't protectable. If you don't publish the fonts just the results (the new PLINC project might fall into this bucket) then your trade secrets could be kept secret. Likewise, say if House felt that the Ed Interlock code was novel they could try for patent protection. But I just don't think putting a "don't look" clause in a EULA is helpful.</p>
