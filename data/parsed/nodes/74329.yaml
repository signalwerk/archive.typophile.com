    <p>Hello. I've been a long time lurker, so I've finally decided to join in and get advice. I've been into fonts ever since I was a kid, especially those from logos. I design my own by shaping them on PowerPoint and transferring the glyphs to High-Logic's Font Creator Program.</p>
    <p>Thus far I've done some modernized fonts based on the classic "Press Your Luck" logo; one is regular and the other is extended, but I have some fine-tuning to do (the corners of the letters are rounded or beveled, which I don't want). Ray Larabie is known for recreating fonts from logos, and though this is a parody in the same vein, do I need to seek legal permission before publishing the font?</p><div class="imageWrap"><img src="http://typophile.com/files/BigBox template_4539.png"></div><p></p>
