    html: <p>Usually a reference like that means "it's useful to see what others have done in this vein while you develop yours." Anybody who wants to say "this is too similar to another face to be worthwhile" will say so very explicitly. We can distinguish Helvetica from Aksidenz Grotesk around here, so apart from the odd troll it's very rare anyone expresses that conclusion. Maybe it's not super-original, but if you feel like doing it, let the market decide... You never know, someone could come in here tomorrow or years from now, like they do every day, and ask "I like Rekord and Orbitron but neither is quite what I need for what I'm doing; I want something <em>really really square.</em> What do you recommend?"</p>
