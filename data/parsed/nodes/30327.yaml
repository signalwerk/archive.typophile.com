      <p>&gt;crashes everytime it encounters a bad font file.</p>
      <p>There are many shades of gray between 'good' and 'bad' fonts, most fonts are in between, and even the definition of 'good' is open to interpretation. So finding the fonts that crash the app may not be that easy.</p>
