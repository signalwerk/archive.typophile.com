      <p>Stephen, I haven't read the Suitcase manual cover to cover of anything but I think you can only print out one font per page when printing specimen pages in Suitcase, right?</p>
      <p>I've been using FontDoctor for the past day, since I posted this original message. It's a slow, slow process but hopefully it'll fix things so at least FontVista won't crash.</p>
      <p>Would anyone here know the reason why FontVista would print the default font (an Arial-looking thing) instead of displaying the real font on specimen pages? This is happening with about 5% of my fonts, including all my Emigre fonts. I checked the font folders and both the PostScript and bitmap files are in there. Until I hear back from FontVista tech support or find an answer here it's all a mystery!?</p>
      <p>Organizing/fixing fonts for nearly 20 hours now and counting,<br>
      K.</p>
