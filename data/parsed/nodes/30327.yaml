  html: |-
    <p>I have spent an embarrassing number of hours today printing out type specimen pages.</p>
    <p>The utility I'm using, FontVista, crashes everytime it encounters a bad font file. I've been collecting fonts since 1992-- so needless to say, it's been crashing a lot!</p>
    <p>I would like to find some automated way to scan and trash these bad font files. I've been trying to use Suitcase Fusion for the task but, to my knowledge, it only scans and identifies (albeit cryptically) corrupt files. I then have to search my hard drive for the suitcase name, e.g. "BTDem" and "RegNor" and hope it turns up. Blech! There's got to be an easier way! If you know of any, please share your wisdom. Thanks!</p>
    <p>-K.</p>
