      <p>They look custom to me: Look at the different middle bar length of "E" vs "EE" or "F" vs "FF".<br>
      That said, I think the <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Lastwaerk%20black%20-%20Regular&amp;fid=8c33214e72492c66d8c8b9f2ea43dbd5&amp;fsize=60&amp;text=CDEFS&amp;fit=1" rel="nofollow">Lastwaerk black/bold</a></strong> free font by  Johan Aakerlund could be a good substitute + some customization on the wide letters.</p>
      <p>"SPECIAL" looks close to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Bitstream&amp;ffam=Alternate%20Gothic%20No.2%20AT%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=e42ced4cd85141d3ccb04bbafcfad17a&amp;wrap=2&amp;text=SPECIAL" rel="nofollow">Alternate Gothic No.2</a></strong></p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
