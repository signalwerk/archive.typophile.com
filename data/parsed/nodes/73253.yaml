    <p>Hi,</p>
    <p>Could someone be so kind to recommend Didone typefaces that are able to compete with HTF Didot in both style and quality? I love HTF Didot, but cannot use if for the project I am working on.</p>
    <p>As a reference, I have attached both a page from Vogue Living Australia which I think uses HTF Didot (please correct me if I am wrong), and a cover of Living etc. which seems to use another kind of a Didone typeface - any ideas what that could be? This is the style and context I am thinking about. </p>
    <p>I am interested in any possible links and I am also keen to hear from any recent releases of the kind.</p>
