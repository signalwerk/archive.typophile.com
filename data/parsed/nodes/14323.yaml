  html: |-
    <p>Hey everyone. Does anyone know the name? ESPN magazine’s typeface, the one with the number 3 looking lower case “e”. It’s on the cover of ESPN magazine digital (<a href="http://www.espnmag.com">www.espnmag.com</a>).</p>
    <p>The second one is the text face for DETAILS magazine. Also used all uppercase on the cover.</p>
    <p>Any help will be greatly appreciated. Thanks!</p>
