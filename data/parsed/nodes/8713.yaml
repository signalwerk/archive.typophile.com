  html: '<p><b>Veer Announces: 30 Exclusive New Typefaces From Device</b> <br> <br>Veer is pleased to announce the exclusive debut of <a href="http://www.veer.com/products/gallery.aspx?gallery=265&amp;vendor=det&amp;resultsperpage=36">30 new typeface families</a> from Device - a.k.a. designer-typographer Rian Hughes. In celebration of the tenth anniversary of the Device foundry, this collection of versatile fonts has been expanded in an explosion of new display types. <br> <br>Rian Hughes studied at the LCP in London before working for an advertising agency, i-D magazine, and a series of record sleeve design companies. Under the name Device, he provides design and illustration for the advertising, entertainment, publishing, and media industries. In between assignments, he adds to his phenomenal stable of typeface designs. He has an extensive collection of Thunderbirds memorabilia, a fridge full of vodka, and a stack of easy listening albums which he plays very quietly. <br> <br>The <a href="http://www.veer.com/products/gallery.aspx?gallery=265&amp;vendor=det&amp;resultsperpage=36">30 new Device typeface families</a> are currently available exclusively through Veer. <br> <br>The following examples offer a glimpse into the range of these new typefaces. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63189.gif" alt="Sparrowhawk"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000237">Sparrowhawk</a> by Rian Hughes <b>{ Device </b>} <br> <br>A capitals only titling face, evoking a suburban English gentility. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63190.gif" alt="Monitor"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000223">Monitor</a> by Rian Hughes <b>{ Device </b>} <br> <br>An early experiment in TV-wall pixeldom, and has the unique property <br>of becoming easier to read the further away one gets. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63191.gif" alt="Miserichordia"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000222">Miserichordia</a> by Rian Hughes <b>{ Device </b>} <br> <br>Evolved from photographs taken on a trip to Venice. It instigated a <br>sharp turn left into more idiosyncratic and decorative serif fonts,  <br>something of a new direction for Device. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63192.gif" alt="Yolanda"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000241">Yolanda</a> by Rian Hughes <b>{ Device </b>} <br> <br>An elegant family of three weights each more florid than the last. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63193.gif" alt="Gusto"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000220">Gusto</a> by Rian Hughes <b>{ Device </b>} <br> <br>Three related variants that go from hot-dog to melted chocolate, <br>a gastronomic combination not to be passed up (or thrown up). <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63194.gif" alt="Dauphine"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000211">Dauphine</a> by Rian Hughes <b>{ Device </b>} <br> <br>An elegant caps and small-caps typeface that manages to be modern  <br>while still displaying perfumed good breeding, and comes with a <br>leafy decorative variant. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63195.gif" alt="Moonstone"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000224">Moonstone</a> by Rian Hughes <b>{ Device </b>} <br> <br>For all those misunderstood goth Buffy fans. Really. <br> <br>............................................................................................................................................ <br> <br><img src="http://www.typophile.com/forums/messages/72/63196.gif" alt="Chantal"> <br> <br><a href="http://www.veer.com/products/typedetail.aspx?image=DET0000210">Chantal</a> by Rian Hughes <b>{ Device </b>} <br> <br>Originally designed to letter the RoboHunter series that Peter Hogan <br>and I produced for 2000AD in 1993. At the time it famously elicited <br>letters from readers who found it hard to read, but looks surprisingly <br>friendly in its old age. <br> <br>............................................................................................................................................ <br> <br>For more information regarding these new type products, contact: <br> <br>Jacqueline Wallace <br>403 313 4942 <br><a href="mailto:media@veer.com">media@veer.com</a></p>'
