    <p>Hello,</p>
    <p>I'm in the process of replacing one element in a set of three fonts - headline font (Clarendon), bodycopy font (ITC Typewriter) and a tertiary font (custom face) used for highlighting. In this case the headline font Clarendon is the one for replacement.</p>
    <p>Attached are some headline fonts I'm considering. I'd love tips/feedback, thanks.</p>
    <p>Left: Clarendon, Geometric Slabserif 703 BT  Extra Bold, Goudy Heavyface<br>
    Right: Oxtail Black, Ziggurat Black<br>
    Add'l note: Both secondary and tertiary fonts are fixed.</p>
