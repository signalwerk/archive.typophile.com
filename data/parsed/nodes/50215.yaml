    html: |-
      <p>Since you're going with a slab serif for both the headline and body text, I'd recommend using ones with similar letterforms, but with contrasting weights. Ziggurat Black has a two storey 'a' and binocular 'g' like American Typewriter. It looks the best to me, although it's really up to you.</p>
      <p> - Lex</p>
