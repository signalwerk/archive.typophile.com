  html: |-
    <p>Since Lion is out today, I think I need to repeat that if you upgrade your OS, none of our products except Fontographer will work. This is not something I'd like to say, but it is how it goes.</p>
    <p>Your options are:</p>
    <p>1. Do not upgrade your OS.<br>
    2. <a class="freelinking external" href="http://bit.ly/fontlabbetaaplication" rel="nofollow">Join FLS beta.</a> I don't know if subscription is available at this moment, but it is worth trying.<br>
    3. <a class="freelinking external" href="http://www.fontlab.com/front-page/welcome/mac-os-x-10-7-lion-compatibility.html" rel="nofollow">Read this document</a> and get the Lion Compatibility Pack for any of our products. </p>
    <p>You can get much more info in this document: <a class="freelinking external" href="http://www.fontlab.com/front-page/welcome/mac-os-x-10-7-lion-compatibility.html" rel="nofollow">http://www.fontlab.com/front-page/welcome/mac-os-x-10-7-lion-compatibility.html</a> by Adam.</p>
