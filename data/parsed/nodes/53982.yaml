    html: |-
      <p>Г - horizontal line is too long.<br>
      Ћ - same as above.</p>
      <p>Л - is not correct, check <a class="freelinking external" href="http://commons.wikimedia.org/wiki/File:Cyrillic_L.png" rel="nofollow">here</a> for more info.<br>
      б - is falling to right.<br>
      з - is not correct, doesn't goes into descender.<br>
      И - is doubtable.<br>
      D - is not Cyrilic, it should be Д.</p>
      <p>Main "problem" is that your Cyrilic version is not neither Regular neither Italic version  Cyrilic alphabet, it's some mixture. Check <a class="freelinking external" href="http://commons.wikimedia.org/wiki/File:Cyrillic-italics-nonitalics.png" rel="nofollow">this.</a></p>
      <p>Find some Cyrilic font and analyze it.</p>
