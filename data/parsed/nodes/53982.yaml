    <p>Some of you may be aware of my handwriting typeface "Comic Jens", which <a href="http://www.kutilek.de/download/comic-jens.zip" rel="nofollow">can be downloaded freely</a> and is released under a Creative Commons licence. I tried to capture my handwriting by using the mouse to draw with the brush tool directly in FontLab.</p>
    <p>After visiting St Petersburg last fall, I decided to add Cyrillic support to the fonts. I tried to follow the same "rules" as I had done in the Latin alphabet, i.e. the lowercase forms are rather cursive, but non-connecting. That means that some of the Cyrillic lowercase letters changed their form drastically compared to the upright printing forms.</p>
    <p>Is this readable at all, or should I better stick to the upright forms? Are there any letters that just don't work? Any other comments?</p>
    <p>Many thanks,<br>
    Jens</p>
