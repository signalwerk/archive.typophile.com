      <p>Robofont has a number of third-party plugins and—not to toot my own horn—a plugin that I wrote to install them: <a href="http://robofontmechanic.com" title="http://robofontmechanic.com">http://robofontmechanic.com</a></p>
      <p>Scripting has been a part of digital type design for a long time, the new wave editors are both modular to different degrees.</p>
      <p>A different question is when we'll get graphic design tools that work this way…</p>
