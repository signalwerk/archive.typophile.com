      <p>Somewhat a "my font too" post - and late - but hopefully of interest ;-)</p>
      <p>A year ago I released a font whose italics looks almost exactly the same (if you straighten them up ;-):<br>
      <a href="http://www.luth.no/default.asp?Searchstring=Jacobs+Sans&amp;side=fontprisliste" title="http://www.luth.no/default.asp?Searchstring=Jacobs+Sans&amp;side=fontprisliste">http://www.luth.no/default.asp?Searchstring=Jacobs+Sans&amp;side=fontprisliste</a></p>
      <p>Incidentally this (my) font is used for the logo of the official Norway pages for norwegians (norge.no &amp; noreg.no) whereas Aeroportal is used on all official Norway pages for foreigners (like norway.com).</p>
      <p>These two fonts have been developed independantly by two different norwegians, so this look must really be norwegian in its soul ;-).</p>
      <p>The web pages/designs were also done by two different design companies...</p>
      <p>Puzzled.</p>
      <p>Jacob</p>
