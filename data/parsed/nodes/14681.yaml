      <p>I'm pretty late here, but I anyway: I designed the Aeroportal font for The Norwegian Ministry of Foreign Affairs for their official communication on <a class="freelinking external" href="http://www.norway.info" rel="nofollow">Norway – the official site</a>. Norway.com is not by the MFA, but they are somehow allowed to use it. The font is an original design and was developed before GE Inspira. <a class="freelinking external" href="http://norway.designmanual.no/screen/typography/" rel="nofollow">More info here</a></p>
      <p>It's funny that your design is so close to mine, Jacob - and that your client is also pretty close to mine.</p>
