  html: |-
    <p>The European market is being swamped with forged Viagra pills. The clipping from a photo seen in today's Heidelberg newspaper shows that the font for typesetting "Pfizer" was forged too.</p>
    <p>see <a href="http://www.sanskritweb.net/temporary/viagra.jpg">www.sanskritweb.net/temporary/viagra.jpg</a></p>
    <p>(to the left: original, to the right: forgery)</p>
    <p>By the way: The word "Viagra" is a "forgery" of the Sanskrit word "vyaghra", which originally denoted "he who smells scents by opening his jaws" (Manfred Mayrhofer).</p>
