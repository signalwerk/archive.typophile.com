      <p>This is a font indicating the extend of fonts forgery / cloning done by many companies, as it can be found under the following names and corresponding copyright:</p>
      <p><strong>Cocktails </strong>- Copyright  1986-1995 SWFTE International, Ltd<br>
      <strong>Beatsville</strong> - Copyright 1991, Atech Software, Carlsbad CA<br>
      <strong>Beatsville Regu</strong> - Converted by ALLTYPE<br>
      <strong>Beatsville</strong> - Generated by Metamorphosis Professional 2.03<br>
      <strong>Kwirky</strong> - Digital typeface data Copyright (c) 1993, 1996 Weatherly Systems, Inc<br>
      <strong>Ginsberg</strong> -<br>
      <strong>Stranglehold 1 / Stranglehold 2</strong> - Cambridge Fontworks<br>
      <strong>Magoo</strong> - ©1995-2001 Arts &amp; Letters Corporation<br>
      <strong>KwiKwitSSK</strong> - Copyright 1995 Southern Software, Inc.<br>
      <strong>Onedin</strong> - (C) 1994 Brendel Informatik GmbH</p>
      <p>I really don't know which and if any of them is an original and/or legitimate design, so please be careful if you are going to use any of them in a commercial project</p>
