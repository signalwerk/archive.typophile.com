    html: |-
      <p>He is more than likely going to need an OpenType font. Type 1 Postscript fonts had to "lie" about the character name for anything not in the standard encoding vector, and of course, used glyph names rather than Unicode. TrueType fonts are a bit different, but older ones may not have the correct Unicode for superscripts in the font. I mention this because when someone has characters in a separate "expert" font, they usually did so to get around the hard-wired encoding of Quark &amp; older Macs &amp; PCs.</p>
      <p>If Sophisto is not now an OpenType font, I'm sure Mr. Hattenbach could make up a release to do what is needed.</p>
      <p>I believe the later issue of Palatino TT (Linotype) has all the lowercase alpha characters as superiors. I don't know of any font that has uppercase superiors. One could be made, of course.</p>
      <p>Hope this helps</p>
