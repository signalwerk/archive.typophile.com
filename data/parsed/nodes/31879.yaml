      <p>Thanks Stefan, the request is for a friend, he didn't mention what style he wanted, but has since gotten back to me and said Sophisto looks perfect.</p>
      <p>He needs it for embedding into a flash file (something to do with superscript not working natively in flash so he needs to use a font with superscript characters as part of the regular character set).</p>
      <p>I'm a bit ignorant when it comes to flash, and he's just asked me:</p>
      <p>"<em>I need to test that it'll work with standard unicode in XML</em>"</p>
      <p>I guess he's talking about the characters being part of the standard unicode set rather than 'extras' stuck in to spare unicode slots, so he should be alright I think...?</p>
