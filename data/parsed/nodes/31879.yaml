    <p>Hi all.</p>
    <p>Does anyone know of a font that has a full compliment of superscripted characters in it's glyph set?</p>
    <p>Most (including all the Adobe Pro fonts I've looked at) only seem to have a, b, d, e, i, l, m, n, o, r, s, t.</p>
    <p>Thanks!</p>
