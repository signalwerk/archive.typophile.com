    <p>Hi Everyone,</p>
    <p>I’m looking for a script font for a “Dear Diary” project I’m working on for a “Kids at Risk” center, the text needs to look as if written by a confused troubled teenager, complex (not elegant) but still flowing, perhaps a hybrid of <a class="freelinking-external" href="https://web.archive.org/web/20081011165634/http://www.fontshop.com/fonts/downloads/itc/itc_mistral/?sample_text=I’m%20just%20trying%20to%20escape%20for%20a%20few%20hours%20–%20that’s%20all.%20Don’t%20judge%20me%20–%20you%20don’t%20know%20how%20messed%20up%20everything%20is.%20&amp;sample_size=18">Mistral</a> and <a class="freelinking-external" href="https://web.archive.org/web/20081011165634/http://www.fontshop.com/fonts/downloads/creative_alliance/amadeo/?sample_text=I’m%20just%20trying%20to%20escape%20for%20a%20few%20hours%20–%20that’s%20all.%20Don’t%20judge%20me%20–%20you%20don’t%20know%20how%20messed%20up%20everything%20is.&amp;sample_size=18">Amadeo</a>, preferably in Opentype so that alternates would give it more authenticity. </p>
    <p>Already tried posting <a class="freelinking-external" href="https://web.archive.org/web/20081011165634/http://www.typophile.com/node/44202">here</a> but no luck so far, please help!<br>
    Thanks.</p>
