      <p>Standing is better than sitting, but frankly I'm a bit dubious about that first study mentioned. Standing provides very minimal exercise, and it certainly isn't the kind of aerobic exercise that benefits the heart. I wonder if maybe the study just found a correlation, rather than an actual cause-and-effect relationship.</p>
      <p>If the two groups in the study were identical in every respect other than the frequency of standing, the only medical connections I can see offhand might be 1) a possible reduction in blood clots that can be caused by long periods of sitting (deep venous thrombosis), or 2) a reduction in pressure ulcers (often called "bed sores") which are caused by remaining in the same position for long periods of time, and can sometimes lead to more serious health problems, especially with folks who already have health problems (elderly, diabetic, paralyzed, etc).</p>
      <p>Don't get me wrong, standing is a good idea. I'm just a bit dubious that standing, by itself, can be statistically linked to a reduction in cardiac disease.</p>
