      <p>Over a decade ago, I put my drafting table on risers, made the surface flat, and put my monitor on it. I use a Steelcase task chair (a desk chair that rises higher than a regular desk chair). So, I can sit or stand. I prefer standing.</p>
      <p>My dad had his first bypass at 53. It was a quadruple. He's the first commercial airline pilot in the U.S. ever to be allowed to fly again after multiple bypass surgery. At 77, he had another bypass--this time a double with a valve replacement. At 82, dad's still going strong, flying sailplanes, which he began at age 70.</p>
      <p>My mom smoked for 47 years, then in 1996, woke up 3 days in a row with pain in her chest. My dad told her it was her heart. She said it couldn't be, because she'd always had low cholesterol and clear x-rays. But on the third day of waking up like that, she had my dad take her to the hospital. The admitting physician said, "Well, you don't usually have had pain like that without some damage to the heart, but I'm not a cardiologist." After a cardiologist ran tests, he said, "I don't know how you did it, but you beat the odds. No damage to your heart, but you have one artery blocked 90%, and one 55%." Angioplasty took care of it. My mom asked how it is possible for her to have great cholesterol numbers, but have blockage. The doctor replied that they hadn't connected the dots yet, but had a staggering amount of information pointing to a link between smoking and heart disease in people with good cholesterol. Remember, this was '96--they probably have it figured out now.</p>
      <p>We all have to go some time from some cause, butwhy rush it, or make the quality of our own lives less than what it could be? That said, I suppose we all have our vices, too. I like ice cream a little too much.</p>
