      <p>&gt; My mom asked how it is possible for her to<br>
      &gt; have great cholesterol numbers, but have blockage.</p>
      <p>A friend of mine recently had a near-fatal heart attack even though at his last checkup his cholesterol levels were okay and he'd passed a stress test.  </p>
      <p>His doctor said that screening tests like checking cholesterol, having a stress test, etc. are very useful but are not 100% reliable as predictors.</p>
      <p>I believe the only definitive test for blockages is a coronary catheterization, which is an invasive procedure done in a hospital, and is normally not used unless a serious problem is suspected.</p>
