      <p>I'm glad to not have a drivers license and car. This means I have to do a lot more walking or cycling. This a blessing really, cause it gives me time to think, get out of the house and get some exercise. Moving at a human speed gives me a lot less stress and just means I have to take time to do things, which is good. </p>
      <p>I often sit behind my computer, but i do notice that does not do me good, especially when the work is inneffective. My hands and feet get cold, my eyes get strained, generally feeling rather stiff. It is really hard to develop a new idea behind my computer. It is much better to see it as a tool for realising ideas, rather than getting them, though sometimes time pressure forces me too.</p>
      <p>I love to get out and go for a walk for 1-2 hours, it just clears my head, gets the blood flowing, fresh air... I can recommend it to everyone!</p>
