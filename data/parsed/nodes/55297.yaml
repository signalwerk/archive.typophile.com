      <p>It's a bad idea. In Windows, application menu captions are written in a way that ampersands precedes the letter that gets the menu keyboard shortcut assigned. So if the source code of the application says "&amp;Open" and "S&amp;ave as...", the menu will have "O" in <em>O</em>pen and "a" in "S<em>a</em>ve as" underlined, and those letters will work as keyboard shortcuts. </p>
      <p>Depending on how cleanly a programmer has written the code, it may happen that the same is applied to font names displayed in the menu. So if you name your font "Black&amp;White", the user may actually see "Black<em>W</em>hite" with "W" underlined, which will obviously be nonsense.</p>
    html_clean: |-
