      <p><cite>How about switching “&amp;” for “and” in file names only?</cite></p>
      <p>Don’t use special characters (or spaces) in file names. The sorts of reserved uses that Adam described for Windows menus can also apply to other areas of programming. Operating systems might handle them, but I’ve run into software that was not coded to anticipate filenames with special characters or spaces and starts misbehaving. It gets especially bad once the files end up on a CD/DVD, where the mastering software may not be capable of dealing with nonstandard filenames but will burn something to disc anyway, without ever raising an error.</p>
    html_clean: |-
