    html: |-
      <p>It is <em>probably</em> okay, but not officially recommended. I'm not aware of any situation in which it would break, but that doesn't mean that there isn't some piece of software out there with an in-built assumption that all font names contain only A-Z and a-z.</p>
      <p>We took the risk many years ago, including numerals in a font name (Garamond 1530) and didn't run into any problems, but I noticed that even fairly recently when Adobe were experimenting with naming optical masters by explicit size they spelled out the numbers, e.g. 'ten' instead of '10'.</p>
      <p>Once, when mastering a large set of fonts for a client, I came across # in a font name, and my recommendation to the client was that we should get rid of this. One simply doesn't know what problems a character like # or &amp; might cause.</p>
      <p>So I'm not necessarily saying that you should play it safe, but if you wanted to play it safe, you would avoid &amp;.</p>
