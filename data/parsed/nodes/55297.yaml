    html: <p>Definitely avoid unless there is a *VERY* compelling reason to use it and/or you enjoy doing tech support. All punctuation and non-ASCII alphabetics should be avoided, really, as many of them are reserved or have special meaning in different contexts (i.e. '/', '\' in filesystems, '&amp;', '&lt;', '&gt;', ';' and others in HTML, etc.).</p>
