    html: |-
      <p>I just wanted to reiterate not to use &amp; in the font name, meaning the file names, postscript name and whatever name will be seen by the system. Such special characters in Linux often make life more difficult on the command line. The ampersand, for instance, stops the command at that character, and puts whatever was called into the background. One can always remedy this by writing \&amp; for &amp;, but it always is frustrating to have to go through long internet addresses and pick out the special characters, for example.<br>
      Also, in Xe(La)TeX one has to declare the font in the document using the full name installed on the machine. An ampersand here would be seen as a misplaced alignment character, and I would just have to hope that \&amp; would remedy it.</p>
    html_clean: |-
