      <p>Just a thought...</p>
      <p>Since the Hungarumlaut bears a direct relation not to the Acute but to the Umlaut, then why not form a variation on the Umlaut rather than attempting to somehow fit two (full) Acutes into this impossibly confined space?</p>
      <p>The Hungarumlaut is a rather modern invention after all. I don't think that it has enough "tradition" to definitively determine what the best presentation under such circumstances should be. I doubt though that anyone would frown on you, if you attempt to be a bit innovative with this diacritic.</p>
      <p>JMHO.</p>
