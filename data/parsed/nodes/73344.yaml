    html: |-
      <p><em>what's the story about the hungarumlaut relating to the umlaut rather than the acute? Deducing this from the name alone seems like wonky logic to me; in Hungarian the thing isn't called hungarumlaut of course, but something like «double accent» AFAIK.</em></p>
      <p>The deduction was based on an analysis of what acts on what. The acute (at least in Hungarian) is used to extend certain vowels, while the umlaut alters the sound properties of its base vowel. The hungarumlaut does not extent the sound of the base vowel, but of the umlaut(ed) one. Although it shares the lengthening properties of the Acute, it <em>acts</em> specifically and uniquely on the umlaut alone. A hungarumlaut can be viewed therefore as a version or form of the umlaut. Ő is a "version" of Ö in the same way that Á is a version of A (it is in fact a representation of AA).</p>
      <p>This view is hardly science, and is clearly open for debate. Perhaps a linguist could step in and shed some light on the linguistic and phonological conventions that are involved.</p>
      <p><em>Could you say a bit more about that?</em></p>
      <p>The fact is that the great Miklós Kis never used the hungarumlaut. In fact, according to <a class="freelinking external" href="http://www.font.hu/hrant.html" rel="nofollow">this</a> informative page, the hungarumlaut wasn't used in print with any degree of consistency until around the 19th century. So yes, typographically speaking that would make its common use in print a recent phenomena. Also note that various printers over the years have used alternative diacritics to mark the extended umlaut, and no one stoned them for typographic blasphemy.</p>
      <p>The bottom line of my argument though was simple; when faced with certain technical and physical constraints, there could and should be room to exercise some typographic ingenuity and find alternative ways to mark sounds, and in this particular case the extended umlaut. </p>
      <p>Typography is not written in stone but on paper</p>
