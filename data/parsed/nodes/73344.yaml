    html: |-
      <p>This group of diacritics (i.e. single and double acute accents) in Hungarian is called 'hosszú ékezet' and they usually signify where the 'long' version of the standard phoneme is to be pronounced instead of the short one (except for 'a' and 'e' where the 'long' version is in fact a different vowel). That is to say, phonetically speaking hungarumlauts as well are longer versions of their respective short counterparts and thus could be thought of as elongated umlauts. (This is only true of the 'ö-ő', 'i-í' and 'ü-ű' pairs however, as in the case of 'o' and 'u' (and uppercase 'I') you don't have any diacritical marks to begin with.)</p>
      <p>As to the aesthetic issue, I find low angle acutes rather outlandish.</p>
