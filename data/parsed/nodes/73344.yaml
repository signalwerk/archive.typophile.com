      <p><cite>"I doubt though that anyone would frown on you, if you attempt to be a bit innovative with this diacritic"</cite><br>
      I would love to hear about this from Hungarians. FWIW I had a Hungarian acquaintance (a layman regarding type) check my own hungarumlauts (although that was in lowercase, in a text font) and got a strong reaction that hungarumlauts which do not match the angle of the acute look «wrong». Hungarian does use acutes as well, so the two would appear next to each other.</p>
      <p>BTW, what's the story about the hungarumlaut relating to the umlaut rather than the acute? Deducing this from the name alone seems like wonky logic to me; in Hungarian the thing isn't called hungarumlaut of course, but something like «double accent» AFAIK.</p>
