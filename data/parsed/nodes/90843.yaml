      <p>Andreas, I think you've answered a slightly different question from the one RadioB was actually asking. </p>
      <p>RadioB: in the style you've described, I'd say <em>don't</em> have a fixed size for the note cues, but match them to the surrounding text style. Keeping them at 11pt in a run of 9pt text would make them stand out too much. But, are you wedded to the [x] style? Do you feel that regular numerals with superscript formatting applied to them would be too weak/thin? If so, and you've got a bolder weight available, see what bold superscript numerals look like.</p>
