    <p>Hello, </p>
    <p>I have dozens of micro-typography books but I always seem to<br>
    run into problems that are not mentioned in any of them,<br>
    anyway that's what typophile.com is for I guess. </p>
    <p>I'm typesetting a book that has a lot of notes, a few of these<br>
    notes come up in text that is smaller(9pt) than the main text(11pt)<br>
    because they are in the middle of a poem or quoted article. I am not using<br>
    superior figures because the typeface (Sabon) only has 1,2 and 3 what i am<br>
    doing instead is using linear figures between brackets [x].</p>
    <p>ok my question is: when a note comes up in the 9pt text, should i have<br>
    the [x] the same size as the main text or the size of the text it is<br>
    used with...basically should the [x] always be 11pt or should it change<br>
    when used with 9pt text?</p>
    <p>thank you</p>
