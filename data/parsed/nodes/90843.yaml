      <p>Even better than Nick's idea, don't use Sabon at all. It was made for a reason back in the days of hot metal. That reason no longer exists. It happened to work very well with the Linotype photocomp machines, but was never dialed in with any of the PostScript versions. Then Linotype came along &amp; made a "next" version, which isn't Sabon -- just another Garamond.</p>
      <p>If you're using InDesign, IIRC, you got Garamond Premier (Pro) for free with one of the versions. As far as Garamonds go (and Sabon is one), it's one of the best. It is also published by Adobe, so the EULA lets you go into the font and tailor it to you needs, if you have the skill. Use the regular if you're going to print on uncoated stock, consider the medium if printing on a coated sock.</p>
      <p>I don't know if Nick makes a Garamond; anyway, my point is these days, there is not much in a name when it comes to revivals. Very few of them were handled with aplomb; they were just rushed out to boost sales. (O.K., I'm a curmudgeon).</p>
      <p>But if you're stuck, why use Garamond semi-bold numbers scaled down? Use the superiors from, say, Garamond Premier or one of the other fonts.</p>
