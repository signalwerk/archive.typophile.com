      <p>For the past 30 years, we've always followed the policy that there is one size for note calls, whether they occur in a chapter title, text, or extract. I *think* that is Chicago; it may go back to either Oxford or Cambridge style though. It is not universal, just one style.</p>
      <p>(This also points out the stupidity of having a *numbered* footnote with a chapter title.)</p>
      <p>The other thing we have done since PostScript arrived is, EULA permitting, made up true-cut superior figures specifically for note calls. As you say, text-size figures scaled down are too thin. They also won't kern right, as when following a quotedblright, period, comma, etc. etc. The bold will be too heavy; you might just get away with a semi-bold.</p>
      <p>If you can't find the right weight in Sabon, try one of the other Garamonds in a semi-bold, or even a Garamond with true-cut superiors. You can do a lot of fiddling with character styles in InDesign. Get it right once; you're done for the book, except for the kerning. Grep can help you there.</p>
