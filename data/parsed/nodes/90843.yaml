      <p><cite>If you must use Sabon, JFP's version is supposed to have<br>
      been designed while skirting the old technical limitations.</cite></p>
      <p>hrant, is your tongue firmly in your cheek? </p>
      <p>[Aside: RadioB, the whole point of Sabon was to create a family that overcame technical restrictions of hot metal, particularly Linotype with its duplexed mats. The commission to Tschichold was to make a font family where text printed from Monotype, Linotype, and foundry fonts all looked the same. It didn't, of course, in part due to how hard it is to even out the printing impression with type from a linecaster.</p>
      <p>In spite of that goal, the Stempel, at least in larger sizes, had the italic on a different body than the roman.  I used that design as a basis for our PostScript fonts when Sabon first came out -- Adobe publishing, of course, to allow modification. I do believe that the PostScript Linotype release got even gappier in the italic, as if someone used the narrower characters on the old roman setwidth. And the lower-case roman "c" was screwed up, as well.] </p>
      <p>* * *</p>
      <p>As a *compositor,* I can't abide any of JFP's fonts -- modifications never permitted. You can get the old Sabon published by Adobe; modifications permitted. There was also a PostScript Sabon published by somebody based on the old Monotype photocomp artwork, which had different f-ligatures -- but in the end it was no better than the (older) Linotype Sabon.</p>
      <p>Garamond has been much abused in both photocomp and PostScript, &amp; I finally decided for us, anyway, that Adobe Garamond was a decent modern reinterpretation, and Garamond Premier the most faithful to older metal, when printed offset. YMMV. All these are from the "Garamond" Garamonds, not the "Jannon" Garamonds. But that's another story...</p>
