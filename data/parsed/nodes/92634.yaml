    <p>We welcome the very talented Alisa Nowak and her <a class="freelinking external" href="http://www.type-together.com/Eskapade%20Fraktur" rel="nofollow">Eskapade</a> to TypeTogether's family.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Eskapade-Fraktur-2_6336.gif"></div><p></p>
    <p>The <a class="freelinking external" href="http://www.type-together.com/Eskapade%20Fraktur" rel="nofollow">Eskapade</a> family is the result of research confronting Roman and German blackletter forms, mainly fraktur letters. The idea is to adapt these broken forms for a contemporary use instead of creating a faithful revival of a historical typeface.</p>
    <p>On one hand, <a class="freelinking external" href="http://www.type-together.com/Eskapade%20Fraktur" rel="nofollow">Eskapade</a> is conceived for continuous text in books and magazines with a good legibility in smaller sizes, and on the other hand Eskapade directs the readers attention in headlines with its mixture of round and straight forms, like in ‘e’, ‘g’ and ‘o’. It can also be used for visual identities, logotypes and packaging.</p>
    <p><a class="freelinking external" href="http://www.type-together.com/Eskapade%20Fraktur" rel="nofollow">Eskapade Fraktur</a> is more contrasted and slightly bolder than the usual darkness of a regular weight. The innovative <a class="freelinking external" href="http://www.type-together.com/Eskapade%20Fraktur" rel="nofollow">Eskapade Fraktur</a> italic, based on the Cancellaresca script, is secondarily influenced, especially the capital letters, by the Sütterlin forms. A unique script practiced in Germany in the short period between 1915 and 1941.</p>
    <p>Although there are many typefaces in the fraktur style available, only a few of them include true italic forms. Those are more slanted uprights though, rather than proper italics. This motivated and made extensive experimentation with the italic shapes possible and resulted in some unusual and interesting solutions.</p>
    <p>In addition to standard capitals, <a class="freelinking external" href="http://www.type-together.com/Eskapade%20Fraktur" rel="nofollow">Eskapade Fraktur</a> regular and italic offer a second set of more decorative capitals with double-stroke lines for ampliflying experimental use and creative application.</p>
    <p><strong>more information:</strong> <a href="http://www.type-together.com/Eskapade%20Fraktur" title="http://www.type-together.com/Eskapade%20Fraktur">http://www.type-together.com/Eskapade%20Fraktur</a></p>
