    <p>So I saw this font in AIGA's 50 Books of 1962 book.<br>
    The title of the book cover that includes the font is "41st Annual of Advertising &amp; Editorial Art &amp; Design"  </p>
    <p>It's very similar to Didot, but the 4's are very different.  The closest 4 I've found is Bell MT.</p>
    <p>Please help!</p>
