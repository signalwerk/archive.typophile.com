      <p>I'm still banging at this and investigating other fonts, those whose ligs work in Word 2010 and those whose don't.</p>
      <p>One that does NOT work in 2010 but does work in other programs (InDesign CorelDRAW) is Times New Roman. Opening that TTF in FontLab I don't see the fi and fl ligature substitution in the liga feature.</p>
      <p>Is there some other feature from which the other programs might be getting that substitution?</p>
      <p>Just looking for clues.</p>
      <p>Thanks,<br>
      Ken</p>
