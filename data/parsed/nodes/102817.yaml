    html: |-
      <p>Yep, it was the absence of the DSIG table.</p>
      <p>As mentioned in the below post I used TTX to decompile and added the exact "dummy" DSIG that is on this page and presto, I had ligs. There is a very succinct excerpt from another Microsoft page on this page that describes things. Basically for Windows to recognize the font has having OT features it needs to have a DSIG table.</p>
      <p><a href="http://typophile.com/node/90383" title="http://typophile.com/node/90383">http://typophile.com/node/90383</a></p>
      <p>Thanks for answering Charles, nice to hear from you again. You likely don't remember but you saved my bacon a couple of times on this very forum when I was first getting into OpenType.</p>
      <p>Interesting point about the rlig, however, from the things I've found and reiterated here it sounds like NO OpenType features work unless the DSIG is present, and its now Word that's doing it but the operating system.</p>
      <p>Thanks again!<br>
      Ken</p>
