      <p>TNR has a dlig feature, which Word apparently doesn't use, but InDesign and CorelDraw DO use.</p>
      <p>Someone on FontLab's site suggested adding a dsig feature to font as Word contains a bug that needs a dsig to ligatures. I've seen info where that was needed for kerning to work but hadn't heard of it for the ligatures. Will give that a shot and post back for anyone who's interested.</p>
