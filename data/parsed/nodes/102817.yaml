    <p>Hello All,</p>
    <p>We have a font that we've created that has a standard liga feature in it that doesn't work in Word 2010. The ligatures work in InDesign CS3 and CS6. Only Word 2010 won't play nice.</p>
    <p>Any ideas as to what might cause this?</p>
    <p>Many thanks,<br>
    Ken</p>
