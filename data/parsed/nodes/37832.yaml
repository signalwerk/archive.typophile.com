      <p>Message to 'elms':</p>
      <p>Thanks for your feedback re. the second option.</p>
      <p>In response to your question, ‘why are you disrepecting the very thing you are trying to promote?’</p>
      <p>Firstly as Sharon pointed out, I didn't design the Christianity Explored logo, and it is not currently up for change, as I mentioned in my original post. But even if I had designed it, I would have no problem with representing the cross like that. I think most Christians would agree it does not disrepect the Lord Jesus to show the cross at an angle, or even 'falling down'. The Lord Jesus himself fell down whilst carrying his cross to be crucified. We Christians believe it was the most amazing act of courage and self-sacrificial love this world has ever seen. And according to Jesus' own words in the Bible (John chapter 3 verse 16 to 36, for example), the way to disrespect him is not by how we visually represent his cross, rather it is to continue in unbelief, refusing to turn from our sin and accept him as Lord and follow him. I did that for many years myself, until 3.5 years ago he saved me by his amazing grace. Check out <a href="http://www.needgod.com" title="www.needgod.com">www.needgod.com</a> / <a href="http://www.twowaystolive.com" title="www.twowaystolive.com">www.twowaystolive.com</a> for further information. May he bless you too, in his name, Carl.</p>
