    <p>Hi all</p>
    <p>The Christianity Explored logo is established and has been in use for some years now, so that’s not changing any time soon (to my knowledge).<br>
    However, the strapline ‘Time to Discover’ is a new addition.</p>
    <p>In order to bring some 'relational' warmth to the CXP logo, we've attempted to go down the handwritten route. What do you think of these three routes?</p>
    <p>- First option is using a font, 'SF Scribbled Sans' - a free download from 1001fonts.com.</p>
    <p>- Second and Third options are (digitally) handdrawn with Wacom and Illustrator CS3</p>
    <p>Your feedback (positive or negative), would be much appreciated.</p>
    <p>Thank you,</p>
    <p>Carl</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cxp_ttd_example_3584.jpg"></div><p></p>
