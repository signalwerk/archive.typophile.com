    <p>I'm currently designing a logo for a performings arts/non-profit foundation called Low Key Arts. I've hit a complete dead-end on the last word of the logo. The words 'low' and 'key' are done in G-type Houschka Pro. 'Arts' is done in Candida which I can hopefully find an alternative to. I'm having a lot of trouble fitting the 'arts' around the bottom of the 'y'. That's mostly the source of my frustration. Any help might turn out being a big help. -thanks<br>
    <a href="http://tinypic.com?ref=2aake3l" target="_blank" rel="nofollow"><img src="http://i53.tinypic.com/2aake3l.jpg" border="0" a=""></a></p>
    <p>PS - Don't mind the spacing -- I'll fix it later.</p>
