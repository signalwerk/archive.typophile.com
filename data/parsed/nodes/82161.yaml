      <p>It might be interesting just to try this and see what you think:</p>
      <p>Move the "ow" over and up so that the top of them are aligned with the top of the "L" and the "o" is actually on the inside of the "L" (if that makes sense). Then change the word "key" to the font that you are using for "arts" (similarly in all caps), and try "arts" in the font that you used for "low", but italic. It might not work, but it might be interesting if the italic of the "a" is the same angle as the "y."</p>
