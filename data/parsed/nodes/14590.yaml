    <p>Hi,<br>
    I am working on a font based on my handwriting and have included instructions for ligatures for the typical ffi ffl etc and also for er ar to ...letters that I normally join in my handwriting.<br>
    However the font includes modern greek and polytonic greek...and I want to include some ligatures for a few joined letters in modern greek.<br>
    For instance how would I include the substitution for epsilon and iotatonos by glyph FB10 (which at this point is also named fb10)?<br>
    I put in the opentype instructions initially using VOLT. When I opened the font in Fontlab there was also a feature called zz01 this basically includes all the same info as the liga feature which also appears. Is this extra feature needed for liga to work?<br>
    feature zz01 {<br>
     # Latin<br>
     language zz01 exclude_dflt;<br>
        sub a r by FB05;<br>
        sub e r by fb06;<br>
        sub f f i by ffi;<br>
        sub f f l by ffl;<br>
        sub f f by ff;<br>
        sub f i by fi;<br>
        sub f l by fl;<br>
        sub l l by fb07;<br>
        sub t h by fb08;<br>
        sub t o by fb09;<br>
        sub a y by fb0a;<br>
        sub t i by fb0b;<br>
        sub a u by fb0c;<br>
        sub t y by fb0d;<br>
        sub o u by fb0e;<br>
    } zz01;</p>
    <p>I have also tried to use class based kerning using the instructions with fontlab but when I create the font and try to test the kerning the only letters which kern are the initail ones used to set up the kerning group. Am I missing something in settings? Currently in my font there are 1922 kerning pairs, is this extreme?</p>
    <p>Any help in any of these areas would be very greatfully received.<br>
    Thanks<br>
    Neil</p>
