      <p>Neil, </p>
      <p>1.  I recommend adopting a proper glyph naming scheme rather than ad-hoc names like “fb06”. Read more here:<br>
      <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
      <p>2. When FontLab decompiles an OpenType font with features created in VOLT, it sometimes needs to add the “zzXX”. This does not mean these features are in the font. Due to the nature of the Adobe FDK for OpenType source notation (.fea) used in FontLab’s OpenType panel, certain features cannot be directly expressed in the source notation as is. This is a limitation of the current version of the Adobe FDK for OpenType that is likely to be improved in the future. </p>
      <p>Relying on the OpenType feature notation decompiled by FontLab from an existing font is not recommended. The decompilation works in many cases, but it surely does not represent 100% preciseness. </p>
      <p>Regards,<br>
      Adam</p>
