    html: '<p>David, nice refs. <br> <br>I would also add the caps of Octavian, since they do borrow the good from the classical widths, but are not afraid to improve things (like the "S"). Caps are essentially lapidary (not calligraphic), and Will Carter and David Kindersley were stone/wood cutters, which explains why their caps are the most graceful and effective, I find. <br><a href="http://www.myfonts.com/FontStyle11493.html" target="_top">http://www.myfonts.com/FontStyle11493.html</a> <br> <br>Meridien is also interesting in this regard: <br><a href="http://www.myfonts.com/CharacterMap10477.html" target="_top">http://www.myfonts.com/CharacterMap10477.html</a> <br> <br>hhp</p>'
