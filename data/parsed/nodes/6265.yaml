    html: <p>Hi Darren, <br>I haven't logged on for a while either and it did suprise me to that this discussion grew so quickly.  <br>I do not know your personal history, but if this your first real font indeed, *chapeau!!*, as the french would say (which means that I took my hat off in admiration!!).  <br>It is one the best first fonts I've seen. Even during my studies in Holland. The good thing about the font is not only its quality, but it reflexes your love, interest and willingness to design type!! Which is often difficult to find. <br> <br>I am curious about your serifed version. Because in your font the ending are very typical and therefore pretty important for its character. And that is where later on the serifs will be! <br> <br>About the textface issue. Guys, we live in 21st Century! Last century some designers proved us, sansserifs can be used and designed very well as textfaces! </p>
