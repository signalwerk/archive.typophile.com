    html: "<p> I'm always tempted to remind that any real text face has serifs, but I stop myself, thinking: \"there's more to life than readability\" - as long as the designer knows what functionality he's sacrificing for some \"stylistic\" gain. It's hard to know if Darren intends this to be a text face (and frankly that almost doesn't matter: the hardest part of making a text face is \"simply\" convincing others that it's a text face!), although some things (like the OS nums) seem to indicate that. It could still be as adequate for text as all those other nice sans designs we see from good designers - but sure, a serif version would be doubly sweet. <br> <br>BTW, but WTF (PTL) is \"WWMCD\"? <br> <br>hhp </p>"
