    votes: null
    html: <p> I agree with Joe here. <br> <br>In general I agree with the common notion that good text faces tend to be serified, but I also point out that there are several excellent exceptions to this rule. Franklin Gothic, Helvetica, Univers, Bureau Gothic, Officina, Meta, Gill Sans, Radiant, Syntax, and Scala Sans (among many others) are all examples of serifless faces that work well for setting some text applications. <br> <br>No font, serifed or serifless, works equally well for setting all text applications. <br> <br>If we have learned anything typographically in the 20th century, it is that to talented designers, the long-held rules of typography must be both followed and broken. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">  <br> <br>Remember also that Carter's "snap-on serifs" were an experiment in themselves; classic serifs were designed into the font from day one, never designed as an afterthought to be snapped on after the fact. <br> <br>In my view, Iris stands alone as a well-designed (and evolving) sans-serif face, and that direction should be seen through to the end. A serifed version can come later. <br> <br>Watching this one grow with much interest, <br> <br>David </p>
