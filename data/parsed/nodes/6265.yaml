    html: "<p> Andy, thanks for reference. Barnes and Noble doesn't have it, but Borders does. I'll check it out. <br> <br>Now that I think about it, Letterhead Fonts and others (Font Diner's Milwaukee, I think it's called) have a similar concept, that is fonts that you build by layering two fonts together. Walker seems like its the first to do this with self-contained serifs. <br> <br>This is something I'm going to experiment with surely because I want to find out 'how' to do it and because the font is 'private', that makes it more interesting. It may be uncommercial but all work and no play makes jack a dull boy, eh? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> (That's just a reference to an American movie, The Shining w/ Jack Nicholson, no hidden meanings or anything.) <br> <br>re, the serifs: A readability question. Why do serifs help us recognize words better?  Growing up, kids see a lot of san-serifs, especially when they are learning 'lettering' in first grade. Does anyone have a short answer? </p>"
    html_clean: "<p> Andy, thanks for reference. Barnes and Noble doesn't have it, but Borders does. I'll check it out. <br> <br>Now that I think about it, Letterhead Fonts and others (Font Diner's Milwaukee, I think it's called) have a similar concept, that is fonts that you build by layering two fonts together. Walker seems like its the first to do this with self-contained serifs. <br> <br>This is something I'm going to experiment with surely because I want to find out 'how' to do it and because the font is 'private', that makes it more interesting. It may be uncommercial but all work and no play makes jack a dull boy, eh? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> (That's just a reference to an American movie, The Shining w/ Jack Nicholson, no hidden meanings or anything.) <br> <br>re, the serifs: A readability question. Why do serifs help us recognize words better?  Growing up, kids see a lot of san-serifs, especially when they are learning 'lettering' in first grade. Does anyone have a short answer? </p>"
