  - id: 44278
    user: 591
    date: 2002-01-04T11:38:00
    date_raw: 4 Jan 2002 — 11:38am
    votes: null
    html: <p> Thanks Hrant <br> <br>I totally see your comments - I actually looked at the lc 'k' and 'm' today and thought the same. I didn't see the w being too wide though, but I shall revisit it and make amendments - the point about the middle part being lowered I understand and will investigate. <br> <br>The UC does have a problem with its proportions which I think comes from me being a total (but hungry) novice. The colour imbalance is again a problem which I feel stems from both my 'beginner' approach and my relative inexperience with the software - they looked fine on paper! I do need to make a decision as to their proportions. <br> <br>The numerals are a first draft and the '6' and '9' do need opening up I agree. Thanks for the positive comments - I was a little nervous as the previous lining numerals were awful, and I wasn't totally sure about these ones - although I felt they were a lot better than their predecessors. This is pretty much the first time they have all been put together with the other characters. <br> <br>The accents again are 'work in progress' and do need some tweaking. The 'ring' does need some weight adding to it.  <br> <br>The 'ae' glyph has gone a little crazy - I just looked at the paper based drawing and on that I had removed the a's stem - quality control a little lax there! The comments about the other characters I will take on board when I make some amendments. <br> <br>Thanks very much for your input - your comments are greatly valued. <br> <br>I'll post a revision up as soon as it's ready. <br> <br>Cheers <br> <br>Darren </p>
