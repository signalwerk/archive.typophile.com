    html: "<p>Darren: <br> <br>I hope you're going to include BOTH lining and old-style numerals, as they each have their place. Old-style numerals, in general, are best for text settings, of course, but lining numerals are generally preferred for headlines and tabular columns. With a versatile font like this one, the inclusion of both types of numerals would be most appropriate. <br> <br>Hrant mentioned most of the suggestions that I noticed (and a few that I thought were fine as they are, but I'll be interested to see how you incorporate them anyway... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ). <br> <br>As far as your upper-case proportions, take a look at: <br> <br>Adobe Trajan (<a href=\"http://www.myfonts.com/FontFamily4465.html\" target=\"_top\">http://www.myfonts.com/FontFamily4465.html</a>), <br> <br>Adobe Charlemagne (<a href=\"http://www.myfonts.com/FontFamily1163.html\" target=\"_top\">http://www.myfonts.com/FontFamily1163.html</a>) or <br> <br>Adobe Penumbra (<a href=\"http://www.adobe.com/type/browser/P/P_907.html\" target=\"_top\">http://www.adobe.com/type/browser/P/P_907.html</a>) <br> <br>for comparison. These are some excellent examples of \"old-style\" upper case proportions. <br> <br>Great work so far! <br> <br>David</p>"
