  - id: 144985
    user: 1203
    date: 2001-11-06T05:29:00
    date_raw: 6 Nov 2001 — 5:29am
    votes: null
    html: "<p> Darren, <br> <br>This has the potential to be a great and highly versatile typeface. Ironically, it reminded me of Erik Spiekermann's faces (Officina, Meta), but I too can see the similarities with Hubert Jocham's faces now that the resemblances have been pointed out. <br> <br>I would echo all of the suggestions so far, and add a couple of my own: <br> <br>1. As Ricardo mentioned about the lc \"a\" being a bit condensed, you may want to look at all of the letters' widths in relation to one another. The proportions seem slightly off (lc \"v\", \"w\" and uc \"V\" seem a bit wide, while lc \"a\", \"k\", \"m\", \"n\", \"u\", \"y\", uc \"J\", \"K\", \"M\", \"P\", \"R\" and \"W\" seem narrow). <br> <br>2. You may want to try bringing the vertex of the lc \"y\" down closer to or slightly below the baseline. This may help balance the body with the tail, and also may help balance its width with the other characters. OR, as an alternative to this, try widening the angles of the two strokes just a bit. Or maybe a little of both. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>3. I agree that the lower case set seems lighter than the upper case and figures sets. I like the look of the weight of the upper case and figures, so I would suggest making the lower case slightly heavier. <br> <br>I really like the design of the lc \"a\". And I find the differing terminal cuts on the uc \"K\" and lc \"k\" to be really interesting. It would be interesting to see you apply the same terminals to some other characters, such as uc \"R\", uc \"X\" and lc \"x\". <br> <br>I'm looking forward to seeing this face evolve. <br> <br>David </p>"
