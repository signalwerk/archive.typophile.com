    html: "<p> Darren congratilations and welcome with this very  interesting sans serif  which I think that have very potential !!.  I like very much this kind of  forms. I  would so want to make some suggestions: <br> <br>1 &gt; The the capitals and figures have more impact than lowercase letters. <br>2 &gt; The c/l and l/c ( Ss ) the spine are too contrast that the others letters, like the caracthers ( MNQZz ). <br>3 &gt; The letter l/c ( a ) is little too condensed that the others I think. <br> <br>But I think you are going in the right way, the work have very good apperence! <br>Do you have more letters to show? <br>Regards and good work to finnish the work. <br> <br>Ricardo </p>"
