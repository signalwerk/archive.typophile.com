    html: <p> Darren, <br> <br>Welcome to the forum, and thanks for participating!  At risk of repeating Ricardo's critique, it appears that the face (at least at this magnification) has varying stroke weights within the letters. This creates dark spots in letters like the S. I will make this request, howver- can you set some words and/or phrases in the face? Sometimes it helps to see the overall color and rhythm of the face to effectively critique it. And oftimes, variation and nuance within the face itself can really bring the type to life. </p>
