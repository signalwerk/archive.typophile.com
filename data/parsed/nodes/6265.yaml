    html: "<p>? <br>Unless I'm going blind, the only thing in there pertaining to widths is: \"All glyphs in proportionally spaced typefaces have advance widths that are dependent on their proportional design.\" <br> <br>---- <br> <br>I think the decision of which way to go for a given design (converge the widths or diverge them) is a very interesting question, especially when it comes to caps (in a text face at least lc forms need to be so functional as to strongly favor divergent widths). I personally like divergent UC widths even in designs that many people would probably advise to go convergent (like maybe this one). I'm not really sure why, and I don't really have a feel of where to draw the line. <br> <br>It might help to look at good examples: what are some fonts where the choice was obviously good (Charlemagne?), versus designs that some of us might find difficult to agree with, like the [otherwise?] wonderful Richler: <br> <br><a href=\"http://www.shinntype.com/Assets/Richler_Specimen.pdf\" target=\"_top\">http://www.shinntype.com/Assets/Richler_Specimen.pdf</a> <br> <br>hhp</p>"
