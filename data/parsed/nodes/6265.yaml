  - id: 44277
    user: 1250
    date: 2002-01-04T10:32:00
    date_raw: 4 Jan 2002 — 10:32am
    votes: null
    html: "<p> I think your lc is looking great, except: <br>1. The \"k\"'s upper arm is/seems too long. <br>2. The \"m\"'s counters seem unequal. <br>3. The \"w\" is too wide. I know it's tempting to make it two \"v\"s (I've done that myself), but it's better to make the strokes less inclined; you might also consider stopping the middle part before it reaches the x-height - it helps readability. <br> <br>For your UC, I like most of the forms individually, but I think you have an important -and equally challenging- decision to make: do you want all the caps to approximately converge in width (the \"contemporary\" approach), or do you want them to diverge (like in \"old style\" fonts)? The latter I myself prefer, even in designs like this, not least because it makes all-caps setting much less unreadable. Right now it seems your caps are somewhere in between the two approaches, and I think that's a problem. Also: there's still some color imbalance, although a GIF is a terrible place to judge that - you really have to go lino before you can be confident of the color (especially as mass text). <br> <br>Numerals: very nice, except for the joins of the \"6\" and \"9\" being tucked in too much - note how nice and open your \"8\" is. Your \"7\" is killer. I might make the zero rounder. <br> <br>Accents: they seem unfinished, at least in terms of placement. I'd just say that your ring might be a little too light, and you could raise the umlauts a bit, esp in the lc. <br> <br>I'd make the \"ae\" one glyph: flatten the top of the \"a\"'s bowl to unite the strokes; get rid of the \"a\"'s stem at the baseline. The slashes on your \"O\"/\"o\"/cent are too steep. The Yen's top bar is clotting. The dollar looks unbalanced - but to be honest I actually like to encourage ugly dollarsigns. <br> <br>hhp </p>"
