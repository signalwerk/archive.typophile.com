    html: "<p> &gt; Readability in the future would make a nice discussion topic <br> <br>Totally. I think -like you implied- it depends a lot on display technology. LCDs are becoming standard, which means ClearType-style technology will be a big factor, but also I think there's room for more hand-crafting of bitmaps, very much so in grayscale. <br> <br>&gt; no hidden meanings or anything <br> <br>Yeah, right (you obsessive, ax-wielding font freak). <br> <br>&gt; Why do serifs help us recognize words better? <br> <br>It's hard to keep it short (especially when one has to first dismiss a bunch of traditional but laughable theories - like the one that says they help guide the eye like train tracks... gimme a break, linespacing already does that 100 times better, thank you very much), but I see it as two-pronged: <br> <br>1. Serifs help distinguish one glyph from another (to varying extents). <br> <br>2. Serifs help glyphs coalesce into boumas (word shapes), instead of standing out individually. Kind of like why tight spacing helps readability, noting that if you space a sans too tightly the counters overpower the inter-letter spacing (ruining the distribution of color in a bouma), while in a serif face the serifs start touching (facilitating the coalesce thing) before that happens/needs_to_happen. <br> <br>This is in addition to the familiarity factor (which some people however over-rate). <br> <br>hhp </p>"
    html_clean: "<p> &gt; Readability in the future would make a nice discussion topic <br> <br>Totally. I think -like you implied- it depends a lot on display technology. LCDs are becoming standard, which means ClearType-style technology will be a big factor, but also I think there's room for more hand-crafting of bitmaps, very much so in grayscale. <br> <br>&gt; no hidden meanings or anything <br> <br>Yeah, right (you obsessive, ax-wielding font freak). <br> <br>&gt; Why do serifs help us recognize words better? <br> <br>It's hard to keep it short (especially when one has to first dismiss a bunch of traditional but laughable theories - like the one that says they help guide the eye like train tracks... gimme a break, linespacing already does that 100 times better, thank you very much), but I see it as two-pronged: <br> <br>1. Serifs help distinguish one glyph from another (to varying extents). <br> <br>2. Serifs help glyphs coalesce into boumas (word shapes), instead of standing out individually. Kind of like why tight spacing helps readability, noting that if you space a sans too tightly the counters overpower the inter-letter spacing (ruining the distribution of color in a bouma), while in a serif face the serifs start touching (facilitating the coalesce thing) before that happens/needs_to_happen. <br> <br>This is in addition to the familiarity factor (which some people however over-rate). <br> <br>hhp </p>"
