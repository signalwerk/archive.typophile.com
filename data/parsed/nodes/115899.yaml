    <p>Hi,</p>
    <p>As described, am I trying to figure out what font in the title is used of<br>
    the VHS version of Disney's Sleeping Beauty.  As far as I know is this the only version where  a more distinct Gothic typeface is used.</p>
    <p>In the url  a sample:</p>
    <p><a href="http://www.catawiki.com/catalog/dvd-video-blu-ray/carriers/vhs-video-tape/974049-sleeping-beauty" title="http://www.catawiki.com/catalog/dvd-video-blu-ray/carriers/vhs-video-tape/974049-sleeping-beauty">http://www.catawiki.com/catalog/dvd-video-blu-ray/carriers/vhs-video-tap...</a></p>
    <p>Before I contact the Disney Studio's themselves or Buena Vista Home Entertainment (if they still exist), I want to ask you guys.</p>
    <p>Thanx in advance!</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Old English Text        </div>
            </div>
    </div>
