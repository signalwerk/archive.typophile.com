      <p>On my mac (Office 2011, Consolas version 5.22), all glyphs in Consolas have width 1126 except the following (obtained from a ttx output with <code>grep '&lt;mtx' Consolas.ttx | grep -v 1126</code> and then some clean up):</p>
      <pre>    "afii299" width="0" lsb="-36"
          "afii300" width="0" lsb="-431"
          "afii301" width="0" lsb="-219"
          "afii61664" width="0" lsb="-36"
          "glyph00002" width="0" lsb="0"
          "uniFEFF" width="0" lsb="0"
      </pre><p>
      As for NULL, it is called <code>uni0000</code> according to ttx but Fontforge and DTL OT Master give me some different information... Hmm.</p>
      <p>And as for proper documentation, if you find any, please tell us.</p>
      <p>PS. <a href="http://levien.com" rel="nofollow">Raph Levien</a>'s font <a href="http://www.levien.com/type/myfonts/inconsolata.html" rel="nofollow">Inconsolata</a> defines no NULL character.</p>
