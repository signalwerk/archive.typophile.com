  html: |-
    <p>I put the pre-alpha (but very usable for low enough resolutions) version of monospaced scalable variant of Unifont font to <a class="freelinking external" href="http://ilyaz.org/software/fonts" rel="nofollow">http://ilyaz.org/software/fonts</a>.</p>
    <p>It is constructed by a scanner/stroke-designer backend running over the 16×8, 16×16 bitmaps of Unifont.  The scanner/designer are written in Perl; the scanner is ready, the designer 70% ready.   (Of course, it turned out to be a much more complicated task than I expected at the start — 6 months ago!)<br>
    The frontend converting strokes to a font is EXTREMELY primitive (cooked in a day, and hitting new and new bugs in FontForge — sigh…).  So I'm afraid any critique at this moment would be very premature…<br>
    I'm hitting my head again and again with <code>.notdef</code>; it does not work in Windows console if I include U+0000 and U+0001 glyphs.  So currently I just omit these glyphs — is there any alternative?  The recommendations in <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/recom.htm" rel="nofollow">http://www.microsoft.com/typography/otspec/recom.htm</a> are not very helpful: how can one include <code>.null</code> into a monospaced font?<br>
    Any help with this would be greatly appreciated.</p>
