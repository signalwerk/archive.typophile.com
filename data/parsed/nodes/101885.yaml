      <p>Concerning <code>glyph00002</code>, the sfd file produced from Consolas on my mac gives this:</p>
      <blockquote><p>StartChar: glyph1<br>
      Encoding: 1 -1 1<br>
      AltUni2: 000000.ffffffff.0<br>
      Width: 1126<br>
      GlyphClass: 2<br>
      Flags: W<br>
      LayerCount: 2<br>
      EndChar</p>
      <p>StartChar: glyph2<br>
      Encoding: 2 -1 2<br>
      Width: 0<br>
      GlyphClass: 2<br>
      Flags: W<br>
      LayerCount: 2<br>
      EndChar</p>
      <p>StartChar: uni0009<br>
      Encoding: 3 9 3<br>
      AltUni2: 0000a0.ffffffff.0 000020.ffffffff.0 00000d.ffffffff.0<br>
      Width: 1126<br>
      GlyphClass: 2<br>
      Flags: W<br>
      LayerCount: 2<br>
      EndChar
      </p></blockquote>
      <p>and <code>glyph00002</code> is simply <code>glyph2</code>.</p>
      <p>The <code>uni0000</code> produced by ttx must come from <code>AltUni2: 000000.ffffffff.0</code></p>
      <p>And concerning <code>uniFEFF  ZERO WIDTH NO-BREAK SPACE</code> it has width 1233 in DejaVuSansMono.ttf version 2.33.</p>
