      <p>Thanks, John! The question remaining is: what you say, is it just “common knowledge”,  or is it documented somewhere? What I was quoting was the cited MS's document; one does not expect it to be even close to being perfect, but it would be nice if one knew something more authoritative, and still kind of comprehensive.</p>
      <p>I do not say that your word is less authoritative than the MS's document; it it just that what you say is one (or two) tidbits at a time ;-).</p>
      <p>Please bear with me, this is my first foray into non-bitmap world….  Of course, in what I released every char is of the same width — I just was not sure which card bits which when different recommendations are concerned.  ― And note that in Consola 000D has width 0, contrary to “consoleness” — which for me implies being monospaced; and the recommendation above says that 000D should be non-0 width….</p>
