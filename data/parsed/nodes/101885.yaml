    date_raw: 31 Mar 2013 — 6:08pm
    votes: null
    html: |-
      <p>Maybe I just cannot find the magic incantation in FontForge.  If I use the sequence <code>.notdef/0002/0003/0004/0005/</code>etc, everything works OK.  Inserting glyphs named <code>0000/0001</code> after .notdef makes the glyph <code>0000</code> used instead of <code>.notdef</code>.</p>
      <p>Consolas has</p>
      <blockquote><p>
      StartChar: .notdef<br>
      Encoding: 65536 -1 0<br>
      Width: 1126</p>
      <p>StartChar: glyph1<br>
      Encoding: 0 -1 1<br>
      AltUni2: 000000.ffffffff.0<br>
      Width: 1126</p>
      <p>StartChar: uni000D<br>
      Encoding: 13 13 2<br>
      Width: 0</p>
      <p>StartChar: space<br>
      Encoding: 32 32 3<br>
      AltUni2: 0000a0.ffffffff.0<br>
      Width: 1126
      </p></blockquote>
      <p>which, on the surface, is contrary to M$ recommendations: CR should have non-0 width, second glyph should be named .null and it should have 0-width.  Moreover, M$ says that a console font should be monospaced — but above CR has width 0….</p>
