      <p>Update to my initial post:  <a class="freelinking external" href="http://ilyaz.org/fonts" rel="nofollow">http://ilyaz.org/fonts</a> — now it contains the <strong>really</strong> working versions of the fonts (it was not so a year ago!).<br>
        •  3 flavors of the de-rasterized Unifont (latest, so it contains the full BMP of Unicode 6.3); including:<br>
        •  DejaVu with missing glyphs overlaid from Unifont (glyphs massaged to match DejaVu better);<br>
        •  Versions which work in Windows’ console, and versions for more flexible environments;<br>
        •  Now useful at, I would say, pixel sizes 8–40.</p>
      <p>Additionally, I put there a fixed version of George Douros’ Symbola v7.12.  A PREP table is added, so that it shows now nicely even in GDI applications on Windows.</p>
      <p>Enjoy,<br>
      Ilya</p>
