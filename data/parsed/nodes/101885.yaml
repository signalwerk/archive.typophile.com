    date: 2013-04-01T10:38:00
    date_raw: 1 Apr 2013 — 10:38am
    votes: null
    html: |-
      <p>In a monospaced font, *all* glyphs should have the same advance width, and this overrides other recommendations such as that which says NULL should be zero-width. If a monospaced font contains glyphs that do not share the common width, it can cause major problems, because software tends to cache the width value for monospaced fonts.</p>
      <p>Note also that the proper name of this glyph is NULL, not .null. The only glyph in a font whose name begins with something other than A-z is .notdef.</p>
