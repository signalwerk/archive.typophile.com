      <p>I've attached a new iteration. Here's the changelog:<br>
      - Tried a different approach to main headlines.<br>
      - For the standfirst, as much as I would like to use Chaparral's opticals, unfortunately they're not included with Adobe CS3. I tried the non-light italic. Better colour?<br>
      - Aligned footnotes to the bottom, eliminated any other alignment with the baseline.<br>
      - Slightly wider space between text and reference numbers of notes.<br>
      - Also applied Semibold to reference figures and made them a tiny bit smaller than text.<br>
      - Proper superscript figures for in-text reference figures (too small?).<br>
      - Tweaked a bit more the dreaded text box at page 4.<br>
      - Reduced space between bullets and text, used bold bullets, also moved a bit to the right.<br>
      - Used small caps for bibliography's authors. Decided against lining figures, especially because of small caps ;-)</p>
      <p>As for David (archaica)'s suggestion about placing notes above bibliography, it sure make more sense (the notes pertaining to the main text, etc.), but I preferred to leave the more visual clue of notes always being placed on bottom right.</p>
