      <p>I like the color of the standfirst better this way. It has lost some delicacy, which I guess is what you used the Light Italic for, and which maybe the Subhead optical could have retained. But given the constraints, I prefer the new version. Again, this assumes offset printing. For digital printing, where type tends to gain weight rather than losing it, the Light might be OK. </p>
      <p>The reference numbers in the text for the notes look much better. However, noting your concern about "aging readership", if you think they're too small you could cheat by using the numerator figures rather than the superscript figures. They're a little bigger and lower but will still be easily understood by any reader as superscripts.</p>
