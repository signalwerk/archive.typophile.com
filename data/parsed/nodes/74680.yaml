      <p>Thank you very much for the comments so far. They’re very thoughtful and helpful, and I will try to implement the suggestions as soon as possible.<br>
      Juergen: Do you think I should reduce the white space between headline and body too? As for typeface with more character, I see what you mean, but our titles tend to be on the longish side, with very long words (things like “esternalizzazione” or “tossicodipendente”) and that’s one of the reasons why I choose Myriad Condensed. But maybe a Smaller size Chaparral can work.<br>
      As for footnote references, you’re absolutely right. And that will teach me to trust more my eyes and less measurements. I think I will need to find a way to align the reference numbers to the right (see page 5, for example).<br>
      John: I too would prefer ragged right for footnotes. Problem is, I’m not very good at tweaking hyphenation &amp; justification settings, and, with the defaults, ragged text has many more line breaks than justified text.<br>
      As for the Myriad text, you’re right. I need to find a different solution for boxed text, and use Myriad Condensed just for real tabular data and headings.<br>
