    <p>As it happens, one of the jobs that pay my bills is laying out a journal on welfare and social policies published twice a month by a no profit research institute.<br>
    The journal is entering its fortieth year of continuous publication, and, while studying how to deal with the “death of print”, we would also like to refresh its printed appearance.<br>
    My goal is to add some white space/flexibility and some typographic niceties (such as proper small caps and old style numerals).<br>
    Constrains are mostly due to a next to inexistent budget (cram as much text as possible per page, use only already available fonts) and a mostly aging readership (don’t make the text too small).<br>
    Attached there’s a first draft of the revised layout.<br>
    Any kind of criticism is welcome.</p>
