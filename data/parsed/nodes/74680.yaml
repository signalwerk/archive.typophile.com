    html: |-
      <p>Frode: <cite>Why number the notes with old style figures? Think hierarchy!</cite></p>
      <p>Perhaps this is a European vs. Anglo-American difference. It looks odd to me because the first line of the note as a whole, including its number, forms a single element of text, and varying figure styles within that element seems inconsistent without actually conveying anything to the reader. I probably wouldn't use lining figures for the note numbers unless the notes used lining figures altogether.</p>
