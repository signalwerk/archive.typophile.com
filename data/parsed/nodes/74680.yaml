      <p>This is a nice design for this sort of publication. I think it reads well while being very efficient and professional in appearance. However, the color of the standfirst looks a little light to me, especially if this will be printed offset. Is it Chaparral Light Italic? With the extra leading there, you may find Italic Subhead (non-Light) to give better color.</p>
      <p>I agree with Frode about the leading - the heads seem a little out of rhythm with the text, especially when they fall at the top of a column. And I would suggest using oldstyle figures for the numbering of the notes in the margin and agree with R. that it would be better to use true superscript figures (lining) for the note reference numbers in the text. In the bulleted list, the space between the bullets and their text is a little large, relative to the size of the bullets. Perhaps move the bullets to the right some? Also, I would probably put nota 12 above the bibliografia.</p>
