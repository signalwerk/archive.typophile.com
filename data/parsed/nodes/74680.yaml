      <p>Good improvements. Some more suggestions:</p>
      <p>Firstly, I would keep the figures a bit further away from the footnotes. You might almost double the space that is there right now.</p>
      <p>Secondly, I suggest using the proper OpenType superscript figures that come with Chaparral (at least with the version I have licensed) for reference numbers. In the footnote formatting options, you will have to set the position to ‘Normal’ and apply an appropriately defined character style.</p>
      <p>Thirdly, small caps would probably look good in the ‘Bibliografia’ for the names in front of the brackets and contribute to structuring the list. Maybe you want to try lining figures in this section, which tend to look less busy.</p>
