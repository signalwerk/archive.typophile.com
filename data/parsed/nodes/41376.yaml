    <p>Sorry if this is slightly off topic for the site, skip it if you want to - </p>
    <p>Q: If you have a Master Sheet and you update it can you get the text boxes to automatically snap to the new guides? If it is possible can you describe how to do it or point to where it says? I have been hunting around but to no avail. Maybe because I am a InDesign Newbie. Or it may be that what I want InDesign to do it doesn't do. If it can't that would be good to know too. Thanks in advance!</p>
