      <p>Hi Eben!<br>
      Yes, your keyword is ‘Layout Adjustment’ (at least that’s what it’s called in ID CS2).<br>
      The InDesign Help is pretty expedient on this.</p>
      <p>Furthermore, the basics of this function are explained in ‘InDesignSecrets Podcast Podcast 053’ (<a href="http://indesignsecrets.com/podcast-053-transcript/" rel="nofollow">Transcript</a> – quite to the end of the episode).<br>
      F</p>
