    votes: null
    html: <p>Have you tested that, Chris? I’m pretty sure that this isn’t 100% true. IIRC, you can make use of Layout Adjustment even if you didn’t check ‘Master textbox’ when creating the document. You need a Master Sheet with guides –&nbsp;or margins, of course.</p>
  - id: 254331
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 26 Jan 2008 — 6:35am
    date: 2008-01-26T06:35:00
    votes: null
    html: |-
      <p>If you have master text frames on your Master page and adjust them, the corresponding frames on the document pages will change accordingly, as long as you have not manually adjusted the text frame on a document page, thereby breaking the Master's control over it.</p>
      <p>If you're talking about individual text frames on document pages (not created via or governed by any master text frames), then Florian's tip about Layout Adjustment is the way to go. Read up on it in the Help: it's not a magic bullet. But it is intended to do the sort of thing that I think you're asking about, as long as your initial conditions are right.</p>
      <p>-- K.</p>
