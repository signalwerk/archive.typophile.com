    <p><img src="http://www.latofonts.com/wp-content/uploads/2014/04/640x500xLatoSavesBillions-640x500.png.pagespeed.ic.p9Cb7WpGbh.png"><br>
    This just comes in from:<br>
    <a href="http://www.latofonts.com/2014/04/01/get-free-lato-saves-billions-font-save-billions-dollars/" title="http://www.latofonts.com/2014/04/01/get-free-lato-saves-billions-font-save-billions-dollars/">http://www.latofonts.com/2014/04/01/get-free-lato-saves-billions-font-sa...</a></p>
    <p><em>Berlin, War­saw — April 1st, 2014</em><br>
    The team behind the Lato font fam­ily (Łukasz Dziedzic and Adam Twar­doch) have just released a spe­cial ver­sion of the Lato font called Lato Saves Bil­lions. “While Gara­mond can save the U.S. gov­ern­ment mere 400 mil­lion dol­lars, the Lato Saves Bil­lions font can save at least 5 bil­lion dol­lars,” said Adam Twar­doch. “The image above com­pares the Times New Roman, Gara­mond and Lato Saves Bil­lions fonts, all set at 14 pt. You can down­load the free Lato Saves Bil­lions font and try it out on your own com­puter. You will see how much more space-​​efficient Lato Saves Bil­lions is, com­pared to other fonts!” Twar­doch con­tin­ued. “Or you can down­load the entire Lato font fam­ily from http://​www​.lato​fonts​.com/ — nine weights with ital­ics, all free!”</p>
