    html: |-
      <p>The basic method:<br>
      Once you have the base spacing done* make two lists: a "Left" list where the right side of the glyph is irregular**, and a "Right" list where the left side is. Then you check (and probably kern) every combination of Left+Right. What you shouldn't kern from that list is stuff that's less errant than your most errant pair that's not on the list.</p>
      <p>* Which does <em>not</em> equate to "once it looks as good as possible without kerning".</p>
      <p>** You'll have to nail down what this means for you and the font at hand.</p>
      <p>hhp</p>
