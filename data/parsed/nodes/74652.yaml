    html: |-
      <p>You only need to kern the problems, but you need to cycle through most combinations to find the problem. If you assemble text files of kerning pairs correctly this can be faster than it sounds, especially if you use Metrics Machine to build your pair lists and cycle through them. </p>
      <p>But Listen to Thomas. Just put this font away for a while. Design another font, space it, learn more, and then go back to the first one. You don’t have to release your first font right away.</p>
