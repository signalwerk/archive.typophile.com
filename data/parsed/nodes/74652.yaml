      <p>Hey James,<br>
      that’s a very useful script; although it contains a syntax error which might confuse some people here:<br>
      When doing the proper work (mixing); the script flushes the mix for every 'i in dough'.</p>
      <p>So here’s the corrected bit:<br>
      <code><br>
      mix = ''<br>
      for i in one:</code></p>
      <blockquote><p><code>for z in two:</code></p>
      <blockquote><p><code>mix += i<br>
      mix += z<br>
      </code></p>
      <p>(So sad that proper code formatting is not possible here — not even with the 'code' tag!)</p>
      </blockquote></blockquote>
