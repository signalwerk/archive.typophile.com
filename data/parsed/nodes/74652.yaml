      <p>My first piece of advice is, go back and work on the spacing some more first. Seriously. If you think you're done, wait a few days or a couple weeks and then go back to it, or get third-party input. Because the worst mistake one can make is to get well into kerning and then make a few corrections to spacing....</p>
      <p>Of course, maybe you've already done this more than once, and you're really ready for kerning. In which case, put some real-world words that demonstrate specific problem combinations next to words that do not have any issues to speak of, and go to work.... Several folks have posted lists of words to use in kerning, as I recall.</p>
      <p>Regards,</p>
      <p>T</p>
