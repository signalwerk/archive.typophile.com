    html: |-
      <p>Symn&gt; OK.. to be accurate, spacing is putting the sidebearings right, right?</p>
      <p>Correct. And to be realistic and echo what others have said, others have said the spacing is not always complete when the kerning is begun. My pair kerning process often discovers changes needed in the spacing.</p>
      <p>For this reason:<br>
      &gt;...thinking about beginning to kern the Capital A next to lowercase glyphs with classes...</p>
      <p> —&nbsp;is not a good idea for a beginning kerner, (and perhaps even more so for a beginning Heinekerner), to start Aa.</p>
      <p>My process has always been to solve the last details of spacing and the kerning, by the case, as I do in the letter design and spacing. This means, pair kerning the Aa later, with correctly spaced and pair kerned cases. The advantages, for a beginner: </p>
      <p>a. you have whole words, like Avarice or Woonsocket, properly spaced and kerned, to look at, e.g. for the Av and Wo combinations.<br>
      b. you have no spacing corrections left in the cases perturbing the kern field. </p>
      <p>&gt;...is it really necessary to kern every letter combination?</p>
      <p>Most letter combinations in a well spaced font have no kerns, so you don't have to kern them. You have a choice of kerning everything that's left, a random pair that needs it, some pairs, or kerning according to some sort of frequency-of-use consideration, and/or according to the size of a required kern. </p>
      <p>&gt;is there a way I can take my pictures off?</p>
      <p>Too late, I finished the Cyrillic and Greek versions last night. Am 1/2 way through the Kanji and am renaming MY NEW FONT Angel of Heaven. And now off to work.;)</p>
