    html: |-
      <p>Max,<br>
      to kern small caps in FontLab, you’ll need to insert the glyph names into the FL metrics window, preceded by a slash (as you’d do with any glyph not accessible directly with the keyboard.)</p>
      <p>Typical example:<br>
      /a.sc/v.sc/a.sc/t.sc/a.sc/r.sc<br>
      (or, alternatively:)<br>
      /A.sc/V.sc/A.sc/T.sc/A.sc/R.sc</p>
