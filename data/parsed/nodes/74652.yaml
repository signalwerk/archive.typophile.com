      	output.write( codecs.BOM_UTF8 )</p>
      <p>	output.write ( title.encode( "utf-8" ))<br>
      	output.write( '\n')<br>
      	for i in dough:<br>
      		mix = ''<br>
      		for z in chips:<br>
      			mix += i<br>
      			mix += z<br>
      		output.write( mix.encode( "utf-8" ))<br>
      		output.write( '\n')<br>
      	output.close()</p>
