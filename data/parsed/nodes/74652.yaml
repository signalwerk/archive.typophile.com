      <p>Also, at least if you're doing this for the first time, accept that it will be an iterative process. Meaning that, even if your spacing looks «as good as it can without kerning», once you add kerning you may well have to go back and revise the spacing. In my case I've even had to go back and make some (tiny, but what isn't tiny in type design) changes to the black shapes in order to get the white to click. – On the other hand of course you need a system and some sort of plan/direction; otherwise this can seriously take forever.<br>
      Look; learn to see; be slow. Put stuff upside down. Squint at your screen, print stuff, whatever makes it easier for you to see the white. Go back and forth.<br>
      I've found kerning to be a long-winded, sometimes tedious, but amazingly instructive process.</p>
