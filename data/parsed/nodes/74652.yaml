    html: |-
      <p>To simplify things take a moment to strategize your kerning classes.  This minimize will the number of pairs you have to manage, particularly when you go back and make and adjustment.  The obvious classes are composed of glyphs and their related diacritics, but depending on your design you may be able to combine, for example, glyphs with ascenders on the left.  This doesn't eliminate the review all combinations but you'll save a lot of time in entering the kerning values.  </p>
      <p>Also, as a caveat, sometimes, when you modify an existing kerning class in the glyph panel of Fontlab, it doesn't always apply the changes when you compile the kern feature.   It's a little buggy and frustrating the when you test the font in the page layout program and realize your fixes did not take.  I find it best to double check(or just edit) your classes in the opentype code pane.</p>
