  html: |-
    <p>Anyone know why Mac apps don’t allow you to spec vertical layouts in agate lines? I’m doing a gig that involves making up a lot of newspaper ads, and I’m constantly having to translate them into inches or picas. Made a slip the other day that could’ve been a big deal if I hadn’t caught it.</p>
