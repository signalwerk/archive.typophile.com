      <p>Quark XPress does allow the use of agate lines on the Mac, but Adobe apps don’t use it anywhere, and I can’t think of any other apps that do off the top of my head.</p>
      <p>In the US, newspapers or magazines don’t still spec agate lines exclusive of any other measurement, and it’s certainly a unit (like most typesetting-specific terms) that has been in decline ever since DTP started taking off in the 80s.</p>
