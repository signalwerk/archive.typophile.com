      <p>Actually I'm using another typeface (Textile) just for letter shapes, to which I gradually add weight, I think I could get away with that, the result is nothing like the original anyway.<br>
      I was thinking of making a typeface which kind of looked like clouds, right now it reminds me of something food related.</p>
      <p>Btw, here's another trick which I did with Helvetica<br>
      Type some number of uppercase letters with uppercase letter I beetween each letter, such as<br>
      K I V I E I L I D I U I L I F I R (Kveldulfr)<br>
      Create outlines &gt; Blend: Options &gt; Steps: 1 &gt; Blend: Make &gt; Blend: Expand, then delete the original outlines<br>
      Kind of fun, hehe</p>
