      <p>This example didn't turned out well, but this is what I would usually do, see the attached file in my first post (Untitled-2.gif).<br>
      I'm using Adobe Illustrator 9.0.2, and all the functions I refer to are all built-in</p>
      <p>1. Here I start with letters "KMB", I'm using Textile as I mentioned, 144 pt.<br>
      2. I cut the letters with the knife tool in "joining" and "bending" points on the glyphs, it is rather important to cut in the right places, I always fail on this and go back as it is difficult to see what those places are.<br>
      3. Roughen, size 5, detail 15/in.<br>
      4. Round corners 20 pt<br>
      5. Offset round 15 pt, note the tiny "crusts", those are actually produced by the Offset function, I wonder if newer versions of Illustrator will have the same effect.<br>
      6. Outline (from Pathfinder)<br>
      7. Clear all the lines which shouldnt be there, you may need to cut some of them</p>
      <p>Tada</p>
