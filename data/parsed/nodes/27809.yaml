      <p>Oh the girls are out ta bingo the boys are gettin’ stinko...<br>
      ...sorry, couldn’t resist.</p>
      <p>According to the DIAC Design industry study, two thirds of all designers in Ontario reside in Toronto. I think that says something. Toronto is also the largest design centre in Canada and the third largest in North America (after NY and Boston).</p>
      <p>Being born and raised in Ottawa, I can’t imagine there being much in the way of exciting design happening there - unless you fancy working for the government.</p>
      <p>Luke.</p>
