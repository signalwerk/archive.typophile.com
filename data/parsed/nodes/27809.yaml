    <p>I know there’s a few people on here that hail from Ontario; I, myself am currently in Sudbury (please keep laughter to a minimum ). Moved here from NB for my wife’s schooling but are now considering the possibility of relocating to a different city, one that offers better employment opportunities in the industry. </p>
    <p>I do mainly focus on print design, but some web layout architecture as well. Currently working as the sole designer/artistic director for a small company up here and am wondering what the prospects are like in places like Ottawa (the first choice), Toronto, or several of the other southern cities.</p>
    <p>Any links, recommendations, etc… you might know of would be greatly appreciated.</p>
    <p>Thanks<br>
    Jonathan</p>
