    <p>Hello. I am trying to find some appropriate fonts for a casual iphone game to be used in the HUD (score and other interface elements) and the the main menu. It should have a cartoony look.</p>
    <p>Books and articles about typography usually don't mention nothing about cartoon typography. What is considered good taste in this kind of style?</p>
    <p>It is difficult to identify what current games are using because the fonts usually have a type treatment. For example, what is the font used in these examples?</p>
    <p><a href="http://a1.phobos.apple.com/us/r1000/042/Purple/fa/26/e9/mzl.izylhzow.320x480-75.jpg" title="http://a1.phobos.apple.com/us/r1000/042/Purple/fa/26/e9/mzl.izylhzow.320x480-75.jpg">http://a1.phobos.apple.com/us/r1000/042/Purple/fa/26/e9/mzl.izylhzow.320...</a><br>
