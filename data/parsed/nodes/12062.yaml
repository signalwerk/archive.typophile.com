    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Tobias Frere-Jones</strong></p>
    <p>Tobias Frere-Jones is the Director of Typography at <a href="/wiki/Hoefler%20%2526%20Frere-Jones" class="freelinking" rel="nofollow">Hoefler &amp; Frere-Jones</a>, the type foundry he runs with designer <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a>. The designer of more than five hundred typefaces, Frere-Jones' published work includes <a href="http://www.typography.com/catalog/gotham/" rel="nofollow">Gotham</a>, <a href="http://www.typography.com/catalog/whitney/" rel="nofollow">Whitney</a> and <a href="http://www.typography.com/press/pr_04_09_02.html" rel="nofollow">Retina</a>.</p>
    <p>After receiving his BFA in 1992 from <a href="/wiki/RISD" class="freelinking" rel="nofollow">Rhode Island School of Design</a>, Frere-Jones joined <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>, Inc. in Boston. Over seven years as a Senior Designer, he created a number of the typefaces that are Font Bureau's best known, among them Interstate and Poynter Oldstyle &amp; Gothic. He joined the Yale School of Art faculty in 1996 as a Critic. In 1999, he left Font Bureau to return to New York, where he began work with Jonathan Hoefler. Since working together, the two have collaborated on projects for The Wall Street Journal, Martha Stewart Living, Nike, Pentagram, GQ, Esquire, The New Times, Business 2.0, and The New York Times Magazine.</p>
    <p>He has designed over two hundred typefaces for retail publication, custom clients, and experimental purposes. His clients have included The Boston Globe, The New York Times, The Cooper-Hewitt Museum, The Whitney Museum, The American Institute of Graphic Arts Journal, and Neville Brody. He has lectured at Rhode Island School of Design, Yale School of Art, Pratt Institute, Royal College of Art, and Universidad de las Americas. His work has been featured in How, ID, Page, and Print, and is included in the permanent collection of the Victoria &amp; Albert Museum, London. Hoefler and Frere-Jones' collaboration has earned them profiles in <em><a href="http://www.nytimes.com/2004/10/19/nyregion/19profile.html?oref=login" rel="nofollow">The New York Times</a></em> and <em><a href="http://www.time.com/time/innovators/design/profile_hoefler.html" rel="nofollow">Time Magazine.</a></em></p>
