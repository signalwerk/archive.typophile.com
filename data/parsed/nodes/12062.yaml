    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Tobias&nbsp;Frere-Jones</strong></p>
    <p>Tobias Frere-Jones is the Director of Typography at <a href="/node/12018" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hoefler <span class="amp">&amp;</span> Frere-Jones</a>, the type foundry he runs with designer <a href="/node/12061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jonathan Hoefler</a>. The designer of more than five hundred typefaces, Frere-Jones’ published work includes <a href="http://www.typography.com/catalog/gotham/">Gotham</a>, <a href="http://www.typography.com/catalog/whitney/">Whitney</a> and <a href="http://www.typography.com/press/pr_04_09_02.html">Retina</a>.</p>
    <p>After receiving his <span class="caps">BFA</span> in 1992 from <a href="/node/12180" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rhode Island School of Design</a>, Frere-Jones joined <a href="/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a>, Inc. in Boston. Over seven years as a Senior Designer, he created a number of the typefaces that are Font Bureau’s best known, among them Interstate and Poynter Oldstyle <span class="amp">&amp;</span> Gothic. He joined the Yale School of Art faculty in 1996 as a Critic. In 1999, he left Font Bureau to return to New York, where he began work with Jonathan Hoefler. Since working together, the two have collaborated on projects for The Wall Street Journal, Martha Stewart Living, Nike, Pentagram, <span class="caps">GQ</span>, Esquire, The New Times, Business 2.0, and The New York Times&nbsp;Magazine.</p>
    <p>He has designed over two hundred typefaces for retail publication, custom clients, and experimental purposes. His clients have included The Boston Globe, The New York Times, The Cooper-Hewitt Museum, The Whitney Museum, The American Institute of Graphic Arts Journal, and Neville Brody. He has lectured at Rhode Island School of Design, Yale School of Art, Pratt Institute, Royal College of Art, and Universidad de las Americas. His work has been featured in How, <span class="caps">ID</span>, Page, and Print, and is included in the permanent collection of the Victoria <span class="amp">&amp;</span> Albert Museum, London. Hoefler and Frere-Jones’ collaboration has earned them profiles in <em><a href="http://www.nytimes.com/2004/10/19/nyregion/19profile.html?oref=login">The New York Times</a></em> and <em><a href="http://www.time.com/time/innovators/design/profile_hoefler.html">Time&nbsp;Magazine.</a></em></p>
