    <p><a class="freelinking external" href="http://river-valley.tv/tex-as-an-ebook-reader" rel="nofollow">http://river-valley.tv/tex-as-an-ebook-reader</a></p>
    <p>In this 40 minute video Mr. Bazargan proposes TeX as a way to render math equations and to handle line breaking better through TeX's advanced hyphenation and justification handling.</p>
    <p>TeX is apparently ideal because it's light and because many typesetting challenges to other engines are just native to TeX. Part of the idea I guess is to extend eBooks beyond novels. And that's an interesting area; I read somewhere that Governator wants to phase out paper textbooks and use digital books in California schools.</p>
    <p>I'm not an expert on any of this, I just see a lot of talk about eBooks and the future of reading in the forum. So what do you guys think?</p>
