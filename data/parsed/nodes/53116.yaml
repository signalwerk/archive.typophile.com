      <p><em>"By the way —- standards for literary plagiarism differ greatly from those for graphic and typeface design."</em></p>
      <p>Apparently each field has it own standards regarding borrowing/stealing other's work. Those of you old enough will remember Tom Lehrer's observations about the field of mathematics:</p>
      <p><em>I am never forget the day I first meet the great Lobachevsky.<br>
      In one word he told me secret of success in mathematics:<br>
      Plagiarize!</em></p>
      <p>Plagiarize,<br>
      Let no one else's work evade your eyes,<br>
      Remember why the good Lord made your eyes,<br>
      So don't shade your eyes,<br>
      But plagiarize, plagiarize, plagiarize -<br>
      Only be sure always to call it please 'research'.</p>
      <p>"And ever since I meet this man<br>
      My life is not the same,<br>
      And Nicolai Ivanovich Lobachevsky is his name.</p>
      <p>. . .</p>
      <p>I am never forget the day my first book is published.<br>
      Every chapter I stole from somewhere else.<br>
      Index I copy from old Vladivostok telephone directory.<br>
      This book was sensational!<br>
      Pravda - well, Pravda - Pravda said: "Zhil-bil korol kogda-to, pree nyom blokha zhila" It stinks.<br>
      But Izvestia! Izvestia said: "Ya idoo kuda sam czar idyot peshkom!"<br>
      It stinks.<br>
      Metro-Goldwyn-Moskva buys movie rights for six million rubles,<br>
      Changing title to 'The Eternal Triangle',<br>
      With Ingrid Bergman playing part of hypotenuse.</p>
      <p>And who deserves the credit?<br>
      And who deserves the blame?<br>
      Nicolai Ivanovich Lobachevsky is his name.<br>
      Hi!</p>
      <p>Lobachevsky would not have been well-liked if he had been a type-designer. (But he may nevertheless have been successful--sigh).<br>
      &nbsp;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;~~~~~~~~~~~~~~~~~<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>When going from </em>A to Z,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>I often end up </em>At Oz.</p>
