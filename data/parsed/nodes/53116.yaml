      <p>@Graham: . . . most contemporary type designers follow this path</p>
      <p>@ James: Withering stuff.</p>
      <p>Quite so, James, quite so. Yes, and also e e cummings can not be left out, eh, James?<br>
      I am guessing as a poorly educated cretin that "Withering stuff" is in context to the dreary 'experimentalist' theory of art, but I could well be wrong of course - your choice.</p>
      <p>We do live in a disturbed, complex and chaotic world and given the traditional instruments of the typographer, how shall the young immature, contemporary type designer with no experience and little knowledge of the origins of his chosen craft, orient himself and what bearing will the bewildering condition of the cosmos have on his thought and on his form?<br>
      The young contemporaries answer lies in the experimentalist's 'withering' theory: "old forms must be sacrificed to meet the new order of things and novelty and surprise become the important elements of style". To meet the incongruous of modern life the young type designer must seek for incongruous combinations in his designs.</p>
      <p>This can not be questioned, else typography becomes merely dried cheese contaminated by chirography imprisoned by the pen.<br>
      However, we still have to question whether the younglings performances are convincing, and that is another matter.</p>
      <p>The shock of a badly drawn and proportioned 'glyph', is admittedly a refreshing sight on occasion. But, the mono line, serif-less 'innovations' and 'watershed land-marks', that may seem at first so startling, specially combined with the new tricks of the latest software, have become so extreme and commonplace that they have already become monotonous and harden into a convention more rigid and conforming than the hated "clichés" of traditional type design and typography.<br>
      The aesthetic effect of the 'new' and 'innovative' rapidly loses any satisfaction of novelty that it originally had this is the problem with 'the shock of the new'. Then there are the voices. Such voices and advocates, some with charms and trinkets to lure the unwary and the easily led ill informed new kids on the block.</p>
      <p>One may even be impressed with the poetic rhetoric of the loud noises produced by the heavy artillery of the "whithering stuff", but as the bombardment continues, it becomes merely tedious, just like its products and other big noises.</p>
      <p>And, yes, I suspect that fwistard is, like me, laughing at you rather than with you.</p>
