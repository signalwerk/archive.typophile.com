    <p>Hello Typography Nerds,</p>
    <p>Let me start out by saying that this undertaking probably insults every fundamental rule and convention about typography and quality with which you are all so familiar. I am but a humble graphic artist without the mind nor the memory for such feats of typographic rhetoric with which you all so deftly wax poetic. In fact, when I design I am often boozy and operating without much more than a fraction of a percentage point of my brain (...an exertion, to be honest).</p>
    <p>That said, I am going to experiment with new 'typefaces' every day for the month of January. I have recycled my <a href="http://covers.fwis.com" rel="nofollow">Book Covers Blog</a> for the purpose. This is likely to result in broken links and tears. I won't spend very much time on them but I have all these sketches that I need to get out of my system while things are slow. You can download an EPS of each font which you must hand-set like they did in ye olden dayes. Sorry, but I'm too impatient and dumb to bother creating an OTF for each one - plus some of them probably won't work.</p>
    <p>You are welcome to use these on personal or professional work - all I ask is that you don't hold me responsible for the client firing you, and that if god forbid it ever does make it to production, that you send me a copy of whatever you used my typefaces on.</p>
    <p>I have only posted three so far, as today is January 3. If you have any comments and would like to post them here or on my blog, I would be grateful. </p>
    <p>If you are ever in New york City I invite you to join me for a cigar which I hope will make up for my poor form.</p>
    <p>Here it is: <a href="http://type.fwis.com" rel="nofollow">type.fwis.com</a></p>
