    html: |-
      <p>Heh! This is disappointing. I was hoping for much more fallout than resulted from my ad hominem personal attack on Graham.</p>
      <p>I walked away hoping a big mess would result but I guess I didn't push hard enuff. Tsk, tsk. What amazes me is that nobody flagged Graham's ad hominem personal attack on me, which he made in retaliation for my criticism of his postings, not criticism of him. If I attack a person, that's ad hominem. If I attack a person's ideas or their artwork, that's criticism, plain and simple.</p>
      <p>The amazing thing is that ad hominem takes place all over the internet all day and all nite continuously, and most internet users do nothing about it.</p>
      <p>So you all failed the "spot the ad hominem attack" test. Somebody should have moderated Graham for his ad hominem personal attack on me, and should also have flagged my ad hominem argument against him made in retaliation.</p>
      <p>But you did pass the "I dare you to retaliate endlessly and get all uncivil" test. The thread did not degenerate into an uncivil mess.</p>
      <p>This is good! Typo discussions should be about type, not about the peeple discussing the type.</p>
      <p>By the way --- standards for literary plagiarism differ greatly from those for graphic and typeface design. In the commercial writing business we call borrowing of another's words "lingua franca" or currency. Other commercial writers I work with freely borrow original lingua franca from me and I borrow freely from them, and we all borrow freely from folks like Frank Zappa, Hampton Francher, Poe, Joseph Conrad, F.D. Roosevelt, etcetera, etcetera. The practice isn't thought of nor is it called "plagiarism" because borrowing only one line is a fair cop, whereas --- by definition --- plagiarism is the borrowing a whole novel or a whole typeface design and passing it off as your own work. At least nobody in the commercial writing business bothers claiming the lingua franca they borrow is original or even theirs.</p>
      <p>Yet here in the type world, we have plagiarists who knock off entire typeface designs and claim it as their own work, and original too. Ha ha, bloody ha. That's the type business for you.</p>
      <p>@rcc: Normally I do credit my sources when I use lines written by another artist. This time around I replaced "butcher" with pastry chef to avoid accusations of using violent word imagery. "Butcher" involves the use of knives to cut up the carcasses of animals.</p>
      <p>I can remember most lines from most Zappa songs accurately, when I choose to. I chose to modify it this time to avoid breaching the civility guidelines. It helps to be careful with your choice of worms.</p>
      <p><em>Better to quote Frank than e e cummings ... but “wankshaft”? C’mon, now. Next time try “onanist” instead. After all this is a family site &amp; you’re posting during prime time. ;)</em></p>
      <p>Heh! I like your sense of humor. It's flexible and I like flexible peeple.</p>
      <p>On the subject of how worthwhile this 31 fonts in 31 days project is: I endorse things like this because experimentation is good for type design. Never say never. We just don't know what he may come up with. It may appear pointless on the surface, but really we shouldn't judge a book by its cover. It aint over 'til the fat laydee sings.</p>
      <p>j a m e s</p>
