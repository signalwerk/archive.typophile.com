  html: "<p>I am very excited about our second issue of Building Letters, this issue has an indian feel to it with : <br> <br>Sami from Underware in India <br>Rathna Ramanathan on Indian street sign painters <br>A visit to an Indian design firm <br>Exploring India the Brand <br> <br>Slighly less Indian is an essay by Neville Brody about his personal point of view on the responsibility of being a designer, plus lots more...  <br> <br>On the font side of things, we have exclusives from : <br> <br>Max Kisman <br>Ian Swift <br>Donnald Beekman <br>Harsh Patel <br>Miles Newlyn <br>David Luscombe <br>Jim Richardson <br> <br>Commercial typefaces from : <br> <br>Bruno Maag <br>Font Kitchen <br>Simon Schmidt <br>Felix Braden <br>Rian Hughes <br>Pizza Dude <br>Australian Type Foundry <br>Alejandro Paul <br> <br>Plus an exclusive Indic border design by John Downer. These will be free with the magazine. <br> <br>On the poster front, this time we have Emigre and Eboy creating two fantastic posters. <br> <br>The cost of this issue is likely to be just �10 + post and packaging (all packs will be mailed record delivery after lots of problems with missing packs last time). <br> <br>As with last time, this is all about raising money for charity, so get your credit cards ready! <br> <br>JIM</p>"
