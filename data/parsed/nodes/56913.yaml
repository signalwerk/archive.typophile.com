  html: |-
    <p>This picture is for Hiragino Maru Gothic Pro (japanese and western characters) that I have installed on my computer. But there are problems with using this font for Latin characters and I was wondering if there is something similar, but better that you know about.</p>
    <p>It should be just as simple and have rounded terminals. I only need the uppercase letters.</p>
    <p>Thanks.</p><div class="imageWrap"><img src="/files/font_sample_4765.png"></div><p></p>
