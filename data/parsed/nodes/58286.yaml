  html: <p>Hi,I'm working on a type project for school where we have to design a book of a classic american author. I have william faulkner. He's a bit crazy, deals with a lot of non linear storytelling, stream of consciousness, and multiple authors.  However most of his subject matter takes place in civil war south so I feel like i need a font that is at once classic feeling and edgy.  I need to choose two fonts- a display and a body copy font.  Any suggestions?</p>
