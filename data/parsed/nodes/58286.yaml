    html: |-
      <p>Unless I've forgotten too much in the past 40 years, only one of Faulkner's books is set in the Civil War years.</p>
      <p>You should always read a manuscript (in this case, a book?) before selecting an appropriate typeface. Going out on a limb, e.g., without knowing what *this* book is, I'd probably pick a Scotch roman for the text. There are two digital fonts that are workable and have a "Scotch" origin. One is Monticello, perhaps better for older texts. The other is Miller. Both were done (digitaly) by Matthew Carter. </p>
      <p>Whether or not a bourbon drinker could favor a Scotch font is better left to the bourbon drinkers.</p>
      <p>Maybe after enough bourbon or scotch you could explain why you need a separate display font?</p>
