      <p>I'd suggest a slightly different approach than Thomas Levine's. Indeed, start at the library and look at editions of Faulkner's writings. But not only at the first editions. See how his texts have been handled over many decades. Then see how you can "improve" upon them or how you can work with the texts in ways that make sense to you. Keep in mind the ways in which Faulkner's books were set and printed when they were new. See if today's types and printing methods point the way for you. </p>
      <p>Have fun. &amp; try to read as much of his work as you can. It is great writing.</p>
      <p>powers</p>
