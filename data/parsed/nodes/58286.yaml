      <p>I <a href="http://looked at" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://looked at</a> three first editions. Typeface isn't so consistent among them as the general layout. This is largely related to the publisher, of course, so you may consider comparing his books to others of the time of both the same and different publishers.</p>
      <p>And I second Will's suggestion.</p>
