      <p>William Morris' <a class="freelinking external" href="http://www.myfonts.com/fonts/p22/morris/troy/" rel="nofollow"><em>Troy</em></a> fits the actual concept of <strong>Neo-Blackletter</strong> or <strong>Blackletter Sans</strong>.</p>
      <p>Tom Carnase's <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/honda/" rel="nofollow"><em>ITC Honda</em></a>  (1970) has not only the <strong>Blackletter Sans</strong> leaning but combined with the weight of a slab serif/fat face if you catch my meaning.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/honda_6736.gif"></div><p></p>
      <p>I found another lead concerning the concept through Eric Gill's <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/jubilee-rr/" rel="nofollow"><em>Jubilee</em></a>.<br>
      What do you think of Gill's <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/jubilee-rr/" rel="nofollow"><em>Jubilee</em></a> and its cognitive bias?</p>
