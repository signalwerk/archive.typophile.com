    <p>Previously, I started a thread about <a class="freelinking external" href="http://www.typophile.com/node/114952" rel="nofollow">The Concept of Stripping Down the Serifs</a>.<br>
    Now, let's go back to time, back to the Middle Age.<br>
    I still wonder who first conceives sans serif typefaces based on blackletter calligraphy? Should I say <strong>Blackletter Sans</strong>, in other words, blackletter without terminals.<br>
    William Morris, Rudolf Koch or Tom Carnase and his <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/honda/" rel="nofollow"><em>Honda<em></em></em></a>?<br>
    Some recent designers work and exploit geometric moduls combined with a heavy weight which give the flavor of blackletter: see <a class="freelinking external" href="http://www.myfonts.com/fonts/volcano/trigot/" rel="nofollow"><em>Trigot</em></a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/catharsis-fonts/gryffensee/" rel="nofollow"><em>Griffensee</em></a>.<br>
    Fell free to give your interpretation. Thanks for your input.</p>
