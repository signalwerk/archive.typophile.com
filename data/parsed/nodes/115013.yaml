      <p>William Morris' <a href="http://www.myfonts.com/fonts/p22/morris/troy/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;Troy&lt;/em&gt;</a> fits the actual concept of <strong>Neo-Blackletter</strong> or <strong>Blackletter Sans</strong>.</p>
      <p>Tom Carnase's <a href="http://www.myfonts.com/fonts/linotype/honda/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;ITC Honda&lt;/em&gt;</a>  (1970) has not only the <strong>Blackletter Sans</strong> leaning but combined with the weight of a slab serif/fat face if you catch my meaning.<br><img src="/sites/default/files/old-images/honda_6736.gif"></p>
      <p>I found another lead concerning the concept through Eric Gill's <a href="http://www.myfonts.com/fonts/redrooster/jubilee-rr/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;Jubilee&lt;/em&gt;</a>.<br>
      What do you think of Gill's <a href="http://www.myfonts.com/fonts/redrooster/jubilee-rr/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;Jubilee&lt;/em&gt;</a> and its cognitive bias?</p>
