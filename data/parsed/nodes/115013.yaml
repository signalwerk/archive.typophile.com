    <p>Previously, I started a thread about <a href="http://www.typophile.com/node/114952" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">The Concept of Stripping Down the Serifs</a>.<br>
    Now, let's go back to time, back to the Middle Age.<br>
    I still wonder who first conceives sans serif typefaces based on blackletter calligraphy? Should I say <strong>Blackletter Sans</strong>, in other words, blackletter without terminals.<br>
    William Morris, Rudolf Koch or Tom Carnase and his <a href="http://www.myfonts.com/fonts/linotype/honda/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;Honda&lt;em&gt;</a>?<br>
    Some recent designers work and exploit geometric moduls combined with a heavy weight which give the flavor of blackletter: see <a href="http://www.myfonts.com/fonts/volcano/trigot/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;Trigot&lt;/em&gt;</a> or <a href="http://www.myfonts.com/fonts/catharsis-fonts/gryffensee/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;Griffensee&lt;/em&gt;</a>.<br>
    Fell free to give your interpretation. Thanks for your input.</p>
