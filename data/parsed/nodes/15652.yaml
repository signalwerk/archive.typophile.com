    <p>I have just come across, reading Erik Siekermann's blog, the introduction by DB of a new type family. Coming in four versions: Sans (regular, condensed and compressed), Head (pretty funny name if you think about it), Serif and News, the family strikes me with its overdetailed finishes and its ressemblance both to Bell Gothic and Vesta. Anybody knows more about this? Maybe the designer ... </p>
    <p>Here is a link to the (german only)PDF introducing the new typeface:</p>
    <p><a href="https://web.archive.org/web/20150123040240/http://www.spiekermann.com/iblog/C61720386/E20051013130639/Media/DBType_Uebersicht.pdf" title="http://www.spiekermann.com/iblog/C61720386/E20051013130639/Media/DBType_Uebersicht.pdf">http://www.spiekermann.com/iblog/C61720386/E20051013130639/Media/DBType_...</a></p>
