  html: <p>Good day Typophiles, <br> <br>You may recognize pomegranate from a previous post. I'm another designer working on the same identity.  We are trying to communicate the benefits of our integrated approach, in that the whole is greater then the sum of it's parts. I've explored a variety of icons inherited from the pomegranate itself. We like the icon of the seed in that it's where everything starts, like an idea. Here is 1 approach I'm considering for a signature and 2 versions of the wordmark. I'm not sure about the ligature on the first kerned out version. What do you guys think? The 2 seeds represent our 2 core services and are positioned next to eachother to create an integration as well an invisible infinity symbol in the negative space. The pomegranate is a symbol of fertility and rebirth, so I thought infinity would be an appropriate symbol. Anyhow, this is my thought process, another perspective or any feedback would be greatly appreciated. <br> <br><img src="http://www.typophile.com/forums/messages/29/25139.gif" alt="pomegranate"></p>
