    html: <p>Those versions are over the top. They just look like leaves. I perceive Angela's suggestion to be much more subtle. The letterform ("a") would keep its outlining shape, while the counter assumes a seedlike shape. I can think of two ways to make the seed noticable <br> <br>1 exagerate the counter so its weight is uncomfortably thin, in contrast to the weight of the rest of the letter <br> <br>2 add a third color to the logotype within the counter, so the background color would be blue, gray, green or whatever, and the "a" counters/seeds would be red (I guess it would really only be a two color logo, since the type is white/paper) <br> <br>Another take on Hrant's idea would be to lose the link on the "g" and fill the lower loop, making it solid. This would make the top half of the "g" a pomegranate (with a little tweaking) and the lower half a shadow. I hope that suggestion doesn't break the rules of Typophile critique etiquette. <br> <br>Aloha! <br>Scott</p>
    html_clean: <p>Those versions are over the top. They just look like leaves. I perceive Angela's suggestion to be much more subtle. The letterform ("a") would keep its outlining shape, while the counter assumes a seedlike shape. I can think of two ways to make the seed noticable <br> <br>1 exagerate the counter so its weight is uncomfortably thin, in contrast to the weight of the rest of the letter <br> <br>2 add a third color to the logotype within the counter, so the background color would be blue, gray, green or whatever, and the "a" counters/seeds would be red (I guess it would really only be a two color logo, since the type is white/paper) <br> <br>Another take on Hrant's idea would be to lose the link on the "g" and fill the lower loop, making it solid. This would make the top half of the "g" a pomegranate (with a little tweaking) and the lower half a shadow. I hope that suggestion doesn't break the rules of Typophile critique etiquette. <br> <br>Aloha! <br>Scott</p>
