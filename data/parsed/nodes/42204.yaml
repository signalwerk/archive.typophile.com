    <p>Hello everyone.</p>
    <p>I am currently creating a book about the diverse usages of Univers.  It is essentially a responce to the Lars Muller Hommage to Helvetica book with the aim of giving Univers its due as a true type great.</p>
    <p>I am making good progress but am sure that i am still only scratching the surface, if anyone has any good examples of its use (pictures or details) I would love to be made aware of them.</p>
    <p>Wil</p>
