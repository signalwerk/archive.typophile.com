      <p>You won't find it in America, but apparently many of the Central European nations use Univers for everything that an American might use EDIT Helvetica for.</p>
      <p><cite>unfortunately this was not sufficient to make it a houshold name with wider awareness of its artistic importance.</cite></p>
      <p><a href="/wiki/Mike%20Parker" class="freelinking" rel="nofollow">Mike Parker</a> of the Font Bureau, formerly of Linotype, would be a great person to contact, since he's apparently the person who made the decision in America to go with Helvetica over Univers for the Linotype. Or so he says :)</p>
      <p>The fact that Helvetica was the cheaper typeface to license for the Linotype machine in America made the decision that effects us all today. Had Univers been cheaper, Parker would have decided to go with it because of its then obvious advantages of the number of styles. Helvetica at that point was only a few cuts compared to the family of 21 of Univers.</p>
