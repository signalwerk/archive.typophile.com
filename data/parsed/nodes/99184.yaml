    <p>Hi all,<br>
    I'm designing a logo for a musician. The mark is combining the zodiac symbol for Pisces along with the idea of the guitar, though I didn't want any of those ideas to be too literal. I'm trying to express the idea of duality in music. Any thoughts would be appreciated. Thanks in advance!</p>
