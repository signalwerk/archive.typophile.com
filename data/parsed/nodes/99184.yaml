    date_raw: 27 Dec 2012 — 2:52pm
    date: 2012-12-27T14:52:00
    votes: null
    html: |-
      <p>It appears you made the body of the guitar pointed to suggest a fish (Pisces) and drew the sound hole far away from the neck for the same reason. I think you've moved too far away from <em>guitar</em>, but not close enough to <em>fish</em>, so that it doesn't read as either--at least to my eyes. </p>
      <p>Maybe if the guitar bodies didn't end in a point (some fish have rounded heads) it would work a little better. And if the tails ended in a shape that managed simultaneously to suggest a fish tail and the tuning pegs  of a guitar, maybe my brain wouldn't be so quick to decode them as mice.</p>
