    html: <p>My vote is custom, as most franchise logos are, and especially since the "d" attaches to the "s" regardless of the apostrophe between them.. but the first thing that came to my mind was <a href="http://fontdiner.com/menu_vegas.html" target="_blank">El Ranchero</a> from FontDiner.</p>
