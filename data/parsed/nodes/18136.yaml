      <p>Studley was named for <a href="/wiki/Robert%252BStudley" class="wiki-create">Robert P. Studley</a>, the first user of lithographic presses in Saint Louis. It was said to be only a modification of <a href="/wiki/Woodward" class="wiki-create">Woodward</a>. Extended, Condensed, and Extra Condensed versions would follow within four years. While <a href="/wiki/Inland%252BType%252BFoundry" class="wiki-create">Inland</a> claimed this was original work, <a href="/wiki/Mac%252BMcGrew" class="wiki-create">McGrew</a> claims that it was just a copy of Quentell/Taylor Gothic/Globe Gothic. McGrew in general shows little trust in Inland and denounces its claims of originality in many cases. Eckman showcases Inland’s its aggressive salesmanship and bullying tactics.</p>
      <p> McGrew about Studley: <a href="/wiki/Globe%252BGothic" class="wiki-create">Globe Gothic</a> is a refinement of Taylor Gothic, designed about 1897 by <a href="/wiki/ATF" class="wiki">ATF</a> at the suggestion of Charles H. Taylor of the Boston Globe, and used extensively by that paper. But Taylor Gothic has mostly the same lowercase as <a href="/wiki/Quentell" class="wiki-create">Quentell</a>, though with hairlines heavied a bit. ATF’s Central Type Foundry branch in St. Louis claims to have originated Quentell (q.v.) in 1895 or earlier. The conversion to Taylor Gothic was designed by <a href="/wiki/Joseph%252BW.%252BPhinney" class="wiki">Joseph W. Phinney</a>, while the redesign as Globe Gothic in about 1900 is credited to <a href="/wiki/Morris%252BBenton" class="wiki-create">Morris Benton</a>. It is a serifless, thick-and-thin face, distinguished by the high crossbar on E, F, and H. The angular end on the stems of V, W, and most lowercase letters. Globe Gothic Condensed, Extra Condensed, and Extended were designed by Benton about 1900. Globe Gothic Bold and its italic are also credited to Benton, in 1907 and 1908 respectively. But <a href="/wiki/Frederic%252BW.%252BGoudy" class="wiki">Frederic W. Goudy</a>, in the book on his typefaces, says, “This type (Globe Gothic Bold), drawn at the suggestion of Joseph Phinney, followed in the main certain points which he wished brought out. It never had much vogue and is the least satisfactory (to me) of all my types.” This is puzzling, as the bold departs somewhat from the style of the lighter weights, but is not at all characteristic of Goudy’s work-nor of Benton’s, for that matter. Studley of Inland Type Foundry was similar. Compare Ryerson Condensed, Radiant, Matthews, Pontiac, World Gothic.</p>
      <p> http[:]//cgm.cs.mcgill.ca/~luc/inland/</p>
