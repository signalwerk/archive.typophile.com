    html: <p>In the Dover book “Treasury of Authentic Art Nouveau Alphabets” (which is a partial reprint of a German type specimen book from 1903), there is a face called “Studley Extended” which, except for the proportions, looks almost exactly like your sample. It has many similar details, such as the hook serif on the G and the way the diagonal meets the right stem of the N just above the baseline. According to the Dover book, it was produced by the Inland Type Foundry, but I can’t find any other references to it. I would have expected to see it in Mac McGrew’s American Metal Typefaces of the Twentieth Century, but maybe it was too old even for that.</p>
