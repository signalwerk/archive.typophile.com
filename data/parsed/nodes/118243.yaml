  html: |-
    <p>So, I have this shirt, and its idea is to have the name of classical musicians on famous rock band fonts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/530e8a23cc7ce932c8818ba839344190_3691.png"></div><p></p>
    <p>I'm a big rock fan, and I can easily recognize Iron Maiden's (Mozart), AC/DC's (Bach) and Kiss's (Stravinsky) fonts, but... I really can't recognize the one they used for Beethoven.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Beethoven_3684.jpg"></div><p></p>
    <p>I thought it was just me and my lack of knowledge on band fonts, but then I published the font on facebook and none of my friends (or their friends, or their friend's friends) could recognize it. And now, it became no longer just about finding out the band, but almost a matter of honor (that, and I'm not really comfortable wearing a shirt with a font advertising a band I don't recognize =/).</p>
    <p>So, I've been trying to find out the name of the font - I guess it will be easier to go from there. But if you don't know the name of the font but know the band, please, inform away!</p>
    <p>Thanks. =)</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
