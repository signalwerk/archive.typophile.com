    <p>Once again I have fallen under the influence of my <a href="http://www.fontcraft.com/fontcraft/?p=1301" rel="nofollow">fashion conscious</a> teenage daughter, who tells me that I absolutely must produce more "shabby chic" fonts like the <a href="http://www.useyourtype.blogspot.com/" rel="nofollow">trendy scrapbookers</a> and <a href="http://grayhood.com/" rel="nofollow">hip fashion label designers</a> use.  On showing her examples this turns out to mean more circus style fonts with wide ascenders and decoration.  We did this dance once before the the <a href="http://www.fontcraft.com/Merchant2/merchant.mv?Screen=PROD&amp;Product_Code=cascade" rel="nofollow">Cascade</a> font and she wasn't entirely satisfied.  It was too <a href="http://www.fontcraft.com/fontcraft/?p=1437" rel="nofollow">Art Deco</a> and not crude enough looking.</p>
    <p>So, against my natural inclination to tweak everything to perfection I found some sample letters from a 19th century poster and developed a full alphabet from them without pushing too hard for perfect lines and symmetry.  The result is the new Andrano font with a name picked because there's something sort of Italian looking about the font.  It features wide and ornate characters with jewel-like internal embellishments and a subtle built-in shadow to give the illusion of depth.  The upper case characters are somewhat skewed and misaligned versions of the standard character set.  So far my teenaged adviser is fairly pleased with it and she claims that because of her influence it will be a sure bestseller, so here it is.</p>
    <p>For more info and to download the demo version see <a href="http://www.fontcraft.com" rel="nofollow">fontcraft.com</a>.</p><div class="imageWrap"><img src="http://typophile.com/files/andranomf_5387.jpg"></div><p></p>
