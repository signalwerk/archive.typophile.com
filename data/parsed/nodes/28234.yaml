    <p>I have some basic open type (SC, Figs, etc) that work fine within FontLab. It compiles without error. It previews etc. When I go to generate an .OTF, it gives the following error:</p>
    <p>ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors</p>
    <p>Can anyone point me in a direction for this kind of error? How can I debug if the FL compiler isn’t showing errors?  I know it’s hard without posting the font, but any ideas would be appreciated.</p>
    <p>Thanks,<br>
    Randy</p>
