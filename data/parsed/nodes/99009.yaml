    html: |-
      <p>Thank you! I don't think anyone has called my attempts "attractive" before. ☺ From what I've read, it seems very unusual for typefaces to include matching or complementary Latin and Hebrew characters, but I appreciate it. It is a goal of mine in every face that I create. I believe that my SS is the only Bank Gothic-like face to include Hebrew.</p>
      <p>The shape of peh in Marapfhont is idiosyncratic. You'll note that in most cases where there's a counter or bowl, it spans most of the height of the letter, with only a short stem outside it. It exaggerates the sense of thinness and height.</p>
      <p>The challenge in both of the tsadis, as I recall it, was making them distinct enough from the ayins. (There are several glyph-pairs in Hebrew with relatively similar look.) Curves are under constraints in both faces, and diagonals very rare in Marapfhont. Not being a Hebrew reader (my education was very brief, and long enough ago that I've forgotten almost all of it) I'm not overly familiar with the "canonical" appearance. I see the point you're making. I'll have to revisit those. I probably had too few reference examples to spot what commonalities to preserve and what I could bend.</p>
