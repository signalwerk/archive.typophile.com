    html: <p>hrant— No, I developed Marapfhont independently, based upon visual inspection of the design of Modula Tall's uppercase Latin characters. I did not care for the lowercase, so those were completely redesigned, as well as the repertoire being expanded to Hebrew (and other) ranges. The source of the inspiration was the title font for the mid-90's computer game, Marathon. The name is a portmanteau of that and the in-game antagonist, the Pfhor.</p>
