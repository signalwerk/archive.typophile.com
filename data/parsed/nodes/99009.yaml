      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Marapfhont-Hebrew_4878.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Squarish Sans-Hebrew_5938.jpg"></div><p></p>
      <p>Both of the fonts (see above) have attractive, and matching Hebrew glyphs.</p>
      <p>I have three suggestions.</p>
      <p>1) The Feh/Peh of Marapfhat (05E4) has a left vertical bar that turns right at its lower extreme, turning right too low. Rather, it should turn right at the mid-point (height) of the letter. See the same form in the Squarish Sans font ()5E4).</p>
      <p>2) The Tzaddi(k) of Marapfhat (05E6) has a left vertical bar that turns rightward at its mid-extreme, turning rightward too soon. Rather, it should turn rightward at a diagonal movement to the extreme  left base of the letter, and then turn left at the baseline.</p>
      <p>3) Again, the Tzaddi(k) of Squarish Sans (05E6) has a left vertical bar that turns rightward at its mid-extreme, turning rightward too soon. Rather, it should turn rightward at a diagonal movement to the extreme  left base of the letter, and then turn left at the baseline.</p>
      <p>See examples from different classic Hebrew typefaces:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ayin-peh_5830.jpg"></div><p></p>
