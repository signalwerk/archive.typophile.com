    html: |-
      <p>Probably hand lettering. Also, I don't recall a font circa 1924 that looked like this. But there were posters by  lettering artist Ludwig Holwein from about 1922 that used diamond shapes for the bar locations. His work was the basis for <a href="http://www.myfonts.com/fonts/bitstream/bremen/" rel="nofollow">Bremen</a> designed by Richard Lipton in 1992.<br>
      Don</p>
