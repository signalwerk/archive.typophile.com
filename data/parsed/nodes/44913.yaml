    <p>Hello,</p>
    <p>This has been bugging for quite some time now, what do all these abbreviations mean? Some I can figure out but there are some that confuses me especially when its the exact same font but with different abbreviations at the end of its name. does typophile have a glossary of these abbreviations?</p>
    <p>And why does garamond have an ITC and Adobe version? What’s the reason behind that? And other fonts for that matter?</p>
    <p>Thanks,<br>
    MIYU</p>
