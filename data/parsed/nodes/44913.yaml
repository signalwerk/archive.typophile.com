      <p>The various initials can indicate a number of different types of things. Some of the most common categories of things indicated are </p>
      <p><strong>Foundry:</strong> <em>e.g.,</em> LT (Linotype), MT (Monotype), ITC (International Typeface Corporation), BT (Bitstream), FF (FontFont), FB (Font Bureau), HTF (Hoefler Type Foundry), etc.</p>
      <p><strong>Font Format:</strong> <em>e.g.,</em> PS (Postscript), TT (Truetype), MM (Multiple Master), OT (OpenType)</p>
      <p><strong>Figure style:</strong> <em>e.g.,</em> OSF (oldstyle figures), LF (lining figures), TF (tabular figures)</p>
      <p><strong>Character set or language support:</strong> <em>e.g.,</em> SC (small caps), CE (Central European), STD (Standard — generally a basic character set), Pro (Professional — generally an extended character set with Greek a<!--
