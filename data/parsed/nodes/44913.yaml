    html: |-
      <p>SC=Small caps LT =Light(??) STD=Standard MM=Multiple Master (an older Adobe technology) ... not sure on the last two.</p>
      <p>Keep looking for Garamond’s, you will find at least three other cuts, Garamond 3, Simonici, and Stempel. Each foundary tends to create their own version of this revival face, with small to major differences. The two you mention have the greatest difference, with ITC having a very large x-height (ratio of lower case size to cap height). This is usual on most ITC faces. Adobe has a very small x-height.</p>
