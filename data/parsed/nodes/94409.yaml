  html: |-
    <p>Hi all</p>
    <p>I have this simple Robofab script here that adjust the height of accents above glyphs.<br>
    I'm sure there are better ways of doing this but I like this method.</p>
    <p><code><br>
      from robofab.world import CurrentFont<br>
      #<br>
      f = CurrentFont()<br>
      #<br>
      glyphs = [<br>
      'Aacute',<br>
      'Abreve',<br>
      'Acircumflex',<br>
      'Adieresis',<br>
      'Agrave',<br>
      'Amacron',<br>
      'Atilde',<br>
      'AEacute',<br>
      'Aring',<br>
      'Aringacute',<br>
      ……<br>
      ]<br>
      #<br>
      for g in glyphs:<br>
      	f[g].components[1].move((0,5))<br>
      	f[g].mark = 10<br>
      f.update()<br>
    </code></p>
    <p>If I use this on a MM font it will adjust the height of the accents in both masters.</p>
    <p>Is it possible it adjust the height in just one of the masters.</p>
