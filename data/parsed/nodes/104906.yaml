  html: <p>I'm having a hard time finding a nice sans that goes with Diotima LT Std Roman. I need something that has a classical vibe (obviously) but that also has a subtle Art Nouveau and/or Arts &amp; Crafts thing going on, too. Nothing too decorative –just open, humanist and especially compatible with Diotima's characters a, b, e, m, and p. Something slightly wide, like the 105-110% horizontal scale range. Thanks in advance.</p><div class="imageWrap"><img src="http://typophile.com/files/DiotimaLTStdRoman_6149.png"></div><p></p>
