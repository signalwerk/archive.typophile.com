    html: |-
      <p>The thing with pairing a sans with a very trad serif like Diotima is that a sans needs to be based around the classical proportions, and not many are. An example of a classically-proportioned sans is of course Gill Sans.<br>
      However, perhaps you could look at Frantisek Storm's Sebastian. It comes in 6 weights, and is a beautiful design. Only downside is slightly petite Small Caps, but I recommend it.<br>
      If you're trying to match Diotima's full bowls and high x-height, try American Gothic OPTI. there's a sans and the 'tick' serif. It's at <a href="http://opti.netii.net/fonts-a/index.htm" title="http://opti.netii.net/fonts-a/index.htm">http://opti.netii.net/fonts-a/index.htm</a>, a display face in three weights. (the sans is not here). Cheers.</p>
