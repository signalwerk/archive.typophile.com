      <p>That answer may haven been spam, but I, for one, still fondly remember my first PostScript Laserprinter, an Oki. In 1989 it was around 9000 USD (knock off price, because it was a demo model), and the LED-tech made for razorsharp prints, far better than Canon and Apple had then.<br>
      In other words: you can do worse than Oki… : )</p>
