    html: |-
      <p>I came across your post while perusing my daily printing blogs and wanted to recommend one of <a href="/wiki/www.okidata.com" class="freelinking" rel="nofollow">OKI Data's</a> monochrome multifunction printers. The MB401 Series has received a lot of awards since it's launch in June 2012 (I bought mine in August). The image quality is excellent, it's an all in one printer, and perfect for all my printing needs. </p>
      <p>Here's the link to the Series page- there are a few different mono MFPs (<a href="http://www.okidata.com/mkt/html/nf/MFP.php?sku=MB401Series" title="http://www.okidata.com/mkt/html/nf/MFP.php?sku=MB401Series">http://www.okidata.com/mkt/html/nf/MFP.php?sku=MB401Series</a>). I have the <a class="freelinking external" href="http://www.okidata.com/mkt/html/nf/MFP.php?sku=MB401Series" rel="nofollow">MB471w</a> because of it's wireless printing capabilities! </p>
      <p><a href="http://www.okidata.com" title="www.okidata.com">www.okidata.com</a>. Definitely recommended! Hope this is helpful.</p>
