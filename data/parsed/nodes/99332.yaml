  html: "<p>I’m doing research on my next purchase: a monochrome laser printer to replace my HP 5000n – an old machine that produced beautiful pages. It’s been a long time since I’ve shopped for printers and I’m wondering what typophiles prefer these days for the highest-quality monochrome printer for typography and (secondarily) image quality. Thanks for any feedback.</p>"
