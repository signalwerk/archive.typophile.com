    <p>Hi everybody,</p>
    <p>I’m in the final stage of building a number of new fonts. Right now I’m trying to get the vertical metrics right and for some reason beyond my grasp some of them won’t get right, no matter what I try.</p>
    <p>Below are a roman and an italic version of the same typeface, with identical vertical metrics and identical specs in Indesign. Still, they won’t line up.</p>
    <p>I’ve read and read over again the wonderful article on vertical metrics by John Hudson here on Typophile (thank you John) and religiously followed his guidings and guess what, they work wonderfully. Except for this pair. Anyone any idea what I’m doing wrong?</p>
    <p>Thanks,<br>
    Alex</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Schermafbeelding_5095.png"></div><p></p>
