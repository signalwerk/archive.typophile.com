    html: <p>All the Adobe apps use an custom Adobe-built rasterizer to display type etc. instead of the rasterizer of the system (OS X, Windows, etc). What you noticed could be typical for that and might be a bug that needs reporting and fixing. You should try and file a bug report at Adobe’s site…</p>
