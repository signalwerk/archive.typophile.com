    date_raw: 29.Oct.2007 2.44pm
    votes: null
    html: <p>In InDesign we ran into this issue fairly early because the first OpenType fonts at Adobe with 'frac' just had a simple ligature-like substitution for the basic fractions which could be applied globally. Later, after it was decided to switch to a more generic implementation in the fonts there was a fear that some documents would be set with 'frac' applied this way (like a cookbook).  We talked about trying to be more intelligent about applying 'frac' selectively under the hood, but decided we didn't want to start second-guessing when &amp; where to apply OpenType features. Fortunately, back then we had a much smaller user base. Similar issues existed with the 'ordn' feature, at least in earlier font implementations.</p>
