    <p>Currently when OT fraction feature is applied to text in InD numbers imput render as numerators, then when the slash/fraction character is input the subsequent numbers render as denominators.</p>
    <p>What would really ideal is if the numbers in the string would remain as full-size numbers UNTIL the slash/fraction character is input, then those numbers before the slash would change to numerators and the numbers after the slash/fraction would render as denominators.</p>
    <p>Anyway to do this?</p>
