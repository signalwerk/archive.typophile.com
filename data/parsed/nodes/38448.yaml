      <p>As you say, typing the space-between makes sense editorially, as it distinguishes between 1 1/16 and 11/16 etc.</p>
      <p>Even if that is not a universal practice, it doesn't hurt to make the transition from manuscript fractions to typographic fractions an automatic, in-font OT feature, except that...</p>
      <p>...if the OpenType solution mentioned here is not universally applied to fonts, there will be problems changing fonts. Suppose you have a document set in a font which automatically removes the space-between, and switch to one that doesn't -- the typographer/editor/proofreader will have to be really on the ball to catch the few instances in text, in say a cookbook, where the space jumps back in.</p>
      <p>Therefore I would say this technique should only be used in proprietary fonts, not retail fonts.</p>
      <p>**</p>
      <p>Another treatment of the space-between has been mentioned by CharlesE in this forum -- I recall he reworks fonts to add kerning between integers and numerators, and that's something I'm starting to put in fonts.</p>
