      <p>Here's what I "figured" out. </p>
      <p>sub @FIGURES' slash @FIGURES by @numr;<br>
       sub @FIGURES' @FIGURES slash by @numr;<br>
       sub @FIGURES' @FIGURES @FIGURES slash by @numr;<br>
       sub @numr slash @FIGURES' by @dnom;<br>
       sub @dnom @FIGURES' by @dnom;<br>
       sub slash by fraction;</p>
      <p>Gives up to three numerators (all you need in a non-math font) and infinite denominators.</p>
      <p>Works fine in InDesign, Illustrator, and Photoshop.</p>
