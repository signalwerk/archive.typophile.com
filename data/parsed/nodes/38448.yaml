      <p>In my experience, manuscripts from different clients come in with various formatting. The usual way we get fractions in a MS is closed up to the number, frequently coded. I imagine we do a lot of things differently from some users; we strip most all coding out of the typescript (MS), and we recode or put in a lot of InDesign tags with EditPad Pro -- including the code for fractions. The reason is that most manuscripts coming in via Word are a jumble of general styles and direct formatting; best to get rid of it &amp; start over.</p>
      <p>We also don't concern ourselves about anyone trying to recover text from a PDF; instead, the assumption is that any "repurposing" will be done via exported &amp; reworked XML files. </p>
      <p>More to the point, it is hard for the type designer to know just how the font will be used; to cover all bases, a lot of features would have to be written. One of my pet grumbles -- how can a type designer know just how the font will be used? Traditionally, it is the users of type who make these decisions.</p>
    html_clean: |-
      <p>In my experience, manuscripts from different clients come in with various formatting. The usual way we get fractions in a MS is closed up to the number, frequently coded. I imagine we do a lot of things differently from some users; we strip most all coding out of the typescript (MS), and we recode or put in a lot of InDesign tags with EditPad Pro -- including the code for fractions. The reason is that most manuscripts coming in via Word are a jumble of general styles and direct formatting; best to get rid of it &amp; start over.</p>
      <p>We also don't concern ourselves about anyone trying to recover text from a PDF; instead, the assumption is that any "repurposing" will be done via exported &amp; reworked XML files. </p>
      <p>More to the point, it is hard for the type designer to know just how the font will be used; to cover all bases, a lot of features would have to be written. One of my pet grumbles -- how can a type designer know just how the font will be used? Traditionally, it is the users of type who make these decisions.</p>
