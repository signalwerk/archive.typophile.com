      <p>Yes, but it requires an awful amount of contextual substitutions. And, of course, it may generate undesirable results in some situations. In any case, here's one way to do it:</p>
      <p><strong>Warning:</strong> The code below was tested in FontLab *only*.<br>
      <strong>Disclamer:</strong> Use the following code at your own risk.<br>
      <code><br>
      feature frac {<br>
      	@NUMERALS = [zero one two three four five six seven eight nine];<br>
      	@NUMERATORS = [zero.numerator one.numerator two.numerator three.numerator four.numerator five.numerator six.numerator seven.numerator eight.numerator nine.numerator];<br>
      	@DENOMINATORS = [zero.denominator one.denominator two.denominator three.denominator four.denominator five.denominator six.denominator seven.denominator eight.denominator nine.denominator];</code></p>
      <p>	# Replaces numerals before the slash (only 4 digits "deep")<br>
      	sub @NUMERALS' @NUMERALS @NUMERALS @NUMERALS fraction by @NUMERATORS;<br>
      	sub @NUMERATORS @NUMERALS' by @NUMERATORS;</p>
      <p>	# Replaces numerals after the slash<br>
      	sub fraction @NUMERALS' by @DENOMINATORS;<br>
      	sub @DENOMINATORS @NUMERALS' by @DENOMINATORS;<br>
      } frac;<br>
      </p>
