      <p>Yes, you could either substitute the space between numeral and numerator, maybe even taking into account a fraction following the numerator(s) -- which however blows up the feature code for just a little effect.<br>
      Or, you could solve this by positioning and reduce the space's advance width. The contextual rule would have to be the same as the one used for substitution.</p>
      <p>Regardless of the implementation, this may be considered a border case. Is this still kerning, i.e. a spacing correction, to be applied by default? Or does it belong to what I call "typographic spacing" which also includes adding space before colon, semicolon, exclamation and question mark, etc? This then would be optional and be covered in a different feature than "kern".</p>
