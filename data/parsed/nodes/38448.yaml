      <p>I understand. For a particular client who knows about possible limitations this may be ok. Couldn't you check some text samples with them: for recipes maybe you can limit fractions to one numeral before the fraction-slash; I think what's needed is simple things like 1/8, 1/16 etc. Then they need not care for 1 1/2 -- though typographically Nick's hair/thin space solution is even better.</p>
      <p>Extending Nick's example, you could add a bit more contextuality and move it into a separate lookup:</p>
      <p>feature frac {</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;# first step, substitute slash with fraction,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;# but only if it's inbetween two numerals,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;# and if it's not a date:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup step1 {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ignore sub slash' @NUMERALS @NUMERALS slash; # exclude 2/12/07<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ignore sub slash @NUMERALS @NUMERALS slash'; # exclude 2/12/07<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ignore sub slash' @NUMERALS slash; # exclude 9/1/2007<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ignore sub slash @NUMERALS slash'; # exclude 9/1/2007<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub @NUMERALS slash' @NUMERALS by fraction;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;} step1;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;# only then substitute numerators/denominators:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup step2 {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# below I omit the additional contextuality given in Nick's example<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# since we cared for these contexts in lookup "step1" already:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# (A)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# only one numerator digit:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub @NUMERALS' fraction by @NUMERATORS;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# (B)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub [fraction @DENOMINATORS] @NUMERALS' by @DENOMINATORS;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;} step2;</p>
      <p>} frac;</p>
      <p>(A) If you want to allow for two numerators (but then the typographer definitely has to use hair/fine spaces in some cases), you add one line:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub @NUMERALS' @NUMERALS fraction by @NUMERATORS;</p>
      <p>(B) If you want to restrict the number of denominators to two, the last line should look like this:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub [@NUMERATORS fraction] [fraction @DENOMINATORS] @NUMERALS' by @DENOMINATORS;</p>
      <p>Same caveat as for Miguel's example [I like the idea: frame numerator-fraction, then substitute the other numerators inbetween!].<br>
      The more specific a feature gets, the harder it is to anticipate cases in which it shall NOT be applied. A feature only sees a glyph sequences but not their meaning.</p>
      <p>Sorry for another long post.</p>
