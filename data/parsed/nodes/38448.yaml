      <p>I had a brief e-mail conversation with Tal Leming a couple months ago about just this sort of thing. Even though the OT spec recommends that {frac} be applied only on an as-needed basis to a limited string, I felt that there were plenty of occasions where it would be more desirable to be able to apply it globally and then manually turn off only the few exceptions. James's cookbook scenario is just the sort of thing I had in mind. Tal's trial solution was similar to the one Nick put forward. </p>
      <p>In addition, the thing I brought up to Tal (and something which is implied by Nick's 5 1/3 example) is that editors will naturally input a space to separate integers and their related fractions, whereas in typesetting, you generally don't want an intervening space. Deleting those spaces manually is a tedious layout task. To eliminate the need for manual adjustment, Tal devised a substitution that replaced a space that follows a figure and precedes a numerator with a special "fraction space". </p>
      <p>I'd have to go back and find the e-mails to recall the exact code. This was just a theoretical exercise, since I didn't have a specific font or client in mind -- only a common situation that I'd run into many times that I thought might be solvable. I haven't had occasion to fully test Tal's sample code or implement it. </p>
      <p>But the "fraction space" issue is actually separate from the "global fractions" issue and I think worth considering as an inclusion in a more conventional {frac} implementation, so that a designer could include the leading space when applying the {frac} feature in the standard manner, thereby eliminating the space in typeset presentation, but leaving it in the underlying text encoding, so that if the material gets repurposed into another format (one without proper fractions) the intervening space remains to indicate the difference between eg. 1 5/16 and 15/16.</p>
      <p>-- K.</p>
