      <p><em> ’frac’ is supposed to be applied to the relevant fraction string,</em></p>
      <p>However, with James' slash-backward stipulation, it can be built in to a style sheet and applied to whole stories.</p>
      <p>Thus, numbers composed of whole integers, such as dates, money, page number references, etc., will remain "non-numeratored", and only " integer+(figure-slash-figure fraction)" will require individual attention, which is the way it is supposed to be now anyway.</p>
      <p>In North American newspapers and magazines, for instance, this would work for baseball reports, which are full of statistics, and the only text requiring manual adjustment would be "pitched 5 1/3 innings", where the fraction feature would have to be de-selected for the "5".  Even there, inserting a hair space between integer and fraction (as certain Typophilers are wont) does away with the need to edit the feature setting.</p>
