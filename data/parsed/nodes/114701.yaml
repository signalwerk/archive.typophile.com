    html: <p>This looks to me like <a href="http://www.fontshop.com/fonts/downloads/storm_type_foundry/baskerville_10_pro_regular/ot_ps?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=65&amp;sample_text=B%C4%9Bla%20Kol%C3%A1%C5%99ov%C3%A1&amp;ft=liga" rel="nofollow">Baskerville 10 Pro</a> by František Štorm. I think it is nice to see that they apparently picked a Czech digitisation of a British typeface for announcing the exhibition of a Czech artist in Britain.</p>
