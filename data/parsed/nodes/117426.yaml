    <p>According to wikipedia the Haas Foundry produced Akzidenz-Grotesk:<br>
    <a href="http://en.wikipedia.org/wiki/Haas_Type_Foundry" title="http://en.wikipedia.org/wiki/Haas_Type_Foundry">http://en.wikipedia.org/wiki/Haas_Type_Foundry</a><br>
    I was always under the impression that Akzidenz-Grotesk was a Berthold typeface design.<br>
    Were Haas at some point licensing AG from Berthold, or did they have their own version?</p>
