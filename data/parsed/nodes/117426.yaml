      <p>When talking about the history of Akzidenz Grotesk and Neue Haas Grotesk / Helvetica, one has to keep in mind that Französische Grotesk was one of the models that was used for the design of Neue Haas Grotesk / Helvetica.<br>
      <a href="https://www.flickr.com/photos/kupfers/5933679233/" title="https://www.flickr.com/photos/kupfers/5933679233/">https://www.flickr.com/photos/kupfers/5933679233/</a><br>
      On its turn, Französische Grotesk origins in Breite Grotesque by Schelter &amp; Giesecke. Of which I think that it also served as a model for Berthold’s Akzidenz Grotesk.  But the history of sans serif in Germany does not start with Schelter’s Breite Grotesque, of course … ;–)</p>
