      <blockquote><p>According to Jaspert, Berthold introduced Standard, also called Akzidenz-Grotesk, in 1896.</p></blockquote>
      <p>It rather was the other way round. Berthold introduced the first weight of Akzidenz Grotesk in 1896. It was Akzidenz Grotesk schmalfett (bold condensed). In English speaking countries Akzidenz Grotesk was sold as Standard.</p>
      <p>Especially in the metal type era, ‘produced’ does not mean ‘introduced’, let alone ‘designed’. So when you find a Linotype catalogue which lists Akzidenz Grotesk as ‘produced by’ Linotype, it does not imply that Linotype designed that typeface. The same applies to foundry type in a similar way in many cases.</p>
      <p>In the late 1950s Berthold licensed Akzidenz Grotesk to Linotype. Günther Gerhard Lange told me that the idea behind it was that the availability of Akzidenz Grotesk on Linotype’s line caster would enhance sales of Berthold’s foundry type. In those days, the Swiss Typography movement promoted the idea of specifying a single type family for house style projects (corporate design). In order to be able to design and produce corporate brochures and magazines with the typeface(s) as specified in a corporate design manual, the availability of such typefaces on line casters (such as Linotype and Intertype) or typesetting machines such as Monotype thus became crucial. </p>
      <p>From my experience in doing some research on the origin of German sans serifs, I think that the listings at the Klingspor Museum website are rather accurate.<br>
      <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Haas/Haas.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Haas/Haas.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Haa...</a><br>
      But the trouble with listings such as Jaspert, the Klingspor site and Wikipedia, is that they do not mention a source per entry … Unfortunately the entry of Akzidenz Grotesk in the PDF on the Haas foundry at the Klingspor site does not tell as from which year Haas has been producing Akzidenz Grotesk. Also the PDF does not include images which show how the typefaces that were produced by Haas such as Akzidenz Grotesk and Normal-Grotesque may have looked like. It would probably take to go through all of the sources mentioned at the last page to find out where Hans Reichardt (the author of this PDF) obtained this information from …</p>
      <p>Fortunately, Indra Kupferschmid did so and found this specimen of Normal-Grotesk - Grotesque by the Haas’sche Schriftgiesserei here:<br>
      <a href="https://www.flickr.com/photos/kupfers/6198185700/" title="https://www.flickr.com/photos/kupfers/6198185700/">https://www.flickr.com/photos/kupfers/6198185700/</a><br>
      This specimen tells us that Normal Grotesk and Akzidenz Grotesk are different designs. The notes by Indra also tell us that we cannot rely blindly on names or their spelling. </p>
      <p>The inaccuracies, incompleteness and missing references of Jaspert, Berry &amp; Johnson’s Encyclopaedia of Typefaces and the Klingspor PDFs, combined with other people compiling informations from ‘mixed sources’ leads to curiosities such as this one here in the listing of typefaces as produced by Haas:<br>
      <a href="http://en.wikipedia.org/wiki/Haas_Type_Foundry" title="http://en.wikipedia.org/wiki/Haas_Type_Foundry">http://en.wikipedia.org/wiki/Haas_Type_Foundry</a><br>
      Profil, 1947, Eugen and Max Lenz, Bitstream<br>
      Of course, Bitstream (founded in 1981) has nothing to do with the ‘origin’ of Profil (issued by Haas in 1947) …</p>
