      <div class="comment-spam-body"><p>According to Jaspert, Berthold introduced Standard, also called Akzidenz-Grotesk, in 1896. Haas produced a type named Normal Grotesque based on Standard but the designs are different. No date for the Haas version is given, nor does Jaspert indicate Normal Grotesque was ever called Akzidenz-Grotesk.</p>
      <p>Wiki says Haas produced Akzidenz Grotesk, implying they introduced it. The Wiki also lists both Akzidenz-Grotesk and Normal Grotesk. Someone who knows the true history would be welcome to clean up these discrepancies.</p>
      <p>Just guessing, but it is quite likely Haas may have introduced Normal Grotesque as a "similar to" type then later licensed Akzidenz-Grotesk from Berthold because they produced other Berthold designs later on.</p>
      </div>
