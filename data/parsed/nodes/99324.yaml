    <p>Dear Typophiles<br>
    My second typeface is now live on Google fonts <a href="http://www.google.com/webfonts/specimen/Donegal+One" title="http://www.google.com/webfonts/specimen/Donegal+One">http://www.google.com/webfonts/specimen/Donegal+One</a><br>
    Please comment and critique because as with my previous type Headland I intend to develop a print version and all comments will be gratefully received. </p>
    <p>A big thank you again to Eben Sorkin without whom it would not have happened.<br>
    Thanks</p>
