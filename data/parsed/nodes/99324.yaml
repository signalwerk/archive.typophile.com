  - id: 536316
    user: 5094
    date: 2013-01-03T17:24:00
    date_raw: 3 Jan 2013 — 5:24pm
    votes: null
    html: |-
      <p>OK, here's what I see. Doesn't make me right, and I'm much more comfortable when I can play with a font, but...</p>
      <p>Spacing may be off as hrant says, but I'd have to get it up in a metrics window, then print out a page of text I set, to comment. Just how my mind works.</p>
      <p>On to the lower case. These are things I'd try before doing any work on spacing:</p>
      <p>I really like the g. A hard character to do, your balance here is quite nice. </p>
      <p>The rest of the letters with descenders: the p and q are OK, deep enough to hold their own with that g. But something's amiss with the y, the descender just doesn't support the rest of the letterform. You could make both the v and y slightly narrower -- not more than 5/1000, but I'm not sure that would help, or even be the right approach. You could make the descender a little longer &amp; see how things look. You could raise slightly -- 2 to 5 1000 -- the junction of the y's arms, which perforce strengthens the descender, at the expense of the v-shape.</p>
      <p>I'd probably take 2 to 3 1000 out of the width of the n, h, and u. I *think* you've got the balance with the 3 about right, they're just a tiny bit wide.</p>
      <p>Caps -- I'm not so good with caps, but yours look fine to me, except... somehow, when the accents get added, they go wrong. I'm not sure why. Again, the first thing I'd try -- for print, anyhow -- is to make the acute/grave a little longer, and probably change the angle. I'd be tempted to just try the lc accents on the caps, at least for print. Nobody sets solid anymore, or even uses just 2 points of leading. I'd risk some tightness in the leading with accented caps if it made the glyphs look better.</p>
      <p>It may be optical, but the macron looks thinner on the caps than the lc. That's not right. Same with the spacing of the dieresis dots, cap versus lc.</p>
      <p>As I'm sure you know, for print, you need os figs &amp; small caps. And of course, an italic...</p>
      <p>This is a nice font. Personally, I'd be willing to put in the 3-4-5 days work on it I usually spend on any font, libre or no, in the hope of something rather special. Uh, if the italic's as good...</p>
      <p>Edit: And I'd try an r with a bit shorter arm. You may have it right, but I'd like to see it a few units shorter to be convinced.</p>
