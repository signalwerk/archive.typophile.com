      <p>@Eben: Don’t know about the earliest examples dates in inscriptions, but [V] and [U] were obviously related, as in the beginning there was just [V]. In manuscripts the form is already in use for v in rustica, and then in most uncial forms following that, so I think Hrant is pretty right.<br>
      I see an eloquent example of the rustic calligraphy model here: <a href="http://www.edicionesemilianenses.com/rusticen.htm" title="http://www.edicionesemilianenses.com/rusticen.htm">http://www.edicionesemilianenses.com/rusticen.htm</a></p>
