    html: <p> Good question. I think it had less to do with logic and more to do with character and balance. Or maybe both.  <br><br>I started with the lowercase ‘d’, then the ‘g’. To me, the beginning and ending character is the most important part of a trademark, so I worked hard on those. The ‘d’ had an upper straight serif too, as well did the rest of the appropriate characters once I completed the ﬁrst draft. Then I drafted the uppercase with even serifs too.  To make a long story short, the whole thing was F*@*d up. The lobes were too short and the bowls were narrow. the ears and tits were unusually long. I redrafted the whole thing, normalizing and balancing it along the way.   <br><br>I always knew the ‘hth’ in “diphthong” was going to be problematic when put together.. most people don’t pick up (read) the ﬁrst ‘h’, they think dip-thong, but I think that has more to do with psychology and the way we read things.  Regardless, I wanted it to blend together so I dropped all the upper straight serifs on the lowercase only so the “D” has standing power.  <br>For the uppercase, the logic for why some have serifs and some don’t is purely just me. It follows my handwriting.  <br><br>Thanks for the compliments, Alejandro, your work and site is fantastic&nbsp;too. </p>
    html_clean: <p> Good question. I think it had less to do with logic and more to do with character and balance. Or maybe both.  <br><br>I started with the lowercase ‘d’, then the ‘g’. To me, the beginning and ending character is the most important part of a trademark, so I worked hard on those. The ‘d’ had an upper straight serif too, as well did the rest of the appropriate characters once I completed the ﬁrst draft. Then I drafted the uppercase with even serifs too.  To make a long story short, the whole thing was F*@*d up. The lobes were too short and the bowls were narrow. the ears and tits were unusually long. I redrafted the whole thing, normalizing and balancing it along the way.   <br><br>I always knew the ‘hth’ in “diphthong” was going to be problematic when put together.. most people don’t pick up (read) the ﬁrst ‘h’, they think dip-thong, but I think that has more to do with psychology and the way we read things.  Regardless, I wanted it to blend together so I dropped all the upper straight serifs on the lowercase only so the “D” has standing power.  <br>For the uppercase, the logic for why some have serifs and some don’t is purely just me. It follows my handwriting.  <br><br>Thanks for the compliments, Alejandro, your work and site is fantastic&nbsp;too. </p>
