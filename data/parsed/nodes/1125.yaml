    html: <p> Cool face. The organic surprises make this design worth while. <br> <br>I really enjoy the contrast of the amorphous bulbous protrustions and the techie geometrics. My first reaction upon seeing it was that the inconsitencies in line widths would make for a bumpy read (the s feels thick compared to the r, for example), but upon examining your sample copy, I think it works great (from what I could see on screen). The numerals seem to lack some of the quirky flair of the lower and upper cases. </p>
