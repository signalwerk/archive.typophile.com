    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Ellipsis</strong></p>
    <p>In grammar - The name for the intentionally omitted words or letters from a sentence or&nbsp;word.</p>
    <p>In printing terms - the name for the symbols inserted in to a sentence or word to indicate a missing **** or&nbsp;l*tter.</p>
    <p>In both cases the the key is that the sentence or word is still understood. The fact that it may be that some readers insert an incorrect word or letter is irrelevant. “fish” or the letter “i” may seem the perfect choice in the previous paragraph to some&nbsp;people!</p>
    <p>Also ellipsis can be used to indicate that the writers thoughts are drifting off&nbsp;and…..</p>
    <p>Unicode: <a href="http://www.fileformat.info/info/unicode/char/2026/index.htm">U+2026</a></p>
    <p><strong>Discussion:</strong><br><a href="42278">Ellipsis&nbsp;style</a></p>
