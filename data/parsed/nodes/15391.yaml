    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Ellipsis</strong></p>
    <p>In grammar - The name for the intentionally omitted words or letters from a sentence or word.</p>
    <p>In printing terms - the name for the symbols inserted in to a sentence or word to indicate a missing **** or l*tter.</p>
    <p>In both cases the the key is that the sentence or word is still understood. The fact that it may be that some readers insert an incorrect word or letter is irrelevant. "fish" or the letter "i" may seem the perfect choice in the previous paragraph to some people!</p>
    <p>Also ellipsis can be used to indicate that the writers thoughts are drifting off and.....</p>
    <p>Unicode: <a href="http://www.fileformat.info/info/unicode/char/2026/index.htm" rel="nofollow">U+2026</a></p>
    <p><strong>Discussion:</strong><br>
    <a href="42278" rel="nofollow">Ellipsis style</a></p>
