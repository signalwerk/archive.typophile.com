    html: |-
      <p>Late 19th century book designer, type designer and fontographer who revived medieval designs and was a major influence on the style of published books. His fonts are a fusion of Blackletter and Roman. His books used very ornate designs often involving vines and leaves. Your _O_ is a comfortable companion to his designs. More <a href="http://en.wikipedia.org/wiki/William_Morris" title="http://en.wikipedia.org/wiki/William_Morris">http://en.wikipedia.org/wiki/William_Morris</a> There is a lively discussion of his influence at <a href="http://typophile.com/node/114418" title="http://typophile.com/node/114418">http://typophile.com/node/114418</a><br>
      Don</p>
