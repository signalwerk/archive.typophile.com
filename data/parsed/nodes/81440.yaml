  html: |-
    <p>The Late Spring 2011 Rejuvenation catalogue arrived a couple of days ago—covered in typographic fun. Someone there clearly knew what they were doing when they set up the shoot:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/reju-cat-spring2011_3936.jpg"></div><p></p>
    <p>Wood letter print on the wall; <em>Helvetica Forever</em>, <em>The Living Alphabet</em>, and a pile of Emigres (Issue 32 on top) on the table (along with others in the stacks I don't recognize).</p>
    <p>Good books and good lights, together.</p>
    <p>Mcs</p>
