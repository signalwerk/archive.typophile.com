    html: |-
      <p>Basically, "penYOH" (silent h). Your "penWAH" would be a pronunciation of Penoit (like Mandelbrot's given name but with a "P"). As for "pegNOH", it's somewhat un-French, but might be written as "Peguenot" (in which case the [second] "e" would be distinctly pronounced though).</p>
      <p>hhp</p>
