      <p>⇒  <em>This is a dumb question</em></p>
      <p>Nope, not really, Chuck.<br>
      I really noticed a couple of years ago how many different ways my typography students pronounced Benguiat and even Helvetica.</p>
      <p>But so many times typefaces are often proper names or from different languages that no one could absolutely know until they heard the proper pronunciation.</p>
      <p>When ITC released Veljovic, I completely mispronounced it until I actually sat next to Jovica Veljović on a bus between venues at an ATypI conference.</p>
      <p>A while ago I did remember seeing a pronunciation guide to typeface names, but where I can't recall.</p>
