    <p>This is a dumb question, probably, but one that trips me up a lot.<br>
    How is the Cassandre font <a href="http://www.linotype.com/1328/peignot-family.html" rel="nofollow">'Peignot' </a>pronounced? I've always thought is was "pen-wa," but several French-speaking students of mine insist it's "peg-no."<br>
    My French ain't so hot. Can anyone help?</p>
    <p>Chuck</p>
