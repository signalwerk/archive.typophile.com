    <p>Hi All,</p>
    <p>I am a final year student at Nottingham Trent University, desperate for some primary research for my dissertation on typography.<br>
    I was wondering if anyone could offer their opinion on any of the following questions...</p>
    <p>Is typography a craft?<br>
    Has the quality of type design been affected by digitization?<br>
    Are all new typefaces just an imitation of existing designs or is it still possible to achieve original type design?<br>
    Has the internet become saturated with poor quality type design?<br>
    Is it possible to avoid?<br>
    What defines good typography?</p>
    <p>Any help or comments you may give will be extremely helpful and much appreciated.<br>
    Thank you,<br>
    Sophie Metcalfe</p>
