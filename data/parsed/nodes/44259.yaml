    html: |-
      <p>My school (Rice) has had a really strong push for a consistent identity in the past year or two, but I think we're going about it all wrong. First of all, the official university typeface is Trajan, which is not at all distinctive. Anyone who is printing a Rice-related publication needs to use the official university logo, which is a slightly modified version of "RICE" spelled out in Trajan. We are not allowed to set the words "Rice University" or "Rice" in Trajan ourselves; we have to use the Illustrator file.</p>
      <p>I like what is said in that article about thinking of the typeface as a sort of viral marketing for the university; you don't force anyone to use the Yale typeface--you just strongly encourage. You essentially make it as easy as possible for anyone on the campus to fit the identity system. That's not at all what Rice is doing.</p>
      <p>Also (though this is not related to the Yale typeface at all, and I apologize), someone in our Public Affairs department decided that our beautiful 100-year-old crest needed to be updated from <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> to <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> Apparently we need to portray ourselves as an up-and-coming school looking towards the future, as opposed to a well-established, nearly-100-year-old institution that is well-respected throughout the country, despite the fact that <em>that's what we are.</em> Also, the new logo looks terrible when it's printed in grayscale (as most Web 2.0 logos are wont to do).</p>
      <p>EDIT: Also, are students allowed to use the typeface for their academic work (the license doesn't make it clear enough)? Because if I went to Yale, I would totally set every paper I write in that typeface.</p>
