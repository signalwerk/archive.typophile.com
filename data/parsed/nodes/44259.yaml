    <p>As a designer with the <a href="http://www.yaledailynews.com" rel="nofollow">Yale Daily News</a>, I had the pleasure last night of designing a terrific article about Matthew Carter's Yale typeface and the University's overall identity, featuring interviews with Carter, Michael Bierut, and others. The article is available here -- <a href="http://www.yaledailynews.com/articles/view/24465" title="http://www.yaledailynews.com/articles/view/24465">http://www.yaledailynews.com/articles/view/24465</a> -- but the visual aspect of the article on the site is limited. Below I've posted today's front page, a close-up of the article on the front, and the graphic I made for the inside jump. Critiques are welcome, although at this point obviously it's too late to be changed. Hope you enjoy.</p>
