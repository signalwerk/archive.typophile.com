      <p>The Yale typeface is a thing of beauty.</p>
      <p>Also see: <a href="http://www.typophile.com/node/29323" rel="nofollow">http://www.typophile.com/node/29323</a></p>
      <p>Yale is blessed to have Matthew Carter as senior critic for their graphic design program. I only wish Harvard had a discernible university-wide graphic identity (other than a colour scheme), let alone a classy bespoke typeface.</p>
      <p>Good job overall on the design of the article, and I particularly like the drop cap A, a signature Yale glyph.</p>
