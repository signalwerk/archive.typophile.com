      <p>To illustrate just how all over the place Harvard's signage is (not all the pics in the link are Harvard-related):</p>
      <p><a href="http://www.katranpress.com/resources_lettersofcambridge.html" rel="nofollow">http://www.katranpress.com/resources_lettersofcambridge.html</a></p>
      <p>I don't even know if there is an official Harvard logo (contrary to what some Hollywood films suggest, there is no big sign saying "Harvard University" anywhere on campus). There's just a university shield with what I assume is custom lettering. Typeface-wise, it's a real free-for-all between the different schools, the Board of Overseers, different Harvard-related organizations... I do see Minion a lot, though. The Graduate School of Design I think has their own attempt at an identity system, based on Trade Gothic if I recall correctly.</p>
      <p><cite>And, as a proud Yalie, I have to say that I’m very glad that our identity system blows Harvard’s out of the water.</cite></p>
      <p>Hey, we still beat you six out of the last seven times in the Game!</p>
