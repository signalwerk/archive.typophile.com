    <p>Dear friends,<br>
    would you recommend me a condensed serif for headlines?, i was thinking on a slab but any kind of serif would be good</p>
    <p>i need a condensed who works well in big sizes it´s for a Northern europe language... you know big words, opentype characters...</p>
    <p>all recommendations would be appreciated!</p>
    <p>thanks in advance!!</p>
