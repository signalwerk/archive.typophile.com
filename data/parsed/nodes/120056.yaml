      <p>Just at TFJ on Twitter. (I don’t think FB is an appropriate place, but Twitter is definitely appropriate.)<br>
      Or you could try Typekit. They have this great technology that allow you to download and install fonts in their library without paying for the font license as long as you are a subscriber. Of course you won’t be able to extract them and install them elsewhere, but at least you have access.</p>
