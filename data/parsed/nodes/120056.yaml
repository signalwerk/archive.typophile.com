    html: <p>If you haven’t got any responses and you are absolutely sure that he has missed it, whether it be unintentional or intentional, send out a formal Email to his public address for inquiry. I would surmise that TFJ (or Martin Majoor), like most members of the typographic community, is kind enough to reply to a well-intended Email. I got my internship in a letterpress studio by this way too.</p>
