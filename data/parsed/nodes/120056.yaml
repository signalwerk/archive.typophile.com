    <p>Hello!</p>
    <p>I'm doing a research about small typefaces.<br>
    In my study I need to compare some typefaces (the word  "Hamburgevons1268") that are not for sale like Retina (Hoefler &amp; Frere-Jones) and telefont (Martin Majoor).<br>
    Does anyone here has some refences on these typefaces (outside from what is online)?<br>
    I can't find a contact for Martin Majoor...</p>
    <p>Thank you in advance.<br>
    António</p>
