      <p>Any foundry could offer a student discount without specifying which typefaces. Get 30% off when you buy 10 faces, or pick 10 (or 50) from this list, for one price, with proof of enrollment, or whatever. I very much agree there should be student prices for font software, just like there are for other graphic arts software. Every foundry has to decide what prices are appropriate, but it shouldn't present extra problems or dangers to offer this discount; the EULA is still the same, and the student has legit software. Worrying about whether that student will share it is a red herring. Students that pay for their own stuff are not the ones likely to share it. </p>
      <p>Tiff, I would say Dan has a point with value added to fonts: specimens and information. We all need to look at what a typeface can do before we spend money on it. Whatever information is provided increases the possibility of a sale, right? Those specimens and samples are essential to combating the dull sameness of everyone using the same safe Adobe fonts until doomsday. Graphic designers in the US are a very conservative lot in my view, and only use type they've seen used a lot before. They obviously need information and examples to take away the fear of the new.</p>
