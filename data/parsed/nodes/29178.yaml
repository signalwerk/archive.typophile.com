      <p><cite>There are really no “Indie packages” for professionals?</cite><br>
      I don't think that anyone has said that. Only that there is no low-cost indie pack for students.</p>
      <p><cite>Also I think a good Indie pack of say four hundred fonts, would probably be priced pretty high...how many students would pay that?</cite></p>
      <p>My thoughts are more that the price would be much lower, in the $100-$200 range, with maybe 100 fonts–Adobe fluffs up their numbers by including fonts that are already part of Mac OS and the CS suite so 400 number is not a target worth shooting for–and hoping to make up the minuscule margin by selling direct and in large volumes. There's also the simple promotional aspect that a foundry gets by having design students working with its fonts as opposed to the usual Helvetica, Univers, Garamond, Caslon, etc. that make up a lot of what I see in design school. </p>
      <p><cite>This would be the job of your typography teachers, or at least could be part of the typography class...</cite></p>
      <p>They can only do so much. And at a small school like mine, that's only twelve faces getting covered in a semester, many of which will be the old standards. </p>
      <p><cite>EULAs don’t mean squat to students... File-sharing has proven that beyond a doubt...The ONLY way to get students to drop their hard earned money on something they could otherwise get for free is to add value...</cite></p>
      <p>The value here would be getting a sensible collection with useful documentation along with the time saved by not scrounging through every font collection floating around the net for indie fonts. If I had the option of getting one good package at a good price–And no, I don't think Adobe's package is worth buying–I might be likely to stop storing 50,000+ fonts on my iPod and another 5,000 on my laptop. </p>
      <p><cite>P22 has an educational pack that is available to university design labs, but it is not marketed to students directly.</cite></p>
      <p>Do many students even work in school labs anymore? Here at the Corcoran design students are requited have Powerbooks and the CS2 suite, and what computers the school has are mostly for high-end 3D or video, and thus have no fonts that didn't ship with the CS2 suite.</p>
