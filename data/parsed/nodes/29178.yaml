      <p>Be careful to not just say, "Here's a bunch of cheap typefaces because you're a student. This should hold you over until you're making enough money to buy <cite>real</cite> fonts." That will make students want to don their eyepatches and set sail on the file sharing networks.</p>
      <p>It would be a great idea if you were to make it an educational resource as well. Tell us <cite>why</cite> such-and-such is an appropriate alternative to xxx-Premier Pro. Unless we're <cite>in-the-know</cite> about why our new typefaces are equal or better than the others, we're less likely to use them over something that we know will work. I.E., get us a good grade.</p>
      <p>It should also be an investment for the future. Good fonts for us as students to continue using as we progress, and just as important, a resource to teach students about font piracy, etc...</p>
      <p>Give students a good enough reason to want to <cite>buy</cite> fonts and we just might.</p>
