      <p>Off the top of my head...</p>
      <p>Students will buy fonts, not just download them. The catch is, you have to compete with free, which is not impossible. Make a pretty box.  Include enough fonts to get a design student through 4 years. Make sure they are all 'high-tech' enough that it takes the students a few years to exploit all the OpenType nuances. Get it under a hundred dollars. Include a beautiful pdf with histories of the fonts and bio of the living, working designers. Include another pdf of the OT manual. Include an autoplay installer, and a specimen poster and printed book. Include bookmarks to the foundries' sites, as well as to a like-branded site that lets users get new styles every semester from a unique ID in the box (or DL package). USe the same ID to go to allow access to a 'typophile jr.'-like site where the students can get support from each other and the creating foundries and trade ideas on what the fonts can do. This also creates a great place to analyze what goes into the next rev.</p>
      <p>The next step is get it into university bookstores, where they can pick it up and grab it. Give free copies out to facilty, and make sure it is quality enough for them to reccommend. Have it available to be purchased simultaneously online, and if possible, have a 4x more expensive version, for non-students to increase the perceived value.</p>
      <p>If all of the above sounds like way too much work, it might be. The website sounds like a great place to start and to learn if the idea has momentum.</p>
      <p>Keep in mind one of the things that keeps some students from not paying for things that are downloadable is the image of moviemakers, software developers (Gates, Carmack, etc.) and musicians as insanely rich guys. It shouldnt be too hard to not put that across for Type Designers. Just not having the name 'Adobe' on it will probably help the humanity of the potential costomers kick in. </p>
      <p>When my own purchasable fonts come out soon, I am planning on having a student license available, which, unlike licenses, will not be transferrable. However, it will be viable for commercial work; my hope is that it will develop lifetime customers. Ask me in a year or two if it worked.</p>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamchine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
