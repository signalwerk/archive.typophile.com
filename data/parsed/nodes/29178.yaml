      <p>Karsten Luecke: «Ehem, you are not allowed to use educational versions of software this way either …»<br>
      as far as i know, this part changed this year for germany, austria and switzerland - so with anything bought this year, you're right, yes. my knowledge is that before, it was legaly to do so.</p>
      <p>sii, i think everybody understands the small foundries fear of having their fonts spread over p2p-networks. BUT, fact is, they already are! you can get pretty much ANYTHING, even rare typefaces like didot elder. so its not a question of IF they are there, its a question of "are there alternatives for students" who are also possible future customers of indie foundries. of course there's the typical "use system fonts or buy one font per month, because you cant afford more", but we all know that the reality is different.</p>
      <p>in my opinion, underware is still a good example: if a foundry can achieve a good image with trendsetters, many people will follow. i have the sauna-book and im on their website every other week. likewise with ourtype, i attended a talk with fred smeijers and loved their sansa and their website.</p>
      <p>some kind of "indie font collection for students" could have the same effect for the part-taking foundries. of course its a risk, but the reality right now is that students dont buy many fonts, they just download them. but as small foundries you have a way better image than adobe or linotype ("the small guys" and so on), and i actually think that small foundries could benefit from it.</p>
