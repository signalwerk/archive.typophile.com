      <p>Before anyone thinks  me unfair, I want to add:</p>
      <p>A huge problem, as I see it, is that students are very font saavy and aware of everything out there. It is a huge burden on them and it creates a desire to use these great fonts in their projects. But, the burden is never lifted by the teachers or those around them. So the students find themselves having to have the fonts. (I went through this myself.) </p>
      <p>I personally think that there <strong>should</strong>  be a solution to this problem. One obvious solution is that the teacher's alleviate some of this undo pressure by assigning the fonts to the students which they can choose from to solve the problem. Another solution is to have the department head approach a foundry and make a deal with them based on x-number of workstations. It has to be done at that personal of a level. I think.</p>
