    html: |-
      <p>As far as the licensing I think you will need to make "your package only" licenses that are consistent, then invite Indies that you want on board, selling the market to them as much as the other way around. If I paid money for a disc of fonts, and each had it's own terms, I'd be more than a little irked. On the other hand, I wouldn't mind if there were some editable fonts to learn from and build upon, like 'Lab's free font or that one from SIL. But I would expect consistency of product amongst any restricted ones, whatever that might be. I'd suggest talking to a very small number of those Indies you would want to include first, and draft a license for them, that they can collaborate on, then use that amongst the rest.</p>
      <p>Now, it's tangent time...</p>
      <p><em>is in part a reaction to Lupton’s free font manifesto, which I find interesting but reject because I find it to be anti-capitalist.</em></p>
      <p>I neither reject, nor endorse. It still too early in the game for me to take a stand, and I imagine it won't matter either way. No matter what I or others here feel, that free (as in hippie) fonts will take the place of the commercial workhorses. These fonts take advantage of the legal ignorance of the creative factor if type design and its reflection in US (and hence, worldwide) intellectual property policy on fonts. Eventually, a lower priced product will win, all other qualities being equal, and plain-jane book fonts will become absolute commodities. It is just too hard to compete with free.</p>
      <p>The inevitability comes from the fact that once one person does the work its there, forever, so free code only grows. It's okay, I suppose. The market will change afterwards and like how  Sun, Redhat and IBM have adapted to FOSS, we may adapt to FOSF? I sorta don't even mind (maybe), as part of it is retaliation by those who pushed copyright too far first.</p>
      <p>Speaking of tangents and FOSS, I have to say, this Firefox 2 auto spell checking is quite nice.</p>
      <p>-Choz</p>
