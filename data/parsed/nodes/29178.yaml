      <p><cite>Forgive me if I’m wrong, but if you’re a typical graphic design student with a Mac and the Adobe Creative Suite and Microsoft Word, don’t you already have quite a selection of fonts?</cite></p>
      <p>Yup. But beyond the CS fonts (no MS Office on my machines, and there never will be.) I'm still interested in licensing more stuff for school use, and I generally find indie fonts to be a lot more interesting than the typefaces from Adobe, which feel like a massive collection of book faces and workhorses. </p>
      <p><cite>With an income of $200 is one likely to think the best crack at the student market would be while they have school loans?</cite></p>
      <p>Probably. I see a lot of senior design students prepare for graduation by buying Powermacs, piles of design books, and loads of fonts just because the student loan rates are so low right now. Anything I buy is coming from loan money (since scholarships don't nearly cover tuition) and this being my second time in school and my second career, I'm pretty anal about my spending at times.</p>
      <p><cite>So, perhaps I should stick to one point, for now. How many faces and how many fonts does a design major need for a college education?</cite></p>
      <p>That depends on one's major, school, and professors. While I'm sure some schools are happy to leave students to the fundamentals, others are really trying to draw attention to their programs, and expect students to really push boundaries and do wild new stuff and want to see a lot of hot new type in use.</p>
      <p><cite>I ithnk one of the things that jpad wanted was an escape from the barrage of word/adobe fonts. Or, at least, to plant fresher seeds in the students’ minds.</cite></p>
      <p>Bingo. I've seen what availability did in terms of homogenizing web typography, and I often see students who don't pirate type fall into using the same Adobe fonts over and over. This concept came out of a couple recent discussions, and is in part a reaction to Lupton's free font manifesto, which I find interesting but reject because I find it to be anti-capitalist.</p>
      <p><cite>So when’s the release date, jpad? :)</cite></p>
      <p>It depends. I just changed my major to plain vanilla graphic design, which means that I'll have to take more classes than I was planning over the next year-and-a-half. I'll probably start a web site of useful resources for design students this winter and do a bigger relaunch next summer if it seems like something I can get capital for. I'll have to explore licensing a lot more before I try to put an actual together.</p>
