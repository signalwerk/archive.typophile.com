      <p>I don't know how I feel about a lot of this. </p>
      <p>The educator in me says that the student should be able to use a set of classic fonts that the school provides, and be encouraged to draw any idiosyncratic display they need as lettering. At Parsons, the students have access to a great selection of software and some very decent fonts on every university workstation.</p>
      <p>As to students purchasing software (fonts included) I hear students talk all the time of going in halves or in threes to spread the cost out and then share the software. When I point out that is is not quite legal, they usually just giggle.</p>
      <p>I also have had more than one graduate student ask for free copy of ClearviewHwy for use on their thesis project, I comply but only after requiring a lot of documentation from them and their professors. They also must sign an education license, which has some fairly demanding terms in it. It is interesting how the interest in free fonts drops off once you ask for a little proof of commitment  from them and their supervising professors.</p>
