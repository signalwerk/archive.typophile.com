      <p><cite>Well, there are the Indie Font books which come with a CD full of indie fonts.</cite></p>
      <p>I was thinking about this too, but aren't most of the included types wild display types? I don't recall them being especially versatile, but it's been at least a year since I looked. </p>
      <p><cite>But it takes years of education and honesty to get a collector (student or otherwise) to do the right thing.</cite></p>
      <p>Not necessarily. I know plenty of professional designers with massive font collections which they treat sort of like specimen books; fire up the font management tool, see what a headline looks like in every font sold by Adobe, Bitstream, Linotype, Monotype, FontShop, House, etc. and then buy the one or two that they like. I'm not claiming this is right, just that collectors do buy type.</p>
      <p>The point that several people have made is that getting foundries to agree on a EULA is the big issue I hadn't thought of, and you're all right, in many cases it would probably be a dealbreaker. Now I think it might be better to just set up a student-oriented type site, with links to the free font sections of the indie foundries out there, and weekly articles featuring specimens. The site could be supported with advertising, cost less to put together, and not be the logistical nightmare that trying to get a lot of indy foundries to agree on a package would be. I know a lot of these exist already in FAQ form on the major type/design forums, but doing something a little more substantial might work better.</p>
