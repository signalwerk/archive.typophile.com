      <p>So far I've seen a lot of useful help for buying individual fonts, but what I'm really interested in is the possibility of creating some sort of indie font pack that could be licensed to a large number of students at a low per-student sale price. A book/eBook with a page for each font/foundry/designer could be included as well, so that students would be able to learn more about the fonts and gain an appreciation of all the little guys out there who do great fonts.</p>
      <p>Does this seem like the kind of thing that type designers, design educators, and design students might actually be interested in? I realize that the logistics are nightmarish, but who knows, I may be able to start talking to some people and get something rolling...</p>
