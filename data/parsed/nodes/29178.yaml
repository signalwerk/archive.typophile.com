      <p>EULAs don't mean squat to students. </p>
      <p>Period.</p>
      <p>File-sharing has proven that beyond a doubt. The principle of the thing is great. The reality just isn't.</p>
      <p>A EULA can say whatever it wants. Reality has to step in at some point in the equation.</p>
      <p>The ONLY way to get students to drop their hard earned money on something they could otherwise get for free is to add value to it. It's called value-added marketing, and even if that "value" is just a bit of educational wisdom that comes with a purchase it still has a higher chance of survival on the market than one without it. </p>
      <p>That's one reason why I as a student haven't bought anything from Fontshop.com. They don't list any of the qualities, attributes, history, etc. about their fonts that might make me want to buy their product over another foundries. For instance, I only bought Bodoni Classico after reading the "You Say Bodoni, I Say Bodoni..." article by Dave Farey. That info is nowhere to be seen in FF land. And even if it is, then the user interface sucks and needs to get fixed anyway.</p>
      <p>Instead of worrying about semantics, foundries need to be focusing on the reality of trying to get a student to value his fonts over his beer. Is this package of nice, decent, useable fonts worth more to me this semester than wasting my money on booze or whatever? You'd better well convince me, cuz I'm getting thirsty and my broadband is calling out to me to download something.</p>
