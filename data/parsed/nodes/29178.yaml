    <p>This is coming from something I brought up in another thread. I've noticed that students tend to use a lot of "classic" types from Adobe, and to some degree I think this might be because Adobe seems to be the only foundry with a low-cost collection of type for students. To me this seems pretty tragic, as it means some designers will leave school having never used a font Adobe isn't selling, and that means we'll keep seeing those fonts again and again, until we all die, especially from the designers who settle on a few faces early and never switch.</p>
    <p>Are there any such collections from other foundries? Have any of you thought about giving students a discount on your typefaces and decided against it? If so, why? If someone started a service that licensed fonts only for resale at a discount to students and educational institutions, would you be willing to sell your typefaces that way?</p>
