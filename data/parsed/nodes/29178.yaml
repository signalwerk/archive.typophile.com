      <p>Dan, all:</p>
      <p>Yes, I'm very aware of how the fonts are distributed. There is an entire new thread here which we could start. But it takes years of education and honesty to get a collector (student or otherwise) to do the right thing. It takes the teachers be responsible enough when they are teaching typography to spend a little time showing the students how to license type, how to read and understand a EULA. Then the student must adopt the right attitude. (This could easily be applied to a boss/employee scenario.) </p>
      <p>Everyone says we need more education, but no one listens when little bits of education are offered. Typophile is proof that there is education available. It is up to us, the typophiles, to take what we learn here and do our utmost to apply it to our daily lives.</p>
      <p>I think Thierry mentioned the EULA because of the same reason in regards to what he said to me.</p>
      <p>The negative answer: But, honestly, if a student can't respect a EULA without having to be given a golden carrot too, then the chances are that student will never be a client to a foundry anyway. </p>
      <p>The postivie answer: Many foundries know that marketing is important. For instance, Veer does a great job at appealing to designers, student and otherwise. Is that what you mean by marketing Dan? FontShop does marketing as well. They have their monthly newsletters with juicy information about a variety of topics and they usually include a free font to boot. The smaller foundries do what they can for marketing, but they can't afford to do it as big as Veer. That is expecting too much. At the end of the day the value comes from the font itself. I may love the Veer catalogues, but the catalogues aren't my tools, the fonts are. I need to know those fonts are technically sound as well as visually appealing.  I look to large and small foundries alike. I am sucked in by pretty marketing, all designers are, but it is the pretty typefaces that keep me interested. That doesn't take a lot of marketing. It just takes a decent site with a good type tester.</p>
      <p>Dan, maybe I'm not following what you are meaning to say.</p>
      <p>So, for instance, if FontShop started adding the history of the fonts on the preview pages you would consider that a value-add? I really want to understand.</p>
