      <p>The idea of what something should cost is endlessly debatable, and in the end comes down to the least someone will pay, and the least the owner will give it up for. But experience will help one understand the range of reasonable prices, and customers that end up thinking they paid too much will be angry and not repeat, so what a tutor or teacher feels is reasonable has some value, esp. before something goes to market.</p>
      <p>I think that what jpad is suggesting here is something very "introductory priced". So, compared to the market, whatever price it may be will be very aggressive (meaning relatively a bargain), to capture a new market. If this were to fly, it would be because indie foundries are creating "loss leaders" to garner attention to their work.</p>
