    html: <p>Could be <a class="freelinking external" href="http://www.flickr.com/photos/depressionpress/2080847355/" rel="nofollow">Othello</a>, an old ATF font, never digitized to my knowledge. The closest I know are <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/velvet/" rel="nofollow">Velvet</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/macbeth/" rel="nofollow">MacBeth</a>.</p>
