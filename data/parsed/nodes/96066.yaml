    html: |-
      <p>Yes, Velvet looks quite accurate; MacBeth is more ornate.</p>
      <p>An outline version of Othello was created by Dan Solo and included only in the Dover Book/CD "24 Outline Fonts". It doesn't seem to ever be sold separately.</p>
      <p>A solid version, as well as a matching  fill version, was recently (2009) produced by 'Character' and is available <a class="freelinking external" href="http://abfonts.freehostia.com/" rel="nofollow">here</a>. They are probably back-creations from the Solo font.</p>
      <p> - Herb</p>
