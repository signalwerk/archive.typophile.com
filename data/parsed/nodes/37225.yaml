      <p>My first imulse was to say 'hand-drawn', but on closer inspection it could certainly be an OpenType font with alternate endings. I agree this style is like Jill Bell's work, but Ronna Penner (Typadelic) also has this feel at times in her fonts. In fact, it somewhat resembles her <a href="http://www.myfonts.com/fonts/typadelic/black-jack/" rel="nofollow">Black Jack</a>, which is a free font.</p>
      <p>- Mike Yanega</p>
