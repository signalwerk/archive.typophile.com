    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : Superpolator</strong></p>
    <p>Superpolator is a piece of software created at <a href="/wiki/Letterror" class="freelinking" rel="nofollow">Letterror</a> used to do advanced <a href="/wiki/interpolation" class="freelinking" rel="nofollow">interpolations</a> with multiple inputs. Superpolation differs from standard interpolation algorithms which use only two sources for input. Superpolator is based on the <a href="/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a> toolset.</p>
    <p>URL: <a href="http://www.letterror.com/code/superpolator/" title="http://www.letterror.com/code/superpolator/">http://www.letterror.com/code/superpolator/</a></p>
