      <p>Well, there are many... Many I've bought and NEVER found a use for, too — but <a href="http://www.hubertjocham.de/item.php/type/sans/Monday/" rel="nofollow">Monday Light</a> by <a href="http://www.hubertjocham.de/page.php/me/" rel="nofollow">Hubert Jocham</a> comes to mind. Especially due to its ‘wide stance’ and odd lowercase g’s… A nice typeface, though… ;)</p>
      <p>Bought that one for a magazine spread. I believe it had something to do with the environment…</p>
