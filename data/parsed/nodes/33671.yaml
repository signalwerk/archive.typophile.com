    <p>Hi Everyone,</p>
    <p>I am senior in the design school in NYC and about graduate in this summer. I have a portfolio class at the moment. Our teacher asked us to give our portfolio files and give it to them. They even dare enough to ask to put the fonts that we used to the cd. (Outlines is still acceptable) if we dont give our portfolio files they would fail us. I opposed this idea but apparently I still have to give the files.</p>
    <p>Please let me know if you have any suggestion.</p>
    <p>thank you</p>
