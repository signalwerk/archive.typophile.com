    html: |-
      <p><cite>Our teacher asked us to give our portfolio files and give it to them. They even dare enough to ask to put the fonts that we used to the cd.</cite></p>
      <p>If you look at the student handbook, you will likely find something about you owning the work, but the school having unrestricted rights to reproduce the work for promotional purposes. Getting original files from students is how schools get the materials for reprinting. Chances are that there is nothing you can do about this that won’t allow the school to toss you out right before graduation.</p>
