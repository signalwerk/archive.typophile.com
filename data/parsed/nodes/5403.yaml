    html: <p>Nick, <br>I enjoyed your article.  It reminded me of the low-tech 6os antiwar posters, hand painted messages with direct and often funny mixed metaphors.  My favorite was, "Nixon, Pull Out Like Your Father Should Have."  It seems apparent that there was a correlation between feelings on the war and birth control, another hot topic of the time. <br>ChrisL</p>
