    html: <p>Neville will have to speak for himself. I don't know what Brody's intensions were but to me I see it working as a contradiction done on purpose.  The stensil type so reminds me of the military and this is accross purpose with peace and love.  To me it says peace and love are empty words as long as they are stamped over by military might.  <br>I don't think it trys to be warm and human.  I think it trys to be jarring and reminds us how words can be conscripted into service unwillingly. (Spoken by someone who has been conscripted into service unwillingly). <br> <br>ChrisL</p>
