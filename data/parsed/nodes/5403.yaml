    html: <p>Jim, <br> <br>How do you read it the way you do? <br> <br>I know Neville Brody is cool stuff and all that, but I find this brutal. <br> <br>Peace and love has a picture of tranquilty and beauty for me. Warmth, softness, gentleness, human passions with dreams. <br> <br>This says to me crude and mechanical as a jack hammer, loud and disturbing. Reminds me of George Bush saying you are going to be democratic or we will torture you. <br> <br>As a life long pacifist I find it off-putting. <br> <br></p>
