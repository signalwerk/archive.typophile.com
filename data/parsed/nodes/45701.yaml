  html: |-
    <p>A colleague to me has another opinion than me about the amount of horizontal space before an ellipsis.</p>
    <p>My opinion:<br>
    In my mind, an ellipsis can be used when a word is interrupted (a) - or when a sentence is interrupted (b):</p>
    <p>(a) “What the f...”<br>
    (b) “Well, I don’t know ...”</p>
    <p>I think it is logical to have no space in (a) and a space in (b). The logic being, that the first point of the ellipsis is placed precisely where the first left-out character should have been.</p>
    <p>My colleagues opinion:<br>
    In example (b) she would reduce the horizontal space before the ellipsis, much as you would e.g. a semi-colon.<br>
    Have you ever seen that done? To me, it makes it harder to distinguish between the a- and the b-type.</p>
