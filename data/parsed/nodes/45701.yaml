      <p>I’m not sure about Denmark, but in the States &amp; UK, there is no hard and fast rule. People have preferences, and often they are quite sure their preferences are the only correct useage.</p>
      <p>With regard to ellipses generally, I know of three distinct styles in the States, AP (Associated Press), MLA (Modern Language Association), and Chicago (Chicago Manual of Style). All are different, and there are probably more.</p>
