      <p>Apple Pages, Apple Keynote, Apple Numbers, Apple TextEdit running on Mac OS X 10.5.2 support virtually all "advanced typographic" features you'd wish. On top of that, Numbers produces wonderful charts and Keynote is a fantastic presentation tool. The only thing I cannot get so convinced about is Pages, so I stick to Word 2007 for Windows (especially since with the multilingual packs, it gives me spelling and hyphenation in 30 languages, and it easily integrates with 3rd party dictionaries and writing tools). </p>
      <p>A.</p>
