    html: |-
      <p>I first used the designation "Pro" to distinguish an OpenType upgrade to a Latin 1, Type 1 font, by the addition of contextual alternates. (Handsome Pro.) That's all, no extra language support.</p>
      <p>However, in future I plan to release basic fonts that will have Extended Latin support, and Pro fonts that will also have typographic OpenType features (small caps, alternate figures, etc.)</p>
      <p>IMO, "everyone" now needs Extended Latin support (and perhaps Greek and Cyrillic--blame the E.U.), but only professionals need true small caps and superior figures.</p>
