      <p>Perhaps slightly off topic, our use of "Pro" in the designations of our CJK fonts, which are based on static glyph sets called character colections, is a bit different.</p>
      <p>If a character collection Supplement contains primarily glyphs that correspond to character set standards, the "Std" designation is used for such fonts. Adobe-Japan1-4 (/Registry "Adobe," /Ordering "Japan1," and /Supplement 4) represents the glyph repertoire level that allows Japanese fonts to be declared as "Pro" fonts. Adobe-Japan1-4 defines 15,444 glyphs (CIDs 0 through 15443). The current Supplement is 6 (Adobe-Japan1-6), which defines 23,058 glyphs (CIDs 0 through 23057).</p>
      <p>Glyphs above and beyond character set standards are included in "Pro" fonts, and are intended to be used for professional and commercial publishing. This means additional punctuation, common ideograph variants, a rich set of Latin glyphs, to include a full set of italic forms (made accessible through the 'ital' GSUB feature), and so on. We have yet to define Supplements for our Chinese and Korean character collections that can be considered "Pro" level, and when time permits, that is something that I plan to do. Curiously, Adobe-GB1-5 defines 30,284 glyphs (CIDs 0 through 30283), but fonts based on this character collection are still designated as "Std" fonts, because the collection of glyphs is primarily based on character set standards, specifically GB 18030-2005.</p>
      <p>Interestingly, some font developers apparently have other criteria for designating their CJK fonts as "Pro," such as Apple for their Chinese fonts that are based on GB 18030-2005. Their criteria is based solely on the number of glyphs. I find this to be a poor criteria, because the threshold is highly subjective. The criteria that I briefly described in the previous paragraph represents a much more practical and useful criteria for using the "Pro" designation for CJK fonts.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
