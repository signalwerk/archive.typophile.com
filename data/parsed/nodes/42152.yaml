      <p>In Adobe's terms, Helvetica Std is a "Std" font even though it includes Western+Cyrillic (but no CE). Though I must admit such cases are rare. In the vast majority of cases, "Pro" does indicates "the character set beyond Windows Western, with at least Central European Latin diacritics included". Typotheque sets the bar higher, as their Std fonts do include CE glyphs as well (but their Pro includes also Cyrillic and Greek). </p>
      <p>URW++ has a more elaborate scheme that involves "L1", "L1.5" and "L2" character sets. I somehow agree that there is a need for a term to describe the Western-only fonts ("Std" is OK here) but then there is also a need for two different terms, one to denote the Latin-only multilingual fonts (i.e. extended character coverage within one writing system), and another to describe fonts that offer more than that (Cyrillic, Greek and other alphabets, potentially).</p>
      <p>For my internal purposes, I've adapted the optional "Basic" vs. "Plus"/"Extended" suffix. An "Std Basic" font would really be just the Western codepage, an "Std Plus" or "Std Extended" font would have small caps, oldstyle numerals, extra ligatures or perhaps swashes, but still only for the Western characters, a "Pro Basic" font would offer Western and Central European diacritics, and perhaps some alternate glyphs for those, but no Cyrillic or Greek, while "Pro Plus" or "Pro Extended" would mean an open-ended font with at least two writing systems supported (one other than Latin). </p>
      <p>But then again, once you start making those finer distinctions, you can never stop, and also, there is no way to "standardize" those terms across vendors (not that I would think such standardization is necessary). </p>
      <p>A.</p>
