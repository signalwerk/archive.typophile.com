      <p>Actually, Apple Pages running under OS X 10.5.2 does not support virtually all the advanced typographic features one would wish. Pages running under OS X 10.4.11 genuinely did, however, and this is one of my biggest single beefs with Leopard.</p>
      <p>I find it flabbergasting that this is still broken, but simply try it for yourself and you'll see--under Leopard, the Typography pane accessed from the Text palette in Pages cannot reliably generate small capitals, or old-style figures, or any of the gamut of other features, from OpenType fonts.</p>
      <p>Or, for that matter, even draw itself correctly!</p>
      <p>In a word, it's crippled. And, for what it's worth, Pages cannot handle most 'variant glyphs,' or undertake fine-grained control of ligature settings (e.g., what if you don't *want* "Th" to be a ligature in Arno Pro?) under any version of Mac OS X.</p>
