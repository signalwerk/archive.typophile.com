      <p>In Adobe's terminology, a "Pro" font is one that contains diacritics for Central European and Baltic languages (Polish, Czech, Slovak, Hungarian, Lithuanian, Latvian, Estonian, Croatian, Slovenian), and an "Std" font is one without those characters even if it contains Western European small caps, swashes etc. </p>
      <p>But of course, this is the minimal prerequisite. A "Pro" font may contain many more characters for different scripts, including Cyrillic and Greek, and more Latin characters, as well as alternate glyphs, small caps etc. </p>
      <p>A.</p>
