      <p>@peter.ricardo: Same here. I have had trouble with small caps and alternate figures in Keynote 08 – but only since upgrading from 10.4.11 to 10.5.2.</p>
      <p>I have figured out that small caps will not work if you select a whole sentence before a line break. If you select a few letters or words in the middle of a sentence, the small caps feature will work as expected. I have tested this in Pages 08, too, getting the same symptoms. Interestingly, in TextEdit everything works fine.</p>
      <p>Small caps problems are not limited to iWork though: In the invoicing application I use, Billings 2.5, the small caps in my self-made template are broken, but as Adam Twardoch pointed out here: <a class="freelinking external" href="http://www.typophile.com/node/37122" rel="nofollow">http://www.typophile.com/node/37122</a>, this is due to a change in the way small caps are marked up in the RTF file format that Mac OS uses. Needless to say that Keynote has also forgotten all the small caps formatting, probably because of this issue.</p>
      <p>So apparently there are at least two different small caps problems: Apps forgetting smcp formatting and apps not allowing certain kinds of smcp formatting.</p>
