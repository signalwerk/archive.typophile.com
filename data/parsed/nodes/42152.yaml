    <p>Having some font that have "PRO" in their names, I wonder if that means the same?<br>
    I'll explain:<br>
    in the font Adobe Caslon Pro the characters like g with ^ and c with ^, which are being used in the independent language Esperanto could not be found, whereas in the font Minion Pro, there are present, just like in the font Garamond Premier Pro.</p>
    <p>Any comment on this?</p>
    <p>PS. I am new here, and I hope I can learn a lot from everybody.</p>
