    <p>Hi everyone, my first post here so hello :-)</p>
    <p>I am a magazine designer in the UK and am interested in what are the most popular magazine fonts at the minute.</p>
    <p>I have been researching on the internet but am finding it hard to find out the most current fonts people in this industry are using, if anyone could make any suggestions i would be very grateful!!</p>
    <p>Thanks everyone</p>
