    html: <p>It looks like it's based on an old metal/wood  <br>typeface called Hellenic Wide or Antique Extended.  <br>See the links in <a href="http://curbcontrol.com/interview/bob_dahlquist/" target="_top">this interview</a> with Bob Dahlquist. <br> <br>There's a free version by Pelle Piano called  <br>Stereo and a very good revival by the Letterror  <br>boys called <a href="http://www.letterror.com/foundry/zapata/index.html" target="_top">Zapata</a>. Also, see Aboutype's <a href="http://www.myfonts.com/FontFamily28396.html" target="_top">Antique  <br>Central</a>.</p>
    html_clean: <p>It looks like it's based on an old metal/wood  <br>typeface called Hellenic Wide or Antique Extended.  <br>See the links in <a href="http://curbcontrol.com/interview/bob_dahlquist/" target="_top" class="link-external">this interview</a> with Bob Dahlquist. <br> <br>There's a free version by Pelle Piano called  <br>Stereo and a very good revival by the Letterror  <br>boys called <a href="http://www.letterror.com/foundry/zapata/index.html" target="_top" class="link-external">Zapata</a>. Also, see Aboutype's <a href="http://www.myfonts.com/FontFamily28396.html" target="_top" class="link-external">Antique  <br>Central</a>.</p>
