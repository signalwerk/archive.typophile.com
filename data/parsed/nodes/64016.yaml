    html: <p>What if Helvetica/or Helvetica Neue is not available on the client's machines? do we recommended them to buy it? Or do we just give it to them to use it (would that be illegal)?</p>
    html_clean: <p>What if Helvetica/or Helvetica Neue is not available on the client's machines? do we recommended them to buy it? Or do we just give it to them to use it (would that be illegal)?</p>
  - id: 377484
    user: 17101
    date: 2009-11-09T04:35:00
    date_raw: 9.Nov.2009 4.35am
    votes: null
    html: |-
      <p>Design guidelines usually have one set of rules for designers, another for inhouse use. The latter often specifying a typeface that is available cross platform. In your case the natural fallback would be Arial, as neither Helvetica nor Helvetica Neue is bundled with Windows or MS Office.</p>
      <p>Giving them the typeface is illegal, so designers should purchase a license.</p>
