    <p>Hi!</p>
    <p>The query is related to the Helvetica typeface. Normally, Helvetica comes as a default typeface on both PCs and MACs.  Though Helvetica comes as a default, it is not licensed ( for e.g, arial comes packaged with windows hence there are no restrictions on its usage). Therefore, what do I do if i have to recommend Helvetica as a typeface to the client. Do I ask them to buy it for use in their communications or can they use it freely?</p>
