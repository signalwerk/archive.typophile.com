    html: <p>&gt; talus <br> <br>Just so you know, that's a very rare term*. "Internal leading" is more common, but it's still rare. Some people call it "shoulder", alluding to metal type, but I think that's misleading because the shoulder and the neck** combined made up the talus. <br> <br>* I got it from Javal, but have seen it only one other place. I like it because it's short and sounds nice. <br> <br>**  The inclined part going up from the flat shoulder to the face of the sort. <br> <br>BTW, monk is good. <br> <br>hhp <br></p>
