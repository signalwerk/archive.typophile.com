    html: "<p>&gt; my type has a x-height of 6 mm, the <br>&gt; ascenders are 3 mm [...] <br> <br>Hmm, don't think of type in milimeters, or inches. <br>Think about 'units'. Usually, Postscript fonts  <br>have a total height of 1000 units. <br> <br>&gt; How much room do I leave in between the lines so <br>&gt; that it looks and feels good?  <br> <br>It depends on a lot of things: body size,  <br>line-length, language, aesthetic preferences, etc. <br>That's why the leading (the 'room between the  <br>lines') is defined by the graphic designer, the  <br>person using your typeface. <br> <br>Edit: there's a small amount of leading that  <br>should be defined by the type designer (see  <br>below). <br> <br>It's impossible to achieve a 10/12 leaded font.  <br>You can't change leading on Fontographer. <br> <br>--- <br> <br>I'd suggest you this. You have: <br>Descender (2x) + xHeight (6x) + Ascender (3x) = Total (11x) <br> <br>Change 'x' for 70 units. You'll have: <br>Descender (140) + xHeight (420) + Ascender (210) = Total (770) <br> <br>Considering this is a Postscript Type-1 font,  <br>you'll still have a 'residual leading', 230 units. <br>Try this in Fontographer, and compare the result <br>to an existing font. This is hard to explain <br>through words... :-|</p>"
    html_clean: "<p>&gt; my type has a x-height of 6 mm, the <br>&gt; ascenders are 3 mm [...] <br> <br>Hmm, don't think of type in milimeters, or inches. <br>Think about 'units'. Usually, Postscript fonts  <br>have a total height of 1000 units. <br> <br>&gt; How much room do I leave in between the lines so <br>&gt; that it looks and feels good?  <br> <br>It depends on a lot of things: body size,  <br>line-length, language, aesthetic preferences, etc. <br>That's why the leading (the 'room between the  <br>lines') is defined by the graphic designer, the  <br>person using your typeface. <br> <br>Edit: there's a small amount of leading that  <br>should be defined by the type designer (see  <br>below). <br> <br>It's impossible to achieve a 10/12 leaded font.  <br>You can't change leading on Fontographer. <br> <br>--- <br> <br>I'd suggest you this. You have: <br>Descender (2x) + xHeight (6x) + Ascender (3x) = Total (11x) <br> <br>Change 'x' for 70 units. You'll have: <br>Descender (140) + xHeight (420) + Ascender (210) = Total (770) <br> <br>Considering this is a Postscript Type-1 font,  <br>you'll still have a 'residual leading', 230 units. <br>Try this in Fontographer, and compare the result <br>to an existing font. This is hard to explain <br>through words... :-|</p>"
