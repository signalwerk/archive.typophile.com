    html: "<p>Hrant -- You never cease to amuse me . . . \"talus\"?! That's funny: the neck plus the shoulder equals the ankle bone. Good one. ;-) <br> <br> <br>On a historical note (you all knew I had one, right), typefaces designed for production as Linotype matrices were required, for mechanical reasons, to leave a small amount of space at the top and bottom of the design. (For sizes 5 and 6 pt, this was .002\"; for 7 to 12 pt, .003\"; 14 pt, .004\"; and 16 to 24, .005\".)  <br> <br>So, for example, a 12-point design, with a slug of 0.166\", could only be 0.160\" tall. Translated to Postscript units (1000 unit em), this is equivalent to 964 units on the body. This was a maximum; the designer could, if he wanted, make the face smaller. <br> <br>The proportions of ascenders and descenders were dictated by a standard line placement for every size. On occasion, there were ways of working around these. <br> <br>I spent some time at one point examining a number of current Postscript fonts and observing various proportions. The size of designs, from top of ascender to bottom of descender, varies widely -- from designs like PMN Caecilia, MT Albertina, or Iowan Old Style which extend beyond the em square by a couple units to smallish designs like MT Fournier, MT Ehrhardt, or MT Walbaum which come in around 850 - 900 units or so. The average over 40 designs that I looked at was around 960 units -- on par with the Linotype 12-pt standard. <br> <br>-- K. <br></p>"
    html_clean: "<p>Hrant -- You never cease to amuse me . . . \"talus\"?! That's funny: the neck plus the shoulder equals the ankle bone. Good one. ;-) <br> <br> <br>On a historical note (you all knew I had one, right), typefaces designed for production as Linotype matrices were required, for mechanical reasons, to leave a small amount of space at the top and bottom of the design. (For sizes 5 and 6 pt, this was .002\"; for 7 to 12 pt, .003\"; 14 pt, .004\"; and 16 to 24, .005\".)  <br> <br>So, for example, a 12-point design, with a slug of 0.166\", could only be 0.160\" tall. Translated to Postscript units (1000 unit em), this is equivalent to 964 units on the body. This was a maximum; the designer could, if he wanted, make the face smaller. <br> <br>The proportions of ascenders and descenders were dictated by a standard line placement for every size. On occasion, there were ways of working around these. <br> <br>I spent some time at one point examining a number of current Postscript fonts and observing various proportions. The size of designs, from top of ascender to bottom of descender, varies widely -- from designs like PMN Caecilia, MT Albertina, or Iowan Old Style which extend beyond the em square by a couple units to smallish designs like MT Fournier, MT Ehrhardt, or MT Walbaum which come in around 850 - 900 units or so. The average over 40 designs that I looked at was around 960 units -- on par with the Linotype 12-pt standard. <br> <br>-- K. <br></p>"
