    html: "<p><i>I have never actually used Ikarus, but I guess  <br>many 'professional' foundries still use it for  <br>type design, don't they?</i> <br> <br>Some of the older, larger companies might still use Ikarus if they're digitising a large amount of work from analogue artwork, but almost everyone I know now designs directly on computer. If they make drawings on paper, they are more likely to scan these and use ScanFont to create initial outlines, or to do what I do: prop up the drawing beside the computer screen and 'eye-ball' it in FontLab.</p>"
