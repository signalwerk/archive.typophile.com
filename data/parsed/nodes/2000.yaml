    html: <p>Rene, I guess you mean the "internal leading" (also called "talus"), the empty space below the descenders plus above the ascenders? For the former, usually it's about 10% (20% is too much), although it does vary depending on intended usage and x-height size. <br> <br>&gt; don't think of type in milimeters, or inches. <br> <br>True - unless you're designing for an exact size!  :-) <br> <br>Using Eduardo's method, I'd use 80-85 instead of 70. <br>Also, you should put most of the talus above the ascender height (for cap accents). <br> <br>hhp <br></p>
    html_clean: <p>Rene, I guess you mean the "internal leading" (also called "talus"), the empty space below the descenders plus above the ascenders? For the former, usually it's about 10% (20% is too much), although it does vary depending on intended usage and x-height size. <br> <br>&gt; don't think of type in milimeters, or inches. <br> <br>True - unless you're designing for an exact size!  :-) <br> <br>Using Eduardo's method, I'd use 80-85 instead of 70. <br>Also, you should put most of the talus above the ascender height (for cap accents). <br> <br>hhp <br></p>
