    html: "<p>The amount of \"internal leading\" really does depend on the vertical proportions of the typeface (cap height : extender length : x-height). <br> <br>But that's not all... <br> <br>The popular Futura Book (Neufville-Adobe) has a massive overshoot of extenders! But in URW's version the extenders are within the em square.. <br> <br>Newspaper text faces (eg Utopia) are very \"big on the body\", to maximize wordcount. <br> <br>The opposite of that is Zuzana Licko's faces, many of which are \"small on the body\" -- which gives a very \"designery\" look in a default setting.</p>"
    html_clean: "<p>The amount of \"internal leading\" really does depend on the vertical proportions of the typeface (cap height : extender length : x-height). <br> <br>But that's not all... <br> <br>The popular Futura Book (Neufville-Adobe) has a massive overshoot of extenders! But in URW's version the extenders are within the em square.. <br> <br>Newspaper text faces (eg Utopia) are very \"big on the body\", to maximize wordcount. <br> <br>The opposite of that is Zuzana Licko's faces, many of which are \"small on the body\" -- which gives a very \"designery\" look in a default setting.</p>"
