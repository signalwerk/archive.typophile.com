    html: <p>Although it is mighty interesting to discuss over and over the advantages of this program for font production over that program, the most interesting thing at the end is what you want to achieve. I assume that for type designers the main goal is to convert the idea into perfect contour descriptions. The font producer wants to have the most solid conversion of the outline data into the current font formats. The end user is normally only interested in the quality of the design and he wants to be sure that the fonts function fine technically. Which program(s) were used for the font production is not important at all for the end user. Also, in time the only thing that will last is the design itself. Beside some technicians and historians, in the future nobody will be interested in the current technology used for the creation of the type. If the design is good, it will last and otherwise it will be forgotten no matter how interesting we now consider the way the technology was used. And then for the font producer there is the long term technology, the digital contour description, and short term technology that preserves the best conversion to limited apparatus, like delta hints. On the (relatively) long term only the contours will be the constant factor and the short term technology will change constantly. <br> <br>So, the type designer will use the program that fits his purposes best to create the outlines. This can be done in Illustrator, Fontographer, FontLab, BezierMaster, IkarusMaster, etc. The method used depends on the basic material. If there is analog material, the decision on which method is the best for conversion into digital outlines will be based on the quality of the drawings. For sketches normally the use of an auto tracing program is most likely but for high quality working drawings Ikarus is the most appropriate application. It makes no sense to scan a perfect contour, subsequently to auto trace this and then to end up with reworking the contours again. This is a waist of time and probably also of quality.  <br>The fact that the Ikarus algorithms are more than 25 years old does not mean it is old technology. It would be archaic in case there was a better alternative for converting working drawings into digital contours but there is none. For this reason the next generation of IkarusMaster will support the Wacom CAD tablets. <br> <br>If it is true that most designers don't make working drawings anymore, then this worries me somewhat. The design itself should determine the most preferable production. Almost for all DTL typefaces we start(ed) with drawings which are manually digitized. Revivals like DTL Fleischmann, DTL Fell and DTL VandenKeere were completely made on paper and afterwards manually digitized to preserve as much detail as possible. The basic sets of DTL Romulus were also digitized in Ikarus. Again, the technology is only a means to help the type designer to convert his ideas. In our case DTL FontMaster fits our purposes, of course, but it is fully understandable that other designers/font producers stick to FontLab or any other (combination of) programs.  <br> <br>Concerning the internal leading in the em square I would like to add that first of all you should make use as much as possible of the resolution. By reserving a large part of the em for the leading there could be a lost of accuracy because you end up with less resolution for the contours themselves. Besides this, normally the lengths of the descenders will change in case of the bolder versions of a type face. Because of the increasing x-height of the bolder versions the relation between the lenght of the ascenders and the descenders will change and it is quite common to make the descenders somewhat shorter. <br></p>
