  votes: null
  html: <p>Hi, <br> <br>When I have my scetches ready to be put into Fontographer, how do I best calculate the metrics (descender, ascender room)? <br>Normally the "interlining" (space between the descenders and ascenders of the next line) is set to 10/12. I would like to calculate the room between the lines and wonder if there is a default rule to follow here.  <br>I know it also depends on the wishes of the designer, but is there something like a golden rule? How to calculate the metrics so that they reference 10/12? <br> <br>I hope this makes any sence. My english has some major holes in this technical area. <br> <br>Any tips? <br> <br>Thanx, <br>Ren</p>
  html_clean: <p>Hi, <br> <br>When I have my scetches ready to be put into Fontographer, how do I best calculate the metrics (descender, ascender room)? <br>Normally the "interlining" (space between the descenders and ascenders of the next line) is set to 10/12. I would like to calculate the room between the lines and wonder if there is a default rule to follow here.  <br>I know it also depends on the wishes of the designer, but is there something like a golden rule? How to calculate the metrics so that they reference 10/12? <br> <br>I hope this makes any sence. My english has some major holes in this technical area. <br> <br>Any tips? <br> <br>Thanx, <br>Ren</p>
