    html: <p>Eduardo <br> <br>I have heard that Ikarus is being used less and less, but I am not really on an inside track regarding computers, so I don't know how popular it is. I would guess not very widespread. It is the first thing that I came across when Gerald Giampa started his font company here in the Vancouver area in the mid eighties. <br> <br>I like it that Ikarus is attuned to working right on top of your drawings rather than on scans. I realize that it is old technology, but I've gotten very comfortable with it, and once you get on to what it can do, it's FAST! <br> <br>On the other hand, I had a student from an art college come here to my workshop, and he wanted to learn Fontographer which I also use, and he like it a lot, since he was working from scans of Victor Hammer's American Uncial. Once he had done all the outlines, I taught him the process and he cut it in 14 point metal. <br> <br>I'd like to take a shot at Fontlab. I saw it used here at the ATypI bash, and thought it looked very refined, although for me Ikarus would be quicker and with so much manual control. <br> <br>Jim Rimmer <br> <br></p>
