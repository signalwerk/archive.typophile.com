    <p>Hello</p>
    <p>Im doing a roman - wedge serif called “Quadratta Serif” for text, not for screen.</p>
    <p><a href="http://typophile.com/node/35021" title="http://typophile.com/node/35021">http://typophile.com/node/35021</a></p>
    <p>and Im having problems with the maths signs, so<br>
    i have a cupple of questions:</p>
    <p>- Wich is the best way to test math signs (and numbers), and to know if they work or not?</p>
    <p>- If im doing a text type, should i use low case numbers?</p>
    <p>- Can math signs be innovative? or at least not boring? I am experimentig this, but i dont want to compromise legibility. I see this signs in romans and they are sans-serif’s like.</p>
    <p>Thanxs a lot,<br>
    and hope this will help some other people...</p>
    <p>Ferch</p>
