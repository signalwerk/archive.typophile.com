      <p>+ + +</p>
    <p>Press Release, 17 March 2006</p>
    <p><strong>Chitterlings</strong></p>
    <p><em>Chitterlings</em> is a new dining club for the printing, paper, type and graphic design industries. Established by Typevents LLP in conjunction with Beacon Press, Hurtwood Press and VIP Paper, Chitterlings provides a forum for critical debate and informed discussion amongst current members of the graphic arts communities. The event is designed to bring together, in an informal environment, the interdependent professions of design, print and paper in order to raise the debate over contemporary creative solutions and current production standards. The evenings commence with a talk by an invited speaker followed by an analytical appraisal and discussion of work brought to the table by guests. </p>
    <p>Chitterlings meets bi-monthly, is only open to practicing members of the graphic arts industry, and has an attendance that is strictly limited to 18 members on each occasion.</p>
    <p>The first meeting of Chitterlings will take place at 7.00 pm on Tuesday 28 March 2006, St John Bar &amp; Restaurant Smithfield, London. The guest speaker will be Freek Kuin from the highly acclaimed fine art printers Calf &amp; Meischke, Amsterdam.</p>
    <p>If you would like to attend a meeting of Chitterlings, please send an expression of interest to: info [at] typevents.com<br>
    Further dates for 2006 are 23 May, 25 July, 26 September and 28 November.</p>
    <p>Typevents partners<br>
    Print partner: Beacon Press, UK - <a href="http://www.beaconpress.co.uk" title="www.beaconpress.co.uk">www.beaconpress.co.uk</a><br>
    Fount partner: FontWorks, UK - <a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a><br>
    Design partner: Iconstorm, Germany - <a href="http://www.iconstorm.de" title="www.iconstorm.de">www.iconstorm.de</a><br>
    Agency partner: Laif, Germany - <a href="http://www.laif.de" title="www.laif.de">www.laif.de</a><br>
    Media (print) partner: Print Week, UK - <a href="http://www.printweek.com" title="www.printweek.com">www.printweek.com</a><br>
    Photography partner: Rob Clayton, UK - <a href="http://www.robclayton.co.uk" title="www.robclayton.co.uk">www.robclayton.co.uk</a><br>
    Paper partner: VIP Paper, UK – <a href="http://www.typevents.com/index.php?partners" title="www.typevents.com/index.php?partners">www.typevents.com/index.php?partners</a></p>
    <p>Typevents LLP is a UK-based multi-national partnership that provides comprehensive events, marketing and PR consultancy services to the printing, paper, type and graphic design communities.</p>
