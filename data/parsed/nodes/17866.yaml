    html: |-
      <p>I opend you pdf in Illustrator and saw that the glyphs have a lot of anchor points. Was the original typeface a truetype? The outlines are not smooth. When you remove all the points you don’t really need, you can control the surves better. Import your logo into FontLab or Fontographer and clean up the curves. Or do it in the program you made the logo in.</p>
      <p>Pieter</p>
