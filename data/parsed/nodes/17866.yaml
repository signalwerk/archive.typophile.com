    html: |-
      <p>I would reduce the crossbar on the left of the t, and at the top of the l. The area around the lower serif of the s is a bit “black” (in that it’s more solid than some of the other characters) I think you could look at reducing the width of the stroke as it enters the serif and generally try to get the stresses to marry up with those of the a.<br>
      Tim</p>
    html_clean: |-
