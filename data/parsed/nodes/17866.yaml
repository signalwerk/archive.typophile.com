      <p>Ok, I lightened the lower serif of the “s” and tried to simplify the “a” and “s” anchor points. Unfortunately, these are simply scans taken from Streamline of a handdrawn image. I tried shortening the the upper “l” serif and the “t” crossbar, but i personally prefer them as is.</p>
      <p>Thanks for all your helpful comments, i just looked at my first and third version and realized how much more refined it looks.</p>
      <p>Anything else?</p>
      <p>-Alex</p>
