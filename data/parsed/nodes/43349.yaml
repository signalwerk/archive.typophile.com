      <p>I suppose it is a matter of taste, but to my eye, you have several of the lowercase letters following caps kerned far too tight -- e.g. "St" in "Stemple","Ad" in "Adobe", "Ga" in (Adobe) "Garamond", and "Sy" in Syntax.</p>
      <p>Look at "Garamond" in the first line. the amount of white space, overall, between the a and the r is about equal to the white (overall) between the G and the a. For me, that's as tight as you want with a lower-case letter following a cap.</p>
      <p>And letterfit is my problem with Stemple Garamond, at least, when used for text. I've never been able to get the letters to fit well. I even threw out all the sidebearings &amp; started over. Still couldn't get it to work. Of course, that could be just my failing; somebody else might be able to get it right. But if so, I haven't seen it.</p>
