      <p>In my view, the finest sans serif on the market is Linotype Syntax with oldstyle figures. The base weight is just right, whereas many sans text faces start a little too heavy and therefore look a little crude opposite a nice serif. But if you intend to mix the families on the same baseline, rather than using the sans for sidebars a column away, matching the two x-heights would be your concern. In that case, try Legacy Sans, slung lower. I assume you mean Adobe Garamond; Simoncini Garamond is a little too delicate for editorial work. Stempel Garamond is big and snappy--always my pick among Garamonds, and always with oldstyle figures. Type samples shown are all 35pt. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SansWithGaramond_6143.png"></div><p></p>
