      <p><em>General look and feel is modern and clean.</em></p>
      <p>Then why Garamond? It's a dirty old-style. (Dirty in the sense that all the revivals simulate the trace of the letterpress process, in particular ink gain, in some way.)</p>
      <p>Garamond has been much used to the point of becoming generic. So you could pair any sans serif with it; but perhaps another much-used face would be a suitable companion. Any bundled sans would do--Futura, Helvetica, Gill, Myriad, etc.</p>
