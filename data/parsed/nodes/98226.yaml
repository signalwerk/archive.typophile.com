    <p>Zuhair Albazi Naskh Font created specially looking at the needs of International Arab Publishers. A font containing marvelous Arabic Naskh beauty and unmatched features.</p>
    <p>Here is a pdf file, containing Zuhair Albazi Naskh typeface samples, to check the printouts of the font at smaller, document level text size. The text pages contain Regular style as well as Bold style. The PDF is created from Microsoft Word 2010. Download link of the sample PDF file<br><a href="http://www.mediafire.com/view/?3as61an27y1ojvb">http://www.mediafire.com/view/?3as61an27y1ojvb</a></p>
    <p>For a detailed look on the font  <a href="http://typophile.com/node/93945">http://typophile.com/node/93945</a></p>
