    <p>I have two fairly general questions, and feel kind of newbish for not understanding these in my third year of school but here goes anyways.</p>
    <p>I’m frequently using the lab workstations which are already preloaded with a set of ’Studio Fonts.’ There are times where I want to use Small Caps but I have no idea if the families they’ve bought include the SC style or not. I could obviously hit the SC buttons in Quark or InDesign but that doesn’t solve my problem. I want to know how to determine if they’re faux or real. Hopefully there’s an easy way.</p>
    <p>Another question I have, which I didn’t think deserved another thread was I just bought the Indie Fonts Vol 1 and 2 and love them! I loaded up the CDs and made new sets in FontExplorer and imported all the gratis fonts provided, noticing that there are duplicates of some fonts and not of others. I’ve got a vague idea of why there are Post-Script and TrueType included but I want to know for sure. I’m pretty sure Post-Script are ’printer’ fonts and TrueType are the ’screen’ fonts. Is this correct? Which one do I enable when I want to use the font? or do I enable both?</p>
    <p>Maybe this is better directed towards Paul or someone at P22 but the ’Screwtop’ family I imported is empty. Info on the Family in FontExplorer says it contains 0 characters. :-(</p>
