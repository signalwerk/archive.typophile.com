      <p>&gt;In most fonts real small cap letters are narrower than uppercase letters </p>
      <p>I believe it is generally the other way around: making the stems bolder and trying to keep the counters similar makes the small caps wider. Eg. I just checked Adobe Garamond, which has it this way—wider not narrower.</p>
