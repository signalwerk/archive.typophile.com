    <p>Now, full disclosure: this is a font that I know perfectly well is expensive, and was surprised to find on their terminal (Neutraface - first version, all iterations [I think] ). It seems most likely to me that another part-timer left it behind as he whizzed through. So it won't surprise or disappoint me if I have to work around it (though boy, it does look snazzy). I don't understand Quark's behavior, though. </p>
    <p>Quark doesn't stop me to tell me that there's a conflicting permission bit, and it doesn't put another font in its place – it just leaves blank space. Is this how "permission bits" work - that you can use the font for quick in &amp; out stuff, bathroom signs, no problem, but it won't spin down to your actual workflow?</p>
    <p>The other reason I'm surprised is that I took the project home last weekend and worked on it on my Mac, and generated a PDF (to send to them) that looked fine. At home I'm running Adobe CS2, with Acrobat 8.1.1; at this office they're running CS3.</p>
