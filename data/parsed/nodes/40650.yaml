      <p>Some foundries do manipulate the bits. AFAIK and I've worked plenty with House fonts, you can embed their fonts. I've done so myself. Their EULA allows it as well. (The new EULA more explicitly allows it.) </p>
      <p>Have you tried exporting from Quark as a .PS file and running that through Distiller? I know of a situation where I had to do that. But, it was a PS font so I'm not sure if the problem is the same.</p>
