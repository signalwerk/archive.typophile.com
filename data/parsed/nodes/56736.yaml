    <p>Hey fellow Typophiles,</p>
    <p>Are any of you who are graphic designers Graphic Artists Guild members? I'm preparing to leave my day job in the next few months and go solo full time, and I'm wondering what your experience with GAG has been. The handbook has been very insightful. And, despite the terribly outdated design (perhaps it's done with irony?), their website is full of good info and the "why join" type of areas look appealing. </p>
    <p>Why am I hesitant?</p>
