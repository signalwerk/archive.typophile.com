      <p>I notice that their website has a section with links to members' portfolios... Perhaps you could get contact info from one or more of those portfolios, and ask the designers/illustrators/artists.</p>
      <p>I own the latest edition of their <em>Pricing and Ethical Guidelines</em> book... The only negative thing I've ever heard about that is that some of their rates are higher than real-world rates.</p>
