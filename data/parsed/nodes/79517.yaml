  html: |-
    <p>Dear all,</p>
    <p>We are pleased to announce "Aratypo", a dedicated group for Arabic Typefaces creation, development and learning activities (only in Arabic).</p>
    <p>Aratypo group members work also on the application of Arabic typography in Hard and electronic content: DTP, Web Design, etc.</p>
    <p>We worked in the last six months to prepare the first contributions, and we will be glad to receive original contributions, thoughts, or questions from Arabic Typography lovers.</p>
    <p>All the best,</p>
    <p>Aratype,</p>
    <p><a href="http://www.aratypo.net" title="www.aratypo.net">www.aratypo.net</a></p>
    <p><a href="http://twitter.com/aratypo" title="http://twitter.com/aratypo">http://twitter.com/aratypo</a></p>
