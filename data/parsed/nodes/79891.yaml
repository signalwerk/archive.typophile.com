      <p>Some revival of <a class="freelinking external" href="http://www.justinthomaskay.com/index.php?/type/garland-monospace/#17902" rel="nofollow">Ken Garland</a>'s work.<br>
      Some similars: <a class="freelinking external" href="http://new.myfonts.com/fonts/p22/albers/" rel="nofollow">Albers</a>, <a class="freelinking external" href="http://www.dafont.com/schrofer.font" rel="nofollow">Schrofer</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/reserves/idiom/" rel="nofollow">Idiom</a> (as suggested by Mike), <a class="freelinking external" href="http://new.myfonts.com/fonts/madtype/bandoleer/" rel="nofollow">Bandoleer</a>, <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0314" rel="nofollow">Second Wave</a> (the YWFT one Mike is talking about), <a class="freelinking external" href="http://www.hypefortype.com/browse-fonts/font-categories/techno/bqe-8044.html" rel="nofollow">BQE</a>, <a class="freelinking external" href="http://fontstruct.com/fontstructions/show/leaflet_wide_stem" rel="nofollow">Leaflet Wide Stem</a>, <a class="freelinking external" href="http://fontstruct.com/fontstructions/show/out_of_context_redux" rel="nofollow">Out Of Context Redux</a>...</p>
