      <p>We've designed something similar in our Idiom typeface you can see here - <a href="http://www.flickr.com/photos/reserves/5457332143/" title="http://www.flickr.com/photos/reserves/5457332143/">http://www.flickr.com/photos/reserves/5457332143/</a></p>
