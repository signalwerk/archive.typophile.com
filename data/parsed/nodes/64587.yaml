  html: |-
    <p>Hi there,</p>
    <p>I’ve been designing a font for the 3D environment, where each letterform is able to stand alone, up right in the 3D; even the lowercase letters, numbers, question marks etc.</p>
    <p>It's largely inspired by engineering and building rather than traditional font concepts<br>
    (i.e. Readability, onscreen adaptability etc.) BUT I have not used massive slab serifs or made overly angular/sharp corners. </p>
    <p>I'd love to know what you guys think of it. As I'm more of a typographer than a type designer. . . </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/test-1_4226.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/test-2_6728.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/test-3_5405.jpg"></div><p></p>
    <p>any feedback / help would be great. . . cheers.</p>
