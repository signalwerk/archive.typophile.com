      <p>ALOT of really good comments here.  Instead of simply agreeing with everything y’all have said I’ll pick out a comment I’m not really digging.</p>
      <p><em>I think that the visual identity of a business is the most immediate indicator of the value of their service.</em></p>
      <p>It’s an “indicator” but not always the truth.  We all eat at hole in the wall restaurants that have the most amazing food - and we have to wait to get in because everybody in town is there too.  Nothing is pretty about them except the food.  There are also many successful businesses that have never had more than Times Roman as their entire id program.</p>
      <p>I find the major problem being with metrics - can the client measure the value they get from creating an identity program?  I personally don’t have the resources or know-how to do the studies to prove this - aside from the quick, cheap, dirty approach.  Let alone getting somebody to pay for the study itself.  But as it was mentioned, you need a business expert to say it’s good before it’s good oftentimes (and this is where the bucks really start to add up).  Showing that sales or perception have improved is key and can be difficult to define.  Aside from all we’ve talked about this is the hardest point.</p>
      <p>I’m trying to play the part of the client here - I know that design is so darn important these days.</p>
      <p>But, the idea is to present a primer.  I don’t want to be a coach - been there done that too.</p>
      <p>And thanks alot to y’all for all the comments.</p>
