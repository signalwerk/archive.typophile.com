      <p>It’s easy and cynical to say that “all fonts are the same”.<br>
      One could say the same about anything.<br>
      “All wines are the same”, and it’s true, they do taste pretty much the same (compared to orange juice or beer) — but you come across as uncouth if you admit as much<br>
      So the same is true of fonts.</p>
      <p>If you say “oh, we won’t bother about optimizing some details”, where do you stop compromising?<br>
      On the positive side, quality is insidious.<br>
      But the client doesn’t have to care about every little detail, micro-managing it: leave it to the talent to decide what’s important.</p>
      <p>From my experience, small businesses are not particularly marketing-savvy.<br>
      They usually don’t have a strong idea what differentiates their product from that of their competitors, because they don’t have marketing specialists on staff. All they know is they love their thing and do it right.</p>
      <p>So the trick is to explain the benefits of a marketing strategy which positions them positively in the marketplace with relation to the competition. Quality, price, delivery, whatever. And if you can convince them of the uniqueness of that proposition, than you can convince them that unique creative is part of the plan, and unique typography and fonts contributre to the design synergy of their market position. </p>
      <p>If they’ll settle for generic fonts and typography, that means they’ll look like everbody else and will be reduced to competing at the lowest cutthroat level, on price — and a small business can’t afford to do that, because large businesses with economy of scale will blow them out of the water.</p>
