    <p>I’m trying to put together a little presentation for a small business.  While they don’t really believe this statement, it is something that they have jokingly said to me, “all fonts are the same, it’s just ‘fashion’”.  It’s an overstatement, but I’m working with it.  Having worked for with for and with small business, I can say that they can shoot themselves in the foot because they are intimidated by designers.  “They will charge me $10,000 for a logo I don’t even want”, that kind of thing.  We’ve all been there…</p>
    <p>But we all know there are certainly other alternatives than the logo itself.  And some simple guidelines can do wonders as well.  I don’t see those as being so expensive.</p>
    <p>Anyways, I have a few general ideas how smart typography can actually help a ‘small’ business…anybody have more they’d like to add?</p>
    <p>- consistency - marketing 101, etc…<br>
    - use of guidelines can save lots of time and enforces consistency<br>
    - brick and mortar approach…start simple and build as needed (more design)<br>
    - knowledge of some of these fundamentals can make you a smarter client - work better with your designer (i would hope)</p>
    <p>Additions?</p>
    <p>My goal, perhaps it’s fruitless though, is to teach them some basic type terminology, how to think about appropriate usage, what guidelines are, and how to consider choosing a good face.  In the end, it will be an e-presentation or whatever the kids call it these days. ;)</p>
    <p>Or, is this really a dumb idea and not worth the time.  I was thinking it could be useful for other clients in the future…</p>
    <p>Merci…v</p>
