      <p>I think selling big D design to a small business requires showing how the fine details of design (such as visual consistency and good typography) serve the large scale goals of the business. Consistency is a very important goal but there are some more immediate and appealing aspects you could present. </p>
      <p>Paul mentioned a company putting their best face forward. I think that the visual identity of a business is the most immediate indicator of the value of their service. I would work out a way to show the client how they will benefit from developing a well designed visual identity (which inherently contains good typography). I would start by researching how their immediate competitors value and use design.<br>
      Goodluck.</p>
