      <p>Good comments here - All I would add is; I would be sure to be as un-didactic as possible - a heavy ‘should’ attitude is a turn off &amp; make sure you present your proposal in such a way that it clearly supports their business goals. </p>
      <p>Of course if they don’t know what their business goals are you may have a nearly-useless client. You can’t be a coach &amp; a designer…</p>
      <p>What Nick said about ‘and will be reduced to competing at the lowest cutthroat level, on price’ is VERY true. Design can be a pretty damn significant rung on the ladder out of that hell.</p>
