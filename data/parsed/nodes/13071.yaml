      <p>Unfortunately, it’s not only small businesses that have little interest in branding, let alone fonts or typography.</p>
      <p>Nick is on the mark suggesting a business marketing approach to your presentation. The only thing that gets attention is a way to improve business.</p>
      <p>But before you start to create a presentation to enlighten the company by yourself, I suggest another tact.</p>
      <p>Oddly enough, if the business owners hired an outside consultant to improve business, and one suggestion was to revise branding, they would listen. I know… been there, done that.</p>
      <p>I’m not suggesting that they bring in a business consultant, I suggest that you bring in the expertise and plan for success by way of reputable case studies. That way you’re not stuck trying to educate or convince them. You just present the facts that good branding means good business.</p>
      <p>Here are a couple of articles to get you started.</p>
      <p>An excerpt from <cite>INC. magazine</cite> on the BrandEquity site:<br>
      http://www.brandequity.com/news/inc_wm.html<br>
      The article speaks for itself - <cite>“In 2000, the first full year after the redesign, the company’s sales rose 20%. In 2001, when most shoe companies’ revenues decreased significantly, White Mountain’s sales again shot up 20%”.</cite></p>
      <p>Here’s an article by an award-winning consultant:<br>
      <cite>Five Tips to Quickly and Inexpensively Improve Your Brand Identity</cite><br>
      http://www.womeninconsulting.org/consultants/articles/improve-brand-identity.html<br>
      It speaks to consistancy of image, use of type, color, layout, etc. accross all material, web site, literature, ads and so forth. The outcome being an improved perception of the company or product by the target market.</p>
      <p>You might try searching for articles about branding from publications within your client’s industry as they might hold more weight.</p>
      <p>One or two success stories should at least open the door to a few of your ideas. Even if they decide to start slow, or put off revitalizing their image, you bring them proven ways to improve market share and profits.</p>
      <p>Good luck.</p>
      <p>———————————————————</p>
      <p>Yes, I’m old, but I’m back in style!</p>
