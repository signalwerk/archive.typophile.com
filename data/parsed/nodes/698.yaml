    html: <p>Andrij, I don't speak Russian, but I have understood some of your post anyway (you know - we're the same Slavic tribe). Personally I see a nice connection of microphone and hiphop. Yes, of course it is from another era, but I don't find hiphop very high-tech. I think the vinyls (which are from some previous era too) and microphones match perfectly with a hiphop image.  <br> <br>Dmitry - I like the logo, but I think you should give some of the roughness of the type to the microphone, too. That is why I like the 1.2A most, but it is still too soft and computerised for my eye. Hip hop has never been a soft politicaly correct music style, was it?</p>
