    html: |-
      <p><cite> sIFR does not support kerning </cite></p>
      <p>This explains a great deal. I kept wondering why Beorcana looked so different on Typophile - and that was the reason I most suspected. And Zara is of course 100% correct about rendering being a significant factor.</p>
      <p>Bill, I agree with you that these is something about it that is surprising. I think part of it is the unusual details at the end of the top 'arm'* of the 'a'. The cuts at the joins are not as extreme as I would like when it's used at smallers sizes.</p>
      <p>But the thing I like about it is the flavor of it. It's got a clunky but likeable voice. </p>
      <p>When you look closely at the serifs I think you find about half the reason for that voice.  They are really weird. Weirder than I would expect you could get away with. </p>
      <p>But there is something to that uneveness thing you brought up too. When you look at the o &amp; u next to each other they don't match in the way you would expect. The feeling get from this - too naively I admit -  is of uneven letter press. Perhaps that was the intent. To create something that slips an association of the coloful &amp; antique past you - but in a new way. Of course maybe I am reading too much into it.</p>
      <p>I would prefer to set a menu or an information piece about a Hotel or a Magazine article in this font than a book. This isn't a ding or a negative - just my sense of what it's most suited to. I can say that about plenty of faces I respect - like Sanuk &amp; Amalia for instance.</p>
      <p>* Actually I have forgotten if I ever knew - what is that part called anyway?</p>
