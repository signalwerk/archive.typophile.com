    html: |-
      <p>I like some of the Mac Rhino faces, but this one appears to me quite awkward. To some others this might be nicely innovative, but for me, the rounds are too light compared to the verticals, resulting in a disturbingly uneven color. Also for me the serifs appear to be snapped on backwards. A traditional pen-influenced way (from Jenson on) is to have the left a thicker wedge and the right a thinner, longer horizontal. To me this makes visual sense, giving a sense of motion in the direction of reading. The other way around kind of feels to me like bumps in the road. </p>
      <p>I guess I should be an equal opportunity critic and say that I detested Super Duty. No problems with the crafting of the shapes, but I just took an antipathy to the brutal look and some difficult-to-read characters...</p>
    html_clean: |-
