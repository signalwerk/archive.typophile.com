    html: <p>Eben, looking again, I think what is most causing what is for me an unbalanced look is the disparity in the treatment of top horizontal arches. The treatment of the arches on the hmn is much heavier than in the acdso, for example. It is not just that the biggest and smallest places are different, but also that so much weight is carried from the right stems on the mnh so far into the join with the left stems. Stefan has other fonts that are well balanced, so these things were deliberate decisions. But for me they break the boundaries of what the eye is comfortable reading.</p>
