  html: |-
    <p>I am trying to find the Bembo used on Section 25 - Always now album, designed by Peter Saville. It has to be Berthold Bembo as it written on the album itself but it's slightly different from the ones I found. You can understand it from the letter "g". The numbers are Bembo Small Caps obviously, but that "g" made me crazy.</p>
    <p>Any help will be appreciated,<br>
    Thanks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fac_45_lg_4150.jpg"></div><p></p>
