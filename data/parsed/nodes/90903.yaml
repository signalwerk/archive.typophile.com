    <p>Hello!<br>
    Do you know about any typefaces that uses a diamond shape as punctation, dots over the i etc?<br>
    Fedra Sans or Priori Sans are two examples, but I'm looking for a bit more subtile font (more gotham-ish)</p>
    <p><img src="http://media.smashingmagazine.com/images/typefaces/fedra-sans.gif"></p>
    <p>Thanks!</p>
