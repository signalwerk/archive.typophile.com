    html: <p>"information on the speed of birds"...That's interesting. I would've never guessed by this or the other thread, what the meaning of the logo was. I was wondering what the bird was representing. Still, I think the concept could be stronger, relative to the message. A strong indication of motion (not a pasted arrow/bird) throughout the logo would probably strengthen the concept. Your concept is moving (no punn intended) in a nice visual aesthetic direction, but the visual message could still use some exploration. <br> <br>Just think movement/speed/motion while your sketching. <br> <br>Aloha! <br>Scott</p>
