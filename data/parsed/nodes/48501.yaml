  html: |-
    <p>is FF Unit realy suitable for signage systems? it was designed for that purpose but obviously it doesn’t have (all) characters for some countries like ex-yugoslav republics for example.</p>
    <p>now it’s available in three versions: Unit 1, 2 and 3 but i still haven’t found which one is suitable for signage. maybe you know a better signage typeface?</p>
