    html: |-
      <p>Sara --</p>
      <p>I can't think of any specific uses of Whitman with Verlag, off the top of my head, but I have always thought they'd be potentially compatible.</p>
      <p>You will need to speak directly with Font Bureau regarding licensing Whitman for sIFR usage. I do not know the specific policy. Contact Harry Parker at hparker [at] fontbureau [dot] com. Or call the main FB phone number to discuss in person. </p>
      <p>I do know that, right now, CSS @font-face "embedding" is not allowable with Font Bureau retail fonts. FB has said that they are working on a web fonts licensing framework for their library. I would expect more details to emerge in the coming months. </p>
      <p>-- K.</p>
