    <p>Hello all, </p>
    <p>I have been using this site for years, and now I am taking the leap to ask a question to you pro's.</p>
    <p>I am designing a catalogue system (think fancy auction catalogue) for print, web and large poster design. For the web I have been working with Franklin Gothic Condensed Book and Medium for headings, and Georgia for bread text. I was trying this for a large poster and for a book layout and all of a sudden felt that I should look elsewhere. Based on a discussion here I found Whitney and Chronicle Text(which I like better than Miller) but ouch they are expensive! I am trying to determine whether it is worth it and also if they work for every medium and sizes I am working with... I do want consistency.</p>
    <p>So my questions:</p>
    <p>One of the reasons that I like Whitney is the old style numerics, which I have not been able to find in Franklin Gothic. Are there no such numbers in Franklin Gothic that I can use? </p>
    <p>Will Georgia work for a large typographic poster (set in 30 pt) or will that look retarded?</p>
    <p>Is there a way I can purchase some single styles of Whitney, say Whitney Condensed Book and Medium, and still get the old style numerics? I am also very interested in the Index White Square Bold and Black Round Bold...</p>
    <p>Will Whitney/Chronicle work on the web, has someone successfully embedded them? </p>
    <p>I wish I could buy them both but that means $1000...</p>
    <p>Thankful for any advice!</p>
    <p>S</p>
