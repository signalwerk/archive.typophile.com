      <p>Thanks for your comments! I did read about the restrictions regarding use on the web, which maybe makes it impossible for me to use H&amp;FJ fonts... You also cannot buy single styles from them, but I did email them to see if I could get an educational discount (as I am an academic)...</p>
      <p>I am driving myself crazy here... I like the numerals of FF Dagny a lot, but want a condensed style. I just love Whitney, it has so much I need... </p>
      <p>I am also struggling with the bread text. Tried to set Minion for print, and it looked better, but don't know if it works with Franklin Gothic? I do like Miller, but not the numerals, especially the "1" look strange to me. But those forms contrast nicely to Whitney.</p>
      <p>I would right now love to have the full Whitney set and the full Miller set!</p>
      <p>Ok, rambling. Thanks again for your help, and I might submit my design up for critique once done!</p>
      <p>Sincerely,<br>
      S</p>
