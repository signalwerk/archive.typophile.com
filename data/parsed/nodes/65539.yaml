      <p>Sara -- Thanks for your compliments. </p>
      <p>The late <a class="freelinking external" href="http://typophile.com/user/7891" rel="nofollow">Will Powers</a> used to like pairing Whitman with Franklin Gothics in books he produced for the Minnesota Historical Society Press. </p>
      <p>Regarding poetry:<br>
      <a class="freelinking external" href="http://typophile.com/user/23726" rel="nofollow">Nicola Caleffi</a> used Whitman in an Italian book of poetry -- <em>Ombre di Luce</em> by Graziana Bernabei [Sassuolo (Modena): Incontri Editrice, 2009] </p>
      <p><a class="freelinking external" href="http://www.chapiteau.org/" rel="nofollow">Chapiteau Press</a> (in Vermont) used a pre-release version of Whitman, back in 2002, for a small chapbook of poetry by Ilya Kaminsky called <em>Musica Humana</em>.</p>
      <p>Whitman is also the primary text face for <em><a class="freelinking external" href="http://www.vqronline.org/" rel="nofollow">The Virginia Quarterly Review</a></em> and is used for setting poetry as well as articles, I believe.</p>
      <p>Regarding cataloging systems: I'm not sure what to tell you there. Perhaps someone else can offer an example that I'm unaware of.</p>
