    html: |-
      <p>Dear Kent, </p>
      <p>Thank you so much! I will take a look at those books. I downloaded the Whitman specs from your website, that was very helpful, especially the note on dashes and special punctuation. I have been looking for an alternative to Scala for quite some time, and think this is it! I am super excited.</p>
      <p>Now after looking around some more, I realize that Verlag is a better fit for me than Whitney or Franklin Gothic. I love the numerals and it seems less corporate than Whitney. Do you think it will fit well with Whitman?</p>
      <p>A problem I have is that I love the Whitney Index family, and Verlag doesn't come with anything similar, I think! I guess it will be a big mistake to mix Whitney Index and Verlag, but this would give me what I need:</p>
      <p>Heading/ wall text/ motion graphics: Verlag Condensed family<br>
      Index: Whitney Index Family<br>
      Bread (print and web): Whitman</p>
      <p>A note on the context: I am designing an artist book that uses the format of an auction catalog. I am inventing a numbering system, and there will be short descriptions for each item. It will accompany an exhibition that uses wall text, which is why I want a museum style typeface. This multimedia exhibition also includes film, and I would love to also use Verlag in the titles. To make things more complicated for myself, I am also creating a version of the catalog for the web. I would love to be able to use the same typefaces, and to get a a more traditional print design feel on the web!</p>
      <p>So, my convoluted question is now moving into the web design sphere:</p>
      <p>There are two possibilities to make "rare" typefaces appear on the computer screen :</p>
      <p>sIFR (Scalable Inman Flash Replacement) - H&amp;FJ demand that you buy another license for your server to use this</p>
      <p>@font-face tag within Cascading Style Sheets (CSS) - H&amp;FJ doesn't allow you to use their fonts for this.</p>
      <p>There is another option, which is to use static text in Flash, but this is not ideal from a web design point of view.</p>
      <p>Has anyone used Verlag and Whitman in a web context successfully? Do you need to buy an extra license to use sIFR with Whitman, and can you use CSS?</p>
      <p>I do understand if people are too involved in their holiday shopping to follow my train of thought here...</p>
      <p>Sincerely, </p>
      <p>Sara</p>
