      <p><cite>It could become a trend, if not the norm, that OpenType sans serif faces will be designed with both old-style and modern alternates of “a” and “g”.</cite></p>
      <p>By the way, if an OpenType sans serif face aims to cover International Phonetic Alphabet (IPA) symbols, both single- and double-storey forms of “a” will be required, since the IPA makes use of both glyphs. In addition, if the default “g” is a double-storey form, then an additional single-storey form will be required, since it's the single-storey “g” that is used by the IPA. Once you have those glyphs, it would be a simple step to designate them as alternates for the default “a” and “g”.</p>
    html_clean: |-
