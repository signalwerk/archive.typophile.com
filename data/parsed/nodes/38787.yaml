    <p></p><div class="imageWrap"><img src="http://typophile.com/files/imgpdh110807_4557.gif"></div><p></p>
    <p>i was wondering if certain types of letter forms are "inappropriate" for certain type styles. of course, the school book (or single-story) forms of a and g look funny in Bembo, but are they so bad in something like a revival of Johnston's Underground type?<br>
    second question, is it irresponsible of a designer to make these types of alternates available?<br>
    third question, there is a strong correlation between some forms (a &amp; g) and a weaker one with other forms (t &amp; l). i'm sure the answer is "it depends," but does anyone have examples of some of these conventions being successfully broken?</p>
    <p><em>for the sake of transparency the original post is below, the original title of this thread was "Is this sick and wrong?" I prefer the ammended post above, but if you want to respond to the post below, feel free.</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sickpdh110407_5926.gif"></div><p></p>
    <p>well maybe that’s a bit more emotive than i’d like to be, but i wanted to show a few certain things and this text worked. what i’d really like to ask is is the type above in the image above “inapropriate” in any way? this is all i want to ask at this point. i’ll give more context after a few initial reactions.</p>
    <p>(post ammended 10 Nov 2007)</p>
