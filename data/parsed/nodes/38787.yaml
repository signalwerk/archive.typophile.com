    html: |-
      <p>On the one hand, a copyist has a responsibility to the designer to stay true to his design, not to benefit from what is 99% his genius then piss on his grave by making arbitrary little changes that taint the flavor of the original because you think you know better than he did.</p>
      <p>On the other hand, times do change, and the typefaces that survive are the ones that are adapted to the changing times and new media, so prolonging the life and relevance of a design is a serious form of homage and myth-making.</p>
      <p>The proliferation of characters in a font is a good thing, because it helps redesigners to solve the above dilemma by providing both an authentic version of the typeface, and a contemporary freshen-up. Then it's up to the users.</p>
      <p>While I was disappointed that Slimbach's Jenson has chopped a couple of serifs off the M, it was nice to see that he provides the fully serifed version in an alternate set. That was before OpenType.</p>
      <p>Now with stylistic sets, foundries can have it both ways more fully, and it's easier for users than having to find&gt;replace individual characters to deploy the alternates. But one version still has to be the default, and I do think that the alternate suffers by not having default status, buried in application menus and requiring a sympathetic reading of support material (PDF specimen) to fully appreciate it. Why not make two fonts, Classic and Neue?</p>
      <p>I've always been impressed with the authenticity of P22's revivals, which show great respect for their sources.</p>
