    html: |-
      <p>There is an inherent style portrayed in a type designers selection of like letterforms.<br>
      An addition of a swash in normal letters may come from the original designers need to properly set a particular word with great flare.  - -  Or with the need to manage character spacing (by hand) when sign painting to monospace characters.  Fast Paced planning a Hand Painted sign is initially laid out in monospace when text is to be centered.  Try quickly making a hand painted sign from scratch on glass that is on a hung door.  It is far different from the modern vinyl cut sign lettering that is the norm now.  The hook tail on the lower case "i" may have come from such a monospace reason of character placement when hand painting a sign.  Many older fonts have origins in hand lettereing. It may even be a quirk of a single hand painting sign guy that loves the hook in his letter "i"(s)...  </p>
      <p>As in the sample the R and the K in CLERK  like forms emulateing one another and then there is the designers feeling of forcing differences to normmaly like forms such as a lower case L and an upper case i in the "Daisies..." Sample at the top of this thread.</p>
      <p>I would also consider the cap "i" in that sample sans font would likely be a simple vertical stroke without slabs. Most likely the same reason the lower L has the swash to prevent the uppercase i and Lower case L from being confused.  The lower r  emulates the lower c .  </p>
      <p>Alternates in the opentype fonts ability to contain extra glyphs also afford level 4 typesetter ( on a scale of 1 to 10 ) to take advantage of glyph alternates easily - with applications that support glyph replacement functions.  Opentype fonts can also fetch a higher price when they are extensively embellished with goodies or IMHO made correctly and with great care.</p>
      <p>thanks - versonova</p>
