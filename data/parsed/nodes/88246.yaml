    <p>Monitor pictures during my work on a „Advanced“-version for my new webpage thought for tiny letter sizes.<br>
    <a href="http://typophile.com/files/Image_ga!.png" target="Bilder" rel="nofollow">Image_ga_small</a></p>
    <p>Monitor pictures of while I am working on my new typeface <em>Minors advanced</em>. This sans serif character is indeed a very old one (of mines) on which I did modifications that changed its look. I wanted to add to it more fashionable elegance, more in the direction of Franklin gothic feeling, clear and charming forms.<br>
    On my table I kept an old ad campaign of Giorgio Armani of 2003 photographed by Paolo Roversi and an open Dior book which contains a beautiful Didot character. I search for inspiration in them to turn the character of the face into something more stylish even keeping it a sans serif face. […]</p>
    <p><a href="http://typophile.com/files/Image_ga.jpg" target="Bilder" rel="nofollow">Image_ga</a><br>
    <a href="http://typophile.com/files/y_ysRA.png" target="Bilder" rel="nofollow">y_ysRA</a><br>
    <a href="http://typophile.com/files/Image_27g.gif" target="Bilder" rel="nofollow">Image_27g</a></p>
    <p>Another picture while working on the ‘s’. I find it personally hard to do the downwards swelling. It tends to go up on the right side. Yet, I tried to keep it symmetrical. This keeps it somewhat warmer in feeling. The hidden photograph also is by Paolo Roversi.</p>
    <p><a href="http://typophile.com/files/Image_Zs_weiter.gif" target="Bilder" rel="nofollow">Image_Zs_weiter</a></p>
