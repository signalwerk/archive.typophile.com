      <p>Thanks a lot for visiting my blog, Bert, and your critics, too.<br>
      Hits me because I particularly like the ‘g’ for its liveliness in forms, specially in the head (yet it keeps elegance)</p>
      <p>But I am looking forward to all comments and hope to see you again here!</p>
      <p>Paolo is great indeed. It helps me a lot to look at the forms of the body that he does inscene so sensitively. I am absolutely convinced of him of being one (if not THE) greatest photographer of our time.</p>
      <p>salutes<br>
      Stefan</p>
