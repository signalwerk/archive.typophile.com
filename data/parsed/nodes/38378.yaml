      <p>One book I have says that Romana was a German variant of DeVinne. There was an H. Berthold face from around 1900 called Lateinisch which was even more similar, including the serif at the top of the A. Probably it's a cyrillic adaptation of that style.</p>
      <p>I've seen Art Nouveau faces similar to the Pravda masthead, but I think it was probably custom. </p>
      <p>Hey, look! Oprah is mentioned! Are you sure this is authentic? (Just kidding.)</p>
