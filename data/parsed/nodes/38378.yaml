    <p>Can anyone ID the typefaces in the attachments?  Most 1970s-80s vintage, but usage probably predates by decades.  I apologize for the quality, it was the best I could do given the relative scarcity of surviving material within reach.</p>
    <p>1.  SovietBookText.jpg:  typical body text face found in virtually every Soviet textbook, also used in newspapers, other official publications.</p>
    <p>2.  GOST1.jpg:  Title block on state standards/specs documents.</p>
    <p>3.  GOST2.jpg:  Alternate title block on state standards/specs documents.</p>
    <p>4.  PravdaRadio.jpg:  used in text boxes in Pravda, in this case the extensive TV and radio schedule.</p>
    <p>5.  PravdaMasthead.jpg:  The (in)famous Pravda masthead, still used at the tabloid successor, pravda.ru;  same typeface was also used for Red Star (Krasnaya Zvezda);  have never seen it anywhere else, but was wondering if an entire typeface character set was ever developed.</p>
    <p>Thanks in advance.</p>
