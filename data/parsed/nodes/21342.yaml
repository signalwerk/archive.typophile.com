    html: |-
      <p>Yeah, what I gathered from research was that Lubalin used a croquil pen (which by the way, anyone know where one goes about finding such a device?) to do the sketches and then would hand them on to a partner to do the "grunt work." </p>
      <p>On Spencerian Script: There's a book with some nice samples of early american penmanship called "An Elegant Hand: The Golden Age of American Penmanship and Calligraphy" by William E. Henning, Paul Melzer. Lots of interesting writing (and some illustrations using the writing techniques/drills) by people that had more patience than I could ever have... they tell how young Platt Spencer saved and saved for one sheet of paper and up until that day he had been practicing his writing on bark! It's out of print but worth checking out if your library has it or you find it at a good price.</p>
