      <p>I'll chime in with this fact:<br>
      both the Shawmut logo *and* the Mommie font (taken probably from the reproduction in Leslie Cabarga's book) are either the work of or inspired by Tony DiSpigna.</p>
      <p>Without his personal development of script forms, none of these would exist. And another reason for all designers to learn how to draw without beziers...</p>
