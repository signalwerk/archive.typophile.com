      <p>Also, rather than Herb Lubalin, wouldn't you say it was Ed Benguiat who did the fancy calligraphic scripts? Certainly that's who shows up in the Photo-Lettering Catalogs with the Spencerian script styles, along with M. M. Davison and Frank Bartuska (among others).</p>
      <p>Just trying to see if we can give the design credit where it might be due.</p>
