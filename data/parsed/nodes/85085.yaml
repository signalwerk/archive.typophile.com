      <p>Jairus: have a look at the e’s and a’s!</p>
      <p>I couldn’t find an exact match either, but alternatives include Scotch Modern, Benton Modern, Miller, Century, Ingeborg, Mondegreen, Bohemia, Escrow etc. As Jairus observed, it’s spaced tighter than textfaces usually are. That’s also why I first looked to ITC, but to no avail.</p>
      <p>Btw, that inktrap on the “d” might be clue.</p>
