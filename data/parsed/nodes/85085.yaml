    html: <p>I played with this for quite awhile and can only tell you what I think, because I know nothing for sure.  I think this is actually three different fonts, one for each word(maybe nuts who knows) and it has been messed with, the scale height has been increased and it has negative tracking applied for effect.  Very close in adobe caslon oldstyle bold and baskerville simi bold.  It appears as though outlines were created and a free transform applied without regard to scale(this is a no no).  It's just what I think, and I think it will be next to impossible to find an exact match for this reason.</p>
