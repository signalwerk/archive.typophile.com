    html: |-
      <p>Although it obviously <em>is</em> Century, I had to poke around MyFonts quite a bit before I could find a version that had the same degree of boldness and condensation.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/efscangraphic/century-no1-sb/" rel="nofollow">http://new.myfonts.com/fonts/efscangraphic/century-no1-sb/</a></p>
      <p>The next closest match is Century BQ Bold:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/berthold/century-bq/" rel="nofollow">http://new.myfonts.com/fonts/berthold/century-bq/</a></p>
      <p>Thus, nothing exactly like it is found from Monotype Imaging:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/itc-century/" rel="nofollow">http://new.myfonts.com/fonts/agfa/itc-century/</a></p>
      <p>or from ITC:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/itc-century/" rel="nofollow">http://new.myfonts.com/fonts/agfa/itc-century/</a></p>
      <p>or among Bitstream's versions of Century 751:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/century-751/" rel="nofollow">http://new.myfonts.com/fonts/bitstream/century-751/</a></p>
      <p>and the versions of Century Expanded from Elsner and Flake, Scangraphic and URW++ consist of only the roman and italic, without even a bold.</p>
