    <p>I’ve seen the typeface used in a couple other places, and came across it again here : </p>
    <p><a href="https://web.archive.org/web/20081121181033/http://shinymedia.blogs.com/photos/uncategorized/dc_new_zealand.jpg" title="http://shinymedia.blogs.com/photos/uncategorized/dc_new_zealand.jpg">http://shinymedia.blogs.com/photos/uncategorized/dc_new_zealand.jpg</a></p>
    <p>It’s definately not Eurostile.  The closest I could come up with was LTC’s Octic Gothic Two ( <a href="https://web.archive.org/web/20081121181033/http://www.p22.com/lanston/octicgothic.html" title="http://www.p22.com/lanston/octicgothic.html">http://www.p22.com/lanston/octicgothic.html</a> ), but the R, S and others are different.</p>
    <p>It’s been bugging me for quite a while.</p>
    <p>Anyone else willing to take a stab?</p>
