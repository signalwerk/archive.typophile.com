  html: "<p>There's something that I used to use a lot in Quark, but haven't been able to figure out how to do it in InDesign yet: <br> <br>Say you have a block of text that has a mixture of leading values, or a mixture of tracking values. <br> <br>If you select the whole block, the \"nudge\" arrows become inactive. Is there a way around this?</p>"
