    html: |-
      <p><cite>pos Q by comma -20;</cite></p>
      <p>Andreas, you were dreaming of substitution -- no 'by' in pos commands.&nbsp;&nbsp;;-)</p>
      <p><cite>which seem to be my exceptions</cite></p>
      <p>Looks like there is something wrong with classes: one glyph appearing in more than one leftside class, or in more than one rightside class. I think you should check your class definitions first.<br>
      About 3400 kerning pairs <cite>may be</cite> (but not necessarily are) critical. If you generate fonts with AFDKO 2, you can also try to kick out lines with "subtable break" and add an explicit lookup definition with 'useExtension', so your kern feature looks like this (please exchange parentheses by braces):</p>
      <p>feature kern (<br>
      &nbsp;&nbsp;&nbsp;&nbsp;lookup kern0 useExtension (<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos A B 12;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos B C 32;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;) kern0;<br>
      ) kern;</p>
      <p>But mind that FLS5 cannot compile this, and that such a kern feature will be interpreted only by a few OT-savvy applications like those of Creative Suite.</p>
