    <p>Dear forum,</p>
    <p>I'm getting a subtable overflow while trying to compile my features within FL Studio.<br>
    Now I tried building the kern feature with FDK, but still I'm getting an overflow. No mixing up different scripts within the classes and also kerning should not be too much (3400 pairs, when expanded 152k).<br>
    <em>GPOS feature 'kern' causes overflow of offset to a subtable (0x11a00)</em></p>
    <p>Also there's quite a lot of this stuff:<br>
    <em>Pair positioning has two different values in 'kern' feature; choosing the smaller absolute value: Q comma</em><br>
    which seem to be my exceptions.</p>
    <p>Any idea?</p>
    <p>Thank you,</p>
    <p>Chris</p>
