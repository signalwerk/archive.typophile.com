      <p>If you are having problems resolving class conflicts, here's what works for me.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kern1_5402.png"></div><br>
      First, select "class kerning" in the metrics panel.<br>
      .<br>
      <div class="imageWrap"><img src="http://typophile.com/files/kern3_3773.png"></div><br>
      This has several benefits, one of which is to highlight class conflicts in red.<br>
      Here, v and c are the master characters in their classes, and y is included in the "v" class.<br>
      Therefore, when I attempt to apply a different kern value between y and c, FontLab marks it with a red number warning.<br>
      .<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Picture3_3947.jpg"></div><br>
      This value is also listed in red in the kern pair table at the right of the metrics window, enabling one to scroll throught the entire kern pairs in a font, looking for conflicts.<p></p>
