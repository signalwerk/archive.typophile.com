    html: |-
      <p>yes, I'm dreaming...</p>
      <p>#exceptions</p>
      <p>pos Q comma -20;</p>
      <p>enum pos @_kern_Q @_kern_comma -20;<br>
      #or<br>
      enum pos [Q Q.alt] [comma colon] -20; </p>
      <p>and this works in Fontlab - but do it on the top of your kern list.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
