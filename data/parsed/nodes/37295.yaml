    html: |-
      <p>For exceptions use single kern pairs at the top of the kerning file.</p>
      <p>#exceptions<br>
      pos Q by comma -20; </p>
      <p>#you can use "enum" to work with classes for exceptions - enum spiltes the classes into singles during compilation</p>
      <p>enum pos @_kern_Q by @_kern_... -20;</p>
      <p>Be sure, no glyph is part of two or more classes!</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
    html_clean: |-
