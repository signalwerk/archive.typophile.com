  html: <p>Hola Amigos, <br> <br>I have a theory about this situation, discussed in the Build Forums, on a couple of weeks ago <br> <br>I receive an email from Hugo Perez from the pixietype foundry announcing new fonts with grey effects. <br> <br>I was trying to contact him about a month ago,  <br>asking about if they have an authorization from FFF or truth in Design for using the FX technique who was created and owned by Truth in Design, who is the same as super pixel fonts, Whith no responses. <br> <br>I can`t understand why pixietype are selling, if they lauch before FFF first super pixel fonts, it seems they are making the same super pixel stuff without autorization, this behaviour is very suspicious. <br> <br>It seems that they buy a font form FFF,open in fog, and make the same technique, just changing the name. This is not fair, there are a lot of job behind this new greyscale trick, and this guys seems to non stop, without giving any credits or licence fee to TiD. <br> <br>Please tell me what do you think about this topic Typophiles, i dont want to be rude with pixietype or Hugo, but i believe in respect of the job behind this technology contribution in typography. <br>    <br> <br>Regards, <br> <br>mh.</p>
  html_clean: <p>Hola Amigos, <br> <br>I have a theory about this situation, discussed in the Build Forums, on a couple of weeks ago <br> <br>I receive an email from Hugo Perez from the pixietype foundry announcing new fonts with grey effects. <br> <br>I was trying to contact him about a month ago,  <br>asking about if they have an authorization from FFF or truth in Design for using the FX technique who was created and owned by Truth in Design, who is the same as super pixel fonts, Whith no responses. <br> <br>I can`t understand why pixietype are selling, if they lauch before FFF first super pixel fonts, it seems they are making the same super pixel stuff without autorization, this behaviour is very suspicious. <br> <br>It seems that they buy a font form FFF,open in fog, and make the same technique, just changing the name. This is not fair, there are a lot of job behind this new greyscale trick, and this guys seems to non stop, without giving any credits or licence fee to TiD. <br> <br>Please tell me what do you think about this topic Typophiles, i dont want to be rude with pixietype or Hugo, but i believe in respect of the job behind this technology contribution in typography. <br>    <br> <br>Regards, <br> <br>mh.</p>
