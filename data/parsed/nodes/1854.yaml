    html: <p>&gt; In September TiD will launch a new library <br> <br>Along with a time-reversal machine?  ;-) <br> <br>&gt; Does the gray have much impact on LCD displays? <br> <br>You can design for LCDs or CRTs (the latter needing less "splay" in the grays), or try to average out both. Same with Windows/MacOS (the latter having a much flatter gamma). I lean towards the former for both. <br> <br>&gt; I was doing that in 1988 <br> <br>A number of people have done it in the past (like de Groot, and Tankard), but there was no good way of <i>delivering</i> it to users. MacOS for one totally ignores bitmaps (except when it crashes trying to display them). <br> <br>hhp <br></p>
