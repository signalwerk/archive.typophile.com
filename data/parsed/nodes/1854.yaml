    html: <p>No way ... Dr. Halo the 8 bit DOS paint package ... darrel you are way ahead of the game. ;] <br> <br>A lot of people aren't going to like the look or idea of greyscale pixel fonts. Pixel crispness/crunchiness is a blessing/curse.  <br> <br>With the TiD system, the fine tuning is up to the typographer. You can tweak "splay" in ClearType, MacOS and FreeType, but tuning is basically cooked into Super and Ultra Pixel fonts and anything else using the subpixel technique. If it's well-cooked, fewer people will want to adjust the knobs. <br> <br>&gt; &gt; In September TiD will launch a new library  <br>&gt; Along with a time-reversal machine? ;-)  <br> <br>make that November. Somebody give me a brain! <br> <br>I wrote this cause my email reply to this forum never showed up. If it does, see "brain".</p>
