    html: "<p>Hi, <br>First of all, english is not my original language so, sorry. <br>All I do is add quarter and eighth pixels to a standard pixel font. You can call it 'pixel font with greys' or 'hand made anti aliasing'. <br>Chris Lowery said in another post: \"\"Super Pixel fonts\" describes a patent pending technique which provides reliable rendering on all TrueType environments. Your grey dot fonts will probably be great but they won't be \"Super Pixel fonts\" unless you license with us and build them like we do. Hrant is right, it takes more than sub-pixels. <br> <br>All I do is sub-pixels. I DO NOT use the technology that TiD have. So I don't do Super Pixel Fonts. <br>I DO NO WANT to break any law, do something illegal or steal any technology.  <br>If I'm doing this, sorry, I'll stop selling fonts with semi-pixels, sub-pixel or whatever you want to name it.  <br> <br>Thanks <br>Hugo Perez <br>Pixietype.com</p>"
    html_clean: "<p>Hi, <br>First of all, english is not my original language so, sorry. <br>All I do is add quarter and eighth pixels to a standard pixel font. You can call it 'pixel font with greys' or 'hand made anti aliasing'. <br>Chris Lowery said in another post: \"\"Super Pixel fonts\" describes a patent pending technique which provides reliable rendering on all TrueType environments. Your grey dot fonts will probably be great but they won't be \"Super Pixel fonts\" unless you license with us and build them like we do. Hrant is right, it takes more than sub-pixels. <br> <br>All I do is sub-pixels. I DO NOT use the technology that TiD have. So I don't do Super Pixel Fonts. <br>I DO NO WANT to break any law, do something illegal or steal any technology.  <br>If I'm doing this, sorry, I'll stop selling fonts with semi-pixels, sub-pixel or whatever you want to name it.  <br> <br>Thanks <br>Hugo Perez <br>Pixietype.com</p>"
