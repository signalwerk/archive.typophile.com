    html: <p>Hugo, thanks for your comments. Please look for my response on your pixietype info address. <br> <br>Any developer who wants to create sub-pixel fonts can get support, licensing, and a good royalty through TiD's new site, which will launch in November. You do not need to know how to create sub-pixel fonts, only to paint all the characters in a GIF. TiD handles the rest. We will publish great fonts from anyone.  <br> <br>To become a licensed developer, contact me through typophile or truth @ truthindesign.com. I apologize for this use of Typophile for commercial information. <br> <br>-chris</p>
