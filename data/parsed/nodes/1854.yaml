    html: "<p>But weren't you previously saying that TiD's \"technology\" was no big deal, not a real invention? <br> <br>Certainly, if Pixietype <i>did</i> swipe the technology (but how can you be sure?) without even giving credit, it's unethical. But without a patent on the part of TiD, it's not illegal. And if they just had the idea of making grayscale fonts by filling in \"partial\" pixels, and they developed their own techniques to do so, it's probably OK. <br> <br>Bottom line for me: if we become certain that Pixietype has indeed behaved unethically, we should mount a petition campaign. Otherwise it's more productive to spend the time pushing the envelope further. Handmade ClearType bitmaps, anyone?  :-) <br> <br>hhp <br></p>"
