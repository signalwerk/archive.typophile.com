      <p>“why is it then, that these questions about social and environmental responsibility etc. so often pop up in discussions with people involved in type- or graphic-design?”</p>
      <p>Guilt.</p>
      <p>The world of graphic design, for the most part, is an industry based on pure consumerism. While one could argue that there are all sorts of non-consumerist areas of graphic design, without consumerism, we just wouldn’t be that large of an industry.</p>
      <p>And, of course typographers depend a lot of graphic designers, so there’s that ecosystem.</p>
      <p>To get back to the guilt issue, I think the issue is that we talk a lot about it because we are indirectly helping destroy the planet by doing what we do...help sell crap.</p>
      <p>I think there are two mindsets that ’commercial artists’ can have, neither being any better/worse in my opinion:</p>
      <p>1) We are what we are. We help companies make money by providing better designed products, services, and advertising. The specific product/service is irrelevant, our only job is to help the customer meet their goals.</p>
      <p>2) We are a major decision maker on what succeeds and fails in the market place. We as designers should make a conscious analysis of every client and product we work with and establish if it’s socially responsible for us to work with that client and/or/product.</p>
      <p>Marketers have the most guilt. Designers next in th</p>
