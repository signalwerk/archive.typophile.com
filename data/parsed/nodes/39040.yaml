      <p>I have not read “Collapse” yet, but I’m planning to do so when I can follow the title into vacation time.</p>
      <p>I agree with the purpose of Gulliver, it is an old purpose, i.e. before news on the web was practical, lot’s of volume publishers of tomorrow’s garbage sought narrower (and smaller) fonts for purely financial reasons. But today, with trees not used much for paper, (volume publishers of daily publications normally use recycled pulp of some kind), the current frontier of typographic activism is elimination of printing day-after-use garbage altogether. Or at least, that’s what I think. </p>
      <p>On another trail, there is a problem with thinking that “your fonts” will only be used for environmentally friendly purposes if they are at all suited to print use. But Nick says: “Is it really responsible to hype the newest biggest Airbus as being environmentally friendly?” If you don’t then you’re standing at the corner of No-Travel and Don’t Move. I don’t travel much because my carbon footprint can’t come with me, so it is pure burning man to go away without a dire need. However, I know lots and lots of, people will be doing so regardless of my private concerns... so why not root for a more efficient aeroplane? </p>
      <p>And, I see no difference between relative and absolute morality, they are both 8 letters, and are usually about the same width. </p>
      <p>Cheers!</p>
