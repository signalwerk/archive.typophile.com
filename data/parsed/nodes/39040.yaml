      <p>The type industry has already had an impact: fonts are now ethereal digital phantoms; they take no resources to propagate, sell, store or use. They can be used purely in digital output media, they can be recycled (look at the lifespan of digital type compared to other software), and they create no waste when they are deleted. The ultimate green product!  ;)</p>
      <p>USING type (i.e. typography) can take advantage of waste-free or socially responsible methods, but it’s hardly the province of typographers to insist on socially conscionable media, methods or materials when the publisher, writer, soda-pop company or TV conglomerate calls all the shots. </p>
      <p>In other words there isn’t really a meaningful link between social activism and type design. My cooking skills, my spending habits, my recycling strategy, My political affiliation, can all carry on without influence on, or from, my work as a type designer.</p>
