      <p>To patty and aluminum: I completely see your point and I somehow agree, but... You say, that as an individual I have an impact. And you say, that this has nothing to do with our trade. But what I ask myself is, why is it then, that these questions about social and environmental responsibility etc. so often pop up in discussions with people involved in type- or graphic-design?<br>
      To me it looks like there are two things relevant here. The first is, that we work with mass-media on a daily base. We know exactly how powerfull these information channels are and we spend a lot of time in making them accessible for people to get a certain information. We have kinda control how this thing is going to look like, but we rarely have control over the content. This can – in some cases – lead to frustration.<br>
      The second thing is, that our trade has certain, lets say “artistic” aspects. Artists tend to be critical and idealistic.</p>
      <p>If we look back in time many typographers or graphic-designers have become autors themselves. They know the channels, they have contacts to publishers and printers and they know how to make printed stuff – to me it’s only logical, that sooner or later some of them start to write.</p>
      <p>Considering these things I could imagine, that there IS something to discuss about this topic in relation to our trade.</p>
      <p>To the discussion of the green cars... I agree with David – as long as we can not assume, that everybody acts responsible and instead of the car takes his bike, we must assume, that they use the car. So if this car runs with a very low petrol usage compared to the average, this might be a big success... And in that relation it actually might be a green car. Allthough, Nick – these ads make me sick as well... :-)</p>
      <p>Good Night and thank you guys!</p>
