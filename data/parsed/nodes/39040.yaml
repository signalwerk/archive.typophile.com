    <p>Dear Typophiles!</p>
    <p>A more philosophic question for once...</p>
    <p>I have to fullfill an assignment and I want to write about the social responsibility of Type and Typography.</p>
    <p>That’s a big question – I know – and in the end, the answers will be personal opinions or other questions. But in order to find my own position I would like to start a little discussion to this topic, here and now :-)</p>
    <p>Of course I was already thinking about this topic and I first wanted to narrow the thing a bit down, but then I thought it’s better to just keep everything open. I’m just curious about what you guys think is social responsibility in our job? how do you bear this responsibility (if there is such a thing) in your daily work? Are there (historical) examples, that (kind of) support your arguments?</p>
    <p>And now, go operate your keyboards untill they melt!!! :-D</p>
