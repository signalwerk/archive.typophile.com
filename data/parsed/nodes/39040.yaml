      <p>First – thanks to everybody!</p>
      <p>David – you’re right, now that I saw the other thread as well it might be wise, to either close my thread (like James kinda suggested) or to push it into the type-direction. To me the latter would be more satisfying, since the “end result” will actually be type. To give it a try – Gerard Ungers Gulliver is an attempt to create a typeface, that is economic. In other words it safes paper and thus trees. Behind it’s design there was that “ecological” concept and out of this idea Gulliver was born. I think this is an example what social responsibility COULD be... What do you think?</p>
