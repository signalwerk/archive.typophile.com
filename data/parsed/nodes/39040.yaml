      <p>”...what you [people] think is social responsibility in our job?”<br>
      There was another thread, previously linked to from this thread, that discusses s.r. in general graphic design, but that thread, though it ranged from Sinatra and the Pharaohs to Ethics and the CIA, left little room for type. I think, in general, responsibility has more grip on g.d. where the end result is “in sight”.</p>
      <p>Different kinds of responsibility may be found throughout the spectrum of type design, from those working on complex systems of fonts for the typography of rich but unseen documents, to those working on the perfection of the letters for a single word they know all too well. Are you talking about type design, or graphic design?  </p>
      <p>”..how do you bear this responsibility (if there is such a thing) in your daily work?”<br>
      I don’t purchase print products as much as possible. I force myself, activity by activity, to use digital alternatives, improving them and propagating appropriate improvements to others as much as I can along the way.</p>
      <p>“Are there (historical) examples, that (kind of) support your arguments?”<br>
      What argument? :)</p>
      <p>Cheers!</p>
