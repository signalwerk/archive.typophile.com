      <p>I think trying to adapt the enormously broad concept of social responsibility to the rather narrow field of type design may not be the best use of our time. The use the fonts are put to  (or who buys them) is usually way out of the hands of the designer. I mean one can hardly place your fonts off limits to, say, republican presidential candidates. In other words, aside from designing custom fonts for big oil or pharmaceutical companies it’s hard for me to think of a way that a type designer can be socially irresponsible, professionally. And since the wider idea of socially responsibility in graphic design has already been covered in another thread...</p>
      <p>I say buy compact fluorescent lightbulbs, use public transportation and vote. Donate some of your earnings to causes you believe in. Carry around a reusable tote bag. Give an old lady or a pregnant woman your seat on the bus. Don’t buy gold or diamonds. Avoid fast food restaurants and chain stores - try to eat locally produced, organic food. Don’t eat chilean sea bass or other threatened fish. Keep after your elected officials, urge them to vote responsibly. Shut off the water while you brush your teeth. Try to avoid products made in countries that don’t have good employment or environmental practices (such as China). Take to the streets to support causes that are important to you. Don’t force your daughter to undergo female circumcision. The list goes on.</p>
