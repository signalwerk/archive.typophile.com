    <p>The one fixed point is that the logo, which is on the cover and first interior page, uses Arnold Boecklin. This is such a floridly art nouveau face that it seems the obvious thing to do is go with that theme in the design. I can just about see something like Korinna, or maybe Magister Book, for display use, but then what would work as a text face? The obvious period faces that are suitable are mostly moderns like Century Expanded, which seem like the sort of thing art nouveau was reacting against. What did art nouveau designers use when they needed to set large amounts of text fairly unobtrusively? Perhaps one of the early old-style revivals like Cheltenham? (that one's probably not right for this use, though)</p>
    <p>Or is art nouveau so contradictory to the aesthetic of scholarly journals that I might better forget it, pretend the logo isn't there, and design it around some other idea entirely?</p>
