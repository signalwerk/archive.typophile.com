      <p>How about Clearface?<br>
      It's a progressive face of the early 20th century on several counts, with the mother of all modernist type names.<br>
      Firstly, its design strategy addresses legibility in as logical a response to scientific reading theory as has ever been made. (It would be interesting to know more of how it was tested in prototype.)<br>
      Secondly, the way it does that is somewhat organic (hence connection to art nouveau) in the "extra" lower-case balled terminals, which grow on "branches" which sprout from the main stems in a curvy way--like round seed husks as seedlings push them towards the sky. (The "r" is very nice.)<br>
      Thirdly, it's proportions are compact and develop upon the evolutionary line that runs from the original didones, through the scotch moderns, to the more sturdily rendered Century styles of the early 20th century.<br>
      Fourthly, it is a member of the first sans + serif mega-family -- and you can get a lot of mileage out of the sans side.</p>
