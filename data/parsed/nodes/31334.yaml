    html: <p>I'm with Dan and Nick on this, but as Thomas has mentioned Belwe I'd thought I'd chime in and suggest <a href="http://www.myfonts.com/fonts/bitstream/windsor/" rel="nofollow">Windsor</a>. However I don't believe it has enough versatility for academic text setting, whereas Goudy Sans or Clearface clearly would have – a blurring of these distinct notions might produce a choice like <a href="http://www.myfonts.com/search?search%5Btext%5D=bookman" rel="nofollow">Bookman</a> which is not very far from your initial idea about Cheltenham...</p>
