  - id: 184059
    user: 12518
    date: 2007-02-10T16:31:00
    date_raw: 10 Feb 2007 — 4:31pm
    votes: null
    html: <p>These are great suggestions everyone; they're all helping me see this in different ways. I think Windsor may not quite work for extended text, but it does highlight a possible connection - Windsor and Belwe both have an element of Venetian in them. Belwe might pair well with an early 20th-cent. Venetian like Centaur, although the swashes on V and W might be a bit too flamboyant in this use. I'm not sure if Windsor contrasts enough to be useful as display type with a Venetian, but it's certainly in the right spirit for something that nods to both art nouveau and academic sobriety. And Korinna is in somewhat the same position with regard to Bookman.</p>
