      <p>Hmmmmmmmm, all good constructive feedback. And loads for me to consider. <br> <br>I think the main reason that i ran into difficulties was that the font look began with an ident for Sony Music. I was creating a logotype for 'network music' (working title). This seemed to work really well by taking the n &amp; m and overlapping them, which then created a coil/network look(see attached). So, although i had a look that i was happy with, I had started the font with some limited letters, and tried to keep the design to their restrictions. <br> <br>I'm not finished yet though... <br> <br>Astonished at the feedback though! <br>Good work fellas!  </p>
