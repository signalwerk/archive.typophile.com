  - id: 48540
    user: 110
    date: 2003-01-31T11:31:00
    date_raw: 31 Jan 2003 — 11:31am
    votes: null
    html: "<p>The methodology you're using reminds me of Phil Baines' font for the <a href=\"http://www.fontshop.com/virtual/products/eng/fuse01.htm\"> very first issue</a> of <a href=\"http://www.fontshop.com/virtual/products/eng/fuse.cfm\"> FUSE</a>, \"Can you...\". He researched which parts are essential for each character to stay legible. His solution was brilliant and proved to be perfectly legible in text setting, but I must add he got away with it because he used Clarendon as raw material. The big chunky serifs proved to be essential in the recognition of the character fragments. <br> <br>In your case, though the type is esthetically very attractive, I fear you take it a step too far. You'll be experiencing major problems in \"text setting\" (I don't mean a full novel here <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">), because your typeface will rely too much on context for several characters to be correctly interpreted. <br> <br>Apart from trying out Nathan's and Cristian's suggestions, what you could do would be to look at each character separately, be real hard on yourself and ask yourself: if I really want to read this character \"wrong\", what part is missing that allows me to do that? Then you go back and try to find that distinctive detail that makes your f an f and not an r. <br> <br>Nate, I don't know which font you mean with DS NSW, but Designers Republic once made a brilliant face made up entirely of cut-up \"8\"s. It is featured in \"their\" issue of <a href=\"http://www.emigre.com/EMag.php?issue=29\"> Emigre Magazine</a>. </p>"
    html_clean: "<p>The methodology you're using reminds me of Phil Baines' font for the <a href=\"http://www.fontshop.com/virtual/products/eng/fuse01.htm\"> very first issue</a> of <a href=\"http://www.fontshop.com/virtual/products/eng/fuse.cfm\"> FUSE</a>, \"Can you...\". He researched which parts are essential for each character to stay legible. His solution was brilliant and proved to be perfectly legible in text setting, but I must add he got away with it because he used Clarendon as raw material. The big chunky serifs proved to be essential in the recognition of the character fragments. <br> <br>In your case, though the type is esthetically very attractive, I fear you take it a step too far. You'll be experiencing major problems in \"text setting\" (I don't mean a full novel here <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">), because your typeface will rely too much on context for several characters to be correctly interpreted. <br> <br>Apart from trying out Nathan's and Cristian's suggestions, what you could do would be to look at each character separately, be real hard on yourself and ask yourself: if I really want to read this character \"wrong\", what part is missing that allows me to do that? Then you go back and try to find that distinctive detail that makes your f an f and not an r. <br> <br>Nate, I don't know which font you mean with DS NSW, but Designers Republic once made a brilliant face made up entirely of cut-up \"8\"s. It is featured in \"their\" issue of <a href=\"http://www.emigre.com/EMag.php?issue=29\"> Emigre Magazine</a>. </p>"
