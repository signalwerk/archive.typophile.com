    html: "<p>Yves: DSNSW is a TDR font too. If my poor memory serves at all, it came on a CD in a book they put out. It's the same idea as the Emigre one I guess (I've not seen that one), except that it uses all the numerals. And it displays a ridiculous little heart for all punctuation. <br> <br>Jeremy: Just thought of another font you might look at - Wim Crouwel's <a href=\"http://proto.thinkquest.nl/~ara140/html/index/013_crouwel.html\" target=\"_blank\"> New Alphabet</a>. It was a face from the early days of electronic typesetting. Meant as more of a theoretical foray than a useful face as I understood it, but an interesting experiment nonetheless. <br> <br>Looking forward to seeing how this evolves.</p>"
