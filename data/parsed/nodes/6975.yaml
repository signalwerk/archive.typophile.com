    date: 2003-01-30T19:26:00
    date_raw: 30 Jan 2003 — 7:26pm
    votes: null
    html: "<p>Jeremy: I must say, I'm a sucker for fonts like this that push the edges of legibilty. My suggestions would be (1) add a small vertical stroke to the 'g' (like you have on the 'u'); (2) add some sort of horizontal articulation to the 'f' so it doesn't get mistaken for an 'r'; (3) likewise with the 't' which looks like an 'l'; (4) have you considered raising the '3' and '8' so they don't fall so far beneath the baseline? <br> <br>I find it pretty legible now (oddly enough), but I wonder what it'll look like when it's not in alphabetic order. E.g., the name is <i>much</i> harder to read than the character set - I'm not sure if that bothers you or not. And, all in all, I think the numerals are harder to read than the letters. <br> <br>Interesting beginning. You might be interested in a font called DS NSW - a character set constructed from chopped up numerals. If I can find a link to it, I'll post it for you. <br> <br>Cheers. <br> <br>Nate <br> <br>ps Tim: I found that if I saved the .swf file to disk and then changed the extension (from .unk to .swf) it opened up fine.</p>"
    html_clean: "<p>Jeremy: I must say, I'm a sucker for fonts like this that push the edges of legibilty. My suggestions would be (1) add a small vertical stroke to the 'g' (like you have on the 'u'); (2) add some sort of horizontal articulation to the 'f' so it doesn't get mistaken for an 'r'; (3) likewise with the 't' which looks like an 'l'; (4) have you considered raising the '3' and '8' so they don't fall so far beneath the baseline? <br> <br>I find it pretty legible now (oddly enough), but I wonder what it'll look like when it's not in alphabetic order. E.g., the name is <i>much</i> harder to read than the character set - I'm not sure if that bothers you or not. And, all in all, I think the numerals are harder to read than the letters. <br> <br>Interesting beginning. You might be interested in a font called DS NSW - a character set constructed from chopped up numerals. If I can find a link to it, I'll post it for you. <br> <br>Cheers. <br> <br>Nate <br> <br>ps Tim: I found that if I saved the .swf file to disk and then changed the extension (from .unk to .swf) it opened up fine.</p>"
