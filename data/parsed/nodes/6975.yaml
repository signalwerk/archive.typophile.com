  - id: 48546
    user: 1470
    date: 2003-02-07T10:30:00
    date_raw: 7 Feb 2003 — 10:30am
    votes: null
    html: "<p>I like the look of this, but would definitely need to see it in a text setting. I do have a few suggestions that might help readablity, though: <br> <br>1. switch the 4 and the y. I think the curved descender would work much better with the letter, maybe mirror it so that it curves away to the left. <br> <br>2. maybe turn the numerals into text figures... keep the three. drop the 1, 4, 5 and 7 (adding something to the 7). raise the 8. rotate the 6 and 9 CCW and give them an ascender/descender respectively. <br> <br>3. dropping the 1 and 5 might help distinguish them from the i and s, but you still have the o and 0 as identical. There might be no help for that. <br> <br>Overall, it's very cool, but you might have to break some of your boundaries to make it readable.</p>"
    html_clean: "<p>I like the look of this, but would definitely need to see it in a text setting. I do have a few suggestions that might help readablity, though: <br> <br>1. switch the 4 and the y. I think the curved descender would work much better with the letter, maybe mirror it so that it curves away to the left. <br> <br>2. maybe turn the numerals into text figures... keep the three. drop the 1, 4, 5 and 7 (adding something to the 7). raise the 8. rotate the 6 and 9 CCW and give them an ascender/descender respectively. <br> <br>3. dropping the 1 and 5 might help distinguish them from the i and s, but you still have the o and 0 as identical. There might be no help for that. <br> <br>Overall, it's very cool, but you might have to break some of your boundaries to make it readable.</p>"
