  - id: 48544
    user: 107
    date: 2003-02-02T15:19:00
    date_raw: 2 Feb 2003 — 3:19pm
    votes: null
    html: <p>The DSOS1 book/CD is very fun! I drove myself nuts for 2 days after I got it, playing games to "win" access to fonts. Then I kept playing because I wanted to get the highest score in the world. It's as addictive as Space Invaders ever was. Although not all the fonts are the most useable, there are some really well-done modern types, including some yummy layered designs. And there are all kinds of little digital treasures and clever experiments to enjoy. Plus, the DS crew has a sense of humor about their work - it's a refreshing contrast to the "you-must-take-me-oh-so-seriously" design crowd.</p>
