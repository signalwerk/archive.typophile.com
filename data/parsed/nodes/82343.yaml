      <p>Alright, in case other people wonder about provenience of the above font...</p>
      <p>Well... there is a thermic printer of model <em>TTP 2000</em>, manufactured by Zebra consortium.</p>
      <p>The name of that font-family is <em>ATM9 (Monospaced 14.4 cpi)</em></p>
      <p>All that I can do is use a vector-editing program such as Adobe Illustrator or CorelDraw and start creating each shape/letter/character in that font and then use a TTF-font program to merge together all the shapes/letter/characters created with the vector program, and the result is gonna be a .ttf file.</p>
      <p>Uchh, what a time consuming task !</p>
