    <p>Hello,</p>
    <p>I need badly to ID the font in the image below:</p>
    <p><a class="freelinking external" href="http://img580.imageshack.us/img580/7117/thermicreceiptfontjanua.png" rel="nofollow">http://img580.imageshack.us/img580/7117/thermicreceiptfontjanua.png</a></p>
    <p>It is a monospaced font from a thermal receipt printer. The problem is that I don't know the name of the manufactuer of the printer, nothing is wroten on the machine !</p>
    <p>Special attention should be focused on:</p>
    <p>- capital-letter A, small-letter a<br>
    - capital-letter G<br>
    - capital-letter I, small-letter i<br>
    - number 1, number 4, number 7</p>
    <p>Thank you !</p>
