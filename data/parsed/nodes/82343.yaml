      <p>As I understand it, these 'fonts' are not digital fonts as you have on your computer. They are built into the printer either with circuitry or firmware, which is not accessible by the user.</p>
      <p>Maybe someone else can speak with more authority about this, but the main point is that I do not think this is a font the way we usually speak of them.</p>
      <p>With all that said, you may be able to find fonts that try to replicate this look. FontFont calls these 'ironic' fonts, because they try to imitate non-digital type, such as dot matrix printers or hand-stamps.</p>
      <p>- Mike Yanega</p>
