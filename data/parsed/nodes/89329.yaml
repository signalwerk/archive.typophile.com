    html: |-
      <p>Sii, Twin was one of the inspirations for this project. Robbie owns the book documenting its development, and we found Twin was never truly implemented on a citywide scale, and Unfortunately remains just a extremely well-designed curiosity. Our objective is to have this be the first implemented typeface for a municipal area in the United States.</p>
      <p>We have partnered with a local design firm, D+J to assist us in reaching the local community. We are having a AIGA sponsored event at a local gathering place to get feedback and support. D+J <a class="freelinking external" href="http://workwith.dj/" rel="nofollow">http://workwith.dj/</a> have provided a number of contacts, local designers and local politicians who ultimately will be the ones who can help us most with officially implementing the project, an important distinction between us and Twin.</p>
      <p>Frode, I was just posting to let the typographic community know that this effort is underway. Our primary push is to the local Chattanooga community and businesses to foster support for this project. I anticipate that we will do very well with that as we have a number of invested individuals who really want this project to work, even outside of the graphic design community. Consider this post just a very small branch of what we are doing. I do think that the typographic community as a whole would do well to pay attention to this idea, as it could open a brand-new market if we are successful.</p>
      <p>You mentioned the stencil design, and I agree. The consensus thus far is that the stencil design will not be the primary form, but our initial experiments required a very distinctive display type to highlight its differences to the community here. We are planning a number of style sets so that different areas the community can feel they are included in this project. For one particular area, we will have a style set so that even though the font is for Chattanooga, the smaller areas can still have their own identity, but be part of that overall identity. That is one of the great things about using a typeface as branding.</p>
      <p>And, I am aware of the distinction of a typographer and type designer, but one battle at a time.</p>
      <p>Thank you all for your interest and comments thus far. The team welcomes anything more you have to say about the project.</p>
      <p>JDooley</p>
