      <p>I haven't been on here in months thanks to starting a new job — in Chattanooga —&nbsp;and I log on and this is what I see.  Crazy.</p>
      <p>While I do think Chattanooga is a city that has the type of people that could appreciate it (though perhaps I'd see Savannah as the first of the Southern cities to get a font), to be honest I just don't see Chattanooga in the proposed face.  The shapes are just too clean and rounded for a city that focuses so much on the outdoors which are&nbsp;its main tourism engine.  I would envision a font that combines that rugged attraction with the city's history —&nbsp;antebellum/civil war/industry/trains.  The bridges are mentioned as influences, and while the Market St bridge does have a smoother arch, but I definitely find the Walnut St bridge to be more emblematic —&nbsp;it's the walking bridge, with wood planks recalling railroad ties and used by the pedestrians that really set off Chattanooga from a lot of other Southern towns of its size (e.g. Birmingham).</p>
