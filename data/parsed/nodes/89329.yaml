    html: |-
      <p>Has anyone thought of bring up the concept of “<a href="http://en.wikipedia.org/wiki/Disneyfication" rel="nofollow">Disneyfication</a>” in this context? In Halifax, Nova Scotia, the largest industry is tourism. As such, the majority of our waterfront has been transformed into a tacky tourist version of itself, where they force minimum wage employees in taverns and the like to dress up in period costumes, walk along the boardwalk, sing old-tyme sailor tunes &amp;c, all veiled in the spirit of cultural preservation. </p>
      <p>It’s an interesting discussion though. Imagine an endangered species. You can let it die, or put it in a cage and breed it. However, by caging it, even though you are keeping it alive, you are removing it’s natural ability to adapt and thrive in a changing environment, ultimately working against your own end.</p>
      <p>The closest real-world example I can think of is the passing of <a href="http://en.wikipedia.org/wiki/Charter_of_the_French_Language" rel="nofollow">Bill 101</a> in Québec city, 1997. It legally required you to have all of your signage with French as the predominant language ie; bigger and at the top. This was very controversial at the time.</p>
      <p>But again, it raises the question, what is the best way to preserve, or in the case of Chattanooga and Chatype, promote, a culture in a natural and sustainable fashion?</p>
      <p>Will there be city-wide brand strategy? Signage restrictions? An identity-standards manual for all businesses? What if my business is from a different culture? Am I still required to use Chatype?</p>
      <p>Food for thought.</p>
