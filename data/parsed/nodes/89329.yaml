    html: |-
      <p>Jackson, thanks for your comment. There are two aspects of this campaign. The first is to raise the money from local Chattanooga citizens, who really don't know that much about typefaces. To them fonts are just stuff on a computer. We have to talk about this and make the case for a font first. I can't really go into that much depth about the development process, etc. in a marketing piece.</p>
      <p>As I said in this message, a lot of thought went into the development of the letterforms and why we chose to design it in a certain way. In our research on the project, we even met with a local historian. When we first started this project I was very interested in Cherokee letterforms, which were invented by Sequoya just a few miles south of Chattanooga. I felt a American typeface, based on an American language that was invented here and is uniquely and will always be American was pretty interesting. We looked at industrial forms, vernacular forms, even the forms of the Walnut street bridge!</p>
      <p>We got a lot of very interesting letter forms from that, but ultimately we decided that looking to the past, and Chattanooga has a very interesting past, is not the right approach. Those ideas remain in the font, but they are more subdued. Some of those ideas explicitly remain in the font, and will become different style sets that we have planed for the different subareas of the city. </p>
      <p>You call this fluff in your tweet, but there were a number of approaches in the Twin City font that were just frankly ridiculous. For example, a program to choose a random font on your computer to represent the city for that day, based on some random weather information? That's fluff, not design. It's an interesting idea, but it's just an idea. It doesn't represent the city at all in visual form.</p>
      <p>I am very interested in documenting the process, and having these conversations about the design decisions we've made. But the kick starter campaign is not the place to make them. To characterize this project as just fluff is not accurate. A substantial amount of research and legwork by the team has gone into the development of this typeface. It is not just something that me and Robbie dusted off from our portfolios and decided to release as a Chattanooga font. To be honest, I think you owe the project an apology. You are free to disagree with the project as a whole or even the design, but to criticise it with no specific reason is not fair.</p>
      <p>Respectfully,</p>
      <p>JDooley</p>
