      <p><cite>... to raise the money from local Chattanooga citizens, who really don't know that much about typefaces. To them fonts are just stuff on a computer ...</cite></p>
      <p><cite>A substantial amount of research and legwork by the team has gone into the development of this typeface. It is not just something that me and Robbie dusted off from our portfolios and decided to release as a Chattanooga font. </cite></p>
      <p>I absolutely agree with this, which is why I think you absolutely need to talk about the process and thinking that went into this project. Without that context, connecting it to the culture/history/people of the city, it just looks like a random font, particularly to people who don't know anything about typefaces. </p>
      <p><cite>To be honest, I think you owe the project an apology. You are free to disagree with the project as a whole or even the design, but to criticize [sic] it with no specific reason is not fair.</cite></p>
      <p>Normally I would agree, it's your project not mine. But, IMO, you opened the project up for discussion both by publicly trying to crowd-fund it and by promoting it in a "General Discussions" forum. Furthermore, I did give a specific reason (your failure to even passingly present a connection between the project goals and your proposed design). </p>
      <p>I'm glad to hear your claims that there is substance underneath the project, and I hope you decide to share it before your project funding ends. These kind of meaty cultural process projects (research-&gt;form) are few and far between in type design and have the potential to be a valuable contribution to the subject, particularly for your audience of people "really don't know that much about typefaces".</p>
