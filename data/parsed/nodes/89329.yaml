    <p>Recently, I have been working with Robbie de Villiers to develop a typeface for Chattanooga. Municipal typefaces are very much in vogue in Europe, but they have not happened in the United States. There's a variety of reasons for that, but this is something I want to see happen more often here in United States. We need to have some sort of a method to kick start this process here in United States. It is not expected to receive any sort of public support or moneys.</p>
    <p>We are very excited to make an impact on the local culture here. The face has been extremely well received so far. Originally we looked at a lot of historical influences, especially the city’s Cherokee foundations. But we ultimately dismissed those because the city is trying to position itself as a very sophisticated and forward-looking technological power. Robbie and I both had our own approaches to the font, and ultimately I took them together and did a font blend. From that blend we identified some common characteristics and carried them forward into a typeface both of us are happy with. The family retains a number of characteristics from both me and Robbie. I also look forward to potentially explaining the process of how we are able to navigate the local politics and also work with local designers in Chattanooga to get this project started, perhaps at Typecon or ATYPI.</p>
    <p>The plan is to develop this typeface with support from individuals on Kickstarter. This typeface will be a four-weight family for the exclusive use of the city of Chattanooga, Tennessee. We have local support from the designers that ultimately will be using the product, and we also have some support from local politicians who will assist us in the implementation of the project. We are looking for your assistance as well in providing some financial support for the development project. We will not sell the project because we will be giving it away for free, but the typeface will be exclusively for the use of Chattanooga related projects. We have been encouraged that several local designers have asked for beta versions of the font to use with city projects.</p>
    <p>There is a potential new market for typefaces for municipalities in United States. We hope that you will partner with us to make this a reality. This is a win-win for the typographic community and also for designers in United States. We really hope that this will add a distinctive new aspect of culture here in Chattanooga, and I hope that you will partner with our team in this endeavor. </p>
    <p><a class="freelinking external" href="http://www.kickstarter.com/projects/chatype/chatype-a-typeface-for-chattanooga-tennessee" rel="nofollow">Kickstarter Information</a></p>
    <p>Thanks!</p>
    <p>JDooley</p>
