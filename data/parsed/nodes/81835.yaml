  html: |-
    <p>I am looking for fonts that have  designed short words like the, for &amp; and built into them. Something like this: <a href="http://matt-griffin.com/download/update6_5.jpg" title="http://matt-griffin.com/download/update6_5.jpg">http://matt-griffin.com/download/update6_5.jpg</a> but in a digital font.</p>
    <p>I have tried searching for ornamental fonts both on MyFonts and on Google but not found anything so I am both asking for the right keywords to search for and if you can possibly direct me to some good ones.</p>
    <p>Thanks in advance all help is greatly appreciated.</p>
