    html: <p>Here is Romana Ultra from the Phil's Photo book. I checked MyFonts for the current Romana's and they are not the same. The 'r' and 'y' are what is not the same, so evidently this is some other foundry's version. The E+F and URW versions have the Ultra weight like a Bolded Bold, and the Ultra weight in Phil's book show definite character changes from the Bold.<img src="http://www.typophile.com/forums/messages/83/26996.gif" alt="Phil's Romana Ultra"></p>
