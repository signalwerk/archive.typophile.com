      <p>Nick, I wasn't sure if you meant we were generalizing or specializing; I get the drift of what you said (at first) now. Thanks for expanding.</p>
      <p><em>statistical comparison of sans with serif is meaningless</em></p>
      <p>Yep, like apples and oranges, or pot versus kettle. I'm skeptical of statistics from having used them in ads to manipulate markets and consumers. Statistics are often made up by people determined to prove what they believe to be reality by throwing a blanket over everything. Qualitative analysis carries relevance and import from the perception of readers. Perception and reader experience is what counts. Testing and stats describe what was tested, and sometimes tell us more about the experiment itself. <em>The act of observing</em> always biases the result.</p>
      <p><em>Bean counting is one way of thinking, design is another.<br>
      In fact, design is more a way of doing.</em></p>
      <p>Are you familiar with Edward De Bono's <em>Thinking for the New Millenium</em>? The key phrase he drummed up for that book is:</p>
      <p><strong>"Design a way forward"</strong></p>
      <p>The book argues that empirical, rational judgement systems that served us in past centuries are outmoded because of the rapid rate of change we live with now, and to survive and compete in our Crave New World we have to shed the judgement-based rationale in deference to "designing a way forward". Solutions to problems that worked yesterday might not work tomorrow, so we need to be a lot more flexible in how we solve problems, designing as we go instead of relying on legacy methods. He doesn't specifically say that the proliferation computers is responsible for the rapid rate of change, but it isn't hard to see that parallel of cause and effect.</p>
      <p>Writers and designers have been designing answers to problems all this time; to us it comes naturally. When I write, I design by arranging words to impose structure. Structure and design makes writing comprehensible.</p>
      <p>I decided a while ago that the fonts we design in years to come may need to incorporate flexibility as an operating principal to allow a font's features and components to adapt to subject matter whose rules for grammar, orthography etc, might be different from the time the font was designed. In short, fonts and alphabets might need to respond to changes imposed by the cultural environment. Fonts might have to adapt and reconfigure themselves in response.</p>
      <p>Its a pretty abstract concept and hard to describe. I hope you can grasp what I'm driving at.</p>
      <p><em>Bit recursive, eh?</em></p>
      <p>It's a backwards-looking model that resembles socialism and is really oppressive. Modernism gone mad. No thanks.</p>
      <p><em>Typographic design is better a process of induction, not deduction.</em></p>
      <p>It is <em>neccessary</em> to absorb from successful models...and it helps to be flexible; adopt, and be prepared to adapt.</p>
