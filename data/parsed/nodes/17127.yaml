      <p>Héctor, you may be making a semantic argument there. Are "comfortable to read" and "readability" the same thing, or just different ways of defining readability? Ease or comfort of reading is integral to readability in the sense that fonts that are "comfortable to read" are inherently more readable.</p>
      <p>I'm not making a 1 = 1 argument, but I think your view is semantic to some extent, rather than describing a practical difference. So I suppose the next question to ask is whether "comfortable to read" can be equated with "readability".</p>
      <p><em>Is this a measured fact or just what we’ve always assumed?</em></p>
      <p>The idea of serifs "aiding readability by helping the eye move from one letter to the next" is an innacurate description how people read. In reality we read words, not letters. We read by cognitive recognition of individual word shapes. The eye does not move from one letter to the next; it takes in word shapes whole and the brain recognizes those shapes with its very sophisticated and specialized shape recognition faculty. </p>
      <p>It is a measured fact from studies by Jarval that seriffed fonts are more readable than sans serifs. Roman type has been proven faster to read, causing fewer backwards saccades (reversions in which the eye jumps back to re-read portions of text, caused by either an ambiguous word shape or an unfamiliar one. Unfamiliar word forms are deciphered letter-by-letter). Hrant Papazian documented the whole phenomenon of how we read in his essay <em>Improving the Tool</em>.</p>
      <p>The scientific analysis of readability and how we read needs to be balanced against the role of cognitive perception in reading. This was discussed a bit on this thread:<br>
      <a href="http://typophile.com/node/9736" title="http://typophile.com/node/9736">http://typophile.com/node/9736</a></p>
      <p>By the way, we're drifting off topic with this discussion of readability :^) I don't mind tho if you guys want to continue. The discussion of the font guide has run its course.</p>
      <p>j a m e s</p>
