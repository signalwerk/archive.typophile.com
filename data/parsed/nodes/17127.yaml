      <p>Darrel, research by Jarval and others is referenced in Hrant's <em>Improving the Tool</em> essay, published in Gunnar Swanson's book <a href="http://www.gunnarswanson.com/GDandR/GDandR_Book.html" rel="nofollow">Graphic Design &amp; Reading</a>. Great reading if you're serious about graphic design and communication or type design, or both.</p>
      <p>You could ask Hrant nicely about getting hold of just his <em>Tool</em> essay. Touch wood.</p>
      <p><em>I’ve also read that reseach has shown that ‘people read best what they’re most familiar with</em></p>
      <p>I don't know that that was from research. I think you mean Zuzana Licko's statement "We read most what we read best". By that she meant that alphabets and fonts are only readable or comprehensible at all because we're familiar with the letter forms. Russians who only read stuff written in the Cyrillic script read Cyrillic best because that's all they've ever read, and since they're not familiar with the Latin alphabet they hardly ever read text set in Latin---because they can't. Their brain's shape cognition cortex is axon-modelled to recognize Cyrillic forms.</p>
      <p><em>...easier to read may simply have to do with that’s what most people read (paperbacks, newspapers, etc.)</em></p>
      <p>You recognize best what you already know. But that's a perception that can change, and reader experience points to certain typefaces being easier to read than others---provided the reader is acclimatized to them.</p>
      <p><em>...also, great post, Nick.</em></p>
      <p>Nick is the fount of articulation, the voice of experience.</p>
      <p>j a m e s</p>
