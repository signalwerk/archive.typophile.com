      <p>James, statistical comparison of sans with serif is meaningless.<br>
      It's like saying men are stronger than women.<br>
      Everybody knows they are, but there are always subsets of either group which reverse the distinction.</p>
      <p>Bean counting is one way of thinking, design is another.<br>
      In fact, design is more a way of doing.<br>
      As design is both practice and theory, proponents of each aspect are always laying greater claim to control. Well, more usually it's the boffins who don't actually do it who are trying to wrest control from the human hand, and systematize and automate the process into a chore suitable for drones and bots.</p>
      <p>With this philosophy, we can look forward to a brave new world in which every consumer has their optimum typographic setting, based on their demographic classification. Bit recursive, eh?</p>
      <p>Nathan is right to call his project a Guide, not Rules.<br>
      But rather than design from learned principle, it is better to learn from practice.<br>
      The best way for a neophyte to get it right is by copying exemplary models.<br>
      if you try to duplicate the word-count and general appearance of a piece of setting that you admire, using a similar (or even the same) font, you will get a much better understanding of the way that typographic parameters work, and interact, than piecing things together from guidelines. You will develop a feeling for type.</p>
      <p>Typographic design is better a process of induction, not deduction.</p>
