      <p>Expressway is based on Ray Larabie's first road signage font, Blue Highway. Expressway is very tightly fitted and as such not well-suited to text, but you can remedy that by applying a bit of letter spacing, say around .2pt to .6pt should give more readable results and be nicer to "look" at (as distinct from reading).</p>
      <p><em>...what high school students are likely to find online...</em><br>
      what high school students are likely to find online <strong>for free</strong>.</p>
      <p><em>...connecting individual shapes to form whole words...</em><br>
      connecting individual letters to form positive word pictures (bouma)</p>
      <p><em>It should blend with the yearbook theme, not distract the reader, and convey an appropriate tone.</em><br>
      It should blend with the yearbook theme, conveying an appropriate tone and not distract the reader.</p>
      <p><em>ALL CAPS can look very serious and dramatically reduces readability</em><br>
      ALL CAPS can look too formal and dramatically <strong>reduce</strong> readability</p>
      <p><em>The major headings in this boook are in all-caps, but have been italicised the speed and modernise the flow.</em><br>
      That may be a perceived quality, one you are projecting or assigning to italic typography rather than an inherent effect. I'm not sure that italicization speeds up reading (if that's what you mean). "Modernise the flow" is ambiguous. Readers may not follow what you mean there. Instead of italicized all-caps consider regular smallcaps; smallcaps tend to be a bit more readable and user-friendly than all-caps.</p>
      <p>Other sans serif candidates: Formata, Frutiger, Myriad (see Frutiger), Brown Gothic, Vera Sans, Officina, Gill Sans, Humanist 531.</p>
      <p>A great alternative to neutral sans serifs for body matter is Bitstream's Chianti. Very readable. Also consider Formata for body text. Syntax is hard to beat tho, embodying all the good humanist traits of the classic book romans in a sans.</p>
      <p>j a m e s</p>
