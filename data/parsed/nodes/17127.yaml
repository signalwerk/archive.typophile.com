      <p>Nathan (noftus), I think it’s great that you are trying to give students suggestions and guidelines for the design and production of their yearbook. </p>
      <p>This is especially a fine opportunity to instill basics of design and typography even if they are not art students, since inevitably they will find themselves in front of a PC or Mac creating a presentation of one kind or another in the future.</p>
      <p>For the most part, virtually every student today is familiar with computers, and many of them have probably selected typefaces for heads and body text via menu options for their school, community and personal projects.</p>
      <p>School yearbook publishers already provide some great tips and FAQs for students who are involved with designing and producing their school yearbook. I feel there is no need to replicate what is readily available to students online.</p>
      <p>I do agree with you strongly about giving them direction as teacher/advisor to student as you are intending to do, because most anyone at anytime can search for info on the Internet, but as a teacher, only you can see if they understand.</p>
      <p>Also, when you are satisfied with your yearbook guide, it would be great if you could post it as a topic in the <a href="http://typophile.com/forum/16" target="new" rel="nofollow">Typographic Education</a> area of Typophile for other teachers and students to review.</p>
      <p><strong><em>Visit these sites with your students</em>:</strong></p>
      <p><a href="http://www.taylorpub.com/Education/typeandgraphics.aspx" target="”new”" rel="nofollow"><strong>Type &amp; Graphics FAQ<br>
      Taylor Publishing</strong></a><br>
      Generally helpful and contains a few of the tips that you intend to include in your Guide. Some of the terminology is geared for general public (not actual graphic arts or type terms used) but it’s presented with high school students and yearbooks in mind. The FAQ even goes into drop caps and specialty typefaces. Slightly dated since they only reference PostScript type fonts, but that’s where you can update your students. </p>
      <p><a href="http://www.jostens.com/yearbook/adobe_contest_winners.asp" target="”new”" rel="nofollow"><strong>2005 InDesign Design Contest winners</strong></a><br>
      Letting students know that taking time to do a job well doesn’t always hit the mark. Letting them see what their contemporaries produced in the previous year might help to set a higher visual standard for their own yearbook. Josten, Inc., runs an annual contest (with prizes) recognizing 15 middle school and high school students for their creativity.</p>
      <p>In addition to the advice you have received by others on Typophile, here are a few suggestions:</p>
      <p><strong>Font vs. Typeface</strong><br>
      This is a personal pet peeve of mine, as I hate to see the word <em>typeface</em> disappear completely as a term.</p>
      <ul><strong>Typefaces</strong> are designed visually. They are selected, set and positioned on a page for visual balance and impact; typefaces are used to organize, display and augment the textual content.
      <p><strong>Fonts</strong> are required in order to access the typefaces with a particular complement of characters or glyphs. Fonts are acquired, loaded and selected for use within particular devices (PC, Mac, mechanical or digital sign plotters, video games, cell phones, etc.).</p></ul>
      <p>If we don’t preserve these distinctions, communications such as this can sound a little ridiculous:</p>
      <p><em>I’d like to use Adobe Garamond for text, but there are no old style numerals. Should I select another typeface or should I load another font?</em></p>
      <p>So far, for personal computers, not ALL fonts contain EVERY available character designed for a given typefaces. A single typeface can also be available in numerous font formats (OpenType, TrueType, PostScript, etc.) and purchasing a single font does not automatically give you license to use any characters, weights, styles, font format, for loading on any device not explicitly contained on that font and as stipulated by the EULA (End User License Agreement).<br>
      Yes, I know this is very complex, and it may not be an actual entry used in your guide, but unless we (educators, design professionals, and the type industry) try to educate ALL type font users about this, the type industry may no longer exist as we know it.</p>
      <p><strong>Ragged right vs Justified columns</strong><br>
      You’ll find this topic hotly debated. Let it be sufficient to advise students that if they decide to use flush left and right justified columns, they should be aware of word spacing inconsistencies, that line spacing/leading becomes more critical, that there will be line width and hyphenation issues, etc.</p>
      <p><strong>Serif vs Sans Serif</strong><br>
      Personally, I feel that this is less of an issue since most yearbooks do not have extensive amounts of text matter. They are more like periodicals, and more like <em>People</em> magazine than <em>The New England Journal of Medicine</em>. Text within individual sections of a yearbook tend to run only a few spreads with lots of graphics or photos. In that light, sections can be treated with some uniqueness, like some magazines, and use of sans or serifs becomes less ominous a decision… just so long as students understand type guidelines are not universal, but apply more to specific usage and context. Magazines, novels, yearbooks, advertising, etc. are all very different applications.</p>
      <p>There are some interesting examples of yearbook spreads in the <a href="//www.jostens.com/yearbook/adobe_contest_winners.asp”" target="”new”" rel="nofollow">Jostens Contest winners</a>.</p>
      <p><strong>Text vs Display and Specialty/Novelty Typefaces</strong><br>
      Remembering that your students may not be graphic design majors (if so… then they shouldn’t graduate if the don’t know what to do), but including some of the suggestions offered by Forum members would be very useful. To simplify understanding for non-visually oriented students, it might be sufficient to explain key differences between reading multiple lines of text, captions and running copy than reading a few words contained in headlines and titles. Specialty and novelty typefaces are not to be completely avoided, but they are very much like hot chili sauce, sugar or vinegar. Used very sparingly they can spice up, sweeten or add a little tang to layouts, and a little too much use can be very unappetizing.</p>
      <p><strong>My Personal Reflections on Yearbooks</strong><br>
      I went to a “brainy” all boys high school, where we tried to be professional and very “grown up”. I just browsed through my own high school’s yearbook and I must say it looks very dull, overly academic, too symmetrical, non-dynamic, uninviting to read and the team sports sections were treated identically as the faculty and academic studies sections. Sad, but maybe that was actually a reflection of the student body… dull and too academic.</p>
      <p>I compared it to my wife’s high school yearbook (she went to a co-ed Catholic school). The layouts are terrible, use of type inconsistent and visually painful to typophiles, but somehow their energy, fun and idealism shows through. Still an ugly publication, but enjoyable to flip through.</p>
      <p>I’m not advocating visual pollution, but a yearbook should be a reflection of who the students are and not who they want to be. Because years (and decades) later, when you sit down to reminisce the second half of your teenage years, the yearbook will be your touchstone. It will be the only high school yearbook a graduating class will ever have. Encourage them to make it an intimate and personal document of their collective experiences. In the end, that will be far more significant than what typeface they used for heads.</p>
