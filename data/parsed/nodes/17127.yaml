    <p>Hi, I am writing a guide for high-school students on how to select fonts for writing yearbook publications.</p>
    <p>While I'm pretty sure I have the basics downpat, I'd like to make sure it is as 'correct' as possible.</p>
    <p>Suggestions for improvements are appreciated. Thanks for your time.</p>
    <p>=====<br>
    There are no absolutely right or wrong ways to choose which fonts to use for your yearbook. Font selection is a very subjective matter, but there are however a few accepted guidelines which can help you make the right choices.</p>
    <p><strong>Body Text</strong><br>
    Serif fonts are ideal for body text as the serifs aid readability by helping the eye move from one letter to the next, connecting individual shapes to form whole words. Certain sans-serif fonts are also suited to body text as they are also ‘word’ friendly.</p>
    <p>A good body text font is not difficult or tiring to read for long sentences and paragraphs. It should blend with the yearbook theme, not distract the reader, and convey an appropriate tone.</p>
    <p><strong>Headings</strong><br>
    Sans-serif fonts are often used for headings as they often convey more personality than old-style serif fonts. Script and novelty based fonts are also ideal for short headings where ornamental features can be appreciated sparingly. Over-using a novelty font can backfire and it tends to look quite tacky.</p>
    <p><strong>Point size</strong><br>
    Body text should be set between 9 to 12 points. This is the optimum size to aid readability. Bigger text sizes tend to make it harder to read as the eye gets tired from travelling further distances to read the same amount of text. Heading text sizes should be proportionate to the accompanying body text.</p>
    <p><strong>Capitalisation Patterns</strong><br>
    ALL CAPS can look very serious and dramatically reduces readability. The major headings in this boook are in all-caps, but have been italicised the speed and modernise the flow.</p>
    <p><strong>Common fonts</strong><br>
    If you are looking to make your yearbook stand out, it is recommended you avoid using the common fonts found on most computers such as Times New Roman and Arial. These fonts are familiar to many people and can introduce the ‘same old’ syndrome. It is worth the time to search and download new fonts from the Internet.</p>
    <p>=====<br>
    (The text in the above guide is written in Expressway 10pt)<br>
    (<a href="http://www.myfonts.com/fonts/typodermic/expressway/" title="http://www.myfonts.com/fonts/typodermic/expressway/">http://www.myfonts.com/fonts/typodermic/expressway/</a>)</p>
