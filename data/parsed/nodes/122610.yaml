  html: |-
    <p>Some of the Congressional offices use Cloister Black or some approximation, but several of the committees (and maybe the Senate) use this typeface. I assume it might be hand-cut, but I thought I'd ask if anyone recognized it, or knew the history of the usages.</p>
    <p>Thanks!</p>
