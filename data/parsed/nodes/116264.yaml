    html: <p>As far as I've been able to google, the street signage in Edinbrugh uses a custom lettering alphabet (or possibly typeface, these days) designed by David Kindersley. Kindersley's other, similar designs include <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/octavian/" rel="nofollow">Octavian</a> and the lettering on Cambridge's Grand Arcade, now digitzed (and free) as <a class="freelinking external" href="http://www.kindersleyworkshop.co.uk/type-design/" rel="nofollow">Kindersley Street</a>. The latter only has minor differences in style.</p>
