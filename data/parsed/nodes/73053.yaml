    <p>I'm having issues with the kearning between the 'K' and 'O' in this logo project and I'm hoping a fresh set of eyes can help me out. Does it need to be tightened up a hair more?  Also, any other feedback regarding the kearning would be great. </p>
    <p>The logo is just about final after a LONG process, so I only need help with the letterspacing.</p>
    <p>'KOURY' is set in DIN Black. </p>
    <p>Thanks!</p>
