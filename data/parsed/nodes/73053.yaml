    html: |-
      <p>I am not a professional, but I would say that the »O« looks smaller than the other characters; the upper and lower arcs should shoot over the upper and base line – same problem with the »U«, the lower arc should end below the base line. Else it looks like those two characters are floating …<br>
      Those are the things that irritate me, but the kerning should be just fine.</p>
      <p>Hope you understand what I wrote, I am from Germany hence not a native English speaker.</p>
