    <p>I tried to get an ID on this one a couple of years ago, but Typophile uncharacteristically drew a blank. I found it again looking through some old picture folder on my hard drive, and wonder if I may be luckier in the new system?</p>
    <p>It's from a paperback book cover I saw at my parents' house, published sometime in the 70s as far as I recall. I'm looking for the authors' names' typeface, not the big one in the middle.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/maja1_6260.jpg"></div><p></p>
