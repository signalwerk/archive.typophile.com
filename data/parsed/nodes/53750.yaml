      <p>I love the Narrow! Think it's nicer than the original. </p>
      <p>I haven't worked out how much all 66 cost.</p>
      <p>... I have now! I'll have to start saving.</p>
      <p><cite> The prospect of a "Gotham for embroidery" collection and a "Gotham for box scores" was daunting, and ran counter to one of H&amp;FJ's core philosophies: that type families should be as small as possible, but as large as necessary.</cite></p>
      <p>Is 66 really as small as possible?</p>
