      <p>Wow. Tough brief.</p>
      <p>I think you did wonders considering what you were given. My only comment is that the detail on Earth is very different from that on the dolphin. I'd 'roughen' the land mass a little bit. Make it more abstract. In my opinion, all elements of a logo need to look like they were drawn with the same pen.</p>
      <p>Is the red proposal mandatory? I'd keep it blue.</p>
