      <p>That looks cool I think, quite fresh and original!</p>
      <p>A few quick things:<br>
      1) Given that that dolphin has no eye, if the earth is also red he looks quite dead to me. :-\<br>
      2) Have you tried h-flipping the dolphin so that he moves/jumps left-to-right? (Possible stronger forward movement)<br>
      3) Regarding the brief: To my reading this dolphin is not necessarily «jumping over» the globe, he's sort of lying/swimming on top of it. Dunno if that's a problem though.<br>
      I also agree with what was said about the detail level in the globe.</p>
