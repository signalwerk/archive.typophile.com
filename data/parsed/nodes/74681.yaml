    <p>Hello all, </p>
    <p>So I was asked to make a logo for a local dive and surf shop. He wanted a dolphin jumping over the Earth. </p>
    <p>So I came up with something I thought looked clean and refreshed from their old logo, which literally was 3 pieces of clip art put together. </p>
    <p>You all have great insight and good comments, and this isn't something I would normally show here, but I just would like a critique or some insight as to make this the best with what I was given. </p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DolphinEarth_4877.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DiveDolphin_4358.jpg"></div><p></p>
