    html: <p>Very cheerful and nifty. <br> <br>I'd like to see that upward slant in the middle of the k. <br> <br>Maybe you should be concerned about the letterspacing difference between the forms with "tails" and the ones without. To make the spacing consistent, you would have to overlap to make them actually connect like a script, and I don't think that's your intention.</p>
