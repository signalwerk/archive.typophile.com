    <p>Every time I try to build kerning classes, I get the following error with each class:</p>
    <p>&lt;&lt;[WARNING]  Start of new pair positioning subtable; some pairs may never be accessed: [A.smcp Aacute.smcp Abreve.smcp Acircumflex.smcp Adieresis.smcp Agrave.smcp Amacron.smcp Aogonek.smcp Aring.smcp Atilde.smcp] [Y.smcp Yacute Ycircumflex Ydieresis] [/Users/chrisL/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 1226]&gt;&gt;</p>
    <p>What do I do now?</p>
    <p>ChrisL</p>
