    html: "<p>Can't definitely match such /R and /S at the same time so here are some alternatives (some close for /R, some for /S): <a class=\"freelinking external\" href=\"http://www.derekweathersbee.com/franchise\" rel=\"nofollow\">Franchise SmallCaps</a> (the one that would need the less adjustments, mainly on /S finials), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/flat-it/dharma-gothic\" rel=\"nofollow\">Dharma Gothic Expanded</a> (overall the closest but /R totally off), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/comicraft/elephantmen-greater-and-taller\" rel=\"nofollow\">Elephantmen Taller Bold</a> (/S off, /R counter to be adjusted), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/virusfonts/bourgeois\" rel=\"nofollow\">Bourgeois Ultra Condensed</a> (/S off), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/letterbox/berber\" rel=\"nofollow\">Berber</a> (/S off), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/storm/header\" rel=\"nofollow\">Header</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/redrooster/block-gothic-rr\" rel=\"nofollow\">Block Gothic</a>, a mix of <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/dizajndesign/komu\" rel=\"nofollow\">Komu A (/R)</a> and <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/dizajndesign/komu\" rel=\"nofollow\">Komu B (/S)</a>, <a class=\"freelinking external\" href=\"http://www.typography.com/fonts/font_overview.php?productLineID=100035\" rel=\"nofollow\">Tungsten</a> (/R off), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typetrust/heroic-condensed\" rel=\"nofollow\">Heroic Condensed</a></p>"
