    <p>Would anyone be interested in a little present exchange with other Typophile peeps?</p>
    <p>I could collect address, randomly match people up (or within the same country when possible for shipping price reasons) and then we could all get something awesome for under $10.</p>
    <p>Okay sign ups will finish on Saturday Nov 29th and then I'll PM you your person and their address.</p>
    <p>Gifts should be mailed before Dec 10th.</p>
    <p>In:<br>
    James Arboghast<br>
    Chris Keegan<br>
    Ricardo Cordoba<br>
    Ngoc Ngo<br>
    Simon Robertson<br>
    russellm<br>
    beejay<br>
    AGL</p>
