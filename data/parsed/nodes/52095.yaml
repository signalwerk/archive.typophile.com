      <p>Ricky I couldn't find any handwriting fonts either. I looked everywhere, I looked under the cat, I looked in the glove compartment of the car, I looked under the mat, and I looked under the sofa too but there were'nt any there either.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cube_4281.png"></div><p></p>
      <p>I couldn't find any handwriting fonts but I am just now (even as we speak) pushing a new font of mine called Jabberwub out the door. One thing I did find under the sofa was ten minutes. I must have left them there on Friday when my friend Amanda stopped by.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jimi_quad_6353.jpg"></div><p></p>
      <p>I couldn't think of any really great ideas so I played around with the Jabberwub font and clicked on buttons and things and generally just—you know—used my imagination. I suppose there is a vague kind of a theme going there, if 2009 can be called a theme. All I can really tell you is that I would have been stuck for something interesting to post if it wasn't for layers and gradients and hard lite.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jimi_08_5401.gif"></div><p></p>
      <p>So I am thinking of giving away release copies of Jabberwub to typophilers as free xmas gifts.</p>
      <p>Think that's a good idea?</p>
      <p>Do you?</p>
      <p>j a m e s</p>
