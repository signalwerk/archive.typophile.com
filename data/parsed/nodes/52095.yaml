      <p>My present arrived last Thursday.<br>
      Three Doctor Seuss books:<br>
      <em>Horton Hears a Who<br>
      Yertle the Turtle and Other Stories<br>
      Oh the Places You'll Go</em></p>
      <p>My guess is it was Milli who sended it. Came complete with a noyce card with sweet informal script type spelling out "Merry Christmas". Inside in neat handwriting it says, "Dear James" (printed inscription "May all the days of the Christmas season and the coming year be happy for you.") "All the best for christmas and the new year! -- Typo Santa".</p>
      <p>Well thanks whoever sended this package to me. I sended my gift on December 11th.</p>
      <p>A small serve of sour grapes: that so few typophilers participated in this joyous open gift giving scheme says more about the typophilers who didn't. Ya know't ah mean? Reet? Reet?</p>
