    html: |-
      <p>@LiliCharlie: That's a very interesting idea, using <code>:lang</code>. I'll have to dig into browser support for this. Am I correct to think it works like this: <code>&lt; element lang="fr"&gt;abc&lt; / element&gt;</code> will ask the render engine to get the glyphs for a, b and c, and the rasterizer/OTF will request these from the font, passing along the information that these should be the French version of these characters? If so: pretty cool.</p>
      <p>@Theunis de Jong: Very recent browsers are starting to support things like ligatures, alternates and swashes, but for now these are too experimental to rely on. But that would be a perfect solution for me. So this means you could technically put a normal and a bold version in one OTF file, and use bold by saying those are the historical forms, for instance?</p>
