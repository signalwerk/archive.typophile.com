      <p>I think the cleanest solution would be to merge the fonts into a TrueType Collection file. The format is described here: <a href="http://www.microsoft.com/typography/otspec/otff.htm" title="http://www.microsoft.com/typography/otspec/otff.htm">http://www.microsoft.com/typography/otspec/otff.htm</a> (scroll halfway down)</p>
      <p>If I remember correctly there's a tool to build TTC files available in Apple's font tools: <a href="https://developer.apple.com/fonts/" title="https://developer.apple.com/fonts/">https://developer.apple.com/fonts/</a></p>
      <p>And FontForge can apparently generated TTCs but I haven't tried it.</p>
