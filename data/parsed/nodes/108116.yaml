    html: |-
      <p>(Ab)using the Historical Forms for Bold is certainly an option, and there must be a few other "common" features that you might use this way. Most OTF features should allow combining with each other -- say, Oldstyle Numerals combined with Swash would use a total different glyph set than each on their own.</p>
      <p>But the Stylistic Sets I was alluding to are a feature all on their own; twenty of them, in fact. They are unimaginatively named <code>ss01</code> to <code>ss20</code> (a fairly new option is a designer can give useful names to each) and they are specially defined for all  "whatever you can think of" glyphs and glyph combinations.</p>
      <p>Suppose you made 20 weights of your font, then you could assign one to each set.</p>
