      <p>As for a CSS-based solution, embedding data in the @font-face is a valid option. As I recall, Typekit distributes their webfonts that way. I think the syntax is</p>
      <p>url(data:font/truetype;base64,AAEAAAAKAIAAAwAgT1MvMgM2BUoAABCsAAAAYGNtYXCf+IBSAAAArAAABNxnbHlm9HMFtwAAESwA... and so on, until the end==);</p>
      <p>or owt like that.</p>
