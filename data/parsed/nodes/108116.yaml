    html: |-
      <p>That'd be even cleaner. I found this <a class="freelinking external" href="http://lists.w3.org/Archives/Public/public-webfonts-wg/2013Oct/0041.html" rel="nofollow">recent discussion on the W3C mailing list</a> and it looks like it's not supported yet. Also, it looks like there's a little support for fragmented identifiers for SVG — images at least. That could allow us to merge font files into one SVG-file and pick the appropriate one in our <code>font-face</code> declaration by adding <code>#1</code> for the first font, <code>#2</code> for the second, etc.</p>
      <p>Unfortunately, the conclusion seems to be that there's no reliable cross-browser way of doing this, so BASE64'ing into one CSS file still seems to be the best option.</p>
