    html: |-
      <p>I view the primary type community as people who use fonts, and people who read. We are all grateful to the font designers who provide us with tools, just like we are grateful to the layout programmers who provide us with other tools.</p>
      <p>My rants on the subject are probably too common on typophile, but I'll just repeat that not a month goes by that I do not have to modify a font. Usually something trivial, as a character needed that is not included in the foundry version. Say, a diacritical needed. Or, a raised comma, which is not the same character as an apostrophe -- just check the Unicode charts. Often kerning, which is an individual preference. Designers are "always right?" Not when punctuation is so tight as to rival a diacritical. Esp. when the editor marks it "P.E."</p>
      <p>It is an exaggeration, but designers think about letterforms and graphic shapes. Much of the type community thinks about texts. Rarely do we hang letterforms in museums; most common is to use them to present texts.</p>
