      <p>One of the bad things about internet forums is people get nasty and use rough language. I won't do that, but it doesn't mean I haven't uttered those words under my breath.</p>
      <p>You want to protect your fonts from piracy. I applaud. So you hire $300-an-hour lawyers to write a restrictive EULA. You propose a software "fix" to enforce it. You are apparently unaware that EULA makes the product unuseable, at least to one segment of what I condsider the type community. A lack of knowledge of the workflows needed to turn letterforms into text is not a laudable trait for one in the "type community." </p>
      <p>Or perhaps you don't consider the people who set type, who read books, who search files, as a part of the type community?</p>
