    html: |-
      <p>Besides the other objections, this proposed scheme assumes that a given vendor will have all of their fonts either "public" or "protected" and not have some in each camp.</p>
      <p>Also, if a vendor wants to allow a given specific user to modify a "protected" font, what do they do? Seems like they either have to tell the user the key code, or generate a custom version of the font to allow modifications.</p>
      <p>Of course, the first thing that will happen is somebody will write a utility that simply takes a font and removes the vendor ID so fonts can be modified. But that's not really the point, this is another "garden fence" class protection, isn't it? But I think the EULA and the fact that one has to actually have and use a font editor already constitute a sufficient "garden fence"....</p>
      <p>Regards,</p>
      <p>T</p>
