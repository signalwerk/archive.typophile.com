    html: |-
      <p>James: <em>This solution will never work.</em></p>
      <p>This depends on how and what you measure. Whatever the ‘physical’ system for font protection is, It will never be waterproof because there probably will be ways explored and found to circumvent it, or because of legacy limitations. But at least this solution doesn’t cost font producers any extra work, except for controlling the vendor key (assuming that vendor ID’s are always included in the TTF/OTF fonts) and it would be backwards compatible too.</p>
      <p>So, I would actually expect owners of font data to embrace <strong>any</strong> ‘physical’ system that helps (a bit) to protect their intellectual property, especially because there is none at the moment whatsoever –as far as I know. And when it comes to vulnerability, in general most defense systems are built step by step anyway, I reckon.</p>
      <p>Charles: <em>[…] not a month goes by that I do not have to modify a font.</em></p>
      <p>That is fine as long as the EULA that came with the font allows the end user to do this. And with a vendor ID/key controlled system this will be possible still in case the owner of the font permits this kind of actions.</p>
      <p>FEB</p>
