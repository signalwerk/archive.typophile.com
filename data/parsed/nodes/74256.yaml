      <p>Charles: <em>Assumes “type community” = “font designers”</em></p>
      <p>Basically, with ‘type community’ I was thinking of everyone who designs, produces or works with fonts, and I reckon that everybody in this community wants to protect their and their colleague’s rights as much as possible.</p>
      <p>Charles: <em>Perhaps this is an unproductive way to think of the type community?</em></p>
      <p>I am afraid that I completely miss your point here. The only reason that I came up with the vendor ID based plan, is to protect the rights of the type designers and font foundries. It would only affect font production tools or font editors and not for instance desktop publishing applications. So, one can simply not edit, convert, or wrap fonts without the permission of the owner of the font. Such protection would especially cost the programmers of font tools, like ours, extra work and that could be considered unproductive. But I am not sure if you meant that.</p>
      <p>FEB</p>
