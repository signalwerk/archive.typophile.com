    html: |-
      <p>James,<br>
      my english is very poor, so i talk<br>
      about these new shapes shortly:<br>
      -в- is better, but top loop is too small and connection of loops too dark. don’t be afraid to break bottom oval a little, and give your thin connection line to right. this letter may respond to -o- so very thin line to right is ok.<br>
      something similar is with ovals in -ь-ъ-ы-. generally speaking, -ы- is historic ligature, that stay in russian, so you can use oval in it like a prototype for -ь-ъ- (but please make horizontal connection more thiner).</p>
      <p>-я- now is too narrow and rotated for me. try to move right leg to the right to wide and fix it to the line?</p>
      <p>i like better previous version of -б-, it need only move ascender’s tail up, but round form for ascender is ok</p>
      <p>-г- don’t need to start so straight up like your, make this letter more wavelike</p>
      <p>upper arc in -ч- can be very plain in scripts, and can correspond to -ъ-</p>
      <p>i’d like to see more brave descenders in -ц-щ-, it can look similar to descender of -g- or -y-</p>
      <p>i hope this can help</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile01_4727.png"></div><p></p>
