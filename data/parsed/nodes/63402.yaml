      <p>hi James</p>
      <p>i like your font very much.<br>
      as not russian, but native cyrillic reader i think you need more experience with cyrillic handwriting. please give more looks on cyrillic scripts from ukrainian, serbian, belarusian and russian calligraphers, so you will know more about natural forms.</p>
      <p>about this scetch i want you to use more of your delightful thinnest endings, it would work best in descenders of -ц-щ- or connector in -ы-. break this unusual loop in -н-, make more flamable ascender in -б- (it may rather not be similar to -delta-), look for natural shapes for -л-ф-г-ч-. ovals in -в- and -ь- may get endings not to down, but to right, and right stem in -я- need some too. won't try to use your pretty -theta- as cyrillic -т-?</p>
      <p>i wish you make a beauty cyrillic,<br>
      sorry for my english</p>
      <p>Andrij</p>
    html_clean: |-
