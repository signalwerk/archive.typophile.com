  html: "<p>I'm in the process of setting up my design office, and I need to acquire a monochrome Postscript laser printer capable of printing tabloid-size sheets. I'm evaluating five machines, but the vast majority of information available online is just repetition of the standard marketing/technical information on the manufacturer's sites. I would love to have feedback from those among you who've had direct experience with any of them: <br> <br>Xerox 5400 <br>HP 5100 <br>GCC XL40 <br>Xante AW1200 <br>Minolta-QMS 9100 <br> <br>Thanks much</p>"
