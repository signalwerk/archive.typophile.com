    votes: null
    html: <p>The design office I just left has an HP 5000, and while it was generally a pretty good machine it would periodically choke on some medium-sized files while printing other larger files with no problem. I've always wondered if it was due to the emulated Postscript. <br> <br>The Xante printer is by far the least expensive of the five, and what little info I've been able to glean from online user comments is mostly positive, but it is not the established brand that HP or Xerox is.  <br> <br>I also worked at another design office three years ago that had a tabloid-capable Phaser color laser. It was damn fast, and I thought the color/image quality was fine for comps and presentations. If money were no object I would have sprung for a new Phaser like you did, instead of the Epson inkjet I'm now using. <br> <br>dh</p>
    html_clean: <p>The design office I just left has an HP 5000, and while it was generally a pretty good machine it would periodically choke on some medium-sized files while printing other larger files with no problem. I've always wondered if it was due to the emulated Postscript. <br> <br>The Xante printer is by far the least expensive of the five, and what little info I've been able to glean from online user comments is mostly positive, but it is not the established brand that HP or Xerox is.  <br> <br>I also worked at another design office three years ago that had a tabloid-capable Phaser color laser. It was damn fast, and I thought the color/image quality was fine for comps and presentations. If money were no object I would have sprung for a new Phaser like you did, instead of the Epson inkjet I'm now using. <br> <br>dh</p>
  - id: 53885
