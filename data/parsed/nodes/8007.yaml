    html: <p>I might be in the market for a printer again in the next few months. I gave up on having a printer a few years ago, because I found I only wanted to look at 2400 dpi imagesetter proofs anyway, so figured I would save my money for the service bureau. That's worked well until now, but it turns out that the demand for paper output is now so low that my bureau isn't going to be offering this service any more. Worse, there is only one roll of paper left in the local distributor's stock, and they are not planning on ordering any more. So if I want imagesetter proofs, I have to order a whole roll of paper and then beg the service bureau to do the output. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>
