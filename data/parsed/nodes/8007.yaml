    html: <p>Stout fellow! Well I don't have a lino handy. What I do have is PagePro 9100 vs Offset. What follows is a scan from a business card done on supersmooth uncoated stock with the same text out of my laser right below. You can see there is gain and loss of crisp corners. That said, we are looking at 7 point Myriad. For what I do, and what I can afford, this has been acceptable (thus far). If designing text faces was a full time job, this wouldn't be my choice. I should add, I'm due for a new toner cartridge, so the quality represented is perhaps a little off. <br> <br><img src="http://www.typophile.com/forums/messages/30/55265.jpg" alt="PP9100 vs. Offset"> <br> <br>Cheers, Randy</p>
