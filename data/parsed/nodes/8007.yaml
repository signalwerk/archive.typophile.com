    html: <p>I've had the Minolta QMS PagePro 9100 from your list for about a year and have no complaints about it. You mention that you are running a design office. Note that type designers will push the output resolution/quality of a machine, but graphic designers may be more interested in the speed of printing complex layouts.  <br> <br>That said, I've mostly used mine for looking at type, which it has done an adequate job at thus far. Of course, I haven't seen 2400dpi side by side. It had better be step down from James' machine for the price. I didn't do any memory upgrades or anything so photoshop outputs at high-res are pretty slow (surprise, surprise) but pdfs of design layouts spit out nicely. Support has been good (shipped with tweeked toner cartridge, got the new one fed-ex next morning). No trouble since. <br> <br>Randy</p>
