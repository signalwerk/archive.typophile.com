    votes: null
    html: "<p>Don: <br> <br>Quite possibly the emulated PS. I've seen quite a few bug reports that turn out to be flaws in emulated PostScript of one flavor or another, including several in HP's emulation. Many of them get fixed eventually, and we do report them to the printer developers when we get them as app bug reports. When possible, we even try to put in workarounds in our printing (though at some level it is irritating to essentially fix other people's bugs in their clones of our page language!). <br> <br>Xante was making printers back in the mid-80s, by my memory. But they've always been kind of a niche vendor. We bought a Xante 2400-dpi b&amp;w laser for the Adobe type group a few years back. It's nice and all, but on text the quality doesn't seem noticeably better than 1200 dpi. I seem to recall (I think) that at 2400 you don't get the edge enhancement; certainly having 2400 addressable dots isn't the same as having toner fine enough to really exploit that resolution. <br> <br>My 9-year-old LaserJet 5MP is still going strong. I have only now replaced it with the Xerox. <br> <br>With regards to the Xerox (formerly Tektronix) Phasers, originally the Tektronix devices all used solid wax sticks and melted them on the page. The brand has since been broadened, and now it seems it just applies to all Xerox's serious color printers. Some solid-wax ink, some LED, some laser. There was a laser device similar to the 7300, namely the 7700, which would have offered sharper line edges for text, but it was quite a bit more, and I was already pushing my budget with the 7300. <br> <br>Cheers, <br> <br>T <br> <br>T</p>"
