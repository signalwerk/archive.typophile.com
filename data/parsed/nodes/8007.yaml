    html: <p>There is a rather surprising variation in quality from device to device. I don't have any experience with recent tabloid-size devices, but was surprised to see how much toner splat there was on my HP LaserJet 1200 compared with a Brother device (model number not handy). <br> <br>Perhaps you should see if you can get print samples from the devices that remain on your short list. I'd also be interested. <br> <br>[BTW, we're trying to decide between an HP CLJ 3550 and a Konica Minolta 5430 DL, both 20 ppm color letter-size models, as the basis for doing some halftoning and color profiling work. If anybody has experience with either of those, I'd like to hear it as well, and apologies for veering slightly OT]</p>
