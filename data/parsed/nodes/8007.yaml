    html: <p>If you want Adobe PostScript instead of a clone, the Xante and Xerox use it, while the Minolta-QMS and HP do not. <br> <br>On the other hand, the mid to high end HPs are remarkably engineered workhorses mechanically. They last darn well forever. The mid to high end Xeroxes are also pretty good in this regard. <br> <br>A few months ago I splurged on a Xerox Phaser 7300 for a mix of uses at home. It's the most expensive thing I've ever bought that wasn't a car. Adobe PostScript 3, full color, up to 12x18 (tabloid extra) and duplexes with that size as well. The LED engine melts toner on the page just like a laser, but with a different imaging tech. Max res is 600x2400, but the LED also lacks the edge enhancement tech that is pretty much standard with laser engines, so overall it's no better than a 600x600 laser for plain black text. <br> <br>T</p>
