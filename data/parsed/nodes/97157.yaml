    html: |-
      <p>I found one of the URW fonts I remembered, called Antique Olive DC D. It is not C/lc as I thought, but is a C/sc font with the large caps centered vertically on the small caps which are base-aligned.</p>
      <p>I recall someone telling me when I first saw it in the late nineties that it was a style of alignment popular in Europe but I kind of think that is not true. I had never seen anything like it, and still don't have any idea why it would be useful.</p>
