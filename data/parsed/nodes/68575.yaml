    html: |-
      <p>It looks like a very heavy weight Bodoni italic. A number of Bodonis have flat-topped t's like this, but I didn't find any quite this heavy. Perhaps some stroke was added to fatten it up?</p>
      <p>- Mike Yanega</p>
