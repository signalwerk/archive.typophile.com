      <p>Chris, you were right. <a href="http://www.smom-za.org/images/thomas_aquinas.jpg" rel="nofollow">This</a> was the image I was redrawing from, that's right, and he doesn't look even a bit pissed off to me. I mean, this is not just me or the client, but my colleague as well (who has nothing to do with graphics) who doesn't see the pissed side... I don't see dissappointment or grieveness or fraud in his face. I try, and I can't!</p>
      <p>Being *no* illustrator and having no graphic or art education whatsoever it's hard for me to do a strong, rightly proportioned face from scratch. Not all russians drink vodka literwise and can draw wicked propaganda posters. :) Herr Hohlwein makes use of shades and colors (though with a great skill), but the same technique is not transfarable for a logo 100% (as far as I understand). I try to use just one color for the shades, which is, I guess, where I fail.</p>
      <p>Anyway, before you think, I don't want to hear that this is bad-bad-bad, I stop. No, really, I do need input, but I want to explain where I am standing and why.</p>
