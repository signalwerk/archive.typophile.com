      <p>Now that you have the balance corrected it is an improvement, I wonder if the wordmark is too small in relation to the face and the text. I think, however, that the fonts that you have used are work well. Areas to work on the face are; an indent where the cheek meets the temple near the left eye, extend the top of the head (imagine that the halo in your source is worn like a cap on the back of the head), tighten up the jaw so he looks less jowly, include part of the neck at the back and possibly the ear as highlights. If you take your source file and convert it to cmyk, cut the magenta channel and paste it into a greyscale file, then increase brightness and contrast it will give you a better base to work from, try printing it out as large as you can while still clearly seeing the details and then tracing over the face then scan your trace and draw from that it might make life easier for you.<br>
      Tim</p>
