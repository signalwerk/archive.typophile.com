      <p>What is it, Dan, that you think I am asking from the audience, which it is not supposed to get anyway?..</p>
      <p>-----------------<br>
      It's either I don't communicate it right or you are trying to tell me something I don't get or the whole thing is being looked at somehow queer. I want to repeat again that I am not trying to replicate Aquinas face, I am not trying to hint directly on his persona, I am not trying to follow the traces of his face with an utmost accuracy either (<a href="http://wwwhome.cs.utwente.nl/~jagersaa/Stamps/Aquinas.jpg" rel="nofollow">this</a>, being a good illustration, would be a catastrophy in my case). I just took a base face and was working from it further. I cannot stress this enough, but my goal is not to achieve any resemblance with Thomas Aquinas whatsoever...</p>
      <p>I am not sure if I should translate the whole initial presentation I did into English to show you how far from "dropping the face" we are, but I may asure you, this wasn't the only proposal the client has seen. There were three absolutely different kinds of the mark: two different types of a sign (including this face) and a wordmark. <a href="http://www.xtati.com/_misc/temp/aq_init.gif" rel="nofollow">Here</a> is what it looked like in the initial presentation. And even in this poor execution it was instantly the winner. As you probably see now, it is not the execution or the quality of work by now, that has sold itself, it's the idea. Why? Because in this B2B branch the generic company is nothing new and nothing old — there are thousands of small firms, doing this and that having three dots, swoosh, pc screen or whatever as there mark and thousands are coming next year. This is a face-to-face <em>geschäft</em>, the marketing will not be based on an extensive ad campaigns or guerilla promotions, but people faces, word of mouth, private talks. This is why "a face" and not something else.</p>
      <p>Finally, knowing the guys way too long and way too well, I am sure that they know what they are doing (how about naming themselves Blahblah <em>Lounge</em> GmbH and being as far from club and restaurant business as from the furniture production?) — they know their clientele better than we do altogether.<br>
      -----------------</p>
      <p>That said, I would like to encourage more comments on the execution of the mark (rather than the concept of the mark) and the stationary items, posted so far.</p>
      <p>Cheers,<br>
      A</p>
