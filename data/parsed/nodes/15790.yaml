      <p>update:</p>
      <p>here is the progress for today - <a href="http://xtati.com/_misc/temp/Untitled-74.gif" rel="nofollow">the faces</a> from the illustrator and me. okay, I haven't learnt to draw the face properly, but I was using all my skills to copy it from the <em>most probably</em> anatomically correct face of the artist. Which one seems more appropriate?</p>
      <p>I've answered that question for myself and have used mine (I'm really stubborn sometimes and may even appear rude for that matter, but normally I am nice, really :) ). Here are the two variants of the letterhead: <a href="http://xtati.com/_misc/temp/L_acl_scala_absara_1.pdf" rel="nofollow">traditional</a> and <a href="http://xtati.com/_misc/temp/L_acl_scala_absara_2.pdf" rel="nofollow">overdone</a>. The non-traditional variant has its drawbacks (like visual disbalance and total domination of the face), but I think I could find a solution to that (tinting it upto 50% or less could do the job). I just wanted to try out two radically different appearances.</p>
