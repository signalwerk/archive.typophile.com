      <p>I agree with the others. The guy looks pissed. And not in a good way. Your client may like it, but I'm not sure they're seeing the potential downside here: sending out letters to their clients with a pissed-off guy on the top.</p>
      <p>Since you're referencing Thomas Aquinas, I'd guess you're drawing from <a href="http://www.smom-za.org/images/thomas_aquinas.jpg" rel="nofollow">this image</a>. Well, he still looks pissed off to me. How about <a href="http://www.pacifier.com/~belisle/images/aquinas.jpg" rel="nofollow">this one</a> instead? The deeper, larger shadows would make a stronger mark that doesn't look quite so angry. Also, do a <a href="http://images.google.com" rel="nofollow">Google Image Search</a> for 'WPA'. You'll see some really strong examples of burly, determined workers drawn by skilled illustrators in a strong, meaningful style. Russian posters are another good source for excellent stylized drawings of determined faces. Also, try searching Ludwig Hohlwein. Be careful, he did some work for the Nazis, but his paintings of the human face are stunning in their simplicity, contrast, and impact. Check out <a href="http://www.idesirevintageposters.com/graphicdesignimage29.html" rel="nofollow">this poster for a German brewer</a>.</p>
      <p>My specific issue with your illustration is that it doesn't feel solid enough. The lines are curvy but don't describe strong forms in the face. Half of the head is a huge black shadow, then the features are thin, small details. The face needs more visual unity and clarity. Notice the thickness of the strokes and the strong straight lines in Hohlwein's work. Your face mark needs this kind of refinement, and I think your client will like the strength of the illustration style. You can get that aggressive feeling without an aggressive expression.</p>
