    html: "<p>Sorry, Daniel, those references *are* pretty obscure. Let me try to explain. Leroy Neiman is an artist who came to prominence in the '70s, and who, in my opinion, uses color in a garish way. Here's a link to some of his work: <br> <br><a href=\"http://www.leroyneiman.com/merchant.ihtml?pid=347&amp;lastcatid=20&amp;step=4\" target=\"_blank\">http://www.leroyneiman.com/merchant.ihtml?pid=347&amp;lastcatid=20&amp;step=4</a> <br> <br>Your mark reminds me of what would happen if his style of painting was combined with the hard-edged style I associate with the '80s, when digital illustration via Illustrator/Freehand became popular. <br> <br>So when I look at your logo, I see visual nods to two decades, sitting next to type that's got a '90s deconstructionist feel. It just doesn't hang together for me. <br> <br>Chromatica is a really cool name. I guess that's why I think you should explore more options.</p>"
