  html: <p>Typophiles, I need your assistance.  I've decided to get a bit more serious about my freelance web design work, so I've decided dump the name and logo I was playing around with before.  I'm looking for a distictive typeface to help develop an identity. <br> <br>I'm not planning on everything being married to the mark; I don't need a logo so much as a good typeface and consistent colors.  Nevertheless, any critiques on positioning, size, etc. would be helpful. <br> <br>So far, I've tried (in order) Morphica from Shinn Type, Luna Modern from PsyOps, and Reykjavik 2, D Weight from PsyOps.  Tell me if they work, and feel free to recommend <i>any</i> other typefaces. <br> <br><img src="http://www.typophile.com/forums/messages/29/25730.gif" alt=""><img src="http://www.typophile.com/forums/messages/29/25731.gif" alt=""><img src="http://www.typophile.com/forums/messages/29/25732.gif" alt=""></p>
