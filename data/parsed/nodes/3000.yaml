    html: <p>I like it even better with the descriptive byline. At small scale the descriptor is likely to disappear in places, but for once I think that works really well. Morphica goes even better with the graphic element at this smaller scale because of its detail increases in complexity. The descriptor, combined with the bolder and simpler (at large scale) title, "chromatic" looks more like the graphic. The interior shapes of the graphic look a little more simple than the vibrant shapes that seem to be flaring out. In fact, I wonder what it would look like if the interior shapes and chromatic were the same color, while the outer, flaring shapes and the descriptor were similar varying colors</p>
