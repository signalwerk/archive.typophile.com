    <p>Type 3.2 font editor has just been released:<br>
    <a class="freelinking external" href="http://www.cr8software.net/type.html" rel="nofollow">http://www.cr8software.net/type.html</a></p>
    <p>The latest version of this (Windows) font editor includes an integrated auto-trace function. There is a video demonstration here:<br>
    <a class="freelinking external" href="http://www.youtube.com/watch?v=iMqHCWKFz68" rel="nofollow">http://www.youtube.com/watch?v=iMqHCWKFz68</a><br>
    (so if you are a Mac user you can see what you are missing)</p>
    <p>Allan Murray</p>
