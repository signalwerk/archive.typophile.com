    date: 2013-01-24T02:13:00
    date_raw: 24 Jan 2013 — 2:13am
    votes: null
    html: "<p>There is no batch processing (and no plan to add it at this stage) - so you do have to at least 'draw a frame' around each individual letter. The interface though, offers more options (if required) for each individual letter, or just for each image: scaling, black-white threshold, invert, upsample resolution, despeckle, input resolution to the tracer (controls number of output nodes) and a tracing parameter that controls sharpness/curvature of corners.</p>"
