      <p>Hi Regina!<br>
      [Ignore Claus, he’s just making fun of a certain misspelled word ;-)]</p>
      <p>For <a href="/wiki/Carol%20Twombly" class="freelinking" rel="nofollow">Carol Twombly</a>, consult the wiki. And check out <a href="http://www.typophile.com/node/32680" rel="nofollow">this thread</a>.</p>
      <p>Here are a couple of quotes on Chaparral, from typophiles. It seems to be quite a polarising face. I, for one, like it very much (using it for my stationery &amp; stuff).</p>
      <p><cite>I keep trying to use it and it always seems to fall short. I can’t articulate why.</cite> — <a href="http://www.typophile.com/node/39592#comment-244492" rel="nofollow">Patty</a></p>
      <p><cite>Chaparral […] could end up as a standard children’s font for me.</cite> — <a href="http://www.typophile.com/node/42632#comment-262630" rel="nofollow">Malte</a></p>
      <p><cite>Chaparral is hard to use well, for sure.</cite> — <a href="http://www.typophile.com/node/39592#comment-244574" rel="nofollow">Will</a></p>
      <p><cite>Chaparral is probably the only slab that has optical sizes. I do have to say that it’s really versatile, though it’s not exactly a Scala-kind-of-workhorse.</cite> — <a href="http://www.typophile.com/node/28288#comment-159471" rel="nofollow">Bram</a></p>
      <p>What ONE typeface would you have rather not exist? <cite>Chaparral. Ok, you beat me up for this one.</cite> — <a href="http://www.typophile.com/node/36352#comment-222258" rel="nofollow">Thomas</a></p>
      <p><cite><a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Bringhurst</a> does mention Chaparral in his list of types. And since he mentions so relatively few types, that means he gave it his seal of approval.</cite> — <a href="http://www.typophile.com/node/29407#comment-168386" rel="nofollow">Reed</a><br>
      (Bringhurst’s <em>The Solid Form of Language</em> is set in Chaparral.)</p>
      <p>Plus: some unisonous thoughts about pairing:<br>
      <cite>Auto is sort of a Chaparral Sans.</cite> — <a href="http://www.typophile.com/node/38561#comment-236149" rel="nofollow">Stewf</a><br>
      <cite>The informal shapes of Chaparral will probably play real nice with Auto.</cite> — <a href="http://www.typophile.com/node/19326#comment-118785" rel="nofollow">Carl</a></p>
      <p>F</p>
