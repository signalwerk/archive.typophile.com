    html: |-
      <p>Hello,</p>
      <p>I found this on <a class="freelinking external" href="http://www.panose.com/ProductsServices/pan1.aspx" rel="nofollow">panose.com</a>:</p>
      <p><strong>1.5 Digit values of 0 and 1</strong><br>
      <em><br>
      The reader will notice that the value 0 and 1 are defined as Any and No Fit for every digit in the PANOSE system. These have specific meanings to the mapper. 0 means match that digit with any available digit. This allows the mapper to handle distortable typefaces such as multiple master fonts in which, for example, weights may be variable or serifs may change. 1 means that the item being classified does not fit within the present system.<br>
      </em></p>
      <p>Therefore I use value 1 for 'not classified'.</p>
      <p>Best<br>
      Eigi</p>
