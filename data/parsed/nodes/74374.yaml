    html: <p>FontLab--at least my installation on Windows Vista--attempts to fill in Panose numbers on its own, with mixed success. The default for weight appears to be Book, no matter the font, but Proportion, Contrast, and x-Height are usually more or less correct. Fontographer 5, on the other hand, gives you Any straight across the board...</p>
