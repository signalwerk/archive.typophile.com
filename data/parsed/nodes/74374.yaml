    html: |-
      <p>Nick: <em>As the terminology is so bizarre and non-typographic, it's probably best for type designers to only enter "Any" or "No Fit".</em></p>
      <p>That's certainly better than trying to guess at correct settings based on the terminology. The terminology should simply be ignored, because Panose is actually a system of measurement, which the terminology obscures. The only way to set correct Panose values is to actually conduct the measuring and relevant calculations for each value. A number of foundries have made custom tools to automatically calculate Panose values; it would be nice to see something like this added to tools like FontLab. The few times when a client has specifically requested that we include accurate Panose information in a font, I have done the measurements and calculations manually using the documentation now available at <a href="http://www.panose.com" title="www.panose.com">www.panose.com</a></p>
