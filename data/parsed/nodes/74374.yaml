    html: |-
      <p>"Any" is the default that means the font has not been classified, so that's what you want. Yeah, it could be more clearly named.</p>
      <p>"No Fit" means that the font does not fit within any of the available categories.</p>
      <p>Cheers,</p>
      <p>T</p>
