    html: <p>Raisonne is most definitely the source here. Rosario loves to customize typefaces, and has worked with GT Walsheim before – so it's safe to say that that idiosyncratic GT Walsheim 'G' hit a nerve and inspired the changes to Colophon's Raisonne.</p>
