    html: <p>Of course it was hand lettered. The irregularity of the repeated letters shows that. The charm of the sign is in the uneven spacing and stroke modulations. I don't have any face suggestions other than reviewing older type catalogs and seriously considering drawing your own version. The films are circa 1945. Bon chance.</p>
