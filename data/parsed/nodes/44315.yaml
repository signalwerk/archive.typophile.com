    <p>Hi, I'm looking for this really really old typeface (DREAMLAND THEATER). It may very well be custom/handlettered and non-existent now. My company is designing an identity package for them (post-renovations), and they want something that kind of throws back to this, but not a copy. Currently, I'm using Fairplex Wide in my sketches. I would appreciate any suggestions as well.</p>
