  - id: 273109
    user: 10327
    date: 2008-04-16T12:41:00
    date_raw: 16 Apr 2008 — 12:41pm
    votes: null
    html: <p>By the way, Letterhead Fonts no longer requires a special installer and all that junk—they scrapped that idea. But, there are two things Chuck does differently than most. One, they embed your name in the font so it can be tracked; and two, you need to convert their fonts to outlines before you send them off into the wilderness so they cannot be extracted from a pdf or otherwise pirated. Since most of their fonts are for display, I don't see this as a huge hurdle, and if it keeps a small, wonderful foundry going, then so be it. Chuck, the proprietor, is a great guy and offers fantastic support. I think that it's been very heartbreaking for him to see his fonts pirated all over the place. So I would say, don't be wary of using Letterhead Fonts.</p>
