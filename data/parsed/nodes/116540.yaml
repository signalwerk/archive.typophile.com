    <p>Hello friends. I'm looking for an appropriate typeface to pair with Stratum:</p>
    <p><a href="http://processtypefoundry.com/fonts/stratum-1-and-2/" title="http://processtypefoundry.com/fonts/stratum-1-and-2/">http://processtypefoundry.com/fonts/stratum-1-and-2/</a></p>
    <p>We'll be using Stratum for headlines, most often in the bold weight, all-caps. Are there any typefaces that you'd recommend to be used for paragraph text alongside it? I haven't quite decided if we'd like to go serif or sans-serif with it, as I'd like to try out both. The overall tone we're going for is something modern, geometric, no-nonsense and direct. Thanks for any help!</p>
