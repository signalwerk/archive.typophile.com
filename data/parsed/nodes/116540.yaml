    html: |-
      <p>I thought I'd ask Eric Olsen over at Process about any recommendations. Here's a nice response from him for anyone else that might be interested (hope he doesn't mind my posting it):</p>
      <blockquote><p>"Since Stratum is so assertive, it does best in the lead role with other typefaces acting as support. I can't offer anything specific, pairing typefaces is extremely project specific, but the best pairings I've seen track in the opposite direction of Stratum. For instance, Metropolis magazine used Stratum for years with slab serifs and Bodoni. The latter pairing reveals a bias of mine as well - typographic contrast. Again being so assertive, it's best to contrast the loud voice of Stratum with something delicate. But, this also makes some assumptions about usage and size that are very project specific.</p>
      <p>"All of that said, my best advice is to avoid something with implied geometry like Stratum because the resulting pair can be harsh. I'm always impressed by the pairing options designers can come up with - I've enclosed one below with fashion designer Paul Smith. I never would have suggested a hand drawn typeface with Stratum, but there it is!"</p></blockquote>
      <p>This is the Paul Smith pairing he's referring to: <a href="http://assets.sbnation.com/assets/2016057/Paul_Smith_Giro_2013_Jerseys.jpg" title="http://assets.sbnation.com/assets/2016057/Paul_Smith_Giro_2013_Jerseys.jpg">http://assets.sbnation.com/assets/2016057/Paul_Smith_Giro_2013_Jerseys.jpg</a></p>
      <p>So it looks like I'll be exploring some options that contrast it more—less geometric and more delicate.</p>
