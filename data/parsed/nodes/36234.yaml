    <p>Hi everybody!</p>
    <p>1.<br>
    <em>Chumbitos</em> is an unicase &amp; monospaced ultra-fat typeface I'm working on. Take a look on <a href="http://www.fictilia.org/stuff/Chumbitos_070817a.pdf" rel="nofollow"><strong>this pdf</strong></a> and tell me what do you think about... ;-)</p>
    <p>2.<br>
    Some days ago, after I've drawn all the basic glyphs -- Caps, lower-case, numbers and some diacritics --, my friend <a href="http://typophile.com/user/14604" rel="nofollow"><strong>Quincunx</strong></a> told me about some similarities between <em>Chumbitos</em> and <a href="http://neutura.org/Deuce.html" rel="nofollow"><strong>Deuce</strong></a>. In fact, some glyphs are very very similar, but the <em>intentions</em> of mine are far from that, as you can see on the pdf. Well, I don't knew <em>Deuce</em> before to drawn <em>Chumbitos</em>, so what do you think about this kind of <em>situation</em>? Legally, Ethically, ...</p>
    <p>Thank you,<br>
    undr</p>
