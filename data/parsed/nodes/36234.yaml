    html: |-
      <p>After some experimentation and many additions of unnecessary elements, I decided to back to basic and to the original intention of Chumbitos: The less as possible elements <em>over</em> a square to build a glyph. I did a full revision and I'm thinking in release only Chumbitos-Regular and Chumbitos-Bold, without any Alternates. I don't know why, but I think this typeface don't need it with all this ideas behind it...</p>
      <p>On the Regular, I worked always with 10% of the square size for all the elements over the square. On the Bold one, I changed it to 20%, but it affects only some <em>vertical elements</em>, leaving all the others unchanged. So, the Bold version don't has all its glyphs different of the Regular, but it offers a considerable increase of weight on use...</p>
      <p><a href="http://www.fictilia.org/stuff/Chumbitos_070822a.pdf" rel="nofollow"><strong>Here is a pdf</strong></a> to illustrate what I said.</p>
      <p>Now I think it needs just some little adjustments and it will be fine to go... ;-)</p>
      <p>undr</p>
