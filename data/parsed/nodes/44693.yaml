      <p>It’s a bit of a scary bear, old Pykie needs lots of tender loving kerning. Creating kerning pairs in the font for all possible combinations—-even half of them—-creates a class-based proliferation reaching into tens of thousands pairs. Users will have to manually kern in some situations.</p>
      <p>Pyke’s Peak requires its users to be lettering artists. You could say it’s a demanding font.</p>
      <p>What the capitals get up to:</p>
      <p></p><div class="imageWrap"><img src="/web/20081012144852im_/http://www.typophile.com/files/mad_emperors_6425.gif"></div><p></p>
      <p>Mirror-pair ligs:</p>
      <p></p><div class="imageWrap"><img src="/web/20081012144852im_/http://www.typophile.com/files/bring_babbage_3902.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="/web/20081012144852im_/http://www.typophile.com/files/with_mirrors_4867.gif"></div><p></p>
      <p>More craziness:</p>
      <p></p><div class="imageWrap"><img src="/web/20081012144852im_/http://www.typophile.com/files/barsackwards_4269.gif"></div><p></p>
      <p>Digital letraset:</p>
