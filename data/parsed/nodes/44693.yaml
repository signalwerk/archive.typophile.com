    html: |-
      <p>Cheers guys. This font is plenty heap ’o fun. It’s a Roman inscriptional kind of thing, but not inscribed as such. A synthetic technical pen tool is the basis for the stroke design and finish.</p>
      <p>It has Ar’deco-influenced Trajanesque capitals with several twists, quite a few phantom letters, a wacky lower case, and a contextual alternates feature that swaps in a more text-friendly (read: more readable) character set.</p>
      <p>What else? Oh, a proper Lining Numbers feature: turn on the lining numeral set and all the math and currency symbols are positioned to suit. Luxury! What else? A supporting cast of 590 extras—-stacks of stylistic alternates and a staggering array of ligatures. Some of the ligature pairs are fitted like the THE word lig.</p>
      <p>I’ve completed testing all the OT features, and now I’m finishing kerning. </p>
      <p>j a m e s</p>
