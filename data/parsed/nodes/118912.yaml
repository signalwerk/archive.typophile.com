    html: <p>Artwork by <a class="freelinking external" href="http://karmakarma.org/tagged/projects" rel="nofollow">Joe Bradley</a>. Firstly thought it could be bespoke then reminded me of <a class="freelinking external" href="http://typophile.com/node/79271" rel="nofollow">Leroy Lettering machine</a> (alternatives <a class="freelinking external" href="http://typophile.com/node/114201#comment-571421" rel="nofollow">here</a>). To me it looks like some sort of Helvetica Rounded Light with some little adjustements. Then, I remembered many non-latin fonts have their latin sub-sets close to "classic" typefaces (Helvetica, Optima, Times, Myriad...). Finally, found the Korean language font <a class="freelinking external" href="http://www.fonts.com/font/hanyang/hy-gothic" rel="nofollow">HY Gothic</a> Rounded (bundled with Adobe Font Folio 11) that matches this design.</p>
