    <p>Hello,</p>
    <p>Does anyone know what this font is?<br>
    It is kind of like a typewriter font without slab serifs but looks default for a machine.</p>
    <p>It would be great to find out!<br>
    I like the look.</p>
    <p>Thanks in advance!<br>
    Takashi</p>
