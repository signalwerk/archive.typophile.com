    html: |-
      <p>Since the artwork consists in etched plastic plaques, and given the kind of spacing (see, for example the A-T pair in "EAT", my hunch is that it's a font that resides in some specialised machine used for custom made plaques, and has no direct correspondence with any digital typeface.<br>
      As for general shape of letters, the closest I found is AG Rounded.</p>
