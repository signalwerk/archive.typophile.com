    <p>Hello everyone - first post here. </p>
    <p>I was wondering if anyone had a list of Type foundries offering iOS embeddable fonts?  I've been doing alot of research lately on fonts and applications and there is so much mixed information out there on the licenses.  I design a good amount of apps and want to make sure I'm giving the foundries their credit. </p>
    <p>I'd be interested in creating a list here for paid, open source, etc in iOS fonts? </p>
    <p>Thanks.</p>
