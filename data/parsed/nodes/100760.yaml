    html: |-
      <p><cite>different views on this including some complete disregards for the type designer </cite></p>
      <p>What does that mean? </p>
      <p>It's very simple: Embedding software in an app is “software distribution”. If you purchase a print license, you are allowed to use the font on local machines, not to distribute it with an app. Just as you are not allowed to distribute Dreamweaver, Xcode or whatever software tools you use to create your work. You have a license to use them, not to redistribute them. Not even in a “hidden” way, which is not directly usable by the user of the app. </p>
      <p>Webfont license are supposed to be called from web servers by browsers. You might call those fonts from a web server from within a web browser in your app, but you are not allowed to embed the font files in an app. </p>
      <p>OFL licenses are very liberal. You can do a lot with them, including app embedding.</p>
    html_clean: |-
