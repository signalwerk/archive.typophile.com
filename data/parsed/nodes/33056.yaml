      <p><em>Can you guess what it’s doing there?</em></p>
      <p>Well, they started out in all caps, so when it came time to emphasize a word, they were stumped. Setting it in lower case wouldn’t look right, and they didn’t have a bold or italic font, or underlines [edit: or as hhp notes, maybe didn’t think of letterspacing], so quote marks did the trick.</p>
      <p>Somewhat related, *certain* Typophilers use asterisks for emphasis — what’s with that?</p>
