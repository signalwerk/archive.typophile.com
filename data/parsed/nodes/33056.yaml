      <p>I always thought the non-sarcastic use of emphatic quotes was the punctuation-equivalent of a misspelling or grammatical error. However, it is so common, and not condemned to the same degree. Lately, I am starting to suspect that there may be something more historical to it.</p>
      <p>Nevertheless, with all the uses they already have, and visual similarity to primes, I think enough is enough. I am all for little *asterisk* stickers that I can slap over “abused” quotation marks.~</p>
