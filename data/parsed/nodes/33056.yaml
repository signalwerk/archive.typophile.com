      <p>Though you are all showing a great sense of humor about the quotes - I doesn’t sound like anyone here has set type hand in hand with an editor - trying to meet deadline.</p>
      <p>A decent editor would take those quotes (I am speaking from interior book design) and make them <em>Italics</em> for the emphasis.</p>
      <p>Right now, I am laying out a story on Duesenbergs - and the author refers to them as “Duesys” (hmmm should that be Duesies?) and yes, in quotes - but when the article is published the readers shall see it in Italics... </p>
      <p>Or are we just picking on the word that’s has the quotes around it...</p>
      <p>And I love the inch-mark remark. When the New York Times back in 1987 printed a full page ad - and the quote marks were inch marks — everyone at TANY (remember them? Typographic Association of New York) commented how it was the end of the professional typesetting age... and yes, they were right.</p>
      <p>Meanwhile, I always loved the oversized quotes found in Zapf Dingbats - they really get the quoted message across.</p>
