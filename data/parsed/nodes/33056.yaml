    <p>The quote is a tricky, powerful “shape-shifter” of a character, with abilities way beyond its formal uses for marking verbal expressions, titles, etc. We’ve all seen it used to mean “not exactly”, or even “not really, but this way you can’t sue me”, when a product is advertised to do something it doesn’t. I’ve also seen it used to mean “not exactly but there’s something to it”: during a visit to the Cayman Islands I saw a car rental place with a large “JEEP ONLY” sign, in quotes; it actually had other vehicles for rent too, but/so wanted to succinctly state: “This is the place for renting a jeep, but we have other stuff too”*. And during this past spring break I saw the quote used thus:</p>
    <p></p><div class="imageWrap"><img src="/files/quotes_s_4715.jpg"></div><br>
    _<br>
    Can you guess what it’s doing there?<br>
    _<br>
    * Some years later I saw a similar thing at a motorcycle rental place in Hawaii: “HARLEYS ONLY”.<p></p>
    <p>—</p>
    <p>Please post other example of the quote doing something<br>
    besides what it’s “supposed” to. (And there it is again!)</p>
    <p>hhp</p>
