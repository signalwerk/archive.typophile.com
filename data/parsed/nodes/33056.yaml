      <p>&gt; “Chinese Food” for take-out and delivery only.</p>
      <p>Those are  Japanese quotes. As a translator I see them all the time.<br>
      I won’t bore you with the details, but basically this is one way that people used to thinking in a topic-comment language try to make up for English’s lack of ways to formally mark the topic.</p>
      <p>They just want everyone to be very clear that this sentence is about Chinese Food.</p>
