      <p>Type history is an important topic. Students should know and understand how we got to where we are. However, students are done a great disservice when they are only shown old work. That's why you see so many student pieces that use Serpentine sans. To them everything is new and great.</p>
      <p>So my recommendation: do a type history section. Then do a "what's happening right now" section. Show new types as well as old types that are being used appropriately the current cultural context. Show how cultural contexts change (even from year to year).</p>
    html_clean: |-
