    <p>I am a graphic designer and professor teaching graphic design. I give my designing with type class 24 typefaces they must know before they leave my class (12 serif and 12 sans serif). I thought it would be interesting to see what typeface you all think are the essential 24 typefaces to learn.</p>
    <p>Here are the ones that I have given them: </p>
    <p>Serif: Bembo, Bodoni, Caslon, Century Schoolbook, Sabon, Scala, Clarendon, Garamond, Meridian, Mrs. Eaves, Trajan, and Baskerville</p>
    <p>Sans Serif: Akzidenz Grotesk, Avenier, Century Gothic, DIN, Franklin Gothic, Frutiger, Futura, Helvetica, Interstate, Neutra, Scala, and Univers </p>
    <p>Let me know your thoughts.</p>
    <p>-david</p>
