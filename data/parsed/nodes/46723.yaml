      <p>From my personal recollection of intro to typography, I remember learning 2 things... a lot of history and a lot of fonts (memorizing as much the day of a quiz)... most of which I forget now. What I didn't learn about (and have learned since, thanks typophile) is the essential building block for choosing and using fonts... such as why are small caps important or what's the different between OSF, LF, and TF. History is important, don't get me wrong. Explaining where particular faces came from, which faces are the grandfathers to all the new digital faces, and how type has developed over time. Are important towards understanding about why faces are like they are and where typesetting practices originated (it's called leading!)...as Goudy is often quoted, "The old fellows stole all the best ideas." </p>
      <p>Take a gander at this: <a href="http://www.flickr.com/photos/fontshop/sets/72157604597637021/" title="http://www.flickr.com/photos/fontshop/sets/72157604597637021/">http://www.flickr.com/photos/fontshop/sets/72157604597637021/</a> </p>
      <p>It's a flickr set from Stephen Coles for Fontshop on Opentype fonts... I think it's a nice introduction to a lot of features that fonts have but are often ignored during the intro to typography stage (which was, for me, more of a primer on history and not technique).</p>
      <p>Also Nick Shinn wrote a wonderful article on getting the most out of a type face, especially one with expert features.<br>
      <a href="http://www.shinntype.com/Writing/DigginIt.pdf" title="http://www.shinntype.com/Writing/DigginIt.pdf">http://www.shinntype.com/Writing/DigginIt.pdf</a></p>
      <p>I think the important thing is to give your students the tools for using fonts. To understand how and why a particular font is a better choice for a particular problem (like you shouldn't use a display font for setting body copy)... then allow them to make that choice on their own.</p>
