      <p>Thanks Thomas. </p>
      <p>The class is not a history class, but how to use typefaces in design. So even though the history is important the goal is for them to learn how to use typefaces in a contemporary way. The reason I have avenier, furtura and nuetraface is not because it is in, but those typefaces can be used for VERY different situations. </p>
      <p>Avenier is fantastic at very small sizes 6 and below where futura would not be as good. Neutra is better at larger sizes and not as good for long body copy. Also futura is good, but it is used A LOT and I want to show there are different geometric typefaces than futura. The same reason I have helvetica, Akzidenz and Universe.</p>
      <p>Maybe this is my age, but i feel optima is not the best typeface and would rather them design with other typefaces than optima. My personal opinion. </p>
      <p>Bauer Bodoni, Caslon Book BE, and Garamond</p>
