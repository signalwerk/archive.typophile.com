      <p>Come to think of the way you assign your students to know 24 typefaces and think that they can pick one of these to use for almost every design project ahead, I personally don't think it's enough.</p>
      <p>I mean, there are only two categories of typefaces – 12 sans serif and 12 serif. What if their next design project has Victorian Vintage with lots of Versal or Gutenberg or Punk Rock with Black Type theme, these ones could not possibly convey their meaning and portrait the needed design requirements.</p>
      <p>If your students know about the anatomy of typefaces and some categories or varieties developed through centuries, from Roman Chiselled face (Trajan), Black Text, Round Hand, Humanist, Metal Type, 20th century art movements, to a boom of various digital faces nowadays. And along the way just one significant typeface for them to remember. I think you'll get two purposes at once – your students know about the history &amp; its style and how to pick the right ones from a bunch of typefaces available according to their design needs. Just open their eyes with choices and the style it represents would sound fun to me.</p>
      <p>Just my opinion na.</p>
      <p>--- pinky kinky winky ---</p>
