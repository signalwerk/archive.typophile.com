      <p>Well, what does it mean to be "essential to learn" and "know"? Essential that they know how to use the typeface? Essential that they know about it?</p>
      <p>Of course it reflects my own biases, but we're talking about 550 years of type design. Picking things that are trendy hardly seems "essential" to me - the last 20 years seem over-represented to me.</p>
      <p>I agree with many of the other comments. You really need to include Gill Sans and Optima, and Meta is not a bad suggestion.</p>
      <p>I'm not sure I'd include both Century Schoolbook and Clarendon. Pick one, maybe?</p>
      <p>Why four geometric sans serifs and only one humanist sans? I know geometrics are "in" but for teaching, Futura alone is adequate. Futura and Avenir at most.</p>
      <p>Also, *which* versions of Bodoni, Caslon and Garamond?</p>
