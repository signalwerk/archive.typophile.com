      <p><em>What’s the history of Century Gothic, anyway? Someone fill me in, please. To me it looks like a knock-off of Spartan, and as far as I know, the Century family designed at ATF never included a gothic/sans. For that reason, I tend to ignore it.</em></p>
      <p>Koppa, Century Gothic was created in the late '80s by Monotype as a stand-in or substitute for ITC Avant Garde, one of the standard fonts included in PostScript output devices. The name derives from an old Monotype Futura look-alike called Twentieth Century. It's not related to ATF's Century at all. Century Gothic matches the proportions, weight, and spacing of Avant Garde, but has (more or less) the stylistic details of Twentieth Century.</p>
