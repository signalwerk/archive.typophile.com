      <p>Maybe I should have phrased the question differently than I did. The 24 typefaces are only a part of the class probably 20% the other 80% is learning how and when to use certain typefaces. When to use display type, text treatments, when and how to use body copy, how text can be used as your graphic and not just for information, how to mix text with graphics, pushing and challenging the reader, hierarchy, alignment, grid, typographic color, multi page design, spreads, grids, texture, legibility, etc. I am NOT having them imitate anything. I show them design that ranges from clean and sophisticated to corporate to edgy. The 24 typefaces are only part of that whole class.</p>
      <p>Off course I show them the different categories and how to use them and why and maybe it is my fault in how I phrased the question, but it was not meant to turn into what should be taught and what should not be taught. </p>
      <p>I posted this because you guys are into typography just as much as I am, maybe more a lot more, and I thought this would be a good topic to bring up. Maybe I should have phrased it "If you had to bring 24 typefaces with you and only 24 which typefaces would you bring?"</p>
      <p>Someone posted about showing Victorian typefaces as some of the 24 and that is fine, but that all depends on the client and what style of Victorian or grunge that they want not ONE specific Victorian typeface.</p>
