      <p>I don't think it's so important for them to learn how to use these 24 <em>specific</em> typefaces. What's more important is for your students to be able to categorize typefaces, and to learn when their use is appropriate. If they leave your class knowing how to use 24 typefaces, and <em>only</em> 24 typefaces, then they have learned nothing; they aren't learning how to do anything original with those typefaces. If you instead teach them how to categorize typefaces, then you'll get some pretty bad results along the way, but they'll be better designers for it.</p>
      <p>This is really a question of imitation versus innovation. If your goal is to teach them how to create consistently good, but not innovative, design with 24 typefaces, then you will accomplish your goal. If your goal is to teach them how to be innovative with type, then you're going about it all wrong.</p>
    html_clean: |-
