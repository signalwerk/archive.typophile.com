      <p>Thanks Jay.<br>
      I think the logic holds up pretty well, after a few years, though the types I suggested are a bit out of date now, and they had a Toronto flavor, which one would vary for Baltimore.</p>
      <p>In a nutshell:<br>
      Choose the genres that designers and art directors may be required to use:<br>
      -Serif: display<br>
      -Serif: text (includes features such as small caps and various forms of figure, in OpenType format)<br>
      -Sans: multi-weight family from Thin to Extra Bold<br>
      -Sans: condensed<br>
      -Script<br>
      -Distressed<br>
      -Pixel<br>
      -Internet<br>
      -Retro<br>
      -etc.</p>
      <p>Now, choose 21st century faces for these genres, from a wide variety of foundries.</p>
