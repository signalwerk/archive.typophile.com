    html: <p>As far as I can tell, Private Character Editor maps its characters to code points in the Private Use Area. You could set up Fontlab Studio look and behave a bit more like PCE by toggling "Unicode ranges" mode in the Font window, then choosing "E000 Private Use Area" from the dropdown. (You can also assign Unicode values manually in the Glyph Properties box.) I don't know enough about PCE and its TTE files, Font Links, etc. to know if generating an ordinary font with PUA-encoded glyphs would yield the result you're after, but at least your custom characters would not be sharing Unicode values with existing characters.</p>
