      <blockquote><p>Than when i create that font and install it and use it, whenever i type A that Chinese character i design appear, but if i copy that Chinese character i designed and past it into notepad for example, than the letter A is displayed. But i want it still to display the Chinese Character.</p></blockquote>
      <p>In theory this would be possible as long as your font is installed at the system level on the relevant computer and is set to be the default font (where that is possible) in the applications you are using. As soon as you change to a different font the correct character for that code point will be displayed, so the behaviour you are hoping to see is dependent on how you set up the computer(s) on which the font is installed.</p>
      <p>In general this is very bad practice for designing fonts and as soon as you introduce the font to different environments over which you have little or no control you will start to see unexpected and unpredictable results. If the character you are creating adheres to a Unicode code point then it should be assigned to that code point in order to display consistently, regardless of which application you are using. If you are creating Chinese characters then you will find fewer fonts (depending on the computer) that support it but it will be universally (and correctly) recognised.</p>
