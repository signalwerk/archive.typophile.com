      <p>Thanks very much for the replays. I will look in to toggling the "Unicode ranges". </p>
      <p>I my idea is not really to create Chinese characters or that the characters i am creating should be easily used by another system. I am trying to create one character that represents a whole word and than use AutoHotkey to display the character when i type that word. For ex. i type Performance  and it automatically change the set of letters in Performance to '', i know u cannot see this symbol bc i created it in PCE on my computer. But the dynamics of the symbol is the same, and as you can see, using this symbol instead of Performance saves a lot of space. </p>
      <p>The problem with PCE is that i cannot back up the characters i make. But if i create the characters in FS and create a font from them than i could easily back up the project. The inconvenience is that i am creating a character on a place a normal letter is. So if i copy the newly created symbol to the AutoHotkey script, it will not show the symbol i created but the letter in its place. So. when writing in Word i would have to change the font to the one i created, only on that specific letter i want to be shown as a symbol. And doing this will make the easiness of it all pointless. </p>
      <p>By the way, If anyone knows how to back up the characters created in PCE, please share this with me.</p>
      <p>Thanks again.</p>
