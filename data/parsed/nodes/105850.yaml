    <p>Hi,<br>
    I was wondering if it is possible to create one new character in Font studio and save it the same way a newly created character would be saved in Private Character Editor. I mean, i dont want the newly created character assigned to any current letter, so the only way to use it would be to copy and paste it. </p>
    <p>More detailed info on what i want to do:<br>
    I want to create a few characters that each represents a word, like my own Chinese language based on English. But the problem when i try to do this in Font Studio is that i have to assign the it to a current character. So if i create a Chinese character for A and one for B etc. Than when i create that font and install it and use it, whenever i type A that Chinese character i design appear, but if i copy that Chinese character i designed and past it into notepad for example, than the letter A is displayed. But i want it still to display the Chinese Character. </p>
    <p>If i on the other hand create a character in Private Character Editor and copy it, it will stay constant always. I want to do the same thing in Font Studio because the characters created in Font Studio look so much better.</p>
    <p>Thanks in advance if anyone could help me with this.</p>
