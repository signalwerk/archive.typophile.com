    html: |-
      <p>It's been a while since I've had to deal with characters made with the Private Character Editor, but it was painful.  This software used to be known as EUDCEDIT, where eudc stands for "end user defined characters," so you might try googling by that name.  Michael Kaplan has a <a class="freelinking external" href="http://blogs.msdn.com/b/michkap/archive/2010/01/22/9951970.aspx" rel="nofollow">2010 blog post</a> that lists the two files EUDCEDIT creates when used under WinXP, eudc.tte and eudc.euf, and mentions the difficulty of restoring the latter.  My recollection is that the practical way to "liberate" the bitmaps was by screen-grabs.</p>
      <p>Personally, I'd be really wary of relying on a word-processor's customized input routine tied to a custom version of a standard font that retains the orignal's name.  And while creating one's own Chinese input system might be fun, for serious use I'd rather learn one that has evolved through decades of use.  I like 倉頡 (<em>cangjie</em>), though I gather 五笔 (<em>wubi</em>) is similar.  Having spent the time to learn <em>cangjie</em>, I can toggle that IME on with a key combination, press a few keys to get my character, and then toggle back to continue typing with regular keyboard input.  MS Word will automatically find a font for my character, even if it is a rare form up in Unicode's CJK Extension B (note that accessing Extension B  requires adjusting the IME's default settings).  And if I want to share my thoughts with others I don't have to print them out: anyone else can read my file with their system's standard software.</p>
      <p>Good luck!<br>
      David</p>
