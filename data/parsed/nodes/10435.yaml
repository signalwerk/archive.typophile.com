    html: <p>Sutro is nice, but it loses much of the quirkiness of Clarendon and feels too much like what it is, which is a Jim Parkinson face for use in magazines. It's clean and effective, but looking at it gives me bad flashbacks to boring profiles of alt.country bands in Rolling Stone and Magnet. The same goes for Humanist Slabserif 712 and Egyptian 505, although those seem like they'd be useful in a lot of the same situations as PNM Caecilia, with a slightly less reserved character. <br> <br>Oxtail is brilliant. Thanks for bringing it to my attention, Yves! It's as playful as Farao but goes in a different direction. Since I just licensed Farao, though, I think I'll hold off on Oxtail for now. <br> <br>Still, what I was really looking for was feedback on the various digital cuts of Clarendon itself. I'm attached to the weird thin stem of the r with its fat ball terminal, just like I'm attached to the upturned tail of the a�all the features, in short, that Farao plays up to the point of parody. URW, Agfa-Monotype, Elsner+Flake, Bitstream, Scangraphic, Mecanorma and Linotype all have their own cuts of Clarendon, and the only real differences I can identify between them is that the Monotype and Mecanorma versions use the inferior Monotype cut rather than Haas's recut for Linotype. Do any of you have any preferences from aomng that bunch?</p>
