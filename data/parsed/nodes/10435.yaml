    html: <p>Personally I really like - and licensed - <a href="http://www.macrhino.com/" target="_blank"> Stefan Hattenbach</a>'s <a href="http://www.psyops.com/html/spec_oxtail.html" target="_blank"> Oxtail</a>. <br>It is very of the now, but subtly, without shouting it into your face. <br>The unexpected thinning of certain serifs and some quirky design  <br>accents makes it stand out beautifully. And you gotta love that 's' ! <br> <br>No concave feet though. You'll find those in <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=BT.107654.0.1&amp;attributes.sampleSize=48&amp;sampleText=H&amp;sampleSize=388" target="_blank"> Humanist Slabserif 712</a>, <br>not in <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.2543.0.1&amp;attributes.sampleSize=48&amp;sampleText=H&amp;sampleSize=388" target="_blank"> Egyptienne F</a>, the really poor digitization offered by Linotype  <br>which frankly is a disgrace! Source of the Originals my @$$...</p>
