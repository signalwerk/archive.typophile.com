  html: <p>Fortune, Volta, Consort, Farao, PNM Caecilia... I've been on an Egyptian bender recently, but I keep coming back to Clarendon and its wonderful curves and contrasty stems. After spending all night looking at the diifferent versions of Clarendon available digitally, I'm wondering if there's any meaningful difference between them in terms of quality or elegance of the typefaces themselves. URW has a billion different weights, AGFA/Monotype has both Monotype Clarendon and Monotype New Clarendon, and Elsner+Flake offers their version in OpenType, albeit with no OpenType goodies as far as I can tell. <br> <br><a href="http://www.graphic-design.com/Type/Good-bad/fonts.html">Fred Showker says</a> egyptians should have slightly concave feet; do any of the digital cuts actually do this? Which, if any, of the metal types do? I looked in my Encyclopedia Of Typefaces and Rookledge's, and I think I see what he means, but maybe I'm just suggestible. <br> <br>Why can't I find Fortune or the expanded weights of Consort available online / in digital form? They sure are pretty... instead I've grabbed Volta and Farao. It generally doesn't take much persuading to get me to buy Storm fonts, and Farao manages to be warm and feminine and understated all at once.</p>
  html_clean: <p>Fortune, Volta, Consort, Farao, PNM Caecilia... I've been on an Egyptian bender recently, but I keep coming back to Clarendon and its wonderful curves and contrasty stems. After spending all night looking at the diifferent versions of Clarendon available digitally, I'm wondering if there's any meaningful difference between them in terms of quality or elegance of the typefaces themselves. URW has a billion different weights, AGFA/Monotype has both Monotype Clarendon and Monotype New Clarendon, and Elsner+Flake offers their version in OpenType, albeit with no OpenType goodies as far as I can tell. <br> <br><a href="http://www.graphic-design.com/Type/Good-bad/fonts.html" class="link-external">Fred Showker says</a> egyptians should have slightly concave feet; do any of the digital cuts actually do this? Which, if any, of the metal types do? I looked in my Encyclopedia Of Typefaces and Rookledge's, and I think I see what he means, but maybe I'm just suggestible. <br> <br>Why can't I find Fortune or the expanded weights of Consort available online / in digital form? They sure are pretty... instead I've grabbed Volta and Farao. It generally doesn't take much persuading to get me to buy Storm fonts, and Farao manages to be warm and feminine and understated all at once.</p>
