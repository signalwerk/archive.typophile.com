    <p>I am trying to identify this face.  The attached photo is a scanned proof print of a foundry type face from the International Printing Museum.  From speaking to another docent who had tried to research it the closest he was able to find was a face created in germany called Beaton (I believe that was the spelling)  I have not been able to find additional information.  We have the font in 3 sizes and in the smaller (24pt &amp; 36pt) the font is identical except for two alternate characters for K and G.</p>
    <p>I am looking for information regarding the foundry version any information would be greatly appreciated.</p>
    <p><img src="/sites/default/files/old-images/NSFont_3821.jpg"></p>
