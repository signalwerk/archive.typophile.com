      <p>Thank you JanekZ,  it looks like you are correct although the digital creations dont seem to hold a candle to the original cuts.<br>
      I was able to find a list of variations of beton on identifont <a href="http://www.identifont.com/show?145" title="http://www.identifont.com/show?145">http://www.identifont.com/show?145</a> however I still have yet to find mention of this specific cut.  there were many variations but Im starting to think that Heinrich Jost may not have dont this one as I can not find it listed under his work, it may have been a later addition to his work so I am going to keep digging.</p>
