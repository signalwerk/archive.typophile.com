    html: <p>Maija, good luck with your project! Writing a cold-call proposal takes guts and talent. <br> <br>It seems to me that your choice of type will depend on how Baltic it's supposed to look, versus how Eurogeneric. Are the [potential] clients self-assured Latvian Europeans, or insecure wannabe Western-Europeans? <br> <br>Keith? I presume he got himself a life.  :-/ <br> <br>hhp</p>
