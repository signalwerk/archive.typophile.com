  html: "<p>So I have this huge project in my mind: designing traffic system navigation for my city. It would include various signs of various sizes, maps, city guides etc. For some reason nobody has done it yet, and if you are first time in our city and want to go somewhere using the public transportation, you can easily get lost in 5 mins. I have been in Berlin and London, where they have quite beautifully designed public transportation navigation systems and would love to have one for my city. <br> <br>So I have started writing a proposal for the appropriate public persons and want to include several samples of how the system should/would look like. And of course I need the typeface for it. It should have be readable in small sizes and from large distances and preferably usable in setting book size type as well.  <br> <br>Our traffic sign system used Helvetica for some time and then switched to DIN. I have seen few signs set in Alternate Gothic as well. I don't like any of those choices. <br> <br>Are there any publicly available typefaces designed specifically for environment navigation? What would you suggest?</p>"
  html_clean: "<p>So I have this huge project in my mind: designing traffic system navigation for my city. It would include various signs of various sizes, maps, city guides etc. For some reason nobody has done it yet, and if you are first time in our city and want to go somewhere using the public transportation, you can easily get lost in 5 mins. I have been in Berlin and London, where they have quite beautifully designed public transportation navigation systems and would love to have one for my city. <br> <br>So I have started writing a proposal for the appropriate public persons and want to include several samples of how the system should/would look like. And of course I need the typeface for it. It should have be readable in small sizes and from large distances and preferably usable in setting book size type as well.  <br> <br>Our traffic sign system used Helvetica for some time and then switched to DIN. I have seen few signs set in Alternate Gothic as well. I don't like any of those choices. <br> <br>Are there any publicly available typefaces designed specifically for environment navigation? What would you suggest?</p>"
