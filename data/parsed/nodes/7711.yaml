    html: "<p>&gt; Hrant is from Armenia <br> <br>Real quick: I am Armenian, but I've only been in Armenia once (for 9 weeks). <br> <br>&gt; that is the common perception of type here <br> <br>This problem exists anywhere, just to different degrees. <br> <br>&gt; we ourselves don't know what Baltic means <br> <br>Is it possible you don't formally \"know\", but you still <i>feel</i> it? <br>\"Balticness\" must exists, it's just a matter of finding it. <br> <br>I believe that abstract shapes are part of culture (even lacking a general awareness/respect of graphic design per se), so you might try to uncover the shapes (and colors) inheret to your culture. This reminds me of my recent trip to Novosibirsk, consulting for the corporate identity design for a Russian bank: during the visit it became clear to us that they needed something somewhat \"ethnic\" (we arrived at something derived from the shape of the classic Russian birch tree leaf - which also looks like the wonderful onion domes on their curches) in order to alleviate the general mistrust in banking among the people (which causes them to keep their savings under the bed), while the bosses wanted something that looked like a French spaceship.  :-/ <br> <br>If you can harness the feeling of Balticness, and apply it properly, you might manage to strike a very fruitful chord even in an overall functional/generic approach. <br> <br>hhp</p>"
