    html: "<p>How Baltic it is supposed to look... Hmm.. see, here we come to the huge problem of our lack of self-definition. Apart from having almost none true \"utilitarian\" graphic design culture as such, we don't have an established country identity as well - apart from the 'quite sweet yet good for nothing' concept called 'country that sings'... It's the result of our post-soviet situtation, where everybody who can is busy getting rich as fast as possible and others just don't care, as 'everything is decided by someone else anyway'. As I understand that Hrant is from Armenia, he could have quite a precise picture of the whole taste of the situtation. So 'insecure wannabe Western-Europeans' is certainly the case.  <br> <br>The problem is that I expect the client to have no understanding of the problem and means of solving it whatsoever. So if I get that far, most of the energy will be spent on arguing that the design of the traffic is necessary as such. I don't think they'll see any difference between Arial and Arrival, even if I print out 72 pt samples and wave them in front of their noses (see the 'typeface for museum' thread). You see, type is just something that comes with your computer and is seen in Microsoft Word 'Font' box and there are three kinds of them: arial-like, timesnewroman-like and comicsans-like. Apart from that all letters look the same. No kidding, that is the common perception of type here, and explaining why it's much more than that is a tremendous work... and all the public persons feel extremely important, as they have power, but I don't, so I'm their servant, not the other way round.. a soviet heritage, too. <br> <br>So, as we ourselves don't know what Baltic means, then what I would like to have is a well designed  and constructed, highly functional face. (And then I start to think, who defined what: did the London Underground font define the sense of 'british looking type' or the other way round? I guess I should do some reading of how those other designers came to their solutions...) <br> <br>I saw samples of Arrival, when its design was discussed on this board somewhen earlier. I like Clearview better, because I find it to be much more versatile, although its certain 'Interstatiness' leaves me wanting for something... a little different? Little more humanist? But it's a good design with its positive/negative contrast adjustments, perception tests, many weights and all. And Interstate here is far less overused than in US, after all.</p>"
