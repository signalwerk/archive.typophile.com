ng of how those other designers came to their solutions...) <br> <br>I saw samples of Arrival, when its design was discussed on this board somewhen earlier. I like Clearview better, because I find it to be much more versatile, although its certain 'Interstatiness' leaves me wanting for something... a little different? Little more humanist? But it's a good design with its positive/negative contrast adjustments, perception tests, many weights and all. And Interstate here is far less overused than in US, after all.</p>"
