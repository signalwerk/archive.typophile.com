    html: <p>Fortunately, the British Transport Department isn't as ruthless as it likes to think and there are still many old-style signs around, especially in rural areas. <br>Taking on the project of designing a signage system for a city must be good for a designer, but if the city implements this kind of scheme fully, it might destroy some of the feel of the place - the atmosphere that grows on a place without anyone noticing, as elements of new design mingle with old established features. <br>While I understand why the MoT adopted Kinneir and Calvert�s system for all signs on 'A' roads, I'm happy that they didn't quite get around to replacing all of the old ones on smaller roads. Aside from leaving a trace of different styles from different times, old signs sometimes give clues to a wider history, by illustrating how places that are now small and relatively insignificant, might once have been thought of as important.</p>
