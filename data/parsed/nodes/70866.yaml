    <p>For those who are interessted in historic vintage typographic magazines:<br>
    I'm selling some of my famous swiss <strong>Typografische Monatsblätter TM SGM RSI</strong> on Ebay.</p>
    <p>Issues feature work of designers and teachers like Hans-Rudolf Lutz, Hans Rudolf Bosshard, Wolfgang Weingart, Just Hochschuli…</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tm_overview_6012.png"></div><p></p>
    <p>Here is a List of the Issues that are for sale:</p>
    <p>(96th Year)<br>
    March 3- 1977<br>
    Hans-Rudolf Lutz<br>
    Helmut Schmid, Osaka: Der Umschlag ist kein Tümmelplatz für Dekorationen der Designer<br>
    Japan, Shoji<br>
    (Cover: Hans-Rudolf Lutz, Editor: Rudolf Hostettler)<br>
