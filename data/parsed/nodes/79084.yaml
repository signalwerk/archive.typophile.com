  html: |-
    <p><cite>Explorations in Typography: Mastering the Art of Fine Typesetting</cite> (A Visual Textbook for Intermediate to Advanced Typography) is a new book by Carolina de Bartolo with Erik Spiekermann. An extensive collection of beautiful typesetting examples that allows the student of typography to “learn by looking,” it is sure to be instructive and inspirational to anyone who sets text type.</p>
    <p>Visit the interactive companion website at: <a href="http://explorationsintypography.com/" title="http://explorationsintypography.com/">http://explorationsintypography.com/</a></p>
    <p>Specifications<br>
    :: 9.25 x 12 inches (oversize)<br>
    :: casebound with ultra-thin bookboard, so it’s lightweight despite its size<br>
    :: yellow gilded edges<br>
    :: 188 pages<br>
    :: 2 colors throughout</p>
    <p>Key features<br>
    :: Oversize format (9.25 x 12 inches) allows all text typesetting to be shown at full-size. You can therefore clearly see and evaluate exact point sizes, leading, tracking and all other details of proportion, spacing and alignment that distinguish fine typography.</p>
    <p>:: Sample text is an article by Erik Spiekermann.</p>
    <p>:: Page after page, type is set in hundreds of different typefaces, mostly from the FontFont library and each example has complete typographic specifications on the same page.</p>
    <p>:: Sidebars explain key visual elements that make each setting work as well as historical and background information about each typeface.</p>
    <p>:: Specifically designed for intermediate to advanced typography courses, this textbook assumes the reader has prior knowledge of material typically covered in a collegiate level Typography 1 course.</p>
    <p>:: Appendix of dozens of typeface combinations used in the book. </p>
    <p>:: Glossary of terms. </p>
    <p>:: Discount code for 20% off any single purchase of one or more FF fonts.</p>
    <p>Expected to ship in April 2011. Pre-order your copy at a special discounted rate: <a href="http://explorationsintypography.com/buy/" title="http://explorationsintypography.com/buy/">http://explorationsintypography.com/buy/</a></p>
    <p>Enjoy! Happy typesetting!</p>
