      <p>Overlapping type in a browser is often an indication of corrupted font caches. Clear these and have another look — things may not be as bad…</p>
      <p>Something that may be of use: Arial is almost omnipresent on computers, has the same metrics as Helvetica (eg widths of glyphs etc.), and is license-free if I am not mistaken.</p>
