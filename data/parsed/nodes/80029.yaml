      <p>You're not using PFB files as web fonts, are you? (I'm not even sure if that's possible at all)</p>
      <p>Font format and line spacing are related. The vertical metrics are defined differently in Type1 fonts (PFB) and OpenType fonts.</p>
      <p>I would try to use the OpenType/TTF versions of Nimbus Sans, which I believe is available in the file urwfonts-1.41.tar.bz2 from this page: <a href="http://www.artifex.com/downloads/" title="http://www.artifex.com/downloads/">http://www.artifex.com/downloads/</a></p>
      <p>Additionally the vertical metrics in web fonts need to be set in a certain way to avoid line-spacing differences between browsers. Here's a discussion related to that: <a href="http://www.typophile.com/node/78279" title="http://www.typophile.com/node/78279">http://www.typophile.com/node/78279</a></p>
