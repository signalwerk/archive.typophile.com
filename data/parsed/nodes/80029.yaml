      <p>Jeg har brukt et enkelt PHP-script til slikt tidligere. Går fort å sette opp. Men, la meg se om jeg forstår? Standard GDI er ok, Quartz er ok, Freetype er ok, Directwrite er ok, men Cleartype er nesten ok? Alle disse vil produsere forskjellige resultater, og med unntak av Quartz vil alle til en viss grad gjøre bruk av hinte-informasjonen og smoothing-innstillinger i fonten. Et annet problem er at det er umulig å vite hvilken størrelse sluttbrukeren ser, selv om du spesifiserer skriften i piksler. God hinting gjør ting konsekvent i alle størrelser. Uten hinting kan 16 px gjerne se perfekt ut, mens 17 px blir et kaos av forskjellige stammetykkelser og x-høyder. Du får tilgi meg om alt dette er håpløst åpenbart. </p>
      <p>Skriften i din mockup er jo faktisk også en tolkning fra kurver til piksler (rendering) og følger på ingen måte de originale formene til Helvetica.</p>
