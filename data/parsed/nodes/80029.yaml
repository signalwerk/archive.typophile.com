      <blockquote><p>On screen at small sizes type can not look exactly like it's printed counterpart. The resolution is nowhere near even the worst print conditions. Hence hinting.</p></blockquote>
      <p>No, hence sub-pixel rendering to make up for the lost resolution. Hinting is about added readability. Sure, the problem is basically the same, but the difference is that hinting is about adding or subtracting form (via controlling interpolated areas), sub-pixel rendering is about interpolating all data. Hinting destroys the type entirely. Sub-pixel rendering (done right) is basically proper AA.</p>
      <p>Please read my posts. I am not after readability, the text is clear as day. I want the type on the site to be closer to the original type. Hinting does not do that, it decays it further, for crying out loud, with hinting it's not even remotely readable.</p>
      <blockquote><p>If your 16px type looks swell and fine hintless, what happens when I come marching with my enlarged text settings, or pinch zoom my touchscreen?</p></blockquote>
      <p>It will use a larger type and look even better?</p>
      <p>Also, iOS and other devices typically use other formats, haven't looked into that yet, but I'm generally not too worried about Apple devices. Android might be another story. Then again, if we are to include hand held devices, the site would be better off with an own simple version. After all, it's just a site for publishing essays.</p>
