      <p>Ingen blir sure om vi snakker norsk?</p>
      <p>ClearType er det samme på XP, Vista og Win7, og det er i ClearType problemet ligger. Hadde det ikke vært for ClearType hadde alt sett perfekt ut uten hinting. Saken er uansett den at siden ser nesten perfekt ut slik som det ligger an nå, på XP/Vista/Win7, uten hinting, det mangler bare noen pixler her og der. Mangel på hinting er absolutt ikke «håpløst», det er nettopp hinting i seg selv som er håpløst. Hadde dette vært en tynn type som hadde tynnere kropp enn et bildepunkt, så hadde saken vært en annen (om vedkommende som hadde laget hintingdataene hadde kunnet jobben sin), men det er snakk om tykke typer; det eneste som skjer er at formene blir ødelagt og teksten blir ulesbar.</p>
      <p>Jeg kan ta noen grabs neste gang vi jobber på siden (i helga, antageligvis), så blir det lettere å forstå hvorfor hinting er helt utelukket i dette tilfellet (hvis ikke TrueType-versjonen har ekstremt god data, som nevnt).</p>
      <p>Angående on-the-fly konvertering til bilder, så har jeg tenkt tanken, men jeg er usikker på om kompisen min har noen erfaring med det, hvor mye ekstraarbeid det innebærer, og om det kan implementeres lett i back-end. Jeg prøver å holde prosjektet så lite som mulig foreløpig, siden han gjør det pro bono.</p>
      <p>Har du noen erfaring med slik kode?</p>
