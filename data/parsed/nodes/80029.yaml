      <blockquote><p>You're not using PFB files as web fonts, are you? (I'm not even sure if that's possible at all)</p></blockquote>
      <p>No, they're the source. They're converted to TrueType.</p>
      <blockquote><p>Font format and line spacing are related. The vertical metrics are defined differently in Type1 fonts (PFB) and OpenType fonts. I would try to use the OpenType/TTF versions of Nimbus Sans, which I believe is available in the file urwfonts-1.41.tar.bz2 from this page: <a href="http://www.artifex.com/downloads/" title="http://www.artifex.com/downloads/">http://www.artifex.com/downloads/</a></p></blockquote>
      <p>Right, that's what I figured. I'm not sure I understand where you are going with your suggestion, though. On the actual web page, I'm forced to use TrueType. Going back to the mock-up now would be rather backwards. Right now I'm forced to go where the code lets me. I just mentioned this because I'm curious (so, thanks for the information!).</p>
      <blockquote><p>Additionally the vertical metrics in web fonts need to be set in a certain way to avoid line-spacing differences between browsers. Here's a discussion related to that: <a href="http://www.typophile.com/node/78279" title="http://www.typophile.com/node/78279">http://www.typophile.com/node/78279</a></p></blockquote>
      <p>I know, that's all sorted (they're set the same). I have no issues with that.</p>
      <blockquote><p>You can try the fonts in-browser here. Make sure to check Win XP with standard rendering before you make up your mind. It's the lowest common denominator, and still very widespread.</p></blockquote>
      <p>I have code up and running. I'm not sure how this will help (unless there are other Helvetica clones there that look as good as Nimbus Sans and renders differently without hinting at 12 px size).</p>
      <blockquote><p>Your first post is very confusing. I think you might've misunderstood what hinting is and can do.</p></blockquote>
      <p>I'm pretty confident I haven't, and it would help if you pointed out what was confusing about the post. It was made before I read up on things, by the way, I was just assuming things. There is no need for explanation of the technicalities right now, really.</p>
      <p>The situation right now is that I've used PFB files, converted them to TrueType for web use. I've removed hinting and kerning information via the converter (which probably weren't there in the first place, as PFB doesn't contain this information, as far as I know), and I've basically settled for using a size 13 version of the font, because that's the only size that looks OK with the Windows sub-pixel rendering engine (ClearType). The only real issue is that some of the capital letters are missing a few pixels. I think I can live with that.</p>
      <p>If only MS could make their Windows sub-pixel rendering work like in every other OS, this wouldn't have been a problem at all, and we could have had pretty much perfect rendering of all fonts. I haven't seen any case of hinting that made any font look better. As far as I'm concerned, hinting is completely useless for web (unless it's in combination with the so-called web safe fonts).</p>
