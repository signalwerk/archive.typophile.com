      <p>I appreciate the suggestion, but I've already tried Arimo, and quite frankly, it didn't look much like Helvetica. Using Arial or anything that might bear a slight semblance to Helvetica will not work either, as the whole design is based off both the shapes and sizes of Helvetica.</p>
      <p>Thanks a lot for the "free" Nimbus Sans link, though, I'm currently testing it right now, and I've run into another problem. Namely ClearType.</p>
      <p>The font looks perfect in Linux, but in both Win7 and WinXP, ClearType botches up the AA something fierce at under 13 px size (at 13 and over it looks fine, but not perfect). </p>
      <p>After I was able to remove hinting and kerning, it does look a lot better, though, on both Linux and Win7/WinXP. I haven't been able to test OSX, yet, but I trust the sub-pixel rendering solution Apple has chosen is superior to ClearType (as they don't historically haven't ignored how type looks).</p>
      <p>As it is quite late here, I can't continue with my experiments, but I am currently looking at trying to re-enabling kerning to get rid of the AA bugs. I will update tomorrow with results.</p>
      <p>Also, line spacing seems completely different from Adobe Helvetica LT Bold to Nimbus Sans Bold, but that might be related to formats (used OpenType for the former and PFB for the latter). The fonts place themselves differently in text boxes, and there is differences in values between the lines that I can't seem to match. This won't be a huge issue, though; it just annoys me.</p>
