      <p>Your first post is very confusing. I think you might've misunderstood what hinting is and can do. Hinting Give "hints" to the rendering engine (in the browser or in the OS, depending on setup) about how the curves should be translated to pixels at low resolution. In the standard rendering mode which is default in Win XP the engine make use of different shades of grey. At small sizes, many <em>font files</em> override this use of greys to produce sharper text with b/w rendering only. These settings are default in Fontlab. If the fonts aren't hinted, they'll most probably look like shit under these conditions. Only very few fonts hold up very well: the web safe fonts. It takes months, maybe even years, to produce hinting like that of Verdana and Georgia.</p>
      <p>I'm far from an exert on these matters, so please correct me if I'm wrong.</p>
