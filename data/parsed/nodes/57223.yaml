  html: |-
    <p>Hi all</p>
    <p>I'm looking for a simple way to generate the Accents glyphs with a Robofab/Python script. From the Robofab documentation it looks like generateGlyph should do the trick.</p>
    <p><code><br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    glyphs = ['ccaron','amacron','Cacute','Cdotaccent','Abreve','cdotaccent','ccircumflex','Aogonek','abreve','cacute','Ccaron','Amacron','aogonek','Ccircumflex']</code></p>
    <p>for glyph in glyphs:<br>
    	nglyph = f.generateGlyph(glyph)<br>
    	nglyph.autoUnicodes()<br>
    	nglyph.mark = 10<br>
    #<br>
    f.update()</p>
    <p></p>
    <p>This works fine for generating the glyphs and adding the base glyphs but doesn't add the accent. Is it possible to add the accent with Robofab so the code would work like - Glyph &gt; Generate Gkyohs in FontLab.</p>
    <p>Rr</p>
