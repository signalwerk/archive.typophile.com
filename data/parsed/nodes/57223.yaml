    html: |-
      <p>Hi,</p>
      <p>You can try with this:<br>
      <code><br>
      ----------------------------------------------------<br>
      from robofab.world import CurrentFont<br>
      from robofab.tools.accentBuilder import AccentTools</code></p>
      <p>font = CurrentFont()</p>
      <p>accents = ['ccaron','amacron','Cacute','Cdotaccent','Abreve','cdotaccent']<br>
      accentTool = AccentTools(font, accents)</p>
      <p>accentTool.buildAnchors(ucXOffset=30, ucYOffset=70, lcXOffset=20, lcYOffset=50, doProgress=True)</p>
      <p>accentTool.printAnchorErrors()<br>
      accentTool.buildAccents(doProgress=True)<br>
      accentTool.printAccentErrors()<br>
      font.autoUnicodes()</p>
      <p>#font.update()<br>
      # This glyph update isn't the best way, but it works...<br>
      for glyph in font:<br>
      		glyph.update()<br>
      ----------------------------------------------------<br>
      <code></code></p>
