    <p>I’m working on a typeface titled New Constructivist. The design was inspired by a logo I designed for an exhibit of Malevich’s work, which I built around his notion that the square could be the basic building block of non-objective art. My goal with New Constructivist is to create an original font using Malevich’s ideas rather than creating a revival of old Cyrillic designs. If you want to compare my font with existing fonts my letters are most similar to <cite>P22 Constructivist Square</cite>, but designed as new Latin letters with no attempt to get a Cyrillic feel or to mimic any specific existing design. Eventually I plan to expand this to a three weight set; Light, Normal, and Black; depending on what I do with black a bold may appear as well.</p>
    <p>v 0.1 - All letters, numbers, and some punctuation of the normal weight are drawn. Almost no spacing tweaks or metrics are implemented.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/rasterspec_4890.0.1.png"></div><p></p>
