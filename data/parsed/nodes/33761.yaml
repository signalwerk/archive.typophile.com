      <p>Hey, James.</p>
      <p><em>What do you mean by a crossbar?</em></p>
      <p>The horizontal line in the letter H, for example. So I'm suggesting that you work in a horizontal line into those other letters, K, X and Y -- to give them a boxier look, I suppose. Of course, that may make them hard to tell from other letters, so you have to tread carefully. But maybe the tapering will keep that from happening.</p>
      <p>Oh, and I'm sorry to hear about your laptop. :-(</p>
      <p><em>I’m tempted to redraw the W and the M a strokewidth or two wider to make the interiors work a little better.</em></p>
      <p>I think that's a great idea. As Stephen and Tiffany said earlier, departing from the grid can be good.  :-)</p>
