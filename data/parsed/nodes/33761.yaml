    html: <p>Width is something I have been dealing with a lot on this one. I started trying to build all of the letters within a square, but ended up with the old Pac-Man arcade lettering. At that point I started over by building on a grid of squares and narrowing some of the letters that I did not feel needed to be especially wide. These letters are recreations of another update that I did by hand; now I am finding that what made sense in pencil does not work so well in Postscript.</p>
