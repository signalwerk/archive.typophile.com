    html: <p>I assume the width variations (narrow R,E,U, wide G,N,S) are intended to reflect your source, but remember that they will make the typeface less useful in the end. I would try to normalize these types of idiosyncrasies where possible. But avoid coming too close to <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/itc_stenberg/" rel="nofollow">ITC Stenberg</a>.</p>
