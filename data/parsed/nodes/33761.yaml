    html: |-
      <p>VERY nice improvements.</p>
      <p>"X" and "Y" don't look like they'd be of the same style. "X" also has weight problems. It looks too thin to me. Similar style problems are with "M" and "N" but maybe any change make them less readable. I only want you to reconsider the shapes of these.</p>
      <p>Definitely change "K" because right now you have a vertically mirrored letter and it looks very strange and unstable. Try designing it with horizontal bar in the middle (see Eurostile's "K" for reference). This will make it look more of the same style. And leg will have to go a bit more to the right to stabilize the letter.</p>
      <p>I like very much what you did to "D" and "W". Did you also try to change the "M" a bit.</p>
      <p>I know you're trying to distinguish between "O" and "0" (zero), but maybe the difference is too huge, because zero looks much narrower compared to other numbers.</p>
      <p>Try to change "C" and "G" to be similar to "D" (slanted lines)</p>
      <p>Tapers work very nice. Keep on. It's going on very nice.</p>
