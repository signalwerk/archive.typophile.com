      <p>As I’m sure some of you heard at Typecon, I lost a lot of the files for this one when my laptop was stolen due to not backing up properly—that’s what I get for not double-checking the tarballs! Fortunately I was able to get just about everything back by extracting the embedded font from the PDF specimens I had floating around, and I’ve been making a lot of little tweaks this week to the letters and numbers, I plan to rework the punctuation next. </p>
      <p>Right now I’m still having a lot of trouble with X, Y, D and G. I am also removing about removing all of the tapers, as I feel that they clas with the constructivist ideas behind the design.</p>
