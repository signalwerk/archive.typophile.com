      <p></p><div class="imageWrap"><img src="http://typophile.com/files/beta2_6296.png"></div><br>
      The latest version has been added as a PDF to the original post.<p></p>
      <p>I have made the widths wider overall, and everything is much more consistent in terms of size. At this point I am starting to integrate tapers into the letterforms to give the whole thing a personality that’s a little more contemporary, although that may get ditched if things start getting too humanist.</p>
      <p>I am also thinking about creating a slightly rounded set in the vein of old woodblock letters that were designed to be worn down without losing their basic look. Any suggestions would be appreciated.</p>
