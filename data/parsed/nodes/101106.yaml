    <p></p><div class="imageWrap"><img src="http://typophile.com/files/11_5258.png"></div><p></p>
    <p>Anyone have any ideas? I ran this sample through a couple of other font ID sites with no matches yet.</p>
    <p>The story behind this font, in case it helps in any way:</p>
    <p>My boss had me redo a set of business cards for a number of new recruits, but he doesn't have the originals, so I'm tasked with recreating them from scratch.  I scanned his card in and re-arranged the numbers so as to not reveal addresses/phone numbers.</p>
    <p>The curious thing is that all the alphabetical letters were done in Century Gothic, but the numbers were done in this unknown font, and thus I only have the numbers as a sample.</p>
    <p>The closest match I've found so far is Courier, but differences are still there.</p>
    <p>Any insights are much appreciated!</p>
    <p>Thank you in advance,<br>
    Ryan</p>
