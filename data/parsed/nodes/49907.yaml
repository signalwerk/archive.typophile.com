  html: <p>After much travel ( St. Petersburg AtypI ) I am finally in Reading at Oaklands with glorious sunshine. I expect to see Julia &amp; Antonio here tonight. I stayed with the very generous Jon Pinhorn last night. It was great getting to make friends with the departing Students, and gleaning a bit of wisdom from them. And now I know where the glass recycling goes. Now, to find out where the laundry is...</p>
