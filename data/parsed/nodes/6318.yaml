    <p>I was looking through  <br>&lt;a href="<a href="http://www.lanstontype.com" target="_blank" class="link-external">http://www.lanstontype.com</a>"&gt; Giampa &amp; Lanston Type &lt;/a&gt; and came across this page - <a href="http://www.lanstontype.com/WaterGarden.html" target="_blank" class="link-external">http://www.lanstontype.com/WaterGarden.html</a> . <br> <br>It says  <br> <br>"<i> The display shown on the right is using the multiple colour fonts. There is a single colour and other version of this font. <br> <br>Colours are to be determined by the designer.</i>" <br> <br>How do multiple color fonts work? <br> <br>smc <br> <br> <br></p>
