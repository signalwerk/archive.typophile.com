    html: <p>Usually it's just the same font, but with different parts located in different font files. So you might have one font that serves as the background color (looks normal), then another font that makes an inline color (just looks like a bunch of partial flimsy letters). Layer them exactly on top of each other, pick your colors for each layer, and veeeooolla. <br> <br>Alan</p>
