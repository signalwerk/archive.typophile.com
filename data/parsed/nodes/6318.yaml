    <p>I was looking through  <br>&lt;a href="<a href="http://www.lanstontype.com" target="_blank">http://www.lanstontype.com</a>"&gt; Giampa &amp; Lanston Type &lt;/a&gt; and came across this page - <a href="http://www.lanstontype.com/WaterGarden.html" target="_blank">http://www.lanstontype.com/WaterGarden.html</a> . <br> <br>It says  <br> <br>"<i> The display shown on the right is using the multiple colour fonts. There is a single colour and other version of this font. <br> <br>Colours are to be determined by the designer.</i>" <br> <br>How do multiple color fonts work? <br> <br>smc <br> <br> <br></p>
    <div class="forum-topic-navigation clear-block"><a href="/node/3882" class="topic-previous" title="Go to previous forum topic">‹ Euro Symbol Problems</a> <a href="/node/6278" class="topic-next" title="Go to next forum topic">Mac OS X Kerning with Fontlab 4.5 ›</a></div>
