    html: <p>OpenType features do not depend on Unicode. In FontLab (and the AFDKO), feature code is based on glyph names. (I'm sure this is true in VOLT, too, but I've never used it.) Ultimately, in the actual font, after it's been compiled, it's based on the glyph index. If we couldn't reference unencoded glyphs in OT code, we'd be in big trouble.</p>
