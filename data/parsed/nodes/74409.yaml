    html: |-
      <p><cite> Must I include some OT instruction to say that uni0195 is the lowercase for uni01F6? Or this is known by client application due to its Unicode support?</cite></p>
      <p>Yes -- I mean, yes, the client application has to know what's what. InDesign, for example, got updated to the most recent Unicode tables somewhere between CS and CS4. In the older version, using a trick like "All Caps" (as text attribute) or "Change case to Uppercase" didn't work for all characters one would expect. In CS4, at least, it does.</p>
      <p><cite>A side question: if the relationship between upper and lowercase is informed by Unicode, how to handle pairs of glyphs with no codepoint? Say, Gtilde and gtilde or Eacutedotbelow and eacutedotbelow. As they are out of Unicode specification, will the client program or OS understand their upper/lowercase relation?</cite></p>
      <p>Nope. If you go over a glyph list in Unicode order, you will see there is no apparent relation between the Unicodes for lowercase and uppercase. As an aside, since these values are defined in the Unicode table, un-encoded (private) characters can not have such a relation with each other, per definition.</p>
      <p>I <em>think</em> "All Caps" (the text attribute) may be using a 'case' Opentype table when present, because it also converts regular accents to 'uppercase' accents, which are definitely *not* in the Unicode list. </p>
      <p>.. Okay, just tested it with Minion Pro: the acute accent gets translated to an uppercase variant when using "All Caps" (the 'case' case), but not when using a manual "Change to Uppercase".</p>
