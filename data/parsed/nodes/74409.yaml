    date_raw: 21 September 2010 - 10:56pm
    votes: 0
    html: <p>Well, the <code>case</code> feature is intended for something called "case-sensitive forms". The most common use is for punctuation (such as hyphens and bullets), which is normally centered on the x-height. When the <code>case</code> feature is enabled, such as when "change case to all caps" is invoked, then the punctuation is centered on the caps instead (usually using glyph substitution). It certainly seems possible to use this to cause unencoded lowercase glyphs to be substituted with unencoded uppercase glyphs, but you may need to educate users to select "change case to all caps" for the proper result. Some common contexts (such as the caps-lock key and the shift key) will not, unfortunately, invoke the <code>case</code> feature.</p>
