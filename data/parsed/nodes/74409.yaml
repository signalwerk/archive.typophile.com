  html: |-
    <p>There is no need to include in a font any instruction about upper and lowercase for the usual A–Z/a–z characters.</p>
    <p>But what about these uncommon glyphs for African languages, phonetic support and transliterations? Must I include some OT instruction to say that uni0195 is the lowercase for uni01F6? Or this is known by client application due to its Unicode support?</p>
    <p><em>A side question:</em> if the relationship between upper and lowercase is informed by Unicode, how to handle pairs of glyphs with no codepoint? Say, Gtilde and gtilde or Eacutedotbelow and eacutedotbelow. As they are out of Unicode specification, will the client program or OS understand their upper/lowercase relation?</p>
    <p>This question <strong>does not</strong> refers to small caps/all caps/petite caps control. I know these are handled by <code>smcp</code>, <code>case</code>, <code>c2sc</code> and <code>pcap</code> features (or, to petite caps, a Stylistic Set as they are still not widely supported).</p>
