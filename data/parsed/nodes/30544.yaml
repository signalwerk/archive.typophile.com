      <p>The tight kerning is making a light patch out of the CAL of NORCAL, have you tried adding a stroke to the platinum to see if that helps you increase the weight (a method that doesn’t always work on lighter weights), if it doesn’t lead anywhere you might consider just having the mark on the contact side. Your spot UV seems to be gradated, I’ve never done this but it seems to me that it won’t work as a gradation, perhaps you have seen this, if not I would ask your printer if it seems workable.</p>
