      <p>tim, what do you mean by a light patch? Also I thought just adding a stroke to the letters to give them more weight would detract from their form?</p>
      <p>There’s no gradiation for the Spot UV but i might keep the ghost there as Kco sugguested.</p>
      <p>I agree there are a lot of setbacks to black cards, especially how easily they get dirty, But I want my identity to feel a bit edgy with a marked distinction. I think that the thick GSM, narrow cards, opposite rounded corners, UV/Matte combo and black stock works well for that.</p>
      <p>I have been collecting well printed material and I love black book covers like “The Elements of Typographic Style” and I love the 7 Diamonds black clothing labels (this is almost the exact matte/smooth feel with UV that I am looking for).</p>
      <p>Gradients and web 2.0 are definately not my goal, though it is a shame how much gets lumped into web 2.0 category, “To define is to limit” as says Oscar Wilde. I think there is a place for gradients and rounded corners and rounded type, etc. in graphic design if used well. I am more a fan of bauhaus design myself so i tend to use gradients more sparingly.</p>
