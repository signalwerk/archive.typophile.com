      <p>&gt; coating<br>
      Matte laminate, discuss it with your printer, some stocks are less receptive than others.</p>
      <p>&gt;adding a stroke<br>
      It can be “bad”, however well handled it can work, at least it can give you a guide to work to. In this case you are not trying to design a font but letter a logo, a subtle difference, which really means that you only have to work up a limited number of characters and that those characters are only going to interact with those on either side of it. However, if you are unconfident it might be best to enlarge the characters in proportion to the mark.</p>
      <p>My taste would be to drop the services and UV the logotype, restrained use makes it more “special”.</p>
      <p>As for the monitor I am Mac-biased, (having only rarely used pcs and generally concentrating on the different software and OS) so I am probably not the best person to give a recommendation, I do prefer my work Diamondtron to my powerbook but with different sizes and requirements it is not a fair comparison.</p>
      <p>Tim</p>
    html_clean: |-
      <p>&gt; coating<br>
      Matte laminate, discuss it with your printer, some stocks are less receptive than others.</p>
      <p>&gt;adding a stroke<br>
      It can be “bad”, however well handled it can work, at least it can give you a guide to work to. In this case you are not trying to design a font but letter a logo, a subtle difference, which really means that you only have to work up a limited number of characters and that those characters are only going to interact with those on either side of it. However, if you are unconfident it might be best to enlarge the characters in proportion to the mark.</p>
      <p>My taste would be to drop the services and UV the logotype, restrained use makes it more “special”.</p>
      <p>As for the monitor I am Mac-biased, (having only rarely used pcs and generally concentrating on the different software and OS) so I am probably not the best person to give a recommendation, I do prefer my work Diamondtron to my powerbook but with different sizes and requirements it is not a fair comparison.</p>
      <p>Tim</p>
