      <p>Even if the type is to be spot varnish I would still keep a ghost around the letter shapes of your mark as it could affect readability of it.</p>
      <p>I’m not a big fan of black, it looks dirty around white type to me and it’s overpowering. Your brand needs to stand out more than the background color of it. Color is a very important thing in branding but the relation of logo and branding has to work together as one and to me now it’s breaking it apart.</p>
      <p>Those changes in shapes on your corners reminds me of such bad reviews the first redesign of Quark’s logo got. That shape is an on-going trend that I believe comes from that “web 2.0” look of making everything with round corners and  gradients. Be very careful if this is not your goal.</p>
      <p>Here’s a sample of business card I go. It’s not of my personal taste, to me the black background in this case, makes the color more important than the actual content of the card. Some may disagree but I just post it so you can see what a black BC looks like.</p>
      <p></p><div class="imageWrap"><img src="/files/felt_bc_5304.jpg"></div><p></p>
      <p>For different business card sizes also read this:<br>
      <a href="http://typophile.com/node/21340" title="http://typophile.com/node/21340">http://typophile.com/node/21340</a></p>
      <p>Just my two cents.</p>
      <p>Kco</p>
