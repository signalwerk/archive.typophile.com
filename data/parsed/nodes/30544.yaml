    <p>I desperately need a new identity for myself, so i made this real quick. Any thoughts or sugguestions before I goto print?</p>
    <p>*The cards are a bit thinner than most business cards to give a high end feel and so it is easier to put in wallets.<br>
    *I am planning on using an extremely thick gsm and want a really smooth mate card. Any sugguestions?<br>
    *All the type on the contact side of the card in the background will be UV coated.</p>
    <p></p><div class="imageWrap"><img src="/files/norcal_buisCard_5949.jpg"></div><p></p>
