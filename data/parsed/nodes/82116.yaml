    <p><strong>The international experience will inform the participants about type design and typography and about Dutch design in general.</strong></p>
    <p>The V I D E Summer Design Experience 2011 (15.08 until 28.08) will be prepared with the greatest care and will be guided by Donald Roos, graphic- and type designer from Amsterdam in cooperation with his colleague Jacques Le Bailly. They both studied graphic design at the Royal Academy of Art in The Hague. Donald teached at art academies in Rotterdam, The Hague and Tilburg and Jacques teached at the art academy in Rotterdam and was recently lecturer in Breda.</p>
    <p>Several designers are invited to give short workshops and presentations during the VIDE Summer Design Experiences 2011. Also city-design-trips will be part of the two weeks Experience.</p>
    <p><strong>First week: 15.08 until 21.08</strong></p>
    <p><em>Monday 15 August</em><br>
    – Welcome to all the participants at The VIDE' Workshop in The Hague<br>
    – Typographic walk through the city center of The Hague<br>
    – Presentation of a invited type designer/typographer<br>
    – Evening movie program (type, type, type!)</p>
    <p><em>Tuesday 16 August</em><br>
    – Trip to Amsterdam: Visiting several design studios<br>
    – Amsterdam Evening Program</p>
    <p><em>Wednesday 17 August </em><br>
    – Type workshop in cooperation with a visiting type designer<br>
    – Evening program</p>
    <p><em>Thursday 18 August </em><br>
    – Trip to Rotterdam: Visiting several design studios<br>
    – Rotterdam Evening Program</p>
    <p><em>Friday 19 August </em><br>
    – Typography workshop and presentation </p>
    <p><em>Saturday 20 August </em><br>
    TeaTypeParty</p>
    <p><em>Sunday 21 August </em><br>
    Free program</p>
    <p><strong>Second week: 22.08 until 28-08</strong><br>
    <em>Monday 22 August </em><br>
    – Workshop and presentation by a visiting type designer<br>
    – Evening programme offered by a The Hague design studio</p>
    <p><em>Tuesday 23 August</em><br>
    – Visiting The Hague<br>
    – Visiting several design studios and the Municipal Museum<br>
    – Cultural evening program</p>
    <p><em>Wednesday 24 August</em><br>
    – Presentation by several type designers<br>
    – Type &amp; Typography related talks and discussions<br>
    – Information about the Type&amp;Media course at the Royal Academy of Art in The Hague<br>
    – Diner with several invited designers</p>
    <p><em>Thursday 25 August</em><br>
    – Continuation of the Monday workshop<br>
    – Free night</p>
    <p><em>Friday 26 August </em><br>
    – Free morning program<br>
    – Trip to Delft: Visiting design studios<br>
    – Reception in The Hague</p>
    <p><em>Saturday 27 August</em><br>
    – Special Program<br>
    – Debriefing</p>
    <p><em>Sunday 28 August</em><br>
    – Farwell program: presentation of the Experience assignments<br>
    – Party with invited friends of VIDE and designers which were involved during this Experience </p>
    <p>An option is a third week (as from 29.08 until 03.09) with a visit to Berlin, Germany. The extra costs are 900 euro. The trip to Berlin by train and the hotel costs in Berlin are included.</p>
    <p>The fee of this 2 weeks Summer Design Experience will be 1.800 euro's. The fee includes hotel costs in The Hague throughout the Experience period, travelling expenses, the famous VIDE lunch, coffee, tea and soft drinks provided in the VIDE Workshop, as well as the Experience reader.</p>
    <p><strong>Discounts</strong></p>
    <li>5% (90 euro!) if you bring your own laptop</li>
    <li>5% if you are part of a group of at least 3 participants</li>
    <li>5% if you register before 1 June 2011</li>
    <p>There is a special fee for participants from developing countries.</p>
    <p>If you want to register, please send an email to <a href="mailto:info@viavide.com">info@viavide.com</a>!</p>
    <ul><strong>The VIDE Workshop</strong> in the city center of The Hague, Holland, is the home of VIDE, Visual &amp; Individual Design Experiences. VIDE organises all kind of activities in visual communication: workshops, exhibitions, debates, researches, etc. The Workshop is located near the trainstations The Hague Holland Spoor and Station The Hague Central.
    <p>For more information, you can call or mail The VIDE Workshop <strong>Anno Fekkes</strong>:<br>
    (+31) 651 525 046<br>
    <a href="mailto:info@viavide.com">info@viavide.com</a><br>
    <a href="http://www.viavide.com" title="www.viavide.com">www.viavide.com</a></p>
    <p><strong>Anno Fekkes</strong><br>
    Founder and owner of VIDE and The VIDE Workshop, worked 24 years as a lecturer at the Royal Academy of Art in The Hague and at the Fontys Academy of Fine Art and Education in Tilburg. As from 1994 until 2005 he was head of the department Graphic and Typographic Design/Visual Communication in The Hague. He was organiser of the international 1996 ATypI conference. Together with Jan Willem Stas he was responsible for the success of the international orientated master course Type&amp;Media. As from 2006 Anno established a new curriculum for the department Visual Communication in Tilburg. As coordinator at the Fontys Academy of Fine Arts and Education, Anno was awarded with the HBO Innovation Prize 2009.</p>
    <p><strong>Donald Roos</strong> <a href="http://www.vetteletters.nl" title="www.vetteletters.nl">www.vetteletters.nl</a><br>
    Donald Roos (Haarlem, the Netherlands, 1978) studied Graphic &amp; Typographic Design at the Royal Academy of Fine Arts in The Hague. After graduation, he went on to study Culture &amp; Media for a couple years at the University of Amsterdam. He worked as a designer at design studio Buro Petr van Blokland and he freelanced for several studios in Amsterdam.<br>
    In 2008, he started up his own studio Bureau.Donald, based in Amsterdam. Donald’s work varies from visual and interactive designs for complex websites to animations for music videos. His passion for letters and typography always shines through in his design work.<br>
    As a typographic entrepreneur, he also initiates his own projects: he runs an alternative font foundry called VetteLetters, he devised the typography portal Typebase.com and, with his brother Benz (a lighting designer) he has a blog called RoosBros. He also co-founded Triqle, a software company which developes a tool for digital program information.</p>
    <p>Donald has been a teacher with several academies; the Willem de Kooning Academy, Rotterdam College and Fontys College. He currently teaches font design at the Royal Academy of Fine Arts in The Hague. He teaches workshops in the area of font design and design for digital media at VIDE.</p>
    <p><strong>Jacques Le Bailly</strong> <a href="http://www.baronvonfonthausen.com" title="www.baronvonfonthausen.com">www.baronvonfonthausen.com</a><br>
    Jacques Le Bailly (Thionville, France, 1975 ) studied Graphic &amp; Typographic Design at the Royal Academy of Fine Arts in The Hague. During and after his study he was a freelance typedesigner for Linotype Library, working on several projects like Syntax Next and the implementation and design of the eurosign in more than 300 fonts. After graduation in 1999, he lived four years in Berlin (Germany), working as a graphic designer and freelance typedesigner. </p>
    <p>In 2003, he moved back to the Netherlands, were he worked for The Enschedé Type Foundry as typedesigner and for several design agencies as (senior) graphic designer. He continued doing freelance projects allongside for several different type libraries.</p>
    <p>At the end of 2009, he started his studio Baron von Fonthausen in The Hague. His hunger for type and typography is leading in all his design work, which varies from bookmaking and corporate design to typedesign and (illustrative) handlettering. This also includes problem solving and context oriented alterations to fonts.</p>
    <p>His first published commercial typeface (NeueSardines, the largest monospace and monoheight font familyof the world) was issued by VetteLetters type foundry and at the moment he is working on two large font families, which will be issued by Bold monday type foundry. He is a very meticulous designer.</p>
    <p>Jacques has been a typography teacher at two art academies for several years; the Willem de Kooning Academy, Rotterdam and the Sint Joost Art Academy, Den Bosch.
    </p></ul>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/VIDE_SummerExperience11_flyer_0_4296.51.jpg"></div><p></p>
