      <p>Contracts are a great idea, especially for large jobs, but like 5star said litigation can indeed be expensive (unless it's a small amount suitable for small claims court).</p>
      <p>With new clients I usually write a letter of agreement that spells out what services I'll provide, what the anticipated charges are, the rough timeline, etc., and ask for their signature. Usually that prevents misunderstandings later on.</p>
