    <p>Hi gang. I'm coproducing an workshop THIS Saturday with designer-turned-lawyer Jonathan Tobin that I think would be of interest to some of you (if you're in Los Angeles). </p>
    <p>CONTRACTS FOR CREATIVE PROFESSIONALS<br>
    Saturday, June 15, 2013<br>
    9:00 AM to 1:00 PM<br>
    The Hub Los Angeles<br>
    830 Traction Ave. #3A<br>
    Los Angeles, CA 90013<br>
    <a href="http://contractsforcreativeprofessionals.eventbrite.com/" title="http://contractsforcreativeprofessionals.eventbrite.com/">http://contractsforcreativeprofessionals.eventbrite.com/</a></p>
    <p>Contracts mystify many creative professionals, yet they are the lifeblood of the trade. In this workshop, geared towards freelance creatives and small agencies, we will work together to understand contracts and see how they can be used as a tool to do better work, make more money and keep clients happy. </p>
    <p>This workshop will teach the basics of how contracts work, how to approach contract negotiation as a collaborative process, explain important and common contract clauses and offer guidance on when and how to seek help drafting or enforcing contracts. </p>
    <p>Here is what you will learn, at the very least: </p>
    <p>• What a contract is and how it is formed.<br>
    • How contracts are structured.<br>
    • Common contract clauses.<br>
    • Typical issues in creative contracts.<br>
    • How to approach contracts with your clients in a non-adverserial way.<br>
    • Using online signing services to make the process painless.<br>
    • How to find and adapt basic contracts.<br>
    • How to enforce contracts.<br>
    • How to work with an attorney to draft, modify and enforce contracts. </p>
    <p>Since this is an early "beta" of what we hope will become a valuable, repeatable event for the creative community, participation in this first workshop will be limited to just 10 people and cost only $89. </p>
    <p>ABOUT THE ORGANIZERS </p>
    <p>Jonathan Tobin is a California attorney and worked as a graphic designer and web developer for over a decade. He helps creators, makers and innovators use the law to become more successful. </p>
    <p>Spencer Cross is an LA-based designer and artist. He is an evangelist for the LA design community and works to foster community and camaraderie among LA-area creative professionals by coordinating a variety of social and educational events and discussion forums.</p>
