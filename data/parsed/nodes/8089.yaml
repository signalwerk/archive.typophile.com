    html: <p>The overall squarness of the letters makes them very nice to read on the screen. I suspect that it will very very useful for low resolution printers as well.  <br> <br>I'm not sure that the bowls on the b d h look well with the other curved letters like e and c. For example the d and b look heavy next to the e and c. Also the k does not fit in well with the others. On the v - z line each letter has very different colour from each other.</p>
    html_clean: <p>The overall squarness of the letters makes them very nice to read on the screen. I suspect that it will very very useful for low resolution printers as well.  <br> <br>I'm not sure that the bowls on the b d h look well with the other curved letters like e and c. For example the d and b look heavy next to the e and c. Also the k does not fit in well with the others. On the v - z line each letter has very different colour from each other.</p>
  - id: 54332
