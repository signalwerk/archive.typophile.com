    html: <p>Good work. <br> <br>To me the counter of the "e" is too small, in other words the top of the "e" looks too heavy in comparision with the other letters. I agree with HHP about the "r" and the "s". I would add a bit of colour to the "x" making its secondary strokes thinner.</p>
