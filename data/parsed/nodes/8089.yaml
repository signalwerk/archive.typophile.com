    date: 2004-12-21T10:15:00
    date_raw: 21 Dec 2004 — 10:15am
    votes: null
    html: "<p>Quite nice, Eduardo. <br> <br>I would make the descenders slightly shorter. <br>The main glyph issue I see is the \"k\": it's a bit too mannered. On the other hand, the unusual lightness of the upper arm is a readability advantage. <br> <br>Also, I would make the beak of the \"r\" much stronger and more in character, the \"s\" narrower, and give the \"x\" more character. <br> <br>Spacing: nice and tight, just a bit uneven. The blank space should be smaller though. <br> <br>hhp</p>"
    html_clean: "<p>Quite nice, Eduardo. <br> <br>I would make the descenders slightly shorter. <br>The main glyph issue I see is the \"k\": it's a bit too mannered. On the other hand, the unusual lightness of the upper arm is a readability advantage. <br> <br>Also, I would make the beak of the \"r\" much stronger and more in character, the \"s\" narrower, and give the \"x\" more character. <br> <br>Spacing: nice and tight, just a bit uneven. The blank space should be smaller though. <br> <br>hhp</p>"
