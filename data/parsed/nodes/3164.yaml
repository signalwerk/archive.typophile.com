    html: <p>It has been available through <a href="http://www.bertholdtypes.com/home.html" target="_blank"> Berthold</a> (BQ stands for  <br>Berthold Quality, the "brand name" under which Berthold  <br>released their own digitized versions of their fonts in  <br>the mid-nineties) but though the collection <a href="http://www.bertholdtypes.com/bq_library/BQ_library.html" target="_blank"> still exists</a>  <br>Optima BQ isn't included not anymore.</p>
    html_clean: <p>It has been available through <a href="http://www.bertholdtypes.com/home.html" target="_blank" class="link-external"> Berthold</a> (BQ stands for  <br>Berthold Quality, the "brand name" under which Berthold  <br>released their own digitized versions of their fonts in  <br>the mid-nineties) but though the collection <a href="http://www.bertholdtypes.com/bq_library/BQ_library.html" target="_blank" class="link-external"> still exists</a>  <br>Optima BQ isn't included not anymore.</p>
