  html: <p>Hello, <br>I am searching for a font named Optima BQ in its original form. At AGFA Monotype  oder ITC I found various fonts like Optima LT, Optima Medium etc. but not a font BQ. <br>Can everybody help me where I can get it. <br>Thanks. <br>Greatings Mickey</p>
