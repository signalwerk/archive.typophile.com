    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Umbrella</strong></p>
    <p>Umbrella is a compilation of exclusive and non-exclusive typefaces hand-picked from small foundries and independent designers around the world by <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>. The collection features designs by talented yet relatively unknown typographers, as well as typefaces by graphic designers better known for their other creative work. One of the strengths of Umbrella is Veer's ability to bring these deserving faces to a very wide audience, both through promotion in Veer catalogs and availability from the Veer web site.</p>
    <p><a href="http://www.veer.com/umbrella/" rel="nofollow">http://www.veer.com/umbrella/</a></p>
