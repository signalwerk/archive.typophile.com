    <p>To the great dismay of many, the Typophile.com listing in Wikipedia was removed.</p>
    <p>I put it back.</p>
    <p>The reason it was removed was because the original wasn't good enough, and looked like something created by Punchcut, which it probably was.</p>
    <p>So, for the sake of Typophile.com's integrity, I created a new listing. (Actually, I created two listings. The <a class="freelinking external" href="http://en.wikipedia.org/wiki/Typophile" rel="nofollow"> Typophile disambiguation page</a> and the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Typophile_(Internet_Forum)" rel="nofollow">Typophile (Internet Forum)</a> page.</p>
    <p>To prevent any further disruptions, I encourage all to cite all relevant <em>external</em> links and citations to the Typophile page.</p>
    <p>If you are a type designer/foundry with their own website, external links can be used as sources for a new paragraph listing Typophile.com as a resource for type designers and foundries.</p>
    <p>If you are an opentype font/application developer, external links that show Typophile as a resource for that work should be listed as a separate paragraph as well.</p>
    <p>What would also be helpful is a <a class="freelinking external" href="http://meta.wikimedia.org/wiki/Talk:Interwiki_map" rel="nofollow">full Interwiki integration</a> with the <a href="/wiki/typowiki" class="freelinking" rel="nofollow">typowiki</a> hosted here.</p>
    <p>I'll post further ideas as they happen to come to me.</p>
