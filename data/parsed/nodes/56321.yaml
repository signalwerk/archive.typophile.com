      <p>That was the specific page that I was expecting some sort of direct link, but it's obviously not there. A static link, I mean. I know that misc links to specific threads float through there regularly.</p>
      <p>Wikipedia doesn't like links that come from directories, since most directories don't have any sense to them and most often do not point to specific web sites as authoritative on the relevant subject. </p>
      <p>My suggestion is that you have a link referencing Typophile from that main links page, a simple one, but a more authoritative recommendation on the font developer overview page next to the Opentype List reference, or on the Type Developer Links page, that specifically mention Typophile's forums as a good place for questions concerning font development, etc.</p>
