      <p>I think I see what he is saying. He has a "small caps" font in the old Type 1 format, with full caps in the uppercase position, and small caps in the lowercase position.</p>
      <p>* * *</p>
      <p>fi, this illegitimate (i.e., bastard) format is just that. A way around the hard-wired encoding of the old Mac &amp; Windows operating systems. It has nothing to do with proper naming.</p>
