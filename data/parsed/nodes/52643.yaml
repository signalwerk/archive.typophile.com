      <p><em>I can’t see a difference [between] the uppercase roman and uppercase sc on any of the fonts in my small library.</em></p>
      <p>Because there is none. Caps are caps.<br>
      But what if you want to reformat a line of text set in roman to sc?<br>
      Do you only select the lowercase letters and reformat, or do you rather select the whole line?</p>
