    <p>Hello all,</p>
    <p>I have been assigned a type project, a poster design for which I have decided to use Mrs. Eaves. I am required to choose a companion typeface, which must be a sans-serif. Since Mrs. Eaves has so much personality, I can't seem to find one that fits just right. Any suggestions?</p>
    <p>Thanks in advance!</p>
