    html: |-
      <p>Contrast, not enough.<br>
      Look for both counterpoint and harmony, to use musical terms.<br>
      Choosing a sans is counterpoint enough, certainly if you contrast weight as well.<br>
      For harmony, it seems that a sans with a small x-height, a noticeable difference in stem width between cap and lower case, vertical stress (i.e. not oldstyle/humanist), and ascenders that do not extend above cap height, would complement Mrs Eaves. Such as my <a href="http://www.shinntype.com/figgins.html" rel="nofollow">Figgins Sans</a>.</p>
