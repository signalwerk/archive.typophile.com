    html: |-
      <p>Contrast can be many things. Mr. Eaves share his Mrs’ skeleton, but his monolinear body doesn’t sport her ladylike features (the thicks and thins). That is one of the most common contrasts used nowadays, the principle most superfamilies follow.</p>
      <p>You can also have contrast angle (cursive), in size (small text sizes vs. large display sizes), and in weight: Perhaps Mr. Eaves enjoys a good hot dog or a tasty hamburger. Well, why not let him gain some pounds?</p>
