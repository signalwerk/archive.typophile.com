      <p><cite>The 180 sidebearing wasn’t an option for actual sidebearings for the H, it was part of the method in Letters of Credit - I was trying to balance the series of H’s next to each other.</cite></p>
      <p>Yes, I understood, but still then even 157 is to loose. If a sidebearing of 157 gives you the same space between H's as within the H, there's also the horizontal bar within the H which to compensate for by slightly reducing the space between the H's. And from what I can see in your example 157 indeed seems a bit to loose.</p>
      <p>I think the last step in Tracey's method should be interpreted as:<br>
      Measure the new space between H's (so after optically adjusting the space between H's), divide that by 2 and you have your new sidebearing.</p>
      <p>When I imagine Tracey shuffling around with H's on white sheets and a ruler, this seems like a logic interpretation of his method.</p>
      <p>Best,<br>
      Artur</p>
