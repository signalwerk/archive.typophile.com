      <p>Tracy needs to be read carefully.<br>
      There is no 'correct' spacing for a single character.<br>
      The H is fit correctly when the D has balanced spacing in these combinations, HDH and ODO.<br>
      I know that's cryptic, to some, but if you read carefully, that is what is written.</p>
      <p>Cheers!</p>
