      <p>Well, look. There are 100's of fonts included with your computer, I'd guess, and none of them are likely to be terribly wrong.<br>
      The only other tip I have is if the "it" you are trying to space is the same shape as something else, give it the same space.<br>
      If it is different, how does that effect the space. Have a constant mental argument with yourself, and you'll see that help your spacing, (not to mention it being good practice for 'discussing' spacing with others).</p>
      <p>Cheers!</p>
