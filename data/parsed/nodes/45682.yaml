    <p>I've been following the spcacing method in "Letters of Credit" - Walter Tracey.</p>
    <p>The spacing of the Uppercase H seems to be the most important glyph to space, but I'm slightly confused by the description in the book.</p>
    <p>The way I understand it is :</p>
    <p>1. Measure the inside distance of the "H".<br>
    2. Half the number and place it on each side the "H".<br>
    3. Place 4 "H"'s next to each other to check the spacing.<br>
    4. The space on the inside and outside of the glyphs should be balanced, adjust spacing until the balance is correct.<br>
    5. When they are balanced I half the sidebearing to give me the correct sidebearing for the "H".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/H_3921.gif"></div><p></p>
