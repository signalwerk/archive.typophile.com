      <p>Reginald, Tracy says that half the width of the counter is the starting point for each sidebearing. He goes on to say that: 1. it generally has to be less to be balanced; and 2. generally with sans designs the side bearing of the has to be still less because of the lack of serifs.</p>
      <p>Personally, I don't think you can tell what is 'balanced' the first time around just by looking at the H's. I think you will have to do a few other letters--including the O--and then look at them in words. It is really not obvious, and only with experience can you get a feel for what is a 'good' H spacing from that one letter--and even then there is not one 'right' solution. The other thing to do to gain a feel for what is 'good' is to look at the sidebearings in designs similar to yours that you like. There you will see a variety of treatments and their impact on text "color". For example, compare Helvetica and Univers. Also you have to consider intended default size, as that will affect what is best.</p>
