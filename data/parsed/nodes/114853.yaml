      <p>Transitional and neo-grotesque are “phylogenetic” terms, created to explain certain historical narratives, in particular the idea that typefaces evolve. </p>
      <p>Another method of classifying typefaces is “taxonomic”, based on physical attributes, e.g. the PANOSE system.</p>
