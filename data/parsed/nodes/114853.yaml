    html: |-
      <div class="comment-spam-body"><p>I'm a bit fuzzy on the details, but from past research I concluded there are actually virtually no Grotesque typefaces in use today. There weren't many, and only a few have been digitized. Akzidenz Grotesk is a grotesque. Helvetica and Folio neo-grotesque typefaces.</p>
      <p>As far as I'm aware—and strangely enough—the distinction is in design date and not in design. Also note that slab serifs were initially considered grotesques as well. As "grotesque" referred to the ugliness of these typefaces at the time, it seems to have been a very wide style initially.</p>
      <p>Nick, what do you mean with your statement? I wrote down some criticism but I first want to make sure I'm understanding you correctly.</p>
      </div>
