    html: |-
      <p>No, what I’m saying is that historians wanted to explain where Helvetica and Univers came from, as the type genre favored by the modernist international style, but could not term them revivals, because that was too old-fashioned. By adding the prefix “neo-” they preserved the idea of historical continuity.</p>
      <p>Similarly, when historians wanted to classify Baskerville, they noted that it formed a bridge between the old style (e.g. Caslon) and the didone (e.g. Bodoni), so they named it transitional. </p>
      <p>So the issue with these categories is to disentangle whether one is referring to the physical appearance of a typeface, or where it ﬁts chronologically. </p>
      <p>Headliners International (the North American phototypositor type house franchise) named a small x-height genre of its versions of the classics “Neo-Mini-”, e.g. Neo-Mini-Garamond, c.1980.</p>
