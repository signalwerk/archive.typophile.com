      <p>This term is rather like Transitional.<br>
      It is a convenience invented to describe how a popular and inﬂuential typeface informs the historical narrative, but as a genre there were few members at the time.</p>
      <p>i.e. transitional = Baskerville, neo-grotesque = Helvetica, Univers and Folio.</p>
