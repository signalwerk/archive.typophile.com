      <p><em>Dunwich Type: Designing type specimens is like designing everything else. You need to shut down your computer, get off your ass, and do some research. </em></p>
      <p>Harsh, but true. That being said...</p>
      <p>The opinions of what a specimen should include are as numerous as the people who use and enjoy them. Near as I can tell, the only rule is that there are no rules. There are factors that will decide some of the format. A display font like Cottonwood doesn't lend itself to a type waterfall (or whatever they are called) at 8pt. 10pt. 12pt. etc. It will never be used in a text application. </p>
      <p>Some of the best specimens I have seen have been on the web however. Research still needs to be done.</p>
      <p>James</p>
