    <p>I'm graphic design student looking for a bit of advice for a uni project I'm working on. Part of the project is to create a type specimen booklet for a given font - <a class="freelinking external" href="http://www.linotype.com/296/cottonwood-family.html" rel="nofollow">Cottonwood</a>.</p>
    <p>For the project I am trying to visually communicate how elegant the font can be and want to focus on this with my specimen booklet (the booklet has to be based around a certain characteristic of the font, my chosen one being how elegant it can be). </p>
    <p>I am looking for advice on two things:</p>
    <p>1. What font should I use for the body/descriptive text - I want to keep it simple and compliment the running theme of elegance. I've tried a few so far but nothing sits right so far.</p>
    <p>2. Has anyone got any good advice/tips on making type specimen booklet? I've never designed one before.</p>
    <p>Any input would be greatly appreciated.</p>
