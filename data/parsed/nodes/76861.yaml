      <p>I think it's appropriate here to assume this is research, and point to relevant links:</p>
      <p>Pre-WWII, (which I think Cottonwood belongs to), specimen books are <a href="http://www.flickr.com/photos/59825996@N00/sets/72157601971266865/" rel="nofollow">here</a>. </p>
      <p>On body types, <a href="http://www.aapainfo.org/wesson/seltype.html" rel="nofollow">here</a> is a charming piece that might generally help, though you're in the not altogether rare situation where the display type has been chosen first.</p>
