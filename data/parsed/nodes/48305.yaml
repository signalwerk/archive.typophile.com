      <p>I think you’re using the term “amateur” in the sporting sense, which does have a pretty strict non-profit (for the players) definition, but such is not so clearly defined in the arts.</p>
      <p>Fonts are free (no cost) only when their authors or foundries declare them to be so, skill, certification, experience, or establishment notwithstanding.</p>
