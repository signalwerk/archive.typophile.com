    <p>Here is a vague and general question.  Please give me any and all opinions.  How does one differentiate between amateur and professional fonts?  Are amateur fonts free?  Reside on a certain web site?  Not come from a major type foundry?  </p>
    <p>First throw out some thoughts, then I will elaborate on why I’m asking.</p>
    <p>Thanks,</p>
    <p>Tara</p>
