      <p>“How does one differentiate between amateur and professional fonts?”</p>
      <p>Umm...I don’t think you do. They aren’t really adjectives that make a whole lot of sense in the context of typefaces.</p>
      <p>If you’re looking for analogies...maybe buildings would be better. There are well built, sound, strong buildings designed by internationally known architects and then there are falling down shacks built with scraps by transients down by the railroad tracks. One probably took a lot more time and craft to build, probably costs more, and likely has more uses, but both can have character and either might be the right building for the right setting for a particular need.</p>
    html_clean: |-
