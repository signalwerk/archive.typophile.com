    html: <p>I think it probably has a lot to do with the experience of the designer. My (unreleased) fonts are incredibly amateur, and probably still will be by the time I release them. There are plenty of professional type designers who have gone back and pulled their amateur works from the market. Take a look at the Schwartzco web site; Christian has posted stuff going back to when he was 14 and you can see how one develops to the professional level.</p>
