      <p>I don’t there there are many clear lines between the two. There are plenty of free professional-level fonts to be found all over the web. There are also probably some not-for-free fonts that aren’t very professionally done. I’d say that the majority of free fonts aren’t necessarily “professional,” but that doesn’t mean they are totally unusable. </p>
      <p>I think lately, the bar has been raised, and fonts that are truly “professional” tend to come in families of several weights and also include many glyphs that most free fonts don’t.</p>
