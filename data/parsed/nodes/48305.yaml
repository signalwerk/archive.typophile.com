    votes: null
    html: |-
      <p>Not all fonts are created equal, and there in lies the difference. Wether it’s poor use of nodes, an overall bad design, or a font that was done but has very limited appeal and usefulness. </p>
      <p>As far as residing at a particular website, daFont carries free fonts, there’s thousands of other sites as well, and some are not always ’free’ but are commercial fonts being pirated under a different name. While places like Myfonts.com carries many quality commercial fonts, it also allows people to submit their work and have it downloadable for free. There are also many professional type designers that choose to run their own shop and sell for themselves, meaning you don’t have to buy through a major foundry, or even a minor one to get professional fonts. You can’t judge quality by price, some accomplished type designers release free faces as an incentive. Even large foundries do this.</p>
