    html: <p>Do you know all the ways the logo will be used? Will it be used small, will it be used in Black and White, will it be used in one PMS color? If its yes to any of these questions then loose the gradients and make it work as a vector mark. Its always easier to add gradients to more complicated packaging than to dumb it down if you have gradients.</p>
