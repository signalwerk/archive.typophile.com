    html: <p>I suppose that yes, I do not agree with Dav,( formlos). The old J seems fine to me. I don’t think thge new one *bites* or anything. But If you are looking for a more J like J I wonder if you can find another way. The current Serif on the cap J points back and holds my eye. But even so, my main suggestion is still that you restore the serif to the right side of the the 1st m. In the case of the J, I wonder if a twist could be introduced instead of a serif. Or a wave in the line. Sort of a coca-cola wave. It could be very funk fresh. Or a shorter serif. It is tasty though. In spite of my ideas about how it might be better I think this is an interesting and strong solution. But it is easy to accept very good. I think you should push on to great.</p>
