  html: |-
    <p>This logo is for a music based company that is designed with artists in mind. It helps them get matched up with appropriate venues. The name of the company is “mJambo”, which means “hello” in Africa, and also harks back to the roots of music itself. I have designed two very different styled logos. I’m leaning toward the first one. The client has specified that he wants the “m” lower cased and prefers just a type treatment as opposed to an icon. I’d love to hear a critique of the logos I have provided, as I know they need to be fine tuned.</p>
    <p>Thanks.</p>
    <p>(please note I have attached all revisions made on this first post)</p>
