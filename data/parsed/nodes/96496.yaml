  html: <p>This fun face is based on the International Phonetic Alphabet - Alpha, Bravo, Charlie etc - and would look great on sci-fi games, film and book covers or anything with a technical or military angle.  Available in Regular, Italic, Blank and Blank Italic from Studio K at myfonts.com at a 50% discount this month</p><div class="imageWrap"><img src="http://typophile.com/files/T MINUS 10_3942.png"></div><p></p>
