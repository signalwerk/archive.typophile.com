      <p>Nick, you seem to acknowledge how I explained my use of the term ‘production’, i.e. making fonts, including design and manufacture, and then go on to ignore that use.</p>
      <p>I don't think design is somehow left ‘to be picked up later’ at Reading, but the focus seems to be on skill development and design is studied and practised in the context of making fonts, i.e. of designing typefaces as working products not on drawing lovely letters. Insofar as the graduates hope to have jobs in the type business, I think this is a sensible approach, because the skills they are learning are the skills they will need.</p>
      <p>Does the Reading programme provide in itself all the letter design training that a type designer will need to produce not only workable fonts but original, well crafted typefaces? No, I don't think it does, and the student work seems to me to reflect pretty clearly the prior experience and skills of the individual students. What it does do is to teach design skills in the context of making typefaces, which is something different than teaching lettering which, if you remember, is the original point I made in response to your comment about Goudy and Cooper.</p>
