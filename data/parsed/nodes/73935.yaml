      <p>Nick: <em>When Fred Goudy taught lettering at the Holme School in Chicago (to Oz Cooper, among others), did he confine students to a single style, because they could pick up the rest later?</em></p>
      <p>There's a big difference between teaching lettering and teaching typeface design. If I wanted to study lettering, I wouldn't sign up for a masters in type design. Lettering is about styles and techniques for achieving them. Type design is about mastering a set of skills that can be applied to the production of fonts, largely independent of the style of lettering embodied in those fonts.</p>
      <p>I don't think there is a Reading style in the sense that there is a kind of letter that the teachers encourage students to produce. This is demonstrated by the fact that over the years numerous students have produced designs that clearly do not reflect such a style, and often it is these students who have received distinctions for their work. Rather, I think there are students who have more and less original ideas about letters, and the latter seem to gravitate to some common tropes.</p>
    html_clean: |-
