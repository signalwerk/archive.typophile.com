    html: |-
      <p>Hmm… I have the impression it doesn't make sense to evaluate these typefaces side-by-side. It seems to me people go to study to Reading or similar school to learn important things about letters, their forms, history and use, and the people which attend are as much diverse as you can get.<br>
      In general, it seems to me there are people like graphic designers whose desire is to learn more about the alphabet which aren’t interested in the beginning to strive for originality as a priority for their type design (maybe they will not even design other typefaces).<br>
      Inversely there are people which are extremely interested in learning about letters, which may go on to design typefaces and keep on studying the history of the written word, but whose typeface may be simply the means to learn better. I envy them, since I never had the patience to learn by trial and error, and my personal works have been more experiments than other… :-)</p>
      <p>It seems to me you can have a certain feeling about this "homogeneity" so much discussed, but nonetheless there are typefaces which are outstanding, while sharing these characteristics. One of them, to me, is Cassius by Mathieu Réguer. I would really buy a license, whenever he’ll decide to complete it… :)</p>
      <p>I think it should be valued both the pyrotecnic madness of the 1990s (where graphic designers, or complete amateurs like me went on designing letters — and Matthew Carter DO appreciated it) and the systematic approach of a design school like Reading or the course of the Aia. You can’t suppress one aspect in favor of the other. While I deeply value landmark experiments of the 1990s (i.e. Barry Deck’s, to have just a name), you realize afterwards that you can really evaluate with an understanding, or – better said – a personal knowledge of what you handle. This may happen to you as an autodidact, but nonetheless you have to learn… :)</p>
