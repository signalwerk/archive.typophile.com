      <p>I generally think the "constraints" named by Nick are part of the premises.<br>
      More radical experiments would be harder to judge, and they could be misinterpreted, so all the room for the experimentation is "tamed" in order to produce typefaces which are, say – "functional".</p>
      <p>Anyway, some of them aren't constraints at all. The proportions of many typefaces produced at Reading are just within the range of correct proportions for a text-aimed family. Outside of them, they would be unusable.<br>
      My only critique would be that many of them, and of the KABK, are too "polished", and that‘s precisely a reaction to that which motivated me to attempt type design in the first place. I disliked what ITC produced in the 1970s and 1980s, for example. To me, Barry Deck‘s Arbitrary was a "return to lead" of sorts… :-)</p>
      <p>@Nick: Thanks, but they need to find their time to develop. I need to design something I would use, and I would not use most of the things I have done, simply because the cultural climate is different. Now the tension is at another level. But I will wait for your "Radio Shack inspired" family.</p>
