      <p>Given that hyphens are treated this way, I can't dismiss out of hand the idea of doing this with at least the most common mathematical operators in a typeface <strong>not</strong> intended for the setting of mathematics.</p>
      <p>Given that in mathematical typesetting, variables are almost always lowercase (and italic) and numerals are almost always ranging (as opposed to oldstyle), it is true, as has already been noted here, that mathematical operators almost always have to be designed to a compromise position that looks good with any mixture of upper-case and lower-case.</p>
      <p>Obviously, it would <em>not</em> be a good idea to have a font switch between oldstyle and ranging numerals depending on whether the letters of variables adjacent to them in an equation are uppercase or lowercase. Given <em>that</em>, one would almost be constrained to have to have <em>three</em> forms of mathematical operators, the compromise kind as well as the uppercase form and the lowercase form.</p>
      <p>And then you have the problem that if not all the operators in a formula are of the same kind, one has their median line jumping up and down.</p>
      <p>Even with all these dangers, the alternate forms of the operators might be useful where one has only very simple expressions, so the rule to encode in the font is perhaps to only use the uppercase form or the lowercase form if it is the only form called for in a single expression or even in a whole line of text - and otherwise use the compromise form.</p>
      <p>With such a restriction on the use of the alternate forms, while it might be questioned if they're worth the bother, if one <em>isn't</em> typesetting mathematics, the majority of the time there will usually only be one operator or two used at a time. (And encoding such a rule has the bonus that the typeface won't break down if someone <em>does</em> use it to typeset mathematics - the dangerous feature just turns off gracefully.)</p>
