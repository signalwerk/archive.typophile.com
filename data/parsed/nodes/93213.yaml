    html: |-
      <p>Actually, the lowercase variants work fine in mixed case situations (using case to refer also to full height vs. small figures as well as the more orthodox use) such as 3x + 8 = 14. If I went ahead with this using my option B then the 'uppercase' operators would be used only in situations where all caps formatting had been applied such as 'COBRAS+MONGEESE=TROUBLE!' giving the operators a more centered appearance, but the lc variants are still perfectly serviceable in situations like 2+2=4 (my earlier claim that they looked weird was overstated -- they simply aren't visually centered).</p>
      <p>On the one hand, the use for such variants would likely arise rather seldomly. On the other hand, the effort involved in implementing them is rather minimal (a small handful of slightly raised glyph copies plus one line of code).</p>
      <p>So now I find myself leaning back to including them, though I'm still not fully off the fence. All feedback has been appreciated.</p>
      <p>André</p>
