    <p>Hi,</p>
    <p>I have a font which has 'uppercase' and 'lowercase' versions of mathematical operators (differentiated by height -- similar to the treatment of hyphens, dashes, etc.). I'm trying to figure out how to best handle this in terms of OT features, and am debating between two approaches.</p>
    <p>(A) I can treat the uppercase variants as basic and access the lowercase ones through some features (probably 'onum' and 'smcp').</p>
    <p>(B) I can treat the lowercase variants as basic and access the uppercase ones through some features (probably 'case' and 'lnum').</p>
    <p>Either way, either '2 + 2 = 4' or 'a + b = c' is going to look weird without some feature being applied. I'm wondering which approach is the better option. I'm leaning towards (B) simply because many people use the hyphen in lieu of a proper minus symbol and (B) would treat the two in a parallel fashion but am still going back and forth on the issue.</p>
    <p>Note that this face isn't intended for mathematical use, and it contains a set of small figures but no true oldstyle figures. I'd rather leave the full-height figures as basic.</p>
    <p>Thoughts?</p>
