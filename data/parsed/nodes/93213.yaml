    html: <p>I use c2sc for this operation.  I have a normal set that works with mixed case and caps and an smcp set that works with smallcaps.  I also have a stylistic set which allows the user the choice to use the smallcaps operators with onum if they choose. With this setup, I also add smcp figures which are lining but at the smallcap height.</p>
