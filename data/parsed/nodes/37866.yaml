    html: <p>The city of Munich's transportation system (subway, commuter rail, steetcar, bus, etc) uses Vialog. If you poke around their website, you might be able to find downloadable time tables and maps - <a href="http://www.mvg-mobil.de/" title="www.mvg-mobil.de/">www.mvg-mobil.de/</a></p>
