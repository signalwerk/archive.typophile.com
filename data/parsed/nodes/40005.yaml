      <p>Failing the "'FOND' font association usability" test probably means that the font has no outlines but only bitmaps. There are some known problems with such fonts on Leopard which we hope to address in a future release. In general, however, bitmap-only fonts don't work in all situations in Mac OS X and it would be best to switch to a TrueType, PostScript, or OpenType version of the font. </p>
      <p>As Dan says, if you suspect there is a problem with the font validation engine used by Font Book or with font activation, please file a bug or send Apple feedback and include the font. Even if we know which validation test is involved, it's hard for us to track down any problems without having a copy of the font itself which triggers it. The following URLs are the places to start:</p>
      <p><a href="http://developer.apple.com/bugreporter/bugrptform.html">http://developer.apple.com/bugreporter/bugrptform.html</a><br><a href="http://developer.apple.com/faq/bugreporting.html">http://developer.apple.com/faq/bugreporting.html</a><br><a href="http://developer.apple.com/bugreporter">http://developer.apple.com/bugreporter</a><br><a href="http://www.apple.com/feedback/macosx.html">http://www.apple.com/feedback/macosx.html</a></p>
    html_clean: |-
