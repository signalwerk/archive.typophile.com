      <p>tseng,</p>
      <p>I have 2 quick questions related to your response to this issue, as you posted it on one of the boards in Florian's links above. To whit--</p>
      <p>I fetched Rezilla as you recommended, was able to open an offensive Type 1 bitmap suitcase, and delete superfluous bitmaps. No problem. Now, my two quick questions:</p>
      <p>1. How do I save these changes to a new file that Mac OS recognizes as a bitmap suitcase? The Rezilla documentation is weak, so I couldn't figure it out. I did a "Save As" and it wants to save the edited suitcase as a .rsrc file. I did, changed the extension to .bmap, but no dice--the OS still does not see it as a suitcase.</p>
      <p>2. In the suitcase, when it is opened, there are also a number of NFNT resources. Only ID numbers are provided (no names). I don't know what these numbers represent, I only recall from the old days that NFNT has something to do with fonts (blushes...) Do I need to do anything with these as well, and if so, how?</p>
      <p>Thanks for your help..........(and yes, we need the system to let us open bitmap suitcases again a-la earlier versions of the OS. Or have Apple write a little utility app that does the same thing, a-la the old Font DA Mover.)</p>
