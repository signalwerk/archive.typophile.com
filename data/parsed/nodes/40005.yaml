      <p>Ryan:</p>
      <p>1.  The file won't be recognized as a suitcase unless it has the right file type.  Check Rezilla to see if it will let you set the file type to FFIL.  Otherwise, you'll need to install the developer tools and use:</p>
      <p>SetFile -t FFIL </p>
      <p>You may want to give it the extension ".suit", but that shouldn't be necessary.  </p>
      <p>2.  Don't worry about the extra NFNTs.  They're harmless, and it's too much trouble to track down the ones you don't need.  They're the places where the bitmaps actually live.</p>
