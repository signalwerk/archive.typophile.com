    html: |-
      <p>When you ask for help, and then people ask for more detail, it's generally under the premise that they feel they can offer you better help with more information. When you quickly dismiss those questions, you come off sounding like a twat. Why would you even trust someone's answer when their answer is based on virtually no information? And why would anyone want to help when you're so dismissive of their questions? So while it may not make much difference if it's for a book cover or a poster (two types of media you did <strong>not</strong> mention in your initial post), it certainly would make a difference if it was (as J. Tillman asked) for text. It could also make a difference if it was for the titles of a movie, or if it was going to be silkscreened on a t-shirt.</p>
      <p>Similar instances where asking questions could provide more relevant answers:</p>
      <p>• What time period does this relate to? You never mentioned if this is a town in modern times, or the 1960s, or the 1880s. It wouldn't make sense to offer suggestions for fonts that evoke an episode of Twilight Zone from that 60s that took place in the 60s when you were really talking about one of the episodes from the 60s that took place in the 1800s.</p>
      <p>• Is the location of the town relevant? Your profile says you live in Montreal. Are you talking about a small town in Quebec or a small town in the US in Indiana? I'd imagine there'd be a difference. </p>
      <p>• Who's the audience? (i.e. do they need something obvious, or would something more subtle work)</p>
      <p>These are the kinds of questions professionals ask. They're also the kinds of questions (and answers) that could help the professionals who frequent this board give you better answers (or answers at all — twelve hours after asking your question, you've gotten none).</p>
      <p>So feel free to continue coming off like a twat, and use Arial. Lots of people in small towns use Arial. But if you want better help in the future, try not being dismissive of questions that are being asked in the spirit of helping you.</p>
