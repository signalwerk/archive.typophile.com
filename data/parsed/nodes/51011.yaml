      <p>This is my personal opinion, and it may not be the best...</p>
      <p>• Nick's nailed it, it's a corporate identity (which would be a brand bible) With deliverables including assorted stationary.</p>
      <p>•  I think £350 is more than fair, considering your environment. You've even given him a fixed price!</p>
      <p>•  this comment of his I find quite disrespectful: "I offered you the work just because I thought it may build your portfolio to include work for actual clients." Clients will always try the "I'm doing you a favour line..." don't buy it. Seriously!</p>
      <p>• He makes a point of £200 for the logo, this could be fair. Solely for the logo. I would take that, and tell him to find another designer to produce the stationary. The latter is the labour intensive part, liaising with printers, proofing costs and the general logistics involved. Also, the logo will take you further than the stationary folio wise...</p>
      <p>• If your doing it right, corporate stationary shouldn't be done in a day...what exactly does he think his £2m global bank rebrand went on? The one day designer doing the whole thing for £400, is your average kall kwik mac monkey - which goes back to James' point about off the shelf...</p>
      <p>• Lost leads is just stupid. Only work free or cheap if it's something close to your heart.</p>
      <p>• Don't be afraid to say no...because you'll be laughing your socks off when you see what he gets for £200.</p>
