      <p>Jeez… 305 pounds is around 500 euro, right? That's what I charge friends for a simple Identity (logo, letterhead, business card, one more item) with no more than 2 colours. Mind you: real friends, not casual acquaintances.</p>
      <p>Anecdotal: A famous advertising guy in the Netherlands (no longer amongst us) had great advice regarding pricing: the amount you charge for any service must be a little painful for the client, but not enough to make him bleed.</p>
      <p>When I did serious work (I am semi-retired now, or on an extended sabbatical) I always asked clients what they had budgeted for a project. Sometimes it took some convincing before tehy would tell, of course. That budget I would divide in two. One half for creativity, the other for execution (printing etc.). And I would include my mark up in the latter half. Worked pretty good…</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
