      <p>In reference to this perceived value you have made a couple of huge mistakes. Firstly, you asked HIM to tell YOU how much to pay you! Secondly, your correspondence to him was quite unprofessional. This further goes to downgrade your perceived value.</p>
      <p>I agree with Nick's comments too - you have no formal design education and a small portfolio so you cannot charge $3000 for an identity system because you cannot provide that level of service and experience to deliver value on that.</p>
      <p>What I would have done in this situation is go right in with a price that will pay you for your hours. Figure out what a decent hourly rate would be, say £15 per hour (which is $24), and lets say you determine that it is a weeks work for you (£15 x 40 = £600). Quote him this price and let him know what your rate is and that there is no way you can complete the project in less time, nor would you work for less than that per hour. Give him a comparison of a professional rate, say at £35 per hour would be £1800.</p>
      <p>If you always try to compete on price, there will always be someone who will undercut you. You must compete on value and service and be competitive on price. If someone purely wants to talk price, get out.</p>
