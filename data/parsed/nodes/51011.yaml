      <p>This guy obviously doesn't value his new business to much if he is willing to spend £200 on these jobs. After all, his logo, etc will be representing his business. After much thought and reading on here, I did tell him that I wasn't interesting in a reasonable way, but I was very tempted to tell him my real heated feeling.</p>
      <p>My reply.</p>
      <p>After much more thought and loads of advice from fellow designers, I have decided to<br>
      reject the offer of £200. For some reason you seem to think that cause I lack commercial experience I have to charge a low price no matter what my standard is. For £200, you will not get a a logo, letterhead and business card designed to a high standard. You must really undervalue your new business pretty low if you are gonna trust some poor designer to design this stuff for you at a price of £200. If you want to pay that for a logo alone you will be lucky to find a stock logo. You know the fact I don't have commercial experience and use that to base the price on which is totally undervalued. Jason, I like you and were pretty much on the same level when it comes to knowing where to take a design, but I can't work at this offer. Also, it isn't a one day job, the logo will take days to research, etc and that's excluding the business cards and letterhead. Would you really want me to do all that in a day?? Good design takes time.</p>
