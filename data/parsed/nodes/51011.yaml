      <p>Maybe I'll put the things short and frank. Getting the job done - with desired quality! - is one thing, negotiating the price is something waaay different. </p>
      <p>One of the hardest things I have to do is explaining clients exactly <strong>why</strong> they should pay such price. At least in my experience, the client most of the time does not care how big is your portfolio, neither is so much interested in high quality, but prefers to make a 'winning deal' - i.e. getting best results for nearly nothing. If the quality is most important factor, client should accept your quote and discuss specific quality requirements, not drive a hard bargain. </p>
      <p>How you define how much your work is worth paying for? Well, my principle is never to underestimate yourself. If you're satisfied with £300, ask £400-450, so you can have the chance to lower your price to accomodate the client's needs (if it's really worth it). I do not believe this is the case though.</p>
      <p>So, when dealing with slimy guys trying to sell you bullshit in the manner of '<em>I'm doing you a favour</em>', let them rot in their slime. Such relations with the client are simply not worth it, and unsurprisingly often lead to subpar designs. Unless I desperately need these money, I would turn down his offer, and even ridicule him for the last mail you quoted - quite close to his own manner of patronizing. My reply would be '<em>So you still cannot find someone to do it for such price? Keep looking, good luck in finding one</em>'. I'm not the most polite guy, when my effort is underestimated.</p>
      <p>In fact you in my opinion have made already two mistakes: letting him to quote a base price you can discuss later, and demonstrating you have 'not that huge' portfolio. My policy is always to give my quote first, and then negotiate. Unless, of course, you desperately need the money...</p>
