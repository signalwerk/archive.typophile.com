      <p>One last analogy:</p>
      <p>Pretend you are a chef. Your menu should consist of fine wines, wondrous steaks, elegant pastries, etc.</p>
      <p>A customer walks in asking for a burger and fries for $3.99. You could accommodate him, and he may be very satisfied, and you did make $3.99, but did it really further your career to any extent? Probably not.</p>
      <p>I'm not saying it's not OK to make $3.99. I've built plenty of cheap designs for clients that just wanted that...a cheap solution. But don't feel compelled that you have to, or think that it will do much for the portfolio.</p>
