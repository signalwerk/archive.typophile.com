      <p>More than anything, we need to move away from the idea that design is a service and see it as a product. We are not selling time. We are selling objects of value that, if done well and taken care of, will outlast us all. Every time we agree to sell our product for less than what it's worth, we drive down the value of design for everyone and give more business to the $50 logo clowns.</p>
      <p>There is nothing wrong with giving a price break from time to time but your estimate should reflect the application of that discount so that the true value of the product is known and future expectations are set. Set up a standard discount for start-up companies or non-profit organizations and stick to it. Establish a top-of-the-head average price point for basic products so that you can speak confidently about it when asked.</p>
      <p>Keep in mind, too, that every hour you spend working on an undervalued job is an hour lost that could be spent on something of value. There is nothing worse than giving up a weekend to a client that doesn't respect your time and talent.</p>
      <p>Finally, check out one of the many pricing guidelines available. My personal favorite has been the "Pricing &amp; Ethical Guidelines Handbook", published yearly by the Graphic Arts Guild. It will answer just about any question you can throw at it and will give you the insight and confidence you need to talk about pricing and process with clients.</p>
      <p>Good luck!</p>
      <p>TM™</p>
