      <p>Well, I went back and said I would charge £350 for the project, whether it takes a week or 1 day to complete, it's the fixed price he pays. The only problem is that he knows I don't have a lot of experience with clients and my client folio isn't huge, so he is using this against me. </p>
      <p>This is what he replied to in my email.</p>
      <p>Hi Daniel</p>
      <p>Dont't take this the wrong way as it's only friendly advice, as you're a nice guy.  Clearly, you have talent to produce what you do without formal design education.  I offered you the work just because I thought it may build your portfolio to include work for actual clients.  Although I'm not a designer, I have briefed agencies myself and through large corporates from anything as small as an A6 flier, to a £2m re-brand of a global bank, so I understand that a logo with letterhead and business card should be one man-day, which makes your daily rate £350.  If you had 5 years experience you could absolutely start charging £350-450 p/d (outside London).  Just by way of contrast, the best design agency in Derby that I used charged their senior designer out at £400 p/day and that included their overheads.</p>
      <p>I've had to build up myself and the best thing you can do is to start to get some real examples in your portfolio that shows you can design in different styles against a client brief.  That does mean, in the early days, offering lost leads and heavily discounted rates to build up.  When you have the experience you can demand the higher fees.</p>
      <p>So I'm not undervaluing you but I don't value the logo over £200 and would find a designer who work for that fee.</p>
      <p>Let me know what you think.</p>
      <p>Ok, so what do you guys think of this??</p>
      <p>Thanks for the advice so far.</p>
