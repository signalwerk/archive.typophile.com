      <p>babyDahl,</p>
      <p>Many very good graphic artists and graphic designers are self-taught. As you point out, you have 8 years of design training and education, plus actual practice.</p>
      <p>As I tried to stress, customers often pay according to perception and years of paid experience.</p>
      <p>You are young. That is a blessing in itself, worth much more than getting paid a lot for a job. </p>
      <p>Unfortunately, age does work against you; if this is one of your early jobs, customers feel that it is worth a smaller amount than you, like a certain £ amount per hour. So, the total of £200, divided by the number of hours the customer thinks you needed to do the job. </p>
      <p>Even though you may feel its worth a higher amount, I found after many years of paid experience, reputation and recommendation is valuable more than the money of one job. A happy customer recommends you over and over. A good name goes out far and wide. This leads leads to endless more jobs. As time goes on, your age and paid experience increases, and you will receive more and more for every job. The most important factor is a happy customer.</p>
