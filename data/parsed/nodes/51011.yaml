      <p>My rule of thumb in pricing is based upon the capitalistic theory of "whatver price the customer will bear", and "perceived value".</p>
      <p>The higher the price, the greater is the "perceived value".</p>
      <p>Since people like a bargain, I always "discount" a very high price. Like "a 50% off introductory offer".</p>
      <p>Say I want a $2,500 for a job. I'll price it at $5k, and offer "a 50% off introductory offer".</p>
      <p>I'll list the cost of the various item, totalling well over $5k. I'll write that the group discount for all the items brings the price down to $5k. 50% off is $2,500.</p>
      <p>In this way, the customer thinks he got a bargain, and you get the amount you want.</p>
      <p>My teacher and mentor in college taught me, "shoot high" - for you can always lower your price. If you start out too cheap, and raise the price later, you'll lose the customer forever. </p>
      <p>If you start out higher, you will be perceived as high end and quality. If you start out too low, you will be perceived as cheap, not so good, and barely professional.</p>
      <p>In your specific case, estimate howw many hours it took to do the job, and add any additional hours that the customer would think it should take at most. Multiply all the hours by a rate per hour that you think you're worth. Double it, and quote the job. Mention that since this is the first time that the customer gives you a project, he's entitled to an introducy discount of 50%.</p>
      <p>He is happy, and so are you.</p>
