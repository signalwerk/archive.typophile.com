      <p>"Its amazing to me that design schools don’t get into teaching the business of design. Such a shame."</p>
      <p>Yep.</p>
      <p>One story that has always left a thorn on my side was being newly out of school working at a firm and volunteering for a local AIGA portfolio review event. In the evening, they had a panel of respected professional designers on stage so students could ask questions. When the questions petered out, I offered one up to keep things rolling along the lines of "When should a person start thinking and talking about salary with a potential employer?"</p>
      <p>Now, I thought that was a really good question, as in my years of college, the topic never came up. In fact, the first time it came up with on my first interview where the president of the company asked me what I wanted. Which, of course, is the worst time to suddenly think "oh crap! I never thought about that!"</p>
      <p>Well, the panel seemed unanimous in saying that it was an absurd question and salary should be the last thing talked/worried about.</p>
      <p>Sadly, 10+ years into my career and a half dozen jobs later, I realize they were right. It's still the norm for salary to be discussed at the tail end of a job negotiation.</p>
      <p>Maybe I'm way off base, but I just find it completely backwards. It's naive to think we all work because we love the work. We may, but we work to make money. </p>
      <p>Grr.</p>
      <p>Anyways, so yea, stick to your guns. You are worth what you are worth and nothing less and you don't want a client that is going to try go talk you out of that simple fact.</p>
      <p>Along terminals great pricing story, the one I always liked is: Call up your local licensed, highly recommended plumber and ask them their hourly rate. Charge at least that much. </p>
      <p>"I can’t see him finding better for £200 as mentioned."</p>
      <p>That's the route I'd take. Let him find a solution for that price. He'll either a) love it, in which case you'll learn that he wasn't necessarily interested in quality anyways or b) he'll come running  back to you asking you to fix it for him.</p>
