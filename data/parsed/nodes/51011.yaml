      <p>When prospective clients start putting you down to get you to lower your price, that's the time to walk out. EVERY time I have had this happen and tried to work something out, they ended up wanting more concessions and more and more and more. It is a dispiriting relationship that will NEVER enrich your portfolio because it will affect the work you do for them. </p>
      <p>As Tom Rushlow, an incredible salesmen I worked for said - "Get them to say yes, or push them off the cliff". Now's the time to mentally push them off the cliff. Wish them well and forget about it and go on to your next project. Don't waste any more time wondering if it will work - it won't.</p>
      <p>I said that all very firmly because I have experienced this same behavior in clients and I think it is absolutely the worst relationship you can enter into. But I'm not you, so you'll have to make your own decisions and have your own experiences.</p>
      <p>BTW - I love your site, your work, and your creative ideas. You are definitely worth your price.</p>
      <p>Sharon</p>
