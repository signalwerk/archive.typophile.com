      <p>oh hi there Nick, when I saw Registered Graphic Designer the first thing that popped into my head was RGD?  I was in toronto on Tuesday for DesignThinkers, it's a shame I hadn't realized you were in toronto or I could have met you!</p>
      <p>But you raise a number of great points about education versus experience.  I was going to point out the RGD as an example of quality assurance.</p>
      <p>In Ontario Canada, where Nick and I live, we have an organization called the RGD, Registered Graphic Designers of Ontario.  No, you don't need to have any formal deign education to join the RGD, but you must pass a test proving your knowledge is at a certain level on-par with our current college design education.</p>
      <p>It's relatively easy and possible for somebody trained elsewhere besides Ontario, to come here and take the test and pass and become RGD, just as it's painless for somebody with life experience to take the test and become and RGD.</p>
      <p>What having that title allows you is a bargaining token.  It doesn't matter whether you went to school or not, if you're RGD they have some assurances that you do *know* your stuff, and you can use that by saying: hey, I'm RGD, what's that worth to you to have a tested and proven designer working for you.</p>
      <p>I'm not surewhat similar groups or organizations exist where you are, but that might be a sort of proof of your skill, as well as some insurance that could make potential clients feel reassured that you do know your stuff, even if you don't have an extensive portfolio to show them.</p>
      <p>As for getting a portfolio, I recognize your need to eat, and I don't want to discourage you from professional work, but I will share a little secret with you.  I have done professional work, school work and personal work, and the work I find is often the strongest is the personal work.  Why?  Because I'm more passionate about the charities and causes I'm providing the work for.</p>
      <p>I have been involved in a number of open-source projects who are starving for designers, you can literally take your pick, but the oppurtunities and experience I have gotten in 3 years of open-source development were equal to 3 years of professional work in jobs I couldn't get yet.  Game design, UI design and software user experience design.</p>
      <p>I would strongly recommend you go find a church organization, a charity, a student group at a local school or an open-source project that you identify with, and one you feel passionate about, and design a few posters, identities, web layouts or whatever they need.</p>
      <p>I hope this advice helps, I'm a young designer myself and I'm sure my advice is worth pennies compared to some of the greats on this forum :-)</p>
