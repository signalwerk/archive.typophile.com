    <p>I am still pretty new to freelance, but things are moving so fast now. I need an few figures from you guys on how much your would charge for something such as a letterhead, business card and logo design?? My client is starting up his new consulting company and needs this designing. He asked me how much it would cost, so I said, you give me a fair price and we can go from there, he came back with £200. I was thinking more along the lines of £300/£400. I did some work recently for his hair salon which he was very impressed by, and we also get along great. But, it has potential for more and more commissions as he likes my work a lot. I also charge by the project. I don't want to scare him off by overcharging cause he is a polite guy and don't want him to feel like I am ripping him off.</p>
    <p>Peace guys!</p>
    <p>Dahl.</p>
  html_clean: |-
    <p>I am still pretty new to freelance, but things are moving so fast now. I need an few figures from you guys on how much your would charge for something such as a letterhead, business card and logo design?? My client is starting up his new consulting company and needs this designing. He asked me how much it would cost, so I said, you give me a fair price and we can go from there, he came back with £200. I was thinking more along the lines of £300/£400. I did some work recently for his hair salon which he was very impressed by, and we also get along great. But, it has potential for more and more commissions as he likes my work a lot. I also charge by the project. I don't want to scare him off by overcharging cause he is a polite guy and don't want him to feel like I am ripping him off.</p>
