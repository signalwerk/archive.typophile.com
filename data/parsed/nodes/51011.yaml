      <p>I would rather do a job for free than for a price I felt was too low. I would tell this to my students, who were constantly being taken advantage of under the guise of "Your a student, do this job for peanuts to build your portfolio."</p>
      <p>If a beginner truly needs the work for a portfolio, doing it for free allows them to maintain all the control. You can't be pushed into places where you feel uncomfortable, because your response is "I'm doing this for free".</p>
      <p>You'll get the results you want, under the time constraints that work for you. And let's face it, getting $200 for a $3000 job, and relinquishing all the power in the relationship is no way to stay healthy.</p>
