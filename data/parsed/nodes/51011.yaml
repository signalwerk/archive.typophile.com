      <p>Just to clarify my position, I don't think there are any villains here.<br>
      Like the man said, "if I'm the man, then you're the man, and he's the man as well..." --which is to say that in business much is negotiable by everyone and all parties, and the bottom line is the bottom line.<br>
      So I don't find the attitude of BabyDoll's client insulting, it's just a negotiating position.<br>
      It would be an insult to someone with a design education or more experience, but that's a hypothetical unreality.<br>
      From his standpoint, to maximize his remuneration, Daniel can make the case for the quality of his work and his commitment.</p>
