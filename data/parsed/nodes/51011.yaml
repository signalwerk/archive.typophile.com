      <p>The equation: </p>
      <p>Amount of money you want to make in a year to cover your salary, expenses, insurance, rent, etc DIVIDED BY the number of *billable* hours you can work a year = your hourly rate</p>
      <p>That's a simplification, and doesn't take into consideration premium talent or service, but it's surprising how few people actually even figure that basic equation out before trying to figure out what to charge for their time.</p>
