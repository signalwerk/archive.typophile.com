      <p><cite>…he came back with £200.</cite></p>
      <p>That’s a not nearly enough.</p>
      <p><cite>But, it has potential for more and more commissions as he likes my work a lot.</cite></p>
      <p>The only potential this has is the potential for him to tell the same bullshit to the designer who does his web site for £200, his advertising for £200, and so on. Tell him that if he wants a £200 identity, he can go buy a stock identity online. Otherwise, give him an estimate based on your hourly rate and then charge him for the work you do.</p>
