      <div class="comment-spam-body"><p>Here's one that could perhaps be better than the other suggestions at capturing the flavor of the handwritten bold letters in your 18th century Spanish Map. It's based on the handlettered titles, captions and place labels in Henri Abraham Chatelain’s Atlas Historique. Brian Wilson's Antiquarian <a href="http://www.myfonts.com/fonts/3ip/antiquarian/" title="http://www.myfonts.com/fonts/3ip/antiquarian/">http://www.myfonts.com/fonts/3ip/antiquarian/</a><br>
      Don</p>
      </div>
