    html: "<p>Just FYI: There's a wonderful paper store in Los Angeles called McManus &amp; Morgan that sells marbled and other hand-made papers. In a discussion about reproducing one his marbled papers the owner cautioned me that all the papers he sells are under copyright, owned by the individual makers.</p>"
