    html: <p>Adrian Wilson's book, <a href="http://www.amazon.com/exec/obidos/tg/detail/-/081180304X/qid=1080146064/sr=1-1/ref=sr_1_1/104-1853061-7901521?v=glance&amp;s=books">The Design of Books</a> refers to endpapers. When the book is laid flat, the papers frame the page spread. They're a wonderful design element when chosen carefully.</p>
