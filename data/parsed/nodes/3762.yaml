  - id: 28345
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>And those paper makers will come after you too!. Years ago I used a piece of marble paper as a background for a cover design on a library magazine. I didn't realize the design of the marble paper was copyright protected. The artist contacted the magazine and we payed the artist for the usage. <br> <br>Isn't it amazing that a piece of marble paper can be protected by copyright in the U.S., but a typeface design cannot. A typeface is too utilitarian, but marble paper not so.</p>
    html_clean: <p>And those paper makers will come after you too!. Years ago I used a piece of marble paper as a background for a cover design on a library magazine. I didn't realize the design of the marble paper was copyright protected. The artist contacted the magazine and we payed the artist for the usage. <br> <br>Isn't it amazing that a piece of marble paper can be protected by copyright in the U.S., but a typeface design cannot. A typeface is too utilitarian, but marble paper not so.</p>
