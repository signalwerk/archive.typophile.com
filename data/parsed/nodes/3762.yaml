    html: <p>&gt;the design of the marble paper was copyright protected <br> <br>I can understand that, because each piece of marbled paper is unique, and as such more art than design. <br> <br>So, while one may not be able to copyright a typeface when it is considered as a vectored design, if an original piece of "real" artwork (ie one-off ink on paper drawing) exists of the individual characters, perhaps it can be argued that THOSE images are copyrightable, and therefore claim type copyrights by this argument....</p>
