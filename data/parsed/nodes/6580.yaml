    html: "<p>Hello, <br> <br>I'm a native German speaker. Paul Davidson is right. <br>And from the syllables and meaning of the word it's separated Ak-zidenz (pronounced ak-tsiden(t)s). Or as in the form of writing Gregory used: Ak-tsee-den(t)s. The later normally isn't spoken as hard as the Z at the beginning, more like an s. <br> <br>The idea with a spoken database is good. Should contain names too.</p>"
