    html: "<p>(please excuse my humble english - ask if something is not clearly understandable - correct me, for I can improve) <br> <br>\"Akzidenz\" has a latin origin. It comes from \"accido\".  <br>\"Accido\" itself is a combination of \"ad\" (in combination with c... changed to ac ...)(it means \"to\") and \"cado\" which means \"falling\" (also in the sense of falling to something = joining) - so it means \"(the characteristic) falling to something\".  <br>\"c\" in latin is pronounciated differently: before i and e its like \"ts\" - before other vowels and after vowels its like \"k\". <br> <br>\"accidentia\" or \"accidens\" means the non-essential, the changing, the things by coincidence or chance. It means features or characteristics that are secondary to something, not their essential being. <br>In philosophy we distinguish between \"substantia\" and \"accidentia\". accidentia are characteristics that belong to something, its taste, colour, and so on, but that can change without changing its being, its substantia. <br> <br>In typography (in German language tradition) \"Akzidentia\" are all printing jobs by chance, prospects, folders, flyers, letterheads, business cards, ads. They require individual design and often other type than standard \"Werksatz\" (sorry, my english hasn't developed to typographycal terms yet, maybe it could be described as \"standard working typography\") for books, magazines, and newspapers. <br>Their design has to attract more attention. They are changing more often than the longlasting principles of good and readable book/newspaper design. On the other hand their characteristics in design changes, but their substance is the same, for example ads. <br>I find the name \"Akzidenz\" a very interesting parallel between philosophy and typography. <br> <br>The use was naming the font: <br>As far as I know, Sanserifs were first used for ads and posters - typical \"Akzidenzien\", so this font was named after its use. <br> <br></p>"
    html_clean: "<p>(please excuse my humble english - ask if something is not clearly understandable - correct me, for I can improve) <br> <br>\"Akzidenz\" has a latin origin. It comes from \"accido\".  <br>\"Accido\" itself is a combination of \"ad\" (in combination with c... changed to ac ...)(it means \"to\") and \"cado\" which means \"falling\" (also in the sense of falling to something = joining) - so it means \"(the characteristic) falling to something\".  <br>\"c\" in latin is pronounciated differently: before i and e its like \"ts\" - before other vowels and after vowels its like \"k\". <br> <br>\"accidentia\" or \"accidens\" means the non-essential, the changing, the things by coincidence or chance. It means features or characteristics that are secondary to something, not their essential being. <br>In philosophy we distinguish between \"substantia\" and \"accidentia\". accidentia are characteristics that belong to something, its taste, colour, and so on, but that can change without changing its being, its substantia. <br> <br>In typography (in German language tradition) \"Akzidentia\" are all printing jobs by chance, prospects, folders, flyers, letterheads, business cards, ads. They require individual design and often other type than standard \"Werksatz\" (sorry, my english hasn't developed to typographycal terms yet, maybe it could be described as \"standard working typography\") for books, magazines, and newspapers. <br>Their design has to attract more attention. They are changing more often than the longlasting principles of good and readable book/newspaper design. On the other hand their characteristics in design changes, but their substance is the same, for example ads. <br>I find the name \"Akzidenz\" a very interesting parallel between philosophy and typography. <br> <br>The use was naming the font: <br>As far as I know, Sanserifs were first used for ads and posters - typical \"Akzidenzien\", so this font was named after its use. <br> <br></p>"
