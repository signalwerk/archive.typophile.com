    html: "<p>Another one that's always pronounced wrong is \"Univers\" which is a French word (no end-\"e\"): &lt;ü-nee-v-airr&gt;. I doubt native English speaking people can pronounce the opening vowel properly, as the German \"ü\"/Dutch \"uu\" is a sound they can't reproduce (in fact, it's not even possible to write down a phonetic equivalent in English). It'll sound like \"oo\". <br> <br>The same problem arises with \"Eurostile\" which is pronounced: &lt;eu-ro-steel&gt;. Here again, the opening vowel is totally alien to the English language and will most likely get bastardized to \"you\" by native English speakers. <br> <br>Regarding \"Akzidenz\", I think Gregory was right, Paul. There are different ways of pronouncing the \"z\" in German in relation to specific letter combinations, and I doubt the combination \"kz\" sounds like &lt;kts&gt;. Are there any native German speakers on the board to enlighten us?</p>"
    html_clean: "<p>Another one that's always pronounced wrong is \"Univers\" which is a French word (no end-\"e\"): &lt;ü-nee-v-airr&gt;. I doubt native English speaking people can pronounce the opening vowel properly, as the German \"ü\"/Dutch \"uu\" is a sound they can't reproduce (in fact, it's not even possible to write down a phonetic equivalent in English). It'll sound like \"oo\". <br> <br>The same problem arises with \"Eurostile\" which is pronounced: &lt;eu-ro-steel&gt;. Here again, the opening vowel is totally alien to the English language and will most likely get bastardized to \"you\" by native English speakers. <br> <br>Regarding \"Akzidenz\", I think Gregory was right, Paul. There are different ways of pronouncing the \"z\" in German in relation to specific letter combinations, and I doubt the combination \"kz\" sounds like &lt;kts&gt;. Are there any native German speakers on the board to enlighten us?</p>"
