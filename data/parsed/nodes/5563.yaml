  date_raw: 10 Jul 2004 — 10:50am
  votes: null
  html: <p>Hi, I am a Mac support person who has been holding back my designers from moving to OSX because of the Quirk (Quark) issues, I have been migrating some of them to InDesign (some kicking and screaming, some not) and I want to settle on a font repair and font manager so I decide to ask you font pros what you like.   <br>I am leaning toward Font Agent Pro because of the repair tool but don't think it is very intuitive,  I like Master Juggler because it is from Alsoft who makes DiskWarrior which I LOVE, I could not do my job without it.  <br>Please add a note on your OS and application, 10.3.2 and Indesign for example. <br>What font manager works for you?  <br>What does not?   <br>Issues, likes and dislikes? <br>Reliability? <br>Thanks, <br>vudutu </p>
  html_clean: <p>Hi, I am a Mac support person who has been holding back my designers from moving to OSX because of the Quirk (Quark) issues, I have been migrating some of them to InDesign (some kicking and screaming, some not) and I want to settle on a font repair and font manager so I decide to ask you font pros what you like.   <br>I am leaning toward Font Agent Pro because of the repair tool but don't think it is very intuitive,  I like Master Juggler because it is from Alsoft who makes DiskWarrior which I LOVE, I could not do my job without it.  <br>Please add a note on your OS and application, 10.3.2 and Indesign for example. <br>What font manager works for you?  <br>What does not?   <br>Issues, likes and dislikes? <br>Reliability? <br>Thanks, <br>vudutu </p>
