      <p>I used to use Font Reserve when I ran OS 9, and while generally satisfied, I had annoyingly frequent enough database corruption issues, which forced me to rebuild my libraries over and over again manually. That I did not like.</p>
      <p>I was floundering on OS X until Linotype Font Explorer X came out. The only thing I miss in it over Font Reserve is the ability to print sample sheets in various configurations. It is much more stable and has far better sorting options. I've heard some bad things about the latest update, though, so I'm hesitating to install it until the next patch comes in.</p>
