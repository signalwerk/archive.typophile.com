    html: <p>Suitcase is poo. <br> <br>* It tells me some fonts are damaged, even though they're straight copies from a Linotype disc. <br> <br>* Autoactivation is a joke. With Adobe CS apps I activate in Suitcase, switch back to app, font not there, click outside text box, click inside again, font appears. <br> <br>* Any other apps, you don't get autoactivation anyway (I don't run Quark) and must quit and relaunch. <br> <br>* It regularly hangs, and likes to take down other apps with it. <br> <br> <br>This is on a dual G5 with up to date patches, btw. <br> <br>Having said all this, I'm not sure there's anything better than Suitcase out there. Being a large(ish) company, it's likely Extensis will get there act together sometime soon.</p>
