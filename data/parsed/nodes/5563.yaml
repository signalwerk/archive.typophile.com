      <p>vudutu,</p>
      <p>Glad to see your a Master Juggler fan. I've tried all of the font managers and I like MJ the best. To me it works very much like the old ATM Deluxe that had so many fans back in pre-X days.</p>
      <p>I think MJ's biggest advantage is not building its own database of the fonts. It just turns them on and off, anywhere they are located, and it doesn't have to be running all the time. Launch, active your fonts, quit. It does lack an auto-activation, but I was told by Alsoft that that would be in an upgrade. I fear that the upgrade may be a long wait since MJ is definitly a cult font manager at this point.</p>
      <p>James</p>
      <p>10.4.2 with the CS suite</p>
