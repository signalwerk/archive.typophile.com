    html: |-
      <p>Linotype Font Explorer was just updated on July 10; maybe the doubters can give it another try. I've been loving it; it works the way I want a font manager to do. I don't like the ones that make their own secret copy of things or move my data around. FontExplorer adds some iTunes-like features, like making new sets from any fonts already activated or added.</p>
      <p>I use font managers to test fonts in development, so my usage is probably different from that of most graphic designers, but the convenience of activation is the big hook for me, and that's useful to anyone with a lot of fonts they don't want installed permanently.</p>
