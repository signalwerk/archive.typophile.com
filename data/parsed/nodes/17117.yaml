    <p>Hello. I just started designing OpenType typefaces and have a problem with the fractions.<br>
    Can anyone tell me if something is wrong with this:</p>
    <p>feature frac { # Fractions<br>
      sub [one one.onum] [slash fraction] [two two.onum] by onehalf;<br>
    } frac;</p>
    <p>Thanks!<br>
    Pieter</p>
