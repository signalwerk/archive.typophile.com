    date_raw: 6.Jan.2006 9.34am
    votes: null
    html: |-
      <p>Then your frac will look like this, (also incorporating the perthousand and percent subs Mr Connare suggested):</p>
      <p>feature frac { # Fractions<br>
       # Latin<br>
          sub @class_0 @class_slash @class_0 @class_0 by perthousand;<br>
          sub @class_0 @class_slash @class_0 by percent;<br>
          sub @class_1 @class_slash @class_4 by onequarter;<br>
          sub @class_1 @class_slash @class_2 by onehalf;<br>
          sub @class_3 @class_slash @class_4 by threequarters;<br>
      } frac;</p>
    html_clean: |-
