      <p>Pieter, here’s what I would do...</p>
      <p>Create classes for your numerals like this:</p>
      <p>@class_0 = [zero zero.OP];<br>
      @class_1 = [one one.OP];<br>
      @class_2 = [two two.OP];<br>
      @class_3 = [three three.OP];<br>
      @class_4 = [four four.OP];<br>
      @class_5 = [five five.OP];<br>
      @class_6 = [six six.OP];<br>
      @class_7 = [seven seven.OP];<br>
      @class_8 = [eight eight.OP];<br>
      @class_9 = [nine nine.OP];</p>
