  html: |-
    <p>For one week only we are excited to be able to offer you an exclusive<br>
    discount on entries for the first ever Type Annual awards. Between now and Wednesday October 20 we are delighted to offer you a £5 discount on single entries and £15 on group entries. Simply register below.</p>
    <p>The Type Annual will showcase typeface design itself rather than work that uses type, creating, we hope, a showcase of the best crafted, most innovative and most exciting typefaces produced during entry period – October 2009 to October 2010.<br>
    To be eligible for inclusion, typefaces must have been first released or used within this period. Selected work will be printed in a special February issue of Creative Review.</p>
    <p>The categories are:<br>
    Display, Text, Bespoke,Non-Latin</p>
    <p>The judges will be asked to select work in each category – there are no winners or runners-up and no limit to the number of typefaces to be selected. In addition, the judges will select those of outstanding merit to feature in the Best in Book section.</p>
    <p>For more information please email <a href="mailto:s.davies@centaur.co.uk">s.davies@centaur.co.uk</a> or check out <a href="http://www.typeannual.co.uk" title="www.typeannual.co.uk">www.typeannual.co.uk</a></p>
