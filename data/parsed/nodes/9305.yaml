  - id: 60208
    user_id: 5939
    user_name: keith_miller
    user_path: null
    date_raw: 9 Mar 2005 — 10:37pm
    date: 2005-03-09T22:37:00
    votes: null
    html: "<p>Thanks very much for the comments. The terminals of the a and f are indeed worrying, particularly the f for some reason. I find Zapf's solution for Palatino too cramped, though it works visually, but the swoop of the renaissance humanist fs are unsettling. I'm trying for something in between, with a broken counter space that echoes the lower loop of the g, but it still lacks grace. Too stiff and upright. I'll keep working on it. The reason for the triangular terminals: I'm trying to create a sort of tinkly harmony among all the serifs - this may be more clear in a PDF. It may also be unsuccessful. The font was indeed created using 12 point as a basis. Hadn't thought that smaller sizes would need a different contrast. Thanks for that comment, Christian; I'll read up on it. I think the spacing does need work - should be slightly broader. Now, can one be Trajaned out? I find that typeface spectacular, can't look enough at it. I'm stealing some of its lettershapes because they fit the clean vibe I'm going for. Keith</p>"
