    date_raw: 27 Feb 2005 — 7:54am
    date: 2005-02-27T07:54:00
    votes: null
    html: "<p>Oooh great, a comment! Thanks, Paul. It took me days to figure out how to make the GIF, but I'll try this PDF thing as well. Why? Will it be clearer? My purpose: I'm a novelist (The Book of Flying), and concocted this kooky idea that my books should be in my own private font. This was three years ago. Since then I've learned lots about fonts, and about how bad I am at making them, and about how addictive it is. This is about my fortieth attempt; I learn a bit with each design. I want a clean, pretty, readable font. I've looked hard at Palatino, Bembo, Baskerville, Galliard among others. Keith</p>"
  - id: 60194
    user_id: 4406
    user_name: raph
    user_path: null
    date_raw: 27 Feb 2005 — 7:30pm
    date: 2005-02-27T19:30:00
    votes: null
    html: "<p>Yes, a PDF will be quite a bit clearer: you can magnify it without blurring. <br> <br>I think having your own private font for your books is a great reason to make new fonts, and this one looks like a nice start at a clear, readable, but distinctive font. <br> <br>I don't have much to say about the shapes (maybe the lower serif of lc and cap S is a bit light), but the spacing definitely needs work. I recommend this <a href=\"http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_20.pdf\">tutorial</a> as a start. <br> <br>The serifs look like Novarese (or maybe Fenice, another of his). I can see the Galliard influence strongly in the in the caps. Go for it!</p>"
