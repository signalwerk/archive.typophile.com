    html: '<p>Oooh great, a comment! Thanks, Paul. It took me days to ﬁgure out how to make the <span class="caps">GIF</span>, but I’ll try this <span class="caps">PDF</span> thing as well. Why? Will it be clearer? My purpose: I’m a novelist (The Book of Flying), and concocted this kooky idea that my books should be in my own private font. This was three years ago. Since then I’ve learned lots about fonts, and about how bad I am at making them, and about how addictive it is. This is about my fortieth attempt; I learn a bit with each design. I want a clean, pretty, readable font. I’ve looked hard at Palatino, Bembo, Baskerville, Galliard among others.&nbsp;Keith</p>'
    html_clean: '<p>Oooh great, a comment! Thanks, Paul. It took me days to ﬁgure out how to make the <span class="caps">GIF</span>, but I’ll try this <span class="caps">PDF</span> thing as well. Why? Will it be clearer? My purpose: I’m a novelist (The Book of Flying), and concocted this kooky idea that my books should be in my own private font. This was three years ago. Since then I’ve learned lots about fonts, and about how bad I am at making them, and about how addictive it is. This is about my fortieth attempt; I learn a bit with each design. I want a clean, pretty, readable font. I’ve looked hard at Palatino, Bembo, Baskerville, Galliard among others.&nbsp;Keith</p>'
  - id: 60208
    user: 5939
    date: 2005-03-10T00:37:00
    date_raw: 10 March 2005 - 12:37am
    votes: 0
    html: '<p>Thanks very much for the comments. The terminals of the a and f are indeed worrying, particularly the f for some reason. I ﬁnd Zapf’s solution for Palatino too cramped, though it works visually, but the swoop of the renaissance humanist fs are unsettling. I’m trying for something in between, with a broken counter space that echoes the lower loop of the g, but it still lacks grace. Too stiﬀ and upright. I’ll keep working on it. The reason for the triangular terminals: I’m trying to create a sort of tinkly harmony among all the serifs — this may be more clear in a <span class="caps">PDF</span>. It may also be unsuccessful. The font was indeed created using 12 point as a basis. Hadn’t thought that smaller sizes would need a diﬀerent contrast. Thanks for that comment, Christian; I’ll read up on it. I think the spacing does need work — should be slightly broader. Now, can one be Trajaned out? I ﬁnd that typeface spectacular, can’t look enough at it. I’m stealing some of its lettershapes because they ﬁt the clean vibe I’m going for.&nbsp;Keith</p>'
    html_clean: '<p>Thanks very much for the comments. The terminals of the a and f are indeed worrying, particularly the f for some reason. I ﬁnd Zapf’s solution for Palatino too cramped, though it works visually, but the swoop of the renaissance humanist fs are unsettling. I’m trying for something in between, with a broken counter space that echoes the lower loop of the g, but it still lacks grace. Too stiﬀ and upright. I’ll keep working on it. The reason for the triangular terminals: I’m trying to create a sort of tinkly harmony among all the serifs — this may be more clear in a <span class="caps">PDF</span>. It may also be unsuccessful. The font was indeed created using 12 point as a basis. Hadn’t thought that smaller sizes would need a diﬀerent contrast. Thanks for that comment, Christian; I’ll read up on it. I think the spacing does need work — should be slightly broader. Now, can one be Trajaned out? I ﬁnd that typeface spectacular, can’t look enough at it. I’m stealing some of its lettershapes because they ﬁt the clean vibe I’m going for.&nbsp;Keith</p>'
