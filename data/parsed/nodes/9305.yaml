    date_raw: 27 February 2005 - 9:30pm
    votes: 0
    html: '<p>Yes, a <span class="caps">PDF</span> will be quite a bit clearer: you can magnify it without blurring. <br><br>I think having your own private font for your books is a great reason to make new fonts, and this one looks like a nice start at a clear, readable, but distinctive font. <br><br>I don’t have much to say about the shapes (maybe the lower serif of lc and cap S is a bit light), but the spacing deﬁnitely needs work. I recommend this <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_20.pdf">tutorial</a> as a start. <br><br>The serifs look like Novarese (or maybe Fenice, another of his). I can see the Galliard inﬂuence strongly in the in the caps. Go for&nbsp;it!</p>'
    html_clean: '<p>Yes, a <span class="caps">PDF</span> will be quite a bit clearer: you can magnify it without blurring. <br><br>I think having your own private font for your books is a great reason to make new fonts, and this one looks like a nice start at a clear, readable, but distinctive font. <br><br>I don’t have much to say about the shapes (maybe the lower serif of lc and cap S is a bit light), but the spacing deﬁnitely needs work. I recommend this <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_20.pdf" class="link-external">tutorial</a> as a start. <br><br>The serifs look like Novarese (or maybe Fenice, another of his). I can see the Galliard inﬂuence strongly in the in the caps. Go for&nbsp;it!</p>'
