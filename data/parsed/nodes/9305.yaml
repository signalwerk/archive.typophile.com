    html: '<p>It’s a very renaissance author that does his own fonts. What a cool idea. I’d be interested to read some of your work, and compare your literary voice to the voice of the type.  <br><br>As you get further along in your project I would recommend you print out some samples, head down to the book store and compare it to some books that you admire. <br><br>It’s hard to give speciﬁc feedback from the <span class="caps">GIF</span>, but a few things that jump out: <br><br>The terminals on a,f need some thought. They feel light, and maybe too sharp. I’m not convinced that the monumental M and N are appropriate for book type. Maybe on a marble pillar, but not in body copy. Maybe I’m just all Trajaned out. The terminal on your y could use a good scrubbing too. <br><br>Isaac is right about the stroke contrast. Most of the computer types out there are optically tuned for about 12 point, which is huge in book text land. This puts their optical size right between display and text. <a href="http://studio.adobe.com/us/type/main.jsp?xhtml=topics/opticalsize">Here</a> [adobe.com] is a good piece on optical sizes. As you get smaller, the dimensions and weight of your characters should change. Your characters look like they are tuned for display sizes. <br><br>As for spacing, you will ﬁnd that it will do as much to inﬂuence the look of your types on the page as the details of the characters. Just like you’ve referenced diﬀerent types determine the character shapes, the easiest way to learn spacing is to look at existing&nbsp;faces.</p>'
    html_clean: '<p>It’s a very renaissance author that does his own fonts. What a cool idea. I’d be interested to read some of your work, and compare your literary voice to the voice of the type.  <br><br>As you get further along in your project I would recommend you print out some samples, head down to the book store and compare it to some books that you admire. <br><br>It’s hard to give speciﬁc feedback from the <span class="caps">GIF</span>, but a few things that jump out: <br><br>The terminals on a,f need some thought. They feel light, and maybe too sharp. I’m not convinced that the monumental M and N are appropriate for book type. Maybe on a marble pillar, but not in body copy. Maybe I’m just all Trajaned out. The terminal on your y could use a good scrubbing too. <br><br>Isaac is right about the stroke contrast. Most of the computer types out there are optically tuned for about 12 point, which is huge in book text land. This puts their optical size right between display and text. <a href="http://studio.adobe.com/us/type/main.jsp?xhtml=topics/opticalsize" class="link-external">Here</a> [adobe.com] is a good piece on optical sizes. As you get smaller, the dimensions and weight of your characters should change. Your characters look like they are tuned for display sizes. <br><br>As for spacing, you will ﬁnd that it will do as much to inﬂuence the look of your types on the page as the details of the characters. Just like you’ve referenced diﬀerent types determine the character shapes, the easiest way to learn spacing is to look at existing&nbsp;faces.</p>'
