    <p>What is truly "pushing forward" verses following trends in type design? I'm not sure what sociological mindset there is today, besides the political—a love for the current president of the Unites States, and something of a Robin Hood idea of the Occupy movement. At least that's what's going on in America, I don't know so much about the rest of the world. How does one express that, or react to it, with type? Those notions and movements are not really new at all, just in their place and specific circumstances. And certainly nationality is not a new piece of vocabulary for type.</p>
    <p>Thinking about it, there is a definite movement towards natural &amp; organic, sustainability, and equal rights (marriage) for same sex and other challenging views on marriage, or non-marriage or whatever the case may be. These are to an extent expressed in recent typefaces, whether consciously or not, such as the many organic types, or the pairing of a sans with a sans (Sense &amp; Sensibility).</p>
    <p>Should political and social movements influence type? And to what extent?</p>
    <p>(this is stemming from <a href="http://typophile.com/node/91021#comment-499892" rel="nofollow">this thread</a>)</p>
