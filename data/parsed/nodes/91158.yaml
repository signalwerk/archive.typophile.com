      <p>Perhaps a prelude to your question is in order: to what extent can the design of a typeface imply or suggest any attitude?</p>
      <p>Certainly, attitudes like silly, creepy, quaint, charming, impetuous and the like are easily enough communicated, but what are the essential qualities of any social movement, and how are these qualities conveyed? What is an economically just letterform? Can a serif be unbiased? What does an ampersand for the 99% look like?</p>
      <p>These are not idle questions; I really would like to know...</p>
