    <p>Wasn’t sure where to put this - because it’s both a technical and an aesthetic question. </p>
    <p>I’m cleaning up workflow at a magazine that’s small but growing very, very quickly, and the staff before me just went crazy designing thousands of ads for clients over the course of 3 years because there wasn’t a standard list for them to choose from. This has resulted in a multitude of costly problems for production. We’re in a process of synchronization right now.</p>
    <p>So, I need a couple of common serif fonts, a couple of sans serif, and whatever comes in between that’s diverse enough to meet the advertising needs of hundreds of clients that aren’t creating ads themselves. This is NOT for our house identity - they’re just for Regular Joe Restaurant, etc., who call us up and want to pay for an ad and need us to design it quickly.</p>
    <p>So, I need a list sort of like:</p>
    <p>AvantGardeITC<br>
    BaskervilleMT<br>
    BauerBodoni<br>
    FranklinGothic<br>
    Frutiger<br>
    GillSans<br>
    Myriad<br>
    OfficinaSans<br>
    OfficinaSerif</p>
    <p>But I don’t want ad designers flipping out because the list isn’t diverse enough to do what they need. You know? Help.</p>
