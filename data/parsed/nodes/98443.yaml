    html: <p>Brill started working with trial  versions of the roman and italic in Summer 2011, but their CEO didn't want to make any official release until the bold and bold italic weights were finished (with which I had help from Alice Savoie last year). So the finalised EULA, official website, etc. were all prepared for the launch of the anniversary celebrations last November. Unusually for a typeface design, Brill gave the project a lot of publicity while it was in progress, in their company reports and at book fairs and conferences, so that might be why it seems to have been around longer. It's been a part of my life since 2008!</p>
