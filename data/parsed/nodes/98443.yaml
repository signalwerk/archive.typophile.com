      <p>Graham, FYI I myself am only focusing on the type design part.</p>
      <blockquote><p>keep the initial entry fee price down which we hope encourages more entries.</p></blockquote>
      <p>If you don't mind let's do the math (although roughly). Last year there were 173 entries and 13 winners. Choosing a mid-range entry (Type Family, Non-Member) this year's entry fee is $110 and the publication/hanging fee is $100. If you split 13 × $100 = $1,300 into 173 you get $7.51. So if you charged $118 (instead of $110) to enter but did not charge a publication/hanging fee you'd about break even.</p>
      <p>Now, I have to agree that charging $8 more might reduce the number of entries, but maybe not worrying about the $100 fee for winning might offset that. But most of all: it's more straight-forward, more honest; right now it really feels like a "hidden cost" to some people (even though I admit it's not really hidden).</p>
      <p>hhp</p>
