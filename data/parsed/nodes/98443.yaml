    html: |-
      <p>If the typeface is not presented in a way that allows the judges to see how it functions then they cannot judge its value. </p>
      <p>It is not an alphabet drawing contest. </p>
      <p>Doing everything one can to present the entry in the best light is in the best interest of the entrant. I never said the specimen needed to be "flashy". It only needs to present the typeface in the best possible light. </p>
      <p>For a text typeface, a well-set nicely spaced block of text would be appropriate. Setting a text typeface in text sizes would also be appropriate and necessary. A display design would require some display settings at display sizes.</p>
      <p>@Yulia<br>
      Use as many pages as you feel is necessary to present the typeface in the best way.</p>
