      <p>@Arthus<br>
      Your layered entry sounds like a single entry, since individual pieces cannot exist by themselves.<br>
      If it is published/released in 2012 then it has to be entered this year. If you hold off  until 2013 then it should be entered next year.</p>
      <p>My advice to you and all entrants is to make your entry samples look as good as you can and show off the typeface in its very best light. Over the years I've seen so many entries fail because whoever put them together did the most minimum job. Just showing a character set is never going to get you very far, yet many entries do just that. A pity really.</p>
      <p>And with that please refrain from the "All entries should be on a common template and exactly the same". That was done the first year of the competition and I cannot tell you what a mind-numbing hell that was for the judges. The rules give the entrant wide latitude in creating the submission. If you are not a good typographer, by all means have a good typographer help you with the submission.</p>
