      <p>Re. the Typography annual: I really wish there were an off-print version that contained only the winners of the type design competition. The books are thick, and mostly filled with graphic design work that is of no interest to me personally. I can't justify giving them bookshelf space, so donate most volumes to our local library, and send any containing my own work to my mother, the Hudson family archivist.</p>
      <p>I'd really like to have a slim publication that just showed the winners of the type design competition each year, for which I would gladly find shelf space. Collectively, they would represent an important record of developing trends in type design over the past couple of decades.</p>
