      <p>At the moment Graham is at an emergency meeting. He and all of the TDC Board are in a secret bunker dealing with sensitive global typographic issues. As a past president of the TDC I have been asked to answer.</p>
      <p>The expenses don't go to offset the cost of THE traveling exhibit, they go to offset the costs of ALL the traveling exhibits, several of which travel around the world for several years, finally coming to rest at various places for permanent display. So the winner's hanging fees pay for the winning entries exposure via the traveling exhibits and publication in the annual "Typography". Quite a bargain when on thinks of the monthly cost of a full-page ad in one of the design magazines.</p>
      <p>@5star<br>
      If the sculpture is typographic in nature then enter it in Communications Design. If the sculpture is a set of letters that can be manipulated enter it into the Typeface Design.</p>
