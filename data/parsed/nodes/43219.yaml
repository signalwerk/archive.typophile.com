    html: |-
      <p>With all the squared techno fonts out there you'd think this should be easy to match, but the closest resemblance I found, even searching freeware sites, was <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/itc-bolt/" rel="nofollow">ITC Bolt</a>, which has squared counters and the wrong stroke width, or <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/jay-gothic/" rel="nofollow">Jay Gothic Extra Bold</a>, which would need to be flattened/widened and otherwise massaged.</p>
      <p>This leads me to think that it is possibly a custom lettering job.</p>
      <p>- Mike Yanega</p>
