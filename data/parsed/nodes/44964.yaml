    <p>2) If one copies the uppercase glyphs to the lowercase slots, one have to take care to make the kerning work between the sets - effectively doubling the outline data and quadrupling the kerning data. I don't like this redundancy and would prefer to avoid it. But as I use class-kerning anyway this is probably the solution I'll end up using...</p>
    <p>3) One could use the uppercase glyphs as composites in the lowercase slots, but this may perhaps create problems (I don't think I've ever encountered a font with composites in the basic ASCII set - so I guess this is not good...). This would still need 4 times the kerning pairs, but at least the outline data will not be double.</p>
