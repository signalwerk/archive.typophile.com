      <p>Undurprisingly, I agree with Josh. A few more detailed comments.</p>
      <p>2) If you use class kerning, there's zero increase in the amount of kerning data, so I don't understand the concern. The "kerning pairs" are purely virtual.</p>
      <p>3) Composites is a fine idea for OT-TT. For OT-CFF, if the font is built with subroutinization, the duplicate glyphs will add next to nothing to the total size, and you don't need even need to use composites (though it might help you keep things straight during development).</p>
      <p>4) That's a pretty weird choice. And in general, OT features should not map from one character to a different one.</p>
      <p>5) You can assign more than one Unicode point to a glyph, but this has some unfortunate side effects for backtracing Unicode codepoints from glyphs. Given (3), this would seem unnecessary.</p>
      <p>Cheers,</p>
      <p>T</p>
