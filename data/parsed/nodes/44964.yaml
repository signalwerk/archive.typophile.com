      <p>Thanks for the extra suggestion and comments. Much appreciated.<br>
      And if not even Adobes own font expert knows of a special clever way to make uppercase-only fonts, then probably no-one does. ;)</p>
      <p>As I thought: I'll make, kern and space the uppercase, and then copy them to the lowercase slots before adding the diacritics as composites - using class-kerning based on the kerning of the uppercase glyphs. This will leave _some_ "redundant" data, but is probably the best option compatibility- and encoding-wise... Better to make a normal, working font, than risk trouble by being "clever". :)</p>
      <p>Roger</p>
