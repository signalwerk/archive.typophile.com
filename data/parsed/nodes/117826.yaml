    html: "<p>Unfortunately, can't state if it's hand-drawn or typeset using many alternates. But to follow Kevin's great suggestions, I suggest not stopping to each individual font but having also a look to their corresponding foundries: <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Trial_by_Cupcakes/\" rel=\"nofollow\">Trial by Cupcakes</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Magpie_Paper_Works\" rel=\"nofollow\">Magpie Paper Works</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Emily_Lime\" rel=\"nofollow\">Emily Lime</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Laura_Worthington\" rel=\"nofollow\">Laura Worthington</a> plus <strong><a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Debi_Sementelli_Type_Foundry\" rel=\"nofollow\">Debi Sementelli</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Great_Lakes_Lettering\" rel=\"nofollow\">Great Lakes Lettering</a> and <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Eurotypo\" rel=\"nofollow\">Eurotypo</a></strong></p>"
