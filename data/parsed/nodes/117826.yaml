      <p>With contextual alternates and stylistic sets, a typeface can approximate the variability of a hand-drawn script. While I didn't find a match to your sample, the fonts below may be decent alternatives:</p>
      <p><a href="http://www.myfonts.com/fonts/trial-by-cupcakes/quickpen/regular/" title="http://www.myfonts.com/fonts/trial-by-cupcakes/quickpen/regular/">http://www.myfonts.com/fonts/trial-by-cupcakes/quickpen/regular/</a><br>
      <a href="http://www.myfonts.com/fonts/magpiepaperworks/ondise/regular/" title="http://www.myfonts.com/fonts/magpiepaperworks/ondise/regular/">http://www.myfonts.com/fonts/magpiepaperworks/ondise/regular/</a><br>
      <a href="http://www.myfonts.com/fonts/magpiepaperworks/dasha/" title="http://www.myfonts.com/fonts/magpiepaperworks/dasha/">http://www.myfonts.com/fonts/magpiepaperworks/dasha/</a><br>
      <a href="http://www.myfonts.com/fonts/emily-lime/peoni-pro/" title="http://www.myfonts.com/fonts/emily-lime/peoni-pro/">http://www.myfonts.com/fonts/emily-lime/peoni-pro/</a><br>
      <a href="http://www.myfonts.com/fonts/laura-worthington/adorn/" title="http://www.myfonts.com/fonts/laura-worthington/adorn/">http://www.myfonts.com/fonts/laura-worthington/adorn/</a> (turn on Stylistic Sets)</p>
