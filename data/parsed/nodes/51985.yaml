      <p>I’ll add to James Mosley’s post: my <em>Micerino</em> is nothing else than an excercise directly based on James’ own <em>Tivoli</em> type. Instead of using the source material – which I never had access too – it tries to wrap bezier outlines around the traced glyphs in James’ Type 1 font. It also includes the alternate glyphs from Blake &amp; Stephenson, also in James’ own <em>Tivoli</em> and makes them available as OpenType stylistic alternates. For many reasons, chiefly my own incompetence at the time when I did it, it’s an unsatisfactory typeface. The issues raised by James, Justin Howes’ version – which I wasn’t aware of – and the Font Bureau type are enough for me to safely say I won’t keep on working on this project for now. In fact I haven’t been working on it since early 2007.</p>
      <p>But as this thread attests, there is continued interest in the type: the Whitney museum has used one of the various versions – I think it’s the Font Bureau one – for its <a href="http://whitney.org/www/2008biennial/www/?section=home" rel="nofollow">Biennial 2008 Web site</a>, for example.</p>
