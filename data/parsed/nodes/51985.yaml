    html: |-
      <p><em>In his book on the Underground typeface, Justin Howes notes that Edward Johnston referred to this sample before he began drawing his face.</em></p>
      <p>Just for the record, it may be worth pointing out that this isn’t quite what Justin claimed. He suggested that the maker of the Egyptian and Edward Johnston might both have been independently using the capitals of the first William Caslon’s roman type as a model. It’s a point of view, although it’s not one I agree with; and perhaps Justin would not have pushed the idea very far. At all events, it is unlikely that Johnston ever took any notice of the Caslon Egyptian. I think the resemblances between the two sanserif types, striking though some of them are, were coincidental. It would be safer to say that in both cases the model – at quite some distance – was inscriptional lettering. Johnston’s type, although he claimed in 1937 that it was ‘based on classical Roman capital proportions’, has two letters, G and M, that resemble 15th-century Italian designs and have nothing to do with Rome, nor with the first Caslon type.</p>
      <p>Anyone trying to make a font based on the Caslon Egyptian has problems. The original type appears as a single line in a specimen that was issued by one of the two Caslon typefoundries in London in about 1816. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Caslon - 2E Egyptian 2 a det a 500_3492.jpg"></div><br>
      The materials of this foundry were bought in 1818 by Blake, Garnett, a typefoundry newly established in Sheffield, Yorkshire, which recast the Egyptian in about 1838 under the name of <em>English two line Sans-Surryphs</em> and continued to show it in specimens until the 1850s, when the name of the foundry had become Stephenson, Blake. (Remember that ‘English’ in the name of the type is the body above Pica; the ‘two line’ version was cast on a body roughly equivalent to 28 points.) The type then seems to vanish from British use, but rather strangely it appears as the <em>Two-line Small Pica Gothic</em> that can be seen as late as 1895 in the <em>Seventeenth book of specimens</em> of Mackellar, Smiths &amp; Jordan, Philadelphia.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2E Sans Surryphs 1838 500_3903.jpg"></div><br>
      The page above is from the specimen of Blake &amp; Stephenson of about 1838. Several sorts in the newly cast type had changed for the worse. The new C was now a clumsy design, D was narrower than the original, and O had also been remade. You can see more detail of the original C in the image (which happens to be my own) that is used in the first post at the head of this thread. Had the first matrices been lost or damaged? We do not know, but it seems clear that whoever supplied the new ones was not a skilled operative. The surviving matrices are among the materials of Stephenson, Blake, now with the Type Museum, London. A fount was cast from them for Ian Mortimer, wood engraver and hand press printer in London, who printed a booklet on the type, <em>Caslon’s Egyptian, the first sanserif type</em>, in 1988.<p></p>
      <p>So recreating the ‘original’ Egyptian type is not simple. It is not difficult to make a more authentic C, D and O from the showing of 1816, although copies of this are pretty heavily inked. But the punctuation in the surviving matrices is square, like that of some early slab-serif types. Is it original? There is no sure way of telling, since there is no punctuation in the original showing, which is one reason, among several, for thinking that the type was perhaps experimental and incomplete. There are no figures. And there is a curious kink halfway along the middle stroke of S, a sort that was not replaced.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dulwich Gallery sign 2 JM 5-2000 det 500_5389.jpg"></div><br>
      Justin Howes and I both made our own digital versions of the Egyptian in 2000. Mine is called <em>Tivoli</em>, and I sometimes use it in my own work. Justin’s was adopted for the exterior signs of the Dulwich Picture Gallery in London, a building designed by John Soane, who was of course a pioneer user of sanserifs. <p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/English 2 line Grotesque SB c1850 500_6380.jpg"></div><br>
      We were both unhappy with the G in the revived type, which can be seen in a specimen of the 1850s, above – a letter that it was vital to get right for the Dulwich project. We each made our own versions, based on drawn or architectural sanserif lettering of about 1800. I think it is fair to say that, after several experiments with different designs, some of which were interesting and some of them very odd, Justin adopted a G that was quite close to mine. They were both made by adapting the original C. I made a new Q too.<p></p>
      <p>One might say that making a font of the original Caslon Egyptian is a bit like making Gutenberg’s press. Since there is no complete authentic original to refer to, it calls for a leap of imagination.</p>
