      <p>I agree with Nick that the Figgins ‘Sans-serif’ types (so called) are well worth looking at. In fact it might be said to be that with these types the Figgins typefoundry brought the design into typography, since the original Caslon Egyptian appeared only briefly in a specimen and has never been seen in commercial use. One size of the Figgins Sans-serif appears in a specimen dated 1828 (the unique known copy is in the University Library, Amsterdam). Here is an image from a specimen dated 1832.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1 Figgins - 5P Sans-serif 1832 det 500_4143.jpg"></div><br>
      It is a self-confident design, which in the larger sizes abandons the monoline structure of the Caslon letter for a thick-thin modulation which would remain a standard model through the 19th century, and can still be seen in the ATF Franklin Gothic.<p></p>
      <p>Note that there is no lower-case. That would come, after 1830, with the innovative condensed ‘Grotesque’ of the Thorowgood foundry, which provided a model for type that would get large sizes into the lines of posters. It gave an alternative name to the design, and both the new features – the condensed proportions and the addition of lower-case – broke the link with Roman inscriptional capitals.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2 Thorowgood - 7P Grotesque 1834 2 a 500_6041.jpg"></div><br>
      The appearance of the Figgins and Thorowgood designs marks the acceptance of the sanserif in typography, after a long period when it can be found in other media but when its odd appearance and perhaps the lingering flavour of antiquarian associations seem to have deterred the typefounders. But the antiquarian associations of the design were still there, at least in the smaller sizes, as the specimen of the Pearl size (four and three quarters points) of Figgins’s type shows. It uses the text of the Latin inscription prepared for the rebuilt London Bridge, which was opened on 1 August 1831.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3 Figgins - Pe Sans-Serif 500_6108.jpg"></div><p></p>
