    <p>Hello everybody<br>
    Maybe this topic was already discussed on Typophile, but I wondered if William Caslon IV's Two Lines English Egyptian (1816), considered the earliest example of Sans Serif, had ever been revived as a software font ?<br>
    Thank you very much<br>
