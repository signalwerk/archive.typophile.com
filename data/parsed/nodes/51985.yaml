      <p>Sorry to hijack this Caslon thread with Figgins again, but there isn't much material on the Caslon font, so perhaps the Figgins Sans can throw some light on the early days of sans.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figgins_6688.png"></div><p></p>
      <p>One thing to note is that the Figgins design varied significantly in different sizes, with, among other differences, square punctuation at one size, round at another. It's hard to know whether they were flummoxed as to how to execute this style, or were perhaps experimenting with the idea that more stroke contrast may be appropriate at larger sizes.</p>
      <p>I recently came across the Brevier size of the Figgins face in <em>Bentley's Miscellany</em>, November 1, 1837; so this is how sans faces were used in job work.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Fig_Boz_Spread_5365.jpg"></div><br>
      .<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Figgins_Boz_5029.jpg"></div><p></p>
