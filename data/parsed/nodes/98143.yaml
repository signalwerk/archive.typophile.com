    <p>Hi!</p>
    <p>Six months ago I joined a tech startup as a User Interface Designer. They've been on the market since 2009 and at the time, they created a logo using VAG Rounded. The logo is still the same today... Five lowercase black letters in VAG Rounded regular, nothing else.</p>
    <p>I'd like to know your opinion about this font. Do you find it efficient, fresh, or outdated?<br>
    <a href="http://www.myfonts.com/fonts/adobe/vag-rounded/" title="http://www.myfonts.com/fonts/adobe/vag-rounded/">http://www.myfonts.com/fonts/adobe/vag-rounded/</a></p>
    <p>Thanks!</p>
