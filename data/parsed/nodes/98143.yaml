      <p>It's dated I'd say.</p>
      <p>There was a Seattle start-up back in 03' or thereabouts that used Vag rounded as a branding font and it was as unusual as it was fresh and friendly. They produced some sort of portable Seattle traffic monitoring gadget. I remember being blown away by how well Vag worked for their purpose as the choice was really quite odd. In fact, it was so impressive that I redrew the numbers and promptly <a href="http://dribbble.com/shots/149595-Hamachi" rel="nofollow">used them</a> in my own app (whether it was appropriate is another question :)).</p>
      <p>But in the next few years lots and lots of people started using rounded fonts, including Vag and Omnes, and that diluted their value. Right now I'd say it might still be appropriate to use (heavily) rounded font for a tech logo, but only in specific cases (like a cutesy game development a'la Glitch). They are just too friendly, and so they frequently pass as artificial and fake.</p>
      <p>There's nothing wrong with rounded fonts in high-tech application, it's a great way to humanize the brand, but round it too much and there's a good chance to overdo it. </p>
      <p>PS. A good example of measured rounding is <a href="http://www.myfonts.com/fonts/emtype/geogrotesque/" rel="nofollow">Geogrotesque</a>.</p>
