      <p>Although rounded fonts do seem to be in fashion now in some circles, to me VAG is way too dated. It's a tech company, not a torn-jeans company.</p>
      <p>If there's hope to get them to switch I'm sure people can recommend contemporary rounded fonts - that would serve as a form of continuity.</p>
