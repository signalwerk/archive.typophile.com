  html: |-
    <p>The Spargo family of six typefaces has just released on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/spargo/ " rel="nofollow"> Myfonts.com</a> and on <a class="freelinking external" href="http://www.fontspring.com/fonts/gatf/spargo " rel="nofollow"> Fontspring</a>.</p>
    <p>Spargo is inspired by 20s and 30s American typefaces, often seen on share certificates and other securities.  We thought it was time to bring a touch of transatlantic boom and ebullience to our portfolio of typefaces, not to mention a healthy dose of Roaring 20s spirit. Spargo is the result, offered in six all capitals display typefaces. </p>
    <p>Here are speciments of the six faces...</p>
