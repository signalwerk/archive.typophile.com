    html: |-
      <p>I will love to see OT features supported in all mayor browsers !!!!!</p>
      <p>Firefox (3.5+) already support ligatures (enabled by default), but most web-fonts have then removed when making the "optimized" version of the web.</p>
      <p>Google is now serving my Lobster (1.4) including the all the ligatures, and you can compare how it looks in Firefox vs all the other browsers, and will spot the difference. </p>
      <p>Have a look at this site, for example, in different browsers: <a href="http://bodesigns.com/" title="http://bodesigns.com/">http://bodesigns.com/</a></p>
