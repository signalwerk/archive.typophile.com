  html: |-
    <p>Now that webfonts are supported by all major browsers, more and more professional fonts are available for web linking. These fonts usually contain a large set of OpenType features, which are only accessible in OpenType-savvy applications like InDesign, Illustrator or QuarkXPress. Browsers have barely supported such advanced typographic features so far. But with the latest Beta of Firefox 4 this is about to change …</p>
    <p><a href="http://bit.ly/9FVmg0" title="http://bit.ly/9FVmg0">http://bit.ly/9FVmg0</a></p>
