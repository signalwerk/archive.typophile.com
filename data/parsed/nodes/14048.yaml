      <p>This looks like it might have been designed by Erik Spiekermann. Here are a few families that will get you close:</p>
      <p>Officina Sans has a serifs/crossbars on the I and similar Gs:</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/itc-officina-sans/officinasanitc-extrabold/testdrive.html?s=EINGANG&amp;p=48">http://www.myfonts.com/fonts/linotype/itc-officina-sans/officinasanitc-extrabold/testdrive.html?s=EINGANG&amp;p=48</a></p>
      <p>FF Fago Office Sans is also similar:</p>
      <p><a href="http://www.myfonts.com/fonts/fontfont/fago-office-sans/bold/testdrive.html?s=EINGANG&amp;p=48">http://www.myfonts.com/fonts/fontfont/fago-office-sans/bold/testdrive.html?s=EINGANG&amp;p=48</a></p>
      <p>Or try FF Unit Office:</p>
      <p><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11049.5.15&amp;attributes.sampleSize=48&amp;sampleText=EINGANG&amp;sampleSize=48">http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11049.5.15&amp;attributes.sampleSize=48&amp;sampleText=EINGANG&amp;sampleSize=48</a></p>
