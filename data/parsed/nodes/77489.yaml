    <p>Just released Cabin, a humanist sans inspired by Edward Johnston’s and Eric Gill’s typefaces, with a touch of modernism</p>
    <p>Free, and available as a Webfont in the Google Webfonts Directory.<br><a href="http://www.impallari.com/cabin/">http://www.impallari.com/cabin/</a></p>
