    <p>Just released Cabin, a humanist sans inspired by Edward Johnston’s and Eric Gill’s typefaces, with a touch of modernism</p>
    <p>Free, and available as a Webfont in the Google Webfonts Directory.<br>
    <a href="http://www.impallari.com/cabin/" title="http://www.impallari.com/cabin/">http://www.impallari.com/cabin/</a></p>
    <p>Spacing &amp; Kerning by Igino Marini's iKern service.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cabin-preview_5341.gif"></div><p></p>
