  html: |-
    <p>I've been using FontExplorer X for some time now. Recently, I believe every time I restart my mac, most of my font sets are missing their actual font files. The sets are still there, but a "0" indicates there is no font. All my directories have remained the same, and I can re-add these fonts to the sets, but they keep disappearing in the list of sets. Anyone else having this issue?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot 2013-12-31 14_6633.22.14.png"></div><p></p>
