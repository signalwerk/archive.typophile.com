      <p>First of all, I would think the advantages of using Opentype would, in most cases, outweigh the trouble of converting the Corel files, but...</p>
      <p>I'd look at <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_seria_regular/" rel="nofollow">Seria</a>,  <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_nexus_serif_regular/" rel="nofollow">Nexus</a>,  <a href="http://www.fontbureau.com/fonts/Whitman" rel="nofollow">Whitman</a>  and DTL Romulus (I don't know how to provide a link on DTL's site).</p>
