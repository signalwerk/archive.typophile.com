      <p>Hmmm, update; given the amount of .cdr and .cmx files I'll have to work with, I prefer using good old Corel Ventura for these jobs. But Ventura doesn't support OpenType features – which is surprising for such a typographically savvy program.</p>
      <p>So any suggestions would still be more than welcome. Thanks, Brieck</p>
