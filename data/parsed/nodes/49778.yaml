      <p>Well, John, I was sort of fishing to see if Whitman might fit the bill ;-) But it's not really that much like Kingfisher, and I'm not sure it would be as fitting for Brieck's topic.</p>
      <p>But, Brieck, if you want to consider it, you can find more Whitman samples at my website also: <a href="http://www.kentlew.com" title="www.kentlew.com">www.kentlew.com</a>.</p>
      <p>And I'd be happy to set up some more specific samples with your column specs and some text you provide, if you want to contact me directly off-forum.</p>
      <p>-- Kent.</p>
