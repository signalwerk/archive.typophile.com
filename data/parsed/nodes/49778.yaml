    html: |-
      <p>That would be an option – given that they'll decide to go for Kingfisher the next few years, which would be my choice.<br>
      As for alternatives; I like the italics, almost a slanted roman. Also the osf figures, I think, come out very well. The few pages I received and printed just made a fresh impression and looked quite elegant.<br>
      As to the periodical; the main focus lies on Dutch imperial and colonial history.</p>
      <p>Thanks, Brieck</p>
