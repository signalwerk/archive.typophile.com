    <p>Hi all, I'm partly redesigning a historical periodical. A friend suggested Tankard's <a class="freelinking external" href="http://www.typography.net/type/font/kingfisher" rel="nofollow">Kingfisher</a> for body text. In my opinion a great – conservative but fresh – original design. But is has no true small caps, which I really need – and will be using a lot. To automate small caps by using a character style is not an option.</p>
    <p>So any suggestions would be more than welcome.<br>
    Thanks in advance, Brieck.</p>
