    html: |-
      <p>Contact Jeremy Tankard and ask him if he can provide you a separate font with the small capitals in standard lowercase glyph positions.</p>
      <p>In terms of alternatives, tell us more about what you appreciate about Kingfisher and what you'd be looking for in an alternative. How close does it need to be to Kingfisher? Can you say more about the periodical this is for?</p>
      <p>-- K.</p>
  - id: 304376
