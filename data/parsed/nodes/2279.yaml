    html: "<p>1) According to a Typophile post by John Butler (a blackletter specialist), it's called \"Schaftstiefelgrotesk\" in German. <br> <br>2) The Bain book lists four fonts: Deutschland, National, Tannenberg and Gotenburg. But I'm not sure if any of them are available digitally. <br> <br>And two things from MyFonts: <br><a href=\"http://www.myfonts.com/fonts/newfonts/christmas/\" target=\"_blank\">http://www.myfonts.com/fonts/newfonts/christmas/</a> <br><a href=\"http://www.myfonts.com/fonts/itc/honda/\" target=\"_blank\">http://www.myfonts.com/fonts/itc/honda/</a> <br>I suggest you buy one of them. <br> <br>hhp <br></p>"
