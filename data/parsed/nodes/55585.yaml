    <p>Hello everyone,</p>
    <p>I'm designing a logo for a Shoe Store named Arizona.</p>
    <p>The palette was already created by the interior designers, with the typical turquoise/orange scheme you'd typically find in an Arizona theme. The store will eventually become a franchise, so I am keeping the design somewhat simple to accommodate future changes throughout the many applications it will be used.</p>
    <p>I used Saracen as the typeface. I love this, because it addresses the diamond shapes Arizona logos often use, without having to actually use them (because of it's chunky, pointy serifs). Right now I haven't gone into the stage of adding a visual element to make it unique, I just wanted to see what people thought of the typeface, colors, etc.</p>
    <p>One problem I may have, is that it might look too Chunky or Rigid for a higher-end shoe store. I'd like to hear your opinions, but so far I think it looks pretty sexy. I just love the typeface.</p>
    <p>Right now the stores will be located in Quebec or Eastern Canada.</p>
    <p>Thanks in advance!!!!!</p>
