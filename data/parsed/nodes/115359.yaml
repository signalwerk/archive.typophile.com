      <p>Thanks nina &amp; hrant. Webtype, Web Ink, Typekit, CloudTypography all have exceptional work. I have not explored fonts.com that much, but their new eText revivals of classic faces look gorgeous—I have used Sabon a lot in print.</p>
      <p>I have great admiration for the Font Bureau’s work, especially the RE series for screens. Perusing the Font Bureau’s catalog makes me wish I had a lot more money to play with. Whenever a typeface gives me a thrill in a magazine it is inevitably from one of a few foundries/designers. Font Bureau typefaces are like going to ballet, everything looks effortless and makes me feel like I could be a type designer too...but that’s the grand illusion, right?</p>
      <p>So, yes. I am looking for something other than subscription services for myself...but I still love to look at what’s out there and will probably recommend subscriptions to freelance clients when the project suits it.</p>
