      <p>Thanks hrant. Yes, it might be better to approach my question through identifying foundries, designers and quality resellers that have @font-face licenses and trusted attention to hinting. I know that <a href="https://commercialtype.com/" rel="nofollow">Commercial Type</a>, <a href="http://vllg.com/" rel="nofollow">Village</a>, <a href="http://processtypefoundry.com/" rel="nofollow">Process Type</a>, <a href="https://www.typesupply.com/" rel="nofollow">Type Supply</a>, and <a href="http://www.fontshop.com/" rel="nofollow">FontShop</a>/<a href="https://www.fontfont.com/" rel="nofollow">FontFont</a> offer this. Klim does too, but those are priced dearly. Any others you would suggest?</p>
      <p>Are FontFont and FontShop the same company? I think they are a really great options for what I am looking for. I wish their website was easier to filter out their webfonts (a massive catalogue) and see samples of them in use rather than PDFs and images. The new releases like FF Mark are an exception with really stellar micro-sites that blow my mind. FF Kievit is another example with a great micro-site.</p>
      <p>Font Spring and MyFonts have @font-face—though MyFonts is increasingly having pay-as-you-go licenses. Font Spring has some of the largest per-views licenses and often has the lowest prices for what you get. They license the work of some designers whose work is obviously well crafted like that of Nick Shinn, Hannes von Döhren and Mark Simonson. My MS Windows emulator that I use for testing IE (I’m a Mac fanboy) oddly does not work for the Font Spring demo page (it defaults to Arial). Ironic, because IE is always the lowest common denominator and the whole reason for testing. So, I don’t trust that those unfamiliar designs  are carefully hinted. For example, Trade Gothic FS would be quite useful, but how’s the quality?</p>
      <p>I’m an institutional web designer and we’ve no budget for fonts beyond the Open Sans and Georgia chosen (by the powers that be) as our web identity fonts. So, I like to buy an occasional web font license with my own money so that I can become familiar with it through use. I’m partly hoping that I can one day earn some freelance money designing with it and it’s partly because I’m an obsessive font geek who spends evenings looking through specimens (to the chargin of my girlfriend). </p>
      <p>I am willing to pay for premium well designed typefaces, but obviously there is only so much I can afford out of pocket. I feel that I am getting more value as a sharp-shooter with only six bullets a year when I buy @font-face licenses. My hands get sweaty. I recognize the fairness of use-based-fees and subscriptions for the laborious and creative work that type designers do. Nonetheless, I am just glad that I didn’t have to pay a per-project fee for every print job I’ve done. Perhaps when WOFF becomes standard, the pricing rates for web designers and fairness to type designers will even-out.</p>
      <p>...but I’ve gone off topic now. Any stellar text web fonts you like besides the well-known Proxima Nova, Brandon Text, Museo Sans, etc...?</p>
