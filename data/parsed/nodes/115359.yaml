    <p>Could you recommend web fonts that you like and that have excellent hinting for the screen? </p>
    <p>I am interested in work-horse typefaces for body text that I can purchase the rights to use with @font-face, so that would exclude all the offerings from those wonderful subscription based services. I have found the results from type at MyFonts can be spotty, and they never say if a font has been hinted by the designer. </p>
    <p>Feel free to suggest your own work. I am interested in expanding my knowledge of good work that is out there. Thanks very much.</p>
