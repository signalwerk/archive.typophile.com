      <p>Thanks for the link, Nick! Your typeface, Richler, is new to me. That is exactly the kind of suggestion I was looking for in this discussion.</p>
      <p>Emanuel, Ha! Yes they certainly get the award for the most ballsy use of yellow. Fonts with a splash of <em>danger</em> (Carlos Danger? Do you watch John Stewart? I hear the music now). Seriously, it is nice to see them make a new site that focuses on their web font offerings with actual samples of the fonts in use (rather than images/pdfs FontShop currently has). As well, FontShop has @font-face licenses with way more page views (<em>10 times more</em>) than MyFont’s standard. </p>
      <p>--</p>
      <p>MyFonts gives you half-off the second type of  font  you purchase, if you purchase both the web and print at the same time. However, you have to buy them at the same time and can’t come back and get the discount later. Commercial Type let’s you get the discounts anytime...many foundries do this individually on request (e.g., Klim does), but Commercial is one of the few that I have seen that make it so easy at check-out time to get the discount. Commercial’s approach makes me willing to buy a style or two to test out the face and get familiar with it’s character through use...a slow process for me.</p>
      <p>I recently purchased a license for a couple of styles of <em>Lyon</em> from Commercial Type and I really like the way they have their site set-up. They give discounts for bulk/family purchases, allow easy upgrades, and allow @font-face with perpetual licenses. I have a <strong>big crush</strong> on Lyon right now, unassuming and dignified as a text face with a lovely flare in the italics.</p>
