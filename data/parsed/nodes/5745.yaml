  html: <p>LEXIA READABLE adopted by Dyslexia.com <br> <br> <br>"I am not utterly convinced that Lexia is superior to ComicSans (my personal favorite), which is also available to our users -- but I do have to note that as soon as I converted our site to the Lexia readable view, I immediately spotted a typographical error on the page that had previously eluded me. <br> <br>Lexia has been accepted for inclusion in the site customization feature of the Dyslexia.com web site." <br> <br>Abigail Marshall,  Davis Dyslexia Association International,  <a href="http://www.dyslexia.com/" target="_blank">http://www.dyslexia.com/</a> <br> <br> <br>LEXIA and LEXIA BOLD are now available for free download from the K-Type website, <a href="http://www.k-type.com" target="_blank">www.k-type.com</a> <br>LEXIA Readable is totally free to use and distribute. <br> <br> <br>K-Type has designed it using Comic Sans, the font widely promoted by educationalists in the UK, as the basic model for legible weight and spacing, but has removed the sometimes problematical American childrens' comic book style in favour of more grown-up contemporary typographical elements, whilst still retaining a slightly hand-drawn feel. <br> <br>K-Type designer Keith Bates said, "Comic Sans is considered culturally inappropriate or too whimsical for many uses, older students can feel patronized. It might be good for infant typography and 'Baby on Board' stickers, but its use risks undermining any serious message and appearing condescending to readers with greater visual maturity, and that's particularly important when applied to adolescent and adult literacy."  <br> <br>Typographical concerns from recent educational publications and discussions, and some highlighted by the British Dyslexia Association have been incorporated into the design of Lexia - the simpler, handwritten forms of a and g, the non-symmetry of letters such as b and d, good sized descenders and ascenders, generous spacing and good screen clarity. <br> <br> <br><a href="http://www.k-type.com" target="_blank">www.k-type.com</a></p>
  html_clean: <p>LEXIA READABLE adopted by Dyslexia.com <br> <br> <br>"I am not utterly convinced that Lexia is superior to ComicSans (my personal favorite), which is also available to our users -- but I do have to note that as soon as I converted our site to the Lexia readable view, I immediately spotted a typographical error on the page that had previously eluded me. <br> <br>Lexia has been accepted for inclusion in the site customization feature of the Dyslexia.com web site." <br> <br>Abigail Marshall,  Davis Dyslexia Association International,  <a href="http://www.dyslexia.com/" target="_blank" class="link-external">http://www.dyslexia.com/</a> <br> <br> <br>LEXIA and LEXIA BOLD are now available for free download from the K-Type website, <a href="http://www.k-type.com" target="_blank" class="link-external">www.k-type.com</a> <br>LEXIA Readable is totally free to use and distribute. <br> <br> <br>K-Type has designed it using Comic Sans, the font widely promoted by educationalists in the UK, as the basic model for legible weight and spacing, but has removed the sometimes problematical American childrens' comic book style in favour of more grown-up contemporary typographical elements, whilst still retaining a slightly hand-drawn feel. <br> <br>K-Type designer Keith Bates said, "Comic Sans is considered culturally inappropriate or too whimsical for many uses, older students can feel patronized. It might be good for infant typography and 'Baby on Board' stickers, but its use risks undermining any serious message and appearing condescending to readers with greater visual maturity, and that's particularly important when applied to adolescent and adult literacy."  <br> <br>Typographical concerns from recent educational publications and discussions, and some highlighted by the British Dyslexia Association have been incorporated into the design of Lexia - the simpler, handwritten forms of a and g, the non-symmetry of letters such as b and d, good sized descenders and ascenders, generous spacing and good screen clarity. <br> <br> <br><a href="http://www.k-type.com" target="_blank" class="link-external">www.k-type.com</a></p>
