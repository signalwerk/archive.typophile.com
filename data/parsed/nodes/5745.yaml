    html: <p>The research into the Lexia name was too scant, it's true - I've since discovered TWO fonts called Lexia, and I don't suppose this duplicate naming is a first in fontdom - I'm hoping that our font being Lexia Readable (and free for those with reading difficulties/dyslexics!) will dissuade Dalton Maag from suing K-Type for every penny it hasn't got. <br> <br>If I have to change the name, I might take up Vincent's suggestion of 'Our Kid'. . . or maybe 'Comic Sons'?</p>
