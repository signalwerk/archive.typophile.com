    html: |-
      <p>The wildcard <strong>^9</strong> only matches one digit. So for numbers composed of more than one digit, you'll have to use the wildcard more than once.</p>
      <p>In your example, you'll have to do two Find/Change operations; one with the pattern you've used, and another with this pattern: <strong>^9^9.(space)</strong></p>
      <p>For more tips and tricks, listen to <a href="http://indesignsecrets.com/episode-30-findchangeformat.php" rel="nofollow">InDesignSecrets Episode 30: Find…Change…Format!</a></p>
