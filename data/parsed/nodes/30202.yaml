    <p>Hey all.</p>
    <p>I am seemingly unknowledgable about the full capacity of the find/change feature. I'm trying to do a find/change on the section numbers of a document, and so far, I've only been able to get it to change<br>
    one number.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/31_6638.png"></div><p></p>
    <p>I'm using ^9.(space) to find all instances of numbers, but it seems to only change one of the numbers to the new style I want to apply.</p>
    <p>Any secrets? Thanks in advance…</p>
