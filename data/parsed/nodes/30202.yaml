    html: |-
      <p>I signed up for InDesign Magazine's free <a href="http://www.indesignmag.com/idm/tipofweek.html" rel="nofollow">Tip-of-the-Week</a>, and with it I learned some things I didn't know about. Here are two:</p>
      <p><strong>Delete Preference Files</strong><br>
      You can delete InDesign's preference files when launching InDesign. To display this option dialog, launch InDesign, then immediately select Ctrl+Alt+Shift (Windows) or Ctrl+Option+Command+Shift (Mac OS).<br>
      <em>Eliot Harper, from InDesign Magazine Issue #7</em></p>
      <p><strong>Zoom-sensitive Ruler Guides</strong><br>
      Hold down the Option key (Mac) or Alt key (Windows) while dragging out a ruler guide to make it visible only at the current zoom level and larger. If you zoom out, the guide will disappear. When you zoom back to the previous magnification or above, the ruler guide will reappear.<br>
      <em>Keith Gilbert, from InDesign Magazine #7</em></p>
      <p>I'm also a subscriber of the <a href="http://www.indesignmag.com/idm/issues.html" rel="nofollow">ID Mag</a> itself. It is quite good, for both beginner and advanced users. Unfortunately, I don't have enough time available to read it all (60+ pages!!), so I end up not taking full advantage of it :^(</p>
