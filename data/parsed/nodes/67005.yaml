      <p>I like the irony in the article's title: "Microsoft's Creative Destruction".<br>
      It's an allusion to economist Joseph Schumpeter's phrase, "Creative Destruction" to describe how the process of entrepreneurial innovation destroys what came before.<br>
      Schumpeter was being laudatory. "Creative Destruction" is a good and necessary thing.</p>
      <p>Brass - or an editor at the NYTimes - cleverly uses the term to describe another kind of destruction: one that frustrates and defeats exactly the kind of innovative birthing that Schumpeter's phrase was coined to describe.</p>
      <p>Cool. A double entendre. Somebody's on the ball.</p>
