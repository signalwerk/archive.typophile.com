      <p>Except for processor speed issues, the case for ClearType would seem clear. After all, compare how one can, on an ordinary TV set, read printing in real typefaces in things like movie credits or titles, compared to computer printing at a similar resolution.</p>
      <p>It is true, of course, that if sub-pixel rendering is allowed to turn hinting off, you will get situations where a lowercase "e" looks like a dot. So one does need a high enough screen resolution before it is useful.</p>
