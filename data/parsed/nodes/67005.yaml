      <p>The more fundamental question is: Why should sub-pixel rendering be turned on by default at all? Despite all the arguments for it and against aggressive hinting (as laid out in extensive detail by the <a href="http://www.antigrain.com/research/font_rasterization/index.html" rel="nofollow">Anti-Grain Geometry project</a>), it remains a subjective and personal decision whether "the trade-off between sharpness and functionality" is worth it.</p>
      <p>I've tried ClearType many times over the years, and every time I end up turning it off after a few days because I continue to find it unpleasant. Has anyone ever done a scientific study (with large sample size) on whether the "common" computer user actually prefer one over the other, and by what margin?</p>
