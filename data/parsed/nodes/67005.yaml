      <p>&gt; So: Why did it take ten years to get ClearType turned on by default?</p>
      <p>I'd put it closer to 8 and a half years, and the answer in my opinion is "because of CRTs and Vista". The technology announced towards the end of 1998 missed Windows 2000 (came in a bit too late) and shipped with Windows XP in 2001 - that's three years. With CRT's still in the majority it didn't make sense to make it the default, although many laptop OEMs, including all tablet makers did turn it on. I think it was always the plan to make it the default setting for Longhorn (based purely on LCD panel penetration), but the schedule slipped - Vista shipped in Jan 2007 - about 8 years after CT was announced.</p>
