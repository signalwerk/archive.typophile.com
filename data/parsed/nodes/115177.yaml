      <p>Yeah, it's looking good. And applause for "the Lostry"; that must be one of the cleverest names I've seen.</p>
      <p>"S" is leaning to the right.</p>
      <p>Top of "f" looks a bit heavy and its curvature seems slightly out of place. Copying from "t" may serve better.</p>
      <p>When I saw your "Q" I thought "Ah, what European country is he from, then?" Designers whose home language doesn't ordinarily use "Q" often seem to think of it as "O with line diacritic below." It's not <em>wrong,</em> but the disconnection is a little more stylized than readers of English usually expect in text. I think that more alternates are called for, and that the default should be like the first one but with a short vertical stroke to connect the existing shapes together.</p>
