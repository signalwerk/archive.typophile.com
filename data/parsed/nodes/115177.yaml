      <p><strong>Firstly, thanks for the quick responses, I really appreciate the feedback. </strong></p>
      <p><strong>Hrant:</strong> I tried to draw the double-storey g with a shorter descender, but it wasn't working for me—do you think that the double-storey g needs to descend less, or would it be sufficient to match it with the other descending letters?</p>
      <p><strong>Cerulean:</strong> I'm actually a native English speaker from the UK! When I drew the disconnected Q I was basically just trying to do something different from the Qs I had drawn in previous typefaces—and when I began I suppose I was aiming more at a display face than a text face (the proportions used to be much more classical, but they've evened out as time went on). </p>
      <p><strong>Hrant &amp; Osamu:</strong> Actually, this is the first typeface where I opted to draw my glyphs in the font editor from the start; when I said that I was using Illustrator for the metrics, I just meant that I haven't spaced or kerned the font properly yet, and have been using the 'Optical Kerning' setting on Illustrator when making specimen text compositions like those I posted above.</p>
      <p><strong>Thanks for all the suggestions, I'll do some more work and then post some more images up after!</strong></p>
