    <p>Hello people,</p>
    <p>I've had a growing interest in type design for about a year now, and this is perhaps my 4th attempt at a simple sans face. I just want to force myself to bring a project to completion, and produce a typeface that doesn't look too amateurish, even if it turns out very plain.</p>
    <p>I was hoping for some feedback and suggestions about anything which you think stands out as needing some work. I'm still pretty new to this, but looking to learn—so please be kind!</p>
    <p>- - - - - - - - - - - - -</p>
    <p>Please note, so far I've only been working on drawing the glyphs, and the metrics are just done automatically in Illustrator just now.</p>
    <p>Also, please ignore the 'Pro' tag on the name and the MyFonts promo look; I was just playing around :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile1-02_3963.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Typophile1-03_4793.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Typophile1-04_4572.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Typophile1-05_5261.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Typophile1-06_5392.png"></div><p></p>
