    html: |-
      <p>To me the binocular "g" is the first (and often only) glyph that has to look a bit ungainly (in terms of being vertically squooshed, and appearing slightly too small) for something much more important –namely good vertical proportions– not to go out of whack. Normally this applies to text faces, while this design is more in the display realm... which makes me think you might be better off with a monocular "g". But if you stick with a binocular one try making the bottom open (like in Meta).</p>
      <p>hhp</p>
