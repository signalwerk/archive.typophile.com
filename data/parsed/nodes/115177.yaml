      <p>It actually has a nice feel going for it, and overall seems technically competent.</p>
      <p>The biggest problems are the binocular "g" (going too low, and leaning clockwise) and the "j" (troublesomely wide descender). In the caps, neither "M" is good.</p>
      <p>BTW, move away from Illustrator and to a proper font editor ASAP.</p>
      <p>hhp</p>
