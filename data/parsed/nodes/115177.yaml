      <p>Not bad. Agree with the comment on the Q. It looks nice in isolation but in context it doesn't really work for me.</p>
      <p>The angle and length of the 'slash' on your Ø and ø is wrong. 60° is way too much. Bring it down to 45° at least, and don't let the line extend (optically) below baseline or above x-height, definitely not past the overshoot.</p>
      <p>And take hrant's advice on moving to a font editor asap - you're creating work for yourself labouring in illustrator.</p>
