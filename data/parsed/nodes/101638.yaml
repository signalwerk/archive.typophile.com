    <p>Can anybody please give me some advice on typefaces to combine with Platform?</p>
    <p><a href="http://commercialtype.com/typefaces/platform" title="http://commercialtype.com/typefaces/platform">http://commercialtype.com/typefaces/platform</a></p>
    <p>I use Platform(bold) for all headers. I need a body copy typeface. Platform regular doesn't work on this one since it's a display font and with  large paragraphs it not readable enough.</p>
    <p>Don't know yet whether to combine with a sans or sans-serif, so tips considering both types are welcome.</p>
    <p>I think it needs a pretty high x-height and it should be sligtly condensed, but maybe someone has an other good idea.</p>
    <p>All tips are welcome. Thanks in advance!</p>
