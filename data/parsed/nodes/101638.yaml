      <p>(Thanks for the plug Frode!)<br>
      I think I’d first try to go the way of contrast, not similarity here – Platform is pretty idiosyncratic, so I’m thinking trying to pick something “similar” (monoline, sans, circular “o”s etc) might just make it clash. (And I  wouldn’t use either Archer or Graphik for extended text.) I’d go the other way, try a serif, possibly even with stroke contrast. Something not too narrow, fresh, not too soft. Something that works in its own right but clicks into a similar tone. Maybe Eames? Or Lyon? Tiempos?</p>
