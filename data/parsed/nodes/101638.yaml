    html: |-
      <p>Well, you can try. But I think it's just too hopeless.</p>
      <blockquote><p>the categories of Display and Body are not immutable solitudes.</p></blockquote>
      <p>I see them as -unattainable- pure extremes on an axis, with any font sitting somewhere in between. And you can certainly nudge a font in either direction via the setting. But you can only nudge it a little bit before stuff breaks, and to me Platform is way too close to the Display end.</p>
      <p>hhp</p>
