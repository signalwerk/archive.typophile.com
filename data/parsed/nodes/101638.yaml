    votes: null
    html: |-
      <p>Maybe a little off the mark, but <a href="http://ernestinefont.com/" rel="nofollow">FF Ernestine</a> by <a href="/wiki/Nina%20St%C3%B6ssinger" class="freelinking" rel="nofollow">Nina Stössinger</a> is very nice (so is Nina). Also check out Erbar’s own slab serif, <a href="http://www.linotype.com/209/Candida-family.html" rel="nofollow">Candida</a>.</p>
      <p>In all of these suggestion, I’ve looked at typefaces that have some stylistic details in common with Platform (primarily the Erbar style ‘a’) and that are also (mostly) geometric. If you are looking for a more traditional seriffed text face, I would suggest a humanist/Renaissance style typeface. Proportion-wise they’re often a better fit than more rational designs. (That said, Platform is pretty off when it comes to proportions.) That’s my opinion, anyway.</p>
