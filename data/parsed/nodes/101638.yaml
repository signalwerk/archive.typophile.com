    html: |-
      <p><em>…you can't get there from here.</em></p>
      <p>How do you know until you try?<br>
      There a lot of typographic controls in InDesign/XPress that can be used to massage a setting into improved readability.<br>
      Having said that, if I wanted to mirror Platform in a text setting, I would prefer Avant garde or Century Gothic.<br>
      My point is that the categories of Display and Body are not immutable solitudes.<br>
      However, if this situation is for screen rather than print, much depends on hinting, which can change the design of a typeface radically.</p>
