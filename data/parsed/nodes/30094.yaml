      <p>A lower contrast Didone is a higher contrast Egyptian.<br>
      So the isssue of size becomes critical, because you don't want it to be too slabby, which it will be large.<br>
      How about Schadow Light -- That would fit the bill if you don't get too big.<br>
      You might also try taking a bit off weight off a Clarendon Light.</p>
