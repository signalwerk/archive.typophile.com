    <p>I'm looking for a delicate Didone or Modern typeface. I want something elegant, with lower contrast than a standard Bodoni, preferably in a light or ultralight weight. Maybe something almost monlinear, but not quite.</p>
    <p>Linotype Didot has a really thin hairline, but the contrast is still too thick. It also feels too rigid, with a very, very strict vertical stress.</p>
    <p>Filosofia has a more monlinear feel, but isn't that thin, and certainly not delicate.</p>
    <p>I already have a few cuts of Kepler, but it's too workman-like and the thin weights feel like they're about to poke you with their spikes.</p>
    <p>It's for my Grandmother, who is a delicate, yet graceful. Wasp-ish, but calm and resolute. Soft and feminine.</p>
    <p>Any ideas?</p>
