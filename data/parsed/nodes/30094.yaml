      <p>I used Diotima for a realtor's ad campaign once. Wow, did she not care. Realtors suck by the way, they have zero sense of typgraphic style. Everything must be Arial or TNR or else it "just doesn't look professional" to them. Yuck.</p>
      <p>But I like the typeface. Maybe I'm limiting myself by calling for a Didone? Let's open it up to anything that fits my above descriptions. I'd like to see what you think.</p>
      <p>So here 'tis:</p>
      <ul>Something elegant, with lower contrast than a standard Bodoni, preferably in a light or ultralight weight.</ul>
      <ul>Delicate, yet graceful. Wasp-ish, but calm and resolute. Soft and feminine.</ul>
      <ul>Something where the curves blend gracefully rather than abruptly, with gently bracketed serifs.</ul>
      <ul>Preferably more Neo-Classical or Modern in stress and finish, but not neccesarily so much.</ul>
      <p>Thanks guys!</p>
