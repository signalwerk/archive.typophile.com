    <p>Contest to Recognize Websites that Best Integrate Web Fonts is Now Accepting Entries through Nov. 7, 2010</p>
    <p>WOBURN, Mass., Sept. 27, 2010 – Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, is accepting entries through Nov. 7, 2010 for the first Web Font Awards, an international competition designed to recognize websites that incorporate exceptional use of Web fonts. Prizes include two $3,000 cash awards, Apple® iPad® mobile digital devices and various typeface offerings from Monotype Imaging. Winning entries will be determined at a live judging event on Nov. 16, 2010, during the Future of Web Design conference, Nov. 15-17, in New York City.</p>
    <p>“Web designers are now taking advantage of recent breakthroughs that allow for the use of a wide variety of typefaces, rather than choosing from a limited range of so-called Web-safe fonts. This brings Web design to a whole new level,” said Allan Haley, director of words and letters at Monotype Imaging. “We created the Web Font Awards to celebrate this newfound typographic freedom, while also promoting awareness, adoption and outstanding use of fonts on the Web.”</p>
    <p>Contest entries can be built with Web font technology from any provider, including self-built solutions, as long as the site or Web page uses actual fonts that are served to Internet-connected machines through the @font-face declaration. There is no limit to the number of entries that an individual can submit.</p>
    <p>All accepted designs will be displayed in a gallery at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>, where site visitors can rate each entry one time based on the quality of typography, creativity and usability. The entry with the highest score at the conclusion of the viewing period will receive the Community Choice award. In addition, three designs will be selected to vie for first, second and third place Judges’ Choice awards at a live ceremony at the upcoming Future of Web Design conference in New York City. Judging will be based equally on the quality of typography, creativity and usability of the three selected designs. Award winners will be informed by e-mail and are not required to attend the judging event or the Future of Web Design conference. Winning entries will also be posted after Nov. 16, 2010 at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>. </p>
    <p>Top prizes include $3,000 for the Community Choice award winner and the first place winner, in addition to a 32GB Apple iPad device with a Wi-Fi connection, 20-user license for the Monotype® Library, Linotype® Originals and ITC® Library font collections, and a one-year paid subscription to Monotype Imaging’s Fonts.com Web Fonts service when it becomes available commercially. A single entry is eligible to win the Community Choice award in addition to a Judges’ Choice award – and receive the full collection of prizes for both. </p>
    <p>Complete rules on the Web Font Awards, including submission guidelines, eligibility requirements, judging criteria and procedures, award ceremony and prize details including the breakdown for Community Choice, first, second and third place Judges’ Choice awards are available at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>.  The retail value of all prizes combined totals more than $80,000.</p>
    <p>The Web Font Awards is sponsored by Monotype Imaging with support from Carsonified, a UK-based company that produces events for Web professionals, including the Future of Web Design conferences.</p>
    <p>Monotype Imaging is also working with media partners to select the three entrants that will be judged, in addition to announcing the Web Font Awards winners at the Future of Web Design conference. Media partners include Cincinnati-based HOW magazine, which serves graphic design professionals; Creative Review, a UK-based publication focused on the communication arts; Slanted, a Germany-based typography magazine; and Novum, a graphic design magazine, also headquartered in Germany. Additional support is being provided by The Association Typographique Internationale, or ATypI, which is a nonprofit global forum and focal point for the type community and business.</p>
    <p>About Monotype Imaging<br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras, e-book readers and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 13,000 typefaces from the Monotype, Linotype and ITC typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Apple and iPad are registered trademarks of Apple Inc. All other trademarks are the property of their respective owners. © 2010 Monotype Imaging Inc. All rights reserved. </p>
