    <p>Interesting use of the word ’font’ by someone who should know better? Or perhaps using font instead of ’caption’ is acceptable in the world of TV news? </p>
    <p>“Mr. Rather requests that his <strong>font</strong> not associate him with CBS News. So no ’Former CBS Anchor.’ We thank you and Dan thanks you.”</p>
    <p><a href="https://web.archive.org/web/20080906161228/http://www.contactmusic.com/news.nsf/article/now%20rather%20boots%20cbs_1002051" title="http://www.contactmusic.com/news.nsf/article/now%20rather%20boots%20cbs_1002051">http://www.contactmusic.com/news.nsf/article/now%20rather%20boots%20cbs_...</a></p>
    <p>Si (and Dan) thank you.</p>
