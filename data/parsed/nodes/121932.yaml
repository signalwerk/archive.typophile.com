      <p>The title is most certainly lettered (look at the two |E|s), I can't say if based on a formalized style.</p>
      <p>Incidentally, a blackletter called Enzian exists (<a href="http://www.myfonts.com/fonts/polygraph/enzian/" title="http://www.myfonts.com/fonts/polygraph/enzian/">http://www.myfonts.com/fonts/polygraph/enzian/</a>), but it definitely has a different style.</p>
