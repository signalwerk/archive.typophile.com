    html: |-
      <p>Two modern reinventions of the blackletter that, in my opinion, share some aspects with this nice kind of square wide fat lettering:<br>
      <a href="http://www.type-together.com/Eskapade" title="http://www.type-together.com/Eskapade">http://www.type-together.com/Eskapade</a><br>
      <a href="http://www.myfonts.com/fonts/storm/moyenage/" title="http://www.myfonts.com/fonts/storm/moyenage/">http://www.myfonts.com/fonts/storm/moyenage/</a></p>
      <p>There are others but, for what I can see, they tend to resolve contrast eliminating thin strokes and replacing them with the pointed terminals of wide strokes. Also, most of them go for an hexagonal grid, which prevents horizontal strokes of some substance.</p>
    html_clean: |-
