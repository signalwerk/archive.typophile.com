    html: |-
      <div class="comment-spam-body"><p>Thanks Riccardo, for mentioning Eskapade &amp; Moyen Age. I had looked at them some time ago and liked what I saw as good reinterpretations of blackletter.</p>
      <p>I agree the hexagonal grid in many blackletter updates is not good. In my opinion it is too mechanical and too far from what makes blackletter appealing -- the variation in strokes and emphasis which can sometimes give an effect that is both organic and dramatic, as is well expressed in this lettering.<br>
      Anyone else with some leads or thoughts?<br>
      Don</p>
      </div>
