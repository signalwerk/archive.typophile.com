    <div class="node-spam-content"><p>This blackletter is on the cover of a book _Enzian und Edelweiss_ [two alpine plants] published by Verlag Hans Henning Podzun in 1955. </p><div class="imageWrap"><img src="http://typophile.com/files/VerlagHansHenningPodzun1955EnzianUndEdelweissSM_6608.jpg"></div> Larger scale image attached.<br>
    I don't know of a digital font that matches, but perhaps there is something from metal type or the photo-type/contact-letter sheet era?<br>
    Failing that, does anyone know of any more letters in this style? Perhaps the letters are  modeled on something from a lettering book? Any more book covers by this publisher or others?<br>
    Thanks.<p></p>
    <p>Don</p>
