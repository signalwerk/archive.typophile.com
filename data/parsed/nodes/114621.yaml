      <p>Your font seems to be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Helvetica%20-%20Light&amp;fid=459f7afe1ead878da5d61ee98f542c03&amp;fsize=60&amp;text=ABFDGMacdegimnohust&amp;wrap=2" rel="nofollow">Helvetica (Light)</a></strong><br>
      Microsoft has actually copied and modified Helvetica to create Arial which is the closest alternative included in MS-Office.<br>
