      <p>here’s a handy trick for kerning.  It’s easier to kern letters you can’t read, and youre so used to seeing not only these letters, but these words, that you often over-look the spacing even when you’re trying to.</p>
      <p>Simple Solution: turn the type upside down.  The gaps will jump out at you instantly.</p>
      <p>Hope this trick helps if you didn’t already know it, I know it’s saved me more times than I wish to admit...</p>
