  html: |-
    <p>I'm looking at a overhaul of our newspaper. We're currently using two typefaces, one for news and one for features, but  <a class="freelinking external" href="http://www.guardian.co.uk/theguardian/tryit/0,16469,1564647,00.html" rel="nofollow">the Guardian's</a> redesign a couple of years ago - especially the mono-typeface all the way through - interests me.</p>
    <p>Does anyone have any suggestions for other families of typefaces that could be used throughout a newspaper for both body and headlines with a range of thicknesses and an italic style? We're looking at using 9pt on a 10.75pt baseline grid for body and headlines up to about 90pt. We're more of a news magazine though, our format is just a little smaller than tabloid and printed on silk 115gsm.</p>
    <p>The paper is going for quite a spacious look too, especially on feature pages.</p>
    <p>Any pointers would be great! Cheers...</p>
