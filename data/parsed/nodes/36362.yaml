    html: |-
      <p><cite>especially the mono-typeface all the way through</cite></p>
      <p>This is actually one family with five 'members', <a class="freelinking external" href="http://www.christianschwartz.com/gdnegyp.shtml" rel="nofollow">Guardian Egyptian</a>, <a class="freelinking external" href="http://www.christianschwartz.com/gdnsans.shtml" rel="nofollow">Guardian Sans</a>, <a class="freelinking external" href="http://www.christianschwartz.com/gdntegyp.shtml" rel="nofollow">Guardian Text Egyptian</a>, <a class="freelinking external" href="http://www.christianschwartz.com/gdntsans.shtml" rel="nofollow">Guardian Text Sans</a> and <a class="freelinking external" href="http://www.christianschwartz.com/gdnagate.shtml" rel="nofollow">Guardian Agate</a>, with each 'member' comprising of several styles &amp; weights. </p>
      <p>So to say 'the mono-typeface' is a little erroneous and misleading! Are you actually looking for a sans/serif combo?</p>
