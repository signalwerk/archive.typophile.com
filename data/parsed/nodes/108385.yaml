      <p>It looks like <strong>GE HandyScript</strong> from GraphXEdge which is probably based on <strong>VersatileScript</strong> digitized by Dan X. Solo<br>
      The problem is it's not available anymore in GraphXEdge script fonts section:<br>
      <a href="http://www.graphxedge.com/fonts/scriptfonts.htm" title="http://www.graphxedge.com/fonts/scriptfonts.htm">http://www.graphxedge.com/fonts/scriptfonts.htm</a></p>
