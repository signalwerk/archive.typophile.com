      <div class="comment-spam-body"><p>_FILSON_ looks widened and perhaps boldened and perhaps has other changes.<br>
      _SINCE 1897_ might be close to a font.<br>
      Closest match I found so far is Goudy Catalog  </p><div class="imageWrap"><img src="http://typophile.com/files/GoudyCatalogAsSince1897_4331.gif"></div> <a href="https://www.myfonts.com/fonts/linotype/goudy-catalogue/" title="https://www.myfonts.com/fonts/linotype/goudy-catalogue/">https://www.myfonts.com/fonts/linotype/goudy-catalogue/</a><br>
      An also ran is Stratford <div class="imageWrap"><img src="http://typophile.com/files/StratfordAsSince1897_6347.gif"></div> <a href="https://www.myfonts.com/fonts/ef/stratford/" title="https://www.myfonts.com/fonts/ef/stratford/">https://www.myfonts.com/fonts/ef/stratford/</a><br>
      Using Stratford Medium might work as a base for making _FILSON_ <div class="imageWrap"><img src="http://typophile.com/files/StratfordMediumAsFILSON_5708.gif"></div> if it is widened 130%<br>
      <div class="imageWrap"><img src="http://typophile.com/files/StratfordMediumWidth130pctAsFILSON_4235.jpg"></div><br>
      Don<p></p>
      </div>
