      <p>Hoefler Text Bold, stretched and squashed, would also make a good basis for recreating the look of |FILSON| (you’d also have to refine the serifs):<br>
      <a href="http://www.myfonts.com/fonts/apple/hoefler-text/" title="http://www.myfonts.com/fonts/apple/hoefler-text/">http://www.myfonts.com/fonts/apple/hoefler-text/</a></p>
      <p>Or use Hoefler Titling Bold, which has finer serifs:<br>
      <a href="http://www.typography.com/fonts/hoefler-titling/styles/" title="http://www.typography.com/fonts/hoefler-titling/styles/">http://www.typography.com/fonts/hoefler-titling/styles/</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HoeflerTitling_4664.png"></div><p></p>
