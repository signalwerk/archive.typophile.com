    html: |-
      <p>_FILSON_ looks widened and perhaps boldened and perhaps has other changes.<br>
      _SINCE 1897_ might be close to a font.<br>
      Closest match I found so far is Goudy Catalog  <img src="/sites/default/files/old-images/GoudyCatalogAsSince1897_4331.gif"><a href="https://www.myfonts.com/fonts/linotype/goudy-catalogue/">https://www.myfonts.com/fonts/linotype/goudy-catalogue/</a><br>
      An also ran is Stratford <img src="/sites/default/files/old-images/StratfordAsSince1897_6347.gif"><a href="https://www.myfonts.com/fonts/ef/stratford/">https://www.myfonts.com/fonts/ef/stratford/</a><br>
      Using Stratford Medium might work as a base for making _FILSON_ <img src="/sites/default/files/old-images/StratfordMediumAsFILSON_5708.gif"> if it is widened 130%<br><img src="/sites/default/files/old-images/StratfordMediumWidth130pctAsFILSON_4235.jpg"><br>
      Don</p>
