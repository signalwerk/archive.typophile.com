    html: |-
      <p>Hoefler Text Bold, stretched and squashed, would also make a good basis for recreating the look of |FILSON| (you’d also have to refine the serifs):<br><a href="http://www.myfonts.com/fonts/apple/hoefler-text/">http://www.myfonts.com/fonts/apple/hoefler-text/</a></p>
      <p>Or use Hoefler Titling Bold, which has finer serifs:<br><a href="http://www.typography.com/fonts/hoefler-titling/styles/">http://www.typography.com/fonts/hoefler-titling/styles/</a></p>
      <p><img src="/sites/default/files/old-images/HoeflerTitling_4664.png"></p>
