    <p>This is just a curiosity question.</p>
    <p>Web designers don’t have a huge range of faces to choose from when building a web site. Often, when I see a site targetted at children (or even youth), the first gut reaction always seems to be “hey, let’s use comic sans because it’s ’friendly’ and ’kid’s will like it’”</p>
    <p>But do they? Does using a cheesy face like that actually target that demographic better? Or is it just pandering? Baby talk? Insulting? Is there any scrap of data out there that would indicate one or the other?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/17266" class="topic-previous" title="Go to previous forum topic">‹ Chalet</a> <a href="/node/17299" class="topic-next" title="Go to next forum topic">Barnhart Brothers ampersand problem ›</a></div>
