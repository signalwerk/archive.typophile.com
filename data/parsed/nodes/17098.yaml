      <p>Mouth calligraphy sounds a good idea; you’d probably need some kind of toothguard-style grip to get a decent purchase on the brush or pen, but I know mouth-painting works for artists who’ve suffered strokes. As for intensity: when, as recently, severely depressed, calligraphy is the only, only thing that cheers me up. I don’t think ductus or any of the other accidentals of calligraphy are crucial to text type design though - calligraphy is just something a good designer can pretend to be doing (and allow his users to pretend to be doing), like pretending to be Zarathustra when making or, back in the day, using Futura. No good designer has ever really got into a muddle about this - not even Jenson.</p>
      <p>Incidentally, I just saw you reference Kallir! My word, I didn’t think anyone else alive had traced our psychogenetics at those daintily slippered feet. Must try and find that book.</p>
