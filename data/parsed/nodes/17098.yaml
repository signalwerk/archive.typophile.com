    date: 2006-01-15T08:17:00
    date_raw: 15.Jan.2006 8.17am
    votes: null
    html: "<p>It should be a higher priority. Most people writing here will still have handwriting that is not legible, let alone readable. That’s the work, as Gerrit Noordzij argues, of teachers who believe that letters are not things but pictures of things most closely represented by the forms of Futura. In training in deliberative reading, 14 pt Gill Educational will do nicely. In training in immersive reading, any readable seriffed humanist-axis font at 11-12 point will do. But children should also have reproducible models for handwriting, perhaps offered at a stage between those two, or simultaneously with the second. ’Confusion’, in practice, doesn’t apparently come about: as Noordzij says, children can even tell the difference between lunch and dinner; and it will create some awareness that different styles for letters are possible, and that there can be reasons for preferring one to another.</p>"
    html_clean: "<p>It should be a higher priority. Most people writing here will still have handwriting that is not legible, let alone readable. That’s the work, as Gerrit Noordzij argues, of teachers who believe that letters are not things but pictures of things most closely represented by the forms of Futura. In training in deliberative reading, 14 pt Gill Educational will do nicely. In training in immersive reading, any readable seriffed humanist-axis font at 11-12 point will do. But children should also have reproducible models for handwriting, perhaps offered at a stage between those two, or simultaneously with the second. ’Confusion’, in practice, doesn’t apparently come about: as Noordzij says, children can even tell the difference between lunch and dinner; and it will create some awareness that different styles for letters are possible, and that there can be reasons for preferring one to another.</p>"
