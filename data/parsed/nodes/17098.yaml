      <p>The practicality of handwriting will last as long as pens are smaller than comfortably-sized keyboards. Having read that article, I agree that there is no need to learn to handwrite well until rather later than is now normal, when it can be done more swiftly. </p>
      <p>Good to see you’re sound on the cloying nostalgia question.</p>
      <p>In making life pleasant, notan will for many be crucial. I’d say that the pleasure given by seeing and making beautiful writing is always and only the product of notan, and I know no experience of immersion in notan-creation as intense as that in calligraphy: because letters are justifiable in their forms and neutral (being as it were Turing-complete) in their meaning, as other kinds of notan-creation cannot be.</p>
