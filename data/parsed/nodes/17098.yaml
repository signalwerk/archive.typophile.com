      <p>All of the childrens’ books I raed as a child (don’t ask how long ago) were set in normal book fonts.  A big one was Century School Book of all things. The only difference was that text was a point size or two larger than usual and leaded more. We learned to read just fine then without being treated like a subculture.<br>
      We also read Comic Books for fun but I think normal text type was easier to read than the hand lettered comic book wording. Kids read comic books because they liked the content, not because of the text hand.</p>
      <p>ChrisL</p>
