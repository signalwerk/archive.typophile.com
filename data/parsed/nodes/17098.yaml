      <p><em>Bold, bright colors and shapes.</em></p>
      <p>We’ll, I’m not a kid, and I haven’t done any research, but I find that just as patronizing IMHO. My 4 year old, when he talks of color, talks about all colors. Browns, blacks, greys. He just doesn’t talk about bright red, bright blue and bright yellow. Yet a lot of products aimed at kids assume that’s the only 3 colors in their universe.</p>
      <p>I have a hunch that comic sans falls into the same logic that is used to pick colors for kids.</p>
      <p>High contrast black, white and red have been studied as good colors for the very young (infants) but I haven’t seen any research beyond that.</p>
      <p>In the end, it sounds like there hasn’t been any real research into the pros/cons of comic sans, and, as such, we need to fall back on our own training and point out that it’s an ugly face and no sense using an ugly face when we don’t have to. ;o)</p>
      <p><em>I bet the children don’t even recognize that type is different</em></p>
      <p>Dan...read the last line of the quoted bit I posted above: “Many of the children we spoke with were able to talk about the differences between the typefaces.”</p>
      <p>That was interesting. And, also, a bit counter to what I’ve read from adult research, where adults couldn’t often discenr between a sans and serifed face.</p>
