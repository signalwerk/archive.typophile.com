      <p>Mark:</p>
      <p>I completely understand. I guess what I’m asking if there has been anything that could be considered ’data obtained from research’ that would indicate whether or not children actually benefit and/or prefer bad hand scrawling. ;o)</p>
      <p>Action: </p>
      <p>I’ve read a bit about the dyslexia issue, but it seems that there’s a wide variety of faces that can work and that the main issue is having a closed ’a’ and an open ’g’. I’ll have to check...perhaps Comic Sans is the only web-friendly face that has that attribute.</p>
      <p>Of course, then there’s the issue as to whether or not the benefit to those with dyslexia outweighs any other potential drawbacks to using Comic Sans. </p>
      <p>Paul:</p>
      <p>That thread then links to this thread:</p>
      <p><a href="http://typophile.com/node/14206" title="http://typophile.com/node/14206">http://typophile.com/node/14206</a></p>
      <p>which I actually participated in. ’doh. Gotta work on my memory skills. ;o)</p>
      <p>The comments I tended to agree with in that thread were ’kids don’t like to be treated like kids’ and the use of comic sans seems to do just that. It’s almost ’hey, you’re a kid, here’ some rainbows and unicorns and comic sans!’</p>
      <p>But that’s just my opinion. Certainly not any sort of research.</p>
      <p>The only research that seems compelling is that the youngest children, who are still sounding out their words, depend on simple, recognizable letterforms. And as ugly as Comic Sans is, I guess that’s where it has some appeal, as the letterforms are quite simple. </p>
      <p>This site was mentioned:</p>
      <p><a href="http://www.kidstype.org/" title="http://www.kidstype.org/">http://www.kidstype.org/</a></p>
      <p>But when it got to kids opinions, it seemed to leave us hanging:</p>
      <p><em>Discussions with children about these further confirmed that typefaces can have an important effect on how children perceive a text, and hence their motivation to read. Associations can be strong, and there seems to be some comfort for young children in reading things that look familiar or ’normal’. Many of the children we spoke with were able to talk about the differences between the typefaces.</em></p>
      <p>...and!? ;o)</p>
