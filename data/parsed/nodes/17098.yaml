      <p>Carl’s comment about differing stages of childhood reading development brought to mind something I often struggle with. I wish I remembered the reference but I can’t so I hope this is right. Children only need larger type at the early years of reading when they are learning character recognition, The part I am guessing about is the age. I remember it as about 9 years old (earlier for quick learners). At this point they have developed full visual acuity. Thereafter, size does not matter (type size that is). By middle school, their eyes are as developed as they will ever be. That is why when I am trying to read very small type (serial numbers from a DIMM) I show it to a 12 year old who can see it clear as day unaided. I need more than my trifocals and a magnifying glass to have a prayer.<br>
      The problem is I have clients who insist on at least 14pt type for anyone below college age! Even when I try to explain how they are limiting saccadic jumps with such large type and slowing down reading, they don’t care. They say “but this is for kids.”<br>
      I wish researchers would come up with something like the “Type Pyramid” where they would definitively establish thresholds of type size for each age group in increments of 5 years.<br>
      ChrisL</p>
