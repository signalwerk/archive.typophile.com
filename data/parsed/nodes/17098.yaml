      <p>Interesting that the whole concept of kids faces is so new, part of the baby-boom generation’s “kids first” fetishizing that’s gone on recently. The children’s books I grew up with used classic fonts, primer fonts I guess, both serif and sans serif that were very easy to read. Such as Century, Futura, etc.</p>
      <p>That said, there are some kid-oriented fonts that I find less in your face than Comic Sans, such as Felt Tip and Providence.</p>
      <p>There used to be a show called Wonderama when I was a kid and I remember recoiling at the whole “COME ON KIDS LET’S HAVE FUN!” idea. They gave out Banana bikes as prizes and all I wanted, as  a kid, was a big-kids bike.</p>
