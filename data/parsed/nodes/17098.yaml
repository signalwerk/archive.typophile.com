      <p>Yes, pens are a lot less cumbersome, but the problem is that what you can do with the results is much more limited compared to results from a keyboard; and handwriting recognition has yet to really take off (for whatever reason). Now, if you could show that improving people’s handwriting by an amount modest enough to make it realistic would cause most handwritings to become machine-readable, and the machines doing the reading would be portable and affordable enough, then I’d be all for that. I simply want people to communicate more and better.</p>
      <p>&gt; I know no experience of immersion in notan-<br>
      &gt; creation as intense as that in calligraphy</p>
      <p>Until you grasp how badly the White is being treated.  :-/<br>
      To me this is not “justifiable”.</p>
      <p>Also: I think we use our hands mostly because it’s practical,<br>
      not because it’s “intense”. Yes, it’s more intense than key-<br>
      boarding (to most people) but I suspect we’ve overblown this<br>
      intensity. Eating is more intense than writing (again to most<br>
      people I think) but that doesn’t mean we should rush headlong<br>
      into eating a lot all the time. And I can imagine for example<br>
      how performing calligraphy with one’s mouth would be much<br>
      more intense than with the hands. I’m not kidding - it might<br>
      be a very valuable experience to make marks with the more<br>
      primordial parts of our bodies!</p>
      <p>All this said, I do agree that writing, especially the mindful<br>
      kind, can be a very positive thing; which is why I honestly think<br>
      calligraphy has a lot going for it, and one of the reasons I took<br>
      a calligraphy class last year. What gets my goat though is when<br>
      calligraphy is allowed to [continue to] tread on typography.</p>
      <p>hhp</p>
