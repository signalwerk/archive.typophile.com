      <p>Sounds like a lot of people who make design decisions for children were never children themselves. I really don’t buy the patronizing, oversimplifying twaddle that is presumed to enable children to comprehend, to see, to sense. Simon actually has a point; though children aren’t born with high visual acuity, nor the ability to read, they are tremendously perceptive, curious, and absorbent of their visual surroundings. Their brains process and develop incredibly fast, and they move from one thing to another like ravenous caterpillars. Assuming that subtle colors and 2-storied a’s are wasted on them really sells them short. A lack of imagination on an adult’s part should not hinder a child’s experience. Children have no trouble learning 2 or 3 languages simultaneously. That’s not whistling Dixie!</p>
      <p>I find I’m also reverting to the adult pattern of lumping all children of every age together. I bet developmental psychologists perceive dozens of brief distinct stages in development between birth and adolescence. </p>
      <p>I think the concern with “infant forms” such as the a in Comic Sans is relevant for a VERY BRIEF PERIOD when children are learning the alphabet, and how to read. I suspect that once that skill has been mastered, suddenly, large print, infant forms and other silliness are completely irrelevant. But don’t tell mom and dad! </p>
      <p>gigGle!</p>
