    <p>This might be a long shot, but here goes... </p>
    <p>I just bought Wiescher's "Guilloche A". I  am trying to create a guilloche pattern with it, and realize that I have no idea how to do it. Has anyone here used this font and do you have any tips for me? i.e. Suggestions for characters to repeat and layer?</p>
    <p>Thanks!<br>
    Carey</p>
