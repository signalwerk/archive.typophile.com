      <p>Hi Carey,</p>
      <p>I assume you have read its <a href="http://new.myfonts.com/fonts/wiescherdesign/guilloche-a/?refby=mfde">description on MyFonts</a>?</p>
      <p><cite>Under the keys A-U and a-u you find joining pieces. Under the keys V-Z and v-z I placed start- and endpieces. 0-4 are different lenght straight extensions and 5-9 are not quite so straight extensions. All other keys are corner pieces that can be used as stand-alones or put in rows to make for superb decoration.</cite><br>
      <cite>With a little bit of experimentation and maybe colored overlays you can achieve super-phantastic designs.</cite> — Gert Wiescher</p>
