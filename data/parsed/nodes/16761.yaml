  html: |-
    <p>Like some other recent critique posts, this font was created for Amy Conger's class at City College of San Francisco. It lacks any adjustment to the vertical and horizontal strokes to make the weights appear balanced. It is not kerned, and the widths of the letters are not adjusted systematically. The font is not adjusted for ink trapping, so on most output devices the a, b, d, g look thick.</p>
