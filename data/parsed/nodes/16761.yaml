    html: |-
      <p>On first glance, many of the curves look bumpy and the stroke weights are inconsistent.  Look at the m and n for example.<br>
      Clean curves are very important in particular for a geometric sans like yours.  Take some time and learn to make clean curves keeping BCPs perpendicular and their handles of even length. Then come back to your glyphs and give them a new workout.  Type is about rhythm.</p>
      <p>ChrisL</p>
