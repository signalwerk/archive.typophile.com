    <p>Although this is a topic that people who really know about will rarely address in public (hmmm, what topic isn't? :-) I'd like to ask for people's experiences, so we can build a "knowledge base" so the speak.</p>
    <p><strong>What are good pricing schemes for commercial licenses and custom work? By the former I mean like pricing for site licenses, etc. And by the latter I mean pricing for custom/exclusive fonts.</strong></p>
    <p>Let me break the ice with two things from my end:<br>
    1) One of my non-Latin commissions has involved pulling a then-recently-released and single-digit-sold Armenian font from the retail market and transferring exclusive rights (for 3 years) to a small literary publication: $1600. Two weights with mechanical obliques.<br>
    2) I recently sold an Armenian retail font set (four weights, no italics) to the local Church Diocese for use on any computer in their main headquarters (in Burbank). Normally costing $250, I charged them $400.</p>
    <p>hhp</p>
