t the total dollar estimate. If the project goes over hours (with unchanged scope), I continue billing at a slightly reduced rate. This gives me incentive to spec the job correctly, but protects me from getting taken to the cleaners. I think this would translate ok to type design also. Clients have reacted well to it, but I'm curious to hear if others do similar things, or how I could improve managing pricing.</p>"
