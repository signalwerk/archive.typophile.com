    html: "<p>For custom work, I don't think it is possible to set a price independent of who the client is: Microsoft pays more for my services than the Society of Biblical Literature. Also, the price tends to vary according to the value added, which in turn should be reflected in the license rights. A license may be exclusive, but still might not permit some kinds of use or distribution; another license may not be exclusive, but may permit virtually any use and even redistribution. A client might say they want the font e.g. to bundle with a specific product, but if they request a license that permits more than that -- even if they only ever bundle with that one product -- then they pay for what the license permits, not what they actually intend or do. <br> <br>$1,600 seems very little for exclusive rights for three years for two weights. What were the license terms?</p>"
