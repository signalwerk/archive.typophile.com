    html: "<p>Regarding revisions: <br> <br>I've taken to including a clause in contracts that specifies a 60 day test period following delivery of the fonts, and any bugs reported during this time are corrected free of charge. If bugs are reported after the 60 day test period, I reserve the right to charge hourly rates for fixing them, at my discretion. The main purpose of this clause is to encourage the customer to seriously test the fonts as quickly as possible, so they're not coming back to me six months later when I'm in the middle of another project.</p>"
