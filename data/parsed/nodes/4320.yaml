    html: <p>Here's how I would go about figuring out a rate for work for hire. <br> <br>Figure out how much annual salary you would like. Let's say $50,000 US. (Which is actually pretty darn low for the software industry; I'm assuming this is somebody early in their career.) <br> <br>Add some amount for benefits and the like. If you aren't in a country with a real socialized medical system, say 50%. That's $75K. <br> <br>Also, add in the costs of buying computer hardware and software, books, attending conferences, and any other major work expenses you'll have. I'll assume you're working from your home and your home office space expenses are minor. Let's say all this is $10,000/yr. So now we're at $85K. <br> <br>Take into account what percentage of your time you expect to actually spend doing paid work for your clients. After all, your billable hours probably don't include all that time pitching ideas, doing research and study on your own, accounting, going to conferences, or even a vacation. I'll say half the time is real billable work. So that means I have to double my numbers again. Now we're at $170K. <br> <br>So, in this example one needs to charge a billing rate that would equal $170K annually, to live as if you were on a $50K salary. <br> <br>With about 250 working days per year, that would be $170K/250, or $680 per day. If we assume an 8-hour day, that's $85/hr. <br> <br>So that's how I would figure out an hourly rate for work for hire. I might have different numbers than the ones above, but that's the methodology I'd use. <br> <br>If I'm doing custom work but I get to keep the rights afterwards, I'd base it off of the above rate. How much of a discount I'd give would depend on many factors previously discussed, such as how re-usable the work is, who the client is, and the extent of their expected use. Unless the work was stuff I would have done anyway on my own, is for a non-profit I'm in love with, or is clearly awesomely re-sellable, I'd never go below half my normal rates. <br> <br>For fonts that one has already made, pricing is a very different issue. Here you need to look at it as a normal retail process and price based on those factors. <br> <br>So, those are my thoughts on pricing methodology. <br> <br>Regards, <br> <br>T</p>
