    html: |-
      <p>Pricing of work is not something unique to typography.  Every industry has one or more accepted ways of doing things, but there are some common themes.  In other words, this is a problem that has been solved time and time again.  Look not just to other typographers but also other industries for lessons in how to handle this component of your business.</p>
      <p>I cringe at Randy's strategy of providing an estimate and charging for hours spent above and beyond that estimate (even at a reduced rate).  In most industries that won't fly with serious clients.  In fact, the exact opposite scenario is much more common:  an hourly rate with a 'not to exceed' amount above and beyond which the client doesn't pay extra.  No, it's not as friendly to the producer but most markets behave as buyers' markets when it comes down to it and hence clients walk away without that sort of price guarantee.</p>
      <p>Equally bothersome is the following:</p>
      <p>"First, decide what you would truely like to get for the work. Regardless of what you think the cleint is prepared to pay. What do you want? Then Triple it. </p>
      <p>If when presented to the client, they don't blink, well, you could have gotten more, but you are getting triple of what you wanted. </p>
      <p>If they do blink, or gasp, or pass out, you still could cut it in half, come off as someone who knows how to compromise, and still be getting a third more than you wanted."</p>
      <p>I have had this experience before from the client side.  I told them to hit the road, and they never got to bid our work again.  It's not about 'enjoying negotiations'; I am as seasoned of a negotiator as they come, seasoned enough to know when you're wasting my time.  While you're at it, don't try and act like you're doing me some big favor by patronizing my desire to negotiate.  I fully expect to negotiate -- within 5 to 10 percent of the initial price.  Any more, and I feel like you have too much margin in it.  Any less, and I feel you don't have enough.  Yes, I really do expect you to make money off me; just not too much.  I also know your business well enough to know if this is the case.  That's part of being a successful businessperson, to know your vendors' businesses in addition to your own.  Even if I didn't, more likely than not I'm getting a bid from one or more of your competitors and I'll see right through any attempt to take advantage of me. </p>
      <p>Both these strategies I list seem to result from a businessperson trying to mitigate risk.  About that I'll say this:  risk management is all fine and good, but don't take it too far.  Focus more on refining the accuracy of your estimation process than ways to salvage a blown bid or win the lottery by having a clueless client take a high bid.  Repeated application of a consistent pricing scheme that includes a margin with which you're comfortable will win out every time over trying to hit it big and dialing back when you fail.</p>
