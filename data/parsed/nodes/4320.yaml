    html: <p>Hrant if you want to see data, why not do a simple P&amp;L to determine the hourly rate you have to bill in order to make your business work. Using John's suggestion that a custom font takes several weeks minimun, that would amount to between 70 and 80 hours of billable time. A $500 fee would net you an hourly rate of $7.143 for 70 hours work or $6.25 if it took 80 hours. <br> <br>These are not numbers that one can run a successful business with. They are therefore hobbyist. <br> <br>Now, instead of $500 subsitute $5000. Now your time is netting $71.43 or $62.50 per hour. Not entirely spectacular numbers but moving towards what it takes to keep a business afloat.</p>
