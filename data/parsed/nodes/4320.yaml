    html: "<p>Randy, in response to your points above: <br> <br>1. Yes, size of client affects the price both in terms of budget size and number of users. In the case of Microsoft and SBL, the fact that the latter is a scholarly organisation and would be making the font truly free to scholars, i.e. not bundling it as part of a commercial software package such as MS would, also affect the price. [In the case of the SBL font, I charged them a fair price for what they wanted, but I also donated all the smallcaps in the fonts, because they didn't have the budget for these and I thought the fonts needed them. But I made sure they knew that the smallcaps were being donated, and that what they were paying for was a subset of the total glyphs in the font.] <br> <br>2. Relating price to exclusivity is the most difficult thing, I find. You have to imagine how much more money you might make over time if you also had the right to license the font to other customers, but you can only guess that (unless you happen to have those other customers lined up). Obviously, if a client wants a real exclusive, i.e. to effectively own all rights outright (in which case you are doing work for hire), you can't expect them to compensate for every dollar you might possibly have earned in future. The process of imagining potential future profits is worthwhile, because it helps you come up with a price that is relative to the nature of the typeface. If someone wants to commission and exclusive text or display typeface for use in a glossy magazine, you have to consider that the future potential sales of licenses to such a type are considerable; if someone wants to commission an ISO CAD lettering and geometric tolerancing symbol font, the future market is probably fairly small, although the license price might be higher. <br> <br>3. I tend to do a lot of work up front when preparing a quote, particularly in terms of defining the glyph set. I usually do this in a spreadsheet, and keep track of which glyphs require individual design of outlines and which are composites. This enables me to base the bulk of my quote on a price per glyph for design, composite building, and hinting. Obviously things like OpenType Layout development, have to be estimated in terms of hourly rates, since they are not so easily quantifiable as designing and hinting, and the quote needs to be buffered so that clients can request additional glyphs at the last minute. I also add a full half day billable time for mastering each font, i.e. running through Font Validator, fixing table errors or inconsistencies, etc. I try to split testing duties with the client, but this is possible because most of my customers are software developers with their own testing departments. <br> <br>The best thing about basing quotes on glyph counts is that it allows one to be fairly precise, both in relating work to typical amounts of time for different tasks, and in providing a justifiable price. This is reassuring to both clients and to oneself, and much better than picking numbers out of the air. <br> <br>So this is my advice: try to break a project into specific tasks; estimate how long each task will take; figure out how much you want to be paid for that working time; multiply by the number of tasks; buffer. This will give you a basic price that will cover your work and keep you happy. Then add a percentage if the client if wants exclusive rights, either in perpetuity (high percentage) or for a limited time (lower percentage). I'm afraid I can't suggest what these percentages should be: by that stage you should have a feel for the client, and some sense of what their budget is likely to be.</p>"
