    html: "<p>Sorry, but no. <br> <br>I share a huge amount of information that helps other people to make better quality fonts: lots of technical information and free resources that take me a lot of time to prepare. I do this because I cherish the explosion of creativity in type design that followed from the collapse of the old manufacturer system, and I want to do my part to make sure that this is not lost as font formats and technologies advance and become more complex. As I've said many times in the past, I don't believe that type designers should compete on the basis of technical quality. But I do think they should compete on the basis of design quality, and also on the basis of price. I'm not about to make it any easier for my competitors to compete with my prices. <br> <br>I will say this: a client who recently commissioned Tiro to produce some exclusive fonts -- who had invited a number of other companies to bid on the job -- told me that he thought we could afford to raise our prices. So when I say that some prices seem too low, it is not from the position of someone who is charging high prices within his market.</p>"
    html_clean: "<p>Sorry, but no. <br> <br>I share a huge amount of information that helps other people to make better quality fonts: lots of technical information and free resources that take me a lot of time to prepare. I do this because I cherish the explosion of creativity in type design that followed from the collapse of the old manufacturer system, and I want to do my part to make sure that this is not lost as font formats and technologies advance and become more complex. As I've said many times in the past, I don't believe that type designers should compete on the basis of technical quality. But I do think they should compete on the basis of design quality, and also on the basis of price. I'm not about to make it any easier for my competitors to compete with my prices. <br> <br>I will say this: a client who recently commissioned Tiro to produce some exclusive fonts -- who had invited a number of other companies to bid on the job -- told me that he thought we could afford to raise our prices. So when I say that some prices seem too low, it is not from the position of someone who is charging high prices within his market.</p>"
