    html: "<p>I understand your frustration Hrant, but also the frustration of the sons of thunder (James and John) with demands that they should lay bare their pricing structures for others to undercut. <br> <br>Instead of talking specific numbers, perhaps we can talk how factors in a custom job change the bottom line generally. I have not designed a custom font beyond the hobbyist level, so I'm keen to at least get a sense of the game. Here are some areas that have come up already: <br> <br><b>1. Size of the client.</b> <br>In John's first reply he notes that Microsoft would pay more than the Society of Biblical Literature. Is this because they have a larger purse or because they have more users or both? One way I would consider approaching the size of the client is the number of users. My thought would be to ramp up the cost with a similar scale as licensing a font (ie. with a reduction in cost per user as more users are added). Does this approach make sense? What are other things to consider? <br> <br><b>2. Terms of agreement.</b> <br>Exclusivity: the longer the agreement the more it will cost. I have no sense of how to approach this. I'd just be making up numbers out of the air. Any factors to consider that would lead to reasonable rate scale? What other terms would change the price? <br> <br><b>3. Scope of delivered product.</b> <br>Do you think about this strictly in terms of hours, or a per weight basis? For example 2 weights vs 4 weights (two masters and two interpolated): Time analysis says 4 shouldn't cost twice as much. Weight analysis says it should. Thoughts?  <br> <br><b>What else should I ponder?</b> <br> <br>John and James, thanks for your candor thus far. I'd love to hear more if you're willing, but understand if you decline. <br> <br>Cheers, <br>Randy <br> <br>Oh, one other question: <br>The approach I've taken in estimating freelance design projects is to provide a dollar estimate and an hour estimate. If I finish ahead of schedule I collect the total dollar estimate. If the project goes over hours (with unchanged scope), I continue billing at a slightly reduced rate. This gives me incentive to spec the job correctly, but protects me from getting taken to the cleaners. I think this would translate ok to type design also. Clients have reacted well to it, but I'm curious to hear if others do similar things, or how I could improve managing pricing.</p>"
