    html: |-
      <p><em>…over thinking…</em></p>
      <p>But one wonders, would a typical Bloomberg reader interpret the word "Austerity" set in a fancy Anglo blackletter as connoting "German", or would there be a semantic conflict between the meaning of the text and the type style? </p>
      <p>In general, designs that work on multiple levels, from lay to pro, are best.<br>
      That isn't over-thinking, but professional due diligence.</p>
