    html: |-
      <p>The font has an Anglo quality, rather than Germanic: it is Bitstream's version of London Text.<br>
      So I'm afraid the allusion "Blackletter = German" doesn't work for the typographically informed.<br>
      I immediately thought that as an anglo style, it represented Keynes, not Weimar, which contradicts the article's content.<br>
      Besides, for a graphic designer, "Weimar" suggest Bauhaus, not Völkisch.</p>
      <p>A modernized (sans) blackletter (e.g. Tannenberg) would have worked better, but I suspect that would have required a font purchase, and the Bitstream font was on hand, bundled or in a folio.</p>
