    <p>i’d like to present my ﬁrst, from the scratch on self made font. she’s called wallﬂower (i think it’s a she) <br><br>i designed her on screen (and on paper of course), but in the further development i’ll try to cut the letters from wood and make a set of wooden stencils at about 300pts.  <br>i decided to use the shapes of a sans, based on a renaissance antiqua as an opposite to most stencil fonts i know, which have allways a very hard, brutal and often army look. for the same reason i only drew lowercase.  <br><br>when painted on a wall it should look nice, not like vandalism, to let the message be heard. <br><br>she’s slightly slanted to give her the attitude of spoken word. <br><br>perhaps she is in general to light, but i think at 300pts it could work. a huge problem is the spacing because in wood, there is no kerning. therefore i have to keep it quite loose.  <br><br>well, those are my thoughts, please tell me yours! <br>and if my english was too bad to explain the idea, just ask.  <br><br><br></p>
