    html: <p>I ﬁnally located the ‘o’ I was thinking of when I referred you to the brush fonts. It is in  <a href="http://www.adobe.com/type/browser/F/SANP/F_SANP-10005010.jhtml" target="_blank">Sanvito</a> from Robert Slimbach.  <br><br>As you see, it breaks at the top left, and the two ends of the break are diﬀerent. I don’t know what is the best solution for you, but I think the bottom break looks awkward, and the rest of your face is elegant. You will have some more challenges with cap <span class="caps">BDO</span>, and maybe your solutions there will guide you.  <br><br>I think the new ‘a’ is a deﬁnite improvement — you kept the ‘look’ with more balance. I agree with Chris that the old ‘s’ is&nbsp;better.   </p>
