      <p><a href="http://img198.imageshack.us/img198/4452/bgvsru9vl.jpg">http://img198.imageshack.us/img198/4452/bgvsru9vl.jpg</a></p>
      <p>I will suggest reviewing some of your cyrrilic letters. As I stated earlier somewhere else in this forum, the Russian alphabet is not the original Cyrrilic alphabet. Russian character style dates back to the time of Peter The Great, who hired some French typographers to make first lead clichez, so he can publish books in Russian.<br>
      A small group of Bulgarian typographers now tries to impose the Bulgarian character design as a European standard for Cyrrilic, since Bulgaria will be (hopefully) the first country in EU to use Cyrrilic. This is a tough deal, and it's not supported by our govt. I doubt that they will succeed in this, because Bulgarian are mere 8 millions compared to whatever millions are Russians. But I think our style &amp; design is better thatn Russian.</p>
      <p>And you may want to excuse me for my English. :)</p>
