    html: <p>Titus, I think you are going the right direction with the o. <br><br>You can probably ﬁnd a still better solution by playing with further variations — top of break bigger, bottom smaller, diﬀerent ‘cut’ angles, both small, both big, having the two ends not align, etc. I think the cap O may be the key test as this will be even more prominant…  <br><br>I do think that what you can draw with a pen or felt tip, starting at the top and going clockwise, will be a guide to what the eye will accept as ‘natural’ looking, so you might want to experiment on paper as&nbsp;well.   </p>
