    html: <p>Titus, on the ‘o’ I was thinking that you could look at the way ‘brush’ and other scripts break the ‘o’; they involve also modulating the width at the break — the two sides of the break being diﬀerent. <a href="http://www.myfonts.com/fonts/linotype/brush-script/brush-script/win-t1/113367/character/006F/CP2/1/" target="_blank">Brush-script</a> is one example. If you do a search at myfonts.com under the key word ‘brushdrawn’ you will get a load of examples with diﬀerent ways the ‘o’ is treated. Your design calls for a somewhat diﬀerent solution, but you might ﬁnd inspiration&nbsp;there.   </p>
