      <p>Well...Hrant. I would love to, but unfortunately there are few (if any) resources that prove my opinion. Of course, many Russians won't agree with me, as they are already comfortable with current style, widely supported by Apple, Microsoft &amp; Adobe. It's a matter of perception - but I definitely think that Bulgarian style is more....beautiful than Russian. As you can see for yourself, the lower Cyrrilic "v" (or "b") in Russian style is nothing but a scaled down version of the capital letter.</p>
