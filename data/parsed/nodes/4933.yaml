    html: '<p>On the g, yeah, I was going to say that — the linkage between the loops is too tight. In small sizes that would be a problem. On the caps: Normally the cross bar of the E and H would be higher. I think it would look better here also. For me the bent joins in the <span class="caps">MN</span> don’t go well with the rest of the caps. Check out the solution in Friz Quadrata, which puts the bent joins only at the bottom; that might give you some ideas.  <br>The swash T goes well with the face, but I think the right terminal on the cross bar looks out of place. <br><br>I waver on whether this is too much or too little  of the ‘stencil’ eﬀect, or just right. Have you tried it with breaking the branches of the hmnr from their stems, for a more ‘stencil’ look? Or tried just forgetting about a consistent stencil look and having a closed oOQ? Maybe you could have alternative versions in the ﬁnal. The design eﬀect of the openning of the other letters than  oOQ is so nice that this would be viable as a display face, without being a full stencil.   <br><br>Good luck with this; it has a nice, distinctive&nbsp;look.</p>'
    html_clean: '<p>On the g, yeah, I was going to say that — the linkage between the loops is too tight. In small sizes that would be a problem. On the caps: Normally the cross bar of the E and H would be higher. I think it would look better here also. For me the bent joins in the <span class="caps">MN</span> don’t go well with the rest of the caps. Check out the solution in Friz Quadrata, which puts the bent joins only at the bottom; that might give you some ideas.  <br>The swash T goes well with the face, but I think the right terminal on the cross bar looks out of place. <br><br>I waver on whether this is too much or too little  of the ‘stencil’ eﬀect, or just right. Have you tried it with breaking the branches of the hmnr from their stems, for a more ‘stencil’ look? Or tried just forgetting about a consistent stencil look and having a closed oOQ? Maybe you could have alternative versions in the ﬁnal. The design eﬀect of the openning of the other letters than  oOQ is so nice that this would be viable as a display face, without being a full stencil.   <br><br>Good luck with this; it has a nice, distinctive&nbsp;look.</p>'
