      <p>I think having differences between UC and lc is indeed good; as is having more extenders in the lc. On the other hand, the Bulgarian style is severely Latinized, and this is severely bad. And it doesn't make sense that Bulgarian is more Authentic Cyrillic than the Russian style, because it is <strong>farther</strong> from it. In fact, I think Peter The Great Diluter would have been envious of the Bulgarian style...</p>
      <p>hhp</p>
