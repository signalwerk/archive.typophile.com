    <p>Just updated the <a href="http://www.theharrietseries.com/" title="http://www.theharrietseries.com/">http://www.theharrietseries.com/</a> site to serve retina images (fair warning, it's a little slow) and remembered I never posted it on typophile. So here it goes, brace yourself for marketing copy:</p>
    <p>The Harriet Series is a rational serif family. It’s a contemporary reflection of the serifs popular in mid-20th-century American and English design. Harriet draws inspiration from both transitional faces, such as Baskerville, and modern faces, such as Century, at the same time it is unburdened by any particular historical model. The display styles give it just enough exuberance to sparkle while the diligent, sturdy text styles make it a true workhorse.</p>
    <p>The Harriet Series was awarded a Certificate of Type Design Awesomeness (or whatever it's called) from the Type Director's Club in 2012.</p>
    <p>Available exclusively at Okay Type: <a href="https://www.okaytype.com/harriet/series" title="https://www.okaytype.com/harriet/series">https://www.okaytype.com/harriet/series</a></p>
    <p><img src="http://www.theharrietseries.com/harriet-big-768-2x.gif" width="768px"></p>
