      <p>I feel a responsibility to state this disclaimer to anybody in your -enviable- situation: be careful of "growing up" thinking that type is based on chirography (what the hand holding a particular writing instrument tends to produce) since it might trap you on one continent of exploration. Gerrit Noordzij is the intelligent, charismatic high priest of chirographic type. Mind the foundations you lay for yourself.</p>
      <p>hhp</p>
