    html: |-
      <p>Two things come immediately to mind:</p>
      <p>The biography of Bram de Does, edited by Mathieu Lommen. I read it shortly after it was published, at a time when the business of making fonts for a living — meeting deadlines, responding to bug logs, trying to solve knotty technical problems — was beginning to take the pleasure out of designing type. This book was inspiring as a record of a humane and intelligent life in type design and typography, and a timely reminder of the things that first attracted me to this work. Hmm, maybe it's time to re-read it.</p>
      <p>Gerrit Noordzij's <em>Letterletter</em> (and later <em>The Stroke</em>). What I found inspiring in Noordzij was the development of systematic ideas about letters which enabled techniques of analysis and understanding. No one else I have read has attempted this, so while I'll go some way to seconding Hrant's caveats about how one approaches Noordzij — including how Hrant approaches Noordzij —, I consider these books inspiring in encouraging an analytical approach. So far, there is nothing similar in terms of scope and depth attempted from a different perspective, but there should be.</p>
    html_clean: |-
