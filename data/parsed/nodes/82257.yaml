    html: |-
      <p>I agree with Hrant, interesting site, thanks.</p>
      <p>Typography:<br>
      I can't claim that it kickstarted my ambition but a bit later in my education I found <em>Raster systeme</em> by JMB. I think it gave me a desire to know my own work inside-out and that maybe designing type would allow me an even more intimate understanding of layout and typesetting, from micro to macro.</p>
      <p>Type design:<br>
      <em>Adrian Frutiger Typefaces.</em>  This has been inspiring me for the past year.</p>
      <p>These are quite Titanic books and easy to suggest. What about the many smaller books along the way:</p>
      <p>As a kid I loved Dorling Kindersley educational books, which were fantastically arranged and really easy to navigate. They were also really consistent in series. At high school I studied Russian language and the textbooks were influential, as was learning a new alphabet. <em>Искра</em>, which was practically a zine as it was composed on a typewriter and <em>Вперёд!</em>, which had fantastic 3d lettering as well as photography of signage, stamps and general ephemera. I was also inspired at some point by <em>Schott's Miscellany</em> which is typeset and designed by the author.</p>
    html_clean: |-
