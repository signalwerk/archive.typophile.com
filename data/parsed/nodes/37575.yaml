    date: 2009-05-15T07:52:00
    date_raw: 15 May 2009 — 7:52am
    votes: null
    html: |-
      <p>It looks like some of the ornaments from Bickham Script, but I didn't see this exact one. Another reason ornaments are so hard to ID is that they may not be shown in the font samples in font books, and some web sites don't show all embedded glyphs in a single Character Map.</p>
      <p>The other problem is that there is not much way to know whether the particular ornament is hand-drawn or not. When there is only one of something shown, you have no way to know.</p>
      <p> - Mike Yanega</p>
