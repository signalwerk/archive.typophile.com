    <p>Hello guys! Happy New Year 2015!</p>
    <p>Today i have released new version of Wallington : it's Wallington Pro! </p>
    <p>Wallington Pro is a decorative-serif font embodying vintage and elegant curves with functional structure. Style is adopted from Old English cultures with their descendants around mid-12th century and Art nouveau in 19th century, it was inspired by natural forms and structures and the curved lines. Crafted with love and easy-to-read letter design.</p>
    <p>Wallington Pro consists of 721 glyphs including 268 unique ligatures, 30+ catchwords and 10 stylistic sets. </p>
