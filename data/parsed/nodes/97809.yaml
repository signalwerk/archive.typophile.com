      <p>Confirmation bias generally confirms other biases. People tend to value their own opinion highly. Market researchers have long know that different answers can be obtained by framing the question differently. Similarly, the manner of presentation can have an effect on how well or how badly the information is conveyed.</p>
      <p>So: is disfluency some form of deliberately-introduced cognitive dissonance and, if so, how is this dissonance achieved?</p>
