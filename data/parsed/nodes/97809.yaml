      <p>Nick,<br>
      I think that to say "In other words, novelty can be persuasive" is not accurate to the point of the article. It is not that novelty is persuasive, but that familiarity allows this confirmation bias, and therefore novelty allows more play to the rational intelligence. It is not the novelty itself is being persuasive, but allowing a good argument a better chance of sinking in.</p>
      <p>Novelty in advertising has a related effect, catching attention, and therefor creating a better chance for the punter to read the message.</p>
