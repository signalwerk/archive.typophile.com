      <p>"It is not the novelty itself is being persuasive, but allowing a good argument a better chance of sinking in."</p>
      <p>That's the argument made by the researchers. But the summary provided supports Nick's take just as well as theirs. Theirs has an interesting theoretical basis.</p>
