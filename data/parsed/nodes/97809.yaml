      <a href="http://typophile.com/node/94174" title="http://typophile.com/node/94174">http://typophile.com/node/94174</a> thread I noted above.</p>
      <p>The idea of disfluency leading to positive effects is not new. It seems to be implicit in the early 20th-century notion of ostranenie (literally: <em>making strange</em>) or defamiliarization associated with the Russian literary critic Viktor Borisovich Shklovsky. See:<br>
      <a href="http://en.wikipedia.org/wiki/Defamiliarization" title="http://en.wikipedia.org/wiki/Defamiliarization">http://en.wikipedia.org/wiki/Defamiliarization</a><br>
      <a href="http://en.wikipedia.org/wiki/Viktor_Shklovsky" title="http://en.wikipedia.org/wiki/Viktor_Shklovsky">http://en.wikipedia.org/wiki/Viktor_Shklovsky</a></p>
      <p>I would have some questions about the use of ‘[dis]fluent’ in these studies. For example, is it meant in roughly the same sense as by the authors of the paper featured in this thread:<br>
      <a href="http://typophile.com/node/84429" title="http://typophile.com/node/84429">http://typophile.com/node/84429</a></p>
