      <p>I was actually just trying to restate the thesis of the article, not argue for or against it. But that being said, I have to say i find the idea worth pursuing. I would think that if 'novelty sells', then the effect really is pre-cognitive, and is just a question of catching attention.</p>
      <p><cite>Perception—in the natural order of reception, perception, conception—occurs at the pre-rational level; in other words, information from the five senses is processed before the Sixth Sense—the Sense of Self—enters into the picture.</cite></p>
      <p>Are you saying that a message is received before the person thinks about it?<br>
      The dissonance is achieved by delay.</p>
