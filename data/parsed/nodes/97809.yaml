      <p>In other words, novelty can be persuasive.<br>
      This has long been a principle of marketing design.<br>
      Old designs wear out.<br>
      It’s hardwired into humanity, because repetitive stimuli disappear.<br>
      And adaptively, an inability to respond to a changing environment means extinction.<br>
      In sports, the same training regime will not produce optimum performance, you have to mix it up.</p>
