      <p><em>It is not that novelty is persuasive, but that familiarity allows this confirmation bias, and therefore novelty allows more play to the rational intelligence.</em></p>
      <p>Sorry, but that notion is preposterous. Perception—in the natural order of reception, perception, conception—occurs at the pre-rational level; in other words, information from the five senses is processed <em>before</em> the Sixth Sense—the Sense of Self—enters into the picture.</p>
      <p>And, once again:  is disfluency some form of deliberately-introduced cognitive dissonance and, if so, how is this dissonance achieved?</p>
