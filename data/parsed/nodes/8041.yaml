    html: <p>Most of the fonts bundled with MacOS, and many older versions of Adobe applications were licensed from other foundries. (Helevtica, for instance, which ships with MacOS, is licensed from Linotype; it is not owned by Apple). <br> <br>Adobe has its own type library, which has grown over the years. I believe that Thomas posted here some time ago that Adobe was no longer bundling non-Adobe fonts with their software. Was that for all applications, or just some? In any event, even Adobe fonts that come "free" with Adobe products are covered by the software's license. So, one cannot do whatever one wants with them (like freely distribute copies, etc). In this regard, bundled fonts are no different from fonts that you would license from a foundry on your own, except that some foundries have more restrictive EULAs, and some have less restrictive ones.</p>
