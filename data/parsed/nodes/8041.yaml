    html: <p>A quick answer. Fonts are installed with both OS�s and apps, and the exact fonts installed depend on the version of the OS or app you have installed and the install options selected. For example newer versions of Mac OS contain more fonts than earlier versions, and some fonts are not installed by Windows unless you select �East Asian� or �Complex Script� support.   <br> <br>As most PC�s come with a bunch of software pre-installed it�s difficult to tell where fonts came from. If the fonts came with Microsoft apps this information may help you work out which app or OS installed them - <a href="http://www.microsoft.com/typography/fonts/default.aspx" target="_blank">http://www.microsoft.com/typography/fonts/default.aspx</a>  <br> <br>With respect to licensing, fonts are generally covered by the license of the app or OS that installed them. With respect to TNR and Arial, packaged installers containing these fonts were posted online with a license that allows redistribution (of the package not the loose fonts).   <br> <br>Cheers, Si</p>
    html_clean: <p>A quick answer. Fonts are installed with both OS�s and apps, and the exact fonts installed depend on the version of the OS or app you have installed and the install options selected. For example newer versions of Mac OS contain more fonts than earlier versions, and some fonts are not installed by Windows unless you select �East Asian� or �Complex Script� support.   <br> <br>As most PC�s come with a bunch of software pre-installed it�s difficult to tell where fonts came from. If the fonts came with Microsoft apps this information may help you work out which app or OS installed them - <a href="http://www.microsoft.com/typography/fonts/default.aspx" target="_blank" class="link-external">http://www.microsoft.com/typography/fonts/default.aspx</a>  <br> <br>With respect to licensing, fonts are generally covered by the license of the app or OS that installed them. With respect to TNR and Arial, packaged installers containing these fonts were posted online with a license that allows redistribution (of the package not the loose fonts).   <br> <br>Cheers, Si</p>
