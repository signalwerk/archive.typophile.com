  html: <p>I recently posted a request for a font to be identified on the Type Identification Board and received a rapid reply.  I was reviewing a document and saw a font used that I liked.  While trying to track down that font (Bank Gothic), I realized that in order for a sheet to print with that font used, it would have to have been installed on that machine (at least I think so).  How does one know if the font they are using is being done so legally?   <br> <br>All Microsoft Windows machines are provided with a certain preloaded package of fonts which I would assume implies that they (the fonts) can be used for any purpose.  Is there a standard set of fonts that is "free" or available for unlimited public use?  For instance, Arial and Times New Roman would appear to be universally approved for unlimited use.  Is there, for lack of a better description, a regulatory body that controls this?   <br> <br>I searched through the directory structure of several computers at work and compared the font lists in each and they are all different.  The majority of fonts were common, but each had files available exclusive to that particular machine.  How does Microsoft or Apple/Macintosh decide which fonts are loaded when a machine is built?  Do they pay royalties to someone?  Does someone own the rights to fonts as common as Times New Roman or Arial?   <br> <br>I appreciate any time anyone could give me in answering these questions.  Typography was something I took for granted until recently but it is fascinating.  I have found several font sites and will sit and surf and critique (to myself) fonts now.  It really is amazing the diversity that exists. <br>  <br>Thanks again! <br>   <br>PS  Does anyone (or everyone) know who is credited (if there is someone) with creating the "Jackdaws loves my big sphinx of quartz" tagline for display of all letters of the alphabet?</p>
