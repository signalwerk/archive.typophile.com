    <p>I've completely ran out of ideas. I've read everything I could possibly find including Karsten's naming PDF, Adam Twardoch's Font Family Naming in FontLab Studio 5 [UPDATED in August 2012]. I've even tried CA Font Family Naming script [B] V0.990 and another script by RachelL. I have Fontlab version 5.0.4. Exporting in PS OT. </p>
    <p>Fontlab settings:<br>
    -Use OT names as menu names on Mac (DISABLED)<br>
    -Write stored custom OT tables (DISABLED)<br>
    -Export only OT name records - ignore default (ENABLED)<br>
    -Use PS fontname as fullname on Windows (DISABLED)</p>
    <p>I can't get my font to work in Word 2008 for Mac (v.12.1.0), some of the weights are not showing up at all. I've tried many things to get it to work but also what I tried was to copy the naming straight from Gotham. That because Gotham works perfectly as a one font menu item in all programs. Well, it didn't work even after I copied the additional Opentype menu names as they are.</p>
    <p>Only different thing in my font is the name which is in two words and 23 chars long, excluding style names. Can't change that unfortunately. But that shouldn't keep the weight showing up at all, or should it? My weights are Hairline, Thin, Light, Regular, Semibold, Bold, Black+Italics.</p>
