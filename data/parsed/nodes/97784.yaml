      <blockquote><p>As I don't have a clue what I'm doing in there, applying these changes to my font didn't produce good results.</p></blockquote>
      <p>When trying to figure out the naming conventions for a large family of fonts I find it very useful to map everything in a spreadsheet application. This also makes it easier to track changes.</p>
      <blockquote><p>I'm also wondering if those weight abbreviations are really necessary? I mean there are many commercial fonts that don't have those and are working nicely.</p></blockquote>
      <p>One of the great things about type design is the number of tools available to facilitate it but this often means that very different approaches are taken to reach the same end and with wildly varying results. Some foundries and developers employ custom tools to engineer their fonts which can provide greater control over tasks such as font naming. There is also generally a house style to how fonts are generated.</p>
    html_clean: |-
