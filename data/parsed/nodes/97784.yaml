    html: |-
      <blockquote><p>To whichever direction Fontlab decides to develop the naming system, I hope they understand to include Import/Export functions to some readable format like XML, concerning all Font Info.</p></blockquote>
      <p>They will always need to work with the restrictions of the font format. I am not sure what the restrictions are for OpenType but based on a <a href="/wiki/Numbers%20in%20name%20ok%3F" class="freelinking" rel="nofollow">discussion here recently about using numerals in font names</a> (thought to be problematic in the past) it would seem that the best way to be sure is to generate fonts exactly as you want them and then test where they do and do not work. Another <a href="/wiki/pitfalls%20of%20using%20style%20names%20other%20than%20italic%20and%20roman" class="freelinking" rel="nofollow">discussion around the use of unconventional names for weights and styles</a> raises similar issues.</p>
