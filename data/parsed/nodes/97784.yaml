    html: |-
      <p>Yes, thank you so much for the effort! Sorry about your fingers. Works great in my Office 2008 too! I guess Adam Twardoch's advice to delete the Mac ID's 16 &amp; 17 doesn't matter here.</p>
      <p>For everything to work properly, I found it true that names must be under 29 characters. That's way too tight limit in my opinion. Reminds me of that "64k should be enough for everyone" mess. You'd think the new software wouldn't rely on the old ID names anymore, concentrating to the OT fields instead.</p>
      <p>To whichever direction Fontlab decides to develop the naming system, I hope they understand to include Import/Export functions to some readable format like XML, concerning all Font Info. Preferably so, that it can be applied to all open fonts. Nothing can beat the flexibility of that.</p>
    html_clean: |-
