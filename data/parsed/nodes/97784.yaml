    html: |-
      <p>Your PS FontName and Full Name are functionally defective (though at least no longer illegally long for the PS FontName).</p>
      <p>The reason for putting "Black" in a family name and "Regular" as the style is purely a Windows and style linking issue. The construction "Black Regular" should never appear in any single typographic name field; it's confusing and meaningless.</p>
      <p>Is there some reason not to read and follow Adam Twardoch's guide to font name construction in FontLab Studio?  <a href="http://forum.fontlab.com/index.php?topic=313.0" title="http://forum.fontlab.com/index.php?topic=313.0">http://forum.fontlab.com/index.php?topic=313.0</a></p>
      <p>Regards,</p>
      <p>T</p>
