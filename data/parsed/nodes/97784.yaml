  - id: 529537
    user: 48268
    date: 2012-11-08T00:19:00
    date_raw: 8 Nov 2012 — 12:19am
    votes: null
    html: |-
      <blockquote><p>For everything to work properly, I found it true that names must be under 29 characters.</p></blockquote>
      <p>I think this is related to backwards compatibility, specifically metadata and file naming restrictions associated with older versions of Windows and some Microsoft apps; probably the Mac OS and apps too but I am less familiar with those restrictions. I recently created tailored versions of some fonts to work with Windows XP and Office 2003 and was happy just to get things working at all but I did find working within those restrictions was very informative and it is good to be mindful of if marketing fonts to a wide range of customers, particularly as XP and older versions of MS apps are still very widely used.</p>
    html_clean: |-
