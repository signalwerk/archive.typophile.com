      <p>I have just tried using Gotham in Word 2011 and the font list is incomplete in the menu. All weights/styles are available but some can only be accessed through the Italic option, the Thin weight for example. However, if everything but the Thin weight (and Italic style) are removed then both Thin and Thin Italic will show up in the menu. This would indicate that Word handles large families and collections of weights/styles in a very specific way.</p>
      <blockquote><p>It's not just H&amp;FJ fonts that has this naming structure I'm after; Neutraface, CamingoDos Pro, Pluto Condensed, KLIM Calibre.</p></blockquote>
