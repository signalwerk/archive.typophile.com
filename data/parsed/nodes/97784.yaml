      <blockquote><p>do you mean there are some nameIDs or other name properties that aren't available in FL?</p></blockquote>
      <p>No, just that there are tools which are configured to handle the naming metadata differently. I am pretty sure that FontLab can handle all of the available metadata but there may be easier ways to control it. <a class="freelinking external" href="http://forum.fontlab.com/index.php?topic=313.0" rel="nofollow">Adam Twardoch's font naming document</a> has hinted at a revised approach to the way that FontLab products handle naming conventions:</p>
      <dl><cite>This guide uses some new terminology that we will be introducing in our future products.</cite></dl>
      <p>However, with the advent of an entirely new tool it is possible that this will never be implemented in the FontLab Studio application.</p>
