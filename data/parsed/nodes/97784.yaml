      <p>Topy, below is an overview of the approach I took to this and which has so far worked in Word 2011 and InDesign (though appearing slightly differently in each one). After changing each section be sure to press the <em>Apply</em> box before moving on.</p>
      <p>I also updated the Version and Identification/Identification settings/<em>TrueType Unique ID record:</em> field after completing the sections below for each weight/style as this is reflected in NID 3 in the Additional OpenType names record section and keeps things tidy.</p>
      <p>Once this has been done for each weight/style I would then go to the Additional OpenType names record and select the <em>Import Names</em> (FI with dotted arrow) to update the information you have just amended before pressing the <em>Apply</em> button and saving the data and exporting. If it is not added when you update I would also add field 18 (Compatible Full (Macintosh only), copying the data from Mac Name field in each font, once again pressing <em>Apply</em> before saving.</p>
      <p>I used this method with a set of fonts matching your number of weights and styles and it worked so hopefully this will solve your issue. Others may have a less cumbersome or scripted solution.</p>
