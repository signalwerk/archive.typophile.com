      <p>Karl, I followed your advice and now all weights show up in Office. Regular weights show up in the list and Obliques can be used trough the Italic setting. I really appreciate for all your help and I'm happy that it works at all, but I must say, that the solution isn't as elegant as I'd hoped it to be. I'm still dreaming of a single family list item and all the weights in there. Looking into Gotham (a bit obsessed, sorry about that), I found out that messing with the OT name table list is where this can be done by entering only the OT family name into NID 1(Mac) and OT weight name into NID 2(Mac). There were also other differences to what FL's automatic import gives. As I don't have a clue what I'm doing in there, applying these changes to my font didn't produce good results.</p>
      <p>I'm also wondering if those weight abbreviations are really necessary? I mean there are many commercial fonts that don't have those and are working nicely.</p>
      <p>BTW, in FontExplorer's Style list, all weights are Regular/Italic/Bold/Bold Italic instead of showing the actual weight. It's only cosmetic, I guess?</p>
