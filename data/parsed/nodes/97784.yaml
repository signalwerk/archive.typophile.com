    html: |-
      <p>All the versions of Office I have used on both Windows and Mac operating systems seem to have unique approaches to font metadata and what they are happy to accept. With that in mind I always aim on the cautious side with everything from the naming conventions to metrics, font format and even file naming, though this last one has really only been an issue for me with Office 2003 on Windows XP.</p>
      <p>The other thing you will need to contend with is FontLab and how it exports fonts in different font formats. For example, I have noticed that different naming fields are exported depending on whether you choose to export to <em>OpenType PS</em> or <em>Win TrueType/OpenType TT</em>. This may well be something to do with the settings I have in place but I have never been able to figure out exactly what. With this in mind I always check exported fonts using TTX to be sure, and where needed make changes in the metadata using that tool.</p>
      <p>Your font naming is highly unconventional and as a result of the alphabetic string you may be encountering some of kind of application level bias. Some applications (Adobe CS apps for example) apply exceptions to certain strings, such as "Adobe" and "ITC" so that these are effectively ignored. I do not know if this is the case but it is worth considering. With that in mind and because of the length of the name I would recommend trying an alternative naming scheme where you significantly reduce the name to something like the second part of your string "Opqrstu". This will also guarantee that you get the weight names under 31 characters. To be safe, you should ensure that every naming field is under 31 characters (including spaces). In every case when you export you should check the metadata in each font file using TTX to be sure that it has exported what you expect.</p>
      <p>By way of example, I tested <a class="freelinking external" href="http://www.latofonts.com/" rel="nofollow">the open source font family, Lato</a> using Entourage 2008 and Word 2011 and it worked without any problems. That family is not as big as yours but it might be worth downloading and looking at the naming metadata to see if anything jumps out at you.</p>
    html_clean: |-
