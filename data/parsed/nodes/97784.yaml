    html: |-
      <p>I have also just noticed an inconsistency in your naming conventions. By way of example, with your Regular weight and Italic combination you have put the Family Name: "Abcdefghijklmn Opqrstu Regular" but then for the PS Font Name you have only put "AbcdefghijklmnOpqrstu-Regular" when based on your family name it should be "AbcdefghijklmnOpqrstuRegular-Regular". In fact, for the regular weight you can omit the "-Regular" from the PS Font Name field altogether but for such a large family there are advantages to leaving it in to make things as clear as possible. To illustrate my point more clearly, I have listed an example of before and after conventions that would correct the issue, using the naming change I suggested in my previous post. I hope this helps.</p>
      <p><strong>Before</strong></p>
      <dl><em>Regular</em>
      <dl>Family Name: Abcdefghijklmn Opqrstu Regular<br>
      Weight: Regular<br>
      Number: 400<br>
      [no boxes ticked]<br>
      Width: Normal<br>
      Style Name: Regular<br>
      PS Font Name: AbcdefghijklmnOpqrstu-Regular<br>
      Full Name: Abcdefghijklmn Opqrstu Regular<br>
      Menu Name: Abcdefghijklmn Opqrstu Regular<br>
      FOND Name: AbcdefghijklmnOpqrstu Regular</dl>
      <p><em>Regular Italic</em></p>
      <dl>Family Name: Abcdefghijklmn Opqrstu Regular<br>
      Weight: Regular<br>
      Number: 400<br>
      [Font is italic ticked]<br>
      Width: Normal<br>
      Style Name: Italic<br>
      PS Font Name: AbcdefghijklmnOpqrstu-RegularOblique<br>
      Full Name: Abcdefghijklmn Opqrstu Regular Oblique<br>
      Menu Name: Abcdefghijklmn Opqrstu Regular<br>
      FOND Name: AbcdefghijklmnOpqrstu Regular</dl>
      </dl>
      <p><strong>After</strong></p>
      <dl><em>Regular</em>
      <dl>Family Name: Opqrstu Reg<br>
      Weight: Regular<br>
      Number: 400<br>
      [no boxes ticked]<br>
      Width: Normal<br>
      Style Name: Regular<br>
      PS Font Name: OpqrstuReg-Regular<br>
      Full Name: OpqrstuReg-Regular<br>
      Menu Name: Opqrstu Reg<br>
      FOND Name: OpqrstuReg Regular</dl>
      <p><em>Regular Italic</em></p>
      <dl>Family Name: Opqrstu Reg<br>
      Weight: Regular<br>
      Number: 400<br>
      [Font is italic ticked]<br>
      Width: Normal<br>
      Style Name: Italic<br>
      PS Font Name: OpqrstuReg-RegularOblique<br>
      Full Name: OpqrstuReg-RegularOblique<br>
      Menu Name: Opqrstu Reg<br>
      FOND Name: OpqrstuReg Regular</dl>
      </dl>
      <p>Additionally, on the OpenType-specific names page I would add the following:</p>
      <dl>OT Family Name: Opqrstu<br>
      OT Style Name: Regular (adding a space and "Oblique" for that variant)</dl>
      <p>With this last bit of metadata in the OpenType-specific names page, the "OT Family Name" field would remain the same for all weights and styles.</p>
    html_clean: |-
