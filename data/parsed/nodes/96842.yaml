      <p>Another solution is to provide alternate features as a separate font.</p>
      <p>That’s something I will be doing in future, as I’ve often thought that so many typographers don’t ever bother diving down several levels of application menu to get to the features—and Stylistic Sets are most obscure of all.</p>
      <p>For instance, I have provided “schoolbook” variants (single-storey /a and /g) as Stylistic Set alternates in several fonts, but I never see them in use.</p>
