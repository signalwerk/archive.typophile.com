      <p>Nice!<br>
      It’s exciting to see creative use of OpenType features.</p>
      <p>However, I wonder if it is a good idea to use Ligature and Swash in such an inaccurate manner. The Contextual Alternates feature could have been employed instead of Ligature (and is also on by default).</p>
      <p>If we don’t respect the <a href="http://www.microsoft.com/typography/otspec/features_ae.htm" rel="nofollow">Microsoft OpenType Feature Tags</a>, there is a danger that typographers will become confused. If we do implement them strictly, there is more likelihood of developing a mutually supportive culture of clever new typefaces.</p>
