      <p>The principle of “not telling lies” with OpenType was drummed into me by Thomas Phinney and John Hudson, on this forum, several years ago.</p>
      <p>Don’t you think it’s misleading to use OpenType features to do things which aren’t what they say they are?</p>
      <p>The Ligature and Swash features, when applied in MeM, do not produce Ligatures or Swashes.</p>
      <p>What is the point of having Feature Tag deﬁnitions if font producers ignore them?</p>
      <p>I thought you were in favor of standards.</p>
      <p>I must admit, I do feel reticent about criticizing work in the Release forum, but hey, it’s software, and can be updated easily if the designer feels my criticism has merit. I am also open to any rationale Jakob might offer to convince me that I am wrong.</p>
      <p>This is an area of type design I’m eager to discuss, having published several designs with pseudo-random features, and written about it as well: <a href="http://ilovetypography.com/2011/04/01/engaging-contextuality/" title="http://ilovetypography.com/2011/04/01/engaging-contextuality/">http://ilovetypography.com/2011/04/01/engaging-contextuality/</a></p>
      <p>As you can see, I promoted myself in that article (people usually do, especially when they don’t get paid for writing), but I also talked up a lot of other designers, and will no doubt do the same for MeM in future because, as I said, it’s exciting to see creative uses of OpenType features.</p>
