      <p>hej nick, </p>
      <p>thanks for brining up statements for the original usage of OpenType features.</p>
      <p>your are right: the feature CALT is default as well — we decided to (mis)use the LIGA feature, which is supported by a slightly more version of Adobe CS, but its prevalence is neglectable to the CALT feature and Photoshop versions no one uses anymore. we could have spend more time on sticking to standards.</p>
      <p>Concerning to "Swash" and "Titling Alternates": we used this features as kind of workaround to make some features available in Photoshop as well (which does not provide "stylistic sets") — knowing that the <em>bolder</em> weights do not have northing in common with the common understanding of <em>swashes</em>.<br>
      We did made some good results with this workaround with <a class="freelinking external" href="http://www.26plus-zeichen.de/en/fonts/tj-evolette-a/" rel="nofollow">TJ Evolette A</a>, because the typeface is used by unusual much Photoshop users (may result to the typeface's <em>figurative</em> appearance)</p>
