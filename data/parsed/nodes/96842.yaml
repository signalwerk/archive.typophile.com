    html: |-
      <p>Nick, I gave a presentation to a group of (mostly) print designers recently about OpenType. Most were unfamiliar with the possibilities OpenType offers and of Stylistic Sets in particular. The clumsiness and non-visual nature of their implementation in Creative Suite products doesn't help matters.</p>
      <p>Not sure how I feel about separate fonts for alternate characters. I hated having to manage LF/OSF/Expert versions back in the day. But I suppose specifying a different font (via character/paragraph styles) to get at a particular alternate wouldn't be any more difficult than using Stylistic Sets for the same purpose.</p>
