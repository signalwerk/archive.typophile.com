    html: |-
      <p>I don't think those are TRUE small caps; I'll bet they are capital letters set at a smaller type size. </p>
      <p>I say this because the thickness of the line changes dramatically between the caps and "small caps" -- something you wouldn't be likely to see in TRUE small caps.</p>
