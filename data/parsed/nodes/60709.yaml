    html: |-
      <p>Angela,</p>
      <p>I feel your pain but now is a perfect time for a little client education. With a detail view of one of the letters pulled from the PDF (I’d us the R) explain to them after extensive research their logotype appears to be handdrawn, thus making it impossible to create variations for their additional companies.</p>
      <p>In addition, I’d put their current logo on a sheet and recreate it with ’Futura Bold Oblique’. Obviously, you’d fix the tracking and spacing issues and present the two side by side. Explain the benefits of using a professional designed typeface and the benefits of having it available for corporate branding and the other company logos.</p>
      <p>As a polite gesture tell them you’d be happy to use their current typeface if they can provide the name. ;)</p>
      <p>Here’s a closeup of how bad the “R” really is.</p>
      <p></p><div class="imageWrap"><img src="/files/Central_Glass_R_5203.png"></div><p></p>
