    html: |-
      <p>The logo in the PDF is converted to outlines. If you need the font to recreate the logo just open the last page of the PDF in Illustrator and grab it. Exact match. </p>
      <p>If I had to guess it’s a cheap knockout or someone hand traced a precious version. The angles and character widths are all over the place and the tracking – spacing between words is scary bad.</p>
