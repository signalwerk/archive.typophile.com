      <p>To me the "Fi" is OK, and it looks nice too. But the curves in "n" and "e" need a lot of work. And the spacing is uneven.</p>
      <p>First things first though: what kind of fashion brand? Who are the current -and desired- customers?</p>
      <p>hhp</p>
