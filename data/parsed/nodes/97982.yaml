    html: |-
      <p>Three things that I noticed:<br>
      – I am not sure about the legibility of the ‘Fi’ ligature. In any case I think the combination is too wide. Try to match the counter with that of ‘n’.<br>
      – The serifs seem short to me. And if this is the display version of the wordmark, I would expect a more spectacular thick/thin contrast.<br>
      – ‘e’ seems wobbly on the lower and upper left.</p>
