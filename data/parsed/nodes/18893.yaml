  html: |-
    <p>I'm not sure if it's my place to do this, but in lieu of anybody posting battle #10 (and here it is Wednesday morning,) might I propose the following challenge?</p>
    <p>Requirements:</p>
    <p>- Size: 600 width x 400 height. 72 dpi<br>
    - Color: Black and white only<br>
    - Format: Please save your graphics as PNG<br>
    - Only respond with the characters posted in the challenge.</p>
    <p>// THIS WEEK’S CHALLENGE:<br>
    Pick one character and design it for at least four widths and at least four weights.  This should give you at least 16 members of a family.  Post the results.</p>
