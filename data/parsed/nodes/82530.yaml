    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MaiolaBook-typofile_6369.gif"></div><br>
    We added a new Book style with its accompanying italic to our successful type family Maiola. It is darker in colour, making reading an even more pleasant experience. Additionally, responding to customer feedback, we have also designed a whole set of symbols used to set logic. Customers who have purchased the Maiola Bundle and would like to add the Book styles, are welcome to a special offer. Please contact us, if interested.<p></p>
    <p><a class="freelinking external" href="http://www.type-together.com/Maiola" rel="nofollow">More information on our website</a></p>
