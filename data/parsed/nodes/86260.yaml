  html: |-
    <p>I've been working as a designer for over 10 years, but I feel like I need a refresher on the basic principles of design. So I'm looking for a book. I do a lot of editorial, so I'm looking for a book that will explain and dissect good page layouts and explain why they work, using the principles of design (contrast, texture, balance, rhythm, etc…). I'm looking for real-world examples, not just shapes on a page like Wucius Wong's Principles of Form and Design (a good book nonetheless). I'm not really looking for a grid book, however i realize that grids and page layouts are inseparable. </p>
    <p>Anyone know of any books that covers this? Or even a website, or magazine article?</p>
    <p>Thanks!</p>
