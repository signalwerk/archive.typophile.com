      <p>I like <a class="freelinking external" href="http://www.bamagazine.com/" rel="nofollow">Before &amp; After</a> very much. You can check individual issues about page layout or consider the books they released. John McWade always works based on real-world examples and uses a fine technical approach.</p>
      <p>For a more theoretical stuff, there is Bringhurst's <em>The Elements of Typographic Style</em>. A classical, although I think it is very conservative when talking about page formats, white space and dimensions.</p>
