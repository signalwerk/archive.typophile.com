      <p>In my font it is that way:<br>
      feature kern {<br>
         script DFLT;<br>
           language dflt ;<br>
         script latn;<br>
           language dflt ;<br>
            lookup kernHorizontalKerninglookup1;</p>
      <p>} kern;</p>
