    <p>Hi,</p>
    <p>I have a problem with the kerning of ITC Bodoni 12. The fonts seem to be OK when I view them in fontexplorer, with kerning properly applied. However when I use them in Adobe CS2 the kerning does not work and the values are all zero. I viewed it in Fontlab, where there are kerning pairs defined using the kern feature. I compared with some other fonts and the only difference I could find in coding was the line mentioned below:</p>
    <p>feature kern { # Kerning<br>
     script     ;</p>
