    votes: null
    html: |-
      <p>If you use Find and Change you can use the formats menus to find all instances of a family and set them all the same size. </p>
      <p>Depending on how you set up and apply style sheets you can find that not all the instances will change –&nbsp;this seems to especially apply to tables – generally due to an errant character style.</p>
      <p>Tim</p>
