    html: |-
      <p>I wonder if it was Freda Sack... a Google search unearthed the following...</p>
      <p>"British designer Freda Sack was born in London in 1951 and gained a diploma in graphic design and typography from the Maidstone College of Art. Her first job, in 1972, was with Letraset International where she worked as a photographic retoucher, later moving into their type studio. Under the supervision of Bob Newman she learnt the skills of drawing type and stencil cutting, and began to design headline faces. She became involved in producing artwork for the Letraset instant lettering dry transfer sheets, and trained junior designers."</p>
      <p>and she has since designed Jenson Old Style bold condensed (with Colin Brignall, 1982)</p>
      <p>wodyareckon?</p>
  - id: 229573
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    date_raw: 25 Sep 2007 — 8:22am
    date: 2007-09-25T08:22:00
    votes: null
    html: <p>I don't think so. Jenson Old Style Bold Condensed <em>was</em> based on the ATF Jenson, whereas the mystery Jenson was not. Also, if she had done it for Letraset, why would they only offer two of the five weights? Finally, Letraset always gave credit in the designs they originated and included "© Letraset" with the credit, as they did with her Jenson Old Style Bold Condensed.</p>
