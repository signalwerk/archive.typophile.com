    date: 2007-09-25T01:34:00
    votes: null
    html: <p>It's ATF Jenson. I remember it from old Letraset catalogues. It is the ancestor of Italia, Colin Brignall redrew the ATF Jenson series for Letraset in 1977.</p>
  - id: 229527
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    date_raw: 25 Sep 2007 — 6:51am
    date: 2007-09-25T06:51:00
    votes: null
    html: <p>It was just called Jenson. There were five weights going from Light to Black and Letraset had only Medium and Extra Bold. It seems to have originated in the Seventies, but I don't know who designed it. The Letraset catalog is mum on the subject (usually they give credit). I'm pretty sure it's not related to ATF Jenson.</p>
  - id: 229537
    user_id: 7409
    user_name: bojev
    user_path: null
    date_raw: 25 Sep 2007 — 7:12am
    date: 2007-09-25T07:12:00
    votes: null
    html: <p>Mark is correct - Jenson in 1928 ATF Specimen Book looks nothing like the Letraset Jenson. My 1986 Letraset Catalog lists no designer and only medium and extra bold weights. Has it been digitized? - That is the question?</p>
  - id: 229560
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    date_raw: 25 Sep 2007 — 7:55am
    date: 2007-09-25T07:55:00
    votes: null
    html: <p>I wouldn't call it Letraset Jenson as it didn't originate with them (they only have two weights, remember?). It looks a bit like something Les Usherwood may have done, but if that were the case, I think Letraset would have given credit as they did with his other designs.</p>
  - id: 229564
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    date_raw: 25 Sep 2007 — 8:04am
    date: 2007-09-25T08:04:00
    votes: null
    html: <p>Headliners had a very similar (identical?) font called neo-Jenson which may be where it originated. It's difficult to tell with them whether a font is their original design or their version of an existing design since they added the "neo-" prefix onto both.</p>
