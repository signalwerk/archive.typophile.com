    <p>Was looking for a less 'florishy' version of Italia when I saw this...<br>
    Found in the Herb Lubalin 'Art Director....' book, so its most probably an ITC font?</p>
    <p>I do know it, but not at the moment!... think the lower case 'y' and 'e' are the key.</p>
    <p>I promise to stay behind after class and write out the answer hundred times.</p>
