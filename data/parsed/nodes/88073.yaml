    html: <p>I know it's a personal thing, but I'd check out the available ellipsis with a font firsthand - usually they've been designed as fit for purpose and to complement the typeface. An exception I can think of is if an ellipsis needed to be created for some really small type. Brighust's got a page on it if I recall.</p>
