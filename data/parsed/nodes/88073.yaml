    html: |-
      <p>Personally I never insert spaces between periods to make an ellipsis because this can lead to the ellipsis being broken over two lines if the type reflows later. Your application will view each period-space as the end of a sentence and will feel free to insert a line break.</p>
      <p>(One way around that problem, at least in InDesign, is to select the periods and spaces and apply the "no break" command.)</p>
      <p>But the method I prefer is to either use the ellipsis character or else use 3 periods (no spaces) and adjust the kerning, if necessary.</p>
