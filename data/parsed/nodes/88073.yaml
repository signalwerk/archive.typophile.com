  html: |-
    <p>I'm new here on typophile and look forward to joining the conversation.</p>
    <p>I have been writing blog posts about book design targeted at writers and publishers. The latest installment covered dashes and ellipses. I've had some pushback from typographers who prefer using three spaced periods to the built-in em-width ellipsis glyph.</p>
    <p>Of course, critique on the rest of the article is welcome; I know there are endless subtleties to adding sidebearing space to dashes that are probably beyond where most indie writers and publishers will ever go, but I'm mostly curious about how typographers here work with ellipses.</p>
    <p>Doesn't it make sense that type designers would build in (at very least) an alternate single glyph with wider spacing if that was a popular convention?</p>
    <p>If you do prefer the "three periods" approach, what is your rationale and your recipe for building them?</p>
    <p>See <a href="http://onehourselfpub.com/book-design-part-4" title="http://onehourselfpub.com/book-design-part-4">http://onehourselfpub.com/book-design-part-4</a></p>
    <p>Thanks,</p>
    <p>Dave Bricker</p>
