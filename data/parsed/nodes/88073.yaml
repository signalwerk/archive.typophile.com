    html: <p>I prefer the ellipsis character mainly because I'm not typing on a typewriter. That said, online, I usually always type it as three periods...maybe because it *is* like typing on a typewriter...and I suppose I can see an artistic license argument for the spaced version . . . perhaps a longer pause. (BTW, I think you could space that with non-breaking spaces...at least online, though I assume InDesign has the same option)</p>
