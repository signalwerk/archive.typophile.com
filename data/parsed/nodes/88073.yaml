      <p>I always use the ellipsis because it is one (composite) keystroke, not three.<br>
      That makes it quicker to set and easier to edit, avoiding the possibility of placing the cursor between periods.<br>
      And also because I am a typophile who prefers the “clever” way of doing things!</p>
