    html: <p>Hmmm. Hold everything, then. <br>Are you using a small point size? If so, are you using the correct optical master? Because if you're setting a small size with an optical master for larger sizes* that would explain InDesign's optical spacing using up a lot more room than the Metric setting, but that would also mean it's preferable. <br> <br>* Does the setting look cramped and anemic? <br> <br>hhp <br></p>
