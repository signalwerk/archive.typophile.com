    html: <p>You're applying ordinals globally, which you shouldn't be. Only format as ordinals the specific bits of text you want to have ordinals. (Same holds true for fractions, btw.) <br> <br>T</p>
    html_clean: <p>You're applying ordinals globally, which you shouldn't be. Only format as ordinals the specific bits of text you want to have ordinals. (Same holds true for fractions, btw.) <br> <br>T</p>
  - id: 42731
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Don't apply discretionary ligatures to ordinals... that's the problem with 1st. I'm not sure if Adobe could have built the fonts features in such a way as to avoid this, but it's easy to work around it. <br> <br>As to "Notification", I'm not sure how that's happening. Check what Opentype features you have active, and deselect them until it's ok.</p>
    html_clean: <p>Don't apply discretionary ligatures to ordinals... that's the problem with 1st. I'm not sure if Adobe could have built the fonts features in such a way as to avoid this, but it's easy to work around it. <br> <br>As to "Notification", I'm not sure how that's happening. Check what Opentype features you have active, and deselect them until it's ok.</p>
