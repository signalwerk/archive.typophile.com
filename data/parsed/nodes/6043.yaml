    html: <p>Thanks John and Thomas. <br> <br>Ordinals are definitely the problem. <br> <br>It's going to take a while finding all the ordinals to apply on a case by case basis with about 160pp. Any ideas on doing this? Is find and replace a good way to find the characters I'll need to change? <br> <br>Thomas - If I took off discretionary ligatures would it be possible to apply the ordinals globally? <br> <br>Thanks again everyone.</p>
