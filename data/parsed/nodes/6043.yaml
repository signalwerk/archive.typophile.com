    html: <p>Nope. You'd still have the problem with "Notification." That's the "numero" kicking in. <br> <br>By the way, the problem with the discretionary ligatures overriding the ordinals is a font bug, and could have been avoided by better feature construction. I filed the bug against the font, and hope to get it fixed in some future revision. Sorry about that. <br> <br>Regards, <br> <br>T</p>
