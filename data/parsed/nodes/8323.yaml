    html: "<p>It might help to know the general age of the logo. <br> <br>Two fonts I might mention: <br> <br>1) Tintoretto is an old typeface, the only digital version I'm aware of is that of <a href=\"https://web.archive.org/web/20141114221923/http://www.moorstation.org/typoasis/designers/steffmann/samples/t/tintoretto.htm\" target=\"_blank\"> Dieter Steffmann</a>. This font would yield the somewhat similar image below: <br> <br><img src=\"https://web.archive.org/web/20141114221923im_/http://www.typophile.com/forums/messages/83/56529.jpg\" alt=\"\"> <br> <br>2) Does anyone have the font Murillo (or a fuller representation), from the <a href=\"https://web.archive.org/web/20141114221923/http://www.amazon.com/exec/obidos/tg/detail/-/0486999548/qid=1103796749/sr=8-1/ref=sr_8_xs_ap_i1_xgl14/002-2615249-4096055?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\"> Dover (Dan Solo) 24 Art Nouveau Display Fonts CD</a>? The 'A' in the Solotype Catalog is similar, but that's the only character in common with KASCH shown. <br><br></p>"
    html_clean: "<p>It might help to know the general age of the logo. <br> <br>Two fonts I might mention: <br> <br>1) Tintoretto is an old typeface, the only digital version I'm aware of is that of <a href=\"https://web.archive.org/web/20141114221923/http://www.moorstation.org/typoasis/designers/steffmann/samples/t/tintoretto.htm\" target=\"_blank\" class=\"link-external\"> Dieter Steffmann</a>. This font would yield the somewhat similar image below: <br> <br><img src=\"https://web.archive.org/web/20141114221923im_/http://www.typophile.com/forums/messages/83/56529.jpg\" alt=\"\"> <br> <br>2) Does anyone have the font Murillo (or a fuller representation), from the <a href=\"https://web.archive.org/web/20141114221923/http://www.amazon.com/exec/obidos/tg/detail/-/0486999548/qid=1103796749/sr=8-1/ref=sr_8_xs_ap_i1_xgl14/002-2615249-4096055?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\" class=\"link-external\"> Dover (Dan Solo) 24 Art Nouveau Display Fonts CD</a>? The 'A' in the Solotype Catalog is similar, but that's the only character in common with KASCH shown. <br><br></p>"
