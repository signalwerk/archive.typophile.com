    html: |-
      <p><em>…fashion oriented, friendly looking/humanized…</em></p>
      <p>That’s an oxymoron.<br>
      Fashion is the opposite of humanized (at least, with regards to type).<br>
      The iconic fashion types, Bodoni and Futura, are the equivalent of neckties, corsets and high-heeled shoes.</p>
      <p>Your best bet may be Kabel, or something along the same lines.<br>
      In the Light weight (not available in the ITC version, strangely), the angular cut of its terminals introduces a complexity that takes some of the edge off the ruthlessness of Futura’s minimalism.</p>
      <p>My somewhat-humanized, Futurish style: <a href="http://new.myfonts.com/fonts/shinn/sense/" rel="nofollow">Sense</a>.</p>
