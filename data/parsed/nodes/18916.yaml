    <p>A pretty standard yet unusual sansserif font was used on Spielberg's movie about the aftermath of the 1972 Olympic games.<br>
    Anyone knows what it is? I am looking for the font actually used in the film's title's, not on the poster.<br>
    - I have tried attaching a small gif or jpg many times but it doesn't work. Anyone interested, please have a look at the trailers here, the font is shown at the end: <a href="http://www.moviemaze.de/media/trailer/2179/muenchen.html" title="http://www.moviemaze.de/media/trailer/2179/muenchen.html">http://www.moviemaze.de/media/trailer/2179/muenchen.html</a></p>
    <p>Thanks my dears.<br>
    Elton</p>
