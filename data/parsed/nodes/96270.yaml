    html: |-
      <blockquote><p>MS Office on the Mac doesn't use OpenType or AAT. Basically, the Mac version of Office provides no smart font layout support: it is a very poor cousin of the Windows version.</p></blockquote>
      <p>I do not know about Excel or PowerPoint but Word 2011 for Mac supports ligatures, stylistic sets, context alternative characters and number forms for OpenType; not amazing but a start. I have not tested these features extensively but have seen reports that they are either inconsistent across some fonts or do not port well to the Windows 2010 version.</p>
      <p>[edit] Sorry John, just realised that you were probably talking about additional support beyond these features.</p>
      <p>However Word 2011 does not accept what it deems to be fonts with problematic naming conventions. <a href="/wiki/Recommendations%20for%20dealing%20with%20font%20problems%20in%20Microsoft%20Word%202011%20for%20Mac" class="freelinking" rel="nofollow">Adam Twardoch has posted naming guidelines for FontLab</a> that help to address that particular issue. For example, I have encountered problems with the larger FontFont families (e.g., Meta), which use a naming structure that Office 2011 clearly does not play well with.</p>
