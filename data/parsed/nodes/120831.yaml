      <p>Custom, or heavily customized if it was based on a single typeface. Some typefaces that—with a little editing—could mimic the look:</p>
      <p>Seconda Soft Standard Bold:<br>
      <a href="http://www.fonts.com/font/durotype/seconda-soft/basic-pack" title="http://www.fonts.com/font/durotype/seconda-soft/basic-pack">http://www.fonts.com/font/durotype/seconda-soft/basic-pack</a></p>
      <p>Barmeno Bold:<br>
      <a href="http://www.fonts.com/font/berthold/barmeno/be-volume" title="http://www.fonts.com/font/berthold/barmeno/be-volume">http://www.fonts.com/font/berthold/barmeno/be-volume</a></p>
      <p>Contax Sans 85 Black:<br>
      <a href="http://www.myfonts.com/fonts/typeinnovations/contax-sans/" title="http://www.myfonts.com/fonts/typeinnovations/contax-sans/">http://www.myfonts.com/fonts/typeinnovations/contax-sans/</a></p>
      <p>Epoca Classic Bold:<br>
