    html: '<p>If you wanna beat the cliché, pick an <a href="/wiki/uncial" class="freelinking" rel="nofollow">uncial</a>: <a href="http://www.fontshop.com/search/?q=uncial" rel="nofollow">FontShop</a>, <a href="http://www.myfonts.com/browse/keyword/uncial/" rel="nofollow">MyFonts</a>. Typophile Dan has compiled <a href="http://www.typeoff.de/?p=183" rel="nofollow">a list of gems</a>, and he has designed <a href="http://www.typeoff.de/?p=24" rel="nofollow">a nice one himself</a>, too.</p>'
    html_clean: '<p>If you wanna beat the cliché, pick an <a href="/wiki/uncial" class="freelinking" rel="nofollow">uncial</a>: <a href="http://www.fontshop.com/search/?q=uncial" rel="nofollow">FontShop</a>, <a href="http://www.myfonts.com/browse/keyword/uncial/" rel="nofollow">MyFonts</a>. Typophile Dan has compiled <a href="http://www.typeoff.de/?p=183" rel="nofollow">a list of gems</a>, and he has designed <a href="http://www.typeoff.de/?p=24" rel="nofollow">a nice one himself</a>, too.</p>'
