    html: |-
      <p>I searched on <a class="freelinking external" href="http://www.myfonts.com/search?search%5Btext%5D=kells" rel="nofollow">kells</a> at myfonts.com and got some possibilities, although "irish uncial" would probably give you much the same results.</p>
      <p>Later edit:</p>
      <p><a class="freelinking external" href="http://www.diningpubs.com" rel="nofollow">Dining Pubs</a> and <a class="freelinking external" href="http://www.irishmusicbars.com" rel="nofollow">Irish Music Bars</a> have extensive lists of Irish pubs, along with photographs; although the photos are somewhat small, you can often see the signs pretty well.</p>
