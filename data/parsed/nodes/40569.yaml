    html: <p>I haven't made it it Ire, yet, but there seems to be a lot of great <a href="http://www.flickr.com/photos/pauldhunt/sets/72157602552287340/" rel="nofollow">hand-lettered pub signs</a> all around England. In this vein, I'd check out stuff from LHF <a href="http://www.letterheadfonts.com/fonts/stratford.shtml" rel="nofollow">Stratford</a> might be one to look at.</p>
