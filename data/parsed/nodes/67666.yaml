  html: |-
    <p>In researching package design for a school project, I stumbled on this particularly insightful page. The rest of the website has alot to offer as well, but here it is:</p>
    <p><a href="http://www.thedieline.com/blog/features-top-packaging-advice/" title="http://www.thedieline.com/blog/features-top-packaging-advice/">http://www.thedieline.com/blog/features-top-packaging-advice/</a></p>
    <p>I decided to post this here after reading:</p>
    <p><code>Other characteristics that failed identities share:</code></p>
    <p>Global logos that do not consider global interpretations<br>
    Logos that need an “explanation”<br>
    Overly “trendy” logos<br>
    Logos that require complicated production techniques<br>
    Logos that require in-depth training in which to educate users<br>
    Logos with multiple taglines or messages that are not always in sync</p>
    <p>and thinking of how those are some very good guidelines for logos..</p>
    <p>anyway, back to the all-nighter project.</p>
    <p>enjoy</p>
