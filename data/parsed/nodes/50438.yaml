    html: |-
      <p>"First time I’ve heard the Chinese Cultural Revolution called a “design movement”.<br>
      Me too, the only expression of the CR that I'm aware of out of direct control of government design, was the humiliation graffiti, This goes back much further than the CR. This was only a small part of the 'movement's design'. I think it's a good assignment, but unless the choice of tactics is modified, I'm of the opinion that the assignment will be impossible to achieve without looking tacky and amateurish. Modified for example, somehow to make the point that this was the largest ratio of populous-in-change, to design-in-stasis, in the history of mankind. Steven Heller did a presentation on totalitarian design, basically Stalin, Hitler and Mao,  at TypoBerlin this year, knows much more about it than me, and I believe his book on the topic is out, or will be.</p>
      <p>Other huge popular movement choices might be to gather images of really sexy Indian temple carvings and show how there are word forms in that movement somewhere, the web, or point out the down-to-today stylistic longevity of ancient Egypt. Acid Rock, Circus Posters, or go Celtic(s). Depending on who is instructing, your interests... hope it helps.</p>
      <p>Cheers.</p>
