    <p>Hey everyone. I have a design assignment for school that involves creating a poster in the style of some sort of design movement. I chose the Cultural Revolution, but the thing is, all the type on the original posters is in Chinese! Not knowing Chinese, does anyone have any suggestions on either typeface that mimics Chinese characters, or probably more likely, some type faces that have that communist blocky feel. Maybe like the blocky looking soviet union type, sort of like a more ridged Din. Though, at the same time, i don't want it to end up being too Russian/Soviet looking. Haha, sorry being so vague.</p>
    <p>Thanks everyone! I really appreciate it.</p>
    <p>-josh</p>
