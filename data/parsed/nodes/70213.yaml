    date: 2010-05-12T18:16:00
    date_raw: 12 May 2010 — 6:16pm
    votes: null
    html: |-
      <p>Coming from a broadcast view, it's 18 pt (px) <em>minimum</em> for standard-definition, double (36) for high-def as it is twice the resolution at the same screen-size - which it why it's high-def.... 18 is legible in HD, but best to avoid in case of down-sampling to SD (becomes 9pt, much too small). You might want to take all of this into consideration with your for-film designs.</p>
      <p>Here's a similar topic:</p>
      <p><a href="http://typophile.com/node/62444" title="http://typophile.com/node/62444">http://typophile.com/node/62444</a></p>
