      <p>It should be possible to do "angle of vision" comparisons between (hand-held) print, home-viewed TV (both "standard" and HD), and cinema theatre. In each case one would calculate based on screen/page size, viewing distance, and definition.</p>
      <p>From my own experience with HDTV, looking at the micetype disclaimer text in ads, It looks like you can now get as many lines of sharp and readable type on a TV screen as you can a magazine page.</p>
