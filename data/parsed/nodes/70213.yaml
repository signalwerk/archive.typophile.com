    <p>I wonder if one of you typophiles is an expert in typography for the big screen.<br>
    I'm working on a title design and some rolling credits for a short movie.</p>
    <p>The font I'm using is NITTI TYPEWRITER in size 35px. But I heard some concerns that the font still might be too small when shown on a cinema screen. The film will be shown on the big movie screen as well as on television.</p>
    <p>Does anyone know, what the minimum font size for screening text in a movie theater should be?</p>
    <p>Is there a common rule of thumb how a font size "changes" between a TV screen or a big screen?</p>
  html_clean: |-
