    html: |-
      <p>It is not Helvetica because the lowercase 'a' right side goes straight down and does not have an extenstion like Helv. Also the figure 'one' in Helvetica doesn't have a straight top extenstion but a curved one. The parens are spot on Univers as is the lowercase 'g', comma, and numerals. </p>
      <p><a href="http://www.youtube.com/watch?v=QSvuP8dnz84&amp;feature=related">http://www.youtube.com/watch?v=QSvuP8dnz84&amp;feature=related</a></p>
