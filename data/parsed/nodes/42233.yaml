      <p>Hmmm... It was a while ago I watched the documentary, which was called, 'Factory- From Joy Division to Happy Mondays' on BBC. I definitely remember him saying about the reluctance to include type on the outer sleeve, but I can't be sure about the 9pt Helvetica comment, I may have just imagined this, or its a mis-informed comment I've heard somewhere?</p>
      <p>Until now, I've always just presumed it was Helvetica, but never really studied it up close... so I was wrong to say it definitely IS without checking - sorry.</p>
      <p>After more investigation, I now agree with Lex &amp; Miss Tiffany - It's got to be Univers.</p>
      <p>As I was checking my recently purchased 12" Remastered Vinyl (2007) it has thrown up an interesting point. The UNKNOWN PLEASURES title appears to be set in DIN or Akzidenz? </p>
      <p><img src="/sites/default/files/old-images/UP_4290.jpg"></p>
      <p>If you check out the next image, a sticker from the back, it claims to have 'original artwork' - I don't think so!</p>
      <p>The sticker also reveals that the artwork was 're-editioned' by 'Something Else'... I think they have some explaining to do... I'm feeling a little cheated here!<img src="/sites/default/files/old-images/Sticker_3482.jpg"></p>
    html_clean: |-
