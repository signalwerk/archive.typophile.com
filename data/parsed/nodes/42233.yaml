      <p><img src="/sites/default/files/old-images/backcover_5317.jpg"></p>
      <p>This is the 1980 FACTUS1 original back cover. </p>
      <p>on your recent one it probably only refers to the image as being a reproduction since most people don't call type 'artwork' so they probably 'remastered' the typography.</p>
      <p>Again the figure 1, lc 'a' and 'y' and 'parens' are all Univers.</p>
      <p>On your newly purchased 'remastered' one I like th (P) registered product symbol, you don't see that in fonts very much.</p>
      <p>Also I doubt the US version was the same as the UK version since very few LPs or CD are the same since they are usually produced locally. I have many US and UK CDs that are the same and My wife who's a Manc has UK version of the ones I have as US. Her UK Suede Cds aren't the same as my US 'London' Suede (??? they are Mancs!) and the songs are different.</p>
      <p>And to be honest I'm surprised I have the US version of Unknown Pleasures since most of the LPs I have from back then were 'Imported' since the first versions were never producted in the US until much later.</p>
