    html: <p>Try opening up an Opentype Unicode font like Arial in FontLab. You'll see that each language has its own glyph range, and you could use Arial as a template. With Unicode and Opentype fonts, there's no need to overlap letters from different scripts. <br> <br>Paul</p>
