  html: "<p>Hi, <br> <br>I just bought FontLab 4.6, and I'd like to know more info about Non-Latin design.  <br> <br>What software do I need to buy? e.g:  with English there's no problem. But with Arabic, Hebrew there's a problem. <br> <br>How do I know where to draw each letter? (\"A\" - Arabic = \"A\" English cell; \"A\" - Hebrew = \"A\" English) <br> <br> <br>Thank You </p>"
