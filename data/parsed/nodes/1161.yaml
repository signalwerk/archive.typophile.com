  - id: 9212
    user: 1262
    date: 2003-09-05T16:31:00
    date_raw: 5 Sep 2003 — 4:31pm
    votes: null
    html: "<p>Ah, I worked out a way around that limitation. The problem is that VOLT cannot *display* CFF (PS)outline data, because it uses its own internal rasteriser, and this only handles TrueType. However, you can open a CFF outline font in VOLT, you just can't do anything that requires displaying glyphs. So what you do is: <br> <br>1. Make a dummy TrueType font based on your CFF FontLab source (note that if you are using GPOS features, you must ensure that the UPM value of the dummy font to matches that of the eventual CFF font). <br> <br>2. Open the dummy font in VOLT and build your OT Layout table data. Export this data as a VOLT project file. Save the dummy font in case you need to edit the OTL stuff later. <br> <br>3. Make your CFF OpenType font, being sure to keep exactly the same glyph order as in the dummy TT font. <br> <br>4. Open the CFF font in VOLT, <i>but do not open any VOLT windows except the main one.</i> Import the VOLT project exported from your dummy font. Compile and 'ship' the font from VOLT. <br> <br>Hey presto! One CFF OT font with VOLTR-generated OTL tables. For a while I thought this would be more complicated than it is, and had Adam Twardoch write a Python script to copy tables between TT and CFF fonts, but recently I realised just how easy it is, in fact, just using VOLT.</p>"
    html_clean: "<p>Ah, I worked out a way around that limitation. The problem is that VOLT cannot *display* CFF (PS)outline data, because it uses its own internal rasteriser, and this only handles TrueType. However, you can open a CFF outline font in VOLT, you just can't do anything that requires displaying glyphs. So what you do is: <br> <br>1. Make a dummy TrueType font based on your CFF FontLab source (note that if you are using GPOS features, you must ensure that the UPM value of the dummy font to matches that of the eventual CFF font). <br> <br>2. Open the dummy font in VOLT and build your OT Layout table data. Export this data as a VOLT project file. Save the dummy font in case you need to edit the OTL stuff later. <br> <br>3. Make your CFF OpenType font, being sure to keep exactly the same glyph order as in the dummy TT font. <br> <br>4. Open the CFF font in VOLT, <i>but do not open any VOLT windows except the main one.</i> Import the VOLT project exported from your dummy font. Compile and 'ship' the font from VOLT. <br> <br>Hey presto! One CFF OT font with VOLTR-generated OTL tables. For a while I thought this would be more complicated than it is, and had Adam Twardoch write a Python script to copy tables between TT and CFF fonts, but recently I realised just how easy it is, in fact, just using VOLT.</p>"
  - id: 9213
    user: 1262
    date: 2003-09-05T16:35:00
    date_raw: 5 Sep 2003 — 4:35pm
    votes: null
    html: "<p>One other note: there is a kind of attachment GPOS lookup type that uses TT outline points as anchors (the advantage of this being that you can delta hint the position of the attachment points, which is more efficient than using device dependent adjustments in VOLT). This kind of lookup type is not supported in VOLT yet, but probably will be eventually. Obviously this lookup type only works with TT fonts, so you would avoid using it in VOLT data if you wanted to be able to output a CFF font.</p>"
