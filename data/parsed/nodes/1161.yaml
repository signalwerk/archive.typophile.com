    html: <p>I'm no "non-latin guru" (although they do populate this board), but there seem to be a lot of folks using Davkawriter (for Hebrew) and Adobe InDesign ME (Middle Eastern version) for setting right-to-left scripts. Some of the discussion on <a href="http://www.typophile.com/forums/messages/29/13499.html?1061608620" target="_blank"> this thread</a> might be of interest. You might also check out the <a href="http://www.unicode.org/charts/" target="_blank"> Unicode charts</a> online.</p>
