    html: "<p>You can design and build non-Latin typefaces in FontLab. You can define your own glyph sets using .enc files (a plain text glyph list, stored in the FontLab/Encoding folder, that determines the cells you see in the FL Font Window when in Names mode -- see the FL manual more more information). I typically build a spreadsheet for complex script fonts, in which I keep track of glyph name, correct Unicode encoding (note that not all glyphs will be encoded, only base 'default' forms for each character), and any other information about individual glyphs (including design notes, mapping for OpenType feature lookups, etc.), and make a .enc file from the list of glyph names in this spreadsheet. <br> <br>The only thing you can't do in FontLab is build OpenType Layout table data that includes anchor positioning, one-to-many substitutions and other lookup types not supported by the Adobe FDK code on which FontLab's OT support is based. So for making complex script fonts for Arabic, Hebrew, etc. you need to use <a href=\"http://www.microsoft.com/typography/developers/volt/default.htm\">MS VOLT</a> (Windows only, but runs under emulators on a Mac, I understand). <br> <br>I design my fonts and define all font properties etc. in FontLab, and then build my OT table data in VOLT. The VOLT user community site includes downloadable examples of Arabic and Devanagari fonts, and a sample Hebrew font will probably be available in the next few months. <br> <br>If you want a better understanding of the relationship of characters and glyphs in OpenType, and how complex scripts are processed by applications, see this article: <a href=\"http://www.microsoft.com/typography/developers/opentype/default.htm\">Windows Glyph Processing</a>.</p>"
