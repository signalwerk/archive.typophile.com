  html: |-
    <p>I have a bunch of alternative glyphs named incorrectly. For example, there is a "four_onum.alt". </p>
    <p>-Is the correct way to name this four.onum.alt or maybe four.onum_alt would be better? From what I understand, four.onum1 is preferred, but it is not that descriptive as I would like.<br>
    -How big of a problem this kind of naming is and where the problems/compatibility issues would be likely to occur?</p>
    <p>I'm also intersted to hear about possible ways to fix it. I found <a href="http://www.typophile.com/node/80760">www.typophile.com/node/80760</a> where a "Rename Glyphs by Regex" script by Adam Twardoch was mentioned. This sounds like a tool for the job if it renames glyphs also in the opentype code and classes? However, I didn't find the actual script from Google. Is it publicly available, or should I just turn to Adam directly?</p>
