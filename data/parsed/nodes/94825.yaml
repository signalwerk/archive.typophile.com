      <p>I'm not familiar with the script Adam mentioned. Unfortunately I know of no easy way to rename all your glyphs all at once within FontLab. It's easy enough to change the final suffix en masse, but anything involving either the base or a non-final suffix must be done manually or via a python script.</p>
      <p>André</p>
