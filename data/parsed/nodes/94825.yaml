    html: |-
      <p>Any of four.onum.alt, four.onum_alt, or four.onum1 should be fine. There's no reason why the latter should be preferred AFAIK.</p>
      <p>four_onum.alt, however is definitely not a good idea. The problem will arise in situations where a file is converted to postscript in the middle of a workflow (e.g. when using Acrobat Distiller) in which case unicode values will be lost and those values must be reconstructed from the glyph names.</p>
      <p>In such cases, the unicode value is determined from the base name ignoring all dot suffixes. The base name must be either a legitimate postscript name (either a name from the Adobe Glyph List or a name of the form uniXXXX) or a ligature composed of legitimate names separated by underscores.</p>
      <p>four_onum.alt would thus be interpreted as a ligature of four and (the non-legitimately named and likely nonexistent glyph) onum.</p>
      <p>André</p>
