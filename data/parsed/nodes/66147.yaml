  html: |-
    <p>I'm getting a type themed tattoo done this year, but I'm still having problems finding the right font. The idea is basically to get latin phrases tattooed around both of my calves in capital letters. It would be easy just to pick one of my current favourite serif fonts, but since this one is for life I'd like to get something a bit more lasting.<br>
    I think I'm looking for something very classical and timeless, along the lines of Roman capitals. The problem is that when scaled small enough to be wrapped around my leg, most fonts simply arent tall enough to look good. I did a quick test using Trajan pro, but unfortunately the letters are a bit too wide for my skinny legs.<br>
    So... A good-looking, <strong>very</strong> classic font with "tall" caps and a timeless feel to it. Any ideas?</p>
    <p>If you know a great font that might look good but doesn't match the keywords mentioned above, feel free to name it as well.</p>
    <p>Thanks in advance!</p>
