    html: |-
      <p>If the text is long and your legs are skinny you're going to have a problem with any font; if you push too far it's going to be illegible and/or ugly. Have you considered doing a spiral so you can go around the leg(s) more than once without needing a left margin?</p>
      <p>In any case, what about Rialto? It's classical but organic, and it has a special caption weight with reduced contrast. Note: not the Linotype font by that name - this one: <a href="http://typophile.com/node/66155" title="http://typophile.com/node/66155">http://typophile.com/node/66155</a></p>
      <p>BTW, thin lines <em>can</em> work out:<br>
      <a href="http://www.flickr.com/photos/zara/480177291/" title="http://www.flickr.com/photos/zara/480177291/">http://www.flickr.com/photos/zara/480177291/</a></p>
      <p>hhp</p>
