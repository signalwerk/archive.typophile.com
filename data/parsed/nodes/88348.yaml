      <p>I sleep through most threads...</p>
      <p>What have you decided to go with? afii or uni?</p>
      <p>I am using afii in my latest font but that's because there's a whole lot of OpenType re-encoding implications to changing a batch of glyph names and there are already <a href="http://postdesk.com/christmas2011/erik-spiekermann/" rel="nofollow">not enough hours in the day</a>.</p>
