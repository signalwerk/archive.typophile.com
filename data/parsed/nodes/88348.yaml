      <p>Nick,  To sleep, a chance to dream :-)<br>
      I think I am going with the Opentype names.</p>
      <p>If  you have coding to fix, either search and replace the painful one glyph at a time way and check the box "update name in Opentype features"  Or just save your .fea file and search and replace afii names with uni names.  Then, reimport the updated. fea file.</p>
