    <p>I currently have my Cyrillic glyphs named with the "afii postscript" naming.  I have noticed online that using the unicode name [unixxxx] may be the way to go now. What is the best practice to follow and what has changed recently?</p>
    <p>THANKS!</p>
    <p>ChrisL</p>
