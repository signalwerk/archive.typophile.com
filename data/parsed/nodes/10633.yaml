    html: <p>This is a random question, possibly for the greek speakers out there (hence this thread), I'm doing a logo for a motorboat racing team and the name of the team/boat is Moneikos. I haven't found any web dictionay that will translate it. I have found other boats named moneikos though. <br> <br>a. Is it greek? <br>b. What's it mean? <br> <br>thanks. <br>Randy</p>
