    html: <p><i>I need this stuff because I'm about to design my first (original) Greek face, and I need to know what the language is doing first.</i> <br> <br>One thing that the 'language is doing' that might not be evident from online sources is reverting to polytonic (in orthography, not pronunciation). There is an increasing demand for polytonic Greek fonts within Greece, to the degree that major software developers are being told 'Don't bother shipping anything to Greece unless it supports polytonic'. <br> <br>I'm currently developing a set of Greek kerning documents based on the Septuagint and NT. I'll make these available, as FontLab kerning lists, once they're ready.</p>
