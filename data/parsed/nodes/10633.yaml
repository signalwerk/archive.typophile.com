    html: <p>Thank you Gerry! <br> <br>&gt; <a href="http://hnc.ilsp.gr/statistics.asp" target="_blank">http://hnc.ilsp.gr/statistics.asp</a> <br> <br>Bingo. <br>I guess the first section has the top 100 and 1000 lists of words, and allows for custom searching. And I guess the next set is for lemmas - but what's a lemma? And at the bottom, I guess it allows for the searching of phrases - but what's the difference between those two large fields? <br> <br>In case anybody's wondering, I need this stuff because I'm about to design my first (original) Greek face, and I need to know what the language is doing first. <br> <br>&gt; the fact that the three most frequent words .... <br> <br>Good observation. It reminds me of the major difference I once found in English word frequencies between adult versus children's material. In the latter "you" is the 8th word, but it's 33rd in the former. Otherwise they're surprisingly close. <br> <br>&gt; the non-Unicode output and the lack of an English version limits its functionality.  <br> <br>Yes. <br>BTW, are there any automated online Greek-to-English dictionaries? <br> <br>-- <br> <br>&gt; Moneikos <br> <br>Maybe it means "Monaco"? Yaght central, baby. <br> <br>hhp <br></p>
