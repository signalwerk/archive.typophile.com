    html: "<p>By some funny coincidence of timing I got a reply to an email I'd sent to the ILSP people. Here's a list of greek letter frequencies (of their corpus): <br> <br>alpha 11.51 <br>bita 0.68 <br>gamma 1.74 <br>delta 1.75 <br>epsilon\t8.63 <br>zita 0.35 <br>ita 5.09 <br>thita 1.12 <br>yiota 9.32 <br>kappa 3.96 <br>lamda 2.76 <br>mi 3.38 <br>ni 6.23 <br>ksi 0.41 <br>omikron 10.14 <br>pi 4.04 <br>ro 4.32 <br>sigma 7.86 <br>taf 7.98 <br>ypsilon 4.46 <br>fi 0.82 <br>xi 1.18 <br>psi 0.13 <br>omega 2.17 <br> <br>No corpus is perfect, but since the source here has 148,009,526 letters, it's should be very reliable. <br> <br>If only there was a way to extract digraph information from their corpus - that would be a great help to kerning. <br> <br>-- <br> <br>&gt; reverting to polytonic <br> <br>That's very cool. You mean more than just for classical scholarship? Does the average Greek learn how to read polytonic in school? <br> <br>&gt; Greek kerning documents ... make these available <br> <br>Wow, that would be very generous - thanks! <br>BTW, \"Septuagint and NT\": are those corpora? Classical or Modern? <br> <br>hhp <br></p>"
