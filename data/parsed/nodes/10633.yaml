    html: "<p>hhp: <br>&gt;BTW, are there any automated online Greek-to-English dictionaries?  <br>Not that I know of, but I haven't been looking.  <br> <br>hhp:  <br>&gt;You mean more than just for classical scholarship? Does the average Greek learn how to read polytonic in school? <br>To different degrees depending on specialization and period of schooling -- Greek Education ministers have been very active in the last 20-25 years. Everybody (take this literally) can read polytonic perfectly well; spelling competence varies (but then again so do polytonic orthography, depending on period of source, rogour of transcription, and editorial style). apart from any work from antiquity to 1982, all texts by self-respecting authors outside newspaper and periodical journalism writes in polytonic.  <br> <br>&gt; Septuagint  <br>translation of the Old Testament from Jewish to Greek c. 300--200 BC by, unsuprisingly, seventy scholars. You can find the text online.  <br> <br>&gt;NT <br>New Testament <br> <br>JH: <br>&gt;One thing that the 'language is doing' that might not be evident from online sources is reverting to polytonic <br>It never stopped using it, in my view the difference in one of perception by non-users, and visibility of commentators supporting awareness of polytonic's continued use. <br> <br>I'll just put on record my view that both systems should be used in parallel, not that one or the other  should be abolished (but indulge me if I don't justify this now). <br> </p>"
