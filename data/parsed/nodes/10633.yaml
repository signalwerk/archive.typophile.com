    html: "<p>(Hastily)    <br>This is the Hellenic National [Language] Corpus, hosted by the Institute of Language and Speech Processing (&lt;<a href=\"http://www.ilsp.gr\" target=\"_blank\">http://www.ilsp.gr</a>&gt; -- the site also in English).   <br>Thr blurb says: 'Thr corpus of texts at the ILSP has been develope over a number of years and now encompasses more than 32 million words, which arebeing added to regularly. The user has the option of retrieving one of the sentences in the corpus using from one to three words, or lemmata or grammatical constructions. In addition the user can determine the maximum distance between required words, as well as the subset of texts to which the search is limited. Lastly, there are some statistical data available on the linguistic content of the corpus, as well as the potential to return tables with [paraemeters] for a word defined by the user.'   <br>I gave it a spin, and quickly selected:   <br>Magazines/Information/Arts/Books+Letters/   <br>Was then faced with a selection from two of the major periodocal pubslishers, a list of authors, and a string of dates (Feb 93 to Dec 99). Hit OK,  got a confirmation of my selections, and was then faced with a series of webforms for selecting up to three words, with grammatical qualifications. did that, but their database spits out non-Unicode text (aaaaaarrggh!) so got gibberish.    <br>&lt;<a href=\"http://hnc.ilsp.gr/statistics.asp\" target=\"_blank\">http://hnc.ilsp.gr/statistics.asp</a>&gt; has some interesting stats: most frequent words and lemmata, plus the possibility to return a frequency for any string you provide (within the corpus, of course).    <br>I cannot tell you off the cuff how representative of a wider body of written work this corpus is, but the fact that the three most frequent words are the masculine article, the word 'me' and the word 'mine', there might be some bias due to the sample (newspapers, high circulation books, etc.).   <br>There seems to be a lot of stuff there, but the non-Unicode output and the lack of an English version limits its functionality.    <br>G/</p>"
