      <p>@Jens<br>
      Germans – don’t be afraid of Muslims. Can people who have done such beautiful calligraphy be evil?<br>
      Not being able to read this script the look is just about the aesthetics of the Holy Quran, forgetting that the mediaeval bibles were pleasing for the eye, too. Which didn’t hold the Christians back from slaughtering other people. It’s a rather stupid argument in the current debate in Germany about the Salafists giving away thousands of Qurans in public. To me it just mirrors the suffering quality of this influental newspaper. Its design also was much better years before. Now they have to put a pleasing picture on the front page, no matter what. (For non-Germans: FAZ was one of the very few newspapers that had a very strong visual identity by being purely typographic – not a single picture on the front page. Times are changing. The Salafists are in the news now everywhere, so let’s show a nice picture of some islamic calligraphy.) I’m not afraid of the Salafists, nor of the Quran. Maybe some really interesting news were out. No news is bad news. Let’s write just something to be up to date in a nonsense debate …</p>
