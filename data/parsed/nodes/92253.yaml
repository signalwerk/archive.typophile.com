      <blockquote><p>To prevent copy-pasting?</p></blockquote>
      <p>Or maybe to prevent indicisation. If so, maybe not so clever.<br>
      But I would assume that such a large newspaper use a proprietary layout and program which handles wordspacing differently than standard DTP. So, when producing a PDF, it will look OK in screen and print, but upon copy, wordspaces will disappear (just like linebreaks do in any PDF).<br>
      Talk about long German words! ;-)</p>
