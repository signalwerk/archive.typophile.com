      <p>Oké the type. I started with the idea of using Vista Alt. Because I really like the W in it. But I have my doubts about the E and S. Three E's and two S's in the name, so they are important for the wordimage (?is that english?) I tried other fonts and came to three other options; Helvetica Neue, Frutiger and Interstate. I prefer Frutiger. Nice T, S and E but the W I find less than the Vista W.</p>
      <p>What is your opinion? Wich font fits best with the logo sign? (Like I said before I want it to be clear, friendy and a good mix between trendy and timeless) Do you have other suggestions? Really like to hear it.</p>
