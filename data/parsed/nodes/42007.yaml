    <p>Hi,</p>
    <p>I'm a graphic designer and I am working on an identity for my company. I just started with my logo and I would be very happy if you good give some feed back.</p>
    <p>The  name of the company is Westvierzes. That means West For Six / Westforsix. That is a combination of the name of the street and my house number. So Westvierzes is nothing more than a geographical point on the map from were I work. A starting point from were I develop communication solutions.  My clients are mainly communal /governmental, television and diverse. </p>
    <p>I want to be my logo:<br>
    clear, friendy and a good mix between trendy and timeless (don't know if this is the right word in english, but I mean the opposite of trendy)</p>
    <p>The first designes are in black. In a later stadium I am going to choose colors.<br>
    In option A I combine the 4 and the 6 into one shape. To my it looks like a road  and that I like.<br>
    Option B and C are two variations with an arrow. In option C it works as a flag.</p>
    <p>My favourite is B because of the simplicity.</p>
    <p>Please give your reaction. Thanks.</p>
