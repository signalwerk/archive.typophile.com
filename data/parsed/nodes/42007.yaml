      <p>Nice style. Maybe too stylish to be "timeless." I feel like I might get tired of those fonts in a year or two. The type in option C seems to be the most versatile.</p>
      <p>In option A I like the 4 and 6, but I didn't read it like that. It has potential to be a very attractive logo. I would continue to explore that logo but I would find another typeface.</p>
      <p>In option B (sorry this is a bit scattered, just thinking and writing), I think the dynamic of the offset type is very interesting. </p>
      <p>Overall nice work. Good dynamic in the composition.</p>
