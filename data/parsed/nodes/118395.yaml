    <p>Book design question: My editor wants the author bio before the text. I’ve been pondering various solutions, and came up with the attached PDF. The bio texts are rather long, and I don’t want to push the title too far down the page. </p>
    <p>There’s two navigational issues: A: The title of the chapter is on the left page (which makes browsing harder then necessary). B: The first page of a chapter omits the page number (ditto).</p>
    <p>I’d love to hear your thoughts on this. Do you know any other examples of books where the author bio is the first element in the chapter?</p>
