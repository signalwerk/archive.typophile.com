    html: |-
      <p>Some semi-random thoughts:</p>
      <ul>
      <li>The navigational issues you mention are pretty usual. Except maybe the fact that it’s more common to have the book title on the verso and the chapter title on the recto. Losing also the page number is unfortunate, but in a book it happens in several places, for a variety of practical or traditional reasons.</li>
      <li>There is a range of length for the bios? Otherwise, a particularly lengthy or short one could break things apart.</li>
      <li>What distracts me in your example is mainly the setting of the running head, which in places (see page 4), interacts a bit too much with the main text.</li>
      <li>Finally, echoing Johan’s advice, you could try to differentiate more the bio text from the main text, maybe also tightening the leading. But what I mainly would try to do is creating a hierarchy inside the page:
      <ol>
      <li>Author</li>
      <li>Title</li>
      <li>Text</li>
      </ol>
      <p> For that you will probably need to highlight in some way the author’s name so that the bio text would be supporting it in its role.</p></li>
      </ul>
