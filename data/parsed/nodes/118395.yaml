    html: |-
      <p>The chapter-opening page numbers are the ones referenced in the table of contents, so chapter openers should always have a folio (page number).<br>
      When the standard placement of the page number is at the top, on the chapter-opening pages you can put the page number at the bottom. This practice is sufficiently well-established that there's a name for it in graphic-design jargon: It's called a <em>drop folio</em>.<br>
      The author biography does dominate the layout too much as it stands. I suggest you increase the indent for the author bio and reduce the point size and leading a bit to compensate for the shorter line length. And try making the chapter titles larger and/or bolder (unless you have some very long chapter titles).</p>
