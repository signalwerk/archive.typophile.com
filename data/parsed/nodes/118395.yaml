    html: <p>Some additional information from the editor just made my initial example mute, but in general it is the hierarchy I’m struggling with here. I want the biography to appear less important than the text, while still being at the top. I could take a number of different routes to get there (cursive, smaller size, contrasting typeface), but none of the ones I’ve tested so far <em>feels</em> right. Hence, I’m interested in seeing how others may have solved similar problems.</p>
