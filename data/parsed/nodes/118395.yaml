    html: |-
      <p>Why don't you want to push the title too far down the page? Chapter titles a third or even half-way down the page are not uncommon. </p>
      <p>That would help solve the major issue with your layout, which is that the biography text looks way too similar to the main text – it looks like a hangover block quote from the previous chapter (compare the next page!) and its nearness in style (especially in terms of left margin) gives it a slightly-off, disharmonious, unintentional impression. (You know, the old maxim of making things that are different singnificantly different.)</p>
      <p>With more space, or even without it, you could do any number of things to make it less similar to the main text. Set it futher left. Add a right margin. Switch typeface (to a sans?). Set it in bold or italic. Give it more space above the title. Set it in a shaded panel. Etc. etc.</p>
