  html: <p>Can anyone help me figure out what the typeface used on the NYC subway signage is?  <br>(Not the mosaics or the station names on columns -- but, the letters/numbers in circles identifying the line, and the black signage with white type above the tracks / giving directions in the station.) <br>I think it's either Akzidenz or Helvetica? <br>Thanks in advance!</p>
