    html: <p>Speaking of subways, anyone else notice that the new trains (the ones that make that mournful ooh-ee-ooh noise as they leave the station) have done away with the color-coding? They use LEDs, which are always red, to identify the line. It's a real shame since the often-imitated color-coded circles were a brilliant graphic device and enabled you to tell what train was coming down the track from a great distance.</p>
