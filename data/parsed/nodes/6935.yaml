    html: <p>The font used on the subway signage is an old display version of Helvetica (or at least it was�if they've gone digital recently they might have changed it). This Helvetica Display hasn't been digitized by Linotype. URW has it, though, as <a href="http://www.myfonts.com/fonts/urw/nimbus-sans/bold/testdrive.html?s=50th+Street&amp;p=72">Nimbus Sans P Bold</a>. Personally, this is my favorite version of Helvetica. <br> <br>[Compare to LT's <a href="http://www.myfonts.com/fonts/linotype/neue-helvetica/helvetica-75-bold/testdrive.html?s=50th+Street&amp;p=72">Helvetica Neue 75</a> and <a href="http://www.myfonts.com/fonts/linotype/helvetica/bold/testdrive.html?s=50th+Street&amp;p=72">Helvetica</a>.]</p>
