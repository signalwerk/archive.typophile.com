    <p>I’m quite positive that this question must come up frequently, but I’ve searched the depths of the internet to find a solution to my problem.</p>
    <p>Whenever a file is imported that needs to have its background knocked out (through either a PSD with no background, or a clipping mask in various other formats) the type on the page its on becomes sickly and thin in appearance. </p>
    <p>I have tried most everything to fix it, from my previous research such as placing the type on a higher layer, putting it on the same layer but changing the stacking order. And a few other things. These have no effect on my typeface oddity. It seems that my problem cant be solved with the usual fixes.</p>
    <p>I would very much appreciate any input or solutions that anyone here has. </p>
    <p>Humbly Yours,</p>
    <p>Jeremy Lee</p>
