      <p>Based on experience with checking out other romance novel covers, my suspicion is that this is a custom effort by the publisher. Perhaps just these letters were produced, perhaps a full uppercase alphabet.<br>
      Charles Borges de Oliveira's Desire <a href="http://www.myfonts.com/fonts/charlesborges/desire/" title="http://www.myfonts.com/fonts/charlesborges/desire/">http://www.myfonts.com/fonts/charlesborges/desire/</a> can give you similar effects.<br>
      Don</p>
