      <p>This looks like it might be of use:</p>
      <p><a href="http://www.python.org/download/mac/" title="http://www.python.org/download/mac/">http://www.python.org/download/mac/</a></p>
      <p>Also, I recommend installing the xcode suite ( <a href="http://developer.apple.com/tools/xcode/" title="http://developer.apple.com/tools/xcode/">http://developer.apple.com/tools/xcode/</a> ) for your os version. It seemed to iron out a lot of kinks on my 10.6 machine to do with font development. Good luck!</p>
