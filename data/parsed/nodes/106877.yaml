    html: <p>Moët &amp; Chandon is <a href="http://typophile.com/node/33713" rel="nofollow">squooshed</a> <a href="http://www.fontshop.com/fonts/downloads/linotype/times_pro_complete_vp/ot_ps?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=50&amp;sample_text=ALC.%2012%25%20BY%20VOL.&amp;ft=liga" rel="nofollow">Times</a>. Bertrand-Delespierre is some squooshed Century, maybe <a href="http://www.fontshop.com/fonts/singles/linotype/new_century_schoolbook_std_roman_adobe/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=55&amp;sample_text=12%25%20Vol.%20750%20ml&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Century Schoolbook</a>. Lanson is some heavily squooshed Garamond, maybe <a href="http://www.fontshop.com/fonts/singles/linotype/garamond_3_std_lt_std/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=65&amp;sample_text=75%20cl%2012%2C5%25%20vol.&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Garamond No. 3</a>. Krug is even more heavily squooshed <a href="http://www.fontshop.com/fonts/singles/linotype/diotima_std_roman/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=60&amp;sample_text=75%20cl%2012%2C5%25%20vol.&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Diotima</a>.</p>
    html_clean: <p>Moët &amp; Chandon is <a href="/node/33713/" rel="nofollow">squooshed</a> <a href="http://www.fontshop.com/fonts/downloads/linotype/times_pro_complete_vp/ot_ps?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=50&amp;sample_text=ALC.%2012%25%20BY%20VOL.&amp;ft=liga" rel="nofollow">Times</a>. Bertrand-Delespierre is some squooshed Century, maybe <a href="http://www.fontshop.com/fonts/singles/linotype/new_century_schoolbook_std_roman_adobe/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=55&amp;sample_text=12%25%20Vol.%20750%20ml&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Century Schoolbook</a>. Lanson is some heavily squooshed Garamond, maybe <a href="http://www.fontshop.com/fonts/singles/linotype/garamond_3_std_lt_std/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=65&amp;sample_text=75%20cl%2012%2C5%25%20vol.&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Garamond No. 3</a>. Krug is even more heavily squooshed <a href="http://www.fontshop.com/fonts/singles/linotype/diotima_std_roman/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=60&amp;sample_text=75%20cl%2012%2C5%25%20vol.&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Diotima</a>.</p>
