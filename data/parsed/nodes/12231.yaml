    <p>I love Czech Type.. <em>I do.. I do..</em><br>
    ( I think I fell in love with the typographic quality of my northern, neighbouring country, as well.. :)</p>
    <p>~ <a href="http://www.stormtype.com" target="_blank" rel="nofollow">Storm Type Foundry</a> <em>( František Štorm, <a href="http://www.stormtype.com" target="_blank" rel="nofollow">www.stormtype.com</a> )</em><br>
    ~ <a href="http://www.suitcasetype.com" target="_blank" rel="nofollow">Suitcase Type Foundry</a> <em>( Tomáš Brousil, <a href="http://www.suitcasetype.com" target="_blank" rel="nofollow">www.suitcasetype.com</a> )</em><br>
    ~ <a href="http://www.typo.cz/euro/" target="_blank" rel="nofollow">TypoCZ</a> <em>( Filip Blazek, <a href="http://www.typo.cz/euro/" target="_blank" rel="nofollow">www.typo.cz</a> )</em><br>
    ~ <a href="http://www.magtypo.cz/english.html" target="_blank" rel="nofollow">TYPO</a> <em>( <a href="http://www.magtypo.cz/english.html" target="_blank" rel="nofollow">www.magtypo.cz</a> )</em></p>
