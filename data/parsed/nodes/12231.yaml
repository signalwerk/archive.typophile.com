      <p>Me too! <a href="/wiki/Josef%20Tyfa" class="freelinking" rel="nofollow">Josef Tyfa</a>, <a href="/wiki/Slavoboj%20Tusar" class="freelinking" rel="nofollow">Slavoboj Tusar</a>, <a href="/wiki/Vojtech%20Preissig" class="freelinking" rel="nofollow">Vojtech Preissig</a> and <a href="/wiki/Oldrich%20Menhart" class="freelinking" rel="nofollow">Oldrich Menhart</a> are all great! I broke down and bought the entire Storm Czech Type Library earlier this year, and then went back to storm to buy Farao, which I love to bits.</p>
