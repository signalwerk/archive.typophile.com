    html: |-
      <p>I like the style there is just too much of it, very busy. Why not simplify it right down and use the first letter the A. Maybe you could have a couple of small black silhouette figures roped together ascending its slope. This will create a strong simple icon with the emphasis on the 2 key points, the mountains and people. Underneath it render the company name in a strong clean font in black.</p>
      <p>I have done quite a lot of work for the adventure industry, keep in mind that they will probably want this embroidered on their uniforms, so keep is clean, strong and simple, think of successful brands like North Face and how they are used.</p>
      <p>I like the colour, it has an alpine feel.</p>
