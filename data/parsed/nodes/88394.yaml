    <p>This concept is for 'The Altitude Academy' a start-up business that offers training in mountain climbing, skiing and trekking. It's target audience is anyone interested in adventure sports and pushing themselves a little further through intensive training. I'm looking for feedback regarding legibility and balance...and obviously if it is speaking to it's target audience well enough. Cheers :)</p>
