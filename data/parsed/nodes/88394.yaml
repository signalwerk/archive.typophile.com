    html: <p>I like it but don't think it is legible enough either. My first thought was that it is a bit heavy metal, and then realised it reminded me of the <a class="freelinking external" href="http://rockcinema.eu/resources/Anthrax_logo.jpg" rel="nofollow">Anthrax logo</a>. I don't think that is any reason to radically change what you've done. I like the way it fits together like one of those tangram puzzles, and probably just adding a bit more space between each piece would improve legibility.</p>
