    <p>I am remaking a folder that contains an image from a newspaper published on August 22, 1925. I have browsed over 40 000 fonts including Font Shops Font Book without luck. Now I am trying this way to get help. </p>
    <p>Please help me, I really need to know.<br>
    Note the characters T, F and G.</p>
    <p>Thanks in advance!</p>
    <p>Mr. Olle Dahlquist<br>
    Sweden</p>
