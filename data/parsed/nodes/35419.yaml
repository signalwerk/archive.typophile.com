      <p>I would think that monospace type would generally require more leading than proportional spaced type. The reason would be that monospaced letterspacing feels more open and I would want to maintain a horizontal feel to a line so that rivers would not be so prominant. How much more? Only your eyes can tell.</p>
      <p>ChrisL</p>
