      <p><cite>I think that monospace type is fair game.</cite><br>
      Yes, I fully agree with that. And you’re right about the Didone email adresses. :°) Still, I personally find it harder to stifle that ‘pomo!’-feeling with deracinated monospacers. But back to topic:<br><cite>Leading?</cite><br>
      What do you wanna hear? Percentage values? What typeface, line lenght, content, media? Monospace fonts in general—inherently—tend to form vertical columns, you’re certainly aware of that. So, maybe you want to increase the leading a bit to countersteer that phenomenon, if undesired.</p>
