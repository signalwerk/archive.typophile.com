      <p>Most monospaced fonts have their roots in the era of typewriters. Hence, I always find it a bit odd to find Courier &amp; co. in a context completely different from what was possible with a typewriter; let’s say, in 72p display setting. Or justified. Or ‘beautifully’ kerned.<br>
      Same for leading. Some combinations of size and ledaing just scream ‘pomo’!<br>
      It depends. Maybe you want to show an image?</p>
