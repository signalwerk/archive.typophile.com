      <p>The leading you use should be the result in part of line length, ascender height, descender height &amp; x-height. There isn't a formula but a good place to start might be 1.20 of the pt size of the type. The longer the line of text the more pressure there is to add space to the interlinear space.</p>
      <p>Some good places to look for more info are 'The Elements of Typographic Style' by Robert Bringhurst, and maybe search Typophile via google. For instance : <a href="http://www.google.com/search?q=site:typophile.com%20Leading">http://www.google.com/search?q=site:typophile.com%20Leading</a> There have been some excellent threads on this subject here as I recall. </p>
      <p>Line space for a mono will be trickier to do in the sense that a mono is always going to look more uneven to the eye with the dense m and the wide i and so on - which is distracting. But the principles are the same as for a non-mono as far as I can tell. </p>
      <p>Ultimately - trust your eyes no matter what I ( or anyone ) says.</p>
