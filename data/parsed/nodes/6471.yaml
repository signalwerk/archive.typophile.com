    date_raw: 1 Sep 2004 — 9:46am
    votes: null
    html: <p>Unfortunately, all clients are not considerate or sophisticated enough to understand what they are paying you to do. <br> <br>I hyperbolize a bit about complaining, but then some people only understand compliance or noncompliance. <br> <br>I think Tiffany is fortunate to work at a level and position where collaboration and respect trump submission and dominance. <br> <br>I will say that it is so rare that I take a strong stance, that when I do it is noticed.  Which battles to pick now? <br> <br>Clearly I feel empathic about Richard's position. From a larger perspective, I also find a strong correlation between the success of a project and the degree to which a client is confident enough to let me do my job.</p>
