    html: <p>When one of my clients has asked it only happens once. Even my boss knows to ask for some more condensed verus squooshing what is used. <br> <br>When a client does ask I do not complain, but I do tease them a little and then I show them, educate them, to what the difference is in squooshing what we are using or finding a condensed version that will work (or another option altogether). <br> <br>I am happy that I have such good relationships with my clients that they want to learn and understand. I like to think that they want what is best, and they see that I do feel this way which makes them in turn want what is best.</p>
