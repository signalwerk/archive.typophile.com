    html: <p>I don't respond to this command. Normally I'm very aware that the client has to be happy AND the design has to work. But I won't stretch type, and I do complain when asked. <br> <br>In this case though, it's not like you will be messing up a corporate identity or something major. <br> <br>This is why I keep Helvetica around with its condensed, compressed and other unholy incarnations. If the client really could care less, at least I can fit whatever they throw at me without doing damage to the type.</p>
