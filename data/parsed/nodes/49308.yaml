    html: <p>I'm intriqued by that advise Aziz. Fonts with an .otf extension are PostScript flavored OpenType fonts, while fonts with the .ttf extension are either TrueType or TrueType flavored OpenType fonts. Why would you rename *.otf to *.ttf?</p>
