    <p>Hi all you typelovers.</p>
    <p>Well i'm having a strange problem.<br>
    At work we used to work with the .ttf Parisine (from Porchez).<br>
    I bought last year the .otf version and from this day on i'm having strange problems.<br>
    There i go:</p>
    <p>First, i'm working on a 2ghz Core Duo Intel iMac with Mac OSX.4.8.<br>
    I removed the .ttf Parisine, so there is just one Parisine active and this is the .otf</p>
    <p>What happens is that, let's say i worked on a catalogue, text is set in Parisine .otf, everything's fine...<br>
    Then the next day, i open up my document to continue and the text is full of ligatures that i did not want and were not there befor.<br>
    Everywhere the ct and st ligatures and on top of this all the dubble o's like in "books" are replaced by a ? in a square.<br>
    Hmm does anybody had this befor?<br>
    Even if i select all the text and uncheck the ligature option in the characters palette nothing changes.<br>
    Sometimes i just close the document and Indesign and just reopen it and everything is fine again but that works like 1/20.</p>
    <p>Also i'm not the only one having this problem here at work.</p>
    <p>Where can this come from? </p>
    <p>Thanks a lot for any help,</p>
    <p>Gilles</p>
