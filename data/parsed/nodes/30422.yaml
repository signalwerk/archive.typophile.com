      <p>You might be having a problem with your font cache files. </p>
      <p>Search your harddrive for files named: AdobeFntXX.lst<br>
      (The XX will be a number, say "11" or "07".)<br>
      Throw these files away and restart your computer.</p>
      <p>Important: DO NOT DELETE files named: AdobeFnt.db.</p>
      <p>If you are still having problems, you might want to contact M. Porchez directly; this might be an issue which he is familiar with, and if it isn't, I'm sure that he would like to know about your experiences.</p>
