      <p>You might already be aware of these two projects, but I suggest looking at <a class="freelinking external" href="http://8faces.com/" rel="nofollow">8 faces</a> and the <a class="freelinking external" href="http://losttype.com/" rel="nofollow">Lost Type Co-op</a>.</p>
      <p>Favorite ≠ most used. The typeface I use is usually determined by factors that trump my personal desire: Client has a preexisting corporate style, how it will look on the paper/screen, does it have characters/styles I might need down the line, etc.</p>
      <p>I usually buy a typeface because it is unlike anything I currently own (Cyclone, Deliscript, Paradigm), or it has significantly more features than something similar I may already have (Bookmania &gt; Bookman Old Style, Harriet Text &gt; Century Schoolbook). I'm also a sucker for sales and discount bundles of those types of fonts.</p>
      <p>Another great incentive for me is a specimen that highlights the font's features, describes with some detail how the design came to be, and/or recommends an ideal/intended usage (agate/display, newsprint/screen, etc.)</p>
