      <p>You can decide to just be another copycat wannabe and clone the current popular fonts.  Or, you can put some good original fonts on the market that are not just another Times or Helvetica.<br>
      What kind of brief is this and for what kind of student major? Is this a marketing class or a graphic design class?<br>
      I assume you think of this forum as your target market?  Probably wrong assumption as others have stated.</p>
      <p>If you are really doing a brief, I would first analyze who the real target market is.  Who buys type often enough to be meaningful? I am not going to tell you because that is part of your assignment. You all need to sit down and figure out away to find out.  I don't just mean who to ask for the answer. I mean what would be a methodology for finding any target market?  That is because you are trying to learn something useful and repeatable for your area of study instead of just finishing this assignment.  This all gets in to what drives a particular market and how far ahead you need to be thinking.  Clearly, you are too late for "today". Walk a mile in the target audiences' moccasins, then bang your heads against it.</p>
