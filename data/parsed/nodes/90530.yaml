      <p>If I'm not mistaken the actual trend in graphic design is vintage neo modernism which was preceeded by some kind of letterprint-slab serif-DIY pastiche and before that we had a strong humanist-baroque serif revival period that folled the humanist sans serif period of the late 90's... so I'm guessing the next big thing is going to be psychedelic fonts, along with a big come back of Antique Olive and pastel colors.</p>
      <p>I actually enjoy very much using Futura ND, it´s elegant (compared to Bitstream's or Adobe's) and energetic. I finally had the chance to use Caslon Big on a real project and I liked it very much.</p>
      <p>If you are going to attempt doing some real typefaces for this project, I suggest doing display faces, they are much easier to complete and to sell.</p>
