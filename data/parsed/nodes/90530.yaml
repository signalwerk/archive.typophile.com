      <p>That’s not how Steve Jobs would have done it.<br>
      Me neither, nor David.<br>
      Why not make what you feel like, rather than pandering to the market?<br>
      If you research what people like now, by the time your product is out it will be passé. If you attempt to anticipate where the market is heading, you are guessing.<br>
      Besides, the minority of Typophile posters actually pay for fonts, they are either font producers or looking for the free equivalent of something commercial that is presently trendy.<br>
      However, if you are attempting to take a snapshot of what’s popular now, in order to avoid duplicating that sort of thing—Respect!</p>
