      <p>The trouble with footnotes in this case are that you are trying to make better use of a page, so rather than take up space at the bottom of the page that could be used for text and leaving large unused areas, sidenotes will use otherwise unused space; when the reader has located a sidenote once they will surely not have any trouble finding the next one, they will not be difficult to spot after all. Footnotes present the problem that the optimum measure is often a lot shorter, given the point size is smaller, and you have to consider whether you should stick to the text measure or use the optimum measure, equally sidenotes containing long urls will also present problems in linebreaks or even having to break the addresses over more than one line. The best way to make this decision is to look at your provided copy and see if the footnotes might present either problem, if they are really heavy you might consider doing them as endnotes (either end of chapter or end of document) but they are less user-friendly. As a personal preference and with all other things considered I prefer a sidenote to a footnote.<br>
      Tim</p>
