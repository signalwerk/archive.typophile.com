      <p>jason: <cite>As for the text measure, the obvious answer is up the type size to 12, but if you’re anything like me 12pt type makes you feel ill.</cite><br>
      William Berkson: <cite>Adobe Garamond looks good at 12 pt as it has a small x height.</cite></p>
      <p>12 pt makes me feel somewhat retarded, but in a single column with a lot of whitespace it might be acceptable.</p>
      <p>jason:<cite>… remember that Bringhurst’s suggestion is the “optimum” line length, and your format doesn’t particularly suit that “optimum,” therefore you’ll likely end up extending it another few picas.</cite></p>
      <p>Agreed, but my goal is to, although working with the A4 format*, stick as close as possible to the principles/guidelines of good typography.<br>
      * For Americans: close to your letter format.</p>
      <p>jason: <cite>This seems like a lot of work, however, for a downloadable …</cite><br>
      William Berkson: <cite>If you are using proper page layout software …</cite></p>
      <p>I’m using Indesign CS2. It is indeed a lot of work, but it might be a good opportunity to learn more about InDesign scripting. Can something like moving all footnotes in a document (originally imported from a Microsoft Word file) to a separate textframe (on the side of the page) be done with scripting?</p>
      <p>timd: <cite>If you were working with a document that you felt would be mainly read on screen the landscape idea is a better solution …</cite></p>
      <p>I’m afraid of the landscape orientation because portrait seems to be the default on most printers. Having people print landscape PDFs seems to be asking for trouble, i.e. text falling of the page etc. In Acrobat Reader in Windows, ’auto rotate and center’ is not always on, if I recall correctly. I’m not sure what the situation is with Acrobat and Preview on the Mac.</p>
      <p>timd: <cite>footnotes, instead of having them aligned on the bottom, you could also align them with the reference in the text (although that becomes tricky when you have many footnotes to fit in).</cite></p>
      <p>I’ve tried ’anchoring’ the sidenotes to the note reference symbols in the text, but that didn’t work for all notes. Would it be acceptable if sometimes the note is not right next to the reference but slightly lower on the page to make up for a longer footnote (or larger number of footnotes) above?</p>
      <p>juki: <cite>The reduced type size may pose a problem though if majority of your target audience use inkjet printers.</cite></p>
      <p>Good point, which I hadn’t yet considered, really. Maybe my font choice is not optimal to begin with? Garamond Premier Pro (silly name, by the way) with its rather high contrast isn’t particularly suitable for bad printing conditions, is it? The reason I chose Garamond because of its Greek: I do need a good and complete polytonic/ancient Greek character set. Of course, Minion Pro  has that too. Would that work better?</p>
      <p>juki: <cite>You could try using two columns. A lot of medical journals are set in this layout. You can check <a href="http://www.nejm.org" title="www.nejm.org">www.nejm.org</a> (New England Journal of Medicine) …</cite><br>
      William Berkson: <cite>Another solution is to keep the portrait orientation but make a magazine style 3 column lay out.</cite></p>
      <p>juki, I’ve been able to find only <em>three</em> column layouts there. The papers I’m designing are on subject matter in the humanities, where you do find multiple (mostly two) column layouts, but not that often. I think setting the  papers in multiple columns would convey too strong a ’dictionary’ or ’encylopaedic’ feeling. Even if the columns remind the reader of scientific journals, that’s not really what I want to achieve. The papers, most of which <em>have</em> been published in journals, should be presented here in a more personal and individual way.</p>
