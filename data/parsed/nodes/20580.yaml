      <p>If you were working with a document that you felt would be mainly read on screen the landscape idea is a better solution, but as you say it would be printed and bound (presumably at the printer’s choice of binding), you would need a generous top margin (the binding edge).<br>
      For a portrait format you should probably budget for at least a 30mm inside margin to accommodate any form of binding, combined with your text measure, would give you a good 50mm column for footnotes, instead of having them aligned on the bottom, you could also align them with the reference in the text (although that becomes tricky when you have many footnotes to fit in).<br>
      Tim</p>
