      <p>timd: <cite>Yes …</cite></p>
      <p>But even if the sidenotes are moved slightly down while still sitting on the same page as their references, the reader’s eye has to scan a larger area (namely the side column) to find the note he’s looking for. If the notes were on the bottom of the page, where they would have more a more expansive line length, they would need less lines, i.e. the note numbers are closer together. </p>
      <p>Tschichold says (<em>Ausgewählte Aufsätze über Fragen der Gestalt des Buches und der Typographie</em>, p. 148): “Fußnoten sind die späteste und höchstentwickelte Form der Noten. Marginalnoten (…) sind eine längst veraltete Form.” (My translation: “Footnotes are the oldest and most developed form of notes. Marginal notes are a form that has since long become obsolete.”)</p>
      <p>For some contrast, see Bringhurst <em>Elements</em>, p. 68: “Sidenotes give more life and variety to the page and are the easiest of all to find and read.”</p>
      <p>Apart from those few statements I’ve not found a systematic account of sidenotes and these being put to (good and bad) use. Does anyone know of such a work?</p>
