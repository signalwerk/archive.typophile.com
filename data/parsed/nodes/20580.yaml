      <p>You could try using two columns. A lot of medical journals are set in this layout. You can check <a href="http://www.nejm.org" title="www.nejm.org">www.nejm.org</a> (New England Journal of Medicine) and download their PDF journals. (the journals are laid out in U.S. letter size, slightly wider than A4)</p>
      <p>Although in order to have a great 2 column layout, you may have to reduce the measure to maybe 18 picas and type size to 10pt. The reduced type size may pose a problem though if majority of your target audience use inkjet printers.</p>
      <p>Hope this helps</p>
      <p>Joseph</p>
