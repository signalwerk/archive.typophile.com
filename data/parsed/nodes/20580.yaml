      <p>1. Adobe Garamond looks good at 12 pt as it has a small x height. </p>
      <p>2. If you are using proper page layout software a good solution is to have a large left  margin into which you put sub-titles, large. Eg you can have them in regular italic Adobe Garamond 24 pt. </p>
      <p>3. Another solution is to keep the portrait orientation but make a magazine style 3 column lay out. This will probably save you pages also, if that is any factor.</p>
