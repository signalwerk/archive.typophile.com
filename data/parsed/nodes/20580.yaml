    <p>I’m trying to come up with a layout for academic papers on A4 format (210×297 mm). The papers will be made available online as PDFs to be downloaded and printed.</p>
    <p>Question: should I treat the single A4 page as the right half of a spread, i.e. small left, larger top, even larger right and bottom margins?</p>
    <p>Problem: the font is 11 pt Adobe Garamond. From Bringhurst’s ’Average character count per line’ table (<em>Elements</em>, p. 29) I get an optimum line length of 24 pica (103 mm), which is not even half the width of the (indeed, much too wide) A4 format. Result: very spacious margins, which may be suitable for some luxury edition, but not for this kind of writing (home printed on cheap paper). How to fill the width of the paper? I see the following possibilities:</p>
    <p>Put the footnotes in a separate, narrow bottom aligned column on the right side of the text block. However, the reader might not be used to seeing notes there.</p>
    <p>Or trade in the default portrait for landscape format and divide the A4 page horizontally in two columns. But the end user might have problems printing this; he might not like the format when storing the print-out in binders and the like.</p>
    <p>I guess there are other typophiles who have fought battles against the A4 standard. What solutions have you come up with?</p>
