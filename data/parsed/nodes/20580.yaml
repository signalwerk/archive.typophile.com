      <p>If it’s not a codex why would you treat it as such? If you’re setting up single pages, your margins should (conventionally) be symmetrical (eg. L&amp;R=1.5 : T=2 : B=3).</p>
      <p>As for the text measure, the obvious answer is up the type size to 12, but if you’re anything like me 12pt type makes you feel ill. Aside from that, remember that Bringhurst’s suggestion is the “optimum” line length, and your format doesn’t particularly suit that “optimum,” therefore you’ll likely end up extending it another few picas.</p>
      <p>The other option, as you mention, is to shift the content as though you were, indeed, working with a recto page and use the right margin for side-notes. This seems like a lot of work, however, for a downloadable, but if you have the time and inclination, you certainly have the page size to accomplish the task.</p>
