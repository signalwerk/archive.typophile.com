      <p><em>Would it be acceptable if sometimes the note is not right next to the reference but slightly lower on the page to make up for a longer footnote (or larger number of footnotes) above?</em><br>
      Yes, although there might come a point when the footnote is completely bumped to the next page, which will be confusing, that really is only a decision you can make based on your knowledge of the frequency and length of footnotes. As for the portrait/landscape problem, if your readers are likely to make that kind of mistake then you should go for the default setting, there might be some document property you can assign that will allow you to specify the printing set-up.<br>
      Tim</p>
