      <p>Circle is indeed not perfectly circular, that is wanted. And the fact that it recalls old vinyls is also wanted. Those labels ( or chips ? ) will appear on electronic circuits in satellites or IRM scanners. The naïve idea behind this is to remind the name of the company ( weeroc ). The particular context, in my humble opinion, makes it even more ridiculous to insist on the high-end technology side. We choose to underline the human side. But circular shape stays in the global meaning field ( wafer, chip, circuit termination, etc...).</p>
      <p>For the (k) thing, advice was what I expected -and found !- but I didn't really expect observations like :"unnecessary" or "ridiculous". Kosher symbol ? It never displays like this- examples here : <a href="https://www.google.fr/search?q=kosher+symbols&amp;hl=fr&amp;rlz=1C1MACD_enFR499FR499&amp;prmd=imvns&amp;tbm=isch&amp;tbo=u&amp;source=univ&amp;sa=X&amp;ei=SaxAUIX1I5KwhAfp6ICQAg&amp;sqi=2&amp;ved=0CCQQsAQ&amp;biw=1310&amp;bih=766" title="https://www.google.fr/search?q=kosher+symbols&amp;hl=fr&amp;rlz=1C1MACD_enFR499FR499&amp;prmd=imvns&amp;tbm=isch&amp;tbo=u&amp;source=univ&amp;sa=X&amp;ei=SaxAUIX1I5KwhAfp6ICQAg&amp;sqi=2&amp;ved=0CCQQsAQ&amp;biw=1310&amp;bih=766">https://www.google.fr/search?q=kosher+symbols&amp;hl=fr&amp;rlz=1C1MACD_enFR499F...</a> </p>
      <p>But I agree this (k) generates "parasite discussions". Goodbye (k), and I go back to work. Thank you for all these reactions.</p>
  - id: 520723
    user_id: 65389
    user_name: Luma Vine
    user_path: null
    date_raw: 31 Aug 2012 — 5:13pm
    date: 2012-08-31T17:13:00
    votes: null
    html: |-
      <p>What is missing from my understanding of your goals is:<br>
      1) Is standing out from the competition the same thing to you as being a bit silly/playful/cheeky in a high end market? How is a music reference more human than circuit board reference?<br>
      2) Who is the audience for this branding effort?<br>
      3) In what circumstances will this mark function as an identity (communicate something to your audience) rather than just an identifier (to signify who made that circuit board that nobody every sees inside a satellite for example)?</p>
      <p>If you are going for a non circle, you need to go farther with the distortion to make it look like something other than a mistake.</p>
  - id: 520755
    user_id: 199093
    user_name: charleda
    user_path: null
    date_raw: 1 Sep 2012 — 1:24am
    date: 2012-09-01T01:24:00
    votes: null
    html: |-
      <p>Luma, I will fright you again in saying that the questions you ask are the questions I asked to myself.</p>
      <p>1) I understand very well that the frontier between "standing out from the competition" and "being a bit silly/playful/cheeky" is really thin. The first mistake I made was to post images, because what we have here are just directions, and I never considered them as being definitive displays. That said, on the music reference, I ask a new question : why the hell did the NASA sent a song from Mars to the Earth ? Many answers are available to answer the question, but among them, one seems very clear to me : music is "human only". But the circle is not just a record, it also recalls the Voyager Golden Record <a class="freelinking external" href="http://en.wikipedia.org" rel="nofollow">wiki|Voyager_Golden_Record</a></p>
      <p>As a symbol, Voyager Program is the first program to illustrate the will of human beings to link  with the Universe. This said, we go to your second question</p>
      <p>2) The audience for the branding effort is people who do their job to touch a dream born with those space programs, and Voyager is their common legend. Happily, the circle symbol materializes the link between their "dream", their professional activity and their common specificity ( they are human beings ). During the briefing, the unperfect circle  immediately made them react positively because it also illustrates to them the "quantic world", where  human perception becomes like a trap. </p>
      <p>Question 3 is "the question of the moment" : I have to have a big time working specifically on this.</p>
      <p>And... I agree the circle has to be farther distorted !</p>
