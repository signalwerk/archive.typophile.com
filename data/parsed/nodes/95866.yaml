      <p>Circle is indeed not perfectly circular, that is wanted. And the fact that it recalls old vinyls is also wanted. Those labels ( or chips ? ) will appear on electronic circuits in satellites or IRM scanners. The naïve idea behind this is to remind the name of the company ( weeroc ). The particular context, in my humble opinion, makes it even more ridiculous to insist on the high-end technology side. We choose to underline the human side. But circular shape stays in the global meaning field ( wafer, chip, circuit termination, etc...).</p>
      <p>For the (k) thing, advice was what I expected -and found !- but I didn't really expect observations like :"unnecessary" or "ridiculous". Kosher symbol ? It never displays like this- examples here : <a href="https://www.google.fr/search?q=kosher+symbols&amp;hl=fr&amp;rlz=1C1MACD_enFR499FR499&amp;prmd=imvns&amp;tbm=isch&amp;tbo=u&amp;source=univ&amp;sa=X&amp;ei=SaxAUIX1I5KwhAfp6ICQAg&amp;sqi=2&amp;ved=0CCQQsAQ&amp;biw=1310&amp;bih=766">https://www.google.fr/search?q=kosher+symbols&amp;hl=fr&amp;rlz=1C1MACD_enFR499F...</a> </p>
      <p>But I agree this (k) generates "parasite discussions". Goodbye (k), and I go back to work. Thank you for all these reactions.</p>
