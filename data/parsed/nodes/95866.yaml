      <p>What is the intention with the logo? I see a lot of issues, but intentional "errors" have had an upturn lately (although <em>faux naïve</em> is probably dead by Christmas). As already mentioned, the weight is problematic, but I also think the balance (both overall, and inter-letter) and lack of optical adjustments is.</p>
