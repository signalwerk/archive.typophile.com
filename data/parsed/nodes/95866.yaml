      <p>What is missing from my understanding of your goals is:<br>
      1) Is standing out from the competition the same thing to you as being a bit silly/playful/cheeky in a high end market? How is a music reference more human than circuit board reference?<br>
      2) Who is the audience for this branding effort?<br>
      3) In what circumstances will this mark function as an identity (communicate something to your audience) rather than just an identifier (to signify who made that circuit board that nobody every sees inside a satellite for example)?</p>
      <p>If you are going for a non circle, you need to go farther with the distortion to make it look like something other than a mistake.</p>
