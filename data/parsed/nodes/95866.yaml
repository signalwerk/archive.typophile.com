    date_raw: 29 Aug 2012 — 4:49pm
    date: 2012-08-29T16:49:00
    votes: null
    html: |-
      <p>I think the circuit idea works, and I like the forms of the letters except the /W. What if you try the circuit board hole circle as a ball terminal, maybe on the /r and /c inspired by this form: <a href="http://www.paratype.com/pictures/help/term/30.gif" title="http://www.paratype.com/pictures/help/term/30.gif">http://www.paratype.com/pictures/help/term/30.gif</a></p>
      <p>Perhaps a simple matching lower case /w would do the trick, and/or one looking more like /uu with 2 curved bottoms? </p>
      <p>For a secondary font, try to pick something that is technical and a bit fun to reflect what seems to be the brand characteristics. Maybe look at the sommet family?</p>
      <p>I think this is a solid idea, but generating some other ideas is often very helpful even if you decide to refine this direction. </p>
      <p>p.s. I really would drop the (k) - I get 'we rock' just fine without it. One too many concepts sometimes dilutes the value of them all.</p>
