  - id: 520332
    user_id: 199093
    user_name: charleda
    user_path: null
    date_raw: 29 Aug 2012 — 1:12am
    date: 2012-08-29T01:12:00
    votes: null
    html: |-
      <p>You are right, there are visual mistakes. The "roc" is the suffix for a whole line of products, and "wee" suggests three specific know-how of the company. The whole name means also what it tells phonetically... The circle simply recalls the "bridge" between two meanings : "we rock" and the technical meaning very near from the wafers used in electronics. I am looking for a way to make "we" clearly appear and at the same time, suggest that "roc" is like a mark inside of the company. The (k) suggests the mathematics (power, equations, ... ) and also forms the "k" of "rock".<br>
      One of the difficulties I have is that the logo has to be ready to be printed in really exotic conditions ( nanometric print on circuits, print on materials used in satellites,.... ). I thought quite "naïvely" that visual mistakes would permit to perceive more easily the logo in very special conditions. The idea is also to evoke the "random conditions" of nano universe.</p>
