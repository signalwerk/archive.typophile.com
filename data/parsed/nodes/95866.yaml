    <p>Hi all !<br>
    I would be very pleased to get some advice and suggestions about the font pairing and global appearance of this combination. At the moment, it is just a start on a business card. The company is specialized in high-end microelectronics and wants to contrast radically from the other companies in their sector... I made some boards with different variations and identity elements, but I need to know what you are thinkning about those two simple lines : logo and font pairing... Thank you by advance to all of you !</p>
    <p><img src="/sites/default/files/old-images/weeroc_noise_72_dpi_3434.png"></p>
