    html: |-
      <p>The monoline naïve look can definitely work, espc. in the context of a circuit board, but it seem to me the idea behind it is neither well considered nor well executed. Perhaps you need to return to the idea stage?</p>
      <p>In a serious business segment like this I would advice against a high school pun like “we rock”. At least that’s  the impression I’ve gotten from the customers I’ve had in the microelectronics field. </p>
      <p>PS:<br>
      I see I’m the only one questioning the fundamentals here, so I’ll leave it to you to figure out who is worth listening to.</p>
