      <p>Luma, I will fright you again in saying that the questions you ask are the questions I asked to myself.</p>
      <p>1) I understand very well that the frontier between "standing out from the competition" and "being a bit silly/playful/cheeky" is really thin. The first mistake I made was to post images, because what we have here are just directions, and I never considered them as being definitive displays. That said, on the music reference, I ask a new question : why the hell did the NASA sent a song from Mars to the Earth ? Many answers are available to answer the question, but among them, one seems very clear to me : music is "human only". But the circle is not just a record, it also recalls the Voyager Golden Record <a href="http://en.wikipedia.org" title="Voyager_Golden_Record" class="freelink freelink-external freelink-external">wiki</a></p>
      <p>As a symbol, Voyager Program is the first program to illustrate the will of human beings to link  with the Universe. This said, we go to your second question</p>
      <p>2) The audience for the branding effort is people who do their job to touch a dream born with those space programs, and Voyager is their common legend. Happily, the circle symbol materializes the link between their "dream", their professional activity and their common specificity ( they are human beings ). During the briefing, the unperfect circle  immediately made them react positively because it also illustrates to them the "quantic world", where  human perception becomes like a trap. </p>
      <p>Question 3 is "the question of the moment" : I have to have a big time working specifically on this.</p>
      <p>And... I agree the circle has to be farther distorted !</p>
