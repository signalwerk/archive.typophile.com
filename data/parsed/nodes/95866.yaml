    date: 2012-08-29T10:56:00
    votes: null
    html: <p>I totally agree with you, I would like to return to the idea stage but I made the mistake to show some boards and this one got the definitive attention of my client. The "we rock" thing is unhappily already in their name, and they decided it intentionally... But I also think nothing has to be rigid at the moment, so I will follow your suggestion and try something else. By the way, they also liked very much other elements I showed us... So I have to take that in count. May I show you what comes after your suggestions ?</p>
  - id: 520423
    user_id: 65389
    user_name: Luma Vine
