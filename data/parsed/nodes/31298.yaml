    html: |-
      <p>They indicate that the font has stored native hinting. </p>
      <p>In principle, it's possible to generate PS and TT from the same source. However, sometimes it's useful to save a separate .vfb, convert outlines to TT, convert hints to instructions (both can be done using Tools / Action Set), and then using the TrueType Hinting tool, review the screen appearance of the font. </p>
      <p>A.</p>
