    html: |-
      <p>You need to set the correct path direction separately, after converting to TT outlines but before converting hints to instructions. Indeed, the three steps: </p>
      <p>1. Outline to TT<br>
      2. Path direction<br>
      3. Hints to instructions</p>
      <p>are necessary. In addition, you may want to expand kerning if you defined class kerning. Note that OpenType TT (.ttf) fonts can use old-style "kern" table kening as well as new-style OpenType GPOS "kern" feature kerning. OpenType PS (.otf) fonts can officially only use the latter (although it is possible to put the former in as well) and Type 1 fonts can only use the former. </p>
      <p>There are some implications involving kerning in OpenType TT (.ttf) fonts such as that some applications will only see the old-style kerning and some will only see the new-style kerning. If your kerning table is really extensive, you may want to generate your "kern" feature explicitly (using the OpenType panel), then expand kerning using Kerning Assistance while subsetting it to a specific codepage. In Kerning export options, you'd need to allow both types of kerning to be included. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
