  html: |-
    <p>Hi all,</p>
    <p>What does it mean when there is a blue icon in the bottom right of the glyphs windows ?</p>
    <p>I have them cos I have a vfb. file that I'm using to generate opentype fonts both PS and TT flavours. The blue icons appear if I generate the TT opentype font and then open that font file with Fontlab.</p>
    <p>Is it possible to generate TT fonts with the same vfb I'm using to generate the PS font, or do I have to do something to the vfb to make it generate TT opentype fonts.</p>
    <p>c.</p>
