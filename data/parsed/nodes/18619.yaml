      <p>Well, I was inspired to make roman sans &amp; italic out of straight lines after seeing the Crouwel / Foundry Gridnik, Emigre's Journal and Storm's Preissig Antikva.  However, mine is optically constructed rather than strictly geometrically. I am assuming that at 'text' sizes that it will lose the sharpness. Here are a couple of working screenshots, since you asked so nicely!</p>
      <p>—K</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Victor.png"></div><p></p>
