      <p>Cowboy: Yes, I did see that. I am quite aware of the M-formula, and I think it has great merit. The whole concept is still gestating in my swede, I'm waiting for it to turn up in a design one day! </p>
      <p>George: Cheers! The italic was originally totally upright, but had to leave that as the caps wouldn't play nicely. Perhaps for display…</p>
      <p>I'll keep y'all updated, still have a few bits 'n' bobs to sort out still!</p>
