      <p>EULAs are rarely comprehensive. Actually, never.<br>
      And quite often they contain despotic clauses best ignored.</p>
      <p>My own view is generally that if a modified font will not leave the hard<br>
      drive(s) of a party that has properly paid for the original, it's all good.</p>
      <p>hhp</p>
