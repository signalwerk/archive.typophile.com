    html: |-
      <p>This is corporate ego. The company is huge and THEY have Heldustry for several years as a corporate font. The design agency that sold them the ID explained that Heldustry had something special compared to Helvetica… Now they believe it and would like to have the condensed version. And as money can buy anything here I am ready to make the condensed version. I tried to explain that Helvetica would be a good alternative as a condensed version but they prefer Heldustry. Now, I will not complain, as for once, a client believe in type design as a corporate tool :)</p>
      <p>I contacted Monotype but am not sure they are the one who own the copyrights. Fontshop says it is a creative alliance font &gt; Monotype. But no answer until now.</p>
