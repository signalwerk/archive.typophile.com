      <p>This paragraph of the URW licence prohibits you from adapting the software:</p>
      <p>"You agree not to modify, adapt, translate, rent, lease, lend, resell, distribute, produce, reverse engineer, decompile, disassemble, redigitize or create derivative works or typefaces based on the URW++ Software or the typefaces created electronically or in hard copy form as a result of the use of the URW++ Software."</p>
      <p>But why do you need to adapt Heldustry?<br>
      Heldustry is "square Helvetica", and Helvetica Condensed is square, why not use it?</p>
      <p>If you consider the Light/Regular Helvetica Condensed to be too rounded, then use Akzidenz Grotesk Condensed.</p>
