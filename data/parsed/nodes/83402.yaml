    <p>Hello,</p>
    <p>I am working for a company that is currently using Hedustry as a corporate font for all its online and print communication.<br>
    We are planning on developping a condensed version of the Heldustry. But first I would like to know how I have to proceed.<br>
    The company already have several licences to use the Heldustry font.<br>
    I wonder if I am allowed to design for them the condensed version of Heldustry. I check the agreements of the font but there is nothing about that kind of case in it. The condensed version is aimed to be used as a corporate font by this company and only by this company.<br>
    There is no intention of selling the condensed font to third parts.<br>
    So the question is I am allowed to design the condensed version of the type without any copyright infringements ?</p>
