      <p>Phil Martin died in 2005, so the type design of Heldustry is not in the public domain.</p>
      <p>TypeSpectra was a company own by Phil Martin. How is it since 2005?</p>
      <p>Has URW a licence to make profit of the digitalized version of TypeSpectra fonts?</p>
      <p>You can always say that you've TRIED to contact the copyright owners... but I suppose you know the story of the sword of Damocles...</p>
      <p>But, I'm not sure really sure that URW knows exactly how things actually stand about Heldustry...</p>
