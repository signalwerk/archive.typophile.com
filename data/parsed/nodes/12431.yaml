  html: |-
    <p>i have 252 fontlab files that i need to publish, each to two formats: mac truetype, and pc truetype.</p>
    <p>that's a lot of drop down menus and dialog boxes to navigate.</p>
    <p>does anyone know of a python script or other similar solution that would allow me to designate the output format (in this case, mac tt and pc tt), the source folder, and the output folder, and press "play"?</p>
    <p>if there is no current solution for this, can anyone recommend a python/apple script guru who might be interested in developing the script?</p>
    <p>i'm on mac os 10.4 with fontlab 4.6.</p>
    <p>eagerly awaiting fontlab 5.0 too.</p>
    <p>-tyler</p>
    <p>ah, just got word from adam via the fontlab network that the transform tool covers this functionality within fontlab.</p>
    <p>thanks adam!</p>
