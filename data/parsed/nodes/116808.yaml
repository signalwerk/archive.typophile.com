    html: |-
      <p>Berthold Garamond. But the italic is a little too dark. Today I’d rather prefer Adobe Garamond or Garamond Premier (because of the optical sizes). Amongst German typographers, Sabon was long considered as the ‘better German Garamond’. Probably because Tschichold touched it with his aura. I never got this, because even in the days of phototypesetting neither Stempel, nor Linotype or Monotype cared to restore the italic. It had always been far too wide in order to fit it on the same widths as the roman due to Linotype’s duplex matrices. Even today one can easily pee through the holes on the lines as caused by the ‘o’ being far too wide. So in the end, maybe Sabon Next is now the better ‘European’ Garamond?</p>
      <p>P.S.<br>
      I think Sabon Next deserves a Sans companion, based on Tschicholds Uhertype and/or the sketches he once made for Stempel.</p>
    html_clean: |-
