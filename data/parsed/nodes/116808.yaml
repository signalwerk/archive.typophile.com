      <p>They, of course, didn't have the magical aura of Jan Tschichold, although while Press Roman and Theme, for example, were just copies of Times Roman and Optima, it did have an officially licensed Univers, adjusted for the Selectric Composer by Adrian Fruitger himself IIRC.</p>
