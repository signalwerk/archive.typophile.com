    html: |-
      <p>Sabon was an interesting attempt to provide a common typeface that could be used on Monotype and Linotype machines. Of course, in being both unitized and having the same widths for different weights, Sabon was similar to all the typefaces designed specifically to be used with the IBM Selectric Composer.</p>
      <p>They, of course, didn't have the magical aura of Jan Tschichold, although while Press Roman and Theme, for example, were just copies of Times Roman and Optima, it did have an officially licensed Univers, adjusted for the Selectric Composer by Adrian Fruitger himself IIRC.</p>
      <p>Journal Roman was IBM's take on Garamond.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/JournalRoman_Italic_3732.jpg"></div><p></p>
      <p>Looking at the word "of" in the italic, it apparently is considerably worse than Sabon in this particular respect.</p>
      <p>Actually, the problem with Journal Roman is visible in any word containg an o. In Sabon, on the other hand, the o is simply made large and round, to fill the space assigned to it, instead of being only partly widened and left to have extra space around it, in order to somewhat resemble the narrow o of the real Garamond italic, as was done in Journal Roman.</p>
