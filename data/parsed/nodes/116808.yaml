      <p>Yes. The italic of Sabon Next does not have a round o at all. It doesn't look like the classical Garamond italic either, though.</p>
      <p><cite>I never got this, because even in the days of phototypesetting neither Stempel, nor Linotype or Monotype cared to restore the italic.</cite></p>
      <p>The book <em>Anatomy of a Typeface</em>, on page 156, shows the italic as well as the roman in an image of the Monophoto version of Sabon.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sabon_4768.jpg"></div><p></p>
