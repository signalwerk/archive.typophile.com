    html: "<p>Try contacting the folks at House Industries. They purchased the Photo Lettering film fonts collection. From their site: <br> <br>HOUSE PURCHASES PHOTO-LETTERING COLLECTION <br> <br>House Industries has purchased one of the largest collections of film based display typography from New York-based Photo-Lettering, Inc. Photo-Lettering was a mainstay of the advertising and design industry in New York City from 1938 into the early 1990s. PLINC, as it was affectionately known to countless art directors, was one of the earliest and most successful type houses to utilize photo technology in the production of commercial typography and lettering. It employed such design luminaries as Ed Benguiat and sold type drawn by the likes of Herb Lubalin, Milton Glaser and Seymour Chwast. The company is best know by most of today's graphic designers for its ubiquitous type catalogs it produced. <br> <br><a href=\"http://houseind.com/house.php?page=news\" target=\"_blank\">http://houseind.com/house.php?page=news</a></p>"
    html_clean: "<p>Try contacting the folks at House Industries. They purchased the Photo Lettering film fonts collection. From their site: <br> <br>HOUSE PURCHASES PHOTO-LETTERING COLLECTION <br> <br>House Industries has purchased one of the largest collections of film based display typography from New York-based Photo-Lettering, Inc. Photo-Lettering was a mainstay of the advertising and design industry in New York City from 1938 into the early 1990s. PLINC, as it was affectionately known to countless art directors, was one of the earliest and most successful type houses to utilize photo technology in the production of commercial typography and lettering. It employed such design luminaries as Ed Benguiat and sold type drawn by the likes of Herb Lubalin, Milton Glaser and Seymour Chwast. The company is best know by most of today's graphic designers for its ubiquitous type catalogs it produced. <br> <br><a href=\"http://houseind.com/house.php?page=news\" target=\"_blank\" class=\"link-external\">http://houseind.com/house.php?page=news</a></p>"
