    html: "<p>If you're fortunate enough to be hanging about London next week, Rich Roat of House Industries is giving a presentation at Typotechnica 2005 entitled <b>Photo-Lettering: Back To The Future</b>. <br> <br>More information is available on the Linotype site. <br> <br><a href=\"http://www.linotype.com/8-2358-8/linotypetypotechnica2005.html\" target=\"_blank\">http://www.linotype.com/8-2358-8/linotypetypotechnica2005.html</a></p>"
