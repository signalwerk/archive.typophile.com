    html: '<p>Did anybody happen to notice this tidbit? <br><br><i>Photo-Lettering: Back to the Future <br>House Industries purchased the what remained of the Photo-Lettering display type collection in 2003. They have since partnered with dutch type master and visionary Erik van Blokland and proliﬁc designer Christian Schwartz to revive the collection and create a new portal for vending the timeless classics as well as new creations. Rich Roat describes how the <span class="caps">PLINC</span> partnership will combine the timeless creativity of the original <span class="caps">PLINC</span> contributing artists with a modern technology to make some of the more unique elements of the collection  <br>available&nbsp;again.</i></p>'
