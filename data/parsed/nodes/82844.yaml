    <p>I'm trying to identify the typeface in this advertisement for a Boston-based banjo company, from the late nineteenth century:</p>
    <p><a href="http://www.banjoonmyknee.com/Pics/Scanner/F&amp;C%20Trade.jpg" title="http://www.banjoonmyknee.com/Pics/Scanner/F&amp;C%20Trade.jpg">http://www.banjoonmyknee.com/Pics/Scanner/F&amp;C%20Trade.jpg</a></p>
    <p>(Also attached as banjofont.jpg.)</p>
    <p>Does anyone recognize it?</p>
    <p>Thanks so much,<br>
    David</p>
