    <p>Hello everyone- A peecee user invading here with a Mac software question...</p>
    <p>I am trying to modify a font (substitute two characters) and I am curious as to how to go about doing this in the most efficient manner possible... The font in question is a font that was created in /for Mac. I’m trying to alter this font for a professor whose collegues and herself only use Macs in order to be on the same page document wise as this is a differently charactered alphabet. </p>
    <p>Reading up on the Mac OS it looks like the Fontbook feature “automate” enables the /scanning in/ of fonts... is this true, does it work the way it sounds? (Scan in and assign each character to the map?)</p>
    <p>Any help you can offer is greatly appreciated, don’t assume that I know anything overly complicated as I’m a complete noob as far as font manipulation goes. The kicker is as well that I can’t even open the font on the PC to attempt a unicode version or some other version that’ll work with their Macs...</p>
    <p>Therese</p>
