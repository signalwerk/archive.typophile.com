    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Werner Schneider</strong></p>
    <p>German, born 19</p>
    <p>Retired professor of typography and calligraphy at the <a href="/wiki/Fachhochschule%20Wiesbaden" class="freelinking" rel="nofollow">Fachhochschule Wiesbaden</a>. Schneider has designed several typefaces, including <a href="/wiki/Vialog" class="freelinking" rel="nofollow">Vialog</a> for <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a>.</p>
    <p>Schneider is regarded as one of Germany's greatest living calligraphers, along with <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> and <a href="/wiki/Gottfried%20Pott" class="freelinking" rel="nofollow">Gottfried Pott</a>.</p>
