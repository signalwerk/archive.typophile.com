    html: |-
      <p>@sii </p>
      <p>Its specifically about people doing free work for non-profits &amp; what inspires them to contribute. Any ideas? </p>
      <p>More and more, I'm finding out in my research that for many, the work is largely self-motivated. This is not necessarily a bad thing because, as @altaira noted, many young designers rely upon this kind of work as a portfolio builder. However, in the project I'm proposing... a group of designers would collaborate on a piece of design work meaning that no singular person really has ownership or creative control over it. </p>
      <p>I'm trying to figure out if designers are willing to contribute when the personal gain factor is altered significantly—one stands to gain a really unique and collaborative social experience, rather than the opportunity to have full creative control over a portfolio piece.</p>
