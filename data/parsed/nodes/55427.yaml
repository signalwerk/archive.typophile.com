    html: <p>I did some work for a gallery associated with the school I graduated from. They opened in the museum district where my wife worked. The museums had a tendency to hire from another school that was in the same city. I thought it might help graduates who wanted placement. I was/am also transitioning into more book design and thought it might be an opportunity. My motivations were mixed.</p>
