      <p>I've done pro-bono work for a non-profit association/organization I'm a member of. Contributing in "my way", and thereby hopefully enhancing the perceived value of their publications/materials, does feel like a good thing to do; and I also really enjoy working with them. But I'm an up-starting self-employed designer, and I'd be lying if I didn't say a large part of my motivation to donate my time and work has been to get some cool work done where I'd have more "deciding power" / artistic licence than in a usual job, and thus get some references under my belt (and into my portfolio).</p>
      <p>I interned as an art director at a smallish ad agency a few years ago and they seemed to handle this in a similar way, FWIW: The few "free" jobs for friends or benevolent organizations were valued as occasions to really let loose and do some creative work without the pressures of a budget and most of all a nagging client. When you do pro-bono, clients just tend to be grateful.</p>
