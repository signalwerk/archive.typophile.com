    html: |-
      <p>&gt; I don’t believe in the geometric construction of letters.</p>
      <p>Me neither*. But I extend that to any arbitrary construction,<br>
      including the "grid" imposed by chirography; for example<br>
      the bowls of b/d/p/q being consistent in my view imposes an<br>
      arbitrary, hence dysfunctional, constraint. Note that just like<br>
      geometric forms need compensation to become typographic,<br>
      so do any chirographic forms (the "Z" is an obvious example).</p>
      <p>* I like calling Futura "Fartura".  :-)</p>
      <p>hhp</p>
