    html: |-
      <p>I don’t believe in the geometric construction of letters. Neither lowercase, nor uppercase.</p>
      <p>If lowercase gets “constructed”, Futura or – worse – Avant Garde is the Result. This path has never been overly promising.</p>
      <p>Roma is an interesting take, though I’d rather put it in the *Incised* category rather than in the sans, just like Robert Slimbach’s recent release.<br>
      However, the R of Roma disturbs me, the lowercase of it is an enigma to me.<br>
      B, E, R of Metro are not at all trajanesque to my eyes.</p>
      <p>Another worthwhile recent sans is <a class="freelinking external" href="http://www.myfonts.com/fonts/tipo-pepel/trajana-sans/regular/glyphs.html" rel="nofollow">Trajana Sans</a>. But for me, it’s again the R which proves to be tricky.</p>
