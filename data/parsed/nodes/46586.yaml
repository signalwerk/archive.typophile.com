      <p>How do you envision using the Trajan and the sans serif? Trajan is all caps, so I'm guessing it's not for body copy. Maybe you want the sans serif for the body copy?</p>
      <p>Take a look at <a href="http://www.myfonts.com/fonts/fontfont/ff-scala-sans/">Scala Sans</a> or <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/thesans/sans-.html">TheSans</a> to see if they're something like what you want, and also check out fonts like <a href="http://www.linotype.com/56036/ambigue-family.html">Ambigue</a> and <a href="http://www.myfonts.com/fonts/letraset/charlotte-sans/">Charlotte Sans</a>.</p>
