    <p>Hi guys,<br>
    It's my first post! Congratulations, this forum it's so usefull and interesting.<br>
    Here's my question:<br>
    I'm working on an art catalog I was wondering wich kind of sans-serif font type could match with Trajan font.<br>
    The artist use trajan in his work and I would like to use it too in the book.</p>
    <p>Looking forward your suggestion</p>
    <p>Klaus</p>
