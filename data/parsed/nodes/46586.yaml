      <p>The lower case of all the types mentioned lacks the basic geometric construction of Trajan.<br>
      Of course, unless one goes down the Futura path, a nod must be made to the brush which underlies the Roman lapidary method, but that’s all.<br>
      Dwiggins’s Metro strikes the right balance — its capitals are remarkably faithful to the Trajan forms, and its lower case is geometric with just a hint of chirographic ductus.</p>
