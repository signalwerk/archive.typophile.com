    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Text Figures</strong></p>
    <p>Also called lowercase figures, or oldstyle figures, these number forms are designed to be used in running text. Text figures feature numerals that come to the <a href="/wiki/x-height" class="freelinking" rel="nofollow">x-height</a>: 0,1,2; figures with <a href="/wiki/descender" class="freelinking" rel="nofollow">descenders</a>: 3,4,5,7,9; and <a href="/wiki/ascender" class="freelinking" rel="nofollow">ascending</a> figures: 6, 8. Some varations of text figures may not fit this same scheme, but this is the norm.</p>
    <p>See also <a href="/wiki/Lining%20Figures" class="freelinking" rel="nofollow">Lining Figures</a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://www.typophile.com/node/7718" rel="nofollow">What Sans Serifs Have Old Style Figures?</a><br>
    <a href="http://typophile.com/node/36460" rel="nofollow">Lower Case Numbers in San Serif, Anyone?</a><br>
    <a href="http://typophile.com/node/54418" rel="nofollow">Old Style Figures (OSF) Height</a></p>
    <p>Links:<br>
    <a href="http://www.fonts.com/AboutFonts/Articles/fyti/OldstyleFigs.htm" rel="nofollow">FYTI: Oldstyle Figures</a></p>
