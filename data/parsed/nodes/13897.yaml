    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Text&nbsp;Figures</strong></p>
    <p>Also called lowercase figures, or oldstyle figures, these number forms are designed to be used in running text. Text figures feature numerals that come to the <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a>: 0,1,2; figures with <a href="/node/12051" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">descenders</a>: 3,4,5,7,9; and <a href="/node/12043" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ascending</a> figures: 6, 8. Some varations of text figures may not fit this same scheme, but this is the&nbsp;norm.</p>
    <p>See also <a href="/node/13915" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lining Figures</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://www.typophile.com/node/7718">What Sans Serifs Have Old Style Figures?</a><br><a href="http://typophile.com/node/36460">Lower Case Numbers in San Serif, Anyone?</a><br><a href="http://typophile.com/node/54418">Old Style Figures (<span class="caps">OSF</span>)&nbsp;Height</a></p>
    <p>Links:<br><a href="http://www.fonts.com/AboutFonts/Articles/fyti/OldstyleFigs.htm"><span class="caps">FYTI</span>: Oldstyle&nbsp;Figures</a></p>
