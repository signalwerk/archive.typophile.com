    <p>Diacritics positioning problem</p>
    <p>Hi,</p>
    <p>I am relatively new to fontlab or any similar program. I have a problem with Myriad Pro font. I am trying to move the position of diacritics with anchor marks. In font lab everything works and in the preview box everything seems to be ok. But if I export font (generate font) then nothing changes (the diacritical marks position is the same as before). </p>
    <p>As I have to be based on a certain custom keyboard I am using a certain diacritic mark (combining acute accent U+0301). So as Myriad Pro doesn’t have this character so I created it based on a similar character.</p>
    <p>I also moved these anchor points in Arial and saved the changed font but it still didn’t work.</p>
    <p>I have tried these changes in indesign and also in pages. To create this character I am using dead key+letter (dead key=U+0301).</p>
    <p>Thank you so much for your help!<br>
    Carmen</p>
