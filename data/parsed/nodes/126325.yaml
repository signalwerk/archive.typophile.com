    html: |-
      <p>My colleague Alex Petrov at FontLab wrote something but it hasn't posted:<br>
      Hi,<br>
      As I understood  you created "virtual" composites using anchors and new u+0301 mark but you did not expand these composites into real glyphs with components: bacute, dacute etc. Right? So when you type "dead key" + "b" you get your u+0301 mark at the same "zero" position where it was drawn. Anchors do nor work in this case because they are not saved or exported into the font. There are two possible ways to go further:<br>
      1. you use your anchors to create all possible composites: bacute, dacute, etc. so that they explicitly exist in the font like aacute, eacute, oacute. In this case you will rather need some OpenType feature (such as 'ccmp') to substitute "b" + "u0301" with "bacute" etc.<br>
      2. or you can forget about anchors and simply move contour ' in your u+0301 glyph to where you need it. Surely in this case it will appear at the same position over every subsequent character.</p>
      <p>FontLab VI will support "mark" and "mkmk" OpenType features (fonts such as Arial use them widely) so there will be more possibilities soon with FontLab.</p>
      <p>Regards,<br>
      Alex Petrov</p>
