    html: <p>Let me also add -- and I know this is totally unhelpful -- that I do sympathize with you, as I think it's an utterly ridiculous assignment. Better, I think, to have the assignment be more like what we do here everyday, i.e., taking a sample and identifying the type. Your assignment is the other way around, and I just don't see the value of it. It's kind of like a wild goose chase. <br> <br>That said, it's your assignment, and therefore it's your responsibility. If you can, however, choose a different instructor next time.</p>
