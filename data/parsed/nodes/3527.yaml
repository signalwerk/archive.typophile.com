    html: "<p>To help on one of your fonts to get you started is fine, I think, but really, this is your assignment, and I think you should do it yourself. I'm not going to be a completely wet blanket about it, though: I'll give you the link to <a href=\"http://www.brandsoftheworld.com/\">Brands of the World</a>, a site with thousands of worldwide company logos. Spend some time sifting through there, and I'm sure you'll find examples of the fonts you're looking for. <br> <br>This has been advice of the \"give Mikey a fish and he'll eat for a day, teach Mikey to fish and he'll eat for a lifetime\" variety. It's given with the utmost respect for the challenges you face as a student. <br> <br>Good luck!</p>"
