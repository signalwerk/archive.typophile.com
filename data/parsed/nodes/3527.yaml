    html: <p>I strongly agree with Chesh that it's not our job to do your homework, primarily because you don't learn anything except how to ask for help (sometimes not a bad thing to do either). <br> <br>If your assignment is to find logos (or advertisements?) that use  a certain list of typefaces, that is a bogus way to do it, but I'm not your instructor.  <br> <br>If the assignment is to identify 50 different typefaces used in ads, then you need a decent set of font samples (i.e. a good font book would be nice), and then start flipping through lots of magazines with plenty of advertising, like Fashion and Travel magazines. <br> <br>If you were a real font fanatic, like some of us, you would already have had a folder of ads ripped from magazines with font names written on them. <br> <br>Welcome to the wild world of Font Spotting! <br> <br></p>
