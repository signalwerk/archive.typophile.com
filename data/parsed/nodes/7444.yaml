    html: <p>it looks pretty good overall. i agree about the round dots. <br>they just don't seem natural. <br> <br>I think "y" is out of place. everything else has a smooth transition, <br>like the "b" &amp; "p" mentioned above, but "y" has that metaesque ink <br>trap thing where the two stems meet. <br>see <a href="http://www.typophile.com/forums/messages/83/5042.html?1044262013" target="_blank">http://www.typophile.com/forums/messages/83/5042.html?1044262013</a> <br>for what i'm talking about. <br> <br>"s" and "c" seem to be either leaning or shifting off the baseline. <br> <br>it may be just my monitor, but the bowls of b, d, g, p, and q <br>seem to be flexing to the inside of the glyph.</p>
