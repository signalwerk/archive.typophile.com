    <p>Dear Typophiles,</p>
    <p>We have been working on a logotype for a luxury eyelash bar in Geneva. The clients absolutely love the solution so now it is a question of finalizing. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logotype.png "></div><br>
    <a class="freelinking external" href="http://typophile.com/files/largeview.png" rel="nofollow">large view</a><p></p>
    <p>Regarding critique we are currently debating about how the space between the "B" and the "u" work; the distance or separation between the "i" and the "C" and also the centralization of the the word Geneve. </p>
    <p>Attached can also be found an image to display how the dot of the "i" will be used in packaging (yet to be finalized) as the sealing sticker.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/context.png "></div><p></p>
    <p>Any critique or feedback would be most appreciated.</p>
    <p>+</p>
