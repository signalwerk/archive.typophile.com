      <p>Agree with @hrant. I would also do something about /C/ and that would probably be changing it to make it more in sync with /B/.</p>
      <p>There's another thing here as well. And that's the last /l/ letter. It terminates with a too much upward stroke. Either correct /B/ or correct /l/ (which will likely bring the need to change others as well). I'd go with the latter. This will also bring the needed change to /C/ that I talked about above.</p>
      <p>Otherwise it looks like an everyday fashion hi-brand logo. No revolution here.</p>
