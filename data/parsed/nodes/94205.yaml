    html: |-
      <p>To my eye this looks like it’s really wanting to be classy, but doesn’t <em>quite</em> succeed yet. So, great if you can do another round of revisions.</p>
      <p>In addition to what has been said:<br>
      Why is the “u” so very wide? It seems to break the strong rythm of the lowercase; does it contribute anything that’s needed?</p>
      <p>And the shape of the “B” does not work for this eye. Looks more like an odd sort of eszett or something. The curves feel a bit contrived, with the connected join but large belly and open bottom… I’d also try alternate structures both top-left and bottom-left.</p>
      <p>Also: this might be a rendering issue in the image you posted but the GENEVE might benefit from some kerning attention and perhaps a bit of positive tracking.<br>
      More importantly though I think the typeface in “Geneve” is not an ideal match. It looks a little cheap and generic, plus too open/humanist in conjunction with this script (compare curves of “G” and “C”). I’d maybe try something more geometric (think Gotham or such) or something in the direction of Sackers/Engravers Gothic. Or some classy grotesque (Akzidenz?).<br>
      Bonus if you can get the stroke thickness to match the thin strokes of the script.</p>
    html_clean: |-
