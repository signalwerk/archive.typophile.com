    html: |-
      <p>I remember all of these old guys working at the sign shops that could take “One Shot” paint and paint the most fantastic letters. Those vinyl plotters put them out of business. </p>
      <p>I also remember the first demonstration I saw of digital photography around 1989. The camera was a huge video camera. It was plugged into a big computer and monitor. The photo  took about five minutes as the red, green and blue channels each panned through their individual scans. Then it took another five minutes or so for the CPU to process the image. Needless to say still shots were all that could be taken. I think that camera cost something like $30,000. The little pocket cameras you can buy for a couple of hundred dollars today take a picture ten times better and a thousand times faster. </p>
      <p>I won’t forget the reaction when I told the photo labs that they’d better start establishing a digital base. They completely discounted it saying, “there is no way a digital image can ever compete against continuous tone film photography.”</p>
