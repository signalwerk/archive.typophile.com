      <p>Well, essentially, I really like computers, too—all the Macintoshes I’ve had, particularly, as they’ve enabled me to make a whole slew of books. But ... at various times I’ve learned to hate and despise software, tho’ not in a long time.</p>
      <p>I once worked all night on a single-article issue of a science journal in order to FedEx it to the publisher for a rush get-out issue. Somewhere right around daybreak I did my last Save and PageMaker, bless its pointed little head, sent me a Bad Record Index error, would not save, wiped the article from my hard drive, and rendered my copies of the article useless the same way.</p>
      <p>I was about to put my fist thru the computer’s screen—this was in the CRT monitor days until I thought better of it.</p>
    html_clean: |-
