      <p>Computers are the most loyal, devoted pieces of machinery ever invented. They only do exactly what they are instructed to do. The programmers that gave crappy instructions are where to place the blame. AT&amp;T just took over Bellsouth, the company that provides my service. Somehow, without letting anyone know, they switched email servers. That wasted a few dozen hours of my time troubleshooting what was wrong with my machine before I found out, thanks to the internet, that it wasn’t my machine. It was them. The hilarious part is that after a few weeks of asking them what they did that caused the problem, they sent back a response with very basic instructions for how to send an email — something I have been doing quite successfully for a couple of decades before they came along. The problem still isn’t fixed. But at least I can send an email with an attachment again.</p>
      <p>Paul if you really want to give it up though, I think I have some rubylith somewhere around here I’ll give you a deal on — xactos, triangles, blue leads, and some other dust collectors too.</p>
