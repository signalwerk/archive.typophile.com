      <p>speaking of “the old days”...</p>
      <p>I was hand cutting vynil and Rubylith films for a screen printing company in about ’82 or ’83, when I saw the first digital plotter for cutting vynil and Rubylith. It was so slow and could only cut arcs in something like 3.6 degree increments... I thought - “These things will NEVER replace a skilled guy like myself” :-)</p>
