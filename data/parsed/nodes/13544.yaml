    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Font</strong></p>
    <p>A font ont is a certain physical form in which a typeface with a certain character set is released by a certain vendor under a certain trade name — for example a set of metal type sorts, a digital font in the Type 1 format, a digital font in the OpenType <span class="caps">PS</span> format etc. Thus, a font can be said to be one weight, width, and style of a <a href="/node/16843" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typeface</a>. Times Roman by Linotype in Type 1 format is one font, Times Cyrillic Regular by Linotype in Type 1 format is another font, Times Roman Std by Adobe in OpenType format is another font, Dutch 801 Roman by Bitstream in Type 1 format is another font — all of the same typeface Times Roman.<br>
    Before scalable type, there was little distinction between the terms font, typeface, and <a href="/node/16845" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">family</a>. Font and typeface still tend to be used interchangeably, although the term typeface is usually more&nbsp;correct.</p>
    <p>In television production, “font” refers to information, such as a location or a person’s name, electronically superimposed on the screen (hence the more common “super”). Also used as a verb: “How should we font this guy?” “You supered him ‘convicted criminal;’ he’s actually the <span class="caps">DA</span>.”</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/39843">Type Terminology: Systems? Suites? Super Families?</a><br><a href="http://typophile.com/node/14701">Er… what is a font?</a><br><a href="http://blogs.adobe.com/typblography/2005/12/quality_in_type.html">Tom Phinney explains the difference between a typeface and a&nbsp;font</a></p>
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Publications</a>&nbsp;:&nbsp;Font</strong></p>
    <p><em><a href="http://www.fontshop.com/features/fontmag/">Font</a></em> is a <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> publication serving as both an editorial magazine and type specimen&nbsp;catalog.</p>
    <p>Issues 001-003 were designed by <a href="/node/12437" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MvB Design</a> (<a href="/node/13398" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark van Bronkhorst</a> and <a href="/node/29093" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alan Greene</a>) with written contributions from FontShop founder <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>, Peter Hall and Margaret&nbsp;Richardson.</p>
    <p>Issue 004 was art directed by <a href="/node/12037" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joseph Pemberton</a> from <a href="/node/12021" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Punchcut</a> and edited by <a href="/node/14029" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tamye Riggs</a> and <a href="/node/12036" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephen Coles</a> from FontShop San Francisco. Guest designers included cover art from the foundry <a href="/node/13509" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Underware</a> and a feature by designer <a href="/node/40525" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Marian Bantjes</a>. Contributing writers include <a href="/node/add/wiki?edit%5Btitle%5D=Margaret%20Richardson" title="Create node &quot;Margaret Richardson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Margaret Richardson</a> and <a href="/node/add/wiki?edit%5Btitle%5D=John%20D%20Berry" title="Create node &quot;John D Berry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">John D Berry</a>.</p>
    <p>Related links: <a href="http://typographi.com/000166.php" title="Typographica">Review of <em>font&nbsp;002</em></a></p>
