    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Font</strong></p>
    <p>A font ont is a certain physical form in which a typeface with a certain character set is released by a certain vendor under a certain trade name — for example a set of metal type sorts, a digital font in the Type 1 format, a digital font in the OpenType PS format etc. Thus, a font can be said to be one weight, width, and style of a <a href="/wiki/typeface" class="freelinking" rel="nofollow">typeface</a>. Times Roman by Linotype in Type 1 format is one font, Times Cyrillic Regular by Linotype in Type 1 format is another font, Times Roman Std by Adobe in OpenType format is another font, Dutch 801 Roman by Bitstream in Type 1 format is another font — all of the same typeface Times Roman.<br>
    Before scalable type, there was little distinction between the terms font, typeface, and <a href="/wiki/family" class="freelinking" rel="nofollow">family</a>. Font and typeface still tend to be used interchangeably, although the term typeface is usually more correct.</p>
    <p>In television production, "font" refers to information, such as a location or a person's name, electronically superimposed on the screen (hence the more common "super"). Also used as a verb: "How should we font this guy?" "You supered him 'convicted criminal;' he's actually the DA."</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/39843" rel="nofollow">Type Terminology: Systems? Suites? Super Families?</a><br>
    <a href="http://typophile.com/node/14701" rel="nofollow">Er... what is a font?</a><br>
    <a href="http://blogs.adobe.com/typblography/2005/12/quality_in_type.html" rel="nofollow">Tom Phinney explains the difference between a typeface and a font</a></p>
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : Font</strong></p>
    <p><em><a href="http://www.fontshop.com/features/fontmag/" rel="nofollow">Font</a></em> is a <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> publication serving as both an editorial magazine and type specimen catalog.</p>
    <p>Issues 001-003 were designed by <a href="/wiki/MvB%20Design" class="freelinking" rel="nofollow">MvB Design</a> (<a href="/wiki/Mark%20van%20Bronkhorst" class="freelinking" rel="nofollow">Mark van Bronkhorst</a> and <a href="/wiki/Alan%20Greene" class="freelinking" rel="nofollow">Alan Greene</a>) with written contributions from FontShop founder <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, Peter Hall and Margaret Richardson.</p>
    <p>Issue 004 was art directed by <a href="/wiki/Joseph%20Pemberton" class="freelinking" rel="nofollow">Joseph Pemberton</a> from <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> and edited by <a href="/wiki/Tamye%20Riggs" class="freelinking" rel="nofollow">Tamye Riggs</a> and <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a> from FontShop San Francisco. Guest designers included cover art from the foundry <a href="/wiki/Underware" class="freelinking" rel="nofollow">Underware</a> and a feature by designer <a href="/wiki/Marian%20Bantjes" class="freelinking" rel="nofollow">Marian Bantjes</a>. Contributing writers include <a href="/wiki/Margaret%20Richardson" class="freelinking" rel="nofollow">Margaret Richardson</a> and <a href="/wiki/John%20D%20Berry" class="freelinking" rel="nofollow">John D Berry</a>.</p>
    <p>Related links: <a href="http://typographi.com/000166.php" title="Typographica" rel="nofollow">Review of <em>font 002</em></a></p>
