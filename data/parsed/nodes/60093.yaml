    html: |-
      <p>I'm using Pages '09 v 4.0.2(751).</p>
      <p>I can't seem to find a button, but you can do a really annoying work around.</p>
      <p>1. Highlight the letter<br>
      2. Increase the size (this will automatically increase the leading too, but we'll get to that<br>
      3. In the Inspector, click on the T (text inspector)<br>
      4. In the Text portion of the inspector, click the Text button.<br>
      5. Under "Spacing" one of the options will be "Line." Under the field where you type in line spacing you should see the word "Single" with two tiny grey arrows to it's right. Click on the word "Single" and a drop down will appear.<br>
      6. Select "Exactly."<br>
      7. Highlight ALL the text, not just the drop cap<br>
      8. Type in an exact point size for your leading.<br>
      9. Highlight your working drop cap<br>
      10. In the menu under Format&gt;Font&gt;Baseline you'll see "Lower" as an option. Sadly, I don't know a keyboard shortcut for this so you'll hace to do a lot of clicking and dragging.</p>
      <p>Hope this helps.</p>
