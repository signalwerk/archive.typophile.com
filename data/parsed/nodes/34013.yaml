    html: <p>What I meant by that is that language indeed constantly changes, but not always for the better... In Dutch at least I can foresee the language "dumbening" just in order to fit the next generations disability to use it correctly now. That way, less people will make mistakes, but if you'll look at the (d)evolution, you'll notice that the language will actually have to "stoop down" to the overall lower level of future generations. The language has to give up a lot of its rules and therefor becomes less "rich". In my view, it's proof that the weaker one wins the battle.</p>
