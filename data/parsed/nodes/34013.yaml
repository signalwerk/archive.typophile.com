      <p>One of the difficulties of setting unusual characters is how to find the damn things in a massive OpenType glyph palette. Even before, it was a hassle to find the inch mark in the Symbol font. So little things like making the interrobang a Discretionary Ligature, and the inch mark a Stylistic Alternate of ", should help typographers. </p>
