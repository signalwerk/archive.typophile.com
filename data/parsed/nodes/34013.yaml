      <p>The only problem with the premise of exclamations and interrogatives as simply grammatical structures, is that punctuation is part of (written) language, and hence, living. Were they <em>only</em> to function to explain grammar, they would be redundant. Yes, they can do that, but they really do evoke inflection, tone or even subtext. Just like the unending sea of alternate spellings and neologisms, if that's not the intention or origin of punctuation, it is still the vox populi.</p>
      <p>The interrobang's problem is that either !? and ?! do the job well enough for regular Joe (where it needs to be clearly more ? or!, they'll just drop the weaker), and it is just not elegant enough for the letterati. Designers far more talented than I make funky underdotted Ps when trying to cram the old i-bang into a text face.</p>
      <p>After my bias for the snark, I have to say I love the "wtf" lig. The grace of the form clashes deliciously with the meaning.</p>
