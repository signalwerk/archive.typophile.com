    <p>Many people would argue that we should just simply type "!?" or "?!" However, then the question arises: Is this statement more of a question or an exclamation? The <a href="/node/13045" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Interrobang</a> obliterates the need to distinguish between the two.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Yeswecan.jpg" width="200" height="285" alt="">
