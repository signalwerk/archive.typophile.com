      <p>The notion that that punctuation is grammatical by nature and that the "scoring" of the text is a second, subservient affair is the part where I am suspicious. Nick posed a question I almost asked. The mass acceptance of the exclamation mark as a valid punctuation seems to fly in the face of the grammar-first approach, if it only exists to intone.</p>
      <p>Rhetorical and grammatical are absolutely different things. But I am not convinced that punctuation lives in one world (or belongs rightly to it), but not the other.I suspect that both sides of the brain must be satisfied to make a mark of punctuation sustainable. Is there other media anyone knows of to expand on these ideas? If anyone is looking for a thesis proposal, have fun with this.</p>
      <p>I've had the unpleasant task of listening to recordings of my own voice, particularly in variations of the same work, when preparing for live performance. There is a consistency to my own treatment of punctuation as a notation. There may be some improvisation, and the overall tempo is arbitrary, but within one piece a colon has a distinct affect unlike a semicolon, for example. I would even say that these, along with text variants and layout are the score to the words. Would you read and "feel" a letter the same way with indented, inline and left block paragraphs? Context and commentary could provide all the needed cues to any exclamations or questions,but would it be the same?</p>
