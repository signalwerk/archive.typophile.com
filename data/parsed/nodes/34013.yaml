      <p>It is commonly assumed that evolution progresses towards a goal. or that it has a positive future outcome and stumbles irregularly towards that. While Devo and Idiocracy were interesting entertainment, nature is much less interested in our higher selves that we are, and has no grand philosophical design for us to aspire to. So, as long as it works, things will continue to trend towards "dumbing down".</p>
      <p>Some of each generation will continue to fight to be interesting, quirky or special, with lessening degrees of success, but until humanity's environments trend towards isolated cultures again (if ever) life will be generally more homogeneous every day.</p>
      <p>My apologies to those who are bothered by how far off-topic this is. :)</p>
