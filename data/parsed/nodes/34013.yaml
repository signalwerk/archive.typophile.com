    html: |-
      <p><cite>HaleyFiege: However, then the question arises: Is this statement more of a question or an exclamation? The interrobang obliterates the need to distinguish between the two.</cite></p>
      <p>This is precisely the problem with the interrobang. The two need to be distinguished. It makes a difference whether you punctuate !? or ?! The two are not the same. </p>
      <p>The first (!?) is an exclamation that's being questioned, often indicating a sarcastic, sardonic, or self-deprecating tone. <em>"Typophile is going to start allowing animated flash avatars. Hurray!?"</em> </p>
      <p>The second order (?!) denotes a question that is being emphasized. <em>"Typophile is going to start allowing animated flash avatars. What the f***?!"</em></p>
      <p>By far the more common need is the latter (?!), but the design of the interrobang makes it look more like the former.</p>
      <p>Punctuation is intended to clarify meaning. The interrobang does just the opposite.</p>
      <p>Besides, it clots terribly in text settings.</p>
      <p>-- K.</p>
