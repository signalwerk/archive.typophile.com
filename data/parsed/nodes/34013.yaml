      <p>&gt; Rhetorical and grammatical are absolutely different things.<br>
      I agree these are 2 (very) different things, but it's always interesting when 2 worlds collide or blend. I think both (can) have an influence on each other, but as every linguistic issue, much of it lies in the hands of the user. I've never been much of a reader (comics aside), but I've always been fond of language &amp; as it happens I recently got back in touch with my old high school English &amp; Dutch teacher. We met last week &amp; spent over 6 hours discussing both the Dutch &amp; English language. It really struck me that even people with the appropriate academic background can still be baffled within their field of expertise. But isn't that what makes our languages interesting? To find your own way to express yourself within the grammar &amp; a whole bunch of extra unwritten rules? To bend and shape it within these bounderies to best fit your personality &amp; to see how other people do this?<br>
      Like I said in another post, I do even "break" the rules every now &amp; then when I find it more suitable for my expression. But the fact that there's so much aspects to language makes that even this can be seen as merely bending the rules. A perfect example for this is my use of accents for emphasis; I'm breaking the rule of always having to use the accent aigu, but on the other hand I have the phonetic rules to back me up on this &amp; give me a valid excuse to do so. Artistic freedom has now -more than ever- become a big part in the use of our language (what with the internet &amp; cell phones and all) &amp; it's just pure fun to play with it.<br>
      Another thing we (my ex teacher and I) talked about is that -probably due to the same factors that have inspired artistic freedom- the language of our own mother tongue has increasingly worsened in just a few years time (I graduated 10 years ago to give you a reference) &amp; that it's probably just a matter of time before it is attuned to the level of the next generation. For instance, one of the major issues with today's students is that they make a lot of mistakes in the use of verbs in the past time. In Dutch we have "strong" (also called irregular) &amp; "weak" verbs who -depending on what they are- may or may not change vowels in the past time (strong verbs change -hence the alternative term irregular- whereas weak verbs keep the vowel(s) from their infinitive). I foresee a dismissal of the disctinction between strong &amp; weak verbs &amp; a future with only weak verbs. Darwin's survival of the fittest theory doens't apply to languages. On the contrary, in time things that are now considered incorrect will actually become the standard norm. In the past 20 years our language (Dutch that is) has already undergone 2 changes of which the first one was quite drastic. This evolution will continue as long as people are still using the language. A language is by definition a tool for expression &amp; therefor bendable to fit the moment. I haven't seen any changes of punctuation however, but I can imagine that this is also just a matter of time assuming people will "play" with it enough. Or maybe a "wrong" use of punctuation will always be considered a form of artistic freedom? Time will tell...</p>
