    html: <p>Punctuation surely has its limits (hence the remark that I can not have enough variation), but it is a tool that -when used creatively, not necessarely correctly- can actually be of help to give an extra zing to your words. I find it stimulating to try and get my feelings across in written language as much as in spoken language. I agree with you, there will never be enough punctuation marks for the entire spectrum of human emotions, but it's a start. I consider limitation (along with laziness) the mother of creativity. Even in my work I deliberately limit myself, set "style bounderies" for each design I do, just to not get overwhelmed with choice and to keep consistancy in the end product. Choice is good, but if the balance of supply and demand shifts to an oversaturation in supply a blessing can easily become a curse (after all, the circle's ends meet again at the two extremes). Once past the point of enough, it becomes too much. It's the western modern day disease, but in case of punctuation marks I don't think we have anything to worry about. So for now, I can not have enough variation. By the time the variation in punctuation marks becomes enough to cover the basic human emotions (which is still a long way from here &amp; a road that will probably never be walked), the danger of oversaturation lurks around the corner. Luckily enough, human beings are complex enough -even in their basic emotions- to prevent that from ever happening ;-)</p>
