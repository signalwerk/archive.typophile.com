      <p>An exclamation is a particular class of sentence, sentence fragment or interjection, usually associated with heightened emotive expression. Note that I have not distinguished the exclamation from a sentence, such as might be terminated by a period, only from a question. Grammatically, exclamations <em>could</em> could be terminated by period, but we've developed a punctuation system that gives them their own sign, because we've found this 'adds value' to our writing and avoids ambiguity. One of the principle values of the exclamation mark is that it allows us to distinguish between actual questions and similarly phrased exclamations, which are a feature of our rhetoric. This is why I find a pseudo punctuation mark that conflates interrogation with exclamation silly: it undermines the function of the independent signs.</p>
      <p>If we consider, again, those examples above, it should be clear that we read </p>
      <p>'How big is that goal?'</p>
      <p>differently from</p>
      <p>'How big is that goal!'</p>
      <p>even though the words and the word order are identical.</p>
      <p>I don't think we read</p>
      <p>'How big is that goal?!',</p>
      <p>'How big is that goal!?',</p>
      <p>or</p>
      <p>'How big is that goal‽'</p>
      <p>significantly different from</p>
      <p>'How big is that goal!',</p>
      <p>i.e. as an exclamation.</p>
      <p>But we may well read</p>
      <p>'How big is that goal?'</p>
      <p>differently, and that seems to me a good test of what kind of utterance we're dealing with.</p>
      <p>'How big is that goal?'</p>
      <p>is a question.</p>
      <p>'How big is that goal?!',</p>
      <p>'How big is that goal!?',</p>
      <p>'How big is that goal‽',</p>
      <p>and</p>
      <p>'How big is that goal!'</p>
      <p>are all exclamations, and therefore adequately punctuated with !</p>
      <p>'How big is that goal.'</p>
      <p>is ambiguous, since the structure is that of a question but the punctuation not clearly indicative, in our system, of an exclamation. Therefore, we may consider it incorrectly punctuated.</p>
