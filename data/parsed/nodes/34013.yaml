      <p>Eben, thanks. Yes, punctuation is fundamentally a system for indicating the structure and organisation of written thoughts, most importantly by identifying the relationship of clauses. The marks used are conventional, i.e. the shape of the little mark that we call a comma is recognised by convention, but what they signify are structures of language, which are not conventional (or not wholly conventional). Over time, the use of punctuation varies, but this generally doesn't mean that the linguistic structures are changing -- we're still using the same kind of clauses in the same kinds of relationships --, but only that we conventionally mark or do not mark particular structures, according to something like fashion or individual taste. Some punctuation is discretionary, e.g. when we can understand the text equally well with or without a comma in a particular place, and depends on the prose style of the author or editor; other punctuation is essential for avoiding ambiguity or enabling the reader to easily make sense of complex sentences. This is the primary role of punctuation.</p>
      <p>There is a secondary role, which is as a guide to pause and intonation when reading aloud (in which category I include reading aloud in your head, which is sometimes necessary if one wants to avoid embarassment when reading poetry or plays on the bus). But this role is not only secondary to the grammatical function of punctuation, it is also entirely conventional and ultimately exterior to writing, i.e. it is an interpretative imposition on the text. Punctuation is useful as a guide to pause and intonation because both punctuation and intonation are ultimately concerned with expressing the thoughts contained in and organised through the text. But punctuation isn't necessary to intonation, and if one were to mark up a text in order to indicate as fully as possible the desired intervals and intonation, one would very quickly exhaust and need to surpass the limited usefulness of common punctuation marks. Full notation of pause and intonation would resemble something like musical notation.</p>
      <p>Choz, you described above the kind of intonation you associate with different punctuation marks. I think it would be interesting to record you reading a passage aloud, and to analyse just how regular these associations are. My guess is that they are a lot less regular than you imagine, and that, for instance, what your voice does at a comma will vary considerably depending on how the comma is being used, i.e. the kind of clauses it is separating and their relationship to each other and to the overall structure of the sentence. We read the meaning of a text -- giving emphasis through stress, pause and speed to articulate thought -- not the punctuation as if it were a musical score.</p>
