      <p>When reading, aloud or to myself, I apply "voice" (inflection/tone/etc.) to other punctuation: extended preceding syllable and a quick dramatic pause to a comma, longer to a colon, a hurried whisper to parentheses, a meandering fade to ellipsis, and a pitch shift to a question. The exclamation is hardly exceptional for having a vocal insinuation.</p>
      <p>In Spanish, the preceding inverted question mark was created to serve a pointedly grammatical function. A sentence may very often be declarative or interrogative with the exact same words. Here the marks are grammar marks because they define an otherwise unknown element of the sentence. (I suspect the inverted exclamation was folk use to appear consistent.)</p>
      <p>In English, however, questions are almost always discernible without the '?'. So, is the current function just a reminder that there was an "asking word" earlier on? A quaint leftover from another time? Why not just reserve it for ambiguous wordings? Likewise, if you comprehend the words, the exclamation mark's only remaining value is it's voice.</p>
      <p>---</p>
      <p>Did anyone ever notice that they use more word problems in math books for public schools at the same time that they continue to reduce sentence diagramming and grammar lessons in general?</p>
      <p>---</p>
      <p>On a related note, I usually map the interrobang to point redundantly at the glyph: !? That solves the aesthetic problems for me, and I think my font fan base has never-ever-ever commented on the subject.</p>
