    html: <p>Choz, If I understand what John is saying he is stressing the role of puncuation as an aide to meaning via grammer etc - as opposed to some kind of match of or notation for vocal inflection. Obviously the two are related but even so I think his emphasis is right. Trying to match the vocal range in letterforms and punctuation is a little bit of a fools erand once you begin dividing things too finely. One you start, where do you stop? I don't want to see texts littered with !!?!! &amp; !!? &amp; ?!!! Moreover I just don't think we get much from '?!' or '!?' except in rare circumstances. Of the two, I am more sympathetic to '?!' to denote a stongly felt interjection. Probably because I read it in comic books as a kid. And I would prefer not to see an interobang pretty much ever again. At least in English anyway. Maybe someone will change my mind... but you can count on me a skeptic for now.</p>
