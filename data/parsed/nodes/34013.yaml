      <p>Coincidentally, I was recently interviewed about the interrobang for a programme on CBC radio. The programme, about changing punctuation practices, can be heard here: <a href="http://www.cbc.ca/andsometimesy/pastshows.html?episode18">http://www.cbc.ca/andsometimesy/pastshows.html?episode18</a></p>
      <p>As I say in the interview, and as I've explained at some length in previous Typophile discussions on the subject, I don't consider the interrobang a punctuation mark, because it doesn't mark a grammatical structure. It's a kind of extra-grammatical and informal expressive mark.</p>
      <p>Haley writes, re !? and ?!: <em>the question arises: Is this statement more of a question or an exclamation?</em></p>
      <p>In fact, this question never arises, because grammatically a question and an exclamation are entirely distinct, and in English the punctuation marks ! and ? are most often only aids to reading. The distinction can almost always be determined from word order:</p>
      <p>'How big is that dog?' vs 'How big that dog is!'</p>
      <p>The first is a question and the second is an exclamation. Note that these marks are the only grammatically correct ways to terminate these two sentences. The exclamation mark is not simply a kind of louder or more emphatic full stop: 'How big that dog is.' would be incorrect because the sentence is grammatically an exclamation.</p>
      <p>The punctuation marks only become essential to comprehension when the utterance is truncated to a sentence fragment:</p>
      <p>'How big?' vs. 'How big!'</p>
