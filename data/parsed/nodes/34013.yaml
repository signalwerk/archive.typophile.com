      <p><em>Can it be both? In many converstions, one person makes an exclamation, signifying their opinion, but also asking the other person’s. So one commentator says “How big is that goal?!” and the other replies, “It’s big, but they haven’t won the game yet.”</em></p>
      <p>Is the second replying to the question, or simply making a further observation? It seems to me that both commentators are simply saying, in different ways, that it is a 'big' goal, one via a rhetorical question and the other with a plain statement (and appended caveat). The second commentator isn't treating the first's question as if it were anything other than rhetorical: he isn't trying to express in some quantitative terms just how big the goal is. In any case, sports commentators, despite their banter, are not really engaged in conversation with each other: they're talking at the invisible audience.</p>
      <p>Now let's image a novelist writing a scene in which two sports commentators make these comments. Is there anything really conveyed by</p>
      <p>'How big is that goal?!'<br>
      'It's big, but they haven't won the game yet.'</p>
      <p>that is not conveyed by </p>
      <p>'How big is that goal!'<br>
      'It's big, but they haven't won the game yet.'</p>
      <p>In fact, I would argue that the latter punctuation, by making clear that the statement is an exclamation, conveys more of the excitement of the match than the addition of the question mark, which, as Tom noted above, may express bafflement.</p>
