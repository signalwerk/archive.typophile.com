      <p>I think I am with Kent &amp; John on this. The interobang is the grapmatical typographical equivalent of bold italic underlined. It almost certainly isn't really needed even if you can do it. And if you really do there is always the two glyph combination. </p>
      <p>I would also make the technical point that it would be better &amp; more practical to simply kern two standard glyphs (or make a special one if you really need to) in order to solve what the interobang supposedly solves.</p>
      <p>In a related vein; it seems to me ( and actually I would welcome counterarguement here ) that making a ff or ffl or fi ligature out of two or three glyphs kerned into a ligature is preferable to one glyph because they can be designed to 'degrade' from the original design more elegantly when automatically spaced in various ways than a single fixed ligature glyph can.</p>
      <p>But the point made earlier by Haley about the Interobang being hard to access is I think the most salient point. You can cheer or boo as you like but it doesn't matter. It isn't going to get traction because it's not on the keyboard.</p>
