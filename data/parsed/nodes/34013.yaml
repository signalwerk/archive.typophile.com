      <p>I'd be inclined to punctuate 'How big is that goal!' with an exclamation mark, because it is really an exclamation about how big the goal is, not a question, even though the word order is that of a question.</p>
      <p>But most rhetorical questions are simply questions, and are punctuated with the question mark. We don't have separate question marks for rhetorical and non-rhetorical questions because there is no <em>grammatical</em> difference between them. A lot of people seem to want a kind of extra grammatical text marking, e.g. to indicate excitement or irony or rhetorical usage, but that's not the system we have. We use punctuation to help us comprehend the structure of text, not the use of text. [Articulating the use of text is one of the things for which we use typographic variation, setting things in italic or bold, or at differen sizes to signal different kinds of information or different levels of stress or importance.]</p>
