      <p>After being offline for a few days, I've had a lot to catch up on, so I apologize in advance for not directing my post to the original posters or refering to them.<br>
      It's been interesting to read how people here seem to have different uses of punctuation. Personally, I can not have enough variation &amp; room to play with it since I feel the purpose of punctuation is to highlight the "feel" of the sentence.<br>
      On the other hand -as contradictory as this may sound- in my own texts (non prose), I only use , ; &amp; : in de middle of sentences, but never any kind of punctuation to close the sentence. Someone wrote about the ? that in English (&amp; other languages) it is pretty much redundant because the construction of the phrase already indicates the question. Still, I think punctuation -as redundant as it may be under certain curcumstances- still adds to a text, but maybe that's because I'm a sensitive person &amp; I can never have enough words to express myself &amp; punctuation to emphasize them.<br>
      The paradox in all this is that in the texts I write which are all very personal/emotional, I don't use any punctuation at all (unless a , ; : to divide a sentence &amp; only when it's not redundant) &amp; I can honoustly not say why... I conveniently call this "artistic freedom", but maybe I'm just trying to get the reader to make its own assumptions &amp; interpretations?</p>
