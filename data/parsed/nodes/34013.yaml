      <p>One interesting and functional example of existing usage of the interrobang comes from algebraic notation systems for chess games. See the <a href="http://en.wikipedia.org/wiki/Algebraic_chess_notation">Wikipedia article</a>.</p>
      <p>The following short-hand notations are frequently used to comment moves:</p>
      <p>    ! - a good move<br>
          !! - an excellent move<br>
          ? - a mistake<br>
          ?? - a blunder<br>
          !? - an interesting move that may not be best<br>
          ?! - a dubious move, but not easily refuted<br>
          □ - only legal move from this position (forced)</p>
      <p>So, a whole series of moves and countermoves might look like:<br>
      White / Black<br>
      1. e4 / d5<br>
      2. exd5 / Nf6<br>
      3. d4 / Bg4<br>
      4. Bb5+ / c6?!<br>
      5. dxc6! / Bxd1?<br>
      6. c7+ / Qd7??<br>
      7. c8Q#	(# denoting checkmate)</p>
