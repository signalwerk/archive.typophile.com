    html: "<p>Choz, we <em>use</em> combinations of ?! and ?! to evoke inflection, tone or subtext, but my point is that in so doing we are using these marks as something other than punctuation. We don't use , : ; . etc. for those purposes. It is only ! that we have loaded with an extra-grammatical, expressive function. Personally, I think the reason for this is that the majority of primary school teachers no longer teach grammar in any systematic way, and couldn't explain the construction of an exclamation. So one ends up with silly explanations like '! means something said loudly or emphatically': the mark is now taught as an expressive mark and not as a punctuation mark.</p>"
