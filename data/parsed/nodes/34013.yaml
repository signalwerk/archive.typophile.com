      <p>John: <em>I don’t think we read<br>
      ‘How big is that goal?!’,<br>
      ‘How big is that goal!?’,<br>
      or<br>
      ‘How big is that goal‽’<br>
      significantly different from<br>
      ‘How big is that goal!’,</em></p>
      <p>I think we do.<br>
      And the difference becomes apparent if the exchange is completed:</p>
      <p>"How big is that goal?!"<br>
      "It's big, but they haven't won the game yet."</p>
      <p>This is a rhetorical question being answered, which is what happens in conversation (though not when addressing a reader or an audience).<br>
      So it makes more sense than:</p>
      <p>"How big is that goal!"<br>
      "It's big, but they haven't won the game yet."</p>
      <p>--which is a non-question being answered.</p>
      <p>If exclamation marks didn't exist,</p>
      <p>"How big is that goal?"<br>
      "It's big, but they haven't won the game yet."</p>
      <p>--would suffer a loss of meaning, because the partly rhetorical quality of the question is absent. So in transcripts of conversation, an exclamation mark can provide a purely grammatical function (not just to "express heightened emotion"), when used in conjunction with a question mark.</p>
