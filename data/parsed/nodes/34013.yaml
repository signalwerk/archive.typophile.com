      <p>Nick: <em>would suffer a loss of meaning, because the partly rhetorical quality of the question is absent. So in transcripts of conversation, an exclamation mark can provide a purely grammatical function (not just to “express heightened emotion”), when used in conjunction with a question mark.</em></p>
      <p>No, that is not a grammatical function, it is an extra-grammatical, rhetorical function. Rhetoric and grammar are different things. What you have demonstrated is what I wrote right at the beginning of this discussion: that ! when combined with ? is being used as an expressive mark, not as a punctuation mark. A rhetorical question is grammatically identical to any other question, and it is only in the conventions of rhetoric that we generally understand that it does not expect a reply.</p>
      <p>Tom: <em>Personally, I can not have enough variation &amp; room to play with it since I feel the purpose of punctuation is to highlight the “feel” of the sentence.</em></p>
      <p>But punctuation marks will not give you the variation and 'room to play' that you want, because they belong to a system whose purpose is indicate what a sentence <em>thinks</em> not what it feels. As I wrote above, if you wanted to capture visually in text the nuances of articulation, you would need something akin to musical notation.</p>
