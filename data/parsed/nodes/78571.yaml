      <p>Many thanks for your response Mike.</p>
      <p>I completely understand and agree with what you say, it's just I didn't have a better crop, that was my point, and to be addressed like I was, where someone assumes I am trying to make things harder was un-called for I think. If I had a whole word I would have posted it. I certainly don't want to make things difficult for anyone!</p>
      <p>I appreciate anyone's help whenever I post, and am aware of the dedication to identifying typefaces and have always been not only grateful, but very impressed by peoples knowledge.</p>
      <p>All the best.</p>
