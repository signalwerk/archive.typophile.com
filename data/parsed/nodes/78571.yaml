      <p>Many thanks for your response.</p>
      <p>Occasionally one finds a 'snippet' of a word that looks interesting and needs help to identify the typeface, full words are not always available. I certainly didn't crop the image to 'obfuscate' the word. I assumed the point of this area of the forum was for the more learned members to try to use their knowledge to identify the typeface no matter how few the characters.</p>
      <p>I appreciate any help I am given on here, but certainly don't appreciate your snooty response, I feel it is unnecessary, but thanks for your help all the same.</p>
