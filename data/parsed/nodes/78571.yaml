    html: |-
      <p>I feel compelled to support Nick. I disagree that his response was 'snooty', because I agree with his comment that we don't need to see just what the poster thinks are the 'interesting' letters — the more letters you can show us the better our chances of identifying the font. What we're trying to do here isn't a parlor trick to see how few letters it takes to make an ID.</p>
      <p>I looked at your sample too, and thought the 'a' resembled a display Caslon style. Sometimes there are swash letters, or alternative glyphs, such as that 'r', but seeing more letters would have been helpful, if you had them.</p>
      <p>We all try to be helpful here, and some of us devote a lot of our time trying to answer many posts a day. We appreciate whatever posters can do to make it easier for us.</p>
      <p>- Mike Yanega</p>
