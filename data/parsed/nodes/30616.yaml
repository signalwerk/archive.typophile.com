  html: |-
    <p>The companion thread to <a href="http://typophile.com/node/30598" rel="nofollow">Glyphs that Gall</a>, as proposed by Matthew Desmond.  I have to say, I can't think of any letter shapes that I'm particularly enchanted by, perhaps because I love letters that blend with the rest in the font.  Perhaps I should create a third thread about great fonts in general, but surely that topic's been exhausted in other threads.  Can anyone link to them?</p>
    <p>Anyway, for this topic, pattyfab suggested the ampersand of Caslon Italic.  Quite fab indeed, Patty.</p>
  html_clean: |-
