      <p>Jackie, that is one gorgeous glyph. </p>
      <p>But 'glyph love', as Hrant has noted, can be a trap for type designers. </p>
      <p>As Mario Feliciano said to me at TypeCon 2005: "You don't want beautiful letters, you want beautiful words."</p>
      <p>Looking at sample words of Catull on MyFonts, the 'a' has 'color' problems, leaving a gap in the NE corner compared to the other lc letters. So the Catull a is exquisite, but a problem within the font.</p>
