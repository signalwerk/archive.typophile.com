      <p>Do a google search for +"starling burgess" +bluenose. </p>
      <p>I have a photograph that the UK marine photographer Frank Beken  shot on the deck of the Bluenose just off the Isle of Wight in about 1935. The print was made from the original glass plate, which I was able to see at the Beken shop at Cowes. It is considered to be one of Frank Beken's finest photographs. There is probably an image of it at <a href="http://www.beken.co.uk" title="www.beken.co.uk">www.beken.co.uk</a>. It was quite a trick, at that time, to make a glass plate photo on the deck of a moving ship, and Beken used a specially designed camera, shown on the site. </p>
      <p>I've also been on the Bluenose II, a replica built in 1967 and currently undergoing restoration, and she is a truly beautiful ship.  Her home port of Lunenberg is a pretty beautiful place itself.  </p>
      <p>Re your other question:</p>
      <p>My point in mentioning that yachts are expensive is that people don't spend lots of money to build sailing vessels in order to have  D-shackles and D-rings that are in the shape of a "proper D" for aesthetic rather than functional reasons. </p>
      <p>Sailing boats in open ocean, during the night and day, and in good weather and bad, is fairly serious business.  A few years ago, while I was at the Isle of Wight, a bunch of young men died while sailing between the island and the coast of England, in an area, less than half a mile from shore, that I have sailed myself.  Safety/efficiency is the major design and construction priority, which when compromised, as it often is, is compromised for deliberate  reasons.</p>
      <p>Aesthetics is a major issue in boat design, especially hull design, just not  at the level of the bits and pieces used for things like rigging. If I am chartering a boat, or crewing on someone else's boat, I might admire the lines of the hull, but the first thing that I do when I get on board is look at the condition of the rigging.</p>
