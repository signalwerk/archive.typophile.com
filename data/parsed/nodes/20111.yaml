    <p>This isn't about "found type"*. It's about letters that are unwitting results<br>
    of unrelated acts of design, manufacture, etc. Sort of like the opposite of that<br>
    recent study which claims that letters are designed based on other things around us. (I just hope this focus isn't too narrow!)</p>
    <p>* I would argue there really isn't any such thing anyway.<br>
    Unless you count tripping over a drawer of Caslon laying<br>
    on the sidewalk.</p>
    <p>Besides posting images of such letters, please also discuss how you think such letters can come about. Do people incorporate them subconsciously, secretly, for show, or what? Below are my two contributions - the first is something I found in the street yesterday, the other a photo I once took in Amsterdam (I think you attach boats to it). BTW, if you can think of actual fonts that have forms very close to these or to unintended letters you've seen, that would be interesting too.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hook_s_3681.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/amster_h_5131.jpg"></div><p></p>
    <p>hhp</p>
