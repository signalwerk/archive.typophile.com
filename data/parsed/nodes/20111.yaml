      <p>When my daughter was two, we were sitting on the steps of our porch. She pointed to the ground and said with a smile "Five! five!" I had no idea what she was talking about, until I looked on the ground and saw, sure enough, a long pine needle, bent and broken, that lay on the ground in a perfect 5 shape. </p>
      <p>I think it's relevant that some of her favorite Sesame Street videos featured letters and numbers out in fields, on swings, walking down the street, etc. To some extent, those videos helped teach her what to expect in the world. I would overlook that pine needle 999 times out of 1000; the other time, I would marvel at the remarkable coincidence. But my daughter simply noted it as one of the happy letters that one should simply expect to find in our surroundings.</p>
