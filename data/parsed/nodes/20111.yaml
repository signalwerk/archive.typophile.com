      <p>I sure hope not.  A D-ring (as distinct from a D-shackle) is often used at the corners of a sail and they are under major loads. </p>
      <p>A passage from The Sailmaker's Apprentice:</p>
      <p>"...there are designs for various corners and specific uses. </p>
      <p>"The simplest D-ring is a straightforward D shape - fine for straps perhaps, but prone to capsize under the torque and oblique strain of sheeting and outhauling when used in the clew of a sail. Consequently, there is a range of D-rings with inner crossbar configurations that provide stability of installation and isolate a shackle or fitting from the material holding the D-ring to the sail."</p>
      <p>Note the word "capsize", which is not something that the average sailor is keen on.</p>
      <p>If you are prepared to qualify your third photo as an "I", there is a whole bunch of other gear that will make your list.</p>
