      <p>The people who design/engineer/build expensive yachts are not in the business of making fittings like D-rings look "more like a D than it really needs to be".</p>
      <p>They are in the business of making boats that are strong and safe, and either fast or comfortable (or a compromise between the two), for the expected conditions.</p>
      <p>There are some yachts, such as America's Cup racing yachts, that push the boundaries, but the designers of these yachts are on the leading edge when it comes to strength of materials and fittings.</p>
      <p>If you check around on Google, you will find D-rings and D-shackles that look quite different from the one in your photo.</p>
