      <p>"I think you attach boats to it."</p>
      <p>If you spend time around boats, especially sailboats, you will see all kinds of things that look like letters, starting with lifebuoys.  Off the top of my head, lots of O, D, U, I (the serif kind), J, V, H.</p>
      <p>For example, sail rigging requires objects that are closed (O rings/grommets) and objects that can be closed (eg. D shackles), and that are curved so that they do not cause undue friction on lines (aka ropes) and halyards (steel ropes).</p>
