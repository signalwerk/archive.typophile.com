    <p>Hello everybody,<br>
    I’m looking for a moden font with superb legibility - it should be made with only that in mind! It’s for a design program for visually impaired people. I’d prefer a sans serif although a serif probably would be better...  </p>
    <p>Any suggestions will be a great help.</p>
    <p>Thanx </p>
    <p>Jsbr</p>
