      <p>Which typeface?<br>
      I think the logo is not a typeface, but a custom-drawn lettering.</p>
      <p>"Victoria [...]" is set in Mendoza:<br>
      <a href="http://www.myfonts.com/fonts/linotype/itc-mendoza-roman/" title="http://www.myfonts.com/fonts/linotype/itc-mendoza-roman/">http://www.myfonts.com/fonts/linotype/itc-mendoza-roman/</a></p>
      <p>"Rise [...]" is set in some quirky revival of Garamond.</p>
      <p>-- <a href="http://www.omine.net/" rel="nofollow">omine.net</a></p>
