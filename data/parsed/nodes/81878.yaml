      <p>I've never thought Comic Sans was a good typeface, regardless of context, and I feel somewhat vindicated in that having looked at Connare's only (?) other commercially available typeface, Magpie, which has similar failings. (Since you're bound to ask: horrible curves, tedious wackiness, characters that are busy staring at their shoes, and no obvious way of setting it so as to achieve anything recognisable as rhythm.)</p>
      <p>I do think it would have come in for less stick, though, if it had just been differently named. Calling a typeface "Comic" that would be hopelessly out of place in a comic can only result in people thinking you've tried to design a comic lettering face and failed. I suspect that's exactly what happened, but he needn't have drawn attention to it.</p>
      <p>I really like the way people have chosen it over conventional alternatives for office signmaking. It says only good things about human beings. It's just a shame it was that particular casual handwriting face, when there are so many lovely ones. Then again, a lot more handwriting faces have come out in recent years; maybe people have been inspired to compete with Comic Sans, in which case, again, it's made a positive contribution.</p>
      <p>If Connare reads this thread, I hope he'll forgive his work being criticised by someone who takes pride in using type well, and has done a fair bit of glyph wrangling, but has never released a typeface. Real artists ship, Vincent, and you've shipped in spades.</p>
