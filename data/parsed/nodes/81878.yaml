      <p>Don't you think it would be most interesting to focus on the question on why it gets used so much, by people who are completely unrelated to design?</p>
      <p>I just ask because your trailer states: "There can be no pleasure derived from using Comic Sans" (or similar, not an exact quote). Well this statement is an ideological one. You don't even state something normative like "There should not be any pleasure derived...". You just say it does not fit your world view, why would it fit anybodies?</p>
      <p>It is easy to say, that people who have something to do with a design decision, but are not educated about design might tab into using comic sans, because they don't know better. But is that interesting? </p>
      <p>More interesting might be why it is used by people who do not care for DESIGN but for COMMUNICATION?<br>
      Why does it get used by people who are completely serious about their work (heck, even managers maybe for internal use?), what do they try to communicate? From which point of view do they come when using it? How does they audience (co-workers, public?) receive it?</p>
      <p>Somebody mentions the American Office Environment. All this would make the subject more tangible. I mean yeah, making a movie about a font as a bad design choice? Who cares? Designers? Well, that would be a quite self serving audience. Would't it be more interesting to unravel the psychology behind it and tell a general audience: "This is why you use comic sans"  and: "This is what other general audience people think about it."</p>
      <p>Anyhow, I think there is more than the world needs than a movie on a insignificant typeface. </p>
      <p>To Nick:<br>
      Better <a class="freelinking external" href="http://en.wikipedia.org/wiki/Talking_Heads" rel="nofollow">Talking Heads</a> than <a class="freelinking external" href="http://www.funnyordie.com/videos/47d8df4123/movie-poster-floating-heads-from-fod-team-and-brian-huskey" rel="nofollow">Floating Heads</a></p>
