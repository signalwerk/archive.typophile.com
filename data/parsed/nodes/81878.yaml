      <p>I agree with you, Ray.</p>
      <p>Why would anyone want to watch designers slamming or glorifying typefaces in a feature film? Only other designers would be interested, I think. I've seen and enjoyed the Helvetica film, it's quite well done and, perhaps has helped to put typography as a whole in the general spotlight a bit. But in the light of its success now make a documentary on Comic sans? It seems a bit pointless to me, if it does not show a bigger picture. </p>
      <p>Why do we slam Comic sans? Because it's poorly designed? Perhaps, but maybe that's the point with this kind of casual handwriting. It's not supposed to look calligraphic, it should look like everyone can write this way, making it 'personal' and 'friendly'. </p>
      <p>I think it is most hated because it is overused and misused. It will hardly ever be used by professional designers, but it may have it's value for normal users who just want to make an invite for a garden party or a birthday. It should IMO not be used for formal or business communication, but there are worse things to worry about when it is. </p>
      <p>If anything is to blame, it should be the combined sum of standard office software, PC's, cheap color printers, clipart, pre-installed system fonts, copy shops... etc. etc. If anything, comic sans is a symptom but not a 'disease'.</p>
