    html: <p>Comic Sans is such a funny font, because it gets bashed so much by font designers, yet is so loved by so many. For example, my Mom loves to use it. But that's also because it's a default system font on computers that she found simply because it was there, and because it's one of seven fonts available in yahoo's email system. I suppose if any font was a default system font, it would be widely used, and therefore widely liked/loved "by all" as well.</p>
