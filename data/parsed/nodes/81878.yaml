      <p>Comic Sans is dead. As dead as IE6. Died together with web 1.0, as the private “homepages” disappeared and social content became king.<br>
      Papyrus is almost dead too, not quite there yet, but will be.<br>
      Some home brewed designs still feature them, but only by those who can't operate google and just design their company in logo in MS Word. Preferably featuring a clip art. </p>
      <p>The “new comic sans”—so to say—might be the Exlibris free fonts, especially Museo. Which is very fortunate actually, as they are of very good quality, and nobody can embarrass themselves using them, other than using an already much used font. Jos did a good job with self promotion and online marketing.</p>
