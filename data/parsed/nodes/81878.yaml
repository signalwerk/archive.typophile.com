    html: <p>I hope that if you're trying to create a legitimate documentary, you keep the second half of Connare's quote in mind as well. If you approach the project from an objective standpoint, you might create something very interesting. Did you know Connare is a member on Typophile? You should probably try to interview him and get a proper look at the history and rationale of the font. Sure, just like everything else, it can be inappropriate in the wrong context. But what if you're not "showing up to a black tie event in a clown costume"? What if you're showing up to a kid's party? A clown costume might be just the thing. Oh, and since Comic Sans was never anything but a digital font, why the film of metal typesetting in the trailer? I hope that in spite of being produced by the "Ban Comic Sans" group, this might turn out to be a valuable film. Or, if it's going to be completely one-sided, it had better at least be funny.</p>
