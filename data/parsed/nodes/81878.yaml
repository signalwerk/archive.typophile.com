      <p>"A lot of folks miss the point on this. Comic Sans isn't bad because it's a casual handwriting font used in the wrong context. It's bad because it's a bad casual handwriting font."</p>
      <p>I'm not saying you're wrong, but for the first three or four years of its existence there was no hate, and few if any quality complaints. In fact as I recall the consensus was that at small sizes, rendered bi-level it was a well hinted screen font. The complaints about quality only started when it became over used and inappropriately used, as a means of justifying the hate.</p>
      <p>I'd be interested in any evidence to the contrary, in searching the archives the primary complaint I could unearth was that it was cashing in on the popularity of Tekton. :-)</p>
