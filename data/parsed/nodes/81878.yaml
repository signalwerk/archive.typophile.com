    html: |-
      <p>Comic Sans is <em>not</em> a <strong>bad</strong> casual handwriting typeface.</p>
      <p>It is, however, a casual handwriting typeface with a narrow range of applicability.</p>
      <p>Or, to put it another way, it isn't "bad" in the sense of having poor kerning or an ugly design. It was designed by a competent typeface designer.</p>
      <p>It works just fine as a typeface for, say, an advertisement for "Cute Kids Day Care Center". Or for an invitation to a 5-year-old child's birthday party.</p>
      <p>But it cannot be used as a substitute for Dom Casual. It cannot be used as a typeface for comic strip lettering. It <strong>certainly</strong> can't be used as a substitute for Papyrus or Hobo or President or Ondine. And so on and so forth. Since it's one of a handful of standard typefaces, like Times Roman and Georgia, that can be put on web pages, the fact that it isn't a versatile typeface is very unfortunate.</p>
