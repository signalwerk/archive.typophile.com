    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : The Building Letters Project</strong></p>
    <p>The project Building Letters was launched in 2003 by <a href="/wiki/Jim%20Richardson" class="freelinking" rel="nofollow">Jim Richardson</a>. The profits from the sales of 36-page magazine on African design were donated to the support of two African orphanages for children with AIDS. The success of the project was boosted by the CD with free fonts created, amongst others, by <a href="/wiki/Max%20Kisman" class="freelinking" rel="nofollow">Max Kisman</a> or <a href="/wiki/David%20Carson" class="freelinking" rel="nofollow">David Carson</a>. Second issue was dedicated to India, and the profits went to the aid of Indian children and of children from a Ugandan orphanage. Again, the issue contained a CD with fonts designed by <a href="/wiki/Donald%20Beekman" class="freelinking" rel="nofollow">Donald Beekman</a>, <a href="/wiki/Bruno%20Maag" class="freelinking" rel="nofollow">Bruno Maag</a>, Rian Hughes and others. Jim begun working on the third issue shortly after the deadly tsunami in 2004 on the impulse of Rathna Ramanathan from the University of Reading, who was at Sri Lanka when the tsunami came.</p>
    <p><strong>Building Letters 3</strong></p>
    <p>Short after the call for cooperation on the third issue was published, <a href="/wiki/Filip%20Blazek" class="freelinking" rel="nofollow">Filip Blažek</a> from Prague-based design studio <a href="/wiki/Designiq" class="freelinking" rel="nofollow">Designiq</a> offered to do free layout and typesetting of the whole issue, and Jim immediately accepted this offer. First version of the magazine was ready in February 2005, however, the work was delayed for more than a year and half by various obstacles. In the end, Blažek and Richardson agreed that the final steps of the production and distribution process would be left to Designiq. Shortly afterwards, at the Typo Berlin 2006, an international team met, helping the new magazine come into the world.</p>
    <p>During the first half of October, the third issue of Building Letters magazine will come out, being a means with which typographers and designers help those in need. By purchasing one of the 1000 copies (numbered by hand), you not only receive a CD with 25 fonts by renown typographers, you will also make a significant contribution to the aid of those whose lives aren't as lucky as yours or mine.</p>
    <p>The third issue of Building Letters is dedicated to Sri Lanka and Thailand, and it features interesting articles by Tom de Gay, <a href="/wiki/Nick%20Shinn" class="freelinking" rel="nofollow">Nick Shinn</a>, <a href="/wiki/Max%20Kisman" class="freelinking" rel="nofollow">Max Kisman</a>, <a href="/wiki/Fiona%20Ross" class="freelinking" rel="nofollow">Fiona Ross</a> and <a href="/wiki/Donald%20Beekman" class="freelinking" rel="nofollow">Donald Beekman</a>. As usual, it contains a CD with free fonts, this time donated by <a href="/wiki/Pieter%20van%20Rosmalen" class="freelinking" rel="nofollow">Pieter van Rosmalen</a>, Seonil Yun, José Scaglione, David Březina, José Louis Coyotl Mixocatl, <a href="/wiki/Stefan%20Hattenbach" class="freelinking" rel="nofollow">Stefan Hattenbach</a>, Bram Pitoyo, Tomáš Brousil, <a href="/wiki/Richard%20Kegler" class="freelinking" rel="nofollow">Richard Kegler</a>, <a href="/wiki/Veronika%20Burian" class="freelinking" rel="nofollow">Veronika Burian</a>, Jürgen Weltin a Ludmila Lorenz. All fonts are <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> and with one exception, they contain glyphs necessary for typesetting of all Latin-script European languages (complete <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> set Latin Extended A), so you can set Maltese, Welsh, or Esperanto in them; some faces contain special features, alternate glyphs, decorative glyphs, alternative numerals, ligatures, or small caps.</p>
    <p>Although the TV cameras are long gone from the places hit by the tsunami, aid is still needed. This is why all profit from the sales (after deduction of hard costs) will be donated to a respected charity Direct Relief International (<a href="http://www.directrelief.org" title="http://www.directrelief.org">http://www.directrelief.org</a>), which will use the money to help those hit by the 2004 tsunami.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/building-letters-3-cover_4288.jpg"></div><p></p>
    <p>The magazine size is A5, it has 64 full colour pages, it is published in a limited run of 1000 numbered copies, and it is <strong>on sale now for 35 Euro</strong> (aprox. $43) at <a href="http://www.buildingletters.org" title="http://www.buildingletters.org">http://www.buildingletters.org</a>. Also, the site will publish information on how much money was collected, and finally, it will publish a report from Direct Relief on the use of the donation.</p>
