    <p>Hey everyone! I recently started a fashion/lifestyle blog and have discovered a new found love of fonts! I understand the typography of a page will change the overall feel of the entire page. I designed my logo using this free font: <a class="freelinking external" href="http://www.enfont.com/vni-thuphap.font" rel="nofollow">http://www.enfont.com/vni-thuphap.font</a><br>
    I know there can be issues using free fonts as a logo so I did email the creator multiple times without a reply! That brings me to the first part of my question, do you guys think its ok to use the free font as my logo?? If so then here is an image of what I have <a class="freelinking external" href="http://imgur.com/d4FFeLv" rel="nofollow">http://imgur.com/d4FFeLv</a></p>
    <p>What I want is two fonts that will look great with the script logo. One that has more character and weight, for the post titles and navigation. Another that is easy to read for large bodies of text. I want something fresh and clean but still fashion forward, something that is not too serious or childish. I have been trying out the google font play fair display but its too orderly if that makes sense.</p>
    <p>Any  help is welcome :) I have been looking at mostly Google Fonts because I'm using WordPress but would be willing to look into other options if I knew how.</p>
