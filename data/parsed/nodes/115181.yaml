    html: |-
      <p>It's pretty simple. A font isn't just about readability, it expresses things; and what it expresses depends not only on what it looks like, but also what it's been used for. A great example is Trajan: one might expect it to convey Ancient Rome, but it really mostly makes people think of Hollywood movie posters, Victoria's Secret, etc. It's much worse with Helvetica: it has said so much about so many things that it no longer says anything. Neither of those typefaces are free. On the other hand it's not rocket science that something that costs more than something else is generally more rare, hence generally more focused. Exceptions? Duh.</p>
      <p>But deep down you already know all this. It's that the chip on your shoulder has gotten so big it's affecting your hearing.</p>
      <blockquote><p>And she should do this because you mean if she picks the right font, she doesn't have to write anything at all on the blog, the important part is already done?</p></blockquote>
      <p>I'm not stupid enough to have said that. And you're not stupid enough to believe I said that. On the other hand thinking that this place needs to be about more than just typography is stupid.</p>
      <p>hhp</p>
