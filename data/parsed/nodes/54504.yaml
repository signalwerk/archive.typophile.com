      <p>Bill, your magic button idea is a good one. I don't know of any short cut to your request. I just switch the master view in the metrics window and edit the value. I wonder if the python wunderkind have a solution.</p>
      <p>RachelR, you can have up to 16 masters in a MM font. Bill's four master font might include weight and width. If he added optical size to his four master font he would have to add four more masters. Then if he wanted to something that altered a feature, say serifs he would have to ad eight more masters.</p>
