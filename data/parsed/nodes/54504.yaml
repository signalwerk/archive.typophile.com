    html: |-
      <p>"... whatever I am doing in one master - - changing spacing, a point, a BCP, kerning - - do the same thing in all the other masters."<br>
      Any time you want you can ditto the kerning and spacing. But I'm not familiar with this particular need, and suspect most are not. The reason is, I've never wanted to exactly ditto an edit among all the other masters. In many instances, as I've been adding masters, I've found the source to be incorrect in some detail, wanted to change that and echo it into other masters, but not ditto. Adding a bcp, I do all of the time from improper vision in the first master's digitization, but again, each point added in a pole is an echo from the master and not a ditto. The making of the difference between the ditto and the echo is our job, one I don't think I'd like to try and keep track of ex post magic buttono. ;)</p>
      <p>"Then if he wanted to [do] something that altered a feature, say serifs he would have to add eight more masters."<br>
      S/he would have to add eight more masters, true, but to be clear, not eight new masters. Adding only by doubling the masters is required for the mechanism, and may not be for the design. So e.g. one could only need 6 unique masters in a 16 style MM space to reach a set of stylistic options, as you know.</p>
      <p>Cheers!</p>
