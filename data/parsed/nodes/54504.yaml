      <p>Bill,</p>
      <p>Haven't worked with MM font metrics, so this may not apply. With that caveat, if you want to selectively say yes or no to a kerning change for all masters, I don't know a fast way. But if the changes in one are to be global, that is, apply to all masters, why not write off AFM files, put in the new kerning data, and import for each?</p>
      <p>I've found using an AFM file and a good text editor useful for all sort of "kerning-copying." Easy to edit, and if you think about it, easy to make an "old" and  "new", put an asterisk after each pair on the "new", combine, sort, &amp; delete all multiples without an asterisk, whatever . . .</p>
