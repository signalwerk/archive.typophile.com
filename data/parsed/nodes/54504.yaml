    html: |-
      <p>This is what I would do:</p>
      <p>1. Go to the Metric Window.<br>
      2. Activate the "source" master.<br>
      3. Export a (single master) AFM file. This only exports the active master.<br>
      4. Activate the "target" master.<br>
      5. Import the AFM file, replace all kerning but not the metrics. This only affects the active master.</p>
      <p>No text editor, no multiple AFM files, not error-prone.</p>
    html_clean: |-
