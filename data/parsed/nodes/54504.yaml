  html: |-
    <p>I am checking kerning on an old four-master MM font that will shortly go into production as separate masters. Let us suppose that I change a kerning value in one master and wish to proliferate the same version to the other masters. What is the easiest way of doing this?</p>
    <p>(Shades of my old request: Fontlab needs a 'magic' button which, when active, performs the following function: 'whatever I am doing in one master - - changing spacing, a point, a BCP, kerning - - do the same thing in all the other masters.)</p>
