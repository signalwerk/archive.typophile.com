      <p>I usually start of with calculation. Usually in golden ratio -related factor as I'm a fan of it. But this factor may vary vastly because it all depends on type vs. symbol weight and their relation, priority and prominence.</p>
      <p>When factor is determined I put them both together and the use optical fine-tuning of both to make it work. This is mainly relevant to those logotypes where symbol and type are somehow aligned: vertical/horizontal centre/bottom/top. Because there may as well be unaligned logotypes although rarely seen.</p>
