    html: |-
      <p>Usually, do you calculate stuff? Or go by intuition / eye? Both?</p>
      <p>I always felt the urge to calculate stuff, like, the mark should be the x-height of the logotype time two or three or whatever. The descriptor should be 50%, 75% of the logotype or whatever.<br>
      Lately I'm questioning my compulsiveness, so I'm qurious about other ways.</p>
  - id: 540151
    user: 39971
    date: 2013-01-25T01:01:00
    date_raw: 25 Jan 2013 — 1:01am
    votes: null
    html: |-
      <p>I look at other logotypes to see what options look good in general - like, the mark being big, very big, caps-height, x-height, something in the middle, sitting on the baseline, above or below it, to the left, to the right, above the text, below it, have a separator line, have an enclosure, etc. </p>
      <p>Then try it on the actual mark and type, see what works the best, then tweak by the eye. In a lot of cases the ideal composition doesn't quantify neatly, it'll be off by percentages here and there.</p>
