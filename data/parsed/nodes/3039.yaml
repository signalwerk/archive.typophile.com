    html: <p>Uh, just have in mind that that glyph is not a 3, nor a z. <br>It's an IPA character (I recall Bringhurst says something about it on 'Elements'). <br>You can find that glyph in IPA fonts (there are some free IPA fonts available from <a href="http://www.sil.org/computing/catalog/show_software.asp?id=12"> SIL</a>).</p>
