    html: <p>Licensing depends on foundry and on the technical technical solution you implement. Some foundries have flat rates, some will consider a bunch of x-factors and assign a relative value to the usage. Pricing can vary widely, your best bet is to get in touch with the foundry (or multiple if you haven't decided anything yet) and discuss it with them, it seems like almost everyone is somewhat figuring these new technology scenarios out for themselves.</p>
