  html: <p>Does anyone have experience with embedding fonts for use within an iPhone application. I am looking for technical resources as well as any advice in regards to licensing.</p>
  html_clean: <p>Does anyone have experience with embedding fonts for use within an iPhone application. I am looking for technical resources as well as any advice in regards to licensing.</p>
