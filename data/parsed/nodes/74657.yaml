    html: |-
      <p>Recently we licensed <a class="freelinking external" href="http://www.boldmonday.com/en/nitti/" rel="nofollow">Nitti Light</a> for use in <a class="freelinking external" href="http://www.informationarchitects.jp/en/writer-for-ipad/" rel="nofollow">iA Writer for iPad</a>. After many hours of number crunching, consideration and seas of black coffee we decided to go for a license scheme based on sales revenue that becomes relatively cheaper the higher the revenue. This ensures that the licensee is charged according to what they actually earn, and not according to sales volume alone for instance. And charging a flat fee is usually not economically viable for apps that might cost only $1.00.</p>
      <p>Drop us a line if you want to know more.</p>
      <p>-Paul</p>
