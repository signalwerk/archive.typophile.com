    html: |-
      <p>Referring to the technical stuff: iPhone apps can have their own fonts inside their application bundle. Their file names have to be added to a configuration file (the bundle's info.plist file) and are then usable from inside the application:</p>
      <p>»UIAppFonts (Array - iOS) specifies any application-provided fonts that should be made available through the normal mechanisms. Each item in the array is a string containing the name of a font file (including filename extension) that is located in the application’s bundle. The system loads the specified fonts and makes them available for use by the application when that application is run.«</p>
      <p><a href="http://developer.apple.com/library/ios/#DOCUMENTATION/General/Reference/InfoPlistKeyReference/Articles/iPhoneOSKeys.html" title="http://developer.apple.com/library/ios/#DOCUMENTATION/General/Reference/InfoPlistKeyReference/Articles/iPhoneOSKeys.html">http://developer.apple.com/library/ios/#DOCUMENTATION/General/Reference/...</a></p>
      <p>AFAIK the fonts can be any format that is recognized by the OS, such as TTF or OTF.</p>
