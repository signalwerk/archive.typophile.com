    <p>Located in <a href="/wiki/Minnesota" class="freelinking" rel="nofollow">Minnesota</a>, the Process Type Foundry is an independent type design studio specializing in the design of original typefaces for retail and custom use.</p>
    <p>Process Type Foundry is the studio of <a href="/wiki/Eric%20Olson" class="freelinking" rel="nofollow">Eric Olson</a>, <a href="/wiki/Nicole%20Dotin" class="freelinking" rel="nofollow">Nicole Dotin</a> and the silent, but useful Charlie.</p>
    <p><a href="http://www.processtypefoundry.com" title="http://www.processtypefoundry.com">http://www.processtypefoundry.com</a></p>
