    <p>Here's my latest project for myself. I saw <a href="/node/13617" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Benton</a>'s Sterling and loved it and wanted to do a custom digitization, tweaking some things that I didn't like so much. So far all I have are the Capitals. In digitizing, I wated to try my hand at that fascinating <a href="/node/18643" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">faceting</a> stuff. Eventually I'd like to expand this to a range of weights and optical sizes, but it's kind of slow going thus far. Anyhow, have a look. Let me know what you think so far.</p>
    <p><img src="/sites/default/files/old-images/howardpdh042806_4222.gif"></p>
