      <p>At first glance, it looks quite promising.  I wonder if the faceting has been applied consistantly enough? The curve of the P is smoothe but the serifs are chunked.<br>
      The F, V, and T also seem a bit too wide.  You might also look at the lower horizontal of the P, it seems to join too straight compared to top.</p>
      <p>I will give it a longer look later.</p>
      <p>ChrisL</p>
