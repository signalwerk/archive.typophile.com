    html: "<p>Sucks, doesn't it? <br> <br>There are only two ways to fix this that I know of: <br> <br>1. Use FlashMX 2004 and switch aliasing ON for the text field. The drawback is that you if you export this for pre-Flash 7 players, it doesn't work. <br> <br>2. Set the quality setting for the movie to LOW. This is the only way to do it for pre-MX 2004 versions. Unfortunately, this affects everything, not just the text field.</p>"
