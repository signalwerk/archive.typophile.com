  html: |-
    <p>I've got a problem with this typeface that was designed as a bitmap font - whenever it is rendered as dynamic text, it blurs. I have read the FontLab manual, and the FontFlasher manual, followed the directions to the letter, and still the typeface blurs when used dynamically in Flash.  <br> <br>I would be eternally grateful to anyone with advice on how to solve this problem. I am completely at a loss and very frustrated. <br> <br>Here is a sample of the typeface in action (on the right is a sample of one that works correctly in Flash) - <br><a href="https://web.archive.org/web/20081121091508/http://www.stereotypography.com/bfuq2/" target="_blank">http://www.stereotypography.com/bfuq2/</a></p>
