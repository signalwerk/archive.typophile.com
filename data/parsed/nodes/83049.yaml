    <p>Hi everyone,</p>
    <p>Just wondering if there are any feminine fonts that you all would suggest. Diotima and Mrs Eaves are the only ones i have found that i love. But i can't afford Mrs Eaves and I'v used Diotima on several past projects. I would like to explore a new font of this elegants. Any suggestions? And please, NO script fonts. </p>
    <p>Thank you.</p>
    <p>- TO</p>
