  html: |-
    <p>Does anyone know how to create highlighted text in photoshop? At the moment I am having to do this manually by creating separate boxes per line of type. This is very slow and infuriating if your working with large volumes of text.</p>
    <p>see this site for an example of what i mean<br>
    <a href="http://www.food2.com/recipes" title="http://www.food2.com/recipes">http://www.food2.com/recipes</a></p>
    <p>Its relatively easy in indesign, just a case of setting an underline with an offset.</p>
