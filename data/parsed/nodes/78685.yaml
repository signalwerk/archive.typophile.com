    date_raw: 3 Feb 2011 — 8:17am
    votes: null
    html: <p>I have an older version of Linotype explorer, but mine just asks for a password before cleaning the application caches. Restarting will clean Adobe caches, but I think the point of doing it with Explorer is so you don't have to restart. Mine has always updated properly just through Explorer. First I delete the font from the list in Explorer then clean both caches and then load the updated version.</p>
