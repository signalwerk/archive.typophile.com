  - id: 450452
    user: 1133
    date: 2011-02-03T12:00:00
    date_raw: 3 Feb 2011 — 12:00pm
    votes: null
    html: |-
      <p>You can put the font files directly into /Applications/Adobe InDesign CS5/Fonts (replace CS5 with your actual version number). Font files placed there are instantly picked up by InDesign. InDesign does not "lock" them so you can overwrite them directly from Fontographer or FontLab Studio, switch to InDesign and you should instantly see the changes. </p>
      <p>Do you have an external features definition file associated with your .fog document?</p>
