    <p>Hi all...</p>
    <p>I'm beta testing a font using InDESIGN. After doing some kerning and generating the OpenType font, when I look at it in InDesign test, there's no change in the kerning I just performed. If I generate a PostScript version of the font, then open THAT in FontLab and re-generate the OpenType font, it seems to work (the kerning appears as I have edited it).</p>
    <p>Is there a reason Fontographer's opentype generated font doesn't access the kerning?</p>
    <p>I use LinoType Explorer to load fonts. Could it be reading an older version of the font? </p>
    <p>Is there something I'm doing wrong? </p>
    <p>Thanks,</p>
    <p>Rob</p>
