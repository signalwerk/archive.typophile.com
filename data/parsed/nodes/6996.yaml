    html: <p>Whoa, now! <br> <br>Why do think your OS 9 fonts are obsolete garbage? <br> <br>Type 1 fonts are perfectly compatible with OS X and Adobe's CS apps. Converting Type 1 directly to OpenType offers no advantages other than a single font file with OTF versus separate outline and screen font files with T1. I think you're wasting your time with the conversion unless your entire Type 1 library is pre-1990 vintage and the bitmaps are still using FONT resources rather than NFNTs. <br> <br>Can you clarify why you think this is necessary?</p>
    html_clean: <p>Whoa, now! <br> <br>Why do think your OS 9 fonts are obsolete garbage? <br> <br>Type 1 fonts are perfectly compatible with OS X and Adobe's CS apps. Converting Type 1 directly to OpenType offers no advantages other than a single font file with OTF versus separate outline and screen font files with T1. I think you're wasting your time with the conversion unless your entire Type 1 library is pre-1990 vintage and the bitmaps are still using FONT resources rather than NFNTs. <br> <br>Can you clarify why you think this is necessary?</p>
