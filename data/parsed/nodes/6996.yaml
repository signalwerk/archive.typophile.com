  votes: null
  html: <p>The dreaded upgrade is here and suddenly all my OS9 fonts are obsolete garbage. Adobe CS came with some nice fonts, but our shop needs so much more. <br> <br>On a lark, I downloaded Fontlab for OS X and opened a Type 1 font from OS 9. I exported it as OpenType, set some type with it in InDesign, made a PDF, opened it in Acrobat, preflighted it, and printed it to a Postscript Level 2 laser printer. Whoa. <br> <br>Did that really work? It can't be that easy. Can I batch-process 300 fonts to OpenType with Fontlab and keep production running smoothly? The boss would think I was god if I could pull that one off.</p>
  html_clean: <p>The dreaded upgrade is here and suddenly all my OS9 fonts are obsolete garbage. Adobe CS came with some nice fonts, but our shop needs so much more. <br> <br>On a lark, I downloaded Fontlab for OS X and opened a Type 1 font from OS 9. I exported it as OpenType, set some type with it in InDesign, made a PDF, opened it in Acrobat, preflighted it, and printed it to a Postscript Level 2 laser printer. Whoa. <br> <br>Did that really work? It can't be that easy. Can I batch-process 300 fonts to OpenType with Fontlab and keep production running smoothly? The boss would think I was god if I could pull that one off.</p>
