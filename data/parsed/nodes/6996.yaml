    votes: null
    html: <p>Jefferson <br> <br>There has been a long ongoing thread on this regard over at T-D (Type-Design). It may be possible to convert a standard PS1 to OT but batch conversion is a bit problematic at this point, especially if you are trying to combine certain fonts, say a font that also has a separate Expert set. Besides the encoding problem, PS1 fonts don't share kerning pairs. <br> <br>While I do agree that conversion will become a necessity, simply because at some point down the type road Adobe and Microsoft apps are not likely to support PS1, at this point I really don't see how this can be effectively done in any form of batch process (despite the proposed and much delayed FontLab TransTypePro).</p>
    html_clean: <p>Jefferson <br> <br>There has been a long ongoing thread on this regard over at T-D (Type-Design). It may be possible to convert a standard PS1 to OT but batch conversion is a bit problematic at this point, especially if you are trying to combine certain fonts, say a font that also has a separate Expert set. Besides the encoding problem, PS1 fonts don't share kerning pairs. <br> <br>While I do agree that conversion will become a necessity, simply because at some point down the type road Adobe and Microsoft apps are not likely to support PS1, at this point I really don't see how this can be effectively done in any form of batch process (despite the proposed and much delayed FontLab TransTypePro).</p>
