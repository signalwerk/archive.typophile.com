    html: "<p>I finally completed the process. Over 800 fonts in perhaps 140 families were converted manually to Open Type CFF. Mostly Type 1, and a few True Types. <br> <br>After conversion, I had to go back and redo the entire process: I had left out the Open Type naming fields, and the computer thought every font was \"regular.\" The names required manual correction in most cases. FontLab tended to call everything \"regular\" by default. Doh!-the time that wasted! Finally got it sorted out and am about to make a specimen book. If only OS X had a specimen book utility. <br> <br>I also created a few faked sloped fonts for romans that didn't have italics. (Yes, shame on me.) It's disturbingly easy to slant every glyph by x degrees with the push of a button�the world is going to hell in a handbasket. <br> <br>With a little practice, a careful use of FontLab's features could yield a serviceable set of small caps &amp; oldstyle figures from some faces. This program is great.</p>"
    html_clean: "<p>I finally completed the process. Over 800 fonts in perhaps 140 families were converted manually to Open Type CFF. Mostly Type 1, and a few True Types. <br> <br>After conversion, I had to go back and redo the entire process: I had left out the Open Type naming fields, and the computer thought every font was \"regular.\" The names required manual correction in most cases. FontLab tended to call everything \"regular\" by default. Doh!-the time that wasted! Finally got it sorted out and am about to make a specimen book. If only OS X had a specimen book utility. <br> <br>I also created a few faked sloped fonts for romans that didn't have italics. (Yes, shame on me.) It's disturbingly easy to slant every glyph by x degrees with the push of a button�the world is going to hell in a handbasket. <br> <br>With a little practice, a careful use of FontLab's features could yield a serviceable set of small caps &amp; oldstyle figures from some faces. This program is great.</p>"
