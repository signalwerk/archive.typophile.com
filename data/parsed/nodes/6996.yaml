    html: <p>Grant, <br> <br>I've tried running the fonts in question on OS X, which largely refuses to recognize them. Even Classic mode only sees about 18 out of 300. And Quark 4.1 only sees three of those in Classic mode. And it all crashes at the drop of a hat. For a number of reasons, we're moving to OS X and Creative Suite. <br> <br>Gerald, <br> <br>Thanks. I'll look for the thread you mentioned. I'm not absolutely opposed to doing all this manually, but I have to convince the boss that it can be done - and done successfully - for x number of dollars. The cost of Fontlab is equal to the budget I have for fonts, so it's an intriguing proposition.</p>
