    html: <p>Yeah that makes sense. That's exactly what I want to do. <br> <br>I've got four font styles in the family Paralucent. Each style has a family name that matches its unique style. For instance, Paralucent-Bold belongs to the family Paralucent-Bold. My goal is that it would belong to Paralucent. <br> <br>Is there another utility that can do this? Perhaps something without the $549 price tag? ;)</p>
