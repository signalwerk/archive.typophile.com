    html: |-
      <p>Yeah, it seems implausible to pay $549 to rename 3 fonts. I'm not a Mac user, but I'd try this. Open your AFM files in Simpletext. You'll see something like this at the top: <br> <br><br>
      </p><blockquote>StartFontMetrics 2.0 <br>FontName Paralucent-Italic <br>FullName Paralucent Italic <br>FamilyName Paralucent-Italic <br>Weight Regular</blockquote><p></p>
      <p> <br>Change that info to this: <br> <br><br>
      </p><blockquote>StartFontMetrics 2.0 <br>FontName Paralucent-Italic <br>FullName Paralucent Italic <br>FamilyName Paralucent <br>Weight Regular</blockquote><p></p>
      <p> <br>Notice the change in FamilyName. Maybe that'll sort you out. <br> <br>Be sure you're not violating your EULA by modifying the information though.</p>
