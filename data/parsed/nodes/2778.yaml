    html: <p>Mac files have two 'forks'. A resource and a data fork IIRC. All of the font info resides in the resource fork, which a PC doesn't read (PC files have only one 'fork').  <br> <br>I have to jump back &amp; forth between platforms sometimes, and on my PC I use a piece of software called TransMac. It'll take a Mac file &amp; write a file that a PC understands. Pretty cheap to license, too.</p>
