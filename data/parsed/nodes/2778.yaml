    html: <p>You can use FontLab to change the info in the font header - Family name, Style name, etc. In lieu of that, I believe you can open the AFM file in a text editor and change the info there. <br> <br>I'm assuming that the Family name is something like 'Fontname-Regular'. If you want them to not be their own unique entries, then the Family name should be just 'Fontname' for each font, the Style name should be 'Regular', &amp; the Font name should be 'Fontname Regular'. Same for the other members of the family (e.g., italic, bold, bold italic). <br> <br>If you want a huge family (i.e., more than 4 members) to be contained in one family, you'll need to add OpenType names in FontLab. The family name for every font will be the same, and the Style names will all be different. <br> <br>Maybe this makes sense? I don't think I'm at my most lucid today ;-)</p>
    html_clean: <p>You can use FontLab to change the info in the font header - Family name, Style name, etc. In lieu of that, I believe you can open the AFM file in a text editor and change the info there. <br> <br>I'm assuming that the Family name is something like 'Fontname-Regular'. If you want them to not be their own unique entries, then the Family name should be just 'Fontname' for each font, the Style name should be 'Regular', &amp; the Font name should be 'Fontname Regular'. Same for the other members of the family (e.g., italic, bold, bold italic). <br> <br>If you want a huge family (i.e., more than 4 members) to be contained in one family, you'll need to add OpenType names in FontLab. The family name for every font will be the same, and the Style names will all be different. <br> <br>Maybe this makes sense? I don't think I'm at my most lucid today ;-)</p>
