  html: <p>I'm sure this has been discussed, but my searches have turned up empty. <br> <br>Is there a way to change the properties of a font in Mac OS X? The reason I ask is that I've just purchased a font that came with several different weight variations. When the font is opened in FontBook, though, each variation is displayed as it's own unique font family. <br> <br>Is there a way for me to change this? <br> <br>Thanks in advance.</p>
  html_clean: <p>I'm sure this has been discussed, but my searches have turned up empty. <br> <br>Is there a way to change the properties of a font in Mac OS X? The reason I ask is that I've just purchased a font that came with several different weight variations. When the font is opened in FontBook, though, each variation is displayed as it's own unique font family. <br> <br>Is there a way for me to change this? <br> <br>Thanks in advance.</p>
