      <p>On the “technological rat race” I think we should consider ourselves fortunate to have it at our disposal. While it has convinced countless desktop publishers to think they’re a designer because they have some Adobe products (or Microsoft Word, for that matter) it is more of a good thing because lots of people can experiment on their own without ungodly production costs. </p>
      <p>Creativity wise, I agree that as long as you’re OK with what you’re doing then it shouldn’t matter. I don’t pay too much attention to what’s going on with other designers but I should... visual stimulation is good whether it comes from the 1800s or 2007. </p>
      <p>I also agree that there has to come a point in an artists life where you say “to hell with it” and focus less on technique and more on expression. Musically, I think your technique can constantly be developed, if you want to. It’s a process of reaching a plateau and then resting there then climbing to the next one. The more skilled you are the longer it takes to reach the next one. I think that transfers to the design world as well... you can still improve your technique even if all you’re doing is experimenting and expressing.</p>
