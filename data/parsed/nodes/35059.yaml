      <p>As a design student, I do my best to reject what’s being produced by most working designers, and I do an inordinate amount of historical research. So my stuff is devoid of centered type, ornament, swooshes, swirls, concentric circles, random unrelated photos and/or illustrations, texture, damage, and wear. As a result, nobody ever gets to accuse me of following trends. At least contemporary trends, anyway.</p>
      <p>I do, however, appropriate ideas from movies. And I absorb a great deal about layout methodology from books and magazines, but that’s much more picking up the why than borrowing the what.</p>
      <p>The exception is those designers at Experimental Jetset. They’re just so cool that I get their stuff stuck in my head for weeks, but they’re on the same modernist vibe that I want to be.</p>
