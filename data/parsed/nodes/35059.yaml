      <p>I am not a type designer so hanging out here doesn’t really qualify as checking my peer group - I like the thought process that goes into type and I learn from that and just the glyph (the microcosm of what I do).</p>
      <p>At a certain point you have enough influences and it’s time to stop practicing and start playing - time to get into the philosophy instead of the technique of any given art form. That’s my take anyway - I know there are millions of ways to work.</p>
      <p>I know in music that the technique should be a non-issue by the time you’re in your mid twenties (there are exceptions), if you’ve put in the time, at that point you can play whatever you want, then it’s time to decide just what that might be. That’s when the philosophy of music becomes the thing - which in turn becomes the philosophy of life itself, which in the end is the great work.</p>
      <p>The sad part about what we do as designers is that the damn techniques change all the time, not like playing an instrument at all.</p>
      <p>pbc</p>
