      <p>Perhaps I understand the question better with more context, Paul. I was originally seeing it in a Type/Graphic design perspective, and more specifically, in a client/creative worker relationship.</p>
      <p>It is no more dangerous to look at contemporaries for inspiration, than to look at a specific moment in the past. In the now, there are rough diamonds that others bring to the surface, in the past are buried polished gems. Inspiration always comes from somewhere. A broad historical study is smart. Researching a specific moment has a novelty quality that is marketable, but otherwise is roughly equivalent to emulating contemporaries (which is not the same thing as being aware of them).</p>
      <p>If you only compete with yourself, you are guaranteed to succeed. And, to come in second every time. Not that that matters; I recommend exploring and challenging yourself, and just assume you are continually getting better if the new challenges are still interesting.</p>
      <p>If you work is to affect anyone, they they are your client. In entertainment, people claim are looking for risks and surprises, so you have a leeway that other jobs don’t afford you. Even if there is no one else you want to reach or impact, then you are still your own audience. So, aside from habit or competence, what makes you listen to yourself?</p>
      <p>Every now and then, do something you totally shouldn’t, aren’t prepared for, people wouldn’t know was you if they heard it, something that is possibly even just plain silly (or totally serious if you are generally lighthearted). Take it all the way, as if you were serious (or reverse). Projects like that sometimes teach things that you don’t even realize for a while, and develop “muscles” that you can flex inside your usual repertoire.</p>
