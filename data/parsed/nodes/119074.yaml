    <p>Many diacritic marks occupy two different unicode positions. One of which is the non-spacing, combining glyphs; the other being the standard spacing, non-combining glyphs. Are there reasons to include both in a font? If so, what are those reasons?</p>
    <p>Also, when creating composite glyphs with diacritics, is it better to reference the combining glyphs as components or the non-combining equivalent glyphs? Or does it matter?</p>
    <p>After a few Google searches, I can't seem to find anything directly addressing these questions. The fonts I've opened in FontLab, are a bit inconsistent in all this.</p>
