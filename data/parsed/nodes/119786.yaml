      <p>Even when they appear to be sans serif fonts, the roman glyphs of many of these non-Western typefaces turn out to be common serif faces with those serifs chopped off.</p>
      <p>I believe we are looking at a version of Times New Roman Bold or Extra Bold—minus its serifs.</p>
      <p>A sans serif that comes close is Intrinseca:<br><a href="https://web.archive.org/web/20191011010344/http://www.myfonts.com/fonts/aviation/intrinseca/">http://www.myfonts.com/fonts/aviation/intrinseca/</a></p>
