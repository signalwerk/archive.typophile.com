    html: <p>Don't know either the origin font of this specific Latin counterpart. Those who mimic this style are mainly illegal chopped-off serifs Times or bad attempts to create a "Times Sans Serif" ('Times Sans Serif', 'Balham', 'TimesNoRoman'...). The only fair sans-serif rework I know is Jason Vandenberg's <a href="https://web.archive.org/web/20191011010344/http://www.myfonts.com/search/bodoni+sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bodoni Sans</a> but it's obviously not based of Times New Roman.</p>
