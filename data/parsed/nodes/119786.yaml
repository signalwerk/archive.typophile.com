  html: |-
    <p>I know the font names that these characters appear in. The fonts are called Bangla MN Bold, Gurmukhi MN Bold, Kannada MN Bold, Malayalam MN Bold, Oriya MN Bold, Sinhala MN Bold — you get the idea. All these fonts share the same characters from ASCII 0 to 128 or so. Then they contain different characters depending on the name.</p>
    <p>I'd like to know what the original font for all these typefaces is. It's not quite Optima, but not quite anything else I know either. What's the nearest typeface to this style?</p>
    <img typeof="foaf:Image" class="img-responsive" src="https://web.archive.org/web/20191011010344im_/http://www.typophile.com/sites/default/files/old-images/Screen%20Shot%202014-09-22%20at%2020.47.30.png" width="801" height="450" alt="">
