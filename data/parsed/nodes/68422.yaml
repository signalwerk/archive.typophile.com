  html: |-
    <p>Last year, when the first Taschen book "A Visual History of Typefaces and Graphic Styles, Vol. 1" popped up on an Amazon ad, I bought it immediately. After coveting it in close proximity, pouring over beautiful pages, I knew I was smitten. Shortly thereafter, the second volume appeared for preorder and I could not resist temptation. Yesterday, volume 2 arrived and did not dissapoint.</p>
    <p>I opened the book and that wonderful smell that says "Book" tickled my nasal passages. I felt like I had just sat down at the rare book section of the New York Public Library in Manhattan. It doesn't smell like book as in "Barnes &amp; Noble store at the Mall", it smells like loved and cared for printing and typography with lucious plates of books gone by.</p>
    <p>If you are the typical person who visits Typophile, you will surely love these two volumes as visual, verbal, and olfactory treasure troves.</p>
    <p>ChrisL</p>
