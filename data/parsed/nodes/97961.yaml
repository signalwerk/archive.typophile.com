      <p>Now this may not look it, but redrawing that m so it connected at the top really turned out to be quite a challenge. Here's what I have so far: </p>
      <p>I connected the b to the rest of the logotype, which I had not done initially as its shape was supposed to stand out. The maple seed thing. I changed my mind about that, so now it is connected.</p>
      <p>The m is "turned around" as always, I am not entirely sure about the incline. Is there any kind of rule or a guide for finding the axes of something as non-geometrical as this lettering? If so, I would certainly love to read it, this is always giving me a hard time.</p>
      <p>Also, Hrant, you mentioned some of the beziers not being so good. Could you elaborate on that a little? I would like to do as good job as I can and if you have any pointers to share I would be keen to hear them!</p>
      <p>I have attached the latest version complete with nodes and outlines.<br>
      Thanks for your feedback!</p>
