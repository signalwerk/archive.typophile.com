    <p>Hello eyeryone!<br>
    This time my client is an industrial designer who has come up with a cross between a portaledge (in case you have no idea what that is, check this out: ) and a treehouse. A portable treehouse. </p>
    <p>The chosen name for this miracle of workmanship is "Cambai", which is an alternate spelling of "Kambai" a tree-living tribe from Indonesia that build their dwellings at a height of vertigo-inducing 30 - 40 feet of the ground and, you probably guessed it, the sound of "come by".</p>
    <p>The product is built with rather soft curves, I chose to reflect that in the logo as well. A maple seed is hinted at in the shape of the "b", which is a symbol the designer chose herself. She felt it reflected best the closeness to trees and the idea of being able to move to another location at any given time.</p>
    <p>I have had some fun with the letters, but unfortunately I have reached an impass. It is not yet finished, but I can't for the life of me think, what else to change. Your input is therefore very much appreciated!</p>
