    html: <p>I love the way it looks, but frankly I'm having trouble with the <strong>m</strong>. My eye keeps reading <strong>canibai</strong>, <strong>caiubai</strong>, or <strong>cawbai</strong>. If this were a familiar word such as <em>camera</em>, I think readers would decode the letter easily from context, but because this is an unfamiliar word, readers must decode it letter by letter, and the <strong>m</strong> may trip them up.</p>
