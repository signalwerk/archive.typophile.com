      <p>He healed up just fine.  Thanks for asking.  But his accident is scary to me in retrospect because during my life I've had 2 friends who broke their necks due to falls and both ended up paralyzed. So I'm very wary of falls. Even a relatively small fall can break a neck if you land wrong. </p>
      <p>Thanks for the link; your treehouse looks very cool, almost like a space ship. I'm sure kids will like it. </p>
      <p>Hard to evaluate safety without examining it in person. I'm glad there is netting over the windows. My main concern might be how well the fabric holds up. The description says "weather resistant", but all fabric deteriorates over time when outside. Even heavy-duty commercial awnings can eventually rip.</p>
      <p>But anyway it looks like a nice project; good luck with it.</p>
