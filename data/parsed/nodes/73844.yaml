    <p></p><div class="imageWrap"><img src="http://typophile.com/files/I_Want_You_3918.jpg"></div><br>
    <a href="http://www.iwantyoumagazine.com" rel="nofollow"><strong>ORDER FREE PRINT COPY</strong></a><br>
    I WANT YOU magazine’s focus is to highlight artists’ work rather than dilute its impact by enforcing editorial perspective. Each page of the print edition consists of a single large format image from a series of each artist’s work and a url that leads you to their feature on <a href="http://www.iwantyoumagazine.com" rel="nofollow">iwantyoumagazine.com.</a>  I Want You magazine features a broad range of artists from around the world, exclusive art work, and spotlights on forgotten or overlooked artists.<p></p>
    <p>Issue 4 Features:<br>
    <a href="http://www.iwantyoumagazine.com/christian-petersen-4/" rel="nofollow">Christian Petersen</a> / <a href="http://www.iwantyoumagazine.com/syoichiro-nishimoto/" rel="nofollow">Syoichiro Nishimoto</a> / <a href="http://www.iwantyoumagazine.com/jeffrey-meyer/" rel="nofollow">Jeffrey Meyer</a> / <a href="http://www.iwantyoumagazine.com/mark-owen/" rel="nofollow">Mark Owen</a> / <a href="http://www.iwantyoumagazine.com/conny-prantera/" rel="nofollow">Conny Prantera</a> / <a href="http://www.iwantyoumagazine.com/duncan-malashock/" rel="nofollow">Duncan Malashock</a> / <a href="http://www.iwantyoumagazine.com/hisham-bharoocha/" rel="nofollow">Hisham Bharoocha</a> / <a href="http://www.iwantyoumagazine.com/lydia-anne-mccarthy/" rel="nofollow">Lydia Anne McCarthy</a> / <a href="http://www.iwantyoumagazine.com/ryan-riss/" rel="nofollow">Ryan Riss</a> / <a href="http://www.iwantyoumagazine.com/black-lodge/" rel="nofollow">Black Lodge</a> / <a href="http://www.iwantyoumagazine.com/correa-and-bartoletti/" rel="nofollow">Frank Correa &amp; Nick Bartoletti</a> / <a href="http://www.iwantyoumagazine.com/christian-usera/" rel="nofollow">Christian Usera</a> / <a href="http://www.iwantyoumagazine.com/rossina-bossio/" rel="nofollow">Rossina Bossio</a> / <a href="http://www.iwantyoumagazine.com/davidope/" rel="nofollow">davidope</a> / <a href="http://www.iwantyoumagazine.com/bettina-chanel/" rel="nofollow">Bettina Chanel</a> / <a href="http://www.iwantyoumagazine.com/chantal-young/" rel="nofollow">Chantal Young</a> / <a href="http://www.iwantyoumagazine.com/ben-branagan/" rel="nofollow">Ben Branagan</a> / <a href="http://www.iwantyoumagazine.com/stellar-om-source/" rel="nofollow">Stellar Om Source</a><br>
    Includes poster by <a href="http://www.iwantyoumagazine.com/downloads/" rel="nofollow">Devon Varmega</a>, and 7″ record with exclusive tracks from <a href="http://www.iwantyoumagazine.com/downloads/" rel="nofollow">Shabazz Palaces</a> and <a href="http://www.iwantyoumagazine.com/downloads/" rel="nofollow">Stellar Om Source</a>.</p>
