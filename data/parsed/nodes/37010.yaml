    html: <p>"Calligraphy -- Specimens" gets over 600 hits on <a href="http://www.worldcat.org" rel="nofollow">Worldcat</a>, while variations like "Calligraphy--Samples" or "Calligraphy--Specimen book" or "Calligraphy--Examples" have fewer hits.</p>
    html_clean: <p>"Calligraphy -- Specimens" gets over 600 hits on <a href="http://www.worldcat.org" rel="nofollow" class="link-external">Worldcat</a>, while variations like "Calligraphy--Samples" or "Calligraphy--Specimen book" or "Calligraphy--Examples" have fewer hits.</p>
  - id: 226383
