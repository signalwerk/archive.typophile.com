    date: 2007-09-11T16:14:00
    date_raw: 11 Sep 2007 — 4:14pm
    votes: null
    html: <p>Specimen is applicable for a display of styles, especially scribes showing their work, but I think that manual is the correct term when the collection is intended to be, well, a manual.</p>
