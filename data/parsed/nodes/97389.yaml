    html: "<p>These are not fonts, they are painted by hand. If you want this look, it's best to have a <a href=\"http://pinboard.in/u:stewf/t:letterer\" rel=\"nofollow\">lettering artist</a> do it. If you must use type, here are some related sources: <a href=\"http://www.houseind.com/fonts/signpainterfontkit\" rel=\"nofollow\">Sign Painter Font Kit</a>, <a href=\"http://www.myfonts.com/foundry/Comicraft/?refby=typographica\" rel=\"nofollow\">Comicraft</a>, <a href=\"http://www.myfonts.com/foundry/Filmotype/?refby=typographica\" rel=\"nofollow\">Filmotype</a>.</p>"
