  html: |-
    <p>This is a DVD cover for a client who's giving advice to caregivers to minimize their stress and help them care for their own needs. Their patients are physically/mentally disabled adults - some elderly, some young with brain injuries from war.</p>
    <p>I wanted a very legible and dignified but soft and friendly font - not so easy to find - so I chose Eigerdahls, a recent release.</p>
    <p>The client described the concept she wanted in the illustrations, using a couple of clip art things from Word - a contrast between the stressful, hectic "Before" and calm "After". She was vague about the design though. I came up with this. She was pleased with it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/what about me_5204.jpg"></div><p></p>
