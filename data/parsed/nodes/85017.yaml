    <p>I wanted to increase the line-spacing of a font, so I increased the values of these:</p>
    <p>WinAscent<br>
    hhea Ascender<br>
    Typo Ascender</p>
    <p>This worked as expected on Linux, but in WordPerfect on Windows XP, nothing changed. What could I have missed? Also, does more also need to be done for other platforms, like OS X and Java?</p>
