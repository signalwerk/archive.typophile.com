    <p>Hi people!</p>
    <p>I was just about to send a pdf to the printer when it struck me - how should a copyright line really be written, are there any rules?</p>
    <p>I opened five books from respectable publishers (mainly US/UK) and found five alternatives (not to give undue credit/critique to anyone I've replaced the copyright holder with a random name):</p>
    <p>Copyright © 2009 colaboy<br>
    copyright © colaboy, 2009<br>
    Copyright © 2009 by colaboy<br>
    Copyright © colaboy 2009<br>
    © colaboy 2009</p>
    <p>I've also come across:</p>
    <p>©2009 colaboy<br>
    ©colaboy, 2009<br>
    etc</p>
    <p>What usage do you makers/users of the symbol suggest? </p>
    <p>Daniel</p>
