      <p>I usually do it as:</p>
      <p><strong>Copyright © 2009, author</strong></p>
      <p>Or if colophon is typeset with little headings:</p>
      <p><strong><em>Copyright</em><br>
      © 2009, author</strong></p>
      <p>(so only when are also:</p>
      <p><em>Design</em><br>
      Name of designer</p>
      <p><em>Printing</em><br>
      Name of printer</p>
      <p>etc.)</p>
      <p>Or:</p>
      <p><strong>Copyright © 2009, author, place of publication</strong></p>
