      <p>Assuming we're talking about the U.S. here, this is addressed in §401b of the U.S. Copyright Code:</p>
      <p>(b) Form of Notice.—If a notice appears on the copies, it shall consist of the following three elements:<br>
      &nbsp;  (1) the symbol © (the letter C in a circle), or the word “Copyright”, or the abbreviation “Copr.”; and<br>
      &nbsp;  (2) the year of first publication of the work; in the case of compilations or derivative works incorporating previously published material, the year date of first publication of the compilation or derivative work is sufficient. The year date may be omitted where a pictorial, graphic, or sculptural work, with accompanying text matter, if any, is reproduced in or on greeting cards, postcards, stationery, jewelry, dolls, toys, or any useful articles; and<br>
      &nbsp;  (3) the name of the owner of copyright in the work, or an abbreviation by which the name can be recognized, or a generally known alternative designation of the owner.</p>
      <p>You can find this information in Chapter 4 of Title 17:<br>
      <a href="http://www.copyright.gov/title17/" title="http://www.copyright.gov/title17/">http://www.copyright.gov/title17/</a></p>
      <p>This doesn't necessarily prescribe the order "Copyright, date, author", but that's how I usually see it and do it myself. Redundancy of word and symbol is optional.</p>
      <p>-- Kent.</p>
