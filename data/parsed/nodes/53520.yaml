      <p>&gt; Copyright-notice is obsolete. The fact that you publish establishes copyright.</p>
      <p>A physical notice is useful if you have to prosecute an infringement case. Putting a notice on your material means that the defendant can't claim innocent infringement:</p>
      <p><code>401.d) Evidentiary Weight of Notice. — If a notice of copyright in the form and position specified by this section appears on the published copy or copies to which a defendant in a copyright infringement suit had access, then no weight shall be given to such a defendant's interposition of a defense based on innocent infringement in mitigation of actual or statutory damages...</code></p>
      <p><a href="http://www.copyright.gov/title17/92chap4.html#401" title="http://www.copyright.gov/title17/92chap4.html#401">http://www.copyright.gov/title17/92chap4.html#401</a><br>
      <a href="http://www.copyright.gov/circs/circ1.html#noc" title="http://www.copyright.gov/circs/circ1.html#noc">http://www.copyright.gov/circs/circ1.html#noc</a></p>
