      <p>I tyically use this format:</p>
      <p>Copyright © colaboy 2009</p>
      <p>In theory, if you have the symbol, you don't need the word copyright. I suspect people started using both in the days of 8-bit character sets, when one couldn't be sure that the symbol would be correctly displayed if the document were opened on another platform; now it seems to have become conventional.</p>
