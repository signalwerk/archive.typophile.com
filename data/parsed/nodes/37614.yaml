    html: |-
      <p>I don’t mind the ’rawness’ of this. Afterall, isn’t that what photojournalism is? Now, perhaps it’s a bit cliche, given the cut-up jerky ’in the heat of the battle’ bumpers that nearly every newsoutlet uses on TV, but I don’t think we need to eliminate the idea completely. I think it might be worth pushing your idea  bit further with some more sketches. As for your last round, I think the randomness isn’t quite random enough.</p>
      <p>That said, timd has a point that I think holds true in general for most artists...artists make art, it’s the art that really should be the main focus. As such, sometimes the best logo for an artist is a simple typeface set on one line.</p>
