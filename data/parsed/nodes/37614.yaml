      <p>Gotcha Tim, I agree.</p>
      <p>I like your “rawness” comment, aluminum. That was the concept for a personal identity that I developed in school. What “in the heat of the battle” bumpers are you talking about? I didn’t even think to do research on news show logotypes. I try to avoid one cliche and end up with another one.</p>
      <p>I get where you guys are coming from about a simple typeface set on one line but I honestly can’t bring myself to do it. Not only am I compelled to rebel against that but the name is just too long for one line.</p>
