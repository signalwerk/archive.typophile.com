    <p>These logotypes are for a photojournalist. I didn’t want to create a mark that would draw attention away from the work so I stuck with type.</p>
    <p>It needs to be simple and stripped of too much connotation, yet have a grunginess to it.</p>
    <p>She covers fashion, concert, and art photography. These seem to suit the project. Let the opinions flow.</p>
