      <p>Let the photographs have the grunginess/grittiness, without having seen the images I think you are possibly creating competition between image and logo rather than a similarity. All that bouciness and faux cut and paste is crying for attention, one should consider where the logo is going to be used, aside from stationery, I would guess that they will appear with the photography on a website or in a portfolio, a potential client wants a photojournalist to be calm under pressure, accurate and punctual, in my opinion those are the qualities you should try to represent.</p>
      <p>Tim</p>
