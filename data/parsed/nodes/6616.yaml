    html: <p>Sylfaen was designed for Microsoft in 1998 by John Hudson and W. Ross Mills of Tiro Typeworks, and Geraldine Wade of Monotype Typography. Sylfaen is a Welsh word meaning "foundation"; an apt name since the font stemmed from research into the typographic requirements of many different scripts and languages. <br> <br>This version of Sylfaen supports the WGL4.0 character set, for Pan-European language coverage. In addition to Latin, Greek and Cyrillic letterforms, the font contains the characters necessary for support of the Armenian and Georgian languages. <br> <br>and thet's the description in the font.</p>
    html_clean: <p>Sylfaen was designed for Microsoft in 1998 by John Hudson and W. Ross Mills of Tiro Typeworks, and Geraldine Wade of Monotype Typography. Sylfaen is a Welsh word meaning "foundation"; an apt name since the font stemmed from research into the typographic requirements of many different scripts and languages. <br> <br>This version of Sylfaen supports the WGL4.0 character set, for Pan-European language coverage. In addition to Latin, Greek and Cyrillic letterforms, the font contains the characters necessary for support of the Armenian and Georgian languages. <br> <br>and thet's the description in the font.</p>
  - id: 46424
