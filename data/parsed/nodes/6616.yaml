  html: <p>I wonder if someone might be able to give a bit of subjective advice.  <br> <br>I need to get hold of an everyday workhorse range of fonts that support the slightly unusual accented vowels in Welsh (w and y) for MacOS X 10.3. Ideally not costing hundreds of pounds per family, as its just for my personal Welsh coursework. <br> <br>I've Googled it, but the quality of what I've found so far tends to be a little bit... suspect. At least, I'd not want to start forking out cash without some sort of assurance of the quality of the typefaces from unknown vendors. <br> <br>The ideal would be something along the lines of Perpetua, or a Garamond. <br> <br>Does anyone have any ideas, or indeed any general advice on using those pesky characters under MacOS? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
  html_clean: <p>I wonder if someone might be able to give a bit of subjective advice.  <br> <br>I need to get hold of an everyday workhorse range of fonts that support the slightly unusual accented vowels in Welsh (w and y) for MacOS X 10.3. Ideally not costing hundreds of pounds per family, as its just for my personal Welsh coursework. <br> <br>I've Googled it, but the quality of what I've found so far tends to be a little bit... suspect. At least, I'd not want to start forking out cash without some sort of assurance of the quality of the typefaces from unknown vendors. <br> <br>The ideal would be something along the lines of Perpetua, or a Garamond. <br> <br>Does anyone have any ideas, or indeed any general advice on using those pesky characters under MacOS? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
