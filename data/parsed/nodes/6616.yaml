    html: <p>Sylfaen on WinXP has W, Y with acute, grave, dieresis, and circumflex and it comes on Windows or in Office. It was designed by John Hudaon, who has some connection with Wales and Geraldine Wade who is from Wales. So if you have a Windows machine the .ttf will load on OSX. <br><img src="http://www.typophile.com/forums/messages/30/48682.gif" alt=""></p>
