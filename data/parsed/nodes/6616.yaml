    html: <p>Several of Adobe's type families support "extended Latin" which includes Welsh. Minion Pro and warnock Pro are among those which do (also Myriad Pro and Sava Pro, which are not likely to be of interest for this purpose). <br> <br>Additionally, a number of the typefaces we expect to release in the next 6-8 months will also have such support. <br> <br>Regards, <br> <br>T</p>
