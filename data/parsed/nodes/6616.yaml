    votes: null
    html: "<p>The only limitation of Sylfaen is that it exists only in a single weight and style: no italic, no bold, etc. This is because it was originally made for a research project, and not intended to be shipped. <br> <br>The Welsh diacritic characters you need are  available in all the Windows core fonts, including Times New Roman, Arial, etc. and also Palatino Linotype, Georgia, Verdana, etc.</p>"
