    <p>Hi,</p>
    <p>Can someone please tell me the name of this lovely serif from the magazine House &amp; Garden? It really does look like Big Caslon but in a bold or black version, that I haven't been able to find.</p>
    <p>(The sans is Gotham in case (probably not) someone was wondering)</p>
    <p>Best Peter</p>
