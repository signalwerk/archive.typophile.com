      <p>with all due respect that isnt a logo. its text in a box. very amateur ’oooo look ive just discovered photoshop’. Lets get to the point ’ITS CRAP!’</p>
      <p>If he wants to keep it...why is he asking for a designer to do a new one? classic arrogance. Its one thing for the client to steer things to their liking, it is afterall for them...but quite another to insist they know your job better than you.</p>
      <p>you dont go telling a carpenter how to make a table do you.</p>
      <p>—-</p>
      <p>what works in your favour, is the guy prob knows nothing, and is just trying to ’be in charge’ so some tact is needed. just do a design, use the copy, but not the design hes supplied...and tell him youve re-worked ’his’ design, keeping the flavor of the original logo etc etc...just butter his ego...</p>
      <p>thats whats really required.</p>
