    <p>Has anybody here hinted for cleartype?</p>
    <p>Would you be willing to describe how it is the same as &amp; how it differs from hinting for true type? Also, does anybody know if it is  basically the same hinting data? So for example - if it is the same data, then theoretically you cannot have a font hinted for both true type &amp; clear type at the same time without making a compromise in each. Correct? ( Or making two fonts - hinted one way &amp; another one hinted the other way). </p>
    <p>Also any hints about a baseline setup in terms of equipment &amp; software would be good to know about too. I was thinking of buying a LCD screen to replace my CRT but I want to make sure it will be useful for checking my hinting. I think you need a minimum ppi of 120+ or so. Correct? Since the ppi shifts on monitors now alot what is a good strategy if you are not going to buy 3 reference monitors? ( check your enighbor's?)</p>
    <p>If I am not mistaken all the talk on typophile about cleartype so far has been in reaction to it rather than talking about how to do it. Did I miss somehing?</p>
    <p>Thanks!</p>
