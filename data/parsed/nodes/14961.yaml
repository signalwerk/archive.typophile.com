      <p>"True type hinting is geared to b/w bitmaps and is somewhat heavy handed"</p>
      <p>Well, the hints are the same in TT and CT, as you know 'tis one hinting language...</p>
      <p>The two rasterizers use incongruent theories of pixel recognition and don't interpret the hints the same. I find the whole CT activities list to be wanting from the failure to recognize an important typographic principle of low resolution being: that you can't hint parts of a font (safely) any more than you can stop part of a train, (safely). But they will try.</p>
      <p>And, "don't worry" about spacing 'cause there is nothing you can do about it, MS's "quadrupled" the resolution and "solved" that problem, meaning you can't even control it if you want to...;) But VC's comments are, though masking some bias, accurate. E.G. when he says the diagonals get heavy, he's right!</p>
