      <p>Also as Si said hinting for CT is 'light' hinting. The hints in the Y direction are used and in the X direction they are not for the most part. Many people hinting for CT are hinting in Y and not doing much in X. </p>
      <p>Also it's not worth spending too much time messing around with tweaking for a specific CT display (such as the normal CT mode in VTT). You don't know what kind of CT display the font will be used on.  Or has the user tweaked their CT settings? Is the display horizontal or vertical? Is it a tablet PC ?</p>
      <p>Generally all I've done is address some problems that CT creates such as diagonals have a tendancy to become heavy (as apposed to in Grey they are light). Some stems like the Capital H, I , L maybe light or heavy because they have a sub pixel that is darker than others. In these cases I use function 77 in the glyphs local instructions to move the outline. Function 77 acts like a delta hint and moves a point through a range of sizes. it checks a flag that is set by function 84 to see what mode the rasterizer is in. If we are in CT then the exception is processed. </p>
      <p>vincent</p>
