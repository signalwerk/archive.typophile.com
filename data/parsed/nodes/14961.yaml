      <p>&gt;By adding to function 84 and copying the same method that VTT does for Grey and using the GETINFO instruction and the value 8192 instead of 4096 for grey, you can hint for grey, binary or CT.</p>
      <p>I am hinting Devanagari font using VTT and have 1 problem with cleartype only deltas (function 77). As I understand it is enough to change the definition of function 84 to make function 77 work for cleartype as for greyscale. I tried to do this but my knowledge is not enought - the change of value to 8192 is not enough, other selectors also must be changed. </p>
      <p>By defoult the definition of 84 is such -</p>
      <p>FDEF[],84<br>
      #BEGIN<br>
      #PUSHOFF<br>
      #PUSH,2,0<br>
      WS[]            /* s[2] = grey scaling: off (by default) */<br>
      #PUSH,35,1      /* 35 = MS Rasterizer version 1.7 */<br>
      GETINFO[]       /* 1 = tell GETINFO to give us the rasterizer version */<br>
      LTEQ[]          /* 35 &lt;= version ? */<br>
      #PUSH,64,1      /* 64 = highest rasterizer version assigned to MS */<br>
      GETINFO[]       /* 1 = tell GETINFO to give us the rasterizer version */<br>
      GTEQ[]          /* 64 &gt;= version ? */<br>
      AND[]           /* 35 &lt;= version &amp;&amp; version &lt;= 64 ? */<br>
      IF[]            /* if so, we're running MS rasterizer version 1.7 or higher */<br>
        #PUSH,4096,32 /* 4096 = flag returned by GETINFO if grey scaling bit is on */<br>
        GETINFO[]     /* 32 = tell GETINFO to give us the grey scaling bit */<br>
        EQ[]          /* 4096 == flag ? */<br>
        IF[]          /* if so, we're running under grey scaling */<br>
          #PUSH,2,1<br>
          WS[]        /* s[2] = grey scaling: on (by now) */<br>
        EIF[]<br>
      EIF[]<br>
      #PUSHON<br>
      #END<br>
      ENDF[]</p>
      <p>In glyph program function 77 is written in this way - CALL[], 33, 64, 11, 2, 77 but visually do not take any effect. </p>
      <p>Maybe somebody can help me - what must be changed in this definition to make function 77 work for cleartype?</p>
