      <p>I have and if you are manually hinting with Microsoft's Visual TrueType there are 2 things you can do. </p>
      <p>It helps to have the ClearType version of VTT and know how to do low level TrueType.</p>
      <p>You need to check the rasterizer with code to see if 'you are in ClearType'. This is a standard function in the 'fpgm' that VTT has and what you need to do is do the same thing as is done for Greyscale checking in VTT's function 84. </p>
      <p>Then in the glyph's instruction that you would like to alter you would have to use low level TrueType to call function 77. That is the function used in VTT for binary or grey scale delta hints. </p>
      <p>By adding to function 84 and copying the same method that VTT does for Grey and using the GETINFO instruction and the value 8192 instead of 4096 for grey, you can hint for grey, binary or CT. </p>
      <p>Also CT ignors Delta hints. You can force it to not ignores them by sticking this in the 'prep'</p>
      <p>/*  use Deltas in ClearType */<br>
      #PUSHOFF<br>
      #PUSH, 4, 3<br>
      INSTCTRL[]<br>
      #PUSHON</p>
      <p>this is a bit dangerous because most Deltas are for Grey or binary.</p>
      <p>vincent</p>
