    html: <p>One thing to watch is spacing. You get the best results if you design and lightly hint a font with ClearType in mind, taking advantage of sub-pixel spacing as well as rendering - the ClearType Collection approach. But if you then decide that b/w rendering is important you can add contextual non-CT hints to improve the b/w rendering, but in the cases I've seen the spacing suffers under b/w even if the bitmaps are nice.</p>
