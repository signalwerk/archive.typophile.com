    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 5.Feb.2010 11.33am </div>
      <p>Find out more about doctoral study at the Department of Typography &amp; Graphic Communication </p>
    <p>Announcing a postgraduate research colloquium &amp; workshop, Tuesday 23 March 2010, 10am-4pm<br>
    Open to potential students, current academics and interested parties.<br>
    A day of talks and other activities including:<br>
    • presentations of staff research activities<br>
    • workshop on writing a research proposal for a PhD<br>
    • a day in the life of a postgraduate research student.<br>
    Assistance with travel to Reading may be available for current UK-based students who are interested in applying<br>
    The event is free of charge, but registration in advance required. For further information or to register, contact<br>
    Carolyn Davidson +44 (0)118 378 6598, c.davidson [at] reading.ac.uk</p>
