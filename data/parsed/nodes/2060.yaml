  - id: 16294
    user: 1250
    date: 2003-11-19T09:20:00
    date_raw: 19 Nov 2003 — 9:20am
    votes: null
    html: "<p>&gt; probably because as each character is repeated <br> <br>I've come to the tentative conclusion that the necessity for letterform \"randomness\" is limited to foveation. What I mean is that as long as the font uses 3 or 4 variants of a glyph (which is the most we can see in the fovea at one time, and that's assuming 3 or 4 of the same letter ever actually happens in sequence...) it's OK, because short-term memory concerning exact glyph shapes probably doesn't survive a saccade. Interestingly, Letterror's FF Kosmik-Flipper uses 3 variants per character. <br> <br>But I've also come to realize there's a much bigger problem: handwritten stuff typically has <i>mistakes</i> in it, which can either be corrected -but visibly- or just left in. This means you need some fancy software to replicate that in order for something to truly appear handwritten... <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; probably because as each character is repeated <br> <br>I've come to the tentative conclusion that the necessity for letterform \"randomness\" is limited to foveation. What I mean is that as long as the font uses 3 or 4 variants of a glyph (which is the most we can see in the fovea at one time, and that's assuming 3 or 4 of the same letter ever actually happens in sequence...) it's OK, because short-term memory concerning exact glyph shapes probably doesn't survive a saccade. Interestingly, Letterror's FF Kosmik-Flipper uses 3 variants per character. <br> <br>But I've also come to realize there's a much bigger problem: handwritten stuff typically has <i>mistakes</i> in it, which can either be corrected -but visibly- or just left in. This means you need some fancy software to replicate that in order for something to truly appear handwritten... <br> <br>hhp <br></p>"
