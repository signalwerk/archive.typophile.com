    html: <p>i agree.. digital handwritten fonts never look quite right. probably because as each character is repeated, it is the exact same glyph, unlike what happnens when something is actually hand written.  <br> <br>on a side note.. does anybody know if there are any, or if it is possible to make a font where you have several (maybe 5 or so) glyphs for each character that are used at random when typing? I always thought this would be something that would help a handwritten digital face look more authentic. <br> <br>Joe- thats a great link, i enjoyed seeing holly's work.. very inspirational.</p>
