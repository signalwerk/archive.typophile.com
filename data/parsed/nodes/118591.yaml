    html: |-
      <p>Because you mentioned Classical Greek text, does the font has to be like SCHOLAR? I like its English version and Russian, but Greek is too different from them. Did you thought about something more "light", where the variation in the width of the stroke would be less? I wouldn't choose Gentium for your purposes. And while GFS Elpis and Minion are also good fonts, I would leave them at the end of list, always considering the Classical Greek text.<br>
      I've tried Warnock Pro and Sirba, which are quite good for typesetting in Greek language, but I'm not sure if they support polytonic...</p>
