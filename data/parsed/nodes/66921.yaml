      <p>It's one small part of a design, but the customer wants a new version, different writing but the exact same font.</p>
      <p>Normally I keep a live version of any text outside the artboard, but somehow in this case I did not. I still have the original .ai</p>
      <p>When I inherited this work-station, there were over four thousand fonts activated- over the last year, I've been trying to get rid of as many as I can. (the previous user installed most of dafont's inventory, and years of other free fonts, on top of an ancient copy of Adobe font folio and a bitstream collection). Somewhere I have a backup of all of these fonts, but I've already gone through about two thouand of them, without any luck.</p>
