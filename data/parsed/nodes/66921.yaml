      <p>I put your image through WhatTheFont and it spit out these similar fonts:</p>
      <p>CCWall Scrawler (Bold Italic, Italic)<br>
      GFY Uncle Junior<br>
      Buffalo Joe<br>
      Flavor (Medium)</p>
      <p>Flavor at medium weight looks to be the closest match to your font, though it has a cleaner, more professional feel.</p>
      <p>--</p>
      <p>4,000+ fonts, good god.  I have just over 1,300 and it's already tough wading through it all.</p>
