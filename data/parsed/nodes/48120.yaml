      <p>I would say lowercase, not smallcaps, and definitely with a period after it: oz.</p>
      <p>I recommend Fowler's rule that abbreviations should always have a period unless they end in the same letter with which the full word ends. Ergo:</p>
      <p>12 onza -&gt; 12 oz.</p>
      <p>but</p>
      <p>Saint John -&gt; St John</p>
