      <p>Kent, that’s really interesting as I tried Bodoni and Joanna along the way. I think Modern serif fonts fit well with Bryant, so Whitman would be a good companion. It looks nice and elegant. </p>
      <p>For my brochure though, I think I’m looking for something more humanist (meaning that Officina Sans and Meta Sans strike me as humanist, and their Serif siblings are built from the same bones). I worry that there’s a bit too much roundness in Bryant, so I’m after something where the curves and counters are a bit less round looking.</p>
      <p>Jos, thanks for posting this; as you know I’m quite excited by Calluna, and especially the italic (vwxyz are enviable). I’m not sure if you’re looking for critique and this isn’t the right thread anyway. As for my brochure, I think it has the right tone but to me the oldstyle stress doesn’t sit very comfortably with Bryant’s unsophisticated geometry.</p>
      <p>It’ll be interesting to see what others think of these combinations.</p>
