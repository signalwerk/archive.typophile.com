    html: <p>Hi, thanks William. I’m not exactly wanting to match characteristics because I think the wide proportions of Bryant won’t allow enough text on the page for extended body copy. I’m creating a brochure with Bryant for headings, subheadings and quotes, then need something to give details and descriptions of services. I need something space-efficient, readable and harmonising (so contrasting rather than matching I guess). I thought the square forms and terminals of Meta Serif would balance out the almost overpowering roundness of Bryant, whilst the vertical stress seems to relate to the geometric and monolinear structure of Bryant in a way that something like Garamond, Sabon or Minion didn’t. And it’s lower contrast than New Baskerville.</p>
