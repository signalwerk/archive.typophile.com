    <p>Hi<br>
    We are rebranding our (training) company and our logo uses Bryant font from Process. I’m wondering if anyone has paired Bryant with a serif font for immersive reading. So far the suggestions have been Officina Serif, Minion and Georgia. To me these don’t quite work and I’ve had a look at Meta Serif, Utopia, Melior and Fedra Serif B. I might licence the first two of these to see which looks nicest and post some samples for crit here, but first of all wondered if anyone had a combination they thought was really successful.</p>
    <p>Unfortunately I’m finding Bryant a bit difficult to use as there’s so much space between the letters and the wide rounded tone feels a bit too cartoony next to very sober fonts (it looked very strange next to Garamond, Minion and New Baskerville!)</p>
    <p>(Actually I thought that Myriad looked neat with Bryant, they do contrast quite well despite both being sans serif designs. Obviously there’s the tension between humanist and geometric, rounded and flat terminals, so maybe that explains it. But our creative director said they didn’t work too well together.)</p>
