      <p>Sometimes dropshadow or glow is a good way to get the text to stand out on a varied contrast background. If it detracts from the text, then it is poorly used. If it adds readability, then it is OK, and if it can be done unnoticeably, all the better.</p>
      <p>It seems the more I work with laying out text, the less special effects appeal to me when done just for the sake of effects. </p>
      <p>Here is an example of a stroke added to "fontplay challenge" to help it stand out in a way that to me is cleaner than a drop shadow:</p>
      <p><a href="http://www.fontplay.com/images2/pricealphabrokesfwillam.jpg" title="http://www.fontplay.com/images2/pricealphabrokesfwillam.jpg">http://www.fontplay.com/images2/pricealphabrokesfwillam.jpg</a></p>
      <p>This dropshadow might be overdone?:</p>
      <p><a href="http://www.fontplay.com/images2/maximilianantiqua.jpg" title="http://www.fontplay.com/images2/maximilianantiqua.jpg">http://www.fontplay.com/images2/maximilianantiqua.jpg</a></p>
      <p>Anyway, in general, I find when I go back and view things I did a long time ago I am sickened by some of the special effects I used. So in my mind caution is advised. No effects (when possible) seem to stand the test of time better.</p>
      <p>(disclaimer: this advice comes from someone who doesn't really know what he is talking about but likes to contribute anyway)<br>
      : )</p>
