    html: <p>&gt;an added value without a real function <br> <br>Mikael, I don't think this argument really holds up to the examples I just linked to, as well as those that BJ has just done. For example, the <a href="http://www.typedesign.com/logos/crom.html" target="_blank">Cromos</a> logo of Jim Parkinson is very well drawn (a modified Futura), and then the red with white outline and black shadow give it a loudness and drama that it wouldn't otherwise have. Of course your personal taste might be something more classic and restrained, but I think it is hard to argue that a restrained style should be everywhere for everything.  <br> <br>I think you do have a point that tarting up a poorly drawn logo with effects is like the proverbial 'putting lipstick on a pig', but hey, lipstick on Marilyn Monroe looked pretty great. And it does on the well drawn 'Cromos' logo too.  <br> <br>On Louise Fili, part of her distinctive genius is integrating illustration and lettering so perfectly as to create something unforgettable. And the drop shadows, when she chooses them, are part of her repertoire.  <br> <br>So I agree with you that shadows can be, and maybe are often misused. But I think it would be a big mistake not to include this technique as part of a graphic designer's repertoire.</p>
