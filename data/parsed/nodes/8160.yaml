    html: <p>I think in my case as a young designer I was "taught" that drop-shadows and gradients look bad and shouldn't be considered. But, like writing instructors insisting on using proper grammar until you're good enough to break the rules, I think this thread contains a lot of great examples where shadowing and grades do enhance a piece because the designer knows how to do it well. <br> <br>In general, I think it's probably better that one does not use drop-shadows because they are difficult to pull off tastefully. Fili, Simonson, and Parkinson are all masters who <i>can</i> pull it off.</p>
