    date: 2004-12-13T18:55:00
    date_raw: 13 Dec 2004 — 6:55pm
    votes: null
    html: <p>The only time a drop shadow is OK with me is when it's behind a cut-out photo object isolated on top of a plain white background. But with type--no, never, please. I'm often getting into mini-confrontations with the art director at my work because he likes drop shadows (he thinks they add "depth," but I prefer flat things to stay flat). I consider shadow effects an unsatisfactory last-resort solution for when you need to set type on top of a busy photo background.  <br> <br>(Psst, don't tell anyone, but I usually tone down the effects in Photoshop *after* the A.D. has approved the design, and if he ever notices afterwards--so far he hasn't--my plan is to blame it on our laser printer or the photo house.) <br> <br>I usually dislike gradients and gratuitous textures also. I guess it's all a matter of taste.</p>
    html_clean: <p>The only time a drop shadow is OK with me is when it's behind a cut-out photo object isolated on top of a plain white background. But with type--no, never, please. I'm often getting into mini-confrontations with the art director at my work because he likes drop shadows (he thinks they add "depth," but I prefer flat things to stay flat). I consider shadow effects an unsatisfactory last-resort solution for when you need to set type on top of a busy photo background.  <br> <br>(Psst, don't tell anyone, but I usually tone down the effects in Photoshop *after* the A.D. has approved the design, and if he ever notices afterwards--so far he hasn't--my plan is to blame it on our laser printer or the photo house.) <br> <br>I usually dislike gradients and gratuitous textures also. I guess it's all a matter of taste.</p>
