  - id: 54641
    user: 1043
    date: 2004-12-17T09:20:00
    date_raw: 17 Dec 2004 — 9:20am
    votes: null
    html: "<p>I think the basic rule with shadow effects has to do with intent and purpose. Putting a shadow on a letter or word takes it out the context of normal text and turns it into a picture of text. The text becomes a simulation of a physical object and is placed in the realm of illustration. To the naive designer or non-designer, it is an impressive effect. It's like it's suddenly become a real object instead of simple flat shapes. <br> <br>I mostly use shadow effects to evoke period styles or to illustrate three-dimensional letterforms such as constructed signs. Of course, in the styles I'm evoking the shadow effects may have originally been used for the same reason that naive designers use them: It's flashy. But, when <i>I</i> use shadow effects, it's part of the arsenal of tools I use to evoke bygone eras. I have to admit, it looks flashy to me too, but I find it difficult to disassociate it from the look of vintage type and lettering. <br> <br>The soft Photoshop-type shadow is a bit different from this because the effect is more photographic, a sort of faux 3-d effect, but the phenomenon of taking text out of context and making it pictoral still applies. I would only use it in an illustrative context. <br> <br>There is also the practical use of shadows often seen on TV an in movies for text that has to appear over changing or moving images as an aid to readability (as in the example Isaac gave above). This is completely different from the illustrative use, although it is sometimes a factor in that too. <br> <br>The thing to remember is that a shadow is not a substitute for a concept. Without a concept, it's just a pointless, flashy effect.</p>"
