    html: <p>As mentioned above, drop shadows are (like many other options/filters in Photoshop, etc.) easy ways out that can look amateurish in the wrong hands. But saying that one should never use them -- that's a bit dogmatic, isn't it? <br> <br>I, for one, am not afraid of shadow effects. I use them as part of my own arsenal of tools, but I use them not necessarily for nostalgic looks but for what suits the design problem at the moment. Often the problem is readability, and shadow can be a useful solution. The trick, like most tricks, is to make it so that you hardly notice the effect.</p>
