    html: |-
      <p>Just found (on this page <a href="http://www.computerarts.co.uk/in_depth/features/type_tips/" rel="nofollow">Computer Arts - Type tips</a>) these two tips by Mark:</p>
      <p><strong>16 Make an old-school outline effect</strong><br>
      Set some text in Illustrator 9 and select it using the arrow cursor. Set both the fill and outline to None. In the Appearance palette, add a new fill. This also adds an empty stroke. Set these to any colours you like. In the Stroke palette, make the stroke thicker and set its corner attribute to Rounded. In the Appearance palette, drag the stroke to below the fill, putting the stroke under the fill in the stacking order. In the Appearance palette, add a new, thicker stroke. Make sure it appears below the first stroke. By varying the thickness and colours of the two strokes, many different outline effects are possible. You can add more strokes for more effects.</p>
      <p><strong>17 Make a custom shadow effect</strong><br>
      This trick requires Illustrator 10. Start from the double-stroke we created in Tip 16 and select the lower stroke in the Appearance palette. Choose Effect&gt; Distort &amp; Transform&gt;Transform. In the dialog box that appears, set Move to Horizontal: 0.5 pt and Vertical: -0.5 pt. Also set Copies to greater than 0: the higher the number, the deeper the drop-shadow. The amount of offset (and therefore number of copies) depends on your target output resolution. For on-screen use, 0.5pt works well. Smaller offsets and higher numbers of copies are needed for higher resolution. Also, using a rounded corner on strokes helps.</p>
