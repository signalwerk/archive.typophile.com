    date_raw: 24 May 2009 — 7:18pm
    votes: null
    html: <p>I believe this is 'by design', i.e. not a bug per se. It isn't a limitation of the TT instruction set, but seems to be a limitation of FontLab's implementation. Hopefully Adam Twardoch will drop by and shed some light on this.</p>
