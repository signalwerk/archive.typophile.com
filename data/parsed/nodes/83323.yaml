      <p>NOED:</p>
      <p>dingbat |ˈdɪŋbat| informal<br>
      noun<br>
      1 a stupid or eccentric person.<br>
      2 a typographical device other than a letter or numeral (such as an asterisk), used to signal divisions in text or to replace letters in a euphemistically presented vulgar word.<br>
      ORIGIN mid 19th cent. (in early use applied to various vaguely specified objects): origin uncertain; perhaps based on obsolete ding [to beat, deal heavy blows.] Sense 1 dates from the early 20th cent.</p>
