    <p>Hi Everyone, this is my first post on the board. </p>
    <p>I am an MA student from Belfast NI, and am currently working on a new website with a focus on typography, design, and typography on the web. As a welcome to everyone I am doing a series of typography wallpapers each month, these are beautiful professional photos so hope you guys enjoy them and check out the site.</p>
    <p>First in the series —&nbsp;<a class="freelinking external" href="http://justmyty.pe/news/view/typography-wallpaper-series-no1" rel="nofollow">Wallpaper Series No.1</a><br>
    Available in B&amp;W and Colour</p>
    <p>Any feedback on the site also is much appreciated, content suggestions is also welcome.</p>
    <p>Thanks, </p>
    <p>Rory<br>
    <a href="/wiki/https%3A/%252Ftwitter.com/%2523%21/Justmyty_pe" class="freelinking" rel="nofollow">@justmyty_pe</a></p><div class="imageWrap"><img src="http://typophile.com/files/wallpaper-preview_3845.jpg"></div><p></p>
