    html: |-
      <p>Mostly it's not OK to name the sizes based on one manufacturer. I know that people have trouble with technical stuff, but there should at least be an alternative way to get the one you need, based at least on your screen's aspect ratio (which is more significant than the pixel count for something like this). For example the iPhone's screen is 960×640, which is 3:2 (which is uncommon). The two main desktop aspect ratios are 4:3 and 16:9 (the latter gaining a lot of ground lately, although most projectors for example remain at the former). There are also secondary ones like 5:4 and 16:10. AFAIK most non-Apple smartphone aspect ratios are 16:9.</p>
      <p>* <a href="http://en.wikipedia.org/wiki/File:Vector_Video_Standards2.svg" title="http://en.wikipedia.org/wiki/File:Vector_Video_Standards2.svg">http://en.wikipedia.org/wiki/File:Vector_Video_Standards2.svg</a></p>
      <p>hhp</p>
