  html: |-
    <p>The New York Times invited several designers to come up with creative, personal versions of the New York subway map. The design below is a small portion of the map by calligrapher Bernard Maisner. </p>
    <p>The article has an interactive feature that lets you download a subway map template, add your own type and artwork, and then upload it back to the NYT for possible inclusion in their gallery of submissions.</p>
    <p>http://tinyurl.com/235kwzl</p><div class="imageWrap"><img src="http://typophile.com/files/map_image_6163.jpg"></div><p></p>
