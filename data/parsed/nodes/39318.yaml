      <p>&gt; The GX version of Helvetica had<br>
      &gt; real small caps (really!).</p>
      <p>Wow. I'm a newbie, I've never seen a GX font in person before. Are they backwards-compatible with vanilla TrueType? Or do you have to basically have FontLab to use them these days?</p>
      <p>&gt; Although it’s a little quirkier than<br>
      &gt; Helvetica, National has small caps</p>
      <p>Hey now, that's a lot closer to what I'm looking for! Thanks!</p>
      <p>The only problem is that there's a dark side to my situation. I'm a lone design-conscious mercenary in a company that epitomizes design bankruptcy.† There's a very large central repository of fonts we're licensed to use, but we don't have direct access to it; instead, we have to contact a representative who searches the repository for us.</p>
      <p>My point is that I can't just buy a font from any foundry; I have to find something that we're already licensed to use.</p>
      <p>And my REAL point is that National, while an excellent candidate that I'm glad to know about, is a no-go, so I'd still like more suggestions if anyone has them. :)</p>
      <p>----------------------------</p>
      <p>† You can probably guess the company in about three tries (but I beg you not to try).</p>
