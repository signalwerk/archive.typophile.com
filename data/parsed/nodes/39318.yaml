    html: |-
      <p>I took a look at Heros -- the small caps are OK, but would need a slight weight increase to match my Helvetica (but the accents over them should not have the weight increase). They also needed to be a touch larger; a small amount of vertical scaling would fix that.</p>
      <p>The old style numbers seem to just be the regular numbers "moved" a bit, except, obviously, for the "1" and "2". The oldstyle "2" is just dreadful.</p>
      <p>All in all, I don't think you could just use them directly with another foundry's Helvetica.</p>
      <p>FWIW</p>
