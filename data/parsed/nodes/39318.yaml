      <p>Aha! By <a href="https://web.archive.org/web/20131020065353/http://en.wikipedia.org/wiki/Sans-serif#Classification" rel="nofollow">realist</a> I mean Heros! </p>
      <p>Adventor is a geometric sans-serif, and is in fact a rip-off of Avant Garde. But Heros is a realist sans-serif, and is in fact a rip-off of Helvetica. And it does have small caps!</p>
      <p>If we didn't have a license to the whole extant Helvetica family, I'd feel funny about using any of those. But we do, so I won't. :)  Thanks!</p>
