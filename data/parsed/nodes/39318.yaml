    html: |-
      <p>I'm not using Heros with Helvetica, I'm replacing Helvetica entirely with Heros. :)</p>
      <p>I know Heros isn't just spectacular; I don't like a few random features of some letters, and I could tell the small caps weren't perfect. But I'm not using the text figures at all (for which I think I have good reasons), and anything like a close approximation of true small caps is a drastic improvement, even with Heros's cons.</p>
      <p>As far as mixing weights of Helvetica, well... that looks really good. I'm using InDesign CS, though, and I don't know of a way to have it automatically use a different font for the small caps. There's just enough text with just enough caps to make it really tedious to tweak the type manually.</p>
      <p>I'll have to consider it, though, because now that I look at them side-by-side, the Helvetica one is far, far superior. Thanks. :)</p>
