    html: <p>This is almost certainly hand drawn. You will only be able to find similar forms in a font. Robert's Solo idea is a good one. Also <a href="http://letterheadfonts.com/fonts/bostontruckstyle.shtml">Boston Truckstyle</a> and <a href="http://www.fontshop.com/fonts/singles/fountain/vitus_regular/">Vitus</a> (though without the swashiness).</p>
