    html: <p>All great suggestions. I ended up deciding to just generate the feel of the period rather than to try to replicate the font itself. The Boston Truckstyle suggestion led me to Letterhead Fonts (I'm new at this), which then led me to <a href="http://www.letterheadfonts.com/fonts/billhead.shtml" title="Click to visit an external URL." class="freelink freelink-external freelink-external">LHF Billhead</a>, which worked wonderfully in my project. Thanks again!</p>
