    html: |-
      <p>Well, let's see.</p>
      <p>Here's a pair that are both Venetians, I'd say...</p>
      <p>"low" -- Bembo<br>
      "significantly higher" -- Iowan Old Style</p>
      <p>BTW, the best way to look at x-height is to compare the lowercase with a capital. Extenders can always be lengthened. Look at the Trinité variants, for example. Or Seria and Scala, though the two are a little bit different in other ways. </p>
      <p>Here's my take on (serifed) fonts with a high x-heigth: You can't properly kern the r, u, w and y with a cap T.</p>
