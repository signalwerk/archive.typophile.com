    html: |-
      <p>Of course, there are all those ITC big x-height versions of classics, which were designed in the 1970s and 80s. Most contentious was the Garamond. Also ITC Cheltenham and ITC Caslon.</p>
      <p>In the same era, Headliners International (franchised typositor type shops) produced big-x versions of just about every previous type, which they termed “Neo Mini-Whatever”.</p>
      <p>Les Usherwood (Typsettra) produced many large-x designs, eg Flange. Again, same era.</p>
      <p>Koch’s Antiqua, aka Eve, very small x.</p>
      <p>Antique Olive, very large x, and small extenders.</p>
      <p>Advertisers Gothic, early 20th century, big x and very short descenders.</p>
