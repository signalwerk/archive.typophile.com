    <p>Hello,</p>
    <p>can anybody help me sourcing this quirky, but nice serif font? it's been used by jonas williamson in combination with other very nice fonts.<br>
    <a class="freelinking external" href="http://www.jonaswilliamsson.com/" rel="nofollow">http://www.jonaswilliamsson.com/</a> (click the second project)<br>
    the combination: <a class="freelinking external" href="http://www.jonaswilliamsson.com/img/projects/900x600/the_reader_fonts.jpg" rel="nofollow">http://www.jonaswilliamsson.com/img/projects/900x600/the_reader_fonts.jpg</a></p>
    <p>i've tried whatthefont, but no useful results.</p>
    <p>thank you!</p>
