    html: |-
      <p>The new font is better. I like the style of the logo, how it's clean and clear and not sci-fi-like… feels more timeless than trendy, which is probably a good thing. Strange though: I keep reading "eartrek" – maybe because the logo seems more reminiscent of sound waves (or earthquakes, actually) than time travel… come to think of it, frankly I don't get the logic of the concept. If that is a timeline, then yes you're <em>bending</em> time; but to move <em>back</em> in time would mean moving to the left, rather than up and down, no?<br>
      Maybe it's just me. I might try playing more with concepts of backwards/forwards; use arrows?; clocks?; play with the standard left-to-right reading direction? Bend the time we spend reading the logo (backwards type? flipped letters? upside down?) Maybe you've already explored all this, but there seems to be so much to play with that might make the application clearer than what you have now.<br>
      (Props to your teacher too, this seems a really fun assignment.)</p>
