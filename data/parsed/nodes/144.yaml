  html: "<p>When Typophile first launched almost two years ago, the doors were wide open. In light of recent events, we've decided to hire a bouncer. <br> <br>Critique, News &amp; Events, and Technical Issues will now require an account to post. <br> <br>General Discussions will still allow users to post under a pseudonym without an account. If a forums user would like to post free of anonymous respondents, they can post to Technical Issues. <br> <br><b>Typophile Forum accounts are still free</b> - if you haven't done so yet, join the hundreds of others who have clicked \"Login/Register\" to sign up for instant registration. It's quick and hassle-free. <br> <br>While we encourage healthy debate and meaningful discussion, posts containing inflammatory remarks and/or personal attacks will be deleted in their entirety by the board moderator.  <br> <br>Please send moderator nominations to : <a href=\"mailto:forums@typophile.com\">forums@typophile.com</a></p>"
  html_clean: "<p>When Typophile first launched almost two years ago, the doors were wide open. In light of recent events, we've decided to hire a bouncer. <br> <br>Critique, News &amp; Events, and Technical Issues will now require an account to post. <br> <br>General Discussions will still allow users to post under a pseudonym without an account. If a forums user would like to post free of anonymous respondents, they can post to Technical Issues. <br> <br><b>Typophile Forum accounts are still free</b> - if you haven't done so yet, join the hundreds of others who have clicked \"Login/Register\" to sign up for instant registration. It's quick and hassle-free. <br> <br>While we encourage healthy debate and meaningful discussion, posts containing inflammatory remarks and/or personal attacks will be deleted in their entirety by the board moderator.  <br> <br>Please send moderator nominations to : <a href=\"mailto:forums@typophile.com\">forums@typophile.com</a></p>"
