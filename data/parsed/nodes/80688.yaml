    <p>I'm looking for the typeface used to set "Short Girls." I used the WhatTheFont app and it came up with "Paine,"  but the R isn't quite right. The ascenders in Paine are also at an angle while the Short Girls typeface is flat. </p>
    <p>Any suggestions or help would be much appreciated. Thanks!</p>
