  - id: 484338
    user: 2438
    date: 2011-11-17T10:18:00
    date_raw: 17 Nov 2011 — 10:18am
    votes: null
    html: <p>After messing around with the file sent to me by Nippa, I managed to get rid of the "Five zephyrs" text by changing the "Generating OpenType" preference from "Append OpenType name records" to "Export only OpenType name records." Having this option set requires that all of the name records are present in the "Additonal OpenType names" table, so I deleted the Sample text entries, then re-imported the default names (first button at the top). Generating that finally produced a TTF without the sample text entries. No idea why they persisted in "Append" mode after deleting them, since they're not present anywhere in what the manual refers to as the "friendly" sections of the Font Info dialog.</p>
    html_clean: <p>After messing around with the file sent to me by Nippa, I managed to get rid of the "Five zephyrs" text by changing the "Generating OpenType" preference from "Append OpenType name records" to "Export only OpenType name records." Having this option set requires that all of the name records are present in the "Additonal OpenType names" table, so I deleted the Sample text entries, then re-imported the default names (first button at the top). Generating that finally produced a TTF without the sample text entries. No idea why they persisted in "Append" mode after deleting them, since they're not present anywhere in what the manual refers to as the "friendly" sections of the Font Info dialog.</p>
