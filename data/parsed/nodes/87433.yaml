    <p>I am trying to change the way FontStruct fonts are displayed and uploaded into my Mac FontBook.</p>
    <p>This is what I get, when I double click on a Fontstruct Font.<br>
    This is just before FontBook fully opens.</p>
    <p><img src="http://pix-eu.dontstayin.com/79238fb9-023a-4211-8dba-7bf5af3a61ea.png" width="370" height="140" border="0"></p>
    <p>Every other font display the full alphabet.</p>
    <p>So I uploaded the font into FontLab, and in the section <strong>Font Info&gt; Additional Opentype names</strong> was this:-</p>
    <p><img src="http://pix-eu.dontstayin.com/b92e7127-730f-4702-ac80-0179a8f48d48.png" width="607" height="344" border="0"></p>
    <p>So I deleted it all, like this:-</p>
    <p><img src="http://pix-eu.dontstayin.com/2ef8d7cf-d2f1-48d6-85a7-c2de89beca61.png" width="607" height="344" border="0"></p>
    <p>and clicked Apply. Saved the font, and reinstalled it. </p>
    <p>Double clicked on the file again, and I still get this:-</p>
    <p><img src="http://pix-eu.dontstayin.com/79238fb9-023a-4211-8dba-7bf5af3a61ea.png" width="370" height="140" border="0"></p>
    <p>Also when I'm in FontBook, and click <strong>Preview &gt; Sample</strong>, I still get this:</p>
    <p><img src="http://pix-eu.dontstayin.com/abdaea5f-c3c4-4c84-91ed-b6f1259b04ee.png" width="528" height="220" border="0"></p>
    <p>Every other font displays the full Alphabet, upper, lower &amp; numerals.</p>
    <p>What can I do to change this so it displays properly?<br>
    It's driving me crazy.</p>
    <p>I've cleared the Font cache already.<br>
    It's only really happened when I installed Snow Leopard recently.</p>
