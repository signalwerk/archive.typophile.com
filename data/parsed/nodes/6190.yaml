  - id: 43502
    user: 851
    date: 2003-01-27T22:17:00
    date_raw: 27 Jan 2003 — 10:17pm
    votes: null
    html: <p>Hey! You could poke someone's eye out with that! <br> <br>I see where the blackletter influences fit in. The undecorated letters remind me of Diotima, Koch Antiqua, and Nicholas Cochin.  <br> <br>The letters are very thin, though. Have you started bumping up against the limitations of em-square granularity? Speaking of which, also be careful of sharp, acute angles in your contours. They're usually not a problem, but can sometimes cause strange rendering artifacts on certain output devices. <br> <br>Some of the decorated caps can be confusing, <br>since the stem widths are so close to the hairline strokes. I'll have to look at it some more before I can offer more useful advice. But you should definitely continue with it... you've got something there.</p>
    html_clean: <p>Hey! You could poke someone's eye out with that! <br> <br>I see where the blackletter influences fit in. The undecorated letters remind me of Diotima, Koch Antiqua, and Nicholas Cochin.  <br> <br>The letters are very thin, though. Have you started bumping up against the limitations of em-square granularity? Speaking of which, also be careful of sharp, acute angles in your contours. They're usually not a problem, but can sometimes cause strange rendering artifacts on certain output devices. <br> <br>Some of the decorated caps can be confusing, <br>since the stem widths are so close to the hairline strokes. I'll have to look at it some more before I can offer more useful advice. But you should definitely continue with it... you've got something there.</p>
