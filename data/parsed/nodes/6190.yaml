    votes: 0
    html: <p>Hey! You could poke someone’s eye out with that! <br><br>I see where the blackletter inﬂuences ﬁt in. The undecorated letters remind me of Diotima, Koch Antiqua, and Nicholas Cochin.  <br><br>The letters are very thin, though. Have you started bumping up against the limitations of em-square granularity? Speaking of which, also be careful of sharp, acute angles in your contours. They’re usually not a problem, but can sometimes cause strange rendering artifacts on certain output devices. <br><br>Some of the decorated caps can be confusing, <br>since the stem widths are so close to the hairline strokes. I’ll have to look at it some more before I can oﬀer more useful advice. But you should deﬁnitely continue with it… you’ve got something&nbsp;there.</p>
