    html: "<p>Thanks for the GIFs. <br> <br>Very elegant, ethereal. I can see certain magazines and such wanting to use it. <br> <br>I think the UC \"C\" needs more flourish, the 1st UC \"G\" doesn't work, and the simpler UC \"I\" is better, except its symmetry is ungainly: try just moving one of the small horizontal joins down. <br> <br>The lc : I think it should stay without flourishes, and you might check out the work of Gudrun von Hesse for possible guidance: <a href=\"http://www.myfonts.com/person/zapf-von-hesse/gudrun/\" target=\"_blank\">http://www.myfonts.com/person/zapf-von-hesse/gudrun/</a> <br> <br>hhp <br></p>"
