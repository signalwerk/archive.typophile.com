    html: '<p>Thanks for the <span class="caps">GIF</span>s. <br><br>Very elegant, ethereal. I can see certain magazines and such wanting to use it. <br><br>I think the <span class="caps">UC</span> “C” needs more ﬂourish, the 1st <span class="caps">UC</span> “G” doesn’t work, and the simpler <span class="caps">UC</span> “I” is better, except its symmetry is ungainly: try just moving one of the small horizontal joins down. <br><br>The lc&nbsp;: I think it should stay without ﬂourishes, and you might check out the work of Gudrun von Hesse for possible guidance: <a href="http://www.myfonts.com/person/zapf-von-hesse/gudrun/" target="_blank">http://www.myfonts.com/person/zapf-von-hesse/gudrun/</a> <br><br>hhp <br></p>'
