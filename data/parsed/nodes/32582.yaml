      <p>I was assuming that the text and the ANNE KLEIN header were the same font, but maybe I was wrong. In any case it's the ANNE KLEIN that I'm trying to i.d.  I'm pretty sure that is not Venus or any of the Gothics. I don't think we've got Proenza Schouler either. I don't mean to presume, but I wish someone could nail these the way bjharvey and Bald Condensed nailed Marc Jacobs in 2004. If I'm wrong and in fact marcox's i.d.'s are correct, I will be happy.  I just want to get these right. </p>
      <p>It's the E in ANNE KLEIN that is most interesting, and the O in Proenza Schouler that is not quite fitting with the suggestions. Here is an attempt at a better image of ANNE KLEIN.</p><div class="imageWrap"><img src="http://typophile.com/files/Anne 2_4034.gif"></div><p></p>
