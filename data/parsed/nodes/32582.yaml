    html: <p>The Anne Klein "Fall 2007" body copy is <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=M.103091.0.1" rel="nofollow">Monotype Grotesque Light</a>, which indeed shares similarities with both Bitstream's Vonness and URW's (originally Berthold's?) Venus. The Anne Klein logo is indeed Akzidenz-Grotesk Light.</p>
