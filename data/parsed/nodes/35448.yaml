    <p>Hi all,</p>
    <p>I've been working on stationary for an international company for a few weeks. This co. has offices all around and I have been trying to find a definitive place online which has the correct formating for phone numbers globally.</p>
    <p>Can anyone direct me to somewhere like that? Does it exists?</p>
    <p>Many thanks<br>
    Javier</p>
