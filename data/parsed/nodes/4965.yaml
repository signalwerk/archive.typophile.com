    html: <p>Nick,  <br> <br><i>Actually, I said that the typographer was "playing it safe" by using well-known typefaces.</i> <br> <br>Any typographer is "playing it safe" using any good typeface, well known or otherwise.  <br> <br>And I say, "good on them". <br> <br>And <br> <br><i>Otherwise why bother with a designer/typographer, why not just use a default template?</i> <br> <br>Too many reasons to enumerate. More often than not, it is the typographers' decision to use a particular typeface. This decision making is not the "singular fountain of emotion" that goes into a finely designed book. Type designers are not the "Lady on the Pedestal" we would like ourselves to be. Typeface choice is hopefully a passing joy rather than a well remembered failure. <br> <br>Most certainly, an "unsafe typeface, well known or otherwise", is a cocktail for disaster which is why classical book faces are considered the liferafts of the wise. <br> <br>Also, need I add�sound advice for the novice.  <br> <br>Remember, printing is expensive. <br> <br>������������������ <br> <br></p>
