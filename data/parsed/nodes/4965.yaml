    html: "<p>And from Morrison's \"Politics and Script\": <br>\"It has been argued [...] that the neo-Carolingian Roman invented <br> and espoused by the Florentine humanists would never have been <br> established but for the use and support given it by Cosimo de' <br> Medici, who bestowed upon it a quasi-authority. It was essentially <br> different from that of the papal or Imperial chanceries. It is the <br> only example of a script being established because of the accident <br> that it corresponded with the taste of a merchant banker. Without <br> him the then novel script would never have been more than the <br> hobby of a society of 'literati'. In this sense the humanistic <br> roman may be described as a capitalist script.\" <br> <br>hhp <br></p>"
