    html: "<p><i>Here's a cool example of subtly expressive typography..</i> <br> <br>I don't consider that 'expressive': a change in typeface is used as a navigational tool to provide information about narrative point of view. It is no more expressive than a change between roman and italic to indicate a foreign word. When someone speaks of 'expressive typography', I take this to mean typography that is somehow emotive, that draws on conventional cultural or subcultural associations to suggest a particular mood. Changing from a renaissance typeface to a romantic typeface (romantic in the art historical sense, not the emotive sense) does not seem to me particularly expressive. <br> <br>There is relatively little typography of the kind shown in the example for the simple reason that most authors use language to establish narrative point of view, not naff typographic tricks.</p>"
    html_clean: "<p><i>Here's a cool example of subtly expressive typography..</i> <br> <br>I don't consider that 'expressive': a change in typeface is used as a navigational tool to provide information about narrative point of view. It is no more expressive than a change between roman and italic to indicate a foreign word. When someone speaks of 'expressive typography', I take this to mean typography that is somehow emotive, that draws on conventional cultural or subcultural associations to suggest a particular mood. Changing from a renaissance typeface to a romantic typeface (romantic in the art historical sense, not the emotive sense) does not seem to me particularly expressive. <br> <br>There is relatively little typography of the kind shown in the example for the simple reason that most authors use language to establish narrative point of view, not naff typographic tricks.</p>"
