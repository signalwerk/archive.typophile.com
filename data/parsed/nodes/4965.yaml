    html: "<p>In the realm of display type, few would doubt that \"expression\" is valuable in a font, which means we can never have enough of them. In the text realm there is indeed reason to doubt the usefulness of more than a handful of fonts, because immersive reading precludes conscious aesthetic impressions. In fact it might seem that the only good reason to make a new text fonts is to solve emerging technical issues. <br> <br>But when you take into account that the <i>subconscious</i> is also open to being \"impressed\" (albeit in a very different way than the consciousness), you realize that it's really mostly a matter of subtlety, not exclusion, of features. This is why everything has to be toned down in a text font: first it has to \"go below the radar\" of the consciousness, for it to have any hope of marking its effect in immersive reading. <br> <br>In the subsoncious, more \"primal\" things matter. For example, sharp corners say something and soft coners say something else, no matter that the reader can't verbalize -or even realize- the difference. This is what makes text design such a black art. <br> <br>So choosing Garamond for a SciFi novel isn't bad because it will ruin readability (it won't), it's bad because it wastes the opportunity to <i>gently amplify</i> the content. Quality is in the details. <br> <br>hhp <br></p>"
    html_clean: "<p>In the realm of display type, few would doubt that \"expression\" is valuable in a font, which means we can never have enough of them. In the text realm there is indeed reason to doubt the usefulness of more than a handful of fonts, because immersive reading precludes conscious aesthetic impressions. In fact it might seem that the only good reason to make a new text fonts is to solve emerging technical issues. <br> <br>But when you take into account that the <i>subconscious</i> is also open to being \"impressed\" (albeit in a very different way than the consciousness), you realize that it's really mostly a matter of subtlety, not exclusion, of features. This is why everything has to be toned down in a text font: first it has to \"go below the radar\" of the consciousness, for it to have any hope of marking its effect in immersive reading. <br> <br>In the subsoncious, more \"primal\" things matter. For example, sharp corners say something and soft coners say something else, no matter that the reader can't verbalize -or even realize- the difference. This is what makes text design such a black art. <br> <br>So choosing Garamond for a SciFi novel isn't bad because it will ruin readability (it won't), it's bad because it wastes the opportunity to <i>gently amplify</i> the content. Quality is in the details. <br> <br>hhp <br></p>"
