    html: <p>I don't think there is really a dichotomy here. <br> <br>I doubt whether we do <i>need</i> more than a handful of functional typefaces (for book typography, at least). But the fact is, we <i>have</i> more than a handful. Precisely because no one typeface stands head and shoulders above the others on any functional grounds (many work pretty well), we will continue to have a choice. <br> <br>In these circumstances, to insist on using just one typeface for everything is itself a choice. <br> <br>Among the many choices a designer makes, choice of typeface may well be relatively unimportant. But there is no reason in principle why a designer may not use a variety of different typefaces and use them all with sensitivity and care. Admittedly, excessive promiscuity may be a bad idea (because it often takes a while to get the "hang" of a particular typeface); but within reason choice may be good. If it helps the designer to keep fresh and enthusiastic, that may be good too. <br> <br>How then to choose? For a whole range of reasons. Some technical (lots of information, little space; narrow columns; need oldstyle figures or not; need bold or not; need small caps or not); some personal (I like this type, not that). I see no reason why allusiveness and resonance to subject or period <i>should not</i> form part of these considerations, if you want them to. <br> <br>If there are no such resonances then, at worst, those who believe there are will be selecting usable type for the wrong reasons. They are deluding themselves in supposing that their careful allusiveness adds anything, but it is a harmless delusion. Rot only sets in if it leads to the choice of faces which are functionally poor; but I see no reason to suppose, given the range of acceptable faces available, why that should happen.</p>
