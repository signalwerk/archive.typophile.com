    html: <p><i>No. If you read the thoughts of the author (who directed the font choices) on this, you'd realize that it has nothing to with navigation, but everything to do with expression - albeit at the subsoncious level.</i> <br> <br>Therein lies the fatal flaw -- to use your favourite phrase -- in such a programme. Like abstract expressionism in painting, the intent of the author or artist to express something in his mind falls at the gateway of another's mind. The fact that the author states that the typography is expressive doesn't make it expressive. If it were genuinely expressive, it wouldn't need to be explained. This is why I prefer the term evocative to expressive, because expression implies a thought that is being expressed from one person, presumably to another, while evocation seeks only to trigger associations that the reader/viewer already has. Language remains the only halfway reliable means of expression between two or more minds.</p>
    html_clean: <p><i>No. If you read the thoughts of the author (who directed the font choices) on this, you'd realize that it has nothing to with navigation, but everything to do with expression - albeit at the subsoncious level.</i> <br> <br>Therein lies the fatal flaw -- to use your favourite phrase -- in such a programme. Like abstract expressionism in painting, the intent of the author or artist to express something in his mind falls at the gateway of another's mind. The fact that the author states that the typography is expressive doesn't make it expressive. If it were genuinely expressive, it wouldn't need to be explained. This is why I prefer the term evocative to expressive, because expression implies a thought that is being expressed from one person, presumably to another, while evocation seeks only to trigger associations that the reader/viewer already has. Language remains the only halfway reliable means of expression between two or more minds.</p>
