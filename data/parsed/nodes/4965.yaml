    html: "<p>Here we go. From H Carter's <i>A View of Early Typography</i> (pp. 73–74) : <br> <br>\"The Aldine Italic was not a newly invented idiom. [...] It is like the copying hand of Niccolò Niccoli of <br>the priod 1420–30. Niccolò was a scholar and he copied classical texts for his own use and the use <br>of his friends. [...] I imagine that the script favoured by scholars for private reading seemed to him <br>[Aldus] appropriate for these books : it savoured of learning and it was intimate.\"</p>"
