    html: "<p>Ultimately, I agree that a legible, functional typeface is of the utmost importance, over all subtler considerations. However, it's hardly an argument to stop making new faces, redundant or not, nor an argument to stop paying attention to finer details when circumstances allow. But that's another discussion. <br> <br>As for crazy content, I believe I've posted about this novel on Typophile before, but I'll bring it up again: Mark Z. Danielewski's <i><a href=\"http://search.barnesandnoble.com/booksearch/isbnInquiry.asp?userid=AQv1v3Mqi6&amp;isbn=0375703764&amp;itm=1\">House of Leaves</a></i> is, in my direct experience, a great example of a variety of typefaces (most of which are quite common and non-crazy) used in a crazy way, along with one more expressive (read as: distressed) typeface used for content generated by a character who is literally going crazy. <br> <br>The effects are not necessary for communication, but really add a lot. I recommend checking it out in a bookstore if you have the opportunity. The more standard book typesetting leaves something to be desired, but the layout acrobatics required to deal with the literally and intentionally labrynthian narrative are impressive in their own right. It's a good example of fine book typography taking a back seat to just about every other consideration while not damaging the experience too dramatically as a result. The reading experience is so broken up by physical and narrative jumps that it becomes quite minor, in fact (not much extended, continous reading). <br> <br>It's hard to explain what I mean without the book on hand, but it's a very interesting special case in book typography.</p>"
