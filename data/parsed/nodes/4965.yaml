    html: "<p>The origins of Italic type: <br> <br>Conventional wisdom is represented by Meggs in his History: Saves space, copied from fast, informal scribe style.  <br> <br>That's much too utilitarian. Here's another way of looking at it: <br> <br>Poggio invented the humanist script c.1400. It has been described by Donald M. Anderson as \"plodding\" and \"sober\". This is the writing style that Jenson's definitive Roman face interprets. <br> <br>During the Incunabula, in the later 1400s, the work of the Italian writing masters (eg Sanvito, Sinibaldi) had become more stylishly cursive, no doubt to distinguish itself from printed text.  <br> <br>The era saw a swan song for the manuscript writer, before the profession morphed into a smaller number of Writing Masters (Instructors), the best of whom published how-to manuals. <br> <br>Sinibaldi designed pages that were predominantly his  cursive (ie Italic), mixed with \"small caps\". <br> <br>It is this look which Aldus captured in type. <br> <br>So, the origin of the Italic type style is caused by the swan song virtuosity of the manuscript hand, itself a reaction to the plainness of the original Roman typefaces. <br> <br>Lots of interplay between old and new media -- exploited by artists looking for new forms, supported by a progressive marketplace. <br> <br></p>"
    html_clean: "<p>The origins of Italic type: <br> <br>Conventional wisdom is represented by Meggs in his History: Saves space, copied from fast, informal scribe style.  <br> <br>That's much too utilitarian. Here's another way of looking at it: <br> <br>Poggio invented the humanist script c.1400. It has been described by Donald M. Anderson as \"plodding\" and \"sober\". This is the writing style that Jenson's definitive Roman face interprets. <br> <br>During the Incunabula, in the later 1400s, the work of the Italian writing masters (eg Sanvito, Sinibaldi) had become more stylishly cursive, no doubt to distinguish itself from printed text.  <br> <br>The era saw a swan song for the manuscript writer, before the profession morphed into a smaller number of Writing Masters (Instructors), the best of whom published how-to manuals. <br> <br>Sinibaldi designed pages that were predominantly his  cursive (ie Italic), mixed with \"small caps\". <br> <br>It is this look which Aldus captured in type. <br> <br>So, the origin of the Italic type style is caused by the swan song virtuosity of the manuscript hand, itself a reaction to the plainness of the original Roman typefaces. <br> <br>Lots of interplay between old and new media -- exploited by artists looking for new forms, supported by a progressive marketplace. <br> <br></p>"
