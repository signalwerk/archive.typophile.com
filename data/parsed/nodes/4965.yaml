    html: "<p>Aldus didn't use classical typefaces, though. Griffo's \"Adino\" was something completely new in printing. But his typeface ended up being so useful, that it has now become a style. And Aldus' mark even represented progress (a steady progress.) <br> <br>The italic though of course was based on handwriting, but Griffo seemed to be more interested in how it saved space - technical progress. But typographic progress shouldn't be constrained to technical progress, and in Aldus' case, it even became cultural progress. <br> <br>However, isn't using the same \"reliable\" type comparable to looking at the same style of paintings over and over? Should we be content to keep seeing the same exhibit century after century? While most of us I think would agree to use as few typefaces as possible in a single book, for a whole country to use a handful of typefaces is something different and more extreme.  <br> <br>At the same time, with all of my ranting for progress, I have to say this..  I have been using Sabon lately in semi-lengthy amounts of childrens' book reading, for more than one book. Mainly because of its legibility, but also because I want to stay away from ligatures and the short f's look great next to the i's without using ligatures. The more I use it, the harder I think it's going to be for me to break away from it...not because of stubborness, but because I feel like I am learning how to really use it, and I appreciate something different each time..Which might seem anti-progress, since I've been looking at the same painting for the last few books.. ha. At the same time, I'm always looking out for something that might convey my message better.. either through functionality or...By the way, are there any other types of progress that I'm missing out? Communication, cultural.. functional/technical... ? <br> <br>So perhaps, progress is just as important in the designer as it is in the typeface. (Ah.. okay. So I think, then, Fredrik, that you are saying \"more so\".) ? And if a designer's progress is more important to the reader than typographic progress.. the two should work more closely together than the current process of: type designer makes it in one country and designer buys it and uses it in another. I personally think the relationships need to be tighter, but designing brochures is faster than designing a typeface, so the two will probably never meet up perfectly. But it's so important for designers to have a good knowledge of type. I think I have more favorite type designers than I have graphic designers.. hmm..  <br> <br>I'm seeing both sides, but there's a side effect to not caring if a typeface sheds light onto a text. It's the whole.. not caring. Good design comes in part from having layers of meaning. The page proportions, paper selection, cover design, choice of typeface, etc. can affect the atmosphere of the book and help tell the story. Why would you want to pass up this opportunity? (Besides time and money!)  <br> <br> <br> <br></p>"
