    html: "<p><i>The italic though of course was based on handwriting, but Griffo seemed to be more interested in how it saved space - technical progress.</i> <br> <br>This is an oft repeated myth, debunked by Harry Carter and more thoroughly, by way of detailed measurements of the type, by Peter Burnhill in his fascinating new book <a href=\"http://www.hyphenpress.co.uk/titles/type_spaces/index.html\"><i>Type spaces</i></a>. Burnhill notes: <br> <br><b>Morison (1926) says of Griffo's italic and its use in the composition of the octavo classics series: 'It's chief merit is that of making up extremely economically, a supreme quality in such a series as that for which Aldus employed it.' Against this, Carter (1969) writes: 'If Aldus hoped, as it is commonly said that he did, but he never said, that cursive letterforms would save space, he must have been disappointed by the results: a Roman type on the same body gets in just as much.'</b></p>"
    html_clean: "<p><i>The italic though of course was based on handwriting, but Griffo seemed to be more interested in how it saved space - technical progress.</i> <br> <br>This is an oft repeated myth, debunked by Harry Carter and more thoroughly, by way of detailed measurements of the type, by Peter Burnhill in his fascinating new book <a href=\"http://www.hyphenpress.co.uk/titles/type_spaces/index.html\" class=\"link-external\"><i>Type spaces</i></a>. Burnhill notes: <br> <br><b>Morison (1926) says of Griffo's italic and its use in the composition of the octavo classics series: 'It's chief merit is that of making up extremely economically, a supreme quality in such a series as that for which Aldus employed it.' Against this, Carter (1969) writes: 'If Aldus hoped, as it is commonly said that he did, but he never said, that cursive letterforms would save space, he must have been disappointed by the results: a Roman type on the same body gets in just as much.'</b></p>"
