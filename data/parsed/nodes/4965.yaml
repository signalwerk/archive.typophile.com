    html: "<p>&gt;The trick is to use that one typeface as sensitive and sensible as possible, not choose between hundreds and hundreds. That's skill.   <br> <br>No it's not, it's playing it safe. \"Sensitive and sensible\"  produces conservative professionalism. It requires more typographic skill to work with a new face and discover/invent the setting that is right for the job and not intrusive (i.e. \"expressive\"). But it's so much easier to rely on the pedigree and familiarity of old warhorses like Garamond. <br> <br>I just bought \"Inferno\", a surfer-dude rewrite of Dante's Inferno, set in Centaur, which really didn't match the scrappy illustrations. Like many of the classic faces, art directors use it to indiscriminately add literary gravitas -- it's \"quality\" packaging that makes the buyer/reader think they're getting value for money. <br> <br>Garamond, Bembo, and all the other overused fine old book faces: So many writers all speaking with the same voice -- orthodox, conventional, like a newscaster. I'm sick and tired of the monotonous drone. <br> <br></p>"
