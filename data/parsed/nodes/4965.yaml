    html: <p>&gt;your attentions to "newness" <br> <br>Gerald, you continue to miss the point that I am not talking about any particular genre of typefaces. I do not mean by a "new" typeface one that is a trendy novelty, as you imply, going after the usual target -- but rather one that the typographer has not worked with before. <br> <br>&gt;What "risk" is there in choosing a typeface if "you know how"? <br> <br>You may know how in a general sense, but if you have never touched the instrument, you don't know how it will perform in your hands. Typefaces do not behave identically, each has something unique to offer that a good typographer will discover during the design process, and use to give personality to a work.  <br> <br>And why so down on risk? Recognizing happy accidents is a mainstay of the creative classes. <br></p>
