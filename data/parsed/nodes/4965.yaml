    html: "<p>&gt; a change in typeface is used as a navigational tool <br> <br>No. If you read the thoughts of the author (who directed the font choices) on this, you'd realize that it has nothing to with navigation, but everything to do with expression - albeit at the subsoncious level. <br> <br>&gt; most authors use language <br> <br>Yup. But not this one!  :-) <br> <br>It is indeed exceptional - and to me highly commendable - otherwise you must be of the position that text faces simply can't convey anything, and any new text faces are only needed to solve technical issues (or fill a huge void, like in some non-Latin scripts). <br> <br>There is another world out there beyond naive, conscious Modernism - but it's \"subvisble\", like in Biology or Physics: there are bacteria, quarks, etc. that decide our lives, even though you can't really see them. Serifs for example have huge subvisible relevance. <br> <br>hhp <br></p>"
