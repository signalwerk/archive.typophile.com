    html: <p>Hrant <br> <br>(yawn) <i>culture is about progress</i>  <br>��������������� <br> <br><b>PROGRESS</b> <br> <br>Would you not agree that "fine typography" is "progress?" <br> <br>Seamless logic suggests "beautiful" and "content sensitive typography" can easily be achieved by using a single typeface. All you need is an "immense amount of respect" for the principals of good typography.  <br> <br>Sadly, in this day and age my friends�that would be "progress." <br> <br>Morris Printing in British Columbia, famous as the best "book house" in Canada used in its entire career a single typeface�Baskerville. <br> <br>My shop,<a href="http://lanstontype.com/BuickIvy.html" target="_blank">http://lanstontype.com/BuickIvy.html</a> world famous for its typography, "book printer for Prince Charles and Lady Di", used Caslon Oldstyle <br><a href="http://lanstontype.com/CaslonGiampa.html" target="_blank">http://lanstontype.com/CaslonGiampa.html</a> or <br><a href="http://lanstontype.com/WineGlass.html" target="_blank">http://lanstontype.com/WineGlass.html</a> That was our "house face". I am sure most of you have never heard the expression, <i>"house face".</i> I am sure that "expression" is soon to disappear into the belching smog oozing from current smoke screens generated by the "self appointed prophets" of digital typography.  <br> <br><i>"Hobby horsemen"</i> that pretend to be hooded gladiators.  <br> <br>So by contrast I present a true "gladiator of typography". A horseman of another age, one that actually knew how to ride. <br> <br>Aldus Manutius successfully used, not only 1 typeface, but only 1 pt size. Far better work than those who "wave the black flags of progress".  <br> <br><a href="http://www.italnet.nd.edu/Dante/text/1502.venice.aldus.html" target="_blank">http://www.italnet.nd.edu/Dante/text/1502.venice.aldus.html</a> <br> <br>Conservatism in typography is so rare that it is certainly the "most daring" and certainly the most "radical today". Conservative typography radiates like a search light over a crystal palace amidst the <i>flag waving men mounted bareback upon sewer rats in their charge of the "dark brigade"</i> <br> <br>I hope sewer rats are not offended by the comparison. They are rather cute. <br> <br>There are legitimate reasons to use different typefaces. Historical considerations out trump the "need to be cyborgians". Cliche sound bites is a contest of 'let's race to the bottom". <br> <br>When choosing a typeface for a book I advise  you might not find it in with your "mood lipstick".  <br> <br>Just putting it out there. <br> <br> <br></p>
