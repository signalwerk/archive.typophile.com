  html: <p>I was expressing a gut feeling in <a href="http://www.typophile.com/forums/messages/30/36583.html?1085364787" target="_blank">another thread</a> concerning congenial typographic interpretations.  <br> <br>Thomas Phinney wrote <i>Indeed, if the typeface choice doesn't need to resonate with its content in any way, we wouldn't need more than a handful of functional typefaces in the world.</i> <br>Yes indeed. <br> <br>I've found that any <i>typeface of worth</i>, like Berthold's Garamond for example, would serve a detective story,  or a historical text just as well as a science fiction novel or <i>pretty much anything</i>. <br> <br>The trick is to use that one typeface as sensitive and sensible as possible, not choose between hundreds and hundreds. That's skill. That's what I think a good typographer should do.  <br>And that has been my experience.  <br> <br>My comment in the other thread may have sounded severe, but please note that this mainly concerns book typography. I have nothing against more expressive typography <i>per se</i>. <br> <br>And if you have some good examples where crazy typefaces enhance crazy content in sweet harmony, please allow me to make some exceptions to my rule. <br> <br>�</p>
  html_clean: <p>I was expressing a gut feeling in <a href="http://www.typophile.com/forums/messages/30/36583.html?1085364787" target="_blank" class="link-lost">another thread</a> concerning congenial typographic interpretations.  <br> <br>Thomas Phinney wrote <i>Indeed, if the typeface choice doesn't need to resonate with its content in any way, we wouldn't need more than a handful of functional typefaces in the world.</i> <br>Yes indeed. <br> <br>I've found that any <i>typeface of worth</i>, like Berthold's Garamond for example, would serve a detective story,  or a historical text just as well as a science fiction novel or <i>pretty much anything</i>. <br> <br>The trick is to use that one typeface as sensitive and sensible as possible, not choose between hundreds and hundreds. That's skill. That's what I think a good typographer should do.  <br>And that has been my experience.  <br> <br>My comment in the other thread may have sounded severe, but please note that this mainly concerns book typography. I have nothing against more expressive typography <i>per se</i>. <br> <br>And if you have some good examples where crazy typefaces enhance crazy content in sweet harmony, please allow me to make some exceptions to my rule. <br> <br>�</p>
