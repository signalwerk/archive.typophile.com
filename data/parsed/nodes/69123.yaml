    <p>I am working on the layout+production aspects of a school<br>
    diary as part of my classroom project.<br>
    _<br>
    Now looking for a typeface to use in my mock-up pages.<br>
    Have read up on Sassoon, designed for children.<br>
    Also looked at rounded fonts, like Helvetica Rounded and<br>
    VAG Rounded, but the i, j, l and t are quite confusing.<br>
    _<br>
    Please can anyone tell me what other choices I have?<br>
    And what all should I take into account?<br>
    Also, do I need to place this query in the Type ID forum?<br>
    _<br>
    Thank you all in advance.</p>
