      <p>Hi mbusher,</p>
      <p>At the moment, I don’t have the time to do a little research for you, but I strongly suggest NOT to GLUE or MOUNT any of the pages.</p>
      <p>KEEP EVERYTHING INTACT, an complete within their original order!<br>
      The mistake that people make with artifacts is that they try to clean, repair or mount them, when in fact, many times the item AS IT IS, is far more valuable as a document.</p>
      <p>An interesting advertising, photo, illustration or article may not be as valuable as the entire newpaper/magazine intact.</p>
      <p>So, please, do not do anything more than neatly protect them until you learn more about the value of what you have.</p>
      <p>Here is a link to <a href="http://www.rarenewspapers.com" target="new">RareNewspapers.com</a> where you might learn more about the value of the issues you have. There is also a section of items for displaying and preserving old newspapers.</p>
      <p>good luck,</p>
      <p>—————————————————————————————-<br>
      Yes, I’m old, but please don’t mount me (without asking)!</p>
