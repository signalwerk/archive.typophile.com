    <p>i recently came across a number of 50s papers in my loft, many of which have some ’keepable’ adverts/headlines/photos. however, given their age, they’re a tad fragile. i’m thinking about mounting the better ones so that i can scan them, but don’t know where to begin. has anyone got any experience of conserving old paper? i’m looking for suggestions on paper stock and glue (to re-assemble some of the more broken-up ones) that isn’t going to completely destroy them.<br>
    cheers.</p>
