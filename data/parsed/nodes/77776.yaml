      <p>It’s fascinating to watch the discussion develop, with a lot of comments which, to me, seem very little connected with the logo itself, and very much with the personal attachment to Starbucks as a (series of) physical place(s) or the opinion on a corporation.<br>
      I’ve been to Starbucks maybe once in my life (in Kyoto, I think), and my emotional involvement with it is the same I could have with McDonalds. To me, the past and present logo of Starbucks was always bordering the ugly, with some uninspiring typography to say the least. It never said “coffee” (except in the literal sense).<br>
