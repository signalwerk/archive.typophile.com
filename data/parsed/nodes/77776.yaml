      <p>I read all the arguments in favour of the change, and yet I am still puzzled by what exactly this update is meant to achieve. It changes the aesthetic feel of the logo (and through that of the brand and the company) dramatically. </p>
      <p>Current logo is enclosed, well-rounded and has an unmistakable personality (in part due to an unusual color scheme). It looks like something that you can get in a palm of your hand and it'd be a neat thing to toy with. Like an interesting coin, or a pebble. The rework has none of this. The black is gone, replaced by an over-abundance of rather unpleasant looking green. Gone is the feeling of being well rounded, replaced by a serrated edge. The melusine now <em>is</em> the logo, her weirdness is in your face, not counter-balanced or contained by other parts of the logo.</p>
      <p>How hard was it to have both greens and blacks in the new logo? Or better yet - to add a simple stroke around it?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/starbucks_6619.png"></div><p></p>
      <p><code></code><br>
      Retains much of the existing feel, gets rid of the Coffee and makes shareholders happy-happy, bling-bling.</p>
