      <p>It isn't a bad logo. Or, perhaps more accurately, it <em>wasn't</em> a bad logo.</p>
      <p>Originally, when Starbucks was one cafe in Seattle, a logo that looks like the sign outside, say, an English pub, was entirely appropriate - both to the business, and to the available budget for concerns such as branding.</p>
      <p>Over the years, I think they did an excellent job of modifying the logo so as to combine the two conflicting goals of having a brand symbol that has the elegance and stylishness befitting a major corporation - and a symbol with the quaintness and charm associated with a friendly neighborhood business devoted to quality.</p>
      <p>While the evolution has been away from (b) and towards (a), they've done an excellent job of keeping as much of (b) as possible while progressing towards (a).</p>
      <p>That mermaid with stripes is, in its own way, a great work of art, holding emotions and symbolism in perfect balance. Compared to the Mona Lisa, she's been minimalistic since 1987 and especially 1992, when the secondary circle motif was established.</p>
