      <p>I think my problem with this is that they were aiming for “simpler” but sometimes removing elements does not simple make.</p>
      <p>I mean, before, I looked at the symbol and I saw a badge; and that was it. A frame and a drawing inside. It was unified. But now that that same drawing stands alone, what I get is all the little details in the drawing (and the drawing does have a lot of detail). What was once “a drawing”, a single element, is now a jumbled mess of lines. It has become harder to “read”, to register.</p>
