    html: <p>Brands like Starbucks have to understand and nourish their own heritage very carefully or they go wrong. They have a global logo classic, why mess with it? You can hear the marketing people telling them they have to change it if they want to to diversify and 'grow the brand' but in truth they risk cutting themselves off from their own heritage and thus their authenticity, which is the MOST important thing if they don't want to lose their way. It's a misunderstanding of how people percieve branding. No one reads the words every time they look at the logo, they see it as a whole, it simply does not matter if it says 'coffee' but now sells more than that. it's part of their history. It's reassuring.  Real stories about real companies are quirky and not neat. Thus they are human. They should not be ironed flat. They want to avoid corporate blandness but have no idea how to do that or how to cherish their own genuine individuality. The Starbucks cup is the definitive unit of their identity and it doesn't look so good anymore. A bit like a less desirable ripoff. it's a cock-eyed marketing decision, not a design one. They are mad.</p>
