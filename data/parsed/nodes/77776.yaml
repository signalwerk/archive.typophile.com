    html: <p>SE, I think you're really right and would add only that, although they may not teach it in business school, a lot of these types of undertakings are the product of executive shoving matches over who's in charge and who's going to have the most visible legacy. Ambition and craft can make for some uncomfortable partnerships, and it's a lucky day when craft prevails. When you see relatively powerful entities tinkering with a successful brand it could be a lot of things — the need to stay fresh, the desire to expand, and so on — but it's also important to remember that for high-ranking people the very act of taking action and of making decisions is the single most important thing. You don't get recognized for doing nothing, and the tinkering is itself a theatrical device, an expression of power, a shaping of reality.</p>
