      <p>I don't think the new logo has less warmth and feeling than the one which immediately preceded it. The earlier versions might be considered superior from that perspective.</p>
      <p>But the newer one has exactly the same pictorial image as the one before; the only thing removed is the circle with the text. But the pictorial image is now larger, and now the green color that was in the circle is moved to the image.</p>
      <p>Even so, it is in a way more "modern", more functional. But I don't think it has those characteristics in a bad way. Yes, any change will always involve some loss, but in branding, change has to happen to keep an identity from becoming dated.</p>
