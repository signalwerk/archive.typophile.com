      <p>Well, I stared blankly too when looking up the history of the Starbucks logo. Why would they copy the green circle from an Italian newspaper, or, rather, why would an Italian newspaper in particular be taken as its source? (Later, I found an explanation for that logo with the Mercury head - it being of an espresso coffee chain founded by a former Starbucks manager that was absorbed into Starbucks when it finally relented and decided espresso was a good idea.)</p>
      <p>I have one Don Camillo novel I picked up in the (equivalent to a) remainder counter of a used book store. The author complained of the present generation, pursuing "La Dolce Vita", for whom the book was (most emphatically!) not written in a preface.</p>
      <p>These are a series of comic novels about a small-town priest and his rivalry with the local Communist agitator. Thus, at one point, Don Camillo finds a statue of an obscure, possibly legendary saint, on the grounds of his church annoying and ugly, so he dumps it in the river one fine night; the Communist catches him at it, and so the next day, he rescues this statue of a saint from the river where, obviously, some terrible vandals had put it, and so he is hailed as a hero for being so generous to his natural opponents, the traditional Catholic Church... and the reader is given to understand, I suppose, that God used him to correct a spiritual problem Don Camillo was suffering from, thus leading this quiet priest further along the truly saintly life.</p>
