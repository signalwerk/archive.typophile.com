    <p>top of the morning to ya... ok im new to the mac- font- world... i went to a web page and downloaded a font but i cant use it or put it in my font book....the end of the file name is ” .si ” is that why?  so what im trying to ask is how do you download a font? and get it into your font book  </p>
    <p>thanks for your help :)<br>
     ERICA</p>
