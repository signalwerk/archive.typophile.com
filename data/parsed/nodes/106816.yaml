      <p>Bill, thanks, I know what the New Yorker looked like in hot metal. As one went up to books back then, I liked it more. As one went down to newspapers, I liked it less. It was a purely economic issue, never really in the hands of typographers. </p>
      <p>Now, I like it that they all have to same wide choices, and that none of them have the taste for what <em>could,/em&gt; be accomplished today to make it look like it used to, but won't. Making decent looking type rattle along the baseline on the screen is pretty hard.</em></p>
