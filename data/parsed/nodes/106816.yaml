      <p>At ﬁrst impression, Caslon is a strange choice—doesn’t ﬁt the Art Deco era vibe that Irvin and Neutraface carry.</p>
      <p>Apart from misplaced historical allusion, it’s rather high-minded and didactic (to quote from the review of <em>The Butler</em> shown above) and lacking in glamour, especially in Bill’s readability-ﬁrst treatment.<br>
      Something less of a workhorse, with a bit more style, would suit the <em>New Yorker</em> more, IMO.</p>
      <p>However, I do like what I’ve seen of the Irvin shenanigans, and perhaps the plainness of the body text can complement the visual interest there—I’ll keep a look out for it in print to see if the real thing impresses me more than what I’ve seen online.</p>
