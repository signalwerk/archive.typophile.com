      <p>Bill, the lack of character spacing in that old specimen is not due to technological limitation, but typographer preference. I don’t know about Linotype, but Tolbert Lanston originally planned to have character spacing in the Monotype machine’s justiﬁcation and ﬁgured out how to do it; however, in tests people didn’t like the way it looked, preferring word-space adjustment only.</p>
      <p>Quark XPress is largely responsible for the look of justiﬁed text today, by making character spacing part of the default H&amp;J setting.</p>
      <p>@Bill: <em>I certainly don't believe there is any virtue in being 'pure' about it, as Nick recommends.</em></p>
      <p>I didn’t recommend, I preferred.<br>
      Being a <a href="http://en.wikipedia.org/wiki/Purist" rel="nofollow">purist</a> in matters of style concerns taste, not “virtue”:</p>
      <p>Manny, yes, our tastes differ. Really.</p>
