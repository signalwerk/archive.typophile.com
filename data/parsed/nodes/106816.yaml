      <p>Nick –</p>
      <p><em>Quark XPress is largely responsible for the look of justiﬁed text today, by making character spacing part of the default H&amp;J setting.</em></p>
      <p>That’s true. When I researched and wrote two technical white papers in 1991 comparing the composition capabilities of QuarkXPress and PageMaker (I did this for the Aldus Corporation, maker of PageMaker, but it was a technical comparison, not a promotional piece), looking under the hood of both programs’ composition engines, I discovered that, no matter how you set the defaults, QuarkXPress would invoke letter-spacing too early in the decision tree of its H&amp;J. In PageMaker, if you set all the letter-spacing values (Minimum, Optimum, Maximum) to zero, the only time you’d see any letter-spacing to justify was when a line contained only a single word. (At that point, <em>something</em> has to give.) QuarkXPress’s H&amp;J routines would invoke letter-spacing even when you tried to forbid it. </p>
      <p>There was a time when the <em>New Yorker</em> first started using QuarkXPress to set its type when you would see horrendous letter-spacing throughout the narrow typeset columns. They fixed the defaults within a few issues, but the legacy of that letter-spacing still lives in the <em>New Yorker</em> today, two decades later.</p>
