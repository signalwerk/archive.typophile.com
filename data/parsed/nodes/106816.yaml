      <p>Thanks, Jason!</p>
      <p>The wide word spacing in Nick's scan comes, as I understand it, from a combination of the way the Linotype machine operated, and the pressures on compositors. As <a class="freelinking external" href="http://en.wikipedia.org/wiki/Linotype_machine#Justification" rel="nofollow">the wikipedia article explains</a>, the Linotype machine put a wedge between words, when compositor hit the space bar. Then when a line was complete, the machine would in push the wedges to expand the spaces to fill out the line and justify it. A lazy compositor could do less hyphenation, and just let the machine justify the line by shoving the word spaces out wider. This is the kind of thing that Geoffrey Dowding excoriated in his 1954 book <em>Finer Points in the Spacing and arrangement of type</em>. In the subsequent phototype era, the pendulum swung the other way. </p>
      <p>The wide letter spacing in Linotype Caslon Old Face was a deliberate choice by the designers at the Linotype company, and was probably determined by Chauncy Griffith, who was overseeing the production of fonts at the time. The letter spacing may be a little wider than the original Caslon Long Primer typeface, but the original letter spacing is also very wide compared to what is common today – at least judging by the sample in Caslon's 1766 specimen book. Most likely it was Griffith's attempt to be 'pure,' in the sense of being true to the look of the original, as much as he could, given the limitations of the Linotype machine.</p>
