      <p>Thanks, all, for the kind words.</p>
      <p>A little context for my Anglo-Canadian friends, Nick Shinn and John Hudson. </p>
      <p>First of all, my scan is only of one corner of the page. Much of the page is text, so the decorative elements of the new version of Irvin and the drawings function as more of a punctuation on the page, and dominate it less than in my scan. </p>
      <p>Second, some historical context. When The New Yorker was founded in 1925 Rea Irvin, their first art director, drew the whimsical all caps titling face they use (based on contemporary lettering, as the video indicates), and chose the then new (1923) Linotype Caslon Old Face for everything else. Ever since then, The New Yorker has stayed loyal to Caslon, and their unique display face, which they now call Irvin. </p>
      <p>The look Irvin created paired the whimsy of his display face with the sober but amiable Caslon. The two typefaces are indeed quite a contrast. But it is a contrast that has visually branded the magazine for 88 years, and is loved by its readers, who now number over a million every week. It may be a look that has lasted the longest of any magazine still in print. The freehand whimsy of Irvin also is a visual bridge to the many freehand illustrations in every issue, and its famous one-panel cartoons, always captioned in Caslon Italic. The two contrasting feelings of Irvin and Caslon somehow manage to visually work with both serious reporting and weekly short stories from the most renowned US writers, as well as humorous pieces and the cartoons. </p>
      <p>So the current redesign wanting to stick with Caslon is certainly neither odd nor unhistorical. In fact, their having used Sabon for the listings for a time was, in my view, the odd and unhistorical choice.  </p>
      <p>As to the redesign, I had nothing to do with it except completing my Caslon Small for the listings. If anyone asked me, I'm sure I would offer tweaks, including what Karsten suggests, spacing out the Neutraface Caps. And though I am a great admirer of Neutraface and of Christian Schwartz's work generally, I'd rather see it be all Caslon and Irvin, as in the original. (I recently looked at editions from 1929-30, which I found quite wonderful.) </p>
      <p>However, I still think the current redesign works quite well. It also serves their new design purpose. Since everyone can check listings on their smart phone, they wanted to emphasize their beautifully written cultural critiques and commentary, and the new more continuously readable look serves that. </p>
      <p>Finally, a word on Art Deco. To me, the interwar period in the 20th century is America's best, as far as decorative arts, along with the neo-classical period of American Federalism. It is also very characteristic of the best of New York City style. Maybe it is a weakness that I like it so much, but if so it is a weakness I share with a lot of my countrymen.</p>
