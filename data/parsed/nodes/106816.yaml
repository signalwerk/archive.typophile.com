    <p>Williams Caslon Small is my new text font for small sizes that I did for the partial redesign (as of Sept 23) of The New Yorker. Its proportions are based on Caslon's original Long Primer size, and the shapes are based on my Williams Caslon Text (for 10-12 point), already published by Font Bureau.  </p>
    <p>Attached is a comparison of the old and new. The old was Sabon I believe at 8/8, negatively tracked, which was pretty taxing to read. Mine is set at 8/9, also negatively tracked, by 20 units. I think mine ideally shouldn't be negatively tracked more than 10 even in such a narrow column, but it still works, and is much more comfortable a read. You have to actually see this in print for a real comparison, but I'm gratified that so far it's had a very positive reception. </p>
    <p>TNY creative director Wyatt Mitchell explains the ideas behind the redesign in <a class="freelinking external" href="http://www.newyorker.com/online/blogs/culture/2013/09/redesigning-the-goings-on-about-town-section.html" rel="nofollow">this video.</a></p>
    <p>The redrawing of the iconic New Yorker titling face Irvin, with additional raised characters and ligatures, <a class="freelinking external" href="http://www.houseind.com/showandtell/2013/09/19/HouseIndustriesfortheNewYorker" rel="nofollow">was done by Ben Kiel of House Industries.</a> Christian Schwartz also apparently did some modifications of his Neutraface (also published by House Industries) for the redesign.</p>
