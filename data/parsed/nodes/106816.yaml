      <p>I definitely think that Williams Caslon Small is a beautiful typeface, and the change is definitely an improvement from a readability standpoint.</p>
      <p>However, Nick Shinn is also correct in noting that the <em>New Yorker</em> aims at a sort of Art Deco look. Caslon still fits that better than a lot of other typefaces would, so it's not a total miss, but there indeed likely could have been better choices.</p>
      <p>Or could there? When I try to think of an Art Deco face, what comes to mind are faces like Kabel, which are sans-serif, and not ideally suited for body copy. Still, Sabon did seem to fit the "look"; could its readability have been improved, or could it have been replaced by a different, slightly bolder, Garamond (as well as adding one point of leading) with a similar result from a readability standpoint?</p>
