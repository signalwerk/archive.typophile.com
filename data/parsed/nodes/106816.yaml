      <p>No, you can’t have a taste for something which doesn’t yet exist, but there is always an interest in non-slick type; for display typography at the moment.</p>
      <p>Rough typography—sometimes an attempt to humanize corporate marketing, other times the expression of a high-touch sensibility to humanize the high-tech lifestyle—is not to be confused with imitating the past.</p>
      <p>As screen resolution increases, rattled text type, or some such thing, will become more feasible.</p>
