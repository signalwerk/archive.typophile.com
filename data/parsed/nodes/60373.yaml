    <p>Greater Albion Typefounders have just posted a preview of our next major forthcoming release 'Crewekerne' on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  Crewekerne (nicknamed in house the font with the four e's) explores further the idea of 'Arts and Crafts' movement inspired faces that also inspired our recent Gildersleeve family.</p>
    <p>We've also just posted details of a special introductory offer on the Gildersleeve family on the <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  </p>
    <p>The other release we currently have in the pipeline is something a little more formal-Bonnington.  Watch this space!</p>
