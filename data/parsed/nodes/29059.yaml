  - id: 164648
    user: 4406
    date: 2006-10-25T18:11:00
    date_raw: 25.Oct.2006 6.11pm
    votes: null
    html: <p>Clarion doesn’t match in micro-details, such as the high inner join at the top left of the M. WhatTheFont reported <a href="http://www.myfonts.com/fonts/dsgnhaus/pastor/semi-bold/">Pastor Semi Bold</a>, which has the right U symmetry, but the serif treatment on the “S” doesn’t quite match. This could be a custom job - aside from the U symmetry, it’s a pretty generic modern cap.</p>
