  html: |-
    <p>Hello,</p>
    <p>I am looking to purchase a headline typeface for use in a corporate identity type system. However the word spacing is a bit wider than I would like. From experience would anyone recommend trying to adjust the word spacing in a program such a glyphs and saving out a new version? If that is too much of an undertaking them I will contact the type designer directly to see if something could be worked out.</p>
    <p>Thanks,</p>
