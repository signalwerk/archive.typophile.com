    html: |-
      <p>I think the OP is right to modify the font to work out of the box, rather than hope that most (any?) users will follow guidelines, use stylesheets, or care even one whit about wordspacing. In fact, you could argue that it's the duty of the branding designer to anticipate and remove as many of those responsibilities from the end user as possible.</p>
      <p>(Letterspacing can be adjusted in PowerPoint and Word, and the space character is adjusted along with it, but I'm not aware of any way to adjust wordspacing independently.)</p>
