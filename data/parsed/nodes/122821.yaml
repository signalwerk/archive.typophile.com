    html: <p>Because of licensing issues contacting the designer is your best option. The space character is about the easiest adjustment possible so they shouldn't charge you much if they are willing to do so. Also, I'm not very familiar with the workings of InDesign, but I think it offers space options that override that of the font.</p>
