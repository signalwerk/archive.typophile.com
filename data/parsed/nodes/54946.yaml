      <p>You might want to consult <a class="freelinking external" href="http://www.amazon.com/While-Youre-Reading-Gerard-Unger/dp/0976224518/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1235018181&amp;sr=1-1" rel="nofollow">While You're Reading</a> by Gerard Unger. </p>
      <p>But "visual characteristics of typography and the way it communicates with the reader" is a bit broad. If you can narrow it down a bit, perhaps we might be able to suggest more books that would be worthwhile. Otherwise, just about any book on typography covers the visual characteristics and how it communicates with the reader.</p>
