      <p>Thank you!<br>
      Well, my big questions about that theme are:<br>
      Do you think typography can communicate the way we speak?<br>
      How many emotions can be communicated through typography?<br>
      Why has someone used that typeface instead of some other (in advertising, in packaging..)?<br>
      Do you think a typeface can illicit zero emotional reaction in the viewer?</p>
      <p>I already read The Elements of Typographic Style by Robert Bringhurst, Thinking with type by Elen Lupton, TypoGraphic by Ivan Vartanian, Logo Font&amp;Lettering Bible by Leslie Cabarga, and The Vignelli Canon by Massimo Vignelli.<br>
      I read this books becouse they were the only one I could find. I think about ordering from amazon but i have modest budget :(</p>
