      <p>If you're looking for another quick but very informative read, buy a copy of <em>Stop Stealing Sheep &amp; find out how type works</em> by Erik Spiekermann and E.M. Ginger.</p>
      <p>Editorial review on Amazon:</p>
      <p>"It explains in everyday laymen's terms what type is and how you can use it to enhance the legibility, meaning, and aesthetic level of your work. They elegantly touch on all aspects of typography, including the history and mechanics of type, how to train your eye to recognize and choose typefaces, and how to use space and layout to improve overall communication."</p>
      <p><a href="http://www.amazon.com/Stop-Stealing-Sheep-Find-Works/dp/0201703394" title="http://www.amazon.com/Stop-Stealing-Sheep-Find-Works/dp/0201703394">http://www.amazon.com/Stop-Stealing-Sheep-Find-Works/dp/0201703394</a></p>
