    html: |-
      <p>"I NEED ALL FRIENDS..." looks like a cut of <strong>Playbill:</strong><br>
      <a href="http://new.myfonts.com/fonts/bitstream/playbill/alternate_cuts.html" title="http://new.myfonts.com/fonts/bitstream/playbill/alternate_cuts.html">http://new.myfonts.com/fonts/bitstream/playbill/alternate_cuts.html</a></p>
      <p>or a very expanded/modified version of <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/ponderosa/" rel="nofollow">Ponderosa</a></strong></p>
      <p>"CHARLIE BROWN" is similar to <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/blackoak/" rel="nofollow">Blackoak</a></strong><br>
      maybe a not so heavy cut, with a different /C</p>
      <p>and "HAPPINESS..." must be <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/ef/volta/" rel="nofollow">EF Volta Bold</a></strong></p>
