    <p>Does anyone have any idea what this is?</p>
    <p>I’m pretty certain it is a font because I saw one of their vans on the way to work this morning. There was more text in a style that seemed to be the same, unfortunately I didn’t have a camera with me.</p>
    <p>It is simalr to (but not the same as) Process Type’s Klavika</p>
    <p>Thanks<br>
    Richard</p>
