    <p>These might be slightly hard questions and prone for debate, but I just want to get a sense of years and designers involved.</p>
    <p>Which were the first type families to formally and officially include <strong>a)</strong> bold weights <strong>b)</strong> italic versions and <strong>c)</strong> condensed and extended versions?</p>
    <p>How groundbreaking was Univers in selling the packaged type family that included different weights and widths? Were there others before it?</p>
    <p>Hopefully these are not too open-ended either.</p>
