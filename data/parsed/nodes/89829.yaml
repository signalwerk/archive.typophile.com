    html: |-
      <p>To answer my own question: the initials are Italian ornamental letters dating from 1839. They can be found in a book by Laurence Scarfe called "Alphabets: An introductory treatise on written and printed letter forms for the use of students". </p>
      <p><a href="http://justsomethingimade.com/2010/11/vintage-alphabet-christmas-books/" title="http://justsomethingimade.com/2010/11/vintage-alphabet-christmas-books/">http://justsomethingimade.com/2010/11/vintage-alphabet-christmas-books/</a></p>
