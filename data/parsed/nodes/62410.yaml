    <p>Last night I was at my daughter’s high school for Meet The Teacher night. In the classrooms, I observed that they had prominently displayed notices with instructions on what to do in the event of a lock-down or evacuation.</p>
    <p>The typeface they used for these notices was, of course, Comic Sans.</p>
    <p>I remarked that if they were going to use that face, they might as well go the whole nine yards and add hearts and rainbows and smiley faces. My daughter accused me of being a font nerd. It’s a fair cop.</p>
    <p>(I’m old enough to remember when lock-downs were something that they only did in prisons, but that’s another topic.)</p>
    <p>—Jim Tubman</p>
