      <p>Font nerd that I am, I paid more attention to the school typography than to the stuff I really ought to; good thing my wife was there to listen to the teachers.</p>
      <p>Happily, no Papyrus to be seen anywhere. There was Comic Sans for signs telling what to do in life-or-death situations, Helvetica for room numbers and other directional signage, and a very Celtic uncial face used to promote Spanish language classes. (There were(/are?) Celtic people in the Spanish region of Galicia, but I doubt that the sign designer knew that.)</p>
      <p>Actually, based on what I saw, I suspect that the students are more clued in about appropriate font selection than are the school administrators. A hopeful sign.</p>
      <p>Jim Tubman<br>
      Calgary, Alberta, Canada<br>
      “The Stampede City”</p>
