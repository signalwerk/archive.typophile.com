      <p>Bruce Chizen, CEO, Adobe:</p>
      <p>"One of my biggest challenges in taking over from two great founders has been trying to figure out how to change the company without destroying the culture that John and Chuck built. It's tough -- because the company needs to mature, needs to be much more business focused. Yet, at the end of the day, innovation is about the employees. We're an I.P. [intellectual property] company -- it's what's in people's heads that makes a difference. And the fact that we keep making the Fortune "Best Places to Work" list is refreshing. The fact that we improve on the list is even more refreshing, despite the company having become much more performance oriented."</p>
