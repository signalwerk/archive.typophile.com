    <p>Hi,</p>
    <p>I’m going to be giving a presentation about designing identity system and I was thinking of staring my presentation with a famous quote or some words of wisdom by a designer, typographer, etc. regarding designing a an identity system or even design discipline in general. Something to warm up a crowd and connect with the audience. Does anyone know some quotes that could work in my case or could point me somewhere I could find something. All help would be greatly appreciated ! Thanks very much,</p>
    <p>Jen</p>
