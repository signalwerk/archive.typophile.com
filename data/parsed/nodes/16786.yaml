      <p>Ironically, Erik Spiekermann provided me with some quotes relating to this subject just earlier this evening. I hope he won't mind my sharing them here.</p>
      <p>'You cannot not communicate' - Paul Watzlawik</p>
      <p>'You are what you are seen to be' - Erik Spiekermann</p>
      <p>'Appearances are not false' (Nur der Schein trügt nicht) - Paul Klee</p>
      <p>'Form is the outside of content, and content is the inside of form' - Jean-Luc Godard</p>
      <p>Of course, one implication of all these quotes is that identity design won't do anything for you if you suck.</p>
