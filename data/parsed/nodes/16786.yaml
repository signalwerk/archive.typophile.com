      <p>Here are a couple I've read in a great book "Designing Brand Identity" by Alina Wheeler...</p>
      <p>"Products are created in the factory. Brands are created in the mind." - Walter Landon, founder, Landor Associates</p>
      <p>"A logo is the point of entry to the brand." and "Extraordinary work is done for extraordinary clients." - Milton Glaser, designer</p>
      <p>"Design is intelligence made visible." - Lou Danzinger, designer and educator</p>
      <p>"Don't explain, identify." - Paul Rand, designer (This is especially useful for the client who believes that the logo must explain what the company provides)</p>
