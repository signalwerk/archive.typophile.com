      <p>Yeah yeah… point taken.</p>
      <p>I am quite aware that this could be a custom design. However, I'm also aware that there is a trend happening with hand-generated fonts, aka 'Hand-Set' fonts, that do not necessarily end up as full body typefaces (in the traditional sense – with formatting and alternates).</p>
      <p>You can see some examples here:<br>
      1) <a href="http://www.youworkforthem.com/list.php?cat=113">http://www.youworkforthem.com/list.php?cat=113</a><br>
      2) <a href="http://www.t26.com/illustrations/Wood_Type_Bundle">http://www.t26.com/illustrations/Wood_Type_Bundle</a><br>
      3) <a href="http://www.t26.com/illustrations/SketchType">http://www.t26.com/illustrations/SketchType</a></p>
      <p>And given that the image was taken from a week-to-week HTML email (which you'd think would be a bit overkill to produce some custom lettering for), I was hoping someone might have come across this.</p>
      <p>I have posted with consideration folks.</p>
