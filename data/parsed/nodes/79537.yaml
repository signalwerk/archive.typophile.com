      <p>@Floatingworld;<br>
      My point was first that because of the amateurish nature of the lettering and the fact there were no duplicates it is most likely hand lettering. I do realize there are a number of simple free fonts like this available, but these usually don't include enough alternates to do this setting.<br>
      Secondly… I'm not trying to come off sounding so pointed towards you particularly. I'm sure you have valid reasons for posting. I've just seen so many postings that do assume everything must be a font. I even had a potential client a short while ago asking about a using my font for her logo like the one in my "hand lettered" design. I actually had to explain a few times that it was in fact not a font. The fact that you also asked for an alternative at least showed you were open to the possibility it wasn't type. I did actually search to find something close, but didn't see anything all that close to the sample. Granted my tone was a bit sour. I don't typically have harsh comments and so I apologize for that.</p>
      <p>You might consider asking the folks who send out the weekly HTMLemail about the lettering. I imagine they would let you know if it was a font or handlettering. It's possible they have a custom font.</p>
