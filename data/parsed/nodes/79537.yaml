    html: <p>Two words... sterile sans!!!!!! It has taken over to the detriment of words with passion. I look at magazines and they are boring, ultra "sanitary," no personality... and students are being fed Helvetica and all its variants, ad nauseam. Then when they encounter something with an "out of the box" appearance (no matter how bad) they think that it is a font because the do not have the skills to differentiate, or how to engage an artist to do what they need. Or worse yet... they are to cheap to pay for original art to enhance the product!</p>
