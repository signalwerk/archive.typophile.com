      <p>@ Steve</p>
      <p>In this instance it is not a font... I knew it and had no problem stating such. I have no problems suggesting an alternative. I just get tired of people going "what is that font" without the slightest bit of knowledge, assuming something like this is a font. I do not accept the premise that if it is in print it must be a font, which is what a lot people assume.</p>
      <p>As one who earns his living with calligraphy, lettering, hand drawn  etc. forms I figure I don't f*** up that much when calling something like this. If I am not sure, I keep my mouth shut. So do not include me in your witch hunt of erroneous font/non font identifiers with red faces!</p>
