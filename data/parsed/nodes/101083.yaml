    html: <p>Generally, the only person you should be concerned about pleasing is the person who will be assigning your grade. And, quite frankly, unless your thesis is about typography, your professor is likely to give a rat’s ass about what font it’s in, as long as it’s readable…IMHO. BTW, ditto for résumés…</p>
