    html: |-
      <p>Two thoughts off the top of <em>ma tête</em>:</p>
      <p>(1) In general, words decode more easily in caps and lowercase than in all caps (some followers of this site may not share that opinion). It's worth a try, though the effect is diminished in words with few ascenders or descenders (such as <em>Livre</em>).</p>
      <p>(2) You've included a sort of icon in your logo, a ribbon bookmark that sometimes stands in for the letter <strong>I</strong> and sometimes appears as a decorative element. If you're going to include an icon, why not make it a stylized picture of a book, so it helps your readers decode the title word?</p>
    html_clean: |-
