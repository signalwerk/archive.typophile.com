    date_raw: 29.Oct.2009 2.23pm
    votes: null
    html: |-
      <p>I think that it's certainly within the scope of the OpenType fonts to provide a number of alternates. MADType's <a class="freelinking external" href="http://new.myfonts.com/fonts/madtype/casino-hand/casino-hand/characters.html" rel="nofollow">Casino Hand</a> is one such font, although it is not the same as the posted sample. Another is Alejandro Paul's <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000316#characters" rel="nofollow">Pronto</a>. However, neither of these two fonts IS the font in question. I think it is a font because I see no more than two variations of any letters, which is certainly do-able in OpenType.</p>
      <p>- Mike Yanega</p>
