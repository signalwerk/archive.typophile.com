    <p>Hi all,</p>
    <p>I've been working on this display typeface for a while now. I've designed it for my 'Invisible Cities' project, where I intend to use it for titling, texture, ornament etc. It's designed to work as confusing as a labyrinth (and almost invisible), but still be descipherable. What do you think?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Labyrinth03_5142.jpg"></div><p></p>
    <p>ciao, Jeffrey<br>
    <a class="freelinking external" href="http://www.infraordinaire.com/wordpress/" rel="nofollow">infraordinaire</a></p>
