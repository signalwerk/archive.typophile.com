    <p>Ricardo has been a Typophile user since 2005. He’s in the “Prolific Poster” as one of the top contributors in the past 10 days... yet his icon is the generic, blank T. Design Ricardo an icon and post it in this thread for him.</p>
    <p>What do you say Ricardo? If someone posts a good one would you use it?</p>
    <p>Same goes for Robert Koritnik, aka <em>litera</em>. He’s listed as a top contributor, but he’s only been a member for almost 4 weeks.</p>
    <p>Best designs win bragging rights for the week.</p>
    <p>REQUIREMENTS:<br>
    60 x 60 pixels<br>
    JPG or GIF</p>
