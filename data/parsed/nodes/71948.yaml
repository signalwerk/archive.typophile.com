      <p>Thanks Twardoch,</p>
      <p>But what I'm looking for is a method of matching the grid on the paper.</p>
      <p>The x height on paper is a specific amount of squares tall, how do I apply the same amount of squares to my x height in fontlab?</p>
      <p>Thanks again</p>
