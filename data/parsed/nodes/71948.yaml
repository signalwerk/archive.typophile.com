    <p>Hi guys,</p>
    <p>I'm about to start digitizing a typeface for a designer who has never used Fontlab.</p>
    <p>Each glyph has been drawn by hand very well on strict gridded paper.</p>
    <p>Is there a method of applying the same paper grid to my Fontlab grid?</p>
    <p>Thanks a lot guys!</p>
    <p>–B</p>
