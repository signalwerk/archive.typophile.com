    html: |-
      <p>I've been using CorelDraw since version 1, so I'm not shocked in the least.</p>
      <p>From long (that is, fifteen years' experience), I would recommend using Fontographer for EPS import, since it imports EPS at 100% of size all the time, whereas FontLab imports at 100% or 99% or 98%, depending on the EPS file. To speed up the export/import operation, I generally export five to eight characters at a time. In the A slot, I import A B C D E, then I cut B C D E, move onto the next slot, paste, cut, etc.</p>
      <p>In order to ensure that all glyphs import at the same size relative to each other, you need to place reference marks above and below the exported groups. IN CorelDraw, select each string of characters as you have created them and note the overall height of the group. I usually create all uppercase characters on one line, all lowercase on another; exclam through at on another; dagger through questiondown on another; then incidental characters on a fifth. Taking the largest of these measurements, I created a rectangle slightly larger than that measurement, then center it on the group of characters which is the tallest. I then break the rectangle apart, delete the uprights, then add a third horizontal line at my baseline guideline. Combine the three horizontals, copy and snap to the baseline guideline of the other groups.  On any given line, copy this object, center it on an export group, delete the baseline reference, then duplicate the altered marker for each subsequent group.</p>
      <p>Select the group of letter and the reference marks and Export Selected Only. In Fontographer, every character will then import in precise proportion. Delete the reference marks just after importing, and you're home free.</p>
