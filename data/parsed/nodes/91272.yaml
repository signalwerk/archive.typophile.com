      <p>Thanks Old Nick.  This is basically what I do, except for the idea of importing a reference shape along with the glyphs, which is BRILLIANT!  However I still find this very time consuming.  I wonder if anything could be done with pages?  putting a different glyph on each page in Coreldraw, in some certain preset order, and Fontographer will automatically know where the A is and where the L is, etc... But I'm probably just dreaming.  Some sort of built in OCR would be great too.  Just import your complete glyph set and Fontographer will use OCR to decide which glyph to put where.</p>
      <p>I also know that it's possible to create a font with Coreldraw only, and since Coreldraw has scripting support, there might be some kind of way to automate that, even if only to get a "transitional" font that will simply be used to ease the loading into Fontographer.</p>
      <p>also, I have to say Fontographer definitely does NOT keep the glyphs at the same size for me.  IDK, maybe there is a preference setting somewhere I need to turn off, though I did look for one.</p>
