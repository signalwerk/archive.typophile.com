      <p>Ryan,</p>
      <p>All i can say that the process I described has been working for me for about fifteen years now. It generally takes me twenty minutes or less to import all my glyphs into Fontographer, which also includes setting “working” sidebearings. After checking off “Selected only” in the CorelDraw Export dialogue the first time, the process goes: select items, select Export, hit Enter twice, ALT+TAB, ALT+F+M+E in Fontographer, select EPS file and done. It takes less time to perform these actions that it does to read them.</p>
