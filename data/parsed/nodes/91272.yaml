  html: <p>I am just still so much more at home with my illustration program than I am with Fontlab or Fontographer.  I pretty much design the whole set of glyphs in Coreldraw (shocking, I know) and then bring it into Fontographer.  However, there seems to be no easy way to do this in bulk.  That is to say I have to export every single glyph as a separate eps file and then import them one at a time.  Tremendously time consuming, and not to mention that Fontographer seems to auto-adjust the size of the glyphs to whatever it thinks is right, ruining things like x-height and etc.  There must be some easier way to do this in this day and age?</p>
