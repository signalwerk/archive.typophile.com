    html: |-
      <p>ScanFont will try to figure out what's a character in your Illustrator file, partly by OCR, partly by surrounding white space. You can manually override its "decisions" if you need to. I don't know if there are any limits to the number of characters you can have. It doesn't always guess right what letter (or number) is what, but it's easy enough to rearrange things once it's in FontLab.</p>
      <p>By the way, if you are using Mac OS 10.7 (Lion), it won't run. You'll need to run the Windows version in Wine or a virtual machine. (More info here: <a href="http://www.fontlab.com/front-page/welcome/mac-os-x-10-7-lion-compatibility/" title="http://www.fontlab.com/front-page/welcome/mac-os-x-10-7-lion-compatibility/">http://www.fontlab.com/front-page/welcome/mac-os-x-10-7-lion-compatibility/</a> )</p>
