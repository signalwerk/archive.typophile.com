    html: <p>I think you underestimate how accessible a non-"comic" typeface can be to comic readers. I've seen fine comics with speech set in all kinds of fonts (Kabel in all lowercase, for instance) and nobody ever thinks to mention it as long as they can read it. Your primary concern should be complementing the style of your art, and depending on your art, the question of whether it resembles hand lettering is not always high on the list of criteria by which you do that.</p>
