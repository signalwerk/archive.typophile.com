      <p>Wow... Blambot has a craaazy large collection of very usable fonts. Glad I caught this post.</p>
      <p>If you find something better or more appropriate than Blambot... definitely post what you find.</p>
      <p>Fundamentally, these are script/handwriting fonts. And the conventional wisdom is that "fonts" will always struggle to match the personality of actual handwriting. What you see as mediocrity is largely the limits of how close fonts can get to handwriting.</p>
