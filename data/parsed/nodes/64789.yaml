      <p>Thanks for all your feedback people, some really interesting thoughts. I think I was both hasty and misunderstood with my comments on Blambot. I know these are good comic fonts, but they're very typical of the genre and I was hoping to do something a wee bit different. More importantly though, whenever I've read a post like this in the past everyone's just been directly referred to Blambot. I wanted to avoid that easy answer and get some discussion/debate and that's what I got, so thanks again and sorry if I offended anyone!</p>
      <p>There are two key points you guys raised that have made me think:<br>
      1. These are replicating hand-written styles and that's key in how appropriate they are for the artwork. It might be a huge undertaking and I've worked with comic artists before who wouldn't recommend it, but one idea I've had is to choose a font I like with lots of weights and versatility, typeset everything as it would be, then trace it to bring a hand-written element in. Madness?<br>
      2. Many of the styles on Blambot are very American in nature. I neglected to mention this, but the project is European and perhaps the use of upper and lower case lettering would reflect that better? Something like Herge's work with Tintin?</p>
      <p>Thanks again!</p>
