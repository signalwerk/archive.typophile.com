  html: <p>I'm designing a graphic novel at the moment and we're striving to make it more of a design piece than your typical comic book. Part of my role is to do the lettering for the speech bubbles, but as a graphic designer I'm used to picking and using 'nice' fonts. If I stray too far from the typical stuff found on the likes of <a class="freelinking external" href="http://www.blambot.com">Blambot</a> it won't be accessible to a lot of the readers, but by and large these fonts are crap. Any suggestions as a middleground?</p>
