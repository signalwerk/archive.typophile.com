      <p>This sound as an interesting project!<br>
      In selecting the typeface(s), first thing I would try to define the reference points. I.E.: are you going the way of classic comic books (all caps)? The way of the more mature comic books (like Sandman and others, in which some characters use different treatment of typeface and/or speech bubbles)? The french (and other european comics) way (upper and lower case)?</p>
      <p>That said, if you really want to make a post-avant-garde-retro-futurist statement, you can always typeset all in Comic Sans! ;-)</p>
      <p>P.S.: I suppose you already checked <a href="http://www.comicbookfonts.com/home.html" title="http://www.comicbookfonts.com/home.html">http://www.comicbookfonts.com/home.html</a></p>
