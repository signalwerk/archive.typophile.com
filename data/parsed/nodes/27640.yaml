      <p>I don't think so… looks rather tight to me. I can't tell everything from the photos… but if they keep the tight-but-not-touching treatment to the headline areas only the design might be OK overall.</p>
      <p>The BBC article is interesting. The German media coverage of the exhibition that I have seen has focused on how little the exhibition focused on Germans who were dispersed from Poland. It was supposed to be an exhibition on refugees in gerneral.</p>
      <p>I saw interviews with several political and cultural figures from Poland who had visited the exhibition and who seemed quite relieved about the actual focus. They thought that it was a perfectly good exhibition. But I also remember a counter point made by a woman from Prague, though. She thought that the exhibition didn't focus enough on "why" the Germans were forced out of Eastern Europe, referring to the level of enthusiasm for Hitler in the Sudetenland before 1938, etc. </p>
      <p>Of course, I saw these interviews on German state TV, so there is certainly the possibility of bias in the opposite direction of any BBC bias…</p>
