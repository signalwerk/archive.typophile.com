      <p>Bill: <em>According to the history I am looking at the Spanish Inquisition was authorized by Pope Sixtus IV in 1478, and later authorized extensions of it.</em></p>
      <p>Yes, authorised by Sixtus IV, but managed by the crown. Ferdinand &amp; Isabella wrote to the Pope requesting permission to establish the Spanish Inquisition and for it to operate in a unique way that differed significantly from the inquisition that developed during the Middle Ages. The latter was remarkably strictly regulated from an early period precisely because the scholastic Churchmen understood the potential for abuse and had no illusions about the temptations of secular power. The use of an institution intended to uncover theological heresy as a tool of state repression emerges in the early modern period with the strengthening of the aparatus of secular authority. In Spain, this coincided with the defeat and expulsion of the Moors and the subsequent efforts to consolidate a Christian national identity, of which the Spanish Jews were victims.</p>
    html_clean: |-
