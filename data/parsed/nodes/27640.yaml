      <p><em>John, as a Catholic I would not be so enthusiasthic about defending the inquisition, I know it was wrong and it can’t be justified saying that things where that way everywhere on those days because it went against the actual spirit of a true christianity.</em></p>
      <p>Did I suggest that the inquisition was justified because 'things were that way everywhere on those days'? That isn't the sort of argument I employ. </p>
      <p>I think there are entirely legitimate moral and theological criticisms to be made of the Roman inquistion and, more specifically, of some of the methods employed by the inquisition. But at the same time I think it is very necessary to talk accurately about what the inquisition was, how it was organised, how it operated, what its aims were, etc. So this is why I think it is important that the distinction between the Roman inquisition and the Spanish inquisition be recognised, because the latter was distinct in several respects with regard to both its organisation, its mandate and its methods.</p>
