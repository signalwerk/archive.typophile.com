      <p>Cities like Baghdad, Damascus, Cairo and Cordoba were the centers of civilization. These cities were flourishing and Muslim scientists made tremendous progress in applied as well as theoretical Science and Technology. In Europe, however, the situation was much different. Europe was in the Dark Ages. It had no infrastructure or central government. To the Muslims, Europe was backward, unorganized, carried no strategic importance and was essentially irrelevant. This considering the time period was in fact true. Nevertheless the Catholic Church (which at the time was the strongest institution in Europe) successfully convinced Christian Europe that the Muslims were infidels. This caused Europeans to think that Muslims were culturally inferior to Europe and thus Europe was unable to benefit from the new scientific discoveries being made in the Islamic lands before the 1100's. By doing this Europe kept itself in the Dark Ages while from China to Spain Islamic Civilization prospered. During the Crusades there was limited contact between Muslims and Christians and not much was transferred. As A. Lewis explains, "The Crusaders were men of action, not men of learning."</p>
      <p>Which appears to be just as true today. Maybe America's "left-wing" scholars (labels, labels) will one day feel comfortable asking the rest of us in the west to look in the mirror and consider the possibility that our own prejudices - and thus, our propensity to *allow* western governments a free hand in wrong-headed foreign adventurism - have caused the kind of "terrorism" (response?) we see today. Instead, individuals who are able to think freely and ask the hard questions are either censured or simply ignored. </p>
      <p>The tragedy of our century (this one and the last) is that the beast rages because it cannot (or will not) see its own face in the mirror.</p>
