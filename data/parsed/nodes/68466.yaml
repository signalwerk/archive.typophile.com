      <p>Nice work, Pedro-</p>
      <p>Lovely work, with the weights as well. I did notice two things from my quick look: light weight tilde seems a bit heavy, and upper case Q has a floating tail, while ç has connected cedilla; while there is no way to confuse the tail of Q to tilde, it would be logic for them both to connect to base glyph. This is just my opinion.</p>
      <p>Overall look of the font is awesome, and I relly liked the fi-ligature.</p>
