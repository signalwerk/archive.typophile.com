  html: |-
    <p>DSType just released Mafra, my debut typeface!<br>
    A type family suited both for editorial and corporate design, available in five weights, ranging from Light to Black with matching italics. Mafra is a contemporary typeface with plenty of style, asymmetrical and very dynamic serifs, and pleasent openness and balance.</p>
    <p>As always I would love to know what you guys think about it!<br>
    Check it out at <a href="http://www.dstype.com" title="www.dstype.com">www.dstype.com</a>.</p>
