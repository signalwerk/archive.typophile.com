    <p>Good day...I'm looking for suggestions for a font like that used in the old US National Park signs...kind of "carved" but legible. Perhaps something with an American Indian look would be an alternative.</p>
    <p>Your expert suggestions are appreciated as always...thanks in advance.</p>
    <p>David</p>
