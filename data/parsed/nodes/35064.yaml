      <p>You mean <a href="http://www.wildnatureimages.com/images%202/050609-056..jpg" target="_blank" rel="nofollow">like this?</a> That sign was probably routed by hand, possibly using a letter template (i.e. there's probably not a digital version, unless somebody made a font based on the sign).</p>
      <p>You might want to check out <a href="http://typography.com/catalog/gothamrounded/index.html" target="_blank" rel="nofollow">Gotham Rounded,</a> although you'd probably have to distress it yourself.</p>
      <p> - Lex</p>
