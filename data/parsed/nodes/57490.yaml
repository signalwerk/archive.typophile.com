  html: |-
    <p>This is my first try in making type. As it seemed easiest, I chose to make a pixelfont on a grid. I haven't drawn numerals yet, but I'm thinking it would be good to have old style figures as well. Being a large pixel font, I think it should be no problem.</p>
    <p>What do you think?</p>
    <p><img src="/sites/default/files/old-images/Borobet_6191.gif"></p>
