  html: |-
    <p>At least in Scandinavian typography, the first line following a drop cap should be closer to the cap than the others, unless the drop cap constitutes a single letter word. Is there a way to do this in InDesign CS3? In the early nineties, in my student newspaper in Bergen, Norway, we used to do this in Quark 3.x by inserting two spaces between the drop cap and the next letter, and then kerning between the spaces. I’ve tried this in InDesign, but I can’t seem to make it work. Anyone?</p>
