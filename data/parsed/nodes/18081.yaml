    <p>Dan Bailey was born in the United States, in a suburb of Minneapolis.  He is the child of semi-nomadic parents, but has found his way back to his hometown.</p>
    <p>Dan currently runs <a href="/wiki/Fontosaurus.com" class="freelinking" rel="nofollow">Fontosaurus.com</a>, and is endeavouring to improve on his font design skills.  He currently sells through <a href="/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a> and is a former member of the <a href="/wiki/Chankarmy" class="freelinking" rel="nofollow">Chankarmy</a>.</p>
