    html: <p>DH Sans is based on <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.108064.0.1&amp;attributes.sampleSize=48&amp;sampleText=NIVEA&amp;sampleSize=48" target="_blank">Metro</a>, which is also close. <br> <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=2&amp;displayfontid=FB.605.0.0&amp;fontRendererText=NIVEA" target="_blank">Font Bureau's Eagle</a> and <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.106290.0.0&amp;attributes.sampleSize=48&amp;sampleText=NIVEA&amp;sampleSize=48" target="_blank">Monotype's Eagle Bold</a>  <br>are even closer, but with a wider 'E'.</p>
