    html: <p>This is Nivea Bold, which is a custom corporate font based on Metro. From what I've read on the web, it may have been done by E&amp;F. Achaz Reuss, an inhouse E&amp;F designer is mentioned as working of the project <a href="http://cgm.cs.mcgill.ca/~luc/micr.html" target="_blank">here</a>, as is another E&amp;F designer, Gisela Will, <a href="http://cgm.cs.mcgill.ca/~luc/atypi01.html" target="_blank">here</a>. It's also mentioned in passing  <a href="http://www.december14.net/site.shtml#start" target="_blank">here</a> and <a href="http://www.metadesign.de/html/en/131.html" target="_blank">here</a> . It's been covered here at typophile a few times before but as best as I can tell those seem to be in the large chunk of messages lost the archives disaster.</p>
    html_clean: <p>This is Nivea Bold, which is a custom corporate font based on Metro. From what I've read on the web, it may have been done by E&amp;F. Achaz Reuss, an inhouse E&amp;F designer is mentioned as working of the project <a href="http://cgm.cs.mcgill.ca/~luc/micr.html" target="_blank" class="link-external">here</a>, as is another E&amp;F designer, Gisela Will, <a href="http://cgm.cs.mcgill.ca/~luc/atypi01.html" target="_blank" class="link-external">here</a>. It's also mentioned in passing  <a href="http://www.december14.net/site.shtml#start" target="_blank" class="link-external">here</a> and <a href="http://www.metadesign.de/html/en/131.html" target="_blank" class="link-external">here</a> . It's been covered here at typophile a few times before but as best as I can tell those seem to be in the large chunk of messages lost the archives disaster.</p>
