    html: |-
      <p>Recently, URW++ has been offering all of their fonts in OpenType PS format in various levels. “Level 1” OpenType fonts from URW++ contain Western &amp; Central European characters, “Level 2” OpenType fonts from URW++ also contain Cyrillic and Greek. </p>
      <p>Bodoni Antiqua and Corporate A fonts are offered with the WGL4 character set (West, CE, Cyrillic, Greek):<br>
      <a href="http://www.urw.de/cgi-bin1/dalcgi/english/wgl4liste0.htd" title="http://www.urw.de/cgi-bin1/dalcgi/english/wgl4liste0.htd">http://www.urw.de/cgi-bin1/dalcgi/english/wgl4liste0.htd</a></p>
      <p>More URW++ Didone fonts with just Western and CE can be found at:<br>
      <a href="http://www.urw.de/cgi-bin1/dalcgi/english/Kliste0.htd?kgruppe1=1&amp;kgruppe2=1&amp;kgruppe3=3" title="http://www.urw.de/cgi-bin1/dalcgi/english/Kliste0.htd?kgruppe1=1&amp;kgruppe2=1&amp;kgruppe3=3">http://www.urw.de/cgi-bin1/dalcgi/english/Kliste0.htd?kgruppe1=1&amp;kgruppe...</a></p>
      <p>ParaType also offers a version of PT Bodoni that includes Western, CE and Cyrillic characters:<br>
      <a href="http://www.paratype.com/pstore/default.asp?search=Bodoni&amp;fcode=PT_BDN" title="http://www.paratype.com/pstore/default.asp?search=Bodoni&amp;fcode=PT_BDN">http://www.paratype.com/pstore/default.asp?search=Bodoni&amp;fcode=PT_BDN</a></p>
      <p>Note that ParaType’s Cyrillic version are design-wise usually much better than URW++’s. </p>
      <p>Adam</p>
