    html: |-
      <p>[<em>Kepler is</em>]<em> Transitional (as lousy a term as that is.)</em></p>
      <p>Well you know what terminology I prefer: Didone = Romantic (e.g. Didot, Bodoni), Transitional = Neo-Classical (e.g. Baskerville, Bulmer).</p>
      <p>Kepler is interesting because it really is transitional, occupying a space somewhere between neo-classical and romantic, but a bit too informal to comfortably occupy either.</p>
