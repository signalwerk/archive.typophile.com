      <p>All of the above is true - *if* you're using an AAT application, such as Apple's Pages or Keynote.</p>
      <p>However, the system version of Hoefler Text is an AAT font, and has no OpenType features, so you can't simply turn on those alternates in OpenType applications such as InDesign, Illustrator, Photoshop and QuarkXPress - you'd have to use the Glyph Palette (in InDesign, Illustrator or QuarkXPress).</p>
      <p>Sorry,</p>
      <p>T</p>
