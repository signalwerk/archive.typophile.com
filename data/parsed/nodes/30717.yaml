  html: <p>Hoefler text that ships with OS X includes great stroked variants—maybe the engraved version was built-in?—but I'm not sure how to use them without pecking around the glyphs palette. Is there some Opentype feature that lets me use these conveniently?</p>
  html_clean: <p>Hoefler text that ships with OS X includes great stroked variants—maybe the engraved version was built-in?—but I'm not sure how to use them without pecking around the glyphs palette. Is there some Opentype feature that lets me use these conveniently?</p>
