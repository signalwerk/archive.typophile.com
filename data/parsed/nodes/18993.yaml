  html: <p>As someone who supports the civilian use and entertainment value of expensive military hardware (<a href="http://membres.lycos.fr/voituresrares/mondial/photos/hautdegamme.htm">H1</a>’s, <a href="http://www.deltaforce.net/ferret/ferret8.html">Ferret Armored Cars</a> and the <a href="http://www.military.cz/usa/air/in_service/aircraft/angels/angels_en.htm">Blue Angels</a>) I’m excited about House Industries release <a href="http://www.houseind.com/">United</a> (I’ve been reposting House’ teasers for the past few months). But I wonder how this will play out amongst your average designer and international audiences?</p>
