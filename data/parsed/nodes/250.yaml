  html: <p>Hello everyone. I happened upon this site a week ago, and I must say I enjoy looking at all the original logotypes and custom lettering. So much so that I felt like dusting off an old project. <br> <br>The loose name for the face is Shard. It is not done yet, and it needs Caps. I thought I'd turn to the online type community for inspiration. <br> <br>Btw, I am without $549 at the moment to buy Fontlab, any other way I can turn this into a font from an EPS file? <br> <br>Thanks much, <br>Andrew Baker <br> <br><img src="http://www.typophile.com/forums/messages/29/11238.jpg" alt=""></p>
