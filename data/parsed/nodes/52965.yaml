    html: |-
      <p><cite>Values are given for each character, which include among other things, the leftmost point and the advance width [..]</cite></p>
      <p>See this snip:</p>
      <p><code>C -1 ; WX 488 ; N checkmark ; B 22 -9 465 454 ;</code></p>
      <p>WX is the total advance width, B is the bounding box, in  lower-left x, lower-left y, upper-right x, upper-right y order. So, advance to position leftx, draw (blit) the character, advance by WX. Properly scaled from 1000 units to the actual em-width in pixels, of course.</p>
      <p>You cannot blit straightforward, because character boxes may overlap; however, that should not be beyond your capabilities :-)</p>
      <p>If you can handle FreeType, this works in precisely the same way. Ask FT to draw a bitmap for a character, and it returns the very same values, together with a tightly cropped bitmap (you also have to position the bitmap vertically). You could ask the FT lib to re-generate the characters in your font to the same size, and store the values of interest. Then use the bitmaps you already have.</p>
      <p>[Add bonus points if you also use the <em>kerning</em> values for micro-adjustments!]</p>
