    html: |-
      <p>Actually, I think Kent is right, and you are probably actually wanting the sidebearings.  That is, in the original font, how much space exists between the outline of each letter and the left and right edges of the space it occupies.</p>
      <p>Ignoring monospaced (typewriter style) fonts for  a moment, this varies depending on the letter, based on underlying design characteristics of  the letter. This info *is* in the original font, but in most formats it is only accessible by actually analyzing the outline structure of every glyph.</p>
      <p>Most applications setting text don't normally have to keep track of this themselves, even when creating bitmaps. They define where they want the text to start. Then they plop down a glyph. OS APIs tell them how much total space each glyph takes (including sidebearings), which is essentially how far to move to allow for the next glyph....</p>
      <p>Regards,</p>
      <p>T</p>
