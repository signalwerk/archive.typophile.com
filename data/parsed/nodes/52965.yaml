      <p>Perhaps I'm missing something, or misunderstanding the question.</p>
      <p>If the font has no kerning, there's nothing to identify. You could do your own kerning somehow. Or perhaps you really mean tracking, not kerning? (Kerning is adjusting spacing between individual letters based on their particular shapes, while tracking is adding or  subtracting a standard amount of space to all the letters.)</p>
      <p>Regards,</p>
      <p>T</p>
