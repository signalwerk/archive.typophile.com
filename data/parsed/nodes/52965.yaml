    <p>Hi everyone,</p>
    <p>For a project that I am working on in PHP/HTML/CSS, I have to string glyphs together as seperate images. So, a word like "how" would be presented as a string of images with one image representing each letter. </p>
    <p>As each glyph image has been saved without padding, the kerning has to be figured out separately. </p>
    <p>My question, therefore, is how do I identify the scalable kerning values of a font so that I can calculate a pixel kerning value based on the font's size. (Fortunately, the font being used doesn't have any kerning pairs, which simplifies things a lot.) </p>
    <p>Meanwhile, does anyone have any idea how to parse a font file in php?</p>
    <p>Thanks for your help.</p>
    <p>p.s. Sorry if I'm posting in the wrong board.</p>
