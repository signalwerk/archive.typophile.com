      <p>No problem. Thanks for clarifying your question.</p>
      <p>What size range do you expect to be doing this with, and with what sorts of typefaces? Can you tell us more about the usage?</p>
      <p>AFAIK there is no standard for tracking based on type size. To the degree to which there is some consensus, I think it is that type on screen benefits from being looser than type in print at the same nominal size, particularly at text sizes.</p>
      <p>Another consideration is that different typefaces may be designed for use at different sizes and for screen or print, and spaced appropriately. So for example Verdana is designed and spaced to be used on screen at typical text sizes, and is spaced appropriately loosely as a result. There are few situations in which I can easily imagine needing to increase tracking for Verdana. But there are many situations in which I could imagine doing the same for Times, Helvetica, or Arial.</p>
      <p>Regards,</p>
      <p>T</p>
