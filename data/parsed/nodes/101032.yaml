    html: |-
      <p>Leaving aside the issue of how something can be both new and improved at the same time, I can verify that this kerning is "new," but "improved" is open to debate. ;^)</p>
      <p>The shapes and spirits of the letters (err, the letter and spirit of the shapes?) lend themselves to some unusual kerning possibilities. For example, the rightmost legs of R and K dip well below the baseline, whimsically inviting letters to perch above them. A touch of whimsy suits the face -- and really, it's no different in theory from tucking letters beneath the eaves of a T.</p>
      <p>Anyway, I'll contact Microsoft to get official word on what I can do. With lawyers, permission is generally easier (and cheaper!) than forgiveness.</p>
