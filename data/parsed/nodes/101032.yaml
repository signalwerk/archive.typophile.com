    html: |-
      <p>As far as I can tell, distributing a kerning file doesn't violate the license, so I'm releasing the AFM file, which FontLab and IIRC FontForge allow you to use directly, even though the font is TT. (Cool, hunh?) The font itself only says it's from Microsoft, whose typography group pointed me to Monotype, who haven't bothered to get back to me. I make no claim to ownership of the font, use at your own risk, yadda yadda, I'm not responsible for anything you may do with this, up to and including imploding the Solar System by using it.</p>
      <p>My understanding is that it's legal to distribute the kerning file, and I'll cease, desist, halt, all that good stuff if this is unethical or illegal.</p>
      <p>That said, if you agree to all of the above terms, here's the link: <a href="http://www.mediafire.com/download.php?ye26f6zix8uxm8u" title="http://www.mediafire.com/download.php?ye26f6zix8uxm8u">http://www.mediafire.com/download.php?ye26f6zix8uxm8u</a></p>
      <p>I chose to expand the kerning to individual kerning to ensure maximal compatibility across platforms; and there are a godawful lot of unlikely pairs, just in case any Martians want to use it.</p>
