    <p>Yes, I know, Papyrus is considered harmful; let's move past that, shall we? I've decided to rehabilitate it by kerning therapy, which is something I needed practice in anyway. I'm quite pleased with the results, although I don't plan on doing it old-school (2054 individual pairs IIRC) ever again.</p>
    <p>I'm sure it isn't legitimate to post the resulting font, but (assuming interest) is it OK to post the AFM?</p>
