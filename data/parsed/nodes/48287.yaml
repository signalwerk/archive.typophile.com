  html: |-
    <p>I would like to announce the release of a light version of my Windows font<br>
    editor - Type 2.2.</p>
    <p>Type light is a fully functional, freeware font editor, with a basic drawing toolbox.<br>
    It can edit, create and convert OpenType TrueType (.ttf) and OpenType PostScript (.otf) fonts.</p>
    <p>Available for download here:  <a class="freelinking external" href="http://www.cr8software.net/typelight.html" rel="nofollow">http://www.cr8software.net/typelight.html</a></p>
    <p>Allan Murray<br>
    CR8 Software Solutions</p>
