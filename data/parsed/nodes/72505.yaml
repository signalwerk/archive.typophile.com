    html: |-
      <p>The sans and serif 'cut' curves are exactly the same, but Expletus Sans shows the bold and semi-bold two, which have less space for the 'cut'. I think the g is fine, but maybe a view at 9pts will change my mind. I'll leave the kerning. I was already beginning to see it was quite useless, but the 'optical kerning' function in Indesign is just not as good as manual kerning. I guess I'll have to live with it. I don't think your idea in the z will work, but I'll try it anyway.</p>
      <p>I'm going on a holliday for 17 days, so I will upoad a pdf with text samples shortly afterwards, since I don't think I will be able to do that today.</p>
      <p>Thanks for your input. It's really helpfull.</p>
