    html: |-
      <p>The reason why I haven't uploaded any 'real-life' samples is because I think the spacing needs quite some more work. With expletus-sans I found it much easier to do the spacing and (partially) kerning. I guess serif typefaces need more kerning pairs?</p>
      <p>I'm not sure about the z either. I'll have to see what that looks like at 8 - 12 pts. The eye of the g is indeed to dark, I'll change that. The a looks fine to me. I'll just soften the inner curve of the bowl a little in a. </p>
      <p>From what I know of Expletus Sans, the 'notches, will probably close off.</p>
      <p>thanks for your input!</p>
