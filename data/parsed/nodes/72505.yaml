  - id: 422042
    user: 32723
    date: 2010-07-25T04:57:00
    date_raw: 25 Jul 2010 — 4:57am
    votes: null
    html: |-
      <p>Expletus is interesting. Your "cut" curves seems to have a better design here than in sans version. Proportions also are very good. I second Frode's observations and also thing g second bowl must be a bit shorter at right.</p>
      <p>Kerning is usually the last step on font development. To do tests while you don't have kerning, set your text in InDesign with optical kerning enabled. This usually produces good results for tests and shows possible issues with spacig.</p>
      <p>Maybe z angles could benefit from the same curve you adopted in v and w bases.</p>
