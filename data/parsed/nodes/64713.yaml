    <p>Hi everyone. </p>
    <p>I'm trying to find the fonts used in the Nuveen ad campaign for the Chicago Cubs. I have been trying to find the sans serif caps font and brush script. I think I have identified the brush script as LaSalle EF but I have had no luck with the other font.</p>
    <p>Any help or suggestions would be much appreciated.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nuveen6_3419.jpg"></div><p></p>
