    html: <p>It seems like one of the biggest hurdles in Unicase fonts is the spacing since you will be making unusual combinations like 'eP' all the time.  Overall it feels too tight. I would look at some small cap spacing &amp; see what they are doing to make that work ( as opposed to regular caps which often look clunky without intervention ).  Also, how do you see this being used? That's important.</p>
