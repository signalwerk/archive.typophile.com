      <p>Stephen,</p>
      <p>Thank you for your comment. I agree that I tend to get stuck on my inital sketches, and I feel I am a in a bit of a rut as far as some of the shapes I have been using recently. Thank you for challenging me in that area.</p>
      <p>I must admit I am having difficulty locating the bulkiness you mentioned, with the exception of a few characters that need work (the Q, n m). I've touched up the Q, K, u z g and s, and I will post those revisions shortly. The letterforms are deliberately extended more than most. Is that what you are referring to?</p>
