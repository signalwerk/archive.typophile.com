    html: |-
      <p>The intended use is logotypes, headlines, etc. It's a display type. I doubt too many people would want to set text in a unicase font, especially one this wide.</p>
      <p>I agree that the spacing will be difficult, but I've started on it.</p>
      <p>I agree with Hrant about the usefulness of a unicase. Really, as far as pure usefulness and unicase isn't very versatile, with my apologies to the Bauhaus crew. Despite the fact that it’s a unicase, I tried out the g, and felt it worked pretty well, so yes, there are a few characters with decenders. Honestly, I understand why quite a few people don’t care for unicase typefaces, but part of the charm of a unicase font is its inherent inconstancies. But why can’t it be successful from a retail point of view? Filosofia is widely used, I would say largely because of its unicase weight.</p>
      <p>I've made a number of updates. The latest is posted here.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/unicase2_6284.gif"></div><p></p>
      <p><a href="http://ftp.insignedesign.com/files/unicase2.pdf" title="http://ftp.insignedesign.com/files/unicase2.pdf">http://ftp.insignedesign.com/files/unicase2.pdf</a></p>
      <p>Jeremy Dooley<br>
      <a href="http://www.insignedesign.com" title="www.insignedesign.com">www.insignedesign.com</a></p>
