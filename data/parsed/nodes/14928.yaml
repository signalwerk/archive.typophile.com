      <p>ITC Avant Garde Gothic, Serif Gothic, Kabel, Ronda, Lubalin Graph... and I used to think these faces were so unique!</p>
      <p>Now you can mix and match them within the same sentence and most readers wouldn’t even notice. This gives new meaning to the old “type should be invisible” saying.</p>
