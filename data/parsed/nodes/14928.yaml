    html: |-
      <p>I also agree about about the ITC styled ligature, but the logo is not one single typeface, but a blending of several with a little custom work. </p>
      <p>IMO, it has the “TH” ligature of ITC Avant Garde Gothic, and “I”<br>
      It uses either the <a href="http://www.myfonts.com/fonts/linotype/kabel/heavy/testdrive.html?s=THING&amp;p=48+" target="new">Kabel</a> or ITC Kabel cap “N” or <a href="http://www.myfonts.com/fonts/bitstream/itc-serif-gothic/bold/testdrive.html?s=THING&amp;p=48" target="new">ITC Serif Gothic</a> cap “N” and squared off the terminals.</p>
      <p>The cap “G” is treated similar to the cap “G” in <a href="http://www.myfonts.com/fonts/dtptypes/kabel-dtcondensed/kabel-dt-condensed/testdrive.html?s=THING&amp;p=48" target="new">Kable DT Condensed</a><br>
      and could have be modified by using the “G” from either Serif Gothic or Kabel.</p>
      <p>But then again, we may be missing a single typeface that has all of the above.</p>
    html_clean: |-
