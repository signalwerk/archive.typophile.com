  - id: 234130
    user: 19133
    date: 2007-10-18T13:23:00
    date_raw: 18 Oct 2007 — 1:23pm
    votes: null
    html: <p>In general, in InDesign, you can set your defaults by choosing them when nothing is selected -- with a document open you're setting the document defaults, or you can choose OpenType features to be on by default in a no-documents-open state which will copy these defaults to all new documents.  However, I would recommend a style-sheet based workflow. There is a related <a class="freelinking external" href="http://typophile.com/node/38181" rel="nofollow">thread about OpenType features</a> going today as well.</p>
