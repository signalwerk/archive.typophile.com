    <p>Considering the fact that Linotype and Berthold waged innumerable legal wars against each other, it is bizarre that Linotype now sells Berthold fonts.</p>
    <p>see <a href="http://www.linotype.com/de/264710/bertholdtypesltd-library.html">http://www.linotype.com/de/264710/bertholdtypesltd-library.html</a></p>
    <p>"Who touches pitch, shall be defiled", they say in the Hebrew Bible, but Linotype alias Monotype prefers the Roman proverb "Money does not smell".</p>
    <p>Chris Lozos asked in another thread: "If you can’t sue them, join them? :-)"</p>
    <p>For addicts of knock-off clones, this bizarre new "mariage d'amour" between Linotype and Berthold has a big thrill: Now, for the first time at the Linotype website, knock-off clone addicts may buy BOTH "the nefarious evil knock-off clone" (Bruno Steinert's famous words concerning Arial) of the Helvetica font, called "AG Book", AND the knock-off clone of Akzidenz-Grotesk, called "Basic Commercial". I suggest that Linotype offers a "combination discount" to addicts of these knock-off clones in order to boost the sales figures.</p>
    <p>There may be another reason, why Harvey Hunt now married his enemy Linotype: Since his law-cognizant wife Melissa decided to quit him, he now has nobody who can prepare new cease-and-desist letters and lawsuits against Linotype for him.</p>
    <p>see also <a href="http://www.sanskritweb.net/forgers/berthold.pdf">www.sanskritweb.net/forgers/berthold.pdf</a></p>
