    <p>We are proud to announce the release of <a href="http://www.myfonts.com/fonts/sudtipos/storefront-pro/" rel="nofollow">Storefront</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilestoresmall_4661.jpg"></div><p></p>
    <p><a href="http://www.myfonts.com/fonts/sudtipos/storefront-pro/" rel="nofollow">Storefront</a> is what the prolific and talented American sign painters of the 1920s and 1930s would have created if they had access to the advanced lettering and type technologies we have today. Rooted in an incomplete Alf Becker alphabet sample, <a href="http://www.myfonts.com/fonts/sudtipos/storefront-pro/" rel="nofollow">Storefront</a> is my usual overdose on alternates and swashes, my eternal attempt at giving typesetting that ever-elusive handmade impression.</p>
    <p>Though the main shapes, especially the majuscules, are almost a standard recitation of the natural evolution of nineteenth century scripts, the additional variants available within the font provide a leap in time to what sign makers and packagers are doing today. I can honestly say that <a href="http://www.myfonts.com/fonts/sudtipos/storefront-pro/" rel="nofollow">Storefront's</a> influences are probably less historic and more in line with my recent travels and frequent supermarket visits. It’s difficult to avoid current visual culture when you're constantly bombarded with it. Not that I try. I certainly welcome the overflow. I'm probably addicted to it by now.</p>
    <p>With a very cool aesthetic, plenty of alternates and swashes, extended Latin language support, <a href="http://www.myfonts.com/fonts/sudtipos/storefront-pro/" rel="nofollow">Storefront</a> is over a thousand glyphs for your branding, packaging, and sign making pleasure.</p>
    <p>Please check the PDF we designed with the collaboration of the brazilian genious Dado Queiroz!<br>
    <a href="http://www.sudtipos.com/downloads/Storefront.pdf" rel="nofollow">www.sudtipos.com/downloads/Storefront.pdf</a></p>
    <p>More fonts visit<br>
    <a href="http://www.sudtipos.com" rel="nofollow">www.sudtipos.com</a></p>
