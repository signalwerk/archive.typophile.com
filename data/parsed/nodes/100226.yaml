  html: |-
    <p>So, I've begun designing a typeface which mimics left handed characteristics. The way I see it I have two options: create a curled hand (crabclaw) or an uncurled hand.</p>
    <p>Some characteristics include a reversed ductus for the "curled" hand. </p>
    <p>If it is uncurled, which is the the way I'm leaning (pun intended) I am also considering a left leaning "roman" to incorporate the left leaning writing that occurs when writing on a horizontal page. Currently I am working towards this left leaning "roman" (is that the right term?) and a more upright italic. Because the strokes are pushed in this situation, I am considering a contrast that thins proportionately from the start of the upstroke.</p>
    <p>SO </p>
    <p>I was wondering if anyone knew of anything attempted like this before? Any special characters that are unique to left handed writing (I've heard whispers of the K), and any general thoughts.</p>
