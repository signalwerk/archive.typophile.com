    html: <p>The rising sun symbol was an empire symbol and its not something that the Japanese should be proud of (Naking anyone). I digress, I met one of the designers of the Japanese Zero when I was 15, his name was Dr.Akira Okya he was born on one of the most northern islands of Japan and the people from this Island tend to be very tall, he was 6'7" or 6'9". One of the requirements of a designer of that period was they had to try out their own inventions. So he was stuffed into the back of a Zero and taken on its maiden voyage. He said it was the scarest ride of his life. </p>
