    html: <p>Daniel, I completly agree with you and Tanya, I just posted the Landor reference because I always find it interesting how companies "explain" their design to the client/general public. I think it happens so often nowadays and the explanations are usually so vague that you could apply them to just about anything. My problem is that they're trying to elevate this design to some other realm, I mean, "...derived from the motif of the rising sun...The mark is drawn in a modern way...," are they serious? Like HD said, it looks like a candy cane.</p>
