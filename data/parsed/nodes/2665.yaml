    html: <p>God, what a load of crap-o-la. I think the 50s logo, while a bit militaristic somehow (and a bit Enterprise-y also, still looks best. Simple and straightforward. The crane is nice, reminds me too much of the basic idea behind the Lufthansa logo, which is better executed. The new logo looks terrible, like a twisted piece of sweets (we have a kind of laquorice here that looks similar).  <br> <br>And gradients aren't only a major technical problem they also look like s***. It's the return of the 80s Corel Draw look, ladies and gentlemen... </p>
