    html: "<p>It turns out that <a href=\"http://www.landor.com\" target=\"_blank\">Landor</a> is behind the redesign (as well as the previous brand they did in 1989).  <br>More about it <a href=\"http://www.landor.com/index.cfm?fuseaction=cPortfolio.getCase&amp;caseid=677\" target=\"_blank\">here.</a> <br> <br>here's an excerpt from the website: <br> <br>\"Landor's Solution <br>The new JAL mark reaches dynamically to the sky. It is derived from the motif of a rising sun, one of the best known icons of Japan. The mark is drawn in a modern way, is reflected in the red sun on the tail of the aircraft, and is set on a creamy parchment colored background reminiscent of handmade Japanese paper.\"</p>"
    html_clean: "<p>It turns out that <a href=\"http://www.landor.com\" target=\"_blank\" class=\"link-external\">Landor</a> is behind the redesign (as well as the previous brand they did in 1989).  <br>More about it <a href=\"http://www.landor.com/index.cfm?fuseaction=cPortfolio.getCase&amp;caseid=677\" target=\"_blank\" class=\"link-external\">here.</a> <br> <br>here's an excerpt from the website: <br> <br>\"Landor's Solution <br>The new JAL mark reaches dynamically to the sky. It is derived from the motif of a rising sun, one of the best known icons of Japan. The mark is drawn in a modern way, is reflected in the red sun on the tail of the aircraft, and is set on a creamy parchment colored background reminiscent of handmade Japanese paper.\"</p>"
