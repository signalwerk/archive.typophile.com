      <p>Just my view but:<br>
      _ isn’t “Helvetica light overly tighly kerned” dated ang generic?</p>
      <p>Maybe a bit more research in fonts would lead to something more surprising.</p>
      <p>On page 6 you use a set of ornaments to separate the sections Publisher / Other titles... I’m just not sure that this oldish stuff expresses anything in relation to the contemporary music (modern minimalism) that Glass creates.</p>
