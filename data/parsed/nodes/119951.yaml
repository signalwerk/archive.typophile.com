      <div class="comment-spam-body"><p>Pedr, Arrus is part way there. But to get these letters  you really have to create them from scratch. Arrus is good in that it gives some idea of how to make some of the terminals. Draw on this and the windswept top terminals from Artcraft and it is possible to create something similar. Fair amount of work.<br>
      I think I saw the move many years ago and enjoyed it. Good stuff without Hollywood mega funding. Look forward to when I can see it.<br>
      Don</p>
      </div>
