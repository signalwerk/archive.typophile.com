    <p>This face is used in the closing credits, with a heavier weight used for most of them, but a lighter weight used here for 'THE END'.</p>
    <p>You can see the whole film on YouTube here: <a href="https://www.youtube.com/watch?v=rXQqzeiTYDo" title="https://www.youtube.com/watch?v=rXQqzeiTYDo">https://www.youtube.com/watch?v=rXQqzeiTYDo</a>, with this still from 1:58:00. If you don't know it, it is a very strange and rather wonderful film in parts and well worth watching.</p>
