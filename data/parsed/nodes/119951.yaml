    html: |-
      <p>This was the era when movie lettering was still hand lettered rather than transferred direct from a font.<br>
      Looks like a version of the widely used Trajan column letters.<br>
      Update<br>
      The _E_ is wider than usual for a classical Trajan.<br>
      I agree that the letters have a Tuscan flavor with the bifurcated ends, but off hand I don't recall a Tuscan that is an exact match.<br>
      In these letters the bifurcated terminals are very restrained compared to the digital fonts that I have seen.<br>
      Don</p>
