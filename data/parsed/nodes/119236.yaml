    html: |-
      <p>So you don't have do all the work I suggested. Just find Essai. In my experience if a font is by Claude it's an original work and not a rip of another digital fontmaker. Claude has been making fonts for many years, and has sometimes used Diogene as a name. Don't expect a long commentary from him. He is rather Laconic, perhaps Diogene is a play on the ancient Greek philosophers.<br>
      Don</p>
