    html: |-
      <p>Not at Dafont, which has some of Claude's fonts.<br>
      Claude posted many of his fonts at alt.binaries.fonts<br>
      They are compiled at <a href="http://abfonts.freehostia.com/" title="http://abfonts.freehostia.com/">http://abfonts.freehostia.com/</a><br>
      Go to the author tab and you will see his name. There are 49 fonts listed under his name. Run through them and you will soon determine if your hypotheses is correct.<br>
      If this does not work you could ask him at the Dafont font ID forum.<br>
      Don</p>
