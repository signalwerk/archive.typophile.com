      <p>Essai (Regular), and it's on multiple free font sites--one listing Claude Pelletier (fonts4free.net) as the creator, another Diogene, which evidently is his pseudonym (fontspace.com).</p>
      <p>Luc Devroye lists Essai among Claude's creations, so....<br>
      <a href="http://luc.devroye.org/fonts-31027.html" title="http://luc.devroye.org/fonts-31027.html">http://luc.devroye.org/fonts-31027.html</a></p>
