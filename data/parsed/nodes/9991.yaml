  html: "<p>Hi there, I have two older fonts I'm trying to identify. The first is a sans serif used on many old industrial safety signs and still used by the Stonehouse Sign Company in Denver, Colorado. Picture example: <a href=\"https://web.archive.org/web/20111229210919/http://www.stonehousesigns.com/apps/catalog/images/bde17.jpg\" target=\"_blank\">http://www.stonehousesigns.com/apps/catalog/images/bde17.jpg</a> <br> <br>The second font is a serif font I've often seen in Western posters. Years ago, I found a version of it called \"Mooshy\", though I doubt it is the original name. Every side of the letter is slightly concave, including the serifs. Picture example: <a href=\"https://web.archive.org/web/20111229210919/http://www.hemingray.info/laughlines/images/laughlines3.jpg\" target=\"_blank\">http://www.hemingray.info/laughlines/images/laughlines3.jpg</a> \"Laugh Lines\" (sorry for the poor images) <br> <br>I'm interested in learning the names of both these fonts and purchasing them for personal use, if possible. Thanks!</p>"
  html_clean: "<p>Hi there, I have two older fonts I'm trying to identify. The first is a sans serif used on many old industrial safety signs and still used by the Stonehouse Sign Company in Denver, Colorado. Picture example: <a href=\"https://web.archive.org/web/20111229210919/http://www.stonehousesigns.com/apps/catalog/images/bde17.jpg\" target=\"_blank\" class=\"link-external\">http://www.stonehousesigns.com/apps/catalog/images/bde17.jpg</a> <br> <br>The second font is a serif font I've often seen in Western posters. Years ago, I found a version of it called \"Mooshy\", though I doubt it is the original name. Every side of the letter is slightly concave, including the serifs. Picture example: <a href=\"https://web.archive.org/web/20111229210919/http://www.hemingray.info/laughlines/images/laughlines3.jpg\" target=\"_blank\" class=\"link-external\">http://www.hemingray.info/laughlines/images/laughlines3.jpg</a> \"Laugh Lines\" (sorry for the poor images) <br> <br>I'm interested in learning the names of both these fonts and purchasing them for personal use, if possible. Thanks!</p>"
