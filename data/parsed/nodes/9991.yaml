    html: "<p>Awesome, thank you! Okay, I shot the following email over to Stonehouse Signs: <br> <br>To Whom It May Concern: <br> <br>Hello, I have an odd question for your company, but I hope you can help me. For many years I've noticed that your safety signs (for example, the \"Danger\" and \"Caution\" signs) use a fairly unique typeface. I was interested in learning more about this typeface. Did it originate from your company? Does it have a name? Is it commercially available, or is it unique to your company? <br> <br>Thank you advance for your time. I own several of your older signs and have always be interested in your company's products. <br> <br>Sincerely, <br>Christian Willis <br> <br>...we'll see if they respond. They'll probably think I'm crazy, heh.</p>"
    html_clean: "<p>Awesome, thank you! Okay, I shot the following email over to Stonehouse Signs: <br> <br>To Whom It May Concern: <br> <br>Hello, I have an odd question for your company, but I hope you can help me. For many years I've noticed that your safety signs (for example, the \"Danger\" and \"Caution\" signs) use a fairly unique typeface. I was interested in learning more about this typeface. Did it originate from your company? Does it have a name? Is it commercially available, or is it unique to your company? <br> <br>Thank you advance for your time. I own several of your older signs and have always be interested in your company's products. <br> <br>Sincerely, <br>Christian Willis <br> <br>...we'll see if they respond. They'll probably think I'm crazy, heh.</p>"
  - id: 148955
    user: 1203
    date: null
    date_raw: null
    votes: null
    html: "<p>Wow, I actually got a reply from them! In case any of you are interested in the \"Danger Font\" used on Stonehouse Signs,  here is the reply I received: <br> <br>Christian, <br> <br>Thanks for your interest in Stonehouse Signs. Your astute powers of observation have allowed you to verbalize what many people only sense subconsciously -- the unique look of a Stonehouse safety sign. <br> <br>The typeface you refer to was originally created by J.W. Stonehouse, the son of the founder. JW developed an artistic eye for layout and lettering as an itinerant sign painter in the late 1800s. We have named the typeface \"JW Stonehouse\" after its creator. The true original version is still in use today by Stonehouse Signs. It is not commercially available. <br> <br>Over the years, others have used similar type styles. Some even copied JW's characteristic \"foot\" on the letter \"R\". The only truly accurate version of the JW Stonehouse typeface is the version used by Stonehouse Signs, Inc. <br> <br>The JW Stonehouse typeface began to surface around 1928, as evidenced in our Catalog #3. Many of the new signs added to this publication used \"JW Stonehouse.\" Prior to this, draftsmen at Stonehouse Signs used a typeface with \"clipped corners\" instead of arcs on the rounded letters. Catalog #1, printed in 1919, shows either the \"clipped corner\" typeface or the printer's standard typeface, with no evidence of \"JW Stonehouse.\" Interestingly, the \"clipped corner\" typeface uses the \"foot\" on the letter \"R,\" which was carried forward and incorporated into the JW Stonehouse typeface. <br> <br>In the 1940s, Stonehouse Signs standardized JW's typeface and began using it exclusively. In 1972, Stonehouse Signs became the first sign manufacturing company to use a computer-aided design system with a knife-cutting plotter. The system was built and programmed from scratch by Stonehouse. The new system used the JW Stonehouse font, painstakingly recreated in computerized form. This first generation computer font even used the original kerning tables. <br> <br>Again, thanks for your interest in our Company. Everyone who works here is proud of our rich history. It's great to know about others like you who share our interest. <br> <br>To find out more about J.W. Stonehouse, visit <a href=\"https://web.archive.org/web/20111229210919/http://www.jwstonehouse.com/\" target=\"_blank\">http://www.jwstonehouse.com</a> <br> <br>Sincerely, <br> <br>Stonehouse Signs, Inc. <br>Jeff Stone, VP-Operations <br> <br> <br>--- COOL!! -Christian</p>"
    html_clean: "<p>Wow, I actually got a reply from them! In case any of you are interested in the \"Danger Font\" used on Stonehouse Signs,  here is the reply I received: <br> <br>Christian, <br> <br>Thanks for your interest in Stonehouse Signs. Your astute powers of observation have allowed you to verbalize what many people only sense subconsciously -- the unique look of a Stonehouse safety sign. <br> <br>The typeface you refer to was originally created by J.W. Stonehouse, the son of the founder. JW developed an artistic eye for layout and lettering as an itinerant sign painter in the late 1800s. We have named the typeface \"JW Stonehouse\" after its creator. The true original version is still in use today by Stonehouse Signs. It is not commercially available. <br> <br>Over the years, others have used similar type styles. Some even copied JW's characteristic \"foot\" on the letter \"R\". The only truly accurate version of the JW Stonehouse typeface is the version used by Stonehouse Signs, Inc. <br> <br>The JW Stonehouse typeface began to surface around 1928, as evidenced in our Catalog #3. Many of the new signs added to this publication used \"JW Stonehouse.\" Prior to this, draftsmen at Stonehouse Signs used a typeface with \"clipped corners\" instead of arcs on the rounded letters. Catalog #1, printed in 1919, shows either the \"clipped corner\" typeface or the printer's standard typeface, with no evidence of \"JW Stonehouse.\" Interestingly, the \"clipped corner\" typeface uses the \"foot\" on the letter \"R,\" which was carried forward and incorporated into the JW Stonehouse typeface. <br> <br>In the 1940s, Stonehouse Signs standardized JW's typeface and began using it exclusively. In 1972, Stonehouse Signs became the first sign manufacturing company to use a computer-aided design system with a knife-cutting plotter. The system was built and programmed from scratch by Stonehouse. The new system used the JW Stonehouse font, painstakingly recreated in computerized form. This first generation computer font even used the original kerning tables. <br> <br>Again, thanks for your interest in our Company. Everyone who works here is proud of our rich history. It's great to know about others like you who share our interest. <br> <br>To find out more about J.W. Stonehouse, visit <a href=\"https://web.archive.org/web/20111229210919/http://www.jwstonehouse.com/\" target=\"_blank\" class=\"link-external\">http://www.jwstonehouse.com</a> <br> <br>Sincerely, <br> <br>Stonehouse Signs, Inc. <br>Jeff Stone, VP-Operations <br> <br> <br>--- COOL!! -Christian</p>"
