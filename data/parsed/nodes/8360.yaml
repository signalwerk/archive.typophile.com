  html: <p>I'm new to this forum and could use some help finding discussions on font management softwares for OS X. I found one Typophile discussion via Google, and then looked for more using the Search on this site, but got no results (the IE windows logo/world kept spinning). My design group of 5 people currently uses Font Agent Pro 2.1 (designing in the Adobe CS suite) but am wondering if anything else is better. (Suitcase X1? Master Juggler? Others?) Thanks for any personal experience or advice you can provide.  <br>Mary</p>
