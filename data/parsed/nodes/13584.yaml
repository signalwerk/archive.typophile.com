    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Alphabetties</strong></p>
    <p>An unorganized group of highly organized women whom all share a love of type and typography. </p>
    <p><a href="/wiki/Tiffany%20Wardle" class="freelinking" rel="nofollow">Tiffany Wardle</a> originally coined the phrase <a href="/wiki/Alphabetty" class="freelinking" rel="nofollow">Alphabetty</a> in a private e-mail to a friend, May 5, 2003, and has since used it as a sort of nickname. </p>
    <p>Current members are as follows:</p>
    <p><a href="/wiki/Jill%20Bell" class="freelinking" rel="nofollow">Jill Bell</a><br>
    Kristin Dooley<br>
    <a href="/wiki/Zara%20Evens" class="freelinking" rel="nofollow">Zara Evens</a><br>
    Calliope Gazetas<br>
    Shelley Gruendler<br>
    Jemma Gura<br>
    Karen Huang<br>
    Nicole Larue<br>
    <a href="/wiki/Tamye%20Riggs" class="freelinking" rel="nofollow">Tamye Riggs</a><br>
    <a href="/wiki/Sara%20Soskolne" class="freelinking" rel="nofollow">Sara Soskolne</a><br>
    <a href="/wiki/Ilene%20Strizver" class="freelinking" rel="nofollow">Ilene Strizver</a><br>
    Tiffany Wardle<br>
    <a href="/wiki/Dyana%20Weissman" class="freelinking" rel="nofollow">Dyana Weissman</a></p>
