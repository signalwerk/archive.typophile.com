    html: |-
      <p>On a Mac the easiest way to tell is by selecting the font and checking for information (File/Get Info or cmd+i).</p>
      <li> OpenType fonts with Postscript outlines will show up as, "Postscript® OpenType® font". </li>
      <li> OpenType fonts with TrueType outlines, Windows TrueType, TrueType Collections and some Apple TrueType fonts come up as, "TrueType Font". </li>
      <li> Apple TrueType ".dfont" fonts come up as, "Data fork resource Font". </li>
      <p>If you have an OpenType font with Postscript outlines and the file extension ".otf" and change that extension to ".ttf" the description will change to "TrueType Font" even though nothing else about the font has changed and it still retains Postscript outlines.</p>
