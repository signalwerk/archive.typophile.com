    html: |-
      <p>AFAIK</p>
      <p>OTF uses Postscript Type 1 outlines, which use cubic beziers, while TTF uses TrueType outlines, which are quadratic beziers.</p>
      <p>The latter is 'simpler' but requires more points to generate some of the same shapes. I think there are also some shapes that can't directly convert from Cubic to Quadratic. Because it requires more points, the filesize can be bigger (though in some cases, it can end up with less points if it's something that is more effectively written as quadratic beziers.)</p>
      <p>EDIT: To add, I'm not sure if it's the case for all, but sometimes I found difficulty with certain Mac ttf files and using them in Windows; I think they might have been an Apple true-type font file while the Windows ones I found transport to Mac fine. The .otf files have worked on both without problem, so I prefer those where possible, especially as I don't have to deal with two different files for, like with the old Postscript format.</p>
      <p>If you scroll down to the circle approximation on the Wikipedia article, it should show visually the difference:</p>
      <p><a href="http://en.wikipedia.org/wiki/B%C3%A9zier_spline" title="http://en.wikipedia.org/wiki/B%C3%A9zier_spline">http://en.wikipedia.org/wiki/B%C3%A9zier_spline</a></p>
  - id: 514706
    user_id: 29994
    user_name: Theunis de Jong
    user_path: null
