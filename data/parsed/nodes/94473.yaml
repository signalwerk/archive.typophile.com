      <p>The file extension doesn't determine what type of font it is. You can give a Type 1-flavored OpenType font a TTF extension and it will still work as usual.</p>
      <p>(I'm intentionally disregarding the weird Windows issue, where <em>some</em> OTF fonts under <em>some</em> circumstances get an OTF, and others a TTF icon, totally unrelated to its actual contents.)</p>
