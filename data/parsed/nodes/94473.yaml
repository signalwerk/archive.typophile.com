    votes: null
    html: |-
      <blockquote><p>OTF uses Postscript Type 1 outlines ..</p></blockquote>
      <p>No, OpenType allows either TrueType or Type 1 outlines.</p>
      <p>I suspect the font foundry just wanted to make sure to cover all bases -- there is still a good deal of legacy software around that cannot work with OpenType fonts. (I know of one pretty major graphing package that just refuses work with 'em.)</p>
      <blockquote><p>.. difficulty with certain Mac ttf files and using them in Windows; I think they might have been an Apple true-type font file while the Windows ones I found transport to Mac fine ...</p></blockquote>
      <p>There used to be confusion because Apple used their own brand of TrueType, <em>also</em> called "TTF", and indeed 'twas the Tiny differences that made it incompatible with Windows.</p>
      <p>Since you have a choice: throw away the TTF and use the OTF.</p>
