      <p>I thought the OTF extension was to wrap Postscript T1 in, while TTF wrapped Truetype outlines in?</p>
      <p>Both of which are Opentype formats though TTF doesn't have to be.</p>
      <p><a href="http://www.myfonts.com/info/opentype-flavors-ps-tt/" title="http://www.myfonts.com/info/opentype-flavors-ps-tt/">http://www.myfonts.com/info/opentype-flavors-ps-tt/</a></p>
