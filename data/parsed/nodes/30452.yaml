      <p>Later in the early 1990s, after Apple and Microsoft had invented the TrueType format, Adobe revealed the internal format and the encryption scheme of PostScript fonts.</p>
      <p>In mid-1990, a really open "Open Type" font format was developed with full documentation and without encryption and with the big advantage that such "Open Type" fonts could be installed on various operating systems (Windows, Mac OS, etc). At that time in mid-1990, the following was proudly and jointly declared by Adobe and Microsoft:</p>
      <p>"OpenType fonts and the operating system services which support OpenType fonts provide users with a simple way to install and use fonts"<br>
      (see <a href="http://www.microsoft.com/OpenType/OTSpec/otover.htm" title="http://www.microsoft.com/OpenType/OTSpec/otover.htm" class="link-external">http://www.microsoft.com/OpenType/OTSpec/otover.htm</a>)</p>
      <p>Now look at these crippled Letterhead "Open Type" fonts. Do they "provide users with a simple way to install and use fonts", as defined above by Adobe and Microsoft? Definitely not! These crippled Letterhead fonts are technically "Closed Type" fonts, because the internal format is kept secret, the fonts are hidden and presumably encrypted, and you need a proprietary "installer" without which you cannot use these "Closed Type" Letterhead fonts.</p>
      <p>Therefore any psychiatrist will confirm that those graphic designers who suffer from the delusion that they buy "Open Type" Letterhead fonts, while in fact they buy crippled proprietary "Closed Type" fonts rendered useless by various technical restrictions, must be regarded as mentally deranged.</p>
