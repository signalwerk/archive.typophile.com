      <p>Interesting to read this thread years later. The idea of 3rd party software instead of standard font files is only mildly annoying. I'd work like a dog to get at the font file (if it existed) but only as a technical challenge.</p>
      <p>I guess the irritation level depends on your usage of PDFs. I convert all fonts to outlines anyway when sending a PDF, but that's for signs, logos, that sort of thing. It avoids issues with the font not having embed permissions or with an identically named (but worse) local font replacing the intended font. But I can see where outlines are unacceptible for a technical document or book.</p>
      <p>It may be my imagination but, just for the hell of it I tried looking for letterhead fonts in shady places online, torrents and whatnot... and they may be a little harder to find than others. You can get stuff like gotham or champion script, but good luck finding unlovable or packard script.</p>
      <p>But I have no doubt that if someone cared a lot about it, any protection system will be cracked. If anyone doubts the resourceful nature of the guys who do this, spend a minute reading <a href="http://insecure.org/news/cryptanalysis_of_contents_scrambling_system.htm" title="http://insecure.org/news/cryptanalysis_of_contents_scrambling_system.htm">http://insecure.org/news/cryptanalysis_of_contents_scrambling_system.htm</a></p>
      <p>...now about those rude phone calls and emails...</p>
