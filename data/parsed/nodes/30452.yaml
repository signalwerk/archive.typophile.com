    html: <p>Yesterday I had a young friend come over to my house and bring her laptop in order to design a logo for my new business.  I wanted to use Letterhead Fonts so I purchased a couple of fonts, paid through Paypal and then was informed by the LHF website that I had to wait 30 minutes for someone to call me to confirm my order since it was my first purchase.  I waited 45 minutes and never got a call.  Apparently I missed the call sometimes affter that, LHF cancelled my order, refunded my payment and never answered their phone when I tried to call.  The next day I emailed at 8 am and again at noon.  I finally received a rude email from Carolyn Smith (customer service)asking why I didn't answer my phone the day before but offered no solution to my purchase attempt.  I was locked out of my account after two attempts at reordering and have decided now that it just isn't worth dealing with them.  Carolyn must be married to "Chuck" because I can't think of any other reason someone would pay such a rude employee.</p>
