      <p>The font data will still need to appear somewhere in the computer memory in its raw format (otherwise the font will not be usable by the software like Illustrator). Once it is raw, it will be grabbed and saved into a de-DRM'd file.</p>
      <p>This is a really old issue that has been explored in depth with shareware programs. DRM does not work (as in it is easy to break) <em>unless</em> it is rooted in the hardware (e.g. specialized chip) and the user is denied arbitrary access to this part of his computer. The problem here of course is how to convince a user to buy a computer that he does not have a full control over.</p>
