      <p>My, my, my...what an interesting, yet difficult to follow thread. We is quite the opinionated bunch, ain't we? I have a few points I wanted to address.</p>
      <p>1. EULA, SCHMULA...we read 'em when we have to. But no busy person or firm is going to sit down and read every one of them if they make many font purchases from many different foundries.</p>
      <p>2. There's a lot to be learned from Heron's Quark story, as it seems Adobe has learned from Quark's "piracy paranoia" and makes their software (and EULA) less restrictive. Witness Quark's ever shrinking market share.</p>
      <p>Sii (and everyone as a whole), something I think a lot of people who work for large companies don't realize, is how faceless companies can be perceived by consumers. This does not go just for the big 'uns— the small ones too. We visit a webpage, we make a purchase. Who are we talking to exactly when we're buying fonts? There's no follow-up call with purchases, just an icon that appears on our desktop and e-mailed invoice. Not very personal, no evidence of a human being involved in the process. Phoning the company is plausible to us because many of us here on Typophile actually know someone (or are that someone) who works in the type industry. </p>
      <p>As the sole "graphic designer" for the company I work for, I have to play the role of both the Font Congress and the Font Police. Purchasing fonts is a cold business transaction. The type industry as a whole has a serious PR problem to creative types in general and very few people in the industry seem to be willing to address this.</p>
      <p>To Chuck directly:</p>
      <p>3. Piggybacking my last statement— Malbright's more positive points are right on the money I think. I would pick up the 12 Immutable Laws of Branding if you haven't read it already. You'll learn a lot from that book. Your brand is important, put a face with it.</p>
      <p>4. A spin on this discussion— fine tune the installation software and then patent it. If you get it right, I'd bet many, many type companies would pay you for a standardized application and you could end up revolutionizing the type industry as a whole by finding a way around the font piracy issue. You could recoup losses from there. (But that's aiming high.) </p>
      <p>You're in the software business, so start selling that sh!t! Good luck to you! :)</p>
