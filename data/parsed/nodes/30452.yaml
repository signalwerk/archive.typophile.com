      <p>Even though this thread is a bit old, I'd like to report in on it.  Like many who've posted here, I have a HUGE problem with the Letterheadfonts.com "installer"—after a few months, my fonts no longer showed up, and I had to reinstall several times.  Their system's not all it's cracked up to be, let's just say.  I will no longer buy from LHF even though I love their fonts.  With the installer, they're basically telling the customer that they do not trust them.  If I'm purchasing a product, I don't expect the guy I'm giving money to to look over my shoulder when I use it.  It lacks professionalism.</p>
      <p>However, the other day I went back to the site (the other day = mid July) and got into my account and was able to download the .otf files for my two purchased fonts separately, though up 'til now had only been available with their awful installer app.  I don't know if I found a glitch in the system or if LHF has sensed the error in their judgment and is creeping back into "regular" font downloads.  Anyway, I was pleased.  If they go back to font files instead of installer apps, I'm sure to spend money there, but if LHF continues to disrespect their customer by disallowing me to use what I've purchased, i.e. it's *mine*, in my font management software or simply to organize my font libraries, then I'll have none of it, and I wrote them a few emails telling them so.  </p>
      <p>I just can't see the point in the installer.  They say they'll lose money if they don't, but there are several sites that *TRUST* their customers and are doing a fine business.  You know what I do now instead of buying LHF fonts?  Go to other foundries and buy theirs.  Wow, that installer really works, huh?  It makes the fonts AND customers disappear.  Show some respect, LHF.</p>
