    html: |-
      <p>malbright, I checked the LHF site a couple weeks ago after patternmaker's post to see what was up, and again a few days ago. With LHF's revamped shopping cart system instituted at the beginning of 2007 you can redownload fonts you have previously purchased. So I did that with the locked font I bought earlier, and when I download it now, patternmaker is right, it's a regular .otf font file, not the black box installer thing. However, there is also this notice above the button for downloading your fonts:</p>
      <p>"IMPORTANT! Each of your fonts has been encrypted with your unique account information. Please do not share them with friends or colleagues. Instead, encourage them to purchase their own copies so that we may continue making new fonts for you. Thank you."</p>
      <p>PDF embedding is still not allowed, however. Although you can now open the font in FontLab and turn the embedding restriction off if you wish, that wouldn't seem smart. Aside from the ethics of that or lack thereof, by doing so and embedding fonts in PDFs that can in any way be traced back to the font licensee (with or without encrypted account info), that's inviting getting caught violating the license.</p>
      <p>As an .otf file the fonts can now be managed with font managers of course. But if your workflow or permanent document needs depend on PDF embedding (to support searchable PDF archives, etc.), you may not regard the situation as much better than before.</p>
      <p>I do wonder about the encrypted account information put into the fonts, and how that's done. I'm not an expert and not of course recommending this, but couldn't fonts simply be opened with FontLab and regenerated anew to lose the encryption? I would assume that type of encryption has to be added after a font is generated and isn't something supported by FontLab/Fontographer. If so, it would seem to be useless for catching any but small-time pirates who didn't know better. Otherwise, assuming the encrypted account info doesn't breed potential software glitches of its own in use of the font, this might be a livable system for combating font piracy.</p>
      <p>It is interesting that there has been no public notice of the change on the LHF site. It's reminiscent of the original institution of the protection scheme several months ago when the limitations of the installer were not spelled out fully (at least not IMO). Or maybe LHF is just attempting to quietly test the waters to see how users and sales respond to the new change without biasing it with a public announcement. Also, if this is not just a temporary glitch in LHF's system, maybe Chuck is gunshy now and just doesn't want to say anything hoping the brouhaha will quietly go away and be forgotten with time.</p>
      <p>Again, if not a glitch, it is encouraging in that it would seem to be an effort on LHF's part to meet font users halfway. It would have been a difficult emotional decision on Chuck's part, given he said earlier here more than 2 years work was invested in the installer scheme. Or maybe it wouldn't be so difficult if sales were negatively impacted and left little choice but to drop the scheme or close up shop.</p>
      <p>I believe Chuck previously gave that as one of his options here, if his effort to combat piracy didn't prove out. If he ended up closing things down has actually been one of my biggest concerns with the whole thing. If you buy installer-only fonts and LHF later decides to close up shop, then once the Windows or Mac OS's have changed enough over time that incompatibilities arise, the fonts become unusable.</p>
      <p>Curious what others think about the new change...</p>
