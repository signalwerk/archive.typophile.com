      <p>"The issue of piracy has always been discussed thoroughly, the conclusions have always been drawn that those that steal fonts were never going to purchase them."</p>
      <p>This is only 1/3 ? of the conclusion, with all due respect:</p>
      <p>The issue of piracy has been discussed thoroughly, the conclusions drawn are several. There are those who steal fonts, never to use or distribute them. We tend to leave these alone as they are either hard to detect or in the design business... Secondly, there are those who steal fonts and are going to license them as soon as they find out it's better to, and we have a net to catch them. Then, there are those who steal fonts and are going to require pursuit...(not that I miss the later, but did I miss anyone, anyone?).</p>
      <p>The point I was trying to make to the letterheads at Letterhead, was that you don't find the legit clients amongst the thieves unless you have a net out to catch both the malicious and innocent cases of theft.  Besides, there being nothing less useful to a steady hand than anger, except possibly lifting heavy objects, the whole issue is best left to others ASAP. Greg Thompson once called me from a CA Highway in 1990(!) where he'd just passed an immense highway sign using Bodega Sans for the film "Father of the Bride," "Did they license that?", he screamed above the incessant traffic...lol, I did — now too. A few years later he was wondering how much our licensing % had improved, and I said, "I don't know, why not put serifs on Bodega, and we'll see."</p>
      <p>Nick asks: "David, how do you know whether someone using one of your fonts is a licensed user?"<br>
      I personally don't know who is and isn't a licensed user, and it never "bothers" me. I occasionally participate in the net mentioned above, i.e. when I see our's used by a fortune 2500 company, I ask  further up our licensing chain. It was previously mentioned that good customers become uneasy when they see free use "across the street" — our discretion and well-known fondness for genuine admiration-driven theft, encourages both the aggrieved and grief-makers to call us, making another part of the net. Having urls in fonts, is yet another part.</p>
