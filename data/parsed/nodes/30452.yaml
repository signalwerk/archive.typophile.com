      <p>Not sure if it's appropriate to go after the bigger issue in this thread, but I was talking about it with someone the other day and we got onto the topic of libraries. Everyone takes them for granted these days, but if the concept didn't exist already, would someone be able to get a public library system going? </p>
      <p>Look at the reactions to google's book search. People were screaming bloody murder and saying that google was profiting off of authors' hard work. Personally, I use google book search to search for books, and then if a book looks suitable, I'll order it from amazon. Similarly from a library. There's something nice about owning a book, just as there is with owning anything, including fonts, legitimately. I don't think, however, that nowadays most content producers would see it that way, and I really doubt public libraries would ever have been allowed in this day and age. </p>
      <p>Ultimately, I think that people are applying IP law in a rather one-sided manner. It is there to protect the content producers, but also the consumers. The wave of DRM schemes that have been popping up recently is a knee-jerk reaction from people scared of development. It is too simplistic to compare file sharing with physical theft. It's been said a thousand times before, but computer copying is not a zero-sum game. My taking a file from someone else does not hinder their use of it. It also does not necessarily equate to lost sales, as I might never have bought the file in the first place, or never have even been exposed to it, and through the so-called piracy, might have even decided to buy it. I have certainly borrowed CDs from friends, and in some cases decided to buy a copy myself because I liked it enough. </p>
      <p>The digital world brings many benefits with it, but the paradigms are ultimately different. Gone are the days when a customer needed to walk into your shop(pe) and engage in conversation with you to get your product. It means less infrastructure is needed to be successful, but also inherently means significantly less control over where your product goes. Unless people start trusting EULAs or the government imposes "trusted computing" on the world, I see no way to gain any more control over distribution of anything digital. DRM schemes are as flawed as EULAs, really. Instead of asking you not to do bad things with the font, they ask your computer not to let you; you (assuming no trusted computing) have full control over your computer, and with some technical expertise, it is rather trivial to overcome most schemes. </p>
      <p>Anyway, that's just my 0.02 on the topic. I must say I've never used any Letterhead fonts, but judging from the website, they do look rather attractive. I hope that over time Chuck will realize that his good customers will remain good customers if he listens to them, and removes the DRM. As it stands, he's sticking it to the pirate but his legitimate customers are becoming "collateral damage." He really needs to evaluate if 1 pirated copy equates to 1 lost sale. </p>
      <p>Well, I'm usually just a lurker so I'll go back to lurking. Apologies if this post is rather straggly and (I hope not!) off-topic... I've been up for way too long.</p>
