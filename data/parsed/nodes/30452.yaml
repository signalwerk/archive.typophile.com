    html: <p>Just checked with the IT department of my biggest client, a worldwide TV broadcaster, and unfortunately LHF fonts cannot be allowed on their network as the protection scheme installation is considered an application, and they do not allow new applications on their worldwide network without many, many months of testing, etc.. So much for my big purchase/site license of LHF fonts. Meanwhile, I have done a survey of 11 designer friends who all work closely with type. I had them visit the LHF site and also read these threads. Every one of them was adament that the protection scheme was a definite deal breaker. It wasn't even close. I can't see how this is going to work for Chuck. I'd rather see LHF charge A LOT more for their fonts to try and make the business more profitable. Unfortunately, I believe this protection scheme will kill the business sooner or later. What a pity! Please Chuck, come up with something else!</p>
