      <p>"For those that say that protection is a slap in the face to the consumer or even hint that we are less friendly to our customers now— You obviously have never purchased anything from us or called us."</p>
      <p>It is a slap in the face. I love Apple. I think they are a great company. But DRM on their songs is a slap in the face. Period.</p>
      <p>Piracy...the damaging kind...the ones where people are selling your goods...these aren't stupid people. They know how to get around DRM. There's a monetary reward for doing so.</p>
