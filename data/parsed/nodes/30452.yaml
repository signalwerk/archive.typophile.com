      <p>"I don’t see how a small company could muster the forces to pursue legal action—"<br>
      If a small company's business IS intellectual property represented in digital form, then I'm of the opinion that they must do something. I mean, all such companies are based on the laws that have been enacted to make such property possible. So, it's only a question when, if you are going to directly license and thus police, you beat a quick path to three stages; send licensing agreement, send cease and desist, file suit. And nevertheless, as this 3-staged legal path making must be done with or without an installer/hider, no?</p>
