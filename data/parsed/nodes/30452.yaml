      <p>You can go on and on all you like about whether a pirated font equals a lost sale or not. That argument is circular, and it is hard to see the point of it, if there is any point to it at all. The answer is immaterial as we are talking about hypothetical sales.</p>
      <p>Stephen Coles: <em>Letterhead has responded to this criticism, but I don’t think the post really answers the key question: how do price increases reduce piracy?</em></p>
      <p>Where does this idea come from? The idea that LHF's price increases are supposed to reduce piracy of their fonts?</p>
      <p>I've read most of this thread, and I have read what Chuck has written in response. <strong>The purpose of the price increases, as far as I can discern, is to compensate LHF for the lost production time incurred in cleaning up the mess pirates make in stealing LHF font products</strong>. I also presume the price increases are not intended to reduce piracy of LHF fonts. </p>
      <p>I referred to "cleaning up the mess" in my first post on this thread. The point is, every time LHF's fonts are pirated, some of the type producer's time must be spent removing the pirated material from circulation. Fonts are labour-intensive things to make. The "lost revenue" compensated for by the LHF retail font price increases is, I presume, the revenue not earned due to their reduced capacity to make fonts caused by having to take illicit material out of circulation.</p>
      <p>There is a basic problem with this discussion thread. It started on the topic of the anti-piracy lockdown scheme, then the topic of LHF font price increases cropped up, and somewhere along the way some commentators who should know better have confused the notion of "anti-piracy" with the price increases.</p>
      <p>j a m e s</p>
