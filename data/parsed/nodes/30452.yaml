      <p><cite>...does product activation depend on an installation’s files remaining stationery on the drive where things were originally installed?</cite></p>
      <p>AFAIK, Adobe's activation scheme is tied to the hardware, and as long as you don't swap out the relevant hardware components you can move the software all over the place on a Mac. I've never tried moving software around under Windows (or any non-Mac *NIX OS) because complex Windows apps prefer staying put after being installed. Adobe's protection does, however, refuse to work if you screw around with the license management daemons, which are kept separate from the rest of the Adobe software. I once moved the management daemon library out of a directory when diagnosing a problem, and after moving it back I was unable to run <em>any</em> Adobe apps, even after reinstalling the entire suite. It's been a while, but IIRC I had to reinstall the OS to fix the problem.</p>
