      <p>"and in this case, theft"</p>
      <p>But is it really theft? Is copyright infringment theft? Is photocopying an article for a friend the same as shoplifing? Is grabbing a song to put in my kids home video the same as selling pirated DVDs on the streets of NYC?</p>
      <p>It's important to remember what US IP laws were originally designed for. Too many people think it was designed solely to provide a monetary incentive for the creator to innovate. That's only half of it. The reason our country created IP laws was to provide that delicate balance between encouraging innovataion, and giving the masses access to the benefits of cultural and collective knowlege.</p>
      <p>Many people allege (and I agree) that industries like the MPAA and RIAA have pretty much taken IP law to an extreme favoring mainly only the creator. These proposed laws do nothing more than to push that lopsideness even further.</p>
      <p>I find something very wrong when an entire industry is convicted of price fixing (music industry) and their fine is essentially $15. An international corporation is shown to have installed virii on people's computers (Sony). Their 'fine'? Give a free CD to their customers. The richest company on the planet (MS) has been shown to have acted  unfairly as a monopoly in countries throughout the world. Their 'fine'? Well, nothing worthy of actually penalizing them.</p>
      <p>In turn, a 12 year old girl in Kansas who shares a Britteny Spears single? Legally, her family can be extorted out of 6 grand.</p>
      <p>To me, the laws are already insanely anti-consumer.</p>
      <p>"I agree that the current implementation of DRM is not perfect."</p>
      <p>There likely won't ever be a DRM that truly works.</p>
      <p>"However, if designers/companies can’t create products without someone stealing them, they stop creating"</p>
      <p>Did libraries stop authors from writing? Did VCRs stop TV networks from airing shows? Has Adobe gone out of business due to script kiddies cracking photoshop so they could make a myspace icon? </p>
      <p>That phrase has yet to be proven correct. It's also been used every single time a new technology has dared enter the market that has some facet of being able to duplicate something. From 8-tracks to photocopiers. ;o)</p>
      <p>"Legislation can help clear up this semi-nebulous area of the law."</p>
      <p>What's nebulous? Our copyright laws are fairly straight forward (well, as straight forward as laws can be).</p>
      <p>The DMCA was not needed. THAT has only complicated things...mainly for the worse if you are a consumer. </p>
      <p>To be fair, independant font foundries are caught in the crossfire of the truly evil industries that have really tainted DRM and the like. There is zero sympathy left for the RIAA, for instance.</p>
      <p>That said, the argument the RIAA is using isn't too far away from what some of the people in this thread are using. THe reality is that music sharing really hasn't killed the industry. It'shurt it in some ways, helped it in others. Mainly, it's just CHANGED the indusstry and the industry really doesn't like that, as they had a pretty good racket going. Instead of ADOPTING to market forces, however, they prefer to use lobbyists and lawyers. Alas, crazy DRM on a typeface gets lumped more into that crowd than not.</p>
