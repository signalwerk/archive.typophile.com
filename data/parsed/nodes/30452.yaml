    html: |-
      <p>Regarding the question about packaging an InDesign job with one of the new LHF fonts: No, InDesign's font packaging didn't work for me, nor does imbedding them in PDFs. LHF's suggested solution for PDFs is to convert the fonts to outlines first. Of course, without Adobe Reader's "Smooth line art" preference checkbox turned on, fonts turned to outlines in PDFs look quite cruddy except at very large point sizes. I don't know what the default setting is these days, but I remember a few years ago that was not set by default, and clients usually do not know or bother to change it. If this is still the case, previewing jobs for clients via PDF would be a problem.</p>
      <p>About the comment whether LHF is "up-front about the unconventional nature of their product": I would say partially but not completely. They do say in their FAQ about the new OpenType fonts, and I quote:</p>
      <p>"Q. My Letterhead Fonts aren't in the regular font folder!<br>
       A. Letterhead Fonts work a bit differently than normal fonts in that they aren't installed in the Fonts folder. But you will see them in your applications."</p>
      <p>"Q. The fonts are not displaying in FontBook or Suitcase.<br>
      A. While you may see your Letterhead Fonts in font management programs such as FontBook or Suitcase, you won't be able to turn them on or off. And of course you won't be able to install Letterhead Fonts using your font management program since they must be installed using the Letterhead Fonts Installer. This has no effect on how the fonts function in your design applications however."</p>
      <p>The FAQ does mention the fonts won't embed in PDFs and to convert to outlines first. However, despite the mention that fonts are not installed in the regular Fonts folder(s), it wasn't clear, at least to me, that you don't get a font file you can deal with at least *somewhere* on your hard drive as you wish, that activating any LHF font means all of them get activated, and that you can't turn a font off without completely uninstalling it. I mean, after years of dealing with fonts and being able to do all these things, your assumption is most likely going to be that you still will in *some* fashion, unless explicitly told you can't.</p>
      <p>They also do not mention you can't package a job in InDesign for a service bureau, though someone knowledgeable could probably assume that from the statement fonts aren't embeddable in PDFs. And while they say converting fonts to outlines for PDFs "may add a bit to the file size, the end result is visually the same as if you had embedded the fonts," this will be true if Adobe Reader's preference for "Smooth line art" is set, but otherwise not. (Which it may or may not be by default. Someone else will have to weigh in on that.) All in all, less than full disclosure in my view.</p>
      <p>Also, I went to LHF's online forums to see if others were commenting or complaining and found their forums are now gone. I don't know how long that's been the case or if it's a permanent thing or not. It does make one wonder whether the disappearance was intentional so they wouldn't have deal with public criticism on their site. Then again, perhaps they are busy now dealing with the new system in place and just wanted space.</p>
