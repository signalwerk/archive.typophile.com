      <p>Regardless of the pros and cons and all the debate in-between, the bottom line for many of us is that we can no longer use one of our favorite foundries, and that's a real shame.</p>
      <p>Here's what I think would be a better approach than unworkable, proprietary protection schemes. Put a face on the company. Let people know the man they're buying from. Let customers know that every purchase makes a BIG difference. Have new customers sign and fax a pledge that they will not make unauthorized copies. Let people know that you are counting on them, trusting them to help you keep the business going. Let them see the face of the person they'd be stealing from. Personalize the experience. It won't stop piracy. Nothing will. But it'll discourage. </p>
      <p>Maybe too Chuck should have a policy whereby if you want an "unlocked" font, instead of $29 you pay, say, $99 or more ... a premium price. </p>
      <p>To show you the futility of Chuck's technology, let me share this true story. A few months ago I was at The Magic Castle in Hollywood and I noticed a lovely flyer typeset in LHF's Boston Truckstyle. I complimented the designer, and he said, "Yeah, we had no budget for type, so I just traced the letters from the site." (Abbreviated the story, but that's the gist of it.) Mind you, we're talking a $29 font here, if memory serves. So one way or the other, people who dont want to pay, won't. </p>
      <p>Chuck's technology will seriously injure or kill his business, you wait and see. It is absolutely non-customer centric. Maybe Chuck doesn't care. Maybe Chuck somehow believes this will actually stop thieves from stealing. Maybe Chuck hates piracy so much that he's willing to take a big hit in sales. Maybe Chuck is so pissed-off that he is no longer willing to work with those of us who are his biggest supporters and fans. If so, I wouldn't blame him at all.</p>
      <p>Bummer for me, though. I've designed a 600-page book and was planning to use many of Chuck's fonts throughout.</p>
      <p>Well, there's still his terrific client galleries to enjoy. And when the day comes that Chuck finally realizes what a bad idea this was, I'll be the first in line to pony up my cash. Hopefully it'll be before this damn book needs to get produced.</p>
