      <p>It's true that this scheme is awkward for the legitimate user. What I think will have to eventually happen, though, is that the operating system include some sort of standard way to lock a font to a machine.</p>
      <p>The font installer would basically talk to the OS when installing the font, and the OS would put an encrypted form of the font on the machine that wouldn't work if copied to another machine, being encrypted by a random unique key set up when the OS was installed.</p>
      <p>That would obviate the need for techniques as extravagant as this one. Regular executables could be handled in this way by an OS as well, and this would encourage developers to develop for the OS, as they wouldn't have to develop their own security schemes.</p>
      <p>Incidentally, increasing prices to recoup losses due to piracy isn't the same thing as increasing prices to discourage piracy. Presumably piracy causes some lost sales, and so the unit price on the remaining sales has to be increased to keep revenues constant. Of course, though, a lower price should mean more legitimate sales, and a higher price likely will mean less sales - even if the result is purchases of other fonts, not more piracy.</p>
