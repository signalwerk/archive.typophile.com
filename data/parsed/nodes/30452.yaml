      <p>A bit (more) support for letterhead:</p>
      <p>Recently, I had a unique opportunity; to start my own business, selling my products on the internet. There is no other time on earth people have had the opportunity to create new products as the internet age. Companies can be formed without much of startup costs and risks involved with starting a new company and distributing products in the old era. Unfortunately, stealing their products is also much easier. Recently, I found a website that specifically asks to steal my typefaces. </p>
      <p>I recently received a book from my sister, “The World is Flat.” It confirms what I have believed for some time. America’s role in the world is to create new and innovative products. Our main exports are weapons and entertainment, essentially products born from creative problem solving. We don’t do cars all that well, but we make some ripping airplanes.</p>
      <p>Senator Feinstein, being from the state that is host to Hollywood and all, is supporting a bill called S.256, the PERFORM Act. It is a step in right direction for protecting digital music. Will it work? Probably not. There are too many ways to bypass DRM systems. It sends a message. Althrough digital property is easy to steal, it is still not right.</p>
      <p>Some “evildoers” have created a site to urge senators to reject this bill. I have a different idea in mind. Using their website mechanisms, you can draft a letter urging your senators to confirm this bill.</p>
      <p>Here is a brief little letter I have composed. If you would like, please use it as a base for your own letter.</p>
      <p>As a constituent and creator of digital content, I urge you to CONFIRM the perform act. Those that oppose this bill are essentially asking Congress to put<br>
      a stamp of approval on their illegal activities. America needs its creatives and<br>
      entrepreneurs now more than ever. Rejecting this bill would cripple the creation<br>
      of digital content of all kinds and cause innovation to be stifled.</p>
      <p>I find it shameful that some persons have created a website to convince Congress not to confirm this bill. Please send a strong message that stealing for content creators of all kinds is illegal and immoral. </p>
      <p>I would love to see DRM incorporated into typefaces by Microsoft/Adobe/Apple. I plan to push for this as much as I can.</p>
      <p>Lets see if the system works. Oh, and Cat, why are you splitting hairs over the .otf stuff? I deliver my product as a .zip file, just as everyone else. Am I in violation? No.</p>
      <p>Jeremy Dooley<br>
      <a href="http://www.insignedesign.com" title="www.insignedesign.com">www.insignedesign.com</a></p>
