      <p><cite>@ aluminium</cite></p>
      <p>I think I got the point of this thread.</p>
      <p><cite>@ Sebastiaan</cite></p>
      <p>Yes, I listened to Type Radio -- not only to Mr Smeijers' answer.&nbsp;&nbsp;;-)</p>
      <p><cite>@ heron2001</cite></p>
      <p>No sympathy for current DRM solutions. Partly because they are badly implemented and cause us troubles. Partly because the underlying conception is of yesteryear -- the more serious issue. An example: Adobe's DRM links apps to the computer's harddrive. But today it does not make sense any more to tie user-identity to the heavy machine on or below the desk, since you can already put your OSX or other Unix on a CD, DVD, external harddrive and possibly (this is really exciting) even flash drive and work from any computer you have access to. (I don't like carrying a laptop around, as light as it may be.) Within this scenario, why not let the user decide which hard disk or flash drive best serves to identify 'me' as the paying licensee of the OS, app, fonts, documents? (Today, if I want to use my CS license on many computers, I have to de-activate and re-activate each time, which requires web-connection of each of these computers which is not necessarily given. Just plugging in a flash drive would be so much easier.)</p>
      <p>I don't defend DRM in this case <cite>because</cite> others use DRM too. My logic is exactly the other way round:<br>
      This thread is now 100+ posts, most of them more or less repeating the initial one. However, it is 'just fonts' which are the least expensive part of designers' tools, compared to: computer, printer, scanner, software, photo equipment, &amp;c. The real problem is that we <cite>can</cite>, and thus most likely do, copy cheap non-DRM-ed apps and fonts, but not computers; and we <cite>can</cite> argue with one-man-foundries, but not with the larger corporations -- at best we end up with a student reading standard answers from a problem-solution database. My concern is that this 'awareness campaign' addresses the wrong one.</p>
      <p><cite>@ malbright</cite></p>
      <p>Apples to oranges -- true, though in a different way: You'll always find a foundry that offers similar fonts. But currently there are no real alternatives to Adobe/Macromedia's applications (which, I should add, I <cite>like</cite>).</p>
