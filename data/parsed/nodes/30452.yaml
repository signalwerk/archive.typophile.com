      <p>"I am still giving my customers PDFs - and if there is a correction — I make it with a smile."</p>
      <p>There are two primary uses for PDFs...prepress production, and the storage of useful content.</p>
      <p>For prepess, yea, who cares if it's text or outlines, as it ends up on paper anywyas.</p>
      <p>But for storing actual information, it's useless if you convert everything to outlines.</p>
      <p>An example is that perhaps a corporation retains all of its sales literature in PDF format and a sales person needs to do a quick search to find a particular brochure. If all the content is outlined, it's impossible for their internal search engine to index any of it. And, as such, makes for a rather useless repository of information.</p>
      <p>Just pointing it out as I think it's something a lot of people fail to consider when producing PDF files.</p>
