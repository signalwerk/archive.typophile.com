      <p>Consumers want a simple transaction: Here's my money, give me my product.</p>
      <p>EULAs are only used to restrict the default assumptions of that transaction. They're bad, bad, bad. IMHO, of course. ;o)</p>
      <p>"I am a consumer that reads the EULA, but cares less about it than consumer protection legislation."</p>
