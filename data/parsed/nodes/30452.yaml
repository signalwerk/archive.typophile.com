      <p>I would sure as hell mind it. I buy software for my own use, not to do whatever makes the software vendor happy. I don't like having every different application vendor installing license daemons that eat up memory and slow down my boot times. I don't like software taking extra time to startup because it's checking for updates that don't offer anything especially useful and are just covering for secretly revoking keys that got leaked onto the internet. I don't like having to keep track of serial numbers or copy-protected CDs or dongles or whatever else it takes to keep my software running. And I really, really get ticked when I can't use a program if I'm not connected to the internet.</p>
