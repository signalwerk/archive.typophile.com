      <p>If I need specific rights I ask for those specific rights. The vendor can give me a price or say, sorry not at any price. Sorry, but maybe it's a cultural thing, but I don't consider this haggling or sordid in any way, it's just business, and as other commentators have said, it's not as if you can't go and find fonts elsewhere. </p>
      <p>A simple example is that most vendors make P&amp;P embedding fonts, and I only license 'editable' embedding fonts. The fact that I ask for those rights, and am willing to pay for the extra value that functionality gives my customers does not mean that the vendors are wrong to set their fonts to P&amp;P embedding.</p>
