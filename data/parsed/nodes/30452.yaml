    html: |-
      <p>Jim Baen, of Baen Books, was worried about piracy etc when he decided to get into the e-book market. His friend Eric Flint, an author and editor, convinced Jim to try something crazy...</p>
      <p>Give away free copies of e-books, in several different formats, without any DRM or copy ptotection, and with the only restriction on the downloader being they could not sell copies. The EULA on the free Baen e-books practically demands you give copies to people.</p>
      <p>At the Baen Free Library site, the books for free are chosen by the authors. Permission for books by dead authors is given by their estates or whomever holds the copyright.</p>
      <p>Flint was right in what he told Jim. Don't give a crap about "piracy". Treat the customers like customers instead of thieves. Don't try to exert micromanagement control over what the customer can and cannot do with the product.</p>
      <p>People actually PAY for many e-books Baen gives away for free. Why? Because it supports authors they like, which gets more new stories from those authors. Paying for free e-books also supports Baen, the distributor of the goodies.</p>
      <p>But Baen took it a step further. They've released CD-ROMs with several of their hardcover printings containing the e-book version and many other e-books by that author and many others. Printed on all those CD-ROMs is the simple EULA that encourages making copies of the CD's to give to others. The contents of all those CD-ROMs are downloadable from many websites and are all over the P2P networks.</p>
      <p>Baen's e-book and dead tree sales keep increasing because they're being nice to their customers instead of glaring through slitted eyes at all those ungrateful potential thieves.</p>
      <p>Jim Baen (RIP) figured giving the books away would have his company bankrupt and out of business in short order, because he *had* the typical corporate "They're all thieves!" attitude and agonized over every "lost sale". I suspect he felt much better after dropping the 'tude and realized that people who aren't going to pay to get something just flat out aren't going to pay.</p>
      <p>I've read this whole thread and see there's still many who still continue to FAIL to realize the difference between a digital, intangible computer file and a real, physical object. It is not possible to steal a digital file, unless there is only one unique copy and the physical object (such as a CD-RW) containing it is itself stolen or a copy of the file is made and the unique original is deleted.</p>
      <p>As long as the copyright owner retains a copy, making more is as simple as commanding a computer to copy it. Once several copies are "in the wild", should the copyright owner somehow lose all his or her or its copies, the owner just needs to obtain one of those other copies.</p>
      <p>For physical objects, it is a totally different reality. Take any one of a kind piece of art. If an art thief makes off with that one of a kind piece, it's *gone*, stolen. The only way to get it back is to track it down physically.</p>
      <p>If you wanted to really steal a song today here's what you'd have to do. First, obtain every single CD, record, tape and every other piece of media it's ever been released on, including any sheet music copies and lyrics and guitar tabs on the web, and disc stamping plates. Second, delete every digital copy that's ever been made of the song. Third, kill the singer(s) and musician(s) who performed it, or at least somehow make them unable to re-record the song. Fourth, break into Stone Mountain and steal the master recordings, which often include all the individual track recordings that're mixed together.</p>
      <p>Finally, you and you alone have all copies of the song and any means of reproducing it. NOW you have well and truly stolen a song. Sony must come crawling to you to obtain a copy so they can feed it to the CD mastering machine to make new plates to stamp new discs. Once they have that single copy, all your effort to steal the song becomes pointless.</p>
      <p>Sound ridiculous, impossible? Of course it is. The digital world can ensure that nothing can ever be lost, as long as at least one copy is out there, somewhere.</p>
      <p>Concentrate on selling to the honest people. Treat them like you believe they will act honestly and honorably and golly gee, most of them will. The ones who want free copies will almost always be able to find free copies. Most of them will never pay, thus they aren't "lost sales". If you have a reputation for fair dealing, some of those non-payers will at some point decide to pay you for your product.</p>
      <p>Don't agonize over the "thieves". They're going to act how they do no matter what you do or think.</p>
      <p>Something I remember from a John C. Dvorak article in PC Magazine, went something like "I don't care if the first copy of your software cost you $50,000 to develop. The second copy cost you $2 to make. Convince my why I need to buy your software instead of a competitor's or looking for something free on the web."</p>
      <p>Not many customers give a crap about the work that was expended writing a program or creating a digital image or designing a font. What matters is what they can do with the digital product, what it means to them, what they see as the intrinsic values of the product itself. They know that once completed, the 'production cost' of digital products is essentially zero. Bang, bang, bang. Millions of copies as easy as one. (Just look at SPAM e-mails.) Arrangements of electrons whizzing around in silicon, patterns of magnetism on spinning platters or coded spirals of pits in metalized plastic. Duplication is cheap. Truly stealing digital product is impossible, pop off another copy for another paying customer the instant he clicks Checkout.</p>
      <p>You have to make it worth it for the customer to appreciate your product and want to eagerly give you money for it. Set a price on your fonts. Tell people buy it, or not. Don't glare at the customers with the ole' stink eye. If you still lie awake worrying about people getting copies without paying, put some sort of serial numbers in the fonts, keep a record of which customer is assigned which numbers. Give the customers copies of the serial numbers.</p>
      <p>Make it known (NICELY) that the numbers are useful for your customers' own inventory/auditing/tracking etc. They can help your customers control their own use of the fonts. Printers have to have the fonts in some form, typically embedded in PDFs the way the majority of printing is these days. Throwing rocks in the path of current work and production flows is counter productive.</p>
      <p>Perhaps giving printers, who only do printing, not designing and layout, a reduced price on the fonts, or heck, just give them free copies, would help. Then you, the font designer, could use that as a selling point to designers. "Brown's printing in your city has ALL of my fonts so you can use any of my fonts and send PDFs to Brown's and you'll never ever have an issue with the printer missing fonts." Preemptive marketing tactics via carpet-bombing one of the biggest issues in digital design, the printer doesn't have Font X and the font cannot be embedded, but if all the major printers already have the fonts...</p>
      <p>Then if you are still paranoid about all that potential theft going on, you can spend (or waste) time lurking around the darker corners of the web and P2P looking for copies of your fonts, downloading them and checking the serial numbers, then making polite calls or e-mails to those customers to inform them that font such and so has escaped their control, would they be so kind as to find out how it might have happened.</p>
      <p>That might get many customers to exercise the due diligence to prevent your fonts from getting away from them.</p>
