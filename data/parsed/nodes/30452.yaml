      <p>I agree with Heron here. I mean, take a listen to Type Radio — one question often posed is “Do you have a lot of illegal fonts?”. Take for example Fred Smeijers' response to this. I can't quote him exactly, but it came down to that he did, but simply to see if it's useful, and if he can find a use for a font, he buys it with the money you have then (e.g. the money from the assignment), thus actually boosing font sales with piracy. Now, of course, “piracy” is a bit of a sharp word, but I know countless people who have downloaded, say, a font called ‘Eurostibble’, an imaginary one-weight, unkerned font that is actually a weight of Eurostile from some “Free Fonts!!!” site. Is that piracy? How about downloading Helvetica from Kazaa and then buying it when you need it for some commercial assignment? I find it difficult to draw a line. </p>
      <p>And, as has been said before, just give some oppurtunistic coder some time with such an installer, and I am willing to bet that he will be able to extract the fonts. Remember that a lot of people who 'pirate' fonts actually don't care if it's not kerned, or lacks punctuation, or is in any way broken. If it slightly resembles a font, they are happy with it. And they wouldn't have bought it in the first place. So it could very well be just like DRM on music; the consumer expiriences trouble using a legitly acquired product (a CD that you can't play on a computer, for example), but the 'cracker' can simply put the line-out of his CD player into his computer's line-in to record the music anyway and then share it. So who are you really prohibiting use? If the intent is there, you can bet that one way or another, the goal will be attained.</p>
