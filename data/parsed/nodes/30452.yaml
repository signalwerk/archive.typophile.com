      <p>As a user I don't mind the idea of serialization or activation of fonts. If a foundry wishes to know that I've de-installed a font and am re-installing it again--for whatever reason--that is there perogative. As is what Chuck has done for that matter. However, the thing that really frustrates me is not being able to control the font. That seems a little heavy-handed. I have a very precise--read anal-retentive--way of organization and working with my fonts. If I can't do that it would drive me batty which would, in turn, make me want to not use the font. It kind of reminds me of someone forcing me to  live my life in a certain way when I'd much rather make my own choices and arrive at my own destination. Sort of.</p>
      <p>DRM doesn't bother me. I suppose. If they choose to do it they will, more than likely lose a few sales or perhaps gain more conversation with the customers who wish to upgrade their licenses in order to do what is they need to do. </p>
      <p>I'd hope before DRM comes into play some of the foundries will really consider some of the more problematic clauses in their EULAs and give the user a little more rope. Specifically embedding into PDFs. The PDF workflow is how we do business now. Without it the fonts either become useless or we, the users, must choose which parts of the EULAs we ignore.</p>
