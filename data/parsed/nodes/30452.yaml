      <p><em>But for now, that option doesn’t exist. Personally, that would not prevent me from using original fonts. I too am a designer and I don’t use any font management program. I would rather spend the time designing than turning fonts on and off. If I don’t want a font, I don’t install it in the first place. Apparently several people must agree with me that having Letterhead Fonts with some limitations is better than no Letterhead Fonts, because sales are up. And people are still creating things with our fonts. But even if sales were cut in half as a result of this protection— I would still do it, because of the peace of mind it provides us. And that peace of mind translates into new fonts for you.</em></p>
      <p>However when you're a corporation buying hundreds of thousands of dollars worth of fonts, you need to have the ability to turn on these fonts for particular projects and books while working on others at the same time. We work on files that have grade specific fonts and have to QC files daily switching between grade levels. We need the flexibility of the font management software to allow us to do that. If the font is embedded into the computer's sytem, it causes font issues with files in Adobe and Microsoft products that conflict with that font.</p>
      <p>Sad to say that we will not be able to purchase your fonts for our book publishers if that flexibility is not in place. We have enough issues with font conflicts in applications already. Allowing a font foundry to just install fonts willy-nilly into the system is dangerous and not a risk any large book publisher with thousands of users will take.</p>
      <p>~Saritza</p>
