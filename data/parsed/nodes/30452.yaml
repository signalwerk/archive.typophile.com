      <p>I commend Mr. Davis for his transparency, addressing the issue head-on with a message direct to his customers. This is how a company should make any major change, with open disclosure. </p>
      <p>Perhaps those customers who are inconvenienced will cut Letterhead some slack. Unfortunately, I find many of the arguments for his new font installer software tenuous, and often grasping at straws.</p>
      <p><em>"I don't think it's fair to you, the honest designer, who pays for his fonts to be competing against Joe Blow down the street who gets all his fonts from Russian websites. Because Joe never pays for his fonts, he can afford to cut your prices and steal away your clients."</em></p>
      <p>Graphic design clients are gained and kept for many reasons, chiefly due to reputation, quality of work, and the relationship between designer and client. Desirable clients don't jump from one designer to the next to save a few hundred dollars.</p>
      <p><em>If the fonts can be protected against theft, more font designers will be willing to spend the time necessary to create quality work for you.</em></p>
      <p>The font makers I know (and I know many, including those who are vehemently anti-piracy) do it because they love to draw type. Of course they should be paid for their work, but it's highly unlikely that any will suddenly spend more time creating type because they know there is a protection scheme.</p>
      <p><em>The dirty little secret is that in order to make up for lost revenue associated with theft, font foundries pass the cost on to you.</em></p>
      <p>If proponents of font software protection schemes want to make a convincing argument, they really must stop referring to font piracy as "lost revenue". The vast majority of pirates will not buy software, period.</p>
      <p>Finally, I ditto Tiffany on the embedding.</p>
      <p>Hackers will find a way to cheat the installers, and in the end, the new system will only penalize and inconvenience Letterhead's legitimate customers. I think it's the wrong way to go and I hope other foundries don't follow. I doubt they will.</p>
