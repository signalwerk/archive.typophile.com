      <p>It is a thoughtful, well-written piece that probably represents, generally, how many type designers, foundries and vendors feel. </p>
      <p>However, I think a few statements are gross generalizations and he forgets to mention something.</p>
      <p>Chuck has gorgeous era specific typeface designs for display typography. He should be able to protect his work, all type designers should. </p>
      <p>1. "More fonts and better quality for you" -- I think this isn't fair to the amount of type designers that are out there who are spending time on their fonts. </p>
      <p>2. "Lower prices" -- I think this is only fair if he were to compare his pricing to other foundries that specialize in display type design. Even then his fonts aren't that much less expensive. The more expensive type families are those which are more complicated, offer more glyphs, and offer more weights. You cannot compare apples to oranges.</p>
      <p>3. "No embedding in PDF files or other file formats" -- It is important to understand that his fonts aren't used, or at least in my opinon shouldn't be used, in large blocks of text and so it is easier to turn those few words to outlines. I would never recommend turning a brochure to all outlines. That is ludicrous. The PDF is a boon to the design industry and shouldn't be discounted for what it has done for the designer. With "print and preview only" embedding it has enabled those of us who do strive to follow licensing the ablity to NOT send our fonts to the printers and service bureaux.</p>
