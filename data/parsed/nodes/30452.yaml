      <p><em>These fonts have to be *somewhere*… and if they are, they are extractable.</em></p>
      <p>Not necessarily. My guess is that the LHF app loads the font set into memory (RAM), in much the same way that "opening" an OT font file by clicking loads an individual font on-disk into memory.</p>
      <p>For as long as the fonts are loaded into RAM they show up in DTP apps and can be used. When the LHF app is closed down the fonts would be unloaded from RAM and no longer available in DTP apps.</p>
      <p><em>OR there is some encrypting added, which would make the process of extracting the font files somewhat harder.</em></p>
      <p>In a way, probably, the LHF fonts are "encrypted" as code compiled as part of the LHF app's .EXE file (or whatever file(s) comprise the app). Extracting them would be implausible unless the user happens to have decompiler software capable of decompiling the LHF app files into constituant components.</p>
      <p>Extracting the fonts from RAM while they're loaded is even more implausible.</p>
      <p><em>What do the rest of you think about where LHF has gone with this?</em></p>
      <p>They appear to have taken serious measures to prevent further piracy of their products, since illegitemate users are very keen on stealing LHF fonts. In that sense it's a measure of how desirable their fonts are, and a rebuttal to the immoral, cynical, interminably immature mindset of those who insist on stealing them.</p>
      <p>LHF's hand has been tipped.</p>
      <p>The user-end compromises entailed by the solution they've adopted seem impractical to me too, but the people who baulk at it should ask Chuck Davis or Richard Kegler what it's like and how it feels having to clean up the mess every time their fonts are ripped off and posted on the web for free. It's constant, ongoing, and a pain in the arse.</p>
      <p>And all because their fonts are popular. The "reward" for making excellent artistically-crafted fonts is a heartache</p>
      <p>Put yourselves in Chuck's shoes and see it from his point of view.</p>
      <p>This also illustrates the basic fallacy inherent in the digital "media revolution". The bright new future of digital audio, video and graphic arts is open to wholesale abuse.</p>
      <p>j a m e s</p>
