      <p>I had looked inside the application package cursorily earlier but not too closely, and didn't see anything that easily stood out indicating a font anywhere. Also had done a drive-wide search for any file containing the five core characters of the main font name without finding anything. This morning I dug a little deeper and first performed a drive-wide global search for invisible items. When that didn't turn anything up, I went back and did a "show package contents" on the LHF application package again to look closer.</p>
      <p>Not counting the usual tiny little incidental files, there's just three files of any size there. In the "MacOS" folder of the package there's a file named "FontInstaller" at 316 KB in size. Then inside the "Resources" folder of the package there are two more, one named "FontInstallation.icns" at 56 KB and "FontInstaller.icns" also at 56 KB. Making copies of either file, then changing the file extension to .otf and opening with FontLab just to see what might happen gives nothing other than a blank new font.</p>
      <p>P.S. (edit) Sii, I didn't know the font was going to be protected like this when I bought it. It was not clear to me from LHF's FAQ, and I feel like I was taken for a bit of a ride here. Glad it was just one font I purchased so I'm not out much money.</p>
