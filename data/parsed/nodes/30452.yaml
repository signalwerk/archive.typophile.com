    html: |-
      <p><cite>I wonder why there’s no fuss when I loan a book to a friend. The author doesn’t get the royalty, but you never hear authors or publishers trying to stand in the way of passing books around. In fact you can buy used books at Amazon. Why is it so different with fonts and music?</cite></p>
      <p>Here in the USA, first sale doctrine was established in law ages ago and this keeps book and music publishers from getting royalties on resale. This is not the case in some countries—in Japan, for example, resale of video games is illegal (although it still happens). With software the publishers have the option of requiring acceptance of a license before use, so they can effectively block resale of the product. I expect that we'll see the details of all this set in precedent soon, because video game companies are taking big hits from restailers who purchase new games in limited quantities and then rely on used game sales to boost margins. At some point there's going to be a game company that decides this is violating a EULA, and the lawsuits will start flying.</p>
