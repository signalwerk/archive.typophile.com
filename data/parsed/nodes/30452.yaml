      <p><cite>4.2  No Modifications. <strong>Except as permitted in Section 14.7, you may not modify, adapt or translate the Software</strong>. You may not reverse engineer, decompile, disassemble or otherwise attempt to discover the source code of the Software except to the extent you may be expressly permitted under applicable law to decompile only in order to achieve interoperability with the<br>
      Software.</cite></p>
      <p><cite><br>
      14.7.4 You may <strong>convert</strong> and install the font software into another format for use in other environments, subject to the following conditions: A computer on which the converted font software is used or installed will be considered as one of your Permitted Number of Computers. Use of the font software you have converted will be pursuant to all the terms and conditions of this agreement. Such converted font software may be used only for your own customary internal business or personal use and may not be distributed or transferred for any purpose, except in accordance with Section 4.4 of this agreement.<br>
      </cite></p>
      <p>Nothing in the EULA allows what most people would consider modification. The FAQ starts off clearly enough...</p>
      <p>"You are allowed to use font manipulation software to modify the font software to produce “derivatives” of fonts licensed from Adobe, as long as you use the derivatives in accordance with the same licensing terms that accompany the original fonts."</p>
      <p>But "in accordance with the same licensing terms" means format conversion only. But then the FAQ talks about "customization" too. Which does not appear to be allowed by the EULA. </p>
      <p>Please let me know if I'm missing something. This came up in 2005 - <a href="/node/16180/" title="http://typophile.com/node/16180" class="link-kept">http://typophile.com/node/16180</a> - so Adobe is aware of the apparent contradictions.</p>
