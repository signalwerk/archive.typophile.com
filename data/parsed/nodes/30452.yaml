      <p>I've been a fan of LHF for a while now, and have been making purchases from them here and there on projects. Nothing big, mind you, so I'm sure my opinions as a customer don't really matter to Chuck.</p>
      <p>However, I will not buy fonts with DRM. Period. It screws up my workflow (what if I use a font for running heads in text? I can't convert those to paths before creating a PDF X/1a). My day job is art directing a magazine, and we can't have a font that needs to be converted to paths at every instance, because our entire workflow is PDF, and keeping editability is very important.</p>
      <p>This type of draconian DRM only serves to encourage piracy. Someone, somewhere will want to crack it. Then, the cracked fonts get distributed, and the very thing you were trying to prevent becomes true.</p>
      <p>If Hoefler gave up their bizarre hidden font install scheme, and if Emigre stopped chasing every 15 year old who downloaded a copy of Exocet, and even Apple is pushing for non-DRM music in the iTunes music store, what possible reason does LHF have for making such a ridiculous protection scheme? All it does is irritate the end user.</p>
      <p>Sean Glenn<br>
      Art Director<br>
      <a href="http://www.superunicorn.com" title="www.superunicorn.com">www.superunicorn.com</a></p>
