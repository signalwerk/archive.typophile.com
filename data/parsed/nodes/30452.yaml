      <p>Chuck doesn't really make fonts anymore. He sells the fonts of better designers, and treats them like garbage. Just ask Larry White. As for that sham Fontguard, Chucky doesn't have much faith in it. He now places the purchaser's name and address in the Copyright/version string of the fonts you buy. And, he makes you register an account with a valid telephone number so he can call you and make sure that you're white. </p>
      <p>I registered to buy Factory earlier this year. Within about an hour he called me. The call went like this;<br>
      ME. Hello<br>
      Chuck.(Rudely) Yeah I'm calling to register an account for 'NAME', is that you?<br>
      ME. Yes, wow that was fast.<br>
      Chuck.(Rudely) Where are you from?<br>
      ME. I was born here in the US, why?<br>
      Chuck.(Rudely) No you're not, You don't sound American. You have a ghetto Accent.<br>
      ME. Well, my parents were from Asia, received citizenship in the 80's. But I was born here &amp; I'm not ghetto.<br>
      Chuck. (Rudely)Forget it I can't help you. Go somewhere else. (Hung up)</p>
      <p>Guy's a jerk. So if you have an accent or aren't within his color preference, I guess he won't sell to you. But sadly, that's really only hurting the designers who sell through him. Give it a try yourself. Let him call you and have a friend with a Russian or Hispanic accent answer. Watch him hang up. Before he sees this post that is. If only smart phones could record their audio...</p>
