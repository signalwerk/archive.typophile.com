      <p>Sergej - this happened in the early 90s -- when typesetters were becoming dinosaurs.</p>
      <p>I can remember going to Poppe Tyson (an advertising agency in NY) one morning -- they framed their very first job. I looked at it and screamed, "Who the F set this?" </p>
      <p>I was asked by the art director, "Why?"</p>
      <p>I looked it over and responded, "If I sent you a job that looked this bad, I'd have a call at 9:01 a.m. letting me know I was replaceable. There is no kerning, no proper rag, no true punctuation!"</p>
      <p>The art director responded, "It doesn't matter, I'm proud of it, it was the first job I set myself and the client has 'ok'd' it."</p>
      <p>To me that was the end of typography. For others that day, it was the New York Times printing a full page ad with very large inch marks for quote marks... same day, same fate.</p>
      <p>So Sergej, I don't know how old you are, or where you were when the amateurs took over - and the customers decided - ah, this is cheaper and we can live with it.</p>
      <p>Our shop was excellent. Photoshop, according to Cosmos, ran an ad on my behalf - "Often imitated, never duplicated..." when I spent money on an altergraph and a graphflex and was able to do many of the special effects that they were known for -- and well.</p>
      <p>I guess you haven't run into the kid that spent $2200 bucks and thinks he/she can do it all themselves... and what's worse - professionalism has been placed 6-feet under.</p>
      <p>And a flash bulletin - there are no typesetters left. Even Boros has given it up. The only reason I was able to survive was by becoming a graphic arts studio... and I was fortunate to work with so many wonderful art directors in New York - greatest apprenticeship program ever!!! </p>
      <p>and P.S. I never said he could do it as well - only that he advertised to my customers he could...</p>
