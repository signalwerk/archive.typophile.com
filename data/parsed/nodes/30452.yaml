      <p>When my Adobe font collection was stolen and being used by a company down the street from me -- and I was very close to Adobe in those days and let them know, they first wanted to know how I knew it was my library. When I explained I altered and renamed some fonts and that no one else would have them that way but me -- they listened a bit more. The Adobe library alone at that time was a $15,000 investment. Know what the outcome was - it wasn't enough in be worthy of a lawyer, and they never pursued it. </p>
      <p>So do you think any foundry losing a font here or there could afford the legal expense it entails - for a $29 or a $449 font? </p>
      <p>The only company I know for sure that went after someone was Quark. A New York marketing person had sold about 15 or 20 Mac computers to a corporation when computers were first going in... Each computer was outfitted with programs - all with different serial numbers. Then the marketer went to another corporation, got them computers -- and outfitted those with the same serial numbers as the first company. I don't know how many times the marketer did it -- but he lost one of the companies about 2 years later - just in time for the latest Quark update. Well, needless to say, the serial numbers were already accounted for and that compnay was not the one that they were registered to. You see, they were all registered to the marketer, and he'd go from company to company upgrading to the latest software as part of his service. Don't think he ever expected to lose an account, or have an account bright enough to update on their own. And yes, Quark went after him - and yes, they won. </p>
      <p>In that case, yes financially, it was definately worth going after legally. </p>
      <p><strong>fontplayer</strong>  <em> font I was thinking of buying didn’t have a full character set</em></p>
      <p>Fontplayer, almost everyone of Chuck's fonts has/had a Betafont put out for a select group to try the font and give their opinion. The Betas never had the full character set. I wonder if that is what you were referring to and maybe, didn't know it. I own a few LHF fonts and they are all complete, and some even more so with alternatives. </p>
      <p>Chuck still uses human beings to answer the phones and talk to custumers (even those of us who aren't purchasing at the time). It's a nice way to do business -- and see, makes people like you have a soft spot for him, and keeps his regulars calling back. The last time I spoke to LHF it was about 8pm EST and it was about a font. Not only did I get all the information I needed, I could not believe how busy everything sounded -- their phone seemed to ring off the hook. </p>
      <p>I hope LHF survives and thrives through this modern age. They have some wonderful fonts - different from the every day stuff -- and not going into the square san serif look that is coming out of Europe these days. They are strong, bold fonts with a hint of femininity (my opinion of the ones I own) and the other foundries do not have anything like them.</p>
      <p>Did this thread hurt Chuck? Honestly, I don't think so. For those of us that want those distinctive fonts for display type - I doubt it. What has hurt are people who get their hands on the fonts and pass them all over the internet. That really hurts.</p>
      <p>P.S. <strong>aluminum</strong>  <em>If all the content is outlined, it’s impossible for their internal search engine to index any of it.</em></p>
      <p>One thing you may consider is using your display type (LHF) in vector format - then bringing it into your page layout as a graphic -- then all your body copy would still be in a font that a search engine could get to... Two minutes more work for you -- but you'll have the design you want and still have a large percentage of your page as you want it.</p>
      <p>You are right - for me - I just use the pdfs two ways. One to give to a customer that I do not want them touching it in any shape anyway. (All corrections made in a master file) and Two - to the printer (who I do not want touching it either...) if they run into a problem, let them tell me so I can fix it -- and keep it fix from that point forward.</p>
      <p>Thank you for letting me speak up early in the morning - I should get to work now. Later :-)</p>
