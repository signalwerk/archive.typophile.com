      <p>"The real solution here is that Adobe/Microsoft/Apple need to get together and extend the OpenType scheme to have some sort of native DRM"</p>
      <p>DRM does nothing to stop real piracy. If someone can come up with a DRM scheme, someone sitting in a cubicle in China can crack it. It's just a silly cat and mouse game and the paying consumer gets stuck with dealing with all the crap it entails.</p>
      <p>Are there exceptions? Certainly. iTunes succeeds in spite of its DRM. Granted, a big part of that is because their DRM is a lot less restrictive than other music DRM options right now.</p>
      <p>"and other pathetic excuses for their inherent lack of morals."</p>
      <p>Unfortunately, neither laws nor technology can do much to change personal morals.</p>
