      <p>The font data will still need to appear somewhere in the computer memory in its raw format (otherwise the font will not be usable by the software like Illustrator). Once it is raw, it will be grabbed and saved into a de-DRM'd file.</p>
      <p>This is a really old issue that has been explored in depth with shareware programs. DRM does not work (as in it is easy to break) <em>unless</em> it is rooted in the hardware (e.g. specialized chip) and the user is denied arbitrary access to this part of his computer. The problem here of course is how to convince a user to buy a computer that he does not have a full control over.</p>
    html_clean: |-
      <p>The font data will still need to appear somewhere in the computer memory in its raw format (otherwise the font will not be usable by the software like Illustrator). Once it is raw, it will be grabbed and saved into a de-DRM'd file.</p>
      <p>This is a really old issue that has been explored in depth with shareware programs. DRM does not work (as in it is easy to break) <em>unless</em> it is rooted in the hardware (e.g. specialized chip) and the user is denied arbitrary access to this part of his computer. The problem here of course is how to convince a user to buy a computer that he does not have a full control over.</p>
  - id: 432290
    user: 50554
    date: 2010-10-03T07:35:00
    date_raw: 3 Oct 2010 — 7:35am
    votes: null
    html: |-
      <p><cite>The problem here of course is how to convince a user to buy a computer that he does not have a full control over.</cite></p>
      <p>Well, if that is the only kind of computer that will play a Blu-Ray disc, for example, it may also be the only type of computer available for sale before long. I think such features are already present in the latest Intel and AMD microprocessors.</p>
      <p>But even a very imperfect DRM might be better than nothing, and good enough that companies will feel they can use that instead of taking such a step as Letterhead Fonts did. Also, while it's true the encrypted font data needs to be decrypted in memory, it doesn't follow that a usable image of the whole file will be there. The individual characters could all be present, but without the data linking them together being present in the same format as in an unencrypted font file... except for a short time when the header, but not the characters, have been read in.</p>
