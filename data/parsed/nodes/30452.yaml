      <p>Dear Chuck,</p>
      <p>I have dropped out of buying fonts for a few years. I purchase to rarely, a client has to give me a pretty good reason to spend the extra money.</p>
      <p>However, as a typesetter in New York City, when the Mac became the way, I plunked down more than $25,000 on a font library. Owning Letraset, Bitstream (Type 3, which they were kind enough to update to a Type 1 a year later), Monotype, Linotype, URW, Adobe (originally library was a mere $15,000 and talk about errors in fonts.), and many fine fonts from FontFont, FontHaus, etc. (BTW, do you have any idea how many Garamonds a typographer during 1989-1991 in New York had to buy to be legit?)</p>
      <p>In my typeshop, I had a disgruntled worker. He made a copy of my entire library (including some original handtailored fonts) and gave it to his friend, a photographer, down the street. The friend decided to become a design shop, and you could imagine my face when I received a flyer from the "other" shop, letting my customers know that "his" library contained exclusives, and he could set the job better than who you are using today...</p>
      <p>I contacted Adobe immediately. Yes, I called in the Font Police. I learned pretty quickly that one person stealing a library wasn't worth their time and energy in legal fees. They referred me to a person at QuarkXPress. That was an interesting story. Quark found a consultant in New York who bought 25 copies of Quark. He placed them in one of the companies he was consulting for. Then he placed them repeatedly in other companies -- all using the same serial numbers. He did it so many times, that eventually companies started to contact Quark on their own to get the upgrades -- all using the same serial numbers. I still wonder how that lawsuit worked out -- that is what Adobe wanted me to know, you have to go after the big fish.</p>
      <p>It isn't like you've lost a customer in me, I do like your fonts, and maybe one day, I'll be able to have a customer who appreciates them and is willing to pay the price. I no longer am. But the fonts I own, all licensed and legit -- I do need to pass on to my printer when I am doing book, advertising and magazine work. </p>
      <p>I am just sharing this. Maybe some would call it rambling. I do want you to know, I do know what it is like when one is stressed out in a business that is going nowhere, where your assets are being stolen - and worse, advertised against you. Sometimes you have to realize it is okay to move on.</p>
      <p>Meanwhile, I am curious, if someone did want to give a printer a pdf or have the font to give their absolutely, legitimate printer so their job looks exactly like they expect it to -- is the new licensing of Letterhead Fonts opposed to this? Or must we make a PDF in Photoshop, flatten it like a graphic, and have no fonts -- which means, oh no, more time on making type corrections down the road...</p>
      <p>And by the way -- I keep repeating myself lately, but I am amazed that a "newbie" can go on line, pick up tons of illegal fonts -- and have a better typography library than Photolettering did in 1989! Probably every typographer I knew, is rolling over in their graves... and most likely, laughing.</p>
