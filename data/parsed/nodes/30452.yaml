      <p>&gt;if you click on that - Chuck is giving full details of the change,<br>
      &gt;what to expect and even if you need to call him after you purchase.<br>
      &gt;It just takes some time to look and read…<br>
      &gt;<br>
      &gt;http://www.letterheadfonts.com/support/changes.shtml</p>
      <p>Yes, this information was all there when I bought one of the new just-released LHF fonts before starting this thread (as I pointed out in an earlier post). But as I've noted a couple of times before, the information offered is limited and in my opinion less than honest because it withholds other facts needed for full disclosure. The main three things we are told is the fonts are not put in the system fonts folders, they won't work with font managers, and they won’t embed in PDFs and have to be converted to outlines first.</p>
      <p>But the URL above withholds telling the buyer they no longer get a regular OpenType .otf file they can manage, or that the entire scheme is a black-box operation so the fonts are locked down and the user can't touch them outside of use within DTP applications. We also aren't informed fonts cannot be packaged for output to a service bureau, though perhaps one should be able to surmise this from the fact fonts aren't imbeddable in PDFs, but it certainly isn't noted. The site info also doesn't mention that LHF fonts are now either all on or all off with no ability to load them individually.</p>
      <p>The user is simply left in the dark about these critical facts and to discover them on their own *after* they have already paid their money and started using the font(s). As Chuck said, he has the right to implement whatever scheme he wants. But by the same token users have a right to be fully informed before making a purchase too. That's not the case right now.</p>
      <p>Also, on the LHF site, this is all framed in the context of being better technology. Nothing at all is said about Chuck being fed up with piracy (other than a vague passing allusion in his "About LHF" bio on the site) and that this was the real reason for the change, or at least the reason for the lockdown aspect of it that is never divulged.</p>
      <p>And I think this is because Chuck is probably afraid of what would happen to sales if he were to be completely forthcoming about it. Understandably, I guess. I mean, I like Chuck. I understand the dilemma. But it's also understandable that many users will need and want to know. If it's a serious rather than casual or uninformed type user, you're going to have a seriously annoyed customer on your hands if you make them buy first only to find out the real "gotchas" later.</p>
