      <p>There is a legal issue that has not yet been discussed.</p>
      <p>At his website, Mr. Chuck Davis makes this legally relevant declararation:</p>
      <p>"..... We've also decided to go full-force with Postscript Open Type and offer them exclusively ....... Letterhead Fonts are now available only in Postscript-flavored Open Type. This means that your software must support Open Type fonts. Open Type fonts work great in most Microsoft applications..........."</p>
      <p>For full text see <a href="http://www.letterheadfonts.com/support/changes.shtml" title="http://www.letterheadfonts.com/support/changes.shtml">http://www.letterheadfonts.com/support/changes.shtml</a></p>
      <p>Now there is this legal issue:</p>
      <p>The Open Type font file specifications were defined by Microsoft and Adobe to warrant cross-platform compatibility such that the same identical Open Type font file can be used without modification on different operating systems (Mac OS, Windows OS, etc.). Exactly this is the meaning of "Open": For each font, there must exist one and the same open disk file usable by different operating systems. For more technical details please read the Open Type specifications published both at the Adobe and the Microsoft websites.</p>
      <p>According to these Open Type specifications, Mr. Chuck Davis is not allowed to declare the non-open stuff he sells as "Open Type".</p>
      <p>Mr. Chuck Davis may label his cripped non-open stuff by whatever other name he likes, but he must not label his crippled non-open stuff as "Open Type". Whosoever sells non-open stuff as "Open Type" commits the crime of fraud.</p>
