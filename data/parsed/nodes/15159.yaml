    html: |-
      <p><a href="http://www.amazon.com/exec/obidos/tg/detail/-/032121921X/ref=pd_sim_1/002-2299043-6754462?%5Fencoding=UTF8&amp;v=glance" rel="nofollow">Real World InDesign CS</a> by Blatner and Kvern -- very comprehensive, good for more advanced topics. Looks like the <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0321322029/ref=pd_sim_3/002-2299043-6754462?%5Fencoding=UTF8&amp;v=glance" rel="nofollow">update for CS2</a> is due to hit the shelves in December. </p>
      <p>For looking up basic stuff, I use the <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0321213483/ref=pd_sim_4/002-2299043-6754462?%5Fencoding=UTF8&amp;v=glance" rel="nofollow">Visual Quickstart Series for InDesign CS</a>. I'm also interested in getting <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0321334132/ref=wl_it_dp/002-2299043-6754462?%5Fencoding=UTF8&amp;coliid=I3POBABQD2RZOL&amp;v=glance&amp;colid=3HNIFP5RGYVYN" rel="nofollow">Adobe InDesign CS/CS2 Breakthroughs</a> by Blatner.</p>
