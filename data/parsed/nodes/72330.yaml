      <p><cite>Or was it down to developer aversion to licensing patented technology in an open source product?</cite></p>
      <p>With many free software licenses, you can't technically license patents, because you can't pass the protection you perceive with your code, see §11 <em>patents</em> of the <a class="freelinking external" href="http://www.gnu.org/licenses/gpl.html" rel="nofollow">GPL</a> for example. Also, there are the stand against software patents that many free software developers would take, so it is on principle to avoid software patents, neither licensing them nor intentionally violating them.</p>
