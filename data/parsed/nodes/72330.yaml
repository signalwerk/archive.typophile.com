      <p>It all, choice and competition, depend(ed) on developers getting amp-ed about hints that work if they need them, for the market transitioning from A to AA fonts. I see one 'r two companies that've been in the hinting business constantly since the mid-1990's. This miscreation of a fantasy problem with TT patents is one reason.</p>
      <p>And should I ask sii... who jumped off the hinting bandwagon recently? Head 'em up, move em out all day long here to ensure windows users don't barf at their type. Must be for the sake of competition, eh!?</p>
      <p>Cheers!</p>
