      <p>JH&gt; Does anyone other than you use the term rasteriser in such a precise way that it is distinct from scaler? </p>
      <p>I know you don't like hints, but I'm only tying to help. Them patented instructions, in post-aliased screen font environments, were not part of the solution of hints that worked... I said so long ago and since. I came back to cover your fantasies of my fantasies in this otherwise gentle conversation.  </p>
      <p>Anytime anyone wants to talk about all of raterization, (sizing, scaling and rasterizing) and use the term rasterizer, that's fine. Anytime anyone wants to talk 'bout one of them and use the term rasterizer, that's for less expert forums, I think. The patents, I think were for code that does scaling useful in aliased rasterization.</p>
