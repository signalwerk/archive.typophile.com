      <p><em>What does it mean to compete on rasterization?</em></p>
      <p>Presumably that one has a commercial rasteriser implementation that one is seeking to license to customers for money, and then these pesky open source folk come along with a free rasteriser. Now, presuming that one has paid a license fee to Apple to implement their patents in your commercial rasteriser -- whether one needed to or not --, one might see it as unfair competition for another rasteriser not to have paid Apple to license those patents.</p>
      <p>According to the allegation to which Si linked, Sampo and Bitstream are the ‘scary patent-mongering user-haters’. I suppose Sampo knows as much as anyone about TT patents, since he wrote them. Apple, for their part, have apparently been happily collecting patent license fees from anyone offering to pay them, even as they appear to have taken no legal action against those who didn't. All very messy.</p>
