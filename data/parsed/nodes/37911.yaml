    <p>I’m new to this graphic design game but not new to type or art. I have switched my major to graphic design from humanities. I have always been fascinated with type and letters (i used to be a graffiti artist) I am trying to built a portfolio so i can transfer to Art Center College of Design.  </p>
    <p>Anyways this is my first graphic design project. It’s a poster, the subject Orphans.</p>
    <p>Please critique away.. i wont get offended... your observations on my kerning will be definitively appreciated. i don’t know if i messed up on the kerning since Gill Sans has a big range in between letters and i’ve done the opposite.</p>
