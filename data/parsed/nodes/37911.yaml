      <p>I think choosing the mines sign confuses the message (or the message confuses the image), I would have thought that a line like ‘Orphans are created long after the war is over’ might work for this image or an alternative image might support your image better. As it stands you are right to be concerned about the kerning the point of kerning is not to create a mathematically equal space between characters rather to create an equal <em>visual</em> space. One method is to print out your type (in black on white so there is no interference from the  image) and view it upsidedown and squint at it –&nbsp;this should reveal where there are darker or lighter areas which you can adjust indivdually until there are fewer obvious areas, however the point is not to upset the readability of the pairs of characters so one has to accept that some characters are not going to accept this treatment, the position of the comma is much too tight to N once you have amended this you should look at aligning the other characters on the right of the N (again visually rather than mathematically) so curved letters (S,D,R) will slightly extend beyond the line created by the more vertical characters.</p>
      <p>Tim</p>
