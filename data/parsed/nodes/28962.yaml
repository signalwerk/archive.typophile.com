      <p>Than I reviewed the specimen from Lettergieterij Amsterdam, I was stunned about these initials and the gap between the rest of their type portfolio.</p>
      <p>Yes, the second layout shows an tastefull usage. But overall, the design of the initials reminds me on barbwire, brambles or scratches. If you print them black, they have “dark” power like a strong sign or statement.</p>
      <p>I know nothing about the first book and its purpose, but the initials look out of place.</p>
      <p>—<a href="http://www.astype.de" target="_blank">astype.de</a>—</p>
