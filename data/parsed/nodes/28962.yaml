    html: |-
      <p>Andreas, viewed as an entire alphabet on a specimen sheet at smaller sizes the letters don’t present themselves well. One by one with ample whitespace they are in my opinion quite stunning. </p>
      <p>My presentation at ATypI in Vancouver 2003 should clarify what these initials should remind you of.</p>
      <p>The book the upside-down samples come from is:<br>
      </p><div class="imageWrap"><img src="files/naimeh_najafi_5076.jpg"></div><p></p>
      <p><em>My Heart is in Persia</em> by Naimeh Najafi (autobiography)</p>
      <p>I take it the Persian reference was the reason for the choice of Raffia Initial. The Raffia Initials share some stroke contrast and ‘role architectural’ characteristics with Arabic calligraphy. However, they are in my opinion not properly or custom fitted. I’ll ask the person who provided me with the scans to show me the fit on other chapters.</p>
      <p>The other sample was for a bibliophile production, where the creator of the initials was also the typographer (and illustrator) of the book.</p>
      <p>Just noticing this: The Raffia upside-down W is in some ways more in tune with the swash M used on the dust jacket than the Raffia M is!</p>
