      <p>It reminds me of a job I had once...</p>
      <p>I had a really fabulous assignment to design one of those educational "wall charts" for a national laboratory -- you know, those dense things that are hanging on the wall of your science class in high school? The design process unfortunately included regular meetings with a large group of government bureaucrats and scientists. One day, well into the project, the panel ganged up on me to insist I change the typeface used throughout (Myriad MM) to some kind of font with serifs, because "fonts with serifs are more readable." Despite the fact that the overall design required a wide range of weights and widths, and consisted mostly of short text passages, I could not dissuade them from the idea that "serifs are always better."</p>
      <p>(Somewhat fortunately, soon after, I was forced out of my job through a spectacular political showdown that gave me the rare opportunity to tell a particularly odious bureaucrat, to their face, "Well then I will just have to quit!" Ah, the memories. Someone else finished the wall chart.)</p>
