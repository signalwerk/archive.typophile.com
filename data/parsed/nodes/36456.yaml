    html: |-
      <p>My not-very-expert opinion is that in design very little boils down to "rules". Most of it is personal preference and consensus. </p>
      <p>Tried and true reigns at this institution -- or I should say unquestioned tradition. And I can deal with it. Most of the time. I nod and smile and bite my tongue, but lately I've been wanting better answers for why we do things a certain way. "Because we've always done it that way" is just not very convincing.</p>
      <p>We now have one style for phone numbers in English text and one style for phone numbers in French text. This confuses me (why??????) and makes more work for me. </p>
      <p>I changed all the French to what the translation department wanted. The English have already gone off to print, and so they won't get changed from the (514) 123-4567 format to the 514-123-4567 that our marketing communications department wants. Too bad, but I'm not sure I really care that much. </p>
      <p>No, I don't have CS3. I have CS2. :(</p>
      <p>I was having a very frustrating day, and I don't know any better place to come for understanding and venting than here. You guys get me through the day sometimes! </p>
      <p>I have had a very frustrating couple of months. I've often wondered if I'm becoming a monkey who knows the software instead of a designer and editor who just might possibly know a little bit more about the job than administrative secretaries and assistants. The phone numbers are not important. They were just the proverbial cherry. </p>
      <p>Some days I want to clean houses for rich families in Westmount. The salary would be about the same. I'd be following orders. I'm detail-oriented--I can polish silverware. The main difference is I wouldn't feel that my skills and knowledge were being crushed, or worse, ignored. And I'd have dry hands and broken nails instead of bad eyes and back pain.</p>
      <p>Whaddyall think? Time for a career change? </p>
      <p>/off to drink my troubles away. ;)</p>
