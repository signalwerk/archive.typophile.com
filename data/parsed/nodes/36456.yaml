      <p>I'm not sure if I agree with sticking to tried-and-true. Most of times, tried-and-true are just people staying in their comfort zone. But you can still communicate outside your comfort zone. When people complain to me about something like that, I say "can you read it?" or "Did you understand it?", or even "Would you be able to make a call to that number?"</p>
      <p>That usually gets the true reason out on why they want things this or that way, and most of the time is about personal taste.</p>
      <p>I prefer the way you designed, with the dots. More elegant and super clear, not mentioning consistent.</p>
