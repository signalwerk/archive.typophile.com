    <p>Ooooh I was just informed by our translation department that I cannot present phone numbers any other way than 514 123-4567.</p>
    <p>I had spiced things a bit with 514.123.4567 in a new design, but Noooooo I am not allowed to present phone numbers that way in the French version of the booklet because we follow the rules of the Office de la langue française, and *they* say phone numbers must not be presented any other way. </p>
    <p>I'm so annoyed with this. It's stupid, it's silly, but where is the boundary between language and design? I understand language-specific punctuation and hyphenation etc...  it's necessary. But phone numbers? </p>
    <p>Ggggrrrrrrrrr. </p>
    <p>/off to do some find and replace.</p>
