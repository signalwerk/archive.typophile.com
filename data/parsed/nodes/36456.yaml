      <p>I am not, actuslly, invested in the one presentation or the other. In other, less trendy, publications we've used (514) 123-4567. This would not be acceptable to them, either. </p>
      <p>My beef is that I just don't see how this is a language issue. To me it's a style preference. You don't like it? I'm cool with that. Tell me you just plain don't like it or give me reasons. But don't tell me that the government says that there is only one correct way to present phone numbers in French.</p>
