    date_raw: 28 Nov 2011 — 3:09pm
    votes: null
    html: <p>The Republican elephant and Democrat donkey both originated as less than flattering portrayals of the parties, their supporters or candidates, which were then subverted to become positive emblems. The 19th Century cartoonist Thomas Nast was instrumental in both cases. I think this kind of evolution is much preferable to either the assignment of symbols by an election office as in Egypt, or the branding of parties by advertising agencies. To have had one's candidate called a jackass in 1828 and to be wearing the emblem with pride almost two hundred years later seems to me admirable.</p>
