    html: |-
      <p>In Sweden seven out of the eight parties in parliament have a flower as a symbol, I assume starting with the Social Democrats' rose, which after all is a common symbol across Europe, but sort of spiraling away from there. The one exceptions is the mainstream centre-right Moderates, who use a stylised letter M as a symbol instead.</p>
      <p>Social Democrats = Rose<br>
      Left Party (ex-communist) = Carnation<br>
      Green Party = Dandelion<br>
      People's Party (law-and-order right, ex-neoliberal, ex-liberal) = Cornflower<br>
      Center party (neoliberal, ex-agrarian) = Clover<br>
      Christian Democrats = Wood Anemone<br>
      Sweden Democrats (racist right-wing extremists) = Hepatica</p>
