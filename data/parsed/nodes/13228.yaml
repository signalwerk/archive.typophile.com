    <p>Hello</p>
    <p>I sent this to Mike Yanega and he recomended I post it here.</p>
    <p>I am having a very hard time trying to identify the font type used on my company website. We are making some changes/updates and the original web design company, in a display of sour grapes, is not telling us what font this is, because they want to do all the updating work.</p>
    <p><a href="http://www.energyottawa.com/_images/english/inside/green/t_green_generation.gif">Click here for a sample</a> or <a href="http://www.energyottawa.com/green_power/index.cfm?dsp=template&amp;act=view3&amp;template_id=46&amp;lang=e"> Click here for the full website</a></p>
    <p>Any help anybody can provide in identifying this font would be greatly appreciated!</p>
    <p>Thanks</p>
    <p>Tim</p>
