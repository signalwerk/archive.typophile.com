    html: <p><a href="http://www.google.com/search?hl=en&amp;lr=&amp;ie=ISO-8859-1&amp;oe=ISO-8859-1&amp;q=Latinskaya%2Btypeface&amp;btnG=Search" target="_blank">Here are the Google search results for ‘Latinskaya typeface’</a>. A typeface that claims to be based on it (<a href="http://www.myfonts.com/fonts/paratype/quant-antiqua/quant-antiqua/charmap.html" target="_blank">Quant Antiqua, from Paratype</a>) is available, but that may be all you can ﬁnd these days. It has a few resemblances, but many more diﬀerences. For example, the a, i, e and y in your sample are quite diﬀerent in Quant Antiqua. The M is similar, but that is the only u.c. letter in your&nbsp;sample.</p>
    html_clean: <p><a href="http://www.google.com/search?hl=en&amp;lr=&amp;ie=ISO-8859-1&amp;oe=ISO-8859-1&amp;q=Latinskaya%2Btypeface&amp;btnG=Search" target="_blank" class="link-external">Here are the Google search results for ‘Latinskaya typeface’</a>. A typeface that claims to be based on it (<a href="http://www.myfonts.com/fonts/paratype/quant-antiqua/quant-antiqua/charmap.html" target="_blank" class="link-external">Quant Antiqua, from Paratype</a>) is available, but that may be all you can ﬁnd these days. It has a few resemblances, but many more diﬀerences. For example, the a, i, e and y in your sample are quite diﬀerent in Quant Antiqua. The M is similar, but that is the only u.c. letter in your&nbsp;sample.</p>
