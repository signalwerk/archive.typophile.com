    date: null
    date_raw: null
    votes: null
    html: |-
      <p>Helvetica with extremely tight tracking also works well. For the first half of a title, use the Thin weight; for the last half, Heavy. Either go all upper or all lowercase, or a combination of both (thin and lower, heavy and upper, or vice versa).</p>
      <p>This also works with Avant Garde as previously mentioned, or combining a heavy Didone with a thin grotesque, or vice versa.</p>
      <p> - Lex</p>
