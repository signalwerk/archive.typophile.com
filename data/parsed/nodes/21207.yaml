      <p>A weight that I will eventually draw for Cyril ( <a href="http://www.typophile.com/node/12860" title="www.typophile.com/node/12860">www.typophile.com/node/12860</a> ) if I ever draw any weights for Cyril: Cyril Absurd. Right beyond Cyril Black. It gets phatter at the end because I realized I could make it even phatter.</p>
      <p>The process I went through to make it:<br>
      -Hand draw in pencil<br>
      -Trace pencil with pen<br>
      -Scan into garage computer<br>
      -Transfer into computer in my room<br>
      -Touch up in Photoshop<br>
      -Import into Inkscape<br>
      -Trace bitmap<br>
      -Minor tweaking<br>
      -Export bitmap<br>
      -Post<br>
      Ridiculous, eh? What do you guys do? I bet you all have those new-fangled hifalutin styluses.</p><div class="imageWrap"><img src="http://typophile.com/files/phatman_3480.png"></div><p></p>
