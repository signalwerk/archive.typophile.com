    html: <p>Paratype sells a Cyrillic "<a href="http://www.paratype.com/pstore/default.asp?search=DIN+Condensed&amp;fcode=PT_DNC" rel="nofollow">DIN Condensed</a>". But if you need more weights, their <a href="http://www.paratype.com/pstore/default.asp?search=ITC+Officina+Sans&amp;fcode=PT_OSN" rel="nofollow">ITC Officina Sans</a> might be a good replacement.</p>
