    html: |-
      <p>Exactly, Deberny &amp; Peignot upon the idea of the art director Maximilien Vox acquired rights to produce a version of Futura from Bauer.<br>
      They released Europe in 1931 in France and french colonies. It seems the greek variant is specific to Deberny &amp; Peignot as they produce it punchcutting while Bauer use a pantographic process to directly produce Futura.<br>
      We wrote a book in french about the history of Futura typeface. ISBN 978-2-9155-4239-4</p>
      <p><a class="freelinking external" href="http://www.editions-norma.com/Livres/Arts-decoratifs-l-Design/Futura-une-gloire-typographique" rel="nofollow">http://www.editions-norma.com/Livres/Arts-decoratifs-l-Design/Futura-une-gloire-typographique</a><br>
      <a href="/wiki/www.facebook.com/futurastory" class="freelinking" rel="nofollow">www.facebook.com/futurastory</a></p>
