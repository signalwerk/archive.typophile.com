    <p>Somebody knows something about this typeface? History, author, something else? </p>
    <p>Typeface name: Europe (or Capitals Europe?). Geometric (Futura like). France? Greek and latin.<br>
    On the example: Théogonie (with illustrations by Braque), publisher: Adrien Maeght, Paris, 1955. Letterpress.</p>
