      <p>Of course Elzevir is Dutch. But the term “Elzevir” in type was/is used to label late-19th century French type that thought it was imitating the Dutch stuff by that house. Read Ovink’s monumental three-part article in Qaerendo about the 19th-century reactions against the Didone hegemony.</p>
      <p>hhp</p>
