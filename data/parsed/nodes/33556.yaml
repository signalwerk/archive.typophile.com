      <p>&gt;Elzevir is much later than Caslon.</p>
      <p>To clarify: I was not referring to the 19th century French type called by that name, revived by Monotype, but to the 17th century types of Van Dijck that were used by the Dutch publishing house Elzevir and are the basis of DTL Elzevir. These types of are often cited as models for Caslon’s work in the 18th century. They do bear a definite resemblence, though there are differences.</p>
