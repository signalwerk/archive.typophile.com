    <p>Hi,</p>
    <p>I’m trying to find a clean, sophisticated, italicized font that has these W’s with a little curly-cue in the middle.</p>
    <p>I feel like there are some very common fonts that have this characteristic, but I don’t know what they are. Can somebody recommend some fonts with this little flourish?</p>
    <p>I’m using the font for some book captions.</p>
    <p>I feel like the captions for the New Yorker cartooons have these W’s.....but they in fact don’t.</p>
    <p>Many thanks in advance,</p>
    <p>David</p>
