    html: <p>I would consider both of the commentaries from Loren and Mike. Perhaps, rather than changing the color or weight of the "L's" you can just make sure that they are in the same style as the roof and foundation ("rough" in your existing design). I apologize for not having the time to do even a quick search for you right now, but you might be able to find a font for the whole "building letters" title that would match (i.e. same style) the roof and foundation well. Good luck...I'm anxious to see what you come up with. You have a good foundation (no punn intended) to start from. <br> <br>Aloha! <br>Scott</p>
