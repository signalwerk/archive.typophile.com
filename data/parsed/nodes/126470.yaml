    <p>My version of Font Validator is 1.0.1286.</p>
    <p>I've tried to locate the new version of MS Font Validator which is now in open development. I am perplexed by Github and the arcane file lists there. I tried to download a binary and McAfee immediately flagged the downloaded file as containing a virus, then deleted it.</p>
    <p>Would someone kindly point me to a recent version of Font Validator ready to be installed on Windows 7, hopefully an .msi or .exe file.</p>
    <p>Thanks,</p>
    <p>Charax</p>
