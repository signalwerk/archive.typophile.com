      <p>Hello, I was searching for some other Font Validator related thing and came to this... I would like to know which urls you click got McAfee to delete.</p>
      <p>Anyway, this is probably what I would recommend people to download to use now:<br><a href="https://sourceforge.net/projects/hp-pxl-jetready/files/Microsoft%20Font%20Validator/misc/FontVal-2.1.0-py-bin-net4-x86.zip/download">https://sourceforge.net/projects/hp-pxl-jetready/files/Microsoft%20Font%...</a></p>
      <p>You just unzip somewhere and double-click  FontVal.exe within. Unlike the older version, it doesn't write anything to registry, etc so you can have multiple versions around, and does not really need to be packaged into an installer. Just unzip somewhere and run.</p>
      <p>Mostly I try to get people to post in public (the freedesktop create mailing list or the freetype-devel mailing list, typedrawers web site, or file a issue on github in either Microsoft's issue tracker or mine) so that others can benefit instead of one-to-one e-mails, but if you have to e-mail me, you have to ... htl10 at users.sourceforge.net is the e-mail address.<br>
      (yes, I am the main person reviving the Font Val code...)</p>
