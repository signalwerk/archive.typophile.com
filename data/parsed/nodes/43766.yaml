      <p>While there are a big number of small, great and independent typeface designers living and working in Germany, the only "Big Foundries" with a "high" number of employees (what do you compare this too?; even their numbers are not very large…) are FontShop/FSI and Linotype.</p>
      <p>Aside from the UK, no other European countries have big foundries, although just about every country has a number of great studios, smaller foundries, and star typeface designers.</p>
      <p>In the UK, Monotype has a large and historic office. And then there are bigger studios, like Dalton Maag and FontSmith.</p>
      <p>The US is still a champion of industry, at least in the very small world of digital type. But that really wasn't your question.</p>
      <p>I don't think that there are any secret, big foundries hiding in the corner :(<br>
      The reason that you can't find any more big names in Germany, other than Linotype, FontShop, Elsner &amp; Flake, and URW++, is because there aren't any others. If there were, you would hear about them. The old metal type names are gone (Stempel was bought by Linotype, although a spin-off company still sells metal fonts, Bauer has moved to Spain, and the East German TypoArt conglomerate of all pre-war eastern foundries seems to have dissolved into thin air in the early 1990s).</p>
      <p>Take heart that the "not Big Foundries" like FontFarm, Lazydogs, Volcano Type, etc. are still churning out interesting type for the German and international design market, too. The number of employees that one has is not enough to make one great ;-) great typefaces and great fonts make one great!</p>
