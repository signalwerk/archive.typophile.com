    <p>Hello, I was wondering which big foundries today have their HQ or main offices in Germany.</p>
    <p>My quick research gave me Linotype and Fontshop... Is that right? -- Are there some more? (Even though Linotype belongs to Monotype now, right?)</p>
    <p>Also more generally, which big foundries are situated in Europe ex Germany.</p>
    <p>I do have the impression that all the big contemporary font foundries and libraries are situated in the US.</p>
    <p>Thanks, guys!</p>
