      <p>Another question is what employees are you wanting to count? If you are speaking in terms of designers, then a 'big' foundry might have 3-5 people designing full time. But there is this exponential curve of No. of employees x revenue... So when you are speaking of big (business) companies the number of employees will be drastically larger, but not necessarily in the design department. Most of these extra people though are to support the customers, make sales, make sure people get paid and the checkbook is balanced, etc. </p>
      <p>But anyway, your question has been answered already. I only point this out because it was eye-opening for me to see how 'small' most companies really are - despite their overall size or what they produce.</p>
