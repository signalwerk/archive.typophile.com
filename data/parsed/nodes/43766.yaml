      <p>Dan, I was by no means asking for the "Big Ones" in search of "great type". On the contrary, I believe, most notable designs come from independent foundries. Well, there are some contemporary notable ones from the Big Ones as well, but compared to their size, capitalisation, etc. the small independent shops do an incredible job, and are in my "I like this font" list overweight! They are in my view the drivers of innovation and good designs.</p>
      <p>Still, I wanted to make sure I did not miss out any.</p>
