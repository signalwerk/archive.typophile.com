    html: <p>There is a Meta condensed, though it is already on the narrow side to start with, like Goudy Sans. Benton regular is also in inherently narrower form than Helvetica, which is why I think it sets better, when at any length. Also Myriad Condensed is nice, and with its softness would probably go with Berkeley, if you stick with that. I don't see how Didot, which is wide like Helvetica, is a good match for the Goudy faces, but I am not looking at it, so I may be way off base.  <br> </p>
