    html: <p>Vern <br> <br>I mentioned The Alphabet in a post about ten days ago, in response to a thread about books on type design. The Alphabet and elements of Lettering were produced very close together. I have elements in front of me, so I can tell you the date was 1922. I believe that elements of Lettering was around 1911 or 1912. The publisher is Mitchell Kennerley. Both titles were printed by Marchbanks Press. <br> <br>I also have a copy of The Alphabet, but it's buried somewhere in the printshop. <br> <br>Both books have been composed by Fred and Bertha Goudy in 18 point Kennerley No 1. The other 18 point made was later with long descenders, designated as No 2. <br> <br>I have read that Goudy named the type for Mitchell Kennerley, with the agreement that Kennerley would pay to have the matrices engraved and supplied to Goudy for his further use at his foundry. <br> <br>A little more than a dozen years ago, Dover published the two titles as one book in perfect bound format. It shouldn't be too difficult to find a copy. <br> <br>Both books are slim volumes, topping out at 48 pages or so. I found it amusing and human that in the final six pages or so of The Alphabet, goudy apparently ran out of letters in the cases of Kennerley, and these pages are peppered with wrong fonts (p's and H's I think). I believe he substituted with Garamont or Kennerley No 2. It's been along time since I have come across this book, so I can't recall. Of all the things Goudy detractors could have latched onto this is one that I have never noticed him being taken to task for. <br> <br>Personally I find the imperfection charming and completely understandable. I can imagine that he was under pressure to supply the pages of type to the printer and  had no time to turn on the caster pot to make the necessary sorts. <br> <br>Anyone have a theory? <br> <br>Jim Rimmer</p>
