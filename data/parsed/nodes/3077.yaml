    html: "<p>Since this thread is primarily concerned with \"Californian\", I thought I would mention, if it has not already been done, that Goudy's \"Typologia\" is a master work worth reading. <br> <br>It was written by him as a kind of magnum opus on his method of cutting type, and at the same time concerned with how he went about designing the face for the University. Goudy went through a lot of discussion with the institution, wherein he wished to name the type simply \"University Oldstyle\". The director of the Press thought the name to be too generic, so they settled on \"University of California Oldstyle. It was a bit of a mouthful, but the school wanted to have their name on it. Lanston Monotype did the production work on the type, making matrices for the use of the University. Some years later the type was licensed to Lanston, and they sold it under the name \"Californian\".  <br> <br>The patterns that Gerald Giampa has in his possession are of the lead \"boilerplate\" type, devised by Goudy, and were made by Goudy himself at Deepdene. These are the only full suite of patterns to survive the fire at Deepdene, simply because they were in use by lanston at the time of the fire. <br> <br>The book is well worth having for more than one good reason. It shows Goudy's approach to a design, his method of rendering the design in metal, and his philosophy of type and design. <br> <br>There are more than one page of large showings of the type. All-round this book has a lot to tell the new OR experienced designer, in that it gives an instance where a design is a surprising disappointment. <br> <br>Speaking of disappointments: I lent my signed original copy to a journalist (didn't really know him) about 15 years ago, and haven't seen the bugger or the book since. Goodbye to a fine book and $300. Oh well . . . <br> <br>Jim </p>"
