    html: <p>I am amazed at how quickly this many messages accumulated.  <br> <br>Thank you so much for all your input. I agree with many of the points made here. I find the Berkley more mild mannered than the Californian as well. Californian is very beautiful though and I would love to use it. <br> <br>However, the other quite dominant font in the magazine (though for select display size purposes) is a Didot, so I also have to consider what will work with that. I find I like the Meta but don't have a condensed form, if there is one.  Benton Sans seems to give me lots of options, but it may not be much of a departure from Helvetica Neue. What do you think? <br> <br>What is hardest for me is that I want to bring a different feel to the publication but I can't be radical. Berkeley is viewed favorably, text fit and size work well as it is,  and the rest sort of needs to harmonize.  <br> <br>Sometimes it is is easier to throw everything out and start from scratch, grid and all, but unfortunately I am challenged with small changes.  It is difficult though to make font decisions when you don't have them yet to try out the changes, so all this is very insightful in making my choices. <br> <br>The Goudy Sans again doesn't have a condensed which is very helpful in small column copy, which we do have as well. <br> <br>Thanks, Vern</p>
