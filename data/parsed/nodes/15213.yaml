      <p>Whether it's meant as a mock or a loving gesture is maybe irrelevant. The point is Hrant is an institution. I think it's genius. Knowing that Hrant is capable looking at it and still being unflappable makes me smile. Hrant has proven that he's capable of being as outspoken as he is and also capable of rolling with the jokes that come with that outspoken territory.</p>
      <p>The Hrant/Jakob Nielsen comparison is right on -- though I've never met Nielsen. Jakob Nielsen is in the same boat. Some love him, others love to hate him and he can be the butt of some jokes. But Nielsen has been there, like the bit of irritating sand that makes a pearl possible. Nielsen's set himself up as an expert in that he has strong opinions on everything and he backs it up. You look at Nielsen's work and it can be pretty ugly and gets designers and other UI professionals in a tizzy (me included at times), but you cannot question the fact that his presence on the scene has elevated the discussion and kept the debate on the table in good and productive ways.</p>
    html_clean: |-
