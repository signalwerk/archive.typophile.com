      <p>The <a href="/wiki/AIGA" class="freelinking" rel="nofollow">AIGA</a> just released this bit on appropriation of someone's likeness... It's interesting stuff but it may not apply in Helsinki and clearly the creator of the posters isn't after commercial gain if "commercial gain" means selling the posters. If this is the case, how come politicians' likenesses seem to be fair game?</p>
      <p><strong>Appropriation and exploitation</strong><br>
