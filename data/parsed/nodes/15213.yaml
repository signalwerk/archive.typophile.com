      <p>Man you guys are hip. I myself have no idea what any of this means (and I found out about this yesterday). I've seen the Andre stuff of course, but that's "negative", right? In which case my chances of getting one of those stickers as a memento -even anonymously- are slim... Speaking of anonymity, why is the AtypI story so?</p>
      <p>BTW, the mock shirt could have been done by another party, as a reaction. "Shram" is indeed strange; the classic "Rant" would have been better. Being called Paparazzi though is quite common - it's the first thing some people (especially those not sufficiently exposed to foreign names) think of; my sister used to be called that all the time by a male coworker - but in that case it was a term of endearment. Didn't work though.</p>
      <p>&gt; Is there a possibility that there is another person named Hrant in the world.</p>
      <p>Yeah, and some of them actually have talent, like that 'oud player. Except he's blind, so he would've missed the joke.</p>
      <p>&gt; pro-Wrestler</p>
      <p>Makes sense I guess. Except I don't get paid.</p>
      <p>&gt; <a href="http://www.obeygiant.com/main_new.php?page=articles" title="http://www.obeygiant.com/main_new.php?page=articles">http://www.obeygiant.com/main_new.php?page=articles</a></p>
      <p>Thanks. This makes it sound kinda nice. Except the mess it leaves.<br>
      Plus we don't know if the people who did this were thinking that.</p>
      <p>&gt; I’ve even seen a Jakob Nielsen ‘obey’</p>
      <p>Euw. That seals it then.</p>
      <p>Oh, and most of all: did they <cite>have</cite> to use Helvetica? That's just uncalled for.</p>
      <p>hhp</p>
