      <p>The whole "…has a posse" thing is a reference to the cult art movement that began at RISD in Providence c. 1990 that is now Obey Giant. The original stickers has a picture of the then pro-Wrestler Andre the Giant, this the text, "Andre the Giant has a Posse."</p>
      <p>The "movement's" site is <a href="http://www.obeygiant.com" title="http://www.obeygiant.com">http://www.obeygiant.com</a></p>
      <p>Their story is at: <a href="http://www.obeygiant.com/main_new.php?page=articles" title="http://www.obeygiant.com/main_new.php?page=articles">http://www.obeygiant.com/main_new.php?page=articles</a></p>
