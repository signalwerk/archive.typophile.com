    html: |-
      <p>The text does say "the first <em>significant</em> printed book in the West"... I'm not saying that <a href="http://en.wikipedia.org/wiki/Ars_grammatica" rel="nofollow">a survey of Latin grammar</a> is more or less significant than the Christian bible, mind you, but the journalist seems to have done her research. :-)</p>
      <p>If someone were to ask me which of these two books has had more influence in Western history, I would have to say it was the Christian bible. Not to mention the fact that thanks to Gutenberg it could be mechanically reproduced. That changed things, too.</p>
