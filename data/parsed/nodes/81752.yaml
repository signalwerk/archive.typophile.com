      <p>That style of 'a', along with the circular 'C' are characteristic of a kind of geometric typefaces of which the most known is Futura. The serifs on 'I', 'i' and 'l' (and the narrow 'm') are typical of monospaced fonts.<br>
      Unfortunately, the monospaced version of Futura I found (<a href="http://www.fontmenu.com/site/_Normafixed.html">http://www.fontmenu.com/site/_Normafixed.html</a>) isn’t the right one.</p>
      <p>But it could be Avant Garde Mono (<a href="http://www.fontshop.com/fonts/singles/elsnerflake/itc_avant_garde_mono_tu_bold/">http://www.fontshop.com/fonts/singles/elsnerflake/itc_avant_garde_mono_t...</a>)</p>
      <p>or one of the others mentioned in this older thread: <a href="http://typophile.com/node/80582">http://typophile.com/node/80582</a></p>
