      <p>Thanks for the suggestion Chris, and I see what you mean. I thought maybe it was Typ1451 - it has the right a's, but the i's are wrong. Replica and Replica Mono also look close, but have the wrong a. I like the Lineto style though.</p>
      <p>Here's what I've figured out by staring at lots of possibilities (I'm no typeface expert!). The a's make this typeface pretty distinctive - this style seems to be used much more commonly in italics. That big sweeping round C on the beginning also stands out. Then there are the serifs on the I, i and l, and the shape of the apostrophe. It's a funny old mix, when I try to dissect it.</p>
    html_clean: |-
