    date_raw: 5 Mar 2009 — 3:06pm
    votes: null
    html: |-
      <p>James, you make a good point. Certainly the users of this forum would likely have such a tool installed. Which is why I hope to solicit some feedback from such power users. </p>
      <p>Though from my informal survey of colleagues, there are plenty of designers who have not licensed a font management application and might appreciate a free alternative. I think that a web-based version has the potential to offer some community resources and statistics that are uncommon in standalone applications. Thanks for the comment, James. </p>
      <p>Any other feedback?</p>
