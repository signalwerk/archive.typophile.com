    html: |-
      <p>Renko, Thanks for the feedback. </p>
      <p>The application will store your fonts and settings from separate computers into your catalog, but will only display those fonts which are installed on your current system. As of this writing it will not render fonts that are not installed, in short because that would require an enormous library of font files on the server.</p>
      <p>I am aware of the tag window sizing issue and a fix should be online within a few days. </p>
      <p>Great idea on selecting more than one font. I'll look into the Museo rendering.</p>
