    <p>I recently launched an online font viewer application <a href="http://www.myfontbook.com" title="www.myfontbook.com">www.myfontbook.com</a> and I am interested in feedback from the design community. All ideas and criticisms are welcome.</p>
    <p><a class="freelinking external" href="http://www.myfontbook.com" rel="nofollow">http://www.myfontbook.com</a></p>
    <p>Thanks,</p>
    <p>Jeremy</p>
