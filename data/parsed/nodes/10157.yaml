    html: "<p>Thanks for doing that! <br> <br>That's actually less convincing than I expected... Some things (like the extremely important \"the\") are much improved, but some places the decisions are suspect*. That \"ru\" in the 12-optical for example makes me think that there's something to Nick's observation about a \"problem\" with serif fonts. Overall, an improvement I'd say, but not as much as I expected. <br> <br>* It's especially interesting to note the cases where the kerning decision is of <i>opposite</i> sign! <br> <br>Something else though: I think there's a problem with your rendering. Look at the \"iam\" (first word) in the 12-optical and the 48-optical: the positive pair is smaller in the 48, but the gap looks much bigger... <br> <br>Maybe we need a PDF? <br>(And if you did a convert-to-outlines you'd still be legal.) <br> <br>hhp</p>"
    html_clean: "<p>Thanks for doing that! <br> <br>That's actually less convincing than I expected... Some things (like the extremely important \"the\") are much improved, but some places the decisions are suspect*. That \"ru\" in the 12-optical for example makes me think that there's something to Nick's observation about a \"problem\" with serif fonts. Overall, an improvement I'd say, but not as much as I expected. <br> <br>* It's especially interesting to note the cases where the kerning decision is of <i>opposite</i> sign! <br> <br>Something else though: I think there's a problem with your rendering. Look at the \"iam\" (first word) in the 12-optical and the 48-optical: the positive pair is smaller in the 48, but the gap looks much bigger... <br> <br>Maybe we need a PDF? <br>(And if you did a convert-to-outlines you'd still be legal.) <br> <br>hhp</p>"
