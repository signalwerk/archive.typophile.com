    html: "<p>&gt; the predominant action 'optical kerning' takes is tightening. <br> <br>Incorrect. The spacing is depending on point size, with smaller sizes generally getting <i>loosened</i>, which is of course what's required. I've actually graphed the algorithm's behavior, and it's \"bilinear\": a straight line between 4 and 12 point, another (shallower) straight line between 12 and 72, and no [further] change below 4 and above 72. <br> <br>That said, it's probable that <i>overall</i> InDesign's algorigthm tightens more than loosens, but I would think that's due to most fonts being spaced too loosely (it's easier that way, after all). <br> <br>&gt; May I suggest that you simply track negatively instead? <br> <br>No, because that ignores \"boundary conditions\", like the right side of the \"r\". Fooling with the tracking is a brute-force approach that's generally much worse than what InDesign would do. <br> <br>One problem with InDesign's algorithm though: if you apply tracking to text that has optical spacing enabled, the tracking is still applied \"blindly\", leading to the boundary issues above; I think it would have been much better to take the opportunity to apply the tracking adjustment as a \"recommendation\" to the optical algorithm to change its parameters. But maybe there are performance issues (which is why I think the alogirthm is bilinear and not outright smooth). <br> <br>&gt; Unless it is just a shareware cockup <br> <br>There's a difference between a font with good forms but lousy spacing, and a font that's good in both. There are very many fonts in the former category (probably because most people in type design are aesthetically competent but analytically lacking) and these are the ones that benefit most from InDesign. <br> <br>&gt; Analyzing white space has been tried by a <br>&gt; hundred programs a hundred times, and just <br>&gt; doesn't work <br> <br>It hasn't been done to the point of matching a good human spacer, I agree, but it's really the only way you <i>could</i> get close to it! Balancing the white space, after all, is the whole point of this; stems are circumstancial, a shadow of the true solution. <br> <br>The reason it hasn't been done yet isn't that it's not possible, it's that there's not enough money in the field to finance a serious effort to completion. Many people who have given up wouldn't have if we paid them enough. But then we have people like Raph, so all is not lost. <br> <br>&gt; Can you provide us with some examples in which <br>&gt; you can consistently show that 'optical kerning'  <br>&gt; actually performs well? <br> <br>You can easily do it yourself, like with Mrs Eaves (which is no shareware font). And that way your denial has a chance -albeit a tiny one- of being cast off. If anybody else did it, you would simply fabricate deeper diversions. I know you Bill. <br> <br>-- <br> <br>&gt; My conclusion was that .... <br> <br>Tellingly, you were the only one to come to <br>that conclusion, if I remember correctly. <br> <br>And is it a coincidence that you're also an Adobe-hater? <br>Every opinion anybody presents has to be put in the broader context of what that individual wants from his life, has to be \"filtered\" to extract anything useful out of it, sometimes filtered quite heavily. <br> <br>About Bill for example, this hit me just yesterday: he's the \"Da Vinci Code\" of the type scene. Full of interesting rumors and insights, but a whole bound together with a self-centered, sensationalistic opportunism that can make him dangerously misleading. I guess you could say that Bill himself is a tool that's difficult to use well! <br> <br>hhp</p>"
