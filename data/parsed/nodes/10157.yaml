    html: "<p>Laura: Glad to be of help. <br> <br>DeWitt, <br> <br>I was going to say that you'd have to wait for the next generation of technology after OpenType for that kind of capability. But then it occurred to me that OpenType's table structure and capacity to handle new, arbitrary tables in the future without harming existing functionality means that we could do this in OpenType 2.0. <br> <br>We just have to figure out how to put physical instantiation into a table. Also, the cost of arbitrary fabrication systems capable of building physical objects based on computer-based instructions needs to come down. But they only cost $20K today (according to a recent piece in The Economist), so if we apply price reduction at rates equivalent to Moore's Law (improbable, but just for fun)... mmm, in about 13.5 years arbitrary fabs will cost about $40 so every computer will have one. Then you could just have a new OpenType table that contains instructions for building stuff, and have it build the thing that goes and gets your drink from the fridge. <br> <br>So, if you're willing to wait until late 2018, no problemo! <br> <br>Cheers, <br> <br>T</p>"
