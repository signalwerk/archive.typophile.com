    date_raw: 7 Apr 2005 — 11:20am
    votes: null
    html: "<p>&gt;I generally work with a font's built in kerning and then flip on the Optical Spacing for display work and fine tune from there. Often saves a lot of hassle. <br> <br>Well, Stephen, I suspect the reason you see a slight visual improvement is that the predominant action 'optical kerning' takes is tightening. <br> <br>May I suggest that you simply track negatively instead? <br> <br>The problem with 'optical kerning' is that it tightens disproportionately and incorrectly - and when it thinks it has to add space, the results are usually disastrous.  <br> <br>The advantage of using simple negative tracking is that you preserve the correct spatial relationships of the font. (Unless it is just a shareware cockup - in which case, what are you doing using it to start with?)  <br> <br>The profound disadvantage of 'optical kerning' is that it distorts the original spatial relationships of the font in an irrational and unpredictable manner.  <br> <br>It requires only the simplest analysis of any of its suggestions to see where it almost invariably goes wrong. <br> <br>What is really great about the feature, though, is that it makes it so easy to determine exactly where and how it has gone wrong. <br> <br>My position is that it is simply indisputable that the traditional technique for dealing with display sizes - used since phototype - is the best: negative tracking. 'Optical kerning' is a gimmick gone wrong. <br> <br>I know that deeply respected font folk from URW have worked on this intensively, but I believe their work has been in vain, primarily because the program still does not look at actual stems. Analyzing white space has been tried by a hundred programs a hundred times, and just doesn't work. Never has, never will. EvB and JvR tried doing this in a much more sophisticated manner, and ultimately conceded failure. The only thing that is surprising here is the number of worthies that were taken in on this latest occasion. <br> <br>There remains the suspicion that 'optical kerning', though of dubious merit for professional fonts, can be of value for badly spaced shareware fonts. I can't agree. If the program cannot understand a well-spaced font, it cannot understand a badly-spaced font. It seems clear that whatever slight benefit might exist is just due to generalized tightening that could be achieved better with simple tracking. <br> <br>I have yet to see a single documented test which establishes that 'optical kerning' actually understands what it is doing.  <br> <br>But this isn't an issue which needs to be argued theoretically. Arguments for either side can easily be demonstrated by simply mentioning the settings. <br> <br>I have shown that 'optical kerning' will hopelessly mangle the spacing of the word 'jumps' in Adobe Garamond Pro. Can you provide us with some examples in which you can consistently show that 'optical kerning' actually performs well? (Especially when tested against simple negative tracking?) My suspicion is that in at least 95% of cases, 'optical kerning' will make visibly deleterious decisions. And my position is that no program can even begin to know how to space or kern until it is aware of actual stem positions. This, clearly, Kernus/URW/optical kerning cannot accomplish and indeed it is too much to expect, in a WYSYWIG context.</p>"
