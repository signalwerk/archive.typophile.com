    html: "<p>&gt; Let's see what optical kerning does to one of <br>&gt; Adobe's own most recent state-of-the-art fonts <br> <br>No, let's not, because everybody knows nothing can beat a really good human spacer. InDesign's optical spacing wasn't meant to be used only with Adobe's fonts, or Carter's fonts, it was meant to be <i>useful</i> to a lot of people, and most fonts most people use have imperfect spacing. Take Mrs Eaves for example, a font that many people love, to the point that they ignore the font's horrid spacing: InDesign renders Mrs Eaves actually usable. <br> <br>Anybody free of a visceral, burning desire to strike down Adobe at every turn in the berserker rage of a jilted lover (think Glenn Close in Fatal Attraction) can see that InDesign's optical spacing is just another tool, that can be used or misused. It is better than not having it, and that's more than can be said of many things, certainly most fonts! <br> <br>&gt; My faith in designers is greater than that. <br> <br>Faith, shmaith. Most fonts are spaced badly (you of all people should realize and admit this), and InDesign's optical spacing makes them less bad, that's all. A good typographer simply knows when to use it and when not to. Think of it as anti-lock braking on a car: there are more people who need to avoid rear-ending the car in front of them than there are people who need to perform a controlled slide. <br> <br>Crocodile faith. <br> <br>hhp</p>"
