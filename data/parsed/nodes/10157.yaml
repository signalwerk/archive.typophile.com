    votes: null
    html: <p>I dunno, Nick, that's not a very persuasive example, because you found it necessary to add +10 tracking to offset the kerning. Can't you find, somewhere, a combination of letters that optical kerning actually does right? It looks like what you have accomplished here is to use +10 tracking to negate the 'optical kern' between o and r and decrease the metric/optical kern between t and o. Then, both you and Kernus/Indy have chosen to open the tight space between r and t - in fact you have chosen to open it considerably further than Kernus/Indy would have chosen. That is clearly not what the designer(s) of the font would have chosen, but, regardless of its value as a personal choice in setting the word, what possible reason can Indy/Kernus have to offset the intended aesthetics of the font with so much additional white space as an automatic choice? <br> <br>Again, I would like to see some evidence of perfected behaviour here. Setting display type with an auto kerner and then having to add +10 tracking -- which is, let's face it, a drastic corrective -- doesn't make the case. I'm not saying it can't be done, but I await evidence that Kernus/Indy is making rational choices with any consistency. Far be it from me to encourage you to waste more time on this, but can't you come up with something a little better?  <br> <br>Also, Adobe warmly recommends using optical kerning for text and makes no mention that the system should be preferred for display that I can find.</p>
