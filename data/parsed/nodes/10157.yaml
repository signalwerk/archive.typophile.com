    html: "<p>OK, I printed this out, and it seems to make a little bit more sense. <br> <br>What I tried to do is count how many of the decisions seemed good and how many seemed bad. For the 72 point I got 10 good versus 4 bad; but for the 12 point (which I actually observed on-screen, since my printer isn't good enough) it was quite close: 6 good versus 5 bad. It's possible that the PDF suffers from the same type of problem as the previous GIF did, although I personally doubt it. Somebody with a 2400dpi printer might want to try it out and chime in... <br> <br>-- <br> <br>One thing that hasn't been mentioned yet: from what I understand (I think John pointed this out once), the Optical algorithm's decisions depend on the existing spacing; they don't completely over-ride it. I'm not sure if that's true, or why it's true, or how it might work, but it's possible that if a font's existing spacing is <i>really</i> whacked the algorithm doesn't perform as well? Or maybe if a font's spacing is unusually loose (like in Mrs Eaves) the algorithm gets confused? Dunno. <br> <br>hhp</p>"
