    html: "<p>&gt;Bill, in 300 words or less, which errors are those? <br> <br>Here's a preview of an upcoming review: <br> <br>\"Let's see what optical kerning does to one of Adobe's own most recent state-of-the-art fonts, Adobe Garamond OT Pro. Consider the simple word 'jumps' at 12 points. This word sets perfectly and doesn't require any kerning. It has been carefully optimized by Adobe's designer Robert Slimbach to have absolutely perfect spacing at this point size.  <br> <br>Now let's specify Adobe's 'optical' kerning. InDesign subtracts 23 units of space between j and u, adds 14 units between u and m, subtracts 16 units between m and p, and -1 units between p and s. The result is atrocious. The u is now too close to j, and there is a noticeable river of space between u and m. A well-made font has been rendered useless. <br> <br>It's the same story no matter what font or setting you choose. Adobe's 'optical kerning' isn't a feature -- it's a liability. Worse still, it's featured in Illustrator and Photoshop. <br> <br>Adobe has gambled that its target customers will not be able to tell the difference between a professional font rigorously spaced by its original designer, and a complete mess-up spaced by its guesstimator. I don't agree. My faith in designers is greater than that.\"</p>"
    html_clean: "<p>&gt;Bill, in 300 words or less, which errors are those? <br> <br>Here's a preview of an upcoming review: <br> <br>\"Let's see what optical kerning does to one of Adobe's own most recent state-of-the-art fonts, Adobe Garamond OT Pro. Consider the simple word 'jumps' at 12 points. This word sets perfectly and doesn't require any kerning. It has been carefully optimized by Adobe's designer Robert Slimbach to have absolutely perfect spacing at this point size.  <br> <br>Now let's specify Adobe's 'optical' kerning. InDesign subtracts 23 units of space between j and u, adds 14 units between u and m, subtracts 16 units between m and p, and -1 units between p and s. The result is atrocious. The u is now too close to j, and there is a noticeable river of space between u and m. A well-made font has been rendered useless. <br> <br>It's the same story no matter what font or setting you choose. Adobe's 'optical kerning' isn't a feature -- it's a liability. Worse still, it's featured in Illustrator and Photoshop. <br> <br>Adobe has gambled that its target customers will not be able to tell the difference between a professional font rigorously spaced by its original designer, and a complete mess-up spaced by its guesstimator. I don't agree. My faith in designers is greater than that.\"</p>"
  - id: 64464
