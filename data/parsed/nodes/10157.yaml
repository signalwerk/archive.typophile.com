    html: <p>Thomas, <br> <br>First, I believe that you're underestimating the exponential rate of growth of Moore's Law in today's ever-shrinking world of computer literates. Many institutions like MIT are spreading the technology to create such fonts into the nether regions of this tiny planet. And with nanotechnology--the line between analog and digital is being shredded faster than the hands of a drunk man feeding a wood. <br> <br>And that's not even factoring the close connection between font designers and programmers and their refrigerators. <br> <br>Heck, it took Adobe 22 years to make CS1 and about 1.5 years to pop out CS 2. That's an 1,466 percent increase.  <br> <br>I fully expect that Creative Suite 3 will be out in about 24.6 days.  <br> <br>So maybe I should wait. (But I'm very bad at waiting, though.) <br> <br>Thanks for keeping us up-to-date, <br>DeWitt <br> <br>PS They must work you like slaves in that place. Interrobang twice for "help me, they've shackled me to my desk and make me type my reports in Comic Sans."</p>
