      <p>From what I understand, it's built on a highly customized install of Drupal, which apparently makes it hard to edit.</p>
      <p>With such a momentous development as web fonts just coming over the horizon, Typophile is becoming a forum for more and more conversations that are literally changing the future of the type industry. With that in mind, some of these requested features – as rinky-dink as they may seem – are perhaps more valuable now than ever.</p>
