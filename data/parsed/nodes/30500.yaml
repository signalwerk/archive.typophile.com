    html: |-
      <p>The Swiss magazine <a href="http://www.dumag.ch/heft.php">«DU»</a> doesn’t use a Palatino, but several versions of Bram de Does’ beautiful <a href="http://www.teff.nl/fonts/lexicon/lexicon.html">Lexicon</a>. If you know German: There has been a thread going on about the subject in the German <a href="http://www.typografie.info/typoforum/viewtopic.php?t=2205&amp;highlight=lexicon">typoforum</a>.</p>
      <p>«DU», or some of the issues anyway, belongs in my opinion to one of the finest magazines ever.</p>
