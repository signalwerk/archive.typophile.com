    html: <p>Very nice. I remember using Quicksand for a big event years ago. The typeface was quite nice but the spacing was very bad. I think I just applied optical kerning to fix that. It's nice to see an update where the kerning has been fixed and a lot of features added. LU could be kerned tighter though. Same goes for HE in the non-unicase SWATCHES.</p>
