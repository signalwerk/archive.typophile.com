    html: <p>Niche typeface and specimen, but … what is that lower case ß doing in the word DECIBEL? A word in lower case would be more appropriate to show how ß matches the lower case letters. Also note that ‘Afrikaan’ is correctly written as ‘Afrikaans’. Some of the round letterforms in the italic seem to tilt more than the others. ‘c’ looks all right, but ‘o’ tilts too kick I think.</p>
