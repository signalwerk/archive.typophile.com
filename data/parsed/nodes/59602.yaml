      <p>Randy, in cases where using a different user account solves a problem one has with an app, the culprit can be found in corrupt/damaged preferences.<br>
      Another way to test this is dragging the preferencefile (.plist) to the desktop and restarting the app in question.<br>
      For my main apps I routinely make backups of the preference files when everything functions well (because setting up these can be quite a hassle) — or, since the introduction of Time Machine, as a shortcut reinstating the oldest plist available. (The first method is better, of course)</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
