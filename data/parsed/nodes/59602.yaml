      <p>In this context a tip for users of the Windows version of FontLab, but maybe there is a comparable way on the Mac:</p>
      <p>1. Install the app.<br>
      2. Install all macros, you need.<br>
      3. Reduce the three main directories, that FontLab uses, to the installation directory; put them together! (Correct the paths in the options dialog of FontLab.)<br>
      4. Export the registry keys, in which the paths are stored and create a reg file, that removes all the rest, FontLab has stored in your registry.<br>
      5. Make a backup of the FontLab installation directory.</p>
      <p>If you have trouble next time, you have your backup and your reg file.</p>
      <p>Additionally export your favorite options from the options dialog of FontLab. That’s likewise a reg file.</p>
      <p>I have two backups: One with and one without macros.</p>
