      <p>Try removing your Workspace file, a lot of the settings for menus and palettes seem to be stored in there. I've had some similar trouble in the past and I believe this is what worked.</p>
      <p>Your workspace file is here:</p>
      <p><code>Macintosh HD : Users : [your user name] : Library : Application Support : Studio 5 : Workspaces</code></p>
      <p>Hope that helps...<br>
      Andy</p>
