    <p>I've contacted tech support, but am in a crunch so I'll post here to see if someone has seen and fixed this.</p>
    <p>Two days ago, my copy of FL5 went berserk. It launches, but all the palettes are missing as well as the main menu at the top. The only main menu item is Fontlab Studio and there is no "open" "save" etc. Only the standard Show Hide Quit that comes with OSX. I access the app from another user on the same machine, and the menu is there, and it appears to work, but saving and generating fonts doesn't work (this is the full version of FL mind you).</p>
    <p>I've deleted the app. Downloaded a fresh copy, installed with my serial and still have the same problem.</p>
    <p>So I'm thinking something might have happened with python. I didn't do anything strange to start this (eg. didn't install a new macro or something).</p>
    <p>At the moment I'm limping along on a laptop from 2001 so any help would be much appreciated!</p>
