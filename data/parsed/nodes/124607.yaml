      <p>The first US edition of George Orwell’s Animal Farm paired Kabel with Electra (to good effect, I think):<br><a href="http://fontsinuse.com/uses/4237/animal-farm-by-george-orwell-1st-us-edition">http://fontsinuse.com/uses/4237/animal-farm-by-george-orwell-1st-us-edition</a><br><a href="http://www.myfonts.com/fonts/linotype/electra/">http://www.myfonts.com/fonts/linotype/electra/</a></p>
      <p>Some other suggestion for serifs in a similar vein:<br><a href="http://www.myfonts.com/fonts/linotype/fairfield/">http://www.myfonts.com/fonts/linotype/fairfield/</a><br><a href="http://www.myfonts.com/fonts/type-together/abril/">http://www.myfonts.com/fonts/type-together/abril/</a><br><a href="http://www.myfonts.com/fonts/linotype/new-caledonia/">http://www.myfonts.com/fonts/linotype/new-caledonia/</a></p>
      <p>I’ve also seen Kabel paired with Franklin Gothic more than once, but in those instances Kabel was the text face, and Franklin Gothic the headline:<br><a href="http://www.myfonts.com/fonts/linotype/franklin-gothic/">http://www.myfonts.com/fonts/linotype/franklin-gothic/</a></p>
      <p>I’m sure other posters can recommend more....</p>
