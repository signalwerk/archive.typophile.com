      <p></p><div class="imageWrap"><img src="http://typophile.com/files/KabelRocky_4243.jpg"></div><br>
      Rolf, this is a rough approximation of what was done, using a screen capture of a modern digital Kabel Heavy and compressing the width to 75%. In the 1975 headline, some characters (for example, the <strong>O</strong>) are more compressed than others, but since headlines set on a Visual Graphics Phototypositor were manually imaged one character at a time, it would have been possible for someone to adjust the width of the characters individually. There are some differences between the modern digital version and the sample (the stroke ends on <strong>C</strong> and <strong>S</strong>, the bowls on <strong>R</strong> and <strong>P</strong>, the apostrophe), but those may be variations between the old Photolettering design and the new digital design.<br>
      I’m sorry but I don’t know any more about the source of the headline in the documentary.<p></p>
