    html: <p>The headline refers to Vice President Nelson Rockefeller, who in November of 1975 chose not to run for reelection as President Gerald Ford's running mate in the 1976 US presidential election. (Ronald Reagan was governor of California from 1967 to 1975, and he ran against Ford in the 1976 Republican primaries.) Oh, and the font is Kabel Heavy, horizontally compressed. In 1975, it was most likely done in Photolettering.</p>
