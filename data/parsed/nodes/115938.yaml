      <p>Thank you Mojo. I thought of Kabel, because of the "R", "C" and "E". But "Y", "S" and "e" look quite different to Kabel Heavy. Kabel Black has similar proportions in "S" and "Y". Does anyone know of a special version of Kabel Heavy?</p>
      <p>Since you know the political context of the headline, maybe you know as well the newspaper that used the font? I took the screenshot from Errol Morris documentary "The unknonwn known" where he often layers microfilm headlines over the images. There are more passages where the font can be seen, so i assume they must have taken them from a quite bit national/international newspaper.</p>
      <p>Dpane, which duplicate do you mean? The entry on <a href="http://typophile.com/node/3673" title="http://typophile.com/node/3673">http://typophile.com/node/3673</a> that goes to Tempo? I cannot see the original image, plus Tempo seems not right either.</p>
