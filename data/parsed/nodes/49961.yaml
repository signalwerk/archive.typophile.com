      <p>TK,</p>
      <p>Perhaps you should see what other investment groups use for their identity. Think about what kind of message their type choices communicate and use this research as a baseline for exploring what typeface would work best for your mother's company. </p>
      <p>I don't really have any suggestions because right now the design problem is fairly vague - an investment company that doesn't appear to have a niche (what are they focused on investing in? who are they trying to serve?), I don't know what kind of audience they're looking for (who's going to use them? and why?), and I certainly don't know the people behind this company. </p>
      <p>Defining or answering these questions may help you have a better idea of what kind of typeface you're looking for - and then I might be able to help you more.</p>
