      <p>TK, you might want to start by asking yourself "is anything that's free have any quality?" The same question could be asked about your services to them as a client. (Edit: Yes, there are many free typefaces out there that have lots of quality!)</p>
      <p>If they're serious about investing (and business in general), then they'll surely understand that investing in a quality typeface will get them much further than a free one.</p>
      <p>As far as suggestions go: It would be hard for anyone to know what typeface is suitable for their company, without having a deep understand for their business goals and their customers goals.</p>
      <p>Get to know them, and get to know type. I recommend reading Ellen Lupton's Thinking with Type: <a href="http://www.papress.com/thinkingwithtype/" title="http://www.papress.com/thinkingwithtype/">http://www.papress.com/thinkingwithtype/</a> You can probably grab a copy from your local library (which would be free). It's an easy read, with plenty of food for thought.</p>
