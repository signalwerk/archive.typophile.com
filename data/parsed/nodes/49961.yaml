      <p>TK, the advice to do some homework so that you are equipped to make these types of decisions on your own is sound. It's what will make you a serviceable designer, leave alone great for the time being. </p>
      <p>Having said that, here is a little (general) advice based on experience:<br>
      Investment firms and law firms are two of the most conservative categories of client you will come across. They often look to convey trustworthiness and a penchant for winning with their communications. Friendliness and client focus are secondary elements to these types of brands. Contrast that with a personal banking service, who prefer to appear helpful and approachable. Investment and law firms are hired to be bulldogs. Typically, you want austere, conservative and traditional imagery that doesn't shout. </p>
      <p>But only your mother and her partner can say if the above is appropriate to their business.</p>
      <p>As for free fonts, have a look at Fontin Sans by Jos Buivenga.</p>
