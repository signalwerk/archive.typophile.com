    html: |-
      <p>Trebuchet is very much an individual style. It is hard to match it up to another sanserif-style font. But if you are determined, try Gill Sans Light. It is of the artdeco style and might be what you are looking for. But, it only works mildly with Trebuchet Bold as long as it is of a smaller, lighter type size. It is not perfect, but works to some degree.</p>
      <p>Personally, I would suggest a different type style for the fashion font. Two sans-like fonts don't always work well together. I would prefer a beutiful sans as the head, and a light, elegant serif as the tail.</p>
    html_clean: |-
