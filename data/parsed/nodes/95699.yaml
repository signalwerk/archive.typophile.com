    <p>Introducing our latest font family called "Vezus".<br>
    Includes Light, Regular, Bold and Black weights.</p>
    <p>You can get Light weight for free from one of those links:<br>
    <a href="http://www.fontsquirrel.com/fonts/vezus" title="http://www.fontsquirrel.com/fonts/vezus">http://www.fontsquirrel.com/fonts/vezus</a><br>
