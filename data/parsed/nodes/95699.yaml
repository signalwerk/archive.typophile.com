    <p>Introducing our latest font family called "Vezus".<br>
    Includes Light, Regular, Bold and Black weights.</p>
    <p>You can get Light weight for free from one of those links:<br><a href="http://www.fontsquirrel.com/fonts/vezus">http://www.fontsquirrel.com/fonts/vezus</a><br><a href="http://www.tourdefonts.com/VezusLight.zip">http://www.tourdefonts.com/VezusLight.zip</a></p>
    <p>Find out more on:<br><a href="http://www.tourdefonts.com/font-catalog/vezus/">http://www.tourdefonts.com/font-catalog/vezus/</a></p>
    <p><img src="/sites/default/files/old-images/typophile_Vezus_Poster1_5138.png"><br><img src="/sites/default/files/old-images/typophile_Vezus_Poster2_4542.png"><br><img src="/sites/default/files/old-images/typophile_Vezus_Poster3_5516.png"><br><img src="/sites/default/files/old-images/typophile_Vezus_Poster4_4399.png"><br><img src="/sites/default/files/old-images/typophile_Vezus_Poster5_5445.png"><br><img src="/sites/default/files/old-images/typophile_Vezus_Poster6_5338.png"></p>
    <p>Available from (during the week in most of the shops):</p>
