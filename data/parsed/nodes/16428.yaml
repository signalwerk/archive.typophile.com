    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 24.Nov.2005 10.24am </div>
      <p>November 24, 2005<br>
    Malmö , Sweden</p>
    <p>Yes it’s true ? new fonts from Fountain<br>
    It took a while to update the site. But we’ve been busy starting our<br>
    own publishing company – Bruhn Förlag – so that we can be able to release<br>
    our own books and catalogues. Read more about it below.<br>
    Some of you may have seen these new typefaces pre-released through<br>
    Veer, but now’s finally the time to release them on our own site. With this<br>
    release we also give a warm welcome two new designers - Thomas Crolla<br>
    and Ricardo Santos.</p>
    <p>Scrixel 8 &amp; 16 - a script pixel family in two different sizes. Besides<br>
    a set of alternates and bolds it also features a massive collection of<br>
    decorative elements and arrows. More than you need for your<br>
    webdesigning jobs. Optimized for use in Macromedia Flash. Designed by Thomas<br>
    Crolla.</p>
    <p><a href="http://www.fountain.nu/catalogue/scrixel.asp" title="http://www.fountain.nu/catalogue/scrixel.asp">http://www.fountain.nu/catalogue/scrixel.asp</a></p>
    <p>Lisboa - a typeface tribute to the Portuguese capitol . Lisboa is a<br>
    huge family (63 weights). It features a large complement of ligatures,<br>
    lining and old-style figures, expert characters, arrows, brackets, and<br>
    symbols.This modern humanist sans serif contains a lot of warmth.<br>
    Designed by Ricardo Santos.</p>
    <p><a href="http://www.fountain.nu/catalogue/lisboa.asp" title="http://www.fountain.nu/catalogue/lisboa.asp">http://www.fountain.nu/catalogue/lisboa.asp</a></p>
    <p>Gretel - inspired by old antique cross-stitch patterns. An embroidery<br>
    typeface family at it’s best. Gretel also come swith a set of homegrown<br>
    dingbats.. A typeface to match your mullet.<br>
    Designed by Sylvia and Daniel Janssen.</p>
    <p><a href="http://www.fountain.nu/catalogue/gretel.asp" title="http://www.fountain.nu/catalogue/gretel.asp">http://www.fountain.nu/catalogue/gretel.asp</a></p>
    <p>Incognito - after the popular Zanzibar we give you yet another script<br>
    font designed by Gábor Kóthay. Inspired by old maps and sea charts it<br>
    offers a variation of charaters beyond your most romatic type dreams.</p>
    <p><a href="http://www.fountain.nu/catalogue/incognito.asp" title="http://www.fountain.nu/catalogue/incognito.asp">http://www.fountain.nu/catalogue/incognito.asp</a></p>
    <p>Bruhn Förlag/Bruhn Publishing - is a little publisher dedicated to<br>
    produce books about type &amp; design, childrens books &amp; graphic novels.</p>
    <p>Our first release was Lotta Bruhn’s childrens book<br>
    “Prickigkorvmackatjuven”, secondly the type booklet “URGENT! The Messages” designed by<br>
    Peter Bruhn. Which is not just a type specimen but also acounter-attack on<br>
    the heap of SPAM attacking us each day.</p>
    <p><a href="http://www.fountain.nu/fountaineer/urgentbooklet.asp" title="http://www.fountain.nu/fountaineer/urgentbooklet.asp">http://www.fountain.nu/fountaineer/urgentbooklet.asp</a></p>
    <p>The Bruhn Förlag website is due to be online next week.</p>
    <p><a href="http://www.bruhnforlag.se/" title="http://www.bruhnforlag.se/">http://www.bruhnforlag.se/</a></p>
    <p>Simma lugnt!</p>
    <p>Peter Bruhn, principal designer &amp; owner<br>
    [Fountain]</p>
