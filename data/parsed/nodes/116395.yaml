    html: |-
      <p>It looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=Riesling%20-%20Regular&amp;fid=fd70966b8c5653bd491c8dcb21ad3149&amp;fsize=60&amp;text=The%20dog%20house&amp;fit=1" rel="nofollow">Riesling</a></strong> created for Bright Ideas magazine.<br>
      Note that although this font is offered for download by dafont.com there are comments like the following which indicates this is not a free font and  you should be extra careful if you want to acquire a legitimate license for a commercial project:</p>
      <blockquote><p>Bright Ideas Magazine<br>
      50USD/month, edited by "Bright Ideas". Bright Ideas is produced under the direction of Creative Director Gail Conwell.<br>
      These fonts were not free.</p></blockquote>
      <p>You can also use the following similar font:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Nick-Curtis&amp;ffam=Mighty%20Ditey%20NF%20-%20Regular&amp;fid=30f739cdc8b571983a6bc7395eddf7e8&amp;fsize=60&amp;text=The%20dog%20house&amp;fit=1" rel="nofollow">Mighty Ditey NF</a></strong> by Nick Curtis [2007]</p>
