    html: <p>Indeed a very cute font and specially cute with the colors you have shown in the preview. As one of the cute quotes by William S. Burroughs states -  cuteness is delineated by what it is not. Perhaps this would make a good font for my quotations website <a href="http://cutequotesandsayings.com" title="http://cutequotesandsayings.com">http://cutequotesandsayings.com</a> . However I am concerned about the readability and load time. This is definitely a cute font to write couple of important head lines or quotes on a flyer.</p>
