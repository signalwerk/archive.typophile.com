  html: |-
    <p>We have been having a debate on the proper representation of Ellipsis. Our proofreader says there should be a space before and after.</p>
    <p>Example:<br>
    ... and the train left the station ...</p>
    <p>When doing a call out or in general typesetting, this space bugs me. I'm trying to find a reference stating that this rule doesn't stand for typesetting (like 2 spaces after a period in essays!)</p>
