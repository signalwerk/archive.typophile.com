  html: <p>The American Nickel is having the back side of it being redesigned for release next year. It has two designs and I find one offensive. There is the boat Lewis and Clark used during their explorations (ho hum) but the other design that has a white person shaking the hand of an indian while the type mentions the Louisiana Purchase makes me gag. Wasn't after that purchase the first of the indian wars began where the US Government systematicly stold the lands of the Indians. Shake their hand and then imprision them for the riches of the west. </p>
