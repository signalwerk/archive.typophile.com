    html: <p>Well, OK, you asked for it. <br> <br>Quite frankly, I think the "politically correct" thought process demonstrates condescension towards those people whom the ethos ostensibly defends. It all boils down to some weird left-over Enlightenment duality idea that non-Westerners are some sort of receptacles for Western culture -- good or bad -- rather than being people with their own motivations and foibles. <br> <br>If Native Americans want to object to the way they are depicted in American culture, rock on. I support their right to express their opinion. I may not necessarily share that opinion, or support their movement, but I support their right to speak up. <br> <br>What gets my goat is when people try to make political points by painting one group or another as being a victim. The Aztecs weren't victims, they were the meanest bastards on the continent. Native Americans weren't some special people. They were just people. Wanna-be social scientists concocting a myth of Native Americans as being some sort of noble savages is, in my opinion, a form of condescension. <br> <br>Do people complain about the Mongols murdering and raping their way through Europe and the Middle East? Or about the Franks conquering the Anglo Saxons? The Moors invading Iberia? No, because respect is involved. Two cultures meet. One is hungrier than the other, more desperate, more greedy, whatever. They fight. One wins. <br> <br>The PC mindset doesn't allow for this. It elevates victimhood to be almost desirable. But in doing so it insults the people it supposedly defends. <br> <br>What I sensed in Dan's post was the knee-jerk, PC middle class Sociology 101 pissing and moaning that its practitioners think is showing respect for this other culture, but really is the exact opposite. <br> <br>And Steve, don't pretend for one second you have respect for my opinion. You have already labeled me blinkered, which is the same as ignorant. So -- because I have a different opinion than you, I'm ignorant? </p>
