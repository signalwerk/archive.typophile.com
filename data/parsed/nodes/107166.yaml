      <p>Don't know if it's a type or not. What I know is it was designed by illustrator <a class="freelinking external" href="http://ffffound.com/image/1b7f795cf18674637221936c4e1990f8153ba6ed" rel="nofollow">Craig Redman</a> of <a class="freelinking external" href="http://www.craigandkarl.com" rel="nofollow">Craig &amp; Karl</a> aka <a class="freelinking external" href="http://www.darceldisappoints.com" rel="nofollow">Darcel Disappoints!</a>. Could be a custom lettering.<br>
      Same vein: <a class="freelinking external" href="http://www.dafont.com/a-la-nage.font" rel="nofollow">A la Nage</a>, <a class="freelinking external" href="http://processtypefoundry.com/fonts/fig" rel="nofollow">Fig</a>, <a class="freelinking external" href="http://www.t26.com/fonts/824-Goodnight" rel="nofollow">Goodnight</a>, <a class="freelinking external" href="http://www.virusfonts.com/fonts/echelon" rel="nofollow">Echelon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/twiggy8520/unremitting" rel="nofollow">Unremitting</a>, <a class="freelinking external" href="http://www.identifont.com/show?1B8" rel="nofollow">Expletive Script</a>, <a class="freelinking external" href="http://www.dafont.com/herrliches-script.font" rel="nofollow">Herrliches Script</a>, <a class="freelinking external" href="http://www.dafont.com/digital-kauno.font" rel="nofollow">Digital Kauno</a>, <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Script+Fonts/Easyscript/" rel="nofollow">Easyscript</a>, <a class="freelinking external" href="http://www.dafont.com/zebra-110.font" rel="nofollow">Zebra</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fenotype/november-script" rel="nofollow">November Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/geometry-script-pro" rel="nofollow">Geometry Script</a></p>
