  html: '<p>Dear friends, <br> <br>can you please critique this logo for me? <br> <br><img src="http://www.typophile.com/forums/messages/29/42864.gif" alt="World Wide Art Logo"> <br> <br>It is for an art gallery. The shape is meant to reflect the three characteristics of the gallery: art (brush stroke), global outreach (globe), modernity (@ sign); also, the letters WWA are somehow meant to be in there! <br>comments welcome! <br> <br>Greetings, <br>s</p>'
