    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Tools" class="freelinking" rel="nofollow">Tools</a>: <a href="/wiki/Type%20Design%20Tools" class="freelinking" rel="nofollow">Type Design Tools</a> : Ikarus</strong></p>
    <p>Ikarus, by Peter Karow and others of <a href="/wiki/URW" class="freelinking" rel="nofollow">URW</a>, is one of the most important historical font formats and font editing tools. In its heyday, it was the primary tool foundries used to digitize their libraries of metal and photo type. Today, <a href="/wiki/Dutch%20Type%20Library" class="freelinking" rel="nofollow">Dutch Type Library</a> offers <a href="http://www.fontmaster.nl/english/IkarusMaster.html" rel="nofollow">IkarusMaster</a> as part of their <a href="/wiki/FontMaster" class="freelinking" rel="nofollow">FontMaster</a> suite of tools.</p>
    <p>Ikarus had many technical strengths, including <a href="/wiki/Interpolation" class="freelinking" rel="nofollow">Interpolation</a>, very high resolution, and a spline primitive edited using on-curve points, unlike the Beziers popular today, which also depend on off-curve control points.</p>
