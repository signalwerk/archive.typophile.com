    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>: <a href="/node/12212/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Tools</a>: <a href="/node/add/wiki?edit%5Btitle%5D=Type%20Design%20Tools" title="Create node &quot;Type Design Tools&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Type Design Tools</a>&nbsp;:&nbsp;Ikarus</strong></p>
    <p>Ikarus, by Peter Karow and others of <a href="/node/14085/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">URW</span></a>, is one of the most important historical font formats and font editing tools. In its heyday, it was the primary tool foundries used to digitize their libraries of metal and photo type. Today, <a href="/node/21212/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Dutch Type Library</a> offers <a href="http://www.fontmaster.nl/english/IkarusMaster.html" class="link-external">IkarusMaster</a> as part of their <a href="/node/add/wiki?edit%5Btitle%5D=FontMaster" title="Create node &quot;FontMaster&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">FontMaster</a> suite of&nbsp;tools.</p>
    <p>Ikarus had many technical strengths, including <a href="/node/add/wiki?edit%5Btitle%5D=Interpolation" title="Create node &quot;Interpolation&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Interpolation</a>, very high resolution, and a spline primitive edited using on-curve points, unlike the Beziers popular today, which also depend on off-curve control&nbsp;points.</p>
