      <p>so...</p>
      <p>I redid the uppercase, based on a more geometric construction, and it turned out better. The only problems are still with the diagonals (VWXY) and the way they match their lowercase versions. I've turned some straight angles into curves, and it helped a bit, but I'm not sure if that's the way to go</p>
      <p>I've adjusted the 't' and the 'f'. I've did a few changes to the 'r', and even made an alternate version, but I'm having mixed feelings about it. Also, the koch-style 'g' turned out great!</p>
      <p>Anyway, thanks a lot for the tips!</p>
