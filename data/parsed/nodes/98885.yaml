    <p>Greetings,<br>
    I've been developing this typeface for the past month, and I've got to a point where I'm feeling kind of blocked, so I thought it would be a good idea to come here for some help. I'm happy with the lowercase, although I'm sure you'll find lots of problems with it (problems which I'd be more than happy correcting, by the way), the main issue I'm having is with the uppercase; due to its geometric construction some letters (E,F,I,T,L,H mainly) aren't quite fitting with the curviness of the other ones.<br>
    I've made a really quick pdf with the first sentences that came to mind (feel free to ask for more material if you need it for a better judgement!), and I'd be really glad to hear the criticism of better trained eyes (and hands).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2012-12-12 at 21_5014.27.43 .png"></div><br>
    Thanks in advance!<p></p>
