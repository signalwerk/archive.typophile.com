      <p>Thanks hrant! I'll work on those suggestions and let you see it as soon as I'm done!</p>
      <p>I know the uppercase neep a lot of work, and that was the main reason I came here... but I'm still a bit lost with them, right now the direction that seems best is making them more geometrical, which might make them not that cool when using along with the lowercase but can make them look alright amongst each other.</p>
      <p>Anyway, thanks a lot again!</p>
