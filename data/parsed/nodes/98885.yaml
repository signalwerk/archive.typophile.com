  - id: 534497
    user: 1250
    date: 2012-12-18T14:49:00
    date_raw: 18 Dec 2012 — 2:49pm
    votes: null
    html: |-
      <p>I like it! Some great shapes in there. And I don't see anything essentially wrong with it.</p>
      <p>The caps though need more thought - I think you might be trying too hard there. And some of the whitespaces (like between the "um") are pretty bad - try to break those up.</p>
      <p>Some specifics:<br>
      - The top of the "f" is malformed.<br>
      - Maybe the tittles should be flat ovals?<br>
      - Try a Koch-style "g".<br>
      - The "r" is too stiff.<br>
      - The "t" is too narrow.<br>
      - I don't think the "z" is in character. Maybe descend it.<br>
      - Could you curve the tail of the "Q" gently <em>downward</em> instead?</p>
      <p>hhp</p>
