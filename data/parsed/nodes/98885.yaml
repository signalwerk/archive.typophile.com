      <p>That "g" is a baby-face!  :-)<br>
      But Christian might be right about the cut.</p>
      <p>The counters of "O"/"o" are too small.</p>
      <p>The UC is much better, but it still needs work. And I still worry about the "Q" being too stylized.</p>
      <p>The overshoot amount (and some other things too BTW) depends on what point size you're shooting for.</p>
