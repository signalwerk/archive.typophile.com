    <p>Hello!</p>
    <p>B&amp;P Typefoundry is proud to present and distribute Romain BP by Ian Party.</p>
    <p>Based on the Commission Jeaugeon’s models and on Philippe Grandjean’s classic character, the Romain BP celebrates the marriage of geometric rationality and elegance, of science and craftsmanship. </p>
    <p>The Romain BP Text is actually closer to the Commission’s model than Grandjean’s Romain du Roi. It is more synthetic in its structure, more radical, and thus, more modern. It is a contemporary text typeface based on a structure that was created in 1690, not a revival mimicking Greandjean’s shapes. It is an attempt to imagine the aesthetic choices we should be making in the modern day, based on the universal theoretical model. </p>
    <p>The Romain BP Headline is a complementary font, which, free of text constraints, fully exploits the amazing graphic potential of the original model. </p>
    <p>more informations on our website</p>
    <p>You can download our free trial version to test the font on your own computer.</p>
    <p><a href="http://www.bpfoundry.com">www.bpfoundry.com</a></p>
