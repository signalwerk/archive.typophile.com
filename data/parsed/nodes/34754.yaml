      <p>if you look to the old model you can see that there is no real slanted roman. the choice was difficult and this one is a pure design choice who (i think) fit better with the "roman construction", if you go on BP website you can read more about some of my choices. In a few month i will release two other typefaces around Romain du Roi, one based on Nicolas Jarry calligraphy, and one based on the type in church book of early begging of the 17 century, and then a book about the 17 century french typefaces "the origin of the circle shape". this book will finish my work around the Romain du Roi construction. in between BP will release other typefaces based on old french model</p>
      <p>ian</p>
