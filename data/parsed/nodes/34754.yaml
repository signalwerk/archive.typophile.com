      <p>From what I remember there were <em>three</em> distinct italics, although the "official" and/or "production" status of each is still open to discussion; and one of them was in fact a slanted Roman (even though it seems to have never been cut).</p>
      <p>&gt; BP will release other typefaces based on old french model</p>
      <p>BTW, are you familiar with the late-19th-century work of the Deberny foundry? I'm actually working (although at a snail's pace) on a revival from that period.</p>
      <p>hhp</p>
