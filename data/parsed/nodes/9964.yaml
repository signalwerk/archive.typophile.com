  html: <p>Hey guys and gals, <br> <br>Does anyone know of any digital versions of typefaces similiar to this. I've found a half dozen in old spec books and signage books and baseball logos and such but nothing in a font. I am absoultely sure its out there. Please forgive me, I don't tink I've been too lazy on this one. Any help would be greatly appreciated. <img src="http://www.typophile.com/forums/messages/83/6818.jpg" alt="Wood Type">  <br>This image is actually a screen shot from a collage in one of THS's Beast mag.</p>
