    <p>I haven't be able to find a comprehensive review of Avenir Next online. Has anyone used it in a design project juicy enough to give it a run down vs. the old Avenir?</p>
    <p>On screen via the website (not the best test I know),<br>
     * the jump from UltraLight to Regular seems extreme (with no Light in between)<br>
     * the Heavy (which looks much heavier than Avenir Black), seems to have lost a little neutrality of personality, esp. in the lowercase</p>
    <p>The small caps and new italics sound nice, but without the choice to buy individual weights, it seems pretty scary to drop USD 1200 on an update that almost seems more geared towards print designers (where the new weight distribution, condensed and s.c. probably come in handy). (I design mostly websites). </p>
    <p>Any impressions would be appreciated.</p>
