      <p>We used it to rebrand a drug called Prevacid. The previous firm had let the typography standards get blown to bits, so we eventually decided that the only salvageable equity was to be found in some previous work that used Avenir. And Avenir Next had just been released, so the timing was terrific.</p>
      <p>Once we got the thumbs up to proceed with Avenir Next, we used it across a wide variety of materials: sales aids, magazine ads, coupons, etc. </p>
      <p>Because we were developing materials for pharmaceuticals, we needed a robust type family that would allow us options across these materials, especially when the "fine print" was involved. Having Avenir Next's condensed weights at our disposal was key to aiding our efforts.</p>
