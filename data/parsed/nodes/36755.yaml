      <p>This thread is long gone, but now that the <a href="http://www.amazon.com/Adrian-Frutiger-Typefaces-Complete-Works/dp/3764385812/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1245685524&amp;sr=8-1">book on Frutiger's typefaces</a> has been released, that is almost certainly the best source of information on Avenir (and says a good amount about Avenir Next).</p>
      <p>Some of the fascinating revelations as related by Frutiger are that he meticulously worked each letter to make optical adjustments as minimal as possible, he approved of Avenir Next (calling it "so perfect," though he would not have approved of the project if the market demand for a broader selection of weights had not existed), and it was his proudest achievement as a type designer.</p>
      <p> "<em>Univers</em> was a striking idea, as was <em>Frutiger,</em> but in <em>Avenir</em> there's a harmony that's much more subtle than in the others. When a letter shape really works, when you can say 'that's it' -- that really is a joy. And the joy is greater with <em>Avenir</em> than with <em>Univers.</em> ... The quality of the draughtsmanship in <em>Avenir</em> -- rather than the intellectual idea behind it -- is my masterpiece. To draw in all those nuances, so fine that you can hardly see them, but you know they're there, that really sapped my strength. It was the hardest typeface that I have worked on in my life. ... I'm proud I was able to create <em>Avenir.</em>"</p>
