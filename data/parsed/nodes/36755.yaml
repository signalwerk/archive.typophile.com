      <p>Hmm, I wish I had that brochure! </p>
      <p>I think the lack of online information about Avenir Next highlights a need for more online marketing prowess by type foundries. Some are of course doing this really well, but there is a lot of room for improvement. </p>
      <p>Playing the role of the selfish consumer, why should I fly to an expensive design conference to get sales materials for a product I might buy several times a year for the rest of my career? Shouldn't the seller bring this info to me where I am? Online test-drives and pdf specimens are a start, but might not be enough to push a lot of designers over the edge to purchase the font. </p>
      <p>For a redesign like Avenir Next, just a few hours in Photoshop could produce informative graphics that show what's changed and why it's an improvement. A simple online gallery could house hundreds of photos of the font being put to the test in actual design work (Underware does a great job with this), with little effort from the foundry (after the initial web development).</p>
      <p>Don't mean to sound preachy, but as a fan and consumer of type, I see a lot of potential to make buying type feel less like a leap of faith and more like a confident, informed decision.</p>
