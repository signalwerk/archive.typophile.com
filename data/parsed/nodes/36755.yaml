      <p>&gt;What i wanna know is, do Avenir Next condensed weights match the 6 weights, i know from Avenir. Perfect would be that the condensed weights of Avenir Next would work properly with Avenir (“the impression of ONE face”)&lt;</p>
      <p>No. Avenir Next Condensed matches Avenir Next.</p>
      <p>Dan, sorry, type was incredibly expensive in 1988. While the hostility? :(<br>
      Much of the type was still created by hand at Linotype back then (hand drawings were made, which were then hand digitized). Dozens of people worked on the design of a single font. Very expensive, and not at all like today.</p>
      <p>Even if it was not that much more expensive to create a real italic than an oblique, Frutiger thought that it was. And it is the thought that counts ;-)</p>
      <p>Plus, a designers intentions change over time. Hermann Zapf is directly involved in the design of his fonts, even the new ones…&nbsp;character by character. Some of the decisions he makes now might be different from those of 40 years ago, or even 15 years ago. Everyone learns with experience, even the best. They just keep getting better, I guess. Who knows?</p>
