      <p>We do not have a PDF available at the moment, but quite a lot of this is discussed in the Avenir Next brochure, which we give away at most design conferences we attend.</p>
      <p>Dan, creating individual fonts used to be very expensive, much more than it is today. Frutiger used obliques to save money. This was a big deal back in the day, especially when one remembers that Frutiger designed a lot of big families. Now that font production can be done by one or two people instead of 100 or 200 people, the situation has changed. Note that Avenir Next also has small caps and oldstyle figures (AF was directly involved in the OsF design, as can be seen in the brochure).</p>
