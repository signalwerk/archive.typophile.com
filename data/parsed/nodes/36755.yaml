      <p>Though this is actually not about Avenir Next, but about Frutiger Next, it yet might be of interest as it sheds some light on the question of Adrian Frutiger’s attitude towards ‘real italics’:</p>
      <p>Jürgen Siebert wrote on August 24, 2005 [<a href="http://www.fontshop.de/fontblog/C420185419/E1442013706/index.html">Fontblog.de</a>]:<br><cite>Bei den Kursiven sprang Frutiger über seinen Schatten – oder wurde er geschubst? Die Fachwelt kennt seine Vorliebe für technisch schräg gestellte Sansserifs, die er auch bei der Überarbeitung der Univers durchgesetzt hatte. Doch bei der Frutiger Next ließ er sich zu einer klassischen Kursiven überreden, mit eigenen Formen für a, g und f. Keine Frage: der Frutiger Next steht dieses Ideal einer Kursiven ausgezeichnet.</cite></p>
      <p><cite>Regarding the italics, Frutiger swallowed his pride –&nbsp;or was he gently pushed? His preference for technically slanted sans-serifs is well known among experts, and he asserted this position when Univers was revised, too. However, with Frutiger Next he was talked into classic italics, with proper forms for a, g and f.  No doubt about it: This ideal of an italic perfectly suits Frutiger Next.</cite></p>
      <p>Ingo Preuß also wrote about Frutiger Next on <a href="http://www.typeforum.de/news_254.htm">Typeforum.de</a> and added a reply he received from Bruno Steinert, then director of Linotype, dated on February 23, 2006:</p>
      <p><cite>Die Idee zur Frutiger Next enstand in einem Gespräch zwischen Herrn Frutiger, unserem damaligen künstlerischen Leiter, Herrn Professor Reinhard Haus, unserem Marketing-Leiter Otmar Hoefer und mir als Geschäftsführer der Linotype.  […] das Konzept einer echten Kursiv und der neuen Formen für die Buchstaben “a“ und “f“ kam von unserem Marketing.</cite></p>
      <p><cite>The idea for Frutiger Next arose during a talk Mr. Frutiger had with our then art director Prof. Reinhard Haus, our marketing director Otmar Hoefer and me as the CEO of Linotype. […] the concept for real italics and new designs of the letters ‘a’ and ‘f’ is penned by our marketing.</cite></p>
      <p>[Translation by me, no guarantee for 100% correct phrasing]</p>
    html_clean: |-
