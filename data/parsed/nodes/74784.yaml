  html: |-
    <p>I did release Penabico, my new script font. The work was hard, and not finished yet, since I will make many updates and corrections along the next months. Thanks so much for the comments and advices, in the last weeks, here in Typophile, and other places, concerning my doubts while did make Penabico. So, thanks to Adam Twardoch, Arno Enslin, Buggy, Cristobal Henestrosa, Eili Lindoe (test-user for scandinavian languages), Frode Frank, Gunlaugur Se Brien, Igor Freiberger, Isac (IsacoType), John Hudson, Khaled Hosny, Luc Devroye, Manish Soni, Nick Shinn, Ralf Herman, riccard0, Sigurður Ármannsson, Stephen Coles, Thomas Phinney, quadibloc, and others which I dont remember now.</p>
    <p>The font is here</p>
    <p><a href="http://new.myfonts.com/fonts/intellecta/penabico/" title="http://new.myfonts.com/fonts/intellecta/penabico/">http://new.myfonts.com/fonts/intellecta/penabico/</a></p>
    <p>However, I appreciate critics, which will be used to increase the font, with updates.</p>
    <p>Paulo W<br>
    Intellecta Design</p>
