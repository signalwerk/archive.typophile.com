    html: |-
      <p>Well, it could develop into something very interesting (and big, what about abbreviations? ;-)!<br>
      I will do some research. Do you have some suggestion on how many and what kind of words do you prefer?<br>
      Here are some, off the top of my head:<br>
      Carissima (Dearest, to a female recipient)<br>
      Carissimo (Dearest, to a male recipient)<br>
      R.S.V.P. (please respond, very formal, actually French, but used in Italy too)<br>
      S.P.M. (Sue Proprie Mani, [to be delivered only to] his/her own hands)<br>
      Invito (Invitation)<br>
      matrimonio (wedding)</p>
      <p>I hope that other Italian-speaking users will chime in with their suggestions.</p>
