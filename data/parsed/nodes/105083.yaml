      <p>Another Tuscan with <a class="freelinking external" href="http://www.myfonts.com/search/tag%3A%22Detroit+serif%22" rel="nofollow">Detroit serifs</a> I can't indentify... Some alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/batak-condensed-itc" rel="nofollow">Batak</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/fairplex-ot" rel="nofollow">Fairplex</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/dickinson.php" rel="nofollow">Dickinson</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/vanilla-whale" rel="nofollow">Vanilla Whale</a> (probably the closest, needs to be squooshed and /R leg redrawn (from /P?))<br>
      Your best chance is probably to ask directly the designer. BTW, what's your sample origin?</p>
