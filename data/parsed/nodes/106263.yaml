      <p>If you're talking about <a class="freelinking external link-external" href="http://www.businessreviewusa.com/money_matters/NeimanMarcus.jpg" rel="nofollow">Neiman Marcus main woodmark</a>, I don't think it's a font, rather a custom lettering.<br>
