    html: <p>If you're talking about <a href="http://www.businessreviewusa.com/money_matters/NeimanMarcus.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neiman Marcus main woodmark</a>, I don't think it's a font, rather a custom lettering.<br><a href="http://www.myfonts.com/WhatTheFont/forum/case/28229" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eyehawk@MF WhatTheFontForum</a> suggested to start with "... <a href="http://www.artandsignstudio.com/snapper.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Snapper Script A&amp;S</a>, straightened it out, and scaled it up vertically, and it looked like it might work."</p>
    html_clean: <p>If you're talking about <a href="http://www.businessreviewusa.com/money_matters/NeimanMarcus.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Neiman Marcus main woodmark</a>, I don't think it's a font, rather a custom lettering.<br><a href="http://www.myfonts.com/WhatTheFont/forum/case/28229" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Eyehawk@MF WhatTheFontForum</a> suggested to start with "... <a href="http://www.artandsignstudio.com/snapper.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">Snapper Script A&amp;S</a>, straightened it out, and scaled it up vertically, and it looked like it might work."</p>
