    html: |-
      <p>If you're talking about <a class="freelinking external" href="http://www.businessreviewusa.com/money_matters/NeimanMarcus.jpg" rel="nofollow">Neiman Marcus main woodmark</a>, I don't think it's a font, rather a custom lettering.<br>
      <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/28229" rel="nofollow">Eyehawk@MF WhatTheFontForum</a> suggested to start with "... <a class="freelinking external" href="http://www.artandsignstudio.com/snapper.html" rel="nofollow">Snapper Script A&amp;S</a>, straightened it out, and scaled it up vertically, and it looked like it might work."</p>
