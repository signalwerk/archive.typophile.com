      <p>I think that this way your work will be more economically and more interestingly displayed, maybe the stroke of the grid could be less strong. I think it would be ok to have at least a single plain view of each work, so the viewer can have some orientation about what he is seeing in the grid.</p>
      <p>From your previous sample I liked the clean layout and I think that now the tag is too big, a bit noisy. Maybe the upper right clear space is fine to fit the tag in.</p>
      <p>Héctor</p>
