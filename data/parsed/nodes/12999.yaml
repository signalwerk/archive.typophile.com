  html: |-
    <p>Hey everybody, I went the simple route with this.  Got good advice from Armin on my previous post. Just want to see if anyone had a suggestion or two. It’s not done. Interview is Wednesday, want to get early just to make sure nothings screwy.</p>
    <p>My main concern right now is page 11 of the pdf. Dont know how thats working. I dont have the original files, all I have is pics, and the book. Also, I know you’re only supposed to put 10-12 of your best pieces in your book. I’m presenting in letter format, and I have at least 2 projects ( books ) with more than 1  spread each, and thats pushing my page count up.</p>
    <p>Pages 3-10. any ideas on how to narrow this down?</p>
    <p>Thanks</p>
    <p>Eric</p>
