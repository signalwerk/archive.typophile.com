    <p>When tabular figures go bad:</p>
    <p><a href="https://web.archive.org/web/20080828043356/http://www.flickr.com/photos/stewf/171104884/" title="Photo Sharing"></a></p><div class="imageWrap"><a href="https://web.archive.org/web/20080828043356/http://www.flickr.com/photos/stewf/171104884/" title="Photo Sharing"><img src="/web/20080828043356im_/http://www.typophile.com/files/171104884_a5c9abbdb4_6571.jpg"></a></div><p></p>
    <p>Was reading the otherwise beautifully typeset <a href="https://web.archive.org/web/20080828043356/http://www.amazon.com/gp/redirect.html?link_code=ur2&amp;tag=typographica-20&amp;camp=1789&amp;creative=9325&amp;location=http%3A%2F%2Fwww.amazon.com%2Fgp%2Fproduct%2F156898572X">“Drosscape”</a> the other day and then — whoops — it looks like <a href="https://web.archive.org/web/20080828043356/http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/light/?refby=typographica">some versions of Akzidenz Grotesk</a> have a kerned ’7’ when I assume they meant the figures to be tabular. At least I think that’s what went wrong. Any other theories?</p>
