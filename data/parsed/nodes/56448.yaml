      <p>I would suggest "Lines," a book by Tim Ingold. This book is not written for a design audience -- it's geared towards anthropologists, but is written for a general audience. This will give you zero specific information about handlettering in 20th century America, but it will give you a broader picture of how the living gesture of the human hand has been replaced with a static and unmoving "concept holder" in modern typography.</p>
      <p>The other book I would recommend is "The Stroke," by Gerrit Noordzij. Again, this has nothing to do with commercial handlettering in 20th century America, but provides a good base for understanding the relationship of lettering and type.</p>
    html_clean: |-
