    <p>Hi guys, </p>
    <p>I'm just about to start doing research for my BA Graphic Design dissertation/thesis at Central St Martins in London. My topic as of now is "The Evolution of American Hand Lettering In the 20th Century" - this will probably change as I go along. It's an incredibly broad topic, and I want to narrow it down at some point, but I would like to determine my direction according to my research. As a starting point, I have picked out the following books and essays:</p>
    <p>American Type Design and Designers<br>
    by David Consuegra</p>
    <p>Handwriting in America: A Cultural History<br>
    by Tamara Plakins Thornton</p>
    <p>Script and Scribble: The Rise and Fall of Handwriting<br>
    by Kitty Burns Florey</p>
    <p>An Elegant Hand: The Golden Age of American Penmanship and Calligraphy<br>
    by William E. Henning</p>
    <p>Handwritten: Expressive Lettering in the Digital Age<br>
    by Steven Heller</p>
    <p>Edward Fella: Letters on America<br>
    by Lewis Blackwel</p>
    <p>House Industries<br>
    by House Industries</p>
    <p>American Modernism: Graphic Design, 1920-1960<br>
    by R. Roger Remington</p>
    <p>The Evolution of American Typography (Design Quarterly 148)<br>
    by Mildred Friedman</p>
    <p>The Education of a Typographer<br>
    by Steven Heller </p>
    <p>The Golden Age of Hand Lettering In American Advertinsing<br>
    by Nick Shinn</p>
    <p>American Graphic Design Expression: The Evolution of American Typography"<br>
    by Katherine McCoy</p>
    <p>Now, I haven't bought any of these books yet, as I am unsure if they all "fit" with the topic, and therefore worth spending money on. I am wondering if you guys have any thoughts on the list so far, anything that should be added or subtracted? Is this an OK starting point?</p>
    <p>Thanks!</p>
    <p>Anders</p>
