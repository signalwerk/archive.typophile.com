      <p>In toto these are a very limited overview of hand lettering. </p>
      <p>I would search out Paul Shaw's chronology that he did for the Washington Calligraphers Guild (Scripsit). It is, without a doubt, the most incisive look at both lettering and calligraphy... two very different things. And it is the least agenda driven retrospective.</p>
      <p>It will give you more names than you can search in a lifetime.</p>
      <p>Michael</p>
