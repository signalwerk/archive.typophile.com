      <p>hi,</p>
      <p>i would recommend also looking at traditional engraving styles, initially these were all hand cut, just copied.  later this process was mediated by a machine (pantograph, as it is still today) and then digital.  but the styles were developed over time through the act of engraving.</p>
      <p>look at bergling's books still available through gem city press.  i've always wondered where the originals for this wacky, huge body of work came from.  all i could ever find out was that, according to his obit, he migrated to chicago at the turn of the last century then out to CA for a bit but, supposedly, returned for the white fair, worlds expo in the windy city.  but i am not sure this is accurate.</p>
      <p>anyway, the books are fun and cheap.</p>
      <p>also, there's an illustrator's blog with loads of lettering people on it.  if i can find it i will let you know.</p>
