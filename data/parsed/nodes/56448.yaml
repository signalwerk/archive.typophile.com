    html: "<p>@terminaldesign: I'm curious to know why you think \"The Stroke\" and \"The Elements of Typographic Style\" are useless. I suppose if I put these on a continuum with something like \"The Logo, Font &amp; Lettering Bible,\" one end would be the extreme of theory, and the other end the extreme of practicality. But I think for a research project, just looking at examples of 20th century American type isn't going to lead to any meaningful idea unless there's a lens to view it through.</p>"
