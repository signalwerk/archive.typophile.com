    html: <p>I found <em>The Stroke</em> quite useful, but I had to learn about type design on my own in a city where nobody else was doing it. I can see how it isn’t much use to someone with years of experience, but for a designer working on his first font it’s great to have someone explain exactly why all those intuitive aspects of drawing with a pen can be used to develop, examine, and critique a type design. But James is right—it’s not relevant to this research, at least not enough to justify reading it over something else. A BA thesis just doesn’t offer enough time to read everything—trust me, I went way overboard on the research and everything else I did suffered.</p>
