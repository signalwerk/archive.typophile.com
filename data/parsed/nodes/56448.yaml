    html: <p>I've discussed by opinion of "Elements" at length on Typophile, that thread is probably around somewhere. My opinion of the Stroke is that it is an over-intellectualized analysis. As someone who has learned by doing, at a time when there was no internet and very few resources on type design, I had to come to my own conclusions about things. I just don't find the book useful to me, that's all. Perhaps you find it enlightening.</p>
