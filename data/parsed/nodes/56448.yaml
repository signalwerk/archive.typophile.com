    html: <p>There's very little in your list on commercial lettering, which comes into focus in the Leach book. And commercial lettering was at the centre of the profession, as most large text was hand lettered for the first half of the century at least. That's an awful lot of work in posters, advertising, brochures and packaging, not to mention one-offs such as tickets and show cards. Don't forget greetings cards.</p>
