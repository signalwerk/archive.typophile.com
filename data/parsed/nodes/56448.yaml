      <p>I think your primary challenge will be bridging the content from the early part of the century via printed matter through the online stuff from the 1990s . . .</p>
      <p>You may also consider looking through the Taschen book series of All-American Ads from 1900 through 1980 to observe the 'aesthetic' evolution of hand lettering and its use in commercial advertising as well as its non-printed advertising use . . .</p>
      <p>Your thesis will likely find correlations between era related design trends and the use of hand lettering but while advertisements aren't the end all be all of your thesis, it's likely the best documented . . . You cannot ignore non-advertising sources of hand lettering from showcards through pinstriping through painted billboards and signage and non-commercial lettering such as the evolution of modern calligraphy and the height of lettering at the end of the Century revealed itself in millions of 'scrappers' who took the baton of hand lettering and evolved a new interest and awareness in hand lettering . . .</p>
      <p>You're correct in your initial post that this is a broad topic but nobody has really addressed any lettering that occurred after 1970 so far in the thread specifically and there were a TON of changes just in the last 30 years of the century . . .</p>
      <p>Stuart :D</p>
