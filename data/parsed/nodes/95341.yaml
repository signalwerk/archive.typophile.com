  html: |-
    <p>Hello.<br>
    I've been working with this opentype code for OldStyle Figures.<br>
    But when I try to make the otf file I've got this error.</p>
    <p>This is the code:<br>
    @onum2 = [zero.oldstyle one.oldstyle two.oldstyle three.oldstyle four.oldstyle five.oldstyle six.oldstyle seven.oldstyle eight.oldstyle nine.oldstyle];<br>
    @onum1 = [zero one two three four five six seven eight nine];</p>
    <p>         # Old Style Figures<br>
             feature onum {<br>
                 substitute @onum1 by @onum2;<br>
             } onum;</p>
    <p>The error:<br>
    makeotfexe [FATAL]  invalid token (text was "") [features 23]</p>
    <p>makeotf [Error] Failed to build output font file  tmpyRjUC3.otf.</p>
    <p>Thanks!</p>
