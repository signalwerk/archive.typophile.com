    <p>Hi!</p>
    <p>I'm trying to identify the font used for the words "maid cafe" in the Tomo Neko Maid Cafe logo. I've attached a .png of the logo, but a direct link to a lower-resolution .gif is here: <a href="http://tomoneko.info/wp-content/uploads/2012/01/tomoneko_logo_header_20122.gif">http://tomoneko.info/wp-content/uploads/2012/01/tomoneko_logo_header_201...</a> . This logo was created in 2010-2011.</p>
    <p>I've been told that the only fonts used in the logo were Blippo (which I figured is what was used for "Tomo Neko") and Century Gothic. If it is Century Gothic, then it's been very, very heavily modified. Since I don't have the skills to do anything like that, I'd appreciate it if a substitute font could be recommended.</p>
    <p>Thanks so much!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/TomoNeko_logo.png" width="2178" height="1031" alt="">
