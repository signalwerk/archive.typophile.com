      <p>Patty I recently got a license to Zapfino, the entire suite.* I have to say that the Zapfino we are sick of seeing — used inappropriately most of the time — is not the sum of the face. It really is beautiful and I'd love to see someone, besides Linotype, use it in a way that speaks to this beauty. </p>
      <p>This is just in response to Patty and I'm not sure Zapfino could be a replacement for Bickham as they are two completely different script styles.</p>
      <p>*A preview only copy of the license I should add.</p>
