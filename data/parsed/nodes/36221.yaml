    <p>Hi there, </p>
    <p>My coworkers and I probably overuse Bickham Script because we love the alternate flourishes it provides (besides it being a beautiful typeface). However, I'd like to know if there are any other typefaces out there that have lots of flourishes, etc that you can chose from similar to the way you can in Bickham Script. Does this make sense?</p>
    <p>Thanks!</p>
    <p>Bethany</p>
