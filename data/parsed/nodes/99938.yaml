    <p>I have before me a type specimen book titled, in Russian, <em>Образцы шрифтов фотонаборной машины «Линофильм – Супер – Квик» и 2НФА</em> [“Typeface Samples of the photocomposing machine Linofilm Super-Quick and 2NFA”]. It was issued by Kalinin Printing and Publishing Works [Калининским Полиграфкомбинатом] in 1976.</p>
    <p>The catalogue shows Cyrillic (Russian) and Latin versions of Helvetica, Times, and Excelsior in a very unusual range of point sizes:</p>
    <p>6<br>
    8<br>
    9<br>
    10<br>
    12<br>
    16 (8 × 2)<br>
    18 (9 × 2)<br>
    20 (10 × 2)<br>
    24 (6 × 4 and 12 × 2)<br>
    32 (8 × 4)<br>
    36 (9 × 4)<br>
    40 (10 × 4), and<br>
    48 (12 × 4)</p>
    <p>Does anyone know where those adaptations of Helvetica, Times, and Excelsior had been developed? Was that in the US, Germany, or UK, and when? Any information would be very much appreciated.</p>
