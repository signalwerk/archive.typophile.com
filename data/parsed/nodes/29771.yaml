    <p>Hi , what are your opinions,</p>
    <p>With <strong><a href="http://www.suitcasetype.com/page.php?lmut=en&amp;section=font&amp;font=katarine">Katarine</a> </strong> as an occasional headline font, and to create short bold word’s for impact, which other font for more general use (text, signage) would you choose?</p>
    <p>This is the general direction:<br>
    Slighly humanistic sans serif, with double story ’g’ if poss.</p>
    <p>My suggestions would be:<br>
    ——-</p>
    <p>* <strong>Freight Sans</strong> <a href="http://www.joshuadarden.com/shop/freightsans.php" title="http://www.joshuadarden.com/shop/freightsans.php">http://www.joshuadarden.com/shop/freightsans.php</a></p>
    <p>* <strong>Mundo Sans</strong> <a href="http://www.fonts.com/findfonts/detail.htm?pid=403346" title="http://www.fonts.com/findfonts/detail.htm?pid=403346">http://www.fonts.com/findfonts/detail.htm?pid=403346</a><br>
    (although very nice, much picier than Freight)</p>
    <p>* <strong>Vista Sans</strong> <a href="http://www.emigre.com/EF.php?fid=200" title="http://www.emigre.com/EF.php?fid=200">http://www.emigre.com/EF.php?fid=200</a></p>
    <p>* <strong>Vecta</strong> <a href="http://www.myfonts.com/fonts/wilton/vecta/" title="http://www.myfonts.com/fonts/wilton/vecta/">http://www.myfonts.com/fonts/wilton/vecta/</a><br>
    (doesn’t seem to be very flexible in therms of features) </p>
    <p>* <strong>Agenda</strong> <a href="http://www.fontbureau.com/fonts/Agenda" title="http://www.fontbureau.com/fonts/Agenda">http://www.fontbureau.com/fonts/Agenda</a></p>
    <p>Also a factor would be the level of value for money (e.g. Opentype with different figure styles prefered to Postscript with ordinary character palette).</p>
    <p>I’m really looking for thhe main typeface along those lines, and <a href="http://www.suitcasetype.com/page.php?lmut=en&amp;section=font&amp;font=katarine">Katarine</a> will be used to liven things up on occasions.</p>
    <p>Thanks for sharing your thoughts.</p>
