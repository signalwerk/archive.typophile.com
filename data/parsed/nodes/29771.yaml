      <p>Muj,</p>
      <p>If you can wait a few weeks, Mundo Sans Pro will be available soon. It will probably seem even pricier, but all 7 weights, both Roman and Italic, have small caps, CE language support, superior and inferior figs, numerators and denominators, Lining and Oldstyle figs both tabular and proportional, even monetary symbols to match the OSFs. Plus the OT features to support all these extra glyphs.</p>
      <p>I’ve been caught here saying “soon” about Mundo Pro, but it really is finished, produced and just waiting to be released. </p>
      <p>Not to hype it too much, but Mundo was designed for wide general use; it is readable and clear in small sizes, and in fact the bolder weights were based on handpainted signage. Useful at any size (with appropriate tracking of course) and available in 7 weights.</p>
