    <p><em>02-24-07 So now it's been determined this is Hindi</em></p>
    <p>So this is the first time I've been asked to do design work in Arabic. This is to be inlaid in mother of pearl on the ebony fingerboard at the first fret position. I'm told this translates to "beloved." The final size is rather small, an area about 1.5" x 1.0"</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JL_inlay_4671.jpg"></div><p></p>
    <p>What I'm looking for is font suggestions to start off the design, and once I've got it adapted for shell cutting, I'd appreciate a review to make sure I don't wind up chaging the meaning or making something that isn't even a word. </p>
    <p>A while back I received some great advice for another <a href="http://www.alembic.com/info/fc_kay.html" rel="nofollow">inlay project</a>, which I really appreciated.</p>
