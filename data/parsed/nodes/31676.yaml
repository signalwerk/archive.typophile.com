    html: |-
      <p>The intaglio word in the picture shown above is spelled "bhakti" and does not exactly mean "beloved", but more precisely "love" (or devotion etc.) in Hindi.</p>
      <p>If it were Sanskrit, the word would have a so-called visarga (which looks like a colon or two dots) at the end of the word and would look this way</p>
      <p><a href="http://www.sanskritweb.net/temporary/bhakti.pdf" title="http://www.sanskritweb.net/temporary/bhakti.pdf">http://www.sanskritweb.net/temporary/bhakti.pdf</a></p>
      <p>As regards fonts, you can start at my website with Itranslator 2003 software which can also be used with any other Devanagari Unicode fonts. Such other fonts are listed in my documentation</p>
      <p><a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="http://www.sanskritweb.net/itrans/itmanual2003.pdf">http://www.sanskritweb.net/itrans/itmanual2003.pdf</a> (page 44 seq.)</p>
