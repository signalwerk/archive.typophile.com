    <p>Often here on Typophile’s Critique forums are presented some beautiful typefaces.<br>
    As it happens, some of them gather a good deal of attention, while others will receive just a comment or two.<br>
    What I very rarely have seen happening is the designer coming back to the thread announcing the release of the font.<br>
    That said, here’s a short chronological list of fonts I would really like to see released in my lifetime:</p>
    <ul>
    <li>
    Tierra Nueva, by Sebastian Nagel * RELEASED! (see first comment by Jens)<br>
    <a href="http://typophile.com/node/15535" title="http://typophile.com/node/15535">http://typophile.com/node/15535</a>
    </li>
    <li>
    Epiphany, by Oleg Macujev<br>
    <a href="http://typophile.com/node/47571" title="http://typophile.com/node/47571">http://typophile.com/node/47571</a>
    </li>
    <li>
    Ernestine, by Nina Stössinger<br>
    <a href="http://typophile.com/node/50670" title="http://typophile.com/node/50670">http://typophile.com/node/50670</a>
    </li>
    <li>
    Ambicase Modern, by Craig Eliason<br>
    <a href="http://typophile.com/node/60316" title="http://typophile.com/node/60316">http://typophile.com/node/60316</a>
    </li>
    </ul>
    <p>And, while to my knowledge it wasn’t ever submitted for critique, I would add the regular guest of the Type ID Board:</p>
    <ul>
    <li>
    Noir, by Frode Helland<br>
    <a href="http://typophile.com/node/62447" title="http://typophile.com/node/62447">http://typophile.com/node/62447</a>
    </li>
    </ul>
