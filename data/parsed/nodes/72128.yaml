      <p>The mention of Ernestine in this thread reminds me... while a Latin character set in Arek is yet to be made available, somehow I remember seeing in recent web searches something that resembled what I would expect it to look like...</p>
      <p>EDIT: A web search has convinced me that I am mistaken. Even though I did find something that almost looks like Arek in the Latin alphabet: Alice, designed by another typographer who came from the same educational institution... and thus at almost the same time and place.</p>
      <p><a class="freelinking external" href="http://typemedia09.com/index.php?/graduates/marta-bernstein/" rel="nofollow">http://typemedia09.com/index.php?/graduates/marta-bernstein/</a><br>
