    html: "<p> Bj, <br> <br>This is fun, F-U-N. Some small suggestions: <br> <br>1 - On some glyphs (B,D,F) the black backing  <br>takes the form of a shadow while on others  <br>(A,C,E) there is no break in form, creating a 3D  <br>shape. I would seek consistency. Personally, I  <br>prefer the 3D, because it requires more time and  <br>perfection of craft, but perhaps that wasn't the  <br>direction you wanted to go. <br> <br>2 - Is there a version without the shadow? <br> <br>3 - How about adding alternates with enclosed  <br>counters that aren't filled? <br> <br>Stephen </p>"
