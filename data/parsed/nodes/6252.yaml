    html: <p> Thanks for the feeback Stephen and Ricardo. Stephen, I like your suggestion to make consistent the shadows on A,C,E. I think I will revise those. Yes, there is a version without the shadows. This originally was named Meek Gothic. The idea was to have a playful font that could never hurt anyone - no angles or points or serifs, just lazy curves. And no dark shadows. But plain, it was TOO MEEK. I changed the name b/c I liked the alliteration of Geek Gothic and the shadows made it no longer meek. I am working on alternates. Because there is only one case, I am filling in with the opposite case (the A, E, etc.) Also, letters that have quirks (the phallic I, the cross J, the one-armed Y) will have 'normal' alternates. <br> <br>I'll also use unfilled counters as alternates, good suggestion Stephen! <br> <br>thank you. I'll post some more stuff later this week. <br> <br> <br>bj harvey </p>
