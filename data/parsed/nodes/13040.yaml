      <p>Mike</p>
      <p>I spent a bit of time (far too much) going through whatever East European stuff I have (as well as all the usual sources). Looking specifically for a similar flag on the lowercase r. The DeRoos does not match nor any other. The r appears to have a bit of calligraphic grace to it but it must be an anomaly in reproduction (which is why I asked about letterpress and the possibility of ink distortion).</p>
      <p>There is a very strange mix of typographic study/specimen book titled  Typo graphia &amp;/2 (done for ITC in 1981) by Oldrich Hlavsa and Karel Wick that oddly includes (as a matter of pride I suspect) a large number of Czech type faces not normally seen by western eyes. But I was unable to pinpoint the typeface in question. Likely I am seeing something on that r that is not there.</p>
      <p>Gerald</p>
