      <p><em>"Golden Cockerel?"</em></p>
      <p>Hrant, I forgot to mention that one, but from the posted sample and the samples of Golden Cockerel, there seem to be very few similar characters. </p>
      <p>I would have to agree with Gerald. By a process of elimination, and assuming that the budget of academics for exotic typefaces is non-existent, a web freeware font is as good a guess as any.  However, there is too much that seems professional about this type, suggesting that some type 'borrowing', and maybe some font editing, created this font. I'm at a loss to identify the possible sources of any specific letters, because there is so little that seems really distinctive besides the flagged 'r'.</p>
      <p>If I had to try to create this, I think I would use Perpetua, so I guess I am agreeing with the Gill camp. The 's' seems similarly flattened, the 'f' seems right, the 'k' is the same style, and it has the stemmed 'U'. I would need to modify the W and the M to make it closer, but the more I look at this, the more I think it IS a version of Perpetua. The Stephenson Blake version shown in Jaspert (p.177) is very close, except for the two letters I mentioned, and the 'y'. Joshua's W is more stepped, and the M is straight-sided, rather than splayed; the 'y' has a serif on the tail, more like the Monotype version.</p>
      <p>My final answer: This is a modified version of Perpetua, possibly one of the 'budget' clone varieties found on the 3,000 fonts for $9.95 CD's.</p>
      <p>- Mike Yanega</p>
