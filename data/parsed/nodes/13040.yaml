      <p>Gerald, I've been writing to the poster, who originally contacted me about this ID, and Joshua told me this was done by a teacher, for his classes, as I mentioned in my last post. It seems unlikely to me that he would have printed this manual of grammar on letterpress.</p>
      <p>I like the 'Eastern European' idea, because none of us seems to know of a match, and "The Fonts of Eastern Europe" would be a book I'd love to see, if there was such a thing -- in other words, that's a big void in my information. The Russian fonts seem very 'derivative' if ParaType is typical. Czech fonts, other than Storm Type are also poorly known to me (sorry if I am forgetting others from here, but Peter Bil'ak, for example, is associated with Dutch type. Others of Czech origin like Ruzicka, Menhart and Licko have done their work in the U.S. or Western Europe, or have been known here through versions of their type published in Western foundries: Fairfield, Primer and Ruzicka Freehand (Ruzicka), Figural, Elysium and Oldrichium [derived from 'Manuskript'] (Menhart). Zuzana Licko, of Emigré, is well known and hard to categorize.) </p>
      <p>The flagged 'r' you mentioned, is also found in the typeface 'DeRoos', by the Dutch designer of that name; and it resembles the 'r' in Bembo somewhat.</p>
      <p>Can you suggest some Eastern European candidates for this font?</p>
      <p>- Mike Yanega</p>
