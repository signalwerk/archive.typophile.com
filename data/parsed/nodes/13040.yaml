      <p>The fonts have a Signum-specific format.  I ran the program inside an Atari emulator (Gemulator) and printed the sample to a PCL file which I then opened with a PCL viewer (OpenPCL).</p>
      <p>Times is indeed similar, as well as <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/old-style-7/" rel="nofollow">Adobe’s Old Style 7</a>.</p>
      <p>Emigre’s Matrix is interesting. Thanks for that hint!</p>
