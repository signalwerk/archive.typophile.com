      <p>Gerald, Joshua had told me that it was no longer possible for him to contact this teacher. That was why he was asking for help identifying the typeface.  I agree that the De Roos 'r' has a different shape, but overall that typeface is still the most similar, for the most characters, that I could find for the typeface. I have nothing that shows 'Gotico Eporedia', but I have a sample of ATF 'Verona' and while it's true that the 'r' has a similar flag, that is almost its only resemblance to the sample text, since it looks like a pen drawn type.</p>
      <p>As Hrant noted Gill has at least one face with a similar 'r' and a stemmed U (<a href="http://www.fonts.com/findfonts/detail.htm?pid=206040" target="new" rel="nofollow">Gill Facia</a>), but the W and many other letters are not very close. His Perpetua isn't much like this font, except for the stemmed U, and none of the other Gill serif faces I know (Pilgrim, Joanna and Solus) has a stemmed U, or a W like the sample type.  Hrant, did you have another Gill candidate to offer?</p>
      <p>- Mike Yanega</p>
