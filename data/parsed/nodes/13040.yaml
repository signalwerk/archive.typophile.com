      <p>This thread is really old now, but some time ago I found out the source of the two searched typefaces, and as I now stumbled over this thread, I thought it would be fair to let you know because of your efforts. Just in case someone cares.</p>
      <p>I found out that my former teacher uses the Atari word processor “Signum”, and I managed to get a copy of it. This program uses bitmap fonts in its own format, and formerly there were several suppliers for Signum fonts. Many of the fonts come in different sizes and resolutions.</p>
      <p>The two fonts used in the shown paper are supplied with the program. The headline font is called “AKZ___13”. Because of the name, I thought it may be modelled after Akzidenz-Grotesk; it is, however, different. (Maybe someone has an idea if there’s a similar typeface which could have served as a model?) A sample is attached.</p>
      <p>The serif font is called “ANTIKR_N”, I attached a sample of it, too. It seems you were right, Mike, and it’s a version of Perpetua. And I like it! I'm fond of these fonts’ rough charm.</p>
      <p>The 3rd and 4th attached image are samples (in the size of 13 and 50 pt.) of another interesting Signum font I like—and couldn’t withhold from you—named “Transitional”. Maybe someone knows if a typeface exists that was its model?</p>
      <p>Best regards, Joshua</p>
      <p><a class="freelinking external" href="http://i50.tinypic.com/2d7slxd.png" rel="nofollow">akz___13.png</a><br>
      <a class="freelinking external" href="http://i49.tinypic.com/307x8q1.png" rel="nofollow">antikr_n.png</a><br>
      <a class="freelinking external" href="http://i46.tinypic.com/71nwk0.png" rel="nofollow">trans_13.png</a><br>
      <a class="freelinking external" href="http://i47.tinypic.com/2z9k1ec.png" rel="nofollow">trans_50.png</a></p>
    html_clean: |-
      <p>This thread is really old now, but some time ago I found out the source of the two searched typefaces, and as I now stumbled over this thread, I thought it would be fair to let you know because of your efforts. Just in case someone cares.</p>
      <p>I found out that my former teacher uses the Atari word processor “Signum”, and I managed to get a copy of it. This program uses bitmap fonts in its own format, and formerly there were several suppliers for Signum fonts. Many of the fonts come in different sizes and resolutions.</p>
      <p>The two fonts used in the shown paper are supplied with the program. The headline font is called “AKZ___13”. Because of the name, I thought it may be modelled after Akzidenz-Grotesk; it is, however, different. (Maybe someone has an idea if there’s a similar typeface which could have served as a model?) A sample is attached.</p>
      <p>The serif font is called “ANTIKR_N”, I attached a sample of it, too. It seems you were right, Mike, and it’s a version of Perpetua. And I like it! I'm fond of these fonts’ rough charm.</p>
      <p>The 3rd and 4th attached image are samples (in the size of 13 and 50 pt.) of another interesting Signum font I like—and couldn’t withhold from you—named “Transitional”. Maybe someone knows if a typeface exists that was its model?</p>
      <p>Best regards, Joshua</p>
      <p><a class="freelinking external link-external" href="http://i50.tinypic.com/2d7slxd.png" rel="nofollow">akz___13.png</a><br>
      <a class="freelinking external link-external" href="http://i49.tinypic.com/307x8q1.png" rel="nofollow">antikr_n.png</a><br>
      <a class="freelinking external link-external" href="http://i46.tinypic.com/71nwk0.png" rel="nofollow">trans_13.png</a><br>
      <a class="freelinking external link-external" href="http://i47.tinypic.com/2z9k1ec.png" rel="nofollow">trans_50.png</a></p>
