      <p>Pretty convinced is completely custom. <a class="freelinking external" href="http://www.anagrama.com/portafolio/161-very" rel="nofollow">Anagrama</a> may have started with a '<a class="freelinking external" href="http://www.myfonts.com/search/tag%3Adidone" rel="nofollow">Didone</a>' but to me, it has been too much modified to positively identify it.<br>
      Here's anyway a list of alternatives needing (more or less) customization: <a class="freelinking external" href="http://www.parachute.gr/typefaces/allfonts/regal-display-pro" rel="nofollow">PF Regal Display</a> Black, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/tiffany" rel="nofollow">ITC Tiffany</a> Black, <a class="freelinking external" href="http://www.myfonts.com/search/caslon+graphique" rel="nofollow">Caslon Graphique</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/positype/lust" rel="nofollow">Lust</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dstype/acta-poster" rel="nofollow">Acta Poster</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/4thfebruary/model-4f" rel="nofollow">4F Model</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/carousel-lt" rel="nofollow">Carousel</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/didoni" rel="nofollow">Didoni</a>, <a class="freelinking external" href="http://commercialtype.com/typefaces/austin/hairline" rel="nofollow">Austin Hairline</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/suomi/grumpy" rel="nofollow">Grumpy</a> Black 99<br>
      Another selection, all "contrated to stencil": <strong><a class="freelinking external" href="http://commercialtype.com/typefaces/dala_floda" rel="nofollow">Dala Floda</a></strong> (my choice mainly redrawing /R leg and /E crossbars), <a class="freelinking external" href="http://www.myfonts.com/fonts/applyinteractive/caslon-fina-stencil/" rel="nofollow">Caslon Fina Stencil</a><strong>, <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/gestalten/sensaway_pro_heavy/" rel="nofollow">Sensaway</a></strong> (good option too)</p>
