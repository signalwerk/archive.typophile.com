      <p><cite>My question is, as it pertains to, say, a EULA that prohibits embedding, is setting static text in a given font and exporting a SWF legally the same as using the embed button on the properties window and exporting a SWF?</cite></p>
      <p>In general: yes.<br>
      In most cases "static text" is the lesser evil, but it is still "embedding".<br>
      Some EULAs are even covering the difference:<br>
      H&amp;FJ EULA: — Vector art (swf) Because Flash files embed actual portions of a font's sourcecode within themselves, our font licenses require that designers observe some basic safety precautions when publishing Flash files. Text in Flash files must be static (not dynamic), the files must embed only a subset of the character set, and the "Protect from Import" option must be enabled when the files are generated.</p>
