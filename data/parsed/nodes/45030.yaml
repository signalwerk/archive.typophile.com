      <p>Eric,<br>
      I've just spent most of the day struggling with making a flash file for a project work across most European languages. During this process I have found that unless I specifically instruct each dynamic textfield to embed, they will not make use of the embedded (range of the) font. So yes, something is at work regarding how the different textfield types either treat the embedded font, or embed the font.</p>
      <p>It's been a while since I did this kind of work in Flash, but I seem to remember just adding a dynamic textfield somewhere in the file and specify the embedding, then all further textfields would have those characters available to them.</p>
      <p>F.</p>
