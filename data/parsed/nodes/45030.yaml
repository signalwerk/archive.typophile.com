  html: |-
    <p>When setting dynamic text in Flash, a button on the properties window allows a user to "embed" outlines for an entire font, or various subsets thereof. This option doesn't exist when setting static text, though in Flash help, under "Font outlines and device fonts", it  says "For static text, Flash creates outlines of the font and embeds them in the SWF file".</p>
    <p>It seems as if there are two different uses of the term "embed" in play here. They are definitely different concepts in Flash authoring, anyway. </p>
    <p>My question is, as it pertains to, say, a EULA that prohibits embedding, is setting static text in a given font and exporting a SWF legally the same as using the embed button on the properties window and exporting a SWF?</p>
