      <p>Thanks. That's pretty much what I thought the answer would be. Hopefully other foundries will update their EULAs in the near future to address specifically some of these vagaries. </p>
      <p>@Fredrik</p>
      <p>I think, as far as I've observed, the embedding of static text operates independent of the embedding available to dynamic text. For example, if I have a static text box that reads "0123456789% Loade", and I have a dynamic preloader set to something like </p>
      <p>loader.text = pctLoaded + "% Loaded"</p>
      <p>Unless I embed those specific characters using the embed feature, it can't draw on the characters embedded automatically via the static text box and will revert to a device font. This is why I thought they were different type of embedding.</p>
