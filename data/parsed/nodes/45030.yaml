      <p>My understanding is that the two instances of embedding you refer to are the same.<br>
      The difference is that when you make a static text field, flash embeds only the outlines of the characters used. While when you use a dynamic text field you have to decide which range of characters should be embedded. This makes sense since the flash cannot know what text you are loading into the textfield. You can see this by generating a size report when publishing the Flash.</p>
