    html: <p>&gt;I'm also wondering about the legalities of using a designer font in a logo, does the client also need to own the font? <br> <br>no. but you should almost never use an existing typeface for a piece of display type, such as a trademark. the client is paying you to produce a piece of unique and ownable type, not trade gothic. it's harder for a company to really own something that 5000 other companies own as well.</p>
  - id: 2202
    user: 1202
    date: 2003-06-18T23:04:00
    date_raw: 18 Jun 2003 — 11:04pm
    votes: null
    html: <p>Agreed for the most part. But, sometimes is about how you use the type that counts. Hand- or computer-lettering is a diminishing skill. Do they even teach it at colleges any more? A lot of graphic designers don't have the eye or the skills for drawing new letterforms. I think basic calligraphy and lettering skills should still be taught at design schools. Graphic designers simply take ready-made type for granted these days with the computer.</p>
  - id: 2203
    user: 1916
    date: 2003-06-18T23:16:00
    date_raw: 18 Jun 2003 — 11:16pm
    votes: null
    html: <p>i agree one hundred percent keith and yes some schools do still teach hand lettering. it was a mandatory part of the curriculum at (dare i say it) art center. it also happens to be the course i teach up here.</p>
  - id: 2204
    user: 1202
