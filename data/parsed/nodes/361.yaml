    date_raw: 18 Jun 2003 — 11:31pm
    votes: null
    html: <p>That's great, Jay. How do you teach it? Do you start with a broad-edge pen? What books do you use? My guess is you use Doyald Young's books. Do you think calligraphy is important to the understanding of letterforms? Do you always start with pencil and paper then digitize with beziers? Do you use historical sources? I'm interested to know as much as possible, as I'm really eager to incorporate it into my type course in September.</p>
  - id: 2205
    user: 1750
    date: 2003-06-18T23:31:00
    date_raw: 18 Jun 2003 — 11:31pm
    votes: null
    html: <p>I have to add my 2 cents on this one.  <br>I agree that it isn't ideal if designing a very type based logo to just choose a font. I wish I had the ability (and time) to design type for clients. and then there is the issue of a client having enough money to have a custom designed font! <br>Instead I focus mostly on symbols which leads to font choices - not a quick decision by any means... <br> <br>As a graphic designer not a type designer - I feel my role is to look through the foundaries and pick the most appropriate font - and to make it quite unlike 5000 other logos that may use that font? which if true, means I probably would not have chosen it... <br>I do wish I could do it all...</p>
  - id: 2206
    user: 1916
    date: 2003-06-19T09:03:00
    date_raw: 19 Jun 2003 — 9:03am
    votes: null
    html: <p>natalija, there was a day when the only efficient way a graphic designer could produce trademark designs was to hand draw them. this was an important skill that designers needed to have. i don't feel it is impossible to be a designer and produce unique display types. i can attest to this in my class as well. each semester i have a random grouping of lower term students who have little or no experience with this stuff. i am always amazed that when shown a few simple procedures their world of typography and their skill in seeing type harmony blossom. through their diligent work i have seen some amazing success stories.</p>
  - id: 2207
    user: 1916
    date: 2003-06-19T09:58:00
    date_raw: 19 Jun 2003 — 9:58am
    votes: null
    html: <p>keith, that's great that you are looking into teaching hand lettering. i think it's an important element to a designers career. it has been a subject that i devote a full term of study to. i can't imagine trying to fit it into a class as a single small project. i've noticed that students don't fully get most of the major principles until about there third project. i'll give you an ultra quick run down of how i teach the subject. <br> <br>1-i present the major differences between display types and text types. i then lay out the playing field, getting into typeface classifications and text types. my hope is to let them see that by drawing display types they are only working on a small section of the subject of type. each project runs for about three class periods. each class is a crit. <br>2-we start breaking right into it. no time to waste the term is fairly short the class is usually full and the subject is large. i give them there first assignment which is to do a set of initials. i start small. <br>3-next assignment is to letter a proper name. this gives them more letterforms they need to deal with. <br>4-last project is to do a made up name of there choosing. this is meant to let them have fun and pursue their own interests. this project also runs parallel with a business papers project utilizing one of the marks they done during the class. <br> <br>all assignments are done on tracing paper at larger size. they do 15-20 comps each time until they narrow in on something successful. finals are either rendered on velum with ink or can be moved on to the computer if their skills are competent enough. it's hard but i have little time to help students by teaching a class on illustrator as well. <br> <br>i don't introduce students to the art of calligraphy or the use of broad nib pens unless their specific project requires it. i love this area of study but feel that one would have to devote a whole term at least to it. <br> <br>as far as books are concerned, i use elements from both "trademarks of excellence" and "fonts and logos". doyald young was an instructor of mine back in school and my class follows his teachings on many levels.</p>
