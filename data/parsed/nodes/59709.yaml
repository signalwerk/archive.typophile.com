    <a href="http://www.newworkmag.com/issue3.html" title="http://www.newworkmag.com/issue3.html">http://www.newworkmag.com/issue3.html</a></p>
    <p>The samples were found in issue 1 about half-way through,<br>
    and issue 2 towards the end.<br>
    <a href="http://www.newworkmag.com/images/5_1.jpg" title="http://www.newworkmag.com/images/5_1.jpg">http://www.newworkmag.com/images/5_1.jpg</a><br>
