    html: <p>Before you all pull on your hooded robes, I should say that I did read all the documentation on the Yale site, and then compared his alphabet with that of Monotype Bembo, and to my eye it's entirely too close to that Bembo. My heterodox opinion is that Carter could have gone much further. (And where are the bold and bold italic? Only a "street" version, somewhat but not quite fully bolder, appears on the website.) His differences are fascinating, of course--slight overall condensing, adjusted x-height, and above all, a smoothing away of many of the most charming kinks--e.g., on the capital K--instead of adding *more* kinks as, say, Dupré might have done with the same assignment. But these differences don't add up to anything fresh, transcending the source material, as Galliard did. Yale is certainly entitled to their own more "formal" Bembo, but if it went on the market, I would see no point to getting it. I speak as a type consumer, not a type designer.</p>
    html_clean: <p>Before you all pull on your hooded robes, I should say that I did read all the documentation on the Yale site, and then compared his alphabet with that of Monotype Bembo, and to my eye it's entirely too close to that Bembo. My heterodox opinion is that Carter could have gone much further. (And where are the bold and bold italic? Only a "street" version, somewhat but not quite fully bolder, appears on the website.) His differences are fascinating, of course--slight overall condensing, adjusted x-height, and above all, a smoothing away of many of the most charming kinks--e.g., on the capital K--instead of adding *more* kinks as, say, Dupré might have done with the same assignment. But these differences don't add up to anything fresh, transcending the source material, as Galliard did. Yale is certainly entitled to their own more "formal" Bembo, but if it went on the market, I would see no point to getting it. I speak as a type consumer, not a type designer.</p>
