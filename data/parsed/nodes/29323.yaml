      <p>Tufte had a digital Bembo made for his later offset work, probably because he was accustomed to having books set in Monotype metal Bembo by Michael and Winnie Bixler (for offset repro, no less). He has the same prejudice we all have: "Metal Bembo is so great, why is the digital so weak?" and he knew metal Bembo.</p>
      <p>One partial answer to that complaint is the new, OpenType Bembo Book, which Robin Nicholas based on a different size master than the earlier digital version. It's stronger.</p>
