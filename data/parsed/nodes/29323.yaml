      <p>&gt; Carter could have gone much further.<br>
      from hrant: I agree, but not further from Bembo, because that’s not the point anyway.</p>
      <p>But that's exactly the point. The first poster asked whether Carter's Yale fonts were available to the public, which implies a second question: if they were, would they be worth acquiring? My answer to both is no. The prospect of Carter taking a fresh look at Bembo is profoundly exciting, especially since Morison's 1929 is the only version extant. We don't know what his client specified, but the Yale tweaking is deeply disappointing relative to the type market, and I hope Carter could still revisit Bembo with more creative effect. There is a market demand to revive older pre-Morison Bembos, delving deeper into the Renaissance source material for a funkier, more charming result, more like a Dupré face.</p>
