      <p>In "The Solotype Catalog of 4,147 Display Typefaces" this is identified merely as "Rustic"., as it is in the Special Effects and Topical Alphabets book.</p>
      <p>While there are many similar fonts, there are only two known digitizations of this particular face:</p>
      <p>RusticBlackShadow, by "Character"  (so named to differentiate it from the plain and white shadow versions)</p>
      <p>and</p>
      <p>FA204, by Dick Pape (his copyright notice attributes the font to Pepin Press, because that's where he found the image to work from).</p>
      <p>Both of these are free. Character's version is more easily found.</p>
      <p>Some version of the ClickArt package included 43 characters as .wmf files; this is probably what Character converted into his font.</p>
