    <p>Hi, all.</p>
    <p>Does anyone know what this typeface is?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/clannadtitle_6468.png"></div><br>
    This is the title of Clannad, a Japanese anime currently being aired on Tokyo Broadcasting System. <p></p>
    <p>Besides the good story, I'm sort of interested in the strange fonts in the tittle, especially A in display,relatively small uppercase R because I've never seen A letterform like that. I wonder if the font is another customization. How do you think?</p>
