    <p>i return with humility . asking the eyes of the typographic experts here in these forums for help</p>
    <p>in  identifying the following typefaces .</p>
    <p>.</p>
    <p>these pages are from a magazine by the french design group WORK IN PROGRESS</p>
    <p>.</p>
    <p>in use is lubalin’s classic + misused AVANTGARDE . along with what i think might be another lubalin creation .</p>
    <p>THE TYPEFACES WITH “SWASHY” CAPS . i think i may have seen it in an U&amp;LC . but i forget .</p>
    <p>i’m interested in the swash font in particular but </p>
    <p>please id all fonts in play .</p>
    <p>+ </p>
    <p>the second attached file has a heavy display type . WHAT IS IT ?</p>
    <p>_ _ _</p>
    <p>peace + bless</p>
    <p>aerosyn . lex</p>
