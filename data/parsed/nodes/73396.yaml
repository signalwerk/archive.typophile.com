    html: |-
      <p>Very interesting. I don't know when copyright notices are updated in fonts, but I did start on PageMaker 4 on PC back in 92 or so, and this particular font says (c) 1990 as noted above. My sneaking suspicion is that I've had this font since the early days, and in copying a project from PC to Mac when I made the leap in 98 or so to my first iMac, the font made it over. </p>
      <p>Back in the early days of TTF, there wasn't even a format of file to embed a font in, correct? PDFs weren't invented until 93 or so, and didn't catch on in prepress for many years after that.</p>
      <p>I'm completing a book on font combination samples, and of the 200 or so fonts used, this was the only one to give an issue when exporting the book to PDF, and I had never seen that issue before.</p>
      <p>It's strange to think of a digital file being "old", but I guess some of us actually have fonts that could theoretically 20 years old or more, as they move from upgraded computer to upgraded computer over time.</p>
