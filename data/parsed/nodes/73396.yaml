    html: |-
      <p>Hi, </p>
      <p>First of all, I assume your InDesign can do a PDF with any other font, so you can discard an InDesign failure.</p>
      <p>The error you are reporting is very probably happening because the designer (or the company or someone else) decided to put this restriction into the font (in Fontlab, this option is called “embedding of this font is not allowed”). I think the main reason to do so is to enforce to every user to buy a license (in this case, the people who will watch or work with the PDF).</p>
      <p>Two things:</p>
      <p>—You would need to check the End User License Agreement (EULA) of this particular font, but I am pretty sure that if they put this restriction, they won’t let you to upgrade the permissions level. If this is the case, you may need to license a Bembo that doesn’t have such restrictions.<br>
      —But I’d try to know who designed/distributed this font in the first place. If you are on a Mac, you could check it out by opening the font with FontBook &gt; Preview &gt; Show Font Info. On a PC, I guess the foundry is shown if you double click it. I tell you this because 1), if you are going to buy a new license, you probably need to be sure that you are getting the exact same version so you can avoid text reflow; and 2), there are more than one <a class="freelinking external" href="http://new.myfonts.com/search/bembo/fonts/" rel="nofollow">Bembo</a>: myfonts.com shows three typefaces with the same name, but I am almost certain that the three companies allow embedding on their fonts – they are Adobe, Monotype and Linotype. So probably your Bembo is a not very common version (or a version that someone else modified).</p>
      <p>If you finally decide to buy a new license, you may want to contact the foundry to ask them if the chosen fonts have restrictions or, if they have, if by any chance you can change them.</p>
      <p>And maybe someone on this forum can tell you if the Bembo he/she owns can be embedded.</p>
      <p>Good luck!</p>
