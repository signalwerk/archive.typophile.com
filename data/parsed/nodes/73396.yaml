    <p>I have owned Bembo for so long I forgot where I got it. It was probably from a CS suite or maybe something else from the distant past. I'm not sure.</p>
    <p>Either way, I was exporting a document from InDesign CS5 to PDF. As it compiled the pages, it gave me an error saying that due to licensing restriction, Bembo could not be embedded in the document. I have never seen this error before.</p>
    <p>Does anyone know how to handle this? Do I need to buy Bembo again? How do I know, if I buy it, the same thing won't happen again? Is this an InDesign export to PDF error?</p>
    <p>If anyone has any insight, please let me know. I could resort to Fontforge which I know precious little about (I got it installed but that's it) and see if I could save as a TTF (the fonts in question are OTF) but that sounds hoaky and I don't know if that would work or do anything at all.</p>
  html_clean: |-
    <p>I have owned Bembo for so long I forgot where I got it. It was probably from a CS suite or maybe something else from the distant past. I'm not sure.</p>
    <p>Either way, I was exporting a document from InDesign CS5 to PDF. As it compiled the pages, it gave me an error saying that due to licensing restriction, Bembo could not be embedded in the document. I have never seen this error before.</p>
    <p>Does anyone know how to handle this? Do I need to buy Bembo again? How do I know, if I buy it, the same thing won't happen again? Is this an InDesign export to PDF error?</p>
    <p>If anyone has any insight, please let me know. I could resort to Fontforge which I know precious little about (I got it installed but that's it) and see if I could save as a TTF (the fonts in question are OTF) but that sounds hoaky and I don't know if that would work or do anything at all.</p>
