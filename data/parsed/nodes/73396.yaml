      <p>Only FYI: I don't think there has <em>ever</em> been a version of InDesign that embedded non-embeddable fonts.</p>
      <p>Your Bembo definitely did *not* come with one of the CS suites, because (a) it never came with this font, and even more so (b) all fonts that come with the CS suites are embeddable, no restrictions at all (which is, actually, very generous of Adobe).</p>
