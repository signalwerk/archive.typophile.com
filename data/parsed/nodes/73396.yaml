    html: |-
      <p>This probably happened because the ttf font you were using was made without any embedding information at all. When the Adobe programs meet a TrueType or OpenType font without the embedding bit set it treats it as if it has the strictest embedding = not embeddable. This is a choice Adobe was asked to make to accommodate all those fonts already on the marked when the embedding bit was introduced (after the uproar that happened when they initially started with allowing embedding of such fonts as default ;)</p>
      <p>So the ttf you had was either very old or made by an old conversion program. Probably not an "official" font file. No such problems with updated TrueType or OpenType fonts – most professional fonts are made as at least allowing print &amp; preview embedding.</p>
