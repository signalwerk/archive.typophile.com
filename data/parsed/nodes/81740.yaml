      <p>“Abel&amp;Cole” is based on <a class="freelinking external" href="http://www.emigre.com/fontpage.php?SFaiWBol.html" rel="nofollow">Fairplex Wide Bold</a> by Zuzana Licko.</p>
      <p>“Eat More Veg” appears to be a custom typeface called <strong>AbelCole01Slab</strong><br>
      (Source: <a class="freelinking external" href="http://www.abelandcole.co.uk/content/aboutus/pdf/170111.pdf" rel="nofollow">Abel&amp;Cole PDF</a>).</p>
    html_clean: |-
