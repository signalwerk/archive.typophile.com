      <p>I'm arguing that a better question than "How to fight against those scums?" is "Why are we fighting against those scums?" Your point that individual EULAs and the letter of the law work together to allow for a legal remedy is well taken, but such a legal remedy isn’t rooted in the same kinds of policy objectives as those pertaining to the recovery of stolen brick-and-mortar property, or the recompense for bodily injury. What I’m trying to say is that (American) IP rights are not the magical, inalienable personal rights protected in the Bill of Rights US Constitution. Yes, we have legal recourse at our disposal, but because of the original policy objectives behind that legal recourse (forget for a moment about Sonny Bono and Disney), we are under no moral obligation to engage them. </p>
      <p>The argument presented elsewhere in this thread looks something like this: <cite>Are these EULAs enforceable by US courts?</cite> Yes. <cite>But is it often costly or futile to pursue litigation to try to enforce them?</cite> Yes. Conclusion: it’s probably not a good idea to go after the scums with lawyers 100% of the time.</p>
      <p>My argument, which reaches the nearly same conclusion, looks like this: <cite>Is rampant piracy chilling innovation?</cite> No. <cite>Could over-litigation in time chill innovation?</cite> Possibly. Conclusion: we should think very, very hard before going after the scums with lawyers.</p>
