      <p>Your argument contains a number of assumptions that you're not making explicit.  You talk about original policy objectives for at least three different sets of laws (recovery of stolen physical property, recompense for bodily injury, and rights associated with intellectual property) without ever spelling out what you believe those original policy objectives are.  Then you state that "over-litigation" (which you don't define) may chill innovation, without explaining how you imagine that chilling might come about.  Maybe I'm not imaginative enough, but I fail to see how successful enforcement of EULAs is going to discourage anybody from designing a new font.  If anything, it seems to me it should have the opposite effect.</p>
      <p>I don't mean to be a jerk, and I certainly don't disrespect you for your point of view, but I don't follow your line of reasoning or share your conclusion.</p>
