    <p>Hi all,</p>
    <p>I just found an topic at one torrent's forum while I was seeking for any page that contains our fonts and I found an interesting topic where users are exchanging between themselves all kind of fonts, and what surprised me the most is that there are already some fonts on the "black market", released just a couple of days ago.</p>
    <p>I know that this is wide spread behavior on the Internet but do you have any idea that might be helpful against those bastards? Is contacting the admin of this formum/site good idea for the start (I somehow think he's the same as his users)? Any legal rule in this case?</p>
    <p>Best</p>
