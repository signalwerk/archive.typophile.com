      <p>There are two reasons people sometimes advise just doing nothing. It's kind of like playing whack-a-mole, only imagine that:</p>
      <p>1) it's an infinite number of holes in all directions</p>
      <p>2) you are using a defective mallet that only works one time in four, and never on the special jumbo-size holes.</p>
      <p>Which is why for many people in font design, the frustration of trying to do anti-piracy enforcement outweighs the benefits (especially if one is trying to think of piracy reduction as, for example, a percentage of total piracy).</p>
      <p>Not that I in any way wish to malign the efforts of those who do it, but I am equally sympathetic to those who throw their hands up and say "it's just too much to try to deal with."</p>
      <p>Cheers,</p>
      <p>T</p>
