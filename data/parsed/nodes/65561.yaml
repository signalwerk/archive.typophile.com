      <p>I'm a little surprised at some of the responses here.  I realize that file sharers aren't likely to become paying customers, but if they are using your IP without a proper license, they are breaking the law and there are (in theory, anyway) legal remedies for that.  If font designers would subpoena file sharing sites for all identifying information (including IP and MAC addresses) of people passing around their work, it might encourage the owners of these sites to supervise site activity a bit more closely (or to get out of the file-sharing business altogether).  And if designers would then track down offending file sharers and serve up hefty fines and/or criminal charges, it might deter others, and it might help designers recover some lost revenue.</p>
      <p>Having said all that, I have no fonts on the market and no experience with this kind of legal action.  I'd be interested to hear from anybody who's tried this kind of thing.  I understand there's a certain cost and hassle involved with this stuff, but the cost of ignoring the problem is that you send the message that you are a pushover and that your IP can be obtained free of charge, with impunity.  Which costs more?</p>
