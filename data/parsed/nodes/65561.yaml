      <p><cite>They are very, very interested. Alas, it usually always fails.</cite></p>
      <p><a href="http://news.bbc.co.uk/2/hi/technology/8428126.stm" title="http://news.bbc.co.uk/2/hi/technology/8428126.stm">http://news.bbc.co.uk/2/hi/technology/8428126.stm</a><br>
      Using technology to prevent or stanch piracy can only ever be so effective.</p>
      <p>And regarding legal remedies, this may strike some as arch blasphemy (including myself, maybe, if I make good on my plans to go to law school next fall), but per a Jeffersonian, Lessig-ish interpretation, intellectual property rights are not God-given and inalienable. They exist to compensate for the phenomena by which innovation and creativity carry certain disincentives when subjected to natural market forces. By mapping our concepts of brick-and-mortar property rights onto IP, we fall victim to the mindset that we own our ideas. We don't. Not once they've been let out of our heads, anyway. </p>
      <p>And for as distressing as it seems that many otherwise very qualified people can't make a living off of type design--much less become wealthy--thanks in large part to digital piracy, there still exists, either because or in spite of the available legal remedies, considerable innovation. Just look at the fonts that came out this year. </p>
      <p>Of course things are generally headed away from this kind of light-touch IP model (maybe happily?) because other creative industries have been able to put some legal muscle into exercising their IP rights. But again, there's this illusion that just because this is the direction the money flows, and the way each extended term of copyright points, that it's leading toward a better solution. I think one needs to weigh the purpose of these legal remedies before one engages them, lest one becomes unintentionally complicit in the birthing of an ugly, over-litigated future for creativity and innovation.</p>
