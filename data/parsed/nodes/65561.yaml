    html: <p>Eric, I understand most of the arguments against legal action given so far in this thread, but I'm not sure you are arguing about the same thing as everyone else.  You're talking about creativity and innovation and ownership of ideas.  I'm talking about digital artefacts and EULAs.  I'm talking about person A asking in an online forum if someone could send him the Skolar Pro files so he doesn't have to shell out €200 for them, person B sending him the files, and persons C through M making the same request and receiving the same files.  You write that <em>one needs to weigh the purpose of these legal remedies before one engages them</em>.  As far as I'm concerned, those legal remedies exist to make EULAs enforceable, to prevent people from distributing or obtaining fonts illegally, and to collect damages from those who have done so.  Given the clear evidence that persons A through M have broken the law, I see no ugliness in going after them.  Maybe, as others have said, it's not worth the time and effort to pursue this kind of action, but surely "creativity and innovation" wouldn't be your reason for not going after folks who have pirated your fonts.  Would it?</p>
