      <p><cite>but I fail to see how successful enforcement of EULAs is going to discourage anybody from designing a new font.</cite></p>
      <p>I think I see my error. I don't think I can really argue that the absence of effective legal recourse for every instance of EULA violation isn't discouraging type design, and in the same breath argue that suing every individual who violates a EULA, <a class="freelinking external" href="http://en.wikipedia.org/wiki/Joel_Tenenbaum" rel="nofollow">Joel Tenenbaum style</a>, is somehow in turn going to <cite>have</cite> a discouraging effect. </p>
      <p>The truth is, nothing is likely to keep people from designing type. It isn't like inventing a new drug, or making a movie. It's cheaper and more solitary. And thanks to the advent of the internet, it's more immediate than it's ever been at any point in history.</p>
      <p>My point about the original purpose of IP law in America derives from Article 1, Section 8 of the US Constitution:</p>
      <p><cite>Congress shall have power . . . To promote the progress of science and useful arts, by securing for limited times to authors and inventors the exclusive right to their respective writings and discoveries.</cite></p>
      <p>IP law doesn't exist because we have any kind of innate entitlement to ownership over our ideas, or even to make a living practicing the creative arts. It's callous to think of it this way, and in a way it only makes sense as an outsider, but the point of IP law is to make sure that Goudy Sans gets created, not that Frederic Goudy gets paid. It happens that the best way to ensure the former is to provide for the latter, though in type design, time and again, it's been demonstrated that the former will sometimes just happen of its own accord.  </p>
      <p>I think I've just had too much Free Culture Kool-Aid recently, and am confusing a widespread antipathy toward derivative works (which are actually fairly well-supported by type law) and one toward outright piracy (which is warranted here). </p>
      <p>As an outsider I just feel lucky that I get to live in a world with all this great type, it's none of my business for now what drives that innovation.</p>
