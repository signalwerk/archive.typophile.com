      <p>To build on what Jonathan and Kris have stated above, every release we’ve put out through Commercial Type has been a collaboration of one kind or another, even where the typefaces are credited to an individual designer. Since working on the Guardian typefaces together, Paul Barnes and I usually conceptualize and draw our work together, passing files back and forth and discussing everything until we’re both happy and nobody can remember who drew what. Our staff type designer Berton Hasebe is always actively involved in the ongoing discussion of each project as well. Even when one of us has taken the lead on a project, at one point that designer is bound to get stuck on something, and it usually takes the editorial eye of the others to get him out of the rut because we each bring a different sensibility to the table — Paul has an encyclopedic knowledge of type history and has spent years as an art director, typographer and graphic designer, and is British; I have the most experience as a working type designer, and I’ve spent my career on the east coast of the US; and Berton was educated and worked on the west coast and in Holland.</p>
      <p>I learn something new from each collaborator, whether it’s another type designer, like Kris or Erik Spiekermann, or a client (we have been very lucky to work with some really smart and interesting creative directors), and each collaborative project. I think my work would have become stale a long time ago if I had kept working on my own. It's easy to fall into bad habits and make excuses for things being "good enough".</p>
