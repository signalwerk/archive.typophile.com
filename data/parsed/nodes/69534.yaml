      <p>I generally do everything myself, although I did collaborate with Amanda Duffy on the Duffy Script face. She didn't do any digital work, but provided many samples of lettering that were conducive to typographic interpretation, as well as pen and ink renderings of typographic characters that she would never be called upon to use in her work as an illustrator. So she was involved in the design process to some degree.</p>
      <p>I have also had clients of commissioned work who have provided a very strong direction, quite specific on details (with constructive recommendations, rather than just saying, "I don't like that"), although this is not usually the case. But it was for the design of Pratt, so much so that I felt it quite appropriate to name the face after David Pratt, the design director of the paper, <em>The Globe and Mail</em>, for which it was commissioned. Mr Pratt was a collaborator, although he is not formally listed as co-designer.</p>
