      <p>“I realized more than ever just how crucial a good editor is to the process, and how vastly improved a work of art can be when it benefits from a colleague who understands you, sometimes even better than you understand yourself, and is indisputably on your side.”</p>
      <p>After a few collaborations with Christian, I have come to understand exactly the same thing. I am pretty certain that it's precisely a lack of editing and outside viewpoints that lead to the slew of badly executed fonts these days. Even for my ‘own’ releases, I make sure that I get input from a select group of trusted confidants. I also consider commissions &amp; custom type as a collaborative effort. For example, there is no way that I would have come up with Hardys or Serrano if it wasn’t for specific client requests &amp; feedback during the design process.</p>
      <p><a href="http://vllg.com/Incubator" rel="nofollow">The Incubator at Village</a> is an interesting concept. It functions essentially as a collaboration between a young designer &amp; Chester. </p>
      <p>I imagine that the majority of professional releases these days are collaborations. It would seem to be the norm rather than the exception.</p>
