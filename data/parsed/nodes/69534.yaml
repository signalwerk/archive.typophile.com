    html: <p>It sounds to me like there are at least three significantly different kinds of collaboration. 1. People trade tentative glyph designs back and forth until everyone is happy. 2. One person has the design idea and does the design in one weight and style and has others expand, with feedback from the designer. 3. One person does the drawing of glyphs, but much of the rest of the process is left to others. How much the "design" aspect is really shared thus seems to vary a lot.</p>
