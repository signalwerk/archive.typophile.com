    html: <p>In type, collaboration is good. The reason is type-blindness, the affliction type designers suffer from where they can't see what is wrong with their type. There is probably no typeface that has lasted more than a decade that did not have some collaboration. Even designers known for doing everything themselves (such as Type Gods A, B, C, and D) have usually, in an unpublic and uncredited manner, sought outside advice. One problem with collaborators is that unless there is an economic motive to put a lot of work into the font, the collaborative input is likely to be shallower than it could be. Hence the advantage of the 'studio system' -- when it works. It doesn't always work, as van Krimpen noted ... often. At least not to everyone's satisfaction. But that is implicit in the design and manufacture of a font which is a mere intermediary function in the creation of printed matter (or displayed matter). Nor can one overlook the limitations of technology. For example, in how many PostScript versions of Frutiger is the z raised, slightly, above the baseline, as it is supposed to be? Who makes the decision that a unit is probably too coarse? Is the error corrected in TrueType, where it could be? At what size and resolution could it possibly be desirable to have this degree of refinement? Is Frutiger interested in how his anonymous collaborators things work these things out? How many collaborators and cloners even notice that this influential font has been designed with this level of sophistication?</p>
