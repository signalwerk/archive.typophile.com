    <p>I would like to compile a list (perhaps eventually resulting in a wiki) of notable efforts in collaborative type design. Team77 comes to mind as a very good example. A more contemporary instance would be Majoor and Buivenga.</p>
    <p>The distribution of work can be anything: glyph design versus spacing versus hinting, Latin versus Arabic versus Cyrillic, conceptualizing versus sketching versus digitizing, etc. However I would like to exclude cases where the collaboration was inescapable - for example the yesteryear collaboration between a type designer and a punchcutter. I'm looking for cases of collaboration where the typeface <em>could</em> have been done by one person, but people elected to collaborate anyway.</p>
    <p>We can flesh the list out with details, but please don't hold back if all you'd like to contribute is names (of fonts or people).</p>
    <p>Thanks.</p>
    <p>hhp</p>
