      <p>There are sooooo many different ways to collaborate, and so many degrees of collaboration, that I believe such a list or wiki would have to be incomplete by definition. We see this all the time here at FontFont. There are classic cases where designers get other designers to help expand on existing families for instance (e.g. <a href="http://www.fontshop.com/fontlist/super_families/ff_milo_ff_milo_serif/" rel="nofollow">FF Milo &amp; FF Milo Serif</a>). Others do fine on their own, but require help from their foundries mainly for publication and marketing (does this also count as a collaboration? ;). Plenty of designers request help from our TypeDepartment in many different areas, ranging from technical or design issues to very elementary questions. There are even cases where our in-house designers contribute heavily to the creation of a FontFont (e.g. <a href="http://fontfeed.com/archives/new-fontfonts-ff-dagny-from-tabloid-to-desktop/" rel="nofollow">FF Dagny</a>). Since every typeface is as individual as its creator, we contribute as flexibly as possible on all different levels as needed. So I’d second Kris on this: <em>„I imagine that the majority of professional releases these days are collaborations. It would seem to be the norm rather than the exception.“</em></p>
      <p>(BTW, <a href="http://www.metaserif.com" rel="nofollow">FF Meta Serif</a> wasn’t a cross-foundry collaboration, it was a collaboration of individual designers.)</p>
