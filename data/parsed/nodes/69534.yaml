      <p><em> I've come to think of type design as an inherently collaborative act.</em></p>
      <p>That has worked well for you Jonathan, but I don't believe it's the only modus operandi.<br>
      There are trade-offs in comparing solo with division of labor.<br>
      I long ago decided to remain solo (as a graphic designer, before I had produced any digital fonts).<br>
      That was a decision to remain hands-on with the tools, more craft than industrial. Most immediately, I didn't want to be the old geezer standing behind the kid at the computer, saying "move that a bit to the left".</p>
      <p>On the down side, it's always a struggle to stay au fait with the technical demands of font production, but on the up side I've found that getting inside the technicalities of a task can lead to new design directions; for instance, the possibilites of OpenType substitution codes for making more "natural"-looking scripts, and pseudo-randomization, has provided me with an ongoing theme to develop in a succession of typefaces, and I don't think you can really nail your contextual glyph shapes unless you are working hands on, because the relationship between glyph shape and substitution classes is so motile.</p>
      <p>I also like to do my own manual kerning, because I consider the relationship between sidebearings, kerning, and glyph shape to be a holistic matter of personal taste: so I opt more for the subjective judgement of the designer during the creative process, rather than the objective eye of the editor post facto--although I don't see why team work can't be just as effective when the "editor" is brought into the feedback loop.</p>
      <p>I must admit I haven't found the process of hinting to be at all stimulating, so was buoyed this morning to read that the new iPhone will have a superfine screen resolution with invisible pixels. No more hinting?!</p>
