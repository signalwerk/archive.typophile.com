      <p>DB would be better qualified to talk about any *method* at FB. I’m not directly involved; I just have a good seat in the front row. ;-)</p>
      <p>From what I observe, there’s quite a variety. Seems like a fair bit of it comes down to What Works in order to Get the Job Done. </p>
      <p>But I think the basic patterns are pretty common-sense:</p>
      <p>» Someone starts a design and develops a modest family. Later it gets expanded and someone else takes over interpretation of the extensions. (e.g. Benton Gothic/Sans, Bureau Grotesque/Grot)</p>
      <p>» Someone designs the basic characters (~ascii), and someone else gets to play it out to all the rest of the char set, and maybe refine the fitting. </p>
      <p>» Someone might work on the roman styles, while someone else develops the italics. (I think Benton Modern Display went like this, for example.)</p>
      <p>» Someone designs a display family, then someone else works up the text versions. Or vice versa. (FB Californian, among others, I believe)</p>
      <p>» Someone designs the basic styles, and someone else gets to develop all the grades. (Most of the Readability Series)</p>
      <p>» Someone designs the family, and later someone else gets to do a lot of customization for a client — could be stylistic adjustments, char set extensions, revised fitting, etc. (Various custom bread-and-butter jobs)</p>
      <p>» And Dyana seems to like doing everyone’s kerning ;-)</p>
      <p>Any particular project might entail a combination of these possibilities. And of course, any “lead” designer would get final review of everything. </p>
      <p>I don’t know; is this collaborative design, or just pragmatic production? I’m not exactly sure what you’re after in terms of “notable efforts.”</p>
