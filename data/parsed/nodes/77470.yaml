    <p>I've started the extreme contrast variant of Grumpy. What do you think?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Gr_5623.png"></div><br>
    Some of the diagonal hairlines are pretty tough to handle, but overall it seems to work pretty well.<br>
    I also finished the basic Black variant, and ended up with some 2000 kerning pairs, and with class based kerning on top of that, so there should be enough to go around.<p></p>
