      <p>Hi Daniel,</p>
      <p>it looks like <a href="/wiki/Canada%20Type" class="freelinking" rel="nofollow">Canada Type</a>’s <a href="http://new.myfonts.com/fonts/canadatype/quanta/?testdrive=dock%3Dfalse%26size%3D52%26w%3D720%26src%3Dcustom%26text%3DTHE%2520BABIES%2520ARE%2520COMING%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%252Cot.liga%26seed%3D25" rel="nofollow">Quanta East and West</a> combined, i.e. without the stencil gaps.<br>
      In Quanta’s description, <a href="/wiki/Patrick%20Griffin" class="freelinking" rel="nofollow">Patrick Griffin</a> states that it is “[b]ased on yet another undigitized type spotted on a film set”. Maybe there’s a different digitization.<br>
      F</p>
