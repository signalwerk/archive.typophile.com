    <p>Hello folks, </p>
    <p>Just watched the trailer for the upcoming film "Babies" and it has a fantastic logo/logotype. I'm fairly confident its not a custom job, since several things are typed out in it.</p>
    <p>I have attached a couple samples.<br>
    Thanks!</p>
