    html: |-
      <p>Okay, but how’bout a font or two close to that style.</p>
      <p>(toke…toke…searching myfonts.com…mmmm…)</p>
      <p><a href="http://www.myfonts.com/fonts/blhd/conserif-cw/" target="_new">Conserif</a> is sorta-kinda close.</p>
      <p><a href="http://www.myfonts.com/fonts/blhd/conserif-cw/morelikethis.html" target="_new">1971 more fonts like that</a></p>
      <p><a href="http://www.myfonts.com/fonts/redrooster/hancock-rr/morelikethis.html" target="_new">Another list of slabbies</a></p>
      <p>(…toke…mmmm…)</p>
      <p><em>no way on earth they could have done the overlapping T and C and the negative leading with type.</em></p>
      <p>And the larger point size in metal would have much heavier strokes. The T you’d have to chop and channel with a welder to get the length.</p>
      <p>j a m e s</p>
