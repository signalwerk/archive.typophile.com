      <p>You may want to look at Recommendaations for OpenType fonts(<a>http://www.microsoft.com/typography/otspec/recom.htm</a>).</p>
      <p>There is no strict requirement on table alignment and ordering in the OpenType format. However it is recommended to have them 4-byte aligned and padded with zeroes to 4-byte boundary. Form the page above:</p>
      <p><cite><br>
      Table Alignment and Length</cite></p>
      <p>All tables should be aligned to begin at offsets which are multiples of four bytes. While this is not required by the TrueType rasterizer, it does prevent ambiguous checksum calculations and greatly speeds table access on some processors. </p>
      <p>All tables should be recorded in the table directory with their actual length. To ensure that checksums are calculated correctly, it is suggested that tables begin on LONG word boundries. Any extra space after a table (and before the next LONG word boundry) should be padded with zeros.<br>
      </p>
      <p>Physical order of tables in the font does not depend at all on alphabetical order of tables in the font header. Table ordering recommendations are based on the order in which operating system typically read font data. Grouping some tables together really does (or at least did) significantly speed up font loading time. Recommended order is (from the same page):</p>
      <p><cite><br>
      Optimized Table Ordering</cite></p>
      <p>OpenType fonts with TrueType outlines are more efficient in the Windows operating system when the tables are ordered as follows (from first to last):</p>
      <p>head, hhea, maxp, OS/2, hmtx, LTSH, VDMX, hdmx, cmap, fpgm, prep, cvt, loca, glyf, kern, name, post, gasp, PCLT, DSIG</p>
      <p>The initial loading of an OpenType font containing CFF data will be more efficiently handled if the following sfnt table ordering is used within the body of the sfnt (listed from first to last):</p>
      <p>head, hhea, maxp, OS/2, name, cmap, post, CFF, (other tables, as convenient)</p>
      <p></p>
      <p>Hope this will help.</p>
      <p>Thanks,<br>
      Sergey</p>
