    <p>I can’t find a specification for the Open Font Architecture anywhere (!) but I am kind of making things up as I go along by examination and copying, and published specs for OFA implementations such as TrueType and OpenType.<br>
    I have two questions that remain though:</p>
    <p>1) Do tables have to be aligned on four byte word boundaries?<br>
    2) Is there any reason why tables are output in a specific order, yet given in a different order in the table listing at the start of the file? e.g. in the Apple Symbols font the header gives the tables in this order: LTSH, OS/2, VDMX, cmap, ... but by offset in the file the tables are ordered hmtx, fpgm, prep, loca, glyf, ...</p>
    <p>Thanks for any insight,<br>
    – Nicholas</p>
