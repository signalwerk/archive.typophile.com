  html: |-
    <p>Simplepolator allows you to interpolate compatible glyphs in the same font, without leaving FontLab nor interrupting your workflow.</p>
    <p>Simply select two compatible glyphs and run the macro:<br>
    Five new glyphs will be automatically created, allowing you to choose the best variation.<br>
    Making it super-easy to apply the Gunnlaugur SE Briem's method on "How to make mistakes.</p>
    <p>A quick video showing how to use it:<br>
    <a href="https://vimeo.com/42785809" title="https://vimeo.com/42785809">https://vimeo.com/42785809</a></p>
    <p>Download:<br>
    <a href="http://www.impallari.com/projects/overview/simplepolator" title="http://www.impallari.com/projects/overview/simplepolator">http://www.impallari.com/projects/overview/simplepolator</a></p>
