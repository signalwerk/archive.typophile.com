    html: |-
      <p>it's interesting to me that, at a glance, the design 'feature' you built this font around was the bifurcation. yet, it ends up holding the design back.</p>
      <p>this always seems to be way of things. the reasons you have for starting something are rarely the reasons you have for finishing the very same endeavor.</p>
      <p>i like the design. i like the 'R' the most and the 'S' the least.</p>
      <p>if you don't like the irregular quality of your 'O' and 'Q', then i'd recommend just building different 'O's and 'Q's at different sizes until you find a height the works geometrically for those characters. by that i mean, there is enough space to allow smooth curvature.</p>
      <p>then, double back and match the rest of the set to that cap height. it'll be hard to maintain the character of the font exactly, because of the strict nature of the pixel grid. but that's what pixel fonts are all about, right?</p>
      <p>the management of curvature imperfections.</p>
