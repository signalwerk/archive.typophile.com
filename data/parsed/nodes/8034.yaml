  html: <p>Hello! <br> <br>I went back to the er... drawing board with my "Trajic?" post (note the name "Trajic" has been taken by Hrant. H. Papazian already :-S ) and have produced this font. I am currently using the working title "Minque" now for this font. <br> <br>So, on to the font then. <br> <br>I have added stroke contrasts and bifurcated (?) the serifs to correct optical problems with the O. The bifurcation gives it a different texture to Trajan, but I'm not really following it any more anyway. 'Twas merely the beginning. <br> <br>Do you think I could add a lower case, or perhaps have a small caps? small caps would seem to be more in the tradition of the Trajan typeface if I am using it as a "guide". <br> <br><img src="http://www.typophile.com/forums/messages/29/55299.gif" alt=""></p>
  html_clean: <p>Hello! <br> <br>I went back to the er... drawing board with my "Trajic?" post (note the name "Trajic" has been taken by Hrant. H. Papazian already :-S ) and have produced this font. I am currently using the working title "Minque" now for this font. <br> <br>So, on to the font then. <br> <br>I have added stroke contrasts and bifurcated (?) the serifs to correct optical problems with the O. The bifurcation gives it a different texture to Trajan, but I'm not really following it any more anyway. 'Twas merely the beginning. <br> <br>Do you think I could add a lower case, or perhaps have a small caps? small caps would seem to be more in the tradition of the Trajan typeface if I am using it as a "guide". <br> <br><img src="http://www.typophile.com/forums/messages/29/55299.gif" alt=""></p>
