    <p>Searching Google Books with the intent of finding an example of a rotunda, I came across:</p>
    <p><a class="freelinking external" href="http://books.google.ca/books?id=tXCumMOvWRQC" rel="nofollow">http://books.google.ca/books?id=tXCumMOvWRQC</a></p>
    <p>The typeface in which it was set strongly resembled, at least to me, the rotunda of Peter Schöffer. I Googled the book up by its title, and found it was an important book, and also that he was indeed the publisher of that book's <em>first</em> edition.</p>
    <p>However, on the "About this book" page, I found that it was not the first edition. Rather, it was an edition of 1479, printed by no less than... Nicolas Jenson. In <em>his</em> famed rotunda, no doubt.</p>
