      <p>Your Google Books searches prompted me to do a couple of my own, looking for works published by Marcolini, whose italic is of interest because Mardersteig reckoned it to have been based on the chancery hand of the calligrapher Francesco Alunno, of whom I am a fan. And from there I discovered that Nicholas Barker is also an Alunno aficionado, and in 2009 produced a major monograph and reproduction of all the known surviving calligraphic works (including the famous collection that was lost for over a hundred years, and then broken up by an auctioneer when it was rediscovered). Hurrah!</p>
      <p><a href="http://www.hesdegraaf.com/Book/Detail/the-glory-of-the-art-of-writing-the-calligraphic-work-of-francesco-alunno-of-ferrara" rel="nofollow"><em>The glory of the art of writing. The complete calligraphic work of Francesco Alunno of Ferrara</em></a></p>
      <p>Clever two-way slipcase too.</p>
      <p>So thanks for the diversion!</p>
