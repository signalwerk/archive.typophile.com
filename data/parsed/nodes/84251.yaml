      <p>Incidentally, in further searching, I found that a copy of this very edition was sold by Christie's... for a measly $5,300 or thereabouts. About what a nondescript First Folio used to go for decades ago.</p>
      <p>And, this time in the Internet Archive, I've found another incunabula by Jenson. However, their site is slow right now, so I don't know whether this is another Rotunda, or an example of his famous Roman, but it is praised as a beautiful book in the comments in any case.</p>
      <p><a class="freelinking external" href="http://www.archive.org/details/augustinidecivitatedei00jensuoft" rel="nofollow">http://www.archive.org/details/augustinidecivitatedei00jensuoft</a></p>
      <p>Ah, it's in Jenson's gothic type - so says a site asking $23,500 for a copy. And, having finished downloading it, it's not even his Rotunda this time.</p>
      <p>Improving my search skills, however, I found one book by Jenson in a Roman typeface:</p>
      <p><a class="freelinking external" href="http://books.google.ca/books?id=zweEs0ylCfcC" rel="nofollow">http://books.google.ca/books?id=zweEs0ylCfcC</a></p>
      <p>(Historia Naturalis en Italiano)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Griffo_1_4247.jpg"></div><p></p>
      <p>and another one by him on Google Books also in his famed Rotunda:</p>
      <p><a class="freelinking external" href="http://books.google.ca/books?id=iIC-DowyTpIC" rel="nofollow">http://books.google.ca/books?id=iIC-DowyTpIC</a></p>
      <p>(Incipiunt Capitula Prime Partis Summe Super Totam Theologiam Fratris Sancti Thome de Aquino)</p>
      <p>And, while we're at it, while neither <em>De Aetna</em> nor the <em>Hypnoerotomachia</em> is on Google Books, here is</p>
      <p><a class="freelinking external" href="http://books.google.ca/books?id=nooXntOHyFAC" rel="nofollow">http://books.google.ca/books?id=nooXntOHyFAC</a></p>
      <p>(De Gradibus Medicinarum)</p>
      <p>and</p>
      <p><a class="freelinking external" href="http://books.google.ca/books?id=8_NRSNHl1zMC" rel="nofollow">http://books.google.ca/books?id=8_NRSNHl1zMC</a></p>
      <p>(De Morbo Gallico)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Griffo_3_4375.jpg"></div><p></p>
      <p>And here's a book from 1501 that seems to be in a beautiful Roman face:</p>
      <p><a class="freelinking external" href="http://books.google.ca/books?id=Py48AAAAcAAJ" rel="nofollow">http://books.google.ca/books?id=Py48AAAAcAAJ</a></p>
      <p>(Liber de Imaginatione, by Pico della Mirandola)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Griffo_2_5729.jpg"></div><p></p>
      <p>And a book written by Aldus Manutilus himself, apparently - in his Greek typeface:</p>
      <p><a class="freelinking external" href="http://books.google.ca/books?id=lUI8AAAAcAAJ" rel="nofollow">http://books.google.ca/books?id=lUI8AAAAcAAJ</a></p>
