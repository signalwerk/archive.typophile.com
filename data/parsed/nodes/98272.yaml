    html: |-
      <p>Legibility is without doubt all about <em>perception</em>.<br>
      “Telling glyphs apart” is certainly the most important part of that. (Though not the only one)</p>
      <p>Readability is still used in an ambiguous way. It can be understood as <em>understanding</em> or <em>reading comfort</em>, two very different things. </p>
      <p>My definitions:<br>
      <a href="http://opentype.info/blog/2011/04/25/the-onion-layer-model-of-legibility/" title="http://opentype.info/blog/2011/04/25/the-onion-layer-model-of-legibility/">http://opentype.info/blog/2011/04/25/the-onion-layer-model-of-legibility/</a></p>
