    <p>I feel like sometimes it's as bad a topic (that requires explanation) as the 'what is resolution' question. </p>
    <p>Simply put, does this sound about right?<br>
    Legibility - How well you can tell apart the different glyphs<br>
    Readability - How well those glyphs work together and how well they read when assembled into words, sentences, etc.</p>
    <p>Or does someone have a better definition?</p>
