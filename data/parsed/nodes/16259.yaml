    html: |-
      <p>Hello,</p>
      <p>Last year, I wrote my MA dissertation on environmental typography... I went through some classic books regarding this subject:</p>
      <p>Alan Bartram, Lettering in Architecture (1975)<br>
      Nicolete Grey, "Lettering on Buildings" (1960)<br>
      Le Corbusier, "Le Modulor" (1954) {note that Le Corbusier in the beginning of the book describes typography as architecture}</p>
      <p>some essays by Umberto Eco (1972): "A componential analysis of the architectural sign/ column"; in the book “Signs symbols and Architecture” by Broadbent/ Runt/ Jencks.<br>
      “Function and sign, the semiotics of architecture”</p>
      <p>and a recent one: P.Baines &amp; C. Dixon "Signs: Lettering in the environment" (2003)</p>
