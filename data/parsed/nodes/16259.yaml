      <p>Nakheel properties in the United Arab Emirates launched a man made island project in the shape of a palm tree. The project expanded to becoming 3 different palm islands...one of which is characterized by the use of Arabic calligraphy to create islands on the water. Fascinating use of typography/calligraphy in architecture. </p>
