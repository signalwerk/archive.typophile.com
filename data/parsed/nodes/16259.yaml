  html: |-
    <p>Looking for some suggestions... We're working on an exhibit where the use of type, primarily on a large scale, is used within the space. Architects are already producing final drawings for the buildings we are working with, and we would like to incorporate interesting typographic elements on the buildings and inside the actual exhibit. Could be engravings, projections, wrought iron letters, etc. Just thought I'd mine this resource to see if anyone knew of folks doing interesting work in this area. One possible example we thought of is <a href="http://images.google.com/images?q=jenny+holzer&amp;hl=en&amp;lr=&amp;sa=N&amp;tab=ii&amp;oi=imagest" rel="nofollow">Jenny Holzer</a>.</p>
    <p>Thanks!</p>
