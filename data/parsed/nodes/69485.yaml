  html: |-
    <p>I want to license the PMN Caecilia family in OT (all the versions, but I don't need Euro/foreign characters), and I'm overwhelmed trying to figure out which website to buy from and which package to license. </p>
    <p>Linotpe offers <a class="freelinking external" href="http://www.linotype.com/191887/pmncaeciliacompletefamily-valuepack.html#format" rel="nofollow">PMN Caecilia Complete Family Pack</a> in "Open Type Com" for $310 and in "Open Type Std" for $195. They're both 8 fonts. Reading the Linotype Support area on OT did not enlighten me as to the difference. </p>
    <p><a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/linotype/pmn_caecilia_std_complete_family_value_pack/" rel="nofollow">FontShop</a> and many other websites also sell Caecilia packages. I've spent way too much time trying to figure this out and would much appreciate any advice!</p>
