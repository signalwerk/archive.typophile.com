      <p>You're right, the Linotype site doesn't make it easy to find the info. Here it is: <a href="http://www.linotype.com/1697/opentypeinfo.html" title="http://www.linotype.com/1697/opentypeinfo.html">http://www.linotype.com/1697/opentypeinfo.html</a></p>
      <p>The difference between the com pro and std is basically how many characters beyond Western Europe they have. </p>
      <p>Beyond that, the designer generally gets the biggest cut when you buy from him, or the first company that issued the font, I think in this case Linotype I believe. Now owned by Monotype :)</p>
