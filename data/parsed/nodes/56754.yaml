      <p>You might try contacting the big sellers of type to see what terms they can offer you. This is not going to be a complete list and my apologies in advance if I am leaving out a foundry that sells &amp; supports Arabic; but you might try contacting ( in no particular order):  Monotype/Linotype, Myfonts, Fontshop, Microsoft, Tiro Typeworks, Dalton Maag, Ascender, Typotheque, Sakkal Design &amp; Adobe.</p>
      <p>You also might want to contact Fiona Ross at Reading University.</p>
      <p>You can also search typophile for threads about this subject in the </p>
      <p>This is the Arabic section of Typophile<br><a href="http://typophile.com/forum/366">http://typophile.com/forum/366</a></p>
      <p>This section deals with Releasing fonts<br><a href="http://typophile.com/forum/7">http://typophile.com/forum/7</a></p>
      <p>And also, you can search for things on typophile ( in this case looking for "arabic" and "release" ) using by putting this in the google search: </p>
      <p>site:typophile.com arabic aelease</p>
