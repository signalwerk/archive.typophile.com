      <p>Here is a link that explains about image posting:</p>
      <p><a href="http://typophile.com/node/18067">http://typophile.com/node/18067</a></p>
      <p>Here are some key points:</p>
      <p>bitmaps<br>
      • GIF, PNG or JPEG only, no TIFF or BMAP<br>
      • RGB only, no CMYK<br>
      • Do not exceed 590 pixels in width.</p>
      <p>PDF<br>
      •&nbsp;PDFs should be vector files only eg not contain photos/bitmaps too.</p>
      <p>I hope this helps.</p>
