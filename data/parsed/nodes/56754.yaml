      <p>Here is how to make a PDF from MS Word:</p>
      <p>1. Download and install the MS Office add-in <a href="http://www.microsoft.com/downloads/details.aspx?FamilyId=F1FC413C-6D89-4F15-991B-63B07BA5F2E5&amp;displaylang=en">'Save as PDF'</a></p>
      <p>2. Open your Word document showing your font, and use the 'Save as PDF' add-in to generate the PDF.</p>
      <p>Typophile won't let you attach a PDF to a discussion comment, so you'll need to either upload the PDF to another website and provide a link from Typophile, or send the PDF to someone who can do this for you.</p>
    html_clean: |-
