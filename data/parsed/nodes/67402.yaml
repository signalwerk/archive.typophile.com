      <p>I guess there are at least two ways here to refer to historical/contextual relationship between form and content. I'll try to articulate this the best that I can.</p>
      <p>1. The form (choice of type or book layout) should have a direct linking to the subject of the book, or the period settings, the author's epoch, or, in a more vague way, to the tale's "atmosphere". Or to the typographical standards of that same era? So a novel taking place in late Nineteenth century England could be set, say, in a Scotch Roman type?</p>
      <p>2. By a strictly typographical point of view, the form as a sort of meta-reference to the "genre" - so a Tolkienesque novel should be set in a type used in Tolkien's days (or in his books published while he was living).</p>
      <p>While I find these approaches challenging, I am more and more persuaded that the best (type) choice in setting books shouldn't necessarily be bound to any historical/contextual matter. One could set an entire catalogue of books - from the Bible to cyberpunk - using the same typeface.</p>
