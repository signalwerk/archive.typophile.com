    html: |-
      <p><em>Venetians aren't the best types for easy readability.</em></p>
      <p>ITC Berkeley has been quite widely used as a text face, both in periodicals and books (e.g. Harry Potter), despite the fact it has no "sc and osf", and is a Venetian, and was designed to be primarily a display face.</p>
      <p>The fact that it has been bundled for free might have something to do with this.</p>
      <p>However, the simple fact is that people (typographers, their clients, readers) like it and think it reads well enough, whatever its theoretical shortcomings.</p>
      <p>Theory is useful, but only in so far as generalizations provide a background against which the exceptional stands out.</p>
