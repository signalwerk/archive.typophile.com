      <p>Well, a fair number of people use Adobe Jenson for book text. I don't like it, which is an obvious bias.</p>
      <p>As an aside, Adobe Caslon is not "standard" amongst designers my age. I suppose this is because we remember metal Caslon, with all the quirks that came with the different sizes. AC seems neutered.</p>
      <p>Which brings up the matter of audience, always an important issue. All too often, a freelance designer is asked to serve two masters. One is the intended reader, the other is the client.  The client, who has the final say, often gets in the way of the reader. Which brings us back to Adobe Jenson. My problem with Adobe Jenson is while the specimen is pretty, 200 pages of it is a bit much. Your mileage may vary.</p>
      <p>* * *</p>
      <p>You don't say what kind of "high fantasy." Who, do you think, the book is aimed at? What do you want to subtly suggest with the typeface itself? Falling back on fonts I use, Quadraat comes to mind -- but I can think of fantasy where it wouldn't work well. If you rely more on a feeling of "being old," audience again is important. For a large number of people, any of the 19th or early 20th century types "feels old." Miller might work, though a bit pedestrian for some texts -- esp. for an art director, as opposed to a reader.</p>
      <p>Ultimately, the text itself has to sell the story. Typeface surely should not get in the way, and at best, should hint -- and only hint. If you can do that while pleasing the art director and/or marketing people, you've got a perfect job.</p>
      <p>FWIW</p>
