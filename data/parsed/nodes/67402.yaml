      <p><cite>. . . I am more and more persuaded that the best (type) choice in setting books shouldn't necessarily be bound to any historical/contextual matter. One could set an entire catalogue of books - from the Bible to cyberpunk - using the same typeface.</cite></p>
      <p>Couldn't agree more -- as long as you are careful about picking that face. History seems on our side too. In the days of hot metal (to the mid 1960s) -- Linotype, at any rate, purchasing a new font family was about the same cost as purchasing a new car. Not something you would do for one or two books. For fun sometime, go look at printers specimen books to see how many text types they would offer.</p>
      <p>In the photocomp days, up to and including the Linotron 202 (to the early 1990s), the cost was not insignificant, maybe 25% of the total the typesetting shop could bill for setting a book. The problem with photocomp was that while there may have been 2,000 fonts available, about 10 were suitable for bookwork. To many of the masters had not been adjusted for offset printing; too many of the masters were improperly spaced.</p>
      <p>Now (2010), buying a font, or even a font family, is less expensive. Some foundries charge about $200 for a family, and will only sell as a package. That's about 1/5 the amount coming back for typeseting a book without images. Still significant, but not too bad, until you add the 40 hours or so it takes the comp to get the roman and italic to work as you want them to -- kerning, a few extra needed features, characters, etc. Always assuming the EULA permitts.</p>
      <p>The problem is that even if there are 20,000 or 200,000 typefaces now available, there still aren't that many suitable for book work. Same problems -- ease of reading, printing offset, and spacing.</p>
      <p>* * *</p>
      <p>Allusiveness in choosing a typeface is more general. In days past, Times Roman could be used for "all books". Today, Minion. Not ideal for love poetry, agreed. but serviceable. So if,using a Linotron 202, you could choose from Trump, Times, Palatino, Baskerville, Sabon, Garamond 3 (but poor spacing), and a few others, you could pick a typeface that was more appropriate than the others for particular titles.</p>
      <p>Things are better now, but not all that much.</p>
      <p>Nor do we want to get into having to place a warning label on the jacket that the reader can't really appreciate the type used without an extensive study of the history of type and type designers; that while the typeface used in this book is hard to read, that is more than offset by its <cite>appropriateness</cite>.</p>
      <p>* * *</p>
      <p>Type designers and type users are usually different people, and will often give different answers to the original question.</p>
