      <p><em>The Lord of the Rings</em> has had many different typesettings. The first and second primary (hardcover) editions were set in Imprint. The first one-volume paperback, and subsequently the India paper edition, were set in Pilgrim. The Folio Society edition was set in Barbou with Libra for display. As reported, the work later appeared (in paperback) in Times. The latest edition, which my wife and I edited, is in Plantin and very handsome. These are the British and American editions; in translation <em>The Lord of the Rings</em> may be found set in Bembo, Granjon, Palatino, etc., etc.</p>
      <p>I've been in the position of choosing typefaces for several books by and about Tolkien, as co-author or co-editor and designer. For <em>J.R.R. Tolkien: Artist and Illustrator</em> (on his pictorial art), I chose Sabon as a face such as Tolkien tended to prefer – practical, nothing fancy. I used the same face for Tolkien's <em>Roverandom</em>, and then again for the 50th anniversary edition of his <em>Farmer Giles of Ham</em>, where our introduction and notes had to harmonize with a facsimile of the original text, set in Garamond. When it came to <em>The J.R.R. Tolkien Companion and Guide</em>, our latest book, HarperCollins expressed a preference for Minion, and Minion Pro worked very well from both practical and aesthetic points of view.</p>
      <p>I worked as editor with Marquette University Press on the proceedings of a Tolkien scholarly conference, set in Adobe Jenson – okay, if a little fancy for my tastes for this purpose. It was a new face to the designer, whom I had to restrain from setting all italics with swashes on.</p>
