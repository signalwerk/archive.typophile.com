      <p><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_oneleigh_ot/">Oneleigh</a> is a fantasy face, an historical fiction in its own right (as is Quadraat).<br>
      Its idiosyncrasies are modeled on those of the classic book faces such as Garamond, Bembo and Perpetua.<br>
      IMO typographers often overestimate the degree to which "quirks" get in the way of easy reading. A glyph may appear to be quirky when compared to its counterpart in other faces, but that is not a concern if it fits comfortably into its own face.</p>
