    <p>I'm currently designing the interior to a high fantasy novel set in a distant past, and one of my friends suggested 11 pt Adobe Jenson. I love the font for its color and the presence it commands on a page with proper, large margins. </p>
    <p>I'd like some opinions on the font, and some alternatives other than the seemingly-standard Adobe Caslon. Are there other similarly dark fonts that you like for book text?</p>
    <p>I'd appreciate the help!</p>
