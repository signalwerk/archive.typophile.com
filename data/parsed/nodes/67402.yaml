      <p><em>It s a story; at it's core, about Hobbits from the Shire.</em></p>
      <p>Middle Earth was gothic, not greco-roman. The Age of Men that would kill off its magic was modern civilization, originating in Rome.</p>
      <p>William Morris, who funnily enough was a pioneer in the creation of fantasy fiction, created a Pre-Raphaelite typeface for his kind of literature (the face was "Troy", a heavy 14th century-style roman/blackletter amalgam), but ultimately he came to accept that it was just too different a read, and favored the Golden Type (based on Jenson). Of course Jenson was Roman, but it was just about as early roman as you could get, and then the Golden Type took things a step earlier with a beefy antique veneer, and a million miles away from the Scotch Roman that is Miller.</p>
      <p>What is the point of looking for a typeface that is suitable for "high fantasy set in the distant past", if a 19th century style like Miller or a 21st century style like Expo is OK? Why not just choose anything you like the look of, regardless of provenance?  Why bother qualifying what project you're asking about a typeface for, why not just ask "What's the hot new face, Typophiles?"</p>
      <p>In the principle of historical allusion, which was dear to the heart of D.B. Updike, the idea is that the parts of a work must be integrated in a governing historical style. So apply that principle to cross over between text and typeface, and Miller and Expo are a no go. You can throw that out the window and yet still have a considered relationship between text and typography, as in Gareth Jones take on Dorian Gray: <a href="http://www.fourcornersbooks.co.uk/Dorian.html">http://www.fourcornersbooks.co.uk/Dorian.html</a></p>
    html_clean: |-
      <p><em>It s a story; at it's core, about Hobbits from the Shire.</em></p>
      <p>Middle Earth was gothic, not greco-roman. The Age of Men that would kill off its magic was modern civilization, originating in Rome.</p>
      <p>William Morris, who funnily enough was a pioneer in the creation of fantasy fiction, created a Pre-Raphaelite typeface for his kind of literature (the face was "Troy", a heavy 14th century-style roman/blackletter amalgam), but ultimately he came to accept that it was just too different a read, and favored the Golden Type (based on Jenson). Of course Jenson was Roman, but it was just about as early roman as you could get, and then the Golden Type took things a step earlier with a beefy antique veneer, and a million miles away from the Scotch Roman that is Miller.</p>
      <p>What is the point of looking for a typeface that is suitable for "high fantasy set in the distant past", if a 19th century style like Miller or a 21st century style like Expo is OK? Why not just choose anything you like the look of, regardless of provenance?  Why bother qualifying what project you're asking about a typeface for, why not just ask "What's the hot new face, Typophiles?"</p>
      <p>In the principle of historical allusion, which was dear to the heart of D.B. Updike, the idea is that the parts of a work must be integrated in a governing historical style. So apply that principle to cross over between text and typeface, and Miller and Expo are a no go. You can throw that out the window and yet still have a considered relationship between text and typography, as in Gareth Jones take on Dorian Gray: <a href="http://www.fourcornersbooks.co.uk/Dorian.html" class="link-external">http://www.fourcornersbooks.co.uk/Dorian.html</a></p>
