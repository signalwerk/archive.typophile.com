      <p>@Tomi:<cite>"Instead of having a square period, Adobe wanted to accent that feature, so period is now more like a star."</cite></p>
      <p>First, it wasn't "Adobe" but Robert Slimbach. It's not like these decisions get made by some corporate representative. It's possible that somebody else in the type group made a suggestion to Robert, but more likely it was entirely his idea.</p>
      <p>As for whether that choice is authentic or reasonable, depending on the printing and inking, I have seen Jenson's periods look both more squarish:<br><a href="http://www.nonstaticdesign.com/files/images/content/jenson-eusubius.jpg">http://www.nonstaticdesign.com/files/images/content/jenson-eusubius.jpg</a></p>
      <p>... and more star-shaped:<br><a href="http://www.noamberg.com/thesis/blowrg/wp-content/uploads/2008/09/original-jenson-paragraph.png">http://www.noamberg.com/thesis/blowrg/wp-content/uploads/2008/09/origina...</a></p>
      <p>Though even the latter sample is not quite as star-shaped as Robert's Adobe Jenson.</p>
      <p>Cheers,</p>
      <p>T</p>
