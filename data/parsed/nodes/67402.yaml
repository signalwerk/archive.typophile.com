      <p>Poliphilus and Bembo would seem like obvious possibilities. Bembo, of course, is a fairly standard font on a lot of people's computers, while Poliphilus is not nearly so commonplace. Still, if you're going from Jenson to Aldus, then one might as well go all the way to the humdrum, and go with Garamond.</p>
      <p>In the opposite direction... Kelmscott and Cloister Old Style are possible, but I think you would have to be adventurous to want to have a whole book typeset in something like that.</p>
      <p>So what other interpretations of Jenson are out there? Quite a few, IIRC.</p>
      <p>LTC Jenson is much more like Jenson Oldstyle than it is like Adobe Jenson. And there's Phinney Jenson, Nicholas Jenson SG, Hightower, even Nicholas and Goodchild.</p>
      <p>For that matter, Centaur is widely available nowadays.</p>
      <p>Ah; there is also ITC Golden... and Monotype Italian Old Style. So many choices are currently available.</p>
