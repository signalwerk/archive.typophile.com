      <p>I just finished reading aloud to my daughter (over the course of a week or more) a lengthy children's heroic fantasy novel set in Adobe Jenson (Igraine the Brave). I thought it worked quite well, and was appropriate for the book. Of course, this was a children's book with a fair number of illustrations, so a fairly flavorful text face seemed just fine.</p>
      <p>I think Cloister Oldstyle would also be a fine Jenson-inspired choice. I'm also a huge fan of Arno Pro, and I'm sure it would work well in this context.</p>
      <p>Cheers,</p>
      <p>T</p>
