      <p>I mostly agree with Nick. If you have the possibility to emphasize the historical context with a graphic element –type– it's good sense to use it. In the opposite way, <em>for me</em> it would become strange to set a book with a typeface which resembles a historical period very different than that referred by the text.</p>
      <p>Of course, this is a very general approach. Many typefaces will not produce any association to a historic period except for people with knowledge on type or design. And the average reader would be unaware of these details. But as designer, I'd <em>prefer</em> to choose a type with some kind of link to the historical period of the text.</p>
