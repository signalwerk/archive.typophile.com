      <p><em>...the statement would make little sense...</em></p>
      <p>Type may not have been available in the distant past, but if one is trying to create an atmosphere of long ago, an old type is closer than a newer one.<br>
      Morris' Troy/Chaucer type was a typographic rendering of a pre-typographic style of blackletter script. Don't you think it was "correct" for his Chaucer, more so than the Golden Type? </p>
      <p>Sure, every historical work is written later than the events, by definition. But if one is trying to create a feeling in the reader of being immersed in another world, to the full extent that Tolkein did in plot, characterization, names and places, and even writing in an archaic manner--rather than a dispassionate historical analysis from a later date--why not also use typography that is similarly informed?</p>
      <p>That's not the only way to do it, of course. Led Zeppelin had Tolkienesque songs that were both acoustic (Battle of Evermore) and electric (Ramble on).</p>
