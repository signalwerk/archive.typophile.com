    html: |-
      <p>No doubt the idea of curving the straight bits came from Art Nouveau, but it evolved into Art Deco, through the efforts of people like Wiebking.</p>
      <p>Looking at the history of the Mennen brand, it adopted a version of this bendy style in the teens, and used it for the wordmark—and still do!—and in packaging and advertising typography in the teens and twenties.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/!BvRnOtg!Wk~$(KGrHqMOKjkEvOYsWMqGBMD5z53J3w~~_35_5728.JPG"></div><p></p>
      <p>Advertiser's Gothic is a tour de force by Wiebking, in which he managed to successfully integrate three design themes—curved straights, stencil, and vestigial descenders.</p>
      <p>Another face from the same era, Poor Richard, has the similar stencil effect:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/RedRooster-31299-s_3958.png"></div><br>
      <a href="http://www.ascenderfonts.com/font/poor-richard.aspx" title="http://www.ascenderfonts.com/font/poor-richard.aspx">http://www.ascenderfonts.com/font/poor-richard.aspx</a><br>
      Also stencil: Auriol.<br>
      Also very short descenders: Hobo.<p></p>
      <p>All those styles, or parts thereof, were lettered in ads, posters and packaging before being made into type, and again, who knows where they originated? They may even be considered design by a cadre of lettering artists bouncing themes around. “Poor Richard” was hand lettered on many a silent movie intertitle.</p>
      <p>Also in the same vein: Arts &amp; Crafts lettering, e.g. by Rennie Macintosh and Dard Hunter (1908):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dardhunterbrainsweb_6551.jpg"></div><p></p>
      <p>It’s doesn’t do justice to Advertiser’s Gothic to pigeon-hole it as inﬂuenced by Art Nouveau. All one can do is point out similarities—who knows what went through Wiebking’s head? Not even him, no doubt, and the only way he could ﬁnd out was to draw and cut the face, and then see what it looked like. </p>
      <p>Perhaps it could be said that it was inﬂuenced by Art Deco from the future — an emergent principle.</p>
