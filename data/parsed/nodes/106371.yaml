    html: "<p>Can't find a perfect match. Could be a custom job. I'd probably start from a Caslon and make it more contrasted by adding an outline stroke. Candidates for customization: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fontbureau/big-caslon\" rel=\"nofollow\">Big Caslon FB</a> (Carter &amp; Cone), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/garagefonts/freight-big-pro\" rel=\"nofollow\">Freight Big</a> JD, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/caslon-no-224\" rel=\"nofollow\">Caslon 224 ITC</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/caslon+540\" rel=\"nofollow\">Caslon 540</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/baskerville+old+face\" rel=\"nofollow\">Baskerville Old Face</a></p>"
