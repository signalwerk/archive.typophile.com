  html: "<p>Just a general question: <br> <br>I was in a pub the other night sitting next to an old photograph of Chicago's Lake Shore Drive from the late 1920s. The words on the roadway (not the signage) read from top-to-bottom. It seems these days it always reads from bottom-to-top (at least in the States). Anybody know when/why* this changed occurred? <br> <br>*I'm assuming it's because bottom-to-top is how you encounter the words while driving, but was there some sort of research, government committee, etc.</p>"
