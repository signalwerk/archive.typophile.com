    html: <p>The signs in Manhattan that are on the road do read Lane Bike, and Xing Ped. I think its because of the speed the cars go. A side note I can ride my bike faster across town than a car can go, but what the cars do is go as fast as they can between red lights. Why, I have no idea. </p>
