  html: |-
    <p>Hi everyone</p>
    <p>Any sugestions to what would be the best font to use in a Bible. The format will be pocket size so the size of the font will have to be small, probably between 6 and 7. Traditionally bibles have two columns, but i might use one since its quite a small format.</p>
    <p>So far have experimented with </p>
    <p>Warnock Pro (I like its optical font)</p>
    <p>Frutiger (a fresh and youth feel to it)</p>
    <p>Kepler </p>
    <p>Any more suggestions...</p>
    <p>Thanks</p>
    <p>Sorry, if i have post this in the wrong place, I am new to this forum...</p>
