    <p>Dear Typophiles,</p>
    <p>I'm creating a calendar as a table in InDesign and would like the cells of the header column (months) to have rounded corners on the left side. Is this possible or should I create the header column as a separate set of aligned boxes (not part of the table)?</p>
    <p>Thanks,</p>
