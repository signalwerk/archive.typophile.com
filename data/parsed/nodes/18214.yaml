    html: |-
      <p>Since regular old PostScript Type 1 fonts only had one space, and three dahes - hyphen, en dash, and em dash - when building OpenType fonts, it was not immediately apparent that one could add a dozen space and dash glyphs which already had Unicode indices. (At least, that's how it was for me; my last three releases have all of the spaces (and dashes) you mention.) There are so many great and sexy glyphs one can add to one's fonts, that one might overlook the basic and useful ones.</p>
      <p>So, the answer to you question is probably ignorance due to historical precedent. Practically, there is absolutely no problem adding the extra glyphs, and it takes mere seconds, so laziness is no excuse.</p>
