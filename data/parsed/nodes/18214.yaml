    html: |-
      <p>Although one could put such things in the font, unless your DTP app is smart enough to know that they are spaces, it will treat them all as non-breaking.</p>
      <p>If the DTP app is smart enough to know they're spaces, it's smart enough to just use those codepoints as control characters and not require them to be present in the font. It's not like they vary from font to font, anyway.</p>
      <p>I disagree with Chester's comments - we were well aware that there were these extra spaces, and I was arguing for putting them in Adobe OpenType fonts back in the late '90s, but I got outvoted for the reasons listed above.</p>
      <p>Regards,</p>
      <p>T</p>
