    <p>Recently I discovered that the few fonts I use are often lacking the different unicode characters for the different typographic spacings like EN space, EM space, thin, thick, mid, hair, etc.</p>
    <p>I was wondering why, I don't really mind adding these myself but it's still annoying since my DTP app does not have this layout feature.</p>
    <p>So is it:<br>
    -Lazyness?<br>
    -Practical reasons?<br>
    -Historical reasons?</p>
    <p>I'd like your knowledgeable input on that. :) </p>
    <p>Thanks!</p>
