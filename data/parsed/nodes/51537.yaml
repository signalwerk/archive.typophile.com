      <p>Thanks Aziz. Yes of-course. This can be one option of the package. But technically speaking, my idea is a bit more complex than that.<br>
      I don't urge operating system makers to go and shop around to see what free Arabic font is available and collect them. This is what users do! They will not do it and I don't want them to do it either.</p>
      <p>On the technical side, the fonts in the package has to go through serious and reliable tests in terms of their proper functionality on various platforms. For one thing for example, that Nasta'liq font doesn't have AAT and won't work on older Macs.<br>
      On the visual side, I'm not sure that font can meet the web clarity requirements, particularly on Windows platform.</p>
      <p>So what I mean is a serious concerted effort to produce a package with a credible stamp of approval. Otherwise, Linux may go for it, but not the two others.</p>
