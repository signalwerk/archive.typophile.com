    <p>I have an idea to chew on.<br>
    Let's produce a font, or a series of fonts specifically designed for the web. Then give the package to makers of operating systems, windows, mac and linux, to include in their system font package.<br>
    This way, the web designers will have the option to use fonts that a) work on any platform b) are optimized for web viewing, both in terms of clarity and in terms of balance between Roman and Arabic, while maintaining the integrity of Arabic script.<br>
    How about that Amsterdam?!</p>
