      <p>John I'd go with greyscale antialiasing if that is what is being done on the Mac. It is perfect for scripts with a lot of curvatures that in a small size can not simply be reduced to black and white pixels.<br>
      I know that it is partially a question of habit. I heard that some PC users were complaining that Safari on the PC is 'blurry'. So the habit may go the other way too. But definitively for Arabic script this should be a plus.<br>
      My suggestion of a font face similar tp Yagut is mostly because the design is fairly resistant in becoming jagged in small size. It's a fairly thick design and fairly geometrical. A finer typeface without antialiasing is a desaster in small size. I know it because a site is currently using a finer face (that I made and didn't put anything other than authohinting of FontLab) and it looks very nice on the Mac but pretty unusable on a PC (unless perhaps Safari is being used).<br>
