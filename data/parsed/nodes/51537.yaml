      <p>Hello friends,</p>
      <p>I came to this thread wondering what the best choices for Arabic web typography are. In particular I need a font that meets two criteria: </p>
      <p>1) the vertical proportions are the same between English and character sets, so that the line-height and letter-spacing propertes do not need careful tweaking.</p>
      <p>2) the font is licensed for web use (ideally to be embedded with @font-face)</p>
      <p>If this is not possible, which web-safe font should I use, and what is the most appropriate way to balance English and Arabic text on the page?</p>
      <p>I would love some references to Arabic web typography in general, I have spent an awful lot of time on this and can't seem to ever get something that makes everyone happy -- and really just wish to defer to someone else's best practices.</p>
