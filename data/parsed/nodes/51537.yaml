      <p>I guess I have to agree with Saad on this. For Arabic script, blanket antialiasing is the way to go. I know that there is a conceptual difference of opinion between two platforms in text rendering that is going on here that I fail to understand. But I can not fail my eyes. And my eyes tell me that to view properly an Arabic script, you need antialiasing. In fact, the goal of proper hinting of an Arabic web font should be to look like what it looks with antialiasing which of-course, may have the advantage of not having an unnecessary 'shadow' on a larger size. But to me, this minor advantage fades in the face of the fact that how limiting it has made the use of Arabic fonts on the web.<br>
      Arabic glyphs don't loose their curvatures in size 12. Pixels do. And it is for text rendering engine to resolve this obvious fact not the font.. in my opinion. But this topic is for solving a font problem which should not have been a problem to begin with.</p>
      <p>Now in a parallel discussion that we had on our community site, Aziz (not the same Aziz, another one!) has posted the pictures of a text on the Mac and Windows, with and without ClearType and antialiasing, produced by two or three different fonts. ClearType somewhat improves the unbearable state of the text on the Windows. My question is that how much more improvement can be applied to the fonts with proper hinting? In these samples, Geeza and Yagut are fairly thick fonts (although it's hard to believe it in some pictures!) and Zar is moderately fine.<br>
      <a href="http://balatwit.com/fonts/" title="http://balatwit.com/fonts/">http://balatwit.com/fonts/</a></p>
