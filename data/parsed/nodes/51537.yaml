      <p>Thanks John. No I have no idea about funding. But throwing the idea is a good start I hope.</p>
      <p>I was thinking of a 'package' of fonts because as you may have noticed, the idea of what constitutes a single good standard Arabic web font may vary substantially. So it's good that you mentioned two fonts because I think at least we need two typeface. One with basic ligatures for Arab users, another one without ligatures for mostely non Arabs. I don't know how much the language identification can be reliable for this on different platforms and different browsers. Besides, there may be an Arabic site that doesn't want to have ligature or vice-versa. Then of-course there might be different views about what style is more 'standard' for the web. I am leaning toward a simplified Naskh, something simialr to Geeza Pro and Yagut. Others may have other ideas. This is basically a topic for exploring the idea.</p>
      <p>There may well be that at some point, embedded fonts will be supported on all platforms and all browsers and web designers will be less dependent on system fonts. This also may be a solution for Arabic web situation, both for Arabic language and particularly for non Arabic languages. But it is certainly not a solution for quality font making.</p>
      <p>Hinting is generally a trade secret. I have no knowledge of it. Is hinting model as good as pixel display?</p>
