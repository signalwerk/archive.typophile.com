      <p>A system of fonts for the Web already exists:  The font system based on Unified Arabic (TM) created by my father, Nasri Khattar, is perfectly adapted to the Web as well as to all other electronic systems.  I have begun to pick up his work after a long hiatus following his passing in 1998.  The font system contains eight very different typefaces based on Unified Arabic.  Each contains 28 to 30 characters and are based on ASMO 449.  Some of them have already been designed *to automatically connect* without any additional ligatures; some of them do not connect, but are separate unified shapes easily read by anyone who can read Arabic characters - not just Arabs, as you know, but Kurds, Pakistanis, Iranians, and so on.</p>
      <p>I'm in the process of scanning samples and creating a new Web site.  I created just one page a few years ago on which you can see the Neo-Kufic (TM) form Khattar created in the page header.</p>
      <p>Please let me know what you think.</p>
      <p>Camille Khattar Hedrick<br>
      President, Daughter of Nasri Khattar<br>
      Unified Arabic, LLC</p>
