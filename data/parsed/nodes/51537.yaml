      <p>Dear Camille,<br>
      Sorry for the late response and thank you for your interest.<br>
      Since I posted this topic, I have changed my mind and I'm no longer looking for a solution for web font. I'm not familiar with your father's work but considering the timeframe, I suspect we are not talking about the same thing.<br>
      There was a time that the challenge was to produce Arabic text within the capabilities of the computers of the time. The challenge was to produce an Arabic text that could be printed on a dot-matrix printer for example. I'm sure that the work of your father could be greatly appreciated facing that challenge.<br>
      Now the challenge is to accommodate Arabic script natural beauty by the computers. It is no longer an issue of text adjusting itself to the technology limitations, but to adjusting technology to the text aesthetics and functionality requirements. And now I believe the solution doesn't start with the font but the text engine technology for Arabic script which is not geared to the natural behavior of Arabic script.<br>
      Regards,<br>
      Behnam</p>
