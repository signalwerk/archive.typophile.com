      <p>Dear Benham,</p>
      <p>Thank you for your kind response.  Yes, my father did create a style for the dot-matrix printer, of course!  It was just one of the many applications.  You knew that already.</p>
      <p>What I need to do is show the newer fonts that are connected, although based on Unified Arabic.  I am still working on finding funding to produce software from his original designs and then distribute them as widely as possible.</p>
      <p>Since he reduced the number of characters to only 28-30, and designed them to connect, it would be very simple to produced the seven or eight typefaces as software.</p>
      <p>His newer designs do in fact accommodate the natural beauty of Arabic script.  Unfortunately, I have a full-time job, and just don't have the time to do everything that needs doing.  I will keep logging in to this site to learn more and more about this field, which was my father's, but is not mine - I'm in marketing and communications.  </p>
      <p>I hope we can stay in touch.</p>
      <p>Sincere regards,</p>
      <p>Camille Khattar Hedrick<br>
      President and Owner, Unified Arabic, LLC<br>
      Daughter of Nasri Khattar</p>
