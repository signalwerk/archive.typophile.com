      <p>Thankfully fonts.com has arabic webfonts now, but we are still waiting on Google, which has a very fast and free font hosting network. I am also surprised that other companies like typekit.com have not started to support Arabic yet. </p>
      <p>However multilingual support improved vastly last year among webfont hosts, so I expect to see many Arabic webfonts any day. </p>
      <p>If you want to keep updated with one of Google's Arabic type development projects check out <a href="http://shashafont.com" title="http://shashafont.com">http://shashafont.com</a> —&nbsp;I think they are still working on it, though I'm curious why the project has not been moved to Kickstarter like some of their other fonts.</p>
