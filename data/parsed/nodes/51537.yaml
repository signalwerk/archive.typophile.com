    html: |-
      <p>Saad, blind autohinting seldom gives good results in any script, but it is possible to manage the autohinting by manually specifying alignment zones and standard stem weights, what I call semi-automatic hinting. Since Arabic tends to have a greater range of letter heights, controlling alignment zones is trickier than for Latin, but in general terms the relative efficacy of (semi-)autohinting is typeface dependent, not script dependent.</p>
      <p><em>Antialiesing gives best possible results.</em></p>
      <p>Antialiasing and hinting are not exclusive unless a particular rendering engine chooses to ignore hints completely (e.g. Apple's 'full-fuzz' Quartz rendering, which personally I can't stand). Most antialiasing makes use of hints in various ways.</p>
