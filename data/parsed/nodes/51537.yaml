      <p>You misunderstand. The rendering model used largely depends on the system or application, not on the font. For systems that offered both black and white bitmaps and greyscale antialiasing, it is possible to set flags in the font to turn on and off antialiasing at specific sizes and to apply or not apply hints. Colour subpixel rendering does not offer this option, and may selectively apply hints (MS ClearType ignores x-direction delta hints, for example) or ignore hints completely (Apple Quartz rendering). Also, different systems or applications may interpret the same hints in different ways.</p>
      <p>Some amount of hinting is desirable in pretty much any font -- unless one knows for sure that Apple Quartz rendering is the only environment in which the font will appear --, even if it is only to control vertical alignment zones. The kind of hinting we do for sub-pixel rendering environments tends to be quite minimal, concentrating on y-direction hints. Depending on the individual design, auto-hinting can sometimes take one a long way toward good results; other designs call for a lot of manual work.</p>
