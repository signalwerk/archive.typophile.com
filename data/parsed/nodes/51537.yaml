      <p>Well, while the initial idea, making optimized Arabic web fonts and somehow making sure they are present in all computer is still the best idea, at least for 'body text' and localized usage of applications, the CSS embedded font technology looked promising to me for the freedom of design that it provides. But it seems that it has a serious effect in webpage 'volume', particularly if it is an Arabic font (which should also include some Roman).<br>
      It seems that if this Typophile page has an embedded font for example, I have to load it each time I open this page, weather I already have the font in my computer or not. If that is the case, this is not a good substitution for the original idea. Considering how big an Arabic font would be, and how slow opening of a web page will get.</p>
      <p>As you see, we have to juggle between technicalities and aesthetics issues constantly... and getting nowhere!</p>
      <p>-------------</p>
      <p>But you are right. The current screens are not for reading books. I also am looking forward to see what will become of this 'reflective' screens technology. My point was simply that it is not out of ordinary to expect a font size on the screen as you would see on a book... and that there in a constantly increasing reading time spent in front of the screen.</p>
