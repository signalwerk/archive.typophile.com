    html: <p>Hinting isn't a trade secret (although the particular tricks and strategies and tools that individual hinters use may be). Hinting is, simply stated, a means of influencing outlines at specific sizes and resolutions in order to obtain a better rasterised image (rasterisation is the wrapping of outlines to pixel or other dot grids). The effects of hinting on the same outlines will, therefore, vary depending on the rasterisation model (binary pixel display, i.e. black and white, vs. greyscale antialiasing vs. subpixel colour antialiasing).</p>
