      <p>System fonts are not involved in this discussion. The only way that they are involved is that I want to get rid of them in web pages!<br>
      In the practical usage of Arabic script, at least from what I know from Persian and what I see in Arabic, vowels are assumed, not written. This applies to the application localized versions too. Generally the extensive usage of vowels requires larger font size to accommodate the visibility of vowels. Occasional usage of vowels in web text is mostly used when writer can not 'assume' that the reader would know the proper pronunciation of the word.<br>
      So my focus here for web fonts is not the vowels performance per se, but the characters clarity, which would also have a better rendition of vowels as a side effect. But the focus is on the characters themselves.<br>
      On applications with antialiasing, this visibility in small size is already achieved. The problem for web pages is that they can not assume the user has this facility. I think that there is no global solution for this situation and web designers should assume that the users have at least a rendering technology such as ClearType at their disposal. This will make the text at least readable, although the font face would loose all its specificity in small size.<br>
      The rest, I think, will fall on user shoulder to choose the proper tools for web viewing to his satisfaction. A font can not make miracle and if it could, it would be one single font with a lot of work. This limits substantially the web designer choice of page layout. It may well be that for Arabic web pages, the advent of embedded fonts would be the best and most practical solution. Although simplified Naskh is what I have in mind when thinking about web pages, the embedded font would allow all kind of styles, if the web designer see fit for his usage.</p>
