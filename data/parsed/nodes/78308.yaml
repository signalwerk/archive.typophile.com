      <p>Thanks for trying. It's certainly in the ballpark, quite similar in many ways... I was very hopeful when I started looking at it... but in the end it's not it. </p>
      <p>The G and A are quite different if you look carefully, as are the other letters, albeit more subtly.</p>
      <p>Can anyone else venture a guess or offer an idea as to what font this might be?</p>
