    [WARNING]  feature already defined: kern [C:/Documents and Settings/Fernando/Mis documentos/FontLab/Studio5/fontlab.fea 436]<br>
    [WARNING]  feature already defined: kern [C:/Documents and Settings/Fernando/Mis documentos/FontLab/Studio5/fontlab.fea 652]<br>
    [WARNING]  feature already defined: kern [C:/Documents and Settings/Fernando/Mis documentos/FontLab/Studio5/fontlab.fea 886]</p>
    <p>When i test the font (on illustrator) the kerning is not like i left it on fontlab.. the kerning space grows form this "ww" to this "w w"<br>
