    <p>I know there's a lot of topics about this error but I've looked everywhere and couldn't find a solution for my problem.</p>
    <p>Here's what's happening, as soon as I got this error when I tried to compile my font I tried doing some clean up on the classes but nothing worked so I've downloaded AFDKO and installed the macros on Fontlab, ran the AFDKO Kerning macro like a lot of people suggested and got a features.kern file but I don't know what to do now. What do I do with this file in order for Fontlab to let me generate the font without the overflow error?</p>
    <p>Thanks!</p>
