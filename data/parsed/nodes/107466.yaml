    html: |-
      <p>Well, maybe. I don't use the Adobe AFDKO routines.</p>
      <p>How I'd make a try if I wanted everything inside FontLab for some reason: using the Fontlab OT Features panel, write off the features file -- in effect, you're writing off a simple text file, which will have .fea as a file extension. Should be in the FL manual if I've been unclear.</p>
      <p>With a text editor, delete all the *data* in the kern feature in that .fea file, leaving the formal "feature" code only. Now, copy &amp; paste the kern data from the AFDKO into the .fea file, where the old kern data use to be. Save, read it (the edited .fea file) back into FontLab, then compile. (BTW -- If you're classes are in the .fea file, make sure you have reset "classes" in FontLab.)</p>
      <p>But as I understand Adobe's approach, you should be able to just do everything with the Adobe AFDKO routines to make your OpenType fonts. In effect, you use FontLab for drawing only.</p>
      <p>I use FontLab for everything, so have had to avail myself of Karsten's script. Which works fine; I think it is US$80 now. Well worth it to me. Karsten's one of the good guys -- he has other scripts too, almost all of which are free.</p>
