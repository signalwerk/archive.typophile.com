    <p>Current <span class="caps">URL</span>:<br><a href="http://www.myfonts.com/fonts/canadatype/coconut/">http://www.myfonts.com/fonts/canadatype/coconut/</a></p>
    <p>Designed by <a href="/node/add/wiki?edit%5Btitle%5D=Patrick%20Griffin" title="Create node &quot;Patrick Griffin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Patrick Griffin</a> 2006</p>
    <p>Published by <a href="/node/21001" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Canada&nbsp;Type</a></p>
    <p>Coconut is a round and heavy unicase font with the techno, squarish, grid-based squeeze that of late seems part of almost every contemporary pop designs. It works as the 21st century display substitute to tired last-century horses like Frankfurter, <span class="caps">VAG</span>, or the rounded Helveticas, Futuras, and <span class="caps">DIN</span>s out&nbsp;there.</p>
    <p>Coconut and Coconut Shadow come in all popular font formats, with a complete character set that is loaded with alternates. Check out the character map for a real techno&nbsp;treat.</p>
