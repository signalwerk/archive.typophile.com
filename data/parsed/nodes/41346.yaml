    <p>Current URL:<br>
    <a href="http://www.myfonts.com/fonts/canadatype/coconut/" title="http://www.myfonts.com/fonts/canadatype/coconut/">http://www.myfonts.com/fonts/canadatype/coconut/</a></p>
    <p>Designed by <a href="/wiki/Patrick%20Griffin" class="freelinking" rel="nofollow">Patrick Griffin</a> 2006</p>
    <p>Published by <a href="/wiki/Canada%20Type" class="freelinking" rel="nofollow">Canada Type</a></p>
    <p>Coconut is a round and heavy unicase font with the techno, squarish, grid-based squeeze that of late seems part of almost every contemporary pop designs. It works as the 21st century display substitute to tired last-century horses like Frankfurter, VAG, or the rounded Helveticas, Futuras, and DINs out there.</p>
    <p>Coconut and Coconut Shadow come in all popular font formats, with a complete character set that is loaded with alternates. Check out the character map for a real techno treat.</p>
