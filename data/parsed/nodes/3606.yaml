    html: "<p>Here's another: <br>The Visible Word : Experimental Typography and Modern Art, 1909-1923, by Johanna Drucker <br> <br>I was reminded of it by Armin's post -- like Heller, Drucker attaches great importance to the publications of early 20th C art movements. She also argues that the integration of text into (some) modern art which occurred at that time subsequently went missing, with the unfortunate result that Post WW2 modernism, especially the NY school, slipped into a polarized void, with critics supplying all the words, and the art becoming a dumb, shallow,  conceptual second fiddle.  <br>Anyway, that's how I remember the book from reading it a few years ago, so she might actually have said something quite different.  </p>"
