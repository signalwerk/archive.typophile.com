    html: "<p>I hope people who are more book-savvy (like Tiffany) will help you out, I'd just like to point out a very interesting -but hard to find- book that illustrates tangible parallels between type and art/architecture: <br> <br>\"The letter as a work of art; observations and confrontations with contemporaneous expressions of art from Roman times to the present day.\", by G Knuttel, 1951. <br> <br>hhp <br></p>"
