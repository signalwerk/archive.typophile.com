    html: "<p>K, <br> <br>Not exactly what you are looking for, but Steve Heller's <a href=\"http://www.amazon.com/exec/obidos/ASIN/0714839272/speakup-20\" target=\"_blank\">Merz to Emigre and Beyond: Avant-Garde Magazine Design of the Twentieth Century</a> presents a really good case for the importance of design in the advancement and representation of avant garde groups.  <br> <br>I was about to go on a long explanation, but you can read <a href=\"http://www.underconsideration.com/speakup/archives/001686.html\" target=\"_blank\">a review I wrote on it on my site</a>. (Sorry for the blatant self-promotion).</p>"
