  html: "<p>Generally, I'm interested in typography. Professionally, I'm a software programmer. Privately, I am, among (a few) other things, a lover of design with typography near the top of the list of favorite design disciplines. I'd been searching for a specific book for the better part of a year, when a friend suggested I look for a forum discussing typography to ask experts and enthusiasts my question:  <br> <br>Is there such a book (or, hopefully, books) which look at:  <br> <br>- How cultural, social, economic, political trends have impacted the use of existing typefaces and design of new typefaces, and <br>- Conversely, how uses of existing and new typefaces have, through the course of history, affected communication and expression, and impacted greater cultural, social, economic, political trends? <br> <br>My interest is pretty broad: a historical account, a contemporary analysis, theory. I'd be interested in a couple of other related topics, such as the crosstalk between typography and other design disciplines, or at what time and in which contexts were specific design elements and forms in specific glyphs or whole typefaces introduced.  <br> <br>A rather broad description. Any hits in the vicinity would be appreciated, as is your patience to simply read this post.  <br> <br>Much thanks,  <br>KLS</p>"
