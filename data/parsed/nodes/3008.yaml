    html: <p>Below is a collage of a few city seals/logos that I collected from California. I don't know if this is done nationwide, but most cities in California have a unique seal/logo. Very few of these seals are done well. Believe it or not these are some of the better ones. <br> <br><img src="http://www.typophile.com/forums/messages/29/26085.jpg" alt="City Seals"> <br> <br>Hopefully, you'll be able to use these in your argument for Oldenburg. If not, you may consider going to a larger government body and pursuing a larger volume of work by selling this same type of identity campaign that California has. Initiate a nationwide identity campaign where each city has its own seal, or the equivelent. <br> <br>Similarly, the US is implementing a program where each state has its own coin (25 cent quarter). These types of programs are appealing to the central government and the individual states. It allows states to identify their unique character and pride, but it does so on a centrally/federally controlled medium. Uniformity allowing for individuality</p>
