    html: <p>At the National Gallery of Art in Washington DC, they recently had an exhibit of the artist Romare Bearden. His mural for Berkeley California had a element that was taken out as a logo for the city. <a href="http://www.ci.berkeley.ca.us/civicarts/registry/R-Bearden.htm" target="_blank">Here</a> you can see unfortunately tiny versions of the mural and logo. The original mural and the element taken out as a logo are powerful. I imagine that a bit bigger the logo would be very good, but I don't know. <br> <br>The original element is a profile of the four peoples involved in the city - Native Americans, and those with ancestry in Africa, Europe, and China. All four profiles are iconic and respectful, rather than caricatures. <br> <br>I would think that ideally a city logo would have this kind of strength and historical associations.  <br> <br> </p>
