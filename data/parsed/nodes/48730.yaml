    html: <p>That 't' is not far from the 't' in FF Netto (see to your right). The rest is a lot like <a href="http://www.fontshop.com/fonts/singles/creative_alliance/myriad_pro_regular/?sample_text=pixiestudio" rel="nofollow">Myriad</a> with some trimmed vertical strokes.</p>
