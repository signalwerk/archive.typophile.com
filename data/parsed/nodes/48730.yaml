      <p>Thanks, Stephen. I noticed the similarity with FF Netto but this typeface is less condenensed and more rounded. You really make a good point about Myriad. I couldn't see that before you mentioned it. I guess the person who design this has done pretty good job. </p>
      <p>My next typeface on the list is probably <a href="http://www.fontshop.com/search/?q=neo+tech&amp;x=0&amp;y=0" rel="nofollow">Neo Tech</a> by Sebastian Lester.</p>
