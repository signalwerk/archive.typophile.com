    html: <p>Computers are not magic faeries who can sprinkle dust on a complicated drawing and convert it into a working outline font. Getting this font right is going to take a LOT of work. Optimize the outlines as a font-wide action (you’ll have to use trial-and-error to get the settings right) and then you’ll have to spend a few days (seriously, this can take days) checking and tweaking <em>all</em> of the outlines to fix curves that warp in on themselves, doubled points, bad inflections, curves that go the wrong way, etc.. If this is a school project and you have a really tight schedule it might even be worth starting over with something simple.</p>
