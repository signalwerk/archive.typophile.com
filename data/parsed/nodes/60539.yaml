    <p>I'm creating a font that was initially really messy since it was created with a calligraphy brush (my typography professor is going to kill me for creating this "messy" font, hah!)</p>
    <p>well' Ive since vectorized them and started to bring them into fontlab. however, for some reason it's showing this strange outline on the inside when I open up font book or preview it.  When I type using the font, it doesn't show this. here are some screen shots:</p>
    <p><a href="http://localhostr.com/files/452fd2/Picture+1.png">http://localhostr.com/files/452fd2/Picture+1.png</a><br>
    shows the weird glitch, they are really small white spots, they look very unattractive. </p>
    <p><a href="http://localhostr.com/files/b16da7/Picture+2.png">http://localhostr.com/files/b16da7/Picture+2.png</a><br>
    the selected, you can clearly see there are no points on the inside</p>
    <p>I'm assuming it has to do with the messyness of it, but on install this would look every unappealing, any ideas?</p>
