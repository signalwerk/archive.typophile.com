  html: |-
    <p>Thought I'd mine the knowledge of you experts for some counsel.<br>
    I'm currently on the hunt for a potential replacement for Adobe Caslon for magazine body copy.</p>
    <p>We'd like to have something a little narrower ideally, to save space, and it would be nice to freshen up the characters. I've done what has felt like a lot of research, but have come up disappointed by the lack of Caslon-esque oldstyle faces available—especially in a useful range of weights. I think the closest thing I've come to an enjoyable solution is Sabon Next.</p>
    <p>Anyone have other ideas or info about anything being currently worked on?</p>
    <p>Appreciate any direction</p>
