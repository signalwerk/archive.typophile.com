    date_raw: 18.Mar.2005 1.50am
    votes: null
    html: "<p>While we're on the subject, I've had a few problems with font naming in TTPro. Conversions from PCT1 to MacT1 of Carter &amp; Cone Galliard came out of TTPro weirdly named and apparently in the wrong suitcases (InDesign could only find a couple of the fonts -- a couple more it found, but couldn't find outline data for). <br> <br>Screenshot 1: The original PCT1 fonts going into TTPro. Everything looks good in the conversion pane, all in the right place and properly named etc. <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/67633.jpg\" alt=\"Screenshot 1\"> <br> <br>Screenshot 2: This is taking the output MacBinaries and plugging them straight into the front end of TTPro again. Everything's a bit of a mess on the left (reflected by the fonts' behaviour on the Mac). <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/67634.jpg\" alt=\"Screenshot 2\"> <br> <br>I'm guessing this is to do with my lack of knowledge of naming schemes etc., but I'd appreciate any help. <br> <br>FWIW, to get the job done I went back to ol' Crossfont, which handled everything quite happily. <br> <br>Robert <br> <br>(Sorry about the big jpegs)</p>"
    html_clean: "<p>While we're on the subject, I've had a few problems with font naming in TTPro. Conversions from PCT1 to MacT1 of Carter &amp; Cone Galliard came out of TTPro weirdly named and apparently in the wrong suitcases (InDesign could only find a couple of the fonts -- a couple more it found, but couldn't find outline data for). <br> <br>Screenshot 1: The original PCT1 fonts going into TTPro. Everything looks good in the conversion pane, all in the right place and properly named etc. <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/67633.jpg\" alt=\"Screenshot 1\"> <br> <br>Screenshot 2: This is taking the output MacBinaries and plugging them straight into the front end of TTPro again. Everything's a bit of a mess on the left (reflected by the fonts' behaviour on the Mac). <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/67634.jpg\" alt=\"Screenshot 2\"> <br> <br>I'm guessing this is to do with my lack of knowledge of naming schemes etc., but I'd appreciate any help. <br> <br>FWIW, to get the job done I went back to ol' Crossfont, which handled everything quite happily. <br> <br>Robert <br> <br>(Sorry about the big jpegs)</p>"
