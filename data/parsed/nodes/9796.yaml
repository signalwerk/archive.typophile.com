  html: |-
    <p>Hi, <br>I've just downloaded and installed TransType Pro 3.0.1 for Windows (trial version). <br> <br>I'm using the software to fix some naming issues in T1 fonts. <br> <br>In fact I'm performing a Win T1 --&gt; Win T1 tranformation, editing family names, font name, etc. <br> <br>The problem is that the resulting pfm files are (all) 1 KB so I suppose I'm losing kerning data in the tranformation... <br> <br>Of course trial version has some limitations (50% of glyphs are modified and TrT logo is embedded) but this is probably a bug. <br> <br>What do you think about it?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/20573" class="topic-previous" title="Go to previous forum topic">‹ Transtype and .vfb files.</a> <a href="/node/20521" class="topic-next" title="Go to next forum topic">Adding Hyphenation dictionaries in Ind ›</a></div>
