  html: |-
    <p>A client wants to make a website and use one of my fonts.</p>
    <p>He wants that his clients can make changes in certain documents on his website in the right fonts and print out the document they've corrected in the right fonts.</p>
    <p>The client himself will put the fonts on one webserver. Further, his clients won't be able to use the fonts, other than to print out the document.</p>
    <p>This situation falls into a grey area.<br>
    Presently, my EULA does not allow editing and printing of documents from an unlicensed remote location, the idea being that this constitutes typesetting, and that as such it requires a font installed at that location, and a licence for that.<br>
    However, it's arguably not really typesetting, as the document (de facto, a form) is already formatted.<br>
    So I am inclined to believe that this situation should be permissable, although it will require a separate licence, or an amendment to my basic EULA.</p>
    <p>What do you think -- is it a good idea to allow this kind of use, and if so, should there be a special fee for it?<br>
    If so, it would be a one time fee, rather than a per end end user fee (too much bureaucracy there). For how much?</p>
