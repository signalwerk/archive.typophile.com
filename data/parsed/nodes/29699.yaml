      <p>This is actually something I have been in discussion with one of my clients. I can't go into specifics right now, since nothing is for certain. It is slightly different because it is granting a much larger online use of fonts for printing purposes.</p>
      <p>It will be (if I get my way) an online design service that has a good selection of real fonts from reputable foundries. Any user can use the fonts and then print to the service. From the foundries I have been in discussion with there will definitely need to be a special license for such use. It is much more broad then what you are talking about Nick, but the premise is the same.</p>
      <p>This is an especially pertinent topic due to the larger amount of online applications being developed. When Google and Microsoft start releasing online office apps, it may get real interesting. I think there is a lot of opportunity right now.</p>
      <p>Shu</p>
