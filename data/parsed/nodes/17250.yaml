      <p>At my day gig we use MathType. Making equations is very quick and intuitive, but placing the resulting .eps files in my InDesign documents often requires a good bit of tweaking (baselines, etc.)... Especially if you don't want to use Times.</p>
      <p>I've been longing for a sans version of Symbol for ages now, I might just have to make it myself.</p>
      <p>--Michael.</p>
