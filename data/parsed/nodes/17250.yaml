    <p>I am working on a textbook which had a few mathematical fractions and equations in it - such as a bracketed fraction multiplied by another fraction etc. I am finding this quite difficult.. </p>
    <p>I was wondering if anyone had any advice on creating nut fractions in particular and any general tips in Indesign CS.  I don't have Indesign CS 2, apparently it makes things easier for numerical data.</p>
    <p>Many thanks<br>
    -Cheryl (new typesetter/production assistant)</p>
