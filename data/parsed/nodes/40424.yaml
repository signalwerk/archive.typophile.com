    html: |-
      <p>Thanks for the responses! They help a lot...</p>
      <p>I was worried that is was a little... harsh. Now that I think about it, I have no idea why I chose RED of all colors :) I think that if I changed the color to a green or blue that would soften it up alot... I also have some other devices that can go in the "O"--for lack of a better term, the star does look somewhat...communist. </p>
      <p>As far as the "feather" thing goes... I don't have a great reason for it to be there... It is an allusion to heraldry, something older (legacy). It is also there to soften up the look a bit, because Avant Garde is a bit hard.</p>
      <p>I have to walk a fine line, making it appeal to educators who actually bring the program into schools, and still making it appeal to students across a wide range of school cliques... </p>
      <p>The powers that be in our organization haven't told me outright, but I have a sneaking suspicion that they would like me to use Comic Sans... ahhhh.</p>
      <p>I will repost when I've made revisions...</p>
