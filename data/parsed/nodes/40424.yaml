      <p>Here is what I think as a design graphic student ;)</p>
      <p>Avant Garde is a very-seen typo. And, alone (without "The Power Of One"), maybe the "Rachel's legacy" may be not as stronger as it could be!</p>
      <p>I think the written part of the logo, The Power Of One, is quite powerful and efficient. It even may be too powerful for logo part "Rachel's Legacy" shown here.</p>
      <p>The graphic part of the logo (the shape next to the word LEGACY) is confuse for me. I'm not convinced what exactly it is when I see it, even if I look with some attention. Is it a feather?</p>
      <p>If I understand, Rachel's Legacy is an organization named after the first victim of the crime at Columbine High School on April 20, 1999. I would care about not using icons of violence and weapons. Maybe the O of "ONE" with a star in it may refer to some roundel or a target. I would even think about that some people may think that the feather-like shape next to the word LEGACY is a blood stain... :S</p>
      <p>But I don't know, I'm not a designer yet, I'm just a student... :(</p>
      <p>-----------------:<br>
      Jean Chouinard</p>
