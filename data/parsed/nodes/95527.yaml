      <p>My remarks about exposure and participation weren’t about making Typophile the new Facebook.<br>
      They were meant to be a reminder that in order for any community* to survive (and hopefully thrive) there need to be a critical mass (however small) of people involved, and thus a certain rate of new people “replacing” those that became less present.<br>
      As for diluting (<a href="http://typophile.com/node/95976#comment-520672" title="http://typophile.com/node/95976#comment-520672">http://typophile.com/node/95976#comment-520672</a>), the advantage of exposure would be to remind the people that already know about Typophile that it’s a good place to hang around. And with enough interested people (and some fair moderation), the specificity of the matters discussed would filter off the excessive noise.</p>
      <p>* or resource.</p>
