      <p>Typophile is a sort of altruistic place, but if making a bit of extra money is the only way to get Punchcut's head back in the game, so be it. BTW, I don't think there's a lack of exposure; virtually anybody who designs type -or even starts dabbling in it- already knows about Typophile, and I personally don't want to see an invasion of broader graphic design.</p>
      <p>I'm probably repeating myself here and there, but here are some things I'd propose:<br>
      - Don't panic.<br>
      - Get the search working, or at least let Google back in.<br>
      - If Google is given access again, figure out the spam situation.<br>
      - Charge some sort of membership fee for heavy use.<br>
      - Charge a nominal "barrier" amount for type ID requests.<br>
