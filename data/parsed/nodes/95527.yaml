    html: |-
      <p>Some random considerations:</p>
      <ol>
      <li>Time-limited editing of posts was already implemented (albeit it could be circumvent if one knew how) until the last “temp” iteration. However understandably this was applied to “comments”, not to thread-starting posts.<br>
      This happened before: features lost because of a “system upgrade”. Once were “smart” quotes, then “featured font” headings, and so on. Which brings me to the second point.</li>
      <li>This site is built on Drupal. Drupal is hard. <div class="imageWrap"><img src="http://typophile.com/files/drupal-learningcurve_5673.jpg"></div> Drupal is the typical example of something built to be everything to everyone, ending up being not enough for anyone.<br>
      So, you use plug-ins to add features. Then you upgrade Drupal and plug-ins stop working. Goodbye features.</li>
      <li>Same problem with moderators. Forum moderators need specific, limited permissions. Probably this kind of privilegies management is built-in in forum software. Not so in Drupal. I know for sure that one reason there aren’t more moderators it’s because of this problem.</li>
      <li>About the “read more link on long posts to avoid long scrolls”, please don’t. There is a (still*) working feature which is that if you click the “new” link (instead of the “title-of-thread” link) you will be sent to the first unread post on the thread.</li>
      <li>I already have expressed, more than once, that the first, life-threatening issue which need to be addressed is the disappearance from search engines. The rest is secondary.</li>
      </ol>
      <p>* Except for threads with files attached to the initial post.</p>
