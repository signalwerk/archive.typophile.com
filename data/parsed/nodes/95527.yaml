      <p>Random thoughts:</p>
      <p>I'm not sure if there was more money available that things would change. Convince me otherwise.</p>
      <p>Every iteration of Typophile, no matter how "improved," hobbled or disabled something that was well liked and fully functional. How long do you expect loyal and long-time users to put up with that?</p>
      <p>I used to subscribe to a newsletter about English language usage, but the price was high. Even worse, the articles were so damned "correct" they were boring and uninteresting. So I never renewed. I do subscribe to a computer newsletter (Windows Secrets), which has a free section and a paid section. I subscribe to the paid section, and users determine how much to contribute. I used to go to the NY Times daily. Now I only go there as a result of a search, or a link from another site.</p>
      <p>Should Typophile remain free? A "first 10 posts" free model would not prevent one-time annoyances or do-my-homework posts. How about read free and contribute what you will to post for a year (with a $X [$2-5?] minimum, and with "membership badges" for those who contribute over a certain amount.) I was recently directed to a site that said something like "You have to be registered to read this article. Registration is free." It annoyed the crap out of me. Since I already had the answer I wanted, reading the article was for my own information and pleasure, and the site was one I wouldn't come back to, I declined to register. Others may have higher or lower annoyance levels.</p>
      <p>Would someone please explain (or point me to an explanation) of just what the relationship is between Punchcut and Typophile?</p>
      <p>What makes Typophile so wonderful are the people on it; what makes it so bad is the dysfunction of the web design. Based on the website, I'd never use Punchcut for anything.</p>
      <p>As for Search, what about using Google Toolbar with the "Search this site" function?</p>
      <p>Pissing contests and rancor come with the territory. Really obnoxious or serial offenders should be warned, and barred if persistent.</p>
      <p>Since it's impossible for a moderator to read every single post (to find inappropriate/offensive material), how about a "Report" link on the bottom of posts?</p>
      <p>"We don't need people like that," "get rid of the freeloaders," are attitudes that will kill Typophile.</p>
      <p>Require all posts to be previewed; that will reduce the need to edit.</p>
