    <p>Recently I’ve notices a bit of discussion about the demise of Typophile &amp;c. and I’ve detected a bit of a pattern: Rather than propose solutions, people seem to be bitching, moaning, arguing, leaving, and even deleting content. This thread is an attempt to help move things in a positive and productive direction:</p>
    <p>1. Deleting posts does render a thread somewhat useless, and will certainly cripple us. Obviously, the result is a terms of service agreement. Anyone have any lawyer friends?</p>
    <p>2. Today’s newbs are lacking. Agree, but why? One reason IMO, because we’re “well known suckers” for doing their homework. Just stop doing it and help them help themselves. You’re stunting their growth and pissing in your own pool.</p>
    <p>3. Search engine: find a coder.</p>
    <p>4. Banner: find a no-Flash solution (and a coder)</p>
    <p>5. Site re-design: Finish it. I will help. Just email me.</p>
    <p>6. Content: Work on the Wiki. I can help. Just email me.</p>
    <p>7. Moderators: if the were a more active presence, I believe this would help new users feel more comfortable participating lest they step into the middle of a cat-fight. This does of course raise the point of being mindful of of over-moderating, and deterring participation, but that doesn’t mean we can’t attempt to find a solution.</p>
    <p>8. A “read more” link on long posts to avoid long scrolls.</p>
    <p>9. Automatic turning of email addresses into links that launch an unwanted, and often unused, email client. This was considered poor practice 20 years ago.</p>
    <p>Please feel free to add more. An to those with the power to make any of these changes, my supervisor has a rule of sorts: “If it takes less than 2 minutes, do it now.” Many little changes can add up.</p>
