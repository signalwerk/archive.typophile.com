      <blockquote><p>In the 2 years or so that I've been here, I've never had the feeling that Typophile was welcoming to newcomers.</p>
      <p>When new people introduce themselves, there's rarely much of a response. When students post a "what's this font" or "help me with my homework" post, they are viewed by some as a nuisance to be gotten rid of, rather than as potential members.</p></blockquote>
      <p>In my experience Typophile has treated new people with the same respect granted others, in that when a serious question is posed or discussion started, detailed and helpful responses are forthcoming. I have very limited experience with other web forums but I do not know what people expect from merely introducing themselves; if you walk into a room of a strangers, many of them professionals and all with a common interest, they will likely welcome you but if you have nothing to contribute and no questions, what more should you hope for?</p>
      <p>As for font ID requests, there is a well established section of the forum to deal with those.</p>
      <p>In my fairly limited experience in the wider font community, most people working in the industry have had to learn everything from the ground up, learning and often innovating new technologies as they go. This is knowledge that people are generally willing to share but only when it comes to people that are interested in pushing their own understanding further. When people come on here asking for the benefit of knowledge that everyone else has worked hard to acquire, without appreciating how to get there or why, I am not surprised that responses are limited.</p>
