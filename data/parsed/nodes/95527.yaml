      <p>Unfortunately, as you’re probably well aware Riccardo, that list is sorely out of date. Most of those folks stop by Typophile now only once every couple of weeks, it seems. Some haven’t been here in months. And Dan and Stephen (who have visited recently) have only partial privileges, which may not include spam moderation.</p>
      <p>As far as I know, I’m the only person who regularly checks for spam: daily — at least once in the morning, sometimes more depending upon my day. </p>
      <p>You won’t see my name on that Moderator list because when I volunteered I specifically told Jared I wasn’t interested or willing to be a moderator (i.e., an arbiter of behavior). And I didn’t want anyone contacting me with their problems.</p>
      <p>I volunteered to be a Janitor and clean up spam, double-posts, etc., because at the time Typophile was having a major spam problem (and you thought it was bad now) and the only folks able to do anything about it all lived in the same time zone (Pacific, UTC -8). I live in Eastern, UTC -4, and Florian came on to pick up some of the slack in Berlin, UTC +1.</p>
      <p>But in the past year or so, it looks like things have dropped back to only one time zone. So, depending upon when the spam gets posted, it may stay visible for up to 24 hours.</p>
      <p>As it so happens, I’ve recently informed Jared and Joe that I will step down from my janitorial duties as of next weekend, Sept 1. It has become too much of a time suck and I wish to apply myself in other directions right now.</p>
      <p>I don’t know if Jared has made any other arrangements yet. I certainly hope he does. I’ve put forward some suggestions. As I said before, I’m sure there will be no lack of volunteers. But it’s a matter of who the Punchcut guys wish to entrust and how they want to manage that. At the end of the day, it’s their site.</p>
