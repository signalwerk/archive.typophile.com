      <p>I myself spent more than a thought about the viability of a Kickstarter funding in order to reignite Typophile. It would  be beneficial from a technical perspective: make it works as a platform (which means the forum, but also typographic education, Type Battles, and, yes, Type ID too). One could also hope it would sparkle some publicity, raising a wider interest in Typophile.<br>
      But, apart from the difficulty of defining the scope of a Kickstarter project (and the reward tiers for backers, etc.), I think that, even if successful, in the long run it will not be a real solution.<br>
      As I see it, the main problem with Typophile (and any website for that matter), lies in maintenance. This means long term commitment and daily overseeing. And that’s not something one can really fund.</p>
