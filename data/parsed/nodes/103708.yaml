      <p>Ryuk, thank you for the information and your help. I think I will stick with United. I have Haymaker but don't care for the spurs (I think that's what they're called). I don't want to modify it either, but Liberator looks nice and I may consider it for future use. </p>
      <p>Side note: Do you know of a type face close to the one featured here: <a href="http://jenbpeters.com/Billabong" title="http://jenbpeters.com/Billabong">http://jenbpeters.com/Billabong</a><br>
