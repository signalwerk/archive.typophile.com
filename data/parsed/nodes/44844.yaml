      <p><strong>edi·to·ri·al |ˌediˈtôrēəl|</strong></p>
      <p>adjective<br>
      1 of or relating to the commissioning or preparing of material for publication <em>: a pillar of scholarly publishing and editorial excellence.</em><br>
      · of or relating to the part of a newspaper or magazine that contains news, information, or comment as opposed to advertising.<br>
      2 of or relating to a section in a newspaper, often written by the editor, that expresses an opinion <em>: buoyed by yesterday's editorial endorsement.</em></p>
      <p>noun<br>
      a newspaper article written by or on behalf of an editor that gives an opinion on a topical issue.<br>
      · the parts of a newspaper or magazine that are not advertising.</p>
      <p>Dictionaries are useful. ;)</p>
