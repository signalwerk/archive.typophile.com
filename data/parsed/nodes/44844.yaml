      <p>missgiggles, yes obviously on a newpaper or magazine's web site the same distinction (editorial vs promotional) would apply. But IMHO it could also apply to a web site such as Design Observer which has written articles. </p>
      <p>I would not apply the term "editorial" to just any web site, certainly not to social networking sites like Facebook, portals such as Yahoo, or utterly inane sites like Twitter. Definitely not to commerce sites, altho Amazon contains some editorial content (the reviews), as do sites that review, say, digital cameras. Those sites probably have staff editors working specifically on editorial content.</p>
