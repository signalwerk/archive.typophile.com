    html: <p>Editorial content in magazines refers to the part of the magazine the editor is responsible for. It's the portion of content that isn't advertising. It's the part of the magazine that is meant to attract readers who, presumably, will also look at the ads. From the point of view of the editorial staff, the ads only exist to support the editorial content. From the point of view of the advertisers, the editorial content only exists to attract potential customers to see their ads. There is usully some antagonism between the two. ;-)</p>
