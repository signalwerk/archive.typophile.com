    <p>It’s kind of a black letter but joined together. I got the inspiration from seeing some badly set text. </p>
    <p>It’s at a really early stage. I'm just a little unsure about the whole thing. Sometimes I like it; sometimes I think it just isn't going to work. </p>
    <p>The fully finished version is going to use a lot of contextual alternates to get around some of the problems. It’s just the general construction of it I need help on and some good advice from people more experienced than me.</p>
