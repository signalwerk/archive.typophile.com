      <p>overall, it's super klutzy in a way that's really interesting.</p>
      <p>it kind of reminds me of the fake blackletter the nazi party commissioned for WW2 communications in germany. you might research that period if you're looking for more shapes. there's a lot of examples in a biography of renner written by christopher burke and published by princeton architectural press.</p>
