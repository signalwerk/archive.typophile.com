      <p>I like this a lot.  I imagine this font on a vintage tourist brochure from the early 1960s for a Bavarian castle. </p>
      <p>I think it would look a lot better if you made the letters more consistent:</p>
      <ul><li>the i is too short -- the dot should be above the x-height, like in the j</li>
      <li>the spacing between dot and main letter stroke should be the same in the i and j.</li>
      <li>The descenders of the y and the g look like streched versions of each other; they should either be identical or be very different.</li>
      <li>The widths of the bowls of the m are different, they should be the same.</li>
      <li>Either the w is too narrow or the m is too wide -- they should have similar widths. </li>
      <li>The heights of the verticals in the w should be consistent; or at least the first and the last should. </li>
      <li>The x seems to stand out a bit; I would maybe pull ideas from the k for the x.</li>
      <li>The z is too tall.</li>
      </ul>
