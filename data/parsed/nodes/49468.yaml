      <p>Cheer up. You're not stuck with Arial Unicode. The vast majority of your users will have professional Simplified Chinese fonts on their system. Windows users will have SimHei or MSHei for example.</p>
      <p>So you just need to specify a number of these widely available fonts in your stylesheet, and the vast majority of your users will be able to find a font in their system that matches at least one of the choices. I highly doubt you'll be able to find native Chinese-language content on the web that specifies Arial Unicode as the first-choice font family.</p>
      <p>Arial Unicode is a fallback font. It allows Simplified Chinese to be displayed on systems that cannot find dedicated fonts. Otherwise they'd appear as boxes. That's a powerful raison d'être in itself, but it's also pretty much the extent of Arial Unicode's usefulness.</p>
