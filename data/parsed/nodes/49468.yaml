      <p>@jongseong Thanks for the info! This is very helpful. As far as Arial is concerned, I'm unfortunately stuck with it for now - as this is a web project and Arial Unicode is widely available on most platforms. If I can find something better that supports hei, I can embed those characters and not have to look upon Arial again :) </p>
      <p>In this day and age, it really is unfortunate that we're still limited to the same 6 fonts on the web. HTML 5 promises to help somewhat on that front, but I still think there are better solutions that need to happen...like a mandate stating that all ugly fonts need to be destroyed. Everywhere.</p>
      <p>--<br>
      D Molanphy</p>
