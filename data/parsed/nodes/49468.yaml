    html: |-
      <p>Korean fonts in general won't have Simplified Chinese characters, so they will be useless for Mainland Chinese. What you are looking for is a clean <em>hei</em> (sans-serif) Simplified Chinese font. Take a look at Wikipedia's article on <a href="http://en.wikipedia.org/wiki/East_Asian_gothic_typeface">East Asian gothic typefaces</a> and take a look at the options available. In addition to the typefaces listed there, Monotype and Linotype offer <em>hei</em> Simplified Chinese fonts with a large range of weights.</p>
      <p>I don't know enough about Chinese typefaces to judge the choices; hopefully we'll have some better input from a native Chinese designer. And please don't use Arial Unicode, whose non-Latin components are poorly designed.</p>
