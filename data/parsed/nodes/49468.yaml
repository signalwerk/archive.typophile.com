    <p>Hi all:</p>
    <p>I'm working on a project for a large corporation whose primary font is Futura Bold and have several international locations. Among them, they have have several locations in China. As I have no clue on how Asian fonts work, would anyone here have any suggestions on a good companion to Futura Bold that supports unicode characters? (The closest I've been able to get is Arial Unicode, but would like something better). </p>
    <p>Thanks!</p>
    <p>dm</p>
