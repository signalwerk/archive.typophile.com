      <p>In the Acrobat Reader, you get the list of fonts used in the pdf by selecting File &gt; Properties... &gt; Fonts.</p>
      <p>In Acrobat Professional, you can select individual characters and see what font they belong to. You select "Tools&gt; Advanded editing &gt; Touch Up Text Tool"  then select the character, right click on it and select "Properties". You then get something like this</p>
      <p><img src="/sites/default/files/old-images/fontinfo_3614.jpg"></p>
