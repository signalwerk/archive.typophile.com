  html: |-
    <p>In the past year or so, I've seen this one geometric typeface pop up in (I think!) at least three applications, all in billboard ads or public transport ads. I always notice it by subconciously thinking "what's wrong with that Futura?" and then seeing that it's a different typeface entirely - square tittles, less elegant, tighter-spaced, very different /t/ and /e/.</p>
    <p>Any clues?</p>
    <p><img src="/sites/default/files/old-images/110202-vinterreakategoir-top-se_5150.jpg"></p>
