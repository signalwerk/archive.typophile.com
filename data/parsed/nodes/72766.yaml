    <p>The designers here at my work, we have been having a problem. We constantly get customer artwork to redraw for our process, and more often than not, we end up having to trace fonts.  This gets tedious and time-consuming especially with scripts.  </p>
    <p>Our product sees a lot of use in weddings and we end up tracing this font a lot.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/bergling_5655.jpeg"></div><p></p>
