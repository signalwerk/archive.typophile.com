    html: |-
      <p>I have had many requests to ID these vertical monogram fonts, which I suspected existed in the form of engraving plates used by stationers so that they could offer something NOT available in digital form. Some of these clients insisted that they have seen this lettering in many formats, so they seem convinced there is a digital font, but I have not found this exact style anywhere. Perhaps someone has designed a digital version that they sell only to stationers, but I find that idea hard to accept.</p>
      <p><a href="http://www.haroldsfonts.com/frontpage.html" rel="nofollow">Harold Lohner's Vine Monograms</a> is the most similar font I am aware of.</p>
      <p>- Mike Yanega</p>
