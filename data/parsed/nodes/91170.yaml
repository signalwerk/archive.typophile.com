    <p>I work at a library (lucky me!) but I help a friend with the design of his book.</p>
    <p>I came across this book by Art "Mr. Food" Ginsburg and I couldn't help but notice the fonts were both easy to read and had a "friendly" feel.</p>
    <p>I've attached a scan from his book.  Could someone idenify the body text and heading fonts?</p>
    <p>Thanks,</p>
    <p>Tony Harris</p>
    <p>/edit/ I can't upload the image file!</p>
