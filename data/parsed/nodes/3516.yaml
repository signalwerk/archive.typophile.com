  html: <p>Hello, <br> <br>for our 4th spatium issue we are searching for some Fonts or Logotypes who are inspired by the forms of non-latin Typefaces (Hebrew, kyrillic, chineses ...) <br> <br>We offer to different designers the possibility to present their work with such topics in the mag, that will be printed in June. <br> <br>If you are interested, please contact us <br> <br>Peter <br><a href="mailto:peter@spatium-magazine.de">peter@spatium-magazine.de</a> <br><a href="http://www.spatium-magazin.de" target="_blank">www.spatium-magazin.de</a> (at the moment only in german, sorry)</p>
