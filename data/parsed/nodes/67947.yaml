  html: <p>The other day I came across a reference to a typeface called Primer—I understand it to be be similar to Century.  I've not heard of it before, and was wondering if anyone has any info on it.  Who drew/cut it?  Is there a digital version? Google searches have yielded little, and I cannot get the Typophile searches to work.  Any info would be appreciated.</p>
