      <p>What you want to make (after expenses, taxes, non-billable time, etc.) multiplied by hours spent working. </p>
      <p>Works well for pretty much everything. After a while one gets pretty good at estimating how much time a project will take, which clients can  and are willing to pay a higher rate, and even which projects you can narrow your margins on to “help” the client - but always be careful with that last one. Price setting can help convey the idea of quality and expertise of the product or service but push too far to an extreme and you’ll either lose opportunities or gain ones that are not worth having.</p>
