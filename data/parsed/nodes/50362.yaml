    <p>Hi, folks out there.</p>
    <p>I’ve just been reading the March discussion of book design charges.</p>
    <p>I come from about 30 years of overall graphic design experience — corporate, publishing, whatever.</p>
    <p>I’ve just recently shifted my focus to designing memoirs and books on spirituality, art and poetry.</p>
    <p>I’m working with individuals now, not companies or university presses and I wondered if anyone else out there has any experience in this.</p>
    <p>Pattyfab, I love your work. I used your pricing methods for a memoir project that I did over the summer. But it was for a high-end client. I don’t think these kinds of prices will work for those who aren’t high end.</p>
    <p>Does anyone have any other suggestions beyond the previous thread of book design fees?</p>
    <p>Thanks!</p>
    <p>Robin</p>
