  html: |-
    <p>What are these good for?</p>
    <ul>
    <li>U+01B5 LATIN CAPITAL LETTER Z WITH STROKE</li>
    <li>U+01B6 LATIN SMALL LETTER Z WITH STROKE</li>
    </ul>
    <p>I always thought the barred "z" was just a stylistic variant, but since they have Unicode points, do they carry some sort of meaning?</p>
