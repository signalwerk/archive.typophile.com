    <p>Hey 'philes,</p>
    <p>A friend asked me to take a stab at her wedding monogram (details: August, outdoor ceremony, "rustic elegance"), so here are a couple of my favorites. She's flexible on the green, and on which letters are featured (last name is M, bride is B, groom is R), so I'd love to hear any thoughts on the design. Have at it!</p>
    <p>Thanks in advance.</p>
    <p>CR</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/monogramcrit_4096.jpg"></div><p></p>
