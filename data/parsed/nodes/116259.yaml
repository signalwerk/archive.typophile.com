      <p>This is one of those fonts copied/cloned/digitized in the 90's by many well known font-forgery companies. You can find it under the following names, but you should perform a more thorough investigation if you want to acquire a legitimate license to use it on a commercial project: </p>
      <p><strong>FZ JAZZY 17</strong> - Copyright (c) 1994 By Fantazia Concepts Inc,<br>
      <strong>Grooovvelic</strong> - Adapted 1990 by Walter Kafton-Minkel<br>
      <strong>Leary</strong> - (no copyright info)<br>
      <strong>LSD</strong> - (no copyright info)<br>
      <strong>OPTISmoke</strong> - Copyright Copr. Castcraft Software, Inc. 1990-1991<br>
      <strong>Pigs 1,2,3,4,5,6,7</strong> - Cambridge Fontworks<br>
      <strong>Psychadelic</strong> - Adapted 1990 by Walter Kafton-Minkel<br>
      <strong>PsychedelicSmoke</strong> - Adapted 1990 by Walter Kafton-Minkel</p>
