  html: '<p>Recherche is a somewhat non-joining calligraphic script font with over 100 alternate letters. The second font I have produced, I am so happy it is finally finished! It is available at MyFonts.com: http://new.myfonts.com/fonts/laura-worthington/recherche/</p><div class="imageWrap"><img src="http://typophile.com/files/Recherche_720x360_invite_4664.jpg"></div><p></p>'
