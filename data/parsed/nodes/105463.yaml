  - id: 562708
    user: 58010
    date: 2013-08-15T08:56:00
    date_raw: 15 Aug 2013 — 8:56am
    votes: null
    html: |-
      <p>&gt; logos that does not retain their generic appearance after a common<br>
      &gt; operation as the (B/W) photocopy  defies its purpose.</p>
      <p>A friend of mine printed her business letterhead with just an embossed logo. Looked great, but then she realized the logo disappeared when photocopied or faxed!</p>
      <p>But in general I think that how a logo looks in photocopies and faxes is less important that it used to be, with many companies using email, the web, etc for most of their communications. That's one reason we're now seeing more logos with things like color gradients that are obviously meant for full-color reproduction.</p>
      <p>An important exception would be if the company often uses photocopies to reproduce business forms, fliers, etc before distributing them; in that case it would be very important. </p>
      <p>One option is to create a special black-and-white version of the logo for situations like that.</p>
