    <p>Hello,<br>
    This is one of those one time posts... (I may need help in future, and I hope to help also...)<br>
    Is anyone able to identify this font? Note the unusual single stroke capital T and the complex lowercase S<br>
    This graphic was provided many years ago but not in a digital version. I am now looking to Supply a digital version to my boss and I am having trouble finding the name of the font.</p>
    <p>Please help! :D<br>
    Thank you all in advance, all advice much appreciated!<br>
