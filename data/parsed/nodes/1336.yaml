  html: <p><b>Programme finalised</b> <br> <br>Barring last minute cancellations, the speaker programme for the ATypI Vancouver conference has been finalised. Presentation information can be viewed either <a href="http://www.atypi.org/40_conferences/28_Vancouver/40_timetables">by theme</a> or in a tabular, <a href="http://www.atypi.org/40_conferences/28_Vancouver/40_timetables/ProgrammeWeb.html">track version</a> in which the sessions are displayed by time and location, making it easy to see the hard decisions that have to be made about whose presentation to attend. <br> <br><b>Restaurant guide online</b> <br> <br>Attendees of the Vancouver ATypI conference will receive a carefully compiled booklet listing restaurants in areas near to the conference venues and hotel. For those who want to start planning their eating and entertaining ahead of time, a special <a href="http://www.atypi.org/40_conferences/28_Vancouver/10_venue/RestaurantsWeb.pdf">web formatted PDF version</a> of this restaurant guide is now available from the ATypI website. Note that this PDF is non-printable.</p>
