      <p>&gt;If you develop a separate style for the actual degrees, this could be a different grid or family of fonts, you might be able to keep the french in the roman type rather than italic and use recto and verso to differentiate between them.</p>
      <p>I thought that if the unilingual section was treated in a different way, you could divide the french and english sections in the bilingual sections by keeping to the same style as the English (all roman) and establish the left page as the default for french readers and right for the english readers. It boils down to an alternative to using colour, although a deeper burgundy printed in a spot colour should be perfectly readable.</p>
      <p>I don’t think you need to defend yourself, there are good reasons for some of the editorial decisions, which we are not privy to, which make sense after you explain them. And, after all, these are only suggestions. Turnovers and such are sometimes better spotted away from a computer screen, the interface, guides and so on are distracting, from a laser print, or by a colleague. I think that there are opportunities to save space, for example, on page 24, removing the space after the sub-heads might allow you to pull all of Communication Studies back onto one page. btw on page 26 you have an extra space after Classics. </p>
      <p>Tim</p>
