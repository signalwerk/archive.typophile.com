    html: |-
      <p>Thanks for the comments.<br>
      Certainly a lot of food for thought for next time round, and now is the time to make these corrections and decisions, not while in the throes of production. :)</p>
      <p>(feeling the need to defend myself, but I'll try not to)</p>
      <p>We discussed using abbreviations and using * or ** to indicate with distinction/great distinction, but most of the group preferred to include the whole mention, although certainly it would have made my life easier to not have it written out in full.</p>
      <p>I guess I need to pay more attention to turning over the last words... it's amazaing how you can have gone over something so many times and still not notice stuff.</p>
      <p>Tim, I'm not sure what you mean by:</p>
      <p>&gt;&gt; If you develop a separate style for the actual degrees, this could be a different grid or family of fonts, you might be able to keep the french in the roman type rather than italic and use recto and verso to differentiate between them.</p>
      <p>Do you mean the titles of the degrees? or the listing of names? Everything within the listing of names is unilingual English.</p>
      <p>I think I may look at choosing a different font for the French next time. I knew that longer amounts of text in italics would be more difficult to read, but the weight differences in minion don't really make it possible to use light and regular, and I was finding it difficult to find an appropriate complementary font. Also, the italics reduced the French text, and we were told these front texts would be shorter than they ended up being. I do have everything in styles, so changing from one to another shouldn't be too bad, and as I said, now's the time.</p>
      <p>The idea of using colour is an interesting one, although, again, problematic. We looked at some other convocation booklets which used navy ink throughout on cream-coloured paper. It worked very well. However, Concordia's colour is burgundy. Pantone 207 or 209 depending on the work. The group was worried that using the burgundy would be tough to read, and would look too pink. It actually turned out quite nice, and darkened by the off-white paper. If we have the budget to continue with the 2-color inside, I may be able to convince them to go with French in 209. But we were already pushing the budget limits this time round, and next ceremony we have 5 books instead of 2. *sigh*   </p>
      <p>We won't translate the degree names, although we did discuss the possibility with the translation department, bt it simply becomes too tedious and long. Either the headers and subheaders take up too much space and are too repetetive or we have to duplicate the listing of names which becomes, aside from long, problematic for accuracy. The book already runs 44 pages. </p>
      <p>Unless specifically requested, our degrees are issued in English, so we figured it is not a large departure to list them in English only. The disciplines also -- again we discussed the possibility of translating and ran into problems: do we translate "etudes francaises" (which is the program title) into English if we translate the others into French? The fact is, it is an English university. Mmm, and we also looked at other universities offering bilingual convocation booklets. McGill doesn't translate, so we decided to follow them. </p>
      <p>Thanks for the suggestions about the small caps and indents. I will play around. I really didn't know how to go about it there. Also the rule above the pagination. Good idea, I will try it.</p>
      <p>Thanks again! It always helps to have specific comments by people who know what they're doing. I'm still very new at this, and just learning.</p>
      <p>K.</p>
