      <p>Hm, OK I think I understand. I was worried that where the texts run 2 pages, readers would get confused -- you know start reading left and continue right unless there was some cue that the right was the same, only English. Hopefully, though, the front matter will be a lot shorter next time around, and won't run 2 pages for any single item. It bothers me that the main action -- the grad names -- only starts half way into the book.</p>
      <p>Thanks for pointing out that extra space. :) It is, indeed, difficult to catch it all. It gets so you can't see straight anymore. A fresh pair of eyes is always good.</p>
      <p>We may be able to go with the 209. Do you think the colour will make it more or less important than the black? I would be inclined to use colour for the French, but that might be seen as giving it more importance. It's a touchy issue here, sometimes.</p>
      <p>Lots to play with for next time 'round. Thank you! I do appreciate the suggestions. </p>
      <p>K.</p>
