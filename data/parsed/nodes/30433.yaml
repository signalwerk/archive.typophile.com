      <p>I find the use of small caps at the beginning of every paragraph of the introductory copy a little too much, especially combined with an indent, I think I would use it for the first paragraph of each section but not in the subsequent paragraphs. </p>
      <p>It also seems odd that the actual degrees don't have a french translation, and when the titles of papers are already in italics I don't think the indent on the second line is necessary, the italic is already indicating a section; I might be inclined to lose the space after the titles of the degree discipline and the indent for following text; and use an abbreviation and key to indicate which students had received distinction rather than having it run over to the next line, where it can seem to act as a subtitle. On the headings that you have ranged left or right depending on whether they are recto or verso it might be nice to use the hedera in a mirror version to continue that. On page 3 I would turn over the last word of the penultimate line so that Montreal wouldn't be so lonely there are a few more that I would turnover, this is the most in need. The rule above the pagination is too similar to the rule used with headings it might be better to reduce it in width or run it either side of the numbers with a break in between.</p>
      <p>If you develop a separate style for the actual degrees, this could be a different grid or family of fonts, you might be able to keep the french in the roman type rather than italic and use recto and verso to differentiate between them.</p>
      <p>Tim</p>
