      <p>Thank you, Linda. :)</p>
      <p>Although I very much want input and want to learn, I am hesitant to post for critique because I am aware that many of the faux-pas I make arise from simple ignorance and inexperience. I am learning on the job and have never studied design. I'm doing what I can: reading typophile, typography books, and other forums and sites. But I have been scared off by some comments on other forums (not here!) that berate newbs like myself for trying to do this kind of work without having first studied design.  </p>
      <p>I find most everyone here gentle and receptive and super helpful, but I am still worried that someone will come along one day and launch the kind of criticism I have read elsewhere. And of course, it's easier to post for critique when you are confident about what you're doing.</p>
      <p>At the same time, I don't know anyone personally who can offer me constructive feedback on what I've produced. I work in something of a professional vacuum. So you guys are it. I hope you keep putting up with my tentative steps, and that I keep making them :)</p>
      <p>Anyway, the booklet was well received. That is to say there was deafening silence and no negative comments. That's as good as it gets around here! I hear tell the president's wife is a translator -- the translation department was particularly nervous about this project. Thankfully my couple of French oversights went unnoticed. So far. ;)</p>
      <p>K.</p>
