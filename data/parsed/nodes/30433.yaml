      <p>I would go with differentiation through colour rather than weight.</p>
      <p>Here in Ireland, most governmental publications are required to be produced bilingually (even more-so now given Gaeilge’s recent acceptance as an official European language) and thus this design issue often arises. Officially the requirement is that there be no importance given to the English over Gaeilge and vice versa. Colour differentiation is the natural solution.</p>
      <p>Personally I feel it looks and reads better.</p>
