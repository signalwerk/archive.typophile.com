      Stylish Extended is <a href="http://www.fontshop.com/search/?q=bernhard+fashion&amp;x=0&amp;y=0">Bernhard Fashion</a>.</p>
      <p>I don’t know ‘Anna’ and ‘Simply Stacy’.</p>
