      <p>Hi Petra,</p>
      <p>where do these fonts come from?<br>
      You cannot find them because their names have been changed. Those names are pseudonyms. For example, Camille actually is Avant Garde Gothic, Bertram is Copperplate Gothic. Hell, someone even has bothered to rename Comic Sans: It’s ‘Childish’!</p>
      <p>Claire is actually <a href="http://www.fontshop.com/fonts/singles/type_o_tones/memimas_regular/">MeMimas</a> by Type-Ø-Tones.</p>
