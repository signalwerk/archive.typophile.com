  html: |-
    <p>Font retailer FontHaus was formed in 1989 by <a href="/wiki/Mark%20Solsburg" class="freelinking" rel="nofollow">Mark Solsburg</a> and is run by <a href="/wiki/DsgnHaus" class="freelinking" rel="nofollow">DsgnHaus</a> in Westport, CT.</p>
    <p>FontHaus offers over 45,000 fonts from top foundries <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>, <a href="/wiki/Agfa" class="freelinking" rel="nofollow">Agfa</a>, <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a>, <a href="/wiki/Cool%20Fonts" class="freelinking" rel="nofollow">Cool Fonts</a>, <a href="/wiki/E%2BF" class="freelinking" rel="nofollow">E+F</a>, <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>, <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>, <a href="/wiki/Lucas" class="freelinking" rel="nofollow">Lucas</a>, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>, <a href="/wiki/MvB" class="freelinking" rel="nofollow">MvB</a>, and <a href="/wiki/URW" class="freelinking" rel="nofollow">URW</a>.</p>
    <p>FontHaus publishes <a href="/wiki/x-height%20magazine" class="freelinking" rel="nofollow">x-height magazine</a>.</p>
