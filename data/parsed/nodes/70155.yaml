    <p>Several people have contacted me recently in regards to the following topic, so I figured I might as well make a formal announcement…</p>
    <p>After more than 3 full years of commitment, I've recently brought my position as the first full-time designer for MyFonts to a close. I'm very glad to say that I'm still on the best of terms with the MyFonts team and have nothing but the best wishes for them in the future. Working with John, Kevin, Chris L, Chris D,  Jan, Laurence, Adam, and Joshua was one of the best experiences of my life, and it's hard to imagine finding a group of people as intelligent, supportive, or pleasant to work with as them.</p>
    <p>With all the time and energy I've put in to overhauling its design, MyFonts has come to feel a bit like my "baby" over the years. Plus, not much made me happier than helping type designers – many of whom have become my good friends – to make a living from their work. Suffice to say that moving on was a hard decision to make. There are still many things I would have liked to have done before taking my leave, but I'm very proud of the work I accomplished with the MyFonts team and trust they will keep things going in the right direction.</p>
    <p>While I'm sad to be leaving such a great job with MyFonts, I am just as excited about a new position I've taken with Font Bureau. Many of the people involved with Font Bureau are people that I have looked up to throughout my life – people who inspired me to get involved in typography in the first place. Even before working to promote their fonts via MyFonts, Font Bureau has been one of my favorite type organizations, so naturally I'm honored to be involved. Especially after attending the annual Font Bureau offsite meeting on Martha's Vineyard this past weekend, I'm looking forward to working with such a skilled and knowledgeable group of experts.</p>
