    html: "<p>Daniel, some thoughts. <br>The thing is that If you go for a Typographic poster (which I love them) the Type is Very important, and in the style you have chosen even more. Like Hrant said I would try a wooden type, extended and condensed, or regular and condensed, you will need both of them to make differences and I would not mix them with helveticas (you can keep this ones for the presentations and so make it a different part of the poster, I see it now a little bit confuse*), I am aware of your cash-type-problem, but I would consider something low price like <a href=\"http://www.chank.com/font_detail.php?sku=5275\" target=\"_top\">Goshen</a> or something a little less distressed and more regular, and you'll have fun for the same price!. <br>* Someone told me once that the design starts in the order, and that's one of the few thigs I am sure in my job, and for your poster, what is the most important thing? The second? The third? keep that in mind, I think that in your case at least is so important Summer Employment Opportunity (or is Summer Employment. Opportunity!) as Camp Sweeney. At a first and fast look (the way most of the posters are seen) my eyes go at Sweeney and at the same time at Debartol and at Opportunity, I would try to make more differences using the two colors and sizes, you could try to put the presentations a little smaller (Don't worry, if I am interested in a Summer Employment Opportunity in Camp Sweeney I will read it, and if they are sponsors I still think are too big). <br>Two quick thoughts: <br>Consider using not a white paper, some with light brown tono, and I don't mean an expensive and soft (?) one. <br>Maybe too many stars? I think you are in The Thin Red Line between Circus and West style from my spanish point of view. <br>I really like the way you have made and arrange the three presentations and the Date-Place-Map, nice, you got it. <br> <br>I hope it helps !</p>"
