    <p>I have created this recruitment poster for a summer camp for kids with Diabetes. They're being hung up on the campus of Notre Dame today. I'm interested in making this poster better for my portfolio, as I'm job searching. <br> <br>I researched a few poster companies such as Hatch Show Print and Yeehaw Industries. I love their country/western style of letterpress and since this poster was for a camp in Texas, I felt it appropriate. There's a lot of stars because, well, the Lonestar State. I don't have a letterpress sitting around so I had to use the computer. That meant I could take some liberties with the type, and I think it's doing OK. <br> <br>But how can I make this poster better? You can see a full sized gif and the pdf here: <a href="http://www.whoisdan.com/sweeney">whoisdan.com/sweeney</a>. <br> <br><img src="http://www.typophile.com/forums/messages/29/24529.gif" alt="sweeney small"> <br> <br></p>
