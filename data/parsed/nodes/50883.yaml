    <p>Usually we make inlays in pretty designs or type after agonizing over every detail. James made this with scraps from oval inlays to mark his big sanding block:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fisher_5376.jpg"></div><p></p>
    <p>It spells "Fisher" and it's mother of pearl glued on the side of the block. It's so funky I love it.</p>
