      <p>First of all, congratulations again on your new job!</p>
      <p>Andreas, I don't think Aaron is asking us to contribute content; to me it seems wholly reasonable market research to find out what people like / don't like about the site before updating it.</p>
      <p>Aaron, one thing I've been confused by is the structure of the site: the homepage doesn't seem to fully list all the subsections (Without a bookmark I'd be searching for ages for the character design standards — as I wouldn't automatically think to look under 'articles') I'd also like to see the design standards cover characters in blocks, and be a bit more complete (though of course this needs to be realistic). It could even be a wiki. The structure at the moment has been enough to discourage me from exploring further than absolutely essential research.</p>
      <p>If I were in your shoes I'd want to look at the site analytics to see which sections of the site are actually used, as I suspect a lot of it is redundant. I can't honestly see who the site is aimed at: it seems to target both people who need to know about cleartype hints and people who don't know how to install a font. Disaggregating the target visitors would be hugely beneficial.</p>
