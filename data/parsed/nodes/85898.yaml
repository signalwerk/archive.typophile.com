      <p>No intend to dismiss the posts above, but:</p>
      <p>May I offer my thanks back to the (original) Microsoft Typography team? I've read literally each and every page and Word document top to bottom, and it was all I needed to get a thorough grasp of the innards of Truetype and Opentype fonts. So much unlike Adobe's half-hearted stab at documentation.</p>
