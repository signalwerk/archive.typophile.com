    <p>Hello everyone! I’m sure many of you are familiar with <a class="freelinking external" href="http://www.microsoft.com/typography/default.mspx" rel="nofollow">Microsoft’s Typography site</a> with documentation on OpenType, ClearType and general information about typography and typeface design. I’m also sure most of you know it’s been around since 1996 and much of the content hasn’t been updated in a quite a long time.</p>
    <p>As the newest member of the Microsoft Typography team, I’ve been tasked with giving the site a thorough review and with a view to making targeted updates. As part of this process, I wanted to get feedback from the community of users (you folk!) as to what needs to be updated, clarified or added. </p>
    <p>I might be opening a can of worms here, but feel free to contact me, either by leaving a comment or sending a direct message. We’d love to hear from you!</p>
    <p>Thanks everyone!</p>
