    votes: null
    html: <p>In TrueType and TrueType-based fonts, a UPM size that is power of two (1024, 2048, 4096 etc.) gives microscopic performance gain when rasterizing, as opposed to 1000 or 2000. This performance gain was minimally noticable on computers with a 8 MHz clock, but certainly not anymore with a 800 or 1600 MHz clock.  <br> <br>The TrueType specification *always* allowed the use of any UPM from the range 0-16384, including 2048, 1000 and any other. 2048 was Microsoft's choice in their own fonts, while 1000 was the UPM size for Type 1 fonts. Since currently most fonts (Type 1, OpenType PS, TrueType/OpenType TT) are produced from the same source, it doesn't make sense whatsoever to scale the glyphs by 204.8 % (from 1000 to 2048) because it introduces a lot of trouble and rounding errors.  <br> <br>I guess it will still take a LOT of typing to get the "2048 myth" from people's heads.  <br> <br>Best,  <br>Adam <br></p>
    html_clean: <p>In TrueType and TrueType-based fonts, a UPM size that is power of two (1024, 2048, 4096 etc.) gives microscopic performance gain when rasterizing, as opposed to 1000 or 2000. This performance gain was minimally noticable on computers with a 8 MHz clock, but certainly not anymore with a 800 or 1600 MHz clock.  <br> <br>The TrueType specification *always* allowed the use of any UPM from the range 0-16384, including 2048, 1000 and any other. 2048 was Microsoft's choice in their own fonts, while 1000 was the UPM size for Type 1 fonts. Since currently most fonts (Type 1, OpenType PS, TrueType/OpenType TT) are produced from the same source, it doesn't make sense whatsoever to scale the glyphs by 204.8 % (from 1000 to 2048) because it introduces a lot of trouble and rounding errors.  <br> <br>I guess it will still take a LOT of typing to get the "2048 myth" from people's heads.  <br> <br>Best,  <br>Adam <br></p>
  - id: 41867
    user: 909
    date: 2004-08-12T16:15:00
    date_raw: 12 Aug 2004 — 4:15pm
    votes: null
    html: <p>I'll just add that the available evidence is that this performance gain was related to "bit-shifting" operations specific to the 68000 series of CPUs. <br> <br>Microsoft suspects that it is still relevant, but have been unable to provide any evidence for this viewpoint that I have seen. However, they make it a requirement for fonts being bundled with Windows or Microsoft applications. <br> <br>If one *was* going to scale the font up from 1000 units, and didn't have to worry about compatibility between 1000-unit and 2048-unit versions, I'd suggest scaling it by 2x and then setting the em-square to 2048. <br> <br>Cheers, <br> <br>T</p>
    html_clean: <p>I'll just add that the available evidence is that this performance gain was related to "bit-shifting" operations specific to the 68000 series of CPUs. <br> <br>Microsoft suspects that it is still relevant, but have been unable to provide any evidence for this viewpoint that I have seen. However, they make it a requirement for fonts being bundled with Windows or Microsoft applications. <br> <br>If one *was* going to scale the font up from 1000 units, and didn't have to worry about compatibility between 1000-unit and 2048-unit versions, I'd suggest scaling it by 2x and then setting the em-square to 2048. <br> <br>Cheers, <br> <br>T</p>
