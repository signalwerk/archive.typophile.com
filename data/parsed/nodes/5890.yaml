    html: <p>An educated guess is that you're probably looking at a Symbian based device, which seems to use Freetype... <br>  <br><a href="http://www.freetype.org/pipermail/devel/2003-January/008759.html" target="_blank">http://www.freetype.org/pipermail/devel/2003-January/008759.html</a> <br> <br>With Freetype the devs may have turned off support for hinting to avoid the documented Apple patent issues. You might want to ask Graham Asher, the guy who posted the linked message if he has any details about if Symbian uses hinting and or the ClearType like sub-pixel rendering supported by Freetype. This should give you some background to the rendering environment.  <br> <br>Cheers, Si <br> <br>I don't know much about Symbian, and it may be something else entirely. It's a shame the client can't reveal more of the technical details.</p>
