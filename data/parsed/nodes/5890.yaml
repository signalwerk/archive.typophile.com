    html: "<p>Peter,  <br> <br>In FontLab 4.6:  <br> <br>1. Start with Type 1 autohinting, do Autoreplacing.  <br>2. Refine your Type 1 hints manually.  <br>3. Go to Font Info and do Auto Zones and Auto Stems.  <br>4. Refine your stems settings.  <br>5. Convert the outlines to TrueType, the contour direction to TrueType and hints to TT instructions.  <br>6. Review the results in the TrueType Hinting window. Check the TrueType stems settings, esp. the thresholds where the stems turn from one pixel to two pixels etc.  <br>7. Refine the hinting manually if needed.  <br> <br>This should give you the quickest results. Note that due to a bug in FontLab 4.6 for Mac, step 6 cannot be easily completed so you may want to use the Windows version.  <br> <br>Refer to <a href=\"http://www.myfonts.com/activity/hinting/\" target=\"_blank\">http://www.myfonts.com/activity/hinting/</a> for more links about TrueType and Type 1 hinting. Check Victor Gaultney's notes on hinting in FontLab.  <br> <br>Finally, you may want to consult any of the people listed there who specialize in TT hinting.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.  <br></p>"
    html_clean: "<p>Peter,  <br> <br>In FontLab 4.6:  <br> <br>1. Start with Type 1 autohinting, do Autoreplacing.  <br>2. Refine your Type 1 hints manually.  <br>3. Go to Font Info and do Auto Zones and Auto Stems.  <br>4. Refine your stems settings.  <br>5. Convert the outlines to TrueType, the contour direction to TrueType and hints to TT instructions.  <br>6. Review the results in the TrueType Hinting window. Check the TrueType stems settings, esp. the thresholds where the stems turn from one pixel to two pixels etc.  <br>7. Refine the hinting manually if needed.  <br> <br>This should give you the quickest results. Note that due to a bug in FontLab 4.6 for Mac, step 6 cannot be easily completed so you may want to use the Windows version.  <br> <br>Refer to <a href=\"http://www.myfonts.com/activity/hinting/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/activity/hinting/</a> for more links about TrueType and Type 1 hinting. Check Victor Gaultney's notes on hinting in FontLab.  <br> <br>Finally, you may want to consult any of the people listed there who specialize in TT hinting.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.  <br></p>"
