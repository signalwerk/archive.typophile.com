    html: <p>The developers are using an emulator for their software, which I'm not allowed to use, since it's top secret. <br>Therefor I've been sending them the fonts to test themself and give me feedback, in some cases I've gotten screendumps. <br> <br>Just to test in the beginning I did OT/CFF (and OTF/TT)  and sent them.  But they where unable to install them. why this is I don't know.  <br>It could be that I didn't generate them properly (but  i'm sure I did, plus there's no scripting), or it could be that the had a new employee that was unexperienced in installing fonts especially OTF. I have no idea. I just got the message that it didn't work.  I must presume they know what they are doing.  <br> <br>I thought it was a bit weird though because Freetype2 should support OT/CFF.</p>
