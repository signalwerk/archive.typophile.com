    html: |-
      <p>In addition to the sound advice shared by Frank, it appears that this particular case is complicated by Illustrator's odd placement of points when it converts the dots to circles— it places four points offset from the extrema, plus an "extra" point at the bottom extreme which is the most to blame for the distortion. Unfortunately, cleaning up such paths is not one of Illustrator's strengths; there's no equivalent to FontLab's "Nodes at Extremes" and no way to remove extra points without distorting the shape. (There is at least one plugin that includes these features— VectorScribe, formally known as BetterHandles.)</p>
      <p>The best solution (short of redrawing the circles manually) would probably be to go as large as required in Illustrator to minimize the rounding distortion when pasting to FontLab. Then use FontLab's Optimize feature from the Contours menu to reorient the points, and remove any extras. This might require using a higher UPM, or possibly scaling down the outlines after optimizing (although scaling may also cause rounding errors, you can judge whether the final result meets your desired level of precision).</p>
