    html: |-
      <p>There is no alternate font editor to solve your problem.<br>
      What you are seeing is the result of the rigid 1000 UPM-grid inside a font, that allows for points (and also bezier points) to be placed on that grid only.</p>
      <p>What you can do now (in descending order of importance): </p>
      <p>– Set your points at the extremes of the shape. This minimizes rounding errors. Specially working with circles, that should be fairly easy.<br>
      – Do not paste outlines that are too small. This will definitely give you rounding errors, as the points cannot be accommodated on the grid. The AI document should equal the font editor’s settings –&nbsp;e.g. it should measure around 1000×1000 pt. A typical x-height in that document is around 500 pt.<br>
      – choose a higher UPM in the font editor, for instance 2000.</p>
