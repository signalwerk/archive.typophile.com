    html: |-
      <p>@frankrolf</p>
      <p>I think the problem is in the way Illustrator draws the dots for the "dot lines." If the lines themselves are anything other than orthogonal, the circles are draw "perpendicular" to the line: that is, if the line is slanted, the circles will be drawn with extrema orthogonal to the line, but at a slant globally. </p>
      <p>So, the problem isn't as you described it, but the solution is: the characters created using the dot line can be used as templates, but the final, exported characters will have to be composed with circles with properly-aligned extrema, using either blend function or align-and-distribute.</p>
    html_clean: |-
