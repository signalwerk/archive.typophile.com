    <p>Hi,</p>
    <p>I am developing a font.<br>
    I have already drawn a whole alphabet set on Adobe Illustrator.<br>
    But there happens a problem when it is imported or copy and pasted onto Fontlab.<br>
    My font is based on rounding dots like a pixel font for LED signage.<br>
    The circles are distorted in Fontlab.<br>
    Is there anyone who has a solution for this problem?<br>
    I guess that I may need to use another font editor.</p>
    <p>On Illustrator, I actually started to draw a line and changed to dot line and then automatically outlined.<br>
    It was for my systemic design concept. Is this a part of the problem of distorted circles?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_5143.png"></div><div class="imageWrap"><img src="http://typophile.com/files/2_6525.png"></div><div class="imageWrap"><img src="http://typophile.com/files/3_4334.png"></div><p></p>
