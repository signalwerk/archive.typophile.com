    html: |-
      <p>We usually like to offer some suggestions for alternatives, and here are three that might be similar in feeling, in addition to the ones Yves mentioned. I found these looking in the Sign Lettering section of the Script Font ID Guide:</p>
      <p><a href="http://www.myfonts.com/fonts/galapagos/geis/">Geis</a> from Galapagos, by George Ryan</p>
      <p><a href="http://www.unifonts.com/c_texhtm/cyranomodernregtex.htm">Cyrano Modern</a> by Victor De Castro, Unifonts.</p>
      <p><a href="http://www.unifonts.com/a_pages/arjoriemedium.htm">Arjorie</a>, also by Victor De Castro, Unifonts.</p>
      <p>In my opinion both these guys are artists, who put a lot of personality into their fonts.</p>
      <p>- Mike Yanega</p>
