    html: <p>Two serif faces with script-like serifs are <a href="wiki/Underware" class="wiki">Underware</a>’s Dolly and <a href="wiki/Suitcase Type" class="wiki">Suitcase Type</a>’s Dederon Serif. But they are quite different. I think that this is custom designed logo as well.</p>
