      <p>William, in your next to last post, you are right, I should indeed have said that the comment 'raises the question'. My 'begs the question' was slipshod.</p>
      <p>You also say: "[i]f the theories were precise enough to specify optimal spacing [...] then maybe a crucial test could be done."<br>
      I think my theory is precise enough to specify an optimal spacing, and that it has to do with stems and the vertical components of bowls--and maybe the means of angular components--, hovering about a rhythmic mean, but not hovering too tightly. This is the basis of my interest in fourier transforms. The idea is that, when the vertical components on either side of a letter like an o or an n are in synchronicity with the vertical components of the adjacent letter on either side, the pattern of the whole supersedes the molarity of the parts and makes resolving them effortful.<br>
      This leaves the question of a critical test. I think it is in principle testable, but I don't have a handle on just how to structure it. There is some existing research that seems to come close, for example: <em>Effects of alphabeticality, practice and type of instruction on reading an artificial script: An fMRI study</em>, by Tali Bitan, David Manor, Istvan A. Morocz, Avi Karni (available on line at <a href="http://splweb.bwh.harvard.edu:8000/pages/papers/morocz/cogn_brain_res.Bitan2005.pdf">http://splweb.bwh.harvard.edu:8000/pages/papers/morocz/cogn_brain_res.Bi...</a>).<br>
      The scrambled text phenomenon that you mention in your last post before this reply raises interesting questions. How easy is reading scrambled text really? It seems to require some work, or at least some introduction to the underlying scramble protocol, before becoming manageable. How is reading speed effected? What pattern of eye movements become apparent, compared to those used in immersive reading of normal text? How quickly does fatigue set in? Is there a greater reliance on tokenization of still intact criterial word parts?</p>
      <p>Also in your last post before this reply: your summary indicates to me you got what I mean, though I'd want to clarify what is meant by 'mentally'. I'd want to argue that, through learning, sense becomes neurally encapsulated with the bounded map or patterned whole. This is why with visual wordform resolution, <em>a perceptual process</em>, the connection with 'sense' is immediate.</p>
      <p>John, I'm hesitant to go into the bed / bad thing, because I think how we conceive parafoveal preview and the contribution of semantic context has to be turned on its head. I've tried to specify just how in a set of questions to Hrant and Kevin to follow up our suite of Typo_13 contributions. If you wish, I could fly it in a new thread, but like most of my exploratory stuff, it's full of 'ennesonese'.</p>
      <p>In an earlier post you said "[t]he parallel letter recognition model happens to be supported by a number of empirical studies, and also conforms to what we know about how the brain seems to handle other processes, so I certainly am not going to say that I don’t believe it. "<br>
      I think your unreadiness to commit yourself one way or the other is fair. But I think your claim that "[t]he parallel letter recognition model happens to be supported by a number of empirical studies" is misleading.<br>
      Kevin sought support for his claims about word recognition by pointing to the results of a series of empirical studies. But the results of some of these studies could just as easily sustain a model such as I am proposing, and the results of at least one of the others rely on a confounding of the bouma-concept, with 'word shape' in its "raw pattern of neutral, ascending and descending" meaning. Kevin's claims may be compatible with the results, but on their own the data provided by the studies he cites "do not constrain the space of possible models" to just his, or one, or to just the parallel letter recognition model of word recognition. (In the quoted phrase just above, I'm alluding to a comment about model confirmation in <em>Word skipping: Implications for theories of eye movement control in reading</em> by Marc Brysbaert, Denis Drieghe, &amp; Françoise Vitu).<br>
      Also, what we know about how the 'how the brain seems to handle other processes' is--Kevin would be the first to admit--incomplete. And especially what happens in the visual cortex before text enters the cognitive stream is far from adequately understood.</p>
      <p>In addition, I wouldn't call what happens in learning 'primary', except insofar as it has to happen for learning to occur. If the paper I linked to earlier in this post is any indication, we will have to say that what we think of as skilled reading of continuous text is an event much different than the effortful process of serial letter-wise or bigram / trigram-wise tokenization and sounding out, not just a faster, more parallelistic version of the same routine.</p>
      <p>Eben, you are right about how a workhouse definition might come about. Now I might try:<br>
      bouma: the bounded map comprised by the totality of stems, cross-bars, bowls, counters, between-letter shapes, angular components, and the like, in their pattern. This is what we use, etc...</p>
