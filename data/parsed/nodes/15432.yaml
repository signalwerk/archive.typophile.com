      <p>John, when I said "I think you are right in sensing that for me bouma is simply a more rigorous and sharply defined alternative for ‘word wholes or forms’," I probably should have said: actually <em>bounded map</em> makes a statement about what for vision and the visual cortex a word whole in separated text is. It's a proposal for how we might want to think about 'whole' or 'form' or 'shape', when it comes to the visible word (if we want to sort out, without fear of ambiguity how visual wordform resolution or recognition works.)</p>
      <p>Hrant, bounded map encodings form, and it is the encodings that strict visual wordform resolution <em>and tokenization</em> rely on. This is what it means, in my scheme, to say reading is bouma based. A better counter to my introduction of <em>tokenization</em> might have been: "the reason it’s boumas and not tokenization is [...]"</p>
      <p>It's a question of which way of speaking can move us forward more effectively. Time will tell.</p>
      <p>John, I've tried to claim that what happens in the visual cortex happens massively in parallel, but that the mediating agents for visual wordform resolution are not specifically letter wholes but the totality of stems, cross bars, counters--as you say--in their pattern.  In learning to read, encodings of words form that are indifferent to or cut across molarities (at the glyph level) and polarities (of black and white). (This is why it seems important to me to say the bounded whole is (for the visual cortex) a map of figural components at the role_architectural_particular and role_architecturally_evoked_form level, the stem / crossbar / counters / closure level.) There are persuasive arguments for this that can accommodate the empirical test results that make parallel letter recognition seem persuasive. But persuasive for one might not be persuasive for another. For another, what seems like a persuasive consideration to the one, might seem like special pleading.</p>
      <p>A bouma-concept is an invitation to see the word-whole under a certain aspect. Seeing it under this aspect puts our notion of 'whole' or 'form' inconformity with what happens in perceptual processing. It also provides a fertile basis for channelling our efforts in type design and placing type.</p>
