      <p>It's not so much derivation as <em>grounding</em> that I'm after, <em>anchorage</em>. I don't mean to be cute, but such grounding can discourage or constrain slipshod extensions or referential drift (besides making the term more transparent to a meaning / less opaque). And the kind of fuzziness <em>bounded map</em> contains still gives us room to move. </p>
      <p>I wouldn't say this if I didn't think the susceptibility to drift is real.</p>
