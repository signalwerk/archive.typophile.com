      <p>John, you are right that I didn't use the word 'word'. </p>
      <p>I didn't &amp; don't take my phrase *too* seriously since I don't have the expertise or understanding ( yet ) to craft a good phrase. And I knew somebody would be there to bring up the point! </p>
      <p>I guess I was trying to avoid that issue for now to concentrate on the possibility of making bouma a term that might be applied to  non-western writting systems too. I would like Bouma to be a term that is as universal as it can be. I don't know how universal that can be. But I would like to know. In science and culture there is a tempermetal tendency to be a lumped or a splitter. I recognize that I am more of a lumper. It's just my temperment.</p>
      <p>Originally I started my attepted definition with some word/word subset/tokenization language but then I started adding phrases that related to radicals in Kanji/Chinese charcters realized that Hiragana (the non-Chinese derived japanese forms) were maybe not covered yet, there was the problem of the Chinese 'one' character and that I had no language to describe hindi, urdu or Arabic - and so I glossed this aspect. </p>
      <p>I do recognize that this is maybe a big problem because the idea or the 'word shape' was I think pushed over to allow for a more nuanced idea of 'the shape of a cluster of letters, often a whole word'. So there is a link that has to be adressed.</p>
      <p>However, look at what this new phrase does! It is both more inclusive and broad but also much more precise. No small feat!</p>
      <p>I suppose I thought that tendency or direction might be continued. </p>
      <p>That pretty much described my motivation for using that kind of phrasing except of course for my already admitted interest in relating bouma to Notan. Since my (quite possibly naive) view of Notan includes Chinese Japnese caligraphy (probably other kinds too) and the since the definition of Notan relates closely to Bouma I was also motivated to consider these links too.</p>
      <p>Obviously the 'way' we read varies with the script/language used but there are a ton of relevant pralells too. 'Bounded map' for instance might be used just as well with any script type - not just western ones.</p>
      <p>Peter,</p>
      <p>I agree with you about the loss of the idea of pattern. And I see how 'map' provides that in a professional context but I still don't know that a non-techincal person or art/design student is going to get the sense from the phrase 'bounded map'. Not right away anyway. I'll have another go perhaps &amp; see what I can do there. Obviously it's a really useful phrase and can't be tossed out lightly.</p>
      <p>I am not sure if you are right about the arabic. Sure the script is structured very differently but it is still a pattern of lights &amp; darks with readable salient features. It doesn't seem to me that we can talk about bouma (or notan) in the context of Chinese or Japanese &amp; not allow it for Arabic. Arabic can also takes alot of extreme forms where salient features are stretched  - but doesn't always have to. There are also condensed arabic forms. So it is especially tough to compare. Tougher both because of the profound variety of expression within it &amp; it's inhernet structures. But the way I see it toughness doesn't get us off the hook.</p>
      <p>I guess that I think that if it is possible it would be good to separate the 'Bouma' definition from reliance on the processes specific to reading western texts. Maybe it should be a term that relates to the parcelling of visual stimulus alone. I am not saying that we should not use bouma to describe a reading process - not at all. </p>
      <p>Bouma seems like a great candidate to describe parsing of raw perception, whereas other words like Tokenization do a good job of describing interpretation. It seems preferable to me just now because Bouma is freed from script specific arguements over how we read but still does a good job of describing a genuinely interesting, useful and complicated idea about the visual stimulus.</p>
      <p>Let me ask you both about the idea of tokenization. I am not clear I get this.</p>
      <p>here are 3 contrasting examples: 'start' '3' &amp; 'modernization'</p>
      <p>With 'start' the token &amp; bouma shape happen to be the same. I think there is no disagreement about this. </p>
      <p>With '3' I wonder if you can say it has a bouma. It seems like you should be able to say it does according to my visual only definition anyway. Accidentally it is also a token too. I think...</p>
      <p>And then there is 'modernization' There 'token''iz'&amp; 'ation' are the tokens or maybe 'modern' &amp; 'ization'. But the idea is that we parcel whole sections of the word visually ( bouma ) and that we can then make meaning from these clusters ( token ). </p>
      <p>Maybe parcelizing &amp; interpretaion are too close to separate. </p>
      <p>I'll have to check out that Thomas Milo.</p>
