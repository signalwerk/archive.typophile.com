      <p>"it’s worthwhile to try to bring this word child up right for now [but] you must realize that it is going to have [to] go out on it’s own one day and get it’s own apartment etc."</p>
      <p>:-)</p>
      <p>[referential drift]<br>
      I guess I mean alteration to the point where it becomes difficult to connect a current use with the original intent. The term's meaning becomes diffuse, rather than more clearly defined. I've though Hrant's stretching of the his use of the term to include single letters in focal vision might suffer from that. The original intent seemed to be to provide a term for a multiplex unit with an internal and external figural distinctiveness or uniqueness subject to processing by our vision-ware as one thing.</p>
      <p>"the intent [...] is to nail things down"<br>
      But different people will feel inclined to nail it down differently and the term needs enough 'surface' for that, without the term loosing its basic shape. For example Peter Saenger will nail <em>bouma shape</em> down one way in <em>Space Between Words</em> and Insup Taylor and M. Martin Taylor will nail it down a different way in their <em>Psychology of Reading</em> and their nailing it down might be sufficient to suit the needs of their subject matter and make their claims appear compelling, while still being mutually compatible. When I want to ask questions about receptive_field stimulus_information_integration behaviour within the visual cortex, I may feel the need to nail it down differently again. These ways needn't conflict.</p>
