      <p>More to: "all this makes rhythmic spacing important"</p>
      <p>If the spacing is too wide, so that the internal and external whites (within the bounded map) are out of synchronicity and the vertical components out of phase to the point of setting up competing spatial frequency peaks rather than one dominant spatial frequency peak (with harmonic frequency peaks dependant on that one), the visual cortex will be inclined to interpret the retinal imput data <em>according to</em> molarities and more dependant on the black. The efficiencies gained by compact <em>encodings</em> (of material across the bounded map) <em>at the stem / counter, etc.</em> level will be lost.</p>
