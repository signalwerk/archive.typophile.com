      <p>&gt;we don’t decide to create memories.</p>
      <p>Yes we do.<br>
      We don't learn to read and write in a passive way, we actively train, forcing ourselves to memorize shapes, to imprint these ways of accessing information into the core of our being, as habits. Each one of us creates our own reading technique through intense practice, intellectual athletes.</p>
      <p>&gt;I’m not sure that I understand what you mean by ‘meaning’. </p>
      <p>It's it in relation to the level at which text is accessed. User defined.<br>
      If a reader is skimming sentences in a mostly parafoveal blur, they're getting enough meaning (on their criteria) to not ponder every word.<br>
      They may go back later, rereading, and sharply fixate on individual words.<br>
      Where does that fit in the reading lab scenario?<br>
      What is the reader "seeing" when the words were long ago recognized and decoded, but reading continues and the meaning is still emerging?</p>
