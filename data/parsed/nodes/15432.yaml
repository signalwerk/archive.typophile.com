      <p>I think it might be futile. </p>
      <p>When I look at chinese characters I don't have the same sense of containedness of space by the black, so I am not confident about the 'of salient whites' part in 'bounded map / pattern of salient whites...' with chinese characters in a block or cursive script. And I don't have the same sense of the closedness or enclosedness of the figural complex I do with words in western writing either. So I'm hesitant to transpose the concept to the chinese script domain. It seems less applicable. I don't want to force it. And I don't want to loose what 'bounded map of salient whites inclusive of the black' adds to a notion of word shape beyond what is usually meant by it in studies of reading.</p>
      <p>With chinese writing I get more of a sense of marks that together have a unique and quietly assertive clusteral signature, tightly packed but not clogged to the practiced reader, and without a definable silhoutte structure--I'm trying to find apt words here. </p>
      <p>Like the arabetic samples Thomas Milo shows in his allographic typography pdf there seems to be less reliance possible on the pattern of salient whites in recognition. The eye seems to be forced on to a dependance on other features of the map. (There's something here like recognizing an animal has been here by the tracks, as if an idea has alighted here...)</p>
      <p>The initial appeal of parsing / parcelling was on a different level for me than the bouma-definitional level. I was thinking of the parsing done by the visual cortex at the role-architectural component level, and the parcelling of them 'independant of molarities'.</p>
      <p>Beer and examples would be good.</p>
