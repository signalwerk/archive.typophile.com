      <p>John, I took Nick's <em>[i]n fluent reading, we start from the top, doing only as much as is necessary to get the meaning, inferring the rest</em> somewhat differently. I took Nick to be evoking a kind of probability summation mechanism in the visual cortex, where only enough processing of blacks and white--in their pattern--to promote sense-following need occur. And that this can happen at the phrasal level. Because at the bouma level words and phrases are overdetermined, confidence about identity works on the 'doing only as much as necessary' or selective processing principle. With wordform resolutional confidence comes connection with sense, often even on a phrasal level, because a location in sense- or meaning-space is encapsulated with each boumatic code, and bouma supercodes at a phrasal level might also exist.</p>
      <p>Hrant, by phrase, I mean short strings of words, often two to three items in length. Interestingly, my Random house tells me that in Rhetoric a phrase is "a word or group of spoken words that is perceived momentarily as a meaningful unit". So a bouma string can have a single location in meaning-space encapsulated with it.</p>
      <p>Nick, your way of speaking sometimes makes the processes you describes sound hyper-deliberative. I am reading your sentences as if that's not what you have in mind.</p>
