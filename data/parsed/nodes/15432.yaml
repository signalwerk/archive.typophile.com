      <p>Well, I'm happy <cite>somebody</cite> is keeping track of this stuff! :-) I myself am lousy at housekeeping (at least when it comes to interesting things).</p>
      <p>Frankly though, terminological derivation has always seemed too "academic" to me. I don't mind people using my preferred derivations or making up their own or anything in between - as long as when we actually use the term enough of us can understand it sufficiently well. Your "bounded map" thing can work - it reminds me of "pixel" being (supposedly) derived from "picture element" - although I've heard challenges to that.</p>
      <p>Eben I think has a point about the exactitude of "bounded map" when talking about what a bouma really is. But, as above, I don't mind, simply because the definitions of "bounded" and "map" are nicely fuzzy of themselves!</p>
      <p>I don't mean to sound dismissive - this stuff <cite>is</cite> interesting to me,<br>
      otherwise I wouldn't have lasted these ~7 years studying it!</p>
      <p>hhp</p>
