      <p>John, I think you are right in sensing that for me <em>bouma</em> is simply a more rigorous and sharply defined alternative for ‘word wholes or forms' and you are right in sensing that Hrant and I, and probably you and I, disagree about the specifics of what the term implies, or should imply. But we might still not differ fundamentally about how reading works. </p>
      <p>In conformity with some of the the literature on reading and object perception, I would want to use the term, <em>tokeniztion</em> for what Hrant seems to be alluding to with his "broader scheme" and you spell out with "recognised sub-word letter cluster." <em>Tokeniztion</em>: the identification of meaning-bearing complexes in a character string where they are not physically marked--my gloss on an existing definition. And as you suggest pattern familiarity is key.</p>
      <p>So I would need to add something like this to my explanation:<br>
      The functional unit of perception in skilled fluent silent reading is a bounded map. Tokenization within the bounded map can occur. In unseparated text tokenization has to occur. In both instances tokenization imposes it's own boundaries. In separated texts, word spaces make a provisional, convention-based tokenization of the line of text available to parafoveal vision.</p>
