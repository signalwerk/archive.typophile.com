      <p>"can you really prevent this except by deliberate negotiation"<br>
      "can you craft both a definition that you &amp; Peter Saenger, M. Martin Taylor etc can agree on and which is going to to be specific to your professional concerns and at the same time create a sort of budget model definition useful to type designers"</p>
      <p>Probably not. The most I can ask is that Peter Saenger, Hrant, and the Taylor's say: I see what you're doing and why, and it makes good sense to me. Now this is how what you say relates to how I use it. </p>
      <p>For normal everyday use I could be happy for now with:<br>
      <strong>bouma</strong>:<br>
      [from <strong>bouma shape</strong>]<br>
      Definition:<br>
      A configured whole or <em>bounded map</em> of interdependant internal figural components.<br>
      Explanation:<br>
      Type design, typography and our reading-ware treat words in text visually as bounded maps of <em>visual (con)figural</em> 'stuff' to be process as a whole, not first and foremost linguistically as <em>letters with assigned orthographic identities arranged in an agreed-to order</em> to be processed bit by bit. "The natural form of reading is not by spelling or syllabification, but by grasping word wholes, i.e., word forms or configurations, constituting the units of perception in reading."<br>
      Motivation:<br>
      The reason to push beyond terms like word <em>wholes</em> or <em>forms</em> to expressions like 'bounded maps of figural stuff' is to give these terms substance and sharpness, a greater specificity or definition. And to forestall inadequate formalizations of them in empirical testing situations.<br>
      Practical import:<br>
      Among other things, this makes distinctiveness of the figural map, bouma distinctiveness, important for efficient processing, or readability.</p>
