      <p>William, thanks. The things you threw out resonated more with things I've read in the literature on reading than they do with my own thinking. But they do require consideration. I am on a different track but one that needs to be able to accomodate what transpires when the reader meets the kind of truncations you spell out. One of the things I do hold is that, when the reader trips over an unfamiliar word, a process is set in motion that is decipherment based, and tokenization to the letter level happens. Something like word-identity, pronunciation and meaning hypothesis testing might happen here. So there is some overlap at this level with your suggestions.</p>
      <p>On the matter of spacing and rhythm, I'm using fourier transforms to get some kind of a stable benchmark for defining good rhythm. Then I want to describe a theory of lateral interference that guages the inhibition to molarization in a rhythmic system where stem-like agents are the items for processing. I think this will predict what happens to the Word Superiority Effect under different spacing conditions, and what response patterns (relative to accuracy and response times) we should see in a forced-choice test where spacing and format are the independant variables and co-varied.</p>
      <p>Then the question becomes, what kind of theory can best explain the pattern of results. And what results would test my confidence in my scheme.</p>
