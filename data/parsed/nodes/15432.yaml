      <p>Hrant, I think William is correct in suggesting "that serifs are plausibly of value to the reader under the parallel processing models as well as bouma theories. So the values of serifs is not, to my thinking, a crucial test between competing theories."</p>
      <p>Here is how I rationalize William's claim:<br>
      From a perceptual processing point of view serifs affect saliences (and saliencies modulate cue-value). Herman Bouma and Cyril Latimer, and possibly some other researchers, hypothesize that some parts / features of letters or zones in their map have greater cue value than others. So if a serif marks an important zone or a cue-value-rich component or feature, it will make it more salient and heighten the recognizability of the glyph.<br>
      (There might also be an argument from 'well-formedness'. 'Well-formedness' is a gestalt-theory consideration (and for gestaltists a perceptual processing requirement).)</p>
      <p>I can see both a wholistic (whole-wordform resolutional) processing oriented researcher and an analytic (parallel-letter recognitional) processing oriented researcher accepting the above as a working hypothesis without jeapordizing their paradigm.</p>
      <p>Where they take it will be different. A wholistically oriented researcher might hypothesize that under appropriate spacing conditions serifs have the added benefit of making the 'whole' more robust or well-formed as a whole or perceptual entity, and that that is good, because automatic tokenization to the letter or glyph-molar level is inhibited. A researcher with an letter-analytic processing bias might hypothesize that just because of that--just because of the inhibition of glyph-molar tokenization through lateral interference--letter spacing should be wider than most type-involved people think it should. And [s]he will want to show that a readbility advantage can be documented.</p>
      <p>So the values of serifs is not a crucial test between competing theories. While predictions about spacing, premissed on notions of lateral binding / lateral inhibition that have functional-anatomical teeth might be. To me having functional-anatomical teeth means conforming with robust knowledge about signal tuning, signal integration, signal squelching and signal summation routines in the visual cortex, i.e., robust knowledge of lateral interference / integration.</p>
      <p>If the researcher with a 'letter-analytic' bias finds that looser spacing does not produce the documentable readability advantage he or she expected, he or she will try to adjust their paradigm without jumping ship. Sometimes that will produce explainations that are byzantine or inelegant in their complexity. This is what happend to the Ptolemaic picture of celestial mechanics--epicycles within epicycles. And than a Copernicus comes along and realigns everything.</p>
