      <p>Eben,<br>
      1. Yes. Slot coding is recognizing the part first--or better, activating a (so-called) detector neuron for the part first--but it is not done consciously in reading, it is done automatically &amp; subliminally (according to its proponents). I think it is not done period when encountering familiar words during immersive reading. </p>
      <p>2. My comments in my previous post were to explore the applicability of the bouma-concept to other script systems, not to raise doubts about its applicability as I had done earlier in relation to arabetic scripts (pardon the about face). One of the things I was trying to show is that such an exploration promotes a more intimate knowledge of what the visual cortex relies on optical-grammatically in other scripts compared to the western script. Does it rely on the white in quite the same way? </p>
      <p>In arabetic scripts 'bound(ed)ness' is still a usefull construct (thinking about them in terms of their boundedness as wholes is a useful exercise), but words in arabetic scripts are bound or bounded in a different sense than words in western scripts. Bound by different mechanisms? The main real benefit to the concept is to force us to see words (parsed / parsable and parcelled sense units) in non-simplistic <em>visual-figural / integral-unit / object-like</em> terms rather than <em>abstract-orthographic aggregate</em> terms.</p>
      <p>Try to think of parsing / parcelling etc., in perceptual processing terms, not as 'mental' operations. That's the problem with many studies of reading: reading is seen as a chiefly mental cognitive process with a quite straightforward and relatively minor perceptual processing compontent. I say that in studies of reading the perceptual processing component is massively misunderstood. There are some signs that this is changing.</p>
