      <p>Nick: <em>In fluent reading, we start from the top, doing only as much as is necessary to get the meaning, inferring the rest.</em></p>
      <p>I find this sentence very problematic, because I'm not sure that I understand what you mean by 'meaning'. This could be taken to imply that we 'get meaning' somehow independently of 'getting the text', and that we only get as much of the text as we need to get the meaning in 'fluent reading'. Something like this might be true of informational texts such as manuals, but we are more likely to be skimming the text in such cases than engaging in what I would think of as fluent reading, or immersive reading to use Hrant's phrase. Most of the time when I am reading -- novels, non-fiction works, journal articles, even quite a lot of newspaper content -- I am not getting meaning independent of text: the text <em>is</em> the meaning that I am getting. I am 'getting' arrangements of clauses, phrases, sentences, parapraphs, etc., not a kind of on-the-fly paraphrase of the meaning of these arrangements.</p>
