      <p>&gt;unlike the more complicated chinese characters</p>
      <p>In Chinese characters, the compounded ones (with more than one radical) usually have part indicating the sound-a simpler character with the same sound but different meaning-and one part indicating the meaning. I forget whether the sound one is on the left or right, but it is systematic, I believe.  </p>
      <p>Peter, going back to your commments on the importance of rhythm in the counters as they march across the page. I like the ideas, and it sounds like this could be put into a valuable, and maybe true testable theory. But I don't see why it couldn't also be made part of a parallel processing view. There the idea could be that good rhythm enables the eye to pick out individual letter quicker, but the processing is by assembly of letters into the word, and matching with a mental dictionary. </p>
      <p>Finally a general comment on the bouma vs parallel view. My old teacher Popper had the theory that the mind was actively, relentlessly testing our theories in order to understand incoming data. For example, the periodic reversal in optical illusions, such as the <a href="http://www.cut-the-knot.org/Curriculum/Geometry/Necker.shtml" rel="nofollow">Necker Cube</a>, he attributed to the brain testing and then failing to confirm one theory of the perspective, and then trying another theory. </p>
      <p>If the brain is trying this super fast and multi-faceted hypothesis testing on letters and words, we might expect that every type of analysis is at work, maybe simultaneously. For example, short words like 'was' might be recognized immediately as patterns--the 'bouma' view--while if there is not such an immediate recognition an assembly process might be going on--or both in two tracks simultaneously, with one abandoned when context corroborates a guessed meaning. Also the brain might be guessing from first and last letters, and the meaning of the contextual words--explaining how we don't notice many typos. In other words, as soon as the brain gets a plausible hypothesis given the  contextual meaning, it might just fly along further with that meaning, and only have the eye jump back if not confirmed, to look more carefully. For example, it is possible that the brain can identify words from a few individual letters without identifying a     full bouma or doing a full assembly process. This could be tested perhaps by having words with missing or wrong letters and see how easily they are read. </p>
      <p>Thos cxxld bx txxted by hxvxng wxxds wxth mxssxng or wxxng lxttxrs.</p>
      <p>This reminds me of the fact that Hebrew is normally written without vowels, and that English, without vowels, is surprisingly easy to read without vowels, except for very short words.</p>
      <p>Ths rmnds me tht Englsh is sprsngly easy to rd wtht vwls...</p>
      <p>The way some words with missing letters are easy to read and others hard would probably tell us a lot about the process--maybe there's even a test here. Misspell word with a related 'bouma'--such as round letter replacing another round, and one with an ascender another ascender--or mangled letters with some feature of the original, then that should be much more quickly read than with letters replaced by words whose features are more different by salient features--or not, depending on who's right.</p>
