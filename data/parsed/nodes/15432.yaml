      <p>Right. This is where you seem going - the difference between a directly observeable optical form the visual grammer of that form, and the mental parsing of those signs. Obviously they relate to each other in some strong ways. But the maybe point of bouma is perhaps their intersection. Would it be fair to characterize bouma then as a visual unit of meaning mentaly parsed from a larger set of signs? I like this better because it focuses on the parsing first &amp; then the visual. The unit is something you can map out on the signs &amp; point to but is not the same as the signs - nor is it the same as the mental process alone. I imagine I may well made a mess of this - but what do you think? </p>
      <p>If there is anything here in this then the advantage of it would be that it would be a definition that was less culturally bound that the one being used before. I find that more satisfying. </p>
      <p>I have to acknowlege that there is probably a powerful utility in having language specific terms. I guess am keen on bouma not being one of these for some reason. This despite the fact that I see now what your mean by cultuarl differences in a textual saliency map. My sense of the word had been so caught up with a visual definition up until recently that I found the idea of using bouma for western texts kind of sad. It seems lile a universal term is a more powerful term too... </p>
      <p>Like the term 'plural'. No matter how indicated in a given language - and it varies alot; plural is still a useful concept - even if you are comparing a language which specifies kinds or flavors of plural with great specificity to one which goes: One, two, three, four, five - lots/much/many. Still, we are talking 'plural'.</p>
      <p>Your comments about the 'point of saliency' seem skewed in favor of the utility of condensed forms. Why should that be? Isn't bouma the tied to the parsing event  - rather than the relative ease or lack threof in the parsing process? </p>
