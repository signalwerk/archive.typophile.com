      <p>Peter, I see your point, but can you really prevent this except by deliberate negotiation? Maybe that's wht you are doing here.... I see. And certainly I can see some reason to try to be clear about the terms definition or it's utility goes away. </p>
      <p>The question that comes up next is can you craft both a definition that you &amp; Peter Saenger, M. Martin Taylor etc can agree on and which is going to to be specific to your professional concerns and at the same time create a sort of budget model definition useful to type designers. I for example might be willing to wade into the field of jargon ( that is legitimately neccesary to persue your work - that was not a crit at all! ) to attempt to understand what you mean - but most folks who design type are going to want a sort of workhorse definition. It seems to me that there is room for both. After all what a chemist means by sugar &amp; what I mean by sugar when i go to the grocery store do overlap to a significant degree but the grocery store definition cannot be said to be nearly as precise.</p>
