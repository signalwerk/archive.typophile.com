      <p>Thanks Eben, I suppose all I would really want <em>bounded</em> to call to mind is: delimited, having some definite extent in spatial terms, demarcated by background or white, which, judging from your reply it does. It doesn't concern me that the boundary might be thought of as well-defined or sharp, rather than blurry or hazy or fuzzy, because in foveal vision the demarcation between foreground and background, information and noise (a paper stock with a 'tooth' has noise--nice noise), appears distinct <em>but isn't 'thematized'</em>--it doesn't become a feature, so to speak, subject to devoted processing routines. I don't believe the boundary or 'envelope structure' is separately thematized (or separately responded to as such) in parafoveal vision either, though I do believe definite information is captured there about extent (and coarse but accurate information about internal composition as well--too coarse to spark visual wordform resolution and a sense of perceptual connectedness with the words on paper, but accurate nonetheless.)</p>
      <p>It might help you to know that one area where I disagree with Hrant is that the wholistic response bias isn't shattered in foveation such that processing becomes <em>letter</em> recognitional (or at best bi- or trigram-recognitional) rather than remaining fully wordform resolutional. Parafoveal vision, meanwhile, is unable to acheive wordform resolutional closure, or so I've come to think.</p>
      <p>So because it still evokes many of the things I think it should (also indirectly the idea of cross-letter-cluster binding), and because some of the things I think it shouldn't (like 'bordered', or 'boundaried') are probably knocked out by it's association with (information) <em>map</em>, and because it provides a nice anchor for the <em>bou</em> of <em>bouma</em>, I guess I feel inclined to keep it, at least as a mnemonic--something to remember the meaning of the term by.</p>
