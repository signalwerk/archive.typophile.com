      <p>&gt; Each one of us creates our own reading technique</p>
      <p>Essentially: no. The necessities and mechanics of reading end up overpowering any personal variances, and we almost all end up reading pretty much the same way. The only thing that varying one's way of learning to read does is alter the point at which it "clicks" (which normally happens about age 10). All those teachers teaching us how to read are basically nannies, not shepherds.</p>
      <p>&gt; If a reader is skimming sentences in a mostly parafoveal blur, they’re<br>
      &gt; getting enough meaning (on their criteria) to not ponder every word.</p>
      <p>That's not reading (in the sense of the word useful to us).</p>
      <p>However, I'm glad to see you're in fact a close subscriber<br>
      of my own theory of reading, at least in relation to Kevin.</p>
      <p>hhp</p>
