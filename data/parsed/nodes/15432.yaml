      <p>I think there are different levels, or degrees, of observation with which we can observe Latin text-shapes in order to recognize them, thereby decoding their meaning.</p>
      <p>1. the shape of phrases<br>
      2. the shape of words<br>
      3. the shape of phonetic or syllabic letter groups within words<br>
      4. the shape of individual letters<br>
      5. the shape of letter parts</p>
      <p>In fluent reading, we start from the top, doing only as much as is necessary to get the meaning, inferring the rest.<br>
      The levels have been learned from the bottom up, a hierarchy of skills.<br>
      On any given day, we may proceed differently through the levels, or do so on rereading.</p>
      <p>In type design, the designer pays attention to making all these levels of recognition as clear as possible, because they are all relevant to the process of reading. So although the designer works on discrete letters (level 4), the context of the other levels is always in play.</p>
      <p>I think that boumas are dynamic visual constructs created by the viewer, prefigurations of what one expects to see next. The process of seeing/reading involves the creation of successions of boumas, from level 1 down, each bouma collapsing at the point of closure when meaning is deduced.</p>
      <p>Boumas are flexible shapes, envelopes, or conceptualized graphic relationships which are fitted over, and matched against perceptual data. They are a library (or toolbox) of patterns which one has learned.</p>
      <p>Typographers teach themselves the bouma of good letterspacing, aka even color; this is a non-linguistic way of reading text, a meta-level of control.</p>
      <p>A bouma is a specific kind of gestalt phenomenon.</p>
