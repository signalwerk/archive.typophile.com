      <p>I don't get this, at least not the way I use "bouma". The main question really is, do we sometimes recognize certain clusters of letters as wholes in some cases, or do we always build everything from individual letters? Recognizing a bouma precludes worrying about its component letters - unless you regress to a bouma that seems to have been misread, and you foveate on the cluster to disambiguate it. The whole point of relying on boumas is speed - so there's no point bothering with the component letters of a bouma that's been "confidently" deciphered.</p>
      <p>&gt; you have solved the mechanics of word recognition by introducing<br>
      &gt; the problem of the mechanics of bouma recognition.</p>
      <p>Word recognition, the way I use the term (in the semantic sphere) is on a higher cognitive level than bouma/letter decipherment. In fact it's on a level beyond the context of type design or typography. The important/interesting thing for us is how the shapes get decoded (before they get to the semantic level) and the bouma model validates a bunch of things (like serifs) that the PL model does not. The two are fundamentally different.</p>
