      <p>"But if you find that you are stuck with that, then my suggestion is to ‘operationalize’ it: make in-principle testable, concrete scenarios."</p>
      <p>That is what my terminological proposals seek to promote: suitable  operationalization. Operationalization is not the <em>alternative</em> to what I try to do. It <em>is</em> what I try to do with all the plain language and terminological resources I can muster. You are unhappy with my <em>way</em> of doing it and the consequences. In my Typo article I complained about Kevin's paper's 'inadequate operationalizing' of the construct 'word space', and I explore avenues to operationaliize the construct more adequately. Which is why we need the specificity potential provided by the bouma-concept.</p>
      <p>The reason for my challenge was for you to put yourself in my shoes. I would love to see what your terminological appartus might look like after suitable immersion, or what the terminological appartus of the both of us together might look like after suitable immersion.</p>
      <p>Did Charles Saunders Pierce say 'practical'? Functional-behavioural consequences at different levels of processing in the visual cortex are one thing; consequences for practice quite another. Both enhance clarity. I try to explore both. Which is why I try to articulate a specific proposal for rhythmic spacing using fourier transforms.</p>
      <p>I don't think I am leaving aside things that need to be done where I can (I don't have access to a lab or team of researchers; but I do have fourier processing plugins), and doing less relevant things instead, out of the context of what needs to be done.</p>
