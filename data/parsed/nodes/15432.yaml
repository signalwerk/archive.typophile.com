      <p>Eben, while you were posting your post, I was preparing the following (I do think my last post and your thread are related; expanding /providing illustrations is the long-term plan):</p>
      <p>After a representative but not exhaustive search of the google-store of material about bouma and bouma shape on line, and in the context of the above, I suggest that for general use, or as a workhorse definition, we stick with the Paul Saenger gloss of the term or go with the widely available wikipedia definition.</p>
      <p>Here is what the wikipedia makes of it:<br>
      "the shape of a cluster of letters, often a whole word"*<br>
      Saegner's gloss:<br>
      "each word a distinct image"</p>
      <p>If we need or want to discuss word shape or reading at a deeper level than this allows, I suggest we use the expanded notion of bouma as <em>the bounded map of salient whites inclusive af the black</em>** to guide us in our thinking about word shape and reading. So the word shape of the word is its map or distinctive pattern of salient whites, inclusive of the black.<br>
      • this puts our thinking about shape and recognition into congruency with an, I think, robust notion of how the visual cortex processes word-like-stimuli;<br>
      • it discourages 'easy operationalism' by calling to mind more with the term word shape than is usually meant in the cognitive scientific, perception-science and neurological literature on reading (beyond 'envelope structure' and 'raw pattern of neutral, ascending, and descending characters,' it encodes internal figural form elements)<br>
      • it channels action in productive directions, encouraging us--when working with existing types, or devising new ones--to think about the whole, and the white, divergence and the visual integrity of the word image </p>
      <p>So for purposes of discussion I will call the word shape of the word its distinctive map or pattern of salient whites, inclusive of the black. And when I say reading is bouma-based I will mean by this, that this is what the reading person orients his or her attention to for the purposes of perceptual processing: the bounded map of salient whites, inclusive of the black.</p>
      <p>Digging even deeper has additional benefits. Things like the importance of spacing becomes apparent. Things like the importance of space craft becomes apparent when we specify a perceptual processing scenario or scheme and the neural signal transmission mechanism underlying it.<br>
      Here is a new try at describing my scheme:<br>
      Letter parts, not letter wholes, are the mediating agents in word recognition. In fluent reading of well-formatted continuous text, assembling letter parts into their letter wholes, as an intermediate step (I call this: componential abstraction), does not spontaneously occur. (This contradicts Kevin) The perceptual processing routines that underlie word recognition go from the disturbance of the bounded map (or field) by letter parts to the pattern of the salient whites. The pattern of the salient whites inside the black is what we most rely on. What we see is the map of salient whites inclusive of the black. And we see this particular map as this meaning-holding word.</p>
      <p>* The full wikipedia entry reads:<br>
      The term bouma (pronounced "bowma") is sometimes used in the work of cognitive psychology to mean the shape of a cluster of letters, often a whole word. Some typographers believe that, when reading, people can recognize words by deciphering boumas, not just individual letters. The claim is that this is a natural strategy for increasing reading efficiency. The term bouma is a reduction of "Bouma-shape", which was probably first used in Paul Saenger's 1997 book "Space between Words: The Origins of Silent Reading", although Saenger himself attributes it to Insup &amp; Maurice Martin Taylor.</p>
      <p>The bouma as 'reduction' quip makes me think of my 'bouma as bounded map' as an 'expansion' (this could be further expanded to 'bounded difference map')</p>
      <p>** <em>the bounded map of salient whites inclusive of the black</em> is an attempt to come up with something more succinct than: "the bounded map comprised by the totality of stems, cross-bars, bowls, counters, between-letter shapes, angular components, and the like, in their pattern." It is also slightly differently skewed.</p>
