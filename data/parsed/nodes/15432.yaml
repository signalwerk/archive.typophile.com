      <p>Hrant, about my use of 'anticipatory': the visual indexing of parafoveally available text at the phrasal and word level bears on what lies ahead in the visual stream. So it is anticipatory. Indexing what lies ahead (for subsequent foveal attention) and triggering grammatical expectations or determining their precise semantic loads are different things, though they work together. Indexing what lies ahead requires compiling ensemble statistics; triggering down-stream expectations requires a visual wordform resolutional event; connecting to the semantic load of the indexed items--word or phrase--requires a new fixation and a new visual wordform-resolutional event down-stream.</p>
      <p>I'm dubious about your mootness claim: entire grammatical phrases fall within visual parafoveal range at every line-of-type-medial fixation.</p>
