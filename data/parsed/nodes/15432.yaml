      <p><em>I don’t get this, at least not the way I use “bouma”. The main question really is, do we sometimes recognize certain clusters of letters as wholes in some cases, or do we always build everything from individual letters?</em></p>
      <p>My point is that we don't have a tested model of bouma recognition. To say 'we sometimes recognise certain clusters of letters as wholes' is begging the question: you are making assumptions about <em>how</em> we recognise those clusters. Let's say we have a letter cluster 'bed' and a letter cluster 'bad'. We have two possibilities for recognition, both entirely reliant upon distinguishing the middle letter of the cluster, since that is the only difference between them:</p>
      <p>1) we recognise the cluster as a whole, taking into account the impact on the appearance of the whole of the middle letter.</p>
      <p>2) we recognise the cluster by recognising the individual letters that make it up, essentially applying the parallel letter recognition model to sub-word clusters in the same way as we do to whole words.</p>
      <p>In either case, I reckon a huge amount of bouma recognition rides on context if we're talking about cues in the parafovea. I don't think there is sufficient distinction between bed and bad to be recognised with certainty in the parafovea, so we make a best guess based on context which is either confirmed by subsequent fixation content (in which case we proceed) or is not (in which case we regress).</p>
      <p>I know you won't like the second option because you have been happily assuming the first, but hopefully you see that it is a reasonable possibility and something that should not be discounted without testing.</p>
