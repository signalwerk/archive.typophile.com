      <p>Having not investigated these thing except by proxy I can only refer back to what you both say you are getting at &amp; look for holes if I see any. </p>
      <p>Peter, when you remind us that bouma is a term that is relevant both when text is in focus &amp; when it is just starting to be perceived (before focus actually occurs) - I find my reservations about using the term 'bounded' retreat. This is because at some point it really is bounded in a fairly tight, crisp &amp; precise way. Tight enough in my view to justify 'bounded'. You also say, "delimited, having some definite extent in spatial terms" and even if it's splitting hairs I would have to say that yes; even when out of focus, text has some sort of range of blur that is limited. </p>
      <p>Hrant, I agree with you about 'map' &amp; 'bounded' in reality or RL as the scifi folks say - but I am not so sure about the linguistic intent. There I think the intent, albeit fruitless at some level, is to nail things down &amp; make them certain.</p>
      <p>Peter, you mean 'Drift' as in obscuration as opposed to alteration, or enhancement - no? </p>
      <p>Certainly most english words drift a great deal over time if all you mean by drift is change. Whether the change is good in any of these cases depends where you stand. </p>
      <p>Also while I do think it's worthwhile to try to bring this word child up right for now; you must realize that it is going to have go out on it's own one day and get it's own apartment etc. </p>
      <p>;-)</p>
