      <p>Peter, thanks for the examples. </p>
      <p>I guess I intuit what you mean about the Milo examples and white boundedness on the L&amp;R sides. The trouble is that the tops also seem bounded to me. The black is surrounded by white. The meaning I am taking is like that of water. Water, for instance, surrounds islands. An island is bounded by water. See what I mean? I wonder if the bounded you mean has to do with the sweep of an eye over the text. Maybe you are suggesting that a text which has overly long ascenders (or has overly long descenders) ends up being read like an eye over a picket fence at close range. That would make the text (for a reader) 'not bounded' perceptually speaking - despite being litterally bounded by white. I wonder if in the case of the taller more extreme examples / styles of arabic text the point of focus is less tight and the Bouma idea is applicable after all. Also, the most extreme examples of this kind of writting is usually reserved for a title - not running text - but we are not experts. I would need to look into this quite a bit more. Still, as an example maybe arabic text is a good theoretical model to help me understand what you mean.</p>
      <p>The next aspect I wanted to explore is common to Hebrew &amp; chinese &amp; Japanese. An abscence of word spacing. In all there texts you get a series of glyphs which share a common height ( no arabic style problem here! ). But there is a second variance with western text. One that arabic doesn't have. 'Words' are not separated. In Hebrew there might be texts where this is done now ( are there? I know modern hebrew uses quotes sometimes too...) but old hebrew did not do this. So in this way Old Hebrew might be violating an idea about bouma - that there must be word spacing. Chinese might not be said to do this because each ideogram can be perhaps thought of as a word. On the other hand the regularity of texts might be an issue. Japanese text is a hybrid. It uses Chinese characters but then also uses phonetic characters ( Hiragana &amp; Katakana ) with no word spaces.</p>
      <p>The last aspect I wondered about is the dense kind of Chinese character - one with many marks packed tightly. For some reason I had an idea that this kind of glyph would be be the sort of thing that would violate an idea about being 'bounded by white'. Now I doubt you would have a problem with it  - but I would still like you to comment on it.</p>
