      <p>Also, John, 'the mechanics [I want to say: 'perceptual processing mechanics'] of bouma recognition', or as I like to say 'visual wordform resolution' is the heart of the matter from a typographical point of view. And to stick with the terminological question, an understanding of 'word wholes' as <em>bounded maps</em> provides opportunities for a specification of 'wholes' fit for empirical testing at a <em>perceptual mechanics</em> level.</p>
      <p>A further note about tokenization:<br>
      Tokenization to a letter or 'glyph-molar' level happens only in 1) learning to read, 2) letter-by-letter reading and 3) dechiperment of unfamiliar words. In separated text a single letter is a whole word. This is an argument against parallel letter recognition as the primary mechanism in word recognition. We can call it 'the tokenization argument'.</p>
      <p>William, your "when letters <em>are spaced widely enough</em> for quick and easy letter recognition (my empahsis)" begs the question <em>when</em> that is. And is it different for quick and easy visual wordform (read: bouma) resolution, as I am inclined to believe? That is, is it wider than the currently accepted norm, which craft knowledge claims optimizes readability? And if it is wider than the currently accepted norm will it be possible to maintain, even with the help of serifs, an even colour or a vibrant texture?</p>
