    html: <p>William, regarding your 'multi-faceted hypothesis testing' scheme, I'll say there are more than one routes to recognition, but it's not a horse-race between competing routes. When the preferred efficient 'non-molarizing' / 'pattern of salient-white compiling' route does'nt work because the cluster (or the part of the cluster that is in the form-resolving field) is unfamiliar, the system switches horses taking the longer and harder route to recognition, tokenizing to the letter level, with a subsequent (re)assembly process. A different set of signal-processing protocols kicks in, that will, over repeated encounters with the new word, lead to a boumatic shortcut / a compressed encoding. Also, the perceptual processes work on a principle of sufficient confidence, not absolute confidence. This leads to missed typos, etc.</p>
