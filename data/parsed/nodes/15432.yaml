      <p><em>I think you need to make explicit that you don’t believe Kevin</em></p>
      <p>But I believe him at least as much as I believe you. Sorry, Hrant, but I am not discounting or disbelieving any reasonable explanation of the reading process at this stage because I simply don't think we have enough solid knowledge, only conjectures. The parallel letter recognition model happens to be supported by a number of empirical studies, and also conforms to what we know about how the brain seems to handle other processes, so I certainly am not going to say that I don't believe it. I'm not convinced that it explains everything about the mixture of speed and accuracy of mature reading, but on the other hand it is obviously a sufficient explanation during the time we are learning to read. This suggests to me that parallel letter recognition might be <em>the primary reading mechanism</em>, and anything else such as bouma tokenisation and recognition is a developed extension that improves reading speed and accuracy but is not essential to the basic cognitive operation. It is pretty obvious that we can read without relying in any way on bouma recognition; what is of interest is the degree to which bouma recognition might contribute to reading <em>well.</em></p>
