      <p>Eben: <em>I thought that boundedness was something that you had been using in order to avoid fixating only ‘black’ and allowing for a more Notanic or whole view. A view that was aware of both the shape of letters and of the counters and in-between shapes.</em></p>
      <p>Yes, that is what I am after.</p>
      <p>Eben: <em>Let me try my idea out in a simple way here first: In western letterforms we have counters which are surrounded by black. Like in an ‘O’. In this case for instance the white of the counter is a part of the bounded map as much as the white around the outside of the ‘O’ is it not?</em></p>
      <p>Exactly. </p>
      <p>I think what might have thrown you off is my comments about Arabetic scripts. In your reply to those comments you asked: "Is [the] bounded part of bounded map related to the discreet forms--the separateness of letters?" In reply to this I say: no, it is intended to refer to the whole of the cluster.</p>
      <p>But when I look at the items in this Thomas Milo sample:<br>
      <a href="http://www.enneson.com/public_downloads/pe/fa_bi_tathbiitayni.pdf" title="www.enneson.com/public_downloads/pe/fa_bi_tathbiitayni.pdf">www.enneson.com/public_downloads/pe/fa_bi_tathbiitayni.pdf</a></p>
      <p>I see a bounded map, but bounded--in the full sense of the word--on the left and right only. Top to bottom there is more of a dispersion pattern of marks across a peak / valleyed band. I don't get the sense that 'pattern of salient whites inclusive of the black' is descriptive of what is there, or what the visual cortex relies on. I might opt for something like: 'bounded map of marked and salient peaks, inclusive of the valleys, and inclusive of the markings: in their pattern. I am unsure of how to include the white, because it is rarely 'contained' except at the extermities left and right, and stuctured in the valleys.</p>
