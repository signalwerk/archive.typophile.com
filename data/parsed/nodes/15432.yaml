      <p>&gt;all they [serifs] add to the decipherment of individual letters is noise</p>
      <p>No, serifs add the qualities I mentioned, not just noise. </p>
      <p>&gt;&gt;Exactly which characters are mainly differentiated by their serifs?</p>
      <p>Not 'mainly'--the main features are preserved in sans faces. But I think serifs make differentiation easier. For example, the serif on the top of the n's stem makes the n look more different from an o than is the case for a sans, perhaps making it easier to recognize, particularly in context of other letters. </p>
      <p>&gt;So you’re saying:<br>
      - sans fonts have less even color than serif?<br>
      AND/OR<br>
      - loose letterspacing helps readability?</p>
      <p>'No', and 'oversimple'. Sans can have even color, but as Tracy points out they normally need to be more tightly spaced to have even color. However, I think Peter is on to something about having a set rhythm which is then slightly disturbed by where vertical elements hit one way and another--something like syncopation in music. </p>
      <p>My pet theory is that the absence of serifs makes it difficult to achieve good spacing for readability, probably because the narrrow space between stems violates optimal rhythm in a wide face, such as Helvetica. I think things like Meta and Vesta read better because the ratio between the counter and space between letters is better. </p>
      <p>Thinking about this now, I am thinking that one of the reasons even color is important is that it might ease identification of what is a 'word' in the parafovea. In other words, if you have an evenly grey blob with a space, then another evenly colored blob, it might help to plan the next jump of the eye. </p>
      <p>&gt;loose letter spacing. </p>
      <p>There is obviously such a thing as too loose space and too tight spacing, but what is optimal is not easy to ascertain.</p>
      <p>Peter, I sort of get the idea of what you are talking about as regards rhythm, but not fully. There are two aspects to making it testable. One is to specify it with sufficient precision that it will potentially be contradicted or connfirmed by further observation. the second aspect has to do with the logical links of your spacing ideas to the 'bouma' theories. If you can't derive it logically from you Bouma theory then a test of your spacing idea won't reveal anything about the larger theory. Similarly, if you can't show that your idea of spacing contradicts the parallel processing by letter assembly idea, then you won't have a crucial test, enlightening though it may be.</p>
