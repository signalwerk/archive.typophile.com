      <p>Eben, the only experiments I do are with fourier transforms. I haven't published anything on reading other than the <em>Typo#13</em> text.</p>
      <p>Nick, the more I read your post the more I like it.<br>
      While I've tried to use the bouma / bounded map concept to help me to formulate a more robust notion of word shape than current cognitive-science usage promotes, the idea of dynamic [prefigurative] visual constructs [...] from level 1 down [...] each collapsing at the point of closure [...] is massively appealling.</p>
      <p>Reading involves a dynamic anticipatory visual indexing of parafoveally available text at the phrasal and word level, and upon foveation of the parafoveally indexed items, sometimes involves tokenization to the phonetic / syllabic or letter level--with letter-part discrimination as a last reort--to promote visual wordform resolutional closure.</p>
      <p>If the core idea in the bouma-concept is visual information maps, it could be useful to distinguish word-maps, phrasal maps, sub-word maps.</p>
