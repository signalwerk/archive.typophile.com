      The reason to push beyond terms like word <em>wholes</em> or <em>forms</em> to expressions like 'bounded maps of figural stuff' is to give these terms substance and sharpness, a greater specificity or definition. And to forestall inadequate formalizations of them in empirical testing situations.<br>
      Practical import:<br>
      Among other things, this makes distinctiveness of the figural map, bouma distinctiveness, important for efficient processing, or readability.</p>
