      <p>"I have not read the literature on the question of readability..."</p>
      <p>William, you need to read material that addresses the matter of <em>perceptual processing</em> in reading, and that will include material that addresses reading at the mechanical level of neural signal processing: how atomic (= unitary) pulses, originating on the retinal surface are combined--here I might indeed use assembled--to give the visual cortex an impression of the feature map (all under the supervision of a wholistic response bias). Literature thematically focussed on the question of readability doesn't usually address this.</p>
      <p>What happens with impulses originating in the fovea, where rods and cones project to a dense mosaic of ganglion cells and then enter the parvocellular stream, where there are additional layers of processing?</p>
      <p>What happens with impulses originating beyond the fovea, where rods and cones project to a much less dense mosaic of ganglion cells and then enter the magnocellular stream?</p>
      <p>How is information from the two streams integrated? At what level?</p>
      <p>Kevin has a special theory of lateral inhibition that applies to signal integration at the ganglion cell level (and it appears to be robust), but has, to the best of my knowledge, no <em>explicit and tested</em> theory of lateral inhibition or signal integration that applies at the higher levels of the visual cortex. Probably different implementations of the same general principle apply at all levels, and there are currently judged to be 4 to 7 involved in reading. I know of no detailed model that has worked this out in algorithmic terms.</p>
      <p>To fully assess the difference between my proposals and Kevin's we will need explicit theories and a set of models that predict behaviour at this level, at the neural mechanics level and develop a test which can reveal things about these processes relative to immersive reading.</p>
      <p>Kevin knows this as well as I do and we are both informally committed to making moves to pursue this, but without you or others getting into the details at this level my descriptive proposals may continue to seem frivolous or needlessy cumbersome to many, and we will continue to go around in circles about the need for them, or the usefulness of bringing them into discussions of matters like the importance of serif or divergence. I bring them in where I think a discussion has become gridlocked and they might get the discussion moving again by pushing it to a deeper level in the perceptual processing domain.</p>
      <p>I would be happy if others joined the effort to clarify what happens at the neural mechanical level in the visual cortex, and could propose  simpler terms that make mine redundant.</p>
      <p>I wrote the above before your latest post.</p>
      <p>In reply to the second paragraph in your latest post, I tried to describe contrasting scenarios visually in my Typo_13 contribution, figure 6 an 9. Figure 9 illustrates the last paragraph on page 24.<br>
      Figure 6 is here: <a href="http://www3.sympatico.ca/penneson/pe_figure_6.pdf">http://www3.sympatico.ca/penneson/pe_figure_6.pdf</a></p>
      <p>The correct version of Figure 9 is: <a href="http://www3.sympatico.ca/penneson/pe_figure_9.pdf">http://www3.sympatico.ca/penneson/pe_figure_9.pdf</a></p>
      <p>I also find that "the effort to write as clearly and concretely as I can forces me to clarify my ideas." I try to avoid abstractitis, but I don't see any benefit in avoiding abstractions when they are called for. Frequently they are, but that is a judgement you might not share. That being said, I do enjoy serious terminological play, and it probably shows. </p>
      <p>In your: "the parafovea is able to distinguish words to the right" I would have problems with "distinguish words". What does 'distinguish' mean? It is too open a term to discuss visual mechanics and the specifics of saccade-generation. The most I can confidently assert is "assembles accurate ensemble statistics about" (not my terms, though I've adopted them), and the parafovea doesn't <em>do</em> it, the ganglion cells do it on the basis of information the parafovea supplies. Etc. What do these ensemble statistics look like or give information about? We are still not sure. More testing needs to be done to tease that out.</p>
      <p>The point is, if we want to explore and weigh Hrant's idea of bouma identification in parafoveal vision to the point where his conclusions might become fruitful for channelling typographic practice, we will have to be clear about (specify) how "distinguish words" needs to be understood. Sorry William, I see no other way.</p>
