    html: <p>Willian, one more thing, I don't think of what is going on in the visual cortex as an 'assembly process'. I think of it as a trace recognition process. As stimulus-provoked impulses move through the structured neural mass, where all kinds of processes of integration, enhancement, averaging and squeltching occur, at a certain point the system will recognize the trace pattern of neural spikes passing through the system. This will happen even with something as complex as radical-based symbols. But like with words in alphabetic western texts, the visual-cortex-ware must be 'trained'.</p>
