      <p>&gt; I would have problems with “distinguish words”.</p>
      <p>I wasn't putting forward a theory, just giving an example of a scenario with 'dummy text' of somewhat vague words. My point is that of C.S. Peirce in his essay 'How to Make Our Ideas Clear': the more we identify the practical consequences of our concepts the clearer they are. So I think "serious terminological play" gets in the way of clarity. But as I said, if you are able to use your terminology and get to testable results, more power to you. </p>
      <p>I'm not going to study this issue properly, as it will take months (at least) to do it right, and other work presses. I just wanted to bring up a methodological issue. But there is no one path to innovation. Whatever works, works. If terminological play works for you, and in the end gets a testable version of your interesting ideas, fine. But if you find that you are stuck with that, then my suggestion is to 'operationalize' it: make in-principle testable, concrete scenarios.</p>
