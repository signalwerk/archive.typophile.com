      <p>Eben, I like "made by grouped forms" but I think we've lost the sense of 'in their pattern' that 'map' provides.</p>
      <p>In following the recent arabetic threads at ATypI I came to realize 'bounded map of salient whites inclusive of the black' is convenient for the western scripts, but useless for arabetic scripts where recognition at the word level seems to rely heavily on the disturbances provided by arrhythmia and amplitude and facingness to simple undulance, at the junctures between graphemes--seems to rely on action at the junctures. The interesting thing is: the script forces perceptual attention away from the 'gravitational centre' of graphemes to the junctural action pattern--the action where the left and right ends of graphemes meet--, accented / inflected by the pointing system. Interestingly, the characteristic fourier transform of texts in arabetic scripts looks very different than a text in a latin script. It operates as it were on a different premise.</p>
      <p>The question becomes, do we need a different term to name this or do we try to adapt the term bouma. At the moment I would opt for a different term. So we would say reading of semitic or latin-derived texts is bouma-based, while reading of arabetic texts is.... This does not preclude a deeper commonality. In both cases the perceptual system must attend away from the center of gravity of the bricks.</p>
      <p>John, I think it is fair to ask, can a single token be a unit of perception or recognition in reading, and I would say it could. I think though that the questions the term bouma seeks to answer are: in a cluster, is the unit of <em>perception</em> in recognition in fluent reading of continuous texts the individual tokens in the cluster, or the cluster as a whole; and, if it is the whole, are the 'mediating agents' in processing the tokens, or their parts in their pattern, or is there only the envelope structure or raw pattern of neutral, ascending and descending components? So to my mind the good sense of using the term evaporates when we try to use it in reference to letters, or components of letters.</p>
      <p>I would say tokenization happens when the word is long or complex and there is a familiar item in our bouma-store that corresponds to the part currently in foveal vision. (And when this happens a process of completion occurs.) So tokenization is bouma-based.</p>
      <p>Eben, in reference to your other thread you might want to explore Thomas Milo's work on allographic typography.</p>
