      <p>Eben, thanks for pushing me on all this because it has generated many refinements to my thinking about where we should take the term. But I have to be a bit cryptic in reply because of other commitments.</p>
      <p>wrt paragraph 1 &amp; 3:<br>
      Don't think <em>white</em> boundedness; think: <em>map</em> or <em><strong>salient</strong> (for vision) relevant-<strong>component</strong> (can be black and / or white in different quantities or proportions) <strong>map</strong></em></p>
      <p>wrt paragraph 2:<br>
      Think of this: for bouma-based processing to work there doesn't have to be word spacing. There only has to be a store of <em>(linguistic-)<strong>sense-tagged</strong></em> bouma-level encodings. (rote memorization of grammers in scribal schools might help build them--i.e., the encodings) In unseparated texts tokenization to the bouma-shape level has to occur for reading to proceed.</p>
