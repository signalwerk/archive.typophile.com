      <p>Eben, what seems to be missing from your definition is the idea of the bouma as subset group of forms within a word (unless the word is short enough to consitute a bouma in itself). Perhaps you want something like this:</p>
      <p>Bouma is 'the combined visual features of lights and darks ... recognised as a discreet unit of grouped forms in printed or written or on-screen communication.'</p>
      <p>You raise an interesting point: can a bouma consist of a single typeform, or does the term always imply a group? I'm half inclined to say that bouma should be defined precisely by that act of recognition, or tokenisation, so a bouma is as large or small as what we recognise discreetly. In terms of the kind of role architecture that Peter has described, it is even possible to consider that a bouma might be smaller than a single typeform.</p>
