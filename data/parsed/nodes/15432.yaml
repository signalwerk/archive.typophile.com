      <p>I think you have succeeded beyond my imagination in describing how &amp; why the term has come to us. That's great.</p>
      <p>The only nit I would pick (maybe) is with the term 'bounded'. And only because unlike the rest of your post it isn't something that seems clear right away. When I read bounded map I am thinking about ideas like - demarcated by white, or wrapped, or something similar - but the idea of a 'border' is what comes up for me. Borders are intended to be precise even if reality doesn't match.</p>
      <p>Maybe the phrase “but in blurry, parafoveal form” is where answer to my quibble lies. I think that the bounded isn't meant so much as a sharp but rather a soft definition. If that's the case then maybe a term that is softer than bounded could be used to suggest this softness. Maybe my ideas about the bound bounded emphasize precision more than is warrented. Reading some definitions I get mathematically bound vs unbound meaning finite/defined vs. infinite/undefined , there is the idea of limit in law, &amp; the more old style venacular speech 'Our joy knew no bounds' &amp; 'Your remarks exceed the bounds of reason'. And last the bounded meaning to bind or restrict. All of these cases seem to point more to precision or to a desire for precision than I think you mean. I can imagine a counter arguement being made... What do you think?</p>
