      <p>Peter, it probably doesn't matter what terminology you use if you are able to produce testable results. But I personally find that the effort to write as clearly and concretely as I can forces me to clarify my ideas. So trying to avoid what Fowler calls 'abstractitis' I think is a good idea methodologically. But honestly only the result matters. If complex terminology is your way to get to a good theory, go for it. If not, try another way. </p>
      <p>As far as being clear, if you describe contrasting scenarios, what you are saying will be a lot clearer to readers. For example: 1. the parafovea is able to distinguish words to the right, and plan a jump. 2. jump. 3. the brain in the initial step identifies all differentiating features of a word simultaneously. 4.... and so on.</p>
