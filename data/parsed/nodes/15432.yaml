      <p>William [importance of rhythm]: <em>I don’t see why it couldn’t also be made part of a parallel processing view. There the idea could be that good rhythm enables the eye to pick out individual letters quicker...</em></p>
      <p>In a system that responds to salience, and gauges processing protocols by distance between stems, placing equi-distance above connectivity accross a salient gap, why / how would a rhythm where vertical blacks are in step and whites in synch promote rather than inhibit automatic processing according to molarity? </p>
      <p>An encoding based on compiling statistics about the salient white strikes me as offering efficiences over one that is premised on going against the natural grain of visual processing and than reassembling the whole outside the visual cortex.</p>
      <p>Ask: what would the processing rule have to be in a field where visual gravitational forces (between visual subcomponents) and mass (saliency) rules behaviour?</p>
