      <p>This is still pretty rough...</p>
      <p>Bouma is " the combined visual features of lights and darks, usually darks shapes bounded  a ligher color, made by grouped forms in printed or written or on-screen communication."</p>
      <p>I wrote this to try to use more common language while avoiding talking about shapes or other kinds of misleading specifics. I also wanted to write a definition that allowed for bouma in the context of non western forms like Hindi, Arabic &amp; Chinese. I am sure it's pretty weak since it's a just a 1st draft but hopefully the idea I am trying to get across is there in seed form.</p>
      <p>I realized while writting this that I am unsure that elipisis ( ... ) could be said to have a bouma shape. I think intuitively it must because it is a combination.  Whereas a period cannot because it is just one form. Still, a One in Chinese is a single stroke - and it seems somehow counteruintuitive to deny it a bouma shape...</p>
