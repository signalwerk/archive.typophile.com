      <p>&gt; I don’t see why serifs can’t be an advantage on the parallel processing model.</p>
      <p>In the PL model serifs can't help, and they would probably even hurt, because all they add to the decipherment of individual letters is noise. This is why some studies have actually shown that sans fonts are <cite>easier</cite> to read - because such studies are confined to deliberative reading.</p>
      <p>&gt; 1. help maintain even color when letters are spaced<br>
      &gt; widely enough for quick and easy letter recognition</p>
      <p>So you're saying:<br>
      - sans fonts have less even color than serif?<br>
      AND/OR<br>
      - loose letterspacing helps readability?</p>
      <p>And concerning even color, the way you're using the term here (properly, unlike in that even color thread) I don't see how it helps in anything more than preventing errant saccades - and that's an extreme event that's easy to avoid, without really making everything "even" at all.</p>
      <p>&gt; 2. mark the baseline</p>
      <p>There's no reason to believe this happens. And even if it did, the only way it could help is to save space, not aid reading.</p>
      <p>&gt; 3. Help differentiate characters</p>
      <p>Exactly which characters are mainly differentiated by their serifs?</p>
      <p>&gt; serifs promote binding</p>
      <p>Exactly. They make individual letters less themselves and more parts of wholes. This speeds up reading, in a simple scalability sort of way.</p>
      <p>&gt; details that everyone already agrees on</p>
      <p>I dunno about this getting-everyone-to-agree, on anything.</p>
      <p>&gt; I believe him at least as much as I believe you.</p>
      <p>Again, avoiding what you need to say... You have no problem detailing how you disagree with me, but you never make explicit that you disagree with Kevin about anything.</p>
      <p>&gt; conforms to what we know about how the brain seems to handle other processes</p>
      <p>?<br>
      Quite the contrary.</p>
      <p>&gt; it is obviously a sufficient explanation during the time we are learning to read.</p>
      <p>Child's play. Literally. We spend a small fraction of our lives learning to read. Focusing on that is like only making all-caps fonts.</p>
      <p>&gt; we don’t have a tested model of bouma recognition.</p>
      <p>And as long as we're stuck in cruise-mode testing (the stuff Kevin does) we'll never be testing anything that can help us <cite>improve</cite>.</p>
      <p>&gt; a huge amount of bouma recognition rides on context</p>
      <p>Yes, something I've repeated at every opportunity. But this has no bearing on type design (except to validate the bouma model).</p>
      <p>&gt; you, Hrant and I do not, in fact, ‘agree fundamentally about how reading works’. </p>
      <p>No. But we do agree that the PL model is <cite>at best</cite> incomplete.<br>
      But only two of us explicitly admit that.</p>
      <p>We agree enough, for example, to state that serifs help.<br>
      The PL model counters that.</p>
      <p>&gt; So even in reading these symbols it is likely, I suspect,<br>
      &gt; that an ‘assembly process’ is going on.</p>
      <p>No, that's too slow.</p>
      <p>&gt; How easy is reading scrambled text really?</p>
      <p>One interesting thing that Luciano Perondi* has found is that this is easier to do in some languages than others. To me though, reading scambled text precludes good use of the parafovea - so yes, you can read, but never approach your full speed.</p>
      <p>* I'll alert him to this thread.</p>
      <p>hhp</p>
