      <p>I don't see why serifs can't be an advantage on the parallel processing model. To me they: 1. help maintain even color when letters are spaced widely enough for quick and easy letter recognition; 2. mark the baseline so the eye can follow the line more easily--thus requiring less leading than sans faces; 3. Help differentiate characters, also facilitating quick recognition.  </p>
