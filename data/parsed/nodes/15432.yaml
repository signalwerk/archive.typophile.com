      <p>William, to take every possibility you throw out and address it item by item would take much more time and resources than I have available. (Or maybe it's because it's late in the evening and I don't have the energy.) If you think some of the things you suggest have legs, try to develop them in dialogue with the avaiable data from neuroscience and perceptual psychology, studies of eye movements, etc. To me the terms of reference you use are too coarse and the reference to the brain trying out theories and hypothesis in a perceptual processing frame, too analogical to get very far. </p>
