    html: "<p>If, as you seem to be suggesting Peter, bouma is simply a more rigorous and sharply defined alternative for 'word wholes or forms', then I think you and Hrant, and probably you and I, are disagreeing about what the term implies. And when you explain your derivation in this way, I'm less comfortable with it than I was previously. Words are bounded in an obvious way by the white space between them (at least in our writing system; not, I should note, in all writing systems). And I agree that 'grasping word wholes' is the central act of reading: words are what we are always trying to recognise. But I have been understanding Hrant's use of bouma as part of a particular model of word recognition -- one that I am not convinced by --, not as a any kind of synonym for a word whole. It seems to me that the most interesting thing about the bouma is that it may often not be identical to a word whole, but may be a recognised sub-word letter cluster. In this case, the notion of boundedness is less clear, although still relevant. Unlike the whole word shape which is visually bounded in our writing system, the implication of bouma recognition is that boundedness is internal, cognitive, presumably a function of pattern familiarity. In order to be able to recognise sub-word letter clusters, we would need to be able to discreetly separate them from neighbouring letters or letter clusters, i.e. imposing boundaries that do not exist visually on the page.</p>"
