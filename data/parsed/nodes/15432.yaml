      <p>William, without you immersing yourself more fully in the literature I refer to, and without me experimenting with ways of articulating what I see until something clicks with you or others, it will be difficult for you to follow completely why I put things as I do. The two things you say are necessary for my processing model to be testable are precisely what I try to do with my talk of molarities, polarities, spatial frequency channels, response bias, lateral interference, inhibition of glyph-molar tokenization and the rest, as well as my use of fourier transforms. (And why I try to push beyond where Hrant has left things.) I use these abberations to be specific about what happens in the visual cortex and to connect my sense of what happens there to an overarching scheme. That you don't see this means I have to work harder to make plain what I see. I'm not sure trying to stick with normal everday language will get us there. We require terms that describe events at the visual cortext level.</p>
      <p>Type-involved readers want a work-horse definition. So a concept has to respond to both needs.</p>
