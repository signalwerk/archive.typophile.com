      <p>Eben, to talk sensibly about chinese / japanese and arabetic scripts I need to know more about them. The bouma issue is about how independant sense-units are coded and processed in reading of continuous texts. In reading of texts arabetic scripts it seems intuitve that what I have called 'componential abstraction' does not occur, except in learning the building blocks of the script. What I call componential abstraction is often called 'slot coding' in connectionist models of reading. Kevin Larson's model relies on slot-coding. Similarly in chinese / japanese scripts. While a character might contain a semantic radical and a phonetic component, I would guess that slot-coding of these components does not occur in practiced readers.</p>
      <p>I responded: "Don’t think white boundedness; think: map" because I felt we were getting hung up on it when trying to extend the bouma concept to chinese / japanese and arabetic scripts, and that when you heard 'bounded', this became 'bounded by white', which an enclosed map is, but that's not the point. The point is that there is a more or less definite point at which the shape-map ends. If a word in a western script is like and island, a word in chinese / japanese scripts is more like a delta and a word in arabetic scripts is more like an archipelago with an isthmus-like core.</p>
      <p>In an assimilated arabetic script, certainly the central isthmus is bounded by white, but the sense of boundedness in the sense of the entire complex of isthmus and teeth having a definite boundry at the top and bottom is less strong than in western alphabetic scripts. Yet there is a strong sense of boundedness left and right. So bounded map applies to arabetic scripts in a different way. The consistancy of the white is also different. Except at the extremities it is not strongly contained, or contained to the point of saliency or 'psycho-activity', so it is hard to get a strong sense of a strong pattern of salient whites. There is some pooling of whites in the wells of the main form, but I suspect this is less tuned-to in the visual cortex than the marked peak pattern.</p>
      <p>The point is that if we want to have a 'wholistically-skewed' term or replacement for 'gestalt' that goes beyond 'envelope structure' or 'raw pattern of neutral, ascending and descending characters' to help us talk about how linguistic sense units might be perceptually processed in reading, we might need to specify it slightly differently for different scripts. </p>
      <p>There is a significant gain in exploring this applicability to other scripts, because it forces us to get clear(er) about the different <em>optical grammars</em> of different script systems.</p>
      <p>It seems that the evolutionary dynamic subtending the move into the future of every script system is toward an optical grammer where unitization of subcomponents at an independant sense-unit (= word) level is facilitated, bouma-distinctiveness optimized and (letter-recognitional) componential abstraction superceded.</p>
