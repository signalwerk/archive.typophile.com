      <p>The alert for it being spam went up because you recently registered, linked to a web hosting site, and have “L” listed as your last name. Recent spammers have posted similar links trying to generate traffic to their site.</p>
      <p><a href="http://www.typetester.org/">Typetester</a> has ’Trebuchet MS’ listed on their ’safe list’ but that doesn’t mean someone can’t remove it from their system. When working with type on the web there are no ’for sures’.</p>
      <p>Note: If you have have Microsoft Office installed you have Trebuchet MS.</p>
