    <p>Hi Everyone, this is my first post in this forum.  I would first like to thank everyone who helps with my question!  Thanks!</p>
    <p>I was wondering what font is used for the website WireNine.com ??</p>
    <p>They have their text change upon refresh but, if you look underneath the banner on their main page, it will either say:</p>
    <p>Stuck with another web host? WireNine can help!</p>
    <p>or..</p>
    <p>The price you see is the price you get. NO HIDDEN FEES.</p>
    <p>or... </p>
    <p>Become a Web Host today. Host UNLIMITED Domains!</p>
    <p>or it will say something else as well.  I was just curious as to what font they are using there?</p>
    <p>My other question too was, what font they are using for the heading, cPanel Business Hosting ???</p>
    <p>Thanks to all who help!</p>
    <p>  -Ryan</p>
