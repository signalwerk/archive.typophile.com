      <p>@ Ryan:</p>
      <p>That is an HTML call and the font in this case is dependent on which fonts you have installed on your machine. (eg. If you don’t have the first option “Trebuchet MS” it will try the next on down the chain until it finds one that works)</p>
      <p>THE HEADLINE - “Stuck with another web host? WireNine can help!”</p>
      <p>uses the following font call.<br>
      “Trebuchet MS”,”Lucida Grande”,Helvetica,Verdana,sans-serif</p>
      <p>————————-</p>
      <p>THE HEADLINE - “cPanel Business Hosting”</p>
      <p>uses the following font call.<br>
      “Century Gothic”,Arial,Helvetica,sans-serif</p>
      <p>I’d recommend downloading a Firefox plug-in called ’Firebug’... it’s great for analyzing HTML and CSS live on a site.</p>
      <p>EDIT: Made an update and slipped a spot. :)</p>
