      <p>Sorry ’bout the spam suspicion. Happened quite frequently lately.</p>
      <p><em>would anybody that views my website be able to see Trebuchet MS even if they did not have that font installed on their system?</em></p>
      <p>Not if your site is built the usual way, meaning without embedding the font in some way. But Trebuchet should be installed on almost all computers, at least running Mac OS or Windows. See *<a href="http://www.codestyle.org/css/font-family/sampler-CombinedResultsFull.shtml">here</a>*.</p>
