      <p>By the way, the spacing in that sample image is off from the original logotype. The original spacing can be seen on this page:</p>
      <p><a href="http://www.creativepro.com/article/dot-font-type-that-s-tight-but-not-touching" title="http://www.creativepro.com/article/dot-font-type-that-s-tight-but-not-touching">http://www.creativepro.com/article/dot-font-type-that-s-tight-but-not-to...</a></p>
      <p>Note how the letters line up between the two lines.</p>
      <p>While searching for this, I found some funny “avant garde” examples:</p>
      <p><a href="http://www.avantgardeprivatehire.co.uk/Default.asp?Page=13" title="http://www.avantgardeprivatehire.co.uk/Default.asp?Page=13">http://www.avantgardeprivatehire.co.uk/Default.asp?Page=13</a></p>
      <p><a href="http://www.chezamyl.com/index.html" title="http://www.chezamyl.com/index.html">http://www.chezamyl.com/index.html</a></p>
      <p><a href="http://www.avantgardeoutfitters.com/scripts/openExtra.asp?extra=1" title="http://www.avantgardeoutfitters.com/scripts/openExtra.asp?extra=1">http://www.avantgardeoutfitters.com/scripts/openExtra.asp?extra=1</a></p>
      <p>...from the pick-the-font-that’s-the-same-as-the-name-of-the-business school of design. The last one is probably a trademark infringement, although it doesn’t look like they are actually a going concern.</p>
