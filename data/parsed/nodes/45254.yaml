      <p>Seeking Inspiration: creative thinking around the design process<br>
    ================================================================<br>
    Seventh annual St Bride Library conference<br>
    15-16 May 2008<br>
    At St Bride Library, Bride Lane, Fleet St, London EC4Y 8EE</p>
    <p>The greatly respected Dutch book designer Karel Martens will be speaking<br>
    at this year’s conference.</p>
    <p>Karel Martens: An error occurred<br>
    ————————————————</p>
    <p>Karel will start by showing three (very) short films: ‘notforresale’, ‘lost<br>
    and found’, ‘homage to the alphabet’. This will lead on to a<br>
    conversation between Karel and Robin Kinross, with unpredictable results.</p>
    <p>Karel Martens is a graphic designer, specializing in typography. He has<br>
    won numerous awards – a 1996 prize resulting in the publication of a<br>
    monograph of his work Printed matter. He has taught graphic design for<br>
    over thirty year<!--
