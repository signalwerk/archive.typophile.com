      <p>Well, maybe I can try to be slightly more directly helpful. When you say "a historical reference," what period historically are you referencing?</p>
      <p>Goudy's faces, though they are based on historical models, are very much his own style and clearly identifiable as such, which place them as early twentieth-century American. (Which, actually, means that the historical implications are exactly right for Sarah Lawrence, though I somewhat doubt that the designers were thinking along those lines.)</p>
      <p>Anyway, let us know more specifically what you're trying to reference and we can help you better.</p>
