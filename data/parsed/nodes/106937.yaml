      <p>I thought I was quite clear, if, perhaps, a little snotty. The academic side of the university -- the English dept, the History dept, etc., tends to look on Goudy Oldstyle with about as much favor as they would with using Wedding Text to set the <cite>Canterbury Tales</cite>.</p>
      <p>The marketing side of the university, which sells athletics and remembrance of good times rather than anything academic, usually has a different viewpoint.</p>
      <p>It would depend on which side of the educational institution your client falls into.</p>
