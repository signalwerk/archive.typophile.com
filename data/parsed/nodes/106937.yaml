  html: <p>I'm looking for some advice on typefaces. As I'm designing a logo for an education-based client, I'm looking for a modern typeface with an historical reference, possibly to Goudy Old Style or similar. On top of that, it would be a huge added bonus if the typeface had an LA ligature or an alternate for a capital K. Any suggestions?</p>
