  html: |-
    <p>Belco™ is new font family from Slobodan Jelesijevic (<a class="freelinking external" href="http://www.linotype.com/509987/itcnovalineta-family.html" rel="nofollow">ITC Nova Lineta</a>, <a class="freelinking external" href="http://www.itcfonts.com/fonts/detail.htm?pid=4648593" rel="nofollow">ITC Pino</a>) and the first font family released by Tour De Force Font Foundry. Elegant and very usefull for all kinds of publications such as books, magazines, catalogs and brochures, Belco™ for now comes in three weights: Belco™ Light, Belco™ Light Slab Serif and Belco™ Ultra Light SmallCaps. With wide range of possibility and smooth personal touch, Belco™ font family is ideal for longer texts, titles and typography exercises. Belco™ comes in basic Latin/English letters with Western Europe diacritics. Other weights will be available very soon.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_BELSC_4628.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Typophile_BL_4177.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Typophile_BSLS_4257.jpg"></div><p></p>
    <p>For more informations and samples, visit:<br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/tdf/belco/" rel="nofollow"> Tour De Force at MyFonts page</a><br>
    or<br>
    <a class="freelinking external" href="http://www.tourdefonts.com/" rel="nofollow"> Tour De Force font foundry</a></p>
    <p>by Dusan Jelesijevic</p>
