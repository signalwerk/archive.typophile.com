  html: |-
    <p>As many of you know, our newly established print workshop has been running very successfully for six months now.</p>
    <p>We have new workshops being added all the time, so do let us know if you’d like to sign up to receive updates or book a place on any of the courses we are running.</p>
    <p>At the moment we are excited to have a growing list of upcoming events planned, so here’s a quick summary of what we are up to. (More details on each of the courses can be found on the Print Workshop website: <a href="http://printworkshop.stbridefoundation.org/" title="http://printworkshop.stbridefoundation.org/">http://printworkshop.stbridefoundation.org/</a>)</p>
    <p>More classes in bookbinding and calligraphy are soon to be added to the list!</p>
    <p>Summer school - Three full days of intensive letterpress learning<br>
    11, 12 and 13 July<br>
    18, 19 and 20 July<br>
    Sessions run 11:00am–6:00pm (lunch break 1.00–2.00pm)<br>
    £355 standard fee<br>
    £305 concession (over 60 or full time student)<br>
    Booking: <a href="http://letterpresssummerschool.eventbrite.com/" title="http://letterpresssummerschool.eventbrite.com/">http://letterpresssummerschool.eventbrite.com/</a></p>
    <p>Gutenberg Weekend - Discover how the first printers printed in the 15th century, including workshops on type, presses and paper<br>
    Saturday 17 and Sunday 18 September 2011<br>
    Sessions run 11:00am–6:00pm Saturday and 11.00am–4.00pm Sunday (lunch break 1.00–2.00pm)<br>
    £245 standard fee<br>
    £195 concession (over 60 or full time student)<br>
    Booking: <a href="http://gutenbergweekend.eventbrite.com/" title="http://gutenbergweekend.eventbrite.com/">http://gutenbergweekend.eventbrite.com/</a></p>
    <p>Letterpress stage 2 - Set your own brief and develop your letterpress sensibility<br>
    Three sessions running 6.00–9.00pm<br>
    Every Monday 25 July–8 August 2011<br>
    £175 standard fee<br>
    £135 concession (over 60 or full time student)<br>
    Booking: <a href="http://letterpressstagetwo.eventbrite.com/" title="http://letterpressstagetwo.eventbrite.com/">http://letterpressstagetwo.eventbrite.com/</a></p>
    <p>Two-day letterpress intensive - For beginners, those with some limited experience and those wanting to extend their printing experience to a new process<br>
    9–10 July, 23–24 July, 13–14 August 2011<br>
    Sessions run 10:00am–5:00pm (day 1) and 10:00am–3:00pm (day 2), 45 minute break for lunch<br>
    £245 standard fee<br>
    £195 concession (over 60 or full time student)<br>
    Booking: <a href="http://twodayletterpressintensive.eventbrite.com/" title="http://twodayletterpressintensive.eventbrite.com/">http://twodayletterpressintensive.eventbrite.com/</a></p>
    <p>One-day linocut and type poster workshop -For those who are interested in learning more about letterpress and have little or no experience in letterpress printing<br>
    25 July, 15 August 2011<br>
    Sessions run 10:00am–4:30pm<br>
    £125 standard fee<br>
    £100 concession (over 60 or full time student)<br>
    Booking: <a href="http://onedayletterpressworkshop.eventbrite.com/" title="http://onedayletterpressworkshop.eventbrite.com/">http://onedayletterpressworkshop.eventbrite.com/</a></p>
    <p>We hope to see a few of you in the upcoming months,</p>
    <p>The St Bride Print Workshop Team</p>
