    <h2><a href="/web/20080720063722/http://www.typophile.com/node/46137" title="Welcome to the Typophile Arabic Typography &amp; Type Design Group">Welcome to the Typophile Arabic Typography &amp; Type Design Group</a></h2>   <p></p><div class="imageWrap"><img src="/web/20080720063722im_/http://www.typophile.com/files/TypophileArabic-02_3959.jpg"></div><p></p>
    <p>This is the place to discuss anything and everything to do with making and using typefaces for Arabic, Persian, Urdu, and the many other languages that use variants of the Arab script. Use this forum to meet colleagues, discuss issues and ideas, and present your work. Forum topics include, but are not limited to, questions and advice related to the design or use of Arabic type, technical issues related to making Arabic fonts and resolving text encoding and display issues, announcements of events, exhibitions, etc., and links to Arabic typography on the Web.</p>
