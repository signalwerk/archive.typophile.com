      <p>I suspect your argument is really about whether the importance of "legibility" is uniform and universal. Just because you wouldn't want to read a novel in it doesn't mean it can't be the right tool for the job. In something like a fashion magazine, the impact of the photographs is most important. Very light type for headlines and mastheads sacrifices some small measure of how <em>quickly</em> they can be read, to the purpose of drawing less attention away from the pictures. And then there's the positive thematic impressions of lightness and thinness, of course. As long as people <em>can</em> read it, nothing is really lost.</p>
      <p>(Apple has made a similar choice because they also think pictures are much more important than words for a computer interface, and <em>this</em> is where they're bed-shttingly wrong.)</p>
      <p>The subtext of "I'm worried people will find it hard to read" is often "I mean of course I know what it says... but other people are dumber than me. We want to reach even the most illiterate people." If your client is one of those who think every desirable quality can be absolutely maximized without regard to how the elements interact, you're in for an unpleasant time. That's the point where you have to give up on persuasion and either assert that you're the expert or concede that they're the boss.</p>
