    <p>Hi</p>
    <p>I'm trying to make a "font" (I don't have a "type maker app" so it's currently in illustrator atm.)<br>
    I'm calling it "Symp" by the way :)<br>
    It's based on the amphi in the logo (square with rounded edges)<br>
    My hope is to use it in a magazine I'm creating for the convention in march 2011.</p>
    <p>The convention is arranged by students at the Norwegian School of Economics and Business Administration, and is the largest of it's kind in north europe. We are all volunteers and students at the school. </p>
    <p>I have no formal education in design or typography. I'm most likely to become an accountant, so bear that in mind when you critique :) </p>
    <p>Here are some issues I've found in this first revision:<br>
    1)Width of I, J and L. if I'm going for monospaced these will look odd, how to solve?<br>
    2)I'm unsure about Y, T, R, J and L. There's something iffy about them<br>
    3)Could i distinguish glyphs like U and V, P and Q in another way?<br>
    4)Are Q and Ø understandable?<br>
    5)Any big issues with readability taking the blockiness into concern?</p>
    <p>All tips and hints are welcome. (No accounting jokes please... :D )</p>
