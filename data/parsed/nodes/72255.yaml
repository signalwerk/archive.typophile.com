    <p>Hi there, hopefully someone can offer some information. I am trying to find digital matches if possible (or close match)<br>
    for three fonts from a 1920s publication. I'm particularly keen to identify the serif. These would have course<br>
    been printed with hot metal, but curious to know if they exist as digital versions.</p>
    <p>They are as follows:</p>
    <p><a href="http://i31.tinypic.com/54amgp.jpg" title="http://i31.tinypic.com/54amgp.jpg">http://i31.tinypic.com/54amgp.jpg</a><br>
    <a href="http://i32.tinypic.com/23rn0cx.jpg" title="http://i32.tinypic.com/23rn0cx.jpg">http://i32.tinypic.com/23rn0cx.jpg</a><br>
    <a href="http://i29.tinypic.com/hrzwyc.jpg" title="http://i29.tinypic.com/hrzwyc.jpg">http://i29.tinypic.com/hrzwyc.jpg</a></p>
    <p>Any help appreciated!</p>
