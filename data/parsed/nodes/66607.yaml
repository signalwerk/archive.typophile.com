    <p>When one pays for a T-shirt or any other commercial product on Typophile, one expects to receive the goods within a reasonable span of time. My payment for a T bij credit card has been processed years ago and I still haven’t received one. AND I have mentioned this often to moderators. AND I have mailed about this.</p>
    <p>(If selling and delivering stuff is not your thing, then abstain from that activity…)</p>
