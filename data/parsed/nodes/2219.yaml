  html: <p>Hi Typophilers, <br> <br>I would be interested in design stuff that's made in your town, whereever you are outthere in the world.  <br>I'm living in Maastricht (Holland) and Düsseldorf (Germany) and we have some interesting stuff going on in graphic design. We could exchange flyers, brochures, photo's, typothings, and so on, if you would be interested. In that way you get to know what we do here, and I what you do over there. It doesn't have to be made by you. You could robb the local flyer display and anything you find on the streets and send that. I like more to have printed work than to see that on an internet site. The paper adds another dimension to the work.  <br> <br>Are there people who would be interested in something like that? <br>I find that living out here can very fast become limited if you don't open your eyes and start to look around. In the old days people travelled all over the world and robbed countries of there national treasures to enhance there own. We could do the same on a friendly base.  <br> <br>If you would be interested, please reply, and we could get exchanging neat stuff.  <br>I can't send the same stuff to everyone (mail is expensive) but a lot is possible.  <br> <br>Regards, <br>Ren�</p>
