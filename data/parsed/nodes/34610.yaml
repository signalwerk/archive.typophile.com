    <p>Hi!!</p>
    <p>In FL5, when I open a font and select to show the full character set as NAMES &gt; IMPORTED. How can I save that and create a new font based on that character set and arrangement of gliphs?</p>
    <p>thks in advance ;)</p>
    <p>Fabio</p>
