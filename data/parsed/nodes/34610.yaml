      <p>Then it’s only saving the encoding of the yellow glyphs. Is there a way to save the entire encoding, so including the new, grey glpyhs?</p>
      <p>Pieter</p>
  - id: 210154
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 22 Jun 2007 — 3:48pm
    date: 2007-06-22T15:48:00
    votes: null
    html: <p>If you switch the Font Window to Glyph mode, you should be able to save the whole set as an encoding, but that presumes that the glyph order in the font corresponds to the imported character set. I think it should, but if not you might need to drag the glyphs around in glyph mode to get them in the order you want.</p>
