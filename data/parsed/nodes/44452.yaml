    <p>I added some new scans to the so called “Schriftensammlung” (font collection) of old german lead letter fonts:</p>
    <p>You can find these scans here:<br>
    <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=41" title="http://www.bleisetzer.de/cms/front_content.php?idcat=41">http://www.bleisetzer.de/cms/front_content.php?idcat=41</a></p>
    <p>Enjoy.</p>
    <p>Georg</p>
    <p>Gruppe II - Französische Renaissance-Antiqua - Garamont<br>
    Lettergieterij Amsterdam<br>
    Erstguß 1925<br>
    Hausschnitt</p>
    <p>Gruppe VII - Antiqua-Varianten - Largo halbfett<br>
    Ludwig &amp; Mayer, Frankfurt am Main<br>
    Erstguß 1939<br>
    Hans Wagner</p>
    <p>Gruppe VI - Serifenlose Linear-Antiqua - Aurora-Grotesk Garnitur I mager<br>
    C.E. Weber Schriftgießerei, Stuttgart<br>
    Erstguß 1912<br>
    Hausschnitt</p>
    <p>Gruppe VIII - Schreibschriften - Trocadero<br>
    J.D. Trennert &amp; Söhne, Altona<br>
    Erstguß 1927<br>
    Albert Auspurg</p>
    <p>Gruppe VII - Antiqua-Varianten - Unbekannte 1<br>
    Eine mir unbekannte Romanische Antiqua</p>
    <p>Gruppe Xa - Gebrochene Schriften - Gotisch - Offenbach mager<br>
    Gebr. Klingspor, Offenbach am Main<br>
    Erstguß 1934 / 1936<br>
    Rudolf Koch / Hans Kühne</p>
    <p>Gruppe VIII - Schreibschriften - Oleander<br>
    Genzsch &amp; Heyse, Altona<br>
    Erstguß 1938<br>
    Julius Kim</p>
    <p>Gruppe II - Französische Renaissance-Antiqua - Genzsch Antiqua kursiv<br>
    Genzsch &amp; Heyse, Altona<br>
    Erstguß 1907<br>
    Entwurf Friedrich Bauer</p>
    <p>Gruppe V - Serifenbetonte Linear-Antiqua - Schadow-Antiqua fett<br>
    C.E. Weber Schriftgießerei, Stuttgart<br>
    Erstguß 1952<br>
    Georg Trump</p>
    <p>Gruppe V - Serifenbetonte Linear-Antiqua - Volta halbfett<br>
    Bauersche Gießerei, Frankfurt am Main<br>
    Erstguß 1956<br>
    K.F. Bauer / W. Baum</p>
    <p>Gruppe VIII - Schreibschriften - Verona<br>
    Genzsch &amp; Heyse, Altona<br>
    Erstguß 1959<br>
    Helmut Matheis</p>
    <p>Gruppe VIII - Schreibschriften - Windsor<br>
    Ludwig &amp; Mayer, Frankfurt am Main<br>
    Erstguß 1977<br>
    Helmut Matheis</p>
