  html: |-
    <p>I am thinking of switching from Latex to Xetex, just because of the font facilities in Xetex — but Xetex doesn’t provide the microtypographic features of Latex: protrusion and font expansion. These are pretty subtle effects, but I find that they do make a difference in certain situations (e.g. with long documents or with pages that have narrow columns). It’s not an obvious difference, but the small adjustments do make a slight improvement in the justification line. I understand that InDesign also offers microtypographic features (since August 07, according to Wikipedia). </p>
    <p>What do people think of these features? Are they an essential part of modern typography? (Even though they are, as practices, actually very old.)</p>
    <p>Ross</p>
