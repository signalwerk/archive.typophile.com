      <p>If I understand the features you are talking about correctly, they are useful only when their effect cannot be seen. Secondly, they are useful only when you can apply them globally (i.e., automatic, but with some penalty), rather than having to apply them as you see a need.</p>
      <p>We used a set of our own macros with Plain TeX for 20 years, and did not have these features (we did write a letterspacing routine, which you absolutely have to have). And so, found other ways to achieve the same ends — handling lines that were only a trifle overset. If a line is overset — at least, with plain TeX, you see the value. In most lines, you will find one or more wordspaces surrounded by a pair of letters where optically, a lettle less space in that wordspace is needed. Take your overset values out of these spaces, and get a better line/paragraph. But of course, this isn’t automatic.</p>
      <p>The point is every layout engine has pluses and minuses, you just have to decide what is best &amp; easiest for you.</p>
