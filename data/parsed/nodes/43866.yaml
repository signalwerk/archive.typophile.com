      <p>Thanks for the replies.<br>
      Yes, it’s the margin kerning that I am mostly thinking about. It’s a very cool feature of the microtype package, and actually makes differences that I can see both in terms of the visuals on the page (a margin that looks straighter, even though it is technically more crooked!) and in terms of a reduced number of over and under set lines. I suppose I’ve decided that the appeals of the fontspec package — all the ways in which it opens up the OpenType features — are more beneficial than microtype overall. But still, I wish I could have both. From the discussions on the xetex info page, (<a href="http://tug.org/mailman/listinfo/xetex" title="http://tug.org/mailman/listinfo/xetex">http://tug.org/mailman/listinfo/xetex</a>), it doesn’t look like that is going to happen anytime soon.</p>
      <p>Ross</p>
