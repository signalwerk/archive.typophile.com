    html: <p>I use XeLaTeX, with Fontspec as an interface to the font calls, and yes, I do miss margin kerning. Font expansion I tend to think of as a mistake, and always turn it off, but margin kerning in LaTeX was great and is now, finally, implemented properly.</p>
