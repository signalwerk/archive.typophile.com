      <p>I think this is one of the areas where XeTeX’s relative youth is a disadvantage. </p>
      <p>Although it is not quite a subtle as margin kerning, it is possible to set up hanging punctuation in plain (Xe)Tex and (Xe)LaTeX. This would give an alternative “default” which might be appropriate in certain circumstances.</p>
      <p>-Jacob</p>
