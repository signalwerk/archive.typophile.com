    html: |-
      <p>&gt; i don't know where to begin to look for one. <br> <br>Are you in college? I get my stuff mostly from UCLA (used to work there), which has a great typography collection. I don't know the situation in Phoenix (I guess your closest "college town", unless Flagstaff has something), but if you can tap the help of a college friend  he can do what's called an "inter-library loan" for you on virtually anything. Purchasing: if you get lucky like Nathan, great - keep your eyes open, but don't expect something to just fall in your lap. <br> <br>Contacting Dan Solo: it shouldn't be too hard to track him down. But I have a feeling he won't be much help sans cash. BTW, how lousy is the repro in the solo book? Do you have a hi-res scan handy? Just a few glyphs will be enough to tell. And one other thing: the sample would have to be <i>extremely</i> high quality for you to avoid "spending a lot of time on each letter". And the fact that this was a metal face means that <i>no</i> sample is going to be extremely good anyway... One thing you could do though is go for the "rough look". <br> <br>Info about ATF: You might start by reading the restrospective in issue 43/44 of the American Printing History Association journal: <!--
