    html: <p>That does look familiar to me, and I spent a little while studying Ihlenburg's body of work, so I am suspecting it is indeed his. <br> <br>There is a collection of Ihlenburg stuff at the Cary Library (at RIT in Rochester, New York). At the time it was acquired, David Pankow wrote an article about Ihlenburg's work. I think I have a copy of this, but it is not accessible right now, as we are preparing to move. <br> <br>Cheers, <br> <br>T</p>
