    <p>howdy y'all!!! <br>I was looking at Reader's Digest Merry Christmas Songbook this holiday season and became riveted on the letterforms in question. I'm wanting to make a digital version of this font, but I can't find the full character set. I bought the Solotype Catalog and they're all in there, but I'm afraid they're not good enuff for me to just scan and use, unless I want to spend a lot of time on each letter. I guess that Hermann Ihlenburg created this type and and this design belonged to American Type Founders (I mighta got that name wrong) for a while. If anyone can suggest how to go about finding more printed samples or even acquiring an original set of the metal type, I would appreciate it. Thnx for reading. <br>paul <br><img src="https://web.archive.org/web/20080830001118im_/http://www.typophile.com/forums/messages/30/24234.gif" alt="nymphic letterforms"></p>
