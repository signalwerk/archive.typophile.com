    date_raw: 16.Jan.2004 10.11am
    votes: null
    html: "<p>This is in fact exactly the sort of thing ATF produced a lot of around the turn of the century. <br> <br>Your best bet is a book called \"Specimens of type, brass rules and dashes, ornaments and borders, society emblems, check lines, cuts, initials and other productions of the American Type Founders Co.\", edited by A Lawson and J Bidwell (New York, Garland, 1981). But that's also a facsimile, so it won't be the best quality. <br> <br>Another way would be to track down an actual ATF specimen book, but an early one: I suspect the famous 1923 edition doesn't have this font. FYI, the Lawson book is based [mostly] on the specimen of 1896. <br> <br>A third approach is to see if this was ever made available as a phototype face (shudder), although procuring specimens of such would probably cost you something. <br> <br>hhp <br></p>"
    html_clean: "<p>This is in fact exactly the sort of thing ATF produced a lot of around the turn of the century. <br> <br>Your best bet is a book called \"Specimens of type, brass rules and dashes, ornaments and borders, society emblems, check lines, cuts, initials and other productions of the American Type Founders Co.\", edited by A Lawson and J Bidwell (New York, Garland, 1981). But that's also a facsimile, so it won't be the best quality. <br> <br>Another way would be to track down an actual ATF specimen book, but an early one: I suspect the famous 1923 edition doesn't have this font. FYI, the Lawson book is based [mostly] on the specimen of 1896. <br> <br>A third approach is to see if this was ever made available as a phototype face (shudder), although procuring specimens of such would probably cost you something. <br> <br>hhp <br></p>"
