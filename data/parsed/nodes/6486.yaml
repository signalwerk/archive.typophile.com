  html: <p>Hello there, <br> <br>this logo is for a local printer and design studio. (They do mainly printing, hence the "ink" idea..) <br> <br>Please let me know what you think. I would first appreciate some feedback on the "tg" symbol (since I'm not too happy about the font for the name yet anyway.)  <br>I am not sure if the execution of the ink drop is good enough. what about the colour? w/ or w/o the dot? <br> <br>thanks for your comments, <br>s <br> <br><img src="http://www.typophile.com/forums/messages/29/48027.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/48028.gif" alt=""></p>
