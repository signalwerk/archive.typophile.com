    html: "<p>Hello there, <br> <br>thanks everyone for all your valuable comments. I have taken especially Daniel's opinion to heart in that the first proposal with the ink drop might look like sloppy printing. <br> <br>Some more information on the company:  <br>The company started about 20 years ago and did mainly technical drawings (hence the name). Although the name has stayed, the company sees itself now more as an advertising agency. They can handle both the design and production side of the project.  <br>Production wise they do offset printing, digital (laser, plotter), etc. but they also have creatives who design layouts, invitations, brochures, annual books, etc. They also have a new collection with specially designed+produced cards (e.g. for weddings).  <br> <br>So, as you can see they are technical but (what they want to stress) very creative. Therefore the company name probably does no justice to their full skills (but they don't want to change it for now.) Therefore I also tried to create a symbol that shows a little more of their creativity, rather than \"precision\" and technicality. <br> <br>Here's a quick look at the current logo: <br><img src=\"http://www.typophile.com/forums/messages/29/48348.gif\" alt=\"\"> <br> <br> <br>I have now gone away from the first idea with the drop and tried to create something that is more resembling the idea of the old whilst at the same time modernising it and implying more creative freedom.  <br>Here's what I came up with so far: <br><img src=\"http://www.typophile.com/forums/messages/29/48349.gif\" alt=\"\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/48350.gif\" alt=\"\"> <br> <br>I tried to stick to the same concept and by using a simplified geometric figure that is hand-drawn I tried to signify the dual nature of the company. Before I worry about vectorising this (if at all possible?!) I wanted to get your input.  <br> <br>Does it work? Is it practical? Can it be implemented with vectors?  <br> <br>thanks for your comments, <br>s</p>"
    html_clean: "<p>Hello there, <br> <br>thanks everyone for all your valuable comments. I have taken especially Daniel's opinion to heart in that the first proposal with the ink drop might look like sloppy printing. <br> <br>Some more information on the company:  <br>The company started about 20 years ago and did mainly technical drawings (hence the name). Although the name has stayed, the company sees itself now more as an advertising agency. They can handle both the design and production side of the project.  <br>Production wise they do offset printing, digital (laser, plotter), etc. but they also have creatives who design layouts, invitations, brochures, annual books, etc. They also have a new collection with specially designed+produced cards (e.g. for weddings).  <br> <br>So, as you can see they are technical but (what they want to stress) very creative. Therefore the company name probably does no justice to their full skills (but they don't want to change it for now.) Therefore I also tried to create a symbol that shows a little more of their creativity, rather than \"precision\" and technicality. <br> <br>Here's a quick look at the current logo: <br><img src=\"http://www.typophile.com/forums/messages/29/48348.gif\" alt=\"\"> <br> <br> <br>I have now gone away from the first idea with the drop and tried to create something that is more resembling the idea of the old whilst at the same time modernising it and implying more creative freedom.  <br>Here's what I came up with so far: <br><img src=\"http://www.typophile.com/forums/messages/29/48349.gif\" alt=\"\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/48350.gif\" alt=\"\"> <br> <br>I tried to stick to the same concept and by using a simplified geometric figure that is hand-drawn I tried to signify the dual nature of the company. Before I worry about vectorising this (if at all possible?!) I wanted to get your input.  <br> <br>Does it work? Is it practical? Can it be implemented with vectors?  <br> <br>thanks for your comments, <br>s</p>"
