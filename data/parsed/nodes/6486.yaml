    html: <p>I agree with Dan, <br> <br>Precision, is what I look for in a printer. A printer should appear very organized in their identity. What kind of printing do they do? Do they have a 4 or 2 color press, or a digital output device? The name Technographic also implies "precision", Why not use properties of advaced printing technology to determine the logo.</p>
