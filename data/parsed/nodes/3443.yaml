    html: <p>To answer all the Typophiles question, there are alot of people posting from our class.  Since some of you are influencing the idea of type itoday why not get some of the most insightful minds critiqing some potential typographers. <br> <br>I second the Keedy Sans comment.  It looks very similar, but the question I ask is why you showed the "base" type first, when you said your using the type as a proportional tool.  Your inkblot look nothing like Keedy Sans or your base face, so there should not be a reason to give them more than a promience of inspiration.   <br> <br>You can work with them together say like the Twin typeface by Letterror.</p>
