    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Type%20Technologies" class="freelinking" rel="nofollow">Type Technologies</a> : Multiple Master</strong></p>
    <p>Multiple Master (MM) fonts were originated in the 1980s by <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> as an extension of their <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> font format. This font format was capable of generating variations of different fonts based on <a href="/wiki/axis" class="freelinking" rel="nofollow">axes</a> and <a href="/wiki/masters" class="freelinking" rel="nofollow">masters</a>. A <a href="/wiki/weight" class="freelinking" rel="nofollow">weight</a> axis might change the weight from <a href="/wiki/light" class="freelinking" rel="nofollow">light</a> to <a href="/wiki/bold" class="freelinking" rel="nofollow">bold</a>. An additional axis for <a href="/wiki/width" class="freelinking" rel="nofollow">width</a> might change <a href="/wiki/condensed" class="freelinking" rel="nofollow">condensed</a> to <a href="/wiki/extended" class="freelinking" rel="nofollow">extended</a>, Users could dial in anything between the masters' extremes. The idea was to let the user select the degree of weight or width, &amp;c. The maximum number of axes allowed by the format was four, i.e. sixteen principal masters.<br>
    After several years of production, Adobe abandoned the concept as an end product. However, MultipleMaster (MM) axis are used today by <a href="/wiki/type%20designer" class="freelinking" rel="nofollow">type designers</a> in programs like <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> to help generate variations of weight, &amp;c. It is now mostly an interpolation tool and assumes some degree of cleanup by the designer afterwards but much less than starting from scratch for each variation.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/39965" rel="nofollow">Nodes in MM-fonts?</a></p>
