    <p>De Bilt, Utrecht June 17, 2009 -- High-Logic B.V., a leader in providing font editing software, today announces FontCreator 6, the world's most popular font editor. This version delivers powerful tools such as direct import of both raster and vector based images. With FontCreator 6, font designers can create and modify high quality TrueType and OpenType fonts faster than ever.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontcreatorboxshots_6332.png"></div><p></p>
    <p>Custom Fonts for Business People and Hobbyists</p>
    <p>With FontCreator, users can tailor customized fonts to meet their needs. It's easy to add new characters to an existing font. Users can design custom bullet points, or include a company logo and other artwork in day-to-day memos, letters, and flyers. Once converted to a fully scalable font, the characters can be typed using any text editor, word processor, spreadsheet, or presentation program.</p>
    <p>Font Editing Powerhouse Gets Better</p>
    <p>New features in this font editor include the ability to directly import vector-based images such as AI, EPS, and PDF; support for copying and pasting from Adobe Illustrator; and improved cubic to quadratic Bézier curve conversion.</p>
    <p>Pro Version for Typographers and Graphic Designers</p>
    <p>The Professional Edition of FontCreator contains features that will benefit typographers, graphic designers, font foundries, and power-users. It can create hundreds of additional characters in seconds, transform an entire set of characters into something as simple as a bold, italic, hollow, or condensed font. It can also add diacritical marks to characters, and perform automatic kerning. The Professional Edition also offers a real-time validation feature that detects and fixes easily overlooked design mistakes.</p>
    <p>Platform and Price</p>
    <p>FontCreator 6 runs under Windows Vista/XP/2003/2000/NT4/Me/98/95, costs $199(US) for a single-user license of the Professional Edition, and may be ordered securely online from <a href="http://www.high-logic.com/register.html" title="http://www.high-logic.com/register.html">http://www.high-logic.com/register.html</a>. The Home Edition costs $79. A free trial version of FontCreator 6 is available from <a href="http://www.high-logic.com/download.html" title="http://www.high-logic.com/download.html">http://www.high-logic.com/download.html</a>.</p>
    <p>For additional information contact Erwin Denissen at erwin.denissen(at)high-logic.com or visit <a href="http://www.high-logic.com/fontcreator.html" title="http://www.high-logic.com/fontcreator.html">http://www.high-logic.com/fontcreator.html</a>.</p>
    <p>High-Logic B.V. is a privately-held firm, headquartered in De Bilt, The Netherlands. Since 1997, High-Logic has been providing font editing and font management software to business and home users. The company's flagship product is FontCreator, the world's most popular font editor. In addition to FontCreator, the company also offers MainType, a powerful and intuitive font manager and Scanahand, a font generator that turns a handwriting into a font within a couple of minutes.</p>
