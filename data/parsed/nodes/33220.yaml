    html: <p>Then I'll be taking font name suggestions as well. Thanks for pointing that out--I just didn't want to post an untitled font, and it took me a minute or so to come up with 'Armadillo' (it takes a lot of imagination, but many of the shapes in the lowercase remind me of a stylized armadillo). I guess I didn't check carefully enough whether the name was taken. I'll make the appropriate changes as soon as I find a new working name for the font.</p>
