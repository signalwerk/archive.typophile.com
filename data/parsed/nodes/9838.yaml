  html: "<p>I just recently completed a job which went a little wrong somewhere between the printing and the binding and I'd be interested to hear some opinions on where the blame lies. <br> <br>Basically it was a hardbound book, 128pp approx A4 trim size. The binding boards (2.5mm) were covered with a printed paper laminate and endpapered as normal. <br> <br>When the finished books were removed from their shrinkwrap, the covers immediately opened slightly; the foredge of the cover is lifting up in a curve away from the spine. I didn't notice this initially and neither did the client; it was ultimately raised by the client's distributor, who reckoned the books had either been bound too tightly or one of the elements (board, covering, endpapers) had been used in the wrong grain direction. <br> <br>I read up on the problem and decided that grain direction was the issue. Apparently, the grain of all elements -- text block, boards, covering, endpapers -- should run parallel to the spine to minimise warping. I did a few quick tests and it seems like at least the endpapers were going the wrong way (too hard to check the laminated coverings, although I suspect these too). <br> <br>Now: am I a bad designer for not knowing about this issue, and for not double checking with the printer at every stage that they were using the correct stock (most papers can be ordered with the grain going in the long direction or in the short direction -- 'grain long' or 'grain short' -- to deal with different impositions)? Or are the printers at fault? <br> <br>My feeling is that this is a technical issue and really should be the printer's responsibility, but as any of you guys will know, you cannot leave anything completely up to a printer. This is why we do press passes. <br> <br>So anyway, comments? <br> <br>Robert</p>"
  html_clean: "<p>I just recently completed a job which went a little wrong somewhere between the printing and the binding and I'd be interested to hear some opinions on where the blame lies. <br> <br>Basically it was a hardbound book, 128pp approx A4 trim size. The binding boards (2.5mm) were covered with a printed paper laminate and endpapered as normal. <br> <br>When the finished books were removed from their shrinkwrap, the covers immediately opened slightly; the foredge of the cover is lifting up in a curve away from the spine. I didn't notice this initially and neither did the client; it was ultimately raised by the client's distributor, who reckoned the books had either been bound too tightly or one of the elements (board, covering, endpapers) had been used in the wrong grain direction. <br> <br>I read up on the problem and decided that grain direction was the issue. Apparently, the grain of all elements -- text block, boards, covering, endpapers -- should run parallel to the spine to minimise warping. I did a few quick tests and it seems like at least the endpapers were going the wrong way (too hard to check the laminated coverings, although I suspect these too). <br> <br>Now: am I a bad designer for not knowing about this issue, and for not double checking with the printer at every stage that they were using the correct stock (most papers can be ordered with the grain going in the long direction or in the short direction -- 'grain long' or 'grain short' -- to deal with different impositions)? Or are the printers at fault? <br> <br>My feeling is that this is a technical issue and really should be the printer's responsibility, but as any of you guys will know, you cannot leave anything completely up to a printer. This is why we do press passes. <br> <br>So anyway, comments? <br> <br>Robert</p>"
