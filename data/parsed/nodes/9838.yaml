    html: <p>My feeling is that this is a technical issue.... <br> <br>A grain is more than just "a technical issue"; this is an important factor for printing (and binding). <br>BTW, an old trick to find the direction of the grain - tear off a corner and lick it; it will curl in the direction of the grain. <br> <br>I don't know who's your printer, but something here/there is not right.......</p>
