    html: <p>Years ago I was involved in a similar situation in which the <br>dummy was made to spec with the proper grain direction, was <br>signed off on, and the final books arrived as you describe. <br>In our case the entire guts were facing the wrong direction. <br> <br>Through extended debate and hassle we were able to <br>have the books reprinted properly for free. <br> <br>Do you have the dummy - assuming it was prepared correctly?</p>
