    html: <p>"<i>...often wonder whether colleges are teaching this kind of thing -- arcane technicalities like the importance of grain direction -- to students of graphic design. Are they?</i>" <br> <br>I've been out of school for about 4 years now, but I can tell you that this stuff wasn't taught to us. We learned about printers and printing, but it was more rudimentary (we went on a 'press check' and were taught about file prep). But a lot of this knowledge has to come from doing, from what I've experienced thus far. I'd guess that many schools just can't afford it (or don't want to pay for it). <br> <br>Is there a good 'watch for these issues' book for designers about printing ?</p>
