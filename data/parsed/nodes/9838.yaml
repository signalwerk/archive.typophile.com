    html: <p>I've had printers build dummy books of the selected stock. Some stocks will bind in the wrong grain direction, some have problems. <br> <br>Keeping the grain in mind is ideal, but for many horizontal format books you won't find a sheet that works, particularly if you try a French fold cover. <br> <br>There are different quality boards as well. Humidity at the bindery and many other issues can play a part. <br> <br>Try the folkes at <br> <br><a href="http://www.stinehourpress.com/" target="_blank">http://www.stinehourpress.com/</a> <br> <br>They send out to ACME in Canada and are REALLY tuned in to the process. <br> <br>Don't be too hard on yourself. Next time you will be able to discuss this upfront with your printer.</p>
