    html: <p>It is the printer's responsibility. <br> <br>When they quoted on the job, they should have figured the imposition with the grain in the correct alignment. (Assuming that the printer is making the film/plates.) <br> <br>To avoid problems, the printer can show whoever is paying them an unprinted, bound up dummy, in the chosen stock, to be signed off on.</p>
