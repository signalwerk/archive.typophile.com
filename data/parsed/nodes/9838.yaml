    html: <p>Eric, I don't have the dummy, no, but there was one made, and as in your experience didn't exhibit the problem that occurs in the finished books. <br> <br>I'm beyond the point now where I can do anything to have the book reprinted or recouped in any way, I'm just interested to hear opinions and comments on this. It's not something I'd encountered before. <br> <br>I constantly find myself wondering -- where in the hell did the skills in the print trade go? Why as designers are we constantly having to educate printers in their own trade? It's taken me a good four years working with a print company (who are well respected in the trade) to get to the point where I have confidence in them to produce my books (generally fine art catalogues and the like) to the standard that I need -- trying to weasel dot gain figures out of them, find out what colour standard they're running their presses to, figuring out which press guys are the good ones, etc. etc. Now I'm going to have to sit them down and explain to them that from now on my jobs will be paying attention to a thing called 'grain direction', and I can imagine the looks I'm going to get. <br> <br>I'm untrained (I studied fine art and kind of fell into design work through my interest in typography) and often wonder whether colleges are teaching this kind of thing -- arcane technicalities like the importance of grain direction -- to students of graphic design. Are they?  <br> <br>R</p>
    html_clean: <p>Eric, I don't have the dummy, no, but there was one made, and as in your experience didn't exhibit the problem that occurs in the finished books. <br> <br>I'm beyond the point now where I can do anything to have the book reprinted or recouped in any way, I'm just interested to hear opinions and comments on this. It's not something I'd encountered before. <br> <br>I constantly find myself wondering -- where in the hell did the skills in the print trade go? Why as designers are we constantly having to educate printers in their own trade? It's taken me a good four years working with a print company (who are well respected in the trade) to get to the point where I have confidence in them to produce my books (generally fine art catalogues and the like) to the standard that I need -- trying to weasel dot gain figures out of them, find out what colour standard they're running their presses to, figuring out which press guys are the good ones, etc. etc. Now I'm going to have to sit them down and explain to them that from now on my jobs will be paying attention to a thing called 'grain direction', and I can imagine the looks I'm going to get. <br> <br>I'm untrained (I studied fine art and kind of fell into design work through my interest in typography) and often wonder whether colleges are teaching this kind of thing -- arcane technicalities like the importance of grain direction -- to students of graphic design. Are they?  <br> <br>R</p>
