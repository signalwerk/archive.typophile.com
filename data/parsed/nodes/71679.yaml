      <p>There are still a number of people operating Monotype equipment, and the equipment is available for sale from time to time. I'm not sure about how easy it is to get the matrices and keybars for the math typesetting system. The best way to find out more is to get in touch with the American Typecasting Fellowship; you just missed their biennial gathering earlier this month. There is a little bit of info here:</p>
      <p><a href="http://www.ppwv.com/TellmeMore/atf.html" title="http://www.ppwv.com/TellmeMore/atf.html">http://www.ppwv.com/TellmeMore/atf.html</a></p>
      <p>If you go to the home page for ppwv.com, you can find contact info for Rich Hopkins, who leads the group.</p>
