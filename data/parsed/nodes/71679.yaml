    <p>For a long time I have been typesetting mathematics with LaTeX, which of course works very well. For a while I have contemplated the prospect of typesetting mathematics via letterpress, namely with Monotype's 4-line system.</p>
    <p>My question: does anyone know where the equipment (caster, keyboards, etc.) could be obtained? I am unsure on their value and rarity, so I apologize in advance if such a question is rather inane. </p>
    <p>Miscellaneous comments: I realize that this technology is relatively obsolete with the introduction of digital printing. I also am very well aware that this is a less flexible, more expensive, and more time consuming process than simply using digital systems. But, I suppose the quality of the result and the classic feel of it is worth more to me.</p>
