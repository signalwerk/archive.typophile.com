      <p>oldnick: Yeah, it would require a pretty good amount of space and time. They are incredibly complicated machines (as you've witnessed), probably one of the most beautiful pieces of engineering -- both the Linotype and Monotype machines.</p>
      <p>I also realize it has a pretty steep learning curve. In the most ideal situation, I'd apply for an apprenticeship at, say, the Arion Press in California, but I can't afford to move there and stay for four years.</p>
      <p>Fortunately I have a good handle on the non-mechanical stuff -- especially the way text and mathematics is structured physically on paper. I've also read Rehak's book "Practical Typecasting".</p>
