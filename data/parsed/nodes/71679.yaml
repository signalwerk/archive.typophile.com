      <p>G'day</p>
      <p>I'll do this post (my first ever) in two hits, because my first try (1,000 words) just vanished. </p>
      <p>In the '60's, I worked at a company called Santype, of Salisbury (UK). They were probably the premier typesetter of mathematics for high-quality books in England, and also did a great deal of work for the US market. They also specialized in topological treatises, and many foreign languages (including non-Roman typefaces). </p>
      <p>I was one of about 6 4-line monotype operators (although still an apprentice!), and it was a job that I still look back on as my most enjoyable. I also worked for a short time for Harrisons of London, on an experimental 10/8pt mathematical system. </p>
      <p>Santype also set up a satellite company in Richmond (Va) in the '70's (I believe Byrd was part of the name). The manager is still alive, living in Arizona. </p>
      <p>Post-1</p>
