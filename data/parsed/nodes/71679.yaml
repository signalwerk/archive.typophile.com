      <p>Your best bet, probably, is to check regularly at eBay &gt; Business &amp; Industrial &gt; Printing &amp; Graphic Arts. Also be prepared to pick the thing up: these machine weight a ton, if not literally, at least figuratively.</p>
      <p>Another thing to consider is the learning curve: I've had opportunity to see Linotype operators in action, and it's reminiscent of the doings of "the man behind the curtain" in the <em>Wizard of Oz</em>.</p>
