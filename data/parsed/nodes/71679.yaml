      <p>Post-2<br>
      Mr Quadrescence's project is quite admirable in many ways. However, it would be inadvisable to try and do it all himself.</p>
      <p>There must be many museums and print hobby clubs that possess Monotype keyboards and casters, and I'd recommend he try and find someone in one of these organisations as enthusiastic as himself to look into the rebirth of 4-line. </p>
      <p>New Zealand has only 2 or 3 Monotype keyboard/linecaster pairs, only one of which was still operational in 2008. The museum I belong to has only a fragile supercaster. The country does have a relatively large number of Linotypes and Intertypes. </p>
      <p>I wish Mr Q all the best, hope he's successful in sourcing the many and varied pieces of equipment needed for 4-line, including a good proportion of the more than 10,000 matrices that were cut. </p>
      <p>I can advise that Alembic Press (UK) did have quite a range of 4-line information, but I'm not sure they're still in existence. </p>
      <p>Best of luck!</p>
