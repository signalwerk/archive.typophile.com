      <p>quadibloc: Thanks for the reply. That's how it seems -- that such machines are probably put in museums, destroyed, or not at all in working order. And if there was a machine available, the full thing would cost me a fortune.</p>
      <p>I have read those papers. They were very informative about how mathematics was typeset.</p>
      <p>I guess these days, some sort of photopolymer plate + computer is the way to go (if you don't intend on getting some huge 6-color press). Just doesn't match the quality of old letterpress though. :(</p>
