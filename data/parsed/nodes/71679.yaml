      <p>My suspicion is that, at this time, the rarity of Monotype casters is such that attempting to obtain one at this late date is out of the question. I could be wrong, but I believe that all surviving specimens are in museums by now.</p>
      <p>I do agree that this is a fascinating topic. The book "The Printing of Mathematics" describes typesetting mathematics on a Monotype caster before the 4-line system came out. There are two very interesting papers by Daniel Rhatigan which describe the 4-line system in some detail at</p>
      <p><a href="http://www.typeculture.com/academic_resource/articles_essays/" title="http://www.typeculture.com/academic_resource/articles_essays/">http://www.typeculture.com/academic_resource/articles_essays/</a></p>
      <p>... a Google search will turn up direct links to the PDF papers, which the server apparently does not allow to work, so you need to go to this index page instead.</p>
      <p>The basis of 4-line mathematics comes from a simpler feature found on Linotype machines (and, despite their lesser flexibility, mathematics can be typeset to some extent even on them) called "Advertising Figures".</p>
      <p>Basically, both Linotype and Monotype machines offered special attachments so that the digits and other characters needed to express prices, like the dollar sign and the period, could be cast in a face that was double the height of the normal typesetting being performed, and then overhang (in the Linotype case) or displace (in the Monotype case) the appropriate spaces on the next or previous line.</p>
      <p>This was useful for certain styles of small advertisements (resembling classified ads, but set in a serif face - tucked in the back corners of magazines instead of newspapers).</p>
      <p>Four-line mathematics worked a bit like that. Normal values in equations were "double height", with the real height of the characters produced being that used for superscripts and subscripts. Two pairs of lines like that were usually what would be used for typical equations where you would have the ratio of two polynomials - each polynomial would be constructed from two lines, and there would be a rule between them, hence the term "four-line mathematics".</p>
    html_clean: |-
