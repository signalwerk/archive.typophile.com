    html: <p>Unfortunately, it doesn't appear to be any of those ones. With Garamond Serial and TS Garamond the sloped serifs on the "u" are too rounded. Garamond No. 5 has a better match in that respect but falls short on the rounded shape of the "a" and I noticed a number of other discrepancies. I suppose I'll have to slog through some more variations of Garamond...</p>
