      <p>Chris, there are dozens of variations of Garamond, a holdover from the days of metal and photoset type.</p>
      <p>Garamond Serial, TS Garamond, and Garamond No. 5  all have  a lowercase a with a rounded top and a lowercase u with serifs that slope.</p>
