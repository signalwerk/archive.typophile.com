    html: |-
      <p>My guess is that's just an index indicating the letters beginning the first font's name - like you'd see at the top of a dictionary page for easier thumbing-through ("cil - cla").</p>
      <p>So if your Chelt is the first font on the page, I'd use Ch.</p>
