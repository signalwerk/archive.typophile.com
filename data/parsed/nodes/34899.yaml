    <p>Gohan is a font I came up with back in 2001, just as an exercise in making a heavyweight sans font with some idea about some sort of optical properties inspired by an article I read about a font called <a class="freelinking external" href="http://www.myfonts.com/fonts/agfa/gararond-bold/" rel="nofollow">Gararond</a>. Well what resulted probably had nothing to do with the ideas that inspired it but it did turn out to be a very bold font that held up remarkably well at small sizes. Still, it had many deep flaws, and clearly was not ready for prime time.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2205_5970.big.png"></div><p></p>
    <p>So now I'm taking it upon myself (in the interest of getting used to using FontForge instead of my old reliable Fontographer as much as anything) to redesign much of the font, and once that is covered, to develop book and medium weight versions. </p>
    <p>The original is available for free at <a class="freelinking external" href="http://www.1001fonts.com/font_details.html?font_id=2205" rel="nofollow">1001 Fonts</a>. Works in progress are in the attached PDF files below.</p>
