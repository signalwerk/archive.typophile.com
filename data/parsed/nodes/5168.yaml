  html: "<p>Recently, I'm following a course to become a graphical designer. As a task for my course I have to search information about 2 typeface designers: Campbell Jerry &amp; Jacquette Cynthia. <br>The problem is that it's very hard to find some information about them. I even consulted the national library here in Belgium... nothing... <br> <br>Now my question is: Is there anyone who heard of these typeface designers before or is in the possesion of some information, links, etc.? <br> <br>If somebody could provide me some info, I would be very thankfull... <br> <br>(by the way: sorry for my bad english)</p>"
