    html: |-
      <p>Looks like a generic monoline serif, like the upper case from a typewriter font,  e.g. <a href="http://www.myfonts.com/fonts/urw/prestige-elite/" title="http://www.myfonts.com/fonts/urw/prestige-elite/">http://www.myfonts.com/fonts/urw/prestige-elite/</a> or a monoline serif like ITC Officina Serif <a href="http://www.myfonts.com/fonts/itc/officina-serif/" title="http://www.myfonts.com/fonts/itc/officina-serif/">http://www.myfonts.com/fonts/itc/officina-serif/</a> or Brix Slab Condensed <a href="http://www.myfonts.com/fonts/hvdfonts/brix-slab-condensed/" title="http://www.myfonts.com/fonts/hvdfonts/brix-slab-condensed/">http://www.myfonts.com/fonts/hvdfonts/brix-slab-condensed/</a><br>
      If you want to use it on an embroidery machine there are companies that sell fonts for use on the machines, e.g. <a href="http://www.8clawsandapaw.com/typewriter-alphabet-embroidery-design.html" title="http://www.8clawsandapaw.com/typewriter-alphabet-embroidery-design.html">http://www.8clawsandapaw.com/typewriter-alphabet-embroidery-design.html</a> or  <a href="http://www.8clawsandapaw.com/back-to-basics-embroidery-fonts.html" title="http://www.8clawsandapaw.com/back-to-basics-embroidery-fonts.html">http://www.8clawsandapaw.com/back-to-basics-embroidery-fonts.html</a><br>
      Don</p>
