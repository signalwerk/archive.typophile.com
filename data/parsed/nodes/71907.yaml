      <p>Aside from the fact that there's nothing fresh about the phrase "fresh start" I'd say it's looking...well, fresh. Have you considered matching the extended descender of the h on the last t? Just for balance. It might work, but it might be too busy?</p>
      <p>I know you're trying to kern beautifully, but I think the 'a' in 'start' needs the rest of it's serif. Or maybe just a little hint of it? If you don't want to add it, the r's stem needs to be a touch thinner/tapered to look less odd with a missing foot.</p>
    html_clean: |-
