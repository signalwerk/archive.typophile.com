    <p>My dear typophiles,</p>
    <p>I am taking a chance posting this on a Friday night (before the Fourth of July, nonetheless), but I'm hoping for some feedback anyway...</p>
    <p>I'd like to know if you think there's anything I can do to improve on this. The look and feel has been tweaked to what I'm looking for, but I'm too close to it now to see it the way you might.</p>
    <p>I'm really looking forward to your feedback!</p>
    <p>Thanks,<br>
    Ray</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fresh-start-logo_4935.png"></div><p></p>
