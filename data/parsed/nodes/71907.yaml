      <p>Charming!</p>
      <p>Some (amateur) observations:</p>
      <p>Is there a kink in the (inside) contour at the bottom of the bottom counter of /s/?</p>
      <p>The fit otherwise is so tight, I wonder if you should bring the top of the first /s/ over towards the /h/ to help close that gap.</p>
      <p>Another thing to consider is raising the ascenders of the /t/s a little to help them hold their own against those of the /f/ and /h/.</p>
      <p>I also wonder if the stem of <em>f</em> should be thickened just a touch.</p>
      <p>You have a really nice match of style and message here!</p>
