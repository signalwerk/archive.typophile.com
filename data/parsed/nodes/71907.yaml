      <p>^I think he meant the "r" in "start." The missing left part of the serif threw me off completely, it definitely needs to be there.</p>
      <p>Overall, I think the logo looks a bit awkward. From afar, it looks like the "f" and "h" are randomly italicized, and the word "fresh" is visually way heavier than "start." I would say maybe leave the "f" but remove the tail/swash from "h." It's superfluous.</p>
      <p>If you do want another swash element, consider doing a discretionary ligature on the "st" such as <a href="http://farm4.static.flickr.com/3660/3296160390_bbe30797d5.jpg?v=0" target="_blank" rel="nofollow">here</a>.</p>
