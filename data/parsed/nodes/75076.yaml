    html: |-
      <p>For me the newer version seems more evolved and if you never revisit projects then you don't learn from them. You can't always be 100% fresh. The goal should be to produce the right design for the right piece, if that happens to be similar to one done years before, the other day or never before is irrelevant. </p>
      <p>I've never put Comic Sans on any pieces I've been in control of and I don't think that just because I haven't done that that doing it now will make me a better designer.</p>
