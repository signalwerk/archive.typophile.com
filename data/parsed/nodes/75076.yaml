    html: |-
      <p><cite>What’s the difference between being in a rut and having a personal style?</cite></p>
      <p>Being in a rut means no steering, you're on autopilot (or rut-pilot). Having a personal style doesn't preclude a lot of steering.</p>
      <p>Put another way: if your answer is "I've always done it that way" you're probably in a rut. If your answer is "this is what it needs" you're probably developing your style.</p>
    html_clean: |-
