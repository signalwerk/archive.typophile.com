    html: |-
      <p>Youssef,</p>
      <p>ID autocorrection in Portuguese will work exactly as in English, but ID does not come with a pre-built list of corrections. So you need to build up your own list.</p>
      <p>You can also add words to its custom Portuguese dictionary. If you already added words to Word dictionary, you can import it at once to ID (just find the USUARIO.dic file in your computer and import it to ID). Be aware ID records hyphenation in his dictionary (using ~ to separate syllabes).</p>
      <p>If you use Windows, you can change ID interface to any supported language just editing the registry path:</p>
      <p>HKEY_LOCAL_MACHINE / SOFTWARE / Wow6432node / Adobe / InDesign / 7.0 / User Interface Locale Setting.</p>
      <p>Values are numerical. Use 07 is Brazilian Portuguese. You can reuse settings already created to one tongue to another simply copying the folder:</p>
      <p>C:\Users\Admin\AppData\Roaming\Adobe\Adobe InDesign CS5</p>
      <p>Here you will find a folder like en_GB or en_US. Copy, paste and rename it to the language you set InDesign (v.g., pt_BR).</p>
      <p><em>This tip is not documented in any ID material. It works with CS3, CS4 and CS5 (I did not test in older versions).</em></p>
