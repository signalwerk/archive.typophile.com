    html: |-
      <p>Here's the word from, er Word...</p>
      <p>Office does not expose a Print to PDF action. We have two entry points in most apps: File/Save As and one where the user chooses PDF/XPS explicitly in the Outspace (File/Save and Send/Create PDF/XPS Document in Word 2010). Both of these run the same MS code and will have the same behavior with font embedding.</p>
      <p>When people say they are using Print to PDF, they are using a third-party print driver, perhaps from Adobe, perhaps from someone else. We do not ship an MS print-to-PDF driver. Depending on the third party, they will get different results.</p>
      <p>&gt; are OpenType (truetype flavor) or OpenType (postscript flavor) able to be properly made into PDF by MS Word? I read your reply saying only TrueType, but I'm not sure exactly where the line is drawn. If not, is there hope for improvement in the near future? Thank you.</p>
      <p>TrueType = embedded as an outline font<br>
      OpenType (TrueType flavor) = embedded as an outline font<br>
      OpenType (Postscript/CFF flavor) = rasterized</p>
      <p>The CFF limitation was on the radar prior to this thread. Can't say if an improvement is in "the near future" but it's being looked into.</p>
      <p>Cheers, Si</p>
    html_clean: |-
