    html: <p>InDesign is made by Adobe and Adobe controls PDF technology; other companies must get a license from Adobe. It's hard to tell what's happening in your particular situation without seeing the PDFs, but often in lower-quality PDFs the type and vector graphics look okay but bitmapped graphics like photos are reproduced in lower quality, similar to what happens if you make a PDF in InDesign and choose "smallest file size" as the quality setting (rather than one of the higher-quality setting).</p>
