      <p>Don't attempt to use InDesign as a word processor.</p>
      <p>Type, spell-check, and correct your text with Word (or, for that matter, with any package you work most comfortable with). Only then put your text into InDesign, and format it.</p>
      <p>Word is an excellent writers' tool but sucks in advanced typography; for InDesign it's the other way around. You should use both programs to their fullest.</p>
