      <p>There are some good tools, like Cute PDF Writer, that can convert Word docs into fairly good PDFs (but always check the output, especially that the fonts have been properly converted).</p>
      <p>About Word versus InDesign: one will always have more control over the design of the document in InDesign. Not only better PDFs, but better control over typographic details, better word justification, etc. If your aim is speed, maybe churning out documents, use Word. If your aim is good design and quality, use ID.</p>
      <p>—D</p>
