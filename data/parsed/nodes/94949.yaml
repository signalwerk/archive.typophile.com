      <blockquote><p>Do people do that?</p></blockquote>
      <p>I don't know what specific activity you're referring to, but the answer is: yes.  :-)</p>
      <p>Judging by the poor quality of the outlines I suspect this was a scan-and-trace job. Which means if you need <em>exactly</em> the same letterforms, you're going to have to: find the actual font; come to terms with using a font of unethical provenance (assuming my hunch is right). If you can settle for something very close, I'm sure you can find it; and although it will put you out-of-pocket (probably by a small amount though) you're very likely to end up with something of better quality (and guilt-free).</p>
      <p>hhp</p>
