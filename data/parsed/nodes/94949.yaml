    <p>Hi everyone.  I have a font mystery that I desperately need to figure out.  I just got a graphic artist job and the owner used this font for a product name that has since disappeared from every machine it was on.  This happened back in 2010.  The files I have indicate that the name of the font was Tangerine.  I have been able to find fonts with that name but they are not matches.  So here is a rundown of what I know.</p>
    <p>1.  Script/Handwriting Font<br>
    2.  Bubble Letter / Marker look<br>
    3.  Disappeared from Apple computers in Dec 2010<br>
    4.  Used to be called Tangerine.<br>
    5.  Cannot find it anywhere on the internet under the name Tangerine.</p>
    <p>The picture I am uploading are the only characters I have that I can show.</p>
    <p>Thanks in advance for your help.</p>
    <p>Dan / Globalpuffer</p>
