    html: <p>The reason the outlines look bad is that the psd file this comes from is old.  I am pretty sure the font was legitimately installed on a machine that no longer has it when it was first used and the file was created.  I was able to rasterize the text and then I had to move it around so it wouldn't be crooked when I posted the image here, but because I don't know what it is I cannot do any more than that.  I am stuck with what was already made.  It's too bad that people steal the fonts.  I cannot imagine the amount of work that goes into producing one.</p>
