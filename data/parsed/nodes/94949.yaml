      <p>@Hrant - I exercised due diligence in trying, and failing, to find an existing commercial or free font that matched Tangerine. Most of Bright Ideas' fonts were original, but they also had a few re-created implementations of old metal or photo foundry fonts, including such as Ashley, which pre-dated both akaPotsley and Spiece Graphic's Edison Swirl . The same company sold commercial fonts by subscription under the Software of the Month Club label.</p>
      <p> - Herb</p>
