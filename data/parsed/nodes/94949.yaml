      <p>The font was originally distributed with an early e-magazine, "Bright Ideas", which is long gone. The original distribution had no licensing information.  "Tangerine" doesn't appear to be a copy or clone of anything else, although there are a few other fonts that are vaguely similar.</p>
      <p>The font doesn't contain any internal information regarding its source, and it doesn't appear to be currently available on-line.</p>
      <p>I can't figure out how to send an attachment through here; attached is an image of the character set.</p>
