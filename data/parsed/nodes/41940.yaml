    <p>Hello all.</p>
    <p>I'm not a designer or typographer, just an editor. I edit a small-scale UK magazine. As well as covering current affairs we review films and music, but it's a pretty intelligent read -- sophisticated but pretty sober. We're relaunching next month, going from a mono interior to full colour.</p>
    <p>Obviously fonts are a pretty big deal. It's the designer's call, but I got a few books and read up just because typography interests me. I also read a bunch of blogs and forums.</p>
    <p>But here's the thing. I can't understand why Mrs Eaves wouldn't be a brilliant body text for us. I know it's pretty common now, and I know it draws attention to itself, but I like that it's full of character. In comparison most other things look bland, particularly the Baskerville alternatives that I get presented with.</p>
    <p>The designer is with me to a certain extent. He says that he loves the way it looks, but that I should understand that typographers have a problem with it as a body text. Well, I guess I do, but only insofar as it wants to be seen. I do think it's readable despite all that.</p>
    <p>If we use it it'll be 11.5 on 11.5, with column widths of around 75mm. We'll be printing onto good-quality 90gsm satin.</p>
    <p>So, if you think my subscribers will benefit, please convince me that I'm wrong (with alternatives). The only other font I've seen that I really like is Fabiol, and I reckon you'd think that was worse...</p>
    <p>Thanks.</p>
