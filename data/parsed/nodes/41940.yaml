      <p>I've set a book (over my protest) in Mrs. Eaves. The designer insisted on it. To my eye, it is so open &amp; gappy you can drive smallish trucks between the letters. When you look for type for body copy -- text -- don't look at individual letterforms first. Look at sentences, or at least groups of words. Once you find fonts where that is comfortable, then look at letterforms if you wish.</p>
      <p>Yes, it is readable. I once had a famous designer call me &amp; exclaim "I took all the word spaces out of the text, and I can still read it!" I suppose you could. But why would anyone want to?</p>
