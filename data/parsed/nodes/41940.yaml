      <p>It's a fair point about letting the designer do his job, and I don't mean to make anyone believe that I think I have a proper understanding of the problems with this font. It's just that, in a sense, I'm not the real client -- my subscribers are, and I have to believe I understand them better than anyone. That's also what the designer believes (or how he flatters me) and he seems keen to get my input. Of course I discuss this with him, I'm just canvassing for a little opinion. Also, I wonder how much of this stuff comes down to fashion. I've heard a number of things said about Mrs Eaves that just aren"t true, and they appear to have been said as much in reaction to its popularity as to its inappropriateness.</p>
      <p>Equally, not all designers have typography as a strength, and some advice from people who take it seriously has to be worth seeking.</p>
      <p>Bear in mind that I was asking you to convince me! I wasn't looking for ammunition to use against my designer. We are both looking for font recommendations -- something with character that will hold up to this sort of use.</p>
      <p>I'm sorry if I've trodden on any toes -- I appreciate that I'd get uppity if a designer tried to teach me how to edit. I'm genuinely trying to take advantage of your knowledge.</p>
