      <p><cite>…I know it draws attention to itself, but I like that it’s full of character.</cite></p>
      <p>The problem is that the fabulous character the makes Mrs. Eaves so great as, for example, a business card typeface, can get really tedious after a while. The funky spacing and generous overshoots are really cute in small doses, but compound them with the high-contrast of the text and you’re making a recipe for annoyance. Also, keep your printing techniques in mind; if this magazine is coming out of a not-so-great press on low-cost paper, as small magazines often are, the hairlines in a Baskerville will start to break up and disappear, especially if you use a color that isn’t very dark. Topping it off, there’s a very historical feel to any Baskerville design, and it’s going to look very odd as body copy in a contemporary music and film magazine. </p>
      <p>Consider reserving Mrs. Eaves for flavor here and there in short articles, especially when the point size can be bumped up to compensate for magazine printing. But using it as body copy throughout probably won’t work out too well.</p>
