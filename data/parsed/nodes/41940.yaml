      <p>I was talking about the typeface.<br>
      I suppose its proportions--small x-height and long extenders--might make it a bit twee, but its low contrast and lack of fussy details certainly don't.<br>
      In comparison, the recent types derived from Fleischmann, which have been used for magazine text, have quite mannered details.</p>
      <p>But really, I don't believe that one should say "oh, such and such typeface can't be used for such and such kind of work".</p>
      <p>Having said that, I think Ms Licko's pushing it a bit to suggest Mrs Eaves for "elegant headlines", unless they're small headlines, as it doesn't have optical scaling.</p>
