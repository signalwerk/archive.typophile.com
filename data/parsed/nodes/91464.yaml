    <p>This is a catalogue designed by Mathias Schweizer:</p>
    <p><a href="http://www.manystuff.org/?p=16101" title="http://www.manystuff.org/?p=16101">http://www.manystuff.org/?p=16101</a></p>
    <p> I'm trying to find out if he custom-designed this headline font or if it's available anywhere. I've looked through a lot of type foundries without finding it, and also emailed Mr. Schweizer, so far with no luck either way. If anyone knows anything, I'd be very happy.</p>
    <p>I suppose it&nbsp;can be classed as a 'script' font, but wasn't sure, decided to post here.</p>
    <p>Thanks!</p>
    <p>K</p>
