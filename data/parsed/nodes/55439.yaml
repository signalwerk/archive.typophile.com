  html: <p>Is it normal that a big print shop requires that all the texts have to be converted to outlines? (I mean that is their <em>standard</em> 'policy')</p>
  html_clean: <p>Is it normal that a big print shop requires that all the texts have to be converted to outlines? (I mean that is their <em>standard</em> 'policy')</p>
comments:
  - id: 332626
    user: 4204
    date: 2009-03-03T06:26:00
    date_raw: 3 Mar 2009 — 6:26am
    votes: null
    html: |-
      <p>They don’t want to read the EULAs and they don’t want to buy the fonts. They just want to RIP the job, print it, and go on to the next. This is how they put the responsibility on you to get it right. They also dislike making changes and sending proofs out, which delays their schedule.</p>
      <p>Look around at all your alternatives and find the shop that has the right presses, operators, and work flow for you.</p>
