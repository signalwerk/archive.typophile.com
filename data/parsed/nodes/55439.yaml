    date_raw: 5 Mar 2009 — 2:08pm
    votes: null
    html: |-
      <p>Probably what they did was to create a workflow where font issues are over! All is converted to outlines by the designer. They are saving big time on the operation, cause fonts issues suck.</p>
      <p>A side-effect to this practice is that the files will be way bigger then if the text was regular embed fonts on PDFs, costing more time and memory to convert files.</p>
      <p>Tell them!</p>
