  - id: 333226
    user: 5094
    date: 2009-03-05T17:50:00
    date_raw: 5 Mar 2009 — 5:50pm
    votes: null
    html: <p>Hinting is irrelevant at 2,000+ dpi used with offset printing today. I'm assuming this is "printing," not xerography. In fact, in the early PostScript days, I use to strip the hints out of fonts because they sometimes caused trouble. Type was output to repro paper at "only" 1,200 dpi. But that was a true 1,200, not tricked.</p>
