    date: 2009-03-03T10:58:00
    date_raw: 3 Mar 2009 — 10:58am
    votes: null
    html: <p>James, it is a relatively big print shop (relative to the place where I live), but the mentality is still that of “two guys with digital press etc.”, very common in Italy (and particularly in central Italy, I suspect I also share the same behaviour). Another printer months ago <em>rasterized</em> everything before printing without even calling me, and then he tried to put the blame on me for the results.</p>
