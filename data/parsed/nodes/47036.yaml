    html: |-
      <p>Scotch Roman is, well, James Mosley's contribution to "A Tally of Types" tells the story.<br>
      Scotch Modern is an accurate revival of a face by George Bruce (probably) from a book printed in 1870 in Albany.<br>
      Miller &amp; Richards was the name of a foundry; there were many faces produced there over the years.<br>
      AFAIK the Carter face name alludes to earlier days, before Richards got involved.<br>
      Miller is a Scotch Roman, the Scotch Modern and Modernized Oldstyle are later styles.</p>
