    html: <p>As far as text faces, most of the American fonts in use at this time were in the "modern" classification, but more likely to be the Scotch Roman variety than Bodoni. The individuality in design that one associates with this period shows up in display faces, both metal fonts and woodtype. These can be found in the specimen books of the era. This period was also the heydey of piracy through stereotyping, so while there were enough American type foundries by this time to make importing fonts from Europe unnecessary, designs may have been "imported" by this method of copying.</p>
