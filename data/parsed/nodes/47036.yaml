    <p>Today's subject of expertise is the American West.</p>
    <p>I am looking for examples of American typography between 1836 (Battle of the Alamo) and 1890 (Wounded Knee).</p>
    <p>(The backdrops to the first and last 'Western' movies, according to Wikipedia).</p>
    <p>Which typefaces were used in American books and newspapers at this time? A lot of material I have seen looks like it is, or is very similar to Bodoni. Was type imported from Europe?</p>
    <p>Thanks</p>
