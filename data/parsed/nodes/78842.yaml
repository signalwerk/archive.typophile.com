    <p>Hey guys. I'm trying to find a great industrial-looking sans-serif font, much to the feel of Futura when done in all/small caps.</p>
    <p>The problem is my version of Futura adds quite a bit of weight to the caps compared to the small caps, and throws off the delicate balance I'm looking for. I'd love something with a bit more consistency between the weight of the full caps and the small caps, and that looks great tracked out pretty openly, but still reads well at small sizes. It will be used surrounding the outer edge of a circle logo element in what looks very much like an old service logo from the 50s.</p>
    <p>Thanks ahead of time.</p>
