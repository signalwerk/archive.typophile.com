    html: <p>Have a look at P22 Underground Pro! Caps are often heavier than the small caps, for good reasons, but Underground comes with an extra set of them. There might be a cut of Futura out there tuned more towards German with lighter capitals. I’m sure someone with more knowledge will chime in.</p>
