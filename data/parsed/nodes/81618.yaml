      <p>I figured out how to make the font smaller without altering my metric settings. Bring out the ACTIONS panel from the TOOLS menu. Under "Contour" choose "Scale (50.00, 50.00) HMZ. Click on boxes "Scale hints" and "Scale metrics" Apply the scale you wish. On the "Scale center" option: choose "Reference point". Click on "Apply to entire font" is this is your case.</p>
      <p>BUT I am still trying to figure out how to change ascender value</p>
      <p>Thanx</p>
