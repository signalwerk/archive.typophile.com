  html: |-
    <p>Hello, I am done with my font on FONTLAB except for the fact that my font is double the size of any regular font. I would like to reduce it, meaning reducing all the contents of my glyphs without having to set all my metrics, kernings, etc all over again.</p>
    <p>I notice this when I tried posting it in FontSpace and on the preview the capital letters got cut off on the top part . I realized the ascender value needs to be changed, BUT I don't know how to to this (I'd like to know how this is done). Nevertheless, they are too big and I think my problem can be solved by reducing the contents of all my glyphs.</p>
    <p>Can I have some advice on this please?</p>
    <p>Thanks in advance</p>
