      <p>I don't know how you do it in fontlab, but it's very easy in Fontforge. You simply go to the <strong>Font Info</strong> dialog, and then the section <strong>General</strong>. And then you'll measure what the highest point in your font is, and take that coordinate and put it into the <strong>Ascent</strong> box, then measure the lowest point and put that into the <strong>Descent</strong> box. Then make sure <strong>Scale Outlines</strong> is unchecked and press OK. Then open <strong>Font Info</strong> again and put a rational number into EM size, generally 1000 or 2048, this time with <strong>Scale Outlines</strong> checked, and press OK.</p>
      <p>Basically your making sure everything is inside the bounding box, and then making the EM size normal.</p>
