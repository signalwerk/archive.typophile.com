    html: <p>This is probably the only useful thing I'll be able to share about calligraphic tools here, but we used the Parallel Pen too in the calligraphy classes I took, and one thing to know about it is that it uses a *lot* of ink, and the cartridges are rather expensive. You can just keep buying those all the time, or you can use a syringe to refill the cartridge you have from a larger ink bottle, which will yield almost the same quality and will save you lots of $ over the long run. (In my case the run wasn't all that long but still. :-)</p>
