    html: |-
      <p>I'm sure you've already used these...but they are pretty sharp and clean, you've got to watch the paper your using though. You want some super shiny stuff, and very little pressure. <a class="freelinking external" href="http://www.cultpens.com/acatalog/edding_1255_Calligraphy_Pen.html" rel="nofollow">http://www.cultpens.com/acatalog/edding_1255_Calligraphy_Pen.html</a></p>
      <p>I've never managed to get a swelling nib (spencerian style) effect through a marker pen, you can cheat, draw a skeleton and then swell out at the right places with a fatter pen. It worked pretty good in my graffiti days.<br>
      A southpaw nib will definitely help, or my oblique holder can reverse? i presume that has the same effect with non angled nibs. Also, reverse the angle you approach the paper at (as opposed to the way they show you for orthodox).</p>
