  html: |-
    <p>Does anyone have any good tips for left-handed calligraphy? I'm pretty good making ogee curves and flourishes with pen/pencil, but whenever I try with a nib, the ink never comes out smoothly. I just ordered some new lefty nibs in case they were the issue, but I have a feeling the ink flow might be due to my technique. </p>
    <p>When I use felt-tip calligraphy markers, I get the shapes I want. However, the sharp contrast you'd get from steel nibs just isn't there. Unless, does anyone know if there're any sharp, thin calligraphy markers out on the market?</p>
    <p><a class="freelinking external" href="http://www.xavierdupre.com/img/sketche04/img002.jpg" rel="nofollow">http://www.xavierdupre.com/img/sketche04/img002.jpg</a><br>
    Any idea what tool was used for something like this?</p>
