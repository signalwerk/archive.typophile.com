  html: |-
    <p>I just got through creating a font and when I applied it to a random letter I typed in TextEdit (mac) 2 random $ signs appear on the page. They can't be deleted. They are not glyphs. They are just stuck there and in fact it's possible to type over them and you can see them underneath the letters on top! </p>
    <p>I sometimes don't see them and sometimes there are one or two, depending on what you type. Now I'm also seeing random - symbols that appear and change when I adjust the type size!</p>
    <p>Anyone have any idea what the hell this is or how it can be fixed? God have mercy on the font designer that faces this. This is terrible.</p>
    <p>I'd like to sell this font eventually and I can't have this glitch in it!</p>
    <p>Thanks in advance to anyone that can help me out.</p>
