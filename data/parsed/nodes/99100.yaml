    html: |-
      <p>I feel like your struggle is not to find the right font, but to find a design concept. What do you want the logo to say? The more specific you can get, the more you’ll have to work with as a designer.</p>
      <p>For example, “language based” is a bit general—dig deeper: what services/products do they offer, translation, writing, research, layout, audio?</p>
      <p>Are they archaeologists hunting down the Word that will reveal history’s secrets?<br>
      Are they communication specialists who can hone your business’s PR strategy into a sharp, deadly edge?<br>
      Are they interpreters who can order you supper in any country in the world?</p>
      <p>The font you pick has very little to do with projecting any of these messages (as long as it’s well-made).</p>
    html_clean: |-
