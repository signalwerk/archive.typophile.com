  html: |-
    <p>The magazine contains articles about type specimens in general, dummy texts, type specimen index cards and a report about our workshop “Presenting type at its best”.</p>
    <p>But more than this, Catherine Dixon contributes with an article about the history of type specimens, Oded Ezer sent us pictures of Hebrew type specimens and Robert Schöne of Chinese ones, Daniel Janssen informs about the Holzlettern Manufaktur (Wooden Type Manufactory) Hamburg and Jürgen Siebert &nbsp;from FontShop gives a summary of the FontBook's “making of“. All articles in the magazine are bilingual (German/English).</p>
    <p>The issue consists of 2 brochures, 68 pages printed duotone orange/blue and 36 pages printed CMYK, format DIN A4 (210 x 297 mm / 8.2 x 11.6 inch). It can be purchased at <a href="http://shop.spatium-magazin.de" title="http://shop.spatium-magazin.de">http://shop.spatium-magazin.de</a>, the price is 15 Euro plus shipping.</p>
