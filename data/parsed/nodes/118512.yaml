      <p>This may be only me, but I'm the person who consciously thinks "oh is this iBoat?" Apple's tremendous success has linked this typeface with the image of itself.</p>
      <p>If you (@Jean Louis) don't mind, Avenir may be a good alternative. But mind the dribbblisation it may ensue.</p>
      <p>P.S. I remembered Akko mainly because of the name, not the letterform... I personally don't have much affection for such industrialized styles with some intentionally, <em>ex post facto</em> added humanism factors, but the name "Akko" is the diminutive form of "Akira" in Japanese – unconventional; because most such nomenclature use the full name, i.e. Frutiger from Adrian Frutiger.</p>
