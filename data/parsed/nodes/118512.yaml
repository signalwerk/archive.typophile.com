    html: |-
      <p>A boutique yacht consultancy, providing project management services. Basically, they manage new yacht projects from design to delivery. </p>
      <p>Warm or cool? Definitely a clean and sleek style, but rather beach house chic. Not the obvious all-white sterile minimalism. Californian modernism comes to my mind.  </p>
      <p>Brand ID is authentic, individual (tailored to the client), contemporary, innovative, refined, boutique (not corporate), sexy (but still professional), a sense of timelessness. Office style is casual chic, no suits and tie. To translate this into a car, I would say a Maserati, stylish but with a sense of understatement. In architectural language, probably a modernistic house somewhere in LA, like Sheats-Goldstein, or a modern loft.</p>
      <p>Besides that, they are a bit of the David vs Goliath in their industry. Small business, with vision and good taste, driven to make a difference, not just interested in building as much/large as they can.    </p>
      <p>For fonts, I considered Futura, but a competitor is doing that, and besides it sometimes looks a bit rigid. For body, I thought to stick with arial, clean and professional. I think serif is too formal for a smaller business, in this field. For titles/headlines, I consider Gill Sans, maybe Proxima Nova. This site  <a class="freelinking external" href="http://www.fasano.com.br/" rel="nofollow">http://www.fasano.com.br/</a> using Akzidenz looks great, but then you need to use it for body text as well. Univers is great, but lacks some edge for headlines and titles. These people <a class="freelinking external" href="http://www.oneauthenticproperties.com/" rel="nofollow">http://www.oneauthenticproperties.com/</a> and <a class="freelinking external" href="http://www.spykercars.com/" rel="nofollow">http://www.spykercars.com/</a> use DIN for a premium brand, also looks good.</p>
