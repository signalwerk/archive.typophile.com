      Myriad is often used for titling, .e.g. the Springer science books, but it also seems to work at smaller sizes. Regret I don't have a good specimen to offer. But here is an opinion piece that claims Myriad works at tiny sizes <a href="http://www.thebookdesigner.com/2011/02/typefaces-i-cant-live-without-adobe-myriad-pro/" title="http://www.thebookdesigner.com/2011/02/typefaces-i-cant-live-without-adobe-myriad-pro/">http://www.thebookdesigner.com/2011/02/typefaces-i-cant-live-without-ado...</a><br>
