    html: |-
      <p>Nick, I thought a little bit more about another way to solve your problem, and came up with this theory. I haven't tested it, and it has some kinks to work out, but it may be a good starting point?</p>
      <p>Assuming you've already got tabular arbitrary fractions. Also assumes a space before and after the fraction. </p>
      <p>You really only need to know how many digits are in each the numerator and denominator. To do this, you could just swap classes with classes, and count.</p>
      <p>Figure out how many numerator positions you'd like to support, and create a class for each, plus a base. So for example, consider the fraction.</p>
      <p>2384/4890</p>
      <p>You'd need to support four numerators and denominators. Create 5 classes and name them something like. </p>
      <p>num_base [zero.sup one.sup two.sup...] all classes have exactly the same glyphs<br>
      num_one [zero.sup one.sup two.sup...]<br>
      num_two [zero.sup one.sup two.sup...]<br>
      num_three [zero.sup one.sup two.sup...]<br>
      num_four [zero.sup one.sup two.sup...]</p>
      <p>Then swap classes to count.</p>
      <p>sub space @num_base' by @num_one; Identifies first digit<br>
      sub @num_one @num_base' by @num_two; identifies second<br>
      sub @num_two @num_base' by @num_three; identifies third<br>
      sub @num_three @num_base' by @num_four; identifies fourth</p>
      <p>Perform similar task for the denominators, except we'll count backwards from right to left this time, because the context with the fraction is most important. So...</p>
      <p>sub @denom_base' space by denom_one;<br>
      sub @num_base' @denom_one @denom_one space by denom_two;<br>
      sub @num_base' @denom_two space by denom_three;<br>
      sub @num_base' @denom_three space by denom_four;</p>
      <p>So in this example, we'd end up with space @num_one @num_two @num_three @num_four / @denom_four @denom_three @denom_two @denom_one</p>
      <p>Now we've got to center everything. It's probably easiest to just center everything around the numerator, but that may give you issues crashing into previous text. I'll let you figure out how to solve that problem, but I'm sure it's possible.</p>
      <p>So first make the bars, with their varying widths to cover your options. If you give the fraction a negative left sidebearing, you can center it under the numerator. Then give it a negative right side-bearing, this can be used to center the denominator.</p>
      <p>A basic swap, with exactly the same number of digits in num/denom, you could do something like this.<br>
      Sub @num_four fraction' by frac_four;<br>
      or<br>
      Sub fraction' @denom_four by frac_four;</p>
      <p>However to be a little more flexible, supporting varying numbers of digits, create four different versions of the fraction_four. each one with a different right sidebearing, to center the denominator. Then...</p>
      <p>Sub @num_four fraction' @denom_three by four_frac_three;</p>
      <p>And cover all possibilities.</p>
      <p>Like I said, I haven't tested this, but maybe it will help? If it works, it could sove having to make ton of extra glyphs. The only glyph that would need alternates is the fraction bar.</p>
