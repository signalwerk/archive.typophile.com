      <p>This reminds me of experiments I did a while ago, to try and program arbitrary nut fractions.<br>
      I gave up as it was getting too complex, but having seen Chartwell, I think I could get it to work now. </p>
      <p>I can also see this technique being used to create multi-colour fonts: one would apply color to the parts in the default "exploded" view, and apply "ligatures" (or whatever feature is deemed appropriate) to bring the parts together. It would be smoother and more precise than the system presently employed by multi-color fonts, which IIRC all rely on layering of text boxes.</p>
