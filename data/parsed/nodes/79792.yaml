    date: 2011-03-09T12:49:00
    date_raw: 9 Mar 2011 — 12:49pm
    votes: null
    html: |-
      <p>First, I should say that I approached this from an experimental angle. I was trying to see how far I could push OT to manipulate input data. Making it useful, was something I definitely wanted to achieve, but it was slightly less important to me.</p>
      <p>Illustrator does have useful chart and graph building tools. I think many people aren't aware of them, or just don't want to deal with them. Personally, I find them clunky and don't use them. </p>
      <p>But say you are putting together an annual report in InDesign and don't want to have to go back to InDesign to make tweaks to the charts? Just one potential workflow time-saver I see.</p>
      <p>There are a ton of options for making charts out there, and Chartwell isn't meant to be the end all solution. It's just another option, that may, or may not make sense with what you're trying to do.</p>
      <p>Ultimately though, the next step will be pushing these into non-standard, and less mathematically calculated shapes. Taking advantage of the fact that I can draw any shape I want. Something that excell, and other chart making software isn't really built to do.</p>
