      <p>Then the advocate for the guy with a tail and pitchfork shows up. this is a well designed and apparently well executed idea that off-loads the difficulty of text-to-graphics from the input to the output. E.g. though the examples show nice little input and nice big output, the reality is that the input and output sizes are the same. So, one must make sure the composition remains in opentype savvy environments or else an output font must be created/subset to contain the right graphic. I don't think this is a big problem, since spell checking and other character specific functions are not likely to used after composition except in dynamic web environments. </p>
      <p>The other devil of an issue here, I'm sure you've all thought of  is color, since nearly no one wants black and white, or monotone graphics of this kind.</p>
