    html: |-
      <p>Thanks Travis, but I have it figured.</p>
      <p>I had been working with a (relatively) small number of glyphs, using kerning to position numerators, the horizontal bar, and denominators, but was running into problems with some applications failing to recognize three glyphs superimposed, by means of negative sidebearings and large kern values.</p>
      <p>Having seen the vast number of glyphs you have employed, I now think that a more robust solution to creating a large set of nut fractions would be to combine denominator and bar, so that one hundred glyphs would cover the "bottom" of all fractions up to hundredths, then one hundred numerators could be kerned to fit above, in two classes.</p>
      <p>I'm not sure there would be much call for such fractions by people using general layout apps, though. If such fractions were required, they would be using a math app anyway. But you never know.</p>
