    user: 43052
    date: 2011-03-09T11:04:00
    date_raw: 9 Mar 2011 — 11:04am
    votes: null
    html: |-
      <p>@Pomeranz<br>
      Thanks for sharing.</p>
      <p>@dberlow<br>
      Thanks for the thoughts. It's good to hear some critical feedback. Yes, in the examples, the output has been scaled up. This was just a design decision to keep the examples simple, but perhaps it would be worth noting in the examples to be completely transparent. I'm OK with these only working in OT savvy environments. I see these as more of a tool to help designers create charts in their native design files. </p>
      <p>As far as the scaling issue goes, it's pretty easy to change the pt size, just like any font. </p>
      <p>This definitely is not ready for the web. I've got some ideas on how to use JavaScript to do the work of OT, in browsers not that don't support ligatures. But I think rendering is an issue, even on a Mac. The glyphs have to line up perfectly, or else you end up with gaps between values. I really don't have the manpower, or technical know-how, to manually TT  these, because of the sheer number of glyphs.</p>
      <p>As riccardo pointed out, these aren't limited to black and white. You can give it any color you like. Whatever color is applied to the number, the related ligature glyph will take on that color. The decision to go with b&amp;w was again, purely a design/brand decision. Treating it much like a standard type specimen, I thought it was best to keep it simple and show that these hold their own, even without color.</p>
