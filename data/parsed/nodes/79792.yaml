      <p>It's been tested in CS4 on Mac, CS5 on Windows 7, also Illustrator CS on Vista. </p>
      <p>I don't have a budget to license and test all possibilities, but fully plan on troubleshooting or refunding if problems do arise. One of the reasons I decided to launch this on my own, without MyFonts, was so I could keep a close relationship with customers and provide upgrades easily. </p>
      <p>I've had no complaints so far, other than a naming issue, now resolved.</p>
      <p>There's no kerning in Chartwell, except in the alphabet, and I don't think the sidebearings are absurdly large. I would be interested to know what applications and systems you were having trouble in. Was the problem only appearing when glyphs had both kerning and a negative sidebearing?</p>
