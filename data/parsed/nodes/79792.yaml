      <p>&gt;&gt;to use JavaScript to do the work of OT, in browsers [] that don't support ligatures<br>
      &gt;this is a real challenge. I wish you great success.</p>
      <p>It's actually not that difficult. Just like OT 'sub x y by x_y' you can do a similar find/replace with Javascript. However you have to point to unicode, rather than glyph names. The problem is though, that I'd have to go back and give the glyphs a PUA, then organize those those into javascript arrays, which would serve the purpose of classes. Not a quick and painless task, but definitely possible.</p>
      <p>And like pointed out above, there are already much better systems for displaying graphs on the web. I think exploring this would only be useful if I end up doing a non-conventional graph design.</p>
