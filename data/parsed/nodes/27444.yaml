    <p>Actually, the problem is with alignment zones, as I haven’t specifically applied any hinting to the font. (Unless there is some output setting that does hinting automatically that I’m not aware of.)</p>
    <p>Here’s the offending item. It’s printed on newsprint, 14 pt. The font is “.otf”, output to PDF from InDesign:<br>
    </p><div class="imageWrap"><img src="/files/options_4437.png"></div><p></p>
    <p>A Type 1 version of a very similar font (with almost the same alignment zones and standard stems) came out as intended.<br>
    This is on coated stock, again at 14 pt:<br>
    </p><div class="imageWrap"><img src="/files/intos_6715.png"></div><p></p>
    <p>The main reason I give the fonts alignment zones is so that they are neat on screen:<br>
    </p><div class="imageWrap"><img src="/files/ionsBMP_4235.png"></div><p></p>
    <p>Here is what the FontLab file looks like (a composite of screen grabs, actually):<br>
    </p><div class="imageWrap"><img src="/files/ionsFL_6170.png"></div><p></p>
    <p>Can anybody shed some light on my difficulty?</p>
