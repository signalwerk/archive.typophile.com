  html: <p>Greater Albion Typefounders has released another of it's 'Evolutionary' faces at MyFonts.com. <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/coronard/ " rel="nofollow"> Coronard</a> uses calligraphic detail toelaborate an underlying Roman serif form, and is a great way to combine ancient looks wih modern legibility.</p>
