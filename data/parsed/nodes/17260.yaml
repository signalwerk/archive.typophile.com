      <p>Hrant, what I understood Nick to be saying over in the italic thread was simply that italics can be better fitted in that they may require far fewer kerning pairs than romans. This seems to be to be self-fulfilling: if an italic has fewer kerning pairs than the associated roman, it meets the criteria for 'better fitted' that Nick is using. So what is to counter? He didn't say that this was good for readability, in fact he explicitly stated that it might not be a benefit. It is simply an observation about the way italic letters fit together as compared to the way roman letters fit together. If you consider even one factor affecting the fitting of italics vs romans,  that the typical italic <em>a</em> is a cognate form with <em>d</em> and <em>q,</em> then you have identified a significant reason for the need for fewer kerning pairs. If you consider also that italic <em>v</em> and <em>w</em> and sometimes <em>y</em> often have convex sides, you have another why fewer kerning pairs would be needed. So I really don't see anything to counter in Nick's observation.</p>
      <p>If you want an example of me spending a long time trying to change Nick's mind about something, go read the threads related to Greek casing and tonos angle.</p>
      <p>If I've seemed to spend more time hammering at you over the years, it is because I've had so little success getting you to change your mind even about obvious things like the distinction between visual rhythm and temporal rhythem, even when I provide detailed illustrations and demonstrations. It has nothing to do with your being 'able to handle it' -- there are stronger souls than both of us in this forum --, but everything to do with your being stubborn in your mistakes. With most people, if I criticise or point out flaws in their reasoning, they respond directly to the points I raise and the conversation progresses, whether they accept my criticisms or disagree with them. You tend to just keep repeating the original statement or claim, and ignore the points that have been raised against it. So you come in for more and repeated persuasion, while conversations with other people proceed with more fluidity and less repetition.</p>
