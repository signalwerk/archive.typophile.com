      <p>&gt;the punchcutter does not seem to have been able to cut sharp inner-corners anywhere</p>
      <p>If you look at the Christian Schwartz PDF of Houston that I linked above , you will see how some current web presses add a ’stroke’ around the digital outline. I would guess that ink squeeze on letter press does the same thing, as some ink would get on the ’beard’—slanted sides—of the type, and picked up when pressed into damp paper. There are other effects from uneven inking, coarse ink, etc., but I think this effect would be consistent. And its result would be to round inner corners. </p>
      <p>In any case I’m sure the ’fabulous hands’ of Francesco da Bolongna could cut a sharp inner corner if he wanted to. So the most likely culprit here is a consistent effect of ink spread.</p>
