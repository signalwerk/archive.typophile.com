      <p>I’m still bothered by this consideration: what if the original punches were really much more ’regular’ from a broad-nibbed paraphrase point of view. I have a hard time believing they would have been as unlovely* or as ’unsophisticated’ as the averaging makes us want to believe they might have been. What I see in the averaged output are hints of a ductal logic which however never becomes fully manifest. That roman seems much more tractable in that regard, George. </p>
      <p>But if the gain or crudeness—call it what you will—is a happy accident for perceptual processing in reading**, there might be a lesson in it for today that translates to a beneficial but not entirely controlable gain introduced by sub-pixel rendering. (This could be all wet of course) As well, I’m not sure I would call the ’n’ effect erosion. Ink transferred by sharp metal to smooth offset, where organic absorption dynamics are replaced by oily flow dynamics just seems to subtract value, rather than add.</p>
      <p>* unlovely: except in a quaint sense that translates for me into something genuinely appealling,,,</p>
      <p>** because it inhibits slot-processing of letters</p>
      <p>”[...] a sharpness or sparkle. A lot of that was artefacts, but it’s part of the effect. With the averaging process, and viewed on a flat screen or printed offset on smooth paper, that quality is gone.”</p>
      <p>But doesn’t antialiasing and sub pixel rendering reintroduce it and dimensionality or depth to some extent as I thought David Berlow was suggesting in another thread?</p>
      <p>And, Hrant, I have to wonder why, if serifs with rounded ends are beyond the acuity of the retina—and I’m assuming you mean in foveal vision—why delinked counterpoints, unless the violations to frontal logic they introduce are fairly massive, make all the difference in readability terms, especially at the acuity hobbled parafoveal level, where mostly just silhouttes are, by your logic, criterial. </p>
