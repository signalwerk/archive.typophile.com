    html: <p>Thanks John - I can’t wait to get started in October, assuming I get on the course. I have absolutely no training in any related field, and a year ago didn’t know what an ascender was, but the pull of this sinister spiral is very strong. Hrant asks “Why are you doing what you are doing?”, and the answer is that I think that there’s powerful magic in this roman of which Garamond only caught a whisper in his own Griffo revivals, and which was never found again before Baskerville called the search off; I want to isolate it at original strength. The Soncino italic is just exceptionally pretty icing.</p>
