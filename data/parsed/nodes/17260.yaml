      <p>Me: "You are in fact doing ...is trying to revive features of the typeface that you regard as good or desirable ones."</p>
      <p>You: "This doesn’t follow." [from the fact that you are not trying to revive all features.]</p>
      <p>Your objection to my argument is valid. My mistake. </p>
      <p>However, the underlying issue I think remains a question you should consider, to make your projected year's work most productive: What purpose are you doing this for? </p>
      <p>Is your decision not to revive variation but to do everything else capricious? It being not capricious, what are your guidelines? If your purpose is simply to learn, not produce a typeface to use, then what specifically are you trying to learn? What questions are you trying to answer? Producing different revival versions that revive different features might be more informative than trying to revive everything but a few features. This is just from a research point of view. The general point about research (which was made by Popper) is that the more developed and articulated your theory is, the more informative your testing and your results will be. </p>
      <p>It is for you to say of course, but I find it a little hard to believe that you are willing to spend a year on a project reviving a typeface and are indifferent to whether anyone will use it. I say this to reinforce my question, which many of the best type designers say is always their first one: What is your brief?</p>
