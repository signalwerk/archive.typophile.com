      <p>The idea of solidifying microproperties that give Griffo’s fonts singularity strikes a chord with me as you might expect. And I’m interested in the suggestion that Griffo’s featural innovations are transitional, in the sense that they form a bridge between humanist and baroque forms.</p>
      <p>In connection with the term ’capricious’, I’m wondering if you see Griffo’s norm violations—vis a vis what comes before—as <em>ad hoc</em> letter by letter, or if you expect to find a systematic application across the glyph set(s) of a well-considered feature or contrast manipulation scheme. Are you hoping your averaging mechanism will converge on a definable  or characteristic set of holotypic (Bringhurst’s term) microproperties applied across the glyph set?</p>
