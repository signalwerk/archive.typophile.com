      <p><em>But that’s TINY. Probably beyond the acuity of the retina.</em></p>
      <p>No doubt.<br>
      But the problem with this new Soncino face is that in comparison, any original imprint, 3D in fibre paper, would have created an impression with the viewer of a certain amount of very fine texture, a sharpness or sparkle. A lot of that was artefacts, but it’s part of the effect.  With the averaging process, and viewed on a flat screen or printed offset on smooth paper, that quality is gone. Perhaps one can’t point to an individual instance and say “this makes a noticeable difference”, but in toto what we now have is a dull, blobby version of something that originally had some <em>cut.</em></p>
      <p>The more I look at this, the more I think it needs contextual alternates to put some life into the setting, because the smoothness and the mechanical uniformity of the setting makes the letter forms look crude and inept. But they weren’t, relative to the available technology, they were brilliant.  </p>
      <p>It’s like if you made a movie of a person gracefully negotiating a rough path, and removed the path, and looped a short sequence, they would look crippled.</p>
      <p>Why do the n and u have a large x-height? If it’s to compensate for bounce, and there is no bounce...</p>
