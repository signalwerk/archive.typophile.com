      <p>[John] “Yes, but supress them we must...”</p>
      <p>Exactly.</p>
      <p>... surrendering to associations of rhythm with sequence or flow is to accept a kind of phenomenological blindness.</p>
      <p>Nice.</p>
      <p>[George] “Are you recommending in practical terms...”</p>
      <p>Yes, since even the most mechanical of methods interprets (contra Hrant?), you are looking for the place where the various methods converge. In the best of all possible worlds the methods will crosstalk as they proceed.</p>
      <p>But the possibility exists that, because the glyphs are cut, the tuning of contrast is at least as much feature-awareness-based, as chiro-referential (or deliberately chiro-paraphrastic). It isn’t out of the questio—probably it’s likely—that Griffo engages in a more or less deliberate or overt process of ’geometrical-feature’ evaluation of or play with inner and outer form. Punch cutting seems to me to encourage a more feature-analytic relation to form than the writer’s learned repitition of ductal or gestural routines. </p>
