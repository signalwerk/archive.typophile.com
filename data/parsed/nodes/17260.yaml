    html: "<p>Nick, I think there is one further quality of the original which justifies alterations in the digital revival: I mean the characters’ apparent similarity of weight, which comes from the very irregularity of weight in each printed instance. One can’t get a strong sense in seeing the Aldine page that one character is heavier than another, because even if there were such a relationship in the punch, it would be lost among the inequalities of weight that come from the printing process. Griffo may even have chosen to cut variety of weight into his punches knowing that in printing these differences would have been greatly diminished. So the weight, and perhaps contrast, of characters could be tweaked upon inspection of the first draft of the digital alphabet until these seemed as harmonious as in the original. This would prevent a repeat of the major problem with Poliphilus.</p>"
