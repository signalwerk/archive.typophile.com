      <p>Letterpress is an inconsistent process. From a sharp original, it produces images which retain sharpness in some areas, but lose it in others. </p>
      <p>There is some logic to this, in that the "protected" areas of the type, eg hairlines at joints, are more likely to retain fine detail than "exposed" parts of the type, such as serifs on stems, which tend to blobbyness. (There is more pressure here, as the paper is stretched over the neck of the type.)</p>
      <p>This variety of image quality, with its slight unpredictability, is a pleasing effect.</p>
      <p>Back in the day, type designers took this into account, which is why vertical stems on M, N, V etc. were able to be so fine, and the letters proportioned accordingly.</p>
      <p>One way to "parse" the effect of letterpress is to mix sharp and soft detail.<br>
      In fact, Goudy did this for his pseudo-incunabula faces such as Kennerley, which were designed for letterpress anyway.</p>
      <p>I've done this mixing on several of my faces, but here are some examples by Robert Slimbach and Carol Twombly, Adobe Caslon, Jenson, and Minion.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Eees.jpg"></div><br>
      The joint is sharp, but the inside right corner is rounded.<p></p>
