      <p>I ought to say, William, that I share your doubts about my position, and that I might yet in practice change my theory.</p>
      <p><cite>Is your decision not to revive variation but to do everything else capricious?</cite><br>
      I assume (do correct me) that by variation you mean differences between prints from a single punch, and that by the capricious you mean differences in treatment of similar features from punch to punch. I expect to try to revive all the capriciousness which is sufficiently marked to survive the averaging/sharpening process. I'm not sure what you mean by "It being not capricious, what are your guidelines?"</p>
      <p>You should understand, as no one would from just seeing either Bembo or Poliphilus (which is in no sense a replica even of selected printed letters), that Griffo loved oddities, and that his work, far from being a rough predecessor to Augereau's and Garamond's, is sui generis, taking the capriciousness of Jenson and adding to it a quality which for want of a better word we might call typographic (his 1495 roman is narrower than any MS hand); his French followers would take the latter but forget the former. Thus Griffo's 1499 cap X has reversed stress, and his lc x in the Hypnerotomachia is bizarrely twisted. Take most of the capriciousness away and you get Abrams Augereau; take more away and you get Adobe Garamond. Because I find Griffo's work in its printed form uniquely beautiful, I want to learn what microproperties give it its beauty: I want to solidify these properties in a way that cannot be done by just looking at the printed page. I don't think printed variation substantially contributes to this beauty; and to me it is often ugly.</p>
      <p><cite>Producing different revival versions that revive different features might be more informative than trying to revive everything but a few features.</cite><br>
      In a perfect world, I'd make three versions: one from following averaged forms in such as way as to preserve apparently damaged parts; one as I've described, taking the first version and reworking heuristically for bite and harmony; and one taking the second version and heuristically eliminating all irregularities that seem inessential to the effect.</p>
      <p><cite>The general point about research (which was made by Popper) is that the more developed and articulated your theory is, the more informative your testing and your results will be.</cite><br>
      I accept the point generally, but could you clarify what theory of mine, or theoretical area, you're referring to? My theory of typographic beauty, of readability, of the nature of Griffo's work, of the morality of type revival?</p>
      <p><cite>It is for you to say of course, but I find it a little hard to believe that you are willing to spend a year on a project reviving a typeface and are indifferent to whether anyone will use it.</cite><br>
      You'll have to trust me on this one. But I'll use it myself it at the fine press I expect to start within a few years. The brief is primarily to recreate a set of letterforms at original weight, and secondarily to make a book type, for digital and photopolymer printing on rag and esparto stock, in optically adjusted sizes.</p>
