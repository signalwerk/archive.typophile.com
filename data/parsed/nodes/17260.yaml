      <p>Although human interpretation is indeed unavoidable, wanting to tame it is a great and often useful act of humility - very Craft, as opposed to Art. As a result, even though you never -or at least very rarely- want to slavishly trace, good Method (like your technique, and Raph's) is central. Anybody who tells you otherwise simply wants to feel more... relevant than one could ever really be.</p>
      <p>&gt; A flat two-dimensional photo-reproduction can<br>
      &gt; never convey the bite of letterpress into paper</p>
      <p>The two are unrelated. This fact hits home especially when you consider<br>
      that digital fonts can be printed lettepress too! In the end, averaging is<br>
      not necessarily soft.</p>
      <p>&gt; he would have designed them differently. More like Bodoni.</p>
      <p>I personally can't see Aldus/Griffo going for that junk at all.<br>
      And it's quite untenable to claim to read another designer's<br>
      mind, especially when he's so dead.</p>
      <p>&gt; contextual alternates in an OpenType font</p>
      <p>That cannot substitute for true irregularity, it can only be a caricature of it.<br>
      Remember again the words of Von Neumann. The only way to really emulate<br>
      the original is through letterpress (although not necessarily metal type).</p>
      <p>&gt; Those who keep the faith are still printing letterpress — fundamentalists. </p>
      <p>This is untrue. I print letterpress (again, not<br>
      necessarily from metal) because there's really<br>
      something there to revive. Although I don't<br>
      know exactly what it is yet.</p>
      <p>&gt; What you are planning is a convincing deception. </p>
      <p>Like using OpenType to mimic true variance...</p>
      <p>&gt; There are two approaches to “redoing Griffo’s last roman”</p>
      <p>1) There are always more ways.<br>
      2) Everything exists not in any pure state, but within extremes.</p>
      <p>--</p>
      <p>George, I'm certainly not a fan of revivals, especially not literal ones. But when I see somebody applying good craft -as opposed to merely his emotions coupled to a loupe*- to an effort, I dearly want to buttress that against discouragement.</p>
      <p>* And why the loupe, really?  :-/</p>
      <p>hhp</p>
