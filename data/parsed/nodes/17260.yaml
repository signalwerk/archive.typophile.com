      <p>Hi Nick,<br>
      Thanks again. Looking with a magnifying glass would allow access, as you imply, to information that scans cannot provide - the shape of the metal's indentation into paper, as opposed to ink absorption. Unfortunately there is no way to measure these indentations accurately enough to inform, except in very general terms (like "ink tends to overextend indentation at this point on that letter"), the positioning of digital outlines, once one accepts the aspiration to preserve intentions on Griffo's part of which one is not aware. As Hrant says of Baskerville, Griffo's intentions will have altered during his work - that's consciousness for you - making any theory of his intent reductive.</p>
      <p>I accept that I would learn more about type design from your method than from mine (in whatever its final form is) but that's not the primary goal here. My final result should be something that I can learn from - and if I've done my work properly then its interpretation should be interpretation of Griffo's letter design, and so should remain arguable.</p>
      <p>A further note on "bite": the swerves in direction of interior and exterior outlines will in my version be much more similar to those of the punches than in most instances from the original 3D page; since a good deal of bite comes from these outlines working against one another, as they do in Griffo's but not in, say, Garamond's work, some of the bite that comes from the 3D impression will be made up for naturally (though I wouldn't begin to pretend that it's a tradeoff any sensible typographer would welcome). </p>
      <p>I'm very interested in your outline filtering - how did you do it? It'd be best to apply it to the PDF rather than the beziers, of course.</p>
      <p>As for a trial of averaging from known punches, one would have to ensure that the process of printing was very similar to Aldus' for the results to be useful. That means matrix engraving, type cast from historical alloy, repeated impression at slightly varying angles and depths onto uneven rag paper, a small amount of ink of totally different consistency and composition to the modern stuff... Hard, as well as time-consuming and expensive, but not quite impossible: I think that we (not I!) know a surprising amount about Aldus' methods. I agree that it would be worthwhile. Let me ponder - but probably No, and certainly Not yet. Good doctorate though!</p>
    html_clean: |-
      <p>Hi Nick,<br>
      Thanks again. Looking with a magnifying glass would allow access, as you imply, to information that scans cannot provide - the shape of the metal's indentation into paper, as opposed to ink absorption. Unfortunately there is no way to measure these indentations accurately enough to inform, except in very general terms (like "ink tends to overextend indentation at this point on that letter"), the positioning of digital outlines, once one accepts the aspiration to preserve intentions on Griffo's part of which one is not aware. As Hrant says of Baskerville, Griffo's intentions will have altered during his work - that's consciousness for you - making any theory of his intent reductive.</p>
      <p>I accept that I would learn more about type design from your method than from mine (in whatever its final form is) but that's not the primary goal here. My final result should be something that I can learn from - and if I've done my work properly then its interpretation should be interpretation of Griffo's letter design, and so should remain arguable.</p>
      <p>A further note on "bite": the swerves in direction of interior and exterior outlines will in my version be much more similar to those of the punches than in most instances from the original 3D page; since a good deal of bite comes from these outlines working against one another, as they do in Griffo's but not in, say, Garamond's work, some of the bite that comes from the 3D impression will be made up for naturally (though I wouldn't begin to pretend that it's a tradeoff any sensible typographer would welcome). </p>
      <p>I'm very interested in your outline filtering - how did you do it? It'd be best to apply it to the PDF rather than the beziers, of course.</p>
