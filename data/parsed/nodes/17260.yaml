      <p>I didn’t know you were interested in microproperties - I thought you trusted more to the role-architectural. Griffo’s romans may fairly be called transitional between Jenson, whose matrices Aldus acquired by marriage, but chose not to use, and de Colines etc. Griffo’s Lascaris roman, his ’prentice work, is a typical sub-Jenson Venetian. But with the 1499 caps Griffo is zipping off in a direction in which no one would follow him. Digital Poliphilus is just about accurate enough to see what he was doing, though, in approximately descending order of fakery, YRXJKZMNSQP are inaccurate (every single one of the changes seems to me a clear worsening). The widths are completely reset without much reference to either monumental or Venetian norms, and the cleverest seriffing I’ve ever seen is applied to bring the counters into readable relations with one another: this is the only alphabet of caps I’d want to read a book in. Such capriciousness is systematic. In the roman lowercase in its “completed”, coherent state of 1499, I think serif capriciousness is more Jensonian, partly matching sidebearings (as in Goudy Lanston), and partly, along with variation of axis and vertical alignment, there for divergence’s sake. I’ll have a clearer idea of this when my Scriptores leaf arrives in a few days. I have no doubt at all, from the relatively low-res Hypnerotomachia scans I’ve studied, that Griffo was systematic about axis variation between similarly shaped letters.</p>
      <p>But with Griffo’s “norm-violations” we need to distinguish between different norms - modal Venetian forms, modal Venetian capriciousness (substantial), modal MS forms (very varied and influenced by fashions - there was no “humanist roman” style, they even had a wave of vertical-axis, geometric-bowl work which Hrant might call Modernist), and modal MS capriciousness (which could be low but which was obviously potentially very substantial). The clear departures from all the preceding Venetians and MSs in Griffo’s mature work are narrowness, variety of axis, perhaps rotation of the counter, modification of serifs on open counters (with counter understood as any white space within the rectangle of the letterform), and small-eyed lowercase g. Griffo’s capriciousness is not in itself norm-violation since everyone was doing it. The flat bar on e is not a violation of MS practice, though it is one of type-design practice. Making italics at all is obviously a violation of type norms, but not of MS norms. Likewise with a small but important feature of Griffo’s work: stems are more equal in width from top to bottom than, following lapidary examples, type designers of sufficient skill tended to make them (Jenson, Centaur and Requiem are all waisted in this way). So:<br>
      <cite>Are you hoping your averaging mechanism will converge on a definable or characteristic set of holotypic (Bringhurst’s term) microproperties applied across the glyph set?</cite><br>
      Yes.</p>
