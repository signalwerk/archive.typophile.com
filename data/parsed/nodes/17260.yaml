      <p>This is very interesting and useful: thanks. And the effect will of course be caught in the average image too. </p>
      <p>But one of the things about most incunable printing as opposed to even, say, de Colines’ stuff, is that inkpress is so substantial and erratic that even counters typically have rounded outlines, rather than just being formed by the intersection of black strokes, and I think this is a very good thing: it makes the counters as robust as rubber pillows, with their own independent shapeliness. Two printers who were too good technically for this to be so much the case are Jenson, of whom I think you have most experience, and, most obviously, Ratdolt.</p>
      <p>How I hate the Minion e.</p>
