    html: '<p>As you say, John, the degree of mess varies: in the 1499 Scriptores Astronomici Veteres, which I expect will be my roman source, inkpress is less noisy than in most pages from a Hypnerotomachia, and much less noisy, simply because of font size, than in a page of Aldine italic. Meanwhile the Soncino italic, though approximately the same size as its predecessor, received better treatment than the Aldine: <a href="http://www.library.upenn.edu/exhibits/rbm/petrarch/petrarch_23-01.html/" rel="nofollow">UPenn page</a>. So in neither of my sources will there be the sheer randomness of the Aldine italic, such that using alternative glyphs to represent the same punch might look like affectation, if only because of the obvious artificiality of the simulation. On the other hand some Beowulf-style postscript coding to provide a letterpress filter would be valuable - as it would be, in carefully regulated doses, for almost any text face. Minute variation is good for orientation on a page, and the sense that the reader is making progress through the word-stream.</p>'
