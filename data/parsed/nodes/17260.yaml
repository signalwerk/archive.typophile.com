      <p>How can it be determined whether character specimens are from the same mould?</p>
      <p>1. Statistically, by analysis of a large sample.<br>
      2. By eye</p>
      <p>In averaging, how do you allow for the fact that fragile features are more likely to be damaged? If you want to produce a full-featured, good-looking final result, surely you would have to exclude damaged specimens from your sample selection, on a “by eye” subjective basis?</p>
      <p>***</p>
      <p>Should there be a constraint that specimens are always culled from the centre of a page, to  minimize prining distortions?</p>
