      <li>[Vincenzo Fagiuoli] · Allocutio, nov. 1957</li>
      <li>Hugh Macdiarmid, The Kind of Poetry I Want, sep. 1961</li>
      <li>Rudolf Hagelstange · Venezianisches credo, sep. 1965 (Griffo «primo stato», original cut)</li>
      <li>Il principe di Niccolò Machiavelli, may. 1967 (Griffo 14 regular uppercase)</li>
      <li>Petri Bembi De Aetna Liber &amp; Pietro Bembo · Dell’Etna, aug. 1969</li>
      <li>Petri Bembi De Aetna Liber &amp; Pietro Bembo · On Etna, sep. 1969</li>
      <li>Lo alphabeto delli villani, sep. 1969</li>
      <li>Petri Bembi De Aetna Liber &amp; Pietro Bembo · Der Aetna, mar. 1970</li>
      <li>ΔΕΛΦΙΚΑ ΓΡΑΜΜΑΤΑ, Sentenze dei sette sapienti greci, feb. 1976</li>
      <li>ΔΕΛΦΙΚΑ ΓΡΑΜΜΑΤΑ, The Sayings of the Seven Sages of Greece, apr. 1976</li>
      </ul>
      <p>I wouldn’t say he hardly used it, but it sure is true that he never had Malin cut a body smaller than 14pt and that by a quick survey of the Officina Bodoni’s later work he tended to favour smaller bodies to set text, like 11pt and 12pt. For these, he had already the Dante type at his disposal, which makes me wonder whether he didn’t feel like Griffo was suitable to be reduced any further.</p>
      <p>Initially the Griffo type was indeed meant to be a Bembo recut (the idea was of Stanley Morison but Mardersteig wrote he wasn’t particularly looking forward to confront himself with a type already very successful at that time as Bembo), but then he began studying more closely an original <cite>De Aetna</cite> and came to the conclusion that he could indeed get much more close to the original.</p>
      <p>He then asked Malin, of whom he had been an admirer for a long time, to cut for him this new Griffo type. Malin moved to Mardersteig’s house for three months to do the job, and they would critique together his rough cuts every night. The Griffo type is indeed very different from Bembo; for one, it includes several alternate characters that were there in the original but had been removed from the Bembo cut. Mardersteig, Morison and Malin initially thought <cite>De Aetna</cite> was some sort of specimen of types by Griffo, but later on Mardersteig came to the conclusion that Griffo cut these alternates (as many as five of them for the <em>e</em> glyph alone) to try to imitate the works of calligraphers.</p>
      <p>Malin and Mardersteig didn’t cut every single one of the alternate glyphs by Francesco Griffo, though, prefering to choose the base glyphs that looked best to them and some swash alternates as a complement. They also tried to choose the ones more different from Bembo, and that should explain the difference in how the capitals look.</p>
