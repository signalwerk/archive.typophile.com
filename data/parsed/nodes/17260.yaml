    html: <p>Thanks Peter. In the French old styles of the second quarter of the sixteenth century ductus is filtered through a static set of conventions, which reduced the real range of thicknesses given by the pen at different angles to a set optical thick and a set optical thin, modulated between on curves, and made serifs lachrymal or bracketted instead of the (slightly) more pen-formed straight or concave slabs of the Venetians. That is the punch-cutter’s feaure-manipulation in its most normal form. Griffo’s transformation of ductus is, by contrast, not regularising but actively divergent; his motivation for departure seems to have been quite opposite to his imitators’. (That said, in his italics he had to be more circumspect, because the whole point of that venture was to pretend to imitate the natural style of writing for oneself or a friend. Thus Q was given back its normal axis rather than the counter-clockwise rotation it had in 1499, though it seems that subtler things were going on in interior axes).</p>
