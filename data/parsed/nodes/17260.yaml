      <p>George, let be a little more clear on the danger of aiming at a ’faithful’ or authentic revival. </p>
      <p>First, you have yourself said you are not going to do this fully, in the sense that you are not trying to revive the look of the aldine page, with all of its variations. So what you are in fact doing, despite protestations of striving for authenticity, is trying to revive features of the typeface that you regard as good or desirable ones. And, as David Berlow pointed out, using a computer does not remove your personal choices as you are telling the computer what to do—to average in a certain way, rather than to pick out the 10 most common shapes of a given glyph, for example.</p>
      <p>Like you, I do think that there is much worth reviving in old typefaces. But my point is that reviving the worthwhile is a process of hypothesis testing. You can identify a feature, and then draw it in various ways, and see if it is actually responsible for what you liked in the typeface. It may be, or it may not be. Once you are aware that you are engaged in a creative process of guess work and trial and error to get the effect you admired in the original, then you free your imagination and intellect to create a lot of hypotheses, and test them. If your goal is ’authenticity’, you can easily limit your hypothesizing, thinking that one tool, whether it is scanning or averaging or something else give you the ’authentic’ result.  </p>
      <p>You are already engaged in that creative hypothesizing, of course, so my urging is just to not let the goal of ’faithfulness’ limit yourself to your first hypotheses, or one method—averaging or whatever—to such a revival. Such methods are valuable tools, but in the end your creative ideas about what is good in the typeface and your testing of your ideas will make your effort fruitful.  </p>
      <p>Incidentally, in another thread you I think rather underestimate the power of graphic design compared to type design. The look of a page is as much or more influenced by layout as by the typeface. So the way the Aldine page was laid out—the size of type, the leading, the measure etc. may well be a part of the impression you admire. Especially as Peter Brunhill found it worth the effort to figure out the system of proportions Aldus was using, it is likely this is in fact important. </p>
      <p>Also, size matters. Some of the much admired old text samples—including yours?—are at rather large size. You cannot scale these down and get the same visual feel. So if you are aiming at a typeface family that can actually be used in a practical way—or in gaining knowledge that you or others can use for such a purpose—you will be faced with scaling issues.</p>
