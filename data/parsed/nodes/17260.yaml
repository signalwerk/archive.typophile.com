      <p>"I didn’t know you were interested in microproperties [...]</p>
      <p>See the "start" of my <em>Typo#13</em> essay: "Like the structure of deep space or the oracle at Delphi, a grounded understanding of perceptual processing in reading, and a tabulation of the perceptual processing impact of manipulating typeform microvariables, are maddeningly elusive and the literatures surrounding them are, when it comes to perceptual (or cognitive) processing in reading, an ever expanding <em>mer à boire</em> [ sea to drink ], an <em>in errorem variarum ambage viarum</em> [ conflicting maze of wandering paths ], but, when it comes to tabulating impacts of manipulating of typeform microvariables, virtually non-existent.</p>
      <p>The question I ask is: where, relative to receptive-field behaviour in the visual cortex, is the inflection-point between 'optical grammatical' and 'gestural atmospheric' matters, when it comes to tabulating the perceptual processing impact of typeform microvariables.</p>
      <p><em>Emigre</em> talked in the 1990s of type designers of that time as having a collective sense being 'primitives of the new era.' Griffo and his contemporaries and predecessors were the primitives of the metal era. I have often felt that cutting punches changes one's relation to the letterform, from a ductal routine empahasis to a situation where form-analytic featural evaluation begins to play a direct role in the very process of cutting. So there arises a tension between 'chiro-referentiality' or 'chiro-paraphraxis' and form-analytic based feature manipulation. This might be what you mean in talking about 'typographic' properties. This much I grant Hrant: feature manipulation based on form-analytic feature evaluation beyond strict chiro(para)phrastic contrast manipulation has a positive role to play. </p>
      <p>But it seems to me that it is the relation of these two countervailing pressures that is being sorted out in this cricible where you are mucking about. At least for the metal era.</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
