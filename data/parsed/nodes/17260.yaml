      <p>I sort of agree. But that third p is very unusual in the length and solidity of its spur, and I think it shows some perhaps unknowable degree of merely random ink-press. We need something to sway us besides aesthetics - Griffo might chosen to make only a little spur. So we turn to the averaged master and see that, as one might anticipate knowing the properties of softish metal, beyond the spur and also to the right of the descender serif there are darker pale-greys - ie more than background-random cases of ink impression in these regions, implying that yes, these projections have been blunted and should be restored, according to judgement. On the other hand if one chose to believe that the splurge on the bottom of the second p of the four was a ravishing example of Griffo's real intent, lost in too many instances by blunting, then one could check this aesthetic choice against the average and see that the progression from darkest to lightest is much quicker moving vertically down from the serif than to the right of it, so that the descender of the second p is simply botchy. </p>
      <p>Almost all the impressions are visibly poor in some part or other, and when errors coincide it can be hard to see them as such - in other words two 'p's can both look convincingly perfect but be wholly unlike. Thus in selecting good material one must be careful not to exclude too much, though in moderation I'm sure it's sensible, and I have done so in previous runs of the software.</p>
