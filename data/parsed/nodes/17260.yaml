      <p>Yup, Bill: after 100 comments’ worth of protests about fidelity, I’ve accepted the need for a more subjective filtering process between the software’s output and the published output. In designing for text-size vision one’s outlines should be stark because the schematising process helps one isolate the good and nail it; and schematic outlines will also be easier to interpolate between for optical sizes. But Raph has produced the first thoroughly Griffine bit of typography since the 1520s, and it does the heart good to see it.</p>
