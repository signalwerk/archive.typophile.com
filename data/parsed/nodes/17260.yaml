      <p>Hi George!</p>
      <p>I have seen your posting today for I was in holidays.<br>
      Actually I do not know much about how often and where Giovanni Mardersteig used this type.<br>
      Yet, it was not a Bembo recut (at least if you didn’t refer to the book of „Bembo“ that gave the name of Monotypes recut of Griffo). Actually Bembo was cut later as far as I know under the direction of Morrison and he himself admitted that it was inferior to Malins cut. I don’t like Monotypes Bembo because its so stiffy. Serifs like knifes it lacks softness, but thats another story.<br>
      What comes to Mardersteig family, Martino Mardersteig (for who I worked) is quite closed (I am missing the right word;-) about all the creations made for the Officina Bodoni. Castiglioni and Jane Patterson, as far as I know, offered him to make a digital redesign of Griffo years ago but Mardersteig categorically refused when I was there. (Broke my heart to leave Verona;-)</p>
      <p>Looking to hear from you<br>
      Stefan</p>
