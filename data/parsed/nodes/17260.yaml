      <p>Peter, thank you very much for giving fresh form to the discussion about rhythm, and saving Hrant and I from going around in circles again.</p>
      <p><em>It seems to me that Hrant’s misgivings about rhythm have to do with the fact that in visual wordform resolution role-architectural subcomponents of a bounded map are not processed sequentially but parallelistically, and sequential processing associations are hard to supress, because of how we learn about rhythm.</em></p>
      <p>Yes, but supress them we must if we want to talk meaningfully about 'rhythmn in optical-grammatical contexts'. This is why in the various threads that touch on this subject I have insisted on the all-at-onceness of perception of visual rhythm, stressing that it is not sequential. It seems to me that simply surrendering to associations of rhythm with sequence or flow is to accept a kind of phenomenological blindness. It impoverishes both discourse and experience, not only in understanding of typography and reading, but in a broad range of visual experience.</p>
      <p>Everything you need to know about the non-sequential nature of visual rhythm is embodied in <a href="http://www.ibiblio.org/wm/paint/auth/mondrian/broadway.jpg" rel="nofollow">this painting</a>, and by the same token this painting cannot be understood without suppressing 'sequential processing associations' of the word rhythm even though, brilliantly, the painting alludes to several different kinds of sequential rhythm: jazz music, traffic, street noise.</p>
