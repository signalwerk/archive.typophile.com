      <p>George: I never particularly analysed how Bembo looked in Italian vs. any other language but it sure is something to keep under consideration. The main issue with Bembo to me is that who did the redrawing chose very nervous versions of the glyph variants, whereas Mardersteig and Malin tried something more organic. </p>
      <p>I should note that I can’t claim any authority over any of this, it’s just what my untrained eyes tell me: some glyphs look really odd in Bembo, like a (curve at the top of the counter, uneven shape at the top), e (continuing stroke at the bottom of the counter), g (unbalanced link stroke, odd, sudden turn in closing of the loop, r (slightly swhashy arm), f (very long, leaning-to the right main stroke at the top), s (looks a straightened up version of the original, slightly leaning to the right s). </p>
      <p>Other glyphs seem a bit too wide, as well: consider f, j, p, o, c. It may well be that these are feature that help increase legibility, improvements made by the savvy Monotype designers, but when I look at Mardersteig and Malin’s Griffo I can’t help but notice that these are exactly the features they got rid of in their interpretation (compare Griffo’s r, a, f, e, s with Bembo). </p>
      <p>That doesn’t mean Bembo is not a successful typeface in its own right, or that there’s a race to get closer to the original source that somehow Monotype lost against Malin and Mardersteig, it’s just a different interpretation; I tend to lean towards Griffo, myself, but that doesn’t mean there isn’t room for more interpretations of the De Aetna type. If I remember correctly, James Clough teaches a type design class where he gets student to redraw the De Aetna type over and over again, and has been advocating getting intimate with these letterforms for a while now.</p>
