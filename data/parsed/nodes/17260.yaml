      <p>“The enormous consistency in quirks of modelling between 1501 and 1503 - in for instance h, d, a, p and e - suggests that this odd logic is firstly chiro-referential rather than chirographic, and secondly pretty much what Griffo wanted to make [...] and the rotation of counters [...] seems a clear leitmotif.</p>
      <p>I have to say, George, that I find the prospect of an ’odd logic’ endlessly appealling, especially because it allows us to specify in what incremental ways type pulls away from scribal and chancery writing. I would love to see the odd logic nailed down in an exhaustive list of ’quirk notes’ (Douglas Hofstadter) itemizing ’norm violations’ (Hofstadter again) to the ductal logic referenced in how the ’roles’ (and again) are handled.</p>
      <p>And besides a reanactment that is ’phenotypically’ honest (such as you and Raph seem to be teasing out, I’d love to see a Horton face that is new but ’genotypically’ faithful.</p>
