      <p>Christian Schwartz’s <a href="http://typographi.com/art/articles/houston/houston.pdf">PDF on his Houston typeface</a> shows a newspaper ink gain vs digital outlines. Here the spread is clearly a significant ’stroke’ around the outline, much more significant than the slight halo in Randy’s scans of offset page printing that are linked to. </p>
      <p>&gt;What is behind this?</p>
      <p>I an pretty sure that the type designers in the era of coarse ink and big ink spead took ink spread into account. It is significant at the scale at which they were working, so there is every reason to think they would take it into account.</p>
