      <p>Thanks David; to clarify, the method you quote is not the one I have or will adopt, but my translation of Peter’s thinking on revival into a practical process. As it happened, Peter rightly thought that this process didn’t take into account the feature- rather than ductus-based thinking which presumably goes into punchcutting, and I responded that no method could be formulated which could do so.</p>
      <p>But more importantly your “typographic dictionary of errors” sounds fascinating and very important to my project. Could you tell me more, do you think? I’d be perfectly happy to increase the limited pre-averaging selection I’ve already done to take out the scat. On the other hand, averaging of the scatless forms will stay. There is almost certainly no single “right” printed letter (and even if there were one couldn’t know which it was) because, as I’ve said, the extent of variation is, in the technical sense, normally distributed: it follows a bell curve, such that zero or minimal variation is actually much, much rarer than substantial variation. When drawing a monochrome glyph based on the soft and lovely averaged form, my mind, for all my protests, will have plenty of use.</p>
