      <p>Here’s an additional note on my choice of italic for revival. For a long time I wanted to get at the finest prize of all: Griffo’s third italic, made for his own use as a printer at Bologna. Imagine it: finally, in 1516, the greatest genius type design has ever produced* is free from all constraint. He can make the letters he wants, and print them how he wants them. He would die almost immediately, but first produced at least two editions, a Boccaccio and Bembo’s Gli Asolani - the latter appropriately, since Griffo may well have known Bembo personally from the time when the future cardinal was taking a keen interest in the production of De Aetna, for which Griffo cut his first mature alphabet. </p>
      <p>I finally tracked down that third italic. The reproduction’s ghastly, but what a disappointment! It looks like a Tony Stan ITC Aldine! Having said that, it should have been very readable with that astonishing x-height to line-increment ratio, and it’s unmistakably Griffo in, amongst many other things, the low-slung lowercase a, a readability master-stroke that appears in all his italics.<br>
      </p><div class="imageWrap"><img src="/files/GI3.JPG"></div><br>
      *That’s been said of lots of people, but if it’s been said of Bodoni, then I can say it of anyone.<p></p>
