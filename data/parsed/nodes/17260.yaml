      <p>HRANT</p>
      <p>“Basically I guess I don’t think anybody (short of a medium :-) is capable of subverting his own preconceptions to allow what was in the mind of another person to surface - especially not centuries apart.”</p>
      <p>I hate to agree with Hrant on anything. Far too often this happens.</p>
      <p>HINT; Was the punchcutter left handed? Did he/she cut counter punches?</p>
      <p>HINT; Find earliest specimens of use, and/or first pages of book. This may or may not be useful. Type wears out. But beware, different hands may set different pages, different hands my have pulled impressions for different pages. It can become even more complex, easily.</p>
      <p>I do not lean towards averaging. I look to see what I see, and feel what I feel. That is when, “pure source”is not available.</p>
      <p>I would not pressume to improve, merely to find.</p>
      <p>That said, any result will not meet “every ones” criteria. Unless “we all” are merely “averaging”. But I don’t think all of us are.</p>
      <p>Giampa</p>
