      i.e. find” the “right” letter with your mind (ooh). It is especially effective to do it this way, because, any program trying to make decisions on these kinds of letterforms, from this period, without the Error list of type, and without intelligent error thinking, like you have, on an intra-letter basis, will...I dunno, Not make an alphabet?</p>
