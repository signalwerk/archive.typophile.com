    html: <p>If your aim is to capture something of he 'mess of an Aldine page', then I think Nick's suggestion of making multiple versions of each letter and using contextual substitution to vary their use makes a lot of sense. I think the peculiar sensation that I sometimes get when looking at a page of Aldine italic type comes from the tension of variation constrained by the typographic identity of each sort. The italic text seems to hover somewhere between the chirographic and the typographic, in way that the roman doesn't and which later improvements in printing technology gradually diminished and erased.</p>
