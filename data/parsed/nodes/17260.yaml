      <p>John, thanks for your comments. The averaging method does take into account the relative lightness and darkness of parts of the image. Thresholding was done only at the end, to give a potentially traceable outline; but, following Raph, I have abandoned it even there. I think you and Nick might underestimate the variation of these printed characters, and so not see that one cannot, as Nick has it, "Look at the original specimen(s)" and see any outline to draw at all. The averaged p, the fourth in my initial post, contains more useful information than any single original character image (eg concerning damage to the spur), and is a more trusty basis for interpretation than any selected subset of printed originals. Here are four; and they're by no means unrepresentatively varied.</p><div class="imageWrap"><img src="http://typophile.com/files/variation.PNG"></div><p></p>
