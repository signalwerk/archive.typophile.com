      <p>Peter, I think the strategy you're talking about is the most attractive kind of reductionism I can think of. Are you recommending in practical terms that I get to the punch outline if possible, and if not that I take an outline derived with consideration for inkpress in corners and blunting at spurs from an averaged image like the one two posts up, write a fixed-front ductus over it, see where the ductus doesn't match and how the metal departs from it, assess the consistency of those modifications, and of second-order variation in manipulation (going on potentially ad infinitum but really it wouldn't be, not with humans), and then redraw the font appropriately, making further alterations until the result is intuitively satisfying and perceptually authentic?</p>
      <p>It might help if I say that, though the primary purpose of this project is merely scholarly, a secondary purpose is in the production of fine digital books. I will Multiple Master for optical size, probably from 10 to 15 point, the maximum range for which I suspect MM is going to work effectively and manageably. Titling and photopolymer/matrix engraving versions might eventually follow, as might a set of sans titling caps (the 1499 caps would make an absolutely gorgeous <cite>very</cite> lightly modelled sans).</p>
