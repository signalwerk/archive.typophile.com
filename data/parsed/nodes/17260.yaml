      <p><em>I dearly want to buttress that against discouragement. :-/</em></p>
      <p>I wasn't critical of the project, only that expression of piety which was the mission statement.</p>
      <p><em>And why the loupe...? </em></p>
      <p>(A magnifying glass actually, which may be used with two eyes) </p>
      <p>For the same reason one would draw from life, rather than a photograph.<br>
      It was in answer to the question "would another method be superior?"<br>
      The context was about being faithful.<br>
      If one is attempting to make a two dimensional version of a three dimensional artefact, why not work directly from the three-dimensional impression?<br>
      It seems to me that the more intermediate elements that are removed, the more opportunity for the process to be faithful to the intentions of the original type designer.</p>
      <p><em>...as opposed to merely his emotions coupled to a loupe*</em></p>
      <p>Why do you consider the more direct approach, without tracing over a simulacrum, more emotional?<br>
      I would say the opposite is true. The conscious effort required to work from life is more difficult than working from a tracing; one becomes immediately aware of how incorrect one's initial, spontaneous drawing is, and works to modify that, in order to get one's glyphs to look right. So the repetititve process of drawing, comparing, and redrawing is one of suppressing emotion. It gives a better understanding of the original, of why the forms were made the way they were, and of one's preconceptions. This enables one to better address the grey areas that are open to interpretation (caused by loss of resolution between metal and impression, and variablitity of impression). It's here that interpretation is unavoidable, and the draughtsman's personality may be expressed decisively, because he has acquired a knowledge of the original designer's intentions by going through a similar working process of trying to get all the design elements to come together as a balanced whole.</p>
