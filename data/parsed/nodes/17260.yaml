      <p><em>...attempts to paraphrase this texture </em><br>
      <em>...faithful revival </em></p>
      <p>George, I'm not critical of your project per se (technique), only of your mission statement, and the word "faithful" in particular (philosophy). </p>
      <p>Those who keep the faith are still printing letterpress -- fundamentalists. What you are planning is a convincing deception. Nothing wrong with that, as it one of the destinies of new technology to perpetuate the virtues of the old, and mimicry is the sincerest form of respect. But the idea that new tools remove the element of interpretation is mistaken.</p>
      <p><em>...it can’t really mean the copying of selected printed letter-forms.</em></p>
      <p>It's a pity Justin Howes isn't around to explain his method. Copying in this instance is not like duplicating a digital file. He was digitizing an analogue 3D image, for offset reproduction, which requires not just selection, but interpretation. For instance, every digitiser has to decide "how long to make the coastline of Britain" -- and you too are doing that by picking a certain number of specimens to average. The more you choose, the shorter the coastline.</p>
      <p>I just had a look at "The Well Made Book", Updike essays, published by Mark Batty, which is set in Founder's Caslon. Read for content, nice. Looked at for typography, one thing that stikes me is the bounce, i.e. the deviation from baseline. Howes has incorporated this quality --- I first noticed that the "o" rides high. That's not mere copying, it's a design specification. En masse, it adds to the personality of the page, but damn my typographic reading, (which must come into play when passages are re-read, certainly in a book for typophiles!), I'm thinking, "why is the 'o' always up? -- contextual alternates could fix that".</p>
      <p>It's all about the mise-en-page.</p>
      <p>There are two approaches to "redoing Griffo's last roman", engineering or design. The engineer would perhaps provide a tool that gives the font-user sliders to control simulations of:<br>
      - alternate character shape (corresponding to variable wear and sorts from different punches)<br>
      - paper texture<br>
      - ink spread<br>
      - bounce</p>
      <p>The designer would work from an exemplary specimen (or edit several), choosing specifics for the above variables.</p>
