    html: <p>Yup, absolutely. And for the same reason - that a revival of something is not the same thing as the original - I think it's false modesty to name a revival directly after the original's punchcutter or printer, as Morison did with his infamous "recutting"s; this will either be called Horton's Griffo or something more vaguely suitable, like Astrophel - correctly reminiscent of Poliphilus, but pointing at a different book, the Scriptores Astronomici Veteres; and alluding more plainly to another Englishman's appropriation of the Italian Renaissance, Sidney's Astrophel and Stella, which was modelled on Petrach's Opere Volgari, for the printing of which Griffo made the italic I'll be using.</p>
