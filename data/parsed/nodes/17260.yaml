      <p><cite>What I see in the averaged output are hints of a ductal logic which however never becomes fully manifest. That roman seems much more tractable in that regard</cite><br>
      The enormous consistency in quirks of modelling between 1501 and 1503 - in for instance h, d, a, p and e - suggests that this odd logic is firstly chiro-referential rather than chirographic, and secondly pretty much what Griffo wanted to make. With a better way of getting at interior angles, he might have done things differently, but as you say the soft counters have benign effects that one wouldn’t want to put past his conscious understanding, and the rotation of counters - Legato in reverse - seems a clear leitmotif. The large roman is more nearly straightforward in its ductile logic because, I suspect, of its size: that’s what one would expect with ideal optical scaling, given the attachment among bibliophiles in 1500 to chirography.</p>
