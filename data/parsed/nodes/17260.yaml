      <p>&gt;&gt; The problem with this is that the variation<br>
      &gt;&gt; can’t come from the type anyway.</p>
      <p>&gt; I’m not actually convinced of that.</p>
      <p>OK, let's think about this a little bit more deeply and with open minds.</p>
      <p>If you want to make offset output that comes as close as possible to this particular source (ignoring for the sake of argument the factor of impression depth*) you would have to incorporate the irregularity into the letterforms/type. The ways I can think of doing this are: 1) Have a base glyph stucture and apply pseudo-random irregularity to it (render-time), in a way that mimics the original. This is not possible in current generally available font technology. 2) Choose a finite number of instances of the source glyphs and deploy them pseudo-randomly. This is doable with OpenType. 3) Create a finite number of variants pseudo-randomly (as in #1) and deploy those pseudo-randomly using OT.</p>
      <p>* Which however you've said -rightly- is an integral part of the way Aldine typography looks/feels.</p>
      <p>Well, #1 and #3 require averaging. And #3 has the advantage over #2 that it removes a selection process that cannot be informed by the true intentions of the original designer. Basically, #2 is the furthest from replicating the original.</p>
      <p>The thing is, impression depth is very important here. If you want to get <cite>really</cite> close to the original, letterpress variance takes care of the irregularity inherently and "naturally". At which point the type doesn't need to exhbit irregularity (which is a good thing, because technically it can't) and that makes averaging useful here as well.</p>
      <p>Multiple glyphs per character in the original:<br>
      That's different than irregularity. It's certainly useful to be able to group various instances of a letter as different original designs, but here again there's no reason to introduce the reviver's preconceptions (in a literal revival). What you would do instead is algorithmically decide on an instance-by-instance basis which variant of a character an instance is, and then average them separately. You might do this by determining thresholds within which an instance is a certain glyph and outside which it's another; and these thresholds might be determined by some iteration with models for which perhaps we do know the "punch history". Yes, it's error prone, but at least it's a "neutral" error, one that becomes absorbed if you process enough specimens (unlike personal interpretation, which just gets amplified).</p>
      <p>&gt; Yes, this requires a judgement call, but I don’t<br>
      &gt; think it is arbitrary: it is reasonable.</p>
      <p>Maybe arbitrary was a bad word. My point was that -no matter how<br>
      good or bad the punchcutter was- there's no safe assumption about<br>
      what he intended - not in a literal revival.</p>
      <p>One could say that a literal revival cannot benefit<br>
      from intent; instead it spawns directly from matter.</p>
      <p>&gt; it is often easy to tell what are the prestige publications<br>
      &gt; of a particular printer, those that have been printed with<br>
      &gt; more care and attention, and these will provide a better<br>
      &gt; quality of specimen than cheaper editions produced with<br>
      &gt; less care.</p>
      <p>But the punchcutter is almost never the printer,<br>
      so you can't know if he agreed with the results,<br>
      or he intended them (assuming he even cared to get<br>
      involved in the results, which is not the same thing<br>
      as not having any intent).</p>
      <p>This business of extracting intent really seems<br>
      to make a horde of romantic assumptions that to<br>
      me are counter to the intent of design, at least<br>
      in the case of a literal revival.</p>
      <p>&gt; I think it is too soon in the day to say that it has to be done in one way only.</p>
      <p>Like has been repeated, averaging is a tool. And yes, tools can be used  differently depending on what the desires results are. I think in the case of a literal revival like this one, interpretation should be actively limited (not the same thing as saying it can be completely avoided). And in any case averaging shouldn't be shunned - that's what mainly motivates my own participation in this thread actually.</p>
      <p>&gt; type was being inked using balls, not rollers,<br>
      &gt; and even inking was virtually impossible.</p>
      <p>Not only that, but the necks of the sorts got more ink<br>
      than they do with rollers, and this affects ink gain.</p>
      <p>&gt; I think that must have been someone else</p>
      <p>Well, Typophile's search is really cruddy now, so I can't find it.<br>
      But I wasn't thinking you'd use Google that way yourself anyway.<br>
      I just remember that as your reaction to the idea of doing so.</p>
      <p>hhp</p>
