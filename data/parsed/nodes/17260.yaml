  - id: 106165
    user: 9356
    date: 2006-01-26T10:01:00
    date_raw: 26.Jan.2006 10.01am
    votes: null
    html: "<p>I made, after reading Nick’s and Raph’s first posts, two changes to my position. First, having been undecided, I accepted that autotracing of the averaged form is unhelpful because, in preserving equally emolliating and merely emboldening inkpress, it misprepresents the perceived bite of the original. Second, I accepted that the averaged master image contains information which should be preserved and analysed in making decisions about the drawn glyph - information about likely features of the punch which are misrepresented in most impressions, because cast type degrades in predictable ways. Finally, I was culpably unclear in phrasing my initial post. Avoiding those acts of interpretation which are potentially banalising remains a goal: I dislike the fatalism surrounding interpretation (of which I don’t accuse you): the repetition of truisms like “you’ve got to interpret”, or, with more relativist conviction, that one’s work is “just your interpretation”, because the usually unstated assumption is that all interpretations are alike in the merit of the hypotheses they imply. But this is untrue, doubly so with newly available tools providing new kinds of evidence, but always so with the application of knowledge of the printing process (on which I’d love more detail, or recommendations of books on Aldine or incunable printing). What produces banal results is the kind of thinking that goes: Griffo was presumably a sensible man, and should have been if he wasn’t; and sensible men know that typefaces are best when they’re like <cite>this</cite>, or when they are consistent in <cite>this</cite>. As Justin Howes wrote, “In our own time, the result of redrawing is, unavoidably, type design which edges ever closer to this period’s dominant letter form, Times New Roman”. He tried to resist that with a method which was clearly, as he knew perfectly well, unconvincing in one respect (its variation is frozen), but nonetheless he succeeded better than almost any reviver in providing as fully as possible, given current limitations, what his model had provided to an ealier generation. I’ll take a different path in pursuit of the same ideal. And I shan’t mind if it’s never used at all; I’d be perfectly happy if it were only something for me, and I hope others, to study. As I’ve said, though, a secondary purpose for it is in fine book work, for which sized variants will be provided.</p>"
