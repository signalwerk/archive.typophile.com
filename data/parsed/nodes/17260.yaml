      <p>George asked a very good question: <cite>can you be sure that the “inner outline” visible is not simply the effect of the sharpening?</cite></p>
      <p>I wish I had some kind of definitive test to show that it’s real, but right now what I mostly have to go on is a very strong hunch, developed from studying hundreds of glyph images from a half dozen or so pages. The halo I’m attributing to ink spread varies from page to page, mostly dependent on the paper - it’s quite a bit stronger on coated stocks.</p>
      <p>So the question remains open: what kind of experiment would test the null hypothesis that what I’m seeing is nothing more than a sharpening artifact? A good answer would most certainly be worth an academic paper, in my opinion.</p>
