      <p>Thanks for the new images, George, especially the last which is, as you say, rather beautiful.</p>
      <p>My concern, looking at the variation is as stated much earlier in this thread: it is the variation itself that contributes to the look of the letterpress Aldine page, so averaging the variation to produce single letterforms seems to me not to be a very good way to produce a 'faithful revival' of the type. To a very large extent, what you are averaging is not letterforms per se but printing artifacts affecting letterforms. Consider, for example the scan of the third <em>p</em> from the left in the four examples a few messages back. In this specimen, the spur is very clearly present as a part of the letterform: it is really there in a very clean and structural way. Looking at this occurence of the letter, one knows for certain that this feature  of the letter is Griffo's design. But in other examples, perhaps even the majority of examples, this feature may not be so clear. But lack of clarity does not imply lack of presence and certainly doesn't imply lack of design. It just means that the impression was very often bad or that individual sorts were worn or broken, <em>such that the design cannot be ascertained from those examples.</em> This means that you have to apply judgement about which samples display the design and which obscure the design through printing artifacts. Looking at that beautiful combined image, we can see that what is a clear design element in one example is, through averaging of printing artifacts, made to disappear: the averaged form embodies the lack of clarity.</p>
      <p>To me, this suggests that the averaging methodology has merit relative to the careful selection of input. There needs to be an analytical process to determine which specimens show forth the design, and which are simply poor specimens.</p>
