      <p>John, I would get into a detailed rebuttal of what you wrote,<br>
      but I think the problem is bigger than you, so doing so would<br>
      simply distract from real, broad improvement.</p>
      <p>--</p>
      <p>There's entirely too much personality-conflict-determined discourse on<br>
      Typophile (and, to be fair, most elsewhere). This drains much useful<br>
      energy from high-quality typographic discussion. For example, why do<br>
      I have to be the only person to counter Nick when he makes a claim<br>
      about the spacing of italics that's false in so many ways? Guys, if you<br>
      want me to lay off Nick (although, like I've said, it's not him, it's his<br>
      ideas), or <strong>whoever</strong>, a great way is to get off your finials and do some<br>
      of the countering instead. I think in the past (and on other lists) we've<br>
      had a lot more ego-sidelining passion for objective exploration of type.<br>
      Isn't it a beautiful thing, to strongly counter something you know is<br>
      wrong no matter who happens to have said it? Well, I think it is.</p>
      <p>You're being civil? Civility is one thing, but too many of you guys seem<br>
      to be taking the "if you don't have anything nice to say then don't say<br>
      anything at all" proverb to a whole new level. Except of course when it<br>
      comes to Hrant, but that's OK because he can handle it, because "what<br>
      goes around comes around" or whatnot. Well, the result is just a bunch<br>
      of people yammering away, droning on about what they happen to believe,<br>
      throwing their weight around in an insular sandbox, not really interested<br>
      in changing (neither themselves nor others). This kills theoretical progress,<br>
      cripples cultural relevance, and really does start turning Typophile into<br>
      a cocktail party. Largely useless; and boring as hell.</p>
      <p>People, come on - if you love type, fight for it a bit!</p>
      <p>hhp</p>
