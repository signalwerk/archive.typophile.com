      <p><cite>it can hold/spread ink differently in each dimension</cite><br>
      One of the few things about 15th C printing which makes my life easier is that hand-made paper will <cite>on average</cite> receive ink equally in all directions, because the fibres lie randomly. </p>
      <p>Essentially I agree warmly with Hrant that more input is better than selected input, with the qualification that I would recognise some obvious classes of impressions as plain misprintings, like the initial on verso and final on recto letters of lines. These I have left out. One other class worth excluding is letters the variance of which from the norm built up in the first round of averaging is bizarrely high: I think this probably implies a different punch (only one case from the 2 sides and 61 examples which were picked out to produce the averaged image you've seen). Punch variation is rare and inconsistent in Aldine printing so, contra Mardersteig, I doubt that it was intentional. It'd be hard to justify on any grounds the Lascaris interlopers among the 1499 caps in the Hypnerotomachia, for instance: they're fat lumps compared with the new letters; still more obviously wrong is the appearance of Roman caps among Greek, and vice versa. Punch variation is in any case much easier to spot with software that can quantify variation than by eye; and because the distribution of extent of variation is bell-curve normal there really aren't any samples which could plausibly be considered exemplary. But paper shrink is a problem which might make taking samples only from some arbitrarily limited central region of the page, where shrinking is least, a good thing.</p>
      <p>I have to say that I think Hrant's straw-man method #2, the choice of a finite number of instances of source glyphs, pseudo-randomly deployed, would produce (and is) just embarrassing junk. </p>
      <p>I have Burnhill's book, John; it's main relevance to my project is in making me doubt the propriety of altering vertical proportions (for the original roman, o is 5 units tall, H 7, h 8, y 8, with 1 unit of interlinear space) through MM. Note that o is as usual slightly taller than x, such that one cannot quite accurately say that x-height is five sevenths of cap height. Can these proportions work at 10 point, I wonder? As for deciding by eye what impressions look good: the software numbers show clearly that the eye is no judge, because of the misleading attractiveness of errors in successful combination. </p>
      <p>Peter, once one makes one's reduction of Griffo's extant work to principles of construction sophisticated enough to incorporate "feature-awareness-based" analysis, one is giving oneself too much room for interpretive manoeuvre. The method ceases to be a method at the very moment it becomes justifiable.</p>
