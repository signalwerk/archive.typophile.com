      <p>Gorgeous scans. Yes, send them to <a href="mailto:myfirstname.lastname@gmail.com">myfirstname.lastname@gmail.com</a> if they're less than ten or so megs, otherwise we'll work out some other way to do bulk transfer.</p>
      <p><cite>Is there a way to increase the tolerance of difference?</cite></p>
      <p>Yes, it's the incredibly well-named and clearly documented tscale parameter. 4 is the default, 3 will be more tolerant of differences, 5 picker. I chose 4 to work well with my ATF scans, so it's not surprising that a different source might need different tuning.</p>
      <p>Of course, the whole reason I made the tools work with text files is so they could be hand-edited. Here's a procedure that I find works reasonably well. After the first pass, open the "class" file and search-and-replace the "class123" names to be more descriptive. Then, keep that file open in one window while you open your favorite slideshow-style image viewer in another. Any time you see a misclassified glyph, change it in the class file. Then you can run mkblends.py again and get much cleaner composite images (with descriptive names, to boot).</p>
