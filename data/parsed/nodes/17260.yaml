      <p>I think Nick's proposed test has a lot of value, even though I consider 'veracity' in this context to be a value judgement rather than an objective proof. But that's okay because I'm not expecting a proof result. Nick's test would provide insight into what the averaging methodology produces relative to a known form. This is valuable information, regardless of the conclusion that one draws from it or the relevance it might have to a particular goal. Obviously if your interest is in reproducing the letterpress printed appearance of a typeface, rather than the forms of the type itself, then what Nick's test would show is not directly relevant. On the other hand, if that is your goal, perhaps you should be making a full colour, high res Photofont, which would capture the paler artifacts of the letterforms in the printing.</p>
