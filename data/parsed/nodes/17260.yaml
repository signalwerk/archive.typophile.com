      <p><em>It seems to me -through both this thread and Raph’s- that you’re critical of the method - in fact I think Method in general.</em></p>
      <p>George wondered if there was a better way to be faithful to Griffo's last roman than averaging. I suggested a magnifying glass, and contextual alternates, which to me are better methods than averaging. But as it transpired, I was thinking more of the effect of the Aldine page, and he of the type. He clarified his position as an interpreter, rather than a simulator, which is fine by me. End of that part of the thread. </p>
      <p><em>But I’m saying why bother with magnification.</em></p>
      <p>My eyes need a little help.<br>
      The magnifying glass is far less of a mediation than a scan.</p>
      <p><em>Because it assumes the reviver is infinitely gifted.</em></p>
      <p>Not at all. The reviver can never be photo-exact, but that's not the point, as such exactitude can't cross the barrier between the imperfect, varying impression, and the ideal piece of type. The reviver can only be relatively gifted, compared to the designer.</p>
      <p><em>I think emotion is indispensable in anything a human does, but wallowing in it, for example to the point of shunning method, is anti-Craft.</em></p>
      <p>I don't think you got my point about drawing from life being a process of un-learning emotion. The "magnifying glass" method is this: Look at the original specimen(s) through the lens, draw part of the glyph (with beziers), look at the original again and refine the glyph, as many times as necessary. Then do a print-out of the same text as the specimen at the same size, and compare them. Then go back to the glass and the beziers. And so on.</p>
      <p><em>Trying to get people to make fonts I would make just makes everybody miserable.</em></p>
      <p>I would hope that by answering my criticisms, George could be a little clearer in his own mind of what he's doing and why. Especially as this is an MA project, and he can expect some harsh crits there. I also made a number of what I consider to be constructive contributions, rather than criticisms, such as the contextual alternates for varying wobble thing, and the outline texture filter idea. I've used the outline-filter technique, but not the contextual.</p>
      <p><em>Basically I guess I don’t think anybody (short of a medium :-) is capable of subverting his own preconceptions to allow what was in the mind of another person to surface - especially not centuries apart.</em></p>
      <p>But don't you feel that you have a different understanding and greater insight into why Baskerville's type is the way it is, now that you have been working on a revival? And why wouldn't such an understanding correspond to what JB had in mind?</p>
