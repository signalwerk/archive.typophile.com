      <p><em>The problem with this is that the variation can’t come from the<br>
      type anyway.</em></p>
      <p>I’m not actually convinced of that. I need to go and read Peter Burnhill’s book again (George, do you have this? it is invaluable for understanding the Aldine types).</p>
      <p><em>But of course there could always be more than one source shape per character.</em></p>
      <p>Yes. We know this was true for Gutenberg’s fonts, and when I see apparent differences in the proportions of letters, e.g. one p looking narrower than the others, I really wonder how much variation is actually explainable in terms of inking and impression.</p>
      <p>I think when looking closely at specimens of printed type, you have to make reasonable assumptions based on the competency of the punchcutter. The more a specimen looks like a complete letterform, like a well balanced and resolved design, the better a specimen it is. You have to assume this if you consider the punchcutter to be good at his job, and you can most often confirm this by looking at his larger sizes of type. If these look well designed, you can be reasonably sure that his smaller sizes were also. So if you are looking at fragmentary specimens in which the design seems weak and unbalanced, and you compare these to specimens in which the shape is clearly defined, then you have to consider that the latter show forth the design better. Yes, this requires a judgement call, but I don’t think it is arbitrary: it is reasonable. Also, it is often easy to tell what are the prestige publications of a particular printer, those that have been printed with more care and attention, and these will provide a better quality of specimen than cheaper editions produced with less care.</p>
      <p>I don’t think pre-selecting specimens is anathema to the averaging concept: it is a methodological modification. In fact, a useful exercise would be to perform averaging of both pre-selected and of randomly selected specimens, and compare the results of these. You might also have different people perform pre-selections, and combine the resulting set of forms. There are lots of ways in which one might play with the methodology. I think it is too soon in the day to say that it has to be done in one way only.</p>
      <p>I agree with you that one should not presume equal inkspread, even on a flat bed press. Letterpress impression displaces paper mass, and since paper is not of perfectly uniformly density, the displacement from one letter may be more than from an adjacent letter. Also, type was being inked using balls, not rollers, and even inking was virtually impossible. So one part of a letter might have more ink on it than another.</p>
      <p><em>(I remember once having a similar discussion with you concerning<br>
      what pairs to kern; somebody advocated using Google to form lists<br>
      of pairs, but you pointed out that that would include pairs from<br>
      incorrectly spelled words; at which point I put forth that there<br>
      really is no “wrong” or “right”: if the pair happens, it means<br>
      it exists, and that’s all a type designer needs to know.)</em></p>
      <p>I think that must have been someone else, because my approach to kerning involves using test words that, for Latin at least, include examples of every possible combination. Including Exxon :)</p>
