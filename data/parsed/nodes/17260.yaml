      <p>Hello Raph,<br>
      Thanks for your help, and there goes my patent. Tracing from a sharpened version of the blended master sounds like a good idea. To clarify what you say about tracing the light side and dark side, presumably you're urging that I trace hard against the black at the top join of bowl and stem, but trace around the paler grey of the spur, on the understanding that it has been often blunted by damage. That would make sense - though it would be nice to investigate just how this damage characteristically operated, because I want to avoid unfounded interpretation. And Aldine type-metal was unusually good for the time, though the press-work was of course generally far below the level of a Ratdolt performance.</p>
      <p>Failing to normalise the colour in advance means each letter contributing very different amounts to the blend, and also increases errors in superposition. It's a compromise: with these scans I think careful normalising is a good thing. I've tried without, incidentally. I'm careful not to mix punches - and that's something software is very good for. Sergei's conclusion was that mixing of punches was not done in a form consistent enough to be aesthetically motivated - more likely an all hands on deck response to a big job, or large number of concurrent jobs. And the compositors were, according to Aldus himself, a pack of dunces, while nothing but good came from the 'daedaleis Francisci manibus Bononiensis'.</p>
      <p>Finally, is there a way to automate the selection from scans of all the letters from each punch? Cutting them out one by one is a bore.</p>
