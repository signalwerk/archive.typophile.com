      <p>But I wasn't just talking about changing minds, I was talking about progressive discourse through direct engagement with criticism. So even if someone disagrees with my criticisms, he or she can further the conversation by responding to them directly. But you tend just to repeat your original assertion. You have not once even tried to explain why what everyone else calls rhythm is not rhythm, and your rejection of that term is based in the very mistake of associating it with flow, so the rejection is begging the question. You keep saying that rhythm implies flow and therefore there is no rhythm. But I've been demonstrating precisely that rhythm does not imply flow -- indeed, flow implies lack of rhythm --, but refers to the spacial relationship of letters within words. I come back to this again and again because I think your rejection of the term is unfortunate, because this spacial relationship is crucial to bouma construction and good notan. At its simplest level, the distinction between the rhythm of letters within words and the rhythm of word spacing (which you have elsewhere insisted should be even, i.e. rhythmic) is key to identifying what constitutes a word. But if word recognition does indeed involve bouma recognition, then regular, i.e. rhythmic, spacial relationships are also important at the sub-word level because it is only in these relationships that role architecture can define recognisable shapes larger than a single letter.</p>
      <p>It seems to me, as I write this, that we have spent a long time talking at cross purposes, because you've jumped on the word rhythm with the statement that 'There is no rhythm in reading because there is no flow'. We don't disagree about their being no flow (although, discounting regressions, saccades have an average length, and when they skip words they do so in a predictable fashion, and periodic pulse is the very stuff of rhythm; in fact, if there were smooth flow then that would really be a lack of rhythm). But has anyone actually been talking about rhythm in terms of reading physiology? No, we've been talking about rhythm in terms of spacial relationships of letters in word formation. And my 'contrived' illustrations, have shown how word formation falls apart if you mess with the rhythm of the letter relationships. I've never understood why you have taken so strongly against this commonly understandable and accurate terminology. As soon as you recognise that there needs to be a relationship between the white space inside a letter and the white space between the letters, you are moving in the area of rhythm. This is what rhythm is: a proportional relationship. If you are not going to call that rhythm, then you'll have to come up with another term, because the phenomenon is real, demonstrable, and important to the matters that concern us both.</p>
      <p>Give some serious thought to the nature of proportional spacial relationships in the way letters form words, and tell me why it doesn't make sense to talk about rhythm in letter spacing. I've adopted 'notan' and even 'bouma', and I think you should reconsider a term that accurately describes a phenomenon that we need to be able to talk about. And that's not terminology for its own sake.</p>
