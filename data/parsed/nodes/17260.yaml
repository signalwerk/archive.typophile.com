      <p><em>Would another method be superior?</em></p>
      <p>I think the best way to do a revival is by eye, with a magnifying glass.<br>
      Whatever method of revival you choose, you are making an interpretation, by the mere act of choice. IMO, it is not "human" interpretation that is banalizing, but attempts to automate the process of interpretation.  </p>
      <p>By using any system of averaging, you are opting for a composite which is softened and blurred, which is counter to the visually arresting effect of a letterpress impression. A flat two-dimensional photo-reproduction can never convey the <em>bite</em> of letterpress into paper, so the digital revivalist has to find some way of compensating, of adding an ingredient. But averaging does the opposite. The end result looks crude and ugly, whereas Griffo's intent and sense of style is clearly apparent in most impressions -- the calligraphic ductus underlying the form -- which averaging obscures.</p>
      <p><em>...even if an averaged character better represents Griffo’s expectation of how the letter would look.</em></p>
      <p>It doesn't. Griffo was well aware that the individual impressions of a particular character would vary, and would have designed his glyphs accordingly, to account for that variation of the final image. Had he been assured of a uniform reproduction of letter shapes, he would have designed them differently. More like Bodoni.</p>
      <p>The variety of serif treatment in Incunabula type accomodates the fact that had they been made the same, they would have ended up different, due to the vagaries of the printing process. So the reader's attention would have been drawn to this deviation from the ideal. However, to make them varied to begin with is logical, it disguises the depradations of the printing process.</p>
      <p>There is something disconcerting about a page of Poliphilus, especially when it is digitally set. Perhaps not if one only reads it once. But if one is to savor the text by rereading, and if one is reading the typography as well as the content, it palls. Hence Monotype Bembo, the antithesis of banality.</p>
      <p>So if you want to use digital technology to reinterpret old letterpress printing, I think you would be better off exploring the possibility of contextual alternates in an OpenType font, to capture the variety of impression, which is an integral part of the original design. I suspect that Incunabula printers used textual context to inform their selection of a particular sort of a letter, and may even have physically "fine tuned" some of them, especially the lower case "r".</p>
      <p>The long left side of the main stroke has acquired a texture (of paper?) in the original, but in both the derived versions shown it is straight. This texture is part of the design, like the resonance of the room in which a piece of music is performed. You cannot produce a "faithful" copy without finding some way of paraphrasing this quality of the printing.</p>
      <p>Perhaps you could start with an idealized glyph -- clean, sharp and simple outline -- then apply a "letterpress" filter to it, similar to the way that the texture brushes in Illustrator can be applied to a glyph outline. This, and my comment about contextual alternates, is along the lines of your thought "to model in software the Aldine printing process from punch to paper".</p>
