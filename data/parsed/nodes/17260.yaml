      <p>I’ve been watching this thread for a while now and I can’t imagine how one could expect to faithfully reproduce a typeface from a letterpress printed specimen. </p>
      <p>There are a legion of problems. First of all it is difficult to find an Aldine specimen that hasn’t been cleaned over the years. Cleaning takes out the impression. While this may resolve a certain discrepancy caused by the camera interpreting slope as 2-D it allows problems such as ink spread to be misinterpreted.</p>
      <p>Wooden common presses were not a manufactured item and differed greatly one to another. And any publisher with the printing capacity of Aldus would likely have had many, many presses working on different sections of the same book.</p>
      <p>There are other problems, variance in the paper, not only sheet to sheet but within the sheet causing characters to print lean or fat without reference to inking. Dampening the sheet (required with handmade papers) also introduces variance in the way the letterforms will appear due to the way the ink is accepted by any particular sheet (there is no way to make dampening standardized sheet by sheet). </p>
      <p>There are inking problems not only as the result of ink spreading beyond the letterform (due to problems in proper visconsity and application) but in the technique the pressman used in applying the ink. As someone mentioned previously ink balls were used rather than rollers (first use of rollers was 1812). There is a significant difference (not better nor worse) in the way letterforms respond to these differing tools.</p>
      <p>Variance in impression, due to makeready or wear on type or problems in composition or lock-up will also effect the look of the letterform.</p>
      <p>And there is often the likelihood, in earlier printed work prior to standardization, that multiple punches were used to create the “letters.”</p>
      <p>The search for some form of standardization is wrong simply because there is no initial form of standardization. There is only variance, and to some extent, particularly with the early printers, that was the whole point of it, whether there was a choice in the matter or no.</p>
      <p>The only true way to capture a letterform from the past would be a carbon proof from the punch itself or find an exacting way of capturing the letterform directly from the punch.</p>
      <p>Once it goes to print, all bets are off. While I can applaud the interest and research I cannot imagine that any result could be satisfactory. If the intent is to be “faithful.”</p>
      <p>Gerald<br>
      The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
