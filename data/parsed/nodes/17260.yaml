      <p>Nick, I could run that control test, yes - and when my overdraft is less booming I’d like to, but what I expect to see is that the averaging gives inkpress radiating to equal distances from the metal, except when inkpress is forced against ink coming from another direction, when the inkstreams would combine in an averaged direction and possibly travel further: ie, gumming up the crannies more than proportionally.</p>
      <p>Outline filtering: it would have to be postscript then? Beowulf no longer works on Mac OS X, I hear.</p>
