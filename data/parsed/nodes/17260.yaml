      <p>Further replies to Nick:<br>
      <cite>To make [glyphs] varied to begin with is logical, it disguises the depradations of the printing process.</cite></p>
      <p>Even the dullest reader could hardly have been fooled. I doubt that this was the primary motivation, when variety of seriffing has so many other virtues. I think the 1499 caps are the best proof of this: the serifs are designed to scoop white into a convincing counter (L) or eject it (C), thus making perceived counter-size sufficiently similar for the caps to make a readable text face - something not repeated by Garamond and the later tradition, and certainly not by Bodoni!</p>
      <p><cite>Texture is part of the design, like the resonance of the room in which a piece of music is performed. You cannot produce a “faithful” copy without finding some way of paraphrasing this quality of the printing.</cite></p>
      <p>I could take the averaged letterform, toughen it, and then consistently waver the outline, paraphrasing the texture without simulating the actual and extreme variations of the printed letters.</p>
      <p>As for Poliphilus, in 13+ point letterpress on suitable paper the only problems I see are in the consistently inconsistent weights of, for instance, h compared to m, resulting from Monotype's own attempts to paraphrase this texture. In fact I think letterpress Poliphilus is nearly one of the very finest typefaces - letterpress Bembo is the finest of all, but some of its letters are too wide and so too white (above all y) and its caps are a little too Garamondian.</p>
