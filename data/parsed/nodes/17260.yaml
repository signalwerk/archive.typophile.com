      <p>&gt;Because I find Griffo’s work in its printed form uniquely beautiful, I want to learn what microproperties give it its beauty: I want to solidify these properties in a way that cannot be done by just looking at the printed page. I don’t think printed variation substantially contributes to this beauty; and to me it is often ugly.</p>
      <p>I see now you have a very clear concept of what you are after, which is impressive. I do think, as it seems you suspect, that you will find that when it comes to actually doing the face or faces, there are thousands of decisions to be made, and your concept will be refined and sharpened, and maybe changed by your new ideas and test designs. </p>
      <p>My main point in posting on this thread is to make clear that the process of making a good revival is by no means an automatic process you can program. It takes many creative decisions, and in the end the result will be your product, based on Griffo, and not Griffo.</p>
