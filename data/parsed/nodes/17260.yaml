      <p>Peter ponders:<br>
      <cite>yet the Griffo averaging process seems to average a higher level of degradation,</cite></p>
      <p>Well, this is easy enough to understand on one level. Gain is nice and erosion is nasty. Oddly enough, the project I’m working on right now for work is compensating for a white-writing LED photoconductor printing technology that has erosion, so I need to add gain to the digital image before printing it. Most laser printers have black-writing technology (and a more complex two-component toner technology to support it), and have <em>plenty</em> of gain to show for it.</p>
      <p>The <em>averaging</em> process undoes quite a bit of the degradation (in the strict technical sense of deviation from the platonic shapes originally engraved into the type) created by the pressing of soiled metal surfaces into flattened tree-pulp mush. Using objective image quality measures such as the sharpness of corners, I’m amazed by how <em>little</em> degradation you see in an averaged image made from letterpress printing. I now think that’s because the metalworking technology in typefounding has always been pretty good; the bulk of the difference between 15th and 21st printing is in the smoothness and regularity of the paper surface, rather than the technology for forming the image and bringing it to the paper surface [and if you don’t believe me, just take a close look at the difference that coated vs uncoated paper makes in inkjet printing].</p>
      <p><cite>Are we too quadratically-smooth obssessed?</cite></p>
      <p>In the mathematical world I inhabit when working on smooth curves for font design, quadratics are a rather poor standard for smoothness. But I’ll readily cop to the crime of being obsessed with such details.</p>
      <p>William wails:<br>
      <cite>You have regularized the base line,</cite></p>
      <p>In fact, I’ve spent very little effort on fit, and you can see all kinds of fit problems with my sample. If you want to make it match the visual appearance of the original, then you have to vary the baseline quite a bit (intercharacter spacing less, I think, probably because you have considerable compression force in that direction). To make a good visual match with the original, it probably <em>also</em> makes sense to do randomized variation on the individual impressions, as discussed in some detail upthread.</p>
      <p>In any case, the “unsharp” outlines represent very nearly what George was talking about in his original post: extremely literal tracings of the platonic letter shapes as recovered through impression averaging, with very little judgement or interpretation other than classifying the original impressions and rejecting the ones that are too damaged to contribute to the composite image (not surprisingly, this is a lot trickier to get right for 500 year old typography than for stuff from the heyday of ATF).</p>
      <p>The top outlines represent me using my eye to see where the image is soft or globby, and to sharpen those places up. In general, the quality of the platonic lettershapes is surprisingly good (those hairlines in letters such as ’a’ and ’p’ are real, and surprisingly stable when you look at the composite image as opposed to individual glyphs, many of which have broken hairlines and similar problems, and you also see similar examples of impressive sharpness in places like the top left serif of the ’i’). The consistently biggest problem is that the punchcutter does not seem to have been able to cut sharp inner-corners anywhere, and thus you have a largish radius on all inner-corners. (when I was tracing these, I thought that the corrections done to keep these soft corners from filling in and becoming too black may well count as an extremely early instance of trapping; we’ll see what Hrant has to say about that). So I placed myself in the punchcutter’s shoes, figured out the places where I think he <em>would</em> have made a sharp inner corner if he could have, and did a little curve touchup. Incidentally, at 600dpi in toner, the difference between the two is pretty hard to see - toner also has trouble with the radius at inner-corners. Some things are not so fantastically different after 500 years of printing technology evolution!</p>
      <p>I’m not sure which one to prefer, but I think at larger sizes the soft version is just going to be too soft and blobby, while the sharpened one holds its own with some interesting shapes.</p>
