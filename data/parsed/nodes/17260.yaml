    html: <p>Hi Gerald, sorry for my earlier testy response. The Aldine italic source is two facing sides of Aldus’ 1519 Cassius Dio, scanned at 2400 dpi by Sergei. Long before 1519 Griffo had cut a replacement for this p; he constantly rethought and improved his types (such that only 40% of the 1495 De Aetna lowercase remained unaltered by the time the roman was completed with its new set of caps in the 1499 Dioscurides); it seems the typefounder simply got into a muddle, and cast this older version by accident. Next year I will probably be using the UCLA copies of the 1499 Aldine Scriptores Astronomici Veteres and the 1503 Soncino Petrarch.</p>
