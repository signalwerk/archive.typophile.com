      <p>&gt; Mechanical pressing of inked metal into paper is indeed a lifeless parody of a well-done illuminated manuscript.</p>
      <p>Well, you might argue that for Guttenberg’s printing. But while Giffo’s roman is more impersonal than any manuscript, it is strikingly more readable. He was the fellow, it seems, who really perfected the art of exquisitely readable type as opposed to writing, by coloring it better and more evenly than could be done with a pen. Aldus in his introduction to his printing of Virgil in 1501 (Harry Carter, A View of Early Typography, p 108):</p>
      <p>“Aldus, who gave punch-cut script to the Greeks, now, as you see, gives as much to the Latins, by the fabulous hands of Francis [Griffo] of Bologna.”</p>
      <p>The fabulous hands. Every type designer is in his debt.</p>
