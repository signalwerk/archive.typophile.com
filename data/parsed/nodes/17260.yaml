      <p>Thanks for your amplifications William.<br>
      <cite>you are not trying to revive the look of the aldine page, with all of its variations. So what you are in fact doing, despite protestations of striving for authenticity, is trying to revive features of the typeface that you regard as good or desirable ones.</cite><br>
      This doesn’t follow, and as it happens it isn’t the case. I’ll revive features of the typeface that I regard as bad or undesirable too: I just hope I don’t find too many. And I doubt I’ll find any features that I can’t learn to accept in reading extended text set in the revival. Choosing a body of work to revive should involve a commitment to that work, which reaches us battered by history but capable of being restored by a diet of soft gruels and attentive kindness: I have more to learn from Griffo than his work does from mine. I wouldn’t have made the h in <a href="http://www.library.upenn.edu/exhibits/rbm/petrarch/petrarch_23-01.html/">the 1503 italic</a> so rounded, but I can see that it demonstrates a difference between humanist and mannerist ideals, and I anticipate the broadening of my own ideals to accommodate both possibilities.</p>
      <p>I’ll tell the computer what to do, and control the inputs it receives, only insofar as each choice can reasonably be expected to get me closer to the newly cast type plus average inkpress. What I hope to revive is a combination of very subtle features, varying from letter to letter, which could not but be bulldozed by any heuristic process of feature identification and redrawing. The time for heuristically developing my judgement is, in this project, afterwards, in choosing how much emolliating inkpress should consistently be removed, and, if necessary (as I hope it will not be), how much the weight of characters should be made similar, in order to get a combined effect resembling the original in bite and harmony, while preserving intact the combinatorial effects of the initial draft. </p>
      <p><cite>The look of a page is as much or more influenced by layout as by the typeface. So the way the Aldine page was laid out—the size of type, the leading, the measure etc. may well be a part of the impression you admire.</cite><br>
      Sure, but satisfying and appropriate page, margin and textblock proportions aren’t, with Bringhurst to hand, rocket science, and Aldine leading (1/12th of the line increment) will be incorporated into the fonts, as it was by Griffo. As for size, the horizontal and vertical proportions of the originals will be exactly replicated at ~15 and ~12 point for roman and italic respectively, and horizontal proportions and relative size of irregularities will be modified for optical similarity at other sizes using MM.</p>
