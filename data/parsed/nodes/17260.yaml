      <p>Hi,</p>
      <p>I think the main problem in Bembo, at least for my eyes, isn’t so much the design of particular characters but that serifs are too thin and look like knife blades. As you said above its the contrary of organic form. Malins punchcutting brought nice and more feeled forms. It is softer and has more colour.<br>
      And at last I really believe its nicer than its storic forefather! (One of the rare cases if not the only one at all!)</p>
