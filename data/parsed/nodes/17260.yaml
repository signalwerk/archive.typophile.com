      <p>“I take an outline derived with consideration for inkpress in corners and blunting at spurs from an averaged image like the one two posts up, write a fixed-front ductus over it, see where the ductus doesn’t match and how the metal departs from it, assess the consistency of those modifications, and of second-order variation in manipulation (going on potentially ad infinitum but really it wouldn’t be, not with humans),”...</p>
      <p>(this is the type speaking) Help me, Help,   me. please, , , they are talking my headspace off. </p>
      <p>My experience with this, is that the best way to revive from metal, is to do the first part of what you’ve done well. Examine large, a wide variety of letters. But when I do this, I’ve already got a list of things that go wrong, from the punch, to the paper, and from then to now (if it was a long time on the paper). So, I have a growing “typographic dictionary of errors”, like “Dumb Struck” (a pack of letters with a distortion as if a punch head were too far from the user for the position of the punch face at time of strike. Or some of my other favorites like “Cat Walked”, “Dropsies” or “Secret Filing” (’twixt chase and slug). My modern favorite, “Full Page Variouching”, occurs, when faxing a full newspaper page to plate, burping, sometimes repeatedly, causes letters to change width and weight (variations at last!) in a typographically painful narrow strip from head to foot of an entire page, (see NY Times, (only if outside metro area???)).</p>
      <p>Fortunately, the subset of errors in the metal of your project, limits the possibilities to the point where you can match errors with examples, and actually, (nearly factually) “find” the “right” letter but getting your eye on a particular, or a few particular letters (if you suspect intelligent design in the composition), and not use a “program” to “assume” what an “error” is. Metal type, after all, was not VooDoo. More often than not, as cited above and sited at the time of the metal men, by the metal men, it was sometime DooDoo. You just need to learn to track type scat.</p>
      <p>“and then redraw the font appropriately”<br>
      i.e. find” the “right” letter with your mind (ooh). It is especially effective to do it this way, because, any program trying to make decisions on these kinds of letterforms, from this period, without the Error list of type, and without intelligent error thinking, like you have, on an intra-letter basis, will...I dunno, Not make an alphabet?</p>
