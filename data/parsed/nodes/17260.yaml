      <p>Thanks Nick, all very interesting.</p>
      <p><cite>A flat two-dimensional photo-reproduction can never convey the bite of letterpress into paper, so the digital revivalist has to find some way of compensating</cite></p>
      <p>I think this is true: averaged forms should be toughened up by removing the glutinous deposite from inside the crannies and hardening up angles.</p>
      <p><cite>Griffo’s intent and sense of style is clearly apparent in most impressions — the calligraphic ductus underlying the form — which averaging obscures.</cite></p>
      <p>I think this begs the question rather. The calligraphic ductus is partly your imposition on the actual form, though it's probably the interpretation Griffo wanted his readers to impose: in 1500 departure from calligraphic ductus was thought of as simply erroneous. But Griffo was clever, and made small (in this p's case not so small) deviations from calligraphic ductus, presumably in order to better unite the word-image. My averaging makes this this very clear - perhaps too clear, because the illusion of calligraphy necessary to the total effect is weakened. </p>
      <p>Must sleep now, more later.</p>
