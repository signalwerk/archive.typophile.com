    html: "<p>I'm sort of with Nick on this one, at least insofar as I consider the human eye and brain to be a powerful analytical tool. I find it bizarre that 'emotional' and 'expressive' are instantly assumed to be the predominant characteristics of human interpretation, as if we are somehow unable to actually see what we see and perform a rational analysis, but must rely on machines to get past our overriding emotional and expressive faculties. This is bollocks. I also think Hrant is wrong to attempt to try to frame this in terms of his favourite 'art vs craft' dichotomy, as if craft cannot come from the eye and hand: where else has it come from for the millennia of human making? We have an analytical faculty and the ability to make rational judgements regarding what we observe. Among other things, we have an obligation to employ this faculty critically in considering the value of methods and tools. Looking at the images in the first post of this thread, the first thing I immediately see is that all of the derived forms based on averaging have a large black bump in the lower left, while the one photographic image shows something quite different; this seems to me to be a problem of method, because the averaging does not take into account relative lightness and darkness of the type image. Similarly, in the photographic image, there is a clear but very faint indication of the full extent of the terminal of the upper bowl where it crosses the stem, and this is completely lost in the derived shapes, presumably because it was too faint to be preserved in the threshold conversion. So these are just two places in a single letter where the human eye tells us more than the proposed methodology and tools. This is not to say that the methodology and tools are without merit or promise but, ironically, that they must be subject to the same critical and interpretative analysis that we can also apply to the subject.</p>"
