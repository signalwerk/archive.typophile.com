      <p><cite>This I don’t get. Was his graver blunt?</cite><br>
      I don’t know. Raph says that “The consistently biggest problem is that the punchcutter does not seem to have been able to cut sharp inner-corners anywhere, and thus you have a largish radius on all inner-corners.” This could well be a combination of inkpress with the regular intention of creating independently robust counters. For instance b shares a very round counter with d, much rounder than a’s. Contrast is also held down around bowls on b, d and q, substantial thinning only happening on the return curve back into the stem.</p>
