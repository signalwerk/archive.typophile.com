      <p>&gt; I wasn’t critical of the project, only that<br>
      &gt; expression of piety which was the mission statement.</p>
      <p>It seems to me -through both this thread and Raph's- that you're critical of the method - in fact I think Method in general. And this project being centered on Method, I think you're critical of a lot more than a supposedly tangential "expression". I don't want you to hold back the criticality - that would be unnatural; but I in turn need to counter it when it shows up.</p>
      <p>&gt; For the same reason one would draw from life, rather than a photograph.</p>
      <p>But I'm saying why bother with magnification.<br>
      Scale affects the essence of something, and it<br>
      seems to me that shunning George's (and Raph's)<br>
      methods requires shunning the magnifier as well.</p>
      <p>&gt; the more intermediate elements that are removed, the<br>
      &gt; more opportunity for the process to be faithful to<br>
      &gt; the intentions of the original type designer.</p>
      <p>If that's true, then the magnifier's gotta go.</p>
      <p>&gt; Why do you consider the more direct approach,<br>
      &gt; without tracing over a simulacrum, more emotional?</p>
      <p>Because it assumes the reviver is infinitely gifted.</p>
      <p>I would say that shunning Method is emotional. Don't get me wrong, I think emotion is indispensable in anything a human does, but wallowing in it, for example to the point of shunning Method, is anti-Craft.</p>
      <p>&gt; It gives a better understanding of the original</p>
      <p>I don't think so. I think mostly it causes the reviver to express himself more, to tap what's in <cite>him</cite> more than the source; this confuses the -intended- results. Unless one's intent isn't to do a literal revival - which is great by me, but not the same thing, and not what George wants. I find that the best crits are the ones that take into account the creator's highly personal desires - not those of the person giving the crit. For example, I don't have to like humanist sans fonts to be able to make Ricardo feel like I helped him improve Lisboa. In giving a crit, I have to separate emotion and method, and focus on the latter. Trying to get people to make fonts I would make just makes everybody miserable. Like when I once showed a "progressive" design to a Famous Designer, and I told him the intent is such-and-such, and he come (sic) back to me with a ton of details of how to make it all homogenous like him (sic) own fonts, that's just a waste of everybody's time (not to mention arrogant).</p>
      <p>Basically I guess I don't think anybody (short of a medium :-) is capable of subverting his own preconceptions to allow what was in the mind of another person to surface - especially not centuries apart.</p>
      <p>hhp</p>
