      <p>One could also argue that 'pattern' is a misleadingly overloaded term. When I talk of 'a pattern of salient whites' in a bounded map, I don't mean pattern in the sense that a tartan has or is a pattern. If I did, you would have to say an orthographically meaningful cluster of letters doesn't have a pattern. </p>
      <p>A literal notion of flow is not intrinsic to the uses of the term 'rhythm' that we invoke when applying it in the context of descriptions of visual material. In it's deployment of salient whites and vertical blacks a normatively spaced cluster of letters has a phasal structure of discrete pulses (like the discrete pulses of consonantal sound in speach) that hovers around a phasal mean. When we talk of rhythmn in optical-grammatical contexts, it is conventionally that characteristic, or something like it, we wish to evoke. When I hear talk of rhythmn in optical-grammatical contexts, it is typically that characteristic, or something like it, that comes to mind.</p>
      <p>It seems to me that Hrant's misgivings about rhythm have to do with the fact that in visual wordform resolution role-architectural subcomponents of a bounded map are not processed sequentially but parallelistically, and sequential processing associations are hard to supress, because of how we learn about rhythm. </p>
      <p>Please pardon the intrusion of my lingo in this thread, but what I'm trying to convey with it seems to need to be gotten out of the way or cleared up.</p>
