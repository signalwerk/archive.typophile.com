      <p>Wonderful work, George and Raph. </p>
      <p>Raph, your scan I think reveals a problem with the goal of ’faithful’ revival when it come to pre-Baskerville types, which were printed with coarse inks and uneven height-to-paper. </p>
      <p>You have regularized the base line, which makes the irregularity of the x-height more extreme, and stand out more in what seems to me a more disturbing way than the original. The digital medium gives uniformity to the letter shapes, darkness of impression, and alignment. Hence what was charming in the original looks ’off’ in digital form. And thus the beautiful sample you have done seems to me to beg the designer to figure out what is great about this, and what disturbing or distracting. Then you have considerable a design challenge, though a worthy one.</p>
