      <p>&gt; My eyes need a little help.</p>
      <p>And those of Griffo's readers didn't?</p>
      <p>Nick, you claim your methods allow you to get inside Griffo's head.<br>
      I guess I can't believe you.</p>
      <p>&gt; ... why wouldn’t such an understanding correspond to what JB had in mind?</p>
      <p>It might. But the chances are slim enough that my own ideas are sure to overpower what I think JB might have been thinking if I look too far beyond the forms themselves. Thought patterns are not some mathematically pure, eternal things; they're entirely individual, highly dynamic and contextual to boot; there's no way a 21st century Armo is going to get inside an 18th century Brit's head (at least not enough to make type like him).</p>
      <p>I think that in a revival it's important to distill the essence of a design, which comes from the forms, not what happened to be in the original designer's head. For one thing, stuff in people's heads changes. Should I revive the JB on the morning he decided to get into typography? Or the JB the night he finished printing his Virgil? Or maybe the JB on the verge of giving up on typography in disgust? It's hopeless to approach it that way. So for example when I'm making the British Pound character, I can look at what JB made and say "that was wrong", and make one that fits the <cite>design</cite>, as opposed to JB's perceived mindframe, better. Also, a key difference here is that my revival is not literal.</p>
      <p>Raph, I know how it feels to lose a long post - sorry to hear it. More than the lost content I think it's the combination of improvidence (for not copy-pasting it periodically) and guilt (for rambling on so much in the first place) that makes it so frustrating, and the ensuing decision of how far to take the replacement post so unnerving.</p>
      <p>&gt; the averaging technique is a tool.</p>
      <p>One problem is that powerful tools can be overly challenging, even scary.<br>
      Like how I'm much less inclined to learn now software these days.</p>
      <p>hhp</p>
