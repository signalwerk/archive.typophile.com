      <p>Very interesting. I think I've written approximately the same program. I've wondered what would happen when applied to very old samples - I know I've been pleased with the results I've gotten from originals in the 100-year old range.</p>
      <p>My own approach is simply <em>not</em> to threshold. In my curve editor, I use the grayscale averaged image to trace from. In my opinion, there is valuable information present in the grayscale which is lost in thresholding.</p>
      <p>Look closely at two places you have grayness - the top join of the bowl of the 'p' to the vertical stem, and the spur that protrudes to the left. In the first case, it's reasonable to conclude that the grayness is caused by varying amounts of "glutinous deposit". Arguably, the truer shape of the metal can be recovered by tracing towards the light side.</p>
      <p>On the spur, the grayness represents the probability of damage to the metal type - much, much higher for delicate projections such as this spur than, say, along the edge of a stem. With this interpretation, it should be clear that the truer shape of the metal is recovered from a trace of the dark side.</p>
      <p>So when I'm tracing, I leave the image in grayscale, and make these judgements by eye.</p>
      <p>A couple of other notes about my "recipe".</p>
      <p>1. Start with a really high resolution scan. I almost invariably use 2400 dpi.</p>
      <p>1a. Use as many impressions as humanly possible. I'm astonished by the difference in clarity between a handful and dozens, and again in the jump to hundreds.</p>
      <p>2. I do my contrast adjustment <em>after</em> the averaging. There's no need to get the paper white pre-averaging, because the contrast of the paper texture will be dramatically reduced. In my opinion, this increases the chance of being able to see subtle gray variations.</p>
      <p>3. After averaging, I sharpen the image pretty significantly. I believe this compensates for the blurring caused by the (inevitable) errors in aligning the individual impressions to the master template.</p>
      <p>4. After sharpening, I tend to lighten the image so I can see the subtleties in the darker gray shadings more accurately.</p>
      <p>Nick has a point about variation - you're likely to get results similar to what printers <em>would have</em> produced had they combined Griffo's punches with the type founding, paper, and printing technologies of, say, the 1912 ATF specimen book. If Griffo lived 400 years later, he may well have designed his letters differently to suit, but then again, perhaps not.</p>
      <p>I disagree that averaging obscures the calligraphic ductus of the original letters. I think it lets you visualize an image much closer to the actual shape of the metal than can be seen in any of the individual impressions. In some ways, I think it's even better to work from the averaged image than if you knew the shape of the metal, because the latter was probably overthinned to compensate for the ink gain on the press.</p>
      <p>Note, though, that in saying this I'm assuming that there was one punch, so each individual letter is a fair copy of the same original shape. Averaging together impressions from <em>different</em> punches would, I agree, be a travesty. If I recall Sergei Egorov's research correctly, part of what he found is that, for many letters, there may have been two or three similar, but subtly different, punches. If you carefully classify the impressions so that the vast majority come from the same punch, that should take care of that issue.</p>
      <p>A "letterpress filter" for type is a very, very interesting idea. I've been toying with the idea of building such a thing, but the research, both into characterizing the letterpress process, and into getting usable digital outlines of the results, is nontrivial. How strong would be the demand for such a thing?</p>
      <p>Anyway, George, very best of luck with your project. It sounds very much worth doing.</p>
