      <p><cite>there goes my patent</cite></p>
      <p>Ah well, and the untold fame and fortune that goes along with.</p>
      <p>I finally remembered the thread in which I first posted real results from this method: <a href="http://www.typophile.com/node/9245" rel="nofollow">Christian Gothic</a>. In that thread, you'll find a bunch of sample images, a heated discussion about the merits of the averaging technique and the process of designing revivals, and of course the inevitable flamewar in which Hrant labels others as "fascist-apologist".</p>
      <p><cite>Finally, is there a way to automate the selection from scans of all the letters from each punch? Cutting them out one by one is a bore.</cite></p>
      <p>Yes, I wrote some code to segment the image by bounding boxes, then to  do a pairwise correlation between all samples of approximately matching size. I can post my code if you're interested, but it's quite unpolished and often requires manual touch-up of the results.</p>
      <p>That Soncino sample is indeed gorgeous. Any way to acquire a higher resolution scan?</p>
