      <p>&gt; it is the variation itself that contributes to the look of the<br>
      &gt; letterpress Aldine page, so averaging the variation to produce<br>
      &gt; single letterforms seems to me not to be a very good way to<br>
      &gt; produce a ‘faithful revival’ of the type</p>
      <p>The problem with this is that the variation can’t come from the<br>
      type anyway. It has to come from the printing process (which can<br>
      be attempted here via photopolymer letterpress, although it’s no<br>
      piece of cake when you throw in issues of paper, etc.) and this<br>
      makes the arrival at the “source shape” the only way, really.</p>
      <p>But of course there could always be more<br>
      than one source shape per character.</p>
      <p>&gt; what you are averaging is not letterforms per<br>
      &gt; se but printing artifacts affecting letterforms.</p>
      <p>Which is exactly how you get at the letterforms!  :-)<br>
      That is in fact the beauty/power of averaging:<br>
      it removes some of the arbitrary interpretation.</p>
      <p>&gt; one knows for certain that this feature<br>
      &gt; of the letter is Griffo’s design.</p>
      <p>Not really - it could be an artefact too!  :-)<br>
      Our minds can play tricks on us, and averaging can help tone that down.</p>
      <p>So there are no “true” Griffo forms in the results; they are ALL<br>
      imperfect instances; and the more instances you average the<br>
      more you remove the arbitrariness.</p>
      <p>(I remember once having a similar discussion with you concerning<br>
      what pairs to kern; somebody advocated using Google to form lists<br>
      of pairs, but you pointed out that that would include pairs from<br>
      incorrectly spelled words; at which point I put forth that there<br>
      really is no “wrong” or “right”: if the pair happens, it means<br>
      it exists, and that’s all a type designer needs to know.)</p>
      <p>&gt; the averaging methodology has merit relative to the careful selection of input. </p>
      <p>So this becomes exactly what’s anathema to the whole concept!<br>
      If you apply selectivity, you’re introducing an arbitrary<br>
      judgement of what’s “correct”, which can only be one’s own<br>
      idea of what’s correct, not Griffo’s. So instead of selectiveness<br>
      of input, what you really need is simply more input.</p>
      <p>You exclude nothing, because you just don’t know. You can<br>
      only feel, and that has little place in this type of effort.</p>
      <p>&gt; averaging gives inkpress radiating to equal distances from the metal</p>
      <p>Note however that ink spread can be asymmetrical, and for more reasons than one. One reason is the paper: it can hold/spread ink differently in each dimension; see this example from a low-grade Armenian newspaper:</p>
      <p><a href="http://www.themicrofoundry.com/other/armnews2.gif" title="http://www.themicrofoundry.com/other/armnews2.gif">http://www.themicrofoundry.com/other/armnews2.gif</a></p>
      <p>Another issue is slur: if you might end up using a cylinder press (something Aldus of course didn’t use) to reproduce/test these forms, the looser your makeready the more your gain will be greater in the vertical direction than the horizontal. This is especially if you apply extra pressure (see below). In the end, every little thing affects the results; maybe even the use of ink rollers instead of what they used then: ink balls.</p>
      <p>BTW, something I’ve been meaning to point out:<br>
      One serious problem with the method of using a magnifier to see the “3D”* effect (that a scanner can’t show**) is that the more impression pressure a piece has the less faithful it is to the type! Which is sort of self-defeating. Quite often in fact (Fleischmann comes to mind) a designer’s intentions seem to have been squashed -quite literally- by bad presswork, leaving us with an even harder job of extracting intent.</p>
      <p>* Actually, 2.5D, in CAD-speak.</p>
      <p>** Except of course if you use some fancy<br>
      image-processing and 3D glasses.  :-)</p>
      <p>hhp</p>
