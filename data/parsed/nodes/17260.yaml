      <p>OK Nick: the mission statement is essentially an expression of piety. I am not as wholly naive about revival as I may, for brevity's sake, have given you to understand; and I know the complexity of Justin Howes' superb work, about which I recently spoke with a mutual friend.</p>
      <p>To be more explicit, and perhaps more honest: I want to produce a set of letters as close as possible to the printed images Griffo while working can most reasonably be conjectured to have predicted, from type freshly cast from the first matrices struck from his new punches, evenly inked, and pressed into paper consistent in texture and thickness with zero bounce (not the same thing as a consistent apparent baseline/x-height - indeed I think Griffo, perhaps following his experience of making Greek type, cut variety in vertical alignment into his latin punches). What I am not trying to do is simulate Aldus' or Soncino's page, which I agree is not remotely possible without (as would be very pleasant) making a separate version for matrix engraving (and even then...). So: I've got to interpret, but I want to avoid selecting specimen letters. Now perhaps Griffo's expectations for his letters were so irreducably plural that modelling them in their most characteristic forms (ie averaged, then drawn rather than traced to take into account damage, clean out inkpress, and harden angles) would be pointless. But would he really, with his graver, have excitedly anticipated all the splodges and blurs given his work by second rate press-work? If so, I will misinterpret him fatally, but I would still like to see what comes out of the other end of this project.</p>
