      <p>My experience with this, is that the best way to revive from metal, is to do the first part of what you've done well. Examine large, a wide variety of letters. But when I do this, I've already got a list of things that go wrong, from the punch, to the paper, and from then to now (if it was a long time on the paper). So, I have a growing "typographic dictionary of errors", like "Dumb Struck" (a pack of letters with a distortion as if a punch head were too far from the user for the position of the punch face at time of strike. Or some of my other favorites like "Cat Walked", "Dropsies" or "Secret Filing" ('twixt chase and slug). My modern favorite, "Full Page Variouching", occurs, when faxing a full newspaper page to plate, burping, sometimes repeatedly, causes letters to change width and weight (variations at last!) in a typographically painful narrow strip from head to foot of an entire page, (see NY Times, (only if outside metro area???)).</p>
