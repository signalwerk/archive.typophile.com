    <p>Here is one version of the wordmark I did for Geoffrey Castle. The idea was to capture the energy of Geoffrey's amazing electric violin playing. His logo (not shown) is a rendering of a violin, which I did not design but which I have vectorized, and use in a pattern that is displayed in grey on the right of the type. Perhaps there could be some extra space around the word "violinist". This version of the workmark however is for portfolio use only as final version did not have word "violinist".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Violinist.jpg"></div><p></p>
