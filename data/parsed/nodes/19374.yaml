      <p>in my opinion, it looks a tad bit crowded.. maybe its just me, and my lazy eyes, but theres too much going on at once for me .. i cant really focus. </p>
      <p>it might be the 'violinist' part being too cramped up, as prakash nair said, or it could be, that there might be too much swirls going on. but by reducing the swirls, you might take away the energy. </p>
      <p>Maybe you could work on a version that has a balanced feel to it, ie. less swirls, same amount of energy.</p>
      <p>hope that helps.</p>
      <p>edit: i like it anyhow though..!</p>
