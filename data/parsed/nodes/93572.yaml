    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Music_3705.png"></div><br>
    I made a Futura-esk type family for Music Finland; MusEx and FIMIC merged (that's two organisations promotin Finnish music). I wanted to make a more rigid, sort of Italian modernistic version of Futura/Century Gothic, with some contextual alternates. How do you think I came off?<p></p>
