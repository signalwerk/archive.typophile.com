    date_raw: 20 May 2009 — 11:38pm
    votes: null
    html: |-
      <p>My inspiration?<br>
      Well, one day I was having a look at the sun ... wearing no sun glasses and I saw a bunch of little stars contrasting beautifuly against the sun. Why I was looking at the sun hasn't become clear to me. But it was a moment of eureka!<br>
      The start of a beautiful project.</p>
      <p>I think I will name it: O, simplicity. What do you think?</p>
      <p>A few days later - by the way - I realized that it didn't matter from which angle you look at our yellow spot in the sky. It remains circular.</p>
      <p>A revelation.</p>
      <p>Wow.</p>
