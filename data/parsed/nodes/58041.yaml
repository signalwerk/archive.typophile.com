  html: |-
    <p>Hi there<br>
    I have always wanted to make an ambigram.<br>
    Just for fun, but never came around to it.<br>
    Beside that I did't like the blackletter-style, medieaval-styl ambigrams. So I never started on it. No idea what else they should look like.</p>
    <p>But finaly I did and am very surprised by the outcome.</p>
    <p>I think I made an ambigram that is perfectly readible upside down, but even on its sides! Well, I think it does.</p>
    <p>Please share your thoughts.</p>
