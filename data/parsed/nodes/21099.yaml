    html: |-
      <p>Thank you for all the comments. </p>
      <p>I suppose that calling this an ode to typography was slightly incorrect.  This was more of an experiment in typography for myself. There wasn't really an underlying theme except for the fact that this has to do with typography and it's 2006!  </p>
      <p>Each baseline is cut at alternate 3 degree angles.  I like how on each line there's a sliver of the serif left behind to imply a delicate quality to the letterforms and at the other end the letter seems to be a  mix between serif and sans. </p>
      <p>This was just a puzzle for me, and I have, in the past, had a hard time composing elements.  I figured the random shards of letterforms would make for nice abstract pieces of a puzzle to work with. </p>
      <p>I do suppose it is 'dated' feeling already, but I'm okay with that! Once I can make solid compositions, I will head for a more cutting edge feel in my layouts.</p>
      <p>Thanks again for taking the time to critique my post.</p>
