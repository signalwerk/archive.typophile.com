    html: |-
      <p>I take the incomplete letters along with pieces of characters as a hint at the "working" type. This composition, to my eye, talks about craft of using type. I think the weakness of the design is that the bits of letters become to decorative. I think maybe the bits should look as though they have been set aside or as if they are not yet included in the artist's work but may soon be needed (like a palette of letter parts). </p>
      <p>Really that is how i work. I will key some type in illustrator, then tear it apart, deform it, whatever and then put it back together. During the process i keep all sorts of copies, different approaches, etc just laying around the artboard. </p>
      <p>Perhaps this cover could be a "snapshot" of the process of working with type.</p>
