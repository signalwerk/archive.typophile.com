    html: |-
      <p>Using ligature would be right choice in this case, but this doesn't explain why contextual substitution didn't work. </p>
      <p>Having empty backtrack and lookaheasequenceses should be perfectly valid. In fact, empty contexts are used to implement 'ignore' keyword in AFDKO syntax or EXCEPT in VOLT.</p>
      <p>If you have access to computer with Windows installed, you can try the same font and text in Notepad and see if it works there.</p>
