    <p>I'm working with a student on some experimental font designs and learning to code Opentype features.<br>
    <a href="http://ilovetypography.com/OpenType/opentype-features.html" title="http://ilovetypography.com/OpenType/opentype-features.html">http://ilovetypography.com/OpenType/opentype-features.html</a><br>
    <a href="http://forums.adobe.com/thread/395648" title="http://forums.adobe.com/thread/395648">http://forums.adobe.com/thread/395648</a></p>
    <p>While these two links were invaluable, we've got a simple snippet of code that is confusing when trying to sub many to one. The thinking was to swap out certain typed words with a single "word" glyph using more efficient coding than the letter at a time method Thomas described in his link. </p>
    <p><code>feature calt {<br>
    <em>sub t' e' s' t' by test.word;</em><br>
    } calt;</code></p>
    <p>The code below usually works fine except in the case that the word is immediately repeated. Then it appears to "oscillate" and only substitutes every other sequence of letters. Note that this happens whether a space is used or not to separate the repeating letter sequence. Our question is Why?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/screenshot_6326.png"></div><p></p>
