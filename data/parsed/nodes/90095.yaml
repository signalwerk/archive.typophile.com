      <p>Andy, probably this didn't work because 'calt' expects some context:</p>
      <p><cite>A Chain Substitution rule target sequence has three parts: backtrack, input, and lookahead glyph sequences. A glyph sequence comprises one or more glyphs or glyph classes.</cite></p>
      <p>(<a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f" rel="nofollow">5.f. [GSUB LookupType 6] Chaining contextual substitution</a>, from Adobe's "OTF Feature File Specs)</p>
      <p>It appears to me you are replacing everything, always. Khaled is right, these are ligatures.</p>
