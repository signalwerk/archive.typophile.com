    html: |-
      <p>Since this is a plain ligature, why using <code>calt</code> at all (I don't see you actually doing any contextual substitution), a plain <code>liga</code> should work just fine:</p>
      <pre>feature liga {
        sub t e s t by test.word;
      } liga;
      </pre>
