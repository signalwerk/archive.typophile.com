    html: <p>Since this DTP Types, "started in 1989", surely doesn't own <br>the rights to this old typeface, I thought I'd mention two other, <br>reasonably priced sources. <br> <br>The Solotype Catalog shows this typeface under the name <br>Pretoria (no n on the end). Brendel Informatik digitized it by <br>that name and offers it via the <a href="http://www.qbf.de/tceng.htm" target="_blank"> Quick Brown Fox</a> website. <br> <br>Dieter Steffmann digitized it as <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/v/vivian.htm" target="_blank"> Vivian</a>. <br><br></p>
