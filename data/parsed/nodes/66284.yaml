      <p>I meant uncommon for a <em>tech website</em>. I have looked at dozens upon dozen sites and very few stray away from the straight-forward columnized layout. That's <em>if</em> they have a notion of a layout to begin with :-)</p>
      <p>Riccardo, I hear you regarding the icons, they add considerably to the site appearance. I just haven't decided where they should go yet. </p>
      <p>Nina, I agree with regards to the width of the text column. I had this concern but decided not to mention it to see if someone else would bring it up.</p>
      <p>One other change that I'm considering is to break the text into smaller sections like so - <a href="http://certtime.com/sketches/layout-3.png" rel="nofollow">Option 3</a>.</p>
