    html: |-
      <p>I like #2. I agree though that it's not all that uncommon; it just seems like a smart choice in this context. The rhetorical questions and very brief paragraphs seem to do a good job of drawing the viewer/reader in more quickly. The only thing that's very slightly bugging me is that the measure seems to be a tad on the longish side. Can you make that column a little bit narrower,* or the type a bit bigger? Barring both options, I might increase the leading a bit. But it's really not a big problem.</p>
      <p>* Don't let it get wider than this, in case this is a fluid layout.</p>
