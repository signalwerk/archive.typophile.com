    <p>Need a bit of help deciding between two grid options for a website I'm working on.</p>
    <p><a href="http://certtime.com/sketches/layout-1.png" rel="nofollow">Option 1</a> is more of conventional columnized layout.</p>
    <p><a href="http://certtime.com/sketches/layout-2.png" rel="nofollow">Option 2</a> on the other hand is a fairly uncommon layout, which is however far less boring. It also seems to be more effective in content presentation as it is more compact without being busy or cluttered.</p>
    <p>Does anyone agree ? Or is the second one too fancy for its own sake ?</p>
