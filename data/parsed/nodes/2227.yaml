  html: "<p>k, first of all: this is nearly the first logo for client i do. dob - der online berater (which is german) means something like the online consultant (not my idea). <br> <br><img src=\"http://www.typophile.com/forums/messages/29/21386.gif\" alt=\"\"> <br> <br>spacing isn't adjusted yet. i'm running out of idea. dob are 3 nice letters (form), aren't they? nevertheless i'm stuck. <br>no.1 &gt; my first idea (:// from http, as it has to do with online) <br>no.2 &gt; my 2nd idea, which looks too much olympic / audi like <br>no.3 &gt; the client idea, which i don't like <br> <br>anyone wants to play with dob ... it shouldnt be that hard, i thought these 3 letters match very well, but ... help! thanks: lars <br></p>"
