  html: |-
    <p>Hi everyone,</p>
    <p>I'm desperately looking to find what font is used for the branding of the National Theatre of Greece (used in all their publications as well as in their logo). Here is their website <a class="freelinking external" href="http://www.n-t.gr/en" rel="nofollow">http://www.n-t.gr/en</a><br>
    The website of the designers of the new brand <a class="freelinking external" href="http://www.mnpdesign.gr/" rel="nofollow">http://www.mnpdesign.gr/</a></p>
    <p>I also include some visuals. (Note the particularity of the uppercase R in the logo or the lowercase b in the English tagline)</p>
    <p>Thanks a lot !</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LogoNationalTheaterEnglish_6707.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/taglineEnglishSeason20102011_3906.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/taglineGreekSeason20102011_5106.png"></div><p></p>
