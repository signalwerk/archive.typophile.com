    <p>Hi everyone,</p>
    <p>This is my first attempt at an identity project, and not having proper graphic design (much less typographic) training under my belt, I would really appreciate some feedback from more discerning eyes!</p>
    <p>The "client" is a technology startup, looking to make sense of financial networks.  The goal of the identity therefore is to convey the idea of innovation, and data connections on a global scale.</p>
    <p>I'm unsure about the proportions here, but my main conundrum is that I would like for the text and the graphic to have a visual relationship, e.g. echo each other in some small detail of form (I'm thinking United Airline's original logo by Pentagram here...)  Any suggestions?  I'm also afraid that it looks really boring.</p>
    <p>I am certain I have overlooked / am unaware of many other problems, so please do help!</p>
    <p>Thanks a lot,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophiletest_3997.png"></div><p></p>
