      <p>Agnes, I'm seeing a lawn sprinkler company. Or St. Louis arch or Sydney opera house if I were to be pressed for more associations. The mark appears to be completely detached from the concepts of finance, networks and analysis. You could potentially get an K out of it by flipping it horizontally, but this would still not add a meaningful and recognizable concept to it. </p>
      <p>Consider dropping the mark off completely for now and focusing on a typography as it too needs work. The "Global Markets" part looks off, the R lacks stable footing (for something that is involved with "Global"), the text is either too loose or too tight. Also it is too light. Flip through the typefaces (e.g. on MyFonts), consider a heavier weight, italics, small caps and lowercase. Slabs and serifs... just play with the type and try and find one that captures "technology, making sense, financial networks". Then, based on the type see what could work as a mark.</p>
