      <p>I disagree with apankrat about the mark. Kinetic means energy in motion, and the mark conveys energy and motion. The arches, to me, look like those travel lines drawn across the globe to indicate air travel. It reads as "global energy" to me, which I think is very appropriate for the company. </p>
      <p>The first set, first row works the best IMO. I might try putting the mark over the type, possibly even looking for optical connections between the top of the stems and bottom of the arches? The second line of type needs a more stable font; and stick to small caps. </p>
      <p>The second set (your second comment) starts to look like waterfalls, which doesn't work. Strong color choices will squash the water associations -- just stay away from shades of water! Finance companies tend to stick to greens, grays, browns; but color should really be your absolute last step.</p>
