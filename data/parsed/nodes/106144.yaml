    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jp_textbook_latin_4128.jpg"></div><p></p>
    <p>This font is used in the english headers in a modern (2000-something) textbook teaching Japanese to English-speaking folks. I have seen it elsewhere too, in the english section of Japanese instruction manuals for instance.</p>
    <p>While looking around the net, I have found quite a few fonts that are very close to this (using WhatTheFont and similar services) but none of them have managed to suggest an exact match. </p>
    <p>Microgramma and Eurostile are quite close, but there's no cigar involved there... An important detail to match is the rounded-square nature.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        New Rodin (Fontworks)        </div>
            </div>
    </div>
