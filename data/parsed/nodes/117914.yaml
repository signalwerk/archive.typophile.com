      <p>My vote is for  ITC Veljovic -- Joshua says he read a book set in it -- because it's not going to be too distracting to the reader who wants to get through a novel without being constantly hit in the face by details of the font, while at the same time it has an effective haunting emaciated thorny look. In my opinion it works for extended text because it is is not a high contrast font. Leaving aside the sharp details, the light weight and low contrast is very similar to the Victorian Lightface text fonts that were condemned from the 1890s onward as being too wispy -- which might we might freely interpret as lacking the vigor of life in the flesh.<br>
      As for the Lovecraft fonts, note that they were created as "prop fonts" that work well in a prop document seen on screen, but would be technically inadequate for a book.<br>
      Don</p>
