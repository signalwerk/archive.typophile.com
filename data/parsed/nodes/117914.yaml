    <p>I am curious about peoples opinions and experiences. Just a hypothetical question: if you were to choose a typeface for a novel in the creepy genre, what would you use? There are elements of fantasy in the storytelling, but also quite some chill factor in the creepy sense.</p>
    <p>My feeling was going towards something with edgy serifs, higher contrast, nothing rounded at least. It should be comfortable to read, yet leave an unsettling hint? Walbaum, perhaps?</p>
