      <p>BTW try setting a full page in your font at the point size you want for your book and look at it. If nothing stand out as dark spots or fade outs, this is a good sign that the reader will be able to quickly scan the content without distraction. Just an opinion, but I would do it if I was trying an unusual font.<br>
      Don</p>
