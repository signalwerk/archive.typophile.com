      <p>A typeface imitating time-worn letterpress may work, if it matches the book’s time.  One example is <a href="http://myfonts.com/fonts/ephemera/coldstyle/" rel="nofollow">Coldstyle</a>, I’m sure there are better ones:</p>
      <p><img src="http://666kb.com/i/cq0bgwze8wjyxabsh.gif" title="hosted by 666kb.com"></p>
      <p>However, some will consider it a bad imitation.</p>
      <p>Another font in the spikey genre is <a href="http://myfonts.com/fonts/itc/veljovic/" rel="nofollow">ITC Veljovic</a>:</p>
      <p><img src="http://666kb.com/i/cq0bkhhz4utxbgfu9.gif" title="hosted by 666kb.com"></p>
      <p>I’e read a book typeset in it, and it worked surprisingly well for me as a text font.  The regular weight is quite light, which may be in line with a notion of creepy silence and shrinking because of fear.</p>
