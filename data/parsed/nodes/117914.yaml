      <p>Perhaps this is way too subtle, but I like Espinosa Nova: <a href="http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/" title="http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/">http://www.myfonts.com/fonts/estudio-ch/espinosa-nova/</a><br>
      I see some people have named sharp typefaces which I don't think I would've picked, but if you want a bit murky yet sharp then Mokka may appeal to you: <a href="http://www.myfonts.com/fonts/ludwiguebele/mokka/" title="http://www.myfonts.com/fonts/ludwiguebele/mokka/">http://www.myfonts.com/fonts/ludwiguebele/mokka/</a></p>
      <p>Lexicon I would also consider murky yet sharp and Trinité is particularly dark. Expensive but it may be a viable option.</p>
      <p>I also have to think of Tribute. It doesn't feature bold but if you're setting a novel you may not need it. <a href="http://www.myfonts.com/fonts/emigre/tribute-ot/" title="http://www.myfonts.com/fonts/emigre/tribute-ot/">http://www.myfonts.com/fonts/emigre/tribute-ot/</a></p>
      <p>Satyr is very dark to me; perhaps a bit too dark. Alegreya seems to be somewhat in the same vain yet it's not as dark as Satyr. <a href="http://www.myfonts.com/fonts/huertatipografica/alegreya-ht-pro/" title="http://www.myfonts.com/fonts/huertatipografica/alegreya-ht-pro/">http://www.myfonts.com/fonts/huertatipografica/alegreya-ht-pro/</a></p>
