      <p>You might either go for angularity/spikiness as indeed in Preissig, but that’s maybe a bit more in-your-face scary; or perhaps something more organic with a slightly unusual/unsettling tension – Satyr was my first thought (especially since you say fantasy too). <a href="https://monokrom.no/fonts/satyr" title="https://monokrom.no/fonts/satyr">https://monokrom.no/fonts/satyr</a><br>
      I guess it depends whether it’s psychological creeping-under-your-skin uncanniness (“something’s not quite right here”) that you’re going for, or a more blatant scary vibe à la people walking through an empty castle waiting to be impaled by barely concealed spikes sticking out of every surface. :)</p>
