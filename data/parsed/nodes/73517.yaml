    <p>New standard being installed on latest browsers (some now and later),<br>
    for example Mozilla Firefox and IE allows for fonts to be easily used<br>
    on Blogs and Websites.  This is the Web Open Font Format or WOFF see<br>
    <a href="http://en.wikipedia.org/wiki/Web_Open_Font_Format" title="http://en.wikipedia.org/wiki/Web_Open_Font_Format">http://en.wikipedia.org/wiki/Web_Open_Font_Format</a></p>
    <p>BBT font introduced in 2008 for altering the k/K letter shapes for<br>
    spirituality has been updated for this new standard.  Now you can use<br>
    it on Blogs with easy code snippet called @font-face and some changes<br>
    to the Blog CSS stylesheet.</p>
    <p>This is a blog using the BBT font as an example:  <a href="http://BBTfont.blogspot.com" title="http://BBTfont.blogspot.com">http://BBTfont.blogspot.com</a></p>
    <p>Photo with the BBT font are here:</p>
    <p>HTML for Websites  &lt; a href="http://tinypic.com?ref=33epjja"<br>
    target="_blank"&gt;<img src="http://i33.tinypic.com/33epjja.png" border="0" alt="Image and video hosting by TinyPic"> </p>
    <p>(nb delete the space between &lt; a above, done for the board software)</p>
    <p>IMG Code for Forums &amp; Message Boards [IMG]http://i33.tinypic.com/<br>
    33epjja.png[/IMG]</p>
    <p>URL for E-Mail &amp; IM  <a href="http://tinypic.com/r/33epjja/4" title="http://tinypic.com/r/33epjja/4">http://tinypic.com/r/33epjja/4</a></p>
    <p>Direct URL for Layouts  <a href="http://i33.tinypic.com/33epjja.png" title="http://i33.tinypic.com/33epjja.png">http://i33.tinypic.com/33epjja.png</a></p>
    <p>For using it on your blog see instructions here:<br>
    <a href="http://openfontlibrary.org/media/files/BBT/221" title="http://openfontlibrary.org/media/files/BBT/221">http://openfontlibrary.org/media/files/BBT/221</a></p>
