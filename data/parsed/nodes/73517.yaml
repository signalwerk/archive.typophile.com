      <p>@paul.irish</p>
      <p>Someone else said the same.  </p>
      <p>They also said this about webfontloader, "my understanding is: it can work with any font whether it's hosted by Google, hosted by Typekit, or hosted yourself. In my experience - there are very few cases where the benefits of the webfontloader can be seen. These are primarily with larger fonts that haven't been cached or subset for a specific website or in an application where significant aspects of the typography can be changed base on an end-user font selection."  </p>
      <p>The other thing is that there is little information available about webfontloader: download/install, correct me if I am wrong.  </p>
      <p>Your site also says this 'caveat': "If JavaScript is disabled, the text will remain visible the whole time" and "Mozilla is looking to rectify this soon."</p>
      <p>Thus are you saying if WOFF font is there and JavaScript is not accepted on the browser options, the font will not be seen and even if webfontloader is installed it could have to be uninstalled soon as browsers (Mozilla Firefox)  that have the slight delay in displaying are going to be correcting the problem?</p>
