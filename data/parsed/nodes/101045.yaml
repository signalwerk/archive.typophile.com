      <p>I want to wish you success on your project and share some ideas. Creating a proper meshet font will also help those of us trying to OCR old documents. I've been wanting to help make such a font for a while and I'm happy to help any way I can, so long as your work is open source.</p>
      <p>First, I urge you to develop this font with an open-source license, so as to permit others to easily collaborate and build on your work. Here's an example of an excellent open-source font license, the <a href="http://en.wikipedia.org/wiki/GPL%2BFE" rel="nofollow">GPL+FE</a></p>
      <p>Likewise, I think you will be able to learn much from the work of other open source Hebrew fontographers. Have you heard of the <a href="//culmus.sourceforge.net/" rel="nofollow">Culmus Project</a>? Maxim Iorsh and Yoram Gnat are two open source Hebrew fontographers in Israel. Yoram in particular helped me out with a Rashi font. Let me know if you need any help making contact with them.</p>
