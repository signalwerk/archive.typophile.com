    <p>Dear Forum</p>
    <p>I am very brand new to this.</p>
    <p>I really wish to create a PROPER Yiddish font, since i type a whole lot in that language.</p>
    <p>I won't go into details now.</p>
    <p>I am trying to use Font Creator to make the font.</p>
    <p>But I have a whole lot of problems.</p>
    <p>I want to use the font with Microsoft Word</p>
    <p>I need a lot of help, especially with the left to right - right to left problem.</p>
    <p>I have no trouble creating the glyphs I need.  They are based on a simple<br>
    Hebrew font with about 10-15 additional glyphs, which are used only<br>
    in Yiddish.</p>
    <p>I do not need any Latin characters, but I want to be able to use both<br>
    upper case and lower case to create the needed new glyphs</p>
    <p>If you think you can help me,<br>
    I would VERY MUCH<br>
    like to have somebody as a kind of mentor to get me through this.</p>
    <p>I am willing to spend a  lot of time with this, but I need some direction,<br>
    especially at first.</p>
    <p>Contact me at</p>
    <p><a href="mailto:caspari@tx.technion.ac.il">caspari@tx.technion.ac.il</a></p>
    <p>I will surely reply to any responses,</p>
    <p>Thanks a lot</p>
    <p>David Tal</p>
    <p>Haifa, Israel.</p>
