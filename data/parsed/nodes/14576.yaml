      <p>Ligatures can have two roles: <em>style</em> and <em>function.</em> ‘s_t’ and ‘s_c’ ligatures are examples of the former; ‘f_f_l’ is an example of the latter. As a typeface designed for magazines and books, Omnium concerns itself only with functional ligatures which solve spacing problems. The ‘s_t’ ligature is beautiful, but unnecessary and can be seen as a distraction in immersive reading. Omnium’s ‘f_f_l’ ligature is almost entirely at the function end of the scale. It solves the problem of the undesirably close ‘f’ and ‘l’, adjusting the character shapes slightly to allow comfortable spacing. Rather than taking a purely functional approach to the f_f combination, I chose to unite, rather than shorten, the crossbar between the two. Perhaps a shortening of the offending crossbars (hence avoiding any binding of the letters) would have been a more ‘invisible’ solution, however the long crossbar seemed more in tune with my goal of horizontal emphasis. And can a ligature still be called a ligature if it does not bind, but serves only to space?</p>
      <p>I hope that, in avoiding distractive ligatures, Omnium is not considered bland.</p>
      <p>For similar reasons, I have replaced the original non-descending ‘Q’ with a more standard and predictable design. However, I have kept the original non-descending ‘Q’ as an alternate for the odd occasion when someone might like to set a heading in caps without descenders, perhaps with a rule below.</p>
      <p>I am pleased that Omnium reminds you of Garamond and Griffo. In fact, the name <em>Omnium</em> comes from that much referred-to <a href="http://omnium.danmilne.fastmail.fm/files/ jenson_scan76.gif" rel="nofollow">page from Jenson in <em>De Evangelica Preraratione,</em> Venice, 1469.</a> It is a word chosen both for its ‘physical’ beauty and for its meaning: it is the genitive plural of Latin <em>omnis,</em> meaning <em>all</em> or <em>of all.</em> But it is the Jenson text’s rhythmic nature and the strong horizontal lines, rather than the beautiful ligatures, which have contributed to the design of Omnium. As a straight-forward and business-like typeface, Omnium may not benefit from such stylistic ligatures. Perhaps they can be developed as a side-project. As you suggest, it would be a great challenge to design harmonious ligatures for such a rigid, geometric typeface. </p>
      <p>&gt;therefore I think that the choice to draw the ‘Q’ and the ‘J’ below the baseline is “typographically correct”</p>
      <p>The descending ‘Q’ and ‘J’ should not be seen as more ‘typographically correct’. The descending ‘J’ makes it easier to achieve even spacing (with fewer white space anomalies which disturb the horizontal movement of the reader’s eyes), but I would argue that as a form of the ‘J’ it is no more conventional than the non-descending model. Even as I draft this post in Microsoft Word, I notice that Morison’s ever-present Times New Roman sports a non-descending ‘J’. And most sanserifs as well… Omnium will use non-descending ‘J’s at the start of words and descending ‘J’s otherwise.</p>
      <p>Dan</p>
