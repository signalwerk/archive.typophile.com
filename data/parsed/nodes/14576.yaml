      <p>Hi Hrant.</p>
      <p>Thankyou for your detailed critique and words of encouragement: lots of things for me to think about.</p>
      <p>In terms of proportion and colour I think I have been too vague in stating my goals – sorry. Rather than 8 or 9pt regular, this typeface should probably be seen as a semi-light for setting at 10pt. I intend to create a regular, semi bold and bold in the future. I started with the lightest weight because I’m told that this is the most difficult to establish in terms of curves and stroke variation.  </p>
      <p>Therefore, as at 10pt semi-light, I imagine I should increase my ascenders somewhat and maintain the same level of colour? Further down the track, I’d like to create a caption cut with reduced extenders for setting at smaller sizes.</p>
      <p>The colour of Omnium has simmered down during the testing process. I’m aiming to find the smallest amount of stroke variation which still conveys its rotated humanist axis at 10pt (with laser output.)</p>
      <p>With regards to proportions, a small preliminary comparative analysis I did may be of interest:</p>
      <p>Before I started drawing Omnium, I made a rough analysis of a bunch of typefaces in terms of proportion and colour, making measurements and comparing them as percentages of each typeface’s x-height (which I believe to be the most useful benchmark in terms of comparison). I measured ascender and descender lengths, maximum stroke thickness (typically the stem of the lc d), minimum stroke thickness (crossbar on the lc e). I divided min stroke thickness by max stroke thickness to give me a crude measurement for comparing the variation stroke thickness. To measure how condensed each typeface was, I measured the widths of lc d, e and o. I also measured the axis of stroke variation for each. A table of data can be viewed here: </p>
      <p><a href="http://omnium.danmilne.fastmail.fm/files/omnium_decon.pdf" title="http://omnium.danmilne.fastmail.fm/files/omnium_decon.pdf">http://omnium.danmilne.fastmail.fm/files/omnium_decon.pdf</a> </p>
      <p>Numerals:<br>
      Yes. I am very keen on the idea of hybrid numerals: not to replace the lining numerals, but to replace the old style ones. I’ll explore some possibilities.</p>
      <p>Thanks again for your advice. I’ll post a revised version ASAP.</p>
      <p>Dan</p>
