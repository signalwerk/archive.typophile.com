      <p>Hi Paul,</p>
      <p>Thankyou very much for taking the time to look at my typeface and for your detailed suggestions. They are very helpful. Apologies for my delayed reply: it is early Sunday morning here in Melbourne.</p>
      <p>Omnium is intended for reasonably extended setting in magazines and books. I think it has probably ended up with too much personality for serious continuous setting.</p>
      <p>I have been steadily rounding the counters from what started out as a much more extreme typeface. I’d like to remove some of that boxy discomfort without losing too much of the angularity in the counters which gives the typeface much of its personality. As you suggest, only some of the counters are problematic.</p>
      <p>I’ll give some more presence to the terminals and the crotches and deal with soften the more awkward curves. I prized the crotches apart (so to speak) in order to achieve even colour -- probably at the expense of the strength in some of the intersections. I suppose I can keep the ink traps to some extent. They just need to be more subtle.</p>
      <p>You guessed correctly on the doubled-n m. A trap for young players, I guess.</p>
      <p>My intention with the old style numerals is to find a size which works well within text with lowercase but which also works with longer strings of numerals in their own right. I find that the height of old style numerals often jumps about too much with certain combinations like 345 688 120 (see <a href="http://omnium.danmilne.fastmail.fm/files/num_demo.jpg" title="http://omnium.danmilne.fastmail.fm/files/num_demo.jpg">http://omnium.danmilne.fastmail.fm/files/num_demo.jpg</a> ). </p>
      <p>When you suggest taking the height of the numerals up, do you suggest increasing all numerals or making the ascenders ascend more and the descenders descend more? I guess I’ll try some options and see what works. I also intend to develop a cap-height lining set.</p>
      <p>Hi Oribendor,</p>
      <p>Thanks very much for your words of encouragement. The type design scene here in Melbourne is small but I’ve had plenty of advice from local typographers and type designers with more experience than myself. I have spent quite a lot of time looking at Dutch typefaces and I think a lot can be learned from sites like this one!</p>
      <p>As you guessed, I sketched the letters first and as Andreas suggested, the curves are made up of broken forms which I am trying to reconcile into flowing curves. I’ve attached a sample of the kinds of drawings upon which my letterforms are based: <a href="http://omnium.danmilne.fastmail.fm/files/omnium_drawing.jpg" title="http://omnium.danmilne.fastmail.fm/files/omnium_drawing.jpg">http://omnium.danmilne.fastmail.fm/files/omnium_drawing.jpg</a></p>
      <p>Hi Andreas,</p>
      <p>Sorry you haven’t been to access the PDF. Hopefully it can be viewed at: <a href="http://omnium.danmilne.fastmail.fm/files/Omnium_serif_28_metrics.pdf" title="http://omnium.danmilne.fastmail.fm/files/Omnium_serif_28_metrics.pdf">http://omnium.danmilne.fastmail.fm/files/Omnium_serif_28_metrics.pdf</a></p>
      <p>Once again, thankyou for your contributions.</p>
      <p>I'll make some adjustments to the typeface and post an updated version in the next couple of days.</p>
      <p>cheers,<br>
      Dan</p>
