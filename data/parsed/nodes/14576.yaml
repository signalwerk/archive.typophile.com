      <p>first of all, i should ask: what is the purpose of this typeface? any particular applications? This would effect what advice i would give in making revisions. For my comments i'm assuming it's a standard face for text.</p>
      <p>wow! i didn't even read dan's comments till after i looked at the face and his comments are the same as what mine would have been. just a couple more things:</p>
      <p><em>The bottom right of the b feels uncomfortable.</em><br>
      same goes for the top left of the bowl of the g (as i'm suspected it's the same piece, only rotated)<br>
      the inner counter of the o seems a bit too boxy. maybe smooth out the curves at 1 and 7 o'clock.<br>
      the bowl on the a could be a bit more angular/contrasty to match the other curved elements. and to solve the a's terminal problem, you might just make it a bit heavier on the end.<br>
      is that m a doubled n? even if not, it seems a bit too wide still.<br>
      i think that poor little s feels very uncomfortable. try to make it less disjointed.<br>
      looking at the pdf:<br>
      all the terminals look a bit hesitant (they go out with a whimper instead of a bang) i'm talking about a,f,g,j &amp; y.<br>
      the w has the same crotch problem as the v, as does the y.<br>
      The caps are very nice. Terminal problem on J. The stroke on the Q looks like it's not sure it should be there. Are those ink traps on the A, M, N, V, W (and v, w, y) if so i think they need to be re-thought so as to give more weight to the crotches (as dan stated before). The C seems a bit squonched, but i'm not sure exactly to suggest to fix that. The S and the Z seem to be leaning to the left. There should be more difference between the bowls on the P and the R.<br>
      My preference is for slightly longer descenders, but that could be just my personal preference.<br>
      The figures seem a bit small. i think taking the height up between the x-height and the cap height they'd look better. If you decided to make the descenders longer this would help the numerals, IMO.</p>
      <p>And as with all critiques by yours truly, a disclaimer: I am no expert, all advice is my own personal opinions and does not reflect the views of typophile and is to be taken with a healthy dose of salt. use this information at your own risk. i refuse to be liable for consequences caused by the adherence to suggestions or the lack thereof.</p>
