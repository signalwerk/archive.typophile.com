      <p>Hi Eduardo.</p>
      <p>Thanks for your feedback. I am actually quite pleased that you say my serif has a sanserif quality to it. It was always my intention to create a family of hybrids: to push the serif and sanserif designs as close together as possible… to make a serif which takes proportions and geometry from sanserifs without losing too many of the serif features which help readability: the humanist axis, the stroke variation and, of course, the serifs. </p>
      <p>In the same way, I’d like to keep as much of this humanist readability in the sanserif as is possible without straying too far from what is considered a classic sanserif.  So I’ve been waiting to stabilise the design of the serif before (gleefully) amputating the serifs, reducing stroke variation and making other necessary adjustments. </p>
      <p>So I'm not really deriving a sanserif from my serif. I like to think of them as twins who have grown up together :-)</p>
      <p>I started with more variation in stroke thickness in the serif, but the boxy, angular counters were looking very awkward and I was forced to retreat.</p>
      <p>If my serif appears to be too much of a ‘sanserif with serifs’, how do you suggest I improve it without increasing the stroke variation? I guess I could bracket the serifs a bit more?</p>
      <p>Dan</p>
