      <p>For 10 point, I'd definitely lengthen the ascenders a bit. But this sort of thing isn't done to maintain color, it's done to be in tune with immersive reading, which is helped by different proportions depending on size.</p>
      <p>&gt; I started with the lightest weight because I’m told that this is the<br>
      &gt; most difficult to establish in terms of curves and stroke variation.</p>
      <p>Maybe. But I'd rather see the design of the Regular done first, simply because that'll be used most. Note that basing things on an extreme weight can skew the Regular in peculiar ways: potentially interesting for display, generally bad for text. On the other hand, you're not really far from what I personally would like to see as the Regular weight of this design (a bit darker) so I don't think you'll have any such problems.</p>
      <p>&gt; <a href="http://danmilne.fastmail.fm/omnium_decon.pdf" title="http://danmilne.fastmail.fm/omnium_decon.pdf">http://danmilne.fastmail.fm/omnium_decon.pdf</a> </p>
      <p>Cool.</p>
      <p>hhp</p>
