      <p>Hi seml,</p>
      <p>Thanks for your kind words.</p>
      <p>Silmbach’s ITC Slimbach, Bilak’s Fedra Serif, Unger’s Demos &amp; Praxis, Carl Dair’s <a href="http://www.fonts.com/FindFonts/HiddenGems/Cartier.htm" rel="nofollow">Cartier</a> and Bloemsma’s <a href="http://www.evertbloemsma.nl/" rel="nofollow">Legato</a> all influenced me in various ways.</p>
      <p>Blokland’s Proforma is a great typeface. I was introduced to it after I did my first drawings for Omnium. It gave me confidence to keep the serifs long and unbracketed. I have just looked at it again and I think there might be some ideas there which will help me improve my italic.</p>
      <p>I wasn’t aware of Apollo, but I just checked it out and it looks like Frutiger had similar goals with his long baseline serifs and his very oblique axis of stroke variation.</p>
      <p>I drew my characters by hand and then in Illustrator before taking them into Fontlab. In retrospect, I should have taken them straight from hand drawings into Fontlab because it is so much more precise than illustrator and much easier to test your letters as you draw them.</p>
      <p>So far I’ve only made alternates for ‘Q’ and ‘J’. I originally planned to keep all my caps above the baseline, but I was never really happy with my ‘Q’ and the above-the-line ‘J’ makes spacing difficult so I developed <a href="http://omnium.danmilne.fastmail.fm/files/Omnium_Alt_ligs_230.gif" rel="nofollow">these.</a></p>
      <p>Do you have some suggestions for other alternates?</p>
      <p>My f-ligatures are simply joined at the crossbar, so I’ve used context dependent substitutions to substitute a single long crossbar’d ‘f’ with the existing I such that the letter combinations can be tracked freely… As opposed to stiff ligatures. If that makes sense…</p>
      <p>Dan</p>
