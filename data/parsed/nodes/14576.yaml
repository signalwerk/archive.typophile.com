      <p>Here’s a revised version of the italic.</p>
      <p><a href="http://omnium.danmilne.fastmail.fm/files/Omnium_ser_ital_23.pdf" title="http://omnium.danmilne.fastmail.fm/files/Omnium_ser_ital_23.pdf">http://omnium.danmilne.fastmail.fm/files/Omnium_ser_ital_23.pdf</a></p>
      <p>I have reduced the counters and narrowed the heads of many of the characters (Thankyou Eduardo, Hrant). The shapes are a bit softer and more cursive overall. I have also streamlined and simplified terminals on the curved extenders and added more curve to the tail of the ‘f’.</p>
      <p>I have made ranging default numerals as well as a lining set to go with the (hopefully seldom-used) small caps. I have also loosened the spacing slightly. Do you think the spacing is ok?</p>
      <p>Hi Eduardo,</p>
      <p>Thanks for your advice once again. I agree with you that <a href="http://typophile.com/node/14805" rel="nofollow">Omnium Sans</a> needs some work. It is clearly derivative of the serif and I think that as an individual typeface it struggles. As a supporting face for the serif it seems quite suitable, but I would like to see it rise above this level. I will turn my hand to it over the next few days.</p>
      <p>Hi Hrant,</p>
      <p>Firstly, thank you for your consistent, constructive advice. The design of Omnium owes you much! It is amazing how much difference the tweaking of an ‘s’ can make to the personality of a typeface. I explored the idea of the Dwiggins narrow-topped ‘a’, but I couldn’t make it work so I opted for a compromise in-between and adapted all the bowled characters. </p>
