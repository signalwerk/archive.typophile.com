      <p>I have made some changes to Omnium U&amp;lc and numerals. A PDF can be viewed here:</p>
      <p><a href="http://danmilne.fastmail.fm/Omnium_serif_55_metrics2.pdf" title="http://danmilne.fastmail.fm/Omnium_serif_55_metrics2.pdf">http://danmilne.fastmail.fm/Omnium_serif_55_metrics2.pdf</a></p>
      <p>CHANGES:</p>
      <p>I have lengthened the ascenders by 3%, the descenders by 1%. The Cap-height and stroke weights are the same as before.</p>
      <p>I tilted the bowl of the lc a down and gave it a serif terminal.</p>
      <p>I have given g, j, f, r, y more weight and more ‘scoop’ on their terminals. I am hoping to avoid a serif terminal on the tail of the lc g.</p>
      <p>I rounded the lc o ever so slightly. </p>
      <p>I narrowed the lc m.</p>
      <p>I put small rising ears on lc q and g, removing the unnatural serif from the g (much better for letterfit now) </p>
      <p>I put a ‘downward ear’ on the base of the lc b and opened the curve, Hopefully the awkwardness of the lower right of the lc b is now vanquished.</p>
      <p>v, w, y, M, N and W now have more weight in their crotches.</p>
      <p>I have squared up the corners of ‘s’ in U&amp;lc.</p>
      <p>Minor adjustments to the proportions of BCEFGKMPRU</p>
      <p>Added a serif terminal to J. I am keen to keep Q and J above the line – J at the very least. </p>
      <p>QUESTIONS:</p>
      <p>J is now wider, more stable. What thoughts?</p>
      <p>The new Q needs work. (The current form was inspired by Hrant’s prototypes on the Patria thread – thankyou). Too much like a flat tyre at the moment? Given the conformity of the other caps, I’m inclined to head towards a simple descending Q.</p>
      <p>Lowercase numerals:<br>
      I‘ve opted for lining 2/3 height numerals. I experimented with ranging numerals from that 2/3 height but numbers like 3 and 5 were floating on either side of the x-height / baseline so I ditched them for the lining option. I intend to make my small caps this size too. What thoughts?</p>
      <p>Does my lc t ascend enough?</p>
      <p>Any other observations?</p>
      <p>Many thanks,</p>
      <p>Dan</p>
