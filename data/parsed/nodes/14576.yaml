    <p>This is The-typeface-potentially-known-as-Omnium. </p>
    <p>It is a text typeface with a rotated humanist axis, designed with a large x-height with the aim of strong horizontal emphasis and even colour. A sanserif sibling is also under development. It is my first typeface. </p>
    <p>I’d love to hear your impressions, suggestions, criticism.</p>
    <p>I became acquainted with Fontlab for the first time last week so my spacing leaves a little to be desired. Let me know if you’d like to see samples in any other format.</p>
    <p><a href="http://omnium.danmilne.fastmail.fm/files//Omnium_serif_28_metrics.pdf" title="http://omnium.danmilne.fastmail.fm/files//Omnium_serif_28_metrics.pdf">http://omnium.danmilne.fastmail.fm/files//Omnium_serif_28_metrics.pdf</a></p>
    <p>Thanks!</p>
    <p>Dan</p>
