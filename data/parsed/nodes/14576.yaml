      <p>Hey, you're using my "metagram"! Cool. In case somebody (more like virtually everybody) doesn't know, a metagram is a fancy pangram that lets you evaluate a font much better:<br>
      <a href="http://www.microsoft.com/typography/links/news.aspx?NID=2454" title="http://www.microsoft.com/typography/links/news.aspx?NID=2454">http://www.microsoft.com/typography/links/news.aspx?NID=2454</a></p>
      <p>Anyway, onto this quite interesting font...</p>
      <p>First of all, the PDF is much more convincing than that GIF up top, so I'm glad you've made that available. This face has quite enviable poise. And I don't agree that "it has probably ended up with too much personality" to serve as a text face; as Schwartz's Houston Chronicle effort has hopefully proven, the text face envelope still has huge room for expansion, although in a direction seldom explored. That said, I think this still needs a lot of work to become adequate.</p>
      <p>My foremost "macro" critique is that the color is a bit light for the vertical proportions, which seem ideal for around 8 point setting. If that's too small a point size in terms of your target, I'd increase the ascenders a bit, shooting for 9 point; but I might still increase the color slightly. If you like shooting for 8 point, I would pull in the descenders a hair.</p>
      <p>Micro stuff:<br>
      "a": It needs to be happier - it's a very important character. I don't think the terminal of the top is the problem (it's certainly better than the one in the "g") but probably that the top of the bowl shouldn't be so horizontal - try tilting it gently.<br>
      "f": Could use a stronger beak.<br>
      "g": Give its terminal a serif, like in the "c". Or much better: make a binocular one... with an open bottom. But if you keep it mono, give it a nice rising ear.<br>
      "j": That chirographic terminal seems to actually work here.<br>
      "k": Best glyph so far!<br>
      "p": Bottom of the bowl too heavy.<br>
      "q": depending on what you do with the "g", consider a pointy ear.<br>
      "r": Majorly needs a powerful beak.<br>
      "s": At first I thought it was too "coiled up", but now I think it's da bomb.<br>
      "v", "w": Too much separation at the diagonal joins.<br>
      "y": As in the "j", the terminal works here.<br>
      "B": Slightly too wide.<br>
      "C": A bit too narrow.<br>
      "E": A bit too wide.<br>
      "F": I'd lower the bar.<br>
      "G": Slightly too narrow.<br>
      "J": Tail not working at all. Maybe descend it (if you end up descending the "Q").<br>
      "K": Nice, but a bit wide.<br>
      "M": Too wide.<br>
      "P": Slightly larger head.<br>
      "Q": Tail not working, especially inside. Not descend it?<br>
      "U": A bit too narrow.<br>
      "V", "W": Same problem as in the lc.</p>
      <p>Numerals:<br>
      I can only recommend what I so often do for text faces: hybrid numerals! Actually not far from what you already have, but taller than the lc x-height in body.</p>
      <p>All in all, great stuff - please keep it up!</p>
      <p>hhp</p>
