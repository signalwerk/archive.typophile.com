      <p>Here is <a href="http://omnium.danmilne.fastmail.fm/files/omnium_serif_italic_140.pdf" rel="nofollow">the latest version of the italic.</a> </p>
      <p>I have softened many of the character shapes so that they better match the serif and have removed those awkward top right-corners on the a, d, g etc, opting to expose the top of the stem instead (Thanks Brad). I have adjusted curves on the ‘m’ and ‘n’ as well.</p>
      <p>----</p>
      <p><em>Only two things I'd like to comment: the finishings of the 's' look a bit strong when compared with the finishing strokes of other letters e.g. the leg of the 'k', the one down right. The serif detail looks different. Is that on purpose or are you afraid of losing the squared shape? Also, that same purpose seems to affect the bowls like the one of the 'a', for instance. It gives it a broken shape, as intended, but I believe that the horizontal elongation should be enough to give the squared personality you seek, without being too attached to the roman attitude.</em></p>
      <p>The ‘s’ is much revised: I have rounded the curves and given it a bit more forward movement. I think the lack of squareness in the italic helps to differentiate it from the roman.</p>
      <p>Cheers,<br>
      Dan</p>
