      <p>Bringhurst has written that we shouldn´t try to make vain changes in what history has proven to work. Changes sometimes only scramble the code that is known for so many... therefore I think that the choice to draw the 'Q' and the 'J' below the baseline is "typographically correct". Although we look for changes in order to distinguish "our" drawings from others, is it also known that only the very careful and microscopic eye can distinguish the novelties. It has to be banal enough for you to read without changing speed and recognition, but somehow leaves a perfume of a personality that gives it taste.</p>
      <p>As for alternates, in roman type, the 'c's and the 't's can always fall is love, just like de 's's and 'c's, and the 's's and 't's. My advice is for you to look at the forms Slimbach made in Adobe Garamond, which drinks from Griffo's work in the Renaissance. But what I believe to be more interesting is the personality of the italic letter. There's a wonderful study in the work, also by Slimbach - Poetica. I had the honour of exploring this family on a small book on Old Music, through the combination of alternates, small caps, swash capitals and the chanceries, working aside with Bembo.<br>
      We should always learn from old ways. (Mrs Eaves by Licko shows that particular interest).</p>
      <p>Your typeface Omnium, in particular seems a challenge for exploring such a feature. I liked very much because it reminds me of the faces I have referred, but it has a touch of the geometric modernism that makes it interesting.</p>
      <p>I don´t know how valid you might think my critics are, since I haven´t drawn a typeface so far. I just a guy who loves letters and history and art, and the way that they interact.</p>
      <p>As I have said before, keep up the good work ;) and keep me posted. I'd like to see the evolution.</p>
