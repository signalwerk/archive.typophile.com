      <p>Ephemera specializes in distressed "movie" fonts:</p>
      <p><a href="http://new.myfonts.com/foundry/E-phemera/" title="http://new.myfonts.com/foundry/E-phemera/">http://new.myfonts.com/foundry/E-phemera/</a></p>
      <p>But that begs the Postmodern question, are you re-creating a facsimile of the document in its present state, a cleaned-up restoration of the original, or a high-res 21st century renovation?</p>
      <p>It really bugs me when I see a silent movie with the action is all scratchy and grainy and jumpy, but the intertitles are new, all sharp and clean and still.</p>
