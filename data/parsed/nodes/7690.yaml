    html: "<p>I believe that the 'salt' feature is currently not supported by InDesign; maybe that's the root of your problem. The 'salt' feature is only supported by Photoshop CS and Illustrator CS. [Link to <a href=\"http://store.adobe.com/type/browser/pdfs/OTGuide.pdf\"> PDF</a> on <a href=\"http://store.adobe.com/type/opentype/main.html;store\"> Adobe's website</a>: see page 13] <br> <br>HTH</p>"
