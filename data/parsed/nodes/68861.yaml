      <p>Here's a great thread about sloped romans, with lots of examples: <a href="http://typophile.com/node/29998" title="http://typophile.com/node/29998">http://typophile.com/node/29998</a><br>
      Basically, as you might know the classic concept is that Italics have different structures, which are closer to handwriting/calligraphy, including also some specifically differing letter shapes as Riccardo pointed out. This is what a sloped roman avoids. It is instead built upon the same structure as its accompanying Roman face, but slanted – of course not just mechanically though, a good sloped roman (also «slanted roman») is also a lot of work to design too (for one thing, the curves have to be re-balanced).<br>
      I would think that is the big difference to the «faux italic», which is just that, faux, means that if you hit the "I" button in Word on a font that doesn't have an italic, you get an artificially slanted version of the Roman, which generally looks horrid. Different thing.</p>
      <p>As for the axes, I'm assuming you're looking for the stress/contrast axis, which in humanist typefaces is usually slanted («diagonal stress»), in modern fonts [more] vertical. Compare the "o" of maybe a Garamond and a Didot to see what I mean. There are millions :-) of correct examples for these ones, the important thing is to learn how to look at/see them.<br>
      I assume «no axis» would be used for a font with no weight contrast, like Futura or something, but I'm not sure.</p>
