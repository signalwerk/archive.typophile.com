    <p>Hi everybody,</p>
    <p>I'm a student doing a uni assignment which asks that we find examples of typefaces from different categories.</p>
    <p>The ones I'm stuck on are these:</p>
    <p>• humanist axis<br>
    • vertical (rational axis)<br>
    • implied vertical axis<br>
    • no axis<br>
    • sloped roman</p>
    <p>If someone could please post examples and/or links to definitions of these categories (I've searched in books and on the net to no avail), that would be terribly appreciated :-)</p>
    <p>thanks again!<br>
    Steph</p>
