      <p><cite>I guess they’re hinting the gap much more open?</cite></p>
      <p>If I open with Acroread or Acrobat, at 100%, a pdf file containing those words in Baskerville 10pt, I see those open gaps on the screen. If I open the very same file with Preview, I don't. I was thus quite lucky to get that close match and the hinting would not be enough to explain the gap.</p>
