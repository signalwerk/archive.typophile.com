      <p>Even if they are originally based on a typeface, the individual characters in logos are often tweaked for harmony or visual effect. I'm with Ben -- this probably started life as Avant Garde and was stretched/manipulated by the designer. Not very well, IMHO: look at how thick the r is compared to the e, for example.</p>
      <p>Anyway, if you just need the logo as artwork, go here:</p>
