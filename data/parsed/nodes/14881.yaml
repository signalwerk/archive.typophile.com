    html: |-
      <p>Wow, that was quick. Thanks so much!</p>
      <p>I thought it was the ITC Avante Garde Gothic, but the logo’s letters seem a little bit squarer and blockier - the U and T especially seem to be a little wider. Also, there’s some space between the downward stroke of the R and its outward pointing leg…</p>
