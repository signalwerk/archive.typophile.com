    votes: null
    html: <p>The “Country Road” logo is set in <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=3&amp;displayfontid=EF.369.0.0&amp;fontRendererText=COUNTRY+ROAD" target="new">ITC Avant Garde Gothic</a> — Typophile uses <a href="http://www.typography.com/catalog/gotham/index.html" target="new">Gotham</a> as its primary sans face, although the Typophile logo used to be / is (?) set in a wide weight of <a href="http://www.typography.com/catalog/knockout/index.html" target="new">Knockout</a>.</p>
    html_clean: <p>The “Country Road” logo is set in <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=3&amp;displayfontid=EF.369.0.0&amp;fontRendererText=COUNTRY+ROAD" target="new" class="link-external">ITC Avant Garde Gothic</a> — Typophile uses <a href="http://www.typography.com/catalog/gotham/index.html" target="new" class="link-external">Gotham</a> as its primary sans face, although the Typophile logo used to be / is (?) set in a wide weight of <a href="http://www.typography.com/catalog/knockout/index.html" target="new" class="link-external">Knockout</a>.</p>
