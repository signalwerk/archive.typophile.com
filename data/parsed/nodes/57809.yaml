    html: |-
      <p>You don't have to.</p>
      <p>Put this in a book mark:</p>
      <p>javascript:void(q=prompt('Search%20Typophile:',''));if(q)void(location.href='http://www.google.com/search?q=site:typophile.com'+'%20'+escape(q))</p>
      <p>Or this in Google:</p>
      <p>site:typophile.com <cite>your search term/s here</cite></p>
      <p>BTW I cannot take credit. I am just passing on the info.</p>
