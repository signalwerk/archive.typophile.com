  - id: 351283
    user: 11702
    date: 2009-06-10T21:14:00
    date_raw: 10 Jun 2009 — 9:14pm
    votes: null
    html: <p>And if anyone is interested, I just created a new command on YubNub to search Typophile using the revamped search engine. All you have to do is go to <a href="http://yubnub.org" rel="nofollow">YubNub.org</a> and type in "tphile" and then whatever you want to search for (make sure you use quotes for any phrases). YubNub is extremely useful when you <a href="http://yubnub.org/documentation/describe_installation" rel="nofollow">install it in your search or address bar</a>, so I can now search Typophile quickly from any browser window. Other useful typographic search commands include <a href="http://yubnub.org/kernel/man?args=myfonts" rel="nofollow">myfonts</a>, <a href="http://yubnub.org/kernel/man?args=fontshop" rel="nofollow">fontshop</a>, <a href="http://yubnub.org/kernel/man?args=fontshopadv" rel="nofollow">fontshopadv</a>, <a href="http://yubnub.org/kernel/man?args=veertype" rel="nofollow">veertype</a>, and <a href="http://yubnub.org/kernel/man?args=adobe" rel="nofollow">adobe</a>.</p>
