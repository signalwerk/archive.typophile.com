      <p>The Starbucks logo was created many years before Freight was even a twinkle in Joshua Darden's eye. <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=GF.118889.0.17&amp;attributes.sampleSize=48&amp;sampleText=STARBUCKS&amp;sampleSize=48" rel="nofollow">Freight Sans Black is quite similar</a>, but the Starbucks ID is custom lettering, not a font. Note the differences in the 'B' and 'S'.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/get_Font_Image_4891.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/600px-Starbucks_Coffee_Logo_5171.svg.png"></div><p></p>
