  html: |-
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a></strong></p>
    <p>Large international design studio started in Berlin by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> in 1979. </p>
    <p>The typeface <a href="/wiki/Meta" class="freelinking" rel="nofollow">Meta</a> was originally designed for the German Post Office in 1985 and called <a href="/wiki/PT%2055" class="freelinking" rel="nofollow">PT 55</a>, but never introduced. It was later redigitized for the studio's own communications, then licensed to <a href="/wiki/FontShop%20International" class="freelinking" rel="nofollow">FontShop International</a> and exploded into one of the best selling and most used typefaces of the 1990s. It is still the best-selling font in the <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> library.</p>
    <p>URL: <a href="http://www.metadesign.com/" title="http://www.metadesign.com/">http://www.metadesign.com/</a></p>
