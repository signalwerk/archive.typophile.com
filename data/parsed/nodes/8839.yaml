    html: <p>&gt; I also don't think Abeno's summary is entirely accurate in some respects, so I recommend reading the decision if you're interested.  <br> <br>apologies if i over-simplified the issue in the Afga v. Adobe case-- Adobe 5.0 had a feature that allowed fonts embedded in PDFs to be edited with fewer restrictions than its bit restriction allowed. Adobe corrected this with 5.05, which Afga aknowledged, but sued anyway. In any case, I agree with Thomas- read the decision if you're that interested. My point in bringing up the case was to illustrate that companies are willing to litigate over the embedded PDF issue, not to highlight specifics of the dispute. <br> <br>Charles-- sorry if i missed your points. I'm new to this area of study and in addition was drunk when I posted.  <br> <br>&gt;Your client tells you his main concern is to keep his fonts from being stolen.  <br> <br>are they being stolen in the current state of affairs you describe? In a sense, books on NetLibrary are simply more copies of the published book. Neither NetLibrary nor its customers can obtain or edit text in Mrs Eaves, if I understand it all correctly. <br> <br>&gt;I</p>
