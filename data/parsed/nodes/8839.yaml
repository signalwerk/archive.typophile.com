    html: <p>Charles-- thank you very much for addressing these issues and starting a new thread. I am the law student in question, and this is a very interesting and relevant topic of discussion. <br> <br>&gt;&gt;I imagine an attorney feels it his/her duty to represent the client.  <br> <br>This is one of the fundamental problems of law. Type designers are, unless tied to large companies like Adobe, often small businesses who hire law firms, rather than in-house counsels, to draft their EULAs. Obviously, this means that the hired attorneys will attempt, given their limited expertise, to hammer out contracts that address the issues articulated to them by the client. Since most attorneys reveal, in candid conversation, that in drafting a contract in an uncertain area of law, their job is to "invent law," it follows that lawyers cannot be expected to spearhead fundamental changes in law as applied to typography.  Type designers themselves are the only agents who can begin the process of EULA reform. <br> <br>&gt;&gt;than in a PS file <br> <br>what is a PS file? -- can someone explain, please? <br> <br>&gt;&gt;NetLibrary requires the publisher, amongst other things, to send them a PDF file with the fonts fully embedded. <br> <br>What level of restriction does NetLibrary require, in terms of the embedding bit? I personally see no reason why NetLibrary would ever need rights beyond "read-only." The problem is, many type foundries only allow embedding for in-house or non commercial use only (see <a href="http://fontlab.wikidev.net/Image:Interrobang2-EULA-chart.gif">Interrobang's excellent comparison chart</a>). What the industry seems to need is a consistent policy that allows legal embedding for commercial, but read-only, uses such as NetLibrary. In the alternative, foundries could attempt to sign NetLibrary as a customer of their many fonts, but a likely conclusion is that NetLibrary, if faced with the prospect of licensing 1,000 fonts, would simply require its partners to submit in non-protected or a certain set or prescribed, cleared, fonts.  <br> <br>&gt;&gt;The state of things is so bad now that nobody pays much &gt;&gt;attention to the EULA </p>
    html_clean: <p>Charles-- thank you very much for addressing these issues and starting a new thread. I am the law student in question, and this is a very interesting and relevant topic of discussion. <br> <br>&gt;&gt;I imagine an attorney feels it his/her duty to represent the client.  <br> <br>This is one of the fundamental problems of law. Type designers are, unless tied to large companies like Adobe, often small businesses who hire law firms, rather than in-house counsels, to draft their EULAs. Obviously, this means that the hired attorneys will attempt, given their limited expertise, to hammer out contracts that address the issues articulated to them by the client. Since most attorneys reveal, in candid conversation, that in drafting a contract in an uncertain area of law, their job is to "invent law," it follows that lawyers cannot be expected to spearhead fundamental changes in law as applied to typography.  Type designers themselves are the only agents who can begin the process of EULA reform. <br> <br>&gt;&gt;than in a PS file <br> <br>what is a PS file? -- can someone explain, please? <br> <br>&gt;&gt;NetLibrary requires the publisher, amongst other things, to send them a PDF file with the fonts fully embedded. <br> <br>What level of restriction does NetLibrary require, in terms of the embedding bit? I personally see no reason why NetLibrary would ever need rights beyond "read-only." The problem is, many type foundries only allow embedding for in-house or non commercial use only (see <a href="http://fontlab.wikidev.net/Image:Interrobang2-EULA-chart.gif" class="link-external">Interrobang's excellent comparison chart</a>). What the industry seems to need is a consistent policy that allows legal embedding for commercial, but read-only, uses such as NetLibrary. In the alternative, foundries could attempt to sign NetLibrary as a customer of their many fonts, but a likely conclusion is that NetLibrary, if faced with the prospect of licensing 1,000 fonts, would simply require its partners to submit in non-protected or a certain set or prescribed, cleared, fonts.  <br> <br>&gt;&gt;The state of things is so bad now that nobody pays much &gt;&gt;attention to the EULA </p>
