    html: <p>OK, you've just begun to take the first steps. What I'm really suggesting is that a lawyer has to advise their clients, and in order to do that, he/she (the lawyer) has to know the business pretty well. It will be different for magazines than for books, different still for newspapers, and yet different for print advertizing. <br> <br>There will be permutations you don't expect. What you have to remember is the designer may feel that their latest creation is really good, everybody will buy it  . . . but it ain't necessarily so. It reminds me of a author who was having her book published --  a print run of 2,500 copies. When discussing advertizing with the publisher's marketing department, she said "What, you're not going to take out a full-page ad in the <i>New York Review of Books?</i> " <br> <br>Charles</p>
