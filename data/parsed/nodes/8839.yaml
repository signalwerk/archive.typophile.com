  html: "<p>The following occurred in another thread; I though it best to start a new one . . . <br> <br>&gt;&gt; <br>I'm a law student studying IP, so maybe someone could explain a few of the points in this thread to facilitate a greater typographer-attorney understanding   <br> <br>the PDF embedding issue seems straightforward for TrueType fonts, which can be assigned one of four levels of embedding restrictions: 1) Restricted, 2) Print &amp; Preview (meaning read-only), 3) Editable, and 4) Installable. Other type formats may contain similar embedding schemes. <br>&gt;&gt; <br> <br>I imagine an attorney feels it his/her duty to represent the client. But in too many matters, they get their understanding of the client</p>"
