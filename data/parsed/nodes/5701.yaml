  html: <p>My freelance identity needs to be updated. For now, I have decided to continue to use my name. But, I've been wondering if I should I create a business name (would it seem more professional/substantial or just gimicky)?  I know it's a very personal decision, but I'm curious as to the process others have used to come up with their names, is it ok to use a private joke? Does it have to be something the client "gets"? Also, many of the other posts have debated over whether or not an individual should have a personal logo. I feel that as a graphic designer the answer is yes. Attached are 2 business card designs, please let me know what you think, if you have a preference, and how you think they can be improved upon. Thanks in advance, I value all of your input.  <br> <br><img src="http://www.typophile.com/forums/messages/29/41082.jpg" alt="kncard a"> <br> <br><img src="http://www.typophile.com/forums/messages/29/41083.jpg" alt="kncard b"></p>
