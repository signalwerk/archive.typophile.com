    html: <p>Scott's excellent stationary is an example of not only using type, but also his creativity and strong sense of color to create an attractive presentation. It would not have the same effect if he just used Claredon without customizing it and making it unique.  <br> <br>Also, billboards can be made to look appealing and classy. It all depends on who you are marketing to. My experience with clients has been that they care more for graphics than the kerning (not that you can't do both). Our job as GRAPHIC designers is to show that we can use type as well as graphics (usually) to get a point across. Clients I have had want to see creativity. How else are you going to seperate yourself from their local print shop?</p>
