  - id: 40655
    user: 2236
    date: 2004-08-03T15:42:00
    date_raw: 3 Aug 2004 — 3:42pm
    votes: null
    html: "<p>Kirsten: <br> <br>I think I'm going to have to lean toward Tom's direction here. If I understand David correctly, I think he may have read a little too much into Tom's \"billboard\" comment. I agree with David, in that a designer's identity shouldn't alienate clients by overdesigning too much of their own unique style into it (unless the designer wants to specialize and their objective is to target a very specific clientelle); but, I also agree with Tom, in that a business card can play a very powerful role in making or breaking a meaningful marketing or communications opportunity between you and a potential client. Afterall, most of us don't have much of a budget for marketing and signage, and until you get a client into your door, there is a good chance they will never see your portfolio. In my personal experience, only about 10% or less of my clients ever see my portfolio. My visual portfolio has yet to make a difference in whether or not I land a job. What I would call my relationship/experience portfolio is what brings in the work, or rather, results in the referrals that keep me working. <br> <br>I apologize for taking up so much of your critique space here, Kirsten, but this seems to be a worthwhile discussion. <br> <br>Below is my logo on my stationary suite (a product of this forum). I am posting this because it supports the points that both David and Tom have made. The logotype is a derivative of Clarendon, which is a timeless typeface with subtle enough alteration that I believe David would approve of it. The stationary suite, however, is a selling tool. I use the two PMS colors, die cutting/punch cutting (\"Q\" and radius corners), letterpress, and stock selection as an example of how I can customize a piece that all of my clients use, but few of them have capitalized on for differentiation. Of course there are better pieces to illustrate this, but I can't carry them around wherever I go. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/41992.jpg\" alt=\"Creative Squeeze\"> <br> <br>Kirsten, I prefered your initial direction better than your last postings. I just think you still have some work to do on the type. <br> <br>Aloha! <br>Scott</p>"
