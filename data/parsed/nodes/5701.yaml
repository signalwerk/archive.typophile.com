    html: "<p>You might try and examine some other typefaces. I personally feel that the Roman you have chosen might be a little stiff condsidering the direcition of the cards and color palette. I feel like you could get a little more out of the italic in a typeface known for it's italics.(Old Style Romans: BEMBO GAROMONDS JENSON CASLONS) Right know the i feels a little to up and down. A trick to kerning this baby would be to add a few other letters (Capital \"O\" and C are good) When you add those letters you might get a better since of the overall letterspacing necessary. Right know the spacing is entirily to tight. Another trick would be to space the letters way out and make them gradually tighter as needed.   <br> <br>In summary \"Make the \"i\" feel special\"</p>"
    html_clean: "<p>You might try and examine some other typefaces. I personally feel that the Roman you have chosen might be a little stiff condsidering the direcition of the cards and color palette. I feel like you could get a little more out of the italic in a typeface known for it's italics.(Old Style Romans: BEMBO GAROMONDS JENSON CASLONS) Right know the i feels a little to up and down. A trick to kerning this baby would be to add a few other letters (Capital \"O\" and C are good) When you add those letters you might get a better since of the overall letterspacing necessary. Right know the spacing is entirily to tight. Another trick would be to space the letters way out and make them gradually tighter as needed.   <br> <br>In summary \"Make the \"i\" feel special\"</p>"
