    html: <p>Interesting concept Kirsten, however as you say yourself most people will not understand what these symbols mean. I know i wouldn't if you hadn't explained it before. Looking at the graphics as they are without knowing the story it would leave me wondering. The symbols itself don't feel like they are a mark since they are not connected graphically. Thus, forgetting about the original meaning, if it was just one of the flags i would agree that it is a symbol that could exist simply as looking nice. <br> <br>From the choices you posted i like the first ones most, with the flags in the middle. This arrangement holds the flags together and makes it feel more solid. <br> <br>Personally however, i am a little sad you are walking away from your original approach. Your name has a nice sound to it and the slightly classy look seems to fit well. I would have liked to see something like this, with less effects which complicated the type too much. </p>
