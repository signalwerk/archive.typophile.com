    html: <p>Tom, I have been cursed and blessed with the idea that everything on a page, including the page itself, needs a reason for existing. Not just any reason, a damn good reason. This is my ultimate problem, and my ultimate solution at the exact same time. I apologize if my extreme minimilist theories are spoken as if I was wearing blinders. I feel like that sometimes.... oh well, there is no turning back.   <br> <br>Ultimately the question is who your marketing to. The more types of people and clients you feel you can reach the more neutral the identity should be. <br>The more specific the clientel the more specific the identity. <br> <br>Scott, I like your identity, A bit cute for me, but extemely well considered none the less. </p>
