    html: "<p>The changes is for the better, but I *still* think that the solution can be characterized as 'classical type, with a lot of effects'. I think it is obvious that there is no Great Idea. <br> <br>Look at the identity of the top-50 designers round the world. My guess: either they have a Great Idea. Or they have 'nothing' (\"We are too busy doing great jobs for our clients, we don't have time to take our own medicine\"). <br> <br>My advice is to take a pause, look at what succesful design firms have done, and then redesign. <br> <br>If you should go with one of the four, I agree with Sally: the bottom left is the least busy/crowded one. And this has to do with the name mark you have made. There is at least 6-8 focus points, points of interest, built in the name mark. It is very 'complicated'. Consequently, I should have amble free space around ... and the rest of the layout should have few typographic variations.  <br> <br>I hope it's o.k. to be the devil's advocate here ... I guess you take the advice you think you need ... and leave the rest ... ;-) <br> <br>-- <br>Soren O</p>"
