    html: "<p>Kirsten: <br> <br>I think you have a great name to use for your identity. I would have liked to have used my own name in my identity, but it's Scott Keawekane. Keawekane is both difficult to say and hard to remember, for most people. <br> <br>Your typelogo has good potential. I can see that you are lining up the \"N\"s (although, optically, the bottom/darker \"N\" looks larger) at the end of the names, and the leg of the \"K\" continues down to create the crossbar of the \"N\". I'm not sure if I like it, as is; but, I'm not sure why either. The large \"N\" seems too wide, but I can't put my finger on what else is bothering me. <br> <br>You have kind of a cool \"K-N\" shape coming out of the \"K-i\". Have you tried fiddling with anything like this. <br><img src=\"http://www.typophile.com/forums/messages/29/41088.jpg\" alt=\"KN monogram\"> <br> <br>I definitely like the landscape bizcard layout better, but I'm not crazy about either. I've read your critiques in this forum, and I know you are capable of better. It's just hard to design for yourself</p>"
