    html: "<p>Kirsten -- I definitely think that a good personal name is one of the best options when a graphic design is choosing a company name. Your name is great for that purpose, easy to say, easy to remember. <br> <br>The way you have executed it, I see an arrangement of 'classical typography with some effects'. <br> <br>The effects: <br> <br>1 <br>Very crowded arrangement. <br>(Too crowded: Ki, AV (in particular) and VI) <br> <br>2 <br>Alignment of whatever can be aligned <br>(Unless it has Herb Lubalin-like quality I try to avoid alignments like NN and (in particular) the diagonal KN -- they seem a little ackward) <br> <br>3 <br>Mixture of UC and lc (i, s and t being lc) <br>(It's ok to mix, I guess) <br> <br>4 <br>The st-ligature <br>To the casual spectator the arrangement is basically UC, so the ligature is a little out of place -- I'm just being the devil's advocate here!) <br> <br>It's a well-balanced logo, but I don't think 'classical feeling' together with 1-4 does the job. The biggest drawback is that you show the world what you regard as good typography, or good design ... and those alignments aren't so modern ... <br> <br>I think you should consider other ways of writing that name. <br> <br>-- <br>Soren O</p>"
