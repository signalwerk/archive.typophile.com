    html: <p>I really like the personality of Miller. All of these logo's are still kerned way to tight. Think about the Negative Space. Right now the negative space is being crammed by the positive spave. I would try Adding one full natural space in between the letters and see how it feels. IMPO an all small caps version is better than an all Caps/Small Caps version. I think you might disagree but when you open up the letterspacing you will see why I feel that in my gut. the K and the N are way too dominant. The italic i should be the subtly dominant feature of your logo. right now the K and N are cramming the i's elegance. Give the i some breathing room!</p>
