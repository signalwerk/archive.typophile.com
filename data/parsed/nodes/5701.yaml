    html: "<p>Kirsten, take a look at the top-50 design firms' websites. That's a rather quick way of finding out how this design problem has been solved. <br> <br>And maybe, if you don't end up with the perfect idea ... well, just go for the understatement, the 'non-design' solution (which is, of course, design):  <br> <br>Write 'Kirsten Navin Design Studio' with a font that suits the purpose. Add a colour to the typography. Then add a lot of white space. <br> <br>This gives you the following advantages: <br> <br>1 <br>Keeping it simple, there's a good chance that it will be good-looking. <br> <br>2 <br>Potential customers don't get scared of a specific graphic style. <br> <br>3 <br>You send the same signal as a great deal of the top-50 firms: I spend the time on my clients. <br> <br>4 <br>Your identity will not disturb the solutions you make (Because very often your identity will be visible only together with examples of your work, in portfolios, on your website etc ... the only place really, where your logo is on its own is on signage and on your business card, both places benefit from a identity without many effects). <br> <br>This said, while you're designing your logo, have your mind open for those ideas that suddenly comes to your mind if it *is* open: the Great Idea. You know, that Great Idea For Kirsten Navin Design Studio Logo is *somewhere*, you just have to find it ... and, come to think of it, not only one Great Idea -- there is innumerable, equally relevant, highly creative solutions to that specific problem. (And when you're stuck in front of a blank piece of paper, unable to find just *one* ... that's really discouraring ... <br> <br> <br>-- <br>Soren O</p>"
