    html: <p>Dude, Tom, I disagree 100%. Why do you have to hit people over the head with gaudy design? It takes a real designer to create an dynamic composition with very few elements that is logical and considerate of the content and the viewing audience. Kirsten, if you have some class, which I'm sure you do, then you won't have to bombard your clients and friends with an overly designed identity that is designed for designs sake. LESS IS MORE. Lure them in with sophistication and class. Concentrate on typesetting and simplicity. Make beautiful words at considerate point sizes in a considerate legible clean typeface. When I see great buisness card it is done with extreme class and a very slight but elegant touch of style. IMPO light on the style heavy on the Class.</p>
