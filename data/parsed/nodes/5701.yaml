    date_raw: 22 Jul 2004 — 6:33pm
    votes: null
    html: <p>Thank you all, and I take your comments in the spirit in which they were given - to help me improve my mark. If I just wanted to hear "it's wonderful" I'd show them to my Mom. Your sensitivity on a very personal project is appreciated. It's definately the hardest kind of work and probably the most vunerable too. You're voicing many of my own concerns that have been nagging at me but I've been squashing. While looking over past projects trying to determine "my style" I was a little discouraged to see no unifying look. Hopefully that is a strength - meeting the client's specific needs rather than imposing an pre-established treatment. I understand the trap David wrote of, having a classically designed mark and putting off cutting edge prospective clients and vice versa. However how does one design an identity that says 'I'm a designer, I can do your project no matter your needs/style'. My identity will be my first impression. I don't want my card to get lost in the shuffle and be mistaken for an accountant's. some more research will help I'm sure. Does anyone have recommendations of good, or even bad (shows you what to avoid) self-identity logos?</p>
