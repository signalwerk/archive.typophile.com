    html: <p>Here are some revised designs. I went back to my original concept and simplified the overstyled logotype. I decided to keep the ital "i", visually I like having one character with a twist and hopefully it's contrast to the roman will be a reminder of the correct spelling and pronuncation. The first posting is the logotype itself followed by possible business card applications. I thought about Daniel's comment about process and so, two cards have a die-cut and fold. I haven't decided upon colors yet, so if some of the shades appear different it's not your monitor nor your eves. Finally, I tried to rework the flag concept into something I like but nothing was successful. I kept hearing David's and Andrew's comments ringing in my ears.  <br> <br><img src="http://www.typophile.com/forums/messages/29/42532.jpg" alt="knlogotype"> <br> <br><img src="http://www.typophile.com/forums/messages/29/42533.jpg" alt="knlogotypecard"> <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/42534.jpg" alt="knlogotypecard3"> <br> <br><img src="http://www.typophile.com/forums/messages/29/42535.jpg" alt="knlogotypecard2"></p>
