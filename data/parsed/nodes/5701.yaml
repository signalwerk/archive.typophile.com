    html: <p>I'm not too happy about the recent variantions.  <br> <br>As I see it, the arrangement on your business card tells the following story. <br> <br>1 <br>I like Gill Sans. It's a beautiful font with high legibility. <br> <br>2 <br>I feel something is missing, so I will center the lines. <br> <br>3 <br>I still fell it lacks something, so I will write my initials with Uppercase and the rest of the names in small caps <br> <br>4 <br>So ... the design is finished! <br> <br>Kirsten, it would be a pity to stop at this point. This four-step procedure is what millions of people do every day. You should show that you can take design further! <br> <br>I know you have included a symbol, but it doesn't seem to be so interesting ... maybe it could be developed, I don't know. <br> <br>The triangular shape you refer to is not IMHO a thing to try to achieve. With the symbol on top, it makes the arrangement look like a christmas tree. <br> <br>You become a writer by reading books. You become a designer by seeing design. I think you should force yourself to look at a lot of top-professional identity ... I mean, you should really do it! ... and then go back to the drawing board. <br> <br>I look forward to discuss this further with you and the rest of the forum ... <br> <br>-- <br>Soren O </p>
