    html: <p>I've been thinking about this a lot and decided to explore some other paths. Below is what I think is working best so far, however I'm not convinced of my type choices. I need a font with a single junction on the cap K.  So far I'm using Gill Sans Light (I don't care for the cap R in Univers or Futura). I'm also trying two serif fonts, Perpetua and Trajan. Again I need a single junction K but it needs to be a face with very little contrast. The leg on the Trajan K seems too swash-y. It still needs to be refined and perhaps a different font choice (Suggestions Please!) But overall, I like this direction. What does the forum think? Is it a worthwhile initial concept? <br> <br><img src="http://www.typophile.com/forums/messages/29/41315.jpg" alt="navin_tri"> <br> <br><img src="http://www.typophile.com/forums/messages/29/41316.jpg" alt="navin_tri2"> <br> <br><img src="http://www.typophile.com/forums/messages/29/41317.jpg" alt="navin_tri3"></p>
