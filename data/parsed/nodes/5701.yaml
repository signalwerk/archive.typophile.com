    html: <p>Here are some new identity designs. What I had liked about my last post was using a simple grahic element along with the name, although the stylized K and N weren't working. They did however remind me of signal flags so I looked up what the signal flags would be for my initals and incorporated them into most of the attached designs. Signal flags are a form of visual communication which is what graphic design is all about. The K flag means I want to communicate with you. But the N flag stands for no or negative - not  a great concept to associate with one's id. however, historically it also used to symbolize rendezvous. I don't expect a lot of people to actually decypher the flag symbols. I do hope it will be fairly self evident that they represent K and N, but the flags are simple enough to just be graphic elements. Also, a subtle nautical theme seems appropriate on a personal level. But that goes back to some of my original questions, how reflective/personal should a personal identity be? Any way, your thoughts on this latest round would be greatly appreciated. <br> <br><img src="http://www.typophile.com/forums/messages/29/41861.jpg" alt="middle"> <br> <br><img src="http://www.typophile.com/forums/messages/29/41862.jpg" alt="box"> <br> <br><img src="http://www.typophile.com/forums/messages/29/41863.jpg" alt="left"> <br> <br><img src="http://www.typophile.com/forums/messages/29/41864.jpg" alt="split"> <br> <br><img src="http://www.typophile.com/forums/messages/29/41865.jpg" alt="noflag"></p>
