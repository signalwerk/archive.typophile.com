    html: <p>Designing your personal identity is the hardest thing for a designer to do. I try and think of myself(as a designer) identityless. If you have no identity as a designer than you are flexible and organic to your clients. If you present a very classcal identiy to a potential client then you run the risk of being stereotyped as a classic designer. If you present a ultra-modern identity than you will alienate those clients looking for a classic feel. A designer is not a brand, a designer designs brands.</p>
