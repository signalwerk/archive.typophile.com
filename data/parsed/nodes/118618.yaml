      <p>Very interesting links riccard0. Thank you.</p>
      <p>Simply being content to ignore Gill Sans, I'd never looked into its origins. I thought I was mostly alone in my questioning of Gill's peculiar decisions in this type family, but it seems others have noticed the same oddities.</p>
      <p>As for the Ultra Bold / Kayo weight, the Schauspielhaus Zürich work really is surprisingly nice. I can honestly say now that I've seen at least one use of Kayo that actually builds upon its personality rather than being at odds with it. It reminds me of something Herb Lubalin might have done.</p>
