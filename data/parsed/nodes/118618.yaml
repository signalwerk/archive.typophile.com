    votes: null
    html: |-
      <p>Not liking Gill Sans is probably too strong. It's personality has just never matched up with what I've needed, so other than a time or two with the caps, I don't recall ever having used it.</p>
      <p>Of course I could say the same thing about most typefaces with distinct personalities — they're useful mainly when their personalities fit the task at hand. Unlike most typefaces, however, Gill Sans enjoys the kind of widespread use most often associated with broader-purpose, more generic typefaces that tend to take on the qualities of their surroundings. It's puzzling to me why Gill Sans is used so often in instances where its personality doesn't complement the context in which its used — the Bart Smit logotype being a good example.</p>
