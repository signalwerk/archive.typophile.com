    html: |-
      <p>In our century, Eric Gill is best remembered for his types, but he didn't consider typography his principal occupation. In his lifetime he was famous as a sculptor, and the inscription he chose for his headstone was:</p>
      <p>PRAY FOR ME<br>
      ERIC GILL<br>
      STONE CARVER<br>
      1882-1940</p>
      <p>I've always thought that his alphabets felt like they were made with a chisel rather than a pen, and I admire the alchemy by which he transformed the solidity of stone into the solidity of metal. In his own words, "Letters are things, not pictures of things."</p>
