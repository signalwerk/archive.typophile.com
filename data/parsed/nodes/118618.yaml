    html: |-
      <p>As you say, Gill Sans is so ubiquitous that it no longer evokes midcentury Britain for anyone except typophiles. </p>
      <p>I still like and use Gill Sans, but might just be a habit formed in the early years of desktop publishing. There were few widely-available sans serifs then, and they tended to be either monotonous and sterile (Helvetica, Univers) or monotonous and mechanical (Futura, Avant Garde). The only sans serifs that were easy to find and looked like the work of a living, red-blooded human were Gill Sans and Optima. Optima was a little precious, so we used Gill Sans because it looked good, it worked well, and it was just eccentric enough to keep from being boring.</p>
