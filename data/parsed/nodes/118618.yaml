      <p>I had no idea it was a separate typeface and now I understand the context and the purpose for which it was designed I suppose I can appreciate those tittles a bit more, although I still find them awkward. The branding for Schauspielhaus is really cool though.</p>
      <p>The article "Eric Gill got it wrong; a re-evaluation of Gill Sans" is also rather fascinating. I never knew Gill Sans was made as an attempt to improve on Johnston. In that regard I feel it fails in some regards. The article almost seems to imply Gill was a student who didn't quite know what he was doing. What do you feel about that? It might be the case, but I feel Gill Sans does bring some unexpected and pleasurable results.</p>
