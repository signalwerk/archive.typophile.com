      <p>If you like Gill Sans AND want to use it for its ‘feel’… why not use a proto-Gill Sans instead, eg Johnston or Underground. They have glyphs that have more character than GS.</p>
      <p>There is a digital Johnston by ITC: <a href="http://www.myfonts.com/fonts/itc/johnston/" title="http://www.myfonts.com/fonts/itc/johnston/">http://www.myfonts.com/fonts/itc/johnston/</a><br>
      An open source version (Railway Sans): <a href="http://openfontlibrary.org/en/font/railway-sans" title="http://openfontlibrary.org/en/font/railway-sans">http://openfontlibrary.org/en/font/railway-sans</a><br>
      Underground is a P22 gig: <a href="https://p22.com/family-Underground" title="https://p22.com/family-Underground">https://p22.com/family-Underground</a><br>
      The ‘official’ version of Underground is more of a modern take and exclusive to London Transport: <a href="https://www.tfl.gov.uk/info-for/suppliers-and-contractors/font-requests" title="https://www.tfl.gov.uk/info-for/suppliers-and-contractors/font-requests">https://www.tfl.gov.uk/info-for/suppliers-and-contractors/font-requests</a></p>
