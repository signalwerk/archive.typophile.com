      <p>As Victor notes, the feel of authenticity is entirely subjective.</p>
      <p>For typographers, it’s a priority that the end-user-audience feel it, but there are many more audiences than that. One’s peers, for instance, who are better informed.</p>
      <p>I was exposed to Gill Sans at an early age, younger than ten, in the text of the manuals that came with my Meccano. This would be in the UK, c.1960. I still have some of those, very technical, set in the Light weight.</p>
      <p>My ﬁrst exposure to practical typography came in 1969 when I inherited my grandfather’s small press, with four typefaces—Times, Bodoni Ultra, Palace Script and Gill Sans (Reg and Bold).</p>
      <p>For me, as an antiquarian, Gill Sans has a very mid-century-non-modern look. The curve of the bowl of the /a, for instance, reminds me of such things as contemporary baby carriages.<br>
      <a href="http://ancientpoint.com/inf/5083-midcentury_modern_german_design_plastic_wicker_buggie_convertable_baby_stroller.html" title="http://ancientpoint.com/inf/5083-midcentury_modern_german_design_plastic_wicker_buggie_convertable_baby_stroller.html">http://ancientpoint.com/inf/5083-midcentury_modern_german_design_plastic...</a></p>
