      <p>Have you checked out Fonts in Use?: <a href="http://fontsinuse.com/typefaces/45/gill-sans" title="http://fontsinuse.com/typefaces/45/gill-sans">http://fontsinuse.com/typefaces/45/gill-sans</a></p>
      <p>I've always considered Gill Sans one of those classic sans, on a par with Futura. </p>
      <p>I just helped someone on the Font ID forum with a Futura identification, and he felt foolish (when he shouldn't have) for not recognizing it himself. But it had been used so elegantly, it seemed more up-to-date than something designed in the late 1920s/early 1930s. </p>
      <p>I feel the same way about Gill Sans. Use it thoughtfully and well, and it can seem timeless. Its geometry does seem to lend itself, however, to products or services meant to evoke precision, craftsmanship, and/or style.</p>
      <p>What I am tired of seeing, however, are "fashion" versions of Didot/Bodoni. Enough already.</p>
