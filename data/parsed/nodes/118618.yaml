      <p>Martin, you've touched on the reasons for my lack of enthusiasm for Gill Sans. The caps are mostly fine, but the wonky lowercase and the peculiar inconsistencies between weights have never appealed to me. This quirkiness might add up to character and personality for some, but to me, it's just sort of ugly.</p>
      <p>The near-universal love of this type family has really puzzled me over the years, so there's apparently something that I'm just not getting.</p>
