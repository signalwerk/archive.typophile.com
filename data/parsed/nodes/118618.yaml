    html: |-
      <div class="comment-spam-body"><p><cite>Thylacine, what I mean with "feeling authentic" is where Gill Sans works according to you. For instance, use it for McDonald's and it's probably not going to be very convincing.</cite><br>
      I feel Gill Sans works very well in specific contexts but it's very easy to use it inappropriately. I think I might be overlooking Gill Sans at times when set in all-caps, but when lowercase letters are used I feel Gill Sans is so prolific you really have to be careful in how you use it.</p>
      <p>Initially I greatly disliked Gill Sans and I actually learned to love it. I suspect the initial dislike came from the over-expressive letter forms which look amazing in some contexts and horrendous in others. In the Netherlands Gill Sans is probably most prolific when it comes to this toy store called Bart Smit.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/timthumb_6291.jpg"></div><p></p>
      <p>I think this is one of the ugliest logos I've ever seen and I'm greatly annoyed every time I see it. Their whole branding almost couldn't be more horrendous to me, but initially I was also angry at Gill Sans for featuring such small tittles in the darker weights and the black weight even has an /i with a bowl on top to hold the tittle in — I never understood that.</p>
      </div>
