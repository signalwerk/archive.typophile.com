    html: |-
      <div class="comment-spam-body"><p>As I mentioned, I learned to love Gill Sans. I will never like those small tittles, the tittle-bowls and why the tittles in the black weight are off-center, but I learned to appreciate the caricaturist contrast and the exaggeration of certain shapes in the lowercase. It's wrong, but in a good way. However that doesn't count for every letter. There are several inconsistencies I still don't understand. By the way, I never noticed that /b in the 4th weight before. I will have to add that to the list of inconsistencies I don't understand.</p>
      <p>Cory, is there a wonky typeface in the vein of Gill Sans you do like, or is it the wonkiness you don't like?</p>
      <p>PS: Why is 'wonkiness' not a word? And what about 'decorational'? I often feel the English language is missing words.</p>
      </div>
  - id: 586961
    user: 16338
    date: 2014-08-30T20:38:00
