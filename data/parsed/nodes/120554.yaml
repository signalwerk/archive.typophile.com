    <p>The original YouTube video where I first saw this album cover</p>
    <p><a class="freelinking external" href="http://www.hellenism.net/cgi-bin/forums/Blah.pl?m-1393520266/" rel="nofollow">http://www.hellenism.net/cgi-bin/forums/Blah.pl?m-1393520266/</a></p>
    <p>is gone now, although there are other videos with the same (very nice) music. But the typeface in which the album cover is set is a very Latinized form of Greek; the alpha and zeta, for example, are replaced by Latin letters. The epsilon, however, retains a minimum of distinctive Greek elements to remain recognizable.</p>
