    html: |-
      <p>Note that although VOLT is described on the MS site as being used to add OTL tables to TTFs, it can also be used to add them to CFF fonts, although you can't visually edit features for CFF fonts directly in VOLT (because it has no PS rasteriser).</p>
      <p>See my <a href="http://www.tiro.com/John/FontLab-to-VOLTworkflow.pdf" rel="nofollow">FontLab-to-VOLT workflow documentation</a>.</p>
