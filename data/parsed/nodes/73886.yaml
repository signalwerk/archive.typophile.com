    html: <p>Hi Ben, the first part—the one on the right, you read Hebrew right to left—is based on the outside of the shin, and the second part, on the left, is based on the chet. That's why the bottom right is rounded and the top left is square. It follows these letters. You can see the illustration in <a class="freelinking external" href="http://en.wikipedia.org/wiki/Israeli_new_shekel#Abbreviation" rel="nofollow">the wikipedia article here</a>, which makes it clear. I don't know whether Israelis will see a bottom right square instead of round as "wrong", or whether the symbol has become sufficiently detached from the letters that you have more flexibility. Perhaps an Israeli will chime in here.</p>
