      <p>1. As noted by others, the serifs make this shape too complex. I'd make this the same height as Hebrew letters, which by long convention are most often between x-height and cap height relative to Latin. Note, however, that some modern Israeli fonts match Hebrew letters to the Latin cap height.</p>
      <p>3. Both conventions are seen in use in Vietnam, in type and in writing. I prefer the grave on the left of the circumflex because at small sizes and low resolutions it is more distinct, so aids legibility.</p>
      <p>4. I spent a lot of time researching African orthographies in the late '90s. The hook on the right arm is by far the most common form of this letter; in fact, I don't recall seeing the other form at all. This requires a strong hook form in order to be clearly legible and distinct from the regular K at small sizes.</p>
