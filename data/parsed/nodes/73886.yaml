    <p>I have very specific questions about some glyphs from the <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">font</a> I'm developing. Any help is highly welcome.</p>
    <p>.</p>
    <p><strong>Question 1: New Sheqel.</strong></p>
    <p>Which must be the height for Israeli's New Sheqel in a Latin script? I see New Sheqel is quite small in Times New Roman, a font with Hebrew script. But it follows general currency height in Greta Text, a font without Hebrew script. I believe the height must align to Hebrew glyphs if they are present, but it can align with Dollar, Euro and others symbols when Latin alphabet is used. Is this supposion true?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Q1_5586.gif"></div><p></p>
    <p>.</p>
    <p><strong>Question 2: Drachma.</strong></p>
    <p>Drachma symbol is calligraphic and very similar in most fonts. In my project, I did some small changes to achieve a result coherent with font general approach –and also use the same angle of italic style. This small redesign is allowed according to Greek standards?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Q2_3961.gif"></div><p></p>
    <p>.</p>
    <p><strong>Question 3: Vietnamese circumflex+grave.</strong></p>
    <p>In Vietnamese, the combined accent circumflex+grave uses grave at right or left? I found both ways in various fonts, but it seems that to put grave at left is better.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Q3_5606.gif"></div><p></p>
    <p>.</p>
    <p><strong>Question 4: K hook.</strong></p>
    <p>K with upper hook is used in some African languages. For uppercase K, there are fonts with the hook at the stem and others with it at the upper leg. Any idea about the correct/best choice?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Q4_4985.gif"></div><p></p>
    <p>.</p>
    <p><strong>Question 5: German Sharp S.</strong></p>
    <p>Actually, two questions here. First: is the sample below a good design to German sharp S? Second: German sharp S as a single glyph uses Unicode 1E9E, while SS digraph uses 00DF. Is a good idea to adopt an OpenType substitution from Uni00DF to Uni1E9E when German language is in use?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Q5_3486.gif"></div><p></p>
    <p>.</p>
