      <p>my 2 cents regarding the New Shekel: (more as a Hebrew speaker, not a type designer)<br>
      As mentioned, some Hebrew faces are leveled to match Latin Cap height, some to X-height, and some in between. If your font does not include Hebrew script, then the Shekel symbol would only appear next to figures, so no reason to make it different then any other currency symbol. It will never appear next to Hebrew text because every Hebrew typeface has its own New Shekel glyph.</p>
      <p>Regarding the serifs, everything said here was right, but I would try a version with a single serif, the one on the top left, which some Hebrew Chet letters do have. Look at this example in Fontef's Meargen, you can see both Shin and Chat at the bottom line:<br>
      <a href="http://www.flickr.com/photos/fontef/2270255289/" title="http://www.flickr.com/photos/fontef/2270255289/">http://www.flickr.com/photos/fontef/2270255289/</a></p>
    html_clean: |-
