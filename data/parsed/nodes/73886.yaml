      <p>Thanks for more valuable inputs.</p>
      <p><strong>New Sheqel and Rupee</strong>:</p>
      <p><em>Yotam</em>: you touched exactly the question I did ask. As this font uses just Latin script, New Sheqel will never be together with Hebrew glyphs so it may look strange with its small height. In doubt, I did two versions: the small, traditional one, to be used with default, oldstyle and petite figures. And a larger one to be aligned with uppercases. Your idea about prtial serifs is interesting, I will do some tests.</p>
      <p><em>Andreas</em>: I believe there is no escape from a somewhat strange appearance as this came from another script. The same would occur with Drachma, old German Penny or Rial (although this one I did not include) because these are non-Latin glyphs. As you pointed, Rupee has a more Latinish shape. The alternative to Sheqel is to adopt a non-traditional design, as I made originally and as one finds in Greta Text. But this seem to produce even more strange results.</p>
      <p>I made a sample using New Sheqel and other monetary symbols.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sheqel_5861.gif"></div><p></p>
      <p>.<br>
      This sample is far from ideal as there are distortions due to screen resolution. In both texts (rates table and small note) I used, in order, default number set, oldstyle figures and all caps figures. Table uses tabular figures, remaining texts are proportional.</p>
