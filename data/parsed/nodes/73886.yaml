    html: |-
      <p>Thanks a lot for all answers. I'll take your advices in account to improve New Sheqel and sharp S immediately. Let me add some considerations about the other questions:</p>
      <p><strong>Drachma</strong>:</p>
      <p>You did touch an interesting issue, Andreas. Although this symbol is not currently used, don't it must be keeped for historic reasons? At last, Drachma was Greece's currency for long time. I see the same for other European national currencies whose were replaced by Euro (exception to Franc symbol, still used in African countries).</p>
      <p>A similar situation occurs with Cruzeiro (Uni20A2), wrongly reported by Unicoed as in-use Brazilian currency. This symbol was dropped in 1967 and almost no one knows it in Brazil nowadays. Anyway, many fonts brings the symbol. The only logical reason for this is historic reference (although I believe many designers include it just because Unicode does).</p>
      <p>.</p>
      <p><strong>Vietnamese</strong>:</p>
      <p>I already knew the thread about Vietnamese diacritics, but there is no conclusion there about the grave position. An user (hdang) seems to know Vietnamese languase and says Minion solution is bad. As Minion uses the grave at right, the correct would be grave at left. But this user did not come back to confirm this.</p>
      <p>Both options are equally strange to my Western eye. So I'd like to know how Vietnamese people actually prefer it.</p>
      <p>.</p>
      <p><strong>K hook</strong>:</p>
      <p>I agree with riccard0, K with hook at leg is more distinct from regular K. But again, how African people use it? Maybe this is the more dificult question as we have very few information about African languages even here in Typophile.</p>
