    html: |-
      <p>EOT has already been rejected.</p>
      <p>A spec for CWT (EOT-Lite) is apparently being drafted for consideration, and there is the opportunity to clarify that embedding bits do not imply permission for web use or format conversion. Embedding bit fields will likely remain in the CWT header, because otherwise the format won't be recognisable as an EOT-compatible format in older IE browsers, but these will be considered padding by CWT implementations and simply ignored, just as embedding bits in TTFs and OTFs are ignored by Firefox and Opera.</p>
