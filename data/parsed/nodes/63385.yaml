    html: |-
      <p>Zoltan, </p>
      <p>there are certainly some fonts that are available under liberal licenses that do allow conversion and unlimited use as @font-face web fonts. For example, there is a number of fonts that are available under the GNU Public License, the SIL Open Font License, the RedHat GPL+exception license, the DejaVu license or the GUST Font License:<br>
      <a href="http://delicious.com/adamtwar/gratis+liberal+web+font" title="http://delicious.com/adamtwar/gratis+liberal+web+font">http://delicious.com/adamtwar/gratis+liberal+web+font</a></p>
      <p>For those fonts, you need to pay some attention regarding the trademarks (if you modify the fonts, you need to change the font names) and the availability of the source code (though it is not necessarily clear what can be considered source code for fonts — some claim that the OpenType format *is* the source because there is no single "source code language" for OpenType fonts). </p>
      <p>As far as the screen quality is concerned, careful treatment of hinting is the essential element. I don't know much about FontForge's abilities to deal with hinting in a flexible way, though. </p>
      <p>Cheers,<br>
      Adam</p>
