    html: |-
      <p>You need to distinguish a couple of things:<br>
      1) Allowing font-embedding does NOT necessarily imply @font-face linking.<br>
      2) Allowing @font-face linking does NOT at all imply that conversion is allowed.<br>
      3) And the fact that a font is for free also does NOT necessarily mean that conversion is allowed.</p>
      <p>The current situation, roughly, is this:<br>
      Many foundries do allow font-embedding of their TTF/OTF fonts if this involves some level of protection. Usually this kind of allowed font-embedding refers to old technology and includes PDF or Flash -- but NOT @font-face linking of TTF/OTF fonts. The latter effectively means uploading a font and exposing it so it can be easily downloaded and used locally, which is the opposite of the required protection.<br>
      Most foundries do NOT allow conversion of fonts, e.g. into web font formats like EOT or wOFF. (I know that online-converter are out there already and that this of course invites to use them. Yet the fact that these exist does NOT mean that you are allowed to convert each and every font you like.)<br>
      Many foundries will, it seems, produce EOT and wOFF versions of their fonts themselves. This way they can make sure that the quality is right. (It implies removing of unnecessary glyphs to make files smaller, hinting to make type look better, etc.)<br>
      Others, like Typotheque, provide a web font service, hosting fonts themselves.</p>
      <p>You mention Graublau Web in connection with editing or remixing (reverse engineering, conversion, etc). If you follow the link "End User License Agreement (EULA)" on <a href="http://www.fonts.info/info/press/free-fonts-for-font-face-embedding.htm" target="_blank" rel="nofollow">this page</a> which refers to <a href="http://www.fonts.info/shop/pub/W-EULA.pdf" target="_blank" rel="nofollow">this PDF</a>, you will see that although Graublau can be downloaded for free, you are NOT allowed to convert it.</p>
      <p>If in doubt, check a font's EULA (usually a link is exposed next to the download button or during the purchase process) or ask the foundry of a typeface you like to use. Perhaps they can tell you if and when they will offer web font versions of their typefaces.</p>
      <p>Best wishes, Karsten</p>
