    <p>Hello,</p>
    <p>I am a web developer who is new to the technical world of fonts.  I have been playing around with font-embedding on web pages and how they render on the variety of browsers and operating systems available.   Two questions have been left unanswered in my research, and it was recommended to me by a member of your community to pose them here.  Forgive their newbie-ish slant, but I have tried to find answers, and can't seem to find them.</p>
    <p>1) I have noticed that some fonts (like Microsoft's Consolas) look *horrible* on a computer screen without any anti-aliasing technologies turned on.  Is there some way to use FontForge to improve the hinting on these fonts so they look good when not anti-aliased?  Consolas is a bad example since it is not a font that has a license to allow editing or remixing, but there are other fonts (like Graublau Web) where this happens as well.  How easy is it to do this?  </p>
    <p>2) When converting fonts to one format to another using FontForge (e.g. .otf to .eot) the converted fonts have subtle (and sometime not so subtle) errors in them.  I understand that this has to do with the spline algorithms the different formats use.  Are there any tips you can give to somehow minimize the errors in conversion?</p>
    <p>I would like to point out I am only looking at doing conversions for fonts in which the license allows font-embedding.  </p>
    <p>Thanks in advance,<br>
    Zoltan.</p>
