    html: <p>Different applications handle default interlinear spacing in different ways. It is a while since I used Illustrator, but I'm presuming that it works much the same way as other Adobe software; that is, it probably handles default leading as a percentage of the body height of the text. So, for example, default leading for 12pt type is likely to be 120%, i.e. 14pt leading. If you have a problem with interlinear spacing in such a program, it is because your glyphs are actually scaled incorrectly relative to the body height (i.e. the UPM value). If your fonts are Type 1 format, they will have a UPM value of 1000, which means that you need to make your tallest glyphs fit within that height, or they will extend beyond the nominal body and may clash with other lines of text. <br> <br>Many other applications, e.g. MS Word, do not calculate default linespacing as a percentage of body height, but instead use 'logical unit' font metrics that are provided by the system font renderer and based upon explicit values in the font. This is why the default linespacing between one font at 12pt and another font at the same size may vary. For Type 1 fonts, the logical metrics are calculated from the bounding box values. For TrueType fonts they are usually calculated from the OS/2 table vertical metrics on Windows and the hhea table vertical metrics on the Mac. <br> <br>Unfortunately, I've no idea how to go about editing these values in Fontographer, since I don't use that tool. It is possible to directly edit the values in FontLab.</p>
