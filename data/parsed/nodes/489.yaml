    html: '<p>hello, Guillaume, <br> <br>sorry for the delay in getting back to you. In Fontographer, go to the �Element� menu and select �Font Info...�. This will bring up a dialog box that has spaces for Ascent, Descent, and Em Square, and even Leading. Fontographer usually calculates the total height of a font as 1000  em units (usually it is the sum of ascent and descent), but you can change that, or the Ascent, for example. <br> <br>Here are some tips from the Fontographer manual: <br> <br>If you want an em square that is NOT equal to the sum of the ascent plus the descent, deselect the box �Automatically compute em square from ascent + descent�. <br> <br>If �Retain path coordinates when changing em square� is checked, the entire font will look smaller if you make the em square larger. <br> <br>Leading is normally left at 0 (zero), but if you must set it, a good setting is 10% of the sum of the ascent and descent. <br> <br>That�s what I can tell you. I�m quite new at this, so I hope these tips work. And if you need it, you can get a PDF of the Fontographer manual here: <br> <br><a href="http://members.xoom.virgilio.it/dtp/papers.html" target="_blank">http://members.xoom.virgilio.it/dtp/papers.html</a> <br> <br>Best of luck with your job!</p>'
