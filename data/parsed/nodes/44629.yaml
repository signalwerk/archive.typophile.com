  html: <p>I have to break up a book into a series of sections to be edited by someone who doesn’t know how to work with long documents in Indesign. I am doing this by using copy/paste to break up the stories, but that leaves me with massive amounts of formatted overset text that I need to get rid of to prevent problems later. How do I just discard all of the overset text in a story?</p>
