    <p>I have been trying to get ahold of cape-arcona to license 'CA Texas Funeral'<br>
    It is a free noncommercial font on their site but says to license as commercial to contact them. I have tried but no-one responds via email. (I emailed these emails: <a href="mailto:general@cape-arcona.com">general@cape-arcona.com</a>, <a href="mailto:king@cape-arcona.com">king@cape-arcona.com</a>, <a href="mailto:president@cape-arcona.com">president@cape-arcona.com</a>)</p>
    <p>Anyone here know them? </p>
    <p>Please send them my way. Thanks kindly.</p>
