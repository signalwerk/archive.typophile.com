    <p>Hi,</p>
    <p>I am looking for suggestions for expert, active type designers that have experience with Cyrillic. i.e., who are the best ones that currently accept commissions (based anywhere)? Preferably with experience creating typefaces for editorial contexts (magazine, newspaper).</p>
    <p>I know Gerard Unger has some of his typefaces in Cyrillic and that Monotype does commissioned work. Any other names and thoughts would be appreciated.</p>
    <p>Thank in advance for suggestions...</p>
    <p>MB</p>
