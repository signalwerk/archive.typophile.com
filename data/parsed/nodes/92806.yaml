    date_raw: 7 May 2012 — 6:14pm
    votes: null
    html: <p>Of the Russia-based designers with considerable professional experience I could recommend, in random order, Tagir Safayev, Alexander Tarbeev, Gayaneh Bagdasaryan, and Natalia Vasilyeva. Manvel Shmavonyan who lives in Yerevan, has a good number of excellent Cyrillics under his belt. Many Cyrillic fonts designed by Russian and non-Russian professionals are offered by <a href="http://paratype.com/help/designers/" rel="nofollow">ParaType</a>. Matthew Carter, Robert Slimbach, John Hudson, Steve Matteson, and all designers who took part in developing <a href="http://www.ascendercorp.com/catalog/microsoft/clear-type-font-collection/" rel="nofollow">Microsoft ClearType Font Collection</a> are very good at Cyrillic.</p>
