    html: |-
      <p>Maybe a food-service professional would recognize what the picture is, but to me it's too abstract--just a corner with the four little round things.<br>
      The color scheme and the typography say <em>clean</em> and <em>high-tech</em>, but they don't say <em>food</em>. I get kind of a biotech or pharmaceutical vibe from this, although that's partly because the name <em>Univerzal</em> sounds like a prescription drug. I realize they won't let you change the name of the company. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aramark_5373.jpg"></div><br>
      Here's the logo of one of the biggest food-service outfits in the US, Aramark (possibly somebody Univerzal would like as a client). They've been using this logo for 15 or 20 years, so it's not exactly on the cutting edge, but it manages to look modern and techie without looking cold and antiseptic.<p></p>
