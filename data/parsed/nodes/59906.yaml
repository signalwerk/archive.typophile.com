      <p>Thank you all for the feedback.<br>
      I see that Univerzal sounds to pharmaceutical(antiseptic lol) but this firm is located in macedonia and Univerzal means - Universal. So the name implies something abstract and well- universal so it can have multiple meanings and many applications. This -<a class="freelinking external" href="http://univerzal.com.mk/" rel="nofollow">http://univerzal.com.mk/</a> is the old website of this company, and these are some websites from the region that make similar products <a class="freelinking external" href="http://frigosan.com.mk/pocetok_en.html" rel="nofollow">http://frigosan.com.mk/pocetok_en.html</a> <a class="freelinking external" href="http://frigobox.com.mk/" rel="nofollow">http://frigobox.com.mk/</a>, portionox <a class="freelinking external" href="http://portinox.es/english/home.html" rel="nofollow">http://portinox.es/english/home.html</a> is an international brand in this kind of equipment, so as we can see the snowflake is the main symbol which represents the refrigerators. I wanted to go in another direction to symbolize all the different products this firm has (not just cooling equipment) so the angle should be representing the angle of some appliances (stove, refrigerator, whatever...).<br>
      I am also confused aluminium is saying it is to literal and unlejman is saying that it doesnt conect right away. I need some symbol to represent a lot of many equipments this firm makes. Anyway thank you all for the feedback I will post more ideas.</p>
