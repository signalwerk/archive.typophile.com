    html: |-
      <p>Ok. Let's make something clear here. Your image of some sort of kitchen appliance isn't anything else but that. An image. It's an image beside your logo. It's definitely not part of your logo. And it shouldn't be. Not like this. It merely serves as an inappropriate logo background.</p>
      <p>You will either have to create a proper logo symbol (should work in full colour as well as BW) or create a clean typographic one.</p>
      <p>___________<br>
      <em>Robert Koritnik</em></p>
