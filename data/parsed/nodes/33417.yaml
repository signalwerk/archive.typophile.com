  html: |-
    <p>Font Bros is proud to announce the release of two new display fonts by the talented Mark Simonson : <a href="http://www.fontbros.com/cgi-bin/redirect.cgi?code=simonson&amp;goto=http://www.fontbros.com/cgi-bin/commerce.cgi?key%3DMASS-KINE%26preadd%3Daction" rel="nofollow">Kinescope</a> and <a href="http://www.fontbros.com/cgi-bin/redirect.cgi?code=simonson&amp;goto=http://www.fontbros.com/cgi-bin/commerce.cgi?key%3DMASS-SNIC%26preadd%3Daction" rel="nofollow">Snicker</a>. Both fonts were inspired by hand-lettered titles in the old Fleischer Brothers’ animated Superman cartoons from the 1940s.</p>
    <p>Kinescope uses advanced OpenType magic to choose the most pleasing character shapes as you type and features extended language support. (An application with advanced OpenType support required for the magic stuff.) To find out more, check out the <a href="http://www.fontbros.com/images/1110/kinescope.pdf" rel="nofollow">Kinescope User Guide</a> (1.6mb PDF).</p>
    <p>Advanced OpenType support is not required by Snicker, but it has some tricks up its sleeve, including case-sensitive punctuation, automatic fractions, and extended language support. To find out more, check out the <a href="http://www.fontbros.com/images/1110/snicker.pdf" rel="nofollow">Snicker User Guide</a> (1.2mb PDF).</p>
    <p>For the first month, Kinescope and Snicker will be available as low as $29 each exclusively from Font Bros. Follow these links for more details:</p>
    <p><a href="http://www.fontbros.com/cgi-bin/redirect.cgi?code=simonson&amp;goto=http://www.fontbros.com/cgi-bin/commerce.cgi?key%3DMASS-KINE%26preadd%3Daction" rel="nofollow">Check out Kinescope at Font Bros</a></p>
    <p>AND</p>
    <p><a href="http://www.fontbros.com/cgi-bin/redirect.cgi?code=simonson&amp;goto=http://www.fontbros.com/cgi-bin/commerce.cgi?key%3DMASS-SNIC%26preadd%3Daction" rel="nofollow">Check out Snicker at Font Bros</a></p>
    <p>Also, we invite you to visit our Free Fonts section which as been updated with two great new fonts, The King and Queen by Fractal Eye and Disko by Blue Vinyl.</p>
    <p>See you there! <a href="http://www.fontbros.com" rel="nofollow">http://www.fontbros.com</a></p>
    <p>Mike &amp; Stuart (the Font Bros)</p>
