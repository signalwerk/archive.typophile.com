      <p>They aren't Christmas trees. They are just trees with snow on them.</p>
      <p>Hmm I didn't have them overlap cause I thought it might be a little busy but I've been looking at this too much. I think I do like the original one more cause there is more contrast with the big swoosh on the A. I know the weights of the letters were different and that was causing it to look off. Not sure if there is any set rules for needing to have all the weights of the letters match.</p>
