    <p><a href="/web/20080905140849/http://www.typophile.com/wiki/Serif" class="wiki">Serif</a> magazine published a series of essays by <a href="/web/20080905140849/http://www.typophile.com/wiki/Robert%252BBringhurst" class="wiki">Robert Bringhurst</a> on typefaces and type styles. I had thought there was one more essay to be published when the magazine ceased publication. Can anyone confirm this? If so, was the essay ever published anywhere else? </p>
    <p>And have the essays ever been published in another form, book perhaps? I keep recommending them to students, but they seem to be unavailable.</p>
    <p>Quixote appears to be gone and none of the old email addresses work, though the web pages for Serif are still up.</p>
    <p>George</p>
