    <p>Hi,</p>
    <p>I'm trying to sell a very extensive collection of American and British typography magazines, books, TDC annuals, graphic design books of all kinds including vintage and first editions.<br>
    Also two full sets of the original OCTAVO magazines.<br>
    Would appreciate suggestions on the best way to do this.<br>
    I know this is not the place!<br>
    But hope to see the books to go to a designer or organization that will appreciate them.<br>
    Thanks for any info.</p>
    <p>Thanks.<br>
    Mara Kurtz</p>
