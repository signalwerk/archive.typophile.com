    <p>i’m looking for the face used on this record album from the 1960s (attached).</p>
    <p>i believe it’s from the Gothic family by Nesbitt circa 1838. there’s a sample letter on the RIT rob roy kelly site — <a href="https://web.archive.org/web/20080830000049/http://www.rit.edu/~rkelly/html/05_obs/obs_plain1.html" title="http://www.rit.edu/~rkelly/html/05_obs/obs_plain1.html">http://www.rit.edu/~rkelly/html/05_obs/obs_plain1.html</a></p>
    <p>as well, there’s gothic 13, which is on the myfonts site —<br>
    <a href="https://web.archive.org/web/20080830000049/http://www.myfonts.com/fonts/linotype/gothic-13/" title="http://www.myfonts.com/fonts/linotype/gothic-13/">http://www.myfonts.com/fonts/linotype/gothic-13/</a><br>
    obviously, that is a condensed version, but possibly from the same family?</p>
    <p>can anyone help me find this particular version? all i need are the cap letters.<br>
    a mac postscript or open type version would be preferable.<br>
    thanks so much. any assistance would be appreciated.</p>
    <p></p><div class="imageWrap"><img src="/web/20080830000049im_/http://typophile.com/files/LCohenSongsLoveHate.jpg"></div><p></p>
