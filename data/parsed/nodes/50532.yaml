    html: |-
      <p>The bad guy here is the editor who should have made it clear from the outset that he is an editor not a book designer. I'm not sure your client understands the role of an editor; I'm not sure the editor understands the role of an editor.</p>
      <p>When forced up against this wall, I would hurry to find examples of Word documents turned directly into books and examples of well designed books. </p>
      <p>Or, go out on a limb and do a rough design. </p>
      <p>Have a fireside chat with your client about the subconscious impact of good vs bad design. Bad design can lead to nonsale or, worse, to a serious blemish on your client as a serious author.</p>
      <p>Good luck. It's stuff like this that earns you the big bucks .</p>
      <p>Curt Akin</p>
