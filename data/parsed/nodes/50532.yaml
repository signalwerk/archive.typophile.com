    html: <p>I'm not really sure what you could do at this point. If it was typeset in MS Word, then that's what need to be printed unless the client wants to have it paid to be redone. I agree that this is a huge oversight by the editor (Then again, I don't work in the book publishing world, so maybe I'm oblivious to the fact that most books are typeset in MS Word...as hard as that would be to believe ;o) )</p>
