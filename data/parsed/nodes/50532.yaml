  html: |-
    <p>My client says he "already paid" an editor $6,000 to set the type, do page flow, etcetera. He thinks he should not have to pay for it done again. His editor only has it in a word document. I think page numbering is already done and fonts are already chosen by his editor in word, so he also thinks this doesn't need to be done.</p>
    <p>I want him to understand the value a designer can bring to his book. How do I help my client understand this with kindness and being confident but not obnoxious? I do not know how to explain to him what the difference is between what I do when I do the book, layout, and type design, and the typesetting, and what his editor did.  He doesn't understand what goes into choosing the size, the different distinguishments of type (fonts, style and spacing) for different kinds of text. He doesn't know how much time goes into typesetting (Paragraph styles, character styles, assigning them to the text one piece of text at a time). I don't want to make him angry and defensive, but his editor didn't do what I will do, and you guys understand. He just isn't a designer and doesn't understand at all. How do you guys explain the value of design to clients?</p>
    <p>Thanks for any help and responses!</p>
