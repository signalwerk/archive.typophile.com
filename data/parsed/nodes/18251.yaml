    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 28.Feb.2006 7.41pm </div>
      <p>==================================================<br>
    Celebrating women in printing and the graphic arts:<br>
    an exhibition and a lecture at St Bride Library.<br>
    ==================================================</p>
    <p>The distaff side: women as printers from the fifteenth century<br>
    to the present day<br>
    . Exhibition, Wednesday 8 March to Thursday 27 April 2006<br>
    . Preview: Tuesday 7 March, 5.30-7.00pm</p>
    <p>Working in a thin space: Harrington &amp; Squires<br>
    . Lecture, Tuesday 7 March 2006, 7.00pm</p>
    <p>Working in a thin space. Exhibition preview and lecture, Tuesday 7 March<br>
    ==================================================</p>
    <p>We begin in the Exhibition Room with a preview of 'The distaff side',<br>
    our concurrent exhibition (details below), from 5.30pm. We will move<br>
    upstairs to the Bridewell Hall for the lecture at 7.00pm.</p>
    <p>Harrington &amp; Squires was founded in 2002 by graphic designers Chrissie<br>
    Charlton and Vicky Fullick to bring letterpress printing and hand-made<br>
    graphics into contemporary use. With an emphasis on traditional<br>
    letterpress printing and beautiful paper, it is their intention to<br>
    produce products which feel and look different from the mass-produced.</p>
    <p>In this talk Chrissie and Vicky will further explain their rationale for<br>
    setting up their workshop and describe how they approach the work they<br>
    do.</p>
    <p>Admission to the lecture is £5 (£3 concessions), on the door.</p>
    <p>The distaff side. Exhibition, 8 March to 27 April<br>
    ==================================================</p>
    <p>The history of women in the printing industry, both as printmakers and<br>
    operators of private presses, is the history of a minority. The earliest<br>
    women to work with type, ink and presses were members of religious<br>
    communities or the heirs of men who had died without male issue. In<br>
    England the Stationers' Company and the printing unions made it very<br>
    hard for women to establish themselves as printers, and it was only in<br>
    the twentieth century that it became generally acceptable for those on<br>
    the 'distaff side' to enter the trade. Even then it was not easy, and<br>
    the majority of those working in the industry today are male.<br>
    Nevertheless, throughout the history of printing in the West women have<br>
    worked as printers. Some have attempted to storm the walls of the<br>
    traditional industry, some have quietly joined the family business,<br>
    while others viewed their work quite differently: as therapy, as<br>
    rebellion, as a genteel hobby, as an educational tool, or as a means of<br>
    creative expression.</p>
    <p>The exhibition attempts to represent the different kinds of women<br>
    printers, and the different work they did, between the fifteenth century<br>
    and the present day.</p>
    <p>Exhibition curator Paul W. Nash works as a freelance bibliographer and<br>
    printing historian. He was formerly a rare books librarian at the<br>
    Bodleian Library and the Royal Institute of British Architects. He is<br>
    editor of The Private Library and Printing History News, and has written<br>
    on private presses and architectural books.  He is currently researching<br>
    a book on the Samson Press, which was operated on a commercial basis by<br>
    two women between 1930 and 1967, and on which he spoke at the Hidden<br>
    Typography Conference at St Bride in 2003.</p>
    <p>Exhibition Room, St Bride Printing Library, Bride Lane, Fleet St,<br>
    London EC4Y 8EQ<br>
    Telephone: 020 7353 4660</p>
    <p>Hours of opening: Tuesday-Thursday, 12.30-5pm (9pm on Wednesday)</p>
    <p>We would recommend that you do call beforehand to check access to the<br>
    exhibitions, especially if making a long trip.</p>
    <p>Entry to the exhibition is free.</p>
    <p>For further information, see: <a href="http://www.stbride.org" title="www.stbride.org">www.stbride.org</a></p>
