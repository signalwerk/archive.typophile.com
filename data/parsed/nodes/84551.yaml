    html: |-
      <p>There are several problems: </p>
      <p>First, the Tiffany swash letters, which were available for film headline setting back in the '80s, have not been digitized. In fact, I'm pretty sure they were not even officially part of the ITC design, but were added by someone else. So, it's not likely that ITC (Monotype) will add them back in.</p>
      <p>Second, the letters in the logo are not faithful renderings of the original typeface or the swash characters. Either they were not drawn well to begin with (a knock-off font, perhaps), or they were retraced or redrawn for the logo by someone who was not very skilled. It's close enough to tell what font it's based on, but not a perfect match. </p>
      <p>Given these two problems, there is almost no way you could match the letter shapes with existing digital fonts. The Bodini Classic Swashes are roughly similar, but it's a completely different font, so it's not surprising that they don't match all that well.</p>
      <p>If you need to recreate this, your best bet would be to trace it by hand (if you have the skill to do that), or auto trace a high-res scan of it.</p>
