    html: <p>This goes both ways. <br><br>I can’t count how many times clients have asked us to send  <br>them the fonts after we’ve created a piece that they will need  <br>to maintain or update internally. Our standard answer  <br>is simply that we can’t legally do that. Sure they may think  <br>we’re stiﬀs, but they also realize that we’re just protecting  <br>ourselves, and not trying to be&nbsp;jerks.</p>
