    html: <p>If the freelancer is a part time or full time employee, the fonts should be licensed to the agency and your freelancer may use them for your agency project. <br><br>If your freelancer is nothing more than a work for hire person (1099er), they must be the license holder of the font however they legally can’t/shouldn’t give the fonts to you with their ﬁles due to the license they hold as the owner. <br><br>If you wish to alter the work after it has been completed, you should purchase the fonts in the name of the agency or have the freelancer (aka license holder) go back and do the work. Most licenses aren’t transferrable without some sort of agreement with the foundry. <br><br>Beyond that, the only other stipulation <span class="caps">MOST</span> <span class="caps">EULA</span>s have is for service bureaus. Most licenses contain a passage to the eﬀect of you may give the fonts to a service bureau to output and produce the job, but they must delete the fonts from their <span class="caps">CPU</span> once the job is completed and they may not archive a copy of the font. <br><br>I hope my explaination doesn’t sound dogmatic but in practice, this would be the “proper” way to do this sort of thing since you asked… <br><br>Stuart&nbsp;:D</p>
    html_clean: <p>If the freelancer is a part time or full time employee, the fonts should be licensed to the agency and your freelancer may use them for your agency project. <br><br>If your freelancer is nothing more than a work for hire person (1099er), they must be the license holder of the font however they legally can’t/shouldn’t give the fonts to you with their ﬁles due to the license they hold as the owner. <br><br>If you wish to alter the work after it has been completed, you should purchase the fonts in the name of the agency or have the freelancer (aka license holder) go back and do the work. Most licenses aren’t transferrable without some sort of agreement with the foundry. <br><br>Beyond that, the only other stipulation <span class="caps">MOST</span> <span class="caps">EULA</span>s have is for service bureaus. Most licenses contain a passage to the eﬀect of you may give the fonts to a service bureau to output and produce the job, but they must delete the fonts from their <span class="caps">CPU</span> once the job is completed and they may not archive a copy of the font. <br><br>I hope my explaination doesn’t sound dogmatic but in practice, this would be the “proper” way to do this sort of thing since you asked… <br><br>Stuart&nbsp;:D</p>
