    html: <p>The AIGA published a paper called <i>Use of Fonts</i> as part of their Business and Ethics series. I don't recall if it covers this specific issue, but you might want to check out the PDF at <a href="http://www.aiga.org/resources/Content/4/6/0/documents/AIGA_2Font.pdf" target="_blank"> www.aiga.org/resources/Content/4/6/0/documents/AIGA_2Font.pdf</a>. <br> <br>-- K. <br></p>
