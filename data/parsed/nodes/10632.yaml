    html: <p>Most typical font licenses are for use on a limited number of devices at a single site. Oﬀsite freelancers (or company employees working at home) would need to have their own license to use the fonts, unless an extended license is negotiated with the foundry in advance. <br><br>It’s between you and the freelancer as to who pays for the fonts, of course. If they’re speciﬁed for a particular project, it’s nice if the hiring company pays the freight on typefaces. <br><br>An easy way to manage this is to have the freelancer purchase the fonts themselves, so that they will be listed as a legitimate licensee in the foundry’s records. This is also really helpful if the freelancer needs tech support on the fonts. <br><br>The freelancer can add the cost of the fonts into the job as an expense, and when you pay the ﬁnal bill, you pay for the license for the fonts required for your project(s). If you negotiate to make the freelancer pay for the fonts, he/she will have to purchase their own license from the foundry anyway. <br><br>The terms of the End User License Agreement (<span class="caps">EULA</span>) from each foundry vary, so review them carefully, or ask the foundry itself, if you’re not sure about the rules. <br><br>I am sure you will get some really great answers from more people here on Typophile, and it will happen soon! <br></p>
    html_clean: <p>Most typical font licenses are for use on a limited number of devices at a single site. Oﬀsite freelancers (or company employees working at home) would need to have their own license to use the fonts, unless an extended license is negotiated with the foundry in advance. <br><br>It’s between you and the freelancer as to who pays for the fonts, of course. If they’re speciﬁed for a particular project, it’s nice if the hiring company pays the freight on typefaces. <br><br>An easy way to manage this is to have the freelancer purchase the fonts themselves, so that they will be listed as a legitimate licensee in the foundry’s records. This is also really helpful if the freelancer needs tech support on the fonts. <br><br>The freelancer can add the cost of the fonts into the job as an expense, and when you pay the ﬁnal bill, you pay for the license for the fonts required for your project(s). If you negotiate to make the freelancer pay for the fonts, he/she will have to purchase their own license from the foundry anyway. <br><br>The terms of the End User License Agreement (<span class="caps">EULA</span>) from each foundry vary, so review them carefully, or ask the foundry itself, if you’re not sure about the rules. <br><br>I am sure you will get some really great answers from more people here on Typophile, and it will happen soon! <br></p>
