  html: '<p>Hello, <br>I work for a company who is going to hire out a designer for some marketing materials. Questions is: Do we buy the fonts being used in the design for the designer or does the designer have to provide the fonts for us? (The designer will be working off site) <br> <br>If we already own this font can we "give" it to the designer for use on the work he/she will be doing for us?  <br> <br>Is there any legal information on the web I can reference about this? <br> <br>Thanks for your help! <br> <br>kb</p>'
