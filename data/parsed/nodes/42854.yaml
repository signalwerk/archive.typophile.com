      <p>Are you speaking of designing a logo for a restaurant? An advertisement? A menu? </p>
      <p>James has given you good advice, I’d just like to add if you are designing/working on the menu - find out what the age group will be frequenting the restaurant. Keep a style in mind for what their eyes can read...  Also, how is the lighting at the restaurant? Older folks need larger type... etc. etc. etc.</p>
