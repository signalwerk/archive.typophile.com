    html: <p>This is a sticky wicket. The product they are selling lets users punch out letters. It doesn't wash with most font licenses, (at least mine). In this case, Quikutz has to reproduce the letterforms to create the tool, and make minute adjustments to create the "die" that punches the letter.  <br> <br>I'll note the sad irony that a mechanical device is being used to create unathorized uses of a digital font. <br> <br>Joe VanDerBos <br><a href="http://www.joevanderbos.com/frametype.html" target="_blank">www.joevanderbos.com/frametype.html</a></p>
