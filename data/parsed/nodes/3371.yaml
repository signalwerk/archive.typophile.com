    <p>The modern day font designer has a new more evil, more deadly threat than those who enjoy Carracho, Gutella, Hotline, etc. . . <br> <br>40 Year old single women with a pension for scrapbooking. These gals will stop at nothing to get their grubby hands on a as many fonts as are available and to add insult to injury will make these super secret "collections" available to the public in the form of eBay auctions and, retail software products for sale. <br> <br>In almost every case, these font finds are indeed commercial fonts or fonts with a do not distribute read me. <br> <br>I am starting this thread to spotlight what may be infringing efforts on the part of those who'd care to make a quick buck at our expense. Please feel free to contribute what you deem questionable font collections for resale. <br> <br>Stuart :D <br> <br>Please check out: <a href="http://www.instantscrapbookfonts.com/" target="_blank">http://www.instantscrapbookfonts.com/</a></p>
