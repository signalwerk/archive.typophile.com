    html: |-
      <p>It depends on what you mean by "all letters and punctuation," what quality level is desired, and how experienced you are.</p>
      <p>There is a big learning curve on doing this well. Proper outline construction is complicated. Spacing can also be very tricky. If your handwriting font has connecting letters, spacing is much easier, but getting connections right is equally challenging.</p>
      <p>At the extremes, there are a few people who can do a basic English alphabet, numerals and basic punctuation (70-80 glyphs) in  maybe two hours—usually with all sorts of tricks and automation assistance—and people who have taken several person-years to do the same.</p>
      <p>I expect that my speed is a bit more average. I can prototype a design with that same minimal character set in maybe 12-20 hours. But that's not anything I would ship, either in terms of quality or character set completeness. Getting something polished and complete can easily run into months... or years. Hypatia Sans took five years for the upright and another three for the italics, though most of that was not full time. Slimbach spent some 15 years on Garamond Premier, though also not full time.</p>
      <p>Cheers,</p>
      <p>T</p>
