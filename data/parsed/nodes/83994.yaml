    html: |-
      <p>@nitrofurano:<br>
      <cite>i think Fontforge is software-libre (gpl-compatible), not open-source</cite></p>
      <p>Unfortunately, people will continue to call Linux an open-source operating system... <em>and</em> they will continue to call it Linux instead of GNU/Linux too.</p>
      <p>It is true that the term "open-source" is sometimes applied also to software that is not free software, that is not under the GNU or BSD licenses - where the source is visible in a "look-but-don't-touch" fashion. But the basic thing here is that while GNU has proposed some alternative vocabulary, it hasn't really caught on, and so I can't recommend using their terminology if you want to be readily understood by the largest possible audience.</p>
