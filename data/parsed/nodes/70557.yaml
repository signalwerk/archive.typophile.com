      <p><cite>What is the "web fonts game"?</cite></p>
      <p>That’s the one where you design a font for web use and everybody places bets on what rendering method makes the font look best. You get extra points if designers don’t think you’re crazy when you try to explain that great web text fonts will probably require optical sizes customized for different rendering environments.</p>
