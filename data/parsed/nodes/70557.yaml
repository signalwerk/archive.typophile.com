    html: |-
      <p>@jayyy</p>
      <p><em>Why would it be preferable to use Google's service for @font-face type hosting when they have a pretty crappy catalog of unknown faces when a designer could use Typekit for quite a nominal fee?</em></p>
      <p>Two things:<br>
      1) I expect sharp improvements in the Google selections very quickly. When Typekit first announced, they had NO CATALOG. Nothing. They were in private Beta (if that) with nothing to see at all. Vaporware.<br>
      Google's style is different, they don't mind releasing with next to nothing and evolving in full public view.<br>
      And in that there is now precedent for font hosting and they don't have to deal with complex licensing issues from commercial font designers concerned with unlicensed copying, expanding the catalog is a lot easier and can be expected to move much more quickly than it did for Typekit.</p>
      <p>2) Because the fonts are freely licensed, there aren't any of the inefficiencies involved with obfuscation if you use Google. Typekit's appeal to font designers is that they have a strategy in place to discourage download-and-installation.<br>
      With Google (and Kernest, to name one other), you can use straightforward CSS. (Their javascript API is cool to have, but optional. Icing on the cake.)</p>
      <p>Them's the differences that I can see right now.</p>
    html_clean: |-
