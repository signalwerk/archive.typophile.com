      <p>@all<br>
      To show you how quickly things change:<br>
      A lot of commenters here and elsewhere write like Typekit has been around forever and a part of the natural order of things.<br>
      Last year when they were a part of the Web Fonts panel at <a href="http://readableweb.com/web-font-players-converge-at-typecon-2009/" rel="nofollow">Typecon in mid-July, 2009</a> <strong>they had nothing but an alpha demo.</strong> Nearly vaporware. All they had was a proof of concept to show the type designers at the conference. After that, it took months for them to get out of Beta.<br>
      So they've been around well less than a year. (And now they're the gold standard - this shows you the power of being "first with the most".)</p>
      <p>Google is doing with Google fonts what Google does: release at a very early stage and then evolve in full view. Plus, it's set up as an open source project from the get-go and so collaboration will be a big part of the effort. Plus, they've partnered with Typekit so the learning curve for them is greatly reduced.<br>
      Bitching about the "quality" of the few fonts they're offering beside Droid is beside the point. They're just getting started.<br>
      What's important is that they <em>have</em> started: @font-face is supported broadly enough to warrant Google's attention.</p>
