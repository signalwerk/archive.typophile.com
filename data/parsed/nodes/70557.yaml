      <p>Indeed; it's <em>very</em> hard to definitively say that any web font "works great small". Droid might work alright in one environment, but it also falls apart in other environments.</p>
      <p>While a discussion over which rendering approach is best probably won't help much, I do agree with Johnny that many people – even those of us who should know better – often don't take the time to check how things look across the board. And understandably so; doing a proper test even in a minimal number of browsers can be a pain.</p>
      <p>Unfortunately, it seems that a majority of the people who only check one environment seem to do so in one of the more forgiving environments (on a Mac).</p>
