      <p><cite>Also, would be interested to hear any opinions on the quality of these initial fonts posted here:</cite></p>
      <p>I wouldn’t say that any of these fonts is a bad screen type. But I really don’t see why Google offering free hosting of these fonts is necessary, or even especially useful. There are already other options out there for free font hosting and for converting such fonts for self hosting. And history suggests that the open-source crowd will eventually create many more offerings just for the sake of doing it.</p>
      <p>More importantly, you also noted, most these fonts aren’t going to work at smaller sizes. If Google really wants to add something of value to the web fonts world it needs to go beyond offering the same free fonts that everyone else will. Commissioning type designers to build out open-source screen type families with a wide range of character sets would be much more valuable then hosting extant free fonts ;)</p>
