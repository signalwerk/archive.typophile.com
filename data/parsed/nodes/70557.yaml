      <p>&gt;Google has always been releasing early and often, and the font directory is clearly labelled "beta". Many of the faces don't have the most rudimentary hinting, some (like Crimson Text) aren't even really spaced yet.</p>
      <p>This approach doesn't work very well for fonts, where users expect the basics (eg. spacing) to be right, and more importantly not randomly change from version to version causing documents to reflow. That was one of the main reasons Adobe, when upgrading their library renamed fonts Std and Pro. It's great that Google is paying for freeware  fonts to be upgraded but there's an argument for nailing the basics first before unleashing what amounts to core web font on the world. </p>
      <p>&gt; Microsoft should be paying damages for the pain TT hinting really is.</p>
      <p>LOL! You do know who invented TrueType, don't you? :-)</p>
