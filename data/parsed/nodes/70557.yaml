      <p>&gt;I was oversimplifying. </p>
      <p>Me too.</p>
      <p>The wikipedia needs editing re fonts, hinting, linking, em, embededding, and more. </p>
      <p>The Mac either uses all the hints, as when the user sets smoothing to a size in the appearance menu, and then uses a size smaller than that setting. Or the user gets no hints, by choosing a point size larger than that same setting. Its simple, and the only bad match is a user with a setting in the appearance menu using an unhinted font below that setting.</p>
      <p>On Windows, unfortunately, there are a lot more bad matches, and to bring it back to topic, the matches are beginning to swarm. A new and interesting question about font development, is whether corrections can be made to fonts fast enough in a live web environment, so bad matches are rematched to good type for users <em>faster than</em> new bad matches "arrive".</p>
      <p>Cheers!</p>
