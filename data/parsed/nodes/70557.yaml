      <p>One thing that I've been thinking about/anticipating for a long time in regards to webfonts....</p>
      <p>A whole lot of people are going to subject their readers to display fonts at body copy sizing. Which is even more troubling than in the print world because not only is it stylistically dubious... most display font on screen simply can't hold up to small sizes at screen resolutions.</p>
      <p>Case in point... Josefin Sans Std Light. One of the inititial fonts on the google webfonts project. Looking at the specimen (<a href="http://code.google.com/webfonts/family?family=Josefin+Sans+Std+Light" title="http://code.google.com/webfonts/family?family=Josefin+Sans+Std+Light">http://code.google.com/webfonts/family?family=Josefin+Sans+Std+Light</a>) it barely holds up below 30 px.</p>
