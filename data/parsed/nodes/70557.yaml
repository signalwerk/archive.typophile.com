      <p>Whenever there's a discussion on webfonts, I feel there's a missing point of view. And that is the point of view of Windows users who's only concern with screen typography is 'reading'. On Windows XP and earlier the default rendering of text is plain old Aliased Type (Unless of course you're running an application that renders type differently e.g. Acrobat Reader, Office 2007 etc...)</p>
      <p>Aliased Type</p>
      <p>Good old Aliased type works perfectly for reading on screen (Courier, Verdana, Georgia at sizes ranging from 8 to somewhere in the teens are pleasant to the eye and easy on the brain). Quality typefaces whether an FF Library font or a TDC Awarad Winner, whether FontShop dubs it 'Web' or it bears the name Droid, all of these and the thousands of print typefaces out there don't even come close to the quality of the "Core System Fonts" when it comes to reading aliased type in your web browser.</p>
      <p>Anti-Aliasing</p>
      <p>The Macintosh has had a great anti-aliasing engine for years now. The baseline and the x-height always align (Unlike PDFs) it looks phenomenal in small sizes even readable in size 6 for certain typefaces. It is part of the OS it is always turned on you don't have to worry about it. It works in all applications unless the application over-rides it. Conclusion: text on the Mac is beautiful to look at, the new @fontface websites look delicious.<br>
      On Windows it is optional to turn on Anti-Aliasing, but with all my respect to those who worked on the algorithm, it looks like a beta. The thing is the Microsoft guys were very resistant to the idea of imitating paper on screen.<br>
      So if you're publishing websites for Mac users to view then the future is now. Otherwise, wait for Microsoft to buy or steal the Apple Anti-Aliasing algorithm and for all PC users to switch to that latest technology, or figure out new fonts that look good when Aliased and yet are beautiful typefaces when it comes to their Contour and overall texture. "The" example to follow is Georgia. Oh wait Verdana Condensed sounds like a good start.</p>
