      <p>As the guy behind Crimson Text, I'd like to add that some of the typefaces just aren't perfect yet. Google has always been releasing early and often, and the font directory is clearly labelled "beta". Many of the faces don't have the most rudimentary hinting, some (like Crimson Text) aren't even really spaced yet. (And still, I saw a weblog using Crimson via the API yesterday. Wasn't too pretty.)</p>
      <p>Fonts like Vollkorn or Cardo have been around for a long time, and Google is trying to breathe new life into them (Vollkorn now has a Bold, for example). I'm sure you'll see huge improvements over the summer.</p>
      <p><em>I see many accomplished typographers lamenting that an uninformed public will be utilizing fonts available to them incorrectly.</em></p>
      <p>I see them too. But most of the fonts were freely available a long time before Google's font directory. Will the hype on the new API reach enough of those "uninformed" masses to allow them to ruin the web by setting text in 12pt-Tangerine? I doubt it.</p>
      <p><em>How many expert TrueType hinters are there in the world? A dozen, maybe? It's kind of nuts.</em></p>
      <p>Full ack. Microsoft should be paying damages for the pain TT hinting really is. Mac and FreeType seem to be doing fine without it anyway ...</p>
