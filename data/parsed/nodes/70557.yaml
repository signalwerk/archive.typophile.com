      <p>Many of these concerns are so silly!</p>
      <p>While I can understand the hubbub over which typefaces Google chose, cannot we all be happy that typography is once again in the limelight, with a massive player by its side?</p>
      <p>I was just lamenting to a group of web developers that paltry choice of typefaces available and they all scoffed at me. <em>So unimportant!,</em> they said, <em>get over it!</em> they said. But web developers are getting more graphic tools in their arsenal and they have to pay next to nothing to do it. </p>
      <p>Why is there no celebration over that? </p>
      <p>The best way to kill something is to restrict it to the closed doors, in tall Ivy-draped towers. That's my opinion.</p>
