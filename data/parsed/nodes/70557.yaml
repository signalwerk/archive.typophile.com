      <p>it is true... text rendering on windows is pretty terrible. "Clear-type" is a hack that is being marketed as a feature. I can consistently see the color fringes on clear type handled text... and it bugs me a lot.</p>
      <p>The interesting thing—which gives weight to the argument that the type with which a reader is most familiar is the most legible—is that many a longtime XP user will complain that fonts rendered on Macs are too "fuzzy". It infuriates me.. but it's a fact.</p>
