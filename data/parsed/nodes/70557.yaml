      <p>Hey all, I took screenshots and compared of each of the typefaces in all three main Windows rendering styles: ClearType, Standard, and Anti-Aliasing Off. Unsurprisingly, the Droid Family is the only font in this set that I would use for body text. All others are only suitable for headers or display text. And I would avoid using Inconsolata, Tangerine, Josefin, and Cardo except at really large display sizes (36px or larger).</p>
      <p>You can see <a class="freelinking external" href="http://catcubed.com/2010/05/20/comparing-open-source-fonts-part-2/" rel="nofollow">my font comparison chart here</a>. Each font listed links to it's corresponding screenshot to make it a handy reference for all you mac-only designers.</p>
