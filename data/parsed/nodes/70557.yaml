      <p>I don't think the "catalog is crappy". The fonts offered are great in my opinion. I found Barry Schwartz's Goudy to be a closer match to my 24pt Goudy Old Style Italic metal font than Adobe's. Iconsolata is a personal favorite.</p>
      <p>The Google team working on this is doing a great job, and the service they offer is great. The only problem is rendering and that's not Google's problem.</p>
      <p>The @font-face model (delivering the fonts and not controlling the outcome) is one way to approach typography on the web. The other model is delivering rendered type (for example: GIF, Flash etc...) a great example of that is the Featured Face here on Typophile, another great example is the Preview on MyFonts and other font retailers; this reminds me of the 3rd party typesetter it's like working with Linotype lines and Linocuts instead of moveable type.</p>
      <p>@font-face is like cast Glass Type. Unlike Lead Type(web safe fonts) it breaks it doesn't bend. But with appropriate ink(Browser) and an appropriate Press(OS) and above all with a skilled printer(Web Designer) it may very well produce great results.</p>
