    html: <p>Can any one help me how to find out if python is installed or not? After installing Python and the opening the macro toolbar, i tried doing an example(mentioned in the fontlab manual). After selecting the middle effects from the middle dropdown, the rightmost dropdown is greyed out and nothing happens. I think python is installed but no effects installed? I am getting an output saying the opened glyph is S and no of fonts open is 1 when i am running the macro.</p>
