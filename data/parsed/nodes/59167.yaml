      <p>There are a number of Old English digital versions, but the one in the <a class="freelinking external" href="http://www.fonts.com/FindFonts/Detail.htm?pid=242911&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=45116&amp;query=%22OLD%22&amp;SCOPE=Fonts" rel="nofollow">Monotype Scripts 1</a> package seems closest for more letters. The W and y are disconnects in some of the others "Old English" fonts.</p>
      <p> - Mike Yanega</p>
