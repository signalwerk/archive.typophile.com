      <p>I can't remember seeing a van der Rohe typefaces, but I can remember seeing some faces in the De Stijl journals - Theo van Doesberg. Kinda similar philosophies.</p>
      <p>Obviously, the Bauhaus works incorporate those ideals. Might be a place to start. and as the learned gentleman above says, building signage is a good place to look for an architects type discipline.</p>
      <p>Personally, I think van de Rohe would have been a fan of Futura.</p>
