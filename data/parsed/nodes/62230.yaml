      <p>Not that I know of but the typical array of modernist fonts designed by others are used in association with his work.<br>
      I don't know if this exactly qualifies but he did design signage for the Toronto-Dominion Centre. Wickipedia states: "Even signage graphics were restricted to only white backlit letters within a black aluminum panel, and only in the specific font that Mies had designed for the T-D Centre.</p>
      <p>ChrisL</p>
