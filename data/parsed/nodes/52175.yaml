    <p>Hi all, </p>
    <p>I am in the market for a new typeface, its for my own business, I own a web design company. </p>
    <p>I have some shapes in my head, I know I will probably get slated for this, but at the minute, the closest I can find is actually the logo for a bank:</p>
    <p><a href="http://www.barclaycard.co.uk/_images/header/logo_alt.gif" title="http://www.barclaycard.co.uk/_images/header/logo_alt.gif">http://www.barclaycard.co.uk/_images/header/logo_alt.gif</a></p>
    <p>I believe the type is a custom font, by the bloke who made Arial of all people. Anyway, what I like about it is that it is both curvy, yet not too playful, gets that's the sort of thing I am looking for.</p>
    <p>Can anyone make any suggestions?</p>
    <p>Thanks</p>
