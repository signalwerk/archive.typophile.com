      <p><em>such that prices aren’t competitively brought down by market forces.</em></p>
      <p>Don't expect market forces to work "correctly" under virtual monopolistic circumstances.</p>
      <p>If Apple, Adobe and Microsoft didn't bundle hundreds of fonts for free with their apps, there might be the kind of mass market where indie font manufacturers could reduce prices to a few dollars, because we would be shifting tens of thousands of font licences, rather than hundreds.</p>
      <p>However, don't expect things to remain the same either. It may be possible for reputable independent foundries to develop high volume, low price marketing models, as the industry progresses. After all, as a retail phenomenon, the indie font business only really got started in around 1999, with e-commerce, and is still gathering steam. Note the low price of some impressively stacked Opentype fonts in the Myfonts best-sellers; a lot of value there.</p>
      <p><em>copyright monopoly</em></p>
      <p>That doesn't have much to do with it (see above).<br>
      However, copyright protection is probably a bit too long. William St Clair found that when it was 12-24 years (for literary works), that produced the most dynamic cultural effects (in his book<em> The Reading Nation in the Romantic Period</em>).</p>
      <p>With a controlled market and long copyright protection, St Clair found a situation where the dominant businesses produced new material at high prices, allowing them to milk their legacy assets, in various price brackets geared to different levels of purchaser, for long periods of time. I'm not quite sure how that compares with fonts. It's hard to compare intellectual property for physical and digital products, and I haven't finished his book yet, let alone tried to figure out how it fully relates to fonts.</p>
