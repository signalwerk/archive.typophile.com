      <p>Nope. It is obvious in the extreme to myself and other type professionals here that you have a very slim grasp of how the font industry really works and how prices are determined. The only "sticker shock" is experienced by unprofessional designers and unprofessional font users whose expectations of price are unrealistic, and unprofessional.</p>
