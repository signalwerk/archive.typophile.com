      <p>Hi there:</p>
      <p>Spottedfeather&gt; As much everyone in this thread thinks they know you, they don't. WE DON'T KNOW YOUR SITUATION. If $30 (or the $255 you'll have to pay to actually get Coop Flaired) is too much for you to pay- that's fine. There are alternatives of similar stylization that might interest you.</p>
      <p>Browse this foundrys' listings<br>
      <a href="http://www.myfonts.com/browse/foundry/btn/" title="http://www.myfonts.com/browse/foundry/btn/">http://www.myfonts.com/browse/foundry/btn/</a></p>
      <p>Specifically:<br>
      <a href="http://www.myfonts.com/fonts/btn/grilled-cheese-btn/" title="http://www.myfonts.com/fonts/btn/grilled-cheese-btn/">http://www.myfonts.com/fonts/btn/grilled-cheese-btn/</a></p>
      <p>and </p>
      <p>The bold weight of this font is very close to Coop Flaired<br>
      <a href="http://www.myfonts.com/fonts/btn/hawaiian-aloha-btn/" title="http://www.myfonts.com/fonts/btn/hawaiian-aloha-btn/">http://www.myfonts.com/fonts/btn/hawaiian-aloha-btn/</a></p>
      <p>or</p>
      <p><a href="http://www.myfonts.com/fonts/btn/roller-world-btn/" title="http://www.myfonts.com/fonts/btn/roller-world-btn/">http://www.myfonts.com/fonts/btn/roller-world-btn/</a></p>
      <p>Yes these fonts are for-pay, but 12.99 surely beats the 200 plus you have to put out. As for me I would not even spend 2 cents on Coop- its the ugliest thing in the world. That's me. But House Industries- the foundry- makes a quality product. This means that the metrics (letter spacing), glyph design, hinting (how well it looks on screen) is virtually perfect. And that' where the higher price come from.</p>
      <p>That's not to say all quality fonts are well priced- Device Fonts (cute but pricey) , Gary Munch's Really, and everything by Red Rooster is stupidly priced!</p>
      <p>But anyway- I hope I have helped you. And don't listen to the goons in this thread. Typophile can be a great resource- use it to your advantage.</p>
      <p>All my best to you,</p>
      <p>Mike Diaz :-)</p>
