      <p>DanGayle's attack is unfounded - don't blame the customer!</p>
      <p>A ballpoint pen is "simple." with no infrastructure, a ballpoint pen would cost the equivalent of millions of dollars and thousands of manhours to reproduce.  Even with the infrastructure, a ton of sweat and and work and design goes into a ballpoint pen. Yet a pen is 99 cents and is incredibly lucrative. With computers, just as many people potentially use fonts today as use pens. In a market economy, a font is in fact "simple." </p>
      <p>A font is like any other type of industrial design.  A michael graves toaster from Target can be a legitimately amazing, beautiful piece of design and have all the soul and sweat and artistic achievement in the world, and still be dirt cheap.</p>
      <p>The consumer's expectations aren't the problem...it's usually the suppliers' business model.</p>
