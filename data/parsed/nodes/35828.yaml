      <p>I think there are a few threads on Typophile right now that are moments away from becoming insult-fests. It is ok for someone not to be able to afford a $30 font. I think it is far better that the person is making an effort to rightfully license a font that they can afford rather than trolling with the pirates looking for a copy of Coop to use without proper licensing. </p>
      <p>At the end of the day it is what is done with the font that matters not the original cost (or quality) of the font. </p>
      <p>Let's keep it above board and not go around insulting anyone.</p>
