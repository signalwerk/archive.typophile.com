      <p><em>...its really a sad state of affairs when an industry has to start splitting its potential clientele into two groups: “thieves” and “not-thieves.” that’s usually an indication that prices are out of control.</em></p>
      <p>No, it's not that simple. You make that polarization, not us.</p>
      <p><em>Its the same problem the music industry has.</em></p>
      <p>No it is not.</p>
      <p><em>...the font liscencers are a little bit guilty of having a copyright monopoly - such that prices aren’t competitively brought down by market forces.</em></p>
      <p>Absolute twaddle. We have no "copyright monopoly". Copyright 'law' in the U.S practically undermines the very principal of copyright. Font prices <strong>are</strong> set by supply and demand. The market pays what it thinks fonts are worth---the price(s) they sell for.</p>
      <p><em>The problem is that they have control of virtually infinite copyrights - that guarantee out of proportion prices and lead to this sort of “sticker shock.”</em></p>
      <p>Nope. It is obvious in the extreme to myself and other type professionals here that you have a very slim grasp of how the font industry really works and how prices are determined. The only "sticker shock" is experienced by unprofessional designers and unprofessional font users whose expectations of price are unrealistic, and unprofessional.</p>
      <p><em>...i think you’d see instant success.</em></p>
      <p>The type industry is quite successful the way things are, thankyou. What makes you think there is a lack of success?</p>
      <p><em>The fact is a font is not just a singular work of art - its also mass liscensed and mass distributed consumer design element, like a tube of paint.</em></p>
      <p>Fonts are not mass-consumed. In the case of commercial fonts they are commercially consumed, but not <em>en masse</em> the way music and films are.</p>
      <p><em>I’m more interested in a “IKEA” for fonts than an “itunes” Great design, widely distributed, for less!</em></p>
      <p>If you think IKEA furniture is great design you need to discover real furniture.</p>
      <p><em>A font is like any other type of industrial design.</em></p>
      <p>No.<br>
      It.<br>
      Is.<br>
      Not.</p>
      <p>Fonts are not mass-consumed like toasters and the same market economics do not apply. </p>
      <p>In your view fonts are preposterously-priced, but possibly you are forgetting that both large foundries and independents give away at least one high quality font for free, as an incentive to customers. It's also a nice way of showing that we're not consumed with making a buck or obsessed with control of our intellectual property.</p>
