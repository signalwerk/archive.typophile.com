      <p>Fontpla - i agree with the gist. I think part of my skepticism comes from the "man-hours" argument tho. </p>
      <p>The fact is a font is not just a singular work of art - its also mass liscensed and mass distributed consumer design element, like a tube of paint.  In that arena, the "man-hours" argument just doesnt work because its supply and demand - the supply is virtually infinite and the demand is large (as seen in the number of "thieves".  Fonts are NOT "limited edition" and therefore should not be sold at "limited edition" prices.</p>
      <p>My argument is that if you package it better, in more managable increments, you'll sell more and make more money and maybe even have the competition to make better product.</p>
