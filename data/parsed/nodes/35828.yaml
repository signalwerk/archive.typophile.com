      <p>I agree with the Sam;s comparison to the music industry.. Now look where it got them, 0.99 a song on iTunes. That said, I personally, wouldn't pay more than $5 for any font. This is especially true for fonts that have heavily been used in the mainstream. </p>
      <p>Take Coop Flaired for instance- it's the Hannah Montana logo font. So now you got hundreds of little girls trying to make Hannah Montana banners and fan art and they want the font. At $225 for they Coop briefcase, how many have you sold to them? 0.</p>
