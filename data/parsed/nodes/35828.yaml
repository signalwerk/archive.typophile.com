      <p>Absolute twaddle. We have no "copyright monopoly". Copyright 'law' in the U.S practically undermines the very principal of copyright. Font prices <strong>are</strong> set by supply and demand. The market pays what it thinks fonts are worth---the price(s) they sell for.</p>
