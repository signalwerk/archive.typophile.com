    html: <p>Agreed with the recent comment by Miss Tiffany, and crazily this was on my mind last night. I want apologize myself for the comments I made that ruffled a few feathers. I used an exaggerated number for effect, the point being that with the digital age, there are now a LOT of cooks in the kitchen, and while we many of us deserve to be paid like professionals, we cannot demand it, or whine about it when it doesn't happen. Which is why I work for peanuts within my small rural community (population 4,335), and often give my services away to folks that cannot afford to pay for anything. Please, all, understand that I personally appreciate all of your efforts in making this a more graphically beautiful world.</p>
