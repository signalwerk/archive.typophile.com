      <p>First off ... I love you all</p>
      <p>Just because you care </p>
      <p>there's a hand-full of you whose comments brought our office to loud Hurrahs  (as I read aloud this article in particular)</p>
      <p>I'd like to add my own comments on this subject:</p>
      <p>1) there was a time when my pay-rate was such that it was worth it to my boss to pay for the 10+ hours of font fixing required with free (usually un-tested) fonts. Incidentally  I was recently flattered when I was presented with a company credit card specifically for font buying (whooda thunk it) ... I don't say this to brag (much) only to explain that as far as business models go it matters what's worth more, time or money. At this point in our firm's history, so-called "luxury high-priced" fonts are a money now VS money later decision ... </p>
      <p>2) the sad truth of the matter is that for every one of <em>US</em> there are forty or so for whom there exists less than a dozen fonts (Arial and TimesNR being the MVP's)and all the others are considered artsy fluff suitable for kindergarten teachers who want to gussy up their classroom. I get depressed just thinking about it.</p>
      <p>3)No one will care as much about a font as it's creator (save in certain cases where there's some idol worship involved [helvetica]), but this won't stop people from pouring their hearts into great design even at the risk of having their work summed up as "such a simple thing". (personally, going back to the "IKEA" model, if I were to have some fantastic, useful, mass-marketed-high-design artifact that I designed referred to as "such a simple thing" I believe it would be a point of great pride ... but that's neither here nor there)</p>
      <p>that is all ... thank you for bearing with my verbosity </p>
      <p>-Pablo</p>
