    html: <p>I was stubborn for a long time and tried to do everything with TypeTool and VOLT. As you can imagine, help was hard to get. Eventually I was sold on the fact that FontLab's interpolation could take the Regular and Black faces I had done and instantly produce the corresponding Bold for me with very little cleanup needed. After I upgraded, I found that I had put a whole lot of unnecessary work into many things that would have been a lot quicker and easier with FontLab.</p>
