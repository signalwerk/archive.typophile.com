      <p>&gt;<em>Remember, though FontLab holds a virtual commercial monopoly on type design software, their products are not the only ones out there.</em></p>
      <p>Remember also that we type designers are a small community, and FontLab is a part of our community. They support us, just as we support them. FontLab employees visit online forums, hold lectures and workshops at virtually every conference, and help sponsor events, too. Many of the changes they build into their products are based on feedback from paying customers. I think that a company like that is worth my support, and I'm proud to be one of those using their software.</p>
