  html: |-
    <p>OK, so it's not really a contest. As FontLab would kick TypeTools ass. </p>
    <p>However it's time for me to purchase some font software for use at home (I'm still rocking Fontographer at work....gotta love them whoosh and bleeps!) but I'm wondering if TypeTool would be suitable for use at home, or is it gonna be a case of tying a hand behind my back for the sake of a few hundred quid?</p>
    <p>Obviously, it down to what I intend to do, but; I don't want to count anything out. I have grand intentions for my sketches and scribbles and would be super vex if I found something I desperately want is missing from the cheaper option. So I'm interested in full featured opentype with ligatures galore, serious kerning tools, and also a heavy duty proofing system...and quite probably in the future numerous things I don't understand yet.</p>
    <p>Slightly random, but I'm definitely a freehand tool style fan, as opposed to Illustrator style method of handling points etc. Do either lean towards one of those methods?<br>
    From what I've picked up reading the forum, a majority of you use FontLab, I rarely see anyone discussing TypeTool. I guess it's case of you get what you pay for?</p>
    <p>Thanks in advance for any advice imparted, and apologies if there's already an existing thread discussing this.<br>
    Peace y'all!</p>
