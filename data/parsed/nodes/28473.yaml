      <p>I tend to receive the requests, not make them, since I design fonts and rarely touch the stuff myself. :-)  The requests I get rarely mention other shortlisted fonts, for whatever reason. And I almost never decline; my philosophy is that the font scene is too competitive so the most one can hope for in the retail market is to hook people onto your product by letting them use it a little bit. By the same logic, I never cripple my live online samples, and I believe that any font house that does that probably isn't thinking straight.</p>
      <p>hhp</p>
