    <p>Hello,</p>
    <p>I'm just curious about how you all make typeface decisions for clients when you dont have a licence for a particular typeface?</p>
    <p>I know that Fontshop and most foundry websites have functionality to preview any text with a choice of sizing etc. This is helpful for having a quick look, but its not really flexible in that there is no kerning control, and nuisance backgrounds make them hard to work with for mocking up a design.  I understand that foundrys can't be distributing typefaces in the hope that people will buy licences if they actually use it, because we all know that a lot of people simply wouldn't.</p>
    <p>I have a logo to redesign for a business, and I dont know how to go about making the choice.  I cant develop finished artwork with different faces without buying the licences, and the value of the job means that I cant afford to buy several.  </p>
    <p>I guess I can present type samples and gauge which one they like, and work from there.  Is that something designers often do?  Or are you lucky enough to have a wide range of typefaces at your disposal?</p>
    <p>Thanks,<br>
    Jonny</p>
