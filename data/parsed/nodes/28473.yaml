      <p>So, speaking of font previews...</p>
      <p>About an hour ago here at ATypI, Adam and Yuri previewed their soon-to-be updated BitFonter software. It started out as a showcase the new capabilities of the app, but slightly turned into a "be careful what you put on the web" lecture. In about 30 seconds they showed how you can take a bitmap image from MyFonts showing the character set of a typeface and basically auto generate a working font. Obviously there are numerous implication of this feature; surly there are many legitimate uses where this would be great. On the other hand, it might make designers/distributers think again about how they showcase their types.</p>
      <p>r.k</p>
