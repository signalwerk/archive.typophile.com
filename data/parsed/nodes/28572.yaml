      <p>There are many others similar to Meta and Whitney, such as <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=zwo&amp;image.x=0&amp;image.y=0" rel="nofollow">Zwo</a>, for instance. You might also consider <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.11433.0.0" rel="nofollow">Legato</a> or <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=megano" rel="nofollow">Megano</a> (which has a lovely italic).</p>
      <p>The problem being, of course, that there are soooooo many sans faces that all we can do is give our subjective ideas. </p>
