    date_raw: 14 Oct 2006 — 10:02am
    date: 2006-10-14T10:02:00
    votes: null
    html: <p>My problem with sans serifs in editorial settings is that the base weight is just a shade too dark and becomes tiresome to the reader. Linotype Syntax with oldstyle figures has a base weight which I find simply perfect for text. It offers the perfect trade-off between delicacy and strength, and is always clear. Lots of weights make it very adaptable. Try it!</p>
  - id: 162558
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 14 Oct 2006 — 11:19am
    date: 2006-10-14T11:19:00
    votes: null
    html: |-
      <p>Alastair, I think you need to think harder about why you want sans, and if it's really justified. If it's just personal aesthetic preference, that's not Design, that's Art. For one thing, when you state "Readability is highest on the priority list" it simply doesn't jibe... Don't get me wrong, it's very possible that a sans would be your best choice, but I just want to caution against closing your mind based on preferences that don't actually benefit your readers/users. Once your basis is sound, then you can find a good solution. Another way I think you should put your readers first is by telling us more about your magazine and its demographic, instead of focusing too much on the context-less formal attributes of your "ideal" type choice.</p>
      <p>hhp</p>
