    <p>I'm currently working on a redesign for a magazine. We've decided to switch our body copy from a serif to a sans serif. We've been trying out some fonts, however are trying to find a font that has not been used by any mainstream magazines in the USA. We're drawn to fonts like Akzidenz Grotesk, Meta, and Whitney for their legibility and readability. However we would rather find something more independent with a unique personality. Readability is highest on the priority list. Next would be memorable ligatures and subtleties to the characters that could make the font unique to us.</p>
    <p>Any input or suggestions would be greatly appreciated!</p>
