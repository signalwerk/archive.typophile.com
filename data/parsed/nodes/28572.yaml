      <p>I don't think there is a law against using a sans as a text face for a magazine. Magazine reading is quite often scanning pages and reading a few here and there.  That is hardly immersive reading. The research that has been done has yet to give you a meaningful measure of how much better a given serif face reads. If you prefer a sans, use one. I don't think the serif Sherif will be by to read you your rights.</p>
