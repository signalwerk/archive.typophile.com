    date_raw: 2 Feb 2012 — 7:35pm
    date: 2012-02-02T19:35:00
    votes: null
    html: <p>I don't think people are too concerned with maximizing their visual perception, or else why would they wear those narrow-slitted rectangular glasses? Admittedly, the style is foisted on the masses by the spectacles industry, but there nonetheless seems to be a willingness amongst its victims to appear <em>au courant</em>, to the detriment of what they see.</p>
  - id: 493710
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 2 Feb 2012 — 7:40pm
    date: 2012-02-02T19:40:00
    votes: null
    html: |-
      <p>One thing to remember is how narrow an angle the <em>fovea</em> subtends.</p>
      <p>hhp</p>
  - id: 493854
    user_id: 2021
    user_name: Nick Shinn
    user_path: null
    date_raw: 3 Feb 2012 — 7:31pm
    date: 2012-02-03T19:31:00
    votes: null
    html: |-
      <p>Another is that the eyeball moves in its socket, but the frames do not track that movement.<br>
      So when one looks down, wearing one’s slitty glasses, the parafovea covering the ground immediately in front of one is not lensed, and the bottom of the frame is visible.</p>
  - id: 493857
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 3 Feb 2012 — 7:57pm
    date: 2012-02-03T19:57:00
    votes: null
    html: |-
      <p>Except while reading our eyes only move laterally.<br>
      When we move down the page our eyeballs don't do<br>
      much vertically - we tilt the neck.</p>
      <p>Considering how central vision is to our existence I<br>
      have to think that any pair of glasses that severely<br>
      inhibits functionality would be rejected by anybody<br>
      with half a brain. Which is, like, almost everybody.</p>
      <p>hhp</p>
