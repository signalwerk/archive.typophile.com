    <p>I have 3 questions related to the Open type feature 'locl'</p>
    <p>1. It seems that there is no application support for the 'locl' feature yet. Thomas Phinney agrees that there is none in Adobe products ( yet). But is it in Microsoft Vista/longhorn? </p>
    <p>2. Henadij posted some locl feature code here:</p>
    <p><a href="http://www.typophile.com/node/15506" title="http://www.typophile.com/node/15506">http://www.typophile.com/node/15506</a></p>
    <p>Does anybody know if that code was written correctly? Is there is any sample code for this feature? I have been googling but to no avail. </p>
    <p>3. Would anybody share their code? I wanted to build some Polish &amp; Czech localization into a font!</p>
    <p>Thanks!</p>
