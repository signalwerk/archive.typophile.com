    html: |-
      <p>Chester, this is wrong: </p>
      <p>feature ss01 { # Polish Localized Forms<br>
      language PLK exclude_dflt; # Polish;<br>
      sub @loclPLK1 by @loclPLK2;<br>
      } ss01;</p>
      <p>Maybe not wrong, but doesn't make much sense. You want the "locl" feature to work in the Polish language context but you want the stylistic set work regardless of the language context. </p>
      <p>Here is an example how locl, ss01, ss02 and salt could work for Polish and Romanian localized forms. </p>
      <p># START </p>
      <p># Define classes for substitutions<br>
      @loclPLK1 = [Cacute Nacute Oacute Sacute Zacute cacute nacute oacute sacute zacute];<br>
      @loclPLK2 = [Cacute.PLK Nacute.PLK Oacute.PLK Sacute.PLK Zacute.PLK cacute.PLK nacute.PLK oacute.PLK sacute.PLK zacute.PLK];<br>
      @loclROM1 = [Scedilla scedilla];<br>
      @loclROM2 = [Scommaaccent scommaaccent]; </p>
      <p># Define locl (Localized Forms) feature<br>
      feature locl {<br>
      # Latin script, this is optional<br>
      script latn;<br>
      # Next lookup applies to Romanian language context only<br>
      language ROM exclude_dflt;<br>
      # Define and implement loclROM lookup<br>
      lookup loclROM {<br>
      sub @loclROM1 by @loclROM2;<br>
      } loclROM;<br>
      # Next lookup applies to Polish language context only<br>
      language PLK exclude_dflt; # Polish;<br>
      # Define and implement loclPLK lookup<br>
      lookup loclPLK {<br>
      sub @loclPLK1 by @loclPLK2;<br>
      } loclPLK; </p>
      <p>} locl;</p>
      <p># Define ss01 (Stylistic Set 1) feature for Polish localized forms<br>
      feature ss01 {<br>
      # Next lookup applies to the default language context only<br>
      language dflt;<br>
      # Refer to the loclPLK lookup defined earlier<br>
      lookup loclPLK;<br>
      # The lookup above also applies to the Polish language context<br>
      language PLK include_dflt; # Polish;<br>
      # The lookup above also applies to the Romanian language context<br>
      language ROM include_dflt; # Romanian;<br>
      } ss01;</p>
      <p># Define ss02 (Stylistic Set 2) feature for Romanian localized forms<br>
      feature ss02 {<br>
      # Next lookup applies to the default language context only<br>
      language dflt;<br>
      # Refer to the loclROM lookup defined earlier<br>
      lookup loclROM;<br>
      # The lookup above also applies to the Polish language context<br>
      language PLK include_dflt; # Polish;<br>
      # The lookup above also applies to the Romanian language context<br>
      language ROM include_dflt; # Romanian;<br>
      } ss02;</p>
      <p># Define salt (Stylistic Alternates) feature for all stylistic substitutions<br>
      # This feature defines and implements just one lookup<br>
      # that applies to all language contexts<br>
      feature salt {<br>
      sub @loclROM1 by @loclROM2;<br>
      sub @loclPLK1 by @loclPLK2;<br>
      } salt; </p>
      <p># END</p>
      <p>Regards,<br>
      Adam</p>
