      <p>Eben, </p>
      <p>the code Henadij posted is principally correct but it is better to name the glyphs according to the Adobe/FontLab naming conventions: baseglyphname.suffix. Fontlab Ltd. recommends that the suffix for localized forms corresponds either to the primary OpenType feature name that the localized glyph is associated with (that would be "locl") or to the OpenType language tag of the primary language that the localized form is associated with (that would be "PLK" for Polish in Henadij's example). </p>
      <p>So if I wrote the code, it would be: </p>
      <p>@loclPLK1 = [cacute nacute oacute sacute zacute];<br>
      @loclPLK2 = [cacute.PLK nacute.PLK oacute.PLK sacute.PLK zacute.PLK];</p>
      <p>feature locl { # Localized Forms<br>
        language PLK exclude_dflt; # Polish;<br>
        sub @loclPLK1 by @loclPLK2;<br>
      } locl;</p>
      <p>Alternatively, the glyph names "cacute.PLK" etc. could be "cacute.locl". </p>
      <p>Adobe software does not parse the glyph suffixes into anything meaningful yet, but Fontlab Ltd. does plan to have some smart algorithms that takes notion of properly formed glyph name suffixes. </p>
      <p>Regards,<br>
      Adam</p>
