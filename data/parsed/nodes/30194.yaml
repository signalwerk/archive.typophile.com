    <p>In the spirit of <a href="http://typophile.com/node/29470" rel="nofollow">Type on the Sony Reader</a> readers may be interested in type on Wii, the device boasts web browsing functionality so type is used for more than the product UI. There's a gallery of images here... </p>
    <p><a href="http://www.engadget.com/2006/12/22/wii-browser-hands-on/" title="http://www.engadget.com/2006/12/22/wii-browser-hands-on/">http://www.engadget.com/2006/12/22/wii-browser-hands-on/</a> </p>
    <p>Difficult to tell too much, except that the browser font seems to be the standard Wii UI font (note the quirky e) and that it doesn't seem to hold up too well at small sizes (well this is on a TV of course) - also can't tell if the bold and italic is true or faked. But still the shots are worth checking out and I'm sure better ones will be posted sooner or later. </p>
    <p>Enjoy, Si</p>
