    html: |-
      <p>So here's my review of type on the Wii browser: it sucks. This isn't so much a problem with the Wii as it is with the browser, which really isn't even finished enough to be called a beta. The zoom functionality needed to make type readable doesn't actually work, so it's pretty much useless. </p>
      <p>It does, however, have the ability to render a lot of flash content, including Typophile.com. This could be a killer app for the Wii; if Google just adds a Wii Youtube portal we can sit on the couch and watch videos.</p>
