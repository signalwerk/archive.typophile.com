      <p>Speaking of type on screen, for xmas I got a Pentax digital camera. I had wanted a new digital camera that didn't take proprietary batteries (as i was getting sick of buying those) and, apparently, Pentax is one of the few companies making cameras that take regular batteries (according to the store clerk, at least).</p>
      <p>Anyways, the camera seems nice enough but will likely have to return it simply because I can not stand the on-screen typography and iconography. I can usually tolerate bad UI as long as the product works, but the Pentax UI just really bugs me for some reason.</p>
      <p>Maybe I'll trade it for a WII. ;o)</p>
      <p>Interesting that the WII is using Opera. Nice to see that!</p>
      <p>sii...in case you missed it, there are some larger images on that site:</p>
