      <p>Obvious perhaps, but originally proportion was pretty much all based on the size of your the nib on your pen.  Calligraphic letters were usually about 7 nib widths high and 4 nib widths wide.</p>
      <p>Also, didn't Gill or Frutiger say something about a percentage of black to white that seemed correct to the eye, something like 60% black to 40% white?  (Those figures are probably off)</p>
