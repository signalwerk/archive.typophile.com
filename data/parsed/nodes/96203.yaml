      <p>I wish it were that easy. Before one can answer the question of stroke contrast, some questions need to be answered about the intended appearance and use of the face. So, if you asked,  "What should be the contrast of a boring bold san serif, for use around 24 point?", one of us could help with an approximate ratio, range, or examples of them. </p>
      <p>You can also just look at some fonts like yours and measure them.</p>
      <p>Hope that helps.</p>
