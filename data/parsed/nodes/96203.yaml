      <p>I know that the answer of this question is 'it dependes'. I ask because I think that proportion is what define a character, i.e if you fail to get a right proportion, your characters look terrible…</p>
      <p>But now I start this discussion; I want to pick a typeface and compare two sizes: let's say FF Quadraat Regular at 6pt and FF Quadraat Regular at 24pt; </p><div class="imageWrap"><img src="http://typophile.com/files/FFQuadraat_4310.png"></div><p></p>
      <p>I resize them to fit in the same x and cap height.<br>
      I think the diference do not exist in this example…</p>
      <p>But, let's discuss it<br>
      ---------<br>
      Thanks<br>
      Fábio Santos</p>
