    html: |-
      <p>You can tell a question is good when the best answer is "It depends".  :-)</p>
      <p>However, a couple of Good Rules, for any text face at any target point size:<br>
      - The caps should be shorter than the ascenders (unless they're unusually narrow).<br>
      - The descenders should be shorter than the ascenders.</p>
      <p>hhp</p>
