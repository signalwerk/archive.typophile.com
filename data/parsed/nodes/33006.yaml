  html: |-
    <p>Dear typophiles,</p>
    <p>I've been fiddling around quite a while with this (it started in type battle #12 or #14, if I can remember), and I think now it's the right time for some feedback whether you like it or not...</p>
    <p>Please concentrate on a-z, A-Z and A.sc-Z.sc at the moment, all the figures and special characters are not very clean yet.</p>
    <p>Even in the basic characters, there are some inconsistencies yet, where I'm not sure which direction I should go (see lowercase r or upper case Y for example). The Smallcaps are still quite dirty, especially the serifs.</p>
    <p>There are 4 cuts at the moment:<br>
    roman book<br>
    roman titling<br>
    italic book<br>
    italic titling</p>
    <p>Maybe there will be a semibold some time later, but this is just an idea. I don't know if it really fits, but it would give some more flexibility for typographers.</p>
    <p>enough talking... chop it :)<br>
    Sebastian</p>
