    html: |-
      <p>I have come back to this a few times. Something was bugging giving me pause but I wasn't sure what - especially since the forms are so nice when they are big. In the end I think I found all the lovely detail &amp; character made the face noisy to me at small sizes. What you are doing for optical scale seems to be working as far as I can tell. Maybe making the intensity of character fade up with display sizes and lessen with text sizes would help me. Or maybe the detail/character needs to be more apparent and isn't just below some kind of threshold. I ma not sure which. </p>
      <p>What do you think of this?</p>
