    html: |-
      <p>I don't see any reason why the eth shouldn't come up to full height. Is there a good one?</p>
      <p>I know that before I knew a lot about fonts, I was distracted even by the fact that a lot of fonts have capitals shorter than their lowercase ascenders. I thought it was an amateur mistake, and distracting. I'm not suggesting you change that, obviously, because it looks good in almost any font, but I think if you leave the eth short like that, your Icelandic reading community is going to be distracted, and a good text font ought to be pretty much invisible to laymen.</p>
