    html: |-
      <p><cite>what is V23?</cite><br>
      Vaughan Oliver’s company. v (Vaughan) 23 (his favourite number). Oliver worked in loose collaboration with photographer Nigel Grierson under the pseudonym <strong>23 Envelope</strong> for years. Later, when setting up his own studio he used <strong>v23</strong>.</p>
      <p><cite>(a)<br>
      who is going to nail the font Cocteau Twins used on some of their early records?</cite><br>
      It was hand-rendered by Oliver on the insistent request of the band. Earlier ones like <a href="http://eyesore.no/html/wrap/CocteauTwins.Garlands.cd.jpg.html" rel="nofollow"><em>Garlands</em></a> were hand-rendered by Nigel Grierson.</p>
      <p><cite>(b)<br>
      who else knows why they chose the name Cocteau Twins</cite><br>
      …Simple Minds</p>
