    html: <p>V23 had a knack for unearthing obscure scripts and serif faces and combining them in such a way that even letterspaced Univers Condensed looked gorgeous. The integration of type with image always was very clever and the overall images usually of a profound poetic beauty. I see them as illustrators who used type beautifully in their work, so I couldn't care less if they broke some rules against kerning or letterspacing or alignment or whatever -- you have to judge the work within its context.</p>
    html_clean: <p>V23 had a knack for unearthing obscure scripts and serif faces and combining them in such a way that even letterspaced Univers Condensed looked gorgeous. The integration of type with image always was very clever and the overall images usually of a profound poetic beauty. I see them as illustrators who used type beautifully in their work, so I couldn't care less if they broke some rules against kerning or letterspacing or alignment or whatever -- you have to judge the work within its context.</p>
