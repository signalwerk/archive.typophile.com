    html: |-
      <p>Ok, after some more reading and consulting with those who were around for Oliver's peak, I think I'm gaining a better understanding of what makes him special. What I lacked was context. It sounds like his type certainly <em>was</em> original at the time and has since been copied by many. Like Yves said, no one used the antique scripts and stuff (deemed by a friend "granny type") until he did. He was doing something new. </p>
      <p>So I sheepishly retract my notion that his work wasn't original. </p>
      <p>But I still feel the type is lacking. It conveys the mood of the music and complements the imagery well, but the setting feels like an afterthought. Unrefined. It's clear that his strengths are in art direction and illustration. The advice of an experienced typographer might have made the work even better.</p>
      <p>I'm reminded of my feelings for Peter Saville, another "mood" designer. But I feel like Saville's work has a complexity and wit that's missing in some of these Oliver pieces.</p>
