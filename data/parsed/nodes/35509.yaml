    html: |-
      <p>Part of the context he was working in was punk. 23v was a graphic reaction away from the rough of punk but it wasn't such a clean break that some of the DIY spirit wasn't still there lingering. So being less than completely fussy about the type may have been natural especially early on. And with music I think looking to the immediate impact may be the greater virtue.</p>
      <p>Having grown up with it like Tiff I probably don't see it objectively though either. I did love all the variation and expressiveness in the type and in the use of it.</p>
