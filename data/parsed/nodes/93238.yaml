    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_6318.PNG"></div><br>
    So the code sequence for dlig's goes like this:<br>
    <code><br>
    sub A A by A_A;<br>
    sub K A by K_A;<br>
    sub R A by R_A;<br>
    </code><br>
    I understand why K_A gets priority over A_A, but why A_A gets priority over R_A?<br>
    Or vice-versa.<p></p>
