    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 9.Feb.2006 4.07pm </div>
      <p>· | · | · | · | · | · | · </p>
    <p>Parisine Plus has been upgraded from postcript to opentype. With this upgrade comes oodles more of those lovely ligatures we have come to expect from Jean François Porchez. This time around there are 906 glyphs, 40,000 kerning pairs, and 4 Stylistic Sets. For those of you doing the math in your head, that is 15 possible paragraph style sheets for use. </p>
    <p>There is a limited time only discount for those who have previously licensed Parisine Plus from Typofonderie. <a href="http://www.typofonderie.com/">Check the site</a> for details.</p>
    <p></p><div class="imageWrap"><img src="/files/parisineplusptf_launch_1.gif"></div><p></p>
    <p>· | · | · | · | · | · | ·</p>
