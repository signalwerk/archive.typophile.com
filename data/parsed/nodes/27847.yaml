      <p>I think you either need to shorten the tail of the a and make the t's wider, adjusting the a would allow you to close up the ar space and, tight spacing or not, the ec is too tight compared with the other characters. Amending the t could also take the form of moving the crossbar further to the right. The punctuation seems like it could be shorter and I don't really understand the need for a full stop at the end of the logo.<br>
      Tim</p>
