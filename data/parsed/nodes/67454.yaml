    <p>Hello all.</p>
    <p>I was wondering if anyone could identify the font type on the Calgary 1988 Winter Olympics logo. It appears to be very similar to Helvetica Condensed Black but the "C" seems more oval to me.</p>
    <p>Thanks in advance!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/1988_wolympics_logo_0.png" width="208" height="370" alt="">
