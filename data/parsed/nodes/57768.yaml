    <p>I havent found anything about this. I hope I can explain it a bit...</p>
    <p>For example: I have the character "Q" in MS Word at a size of 16 pt, this size is actualy 21 PPM in FontLab.<br>
    I also have the character "€" at a size of 10 in MS Word and which is actualy 13 PPM in FontLab.</p>
    <p>Now my question is, does somebody have a list of all these conversions or a formula by which I can convert MS Word pt values into PPM values for FontLab?</p>
    <p>Thanks in advance!</p>
