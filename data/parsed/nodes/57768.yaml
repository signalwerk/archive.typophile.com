      <p>The general conversion is </p>
      <p>point size * resolution (your OS rasterizer screen resolution) / 72 = PPEM </p>
      <p>so this would mean your screen rasterizer is at 96 pixel per inch DPI.</p>
      <p>16pt*96/72 = 21.33 or 21 PPEM</p>
      <p>12pt*96/72= 16ppem etc.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/screen_4181.jpg"></div><p></p>
