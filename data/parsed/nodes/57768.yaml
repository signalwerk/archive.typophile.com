      <p>&gt;I actualy did read about Font Scaling...</p>
      <p>Me too! I use this formula a lot, so res/72 * pts = ppm, is the choice of professionals as the easiest input to a calculator. </p>
      <p>A higher dpi device generally means a given ppm appears smaller.  And, at a higher dpi, a given point size requires more ppm to remain the same size.  </p>
      <p>So... indicating as that Vista dialog box does, that higher "DPI scaling" yields bigger type must be a windows way of saying 'OS zoom factor', cause though dpi does change from device to device, it does not scale. </p>
      <p>Cheers!</p>
