    <p>Basically, I’m just starting out in type design. The biggest problem I face is that, whether we like it or not, we all walk around and subconsciously take in things and copy them later. So I suppose my question is: How do you know that your design, something you may indeed spend years developing, is original, or at least different enough from what’s out there? It seems impossible to be aware of ALL typefaces out there. The good ones, yes that’s possible, but there must be unknown type designers out there doing fantastic work.</p>
