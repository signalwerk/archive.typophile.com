      <p>Hi There</p>
      <p>It is hard to be original.</p>
      <p>What I always try to do is design a concept first and then the actual design.<br>
      Everything you do has been done before by an other. Being 100% original is impossible.<br>
      You could try, but it is hard.</p>
      <p>It is no shame looking around for inspiration. But, be aware of copying.<br>
      If things have no purpose, just leave them out.</p>
      <p>I a way trends are an example of this. Light letters, gradients ... you see them around.<br>
      Are you less original when using that? I think it is about communication.<br>
      What is it you want to communicate.</p>
      <p>If you can start a trend, I think you are original. Even though the actual trend has been done before.</p>
      <p>I hope this helps.</p>
