      <p>I like the new direction with the font style and color. I also appreciate your keeping it to a simple logotype. I would, however, suggest a slightly more delicate font — still maintaining the bodone look. I would go with something more like <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100004" rel="nofollow">didot</a> Bold Roman (64 pt Master). The serifs contrast much more with the rest of the characters suggesting a much more delicate, beautiful feeling. I also like the way didot seemingly treats each character with more individual attention and grace. </p>
      <p>penn</p>
