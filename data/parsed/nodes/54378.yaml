    html: <p>What's the goal of the project? Right now it's just "Boston Ballet" written in another typeface, at least that's what I see as someone who knows nothing about Boston, the ballet, or the Boston Ballet. Their current logo isn't remarkable, but it's not terribly outdated,so it might be helpful for getting feedback if you elaborated on what your brief is for the project.</p>
