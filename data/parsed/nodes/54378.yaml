    html: |-
      <p>The current logo is delicate, graceful, airy... Your redesign, to me, seems bold, hard (maybe?), and tight. It seems little jarring. I walk by the Boston Ballet frequently and I cannot see your new logo etched on the windows or on an awning over the door.</p>
      <p>The current logo says traditional &amp; timeless...Bodoni, to me, says...90's, for lack of a better description. I know the typeface is from the late 18th century, but maybe it's the color. It just seems too outdated to me.</p>
      <p>On a positive note, I like the slight concave serif on the l's. They provide a subtle, graceful nuance.</p>
      <p>Sorry if that seemed too critical, I didn't mean it to be. :(</p>
