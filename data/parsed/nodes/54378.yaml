    html: |-
      <p>I think that all-caps or lc would suit this better. in title case it reads a bit like a print publication masthead. I also would recommend Bauer Bodoni, or a cut of bodoni with more curvaceous details. Your kern is nice, but loosen it to allow it to breathe more.</p>
      <p>I'd try some American fonts for cultural resonance:<br>
      Century expanded, Binny Old Style, Cheltenham, Fairfield, etc</p>
