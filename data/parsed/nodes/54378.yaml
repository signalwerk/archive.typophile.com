      <p>Ken, I agree with your choice to set the logotype with Upper-lover case letters (this is more consistent than all caps or small caps).<br>
      But I think Bodoni Is'nt a real "dance" typeface. Bodoni is synonimous of stability and statuesque.<br>
      Why not a classic italic serif typeface? (garamond?)</p>
      <p>carlo</p>
