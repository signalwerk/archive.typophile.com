      <p>Heres my thoughts and process on re-designing this logo.<br>
      For the font I used Bodoni because I thought that such a wonderful, elegant font can be best used for a wonderful, oldschool ballet company.<br>
      I chose the color red (well, the color is alittle off.. hmm) because it simply looks nice and goes with the image of what these ballet dancers were born to do; dance.</p>
