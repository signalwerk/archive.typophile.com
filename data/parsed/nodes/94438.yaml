  html: |-
    <p>A district court in Israel held that the inclusion of Guttman Keren in the Office suite violated the plaintiffs' rights in the font Koren, designed by Eliyahu Koren.</p>
    <p>The (interesting) decision in Hebrew can be found here: <a href="http://www.psakdin.co.il/kAnnex/nws_nllb_1.pdf" title="http://www.psakdin.co.il/kAnnex/nws_nllb_1.pdf">http://www.psakdin.co.il/kAnnex/nws_nllb_1.pdf</a></p>
