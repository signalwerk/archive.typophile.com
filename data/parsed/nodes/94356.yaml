      <p>You or someone will  probably find the font(s), but if not, and all you need is a vector  version, you can easily create one with Corel Draw or Adobe Illustrator. Either by manually drawing them or by using their auto-trace facilities. There are also some free auto-trace programs available, findable with any search engine.</p>
      <p> - Herb</p>
