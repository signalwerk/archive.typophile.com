    html: <p>This looks to me like it actually might be a font, not  <br>calligraphy. If it is handmade, then it was done digitally,  <br>not as actual hand-done lettering. I say this based on  <br>the consistency of the arches of u and y, the bowls of a  <br>and d, and the two r's. The difference in color between  <br>the two words is the result of enlarging a single master.</p>
