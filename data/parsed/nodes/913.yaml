  html: <p>Formerly Alphabetty now MonkeyBoys Top-font-Gear place.  <br> <br>Hey Dave that pic looked like me driving south from Florence.. on the Autostrada..lights on or no lights?? found out YES.. on motorways and non-city roads new law... and John boy did I miss the Audi S3 and the 1.8T 215BHP... I had a Renault Clio..1.2 which had lots of trouble getting up the Tuscan hills ... I found a hint.. turn off the air conditioning. and a bit confused about how to get it into reverse. but all sorted HAD TO HAVE MY GIRLFRIEND SHOW ME!!! there you go Tiff... there is your mention for Alphabetty. Woman are good about the details.. she's a lousy driver.... believe me. Only odd thing that happened was a friend who is a new driver and comedy writer hit my back bumper at the Tuscan villa on the Clio and the plastic thing in the bumper fell out and the bumper almost fell off. I had to fix it a bit so it looked like it wasn't hit. I couldn't tell if he did all the damage or some of it was from the no parking sign I knocked over in Florence near the hotel doing a U-turn in the street. </p>
