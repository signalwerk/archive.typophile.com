    html: "<p>Tiffany, men and women are good at different things. There's nothing wrong with accepting that, as long as you don't use it unfairly. Generally, it's good to know the truth. <br> <br>And the difference isn't just anecdotal: the \"wiring\" between the brain's two hemispheres is different in men and women. I don't pretend to know what that implies (and I think few scientists have even tried to get any grasp of it either, yet - maybe due to the social phobia that Vincent described elsewhere), except for this simple and safe conclusion: there is a difference. And by god does that make me happy - homogeneity is death. <br> <br>I honestly don't know about driving (I think it's mostly a cultural thing - like there are only two female tow truck drivers in the entire state of California, and such a low proportion can't be due [mostly] to physiology), but for example women do make better astronauts, apparently. Sadly, such distinctions are often ignored by people in power who are psychologically weak: <br> <br><a href=\"http://news.bbc.co.uk/2/hi/americas/3042836.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/americas/3042836.stm</a> <br> <br>Don't shoot for \"as good as\" - relish the diversity, and conquer your own glorious mountains. <br> <br>-- <br> <br>You know what's really funny? Much faster that the \"mother\" thread (pardon the pun), this thread went from being about cars to being about women... <br> <br>hhp <br></p>"
