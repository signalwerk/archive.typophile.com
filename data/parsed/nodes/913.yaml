    html: <p>&gt; turn off the air conditioning <br> <br>Yeah, in smaller cars it feels like you're doubling the horse power! Last summer in Halkidiki* I was trying to find this little monastery on a hill in the middle of nowhere, dirt trails and all, in a little Hyundai. The first day we were four adults and a kid, and we couldn't find it, but we did get over a pretty steep uphill with some proper clutch work. The next day we tried again with three adults and a kid (my dad refused to come along that time), but when we got to the strong uphill part the car refused to go. Thinking "this can't be right", I tried a hunch and turned off the AC, and there it went! It turned out we had the AC off the previous time. There really is something pretty sick about AC, if you ask me - at least in a car. <br> <br>* After the Thessaloniki conference, which is happening again next year, and I recommend both the conference and the tourism there very highly. <br> <br>hhp <br></p>
