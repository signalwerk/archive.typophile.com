      <p>I do feel graphics skills are one way to contribute, if you feel the world desperately needs some changes. I volunteer for a number of local nonprofit causes. My husbands asks: Are you ever going to get paid? (I am occasionally...)</p>
      <p>I do all the graphics &amp; web for Washington Public Campaigns (that's Washington State). I was enthused about this cause from the first meeting, where I volunteered graphic design. </p>
      <p>They were operating on a shoestring: not even enough funds to pay one part-time staffer. I had noticed all their graphics SUCKED, from the website to the logo and brochure. They were done by whoever volunteered to do them: young techies or sweet old ladies. </p>
      <p>A year later the organzation's membership has grown 10 times larger. So much praise and appreciation is heaped on me (and all the volunteers) it's almost embarrassing at times (well, not really, I like it).</p>
