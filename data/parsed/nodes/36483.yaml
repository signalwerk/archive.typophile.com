    <p>I know, a whole lot of designers prefer the<br>
    fonts which are "sold". Unfortunately at times<br>
    people cant afford even the cheapest of the<br>
    fonts which are sold, primarily because they<br>
    are sold in dollars or euro, converting it<br>
    at times into any other country's money means<br>
    multiplying it by a factor of 50, or 10 atleast.</p>
    <p>At times, when you are designing for NGO's or<br>
    volunteer organizations, they really do not<br>
    have the budget to buy fonts.</p>
    <p>In such a situation, which are the "good" fonts<br>
    that are available for free ? I know sites like<br>
    Dafont have many fonts, but I'd like to know<br>
    the ones which are good and usable, mainly for<br>
    things like body text, headlines etc. not just<br>
    for display or decorative purposes.</p>
    <p>If you have found such free nuggets please<br>
    share them with us.</p>
