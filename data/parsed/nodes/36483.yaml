      <p>Double standards are a necessary evil, as many different kinds of work need to be done, but not all suppliers and contractors are prepared to do it for free. </p>
      <p>IMO the saddest situation in when volunteers start up an organization which becomes successful, and then must become self-sufficient and professionally run to survive past their initial enthusiasm -- however, they are not professionally qualified to run it (especially relevant if a third party, e.g. governement, is providing funding) so can't even apply for the job they created and do. There is also the stigma of self-interest that prevents one from capitalizing on a pro bono initiative. It's an ethical conundrum. However, I don't mind donating fonts to any organization that asks me (as long as it's suitably radical and the kind of outfit I'd be inclined to donate to anyway), after all, it takes little effort to copy a piece of software.</p>
