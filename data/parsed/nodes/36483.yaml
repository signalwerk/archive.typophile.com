      <p>The <a class="freelinking external" href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page" rel="nofollow">DejaVu</a> fonts are not only free to use, but open-source as well.  One of the project's primary goals is to have a very full character set:</p>
      <dl>
      <dt>
      </dt><dd><em>Most DejaVu fonts are suitable for Latin (Western and Central European, African Latin and International Phonetic alphabets), Cyrillic (European) and Greek (Modern and Polytonic). Arabic, Armenian, Hebrew, Lao, Canadian Aboriginal Syllabics and Georgian are currently in development and included in DejaVu Sans.</em></dd></dl>
      <p>So, not only are these not sold in $ or €, their character sets may be even more appropriate for your projects.</p>
      <p>Granted, they aren't the most interesting of designs -- just a sans, serif, and mono.</p>
      <p>--John</p>
