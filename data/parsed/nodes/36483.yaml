      <p>Maybe 18-20 years ago I got involved in going down to an orphanage with 23 kids between Ensenada and Tecate in Baja. When I first started going down, there were no toilets or running water. The kids used an outhouse with a rotting floor, with a big hole in it that allowed you to see the refuse and maggots, if you had a mind to focus in that direction.</p>
      <p>There was no washing machine for clothes, as we know it. Just a tub with a wringer. Doing laundrey this way for 23 kids was a workout. everything was very primitive.</p>
      <p>Through the years, materials were geneously donated that allowed us to put in showers, toilets, laundry room, build more rooms and bunk beds, study room with books. Now over 90 kids are housed at that orphanage. A few years ago a computer room was built. </p>
      <p>Money donated has been used for extended education. Beauty school for some. Trade school for others. We have put in a water tank on top of the main house, and arranged for drinking water to be trucked in to fill the tank on a regular basis. </p>
      <p>Sometimes we help with gas and electric bills. But we don't naively give away money. Fortunately, there is an upright person in charge of this particular orphange, which is one reason we have focused our work there.</p>
      <p>I was able to get 5 spanish comic books for $1 in Tijuana and bring  50-60 each time I go down to encourage them to read. And some of the little kids who used to sit in my lap and read the comic books, now have successful careers, and families. Some are now coming back to help at the orphange.</p>
      <p>We haven't been able to tap many of the common sources for funding because we don't want to have to kiss too many behinds, and have people tell us what we can and can't do.</p>
      <p>So with whatever money that comes in, there is always a something we can do for the next generation of kids. There is no 'advertising budget', and there are no salaries, and we are very used to asking for donations before buying something. </p>
      <p>One school district who found out what we were doing, recently  donated two hardly used school buses. They figured for as much as they were using them, they could charter and save overall on insurance and upkeep.</p>
      <p>I suppose I should mention that orphanages in Mexico, most of the kids have at least one parent, but that person is a drug addict, drunk, prostitute, child beater or child molester, and the state has taken the kid away. An occasional success story has the father sobering up and staightening up his life, and coming and getting his kids, but that isn't too common.</p>
      <p>Anyway, we wouldn't think of asking for a free font, but more practical things are always needed. Most people who come down and see what a difference we can make in someone's life are happy to help in one way or another.<br>
      ; )<br>
      If you have the opportunity to get involved with a group that goes down to Mexico, or some other underdeveloped location, it is a wonderful experience with various rewards. Not the least of which is an appreciation for many things you have taken for granted.</p>
    html_clean: |-
      <p>Maybe 18-20 years ago I got involved in going down to an orphanage with 23 kids between Ensenada and Tecate in Baja. When I first started going down, there were no toilets or running water. The kids used an outhouse with a rotting floor, with a big hole in it that allowed you to see the refuse and maggots, if you had a mind to focus in that direction.</p>
      <p>There was no washing machine for clothes, as we know it. Just a tub with a wringer. Doing laundrey this way for 23 kids was a workout. everything was very primitive.</p>
      <p>Through the years, materials were geneously donated that allowed us to put in showers, toilets, laundry room, build more rooms and bunk beds, study room with books. Now over 90 kids are housed at that orphanage. A few years ago a computer room was built. </p>
      <p>Money donated has been used for extended education. Beauty school for some. Trade school for others. We have put in a water tank on top of the main house, and arranged for drinking water to be trucked in to fill the tank on a regular basis. </p>
      <p>Sometimes we help with gas and electric bills. But we don't naively give away money. Fortunately, there is an upright person in charge of this particular orphange, which is one reason we have focused our work there.</p>
      <p>I was able to get 5 spanish comic books for $1 in Tijuana and bring  50-60 each time I go down to encourage them to read. And some of the little kids who used to sit in my lap and read the comic books, now have successful careers, and families. Some are now coming back to help at the orphange.</p>
