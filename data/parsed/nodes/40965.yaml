    <p>Having a bit of trouble with alt characters…&nbsp;everything works fine in the Fontlab OpenType features window using</p>
    <p>feature aalt {<br>
      sub O by Oalt;<br>
      sub Oacute by Oacutealt;<br>
      sub Ograve by Ogravealt;<br>
      sub Ocircumflex by Ocircumflexalt;<br>
      sub Odieresis by Odieresisalt;<br>
      sub Otilde by Otildealt;<br>
      sub Oslash by Oslashalt;<br>
      sub o by oalt;<br>
      sub oacute by oacutealt;<br>
      sub ograve by ogravealt;<br>
      sub ocircumflex by ocircumflexalt;<br>
      sub odieresis by odieresisalt;<br>
      sub otilde by otildealt;<br>
      sub oslash by oslashalt;<br>
    } aalt;</p>
    <p>But I noticed there’s no way to access ’aalt’ in Illustrator CS3… so I wanted to add salt, ss01 and maybe titl as well in the OT features for multi-application access.</p>
    <p>I found this thread containing a suggestion:</p>
    <p>Whenever you define any features in your font that produce 1:1 substitutions by some alternates (salt, ss01-ss20, swsh, hist, smcp, c2sc etc.), you should link these features to aalt in the following way:</p>
    <p>feature aalt { <br>
    feature salt; <br>
    feature ss01; <br>
    feature ss02; <br>
    feature hist;<br>
     feature smcp; <br>
    feature c2sc;<br>
     } aalt;</p>
    <p>But not sure how to implement and ’link’ these…&nbsp;does it go above or below the ’aalt’ feature code?</p>
    <p>And does aalt on it’s own just not show up in some applications such as Illustrator?</p>
    <p>Thanks</p>
