      <p>I would rather use Python with the FontTools. You can get a working version with <a href="http://www.adobe.com/devnet/opentype/afdko.html">AFDKO</a>, the Adobe font development kit.</p>
      <p>Here is the kind of code that, once AFDKO is installed, would probably work with your files, given what you say:</p>
      <p>---- cut here<br>
      #!/usr/bin/env AFDKOPython</p>
      <p>from fontTools.ttLib import TTFont<br>
      import sys</p>
      <p>filename=sys.argv[1]<br>
      ofilename=filename[:-4]+"_new.ttf"</p>
      <p>idstocopy = [1,2,3,4,5,6,7]</p>
      <p>names={}<br>
      f=TTFont(filename)<br>
      for n in f["name"].names:<br>
        if n.nameID in idstocopy:<br>
          if n.platformID == 3 and n.platEncID == 1:<br>
             names[n.nameID] = n.string.decode('utf_16_be')<br>
      for n in f["name"].names:<br>
        if n.nameID in idstocopy:<br>
          if n.platformID == 1 and n.platEncID == 0:<br>
              n.string = names[n.nameID].encode('mac_roman')<br>
      f.save(ofilename)<br>
      ---- cut here</p>
      <p>If you save that script in an executable file <code>adjnames</code>, then <code>adjnames font.ttf</code> creates a font <code>font_new.ttf</code> with the adjusted mac names.</p>
      <p>With a simple find, you can then batch process all your files.</p>
