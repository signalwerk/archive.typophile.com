      <p>Michel, that helped for a few font files, but it left about ten or fifteen of them still not properly named for the Mac.</p>
      <p>At that point, doing what works (even if it has to be done one file, one parameter at a time) is more efficient than trying to tweak a batch method. I went into Windows NT on a virtual machine and used Font Monster.</p>
      <p>Font Monster assigns one parameter at a time, but CTRL-C, CTRL-V made it easy to copy the MS values to the Mac parameters. Other than that, its main drawback is that (having been last updated in 1994) it doesn't do long file names. Since all the faulty font files have 8.3 file names (probably dating from the same period) that wasn't much of a problem.</p>
