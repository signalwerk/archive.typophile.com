      <p>Now that you mention it, Michel, I could have used FontForge without ttx. When FontForge opens a .ttf it copies the outlines exactly. When I generate a font I usually have the Validate box checked, but if I uncheck it and tell FontForge to generate a TrueType font it will (I think) simply spit out whatever outlines it read in. If it upgrades other tables, like hints or kerning, I wouldn't object. As I said, these are mostly crappy fonts.</p>
      <p>I did that with one font. The output looked the same as the original in the (low res) Font Book preview (bad spacing included), and the files were the same size (as reported in Kbytes). Font Monster, FontForge, and your Python script with "ignore" all ignored the 0099 character in the original Trademark field (which I identified because FontForge displayed it with little numbers).</p>
      <p>Next time....</p>
