      <p>Good that you got it right.  Incidentally, there was also a way with FontForge, provided FontForge does what you want with the naming table. The idea is just to open your font, say <code>font.ttf</code> and generate a new ttf font, say <code>newfont.ttf</code> with fontforge. You can then extract from it the name table using ttx wich comes with AFDKO; the call</p>
      <p>ttx -t name newfont.ttf</p>
      <p>generates the file <code>newfont.ttx</code> wich contains only the generated naming table. You can then merge that table into the original font, so that only the naming table is modified.</p>
      <p>ttx -m font.ttf newfont.ttx</p>
      <p>generates the font <code>newfont#1.ttf</code> which is <code>font.ttf</code> with the new merged name table.<br>
      Of course that process can be done in batch provided you can call fontforge from the line command (which is the often the tricky part). </p>
      <p>Here is a script that does it provided the Python fontforge files are installed for python2.7 (the one I am personally using with FontForge) and you have <code>ttx</code> installed.</p>
      <p>#!/bin/sh</p>
      <p># given as parameter font.ttf<br>
      # generates font_new.ttf<br>
      # with mac entries copied from<br>
      # the win entries George Williams<br>
      # considered relevant</p>
      <p>python2.7 &lt;&lt;EOF<br>
      import fontforge<br>
      f=fontforge.open("$1")<br>
      f.generate("$1"[:-4]+"_new.ttf")<br>
      EOF<br>
      ttx -t name "${1%.ttf}"_new.ttf<br>
      rm "${1%.ttf}"_new.ttf<br>
      ttx -m "$1" "${1%.ttf}"_new.ttx<br>
      rm -f "${1%.ttf}"_new.ttx</p>
      <p>If the fontforge package is installed for your default python, then call <code>python</code> instead of <code>python2.7</code>.</p>
