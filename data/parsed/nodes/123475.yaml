    html: |-
      <p>The fact that some entries may be present for Windows and not for the OS X adds some difficulties. New records need be created. Moreover, if you create a record where there is already one, you get two records for the same parameters (I checked with TTX); that is probably not good. </p>
      <p>The only documentation I could find is on the Microsoft site and I found snippets with Google. Not fantastic. Here is some improved code that handles missing records for the mac and takes care of the US English language. This time, the font file is overwritten. That means that if you put that script in your path and call it <code>adjmacnames</code> then</p>
      <p> find . -name "*.ttf" -exec adjmacnames "{}" \;</p>
      <p>recursively modifies all the fonts in the current directory. You can add values to <code>idstocopy</code> without problem because the code now checks what can be overwritten and what record is to be added. If you find improvements (or some decent documentation), please tell us</p>
      <p>#!/bin/sh</p>
      <p>echo "Processing $1 ..."<br>
      AFDKOPython &lt;&lt;EOF<br>
      from fontTools.ttLib import TTFont<br>
      from fontTools.ttLib.tables._n_a_m_e import NameRecord<br>
      import sys</p>
      <p>idstocopy = [1,2,3,4,5,6,7]</p>
      <p>winnames={}<br>
      macnamerec={}</p>
      <p>f=TTFont("$1")</p>
      <p>for n in f["name"].names:<br>
        if n.nameID in idstocopy:<br>
          if (n.platformID,n.platEncID,n.langID) == (3,1,0x0409):<br>
            winnames[n.nameID] = n.string.decode('utf_16_be')<br>
          if (n.platformID,n.platEncID,n.langID) == (1,0,0x0):<br>
            macnamerec[n.nameID]=n</p>
      <p>for i in winnames:<br>
        if i in macnamerec:<br>
          macnamerec[i].string = winnames[i].encode('mac_roman')<br>
        else:<br>
          myRecord = NameRecord()<br>
          myRecord.nameID = i<br>
          myRecord.platformID = 1<br>
          myRecord.platEncID = 0<br>
          myRecord.langID = 0x0<br>
          myRecord.string = winnames[i].encode('mac_roman')<br>
          f['name'].names.append(myRecord)<br>
      f.save("$1"+"tmp")<br>
      EOF</p>
      <p>mv "${1}tmp" "$1"</p>
