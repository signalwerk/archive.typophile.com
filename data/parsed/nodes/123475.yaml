    <p>I'm on a Mac, though I used to have lots of Windows machines, and still have one real and several virtual Windows machines.</p>
    <p>Among my thousands of uninstalled fonts are dozens of (mostly crappy) TTF fonts that have different file names, and have corresponding font names when listed in Windows, but are all listed as "New" in Mac OS X. I used ftxdumperfuser to dump the name table of one of them, and found table entries with type IDs 1 through 7, with the Microsoft platform names in platform ID 3 all filled in, but the Macintosh names in platform ID 1 all containing default values.</p>
    <p>If the fonts all have the same name I can't even view them in a font viewer. What's the easiest way (using free tools) to copy all seven names from platform ID 3 to platform ID 1 in all the fonts?</p>
    <p>FontForge might be able to do it in batch mode, but it would want to rewrite the whole font, including the glyph definitions, and it would complain at great length about the crappy outlines. Perhaps I could write a PERL script to edit the XML files, use a shell script to run it on all the files, and then use ftxdumperfuser to write the name table back into the files. Has such a script been written already?</p>
