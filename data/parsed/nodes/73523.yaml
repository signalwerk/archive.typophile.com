      <p>Eliason, Thanks for the link. For everyone else, here's the paragraph from that article that references the Typoart Garamond:</p>
      <p>At Typoart, the principle ‘frugality and effectiveness’ lead us to work with representatives from the printing enterprises to develop a type program that met all the important requirements: a Renaissance roman for literature, like Garamond, a classical, like Bodoni or Didot, then a slab-serif, for example Clarendon. There had to be something from each major style. Naturally also sans-serif, in different styles, like Helvetica and Futura. The “Zentrag” would even request imitations of specific western-made typefaces they couldn’t afford to license.</p>
