      <p>Antonio —&nbsp;</p>
      <p>I don’t know the <em>Anthology</em>. If it reproduces the article <em>in toto</em>, then you should be fine. </p>
      <p>In addition to a bunch of historical material, she shows a specimen of the <em>caractères de l’Université</em> composed at the Imprimerie Nationale (which attributes Garamond). </p>
      <p>Then there are showings of a raft of 20th-century versions: the ATF Garamond, the American Monotype Garamont (Goudy’s), the English Monotype Garamond — all after the IN face (thus, derived from Jannon).</p>
      <p>Then there are three other 20th-century faces, perhaps more authentically Garamond-inspired: British Linotype’s Granjon (George Jones), the Stempel Garamond, and an obscure cutting by the equally obscure French founder, M. Ollière of Paris.</p>
      <p>All but the last are pretty familiar to typophiles. Here is an image of the M. Ollière ‘Garamont’:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fleuron-36_MOlliere_5763.png"></div><p></p>
      <p>&nbsp;</p>
      <p>It’s not obvious in this resolution, but there’s something I find charming about the relative coarseness of this interpretation.</p>
      <p>If your anthology doesn’t happen to include all the illustrations, let me know offline and I can send a high-res scan.</p>
