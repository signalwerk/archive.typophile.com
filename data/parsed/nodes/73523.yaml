      <ul>
      <li><em>Maxim, do you remember if this means that the typeface was not released until 1982 </em>[?]<em>, but designed several years earlier?</em></li>
      </ul>
      <p>Dan, you are right. I remember that article. Yes, it might have been in the works for a long time… Vladimir Yefimov, a good friend of mine, wrote:</p>
      <p>‘[Around 1978] we went to Dresden for the acceptance of the Cyrillic versions of their [Typoart’s. <em>mZh</em>] typefaces for photocomposition that were being developed based on the intergovernmental agreement between USSR and GDR. According to the agreement, the USSR (the Poligraphmash plant, based in Leningrad) was to design the photocomposition equipment belonging to the Soviet <em>Kaskad</em> line of typesetters; the font development was supposed to be a joint venture of ONSh [Vladimir’s shop. <em>mZh</em>] and Typoart, and the fonts be used by both parties, in parallel. We were going to create the Soviet versions of Times and Bodoni, both not to be mentioned by night, and the German comrades the Cyrillic extensions to some of their typefaces. Interestingly enough, we were told right off the bat that they would not use our phototypesetting hardware because they have a contract with Linotype, and they already used Western equipment fitted with the fonts (<em>Schriftträgern</em>) they make themselves. As to our coöperation, well, they would design those Cyrillics for us, in the fulfilment of that intergovernmental agreement, period. […] We then discussed two of the latest in a series of Typoart’s Cyrillics. One of them was Magna, and I don’t quite recall what was the other one. But for sure, it was neither Garamond, nor Timeless or Maxima. Was it Primus? I don’t think its Cyrillic version was ever completed.’</p>
