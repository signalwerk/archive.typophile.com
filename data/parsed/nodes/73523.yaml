      <p>But somehow the wider "h" seems not just a thing of the bigger cuts... on this page <a class="freelinking external" href="http://www.blog.druckerey.de/index.php?id=80" rel="nofollow">http://www.blog.druckerey.de/index.php?id=80</a> (german) you will see some self explaining pictures made by the german printer Martin Z. Schröder. Two different width of the "h" in 10p, which you can´t find in the Garamond specimen - confusing.<br>
      By the way - does somebody know, why there are no oldstyle figures in the digital versions of the Typoart Garamond? I ask myself, because in the east german Typoart "Digiset" specimen these figures were existing.</p>
