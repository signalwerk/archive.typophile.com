      <p>Abert Kapr's »Gedanken zur Garamond Russisch« was originally published in <em>Aus einem Brief an den schriftherstellenden Betrieb Typoart vom 9.9.1976.</em> I have the article in reprint, in the book <em>Albert Kapr, Schrift und Buchkunst: Aufsätze, Reden und künstlerische Arbeiten.</em> Leipzig: VEB Fachbuch Verlag (1982). Pages 206–211.</p>
      <p>He writes there that Typoart received an order in Sept. 1975 for a Garamond Russian, from the Soviet photosetter 2 NFA. The design sample shown as part of the article in the book (just the Upright and Cursive faces) is dated 1978/1979. Which is funny, if the book is supposed to reprint an article from 1976! I guess these two illustration were not part of the original article.</p>
      <p>Maxim, do you remember if this means that the typeface was not released until 1982[?], but designed several years earlier?</p>
