      <p>Dan, it was the other way round. Tannenhaeuser’s Latin-only Garamond-Antiqua (1955–6) was a <em>Handsatz und Magazin-Matrizen-Schnitt</em> (<em>geschnitten in 6, 8, 9, 10, 12, 14, 16, 20, 24, 28, 36 und 48 p.</em>), and Albert Kapr designed its Cyrillic version around 1982. The latter was developed for [Linotype?] photocomposition. I consulted its design… Not that I am particularly proud of what came out of it.</p>
      <p>It is now shown on URW++, Elsner+Flake, and Ascender Web sites, under various names (e.g., Garamond Nº4 Cyrillic, Garamond Nº 5 EF, Typoart Garamond TB, Typoart Garamond TH…). The <a href="http://www.urwpp.de/cgi-bin1/dalcgi/source/fontlistecg.htd?sprache=deutsch&amp;dispcg=1&amp;cyrillicId=82&amp;xrpb-id=wd5a498c5ebb6225059987dbeae12bccd5a861fbdec" rel="nofollow"> Garamond Nº 4 Cyrillic</a> is credited, rightly or wrongly, to ‘Ivana Koudelkova, (URW Studio)’, but dated 1983 [?!].</p><div class="imageWrap"><img src="http://typophile.com/files/Garamond_No_4_Cyr_5198.png"></div><p></p>
