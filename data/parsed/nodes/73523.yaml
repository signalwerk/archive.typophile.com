      <p>Haha… at the end of the article (page 211 of the book mentioned above), Kapr writes (my translation…):<br>
      "From the first sample prints, I would like to request that examples to be sent to Wadim Lazurski and Maxim Shukow, respectively. Both will evaluate the samples – in writing – and will suggest corrections, as well as give their assessments, which will be very useful for the dissemination of the new typeface in the Soviet Union."</p>
      <p>Original German text…<br>
      <em>Von den ersten Probe-Abzüge bitte ich jeweils ein Exemplar an Wadim Lazurski und Maxim Shukow zu schicken. Beide werden die Probe-Abzüge schriftlich beurteilen und Korrekturen vorschlagen bzw. eine Einschätzung geben, die für die Verbreitung der neuen Schrift in der SU sehr nützlich sein könnte.</em></p>
      <p>I guess you got your copy in the mail, right?</p>
