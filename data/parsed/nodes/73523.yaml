    <p>Hi everybody,</p>
    <p>I’m looking for specimens of 20th century (or mid / late 19th century at most) “Garamonds”, that is, both typefaces inspired from Claude Garamond’s work &amp; typefaces inspired from Jean Jannon’s work. I’m especially interested in the latter ones as my research is mainly around Simoncini Garamond which we know to be of the second genre. Because of that, any current digital Garamonds (Adobe) or Jannons (Štorm) don’t qualify. The various Berthold and ITC Garamonds also don’t qualify. Here is a quick list of the ones I know exist:</p>
    <ul>
    <li>“Garamonds”
    <ul>
    <li>Stempel Garamond</li>
    <li>Sabon</li>
    </ul>
    </li>
    <li>“Jannons”
    <ul>
    <li>ATF Garamond</li>
    <li>Monotype Garamond</li>
    </ul>
    </li>
    </ul>
    <p>Then there are Ludlow Garamond and Garaldus by Nebiolo, which I think are more their own thing than either “Jannons” or “Garamonds”. James Mosley <a href="http://typophile.com/node/37259#comment-228271" rel="nofollow">mentioned a Garamond drawn by Frederic Goudy for US Monotype</a> but I’ve never seen it.</p>
    <p>Any other foundry / hotmetal / early photocomposition Garamonds I should be aware of? </p>
    <p>As I mentioned above, scans of specimens would be most appreciated. If you happen to have any, please <a href="mailto:antonio@cavedoni.org" rel="nofollow">get in touch with me</a> and we can arrange resolution / delivery.</p>
    <p>Thank you very much!</p>
