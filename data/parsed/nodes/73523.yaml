      <p>Antonio! The Garamond-Antiqua in the sample above seems to have no kerning in it (in the word <em>Tyfingschwert,</em> there is no kerning of the y under the T. Also, the f is a narrow f. The font should have had an fi ligature in it, but it does not appear in this word! Also, the ch is a ch ligature. How odd then that that is used, but not the fi. You can see the narrow f again in <em>aufgenommen</em> and <em>Umformer</em>). I suspect – without having gone into the specimen books – that this is the Linotype version of Stempel's Garamond. I suspect that the hand-set Stempel Garamond would have looked better.</p>
      <p>And the <em>Fleuron Anthology</em> <strong>does</strong> include Warde's Garamond article!</p>
