      <p>There was also a metal and photocomposition Garamond designed in East Germany by Herbert Thannhaeuser, for VEB Typoart: Typoart Garamond (or, at the time, it was probably just called <em>Garamond</em> or <em>Garamond-Antiqua</em>. It was designed in 1955, for metal type-setting (just col metal, I think. I think that it was adapted for film in the 1980s. Elsner &amp; Flake have digital versions of it.</p>
      <p>Abert Kapr designed a Cyrillic companion for it, I suspect for metal hand-setting, (perhaps) in the 1970s.</p>
      <p>It looks sort of Jannon-y to me. If you like Jannon, you'll love the cap italic Q! The lowercase a is totally whack, though.</p>
