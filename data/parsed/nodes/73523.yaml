      <p>On 29 December 2005 I contacted URW++ about among other things the origins of Garamond No. 4. The next day, Peter Rosenfeld of URW++ wrote me back. Here's what he had to say about it:</p>
      <p>Garamond No. 4 or Typoart Garamond<br>
      In order to be able to explain the circumstances how Typoart's Garamond got into our hands, I have to go back two decades in time.</p>
      <p>Before Germany's reunification, Typoart used to be the font foundry for Eastern Germany and Eastern Europe. Upon the introduction of digital type in outline format by URW (Peter Karow, a co-founder of the former URW company is the inventor and pioneer of digital outline fonts), Typoart contacted URW about our IKARUS software system, at that time the de-facto standard for all font manufacturers all over the world.</p>
      <p>URW licensed IKARUS to Typoart, and also provided the training for Typoart's font designers in Dresden.</p>
      <p>Some years later, round about the mid-eighties, Typoart offered digital versions for some of their fonts to URW, to be marketed by URW in the Western world. Font business was good at that time, and actually, I was in charge of the URW font department during the eighties and early nighties, so we accepted Typoart's offer and purchased some font data including their version of Garamond.</p>
      <p>Garamond, obviously, is one of the most beautiful classical typefaces, and we wanted to make available literally all existing versions (like Stempel's beautiful version with "roughed contours", Linotype's, Berthold's cleaned up version, Lettergieterij's elegant version, Letraset's display version etc).</p>
      <p>That's the story about how we got hold of Typoart's very beautiful Garamond version.</p>
      <p>I know a few former Eastern Germany font designers like Erhard Kaiser and Ralph M. Unger, and I will contact them about any design details historically relevant, both for the Latin and the Cyrillic version of Kapr. Erhard Kaiser, a German Leipzig font designer (Fleischmann, Prokyon), worked for Typoart and was personally acquainted to famous Mr. Kapr.</p>
    html_clean: |-
