      <p>Also on the 29th I found a paper that Joyce Yee and Grant Carruthers wrote,  "Beyond the Wall: Typography from the German Democratic Republic," for the 2004 Friends of St. Bride Conference. Here is an excerpt from that paper dealing with Typoart, which mentions its Garamond:</p>
      <p>A Short History of GDR Typography</p>
      <p>Following WW2, type foundries in the Eastern (Soviet) Zone of Occupation, like all other major private enterprises, were taken over by the authorities and nationalised.  In 1951 the East German government consolidated the long established foundries of Schelter &amp; Giesecke AG Leipzig, Schriftguß AG Dresden, and Ludwig Wagner AG into one main state-run type foundry: VEB Typoart Dresden1. This foundry was to continue producing fonts until the end of the GDR in 1990, whereupon it became Typoart GmbH. It still operates today in the printing industry but no longer produces typefaces. Many of the influential names in GDR typography worked there.</p>
      <p>Leipzig and Dresden have a long tradition of fine printing and book arts which stretches back almost five hundred years. This tradition continued during the GDR, where the designers and typographers of what became known as the “Leipzig-Dresden School” worked to sustain the main printing and publication centres for the GDR. Leipzig in particular hosted many book design festivals (and still continues to do so today) such as “The Most Beautiful Books in the Whole World” and the “International Book Exhibition”, both of which showcased the best of Eastern European and international work.</p>
      <p>VEB Typoart Dresden was led from 1951 by the typographer Herbert Thannhaueser until his death in 1963. Thannhaueser (an art director in the former Schelter &amp; Giesecke foundry) oversaw the company in its formative years, when raw materials were scarce; many fonts from the former foundries were used and many display faces were developed, along with new versions of typefaces designed for Linotype and Monotype compatible typesetting machines. Later, Typoart focussed more on book faces and helped to develop many Cyrillic versions of faces for Eastern bloc countries.</p>
      <p>Thannhaueser’s own typographical contributions include versions of Garamond (1955) and Didot (1958), along with his own typefaces Erler Versalien (1953), Liberta (1956-1960) and Magna (1968). Typoart Garamond is currently still available as EF Garamond No. 5 from the Elsner and Flake foundry.</p>
      <p>The typographer,  calligrapher, teacher and book designer Albert Kapr took over at Typoart in 1964. Kapr (1918 - 1995) was a devout Communist who believed in the need for fine typography and book printing in the GDR. He wrote many books on typographic and printing history, and was particularly keen on the history and preservation of the German blackletter form2.</p>
      <p>Kapr was the founding father of the Hochschule für Grafik &amp; Buchkunst (HGB) in Leipzig, which proved to be very influential in the development of graphic design and typography in the GDR.  Many of Germany’s contemporary typographers and designers are alumni from the school.</p>
      <p>Kapr developed Cyrillic versions of Thannhaueser’s Garamond in the early 1980’s and also designed Faust (1959), Leipziger-Antiqua (1970), Prillwitz-Antiqua (1971), and Magna Kyrillisch (1975).</p>
