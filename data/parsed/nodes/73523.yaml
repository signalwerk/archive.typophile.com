      <p>I wrote to Joyce Yee on the 29th to see if she or Grant had learned anything further about Typoart or its Garamond. On 3 January 2006 she wrote me back. Here's the relevant part of her response:</p>
      <p>Our knowledge of Thannhauser's Garamond is limited and like you, found very little written about Typoart. We did meet someone at the conference who has original sample type specimens from Typoart - and he kindly let us have a look at it. However, I don't remember if he had the Garamond sample in his collection. You could try to contact him to find out, though I'm not sure if he knows any of the background information that you are enquiring about. His name is <a href="http://www.janmiddendorp.com/" rel="nofollow">Jan Middendorp</a>.</p>
      <p>Grant and I have not pursued this subject any further, though Grant did write an article about East German design for Eye Magazine (<a href="http://www.eyemagazine.com/feature.php?id=123&amp;fid=536" title="http://www.eyemagazine.com/feature.php?id=123&amp;fid=536">http://www.eyemagazine.com/feature.php?id=123&amp;fid=536</a>). Though, its focus is on the design rather than typography.</p>
