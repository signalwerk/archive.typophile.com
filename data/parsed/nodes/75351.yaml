    <p>The credit in Burn Notice TV serial, the one on USA Network </p><div class="imageWrap"><img src="http://typophile.com/files/Burn Notice Caps 001_6679.jpg"></div><p></p>
    <p>This is from the cover of John McLaughlin OK Now album. </p><div class="imageWrap"><img src="http://typophile.com/files/jon-mclaughlin-ok-now-cd-album-art-51654_4177.jpeg"></div><br>
    The backside of package, the face where they have the song list, display more fonts but I can't find it online and my scan result is not so illegible/sharp, so I did not post it. But the significant letter is the upper case R that the legs do  not meet, so there's a gap between the bowl and the vertical.<p></p>
    <p>Thank you</p>
  html_clean: |-
