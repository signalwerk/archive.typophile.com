  html: |-
    <p>Hi all,</p>
    <p>I’m not very familiar with the latest Quark versions and I’m<br>
    wondering if someone can report any similar problems - or even<br>
    solutions:<br>
    A customer uses one of our fonts (OpenType CFF) with QuarkXPress<br>
    7.3.1 on Mac OS 10.4.6. If the “standard ligature” feature is turned<br>
    on, sometimes (not always) any further editing of the text (like<br>
    manual Kerning, Spacing, horizontal scaling etc.) will result in a<br>
    crash of Quark (not the OS). If the ligatures are off everything<br>
    works fine.</p>
    <p>Is there a known problem of Quark with OT-features?<br>
    Thanks for any ideas!<br>
    Oliver</p>
