    html: <p>The old Phil's Photo book shows Jay Gothic with an alternate 't' that is a lot like this, but the typeface itself is more square than this sample.  <br> <br>You could also do some editing to <a href="http://www.myfonts.com/fonts/linotype/eurostile/demi/testdrive.html?s=Print&amp;p=48" target="_blank">Eurostile</a> outlines and get fairly close. <br> <br>I think Patricia is right -- it looks like the old Print magazine logo, and it is probably custom.</p>
