  html: |-
    <p><img src="http://www.typophile.com/forums/messages/30/13759.jpg" alt="Saint Paul"> <br> <br>There is a Greek Orthodox church near my office that sports <br>this sign. The other day when I took this photo it made me <br>think of Jim Marcus' <a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=33119&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">Fedorov Anglo</a>. Is there any connection? <br> <br>What's the history of that 'A' (if there is one)?  <br> <br>Yes, I am pathetically underexposed to nonlatin scripts.  <br>I'm trying to grow out of it.</p>
