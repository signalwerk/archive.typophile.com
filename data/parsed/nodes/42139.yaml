      <p>Sorry for bumping, but (I think) I recently came over something interesting regarding this particular font.</p>
      <p>Searching the web for it, I found this website: <a href="http://e-daylight.jp/design/fonts/revival/index.html" title="http://e-daylight.jp/design/fonts/revival/index.html">http://e-daylight.jp/design/fonts/revival/index.html</a></p>
      <p>Classic fonts digitalized, among them Wexford! However, I couldn't find any information regarding purchasing/downloading these beauties. Perhaps another member can shed some light on this?</p>
