      <p>Daylight fonts is run by a person named Shinya who has written to me in the past for information about some of the fonts. I have just sent an e-mail to find out more about how fonts can be purchased/downloaded. One of the purposes of that site according to Shinya is to be a reference guide for some of the obscure fonts. Apparently he/she is also digitizing some of them to revive the designs.</p>
      <p> - Mike Yanega</p>
