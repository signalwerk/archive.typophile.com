    <p>Hi folks, </p>
    <p>Someone has asked me if Wexford (see attached sample from the Bauhaus Guide) has ever been digitized. That sample was shown in the 1985 Phil's Photo "Homage to the Alphabet" book. Apparently it was used back in 1981 for a company logo that they want to update with the same typeface, if possible.  I did a number of Google searches, and only found an unrelated font and a couple of non-vendor links. I'm wondering if OptiFonts ever digitized it, or if an amateur version exists under another name?</p>
    <p>Thanks for any help you can provide.</p>
    <p>- Mike</p><div class="imageWrap"><img src="http://typophile.com/files/WexfordXB_5725.gif"></div><p></p>
