  html: <p>I don't have a scan handy, but does anyone know off-hand the primary head and body text fonts used in Harper's Magazine (also, their new sans-serif caption font, if possible -- looks kind of like Cronos)? <br> <br>I'll see if I can get a scan if no one remembers off the bat.</p>
