    html: <p>The major heads are some form of Caslon. The smaller heads and body text appear to be Goudy Oldstyle. I just happened to have a copy of the mag here. This issue is from July 2003, though, so I don't know about the new caption font. Paul Ford of <a href="http://www.ftrain.com">Ftrain</a> just did their new website, so if he can't tell you, he knows who can.</p>
