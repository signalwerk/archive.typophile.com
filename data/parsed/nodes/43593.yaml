    date_raw: 28 Mar 2008 — 7:21am
    votes: null
    html: <p>Chris, William, it's not a logo for a car. Daimler AG (uses Corporate S typeface) is actually parent company that incorporates Mercedes-Benz (uses Corporate A), Daimler Trucks, but also Daimler Financial Services (formerly DaimlerChrysler bank, using Corporate E). Anyway, as Chris pointed out, it is undistinctive, IMHO does not work that well with former elements of identity, and for the money...well, quite poor. DaimlerChrysler identity including logo, Corporate typeface trilogy and design principles was really great and very sophisticated. This one is not. Maybe balanced, sober or whatsoever, but neither beautiful &amp; balanced, nor beautifully sober, nor outstanding or memorable.</p>
    html_clean: <p>Chris, William, it's not a logo for a car. Daimler AG (uses Corporate S typeface) is actually parent company that incorporates Mercedes-Benz (uses Corporate A), Daimler Trucks, but also Daimler Financial Services (formerly DaimlerChrysler bank, using Corporate E). Anyway, as Chris pointed out, it is undistinctive, IMHO does not work that well with former elements of identity, and for the money...well, quite poor. DaimlerChrysler identity including logo, Corporate typeface trilogy and design principles was really great and very sophisticated. This one is not. Maybe balanced, sober or whatsoever, but neither beautiful &amp; balanced, nor beautifully sober, nor outstanding or memorable.</p>
