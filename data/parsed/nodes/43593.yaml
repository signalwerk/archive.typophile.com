      <p>I think the one thing that stands out to me is how incredibly balanced it is.  The M is squash in the middle, but it doesn't feel forced, even though in other fonts it would be slightly to the left.  YOu can see in the background of pictures they played with the idea of a stronger M, but in this case it's subtle, like a grounding force, sturdy.  Not a bad image to give off.  </p>
