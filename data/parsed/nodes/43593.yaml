    html: <p>Yes, it looks like Dolly, which is not surprising as it was designed by the folks who designed Dolly. As to how good it is, that must be judged in the context of the product it labels, and it's not a logo for MTV. It is sober, with reminders of a long history, but with a contemporary air. All that it does admirably well. Its only shortcoming in my eyes is that it could be more elegant, given the look of the cars.</p>
