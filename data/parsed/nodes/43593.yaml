    html: |-
      <p>Frankly, although the lettering is quite lovely, I find it to be a non-identifier.  I don't see it as distinctive enough to act as a logo. It just looks like a word set in a traditional looking typeface. The typeface does not seem to suit the company, either. It may make a lovely titling face for a book but I can't imagine it cast in metal and chrome on a car. If this is a logo, it should be more evocative of the company and the products instead of just blending into the world of book typography.</p>
      <p>ChrisL</p>
    html_clean: |-
      <p>Frankly, although the lettering is quite lovely, I find it to be a non-identifier.  I don't see it as distinctive enough to act as a logo. It just looks like a word set in a traditional looking typeface. The typeface does not seem to suit the company, either. It may make a lovely titling face for a book but I can't imagine it cast in metal and chrome on a car. If this is a logo, it should be more evocative of the company and the products instead of just blending into the world of book typography.</p>
