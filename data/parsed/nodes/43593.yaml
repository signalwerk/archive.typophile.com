      <p>The overly expressive leg of the R contrasts with the other more formal elements of the letter. It looks like someone just took a swash and stuck it under a P. </p>
      <p>So, in my head (which is never a safe place) when reading the word I have to go back over the last two letters, and DAIMLER becomes DAIMLEP-ER. </p>
      <p>If the intent of the wordmark was impart something along the lines of solid-structured-stylish, I think the R's contrasting elements undermine the solid-structured part... and unbalance the wordmark.</p>
