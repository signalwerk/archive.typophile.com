      <p>Well, there is the traditional pica and the PostScript pica. Six PostScript picas = one inch, but six traditional picas = 0.996264 inches.</p>
      <p>Pixels are a relative measurement and are dependent on device (screen, printer, imagesetter, whatever) resolution. On a 72 dpi device, a pixel = 1/72 of an inch. But on an iPhone 4 (for example), a pixel = 1/326 of an inch.</p>
    html_clean: |-
