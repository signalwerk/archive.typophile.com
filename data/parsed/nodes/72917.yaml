    html: <p>12 points equals a pica, but 6 picas (72 points) only equals an inch because everyone agrees that it does. If you extrapolate 12, 6 pica inches, they do not equal a foot. They fall a little short. Everyone who owns a pica rule knows this. Admittedly not that many people own pica rulers these days, but there you have it.</p>
