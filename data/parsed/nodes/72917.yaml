    html: <p>The topic of pixels continues to become more complex, as hi-res devices (like iPhone 4) no longer map CSS pixels (a.k.a "logical" pixels) at a one-to-one correspondence with physical device pixels. <a href="http://www.quirksmode.org/blog/archives/2010/04/a_pixel_is_not.html" rel="nofollow">This article</a> explains more on the topic. So, to clarify Mark's statement, 1 <em>physical device pixel</em> on the iPhone 4's screen = 1/326 of an inch.</p>
    html_clean: <p>The topic of pixels continues to become more complex, as hi-res devices (like iPhone 4) no longer map CSS pixels (a.k.a "logical" pixels) at a one-to-one correspondence with physical device pixels. <a href="http://www.quirksmode.org/blog/archives/2010/04/a_pixel_is_not.html" rel="nofollow" class="link-external">This article</a> explains more on the topic. So, to clarify Mark's statement, 1 <em>physical device pixel</em> on the iPhone 4's screen = 1/326 of an inch.</p>
