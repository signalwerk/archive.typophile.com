      <p>1 point × 12 = 1 pica<br>
      1 pica × 6 = 1 inch<br>
      1 inch × 12 = 1 foot<br>
      1 foot x 3 = 1 yard</p>
      <p>1 inch = 2,54 cm</p>
      <p>There is a diagram about English length measurement system <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/c/c8/English_length_units_graph.png" rel="nofollow">here</a>.</p>
