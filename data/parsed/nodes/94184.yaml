      <p>@Nick Shinn:<br>
      <cite>What’s the big deal about the shape of such ﬂy-specks?</cite></p>
      <p>It's quite true that in a display typeface on the order of Bifur or Peignot Bold, the ogonek, for example, is going to look different from its traditional shape. But one still has to know what that traditional shape <em>is</em>, if one is instead going to design a workhorse text face.</p>
      <p>As someone who, I presume, has an arts background rather than a science background, you should be familiar with the role of training in strict counterpoint in music education. And when designing an innovative display face, the same truism that serves as the rationale for that applies: before you can break the rules to good effect, first you have to be well acquainted with what the rules are.</p>
