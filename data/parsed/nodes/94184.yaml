      <p>Nick: <em>That sounds like the professionals telling the readers what’s good for them, because it doesn’t make any sense otherwise.</em></p>
      <p>Given that type designers and other 'creative professionals' tend to be, well, creative, this also doesn't make any sense. Readers tend to be more conservative than designers. Perhaps more to the point, the publishers who stand between the creative professionals and the readers tend to be very conservative, because if they innovate they run the risk of people not buying their product. This is why even magazine text typography tends to be conservative and follow established norms, while display typography goes wild beside and around the text.</p>
