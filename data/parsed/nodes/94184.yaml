    votes: null
    html: |-
      <blockquote><p>Isn’t Yefimov’s Lazurski, with its “tick mark”, asymmetric kreska, a bona ﬁde text face? It is certainly marketed as such.</p></blockquote>
      <p>Yes, it is marketed as a text/display design. However, it is not very practical for body text composition.</p>
      <p>Vadim Lazurski was not a type design professional. He was a fine <a href="http://bjorn.kiev.ua/librae/LazurskyCV/img/hi/068.jpg" rel="nofollow">book designer</a> (so were Kuzanyan and Telingater,b.t.w.), and a highly skilled <a href="http://bjorn.kiev.ua/librae/LazurskyCV/img/hi/072.jpg" rel="nofollow">lettering artist</a>. Lazurski was one of the best Soviet experts in the <a href="http://bjorn.kiev.ua/librae/LazurskyCV/img/hi/118.jpg" rel="nofollow">history of typography and type design</a>. He was also a mentor, and a dear friend of mine.</p>
      <p>Lazurski had only one type design under his belt, <em>Garnitura Lazurskogo</em>, developed for linecasting composition (in two sizes, 10 and 8 pt.). Of the two sizes produced—cut from the same master drawing—only one, <a href="http://bjorn.kiev.ua/librae/LazurskyCV/img/hi/113.jpg" rel="nofollow">10 pt.</a>, seemed to work, but neither was used in print. In his designing the typeface Lazurski was heavily assisted by <a href="http://paratype.com/help/designers/designer.asp?code=PT_SHA" rel="nofollow">Anatoly Schukin</a>, an experienced staff designer at VNIIPoligrafmash but that did not help much. The printing of Pushkin’s <em><a href="http://bjorn.kiev.ua/librae/LazurskyCV/img/hi/115.jpg" rel="nofollow">Cavaliere di Bronzo</a></em> (Verona: Officina Bodoni, 1968), where a special cut of his typeface was used alongside Giovanni Mardersteig’s Dante, is a different story in its entirety.</p>
      <p>Lazurski’s type design seemed to have a second chance in 1983–4 when VNIIPoligrafmash started adapting its type library to the requirements of domestic phototypesetting. <a href="http://paratype.com/cinfo/news.asp?NewsId=396" rel="nofollow">Vladimir</a> worked very hard adjusting the letterforms, their proportions, stroke weight, the spacing of the glyphs—everything—trying to make the design more usable; he practically redrew everything… And yet, he was not too happy with the results. He told me, not once, that a lot more, and much more radical, revisions should have been necessary to make the design work well at body text sizes. </p>
      <p>The bottom line: Lazurski Roman still looks its best at larger sizes, not 10 pt.</p>
