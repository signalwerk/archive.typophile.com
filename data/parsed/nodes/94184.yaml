      <p>I was in Istanbul recently, and observed a very clear-cut distinction between display typography and text typography when it comes to the Çç and Şş. In display typography, any kind of mark at all below the letter is accepted as representing the cedilla. Since the cedilla is the only below-letter mark in the Turkish orthography, there is no danger of any mark below C or S being mistaken for something other than cedilla. A dot is very common, diamonds too, and even a horizontal line like a macron below the letter. But in text typography the cedilla qua cedilla is absolutely the norm. I asked Turkish designers at the ISType conference about this and they were adamant that in a text face anything other than a cedilla would be considered incorrect by readers, even thought he same readers happily accept other forms in display type.</p>
      <p>I think this is very much the kind of phenomenon that, rightly, encourages type designers to seek the norms for text typography in various scripts and languages, and Andreas' question is entirely reasonable. This is not to say that such a definite norm exists for Bashkir text typography, but that it may, and looking at display typography may be misleading or irrelevant.</p>
