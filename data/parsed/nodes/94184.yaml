      <p>Yes Michel, I remember that thread, and I thought the consensus was that there was room for variance.<br>
      You yourself said, “The logical consequence is that if you see some diacritic under a c in French, that must be a cedilla.”</p>
      <p>John: <em>…before you can break the rules to good effect, first you have to be well acquainted with what the rules are.</em></p>
      <p>There is no need for prescriptive rules; but there are standards.<br>
      As a designer, I prefer to study the ﬁeld myself, and form my own conclusions about what constitutes standard practice. Michel’s statement, quoted above, taken in context with the ductus of the typeface, and an awareness of various other type designers’ solutions, is sufﬁcient.<br>
      For unicode characters, a suggested glyph is presented by the consortium, but this does not mean, for instance that binocular g is the rule.</p>
      <p>**</p>
      <p>The evolution of the vertical hacek is an interesting example of the way that practice gets ahead of standards, creating new standards. The Microsoft site says, “In the lowercase the apostrophe is the preferred diacritic,” but that is no longer true.</p>
