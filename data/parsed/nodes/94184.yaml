      <p>I took the time to look at the previous versions of the Unicode Consortium file NamesList.txt; they are available since version 2.0.0. Here is what I found (in case you were not aware).</p>
      <p>From <a href="http://www.unicode.org/versions/components-2.0.0.html" rel="nofollow">version 2.0.0</a> (July 1996) to <a href="http://www.unicode.org/versions/components-2.1.9.html" rel="nofollow">version 2.1.9 </a> (April 1999) the comment for 0498, 0499, 04AA and 04AB was:</p>
      <blockquote><p>
           * cedilla form preferred
      </p></blockquote>
      <p>From <a href="http://www.unicode.org/versions/components-3.0.0.html" rel="nofollow">version 3.0.0</a> (Sept 1999) to <a href="http://www.unicode.org/versions/components-4.1.0.html" rel="nofollow">version 4.1.0</a> (March 31, 2005) the comment for those same characters was:</p>
      <blockquote><p>
           * reversed ogonek form of the descender is preferred
      </p></blockquote>
      <p>The current comments appeared in <a href="http://www.unicode.org/versions/components-5.0.0.html" rel="nofollow">version 5.0.0</a> (July 14, 2006).</p>
