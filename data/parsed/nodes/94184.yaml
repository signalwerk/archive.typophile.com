      <p><em>I asked Turkish designers at the ISType conference about this and they were adamant that in a text face anything other than a cedilla would be considered incorrect by readers, even thought he same readers happily accept other forms in display type.</em></p>
      <p>That sounds like the professionals telling the readers what’s good for them, because it doesn’t make any sense otherwise: the readers don’t mind all kinds of accent when the type is large enough that they can see the difference, but when it’s so small they can’t see the difference, then they won’t tolerate any difference!</p>
      <p><em>It works exactly the same way with the kratka (‘Cyrillic breve’) in Russian.</em></p>
      <p>Surely not—it seems to me that there are many varieties of kratka in body type, with both symmetrical (e.g. New Standard) and asymmetric (e.g. Lazurski, Didona) forms, and with open (New Standard) and furled (e.g. Academy) forms. There are even some body types which have an angular, caron-like kreska, and Kuzanyan has a lower-case kreska that looks like an acute with a tilde swoosh! Are these all display faces?</p>
