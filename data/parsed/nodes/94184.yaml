      <p><em>The bottom line: Lazurski Roman still looks its best at larger sizes, not 10 pt.</em> </p>
      <p>That’s all very well Maxim, but just because you don’t think it’s a very good text face doesn’t make it a display face.</p>
      <p>As you admit, it was designed and manufactured as a text face (8 and 10 pt).</p>
      <p>And it still has a háček-shaped kratka, surviving the transition to both phototype and digital.</p>
      <p>**</p>
      <p>Vadim Lazurski could be compared with any number of Western type designers during the industrial era—Goudy, Dwiggins, Gill, Cooper, Koch, Renner, Menhart &amp;c.—who, on the strength of their abilities as typographers and lettering artists, were contracted by foundries to design text types. Of course, they were not initially “type design professionals”, and had a few things to learn about designing type, while bumping heads with the technical staff at the foundries. </p>
      <p>Naturally, these non-type-design-professionals would attempt to integrate diacritic design into the general design of a face. This was due to their understanding, as letterers/calligraphers, of the importance of consistent ductus; an understanding which was at odds with production methods at foundries, in which it was common practice to create accented characters for a new type by using standard renderings, as noted by Veronika Burian: “Normally, Monotype would have choosen them from a standard set of marks and then cast them together with the letter on the type body.” (<em>Oldrich Menhart</em>, ﬁg. 82: <a href="http://www.rosettatype.com/resources/typo_bites/menhart/menhart.pdf" title="http://www.rosettatype.com/resources/typo_bites/menhart/menhart.pdf">http://www.rosettatype.com/resources/typo_bites/menhart/menhart.pdf</a>)</p>
      <p>There are hence severtal perspectives on what is best for diacritics:</p>
      <p>1. Type designers, with a broad knowledge of letterform and an understanding of <em>ductus</em> (if not themselves calligraphers/letters), will attempt to integrate mark shape into the general style of a type, often in creative ways that produce non-standard forms.</p>
      <p>2. Type professionals more involved with theory or production tend towards standard forms, for reasons of neatness and efﬁciency. As John notes, publishers tend to be conservative.</p>
      <p>3. Readers: they have no say in the matter. So far, cognitive psychologists haven’t addressed what’s best for them.</p>
      <p>I once conducted an experiment with various alternates of l-slash (different angles, heights and weights of the slash) interspersed amongst a setting of text, with a Polish reader. She read the whole text ﬂuently, and even after I had told her what was odd about the type, still couldn’t discern the differences. Admittedly, this was rather unscientiﬁc, but it conﬁrmed my prejudices that, when the rubber hits the road, there is some ﬂexibility permissable in the design of diacritics.</p>
