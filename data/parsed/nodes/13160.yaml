    html: <p>The closest InDesign comes to letting you control line lengths in rags is the "Hyphenation Zone" settings in the Hyphenation settings (you get to it from the Paragraph or Control palette menu). Words that overlap the "zone" that you specify either get hyphenated or bumped down, depending. Hyphenation Zone settings are often overriden by the Paragraph Composer. Thomas Phinney (from memory) said that the multi-line Paragraph Composer softens a rag.</p>
