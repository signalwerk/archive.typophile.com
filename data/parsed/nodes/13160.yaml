    html: |-
      <p>In Quark there is an option in the H&amp;Js pallette called Hyphenation Zone which works from the righthand margin. It will hyphenate a word when  the previous word ends before the Hyphenation Zone and an acceptable hyphenation point falls within the Hyphenation Zone.<br>
      Tim</p>
