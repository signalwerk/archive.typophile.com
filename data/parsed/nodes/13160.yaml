  html: |-
    <p>Does inDesign have a feature which would enable me to control the line lenght? I'd like to be able to control how deep/shallow the rag is.</p>
    <p>For example if I have a paragraph of text which is aligned flush-left (ragged-right), can I specify a maximum rag (or minimum lenght) before it hyphenates? </p>
    <p>How about the same thing in Quark?</p>
