    html: |-
      <p>Thanks everybody. </p>
      <p>I've been refining away for the past few days, and now I've done the complete lower case. I decided that the light weight was a bit too anorexic to get any decent bumps so I fattened it up. The heaviest weight is also a fair bit heavier, and looking pretty damn chunky! </p>
      <p>This has been quite a learning process - there's a very fine line between good-looking curves with a few bumps and a bumpy mess. Some characters are more angular than the previous examples - c, e g (slightly) and s, and others have been made more substantial - a, the ear on the g (BTW - I like the top of the s, so I'll leave it). William - try rounding the tops of the foot serifs to match the pattern of the head serifs - What? like Cheltenham you mean? I'm not keen on that idea - I like the contrast between the top and bottom serifs.</p>
      <p>I'm pretty pleased with it so far - it has plenty of character but can be taken seriously, without straying into the 'cartoony' look.</p>
      <p>Any glaring errors I've missed?</p>
      <p>Thanks in advance.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/JX6_4753.jpg"></div><p></p>
      <p>Nick Cooke</p>
