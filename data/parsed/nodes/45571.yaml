      <p>Hi Nick,<br>
      Great work, its looking really nice. I especially like the e, c and o. They have a really nice feeling cut. I also like the double story g, the y, the r and the f - although I find the g to be a little upright. I love the hard angled internal serif on the s - but maybe it needs to be accentuated further. Not a big fan of the serif on the top of the s.  </p>
      <p>To me the glyphs I've listed above seem to fit into a more harder chiseled face, which seems a little bit at odds with the other softer more hand-drawn characteristics. EG, the ear on the g, the underside of the e, the hard internal bowl of the o all work together, but don't really fit with the more fluid calligraphic style of the h, m, n, b, t, i, v. BTW, I love the variation in weights - its nice to see the skeleton underneath still holds up at light weights.</p>
