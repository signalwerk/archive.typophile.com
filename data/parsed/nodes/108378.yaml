  html: <p>Hello everyone. I am designing a book. The first part if of this series of book use blackletters for Initial Letter at the beginning of each chapter. I am trying to find a kind of more plain and elegant instead of blackletters. I would love to share some ideas about this issue. Thanks in advance.</p>
