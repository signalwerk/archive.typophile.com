    html: <p>I think this is a good one, I suppose I can use Castellar not only with Palatino, but with other "classic" typefaces as well. I can not understand why some designers tend to use "extreme" initial letters, cluttered with so much details. I am not trying to blame the designer of the book but I assume blackletters as extravagant and unique to be easily compatible with a plain and legible typeface such as palatino is.</p>
