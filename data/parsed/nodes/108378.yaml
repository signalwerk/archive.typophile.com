      <div class="comment-spam-body"><p>The overview the book is this one:<br>
      "THE SAGA BEGINS<br>
      How can you live, breathe, feel and hope when your world is collapsing and your life is now a lie - when sadness and despair become addictive? Led by the wearing need to learn the truth about her past, fearless, resilient Caitlin goes against her better judgment and returns to those who once betrayed her - those who stripped her of everything she knew and loved. Suddenly none of the rules that have kept seventeen-year-old Caitlin apply anymore and everything is on the line: her freedom, her family - EVERYTHING. Enter the lush extravagance of a secret society tucked away in the small town of Oaks and uncover the link between her past, present and uncertain future - unraveling the lines that bind her to the inexplicable events that threaten her own existence."</p>
