      <p><em>John, is Constantia being similarly expanded? Are there plans?</em></p>
      <p>No immediate plans of which I am aware. But if enough of you contact MS with a request for an expanded Constantia, it might happen. Ideally, all the CT fonts would be brought up to the same level of Unicode support. It's a bigger job than for most other MS fonts, because the CT fonts all have proper smallcap support.</p>
