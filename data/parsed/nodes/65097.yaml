      <p>@Nick: OK, well what <em>I</em> meant by system font in my original question was a font bundled with the OS, so that I could safely assume that another user of a Windows system would definitely have it. <em>Perhaps</em> I misused the terminology: ...semantics, meh. Since MS Sans falls within both definitions that sorted me out wrt that. The subsequent discussions have been interesting nonetheless! :-D</p>
      <p>BTW, agree with you on keeping the design of the character in keeping with whatever level of modernity the rest of the font has. I've read more than one linguistics book where the author has had to use yogh (and wynn, etc.) in discussions of OE, and the thing has stuck out like a sore thumb because it didn't look like it belonged to the same font...</p>
