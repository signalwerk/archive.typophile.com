      <p>I think making glyphs is an order of magnitude more complex than making icons.</p>
      <p>&gt; You cannot compare the workflow</p>
      <p>Having made bitmap fonts of various sizes since 1982 I certainly agree there's a difference, below a certain threshold. But towards the top of that threshold things can get much harder in a different way, especially if you leverage manual anti-aliasing:<br>
      <a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a></p>
      <p>hhp</p>
