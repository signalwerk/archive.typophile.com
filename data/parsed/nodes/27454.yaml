      <p>Hmmm – I don't think it is that unreadable, I can make out the characters, but my mum couldn't. </p>
      <p>Januzzi Smith designed a limited pixel font for The London School of Arts, the concept font was for screen only, but it had some interesting forms. </p>
      <p>With regards to yours, I liked some of the earlier forms within the characters, but they were less legible. It is the balance between interesting letter shape and legibility. The closer you come to making it legible, the more it looks like other pixel fonts …</p>
