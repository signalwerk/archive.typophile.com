      <p>&gt; I guess I don’t understand the rush to pixelize fonts. Why not use the standards already readable?</p>
      <p>No offence, Ad3m, but can't the same be said for vectorfonts or pretty much everything? We're already spoiled for choice when it comes to vectorfonts, music, art, books, movies,...</p>
      <p>&gt; Afterall, it is not an artistic venture. It is a minimal venture</p>
      <p>Pixelfonts are a great way of learning about type in a simplified way. Besides, simplifying things &amp; bringing them back to a minimum of pixels is an artform in itself. The power of suggestion &amp; fooling the eyes is a big part of designing pixelfonts. Not everyone can do it.</p>
