      <p><cite>Maybe because:<br>
      1) Some people do this sort of thing because they enjoy the constraint.</cite></p>
      <p>That's it - and you can learn a lot about the way our visual interpretation works.<br>
      I did it just for fun. I also design 16x16 pixel icons from time to time - the difference is not that great. It's pixel art (and I started with that 20 years ago).</p>
      <p><cite>2) The more pixels, the more work it is, squared.</cite></p>
      <p>You cannot compare the workflow. At the lower limit it becomes quite complicated.</p>
      <p><cite><br>
      BTW, I for one would love to make subpixelfonts (I just made that up)<br>
      but it requires Photofonts - does it have pretty good penetration yet<br>
      </cite></p>
      <p>As far as I know: No.</p>
