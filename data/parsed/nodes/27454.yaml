      <p>Hey, Ringo,</p>
      <p>i really like your minimal font as it keeps it identity throughout both upper- and lowercase letters despite the mini-grid it's designed within.</p>
      <p>Some years ago i felt the urge to make a 3x3 pixel font (<a href="http://cargocollective.com/slowercase#318485/3x3-Font-for-Nerds" title="http://cargocollective.com/slowercase#318485/3x3-Font-for-Nerds">http://cargocollective.com/slowercase#318485/3x3-Font-for-Nerds</a>) just to see if it was possible to deschipher the 3x3-pixel-matrix as letters. I guess it's not so hard ;-)</p>
      <p>It would be cool to see how much identity / which variations one could put into these limitations.</p>
      <p>anyone else made a 3x3 pixel font out there?</p>
      <p>fred</p>
