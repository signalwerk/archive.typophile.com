    html: <p>Thanks to whoever removed my double-post. <br> <br>Yeah, they're really rule-bound...  Kind of begs the question if someone has done it before, with similar letterforms, and in some cases the exact same ones?  (has to be someone) <br> <br>It does have a clean "digital" quality to it, though.  So I'll save that font for later. <br> <br>But it feels like I took one step forward and two steps backward.  Instead of doing something new, I got locked into a set of rules that I created for this project. <br> <br>Yeah, I was thinking of printing out the typeface on paper or cardboard and cutting them out, but I don't have an exacto knife.  I will do more work on the font this weekend when I have more time, and maybe try cutting them out. <br> <br>Thanks again for all your help.  I'll post new versions of Breccia as soon as they become available.</p>
