    html: "<p>John, <br> <br>Thank you for your comment.  Since there are plenty of utilatarian stencil typefaces out there, I think I'm going to choose the latter approach and try for a more decorative and creative approach. <br> <br>How do you feel about the weight?  Is it good as it is?  Or should I go thicker or thinner? <br> <br>Also when it comes to the naming of the font, it's called Breccia and the style is Stencil.  If I had different versions of the typeface, should I just have different style name like: Stencil, Stencil Bold, Stencil Italic, Stencil Bold Italic, and Distressed, Distressed Bold, etc.  Or should I introduce the Stencil and Distressed to the typeface name instead of style?  I hope you understood that.  =) <br> <br>Thanks again!</p>"
