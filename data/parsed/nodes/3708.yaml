    html: <p>Thanks - Just trying to be ribbony. Yeah, it's too LCD-ish. Too rule bound. <br> <br>I looked at the old face you posted again today &amp; I have to say I still think it's a direction worth working away at. I really like the old R. <br> <br>BTW- have you tried cutting the stencil out? Some of the breaks in the first set of letters seem like they would not support the cardboard around them that well - they seem like they would be weak connections...  <br> <br>That's why I was thinking about actualy cutting it out - it would be a way of seeing if the design is practical ( or not) .  <br> <br>Also it's a a different creative process. Like stone chiseling - or writing with a quill. <br> <br>Your original R &amp; E are where I started thinking about ribbon - but I'm not sure a litteral adherence to the idea of ribbon is key ( like I did in my example). The old R doesn't stick to the ribbon idea completely &amp; yet it's a really nice charcter. <br> <br>-e. <br></p>
