    html: <p>Lately for me, stencils have been a practical, industrial solution, rather than an aesthetic trick.  <br> <br>It's up to you which tactic you want to take -- purely utilitarian, and yet possessing a "vernacular" appeal like your Y and N, or else more decorative. For instance, the location of the stent in the L is pointless except for looks. If you choose the latter approach, I suggest you go all out and push the outside of the envelope. Good luck!</p>
