  html: <p><img src="http://www.typophile.com/forums/messages/29/28964.gif" alt="Breccia, Stencil"> <br> <br>I've been sketching typefaces on paper for a long time, but this is the first time I created a complete true type font.  Since it is my first attempt I wanted to start with something easier, hence a stencil typeface.  I've been on the look-out for a great stencil font for a long time, so this is something that I will use myself, at least. <br> <br>I wanted the font to look like it had been hand cut, so I introduced some irregularities to it.  I also wanted each face to be different and have a look of its own, so the font does not follow strict set of rules.  The letters I like the most are A, B, and R.  And so far I only have A-Z, and some punctuation marks. <br> <br>Any comments would be greatly appreciated.  Please tell me how to improve this typeface so that I can make it better. <br> <br>I imagine that this font would be useful for bands (punk rock, etc), industrial, and futuristic applications.</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/29/28964.gif" alt="Breccia, Stencil"> <br> <br>I've been sketching typefaces on paper for a long time, but this is the first time I created a complete true type font.  Since it is my first attempt I wanted to start with something easier, hence a stencil typeface.  I've been on the look-out for a great stencil font for a long time, so this is something that I will use myself, at least. <br> <br>I wanted the font to look like it had been hand cut, so I introduced some irregularities to it.  I also wanted each face to be different and have a look of its own, so the font does not follow strict set of rules.  The letters I like the most are A, B, and R.  And so far I only have A-Z, and some punctuation marks. <br> <br>Any comments would be greatly appreciated.  Please tell me how to improve this typeface so that I can make it better. <br> <br>I imagine that this font would be useful for bands (punk rock, etc), industrial, and futuristic applications.</p>
