    html: "<p>Eben, <br> <br>Thank you for your insightful comments.  Yeah, I'm not really sure yet if I will have more versions than the stencil one.  So I guess I'll just call this Breccia (regular as the style). <br> <br>I will try to do more of the letters like the E... I guess I should stick to one style.  I agree with you on the G.  You've got some good suggestions there. <br> <br>Yeah, I was going for a home-made feeling, hence the softened-straight lines and some degree of imprecision.  Maybe I should have two versions: Precise and Home-made? <br> <br>I'm European, maybe that's where the European feeling comes from; I live in the US, though. <br> <br>Here's where I got the name for the typeface: <br> <br><a href=\"http://www.m-w.com/cgi-bin/dictionary?book=Dictionary&amp;va=breccia\" target=\"_blank\">http://www.m-w.com/cgi-bin/dictionary?book=Dictionary&amp;va=breccia</a> <br> <br>It seemed fitting, somehow. <br> <br>Thanks!</p>"
