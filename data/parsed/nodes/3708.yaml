    html: <p>Eben, <br> <br>I totally agree with you... I don't like my new version any more either.  Looking at it now, after creating the typeface, it doesn't feel that much like a stencil, it's almost like a pseudo LCD typeface. <br> <br>I love your idea with the ribbon.  It'd be really cool to take a long strip of paper (or ribbon, of course) and bend the different letterforms, see what kind of angles you'd use, and if you had to cut the strip in several pieces. <br> <br>Thanks for the help.  The G and Q looks great. <br> <br>It's pretty hard, sometimes, to find unity when you work with constraints, but that's where creativity comes in... so I need to work on this font some more.  I'll post more versions of this font as I work on it. <br> <br>Oh, I just noticed, I like what you did to the K, it's cute.</p>
