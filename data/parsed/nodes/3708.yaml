    date_raw: 21 Mar 2004 — 9:08pm
    votes: null
    html: <p>The naming question is an interesting one. I started to think about it &amp; it seems like calling it 'breccia' without the word stencil would make sense unless there is going to be a non-stencil version. In which case the reverse. <br> <br>I think some of the breaks are more successful than others. The R for instance is pretty artrful &amp; feels almost like a folded piece of ribbon. I was looking at the W for example &amp; thought why not break witha diagonal right after the peak in the w instead of with two straight vertical breaks.  <br> <br>For the breaks to feel right I think They need to help accentuate the shape of the letter rather than hiding it. Thats my diagnosis for the W. I like the E. The G is a mess. <br> <br>I would do your C &amp; F I like the E. I like the K &amp; O alot.  <br> <br>In terms of weight - it depends on what kind of impression you want to make. It feels very home-made &amp; so very punk at the moment. It also feels kind of european tro me. Very regular at heart. </p>
