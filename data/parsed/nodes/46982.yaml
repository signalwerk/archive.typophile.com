      <p><cite>I am particularly interested in how individual designers fared after the wall cut them off from the greater design community.</cite></p>
      <p>You really should have attended the ‘<a href="http://www.fontwerk.com/530/berliner-typostammtisch-1007-zusammenfassung/" rel="nofollow">Typostammtisch</a>’ meeting in Berlin last autumn! ;-)<br>
      <a href="http://www.primetype.com/home_profile.php?p=8" rel="nofollow">Karl-Heinz Lange</a> held an intriguing lecture about his 60 years as a type designer. </p>
      <p>One of his stories was of how once Typoart had commissioned him to draw a typeface, similar to <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>’s successful <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>. Lange suffered from pangs of conscience: he didn’t want to be regarded as a plagiarist, of course.<br>
      His hope was that his personal handwriting style would rub off on the design and make the letterforms look sufficiently unique. But he wasn’t really sure about that.</p>
      <p>On the occasion of a family celebration, Lange got an exit permit to leave the GDR. He seized the opportunity and met with Zapf in Frankfurt/Main (West Germany), in order to show him his sketches for ‘<a href="http://www.typografie.info/typowiki/index.php?title=Publica" rel="nofollow">Publica</a>’. “After what felt like an eternity – it must have been 5 minutes”, Zapf gave his consent and shook hands with his East German colleague.</p>
      <p><a href="http://www.flickr.com/photos/hardwig/1477637812/in/set-72157602243856192/" title="http://www.flickr.com/photos/hardwig/1477637812/in/set-72157602243856192/">http://www.flickr.com/photos/hardwig/1477637812/in/set-72157602243856192/</a></p>
