      <p>No problem.<br>
      Re Publica: It might be of interest to you that <a href="/wiki/Karl-Heinz%20Lange" class="freelinking" rel="nofollow">Karl-Heinz Lange</a> and <a href="/wiki/Ole%20Sch%C3%A4fer" class="freelinking" rel="nofollow">Ole Schäfer</a> currently are working on revised and enhanced digital versions of some of Lange’s typefaces; Minima, Super and Publica among them. They will be published as PTL Minimala, Suprala and Publicala via <a href="http://www.primetype.com/home_profile.php?p=8" rel="nofollow">Primetype</a>, in the – hopefully not too distant – future.</p>
      <p>[edit: Crap, it’s all covered in the <a href="http://pingmag.jp/2007/10/05/veb-typoart-the-east-german-type-betriebsstatte/" rel="nofollow">PingMag article</a>. ;-)]<br>
      <cite>Currently, Karl-Heinz Lange is working on new versions of five of his designs: Publicala, Suprala, and Minimala will be based on his Typoart designs Publica, Supra, and Minima and will be released by PrimeType, while Rotola and Diplom Antiqua will be released by Elsner + Flake. </cite></p>
      <p>Re Korger: You might know her <em>Schrift und Schreiben</em>, alsp published in English as <em>Handbook of Type and Lettering</em>. The linked article mentions another (then new) book about her work as a teacher at HBG Leipzig. Its details:<br>
      Hildegard Korger: <em>Schrift und Schreiben im Unterricht</em>, ISBN-13: 9783932865121. Published by Hochschule für Grafik und Buchkunst Leipzig, 1999. 132 p.<br>
      F</p>
