  html: |-
    <p>I've been doing some research on design and typography in Germany, roughly from just before the turn of the century until 1945. There seems to be a wealth of information on this topic. I have especially been happy with the fairly recent research on blackletter, a form that seems near and dear to many typophiles.<br>
    I am wondering now about type and graphic design after the wall went up, in East Germany in particular. I know you are very knowledgeable on type history; please forgive my ignorance in regards to this period in history. I am seeking sources of information, or interesting asides, that may be hard for me to uncover at first. Just to get started...<br>
    I am particularly interested in how individual designers fared after the wall cut them off from the greater design community.</p>
