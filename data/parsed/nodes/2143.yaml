  html: <p>Did we mention you still get 3 shirts?  <br>____________________________ <br> <br>Just when you thought you had the contest in the bag,  <br>the stakes have been raised! Los Angeles-based  <br><i>hyperfoundry</i> Apollo 26 (<a href="http://www.apollo26.com" target="_blank">http://www.apollo26.com</a>) has <br>put up $250 in prize money for the winner of the  <br>Typophile Tee contest.  <br> <br>Only two weeks remain to submit your entry or revise a  <br>design you've already submitted to the contest. All tee  <br>submissions must be received by midnight PST on  <br>Friday, August 30th to qualify. Download the EPS  <br>template at http://www.typophile.com/downloads/.  <br> <br>We've received tees from designers and design studios  <br>across the globe and we're as excited as you are to see  <br>which entry wins. Thanks to everyone for your support  <br>and publicity, and to our judges from House, HTF, T-26,  <br>Font Bureau and Letterror for donating their time to help  <br>us select the winner.  <br> <br>Entries are posted daily at the Typophile Forums. <br><a href="http://www.typophile.com/forums/">http://www.typophile.com/forums/ </a> <br> <br>Best,  <br> <br>Jared &amp; Joe  <br>Typophile</p>
