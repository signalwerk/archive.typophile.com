      <p>&gt; 'How is meat a trigger food for IBS?'</p>
      <p>Don't know, but my guess is that it affects people who are deficient in certain stomach enzymes needed to break down protein, which leads to undigested meat being passed into the intestines.</p>
      <p>Perhaps this is somewhat similar to people who have lactose (milk) intolerance. They lack the stomach enzymes to break down milk, so it passes undigested into the intestines and causes problems.</p>
