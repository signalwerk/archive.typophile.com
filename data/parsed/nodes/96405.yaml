      <p>Re. eating:</p>
      <p>Intermittent fasting is indeed a good thing. If you consider that for most of our species' history on the planet we were subsisted on hunting and gathering it is clear that we are evolved, like all hunting animals, to irregular periods of eating and fasting. The notion of three meals per day at fixed times is an invention of the agricultural and industrial periods, and have more to do with the regulation of work than with the needs of the human body.</p>
      <p>With regard to diet, weight and health, though, what matters is not how much you eat but <em>what you eat.</em> The fallacy that what matters is calories consumed and calories burned presumes that the human body is a simple thermodynamic engine. It isn't: it is a complex biochemical engine that does different things with different input: 500 calories of protein, 500 calories of fat and 500 calories of sugar are processed in completely different ways and have very different effects on weight and health. Chris, you mention that you eat less than 1,200 calories per day, eat no meat and never lose weight, and also that you suffer from arthritis, heart disease, asthma, and COPD. Am I right in thinking that your diet includes hefty amounts of carbohydrates, bowel irritants and inflammation-causing 'foods' such as grains, rice, corn, beans, etc..</p>
      <p>People have various theories about the significance of the paintings at Lascaux and Chauvet and other palaeolithic sites. It seems obvious to me: <a href="http://deitchman.com/mcneillslides/images/lascaux-hunters.jpg" rel="nofollow">they're instruction manuals on what to eat</a>. Note the absence of potatoes.</p>
