    html: "<p>Chris, what was your source for that information? To my knowledge, there is nothing in meat that acts as a bowel irritant: if there were, the human species would probably never have survived. This is not to say that meat is easy to digest <em>if</em> your bowels are inflamed or perforated, but that's not the fault of the meat but of what is causing inflammation or perforation. Stopping eating meat may simply mask the damage that is being done by making you less aware of problems in your digestive tract. I recommend reading up on lectins in grains, seeds and beans, and their affect on intestinal metabolism and damage.</p>"
