      <p>We’re not discussing mid-life crisis.</p>
      <p>That occurs when one has achieved some security (materially and socially) in life, and has some breathing room to reﬂect that all the hard work becoming respectably bourgeois has made Jack a dull boy. The term crisis is ironic, because the sports car is quite affordable now. It is a term of mildly satirical censure: get back in the ranks you ridiculous person, pretending to be the youth you’re no longer—wait till your retirement to indulge yourself (in a mature and restrained manner), like everybody else.  </p>
      <p>Realizing one’s mortality, with resultant lifestyle changes, can happen at any point of a “normal” life span.</p>
