    html: |-
      <p>Nick: <em>You may believe what you wish: if it works for you, then so be it. OTOH, "if it works for you" IS the operative term.</em></p>
      <p>Er, no, when it comes to physical reality I can't believe what I wish, and I recognise that 'working for me' is merely anecdotal evidence, as is Chris' 'feeling better'. There are people who feel better after taking homeopathic remedies, despite the fact that most of these remedies do not even contain <em>any</em> active ingredient and none have passed a single controlled trial since testing of them began well over a hundred years ago. When it comes to physical reality, I rely on the physical sciences, which means reading the science and evaluating it, and in the case of health and nutrition critically interrogating the use of science by healthcare professionals. If someone tells me that 'meat is a bowel irritant' I really do want to know on what basis that claim is made. I'm not choosing to believe or disbelieve something about physical reality, I am asking for information about the claim so that I can form a reasoned judgement of it. In order to be a bowel irritant, something that you eat must contain something that interacts with the digestive tract in a way that causes stress or damage to it. Okay, so what in meat meets that criterion? That seems to me a very reasonable question to ask when someone claims that meat is a bowel irritant. How is it a bowel irritant? What is the physiological process involved?</p>
      <p>As it happens, I can think of one really easy way in which meat might be a bowel irritant, and that is if the meat is from grain-fed cattle, because then the meat will contain lectins from the grain, and lectins definitely are bowel irritants (and worse: through damage to the intestines they enter the bloodstream and are a factor in autoimmune diseases; the damage they cause also allows other molecules that shouldn't enter the bloodstream to do so). But obviously the culprit here is not meat per se, but the grain that the animal was fed, contrary to its natural diet. Which takes me back to my surprise that Chris received advice to give up meat but not, apparently, to give up grain, despite the fact that grain is frequently one of the first things that people with bowel problems are told to avoid.</p>
      <p>As I suggested in my first comment on this subject, 'feeling better' is not an objective measure of bowel health, because some of the most damaging results of irritation and perforation of the intestines are not experienced as intestinal discomfort. Hence, removing meat from the diet might relieve some symptoms while masking ongoing problems caused by other substances.</p>
      <p>Last summer I began eating in a particular way because I came to the conclusion that the scientific basis for doing so was sound, and that the scientific basis for much of the advice proffered in public policy and by professional nutritionists was without merit. How did I come to that conclusion? By looking at the science and evaluating it, and examining the way the science was being used in forming public policy and nutritionist eating plans. I don't think this constitutes 'believing what I wish'. Nor is this conclusion founded on 'what works for me', which came later. I will note, however, that in addition to feeling good, I am healthier than I was a year ago by objective measures: blood pressure, weight and body fat percentage, active pulse rate, etc..</p>
