      <p>Well, meat made mind: humans beings are so because we became carnivorous as a species about a quarter of a million years ago. Myelin, a.k.a. white matter, is about two-thirds fat and one-third protein. A diet rich in fat and protein is essential to brain growth, which effectively ceases after age thirty, at which time fat and protein get stored…and cause health problems, obviously. Eating like a kid is good for kids, but not for adults.</p>
      <p>OTOH, you can retune your body for a twenty-five-year-old's metabolism, if you have a mind to. Fifty-seven pounds in six months—documented by my nurse practitioner—is proof of claim. Unfortunately, the process leaves you terminally loony…or, so I am told.</p>
