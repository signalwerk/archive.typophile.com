      <p>Hrant,</p>
      <p>Less is, indeed, more. So far, I have managed several six-day stints of nothing more than bread and water—cleverly disguised as Beck's Non-alcoholic Beer—and found the results edifying. Hell: even my eight-day self-imposed bread-and-water diet while in the custody of the Fairfax County Sheriff's Department's Restricted Issue Unit (read: torture/mind control chamber) wasn't all that bad. Well, relatively speaking, at least. Bonus: working-class hero street creds. The local skateboarders suggested a Mike Tyson-style tattoo; I am thinking maybe a henna version might be more appropriate…and, definitely, AFTER my trials, not before.</p>
