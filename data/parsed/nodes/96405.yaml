      <p>Chris: <em>My source is my Gastro-interoligist (and the consultant nutritionist that he recommended)</em></p>
      <p>Here's something to make you popular with both: ask them to provide you with peer reviewed journal articles of controlled experiments on which they have based their advice. I've given up accepting the advice of any nutritionist or dietician on authority because the bias in their studies are now so blatant that they <a href="http://garytaubes.com/2012/03/science-pseudoscience-nutritional-epidemiology-and-meat/" rel="nofollow">barely qualify as science</a>.</p>
      <p>Nick: <em>at which time fat and protein get stored…and cause health problems, obviously. </em></p>
      <p>I can reliably say that the weight and health problems of people on a modern diet have far, far more to do with sugar intake than with fat and protein. It is really difficult to get overweight on a diet of fat and protein: I know because I eat plenty but weigh 30lbs less than I did last summer and my body fat percentage has dropped to 14%. This from simply avoiding most sugars and all grain and legumes. I eat plenty of meat and lots of fat, and leafy green vegetables, brassicas and squashes; I don't get hungry, even when I fast most of a day, and my energy level remains comfortably high (rather than running through the peaks and troughs of sugar burning). Oh, and I don't think I've become terminally loony in the process.</p>
