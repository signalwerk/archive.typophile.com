      <p>Great question.</p>
      <p>I have been using Extensis Suitcase and printing sample pages using the “Print Sample Pages” function. It works well, but customization is limited.</p>
      <p>I would also be interested in seeing if there are any other programs out there that allow for more powerful layout options.</p>
