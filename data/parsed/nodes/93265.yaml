    <p></p><div class="imageWrap"><img src="http://typophile.com/files/triogrotesk-580-01_4507.jpg"></div><p></p>
    <p><strong>Trio Grotesk</strong> is Florian Schick’s personal interpretation of Kaart Antieke – an early 20th century sans serif used by Piet Zwart in his famous, yet never officially published essay about modern typography called “Van oude tot nieuwe typografie”.</p>
    <p>Trio Grotesk started as a student project for the KABK <a class="freelinking external" href="http://new.typemedia.org/" rel="nofollow">Type &amp; Media</a> masters course in type design. During a visit to the <a class="freelinking external" href="http://meermanno.nl/" rel="nofollow">Meermanno Museum</a> in Den Haag Florian discovered the only two remaining copies of Piet Zwart’s essay. Being struck by the historical value of this booklet, he decided to revive the typeface it was set in instantly.</p>
    <p>Florian enlarged and examined the original 7 point printed typeface in great detail and tried to replicate the image of this typeface as faithfully as possible. Certain features which are unique to letterpress printing, such as roundings caused by ink spread, have been preserved for instance.</p>
    <p>Trio Grotesk comes in three weights, sports a Latin extended characterset and includes small caps, seven ranges of figures, and numerous arrows, ornaments and dingbats.</p>
    <p>More info: <a class="freelinking external" href="http://www.boldmonday.com/en/triogrotesk/" rel="nofollow">www.boldmonday.com</a></p>
