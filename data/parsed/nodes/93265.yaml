    date_raw: 1 Jun 2012 — 9:40am
    votes: null
    html: |-
      <p>That is the personality of the typeface, and furthermore, it serves a functional purpose.</p>
      <p>The small apertures of /a and /e distinguish their terminal detail from that of a frequently adjacent character with similar details and general shape: /s.</p>
      <p>In an extended style such as this, the middle of the /s tends to the horizontal, so that there are three characters with a potentially theta-ish appearance, /a, /e, and /s.</p>
      <p>The design of /a and /e disambiguates them from /s.</p>
      <p>It also removes the possibility of a “super-counter” occurring in the combination of adjacent counters in the e_s and s_a combinations.</p>
      <p>Such almost-closed counters are also found in the Scotch (Modern) genre of serifed type.</p>
