      <p>It looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Avenir%20-%20Heavy&amp;fid=a18aff1363391533e205c2ae65649bba&amp;fsize=60&amp;text=012345&amp;fit=1" rel="nofollow">Avenir Heavy</a></strong> with modified /3 &amp; /5 digits.<br>
      For /3 &amp; /5 you can also try <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=MS-Windows-Fonts&amp;ffam=Gautami%20-%20Bold&amp;fid=1cb82c6f93c51aa8dd7c7ea82cd641eb&amp;fsize=60&amp;text=012345&amp;fit=1" rel="nofollow">Gautami (Bold)</a></strong> a font distributed with Microsoft Windows 7/8 to support the Indic script-Telugu<br>
      More on Gautami:<br>
      <a href="http://www.microsoft.com/typography/fonts/family.aspx?FID=238" title="http://www.microsoft.com/typography/fonts/family.aspx?FID=238">http://www.microsoft.com/typography/fonts/family.aspx?FID=238</a></p>
      <p>------------------<br>
      I found them using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
