  html: |-
    <p>WebriQ, an online web content management software has launched its Template contest. The company will award the best template design but also the best designed E-commerce site and the site with the most original content. The contest was started on November 13th, but you can get a sneak preview of the contest on <a href="http://contest.webriq.com" title="http://contest.webriq.com">http://contest.webriq.com</a><br>
    Further details will be on our website and on a WebriQ microsite<br>
    The winner will get a cheque of 1,000 USD and will be awarded with a Platinum WebriQ Partnership.<br>
    The contest is looking for original and custom made CSS Template designs based on the Universal Template design of WebriQ. Beyond the best design, the company will also award the best E-commerce Template design and the Template with the most original and best content.<br>
    How can you participate?<br>
    The contest is looking for original and custom made CSS Template designs based on the Universal Template design of WebriQ.<br>
    Beyond the best design, the company will also award the best E-commerce Template design and the Template with the most original and best content.<br>
    The contest is open to all interested web designers, web developers, free lance web developers or anyone that has basic or extended knowledge of CSS template design. </p>
    <p>for more info follow this link : <a href="http://webriq.com" title="http://webriq.com">http://webriq.com</a></p>
