    <p>larger sample here on a wheel: <a href="http://www.amclassic.com/enlarge/carbon58.jpg" title="http://www.amclassic.com/enlarge/carbon58.jpg">http://www.amclassic.com/enlarge/carbon58.jpg</a></p>
    <p>and a vector version on the last page of the PDF here: <a href="http://www.amclassic.com/pdfs/OwnersManual.pdf" title="http://www.amclassic.com/pdfs/OwnersManual.pdf">http://www.amclassic.com/pdfs/OwnersManual.pdf</a>, although this looks rather anaemic and poorly spaced compared to other two samples, as if it's missing its outer edge?</p>
    <p>cheers</p>
