      <p>Cheers Ignacio!</p>
      <p>That looks to be it, but just wondering given Mr Park's Puma and Snickers fonts, whether it might actually be based on the logo. Do you know any more?</p>
      <p>Edit: going by <a href="http://www.ethancote.com/fonts/samuel_park.html" title="http://www.ethancote.com/fonts/samuel_park.html">http://www.ethancote.com/fonts/samuel_park.html</a> this would appear to be the case: <cite>Other fonts I've created is a bunch of low quality 'based-on-logotypes-fonts like 'Park', 'Supreme', 'Freak out - Go bananas', 'Lunch time', 'What time is it?' and a couple of other.</cite></p>
      <p>Also found what looks like the same font, same author, called "Bauer" -- as in the ice hockey company -- which is more likely to be the logo he was looking to emulate. Bauer appear to have changed their logo face since and I can't find a sample.</p>
