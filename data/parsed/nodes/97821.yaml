      <p>Don’t think they are legal. </p>
      <p>For example SNC Script is officially known as <a href="http://www.identifont.com/show?SP" rel="nofollow">Nuptial Script</a>. AIS Script is <a href="http://www.identifont.com/show?36G" rel="nofollow">Shelley Script Andante</a> by Matthew Carter. ILS Script looks like a butchered <a href="http://www.identifont.com/show?39T" rel="nofollow">Shelley Script Volante</a>. And I absolutely don’t recommend to use FLW Script.</p>
    html_clean: |-
