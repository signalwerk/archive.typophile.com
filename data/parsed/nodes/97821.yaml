  html: |-
    <p>Hi I've been looking for a few script faces that are available to use commercially on some product design.</p>
    <p>I have came across a few that seem to do the job;<br>
    SNC Script<br>
    ILS Script<br>
    AlS Script<br>
    FLW Script</p>
    <p>I've been trying to validate whether these are legitimate to use commercially and was wondering if anyone could help me verify this.</p>
    <p>upon general internet searches the typefaces come up on many free font sites as belonging to<br>
    <a href="http://www.digitalgraphiclabs.com/default.html" title="http://www.digitalgraphiclabs.com/default.html">http://www.digitalgraphiclabs.com/default.html</a><br>
    were they say they have been released as free for commercial use as part of a pack of  typefaces</p>
    <p>many thanks for your help<br>
    steven</p>
