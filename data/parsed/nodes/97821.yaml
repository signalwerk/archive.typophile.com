      <p>I'm certainly not going to download everything that says 'free' next to it into my computers font library for it would make a rather vile mess lol, however it is a subject that I would find use full to know more of the finer points about.</p>
      <p>on a site I found a similar topic and someone posted the following;</p>
      <p>''The actual files of a font are protected by copyright, and using those files in a way not allowed by the license is illegal. The shapes of the letters in a font, however, are not protected and there have been many businesses over the years that made money copying popular fonts. Mind you, the quality of the copied fonts was generally pretty low...''</p>
      <p>does anyone know if this  statement is accurate.</p>
      <p>thanks again :)</p>
