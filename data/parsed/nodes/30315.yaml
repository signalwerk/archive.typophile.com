    html: |-
      <p>OK, this is an old thread, but one way to do this is inserting two hair spaces after the Drop Cap, then mark/select the second hair space, and give it a negative kerning of -700/-800 (depending on what letter).<br>
      In Quark you can do this the same way by inserting two ordinary spaces (but that can´t be done in InDesign.)</p>
