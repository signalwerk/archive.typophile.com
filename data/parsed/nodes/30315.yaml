    <p>Hi all, forgive me if this has been answered, but I couldn’t find it anywhere, I’m also new to Indesign.</p>
    <p>I’m just curious about the drop caps in Indesign, is it possible to do like the first example in my attachment without manually setting first line -10 indent and the rest of the paragraph +10 indent, and then forcing a hard linebreak to reset the indent for the rest of the text ?</p>
    <p>The old typographer in me cringes when I see the default result Indesign gives me.</p>
    <p>Henning.</p><div class="imageWrap"><img src="http://typophile.com/files/initial_6276.jpg"></div><p></p>
