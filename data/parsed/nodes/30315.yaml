    html: |-
      <p>I've always (since Quark 2) used negative manual kerning, paragraph return ("justify all lines") for the first line, and tabs for the next (two) lines. The reason I like tabs is that you can drag the setting and position it "by eye".</p>
      <p>I don't think there can ever be a fully-automated way to do this, as the side-bearings of characters vary considerably within fonts. And between fonts, some have negative sidebearings for A, others positive -- and there is built in kerning in some fonts as well.</p>
