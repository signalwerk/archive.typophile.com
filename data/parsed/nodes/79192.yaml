      <p>To comment on the mark -- I realize and appreciate it's a Möbius strip, but a twisted strip is pretty generic as far as its use in logos goes. Rogers has it, Microsoft uses it for various products, lots and lots of other logos have it, just flip through Logopond. It is just not distinct on its own.</p>
