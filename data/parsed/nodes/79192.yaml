    <p>Hello<br>
    First post here, I've been a long-time silent reader of these forums and I've always been impressed with the insightful, helpful critiques offered. So now I’d appreciate some feedback on the attached logo.</p>
    <p>The company is an analytical laboratory, dealing with a large variety of materials characterization, field services, consulting and litigation support, and most recently software design (really they’re all over the place).</p>
    <p>They wanted to simplify and refresh their previous logo, but still retain a level of professionalism and make it friendlier and approachable. The symbol references their involvement in all stages of the product life cycle, the 3 core business components, and is suggestive of a microscopy lens aperture. </p>
    <p>We've gone through many different iterations, and this is the final contender. Please let me know what advice you have.  Thanks much!</p><div class="imageWrap"><img src="http://typophile.com/files/RJLG_Logo_020711_5479.jpg"></div><p></p>
