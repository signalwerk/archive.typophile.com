      <p>I think the basic idea is sound enough, the two fonts used and their weights match reasonably, and the spacing generally is fine (although I would let the logo circle overhang the bottom edge a bit more, it's onptically centered a bit above the text... also perhaps space out the SC Sans a bit more).</p>
      <p>Two queries:</p>
      <p>1. Why all the different cases and sizes? Does the word "Group" have to be in small caps? Does the tagline? Does every word of the tagline have to be capitalised? CamelCase is very unfortunate visual effect.</p>
      <p>2. The logo - besides the rather common style - why the sickly primary-green colour? Also, look at the very different effect of the three counter spaces in the "circle" - the almost straight curve in the bottom-right hand corner, the flared one in the bottom-left, and the curve-meets-straight-line top-left. Maybe these can be made a bit more unified? Same with the shape of the "leaves" - the little one is curvy and bouncy, like a jumping fish, while the biggest one is practically sleeping in comparison.</p>
