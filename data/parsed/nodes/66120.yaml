    html: |-
      <p>though it’s not a connected script, BD Motra was based off the Honda Motra scooter’s militant stencil logo: <a href="http://www.typedifferent.com/2008/index.html" title="http://www.typedifferent.com/2008/index.html">http://www.typedifferent.com/2008/index.html</a><br>
      <a href="http://my.reset.jp/~inu/ProductsDataBase/Products/HONDA/MOTRA/MOTRA.htm" title="http://my.reset.jp/~inu/ProductsDataBase/Products/HONDA/MOTRA/MOTRA.htm">http://my.reset.jp/~inu/ProductsDataBase/Products/HONDA/MOTRA/MOTRA.htm</a><br>
      though not sure 80s is the vintage you’re looking for.</p>
      <p>otherwise I think of the Mods and fat tightly spaced Euro sans. </p>
      <p>Eurostile was Italian and of that era.<br>
      <a href="http://new.myfonts.com/search/eurostile/fonts/" title="http://new.myfonts.com/search/eurostile/fonts/">http://new.myfonts.com/search/eurostile/fonts/</a><br>
      Akira Kobayashi and Linotype reworked it<br>
      <a href="http://www.linotype.com/270780/eurostilenext-family.html" title="http://www.linotype.com/270780/eurostilenext-family.html">http://www.linotype.com/270780/eurostilenext-family.html</a></p>
      <p>I’ve seen a lot of Blippo and other Bauhaus/Bayer descendents attributed to the 60s Italian/French/British scooter scene<br>
      <a href="http://www.fontshop.com/search/?q=blippo&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=blippo&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=blippo&amp;x=0&amp;y=0</a><br>
      <a href="http://www.houseind.com/fonts/chalet/viewfonts" title="http://www.houseind.com/fonts/chalet/viewfonts">http://www.houseind.com/fonts/chalet/viewfonts</a><br>
      <a href="http://new.myfonts.com/fonts/victory/bayer-modern/" title="http://new.myfonts.com/fonts/victory/bayer-modern/">http://new.myfonts.com/fonts/victory/bayer-modern/</a><br>
      <a href="http://p22.com/products/bauhaus.html" title="http://p22.com/products/bauhaus.html">http://p22.com/products/bauhaus.html</a></p>
      <p>others, more straight sided condensed and dense sans:<br>
      <a href="http://www.houseind.com/fonts/housegothic23" title="http://www.houseind.com/fonts/housegothic23">http://www.houseind.com/fonts/housegothic23</a><br>
      <a href="http://new.myfonts.com/fonts/canadatype/gala/" title="http://new.myfonts.com/fonts/canadatype/gala/">http://new.myfonts.com/fonts/canadatype/gala/</a></p>
