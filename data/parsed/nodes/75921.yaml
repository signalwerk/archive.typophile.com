    <p>Hello there,</p>
    <p>I am pretty sure many/most of you have noticed DIESEL's amazing latest viral/campaign called 'Kick-Ass'. It's for their sneakers, not as big as 'Be Stupid' but still, so good!</p>
    <p>I'm thinking they must be using a form of Bodoni as 2nd font (for the supers under the main titles- Great for kicking asses). And the first font on the title (DIESEL Sneakers. Not Made For Running) kind of reminded me Ziggurat in the first place but it is not. Pretty Sheriff though...</p>
    <p>Does anyone know which are these 2 fonts used in the campaign? Below are some links of prints and videos. Thanks a lot in advance!</p>
    <p><a href="http://sphotos.ak.fbcdn.net/hphotos-ak-ash2/hs368.ash2/64656_10150294230165484_62659045483_15262006_2040495_n.jpg" title="http://sphotos.ak.fbcdn.net/hphotos-ak-ash2/hs368.ash2/64656_10150294230165484_62659045483_15262006_2040495_n.jpg">http://sphotos.ak.fbcdn.net/hphotos-ak-ash2/hs368.ash2/64656_10150294230...</a></p>
    <p><a href="http://www.youtube.com/watch?v=Cf7nCsZ0dDE" title="http://www.youtube.com/watch?v=Cf7nCsZ0dDE">http://www.youtube.com/watch?v=Cf7nCsZ0dDE</a></p>
