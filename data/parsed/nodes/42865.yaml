      <p>ID1/Win is always present in the name table. It is ID16/Win which will be added only if it differs from ID1/Win. (If you do not provide the compatible windows name in AFDKO, then the family name will go into ID1/Win rather than ID16/Win.)</p>
      <p>Actually, to some degree assigning font names is also a matter of taste. What you suggest doesn't look wrong, and there are fonts out there where ID4 is identical for Mac and Win. In general I would suggest to stick as close to common naming practices as possible, for the simple reason that they have proven to work.</p>
