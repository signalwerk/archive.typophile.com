      <p><cite>This implies that if ID4/Mac is supposed to be nice and readable, then ID4/Mac and ID4/Win need to differ.</cite></p>
      <p>In order to better understand font naming in otf fonts, I "scrupulously"  applied <a href="http://typophile.com/node/15485#comment-193430" rel="nofollow"><strong>Miguel Sousa's recipe</strong></a> with  <a href="http://www.adobe.com/devnet/opentype/afdko/" rel="nofollow"><strong>ADFKO</strong></a>'s  <code><strong>MakeOTF</strong></code> command on the ("scrupulously"  modified) Minion Pro Caption example Adobe provides. More precisely, I replaced  a few lines in the file <code><strong>fontmenunamedb</strong><code> by</code></code></p>
      <p><code><strong>[MinionPro-Capt]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;f=Familyname<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;s=StyleName<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;c=WinMenuName<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;c=1,MacMenuName<br>
      </strong></code></p>
      <p>(yes, literally) and then ran <code><strong>makeotf</strong></code>. I then applied <code><strong>ttx</strong><code> to the resulting otf font</code></code></p>
      <p><code><strong>&nbsp;&nbsp;ttx -t name MinionPro-Capt.otf</strong></code></p>
      <p>and, looking only at the namerecords for the Macintosh in the resulting file <code><strong>MinionPro-Capt.ttx</strong></code>, I saw this</p>
      <p><code><strong>&nbsp;&nbsp;nameID="1"&nbsp;&nbsp;&nbsp;&nbsp;Familyname&nbsp;<br>
      &nbsp;&nbsp;nameID="2"&nbsp;&nbsp;&nbsp;&nbsp;StyleName&nbsp;<br>
      &nbsp;&nbsp;nameID="4"&nbsp;&nbsp;&nbsp;&nbsp;Familyname&nbsp;StyleName&nbsp;<br>
      &nbsp;&nbsp;nameID="6"&nbsp;&nbsp;&nbsp;&nbsp;MinionPro-Capt&nbsp;<br>
      &nbsp;&nbsp;nameID="18"&nbsp;&nbsp;&nbsp;MacMenuName&nbsp;<br>
      &nbsp;&nbsp;nameID="256"&nbsp;&nbsp;Regular&nbsp;<br>
      </strong></code></p>
      <p>I then confidently :) installed the above <code><strong>MinionPro-Capt.otf</strong></code> font with <code><strong>FontInst</strong></code>. I am running OSX 10.4.11 on a PowerPC. For Word and Excel (Office 2004) the font is <code><strong>MacMenuName Normal</strong><code> as we can see here (with Word): </code></code></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/names30_6343.gif"></div><br>
      For <code><strong>textedit</strong></code>, <code><strong>XeTeX</strong></code> and even <code><strong>TeXShop</strong></code> (which is absolutely not opentype savvy, I can't even select a single word and make it bold), the font is of Family "Familyname" and Typeface "StyleName" as we can see here (with textedit):<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/names31_4018.gif"></div><br>
      I have failed to find a situation where <code><strong>ID4/Mac</strong></code>, namely the string <code><strong>"Familyname StyleName"</strong></code>, is used. Where is it ever needed to be "nice and readable".<p></p>
