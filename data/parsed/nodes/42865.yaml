      <p>Even more off-topic, but I am curious:</p>
      <p>You write -- <cite>I just tested more with XeTeX; ... and managed to select the font with either "Familyname" or "familyname StyleName"; both ID1/Mac and ID4/Mac can be used to identify the above font in XeTeX.</cite></p>
      <p>Since I never used TeX -- how exactly did you select fonts in TeX syntax? I am asking because ID1 alone may not be sufficient to identify a font since all styles of the same family share the same string in name ID1.</p>
      <p>Would you mind extending your test a bit? You could add "Win" to all Windows platform names, and "Mac" to all Mac platform names. (It's most reliable to do this adjustment in TTX: names with platform ID3 are Windows, and with platform ID1 are Mac. But do not change ID6.) And then again try selecting fonts in XeTeX with name ID1 or ID4, once with the Mac platform strings, once with the Windows platform strings.<br>
      I suspect that TeX, like most other applications, actually uses the Windows platform name records rather than Mac platform name records, so that the latter is not relevant at least for TeX.</p>
