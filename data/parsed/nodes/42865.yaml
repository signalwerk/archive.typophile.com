      <p><cite>here is a warning message thrown us by FontForge</cite></p>
      <p>Translating Mr Blokland's quote from the specs: In CFF-OT fonts, name ID4/Win, ID6/Win, ID6/Mac and CFF-Name-INDEX should be identical. This <em>implies</em> that if ID4/Mac is supposed to be nice and readable, then ID4/Mac and ID4/Win need to differ. Nothing to worry about. Looks like a unnecessary warning.<br>
      [ID4 = Full Name, ID6 = PS Font Name]</p>
      <p><cite>I also noticed that the old style numbers are labelled as “zerooldstyle”, not “zero.oldstyle”, etc. Does this create any problems?</cite></p>
      <p>Any problems with Adobe fonts so far?&nbsp;&nbsp;:)<br>
      In your own fonts however you should follow Adobe's naming recommendations.</p>
