    html: "<p>Hi Michel — slightly off topic, but since you are here and you replied to me on the Font Forge list about the curled quotes in XeLaTeX, the situation is this: the main call of a font using fontspec produces, for the font that is called, the correct curled quotes. But suppose later in the preamble you call another face from a different font with `\\newfontface\\blah…' that font will not have the quote marks curled correctly because this call does not apply the default language to this font. So lacking knowledge of the correct language it will leave the quotes as straight apostrophe quotes. Obviously there should be a way to tell the second font that is called what language it should be in: or if there is such a way, I haven't found it.</p>"
    html_clean: "<p>Hi Michel — slightly off topic, but since you are here and you replied to me on the Font Forge list about the curled quotes in XeLaTeX, the situation is this: the main call of a font using fontspec produces, for the font that is called, the correct curled quotes. But suppose later in the preamble you call another face from a different font with `\\newfontface\\blah…' that font will not have the quote marks curled correctly because this call does not apply the default language to this font. So lacking knowledge of the correct language it will leave the quotes as straight apostrophe quotes. Obviously there should be a way to tell the second font that is called what language it should be in: or if there is such a way, I haven't found it.</p>"
