    html: |-
      <p>I use TeX in my professional work as a Mathematician, but in my amateur roll as editor of a church newsletter, I've used every free-software program on Linux that's remotely suitable, including Scribus, OpenOffice, KWord, etc. I've put at least a couple months into using so that I can get the hang of how it works, and I've finally settled on TeX for this newsletter as well.  Since I've already gotten over the somewhat steep learning curve of TeX, I find the increased efficiency of doing all formatting from a text file where I never have to remove my fingers from the keyboard to be the best part about using TeX.  I like being able to type \begin{twocolarticle}... \end{twocolarticle} (after defining this environment) and knowing that the text will be formatted correctly. Of course, styles in more visually-oriented programs do the same kind of thing, but I've realized that what really makes the difference for me is not having to use the mouse.</p>
      <p>In projects such as a multiple-chapter church history, I like the relatively easy generation of structure: chapters, table of contents, footnotes, index, cross-references etc.  I'm sure there are professional products that do this kind of thing, but the tools available in OpenOffice or Microsoft Word are just so much harder to use (in my opinion).</p>
      <p>Finally, when I did a church photo directory, I liked the fact that it was easy to use a database to automatically generate the TeX code for each entry.</p>
      <p>Hope this helps.</p>
      <p>st</p>
