      <p><cite>I have failed to find a situation where ID4/Mac, namely the string 'Familyname StyleName', is used. Where is it ever needed to be "nice and readable".</cite></p>
      <p>Absolutely true.<br>
      If ID18/Mac <em>is present</em> in the name table, then application that I've tested will not show ID4/Mac nor identify a font by way of it. Exactly this is why -- <a href="http://www.typophile.com/node/17059#comment-251081" target="_blank" rel="nofollow">in another thread</a> -- I wondered if we couldn't forget about ID18/Mac and abbreviate name ID4/Mac right away; the effect might be the same.<br>
      If however ID18/Mac is <em>not present</em> in the name table, then ID4/Mac will be shown. You will have noticed that the MakeOTF manual, p.6, also says that 'c1=' (ID18/Mac) needs to be provided as soon as a 'c=' (ID1/Win) was defined (to divide a larger family into a bunch of Windows-compatible 4-style families); this means: in some cases <em>no</em> ID18/Mac is, nor needs to be, present in the name table.</p>
