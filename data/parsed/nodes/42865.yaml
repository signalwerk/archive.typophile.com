      <p><cite>I suspect that TeX, like most other applications, actually uses the Windows platform name records rather than Mac platform name records, so that the latter is not relevant at least for TeX.</cite></p>
      <p>Here are the values I gave to various IDs and yes means that XeTeX selected the font; </p>
      <p><code><strong>&nbsp;&nbsp;&nbsp;ID1/Mac&nbsp;&nbsp;&nbsp;Familyname&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;yes<br>
      &nbsp;&nbsp;&nbsp;ID4/Mac&nbsp;&nbsp;&nbsp;familyname&nbsp;StyleName&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;yes<br>
      &nbsp;&nbsp;&nbsp;ID6&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;MinionPro-Capt&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;yes<br>
      &nbsp;&nbsp;&nbsp;ID1/Win&nbsp;&nbsp;&nbsp;WinMenuName&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;no<br>
      &nbsp;&nbsp;&nbsp;ID4/Win&nbsp;&nbsp;&nbsp;MinionPro-Capt&nbsp;Win&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;yes<br>
      </strong></code></p>
      <p>For instance the input file containing the three lines</p>
      <p><code><strong>\font\test="MinionPro-Capt Win" at 48pt<br>
       \test Minion Pro Caption<br>
      \bye</strong></code></p>
      <p></p>
      <p>gave me the expected pdf output, namely "Minion Pro Caption" in 48 points.</p>
