    <p>here is a warning message thrown us by FontForge on opening up Adobe Jenson Light:</p>
    <p>"Warning: Mac and Windows entries in the 'name' table differ for the<br>
      Fullname string in the language English (US)<br>
      Mac String: Adobe Jenson Pro Light<br>
      Windows String: AJensonPro-Lt<br>
    The 'size' feature of this font conforms to Adobe's early misinterpretation of the otf standard"</p>
    <p>I also noticed that the old style numbers are labelled as "zerooldstyle", not "zero.oldstyle", etc. Does this create any problems?</p>
    <p>Again, I'm wondering if there are things wrong here that I need to try to correct.</p>
    <p>thanks </p>
    <p>El.</p>
