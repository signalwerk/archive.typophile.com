      <p>I also use LaTeX for typesetting mathematics. One great asset of LaTeX is the packages that people have contributed to it. If you need to write a multilingual text and hyphenate each language correctly, the babel package gives you simple macros you can call to do it. LaTeX is great when it (edit: i.e. the text to typeset) gets technical but sometimes even then I wonder: for instance, there is a package called <a href="http://www.ctan.org/tex-archive/macros/latex/contrib/ledmac/" target="_blank" rel="nofollow">ledmac</a> (see also <a href="http://www.djdekker.net/ledmac/" target="_blank" rel="nofollow">http://www.djdekker.net/ledmac/</a>) for typesetting critical editions. Here is grab from an output using the sample file villon.tex; I used XeLaTeX with Adobe Garamond Pro and a custom single substitution to get Q.alt instead of Q (and threequartersemdash instead of emdash).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/xevillon_3836.jpg"></div><br>
      When I look at some of the .tex source examples, I wonder if there is no other tool able to handle footnotes and margin notes that would make life easier, but I confess I know nothing of critical editions.<p></p>
