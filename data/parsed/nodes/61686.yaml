    html: |-
      <p>Well, of course there are are fonts for the Devanagari script (in which the Hindi language—among others—is written). There are fonts for all of the common Indic scripts. There are also Indian type foundries running in India, too. I can think of at least two (C-DAC, which you might argue is more an institution than a foundry and Modular Infotech). I've had the privilege of being able to visit Modular Infotech and the company has something like 50 employees and a network of designers that they buy letter designs from. Of course, this company is not really known much outside of India. Maybe it is because they wrote all their own font design software, make their fonts with that, and primarily sell the fonts along with the necessary typesetting software to use them properly. This means that they run along a different track than most of us in the type and font business.</p>
      <p>Most of the Indic fonts in use are not OpenType fonts, however. This has many reasons behind it. One of them is the reality of the software market at present…</p>
      <p>The Indian Type Foundry's press release is definitely right about the lack of design software that supports the OpenType features necessary for Indic fonts. Adobe CS4 has a work-around to support them (finally!), and there are 3rd party plug-ins that one can buy. But this is not real support. Microsoft Word has real support for Indic script OT fonts, but that is not a design application.</p>
      <p>By "first," I expect that they mean that they are the first type foundry in the way that we envision font makers in the west. This is a company of good designers who make good fonts, and market these good fonts to graphic designers, who will use them in their work. A lot of the traditional customers of Indic fonts have been software developers, publishers, and newspapers. Graphic Design seems to be becoming really huge in India, and this makes Indian graphic designers it quite a market to be addressed. In Indian design using English and the Latin script, many customers want the best and the most popular fonts, just like designers all over the world do. It is difficult for these designers to find fonts of the same quality for their own languages and scripts. I suspect that ITF wants to make this difficulty less difficult ;-)</p>
