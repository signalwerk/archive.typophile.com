      <p>Thanks Dan, that is right.</p>
      <p>Of course digital Devanagari (and other Indic) fonts existed before, they are both made in the West and in India. There are some fantastic designs made. In both cases, they have been primarily made to support software, and in India, fonts were often application specific. By producing Unicode compliant fonts ITF hopes to make it less dependent on software &amp; hardware, so documents can be as interchangeable as we are used to in the West.</p>
      <p>There are also wider, educational, intentions of ITF, and right now we are preparing outlines for the next steps. We would certainly like to create a community that can also create lively discussions about Indian typography. Dan, I will write you directly about this soon.</p>
