    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20140911210440im_/http://typophile.com/files/typ_itf_logo_5330.png"></div> <p></p>
    <p><a href="/web/20140911210440/http://typophile.com/wiki/Peter%20Bilak" class="freelinking" rel="nofollow">Peter Bilak</a>, The Netherlands, and <a href="/web/20140911210440/http://typophile.com/wiki/Satya%20Rajpurohit" class="freelinking" rel="nofollow">Satya Rajpurohit</a>, India, have launched the <a href="/web/20140911210440/http://typophile.com/wiki/Indian%20Type%20Foundry" class="freelinking" rel="nofollow">Indian Type Foundry</a> (<a href="https://web.archive.org/web/20140911210440/http://www.indiantypefoundry.com/" rel="nofollow"> </a><a href="https://web.archive.org/web/20140911210440/http://www.indiantypefoundry.com/" title="http://www.indiantypefoundry.com">http://www.indiantypefoundry.com</a> )to focus on Indic typefaces. Their inaugural font family extends Peter's classic sans typeface family <a href="/web/20140911210440/http://typophile.com/wiki/Fedra" class="freelinking" rel="nofollow">Fedra</a> to the <a href="/web/20140911210440/http://typophile.com/wiki/Hindi" class="freelinking" rel="nofollow">Hindi</a> alphabet.</p>
    <p>From this mornings' press release:</p>
    <p><em>The Indian Type Foundry (ITF) is the first company to develop and directly distribute digital fonts in India. ITF was initiated by Peter Biľak of Typotheque in partnership with SN Rajpurohit and Rajesh Kejriwal (Kyoorius Exchange). “Rajesh has been incredibly active in bringing the Indian design community together. He has created the first Indian design magazine and first Indian design conference, and been a catalyst behind many collaborative projects in India”, says Peter Biľak. “That’s why I was very pleased that Rajesh agreed to join us to create ITF. And I have worked with the very talented Satya Rajpurohit for the past two years on Fedra Hindi, our first typeface specifically designed for the Indian market.”</em></p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20140911210440im_/http://typophile.com/files/typ_itf_hindi_4049.png"></div><p></p>
