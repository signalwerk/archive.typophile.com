    <p>Hey all, </p>
    <p>Still kind of new here so please excuse my amateur questions. But there's a couple things I'm wanting to do.</p>
    <p>We do a lot of engraving on a router where I work. And this is mainly just me being curious. Is there a way in FontLab or anything other building tool, to design a single line typeface, so that it keeps the same stroke width through different point sizes?</p>
    <p>For example, at 72pt, the typeface will appear thin, but when dropped down the say 6-8pt, the typeface will appear heavier. What I would like to do be able to do is start designing a font family for different size engraving bits, as well as Regular, Condensed, Expanded variants.</p>
