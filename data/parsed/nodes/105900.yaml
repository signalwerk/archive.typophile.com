      <p>The simple method would be to create different fonts for each size, mostly by interpolating between the extremes. You could base the fonts on skeletal paths, applying different amounts of stroke value (Contour &gt; Paths &gt; Make Parallel Path in FontLab) according to target size.</p>
      <p>The more difﬁcult method would involve metafont technology, although it is potentially the most elegant solution.</p>
