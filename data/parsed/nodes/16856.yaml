    <p>Hi,</p>
    <p>In BezierMaster, what is the purpose of the two red double-squared boxes in the Character Edit Window? I notice that their size is apparently fixed, even if one scales the actual glyph. If the answer to this is in the documentation, I apologize for missing it-)</p>
    <p>Related question: Is there any word on when DTL FM 2.5 will  be released? The website says Summer 2005 which just _cannot_ be right-) </p>
    <p>I'm still trying to understand what makes DTL FM so special (and expensive) compared to Studio5. What am I not getting?</p>
    <p>Thnx for your patience with all my "green" questions!</p>
    <p>Best<br>
    Idris</p>
