    <h2><a href="/node/43570" title="Randomized Comic Lettering Font - Code help needed">Randomized Comic Lettering Font - Code help needed</a></h2>   <p>Greetings Typohiles!</p>
    <p>I have been lurking this forum for quite awhile and now that I have run into a serious fontmaking problem myself I could think of no better people to turn to than the Typophiles.</p>
    <p>So here is my project: this is part of my final thesis, so I am pretty desperate in making it work. The basic idea behind it all is create a font that will—via script–generate the outlines of each glyph that is typed. So if a user were to type one line, erase it and then type the same line afterwards, the glyphs would come out completely different.</p>
    <p></p><div class="imageWrap"><img src="/files/aaaargh_4846.png"></div><p></p>
    <p>This is why the working title for this font is “Aaaargh!!”.</p>
