    <p>Hi there! I am a graphic design and advertising student working on a corporate identity project.</p>
    <p>I am currently working on a littering campaign assignment for a state government. The rational behind the campaign is that litter starts small, and as it accumulates becomes a big problem, therefore, one should stop littering as to not start a mass mess.<br>
    P/s: Brochure will be a door fold and is still under construction, as such part of it still needs more text. Contributions on your view on littering is greatly appreciated as with the design/typographic side of it.</p>
    <p>Also, the criteria for the assignments include application of the campaign onto a minimum of 8 different medias, therefore, any media suggestions would be great too. :)</p>
    <p>As of now, i plan to do:<br>
    Print Adverts<br>
    Billboards<br>
    Advertorial<br>
    Brochure<br>
    Dustbin (?)<br>
    Plastic Bag (Not really turning out too well for me. =/)<br>
    Ambiance (ideas needed.)<br>
    Stickers (to be stuck on random stuff that could be litter/ or to remind people to not litter that item) (?)</p>
    <p>Thanks in advance guys! =)</p>
