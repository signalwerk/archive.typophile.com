    html: |-
      <p>Sometimes you will find fonts that have a "cameo" (reversed) weight... For example,</p>
      <p><a href="http://new.myfonts.com/fonts/aviation/fiendstar-cameo/" rel="nofollow">Fiendstar Cameo</a></p>
      <p><a href="http://new.myfonts.com/fonts/facetype/blitzplakat/" rel="nofollow">Blitzplakat</a></p>
      <p>However, be warned that searching for the term "cameo" on a font website will bring up fonts called Cameo as well as fonts with cameo (reversed) weights, and even some fonts with no reversed weight at all! So you will need a bit of patience...</p>
      <p>For example, here is <a href="http://www.fontshop.com/search/?q=cameo&amp;x=0&amp;y=0" rel="nofollow">a search for "cameo" on FontShop's site</a>.</p>
      <p>A <a href="http://www.fontshop.com/search/?q=reversed&amp;x=0&amp;y=0" rel="nofollow">search for the term "reversed" (on the same site)</a> also yielded some results.</p>
      <p>I hope this helps!</p>
