    <p>Hi All</p>
    <p>I am working on a project that requires a highlighted font.</p>
    <p>like </p>
    <p><a href="http://new.myfonts.com/fonts/fontfont/ff-dynamoe/" title="http://new.myfonts.com/fonts/fontfont/ff-dynamoe/">http://new.myfonts.com/fonts/fontfont/ff-dynamoe/</a></p>
    <p>It needs to be repeated on screen by an editor hundreds of times, so cant manualy draw the box behind it.</p>
    <p>Basically looking for a sans serif, similar to </p>
    <p><a href="http://new.myfonts.com/fonts/hamburger/neutraliser-sans/" title="http://new.myfonts.com/fonts/hamburger/neutraliser-sans/">http://new.myfonts.com/fonts/hamburger/neutraliser-sans/</a></p>
    <p>I guess my other possibility would be to edit a font in Font Lab myself. Just wondering if anyone had undertaken something similar?</p>
    <p>Cheers</p>
    <p>Duncan</p>
