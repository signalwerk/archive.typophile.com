      <p>The Unicode "standard" is nthing more than an inventory. It lists symbols that a comity identifies and creates code pages that are supposed to fit all cases.</p>
      <p>Unfortunately, there are as many forms for a given sign as there are culture using it. Years ago, I had to devise a Baltic character, and they said my ogoneks were not right. As it turn out, what I took for an okonek was a "pauckiuska", an it looked more like a tear than an angular beard.</p>
      <p>The  adjunction of "private characters" is good, though, because for the firt time, it allows the creation, of variation of a character, witout highjacking another font slot. It also lifts the limit of displayable glyphs in a font.</p>
      <p>More curious is the immplementation, of the keyboartd in Mac OS Lion : you press the key, say "o". AZ pop up menu appear, letting you select the accept you want.No implementation of any kind of WGL4 (which was the case in Snow Leopard). Beuh.</p>
      <p>Fonts forever</p>
      <p>Michel Bujardet<br>
      <a href="http://www.fontmenu.com" title="http://www.fontmenu.com">http://www.fontmenu.com</a></p>
