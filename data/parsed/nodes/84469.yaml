    <p>I'm familiar with the purpose of the Adobe Sans and Adobe Serif multiple master fonts (to stand in as fallback substitutes for other missing fonts), and even know about the <a href="http://www.flickr.com/groups/adobesansmm"></a>Flickr group to document sightings in the wild, but I'm curious to learn more about their history.</p>
    <p>Does anyone know who actually designed the fonts? Were they first introduced with Adobe Type Manager? What kind of license are they distributed with by default? I've poked around for info online, especially here on Typophile, but haven't found much.</p>
  html_clean: |-
    <p>I'm familiar with the purpose of the Adobe Sans and Adobe Serif multiple master fonts (to stand in as fallback substitutes for other missing fonts), and even know about the <a href="http://www.flickr.com/groups/adobesansmm" class="link-external"></a>Flickr group to document sightings in the wild, but I'm curious to learn more about their history.</p>
