      <p>Thanks so much for sleuthing around for the answers, Frank. I'm assuming you got the info from some longer-standing Adobe staff members?</p>
      <p>Though most designers groan at the sight of these fonts (after all, seeing them does usually mean something has gone wrong) I must say that the problem they solve is an interesting one. As you mentioned, they were purposefully made to be generic, but I think a lot of creativity still went into their design to get them to work as intended. Indeed, if they hadn't done a minimally reasonable job with the design, we probably wouldn't be seeing so many examples where the fonts make it out into the wild :)</p>
      <p>As for the license, I'd be surprised if the legal team at Adobe didn't cover these fonts with some section in the EULA about bundled software or something like that.</p>
