    html: <p>I've heard several times about how extreme the requirements for these fonts were. They had to be able to stand in for everything from the fattest, widest font designs to the most narrow and thin. If you've ever seen them getting used as a substitute for one of these extremes, you probably thought they looked terrible -- but the point is that they serve a dynamic range far outside the limits of what most designers consider when making an MM typeface.</p>
