      <p>Nick,<br>
      here are the bits I found out so far:</p>
      <p>Adobe Sans and Serif were originally introduced with Acrobat, to serve exactly the purpose you’re describing above. While the fonts were not yet ready for the 1st release of Acrobat (instead, a MM version of Myriad could be found in there), they finally came with Acrobat version 2 (1994).<br>
      The fonts were designed by Fred Brady, but also Jim Wasco has done some work on the family.<br>
      Probably the name of a designer didn’t stick, as the fonts had to be as anonymous and as generic as possible. Also, the design concept being so constrained (having to cover everything from thin to black, condensed to wide) did probably not allow for a lot of creative involvement.</p>
      <p>The fonts have not been modified in a long time, and still do their job (using MultipleMaster technology) in the latest version of Adobe Acrobat.<br>
      AFAIK, there is no license for them, and I guess using them outside Acrobat might be too difficult for most people anyway. :)</p>
