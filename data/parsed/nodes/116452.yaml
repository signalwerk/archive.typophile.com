      <p>What Hrant is referring to is a calligrapher, someone who uses a pen to produce fine quality documents.</p>
      <p>The term letterer usually refers to someone who fills in the word balloons in a comic.</p>
      <p>Unlike Hrant, though, I was not sure from your original post that you were, in fact, looking for a calligrapher. I thought that it was also possible you were looking for a typographer who used script typefaces to create an effect similar to calligraphy.</p>
