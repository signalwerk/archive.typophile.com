    html: |-
      <p>As far as my normal usage of the terms goes:</p>
      <p>Calligraphers write letters.</p>
      <p>(Hand) Letterers draw letters (in the context of a specific piece of text).</p>
      <p>Type designers draw letters (to be reproduced in many texts).</p>
