    html: |-
      <p>it’s Ale Paul’s Burgues Script, but with heavily modded uppercase letters. some of them may even be taken from other typefaces. the roman numerals are also custom.<br>
      but if you take a look at the <a class="freelinking external" href="http://www.veer.com/download/pdf/burguesscript.pdf" rel="nofollow">PDF</a> you will recognize the lowercase characters, especially the alternate ones like the ”t“ and the ending ”r“ used in ”Carter“.</p>
