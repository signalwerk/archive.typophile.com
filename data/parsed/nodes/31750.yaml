  html: |-
    <p>Hi all,</p>
    <p>Looking for some recommendations for a body font for promotional material I am designing for a new play. The play is a science fiction piece, with strong female central characters and feminist themes. I was looking at <a href="http://www.myfonts.com/fonts/dooleytype/chennai/">Chennai</a>, but some of the characters dont look too well drawn to me, and I was wondering if this was a knock-off of something else, or if there is a better font available in this same vein.</p>
    <p>Doesn’t necessarily need to be sans serif, but I think sans may be best to communicate a “futuristic” feel.</p>
    <p>All suggestions are appreciated!</p>
