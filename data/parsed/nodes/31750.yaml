      <p>Other possibilities (thanks to FontBook): <a href="http://www.myfonts.com/fonts/processtype/klavika/">Klavika</a>, <a href="http://www.myfonts.com/fonts/fontbureau/stainless/">Stainless</a>, <a href="http://www.myfonts.com/fonts/processtype/stratum2/">Stratum 2</a>, <a href="http://www.myfonts.com/fonts/agfa/zemestro/">Zemestro</a>, and <a href="http://www.myfonts.com/fonts/emigre/triplex/">Triplex Sans and Serif</a>. However, I’m not positive if any of the typefaces that have been mentioned by Lex and I would be terrific for extended reading, though they might be fine for your short promotional text.</p>
      <p>Edit: Forgot the link to <a href="http://www.myfonts.com/fonts/emigre/triplex-italic/">Triplex Italic</a> — otherwise you might have thought Triplex was italic-less.</p>
