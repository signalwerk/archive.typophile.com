    html: <p>I have one dingbat font that's got the five landmasses, each as a glyph in the W, O, R, L, and D spots. It's made to some level of detail but only from straight line segments because Eurasia keft crashing RF. They are fit together if you type the wor(l)d. Also, with separate land masses, kerning does the plate techtonics thing pretty well. The font's not for sale, but itrade...</p>
