    html: <p>...anyways, today I got the answer straight from the publisher and the typeface is called Nordling. It's available from Berthold (<a href="http://www.bertholdtypes.com" target="_blank">www.bertholdtypes.com</a>). <br> <br>I too was going nuts trying to find it.. the closest I could get was Fournier.</p>
