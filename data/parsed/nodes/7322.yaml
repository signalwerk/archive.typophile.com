    html: <p>I know the feeling! I have been hunting everywhere. It resembles <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000057" target="_blank">Dolly</a> (Underware) and has some features like Plantin's serifs, but I can't find a match.</p>
