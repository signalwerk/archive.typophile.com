      <p>This looks like it's going to be a fun wedding!</p>
      <p>Re: letterpress -- I just was thinking that whats en vogue for wedding letterpress is a very deep impression for the "tactile" feel. If that is the case, i'd expect non-distressed fonts will be fine with phaeton since the overall feeling will be crafty anyways.</p>
      <p>Re: hideousness -- well, quality paints do not a painter make. I would be curious if you do remember the title.</p>
      <p>Nick, yes on the buggy. But they stole the name from the greek pantheon. Phaeton was the son of Helios. When he borrowed the keys to dads chariot he burned rubber a little too close to earth and Zeus smoked him with a thunderbolt. I've seen Phaeton, Phaëton and Phaëthon and indeed: Phæton -- but i can't speak to the correctness.</p>
