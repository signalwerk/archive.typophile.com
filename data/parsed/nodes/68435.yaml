      <p>Thanks for the help! (My brain was stuck and I just needed a bit of help to dislodge it)</p>
      <p>Randy — Great suggestions! (Of course, what else could I expect from the font's co-creator?) I love all these options; now I have lots of leads to follow. Once I get closer to designing the invitation I'll know more about what I want from the font and I'll be able to make a better decision then.</p>
      <p>I will be letterpressing these myself at a local studio where I can rent press time. Were there options you think I could explore, since I'm letterpressing them, that you didn't mention above?</p>
      <p>I'll attach the save the date as a pdf above as well, so you can see how I've used (and possibly abused) Phaeton.* It's not finalized — I'm still monkeying around with the top bit — so suggestions on that are welcome as well.</p>
      <p>-<br>
      <em>penn</em></p>
      <p>*Sidenote: incidentally, while scanning the new releases at borders the other day, I saw a rather hideous usage of it. It was stretched and curved so that I could hardly recognize it, but I'm certain it was Phaeton. If I can remember what book it was I'll be sure to send it along.</p>
