    <p>I'm currently working on a wedding save the date for my friend and will soon be working on the invites. The save the date card uses all Phaeton as it's fairly simple with larger text. The invites, however, will have much more information and I'm thinking Phaeton won't be the most readable text font. As such, I was thinking of using it for the main titles and larger text and trying to find a suitable text font for the smaller stuff. </p>
    <p>The feel of the wedding as best I can describe it will be organic, southern (American), elegant, old fashioned, yet modern. </p>
    <p>Here is the link to Phaeton: <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000447" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000447">http://www.veer.com/products/typedetail.aspx?image=UMT0000447</a> </p>
    <p>The save the date is actually similar in feel to the specimen there.</p>
    <p>Any and all suggestions are welcome. Thanks</p>
    <p>-<br>
    <em>penn</em></p>
