      <p>Hi Penn,</p>
      <p>First, thanks for licensing Phaeton. I'd love to see the invites when they're done.</p>
      <p>As for pairing suggestions:<br>
      If you are printing letterpress, then I think you have more options. If not, consider using a subtly distressed font to match. Check out <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000054">Olduvai</a> which has a similar finish and works well for text. Also, take a look at <a href="http://www.veer.com/download/pdf/phaeton_guide.pdf">the users guide for Phaeton</a> and contact me through typophile if that text companion would suit your needs (it has bold, italic and bold italic also). </p>
      <p>These quality options might work well:<br><a href="http://www.ms-studio.com/FontSales/metallophilesp8.html">Metallophile (a rough futura) would be great I think</a><br><a href="http://iginomarini.com/fell/the-revival-fonts/">The (free) Fell types from Igino Marini</a> would also compliment well I think.</p>
      <p>These grouping at FontShop may also get your brain going:<br><a href="http://www.fontshop.com/fontlist/genres/distressed_text_serif/">http://www.fontshop.com/fontlist/genres/distressed_text_serif/</a><br><a href="http://www.fontshop.com/fontlist/genres/distressed_sans_serif/">http://www.fontshop.com/fontlist/genres/distressed_sans_serif/</a></p>
      <p>Cheers,<br>
      Randy</p>
