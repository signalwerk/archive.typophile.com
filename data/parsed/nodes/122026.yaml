    html: |-
      <p>Hmmm, I didn't notice that only the regular and italics were finished.  I guess that I just assumed there would be at least a regular, bold and italics of each. So no, I wouldn't release anything that might pass as a text face without the bold weights. A display face, maybe, but it would depend.</p>
      <p>As for the heavy, light, thin, medium, demi, condensed, expanded or whatever, I don't think it's as important to release them all at once. It's true that purchase decisions are often made on how many variants are in the family (at least I do). Even if  buying only the bold and italic, I'll want to know that more flexibility is an option if needed down the road.</p>
      <p>That said, assuming regular, bold and both italic weights are available, and if a bigger family isn't in the offing for a year or so, I'm not sure it's as big of a concern. Sure, a few sales would be lost by releasing only a partial family, but they'd also be lost by holding off.</p>
      <p>I'm making a similar decision myself, I'm just finishing up the four base fonts in a family, but plan on building both heavy and light versions. With close to 800 glyphs in each, the thought of waiting versus seeing some sort of return on all the work is a tough one. I seem to be learning more toward holding off, though — for all the reasons mentioned in my previous post.</p>
