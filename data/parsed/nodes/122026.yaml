  html: |-
    <p>I'm designing a huge, multi-script sans serif family with true italic. At the moment I've almost finished the regular and started the italic. The thin and black masters are also at the very beginning. The question is—should I release and start selling regular and italic and later add other weights later (this is better for me) or wait and release the whole family (this, I think, would be more fair for customers).</p>
    <p>What would you do? I've seen both release models on MyFonts and I'm not sure which one to choose.</p>
