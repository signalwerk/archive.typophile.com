    html: |-
      <p>Once you release part of the typeface, it pretty much locks you into the design. Six months from now, as you're working on the other weights, you'll be kicking yourself for not having made the bowls rounder or the corners sharper or the descenders shorter or whatever -- only it'll be too late to change it.</p>
      <p>Then again, putting what you have out there now will give you some insight into whether or not it's worth the effort to create all those additional variations in the family.</p>
