    html: |-
      <div class="comment-spam-body"><blockquote><p>Then again, putting what you have out there now will give you some insight into whether or not it's worth the effort to create all those additional variations in the family</p></blockquote>
      <p>Not necessarily. I can imagine a lot of typefaces aren't purchased simply because they lack weights and styles. For example, unless it's for display use I have no use for a typeface that only consists of Regular and Italic. I've never purchased a non-display typeface that lacks a bold weight. I can imagine the more fonts the typeface features, the higher the potential that it will sell.</p>
      <p>I'm actually in a similar situation. I designed two typefaces of 3 weights each. I have the design for the italics ready but haven't turned those into fonts yet except for Light Italic, which is not done yet. I currently have other things to work on so it may take some months before the italics are added. Both typefaces are related though, so finishing the italics for one of them means most of the work is done for the other as well.</p>
      <p>Added to the situation is the fact that one of these typefaces was for a client and he has exclusivity on it for a year. I haven't been payed for the exclusivity agreement though (at the time I thought it was standard that the client who pays for the design has exclusivity for a while, or he would be spending a lot of money on a design that is going to be available to others for little money) and no contract was made for such an agreement, but I don't want to be unethical so I'm sticking to the agreement. But this does mean that if I would like to release both typefaces together—which seems to be the best choice—I will have to wait one more year. This gives me the time to finish the italics, but I don't like the fact that three of my fonts are just catching dust. Six fonts if you consider that there is no official agreement on the exclusivity deal.</p>
      </div>
