    html: <p>If you are referring to the 'click to see bigger picture' type of behavior that opens a large image on the page itself, that's going to be what is commonly called 'lightbox'. There are various scripts out there to accomplish this. If you're using jQuery, there's the 'thickbox' clone.</p>
