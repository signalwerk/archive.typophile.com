      <p>Dude.</p>
      <p>Don’t.</p>
      <p>No unrequested windows, save for rare edge cases like help windows (which by definition aren’t unrequested). They’re user-hostile (in fact a usability disaster), the mark of an assholish and incompetent Web developer, and, for good measure, a WCAG violation.</p>
      <p>Next you’ll be asking us for help typesetting a novel in Arial.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
