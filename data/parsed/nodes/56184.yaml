    <p>Can't seem to find this anywhere, and don't know if it can be done.</p>
    <p>BUT I feel like I've seen it.</p>
    <p>Any web people know if there's a way in Javascript or something to have a popup window appear in the main page?</p>
    <p>I found a rollover popup, but that isn't very good.</p>
    <p>Thanks so much.</p>
