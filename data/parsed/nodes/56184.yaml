    html: |-
      <p>The big problem is really the definition of what a "new window" is. Using the standard desktop browser scenario, it's easy to understand that it opens a separate instance of a browser window. But when you're using a handheld device, or a screen-reading device, or a text browser, what consists of a new window? Your design needs to account for that.</p>
      <p>Old-skool pop up windows <em>can</em> serve certain specific purposes, but it should be as Joe said not "unrequested". As long as the user has a choice, or isn't forced into opening a new window, they can be used.</p>
      <p>Given what you are asking for, which isn't very specific, the more specific term that aluminum is speaking of is technically known as a "modal window" and can, and should be, quite accessible. Lightbox, Thickbox, Greybox, they're all just different implementations of a modal window that doesn't open a new instance of a browser window. All simply display a part of your page that already exists, or is requested through AJAX, and hopefully all information is otherwise accessible to those not using javascript. </p>
      <p>Hope you find what you're looking for!</p>
