      <p>I really like what you have ... the print identity is nicely complemented by the online presence. You've created a wonderful feeling of trust and professionalism, through the efficient use of type, image, and color. (And solid verbiage.)</p>
      <p>I really like your logowork, most of all the fenceworks logo. :)</p>
      <p>The only thing that stood out was the picture of yourself, and the inclusion of your child. I have two kids so I understand the pride of being a father. But in my very humble opinion, I don't think that you need a kid picture. To me, it makes it seem like you are juggling design while changing diapers. And maybe you are. Some clients might like that, others may not. I'm sure others have a differing opinion on this. Anyway, that is my only quibble in what is an otherwise fantastic print/online combo. Congrats!</p>
