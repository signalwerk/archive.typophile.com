    <p>When I struck out on my own earlier this year, I was forced to rapidly create a business card and logo to drum up new business. I have since tried to base my other materials on that card (well, other materials being my website and invoices) and I'm now considering revising and putting more thought into my needs -- I'm a one-man studio working in print, logo, and interactive design.</p>
    <p>Anyway, here are samples of my current business card and invoice, as well as <a href="http://addisonhalldesign.com" rel="nofollow">my website</a>. I'd like other professional opinions as to whether or not I should proceed with changing or live with what I have. Any and all suggestions are welcome. Thanks.</p>
