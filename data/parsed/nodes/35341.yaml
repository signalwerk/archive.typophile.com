      <p>Faust IV is usually my suggestion for someone new to the genre. I’ve got little tolerance of guitar noodling. It is the pop sensibilities that shine through for me.</p>
      <p>I often read that Wayne Kramer was highly influenced by Faust. Not surprising.</p>
      <p>I’ve got a few of the Comic Jokers repressings that I appreciate as graphic design objects.</p>
