      <p>Get a bigger sample of covers. Look at Hawkwind, Amon Düül II, Faust, Can, Ash Ra Tempel, etc. You will find much diversity in the work. Remember that this music sprang from a reverence for the velvets not American blues.</p>
      <p>If you can find a copy of Julian Cope’s Kroutrock Sampler take a look at that. It has lots of covers.</p>
      <p><a class="freelinking-external" href="http://www.amazon.com/Yeti-Amon-Duul-II/dp/B0009LNRLE/ref=pd_sim_m_1/105-4287604-9198064">Yeti</a> is one of the classics and it is pretty clean.</p>
