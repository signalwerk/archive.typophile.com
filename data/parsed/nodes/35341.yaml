    <p>I’m lost in space and need some cosmic vibes...<br>
    Hopefully someone can help by<br>
    suggesting a typeface to a prog-rock cover I need to<br>
    make a concept for.<br>
    The client has supplied the attached image<br>
    and if referring to the type at the top and the bottom.<br>
    But the cosmic type in the middle is amazing!</p>
    <p>Can anyone suggest a suitable face?</p>
    <p>Thanks in adavance</p>
    <p>Mr Brown</p>
