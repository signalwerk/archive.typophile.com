    <p>Are there any Type jokes?? </p>
    <p>I made one up...</p>
    <p>Two letters and a comma walk into a bar.</p>
    <p>Bartender says: Hi, what can I getcha?</p>
    <p>First letter says: Beer.<br>
    Second letter says: Me too, what ever you've got on tap.</p>
    <p>Comma says: Yeah, ah, well, umm, hmm,,,</p>
