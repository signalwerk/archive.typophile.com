      <p>I don’t know who designed Monotype’s Old English. Someone in England or the states, though. Have you tried contacting Monotype directly? My bet is that it is an old Stephenson Blake, Caslon, or some other English foundry type.</p>
      <p>“Old English” is English Textura. Its roots go back to Wynken de Worde. Most of the fonts that we think of as “Old English” though are are ca. 1820s American lettering designs, or ca. 1890 English, late/Victorian historicist creations. I don’t always consider them “real” blackletters… but that is just my opinion!</p>
