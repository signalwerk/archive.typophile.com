      <p>I don’t know about the relationship between Monotype Old English and Cloister Black.</p>
      <p>I do know that Cloister Black was a 1904 ATF design variously credited to Morris Fuller Bention or Joseph W. Phinney (though sources for the latter are stronger). It is a very similar but arguably inferior adaptation of Caslon Text (which I will not presume was necessarily a true Caslon face - c.f. Caslon Antique, a Caslon in name only for sales purposes).</p>
      <p>I also see that Mac McGrew shows that there was a Monotype metal version of Cloister Black. This confuses me, because AFAIK cross-licensing was not normally done back then between ATF and the automation companies (Mono, Lino).</p>
      <p>Brief geneological note: Both Joseph W. Phinney (1848-1934) and I are descended from John Phinney (1638-1718?) whose father John Finney arrived in America around 1638-39, along with his mother. John Jr married Mary Rogers, whose family had come over on the Mayflower. The patrinomial lineage can only be traced back to the 1500s, in Lenton, Nottinghamshire, England (a small village just outside Nottingham).</p>
      <p>Cheers,</p>
      <p>T</p>
