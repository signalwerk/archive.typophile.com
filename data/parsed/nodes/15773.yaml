    <p>Can anybody give me info about ’Monotype Old English’ designer/s?<br>
    In the book ’Treasures of the British Library’ I’ve found a certain similar features in the english approach to black letter.<br>
    Was Old English inspired in some particular manuscript or sample?</p>
    <p>Thanks in advance.</p>
