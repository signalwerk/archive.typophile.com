      <p>The Early Gothic script had evolved into angular  known as Textura Quadrata (Old English* &amp; Black Letter)   and Textura Prescisus (Black Letter)  — used for both secular &amp; religious book text. </p>
      <p>Samples: - 13th century Windmill Psalter<br>
                     - The Metz Pontifical</p>
      <p>* “Old English, if it means anything, indicates that this letter was also used in England during Gothic times. As an amusing commentary it may be mentioned that the Gothic letter, in its own time, was known as ’littera moderna’  — A. Nesbitt</p>
