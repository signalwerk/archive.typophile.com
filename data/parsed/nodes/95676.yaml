    html: |-
      <p>A basic error:</p>
      <p>"The name of a kerning class must start with an underscore (e.g. _a)."</p>
      <p>and</p>
      <p>"Each kerning class and each metrics class must have exactly one key glyph defined –this is done by following one of the glyph names in the glyph definition by the quotesingle (') character. The key glyph acts as a “representative” of the class."</p>
      <p><a href="http://www.fontlab.ch/downloads/manuals/FLS5WinManual.zip" title="http://www.fontlab.ch/downloads/manuals/FLS5WinManual.zip">http://www.fontlab.ch/downloads/manuals/FLS5WinManual.zip</a></p>
      <p>PS If you use a .fea file/format, it should be something like this:</p>
      <p>@_a = [ a  aacute ];</p>
      <p>NB the double space after the "a".</p>
