    <p>I am trying to introduce a class-based kerning to my font, using the technique from this tutorial:<br>
    <a href="http://blogs.adobe.com/typblography/atypi2006/atypi_Adventures_in_class_kerning.pdf" title="http://blogs.adobe.com/typblography/atypi2006/atypi_Adventures_in_class_kerning.pdf">http://blogs.adobe.com/typblography/atypi2006/atypi_Adventures_in_class_...</a></p>
    <p>I defined a few classes and pairs. (<a class="freelinking external" href="http://dl.dropbox.com/u/46459223/fontlab_bug.png" rel="nofollow">See my code.</a>) but nothing happened - they weren't applied. The only message I get is:</p>
    <p>[WARNING]  Glyph class @FLSFNT8733 redefined [C:/Users/boris/Documents/FontLab/Studio5/fontlab.fea 3] </p>
    <p>As i saif, my font compiles correcty, bu the pairs aren't applied. Help.</p>
