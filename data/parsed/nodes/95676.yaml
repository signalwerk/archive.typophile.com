    html: |-
      <p>The line should read...</p>
      <pre>@_a = [ a  aacute ];</pre><p>
      ...but HTML collapses extra space characters unless they're escaped (as in <code>&amp;nbsp;</code>) or inside of a &lt;pre&gt; element.</p>
