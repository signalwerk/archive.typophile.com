      <p>The closer I see is <strong>Limerick-Regular</strong> (! not Limerick Morning !)</p>
      <p>..but there is still no horizontal bar on 'J', 's' is different and 'w' is more pointy.<br>
      Good news: period is round</p>
      <p>You could also take a look on <strong>Lubalin Medium</strong> just for the 'J'</p>
