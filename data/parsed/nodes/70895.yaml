    html: |-
      <p>I like to be thorough too. I've set up classes for every letter, per side (plus sets for punctuation and other glyphs), then broken them out into matching visual sets, while turning off redundant individual classes. This way classes can be brought into new designs and adjusted as necessary.</p>
      <p>For example, I can group all of my Es in to one for being on the right side, then drag them to be with the class "_BDEFHIKLNPR_R" to kern all of them the same, because the left side is exactly the same on all of these letters in my design. By keeping the individual classes too, I can always just go back if there are instances that need specific attention. VWY are a class, vwy are a class, but when working with this set as small caps I need vw and then y.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/classes_5769.png"></div><p></p>
