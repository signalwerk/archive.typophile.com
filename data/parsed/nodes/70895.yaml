      <p>In answer to your first question, about the required characters, FontLab will add them automatically by default if they are absent. The reason they were missing in the fonts you mention is because they were not TT-based.</p>
      <p>With regard to kerning classes, I think the important thing is to set them up in a way that makes the most sense to you. My own system is similar to what Adam describes, but I try to make the groupings easy to remember and avoid including glyphs with different ascender and descender attributes.</p>
