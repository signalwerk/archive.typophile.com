      <p>I follow the "like shape" model.</p>
      <p>So I generally put  c, d, e, o, q, ð and œ in the same class.<br>
      However, in a tightly-fitting style, d and q may be separated into their own class, if they aren't quite so round as the others.</p>
      <p>Accented characters are trickier, sometimes I have ended up with three classes each for the variants of a, e, i and o.<br>
      In fact, I have on occasion kerned each i-accent character separately.</p>
