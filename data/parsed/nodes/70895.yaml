      <p>@Mark: Thanks. Yeah, being non TT-based would make them not conform to the TT specs, I suppose. :) I knew I had missed something!</p>
      <p>Also, I went through the FLS5 manual again, and and found something I had overlooked in the "Font Header" section, under the TrueType Mapping Settings [cmap Table]:</p>
      <p>"If the <code>Automatically Add...</code> option is on, then FontLab Studio will analyse the font and add characters that are necessary for complete font compatibility. In Windows only two characters are really necessary: the ".notdef" and "space" characters. On the Mac a couple additional characters are required: "CR" and "NULL". Note that FontLab Studio will generate these characters only if they do not exist in the font, so you can create them manually and control their appearance. We recommend leaving this option on, especially if you are developing Macintosh fonts."</p>
      <p>So that clears that question up. Thanks a bunch.</p>
      <p>Concerning classes, I agree that it is largely a matter of preference, and I would probably use the first example myself, but would still like to hear everyone's preferences and particular techniques; you never know what you may pick up from a casual comment.</p>
      <p>Also, clarification on Karsten's <em>"automatically 'merge' classes"</em> comment above is something I am quite interested in.</p>
      <p>Regards,<br>
      -Duncan</p>
