      <p>Sorry for not responding earlier.</p>
      <p>Mark Simonson wrote:<br>
      <cite>If you have a class for the left and right that have the same exact glyphs, then go ahead and merge them into a single right/left class. However, doing so gives you less flexibility with regard to what can go in the class.</cite></p>
      <p>I completely agree. This is why, in my post which you cite, I wrote:<br>
      <cite>... and upon generating fonts I automatically 'merge' classes with identical content into a single class.</cite></p>
      <p>The important part is "upon generating fonts". Merging happens outside of the vfb and will leave the vfb's original leftside and rightside classes intact.<br>
      It is not a feature of FLS5 but part of my own font generation method/automatism. When doing Litteratra which has a lot of kerning and classes I noticed that AFDKO would produce a slightly smaller GPOS table if classes are merged. I should test this again with newer versions of AFDKO. Most of the time merging is mere cosmetics and not worth the effort.</p>
      <p>So if you keep leftside and rightside classes separate this is fine and makes it easier to extend the glyph set later. In so far, as Mr Simonson said.</p>
      <p>    * * *</p>
      <p>As to the first four glyphs, the spec recommends them <em>only</em> for TT-OTFs (i.e. OTFs with TT-outlines, in a 'glyf' table), not for CFF-OTFs (or PS-OTFs in Adam's terminology, i.e. OTFs with PS-outlines, in a 'CFF' table). Adobe's fonts are CFF-OTFs, so they are not affected by the recommendation.<br>
      With CFF-OTFs, the first glyph is expected to be '.notdef', usually followed by 'space'.</p>
      <p>If you make TT-OTFs, it may be better to add the first four glyphs manually rather than relying on FLS5. Then you have a chance to adjust their widths. Advance width of 'CR' usually is the same as with 'space'; '.null'/'NUL' has an advance width of 0; and advance width of '.notdef' is up to you.</p>
      <p>Best wishes, Karsten</p>
