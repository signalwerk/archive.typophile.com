      <p>As to the first four glyphs, the spec recommends them <em>only</em> for TT-OTFs (i.e. OTFs with TT-outlines, in a 'glyf' table), not for CFF-OTFs (or PS-OTFs in Adam's terminology, i.e. OTFs with PS-outlines, in a 'CFF' table). Adobe's fonts are CFF-OTFs, so they are not affected by the recommendation.<br>
      With CFF-OTFs, the first glyph is expected to be '.notdef', usually followed by 'space'.</p>
      <p>If you make TT-OTFs, it may be better to add the first four glyphs manually rather than relying on FLS5. Then you have a chance to adjust their widths. Advance width of 'CR' usually is the same as with 'space'; '.null'/'NUL' has an advance width of 0; and advance width of '.notdef' is up to you.</p>
      <p>Best wishes, Karsten</p>
