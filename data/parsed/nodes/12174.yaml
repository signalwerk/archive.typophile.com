    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Dan Reynolds</strong></p>
    <p>Born in Baltimore in 1979, Dan studied Graphic Design at <a href="/wiki/RISD" class="freelinking" rel="nofollow">RISD</a> before moving to Europe. In 2004, Dan co-founded the Offenbach <a href="/wiki/Typostammtisch" class="freelinking" rel="nofollow">Typostammtisch</a> during a brief stint as a graduate student at the <a href="/wiki/HfG%20Offenbach" class="freelinking" rel="nofollow">HfG Offenbach</a>. Later, he studied on the <a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a> MA Type Design course, where he graduated as part of the class of 2008. Dan teaches typography and type design courses at several German design schools, and works as a type designer in Berlin</p>
    <p><a href="http://www.typeoff.de" title="http://www.typeoff.de">http://www.typeoff.de</a></p>
