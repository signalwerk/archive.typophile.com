    html: <p>Californian , "the type" <br> <br>Is Hrant's favorite Goudy Type face. Mine too. Designed by Frederic Goudy for the University of California. <br> <br>Lanston is the proprietor of "the godly" version of this face, made by Goudy's own hand at Deepdene. I beg you visit the Katskill Mountains in the fall. A sight you will never forget. <br> <br>Go see the remains of Goudy's studio at Deepdene. <br> <br>My further advice about this face is to ask those at P22 if they ever plan to release this face.</p>
