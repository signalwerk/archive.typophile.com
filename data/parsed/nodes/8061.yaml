  html: <p>Hi, <br> <br>I'm currently working on a detailed typeface research project for my Typography class and I need to know any information anybody may have on the Californian FB fonts. <br> <br>I learned so far that it was designed/redrawn by David Berlow based off from Goudy's California Old Style. <br> <br>Any info, facts, etc on Californian FB will help... thank you.</p>
