    html: <p>Alan, you will want to get hold of a copy of Goudy's book <i>Typologia</i>, which focuses on the making of the original Californian type. There is a partial electronic version of this book online <a href="http://www.typeart.com/reference-books/typologia/typo-contents.html">here</a>. <br> <br>On page 208 of Bringhurst's <i>The elements of typographic style</i> there is a useful comparison of FB Californian with the earlier revival, ITC Berkeley.</p>
