      <p>Seen your first request for this Breitling vintage USAF clock but I was not able to identify any of them. What I could say though is most of typefaces used for such devices (even more when we're talking about Army) are manufacturer exclusive so far from an answer (previous discussions on this kind of topic: '<a href="http://typophile.com/node/99439" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Art Deco vintage watch dial digits</a>', '<a href="http://typophile.com/node/95364" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Max Bill clock face design for Junghans. Custom typeface?</a>', '<a href="http://typophile.com/node/99271" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Font needed for Neon Clock face</a>'... </p>
      <p>Central dial digits (ELAPSED TIME/MINUTES)<br>
      Remind me of <a href="http://www.myfonts.com/search/engravers+gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Engravers Gothic</a>/<a href="http://www.myfonts.com/search/blair/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Blair</a>/<a href="http://www.myfonts.com/search/sackers+gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sackers Gothic</a> with some 'stencil' adjustments (mainly on /6 counter to avoid a too small part).<br>
      Some more in the same vein: <a href="http://www.myfonts.com/fonts/insigne/aviano-sans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Aviano Sans</a>,  <a href="http://www.myfonts.com/fonts/insigne/montag/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Montag</a>, <a href="http://www.myfonts.com/fonts/sweet/sans-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sweet Sans</a>, <a href="http://www.houseind.com/fonts/luxuryfonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Luxury Gold</a>, <a href="http://Capline" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Capline</a>, <a href="http://www.myfonts.com/fonts/storm/zeppelin/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Zeppelin (41)</a>, <a href="http://www.myfonts.com/fonts/betatype/doublewide/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Doublewide</a>, <a href="http://www.myfonts.com/fonts/chank/adrianna/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Adrianna</a>, <a href="http://www.myfonts.com/fonts/typodermic/biondi-sans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Biondi Sans</a>, <a href="http://www.myfonts.com/fonts/positype/halogen/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Halogen</a>, <a href="http://Idlewid" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Idlewid</a>, <a href="http://www.myfonts.com/fonts/mti/burin-sans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Burin Sans</a>, <a href="http://www.myfonts.com/fonts/redrooster/ronsard-crystal/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ronsard Crystal</a>, <a href="http://www.myfonts.com/fonts/baselinefonts/worn-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Worn Gothic</a>, <a href="http://processtypefoundry.com/fonts/bryant-2" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bryant 2</a>, <a href="http://www.myfonts.com/fonts/scrowleyfonts/rondell" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rondell</a>, </p>
      <p>ELAPSED TIME/MINUTES<br>
      Again, some reminiscence of discussions about <a href="http://typophile.com/node/79271" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Leroy Lettering machine</a> without being it.<br>
      Alternatives: <a href="http://www.dafont.com/engineering-plot.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Engineering Plot</a>, <a href="http://www.myfonts.com/fonts/nicksfonts/planscribe-nf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Planscribe</a>, <a href="http://www.fontspace.com/character/leroyletteringlightbeta01" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Leroy Lettering Light Beta 01</a>, <a href="http://lineto.com/The%20Fonts/Font%20Categories/Text%20Fonts/Gravur%20Condensed" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gravur Condensed</a>, <a href="http://www.myfonts.com/fonts/jnlevine/rendering" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rendering</a>, <a href="http://www.myfonts.com/fonts/larstornqvist/simpliciter-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Simpliciter Sans</a>, <a href="http://www.myfonts.com/fonts/urw/gordon/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gordon</a>, <a href="http://www.myfonts.com/fonts/btn/register-sans-btn" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Register Sans</a> (open counter digits), <a href="http://www.myfonts.com/fonts/larabie/primer-print" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Primer Print</a>, <a href="http://www.myfonts.com/fonts/typodermic/report" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Report</a>, <a href="http://www.myfonts.com/fonts/bedoodle/oxymoron" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Oxymoron</a>, <a href="http://www.dafont.com/tgl-0-16.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">TGL 0-16</a></p>
      <p>U.S. AF TYPE A-10A 8 DAYS/BREITLING WAKMANN<br>
      Some '<a href="http://www.myfonts.com/search/din" title="Click to visit an external URL." class="freelink freelink-external freelink-external">DIN</a>' might work well even if, again, that's far from matching. Some interesting details to note: /A large flat top, low /W centre vertex<br>
      Similars: <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Storno" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Storno</a>, <a href="http://omtype.com/type/en/default.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Default</a>, <a href="http://www.myfonts.com/fonts/typodermic/fenwick" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fenwick</a></p>
