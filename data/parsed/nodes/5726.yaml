  html: <p>I am currently putting together an exhibition for a gallery in the UK of poster design from around the world. Though the posters for the exhibition are all contemporary, I've been fasinated by many older posters too. <br> <br>The posters of Bachs (see picture below) are fantastic, and his work was something I was never aware of.  <br> <br><img src="http://www.typophile.com/forums/messages/30/41240.jpg" alt=""> <br> <br>Also Wes Wilson, I had never come across his name before but now Iam rapidly building up a collection of his posters via ebay... <br> <br>Anyway, I wondered who your poster hero's are...</p>
  html_clean: <p>I am currently putting together an exhibition for a gallery in the UK of poster design from around the world. Though the posters for the exhibition are all contemporary, I've been fasinated by many older posters too. <br> <br>The posters of Bachs (see picture below) are fantastic, and his work was something I was never aware of.  <br> <br><img src="http://www.typophile.com/forums/messages/30/41240.jpg" alt=""> <br> <br>Also Wes Wilson, I had never come across his name before but now Iam rapidly building up a collection of his posters via ebay... <br> <br>Anyway, I wondered who your poster hero's are...</p>
