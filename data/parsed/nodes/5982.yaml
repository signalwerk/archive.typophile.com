    html: <p>my typography classes rocked with one Mrs. Janice Klassen. The school fliped her to another dept. after the 2 year, but her cirriculum and the schedules she organized were amazing. I don't think there was anything she missed. Every student loved her classes, cursed her project dealines, pop quizzes, and in class assignments scaling paragraphs of 8pt garamond to .17pt, by hand while she peeked over our shoulders pointing out spelling errors and suggesting the x-height was way off 30 minutes before class ended. <br> <br>Now 3rd year, the new profs ended up covering the same content Klassen had already taught, even though we had mentioned it over and over. Sneaking suspicion that they didn't know anything more. <br> <br>I had expected to learn how to implement everything we had learned. Technical aspects like whats Type 1, Type 3, TrueType, Postscript, Magnectic Pens and all that. What programs do you make typefaces with &amp; how (Klassen taught us design, no computers). Legalities and sale/contracting info. Current affairs, hotbeds, trends could have been useful. Instead history, bowls, weight, and descenders were discussed while we all fell asleep.</p>
