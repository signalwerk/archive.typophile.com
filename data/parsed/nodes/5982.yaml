    html: <p>Sorry, I learned very little from those classes, only enough to affect how I used type in design and of course, the lost art of specing type for a typesetter - I went to school in '91 mind you . . . <br> <br>I wished they would have taught me about the color of type, an understanding of the source of glyph shapes (eg. how the lowercase r relates to the n , m and h), and how balanced weights and ink traps should be employed in glyph design for both on screen and printed applications. <br> <br>Do you teach a typography class? <br> <br>If so, I also wish they would have mentioned with enough commitment and effort this is profession you can do full-time and earn a living at. <br> <br>Stuart :D</p>
