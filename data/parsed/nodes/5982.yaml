  html: <p>Hi Typophiles,  <br> <br>When you went to art/design school and had the opportunity to take typography classes, was there any type things you wished they had mentioned now that your doing the type/design thing for real? <br> <br>Thanks, <br> <br>Michael </p>
  html_clean: <p>Hi Typophiles,  <br> <br>When you went to art/design school and had the opportunity to take typography classes, was there any type things you wished they had mentioned now that your doing the type/design thing for real? <br> <br>Thanks, <br> <br>Michael </p>
