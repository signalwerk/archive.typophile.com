      <p>The World's Finest Bourbon: a squooshed <a href="http://www.myfonts.com/search/old+towne" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Old Towne</a> might work; alternatives: <a href="http://www.myfonts.com/fonts/hihretrofonts/norwich-aldine-ml" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Norwich Aldine</a>, <a href="http://www.myfonts.com/fonts/jnlevine/cloverdale" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Cloverdale</a>, <a href="http://www.myfonts.com/fonts/jnlevine/boonville" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Boonville</a><br>
