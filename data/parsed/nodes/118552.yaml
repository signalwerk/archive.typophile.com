      <p>BEAM FORMULA: most probably <a class="freelinking external" href="http://www.myfonts.com/search/Futura" rel="nofollow">Futura</a> Condensed (Bold)<br>
      SOUR MASH/DISTILLED BY: <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/sackers" rel="nofollow">Sackers</a><br>
      NONE GENUINE...: <a class="freelinking external" href="http://www.myfonts.com/search/Bank+gothic" rel="nofollow">Bank Gothic</a><br>
      James B. Beam: appears to be hand-done as all repeating letters are different<br>
      BEAM/CLAIRMONT: <a class="freelinking external" href="http://www.myfonts.com/search/Blair" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/Engravers+gothic" rel="nofollow">Engravers Gothic</a><br>
      70cl/40%vol: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/univers" rel="nofollow">Univers</a> UltraCondensed might do the job, as usual for this kind of packaging label</p>
