      <p>The World's Finest Bourbon: a squooshed <a class="freelinking external" href="http://www.myfonts.com/search/old+towne" rel="nofollow">Old Towne</a> might work; alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/hihretrofonts/norwich-aldine-ml" rel="nofollow">Norwich Aldine</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/cloverdale" rel="nofollow">Cloverdale</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/boonville" rel="nofollow">Boonville</a><br>
      Jim Beam: most probably custom<br>
      Kentucky Straight: again, custom to me; looks to mix <a class="freelinking external" href="http://www.myfonts.com/search/alternate+gothic" rel="nofollow">Alternate Gothic</a> and <a class="freelinking external" href="http://www.myfonts.com/search/morris+sans" rel="nofollow">Morris Sans</a>/<a class="freelinking external" href="http://www.myfonts.com/search/bank+gothic" rel="nofollow">Bank Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/bank+sans" rel="nofollow">Bank Sans</a>/<a class="freelinking external" href="http://www.myfonts.com/search/banque+gothic" rel="nofollow">Banque Gothic</a>; Alternative: <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/enamela" rel="nofollow">Enamela</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/gaz" rel="nofollow">Gaz</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dominik-krotscheck/Flounder" rel="nofollow">Flounder</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/dominik-krotscheck/floz" rel="nofollow">Floz</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/absolut-foundry/luzern" rel="nofollow">Luzern</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hold-fast-foundry/abolition" rel="nofollow">Abolition</a> Round<br>
      James B. Beam Distilling Co.: custom as well</p>
