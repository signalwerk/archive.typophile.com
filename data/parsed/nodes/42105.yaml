    html: |-
      <p>Technically the <em>f</em> probably contains the only kern -- but the way I'm using the term here is really only relevant to metal. We don't usually use kern to refer to a part of the letterform that projects beyond the sidebearings anymore, now that the type body is no longer physical. </p>
      <p>(And I doubt that those parts of the <em>a</em> and <em>g</em> project beyond the sidebearings; but I'd have to crack open Minion and take a peek.)</p>
      <p>That is to say, "kern," as a noun, is no longer used to describe an attribute of a glyph shape, but rather a relationship in the glyphs metrics, and only makes sense in the context of a specific pair of glyphs.</p>
      <p>The indicated portion of the <em>a</em> is probably most often called simply a "terminal." That part of a <em>g</em> is usually called the "ear."</p>
      <p>-- K.</p>
