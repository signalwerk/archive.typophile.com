      <p>Kentlew, thx for the clarification. These terms originated from my days designing typefaces at Mergenthaler in the 80's when type was making the transition from metal to film.<br>
      Ken the hairline definition came from Ed Benguiat's typography class where he used the term the way we did at Merg as well – to delineate the thick and thin parts of a character.<br>
      Paul, thx for the clarification – I agree I should have used a thicker serif.<br>
      Stephen, thx for pointing me to Fontshop's anatomy. I found it useful<br>
      Eluard, many students in lectures have found this diagram useful, even if it may not be 100% according to everyone's definition here. i will amend it – but I wont repost it.<br>
      Thx to all.</p>
