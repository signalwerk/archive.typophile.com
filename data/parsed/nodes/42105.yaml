    html: <p>We've nattered over the meaning of terms here before but Kent's description of kern/kerning is widely accepted. In regards to your definition of hairline. My understanding is that it is not merely the thin stroke of a letter but the thinnest possible stroke of a letterform. In other words, your Bodoni sample contains hairline strokes and serifs, your Minion sample does not.</p>
