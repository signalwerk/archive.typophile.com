    <p>I'm looking for a casual, legible handwriting face, predominantly for online use. The style I'm looking for is along the lines of:</p>
    <p><a class="freelinking external" href="http://www.playtype.com/font/signature" rel="nofollow">Signature</a><br>
    <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/dalton_maag/verveine_std_regular/" rel="nofollow">Verveine</a><br>
    <a class="freelinking external" href="http://www.fonts.com/font/mark-simonson-studio/felt-tip-roman/heavy" rel="nofollow">Felt Tip Roman</a><br>
    <a class="freelinking external" href="http://www.g-type.com/rollerscript-font" rel="nofollow">Rollerscript</a><br>
    <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/paratype/betina_script_bold_ot/" rel="nofollow">Betina Script</a></p>
    <p>Here's the thing – I really need a consistent family across numerous alphabets (Latin, Eastern European, Greek, Cyrillic, numerous Asia/Pacific scripts). It also has to have an EULA that allows unlimited page views per month.</p>
    <p>Sound impossible? My money's on "probably". Can anyone help?</p>
