      <p>Sorry, I didn't word that very clearly. I just meant major alphabets currently in use in the Asia/Pacific region – simplified Chinese, kanji, hiragana, katakana, etc. I know that's asking a lot, and I think I'm SOL but I'm just researching this to see if it's a possibility.</p>
      <p>I'd just select faces that closely resemble what I'm looking for in each region, but you know… one man's Verveine is another man's Comic Sans.</p>
  - id: 513816
