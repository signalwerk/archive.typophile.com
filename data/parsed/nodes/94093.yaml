    html: |-
      <p>Writing styles are not consistent in all those languages so you can't really have a 'one size fits all' design that would accomodate both Chinese variants as well as Chinese, Korean, Thai, etc.</p>
      <p>That's not even getting into the fact that sometimes the same character in Chinese actually has a different form than in Japanese.  For East Asian fonts at least, each font has to be specifically tuned for the language in question or it won't "look right" to somebody.</p>
