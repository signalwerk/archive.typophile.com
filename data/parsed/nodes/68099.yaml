    html: |-
      <p>The sample is pretty small. Also, do you need just the SOAP letters?<br>
      Yi Baiti is a font created for a very specific non-latin script* so arguably the latin part of it is based on an already existing latin typeface.<br>
      I would try something like Nimbus Sans Novus** or other Helvetica (Neue) version.</p>
      <p>* <a href="http://en.wikipedia.org/wiki/Yi_script">http://en.wikipedia.org/wiki/Yi_script</a><br>
      ** <a href="http://new.myfonts.com/fonts/urw/nimbus-sans-novus/">http://new.myfonts.com/fonts/urw/nimbus-sans-novus/</a></p>
      <p>By the way, nowadays Macs use Windows fonts just fine.</p>
