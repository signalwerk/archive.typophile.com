  html: '<p>Hi, folks. I don’t know if you guys have had this problem, but I found a solution so I thought I would share it. <br><br>Problem: When repeatedly testing my new family of fonts, one weight was consistently scrambled in Suitcase and Word. When I typed “<span class="caps">ABC</span>” I got “<span class="caps">ZAB</span>” or nothing at all. (In Adobe apps it worked ﬁne.) <br><br>Solution: Reset the <span class="caps">OSX</span> font caches <br><br>How to (gleaned from <a href="http://www.extensis.com/support/5d.html" target="_blank">http://www.extensis.com/support/5d.html</a>):  <br>1) Reboot in <span class="caps">OS</span> 9 <br>2) Use Find to locate the following ﬁles: <br>com.apple.<span class="caps">FC</span>acheLocalDomain <br>com.apple.<span class="caps">FC</span>acheUserDomain <br>com.apple.<span class="caps">FC</span>acheClassicDomain <br>.<span class="caps">FODB</span>_User <br>.<span class="caps">FODB</span>_Classic <br>3) Trash those ﬁles and empty the trash <br>4) Reboot in <span class="caps">OSX</span> and test the fonts <br><br><br>If they still don’t work: <br><br>1) Reboot in <span class="caps">OS</span> 9 <br>2) Empty the following folders (put the contents in the trash): <br><span class="caps">OSX</span> <span class="caps">HD</span>/System/Library/Caches <br><span class="caps">OSX</span> <span class="caps">HD</span>/Library/Caches <br><span class="caps">OSX</span> <span class="caps">HD</span>/users/yourusername/Library/Caches <br>3) Empty the trash <br>4) Reboot in <span class="caps">OSX</span> and test the fonts <br></p>'
