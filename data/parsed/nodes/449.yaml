  html: "<p>Hi, folks. I don't know if you guys have had this problem, but I found a solution so I thought I would share it. <br> <br>Problem: When repeatedly testing my new family of fonts, one weight was consistently scrambled in Suitcase and Word. When I typed \"ABC\" I got \"ZAB\" or nothing at all. (In Adobe apps it worked fine.) <br> <br>Solution: Reset the OSX font caches <br> <br>How to (gleaned from <a href=\"http://www.extensis.com/support/5d.html\" target=\"_blank\">http://www.extensis.com/support/5d.html</a>):  <br>1) Reboot in OS 9 <br>2) Use Find to locate the following files: <br>com.apple.FCacheLocalDomain <br>com.apple.FCacheUserDomain <br>com.apple.FCacheClassicDomain <br>.FODB_User <br>.FODB_Classic <br>3) Trash those files and empty the trash <br>4) Reboot in OSX and test the fonts <br> <br> <br>If they still don't work: <br> <br>1) Reboot in OS 9 <br>2) Empty the following folders (put the contents in the trash): <br>OSX HD/System/Library/Caches <br>OSX HD/Library/Caches <br>OSX HD/users/yourusername/Library/Caches <br>3) Empty the trash <br>4) Reboot in OSX and test the fonts <br></p>"
