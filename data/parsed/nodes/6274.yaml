  html: <p>Is there an easy way - or simple/fast - to change a curve point to corner; tangent to corner etc etc ?  <br> <br>With Fog there is no problem (Menu --&gt; Points ---&gt; then we can change it.   <br> <br>How to do that with FontLab? <br> <br>Thank you <br> <br>p.s. <br> <br>FontLab is digital type design toolkit. The user guide - 716 pages - is ToolKiller.   <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br></p>
