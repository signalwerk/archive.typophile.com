    html: <p>Do a contextual click on the point (Ctrl-click on Mac, Right-click on Windows). The context menu has various options, including connection type. <br> <br>You might want to pick up a copy of Leslie Cabarga's book, Learn FontLab Fast. I've been working with FontLab for a long time, and I noticed a bunch of things in there about curve/point editing that I didn't know. <br> <br>Cheers, <br> <br>T</p>
