    html: |-
      <p>Thomas has responded on this matter, to the extent that the same lawyers who wrote the EULA also wrote (participated in) the FAQ.</p>
      <p>I have no information, but consider this: The "lawyers" are trying to protect the monetary value of the fonts. That is, they are trying to protect against both piracy and unpaid distribution.</p>
      <p>There is another aspect of fonts though, that is, their usefulness. Sometime "usefulness" is global; that is, a blackletter font would be pretty useless for setting a book about romantic comedies. Just pick another font.</p>
      <p>On the other hand, a text may, for example, have 1,000 occurrences of a schwa. While is is possible to rotate an "e" 1,000 times with a layout program, it is not practical. An example from the PS Type 1 days was when macrons were needed over vowels. Just not there, and impractical to use what was in a font to typeset them.</p>
      <p>To allow the end users the opportunity to use that font, you also have to allow him/her the right to create those characters.</p>
      <p>Now a designer may have thoughts other than money; they want to protect their work from any modification, on the ground that they got it perfect &amp; any subsequent modification would harm their reputation. That is their right, but from any end-user's point of view, (1) it limits the usefulness of the font, and BTW (2) you can modify it's appearance with whatever tools the layout program has.</p>
      <p>There aren't many end users on Typophile. The prevailing perspective is that of type designers. The designers need to remember, when talking to their lawyers about EULA's, the needs of their customers -- Unless, of course, they view their work as art, where the usefulness of it is a secondary matter.</p>
      <p>To me, Adobe's policy make perfect sense. Legally, they maximize the monetary returns for the distribution of their work, while increasing the usefulness of it by allowing the end user to modify as needed. Which, as it happens, should only increase sales.</p>
      <p>If the type world ever gets as serious about enforcing EULA's as the music world got, issuing lawsuits over modifying fonts even when there was no illegal redistribution, the management of companies that use fonts (that is, every press director, and I suspect the boss of every art director) is going to solve the  potential problem by simply prohibiting any the use of any font save the few known to be safe from action -- e.g., Adobe, as things currently stand.</p>
