    user: 42665
    date: 2009-06-05T10:56:00
    date_raw: 5 Jun 2009 — 10:56am
    votes: null
    html: |-
      <p>Sorry about the perception of mixed messages. The EULA FAQ really is up to date. We'll take another look at tweaking either or both to make things more clear. It's a difficult balance to get wording that's unambiguous both to lawyers and end users! In the meantime, I hope this helps.</p>
      <p>It's been Adobe's position - pretty much from Day 1 - that we can't be all things to all users. Therefor we permit our licensees to modify the fonts as/when necessary to meet their specific requirements. (As others have noted, this is not the case for many other companies' EULAs. That's largely because they want to do the modifications themselves, and charge for the service. Adobe fonts licensed from another company may not include modification permission.)</p>
      <p>There are some obvious, and not-so-obvious constraints on the modified fonts. Obviously they're still subject to the terms of the end user license. That precludes selling or freely distributing the modified copies. What may be less obvious is that both the modified copies and the unmodified originals count toward the licensed total. (Our default license is for five seats/machines.)</p>
