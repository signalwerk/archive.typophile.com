      <p>From the Adobe EULA quoted above... "Such converted font software may be used only for your own customary internal business or personal use and <strong>may not be distributed or transferred for any purpose</strong>, except in accordance with Section 4.4 of this agreement."</p>
      <p>I hadn't noticed this before, but as section 4.4 does not allow document embedding a converted font cannot be legally embedded in a PDF or other document. So if somehow conversion = modification in Adobe's eyes, the modified font has to stay on your machine and can't be part of the customary PDF workflow.</p>
