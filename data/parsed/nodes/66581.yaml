  votes: null
  html: |-
    <p>Some posts and comments violate guidelines, are personal attacks, or otherwise harm the site. There is no way to flag posts or comments. Since site admins are functionally invisible, unnamed, and essentially impossible to contact, there is no practical method to submit any such complaint.</p>
    <p>There is no way to flag a double post or double comment, either.</p>
