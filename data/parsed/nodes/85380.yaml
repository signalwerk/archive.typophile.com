      <p>Fábio,</p>
      <p><a href="http://26plus-zeichen.de/fonts/edelsans/" title="http://26plus-zeichen.de/fonts/edelsans/">http://26plus-zeichen.de/fonts/edelsans/</a></p>
      <p>My (admittedly unimaginative) typical formula is:</p>
      <p> * in print, use the sans of a pairing for titles and subheads, and use the serif for body text.<br>
       * for electronic media, use the serif of a pairing for titles and subheads, and use the sans for body text.</p>
      <p>This particular customer won't be writing a book, so print use will be limited to posters, postcards, brochures, mailers, and other small-scale publications (forms, invoices, etc). And there will be a website, so I usually like to find a sans I think might work for website body-text, and a serif that (usually in its Bold weight, but not always) stands up to being embedded with @font-face.</p>
      <p>'zat 'nuf?</p>
      <p>-Amado</p>
      <p>.<br>
