    <p>Hi all,</p>
    <p>Looking for a serif to pair with a surprisingly warm, humanistic geometric I came across. Client is trying to project complete competence and professionalism, but friendly approachability. Client has a brand history with a fairly cold Modern.</p>
    <p>So I thought to find a typeface with vertical or near-vertical stress. I'd like fairly low contrast between thicks and thins (thicker thins, not thinner thicks), because I'm concerned about the letters falling apart in low-resolution situations (like web). I am leaning away from letterforms with serifs that are too substantial or chunky; a certain balance in the serifs between delicate elegance and being able to stand up in low rez situations.</p>
    <p>**edit, insert** I'll just need normal, italic, bold, and bold italic. **end edit**</p>
    <p>And, naturally, I thought that you would know better than I what a few viable options might be.</p>
    <p>Yours,<br>
    Amado</p>
