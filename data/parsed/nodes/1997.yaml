    html: <p>David, <br> <br>If you're referring to replicating the look of newsprint fibers, it's much easier to scan in a real newspaper and photoshop the fibers into a uniform background, then multiply the image over top. <br> <br>If you're referring to the subtle distress that comes from light ink coverage on cheap newsprint paper ran at high speeds, I've got just the thing for you . . . <br> <br>In a few weeks I plan to launch a series of photoshop filters that do just what you're describing. I will make a post to the list when they are ready for consumer consumption. <br> <br>Best, <br>Stuart :D</p>
