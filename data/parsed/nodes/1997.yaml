    html: "<p>1) That's an extreme example. It's from Armenia, where the money is very tight these days, so type fidelity -especially in newspapers- is very low. The typical low-print-quality Western paper looks more like this: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/20193.gif\" alt=\"latnews.gif\"> <br> <br>2) I don't know if horizontals gain more than verticals <i>as a rule</i>. But it could be, because of the cylinder press direction, and maybe the paper too. <br> <br>3) In the Armenian sample the callendaring of the paper (at least I think that's what it's called) has a strong effect. <br> <br>4) There's a hard-to-find article by Beatrice Warde in a publication called \"Bowater Papers\" (#3, 1954, from page 42) that shows many great examples of fidelity loss. I have a copy, but it's pretty bad quality itself! <br> <br>5) There's an article by Philip Gaskell in issue #7 (1971) of the Journal of the Printing Historical Society called \"Photographic Enlargements of Type Forms\" (pp 51-53, but with 8 plates) with really superb close-ups of many classic fonts, printed optimally (as you can still see the gain). I have an original of that. <br> <br>hhp <br></p>"
    html_clean: "<p>1) That's an extreme example. It's from Armenia, where the money is very tight these days, so type fidelity -especially in newspapers- is very low. The typical low-print-quality Western paper looks more like this: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/20193.gif\" alt=\"latnews.gif\"> <br> <br>2) I don't know if horizontals gain more than verticals <i>as a rule</i>. But it could be, because of the cylinder press direction, and maybe the paper too. <br> <br>3) In the Armenian sample the callendaring of the paper (at least I think that's what it's called) has a strong effect. <br> <br>4) There's a hard-to-find article by Beatrice Warde in a publication called \"Bowater Papers\" (#3, 1954, from page 42) that shows many great examples of fidelity loss. I have a copy, but it's pretty bad quality itself! <br> <br>5) There's an article by Philip Gaskell in issue #7 (1971) of the Journal of the Printing Historical Society called \"Photographic Enlargements of Type Forms\" (pp 51-53, but with 8 plates) with really superb close-ups of many classic fonts, printed optimally (as you can still see the gain). I have an original of that. <br> <br>hhp <br></p>"
