  html: <p>Hi, <br>Im looking for a way to put a newspaper print effect (B/W) on an image. Im guessing there must be a filter/plug-in out there, would anybody recommend one? <br>And similarly, would anyone know what program or filter was used to create the cover for eye no.44 (an image of the queen made up of circles). <br> <br>Thanks in advance, <br>David.</p>
