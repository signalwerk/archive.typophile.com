    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Souvenir</strong></p>
    <p>The original Souvenir was drawn by <a href="/node/13617" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Morris Fuller Benton</a> and released by <a href="/node/13554" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ATF</span></a> in 1914. It appears, in a single weight only, in the famed 1923 <span class="caps">ATF</span> catalog. It has a distinctive “warm and fuzzy” look, and is probably one of the softest typefaces ever to have wide&nbsp;popularity. </p>
    <p>The most common version today is the 1970 interpretation, drawn by <a href="/node/14231" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ed Benguiat</a> for International Typeface Corporation. When <a href="/node/13402" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span></a> was formed, Souvenir was one of their first releases for phototype. With its large x-height, soft round curves, and clean design, <span class="caps">ITC</span> Souvenir Light closely follows Benton’s original, which anticipated their design philosophy nearly sixty years earlier. Ed Benguiat changed a few details and expanded the concept to a family of four weights in both roman and italic. <span class="caps">ITC</span> Souvenir became hugely popular, and many people associate it with the design aesthetic of the ’70s and of early <span class="caps">ITC</span> types in&nbsp;particular. </p>
    <p>Souvenir was strongly influenced by Schelter-Antiqua and Tauchnitz-Antiqua (1906) from <span class="caps">J.G.</span> Schelter <span class="amp">&amp;</span> Giesecke, a leading German typefoundry in Leipzig. They have many distinctive features, such as the open-bottom lowercase ‘g’, the narrowed top aperture of the uppercase ‘U’, and the convex diagonals of the A that mark them as the source for&nbsp;Souvenir. </p>
    <p>Schelter <span class="amp">&amp;</span> Giesecke had launched Schelter-Antiqua as their own original in-house design with very elaborate and beautiful specimens, an essay on its features, and a warning that they had protected it under German law (gesetzlich geschützt). It was intended as a very serious contender in the legibility stakes and the Schelter <span class="amp">&amp;</span> Giesecke specimen contains a fascinating 4-page article on it. There is much emphasis on the care put into avoiding over-fine hairlines and achieving good spacing. Having invested so much work in a complete series (condenseds and semi-bolds and so on) no wonder <span class="caps">S&amp;G</span> got legal protection for the face, in Germany at least. In fact there were several imitations, and one of them (not very close, but not that distant either) from an Austrian foundry was called ‘Souverain’–probably not coincidentally similar in name to&nbsp;Souvenir.</p>
    <p>Benton had produced at the same time his entry in the legibility stakes, namely Clearface. Perhaps for this reason, he took ideas from Schelter-Antiqua, which was a Jugendstil-influenced hybrid of fraktur and roman. Benton went in another direction, giving it a ‘cuddly’ look, different from the German types. Its origins as a ‘legibility’ face, as well as Benton’s and then Benguiat’s skills, may account for why among ‘soft’ designs it gained wide acceptance. <span class="caps">ATF</span> Souvenir had nearly sunk without trace – until the 1960s, when the desire for typographic novelty unearthed it from obscurity and put it back into typographic&nbsp;consciousness. </p>
    <p>Mac McGrew’s ‘<a href="/node/14565" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">American Metal Typefaces Of The Twentieth Century</a>’ adds that its working title at <span class="caps">ATF</span> was ‘Round Roman’, and that the phototype version by Benguiat became so popular that ‘Matrotype’ in England cut metal faces based on it–thus becoming one of the few cases of phototype being cut in&nbsp;metal.</p>
    <p>Typophile threads:<br>
    A <a href="http://typophile.com/node/14173">query</a> as to Souvenir’s&nbsp;origins.</p>
    <p>External&nbsp;links:</p>
    <p>A showing of <a href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n2888.pdf">Schelter-Kursiv</a> can be found on page&nbsp;10.</p>
    <p>Souvenir was featured as <a href="http://www.linotype.com/7-2412-7/itcsouvenir.html">font of the week</a> by&nbsp;Linotype.</p>
