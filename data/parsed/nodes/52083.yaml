      <p>Hannes, are Meta, Scala and Thesis really translation-based? </p>
      <p>For Meta at least, I would have said expansion-based. Humanist is often used with sans serifs to indicate there is modulation in the strokes, but historically humanist is associated with translation, and expansion with neoclassicism and romanticism. Among sans serifs, I think only Today is truly based on translation, and Legato, though not based on translation, but a clever derivative of expansion, is a low contrast serifless face that approaches the condition of translation.</p>
      <p>The sans serif version of Scala has to be a derivative of the serif version, which came first. The serif version is, to me at least, a post-modern derivative of the expansion-based egyptiennes, with a nod in some places to the stroke modulation characteristic of translation. I use post-modern here in Robert Bringhurst's sense, as elaborated in 7.2.11 of the original edition of <em>The Elements of Typographical Style</em>.</p>
      <p>A word of caution though. Hrant has said he thinks my analysis of Legato is hopelessly contorted. He might think this of my analysis of Scala as well.</p>
    html_clean: |-
