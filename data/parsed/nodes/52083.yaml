    <p>I know there are many classification systems for fonts,<br>
    but in all of them, I really could not place contemporary<br>
    fonts like <a href="/wiki/FF%20Meta" class="freelinking" rel="nofollow">Meta</a>, <a href="/wiki/FF%20Scala" class="freelinking" rel="nofollow">Scala</a>, and <a href="/wiki/Thesis" class="freelinking" rel="nofollow">Thesis</a>.</p>
    <p>I was wondering where people place these fonts, using<br>
    whichever of the classificatory systems they use; or name,<br>
    define a class or category in which we can place these<br>
    typefaces.</p>
