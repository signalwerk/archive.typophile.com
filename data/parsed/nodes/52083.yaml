      <p>Ok, so I need my head examined. I tend to take everybody too seriously. On the other hand I don't believe those I take seriously, but I try to check out what they say and find out the truth. Only a partial excuse, I admit.  </p>
      <p>So whom should I seek out for therapy? Certainly not dyspeptic Brooklynites. They can never find anything good to say about anybody. Maybe Mario Feliciano, the sunny Portuguese and wonderful type designer. Yeah, next conference I'll try to find him and see if he can cure me :) </p>
      <p>On the issue of the value of the Noordzij style analysis of the 'stroke'. Personally, I take this very seriously :)  I do find it very helpful when designing to think how I am modifying the stroke in relation to what a pen would do. </p>
      <p>Still, I think it is of limited use in understanding the design of faces beginning in the 19th century, and especially now. Erik says his constraints were his brief of a font useful for the post office, and his looking a ten different fonts--for different reasons. The solution incorporated elements from these other fonts, plus his own idea about more square, open counters. So the bent stem didn't come from a pen stroke, but rather from another font. Admittedly it is conceivable that that other font may have been inspired by Goudy, who spent the first part of his career lettering. But still the most of his considerations about width,  weights, shapes and proportions had more to do with the brief and his ideas about what would work, rather than what a pen would do or not do. </p>
      <p>In other words, most of the story is not about the stroke, but other things.</p>
