      <p><cite>why do you need a more specific genre than something like contemporary humanist sans-serif?</cite></p>
      <p>Because "contemporary" only describes when the thing was made, rather than any defining characteristic of the design. It also has the same problem as describing something as "modern" as they both refer to the time period of "now", and when now becomes then, what do we have left to call things in the next now?</p>
