      <p>The thing is — classifications are necessary to explain to people who do not know, what they should know. People who are into type know exactly what kind of type Meta (and so on) is. </p>
      <p>Classifications are BS.</p>
      <p>But if you really want to explain, go literary, eg: </p>
      <p>Meta is a staunch and worklike typeface, that has a sense of irony — it walks around with curling lips, because it knows it is superior to — for instance — Helvetica; lovely to the people that it meets on the paper or on the screen; a welcome guest to a party, the guy who tells the funniest jokes. Meta is your friend when communication skills are needed, and maybe the one that gets you off the hook when you are stopped for speeding.</p>
      <p>Try this with other typefaces…</p>
      <p>Cheers!<br>
      . . .<br>
      Bert Vanderveen BNO</p>
