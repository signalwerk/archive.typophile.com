      <p><cite>…just like Helvetica and its friends deserve the neo-grotesque tag.</cite></p>
      <p>The more I look at old type, the more I think Nick Shinn is right: neo-grotesque is a BS term. Letterform designs in the neogrotesques was not especially new, most of the ideas can be spotted in designs decades older. What really stands out about the neogrotesques is the planning of Universe as a large family with one head designer, and that’s not something that constitutes a stylistic break. I’m going to say the same of Meta and TheSans: what really makes them so much different from Frutiger, Syntax, and Stone Sans that they need to be deemed neohumanists?</p>
