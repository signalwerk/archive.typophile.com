      <p>Quay Sans was released in 1990, five years after Meta was designed and three years after the story of its making was published in Baseline magazine. We used Meta for our design studio (whence the name) a few years before it was released as a FontFont in 1991.  It wasn’t the first time David Quay was ”inspired” by another typeface – ask Neville Brody. </p>
      <p>Then again, we are all influenced by what happens around us. I designed Meta because we could not find anything that was suitable for setting forms and other printed material for the German Post Office (Bundespost). I analyzed 10 faces, among them News Gothic because it was narrow, Helvetica because it was a standard, Syntax because it was a fresh alternative to all the boring geometric sans faces, and Letter Gothic because it had solved issues of surviving on bad paper with bad printing. That is where the bent-out top strokes come from. I had not understood Noordzijs theories of expansion or translation and I didn’t know what a humanist sans was either. I simply looked at the problem in hand and drew some letters that had squarish counters to create contrast, robust and open shapes, was about 12 percent narrower than Helvetica, had narrow caps (German uses a lot of them) and used little devices to avoid filling in at small sizes on bad paper.</p>
      <p>I feel that Meta is quite warm. That is partly due to the fact that there are lots of details which add noise at small sizes and that Meta was designed over a period of time, with many designers adding bits of the family after I designed the first two weights in 1985. It is actually quite messy, which some people call charming. Thesis, on the other hand, is 110 percent perfect.</p>
