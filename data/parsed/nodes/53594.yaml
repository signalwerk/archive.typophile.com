    <p>At work I'M supposed to design a website for Technique. Technique offers you hair products, so the design should be represent this kind of beauty care.</p>
    <p>Here is my first attempt:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/honlapterv_01_3847.jpg"></div><p></p>
    <p>That's just the headline. I'd like to use that specific design of the offical logo on the whole website. But I really have a difficult situation here. I like the girl with the red hair, but she doesn't fill the whole space. Resizing her won't solve the problem, because this size fits the best on the headline. And looks the best of course.</p>
    <p>So, I keep thinking about what to use to fill that space on her left side.<br>
    Some ideas? Please share!</p>
