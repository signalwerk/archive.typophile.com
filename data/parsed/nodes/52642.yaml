    <p>Hi all</p>
    <p>just posting some links to articles regarding type and what not that ive been reading lately. Hopefully these posts will be a regular occurance, with a specific theme (depends really it could be totally random)</p>
    <p>well as you can tell by the title of the post.. Ive been reading up a lot on helvetica vs arial and the pros and cons of these typefaces and i started off with an article called <a class="freelinking external" href="http://ilovetypography.com/2007/10/06/arial-versus-helvetica/" rel="nofollow">Arial Vs Helvetica</a> on <a class="freelinking external" href="http://ilovetypography.com" rel="nofollow">i love typography</a> (my favorite typography blog  but i digress). </p>
    <p>Dont Like helvetica?  check out this article <a class="freelinking external" href="http://fontfeed.com/archives/helvetica-and-alternatives-to-helvetica/" rel="nofollow">helvetica and alternatives to helvetica</a> on <a class="freelinking external" href="http://fontfeed.com" rel="nofollow"> font feed</a> and get an answer to the question, is there really alternatives to helvetica? </p>
    <p>Oh my god... is there a scourge in the typographical world? apparentally there is according to this article called <a class="freelinking external" href="http://www.ms-studio.com/articles.html" rel="nofollow">scourge of arial</a> on <a class="freelinking external" href="http://www.ms-studio.com" rel="nofollow">mark simonson studio</a> website</p>
    <p>last by no means least.. found an article on use and misuse of period type in the movies... check out <a class="freelinking external" href="http://www.ms-studio.com/typecasting.html" rel="nofollow">typecasting</a> check it out... he also did a groovy trailer for the article which can be also found on the page.</p>
    <p>want to make a comment regarding anything you've seen here, agree with what the author of the articles have said?? leave a comment here i dont mind :)</p>
    <p>until i write again :)</p>
