    html: <p>Inevitably, most new technology is used for both "good" and "bad" reasons. OpenType can be used by unscrupulous foundries to extract more cash from their buyers. Or it can be used by free font designers to provide easy support across platforms and add additional features to those fonts. <br> <br>Personally, I like OpenType, and I'm not sure I can be bothered with worrying about how to produce vanilla TT or PS formats. <br> <br>How many drivers out their now know how their engines work or could fix them? I'm sure it'd be far more likely they'd understand a Model T. But which would you choose? <br> <br>Also, I'm not sure the reference to needing FontLab stands up to scrutiny. Many of the features that free font amateur designers would need (and I'm one of them) can be accomplished by cheaper tools. TypeTool being the obvious one here as it  can export as OpenType (TT outlines only though). How much does a $99 TypeTool license really mean when spending </p>
