    html: "<p><i>Some of the articles on Luc's site seems to postulate that the only pure font format is Type 1, because Type 1 is a (more or less) simple table that can be read and edited by almost anyone.</i> <br> <br>I'm one half of a very small font foundry, and I find making OpenType fonts much easier than Type 1 fonts. Yes, I had to learn a pile of stuff, but I actually think the file structure, the availability of tools for both making and testing, and the benefits of a single, cross-platform binary make OpenType simpler than Type 1. The irony of Luc's rather bizarre essay (and note that he is not a font developer, so I don't know from what perspective he makes these assertions) is that OpenType is a much more difficult proposition for large foundries with giant libraries of existing typefaces than for small foundries making new designs. Consider how long it took even Adobe to convert their library from Type 1 to OpenType: that is a major undertaking, requiring massive resources. Meanwhile, I've been happily making OpenType fonts for six years, without having to worry about the problems of library conversion. I think small foundries are in a better position to take advantage of OpenType than many larger companies. If you look at the initial OpenType offerings from e.g. Linotype vs. Jeremy Tankard, it is clear that format conversion of a large library doesn't leave much opportunity to extend functionality, add cool new glyph variants and layout features, not to mention extended language support; whereas, conversion of a small, boutique font collection or development of new designs can involve much more creativity and new features.</p>"
