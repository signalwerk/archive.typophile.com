    html: "<p>Buy the White Album again? Can't you just download it from Kazaa? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>In asnwer to Kevin's questions: <br> <br>OpenType will not render Type 1 archaic. OpenType exists because Type 1 <i>is</i> archaic. Eventually, operating system developers will simply stop supporting Type 1 fonts, along with all other 8-bit software. <br> <br>Will you be expected to pay full price for OpenType versions of fonts that you already license in Type 1 format? That will likely depend on individual font companies. Smaller companies who tend to have a better idea who owns legitimate licenes for fonts might provide an upgrade price, but I don't see how this would be possible for a large company whose library is cross-licensed to multiple resellers.</p>"
