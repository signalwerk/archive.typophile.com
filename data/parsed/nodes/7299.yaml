    html: "<p>Dan, <br>why don't you go further? Isn't it limitation for type designers that they must buy and use expensive computers with very limited offer of operating systems? <br> <br>Your statement on Type 1 fonts is typical ethnocentric example of a member of the Euro American culture. Why do we need complex typefaces when 256 glyphs in Type 1 was enough for many years etc. Let me argue with you. <br> <br>I am from the Czech Republic. As you probably noticed in Prague, we use many accented characters (not available in Latin 1 Western encoding). Now imagine what does it mean to set multilingual text in archaic applications like QuarkXPress: you must have a particular typeface for each script or even for each language. It is possible to work this way with Type 1 fonts but the final result has a lot of problems: <br> <br>- you cannot export text edited in non Unicode application (XPress) back to Unicode text editor (you can only choose one encoding for all the text) <br>- you cannot create correct and searchable PDF <br>- you cannot export the text as HTML and publish it on the web <br>- it is difficult or impossible to use the text in multilingual databases <br>- it is problematic for blind people to use such a text <br>etc. <br> <br>Unicode and OpenType fonts are a great advantage in many aspects: <br>- they allow type designers to respect traditional ways of writing minor languages <br>- they allow type designers to respect the history of particular typeface (alternate versions of glyphs etc.) <br>- they allow and simplify multilingual communication (one font for several languages) <br>- they are platform independent and they are not stored in multiple files  <br>- they motivate type designers to know more about diacritics, about language specific issues etc. <br>- they allow non Latin type designers to create compatible fonts with both major platforms from the rest of the World <br> <br><b>The main advantage of OpenType is not technical, but cultural. It is a victory of multiculturalism and plurality over ethnocentrism and narrow mind of Western programmers.</b></p>"
