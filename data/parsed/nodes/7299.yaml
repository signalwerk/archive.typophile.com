    html: <p>Filip, I'm totally for OpenType!* I linked to, and paraphrased, the above articles to point out a different (and in my opinion problematic) point of view. I wanted to incite a discussion just like this one. <br> <br>With all of the good arguments, like the ones you pointed out in your posts, why do you think that some designers still cling to Type 1? Adobe hasn't made a Type 1 font in over six years, but Font Shop makes Type 1 &amp; TrueType versions of its new releases, because Quark and Freehand users want them. While some people would argue that Adobe is trying to support its own innovation and products at the expense of other companies, others would argue that they are moving the industry forward. By still making fonts in old formats, are other foundries holding technology back? <br> <br>I'm for moving forward, for many reasons. Aside from greater multi-lingual support, the creation of new typefaces in OpenType format makes for good business <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> * I hope that I didn't offend you</p>
