  html: <p>I have a client whom uses it and he thought he knew the perfect size for importing. But now he is worried about a so-called wave effect in the logo I sent to him. The wave effect is not visible in the file itself but only when you print out of Quickbooks.  <br> <br>Does anyone use Quickbooks? If yes, have you successfully added your logo? If yes, how?</p>
