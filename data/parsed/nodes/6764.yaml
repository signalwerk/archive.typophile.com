    html: <p>Back in the dark ages, PC Word suffered the same fate . . . <br> <br>You actually have to build the image in Illustrator 10 with a white background (the perfect size) and export it as a WMF file. Only trial and error will yield the correct size . . . <br> <br>Sorry  I don't have a copy of Quickbooks to test this theory with. Back in the day I did exports from Photoshop but since AI 10 has the WMF export feature, it's probably going to generate a graphic with a better chance of working. <br> <br>Good luck! <br>Stuart :D</p>
