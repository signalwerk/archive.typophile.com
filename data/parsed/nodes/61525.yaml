      <p>"Almost all of the preliminary sketches you ever see for a typeface are bogus, created after the fact because a reviewer asked to see them’. So if you ever wondered how these sketches were always so neat and perfect, that’s why."</p>
      <p>I can't leave this uncommented. How about other type designers here? It's frankly not true at all in my case. I don't start a new design with anything but ideas and pencil/paper. I'm always sketching. Once an idea starts taking shape, there can be many, many re-drawings of key characters before any digitization takes place. It's the way I'm most comfortable working because I have done a lot of drawing and lettering. And most of those pages don't look either neat or perfect. Is that what people really expect, or want, to see?</p>
      <p>If publications want to see early stage material of a typeface, it is likely that the designer is reluctant to show them, because often the early drawings, and even several iterations of proofs, can look unflatteringly rough, half-baked and even unrecognizable. Carter has said that he doesn't feel comfortable with the drawing stage and does very little drawing. It's just one way to work, and clearly it's a viable one. But I don't think a generalization can be made from that.</p>
    html_clean: |-
