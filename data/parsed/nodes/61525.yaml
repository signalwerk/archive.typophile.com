      <p><cite>I can’t imagine promoting an author’s latest novel by showing pages of the original manuscript with the copyeditor’s markup all over it.</cite></p>
      <p>No, because novels are already perceived as crafted, laborious and creative works of artists. Fonts, on the other hand, either ‘have always been around’, or are ‘spit out by some computer program, if you just hit the right button’.</p>
      <p>The sketch is an icon, a piece of evidence for the tedious and sophisticated process of type design – and the human mind (even better: the human hand) that has been involved in it.</p>
      <p>While novels might not be promoted with showings of edited manuscripts, their authors are very often depicted <a href="http://cubaa.wordpress.com/2007/10/03/cocktail-called-hemingway/">in the act of writing</a>, or with their tool – be it a <a href="http://blogs.walkerart.org/design/files/2009/03/paul_auster.jpg">pen</a> or a <a href="http://quadri.wordpress.com/2008/01/27/much-ado-about-nothing-nihilism-and-modernist-literature-part-3-of-4/">typewriter</a>. I’d rather see some more (informative) correction sheets than those pictures of the type designer sitting in front of a screen, <a href="http://www.spiegel.de/fotostrecke/fotostrecke-21891-4.html">working on the kerning</a>.<br>
      F</p>
