      <p>Back to James's original topic, there does seem to be something of a vogue for annotated proofs (distinct from preparatory sketches) as marketing. FontFont seems to have a penchant for this, especially Spiekermann collaborations. Maybe that's an unfair impression.</p>
      <p>If you stop and think about it, it is a funny way to market something. I mean, it might be interesting to typophiles and such; but as a general marketing strategy? I can't imagine promoting an author's latest novel by showing pages of the original manuscript with the copyeditor's markup all over it.</p>
