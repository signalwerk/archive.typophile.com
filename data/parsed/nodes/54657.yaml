    <p>Greater Albion Typefounders has just released Sabio on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/sabio/ " rel="nofollow"> Myfonts.com</a>.  I regard Sabio as an evolutionary face. By this I mean that it merges elements of script and Roman design into one elegant whole.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sabio_Poster_4214.png"></div><p></p>
    <p>The design was ‘evolved’ somewhere between these two classic approaches. The resulting family of faces makes an excellent display family, but is also clear and legible at small sizes and can be used as a text face with a distinctive flair. More…</p>
    <p>Sabio is a wonderfully flexible face that can sit happily alongside artwork that owes its inspiration to any era from the Art Deco onwards. The regular form is gently and subtly oblique, and the glyphs have a slight hint of swash about them. Alternate and perpendicular forms are also offered. The regular, alternate and perpendicular forms are all in turn offered in regular, and bold weights as well as in a condensed form.</p>
    <p>More samples of Sabio in action can be found on Greater Albion's <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
