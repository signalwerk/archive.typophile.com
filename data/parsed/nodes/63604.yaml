    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/chennai-slab/" rel="nofollow">Chennai Slab</a> is an extension of the original <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/chennai/" rel="nofollow">Chennai</a>. Chennai Slab is a simplified slab serif with over sixty OpenType alternates. These alternates include alternates for the ball terminals, unique simplified alternates and more traditional capital forms. Use Chennai Slab when you need a fun and versatile slab serif. The sans-serif Chennai makes a great complement. Six weights are available.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/artwork?id=32257&amp;subdir=original" rel="nofollow">Sample .pdf, 13 Pgs.</a></p>
