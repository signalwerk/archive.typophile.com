    html: "<p>Whoa there Daniel. Nowhere in <a href=\"http://houseind.com/house.php?page=licensing&amp;subpage=explanation#3\" target=\"_blank\">House Industries licensing agreement</a> does it prohibit modifying the font. People modify fonts for logos, movie titles, book jackets, web sites, etc etc all the time. <br> <br>Here's House's disclaimer on this subject: <br> <br>5. Any software, EPS file, illustration, or anything derived from House Industries font software must be used according to the original licensing terms. This means, for example, that any modified House Industries font, or any outline information derived from any House Industries font is still licensed for the same number of devices as the original and may not be sublicensed, given away, or sold without written permission from House Industries. House Industries is responsible for technical support of its officially distributed fonts only. House Industries is not responsible for modified and/or regenerated software.</p>"
