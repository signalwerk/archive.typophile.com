    html: <p>Here's what Emigre has to say on the subject. Their concern has more to do with reselling the customized font. <br> <br> <br>What if I don't like some letters in a font of yours, can I change them?  <br>------------------------------------------------------------------------ <br>Please understand that we have nothing against experimentation and the customizing of fonts for private use. The problem comes about when such end products are sold and or given away for free, under the guise of "new" designs, and usually without proper credit to their true origins.  <br> <br>The Emigre Fonts license does allow the user to alter the characters in a font as long as the user has purchased the appropriate user license and the altered fonts continue to be used in accordance with this license. In addition, the altered fonts must retain the original Emigre copyright notice.  <br> <br>When you alter a font from the Emigre library, the resulting font(s) will remain the property of Emigre. Legally these adaptations are considered 'derivative works,' and as such they remain the property of their inventor. Others who intend to use your customized fonts will first have to obtain their own licenses of the original fonts from which they are derived. </p>
