    <p>Hi everybody!<br>
    I'm about to release this font, the idea is to create a sans serif with calligraphic touch, this one is part of a large family I'm working on, I just couldn't resist to show it, I like it a lot. I know this is just one weight but didn't want to wait until the whole family were completed.</p>
    <p>it's on MyFonts <a href="http://new.myfonts.com/fonts/typemade/clark/" title="http://new.myfonts.com/fonts/typemade/clark/">http://new.myfonts.com/fonts/typemade/clark/</a></p>
    <p>Any comment will be appreciated :-)<br>
    cheers!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Clark-Hairline-preview_5991.png"></div><p></p>
