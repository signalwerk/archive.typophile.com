    html: |-
      <p>Hola Santiago, como ya lo mencionaron creo que la "a" de inicio tiene una cintura que se ve algo baja, además creo que la curvatura superior se convierte abruptamente en recta, otro detalle es su terminación en recta, creo que se vería mucho mejor si relacionas un poco con "c" que está muy bien lograda y se ve más orgánica.</p>
      <p>"e" tiene un ligero engrosamiento en la parte superior derecha, fuera de eso está muy bien resuelta la estructura.</p>
      <p>Una cosa que podrías hacer de forma más sutil en "a", "u", "d" y quizás en algunas otras es lo que hiciste en "l", lo que yo cuidaría es la extensión de este rasgo y que haya relación en la suavidad de la curva, observa como se relacionan "f", "l", "j" y "t", yo extendería el rasgo en "j" y suavizaría la curva de "l".</p>
      <p>Me gustan "s", "y" y en general que se cumpla eso que deseas lograr, creo que hay otros caractéres que podrían tener otras estructuras para hacer aún más orgánico el sistema, pienso en las diagonales o en "g" que se ve demasiado simétrica.</p>
      <p>Cuida mucho esa naturalidad cuando vayas al peso regular o a lo más bold.</p>
      <p>Muchos saludos.</p>
