      <p>You might consider purchasing a font from Murasu Systems <a href="http://murasu.com/" title="http://murasu.com/">http://murasu.com/</a> and using the Latin letters. See the specimen I posted at <a href="http://typophile.com/node/119151" title="http://typophile.com/node/119151">http://typophile.com/node/119151</a> You would need to squoosh the height and do some editing, but it's a lot less work than doing your own chop job on Times.<br>
      Don</p>
