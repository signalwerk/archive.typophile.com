      <p>James - this idea is different than what you have linked above. In the samples Rohini have posted, the base consonats are Latin, but the vowel signs (matras) are from devanagari. Here, accents (matras) has not been used just for the style sake - they actually change the meaning of the words, just like they do in Hindi.</p>
      <p>And in order to understand this, one must know Hindi! :)</p>
