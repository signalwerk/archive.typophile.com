    <p>Hinglish is what happens when people mix Hindi and English while conversing and chatting.</p>
    <p>- Hindi words are substituted for English words in sentences<br>
    - English words are used in Hindi sentences<br>
    - Phrases are added from either language for emphasis<br>
    - combination words are morphed, by conjugation and verbification of nouns</p>
    <p>This trend has grown significantly and examples are seen in India in<br>
    - International branding - coke, pepsi, McDonalds etc<br>
    - Chatting, conversations, radio, TV, soaps, Movies, Coomericials, Posters...</p>
    <p>So my experiment questions<br>
    - If a combination can happen on a sentence and word level<br>
    - is it possible to push the envelope at a character level</p>
    <p>Please see pictures attached and blog - </p>
    <p><a href="http://rohiniblog.blogspot.com/2009/11/experimental-hinglish-script.html" title="http://rohiniblog.blogspot.com/2009/11/experimental-hinglish-script.html">http://rohiniblog.blogspot.com/2009/11/experimental-hinglish-script.html</a></p>
