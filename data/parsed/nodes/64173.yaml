      <p>The one shortcoming I see in this kind of Hinglish is that "aa" matra can look like an [English] "i" at a quick glance. So, for instance, Banini instead of Banana (which I would have transcribed as Banaana, personally, without the final "aa").</p>
      <p>There are other potential confusions between scripts, especially with handwriting -- like Mango, where your M looks a little like Devanagari "la" and your G looks a little like "da". I don't know if this is more or less likely to be a problem for someone coming more from the Hindi side. </p>
      <p>But fun!</p>
