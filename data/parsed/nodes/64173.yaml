      <p>Hello all, thank you for your comments - </p>
      <p>Satya - I thought this was a fun and interesting way of writing too. I agree this idea may not be completely unique, but like you said as there is no digitized version typeface i think it would be interesting to make one and see how people use it.</p>
      <p>Kent - This was a quick handwriting test and I ran into some trouble with inconsistency. Also I see your point amount the letters being confusing - I'm working on how to figure this out in a digital way so these errors can be fixed.</p>
      <p>some ideas are -<br>
      1) the Latin characters cannot touch the bar and need to be lower<br>
      2) The 'matraas' (hindi accents) need to touch the bar<br>
      3) need to figure out when to use the matra and when not<br>
      4) If i can swap more than just matras, maybe eliminate English silent characters and make the script meant for completely phonetic use</p>
      <p>Thanks Again, I look forward to more comments on the follow up post.</p>
