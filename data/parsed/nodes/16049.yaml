    date: 2005-11-15T00:52:00
    date_raw: 15 Nov 2005 — 12:52am
    votes: null
    html: <p>Very nice logo indeed. timd's point is well taken; nevertheless I prefer the first effort (the one with the pseudo dot notation) because it separates the three parts of the name, making the name as a whole easier to assimilate/understand/remember. After all, sad though it may be, most non-designers don't spend a lot of time gazing at a mark. Read quickly, even with the color alternation, the company name is a bit of a blur. So I would say that the dots serve to make the mark "stickier" for most people while also being a bit of a nod to any networking geeks who happen to be passing by.</p>
