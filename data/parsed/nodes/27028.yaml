  html: <p>On the evening of Tuesday 13 July 2004 you can learn why today 'Type is <br>a design tool' by attending Bruno Maag's talk in the Bridewell Hall, St <br>Bride Institute, at 7pm. <br> <br>We are also holding our 2004 annual general meeting earlier in the <br>evening. Events are organised as follows. <br> <br> <br>Exhibition viewing <br>================== <br> <br>From 5.30pm, a chance to view the South London Lettering Association's <br>Summer exhibition over a glass of wine in the Library's exhibition room. <br> <br> <br> <br>Annual general meeting <br>====================== <br> <br>At 6pm in the Bridewell Hall. <br> <br>Matters</p>
