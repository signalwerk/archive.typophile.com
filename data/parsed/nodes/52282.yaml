  html: <p>I've got a client who's trying to install some fonts on a couple of hundred computers (Yes :-) he purchased an MUL!), and is asking me if there's anyway to roll them out to all systems at once, from one location. An automated SCCM package? Other suggestions? Thanks!</p>
