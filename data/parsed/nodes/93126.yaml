  html: |-
    <p>I've been using Open Sans a lot lately, and I just wanted to thank Ascender Corp.'s Steve Matteson for making all ten variants of it, and to thank Google for commissioning it and making it available for free. It's friendly but professional, and I hope that one day it replaces Arial and others as the web's default sans.</p>
    <p>There, now at least I've paid a compliment, if not any money.</p>
