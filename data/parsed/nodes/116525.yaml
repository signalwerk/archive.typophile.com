      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VdV_1_4639.jpg"></div><p></p>
      <p>Jeroen Koning, who followed the EcTd 2012–2013 course, shows at the aforementioned exhibition the development of (DTL) VandenVelde, a digital version of the <em>Espagnola Bastarda</em>, which is a cursive ‘hand’ by Jan van den Velde (1568–1623). This is an extraordinary project, because instead of auto-tracing printed images from <em>Spieghel der Schrijfkonste</em> –an instruction book for calligraphers published by VdV in 1605– Jeroen is tracing the original letters line for line. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VdV_2_4254.jpg"></div><p></p>
      <p>An example of this time-consuming method is Jeroen’s tracing of ‘the hand with the quill’, an illustration from <em>Spieghel der Schrijfkonste</em>, which is according to Jeroen ‘<em>of unparalleled beauty</em>’. This beauty was very well captured in the digital version (above and below). </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VdV_3_5429.jpg"></div><p></p>
      <p>For the redrawing Jeroen uses the ‘Width Tool’ in Adobe Illustrator CC, which makes it possible to fully control the contrast and contrast-ﬂow of the curves. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VdV_4_3939.jpg"></div><p></p>
      <p>Subsequently the resulting vector lines were converted to outline vectors, which can be further enhanced in a font tool.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VdV_5_6096.jpg"></div><p></p>
      <p>The resulting digital type is becoming highly impressive, as can be seen in the preliminary version below.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/VdV_6_5189.jpg"></div><p></p>
