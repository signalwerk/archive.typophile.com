      <p>Midst November the <a href="http://www.plantingenootschap.be/en/type-design/" rel="nofollow">Expert class Type design</a> 2014–2015 course will start at the Museum Plantin-Moretus in Antwerp. It’s possible to <a href="http://www.plantingenootschap.be/en/inschrijven/inschrijven-expert-class-type-design/" rel="nofollow">subscribe</a> still.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/EcTd_booklets_1_4404.jpg"></div><p></p>
      <p>The course results in type designs by the students, either completely new from scratch or a revival that for instance is based on the unique historic material from the collection of the Museum Plantin-Moretus. The typeface has to be presented in a booklet with an accompanying text on the process. Above and below is a small selection of this year’s harvest.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/EcTd_booklets_2_6623.jpg"></div><p></p>
