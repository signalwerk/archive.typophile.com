    html: |-
      <p>&gt;   The difference between buying and licensing<br>
      &gt;   is the core of the VectorM’s question.</p>
      <p>there's absolutely no difference between the two<br>
      that is of relevance to any aspect of this question.</p>
      <p>not in the mind of this non-lawyer, anyway...</p>
      <p>&gt;   Again: it doesn’t matter who paid for the fonts.<br>
      &gt;   What matters is who is has a license<br>
      &gt;   to install and use the fonts.</p>
      <p>vectorm's client paid for the font, so the license<br>
      to install and use the font belongs to that client.</p>
      <p>the client let vectorm install and use the font to do<br>
      work for them, and now that he's done, he should<br>
      erase that font from his machine.  and the client<br>
      should be given the font they have paid to license,<br>
      since it appears that they do not have it presently.</p>
      <p>if vectorm thought the client would pay for the font,<br>
      but vectorm would get to have the license in his name,<br>
      then i'd say he is the one who is badly mistaken here...</p>
      <p>if vectorm hadn't billed the client specifically for the font,<br>
      but rather bought it using money from his own company,<br>
      and bundled the cost into his overall billing for the project<br>
      (in exactly the same way that he bundles the cost of his rent<br>
      and his computers and all his other overhead), then fine,<br>
      the license belongs to _him_ and not to the client, and he<br>
      has every right to explain this in great detail to the client.</p>
      <p>&gt;   No, if they would license the font in the client’s name,<br>
      &gt;   the studio would have no license to use the fonts<br>
      &gt;   for the design work in the first place.</p>
      <p>if font-designers want to try to enforce such silliness,<br>
      good luck...  but that can only erode the willingness of<br>
      your customers to actually do what's expected of them,<br>
      which will cause you even more problems down the line.</p>
      <p>-bowerbird</p>
