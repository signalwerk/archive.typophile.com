    <p>Hi there,</p>
    <p>I am basically interested in finding out more about (links would be great) fonts and its protection.</p>
    <p>I recently encountered a couple of situations with clients where they demanded the fonts/typefaces used. They wouldn't understand that we can't just give away $400+ family. Not to mention that costs can go up based on the users or system that will have this family installed. </p>
    <p>For one client we actually stated that the purchase of a single weight would be necessary since we were going after something extremely unique. Client here was billed for the project, and of course the font purchase was part of the whole cost. Now couple of weeks later, they want that font because they said they paid for it. They say that they shouldn't pay for a font that we would end up using for a future clients some time.</p>
    <p>Then last week 2 programmers were having a discussion with some designers like myself, on fonts and its protections. They were arguing in favor of:<br>
    • purchasing a font, deleting it from your computer, and giving it away to the client after completion of the project. They couldn't say much after somebody asked about what would happen if the designer was to do another job for them. What do client need to delete the font again, and send it to the designer?<br>
    • they were saying that since fonts are software, nobody, not even type foundries can put exclusive rights or laws to the fonts, like limiting users. They said that it doesn't matter that foundries want to add to their legal blurbs, it's software and one SHOULD be able to transfer or give away the font without having to purchase another copy of it.<br>
    • they basically said all that stuff about foundries charging more if 5 users will use the font rather than 1 or if 50 will instead of 10, is BS. They said nothing foundries want should be taken seriously because in the end they are software and nothing else.</p>
    <p>So, Can fonts be transferable? Can they be given away as long as they are deleted from the computer of the first user?</p>
    <p>If a clients pays for a service, and a font is bought and added to the cost of the project, could the designer/programmer end up giving the entire family away to the client before deleting the family from the computers of the designers/programmers?</p>
    <p>What are the exact laws surrounding transferring fonts? How do you people charge for fonts if a projects calls for something that news to be purchased? How do you deal with people that want the font? How do you protect yourselves from clients that request the fonts?</p>
    <p>Do type foundries have actual legal voice on this regard since the programmers we talked to said that they can come up with every rule/limitations on the usage but it has NO legal valu in the end.<br>
    Do type foundries ever find out about users that have done something against their copyright info?</p>
    <p>Thanx everybody for any possible input you might have.</p>
