      <p>First, if you want legal advice, HIRE A LAWYER. Do you know what smart people call guys who get their legal advice from the internet? Losers. Because when we end up in court with you, you lose, because we have the sense to hire a lawyer. At least pick up the Graphic Artists Guild Pricing and Ethical Guidelines. If you don’t learn to stop being lazy and thoughtless about legal issues now it’s going to cost you a lot of money one day.</p>
      <p>Second you should put your font licensing terms in the contract and have it worked out BEFORE the client signs it. Third, if you have a repeat client who insists that the font license be transferred back to them at the end of the job, don’t buy non-transferable font licenses when working with that client. If you really, really want to transfer the license, pester the designer to grant a non-transferable license.</p>
