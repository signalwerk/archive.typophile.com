      <p>One doesn't BUY a font. A font (or any other software) is LICENSED. Anyone who wants to use it needs to have a single license. So the fonts cannot be given to the client, even if they were charged for it. If the clients want to use it, they need to purchase their own license. </p>
      <p>Or if the font foundry would allow it: A transfer of the license from the studio to the client might be possible. But even this needs some written statement from the foundry. One cannot just give the fonts away like a book or something ...</p>
