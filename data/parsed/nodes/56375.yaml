      <p><em>Client here was billed for the project, and of course the font purchase was part of the whole cost. Now couple of weeks later, they want that font because they said they paid for it.</em></p>
      <p>I for one, being a simpleton, would think that the font licence now belongs to the client, not to the studio (i.e. the studio purchased the font on behalf of the client). The client then should ensure that their usage is in accordance with the original licence, or upgrade it as needed. The studio would not be allowed to keep a copy of the font for their own use. The client however could allow the studio to use the font for their own jobs.</p>
      <p>In other words, you cannot have your cake and eat it too.</p>
