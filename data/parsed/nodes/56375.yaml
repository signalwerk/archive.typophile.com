      <p>Seems as if everything here should be clearly called out in your contract with the font supplier (ie the font EULA you agreed to) and your legal contract with the client (which you also agreed to). </p>
      <p>If you want to extract yourself from these legal obligations then you probably need to talk to an attorney and not a bunch of font geeks or programmers. </p>
      <p>If your contract with the client calls for fonts along with all other assets to be handed over to them, and the font EULA does not allow for transfers then you're best bet would be to refund the client the cost of the license or simply license it on their behalf.</p>
