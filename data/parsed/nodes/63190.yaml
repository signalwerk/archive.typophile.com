    <p>Can anyone tell me what foundry produces the top version of Copperplate - if it is indeed Copperplate? The bottom version is the Adobe version - the B and N are wider but the V is narrower and the serifs are more squared off in the top version.</p>
    <p>tia</p>
    <p>pbc</p>
