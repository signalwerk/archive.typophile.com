      <p>I think this is a tough one, because you have each version of Copperplate Gothic with the uppercase Caps and lowercase Caps (SC). One of these might be either one of those blown up to seem like the same height. There are nine different <a class="freelinking-external" href="http://new.myfonts.com/fonts/adobe/copperplate-gothic/?testdrive=custom%3D0%26dock%3Dfalse%26size%3D124%26w%3D720%26src%3Dcustom%26text%3DBNV%2520bnv%26fg%3D000000%26bg%3Dffffff%26goodies%3Dsingle%26seed%3D32">Adobe versions</a>, yielding 18 sets of letters. There are of course many other foundries with versions of CG. On top of that, someone may have done some graphic manipulation on some of the letters.</p>
      <p>My question is really what are you looking for? (And yes, they are both Copperplate Gothic in origin, even though some foundries may call their font by another name.)</p>
      <p>- Mike Yanega</p>
