      <p>Very odd that the thickness on the “V” in the top row is so different from that of the “B” and “N”. The difference in the serifs is another red flag, in my opinion, that someone has been playing around with each letter. The “V” in the top row is really the oddball here and reminds me of the Sesame Street segment ’which of these things doesn’t belong?’.</p>
      <p>If I had to guess I’D say someone set the top row in Copperplate, pulled the top of the “V” apart and messed around with the serifs on the “B” and “N”.</p>
      <p>Small Caps could very well be at play here as Mike so accurately pointed out.</p>
