    <p>Does anyone know which typefaces are these? The one in "Modern Top-Down Knitting" and the one in the name of the book's author "Kristina McGowan". Is this one "Neutraface"? And the other, in the title of the book? It looks like a modern typeface, but which one?</p>
    <p><a href="http://www.knitgrrl.com/images/ModernTopDownKnit_KM.jpg" title="http://www.knitgrrl.com/images/ModernTopDownKnit_KM.jpg">http://www.knitgrrl.com/images/ModernTopDownKnit_KM.jpg</a></p>
    <p>Thanks!</p>
