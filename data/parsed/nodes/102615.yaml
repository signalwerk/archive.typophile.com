    html: |-
      <p>More likely, the jagged look is due to the sample having been set on a coldtype/strike-on machine, such as a Varityper. If so, the typeface used would probably be Varityper's equivalent of Futura Bold Condensed.</p>
      <p>You can mimic the sloppy effect in Photoshop or similiar by selectively applying Gaussian blur, then adjusting levels to pure black and white.</p>
