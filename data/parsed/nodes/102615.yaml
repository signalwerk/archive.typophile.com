    <p>Forgive this newbie, I know very little; just beginning to learn. Sample is low quality; no lowercase given as only uppercase is needed. Scanned from early 70s era source. Manual typesetting given the jagged look, correct?  That has a certain appeal; unknown if the typeset 'sloppy' effect can be mimicked.  Thanks for any help.</p>
