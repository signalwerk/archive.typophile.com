    html: |-
      <p><cite>Most professional designers would strongly prefer not to use Arial</cite></p>
      <p>Yes, because of the controversy, not because of its design. Professional designers wouldn't touch Comic Sans either while it's not a bad typeface for comic books.</p>
      <p><cite>but anyone who would use (gasp, shudder) Arial for anything important is showing he has no taste.</cite></p>
      <p>I'm personally convinced this is a placebo effect. If Arial was just another typeface without all the funny business with licensing etc. which made it controversial, I don't think as many people will dislike Arial. It's also a strange practice to compare it to one other typeface and consider Arial to be of poor taste simply because it doesn't look like the other typeface. I'm not accusing you of this, but it's very common among people who actually don't know much about type. The fact that we type designers also get affected by this controversy is painful to me to see.</p>
      <p>I tend to avoid Arial because of the controversy, not because of the design. I have to say though, it has never been a particularly beautiful typeface to me, but there are many typefaces like that. There's plenty to dislike about Helvetica as well. In fact, whoever uses Helvetica likely has no taste either. Not that's it's distasteful, but usually it's not a design-conscious choice to select Helvetica. It's the placebo effect again, where people will use it simply because they hear it's good. It's not, but it's very hard to alter the reputation of a typeface.</p>
      <p>I don't think it can be said that Studio Dumbar has poor taste either. It's one of the best design agencies of the Netherlands and among the top design agencies of the world. Obviously that doesn't make each and every one of their choices objectively good, but it does show how Arial can be used well and I appreciate the fact that the agency doesn't seem affected by what the mainstream thinks. It's our job to create trends, not to let the mainstream restrict our design decisions.</p>
      <p><cite>And I've seen many corporations specify Arial because they know that every employee and vendor already has it.</cite></p>
      <p>And probably this is a primary reason for selecting Arial, but there were several other options for free and/or default fonts.</p>
      <p>I also have to say I think Arial is actually a better typeface, technically. It's more legible due to the greater variety in letter shapes, the hinting is far superior to Helvetica (Helvetica renders horribly on the web in Windows environments) and in Helvetica I can see it's not designed by a proper type designer while Arial is. I can see why people prefer Helvetica though, because there are more alignments so it looks more orderly, but this is also why it's not a good typeface for body text. You may dislike Arial aesthetically but it's technically better than Helvetica. Saying anyone who uses Arial for anything important is rather silly in my opinion.</p>
