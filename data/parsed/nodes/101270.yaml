      <p>@altsan:<br>
      <cite>Although it seems odd that they'd then put Times on their 'best' list when it's almost as overused and abused as Papyrus and Arial...</cite></p>
      <p>Well, if Copperplate Gothic was chosen not because of its quality, but because of its use, that might make sense. But if you go back to 1969 in your imagination, when Times Roman existed in quality authentic forms and was used well, I think it stands up to comparison with Caslon and Baskerville... and thus it <em>should</em> be on a list of the best typefaces of all time.</p>
      <p>Even if some of the digital versions today wouldn't be that far out of place on a list of the worst ones either.</p>
      <p>But a list of the "worst typefaces" is sort of like a list of the worst comic books or the worst movies - those lists never seem to include the <em>really bad</em> ones, only the bad ones from sources that should have known better.</p>
      <p>Thus, you won't find <a class="freelinking external" href="http://fontforge.org/sfds/index.html" rel="nofollow">Caslon Roman</a> - or, more appropriately, the typeface from which it is derived (and I don't mean Caslon) - on a list of the worst typefaces of all time. Not that I fault George Williams; I praise his effort in making available a Unicode font with a wide character range for free.</p>
      <p>But the face itself is based on older Chinese and/or Japanese versions of the Latin alphabet, made without the proper cultural basis for the aesthetic of the Latin script. It is hideous in appearance, to put it briefly.</p>
      <p>And then there's Fifteenth Century, now known as Caslon Antique. Before we had Comic Sans to kick around, that one used to get a lot of criticism from typographers.</p>
