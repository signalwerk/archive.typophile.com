      <p>One could argue that it's perfectly acceptable for a professional designer to use Monotype Grotesque where it is appropriate, but anyone who would use (gasp, shudder) Arial for anything important is showing he has no taste.</p>
      <p>And it's also possible to say that this position is one of mere snobbery.</p>
      <p>But it is legitimate to say that Monotype Grotesque was, like other typefaces, designed to look good... and it could hardly have been improved by being thrust into the Procrustean bed of Helvetica metrics. If you want a sans-serif face more suitable to body copy than Helvetica, there is Univers!</p>
      <p>Arial isn't all that terrible, though, and even if one can make an ironclad case that there is almost never a case where Arial is best if Monotype Grotesque, Univers, and Helvetica are available, lots of people do not have lots of typefaces available (not having bought a Corel product for the Bitstream collection) and just use what was built into Windows.</p>
      <p>It is, I suppose, an entirely legitimate part of a professional graphic designer's job to make his work not look like it was done by Joe Average on a laser printer, and that means avoiding overused faces even though there is nothing bad about them. But this is about something other than pure aesthetics, and when that fact is not noted, arguments result from the confusion. Times Roman doesn't look different because of how many other people are using it, but typography is also used as an exhibition of status.</p>
