    html: |-
      <p>Most clients don't know or care about the controversial history of Arial, and the don't know that Copperplate Gothic is archaic. They also think Comic Sans is a quirky font to use on their cousin's birthday invite. </p>
      <p>Professional designers primarily focus on finding a solution that is in line with what the client wants and is paying for. They can steer a client in a certain direction and influence what the client wants, but if a large government or corporate body comes to them and says 'we need to use Arial for consistency with existing material' then that's what is used.</p>
      <p>It can seem heart breaking. But for a large branding you're going to need fall backs and Arial is the best in the business at being the backup/emergency/alternate typeface for any corporate. You know it's going to be on any computer that company owns - so if you add it to the brand guide as an alternate for that beautiful modern sans font, you can be guaranteed that when random office admin is using the brand guide for end of year party invites on their home computer... that they will at least use Arial rather than pick some other random font their daughter installed on the machine from Dafont, or heaven forbid... comic sans...</p>
      <p>I find lists like this often seem to be as much about fashion as quality... Sometimes the two align...</p>
