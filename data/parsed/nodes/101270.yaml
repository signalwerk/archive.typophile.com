      <p>Articles like these really annoy me because it perpetuates flawed ideas on typography coming from the mainstream rather than making informed judgements on these typefaces. For example, while I agree with some of the statements on Copperplate Gothic, it seems really silly to criticize a glyphic, industrial-inspired typeface designed more than 110 years ago for not being inspiring to the modern viewer. Would we expect it to? It's not like we're marvelling on the modernism of Akzidenz Grotesk either.</p>
      <p>"but it has made it on this list because it is so madly overused by the amateur or lazy designer, often thrown onto a page because it has that "basic blocky text" look to it. Professional designers find Arial quiet nauseating."<br>
      Do you find this to be true? From my experience it's not like that at all. A professional designer wouldn't use Arial because it has that "basic blocky text" look to it, or I would argue the designer is seriously lacking in knowledge and judgement (but then I've also seen professional designers make the most laughable remarks about Helvetica in the Helvetica documentary, so who knows.), but a professional designer would use Arial when applicable. I know in this context Arial wasn't necessarily selected just for its design, but the government of Rotterdam uses Arial for its branding and I'm actually damn glad they didn't use Helvetica. <a href="http://studiodumbar.com/work/city-of-rotterdam" title="http://studiodumbar.com/work/city-of-rotterdam">http://studiodumbar.com/work/city-of-rotterdam</a></p>
      <p>The article features a picture that says "Arial. The perfect way to show that you just don't care." Helvetica often seems to fit that statement as well, possibly more so than Arial. It's not the average user but the amateur designers who think Helvetica is the designer's choice and therefore make a judgement based on misinformation. In fact, it's this same misinformation with which articles like these are written.</p>
      <p>I can see the tradition of judging typefaces on their popularity rather than its design and application, which I think is a sad practice. This way the mainstream tends to outlaw typefaces which were perfectly fine before they started misusing it. I would rather educate people on the use of certain typefaces than ban these typefaces for its misuse, which is particularly the case with Comic Sans. The shirt that says "I love to hate Comic Sans" actually seems to be the sentiment of the bancomicsans movement. It's not that the website is so bad, but it's just wonderful to hate something together because it validates your taste, even if that taste was influenced by the movement in the first place.</p>
      <p>If it's all about popularity and application then I tend to put Trajan on the bad list. "Some designers criticise its over-use in the movie industry - it has even earned the nickname "the movie font" - but it rarely looks bad and can always sell a movie!". It rarely looks bad, but it almost always looks contextually bad.</p>
      <p>Where does that practice come from anyway? You would think for movies there is a budget to hire a professional typographer and type designer and do something with the title of the movie. Something different from putting a glyphic roman typeface on a poster about Egyptian mummies; something different fom using a glyphic roman typeface for a British ship from 1912. Neil deGrasse Tyson complained about the sky in Titanic in the scene after the Titanic sank not being the correct one and a portion of it being mirrored (<a href="http://news.discovery.com/space/astronomy/neil-degrasse-tyson-tightens-titanic-accuracy-120402.htm" title="http://news.discovery.com/space/astronomy/neil-degrasse-tyson-tightens-titanic-accuracy-120402.htm">http://news.discovery.com/space/astronomy/neil-degrasse-tyson-tightens-t...</a>) and it was fixed. I feel like our knowledge should be valued more, and perhaps we should be more expressive about the mistakes in typography. I think we're relatively humble while I don't necessarily feel a reason to be.</p>
      <p>Also, there was no mention of Futura being used in the fashion industry. I don't think the author of the article looks at fashion magazines.</p>
