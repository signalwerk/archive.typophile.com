    <p>Found this page</p>
    <p><a class="freelinking external" href="http://absolutegraphix.co.uk/bestworstfonts.asp?strID=Guest" rel="nofollow">http://absolutegraphix.co.uk/bestworstfonts.asp?strID=Guest</a></p>
    <p>by that title.</p>
    <p>Most of the list is not that unreasonable. However, including Verdana and Myriad on the "best" list while not including, oh, say, Caslon (or Baskerville, Optima, Century Schoolbook, or Palatino, or many others) seemed to me to be favoring the recent too much (among recent ones, there's Stone... typefaces that happen to be on everyone's computer shouldn't be the only ones considered)... and I couldn't see the justification for listing Brush Script and Copperplate Gothic among the "worst", even if I wouldn't argue too much about the other three choices there.</p>
