      <p><cite>Professional designers wouldn't touch Comic Sans either while it's not a bad typeface for comic books.</cite></p>
      <p>No. Comic Sans is a terrible comic book typeface. If you want a real comic book typeface, go to <a class="freelinking external" href="http://www.comicbookfonts.com/" rel="nofollow">Comicraft</a> or <a class="freelinking external" href="http://www.blambot.com/" rel="nofollow">Blambot</a>. <a class="freelinking external" href="http://canadatype.net/" rel="nofollow">Canada Type</a>, a foundry producing fonts for conventional typefaces, even makes <a class="freelinking external" href="http://canadatype.net/fonts/classic-comic" rel="nofollow">some</a> <a class="freelinking external" href="http://canadatype.net/fonts/caper-comic" rel="nofollow">good</a> <a class="freelinking external" href="http://canadatype.net/fonts/captain-comic" rel="nofollow">comic</a> <a class="freelinking external" href="http://canadatype.net/fonts/collector-comic" rel="nofollow">book</a> <a class="freelinking external" href="http://canadatype.net/fonts/common-comic" rel="nofollow">typefaces</a>.</p>
      <p>This is a sufficiently specialized field that the handprinted faces you find on legitimate free font sites like Dafont aren't generally usable as comic book faces. There are a very few legitimate free ones, like Odaballoon, in addition to those from Blambot.</p>
