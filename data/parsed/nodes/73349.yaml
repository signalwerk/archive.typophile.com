    html: <p>It's very difficult to read. It looks like it says "The Chew Black". Get rid of some of those curves and perhaps watch how you join the letters together. Also, the link between the C and the K in "Black" looks wrong... the curve of the C doesn't fit well with the K. The C also looks too wide compared to the rest of the letters.</p>
