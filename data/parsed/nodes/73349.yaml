      <p>For the 'CK' connection, what about extending the 'C' when it becomes tangent to the top arm of the 'K'? This would smooth out the curve considerably. You may need to go with a T-junction in the 'K' arms rather than the V that you have now.</p>
      <p>I also think that the 'N' doesn't work. Maybe move "THE" up.</p>
      <p> - Lex</p>
