      <p>NATIONAL BUILDING.. looks like Engraver's Gothic. </p>
      <p>The bottom sample doesn't come too close to any fonts I can find (the original was probably not a digital font, right?), but I though perhaps <a class="freelinking external" href="http://new.myfonts.com/fonts/emtype/geogrotesque/" rel="nofollow">Geogrotesque</a> might have enough weights to allow creating a faux shadow font by layering, and to replicate the plain sans type by using a little graphic manipulating to flatten or narrow, as needed.</p>
      <p>- Mike Yanega</p>
