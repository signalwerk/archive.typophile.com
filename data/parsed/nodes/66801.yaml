      <p>NATIONAL BUILDING.. looks like Engraver's Gothic. </p>
      <p>The bottom sample doesn't come too close to any fonts I can find (the original was probably not a digital font, right?), but I though perhaps <a href="http://new.myfonts.com/fonts/emtype/geogrotesque/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Geogrotesque</a> might have enough weights to allow creating a faux shadow font by layering, and to replicate the plain sans type by using a little graphic manipulating to flatten or narrow, as needed.</p>
      <p>- Mike Yanega</p>
