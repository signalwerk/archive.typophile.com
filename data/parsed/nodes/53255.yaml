      <p>The default form of the colon sits on the baseline in &gt;98% of those high-quality typefaces which have a lower-case.</p>
      <p><cite>Haven’t some typeface designers begun to include a “caps colon” in the character set?</cite></p>
      <p>When I read that question, I was thinking that the newer Adobe Originals have indeed done so (including my own Hypatia Sans). But when I checked Arno and Hypatia Sans, it is not there.</p>
      <p>A question arises: does one do a caps semicolon as well? Or accept that the semicolon and the colon will align differently in the caps? I ask because although a centered cap colon seems fine, in my mind I'm thinking a centered semicolon would look awkward. I'll be curious to try it and see if it is indeed problematic.</p>
      <p>Regards,</p>
      <p>T</p>
