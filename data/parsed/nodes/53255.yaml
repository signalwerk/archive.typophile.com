      <p>"I was asking if there was anywhere where it actually states this as a rule"</p>
      <p>Okay, Open up Word. Type a sentence in 5 fonts with a colon in them. ;)</p>
      <p>"She’s not buying it though."</p>
      <p>Okay, Open up Word. Type a sentence in 50 fonts with a colon in them. ;)</p>
      <p>I don't think there is a rule anywhere better displayed that says "The colon is a multi-case glyph aligned to work best with all three major character groups; uppercase, lowercase and figures. In order to not appear high as a kite with lowercase, it is not centered vertically among the figures and Caps, but instead, the bottom jot matches the period, and the top jot aligns to the x-height."</p>
      <p>Specialty colon characters can be made at any time for use in digital clocks, special tables and all cap uses.</p>
      <p>Cheers!</p>
