    html: |-
      <p>Well, at some level, it all a matter of convention. Why does any letter -- or punctuation -- look as it does? You can go back to scribal writing and find periods that are centered. If you look at the 42-line Guttenberg Bible (1455), the colon is on the baseline (except there was no "baseline" with metal type.)</p>
      <p>Pressing on, the Cicero : <cite>Letters,</cite> printed by Sweynheym and Pannartz, Rome, 1470, have a more-or-less "centered" colon. However, the <cite>Letters</cite> printed by de Spira, Venice, 1469, show a "baseline" colon. Of course, both of these printers were German, but moved to different cities in what is now Italy. </p>
      <p>Noinus : Peripatetica, Jensen, Venice, 1476, seems to use a baseline colon. </p>
      <p>Froissart : Chroinques, de Tournes (Lyons, 1559) uses the "centered" colon.</p>
      <p>By in Large, the vast majority of printers used a "baseline" colon. But if you want to find a few instances of the "centered" colon, you can.</p>
      <p>So your client is passing strange, but not completely wrong, unless she is using a type where the type designer decreed a baseline colon. The answer is simple: change typefaces.</p>
      <p>FWIW</p>
