      <p>When you say "old", what time are you talking about? (In other words Kepler (1996), for example, may have been developed later than the logo.)</p>
      <p>Your image is way too blurry to make an ID, other than a rough guess. Right now I think this looks closer to <a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/century-expanded/" rel="nofollow">Century Expanded</a> than Bodoni.</p>
      <p>- Mike Yanega</p>
