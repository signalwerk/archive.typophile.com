  html: "<p>Hello, I'm typesetting a book and after proof-reading it I found quite a few repeated words beginning or ending consecutive lines. My question is: how would you solve this? What are my options? Adding line breaks? Hyphenating words? Adjusting the space between words? Which of these options is the best? You can see an example below. Thanks. :)</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/typesetting_problem_4107.jpg\"></div><p></p>"
