    html: |-
      <p>My practice is to define some alternate (paragraph/text)styles with tighter and looser wordspacing and a tad of horizontal scaling. In case of problems like yours I apply one of these styles to that line or the ones before it. Easy peasy.</p>
      <p>Tip: make them 'daughter'styles of your main textstyle.</p>
