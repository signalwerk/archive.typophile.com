    html: |-
      <p>The usual rule is that a "word stack" occurs when the same word ends or begins three successive lines. It does make reading more difficult -- you get lost, even with small words like "the" (which is obviously not hyphenateable).</p>
      <p>Whether you hyphenate or force breaks is always a matter of compromise; there is no general rule, what you pick will vary from case to case. In this paragraph for example, even if you take "Dr." down, the line below was a bit loose, so Dr. might fit, depending on your justification settings. "primeiros" has two hyphenation points I believe: pri-mei-ros. You might have to use one for one line and the other for the other.</p>
      <p>As to word spacing: you are getting about 10 spaces per line. They have to bear all the expansion/contraction needed for justification, unless you are also using a bit of whitespace addition/subtraction with the letters themselves (usually not a good idea). If the ideal wordspace is about .25 ems, you can see that any word taken down which is 2.5 ems long is going to double that space. You can figure that the average letter is about .4 ems in width, so taking down a 6+ letter word is going to get you a .5em wordspace (on the model that it was .25 ems before).</p>
      <p>Composition is always about compromise, so the fewer kinds of line breaks you allow, the more even word spacing is going to suffer. As a professional typesetter, I often run into the notion that "we want GOOD composition. Therefore, only two hyphenations in a row, no word stacks, don't hyphenate the last word of a paragraph," and on &amp; on. Where do they think line justification comes from? Now if you let me rewrite the copy . . .</p>
