    html: <p>Ok, I got it, actually the example I posted wasn't the hardest one. It's a trial and error situation, I choose a point where to insert a forced line break before or after the repeated words, it's boring, but it works. Things get pretty nasty when adding a line break creates an orphan, then you have to undo and try a different place... Thanks for your answers. :)</p>
