      <p>One site I like to recommend for Photoshop learners is Bert Monroy's Pixel Perfect;</p>
      <p><a href="http://revision3.com/pixelperfect" title="http://revision3.com/pixelperfect">http://revision3.com/pixelperfect</a></p>
      <p>And of course Russell Brown has a nice collection of Photoshop tips &amp; techniques too;</p>
      <p><a href="http://www.russellbrown.com/tips_tech.html" title="http://www.russellbrown.com/tips_tech.html">http://www.russellbrown.com/tips_tech.html</a></p>
      <p>Besides those, I guess mr.google can recommend tigs of 'the other kind' such as good-tutorials;</p>
      <p><a href="http://www.good-tutorials.com/" title="http://www.good-tutorials.com/">http://www.good-tutorials.com/</a></p>
      <p>Illustrator Techniques dot com is the most recent high quality site for your vector needs; </p>
      <p><a href="http://www.illustratortechniques.com/" title="http://www.illustratortechniques.com/">http://www.illustratortechniques.com/</a></p>
      <p>__________<br>
      Hiro</p>
