    <p>Hi all, </p>
    <p>Im after some feed back on my little display face. Its based on a circular modular grid. Its pretty simple but the idea is I will laser cut some characters and then letterpress them at about 12"/25cm, and have a play with the letter forms and not the entire font.</p>
    <p>Thanks for the time and help.</p>
    <p>Theo.</p>
    <p>ps, Ill be letterpressing these on Friday so if people are interested Ill stick some images up. ; )</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1grids_small_circles-01_5235.jpg"></div><p></p>
