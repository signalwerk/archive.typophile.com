    html: |-
      <p>Nice work. I like the organic shape these letters take on. I'm not certain the title 'Geometric Typeface' necessarily fits this work though. I understand why you've chosen that name but this work doesn't share any similarities with Futura or other similar fonts that are truly geometric fonts.</p>
      <p>The 'lowercase b, d and h' have very short ascenders that end abruptly, consider adding some height to those ascenders. The 'lowercase k' is my least favorite glyph, while the 'lowercase t' is one of my favorites.</p>
      <p>Keep at it, looking really nice.</p>
