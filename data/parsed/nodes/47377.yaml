      <p>We have a recorded Universal Type Server webcast, as well as another live webcast coming on July 22 at 11 am Pacific.  View or register <a class="freelinking external" href="http://www.extensis.com/en/support/webcasts/" rel="nofollow">at the Extensis site</a>.</p>
      <p>You may also want to check out <a class="freelinking external" href="http://www.it-enquirer.com/main/ite/more/uts/" rel="nofollow">this independent review by IT Enquirer.</a></p>
      <p>Re: font caches, Type Server stores them locally in the library folder of the user's machine, hidden and "in disguise" to prevent users from accidentally accessing and deleting them.</p>
      <p>Cindy Valladares<br>
      Product Marketing Manager, Extensis</p>
