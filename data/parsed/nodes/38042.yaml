    <p>In a few weeks I will be in <a href="/wiki/New%20York%20City" class="freelinking" rel="nofollow">NYC</a>.<br>
    Can anyone tell me about nice bookstores specialized in graphic design and typography?</p>
    <p>Thanks a lot</p>
