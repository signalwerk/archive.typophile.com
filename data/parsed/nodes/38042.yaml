    html: |-
      <p>ZAKKA is always good, although it just moved from Manhattan out to Dumbo in Brooklyn –&nbsp;really close to Manhattan though, so don't let that deter you.</p>
      <p>They have a fantastic design book + magazine collection + some great tshirts and a huge selection of Japanese (I think) publications, toys, and apparel.</p>
      <p><a href="http://www.zakkacorp.com/" title="http://www.zakkacorp.com/">http://www.zakkacorp.com/</a></p>
      <p>Also, I think PHAEDON just opened a store in soho... or one of those big name design book publishers... I want to say it is on West Broadway somewhere between Grand St. and Spring Street.</p>
      <p>Have fun!</p>
