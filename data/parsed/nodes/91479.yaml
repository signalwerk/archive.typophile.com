    html: |-
      <p>hrant, the second isnt really based on anything except perhaps the strange thread of design that started out as German Sans and ended up becoming American Urban.</p>
      <p>The original is available here, free for anyone and all purposes except for being sold as a font:</p>
      <p><a href="http://www.dafont.com/mob.font" title="http://www.dafont.com/mob.font">http://www.dafont.com/mob.font</a></p>
      <p>The version in the pic above is a slight refinement of the font.  As well as better letter spacing and few small tweaks, I suppose the biggest factor in decided to refine it was the lower case g.  I go back and fourth over whether I like the top right hand "corner" of that glyph more square, as it is in version 1.0, or more rounded as I am working on in version 2.0.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2gs_6406.png"></div><p></p>
