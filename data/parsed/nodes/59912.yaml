    html: <p>Having the head of Atlas in white negative space separates it from the body and connects it with the space between the shoulders and the earth, creating a bull horns shape. Perhaps if all of the Atlas figure were in one color and all of the earth in the second color it would help differentiate between the two. And a more recognizable world would help to clarify your mark. Why did you choose blue and gray? Typically these are more corporate/business/tech colors. I’m guessing you want to stay away from red, white and blue, which many political organizations use. Everything about your mark looks slick for what sounds to be a grassroots organization, that’s not to say you have to swing the complete other direction and create something folksy but in it’s current state the design doesn’t suit your mission.</p>
