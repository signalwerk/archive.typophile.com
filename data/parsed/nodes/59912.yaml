      <p>i see bull horns</p>
      <p>i think your problem is you’re too stylized at the moment. if you’re serious about the ’atlas’ theme i think you’ll have to make it more literal mainly because the link between the theme of the logo and the political organisation is a tenuous one.</p>
      <p>when people think of a political organisation they won’t immediately think of atlas, therefore stylizing your logo to the degree that you have weakens your design as they’re not expecting to see atlas, making it too difficult for the viewer to interpret the message you’re trying to communicate.</p>
      <p>a more literal logo is a better route because although the viewer might not expect to see an atlas themed logo, their brains don’t have to work too hard at figuring out what they’re looking at.</p>
      <p>hope that helps</p>
