    <p>Hello, I’ve only recently begun to really get into logo design and this site has been very inspiring and helpful. Thanks to everyone.</p>
    <p>That said I’m working on a logo for a political organization that I’m a part of called Be Somebody Mobile. Mobile, AL being the city in which the organization resides. Our purpose is to get people involved in their local and state politics when they may normally think they can’t do anything or it is too overwhelming. “Somebody needs to do something about the x problem” Well, be somebody.</p>
    <p>We advocate limited government and individual liberty. I chose atlas as the logo mark because it represents responsibility and oppression, and as an added bonus can be a subtle acknowledgment of Ayn Rand’s book “Atlas Shrugged” which communicates a lot of ideas that we hold. </p>
    <p>The problem I’m finding is that no one sees atlas in the mark until I tell them. I’ve gotten anything from a bird pooping to a cyborg kitty bent on world domination... So I guess I’m looking for ideas of how to keep the stylized look I have, yet convey the idea of Atlas without being too literal. Here is the logo and a few of the evolutions of the mark:</p>
    <p><a class="freelinking-external" href="http://www.jreydesign.com/artwork/besomebody/atlas_evo.gif">http://www.jreydesign.com/artwork/besomebody/atlas_evo.gif</a></p>
