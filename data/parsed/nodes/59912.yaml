    html: <p>I now see a figure holding something but I’m not sure what. Could be a logo for a fitness center as much as anything else. Initially I liked the Atlas concept, thought it was clever and seemed to convey your message but perhaps what the design is suffering from is being too clever. I may be in the minority but in envisioning Atlas I think of carrying the weight of the world on one’s shoulders. I’ve got enough on my plate, the thought of adding the weight of the world is not going to inspire me to join a grassroots program. It’s a difficult concept you are trying to illustrate with your design, and it’s obvious you’ve put a lot of time into it but, perhaps you should think of exploring other avenues. Also “Be Somebody Mobile” gives the initial impression it’s for a cell phone service, you might want to include the AL.</p>
