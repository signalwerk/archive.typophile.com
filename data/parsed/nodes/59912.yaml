      <p>Yeah, I have been experimenting with handling the head differently. I will give that a try. </p>
      <p>About the color. You’re correct about avoiding red white and blue. I chose blue because it is still one of the national colors, but also sends a message of being current and not old-timey (or so I thought).  I’m trying to balance being new and fresh with also having some legitimacy, if that is the right word. The grey? I thought it looked slick, but perhaps I can try some other combos. </p>
      <p>We are definitely grass roots but we don’t want to send the message that it will be a lot of really tedious/hard work and we are trying to use technology to make contacting representatives and keeping track of legislation easier and modern.</p>
