    html: |-
      <p>Paul, I believe you'll find that information on the actual paper documenting the standard. PDFs here: <a href="http://www.unicode.org/versions/Unicode4.1.0/" title="http://www.unicode.org/versions/Unicode4.1.0/">http://www.unicode.org/versions/Unicode4.1.0/</a></p>
      <p>Examples from the European Alphabetic Scripts section:</p>
      <p><strong>Letters of the Latin-1 Supplement: U+00C0–U+00FF</strong> (p. 167)<br>
      The languages supported by the Latin-1 supplement include Danish, Dutch, Faroese, Finnish, Flemish, German, Icelandic, Irish, Italian, Norwegian, Portuguese, Spanish, and Swedish.</p>
      <p><strong>Latin Extended-A: U+0100–U+017F</strong> (p. 168)<br>
      Most languages supported by this block also require the concurrent use of characters contained in the Basic Latin and Latin-1 Supplement blocks. When combined with these two blocks, the Latin Extended-A block supports Afrikaans, Basque, Breton, Catalan, Croatian, Czech, Esperanto, Estonian, French, Frisian, Greenlandic, Hungarian, Latin, Latvian, Lithuanian, Maltese, Polish, Provençal, Rhaeto-Romanic, Romanian, Romany, Sami, Slovak, Slovenian, Sorbian, Turkish, Welsh, and many others.</p>
