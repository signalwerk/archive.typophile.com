  html: <p>Does anyone know where I can find what languages are covered by what <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> blocks. For example, Is there a list somewhere that tells what languages Latin 1 + Latin Extended A will cover? I assume this is on the Unicode website, but i haven't seen a more unnavigable site in my life. if anyone can link me to this info, i'd appreciate it.</p>
  html_clean: <p>Does anyone know where I can find what languages are covered by what <a href="/wiki/Unicode" class="freelinking link-lost" rel="nofollow">Unicode</a> blocks. For example, Is there a list somewhere that tells what languages Latin 1 + Latin Extended A will cover? I assume this is on the Unicode website, but i haven't seen a more unnavigable site in my life. if anyone can link me to this info, i'd appreciate it.</p>
