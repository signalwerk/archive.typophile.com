  html: <p>Are there any FontLab users out there that know how to round corners for all the glyphs in a font without changing the weight of the glyph? There is no simple transform that does this&nbsp;function.</p>
  html_clean: <p>Are there any FontLab users out there that know how to round corners for all the glyphs in a font without changing the weight of the glyph? There is no simple transform that does this&nbsp;function.</p>
