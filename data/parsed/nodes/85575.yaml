    html: <p>I've been using Frederick's UFOstretch tool, and have been very impressed with it, so am looking forward to trying RoboFont. My primary workflow, though, relies heavily on Windows-only software (VOLT and VTT), so RoboFont will need to be very significantly better than Windows FontLab before I'd consider making it my primary design tool (and then I'd have to invest in a lot of new hardware, because I couldn't face full time type design on a 13" MacBook screen). Where I see RoboFont being most useful for me in the immediate future is for making edits to sources that are already in UFO format for use with UFOstretch, MetricsMachine, Prepolator and Superpolator.</p>
