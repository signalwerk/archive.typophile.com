      <p>A few days ago, I paid my €400 for Robofont. I don't know much about it. I haven't used it yet. Maybe I won't for a few months. Maybe I won't use it on release-quality work for a year.  </p>
      <p>The type-design world is a lot smaller than the graphic-design world. The economics of software development are commensurately more difficult. For me, that €400 is not a payment for software that's necessarily useful in its current form, but rather a down payment on what Robofont can become. If nobody invests in Frederik's work, Frederik will find something else to do with his time.</p>
      <p>Also, that €400 is indirectly a way of supporting Erik, Just, and Tal's work on Robofab and UFO. I get a ton of value from Robofab. I paid nothing for it. The fact that Robofont relies heavily on Robofab &amp; UFO gives me confidence that it will go somewhere. Maybe I'll turn out to be wrong. But I'd hate to see a worthy project die of starvation in its infancy.</p>
      <p>Glyphs may be great. I haven't tried it. Maybe I will. But Georg Seifert is a consultant for Fontlab, so he has a sponsor for his work. I'll continue to be a paying Fontlab customer, so I'm indirectly supporting his work too. It seems inevitable that ideas from Glyphs will find their way into FLS. </p>
      <p>In general, I think that fontmaking tools are underpriced, relative to the value any professional type designer gets out of them. Frankly, if Fontlab had asked me for that €400 a year ago to fund the work on FLS 6, I would've gladly forked it over. </p>
      <p>Before you say "that's crazy," nobody in the design world seems to have a problem shelling out to Apple for new laptops and Mac Pros every few years. But mostly, your hardware sits around waiting for you to do something. Better productivity is determined largely by software quality, not hardware quality. And if no one wants to pay for better software, it will never appear.</p>
