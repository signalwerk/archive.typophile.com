    <p>It's the talk of ATypi 11 and the Twitterverse, so let's talk about it here.<br>
    <a class="freelinking external" href="http://doc.robofont.com/" rel="nofollow">RoboFont</a> was released last week. It is a new font editor that runs on a Mac. It works with the UFO format. I'd love to hear testimonials about what it does and doesn't do, what it does better than preexisting tools, and so on.</p>
