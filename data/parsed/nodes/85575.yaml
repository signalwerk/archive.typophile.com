      <p>I've had the privilege of talking to Frederik Barlaen for a few hours after his excellent presentation in Iceland. RoboFont is a solid piece of work. </p>
      <p>My short description of it would be: it focuses on drawing glyphs, and acts as a switchboard for UFO-based projects. It also is extensible through Python, so plugins can be created.</p>
      <p>RoboFont largely seems to follow a traditional approach for designing type: you have a font window, a glyph window, a metrics and kerning window. So any user familiar with Fontographer or FontLab Studio will find many similar concepts. It does introduce a few novel ideas as well. </p>
      <p>It currently does no hinting and generally is free of any "auto" functionality which is design-related. So it does have auto save but does not have auto kerning, automatic generation of Unicode codepoints from glyph names, automatic creation of composite glyphs or automatic building of groups/classes. This seems to be Frederik's deliberate choice, as he listed "no knowledge" as one of his principles. In his view, as it seems, design choices should be left entirely to the designer. (Of course if the designer is a coder, he can put his knowledge into Python code as a plugin, but Frederik seems not to intend to offer such functionality "built in".)</p>
      <p>RoboFont can generate OpenType PS .otf and works natively with the XML-based UFO format. As far as I understood Frederik, it is a specialized tool which is designed to work best within a suite of UFO-based tools such as MetricsMachine, Prepolator and Superpolator. Once FontLab Studio adds native support for UFO, RoboFont will be able to work hand-in-hand with FLS as well. </p>
      <p>It is a very welcome addition to the set of tools available to type designers. If there's even just one thing that it does better than existing solutions, then I believe it's worth supporting. </p>
      <p>I'm thrilled that there are people who decide to develop type design applications (this was the reason why I joined Fontlab Ltd.: I was amazed that a single developer, Yuri Yarmola, spent years to create an application in which I could do all my font-related work, an application that I still use every day, sometimes loving it and sometimes hating it). </p>
      <p>As it was said here, the market is quite limited, especialky if we count full-time type designers. I think that while products such as FontLab Studio are an effort to create a comprehensive solution for type design and font mastering, there is also a need for more specialized products that address certain aspects. If products from various vendors can interoperate seamlessly, then even better. </p>
      <p>UFO is a great example of a format which can be used for interoperability. Fontlab Ltd. supported the RoboFab developers financially in the past, and we will be improving our support for RoboFab and UFO in near future. Immediately after FLS 5.1 is released, we'll continue our work on FontLab Studio 6, which will support UFO version 2 directly. </p>
      <p>I'd like to thank Frederik and Tal for the fascinating conversations that I had with them in Iceland. It's pure pleasure to spend time with smart people who are passionate about the software technology of making type. Respect! </p>
      <p>Best,<br>
      Adam</p>
