      <p>It's probably too late and the damage is done and all that, but I realize I stepped on some toes and rubbed on some people the wrong way. For what it's worth, it's not the program itself I was aiming at, which on itself reminded of Glyphs' UI which I'm very fond of. That's what attracted me to purchase RF in the first place, to finally be able to get into the UFO workflow in perhaps a more complete manner.</p>
