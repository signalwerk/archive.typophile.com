      <p>Err, a note to Frederik, Tal, Erik and Peter and whoever is involved in RoboFont:<br>
      You know, you could also just learn to answer emails from customers who have very simple questions, or better yet provide a descent downloadable documentation/manual, instead of a lengthy post on Typophile that still doesn't explain how to use the program within the so called 'workflow'.</p>
      <p>And I'm not talking about illustrating typefaces.</p>
      <p>This notion of expecting type designers to know what UFO is, to have experience with coding/scripting and visiting a conference or whatever, prior to paying a premium price for a program that doesn't come with the essential know-how-to documentation, seems a bit arrogant to me, wouldn't you say? It's this tendency to expect and assume that others speak the same "language" and have the same resources, that bugs me. This attitude is very evident in the initial user experience with RoboFont.</p>
      <p>And stating that designers that don't know or wish to know scripting or coding are in a vulnerable position, is very true, and more so in the case of RoboFont. But why should it be? You essentially calling such designers "incomplete" or "lacking". While I could say the same things about your program package being incomplete and lacking.</p>
      <p>I'm one of those "incomplete" type designers who for whatever reason IS interested in knowing more and getting into the celestial prophecy that is UFO. To see what news it has to offer to my prehistoric design and production workflow, and maybe even make me a better person.</p>
      <p>But first I would like to know how to use the damn thing! Not over time, and not by visiting typophile or google.</p>
      <p>So, get off your high horse for a minute, and learn also how to treat those customers whom you haven't met in a conference, and maybe just maybe write/offer a manual while you're at it.</p>
      <p>Sincerely,<br>
      Angus Shamal</p>
