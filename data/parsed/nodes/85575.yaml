      <p>I would choose RoboFont if I would use or aim to a UFO-based workflow. Glyphs does a lot more to help regular users with the design process and the nasty technical details. But that does not mean that Glyphs is just a beginner’s tool that would not be suitable for professionals.<br>
      Both offer the great OS X working experience, which FontLab’s products don't/can't have at this point.<br>
      But don't forget that these are 1.x releases. I expect some healthy competition between the two and great improvements in the near future. Which is something I don't really expect from Fontlab anymore. I like the FontLab guys and I know they are on a rather small budget, but it took SIX years from FontLab Studio 5 to FontLab Studio 5.1, which brings nothing more than Lion compatibility and some bug fixes. I know there are great plans for FontLab Studio 6, but when i do the math, when will this come out? 2017?<br>
      I hope Georg and Frederik make a lot of money with their tools so they can hire other developers to extend their software and people doing good documentations how to use them.</p>
