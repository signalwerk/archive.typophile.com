      <p>I've been using Robofont off and on since late in its beta stage and a bit more since it was officially released. Altogether not a lot of time, but enough to get an impression of it.</p>
      <p>It's difficult not to compare it to Glyphs, which it feels similar to in a lot of ways. In comparison, its UI not as polished as Glyphs, but it feels more like the core of a powerful, extendible system of tools. Knowing Python (or access to someone who does) seems essential to getting the most out of Robofont. I've got some experience with Python, but it's a bit daunting to me at this point.</p>
      <p>I've been able to feel my way around Glyphs, Robofont seems less intuitive. Trying things sometimes leads to unexpected results, and the documentation is a bit sketchy. It does little more than explain how to use each feature and tool and could use some editing.</p>
      <p>As I said, I haven't used it a lot yet, but I have generated fonts with it and am happy with the results. It feels like the start of a big thing for font makers and I'm committed to learning to use it more fully.</p>
