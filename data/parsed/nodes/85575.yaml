      <p>At present, if you have Metrics Machine installed then RoboFont will automatically send your UFO to Metrics Machine for kerning, rather than using the built-in spacing tools. Someone has already suggested in the forums that this should be an option or preference, rather than default behaviour, which makes sense I think: whenever there are two ways to do things, the user should be able to choose which to use, even if one is presumed to be more powerful than the other.</p>
      <p>The built-in kerning tool looks fairly basic, but with good group support. It doesn't look like it can be set up to work the way I kern in FontLab, with lists of context words for each pair. I find trying to kern looking only at pairs or at key letter contexts rather than real words unsatisfactory, as real words reveal patterns better and make it easy to spot systemic problems in spacing.</p>
      <p>[Like other tools, RoboFont makes a distinction between spacing and kerning as activities. This reflects how data is stored in the font -- as sidebearings and advanced widths, and as adjustments --,  but I remain intrigued by the possibility of a holistic approach to spacing that would automatically calculate optimal sidebearings and kerning values based on how a designer visually spaced strings.]</p>
