      <p>While I am fully aware that from the typedesigner-user's point of view it is legitimate to compare FontLab, Glyphs and RoboFont on existing functionality and  $€. But so far in this thread there are some basic issues missing in the discussion.<br>
      The comparison is valid if the applications are defined as complete out-of-the-box entities. A typedesigner (who does not want to do any scripting and has no means of letting someone else do that work), has to deal with the available user interface, tool set, feature set and the list of pending bugs. This makes the designer victim of the development of applications that are often merely production tools and not intended for design iterations, as is the case width equivalents for publishing, as Illustrator and InDesign. Being not (partly) designer of your own tools puts a designer in a vulnerable position.</p>
      <p>RoboFont is not an out-of-the-box application. The fact that Frederik and I and others have been advertized as the “missing link” means that RF is not an application-island, even while its basic functions are great by themselves. The application can better be described as another item in the growing set of applications that allow to edit/manipulate/produce UFO fonts. The existence of and full commitment to the UFO standard guarantees that all UFO applications perform specific functions on the same font files, and it also means that they can do that simultaneously. This binds them together as one mega-UFO-application with already many great functions inside and counting.<br>
      The mere fact that Frederik added a basic spacing-kerning editor is therefor a service to novice designers who want to start with just one lego-box instead of buying the entire profi-set all at once. If you need better then add another UFO app to the family.</p>
      <p>The advantages of building a modular mega-UFO-app are numerous and obvious:<br>
      - Spreading functions over different modules reduces the need to buy them all at the same time, or you can skip the functions you don't need all together. Or can do better yourself. Functions can be added over time as they become available.<br>
      - Decentralized development also means that a group of people (Frederik, Tal, Erik, me, …) can work on the functions that they really need and are extremely capable of making and maintaining.<br>
      - Constructing an open structure like this allows any development, competition and new technologies to be added to the overall functionality, without the need for the main developer(s) to put it on top of their list. This is very different from having one application that can only do most of the functions on a average level. And upgrading one function implies upgrading the entire application, which often is not attractive.<br>
      - The fact that RoboFont is written 100% in Python, goes way beyond any speed discussion (besides, btw, that the speed is great as it is now). </p>
      <p>To grasp the advantage of full Python apps needs some insight in how object programming is organized. As Frederik did this in the proper way for the entire application it allows any(!) user to dive into the deep functionality of RoboFont and overwrite/redefine/add functions, even to the core of the program, by means of inheriting the existing classes. This way there is a total melt between the scripting and the coding of the main application. What richer environment for developing your tools do you want? And even if that technology is beyond the reach of the average typedesigner: the reason that is can be done, it will be done.  Think of a near future with an rfStore, that has lots of free nice-to-have scripts and documentation and how-to's, besides commercial available scripts and tools as profi-versions of the free ones.<br>
      In the current RF version the 4 tabs in the main editor window are actually mini-applications, melted into the editor window, each with specific tasks. User scripts can hook into the application on the same level, adding more tabs that have full (!) access to the existing classes, functions, user-events and dataset of RoboFont. Over time more and more documentation will become available how to do this, along with  a number of example scripts (which by themselves are useful mini-apps)<br>
      Where RoboFont is only released a week ago, already some of the existing UFO-app developers think of making their existing applications available as RF-plugin. </p>
      <p>A bit about (any) pricing in general and about the € 400 in specific. It is common knowledge that nowadays the production cost is by no means related to the market price of fonts. Exactly the same is true for applications. The developer needs to sell a huge amount of licenses in order to come anywhere near the investment. And the only way this can be done it to cut on (professional) functionality and ignore pending bug lists. So, when an application like RoboFont is created, which allows other professionals to plugin their knowledge without any boundaries, any price for such a tool should be fine (if €400 – the equivalent of saving a modest 2 days of work in the lifespan of the application –  is a problem, then it's the relevance and quality of the design work that is to be questioned, not the price of the tool).<br>
      Matthew did put it exactly right: it is a down payment, taking a share in a future that is likely to come (and in which all users  take part), supporting the development of many great additions. It is not the payment for an application license.</p>
