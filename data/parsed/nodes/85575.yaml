      <p>Hey, Petr, I hope you will continue to post.  </p>
      <p>About the violin analogy. There may be a few natural geniuses who learn to play the violin by just picking it up. But almost everybody does have a teacher, and instructional books. So the fact is that most have do have manuals, and personal instruction, as well as trial and error and long practice. It's not "either-or," but "both-and." And every single master had a teacher, even if they learned it first by themselves. Louis Armstrong learned to play trumpet by ear, but Joe "King" Oliver was his mentor, mentored him. And Mozart learned from his father, who was a music teacher. </p>
      <p>So IMHO, helping people to use Robofont, both with a manual and interacting here with users and modifying it in response will make it far more usable and used. The basic fact is that if you get stuck using software, and you don't do code yourself, you're screwed unless you can ask somebody how to get unstuck. </p>
      <p>I'm not saying that you have to be the one answering questions, on line, in public, but if somebody does, it will make a better product and certainly a more widely used one. And whoever does the answering will have to deal with with uncalled for and annoying rudeness. That's just the way the internet is. Rude, but amazingly useful.</p>
