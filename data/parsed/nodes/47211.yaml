      <p>My calligraphy instructor (a professional calligrapher for nearly 30 years) introduced me to the Brause nibs that Stephen mentioned. You will need a holder for the nibs, such as a Caran d'Ache brand. For "letter" writing, you are going to want a fairly small nib, perhaps a .75 mm - 2 mm size.  </p>
      <p>If you are interested in classes or lessons, these are usually readily available.</p>
