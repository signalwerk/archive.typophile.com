      <p>Hrant: <em>One big thing I wonder about is: what about leftward scripts like Arabic or Hebrew? Do their calligraphy teachers secretly hope for lefties in the class?</em></p>
      <p>I doubt it, because although the connecting horizontal strokes might benefit from being written by a lefty -- the pen can be pulled rather than pushed -- the verticals would either need to be pushed instead or would have flipped terminals. Remember, when writing with a broad nib you not only get distinctive stroke modulation you also get distinctive stroke terminals, in terms of both their weight and angle.</p>
      <p>Now, if a lefty were to hold the pen in the mirror of how a Devanagari scribe would, i.e. with a strong rotation past the vertical, and modify the normal ductus of the letters accordingly, he or she might produce the classical styles quite well.</p>
    html_clean: |-
      <p>Hrant: <em>One big thing I wonder about is: what about leftward scripts like Arabic or Hebrew? Do their calligraphy teachers secretly hope for lefties in the class?</em></p>
