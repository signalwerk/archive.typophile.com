      <p>Solt's tricks for pimping the pens sounds great.</p>
      <p>By the way, if you want to know what pen is the best all-around pen, no one really has the answer for that. Buy one or a couple and see what you like. I like vintage nibs that can be purchased from <a href="http://www.pendemonium.com/" rel="nofollow">Pendemonium</a> or eBay. Which one depends on what I'm doing, but the nibs are usually cheap, so buy a bunch and try them out.</p>
      <p>I used to think I could find the "perfect" pen, and the "perfect" ink, and was always dissatisfied. Finally I just bought a bunch of both and figured out what I like, and what works better for one thing or another.</p>
