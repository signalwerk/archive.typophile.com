      <p>Are you just wanting basic calligraphy with no goal of getting to an advanced level?<br>
      If so, you could start with a fountain pen and maybe one of the basic calligraphy books like Jacki Svarin's 33 alphabets.</p>
      <p>fountain pens:<br>
      <a href="http://www.johnnealbooks.com/prod_detail_list/7" title="http://www.johnnealbooks.com/prod_detail_list/7">http://www.johnnealbooks.com/prod_detail_list/7</a></p>
      <p>If you are thinking of being a bit more disciplined and perhaps taking it the next step, take a class and use real dip nibs such as Brause or Mitchell nibs. John Neal Books sells all that stuff. They could recommend a good beginning set of tools for you.</p>
