      <p>If your aim is to simply develop a nice handwriting for everyday use, then a fountain/cartridge pen with a 1.5 or 2 millimetre wide flat nib will be best. My favourite is a Parker model to which Jean Fançois Porchez introduced me over a decade ago, and remarkably I've managed not to lose it in all that time. Unfortunately, this model is no longer made, but you can find it on eBay sometimes.</p>
      <p>Avoid Osmiroid pens, since the nibs are not well made and tend to gunk up. That said, they are the only company they made a pointed split nib fountain pen, for which I'm very grateful; on the whole, though, they are too much trouble for an everyday pen.</p>
