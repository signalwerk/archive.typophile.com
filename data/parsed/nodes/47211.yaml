    <p>Hello,</p>
    <p>I'd like to learn a bit about calligraphy. I saw a thread on a few good books but I'm not so sure about what pens to get. Can anybody suggest a good quality pen? My intended goal with learning this is to write nice letters (as in mail, not glyphs).</p>
    <p>Thanks very much for your help.</p>
    <p>-Glen</p>
