    html: |-
      <p>I have practised and taught calligraphy, on and off, for some years and at the beginning of any course of instruction I always asked if any of the students were left-handed. As I asked this, my fingers were usually crossed behind my back, hoping that no one said yes.</p>
      <p>It's not impossible for left handers but it is extremely difficult, usually made worse by the common practice that left handers adopt of turning the paper so that they are writing almost vertically, so's to avoid the hand smudging and obscuring the writing. I have seen one really extreme example where the paper was turned until very nearly upside down.</p>
      <p>My dread of having left handers in a class was because it usually requires much, much more patience and discipline on the part of the student to achieve rewarding results and as I am next to useless with my left hand it is difficult for me to 'feel' the problems it creates for the student and to advise accordingly.</p>
      <p>There are left-oblique nibs which can help a little but, in truth (in my experience anyway), it is only a little.</p>
