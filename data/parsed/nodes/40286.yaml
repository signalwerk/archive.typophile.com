    html: <p>Very nice. I recognise the steps in the photos with Hannah, on Cambie Street, just around the corner from where I used to have my studio in the Dominion Building. At the recent wayzgoose in Vancouver, I met someone who assumed that I was Wil Hudson's son. We had this rather strange conversation, in which he kept making references to my father, and it took me a while to figure out the mistake.</p>
