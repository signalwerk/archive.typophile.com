    <p>Hello,</p>
    <p>The community may be interested in a series of photos taken of printer/typographer Wil Hudson at his Vancouver shops during the 1970s, located at:</p>
    <p><a class="freelinking external" href="http://flickr.com/photos/hhjohnston" rel="nofollow">http://flickr.com/photos/hhjohnston</a></p>
    <p>They were taken mainly by my father, photographer Hal Johnston, and have been recently digitised and uploaded.</p>
