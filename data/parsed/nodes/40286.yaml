    html: |-
      <p>Great archive. I stumbled across these searching for information about Wil Hudson who (as is obvious) worked in Cape Dorset Kinngait Studios of which I am the current arts advisor manager. I have been involved in the studios since 1988 and have hear all the stories bout Wil and his influences. I am a lithographer by trade but we still have the Vandercook that Wil used as a proofing press and we are actively getting into readiness to do it's part in the year collections. I have sent many of these photos (Flickr collection) to Terrance Ryan now mid 70's who hired Wil, to work in Dorset and I have had local help from Facebook to ID the Inuit people in the photos, some of whom are still alive.<br>
      Can anyone tell me if Wil is still roaming this earth? He was such a powerful and influential person in the development of the Kinngait Studios (then Kingait Press) that I'd like to cobble together what ever I can so he will be remembered for the contributions left behind.<br>
      Regards<br>
      William Ritchie</p>
