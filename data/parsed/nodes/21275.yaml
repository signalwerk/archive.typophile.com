    html: |-
      <p>Typequake:</p>
      <p>I do own Verdigris. When I first recommended it warmly, I did not own it. But I compared its letterforms to other fonts designed for extensive text. Its versatility and aesthetic virtues were obvious. After having actually used it for two lengthy pieces of work, dealing mainly with Roman classical literature, my impressions of the font have been confirmed.</p>
      <p>My attention was diverted by Envoy, however. I found its old-style characterestics rather charming, but the comparison to the overly-clean and consequently, insincere Minion, turned me away from it. So Verdigris came to mind, etc.</p>
