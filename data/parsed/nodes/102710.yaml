    html: |-
      <p>@ altsan:<br>
      I am so glad to hear from you and i am happy you like most of my latest improvements. The straight horizontal /a is an adjustment i made when i started to see that the upper aperture of the letter in bold was way too small and not open enough to grant a good readability. So instead of making the curves just smaller i adjusted until i ended up straight-horizontal and i started to like it because the back of the letter is now mostly straight-vertical.</p>
      <p>The /e could do with a little less feeding especially the regular one. And the widening of the joints in the /b /d /p /q of the bold is definitely worth a try. The width suits my feeling, but i could give that adjusment a try also.</p>
      <p>May be you’ve seen the fault, that the /ÿ and the /ỳ in the regular are still looking like on the first time i’ve uploaded the typeface. I managed to upload the image and then seeing and changing it, so the next upload would be rid of that mishap.</p>
      <p>I will await some more feedbacks before i upload another version, in order to minimize the server space i take up with this thread. Thank you so much for this encouraging input.</p>
      <p>_______________________________________</p>
      <p><a href="http://brennmichnicht.com/index.html" rel="nofollow">my former website <strong>in german</strong></a></p>
      <p>There is however a problem i’ve come across in cross-browser display. Auto hinting is to be avoided i am aware of that, but i work on a mac with typetool 3.1 and the mac is hinting everything itself anyway, so i don’t know how to adjust my auto hints and actually see the result. It’s pretty annoying not to be able to make hints that work for both plattforms using just one of them. Does anybody know a workaround that does not include spending hilarious amounts of money?</p>
      <p>best regards</p>
