      <p>@phrostbyte: Thanks again, this helps a lot. If i recall correctly the sharp S should be around the third last line in the beginning. I am from switzerland, so i know a bit of how tricky german signs can be (of course swiss people always have to have their own special ways to typeset things, but hey it wouldn’t be fun if it was easy would it? hehe).</p>
      <p>In Fact the feedbacks on this forum have been more helpful, than most of the lessons by my former teachers. I am working right now on an italic that i will upload as well with a more substancial type test and i intend to upload vector pdfs again so i can save a little server space. Hopefully i will be done somewhen soon.</p>
      <p>best regards</p>
