      <p>I think this is very well formed. It could use a little more balance in the lines. Specifically, try to think of ways to make the /r or /t interrupt the rhythm less. (The /r adds a gap, the /t makes things a little too dark.) From there you can look at the rest of the characters in that light, and also scrutinize your spacing.</p>
      <p>Everything for the most part looks fine by itself and side-by-side. Where I think you could use a little work is fine-tuning the rhythm and color. :-)</p>
      <p>Keep it up!</p>
