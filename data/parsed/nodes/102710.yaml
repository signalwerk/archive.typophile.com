      <p>Looking very nice now!  Much improved, I think.  The bold looks especially good, in fact.</p>
      <p>I'm not 100% convinced by the new straight-horizontal crossbar on the /a ... it possibly looks a bit out of place given that every single other part of the character is based on quite emphatic curves.  </p>
      <p>Also, I notice that the /e's eye is extremely large.  (I'm not saying that's necessarily bad, just that it kind of jumps out.  If that's the effect you want, then great.)</p>
      <p>/b, /d, /p, /q could maybe benefit from a bit more subtle narrowing of the bowl where it joins the stem, I think you've got a bit of congestion there.  Also, I have a vague thought that these characters might be a trifle narrow.</p>
      <p>Love the capitals.  I like the overall effect of the whole face, actually.</p>
