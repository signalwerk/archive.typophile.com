    html: <p>I'm no expert but this sample is much improved. The results are very pleasing. You might tweak some of the width of the lower case glyphs. The /z and /w for instance still seem a hair wide. Another minor item is that the dollar sign seems too strong next to the numbers. I would like to see the @ and &amp; next to some of the letter glyphs. Check you side bearings on the Oslash. You might wish to include the Sharp S which is at uni1E9E. Just a suggestion, I've had to do a few signs were that glyph was required. No, I don't speak or read German so making signs in German is tricky. You kinda have to hope that the client is paying attention.</p>
