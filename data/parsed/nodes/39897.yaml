    html: <p>Believe it or not, in the middle of the night I suddenly remembered "Kismet!"  I felt rather dumb for wasting people's time with the post.  But Spiral is new to me, and, at first blush, seems to be more complete than Kismet, what with slashes and other punctuation fully integrated into the design.  Very interesting, thanks!</p>
