    <p>There is a typeface used for the first edition of Beagle's <em>The Last Unicorn</em> that I absolutely adore.  I actually came across its name by pure luck while browsing a book on graphic design, but have since forgotten its name.  Can anyone help?</p>
    <p>Example: <a href="http://upload.wikimedia.org/wikipedia/en/thumb/6/6f/Last_unicorn_hb.jpg/200px-Last_unicorn_hb.jpg" title="http://upload.wikimedia.org/wikipedia/en/thumb/6/6f/Last_unicorn_hb.jpg/200px-Last_unicorn_hb.jpg">http://upload.wikimedia.org/wikipedia/en/thumb/6/6f/Last_unicorn_hb.jpg/...</a></p>
