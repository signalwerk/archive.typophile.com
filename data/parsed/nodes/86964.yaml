    <p>Hello typophiles,</p>
    <p>I was wondering if anybody knew of companies strictly offering custom type services (no retail releases). Are there any? I had thought of Dalton Maag, but they seem to be offering quite a few retail fonts now. Maybe <a href="http://www.pangeadesign.se/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.pangeadesign.se/</a>? I am not sure where to look for this information. </p>
    <p>Any help would be very appreciated!</p>
    <p>Ruxandra</p>
