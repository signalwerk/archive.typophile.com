      <p><em>… independent type foundry …</em></p>
      <p>Independent of what?</p>
      <p>All type foundries are independent, so the term is redundant.<br>
      "Indie" was a musical term, used to describe record labels without their own means of distribution.<br>
      It has some "alternative" cred.<br>
      By the same token, "independent" type foundries would be those without e-commerce at their web site.</p>
      <p>Are the non-independent type foundries Microsoft, Adobe and Apple?<br>
      Those companies are not type foundries, but hardware/software app companies with tiny type departments.</p>
