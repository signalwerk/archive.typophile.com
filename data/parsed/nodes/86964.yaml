      <p>Thanks a lot everybody!</p>
      <p>I think explaining why I am looking for this information beforehand would have been wiser. I am working on a short masters thesis on the state of the independent type foundry industry today, and, as part of my introduction, I have created a schema of the different players in the business around type design, including foundries that offer retails fonts, and also those companies that don't. I wanted to give some examples of the latter, but it was much harder than I thought, as the ones I wanted to include (ex: Dalton Maag), recently transitioned towards offering retail fonts as well. It's interesting to see how this model is becoming rare, and now mostly applies to companies that do other design and identity work along with custom type design, as mentioned by Johan.</p>
    html_clean: |-
      <p>Thanks a lot everybody!</p>
      <p>I think explaining why I am looking for this information beforehand would have been wiser. I am working on a short masters thesis on the state of the independent type foundry industry today, and, as part of my introduction, I have created a schema of the different players in the business around type design, including foundries that offer retails fonts, and also those companies that don't. I wanted to give some examples of the latter, but it was much harder than I thought, as the ones I wanted to include (ex: Dalton Maag), recently transitioned towards offering retail fonts as well. It's interesting to see how this model is becoming rare, and now mostly applies to companies that do other design and identity work along with custom type design, as mentioned by Johan.</p>
