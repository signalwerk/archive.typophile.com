      <p>Independent as in foundries founded by designers who create, own and distribute typefaces themselves and/or through vendors, unassociated from companies such as Monotype, and generally small in size. It excludes corporations like Microsoft, Adobe and Apple.</p>
      <p>Yes, this definition includes most foundries today, and maybe the term is becoming less relevant. It does seem like it is still in use though: <a class="freelinking external" href="http://shop.gestalten.com/type-navigator.html" rel="nofollow">http://shop.gestalten.com/type-navigator.html</a>. Paul van der Laan and Pieter van Rosmalen from Bold Monday, among others, also use it to describe their foundry: "Bold Monday regards itself as the typographical equivalent of a so called “indie” record company." In any case, I wanted to use a term that excluded large corporations such as the ones mentioned above.</p>
