      <p>Hi Ruxandra,</p>
      <p>Pangea design doesnt sell any commercial fonts, we only do custom work for clients, sometimes visible and sometimes invisible. However we have designed FF Dagny (from a custom typeface we did for a swedish newspaper DN) which we released at FontFont.</p>
