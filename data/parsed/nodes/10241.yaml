    html: "<p>I think this is pretty cool. <br> <br>I can think of some tweaks, but wouldn't want to intrude too much into the \"structures\" of such an obviously personal effort. Two things that do stand out as needing change though: <br>- I would splay the legs of the UC \"M\". <br>- Most of all: I would quickly change the \"z\" to have \"conventional\" stroke contrats! It looks really disruptive the way it is. You could do that in the italic though I guess. <br> <br>Nice stuff. <br> <br>hhp</p>"
