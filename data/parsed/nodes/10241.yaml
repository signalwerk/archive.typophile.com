    html: |-
      <p>Great to see you here, Hubert. I am huge fan of your <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=zwo" rel="nofollow">FF Zwo</a> and many of your other faces.</p>
      <p>I think Talk (is that the name?) has a lot of potential, if for no other reason than modern faces with ultra-distinctive forms are very much in demand. I believe <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.10269.3.11&amp;attributes.sampleSize=48&amp;sampleText=look+dad%2C+no+feet&amp;sampleSize=32" rel="nofollow">FF Dax</a>'s simplified 'n', 'a', 'b', and 'd' often sell the face by themselves.</p>
      <p>Some thoughts:</p>
      <ul type="circle">
      <li>The crazy 'S' terminals feel a tad too heavy.</li>
      <li>The serifs may be too large, especially noticeable on the 'm'.</li>
      <li>Your 'a', 'k', and 'g' are stunning.</li>
      </ul>
