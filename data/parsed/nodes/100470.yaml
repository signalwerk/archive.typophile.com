      <p>I may get bashed for this, but I always felt that this is about political correctness vs. langual properness.<br>
      “Political correctness” is a demagogic tool of a minority to impose rather questionable concepts onto the general public, and to discriminate those who don’t wish to follow.</p>
      <p>No one ever speaks like »die StudentInnen« etcª. “The doctor” means, if not specified otherwise, *a medical person (male or female)*, not “The male doctor”.<br>
      In my point of view this implemeting into type composing is just as nonsensical and nasty as it is in speach.<br>
      It is unnatural, and will ever be.</p>
