  html: |-
    <p>Please pardon the garbled title, it describes pretty accurately what I’m currently wondering about… (and my state of mind, probably, too.)</p>
    <p>I’m designing/typesetting a booklet and have come across some words (in languages like French and German) that take optional feminine endings. In the typoscript they’re set in parentheses to show that both forms are included. This is not unusual, but rather ugly:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/parens-big_4976.gif"></div><p></p>
    <p>Is it possible that there might be a way to use smaller parentheses here (these are from the smallcaps)? Or am I crazy? Do these look out of place?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/parens-small_5178.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/parens-french_5981.png"></div><p></p>
    <p>I’d appreciate feedback, or any ideas / tales of precedent for how this might be typeset in a way that is both recognizable, and not too disruptive/ugly. Thanks!</p>
