    html: |-
      <p>I think the smaller parens look much nicer. And even if very few laymen could consciously put a finger on the full-size parens bothering them, they would still benefit from the smaller ones.</p>
      <p>One thing to worry about no matter what size parens you use, but especially if you use "unexpected" ones: many designers don't includne kerning for things preceding a left paren (or things beyond punctuation following a right paren).</p>
      <p>BTW, optionality is often indicated with square brackets, not parens - but those would generally be more jarring.</p>
      <p>hhp</p>
