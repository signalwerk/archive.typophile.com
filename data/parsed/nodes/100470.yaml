    html: <p>Common usage here, as far as I can tell, is either an intercap (StudentIn), which however most people find ugly; or parentheses; or sometimes a slash. Which one of these is used is also an editorial decision. The client would like parentheses, and I don’t feel I should invent something new here – this is not so rare as to warrant a completely new/customized approach, and I tend to agree with Frode that it’s probably a good idea to stick with what people are [getting] used to, especially since the construction is a bit cumbersome anyway.</p>
