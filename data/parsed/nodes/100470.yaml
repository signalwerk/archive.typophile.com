      <p>There are pairs of Unicode parens for superscript and subscript elements which are very useful for phonetic transcriptions that use a lot of superscript and – to a lesser extent – subscript modifiers. These are far more readable than their full-sized parenthesis counterparts: ‑k⁽ʷ⁾, ‑tɬ⁽ʹ⁾, tʃ⁽ʰ⁾‑, ‑l⁽ˤ⁾, ‑t₍.₎s‑, ‑ŋ₍₊₎ versus ‑k(ʷ), ‑tɬ(ʼ), tʃ(ʰ)‑, ‑l(ˤ), ‑t(.)s‑, ‑ŋ(₊). (Pretend that those examples are all in an appropriate typeface rather than mangled by your browser.) Having a similar pair of parentheses for x-height elements would be a major typographic improvement, though I imagine it would take some time to catch on given that the superscript and subscript ones are only beginning to see regular use.</p>
