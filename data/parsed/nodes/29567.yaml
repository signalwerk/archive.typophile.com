      <p>Adam, if you go to their website sales copy for Adobe Font Folio OpenType edition, under Key Benefits of buying the CD, it promises:</p>
      <p>--Revive fine typography with expanded glyph sets containing swashes, small caps, and old-style figures...</p>
      <p>--Take advantage of multiple font packages with merged character sets, allowing easy access to expert set characters — such as small capitals and old-style figures — when using OpenType savvy applications...</p>
      <p>Nowhere on that page does it say "except for families we could not complete this way" or words to that effect. The customer finds that out the hard way. Basically Adobe's response to this complaint comes down to "you should have read the fine print" or rather checked out each font or family's glyph schedule. But as Terry Biddle said above, this is completely impractical--there are "more than 2,200 fonts." </p>
      <p>If you read the Key Benefits, you will see that a customer would be easily misled into thinking full glyphs are promised across the board. I've heard exactly this lament from plenty of NYC type buyers who are usually tough customers. The helpful thing would be for Adobe to list faces/families by their glyph coverage in one place; nothing of the sort appears in the sales section now. Thomas, in his post above, admits the validity of our complaint while pleading extenuating circumstances. For those burned, that's very cold comfort, and for the retailer, worse PR.</p>
