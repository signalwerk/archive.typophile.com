      <p>Mondo, </p>
      <p>if I were to buy a library of 2,200 fonts, I'd seriously ask myself "did they actually extend all of those 2,200 fonts with additional glyphs"? Now, I agree, this skepticism would mean that the potential buyer knew the original Type 1 offerings of Adobe (which often were without OsF). But I don't see how a reasonable buyer should be disappointed by finding out that the 2,200 fonts he got are not "all noo" ("noo" being a New York pronunciation of "new", btw ;) </p>
      <p>This really almost boils down to the popular belief that fonts grow on trees. The fact is that now, due to OpenType, companies such as Linotype, Monotype, ITC start extending their fonts with additional glyphs -- but this is done *one family at a time*. Anybody who even remotely understands type design would realize that the Adobe OpenType library could not realistically be extended in their entirety. </p>
      <p>I simply cannot agree that it is fair to call Adobe "lazy". </p>
      <p>Fortunately enough, the naming key ("Std" vs. "Pro") should be a good indication on what is going on.</p>
