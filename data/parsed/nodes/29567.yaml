      <p>We know that, Miguel...instead of waiting for licensors to update their faces at their own pace, Adobe could collaborate to complete glyphs on a typeface, then market the result jointly, exactly as two opera houses might co-produce an opera. So if Guardi, languishing with only lining figures, becomes Guardi Pro with OSFs and other glyphs, it might attract new well-merited attention it never got before.</p>
      <p>We're also raising the far more intriguing possibility of concerted action, across the industry, whereby every font released in OT by anybody has uniformly complete glyph coverage as a new industrial standard of benefit to everyone. That way, stubborn holdouts like Monotype's Horley Oldstyle might find new popularity when given complete glyphs, esp the OSFs implied in the name. </p>
      <p>But in the meantime, smart shoppers, as KL mentions, can find what they want elsewhere--Monotype's complete OT version of Plantin is sold on their site right alongside Adobe's incomplete version, which of course is also acquired from Monotype. And yes, they distinguish each by its "source" exactly that way: in their view, it IS "Adobe's Plantin."</p>
