  html: |-
    <p>If you are interested in buying Font Folio, Adobe's complete OpenType library on CD, reading the on-site sales copy might lead you to conclude that, aside from higher tech quality, a new order of glyph options, especially easy access to oldstyle figures, is promised *across the board* in this expensive product. But customers found out otherwise--the hard way. Many fonts/families did indeed sport complete new glyphs and oldstyle figures, but others had only limited glyphs without oldstyle figures, and quite a few offered only the Euro symbol as the new element. </p>
    <p>Let's have a moment of silence for glyphs missing in: Mendoza, Giovanni, Galliard, Bell, Berkeley Oldstyle, Esprit, Ehrhardt, Goudy Modern, Guardi, Hadriano, Horley Oldstyle, Italian Oldstyle, Legacy Serif, Minister, Photina, Plantin, Raleigh, Stone Serif, Veljovic, Versailles, Wilke. That's just serif text families; I didn't count the sans text families.</p>
    <p>Whatever the reasons, surely it is in Adobe's interest to qualify their sales copy for this product so customers can buy with their eyes open. Because it's difficult to research glyph schedules for over 2,200 fonts, can you specify, in one place, which fonts/families have complete glyphs, which have limited glyphs, and which have only the Euro symbol?</p>
