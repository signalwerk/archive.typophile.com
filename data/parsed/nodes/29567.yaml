      <p><cite>Monotype Photina Std contains no new glyphs at all, just the euro symbol, even though the type one version had expert fonts with glyphs.</cite></p>
      <p>Adobe did <em>not</em> sell any Type 1 expert fonts for Photina. Adobe converted its library from Type 1 to OpenType, and it's safe to say that if it's a non-Adobe font, the OpenType-format font has the same glyphs as the Type 1 font(s) (aside from some marginal additions like Euro). I know of no cases where anything was removed.</p>
      <p>At Adobe, the name "Pro" means that the character set supports Central European languages. Anything else is "Std". Other font vendors have chosen to use those suffixes and assign different meanings -- but Adobe was the first to use them as far as I know.</p>
      <p><cite>Whether Adobe was lazy or just impatient, sweeping the incomplete into the same bundle with the complete, we don’t know and they’re not saying ...</cite></p>
      <p>The concept could not have been more simple: convert our Type 1 font library into OpenType format. I think Thomas's description of the process and decisions and reasoning was detailed and accurate. (Thanks, Thomas!)</p>
