    html: |-
      <p>Thanks to whoever renamed the thread to a less offensive title.</p>
      <p>Ah, David Lemon was good enough to explain it to us. Monotype licensed Adobe's Type 1 font production tools to produce their own Type 1 versions of their fonts around 1991, and that resulted in Adobe copyrights in the font files.</p>
      <p>Most of those same fonts were later licensed to Adobe and rebuilt by Adobe to our technical standards, but Plantin Expert was not among them. I can't say why.</p>
      <p>But the rule of thumb is still simple: we converted everything that we had the rights to convert from Type 1 to OpenType, merging all supplemental fonts that were available to us at the time. We continue to sell the Type 1 versions, although they're a little harder to find on our Web site. So you can tell we didn't have Plantin Expert by seeing that we don't have it now. Go to the appropriate page for Plantin Std and click on the "More Info" tab at lower right, and you can find the Type 1 fonts listed.</p>
      <p>Of course, if you want to know what's in the OpenType font, all you have to do is look at the cyan blue icons right on the main page for each font or family. Or you can download the PDF that shows every glyph in the font. It's not like we make it hard.</p>
      <p>Cheers,</p>
      <p>T</p>
