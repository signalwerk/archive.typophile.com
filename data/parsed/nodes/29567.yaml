      <p>Figuring out what is available in a type family isn't that difficult. Yes, some sites do not offer enough information. However, if you know what it is that you need, why is it so difficult to find out. Most foundries can be reached by phone or e-mail, or even here on Typophile. </p>
      <p>If you took the time to look on the pages at Adobe you'd notice they tell you right there on the page what you are getting with the font. A little comparison can go a long way.</p>
      <p>Exhibit A: <a href="http://www.adobe.com/type/browser/P/P_1250.html" rel="nofollow">Plantin STD</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/plantin-duh_3935.png"></div><p></p>
      <p>Exhibit B: <a href="http://www.adobe.com/type/browser/F/GRPP/F_GRPP-10010010.html" rel="nofollow">Garamond Premier Pro</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/garamondpremierpro-duh_4311.png"></div><p></p>
