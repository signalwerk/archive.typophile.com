      <p>Any current text editor application within Mac OS X supports the use of ligatures, etc.; how difficult would it be for Microsoft (ironically, one of the developers of OpenType) to implement the advanced typographic features promised by the format?  One suspects that, as with the development &amp; distribution of OT font technology, commercial interests have limited the typographic capabilities of Microsoft Word - that particularly bloated white elephant. As for Photina, it has a very limited glyph set, at least by OpenType standards: no international alphabets or expert features. Such limitations are in no way overcome by the use of more sophisticated software applications; even if purchasing the most up-to-date font version, what is needed above all is a program that will support 'legacy' formats, such as PS-Type1 or TrueType (thankfully, neither Adobe nor Apple have yet deemed it profitable to phase out either).</p>
