      <p>I won't be holding my breath for Microsoft to come to the OpenType party - insofar as advanced typography (as opposed to international alphabet support) is concerned. There are an increasing number of wordprocessing competitors out there that can (1) alphabetically sort my huge list of fonts (for all its bells and whistles, Office 2004 for Mac just gives up!); and (2) automatically implement so-called 'advanced' typographic features, such as common ligatures. The disadvantage would seem to be that in sending .doc or .rtf to another user with Office, such features are automatically removed!</p>
      <p>But since this thread was initially about the lack of typographic features being implemented by OT font developers, I might as well resume that thought here. I mentioned already Photina (a font for which small caps and text figures were added as an afterthought). But what about Esprit? To my knowledge, no current OT version of Esprit contains the expert features which are, as Robert Bringhurst suggests, integral to its design. In the case of these fonts, Type 1 (legacy) support is far more important than OpenType support at the application level. </p>
      <p>No doubt further examples of certain gaps in the OT font development/conversion/licensing process could be adduced. </p>
      <p>Oh, and just for the record - healthy companies don't always make for healthy consumers!</p>
