      <p>The licensed (non-Adobe) OpenType fonts in the Adobe Type Library are all produced from the Type 1 versions which preceded them. If you look at a pre-OpenType catalog of the ATL, you'll see that whatever was or wasn't present there is the same for the OpenType versions. Of course we took all the supplemental fonts we had and combined them into a single OTF and made the alternates accessible through layout features as best we could. It was, essentially, a conversion project.</p>
      <p>So yes, the OpenType versions of these fonts were not expanded, but neither were they reduced or limited. Licensing issues aside, I assure you we had our hands full expanding the Adobe Originals.</p>
      <p>As for why the various expert glyphs (oldstyle figures, smallcaps) weren't available in the first place, that <em>is</em> probably a licensing issue in most cases, and such things are not trivial. That's some history I don't know much about, but maybe Thomas or someone else might have more to say about it.</p>
      <p>Thanks for being so obnoxious. We really don't get much of that on the Internet and it is just so refreshing and enjoyable.</p>
