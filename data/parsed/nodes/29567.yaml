      <p>"You...complain about the quality of the response you get."</p>
      <p>Of course I do. Aside from gains in tech quality, one of the key selling points for buying OpenType is that the user's favorite glyphs, which in type one format were placed in expert fonts, will now be accessed more easily if the customer re-buys their favorites in this new format. And then, by my count, 21 serif families fail to deliver that key glyph option, and the user is left in the dark as to why. Monotype Bembo and Dante get full glyph coverage by Adobe in OT, while Bell, Photina, Plantin and others do not. Same company; what's the problem?  These are not small discrepancies, but a glaring industrial problem, and I want typophiles to be aware of it in its true scale. With 435 reads the first day, this rant post serves that useful function. </p>
      <p>Bringing about completions through collaboration is not a fantasy but rather a business opportunity not to be scoffed at. Take, for instance, Guardi, designed by Reinhard Haus of Linotype in 1986 before oldstyle figures became as prominent as they are now. This stylish Venetian face would get a completely new lease on life, in coordinated OT release, by being completed with OSFs and other glyphs in partnership with the licensor. Would the original designer and Linotype simply say no to that? We would love some answers, but more important, we would love creative, collaborative action to bring full glyphs to every text family where it is possible, particularly when each remedy means a fresh opportunity to sell. You feel insulted...what about the Adobe customers who still want to roll out Plantin with loaded OSFs?</p>
