      <p>The architects of OpenType made the OpenType format inherently non-standard, by trying to cram as much as possible into a single font.</p>
      <p>In particular, by mixing language features (encoding) with typographic features ("expert" sets). Expert features are inherently non-standard, whereas it is certainly possible to standardize language encodings.</p>
      <p>Perhaps the situation would be more "standard" if there were FOUR flavours of OpenType:</p>
      <p>1. Basic Language encoding -Std<br>
      2. Basic Language encoding with Expert features - Pro<br>
      3. Multiple language encodings - Multi-std<br>
      4. Multiple language encodings with Expert features - Super Pro</p>
      <p>From a needs perspective, and from a cost-of-production perspective, this makes more sense -- for specialist foundries, and for users.</p>
    html_clean: |-
