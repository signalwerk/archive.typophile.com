      <p>Microsoft has implemented a very complete support for OpenType Layout features in WPF (Windows Presentation Foundation aka Avalon), the new graphic subsystem used by Windows Vista which uses an XML dialect called XAML to formulate user interfaces. Any application using WPF can make full use of OpenType Layout features. </p>
      <p>Microsoft Word is far too complex an application to be rewritten completely to use WPF. So currently, it uses GDI as it did for years. But I think soon other applications will apear that will support OpenType Layout through WPF, which is no different than TextEdit supporting OpenType Layout through AAT. </p>
      <p>A.</p>
