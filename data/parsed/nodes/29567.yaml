      <p>I think that it is easy to overlook the real, basic beniefits of OpenType fonts. For large foundries, the best thing OT fonts have going for them is their cross-platform compatability. Instead of having the worry about 20,000 fonts, because you have every font in Mac and PC versions, or even worse 40,000 fonts, because you have Mac PS, Mac TT, PC PS, and PC TT, you just have 10,000 OT fonts. And these 10,00 work everywhere (that supports OT…)</p>
      <p>Aside from this, OpenType can include lots of other benefits, like typographic features or support for more languages. But a font is still a "real" OpenType font, even if it has neither of them.</p>
      <p>There are really already two generations of OT-fonts at most larger foundries. The first generation was just a conversion… cut down on cross-platform issues. The second generation is where the features and the languages came in. Many smaller foundries didn't even come to the OT table until generation 2. Generation 2 fonts are better, without a doubt, but they take time to make. They'll be there, don't worry. Even if all of them aren't there yet.</p>
  - id: 169111
    user_id: 2263
    user_name: crossgrove
    user_path: null
    date_raw: 17 Nov 2006 — 10:19am
    date: 2006-11-17T10:19:00
    votes: null
    html: "<p>OpenType is a technical standard; it doesn't specify what characters must be present. It's something of a marketing issue: you can't tell by the name 'OpenType' whether the font will have 256 characters or 3400. \"Pro\" is usually a good indicator there's more included, but foundries should provide showings of the specific character set of a particular design. Otherwise there's no guarantee of small caps or anything else. Producing OpenType Pro (or other advanced, enhanced OT fonts) is <strong>much</strong> more labor-intensive than simply converting the format of an existing PS or TT font. Check the character set before you buy, and look for a specific designation like \"Pro\".</p>"
