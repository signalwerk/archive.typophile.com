      <p>Of course I wish we had all those extra goodies in the OpenType versions of the third-party licensed typefaces in our library. And I can understand some folks' frustration at the face that those goodies existed (if not ever in Adobe's type library) but were not included in Adobe's OpenType versions of the fonts.</p>
      <p>It might help people to rewind the clock to round about late 2001, when Adobe was doing planning to convert its entire library to OpenType.</p>
      <p>It was clear to us then that the rest of the type industry needed a indication of commitment from Adobe, that this OpenType thing was more than just a flirtation. Converting our entire type library to OpenType seemed like the strongest measure of that (along with increased OpenType support in our applications, which we were also working on at that time).</p>
      <p>My take is that negotiating new contracts with Linotype and Monotype/ITC, and then integrating additional materials, would have delayed things a couple of years if it was even successful. </p>
      <p>I can't know for sure, but I wouldn't want to bet either way on whether Lino and Mono would have agreed at the time. Heck, Linotype hasn't even given Adobe the rights to resell any of the fancy new OpenType fonts they've made over the last few years. Clearly they feel there is value in keeping some goodies to themselves.</p>
      <p>But even if it had been a viable option, delaying our OpenType conversion for, say, two years to incorporate more goodies would not have been a wise move, IMO. In those first few years of OpenType it was not a foregone conclusion that OpenType would become the new standard and other type foundries would flock to it. Had we taken too long to get our library converted, it would have raised serious questions about commitment to the format, and quite possibly cost us the momentum we needed - I'm not sure we would have reached "escape velocity" with that delay.</p>
      <p>At *best*, I believe it would have slowed the rest of the industry's conversion to OpenType by about two years as well. I can imagine us being in this alternate universe, wherein QuarkXPress 7 doesn't have any OpenType layout support, and the rest of the type foundries would be now at the point they were at two years ago - and that's my *best* outcome.</p>
      <p>If we'd had to tell Adobe's own applications that we wouldn't have a converted font library until 2005, I don't know if we'd have gotten their full buy-in when we did, either. Being able to promise that the fonts were coming and quickly was an important part of why our own applications bought into the feature support. So at worst, OpenType might have been relegated to the same status as AAT or multiple masters... ack.</p>
      <p>That's all speculation, of course. That being said, I've watched this very carefully from the inside for 9.5 years now, and have been involved in a lot of discussions about OpenType support with our own applications, third parties, and OS vendors over the years. </p>
      <p>So, I wish that we had more typographic goodies in the third party fonts, but even if we could revisit that decision, I don't know that I for one would be arguing for us to so it differently.</p>
      <p>Cheers,</p>
      <p>T</p>
      <p>Thomas Phinney<br>
      Product Manager<br>
      Fonts &amp; Global Typography<br>
      Adobe Systems</p>
