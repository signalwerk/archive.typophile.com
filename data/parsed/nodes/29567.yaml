      <p>John, I think part of the problem is although I think your complaint is valid— how you choose to convey your points are often a bit extreme. Instead of accusations, perhaps inquire about why this exists, instead of going on a tirade. Shock tactics often work to get attention, but once you've gotten the attention the tactics can be called into question.</p>
      <p>On the other hand, while it is the buyer's responsibility, to investigate the features in large font packages...what is included with each family can also be misleading. In addition to going through a line item on every font in a package (which can number in thousands) the user is also expected to check every feature associated with every single font in a package? Let's get real people, spending thousands of dollars on a font package and finding a surprise like this might get you a little miffed. No disrespect to the people who worked hard on putting packages like this together— but we can't forget about the consumer, this can be considered misleading.</p>
