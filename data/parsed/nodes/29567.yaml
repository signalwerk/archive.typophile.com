      <p>ffetish, </p>
      <p>this doesn't apply to any Microsoft Office version, Windows or Mac. Microsoft Office for Windows supports OpenType Layout features but only for "complex scripts" (Hebrew, Arabic, Indic etc.) Microsoft Office for Mac does not support any OpenType Layout features at all. WPF and XAML are completely unrelated to Office. </p>
      <p>If you're interested in XAML, check out the free beta versions of two Microsoft Expression applications:<br>
      <a href="http://www.microsoft.com/products/expression/en/Expression-Design/" title="http://www.microsoft.com/products/expression/en/Expression-Design/">http://www.microsoft.com/products/expression/en/Expression-Design/</a><br>
      <a href="http://www.microsoft.com/products/expression/en/expression-blend/" title="http://www.microsoft.com/products/expression/en/expression-blend/">http://www.microsoft.com/products/expression/en/expression-blend/</a></p>
      <p>They'll allow you to build XAML documents to which you can manually add styling code to enable various OpenType features. </p>
      <p>See:<br>
      <a href="http://www.microsoft.com/typography/links/news.aspx?NID=5759" title="http://www.microsoft.com/typography/links/news.aspx?NID=5759">http://www.microsoft.com/typography/links/news.aspx?NID=5759</a></p>
      <p>(Note that unfortunately, neither Expression Design nor Expression Blend allows you to author text using OpenType Layout features directly). </p>
      <p>Adam</p>
