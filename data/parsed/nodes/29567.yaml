      <p>The devil is in all the legacy typefaces and all of the legal entanglements they bring.  This is a huge headache for old and very large foundries like Adobe, Linotype/Monotype that have bartered brides and prenuptual agreements with more parties than caterers dream of. Once the big foundries can step out of that quagmire and do new opentype faces from scratch, it becomes easier. All the "new" Adobe original post opentype era faces take language differences and support as well as features like OSF hand in hand.  I guess if you can get beyond the lawyers and brokered business deals all is well for the future. Until then, we are in litigation purgatory.</p>
      <p>ChrisL</p>
