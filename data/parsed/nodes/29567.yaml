    date_raw: 25 Nov 2006 — 10:13pm
    date: 2006-11-25T22:13:00
    votes: null
    html: <p>Thanks Nick...you second a point I made, that we type lovers have to become very tough type shoppers. As I mentioned, the OT initiative has passed to other sources, like Monotype and ITC. From ITC, at long last, we can now get Berkeley Oldstyle with the oldstyle figures they had originally, pre-Postscript. And who ever thought we would see oldstyle figures for ITC Franklin Gothic? These options have emerged only in the past year. And, after the period of exclusivity I presume the licensors want, Adobe could acquire these completed versions in place of the incomplete versions they sell now.</p>
