      <p><em>Figuring out what is available in a type family isn’t that difficult. Yes, some sites do not offer enough information. However, if you know what it is that you need, why is it so difficult to find out.</em></p>
      <p>Tiff, I think it is often more difficult than it needs to be. While your example is an "ideal" situation, if you're starting from scratch building a type library from the ground up and you need for example ALL of the classics— line item searching takes a long time. Time you may not have when you've got a lot of clients and a lot of work piling up.</p>
      <p>Example. I did some research to get the most cost effective package(s) to get the company I work for up and running. I found a few fonts in the package were bits and pieces of complete families. Huh? What am I going to do with just the bold weights of some well known families? A consumer can feel like (at least I do) that if I can't have it all there...don't give it to me at all. </p>
      <p>It's like buying a bicycle and finding out there's no wheels in the box. I'm not saying I'm not partially at fault— but buying font bundles can get a little tricky.</p>
