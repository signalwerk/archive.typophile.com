      <p>Mondo, </p>
      <p>I think you should understand a simple thing: it was not a matter of Adobe "collaborating" with Linotype, Monotype or ITC. My guess is that when Adobe released the "Std" versions of the Linotype, Monotype and ITC fonts, the LinoMonoITC conglomerate (as it is now) were interested in releasing "Pro" versions of these faces later. So it was quite obvious that neither Linotype nor Monotype/ITC were particularly fond of giving the data to Adobe on a "good will" basis. Also, adding new glyphs requires new kerning etc. With the sheer number of typefaces in the Adobe Type Library, this would surely delay the production considerably. </p>
      <p>But there is a simple key to the naming in the Adobe Type Library. "Std" and "Pro". You can simply assume that the Adobe "Std" fonts are simply a sum of the previously existing Adobe Type 1 fonts while the "Pro" fonts have been reworked and expanded. </p>
      <p>The Plantin Type 1 versions with OsF you're referring to were the Monotype versions, not the Adobe versions, as far as I can tell. </p>
      <p>A.</p>
