      <p>John, I think part of the problem is although I think your complaint is valid— how you choose to convey your points are often a bit extreme. Instead of accusations, perhaps inquire about why this exists, instead of going on a tirade. Shock tactics often work to get attention, but once you've gotten the attention the tactics can be called into question.</p>
