      this work is far from finished. The initiative for transforming type<br>
      classics into full-glyph OpenType has passed to others, notably Monotype and<br>
      ITC. That's where the OT action is now: the new issues at fonts.com and<br>
      itcfonts.com.</p>
      <p>I voiced my complaint on behalf of the many customers who spent thousands on<br>
