    html: |-
      <p>Many thanks to Thomas for an illuminating post. Launching OpenType was a<br>
      high-wire act, for which Adobe deserves all kinds of credit. But we also see<br>
      this work is far from finished. The initiative for transforming type<br>
      classics into full-glyph OpenType has passed to others, notably Monotype and<br>
      ITC. That's where the OT action is now: the new issues at fonts.com and<br>
      itcfonts.com.</p>
      <p>I voiced my complaint on behalf of the many customers who spent thousands on<br>
      Adobe's complete OpenType library expecting to enjoy a new world of options<br>
      across the board. Then, in a dismaying number of faces, they got nothing of<br>
      the sort. For quite a few, literally the only new thing was the Euro<br>
      symbol. Those who still wanted full-glyph versions of faces left incomplete by Adobe now had to BUY THEM AGAIN elsewhere, if they could. For these burned customers, my complaint would seem understated.</p>
  - id: 170063
    user_id: 1133
    user_name: twardoch
    user_path: null
    date_raw: 24 Nov 2006 — 12:10pm
    date: 2006-11-24T12:10:00
    votes: null
    html: |-
      <p>Mondo, </p>
      <p>I'm not sure why it is so that you or other customers believed that the new OpenType library contains something that it doesn't contain. I remember Adobe advertising the OpenType library as offering a cross-platform font solution (the same font file for different operating systems), easier access to various extra glyphs such as ligatures, Unicode compatibility, the presence of the euro character, and -- for the "Pro" fonts -- expanded character sets. This actually already accounts for a "new world of options". </p>
      <p>However, if some computer magazine journalist or whoever else this might be made you or some other customers that "everything is new" in the Adobe OpenType library, I'd seriously go and complain to that very journalist or the other person. </p>
      <p>Otherwise, I would be interested to hear how you arrived at that very "expectation" that you describe. I don't recollect hearing anybody at Adobe lying about the contents of the Std fonts -- therefore I'd be curious to know. </p>
      <p>Best,<br>
      Adam</p>
  - id: 170207
    user_id: 14529
    user_name: mondoB
    user_path: null
    date_raw: 25 Nov 2006 — 6:57pm
    date: 2006-11-25T18:57:00
    votes: null
    html: |-
      <p>Adam, if you go to their website sales copy for Adobe Font Folio OpenType edition, under Key Benefits of buying the CD, it promises:</p>
      <p>--Revive fine typography with expanded glyph sets containing swashes, small caps, and old-style figures...</p>
      <p>--Take advantage of multiple font packages with merged character sets, allowing easy access to expert set characters — such as small capitals and old-style figures — when using OpenType savvy applications...</p>
      <p>Nowhere on that page does it say "except for families we could not complete this way" or words to that effect. The customer finds that out the hard way. Basically Adobe's response to this complaint comes down to "you should have read the fine print" or rather checked out each font or family's glyph schedule. But as Terry Biddle said above, this is completely impractical--there are "more than 2,200 fonts." </p>
      <p>If you read the Key Benefits, you will see that a customer would be easily misled into thinking full glyphs are promised across the board. I've heard exactly this lament from plenty of NYC type buyers who are usually tough customers. The helpful thing would be for Adobe to list faces/families by their glyph coverage in one place; nothing of the sort appears in the sales section now. Thomas, in his post above, admits the validity of our complaint while pleading extenuating circumstances. For those burned, that's very cold comfort, and for the retailer, worse PR.</p>
  - id: 170211
    user_id: 2021
    user_name: Nick Shinn
    user_path: null
    date_raw: 25 Nov 2006 — 8:09pm
    date: 2006-11-25T20:09:00
    votes: null
    html: |-
      <p>John, I sympathize -- up to a point.<br>
      I think your expectations have been fluffed by Adobe's largesse, which has also made them somewhat indiscriminate.<br>
      So it's good that you have raised this issue, so that reality can set in.<br>
      The fact is, as the foot soldiers are pointing out, OpenType is a huge job of work.<br>
      With the bernefits it offers also comes the responsibility, and the onus, for end users to become more informed about the differences between font features -- better typographers, even. Because there is no longer a standard font format, if there ever was. Even with Adobe's offerings, which do a good job of being consistent, there are still internal discrepencies, such as the Adobe Caslon Pro Small Caps issue (when you select small caps in InDesign, you get vrai for the Roman, but faux for the Italic). I mention this not to castigate Adobe, but to draw a line that is hopefully helpful.</p>
      <p>Now mix into the equation the different feature sets that independent foundries will implement in their OpenType fonts, and I think what will emerge is a cultural environment where the expertise of typographers will come to the fore, in discriminating between not just the aesthetic quality of typefaces and fonts, but also their functional capabilites, based on their differing feature sets. So mass bundling won't be an easy option, for seller or buyer.</p>
  - id: 170217
