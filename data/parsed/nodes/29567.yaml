      <p>John, I sympathize -- up to a point.<br>
      I think your expectations have been fluffed by Adobe's largesse, which has also made them somewhat indiscriminate.<br>
      So it's good that you have raised this issue, so that reality can set in.<br>
      The fact is, as the foot soldiers are pointing out, OpenType is a huge job of work.<br>
      With the bernefits it offers also comes the responsibility, and the onus, for end users to become more informed about the differences between font features -- better typographers, even. Because there is no longer a standard font format, if there ever was. Even with Adobe's offerings, which do a good job of being consistent, there are still internal discrepencies, such as the Adobe Caslon Pro Small Caps issue (when you select small caps in InDesign, you get vrai for the Roman, but faux for the Italic). I mention this not to castigate Adobe, but to draw a line that is hopefully helpful.</p>
      <p>Now mix into the equation the different feature sets that independent foundries will implement in their OpenType fonts, and I think what will emerge is a cultural environment where the expertise of typographers will come to the fore, in discriminating between not just the aesthetic quality of typefaces and fonts, but also their functional capabilites, based on their differing feature sets. So mass bundling won't be an easy option, for seller or buyer.</p>
