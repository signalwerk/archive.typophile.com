      <p>It's far more complicated that simply "retrieving" old style figures. The font data you're talking about are owned by someone else, and are not presently (and have never been) part of any licensing agreement with Adobe. It is far from trivial to negotiate such things. Sometime it is not possible. Remember, Adobe and Monotype have their respective businesses to run, and there are perfectly legitimate business reasons why you might never see this material in a font sold by Adobe. I don't know where you got the idea that the supplements for Plantin, et al., are so easily available to Adobe. That's simply not true.</p>
      <p>It is even more fantastic to suggest Adobe commission such additions. We are not at liberty to create and sell additions to a typeface we're licensing from another foundry any more than, say, Monotype is at liberty to commission and sell additions for Minion.</p>
      <p><cite>I read Chris' post with interest, but it did not seem to answer anything or exhibit much concern. Perhaps that's why we rant.</cite></p>
      <p>Amazing. You post a simplistic, insulting message and complain about the quality of the response you get.</p>
