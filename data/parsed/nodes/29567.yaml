      the sort. For quite a few, literally the only new thing was the Euro<br>
      symbol. Those who still wanted full-glyph versions of faces left incomplete by Adobe now had to BUY THEM AGAIN elsewhere, if they could. For these burned customers, my complaint would seem understated.</p>
