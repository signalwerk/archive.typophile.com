      <p>"the naming key ('Std' vs. 'Pro') should be a good indication on what is going on."</p>
      <p>except it isn't. "Std" means a lot of things, discoverable only by researching each font's glyph schedule. Monotype Dante and Bembo "Std" have been converted impeccably, with full glyph coverage and beautiful, easily accessed oldstyle figures, but Monotype Photina Std contains no new glyphs at all, just the Euro symbol.</p>
