      <p><cite>Why buy Adobe’s incomplete Plantin</cite></p>
      <p>Adobe's Plantin?<br>
      I think Mr Slye made it clear that Adobe's library consists of different typefaces from different sources. Adobe is originator of some, but kind of distributor of others.* (I hope this is plain enough yet still not too far from the truth.)<br>
