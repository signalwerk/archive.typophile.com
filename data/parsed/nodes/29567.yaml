      <p><em>It’s not possible to please everyone.</em></p>
      <p>But Cyrillic small caps shouldn't be too much trouble :-)<br>
      The trick is to make your Cyrillic lower case the same x-height as your Latin small caps. Then, if you keep the Cyrillic small caps the same x-height as the Cyrillic lower case, you only need to make three new glyphs. Still, there's kerning too, to do it right, but as it's an OT font, class kerning makes that easy.</p>
