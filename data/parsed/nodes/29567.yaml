      <p>In a healthy company, most reasons are commercial. </p>
      <p>It seems that the benefit of having advanced typographic fireworks in Office application was not so far able to outweigh the cost of inducing uncertainties into such complex applications that need to deal with billions of legacy documents, and where text re-flow due to kerning changes or ligation would cause a lot of trouble. </p>
      <p>A.</p>
