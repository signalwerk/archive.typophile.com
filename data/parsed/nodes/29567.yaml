      <p>Thomas, </p>
      <p>I'd say the choice was good. The Adobe naming suggests that fonts without characters supporting *all* of EU's Latin-script language are less valuable than those that include all of them -- regardless of the fact how many small caps or ligatures they try to offer in exchange. </p>
      <p>Language coverage is like good nutrition and healthy style of living. Swashes and small caps are like make-up and nail polish. </p>
      <p>I have another naming scheme to offer: the fonts with just the Western character set are "Minimal", the ones with EU-wide Latin-script support are "Standard", and those that include all of Standard but offer something beyond that (small caps, swashes, Cyrillic, Greek) would be "Pro". </p>
      <p>Using these terms, all of Adobe's Std fonts would be "Min", Linotype's "Helvetica Neue Pro" would actually be "Std", while I think all of Adobe's "Pro" fonts would keep the "Pro" label. </p>
