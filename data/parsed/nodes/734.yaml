    html: <p> Joe, it didn't take 15 people 8 months to come up with that layout, it took them all that time to do all the *other* things on a site that need to be done - things that can't be copied in half an hour. <br> <br>These things actually make a site, rather than layouts and graphic treatments. How many sites have you been to look fabulous, but lack the most basic functionality and are thus totally frustrating to use. </p>
