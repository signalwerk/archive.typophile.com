    html: <p> C'mon Joe, you wouldn't keep bringing it up if you weren't at least a little bit proud of having your work copied. I haven't had any really good copies of my work since a kid named justin copied my skiing penguin in the third grade. (but boy did it make me mad). Realistically, though, a site like 3com is an obvious target. There will always be a few people making a lot less money in some mom and pop shop copying the big boys. It doesn't stop there, though. Look at the most recent spat between Macromedia and Adobe. I guess there is a fine line between cross polination and straight cloning. These guys obviously crossed it. </p>
