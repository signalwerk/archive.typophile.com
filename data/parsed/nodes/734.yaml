    html: "<p>Hah. You caught me . <br> <br>I have to answer getreal/joseph stalin/anonagain <br>and say that I have no intent on pursuing legal  <br>action with these guys. (I'll leave that to 3Com  <br>to protect their interests if they choose). What  <br>really irks me is that many people have no  <br>respect for the design process. The fact that it  <br>took 8 months and a team of 15 people to  <br>architect, design and build a site and then one  <br>empty slouch can copy it in about 8 hours. <br> <br>Don't get me wrong. I'm not stuck on this. I'm past  <br>being baffled and just thought it was funny to  <br>see a second copy. And I'm quietly hoping  <br>to see a third. <br> <br>And here for your amusement, the 3Com and  <br>NuclearCow icons: <br><img src=\"http://www.typophile.com/forums/messages/30/1388.gif\" alt=\"3Com icon\"> <img src=\"http://www.typophile.com/forums/messages/30/1389.gif\" alt=\"Nuclear Cow Icon\"> <br> <br>(No, I'm not claiming to have invented this icon  <br>idea. In fact I first saw it on the Art Center site  <br>circa 1997. But it certainly is my pixel-for-pixel  <br>execution.)</p>"
