  - id: 136801
    user: 1203
    date: 2002-05-15T15:56:00
    date_raw: 15 May 2002 — 3:56pm
    votes: null
    html: "<p> Ok, I'll play nice. <br> <br>We don't live in vacuums - other people get influenced by the same things we get influenced by and come up with their own solutions too. <br> <br>One of the basics of copyright, as opposed to some other forms of IP protection, is that it allows for people to independently come up with the same solution. It doesn't mean that anyone copied anyone else but that the number of solutions is finite: <br> <br>\"Great minds think alike - small ones seldom differ\" <br> <br>To be really brutally honest all three designs are just standard corporate print look - if you think otherwise you've been hiding under a rock for the last ten years. <br> <br>Some years ago I did a magazine redesign, a couple of months later a magazine in the same sector did a redesign too - they used the same typeface and similar styling to mine. Did they copy me or were both teams so caught up in the spirit of the moment that they didn't recognise the generic response that they'd offered their clients? <br> <br>If you really want to waste your time and get really excited about this you'll spend the next coupla months trawling the web to see how many other \"clones\" you can find. </p>"
    html_clean: "<p> Ok, I'll play nice. <br> <br>We don't live in vacuums - other people get influenced by the same things we get influenced by and come up with their own solutions too. <br> <br>One of the basics of copyright, as opposed to some other forms of IP protection, is that it allows for people to independently come up with the same solution. It doesn't mean that anyone copied anyone else but that the number of solutions is finite: <br> <br>\"Great minds think alike - small ones seldom differ\" <br> <br>To be really brutally honest all three designs are just standard corporate print look - if you think otherwise you've been hiding under a rock for the last ten years. <br> <br>Some years ago I did a magazine redesign, a couple of months later a magazine in the same sector did a redesign too - they used the same typeface and similar styling to mine. Did they copy me or were both teams so caught up in the spirit of the moment that they didn't recognise the generic response that they'd offered their clients? <br> <br>If you really want to waste your time and get really excited about this you'll spend the next coupla months trawling the web to see how many other \"clones\" you can find. </p>"
  - id: 136802
    user: 1160
    date: 2002-05-15T18:13:00
    date_raw: 15 May 2002 — 6:13pm
    votes: null
    html: "<p> People coming up with the same idea independently  <br>is one thing... a pixel for pixel copy is quite  <br>another. <br> <br>The guy from Oxona admitted to copying the  <br>design. He even had the gall to give me \"kudos\"  <br>for a cool design. He wanted to make it clear  <br>that he did not copy the code... just the design. <br> <br>If the 'nuclearcow' site was \"inspired by\" 3Com  <br>it'd be a somewhat different story. This is  <br>clearly ripped off. Do some math: the nav, the  <br>photo, the headline, the subhead, the body copy,  <br>even the footer and copyright notice are in the  <br>same position. That icon on the right... I  <br>designed it, pixel for pixel. <br> <br>More hilarity: their jobs section says they're  <br>looking for innovative people. Amazing. <br> <br>The lesson here is: if you want to protect a  <br>design you better have it copyrighted... and not  <br>just logos and trademarks. Fighting \"trade dress\"  <br>infringement is a much harder battle than  <br>copyright infringement. </p>"
    html_clean: "<p> People coming up with the same idea independently  <br>is one thing... a pixel for pixel copy is quite  <br>another. <br> <br>The guy from Oxona admitted to copying the  <br>design. He even had the gall to give me \"kudos\"  <br>for a cool design. He wanted to make it clear  <br>that he did not copy the code... just the design. <br> <br>If the 'nuclearcow' site was \"inspired by\" 3Com  <br>it'd be a somewhat different story. This is  <br>clearly ripped off. Do some math: the nav, the  <br>photo, the headline, the subhead, the body copy,  <br>even the footer and copyright notice are in the  <br>same position. That icon on the right... I  <br>designed it, pixel for pixel. <br> <br>More hilarity: their jobs section says they're  <br>looking for innovative people. Amazing. <br> <br>The lesson here is: if you want to protect a  <br>design you better have it copyrighted... and not  <br>just logos and trademarks. Fighting \"trade dress\"  <br>infringement is a much harder battle than  <br>copyright infringement. </p>"
  - id: 136803
    user: 1203
    date: 2002-05-15T19:17:00
    date_raw: 15 May 2002 — 7:17pm
    votes: null
    html: "<p>If the guy says he copied it, then fair enough, personally I wouldn't be be getting too excited about it  - \"imitation is the sincerest form of flattery\" and all that. <br> <br>The navs are similar but not identical. <br> <br>The photos have similar framing/cropping, but you're going to find that elsewhere too (<a href=\"http://www.bmwusa.com/\" target=\"_top\">http://www.bmwusa.com/</a>). <br> <br>The headline - maybe <br> <br>The subhead: font face=\"Arial\" size=\"5\" color=\"#6AA271\" - pushing it a bit I think. <br> <br>What icon on the right? <br> <br>So, you have a bunch of \"maybes\". Having it registered at the copyright office is going to do what? Perhaps give you a little leverage before you go to court. If you end up in court they're going to pull out 3 dozen different sites that contain all or some of these elements. <br> <br>What are you going to do then - pay the lawyer and go home with a long face. <br> <br>I'm sympathetic to trying to protect your work, but a bit of layout that is not innovative coupled with some navigation that definitely is not innovative isn't going to get you very far. <br> <br>Sorry.</p>"
    html_clean: "<p>If the guy says he copied it, then fair enough, personally I wouldn't be be getting too excited about it  - \"imitation is the sincerest form of flattery\" and all that. <br> <br>The navs are similar but not identical. <br> <br>The photos have similar framing/cropping, but you're going to find that elsewhere too (<a href=\"http://www.bmwusa.com/\" target=\"_top\" class=\"link-external\">http://www.bmwusa.com/</a>). <br> <br>The headline - maybe <br> <br>The subhead: font face=\"Arial\" size=\"5\" color=\"#6AA271\" - pushing it a bit I think. <br> <br>What icon on the right? <br> <br>So, you have a bunch of \"maybes\". Having it registered at the copyright office is going to do what? Perhaps give you a little leverage before you go to court. If you end up in court they're going to pull out 3 dozen different sites that contain all or some of these elements. <br> <br>What are you going to do then - pay the lawyer and go home with a long face. <br> <br>I'm sympathetic to trying to protect your work, but a bit of layout that is not innovative coupled with some navigation that definitely is not innovative isn't going to get you very far. <br> <br>Sorry.</p>"
  - id: 136804
