      <p>And for the sake of clarity, when Wikipedia says</p>
      <p><cite>doubled V used in the 5th century by the earliest writers of Old English</cite></p>
      <p>it can't be right. There is no Latin-script Old English from the fifth century. There may be "uu" digraphs found in Latin representations of other Germanic languages on the Continent around that time or a bit later, and there are some futhorc inscriptions (using wynn rather than uu) of that date in what appears to be a precursor of Old English (but not yet differentiated enough to be called such), but so far as I know, the earliest genuine representations by native speakers of Old English in Latin script are from the seventh century.</p>
