      <p><cite>Nor is a single pronunciation mapped 1:1 to a character or characters.</cite></p>
      <p>Actually, that's precisely the reason we have the usual definition of digraph. Many languages use pairs of characters to represent certain sounds. This is because the letters in a given alphabet almost always won't be enough to represent the full phonemic inventory of a language. When one discusses orthography and the relation between spelling and sound, it is quite essential to be able to discuss this phenomenon. Again, I emphasize that this is standard terminology in that field.</p>
      <p>By this definition, Norwegian Æ is not a digraph. I personally haven't seen the definition you are using anywhere else; could you tell us where your definition is taken from or show us where the term is used according to your definition?</p>
      <p><cite>Now, why hasn’t anyone brought up Spanish Ch and Ll?</cite></p>
      <p>These are interesting in that they are digraphs that were traditionally considered letters in their own right.</p>
