      <p>Let's clear up the terminology. There are established definitions for these terms that are quite precise.</p>
      <p><em>Digraph</em> has a more usual meaning of two characters that as a pair are used for something more than one would expect from a simple sequence of those two characters. For example, in the English word 'sheath' the pairs 'sh', 'ea', and 'th' are all digraphs. Digraphs, trigraphs, etc. are strategies used by orthographies to represent more sounds and distinctions than are possible using a limited inventory of single letters. Digraphs may sometimes be considered single characters, like the Dutch ij, but most are considered a sequence of two letters. However, visually, digraphs are usually indistinguishable from a normal sequence of the component glyphs.</p>
      <p>When a pair of glyphs are actually modified in their forms as to be distinguished from a normal sequence (so that they touch, for example), then we have a <em>ligature</em>. This criterion has nothing to do with aesthetics. There are typographic ligatures like ﬁ, which is semantically just the sequence of characters f and i (just tweaked so that they don't clash horribly), but there are also ligatures like æ which in several modern languages is considered an independent character (Note that fi is not a digraph since it behaves no differently from how you would expect the sequence f and i to behave). In modern representations of Classical Latin, æ may represent the digraph ae that would later merge with e. So w represents a ligature in origin that replaced an older digraph uu.</p>
      <p>A <em>diphthong</em> is something else entirely. It deals with certain types of vowel <em>sounds</em>, namely when vowel quality changes over the course of a single unit of sound. It so happens that when diphthongs are represented in orthography, they are often written as digraphs (as in English 'loud' or 'show', but not 'hi'), and very rarely there are ligatures that represent diphthongs (like æ in Classical Latin and Modern Icelandic, though not for Late Latin nor for Danish and Norwegian), but that's about it.</p>
      <p>So the important distinction is that <em>digraph</em> is concerned with characters, <em>ligature</em> with glyphs, and <em>diphthong</em> with sounds. These terms deal with completely separate levels. A ligature may be a digraph or it may not be one. A digraph is sometimes represented with a ligature, but most of the time it isn't. Either of these may or may not correspond to a diphthong, sometimes even within the same language. A diphthong is a diphthong even if it has never been represented in writing.</p>
    html_clean: |-
