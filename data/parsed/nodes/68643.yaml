      <p>Joe, I didn't say that ­Æ was just a separate letter. I said that in some orthographies it is a separate letter. In other orthographies it representes a digraph, but this statement is incorrect:</p>
      <p><em>If you decompose the suspect character and the result is an error, what you’ve got is a digraph</em></p>
      <p>because a digraph by definition is two <em>letters</em> representing a distinct sound* -- a grammatological, not typographical, role -- , and it doesn't matter whether those letters are written separately or ligated. Indeed, the fact is the opposite of what you write: if you decompose the suspect typeform and the result is <em>not</em> an error, what you've got is a digraph. If the result is an error, as it would be in e.g. Norwegian, then what you've got is a separate letter.</p>
      <p>What we do with digraphs in typography has no bearing on whether or not they are digraphs, because it is their relationship to phonology not their appearance that defines them as digraphs. Here's a simple example: in ecclesiastical Latin the two-letter sequence AE is always a digraph representing a single vowel sound, but AE and Æ are equally valid ways of displaying this digraph and mean exactly the same thing.</p>
      <p>It's worth noting that many (most?) digraphs, trigraphs, tetragraphs and pentagraphs represent consonant phonemes, not vowels. [The only hexagraphs I know of represent vowel sounds, but interestingly they include what we normally think of as consonant letters. Irish spelling is a hoot.] And again it makes no difference whether the letters involved are separate or ligated.</p>
      <p>___<br>
      * To a add a nuance, and perhaps more confusion, digraphs etc. are best identified on the basis of representing sounds other than those represented by the individual letters, <em>not necessarily single phonemes.</em> In other words, a digraph etc. may represent a combination of sounds, but different from the combination that the individual letters read independently would suggest. Hence, in classical Latin, the digraph AE/Æ represented a diphthong [ai̯], not a single phoneme, and the Irish hexagraph <em>eidhea</em> also represents a diphthong [əi̯].</p>
      <p>Finally, confusion-upon-confusion, in some orthographies a digraph etc. only functions as such in particular preceding and/or following contexts.</p>
