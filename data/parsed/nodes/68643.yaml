      <p><cite>The quote from the OED I cited makes it pretty clear that uu was first a diphthong ("The sound was at first represented by uu"), then eventually a ligature.</cite></p>
      <p>No, you misunderstand the definition of <em>diphthong</em>. The sound represented by uu/ƿ/w is the voiced labio-velar approximant [w] or something close to it. In lay terms, it is a semivowel corresponding to /u/, although in English it usually behaves as a consonant so it is more appropriate to call it an approximant rather than a semivowel. </p>
      <p>A diphthong is a special kind of full vowel sound that changes in quality from beginning to end. The English word 'eye' starts with a vowel quality like 'ah' and glides into a vowel quality like the vowel in 'bit'. By contrast, the vowel sound 'ah' maintains the same vowel quality from beginning to end in most dialects, so is called a monophthong. English is quite rich in diphthongs. Here are some words featuring diphthongs: lie, lay, lure, lair, low, leer, loud. For comparison, here are some words featuring monophthongs: lap, lot, let, lit, loot, lean, law.</p>
      <p>The sound [w] doesn't represent a full vowel so it is neither a monophthong or a diphthong, but as a semivowel it can be the component of a diphthong, as in 'low' and 'loud'. You can see that sometimes this is represented in spelling, as in 'low', but not always, and a word like 'law' looks like it ought to have a diphthong that ends in [w] but is actually pronounced with a monophthong. This is because pronunciation is always changing and English orthography doesn't represent today's pronunciation very well (but Chaucer probably pronounced 'law' with a diphthong ending in [w], like that in 'loud').</p>
      <p>Sorry for being picky, but I think it's important to keep the distinctions clear.</p>
