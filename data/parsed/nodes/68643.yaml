      <p>So is it a <em>digraph</em> -- a unique character of its own, composed of two individually existing characters (I'm making this definition up right now) -- or a <em>ligature</em> -- an aesthetically pleasing way of representing two or more characters, without touching their meaning?</p>
      <p>Æ and œ (and perhaps the modern Interrobang ‽ and -- discussed before -- Dutch ĳ) are digraphs. ﬁ, ﬄ, and ﬆ are ligatures in some fonts, and not in others (and in the case of ﬆ, only in some circumstances).</p>
      <p>Perhaps this difference is just semantics, in case all forms predate the use of these terms...</p>
