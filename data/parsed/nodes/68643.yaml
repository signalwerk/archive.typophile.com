      <p>Brian: <em>Digraph and diphthong are not typography terms except tangentially</em></p>
      <p>Agreed. A digraph is a grammatological concept, part of the description of a writing system as applied to particular languages. A diphthong is a phonological concept, part of the description of vowel sounds in spoken language. A ligature is a typographical concept, part of the description of how text is displayed.</p>
      <p>The word ligature is also used sometimes in description of manuscript text, but I think this is almost always erroneous. There are ligatures in writing, but they are not what we think of as ligatures in type, they are joining <em>strokes</em> that do not form part of letters as alphabetic units.</p>
      <p>Tom Milo has a distinctive use of ligature in the description of Arabic text: a connection between letters that normatively do <em>not</em> connect, e.g. a touching connection between a letter at the end of one fusion (letter group) and another at the start of the next.</p>
