      <p>The definitions I supplied are not meant to reflect some whimsical personal preferences but actual usage of these terms in the wider world; they correspond to the 1st definition of digraph and the 4th definition of ligature in MW:</p>
      <p><a class="freelinking external" href="http://www.merriam-webster.com/dictionary/digraph">http://www.merriam-webster.com/dictionary/digraph</a><br>
      <a class="freelinking external" href="http://www.merriam-webster.com/dictionary/ligature">http://www.merriam-webster.com/dictionary/ligature</a></p>
      <p>MW also has a broad definition of digraph as any group of two successive letters, and if you look at the 3rd definition, 'digraph' is also used in the sense of 'ligature'. So there is a confusion of these terms that MW documents, but I prefer to use them in their specific senses.</p>
      <p>In typography one doesn't really need to talk about digraphs, so when one does use the word it may often be as an alternative term for 'ligature', and this might be fine if we never had to use 'digraph' in its original sense. But when one talks about orthographies of different writing systems (another area of interest of mine), the term 'digraph' in its primary sense is quite indispensable, so I would like to keep the two terms separate.</p>
      <p>Joe, you seem to be describing what I would call 'stylistic ligature', ligatures employed for stylistic reasons. But any joined letters including Œ, Æ, and originally W are ligatures, as MW and the OED passage quoted above demonstrates. Again, in typography we mostly talk about stylistic ligatures, but that's only one specific subset of ligatures.</p>
