      <p>I don’t think I agree with Jongseong’s definitions of digraph and ligature. Ligatures are a stylistic attribute and not a fundamental feature of spelling, can we not agree? Nor are separated letters digraphs (QED). If you can’t decompose a character (like <cite>Œ</cite> or <cite>Æ</cite>) without causing an error, what you’ve got is a digraph, I contend. </p>
      <p>(Then you get cases where people have put up with typographically incapable machines, like manual typewriters, for so long they have come to accept that <cite lang="fr">COEUR</cite> and <cite lang="fr">CŒUR</cite> are interchangeable  in every respect <em>even though they aren’t</em>. See also: Pervasive American myth that French upper case doesn’t need accents.)</p>
