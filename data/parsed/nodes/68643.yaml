    html: <p>We have not touched yet on the sorting issue and how it relates to the way in which people think about what constitutes a ‘letter’ in their alphabet. The popular example -- discussed here many times -- is the Dutch <em>ij,</em> which has an identical role in native Dutch words regardless of whether it is written as separate or ligated letters, and which represents a phoneme different from that suggested by the individual prounciation of <em>i</em> and <em>j</em>, and hence meets the standard definition of a digraph. [And Brian is right, this is the standard definition.] But it is traditionally considered a distinct letter of the Dutch alphabet because of the way in which it sorts and how it traditionally behaves in e.g. vertical or letterspaced text.</p>
