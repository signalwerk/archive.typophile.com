      <p>John: <cite>I think there is only one useful definition of ligature as a noun in the context of typography, and that is a single glyph representing more than one character (whether the glyph in question is a chunk of metal, a cell in a phototype matrix, or a GID in an sfnt font).</cite></p>
      <p>I agree that such a definition would be useful in the context of typography, because in type design we operate at the level of glyphs, not characters. One could design an 'fi ligature' with a shortened f so that the components don't connect, and put it as a single glyph in the slot assigned to the fi ligature. Then it isn't a ligature according to the definition I presented, but for our purposes, it makes sense to call it one. Or in a typeface representing connected handwriting, it wouldn't be efficient to call every word a ligature because the letters are all joined, unless it is actually designed as a single glyph.</p>
      <p>Again, I tried to present definitions that are not typography specific, but as they are understood in the wider world. <em>Digraph</em> and <em>diphthong</em> are not typography terms except tangentially, but <em>ligature</em> is, so I guess it would make sense to refine the definition as to be more useful to the practitioners.</p>
      <p>Joe: <cite>Pervasive American myth that French upper case doesn’t need accents.</cite></p>
      <p>Like Johnny, I can confirm that this is not just an American myth. The French themselves very often omit accents in capital letters, even if the official position is that these are not optional should always be included. This is not helped by the fact that the French keyboard provides no way of inputting Ç, É, or Œ (or œ for that matter). Other accented capitals such as À and È can only be typed using dead keys, while lowercase à and è can be typed with a single key. By contrast, I think all the accented capitals of French except Œ are accessible with the Canadian French keyboard.</p>
