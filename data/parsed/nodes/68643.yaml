      <p>Brian, I think there is only one useful definition of ligature as a noun in the context of typography, and that is a single glyph representing more than one character (whether the glyph in question is a chunk of metal, a cell in a phototype matrix, or a GID in an sfnt font). That is, a ligature is a particular technical solution to the display of multiple characters as a single typeform (the latter is a useful, technology-independent term to refer to the visual units of typographic output, recognising that when we see typeforms displayed on a screen or printed on a page we can't tell how many glyphs are involved).</p>
      <p>Joe: <em>Ligatures are a stylistic attribute and not a fundamental feature of spelling, can we not agree? Nor are separated letters digraphs (QED). If you can’t decompose a character (like Œ or Æ) without causing an error, what you’ve got is a digraph, I contend.</em></p>
      <p>If you can't decompose a character such as Œ or Æ, then what you are looking at are single letters, not digraphs. This is language-specific: AE in ecclesiastical Latin is a digraph (I believe in classical Latin it was probably a diphthong), and is sometimes written in ligated form Æ and sometimes not; Æ in Norwegian is a single letter and must always be written in this ligated form. Ligation is neither always semantic nor always stylistic: it is the joining of what may be recognisable as separate letters into a single typeform, which may represent, in that form, either the same thing as the separate letters (stylistic ligation) or a distinct letter (semantic ligation).</p>
      <p>Of course separated letters may be digraphs; indeed, the majority of digraphs in the majority of alphabets are written in separated form. Ligation of digraphs is actually quite rare, and more non-digraphs are ligated than are digraphs. There are also examples of (separated) trigraphs, tetragraphs, pentagraphs and, yes, hexagraphs (that's the most I've counted). As Brian wrote above, a digraph is any two letters that, in combination, are used to represent a different phoneme than the same letters represent in isolation or in combination with other letters. In English, of course, our use of letters as digraphs is as phonetically inconsistent as the rest of our spelling, so we get pairs of letters that sometimes function as digraphs and sometimes not, and even the same pair used as different digraphs, e.g. CHain vs eCHo.</p>
