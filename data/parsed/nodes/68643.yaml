      <p>Joe: <em>Even as someone with a linguistics degree I think it is unwise to link digraph status to phonological underpinning. Not every letter is pronounced, is it not? Nor is a single pronunciation mapped 1:1 to a character or characters.</em></p>
      <p>There is a whole range of phenomena in the relationship of alphabetical characters to phonemes, especially in languages with borrowed alphabets or with etymological spelling conservation and dynamic pronunciation change (of which English is a splendid example). [The constructed orthographies of many African and Amerindian languages tend to be much more systematic, with a monovalent relationship of signs and sounds.] Yes, there are silent letters, and there are letters which represent multiple phonemes depending on context, etymology etc.. And there are pairs of letters that represent a single sound, and this phenomenon is called a digraph. Just because the phenomena are numerous, complex, and may in places overlap, does not mean that they cannot be systematically described with an appropriate terminology.</p>
      <p><em>I restate one of my contentions: Norwegian Æ may be a letter, but it is also a digraph.</em></p>
      <p>But what do you gain from such a contention? You lose, or at least pointlessly blur, the distinction between the <em>æ</em> letter and actual digraphs in Norwegian such as <em>gj, kj, kk, rn, rs, sj, sk, tj.</em></p>
