      <p>In English, W began life as a digraph VV with the interesting status of a variant spelling replacing the single letter Ƿ (<em>wynn</em>), but which gradually became the preferred spelling and morphed, through ligation, into a single letter, in much the same way that an AE digraph morphed into a single Æ letter in Norwegian and other alphabets.</p>
      <p>Yes, it's per language, and not surprisingly because phonology is language-specific and alphabets tend to make common use of letters to represent the same phonemes only if direct transfer of an alphabet or portions of an alphabet have happened, especially within a language family. When no such direct relationship exists, only fluke will result in the same phonemes being represented by the same letter. Hence, for example, in Polish, the voiced rounded labiovelar approximant phoneme that is the most common signified of W in English spelling is represented by the letter Ł, while the letter W represents the voiced labiodental fricative that we write in English as V. Meanwhile, in Polish, the letter V isn't used at all, so an analysis if W as a VV digraph makes no sense at all in this particular language context. And so it goes.</p>
      <p>As far as I know, W is an English contribution to the modern Latin alphabet, and occurs in European alphabets in a west-east band across the middle of Europe from England to Poland. But the use of the letter varies as it moves east because of differences in phonology, first between the different Germanic languages and then all bets are off when it hits a Slavic language.</p>
    html_clean: |-
      <p>In English, W began life as a digraph VV with the interesting status of a variant spelling replacing the single letter Ƿ (<em>wynn</em>), but which gradually became the preferred spelling and morphed, through ligation, into a single letter, in much the same way that an AE digraph morphed into a single Æ letter in Norwegian and other alphabets.</p>
      <p>Yes, it's per language, and not surprisingly because phonology is language-specific and alphabets tend to make common use of letters to represent the same phonemes only if direct transfer of an alphabet or portions of an alphabet have happened, especially within a language family. When no such direct relationship exists, only fluke will result in the same phonemes being represented by the same letter. Hence, for example, in Polish, the voiced rounded labiovelar approximant phoneme that is the most common signified of W in English spelling is represented by the letter Ł, while the letter W represents the voiced labiodental fricative that we write in English as V. Meanwhile, in Polish, the letter V isn't used at all, so an analysis if W as a VV digraph makes no sense at all in this particular language context. And so it goes.</p>
      <p>As far as I know, W is an English contribution to the modern Latin alphabet, and occurs in European alphabets in a west-east band across the middle of Europe from England to Poland. But the use of the letter varies as it moves east because of differences in phonology, first between the different Germanic languages and then all bets are off when it hits a Slavic language.</p>
