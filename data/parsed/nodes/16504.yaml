    html: <p>I like the new stuff too. I think 10 might be stronger but it’s a question of preferred association too. 10 reads as ‘junk=drugs’. But 11 reads m ore as ‘trash’ to me. I have no idea if reads that way to you too or which association you want to play with more or why. In any case I agree with Lauri ( antiphrasis ) that the J should be bigger.In a way it’s the hook bothe letterally ( it’s hook shaped ) and figuratively - because it’s first letter in the the odd/interesting word. I think making more of it would jive you a stronger result. And lastly, I don’t know that you need to enhance the M in media with the color of the J.  I like having just the J be in color. Making all the spotches &amp; scratches be colored too might be cool.</p>
