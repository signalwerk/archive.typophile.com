      <p>I agree with everyone that #8 is the strongest design. The only thing bugging me is that the J is set using a serif font while everything else is sans. Is there a particular reason for doing that or is does it appear like that purely because of the distressed effect?</p>
      <p>As an aside I also like #6 but it’s offputing because the “junk” has slid right off the boundary of the logo. While I do appreciate the metaphor that the junk is being sort of disposed of you do not need to overstate this. Just by setting the text in a grungy distressed type you have established its feel. Try #6 with the “junk” text aligned similarly to #8 and let’s see how that looks.</p>
      <p>-mmilo</p>
