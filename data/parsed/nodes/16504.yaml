    html: |-
      <p>I agree the j seems small in 8. Junk is ther Key Idea - no? Which is why I was wondering about a bigger j. I also thought of another idea. </p>
      <p>What if you had a railroad spike &amp; then bent the end to make a J? A spike is of course slang for the needle so it would be less direct but still connected. And you wouldn’t need the needle then either… Also a bent spike is junk in some sense -litterally. Because it’s useless - unless you use it as a J in a bit of media…</p>
      <p>Anyway. I encourage you to keep playing with it until you get a set of size &amp; spacing relationships that gel for you. 8 Is good as a purely visual design but I think it deemphasizes the key idea so you should keep going.</p>
