    html: |-
      <p>If you are talking about the fonts here:</p>
      <p>Library --&gt; Application Support --&gt; Adobe --&gt; Fonts</p>
      <p>You  need to leave all the fonts in the "Reqrd" folder alone and in that location. All the others you can safely move. (Or at least I safely moved them.)</p>
