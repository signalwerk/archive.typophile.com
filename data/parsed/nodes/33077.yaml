  html: |-
    <p>What fonts are required in THE Adobe APPLICATION SUPPORT FONT FOLDER for Indesign to function?</p>
    <p>I would like to be able to move Opentype fonts into my System Font Library so they can be used by other non-Adobe applications.</p>
    <p>Thanks in advance!</p>
