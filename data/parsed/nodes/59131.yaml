  - id: 354117
    user: 1262
    date: 2009-06-28T09:38:00
    date_raw: 28 Jun 2009 — 9:38am
    votes: null
    html: <p>The only thing I don't really care for in the Optima Nova italic is the tail on the lowercase l, which contravenes the general treatment of the type. Other than that, I disagree with Nick and think the new italic is in every respect an improvement on the awkward oblique. I do think italic types modelled on slanting the roman letterforms <em>can</em> work, but digital Optima doesn't because a) it is too wide and b) the stroke contrast is distorted. With regard to this, I think it would be worthwhile to compare the digital oblique Optima italic with the original metal version. I am almost certain that someone cheated somewhere along the way -- either in the phototype manufacturing or the later conversion to Type 1 -- and mechanically obliqued the roman type.</p>
