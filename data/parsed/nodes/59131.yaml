    <p>Hi all!</p>
    <p>I'm working on a project for which I'm using Optima (I own Optima LT Std), but I would loooove to have the true italics that Optima Nova offers. However, my client doesn't really have the budget to buy new fonts, and I certainly cannot afford to buy all, or even a few weights, of Optima Nova. However, I'm thinking that I (or he) may be able to afford one or two italic weights. My concern is if the italic of Optima Nova will go well with Optima LT, or if the difference will be noticeable. It seems that, while there is SOME difference in the roman letterforms—the 'a', especially, they seem to be pretty consistent. And I understand Hermann Zapf himself was a designer of Nova, so I would expect the differences to be slight. </p>
    <p>In short: do you think I could mix the roman of Optima LT Std with the italic of Optima Nova?</p>
    <p>Thanks in advance, sorry for the longwinded explanation.</p>
