      <p>All of the digital Optima’s compare badly to the original letterset — too much of a compromise in the verticals (those subtle concaves!). One would have thought that high resolution output and better hinting would facilitate a more accurate representation… But looking at my early Optima letterproof, I have to conclude that the original is still eons ahead.</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
