    html: |-
      <p>I prefer the original oblique italics of faces such as Optima and Frutiger.</p>
      <p>In fact, the originals are the true italics, and the revisions are somewhat pretentious, occasioned perhaps by the marketing requirement to provide an obvious visual difference, rather than in any merit this style of italic may have for the typeface in question.</p>
      <p>However, in the OpenType era it seems that stylistic alternates don't break the bounds of a typeface design.<br>
      So perhaps both styles of italic could be included in such fonts, with one as default and the other as a Stylistic Set.</p>
