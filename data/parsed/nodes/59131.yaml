      <p>There were real drawn obliques for Optima prior to Type 1 release. I used them in pre-PostScript digital formats, and you can find specimens.</p>
      <p>They disappeared in the same period as the real Futura italics and drawn ITC Avant Garde obliques in the early Type 1 days.</p>
