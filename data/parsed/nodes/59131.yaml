    html: |-
      <p>Thanks, Peter. So the light, distorted Optima oblique is an artefact of the PS digital conversion. This doesn't surprise me. The Type 1 format includes a slant value that can be used to produce an oblique font from a set of upright outlines. This was done for a number of Adobe/Linotype fonts. Helvetica was another example.</p>
      <p>It's always fun to watch the look on someone's face when they open e.g. the Type 1 version of Helvetica Italic in FontLab and realise that they're looking at a set of roman outlines.</p>
