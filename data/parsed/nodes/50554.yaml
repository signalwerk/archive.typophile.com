      <p>I usually just choose ’smallest filesize’ from the presets dropdown menu in the PDF export window. I don’t know if this makes the smallest PDF possible, but small enough for me.</p>
      <p>But if the outcome is really important for you in this case, I would just try the different options you describe, and see which method is the most convenient / best. :)</p>
