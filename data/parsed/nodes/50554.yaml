    html: |-
      <p>yeah i came across a similar problem when i worked on an online literary journal. i find saving postscript files and converting them with distilller helps a lot. you can even create your own compression script (called .joboptions i think) in distiller to specify just where you want to ’squeeze’ the compression rates and whatever. just go into distiller &gt; settings &gt; edit adobe pdf settings and a dialog box comes up with options.</p>
      <p>then just make sure when you save as you call it something different to the joboption file you based it on. </p>
      <p>if you’ve never used distiller before it’s not very complicated. after you’ve saved the ps file, open distiller, choose the setting from the drop down box (which you should’ve made a new setting for, or else pick one of the defaults) and drag the ps file into distiller.</p>
      <p>voila. i garauntee it’ll be smaller than the same file as an exported pdf.</p>
