    html: |-
      <p>Saving to the smallest filesize as Quincunx  suggested is a pretty good start. You could also change the compatibility to Acrobat 6, it makes the file size a bit smaller, and most people have Acrobat 6 by now.<br>
      Changing compression options at the Export pdf dialogue window helps, too (from the small file default 150 to 72 dpi, for example)</p>
      <p>It all depends what your needs are, the Photoshop save for web option isn’t a bad option, either.</p>
