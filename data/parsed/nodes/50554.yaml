    <p>Hi all</p>
    <p>I’m using Indesign cs3 to generate a pdf.<br>
    The pdf will contain only a jpg image and i’m trying to get the smallest file size possible for screen display.<br>
    My question is what would be the best way to do it.<br>
    Would it be using the save for web in photoshop and lowering the jpg quality, or would it be best to use a high quality jpg and reduce the image quality in the pdf export settings in Indesign?</p>
    <p>I tried both ways, and the results opticaly look practicly the same, but the advantage of photoshop is that it presents a lot more options available using the save for web command.<br>
    Anyway, it’s always nice to now how professionals usually do.</p>
    <p>Hope i’m being clear enough.</p>
    <p>Thanks in advance<br>
    Regards</p>
