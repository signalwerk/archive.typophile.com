    html: <p>Hugo, it seems that flash is wreaking havoc with your   <br>curves, some of them look as if they've been cut with   <br>scissors - at my end at least. It gets difficult to judge   <br>the sort of abrupt, 'uncultivated' style of the characters,   <br>the sort of inconsistency in stress and thickness of the   <br>curves... Does it work? Does it look amateurish? Or is   <br>it just a bug?  <br>  <br>I agree with Eduardo about the proportions and the squarish  <br>B. Also, the "midline" of B,E,F,H,R seems a bit too high.  <br>Well, there are other problems to sort out, as you know.  <br>I dig the Jj. I once designed one similar to this.  <br>  <br>abra</p>
