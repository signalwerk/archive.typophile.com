    <p>Hello everybody. <br> <br>This is Janaina, an attempt to design a text  <br>font for reading on screen and printed media. <br> <br>I'm designing it as my final project at college, <br>so any kind of comment will be very useful. <br> <br>I didn't work spacing and kerning yet, so I'm  <br>sorry I couldn't provide consistent examples of  <br>the font in use.  <br> <br>I've tried to keep the x-height as large as  <br>possible and avoided much thin/thick contrast  <br>to help with low-resolution appearance, but I'm  <br>still analyzing how those design decisions  <br>would affect the overall readability. <br> <br>'Q' is still very experimental, as well as font <br>diacritics. I'll have to work hard on that too,  <br>because the font is intended to be used in  <br>Portuguese language. <br> <br>Thanks in advance, <br>hugocristo <br> <br></p>
