      <p>Hrant: <br>Yes, shortening the descenders would be a nice <br>exercise too... I'll try that and post some  <br>tests here. <br> <br>Eduardo: <br>'B' is one of my favorite problems <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">... I'll <br>check 'S' and 'a' as well. Talking about reading  <br>for screen, I meant both hinting and fixed-size <br>bitmaped fonts. I'm taking this way because  <br>I'm working with type1 so I won't get accurated  <br>screen hinting and I'll need that for web <br>applications (mostly shockwave, but I'm <br>considering MS WEFT too). <br> <br>In fact I'm printing the font in large sizes  <br>on transparent paper and then 'squaring' each <br>glyph to fit my intended size grid (8 to 14pt). <br>Dunno if that's the best way of doing it but <br>it's working for me. <br> <br>Rodolfo: <br>I've attached a PDF example here. I hope it  <br>doesn't look amateurish anymore <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>The font is almost complete, so I think it's  <br>to start refining each character. As soon as I  <br>finish the figures I'll try to post some  <br>improvements here. <br> <br>Thanks again <br>hugocristo <br></p>
