  html: |-
    <p>One thing we rarely enjoy, when typesetting in french, is the opportunity to have rounded guillemets. </p>
    <p>No one is to blame of course!<br>
    This form has always been rare and can mostly only be found in fonts by Imprimerie Nationale (as the exemple here provided shows). </p>
    <p>Whats the advantage? Some typefaces have pointed guillemets which are - to my taste - too visible. Rounded ones would be softer to the eye and blend in better in text - much like the quotes (“such”).</p>
