      <p>The best know (and probably the biggest) foundry specialised in cyrillic typefaces is Paratype:<br>
      <a href="http://www.paratype.com/" title="http://www.paratype.com/">http://www.paratype.com/</a><br>
      <a href="http://www.fontshop.com/fonts/foundry/paratype/" title="http://www.fontshop.com/fonts/foundry/paratype/">http://www.fontshop.com/fonts/foundry/paratype/</a><br>
      <a href="http://www.myfonts.com/foundry/ParaType/" title="http://www.myfonts.com/foundry/ParaType/">http://www.myfonts.com/foundry/ParaType/</a></p>
      <p>But you can also try some search specifying language support:<br>
      <a href="http://www.myfonts.com/search/serif+charset%3Acyr/fonts/" title="http://www.myfonts.com/search/serif+charset%3Acyr/fonts/">http://www.myfonts.com/search/serif+charset%3Acyr/fonts/</a></p>
