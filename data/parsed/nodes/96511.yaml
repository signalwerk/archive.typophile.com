    <p>I am looking for a Cyrillic font, which looks similar to MVB Sirenne Text:<br>
    <a class="freelinking external" href="http://www.mvbfonts.com/mvb_sirenne" rel="nofollow">http://www.mvbfonts.com/mvb_sirenne</a></p>
    <p>or perhaps a foundry which specializes in Cyrillic serif fonts, so that I could choose something else?</p>
    <p>Thank you</p>
