    votes: null
    html: <p>The main reason I knew about the M is that it is one of the 7 key letters in my <a href="http://bowfinprintworks.com/SansIDPage.html" target="_blank">Sans Serif Font ID Guide</a>. The two characteristics I note are whether the legs are vertical or splayed, and whether the crotch (vertex) of the M reaches the baseline or not. This gives four possible M variations.   <br> <br>Another difference is that the tail on the R is very slightly curved in Sari, while it is completely straight in Barmeno. The R is another of my key letters, with four variations based on the position and shape of the tail. <br> <br>So Barmeno has  Style Codes of 31/37, while Sari is classified as either 31/38, or 31/62, based on whether you take the slight curve into account or not.  <br> <br>Pardon me for dwelling on this, as I realize I may be the only one who cares about how I classify Sans Serif fonts.</p>
