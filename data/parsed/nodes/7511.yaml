    html: <p>Yves, I don't want to be picky either, but in the interests of strict accuracy that is a slanted <a href="http://www.philsfonts.com/zzz_detail.html?sku=BQ90042001P1" target="_blank">Barmeno</a>, not <a href="http://www.philsfonts.com/zzz_detail.html?sku=FF01109701P2" target="_blank">Sari</a>. The one rather clear distinction between those two fonts is that Barmeno has a straight-sided M (like the sample). The M in FF Sari has legs that are splayed.  Sari does have an 'italic' according to the FontFont catalog, and Barmeno does not, so that is the other main difference I am aware of.</p>
