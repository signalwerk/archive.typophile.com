    html: <p>Thanks to Mike for pointing out an actual difference between Barmeno and Sari. I had looked for differences (apparently not carefully enough) and didn't find any, hence my question. I also figured there was a back story given that Reichel published an (almost) identical font with a different foundry. And indeed there is a back story!</p>
