    html: <p>Yves, it's so rare to catch you on even a little mistake, that I had to look twice to convince myself. <br> <br>After reading (again) the Berthold/Hunt story on Luc's pages, I really didn't want to plug their font, but we try to be accurate here, right? BTW, as you could see from my links, contrary to Luc's article, there is at least one other site (Phil's) that sells their fonts, although the pricing is identical, right down to the Packages which cannot be broken for individual font sales. <br> <br>Objectivity first, then Subjectivity, even though it's a hard rule to follow.</p>
