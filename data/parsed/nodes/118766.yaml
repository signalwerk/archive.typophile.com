    <p>Hi there,</p>
    <p>This is my first font ID request, really hoping some of you out there are able to help.</p>
    <p>I've found a classic-looking serif font, on the cover of an issue of GQ magazine. It's characterised by very circular serifs and shapely punctuation.</p>
    <p>Profuse apologies to more experienced typophiles, I'm relatively new to describing fonts characteristics. </p>
    <p>Any help given will be hugely appreciated. Many thanks!</p>
