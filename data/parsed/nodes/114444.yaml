      <p>Yes. Those exists. Adobe Utopia, Bitstream Charter and Bitstream Courier 10 pitch. Google those with "type 1 xorg"  added and you'll see.</p>
      <p>Edit: There are many more if you do not need the right to modify the font file and distribute the modified font file.</p>
