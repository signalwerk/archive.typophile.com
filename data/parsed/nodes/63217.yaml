  html: <p>One Typophile, on seeing a preview of Greater Albion's Cherritt described it as a “Victorian Courier” equivalent.  We rather like that idea, courier being an eminently practical family of faces, but Cherritt can do so much more.  We've just posted a .pdf sampler with specimens of all twenty faces in the soon to be released Cherritt family on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
  html_clean: <p>One Typophile, on seeing a preview of Greater Albion's Cherritt described it as a “Victorian Courier” equivalent.  We rather like that idea, courier being an eminently practical family of faces, but Cherritt can do so much more.  We've just posted a .pdf sampler with specimens of all twenty faces in the soon to be released Cherritt family on our <a class="freelinking external link-external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
