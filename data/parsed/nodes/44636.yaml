  html: |-
    <p>I am wondering about best practices of creating logotypes using a selected font. Is it acceptable to use a font in your logotype without any modification/customization to the typeface? I’m sure this is not a best practice but do most designers typically follow this rule and to what degree is this looked upon with disapproval? </p>
    <p>Thanks!</p>
