    <p>Here’s a great, old video clip I came across showing the process from drawing a character to creating a printed page from the resulting metal type.</p>
    <p>It show <a href="/wiki/Frederic%252BW.%252BGoudy" class="wiki">Goudy</a>’s studio. The clip looks a lot older than I think it may be:</p>
    <p><a href="http://www.typeculture.com/academic_resource/movies/movs/index.php?ID=Goudy_S3&amp;TYPE=mov&amp;W=320&amp;H=240" title="http://www.typeculture.com/academic_resource/movies/movs/index.php?ID=Goudy_S3&amp;TYPE=mov&amp;W=320&amp;H=240">http://www.typeculture.com/academic_resource/movies/movs/index.php?ID=Go...</a></p>
    <p>enjoy!</p>
