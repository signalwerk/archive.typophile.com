      <p>Apankrat, that was very cool! But your idea completely haha so I can't really touch it.</p>
      <p>Anyways, I stepped away from this for a long while until it was completely out of mind. On looking at it again, what became evident to me is that every time I saw this mark (which you hadn't seen yet but had become bolder and squater)--I could basically see the EB in the small B. The large E was almost completely useless at that point, more of a bracket than an E, which some of you, rightly I think, were getting at.</p>
      <p>So this next one isn't cleaned up but it's what felt right to me tonight.</p><div class="imageWrap"><img src="http://typophile.com/files/MyGridMark3_3745.jpg"></div><p></p>
      <p>I think it's a step in the right direction.</p>
      <p>The relationships playing out in my head for refinement are:<br>
      1)Weight of negative spaces. I think thinner verticals and thicker horizontals keep the shape of the B while allowing for a separate (that's important) demarcation of the E.<br>
      2) Width of the whole piece--not too wide for a B but long enough arms on the E.</p>
      <p>Suggestions?</p>
