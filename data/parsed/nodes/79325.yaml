      <p>Yeah, all I did was take your jpg and put a black box over the gaps, and a white trangle for the cut. Everything else is as you drew it.</p>
      <p>The one thing I did notice while I was playing around with it was the line weight of the middle arm of the 'E' and the crossbar and top and bottom bars of the 'B' — it feels too light. When I thickened them though, it felt more like a 'B' in a frame. So, things to think about . . .</p>
      <p>Another thing you might try is raising the waist of both of them since they really should have smaller top sections than bottom — they wouldn't be designed with the crossbar/arm in the exact vertical center of the character.</p>
