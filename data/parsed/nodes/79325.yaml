      <p>@evanbrog:<br>
      I like the direction the squared version is going, but I think the challenge is about the empty spaces. The variable thickness (of all the white spaces) is distracting; not just the white channels between the two letters, but the counters of the B, too. I want them all to match. </p>
      <p>The multiple stroke weights are causing the letterforms to disappear into an abstract maze. The center crossbar (the "tie") of the E is too thin to feel like it's part of an E - the E becomes a C. I know you chose to match the stroke weight of the smaller B, but that choice hurts the E too much. The B doesn't look nestled comfortably into an E, it looks like a mean little robot "B" (much like R2D2) sent out a parasitic tendril to siphon off energy from a giant C. The C is about to eat the B - or crush it <em>(it's alive! eek!)</em></p>
      <p>To me, actually, your E (C) reads as a vise grip. I can't shake it. </p>
