    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Alphabet</strong></p>
    <p>A set of symbols (specifically  <a href="/node/16846" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">letters</a>) that are used to signify language in written form. Ideally, each letter or <a href="/node/add/wiki?edit%5Btitle%5D=grapheme" title="Create node &quot;grapheme&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">grapheme</a> corresponds to a specific sound or <a href="/node/add/wiki?edit%5Btitle%5D=phoneme" title="Create node &quot;phoneme&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">phoneme</a>; this is not always the case. Each language typically has its own alphabet that is tailored to its specific needs in terms of representation of the language in written&nbsp;form.</p>
    <p>See also <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alphabets</a>.</p>
