    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Alphabet</strong></p>
    <p>A set of symbols (specifically  <a href="/wiki/letter" class="freelinking" rel="nofollow">letters</a>) that are used to signify language in written form. Ideally, each letter or <a href="/wiki/grapheme" class="freelinking" rel="nofollow">grapheme</a> corresponds to a specific sound or <a href="/wiki/phoneme" class="freelinking" rel="nofollow">phoneme</a>; this is not always the case. Each language typically has its own alphabet that is tailored to its specific needs in terms of representation of the language in written form.</p>
    <p>See also <a href="/wiki/Alphabets" class="freelinking" rel="nofollow">Alphabets</a>.</p>
