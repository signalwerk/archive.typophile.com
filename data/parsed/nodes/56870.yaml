      <p>I agree that -in terms of reading, but not learning to read- it's best to view accented letters as individual letters, but an element* not being centered does not kill that. Also, facilitating good spacing (both horizontal and vertical) is not a design factor to be ignored, since poor spacing ruins readability much faster than mildly confusable glyph derivation.</p>
      <p>* BTW using the term "tone mark" actually reinforces what you seem to want to avoid.</p>
      <p>hhp</p>
