    html: <p>My understanding is that the SIL fonts have the alternates for languages other than Vietnamese. (Did Hoang talk about the SIL stuff, I couldn't find that bit?) For Vietnamese, the circumflex-acute and circumflex-grave should not have the second tier accents centred. The grave can go on the left or the right, depending on the design/designer/client. After long discussions, we chose to put it on the right, to be more consistent with other stacked marks and to reflect the writing direction (and reading direction, perhaps). It also requires less kerning exceptions that way.</p>
    html_clean: <p>My understanding is that the SIL fonts have the alternates for languages other than Vietnamese. (Did Hoang talk about the SIL stuff, I couldn't find that bit?) For Vietnamese, the circumflex-acute and circumflex-grave should not have the second tier accents centred. The grave can go on the left or the right, depending on the design/designer/client. After long discussions, we chose to put it on the right, to be more consistent with other stacked marks and to reflect the writing direction (and reading direction, perhaps). It also requires less kerning exceptions that way.</p>
