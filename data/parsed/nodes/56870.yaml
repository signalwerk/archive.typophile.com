      <p>The logic of Huang's remark was that the so-called "accented" characters were really not that, but different characters. Like in Latin, an "e" is not a "c" with a midline diacritic drawn through it.</p>
      <p>In that case, and as Huang showed them, the tone marks would ride ABOVE the character, not beside what only looks like an accent. The left-right positioning is a different matter...</p>
