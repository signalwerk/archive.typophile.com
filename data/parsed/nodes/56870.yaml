      <blockquote><p>The only important thing for this thread is the shape of that thing and where to put it.</p></blockquote>
      <p>Exactly the question. As rendered by Adobe &amp; SIL, sometimes those marks are essentially *beside* the character (given that the "other accent" isn't an accent, but part of the character). Now if it's an x-height character, then the mark is over. I'm not asking about the left-center-right position, but the height.</p>
      <p>Edit: And by the way, in order to fit it thus, the tone mark is rendered differently than when over those other characters. Shouldn't the rendering be consistent?</p>
