      <p>Michael, I have a problem with Wikipedia. Entries on the two subjects I know a great deal about have numerous errors, some very serious (they're both wrong and misleading).</p>
      <p>Here's the problem: How can I then trust Wikipedia when it is something I know little about, esp. when it might be in conflict with another expert source?</p>
      <p>* * *</p>
      <p>So -- Is the position of the tone marks due to mechanical issues of typewriter or typesetting? How does a native write the script longhand? Wouldn't that be the best answer?</p>
      <p>BTW, scansion marks in Latin have a similar, though not identical problem. They belong to a syllable, not a character (mirrors the older Vietnamese preference, no?) Further, I've argued scansion marks should always be at a constant height, so if a longum falls mainly over an l in one place, it should be at the same height when over, say, an e. They tell you how to parse something; they shouldn't bounce. Now, set some Greek poetry (polytonic Greek) with scansion marks...</p>
      <p>So back to the question: if we remove all the things acknowledged as compromises (allowing they are sometimes necessary), does anyone know what is preferred?</p>
    html_clean: |-
