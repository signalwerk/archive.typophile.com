      <blockquote><p>
      Michael, I have a problem with Wikipedia. Entries on the two subjects I know a great deal about have numerous errors, some very serious (they're both wrong and misleading).
      </p></blockquote>
      <p>Those on advanced mathematics are generally correct and sometimes even quite well written. I have seen horrors on typography, but I would not judge wikipedia on that basis. Of course, better references are welcome.</p>
      <p>This being said, in hdang's post <a href="http://typophile.com/node/62439#comment-389340" rel="nofollow">16 jan 2010</a>, it is written</p>
      <blockquote><p>
      On Vietnamese diacritic design, i think that the type designer should understand how vietnamese words is constructed:<br>
      fisrt at all, there are 29 "basic" characters in alphabets list:<br>
      a	ă	â	b	c	d	đ	e	ê	g	h	i	k	l	m	n	o	ô	ơ	p	q	r	s	t	u	ư	v	x	y
      </p></blockquote>
      <p>From those letters, it should not be hard to find which ones are vowels and which ones are consonants. That should confirm the list of vowels.</p>
      <p>As for the treatment of “<strong>tone mark (accent)</strong>” (in bold in his post), he writes</p>
      <blockquote><p>
      There is only one accent. Someone considers Vietnamese as double accent language, but it's view of non-vietnamese speaking people.
      </p></blockquote>
      <p>I see no reason to comment. The only important thing for this thread is the shape of that thing and where to put it.</p>
