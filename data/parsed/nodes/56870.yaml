    html: |-
      <p>According the Wiki <a href="http://en.wikipedia.org/wiki/Vietnamese_alphabet" rel="nofollow">Vietnamese Alphabet</a>, there are 12 vowels in Vietnamese, namely</p>
      <p>a, ă, â, e, ê, i, o, ô, ơ, u, ư, y</p>
      <p>According to the same wiki, there are five tone accents that can be put on any of those vowels: grave accent, hook above, tilde, acute accent, dot below. It is also written, as Hoang Dang said, that the tone falls on the word. It is  also said that there are two styles of tone positioning and, more importantly</p>
      <blockquote><p>
       In both styles, when one vowel already has a quality diacritic on it, the tone mark must be applied to it as well, regardless of where it appears in the syllable (thus thuế is acceptable while thúê is not).
       </p></blockquote>
      <p>To my understanding, that rule goes against putting the tone where a linguist would put it and reasoning from general linguistic principles may not lead to what is expected by native readers.</p>
    html_clean: |-
