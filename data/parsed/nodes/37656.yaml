      <p>This is good discussion fodder.<br>
      I think it is important to have both, and that is not to say that they are mutually exclusive.  Systems can be expanded upon, new systems can be created and they can be purposely ignored/abandoned.</p>
      <p>Foundations and general laws of what works or what has worked are important, as design is about connecting and communicating to a wider audience, but one shouldn't be suffocated by rules, and usually new ideas are introduced from those who aren't classically versed / haven't had their minds polluted with what is 'right' or 'wrong'.  Knowing the rules has value so long as personal intuition isn't lost.</p>
      <p>A lot of design application comes down to what needs to be said and who it's being said to.</p>
