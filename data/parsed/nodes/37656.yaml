      <p>I'm surprised by the resistance I'm reading in this thread. I don't know if it's a good thing or a bad thing. I'd expect more people to jump in.</p>
      <p>First, I agree that the "project brief" is badly written. I don't know how it was decided that there were exactly two opposing camps on the subject (and it doesn't even clearly state what the two camps believe, although I can guess).</p>
      <p>But anyway, I do think this is a subject that can be, and has been, discussed. Personally, I don't think the discussion has much real-world value. One can worry about the correct amount of "style" to apply to one's design, but in the real world, it seems to me, there is a client, and audience, money, deadlines, ego, and all of that, which completely overrule any idea of what might be purely correct or proper. Design in the real world is part of a very complicated system, which in turn determines what is right and wrong.</p>
      <p>I mean, if one is a designer with a distinctive style, one will find that style is either a success or failure in the real world. The client/customer will like it or not. They will be willing to pay for it or not. It will be seen -- or not. It might successfully communicate (something), but if nobody ever sees it, then who cares?</p>
      <p>A designer can attempt to strip all distinctive style from their design, but it still has to get through that client firewall. It might communicate, but it might be dull.</p>
      <p>Now, as far as the purely academic question goes -- does a preponderance of style help or hinder effective communication? -- it depends, doesn't it? To some extent, the brain will respond to something it finds appealing, whether or not it is pure information or some stylistic artifice. Again, it's complicated. The real world decides.</p>
