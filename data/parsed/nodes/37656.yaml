      <p>I think the two links I posted are a good read to get a better idea of the debate. I'm new to the issue myself and thats why I initially posted, to see others opinions so I'm not completely knowledgeable on the subject myself yet. In summary though, the issue is about designers using popular style in their designs or aesthetic appeal over the fundamental teachings of communication design. By fundamental teachings I mean proper font choice and usage, grid systems and hierarchies. A good example would be Josef Muller-Brockmann’s seminal book “Grid Systems In Graphic Design,”. It speaks about the mathematical aspects of good communication design - how grid systems are essential in visual communication. Are designers forgetting about these aspects of design? - Its all well and good to create a piece that looks great, but if the message is lost then surely it makes it bad design.<br>
      On the other side of the coin you can argue that the designers style and aesthetic appeal is more important. If the design uses devices that relate to popular culture is that more important? An good example of this would be to look at raygun magazine. Its a magazine from the 80's 90's and had a different look for every spread - an interview was even printed in dingbats in one issue - obviously totally unreadable but in keeping with the style of the magazine.<br>
      I don't know if this helps, maybe I'm not communicating the issue correctly. If anyone has any views on this though Id love to hear them.</p>
