      <p>Hopefully this doesn't derail things, but here's a thought:</p>
      <p>Should Graphic Design be taught in the Art College, or the Business College.</p>
      <p>I, like most (all?) graphic designers went to art school. But isn't Graphic Design really more about business communication? </p>
      <p>Perhaps that's the crux of the perceived debate...is graphic design 'art' or 'design'? It is, of course, both, but that's hardly a debate.</p>
      <p>I've always liked the term 'commercial artist'. Perhaps it's nostalgia, but it seems to better define what most of us do day-in/day-out to make a living.</p>
