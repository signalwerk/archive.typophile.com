    <p>Hi, I'm a university student and have been recently been given this typographic project to do titled 'Difference'. I felt the subject was ideal for a forum discussion and figured posting it would generate good views on the subject from others.</p>
    <p>Project Brief:<br>
    Produce a logo, 8 page exhibition brouchure and three panels for an exhibition in the Campus foyer which looks at the conflicting views of designers reguarding the use of personal style in the generation of communication design work. The debte was very much in evidence in the early 1980's with the increasing use of technology in creative production but it has been an underlying issue in the way designers have always worked. Your approach should be objective in illustrating the philosophies of both camps but stimulating enough to interest those who may not be aware of the difference in approach. As a major element of the exhibition is concerned with the role of type in design the final pieces should focus upon the application of type as an expressive medium with imagery forming an effective complement. </p>
    <p>I'm not so much looking for ideas for my outcome but was more interested in others views on the debate topic. If your not too aware of the debate here's a link to an article about it, though its from more of a web design point of view but the idea is still there <a href="http://www.adobe.com/designcenter/dialogbox/stylevsdesign" title="www.adobe.com/designcenter/dialogbox/stylevsdesign">www.adobe.com/designcenter/dialogbox/stylevsdesign</a> . I was hoping by posting on this forum  I would be able to get perspectives from more of a typography stand point (I figured this forum would be a good source of views of typographers with much better experience/knowledge than myself). I look forward to any replies. Thanks</p>
