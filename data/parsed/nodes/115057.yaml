      <p>Yes, i want to extend the web-font with arrows for not using ugly text-images. </p>
      <p>The hint with the Expert-Mode was it. In this section i could put in the arrow-sign in a form for including Single Characters. Putting the Hex-Code in the Unicode Ranges-form doesn't work, but a simple copy of the symbol has done it. It makes of course sense that webfonts do not included all characters for being small.</p>
      <p>Tomorrow i will print the font through Indesign for being sure that everything ist working correct.<br>
      I am very grateful, thank you so much again :-)</p>
