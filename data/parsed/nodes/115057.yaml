      <p>Hmm. When you talk about "FontSquirrel," I suspect your making woff format fonts for the web?</p>
      <p>Special issues there, and I know almost nothing about those formats. For checking the  font itself, try using Microsoft Word (post 2010), or any OT-savvy text editor,  and a laser printer -- actually, I'd use  InDesign, but that's expecting a bit much, I know. </p>
      <p>If everything works as it  should in print, press on to the web formats. I did find one tidbit about FontSquirrel &amp; it's generator:</p>
      <blockquote><p>When using the FontSquirrel Webfont Generator, you need to check the radio button “EXPERT” and then select the languages to be supported or the code range. The default is that only characters used in “Western languages” are included.</p></blockquote>
      <p>For all I know, the Font Squirrel generator is not picking up that information from the font itself. Nor do I know what "code page" arrowright lived on, back in the dark ages when there were "code pages" for hard-wired encodings. But we're well outside the area where I know <cite>anything,</cite> so...</p>
