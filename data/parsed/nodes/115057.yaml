      <p>Dear Charles,<br>
      thank you for your detailed answer!<br>
      It helped me very much, since i have not much to do with fonts.</p>
      <p>Especially your last note has encouraged me to check the font (TrueType / OpenType TT) in the FontExplorer X Pro. There I could see that the name of the Arrow did not work, it was just empty (only the Glyph-ID has a number, but also a different one). Weird, because the Metric preview window displays everything correctly in FontLab. Also "Latin 1" + "MacRoman Macintosh" are adjusted properly in the Font Info. </p>
      <p>Then I generated an OpenType font (OpenType PS) and the FontExplorer shows the names properly. After that i use Font Squirrel to generate the web font, and the arrow does not appear in the glyph overview of the demo HTML - despite the OpenType PS. Argh. I came up with the idea that this could be an issue of Font Squirrel and give another Generator a try (web-font-generator.com). Now it seems to work!</p>
      <p>I really admire the patience and the many skills font designers need to have.<br>
      I was very confused by the yellow marks in FL ... Thanks again for your time and help! </p>
      <p>Barbara</p>
