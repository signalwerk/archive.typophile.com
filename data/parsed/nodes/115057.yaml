    <p>Hello Forum,</p>
    <p>I am stuck at one point in FontLab and hope someone can help me.<br>
    I would like to integrate arrows in a TrueType font using FontLab: arrow right and arrow left.<br>
    The font should be used as a webfont later and i don´t want to build in images for arrows anymore.</p>
    <p>To achieve this I proceeded as follows in FontLab:<br>
    - Create a Glyph in an empty grey box wich is marked yellow in the font-window<br>
    	I understand that glyphs, that are not yellow do not belong to the currently selected encoding, codepage or Unicode range<br>
    - then i rename the glypgh-name to "arrowright" (using the context-Menue) and generate the unicode index for it (2192) using the little diamond<br>
    - After that action the Glyph is marked as grey (unencoded?) and it goes to the end-section in the font-window.<br>
    	The arrow does not appear in the exported font. I tried TrueType and OpenType.<br>
    	The font consist of 234 glyphs.</p>
    <p>Do you have any ideas, what i am doing wrong?<br>
    Does the unicode codepage not support arrows?<br>
    I would be grateful for any hint.</p>
    <p>Barbara</p>
