      <p>Since none of the more knowledgeable have replied, I'll give a try. What you have done should work, always assuming I've understood you aright.</p>
      <p>First of all, you are creating (generating) an OpenType font, right?  You're using  </p>
      <p>TrueType/OpenType TT</p>
      <p>in the "save as type" window.</p>
      <p>Beyond that:</p>
      <p><cite>I understand that glyphs, that are not yellow do not belong to the currently selected encoding, codepage or Unicode range</cite> Yes, but this is only internal to FL's display. It is a convenience in using FL, not a requirement; the "yellow" has no other meaning.</p>
      <p>The glyph should ultimately have a name of "arrowright" and a Unicode number of 2192, though actually, a <strong>name</strong> of "uni2192" is also correct. Make sure it shows in the metrics window, just as a check that everything's hooked up.</p>
      <p>Then, after you have saved the .vfb file and complied the features (if there are any), go to the preview panel, and type in</p>
      <p>\2192</p>
      <p>It should show. Check the name assignment by typing in</p>
      <p>/arrowright (or /uni2192, if you've *named* it that)</p>
      <p>Your character should show both times. It should also show in the metric window BTW, with the same strings.</p>
      <p>BTW-2 Unicode is not a "codepage" If you're filling in the File &gt; Font Info &gt; Encoding and Unicode section, I believe the conventional wisdom is to select "Latin 1," and use "Macintosh MacRoman" for the Microsoft Character set. Though I know that "Western (Latin1)" also works...</p>
      <p>* * *</p>
      <p>If this is what you have done, then I'd ask what applications programs have you used to test the font where the character failed to appear?</p>
