      <p>Ħ : I usually design this so that the lower bar is slightly lower than the crossbar of the H, to create more room above it for the second bar. And I usually extend the upper bar through the side stems, because that is the form as I saw it in earlier printed Maltese books. When I was in Malta, I saw both forms in use: with the bar extended and not as in the examples you show. I also saw versions with the two bars optically centered as you suggest, but these were in sans serif signage and display type, not text.<br>
      ___</p>
      <p>ĸ : See <a href="http://typophile.com/node/18546" title="http://typophile.com/node/18546">http://typophile.com/node/18546</a></p>
      <p>I believe the glyph shown in the Unicode charts is misleading. Unless your Latin lowercase has characteristics that support such a Cyrillic-like form, it will look like an alien visitor.<br>
      ___</p>
      <p>Ŧ : I've always seen this with a horizontal bar, which corresponds with that of the letter Đ/đ, also used in Northern Saami.<br>
      ___</p>
      <p>Ŋ : Your revised form is heading in the right direction. The hook should descend as far as that of the J, or the tail of the Q, i.e. not usually as deep as the lowercase descenders.</p>
      <p>Note that this uppercase form is normal for European fonts. For African languages, the n-like shape is preferred.<br>
      ___</p>
      <p>Vietname horn : I've seen (and designed) both arrangements: with the horn coming out of the side of the letter and with it coming off the top right. Your solutions all look reasonable to me; just watch out that the horn has enough room to breathe, both between it and the letter to which it is attached and with regard to a following letter.<br>
      ___</p>
      <p>Vietnamese hook : Always tricky. Your shape looks okay, and is appropriate to the style. But you have to test in print and see how it looks alongside the other marks. It is easy to make this either too dark or too light.</p>
