    html: |-
      <p>I agree with your own remarks.</p>
      <p>Personally, I think that the barred characters feel less like an afterthought when the additional bar on the upper/lower-case letters matches the (original) horizontal bar on H/t. Many fonts do not follow this, but it is difficult to know whether the choice of a different stroke width was a conscious one.</p>
      <p>K with hook is an African letter which has not been mentioned earlier in this thread and of which I know nothing. Your kra (cf. the Palimpsest thread) appears to have the correct shape.</p>
      <p>The capital Eng is perhaps a bit heavy in the bottom-right corner of the N (i.e., around the bottom of the diagonal) and a bit light at the bottom, but there is no other obvious solution given the shape of the J/j. Sorry for this not particularly constructive remark.</p>
      <p>It has been mentioned in an earlier thread that Vietnamese grave traditionally goes to the left of the circumflex.</p>
      <p>Some of the Vietnamese diacritics extend quite far to the right (e.g., lower-case a with circumflex and acute) — do they not interfere with a following ascender (e.g., l or b)?  You  might want to shorten the acute slightly (cut it at an angle at the bottom to make it fit atop the circumflex).</p>
