    html: |-
      <p>Thanks for your replies. Below is a summary of my current understanding with further comments and questions.</p>
      <p>***</p>
      <p>As far as the length of the upper bar is concerned, Ħ can take either of the following forms, but the second is the more traditional one in Maltese typography.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/H-bar-3_5443.png"></div><p></p>
      <p>Vertically symmetric placement of the bars is somewhat of a novelty and probably best avoided, but the lower bar may be at a slightly lower position than that of the single bar in a regular H. This leaves the question as to the preferred distance between the bars; fonts on my computer have distances varying between approximately 1/8 and 3/8 of the letter's full height:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/H-bar-4_4597.png"></div><p></p>
      <p>(Many of these are clearly not well designed.)</p>
      <p>***</p>
      <p>John Hudson did not mention ħ, which probably means that the form with horizontal bar is the only acceptable one on Malta. The following design matches that of đ:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/h-bar-5_3641.png"></div><p></p>
      <p>***</p>
      <p>Despite the ĸ glyph in the Unicode charts, kra is essentially a k without ascender (1st picture below), but it should have the same top-left serif as a u (2nd picture); a shorter top-right serif akin to a (small-)capital K might be better (3rd picture):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kra-2_4387.png"></div><p></p>
      <p>(The u serif is so flat in this font that the only obvious difference between kra and a small-capital k is that the latter has a top-left serif extending to the right.)</p>
      <p>Samuel Kleinschmidt's 1851 grammar does show a kra with ball terminal, but all the Greenlandic letters are printed in italics, so this applies to k as well:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kra-3_5145.png"></div><p></p>
      <p>***</p>
      <p>Thanks for pointing out the parallelism between Ŧ/ŧ and Đ/đ. A ŧ with diagonal bar would have matched an eth-like đ, but 19th-century Lappish grammars already used the modern/current forms with horizontal bars. It would be interesting to see an extract from the late 19th-century Bible.</p>
      <p>The bar on ŧ should perhaps be a bit lower:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/T-bar_3623.png"></div><p></p>
      <p>***</p>
      <p>Ŋ: Perhaps the slightly smaller ball from a lowercase j is more appropriate?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Eng-4_5580.png"></div><p></p>
      <p>As for the depth, Q has full descender depth in this font, whereas J is ‘half-deep’, which probably gives some latitude.</p>
      <p>***</p>
      <p>Many of the Vietnamese TeX samples from the earlier thread show the U/u horn at an intermediate vertical position:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/U-horn_6720.png"></div><p></p>
      <p>This works well for the lowercase u, but perhaps less well for the uppercase U.</p>
      <p>My original question was whether it would be acceptable to put the horn lower on O than on U lest it end up too far to the left on the O (without making the horn exceedingly wide).</p>
      <p>***</p>
      <p>Your comments and the samples in the previous thread confirm the basic shape of the hook. I may return with further questions related to that one once I try to put together complete Vietnamese accented letters.</p>
