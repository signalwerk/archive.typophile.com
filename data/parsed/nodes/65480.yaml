      <p>Well, Adobe Caslon is of course an Adobe version of Caslon, and inherently digital.</p>
      <p>If you want to go truly old-school, then you want hand-set metal type, and you should set it yourself. If you tell folks where you are based, perhaps somebody can suggest a school or something where you could get access to metal type.</p>
      <p>If (as your profile suggests) you are based in Rochester, NY, then of course you could see if RIT has any classes or workshops that would give you access to one of the old-fashioned letterpresses they have. There is a lovely Washington 1830 cast-iron handpress in the Cary Graphic Arts Collection....</p>
      <p>Cheers,</p>
      <p>T</p>
