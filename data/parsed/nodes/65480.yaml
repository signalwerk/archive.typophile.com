    html: "<p>FYI: Dry transfer letters were never used for setting body text. At least by anyone sane. I used dry transfers mostly during the pre-digital, photoype period, after metal was obsolete. You can still set metal type (or get someone else to), but I don't imagine anyone has an old Linofilm or Compugraphic Editwriter in their basement setting cold type old-school. IBM Composer, maybe. I don't think anything is as dead as typesetting technology between the metal and digital eras.</p>"
