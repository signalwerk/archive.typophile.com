    <p>I am working on an Editorial project about analog creative practices, and would like to design the spreads as independent from the computer as I can get. As a student educated solely on the computer I am excited to explore these practices.</p>
    <p>So I need to create a body of text in 9pt Adobe Caslon regular. I have looked into Chartpak and Letraset and have yet to find my exact needs.</p>
    <p>Can anyone suggest a resource or a practice to achieve my desired result? I am also considering phototypesetting, but don't know much about it.</p>
    <p>Any information would be helpful!</p>
    <p>Thank you!</p>
