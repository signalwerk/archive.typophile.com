      <p><cite> &gt; I don’t think anything is as dead as typesetting technology between the metal and digital eras.</cite></p>
      <p>How true!</p>
      <p>Natalie could replicate the experience by faxing her text to someone, with her specs written out on it, and they could set it in Adobe Caslon on their Mac, output it to some really hard and smooth paper (as close to repro as possible), and mail it back to her for pasting up.</p>
      <p>And then, she can call them up at 11:00 at night and dictate corrections over the phone ;-)</p>
