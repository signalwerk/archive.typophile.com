    <p>Hi Everybody,</p>
    <p>I'm on the hunt for a great ball terminal serif typeface. Does anyone have any suggestions? I've attached a pic of some hand lettering I found in a '70s copy of playboy (massive apologies for the blurry picture!), its great but I've never seen a typeface like it anywhere. I'm about to start a series of greetings cards and would love to use a typeface similar to this.</p>
    <p>If anyone knows of any faces like it I would love to hear their suggestions.</p>
    <p>Thanks!</p>
    <p>Jono</p>
