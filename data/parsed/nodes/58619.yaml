    <p>US congressman Mike Honda (D), whose constituents are largely Silicon Valley folks, is having his website designed through a crowdsourcing “contest” site — but the BEST part? He’s having his constituents vote to decide the winning entry...</p>
    <p><a href="http://www.crowdspring.com/projects/website_design/small_website_uncoded/congressman_seeks_innovative_redesign_of_website/details" title="http://www.crowdspring.com/projects/website_design/small_website_uncoded/congressman_seeks_innovative_redesign_of_website/details">http://www.crowdspring.com/projects/website_design/small_website_uncoded...</a></p>
    <p>Design demagoguery? </p>
    <p>A recipe for ensuring a craptastic mediocrity of a site? </p>
    <p>Or a clever way of creating authentic buy-in, social engagement, constituency-building, &amp; innovating the “Mike Honda” brand? Can’t wait to see what bedazzles us from this...</p>
