  html: '<p>ninth letter literary journal + ninthletter.com ::   <br>exceptional design, compelling cultural content <br> <br>Ninth Letter is pleased to announce the launch of its newly re-designed web site. Ninthletter.com combines exceptional design with compelling cultural content. Our goal is to explore and extend the intersection of literature and visual culture. <br> <br>Ninth Letter is intended for an audience that desires both beauty and logic, entertainment and thought, feeling and analysis. Our intent is to incite multiple activities, but to also provide some order and organization to the rapidly expanding dataspace. <br> <br>With literary tradition as our jumping off point, ninthletter.com seeks to explore how art interfaces with the electronic terrain. Our goal is to find and feature examples of the best electronic art currently being produced by web artist/authors, focusing explicitly on work that is not supported by, and cannot be backward engineered into older cultural forms. We introduce new artists, and seek to engage them and our audience in lively conversations about contemporary art, culture, and technology. <br> <br>Ninthletter.com proudly announces publication of �They Come in a Steady Stream Now�, a new work of electronic short fiction by Richard Powers. Powers is the author of to-date eight novels, and the recipient of a MacArthur Fellowship. He is one of the most important fiction writers currently working. His writing is heady and cerebral, but also lyrical and tender. <br> <br>Ninth Letter leads a dual life as both a literary magazine and a literary/visual culture website. �They Come in a Steady Stream Now� is being published concurrent with release of the Fall/Winter 2004 issue of Ninth Letter magazine, which features writing by Ann Beattie and Ron Carlson, plus network art from flyingpuppet.com.  <br> <br>For the best in design and network culture, to subscribe to Ninth Letter magazine, or to sign up for our bi-monthly website update, visit ninthletter.com <br> <br> <br>For further information contact: <br> <br>Art Directors <br>Jennifer Gunji, <a href="mailto:gunji@uiuc.edu">gunji@uiuc.edu</a> <br>Nan Goggin, <a href="mailto:goggin@uiuc.edu">goggin@uiuc.edu</a> <br> <br>Content Editor <br>Joseph Squier, <a href="mailto:squier@uiuc.edu">squier@uiuc.edu</a> <br> <br><a href="http://www.ninthletter.com" target="_blank">www.ninthletter.com</a> <br>217.333.2977</p>'
