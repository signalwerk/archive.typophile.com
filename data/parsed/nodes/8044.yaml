    html: <p>j <br> <br>This is exciting... I had not heard about that project yet, but it looks promising. Champaign/Urbana and the University need more people advocating art and culture in this area of the midwest. There is a lot of opportunity here to help nurture and present exciting new art and artists where they could otherwise easily get looked over. <br> <br>Congratulations and good luck!  <br> <br>r.k</p>
