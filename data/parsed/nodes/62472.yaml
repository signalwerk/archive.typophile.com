    <p>:)</p>
    <p>I am confused by what I have perhaps misunderstood.</p>
    <p>General advice suggests that I should select my font(s) before writing to benefit legibility. Similarly, the advice is that I should select my layout before writing. However, the geometric picture does not become visible until after I have written!</p>
    <p>In which case, to achieve any given page composition, the relative darkness and grid be designed first, then the text written, and then the font(s) selected to achieve the pre-determined darkness.</p>
    <p>Wouldn't that throw legibility out the window? Could you please tell me, do you follow a methodology or work flow that mitigates my muddled contradictions?</p>
