      <p>If you are a writer, write. In whatever manner or method allows you to write most effectively and efficiently. Some writers still use a pencil.</p>
      <p>When you are finished writing, and revising, give the work to someone expert in choose fonts and formats and making things easy to read --- a typographer. He/she will do all the rest of the stuff. If you really want to do something great, add a good editor in between. This idea that one person should be able to do everything is one of the key reasons why the world is rapidly sinking into illiteracy. (Well, I needed _some_ hyperbole in the posting.)</p>
