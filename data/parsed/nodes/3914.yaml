    html: <p> Thanks for asking around, the problem that happend came from a solid pms colour with no screen. The colour was flooded through the job, however there's a slight difference in ink consistency . I know it sounds like a big execuse on their side, but the printer is fairly reputable and I just wanted to hear if anyone else has had a smiliar situation - guess not</p>
