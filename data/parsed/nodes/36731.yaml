      <p>What typeface to use depends a lot on what kind of black metal we are talking about. If it is the traditional, early nineties kind, then <a href="http://www.myfonts.com/fonts/linotype/wilhelm-klingspor-gotisch/wilhelm-klingspor-gotisch/" rel="nofollow">Wilhelm Klingspor Gotisch</a> could be appropriate. But black metal comes in a lot of other varieties as well(folky, gothic, punky, avant-garde), and each has an accordingly different visual style. Either way, Blaktur is definately not the right typeface, as it is way too cartoonish.</p>
      <p>(And by the way, Bergen may be a black metal capital, but a <em>death</em> metal capital it is definately not.)</p>
