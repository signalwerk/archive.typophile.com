      <p>About two years ago some obscure black metal band got a lot of press by hiring a designer to do an album cover without the usual genre cliches. </p>
      <p>Anyway, black metal albums tend to feature a big hideous custom logo that’s modified to look symmetrical, dripping with pus, blood, and or spiderwebs. It’s common for them to be all but completely unreadable. All other text should be either in a scary-looking blackletter or a roman with lots of sharp points.</p>
