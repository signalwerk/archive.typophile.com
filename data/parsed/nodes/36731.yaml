      <p>I'm not sure if this issue has been resolved, but I felt compelled to comment anyway.  First: there IS a black metal font, although it's not the greatest in the world... Just google "Ultimate Black Metal Font" and it'll come up.</p>
      <p>If it's a black metal logo you're looking to do, there's one person you should try to contact on the matter, and that's Christophe Szpajdel.  He has done logos for some of the biggest names in the genre (Emperor for example) and what's more, is he doesn't charge.</p>
      <p>If you're looking to do a Death Metal logo ala-Cannibal Corpse, the Gushing Meadows font should suit your needs just fine, other than that... Just look up Death Metal logos on google and see what else is there.</p>
      <p>Second.  There is a lot of bad information here, but this isn't a music forum, it's a typography forum, however, the definitions here on black metal and death metal are so inaccurate that I must say something about it.  For a clear idea on black metal, forget Scandinavia almost all together, at least at first.  Go back to the beginning, Venom, Sodom, Hellhammer, Sarcofago, Bathory (yes they're from scandinavia) and other 80's black metal bands.  Black metal is, in my opinion, the most diverse sub-genre of metal.  You cannot clearly define it as one thing or another, because it depends on the band and the region.  You have bands from Black Witchery (hateful aggressive satanic... my favorite band) all the way to Woods of Ypres (mellow, sorrowful, naturistic...sometimes) and everything in between.  There's symphonic black metal which tends to focus on sounding gothy, there're raw black metal bands who prefer to sound as primitive as they can.. You cannot, i repeat, cannot nail black metal down into one definition. </p>
      <p>And as far as death metal goes... While not as diverse as black metal, it is also very difficult to just pin to a specific definition, there are many types of death metal as well, including hybrids of death metal and black metal.</p>
    html_clean: |-
