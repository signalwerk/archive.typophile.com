      <p>(Yes, I am norwegian)</p>
      <p>The big death metal countries are sweden and USA. Traditional death metal has a visual style with blood, gore and colorful illustrations (Cannibal Corpse is a good example), whereas traditional black metal is more dominated by fog, nature, darkness and black and white photography. Black metal design should not look gory.</p>
