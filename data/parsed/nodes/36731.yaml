    html: |-
      <p>Death Metal tends to be fast, dumb, and focused on Satanism and lyrical depictions of extreme violence, usually in relation to zombies, Satanism, and anti-Christian genocide. Some of it is quite tongue in cheek, but there are also some nutters who talk it all seriously. Florida was the capital of death metal in the 1990s, these days death metal is very much on the wane and doesn’t have much of a locale. It’s sort of hard to keep an audience when one lionizes Albert Fish.</p>
      <p>Black metal tends to focus on Norse mythology, with some Satanism and violence chucked in for tongue-in-cheek fun. The music tends to be more melodic and experimental than death metal, and every once in a while a band even tricks a big label into footing the bill for a symphonic partnership album. Pretty much nobody takes this stuff seriously, but they won’t admit it. Like Robert Plant and Bruce Dickinson, black metal lyricists tend to be book nerds, so history and literature pop up a lot; Cradle of Filth self-produced what amounts to a rock opera about Eresebete Bathory. Northern Europe still produces most of these bands, and that’s where they do most of their touring.</p>
      <p>The bands in these genres that have made it really big tend to overlap the genres.</p>
