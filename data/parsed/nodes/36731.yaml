      <p>well just a short note on some of those logos... for sure the most are symmetric and well designed. but there was a great great mistake made in the third post. </p>
      <p><a href="http://www.burzum.org/eng/library/a_burzum_story13.shtml" title="http://www.burzum.org/eng/library/a_burzum_story13.shtml">http://www.burzum.org/eng/library/a_burzum_story13.shtml</a> -&gt; the link will provide you the true story about the Burzum Logo... other than the most Varg here explains why he never had a logo in the sense of a logo. the first logo is just a gothic font and the second of the latest release of belus album is a nice font too. but it has never been ment as a logo. With that knowledge BURZUM can't take as a reference for a BM -logo at all.<br>
      In my eyes it's still one of the best bands in the genre as Varg influenced a lot of bands... sadly others play same riffs or equal music instead of making something new out of it. Same with the logo question... behind most of them the idea is the same , they look different but still same. those logos were nice 1990-1993 but nowadays i think we need a change ... or at least something new... the wheel allready excists so why devoloping another?</p>
      <p>so between black an deathmetal there is also a big difference. while the BM Logos are most times filled up with turnaround crosses and pentagrams or other occult-icons DM logos goes another dirrection more brutal less occult... anyway at the end a good logo should be handdrawn and not by freefonts - or if you're realy true go the burzum way and don't even follow any trend!^^</p>
