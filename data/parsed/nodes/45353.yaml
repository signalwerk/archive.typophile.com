    html: |-
      <p>The larger the initial letter, the more important it is to “shape” the text block to that initial. I almost always have text following a cap A slide at an angle down the right stroke. This allows you to make a more coherent form out of the first word.</p>
      <p>Many typographers tuck the first line into an L, and sometimes subsequent lines, depending on the size of the L and the nature of the design.</p>
      <p>It depends on the shape of an O, but sometimes the first line needs to be drawn close to the cap to make the first word form up well. Also for Q and for R some times.</p>
      <p>It is not often seen that text following W or V follows the right stroke to the left. But with really large caps the case can be made, especially in heavily designed matter.</p>
      <p>With “straight” initial caps I often snug the first line to the cap and then insert an en space between cap and text in subsequent lines.</p>
      <p>Have fun.</p>
      <p>powers</p>
