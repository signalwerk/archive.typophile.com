  html: |-
    <p>I am setting a paragraph in Minion with an 8-line drop cap that happens to be an A. There is a lot of space between the right slant of the A and the left margin of the copy. Should I wrap the text so that the text margin follows the slant of the A? Same question for W. This is a relatively formal/traditional piece. Does anyone have an opinion?</p>
    <p>Thanks</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/45352" class="topic-previous" title="Go to previous forum topic">‹ Fighting typeface??</a> <a href="/node/45370" class="topic-next" title="Go to next forum topic">words for ligatures... ›</a></div>
