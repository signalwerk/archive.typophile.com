    html: '<p><i>So one could quite happily set a phone book with Meta, without any customisation (bar ‘g’) and it will perform as well, if not better than most phone book types?</i> <br><br>It was designed for phone books et al. Never really tried and tested, but i have a few illustrations from 1985, showing Helvetica (actually: Holsatia from Hell), electronically condensed, and an early version of Meta, uncondensed. Very unreﬁned, but we could set narrower columns, get more columns on the page and save around 8% content. And that was without any customisation. But the German Post Oﬃce decided to stick with Helvetica and its bastard sisters until 3 years ago, when they joined the Frutiger bandwaggon. <br> +++ jpeg +++ 55006 +++ phonebook  <br>before +++<img src="http://www.typophile.com/forums/messages/30/55009.jpg" alt="phonebook after"></p>'
