    html: '<p><i>like its narrowness, and its “g”</i> <br><br>Well, of course I have my own single-decker g for those occasions. And the narrowness is not a problem as long as you track properly. <br><br><span class="caps">BTW</span>: <span class="caps">FF</span> Unit is tracked very openly and appears not quite as narrow as Meta. Works well, too.  <br><br>Generally, of course, the wider the letters, the more open the counters, the more legible and the less danger of spots. But always at the expense of space. I once made Meta set at 103%. That helped, and it was still 10% more economical than&nbsp;Helvetica.</p>'
    html_clean: '<p><i>like its narrowness, and its “g”</i> <br><br>Well, of course I have my own single-decker g for those occasions. And the narrowness is not a problem as long as you track properly. <br><br><span class="caps">BTW</span>: <span class="caps">FF</span> Unit is tracked very openly and appears not quite as narrow as Meta. Works well, too.  <br><br>Generally, of course, the wider the letters, the more open the counters, the more legible and the less danger of spots. But always at the expense of space. I once made Meta set at 103%. That helped, and it was still 10% more economical than&nbsp;Helvetica.</p>'
