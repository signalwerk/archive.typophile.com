    html: <p><i>Meta can take a beating</i> <br><br>Regardless of what Hrant thinks, it can. If you avoid the Normal weight (too thin, mistake in ﬁrst digital version) and use the Book, set it +3 units in Quark (i.e. 15 in InDesign), it works really well at sizes around 8pt and below. It was, after all, designed for the German Post Oﬃce to be used on their forms. The original version in 1985 was made for typesetting on cathode tube machines which only had 1200 dpi resolution and would often output at less to save time.&nbsp;I</p>
