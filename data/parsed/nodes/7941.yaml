  html: <p>The competition is on! I would like you all to name the best types for lo-fi printing. Any language, any purpose (phone books, newspapers, cheap paperbacks, labels &amp; such). Which ones can handle the punishments of bad paper and small sizes without breaking a sweat? <br> <br>kris.</p>
