    html: '<p>In my list? <br><span class="caps">BTW</span>, I can only add one more for now: Clottes (also by Mandel). <br><br>So Kris, you’re wondering most about phone books? Because the width constraint there actually creates a stong tension against the need to make type wide at small sizes. <span class="caps">BTW</span>, every lo-ﬁ freak needs to read Tracy’s “Telephone Directories” article in issue #15 of the old series of Typographica (1958), pp 4-15. He even shows non-Latin stuﬀ. <br><br>hhp</p>'
