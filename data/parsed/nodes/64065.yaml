    votes: null
    html: |-
      <p>UV and matte lamination is done 'offline' after the sheet is printed. Most of the time this is a protective cover. They basically apply it off a roll to cover the entire press sheet. I've not heard of printing on that after it's been applied but it wouldn't surprise me.</p>
      <p>There is also an 'aqueous coating' (matte or gloss) that is used as a protective cover over the sheet. This protects the ink from scuffs. Most magazine covers have either an aqueous coating or lamination applied. This keeps the ink between copies from rubbing together during transport. If they don't do this micro vibrations in the bundles will rub the ink off in spots like sand paper.</p>
      <p>A dull varnish shouldn't produce a velvet feel if you have a stock with a smooth finish.</p>
