      <p>By using both 'dull' and 'gloss' varnish together you can achieve this type of result shown over black. They may have also used a gloss varnish over a very dark PMS Gray. There are a couple of different ways this might have been done.</p>
      <p>--------------<br>
      'Dull Varnish' will produce a very matte finish and light will not reflect well off of it.<br>
      --------------<br>
      'Gloss Varnish' will produce a very shiny finish that will reflect light and appear almost wet.<br>
      --------------</p>
      <p>Your examples show this really well and it would be an excellent idea to bring them along so the printer can see exactly the affect you're after.</p>
      <p>The third image I uploaded is a 'Spot Gloss Varnish' over a solid PMS 1545 [Dark Brown].</p>
