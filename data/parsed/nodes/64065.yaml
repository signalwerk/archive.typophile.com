      <p>Spot varnishes are not black in color... they are actually a clear yellow, which appears clear over the ink. If you print spot varish on white paper it will actually turn the stock a slight 'yellow'.</p>
      <p>Depending on if you use a 'dull' or 'gloss' varnish it will cause a color like black to change in appearance as it catches the light.</p>
