    html: |-
      <p>Note that you will get two subtly different effects depending upon whether you choose to put down matte lamination and then print spot gloss varnish on top, or whether you put down gloss lamination and then a spot matte varnish on top.</p>
      <p>For a black-on-black type treatment, what you describe will probably give the results you're after.</p>
      <p>But when working with photos, for instance, I've found that matte lamination kills the color in a way that the gloss varnish can never bring back. Whereas the opposite approach will maintain richness and still yield a nice effect (although the matte varnish over gloss lam will never have quite the same velvet surface as matte lam).</p>
      <p>Also, is your printer really talking about a lamination, or does he mean an aqueous coating? Laminations can have a tendency to cause curl (because it's a plastic coating) if the back isn't somehow balanced out and if the humidity of the shop doesn't match your world. A publisher I worked with used to have a heck of a time with certain book covers curling during different times of the year.</p>
