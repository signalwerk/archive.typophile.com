    <p>Hi all,</p>
    <p>Im working on an invite in which i am going to have white text on a black background. i wanted to know whether there are any guidelnes i should follow to ensure legibility. aslo i am using scotch modern as body text. should i be worried about the ink filling up in the thin strokes?</p>
    <p>same questions apply to spot uv varnish.</p>
    <p>thanx in advance.</p>
