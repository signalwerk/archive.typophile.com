    html: |-
      <p>If you really want to do both well then it is indeed a good idea to have two versions as Tim said. Or maybe more. But I will get to that...</p>
      <p>You may want to pick at text size you want to use as a standard/baseline and focus on getting the design optimized at that size. say 10 point... That would be a good start.</p>
      <p>Alternatively you could instead pick the smallest size you want to support and then interpolate between it and a medium size (16? ) design to make say 6, 8, 9, 10 , 12, 14, 16pt versions. But that might be overkill.</p>
      <p>Taking a look at what others have done may help you decide. Before you make size optimized versions you definitely want to settle some things about the core design. the g, w &amp; so on. And definitely the interletter spacing. And actually the spacing is a size specific issue as well! All the more reason to pick a reference size.</p>
      <p>After you have selected a size to work on much of what you need to know can be figured out by making printouts at the relevant sizes &amp; tweaking based on what you think could look better - eg trusting the eye. This should not be underestimated!!!</p>
      <p>But you are correct also in thinking that there is a good body of work showing what to change when going from text to display.  Before you decide what you want to try to support it would be good to see how others have done it. For that I would look at John Downer's work on Paperback, Josha Darden's Freight series, and maybe search Typophile via Google. And there is Arno Pro as well.</p>
      <p>I found this:<br>
      <a href="http://www.typophile.com/node/16839" title="http://www.typophile.com/node/16839">http://www.typophile.com/node/16839</a></p>
      <p>From the Typophile Wiki:<br>
      <cite> Of special note is Sumner Stone's Cycles, which is one of the few modern examples of a font carefully crafted at each of the optical sizes. Monotype is also updating their library of classic fonts with some specific sizes, notably Bembo Book.</cite></p>
      <p>I also know that Matthew Carter's designs for Newsweek are size specific. I can point you at a document that compares the outlines though. It's a great problem to dig into.</p>
      <p>Meta now comes in text &amp; display versions. Look at them.</p>
      <p>Ah, and I would definitely not insist on the g minus it's lower bowl for a text face. I would reserve that for a variant glyph in the display size.  </p>
      <p>I will see what else I come across this week re: optical compensation and post it here. I think the wiki could use updating too.</p>
      <p>I am sure that other folk here will also have even better suggestions than mine.</p>
