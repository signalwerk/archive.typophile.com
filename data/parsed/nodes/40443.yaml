    html: |-
      <p>Nice to see your typeface coming alive Satya :) It has a nice feeling I think.</p>
      <p>I saw a few things:</p>
      <p>W, w could be narrower, now they are like two V, v put together. Try to narrow the angle on them, I think that would be better. And perhaps also push the joining bottoms where the stems meet a little bit to the outside. This is mostly visible on light and regular.<br>
      The K, k – I prefer them as they are on the light weight and think you should have these design on all weights.</p>
      <p>The B P R are related letters - but P and R looks differently at the top where the little stem is visible. Either B should also have this, or it could be removed.</p>
      <p>The T looks a little bit to narrow compared to other letters. And the U a little to wide. Especially on the light and regular.</p>
      <p>The S and s are leaning backwards a litte bit. Making them look shy.</p>
      <p>i and j has different stems on the top (the small angle) than other straight stems. I cant decide weater I think it's cool or disturbing :)</p>
      <p>For me (maybe this is personal) the stress is on the "wrong" stem on V W X Y w v x y. I would shift it so the thickest stem is the first stem, opposite from what it is today. And also the A of course. I know Gill Sans has this "feature" also, but most fonts have the opposite I believe.</p>
      <p>If you look at the T on regular – do you see that the horizontal stem is feeling thicker than the vertical? This could perhaps be something you could look into? Or not, if you want to have this feeling of a mathimatical thickness on the stems :)</p>
      <p>The m could be a little narrower perhaps...</p>
      <p>Well, that's my two cents after a quick look.</p>
      <p>Keep up the good work!</p>
