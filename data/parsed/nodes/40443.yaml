    html: |-
      <p>I would add that the g is distracting to me. I know it's meant to be the selling point on some level but I would reserve it for a display option. </p>
      <p>The main issue I think you have is the interletter space and the counterspaces. What I see is thet the interletter space is too tight for the counter spaces.</p>
      <p>In general you should be looking for the counterspaces and the interletter spaces to be similar. Noordzij &amp; Brieim both make good cases for this. Here is briems'<br>
      <a href="http://briem.ismennt.is/2/2.3.5a/2.3.5.02.method.htm" title="http://briem.ismennt.is/2/2.3.5a/2.3.5.02.method.htm">http://briem.ismennt.is/2/2.3.5a/2.3.5.02.method.htm</a></p>
      <p>You can find Noorzij's even more in depth description in "the Stroke" Translated by Peter Enneson. </p>
      <p>This may also be relevant. Think about which path you want to take where overall spacing is concerned. My sense is that you are falling outside of these ranges.<br>
      <a href="http://briem.ismennt.is/2/2.3.5a/2.3.5.01.spacing.htm" title="http://briem.ismennt.is/2/2.3.5a/2.3.5.01.spacing.htm">http://briem.ismennt.is/2/2.3.5a/2.3.5.01.spacing.htm</a></p>
      <p>If it was me I might consider shrinking the counters slightly. As well respacing. Not that you should choose either one. Just that they are both options.</p>
      <p>I hope this is helpful.</p>
