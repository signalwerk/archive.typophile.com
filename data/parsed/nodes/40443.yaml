    <p>Hello all,</p>
    <p>I had started <a href="http://typophile.com/node/40264" rel="nofollow">a thread</a> few days back but I didn't get enough feedback and now it seems that it has lost completely. Sorry for creating this another thread.</p>
    <p>Since last couple of weeks I have been working on the various weights of my typeface called Absans. At the moment Absans has 4 weights, i.e. Hairline, Regular, Bold and Ultra Black. I had never designed an Ultra black typeface before and also this was the first time I did a hairline version too. </p>
    <p>Please have a look at the attached designs and let me know what you think. I really need your master feedback to carry this design furhter.</p>
    <p>Thanks in Advance<br>
    Satya</p>
