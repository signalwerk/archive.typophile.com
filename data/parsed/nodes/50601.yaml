    html: |-
      <p>&gt; fonts should have smaller relative overshoots the larger they get</p>
      <p>Smaller <em>absolute</em> overshoots (meaning in the font design). Which makes sense. Plus it's mentioned in a footnote in Harry Carter's edition of Fournier.</p>
      <p>&gt; No designer is expected to design fonts at different sizes</p>
      <p>Why not, since scale affects the net results? Before digital type (actually before phototype... actually before the pantograph) a given font design was for one size only, and was -generally- designed to be optimal at that size. Now the convenience of using a font at any size has overpowered the sense not to. Sure, a give font can serve within a range of sizes not just a single size, so scaling is useful, but in practice this range is quite narrow. Fortunately during the past decade many type designers have started seeing the light: they point out the scalar limits of their designs (like indicating whether it's a text font or a display font) and some of them even make different cuts within the text range.</p>
      <p>hhp</p>
