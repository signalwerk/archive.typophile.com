      <p>Yes, I know. Couldnt help myself. But there is some truth behind it. 12 nodes for the S-curve. Then if the curve has serifs or not thats another story. But I think that if you want it really smooth, then 12 nodes is the best. But sometimes the S have a straighter area aomewhere along the "big curve" and then of course it needs more nodes.<br>
