      <p>I wonder if extra points might make things easier/faster for hinters. When I was starting to learn about tt hinting I quickly noticed that point placement could make it far easier or harder to do. </p>
      <p>Gerrard Under showed us an "a" he designed and where he put extra points &amp; why. I have little doubt that some "s" shapes might benefit from similar finesse. judging by the subtle enhancement they provide it is also almost certainly true that he got as close as possible without the extra points before adding them. </p>
      <p>So as usual, it's time to dine on a big pile of "it depends" - just as Paul Hunt said.</p>
