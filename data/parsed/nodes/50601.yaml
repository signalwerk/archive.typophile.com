      <p>&gt;in my opinion there must be some regular geometry — maybe a polygonal grid — behind a well shaped “S” letter simply because it’s well shaped.</p>
      <p>In my opinion that's a fundamental mistake. People have been looking for simple--and not so simple--geometry for centuries and haven't found it. Almost everything in letters violates simple, regular geometry, because that's not the way the eye-brain combo works. And the S has one of the most complex shapes. </p>
      <p>In the case of the S and s, a basic principle is that the bottom part needs to be bigger than the top part. This follows two principles, both of which violate simple geometry. The first is that when you split something vertically, the divide, to look equal, generally has to be higher than equally bisecting the space vertically. The second principle is that the top part needs to be narrower than the bottom, to look more secure and stable. Hence the top arm of the E is often shorter, and the top of the K, S and X smaller and narrower than the bottom. Similar stuff happens in the lower case. You can see the same principles at work in the design of furniture, buildings, etc.</p>
    html_clean: |-
