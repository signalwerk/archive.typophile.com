      <p>Paul, historically there have been problems with leaving out explicit vertices at inflection points. You can see an example by outputting a TT font from Fontographer. Even if these days FontLab is smarter than that, somewhere along the line (like the RIP of an output device, or a PostScript emulator) you might hit problems, so it's safer to place vertices there (usually towards the very end of the design process).</p>
      <p>Funny things can also happen when you have a curve that ends in a corner point without a BCP.</p>
      <p>hhp</p>
