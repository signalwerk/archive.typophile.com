      <p><cite>The first is that when you split something vertically, the divide, to look equal, generally has to be higher than equally bisecting the space vertically. The second principle is that the top part needs to be narrower than the bottom, to look more secure and stable.</cite></p>
      <p>Bill, there is a tendency for some designers to overdo these two required differences, rather than to get the top and bottom to look right. The same thing can be said of many overshoots which end up looking too big and ink traps which can distort the look of a character. It's as if some designers want you to know that they have attended to such issues, but end up only making more trouble. There is one logo which I always think has O's (or S's) that are far too tall when I see it on trucks in UK but I can't remember for the life of me which it is. Think it might be <a href="http://www.tesco.com" rel="nofollow">Tesco</a>?</p>
