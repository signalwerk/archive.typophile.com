  html: <p>I stumbled across this wonderful site the otherday and would liketo get you opinions on a logo I am working on. It's for an upcoming conference. I've never really tried to design type before, but seemed to get a bug to do it for this design. Let me know what you think. <br>Thanks! <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/6550.jpg" alt="logobnw1"><img src="http://www.typophile.com/forums/messages/29/6551.jpg" alt="logobnw2"><img src="http://www.typophile.com/forums/messages/29/6552.jpg" alt="logobnw3"></p>
