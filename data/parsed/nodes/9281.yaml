    html: <p>thanks for the feedback! <br>i modified the horizontal version to help the 'o' out a bit and pulled the vertical version off the type to try and get a sense of which would work better. What do you think? <br> <br>Im thinking that I might save the type I designed for further refinment as a learning experience. I am surprised at how much I enjoyed designing the letterforms but obviously I've got alot to learn.  <br>More on that later. <br><img src="http://www.typophile.com/forums/messages/29/6581.jpg" alt="logobnw4"></p>
