    html: <p>The middle option is by far the cleverest and also reads best.The horizontal use in the third option doesn't work so well, since the d and e stand out but the fish doesn't read as an o. <br> <br>I second Stephen's suggestion that you try this approach with an existing type (modified for weight as necessary), but if you do decide to stick with your own letter design than Cristian is right in saying that your c and e need to be opened. <br> <br>Your n is too wide. <br> <br>For a good example of the kind of optical adjustment Cristian recommends for the a, d and g, see Futura.</p>
    html_clean: <p>The middle option is by far the cleverest and also reads best.The horizontal use in the third option doesn't work so well, since the d and e stand out but the fish doesn't read as an o. <br> <br>I second Stephen's suggestion that you try this approach with an existing type (modified for weight as necessary), but if you do decide to stick with your own letter design than Cristian is right in saying that your c and e need to be opened. <br> <br>Your n is too wide. <br> <br>For a good example of the kind of optical adjustment Cristian recommends for the a, d and g, see Futura.</p>
