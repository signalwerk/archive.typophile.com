    html: <p>I like the idea of. Very nice. No.3 (bottom) is the strongest. Unless you can separate No.2 from the text, because I like the verticality of the mark.  I agree with typeface simplification as well. the 's' seems a little too clever as does the 'yi' lig. And the apostrophe needs some tlc too. also, with No.3, I feel that it needs some space in between the mark and the text. I believe this would strengthen them and also relieve the redundancy of the letters.  <br> <br>All said. The concept in an of itself is very strong.                                                                                 </p>
