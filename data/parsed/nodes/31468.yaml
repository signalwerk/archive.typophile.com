      <p>I am not sure what the reasons were for Univers &amp; Frutiger having standardized sidebearings. There are potentially many reasons. One reason is that making a type design rationalized saves time. Another reason might be that doing that would accord with the deisgn spirit of the time in which they were designed. Also, design for linotype machines was far stricter than digital design is and it may have been an approach that was habitual. A type historian can nail this down better than I can. </p>
