      <p>I think as JoergGustafs said earlier, using the perspective tool is throwing this out. Unless it's a virtual scene it's always going to play with your eyes and look 'off'.</p>
      <p>Personally I'd keep the bars either the same width or very close. Also the right hand bar I'd make slightly taller so the negative space between the shadows and text is equal. All in all I think you're almost there, just push that left-hand bar in a bit, increase the height and width of the right-hand bar and you have a very nice logo.</p>
      <p>I also prefer the smaller weight of text on the left.</p>
      <p>Evanbrog: I agree, the space around the foot of each bar is different where it meets the shadow....though I assumed these were quickly put-together mocks and he/she will fix that later.</p>
