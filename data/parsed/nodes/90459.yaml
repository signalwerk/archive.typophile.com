    <p>Hello everyone -- first post here. My sorority is celebrating its 100th anniversary this year, and I've been asked to design some stuff for our local events. The national organization is taking care of all the national things, but our local group has enough money to pay for the printing and that's about it. </p>
    <p>We were founded in 1912, so I thought it would be nice to put our programs, nametags, etc. in a font from 1912. I'd like it to be something people would notice and ask about, so I could say "Oh, yes! That was ______________ and it's 100 years old, just like us!" and also decidedly feminine, but not so flowery that it's illegible. </p>
    <p>If anyone has any suggestions that are within a couple of years either way of 1912, preferably earlier, so our founders could have used it, that would be fine too. I have about six weeks on this, and if I do end up spending a little of my own money, I guess I could resign myself to that, although I don't have any idea of what this might involve. </p>
    <p>Thanks in advance. </p>
    <p>Barbara</p>
