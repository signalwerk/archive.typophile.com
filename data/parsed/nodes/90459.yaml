      <p>Incidentally your university probably has some actual printed pieces from that time period in their archives (graduation programs, invitations, etc), and they might be useful as design reference.</p>
      <p>Where I went to college those materials were kept in a locked room at the library, but anyone could view them upon request. Anyway you might inquire at your library.</p>
      <p>&gt; nametags</p>
      <p>If you want to be authentic, keep in mind that any handwriting (like a name on a tag) was probably done in script using a fountain pen.</p>
