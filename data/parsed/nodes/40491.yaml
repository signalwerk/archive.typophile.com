      <p>Hrant returns to Typophile and converts Miss Giggles to absolute monarchy. Miss G. is so eloquent in its defense that a small Pacific island, with one typophiler, recruits her as Queen. Shortly thereafter, she declares war against Canada, because it booted Typophile off the internet. Hrant tried to tell her that was Typographi.ca, and it’s all OK now, but it’s too late. Japan says the island, hitherto unknown, actually belongs to it, and that Miss G is not Queen. China responds that it belongs to them, and the whole thing spins out of control and threatens to create WW III. </p>
      <p>Also a young intern snaps her underwear at a randy President. She blabs to her friends, and it gets in the press, and the whole thing spins out of control. His as a result the Vice President fails to be elected, and a dunce is elected instead—who goes to war with the wrong country. </p>
      <p>Oops that already happened. </p>
      <p>And you thought I was making this up :)</p>
