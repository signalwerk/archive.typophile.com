    html: <p>Adobe will announce later in the year that it has developed a new web style sheet standard that will be fully supported by Internet Explorer, Firefox and Safari by the end of the decade. (Opera will not offer support for this standard.) Also as part of this announcement is news that this new style sheet standard will be integrated into all Adobe CS4 products to allow export of XML based PDFs by the end of the decade. Deciding not to call this project the Adobe Style Sheet due to the resulting acronym, it will be called Niagara.</p>
