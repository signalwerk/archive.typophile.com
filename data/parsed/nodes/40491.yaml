    <p>OK, we have been through 2 whole days of the new year. That should be long enough for us to spot the years trends and make predictions!</p>
    <p>1. “Helvetica” the film will get an Academy award;</p>
    <p>2. Meta Serif will become the most used new typeface of the year;</p>
    <p>3. Microsoft will debut a new multi-language typeface for screen/web use and bundle it with Office.</p>
    <p>4. A typography “Hall of Fame” will open in the Netherlands (the first inductee will be “Mr. ’T’ but TO will be rejected due to excessive celebrations);</p>
    <p>5. Apple will FINALLY release an opentype friendly OS;</p>
    <p>6. Adobe will release a new typeface designed by Miguel Sousa;</p>
    <p>7. The Consortium will finally figure out a way to get kerning to work on screen.</p>
    <p>Feel free to add or detract, </p>
    <p>ChrisL</p>
