      <p>1) Unicase fonts will begin to supplant capitals and lower case in mastheads and headline applications.</p>
      <p>2) A renewed surge of type-related buzz-words and cliches will arise. (<a href="http://www.abc.net.au/news/stories/2008/01/02/2130079.htm" target="_new">Perfect surge of cliches mars 2007.</a>)</p>
      <p>3) The number of female Typophile members will increase. New and long-standing members will post more threads about “Why so few women in type?”</p>
      <p>4) Microsoft will release a version of Office apps even more inept than Office 2007.</p>
      <p>5) The Consortium will come to the Typophile table to find out what’s wrong with CSS and how to fix it.</p>
      <p>6) The much-anticipated Dezcom faces will be released to frenzied cries of “Mister Lozos, what a liberty!”</p>
      <p>7) Typographic wallpaper will become a massive trend on interior walls everywhere.</p>
      <p>8) There shall be great rubbing together of sidebearings.</p>
      <p>9) Yae verily, a type designer shall lose a fellow type designer’s calibration hammer (put there only just the night before, about eight o’clock).</p>
      <p>10) Coffee. Coffee, coffee, coffee. A new kind of accent shall appear—-the coffee bean accent. A cuppy of cafe for every fontlover.</p>
      <p>Si—-LOL!</p>
      <p>j a m e s</p>
