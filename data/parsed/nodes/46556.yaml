      <p>Make sure to ask whomever will be teaching the students next year so that nothing important gets left out.</p>
      <p>Also, my first-year teacher did us a huge favor by teaching us what the various little features of Indesign really did and when to use them or not use them. Student work gets a lot better when they know about the baseline grid and to not enable optical kerning for body copy.</p>
