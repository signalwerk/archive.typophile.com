    html: |-
      <p>This is more of advice as someone who loved her typography teacher, but also as some one who has some misgivings about her education.</p>
      <p>I do like the choices of projects, they are sort of similar to some of what we did in school. I am glad you are doing office supply packaging- we did food packaging- and I think it was a poor decision, because in the "real world" there are more rules for food/medical packaging.</p>
      <p>As a teacher, use the proper names for the different parts of characters, and whatnot. Drill the names into their heads. </p>
      <p>You don't have to teach programs, but be open to answering questions about programs- OR even better- provide a short list of websites at the beginning of the semester of forums and sites with info on InDesign and Quark that they can use to solve problems on their own.</p>
      <p>One last thing...we did a group magazine project- groups of five, and each group had a different kind of magazine. It was a pain, working with other people's styles, but it was fun.</p>
      <p>ALSO- we had to research a famous typographer- I had Jan Tschichold, and then we designed a poster for a fake exhibition on the person, in their style, or the style of the time period in which they worked. It was fun.</p>
      <p>Anyway...my two cents. Best of luck- a teacher who cares is the best kind there is!!!</p>
      <p>"It's easier to tone down a wild idea than think up a new one." -Alex Osborne</p>
