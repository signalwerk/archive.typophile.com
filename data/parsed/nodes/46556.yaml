      <p>I would avoid turning it into a software tutorial. There is so much material in typography alone that there is little time. I would surely cover what are some things needed for making good typography from book usage to ads and brochures. Touch on history of technology and valuable terms a user will need to know. Basic readability explaining the relationship of face, size, leading, line length. etc.</p>
      <p>ChrisL</p>
