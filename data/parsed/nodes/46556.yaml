      <p>At my school, we weren't allowed anywhere near a computer for the entire first semester of typography. All letters had to be photocopied or hand-traced, and the projects ranged from posters to large format books dedicated to a particular font. We were given short lectures on the history of type, basic terminology and rules, but most of the time was spent developing projects.</p>
      <p>1. Simple word collage (photocopier)<br>
      2. Tracing an alphabet<br>
      3. Designing three letters that could've been part of a font (tracing)<br>
      4. Designing a poster (pasteup and tracing)<br>
      5. Creating a book that would showcase a particular font (and it's relationship to layout, color, texture etc.)(pasteup and tracing)</p>
