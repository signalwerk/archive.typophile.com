    <p>I am teaching a first-year Typography class next semester. While I taught it last year in September, I wasn't really happy with the outcome of the projects nor the structure of the course and how much information I presented to the students. The projects/course content has been regulated (more or less) by the 'higher ups', but this time around, we are allowed to change some of the content and projects. The projects are as follows:</p>
    <p>1. Typography only logo design for a new health food store<br>
    2. Typography only logo for a publishing company<br>
    3. Layout/publication (the students are selecting an article about a specific musician to be printed in a music magazine. The idea is to get the students to express the music/style of the artist via type w/o the use of any imagery.)<br>
    4. Package design for a series of office products, focusing on just typography.</p>
    <p>My challenge last year has been integrating the course lectures into the projects. Last year, the framework of the course consisted mainly of material from the typography book, mixed in with some of my own knowledge. Keep in mind this isn't a private art/design institution, but a small dept. within a state system. So there not THAT much room for flexibility. However, this year, we get the green light to change things around.</p>
    <p>So in terms of lectures, how much should I throw at them? None of these students have ever taken a typography course, so this will be a new experience for them. Should I take out one project and increase the value of the other 3, while focusing on lectures? Seeing as the class is only twice a week for a measly 1hr50min, that doesn't give me that much time to cover history of typography in great great great detail. And the requirement that we HAVE to follow is at least 3 projects per semester, with 4 being ideal. My biggest issue is connecting projects with the lecture content.</p>
    <p>I am a fairly new professor (2 years of experience) and any advice from more seasoned designers/professors would be appreciated.</p>
    <p>Thanks Typophiles!</p>
