    html: <p>I don’t think that you should push into anything too deep with Indesign, just use it to reinforce your teaching. My type teacher usually showed us how to do whatever she was lecturing about, for example, when we learned about grids she showed us how the <em>Create Guides</em> tool works. I think this really helped drive her points home, because (for those of us who had done the reading ahead of time) it was the third time we had heard it, and we were getting it in a different context. I think that it also saved a lot of time during critiques, because people rarely had to point out software-related problems.</p>
