    <p>Hi -</p>
    <p>I've used Font Explorer for a few years now without issue. But suddenly, If I go to activate my type, for example. Gotham, Gotham Italic, Gotham Light... They all show up as "gotham" in Font Explorer. So in a list it looks like</p>
    <p>Gotham<br>
    Gotham<br>
    Gotham<br>
    Gotham</p>
    <p>Then the style column on the far right, it simply says regular. The font files are all named according to the correct style of the typeface, but for whatever reason when they are n Font Explorer, they come up as the same thing. When I actually activate all of them, I do not get a conflict, but in my software they only come up as Gotham regular.<br>
    I've just upgraded my mac to 10.5.2. But I don't know if this problem was around before that. </p>
    <p>Has anybody else ran into anything like this before?</p>
    <p>Thank you!</p>
