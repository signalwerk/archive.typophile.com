    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Michael Clark</strong></p>
    <p>Michael Clark is a calligraphic <a href="/wiki/lettering%20artist" class="freelinking" rel="nofollow">lettering artist</a> who resides in Richmond, <a href="/wiki/Virginia" class="freelinking" rel="nofollow">Virginia</a>. His work entails creation of logo designs, titling for CDs, Books and magazines as well as font development for both corporations and independent foundries.</p>
    <p>Typefaces by Michael Clark: <a href="http://www.p22.com/ihof/frenzy.html" rel="nofollow">Frenzy</a>, <a href="http://www.p22.com/ihof/pooper.html" rel="nofollow">Pooper Black</a>, <a href="http://www.p22.com/ihof/shibumi.html" rel="nofollow">Shibumi</a>, <a href="http://www.p22.com/ihof/font.asp?font=monumentaltitling&amp;face=monumentaltitling" rel="nofollow">Monumental Titling</a>, <a href="http://www.p22.com/ihof/font.asp?font=peanut&amp;face=peanutotset" rel="nofollow">Peanut</a>, <a href="http://www.p22.com/ihof/font.asp?font=sting&amp;face=sting" rel="nofollow">Sting</a>, <a href="http://www.p22.com/ihof/font.asp?font=sweepy&amp;face=sweepyot" rel="nofollow">Sweepy</a></p>
