    html: |-
      <p>Perpetual exclusivity is a tricky one. You'll naturally raise the price, but how does one calculate potential (lost) retail sales for the life of the font against the size of the company? Maybe a supplemental annual royalty would be in order, but full ownership implies they would want to avoid that hassle.</p>
      <p>At least include a clause that rights to the font revert back to you should it be removed from their corporate design system or otherwise fall into disuse after a period of time. They might not go for that either, but it's worth asking for.</p>
    html_clean: |-
