    html: "<p>Often the way a license works is that that you give tem exclusive use of it for x # of years after which you may license it to someone else or offer it on the retail market for non exclusive use. Exclusive use costs more that retail. MUCH more. What the price of exclusivity is will depend on the value the client sees in it. Anyway that's the normal thing. Obviously you or they may want other terms and so it's up to you. Want to show the font to us?</p>"
