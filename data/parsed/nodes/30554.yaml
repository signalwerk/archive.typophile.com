    date: 2007-01-31T21:47:00
    date_raw: 31 Jan 2007 — 9:47pm
    votes: null
    html: <p>When I license files...they are all 'single-end user' agreements.  It would be impossible for anything I've made previously to suddenly have restrictions put on it. (Yes, people have actually asked me if I could 'do that for them.' All of my are free for personal and classroom use - the ones that are currently on the site.  The files that I custom make I title in a completely different way than I do my normal files AND in the copyright line I list myself as the author but I denote copyright to the person/company who has paid me for the work.  I include 'the prize' as my attorney's call it (proven QUITE useful in the past) by hiding keystrokes, making special keystrokes, specific quirks, etc., known only to me and the client. I even have it mentioned that all original files may be destroyed at the 'new owners' request - although no one has asked me to do that as of yet.  If a custom file gets out in the public domain, I didn't have anything to do with it.  It's a matter of ethics.  I couldn't do that to someone seeing how I know EXACTLY how it feels to have work taken from you.  I've dealt with this issue in the past and I'm dealing with it right now too, sadly.  Lastly, registered owners get all formats of the file.  I only offer .ttf's on my site.</p>
