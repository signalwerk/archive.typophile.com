    <p>Hi all.</p>
    <p>What do you think about creating a logotype for multiple brands. Let me be more specific:<br>
    I must create a logotype not associated to anything(!?!).<br>
    It will be use in handdryers, ladies brushes or even bandages (!?).<br>
    The brand name? Not sure but something like "metaline".<br>
    The ideia is to "develop" this new concept: logotype not associated to anything.<br>
    Can this work? how ? ideias? suggestions?</p>
    <p>Thanks.<br>
    António</p>
