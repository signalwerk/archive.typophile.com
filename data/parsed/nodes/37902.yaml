    html: |-
      <p>You have a brand name (or will have) that is to be applied to different products, the problem/opportunity is that your logotype shouldn’t be specific to one product – many brands do this, some use a strapline so – </p>
      <p><strong>Metaline</strong><br>
      <em>handdryers</em></p>
      <p><strong>Metaline</strong><br>
      <em>bandages</em></p>
      <p>Other approaches might use colour or shape to separate the strands of a brand. </p>
      <p>Frankly though, it is not a new concept, these products are not so diverse they seem to be the kinds of things one might find in a pharmacy or clinic. Many retail chains have own brand products or carry a range of products from one supplier.</p>
      <p>Tim</p>
