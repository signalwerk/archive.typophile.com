    date_raw: 16 Jan 2013 — 12:02am
    date: 2013-01-16T00:02:00
    votes: null
    html: <p>I don't think anyone is denying the central influence of Russia in the spread of the Cyrillic writing system to other peoples of the Soviet Union, but that's not what you originally said. You stated 'cyillic is only used by orthodox christian slavic countries', and that is what I was querying, because that has not been true for the better part of 100 years. If all you meant was that the Cyrillic writing system developed within the cultural framework of Orthodox Christian Slavic countries, then we don't disagree.</p>
