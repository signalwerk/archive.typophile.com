    html: |-
      <blockquote><p>But then if we made every country do cyrillic there would be the question of which cyrillic. There's no way you'd get countries like Serbia to use Russian-cyrillic, for example (not if you don't want a fist fight that is, lol)</p></blockquote>
      <p>Haha. Don’t exaggerate. There are no really significant differences in the <em>style of letterforms</em> between Serbian and Russian (or, more correctly, International) Cyrillic. However, <em>there are</em> differences in Cyrillic transliteration. For example, this is how the word ‘Cyrillic’ looks in seven Slavic languages using Cyrillic script:</p><div class="imageWrap"><img src="http://typophile.com/files/'Cyrillic'_in_Cyrillic_3788.jpg"></div><br>
      <blockquote>cyillic is only used by orthodox christian slavic countries</blockquote><p></p>
      <p><a href="http://en.wikipedia.org/wiki/Languages_using_Cyrillic" rel="nofollow">Not so</a>: you can hardly consider Kumyk, Nanai, Buriat, Dungan, and many, many other peoples either orthodox Christian or Slavic.</p>
  - id: 538132
    user_id: 207047
    user_name: LanaJ
    user_path: null
    date_raw: 15 Jan 2013 — 7:25pm
    date: 2013-01-15T19:25:00
    votes: null
    html: |-
      <p>It's not the difference in the style, it's that the alphabet is different. As someone who is slavic and reads cyrillic, I myself can't decipher quite a few words in some languages because of the letters they use (which signify sounds that exist in all slavic languages, too)</p>
      <p>besides a little hyperbole never did anyone much harm ;)</p>
      <blockquote><p>Not so: you can hardly consider Kumyk, Nanai, Buriat, Dungan, and many, many other peoples either orthodox Christian or Slavic.</p></blockquote>
      <p>Kumyk: only spoken in russia, notably heavily influenced by the language<br>
      Nanai: the language borrows heavily from chinese and russian, also because of its proximity to russia (since it's used in siberia) it uses exactly the russian alphabet<br>
      Buriat: the buryat republic is actually in Russia, also it uses mongolian script but slowly adopted cyrillic because of influence from the country<br>
      Dungan: the written standard for the language was created in Russia</p>
