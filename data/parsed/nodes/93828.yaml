      <p>I noticed a book in my local library entitled "English: the last lingua franca". I think the title is a good one; for the moment, English is indeed the world's dominant language. But eventually, they will improve Google translate, and people will no longer bother to learn foreign languages... for the same reason that schools no longer spend as much time teaching the intricacies of long division.</p>
      <p>I think this is liberating; while I enjoy my fortunate status as a native speaker of English, I wish everyone else to share my good fortune in their own language - to have access to the world's literature without having to learn other languages.</p>
