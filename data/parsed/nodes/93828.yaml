    <p>I was disappointed to see Ukrainian (and Russian) players with their shirt names in Latin script.<br>
    Not only that, as host country (along with Poland), I would have liked to have seen the other countries’ players with their names in Cyrillic.<br>
    (Yeah, I know, cater to the market; but make the commentators do a little homework as well!)<br>
