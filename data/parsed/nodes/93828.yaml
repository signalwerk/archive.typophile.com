      <blockquote><p>Nor can you consider them Russian. Even if they live close to Russia, or in Russia.</p></blockquote>
      <p>true, my statement should be amended to say orthodox slavic countries or regions that were influenced by them an adopted the alphabet as a result of long term contact </p>
      <blockquote><p>Cyrillic is used in a number of majority Muslim Turkic countries, for instance Kyrgyzstan and Kazakhstan. Or were you referring specifically to countries participating in Euro 2012?</p></blockquote>
      <p>again, "stan" countries, meaning previously Russian country until the USSR was dissolved. </p>
      <p>Cyrillic was developed in the Bulgarian empire in the 10th Century AD and it is the basis of many slavic alphabets. Instances where it might not be a slavic language are due to Russian influences where the countries/republics/regions adopted the alphabet as a result of contact with Russians.</p>
