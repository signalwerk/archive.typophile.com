  html: |-
    <p>P22 and the International House of Fonts proudly announce the release of the Foxtrot Pro Family.</p>
    <p>The P22 Foxtrot Pro family of fonts is the latest design by Norwegian type designer Torleiv Sverdrup for IHOF. The design of Foxtrot is inspired by the lively ballroom dance of the same name. It is a transitional antiqua with rounded serifs that features ligatures, smallcaps, oldstyle numerals and full Central European support for those with applications that support OpenType features. The companion, Foxtrot Sans, is a sans serif version with a little more jazzy expression. Both fonts are great for text and display. </p>
    <p>Pro Opentype features include: Stylistic Alternates, Standard Ligatures, Discretionary Ligatures, Historical Ligatures, Historical Forms, Small Caps, Oldstyle Figures, Fractions, Denominators, Numerators, Superscript and Scientific Inferiors.</p>
    <p>For the month of June, the Foxtrot Family and single styles and sets are available at introductory pricing.<br>
    <a href="http://www.p22.com/ihof/foxtrot.html" title="http://www.p22.com/ihof/foxtrot.html">http://www.p22.com/ihof/foxtrot.html</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/foxtrot_flag_4595.png"></div><p></p>
