      <p>"Happy" is pretty subjective but I suppose it has about the same effect as cute, or rounded, and avoiding a sterile mechanical style like Helvetica. For a sans try Yummo <a href="http://www.myfonts.com/fonts/flat-it/yummo/" title="http://www.myfonts.com/fonts/flat-it/yummo/">http://www.myfonts.com/fonts/flat-it/yummo/</a><br>
      But why restrict your choices to a sans?<br>
      For example check out Laura Worthington's fat hybrid _Ganache _ <a href="http://www.myfonts.com/fonts/laura-worthington/ganache/" title="http://www.myfonts.com/fonts/laura-worthington/ganache/">http://www.myfonts.com/fonts/laura-worthington/ganache/</a><br>
      Or fairy tales handwritten roman letters like Besley Hand <a href="http://www.myfonts.com/fonts/juraj-chrastina/besley-hand/" title="http://www.myfonts.com/fonts/juraj-chrastina/besley-hand/">http://www.myfonts.com/fonts/juraj-chrastina/besley-hand/</a><br>
      Think outside the box.<br>
      BTW "happy" and "serious" seem to be incompatible as font criteria. But I can see "happy" and well designed as a great combination.<br>
      Don</p>
