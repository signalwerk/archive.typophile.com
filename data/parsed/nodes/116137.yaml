      <p>@donshottype<br>
      ------------------------<br>
      Thank you for articulating it better, but I do think that is why the client went to ask help to get the idea to be well designed.</p>
      <p>I think my client said 'serious' because he wanted it to look as something presentable for corporate purposes, sort of consistency and legibility or cleanliness in the font. 'Happy' can be associated to the roundness of the edges of the glyphs maybe or </p>
      <p>Yummo &amp; Ganache do seem to have the looks but i dunno what to make of it. The former has its thickest weight still lacking in a little more weight and the latter leaning to whimsical. Even with these, I'll try to present it to the client. Thanks.</p>
      <p>Any other opinions, comments and/or suggestions are greatly appreciated.</p>
