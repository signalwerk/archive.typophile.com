      <p>@hrant<br>
      ------------------------</p>
      <p>Same sentiments to why he wants it "serious," but I agree that the client does not want it retard-happy haha!</p>
      <p>I agree with the weight &amp; width, but I think the x-height can still vary, really depends on the typeface. Anyway, I am not closing it only on sans serifs; just that I lean towards it more.</p>
      <p>Swagg seems viable as an option too (especially the italics, which I haven't ventured in yet.) Thank you very much.</p>
      <p>For both, @hrant &amp; @donshottype<br>
      ----------------------------------------------<br>
      Also looking into other kinds of looks so yeah, outside-the-box thinking here as well.</p>
      <p>Thank you thank you, but still open for more suggestions!</p>
      <p>EDIT:</p>
      <p>The client wanted the usual typeface used in their previous output so even though most of you suggested well-designed typefaces, the client just used where he was comfortable. To all, thank you for helping me today. Have a great day!</p>
      <p>Final EDIT:<br>
      Thank you for the following:<br>
      @J Weltin for suggesting Finnegan by Jürgen Weltin<br>
      @hrant for suggesting Swagg by Richard Miller<br>
      @donshottype for suggesting Yummo by Ryoichi Tsunekawa &amp; Ganache by  Laura Worthington</p>
