      <p>Strange – why does he want this to be "serious"? My only guess is he doesn't want it to look retarded-happy, like maybe this: <a href="http://media.chick-fil-a.com/Media/Img/catalog/Pressroom/ImageLibrary/logos/Chick-fil-A-logo-sm.jpg?download=true" title="http://media.chick-fil-a.com/Media/Img/catalog/Pressroom/ImageLibrary/logos/Chick-fil-A-logo-sm.jpg?download=true">http://media.chick-fil-a.com/Media/Img/catalog/Pressroom/ImageLibrary/lo...</a></p>
      <p>In my view the main things that make a font friendly/happy are weight, width and a large x-height; it can have serifs, as long as their not delicate; and some controlled irregularity might help here too.</p>
      <p>So what about this?<br>
      <a href="http://typographica.org/typeface-reviews/swagg/" title="http://typographica.org/typeface-reviews/swagg/">http://typographica.org/typeface-reviews/swagg/</a></p>
      <p>hhp</p>
