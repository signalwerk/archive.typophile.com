    <p>As usual, a client that just says feelings and nothing more concrete than what I am looking for.</p>
    <p>For a food chain, family-oriented / "for the crowd" kind of demographic, and I guess it will be in a certain shade of red (like ketchup.) Its commercial advertisments are usually depicting joy when being inside the establishment or patronizing their merchandise.</p>
    <p>Can anyone suggest? I am more leaning towards san serif typefaces since it is a tagline of sorts (can't say the tagline really, but something that in service with joy.)</p>
    <p>Any help, guide and/or suggestions would be much appreciated!</p>
