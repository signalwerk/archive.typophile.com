  html: |-
    <p>I'm sure a lot of you caught the Christian Schwartz interview on <a class="freelinking external" href="http://fontfeed.com/archives/webfonts-week-an-interview-with-christian-schwartz/" rel="nofollow">FontFeed</a> yesterday.</p>
    <p>He mentions that when it comes to type on the web, the lack of readable screen font is more of a drawing problem than a hinting problem. </p>
    <p>It's something that I've been thinking about a lot recently as more people start using @font-face and services like Typekit. We're starting to see a lot more print fonts in use, even for body copy on the web, and the problem is, even if they're hinted, they're not designed to be seen on screen and it shows.</p>
    <p>I'd like to know everyone's take. What is the largest problem here? Is it the design of typefaces used on screen? Is it the lack of/improper hinting and/or grid fitting? Or is it the rendering technology in the browsers?  </p>
    <p>In reality, I know it's a combination of everything, but I wonder if a strong enough design can hold up in even the harshest of rendering conditions. Georgia and Verdana seem to be able to.</p>
    <p>And if so, where are all the great screen fonts? Is it just too soon? Or does the economic model need to be set in stone first before type designers dare design a great commercial screen font?</p>
