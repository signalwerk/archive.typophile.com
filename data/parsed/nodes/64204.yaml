    html: <p>I think Christian is absolutely right when he says that most typefaces aren't designed for the web (screen). Just as Arial is ugly when used in print. This opens up a great challenge for us type designers, and I'm sure we will see many new well designed typefaces for web as the WOFF format feels comfortable enough to encourage the progress. I often feel blessed to be part of these Interesting times we face since the computers changed things around...</p>
