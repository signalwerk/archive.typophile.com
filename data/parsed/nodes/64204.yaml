    html: |-
      <p>@stefan H</p>
      <p>&gt;Arial is ugly when used in print.<br>
      Arno's correct - nobody's stuck printing out in Arial. Not a problem.</p>
      <p>&gt;and I’m sure we will see many new well designed typefaces<br>
      &gt;for web as the WOFF format feels comfortable enough to<br>
      &gt;encourage the progress.</p>
      <p>What's WOFF got to do with it? Or comfort? MSFT spent a bloody fortune on the Cleartype fonts and they *do* look good. Why didn't Apple do us all a favor and license them from MSFT as they do the other "web safe" fonts?<br>
      (This would have, as a practical matter, speedily *doubled* the choice of fonts available without resorting to linking with @font-face.)<br>
      Why is it - or so we're told - difficult/expensive to create good screen fonts? Where are the tools?<br>
      (Check out the post on the adobe blog paul d hunt's post has a link to.)<br>
      And with all the hoopla about @font-face, why has a tool like WEFT not been updated since 2003?<br>
      And do the flashified versions of print fonts that get used for headings or photoshopped versions used for background images and buttons look bad?<br>
      No. It depends on the way the font is rendered. Why is there no way to specify what kind of rendering you want in the browser without jumping through JavaScript hoops or relying on a plug-in like Flash?<br>
      And why am I going on like this?<br>
      And who is Christian Schwartz? (Any relation to Muslim Weinberg?)<br>
      Look, ain't no plethora, this was all spelled out years ago in the song, "Fifty Ways To Gauge Your Gamma":</p>
      <p>Don't sweat about hints, Vince<br>
      Make a new stem, Clem<br>
      Just snap to the grid, Sid<br>
      And get yourself free...</p>
      <p>See?</p>
