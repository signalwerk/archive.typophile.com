      <p><cite>We’d all need high resolution screens, wouldn’t we?</cite></p>
      <p>David, do you mean, that everybody would need a high resolution screen and that it would be cheaper to develop more fonts for low resolution screens?</p>
      <p>It’s the same as with the ebook devices. Which technology is promising with regard to high resolution screens and when can we expect high resolution screens?</p>
      <p>I don’t think, that it is necessary to develop many new fonts for the actual screens. A few more well hinted fonts, designed for the screen would be enough.</p>
      <p>(In my opinion the development of fonts families with styles for different sizes is much more important. And more serifed fonts. And finally worthy digital successors of classic typefaces like Garamond or Bembo. [Merlo works perfectly fine in small body text sizes.])</p>
