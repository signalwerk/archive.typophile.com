    <p>Hey there. I received a question about one of my fonts that I do not understand and hope someone here can help. This is the email I got:</p>
    <p>Hello Michael,<br>
    First, I'd like to thank you very much for the great typefaces you<br>
    continue to share. It really is appreciated. Second, I'd like to let<br>
    you know about a problem I have encountered using 3Dumb, I believe it<br>
    relates to a Windows bug, that is having trouble reading the data in<br>
    your font file. I am trying to embed 3Dumb onto a site using CSS, the<br>
    technique works fine in the Safari browser, and Firefox on Mac, but in<br>
    Firefox on Windows, and IE the font isn't rendered.</p>
    <p>Here is my test case:<br>
    <a href="http://christophermeyers.name/fonttest/" title="http://christophermeyers.name/fonttest/">http://christophermeyers.name/fonttest/</a></p>
    <p>After reading this:</p>
    <p><a href="https://bugzilla.mozilla.org/show_bug.cgi?query_format=specific&amp;order=relevance+desc&amp;bug_status=__open__&amp;id=517770" title="https://bugzilla.mozilla.org/show_bug.cgi?query_format=specific&amp;order=relevance+desc&amp;bug_status=__open__&amp;id=517770">https://bugzilla.mozilla.org/show_bug.cgi?query_format=specific&amp;order=re...</a><br>
    my best guess is it has to do with the use of a numerical value in the<br>
    name table.</p>
    <p>If you have any thoughts on this or would be able to re-release that<br>
    font using a different value in the name table, I would greatly<br>
    appreciate it.</p>
    <p>Any idea what he is talking about or how to fix this? I use FontLab Studio.</p>
    <p>Thanks.</p>
