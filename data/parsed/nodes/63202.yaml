      <p>The problem is in the family/full names of your font, the family name is '3Dumb' with a capitalized 'D' and the fullname is '3dumb' with a lowercase 'd'.  Believe it or not, this is enough to cause the t2embed library used to load fonts on Windows to burp.  Firefox 3.5, Safari and IE all use this library but Safari falls back to rewriting the name table and using a low-level font loading API when the load using the t2embed library fails.  Similar logic has been added for Firefox 3.6.</p>
      <p>To avoid problems with the t2embed library on Windows:</p>
      <p>1. Make sure the fullname includes a precise match of the family name (e.g. family = "Bountiful Bongo", fullname = "Bountiful Bongo Bold" and not fullname = "bountiful bongo bold" or fullname = "BountifulBongo Bold").</p>
      <p>2. Make sure no name table record (including the license record) is longer than 2500 characters.  Yes, this officially sucks...</p>
      <p>For your font, the simple solution is rename '3dumb' to '3Dumb' in your name table records and everything should be groovy.</p>
      <p>John Daggett<br>
      Mozilla Japan</p>
