      <p>Tired late night thoughts:</p>
      <p>Open FLS5's <em>FontInfo</em>, go through all pages, and whenever the name "3Dumb" appears, exchange it by "ThreeDumb". (Especially in the font name fields on the first <em>FontInfo &gt; Names and Copyright</em> page.)</p>
      <p>Perhaps you also need to change <em>FontInfo &gt; Names and Copyright &gt; Embedding</em> to "Embedding/Everything is allowed". Don't remember, but perhaps the font's current setting does not allow use with @font-face in Windows.</p>
