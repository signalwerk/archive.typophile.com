      <p>Well, I would think that many people feel that street signs that identify the names of streets, unlike major road signs - stop, yield, next exit - don't really have much influence on accidents. And they presumably also thought that those street signs, once put up, just stayed there - so that in 100 years, maybe 5% of them would normally be replaced through regular maintenance.</p>
      <p>Of course, if those signs incorporate modern retro-reflective lettering, then their perception that most of those signs date from the 19th Century, and are just being torn down now by insensitive tax-money wasting bureaucrats is mistaken. But people do have a strong fondness for the familiar, and so they don't want a film crew to have problems filming a movie about the 1950s in their city, I suppose.</p>
