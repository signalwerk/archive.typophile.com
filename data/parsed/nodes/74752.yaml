      <p><a href="http://www.flickr.com/photos/glenwilliams/2826043104/" target="_blank" rel="nofollow">Typical street sign</a> in Bath, England.</p>
      <p>The <a href="http://www.flickr.com/photos/bostphotography/3393751168/" target="_blank" rel="nofollow">  alternative</a> by David Kindersley which is fairly typical in the UK but still upper case.</p>
      <p>I would have thought there is some merit in retaining upper case to <em>differentiate</em> a street sign from a directional sign as on the London Underground where station names at the station itself are always set in caps. </p>
      <p>The old ones look nice but I'm pretty sure the new ones are easier to read. The minute road safety is called into question, function has to take precedence over aesthetics. I think Kindersley was interested in both.</p>
