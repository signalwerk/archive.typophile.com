      <p>The city of Toronto has been switching out their old street signs for new ones with Clearview for a number of years now. Mostly by attrition, so the cost over and above regular maintainable is negligible. I don't think the city told anyone about it :o). </p>
      <p>Although the sheeting materials are only guaranteed for 7 years, in practice, the service life of a retro-reflective sign in New York's climate can be as long as 15 to 20 years. They may still look OK after that time, but the retro-reflective quality of the material is significantly degraded over time so they eventually become useless at night. It's a safety issue. Nobody should have to tolerate having to try to read non-reflective retro-reflective street signs in the dark in a city like NYC. </p>
      <p>I would be willing to bet that that even within an 8 year time frame, the actual cost of replacing most of the signs would be covered by the cost of regular maintenance.</p>
