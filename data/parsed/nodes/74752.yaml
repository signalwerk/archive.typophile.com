      <p>I suspect hard-to-read street signs would reduce accidents, by forcing motorists searching for their turn-off to slow down.<br>
      On the other hand, if they're spending longer peering at signage, that's less attention being paid to the road ahead.<br>
      So what's the diff?</p>
      <p>**</p>
      <p>If U&amp;lc is so damn efficient, why doesn't commerce adopt this mode of roadside communication?<br>
      Instead, strip mall stores go for the most "illegible" form possible -- Condensed Capitals in black, although the fluorescent background does help.</p>
      <p>**</p>
      <p>The new street signs in Toronto are dreadful, because they're white lettering on dark blue. At night it's hard to locate the signs in the first place, before one gets an opportunity to read what's on them.</p>
