  html: |-
    <p>I'm working on some titles in InDesign and have an issue with the kerning on some titles. Basically "W" followed by "i" and "V" followed by "i" are problematic because the dot on the i (see the attached screen shots). The obvious answer seems to be that I need to create the titles in Illustrator so I can create outlines and remove the dot over the "i" in order to allow the letter to move close together. </p>
    <p>Is the another way I should do this in InDesign so I don't need to create imported graphics?</p>
    <p>By the way the typeface is H&amp;FJ's Historical Fell Type Italic</p>
    <p>I checked the glyphs and there are no ligatures for this letter combo.</p>
    <p>Thanks!</p>
