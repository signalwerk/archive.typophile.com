      <p>Hi Elena,<br>
      I’m curious, too. We <a href="http://typophile.com/node/50176" rel="nofollow">had this one before</a>:<br>
      The masthead on the <a href="http://www.anothermag.com/" rel="nofollow">AnOther Magazine website</a> states that all its font design is by <a href="http://www.alias.uk.com/" rel="nofollow">Alias</a> (<a href="/wiki/Gareth%20Hague" class="freelinking" rel="nofollow">Gareth Hague</a> and <a href="/wiki/David%20James" class="freelinking" rel="nofollow">David James</a>). This typeface isn’t listed on their site, so I’m afraid it is custom.</p>
      <p>Related typefaces include <a href="http://www.pfadfinderei.com/font/nicola-kroita-zucka#/0" rel="nofollow">Nicola Kroita Zucka</a>, <a href="http://www.lineto.com/The+Fonts/Font+Categories/Script+Fonts/Easyscript/" rel="nofollow">Easyscript</a>, <a href="http://www.fontshop.com/fonts/downloads/letterbox/terital_ot/?&amp;sample_text=Poised%20in%20readiness" rel="nofollow">Terital</a>.<br>
      F</p>
