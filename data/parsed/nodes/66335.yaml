      <p>The typeface was designed for Issues 6 - 8 of Another Man, as a script version of our Ano typeface. Examples in use in the magazine at <a href="http://alias.dj/#/archive" title="http://alias.dj/#/archive">http://alias.dj/#/archive</a><br>
      Yes, it's unreleased.</p>
