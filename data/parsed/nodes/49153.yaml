    html: |-
      <p>I recall that back in the Seventies, there was an article by Ed in U&amp;lc. It explained the entire "Sound Spel" system. While I'm sure there were limits, as you point out, it did seem like it would be an improvement over the present system on some levels. And it would certainly be easier to learn. The thing that bothered me about it was that it would disconnect English from its roots. The thing about English is that it is a melange of other languages, which is also why its spelling is so inconsistent. Make the spelling consistent, and all that would be hidden. Or at least it would be harder to see. Also, how would you decide how to spell "either" and "tomato"?</p>
      <p>In spite of all that, I still find Ed's critique entertaining and clever.</p>
