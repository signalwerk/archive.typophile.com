    html: "<p>Great fun, but not terribly convincing, since the single syllable words don't present anything like the full extent of variation in English spelling. There's no way that English spelling can be made phonetic without extending the number of letters in our alphabet: there are simply too many sounds to be represented by too few letters. Even if one made the representation of short vowels consistent -- sum dum bum --, one would quickly run out of letters and have no way to represent other vowels, diphthongs, slurs, etc.</p>"
    html_clean: "<p>Great fun, but not terribly convincing, since the single syllable words don't present anything like the full extent of variation in English spelling. There's no way that English spelling can be made phonetic without extending the number of letters in our alphabet: there are simply too many sounds to be represented by too few letters. Even if one made the representation of short vowels consistent -- sum dum bum --, one would quickly run out of letters and have no way to represent other vowels, diphthongs, slurs, etc.</p>"
