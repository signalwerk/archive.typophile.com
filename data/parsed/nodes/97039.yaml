  html: |-
    <p>In 1962, the Dutch "Institute for Normalization" (NEN) published a guide for proper letter designs, both a sans and a serif. According to Middendorp,</p>
    <blockquote><p>The official digital version of the NEN 3225 alphabets has been made available at the type production Visualogik in 's-Hertogenbosch</p></blockquote>
    <p>("Dutch Type", p. 299).</p>
    <p>Are these fonts somewhere available?</p>
