      <p>A sample of the Sans in use in Amsterdam:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/vormbordleidseg2_5978.jpg"></div><br>
      (from <a href="http://www.kuitenbrouwer.nl" title="http://www.kuitenbrouwer.nl">http://www.kuitenbrouwer.nl</a>)<p></p>
      <p>Rems Blogt notes</p>
      <blockquote><p>Amsterdam street signs feature the sans-serif font described in the national norm NEN 3225:1962, which designer Sem Hartz had some influence on apparently. [..] (Also, public typeface design by committee, where have we heard that before?)</p></blockquote>
      <p>As the original document shows (p. viii), Hartz indeed was part of the committee:</p>
      <p>Ir. H.G.J. Schelling, architect NV. Nederlandsche Spoorwegen, Utrecht (chairman)<br>
      Prof. Dr. G.W. Ovink, estethic advisor Lettergieterij "Amsterdam" v/h Tetterode (secretary)<br>
      S.L. Hartz, graphic designer Joh.Enschede, Haarlem<br>
      Jan van Krimpen, typograph, Joh. Enschede, Haarlem<br>
      H.C. Warmelink, notary and type specialist, Amsterdam<br>
      Prof. Ir. C. Wegener Sleeswijk, architect Amsterdam</p>
