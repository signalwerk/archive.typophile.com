      <p>Actually, I'd be more interested in any other -- non-"official" -- interpretations!<br>
      A collegeau of mine owns the original 1962 guide, and in it the characters are printed on millimeter paper, so re-creating them should be quite easy. I'm wondering if anyone has "been there, done that" (possibly followed by "thrashed it").</p>
