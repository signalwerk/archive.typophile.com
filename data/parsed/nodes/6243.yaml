  html: '<p>The current Icograda poll asks: <br> <br>"Do designers design their websites to inform and invite clients, <br>or do they simply design them to impress their peers?" <br> <br>The current numbers are: <br>Inform: 11% <br>Attract clients: 36% <br>Impress their peers: 56% <br> <br>Maybe because designers are simply not that valuable in society? <br> <br>hhp <br></p>'
