    html: "<p>Y'no in our studio we were discussing that very fact the other day. We like to think of ourselves as secretive, very secretive, in fact the name of the studio is one no one, not even long-standing clients remember or can spell. Anywho, point is we're not into navel-gazing, and took our site down after we noticed a familiar IP # snooping around the portfolio and  informative strategy pages we had with messaging matrix tables, ect. days before a major proposal was due in town. We already knew they were bidding and found it suspicious. <br> <br>Perhaps one should ask how often do you check out your peers as well.</p>"
