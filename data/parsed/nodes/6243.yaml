    html: <p>Some interesting points. Yes, the web has moved  <br>beyond the brochure-ware of 1997 era sites. <br> <br>But why would you question a design portfolio on the  <br>web? I've landed many job interviews from my personal  <br>site. It doesn't replace a physical portfolio, but it's been  <br>invaluable. No, nobody goes to my site on their own  <br>and says, 'we want to interview you.' It's me sending an  <br>email cover letter and finishing it with a URL. In the end,  <br>it's a fairly easy way to 'prequalify.' <br> <br>Further, why would you question a designers motives  <br>for wanting to create a great site -- even if the  <br>underlying motive is to one-up his/her peers? It's not  <br>about showing off. It's about getting noticed; the same  <br>reasons we have design contests. Of course, in the  <br>end, it's about communicating who you are, which  <br>comes across, not only through the work you show, <br>but the way you show it.  <br></p>
