  - id: 44010
    user: 1258
    date: 2003-01-20T18:50:00
    date_raw: 20 Jan 2003 — 6:50pm
    votes: null
    html: <p>Trying to impress your peers isn't always such a bad idea, since design firms tend to hire each quite frequently when they have excess work and tight deadlines. <br> <br>In many cases, I'd rather do well-paid work for another design firm that understands the project and the medium, than for a clueless client who refuses to communicate well or let me educate him. <br> <br>In my experience at least, not much work comes from regular clients who see the designer's website.  In most cases, one gets jobs through footwork and personal connections.  A lot of successful design firms don't even have websites up. <br> <br>I'm talking about regular graphic design of course, and not type design. <br> <br>Paul</p>
