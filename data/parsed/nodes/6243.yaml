    html: <p>yes I agree with Keith. <br> <br>my point before being that an online representation of design work (unless its web design) seems like fluff to the entire basis and background of the internet. Sure yes, some people are bound to it. I was one of them during my telecommuting stint...but I don't need a site for that. <br> <br>I donno, I'm starting to hate the net more and more because people are proliferating it with junk. I don't think a design portfolio belongs on the net , its a matter of relevance (yes I'm a hypocrite and have one, its very old, never seen and coming down)...but unless your offering those pictures in part with Case studies/forums or experiments, there's hardly a point. A liability....umm I'm sure it depends what business your in and where. <br> <br>I guess my analogy here is that a commercial site seems like what a commercial is to television, and they just keep playing more and more and interrupt the show more frequently. Its cheap. <br></p>
