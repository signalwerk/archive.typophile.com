      <p>Got to <a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a><br>
      Look for the field "Stichwortsuche:" in the left column.<br>
      Type in: "Erstguß 196" (sorry for the ß)</p>
      <p>These fonts will be listed:<br>
      Schriftensammlung<br>
      -  Gruppe VI - Serifenlose Linear-Antiqua - Folio-Grotesk breitfett </p>
      <p>-  Gruppe VI - Serifenlose Linear-Antiqua - Headline </p>
