  html: <p>Does anyone know of a website, or book, any resource really, that displays and identifies some of the beautfully hand crafted thick and thin serif's of the sixties, a bit like the Monotype modern fonts or the one shown. If I search all the usual font foundries I get the same old stuff coming up again and again and if I seacrh for sixties fonts etc i get the usual rubbish trown up by tacky online PC font shops, nothing remotely crafted. Please help me find a better resource for beautilly crafted type of days gone by.</p><div class="imageWrap"><img src="http://typophile.com/files/font_6088.jpg"></div><p></p>
