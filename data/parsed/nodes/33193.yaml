      <p>Yeah, you gotta remember that the Sixties reintroduced a lot of styles that were popular in the late 1800s, primarily Art Nouveau. Look at Alphonse Mucha's illustrations of women with long, flowy hair wearing garlands and surrounded by flowers, and you'll see the similarities. Except in the 60s they bumped up the chroma of all their colors about 1000% so that everything vibrated... And Bodoni and Didot are contemporaries of Napoleon.</p>
      <p>I'd love to see the old beautiful types make a comeback, but it may be a while yet before they come back around. It reminds me of what my late grandfather said: "You keep that tie long enough and it'll come back in style!"</p>
