      <p>-  Gruppe IV - Klassizistische Antiqua - Madison-Antiqua halbfett </p>
      <p>-  Gruppe VI - Serifenlose Linear-Antiqua - Folio-Grotesk schmalhalbfett </p>
      <p>-  Gruppe III - Barock-Antiqua - Times halbfett </p>
      <p>-  Gruppe III - Barock-Antiqua - Times normal </p>
      <p>-  Gruppe III - Barock-Antiqua - Life fett </p>
      <p>-  Gruppe III - Barock-Antiqua - Life mager </p>
      <p>-  Gruppe VIII - Schreibschriften - Daphne </p>
      <p>-  Gruppe VIII - Schreibschriften - Typo-Skript </p>
      <p>-  Gruppe VIII - Schreibschriften - Compliment </p>
      <p>-  Gruppe VIII - Schreibschriften - Elegance </p>
      <p>-  Gruppe VIII - Schreibschriften - Privat </p>
      <p>-  Gruppe VIII - Schreibschriften - Jaguar </p>
      <p>-  Gruppe VII - Antiqua-Varianten - Diplomat </p>
      <p>Georg</p>
