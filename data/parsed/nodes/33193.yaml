    html: <p>One reason the sample you posted doesn't look like the garbage from the '60s is that it's not. It's Poster Bodoni, which Myfonts credits with being designed by Chauncey Griffith in 1929. The similar Ultra Bodoni is credited by Mac McGrew to Morris Benton in 1928.</p>
