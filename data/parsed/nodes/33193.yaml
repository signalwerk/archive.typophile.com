      <p>You have to remember that during the 60s, development time for a typeface was quite long. Nothing like the quick stuff done today. Most type used in the 60s was much older. You had the Bodonis, Clarendons, Cooper, and a big dose of AG in Europe as well.</p>
      <p>ChrisL</p>
