  html: "<p>Hi all, <br> <br>I've been working on a sans, not my first attempt at drawing letters, but my first serious one. It began life as a display face, but then I thought it looked nice as a text face so I've pushed it in that direction. <br> <br>There is no kerning, and I think the spacing might be a bit narrow (and possibly uneven in places). I also think I may change the A to a symmetrical design. And I'm not happy with the numerals, any opinions on them would be most appreciated. <br> <br>Any opinions/comments on the glyphs, spacing, suitability as a text face or anything else would be a great help to me as I continue to learn! <br> <br><a href=\"http://www.jordanharper.uklinux.net/nivelo_sample2.pdf\">PDF sample</a> <br> <br>EDIT: damn post thing not working can't upload images inline rubbish arrrgghhh! <br> <br><a href=\"http://www.jordanharper.co.uk/nivelo_sample2_1.gif\">Sample image 1</a> | <a href=\"http://www.jordanharper.co.uk/nivelo_sample2_2.gif\">Sample image 2</a> <br> <br>Many thanks in advance, <br> <br>Jordan</p>"
  html_clean: "<p>Hi all, <br> <br>I've been working on a sans, not my first attempt at drawing letters, but my first serious one. It began life as a display face, but then I thought it looked nice as a text face so I've pushed it in that direction. <br> <br>There is no kerning, and I think the spacing might be a bit narrow (and possibly uneven in places). I also think I may change the A to a symmetrical design. And I'm not happy with the numerals, any opinions on them would be most appreciated. <br> <br>Any opinions/comments on the glyphs, spacing, suitability as a text face or anything else would be a great help to me as I continue to learn! <br> <br><a href=\"http://www.jordanharper.uklinux.net/nivelo_sample2.pdf\" class=\"link-external\">PDF sample</a> <br> <br>EDIT: damn post thing not working can't upload images inline rubbish arrrgghhh! <br> <br><a href=\"http://www.jordanharper.co.uk/nivelo_sample2_1.gif\" class=\"link-external\">Sample image 1</a> | <a href=\"http://www.jordanharper.co.uk/nivelo_sample2_2.gif\" class=\"link-external\">Sample image 2</a> <br> <br>Many thanks in advance, <br> <br>Jordan</p>"
