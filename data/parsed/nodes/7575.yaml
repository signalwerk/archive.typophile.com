    html: <p>I've left this alone for a while for it to freshen up in my mind, and I've hit a bit of a  <br>wall. Is there some kind of trick for 'lightening' a double storey g in a low contrast  <br>typeface? <br> <br>At first, I thought making the width of the upper to lower storey join thinner (which is <br>where the darkness of the character is at it's worst), but it just looks wrong. Then I  <br>thought about thinning the upper storey strokes, and that looks wrong too. <br> <br>Does anyone have any suggestions/ideas on how I can lighten this character -- I'm  <br>presuming that everyone agrees with me that in the text setting it stands out and  <br>disturbs the colour of the page too much. <br> <br>Thanks, <br> <br>Jordan</p>
