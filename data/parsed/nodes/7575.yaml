    html: "<p>You're absolutely right David, my mistake; if only I could edit my post! (I've e-mailed support but if any moderator could do this for me I'd be most grateful!) <br> <br>I like the double storey g, but looking at the text setting I'm not sure if it doesn't cause too much of an uneveness in colour ... whether that aids or hinders it's readability is another debate altogether of course, but I'd be interested to hear any views on this. <br> <br>I rather liked my double storey a, but I couldn't work out whether it should overshoot the baseline (at the moment it sits atop) -- again, any opinions on that would be welcome. <br> <br>Thanks for taking the time and the nice words. <br> <br>Jordan <br> <br>PS just to clarify: <a href=\"http://type.nivelo.co.uk/nivelo_sample3.pdf\">PDF Sample</a> <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
