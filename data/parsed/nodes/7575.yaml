    html: <p>From a selling standpoint I wonder where the mixed rounded /square ears/terminals sits in todays type market, This thing has been done before, perhaps not on an identical design, but none the less it has been done (what hasn't?). I personally think it is a bit dated. The design is strong enough in my opinion to not have the added quirkiness of a mixed square/rounded element added. I look at and occasionally buy fonts from Lineto (who I consider very successful in this realm of type design), I would follow their steps and reduce to design to a more minimal- aesthetically speaking.  <br>The new v/w are an improvement. <br>Your numerals are fantastic btw.</p>
