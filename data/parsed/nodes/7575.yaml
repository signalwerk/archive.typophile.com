    html: "<p>Guess it's a bit complicated to comment on this kind of typeface, there are lots of similar fonts out there. <br> <br>I think you should make more subtle adjustments (like what you did on 'b' for example). Check this Underware <a href=\"http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=03#pictloader\"> link</a> about curves too. About the rounded finishes: I think the contrast between the straight and the rounded endings is too strong. Maybe you could reduce the radius of the round corners, or apply the rounded treatment to every stroke. <br> <br>HTH</p>"
    html_clean: "<p>Guess it's a bit complicated to comment on this kind of typeface, there are lots of similar fonts out there. <br> <br>I think you should make more subtle adjustments (like what you did on 'b' for example). Check this Underware <a href=\"http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=03#pictloader\" class=\"link-external\"> link</a> about curves too. About the rounded finishes: I think the contrast between the straight and the rounded endings is too strong. Maybe you could reduce the radius of the round corners, or apply the rounded treatment to every stroke. <br> <br>HTH</p>"
