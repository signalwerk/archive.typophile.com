      <p>OK, I'm soldiering on despite the lack of interest! <br> <br>More changes, I've made the bowls/curves on the b-p-d-q/n-u-h-y less geometric to give them a more 'readable' edge. <br> <br>I've settled on the alternative a and dropped all the litle ascenders/descenders I'd put on the m, n, u etc <br> <br>I'm beginning to be really happy with this design now, and I'd really appreciate any comments or opinions on it. This is my first serious attempt at creating a typeface, and while I've learnt a great deal along the way any more comments or crits would be most helpful. <br> <br>Thanks, <br> <br>Jordan <br></p>
