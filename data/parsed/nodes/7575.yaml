    html: <p>Well, nivelo is clearly not inspiring people to comment <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> despite this, I shall soldier on and post my fourth sample. I've not really had time to do much work on it, but I've been agonising (really more than one should over a typeface) over the shapes of the a, the n (in particular) and the b. <br> <br>Any opinions on the alternates shown in this pdf? I don't like the angular n, but I may be too close to it to make a decent judgement. <br> <br><a href="http://type.nivelo.co.uk/nivelo_sample4.pdf" target="_blank">http://type.nivelo.co.uk/nivelo_sample4.pdf</a> <br> <br>ANY feedback will be gladly welcomed. Thanks in advance, <br> <br>Jordan</p>
