      <p>Eduardo-- <br> <br>Thanks for taking the time to have a look <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I started this type thinking very geometrically about everything, and that any subtle deviation would compromise the geometric style I was going for. But I'm really happy with the changes I've made and I think you may be right -- moving away from the totally mathematical angle may give it the character (no pun intended) that it was lacking before. <br> <br>Do you have any (particular) suggestions for glyphs that may need a it of life? <br> <br>I think I know what you mean about the straight/curved contrast -- it does look a bit extreme in places, but I don't know quite how to solve that simply. Is it just a case of more beziers? <br> <br>Thanks again for the advice and opinion. <br> <br>Jordan <br> <br>P.S. I noticed this morning there was an error in the last PDF, the text set was actually in a previous version of the type, not the latest, so I've re-set it: <br> <br></p>
