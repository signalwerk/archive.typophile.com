      <p>I've made some changes based on some critique from elsewhere: <br> <br>
      </p><ul>
      <li>Double storey a and g added </li><li>stems added to n, m and u </li><li>A made symmetrical</li>
      </ul>
      <p></p><p><a href="http://www.type.nivelo.co.uk/nivelo_sample.pdf" target="_blank"> PDF Sample</a> <br> <br>I'm unsure of: <br> <br>
      </p><ul>
      <li>Spacing </li><li>UC V: should I just go for a conventional shape </li><li>Dots on i and j: should they be 'higher' </li><li>Question mark</li>
      </ul>
      <p></p><p><b>Background</b> (I forgot in my first post): <br> <br>My original idea, the thing that sparked me off with this design, was to design a fairly rigid, geometric style sans but with a slightly cursive touch. That touch is that all the strokes begin and end differently, representing the pen coming down and going up. All the 'beginnings' of strokes are flat ended and all the 'ends' are rounded. I think it makes it more readable at small sizes than most similar style types, <i>eg</i> DIN. <br> <br>Thanks in advance everyone, your opinions would really be appreciated. <br> <br>Jordan</p>
