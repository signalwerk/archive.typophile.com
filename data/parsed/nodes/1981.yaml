    html: <p>I also like the second, nice. But I am not sure about the fonts you are using for the text below, I think I would go for something softer and bolder (of course not as coco), "funnier" (I know it is not the word), something in the feel of Fountain's <a href="http://www.fountain.nu/catalogue/mayo.asp" target="_top">Mayo</a>, <a href="http://www.fountain.nu/catalogue/mustardo.asp" target="_top">Mustardo</a>, <a href="http://www.fountain.nu/catalogue/udo.asp" target="_top">Udo Wide</a> (something wrong with type setter for this one by the way), Garage's <a href="http://www.garagefonts.com/detail.html?sku=GF06100811P2" target="_top">Fono Expanded Unicase</a> (maybe too bold), or even a bold script, I don't know, something more ... I see your nitespots kind of serious. <br>Well just a thought Peter, I like your cocologo.</p>
