  html: <p>Hello fellow typophiles. <br> <br>I am working on a logo for a club.  They want simple, sexy, upscale, "fashionista", clean and streamlined. <br> <br>Here are two beginning ideas.  Working on a straightup sans (geometric) version which I think will take the cake, but wanted to see what you all thought about these secondary ideas. <br> <br>The first one I wasn't sure if I should connect the letterforms or not. Thoughts?  I think they read better by not connecting the bottom of the c to the o. <br> <br>The second one, I know needs some help on that connection, but it's somewhat tricky since the end of the C tapers in. <br> <br>These are 1st drafts, so tear em up. <br> <br>thanks</p>
