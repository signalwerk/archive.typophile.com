    date_raw: 10 Nov 2003 — 2:15pm
    date: 2003-11-10T14:15:00
    votes: null
    html: <p>Nice color suggestions there.  Tiffany, that is exactly what I am aiming for. <br> <br>Hmmm...so initial client feedback is that the coco font (dogma) looks too 'techy'. <br> <br>I can't see it.  To me, it's more classic than techy.  I was trying to find some background info on dogma to support my opinion.  Do you guys know what dogma is based on? <br> <br>Also, does this look techy to you? <br> <br>[side note, the word techy has so many connotations...I've had clients use that word in so many different contexts that I can't really gather what they mean by it anymore]</p>
  - id: 15818
    user_id: 2236
    user_name: squeeze
    user_path: null
    date_raw: 10 Nov 2003 — 4:47pm
    date: 2003-11-10T16:47:00
    votes: null
    html: "<p>Are you serious about the green? I don't see the correlation. On the west coast, late night ocean skies (especially right after a red/orange sunset) have that tint of red that Hrant was suggesting. I'll have to stand by the deep, red-tinted blue as my suggestion. <br> <br>\"Techy\"? NO WAY! First of all, you used the word \"opinion\". One lesson I learned well during my years of in-house design, is to eliminate opinions from the equation, if at all possible. Focus on objectives and solutions. <br> <br>You have two potential problems here: (1) your client doesn't want \"techy\" so you need to prove that the solutions you've shown aren't \"techy\", or (2) your client doesn't want what you've shown him, and he's incorrectly calling it \"techy\". Either way, I'd suggest collecting some real techno junkie examples and some great lounge neuvo samples similar to what you're doing. One obvious distinction I'd make is that most \"techy\" stuff doesn't have the curvilinear elements that your \"coco\" type has. <br> <br>If your client has any true concept of \"techy\", it's probably the \"nitespot\" type that has led him to this conclusion. Tiffany is right, though, \"nitespot\" doesn't look \"techy\" either. You might need to pull out the \"expert\" card here. \"Convince\" your client that it's not \"techy\" and it will work...that is, if you're confident enough that it will. <br> <br>Good luck! <br>Scott</p>"
