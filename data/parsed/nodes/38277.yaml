    votes: null
    html: |-
      <p>Many factories (Monotype UK, D. Stempel AG Germany, etc.) were converted over to war industry production for a time. Many older type designers stayed in their posts during the war. Younger ones, like Zapf, were drafted, although his lettering skills lead to his being assigned to a cartography office in occupied France. Some other designers were not as lucky; Klingspor's Rudo Spemann died in action. And Vojtěch Preissig was interned in the concentration camp at Dachau, where he died.</p>
      <p>By 1949, many English and German foundries (select foundries in both countries were bombed) seem to have back in business, at least that is what their period promotional materials seem to suggest.</p>
