    <p>For the life of me I can't find any. We're putting together an identity for a public figure, and he was born in 1949, and it would be a nice touch. I was hoping one of Zapfs faces would have come out then, or at least been started during '49, but it looks like a dead period between palatinio and optima.</p>
    <p>Preferably a sans, but I'll take a look at anything right now..</p>
