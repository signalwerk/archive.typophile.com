    html: |-
      <p>Any edition of <em>An A-Z of Type Designers</em> is a good resource for this... Following the name of each type designer is a list of his or her typefaces, followed by the year(s) of development or release.</p>
      <p>On page 58 of the latest edition: Trade Gothic, 1948-60 (Jackson Burke)<br>
      On page 59: Normandia, 1946-9 (Alessandro Butti, with Aldo Novarese)<br>
      On page 74: Diethelm-Antiqua, 1948-50 (Walter J. Diethelm)<br>
      On page 76: Electra, 1935-49 (William Addison Dwiggins)<br>
      On page 101: Emergo, 1948-53 (Sem L. Hartz)</p>
      <p>Ah, check this out, on page 111: Savoie, 1949 (Marcel Jacno)</p>
      <p>The book has 200 pages, I'm sure there's some more typefaces to be found! :-)</p>
      <p>Another good resource might be Sebastian Carter's <em>Twentieth Century Type Designers</em>.</p>
