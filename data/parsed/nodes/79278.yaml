    <p>Hello everybody!</p>
    <p>I'm looking for the good sites which have many and many open source fonts which are under GPL for allowing me to modify and project the fonts for Ubuntu themes. </p>
    <p>EULA, CC BY-NC-ND 3.0 and CC BY-ND 3.0 s-u-c-k!</p>
    <p>I need the open source and free fonts for projecting the Gnome and GTK themes for Ubuntu. </p>
    <p>Do you know some good sites of many and many open source and GPL-like fonts?</p>
    <p>Thank you!</p>
    <p>Kevin</p>
