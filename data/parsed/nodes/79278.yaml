    html: |-
      <p>See: <a href="http://www.openfontlibrary.org/wiki/Existing_Free_Fonts">http://www.openfontlibrary.org/wiki/Existing_Free_Fonts</a></p>
      <p>And go to the final page and see "Freeware Fonts"</p>
      <p>No, no, no.</p>
      <p>All these typodesigners, as Ray Larabie, Klein, and other don't allow to distribute, re-distribute and to derivate or remix their works, according their EULA. They don't want and won't hear the OpenFontLibrary's persuasion. These fonts are closed source while Linux is an open source software. </p>
      <p>I found the Ray Larabie and other proprietary typodesigners freeware fonts housed on Ubuntu software center. Then why did Ubuntu house the Ray Larabie and other proprietary typodesigners <strong>closed source</strong> freeware fonts on its software center?</p>
      <p>I'm against the house of Ray Larabie and other proprietary typodesigners fonts on Ubuntu because they're closed source! The closed source fonts, although are freeware, mustn't be housed on Ubuntu or any distros of Linux!</p>
      <p>Why?</p>
      <p>Because the users of Linux know what open source is and Linux is open source, if they know, they'll think all which are on Ubuntu are open source, then they'll modify and [re-]distribute the Ray Larabie and other proprietary typodesigners fonts without realizing that the derived works and [re-]distribution aren't allowed by Ray Larabie and  other proprietary typodesigners!</p>
      <p>I know you would tell us that there's description in fonts, but not all will view the fonts, not all know English, know reading in English and what EULA is!</p>
      <p>I know you would say they can take the free-ware fonts on Ubuntu but they can't derive your works for projects and themes of Ubuntu or other. But if they want to modify? The closed source fonts mustn't be housed on any distros of Linux, only the open source fonts must be housed on Ubuntu or other distros of Linux because the users want to modify. </p>
      <p>Then I'm against the house of closed source free-fonts on Ubuntu!</p>
      <p>I'm fundamentalist and fanatic Linuxer.</p>
