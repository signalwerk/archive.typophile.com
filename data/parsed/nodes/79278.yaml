      <p>Té Rowan, Dafont and Fontsquirrel aren't sites of open source fonts, are just sites of freeware fonts. Open source and freeware are different things. Open source is GPL-like e CC BY-SA-like, or I mean open source allows to modify, distribute and redistribute. GPL and CC BY-SA are different of EULA which doesn't allow to modify the fonts. </p>
      <p>Many fonts of Dafont and Fontsquirrel are under EULA and not under GPL or CC-BY-SA.</p>
