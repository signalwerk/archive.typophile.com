      <blockquote><p><a href="http://www.google.com/webfonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">The Google Font Directory</a> lets you browse all the fonts available via the Google Font API. All fonts in the directory are available for use on your website under an open source license and are served by Google servers.</p></blockquote>
      <p>The fonts are also available for download. A monetary donation is requested but not required at time of download.<br>
      Most are licensed under SIL or Apache terms, but there are other licenses used as well. Check each font's detailed information page for its specific license.</p>
