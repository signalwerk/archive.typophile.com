    html: <p>Thanks! I think the body is from the Bipolar family (<a href="http://www.myfonts.com/fonts/versus-twin/bipolar/" title="http://www.myfonts.com/fonts/versus-twin/bipolar/">http://www.myfonts.com/fonts/versus-twin/bipolar/</a>) as well. Thanks for the help!</p>
