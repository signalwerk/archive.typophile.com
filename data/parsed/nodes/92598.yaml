    date: 2012-04-30T15:08:00
    votes: null
    html: <p>‘YOU’VE WON’ is probably Bipolar, indeed. I’m pretty convinced, however, that the small text is set in Fakir. Bipolar doesn’t even have a three-storey ‘g’. And try to compare some distinctive characters like ‘C’, ‘N’, ‘A’, ‘w’ or ‘y’. As I said, it’s difficult to tell at that size, but Fakir seems close at least.</p>
