  html: |-
    <p>I'm prototyping a cursive font where, at least on paper, any word with a "t" in it has the crossbar on the t extended to the left and right over letters as long as this fits; verticals in h, l, d, etc. will cut off the bar, so something like:</p>
    <p><img src="http://pomax.github.io/Cursive-swash-typeface/images/01.jpg"></p>
    <p>becomes something like:</p>
    <p><img src="http://pomax.github.io/Cursive-swash-typeface/images/02.jpg"></p>
    <p>I'm not entirely sure how to implement this, though. I was thinking of using many-to-many GSUB rules based on glyph classes, but no matter how I look at it, it turns into needing recursive GSUB behaviour...</p>
    <p>1) t [low] -&gt;[t with bar that continues right]  [low with left-connecting overbar]<br>
    2) [low with left-connecting overbar] [low] -&gt;[low with fully connecting overbar] [low with left-connecting overbar]<br>
    3) [low with left-connecting overbar] [high] -&gt; [low with fully connecting overbar] [high with lef-connecting overbar stub]</p>
    <p>and rule 2 would have to recursively kick in... and that's just in one direction.</p>
    <p>Has anyone every tried something like this before? Or does anyone have thoughts on how this might be achieved?</p>
