      <p>Another option I was considering was a substitution for every low class glyph with a macron counterpart, so that [t] + [low] contextually becomes [t-extended] + [low with macro], then simply have a huge block that goes [low macron] + a → [same] + ā, and repeat the block a stupid number of times to get the "recursive" length desired, with terminations like ā + l → [l with a left-terminator], etc.</p>
      <p>But they're both not ideal solutions =/</p>
