    html: <p>Alan Greene and Mark van Bronkhorst's <a href="http://www.mvbfonts.com/html/fonts/sirenne/pk_sirenne_text.htm" target="_blank">Sirenne</a> might fit. It's based on old engraved lettering like you might see on old maps. It has three optical sizes, too.</p>
