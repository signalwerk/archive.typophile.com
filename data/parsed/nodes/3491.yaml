  html: <p>Hi Guys, <br> <br>Thanks in advance for any help/advice given. <br> <br>I am designing a Photo Album for the Past President of CPA Australia (the largest business organisation in the southern hemisphere with well over 100,000 members). It is to commemorate his year as president and include photos of his journeys and attendances at conferences in Australia and Asia. <br> <br>He loves sailing and my concept is to use Maps of Australia and Asia to made to look a little antique. <br> <br>Any idea of fonts that might suit this purpose (or any ideas for where I might find examples of cool old maps?) <br> <br>Thanks again!</p>
  html_clean: <p>Hi Guys, <br> <br>Thanks in advance for any help/advice given. <br> <br>I am designing a Photo Album for the Past President of CPA Australia (the largest business organisation in the southern hemisphere with well over 100,000 members). It is to commemorate his year as president and include photos of his journeys and attendances at conferences in Australia and Asia. <br> <br>He loves sailing and my concept is to use Maps of Australia and Asia to made to look a little antique. <br> <br>Any idea of fonts that might suit this purpose (or any ideas for where I might find examples of cool old maps?) <br> <br>Thanks again!</p>
