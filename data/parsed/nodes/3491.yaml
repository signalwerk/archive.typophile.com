    html: <p>Daniel, <br> <br>Up yer scuppers with the "fake antique" offense, avoid anchors at all cost. Done to death.  <br> <br>Since this is a "one off" it is well suited for letterpress. A "one off " on a Vandercook can give you superior results without inhaling reams of paper. <br> <br>I recommend fine hand made paper, or a pedigree watercolor stock. Good laundry is always important. Something acid free. Remember�no acid. Remember what happens to photographs. <br> <br>Have it set by hand, or set on by Monotype. <br> <br>Since you are in Melbourne talk to these fine folk. <br> <br><a href="http://home.vicnet.net.au/~typo/collect/typemach/monocomp.htm" target="_blank">http://home.vicnet.net.au/~typo/collect/typemach/monocomp.htm</a> <br> <br>Pick a typeface, probably Caslon Oldstyle, if they have the matrices. <br> <br><a href="http://lanstontype.com/CaslonFountEight.html" target="_blank">http://lanstontype.com/CaslonFountEight.html</a> <br> <br>Talk to bookbinder, see what he can do with tradtional sailmaker's cloth, and twine. Avoid gold stamping. <br> <br>Quarter bound with natural leather, sailmakers cloth. If your binder has a problem with it,  talk to your sailmaker. <br> <br>Use the right materials, keep it understated, don't take it too far, don't get corny. <br> <br>I am a bit of an "old gaffer" myself. You want to hoist some sails? <br> <br><a href="http://lanstontype.com/HelsinkiShip.html" target="_blank">http://lanstontype.com/HelsinkiShip.html</a> <br><a href="http://lanstontype.com/BowspritCanvasIron.html" target="_blank">http://lanstontype.com/BowspritCanvasIron.html</a> <br> <br></p>
