      <p>Stanley Hess, in his form-based classification system (The Modification of Letterforms, 1971), describes faces such as Frutiger as having “unfolded” curves — this is the opposite of having a small aperture, and is defined in relation to stroke shape, not the counter or negative space.</p>
      <p>By his terminology, Futura and Gill Sans are in the same “unfolded” category as Frutiger.</p>
      <p>And yet, the unfoldedness in Frutiger seems more to do with having a compact letter form, and this design rationale continues in the Meta genre of semi-condensed, 4-letter name, sans serifs.</p>
      <p>So I think that we/Robert Bringhurst need a new “crossover” term to describe this contemporary type genre. </p>
      <p>As Bringhurst’s method is to ally type genres with dominant art-historical movements of the type’s era, “Post-modernist” would seem to be the obvious choice. The main problem with that is we tend to think of grunge and deconstructed typefaces as being the quintessentially Post-modern forms.</p>
      <p>Will the true PoMo please step forward?!</p>
