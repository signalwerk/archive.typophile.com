    <p>In the type classif. system published by <a href="/wiki/Robert%252BBringhurst" class="wiki">Bringhurst</a> in <em><a href="/wiki/elements_of_typographic_style" class="wiki">Elements</a></em> and his article in Serif #1, “<a href="/wiki/Grotesque" class="wiki">Grotesque</a>” faces like <a href="/wiki/Helvetica" class="wiki">Helvetica</a>, <a href="/wiki/Univers" class="wiki">Univers</a> and <a href="/wiki/Akzidenz%252BGrotesque" class="wiki-create">Akzidenz</a> fall under “Realist Roman”. It seems one of the characteristics of Realists is small aperture (don’t know if that’s the correct english term, sorry), but faces such <a href="/wiki/Frutiger" class="wiki">Frutiger</a> have a very large aperture, and while they are <a href="/wiki/monoline" class="wiki-create">monoline</a> <a href="/wiki/sans%252Bserif" class="wiki">sans</a> I feel they are different design concept than “grotesques”. </p>
    <p>I’d like to know how other people feel about this. Are Helvetica and Frutiger to be in the same “package” (as has been in other type classification systems) or does the latter need another “compartment”, along with other similarly open/legible/signage-oriented sans?</p>
