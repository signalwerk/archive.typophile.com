      <p>Nick, I hadn’t checked EofTS for Bringhurst’s idea of PostModern recently.<br>
      So yes, he’s matching a contemporary type genre to the obvious main art-theory movement.<br>
      Not a good fit for the faces he chooses, which just seem to be synthetically traditional.</p>
      <p>A more thorough theoretical understanding of Post-modernism is well established in typography, in relation to fonts like Dead History, Caustic Biomorph, and Carter’s Walker typeface. So it would be hard to categorize types as prosaic as Frutiger as Postmodern.</p>
