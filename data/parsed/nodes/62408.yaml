    <p>I'm currently working a menu for a shop called Magazine's and Coffee and needing a few type suggestions.</p>
    <p>The theme of my menu is that of TWA Moonliner due to the shop when it was still open was below the TWA building in KCMO.  Any suggestions on supportive type I could use for the menu, I was using Futura but now not really liking it </p>
    <p>I am also on a very small budget for this project, it being a re-do for school project. for portfolio.</p>
    <p>Thanks</p>
