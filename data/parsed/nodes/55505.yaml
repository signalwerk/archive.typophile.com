      <p><cite>Adam's just seemed easier to understand. I'm putting together a small FontLab tutorial for in-house use where I work and thought I would include some useful links.</cite></p>
      <p>I am aware of this, and the reason is that I am more interested in dependencies than in a single solution which in my opinion does not exist.<br>
      Is my observation (from your previous posts and work you showed) correct that you mostly do single- or two-style families? In this case you could easily set up a very simple naming how-to or chart by yourself, and you would not even need to mention the Preferred Family/Style name fields since these could be left empty.</p>
      <p>Good to see the FLS5 Font Family Naming document back online! I hope the others too will be available soon.<br>
      (Adam, I notice the new terminology including "Typo Family Name" and wonder why you don't stick to FLS5's and AFDKO MakeOTF manual's "Preferred Family Name". This better expresses what you mean.)</p>
    html_clean: |-
      <p><cite>Adam's just seemed easier to understand. I'm putting together a small FontLab tutorial for in-house use where I work and thought I would include some useful links.</cite></p>
      <p>I am aware of this, and the reason is that I am more interested in dependencies than in a single solution which in my opinion does not exist.<br>
