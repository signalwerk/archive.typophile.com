      <p>Looking pretty nice. A couple of things that stand out to my eye: That lowercase r is looking a bit too wide. The m could be wider, the space between f and u in Beautiful looks too wide and the right leg on the capital R could be dropped a little lower.</p>
      <p>Best of luck with the rest of it!</p>
