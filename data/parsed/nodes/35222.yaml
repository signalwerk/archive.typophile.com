  html: |-
    <p>I've no previous experience of creating a font file.<br>
    However, I need to create a font file for 9 icons.<br>
    What would be the most cost effective way if I wanted to do it myself?<br>
    Is there a cheap software where I can specify letter spacing/kerning<br>
    to set a distance between the icons? (Perferably Mac OSX software)<br>
    Icons are drawn ready in Adobe Illustrator.</p>
    <p>Many thanks</p>
