    html: '<p>You can try <a class="freelinking external" href="http://www.fontforge.sourceforge.net" rel="nofollow">FontForge</a>: it is free and very powerful. I know very few about Mac, but, AFAIK, it works well under Mac OS X (you must have the X11 server installed in order to run FontForge).</p>'
