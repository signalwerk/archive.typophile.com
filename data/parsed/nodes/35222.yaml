      <p>You can also try saving your images as EPS rather than SVG. But of course I don't know what your images look like: it might be possible that they are indeed more complex than any font editing software can understand.</p>
      <p>If nothing else helps, you can subscribe to the <a href="/wiki/https%3A/%252Flists.sourceforge.net/lists/listinfo/fontforge-users" class="freelinking" rel="nofollow">fontforge-users mailing list</a> and ask about your problem there.</p>
