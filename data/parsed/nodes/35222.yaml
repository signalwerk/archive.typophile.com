    html: |-
      <p>With just 9 icons, I guess you can import them individually. Save each one in a .svg file. Then in Fontforge, you select the slot where you want to put the icon, open it (say double click) and then in File &gt; Import you select "SVG" instead of "Image" and then click the file you want to import.</p>
      <p>[edit] On the <a href="http://fontforge.sourceforge.net/" rel="nofollow">fontforge site</a> there is a pdf tutorial (second bullet).</p>
