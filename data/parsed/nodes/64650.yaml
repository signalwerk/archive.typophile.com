    html: <p>I think in the case of Kabel/ITC Kabel Adobe is just reselling Linotype’s versions and doesn’t have an actual version of its own. Concerning x-height there are basically two Kabels. The original one by Koch and the one from ITC with the typical large x-height, which seems to be the one in the sample.</p>
