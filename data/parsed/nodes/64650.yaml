    html: <p>While Adobe’s version of Kabel has a much smaller x-height, ITC Kabel Book (also from Adobe) appears to be identical to the font on the canisters in the photo... except for the tail on the l, as you note. However, some fonts come with alternate versions of some characters - and sometimes a font will be used for a purpose like advertising, and an individual character in the font will be altered.</p>
