      <p>Knowing what operating system(s) and language(s) you are working with would be helpful. Or is it for a web form? Or...?</p>
      <p>But to answer more generally, the answer is "it depends," and what it depends on can vary by operating system and font technology. Doubtless someone else with more expertise in this specific area will come along and give you a more useful answer, but perhaps this can be a start. </p>
      <p>Typically programmers rely on system APIs for this sort of thing, and ignore all the details. Or they use cross-platform open source libraries to handle it. Or they are working with some other environment (e.g. Java, Python, something) that has platform-independent language-processing support. The various operating systems and text-handling libraries have largely "solved" this problem for Arabic and most other common languages.</p>
      <p>Section 8.2 of the Unicode standard specifies how "shaping" (the general term for this sort of glyph substitution and positioning) is supposed to work for Arabic. However, Unicode encoding alone does not solve the problem, as Unicode assumes that a lot of the smarts comes from somewhere else.</p>
      <p>Text-processing systems work in conjunction with specific kinds of fonts. So for example, a given system might work with any Unicode-encoded Arabic TTF or OTF font, or it might require OpenType or AAT tables supporting the language processing.</p>
      <p>Cheers,</p>
      <p>T</p>
