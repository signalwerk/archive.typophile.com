      <p>جمیل خان صاحب<br>
      السلام علیكم </p>
      <p>فانٹ بناتے وقت اس كی ایم ایس وولٹ میں پروگرامنت كی جاتی ہے كہ جب آپ ب مفرد پریس كرو تو ب مفرد ہی آئے اور جب ب مفرد كے ساتھ كوئی دوسرا لفظ لكھا جائے تو وہ ب مفرد كے بجائے ب انٹ میں چینج ہو جائے اور اسی طرح سے تمام حروف كو یہ پروگرامنگ دی جاتی ہے اور تمام نسخ میں تمام حروف كی تین تین اشكال موجود ہوتی ہیں مثلا ب مفرد كی تین اشكال ہیں<br>
      ب انٹ<br>
      ب مڈی<br>
      ب فنا<br>
      چند حروف كی دو دو اشكال ہوتی ہیں مثلا<br>
      دال رے اور واو كی دو دو اشكال ہیں<br>
      دال مفرد اور<br>
      دال فنا<br>
      ان تمام الفاظ كی اور مفرد اشكال ہیں ان كو یونی كوڈ ولیدی دی جاتی ہے<br>
      مثلا ب مفرد كی ویلو ہے<br>
      U+0628<br>
      وولٹ میں كہا جاتا ہے كہ<br>
      U+0628 جب لكھا جائے تو<br>
      اس كو ب انٹ لكھ دینا<br>
      اسی طرح سے<br>
      جب دو الفاظ كے درمان میں<br>
      U+0628<br>
      مندرجہ بالا كوڈ لكھاجائے تو<br>
      ب مڈی دے دینا<br>
      اور جب یہی تین یا چار یا پانچ حروف كے آخر میں ٹائپ ہو تو<br>
      U+0628<br>
      تو تم اس كو<br>
      ب فنا كی شكل دے دینا<br>
      و السلام<br>
      سید ضیائ الحسن واسطی</p>
