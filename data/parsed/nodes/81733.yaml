      <p>I have designed an Arabization system for AutoCAD long time ago. The system uses a program that I developed in AutoCAD's AutoLISP programming language and performs glyph catenation and character replacement using a "lookup table" algorithm. You may wish to browse through the lisp file included in the Arabization package which you can download from <a class="freelinking external" href="http://www.automason.com/download/arbtools.zip" rel="nofollow">here</a>. The package also has documentation in English.</p>
      <p>If you read Arabic, you may also wish to read the <a class="freelinking external" href="http://arabictype.wordpress.com/2010/04/09/autocad-arabization" rel="nofollow"> article about the system on my blog</a>.</p>
