    html: <p>I work in Osx and I use OpenType layout tables to generate arabic fonts, First I ship the font in fontlab (OSX) then in VOLT (windows) I add the Opentype features and it works pretty fine (both on mac and windows). AAT seems to be much flexible but I couldn't find an easy way to use it. Programming makes me nauseated, It doesn't mean that I don't tweak the result of VOLT features, because I do. but AAT isn't well documented and doesn't has a designer friendly tool.</p>
