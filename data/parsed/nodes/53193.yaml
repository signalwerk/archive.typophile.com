  html: |-
    <p>Hi! How's it going! I'm excited. Because my first font <a class="freelinking external" href="http://www.veer.com/search/results.aspx?keyword=Newt%20Serif&amp;producttype=TYP%2CIMG%2CILL" rel="nofollow">is now on the market</a> with Veer!</p>
    <p>I developed Newt Serif with the help of the Typophile Critique forum (<a class="freelinking external" href="http://www.typophile.com/salamander" rel="nofollow">here</a>). After a long time, it's finally come to fruition. The character set includes Basic Latin, Latin-1, and Latin Extended-A codepages, along with a few other characters here and there. There are four weights -- Light, Regular, Demi, and Bold, each with an italic. Thanks for the help, everyone! I hope you like it.</p>
  html_clean: |-
    <p>Hi! How's it going! I'm excited. Because my first font <a class="freelinking external link-external" href="http://www.veer.com/search/results.aspx?keyword=Newt%20Serif&amp;producttype=TYP%2CIMG%2CILL" rel="nofollow">is now on the market</a> with Veer!</p>
    <p>I developed Newt Serif with the help of the Typophile Critique forum (<a class="freelinking external link-lost" href="http://www.typophile.com/salamander" rel="nofollow">here</a>). After a long time, it's finally come to fruition. The character set includes Basic Latin, Latin-1, and Latin Extended-A codepages, along with a few other characters here and there. There are four weights -- Light, Regular, Demi, and Bold, each with an italic. Thanks for the help, everyone! I hope you like it.</p>
