    html: |-
      <p><em>(...) but it must have been originally drawn based on some font.</em></p>
      <p>Not necessarily. Some of the models used by sign painters had absolutely nothing to do with fonts -- typefaces used in the printing industry. As those models may have had no equivalent with printing types, they could possibly be unknown to that (our) community. The same problem exists with alphabets for rubber stamps, license plates, road signage, sewing and other specific applications.</p>
