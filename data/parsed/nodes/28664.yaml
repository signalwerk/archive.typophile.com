    html: |-
      <p>Even if it wasnt a font and it was a model-- I wish I could find that model...</p>
      <p>The wedge shaped serifs, the point at the top of the A and the way the serifs on the E the T and the L point outwards-- remind me of the font Della Robia-- which was designed in 1902-- and the Serjeant Gallery was built in 1912. But Della Robia is much more expanded.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DellaRobbia_5043.gif"></div><p></p>
