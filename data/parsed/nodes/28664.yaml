    <p>This sign appears on an art gallery building that was built in 1912 called the Serjeant gallery in Wanganui New Zealand.<br>
    I am pretty sure the Rs and the J were customized-- but what typeface or font do you think was used as a reference to make the sign?</p>
    <p>cheers</p>
