  html: |-
    <p>This brand is popular in Spain, especially on the notheast. It's a brand about cacao milkshakes.</p>
    <p>Here i have some images of the main logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo_6325.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/proj_logo_648_3440.jpg"></div><p></p>
    <p>And there is one with the brand emblem, a boy with a bottle and a bag:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/project_cover_3672.jpg"></div><p></p>
    <p>Thank you all, guys!</p>
    <p>EDIT:<br>
    You are right, guys. It's a similar variant of the "Coca-Cola" font.<br>
    On the "kthomps5" links you can find Coca-Cola font is a combination of "American Pop One" and "American Pop Two".<br>
    In my case, Cacaolat is only American Pop One, corresponding at the "Coca" from "Coca-Cola", so the font has been found.<br>
    Thank you all, and thank you kthomps5 for the links!</p>
