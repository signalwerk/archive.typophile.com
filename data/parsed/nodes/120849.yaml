    html: |-
      <p>Most likely custom calligraphy/type design, based on the historical labels:<br>
      <a href="http://cacaolat.es/en/historia/" title="http://cacaolat.es/en/historia/">http://cacaolat.es/en/historia/</a></p>
      <p>The style is often referred to these days as baseball script, and some of the modern typefaces in that style include "tail" versions of letters:<br>
      <a href="http://www.myfonts.com/search/baseball+script/fonts/#item_65" title="http://www.myfonts.com/search/baseball+script/fonts/#item_65">http://www.myfonts.com/search/baseball+script/fonts/#item_65</a></p>
      <p>Here are a few typefaces from the list that seem most similar to me:<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/american-pop/" title="http://www.myfonts.com/fonts/fontmesa/american-pop/">http://www.myfonts.com/fonts/fontmesa/american-pop/</a><br>
      <a href="http://www.myfonts.com/fonts/flat-it/machiarge/machiarge/glyphs.html" title="http://www.myfonts.com/fonts/flat-it/machiarge/machiarge/glyphs.html">http://www.myfonts.com/fonts/flat-it/machiarge/machiarge/glyphs.html</a><br>
      <a href="http://www.myfonts.com/fonts/fontmesa/brewmaster/" title="http://www.myfonts.com/fonts/fontmesa/brewmaster/">http://www.myfonts.com/fonts/fontmesa/brewmaster/</a></p>
