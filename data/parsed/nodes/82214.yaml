  html: |-
    <p>I have found an interesting (in my unprofessional opinion) font by Storm Type Foundries. It is the only free font by the company (it is free because the original customer rejected it last minute). It is called Lido STF, and is designed as a replacement for Times. </p>
    <p><a href="http://new.myfonts.com/fonts/storm/lido-stf/" title="http://new.myfonts.com/fonts/storm/lido-stf/">http://new.myfonts.com/fonts/storm/lido-stf/</a></p>
    <p>I have found that on-screen it looks a bit quirky but prints incredibly well. It takes up about as much space as Times New Roman horizontally, but is vertically taller, so works well at small sizes. </p>
    <p>What is your opinion of this font?</p>
  html_clean: |-
