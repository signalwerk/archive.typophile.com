    html: <p>I am thinking of possibly using this for the text of a Latin-language Bible (the condensed version, I think, makes a good title font as it is taller). It is simple enough not to be distracting from the text itself and legible enough to be used at a small size to decrease material cost. It is not, however, so simple as to be boring. I stumbled upon this font almost on accident, to be honest.</p>
