    html: |-
      <p>Looking at Mac McGrew's book of American Metal Typefaces there is a bold version of Goudy Oldstyle that was designed by Morris Benton between 1916 - 1919 to go with the Goudy-designed typeface. The swash M is a slanted version of what's on your card. The Roman version of Goudy Bold type has the same g and the i's have the same diamond shaped dots. Its 'n' matches the normal n on your card. The swash 'n' doesn't look like anything from the typeface samples in this book. It does resemble Bookman swash (in the <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000085#characters" rel="nofollow">version done by Jason Walcott</a> of Jukebox), and that even has a similar M, although the swash elements are not right. I think Jason's version is based on an older design for Bookman than the ITC version.</p>
      <p>- Mike Yanega</p>
