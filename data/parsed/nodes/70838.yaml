    html: |-
      <p>Goudytype is shown in the McGrew book, and the M is similar, but not identical. it has only swash capitals, no lower case swash letters.</p>
      <p>I looked again at Goudy Bold Italic, the ATF face that has the swash letters. The M is closer to the sample above, but still not identical (the lower curl is bigger than the sample posted), AND it is slanted. It does have a swash lower case, but the tails on the letters, like the m and n, are along the baseline, not below it.</p>
      <p>It may be that the original was drawn using Goudy/Bookman samples as 'inspiration'.</p>
      <p>- Mike Yanega</p>
