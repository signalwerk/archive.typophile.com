    date: 2011-10-16T16:14:00
    date_raw: 16 Oct 2011 — 4:14pm
    votes: null
    html: <p>The direction the flourish comes off the b is contrary to how a scribe would pull a flourish from a lowercase b. That's why it seems off. You could have it come into the downstroke of the b from the natural direction of writing (R to L; Top to Bottom) and still loop around to center the flourish. That being said the first sample is better; in that the top and bottom flourishes work together better.</p>
