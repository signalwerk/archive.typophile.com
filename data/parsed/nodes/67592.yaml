    html: |-
      <p>Lineto's <strong>Le Corbusier</strong> is indeed drawn in the style of a »Didone« or Modernist/Romantic letter.</p>
      <dl>
      <dt>For a <strong>Bodoni</strong> that is suitable for extended text, you have three good choices:</dt>
      <dd><a class="freelinking external" href="http://www.stonetypefoundry.com/itcbodoniovervie.html" rel="nofollow">ITC Bodoni</a></dd>
      <dd><a class="freelinking external" href="http://www.linotype.com/118/bauerbodoni-family.html" rel="nofollow">Bauer Bodoni</a></dd>
      <dd><a class="freelinking external" href="http://www.bertholdtypes.com/bq_library/290005.html" rel="nofollow">Berthold Bodoni</a></dd>
      </dl>
      <p>The last two date from 1924–26 and 1930, respectively; a period when Le Corbusier was active.</p>
      <p>Other Romantic faces would include <strong>Didot</strong> and <strong>Walbaum</strong>.</p>
      <p>However, you specifically mentioned that you are looking for a sans serif. Here the task is more difficult, but it is not inconceivable to pair a Romantic Modernist serif with a Geometric Modernist sans serif such as <strong>Futura</strong> (c. 1925) or even <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/memphis/" rel="nofollow">Memphis</a></strong> (c. 1929).</p>
      <p>Better still, <strong><a class="freelinking external" href="http://www.bertholdtypes.com/bq_library/AkzidenzGrotesk.html" rel="nofollow">Akzidenz Grotesk</a></strong> traces its geneology to the letterforms of Walbaum, and you may have an easier time harmonizing it with Le Corbusier.</p>
