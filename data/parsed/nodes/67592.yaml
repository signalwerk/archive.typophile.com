    <p>hello typophile!<br>
    i am working to a project in which i have to use a logo done with le corbusier oldface:</p>
    <p><a class="freelinking external" href="http://www.lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Le+Corbusier/Oldface/" rel="nofollow">http://www.lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Le+Corbusier/Oldface/</a></p>
    <p>the client doesn't have any rule at all for corporate image so i was wondering about the choice of a text font to use with le corbusier (that i think to extend as display font for the project).<br>
    my idea is to use a sans serif, relatively modern font to "isolate" titles and to stay neutral also because of the great strenght of the primary font, but all suggestions are really appreciated.<br>
    thanks a lot, bye</p>
