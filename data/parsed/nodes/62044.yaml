      <p>The only problem I can see is that the shape makes the accents really tall and much taller than, e.g., the tildes.</p>
      <p>Does the font include lowercase as well? (Accents are often steeper/taller on lowercase letters and flatter/lower on uppercase letters lest they take up too much space and require too much leading.)</p>
