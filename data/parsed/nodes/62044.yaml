    <p>New to type design. Question:</p>
    <p>I rarely, if at all, use accented characters (I'm a typical American). I'm creating a san serif font and noted, on other sans serif fonts, accent glyphs such as used for grave and circumflex characters have a "wedge" shape. Of course, the circumflex is two wedges coming together at the apex.</p>
    <p>Can accent glyphs be the same width at the bottom as they are at the apex? A grave character, for instance, would look like a hyphen at an angle instead of a wedge at an angle.</p>
    <p>I haven't a clue. I want to go with the "hyphen at an angle" look if that's acceptable in accent glyph shapes.</p>
    <p>Regards,</p>
    <p>dglen</p>
