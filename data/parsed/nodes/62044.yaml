    html: <p>If by ‘hyphen at an angle’ you mean a rotated hyphen, that would be quite unusual for a normal sans-serif grave accent. I assume you are referring to a shape with horizontal top and bottom lines of the same length (a parallelogram), in which case I agree with cuttlefish.</p>
