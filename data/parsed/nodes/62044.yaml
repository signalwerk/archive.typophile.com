    html: <p>Most often acute and grave accents are tapered at the lower end, but if an even stroke looks best with your design, go for it. There is precedent for those as well. As far as I can tell, the distinction is a matter of taste.</p>
    html_clean: <p>Most often acute and grave accents are tapered at the lower end, but if an even stroke looks best with your design, go for it. There is precedent for those as well. As far as I can tell, the distinction is a matter of taste.</p>
