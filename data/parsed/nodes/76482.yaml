      <p>@ Nick</p>
      <p>We seem to be going, back-and-forth, talking about two different things.</p>
      <p>We all realize that digitization and technology has made it easier to copy information in many different forms.</p>
      <p>In the past, someone could scan or make a copy of your letter forms, with tracing paper overlays, and adjust the shapes with pencil in hand to alter the shapes and create new letter forms or derivatives of your work. Someone else with more skill could simply look at what you have done, and quickly sketch new ideas on paper or go direct to digital form and render a design similar to yours, with enough variations to render the work an original.</p>
      <p>Today, someone can open your font outlines in FontLab and peek at your kerning data, or analyze your outlines, or take bits and pieces of your digital data, and construct a relatively new font design.</p>
      <p>Someone in the near future, with "atom manipulating" technology will be able to reproduce the "Mona Lisa" painting, molecule by molecule, undistinguishable from the original. Or, he/she may add a mustache and convert the charismatic smile to a frown and call it "Mona Lisa ala Pop Art".</p>
      <p>Can any of us really stop any of this technology from coming to pass, or stop anyone from using this technology as I've described.</p>
      <p>I think not. Society will have to adopt to all these technological changes. But, human beings will continue to do what they do best. Create and improve on the things of the past. Every one of us tinkers, experiments and regurgitates their experiences in their own unique way. Sometimes, if we tinker well, we make an improvement.</p>
