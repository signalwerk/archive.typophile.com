    <p>How much of originality is there in type design?<br>
    Many typefaces are either revivals or are inspired by one or more predecessors.<br>
    Are there any original typefaces at all?</p>
    <p>Your opinions and observations would be helpful to me for a paper I am writing.<br>
    Any link to nay previous thread would also be of help.</p>
    <p>Thanks in advance.</p>
