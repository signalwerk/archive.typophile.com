      <p>Alphabet not built on past models sounds oxymoronic.<br>
      But in other hand, alphabet is an evolutionary domain with all these genetic algorythms that check all possible directions. Some of the movements create new local maximas* of the function, so probably it's possible to foresee a future trend sometime, and go there.<br>
      But it's not originality - it's evolutionary adjustment. Originality is creating a different species (mutation?).</p>
      <p>*) Let's say it was Bodoni on a local top of some function. As there couldn't be anything "better" there, you have something "worse" a bit downhill - Walbaum. When to add a bit of different DNA, another hill grows in neighbourhood - with Akzidenz Grotesk climbing up, Helvetica on the top, and Arial in the next valley (not to be continued, incest danger).</p>
      <p>For me, originality is asking delicate questions of things we have got used to. It is looking for a hole in the whole, undermining doubtfull aspects that seem sure in glory of tradition. Probably slab-serif was a kind of such act.<br>
      Script fonts pretend to be highly original, but damn, what's less original than a font based on someone's handwritting? Probably FF Pitu has some level of originality on this field...</p>
