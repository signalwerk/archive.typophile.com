      <p>We all realize that digitization and technology has made it easier to copy information in many different forms.</p>
      <p>In the past, someone could scan or make a copy of your letter forms, with tracing paper overlays, and adjust the shapes with pencil in hand to alter the shapes and create new letter forms or derivatives of your work. Someone else with more skill could simply look at what you have done, and quickly sketch new ideas on paper or go direct to digital form and render a design similar to yours, with enough variations to render the work an original.</p>
