      <p>Why is everyone so obsessed with originality anyway?</p>
      <p>The creation of a thing is always evolving.</p>
      <p>Nature is not static. Always evolving.</p>
      <p>Stop focusing on "if something is similar to something else".</p>
      <p>Is it better? Let the consumer decide.</p>
      <p>This obsession with originality is only a recent thing in our society.</p>
      <p>Allowing lawyers and a few to monopolize ideas and products for personal profit and gain.</p>
      <p>Let the ideas flow. We are all influenced by what has preceded.</p>
      <p>Every little change counts and everything is original no matter how slight.</p>
      <p>Every persons perspective adds and influences the future.</p>
      <p>Whether it be art or type design. Something does not have to be completely original to have merit or value.</p>
      <p>And yes, every once in a while, there comes along a completely unique perspective and idea that changes everything.</p>
      <p>But, then again, the collective little things can add up to the same.</p>
      <p>Our society has the right to be served well and, at best, it means that we can serve by making small, but innovative steps in the right direction :)</p>
