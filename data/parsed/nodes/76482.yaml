      <p>I certainly don't think a handwriting font is the least bit original. By definition, it is a copy of handwriting.  Like everything, some are good and some are bad. There are so many handwriting fonts made today that they just seem to melt into a stew.</p>
      <p>I also don't think the idea of putting slab serifs on a type is very original.  What can be original is to do it very well right off the bat and have it work for its audience.<br>
      Personally, I don't see much value in chasing that dog around the tree.  People end up recategorizing and arguing over minutia and no purpose is served.  It would make much more sense for you to design an original font yourself.  After a few hundred hours of work, you will have discovered how difficult it is to reinvent the wheel in such a way that it still rolls perfectly the same as the others but you somehow know it is different than the rest.</p>
