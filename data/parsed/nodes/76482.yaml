      <p>There is originality in concept.<br>
      And originality in execution (style, residing as much in the hand as the eye).<br>
      With some overlap.</p>
      <p>Not averse to beating my own drum, a couple of original concepts:<br>
      Panoptica: unicase + monowidth</p>
      <p>Bodoni Egyptian: Bodoni, slabbified, without the high contrast.<br>
      I wouldn't say that applying an anachronistic genre is a completely original idea. Legacy, for instance, is "Jenson Sans", and Chapparal is a "slabbed-up Antiqua".<br>
      Nonetheless, I do feel that Bodoni Egyptian is a reasonably original idea, not least because I didn't get the idea from those two faces, but by observing that the serifs of digital Berthold Bodoni (very much a text face) looked like slab serifs at display size.</p>
