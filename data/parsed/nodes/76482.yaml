      <p>You are right, originality is a subjective matter and there is only a certain extent to which you can claim to be original, the alphabet remaining the same.<br>
      However, isn't there any type design that is truly path-breaking or not built on past models? Can we define that safely as originality?<br>
      To my eyes, script fonts (Mistral for instance) seem to have more 'originality', each script being as unique as the person writing it.<br>
      Is there a first slab-serif, they being very innovative in their times?<br>
      Being the first to squarely address the issue of on-screen readability isn't Verdana original?</p>
