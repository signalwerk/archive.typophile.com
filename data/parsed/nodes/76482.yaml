      <p>You have to define "original" in some measurable way. There is so much grey area there that you are likely to be measuring opinion rather than fact. Revivals are easy since they claim to be copies. "Inspired by" gets a bit stickier but they still at least knowingly point towards a source. There are also many unconscious or subconscious designs which have probably been influenced by prior work without intending to. Then there is the "Great Minds Think Alike" theory which postulates that if one person can logically arrive at a certain solution, the odds are a like-minded soul somewhere else has already done so. There certainly are plenty of type designers who look at a lot of type and study historic examples in their training. There are a sizable number of fonts that you might deem as original "enough" if you just accept the designer has at least attempted to make his own design.  The truth is, nobody is trying to reinvent the alphabet yet they must stay close enough to what has been done to be acceptable in the marketplace.<br>
      Also, being original is not always the same as being good. The first example of say Curlz may be said to be original but perhaps not universally thought of as "good design".</p>
