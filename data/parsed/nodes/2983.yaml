    html: <p><i>"Not only that, the bottom of the U is cut off."</i> <br> <br>This happened on a project I worked on, a limited-quantity corporate-sponsored wrapper for Fortune Magazine. When the Illustrator eps of the Fortune logo was opened in Photoshop  the bottoms of the "O" and "U" were cut off. It is interesting to see that the same thing happened <a href="%20http://www.carnase.com/flash.html" target="_blank"> here</a>, (look in the portfolio section) to the man who designed the logo.  <br> <br>(OK, is there a way to link to the Fortune page? That url is the same as the home page.)</p>
