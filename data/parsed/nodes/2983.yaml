    html: <p>"%20" is the code for a space character in a URL. Literal space characters aren't allowed in URLs. When you typed the link, you must have put a space before the URL. When you posted the message, the space was automatically converted to the code (%20). <br> <br>In any case, it's a good idea to test links on the preview screen before hitting the "Post this Message" button. </p>
