    <p>Does anyone know if a Chinese stencil font exists?</p>
    <p>I'm looking to match Chinese text to a font in this sort of style: <a href="http://www.identifont.com/similar?681" title="http://www.identifont.com/similar?681">http://www.identifont.com/similar?681</a></p>
    <p>As it's going to be cut-out, counters/apertures need to be reinforced to as not to all out. I've been looking around, but I can't find anything (likely to be my total lack of understanding of Chinese/Chinese Alphabets!).</p>
    <p>Many thanks.</p>
