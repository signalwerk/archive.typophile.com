    html: |-
      <div class="comment-spam-body"><p>Important questions: is the text in Traditional Chinese (Taiwan, Hong Kong, Macau) or Simplified Chinese (Mainland China, Singapore)? A Traditional Chinese typeface would be useless if you need to render a Simplifed Chinese text and vice versa.</p>
      <p>How long is the text? If it is short enough, modifying an existing non-stencil typeface may be an option.</p>
      <p>It feels like there ought to be a stencil typeface for Chinese, but I can't find one despite looking through several foundries' offerings. I'm not familiar with Chinese typefaces in general, though.</p>
      </div>
