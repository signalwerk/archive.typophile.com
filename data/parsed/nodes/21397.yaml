    <p>it is a a font used by trevor jackson on a promo-cd for german groove magazine. the whole look and feel also reminds me of paul snowden’s work (<a href="http://www.paul-snowden.com" title="www.paul-snowden.com">www.paul-snowden.com</a>).</p>
    <p>the special thing is the capital T i think. maybe it’s a hardcore common font, but i just couldn’t get it. maybe sth like futura extra bold condensed...</p>
    <p>thanks a lot!</p>
