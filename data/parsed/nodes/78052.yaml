    <p>Hi all.</p>
    <p>I was wondering if anyone here might know the answer to this question? Was Desdemona Solid ever released by Letraset as a rubdown sheet? And if so, what was the sheet number and about what year. Thank you for any assistance you might lend to the discussion.</p>
    <p>-Ed M.</p>
