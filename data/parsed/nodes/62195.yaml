  html: |-
    <p>I am doing up some citations on various typefaces, and occasionally it seems as if a typeface may have been essentially "self-published." Is that the case for Frederic Goudy's <a href="/wiki/Goudy%2520Sans" class="freelinking">Goudy Sans</a>? Or was it perhaps issued by <a href="/wiki/Lanston%2520Monotype" class="freelinking">Lanston</a>?</p>
    <p>(Pfeh, if I had unpacked my copy of McGrew's "American Metal Typefaces of the Twentieth Century" since the move, I could figure this out in a jiffy, but I can't find it right  now.)</p>
    <p>T</p>
