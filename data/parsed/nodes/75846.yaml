    <p><strong><a href="http://sudtipos.com/fonts/142" rel="nofollow">Piel Script</a></strong><br>
    _________________________________________________________</p>
    <p>After several years receiving images and request for tattoo design using some of our fonts we are proud to announce the release of our lastest font addition with tattoo style on mind.</p>
    <p>See the specimen <a href="http://bit.ly/pielspecimen" rel="nofollow">here</a><br>
    License the font <a href="http://marketplace.veer.com/font/Piel-Script-UMT0001066" rel="nofollow">here</a><br>
    _________________________________________________________</p>
    <p>About <strong><a href="http://sudtipos.com/fonts/142" rel="nofollow">Piel Script</a></strong><br>
    _________________________________________________________</p>
    <p>Over the past couple of years I received quite a number of requests to typeset and modify tattoos using Burgues Script or Adios. At first the whole idea was amusing to me, kind of like an inside joke. I had worked in corporate branding for a few years before becoming a type designer, and suddenly I was being asked to get involved in personal branding, as literally "personal" and "branding" as the expression can get.</p>
    <p>After a few such requests I began pondering the whole thing from a professional perspective. It was typography, after all, no matter how unusual the method or medium. A very personal kind of typography, too. The messages being typeset were commemorating friends, family, births, deaths, loves, principles, and things that influenced people in a deep and direct way, so much so that they chose to etch that influence on their bodies and wear it forever.</p>
    <p>After digging into the tattooing scene, I have a whole new respect for tattoo artists. [Although] Some artists go the extra mile and take the time to develop their own lettering for tattooing purposes most tattoo artists use generic type designs to typeset words.</p>
    <p>There have been quite a few attempts at making [tattoo], but as far as I could tell a stylish skin script was never attempted in the digital age. And that's why I decided to design <strong><a href="http://sudtipos.com/fonts/142" rel="nofollow">Piel Script</a></strong>. Piel is Spanish for skin.</p>
    <p>In a way, <strong><a href="http://sudtipos.com/fonts/142" rel="nofollow">Piel Script</a></strong> is a removed cousin of Burgues Script. Although the initial sketches were infused with some 1930s showcard lettering ideas (particularly those of B. Boley, whose amazing work was shown in Sign of the Times magazine), most of the important decisions about letter shapes and connectivity were reached by observing whatever strengths and weaknesses can be seen in tattoos using Burgues. Tattoos using Adios also provided some minor input. In retrospect, I suppose Affair exercised some influence as well, albeit in a minor way. I guess what I'm trying to say is there is as much of me in <strong><a href="http://sudtipos.com/fonts/142" rel="nofollow">Piel Script</a></strong> as there is in any of the other major scripts I designed, even though the driving vision for it is entirely different from anything else I have ever done.</p>
    <p>I hope you like <strong><a href="http://sudtipos.com/fonts/142" rel="nofollow">Piel Script</a></strong>. If you decide it to use it on your skin, I'll be very flattered. If you decide to use it on your skateboard or book cover, I'll be just as happy. Scripts can't get any more personal than that.</p>
    <p>_________________________________________________________</p>
