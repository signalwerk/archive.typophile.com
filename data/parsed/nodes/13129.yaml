      <p>i agree and agree...you should try making smaller variations of this mark at say, 75% and seeing how it translates. i'd guess that face becomes too thin. maybe using a more regular weight instead of a lighter weight (if it's available) would solve a problem.</p>
      <p>i dont mind the light blue in the mark, but for the lettering, i agree with simon, it might be too light in small instances. maybe using the black (typical) or if youre set on these colors, you can try using the maroon. darkening the blue a bit is an option as well.</p>
      <p>the actual mark is nice too but something feels unstable. something with angles i think. the outer angles are close to the the inner angles of the arrows but not the same so it's making my eyes kinda move in strange directions. (if that makes any sense) you could try color placement changes as well. maybe the red at the top looks better than the black, and the black could go to the right.</p>
      <p>i'm just throwing out ideas here and playing devil's advocate. it's lookin pretty good in my opinion...i just dont like that 't' thing. not my cup of tea and it doesnt seem to make much sense. plus the letter looks strange with the lindus letters. something looks wrong. i'm not a fan of the dot seperator either. i think a dash would make more sense if you stuck with it</p>
      <p>w|m</p>
