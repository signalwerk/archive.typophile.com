      <p>Hi!</p>
      <p>First impressions - I like it. It's clean, modern and polished.</p>
      <p>But...<br>
      I'm unsure about changing a company name - if they've already bought the domains etc., and registered the company under the 'Telindus' name, then it's probably unfeasible to alter it. Also, the T-Mobile comparison seems a bit askew - The 'T' almost certainly stands for something, but the company is universally known as T-Mobile and isn't dropping letters to accommodate a hyphen for stylistic reasons. It's very problematic to change names because of the confusion it could cause to new &amp; existing customers and possible financial implications for the company. If you're in at the inception stage of the company (your post doesn't say if it's a new company or a existing company that's rebranding) and nothing's set in stone then it might be worth looking at a new name - for what it's worth I like both names, persoanlly I'd stick with 'Telindus'.</p>
      <p>Aside from this, I'm concerned about the light colour you've used - light blues can 'hide' when photocopied, so they'll disappear on photocopied sheets.</p>
      <p>I hope this helps - it's looking good!</p>
      <p>Simon</p>
