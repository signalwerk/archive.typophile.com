    <p>So I am sure that a topic like this already exists. I just can’t find it so I am posting it again. </p>
    <p>I am Working on my first (full) font in my third year of graphic design studies. I can’t seem to find any examples of x height in relation to uppercase L serifs. I’m creating very thick title face with hairline terminals and large hairline serifs, huge “balls” ie r a j f y etc. </p>
    <p>But I’m having trouble finding a resource for em square examples. I need to see some letters (like L in relation to x height) on a proper em square and can’t find one. I should have a book but I don’t. So does anyone know of any? am I gonna have to pony up and buy a book? </p>
    <p>Second question. Is there a basic free/shareware fontlab type program? There is one classroom at my school that is in use basically all the time and I will need many hours (as I’m sure you know) once I have finished all my drawings. And once I am done I am gonna repost all of them in the critique section for a good old fashion ass kicking.</p>
    <p>thank you.</p>
