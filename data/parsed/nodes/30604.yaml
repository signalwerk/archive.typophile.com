      <p>I don't know if this will help you at all.</p>
      <p>When I design and layout poetry books, I like knowing the contents so I can pick an appropriate font.</p>
      <p>In a recent poetry book - it was very "mushy." My choice for titles was Bible Script and for the poem itself, Berkeley Old Style. They worked well together, and the client was so delighted we've done 2 more for him that same way.</p>
