      <p>If you buy Minion Pro Opticals, you can use the Medium optical size, or or even Subhead if you want something really delicate (Display would be overkill, I think). Of course, this all depends on the quality of printing and the point size you'll be setting your poems at: If the letters are too fine, the thins won't come out when printed, and that's not the kind of "disappearing" you want.</p>
      <p><a href="http://www.adobe.com/type/browser/P/P_1721.html" title="http://www.adobe.com/type/browser/P/P_1721.html">http://www.adobe.com/type/browser/P/P_1721.html</a></p>
      <p>Otherwise it might be useful to look for a font that is less condensed, and will create a lighter color on the page. It's too late to think of an appropriate example; hopefully someone else can come up with one.</p>
      <p>Hope that helps.</p>
      <p>David</p>
