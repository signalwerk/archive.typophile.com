    html: |-
      <p>Well, Palatino was originally designed as a display font. Aldus is its mate for text sizes. </p>
      <p>There is a problem with Palatino looking too heavy in text--but it can look fine also. It is a matter of how it is handled--all the other features of type layout, as well as the printer. </p>
      <p>In general, how attractive your print-outs will be will depend as much on the typography as the typeface you choose. The two go together. If you haven't already, I recommend getting a copy of Bringhurst's 'Elements of Typographic Style.' He is a prominent poet as well as typographer, and the book will I think just blow you away by its eloquence and insight.</p>
