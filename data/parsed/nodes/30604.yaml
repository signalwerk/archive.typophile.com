      <p>----P.S. Have you thoroughly checked the front matter of any of the poetry books you like? Normally on the copyright page in about 7 or 8 point, way down below, they let you know what type faces were used----</p>
      <p>@heron2001:  I did check the above books before posting and found nothing; since then I've gone through a lot of my other "top shelf" poetry books and...lo and behold!....most of them are set in Electra.  Now that I've looked into Electra's history, I can see why I like it so much; the designer had some extremely interesting things to say about typeface, IMHO; and I feel I know exactly what he means, intuitively at least. </p>
      <p>Unfortunately, digital Electra - as William pointed out - isn't nearly as shimmering (doesn't quite "sing" as someone beautifully put it) as the examples I have on my shelves.  Of course, this took me to inquiring about letterpress printing and so on, until I saw how expensive that would be (ummm..specially considering how much I've spent fiddling with fonts); my apartment floor is littered with examples/prints....  *sigh*  I'm having fun though.  *grin* </p>
      <p>Thanks for the welcome everyone :-)</p>
