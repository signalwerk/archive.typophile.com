    <p>hello, I'm a first time poster and ultra-newbie when it comes to typeface.</p>
    <p>I'm looking for a font to use in sending my poems out to journals/mentors.  In looking around @ serif fonts, I tend to look for fonts that "disappear" when you look at them.  I have a few books of poems that I'm using as models.  The two closest one's I've found - Garamond and MInion - are vaguely similar to what I'm trying to match; but when I compare them closely they are much heavier.  What would be perfect is a Minion "Light," if you know what I mean.  Is minion pro different and how so?  Thanks for the very interesting forum.  Cheers, ~d</p>
