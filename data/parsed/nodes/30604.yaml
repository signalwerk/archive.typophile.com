    html: "<p>I know, you want to go for the crystal goblet. However, it would be useful to know roughly what kind of poetry you write. Depending on the subject you treat and the form you use, a font like Centaur for example can look terribly misplaced. It depends also on the content whether a type face «disappears». Have you ever considered using a monospaced font like Screenplay-Remington? Many editors like that: It reminds of typewriter-scripts and it doesn’t look like you have tried to do their job.</p>"
