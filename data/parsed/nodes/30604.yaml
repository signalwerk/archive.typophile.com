    html: |-
      <p>Thanks all :-)  </p>
      <p>I suppose the best way to characterize my poetry is to list my poetry heroes:  Middle English anons., John Skelton, Chaucer, John Clare, Emily Dickinson, Thomas Hardy, Robert Graves, Robert Frost, and Richard Wilbur.  That is, I am or try to be rooted in traditional verse.  As for subject matter, I'm with Hardy:  "What made for poetry 2000 years ago makes for poetry now."  Hopefully, all this "places" me for you without "catagorizing" (ahhhh!) me.  </p>
      <p>As to editors, yes I respect what they do very much and am not trying to do their job.  When I send poems to an editor in hopes of publishing I merely send it in standard garamond.  </p>
      <p>However, I also have editors &amp; mentors to whom I send poems (either previously published or not) to introduce myself, keep them updated as to my work, etc.  And I want it to look really good; I know I am preaching to the choir when I say that the typeface/layout makes all the difference between something that is pleasurable to read and something that is emphatically not!  We all have certain books that we return to merely because they are so well designed: the meanings/contents/words almost shimmer. </p>
      <p>If I scan a page of what I'm trying to replicate, would someone be able to identify the typeface and so on?  thanks again.</p>
