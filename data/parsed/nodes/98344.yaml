    html: |-
      <p>With some little adjustments, mainly on /U, you can get pretty close using <a class="freelinking external" href="http://www.myfonts.com/fonts/letterheadfonts/lhf-billhead-1890/" rel="nofollow">LHF Billhead</a> (1900).<br>
      The script looks handwritten to me. Have a look to some <a class="freelinking external" href="http://www.myfonts.com/search/Script+handwritten+monoline/fonts/" rel="nofollow">"script handwritten monoline"</a> and <a class="freelinking external" href="http://www.myfonts.com/search/%28Handwritten+monoline%29/fonts/" rel="nofollow">"handwritten monoline"</a> tagged fonts at MyFonts, you may find some interesting alternatives. The missing sans could be a lot of thing so why not (the ubiquitous) <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">Gotham</a>.</p>
