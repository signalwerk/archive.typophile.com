    html: |-
      <p>The embossed letters in your first image seem to use a different C for CYCLES, because it looks too rounded. I would guess that these letters might be hand-drawn and then machined. The S is not usual, but I was not able to find this in a font.</p>
      <p>In your second image, the sans serif for most lettering could be Gotham from H&amp;FJ, but the letters are not distinctive enough to be sure. </p>
      <p>The large HUFNAGEL letters look like a Victorian-era serif, but I could not find an exact match.</p>
      <p>- Mike Yanega</p>
