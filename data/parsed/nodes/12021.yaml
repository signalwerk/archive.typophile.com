    <p><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Design%20Firms" class="freelinking" rel="nofollow">Design Firms</a> : Punchcut</p>
    <p>Punchcut maintains and operates Typophile with Punchcut co-founders <a href="/wiki/Joseph%20Pemberton" class="freelinking" rel="nofollow">Joseph Pemberton</a> and <a href="/wiki/Jared%20Benson" class="freelinking" rel="nofollow">Jared Benson</a> acting as executive sponsors. </p>
    <p>Punchcut is an interface design company, specializing in interfaces for devices: mobile, television and embedded-screen experiences. Punchcut maintains <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>, a community for type designers,  graphic designers and educators. </p>
    <p>In addition to a broad array of consumer, mobile and entertainment brands, Punchcut has designed user interfaces and communications collateral for companies such as <a href="/wiki/Hoefler%20and%20Frere-Jones" class="freelinking" rel="nofollow">Hoefler and Frere-Jones</a>, <a href="/wiki/TypoBrand" class="freelinking" rel="nofollow">TypoBrand</a>, <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> and <a href="/wiki/fStop" class="freelinking" rel="nofollow">fStop</a>. </p>
    <p>Punchcut was founded in 2002.</p>
