      <p>Seeing Xavier in a children's book (something about dinosaurs) while working with disabled pre-school kids. Always making me feel good to see my fonts in books for kids! </p>
      <p>Ah, just remembered walking into Macy's one evening and noticing a box of cosmestics with the new weights of Shiseido (originally designed by Adrian Frutiger) that I had been commissioned to do. White letters on metallic red; very eye-catching. Of course, I love red on white like that. The sales woman just happened to have an empty box which she gave to me, when I explained why I wanted one!</p>
