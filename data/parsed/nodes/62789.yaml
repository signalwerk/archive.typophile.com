      <p>For me, one of the coolest things was seeing Proxima Sans used as part of the house style in <em>Rolling Stone</em> magazine back in 2002. It inspired me to get back to work on it and add the weights, styles and features I'd left on the drawing board when I released it in 1994. The result was Proxima Nova in 2005. (Thank you, Matthew Ball!)</p>
