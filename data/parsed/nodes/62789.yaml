      <p><em> Matthew Carter likes to tell about the time he was in the duty-free shop at Heathrow and found some Scotch with Galliard on the label. He bought a bottle, and as he walked out, a market researcher holding a clipboard stopped him. “Why did you pick that brand of Scotch?” she asked him. “Because I designed the type on the label,” he answered, as she searched in vain for a check box corresponding to that answer.</em></p>
