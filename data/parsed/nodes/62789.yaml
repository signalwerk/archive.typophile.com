      <p><em>I did some research and apparently Playboy used Target from ’05 to ’08.</em></p>
      <p>I'm sure you did! (nudge, nudge, wink)</p>
      <p>As for me, I just happened across this a few months ago:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Demanded_5558.jpg"></div><p></p>
      <p>It's a freeware type I made 10 years ago while in college called "Jammed Toaster", as it was a tribute to the logotype for software maker Adaptec, which at the time published two CD authoring programs, "Toast" and "Jam". </p>
      <p>It's an awful font, with crumby letter forms and non-existent spacing, and no capital letters (which is why they must have thrown in the 'D' from Bauhaus in there).</p>
      <p>Music Choice is a collection of music offerings from cable providers like Comcast, but I'm assuming it's used nation-wide. Which is kind of cool, as I've never had any of my work get that kind of exposure before.</p>
