    <p>I posted about the <a class="freelinking external" href="http://pentagram.com/en/new/2009/08/preview-fifa-world-cup-us-bid.php" rel="nofollow">'Game' typeface</a> I worked on for the US Bid for the 2018/2022 World Cup while working at Pentagram about a month ago.</p>
    <p>Today I found a youtube video of Drew Carey bringing bumpers stickers featuring the typeface onto the Late Late Show and sticking them on Craig Fergusons desk:</p>
    <p><a class="freelinking external" href="http://www.youtube.com/watch?v=VAYxXg1YkDI" rel="nofollow">Youtube Video Link: Go to about 3:15.</a></p>
    <p>It's the coolest example of seeing my own type design work in the wild. What's yours?</p>
