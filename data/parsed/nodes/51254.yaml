      <p>No I never added it. So maybe it's not there. There is no default substitution. After all it's default. My font order is Windows Code page. The alternates are way down at the bottom of the font. The defaults are not mentioned in the Open Type features at all really.</p>
      <p>What exactly the problem is swash glyphs are being used instead of the default glyph. Now I use Calt to apply the swashes and it works flawlessly in Adobe's<br>
       programs like expected.</p>
      <p>Now that might not even be the problem. There might not be anything wrong with my font period but it seems from what I'm hearing is that the calt rules are not being applied properly in some applications. What applications I don't know. Everything I've tested it in it works like it's suppose to. Could be Mac applications.</p>
      <p>Some applications seem to be ignoring the substitution rules.</p>
