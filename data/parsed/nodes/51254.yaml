    <p>I'm not sure if I'm getting this right. I did search the forum here but it's not answering my question.</p>
    <p>On my fonts Fontlab added the <a href="/wiki/aalt" class="freelinking" rel="nofollow">aalt</a> feature, I never added it. Fine everything seems to work but what I've noticed is some programs seem to have aalt turned on by default making it so all calt's slashed zeros thing like that to be the default symbol even if you don't want them.</p>
    <p>What am I missing? Is it suppose to be on by default? Seems kind of pointless to be turned on by default.</p>
