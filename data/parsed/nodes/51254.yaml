      <p>About glyph order, yes, I had this too once.<br>
      About aalt -- actually FLS does not add an aalt feature when generating fonts. An aalt feature is added when <em>importing</em> a font back into FLS. You could use ttx or any other tool and search for "aalt" to find it's not there unless you added one manually before generating the font ...</p>
