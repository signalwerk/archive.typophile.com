    html: |-
      <p>Calt is on by default in InDesign. You should use the "swsh" feature for your swashes and the "zero" feature for your slashed zeros as these should be turned on manually. Calt means contextual alternatives, and I would put perhaps a feature like this there:</p>
      <p>sub g j' by j.calt</p>
      <p>where the j.calt is a normal j but with a little smaller tail in order to be replaced ONLy when it meets a g on the left side.</p>
