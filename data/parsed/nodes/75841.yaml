  html: |-
    <p>I'm updating some fonts originally created in Fontographer 3.5. While creating the bold on some of the characters FontLab is misshaping them.</p>
    <p>The first page of the attached PDF shows before, the second page after the bold effect.</p>
    <p>Using the change weight in Fontographer also caused a problem unless I first used the "Correct path direction," which fixes the problem in Fontographer. However, after correcting the path and regenerating the Type1 font from Fontographer so it could be opened in FontLab did not help the problem in FontLab.</p>
    <p>I've played with the various path tools in FontLab but have had no success. I'm guess there is something I'm missing that will fix this short of manually reshaping the character.</p>
    <p>Any help is greatly appreciated.</p>
    <p>Thanks!<br>
    Ken</p>
