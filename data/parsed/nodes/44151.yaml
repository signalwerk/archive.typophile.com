    html: <p>I would think it was very logical - given the global nature of this establishment - to keep such local things on more appropriate sites made for exactly such things. I can however understand that a client would come here for a top quality product, but in such a case they should contact the member directly. In so many words, please don’t turn Typophile into a trivial marketplace.</p>
