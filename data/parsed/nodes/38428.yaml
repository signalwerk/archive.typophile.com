    html: <p>The Adobe Arabic font ships with version 7.0.5 and later of Acrobat. If you check the Fonts folder in the Acrobat program directory, you should find the font. Note that this is a CFF OpenType font, which will not rasterise in VOLT. In order to view the imported project file, you will need to make a TTF version of the font in e.g. FontLab.</p>
