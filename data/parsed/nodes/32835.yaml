    html: <p>"Soft" may be handwritten. Looks like a single stroke to cross the 'f' and 't'. You might like <a href="http://www.fontshop.com/fonts/singles/monotype/caflisch_script_pro_ot/&amp;sample_text=Soft&amp;sample_size=74" rel="nofollow">Caflisch Script</a> or <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/fineprint/&amp;sample_text=Soft&amp;sample_size=74" rel="nofollow">Fineprint</a>.</p>
