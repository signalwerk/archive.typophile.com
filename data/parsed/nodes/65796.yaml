    <p>COLD CASE FILES: JULY 2009</p>
    <p>Squeaking in before the stroke of midnight, this one will be the last in our series, for now. It’s not really cold unless it’s at least 6 months old...</p>
    <p>Do you have what it takes to track down some fonts from our cold case files? The ID requests below were all posted during July 2009, but never got a response. </p>
    <p>If you can resolve one, post your answer on the respective thread and let us know back here so we can track the results.</p>
    <p>How many can you identify? We’ll (re)start the clock at the date/time of this posting.</p>
    <p>Ready.. Set.. Go!</p>
