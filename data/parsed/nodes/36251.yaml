    votes: null
    html: |-
      <p>I bought the book at TypeCon and immediately read it through. A good book with a lot of interesting information. </p>
      <p>Bits that were particularly new to me personally:</p>
      <p>1. The idea that the 'edge effect' intensifies both the white and black near a stroke. I think I read this also in G. Noordzij, but here it is applied in a practical way. I realize it is closely related to what we here on Typophile have debated about 'notan'.</p>
      <p>2. Unger's characteristic handling of the mn branches is partly due to a theory that bigger counters will intensify contrast, making the blacks more forceful.</p>
      <p>3. The observation that Newspaper type has become progressively bigger and narrower over the past 15 years. </p>
      <p>I wonder, how much was the book updated from previous Dutch editions?</p>
    html_clean: |-
