    <p>I don't know if u people hate this "listing type" of questions, but this is for those who have time :)</p>
    <p>I'm searching for fonts with (I don't know how to exactly say) charming, softy, "approachable" italics and especially bold italics. For sans and serifs separately. Maybe I better quote examples. </p>
    <p>For sans something like beautiful Serrano or TodayS...<br>
    For serifs like Dolly, Fedra serif (not so softy but memorable)...</p>
    <p>Fire at will :)<br>
    Thnx!</p>
