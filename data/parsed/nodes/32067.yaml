    <p>At the moment, I'm working on a hybrid between a typespecimen<br>
    (for the entire FF Nexus family) and a paper sample.<br>
    And I'm getting to know the Nexus quite well in the process.</p>
    <p>Besides showing the characteristics of the Nexus, I'm planning<br>
    to feature some comments by Martin Majoor himself. But I think<br>
    it would be very interesting to feature some comments<br>
    by other people (typophiles) as well.</p>
    <p>So please, tell me about your experiences with Nexus.<br>
    How do you feel about the Nexus family and it's design?<br>
    Praises, moans, anything goes!</p>
    <p>I look forward to hearing from you.</p>
    <p>Thanks!</p>
