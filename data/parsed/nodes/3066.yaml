    html: "<p>Back in the day, there was a magazine called Factsheet Five that served as a reviewer/chronicler/informal clearinghouse for hundreds of zines. It was founded by Mike Gunderloy and ran for several years before foundering in the 90s after a couple of changes in owner/editorship. (The publication's ghost site is still afloat at <a href=\"http://www.factsheet5.com\" target=\"_top\">http://www.factsheet5.com</a>) <br> <br>Here's an eBay auction of old issues: <br><a href=\"http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=1560075436\" target=\"_top\">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=1560075436</a> <br> <br>Check out <a href=\"http://www.zinebook.com\" target=\"_top\">http://www.zinebook.com</a> for lots of zine info, too.</p>"
