  html: <p> Hi, <br> <br>I'm about to start my dissertation on music fanzine design and I was wondering if anybody had any ideas on where I could get information on this subject. Anything to do with the history of, or how different genres of music affect their design would be great. Actually, anything really would be brilliant! </p>
