      <dl>
      <dd>Don’t be perplexed… The I is actually the Greek iota. It was part of the Cyrillic alphabet from the beginning, not an afterthought. As to the J, the Romans did quite well without it for centuries, and those were not the users of Cyrillic who came up with it first (in the 16th century?). In fact, Karadžić’s adding the Ј to the Serbian alphabet in 1818 did a lot of good.</dd>
      </dl>
