    <p>Dear Maxim,</p>
    <p>The other night after bathing myself in Axe Man Stink™, I came across a couple real cuties....Swag...</p>
    <p>Oh wait, not that Maxim,</p>
    <p>lets try again</p>
    <p>Dear Maxim,</p>
    <p>Do you have any pix of Cyrillic before it was latinized?  And would you explain a little about how Cyrillic came to use Latin characters, and numbers, forwards and backward, and combinations of two latin charecters equaling one Cyrillic character?</p>
    <p>Is it just me, or does it seem like the Russians went batcrap crazy when they did this?  Well at least their great composers always make sense.  I'm off to listen to Shstakovich's 24 preludes and fugues....</p>
    <p>To Russia,<br>
    With love...</p>
