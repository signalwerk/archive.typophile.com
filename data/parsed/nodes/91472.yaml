      <p>I remember the old ikons in the Greek Orthodox Church that I attended as a child. The lettering on them was inherited from the Greek Byzantine forms John mentioned. Saint Paul brought the precursor of the Orthodox version of Christianity to Russia with most of the writings being in Greek.  Russians had centuries of familiarity with the Greek letterforms through the Orthodox church.  It was an easy way to get started with a new script when most of the people were already familiar with 24 glyphs.  St Cyril was a logical choice :-)</p>
