      <p>The example of Ustav gives the Old Slavonic alphabet rather than the modern Russian alphabet, so hard E is absent.</p>
      <p>As to the original question, though, I am perplexed. Cyrillic is what it always was, it hasn't had additional Latin letters introduced, although it is true some national alphabets of the Cyrillic type have added letters from Latin, but not recently - such as I and J.</p>
