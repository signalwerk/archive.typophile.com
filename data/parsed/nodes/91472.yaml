      <p><em>Cyrillic writing derived from Greek</em></p>
      <p>Specifically from Byzantine Greek. The connections between some Cyrillic and Greek letters isn't immediately apparent to people who are only familiar with the classical and modern Greek alphabet norms. I didn't come to understand all of the relationships until just last year when I was working on a typeface for Byzantine sigillography and numismatics, containing many variant forms tracing more than 1,000 years of Byzantine letterforms. A light went on for me when I saw that H sometimes occurs as a variant form of N in Byzantine uncial, explaining how it came to represent that phoneme in Cyrillic.</p>
    html_clean: |-
