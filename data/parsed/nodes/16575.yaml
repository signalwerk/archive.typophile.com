      <p>I reckon the best version is No.1 on the sheet without the logo ’containers’ on. I think the extra linework/block/circle don’t add anything (the circle linework actually makes it too complex). It’s kind of what I sometimes catch myself doing if I feel that the logo’s not strong enough - ’I’ll just put it in a box, that’ll make it stand out’. Your logo is strong enough to go without.</p>
      <p>Type-wise, the lettering on the first one is the best, it’s the least condensed looking; the only slight niggle I have with it (and it is only slight) is that I’m not personally a fan of the ’m’ glyph. It bugs me, but it bugs me least when it’s less condensed (and looks a bit less spindly without those long legs).</p>
      <p>It looks great.</p>
      <p>Si</p>
    html_clean: |-
      <p>I reckon the best version is No.1 on the sheet without the logo ’containers’ on. I think the extra linework/block/circle don’t add anything (the circle linework actually makes it too complex). It’s kind of what I sometimes catch myself doing if I feel that the logo’s not strong enough - ’I’ll just put it in a box, that’ll make it stand out’. Your logo is strong enough to go without.</p>
