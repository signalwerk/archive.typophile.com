      <p>I have altered armada by changing the “N”, “M”, and the “E”. I have never been happy with this project because of those letters, but I haven’t been able to find a font that matches the icon. What Tiffany said has stayed with me about when things are too matchy they start to feel corporate. I think that the customized type solves the problem. I think the type feels unique but it doesn’t take the attention away from the icon, which the other did. It also looks good at smaller sizes.</p>
      <p>I have also altered the icon by making the negative space “T” more proportional. Not both bars are the same thickness.</p>
