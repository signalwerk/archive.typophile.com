    date_raw: 5.Dec.2005 12.16pm
    votes: null
    html: |-
      <p>A reason I don’t want to use a canon is the same reason I would never use the color red if my company name was Red. The focus of the logo is design with my name happening to be Cannon. If it were Cannon Antiques it might be a different story.</p>
      <p>I have done many sketches of different combinations since college. I am set on using the idea of the T-C combo both in a 45 degree angle (unless someone else has another idea that is better).</p>
      <p>Something else I didn’t say about the reason I like the line version of the logo. It captures the feel of what I do because in design most everything is built out of lines such as layout grids, typefaces, sketches, logos, etc.</p>
      <p>I am uploading a new file using armada. Because the all uppercase version of armada is too harsh I made the letters lowercase, but I altered the “G”, “T”, “D” so that the stems don’t go above or below the rest of the letters.</p>
      <p>Once I get the layout finished I will work with the colors. I appreciate any suggestions!</p>
      <p></p><div class="imageWrap"><img src="/files/tcdesign_logo.gif"></div><p></p>
