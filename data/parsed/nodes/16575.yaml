  html: |-
    <p>I have been working on my own logo between projects for years. It has been a source of frustration because I am a horrible client. Ideas for client’s logos come easy, but ideas for my own do not. The best I have come up with is an icon that has a “T” reversed out of a “C”. About two years ago I started a thread on typophile and felt at the time that I finished with a good logo that can be viewed on here: <a href="http://tomcannondesign.com/" title="http://tomcannondesign.com/">http://tomcannondesign.com/</a>. </p>
    <p>I am unhappy with it again. I don’t feel the same excitement about it that I do for other logos I finish. The icon is too simple and it needs 3d treatment to make it interesting. I don’t like 3d logos because they aren’t functional. I have always felt they were weak in design if they need 3d and mine fits in that category.</p>
    <p>I have posted below my latest attempt to use the same T-C idea but tweaked the icon. I haven’t spent much time with the type yet. Suggestions of any kind would be welcome and appreciated!</p>
    <p></p><div class="imageWrap"><img src="/files/tom cannon design_ logo.gif"></div><p></p>
