    <p>Looking for font suggestions/general insight.</p>
    <p>I'm currently working on the website &amp; art direction of a soon-to-be-launched women's online fashion shop. The feel of it is supposed to be "up scale" and kind of exclusive (not cute or kitschy at all). I have been trying out logo sketches and other things with Lineto's "Brown" typeface and LOVING the way it looks and how it communicates the brand. </p>
    <p>example: </p><div class="imageWrap"><img src="http://typophile.com/files/Screen shot 2014-07-22 at 11_4654.38.41 PM.png"></div><br>
    <a href="http://lineto.com/" title="http://lineto.com/">http://lineto.com/</a><p></p>
    <p>The only problem is the price being nearly $200 for one single weight, which the sole starter of this business is not crazy about. She does very much like the font as well, but is suggesting I try and find a free alternative. I've been looking far and wide and I simply don't think anything free can hold a candle to Brown's strong, geometric form.</p>
    <p>So my questions concerning this are:<br>
    - Does anyone know of any free (or at least cheap) alternatives to Brown that I simply haven't stumbled upon yet?<br>
    - Is buying Brown a good investment for the company and should I try to convince her of how important it is?</p>
    <p>- And additionally, I'm looking for some basic insight into if anyone has experience using Lineto's typefaces as webfonts, and knows which format(s) would be the best to buy and how I would go about hosting them.</p>
