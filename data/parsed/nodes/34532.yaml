    html: |-
      <p>very simply:</p>
      <p>open Illustrator<br>
      Place image<br>
      Object - Live Trace - Make and Expand<br>
      (you may want to experiment with Trace Options to see how close to the origianl you want to get)</p>
      <p>You’re done.</p>
      <p>For more info:  <a href="https://web.archive.org/web/20081011042610/http://graphicssoft.about.com/b/a/184934.htm" title="http://graphicssoft.about.com/b/a/184934.htm">http://graphicssoft.about.com/b/a/184934.htm</a></p>
