      <p>LaTeX is really the ideal programme for any papers with equations but I found it a bit of a steep learning curve.<br>
      But then InDesign isn't exactly easy if you're not used to it. The plug-in timd suggests would be useful if you have to include a lot of math.</p>
      <p>As for your comment about <cite>just typing into the sheet and having it flow page to page</cite><br>
      You may find it quicker and easier to do the typing in TextEdit. It has the benefits of auto-spell-check and the system wide dictionary and thesaurus (select a word, hover the cursor over it and ctrl-cmd-D). It's also a much smaller application –&nbsp;quicker to open, less distractions.<br>
      For me, Word has all the downsides of InDesign –&nbsp;resource hungry, complicated UI –&nbsp;with none of the power.</p>
      <p>Set up your layout (and maybe a style sheet) in InDesign and paste in the raw text from TextEdit. </p>
      <p>Most people I know do the typing in a basic text editor and use InDesign or Quark for layout and styling.</p>
