    <p>Howdy!<br>
    I am a first year engineering student. I am looking for a recommendation on which software to use to write reports in.</p>
    <p>I write quite a few reports, at least one a week. They are typical lab style reports, not very long, but including several equations, figures, tables, appendices, and a more than trivial page numbering system.<br>
    I have licenses for Adobe creative suite 2 and Microsoft office (being a student makes for nice discounts).<br>
    I am on a Macintosh, which means that I would rather not use office which is not compiled for the intel processor in my macbook pro and is a bit slow.</p>
    <p>So, my question is, what software should I use to do lab reports in? I have been using word, but the equation editor restricts me to using times or times new. I would much rather use a font a prefer, like a garamond or warnock.</p>
    <p>I have done layout in indesign, but I am not sure that it is well suited to this kind of work. I believe latex is just about perfect for what I am doing, but I am not sure if the hassle of it is worth the work.</p>
    <p>Another question is about Word. Is there any way to get it to recognise my font families? I don't need a list of 30 adobe jenson fonts to know that I have them. And when I select bold it doesn't change to the bold font, it does the pseudo bold. Same thing for smallcaps. Interestingly enough, TextEdit does all the font things I need, including bold and italic font switching and auto-ligatures. Not smart enough to do caption -&gt; caption bold, but pretty good.</p>
    <p>Thanks,<br>
    Sam</p>
