      <p>You can change the default font in Word's equation editor but only when editing an equation, otherwise the option to do this is inaccessible. Once you are editing an equation, use the drop-down menus in the main toolbar to change the default font/size.</p>
      <p>As has been mentioned, Word 2007 is far more intuitive in its treatment of mathematical expressions.</p>
      <p>Another option you might consider is <a href="http://www.wolfram.com/products/publicon/index.html" rel="nofollow">Publicon</a> from Wolfram Research, makers of Mathematica. You can download a free trial to see if it meets your needs. It is available on the Mac.</p>
