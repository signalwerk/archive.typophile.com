    html: <p>I would have to concur with Daniel here. I'm a <a href="http://www.webstandards.org/">web standards</a> advocate. Flash will never replace web standards. No matter what Macromedia does, Flash will never be as accessible, SE friendly, or scalable as some combination of W3 standards based technologies. <br> <br>The fact remains that it is a plug-in, it's binary, and it's cpu intensive. For a targetted demographic, motion graphics, and rich media applications it's feasable, but for regular web publishing -- there's no comparison. I would go as far as to say that when wider SVG support is  a reality, that Macromedia will have the forsight to leverage it in spite of SWF. <br> <br>Don't get me wrong, I'm not Flash bashing. You can do some amazing things with it and I've always enjoyed working with Flash. It's just that it's often used inappropriately and considered by many to be some sort of magic bullet. <br> <br>What's all this have to do with typography anyway?  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
    html_clean: <p>I would have to concur with Daniel here. I'm a <a href="http://www.webstandards.org/" class="link-external">web standards</a> advocate. Flash will never replace web standards. No matter what Macromedia does, Flash will never be as accessible, SE friendly, or scalable as some combination of W3 standards based technologies. <br> <br>The fact remains that it is a plug-in, it's binary, and it's cpu intensive. For a targetted demographic, motion graphics, and rich media applications it's feasable, but for regular web publishing -- there's no comparison. I would go as far as to say that when wider SVG support is  a reality, that Macromedia will have the forsight to leverage it in spite of SWF. <br> <br>Don't get me wrong, I'm not Flash bashing. You can do some amazing things with it and I've always enjoyed working with Flash. It's just that it's often used inappropriately and considered by many to be some sort of magic bullet. <br> <br>What's all this have to do with typography anyway?  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
