    html: <p>My feeling with the limitations of the web is to create a CI based on colors and/or graphics. Let the logo stand alone and don't force the content on the web into your CI. Most people go to a site for content not CI reinforcement, so if it feels like the printed collateral and provides the information the person is looking for I feel that is as much as you can expect. Dan</p>
