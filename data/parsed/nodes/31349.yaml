      <p>&gt;less lacking in tradition than average. Same difference.</p>
      <p>No, it is not a question of less or more, it is a question of changing tradition critically, rather then knee jerk change or persistence. In some areas I find more wrong with tradition than others do, in some places less. </p>
      <p>I find both conservatives and radicals annoying because they know the solution before they hear the problem. Change for a good reason, not because of a general rule. </p>
      <p>Like you, I am interested in readability in text type. So I would say, there are good reasons to forget about reviving Bodoni as a text type, but to go for reviving  Griffo's types for text.</p>
