      <p>&gt;hiding behind them is not.</p>
      <p>My views don't fit into your boxes, so how about expanding your boxes?</p>
      <p>On the possibility of getting it upside down: My understanding is that punches were struck into a copper strip, then a rectangle was cut around the strike, and this fitted into the adjustable mold. The cutting of the copper matrix was a skilled job, as it would also involve fitting. And it was often done by someone other than the punch maker. </p>
      <p>So I'd think it would be pretty easy to make a mistake, especially in these very early days of typefounding.</p>
