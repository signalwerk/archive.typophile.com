      <p>Hi Matthew,<br>
      This is something crying out to be done; I pray you finish it.</p>
      <p>I wanted to do pretty much what you are doing at Reading, but I had to quit through illness; I'm sad not to have anything to show for the months spent researching, thinking and working on a variety of averaging procedures, which took me a long way beyond the stuff Bill has kindly pointed you to. Luckily, it seems I you can do the work for me :-)</p>
      <p>The tone of what follows is, just for brevity's sake, terribly hectoring; take it with an implied "but if you want to go another way by all means do".</p>
      <p>Gerald is right; but if not a set of fonts you can revive single pages of roman and of italic. Nonetheless your interpretation of what you see needs a thorough knowledge of the mature Griffo's work, in the earliest printings from completed, coherent types. That means using the Scriptores Astronomici Veteres rather than the Hypnerotomachia, for which the type had degraded - degraded further, for the lowercase - and been rather poorly set. It means seeing the De Aetna lowercase, which is a jumble of experimental forms in a very clean state unusually well printed, and comparing it with the revised and narrowed 1499 lowercase; you should also look at the 1497(?) roman, broader, more even, more coherent and less interesting than the 1499, which exists in immaculate form well printed. For your italic, you should see and consider using elements not just, or even mostly, from the well-known 1501 italic in its infinite versions up to 1519, but also the 1503 italic for Soncino and the 1516 made for Griffo's own press, which are generally superior and respectively more beautiful and more functionally intelligent. I've come to see the titchy 1516er as a masterpiece, and it impressed Gerard Unger, who doesn't like the 1501 or 1503. For all these, you need both higher-res scans than you have for the Hypnerotomachia and actual physical books or pages in front of you. I have scans and leaves of the 1501 in its last (?) 1519 state, British Library scans and one leaf of the 1499 S.A.V., BL scans of the 1503 and the 1516, and photographs of the crappy early Jensonian roman - it's interesting to see where Griffo started from - and the 1497 roman. I will send JPEGs if you like, and in extremis could post you my own pages. Just a glance at these will show that your roman isn't very accurate, is more regular than the original, and follows norms established for new work only in the twentieth century. Again, if that's fine by you, that's fine full stop. What you've produced so far is absolutely lovely.</p>
      <p>You can get much closer, though others will disagree, with averaging, because it retains information that the eye examining a page cannot possibly synthesize. Here is the output of averaging a page of 1503 italic, using my software (I can send it, but Raph has his own which is much less labour-intensive though perhaps - I can't be at all sure - a shade less accurate). The only processing it has had is increasing contrast to full range and giving it a white background.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/beach pond_5374.PNG"></div><br>
      Unsharp masking - which is crucial - shows clearly that there are two 'c's here (but not, for instance, two 'n's):<br>
      <div class="imageWrap"><img src="http://typophile.com/files/beach pond unsharp_4167.PNG"></div><br>
      Now the 1499 roman, from my own page, unprocessed:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/adhesion unprocessed_4689.PNG"></div><br>
      See the slight whitening on the top of 'o', or the baseline serif of 'i'?<br>
      Exaggeratedly unsharped and contrast increased for obviousness:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/adhesion_4758.png"></div><br>
      The different texture of, for instance, 'h' vs 'i' comes from having fewer (too few) images of 'h' being averaged.<br>
      If you extract only the interiors, you get<br>
      <div class="imageWrap"><img src="http://typophile.com/files/adhesion metal_4387.png"></div><br>
      Is that metal? Well, since it's produced from the exaggerated version, and the 'n' doesn't clearly join, it must be a pixel or two skinnier than the metal; but it's surprisingly clean for a type often thought of as very rough.<p></p>
