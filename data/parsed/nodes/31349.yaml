      <p>Minor point: more often brass than copper, as far as I know.</p>
      <p>Of course mistakes happen, but then the ink hits the paper and it shows up, right? So is your position that Aldus and Griffo didn't notice the mistake, or didn't care enough to fix it?</p>
      <p>&gt; it was often done by someone other than the punch maker.</p>
      <p>Typically the typefounding tasks were split up among different people in the case of large operations. I suspect in the case of the Aldine press Griffo did as much as possible; he most probably was the one striking the punches onto the matrix material, and then why not go ahead and prep the matrix for casting? I can however see the actual casting done by somebody else, for reasons of risk (of burning) and skill-set difference.</p>
      <p>Also, they must have had a way of marking orientation; think of the risk of ending up with an upside-down "o" for example. Admittedly, even with such a marking the matrix could possibly have been placed upside down in the mould; but have you done the ascender/descender-space test I mentioned?</p>
      <p>hhp</p>
