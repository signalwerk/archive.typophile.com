      <p>I am guessing it was a mistake in casting, so the type was upside down. Checking on the samples from 'Seneca' (with Griffo type) in Peter Burnhill's 'Type Spaces', the Xs don't seem to have reversed contrast. Though it admittedly is hard to tell exactly what is going on because the ink spread is so extreme. Also the fact that the lower case X's in Matt's sample are normal stress would tend to bolster the idea that it was a casting or trimming mistake. It could be part of his general effort to rebalance the color of the alphabet, but as I say I doubt it.  </p>
