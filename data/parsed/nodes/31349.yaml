    votes: null
    html: |-
      <p>Testing is certainly in order, but there's no reason to be skeptical, simply because the conventional contrast distribution is a result of circumstance, not some Righteous Order. In type design Familiarity is routinely over-played by both conservatives and iconoclasts.</p>
      <p>The interesting question is why would Griffo do it? The only clue, and arguably a tenuous one, I can think of is that "X" is almost never the first letter of a word, plus the tops of glyphs carry more visual weight, plus the "X" (and notably not the "x", which does maintain conventional contrast distribution) has a lateral spacing "issue". Maybe.</p>
      <p>hhp</p>
