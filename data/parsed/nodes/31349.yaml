      <p>Hi Griffo fans!</p>
      <p>very interesting work and discussion in progress. I am impressed as I usally am by the expert knowledge that one finds in this forum. Although the fun is reduced a lot after the pages redesign for it seems to me awfully slow now. That's kind of fun killer.<br>
      I am personally not a big Griffo fan for I always found Jensons characters more beautiful and even in the text. What was seen in Aldus printings as a progress i.e. the narrower character ruined the genious idea of having circles as basic idea for beauty. And not the circle of inner forms or else but as a whole as drawn from a pen. Jensons letters to my eyes are the more important ones to take as an example for learning about beauty. I am sorry its provoking from my side, maybe I am only frustrated of not getting response from fantastic guys as Raph, Hrant or William...</p>
      <p>Matthew your pdf was impressing. I particularly liked the way you treated the 'h' here your face is soft and pen like as it should be. Maybe you can invest some time in the 'a' if you want. I attach a beautiful redesign from Malin and a rough sketch in Photoshop</p>
      <p>best wishes<br>
      Stefan (Centaur fan ;-)</p>
