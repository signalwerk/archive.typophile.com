      <p>Both styles are very viable, both originally and in revival, so I don't have a strong opinion about this.</p>
      <p>However, I do feel is that Griffo did make something of an advance over Jenson in making metal type more fully 'typographic', which is to say more 'invisible' by making the color more even, and the characters less calligraphic, and more restrained. The horizontal e is part of this. </p>
      <p>Jenson is also great, but my feeling is that for small 12 pt and lower sizes the model set by Griffo may have an edge. </p>
      <p>For example, Centaur is a more beautiful type than Monotype Bembo, but it doesn't work at small sizes, as far as I have seen. There have been a number of recent revivals or Jenson-influenced type, and maybe if I studied them I might change my mind.</p>
