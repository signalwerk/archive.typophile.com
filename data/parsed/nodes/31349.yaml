      <p>Hi again.<br>
      I would really like to get some more feedback on the actual letterforms and other details of this work in progress. Here is a new specimen page to look at, this time including lowercase: </p>
      <p><a href="http://www.madtype.net/pdf/aldine__text_test_02_16_2007.pdf" title="http://www.madtype.net/pdf/aldine__text_test_02_16_2007.pdf">http://www.madtype.net/pdf/aldine__text_test_02_16_2007.pdf</a> (pdf 230k)</p>
      <p>I'd especially like to hear from you, Gerald, as you have been immersed in the Aldine materials.</p>
      <p>Features of the final fonts will be: </p>
      <p>• Alternate brackets and parens that align with the uppercase in addition to the standard glyphs that align with the lowercase.<br>
      • Lots of ligatures (ff, fi, fj, fl, ffi, ffl, ct, st, etc.)<br>
      • Ending swash glyphs for "e" "m" "n" etc.<br>
      • Small caps included in each font.<br>
      • Both lining and old style figures included.</p>
      <p>Once I get this regular weight completely locked in, I will then work on the bolds and italics.</p>
      <p>I have to say that I am happy with how the font is looking when printed out. It's feeling more heavy duty to me than Bembo, which was my original goal.</p>
