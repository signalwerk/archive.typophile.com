    <p>It begins without a sample of work. As I haven't started it yet.</p>
    <p>I have however, downloaded a full copy of Hypnerotomachia Poliphili, which I plan on basing the revival/inspiration on. This book is seriously beautiful and I think this is as good as any as a starting point.</p>
    <p>I can't seem to get through the completion of a serif face of my own design. So, to prove to myself that I can actually do it, I'm beginning from a historical model.</p>
    <p>Since the Aldus/Griffo types were poorly "revived" in the early 20th century with Monotype's muddy Poliphilus, I figure there could stand to be a clean copy out there that is not Bembo.</p>
    <p>My goals for the face will be as follows (critiques of any part of this are welcomed!):</p>
    <p>1. The face should be suitable for book text.<br>
    2. The face will follow the work of Griffo as closely as possible from the printed samples available without being too literal. (Are there surviving examples of the actual type used? Are they accessible? What other sources should I be looking into?)<br>
    3. The family will include at least the following: Regular, Italic, Bold, Bold Italic, and possibly small caps and lining figures etc.</p>
    <p>So, let me know what you think of all of this. Please pardon the thinking out loud.</p>
