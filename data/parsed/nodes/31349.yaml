    html: |-
      <p>This sounds like a great project!</p>
      <p>In your last sample above, I think that you should revisit the angle of the strokes of the letters. They seem to be more modern (Bodoni-esque… I know, that is over doing it, but follow along…) than old-style. </p>
      <p>For example, the bowl of the P should begin to curve downward before it does in your sample. And the top of the O (12 o'clock) should be much thicker, as should 1 o'clock, while your 10 o'clock should be thinner. In other words, you need to rotate the angle of the stress a bit to the left around the "circle" as a whole (of course an O is not a circle, but I don't know what else to call it).</p>
      <p>Also, your serifs appear to be flat-bottomed. I think they should curve, somehow.</p>
      <p>I love your L. But could the top serifs, or at least the top right serif, be chunkier?</p>
      <p>The pen, the pen! You must remember the pen! (Insert best-possible Yoda voice impression here…)</p>
