    html: <p>Matthew, I am skeptical that the backwards X won't cause problems. Digital type with offset press is an inherently exact medium, with less tolerance than letter press. I would look at things like SEXY and WAXWORKS to see whether having one diagonal letter different is going to look 'off'.</p>
