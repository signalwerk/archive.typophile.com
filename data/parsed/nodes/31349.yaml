      <p>&gt;conservative</p>
      <p>By my lights, I am not a conservative, either in type or politics, but a reformist. Reformism, as formulated by my late teacher Karl Popper, is the idea that we appreciate tradition as a source of strength, but criticise it, and make reforms to change and improve it where we find it lacking. </p>
      <p>Thus in type revival I do not believe that literal, 'authentic' revivals are worth the effort. But I do think that making 'contemporary classics' is worth the effort. Here I would include such faces as Slimbach's Garamonds and Carter's Miller.</p>
