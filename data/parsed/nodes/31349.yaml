      <p>&gt; All of the Xs are backwards.</p>
      <p>How very interesting. Could Griffo have so consciously been going against so-called "ductal logic"? That would be awesome, and a testament to his power as a designer.</p>
      <p>&gt; Could this have been a layout error or what?</p>
      <p>Extremely unlikely to be a compositing error.<br>
      And almost as unlikely to be a casting error.</p>
      <p>Definitely, absolutely, totally keep it. It would be such a statement. Certain people will sputter in outrage that "it's backwards", at which point the historical precedent (which happens to be the sort of thing they [also] worship) would be a dramatic and much-needed slap in the face.</p>
      <p>hhp</p>
