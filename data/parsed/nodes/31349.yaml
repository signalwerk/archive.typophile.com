    html: |-
      <p>&gt;Griffo was hanged</p>
      <p>The version I read is only that he was accused, and it is not known what happened to him--whether he was convicted and hung or eg. let go on grounds of self-defense. Also there is a version with the son in law and a version with the brother in law. </p>
      <p>In general Griffo modified the handwritten ductus for more even color. This was his breakthrough, ever since imitated. Still the letters retain the 'underlying force' of the hand written models, as that was their point of departure. </p>
      <p>Incidentally, to me the reversed contrast X looks like a mistake.</p>
