  html: |-
    <p><strong>Trying to control quotation marks when typesetting in inDesign:</strong></p>
    <p>I am trying to see if I can make quotation marks change automatically for different languages. For example if I select (in InDesign) the Language drop-down menu in the character palette &gt; my English style quotes would transform into French guillemet quotes.</p>
    <p>I see that just by having the standard repertoire of quotes does not mean easy implementation.</p>
    <p>Otherwise how do French or German typographers call for a specific style of quotation mark?<br>
    - Do the desired marks have to be the default in the font file?</p>
    <p>Any help to solve this mystery appreciated.</p>
    <p>Michael Hernan</p>
