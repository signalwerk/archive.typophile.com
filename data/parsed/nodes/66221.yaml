    html: |-
      <p><cite>Ad. 2. Some applications (Microsoft Word, Adobe InDesign) have an option "Use typographer's quotes" or "Use smart quotes" that replaces the standard "straight quotation mark" characters by the proper marks while typing.</cite></p>
      <p>InDesign applies the correct quote style based on the language set to the paragraph (when "Typographer's Quotes" is checked in the Preferences; can be redefined per language in the Dictionary section) when you manually insert quotes, and on importing when "Typographer's Quotes" is checked in the Import options.</p>
      <p>Unfortunately, there are editors that <em>insist</em> on "international" (essentially, USA English) style of quotes -- usually indicated as "please use correct ones" -- even in entirely French and German texts!</p>
      <p><cite>Stay away from trying to implement this on the font level: you will do more harm than good to your users.</cite></p>
      <p>Absolutely. It sounds more like a gimmick "because we can", than a useful enhancement.<br>
      Compare automatically replacing single and double <em>straight</em> quotes with curly ones. I imagine you can get quite far, using OTF replacements, but I'd ne'er be able to properly typeset Shakespearian text 'nymore. 'Nuff said.</p>
