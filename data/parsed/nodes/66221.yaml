      <p>Principally, there are three "levels" of this kind of support: </p>
      <p>1. Keyboard layouts<br>
      2. System- or application-level replacement of characters<br>
      3. Font-level glyph replacement through OpenType Layout</p>
      <p>Ad. 1. Mac OS X provides better ("richer") keyboard layouts than Windows. In Mac OS X, all the standard keyboard layouts have a very extensive access to various more or less useful characters through the "Option" key. For example, the U.S. English keybaord layout produces the opening double quotation mark (“) through Option+[ and the closing double quotation mark (”) through Shift+Option+[. Also, Option+] and Shift+Option+] provide access to the opening and closing single quotation mark (‘, ’), the latter also serving as the proper apostrophe. Option+\ and Shift+Option+\ provide access to the guillemets (« and »). </p>
      <p>What I like about the Mac OS X keybaord layouts is that there are quite reasonably localized. For example, the Polish keyboard layout uses exactly the same keystrokes for the Polish-localized quotation marks („ and ” plus ‚ and ’ and also the guillemets). </p>
      <p>Both keyboard layouts provide the endash (–) and the emdash (—) through Option+- and and Shift+Option+-. </p>
      <p>The German keyboard layout unfortunately has some mistakes. Since Shift+2 produces the straight quotation mark ("), it would be useful to provide the proper German quotation mark through Option+2 and Shift+Option+2. Those would be „ and “. Unfortnately those keystrokes produce “ and ”, which are useless in German. The opening German quotation mark („) is mapped to Shift+Option+W while the closing mark (“) is mapped on Option+2. This hardly makes sense — but at least they ARE available. </p>
      <p>By pressing those special keystrokes, you always get the proper Unicode codepoints in the text, so the final text encoding is "right". </p>
      <p>In Windows, right Alt could serve a similar purpose but does not. In the Polish layout, the diacritic characters are mapped to right Alt+letter, but all the other keys are not mapped to anything useful. </p>
      <p>Ad. 2. Some applications (Microsoft Word, Adobe InDesign) have an option "Use typographer's quotes" or "Use smart quotes" that replaces the standard "straight quotation mark" characters by the proper marks while typing. Microsoft Word also provides other replacements such as two hyphens to endash and three hyphens to emdash. This is done by replacing the actual characters, i.e. the Unicode codepoints in the text. This is how it should be done. </p>
      <p>Mac OS X 10.6 introduces this ability on the system level. The System Preferences tab is now renamed to "Language &amp; Text" and has a Text tab that includes a "Smart quotes" dropdown menu. But it's not really done right because it's not language-sensitive. </p>
      <p>Similar features are available on some websites — although not here on Typophile. Whenever I input the straight quotation marks (using Shift+' on U.S. English or Polish, and Shift+2 on German), the character codes are replaced when a posting is sent off. </p>
      <p>Ad. 3. The OpenType Layout mechanism has a "locl" feature that allows replacing certain glyphs by other forms depending on the language of the text. Note a big difference: when the replacement is done through an OpenType Layout feature, the Unicode codepoints in the underlying text stay the same. So this is NOT a good mechanism for implementing smart quotes. The "locl" feature is useful for selecting different glyphs that on the encoding level share the same Unicode codepoint — but the quotation marks have different Unicodes. </p>
      <p>All in all, the "smart quotes"/"typographer's quotes" mechanism (level 2) and customized keyboard layouts (level 1) are the best way to implement this. Stay away from trying to implement this on the font level: you will do more harm than good to your users. </p>
      <p>Best,<br>
      Adam</p>
