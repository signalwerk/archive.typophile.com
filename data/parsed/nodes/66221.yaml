      <p>I agree, type level should not lock a user. But thats where I am starting from. This morning I thought all users were locked into my British style of quotes and have been on a journey of discovery to disprove this and see what options there are to make the system more useful if possible...</p>
      <p>OK, by tying in one's native language on a local keyboard using a computer OS's local input method is the way to go and for most people the experience is seamless.</p>
      <p>As I don't have any experience in using the above - I felt I needed to ask the question...</p>
      <p>But here is another... (or I ask again slightly diffidently)</p>
      <p>Why then (in inDesign) is there a language menu in the character palette which gives the option to select (amongst other languages) one of 5 [five] different types of German. What does this do - what are the changes I would expect to see?</p>
      <p>This is not merely to do with Spell check, as I previously thought), as I have been able to use this menu to activate Polish kreska accents when doing some OT code in /locl/.</p>
      <p>Hmm - what other trick can this menu be used for?</p>
