  html: |-
    <p>I was just watching a re-run of Bram Stoker's Dracula made by by Coppola in 1992, and I could swear I saw Industria, a font by Neville Brody in a newspaper headline.</p>
    <p>I had to go and check, and indeed Brody released Industria in 1989, so it might in fact have been used in the film.</p>
    <p>If I was asked, that's just bad judgement from the art director; I've seen my Denim font used in a Harry Potter movie, but that font was specifically designed to mimic metal type on uneven paper, so in that sense it's appropriate, but Brody's fonts were the harbingers (or the very first ones) of new type design movement of the 1990's, so choosing Industria is just wrong.</p>
    <p>But then again, it could be I saw something else…</p>
