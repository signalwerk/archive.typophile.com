      <p>Times New Roman is a very ordinary font and it suffers from having a truly ugly bold which doesn't match the roman. The capitals are too heavy and wide. (Try looking at German copy set in Times) The italic is also too wide – it probably had to match the width of the roman when it was originally drawn – and is also boring. Did I mention the bold? It is ugliness incarnate. Why this font is the mainstay of the desktop poster maker is beyond me.  </p>
      <p>If anyone wants to use a Times style typeface I suggest Times Classic by Dave Farey which is truly magnificent but possibly not commercially available yet.<br>
      (You can post me the cheque Dave)</p>
