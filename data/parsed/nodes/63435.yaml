      <p>And yet when I look at books and magazines published in the 1950s, I see Century Expanded... and numbered Linotype faces that look sort of like Century Expanded. Maybe the odd oldstyle face such as Garamond. And Futura and its imitators every now and then.</p>
      <p>Times Roman? In the <em>'Fifties</em>? Of course, though, I'm thinking of the U.S. publishing scene. It was already in use for book publication in the United Kingdom in the 1950s, but generally in the smaller point sizes (8 or 9 point, as against 10 or 11) which did not show it off to best advantage. (I think the Focal Guide to Photography, for example, is an example of a 'Fifties use of Times.)</p>
      <p>Could just be my memory playing tricks on me.</p>
