    html: |-
      <p>Given that Mosaic used Courier, a monospaced typeface, as its default, Times Roman was an improvement.</p>
      <p>The only other proportionally-spaced choice back then would have been Arial. This was before Georgia came along. (I think we can leave Comic Sans and Impact out of consideration, don't you?)</p>
      <p>So the choice of Times Roman over Arial comes down to it being a serif typeface, which is generally considered more readable and legible. Thus, I would assign primary responsibility for the choice of Times Roman specifically not to Marc Andreessen, but to Bill Gates and Steve Jobs. <em>They</em> could have built Windows around Caledonia or Baskerville instead, had they so chosen.</p>
      <p>But I think that Times was already so popular in the market that they really just went along with the flow as well.</p>
