      <p>Times New Roman is a terribly <em>overused</em> typeface. But that isn't likely to change, and it's not just because of its availability.</p>
      <p>Back when it was less heavily used - in 1968, for example, when a book set in Times instead of Baskerville or Imprint or Century Expanded or Number Twenty-One or Caledonia or Garamond or even Weiss Roman actually stood out from the crowd - it looked fresh and new and modern, but without being <em>excessively</em> or self-indulgently modern, the way a book set in Helvetica, Univers, or Optima might have seemed - it would be clear that it is a face of great beauty.</p>
      <p>I think it's not just a <em>good</em> typeface, but a <em>great</em> typeface. Things move faster these days, so perhaps it won't last quite as long... but I think that a very apt comparison is to categorize it as the Caslon of today.</p>
      <p>When in doubt, use Times.</p>
      <p>(Of course, you can still show you can afford extra fonts for your computer by using Palatino for your resume instead. But if you don't have extra fonts, I would suggest that Times is to be preferred to Arial, let alone Comic Sans, for that purpose.)</p>
