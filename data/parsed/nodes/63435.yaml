      <p>Nimbus Roman <em>does</em> seem to be quite a faithful take on Times Roman. And, as I have mentioned before, I liked Times Roman quite a bit when it was fresh and new.</p>
      <p>But it's interesting that this particular byplay should happen just shortly after, in another discussion group in which I am a participant, I was pointed at the "Nimbo Cumulos" skit from the British comedy series "The Fast Show".</p>
      <p>I fear that even if it is time to move on, the popularity of Times will continue for decades, possibly even ending up rivalling the endurance of Caslon. Yes, people could use Baskerville, or Garamond, or Caledonia, or Starling, or Miller... but will they find it worth the extra effort?</p>
