      <p><strong>Good Font!?</strong><br>
      Times New Roman is a great font with a huge glyph palette other than Greek Cyrillic Hebrew and Arabic it contains useful math symbols and true fractions (including thirds and eighths however missing fifths and sixths) and also contains glyphs for card suites, as ugly as they are in Times New Roman I think they should be included in every font!<br>
      If you add a little bit of stroke on it you can produce expensive logos.<br>
      <a class="freelinking external" href="http://www.guess.ca/Images/GuessCanada/Shop/Nav/TopNav/guessLogo.gif" rel="nofollow">http://www.guess.ca/Images/GuessCanada/Shop/Nav/TopNav/guessLogo.gif</a><br>
      I looks good on screen with the absence of anti-aliasing (unlike many of the super-awesome print typefaces but they're made to be printed so I'm not complaining). It's on virtually every computer out there and that was intended to be a good thing ;)</p>
      <p><strong>Bad Typeface!?</strong><br>
      Never use Times New Roman at 12 points. (The English Teacher was wrong :D)<br>
      Minion has the same set width and the same x-height as Times New Roman at the same point size. Unless there's an extreme amount of punctuation on any given line the text will reflow the same if you make the switch to Minion.<br>
      Never Use Times New Roman in your resume.</p>
      <p>Note: I find the Bold very handy when I'm trying to show people that Bold is not simply a stroke :)<br>
      Hey this is a lot longer than I intended.</p>
