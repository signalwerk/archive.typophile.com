    <p>Women's clothing store CHICO’S: <a href="http://tinyurl.com/5js534" title="http://tinyurl.com/5js534">http://tinyurl.com/5js534</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chicos_4150.gif"></div><p></p>
    <p>It's a squared sans serif that looks a lot like Bank Gothic, Eurostile, or Square 721. But it has pure horizontal and vertical edges that aren't curved at all, a very small corner radius, and the C and O letters are indeed square with the same height and width.</p>
