    html: <p>Hi Daniel. <br> <br>Yes and no I should think. That n is craziness :-) Other than that the most *original* aspect in my opinion is the double serif (on an angle no less) instead of the standard triangular serif. The only thing I can think of off hand is the recent Romain du Roi thread in general discussions, though yours has some assymetrical palatino happening. <br> <br>Props for the sketches. If there truely is no Romain du Roi in digital format, maybe go that direction. <br> <br>Good luck! <br>Randy</p>
