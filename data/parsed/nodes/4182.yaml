    html: <p>I really like this, Daniel. I like the double serif on the m, n, and u as well, but maybe you could "scoop" away some of the vertical stroke at the top right beneath the serif--just a little. The bowl of the b, d, p, and q look a little compressed--or maybe the a looks a little too wide? If experience serves me, Randy Jones may suggest that the r looks like a modified n. You may try lowering the joint where the arm meets the stem. The spine of the s could use a little thickening, too. I love the t. <br> <br>I'm learning myself, so take this for what it's worth. My terminology may be a little off, too. Sorry. <br> <br>Good luck, <br>Addison</p>
