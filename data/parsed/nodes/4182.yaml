  html: <p>I was hoping for a little help.  I've been looking around myself, but there is a vast knowlege base here.   <br> <br>I'd like to know if you know any fonts similar to these sketches, so I can figure out if it would be worth my time to start. <br> <br>Also, and this may be impossible to answer due to the very small number of sketched characters, does this seem like it might be worth putting a little work into? <br> <br><img src="http://www.typophile.com/forums/messages/29/32925.jpg" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/32926.jpg" alt=""></p>
