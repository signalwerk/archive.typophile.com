    html: <p>Those head serifs are more accurately called Jensonian (or something). It's the style Morris applied in his imitation-Jenson stuff, and then the Americans copied it. See Jenson Old Style, URW Cloister and ITC Italia. The RdR head serifs are flat and severe. And to me this doesn't look very RdR at all - there's all kinds of chirographic stuff happening - the RdR is typographique par excellence. <br> <br>BTW, I think that "n" is an "ri". <br> <br>hhp <br></p>
