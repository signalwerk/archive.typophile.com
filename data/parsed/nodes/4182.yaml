    html: <p>Thanks, guys.  I'm almost done with a digitized lowercase that might give a better impression of where I'm going with this.  The historical references are really, really helpful. <br> <br>Randy, that was actually just playing around with the possibility of an "r i" ligature, but it looks too much like an n.  That might be an interesting alternate for the n, come to think of it.  And yes, the dots are too high. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Chase, I have a feeling that I'm going to have to break a lot of my own rules to make this work. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  Let me show you the ditital version, and you can tell me if it's still too crowded.</p>
