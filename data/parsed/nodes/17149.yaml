    html: |-
      <p><em>&gt; I don’t know if this is ethical, but could you generate a pdf for me that says --Habitat &amp; Énergie--in Neo Tech?</em></p>
      <p>Actually it isn't, Sébastien, just as it wouldn't be ethical for someone to copy the identity you're designing for that trade fair and selling it to the client behind your back.</p>
      <p>Furthermore you can use the preview function on websites like <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=24&amp;displayfontid=C.117387.0.0&amp;fontRendererText=Habitat+%26+%C3%89nergie" target="new" rel="nofollow">FontShop.com</a> to generate a proposal, but if you end up using the typeface you still have to purchase a license.</p>
      <p>Don't do anything you might regret afterwards, and try no to forget that type designers need an income to live as well. Thank you for understanding.</p>
