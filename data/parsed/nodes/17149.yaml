    html: <p>Yves, what is unethical about someone who has a legitimate license for Neo tech providing Sebastien with a PDF of those two words or, for that matter, any other text? If I own a license to a font, I can use it in any way that the license permits, and that generally includes setting text either for myself or a client, for a fee or gratis. Unless the license specifically prohibits embedding in PDF files, I don't see anything wrong with what Sebastien is asking for. He is not asking for a copy of the font. He is asking for someone to do a spot of typesetting for him.</p>
