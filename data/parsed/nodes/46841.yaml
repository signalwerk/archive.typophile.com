      <p>I don't go to church, so this could be a complete generalization, but isn't the pentacostal church more of an old-timey fire and brimstone kind of thing? That logo is very modern. Maybe they're looking to attract a more modern audience, but it seems like that would be more appropriate for one of the new mega churches.</p>
      <p>Anyway, the kerning is uneven, and if those are flames, I'm not sure what they represent.</p>
