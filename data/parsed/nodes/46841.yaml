    <p>I’m designing a website for a friend of mine who is a pastor of a Pentecostal church in my town.  Although designing a logo is not part of the job, the logo that he gave me to work with is completely horrid.  I think it’s one of those $99 for a church logo deals, where you select the logo and text you like and they come up with a “customized design” just for your church.  I know: I should be careful doing this.  Direct, positive and constructive criticism would be appreciated!</p>
    <p></p><div class="imageWrap"><img src="/web/20081013104815im_/http://www.typophile.com/files/calvaryway_5025.png"></div><p></p>
