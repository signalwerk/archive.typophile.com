      <p>I agree with the comment at looking at flames for reference, it seems to look more like a water drop with all the flames funneling and shaping in toward the top most point. </p>
      <p>the middle flame probably has the most flame-like shape to it. try to move the left and right flames up and down so that they don't quite line up so much at the top and bottom. it will add tension and interesting visual space if they don't line up so much.</p>
