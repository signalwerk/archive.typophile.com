      <p>Thanks for the feedback.  I’m particularly interested in the perspective of people who don’t go to church, since this will help me avoid churchy cliches.</p>
      <p>This is not a final design, so I’ll work on the kerning later, but thanks for pointing that out.</p>
      <p>The flames reference Pentecost, the Christian holiday that celebrates the coming of the Holy Spirit like tongues of fire to the disciples of Jesus (cf. Acts 2).  Pentecostalism is a varied worldwide movement of Christianity, of which the old-time fire-and-brimstone style is only one type.  This church does not fit that mold.  Could a modern design fit a church that is neither fire-and-brimstone nor a mega-church?</p>
      <p>The congregation is made up of a good number of families, but there is also a significant population of younger people, so I was thinking a modern direction would be more appropriate.  The pastor is not your typical minister.  He’s a 30-something guy who is into a lot of hardcore and rock music, and so I think it fits his personality as well.  Thoughts?</p>
      <p>—<br>
      Nick Hladek</p>
