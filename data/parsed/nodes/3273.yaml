  html: '<p>Hello all. Please let me know if this has been answered elsewhere. <br><br>I need to set a sentence with an em dash. But, because of space reasons, the sentence needs to break. How would I set something like the example below? Does the em dash go to the top line or the bottom one? <br><br>example <br>blah blah blah— <br>blah blah etc <br><br><span class="caps">OR</span> do you place it like so: <br><br>example <br>blah blah blah <br>—blah blah etc <br><br>I remember seeing an article that covers this situation but I can’t seem to ﬁnd it at the&nbsp;moment.</p>'
  html_clean: '<p>Hello all. Please let me know if this has been answered elsewhere. <br><br>I need to set a sentence with an em dash. But, because of space reasons, the sentence needs to break. How would I set something like the example below? Does the em dash go to the top line or the bottom one? <br><br>example <br>blah blah blah— <br>blah blah etc <br><br><span class="caps">OR</span> do you place it like so: <br><br>example <br>blah blah blah <br>—blah blah etc <br><br>I remember seeing an article that covers this situation but I can’t seem to ﬁnd it at the&nbsp;moment.</p>'
