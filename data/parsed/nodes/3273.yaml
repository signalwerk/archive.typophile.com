    html: <p>Felici’s ‘Compete Manual of Typography’ says that much typesetting software sees an em or en dash as an appropriate place to break a line. So I guess the ﬁrst would be the common wisdom. <br><br>Bringhurst in ‘Elements of Typographic Style’ recommends using en dashes to set oﬀ phrases,with a word space before and after. The em dash he recommends using only to introduce dialogue (beginning the sentence), which he says is the European&nbsp;practice. </p>
