    votes: null
    html: <p>To get back to the original question, I hunted through my old PhotoLettering catalog and found a raft of closely related styles to this lettering by lettering artists by the names of C.E. Coryn, Tony Stan and Ed Benguiat (!). One of Coryn's called Coryn Didot had a very similar 'g' except it had a normal 'ear', instead of this straight line. The 'y' was with a much longer, conventional tail. Which brings me to an observation about that y in the copy that Grant liked. Doesn't it look out of character? I think that was 'built' (mutilated) to keep it from cutting into the artwork below. <br> <br>I don't know much about how PhotoLettering's (or their competitors') types were designed and made, but my presumption is that customized versions could probably be ordered the same way you do with digital fonts today.  <br> <br>Did Dwiggins do film type? Or is that a silly question? (I suppose a set of good drawings would be what you use for film type or metal type designs, in the era of this ad.) <br> <br>Anyway, if anyone has any old film type catalogs, that might be a place to look for something more like this type.</p>
