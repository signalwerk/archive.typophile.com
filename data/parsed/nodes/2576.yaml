    html: <p>As far as I know Lithos has no alternate Y, but I think its curves are in harmony with the curves of the rest of the alphabet.  I suppose the curve could have gone the other way and made a cup on top of the stem.  Why couldn't you make your own Y, and what would it look like? <br> <br>If there are too many Mike's for you, you could call me "Fishboy", which is a nickname I use. (I have always been a fish classification fanatic, and I have as many books on fish as I do on fonts. It's no coincidence that I picked Bowfin as part of my business' name -- the Bowfin is the sole surviving member of an ancient, once widespread family of fishes (Amiidae) that arose in the Jurassic era. They still thrive in the Eastern part of the US.  Even though I moved to the West, I can relate to a fish like that.) :-)</p>
