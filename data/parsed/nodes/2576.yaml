    html: <p>Yves, if this is truly hand lettering, it's remarkably consistent.  The effect of the lettering in the ad isn't the issue, in my comment about the 'y' -- it's just that that letter seems inconsistent (stylistically) with all the other letters (See the 'y' in the checklist copy? That's probably the normal y for this typeface). I also can't help feeling that it isn't a very attractive typeface, with its mix of rounded and sorta wedge serifs. The overall impression (to me) is a bit like ITC Fenice that couldn't decide what kind of serifs to use -- ruled, teardrop or triangular, so it used them all.  <br> <br>I realize such judgments are just my opinion, and I agree that this is wonderful draftsmanship if it is hand-lettered. If it was digital type, I wouldn't buy it for my collection, is all.</p>
