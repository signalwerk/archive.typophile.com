    html: <p>Whoa, Jack!  I said it was just my opinion.   <br> <br>No harm intended to you or anyone who likes it.  I like oddities in type at least as much as the next person, it's just *this* type that doesn't appeal to me. My favorites types are ones that look hand-drawn, but that doesn't mean I like ALL hand-drawn types equally well. In fact part of the problem for me is that is *doesn't* look hand-drawn, because it is so precisely done.  Goudy designs have 'irregularities', this one just has things that look out of place (to me). <br> <br>It's OK for us not to be unanimous in adoring this lettering isn't it?  <br> <br>BTW, nice paste -up of my name . You went to a little trouble for that jab in my ribs.</p>
