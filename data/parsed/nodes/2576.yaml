    html: <p>Clarification gladly accepted Jack. I kind of suspected as much, when I noticed the smiley in your post. I thought we were all friends here, but usually when I got called 'Yanega' instead of Mike it was in work and/or in annoyance.  <br> <br>Some hand-drawn fonts I like are those by the late Phill Grimshaw (Kallos, Obelisk, Tempus and a list of script fonts), Timothy Donaldson (Humana family and a list of script fonts) and Carold Twombly (Lithos and Nueva). <br> <br>The Photo-Lettering Catalog is called "Alphabet Thesaurus Nine Thousand"  and is copyright 1960, published by Photo-Lettering &amp; Rheinhold Publishing. It breaks the works of about 120 lettering artists into 58 categories, in 18 major style groupings, spread over 740 pages. The only bad thing about it is that the type showings are not complete typefaces -- they are just lettering samples. I bought it from Oak Knoll Books, a great source of font treasures.</p>
