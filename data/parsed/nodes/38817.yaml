      <p><cite>How is that ’taking that at its word’? What about the rest of the sentence? What about the following sentence? The phrase occurs in the midst of a huge book that begins with the premise that all things were created by God, which is a pretty good clue that this phrase is not a comment on the the linguistic basis of an abstract concept of God. What the beginning of John’s gospel is saying is that both the Father and the Son were present ’in the beginning’: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.</cite></p>
