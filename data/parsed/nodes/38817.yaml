      <p>Bill: <em>“In the beginning was the Word”. Of course that’s Christian phrase—actually originally Stoic...</em></p>
      <p>The original Greek is Ἐν ἀρχῇ ἦν ὁ λόγος, and although ’word’ is the traditional English translation of λόγος in some respects it isn’t a very good translation. Aristotle and other classical authors use λόγος to mean ’sentence’. </p>
      <p>In the beginning of John’s gospel, λόγος very obviously refers to the second person of the Holy Trinity, i.e. to Christ. You only have to read the rest of the sentence and the following sentences for this to be perfectly obvious. Λόγος is a kind of title and a way of saying that the Son comes from the Father as the word/sentence comes from the mouth of the speaker, i.e. that the two are as inseparable as speaker and utterance.</p>
      <p>The particular formulation Ἐν ἀρχῇ ἦν ὁ λόγος is Christian, leaning on Greek terminology from Hellenistic philosophy but, more importantly, consciously referencing passages in the Jewish scriptures e.g. Genesis 15 and 1 Samuel 3, that refer to ’the word of the Lord’ in ways that indicate a distinct person.</p>
      <p>James: <em>I always took that at its word, that the concept of God etc. did not exist until language evolved.</em></p>
      <p>How is that ’taking that at its word’? What about the rest of the sentence? What about the following sentence? The phrase occurs in the midst of a huge book that begins with the premise that all things were created by God, which is a pretty good clue that this phrase is not a comment on the the linguistic basis of an abstract concept of God. What the beginning of John’s gospel is saying is that both the Father and the Son were present ’in the beginning’: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.</p>
      <p>Note, by the way, that Greek verb used here is in a conjugation — imperfect active indicative — that has no direct parallel in English. The traditional ’In the beginning was the Word’ isn’t a very satisfactory translation, because it doesn’t capture the sense of that conjugation. A more accurate, if less rhetorically dramatic, rendering would be ’In the beginning the Word was being’. The imperfect active indicative conjugation indicates an action in the past ’in progress’ as it were, i.e. at the creation the Word already existed. The Greek makes explicit the Christian belief that the Son precedes creation, is himself uncreated and, as the rest of the sentence makes plain, is consubstantial with the Father.</p>
