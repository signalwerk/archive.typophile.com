      <p>Simon, I suspect that that etymology is bogus. The alternate name for Jerusalem is Ariel, not Arial, according to my Hebrew dictionary. And the female of lion, Ari, is Arieh. And ’goddess’ is ’ela’, not ’al’. Aria may be an Aramaic form, I’m not sure. Maybe someone with good Hebrew can enlighten us. </p>
      <p>&gt;“In the beginning was the Word” - if one takes that literally, which font would have been used?</p>
      <p>I take it you mean what script, as printing hadn’t been invented. The Mishnah (about 200 BCE-200) says that a bunch of miraculous stuff in Genesis was created in the twilight of the 6th day, just before creation was finished. This includes script, letters, the stylus, and the actual writing on the tablets of the Ten Commandments—which awaited discovery by Moses many centuries later. The writing on the stone would have been in either Aramaic (language of Abraham) or some Egyptian dialect, as they may not have understood Hebrew, which developed from the language of Canaan. Of course this account would not be accepted by Christians, but that’s as close as you’re going to get to an answer to “In the beginning was the Word”. Of course that’s Christian phrase—actually originally Stoic, but by this point you’ve lost interest :)</p>
