      <p>John, on “logos” as alluding also to Stoic and other Greek ideas, that is what St. Augustine held, as have many other Christians following him, and I think it is likely—though not that the Greeks were proto-Christians, as many medieval Christians held. I read that in the 20th century people have tried to find ancient Hebraic sources, such as you mention, as referring to concepts similar to the Greek ’logos’ but frankly that is forced, and not credible for things that were written down before the Greek conquest of Judea (332 BCE, IIRC). </p>
      <p>In the passages you refer to, the Hebrew of ’word of the Lord’ (devar YHVH) in itself does not imply any “distinct person”, as you seem to think. ’Devar’ has many meanings in Hebrew, including ’thing’ and ’declaration’ or ’utterance’, as well as ’word’. For example, the “Ten Commandments” are called in Hebrew, in the Torah, “aseret devarim”, the ten “words”, meaning ten statements or utterances. </p>
      <p>“Devar YHVH” is an extremely common phrase in the Hebrew Bible, occurring 270 times. (I just did a search—aren’t computers wonderful!) It is regularly used to refer to any message from God to a prophet. You can of course read it as some secret code intended by God to refer to Jesus, unknown to the writers who wrote it down or readers until the time of Jesus. But it’s by no means the plain meaning of the text. </p>
      <p>You should be aware that it is irritating for Jews to be told by Christians who do not know Hebrew what the Hebrew really says, when there is a continuous 3000 year history of interpretation by people who could read the text in the original. Unfortunately many of the polemical Christian readings of the Hebrew Bible are downright dishonest. If you are interested in the literature debunking these tendentious interpretations, by people who know the Hebrew text very well, you can see, for example, the work of <a class="freelinking-external" href="https://www.outreachjudaism.org/OrderForm.aspx?selected=study">Tovia Singer</a>, a current Orthodox Rabbi who has specialized in unmasking these fraudulent polemics. I find this guy amusing as he sounds just like the comedian Jackie Mason—he has tapes, but I’m sure the book will do. You should know that many Christian scholars who do indeed know the Hebrew text do not find this stuff credible either.</p>
