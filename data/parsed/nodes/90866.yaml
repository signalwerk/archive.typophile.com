    <p>Hi, the logo I'm working on is for an Irish development in Haiti. It's essentially a mall (or will be), with shops, cafes, and naturally - a pub.</p>
    <p>Anyway the brief is fairly sparse, but they want celtic imagery/symbols used along with something to suggest the rebuilding project, and an Irish feel.</p>
    <p>This is the first concept. I appreciate any feedback</p>
