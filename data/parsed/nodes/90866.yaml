    html: |-
      <p>riccardO: You're probably right, and the logo is probably a bit on-the-nose. I've worked with this client a few times before, and let's just say they're not big on a subtle approach. That doesn't mean I won't try and sell them a more subdued concept. They definitely want some celtic imagery/symbols in there, but perhaps the regeneration/rebuilding side could be understated a bit more.  </p>
      <p>With regards to the typeface. I'm looking at a few alternatives, but I am trying to avoid the Uncial or overtly-Gaelic-typeface approach. I'm Irish myself (and so are the clients) and we see these typefaces everywhere, on practically every Oirish pub in every city in the world (along with street signs and a lot more in Ireland itself). I've come to dislike them, not just aesthetically but as a lazy way to scream 'THIS IS IRISH'. I'll take a look for something suitable though, less what I'm referring to.</p>
      <p>Luma Vine: Thanks for the tip. I'm probably going to end up using a different typeface. This one is condensed and I might have gone overboard on tightening the kerning.</p>
      <p>Thanks both for the advice.</p>
