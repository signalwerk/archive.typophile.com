      <p>German movie 1970.  Info on the movie at <a href="http://www.thesamecinemaeverynight.net/gentlemen-in-white-vests-1970/" title="http://www.thesamecinemaeverynight.net/gentlemen-in-white-vests-1970/">http://www.thesamecinemaeverynight.net/gentlemen-in-white-vests-1970/</a>.<br>
      This seems to be packaging added later, perhaps by a British distributor.<br>
      Could possibly be a British font like Johnston or Gill Sans, edited to remove the bar on the G. and point the tips on M, N, V &amp; W.  Johnston was commissioned by Frank Pick of London Underground Railways in 1916 for use in signs on the railway system. Original name"Underground." A.k.a. "Johnston's Railway Type." Versions by ITC, P22 and others. Gill was originally produced for the London &amp; North Eastern Railway, and widely used.<br>
      But then again, it is perhaps another sans.<br>
      Don</p>
