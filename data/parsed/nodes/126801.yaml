    html: <p>I like the current Apple mouse ("Magic Mouse"), mainly because the surface works like a track pad, allowing zooming and multidirectional scrolling with no moving parts. It also has one- and two-finger swipe gestures for switching between pages or screens, which I use. I might look like it has only one button (the entire surface), but it has both left and right button function. And I like that it's wireless.</p>
