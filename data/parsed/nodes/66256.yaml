    html: |-
      <p>Looking at those images brought me back to ATypI conference in Leipzig, where Dan Carr made some glyphs to demonstrate the craft of punchcutting. It was just beautiful, and gave a better perspective, when I went to visit Enschedé Type Museum a week after. </p>
      <p>I had a chance to hold in my hands the original punches of Didot Non Plus Ultra, and also the matrices made with them, and the final product: a catechismus printed in that font. The book was the size of a matchbox. I think that the type was between 2 and 3 points. Matrices were not individual, but instead they were made in single lines of text. Most impressive was the fact that I could easily recognize Didot even in that size and the rough paper.</p>
      <p>It was made by Henry Didot somewhere after 1860, and was one his last works. It's too bad, that I could not bring my camera in the museum, because Enschedé is still printing money, so they are pretty pernickety about the rules…</p>
