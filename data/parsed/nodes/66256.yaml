    html: |-
      <p>A punchcutter cuts punches and drives them into a planchet. You wouldn't call the resulting piece a matrix until it had been fitted for the hand mould or casting machine.  Before that it'd be called a strike.</p>
      <p>A matrix engraver cuts a character image into a planchet on a pantograph using a relief engraving pattern, then finishes it for alignment and set width.</p>
