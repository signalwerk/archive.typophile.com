    <p>I'm writing an English article about an old Japanese letter cutter to make originals for letterpress matrices.<br>
    He made them with chisels only. No counter punch is used.<br>
    Since the originals he made are used for Electrotype Matrices, no Punch action, so I was wondering if I should call him "Punch cutter."<br>
    I'm looking for a proper word or a terminology in English to express him.<br>
    Does anyone know the terminology to express a craftsman like him.<br>
    Or may I call him a punch cutter?</p>
    <p>Thanks in advance.</p>
    <p>Kunihiko Okano<br>
    Shotype.com</p>
