      <p>Agree with previous comment, definitely hand-lettered.<br>
      Some I like for this kind of job: <a class="freelinking external" href="http://youngjerks.com/Highway-Typeface" rel="nofollow">Highway</a> by Dan Cassaro, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/hensler2.php" rel="nofollow">Hensler 2</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/chipping/" rel="nofollow">Chipping</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/mexborough/" rel="nofollow">Mexborough</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/chipperly/" rel="nofollow">Chipperly</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/liberty/" rel="nofollow">Liberty</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/symbol/" rel="nofollow">Symbol</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/agora-bq/" rel="nofollow">Agora</a></p>
