    html: <p>I would guess this was hand lettered. Compare the cap S's. Something that could fill the bill as a starting point would be Albertus Black or Flange Medium Italic. You would still have to oblique it and try to condense to match. Or just hire a guy with a big red nose to redraw it.</p>
