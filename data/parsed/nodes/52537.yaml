    html: |-
      <p>A-ha! (So far for my predictions ... ;-)</p>
      <p>This is Adobe's (patented?) Paragraph Composer at work. Rather than filling up every line until it reaches the end, it tries to average spacing and line lengths all over the paragraph. It runs into problems if you want total control over a paragraph's line endings (and the em spaces probably don't help either).</p>
      <p>Using the Paragraph Panel, you can switch to the Single Line Composer, which <em>does</em> work as you expect. In addition, if you want certain phrases not to be split, you can select the entire phrase and apply No Break from the Character Panel's tiny menu.</p>
    html_clean: |-
