      <p>Hi Kuga,</p>
      <p>You will have to excuse the ID poster for making you think you were in the wrong forum. I think he spends too much time in the Photoshop forum :-)</p>
      <p>Turn on Invisible characters, as Agostini suggested. That way you will see (prediction!) that there is nothing wrong with the line breaks; the text consists of a lot of short, paragraph return ending lines.</p>
      <p>The reason that you can copy it into TextEdit and RTF all you want and still get not what you want is that the lines in the PDF are broken there just the same. A PDF <em>may</em> be aware of line endings, but they usually are not. So if you copy text out of it, you get paragraph returns at the end of every single line. (Sometimes lines are concatenated anyway, but not in a reliable way, it's just Acrobat doing guesswork.) TextEdit is not aware the paragraphs should run together and leaves the line endings as they are. Trying RTF does the same, as does virtually every piece of software, unless you <em>tell</em> it that the lines should be concatenated. (Some common word processors, and all programmers' editors can do that.)</p>
      <p>You can select the entire text and replace paragraph returns with a space. No need for GREP fancyness -- just enter "^p" in the regular "Find Text" box, and replace with a single space. Be sure to choose to replace in "Selection" only, so it won't mess up your entire document.</p>
