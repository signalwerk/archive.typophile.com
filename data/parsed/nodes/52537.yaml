    <p>Hello, </p>
    <p>I appreciate that this is sort of off topic or typofile<br>
    but i have been over at adobe forums and all I got was told I was posting in the wrong forum (which I was not...)</p>
    <p>My paragraphs are behaving in a very strange way in InDesign CS2. I have hyphenation OFF and they break erratically, not even at the end of the line sometimes... </p>
    <p>The text has not been imported normally, I have copied it from a pdf.<br>
    I am using a basic paragraph style with up to seven character styles. I am also using a LOT of m—space and n—spaces, multiply characters and indesign small caps (not font based). I have a hunch these are causing the problems but cannot figure out an answer... Any ideas greatly appreciated!</p>
    <p>What I have tried...<br>
    1. opening the files in CS3, no change<br>
    2. copying text into Text Editor, making it plain Text then back to Rich text, no change...<br>
    when i copy the text from my ID doc into basic textEdit characters are lost<br>
    50×75cm becomes 0×75cm<br>
    c189ba becomes 189ba<br>
    3. changed fonts, same thing happens<br>
    4. obviously adobe single line composer is active </p>
    <p>which, leads me to believe i am doing something terrifically wrong in inDesign, ie, it is not the font or the text...<br>
    but i know, deep down inside, that i am doing something wrong myself...</p>
    <p>i have posted a sample file, with a screen shot of what it looks like on my screen, fonts are irrelevant as they all mess up...</p>
    <p>many thanks to anyone who cares to have a look!!</p>
