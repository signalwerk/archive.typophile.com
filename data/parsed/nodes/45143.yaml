    html: <p>How old is this design? It reminds me of the slightly squared adaptions of Cooper Black I've got in showcard &amp; signwriting books from the '40s &amp; '50s. <a class="freelinking external" href="http://www.myfonts.com/fonts/grouptype/cooper-poster/" rel="nofollow">Cooper Poster</a> from Grouptype is the only digitised example I found in a quick search but it is a little too ornate. I think there might be a Nick's Fonts one.</p>
