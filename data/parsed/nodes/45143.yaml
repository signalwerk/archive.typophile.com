    html: <p>I'd say it was a custom job, not based on a particular font, but on the Santa Fe RR logo. The Santa Fe logo goes back at least to the 1930s. Until Santa Fe and Burlington Northern merged in the Nineties, BN used Frutiger (possibly modified slightly) on its logo.</p>
