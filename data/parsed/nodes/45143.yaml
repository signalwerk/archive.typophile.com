    html: |-
      <p>1995! I thought you were going to say 1955. As the layout is very irregular on that circle yet repeated letters appear to be exact I'm imagining it was done with individually cut out letters from a photocopied alphabet. It looks more like a signwriter's work than a graphic designer's. You could get a fairly good match with the original <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/cooper/black/" rel="nofollow">Cooper Black</a> given a slightly heavier weight.</p>
      <p>I can also imagine the rather clumsily balanced BNSF being copied from a book like the one below and then the outer edges cut into for more of a slab serif look.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stevens-cooper_5976.jpg"></div><p></p>
      <p>(Showcard lettering master Mike Stevens personal take on Cooper Black from his mid-'80s book Mastering Layout.)</p>
