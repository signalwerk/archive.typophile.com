      <p>This is one of my interests as I have friends who are -- or have been -- in the cattle business. I even dug up the Canadian government documents on what makes a brand "official." Here are a few things I learned:</p>
      <p>1. You are not to have more than one glyph on an iron. So if your brand is, for example MH, you are supposed to have an M iron and an H iron. In a way, you are setting type on the side of a cow because each glyph is discrete.</p>
      <p>2. A lazy glyph is one that rests on its back. You've probably seen hotels and bars called Lazy J's. If the glyph rests on its face, then it is not lazy -- it is dead; it doesn't count. The Calgary Stampede has a somewhat new brand and, strangely enough, they did not do a lazy S. The S is on its face, and that is wrong. You can see it here: <a href="http://www.calgarystampede.com/" title="http://www.calgarystampede.com/">http://www.calgarystampede.com/</a></p>
      <p>3. In a short period of time there likely won't be any more branding, as it's all being replaced with RFID tags on the ear. So you use a scanner to sort cows, rather than looking for a brand. This is probably better for the cows. However, the community event of a cattle brand will also be lost, which is unfortunate.</p>
    html_clean: |-
