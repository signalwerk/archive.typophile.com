      <p>tmac, 2 May 2013 — 1:11pm: "3. In a short period of time there likely won't be any more branding, as it's all being replaced with RFID tags on the ear. So you use a scanner to sort cows, rather than looking for a brand."</p>
      <p>How is a radio frequency identification biochip supposed to protect the ownership of livestock compared to labels such as visible exterior tags or branding? The ownly [sic] identification provided by a biochip is its barcode number. Nobody would be able to see who owns the biochip unless he uses a radio frequency scanner for the purpose.</p>
      <p>Suppose some farmer were to mark his cattle with biochips. If another person were to try to confiscate any of the cows marked by biochips and claim them as his own, do you think he would not locate the biochip by means of a radio frequency scanner, then excise the mark of the true owner and replace it by implanting biochips of a different barcode number? If a dispute arises, how is the true original owner supposed to substantiate his claim?</p>
      <p>As for the welfare of the animal, who is to know whether the beast would prefer an implanted biochip or an external tag or brand? Probably the chief concern would be about being sent to the butcher. Perhaps cattle would even like having bright yellow or white plastic tags hanging out of their ears. It might make them feel that they belong to an exclusive club. Even humans are known to choose to wear similar accessories. They call them earrings, though they be made of gold, silver, and bronze.</p>
      <p>In the country where I live, I have seen sheep labelled by coloured paint on their backs. I have not noticed any iron branding of cattle hide. I do not know whether cattle have sensation in their hooves, but perhaps a humane way to brand them would be on their hooves, although this might make checking the brands somewhat more awkward.</p>
      <p>I read an article recently in the Irish Times newspaper about calls from farmers to have all domestic dogs marked with biochips. Currently, all pet dogs are supposed to have identification collars, and there is no obligation to have them marked with biochips. There was a campaign of advertisements supported by different groups, such as animal charities, to encourage pet owners to have their dogs biochipped at their own expense at their veterinary clinics. I do not think it is a good idea to make biochipping compulsory. The manufacturer would gain too much influence by guaranteed profits, which would only be fed back in towards new means for making and new markets for marking by implantable microchips.</p>
