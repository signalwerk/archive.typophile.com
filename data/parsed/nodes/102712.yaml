      <p>For what it's worth, I grew up on a sheep and cattle ranch in southern Utah. Our registered brand is a quarter-circle 7 that was drawn up by my great, great grandfather back in the 1860s (quickly redrawn below).</p>
      <p><img src="http://sanpitch.com/junk/quarter-circle-7.png"></p>
      <p>As anachronistic as it might sound, range cattle rustling is still a problem, and an obvious brand burned into the hide is still the most effective way to deter thieves. It's also the best way to identify the owner of a wayward animal from a distance (always a problem). Even so, it's terribly painful and traumatic for the cattle, and likely one of the reasons I didn't pursue the family business. Many ranchers today freeze the brand into the hide rather than using a hot iron.</p>
      <p>Our sheep were branded with a quarter-circle 7 as well, but branded with paint after being sheared in the spring. The permanent markers on a sheep are accomplished with ear notches . Our registered ear notches consisted of the end one ear being cut off, a small slit in the other with an adjacent round hole being punched. This was done when the lambs were a couple of months old and performed simultaneously with castration, various inoculations and tail removal (all done with a sharp knife). It makes for a very bloody day, and again, contributed to me veering away from the family business.</p>
