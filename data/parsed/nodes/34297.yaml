    <p>Hello Typophile amigos, I recently completed a basic Dreamweaver website in honor of Jan Tschichold. And in my quest for knowledge I found the ever so awesome Japanese magazine IDEA did a whole issue on Jan Tschichold it was actually, IDEA NO. 321 : Works of Jan Tschichold. If I wanted to order this from Japan I’m looking at $67. Does anyone know where I can pick up this issue in the states? I live in Las Vegas so my outlets here are pretty nill. S-O-S!</p>
