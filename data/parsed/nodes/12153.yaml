    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12154" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Organizations</a>&nbsp;: Society of Typographic Aficionados</strong> (<span class="caps">SOTA</span>)</p>
    <p>The <strong>Society of Typographic Aficionados</strong> (<span class="caps">SOTA</span>) is an international not-for-profit organization dedicated to the promotion, study, and support of type, its history and development, its use in the world of print and digital imagery, its designers, and its&nbsp;admirers.</p>
    <p><span class="caps">SOTA</span> exists for the affordable education of its members and participants; to further the development of type, typographical information and typography; and to appreciate on multiple levels the attributes of type, typography, design, the book arts, and calligraphy. Furthermore, <span class="caps">SOTA</span> is committed to sponsoring relevant topics in pursuit of these goals. <span class="caps">SOTA</span> pursues these goals through an annual conference, <a href="/node/12014" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeCon</a>, held in a different host city each&nbsp;year.</p>
    <p><span class="caps">SOTA</span> was formed in 1998 by typophile <a href="/node/13689" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bob Colby</a>, with the mission to increase public awareness and appreciation of the art and history of typography and its function in creating beautiful and successful communications. In keeping with these goals, <span class="caps">SOTA</span> is defined as a cultural (rather than a business)&nbsp;organization.</p>
