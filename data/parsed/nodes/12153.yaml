    <div class="node-spam-content"><p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : Society of Typographic Aficionados</strong> (SOTA)</p>
    <p>The <strong>Society of Typographic Aficionados</strong> (SOTA) is an international not-for-profit organization dedicated to the promotion, study, and support of type, its history and development, its use in the world of print and digital imagery, its designers, and its admirers.</p>
    <p>SOTA exists for the affordable education of its members and participants; to further the development of type, typographical information and typography; and to appreciate on multiple levels the attributes of type, typography, design, the book arts, and calligraphy. Furthermore, SOTA is committed to sponsoring relevant topics in pursuit of these goals. SOTA pursues these goals through an annual conference, <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a>, held in a different host city each year.</p>
    <p>SOTA was formed in 1998 by typophile <a href="/wiki/Bob%20Colby" class="freelinking" rel="nofollow">Bob Colby</a>, with the mission to increase public awareness and appreciation of the art and history of typography and its function in creating beautiful and successful communications. In keeping with these goals, SOTA is defined as a cultural (rather than a business) organization.</p>
