    <p><a class="freelinking external" href="http://www.fontbureau.com/fonts/AlixFB/" rel="nofollow">FB Alix</a><br>
    With a vintage Selectric typewriter as his muse, <a class="freelinking external" href="http://www.fontbureau.com/people/MatthewButterick/" rel="nofollow">Matthew Butterick</a> set out to make a monospaced font that preserved the liveliness &amp; comfortable readability of a proportional design. <a class="freelinking external" href="http://www.fontbureau.com/fonts/AlixFB/" rel="nofollow">FB Alix</a> was inspired by IBM’s Prestige, a ’50s stalwart, but features true cursive italics, not sloped variants. An OpenType set of proportional alternates allows for more conventional text fitting while retaining the classic typewriter look; FB 2011</p>
    <p>4 Styles: Regular, Italic, Bold, Bold Italic</p>
    <p>FB Alix is available as OpenType fonts with oldstyle figures and stylistic alternates.</p>
