    <p>Hello everyone!</p>
    <p>I got a problem:<br>
    I wanted to try out to make some kind of poster like it was used in the movie "The Spirit". I already found out that the "My city screams"-letters are some kind of Swiss-font, but I really struggle with the logo. I got the bad thought that it's a custom logo and no real font is existing of it. </p>
    <p>This is the poster:<br>
    <a href="http://www.impawards.com/2008/spirit_ver5_xlg.html" title="http://www.impawards.com/2008/spirit_ver5_xlg.html">http://www.impawards.com/2008/spirit_ver5_xlg.html</a></p>
    <p>Anyone maybe got an idea if my thought is correct or does know a similar font like that one please?</p>
    <p>Help would be greatly appreciated.<br>
    Thank you very much in advance</p>
