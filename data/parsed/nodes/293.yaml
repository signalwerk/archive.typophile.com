  html: "<p>Hello, I am a newbie here and a newbie to the whole font creating thing, so hello everyone, and I've been struggling with a following issue for weeks now: <br>I was given a bunch of .fog's created on Mac to convert and generate PC TTF fonts. I also wanted to make Italic versions of them, which I made with the simple Element:Transform:Shear -12. They converted fine, but I have a problem with family building. I generate two TTF's: the original one and the italic one, setting the Font Info:General attributes respectively to Font and Font -Italic. When I try to add them via ATM Deluxe I use for managing all my fonts, it would show up only one of the two fonts. ID changing didn't help. Am I missing something or is there something wrong w/ the Fontographer itself? Is there any other tool/program I could use for such conversions/modifications?</p>"
  html_clean: "<p>Hello, I am a newbie here and a newbie to the whole font creating thing, so hello everyone, and I've been struggling with a following issue for weeks now: <br>I was given a bunch of .fog's created on Mac to convert and generate PC TTF fonts. I also wanted to make Italic versions of them, which I made with the simple Element:Transform:Shear -12. They converted fine, but I have a problem with family building. I generate two TTF's: the original one and the italic one, setting the Font Info:General attributes respectively to Font and Font -Italic. When I try to add them via ATM Deluxe I use for managing all my fonts, it would show up only one of the two fonts. ID changing didn't help. Am I missing something or is there something wrong w/ the Fontographer itself? Is there any other tool/program I could use for such conversions/modifications?</p>"
