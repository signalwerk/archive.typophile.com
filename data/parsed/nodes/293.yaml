    html: <p>&gt; Element:Transform:Shear -12 <br> <br>Many "users" wouldn't notice (at least not consciously), but I assume you realize that mechanical transformations like that produce inferior results. If you look at almost any italic (even ones called oblique that maintain the Roman structures, but especially so-called "true" italics that are totally different than the Roman) you'll see that at the absolute very least there has been some manual post-processing, but very often the whole thing is redrawn. Also, the larger the angle you use, the greater the distortion. <br> <br>At the very least, call the resultant fonts "Oblique", not "Italic". <br> <br>hhp <br></p>
    html_clean: <p>&gt; Element:Transform:Shear -12 <br> <br>Many "users" wouldn't notice (at least not consciously), but I assume you realize that mechanical transformations like that produce inferior results. If you look at almost any italic (even ones called oblique that maintain the Roman structures, but especially so-called "true" italics that are totally different than the Roman) you'll see that at the absolute very least there has been some manual post-processing, but very often the whole thing is redrawn. Also, the larger the angle you use, the greater the distortion. <br> <br>At the very least, call the resultant fonts "Oblique", not "Italic". <br> <br>hhp <br></p>
