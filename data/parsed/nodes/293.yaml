    html: <p><i>&gt;Anyway, I should reinstall my Fontographer/ATM  <br>&gt;and then take another look, I guess.</i> <br> <br>I think this is not very recommendable for a trouble like  <br>yours. Specially for ATM. Besides not being recommendable, <br>I don't think reinstalling your softwares will solve the problem. <br> <br>Is the italic font correctly generated? Check out with Windows  <br>default font showing (just double-click your font files on Explorer). <br> <br>Btw, you don't need ATM to install TT fonts on Windows. <br>Try installing via Control Panel&gt; Fonts.</p>
