    html: <p>You should at least "insert points at extremes", <br>after slanting/skewing your font. IIRC, you can  <br>do it using the Clear Paths command (Ctrl+Shift+C  <br>for PCs). <br> <br>Anyway, I don't know what is going wrong with  <br>your ATM. I tried generating italic fonts at home  <br>last night and it worked just fine. <br> <br> <br><i>&gt;it would show up only one of the two fonts. <br>&gt;ID changing didn't help.</i> <br> <br>Which one is showing up? The regular, I suppose. <br>What do you mean by "ID changing"? <br>Just some questions to see if we can help you. ;-)</p>
