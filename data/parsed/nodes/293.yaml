    html: <p>&gt; mechanical transformations like that produce inferior results <br> <br>I am aware of that. However, I wanted to make those italics in the 'quick and easy' way, as it is the voluntary part of my job. Besides, the font is sans-serif grotesk (like Helvetica, I hope I got the terminology right), so simply shearing it does not do it much harm, and I was told that -12 is the optimal angle for such transformation. <br> <br>Anyway I'm in trouble, when it comes to discussions like this, as there are like 2-3 font professionals in my country which is not that big itself, and font design is not taught in schools, so I guess forums like these are the only place to learn things. <br> <br>I will keep in mind the Oblique suggestion, thanks <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
