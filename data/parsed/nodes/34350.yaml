      <p><em>plausible alternatives</em></p>
      <p>Plausible? Well, that's the "agenda" of which David speaks.</p>
      <p>Different stakeholders have different notions of what is plausible, different agendas (quite often, hyping their new "readability" design).<br>
      Me, I can't take the science seriously unless the starting point is testing the types that have become the norm -- and yes, that includes Adobe Garamond -- not because of prejudices that engineers, artists, designers, neurologists, typographers, capitalists, whoever, bring to the table about what is "plausible", but because those are the fonts that are used most. </p>
      <p>1. Test the most used fonts, both sans and serif<br>
      2. Test them in different settings: vary line length, leading, size<br>
      3. Test them against different demographic groups</p>
      <p>That should keep someone busy for a while.</p>
