      <p>But what if the question is only, "which performance is louder?"... That's my point. In the same analogy, two orchestras with the same number of horns, violins and kettle drums have the potential to be equally loud, but one orchestra could be the grade school orchestra I was in once upon a time and the other could be the Toronto Symphony Orchestra. Obviously equal only if you are very selective and not at all rational in how you evaluate them. One could just forget about legibility for a moment and take some time to think about the "voice" you want to communicate with. This is a concept that is quite foreign among people I've met who test fonts for legibility. </p>
