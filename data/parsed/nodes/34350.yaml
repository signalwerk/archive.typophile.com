      <p>In his own time, with his copy-heavy ads, Ogilvy was against the grain of the "word+image=big idea" school of advertising which won all the awards and made the history books. But he was very successful and not alone in his method.</p>
      <p>Nowadays, would anyone dream of putting so much text in an ad? Very rarely, but that's not to say that text-centric marketing has vanished, as there is a whole genre of advertorial newsletters in print and online, and often the editorial in periodicals is thinly disguised advertising. Just look at the massive auto and real estate sections in daily newspapers, hardly objective journalism.</p>
