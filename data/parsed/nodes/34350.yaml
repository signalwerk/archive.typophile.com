      <p>Of course, by this silly argument, we couldn't keep thinking stuff all day without having to shut down our brain from time to time. Hmm. </p>
      <p>Eye strain is one of the easiest, least subjective aspects of reading to measure, because eye movement is controlled by muscles and we can compare how those muscles move when performing different tasks, including reading different typefaces. Obviously there is going to be greater variability in eye strain between larger factors, e.g. different sizes of type, quality of reproduction, etc.</p>
      <p>Muscles get tired, so eye-tiredness is, if you'll excuse the phrase, a no-brainer. The brain doesn't have moving parts, so in what sense does it get tired? Obviously not in the same sense that eyes get tired. What happens is that <em>we</em> get tired -- get holistically tired, if you like --, and lack of rest starts to affect the brain's ability to function properly. Unlike muscle fatigue, which can be addressed by resting or refocusing the particular muscle groups -- e.g. closing your eyes, looking at more distant objects --, brain fatigue requires overall rest (during which the brain, ironically, may be quite active for long periods).</p>
      <p>So long as I am well-rested, my brain  doesn't get tired from reading, and if it does get tired -- i.e. my attention wanders, my content retention diminishes -- that is symptomatic of general exhaustion, not because I've overexhausted my synapses. My eyes always give out before my brain does.</p>
