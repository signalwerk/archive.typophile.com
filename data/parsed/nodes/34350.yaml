      <p>"apparently researchers have only just started trying."<br>
      I think you'll find that many interests were involved before 1999 in the publishing world, and many more have sprung on this since 1999, and that x900 more will begin springing up since the beginning of the year 2007. What I learned about print, was that aside from abnormal behavioral or physical causes, most print reading fatigue is related to being generally fatigued, then comes lack of good physical reading posture for the given environment, and then quality of reading material. For screen, aside from abnormal behavioral or physical causes, it's reversed. </p>
      <p>This reversal (and recent mushrooming) is, I believe caused by what causes all reading fatigue --additional interference in the reading path by unclear edges and adjacentcies in the material, and there is just a whole lot more of it on the screen. It'll be interesting to see what the pros come up with though.;)</p>
