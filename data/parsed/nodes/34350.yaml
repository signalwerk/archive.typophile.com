      <p>Colore, I have suggested before in this forum a measure for reading fatigue. My thought is that it is not so much the eyes as the brain that is tired when type and typography is less than optimal. My suggestion was to measure how soon reading comprehension declines over time--from fatigue--under varying conditions. </p>
      <p>To my knowledge, this kind of experiment has not been done yet.</p>
