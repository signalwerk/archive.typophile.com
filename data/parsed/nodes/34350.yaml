      <p>David wrote:<br>
      "But in this case it’s just a matter of using fewer words...when MS sets up tests, they use 100’s sometimes 1000’s of words. ClearView’s testing is better — as fewer words are used"</p>
      <p>The Clearview testing used fewer words only because of the impracticality of creating dozens of signs. I prefer to counterbalance and use 20 or more words per condition (never thousands) to reduce word effects. The word <em>table</em> will always be recognized faster than the word <em>yacht</em> no matter what conditions I compare. Making similar word lists and showing different word lists to each reader reduces these kind of effects. Fewer words are not better.</p>
