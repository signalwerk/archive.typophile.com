      <p><em>To my knowledge, this kind of experiment has not been done yet.</em></p>
      <p>Claude Hopkins was working "in the field" along those lines in the 'teens and 'twenties:</p>
      <p><a href="http://www.amazon.com/Life-Advertising-Scientific-Classics-Library/dp/0844231010/ref=pd_sim_b_4/102-2409949-6472113"><em>Scientific Advertising</em></a></p>
      <p>IIRC, he used split runs of direct mail promotions to refine which advertising techniques worked best.<br>
      The pieces were text heavy -- he was a copywriter. A great influence on another text-centric ad man, David Ogilvy.<br>
      It's been a while since I read the book, and I don't recall whether he tested different type treatments, or just different copy.<br>
      I do remember that Ogilvy used the split-run technique to test two identical versions of a charity ad, one with positive type and one with reverse, and the positive type raised way more money, not just a percentage, but something like ten times.</p>
