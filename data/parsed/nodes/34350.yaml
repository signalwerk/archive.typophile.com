      <p>&gt;I’ve been partnering with optometrist James Sheedy’s visual ergonomics lab to learn more about eye fatigue.</p>
      <p>That's great. But if there is a real difference between legibility [ability to distinguish letters quickly and accurately when flashed at you]  and readability [ease of absorbing meaning] then increased brain fatigue as opposed to eye fatigue must be involved in equally legible but less readable material.</p>
      <p>Looking only at eye strain would seem to prejudge the issue that there is no valid distinction. Why not look actively for this, and actually test it rather than prejudging it?</p>
      <p>After all, typographers for over fifty years have thought the distinction is valid. They may be wrong, but such a prevalent view is at least worth testing, it seems to me. </p>
      <p>Also it seems to me that the mental fatigue factor should be pretty readily evident, as you can always lengthen reading time to where everybody gets fatigued and performance--either speed or comprehension or both--go down. Then you can see whether there is a difference between, eg, the same font with different leading and measure, or different fonts that test as equally legible.</p>
