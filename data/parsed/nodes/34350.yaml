      <p>the way people experience fatigue from reading is by not bothering to finish something... In a magazine, which as I recall is where Ogilvy placed those ads, there's always something else to move onto - Even if it's the next ad or piece of junk mail.</p>
      <p>Nobody reads a half page and goes, "Man, I'm whacked!" They just turn the page, without even knowing why.</p>
      <p>I think it would be next to impossible to pick one face as 'the least tiring'. But you could set some parameters that will tend to indicate if a font could be less tiring than some others. You could start with open shapes, large counters, Large(ish) x-height and tracking that isn't too tight and so on. In other words, almost any well designed typeface intended for imersive reading. </p>
      <p>Nick, I was just involved in some 'legibility' testing for a signage typeface with a well know Canadian institute for the blind, here in Toronto... (round 2, if Joe is reading. I forced a second round of testing after pointing out some serious flaws in the first round). The trouble with this sort of testing so far as I have seen (with the notable exception of ClearviewHWY) is that nobody doing the testing knows anything about typography ("X-height is how big the letters are, right? - And kerning is how far apart the are, and serifs are..." "UH, yeahwhatever") and the discount the skill of the designer, and then make ridiculous comparisons of completely dissimilar typefaces the basis of their experiments. </p>
      <p>R</p>
