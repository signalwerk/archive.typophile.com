      <p>&gt;So long as I am well-rested, my brain doesn’t get tired from reading, and if it does get tired — i.e. my attention wanders, my content retention diminishes — that is symptomatic of general exhaustion, not because I’ve overexhausted my synapses.</p>
      <p>In general, any repetitive task, mental or physical, I think tires one quickly. For example, if you do a series of sums non-stop I predict that in not such a long time you will start to make mistakes, and not because of general fatigue. --If you switch to push-ups, you won't do fewer than you would be able to at the beginning. I may be wrong, but that's the kind of thing I'm talking about.  </p>
      <p>If you don't experience this, you are blessed. I personally cannot keep at a single task non-stop without experiencing 'brain fry' at some point within an hour. So I stop, take a short break, read Typophile :), and then return to the work task. </p>
      <p>According to the book <a href="http://books.google.com/books?id=fVL5fFYYV5MC&amp;pg=PA38&amp;lpg=PA38&amp;dq=cognitive+fatigue&amp;source=web&amp;ots=wlJ4NeYThd&amp;sig=I88qvoXpECkzflqbBR67EQqikSA#PPA37,M1">Fatigue as a Window on the Brain</a> "cognitive fatigue" is a reality, and I see from googling that there are scientific articles on cognitive fatigue in astronauts, soldiers, victims of multiple sclerosis, stroke and others. Some of this relates to the impact of physically induced fatigue on mental performance, but others seem to look at the impact of mental tasks. </p>
      <p>Kevin Larson above seems to think this is a legitimate area of research also. </p>
      <p>I agree with you that eye fatigue is certainly real--I've had headaches from wrong lens prescriptions, for example--but so is cognitive fatigue, both in my experience and it seems from the scientific literature. </p>
      <p>edit: <a href="http://cat.inist.fr/?aModele=afficheN&amp;cpsidt=17119944">This article</a> reports a test of mental fatigue due to visual attention tasks.</p>
