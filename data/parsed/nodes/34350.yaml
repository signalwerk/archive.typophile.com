      <p>Hrant, that was an illustration; here is a definition: </p>
      <p>"'Legibility' is based on the ease with which one letter can be told from the other. 'Readability' is the ease with which the eye can absorb the message and move along the line."</p>
      <p>That definition--which includes both speed and comprehension--is from 'Types of Typefaces', 1967, reflecting current usage. According to the acknowledgments those who read the MS of the book and presumably did not have an objection to the definition include W. Hunter Middleton, Ed Rondthaler and Beatrice Warde.   </p>
      <p>If you want to introduce a new distinction, that is fine, but you and I don't get to decide on the meaning of publicly used words; it is what it is. In this case the definition reflects the usage in the type community it seems since the 30's.</p>
