      <p>From Before and After Magazine, “What’s the right typeface for text”, an excerpt from their book <em>Before and After Graphics for Business.</em></p>
      <p>While many typefaces meet the requirements of legibility, readability, and beauty, the following four are the ones we reach for most often:<br>
      •Adobe Caslon (most readable typeface);<br>
      •Adobe Garamond (easy to read and elegant, too);<br>
      •Stone Serif (boring to look at but buttery to read);<br>
      •Janson Text (middle ground between the earthy, workmanlike nature of Caslon and the high classiness of Garamond.)</p>
