      <p>That is already being done, as I understand from Kevin Larson's posts here. </p>
      <p>I think measuring decline of comprehension with time might better discriminate between better and worse type and typography.</p>
      <p>I don't know whether it will turn out to be a more sensitive measure, but it seems to me worth a try. </p>
      <p>One might also measure decline of speed with time, which so far as I know has also not been tried. </p>
