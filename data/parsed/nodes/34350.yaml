      <p>David wrote: "Make up your mind." </p>
      <p>I'll try to be clearer. In the Clearview study they looked at 6 font conditions on 2 kinds of signage materials for a total of 12 conditions. They created a word list of 6 words and attempted to make the 6 words similar to each other. They created signs for each word they used for each condition - a total of 72 signs. Participants identified the same six words in each condition. I imagine that it's somewhat expensive to create each sign, and therefore impractical to create to use 20 words and 240 signs or 20 different counterbalanced words in each condition for 2880 signs. Since my testing is either of computer type or printed on regular paper, it is not much more expensive to use 20 or more counterbalanced words per condition. </p>
      <p>The advantage of using more words per condition is that it's possible to be more confident in your result when you find that words from one condition consistently perform better than words from another condition no matter what the word used. When cost is not a concern there is an advantage for using more words; it is not advantageous to use fewer words.</p>
