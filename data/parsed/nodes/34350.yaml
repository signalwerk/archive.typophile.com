      <p>"whats the less eye tiring font?"<br>
      I'll assume this means to read. </p>
      <p>"which for computer screen and which for printed media"<br>
      For screens users prefer to ¡see! either b &amp; w, grey scale or ClearType but usually San Serif types. There is debate, indicating to me a wide spectrum of user preference (as well as a loud club of "invented HERE" pushers-in-action), over these three rendering techniques, and which is best for any given combination of user, screen, environment and reading preferences. When seeing is not enough and ¡reading! is desired, *things* change, but it's difficult to know exactly how since no one has done comparative studies of the same fonts and readers and content.</p>
      <p>Print is easy, people like to read serif fonts. Adobe Garamond, Poynter Old Style or Century Schoolbook are three good examples of widely used text faces for print that do not tire users out as much as others. </p>
      <p>Good luck!</p>
