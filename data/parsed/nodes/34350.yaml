      <p>Bill: [perhaps] having demanding reading material will also help get more sharp discrimination to show up.</p>
      <p>Hrant: No, that moves the measurement from perception to comprehension,<br>
      with the latter being outside the scope of typography and type.</p>
      <p>Legibility I think is primarily a perception issue--distinguishing one letter form from another. But readability has to do with ease of comprehension. While it is difficult to draw the line between perception and cognition--there are layers of processing--poor typography I think is cognitively taxing. So with fatigue induced by long reading of demanding material, the differences between better and worse typography may be more evident as our 'elasticity,' our ability to put out more effort and compensate for the problems will pass its limit. </p>
      <p>Actually, looking at some of the material on line about cognitive fatigue, the differences in better and worse typography may show up also in subjects who are physically fatigued. Just have the subjects run five miles (if they are not marathoners!) and have them read something demanding with varying typography, and the differences may show up clearly.</p>
