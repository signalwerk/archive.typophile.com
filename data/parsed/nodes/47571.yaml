  html: |-
    <p>Hello!</p>
    <p>This is my typeface Epiphany.<br>
    It is a contemporary interpretation of Russian skoropis. Epiphany has its origin in calligraphic scripts of 15-17 centuries, but it has almost no contrast. I saved typical calligraphic movements and historical letterforms, but I removed original skoropis tool (goose quill). So, Epiphany is not a revival, but skoropis of our days. It has rich set of Cyrillic ligatures and alternates.<br>
    Now I want to create Latin letters for Epiphany. What can you advice me? Are there any Latin calligraphic styles which are suitable for my typeface?</p>
    <p>Thank you!<br><img src="/sites/default/files/old-images/epiphany_poster_900_600_6684.gif"></p>
  html_clean: |-
