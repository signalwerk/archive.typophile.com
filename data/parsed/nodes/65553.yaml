    html: |-
      <p>Hi Ina, </p>
      <p>I think the closest you can come in the Adobe Font Folio is Myriad Semi Condensed. A little further away is Frutiger. </p>
      <p>A couple other thoughts could be Din Mittelschrift if you want to focus on the industrial road signage concept. I also have to suggest Trade Gothic because it's the only Font Folio sans-serif I like.</p>
