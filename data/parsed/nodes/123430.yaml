      <p>You're right, no official stores in Vermont, sorry. My understanding is that the OS was included on a thumb drive, at least it used to be, but the page below seems to indicate that recovery is now via the internet.</p>
      <p><a href="http://support.apple.com/en-us/HT4718" title="http://support.apple.com/en-us/HT4718">http://support.apple.com/en-us/HT4718</a></p>
      <p>Installing an entire OS via dialup would be very difficult, but a custom install of one font included with the system should be doable.</p>
      <p>Or a licensed retailer may be willing to give it to you. Or if you use Apple's backup software, Time Machine, or other backup software, you may have a copy of it already.</p>
