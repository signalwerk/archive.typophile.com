      <p>Tasmeem comes with a set of Text Shaping pre-sets that can be relied on for basic styles of text, including one that represents a typical book style, the sort a scribe would use for copying a long text, as distinct from the kind of elaborations found in calligraphy. Yes, if one enters into the Word Shaping options or starts editing the Text Shaping options, then one needs to have a sense of the calligraphic aesthetics, but there's no need to engage in that side of Tasmeem at all: you can just select your text, switch to the Tasmeem Naskh font, and select ‘Naskh Standard’ from the Text Shaping pre-sets. You get something pretty typical of jobbing scribal work:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tasnaskh_4062.png"></div><p></p>
      <p>For modern texts, I prefer a more obvious distinction between inter-word spacing and intra-word spacing. These can be easily and globally edited using Tasmeem's Arabic Spacing controls.</p>
