    <p>Hi everyone,</p>
    <p>I'm a Middle East Studies graduate and am now going to teach Islamic art at a university in Brazil. As I'm afraid I'm going to have to do a lot of writing and translation for my future students, I'd like a suggestion of a font that fits that kind of work. For my thesis I used Arno (typeset in Latex). Now that I'll be a professor, I guess I'll have some money to spend on (other) fonts. But it must be one for extensive use, not just for one or two papers, and with all ligatures and old style numbers. I'd also like it to have a "modern" feel. If I need to write in Arabic, I guess the Arabic Typesetting font seems the best choice around.</p>
    <p>Any suggestions?</p>
  html_clean: |-
