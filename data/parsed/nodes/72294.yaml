      <p>I really used Latex just for having a decent output with little effort. As far as I know, either no Middle East Studies or Arts journal would accept Latex.</p>
      <p>I was just concerned to have a decent, nice-looking font (I still haven't decided between Arno and Kepler) and a good typesetting engine to translate some book chapters and papers for my students. </p>
      <p>All printing will be done on a4 or letter paper, by a standard laser color printer (which I'll probably have to buy myself). All this work is because I fear very few students will be able to read the original textbooks, and as far as I know Brazilian publishing houses have no interest in publishing such time-consuming, fancy books.</p>
