      <p>Your "hack" (AKA "macro" or "definition" in TeX) is just fine for preparing material for students. But likely your professional carrier will require both journal articles and books. Many of the journals do have a standard style for submitting manuscripts, books less so. Point is, editors will have to be able to open &amp; work with your files. Oft times, LaTex (or any TeX) won't be acceptable. MS Word is the standard text editor, with the characters in proper Unicode.</p>
      <p>The other issue is color management. Plain Tex, which we used with an extensive set of macros, wasn't good at it. This was the biggest reason we shifted to InDesign. InDesign's H&amp;J algorithms are dreadful to one use to TeX, but while the color management can be difficult, it can provide what you need. Just how involved an author needs to be with color management is a separate question, but art usually involves images, and color management is critical there.</p>
