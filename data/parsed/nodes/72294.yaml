      <p>When you are dealing with art -- esp. paintings, it is hard for those downstream to know what the original image really looked like. You can have all the technical capability in the world at the publishing/printing end, but even though you may know the characteristics of the press and paper the image will print on (i.e, have a perfect ICC profile for the press), the person preparing the art for printing will have no idea what the original looks like beyond the supplied image.</p>
      <p>But you're right, the color management problems we encountered were in preparing mixed halftones and color, where the images ran with the text (not a gallery), using our version of Plain TeX. That may not hold for other implementations of TeX.</p>
