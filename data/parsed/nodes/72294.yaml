      <p>If he is going to teach Islamic art, then fonts like FF Amman are out of consideration.</p>
      <p>Tasmeem is pretty good, but one need experience in Arabic calligraphy and rules, Tasmeem gives you tools to shoot yourself in the foot, I've seen both very good and very ugly (ugly to the degree that I'd consider it a calligraphic <em>crime</em>) work done with it.</p>
      <p>Arabic typesetting looks best as a display font, but too light for body text (in my experience, people find it unreadable).</p>
