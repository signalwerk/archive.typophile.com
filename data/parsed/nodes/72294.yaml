    html: <p>I used ConTeXt (a TeX based macro package akin to LaTeX and plain TeX) to typeset books that went for print, it had all colour management feature that I needed (my books are Arabic, with no single mathematical formula; not the typical TeX user). I know many journals that do accept TeX and LaTeX (and I know for at least one big scientific publishing house here that is based on LaTeX), but it depends on what field you are into.</p>
