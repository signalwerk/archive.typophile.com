      <p>Re. Arabic text:</p>
      <p>Do you plan to continue using LaTeX, or are you open to other software? I recommend taking a look at the Middle East version of Adobe InDesign, which includes the Tasmeem plug-in for which you can purchase special Arabic fonts including DecoType's Naskh and award-winning Nastaliq. In the context of your work, I think the great benefit of using Tasmeem is that your Arabic text would reflect the canons of Islamic aesthetics, i.e. the form of the text would reinforce what you are teaching.</p>
      <p>For English text, you could do a lot worse than Arno Pro, and it will harmonise pretty nicely with a traditional naskh Arabic. Personally, I'm a huge fan of Kepler, which has a more modern feel than Arno, but it might not harmonise so well with the Arabic.</p>
