    votes: null
    html: |-
      <p>But they're usually too long in any font, so shouldn't be in the body anyway. If one puts them as footnotes there's less reason to use a monospace font, although a font with distinct I/l/1 etc. is still very important (which of course is another reason to switch fonts when embedding in text). BTW, besides nicely marking visual contrast a monospace font is great for conveying a computery flavor.</p>
      <p>hhp</p>
