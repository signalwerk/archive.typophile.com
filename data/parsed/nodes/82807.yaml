    html: |-
      <p>Won't a very low underline collide with the next line?</p>
      <p>TinyURL only "translates" the link, so it will work as long as: the target is still around; TinyURL is still around! Some other services actually keep a copy of your target (which might sometimes be illegal I guess) so the first requirement is gone, but AFAIK they require some form of "commitment" (like money :-). You could always host a reference link on a site you control; more work, but at least the link will still be around as long as you want it. Or as long as the Internet is around.  :-)</p>
      <p>hhp</p>
