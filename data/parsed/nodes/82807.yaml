    html: |-
      <p>Try a monospace font, with non-jarring [typographic] color.</p>
      <p>I think email addresses can be embedded in text, but any long URL should usually be: named something in the text and be given in full as a footnote; converted to a TinyURL or equivalent* if it's long and/or cryptic.</p>
      <p>* I wouldn't rely on any ".ly" scheme though...  :-/</p>
      <p>hhp</p>
