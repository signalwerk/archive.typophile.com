    html: |-
      <p>From the Associated Press style guide:</p>
      <p>• When a phrase refers to a month, day and year, set off the year with commas.<br>
      (e.g. Aug. 20, 1964, was the day they had all been waiting for.)</p>
      <p>• When a phrase lists only a month and year, do not separate the month and the<br>
      year with commas. (e.g. February 1980 was his best month.)</p>
