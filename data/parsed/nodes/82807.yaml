    html: |-
      <p>&gt; converted to a TinyURL </p>
      <p>I'm not sure how long TInyURL (and similar services) guarantee that their links will work, so I'd be hesitant to put them in a printed document if it's going to be in use for a while.</p>
      <p>But I agree with your general point that long URLs can be a problem in non-clickable text. For that reason I generally try to avoid printing URLs when I can, and if I must use them I try to make them as short as possible. </p>
      <p>For example, instead of saying "go to http://www.company.com/support/support.html" say something like "go to the support section of www.company.com".</p>
