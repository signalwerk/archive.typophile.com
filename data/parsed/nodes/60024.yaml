  html: |-
    <p>This might be basic typography knowledge, but unbeknown to a beginner like me. </p>
    <p>I have seen some signage + fonts where certain characters like the "o" or the "c" have an underscore, they appear to be set in lowercase even when the rest of the characters are uppercase. I'm not sure what the exact terminology for these characters are, hence I'm at a loss on how to do even a basic Google search.</p>
    <p>Attached is a screenshot of <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_typeface_six/&amp;s=c?&amp;sample_text=cogq&amp;sample_size=144" rel="nofollow">FF Typeface Six</a> that contains these characters.</p>
