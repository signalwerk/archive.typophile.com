      <p>This is an improvement, however for fashion I think of long and lean. The font you've chosen looks short and squat. Try something in the Modern/Didone style: Didot, Berthold Bodoni et al. or a sans with similar proportions - tall, slightly condensed. </p>
      <p>Your new design seems like it is for a jeweler, the overlapping hearts form a crown. Only if you know they are hearts can they be made out. I do like the graphic, but if you want the viewer to clearly see heart/love my LBD it's not there yet.</p>
