    date_raw: 23 Jan 2010 — 10:22am
    votes: null
    html: <p>I would do away with any ideas trying to incorporate the dress into the letter shapes. It just comes off as cartoony. A solid wordmark that evokes / hints at the feelings from her 'mood board' is the way to go. Don't hit us over the head with a picture of a dress. Every woman's little black dress is different, and by trying to recreate one in vector form you'd be taking the power of each viewer's imagination out of the mix. In a sense, the letters should feel like a little black dress — elegant, comfortable, subtle and sexy — not try to look like one.</p>
