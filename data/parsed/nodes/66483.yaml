      <p>Ok, after working on another part of the project and more discussion with the client I've had some ideas for an entirely different direction and wanted to get some feedback.</p>
      <p>The "I love" part of the title is really fairly unimportant, that will be the site URL but was used due to a more desirable URL being unavailable, so myLBD is the focus. She also wants an accessible look, it should look fashionable but not snobby.</p>
      <p>From there I had the idea of the "I heart whatever" phenomenon, the idea itself is horribly over used but I thought the metaphor of the heart for "I love" might be able to be interpreted in a unique way. I started working with some heart forms and playing with their intersections and overlapping and came up with this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mylbdlogo02_3665.jpg"></div><p></p>
      <p>I'm still working with the type at this point (and am very open to suggestions there) but I really like the form and think this could work really well. Thoughts?</p>
