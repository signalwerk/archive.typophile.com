    html: "<p>Hey Aaron. <br> <br>Pzb might benefit from hacking off the ascenders <br>and descenders and allowing the troubled  <br>characters like the 'a' and 'e' expand vertically. <br> <br>Have a look at Büro Destruct's Eject: <br><a href=\"http://www.typedifferent.com/1998/index.html\" target=\"_top\">http://www.typedifferent.com/1998/index.html</a> <br> <br>(Then send them an email and ask that they <br>disable the cute, but ultimately obnoxious <br>typing sound effects on that site.) <br> <br>Stephen</p>"
