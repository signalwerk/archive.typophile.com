    html: "<p> This is like another recent font shown in this forum: too many good ideas! It's a great start, but I think it needs to sober up to become usable. Like \"a\"-\"g\" is great (although the \"f\" needs work), but the \"h\" -and then the \"n\", \"u\", et alia- introduce a new element, creating too much noise. Apply some \"discipline\", and you're there! <br> <br>hhp </p>"
