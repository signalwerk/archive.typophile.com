    <p>This might be an easy one for you, but it's stumping me. This font is used on the <a class="freelinking external" href="http://kings.nhl.com/" rel="nofollow">LA Kings website (lakings.com)</a> and social media (<a href="/wiki/https%3A/%252Fwww.facebook.com/LAKings/photos_stream" class="freelinking" rel="nofollow">facebook</a>, <a class="freelinking external" href="http://instagram.com/lakingshockey" rel="nofollow">instagram</a>, <a href="/wiki/https%3A/%252Ftwitter.com/LAKings/media" class="freelinking" rel="nofollow">twitter photos</a>).</p>
    <p>These are some fonts that I found to be similar in some respects, but not the right one: FF DIN, ITC Conduit, Battersea, Stratum 1, Stratum 2, Lintel, Route 66, Geogrotesque, Bourgeois, Rama Gothic, H&amp;J Forza, Purista Web, Moire, Tstar, Helsinki, Nudista, Boxed.</p>
    <p>Here are some images from across their social media. I tried to include symbols, numbers, some lowercase, different weights, and certain letters (K, Q, M) that seemed to trip me up with the fonts above:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/LAKINGS_mediafont_6021.jpg"></div><p></p>
    <p>I would appreciate the help. Thanks.</p>
    <div class="field field-type-text field-field-solved">
