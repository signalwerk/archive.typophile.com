    html: <p>Hi. the title fonts for Goodbye Madame Butterfly are Parker Slab for “Goodbye” and Parker for “Madame Butterfly.” If you have the book, check out the very last page after the acknowledgments, where designer Craig Mod lists all the fonts used in the book. Cheers, Bruce</p>
