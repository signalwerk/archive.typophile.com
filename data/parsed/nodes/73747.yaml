      <p>@Nick Shinn: How about "Neo-Victorian Industrial"? Or perhaps "Bentonian Victoriana"?</p>
      <p>@Katju: "Big and influential magazines do not change their design that often." This is changing as print publications attempt to reflect and compete with the constant reinvention of the Web (and/or their own digital incarnations). Complete design overhauls, which used to happen every 3-5 years, now take place every couple of years. Also, the two magazines I cited, GQ and Wired (which are certainly big and influential in U.S. editorial circles) are in a perpetual state of redesign -- typefaces drift in and out of favor, and feature stories look entirely different from similar articles in previous issues.</p>
