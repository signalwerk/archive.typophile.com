      <p>"make their printed magazines look better and more important so that people feel like buying them."</p>
      <p>This to me will be one major outcome of the e-reader trend. People will still look for the fully satisfying browsing experience of a printed magazine, smell of paper, shiny ink and all. But the magazine that people take to bed at night has to have something special. Custom made typefaces, better typography all and all, special paper choices and so on - exclusivity I guess, will probably be one the rising trends. How it turns into a profitable business model, I don't know. Monocle pioneered in this quite nicely, but I would be surprised if they are making any profit out of it.</p>
