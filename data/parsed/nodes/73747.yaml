      <p>The article Nick Shinn linked to was very interesting. It is of course impossible to predict the future, and I hope it came trough from my post that I was merely looking for a little play around different ideas, and this should not to be taken too seriously. But I am definitely interested in your intuition, the quality I also very much believe in, as one has to. Even if it isn't such a good tool for predicting the future, like Duncan Watts goes to prove.</p>
      <p>I agree with Nick that there are indeed <cite>certain value judgements about which magazines are important and, indeed, influential.</cite> That plays a role in a smaller market area like mine. I can easily recognize the international magazines and font foundries that seem to have quite a big influence here - at least for now. Somebody gets inspired first, the others follow - it can get extremely conformist. But of course, rather than new trends, they often seem to be the last waves of something that started a while ago, most often in the States.</p>
      <p>Anyhow, the big and influential magazines do not change their design that often. I think one gets pretty lost trying to predict the future based on their choices. And of course on that level, it also gets much less experimental. I will go with what James said: <cite>Fashion mags will always use didones, women's mags will always use ultra thin sans, this you can be sure of.</cite> </p>
      <p>I find small independently run magazines, that do not need to conform to any genre expectations or commercial pressure, to be the most inspiring or at least refreshing to look at.</p>
      <p>As I mentioned that I am working on something now, I should probably point out that this project is not going to be very trendy at all, rather the opposite. So I am not here to pick your brain. I am just curious to hear your predictions, serious or not.</p>
