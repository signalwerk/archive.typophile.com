      <p>Magazine typography is as much about how typefaces are combined and used as it is about the individual faces chosen. </p>
      <p>The trend I see gaining strength is a sort of "Victorian poster meets 1950's tool catalog" approach, characterized by the gleeful mix of sturdy faces regardless of provenance, with multiple sanses, serifs and slabs tossed into the mix. See recent issues of the U.S. editions of Wired (especially the Will Farrell/Future issue) or the front-of-the-book sections in GQ as examples. (The late Portfolio mag and the much-missed Blueprint were more refined antecedents.)</p>
      <p>Kent makes a great point, too. Want to start a design trend? Find a dusty typeface that bores/repulses you and find a way to make it fresh. Arnold Bocklin will have its day...</p>
