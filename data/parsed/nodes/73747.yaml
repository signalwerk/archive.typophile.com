    <p>Lately I have been trying to recognize some passing trends in magazine typography in order to find the roads less travelled myself. Thinking about this got me curious about the possible future trends in the world of magazine typography. So I am starting this thread for both fun and inspiration, as I am thinking there might be some inspiring and/or informed views present here.</p>
    <p>I think it is a fair, although maybe a bit bold guess that in the near future we will see less of these past and current trends:</p>
    <p>* extremely thin slab serifs<br>
    * extremely thin sans serifs<br>
    * didones (if it is even possible to move away from this)<br>
    * friendly and rounded slab serifs<br>
    * painfully narrow and tall sans serifs</p>
    <p>The last two will probably go on for some while though.</p>
    <p>But what do you think we will see more of in the coming two to three years?</p>
