      <p><cite>…exclusivity I guess, will probably be one the rising trends.</cite></p>
      <p>Not so much exclusivity as craft made obvious. Only the rare magazines that offer top-tier writing like The New Yorker and The Economist can get away with letting style take a quiet backseat to content. Other art directors will really need to start celebrating their existence. I think that the redesign of O (the Oprah magazine) is an example of how really great design can make a proletarian magazine stand out in the crowd. It’s a sort of balancing act between showing off the design without being ham-handed or overly intellectual as postmodern design sometimes was.</p>
