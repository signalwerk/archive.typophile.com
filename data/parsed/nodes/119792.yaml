    <p>Hey guys!</p>
    <p>Just trying to track down the title font used on this book cover, specifically the font used for 'OUTLIERS' and 'MALCOLM GLADWELL':</p>
    <p>I initially thought it might be 'Raleway' because of the 'W', but this font is rounded :/</p>
    <p>Any ideas?</p>
    <p>Thanks in advance.</p>
    <p><img src="/sites/default/files/old-images/malcolm-gladwell-outliers_4305.jpg"></p>
