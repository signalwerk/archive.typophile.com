    html: |-
      <p>Perhaps that's because</p>
      <p>feature xxxx {<br>
      sub by ;<br>
      } xxxx;</p>
      <p>is not a valid syntax ...</p>
      <p>Try this instead -- custom ligature:</p>
      <p>feature liga {<br>
      sub D a v i d by D_a_v_i_d;<br>
      } liga;</p>
      <p>Be sure to create the 'D_a_v_i_d' glyph in your font. Compile, save as TTF or OTF, type your name into any sane program. Look, it's your name!</p>
