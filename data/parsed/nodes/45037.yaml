    <p>I have a little problem in the opentype pannel.</p>
    <p>when I want to create something like</p>
    <p>feature xxxx {<br>
      sub by ;<br>
    } xxxx;</p>
    <p>...</p>
    <p>it makes a fatal error<br>
    –FATAL–  aborting because of errors:<br>
    syntax error</p>
    <p>It seems that my folder  /Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 3] is empty.</p>
    <p>do you know if it s my empty folder that bloks everything. How can I get the features?</p>
    <p>Thanks a lot for helping me.</p>
    <p>–</p>
    <p>***LOW-ORDER/ TYPE FOR LIFE***</p>
