    html: <p> I'm actually not sure which is better/worse, and I don't want to discourage you. As long as you know what else is out there, and you make your own thing (mostly) independently, and the process turns you on, that's plenty. Hopefully it will turn other people on too, and maybe you could sell it better than FF? (Although that would be hard.) Type history is littered with plagiarism but also coincidental similarities. For example there's a part in Alexander Lawson's incomprable "Anatomy..." where Zapf expresses surprise at the similarity of Optima to a much older design by Middleton - but compare how the two designs fared on the street. <br> <br>hhp </p>
