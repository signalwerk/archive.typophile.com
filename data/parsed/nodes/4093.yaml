    html: <p>What Hrant probably meant (and should have  <br>articulated) is that FF Extra  does everything  <br>that Chub Rock does, and does it better. <br> <br><a href="http://www.philsfonts.com/detail.html?sku=FF00909801P1" target="_blank">Here is a better showing of Extra Black</a>. <br> <br>Your J, L, T, I, and S <i>do</i> differ, but Extra's  <br>solutions for these glyphs are more clear. <br> <br>I'm not sure the remaining difference (the <br>straight edges) is enough to warrant a new <br>font of this sort of novelty. <br> <br>Sorry to poop on your parade. It does look <br>nice and it is probably a good exercise, so  <br>don't feel too glum spending some time on it.</p>
