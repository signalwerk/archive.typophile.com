    html: <p>Although it is similar, and in some ways very similar, I also think it can be seen as very different. I prefer the rigidity in Mitchell's. And if I really wanted a "phat" face with more roundness, I would use font bureau's <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=1039728523390289&amp;fontname=Asphalt" target="_blank"> Asphalt</a>. <br> <br>The character's with any kind of counter-like space (or counter) seem to be a different weight than the others. That would be one critique from this corner. i'm not sure i like final solution for you 'J' either. The idea is nice but the solution isn't completed. :/ <br> <br>All in all, I do like it ... but, Hrant and Stephen's points (perhaps) shouldn't be ignored. See this as a challenge Mitchell and make it your own! Go Team!</p>
