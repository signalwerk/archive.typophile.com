    html: |-
      <p>You only need one glyph per mark. In VOLT, you set up the Mark Positioning  and Mark-to-Mark  features, using anchor attachment lookups. The trick is to position all your marks carefully in their own glyph space so that, for example, all above marks can be positioned on a letter using the same anchor attachment point. Within the VOLT glyph positioning window, you should lock the position of all second elements (marks), and then drag the marks into position above or below each letter, using the x and y offset values for the first element (base) to fine tune the positioning.</p>
      <p>Marks need to be classified as such in the VOLT glyph edit window (this sets their GDEF category).</p>
      <p>Your ligature substitution lookups should be set to ignore marks, so that the ligatures will form regardless of whether there is a mark on one or more of the letters. In the VOLT glyph edit window you need to identify ligatures as such and correctly record the number of components. So, for instance, the lam_alif ligature has two components.</p>
      <p>Once this is done, in the glyph positioning window you can make a mark-to-ligature lookup, and position the marks independently for each component of the ligature.</p>
      <p>You will find a lot of good information in the archives of the VOLT user community on MSN. You can also download the VOLT supplementary files, which include a model Arabic OT font that you can open in VOLT and examine.</p>
