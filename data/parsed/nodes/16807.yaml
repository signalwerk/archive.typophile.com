    <p>I am currently creating my own arabic font (for personal use). So far I have created all glyph variants and ligatures. The next step before I move on to Microsoft VOLT is to create the diacratic marks. I have already created 1 glyph for each individual diacratic mark (’fatha’, ’kasra’, ’damma’, etc.), but the problem is, the position of the glyph will depend on the letter it appears above (for example, the ’fatha’ that appears on the letter ’alif’ will be much higher than the ’fatha’ that appears on the letter ’baa’ and also more to the left). My question is, do I have to create a different glyph variant for each position of the diacratic mark, or is there some way to specify the position of the mark in Microsoft VOLT?<br>
    In other words, do I need 1 glyph of the diacratic mark ’fatha’ (and can I then change the position in VOLT) or do I need to create a specific one for each letter?<br>
    Thanks<br>
    I. Jamal</p>
