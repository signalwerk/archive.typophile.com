      <p>There are spaces within the font to allow for complete characters *with* the diacritics. I’m not familiar with the Microsoft VOLT software, but try opening an existing Arabic font in the editor and you should be able to see the characters and where they should go.</p>
      <p>I’ve been wanting to create an Arabic face for some time now. I’d be interested to see how yours progresses.</p>
      <p>Theodore</p>
