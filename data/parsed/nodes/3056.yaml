  - id: 24257
    user: 2277
    date: 2004-02-10T11:20:00
    date_raw: 10 Feb 2004 — 11:20am
    votes: null
    html: <p>I like the E; the horse looks strong.  <br> <br>I agree with Daniel and Darrel that it would be worth it to try it with the cross bar. What does it look like small? Some of those lighter lines inside the horse may disappear in small or low rez situations. <br> <br>Runic is a good choice. Can't wait to see it in color. </p>
  - id: 24258
    user: 1739
    date: 2004-02-10T12:14:00
    date_raw: 10 Feb 2004 — 12:14pm
    votes: null
    html: <p>This image is at 350 pixels. I can't imagine it needing to go any smaller. some lines at 350 definitely get lost but I don't think it hurts it too bad. <br> <br><img src="http://www.typophile.com/forums/messages/29/26209.gif" alt=""> <br> <br>Someone suggested when I started that I add a bar. I believe that adding any sort of bar hurts the cleanness of the overall image and adds confusion. Unless a second bar is added perpendicular to the horizontal bar, the bar is floating. If a vertical and horizontal bar is added it is alot of straight lines to take away from the "E". In a way, I was hoping it almost looks like the horse is jumping over the bottom beak (of the E). That may be a stretch considering he is so far from it. It may be the right thing to add a jumping bar. I will toy with it and see if I can't make it work. <br> <br>When I straighten the leg anymore than it is it takes away from the momentum of the horse jumping. Most associate that pose with the horse jumping. <br> <br><img src="http://www.typophile.com/forums/messages/29/26210.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/26211.gif" alt=""> <br> <br>Also, I adjusted the shadow on the leg so it could adapt better when the logo is smaller. <br> <br><img src="http://www.typophile.com/forums/messages/29/26212.gif" alt=""></p>
  - id: 24259
    user: 1250
    date: 2004-02-10T12:32:00
    date_raw: 10 Feb 2004 — 12:32pm
    votes: null
    html: <p>The thin lines will get you not when they disappear, but then they <i>clot together</i>. You'll need a lo-fi version. <br> <br>I wouldn't add the middle bar - I think it's enough of an "E". <br> <br>Do remove the trapping from the Runic (like in the armpits of the "N"). <br> <br>I don't think the "FARM" font is working with the Runic. Try something like Bank, or Blair, and at a darker weight. <br> <br>hhp <br></p>
