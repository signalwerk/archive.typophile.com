    date_raw: 15 Feb 2004 — 4:00pm
    votes: null
    html: "<p>Looking at my display I'd prefer a slightly more saturated green, but that means virtually nothing (and I don't have a Pantone book). <br> <br>In the lo-fi version do try to keep that nice parallel between the mane and the spikes in the stem - probably just by making them fewer and larger. You might also make the whole thing a bit wider. <br> <br>BTW, I just looked at the spacing for real: your \"EVE\" needs to be closed up a hair. <br> <br>hhp <br></p>"
