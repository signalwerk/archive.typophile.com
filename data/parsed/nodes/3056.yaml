  html: <p>I am working on a logo for Evergreen Farm. Basically they buy horses, train them, and sell them. They want a logo for their website, signage, etc. It is still in black and white and line form. I will probably add something to the bar on the E (because it feels bare). <br> <br>I am using Runic MT for the font, and Caslon 540 for the secondary font. I chose Runic because I feel it is sharp and classy. I was looking at Layfeyette (Font Bureau) and Acolyte (Altered Ego) as possibilities, but I don't own either. Before I make a purchase I want to hear opinions on the font choice.  <br> <br><img src="http://www.typophile.com/forums/messages/29/26136.gif" alt=""></p>
