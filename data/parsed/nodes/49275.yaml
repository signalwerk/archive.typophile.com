    <p>Hello everyone,</p>
    <p>I am trying to avoid using a double hard return between my paragraphs. The problem I am running into is when using 2+ columns that baselines are not lining up. Is there a trick to keeping them aligned (using cs3) or due to the difference of number of breaks there is no way.</p>
    <p>Here is an example:</p>
    <p></p><div class="imageWrap"><img src="/files/Example_4065.jpg"></div><p></p>
    <p>Second question: If there is no way then what do you feel is more important, keeping the sentences aligned across the columns or keeping to the no double hard returns.</p>
    <p>thanks!</p>
