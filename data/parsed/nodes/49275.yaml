      <p><cite>I had been reading that one should make the gap between the paragraph breaks 60-80% smaller then you would get from a double hard return, hence the smaller gaps. Is this wrong?</cite></p>
      <p>That’s great advice if there’s only one column of text to deal with, but it fails to work when one wants to keep multiple columns aligned. It really comes down to what degree of order you want in your layouts.</p>
