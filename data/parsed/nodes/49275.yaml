    html: |-
      <p>Another option, if you prefer the look of space between paragraphs, is to use a blank line of half the leading. (Personally, I’d probably set it up as Space Before, rather than a hard return). You can also then set your Baseline Grid to half the leading to facilitate layout.</p>
      <p>By using exactly half the leading, you’ll get a fairly pleasing syncopation between your columns: lines will either be exactly aligned or a half beat off, coming in and out of alignment in a regular rhythm with each paragraph.</p>
      <p>This can be an acceptable scheme in some layouts. You won’t be able to count on aligning the bottoms of all columns, so it works best with a looser, less formal page design.</p>
