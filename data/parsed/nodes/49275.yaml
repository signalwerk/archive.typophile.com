    html: <p>No, you’re right, when you use spaces between paragraphs, they should be small enough that they  can’t be confused with blank lines. I would say 8 points in your case. Trouble is, with good looking paragraph spaces like these, you have to sacrifice aligning across columns. To me, this is just another good reason to abandon the whole space between paragraphs idea altogether and stick to the good old indent. Elegant, robust, working.</p>
