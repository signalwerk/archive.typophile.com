      <p><em>I’m a little confused. In the example, there doesn’t seem to a full blank line between paragraphs, only extra space. In these cases, for lines to line up across columns, the space after paragraph has to equal the leading or a whole number times the leading.</em></p>
      <p>I had been reading that one should make the gap between the paragraph breaks 60-80% smaller then you would get from a double hard return, hence the smaller gaps. Is this wrong? I am using 10pt type with 12 pt leading, so I was decreasing the paragraph break to about 9.5 pt. Should I keep them at 12 pt?</p>
