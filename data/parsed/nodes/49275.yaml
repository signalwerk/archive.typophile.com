      <p>Kent’s half line space is what I would use on multi-column work.</p>
      <p>The hyphens seem surprisingly high, almost on the x-height, I normally try to avoid hyphenation in a document, however, if you can’t avoid using them, have a look at the hyphenation options, my feeling is that you should avoid hyphenating any proper nouns, some words have broken awkwardly – Appren-tice for example.</p>
      <p>Tim</p>
