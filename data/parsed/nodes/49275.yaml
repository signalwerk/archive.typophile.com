    html: <p>I’m a little confused. In the example, there doesn’t seem to a full blank line between paragraphs, only extra space. In these cases, for lines to line up across columns, the space after paragraph has to equal the leading or a whole number times the leading. / Make sure your Align to Baseline Grid button (in the Paragraph panel or Control panel) is pressed. / By the way, in your example, I would go with no extra spacing and an indented first line (indentation equal to body size). This makes it clear to the reader that he’s looking at a coherent text, not a collection of excerpts, and it makes sure that the reader is never in doubt whether or not there is paragraph break hidden in a given column or page break coinciding with a period.</p>
