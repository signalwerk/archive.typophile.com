    html: "<p>Hrant -- <br> <br>I'm in the same boat as you on this one. I bought all the available back issues and paid a subscription right before #7 was to have been published originally. Two years later -- <i>nada</i>. <br> <br>I was willing to cut dh a break for a while -- publishing a niche magazine is not easy -- but now I'm feeling a bit peeved too. <br> <br>He should either prioritize putting out the issue or he should refund subscriptions. <br> <br>-- K.</p>"
