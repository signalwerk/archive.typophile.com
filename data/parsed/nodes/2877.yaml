  html: "<p> What the hell happened to Serif magazine in general, and issue #7 in particular - it's been \"in the works\" for over two years now, come on. <br> <br>Am I the only one who paid for a subscription but didn't get the goods? Do snake-oil salesmen still exist? Or am I being too harsh. Could somebody please tell Don Hosek (a founder of the ethics-centric TypeRight...) to let his subsribers know exactly when to expect the next issue, or how to get their money back? <br> <br>hhp </p>"
