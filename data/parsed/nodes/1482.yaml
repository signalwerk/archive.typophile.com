    html: <p> Great work... <br> <br>He's working with one hand in the very old tradition of typedesign, and on the other, he's pushing the limits of it. His 'Balance' typedesign is a sort of hommage towards Roger's Excoffon Antique Olive (very un-dutch in it's design; compare it with the 'traditional' dutch-designers like Gerard Unger &amp; martin majoor). His other typefaces, like 'avance' &amp; 'cocon' are very modern and unique. <br> <br>His typefaces are always from extreme quality. <br> <br>I'm sorry, for my bad english. I'm dutch. (I've just finished my study at the art-academy in Arnhem, the netherlands; where Evert Bloemsma has studied also.) </p>
