    html: <p>Hrant, <br> <br>I'm sorry, I didn't make it very clear, but the fontshop (in Holland) made a few excellent publications, regarding some of their typefaces. Like the Scala, Quadraat, Fago and also the Avance (by Bloemsma). Note!! ...they're all designed by dutch designers (I know that Ole Schafer, who designed the 'FF Fago' is German, but he studied in the Hague typedesign...) <br> <br>I think the publications can be ordered at <a href="http://www.fontshop.be" target="_top">http://www.fontshop.be</a> (the interface is in dutch, that might be difficult) <br> <br>&amp; recently, the book 'letters' was published in Holland. The book is enterily in Dutch but it consist of many texts by typographers like 'Erik van Blokland, Bram de Does (from the beautiful Lexicon &amp; Trinité, by <a href="http://www.TEFF.nl" target="_top"> http://www.TEFF.nl</a> ), Gerard Unger, Martin Majoor, Fred Smeijers, and... Evert Bloemsma.' <br> <br>there is a small view of the book at <br><a href="http://www.zooproducties.nl/prod21.html" target="_top">http://www.zooproducties.nl/prod21.html</a> <br> <br>is this a bit more elaborate? <br> <br>forgive my bad english, <br> <br>ML</p>
