      <p>I try to answer some of your questions:</p>
      <p>1. You dont have to hit return and type the feature again on each new ligature. Just put all of your ligatures inside the the two brackets, like this:</p>
      <p>feature liga {<br>
        sub f f b by f_f_b;<br>
        sub f f h by f_f_h;<br>
        sub f f i by ffi;<br>
        sub f f j by f_f_j;<br>
        sub f f k by f_f_k;<br>
        sub f f l by ffl;<br>
        sub f b by f_b;<br>
        sub f f by ff;<br>
        sub f h by f_h;<br>
        sub f i by fi;<br>
        sub f j by f_j;<br>
        sub f k by f_k;<br>
        sub f l by fl;<br>
      } liga;</p>
      <p>2. Asking questions here is good – I have learned a lot, it also good to read the FL manual. These things are very hard to understand in the beginning I believe, but go on and try, some day the sun is shining :)</p>
      <p>3. I think all features is quite easy to learn, everything is about substitution, for instance – here are a few popular:</p>
      <p>Swash letters:<br>
      feature swsh {<br>
        sub @swsh1 by @swsh2;<br>
      } swsh;</p>
      <p>Small Caps:<br>
      feature smcp {<br>
        sub @smcp1 by @smcp2;<br>
        sub @smallnumerals1 by @smallnumerals2;<br>
        sub @currency1 by @currency2;<br>
        sub @punctuation1 by @punctuation2;<br>
      } smcp;</p>
      <p>Old Style Figures:<br>
      feature onum {<br>
        sub @onum1 by @onum2;<br>
        sub @currency1 by @currency2;<br>
      } onum;</p>
      <p>In these cases, there are classes made first with all the necessary glyphs. One class for the original letters, and one for the glyphs that are supposed to substitute the former ones. I usually name the classes 1 and 2 – the 2 substitutes the 1. The classes must be built so the order and number of glyphs are the same in both classes.</p>
      <p>As an example:</p>
      <p>onum1 = one two three<br>
      onum2 = one.oldstyle two.oldstyle three-oldstyle</p>
      <p>We also have:</p>
      <p>Discretionary Ligatures:</p>
      <p>feature dlig {<br>
        sub c t by c_t;<br>
        sub s t by s_t;<br>
        sub s p by s_p;<br>
      } dlig;</p>
      <p>4. What to do you mean by "pairs"? Kerning pairs? Classes is very handy because it saves time. For instance, you make a class where the key glyph is "o" – you can then use this class to kern letters like e c d b p q as an example, not to mention the time you save for all the accented letters that is build on "o" – like ö ø ó ò etc.</p>
      <p>If you do a search here, you will find more detailed information on this.</p>
      <p>Youre welcome with any follow-up question you might have – someone will help you :)</p>
