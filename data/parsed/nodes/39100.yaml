      <p>Basically, all ligatures that does not have its own unicode number, should be written with underscore. So if you make your own ligatures that are not standard ligatures, put the underscore there.<br>
      The underscore also makes the ligatures "break apart" if you kern them, and the underscore also means that InDesign treat them as their original letters, so f_f_j will be ffj if you switch to a font that does not have this ligature, or if you copy paste text. That is a good thing.</p>
      <p>I think the only ligatures that has unicode number these:</p>
      <p>ff<br>
      fi<br>
      ffi<br>
      fl<br>
      ffl<br>
      Regarding classes, there are three types of classes in FontLab – kerning classes, metrics classe and OT classes. Think of them as groups of glyphs for that is what they are, nothing more. Groups to make things more easy to handle. In kerning classes, they are groups of glyphs that have some similiarities.<br>
      I dont understand your second question with the syntax?</p>
