      <p>Examples for proper syntax for the features come with the FontLab. For example, I use a Windows platform; the directory</p>
      <p>C:\Program Files\FontLab\Studio5\Samples</p>
      <p>is installed when I install the program.</p>
      <p>One of the files you will see there is</p>
      <p>freefontpro.fea</p>
      <p>Which gives useful examples for writing the features code.</p>
      <p>One thing to remember is that writing features depends to some extent on both a knowledge of the use of type, and the features a particular applications program will use. If, for example, you use InDesign, only those OpenType features InDesign supports are worth writing.</p>
      <p>You can also write features (code) that most would consider a hack; for example, search for "fractions" on this forum to find a thread where fractions are, essentially, "always on" rather than selected &amp; the feature applied. Makes sense for cookbooks; but is wrong for most  text.</p>
      <p>I would note that using Type 1 fonts, a layout engine like TeX (where you could use different encoding vectors essentially on the fly), and a preprocessing program for the text stream (search &amp; replace strings including S&amp;R using regular expressions) gave results essentially similar to OpenType and its features. The real plus is that OpenType supports Unicode, so further uses of a document are far easier than when the glyphs were known only by their *name*.</p>
      <p>BTW, the bug that requires a substitution string in order for positioning strings to be applied is an bug with applications programs, not in FontLab or OpenType. I am sure Adobe will fix it in future releases of their programs.</p>
