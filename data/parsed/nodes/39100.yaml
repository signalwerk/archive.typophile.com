      <p>Some additional pieces:</p>
      <p>You may also go to <a href="http://www.adobe.com/devnet/opentype/afdko/" target="_blank">http://www.adobe.com/devnet/opentype/afdko/</a> and download both the FDK and the ExampleRomanFonts.zip. The former includes, among Adobe's Font Development Kit tools, many useful documents including a Feature File Syntax document as html file. This syntax is used by the FDK as well as font editors that rely on the FDK (FontLab Studio and DTL FontMaster). The example font includes a number of feature files. (For the 'frac' feature however you better open a not too old OpenType font ...)</p>
      <p>Karsten</p>
