    html: |-
      <p>An example. You have defined these OpenType classes in your FLS Classes Panel:</p>
      <p>NUMERALS: zero one two three four five six seven eight nine<br>
      NUMERATORS: zero.numr one.numr two.numr three.numr four.numr five.numr six.numr seven.numr eight.numr nine.numr<br>
      DENOMINATORS: zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom</p>
      <p>A simple 'frac' feature then looks like this (the idea was first introduced by John Hudson, I think):</p>
      <p>feature frac {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub slash by fraction;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub @NUMERALS by @NUMERATORS;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub [fraction @DENOMINATORS] @NUMERATORS' by @DENOMINATORS;<br>
      } frac;</p>
      <p>Which means:<br>
      -- first you replace 'slash' by 'fraction'<br>
      -- and all numerals by numerator numerals<br>
      -- finally you replace all numerators by denominators -- but only if they follow either the 'fraction' or another denominator! (The quote sign in @NUMERATORS' indicates that only glyphs of this class are to be substituted, the other glyphs, here enclosed in brackets, are the context which must be met so that the substitution takes place.)</p>
      <p>This feature then should precede all other numeral-related features like 'sups', 'subs', 'sinf', 'numr', 'dnom'.</p>
      <p>Don't just copy/paste but play with it and try to understand what is going on. For example, kick out the context part "[fraction @DENOMINATORS]", or only the "fraction" or only the "@DENOMINATORS", out of the code and check what happens!&nbsp;&nbsp;;-)</p>
      <p>Btw, there's no need for covering 'percent' and 'perthousand' in the frac feature, as in some older examples!</p>
      <p>Use of the feature: Select the glyphs that shall become a fraction and apply this feature. It should not be applied to entire paragraphs. For a discussion of the latter (and its disadvantages) see <a href="http://typophile.com/node/38448" target="_blank">this thread</a>.</p>
      <p>Hope there's no error or typo left ...</p>
