  html: |-
    <p>I'm trying to successfully implement kerning pairs, and possibly classes in an Open Type font file in Fontlab 5.</p>
    <p>After reading a few threads regarding Open Type Pairs and Classes I learned of the glitch requiring another 'feature' to be created to have Open Type Pairs export correctly and show up in the final font file.</p>
    <p>Without much experience on the technical side of Open Type I did a quick cut and paste of</p>
    <p>feature liga {<br>
    sub f i by fi;<br>
    sub f l by fl;<br>
    } liga;</p>
    <p>via Twardoch's suggestion and this worked rather easily as the results are shown while working in the opentype features panel… (I havent successfully exported and tested the font yet as I havent completed the kerning pairs but assume all is well) </p>
    <p>I was curious how to successively add the rest of the remaining ligatures and it seems as easy as</p>
    <p>feature liga {<br>
    sub f i by fi;<br>
    sub f l by fl;<br>
    } liga;</p>
    <p>feature liga {<br>
    sub a e by ae;<br>
    } liga;</p>
    <p>just adding a return and successively adding each ligature but I have four distinct questions:</p>
    <p>1. Is the above way correct for adding numerous ligatures to just hit return and keep adding code to cover all possible ligatures?</p>
    <p>2. Is there a more thorough manual or book for learning Open Type advanced features for someone who is more focused on the creative and design side of typography, basically something not long winded more of a visual learning guide?</p>
    <p>3. What are the most desired features of Open Type, I'm assuming the ligature feature is one of them. Are there any other Open Type features that are as simple as the above ligature example?</p>
    <p>4. What I've read regarding classes in Open Type seems complicated, pairs seem much easier, is there a clear and simplified guide to creating classes?</p>
    <p>I do realize that there are designers for hire that can help implement advanced  features for Open Type such as randomize code and etc… but for myself I'd like to learn and do as much as possible myself…</p>
    <p>Thanks</p>
    <p>Mike</p>
