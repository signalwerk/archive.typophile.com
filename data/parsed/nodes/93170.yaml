  html: |-
    <p>I have started to design some typographic posters that are designed in the same style as the popular "Here's to the crazy ones..."  poster. I am looking for pointers and design tips when it comes to making a typographic poster with many different fonts and typefaces. What are some basic things I should know when it comes to designing for print? I have designed many different things for online work but this will be my first venture into the world of print.</p>
    <p>Any tips or suggestions will be appreciated!</p>
