    html: |-
      <p>I don't know if this monogram is produced by a digital font. Date and source of image would help.<br>
      For a digital font that can produce monograms with a similar formal swirl effect I suggest Antoinette Monogrammes:<br>
      <a href="http://www.myfonts.com/fonts/flat-it/antoinette-monogrammes/" title="http://www.myfonts.com/fonts/flat-it/antoinette-monogrammes/">http://www.myfonts.com/fonts/flat-it/antoinette-monogrammes/</a><br>
      If you can do a little additional work to make monograms here are some vertical swirl  scripts that could produce a nice result:<br>
      Sweet Upright Script:<br>
      <a href="http://www.myfonts.com/fonts/sweet/upright-script/" title="http://www.myfonts.com/fonts/sweet/upright-script/">http://www.myfonts.com/fonts/sweet/upright-script/</a><br>
      Valentine:<br>
      <a href="http://www.myfonts.com/fonts/profonts/valentine/" title="http://www.myfonts.com/fonts/profonts/valentine/">http://www.myfonts.com/fonts/profonts/valentine/</a><br>
      Stradivarius:<br>
      <a href="http://www.myfonts.com/fonts/grouptype/stradivarius/" title="http://www.myfonts.com/fonts/grouptype/stradivarius/">http://www.myfonts.com/fonts/grouptype/stradivarius/</a></p>
      <p>Don</p>
