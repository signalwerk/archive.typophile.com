    html: |-
      <p>The font used was Harold Lohner's <a href="http://www.fontbros.com/families/vine-monograms/?code=harold" target="_blank" rel="nofollow">Vine Monograms</a>. I thought that last letter was a 'C', but it's not - it's an 'L'. Read the PDF manual and then use the Testdrive.</p>
      <p>I can't imagine having made such a set of 6 fonts as all combinations of letters must work well together and each font contains characters for three different styles of frame.</p>
