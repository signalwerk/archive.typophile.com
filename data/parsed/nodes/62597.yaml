    html: |-
      <p>If you have to use a face that has no small caps, I would recommend:</p>
      <p>1. Drop the cap height down to just taller than x-height<br>
      2. Track it out a bit<br>
      3. Beef up the weight with the Stroke feature in your layout application--you can add reaaaaly small amounts.<br>
      4. Optional, increase horizontal scaling, say to 103 or 104%.</p>
      <p>This is my practice, but as James says, develop your own sensibility as to which of these techniques you employ, and exactly what values you assign to the variables.</p>
    html_clean: |-
