    html: <p>Latvian can be typed on a Mac using any font with a Mac Central European encoding, which also covers the Baltic languages (note that for Windows there is a separate Baltic codepage). Look online for Mac CE fonts, or check out Linotype, ParaType or any other font retailers with a significant European presence. Adobe and other North American companies also develop and sell some CE fonts.</p>
