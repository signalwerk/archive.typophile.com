  html: <p>I have a friend who has given his old Mac with OS 9.2 on it to his mother. He's trying to track down a Latvian font to put on there so his mother can type letters in Latvian. Since I am lost in the world of foreign encodings, I now turn to the experts. Anyone here have some suggestions to point my buddy in the right direction?</p>
