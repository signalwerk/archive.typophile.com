    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : Emigre Magazine</strong></p>
    <p><strong>Publishers:</strong> <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>/Princeton Architectural Press<br>
    <strong>Editor:</strong> <a href="/wiki/Rudy%20Vanderlans" class="freelinking" rel="nofollow">Rudy Vanderlans</a></p>
    <p><em>1984—2005</em></p>
    <p>Published by type foundry <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a> and Princeton Architectural Press, it was art directed and edited by <a href="/wiki/Rudy%20Vanderlans" class="freelinking" rel="nofollow">Rudy Vanderlans</a>. The magazine moved to a music format in 2001 and was an outlet for the foundry to put their fonts to work in vital and interesting ways.</p>
    <p>Back issues are highly collectable. They are in the permanent collections of the San Francisco Museum of Modern Art, the Cooper-Hewitt National Design Museum in New York and the Design Museum in London, among others.</p>
    <p>After publishing the magazine for over 21 years it was announced that Issue No.69 would be the final issue. This milestone issue featured a behind-the-scenes look at its history, while contributors and colleagues bid the magazine farewell.</p>
