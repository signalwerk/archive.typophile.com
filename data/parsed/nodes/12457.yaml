    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Publications</a>&nbsp;: Emigre&nbsp;Magazine</strong></p>
    <p><strong>Publishers:</strong> <a href="/node/12208" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre</a>/Princeton Architectural Press<br><strong>Editor:</strong> <a href="/node/13699" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudy&nbsp;Vanderlans</a></p>
    <p><em>1984—2005</em></p>
    <p>Published by type foundry <a href="/node/12208" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre</a> and Princeton Architectural Press, it was art directed and edited by <a href="/node/13699" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudy Vanderlans</a>. The magazine moved to a music format in 2001 and was an outlet for the foundry to put their fonts to work in vital and interesting&nbsp;ways.</p>
    <p>Back issues are highly collectable. They are in the permanent collections of the San Francisco Museum of Modern Art, the Cooper-Hewitt National Design Museum in New York and the Design Museum in London, among&nbsp;others.</p>
    <p>After publishing the magazine for over 21 years it was announced that Issue No.69 would be the final issue. This milestone issue featured a behind-the-scenes look at its history, while contributors and colleagues bid the magazine&nbsp;farewell.</p>
