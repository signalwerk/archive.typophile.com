    html: |-
      <p>Have a look at<br>
      ‘Marks of Excellence’  by  Per Mollerup<br>
      It’s a good collection of what’s out there.</p>
      <p>There are a lot of books by corporate design (as it used to be called before it got rid of any social responsibility and re-emerged as ‘branding’) and branding gurus and companies like Wally Olins and Chermayeff &amp; Geismar (and so many more) about what they are doing, but this is rather self-propmotion.</p>
      <p>I think Paul Rand’s books are still quite important for corporate design.<br>
      How he built up his presentation for the IBM logo is still impressive.</p>
