    <p>Hello everyone,</p>
    <p>I’ve been lurking around here for a little while now and this forum is quickly becoming my favorite “go-to” sites of the day.</p>
    <p>Just curious if anyone has any good go-to books for a designer to learn more “theory” on branding design.</p>
    <p>Every once in awhile someone will want a new logo and I’d like to have more education on how to approach the project. </p>
    <p>Thanks for your suggestions.</p>
    <p>John</p>
