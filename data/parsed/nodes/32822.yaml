    <p>Hello everyone...</p>
    <p>I have been trying to figure this one out on my own for a while, but I don't know nearly as much as those of you... perhaps you can help me ID this one, it's Hollister's main brand typeface, best seen on the bottles, bags, and boxes.  Variations of it are used on the website.</p>
    <p>Thank you in advance for looking.  It's my first post to this board...</p>
    <p>Darrin</p>
