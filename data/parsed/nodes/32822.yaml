  - id: 194986
    user: 5398
    date: 2007-04-04T21:37:00
    date_raw: 4 Apr 2007 — 9:37pm
    votes: null
    html: |-
      <p>There are a lot of differences - note the straight sides on the 'O' (and 'D' and 'C' and 'G' etc.) in Alternate Gothic, whereas they are curved in Koehler. The letterforms in Koehler are a little more crudely drawn (intentionally so) while the forms in Alternate Gothic are more regular. Koehler seems to have a little bit of contrast, but Alternate Gothic has none. The terminals of Koehler are cut at a greater angle than those of Alternate Gothic...</p>
      <p> - Lex</p>
    html_clean: |-
