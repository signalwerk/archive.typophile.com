    html: |-
      <p>"MetaFont is also a pretty horrible language to program in"</p>
      <p>Really? Your program snippet "sub shape_o" is not much different to METAFONT coding. Writing macros in METAFONT is a bit unusual compared to other programming languages, but letter shapes can be defined quite elegant.</p>
      <p>Have you ever tried to outline glyphs in the following way:</p>
      <p>METAFONT code (whitout any pens) --&gt; processed by METAPOST --&gt; Glyphs written to EPS --&gt; EPS imported to a sfd-file by python-fontforge --&gt; postprocessing with python-fontforge or fontforge</p>
      <p>This is a reliable way. Of course you can easily improve it (eg by reading in the tfm file too). </p>
      <p>Please think of the fact, that Knuth has been working hard on METAFONT for about 5 years. He has learned much and also documented his mistakes (especially when making the jump from METAFONT79 to METAFONT84). Take a look at them to avoid falling in the same pits. METAFONT is not perfect and it is old but it is easily extensible by macros and it has uptodate successor: METAPOST (which can handle METAFONT code).</p>
      <p>-----</p>
      <p>Your font is onedimensional at the moment (weight axis). If you would like to add more axis (such as slant or optical size or condensedness axis): Do it now! You will have to consider much more things for your letter constructions.</p>
      <p>One simple tip for your letter constructions:<br>
      I assume your legs (at the k or R) are defined the following way:<br>
      1. Definition of the middle path of the leg<br>
      2. Expanding the path to a stroke<br>
      Hence, the legs are to close to the vertical stems for bold style. You could do instead something like<br>
      1. Definition of the left outlining path of the leg<br>
      2. Expanding the path to a stroke</p>
      <p>In short: Many paths are probably expanded from the wrong points on.</p>
      <p>------------------</p>
      <p>Okay, now some compliments:</p>
      <p>Your zerodimensional font (whithout weight axis expansion, e. g. medium style) already looks quite good and I suppose this was hard to program.</p>
      <p>Details like serifs and endings look quite interesting.</p>
      <p>-----</p>
      <p>I hope this helps a bit...</p>
