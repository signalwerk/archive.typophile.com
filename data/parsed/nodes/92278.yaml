    html: |-
      <p>@froo:<br>
      Too much ink it was.  I changed how the joints work for the "u"s, but I don't want to break the symmetry of the bows on "d", so instead the tails are now thinner when needed.  "R" has its slanted stroke steeper and more the the right at hearier weights, so it won't run into the vertical stroke now.  As to "K", I took the cop-out approach: just made them wider as weight goes up, which naturally leaves more white space.  The pdf at the top post is updated.</p>
      <p>"b", "p" and "q" all have similar arc-to-vertical joints, I'm curious what you think about those?</p>
