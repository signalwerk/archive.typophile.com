    html: |-
      <p><em>Why them ["dln"] three letters?</em><br>
      I wanted to see the details of the terminals magnified. Now I understand the source of those changes at the Black serifs, but I personally feel lack of a similar approach in places where the arches join to the stems. The lowercase Black "u" is a good example here; there is too much ink in it. In other words - you change modulation of serifs extremally, while the arches stay pasive.</p>
      <p>Anyway, the uppercase Black R and K are the wicked problem. They should be corrected by hand, but I feel intuitively, that an algorithm responsible for changing stroke direction (to introduce lights into dark places), should do the trick to some extent.</p>
