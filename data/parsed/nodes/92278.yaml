      <p>Nice!  What system are you using to generate the glyphs?  I would be interested in seeing the code.</p>
      <p>I have used MetaType1 (a library of routines written in MetaPost for creating Type 1 fonts)---see <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>.  However, I found that MetaPost was not particularly pleasant to program in.</p>
      <p>I have since been working on using Python in Fontforge to create glyphs.  That part all works fine, but I've been more recently thinking about more fundamental issues about the construction of glyphs:  see <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>, <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>, and <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>.  I think algorithmic generation of glyphs encourages a different exploration of glyph features than usual graphical tools do.</p>
