      <p>I've read all of the linked threads above (I've read pretty much the whole design board before I registered).  They are no doubt interesting topics, though my problem is not in math, but rather in design: I can have a program draw anything, <em>if I know what I want to draw</em>.</p>
      <p>My code is heavily experimental, and is no more readable than a good MetaPost or MetaFont.  Here's the function responsible for drawing "O", "o" and "Osmall" (and will be called by say, "Oslash"):</p>
      <pre>sub shape_o {
      	my $w = round(shift());
      	my $h = shift;
      	my $cap = shift // 0;

      	set_brush(0, $cap);
      	$hw = round($hw);
      	$vw = round($vw);

      	my ($x0, $x1) = set_stroke(0, $w, $vw + $thicken, $bearing_bow);
      	my ($x2, $x3) = set_stroke(0, $w, $vw + $thicken, $w - $bearing_bow);

      	my $cx = round(($x1 + $x2) / 2);
      	my $cy = round($h / 2);

      	path	-&gt;ellipse($cx, $cy, $cx - $x0, $h/2 + $os, $rout)
      		-&gt;ellipse($cx, $cy, $x1 - $cx, $h/2 + $os - $hw, $rin),
      	$w,
      	hhint=&gt;[-$os, -$os + $hw, $h + $os - $hw, $h + $os],
      	vhint=&gt;[$x0, $x1, $x2, $x3],
      	aaanchor=&gt;[round($w/2), $h]
      }</pre><p>
      $w, $h and $cap are passed in params specifying glyph width, glyph height and whether it's a capital letter (capitals have slightly wider v-strokes than lc or smcp).  <code>set_brush</code> sets nominal h- and v-stroke widths ($hw and $vw); <code>set_stroke</code> sets the positions of the left and right arcs.  Here $bearing_bow is a family-wide parameter, saying how far a bow-shaped stroke should be from the edge of the glyph, though the stroke actually straddles this position, so the actual bearings will be smaller than this nominal value, more so for heavier weights, in order that heavy weights will have smaller white spaces both between chars and inside each char.</p>
      <p><code>path-&gt;ellipse(...)</code> creates a path with a psuedo elliptical shape given center x, center y, radius x and radius y, plus two optional "roundness" factors.  The result is a true ellipse if the roundness is <code>4/3 (sqrt(2)-1)</code>, but currently I'm using slightly larger values to make bows more squarish.</p>
      <p>The function returns a list of things: the path consisting of two "ellipses" of opposite winding; the glyph width which includes left and right bearing; hori/vert hints ($os is the vertical overshoot); anchor point of typical accent-above.  The last one is going to be used for attaching accute, grave, etc., though right now only "i" and "j" use them (the "i" is really a composite of "dotlessi" plus "dotaccent").  This function is called by a master builder program when needed, and returned values are put into a list, later written out to a .sfd file (FontForge format), so I can either open it to have a look, or convert it to .otf via command line.</p>
      <p>I can make the whole system work, because I wrote every piece of code involved in defining the glyphs; it would be nice if I could make it more usable for anyone else, but for that I need to know if what I do makes sense (cf. lack of typographic training).  Right now I'd really appreciate it if someone can tell me stuff like "your uppercase letters needs more white space on either side" or "your 'X' is too thin on the right leaning stroke";  the only thing obvious to me is the fonts should be kerned, but I'd rather get the natural spacing of each character right before doing that.</p>
      <p>[EDIT: tag leak]</p>
