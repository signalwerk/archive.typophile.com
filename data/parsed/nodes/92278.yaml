    html: "<p>The K is really bad now, there is too much of A in it. Anyway, the letters e and c in all sets look odd: they're much wider than o's, like they were taken from an other typeface. I like things that happen to the upper parts of B,D,P etc - I have an impression that fine-tuned source details stay fine, while bugs grow. Probably there is some kind of a boundary that the outline method has, and cannot pass further... There is always a given skeleton, which can be split in parts, inside every outline; than, the outline (contrast, modulation etc) is a secondary issue, like a body. One can refine his figure only to a certain degree, allowed by shape of his bones.</p>"
