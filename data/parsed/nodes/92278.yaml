      <p>MMM as I understand, has a number of axes, each representing a continuously variable parameter, with a (hand-crafted) font sitting at either end of each axis, and the font engine interpolates in between these fonts.  I have a small program defining glyph outlines for each char, which in theory can do much more than interpolation: whatever the underlying programming language (Perl here) can do, can be done.</p>
      <p>MMM to me seem to have two important limitations: 1) I can't see how interpolation can give enough control to finer shape changes; 2) Correct me if I'm wrong, but if you have N parameters, MMM requires 2^N predefined glyph sets to work with, so if you have say 6 parameters, you'd need to make 64 fonts by hand, which rather defeats the point of letting computers do all the work.</p>
