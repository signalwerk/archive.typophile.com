      <p>@froo: If you think the "K" is bad, wait till you see the ampersand I currently have, heh.  As an amateur's first experiment, I'm not surprised there would be more bad glyphs than good ones; although your impression about "a", "e" and "o" did surprise me: e and o are always the same width, a is actually about 5-10% narrower.  If a and e appear visually wider, would that be because of the open hooks or the inner strokes?</p>
      <p>@dberlow: Besides work, what else are computers good for? We can make them do as much work as we understand the subject matter, and this experiment is to find out how much I understand it; if you give some pointer, I'll learn more, and the computer can do more.  It's highly probable that any automated font generation will always require some final human touch -- or it will cease to be an artform -- but it wouldn't hurt if computers can be made to do more stuff corretly to begin with.  I've openly stated my inexperience, there's no need to treat me like a moron.  Even if I were indeed one, making fun of it doesn't really help anyone, does it?</p>
