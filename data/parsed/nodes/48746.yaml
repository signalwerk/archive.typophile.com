      <p>As I understand it, there should be nothing in the OpenType small cap feature (smcp) that converts ß to small cap eszett.<br>
      However, caps-to-small-caps (c2sc), which is implemented as part of the "all small caps" menu item, should access the small cap eszett. It may be a good idea to have some other means of changing ß to small cap eszett, for instance in a stylistic set or as a stylistic alternate.</p>
      <p>**</p>
      <p>Is this just a gimmick, product of the restless minds and historical ambitions of Unicode developers (and chore for font designers), or will it find, or create, any real-world usage?<br>
      I mean, how many times are we going to see that 1954 book cover?</p>
