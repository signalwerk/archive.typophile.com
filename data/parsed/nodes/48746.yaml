      <p>&gt; Most importantly, ß is definitely a ligature of long-s<br>
      &gt; and s, not f and s, and that’s the same story with uppercase.</p>
      <p>I was never arguing that ß is a ligature of f and s. I said that the capital ß should be a ligature of a capital longs and a capital s. Since the capital longs never existed, it needs to be imagined though reverse thinking. Since the lowercase longs is the lowercase f without the crossbar, it is only logical to assume that the capital longs could look like a capital f without a crossbar, i.e. like the capital Greek gamma. In other words, the relationship of Γ and ſ and of F and f is the same. Since ß is a ligature of ſs, it is a logical consequence that the capital ß could be a ligature of ΓS. This is _pure logic_. </p>
      <p>Then, one needs to examine the practicality of the solution. And there, one arrives at the conclusion that since ß can be drawn as a ligature of ſs or as a ligature of ſƷ, the clearest distinction between the uppercase and the lowercase ß can be achieved if you draw the uppercase ß as a ligature of ΓƷ and the lowercase ß as the traditional ligature of ſs. </p>
      <p>I maintain that the ΓƷ shape is very "masculine" and very appropriate for a letter that is inherently uppercase. </p>
      <p>A.</p>
