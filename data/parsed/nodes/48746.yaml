      <p><cite>Presumably esszett in OT translates to SC/ss ?</cite></p>
      <p>Absolutely -- and it's nothing new to OT either.<br>
      Since there has been a code point for the eszet for ages, all-caps fonts had to put something there. If you check <a class="freelinking external" href="http://www.linotype.com/47727/trajanproregular-charactermap.html" rel="nofollow">Trajan</a> and <a class="freelinking external" href="http://www.paratype.com/fstore/charmap.asp?ProductID=36740566" rel="nofollow">Lithos</a> (random first links copied), you will find a double 'SS' in the place reserved for 'german double s'.</p>
      <p>All OTF (Pro) fonts I have at the mo' with a regular eszet display them as 'ss' in small caps. (Just checked:) and as 'SS' in All Caps.</p>
      <p>It may give rise to an interesting discussion. Should conversion (if that's the word) from eszet to double-s be a font designer's decision, or should it be at the typesetters' end?</p>
