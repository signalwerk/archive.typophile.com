    <p>Hi guys.<br>
    I'm making a font and trying to include capital ß, and small capital ß as well. I understand that Capital ß was recently added to Unicode as U+1E9E LATIN CAPITAL LETTER SHARP S, but I can't find the small capital one. I suppose it's probably not yet included, but I'm not sure. Does anyone know about the issue, and is there no problem not assigning a Unicode number? (I'm planning to make this character appear by Opentype smcp or salt feature)</p>
