      <p>My reasoning  for the form I used was an attempt to have a reader simply accept the capital as an Eszett with as little debate as possible. This for me is a daunting task because I am not a native German speaker who is used to seeing German text. My hope is that if enough type designers make an attempt and put something out there to be seen, that the German speakers will discuss all the options and we will eventually have a range of forms that are acceptable. Right now, there is very little out there for a proper dialogue to ensue. As for myself, I am just hoping for more input from the German speaking community.<br>
      I can completely understand Adam's logic in treating the cap F without a crossbar in the same way as we treated the long s of old. The trouble is as I attempted to use it, was that it kept separating itself too much from the rest of the text. It looked either too angled, too Greek (or Cyrillic as Bill says), to constructed or just too awkward. I felt as though a reader would have to go through the logical steps of figuring out the longS as an F and then saying, "Oh, that is what he means" rather than just reading Eszett without further ado. The long s in lowercase is so rarely seen that many people may not even attend to it as anything familiar to begin with. In the cap form, it never existed so there is no visual memory, only right-brained extrapolation and reconstructed logic, A similar thing to extreme might be to use bull's head line drawing inverted as an A for a new glyph called the double bowled cap A. We may know the origin of Aleph but the connection no-longer reads without analysis. I was just trying a way to just have it read without needing interpretation.<br>
      In the eyes of German speakers, I may have failed--this I do not deny. I admit I have been greatly influenced by reading Ralf's posts here and on Flickr regarding this over recent years since he seems to be one of the few to invite the dialogue and prompt his fellow Germans to respond. I am an interested observer who knows little of the German language but seek to participate in the dialogue not only because I attempt to design typefaces but that the idea of a new letterform intrigues me greatly. I admit I do feel like an interloper who might have been tempted to draw a U to go with the Trajan inscription :-)</p>
      <p>ChrisL</p>
