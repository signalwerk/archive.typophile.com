      <p>The dilemma we face as type designers and type aficionados is that we are very close to form issues and very far from being naive readers. We tend to get inthralled with the nuance and detail that separates one typestyle from another and overlook the forest. Much of our discussion in this thread has been about the details of a typeface rather than the distinctions of a single new glyph in relation to the rest of the long established set. A reader is not looking for what will become a decision point of form during reading. Readers are not looking for any form issues. They just want the flow of reading to continue without intervention. Imagine what happened when the first U was made part of the Roman alphabet? It was a new odd form that had to find its place. There is no getting around this point in time. It may take a generation or 2 to have the new Eszett take an accepted place for readers. It is not a question of proportions of space or degree of curve. These are type design issues we all deal with. Something much more basic is at issue here, pointed upper-left corner or rounded upper-left corner, vertical stem drops below baseline or not, S curve or Z? While I might find Ralf's form too wide and disturbing to color, it is basically the same as the one I have drawn or Jos has shown. There are way too many variations in type style that need to be allowed for to constrain anyone's design by style. I also find the O he has shown in that same sample as being too narrow for the D or other letters but I still clearly see it as an O and not a zero. That would be a discussion he and I might have about designing a particular typeface but not about defining a new glyph. With ANY new glyph, the reader will struggle to decide f it is one of the older glyphs or not. This is a learning process we must go through and formal quality is not the issue for that, only structure.</p>
      <p>I agree with Bill's comments about abstract terms. I never knew about or even accept the gender description of Latin caps and lower case as being masculine or feminine. Likewise' what exactly is "Robustness" and how does it come into play? These terms don't help me understand the problem Adam is seeing. I hope Adam can find another way to describe the problem he sees.</p>
      <p>Thanks for the kind words, Bill! </p>
      <p>ChrisL</p>
