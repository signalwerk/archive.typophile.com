      <p><em>Remember that there should be clear, obvious visual distinction between a lowercase letter and an uppercase letter.</em></p>
      <p>Of course, but in what way? Many letters in the Latin alphabet have extremely similar shapes across case, differentiated by other qualities, in particular stroke weight and size. Now admittedly, the cap and lower case eszett are nominally the same size, which is potentially problematic, but if the weight and proportions are suitably "upper case", then there won't be confusion. Context must count for something, and this letter never starts a word, and is usually surrounded by other capitals. In Ralf's samples, it is simply illogical to assume that when all other letters are upper case, the eszett is lower case, and in those fonts, it is sufficiently big and with matching stroke weights that it doesn't give that impression. However, I do think that in the Max Goldt cover, the character is too fussy for a capital, with that upward "flick" of a stroke towards the top right.</p>
