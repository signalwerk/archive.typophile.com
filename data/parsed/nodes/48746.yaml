      <p>Chris' and Jos' Eszetts still have the problem, that there too much "B" in it, especially if your reading it in smaller sizes. The small gap and the short diagonal stroke just isn't enough. This is true, even if the B looks very differently in those typefaces. We don't read by comparing the letter forms. The neurons just fire, when they see a shape that matches the pattern. And the B neurons will fire when they see such capital Eszetts. Sure, the reader will usually correct that within the context of the surrounding letters, but it might be better to have a unique letter in the first place.<br>
      I usually solve this by making the character significantly wider than B, usually the width of a G. Such a design can never be mistaken for a B.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/lucida_4402.png"></div><p></p>
