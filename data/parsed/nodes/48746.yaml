      <p>I'm not sure that the most-used fonts are going to be updated. This isn't like the euro currency symbol. There was a very impending need with this… font makers had to update their fonts, because the currency hit the ground running in a dozen countries on a single day!</p>
      <p>But even when font makers updated their fonts to include euros, these font updates were not distributed free-of-charge to licensees, at least not by the larger distributors. The best case scenario was that some foundries released "euro fonts," which were fonts with just the new euro symbols in them, in various fonts or styles…</p>
      <p>I wouldn't expect average computer users—or even average graphic designers or CS users—to have cap (or small cap) eszetts in their most commonly-used fonts any time soon, if ever. Perhaps when OpenType fonts are supplanted by whatever technology will come around next, and everyone will needs re-license their old fonts/license new fonts/etc. Maybe some of these will have cap and small cap eszetts…</p>
