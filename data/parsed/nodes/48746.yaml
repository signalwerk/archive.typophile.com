      <p>Ralf, I like your variation but I think you worry too much about B-ness. Character differentiation at small sizes is an issue in itself, one that affects all characters. b-ness, or Beta-ness, is also a problem that afflicts many of the badly designed lowercase esszet glyphs of the past (less for a German reader, who will always know that the near-Beta is supposed to be an esszet, than for everyone else). And none of that means that a near-Beta generic lowercase esszet is a good thing. All of that said, I still think your example is too wide, because it is out of proportion with the other characters. The right hand side is longing to be closer to the left hand side. </p>
      <p>Adam, you speak of skeleta, flexibility, and robustness ... terms that are frustratingly inexact and reflect the implicit difficulty of a scientific approach. Still, the Chris Lozos esszet is still the only one that looks 'like it always belonged there.' I see no reason why this should not happen at small sizes. Reduced to slushy 8 point newsprint, you might have problems, but you will have those for many other characters in the alphabet under such conditions and must redesign accordingly. The task here is more to come up with a general solution than to provide insurance for every possible optical condition. Since the displaying is at display size, it naturally makes sense for the design to be a display size. </p>
      <p>Ralf, the more I look at your version, the more I like it. But it needs to be a trifle narrower, and though I love the upsweep of the curve in the final stroke, I think it is a mistake, because it makes the lower curve look like the illustration of a hook. One of the reasons Chris's example works is that all the curve directions appear to be in the right place to signal the brain to get the message ''it's OK", its recognizable, it's a friend, I know it.</p>
      <p>'Hookness' should probably be avoided to the extent possible. You can see Jos's examples being on the edge of hookness, and just barely avoiding it. </p>
      <p>Needless to say, like Chris, I'm on edge about giving my opinion about a German character to a German, but ' . . . wenn man hoeflich ist' !</p>
