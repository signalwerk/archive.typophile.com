    votes: null
    html: <p>I like these very much though I don't like them quite as much as Chris's. Trying to analyze my feelings I'd say at a rough guess that I prefer the more generous way he handles the top left curve and the more free way he handles the bottom right curve. But another factor is that I really like good ultra light sans designs. Ultra light seems to me the sweet spot for appreciating the intrinsic beauties of many sans designs. Not that we're talking about beauty here, but I'm trying to factor in my prejudices. What you have shown, Jos, is that the principle has merit, and can be successfully applied to a variety of styles. Now we have to see if this principle stands up when used with a conventional serif face such as Garamond or Baskerville. Nobody should feel ashamed for not achieving an ideal cap esszet, considering how very many truly dreadful lower case esszets have been designed in the history of type! Either case, it's a difficult character!</p>
