    html: |-
      <p>I would guess in anything <em>except</em> OpenType there is an actual single "SS" glyph. Translation of single-to-multiple glyphs is something very recent.</p>
      <p>I was going to mention plain old Courier as a test case, because a monospace font may only be called that if <em>all</em> glyphs are the same width. I know from experience you should switch ligatures off in monospaced fonts (in the future, before the book is printed, not afterwards), because Courier has "fi" and "fl" ligatures, and they are the same width as a single character.<br>
      But someone thought ahead, and provided a modern OTF variant, so the "ß" single width glyph translates to double-width double-S on capitalisation.</p>
      <p>(Even checking further:) Oh, okay: my Courier <em>doesn't have</em> a single "SS" glyph. It must be the software that did the translation (and thus prohibiting 'capitalized-ß').</p>
