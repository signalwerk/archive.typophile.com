      <p>I was of the impression that there are no standardized unicode encodings for small-caps in the typographical sense at all. Only for small-caps that have a particular meaning in some language, such as 'LATIN LETTER SMALL CAPITAL R' (U+0280), which is the lower case of 'LATIN LETTER YR' (U+01A6). But such codepoints have a different semantic then those typically encoded in the private use area of opentype fonts. Consequently, a smallcaps form of the capital SZ would be placed in that private use area too as it doesn't have semantics in the linguistic sense.</p>
      <p>I wasn't aware of the capital SZ being standardized. I think this is cool and also very ironic as the latest reformation of German orthography almost entirely abandoned the need for the SZ at all.</p>
      <p>Ralf, I just saw the samples you provided for the <a href="http://de.wikipedia.org/wiki/Gro%C3%9Fes_%C3%9F" rel="nofollow">German Wikipedia page on the capital ß</a>. Neat stuff! I really like some of the interpretations those faces offer, especially P22 Underground's version.</p>
    html_clean: |-
