      <p>Small caps never have a unicode number assigned but are invoked by formatting features (OT preferably), except if small capitals are used in some (e.g. phonetic transcription) alphabets as letters with distinct meaning. "Capital Esszet" is not even used in any official orthography in the world, and of course neither is the small capital form of it used in any phonetic alphabet. Therefore you don't have a Unicode codepoint for it.</p>
      <p>Szabolcs</p>
