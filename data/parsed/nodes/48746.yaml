      <p>Jos, </p>
      <p>your #3 looks good — in this particular typeface, with a strong calligraphic flair, it makes sense to give the cap-ß а descender and overall a more flowy, rounded shape. However, the letter is too dark compared to the regular uppercase letters. </p>
      <p>But the other three cap-ßs just look like enlarged lowercase ßs. They don't feel like uppercase letters at all — they're too narrow and too complex in their structure. The uppercase of the Latin alphabet uses a very simple set of basic composition elements: vertical stroke, horizontal stroke, diagonal stroke and a half-circle. Even the letter S, which is a fairly complex shape, is still pretty simple. The letter J is the only one that does not use the standard building blocks — since it's a "late arrival" to the alphabet. The other "late arrivals" like K and W have integrated nicely because they speak the formal language of the Latin uppercase. </p>
      <p>The shape you guys are proposing lacks one essential aspect of the other Latin uppercase letters: robustness. The underlying skeleton of the Latin capitals is robust and flexible at the same time. They're capable of taking any stylistic treatment you imagine, and they clearly stand apart from each other. The new member of the gang must bring the same qualities. It should look like it always belonged there. </p>
      <p>Adam</p>
