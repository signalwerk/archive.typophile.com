      <p>I still maintain that a more "rectangular" form of capital ß would be better, along the lines of my proposal at<br>
      <a href="http://typophile.com/node/33647" title="http://typophile.com/node/33647">http://typophile.com/node/33647</a></p>
      <p>The curved top left corner is illogical and only makes sense if the top left color of F is curved as well, a la Handel Gothic. Through the analogy, if the lowercase longs looks like a lowercase f without the bar, then the (nonexistent) uppercase longs should look like the uppercase F without the bar, i.e. like the Greek uppercase Gamma. And this should be what the left side of the uppercase ß looks like.</p>
      <p>Remember that there should be clear, obvious visual distinction between a lowercase letter and an uppercase letter. The curved-top uppercase ß proposals all look like hybrids between uppercase and lowercase, they're not sufficiently different from the normal lowercase ß. </p>
      <p>A.</p>
