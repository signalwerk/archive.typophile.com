      <p>Nick, the way the German keyboard layout is arranged, shift-ß gives you a question mark - so much for people entering it manually. For a capitalized charcter stlye it's good to have though, albeit many people will expect 'SS' instead of capital-ß, so making it optional (stylistic set? not sure about the technical implementation) seems reasonable.</p>
      <p>While you are at design challenges posed by the German language, how about adding fffl ligatures for beauties such as "Sauerstoffflasche" (oxygen bottle). The only font I know of that has this is Requiem (because Bringhurst mentioned it). Coincidentally, H&amp;FJ get it wrong in <a href="http://www.typography.com/fonts/font_features.php?featureID=44&amp;productLineID=100020" rel="nofollow">their sample</a> and misspell it "Sauerstoffflachen" ;). With the 1996 rules, an fff-ligature for "Schifffahrt" (boat trip) may also be in order. However, and now I'm getting totally off-topic, someone had the ingenious idea of making orthographic rules about ligature. These rules (in general) state that a ligature should not be used when compunds are formed (which is often the case in the German language). Thus, the use of an fffl ligature in "Sauerstoffflasche" would be considered an error by that rule ;)</p>
      <p>In <a href="http://www.typophile.com/node/46540" rel="nofollow">another thread</a>, where Ralf and others already provided a lot of interesting background on this topic, it was suggested that a new type of ligature was called for. Kind of a non-connecting ligature. In a font where the f reaches far to the right (e.g. Bembo) setting a word like "auflegen", for which the rule states not to use an fl-ligature, results in such letterspaceing that it reads like "auf_legen". That is if you don't want the f and l glyph to clash.</p>
      <p>Thus, the next German type design challenge would alternative ligatures for use at German compound boundaries which are designed so that the glyphs in the ligature don't touch. I wonder if German users would be interested in such fonts ;)</p>
