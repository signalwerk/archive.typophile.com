      <p>Well, I have looked at the interminable thread referenced, and all the examples, and I still find Chris's example is the only persuasive one. I don't know why, and I don't know whether the approach would work in a serif font, and I'm not entirely happy with Chris's normal, lowercase eszett. Of all the serif models proposed here and in the previous thread, I find them annoying, illogical and too noticeable. </p>
