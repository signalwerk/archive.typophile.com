    <p>So I've never been so bold as to subject a project like this to an anonymous Internet board. I'm a second year student in a design program, and I'm trying to get feedback on this branding I'm finishing up. </p>
    <p>Company is called Mixtape Union. It's a site that's all about reviving the mixtape in all it's glory, not just sharing playlists. I didn't want to do something that was so obvious and retro... that's the first tendency for a lot of people. I wanted to give it its own feel. </p>
    <p>Anyway, the logo, type, and stationery are all here. I'm new to typography and all, so keep that in mind. Feel free to be harsh about your critiques.</p>
