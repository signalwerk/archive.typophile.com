      <p>Your feedbacks are awesome! I love this forum. </p>
      <p>Yeah, you ever get into a design project and have an idea... get attached to it and aren't willing to tell yourself to let go and start over? I think that's what happened here. </p>
      <p>I thought to myself, "everytime someone thinks about mixtapes they have the same ideas and mental imagery". I wanted to merge a newer look with a classic idea. At the end of the day, maybe it's just miscommunicating the purpose...</p>
      <p>Anyway, thanks so much. I'm working with it.</p>
