      <p>I think you've utilized some good techniques, but I'm not sure the overall vibe is right for "mixtapes" (at least not as I know them). I would consider the underlying mood/vibe/style goal before spending time on fine tuning.</p>
      <p>A few notes...</p>
      <p>1. The overall vibe seems a bit clean and clinical.</p>
      <p>2. The color scheme (blue/grey/white/black) is cold.</p>
      <p>3. The logo font could use more personality.</p>
      <p>4. Icons seem a bit too info graphic style.</p>
      <p>5. Where is the fun?</p>
      <p>Tapes are analog, and this feels cold and digital. Aren't mixtapes about piecing together random bits of music, and doing a quick handmade cover and labels?</p>
      <p>Or are we talking about a different kind of mixtapes?</p>
