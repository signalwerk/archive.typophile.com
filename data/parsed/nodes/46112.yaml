  html: |-
    <p>For example, House Industries’ <a href="https://web.archive.org/web/20081012141803/http://www.houseind.com/index.php?page=showfont&amp;id=4&amp;subpage=viewfonts">Chalet</a> comes in three different styles (1960, 1970 and 1980) and each has different weights, but instead of light, regular, bold they use Paris, London, New York.</p>
    <p>I’m sure there are a bunch of other typefaces that forego the typical weight labels.</p>
    <p>Examples would be appreciated!</p>
