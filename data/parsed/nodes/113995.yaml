    html: |-
      <p>The normal way would be connect the base glyph with the alternates through a feature (e.g. SALT, CALT, …) and then also assign these features to AALT (“All Alternates”).<br>
      Then in InDesign the user gets a drop-down menu from the base glyph to access all available alternates for the base glyph.</p>
