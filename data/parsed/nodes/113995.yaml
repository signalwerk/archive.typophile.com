    <p>Hello,<br>
    I'm drawing a conceptual font were the upper case is depending on the lower case. I have made alternative glyphs for zero–nine, so they will work with the same principle as the letters, A–Z and a–z.<br>
    But in the InDesign glyph window the name of the alternative "zero" becomes "NULL" which makes it hard to find/understand.<br>
    The forms of the characters only makes sense when they are together.</p>
    <p>So, is it possible to name the alternative zero (today named zero.alt1 in FLS) so it turns up in the InDesign glyph window as something related to zero? Like zero.alt1?</p>
    <p>Thank you.</p>
    <p>Regards<br>
    Andreas</p>
