      <p>I like _03 best. I think it looks a more confident mark.<br>
      I generally prefer logos where the type and icon interact with each other, and are’nt separate parts. With _01 and _02 if the purpose of this project is a visual device to promote your name, then the size ratio between the type and icon needs attention.</p>
      <p>You have another design element of the ’-’ symbol above the ’a’, not sure what this is telling me? </p>
      <p>Also for _03 I think you should spell out your full name and not the initial.</p>
