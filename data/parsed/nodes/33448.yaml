    html: <p>I like _01 best, though I couldn’t say which variant. It’s well crafted and I like the type treatment. The only sure message it sends me is that you would like your name to be pronounced “har-gree-ayves”. As for the mark, it seems exceptionally neutral, evoking nothing and just being a design - and since you’re selling design, I guess that works.</p>
