    <p>Hi All,</p>
    <p>I’m developing my personal identity. The logo is narrowed down to a few versions of the same basic idea. I’m mostly looking for formal and aesthetic comments, but everything is welcome. I don’t really want to give any description of the concept; out in the real world, the viewer will be on their own to determine what it expresses, so why manipulate others’ reactions now? I’m very interested in what everyone thinks of the graphic, what impression it gives off, and how it’s crafted.</p>
    <p>Thanks!<br>
    Jim</p>
    <p>—<br>
    Jim Hargreaves<br>
    MA Graphic Design<br>
    Savannah College of Art and Design</p>
