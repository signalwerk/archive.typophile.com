      <p>I agree that it’s a finely constructed mark that conveys simplicity, sophistication, and freshness. </p>
      <p>I’m cursed with corny shape associations ... so take what I say with a grain of salt from this point forward.  Stupidly, I see the orange/flower as as a Trivial Pursuit game piece. (Maybe I’m just bitter for sucking at Trivial Pursuit.)</p>
      <p>The examples that are “framed”, my crazy brain sees a piece of toast, which makes the “flower” a rather distinctive burn pattern embossed by a novelty toaster.</p>
      <p>I hope Dr. Phil isn’t reading this.</p>
