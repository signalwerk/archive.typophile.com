      <p>This is why logos ought to be designed in single color.  Others think the symbol is a flower.  I thought it was an orange slice.  If that’s the case, I imagine this is about “fresh” design or something.  I also see a hub and partnership.  Let us know if this was intended or not.</p>
      <p>I’d like to see the type (from 02 as well) made a little less neutral.  I’m not sure I feel much relationship between it and the symbol.  And, like the others, I’d like to know what the macron over the ’a’ is about.</p>
