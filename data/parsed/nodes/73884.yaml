      <p>Hi!</p>
      <p>Thanks for your quick reply!</p>
      <p>I don't think it's handwritten - because they used the font also for sublines like "Classics" (<a href="http://myfonts-wtf.s3.amazonaws.com/5a/5ae20adf612cd71d74dd50dcd4a2491c.14391.png" title="http://myfonts-wtf.s3.amazonaws.com/5a/5ae20adf612cd71d74dd50dcd4a2491c.14391.png">http://myfonts-wtf.s3.amazonaws.com/5a/5ae20adf612cd71d74dd50dcd4a2491c....</a> - all "s" are the same).</p>
      <p>My picture is a scan from a poster - i deleted the background-image and this could be the reason for the different "a"s :-)</p>
      <p>But the "M"s, "i"s and "g"s aren't different :-)</p>
      <p>Thanks for trying!</p>
