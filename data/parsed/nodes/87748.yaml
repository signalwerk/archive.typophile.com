    <p><a href="http://www.fontblog.de/hans-reichel-1949-2011" rel="nofollow">Fontblog.de</a> announces sad news: </p>
    <p>Hans Reichel, typedesigner, musician, inventor of the daxophon and creator of FF Dax, FF Daxline, FF Sari, Barmeno FF Schmalhans, FF Routes has passed away on Tuesday, November 22nd. </p>
    <p>More (in german) at Fontblog.de</p>
    <p><strong>Update</strong>: Now at the <a href="https://www.fontfont.com/news/hans-reichel-1949-2011" rel="nofollow">FontFont-site</a> too (english)</p>
