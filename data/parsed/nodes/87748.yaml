    html: "<p>An example of disciplinary solitudes: before reading obituaries today, I had no idea that Hans Reichel was the inventor of the daxophone, while his Wikipedia entry discusses his musical inventions and activities, but does not (as of this morning) mention his typeface designs.</p>"
