    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Design%20Applications" class="freelinking" rel="nofollow">Design Applications</a> : LaTeX</strong></p>
    <p>LaTeX is a document preparation system for the <a href="/wiki/TeX" class="freelinking" rel="nofollow">TeX</a> typesetting program.</p>
    <p>It offers programmable desktop publishing features and extensive facilities for automating most aspects of typesetting and desktop publishing, including numbering and cross-referencing, tables and figures, page layout, bibliographies, and much more. LaTeX was originally written in 1984 by Leslie Lamport and has become the dominant method for using <a href="/wiki/TeX" class="freelinking" rel="nofollow">TeX</a>—few people write in plain TeX anymore. The current version is LaTeX2ε.</p>
