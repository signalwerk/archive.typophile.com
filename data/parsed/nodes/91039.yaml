    html: |-
      <p>Thanks for the input!</p>
      <p>If not Frutiger, what else? Yes, Neue Frutiger might be a choice, since it has a Book weight. But then I'm not sure since I traditionally prefer serifs in body (that is in extended texts). </p>
      <p>I feel that this whole updating process and the result of it regarding Frutiger is about being trendy and following the recommendations from and ad agency. The given explanation has been "as long as you can read it", " it's not that bad" and "our own scientists says so" (and who can argue with them?) rather than looking at why Frutiger is the best choice from a typographic and legible point of view. Of course you can read it, but again, is it the best choice in the long run? </p>
      <p>Talking about trends, maybe they should have replaced the fonts with something entirely new, like something Scandinavian or even Swedish? Berling Nova is a personal favorite. And when it's time for a new update of the graphic profile, I promise, I will be even more prepared.</p>
      <p>Thanks again for the comments =)</p>
