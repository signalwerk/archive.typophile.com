    html: <p>With the risk of sounding at odds with the general opinions expressed here, I think that Frutiger can work nicely in long text settings - say, in a magazine environment. Nonetheless, What Lovisa Jones says about the look of the roman weight is true - it can be too dense on the page (same goes for Gill Sans, in my opinion). One alternative could be using Frutiger Light, rightly spaced and leaded, at 9 or 10 points, if the printer's black is a real black. The pairing with Adobe Garamond also looks interesting to me.</p>
