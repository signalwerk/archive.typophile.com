    <p>Is Frutiger (regular) a wise, functional and estetical choice to use for body copy in a combination with Adobe Garamond Pro (semibold) for headlines?  </p>
    <p>I work with graphic design at one of the oldest swedish universities and recently the university has updated its graphic profile with the help from a local ad agency. This new type combination – it's actually just been reversed, Frutiger was used for display before – is supposed to be used in all communication material (ads, posters, brochures, magazines etc). There is nothing wrong with Frutiger but in longer texts and in smaller measures – it's just really hard to read even if the leading is spacious.</p>
  html_clean: |-
