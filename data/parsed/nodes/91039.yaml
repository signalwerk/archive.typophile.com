      <blockquote><p>Although there's a reason "Frutiger Serif" was not the design's original name...</p></blockquote>
      <p>Sure, but Frutiger Serif not only fits Frutiger's proportions, it is also closer to to Meriden's original metal proportions. The structure is also in general close to Frutiger, although the italic in Frutiger (Sans) should really have changed structure the same way that Meriden does. Or at least closer to that.</p>
      <p>But they do have a quite different feel, despite a somewhat similar structure and system of proportion.</p>
