    html: <p>Of course Mark is right, and so I assumed that what you wanted to do was match the lettering, not find the 'font'.  I looked at a number of sans serif fonts, and had trouble finding one that had everything. Futura has the right 's', but its 'u' has no stem; the 'b' from Quay Sans Black was fine, but the 'u' isn't quite right.  If I were going to replicate this I would use the 3, o, l and b from Quay Sans Black (above), and use the s from Futura Heavy and modify the Futura u by adding a stem.  (see attached version done that way, with some adjustments to size, tracking, and using the Futura'l' for the l and stem of the 'b'.) If that's too much work I'd stay with the Quay Sans version I did above. It would probably be close enough if you weren't comparing them side-by-side. <br><img src="http://www.typophile.com/forums/messages/83/22486.gif" alt="Essolub Sim 2"></p>
    html_clean: <p>Of course Mark is right, and so I assumed that what you wanted to do was match the lettering, not find the 'font'.  I looked at a number of sans serif fonts, and had trouble finding one that had everything. Futura has the right 's', but its 'u' has no stem; the 'b' from Quay Sans Black was fine, but the 'u' isn't quite right.  If I were going to replicate this I would use the 3, o, l and b from Quay Sans Black (above), and use the s from Futura Heavy and modify the Futura u by adding a stem.  (see attached version done that way, with some adjustments to size, tracking, and using the Futura'l' for the l and stem of the 'b'.) If that's too much work I'd stay with the Quay Sans version I did above. It would probably be close enough if you weren't comparing them side-by-side. <br><img src="http://www.typophile.com/forums/messages/83/22486.gif" alt="Essolub Sim 2"></p>
