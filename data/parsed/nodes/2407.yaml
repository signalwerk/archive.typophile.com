    html: <p>I am continually surprised at how often people assume that some old piece of lettering is type. Old advertising art like that is most likely not type, even if it was mass-produced, and even when it looks like it could be type (i.e., nothing particularly irregular about the letterforms or their treatment). Doing it by hand was the only way back then to have the kind of flexibility and control over the design that we take for granted today. </p>
