    html: <p>It's probably a custom type design, but I think you can simulate it easily by using a backwards 3 for the E. I did this sample with Quay Sans Black, which is maybe not the best font match for the s and u, but it gives the idea (the 3 was the right sort of shape).<img src="http://www.typophile.com/forums/messages/83/22398.gif" alt="EssolubSimulation"></p>
