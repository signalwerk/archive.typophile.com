    html: |-
      <p>If you use the quotes on a pair of words for example "humanist Gill" you will get substantially different returns to [humanist gill], in fact the brackets made no difference to not having them. The key, I think, is that the quotes will produce results where those words follow each other, albeit including between them any of the terms and short common words that google ignores like punctuation and of, and, the.</p>
      <p>Tim</p>
