    html: |-
      <p>This is one I have written and it works on any site. You can select text from any page. When you press the 'search' button it will prompt you to type in a phrase, with the selected text already in the box. Just press 'OK' and a new window will open with Google search results.</p>
      <p><code>javascript:void(function()%20{%20var%20href%20=%20window.location.hostname;<br>
      %20var%20query%20=%20prompt('Enter%20a%20search%20phrase:',%20window.getSelection());<br>
      %20if(!query)%20{%20return%20false;%20}%20window.open('http://www.google.com/search?q=site:'+href+'+'+encodeURIComponent(query));%20}());</code></p>
      <p>If you prefer to stay in the same window however, use this one:</p>
      <p><code>javascript:void(function()%20{%20var%20href%20=%20window.location.hostname;<br>
      %20var%20query%20=%20prompt('Enter%20a%20search%20phrase:',%20window.getSelection());<br>
      %20if(!query)%20{%20return%20false;%20}%20window.location.href%20=%20'http://www.google.com/search?q=site:'+href+'+'+encodeURIComponent(query);%20}());</code></p>
      <p>Copy to a text file and make sure it is all on one line. Then simply bookmark it. Tested on Mac (Safari, Omniweb &amp; Firefox).</p>
