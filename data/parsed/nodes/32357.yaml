      <p>javascript:void(q=prompt('Search%20Typophile:',''));if(q)void(location.href='http://www.google.com/search?q=site:typophile.com'+'%20'+escape(q))</p>
      <p>Copy that into your address bar and then bookmark it. This is something which Grant Hutchinson made a while back. Smooth as silk.</p>
