      <p>Perhaps I'm slightly missing what neutrality is about. I'm starting to think to you guys neutrality is a "dry" grotesque face. At the same time though I couldn't really say what's perfectly neutral. I agree with donshottype's comment: "Some similar fonts, such as Myriad have picked up baggage. For many people Myriad now says Apple." Myriad has always been a face without much of an identity for me, but I can see how people become so familiar with a brand that a typeface suddenly says a lot more than perhaps it initially intended. For me Helvetica and Arial are at least culturally not at all neutral. We recognize both immediately and it comes with a lot of historical baggage. Arial is also the default typeface of the city I live in so Arial tends to become even less neutral for me.</p>
      <p>But can you guys clarify what you think of when considering neutrality in typefaces? hamest mentioned he's looking for a typeface that is "free from political, social and cultural connotations". I think faces like Helvetica are not that, but perhaps an unpopular Helvetica no one is familiar with would be. I don't really understand how faces like Helvetica and especially Akzidenz Grotesk pop up here though. What I think of when considering "neutrality" and "skeletal" is a typeface stripped down from the essentials. Not a geometric typeface, but a clean grotesque. No spurs. As I mentioned Univers is quite neutral to me. I don't find Folio neutral at all because of those strange counters. I like it, but it's far from neutral. So perhaps you reason neutrality differently?</p>
