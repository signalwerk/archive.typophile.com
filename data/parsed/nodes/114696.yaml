      <p>Reasons for interpretation:</p>
      <p>1. Foundry type letter design varies with size: and size-speciﬁc (“opticals”) fonts are almost never made for sans serif.</p>
      <p>2. Foundry type image varies with paper stock and different amounts of pressure and ink gain.</p>
      <p>3. Foundry type impression of the same letter varies with individual type, inking, and pressure.</p>
