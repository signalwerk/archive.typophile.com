      <p>Nick, why do you say it's averaged neutrality? It's just an average. That's very different from neutrality, even if averaging techniques may be applied to eventually get to a form which may be perceived as neutral. The output of these averaging techniques depend on the input and since the input isn't necessarily neutral, you can't expect the outcome to be. To get to neutrality you need human eyes and rationality. If all typefaces are like circles and true neutrality is like a triangle, then by taking the average of all those circles you will never get to a triangle. It will give insights into the common ground of typefaces which will probably make it easier to create a neutral skeleton because it restricts the area it can live in, but the averaging technique is just a tool and is not a showcase of neutrality.</p>
      <p>Like froo said: "With this method, you only get the set of common elements, a blurred area"</p>
