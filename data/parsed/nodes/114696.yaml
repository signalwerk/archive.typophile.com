      <p>To pick up the thread from Martin, how "skeletal" a grotesque is Helvetica really? I mean, some of its features are very distinct and extreme, far from neutral. I'm thinking of the extremely closed counters and ultra-consistently horizontal/vertical terminals, for instance. My take is that Miedinger was primarily concerned with logical consistency and esthetic purity (which may be the same thing), not neutrality in the sense of being unintrusive.</p>
      <p>(Univers has a similar thing going, and has the distinctive thing where bolder cuts have more contrast than most grotesques. Avenir, which of course is not a grot, is more "neutral" in the unobtrusive sense to my eye. Myriad is of course close to a copy of it.)</p>
