    html: |-
      <p>Kaiser's Fleischmann is not only an excellent typeface, it is the most convincing Flesichmann revival to date. But what I'm saying cannot in fact be applied to any revival; this is a rare case where I believe something valuable has failed to be revived. Virtually all revivals are either accurately faithful, or discard aspects that were –or have largely become– pointless. In contrast, I think aiming for higher readability is ever-relevant, and this particular opportunity has yet to be grasped.</p>
      <p>Did Kaiser play it safe (as I suspect), was he wary of reviving an aspect he did not himself sufficiently understand, or did he think the deviation in the original was simply a bad idea? That is the interesting question – it reflects not only on an individual designer but on how the market shapes culture.</p>
      <p>hhp</p>
