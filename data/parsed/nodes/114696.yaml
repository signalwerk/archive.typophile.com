      <p>Martin, I would say that averaging, cleaned up a little, is as good a method of targeting neutrality as any other.</p>
      <p>However, what I really believe is that the ﬁsh is not aware of the water.<br>
      So, considering that power laws (e.g. Lotka’s) operate in cultural markets, the most neutral or invisible typeface will be that which is most used for the kind of document and layout in which it appears, for the given readership demographic.</p>
