    <p>Hello Typophiles!<br>
    I am looking for a so called "neutral" typeface. I know there is no such thing, but I need at typeface for my project that is "free from political, social and cultural connotations". Do you know about any "skeleton" typefaces that excists digitally? Not skeleton as in "skin and bone", but refering to the common ground form of a typeface.<br>
    This is a mission impossible, but I thought it could be good to try this forum.  </p>
    <p>Any suggestions would be very much appreciated!</p>
