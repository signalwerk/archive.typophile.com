    date_raw: 12.Aug.2004 7.53pm
    votes: null
    html: <p>It's a computer science dissertation - couple hundred pages, in chapters, sections and sub-sections, with occasional box-and-arrows diagrams. Unfortunately, the school requires a 12pt font and double-spaced lines (!!!). So columns are probably out - it's just going to be wide and sparse lines of text filling a standard A4/letter page. <br> <br>My current fonts are what came with Windows and Office, including Book Antiqua, Bookman Old Style, etc. Right now I've been experimenting with Book Antiqua (thanks for the textism link BTW, it's very inspiring!), which looks fairly nice. It's got low x-height, though, which makes the long, double-spaced lines look funny. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>By the way, thanks for the Lido link - I'll definitely give it a try! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br></p>
    html_clean: <p>It's a computer science dissertation - couple hundred pages, in chapters, sections and sub-sections, with occasional box-and-arrows diagrams. Unfortunately, the school requires a 12pt font and double-spaced lines (!!!). So columns are probably out - it's just going to be wide and sparse lines of text filling a standard A4/letter page. <br> <br>My current fonts are what came with Windows and Office, including Book Antiqua, Bookman Old Style, etc. Right now I've been experimenting with Book Antiqua (thanks for the textism link BTW, it's very inspiring!), which looks fairly nice. It's got low x-height, though, which makes the long, double-spaced lines look funny. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>By the way, thanks for the Lido link - I'll definitely give it a try! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br></p>
  - id: 42777
    user: 3089
    date: 2004-08-12T20:51:00
    date_raw: 12.Aug.2004 8.51pm
    votes: null
    html: <p>If the school requires not just 12 point type and double spacing but also a fixed margin (as I recall one inch was usually the magic number) your main problem might be line length -- you might be getting too many characters per line. You might want to look for a wide face if that's the case (and, yes, a larger x-height because of the big line space).</p>
    html_clean: <p>If the school requires not just 12 point type and double spacing but also a fixed margin (as I recall one inch was usually the magic number) your main problem might be line length -- you might be getting too many characters per line. You might want to look for a wide face if that's the case (and, yes, a larger x-height because of the big line space).</p>
