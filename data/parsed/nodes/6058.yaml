  html: <p>Hi all, <br> <br>Can you recommend any good text fonts to a student on a budget? <br> <br>I'm currently writing a dissertation (not on graphic design, alas), which I will have to typeset and make camera-ready myself. And I would really, <i>really</i> like to escape the Times New Roman purgatory of standard science dissertations.  <br> <br>My only problem is that it would have to be a free or cheap TrueType font - say, under $20. Alas, I can't afford anything from FontFont, no matter how much I like them. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">   <br> <br>So what do you think? Any recommendations? <br></p>
  html_clean: <p>Hi all, <br> <br>Can you recommend any good text fonts to a student on a budget? <br> <br>I'm currently writing a dissertation (not on graphic design, alas), which I will have to typeset and make camera-ready myself. And I would really, <i>really</i> like to escape the Times New Roman purgatory of standard science dissertations.  <br> <br>My only problem is that it would have to be a free or cheap TrueType font - say, under $20. Alas, I can't afford anything from FontFont, no matter how much I like them. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">   <br> <br>So what do you think? Any recommendations? <br></p>
