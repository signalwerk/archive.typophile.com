    date_raw: 13.Aug.2004 5.57am
    votes: null
    html: <p>The terms 12 point and double line space are meaningless. 10 different fonts rendered at "12 point" could appear as 10 different sizes. Lines space will also be affected by the various font ascent and descent values. <br></p>
    html_clean: <p>The terms 12 point and double line space are meaningless. 10 different fonts rendered at "12 point" could appear as 10 different sizes. Lines space will also be affected by the various font ascent and descent values. <br></p>
