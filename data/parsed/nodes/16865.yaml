    <p>Hermann Zapf designed Aldus during the 1950s for <a href="/node/12158/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">D. Stempel <span class="caps">AG</span></a> and <a href="/node/13697/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype</a>. Aldus was a typeface optimized for book text setting, based on Zapf’s 1950 release, <a href="/node/16864/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Palatino</a>.</p>
    <p>A digital version of Aldus is available from Linotype, Adobe, and their&nbsp;partners.</p>
    <p>In 2005, Hermann Zapf released an OpenType revision and extension of his entire Palatino family, named <a href="/node/16863/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Palatino nova</a>. A new and improved digital Aldus is included, fittingly named <a href="/node/16866" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-lost">Aldus nova</a>.</p>
