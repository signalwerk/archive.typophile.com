    <p>Are you looking for the Renaissance Venetian Printer <a href="/node/14192" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aldus Manutius</a>?*</p>
    <p>This is the wiki-entry for <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>’s typeface <strong>Aldus</strong></p>
    <p>Hermann Zapf designed Aldus during the 1950s for <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> and <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>. Aldus was a typeface optimized for book text setting, based on Zapf’s 1950 release, <a href="/node/16864" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino</a>.</p>
    <p>A digital version of Aldus is available from Linotype, Adobe, and their&nbsp;partners.</p>
    <p>In 2005, Hermann Zapf released an OpenType revision and extension of his entire Palatino family, named <a href="/node/16863" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino nova</a>. A new and improved digital Aldus is included, fittingly named <a href="/node/16866" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aldus nova</a>.</p>
    <p>See the <a href="/node/16864" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino</a> thread for more&nbsp;information.</p>
    <p>View <a href="http://www.linotype.com/109957/aldusnova-family.html">Aldus nova on the Linotype website</a>.</p>
    <p>* Aldus is not a revival of types commissioned by Aldus Manutius. Rather, it is drawn in a general Italian Renaissance style and named in honor of his contribution to the world’s typographic&nbsp;development.</p>
