    <p>Since I got such excellent advices last time with my O – I feel I must ask this aswell. This is also some kind of optical trick to pull I believe, and maybe related (?). Is this also some variant of the "bone effect"?</p>
    <p>Please, look where the arrow is in this picture. It seems that the stroke is not straight where the arrow is, there is a little irritating circular (I wish my english was more technical) inside-moving "thing" that almost makes it look like I have put a point there, and moved it inside towards left.</p>
    <p>See it?</p>
    <p>The points are placed as you can see, is there a better way of placing the points for a more straight "ending" that later on transforms into the little serif. I want the stroke to look 100% straight and end with this little serif at the bottom.</p>
    <p>What would you do to make this perfect?</p>
    <p>I thought that these triangular points would be best suited since it puts the handle in the exact angle based on the other point above, but this doesnt look good!</p>
    <p>Thanks in advance.</p><div class="imageWrap"><img src="http://typophile.com/files/anothertrickyone_6139.png"></div><p></p>
