      <p>Goran,</p>
      <p>Type design consists of repeated changes, fixes, refinements. If you have a clear idea in your head of the shapes you want, then I suggest you experiment. If something doesn't look right, slide the points around. Add points. Subtract points. Change the relationship of the control points. Eventually you will discover what bezier outlines can do, and you will also discover how to control them to get the effects you want. Do not cling to a previous outline; there's no savings, economy or thrift in that. Put old outlines in the background and try again. In FontLab Studio 5 you can even leave points selected in the background so you can see what you did before.</p>
