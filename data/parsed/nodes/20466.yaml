      <p>You might also move the lower left point on the base line slightly to the right because it affects the illusion on the other side of the stroke.  Correcting for illusions seen at small sizes while looking at large sizes can be tricky. Hang in there! Fighting frustration is all part of the learning process--but a tall cool beer helps sometimes :-)</p>
