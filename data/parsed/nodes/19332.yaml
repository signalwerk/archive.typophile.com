      <p>Hmmmm...it looks like you have kind of a sticky situation, yet some really great opportunities still.  It's really great that you are considering a 360 degree career change into something creative/not always in demand or stable--it's a big leap to take for sure.  I understand when you say you want a less academic school and one focused more on your field and such since you do already have some type of experience.  I mean...yes, 4 years is pretty long to start another whole new degree.</p>
      <p>So, let's a take a look at your options...<br>
      1.  <a href="http://www.mica.edu/" title="http://www.mica.edu/">http://www.mica.edu/</a> - offers the "create your own degree" aspect, which will allow you a little more freedom with you creativity/art which may or may not fire back in the longrun<br>
      2.  <a href="http://www.risd.edu/" title="http://www.risd.edu/">http://www.risd.edu/</a> - it is more renowned with very talented teachers, but it is more structured but has really great campus environment and programs<br>
      3.  <a href="http://www.onlinegraphicdesigndegree.com/" title="http://www.onlinegraphicdesigndegree.com/">http://www.onlinegraphicdesigndegree.com/</a> - this might be an alternative to you since you are only looking for something short term, you can always just take some courses online to add to your already known skills and still keep your IT job until you are ready to take on graphic design full time</p>
      <p>Honestly, when deciding schools, it's more about the environment and culture that you will feel the most comfortable at.  The majority of all art schools are going to give you pretty much the education that you need to succeed, so just consider on what YOU want to gain from formal education at an art school.</p>
