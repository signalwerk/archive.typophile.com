    <p>I have an undergrad degree in Engineering and am still working in Information technology. Following my lifelong passion for design, I finally enrolled at Rochester Institute of Technology part time as a graphic design undergrad student. I still work full time and take foundation level art classes in the evenings. I do plan to attend school full time in NYC when my husband is done with school in Rochester(he is changing careers into commercial photography).<br>
    Questions - I don't want a super academic school, I do not want to end up teaching (I hope not). I have already worked in web design firms in a technical capacity and worked on a lot of web sites (construction, not design, but good sites none the less). What school is in touch with reality? I had heard good things about SVA. Parsons - my impression is that it is full of youngsters who think they are the next celebrity designer. I am 32 years old, married, and a no nonsense person. Things like campus life don't worry me in the least, I am only concerned about a quality education.<br>
    Also, Parsons has a 2 year degree (AAS) that they say is geared towards career changers, but they could not put me in touch with any teachers. Does the AAS count? I am not too keen on another 4 year degree but don't think I have what it takes to get into a grad program, those sound too advanced frankly. Should I try the associates route, try to find a job and then see. Frankly 4 years in school seems risky and a tad out of touch with what could be the outcome of that education.<br>
    Any help and advice would be greatly appreciated. How about MICA and RISD? Are those too academic? Thanks again..</p>
