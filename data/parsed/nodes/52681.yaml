    <p>Hi everybody,<br>
    I'm working on  logo for an online community of mothers, which will be used as a marketing research tool. It is called "A Fish in the Water", which suggests that the people will feel comfortable there. I like the idea, you get the fish n the water, sense of being part of something—community. Only problem is that I'm not sure if I've seen a similar idea somewhere, I don't think so, but you probably know the feeling, you've seen so many logos, that you're not sure if this image wasn't just stuck somewhere at the back of your brain. The only similar identity i recall is one for Tackle Design by Fredrik Lewander, but it is different enough. Thanks. Jan</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fish_4068.jpg"></div><p></p>
