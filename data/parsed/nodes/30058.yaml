  html: |-
    <p>After searching for two hours without success, I'll ask it here, maybe someone knows:</p>
    <p>I'd like to create ordinal letters (for example for "1st" "2nd" ...).<br>
    Are there official unicode values where I can place them?</p>
    <p>I found some, like "m" "n" etc. but I'm still missing "s" (and some others), and they are not contineous but spread all over the ranges...</p>
    <p>So I'm neither sure whether the ones I found are intended to be used for that purpose, nor I know where to place the others I haven't found yet.</p>
    <p>Thanks for your help (again and again...)<br>
    Sebastian</p>
