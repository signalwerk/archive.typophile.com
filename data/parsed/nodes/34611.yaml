      <p>Actually, I did drop the top bar, but then I shrunk the serifs, because I felt that they were too angular, and that bringing them in would soften the effect of the T on the overall design. I like the idea of tweaking the leaf a bit ... I think it could stand to be a bit more eye-catching. But I like the natural eye-swoop from the T to the "th," and the leaf isn't at present competing with that. I wonder if there's a way to maintain that shape without affecting the eye movement too much.</p>
      <p>(And don't worry, I actually don't feel compelled to implement every suggestion given. I just like your suggestions. Every lil' bit helps, says I.)</p>
