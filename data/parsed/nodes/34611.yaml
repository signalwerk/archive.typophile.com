    html: |-
      <p>How likely? I'd say 1 in a million... But there's still a chance. :D</p>
      <p>About the capital letter T. It's lower for sure but I guess you've scaled the complete letter not just lower the top bar and making it a bit narrower. Also with smaller size I should be SLIGHTLY more away from "o". But with lowering instead of scaling  the larger bottom serif would probably do the trick.</p>
      <p>But. Consider another alternative. Keep the big (normal) letter "T" and make the leaf stand out a bit. Some with size, some with angle... To reach higher up. To emphasize it.</p>
      <p>But if others would think that the lower "T" works fine I'm satisfied with it. It doesn't look bad to me at all. It actually looks better as I thought it would to my eyes.</p>
      <p>BUT. Remember it's going to be you in the end who will decide what is ok and what's not. Don't design as we say. We only gove alternatives and look for flaws that you may not see since you design it.</p>
