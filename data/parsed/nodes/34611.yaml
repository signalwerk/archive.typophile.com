    <p>The following is a logo for a blog/forum/chat/customer-connector found at the website of an educational publishing company. The tagline is "teaching | learning | growing | TOGETHER." The desire for an organic community led to this connected and bracketed Minion Pro (our corporate font).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/together_6713.jpg"></div><p></p>
    <p>Does it work at all? Does one weight work better than another? Have I made any egregious errors? I welcome all thoughts, broad and nitpicky.</p>
    <p>PS - It will be seen first in the context of our new front page, <a href="http://www.lampstandpress.com/xindex.htm" title="www.lampstandpress.com/xindex.htm">www.lampstandpress.com/xindex.htm</a>, in the place of "LampstandLive."</p>
