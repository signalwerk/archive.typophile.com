      <p>I like the lower case better because only the "g" gets emphasized with the leaf. With the capital T you get differently weighted logo. If your boss insists on the capital letter I'd lower the cap height. Looks like it can go lower. Half the space between T's serif and "o".</p>
      <p>I like the connection between "g" and "e" much better. A bit more curvature would probably do the trick even better. The bottom part of it still makes it look a bit too straight. But if your tests turn out this one is the best I'm satsified with this one too.</p>
      <p>Did you also change the connection between the "e" and "t"? Because it does look smaller and it comes at a bigger angle on the "t". I think something in between would be best. The first one has much darker "t", the second one too light.</p>
