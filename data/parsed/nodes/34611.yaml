      <p>I find some of these ligatures too contrived and the leaf too obvious a response to organic. A simpler answer could be to use a single ligature, for example, you could create a th ligature using the loop style of an st ct ligature I feel this could work for your navigation bar too, possibly altered to increase the weight. In an uppercase version the ligature could be the OG although that may set THE BOOKSHeLF apart as the only sans and heaviest.</p>
      <p>Tim</p>
