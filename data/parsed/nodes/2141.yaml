  html: <p>Did we mention you still get 3 shirts? <br>------------------------------------------------- <br>Just when you thought you had the contest in the bag, the stakes have been raised! Los Angeles-based hyperfoundry Apollo 26 (<a href="http://www.apollo26.com" target="_top">http://www.apollo26.com</a>) has put up $250 in prize money for the winner of the Typophile Tee contest. <br> <br>Only two weeks remain to submit your entry or revise a design you've already submitted to the contest. All tee submissions must be received by midnight PST on Friday, August 30th to qualify. Download the EPS template at <a href="http://www.typophile.com/downloads/" target="_top">http://www.typophile.com/downloads/</a>.  <br> <br>We've received tees from designers and design studios across the globe and we're as excited as you are to see which entry wins. Thanks to everyone for your support and publicity, and to our judges from House, HTF, T-26, Font Bureau and Letterror for donating their time to help us select the winner. <br> <br>Entries are posted daily at the Typophile Forums. <a href="http://www.typophile.com/forums/" target="_top">http://www.typophile.com/forums/</a> <br> <br>Best, <br> <br>Jared &amp; Joe <br>Typophile</p>
  html_clean: <p>Did we mention you still get 3 shirts? <br>------------------------------------------------- <br>Just when you thought you had the contest in the bag, the stakes have been raised! Los Angeles-based hyperfoundry Apollo 26 (<a href="http://www.apollo26.com" target="_top" class="link-external">http://www.apollo26.com</a>) has put up $250 in prize money for the winner of the Typophile Tee contest. <br> <br>Only two weeks remain to submit your entry or revise a design you've already submitted to the contest. All tee submissions must be received by midnight PST on Friday, August 30th to qualify. Download the EPS template at <a href="http://www.typophile.com/downloads/" target="_top" class="link-lost">http://www.typophile.com/downloads/</a>.  <br> <br>We've received tees from designers and design studios across the globe and we're as excited as you are to see which entry wins. Thanks to everyone for your support and publicity, and to our judges from House, HTF, T-26, Font Bureau and Letterror for donating their time to help us select the winner. <br> <br>Entries are posted daily at the Typophile Forums. <a href="http://www.typophile.com/forums/" target="_top" class="link-lost">http://www.typophile.com/forums/</a> <br> <br>Best, <br> <br>Jared &amp; Joe <br>Typophile</p>
