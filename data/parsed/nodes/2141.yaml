    html: <p>Only ten days left to get your entries in and lay <br>claim to $250 US dollars and an all expenses <br>paid trip to worldwide fame. You'll be traveling <br>in style with three shirts of your very own design. <br>(Pants not included.) <br> <br>Download the kit <a href="http://typophile.com/downloads/tshirt_kit.zip" target="_top">here</a>. And email your  <br>submissions to tee@typophile.com.</p>
