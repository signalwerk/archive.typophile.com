    <p>Hi all,</p>
    <p>I’m trying to make the move form drawing glyphs in Illustrator to Fontlab, but I’m having problems doing things in Foontlab that I would do in Illustrator. I’m drawing the Oslash glyph I wanted to be able to center the slash on top of the O and then rotate it to make the glyph, is it possible to center the slash down the middle of the “O”. I know I can center the glyph in the window, but is it possible the align a shape to that glyph.</p>
    <p>Hope this make sense I someone can help.</p>
