    html: |-
      <p>I did not know minion was designed to be myriad's pair. Makes sense though. The subject matter is information for brochures of various topics (things like 'quit smoking', 'pre-natal care', 'payment arrangements' etc.)for a hospital. The problem is that the hospital does not have an in-house design dept. so everything is outsourced. The result is that all the brochures look like they come from different entities and not from the hospital itself. I've been exploring ways of unifying the design and, for starters, want to standardize the typography. I was thinking about something sturdy, timeless and friendly. Myriad came to mind but was wondering about a companion text.</p>
      <p>IM</p>
    html_clean: |-
