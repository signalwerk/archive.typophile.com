    html: "<p>Correction: Minion was designed in 1989, Myriad in 1991. Minion was designed for book work. Myriad was essentially designed to showcase Multiple master technology. Myriad wasn't intended specifically to match with Minion. However, both have been bundled with Adobe apps for a long time, and almost everyone has a version of both.</p>"
