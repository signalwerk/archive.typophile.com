      <p>I'm currently pairing Chapparal with Myriad on a brochure. Working out well. In general, I find that an unmodulated sans like Myriad is comfortable dancing with more spartan serifs (unbracketed for example - whitman, chapparal, scala etc). The nice part about chapparal are the weights and typographic goodies.</p>
      <p>R</p>
