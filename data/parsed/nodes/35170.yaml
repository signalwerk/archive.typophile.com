      <p>Wow I also thought freight text (which I will be purchasing soon for myself) but It requires careful consideration when used. It would be a bit too much for those who are not familiar with type setting in general . Fresco and Charter are both excellent choices and I'm sure it would be much easier to use for the non-typographer. MVB Verdigirs is a beauty but a little "too sharp" for me. I think I'll go with Charter. Thanks soo much Mr. Coles</p>
