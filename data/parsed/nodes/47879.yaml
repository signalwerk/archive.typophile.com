      <p>I think these are designed for embroidery machines and not computers. Harold Lohner has about the best collection of Monogram fonts I know and his <a class="freelinking external" href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-VIMO" rel="nofollow">Vine Monograms</a> are as close to your sample as i can recall.</p>
      <p>- Mike Yanega</p>
