    html: <p>The last time I did a corporate ID guide it took a year for the research and another 6 months to write. The project was well over $200,000 for a small regional thrift bank. Its a major project and not something you can do as a cookie cutter approach. Each industry has different needs and different uses. Good luck with you project.</p>
