  html: |-
    <p>Hello typophilers </p>
    <p>I work on a corporate identity and have to make the guide.<br>
    Since it has to be in english and this is not my mother tongue,<br>
    I need to have some samples. I did a little research,<br>
    but I am not satisfied. Also I realized that there is no<br>
    standar terminology. For example I found those 3 descriptions:<br>
    logo=symbol+signature, Mark=symbol+namestyle and mark=symbol+logotype. </p>
    <p>So if anyone has some good examples please do let me know.</p>
