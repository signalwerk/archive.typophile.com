    <p>My employer has a site license for the Bitstream Type Odyssey Mac CD, and I wanted to compare some of the fonts to the Adobe/ITC/Linotype/MT versions I am more familiar with, since the numerical names from Bitstream aren't always that helpful... I found some matches from a forum search, others from myfonts, and yet others from google, and thought someone else might find such a list useful. Some of the Bitstream fonts below appear to be clones of the more familiar versions; others are only loosely based on the matched font. The usual accuracy disclaimer applies, I may have made some search mistakes, YMMV, etc....</p>
    <p>Aldine 401 = Bembo<br>
    Aldine 430 = Stempel Garamond<br>
    Aldine 721 = News Plantin<br>
    Drescher Grotesk = Avenir<br>
    Dutch 766 = Adobe Caslon<br>
    Dutch 801 = Times New Roman<br>
    Dutch 809 = Concorde<br>
    Dutch 811 = Olympian<br>
    Dutch 823 = Aster<br>
    Engravers Gothic = Copperplate<br>
    Engravers Old Style = Cochin<br>
    Garamond (American) = Garamond #3<br>
    Garamond (Classical) = Sabon<br>
    Garamond (Elegant) = Granjon<br>
    Garamond (Italian) = Simoncini Garamond<br>
    Garamond (Original) = Stempel Garamond<br>
    Geometric 231 = Kabel<br>
    Geometric 415 = Metro<br>
    Geometric 706 = Neuzeit Grotesk<br>
    Geometric Slab Serif 703 = Memphis<br>
    Geometric Slab Serif 712 = Rockwell<br>
    Gothic 720 = MT Grotesque<br>
    Gothic 725 = Akzidenz Grotesk<br>
    Humanist 521 = Gill Sans<br>
    Humanist 531 = Syntax<br>
    Humanist 777 = Frutiger<br>
    Humanist Slab Serif 712 = Egyptienne<br>
    Incised 901 = Antique Olive<br>
    Kis = Janson Text<br>
    Lapidary 333 = Perpetua<br>
    Latin 725 = Meridien<br>
    Modern No. 20 = Scotch Roman<br>
    News 701 = Clarendon<br>
    News 702 = Excelsior<br>
    News 705 = Corona<br>
    News 706 = Aurora<br>
    Revival 555 = Horley Old Style<br>
    Revival 565 = Berling<br>
    Square 721 = Eurostile<br>
    Swiss 721 = Helvetica<br>
    Transitional 511 = New Caledonia<br>
    Transitional 521 = Electra<br>
    Transitional 551 = Fairfield<br>
    Venetian 301 = Centaur<br>
    Zapf Elliptical 711 = Melior<br>
    Zapf Humanist 601 = Optima<br>
    Zapf Calligraphic 801 = Palatino<br>
    Zurich = Univers</p>
