    html: "<p>I'm on a Mac, but the general setup is similar: the bundled fonts are automatically installed in an Adobe folder; to use them in other applications, I believe that moving the font files to the folder where you usually have active fonts installed would do the trick. They would still be accessible to the Adobe apps.</p>"
