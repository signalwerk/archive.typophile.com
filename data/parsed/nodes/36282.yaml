  html: |-
    <p>Can anyone help?</p>
    <p>I'm using CS2 on both Windows 2000 and Windows XP.</p>
    <p>The fonts bundled with Adobe apps are installed into \Program Files\Common Files\Adobe\Fonts rather than \WINNT\Fonts. This appears to make them available only to Adobe apps (and not MS Office or Quark).</p>
    <p>I can work around this by copying shortcuts to the required fonts into \WINNT\Fonts, but given I can only seem to find oblique references to this, I'm starting to wonder whether this is a bug or intended operation. Any advice?</p>
