      <p>&gt; <em>but I wonder if there are licence considerations?</em></p>
      <p>It's OK to move the fonts to another folder and use them with non-Adobe apps (assuming that you have a legit CS2 license to start with). BTW, starting from CS3 the fonts are installed in a system-level fonts' folder.</p>
