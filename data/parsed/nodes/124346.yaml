    html: |-
      <p>A logo from the pre-digital era. AFAIK it has not been made into a digital font.<br>
      As for something similar, I looked for fonts with about the same degree of squareness and width of vertical and horizontal stokes. Found very little, but consider FF District Medium <img src="/sites/default/files/old-images/FFDistrictMedAsFuji_3515.gif"><a href="https://www.myfonts.com/fonts/fontfont/district/">https://www.myfonts.com/fonts/fontfont/district/</a> as a very distant relative. A mirrored _J_ could resemble _L_ and if the new _L_ was flipped vertically it could be the basis for the _F_. A clipped _U_ could become a _J_.<br>
      Don</p>
