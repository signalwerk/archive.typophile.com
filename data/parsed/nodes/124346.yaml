      <p>Reminds me a lot of <a href="http://www.myfonts.com/search/univers" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Univers</a> and <a href="http://www.myfonts.com/fonts/linotype/univers-lt" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Linotype Univers</a>. Something like Univers Black should give you a good base for customization.<br>
      Talking about 'Univers', try maybe having a look to <a href="http://www.moorstation.org/typoasis/designers/casady_greene/j_p.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Kasse</a> FLF (Kasse Ultra looks promising), a digital version of <a href="http://typophile.com/node/69556" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Modula</a>, an old film font close to Univers but a bit more contrasted.<br>
      Quick comparaison, top logo/bottom scaled Kasse Ultra<br><img src="/sites/default/files/old-images/Untitled-1_5463.jpg"></p>
      <p>Another option to consider is <a href="http://www.myfonts.com/search/serpentine" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Serpentine</a>/(<a href="http://www.myfonts.com/fonts/imageclub/serpentine-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Serpentine Sans</a> with more work on /J though.</p>
