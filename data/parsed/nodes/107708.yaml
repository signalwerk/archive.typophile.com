    html: |-
      <p>@donshottype:<br><cite>Or they could re-introduce the Fraktur k -- which looks upside down.</cite></p>
      <p>It took a quick search to determine which Fraktur k you were referring to. Some typefaces, billed as Fraktur, use a k that looks ordinary; most of the ones I saw had the top part of the K-like portion of the k looped as in handwriting.</p>
      <p>But more authentic Fraktur typefaces showed up on Luc Devroye's web site.</p>
      <p>Start with a lowercase t. But instead of the letter coming to a point at the top, put serifs there similar to those at the top of the lowercase l.</p>
      <p>And then the crossbar: instead of having a curve from the left end of the crossbar going up to the top of the letter, filled in with black, have an upward-sloping curved line that sweeps upward, crosses the vertical of the t, and then sweeps downward.</p>
      <p>The shape is, of course, unfamiliar and unrecognizable to readers used to the Roman alphabet. My initial impression was of an r standing on top of a t. But at least it has historical roots, and can be adapted to Roman style faces.</p>
      <p>Here's an image of t, l, and k in one authentic Fraktur face:</p>
      <p><img src="/sites/default/files/old-images/kver_4290.jpg"></p>
      <p>however, in this one, the sloping line, instead of just curling down, becomes a loop; still, most of my description is illustrated.</p>
