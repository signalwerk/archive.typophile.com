    html: |-
      <p>I presume that by a "hippie license" he means licenses like the GPL. The restriction in the GPL, though, is not intended to be dog in the mangerish, or anti-capitalist (despite Richard Stallman occasionally engaging in rhetoric of a sort as to give rise to Hrant's comment).</p>
      <p>Instead, it's so that one can't make a slight, obvious improvement to a GPL program, copyright the result, and thereby hobble the free version of that program by preventing it from implementing the same improvement.</p>
      <p>As for Clear Sans, given that its intended purpose is to be a typeface for <em>user interfaces</em>, it had better be conservative, because who would want to work all day on a computer screen where everything is written in an idiosyncratic typeface?</p>
