      <p>&gt; reduce ambiguity under reflection, so that it would be useful for dyslexics?</p>
      <p>Popular belief notwithstanding, I have seen no evidence that this is an actual problem for dyslexics in reading (as opposed to in writing). Indeed, the failure of typefaces, designed with this notion in mind, to perform any better for dyslexics than common off-the shelf typefaces, would seem to be reasonably good evidence to the contrary.</p>
