    html: <p>FontForge is open source (which technically isn’t freeware - it’s better). You can get it at <a href="https://web.archive.org/web/20080830000219/http://fontforge.sf.net/">fontforge.sf.net</a>. Some in this forum don’t like it, but it has improved a lot recently, and is always improving. I’ve never really used anything else (besides a brief and not particularly fruitful encounter with Font Creator, which isn’t free), but I like FontForge a lot.</p>
