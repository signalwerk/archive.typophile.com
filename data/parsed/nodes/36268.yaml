    html: <p>I am an aspiring software, and after trying to get by with less able Font Software for a while, I’ve decided to move to Fontlab. Fontlab really gives a designer just about everything he needs to draw and output a great font, with lesser tools I was spending a lot of time jumping into Illustrator to try and get things done. Fontographer has most of the great drawing tools, but it also has a lot of nasty old bugs that won’t be fixed until Fontlab has managed to finished Fontographer 5, so I end up going to Fontlab just to stay away from those issues.</p>
