    <p>Hello,</p>
    <p>Ive been spending the past few weeks peeking in on the forums here and have to say I am very impressed by all of you and your knowledge. </p>
    <p>I have just saw a few clips on Youtube for the Helvetica documentary and I loved many points that were made in the interviews. The one that stuck with me most was, the choice not to choose (other faces). They chose Helvetica. I thought that was very smart and started me thinking about my own situation. I am an Art Director in London for a major client. Most of my work is done online but if I sell well I sometimes get to push the above line stuff. What I have been thinking about doing for a long time now is, to design a font for my client that would hopefully become synonymous with its brand. The brand is worked on by many designers globally I would like to take away the choice like the designers in the Helvetica documentary. I hope this doesnt make me sound like the asshole I think it does ;)</p>
    <p>My question to everyone here is... where do I begin? I havent designed a fontface since art school in Toronto 12 yrs ago and that was on paper. Is there standard software for this? Is there any popular freeware I could begin with?</p>
