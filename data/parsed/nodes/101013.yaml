  html: |-
    <p>Are there any regulations which recommend what kind of space (Unicode symbol) is used for space between words and what kind of space should be used after the dot in abbreviations such as Ph. D.</p>
    <p>I have only recently found out that French typographic rules demand a four-per-em space, and not your usual one, after « and before ».</p>
    <p>So I was wondering whether any such advice exists for interword space.</p>
