    html: '<p>In the case of an abbreviation such as Ph.D., the answer to the question of what kind of space to put after the period inside the abbreviation is usually "none", at least in the United States. In most editorial styles, for such abbreviations the periods are closed up or else omitted: "Ph.D." or "PhD", with the latter being the more common nowadays.</p>'
