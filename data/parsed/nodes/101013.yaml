    html: |-
      <p>There are *conventions* -- not regulations. They also change over time, and with general style.</p>
      <p>For example, the four-to-em space you mention with guillemots in French wouldn't be right if someone were setting ragged right and was using a font where four-to-em was a normal word space. Remember, you get a 4-to-em space with a spaceband value of 250 units (with a 1000 unit em). </p>
      <p>Most newer fonts use a smaller nominal value than 250 units for the spaceband -- I've seen 190 units a fair bit, and that's smaller than a 5-to-em. If you use a hard 4-to-em between the guillemots and a word, the resulting space would be larger than the nominal word space when set with many fonts.</p>
      <p>As to periods after initials -- it is a matter of style. Chicago style is to us a word space with initials, as in</p>
      <p>G. E. M. Anscombe</p>
      <p>Associated Press style is to not use any extra space</p>
      <p>G.E.M. Anscombe</p>
      <p>Etc. in other constructions.</p>
      <p>So -- you get a lot of theories from typographers, but rarely the assumptions they are based on -- e.g., how big is a wordspace. Moreover, in the largest portion of the world of words, editorial style is the determining factor. Typographer's opinions are often marked "P.E."</p>
