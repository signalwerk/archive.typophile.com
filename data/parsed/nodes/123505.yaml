    </p><div class="imageWrap"><img src="http://typophile.com/files/Ninokuni_font12_latin_only_big_3625.png"></div><p></p>
    <p>Hi experts,</p>
    <p>The Japanese Ninokuni for Nintendo DS use some NDS fonts.<br>
    In one of these japanese fonts, the 12 pixels one, i have found some latin chars, that the game doesn't use.</p>
    <p>The 'b', 'd', 'f' or 'l' look like a serif curved font, but the capital ones don't.<br>
    Does Nintendo buy/convert a well known ttf font for the game ?<br>
    I want to find closest fonts for a website.</p>
    <p>thanks in advance.</p>
