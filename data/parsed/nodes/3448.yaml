  html: "<p>F O R   I M E D I A T E   R E L E A S E <br> <br>Typeco has releases it's first font family -- Glyphic Neue. <br> <br>Glyphic Neue is a display family that was inspired by the Op Art style of <br>lettering in the United States that ran rampant in many photo type houses in <br>the 1960's and 1970's. The Glyphic Series from the Franklin Photolettering <br>group was an influence and spring board for this  family of fonts, hence <br>it's name.  <br> <br>But Glyphic Neue departs from its unicase Franklin influence in several <br>ways. Firstly the designer created both upper and lower case forms. The <br>lowercase has been designed with barley protruding ascenders and descenders <br>and with an x-height equivalent to the cap height, so that upper and lower <br>can be exchanged indiscriminately for a quirky effect. Some of the letters <br>take a cue from the original Glyphic series but many have been redesigned <br>entirely to fit the designers vision. The italic forms differ enough from <br>the upright version making it almost an entirely different display alphabet. <br> <br>Glyphic Neue is a versatile display family of 6 fonts -- 3 widths, each with <br>an accompanying italic that look equally at home when used on a party flier <br>or a sports team visual identity. <br> <br>Typeco is an electronic type foundry for the designs of principal, James <br>Grieshaber, as well as a provider of typographic services and solutions. <br>Services offered by Typeco include font identification, signature fonts, <br>logo fonts and handwriting fonts. Solutions include custom designed <br>typefaces, logos and trademarks, branding and graphic design. <br> <br>James Grieshaber has been active in the typographic community for several <br>years now. Grieshaber most recently was on staff of P22 Type Foundry and <br>helped establish International House of Fonts. He has been honored with an <br>award of Excellence in Type Design from Association Typographique <br>International (ATypI) for his Gothic Gothic type design. He has now struck <br>out on his own to offer his services to those in typographic need and <br>showcase his typographic vision. <br> <br>Contact info: <br>Typeco <br>PO Box 10661 <br>Rochester, NY 14610 <br>Phone: 585.230.1674 <br>Email: <a href=\"mailto:contact@typeco.com\">contact@typeco.com</a> <br>Web: <a href=\"http://www.typeco.com\" target=\"_top\">http://www.typeco.com</a></p>"
