    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pope_cover_5773.jpg"></div><p></p>
    <p>TYPOPASSAGE VIENNA<br>
    Design Micro Museum With and About Lettering<br>
    MuseumsQuarter Vienna / Gangway between square 1 and square 2</p>
    <p>presents: </p>
    <p>WELCOMETO.AS (Lausanne / Davis, California)</p>
    <p>Opening reception: November 26, 2010 // 6 p.m.<br>
    Ongoing until March 2011</p>
    <p>The TYPOPASSAGE Vienna is a unique, innovative museum project, curated by design studio bauer – konzept &amp; gestaltung.<br>
    This freely accessible exhibition series presents experimental type designs by young and well-established graphic artists. This Design Micro Museum With and About Lettering shows typographic design spanning from the initial concept to the final font on an annual basis of three different exhibitions by international designers. Five cabinets installed in a passage of Vienna's MuseumsQuarter display the contemporary works. An accompanying exhibition catalog can be purchased for € 2,- on site and round-the-clock. Location and contents address the designer community, as well as those interested in exploring design, those who want to understand the design process and gain an in-depth yet uncomplicated perspective on exciting design<br>
    personages.</p>
    <p>The third exhibition  presents the Czech-Swiss collective WELCOMETO.AS. In their joint projects, the two designers Adam Machacek and Sébastien Bohner connect influences from the Netherlands, the UK, Switzerland and the USA, where Adam is currently working. Their manifold, often exuberant baroque works combine experimental typography, illustration and photography. These distinctive, vibrant designs turn out to be exhibition catalogues on rock music and its influence onto the visual culture of the 1960s, or a city map looking like a tube map. Welcometo.as were responsible for the visual identity of the Biennial of Graphic Design, Brno 2010.</p>
    <p><a href="http://www.typopassage.at" title="www.typopassage.at">www.typopassage.at</a><br>
    <a href="http://www.erwinbauer.com" title="www.erwinbauer.com">www.erwinbauer.com</a></p>
