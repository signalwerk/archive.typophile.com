    html: |-
      <p>The "g" on the left isn't bad for an open-bottom form (which is hard to get right since there's less of a precedent so people don't just accept it unthinkingly*) but it's too playful here - you need to figure out how to tame it (maybe make it more rigid/rectilinear). As for your second "g", the advantage of the Koch-style form is its ability to accommodate a short descender (while avoiding a "g" that looks way too small**) but that's not the case here, so... A way you can still use it though is making such a "g" look larger - by making the head larger (although that might clash with the overall character of the font). And in any case you should consider removing the spiky part in the middle. Look at Ernestine's "g" for a very successful Koch-style "g":<br>
      <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a></p>
      <p>* To me the closed form is actually inferior.</p>
      <p>** Any binocular "g" <em>must</em> look at least slightly small, otherwise bigger things go wrong.</p>
      <p>hhp</p>
