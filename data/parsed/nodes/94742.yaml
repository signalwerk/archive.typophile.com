    html: |-
      <p>I like the relationship between the small x-height and the narrow caps (but some aren't narrow enough). This could possibly become more than a learning exercise.</p>
      <p>Many of your curves are wobbly - look at the "e", and the top counter of the "R".</p>
      <p>Some things:<br>
      - The "Q", "g" and "s" are out of character. For the "g" you might try a Koch form.<br>
      - Bottom of the "s" is too thick.<br>
      - I actually like the "t" being tall (especially in this modest-x-height design).<br>
      - The "x" and "z" are top-heavy.<br>
      - The little notch in the "y" is too tentative - dump it or grow it.</p>
      <p>Last but certainly not least: spacing is a bit tight (and uneven).</p>
      <p>hhp</p>
