      <p>Thanks everyone for the comments. I'm reworking the spacing* and fixing the curves on the glyphs at the moment. Things like the top heavy z was something I didn't see, but now you've mentioned it I see how it makes the character look top heavy with the equal widths.</p>
      <p>I'll look at the other 'problem' characters as well; I find the 's' one of the trickiest to do. In terms of the Q, what other characters do you look at to make an equivalence in the tail? </p>
      <p>I'm do like the Koch form 'g', so it should be fun to try that out. I didn't go with the "standard" single-storey 'g' because something about it bothers me, I can't explain exactly but it can occasionally trip me up when reading something with it sometimes, usually in roman sans-serifs. Strangely, it doesn't bother me half as much when it's in a blackletter style typeface; I don't know if this is due to personal bias, something quirky with my eyes/brain or something else.</p>
      <p>*I think sometime I must have shaved off as many as 10 units from each side of all glyphs as an earlier version was much looser (probably too loose but I went too far the other way).</p>
