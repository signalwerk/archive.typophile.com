    html: |-
      <p>Jason: ‘<em>The "family name" can't be more than 27 characters, and can't include hyphens.</em>’</p>
      <p>Although the problem on the Mac could well be caused by the naming of the font, I don’t think the <em>Font Family</em> name has anything to do with this.</p>
      <p>Assuming that we’re talking here about OpenType fonts, according to the specs there seems to be no limitation to the number of characters in the <em>Font Family</em> name, nor that the use of a hyphen is not allowed. The ‘27 characters’ seem to refer to the specs of the PostScript Type1 format. As one can read in Adobe’s <em>Font Naming Issues</em>, Technical Note #5088, 12 April 1993: ‘<em>The FontName generally consists of a family name (speciﬁcally, the one used for FamilyName), followed by a hyphen and style attributes in the same order as in the FullName. For compatibility with the earliest versions of PostScript interpreters and with the ﬁle systems in some operating systems, Adobe limits the number of characters in the FontName to 29 characters.</em>’</p>
      <p>Macintosh Font Menu Names were also restricted: ‘<em>The standard names used in Macintosh font menus come from the name of the FOND resource associated with a Type 1 outline font. FOND resource names are limited to 31 characters, and may contain spaces. Because of a bug in a major software application which limits font menu names to 30 characters, Adobe recommends staying within this lower limit. In addition, System 7 for the Macintosh requires names to be unique for the ﬁrst 28 characters.</em>’ I have to check MS Ofﬁce 2011 for Mac on one of our test systems, but AFAIK MS Word for Mac always required a <em>Full font name</em> of maximum 30 characters. </p>
      <p>So, probably you can easily solve this problem by using the <em>Compatible Full Name</em> (Name ID 18) for the Mac: ‘<em>Compatible Full (Macintosh only); On the Macintosh, the menu name is constructed using the FOND resource. This usually matches the Full Name. If you want the name of the font to appear differently than the Full Name, you can insert the Compatible Full Name in ID 18.</em>’ With 27 characters one is sure to stay on the safe side.</p>
      <p>I think what makes matters a bit more complex here is the <a href="http://forum.fontlab.com/index.php?topic=313.0 article" rel="nofollow">Topic: Font Family Naming in FontLab Studio 5 </a> article, which mentions limitations which are obviously related to the way FontLab Studio handles font naming internally. Jason is referring to this, I reckon.</p>
      <p>FEB</p>
