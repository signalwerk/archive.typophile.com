      <p>Last year there was a brief discussion on the OpenType list regarding the buggy way MS Word 2011 for Mac handles font names. After Adam stated ‘<em>The way Word retrieves naming info is a mystery to me […]</em>’, Read Roberts replied on Monday 16 July:</p>
      <p>‘<em>This is a known bug on Mac MS Word 2011. It is not in previous versions. We saw the problems in Adobe fonts, and looked into it in Dec 2011. A font family will not appear In the hierarchical font menu for a given font file if there is no font file in the family for which the Cocoa API returns a base font.&nbsp; In order to see the problem behavior, I needed to install several fonts from the same family: the API seems to have trouble in the fairly specific case of&nbsp; multiple style groups in a set of fonts linked by having the same Mac name ID 16 (preferred name), and where some of the style groups do not have a Regular face.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;We saw this when we rebuilt the Adobe Type Library to build Mac menu names name ID1,2,16 and 17) the same way as Windows name ID is built. (Incidentally, we made this change partly to be in accordance with the OT spec, and partly because the way we originally built the Mac menu names was due to a compromise to make OTF work in Mac OSX in 2000. Discussion with Apple engineers last year informed us that a) this is no longer necessary and b) parts of the Apple font handling logic no longer expect more than four faces with the same name ID 1).)<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;We are not re-building our font library as we do expect that this bug will be fixed in some future release of MS Word for the Mac. </em></p>
      <p>Especially style-linking can cause problems and requires the usage of Name ID 16 and 17. Read gave a nice example on the OpenType list on 1 December 2010: </p>
      <p>‘<em>An additional note about building name ID 4: when Adobe builds name ID 4 for new fonts, we use the name id 16 and 17 when available, rather than only name ID 1 and 2.&nbsp; This avoids name ID 4 conflicts within a large family, where name ID 1 + name ID 2 for one face might be the same as name ID 1 for<br>
      another. Example:</em></p>
      <p><em>AGarmondPro-SemiBold: is the bold face of AGarmondPro-Regular<br>
      &nbsp; &nbsp;name ID 1 = "Adobe Garamond"<br>
      &nbsp; &nbsp;name ID 2 = "Bold"<br>
      &nbsp; &nbsp;name ID 4 by OT spec v1.5 and earlier&nbsp; = "Adobe Garamond Bold"</em></p>
      <p><em>AGarmondPro-Bold: is the regular style face within the style linked group&nbsp; (<br>
      AGarmondPro-Bold and " AGarmondPro-BoldItalic").<br>
      &nbsp; &nbsp;name ID 1 = "Adobe Garamond Bold"<br>
      &nbsp; &nbsp;name ID 2 = "Regular"<br>
      &nbsp; &nbsp;name ID 4 by OT spec v1.5 and earlier&nbsp; = "Adobe Garamond Bold"</em>’</p>
      <p>At DTL we have never used Name ID 16 and 17 for the Mac so far (despite Read’s remark that ‘<em>[…] parts of the Apple font handling logic no longer expect more than four faces with the same name ID 1 […]</em>’). We use any style name for the Font Subfamily name and we use Name ID 16 and 17 for Windows to duplicate this. By keeping the length of Name ID 18 at a maximum of 31 characters, our fonts seem to function well under MS Word 2011 for Mac (I just  gave this an extra check):</p>
      <p>TTName 0 1 0 0 "Copyright (c) Dutch Type Library, 1994-2012. All rights reserved."; #Macintosh<br>
      TTName 0 3 1 0x409 "Copyright (c) Dutch Type Library, 1994-2012. All rights reserved."; #Windows<br>
      TTName 1 1 0 0 "DTL Fleischmann DOT"; #Macintosh<br>
      TTName 1 3 1 0x409 "DTL Fleischmann DOT Medium"; #Windows<br>
      TTName 2 1 0 0 "Medium Italic"; #Macintosh<br>
      TTName 2 3 1 0x409 "Italic"; #Windows<br>
      TTName 4 1 0 0 "DTL Fleischmann DOT Medium Italic"; #Macintosh<br>
      TTName 4 3 1 0x409 "DTLFleischmannDOT-MediumItalic"; #Windows<br>
      TTName 6 1 0 0 "DTLFleischmannDOT-MediumItalic"; #Macintosh<br>
      TTName 6 3 1 0x409 "DTLFleischmannDOT-MediumItalic"; #Windows<br>
      TTName 7 1 0 0 "DTL Fleischmann is a trademark of the Dutch Type Library."; #Macintosh<br>
      TTName 7 3 1 0x409 "DTL Fleischmann is a trademark of the Dutch Type Library."; #Windows<br>
      TTName 8 1 0 0 "Dutch Type Library"; #Macintosh<br>
      TTName 8 3 1 0x409 "Dutch Type Library"; #Windows<br>
      TTName 9 1 0 0 "Johann Michael Fleischmann, Erhard Kaiser"; #Macintosh<br>
      TTName 9 3 1 0x409 "Johann Michael Fleischmann, Erhard Kaiser"; #Windows<br>
      TTName 10 1 0 0 "retail edition"; #Macintosh<br>
      TTName 10 3 1 0x409 "retail edition"; #Windows<br>
      TTName 11 1 0 0 "http://www.dutchtypelibrary.com"; #Macintosh<br>
      TTName 11 3 1 0x409 "http://www.dutchtypelibrary.com"; #Windows<br>
      TTName 13 1 0 0 "By downloading, unpacking […]"; #Macintosh<br>
      TTName 13 3 1 0x409 "By downloading, unpacking […]"; #Windows<br>
      TTName 14 1 0 0 "http://www.dutchtypelibrary.nl/PDF/Licenses/DTL_FS_License.pdf"; #Macintosh<br>
      TTName 14 3 1 0x409 "http://www.dutchtypelibrary.nl/PDF/Licenses/DTL_FS_License.pdf"; #Windows<br>
      TTName 16 3 1 0x409 "DTL Fleischmann DOT"; #Windows<br>
      TTName 17 3 1 0x409 "Medium Italic"; #Windows<br>
      TTName 18 1 0 0 "DTL Fleischmann DOT Medium Ita"; #Macintosh<br>
      TTName 19 1 0 0 "The quick brown fox jumps over the lazy dog."; #Macintosh<br>
      TTName 19 3 1 0x409 "The quick brown fox jumps over the lazy dog."; #Windows</p>
      <p>In the <em>Font Family Naming in FontLab Studio 5</em> article some rules and restrictions are given for the lengths of names in FLS. As I mentioned earlier, some of these rules and restrictions seem to come forth from the way FLS handles naming internally. For instance, the less-than-30-characters restriction for the PostScript name differs from the ‘no longer than 63 characters’ in the OT spec.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;A way to circumvent these restrictions is using for instance OTM for importing (and exporting, of course) the naming table (CFF-naming entries require manual editing though). This can also be useful when for instance fonts have to be renamed for use on the web. Small changes can be made in a text editor (in batch) then.&nbsp;</p>
      <p>FEB</p>
