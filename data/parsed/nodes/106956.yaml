    <p>I received this message in an email from MyFonts regarding one of my fonts:</p>
    <p><em>The font appears in Pages and OpenOffice, but not Microsoft Word. What is the issue here?</em></p>
    <p><em>I downloaded and tested the font locally on my Mac OS X 10.7.5 system in Word 2011 and TextEdit. In TextEdit, the font appears as available for selection. In Word 2011, the font is not accessible for selection via the drop-down list of fonts, nor from the Font Window.</em></p>
    <p>FWIW, the font's name is Saturday Morning Toast NF-Italic (too many characters?), and it works fine in Word 2010 on Window 7 and Word 2013 on Window 8. Any ideas?</p>
