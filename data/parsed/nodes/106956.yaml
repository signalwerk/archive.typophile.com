    html: |-
      <p>The problem is most likely in the Full name. It must not be longer than 31 characters -- if it's longer, Word 2011 for Mac won't display the font (although the spec actually permits 63 characters there). </p>
      <p>We have incorporated this limitation into TransType 4 and will incorporate it into our new applications.</p>
