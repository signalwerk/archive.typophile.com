    votes: null
    html: "<p>I'm almost sorry  you picked my site to help with that, because I have very little ID material on serif fonts (yet). I looked through \"Modern Encyclopedia of Typefaces\" (Wallis) looking for slab or near slab faces with an E with almost equal arms. I spent some time looking at <a href=\"http://www.myfonts.com/fonts/linotype/demos/medium/testdrive.html?s=KRISTALL-APOTHEKE&amp;p=48\" target=\"_blank\">Demos</a>, <a href=\"http://www.myfonts.com/fonts/ef/swift/ef-regular/testdrive.html?s=KRISTALL-APOTHEKE&amp;p=48\" target=\"_blank\">Swift</a> and <a href=\"http://www.myfonts.com/fonts/linotype/itc-weidemann/medium/testdrive.html?s=KRISTALL-APOTHEKE&amp;p=48\" target=\"_blank\">ITC Weidemann</a>. I can see real mismatches with the last two now, but Demos is possibly a fair substitute.  <br> <br>You didn't say what the age or source of the sample was, and if it's from an old piece of printed media, that would possibly rule out many fonts we would look at. It could even be a typeface that hasn't been digitized. If it is a font, there is always the potential for Tiffany's 'squooshing' to have been used. <br> <br>General plea for ID requesters: Please tell us something about the source of the sample, so we can have as much helpful information as possible.</p>"
    html_clean: "<p>I'm almost sorry  you picked my site to help with that, because I have very little ID material on serif fonts (yet). I looked through \"Modern Encyclopedia of Typefaces\" (Wallis) looking for slab or near slab faces with an E with almost equal arms. I spent some time looking at <a href=\"http://www.myfonts.com/fonts/linotype/demos/medium/testdrive.html?s=KRISTALL-APOTHEKE&amp;p=48\" target=\"_blank\" class=\"link-external\">Demos</a>, <a href=\"http://www.myfonts.com/fonts/ef/swift/ef-regular/testdrive.html?s=KRISTALL-APOTHEKE&amp;p=48\" target=\"_blank\" class=\"link-external\">Swift</a> and <a href=\"http://www.myfonts.com/fonts/linotype/itc-weidemann/medium/testdrive.html?s=KRISTALL-APOTHEKE&amp;p=48\" target=\"_blank\" class=\"link-external\">ITC Weidemann</a>. I can see real mismatches with the last two now, but Demos is possibly a fair substitute.  <br> <br>You didn't say what the age or source of the sample was, and if it's from an old piece of printed media, that would possibly rule out many fonts we would look at. It could even be a typeface that hasn't been digitized. If it is a font, there is always the potential for Tiffany's 'squooshing' to have been used. <br> <br>General plea for ID requesters: Please tell us something about the source of the sample, so we can have as much helpful information as possible.</p>"
