    html: <p>It was a tough one. I looked at it several times over the last  <br>couple of days and there was something naggingly familiar  <br>about it. The slightly lop-sided S was the biggest clue. <br> <br>What's interesting is that Nicolai offered Lucida Bright as a  <br>possibility right away. That was very perceptive. Kris  <br>Holmes was a designer on both New York (the TT  <br>version) and Lucida. You can see her hand in both. </p>
