    <p>Please help!<br>
    I'm designing my business cards for my psychotherapy practice.<br>
    I'm looking for a font that will look good in 8pt to 11pt, in both caps and lowercase.<br>
    I'd like a font that is contemporary but also has a solid and classic feel to it.<br>
    I also need the font to go well with the Pristina font, as one line in my logo uses that font.</p>
    <p>I was going to use Barbedor, but I'm not loving it because the capital "i" resembles the number "1" to my eye, and I don't think Barbedor works well with Pristina.</p>
    <p>Many, many thanks!</p>
