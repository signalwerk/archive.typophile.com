    html: <p>Hey, we get asked that all of the time so I’m pretty good at answering the question. We named the firm Fourfather obviously because phonetically its “forefather”. The meaning of forefather has to do with being a part of a tradition from its origin. We feel we’ve collectively been in the business long enough to make that bold of a statement. The Four replaced Fore because there are 4 of us who started the firm. Plus we do operate mainly on a digital medium and the number in some slight way validates that. Would love to hear more comments on the name/logo/color, anything you guys have to offer would be great. Oh and Nick, thanks for the post. I am very familiar with Pentagram and it does come to mind when looking at the word. I think maybe a color change would help improve, but we do love the color.</p>
