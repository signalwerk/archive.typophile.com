    <p>Hey, this is a new logo mock-up for a small creative firm, specializing mostly in interactive design. The old look we felt was a little to dark and edgy and decided to lighten it up a bit. The new look is just a text mark in Bauer Bodini pt72. We feel we needed something a bit friendlier to relate with our current stream of clients(doctors, lawyers, etc...). We think the new look is a bit more timeless and wouldn’t have to be drastically changed in the future, maybe just retouched. Feel free to make any comments or suggestions on the logo including if it should be accompanied by a mark or not?? Thanks for any posts.</p>
    <p></p><div class="imageWrap"><img src="/web/20081121191828im_/http://www.typophile.com/files/fourfather_4967.png"></div><p></p>
