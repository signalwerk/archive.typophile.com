      <p>A few inexpert smartass comments:</p>
      <p>You usually buy the licence and get the font for free with it. Oh, they say you're buying a font, but you're not. Read it (the licence) really carefully (this is a good time for deerstalker and magnifier) for it details--or at least should detail--what you may and mayn't do with the font.</p>
      <p>The logo designer will need a licence for the fonts (s)he uses. The client? If your client  is using the font to produce new text, then yes. If the client is just rubberstamping with a pre-prepared logo, (s)he will probably not need hir own licence.</p>
      <p>The folk behind the "Open Letter to Monotype" (see thread of same name) have been doodling a freely-available DIN type, if I remember correctly.</p>
