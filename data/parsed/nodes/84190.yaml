    html: <p>I am not sure if all the questions have been answered, but if it were me, I would only use the logo as outlines, and never as text.  This of course avoids any issues with font embedding, and allows you some level of control over people modifying your logo (consistency is key in branding).  You probably want to manually adjust kerning and spacing to fit your project too, and it is a bit risky to assume those attributes will carry over if you bring your logo into a program as text.  Anyway, my point is that you should convert your final design to outlines to make your logo design master, usually *.eps format.</p>
