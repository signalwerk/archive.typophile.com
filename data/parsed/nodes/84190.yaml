      <p><strong>Check the EULA</strong> on each font you want. All licensing rules listed there. Each of them may be different. But that is it contains a law basis which will legalize you use the relevant font. As a designer, you could have a cost for the client to license the font, but it means the license's font belongs to your client. It all depends on your agreement with them.</p>
      <p>Best Regards</p>
