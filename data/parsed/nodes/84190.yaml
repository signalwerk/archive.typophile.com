    html: |-
      <p>"It usually doesn't matter what the fonts are used for"</p>
      <p>It shouldn't, but there are common (though not universal) exceptions. Typically, you can't use the type created from the font as part of a commercial product (like kid's blocks using the letters as the design). And, often, you're not allowed to embed the font without a separate license (in a PDF, as part of software, etc.)</p>
      <p>Some foundries also require separate licenses for identity work (for instance, I believe House requires a separate license if you want to use their fonts in a logo).</p>
