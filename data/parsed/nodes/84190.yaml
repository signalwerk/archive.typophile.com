    <p>Just starting out here. First 'real' design job and I've hit a bump in the road...</p>
    <p>I'm a bit confused about buying licenses to use fonts. I know that it's a requirement but have no clue about them.<br>
    When designing a logo for a company to use on a website and print, the designer/ client needs a license to use it right?<br>
    Do I (the designer) buy the license or does the client? And which type of license is required? Is it purchased when buying the font?</p>
    <p>Any suggestions or advice would be greatly appreciated!</p>
    <p>Alternatively does anyone know any free alternatives to DIN light and DIN 1415?</p>
