      <p>To add simple answers to your questions:<br>
      Whoever INSTALLS the fonts needs a license in the name of the user or company where the fonts are INSTALLED.<br>
      It usually doesn't matter what the fonts are used for. If your clients just get PDFs, logos converted to vector graphics and so on, they don't need a license. </p>
      <p>And in addition to Andi’s comment:<br>
      It doesn't matter how the money flows. You might charge your client for purchasing the font license, but that doesn’t mean they own it then or could use the font. Nor could you grant them permission to do so. The only thing that matters is, which user (licensee) is specified in the font license.</p>
