      <p>This looks great, and I'll bet the client is thrilled. Some technical-based opinions:</p>
      <p>I adore light and hairline weights, but this setting may not reproduce well at smaller sizes (especially when ink may fill in the knocked out type).</p>
      <p>The overall feel is wonderful. I wish, though, that each line had the same visual weight on the stroke. "Cheshire Farm" is light, "— ice cream —" is heavier, and "Est. 1986" is split-hair thin. There's not enough contrast between the three lines to make them feel like the contrast is intentional. This logo would look just right if each line didn't look like it was written with three different pencils. I hope that makes sense.</p>
      <p>n.b. "myself" is reflexive.</p>
      <p>Nice work!</p>
