  html: <p>I am a fan of <a href="http://www.simpledesktops.com" title="www.simpledesktops.com">www.simpledesktops.com</a> so  it was a thrill to have curator Tom Watson put up my White Ampersands design. The ampersand was handlettered with a round nib and black India ink. I then scanned it and cleaned it up in AI. No, not artificial intelligence.</p><div class="imageWrap"><img src="http://typophile.com/files/white_ampersands_detail_6179.jpg"></div><p></p>
  html_clean: <p>I am a fan of <a href="http://www.simpledesktops.com" title="www.simpledesktops.com" class="link-external">www.simpledesktops.com</a> so  it was a thrill to have curator Tom Watson put up my White Ampersands design. The ampersand was handlettered with a round nib and black India ink. I then scanned it and cleaned it up in AI. No, not artificial intelligence.</p><div class="imageWrap"><img src="/files/white_ampersands_detail_6179.jpg"></div><p></p>
