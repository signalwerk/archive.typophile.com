      <p>Yiddish Characters: </p>
      <p>1. Why do you have the letter alef + dagesh/mappik? alef + dagesh/mapiq is pure Biblical Hebrew.</p>
      <p>2. The letter alef + kamats is actually a vowel (o); this isn't the 'regular' kamats. The letter ayin is the vowel e. </p>
      <p>Yod Yod + patah is the diphthong ei  -- e.g. in German: rein, briet, mein, and Yiddish:מײַן </p>
      <p>So the title is Yiddish Vowels :)</p>
    html_clean: |-
