      <p>My understanding is that while the Sadducees didn't believe in an afterlife, the way the New Testament referred to the Pharisees and Sadducees together implied that they were both respected portions of the Jewish community, even if they were in disagreement. But the Samaritans, on the other hand, were despised, hence Jesus' parable of the "Good Samaritan", to illustrate that righteousness towards one's fellow man comes before correct theology.</p>
      <p>The Sadducees may have, like Karaites, rejected the Oral Law, or simply placed less emphasis on it; but they were definitely not Samaritans.</p>
      <p>As to the Karaites, yes, they are very similar in some ways to Christians - and, thus, they have been the targets, even more than ordinary Jews, of efforts to convert them to conventional Christianity, or to become "Messianic". But as long as they not only do not accept Jesus as the Messiah, but also do not accept the New Testament as scripture, there would still be plenty of room for differences between them and Christians.</p>
