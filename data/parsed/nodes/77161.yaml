      <p>I return to the woman, and prodded for that something special she did. She told me that it must have been when she was a small child. Her grandfather lived with her family when he was very old, as was the beautiful custom years ago. Every Shabbos he want to walk to an Orthodox shul, which was many many miles away. Each Shabbos she walked with her grandfather, while her parents and siblings drove in the family car. Even when it was winter, her grandfather and her tredged through the freezing snow.</p>
      <p>That must have been the special good and kind act.</p>
