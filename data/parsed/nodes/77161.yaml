    html: |-
      <p>John,</p>
      <p>In your example from Genesis 43:26, the aleph in the 4th word, "va-ya-vee-ooh" - "...ooh" has to dot not in the center space below on the left side, but in the center space above on the right side.</p>
      <p>Perhaps, it's not there at all. What you see is ink splatter or dirt.</p>
      <p>David, do you have the van der Hooght Biblia Hebraica of 1849 to compare? Why would they put the dot above.</p>
      <p>I don't think that it is a dagesh at all. Rather, it must be a mappig, because there is greater space for placement in the middle height on the left or right (though we put a dagesh on the left of the letter). So, if it was placed below, it was in order to teach us that it was not a dagesh, but a mappik.</p>
      <p>The typesetter at the van der Hooght Biblia Hebraica of 1849 likely made an error.</p>
