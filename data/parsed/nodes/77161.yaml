      <p>A beautiful and informative chart, which will no doubt prove helpful to many people considering the design of a Hebrew typeface.</p>
      <p>However, it creates the appetite for more.</p>
      <p>Under "Characters Used for Hebrew Grammar", we see two forms of the Komatz, one longer than the other. But these distinct characters aren't named, nor are Unicode points given for them.</p>
      <p>Shvah and Komatz are both shown aligned below the characters - and it appears that the same alignment applies for both of them, making those two charts redundant (except for differences caused by the fact that Shvah is narrower). But the correct alignment of marks that appear above the characters isn't shown.</p>
      <p>Oh, and the alignment of Shvah and final Nun is missing.</p>
