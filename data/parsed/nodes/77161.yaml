      <p>With all due respect to my Christian friends, I think that analogy of the "Good Samaritan" is misleading, like the answer about what goes out of a mouth can justify what wrong things go in the mouth. Like the gay rights activists argue about great gay people in the arts.</p>
      <p>A good thing doesn't justify a wrong thing. They are two separate issues.</p>
      <p>Sure, be kind to others, speak fine words, be creative even inspiring, but don't do the wrong things.</p>
      <p>It's misleading to suggest that a good act automatically justifies anything else.</p>
      <p>I'm sure that there were good Nazi fathers at home with their wives and kids. But on the Jew street, they yanked out beards, threw babies in the air and shot them with their guns, or raped wives in front of their husbands.</p>
