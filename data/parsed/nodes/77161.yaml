    html: |-
      <p>In the entire Tanach (Hebrew Bible), a combination of a final nuhn and shva never occurs. A combination of a final nuhn and komatz however does occur. Hence, only the latter appears.</p>
      <p>In the entire Tanach (Hebrew Bible), a combination of a final chaf with shvah or komatz occurs many times. Therefore, these combinations appear as a standard item in a vocalized (with nikud and dagesh) font.</p>
      <p>In a font, the dagesh version of a final chaf has the shvah or komatz appear either above the baseline, to allow the taam to be positioned below the baseline, or in order for these nikud vowels to stand out, as a nikud rarely occurs in the final form of a Hebrew letter.</p>
      <p>A final mem does have chirik appear under it when followed by a non-appearing yud, as in the world, Jerusalem ירושלים. Hence, there is a dedicated glyph for this combination.</p>
      <p>In OpenType, only Unicode values appear. The "advanced" or "intelligent" Hebrew fonts substitute and reposition the required combinations (GSUB and GPOS), so additional Unicode values are not necessary.</p>
      <p>Above the alignment rules are visually described, as you noted.</p>
      <p>Basically, the nikud vowel is centered under the medium width Hebrew letter. In the case of a Daled or Reish, it is right aligned under the vertical stem of the letter. In the case of the narrow or wide Hebrew letters, the nikud vowels are centered as well, though some modification is done by the type designer, based on the particular design of that Hebrew letter.</p>
      <p>The characters for Hebrew grammar are also those for the shvah-na. A Unicode value is not given, because the Unicode Consortium has not assigned one as of yet. I will post the Unicode value for the komatz katan.</p>
      <p>The folded lamed (the ascender is folded to be parallel to the ascender height (important for narrower line spacing, and/or not bump into the nikud vowels in the line above.</p>
