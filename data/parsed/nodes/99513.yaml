  html: |-
    <p>Passing this logo to a designer, who wants to know what the typeface is so she can see how headings look in it. </p>
    <p>To me the teardrop shape of the counter in the a, the bulbous nose on the uppercase E, and the sawed-off bar on the t, and the tapered appearance of some of the stems are revealing. But then the vertically squashed appearance of the lower case s and o are offputting.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/stages-sights-sounds_4879.gif"></div><p></p>
