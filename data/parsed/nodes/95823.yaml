    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FontsTradeCard-Print_144A_5153.jpg"></div><p></p>
    <p>The New York Times covers Nancy Sharon Collins’ <a class="freelinking external" href="http://tmagazine.blogs.nytimes.com/2012/08/24/the-complete-engraver/" rel="nofollow">The Complete Engraver</a>, her book about all things engraved (though its written as if both MOMA and Clinique are active clients—which they are not—correction forthcoming ... ).</p>
    <p><a class="freelinking external" href="http://www.kickstarter.com/projects/1872144378/engraving-for-nerds-the-book-tour" rel="nofollow">Help</a> support the book tour (2 days remaining), it underwrites a four city, east coast book tour, commencing in September when <a class="freelinking external" href="http://www.amazon.com/The-Complete-Engraver-Monograms-Stationery/dp/1616890673" rel="nofollow">The Complete Engraver</a> hits book shelves.</p>
    <p>Pictured, above, is an engraved specimen of both JMC Engraver and Feldman Engraver, these companion revivals are based on engraving styles which were re-engineered and expanded into modern, OpenType fonts by Terrance Weinzierl, Monotype Imaging, and are available <a class="freelinking external" href="http://blog.fonts.com/2012/07/24/the-complete-engraver/" rel="nofollow">FREE</a>.</p>
