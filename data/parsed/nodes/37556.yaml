      <p>Looking at the sample I have to say that solid &amp; impeccable were the first thoughts I had. Congratulations. </p>
      <p>Re the 'a' I have to admit that I think John is right about there being a stronger divergence there than in the other letters I can see. On the other hand, it seems to me that with the serif it would be harder to justify the strong arch. The reason I say this is that the arch isn't just an affectation. It helps to say to the eye 'this is an a'. It has a purpose. In the case of the serif version it is the serif in part that does this job. You could pull the serif down, make it smaller &amp; put some arch back in but I wonder if it it would end up feeling pretty forced and like there were too many things happing in the letter at once. Maybe not. I would have to try it to see. Not that I think Kris needs my help. Is this the kind of thing you had in mind John?</p>
