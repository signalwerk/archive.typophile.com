      <p><em>Oh really? As you are an accomplished typeface designer, you don’t need the outline. Just draw what you think it should be like and show us.</em></p>
      <p>Sure, make me do it the hard way. 23 minutes, including reconstruction of the existing a.</p>
      <p>On the left, a scan of the Meta a. On the upper right, my reconstruction of the existing Meta Serif a. On the lower right, my revised form echoing the dynamics of the original Meta a in the top right and in the lower bowl.</p>
      <p><img src="/sites/default/files/old-images/MetaSerif-aRev_5458.gif"></p>
      <p>Now we can play the Sesame Street 'One of these things is not like the others...' game.</p>
      <p>The bowl is interesting, because the greater modulation in the serif design allows for greater stress than in the sans. If you follow the shape of the sans counter in the serif letter, you get a much more static letter, but if you shift the contrast to emulate the amount of weight in the lower left of the sans bowl stroke, you get something with a similar dynamic, even though the counter shapes are now more different.</p>
      <p>Kris, please don't take these quibbles about <em>one letter</em> as an insult. On the whole, I think Meta Serif looks like a really good and eminently useable type. And at text sizes, considering the typeface idependent of Meta, the lowercase a is a nice, legible form. But if part of your goal is to look 'just like Meta' in headlines and other larger settings, then this letter is letting down the side, so to speak.</p>
