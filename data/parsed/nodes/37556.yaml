      <p><em>Leveraging brand equity...BS thread :-)<br>
      What do you mean?</em></p>
      <p>A witticism.<br>
      If I have to spell it out: it's cute to poke fun at others, but when creatives mock the vacuous language of suits, there may be something ironic when that language perfectly describes their own behaviour. An example of the virtue and precison of "corporate BS" is the way in which it nails product extension, a practice which has become de rigueur for any successful typeface. My comment is not one person's criticism of the venality of another's behaviour, for after all business is business and I have done such brand extensions myself (Fontesque Sans, for instance). So don't take it personally! </p>
      <p>However, there may be a bit more bite in my wit, if there is more similarity suggested by the name than there is formal correspondence between the original and the serif version.</p>
      <p>The interesting thing is how similar sans and serif faces should be in order to work together.<br>
      I agree with Erik that too much similarity is detrimental, because a typographer needs some edge when contrasting styles.<br>
      But on the other hand, from a marketing perspective, perhaps the different branches of mega-families won't be purchased and used together at all. For instance, TheAntiqua is used as a text face in <em>New Scientist, </em>and the sans heads are Dax, not TheSans.</p>
