    html: "<p>Paul, he probaby it means metrically compatible. It’s something that Spiekermann et al. have often done, taking the metrics of Arial or another widely available font and use that as a starting point to draw a custom type. That helps with existing documents already set in that typeface: they can be switched to the new, custom one, without having the text reflow. The same is true in reverse, texts set in the new custom typeface can look “similar” in Arial et al. without text reflow.</p>"
