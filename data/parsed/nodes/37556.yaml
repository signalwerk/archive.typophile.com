      <p>Eben: <em>Just in case I wasn’t clear I am asking Kris &amp; John if they think (or don’t) that the presence of the serif inherently makes it harder to mirror the sense &amp; tension of the sans a in the serif a.</em></p>
      <p>I don't think so, no, because there are plenty of serif lowercase a letters with internal tension. The Meta Serif lowercase a is a very well balanced, very static form. There's nothing inherently wrong with that, but it looks odd among other letters that do have more internal dynamism and especially odd in the context of the strong internal dynamism of the original Meta a. So the primary issue is not specific dynamism, e.g. that of the Meta a, but a general discrepancy between static and dynamic forms. This needn't be addressed by trying to directly emulate the dynamic of the Meta a; it could be addressed by introducing any dynamic at all into the Meta Serif a. Just give me five minutes with the outline. :)</p>
      <p>But all this should be read in context of the remarks above about different fonts for different sizes. As with most other contemporary typeface design projects, Meta Serif is trying to do (at least) two things at once: in this case, to be an indestructably legible type at 10pt and to 'look just like Meta' at display sizes. And maybe the lowercase a indicates the breaking point at which these two goals are mutually opposed, because I've no doubt that this letter is legible at 10pt -- even when given a sound beating by a laser printer -- but at display sizes it looks nothing at all like Meta.</p>
      <p>So I look forward to the Meta Serif display cut, and would actually give it higher priority than Meta Fraktur or Meta Brushscript. :)</p>
