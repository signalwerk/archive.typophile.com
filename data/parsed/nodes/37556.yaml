      <p>Mike: <cite>Seriously tho, crunchy bracketed terminals are so not pretty :-/ but, the italics do have some measure of warmth in them.</cite></p>
      <p>Do you mean the Meta Serif terminals? They are specifically designed to withstand a laser-printed beating at 10 point, much like Meta Sans can handle a lo-res thrashing. They may not look "pretty", but rest assured they can handle their own at small sizes!</p>
      <p>John: <cite>At larger sizes, such as a headline, the a jumps out as simply not very Meta, and undermines the ’looks just like it’ effect… The Meta Serif a is a very nice, very balanced letter, and as such it is lacking the dynamism that makes the sans so interesting.</cite></p>
      <p>What can we say? We made a serif companion to one of the most popular sans serifs of our time, a sans that has been around for 22 years! This is plenty of time for folks to look at it, get used to it, use it and form their own opinions and feelings about it. As far as I know, drawing a serif 22 years after the sans doesn't really happen that much—these days sans/serif families tend to be drawn at the same time.</p>
      <p>So I understand your disappointment with the "a". I am glad that you acknowledge <cite>despite the different contrast and proportions and the presence of the serifs, the two types echo each other very nicely</cite>. To this end, I'm sure you'll agree the serif "a" plays nicely with the rest of it's seriffed brothers &amp; sisters. </p>
      <p>—K</p>
