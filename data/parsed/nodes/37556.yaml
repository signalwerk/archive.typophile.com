      <p><em>he probaby it means metrically compatible.</em></p>
      <p>No, not at all. Besides, when you take one face’s metrics and design another one over it (as Arial did for Helvetica), that’s not compatible, but identical. Otherwise it would be useless.</p>
      <p>MetaSerif being 100% compatible with Meta means that you can mix them in the same line and they will work together without you having to adjust the size or the tracking of one of them. We often have to mix sans and serif in one document, like an annual report where the text would be in serif while the number section would be sans. Or we use sans for captions, subheads, listings as contrast to a more traditional serif textface. We did this for the Economist, where we contrasted my Officina Sans with the proprietary Economist Serif, designed by Ole Schäfer. This helps navigation, adds interest and makes typographic hierarchies obvious.</p>
      <p>I have always liked to add a sans headline to serif text, but doing that in the same paragraph or even line was only possible with either a lot af adjustments or within one of the mega-families. Some of those -- like Rotis -- are simply clones of each other with bits removed or stuck on, providing noise instead of contrast. The whole Meta-systemis supposed to solve separate typographic problems while keeping a family resemblance. This is not a family of identical triplets (there is also MetaHeadline), but sisters and brothers or even nieces and nephews.</p>
