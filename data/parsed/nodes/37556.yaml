    html: "<p>I don't think the top of the lowecase a is working. In the sans, the apex of the a is pushed to the right, which gives the letter a wonderful tension that makes it one of the most characteristic aspects of the typeface. Erik always points to the funky g as Meta's most distinctive letter, but since the a is so much more common in text it has always seemed to me the 'Meta-letter'. In the new serif design, something totally different is happening in the a: the apex is much further to the left and this, combined with the heavy terminal, makes the dynamic of the top part of the letter completely contrary to what is happening in the sans. While the sans a is very tense and carries a lot of character, the serif a is strangely bland in comparison, and doesn't echo the sans as nicely as the other letters do.</p>"
