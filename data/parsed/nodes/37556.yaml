    html: |-
      <p>Kris: <em>What if it works beautifully at 10 point?</em></p>
      <p>Then you need different fonts for different sizes. But we know this already.</p>
      <p>Christian writes, on the Meta Serif preview webpage: <em>In the end, I think FF Meta Serif has only a passing resemblance to FF Meta, but when you set a headline or a block of text, it somehow looks just like it.</em></p>
      <p>At larger sizes, such as a headline, the a jumps out as simply not very Meta, and undermines the 'looks just like it' effect. And its the only letter, so far as I can tell from the images on Christian's site, that does this, so of course my eye jumps straight to it every time. Looking at it longer, I think part of the issue is the weight movement through the lower bowl as well as the position of the apex. The Meta a has a strong opposite pull between the lower left of the letter and the upper right, because the bowl sags slightly and the apex pushes up and out. This is brilliantly done, and makes the Meta a very distinctive and dynamic. The Meta Serif a is a very nice, very balanced letter, and as such it is lacking the dynamism that makes the sans so interesting.</p>
      <p>Look at the comparison setting of the word 'organized' on Christian's site. In every letter except the a, despite the different contrast and proportions and the presence of the serifs, the two types echo each other very nicely. But the two a's look completely unrelated.</p>
