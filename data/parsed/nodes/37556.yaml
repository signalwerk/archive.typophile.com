      <p><em>In the end, I think FF Meta Serif has only a passing resemblance to FF Meta, but when you set a headline or a block of text, it somehow looks just like it.</em></p>
      <p>So says Christian, and that’s why i involved him (and he involved Kris). I had had several attempts at sketching the <em>Brand Extension</em>, but i never got across the hurdle of making it just like the Sans, albeit with serifs on. The original Meta owes a lot of its idiosyncracies to the fact that the first versions never really got finished by today’s standards, they were cobbled together over time and the expansion of the family then involved many other designers. That is probably just as well because perfection can be dangerous and make a face slick and unpersonal. My own sketches never got anywhere and it took Christian to take a step back and design a serif companion that is more than an extrapolation. We deliberately didn’t want to make MetaSerif as stylish and novel as MetaSans was when it was first designed in 1985. It is supposed to be an ordinary, legible typeface for all purposes. MetaSans was designed for small sizes which didn't stop people using it for headlines even though there is a proper headline version. The serif companion will probably suffer the same fate, but we never intended each single character to be the exact seriffed equivalent of its sans original. MetaSerif feels like MetaSans, and they look good together. That was our brief and i think we have achieved that. Which doesn’t mean that certain characters couldn’t look different or may even be improved. I have learned that there comes a time when things are best left alone. After many years at trying to get it right, i now look forward to actually using MetaSerif. Only that will determine whether we did well.</p>
      <p>The illustration shows alternative shapes for the drop on the a as a model for other characters.<br><img src="/sites/default/files/old-images/MetaAntiqua_aaa_5757.jpg"></p>
    html_clean: |-
