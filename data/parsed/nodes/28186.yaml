  html: |-
    <p>Years ago, I created <a href="http://www.1001fonts.com/font_details.html?font_id=2243">Kosal Says hy</a> purely as an my first font endeavor. I uploaded to as many sites possible hoping to see it used everywhere (however bad it may be.) Lo and behold, I do a search for graffiti fonts on myfonts and see a font that is extremely close to my original drawings. So close that it can't be a coincidence: <a href="http://www.myfonts.com/fonts/wilton/shallow/">Shallow.</a></p>
    <p><img src="/sites/default/files/old-images/comparison_3976.gif"></p>
    <p>Looks like the designer softened up the letters, added whatever ornament necessary to distinguish it, thickened the strokes, and made some much needed improvements. Is this legal? Probably so, because I labeled it as freeware, right? </p>
    <p>Not that it bothers me, my original was crappy anyway. I'm just surprised.<br>
    Slightly flattered.</p>
