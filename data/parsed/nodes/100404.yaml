      <p>"Club" looks like a modified <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=Stilla%20LT%20Std%20-%20Regular&amp;fid=7c77a22d8d5264fbdca9d86e5f9e8218&amp;fsize=60&amp;text=Club&amp;fit=1" rel="nofollow">Stilla</a></strong> by  François Boltana (1973) available from Linotype,  Scangraphic Digital Type Collection and E&amp;F</p>
      <p>"Rotation" must be <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/dogma/" rel="nofollow">Dogma Script Bold</a></strong> by Zuzana Licko (1994) from Emigre Inc, with a modified /t/i/n</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
