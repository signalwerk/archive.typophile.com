    date: 2011-10-10T08:17:00
    date_raw: 10 Oct 2011 — 8:17am
    votes: null
    html: <p>You can create paths which will held with the Burn process described above AND provide the outlines necessary to add the little green flourishes by outlining the type in a drawing program (like Illustrator or CorelDraw), converting the outline to curves, then cutting the outline path to remove the overlap with the letters themselves. The inner portion of the path provided the line segments needed to construct a perfect Burn mask for the letters themselves, and the outer portion can also be segmented, with the ball caps added for finish.</p>
