    html: <p>I would just do it in photoshop with the Burn tool. Just set the brush to be very soft, and set the exposure for the tool low (maybe 10% to 20%). Then just paint in the shadow manually (and mask out the part of the letter that's supposed to be "higher" and not shadowed).</p>
