      <p>I think you are right. There is a newer version called NuSwift (designed in 1995), which must have very subtle variations from the earlier Swift (designed in 1985) by Gerard Unger. Honestly, I can't tell the difference with my uncalibrated eyeballs.</p>
      <p>- Mike Yanega</p>
