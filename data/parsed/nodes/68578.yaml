    votes: null
    html: |-
      <p>Apparently, that should be spelled 'Neue Swift'. According to <a class="freelinking external" href="http://www.linotype.com/6093/neueswift.html" rel="nofollow">this page</a> on the Linotype site, Unger designed Swift 2.0 (now distributed by ParaType), which was refined into Neue Swift, as an Open Type design for Linotype.</p>
      <p>As I read it the variations are very minor, and were made because of certain shortcomings of the URW Ikarus digitization tool first used to digitize Swift.</p>
      <p>- Mike Yanega</p>
