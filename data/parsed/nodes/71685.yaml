    html: <p>Metallic ink on uncoated stock tends to get absorbed by the paper and leaves a dull mottled effect. If you want it to look like metal on the paper, you probably ought to go with metal foil. Or at least that's been my experience with the two processes.</p>
    html_clean: <p>Metallic ink on uncoated stock tends to get absorbed by the paper and leaves a dull mottled effect. If you want it to look like metal on the paper, you probably ought to go with metal foil. Or at least that's been my experience with the two processes.</p>
