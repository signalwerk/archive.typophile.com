      <p>&gt; the foil seems too shiney and bright</p>
      <p>Matte foils are available.</p>
      <p>&gt; concerned that metallic ink on cotton stock will be too dull</p>
      <p>Multiple hits (running it through the press two or more times) will give you better coverage (but will cost more).</p>
