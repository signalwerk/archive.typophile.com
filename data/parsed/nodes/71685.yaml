    html: |-
      <p>Foil stamping is not as sharp as metallic ink.</p>
      <p>Metallic ink, especially silver, looks absolutely ghastly on uncoated stock.</p>
      <p>If you can, get a sample package from a local printer who specializes in special printing techniques.</p>
