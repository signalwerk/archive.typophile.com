  html: <p>I'm working on a business card project. The old card was offset with gold foil and green ink. I'm keeping the basic color scheme but I'd prefer to have it printed in letterpress. I just can't decide between metallic ink or foil stamp. I'm leading toward the metallic ink, the foil seems to shiney and bright but I'm concerned that metallic ink on cotton stock will be too dull. Has anyone used either method recently? What were your pros and cons?</p>
  html_clean: <p>I'm working on a business card project. The old card was offset with gold foil and green ink. I'm keeping the basic color scheme but I'd prefer to have it printed in letterpress. I just can't decide between metallic ink or foil stamp. I'm leading toward the metallic ink, the foil seems to shiney and bright but I'm concerned that metallic ink on cotton stock will be too dull. Has anyone used either method recently? What were your pros and cons?</p>
