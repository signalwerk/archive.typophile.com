    html: |-
      <p>We offer gold and silver metallic inks on <a class="freelinking external" href="http://www.designyourowncard.com/" rel="nofollow">my site</a> and I'd agree that it's duller, especially on uncoated stocks. We have a black uncoated paper and gold ink in particular almost disappears on it and really requires bold art.</p>
      <p>Metallic raised ink is also interesting. It looks sort of like glitter.</p>
