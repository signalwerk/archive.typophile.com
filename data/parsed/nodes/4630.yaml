    <p>Hello, everyone. This is my first post, but  <br>I thought I would kick off with something  <br>that I'm sure everyone has an opinion on.  <br>I'm investgating type spaces for my MA, in <br>particular the idea that longer lines of <br>type need a bigger wordspace. Erik Spiekermann <br>advances this idea in 'Stop Stealing Sheep',  <br>but doesn't really give a reason to back it  <br>up. I feel as if it ought to be true, and can <br>see it on a visceral level, but I wondered <br>if anyone had any empirical evidence or  <br>reasons to support </p>
