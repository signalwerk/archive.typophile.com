    html: <p>&gt;the amount of printed area  <br>in the line increases more quickly than the  <br>unprinted area, and this is why the wordspace  <br>should be increased. <br> <br>I don't know the answers here, but it seems to me more than one goal and standard is involved.  For example, increasing word space in longer lines may help evenness of color, an aesthetic consideration, but may harm readability, which is influenced by consistency of rhythm of the letters and spaces. <br> <br>In 'The Finer Points in Spacing' Dowding gives convincing examples of where excessive word spacing hurts readability, because the eye doesn't hold to the line of text as easily. On the other hand, his own word spaces to my eye are so pinched that they make reading more difficult.  <br> <br>Good luck on your research &amp; do post your results!   </p>
