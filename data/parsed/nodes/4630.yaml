    html: "<p>Hello Hrant, <br> <br>thanks for the Patterson Tinker information, I'll  <br>go and have a look at that. As for the wordspace/ <br>line length conundrum, maybe I'm looking at it in <br>the wrong way. Perhaps it's more helpful to see it <br>as shorter lines having smaller wordspaces. I can  <br>see how this might be the case on a newspaper, <br>for example, where short lines with minimal  <br>leading necessitate tighter horizontal spacing to <br>maintain a more coherent horizontality. Whether  <br>there's more to it than economic necessity though, <br>I don't know. <br> <br>I can't help wondering if Erik Spiekermann's  <br>position is one of principle rather than  <br>practicality. Having said that, when I look at  <br>the end of my previous post and compare it to  <br>the longer lines of your post, my post seems more  <br>gappy. I don't know anymore whether or not I'm <br>seeing things because I want them to be true.  <br>I've spent too long thinking about this problem <br> : ) <br></p>"
