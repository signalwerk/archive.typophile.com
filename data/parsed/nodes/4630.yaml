    html: "<p>There are so many variables involved, I don't think it's possible to isolate one. If you were to conduct a thoroughly empirical experiment, you would vary word space against each of these in multiple combinations: <br> <br>-line length <br>-type size <br>-type style  <br>-type face <br>-type weight <br>-tracking (letterspacing) <br>-leading <br>-word length <br>-language <br>-ink color/paper stock <br> <br>and that's just in the type specs. You would also have to vary text, and readers' age, education, sex, etc.,, and the reading environment, if you wanted to come up with a legitimate general principle. <br> <br>You could however focus on a specific relationship. One that concerns me as a type designer is the amount of contiguous white space in glyphs: for instance, consider a word ending in \"t\" and the following space: the \"t\" in Helvetica has two protusions on the right, the \"t\" in Futura just one. how does this affect the size of the following word space? The experiment would involve designing a typeface with alternate versions of the t, and seeing how that effected word space. Another thing to vary is the amount of protrusion of the crossbar in f, and t, and the arm in \"r\". <br> <br></p>"
    html_clean: "<p>There are so many variables involved, I don't think it's possible to isolate one. If you were to conduct a thoroughly empirical experiment, you would vary word space against each of these in multiple combinations: <br> <br>-line length <br>-type size <br>-type style  <br>-type face <br>-type weight <br>-tracking (letterspacing) <br>-leading <br>-word length <br>-language <br>-ink color/paper stock <br> <br>and that's just in the type specs. You would also have to vary text, and readers' age, education, sex, etc.,, and the reading environment, if you wanted to come up with a legitimate general principle. <br> <br>You could however focus on a specific relationship. One that concerns me as a type designer is the amount of contiguous white space in glyphs: for instance, consider a word ending in \"t\" and the following space: the \"t\" in Helvetica has two protusions on the right, the \"t\" in Futura just one. how does this affect the size of the following word space? The experiment would involve designing a typeface with alternate versions of the t, and seeing how that effected word space. Another thing to vary is the amount of protrusion of the crossbar in f, and t, and the arm in \"r\". <br> <br></p>"
