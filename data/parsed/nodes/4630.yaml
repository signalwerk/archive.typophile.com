    html: "<p>Alex, this is indeed a great topic. <br> <br>Patterson and Tinker did a lot of solid empirical research in the 50s and 60s, but I don't remember anything specific about word spaces (you might check). As Nick says, the massive inter-relation of variables is very daunting. And I agree with William too: I have my doubts about making word spaces longer in proportion to line length. It might actually do more harm, not just in the way William notes, but also because the longer the line the more you depend on the leading to find your way back to the beginning of the next line, and bigger word spaces make that harder. Lastly, the more horizontal room a line takes the slower the reading. <br> <br>If Spiekermann would give a reason, we could analyze it - maybe there's something I'm missing? <br> <br>hhp <br></p>"
