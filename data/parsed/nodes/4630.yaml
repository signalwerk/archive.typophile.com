    html: "<p>It recently occurred to me that there is another factor involved in word spacing: kerning. <br> <br>When you have a word starting with a \"needs kerning\" combination of characters, it requires a certain amount of word-space preceding it, in order that the first letter doesn't look like a single word. This is particularly apparent for the nasties: T,V,W and Y followed by a round lowercase letter. <br> <br>Hence the huge spacing in 19thC typography. <br> <br>In a tightly fitted and kerned face, you can even put kerning between the space character and letters such as A,T,W,W,Y, and period and comma.</p>"
    html_clean: "<p>It recently occurred to me that there is another factor involved in word spacing: kerning. <br> <br>When you have a word starting with a \"needs kerning\" combination of characters, it requires a certain amount of word-space preceding it, in order that the first letter doesn't look like a single word. This is particularly apparent for the nasties: T,V,W and Y followed by a round lowercase letter. <br> <br>Hence the huge spacing in 19thC typography. <br> <br>In a tightly fitted and kerned face, you can even put kerning between the space character and letters such as A,T,W,W,Y, and period and comma.</p>"
