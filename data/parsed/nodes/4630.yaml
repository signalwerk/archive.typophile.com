    html: <p>Thanks Nick, <br>you read my mind. I'm in the process of designing <br>some sort of visual demonstration of typographic  <br>variables, comparing one against the other. I was <br>sticking to line length, wordspace, global letter- <br>spacing (tracking) and type size, although now <br>you mention ink colour and paper stock, I wonder <br>if I can integrate that. Hum. <br> <br>You mention word length, which is interesting.  <br>I was assuming, because a word is usually <br>bigger than a wordspace, that as the length of  <br>a line increases, the amount of printed area  <br>in the line increases more quickly than the  <br>unprinted area, and this is why the wordspace <br>should be increased. But this is a very  <br>tentative supposition, and I've been trying <br>fruitlessly to prove it to myself mathematically. <br>I think I might be on a fool's errand ... <br> <br>The wordspace in relation to specific glyphs <br>is also something I've been thinking about in <br>a very fuzzy way. I tend to see it in relation <br>to the end of one sentence and a following <br>sentence starting with "T", which is pretty  <br>common. Sometimes it can get quite gappy, <br>depending on the font.   <br> <br>Thanks again for your help, you've made me  <br>think about the problem differently. I was <br>getting pretty blinkered. <br> <br> <br> <br></p>
