      <p>Richard:</p>
      <p>I hate to be so gushy about TypeCulture, but I rarely receive that level of service from any company, never mind a digital type foundry. </p>
      <p>Each letter along with my little gifts (one was a limited edition letterpress broadside and the other was a limited edition letterpress bookmark) arrived on TypeCulture letterhead, signed by Mark Jamra personally, with friendly (and different) notes each time.</p>
      <p>The broadside came in a TypeCulture cardboard protective sleeve, and I keep both items in it. </p>
      <p>Over the past few years I've made numerous font purchases - everywhere from StormType, to Fountain, to Village (though the folks at Village were very pleasant to deal with.) TypeCulture stands out in my mind as a unique experience.</p>
      <p>Oh yeah, and their fonts are great, too.  ;)</p>
