      <p>Jeffrey — To get a nice example of Cycles in use *and* a nice type book all in one, you might consider ordering a copy of the publication that accompanied the exhibition <em>FONT: Sumner Stone, Calligraphy and Type Design in a Digital Age</em> at the Ditchling Museum in 2000. </p>
      <p>This 64-page book has a couple nice essays, including one by Stone, and the whole thing is set in Cycles Eleven. </p>
      <p>I believe copies are still available:<br>
      <a href="http://www.ditchling-museum.com/visit_shop.html" title="http://www.ditchling-museum.com/visit_shop.html">http://www.ditchling-museum.com/visit_shop.html</a> </p>
      <p>(Scroll down to the bottom.)</p>
