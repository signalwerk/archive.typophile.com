    <p>Hi all,</p>
    <p>I'm looking at buying a good, versatile serif text/book typeface. As my budget is rather limited at the moment I'm looking for a typeface that is not to expensive, yet has all the essentials (bold, italic, small caps, old style numerals etc) for setting extended text. Would be nice if you had some good pointers for me, as the choice is so overwhelming it's hard to know where to start.</p>
    <p>On a related subject: Is there a package of typefaces at a budget price that covers a nice range of typefaces, serif, sans, display etc? Unfortunately I'm not a student anymore, so that door is closed... :-(</p>
    <p>Thanks for your help!</p>
