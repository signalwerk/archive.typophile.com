      <p>I reckon the darkest spot is B/W the v &amp; the e, just seem to be a lot going on in that corner, is there a way to get more white space inside the ’e’? It wouldn’t be the worst thing in the world if ’design’ was put on a new line either above or below the logo, to let the strength of the black lines have their space.</p>
      <p>also, overall there seems to be an unsettling mix of flowy stuff and square edges, perhaps it verges on the busy side of town? Is there a way to simplify things by making it a bit more human, less geometric? Maybe a bit of humanity would input a bit of personality too.<br>
      hope this is useful,<br>
      cheers</p>
      <p>—N</p>
