      <p>You still haven’t added any overshoot to your curves as Satya recommended. Check out his latest post for a great example. The curves should extend slightly below the baseline and above the x-height to make the design more visually balanced.</p>
      <p>Having said that, I like this treatment of “rv” better. The “ve” area is still dark - maybe do something like <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=EF.6733.0.3&amp;attributes.sampleSize=48&amp;sampleText=e&amp;sampleSize=48" target="_blank">Bauhaus’</a> ’e’ where the bowl is open. I think that the ’e’ could work both flat like you have shown it, or angled as Satya has shown.</p>
      <p> - Lex</p>
