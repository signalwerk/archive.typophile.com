      <p>My opinion is that the rv separation is in the wrong place, I would look at a nearer to vertical separation or a curved terminal rather than straight, as Satya mentions the u needs to come down but also the topright horizontal terminal of the v needs to move down to allow the overshoot to do the job of creating a (to the eye, not mathematically) smooth horizontal at the top of the logo. I would also look at the lefthand vertical of the v being closer to vertical to assist with the large open area under the r.<br>
      I think you are barking up the wrong tree if you think your logo can evolve like the MTV logo, it is saturation coverage that allows the MTV logo to change and still remain recognisable, something which yours won’t ever get. I also don’t think it is unique, however that doesn’t make it a failure as a logo – it does have potential. Another thought, why do you want to appeal to a younger audience?<br>
      Tim</p>
