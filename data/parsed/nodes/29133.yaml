    <p>Hi everyone,</p>
    <p>I’m new here, only made a couple of posts so far.</p>
    <p>I was wanting your input on a logo concept I’ve developed.</p>
    <p>About the name nurve ...it’s obviously a variation of the word nerve. I chose the name because it is defined as firmness, courage and boldness. This is the direction I’m trying to take my free lance work. I want to make very bold statements that move away from corporate look and feel (I do enough corporate design at work ...). I’m a young designer and wish to appeal to a younger audience at this time.</p>
    <p>My goal was to keep the mark unique but simple. I wanted something simple that I could expand on in the future ...something that can evolve into different trends (Think Mtv logo. You know, the way it can change its appearance from ad to ad, but still be recongnized?)</p>
    <p>I’m looking forward to the feedback. Even the negative.</p>
