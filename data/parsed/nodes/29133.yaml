      <p>I’m not saying I’m trying to become the new Mtv, LoL, it was just an example. I want my logo to be a basic foundation that has the potential to be very versatile. If I want to add a few things to it here and there  on different pieces of promotion, the foundation needs to be simple ...not overly detailed. </p>
      <p>My goal is to get involved into the design side of the music industry, wether it be event promos, Web site design, logos or packaging. I want to be able to dirty up my logo to give a more hardcore/metal feel or to tone it back in nuetral colors and add patterns inside the letter forms to match more of and indie label style band. Does that make since? May sound like big aspirations, I know, but I can try. I currently work at a very corporate oriented design studio and feel the need to get into the more free and expressive side of design outside of work. I shouldn’t have said I wanted to appeal to younger audiences. I really do want to appeal to all.</p>
      <p>With that all said, I have considered all of the feedback received so far and applied it to the logo. One version with DESIGN and one without.</p>
      <p>brent.</p>
      <p></p><div class="imageWrap"><img src="/files/nurve_2a_5092.jpg"></div><div class="imageWrap"><img src="/files/nurve_2b_4897.jpg"></div><p></p>
