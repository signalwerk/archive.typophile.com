      <p>Thanks for the feedback, keep it coming!</p>
      <p>Satya, is there something in particular you don’t like about the font choice for “DESIGN”? I’m pretty set on that font and plan to incorporate into my identity as my primary font. One reason I’m keeping it semple is to allow it to be easily replaced in the future with words like “CREATIVE” or “MEDIA”. If it is removed from its current position it leaves a visual hole on the letter E. If I extend the leter E however, it creates too much weight on the end of the logo. I’m not saying your critique is wrong, I’m just giving you my logic for the font choice and placement. I will be toying around with the letter U though because I agree there is a bit of a visual tension there.</p>
      <p>Reka, for now I am designing the mark in black only. The next step once of finalize the structure will be color. Thanks for the tips!</p>
      <p>brent.</p>
