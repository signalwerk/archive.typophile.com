    <p>hi you all there</p>
    <p>my name is johnny. i’m graduating in visual comm. / typography at the basel school of design in two weeks.</p>
    <p>I’m fully a fontlab- and FEA-novice, but i’ve drawn a font - and i need a RANDOM glyph substitution to get to work in it - that puts me in trouble at the moment.<br>
    if i don’t have that feature in the font, the whole thing is half as good/relevant.<br>
    i just opened an account in typophile to talk with experts and find the solution</p>
    <p>my situation is quite similar to steffens in <a href="http://typophile.com/node/17887" title="http://typophile.com/node/17887">http://typophile.com/node/17887</a><br>
    just with the need of RANDOM added to it.</p>
    <p>my concept is simple:<br>
    for each letter i drew 4 stylistic variants in fontlab 5 studio - then while typing the generated font, for example an A, it should each time just take another A out of the 4 alternatives there are.</p>
    <p>i get this to work, in the way that i can choose an alternative A in the glyph window (“alternatives for this glyph”) in InDesign</p>
    <p>i tried the feature “substitue  from ” , putting all my A-variants in a glyphclass<br>
    it works. BUT IN INDESIGN IT ALWAYS JUST TAKES THE VARIANT THAT IS FIRST IN THE LIST OF THE CLASS.</p>
    <p>then i found the typophile discussion linked above and tried twardochs suggestions with the salt-feature and ss-feature<br>
    works in the same way but HOW DO I GET THE RANDOM INTO IT ????</p>
    <p>hope someone can help me!<br>
    thanks a lot</p>
    <p>johnny</p>
