      <p><em>i tried the feature “substitue from ” , putting all my A-variants in a glyphclass<br>
      it works. BUT IN INDESIGN IT ALWAYS JUST TAKES THE VARIANT THAT IS FIRST IN THE LIST OF THE CLASS.</em></p>
      <p>this is how the the “sub from” syntax works.<br>
      there is no way to get “real” randomness in OpenType (unless you somehow build your own plugin for the application, that does what you desire) but you can acheive some level of pseudo randomness.</p>
      <p>there are several threads here on typophile discussing how to achieve this effect, i’ll let you wade through them yourself:<br>
      <a href="http://www.google.com/search?q=random+site%3Atypophile.com" title="http://www.google.com/search?q=random+site%3Atypophile.com">http://www.google.com/search?q=random+site%3Atypophile.com</a></p>
      <p>if you want someone to implement this for you, you might contact <a href="/wiki/tal%252Bleming" class="wiki">tal leming</a></p>
