  html: <p>Is there a way to keep FontLab from shifting accents from their default positions when making composites using the "Generate Glyphs" feature?</p>
  html_clean: <p>Is there a way to keep FontLab from shifting accents from their default positions when making composites using the "Generate Glyphs" feature?</p>
comments:
  - id: 111777
    user: 1133
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>To prevent the accents from shifting up, you can specify "~" as in A+~acute</p>
      <p>But to put the component always at 0,0, you need to either use anchors (just set them onto the 0,0 position at both glyphs so the components will snap there) or set the position of the second component to 0,0 per Python after generating the glyph as is: </p>
      <p>fl.glyph.components[1].delta = Point(0,0)<br>
      fl.UpdateGlyph(-1)</p>
      <p>A.</p>
