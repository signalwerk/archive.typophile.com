    <p>What I can tell is that it's san serif, possible condensed. The "R" have straight tail, the "G" has spur, and the bottom arm of "F" is a bit shorter than the top arm.</p>
    <p>The fonts that are close enough are Gnuolane, Arial Narrow, and Avenir Next Condensed. </p>
    <p>Please let me know what is this font is. Thanks!</p>
