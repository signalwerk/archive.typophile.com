    html: <p>David Ogilvy was not averse to bullets, if the "points" to be made in the copy were sufficiently unrelated that putting them in paragraph form would result in cumbersome prose with no flow. If there were a lot of them, he used numbers rather than bullets. --<em>Ogilvy on Advertising</em></p>
