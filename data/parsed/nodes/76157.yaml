  html: "<p>What's everyone's opinion: bullet points vs. paragraph ad copy?  I'm talking about a full page ad here, and meaningful communication with the reader.  Are bullet points boring?  Is paragraph-style copy too intimidating to read?  Does it depend on the situation?</p>"
