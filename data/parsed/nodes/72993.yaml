  html: |-
    <p>A friend of mine, one of a three-piece electronic music group (influences seem to range from dubstep to up-beat pop... that ilk) asked me to have a go at a logo.</p>
    <p>He specified letterforms that were of a simpler geometry and added that he wanted it to appeal to male listeners from 16 years old to possibly early 30s.</p>
    <p>I wanted to create something reasonably dynamic, given the nature of the music, and try to evoke a sense of movement, which lead me to this current design. It contains a very subtle nod back to the once-emerging dance scene, here in Manchester (maybe not even just this city), but without overtly clinging on to the sentiment.</p>
    <p>I'm reasonably pleased with it so far - a rarity for me - but no doubt there are elements I've overlooked and not considered.</p>
    <p>Any thoughts are gratefully received.</p>
