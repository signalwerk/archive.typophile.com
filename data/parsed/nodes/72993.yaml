      <p><em>I don't know if I see "movement," though I do see energy</em></p>
      <p>Fair point - I wrote that in haste - it's certainly more an attempt at dynamism than movement.</p>
      <p>As for its intended use, I think initially it'll be for digital promotion. Then, as soon as they begin to tour (they've recently been booked to support a major artist for his UK dates) it will move to print.</p>
      <p>It did cross my mind that the diagonals may not suit smaller sizes, but probably not significantly enough until you pointed it out. I'm not averse to thickening them a touch to suit, or entrusting them with two (or more) versions.</p>
