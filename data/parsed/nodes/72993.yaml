      <p>Thanks for the input frode frank.</p>
      <p>I think I know what you're saying about those particular sets of 'cuts' - they're not ideal - I just wanted to get a sense of whether you guys felt it worked as an idea. There will certainly be composition revisions.</p>
      <p>But about the spacing; I wasn't completely sure how to approach this.<br>
      The design was built on a grid, with the strokes being 1 unit wide and, when unaltered, each glyph is roughly 1 unit apart, as below:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/citizen_spacing_5526.gif"></div><p></p>
      <p>Although it's not perfect I think it's reasonably close in this way. But obviously as cuts are made the spacing increases in areas - most notably between the Z and E. I wasn't sure whether people's eyes would automatically fill-in the missing areas and mentally construct an image roughly as shown, or whether I should treat each shape as new and then space it accordingly - possibly risking letters virtually 'bumping' into one another. I do trust your opinion on this, but I'd like to know if others felt the same way, as though there were too much space in areas, rather than imagining extended letters, spaced as illustrated.</p>
      <p>I tried a 45° diagonal on the N, but wasn't sure if it would make that letter too wide, I may well retry it.</p>
