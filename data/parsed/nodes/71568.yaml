  html: |-
    <p>Is there a technical limitation/reason behind the lack of schwas in fonts? I'm trying to set the pronunciation of a word in Century Schoolbook, but lacks the schwa, as well other pronunciation characters.</p>
    <p>So, I suppose a broader question this brings up is: why are symbols like the long vowels (vowels with a macron) and schwa not in the standard character sets for fonts? Most of them are simple modifications of other letters, no?</p>
