      <p><cite>So, I suppose a broader question this brings up is: why are symbols like the long vowels (vowels with a macron) and schwa not in the standard character sets for fonts?</cite></p>
      <p>Because they’re very rarely used. Thus it makes sense for the specialists who need these characters to pay the cost of developing them.</p>
      <p><cite>Most of them are simple modifications of other letters, no?</cite></p>
      <p>There are no simple modifications of letters. A letter can’t just be flipped or warped a little and still look good; thought has to go into it. And then it has to be proofed and edited. And kerning must be taken into account; characters with funky shapes and stuff above or below can’t just be thrown into regular kerning classes. In a family, this has to be done for every master and checked again in every interpolation. So, depending on the design of the font, you’re probably looking at at least five minutes of work, and possibly much more, per character, for every single font within a family. And now that everything is global this stuff can’t just be limited to what Western Europe and North America uses; it has to work and be checked with dozens of languages. And none of that accounts for all of the research that goes into figuring out how all these characters are used so that they can be produced and tested. That is why characters like schwa, symbols for typesetting complex equations, and letters/accents for dead languages aren’t going to start turning up in most fonts any time soon.</p>
    html_clean: |-
