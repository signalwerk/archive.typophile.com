    html: |-
      <p>Hello all, thanks for the comments. I hope that anyone here who's met me knows that I understand the work that goes into a single weight, let alone a full family, so I realize that every little bit inflates this large time commitment further. Your answers make sense, and I anticipated it would be basically a matter of spending time on the most needed glyphs. I was curious if there are technical limitations, but clearly there are not (or no longer are).</p>
      <p>I also realized, after I posted, that this is another case of "if you start with one, you have to finish with dozens", so it makes sense that pronunciation characters would be pretty uncommon.</p>
      <p>Which leads me to a question: any pointers for creating one's own schwa? I'm setting a dictionary-style definition that'll be set in roughly 50pt type, so I'd like it to look good when shown at full size. So far, the only typeface in my library that I've come across which actually contains a unique schwa (rather than a simple rotation) is Garamond Premier Pro (thank you, Adobe). It looks like the primary structural differences between the e and the schwa are:</p>
      <p>1) A larger counter, which raises the horizontal stroke in the schwa<br>
      2) The aperture of the schwa is a hair more open, as the lower stroke doesn't curl back in as much before terminating<br>
      3) The thin of the lefthand stroke of the schwa is thicker, but this is also likely a function of this particular typeface's stroke axis</p>
      <p>Any other things to be mindful of?</p>
      <p>Cheers.</p>
