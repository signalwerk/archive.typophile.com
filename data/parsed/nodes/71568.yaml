      <p>I think you have to figure this out for yourself, Chris, based on your own taste and understanding of typographic logic.</p>
      <p>In Oneleigh, it seemed to me that a simple rotation of "e" was out of character with an irregular old style face.<br>
      So I made the top left terminal more like that of "a" (for micro-detail following letters such as "r" and "t"), and enlarged the bowl, to make it less like the "a" when viewing text en masse.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/schwas_4673.png"></div><br>
      <em>e … rotated e … a … schwa</em><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Azerb_5616.png"></div><p></p>
