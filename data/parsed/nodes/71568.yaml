      <p>James, let me disagree partially with you. <strong>Some</strong> characters are really simple variations from another ones, even about kerning and spacing. But others just <strong>seems</strong> to be simple.</p>
      <p>And about characters support, I also think we're still highly determined by Western European culture. Some largely used non-European languages, with write tradition and using Latin alphabet, are fairly marginal to our type standards, while some almost extinct languages from Europe deserves a lot of attention both in Unicode and in type tradition.</p>
      <p>I believe this would slowly improve with time, with more and more fonts with a wide language support.</p>
