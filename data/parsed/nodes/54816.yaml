    <div class="info">Submitted by <a href="/user/35124" title="View user profile.">Jack Yan</a> : 15.Feb.2009 12.37am </div>
      <p><strong>Wellington, February 16</strong> JY&amp;A Fonts, founded by Jack Yan in 1987, has announced a brand-new typeface family, JY Alia.</p>
    <p>The New Zealand-based foundry was the first to branch into digital type in its country, and has spent the last several years working on private commissions only. JY Alia marks its return to releasing retail fonts.</p>
    <p>Initially in four variants only, with extra weights, more complex OpenType versions and a second subfamily to emerge in 2009, JY Alia is described by its designer, Jack Yan, as a workhorse serif typeface, based on an aldine model.</p>
    <p>It is meant to complement his 1994–5 release, JY Ætna, which was based around the original Bembo design. JY Ætna was a successful family for the foundry and helped establish its reputation as a source of dependable, traditional designs.</p>
    <p>‘The problem with JY Ætna, as I saw it, was that it wasn’t robust enough for text usage,’ says Mr Yan.</p>
    <p>He sees JY Alia, which is stronger but still approachable as a design, as an alternative for other workhorse typeface families such as Adobe Garamond or Monotype Bembo.</p>
    <p>In technical aspects, JY Alia has between 3,200 and 3,300 kerning pairs and a full complement of eastern European and extended Latin characters in its OpenType and TrueType versions.</p>
    <p>Mr Yan cites both his own JY Ætna, based on designs by Francesco Griffo and Giovantonio Tagliente, and Plantin, by Robert Granjon, as his inspirations. However, he says JY Alia does not slavishly follow any historical model and merely has an aldine skeleton.</p>
    <p>The name originates from a role once played by American actress Alicia Witt.</p>
    <p>A PDF specimen for JY Alia can be downloaded from the JY&amp;A Fonts website, currently being revamped, at <a class="freelinking external" href="http://jyanet.com/fonts/font145.htm">http://jyanet.com/fonts/font145.htm</a>. </p><div class="imageWrap"><img src="http://typophile.com/files/alia-homepage_6107.gif"></div><p></p>
