    html: "<p> &gt; why do you not like the lc \"a\"? <br> <br>I guess because it's like a politician: some parts are firm, but mostly the elements blend together too congenially. And that bulb... like carrion. <br> <br>What's interesting is how many people have a certain dislike for Stone (I mean the font - the person himself is highly respected, and rightly so). Maybe it gets attention for being a \"superfamily\", but in fact there's some deep flaw that manifests in different ways in each component. Dunno. And maybe it's a problem with the whole \"Adobe school of design\" - a lot of their \"a\"s are sickly. <br> <br>&gt; should these letterforms be given due process or this more like a kangaroo court? <br> <br>If Typophile had any kind of \"legislative\" power at all, I myself wouldn't be here. Instead, it is something actually useful: a place where people can say what's on their mind, instead of playing politics (even though sometimes it seems to have to be done anonymously). Criticism leads to progress, as uncomfortable as it usually is. <br> <br>hhp </p>"
