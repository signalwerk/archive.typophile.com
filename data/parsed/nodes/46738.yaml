    <p>This is for a comedy duo that does primarily radio scetches but also some minor tv work.</p>
    <p>Right now I'm down to these two versions.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pleppo_v1_5825.jpg"></div><p></p>
    <p>The first one is an old tv/robot that refers to the fact that they are into media. The second one is some kind of robot toy with it's brains showing. This is the idea that they suggested in our first meeting, that they wanted something with a wind-up brain. I have the wind-up key in both version to suggested screwed up or screwed ideas, their show contains very random humour and is relatively extrem, that's also why I have the pink/brown colour scheme.</p>
    <p>I'm concerned about the brain on the second one. I think that people might not get that it is a brain.</p>
    <p>If you have any opinions, good or bad, feel free to comment.</p>
    <p>peter</p>
