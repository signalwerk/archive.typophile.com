      <p><em>Courtney:</em> Thanks. On the site you can find it in the loading bar(s), on the wall above the tv and at the end of some of the video clips. The logo will also be on the t-shirts and other products when the Shop opens.</p>
      <p><em>Therese:</em> This is what they wanted. The name Pleppo is also very well known among it's target audience and dosen't need that much logo or name branding. There are several commercial campaings going on that promote the site though. The site itself dosen't need to show the name or logo as freaquent as other sites usually do, it's not directly an ordinary company.</p>
