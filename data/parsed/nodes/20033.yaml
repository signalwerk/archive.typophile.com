    html: |-
      <p>Sorry, didn't mean to be flippant. Here's the easy option explained:</p>
      <p>First make your font.  :)</p>
      <p>Then go into the Font Info, under "Hinting Settings." On the main panel, click the green diamond to get the automatically calculated alignment zones. Then on the "Standard Stems" panel, click the green diamond to automatically calculate standard stems. Then come back out to the font and select all, and auto-hint the font (either using FontLab's existing auto-hinting, with the F7 key, or using the new plug-in when it's available).</p>
      <p>Not too tough, eh wot?</p>
      <p>Now, it is still worth learning about hinting, but you don't have to know much about it to make use of it. However, for hinting to work well, you do have to understand enough about type design to have actually used overshoot, etc.</p>
      <p>Regards,</p>
      <p>T</p>
