      <p>Pro: This is the auto-hinter Adobe has used for close to two decades now, which we believe is the best auto-hinter available for PostScript style outlines.</p>
      <p>Essentially, this is the crown jewels of Adobe font production.</p>
      <p>When you have this available to you in a font editor like FontLab, you'll have the option of further tweaking the hints to your heart's content. It's not like you're stuck with the results.</p>
      <p>Cons: None that I can think of.</p>
      <p>Cheers,</p>
      <p>T</p>
