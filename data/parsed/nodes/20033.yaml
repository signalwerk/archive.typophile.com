      <p>For the first point, do you mean that you want to have multiple possible input names, all of which would yield the same possible output glyph name? What would the FDK do in the case of a collision?</p>
      <p>As for the second point, we definitely aren't supporting more than one Unicode for a single glyph. Although such double-mapping is permitted by the OpenType spec, we don't like it because it breaks the reliability of glyph-to-character mapping, as is sometimes necessary in PDF based workflows.</p>
      <p>Regards,</p>
      <p>T</p>
