      <p>Hello Migel,</p>
      <p>yes, the german thing is specific. In general I think most of these double assignment scenarios are very specific. In most cases no real alphabetic or "word building" glyphs are involved, but accents, punctuation, numbers or signs could be. Typically these things will not be searched. </p>
      <p>but you ask for samples: (please feel free to post better ones)</p>
      <p>hypen 002D, hypentwo 2010<br>
      blackstar 2605, star operator 22C6<br>
      slash 002F, big solidus 29F8 (depents on the slash design) </p>
      <p>If I understand some comments about the CFF compression right, it has its limits if the outline data is reaching a high volume or complexity.</p>
      <p>I see the point with the Acrobat compatibility issue, but if someone wants a "proper" PDF for a special long term archive, he should use special or standard clean Adobe fonts too. I don't see the point to restrict it for every possible font development. </p>
      <p>If the pdf creator stores the double, tripple assigments too, it should be possible to search these glyphs in a proper way. One step forward is to store language specific warpers/tags around the text elements. </p>
      <p>example scenario: </p>
      <p>Someone use a tripple mapping for a real alphabetic glyph like B for latin, greek and cyrillic. So, if the search string is given in an unicode enviroment, its always possible to match the right glyph or string, since all unicode assigments are stored. Language specific warpers will help to filter possible "false" strings from other languages.</p>
