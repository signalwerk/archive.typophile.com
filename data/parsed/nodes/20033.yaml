    html: |-
      <p>Hello Thomas,</p>
      <p>example for the big letter germandbls:</p>
      <p>at the moment I use</p>
      <p>Germandbls	Germandbls	uniEA8A</p>
      <p>Adam means, Germandbls is logical from the human perspektiv but not for the current implementation since its not official. So he suggest to use  germandbls.cap.</p>
      <p>So I like to add both names. Maybe in a form like this:</p>
      <p>Germandbls	Germandbls	uniEA8A	      germandlbs.cap</p>
      <p>ps. In this case I remember to update the Adobe Type engine, not to exchange "hard coded" germandbls bei SS since this is no hard rule for every case and can pruduce invalid names and documents. The feature code should have priority and should not be ignored like the current implementation in InDesign CS and CS2. </p>
      <p>The thing with double assignments:<br>
      If I remember right, the current FontLab will apply such double codepoints to some glyphs.</p>
      <p>And why not? If a glyph have exactly the same outline, spacing and positioning but shares two or more different codepoints, its good to assign all these codepoints to a single glyph. Some kind of "compression". </p>
      <p>The problem I see is, if one codepoint is included in feature or kerning code only and an other one uses a different code. In these cases the FDK should report an error and suggest a codepoint splitting.<br>
      - The same for shared names.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
