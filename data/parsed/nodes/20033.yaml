      <p>BTW, I have just uploaded slightly revised versions of the .NAM files to:<br>
      <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=6147" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=6147">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
      <p>The archive contains updated .NAM (glyphname-to-Unicode) mapping files for FontLab Studio 5 (and some other of our applications that use these files). </p>
      <p>After unpacking these files, please place them on Mac into /Library/Application Support/FontLab/Mapping and on Windows into C:\Program Files\Common Files\FontLab\Mapping . </p>
      <p>(Note: Instead doing this, you may also place them into the Mapping folder specified under Options/Preferences / General Options / Folders and paths / Files used by all FontLab products. In this case, the original files that came with your FontLab product will be retained for backup purposes. Please remember that you should place all your user-modified files into this location.)</p>
      <p>These files incorporate Adobe Systems’ recent changes to their Adobe Glyph List for New Fonts: the mapping of the “problematic” characters Delta, Omega and mu was changed. The “AGLFN 1.4 (old) strict” table retains the previous mappings (to the "mathematical" codepoints), the “AGLFN 1.6 (new) strict” table includes only the current mappings (to the "Greek" codepoints), while the “Standard Table” now double-encodes the glyphs to map them into both the "mathematical" and the "Greek" slots. The “Standard without afiiXXXXX” table uses uniXXXX names instead of afiiXXXXX names – both sorts of names are valid. </p>
      <p>The versions of the files provided here are newer than those included in FontLab Studio 5.0.2. We are making them available for convenience until FontLab Studio 5.0.3 is released. </p>
      <p>You can download the archive from:<br>
      <a href="http://www.msnusers.com/fontlab/msgattachments/163" title="http://www.msnusers.com/fontlab/msgattachments/163">http://www.msnusers.com/fontlab/msgattachments/163</a></p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
    html_clean: |-
      <p>BTW, I have just uploaded slightly revised versions of the .NAM files to:<br>
      <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=6147" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=6147" class="link-external">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
      <p>The archive contains updated .NAM (glyphname-to-Unicode) mapping files for FontLab Studio 5 (and some other of our applications that use these files). </p>
      <p>After unpacking these files, please place them on Mac into /Library/Application Support/FontLab/Mapping and on Windows into C:\Program Files\Common Files\FontLab\Mapping . </p>
      <p>(Note: Instead doing this, you may also place them into the Mapping folder specified under Options/Preferences / General Options / Folders and paths / Files used by all FontLab products. In this case, the original files that came with your FontLab product will be retained for backup purposes. Please remember that you should place all your user-modified files into this location.)</p>
      <p>These files incorporate Adobe Systems’ recent changes to their Adobe Glyph List for New Fonts: the mapping of the “problematic” characters Delta, Omega and mu was changed. The “AGLFN 1.4 (old) strict” table retains the previous mappings (to the "mathematical" codepoints), the “AGLFN 1.6 (new) strict” table includes only the current mappings (to the "Greek" codepoints), while the “Standard Table” now double-encodes the glyphs to map them into both the "mathematical" and the "Greek" slots. The “Standard without afiiXXXXX” table uses uniXXXX names instead of afiiXXXXX names – both sorts of names are valid. </p>
      <p>The versions of the files provided here are newer than those included in FontLab Studio 5.0.2. We are making them available for convenience until FontLab Studio 5.0.3 is released. </p>
      <p>You can download the archive from:<br>
      <a href="http://www.msnusers.com/fontlab/msgattachments/163" title="http://www.msnusers.com/fontlab/msgattachments/163" class="link-external">http://www.msnusers.com/fontlab/msgattachments/163</a></p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
