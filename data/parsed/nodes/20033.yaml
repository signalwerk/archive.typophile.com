      <p>Andreas,</p>
      <p>The germandbls example you gave is very specific, and has other implications. (We actually have discussed this issue internally). Could you give another example?</p>
      <p>&gt; <em>The thing with double assignments: [...] And why not?</em></p>
      <p>As Thomas said, the OTF spec permits double-mapping (a given glyph is mapped to more than one Unicode value), but that makes it hard for Acrobat to reverse map from Unicode encodings to character codes, for searching.</p>
      <p>&gt; <em>If a glyph have exactly the same outline, spacing and positioning but shares two or more different codepoints, its good to assign all these codepoints to a single glyph. Some kind of “compression”.</em></p>
      <p>An OpenType <a href="/wiki/CFF" class="freelinking" rel="nofollow">CFF</a> (Compact Font Format) font will have the "compression" you're looking for. It's called <a href="/wiki/Subroutinization" class="freelinking" rel="nofollow">Subroutinization</a>: process by which common elements in a set of glyphs are decomposed in separate subroutines.</p>
      <p>&gt; <em>The problem I see is, if one codepoint is included in feature or kerning code only and an other one uses a different code. In these cases the FDK should report an error and suggest a codepoint splitting.</em></p>
      <p>I don't get it. Does this mean that, for example, you wouldn't put the two Delta (U+0394 and U+2206) in the same kerning class? I might be missing something, but the only reason that would stop me for putting them in the same class, would be if the glyphs' designs were different.</p>
