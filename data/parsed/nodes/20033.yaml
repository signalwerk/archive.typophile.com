      <p>Andreas, </p>
      <p>you can only decompile and recompile a specific table, e.g. </p>
      <p>ttx -t cmap yourfont.otf</p>
      <p>will produce a file "yourfont.ttx" with only the cmap table. You can edit it, rename to "yourfont2.ttx" and merge into your .otf using </p>
      <p>ttx -m yourfont.otf yourfont2.ttx</p>
      <p>The result will be a font yourfont2.otf which will contain the new cmap and the rest of the tables will be identical to those in the original yourfont.otf. </p>
      <p>In fact, in most cases, you can use one and the same cmap-only .ttx file for the entire family (so you dump and edit once, and then merge it into all fonts in your family that have the same glyphset). </p>
      <p>In FontLab Studio 5.0.2, standard.nam (Standard Table) has double-mappings for mu, Delta and Omega, while the AGLFN 1.6 (new) strict table only has the new AGLFN 1.6-compatible assignments. It is explained in the 5.0.2 announcement:<br>
      <a href="http://fontlab.com/The-News/Announcements/FontLab-Studio-5.0.2/" title="http://fontlab.com/The-News/Announcements/FontLab-Studio-5.0.2/">http://fontlab.com/The-News/Announcements/FontLab-Studio-5.0.2/</a><br>
      as well as in the .nam files themselves. </p>
      <p>Adam</p>
      <p>A.</p>
