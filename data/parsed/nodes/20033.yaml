    html: |-
      <p>The fdk is out now, maybe we should open a new thread.</p>
      <p>And now my biigest concern. How to setup usWinAscent and usWinDescent to provide the same line spacing between font families and between different version of the same font (Std, Pro)? </p>
      <p>I hope this is possible by adding it simply to the OS/2 table.</p>
      <p>table OS/2 {<br>
             TypoAscender 765;<br>
             TypoDescender -235;<br>
             TypoLineGap 250;<br>
      #      usWinAscent 900;<br>
      #      usWinDescent -350;<br>
      } OS/2;</p>
      <p>But its not working, why?</p>
      <p>Since the old .fpr project file format has changed it would be very usefull to provide us with an example file. Ok, the makeotf.py generates it.</p>
      <p>I have some guru meditations on windows. </p>
      <p>1. the mystery of -nr</p>
      <p>If I use a project file I got lots of the time: [FATAL] unrecognized option (-nr)</p>
      <p>But I never used such an option. Is this relateded to unix ascii line breaks? </p>
      <p>2. no relative paths under windows?</p>
      <p>The makeotf don't accepts relative paths if its called without *.fpr file. But with it, it works with relative paths. - Then cames the mysterious -nr error into play.</p>
      <p>3. This message on a test font without feature code. </p>
      <p>makeotfexe.exe [NOTE]  There are -12851 instances of the deprecated "except" syntax in the feature file. Though such statements are processed correctly by this parser for backward compatibility, please update them to the newer "i gnore substitute" syntax. For example, change "except a @LET sub a by a.end;" to  "ignore sub a @LET; sub a' by a.end;". (Note that the second rule is now required to be marked to identify it as a Chain Contextual and not a Single Substituti<br>
      on rule.)</p>
      <p>Conclusion:</p>
      <p>Working with *.fpr files seems to work not properly under windows. So I have to wirte good old *.bat files.  </p>
      <p>I have the feeling you used these scripts exclusivly under unix/OSX. </p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
