      <p>Thomas, </p>
      <p>Note that FontLab Studio will automatically compute the stems only when you already have hints in the font. So actually, the process is the other way around: </p>
      <p>1. Select all glyphs in the Font Window.<br>
      2. Hit F7 to autohint all the glyphs (or choose Tools / Hints and Guides / Autohinting).<br>
      3. Go to Font Info / Hinting settings, click on Auto zones and then in Standard stems on Auto stems. </p>
      <p>That's it. </p>
      <p>Best,<br>
      Adam</p>
