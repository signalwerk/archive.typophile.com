    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Fovea</strong></p>
    <p>The fovea is the central two degrees of vision in which information is processed during a <a href="/node/39290" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fixation</a>. </p>
    <p>The parafovea is the five degrees of vision either side of the fovea, and the peripheral is the remaining vision either side of the parafovea. The majority of the information processed is done so in the fovea. Only low level information is able to be garnered by the parafovea and the&nbsp;peripheral.</p>
