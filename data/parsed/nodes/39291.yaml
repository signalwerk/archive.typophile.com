    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Fovea</strong></p>
    <p>The fovea is the central two degrees of vision in which information is processed during a <a href="/wiki/fixation" class="freelinking" rel="nofollow">fixation</a>. </p>
    <p>The parafovea is the five degrees of vision either side of the fovea, and the peripheral is the remaining vision either side of the parafovea. The majority of the information processed is done so in the fovea. Only low level information is able to be garnered by the parafovea and the peripheral.</p>
