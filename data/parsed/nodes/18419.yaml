    html: |-
      <p>You could always do a find and replace after you have finished setting the book.</p>
      <p>You could use all smallcaps and a lowercase s or all caps and a lowercase s or smallcaps with initial caps and a lowercase s. I would lean toward the first. I’ve had to do similar things and using find and replace with case sensitivity on works like a charm.</p>
