    html: <p>Well, you probably don't care any more, Rob, but I know that the forum <br>participants are gnashing their teeth, desirous of knowing the identity <br>of that grungy script. Or maybe not ... <br> <br>It seems to have begun its life as a version of a typeface that appears <br>in the Solotype Catalog as Chopin. Dieter Steffmann digitized it as <br><a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/c/chopin.htm" target="_blank"> Chopin Script</a>. Here's <a href="http://www.dafont.com/en/search.php?nb_ppp=40&amp;texte=News&amp;nq=1&amp;q=chopin" target="_blank"> another</a> Chopin Script by a 'Diogenes'. And you <br>can also find it as <a href="http://members.dca.net/pheanix/msie/c5.htm" target="_blank"> Chase Callas</a> by the defunct Soft Horizons. <br> <br>One of these, or yet another version, seems to have begat <a href="http://www.dafont.com/en/search.php?nb_ppp=40&amp;texte=News&amp;nq=1&amp;q=radagund" target="_blank"> Radagund</a>, <br> which I believe to be the font used. <br><br> <br></p>
    html_clean: <p>Well, you probably don't care any more, Rob, but I know that the forum <br>participants are gnashing their teeth, desirous of knowing the identity <br>of that grungy script. Or maybe not ... <br> <br>It seems to have begun its life as a version of a typeface that appears <br>in the Solotype Catalog as Chopin. Dieter Steffmann digitized it as <br><a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/c/chopin.htm" target="_blank" class="link-external"> Chopin Script</a>. Here's <a href="http://www.dafont.com/en/search.php?nb_ppp=40&amp;texte=News&amp;nq=1&amp;q=chopin" target="_blank" class="link-external"> another</a> Chopin Script by a 'Diogenes'. And you <br>can also find it as <a href="http://members.dca.net/pheanix/msie/c5.htm" target="_blank" class="link-external"> Chase Callas</a> by the defunct Soft Horizons. <br> <br>One of these, or yet another version, seems to have begat <a href="http://www.dafont.com/en/search.php?nb_ppp=40&amp;texte=News&amp;nq=1&amp;q=radagund" target="_blank" class="link-external"> Radagund</a>, <br> which I believe to be the font used. <br><br> <br></p>
