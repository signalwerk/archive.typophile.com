      <p>I don’t think there is much resemblance between the two logos, except that they are both techno styles. Caltrans probably had theirs designed for them, the other outreach group probably used a freeware font for theirs. See the Techno categories at Dafont.com for possible styles that may be close enough to the Caltrans look.</p>
      <p>- Mike Yanega</p>
