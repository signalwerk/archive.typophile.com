  html: |-
    <p>I am trying to create a shirt based around the Caltrans logo. However, I cannot seem to find the typeface for the word “Caltrans” in the logo itself. Can anyone help me or is this just a custom script made specifically for the logo. I seem to recall that there is a community outreach program in the Tenderloin in SF (can’t remember the actualy name) but they have a logo that riffs off the Caltrans logo and they have the same script. Please help!</p><div class="imageWrap"><img src="/files/caltrains_typeface_5216.jpg"></div><p></p>
    <p>EDIT: It’s CityTeam Ministries! <a href="http://www.cityteam.org/" title="http://www.cityteam.org/">http://www.cityteam.org/</a></p>
