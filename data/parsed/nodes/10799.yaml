    html: "<p>I'll give it a try.. got the final interview at the artschool coming up next thursday.. <br> <br>Moloko is milk in russian, yep! Actually most of the Nadsat street language in A Clockwork Orange is based on Russian words.. <br> <br>I'm also working on another font at the moment.. <br>But it's all over the place still.. All comments are welcome.. (is it any good at all? i.e. worth showing at my interview?) <br> <br>Here's a screenshot: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/8947.gif\" alt=\"coyle\"></p>"
