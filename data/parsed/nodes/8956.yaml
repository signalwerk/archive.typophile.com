    html: "<p>Hi Cheryl, I profusely apologize for my seemingly kneejerk reaction, as it appears to have come across a lot ruder than I intended it to be. I did use to have a very unpleasant online personality, but I really try hard to better my life. Let's just say that I sometimes tend to forget that the absence of facial expression and tone of voice creates confusion quite often. Furthermore I didn't have a clue that you were a student/novice, so my first impression was that of someone coming into a jeweller's convention asking how/where they could steal some jewelry. Again, I'm very sorry, and your comments hurt my feelings probably as much as my comment hurt yours. Point taken. <br> <br>Back on topic: besides the tips offered by Messrs. Nolan and Earls, may I be so bald (!) to point you to <a href=\"http://www.fontlover.com/\"> Fontlover!.com</a> which links to a large number of websites which offer freeware/shareware fonts. Some of them are crap, some of them are quite good, not all of them have full character sets, but hey: they're free. I personally have extensively researched these sites and can guarantee you it <i>will</i> be worth your while. <br> <br>PS THX Hrant. It seems this time I was the \"grumpy old uncle\"... I'll never ever make that remark again. ;)</p>"
