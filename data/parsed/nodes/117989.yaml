      <p>Susana, I'm afraid that "old" doesn't help much. 3 years old? 30? 130?</p>
      <p>As an aside, does anyone know of a decent search engine that <em>only</em> returns hits for <em>exactly</em> what you've typed. The common search engines now are converting my search for SOGIEDAD ALCOLERA (Catalonian?) into SOCIEDAD ALCOHOLIKA (grrrr ...). It used to be that you could put your query into parenthesis and only get exact hits. Now they try to guess what you <em>really</em> wanted ... and are often wrong.</p>
