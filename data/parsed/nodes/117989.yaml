      <p>Good digging John! OK I have done what I can to clean up the original specimen and put it together with a cleaned up excerpt from your link<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CompareSM_3421.jpg"></div><br>
      I'm not certain what to make of it.<br>
      Your photo seems to date from 1909, which is very consistent with the style of lettering.<br>
      The ID request lettering is somewhat similar, at least for _A_, so it could perhaps be from the same era.<br>
      It would be possible to try re-lettering the ID request in this style, with the addition of the flourishes for _S_, _G_, _A_, and _C_, but I definitely see no matching font. Except for the _G_ mentioned in my previous post.<br>
      Don<p></p>
