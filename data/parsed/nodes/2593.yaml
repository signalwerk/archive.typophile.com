    html: <p>Hi Daniel. <br> <br>I don't want to make any assumptions about your intentions or goals for this project. I've often said to <br>myself, "Wow! What a font! I wonder if I could make something similar." That's ok as a learning <br>experience. Extremely valuable in fact. One suggestion you might take from this is to disclose your <br>intent and any sources when you introduce the project. Not only does it save Frank the hernia, but we <br>can also better critique and assist you. <br> <br>Stick around at Typophile. You are obviously a lover of type, and more than welcome. Chalk this one <br>up to experience. I look forward to seeing your next contribution to the critique section. <br> <br>Randy</p>
