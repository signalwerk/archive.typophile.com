    html: '<p>Hi everybody, <br> <br>in the summer of 2003 after months of construction and kearning i finished my typefamily "Nuri" which became a huge sucess and was published in a few int. webzines and the german "page" magazine. Here Daniel Günther saw my type and even voted it in this forum for the best new typefaces of 2003: <br><a href="http://www.typophile.com/forums/messages/30/22342.html" target="_blank">http://www.typophile.com/forums/messages/30/22342.html</a> <br> <br> The more i was suprised reading this thread about a new type designed by Daniel Günther which he acclaims to be his idea of a new sans serif. For my eyes its just a copy cat example par exellence. Sure, there are a few modifications but the overall idea is fully copied. <br> <br>Why is somebody wasting his time instead of  working on his own originality and ideas for stuff like that? Maybe somebody here has the answer. But most of all <br>i</p>'
