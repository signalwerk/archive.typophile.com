    html: <p>Thank you guys, that are some very good hints. I also think that the caps are too big and too strong. At the moment they are as high as the ascenders of the LC. I'll fix that. I'm not sure about the "e" i like as it is, but i try out what you suggested. <br> <br>I'll post a new image when its done, but feel free to post more suggestions. <br> <br>Thanks</p>
