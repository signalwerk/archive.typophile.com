    html: "<p>Daniel: There are a lot of things I like about this font. My first reaction was that it would make an interesting mono spaced font. The characters are very boxy, and have the appearance of being modular. <br> <br>Overall, very nice. Things I would tweak: 1) the letter \"e\" seems awkward. It appears as if it could fall forward at any second. 2) the \"W\" seems too wide. 3) the tail on the \"y\" doesn't thrill me. 4) certain letters look \"weightier\" than others...although that could just be the screen. </p>"
    html_clean: "<p>Daniel: There are a lot of things I like about this font. My first reaction was that it would make an interesting mono spaced font. The characters are very boxy, and have the appearance of being modular. <br> <br>Overall, very nice. Things I would tweak: 1) the letter \"e\" seems awkward. It appears as if it could fall forward at any second. 2) the \"W\" seems too wide. 3) the tail on the \"y\" doesn't thrill me. 4) certain letters look \"weightier\" than others...although that could just be the screen. </p>"
  - id: 20811
    user: 1250
    date: 2004-01-06T07:18:00
    date_raw: 6 Jan 2004 — 7:18am
    votes: null
    html: "<p>This is a bit trendy, but attractive nonetheless. <br> <br>Some things: <br>- The caps are too big. <br>- The vertical proportions of the lc are good. <br>- I'd give the \"e\" a smaller eye. <br>- The dots of \"i\"/\"j\" are too small (and too low). <br>- I think the \"k\" could be more interesting. <br>- I'd make the \"t\" wider. <br>- The \"B\" is a bit wide. <br>- I'd give the \"I\" serifs. <br>- The \"K\" is imbalanced. <br>- The \"P\" seems to have a funny appendage... ;-) <br>- The \"Q\" needs a stronger tail. <br>- Yes, there seems to be a lot of weight imbalance. <br> <br>hhp <br></p>"
    html_clean: "<p>This is a bit trendy, but attractive nonetheless. <br> <br>Some things: <br>- The caps are too big. <br>- The vertical proportions of the lc are good. <br>- I'd give the \"e\" a smaller eye. <br>- The dots of \"i\"/\"j\" are too small (and too low). <br>- I think the \"k\" could be more interesting. <br>- I'd make the \"t\" wider. <br>- The \"B\" is a bit wide. <br>- I'd give the \"I\" serifs. <br>- The \"K\" is imbalanced. <br>- The \"P\" seems to have a funny appendage... ;-) <br>- The \"Q\" needs a stronger tail. <br>- Yes, there seems to be a lot of weight imbalance. <br> <br>hhp <br></p>"
