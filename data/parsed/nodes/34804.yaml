      <p>It looks like Bruce wanted to protect his work from being copied by the new electrotype process, which he mentions, and which his foundry was at the forefront in developing.</p>
      <p>He is making the distinction between a skilful hand-made forgery and a mechanical facsimile, recognizing that copying by hand is acceptable (like different painters rendering the same subject) because it imparts the unique personality of the copyist artist/founder--but mechanical reproduction is not.</p>
      <p>I don't expect that there would have been anything particularly unique about the samples he attached to the patent document, but perhaps the thinking was that if those types were subsequently electrotyped by a competitor, then a comparison would, in a court of law, favor Bruce.</p>
