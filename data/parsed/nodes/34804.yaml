      <p><em>I guess he’s not counting the RdR...</em></p>
      <p>Or the protection Aldus obtained, via a monopoly on printing Greek, for his new types.</p>
      <p>To clarify: no one is citing Bruce's patent as the first legal protection for typeface design. It is the first use of the particular protection of a design patent under US law.</p>
      <p>It is interesting because the fact that the first US design patent was granted for typeface design is sometimes cited in favour of the suitability of this kind of protection, against the more generous protection of copyright. But note that the justification made by Bruce in this application makes a comparison to the painting of portraits, which are of course protected by copyright, not design patent.<br>
      ___</p>
      <p>Juliet Shen, on the ATypI list, notes that a copy of the Bruce foundry catalogue is in the Thorniley Collection, and will be available to perusal by TypeCon attendees on the Sunday night excursion to the museum. It may not be possible to identify the specific types for which the patent application is made, but we can probably get a pretty good idea.</p>
