    html: |-
      <p>There's not just programming to consider, but solicitation of new faces, negotiations, contracts/license agreements, vetting each typeface, bug-testing, etc. Even small chunks of time add up, and take away from running a business and working on a zillion other bug fixes and new features that we request. I don't exactly know what goes on under the hood, but I know a ton of work goes into programming and administering every aspect of this site and it's all a labor of love that we benefit from.</p>
      <p>I've personally grown fond of Super Duty and its strength in this application, as I did Beorcana before it - I would echo Eric's sentiments. I'm not sure that I would enjoy a constantly rotating font in all the headers. I mean, I love to see different fonts, but there is a certain comfort factor in coming to Typophile and seeing a consistent look over a period of time. I like the warm fuzziness and stability of it all.</p>
      <p>Of course I look forward to being pleasantly surprised when a new typeface is introduced here, but it will be a bit of a shock to the system.</p>
      <p>I don't know what the fees for featured faces are, but the folks at Typophile have mentioned this sponsorship program in multiple threads and said interested parties should email them. So that's what I would do.</p>
