    html: |-
      <blockquote><p>Now just got find $175 :( Thats expensive!!</p></blockquote>
      <p>That's really depends on what you need exactly. If this is for commercial project and you definitely believe it is the perfect one, it's worth $175. But I understand if you only need one weight, it's a shame to have to pay for the all package (same problem with Hoefler and Frere Jones fonts). I don't know if it could work but you could try to ask gently to House Industries to sell you the weight(s) you need. You could also try to convince your client this is the One and to buy it for the project.</p>
      <blockquote><p>Don't suppose anyone has an alternative. Mmmm</p></blockquote>
      <p>Chalet is very close to Helvetica so if you have time and skills, you could try to customize it to fit your needs. You could for instance start from <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/helveticatextbook-roman" rel="nofollow">Helvetica Textbook</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-schulbuch" rel="nofollow">FF Schulbuch</a> to get a single storey /a. But still a lot of work on /t, /y... There's also <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/coolvetica" rel="nofollow">Coolvetica</a> and some freebies like <a class="freelinking external" href="http://www.dafont.com/clemente-pd.font" rel="nofollow">Clemente</a>, <a class="freelinking external" href="http://www.dafont.com/lane.font" rel="nofollow">Lane</a> or <a class="freelinking external" href="http://www.dafont.com/walkway.font" rel="nofollow">Walkway</a>. But they could never be considered as substitutes. They're simply "close to Helvetica" as Chalet.</p>
    html_clean: |-
