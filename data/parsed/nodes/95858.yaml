    html: |-
      <p>Hrant beat me to it!</p>
      <p>But I will also add Clairvaux, which I've sometimes seen called a "whiteletter."</p>
      <p>It's funny how blackletter types are called "Old English." Old English — as in the language, Anglo-Saxon — was not written in anything like a textura style, but in something closer to a half-uncial style. English was not written or printed in blackletter until the Middle English period (c.f. Caxton's Chaucer).</p>
