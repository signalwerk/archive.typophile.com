    html: <p>As the feature is common to the examples on your list, all being in the Old English vein, it finally occurs to me to wonder about the dealie in the capitals consisting of an extraneous vertical hairline connected to the letter proper by two little hairlines bowed toward each other. It is purely decorative and weirdly structural at the same time. How did it come about? Does it have a name? I never questioned it before, but now, upon examination, I can't see the sense of it. If anyone has any clues to the history of this curious artifact, I would like to hear them.</p>
