  html: <p>Hey! I was wondering exactly what I can do to a font after I buy it.. for example, if I got <a class="freelinking external" href="http://www.linotype.com/13501/bellgothicbold-font.html?PHPSESSID=206854cce463abebc6694f5d56787cc1#technical" rel="nofollow">Bell Gothic STD</a> and wanted to use <a class="freelinking external" href="http://roundingufo.typemytype.com/" rel="nofollow">roundingUFO</a> to change it, could I then use the resulting font commercially? could I sell it?</p>
  html_clean: <p>Hey! I was wondering exactly what I can do to a font after I buy it.. for example, if I got <a class="freelinking external link-external" href="http://www.linotype.com/13501/bellgothicbold-font.html?PHPSESSID=206854cce463abebc6694f5d56787cc1#technical" rel="nofollow">Bell Gothic STD</a> and wanted to use <a class="freelinking external link-external" href="http://roundingufo.typemytype.com/" rel="nofollow">roundingUFO</a> to change it, could I then use the resulting font commercially? could I sell it?</p>
