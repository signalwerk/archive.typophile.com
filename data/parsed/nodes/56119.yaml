    html: |-
      <p>For your next project you can get a digital text of "Catcher in the Rye" and use Word to find/replace Holden Caulfield's name to Colton Hallfield, then you could publish that as "Catcher in the Wry".</p>
      <p>The answer to your question is no. You don't own the intellectual property of Bell Gothic, so you don't own the results of screwing around with the outlines. The EULA may allow you to do said screwing around, but that doesn't make the underlying design or software code your property.</p>
      <p>If I came to your house and painted it a different color, could I then put it up for sale?</p>
