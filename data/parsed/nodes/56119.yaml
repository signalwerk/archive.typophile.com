      <p>Hi, Scott. Linotype doesn't allow derivatives.</p>
      <p>Section 3.2 of their EULA: "The licensee declares not to modify, adapt or translate the encoding of the Font Software, nor reproduce, decompile, disassemble, change, modify or otherwise attempt to reveal the source code of the Font Software."</p>
      <p>For that matter just read the entire <a href="http://www.linotype.com/2061-28225/licenseagreementforfontsoftwarendashlinotypeeula.html" rel="nofollow">Article 2</a>.</p>
