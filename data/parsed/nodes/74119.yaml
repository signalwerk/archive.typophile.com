    html: |-
      <p>In theory, you could find a strong Greek typeface that contrast with Zapfino.<br>
      But, for one, Zapfino tends to steal the scene from pretty much anything and, on the other hand, I don’t think that contrast is the best way to match typefaces for a wedding! ;-)</p>
      <p>One of the few swashy scripts that support Greek is Champion Script: <a href="http://new.myfonts.com/fonts/parachute/pf-champion-script-pro/" title="http://new.myfonts.com/fonts/parachute/pf-champion-script-pro/">http://new.myfonts.com/fonts/parachute/pf-champion-script-pro/</a></p>
      <p>Alternatively, you could find several less flamboyant typefaces still suitable for a wedding:<br>
      <a href="http://new.myfonts.com/search/elegant+charset%3Agrk/" title="http://new.myfonts.com/search/elegant+charset%3Agrk/">http://new.myfonts.com/search/elegant+charset%3Agrk/</a></p>
