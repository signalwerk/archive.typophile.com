      <p>It's for a birth announcement so I was thinking of using Zapfino for the name of the girl, obviously the most important element of this piece. But you would suggest a different font? I like the look and feeling of Zapfino, swashy but not too swashy, hard to explain, totally different from a font like Champion script or Bickham script.<br>
      Just discovered the combination of Zapfino (Dutch) and Rotis (Greek and Dutch) seems ok at first sight.</p>
