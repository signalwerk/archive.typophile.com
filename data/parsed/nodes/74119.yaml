    <p>Hello all,</p>
    <p>I'm having a problem and hopefully you type-wizards want to help me out...<br>
    I've been asked to design a birth announcement, the father is Dutch and the mother is Greek so the announcement should be bilingual.<br>
    I'm already using Zapfino but can't find a font that has Greek characters and matches Zapfino.</p>
    <p>Does someone have suggestions or hints how I should handle this?</p>
    <p>A big thanks in advance,<br>
    Dries</p>
