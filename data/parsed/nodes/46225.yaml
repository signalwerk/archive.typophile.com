    <div class="info">Submitted by <a href="/web/20081011043702/http://typophile.com/user/1085" title="View user profile.">dan_reynolds</a> : 9.Jun.2008 1.34am </div>
      <p></p><div class="imageWrap"><img src="/web/20081011043702im_/http://typophile.com/files/schriftmuster_5611_4191.jpg"></div><p></p>
    <p><em>spatium Magazin</em> (without an e) in Germany has <a href="https://web.archive.org/web/20081011043702/http://www.spatium-magazin.de/spatium-veroffentlicht-schriftmuster-dvd/1441.php">just released a DVD</a> containing a collection of ca. 3,000 images scanned from the pages of a myriad of 20th century German type foundry catalogs and specimen.</p>
    <p>This roundup by Hans Reichardt is the first of a series of four DVDs illustrating the diversity and beauty of type specimens and reflecting technical advances made in the printing industry during the 20th century. Included are scans of type specimen cards, brochures, and catalogs from various foundries, such as Bauer, Klingspor, Ludwig &amp; Mayer, Stempel, C. E. Weber, Berthold, Genzsch &amp; Heyse, Joh. Wagner, Flinsch, Schelter &amp; Gieseke, and many more. In addition, books like Seemann’s <em>Handbuch der Schriftarten,</em> Abraham Horodisch’s <em>Die Schrift im schönen Buch unserer Zeit,</em> and Emil Wetzig’s <em>Ausgewählte Druckschriften in Alphabeten</em> are among the DVD’s images as well.</p>
    <p>A detailed table of contents may be downloaded as a PDF: <a href="https://web.archive.org/web/20081011043702/http://www.spatium-magazin.de/wp-content/uploads/2008/05/bleisatz_d_inhalt_web.pdf">bleisatz_d_inhalt_web.pdf</a> (28 kb)</p>
    <p>All in all,<!--
