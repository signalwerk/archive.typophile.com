    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 23.Feb.2005 10.37am </div>
      <p>14/02/05 <br>Submitted by Nathalie Fallaha <br> <br>Thank you for all the support that we received throughout the email during the last few days. As you all know the country lost a major political figure. We remain to be strong and determined to continue, in the spirit of peace, to make the TYPO.GRAPHIC.BEIRUT 05 conference a successful event. <br> <br>������������������������������������������������������ This is the third issue of typo.graphic.beirut 2005 infonews. <br> <br>It contains regularly updated information on the upcoming April conference. We're counting down... Only 2 more months before the conference! ������������������������������������������������������ <br> <br>For those of you who have recently joined us, we are proud to inform you that our creative event has been sponsored by the British Council, and Linotype Library, and is endorsed by Icograda - <a href="http://www.education.icograda.net/" target="_blank">http://www.education.icograda.net/</a> <br> <br>Typo.graphic.beirut 05 is taking place on April 14th, 15th, and 16th 2005 �� ������������������������������������������������������ We have been receiving responses and contacts from all over the world! Our list today includes the following countries: <br> <br>Jordan, Portugal, Turkey, United Arab Emirates, Syria, Ireland, USA, Italy, Canada, Australia, UK, Denmark, Qatar, Saudi Arabia, Bulgaria, Tunisia, Russia, Iran, India, Czech Republic, New Zealand, Nigeria... <br> <br>We can't wait to have all of you share with us the success that Typo.graphic.beirut 2005 will have in April at LAU's Beirut Campus! ������������������������������������������������������ After receiving an exceptionally high standard of quality to our call for papers, we had to make the difficult step of selection. <br> <br>We thank all of you who had participated, and wish you the best of luck. We do hope to see all of you at the conference in April! <br> <br>:: We are pleased to announce our updated list of confirmed speakers :: <br> <br>:: KEYNOTE:: <br> <br>Reza Abedini Ken Garland Gerry Leonidas Jean Fran�ois Porchez Heinz Widmer - Buro Destruct <br> <br> :: SPEAKERS:: <br> <br>Huda Smitshuijzen Abi Fares Tarek Atrissi Stephen Banham Johannes Bergerhausen Filip Blazek Nadine Chahine Ashwini Deshpande Zantides Evripides Ben Hannam Lazlo Lelkes Zeina Maasri Peter Martin Stuart Medley Dan Reynolds Jennifer Spoon Bruno Steinert <br> <br>������������������������������������������������������ <a href="http://typographicbeirut.lau.edu.lb/" target="_blank">http://typographicbeirut.lau.edu.lb/</a> Log on to check out regularly updated information, register to our info news, workshops, and other side related events. ������������������������������������������������������ :: TRAVEL ARRANGEMENTS :: <br> <br>Please note that if you decide to book one of the hotels on the website�s list, make sure to mention in the request that you are an attendee of the Typo.graphic.beirut conference at the Lebanese American University. <br> <br>* we are putting up an updated version of our hotel listing on the website, please check it in 2 days if you are booking a hotel through us. <br> <br>** all fares listed in the attached file are available ONLY from the 11th to 17th of April 2005. <br> <br>������������������������������������������������������ :: WORKSHOPS :: <br> <br>As for the workshops, we have our list of workshops run by the following workshop leaders: <br> <br>01. Heinz Widmer - Buro Destruct 02. Reza Abedini 03. Gerry Leonidas 04. Ali Assi (calligrapher) Dr. Abdallah Kahil (lecturer) <br> <br>We are pleased to have so many applicants to the workshops, the number of interested designers is a lot more than we expected! If you have already registered, please select one according to your interest / level before February 15, 2005. *Selection will be made on a first reply basis. The final participants selection will be sent to you by email on February 18, 2005. * Please note that all workshops are taking place within the LAU Beirut Campus. <br> <br>WORKSHOP 01. &gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt; <br> <br>B�ro Destruct workshop 2005 by Heinz Widmer of B�ro Destruct <br> <br>This is a 1 day workshop based on the b�ro destruct projects LosLogos and Typedifferent. It will cover topics like �reading the city�, �form discovering�, �form development�, �font making &amp; using�. It will share the experience that the early days of BD had and how to start getting involved with forms &amp; fonts in general. <br> <br>15-20 students  <br> <br>date April 14, 2005 time 9:00 - 12:00 and 2:00 - 6:00 place Nicol 533 computer lab <br> <br> WORKSHOP 02. &gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt; <br> <br>Advanced typography in serial publications by Gerry Leonidas, Programme Director, MA Typeface Design University of Reading <br> <br>This is a 2-day workshop that will focus on matters surrounding typographic specification and its implementation in a controlled, documented environment. Participants will work with a choice of given source texts, and are expected to work on designing a series of documents: clarify a brief, develop and test a solution, formulate a specification, and document its implementation. <br> <br>15 students  <br> <br>date April 14-15, 2005 time April 14, 2005 9:00 - 12:00 and 2:00 - 6:00 April 15, 2005 9:00 - 12:00 and 2:00 - 5:00 place Nicol 309 and Nicol 310 <br> <br>WORKSHOP 03. &gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt; <br> <br>Book Design by Reza Abedini <br> <br>This is a 2-day workshop, every two students should choose an Arab poet and write a brief biographical text. They must first read the text for the other students and then introduce the poem they have chosen. We'll work on the poem book but will emphasize on typography. The students can use images as well. <br> <br>20 students *students level ] junior level and participants should know a little bit of Arabic <br> <br>date April 15-16, 2005 time April 15, 2005 11:00 - 12:30 and 2:00 - 6:00 April 16, 2005 9:00 - 12:00 and 2:00 - 6:00 place TBA <br> <br> WORKSHOP 04. &gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt; <br> <br>Arabic Calligraphy by Ali Assi, calligrapher and Dr. Abdallah Kahil, lecturer  <br> <br>This 2-day workshop consists of four sessions in two days. The demonstrations and supervision of participants exercises will be given and conducted by the eminent Lebanese calligrapher Ali Assi. <br> <br>Day One Morning Session <br> <br>- An illustrated lecture about the history and various functions of Arabic calligraphy - A demonstration about the tools and materials of the calligrapher - Presentation of the Arabic Alphabet, its formal categories and subdivisions, such as vertical and horizontal letters, and connectable and uncontestable letters <br> <br>Afternoon Session -Rules of the naskh script, and its writing methods Visual presentation and participants exercises <br> <br>Day Two Morning session - Writing various Arabic scripts, including thuluth, diwani, ruqa`, kufic etc - Continuation of participants exercises in writing individual and connected letters, forming words <br> <br>Afternoon session - Function of calligraphy as an independent art, and as an element in graphic design. - Demonstration and exercises <br> <br>20 students *students level: preferably Arabic speaking <br> <br>date April 14-15, 2005 time April 14, 2005 9:00 - 12:00 and 2:00 - 6:00 April 15, 2005 9:00 - 12:00 and 2:00 - 6:00 place TBA  <br> <br> ������������������������������������������������������ * please note that an individual may only sign up for 1 workshop - and must fullfill the pre-requisites if need be. <br> <br>** we have already over 130 registered people for the workshops! <br> <br>������������������������������������������������������ LAU Contact Information Beirut Campus P.O. Box 13-5053 Chouran Beirut: 1102 2801 Lebanon Tel.: +961 1 786456 / 786464 / +961 3 791314 Fax: +961 1 867098 ������������������������������������������������������ email: <a href="mailto:http://typo.graphic.beirut@lau.edu.lb">typo.graphic.beirut@lau.edu.lb</a> website: <a href="http://typographicbeirut.lau.edu.lb/" target="_blank">http://typographicbeirut.lau.edu.lb/</a></p>
