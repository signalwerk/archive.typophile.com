      <p>Eben, drop a line to Kent or Tiff - they know a lot about what’s in the WAD archives at BPL. Paul Shaw knows those archives like the back of his hand, but I believe he is in Europe right now and might be difficult to get in touch with. I am personally in love with his marionettes. Make sure you spend time in that room, which also contains other items from his study. Very cool. Ask for permission to take photographs. Their stated policy forbids photography, but they give permission on a case-by-case basis. I believe no flashes are allowed in the marionette room and the lighting is not ideal, but you should still be able to get great shots with your fancy gear.</p>
      <p>Roberta Zonghi used to be the contact there, but I am not sure that she is still i</p>
