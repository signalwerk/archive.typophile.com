    <p>I am going to check out the W A Dwiggins Collection in the Boston Public Library tomorrow - and maybe again the next day. </p>
    <p>Does anybody have any BPL/Dwiggins related advice for me? </p>
    <p>I am also going to go visit the Printing Museum while I am here.</p>
    <p>Come to think of it any comments about Typographic research/tourism for the Northeast and Boston in particular you might have are also more than welcome!</p>
    <p>Feel feel to write me offline if you prefer.</p>
    <p>Thanks!</p>
