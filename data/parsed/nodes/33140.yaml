  html: |-
    <p>I’m in the process of buying a boat! And, small-boy excitement aside, I’m thinking about how to set the name. I think i want a traditional no-nonsense sans serif, and hoped fellow typophiles might have some ideas or know of suitable boat lettering source materials (books, photos etc) </p>
    <p>many thanks</p>
    <p>Ed</p>
