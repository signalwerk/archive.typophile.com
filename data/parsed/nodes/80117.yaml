  - id: 456124
    user: 6470
    date: 2011-03-17T08:26:00
    date_raw: 17 Mar 2011 — 8:26am
    votes: null
    html: "<p>I usually switch to INDEX mode, Select ALL, Sort by Unicode, then switch back to CHARMAP Mode. Another thing you should check: Under <strong>Font Info &gt; Supported codepages and default character set</strong>, make sure that the Microsoft­®­­­ Character Set option DOESN'T say <strong>Symbol</strong>. Sometimes, FL gets confused and assigns Symbol encoding on its own, which will seriously mess up how characters are displayed in a finished font.</p>"
  - id: 456169
    user: 4563
    date: 2011-03-17T16:11:00
    date_raw: 17 Mar 2011 — 4:11pm
    votes: null
    html: |-
      <p>I think clearing the cache has solved it, thank you, it was driving me insane. Also I turned on glyph reordering to auto under preferences panel. This gives me a warning about the kerning table which I'm curious to know how to export it with the OT kerning and the glyph order ok.</p>
      <p>Thanks<br>
      Rodrigo</p>
