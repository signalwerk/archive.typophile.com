    <p>Hi,<br>
    My font was exporting with a weird order so I tried to reorder first using sort glyphs then using index mode.<br>
    After saving my encoding, I exported my font and now when I type "A" another symbol comes up. This with every glyph in the font.<br>
    Any thoughts on how to fix it?<br>
    Thanks!<br>
    Rodrigo</p>
