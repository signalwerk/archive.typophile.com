      <p>Those serif shapes are conducive to engrave by “line and ﬁll”, not so suitable for punch cutting.</p>
      <p>Intaglio printing also holds a ﬁner line than letterpress—there is no equivalent of the beard to pick up ink and print, as can be seen here:<br><img src="/sites/default/files/old-images/A_foot_5751.jpg"></p>
      <p>These arguments support the idea that letterpress was playing catch-up with engraving in the ﬁnesse department, for a long time, and also assuming its style.</p>
