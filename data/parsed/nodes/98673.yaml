      <p>His roman and italics originating in the mid-1750s and cut at various sizes thereafter. They were regarded as innovative immediately, with both negative and positive connotations. John (Quadibloc) has referred to the claims of some -- famously related by Ben Franklin -- that Baskerville's types dazzled readers and would make them go blind. But by 1803 positive commentary celebrated Baskerville's achievement:</p>
      <blockquote><p>The extraordinary efforts which have of late years been made to produce the finest models of Printing Types, must be highly gratifying to those who have in any measure interested themselves in raising the credit of the BRITISH PRESS. The spirit for this species of beauty has long been gaining ascendancy, having received a strong impulse from the talents of Baskerville, who endeavoured to combine sharpness and perfection of impression, with graceful types, giving to his works a finish which was before unknown in this kingdom.</p></blockquote>
      <p>[John McCreery, <em>The press, a poem</em> (Liverpool, 1803), quoted in Justin Howes' seminar discussion paper, published in <em>Typography Papers 7.</em>]</p>
