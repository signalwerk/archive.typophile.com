      <p>Felici’s great man theory is skewed.</p>
      <p>In the ﬁrst place, not just paper, but ink and metal were improved considerably in the 18th century.</p>
      <p>Secondly, technological determinism won’t wash, when there were other cultural factors at play. As John Hudson has noted, the role of the writing masters (and perhaps pen technology?) was important. </p>
      <p>The idea that Baskerville’s type was the game-changer in enabling the neoclassical Didone style is a myth. The Foulis publishers in Scotland were producing neo-classical types and typography, in the context of printing classical literature (from ancient Greece and Rome), prior to Baskerville’s work.</p>
      <p>I am sure there were other dynamics in France and Germany which contributed to the emergence of the didone style. Certainly, one man can make a huge difference, but design happens when there is a convergence of possibilities in the broad ecology of culture.</p>
