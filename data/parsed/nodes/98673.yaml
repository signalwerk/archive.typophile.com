      <p>It is true that a type like Baskerville would not have worked without high quality printing. And Baskerville played an important role in making printing of this higher quality available.</p>
      <p>But on the other hand, the improvement in the basic capability of printing things with finer detail on paper would have taken place without Baskerville as technology progressed; that's true too.</p>
      <p>But without Baskerville pointing the way, perhaps the revolution in printing would have taken place too late for Didot and Bodoni.</p>
      <p>Still, wouldn't Didones - like slab-serifs, Clarendons, and Latins (wedge-serifs) - have been almost "inevitable", rather than being easily subject to butterfly-effect erasure? I'm not sure psychohistory has progressed to the level which would allow us to answer such questions.</p>
