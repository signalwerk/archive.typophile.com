      <p><em>Changes in printing and prepress technology often spawn changes in the design aesthetic.</em></p>
      <p>In this case, I think the clear evidence is that it was the other way round: the aesthetic development drove changes in papermaking and printing technology. The neoclassical aesthetic that Baskerville applied to typography with such great success by way of his fine presswork and, yes, ideal paper, had been the dominant aesthetic in scribal text production for several decades before Baskerville had his types cut, and as Nick notes there were other printer publishers seeking ways to apply this aesthetic to typography.</p>
      <p>One of the stranger things I have found examples of in my research on the English writing masters of the early 18th Century is occasional examples of engraved copy books with typeset prefatory matter, usually in Caslon's types. The disconnect between the aesthetic of the type and that of the engraved handwritten designs that follow is jarring to me, and I believe it was to the makers of these books too, especially the scribes whose work was displayed. My thesis is that during the first half of the 18th Century writing masters were devising a new page aesthetic in keeping with the emerging neoclassicism in architecture and the other arts, and that this aesthetic then drove improvements in printing and papermaking that would enable it to be applied to typography.</p>
