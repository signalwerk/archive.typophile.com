    html: <p>I see this as being a case of “follow the money”. Scotland became Europe’s most literate country in the 18th century. One reason often cited is the role of the Presbyterian church school in promoting widespread literacy. Another is the removal of copyright restrictions that would remain in England until the 19th century, which caused a publishing boom. (Documented in William St Clair’s <em>The Reading Nation in the Romantic Period</em>.) It follows that the progressive qualities of the Scottish Enlightenment would be reﬂected in the design and typography of books published there. This was the cultural environment that produced the Adam brothers and James Watt, and the typefounder Alexander Wilson.</p>
