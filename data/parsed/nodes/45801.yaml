    <p>I'm looking for a nice, classic serif font that has a long cap-R tail/descender that cups the following character.</p>
    <p>Similar to this, but hopefully a little more curve in the R tail:</p>
    <p><a href="http://www.hollandandsherry.com/flash/slideshow/index.htm" title="http://www.hollandandsherry.com/flash/slideshow/index.htm">http://www.hollandandsherry.com/flash/slideshow/index.htm</a></p>
    <p>Any ideas?</p>
    <p>Thanks!</p>
