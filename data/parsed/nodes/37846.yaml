      <p>This resembles many of the sign-painter fonts that can be found at Letterhead Fonts. Just a quick look came up with <a href="http://www.letterheadfonts.com/fonts/esoteric3.shtml" rel="nofollow">Esoteric</a>, which has three variants, including one that I think is fairly similar to your style. There may be others on the site.</p>
