    <p>My sister, a skilled faux-finish painter, but not a sign painter, needs a font to use as a template in order to restore and add to the signage for this shop. </p>
    <p>The tilde-like cross strokes on the A and the E seem to be distinguishing features to me... any ideas?</p>
