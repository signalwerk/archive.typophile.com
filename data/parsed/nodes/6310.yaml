    html: <p>I think the capital A has slightly too much weight to it. Other than that I think it's quite a beautiful font. It probably wouldn't work as well in a modern language though. Part of its beauty is the old style which relates with Anglo-Saxon. I think for that reason a dot on the i really isn't needed. Hopefully this feedback (or rather comment at this point) is still appreciated, more than 5 years after showing your font ;)</p>
