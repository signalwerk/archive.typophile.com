    html: <p>Matha Standun once told me that a dotted "i" is inauthentic for Gaelic. But a dot is also that letter's only saving grace in terms of legibility/readability. And since a dotless "i" is a standard character, I'd leave the main one dotted (unless this font is specifically for Gaelic text). <br> <br>hhp</p>
