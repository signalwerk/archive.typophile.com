    <p>Hi,</p>
    <p>As a project for my BA degree in graphic design we have been set to take on one of this years d&amp;ad briefs. The one I have chosen is set by Research Studios and is to relauch Fuse Magazine and its 20th issue.</p>
    <p><code>The brief<br>
    Re-launch FUSE magazine by designing its 20th issue.<br>
    Mandatory requirements<br>
    FUSE was seen as a revolution in both typography and the format it chose for publication. This re-launch should further this FUSE heritage.<br>
    Throughout your concept and design you must feature a new, original font created specially for this issue. Your final presentation must include:<br>
    • Format and examples of layout<br>
    • Complete font display<br>
    • Promotional poster for the re-launch<br>
    • Anything else you think is relevant<br>
    </code></p>
    <p>It can be read in full here: <a href="http://www.dandad.org/studentawards08/briefs/pdf/GRAPHIC_RESEARCHSTUDIOS.pdf" title="http://www.dandad.org/studentawards08/briefs/pdf/GRAPHIC_RESEARCHSTUDIOS.pdf">http://www.dandad.org/studentawards08/briefs/pdf/GRAPHIC_RESEARCHSTUDIOS...</a></p>
    <p>Research for this project has been fairly hard as I have not yet been able to even view a copy of Fuse Magazine.</p>
    <p>Does anyone know where I can get hold of on? I am located in the United Kingdom. If not, any additional information would be appreciated. Or if someone has a copy at home a few scans would be great. </p>
    <p>Regards,</p>
    <p>Gustaf</p>
    <p>Neville Brody: <a href="http://typophile.com/node/14015" title="http://typophile.com/node/14015">http://typophile.com/node/14015</a><br>
    Fuse Magazine: <a href="http://typophile.com/node/14028" title="http://typophile.com/node/14028">http://typophile.com/node/14028</a>?</p>
