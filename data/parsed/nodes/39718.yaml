      <p>Yeah, I pretty much would just like to see on what level what I have written down so far compares.</p>
      <p>A war theme is something that has been poping around in my head for a while today. Could be a good way to go ahead considering the uk's participation in the iraq war etc.. Its a way I think could have been handled a bit differently, if that is even possible for someone who has not been there to say, at least from what has been displayed in media here, also considering the different things that the media has reported in this country and some of the issues that has been completely disregarded (Media from other countries has aired some other stories which seems to have been blacklisted here).</p>
      <p>As It might end up as a pictogram typeface, the items of war and geometrics would work nicely together.</p>
      <p><strong>Edit:</strong> If anyone knows what typeface was used for the FUSE logo, that information would be appreciated. I have used this image to check in What-Is-The-Font etc as well but without any good matches.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Fuse Logo_3662.jpg"></div><p></p>
      <p>Regards</p>
      <p>Gustaf</p>
