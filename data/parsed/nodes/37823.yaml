      <p>============<br>
    Book design: talk by Andrew Haslam at St Bride Library,31 October 2007<br>
    ============</p>
    <p>A talk and exhibition marking the launch of Andrew Haslam’s<br>
    indispensable guide to the subject.<br>
    Wednesday 31 October 2007</p>
    <p>Drinks and viewing of the exhibition in the Farringdon Room, 6.00 pm<br>
    Talk in the Bridewell Hall, 7.00 pm</p>
    <p>* Admission: £5 (concessions £3)<br>
    * Venue: St Bride Foundation<br>
    * A small exhibition of books designed by students and alumni from<br>
    the MA Communication Design at Central Saint Martins College of Art<br>
    – some of which feature in the book – accompanies the talk.</p>
    <p>Book design is a comprehensive and practical guide for students and<br>
    experienced designers alike. The illustrated text takes the reader<br>
    through every aspect of the subject, from the components that make up<br>
    a book, to the intricacies of grid construction and typeface<br>
    selection. The role of the designer is discussed, with advice on how<br>
    to interpret a design brief, guidance on the use of type, images and<br>
    information graphics. A range of approaches to layout are discussed<br>
    and the production process is explained, including information on<br>
    reproduction, printing and binding. Andrew will talk about the broad<br>
    range of approaches covered in Book design and show examples of the<br>
    work that features in the book.<br>
    Book design is published by Laurence King. Signed copies will be for<br>
    sale at a special reduced price before and after the talk.</p>
    <p>Andrew Haslam graduated from the Royal College of Art in 1987. Since<br>
    then he has run his own studio in London creating science, history<br>
    and geography books for children. He has published 28 children’s<br>
    books. Recognition for his work includes the American Institute of<br>
    Physics Award for Science writing, the Geographic Association Gold<br>
    medal for most significant contribution to geography and the American<br>
    Readers’ Digest Creative Children’s Media Award for best series.<br>
    For 12 years he has combined his studio work with teaching graphic<br>
    design and typography, first at the University of Brighton and then<br>
    at Central Saint Martins. He was Head of Typography at the London<br>
    College of Printing before becoming Course Director of MA<br>
    Communication Design at Central Saint Martins and is currently Head<br>
    of Graphic Design.</p>
    <p>============</p>
