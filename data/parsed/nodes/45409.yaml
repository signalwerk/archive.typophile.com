    <p>I tend to use the same fonts over and over - you know... Helvetica Neue.</p>
    <p>I’d like to get off my HelveticaNeue-addiction. Can anyone suggest some modern san serif faces... on the lines of art magazine fonts? I am looking for faces that have thinner weights for body copy and such.</p>
    <p>Thanks a bunch!</p>
