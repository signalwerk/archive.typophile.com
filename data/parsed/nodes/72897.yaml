  html: |-
    <p><strong> Hinwil<strong></strong></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hinwil_4196.png"></div><p></p>
    <p>Hinwil is a hand made Mécane-Manuaire hybrid typeface created using the iPad. It is part of an ongoing personal project that I am working on currently to create a set of fonts using the touchscreen interface, some of which I aim to re-work into pro-versions over the coming months. The font is available for all to use for free and can be downloaded via the link below.</p>
    <p><a class="freelinking external" href="http://www.helveticbrands.ch/portfolio/typography/hinwil" rel="nofollow">Download Hinwil</a></p>
    <p><strong>Sion<strong></strong></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sion_4620.png"></div><p></p>
    <p>Sion is a geometric, experimental typeface created using the touchscreen of an iPad. The font is available for all to use for free and can be downloaded via the link below.</p>
    <p><a class="freelinking external" href="http://www.helveticbrands.ch/portfolio/typography/sion" rel="nofollow">Download Sion</a></p>
    <p>___</p>
    <p>I have been using my iPad as a typography sketchbook whilst traveling across the country on meetings. Just a personal project but thought I would share with the community.<br>
    Thanks!</p>
    <p>David Pache</p>
