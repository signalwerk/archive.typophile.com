      <p>Okay I uploaded a new sample file.  This one is from the Wikipedia article for Spanish, with all text directly related to Spanish in Antiqua and the rest in Fraktur.  Punctuation is also still the Antiqua version, but probably won't change too significantly.  I gave the i and j their dots back and finished up the uppercases except for X.  I used a rudimentary regex sequence to put in the long-s's so they might not be 100% accurate but I think it gets the majority of them, at least to preview the font.<br>
      <code>s/s/ſ/g<br>
      s/ſ /s /g<br>
      s/ſp/sp/g<br>
      s/ſk/sk/g<br>
      s/ſd/sd/g</code></p>
      <p>The spacing on the ſ when by itself is too much, although I think I might have all of the letters a little too closely spaced even for Fraktur.</p>
      <p>Other than a lot more work on kerning does anyone see anything major (or minor) to look at?  I'm still trying to get a good wrap-around lowercase x, but no luck yet.</p>
      <p>Overall, is it working?  Waste of time? Success?<br>
      <em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
