    <p>So I got bored and decided to ttry my hand at making a fraktur face.  However, I decided to see how well I could get it to "match" my antiqua font Coruña.  Obviously I ran into a few issues when trying to juxtapose antiqua and fraktur.  First, the fraktur is naturally a lot close of a font, with more thick lines than antiqua, as well as a lot "busier".  I decided I wasn't going to remove the essence of the fraktur script, and insterad focus on designing one that works as a perfect compliment to Coruña — an interesting task given that Coruña has a very low x-height and very large descenders and ascenders, very uncommon for fraktur.  So, rather than expand the fraktur to match the width and colour of the antiqua, I slightly reduced its weight.  The long descenders have the same feel as the antiqua ones, so I think it was somewhat successfull, especially when I squint my eyes and I can't pick out a given word as being fraktur, so the colour is matched well.</p>
    <p>The main thing I'm thinking is that I might not have the perceived x-height quite lined up, and that maybe my x's descender should be of the type that wraps back around under the x itself..  What do y'all think?</p>
