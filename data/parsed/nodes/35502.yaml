    html: <p>I cannot see a relationship between the two especially except for a certain romantic feeling. The 'Fraktur' seems like an 18th cent Romantic blackletter. I would not worry about the relationship of the two because realistically the two are unlikely to be used together. As to success of the black letter - i found it pretty easy to read. That's a good start to be sure. What do you want people to be able to do with it? Until you have a target you can't hit one.</p>
