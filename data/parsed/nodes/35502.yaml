      <p>Dennis hit the nail on the head.</p>
      <p>I was quite bored, but, since my dad is a math professor, I figured I'd try to extend my font for math typesetting (although this down the road) which does require fraktur.  And why do just the standard 5-6 letters for math when you can do all 53?  :-)  Actually it was kind of fun.</p>
      <p>So part experiment, part boredom, and part practical.  I figured I might go really out there and do a sütterlin to match the antiqua italic haha.</p>
