      <p>My first impression is that the combination looks kind of weird, because normally (i.e. in old books) it is exactly the other way around: few words in roman face turn up in the majority of the text being set in Fraktur.<br>
      x: try wrapping back the descender, I don't think that it is a problem when this descender is not as long as the other ones.<br>
      i: why no dot? This makes your face even harder to read. If you really need a "dotless i" glyph, put it in this position… ;-)<br>
      s: is there a long s variant planned? this would solve some of the s’s problem that appears to be too dark. Also, the whole glyph looks rotated left compared to the antiqua s. And try to improve the kerning (see the word "test" for what I mean).</p>
