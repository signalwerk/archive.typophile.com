  html: |-
    <p>Font distibutors such as MyFonts, and publishers such as Linotype and FontFont, employ a system of icons to represent the features available in fonts.</p>
    <p>These descend from the icons used in the GUIs of  word processing and layout applications. </p>
    <p>Noting that these icon systems are proprietary, I’ve recently made a set for my own use, in font format. However, it occurred to me that a standardized system might be useful for all concerned, especially to avoid confusion amongst those who come into contact with different ways of representing the same feature. </p>
    <p>Is this a good idea, and if so, how could it be implemented, if at all?</p>
