    html: |-
      <p><em>There are [type designers] who keep vector shapes "extremely" simple, so as to make later adjustments easy and flexible. Still others employ secret "trappy" tricks to get gaps to behave.</em></p>
      <p>I usually maintain simplicity of outline definition as long as possible, also allowing outline overlaps in source data. As you say, this enables flexibility and ease of editing. My preference is to do this even through interpolation sources if these are to be used. <em>Then</em> I create a separate copy of the source file in which I go through the glyphs removing overlaps and adding 'trappy tricks' and other refinements to produce the final design. Of course, the only reason I can do it this way is that, after many years, I have a pretty good idea what refinements are going to be necessary and what affect they will have, meaning that I don't need them for early testing of letter shapes because I can mentally apply them.</p>
