    html: |-
      <p>Dang! Three points to Nick Shinn!</p>
      <p>Thanks for all the great suggestions. By calling this the "Bezier Hall of Fame" the thought was to call attention to typographers with a strong command of vector drawing, or who use beziers in innovative ways. For example, I had somewhat admired the printed forms of Garage Gothic since the 1990's, but when I finally took a look at Frere-Jones' vectors I was blown away, impossible! was my first reaction. Just seeing those vectors created a sense of fresh possibilities for me.</p>
      <p>There are typographers who keep vector shapes "extremely" simple, so as to make later adjustments easy and flexible. Still others employ secret "trappy" tricks to get gaps to behave. Its possible to be too myopic with technique and have the final forms suffer, but knowledge of the bezier possibilities is a great toolkit to have in your pocket.</p>
