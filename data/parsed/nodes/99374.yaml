    <p>In an attempt to learn from the best, I have been looking at the work of established Bezier masters. The short list of typographers that I came up with is just based on my limited prejudices:</p>
    <p><strong>Matthew Carter<br>
    David Berlow<br>
    Lucas de Groot<br>
    Gerard Unger<br>
    Leslie Cabarga<br>
    Tobias Frere-Jones<br>
    Robert Slimbach<br>
    </strong></p>
    <p>I would love to learn more, and I feel I have overlooked many vector drawing heros.</p>
    <p>If you could nominate five people to the <strong>Bezier Drawing Hall of Fame</strong>, who would you choose?</p>
