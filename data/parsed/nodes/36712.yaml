    <p>From... <a href="http://www.brooklyneagle.com/categories/category.php?category_id=18&amp;id=15175" title="http://www.brooklyneagle.com/categories/category.php?category_id=18&amp;id=15175">http://www.brooklyneagle.com/categories/category.php?category_id=18&amp;id=1...</a> </p>
    <p>"...Helmetag and his team are currently working on three major projects in New York. One is the World Trade Center Memorial’s names commemoration as well as the site graphics. The commission includes extensive collaboration with the memorial’s architect and landscape architect, and C&amp;G is in the process of creating a unique typeface that will <strong>combine the latest computer technology with the ancient art of bronze casting</strong>" </p>
    <p>...sounds a lot more interesting than it probably is, but for now I'm picturing a customized Linotype caster with a digital interface and military-spec upgrades to handle bronze instead of lead.</p>
