  html: |-
    <p>Hello</p>
    <p>I would like to know what you think are the advantages to the client, when they have a typeface designed exclusively for them?</p>
    <p>Now I know that they will recieve something unique out of this, but is it actually a worthwhile investment. Is there any proof that it sells products?</p>
    <p>A few brands I have looked at...</p>
    <p>Coca Cola - #1 Brand in the world of course uses a unique script logo, scribe by the original maker’s bookeeper. This is obviously very unique and is a key element to their packaging.</p>
    <p>GE - uses GE Inspira on all their branding and marketing and even in house word processing.</p>
    <p>What do you all think about this subject?</p>
    <p>Thanks</p>
    <p>Tom</p>
