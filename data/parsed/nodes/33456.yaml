      <p>If I had anything to suggest, it would be that Coke figure out what it's doing with the Diet Coke brand.  They've been throwing so many variations out to the marketplace lately that I'm not sure I know what it stands for anymore.  </p>
      <p>I don't think there's anything inherently wrong with the design itself.  The rainbow device is fairly common in the vitamin and supplement marketplace.</p>
