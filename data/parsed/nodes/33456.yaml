    <p>I haven't seen any discussion about this logo around these parts, but I have to say, I think this is the most unappealing thing I have seen in a long time, and I thought I'd throw it out there for y'all to critique. There is so much to hate about it, the colors, the awkwardness... I myself am not a designer, but I love design, and I love hearing the expertise of those in this forum, so I thought I'd throw it out there. </p>
    <p>Here are my questions...<br>
    1. What do you think of this "Diet Coke Plus" look?<br>
    2. What do you think was the "look" that Coke was going for in this thing (which I obviously missed)<br>
    3. What would you suggest to Coke if they asked you? </p>
    <p>Have Fun. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dietcokeplusresized_4004.jpg"></div><p></p>
