    <p>If you ask a typographer about Old Style he will tell you something about Aldus Manutius and Claude Garamond and maybe something about humanistic handwriting and the italic. But you would not consider the following serif as classic oldstyle.<br>
    It is based on a tyoeface Giovanni Francesco Cresci wrote with a pen with an x-height of 8 mm. It was published in his book »Il perfetto Scrittore« in 1570. You can also see it in Tschicholds »Meisterbuch der Schrift«.<br>
    The upper case letters are almost like the Capitalis Monumentalis. The lower case seem almost neoclassic and are very elegant. I only took the lowercase as a basis for Perfetto and wanted to keep the elegance and make a modern useful Serif. I started with the display version with thin hairlines and created the text version later. The display version has 9 weights with italics up to extrabold and ultrabold. The text version has only 7 weights, because extrabold and ultrabold make no sence in text.</p>
    <p>The upcoming Pro version will have small caps, different sets of figures, some ligatures, Latin 2, turkish and baltic letters.</p>
    <p><a href="http://www.hubertjocham.de/item.php/type/serif/Perfetto/" title="www.hubertjocham.de/item.php/type/serif/Perfetto/">www.hubertjocham.de/item.php/type/serif/Perfetto/</a><br>
    <a href="http://www.hubertjocham.de/item.php/type/serif/PerfettoDis/" title="www.hubertjocham.de/item.php/type/serif/PerfettoDis/">www.hubertjocham.de/item.php/type/serif/PerfettoDis/</a></p>
