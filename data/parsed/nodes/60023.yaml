    html: |-
      <p>Nice concept!</p>
      <p>I think b d g p q work very well and show that this thing has potential.</p>
      <p>The m is also a bit tricky, the w is better but needs some weight taken out in the centre (maybe assymmetrical?). Same for the x, and also the k (maybe just move the diagonals away).</p>
      <p>The h needs a lacuna, either on top or at the bottom of the joint (which would be less conventional and fitt better, I assume).</p>
      <p>The o seems a bit too heavy, maybe it could do with an opening (at the botom or left) or at least a lacuna. You have done the right thing with the y there.</p>
      <p>The e is much better than the a.</p>
