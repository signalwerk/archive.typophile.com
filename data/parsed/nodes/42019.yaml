      <p>Thanks for the feedback!  I think I can answer Sharon and logosam simultaneously.</p>
      <p>The reason I’m not going to use either suggestions (though they are both really good ones), is because I like the fact that the seemingly abstract symbol for the love garden is in truth the o,v,g, and a of the name.  Typically we’d expect “LG” to be the wordmark, but instead it uses other letters in the name to create a symbol that to me feels both “mod” and arcane/alchemical/psychedelic—which is the “big idea.”</p>
      <p>here’s the tilt:<br>
      </p><div class="imageWrap"><img src="/files/tilt_4239.jpg"></div><p></p>
      <p>Here’s the symbol by itself:<br>
      </p><div class="imageWrap"><img src="/files/symbol_4856.jpg"></div><p></p>
      <p>and here’s an example of it in use:<br>
      </p><div class="imageWrap"><img src="/files/tshirt_6218.jpg"></div><p></p>
      <p>I just REALLY dig that.<br>
      ______________________________<br>
      Awesome&gt;&gt; <a href="http://www.biklopsdesign.com" title="www.biklopsdesign.com">www.biklopsdesign.com</a></p>
