      <p>Paul—I didn’t create a typeface-you give me too much credit!  I just drew these 8 letters based on dozens of typefaces I’ve been seeing allot of myself!  The blown-out deco-inspired thing is definitely big right now...but it was in the 60s as well which is where I stole most of my inspiration—sixties fantasy novels.  </p>
      <p>I created this logotype, but if you want a full features typeface I’d just poke around veer.  They have 4 or 5 like this including the new <a href="http://www.veer.com/products/typedetail.aspx?image=DET0000298&amp;WT.ac=type.080301.1.img.strand">DF Strand</a> which is pretty cool.<br>
