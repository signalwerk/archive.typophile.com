      <p>Back in the day when production art was actually a job and strippers worked for offset  printers instead of pimps. :-)<br>
      You could tell a stripper to "Step and burn" the Cyan 3 picas as red then step and burn 3 picas as yellow and get the effect Muriel used above.</p>
      <p>ChrisL</p>
    html_clean: |-
