    html: |-
      <p>I just scanned my copy of the MIT Bauhaus book. Here is a highly enlarged image of the lower right corner showing the "B".  See how buildup of ink in not a problem for 2 colors (200% coverage) but starts to lift on 3 colors (300% coverage). This only shows at extreme enlargement and with a bit of level tweaking in PhotoShop. When you see the book on the shelf, it was not noticeable to the untrained eye. I am sure the pressmen worked hard to keep it clean though! Pressmen in those days earned their keep adjusting keys, wash and dryers :-)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bauhausBk_5671.png"></div><p></p>
      <p>ChrisL</p>
