    html: "<p>@ Manel: Are you looking for the English technical term from <a class=\"freelinking external\" href=\"http://en.wikipedia.org/wiki/Offset_printing\">offset printing</a> technology? If so, This happens when your <a class=\"freelinking external\" href=\"http://en.wikipedia.org/wiki/Printing_registration\">registration</a> is off. It's considered a mistake. The picture you posted would be an example of someone using this as a style, exaggerating it on purpose. On a related note, you might want to look at  <a class=\"freelinking external\" href=\"http://en.wikipedia.org/wiki/Screen_angle\">screen angles</a>.</p>"
    html_clean: "<p>@ Manel: Are you looking for the English technical term from <a class=\"freelinking external link-external\" href=\"http://en.wikipedia.org/wiki/Offset_printing\">offset printing</a> technology? If so, This happens when your <a class=\"freelinking external link-external\" href=\"http://en.wikipedia.org/wiki/Printing_registration\">registration</a> is off. It's considered a mistake. The picture you posted would be an example of someone using this as a style, exaggerating it on purpose. On a related note, you might want to look at  <a class=\"freelinking external link-external\" href=\"http://en.wikipedia.org/wiki/Screen_angle\">screen angles</a>.</p>"
