      <p>&gt;great examples<br>
      "americanapparel.net" especially "american" is off!</p>
      <p>For text sizes:<br>
      I would try set it as loose as the Neue Helvetica-character allows. It needs a generous line-height. The numbers are problematic, especially in small sizes, check combinations of 0369 because of its stylized, closed forms that it makes them hard to differentiate. Regarding the tabular numbers, changing "metric" to "optical" helps a bit. Tracking manually would do better of course.</p>
      <p>greetings</p>
