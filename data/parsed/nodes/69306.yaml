  html: |-
    <p>I'm starting a print and web project that will use Helvetica almost exclusively, at text and display sizes, for web, brochures, postcards, bookmarks, posters, wayfinding signage, and so on. I've seen the face used quite nicely--for example, by Gary Hustwit and many of the designers shown in his <em>Helvetica</em>, and in Lars Müller's <em>Helvetica</em> books. But I've also seen it used poorly, and I have seen that even the Neue cut has its problems in use--like having only tabular figures, for example, so that the 1 has a mile of space around it. </p>
    <p>So I'm curious: what would people who've used the face successfully advise a newcomer like me to do to make sure I get the most out of Helvetica Neue? I'm looking for GREP suggestions in InDesign to deal with the 1 and other spacing problems, general tips or rules of thumb for leading, kerning, and tracking--anything you've hit upon that made working with the face better. (This includes other Typophile threads that I might have overlooked, by the way.) </p>
    <p>(P.S.: I'm really not interested in starting a discussion about whether we all like or hate Helvetica, whether or not it's the best face for this particular job, or whether another face would work better. I'm satisfied it's an appropriate choice for the project, and I'm really just looking for advice for using it from people with more experience and expertise than I have.)</p>
