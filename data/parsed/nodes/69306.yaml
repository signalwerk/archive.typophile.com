      <p></p><div class="imageWrap"><img src="http://typophile.com/files/helv3_5826.png"></div><br>
      If you're going to use "tight but not touching" for display setting, then make sure that no letters touch.<br>
      This will require extensive manual kerning (bottom), as the default spacing (top) is designed for text.<br>
      If you merely track closer (centre), the effect doesn't work.<br>
      BTW, this spacing technique relates to two specific technologies that were popular in the 1960s, phototypositor and dry transfer (Letraset).<p></p>
      <p>Here are a couple of examples of this retro look, the first from a 1969 Pepsi ad, the second from a 2003 American Apparel ad.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/pepsi_4957.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/aa_4761.png"></div><p></p>
