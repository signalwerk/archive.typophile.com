      <p><cite>A few words in a bold weight, artfully placed with a lot of white space around it…</cite></p>
      <p>It doesn’t even really need white space once it’s big. I think that’s the real strength of Helvetica; the bold just beats everything out there if you make it huge and track it tight. Add any crazy contemporary color combination and it’s the design equivalent of a spiked bat. Unfortunately that has resulted in designers assuming it’s good for other things, and it really isn’t.</p>
