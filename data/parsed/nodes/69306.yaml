    html: <p>I think Erik Spiekermann in the Helvetica movie—I forget whether it's the main movie or the out-takes—nails it as far as a general guideline. He says that Helvetica is "fat in the middle", so it needs a lot of space around it, in this case white space. A few words in a bold weight, artfully placed with a lot of white space around it, and it can look great. In extended text, "it looks like dog shit," to quote Paul Rand.</p>
