      <p>In general I like what you did to "Nioubes" since it would look horrible in <a href="http://www.dafont.com/font.php?file=nioubes_font&amp;page=1&amp;nb_ppp_old=10&amp;text=architects&amp;nb_ppp=10&amp;psize=l&amp;classt=alpha" rel="nofollow">it's original look</a>.<br>
      :)</p>
      <p>But I can see one problem coming from customizing the font (especially the "s") -&gt; in "Nioubes" standard the "s" balances the "h" but in your version the "h" looks too wide ... or maybe the new "s" looks too slender. You could possibly try to make the "s" more like in it's original font. But anyway ... it looks good and it communicates "architecture".</p>
