    html: |-
      <p>Thanks Penn...</p>
      <p>I am struggling to do something that doesn't smack of Tweed and Leather elbow patches or something which is perceived as "cool for the time being but..."</p>
      <p>Not sure how to get inbetween -</p>
      <p>The logo needs to say forward looking / but not pigeon holes the architects as contemporary only architects... same as I dont wanna do anything that looks traditional and pigeon holes the firm as Traditional only.</p>
      <p>I have taken the comments from before on board and I have spent some time addressing the issue of the F and its cross bar.</p>
      <p>The following show a few options- Im favouring 001</p>
      <p>001 has a dropped cross bar to align with that of the P &amp; A</p>
      <p>002 has a cross bar which is unchanged in terms of its vertical position but I have extended the cross bar </p>
      <p>003 and 004 are variations on a theme where i have simlpy extended the cross bar into the P.</p>
      <p>Your comments are welcomed again.</p>
      <p>I am pretty happy with 001 and i have put the two best (i think) options together with the architects part.</p>
      <p>I am gonna play with the S in architects now and see if i can balance this h &amp; s relationship.</p>
      <p>Thanks guys - keep it coming.</p>
      <p>James<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/EXP01_5788.jpg"></div><p></p>
