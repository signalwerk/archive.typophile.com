      <p>There is still a problem within your "s". All the other "round" letters have the shape of a perfect circle but the spine of your "s" is too short and so the letter feels out of place. Furthermore your "s" doesn't sit on the baseline.<br>
      <em></em><em></em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/s_problem_6277.jpg"></div><br>
      <em></em><em></em><br>
      <div class="imageWrap"><img src="http://typophile.com/files/round_s_5843.jpg"></div><br>
      <em></em><em></em><br>
      Since "c" is some kind of an exception -- regarding to where the strokes end (all of the others end at either 3, 6, 9 or 12 o'clock) -- it needs a little more space towards the "h" because otherwise it visually cuts into it like in the first picture.<br>
      <em></em><br>
      I hope this helps you improving the wordmark.<p></p>
