    html: |-
      <p>Check out the font critique forums here - it's a great way to get a feel of how fonts are designed and created and I certainly learn a lot by following some of the ongoing critique processes. Then also check out the build forums to see some of the technical hurdles and challenges in creating fonts. And then, if you're still not turned off by the amount of work necessary to create a a "good" and usable font, start developing your own, either with pencil/pen and paper and then converting it in a font creation program or start by jumping right into a font-creating software like TypeCreator, Fontlab, DTL FontMaster or even FontForge and creating your font.</p>
      <p>If you're more just interested in creating a one-off "font" you could just create your characters in your favorite vector artwork program and then manually set everything.</p>
      <p>I hope this helps answer your question. Good luck!</p>
