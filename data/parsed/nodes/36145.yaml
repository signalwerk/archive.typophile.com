      <p>Well the best I can do is make a recommendation for next best solutions:</p>
      <p>Check <a href="http://www.t26.com" title="www.t26.com">www.t26.com</a> more specifically fonts designed by Identikal (like Distilla). I think you’ll find a font or 2 that are close. Also, <a href="http://www.myfonts.com/fonts/agfa/burin-sans/" title="http://www.myfonts.com/fonts/agfa/burin-sans/">http://www.myfonts.com/fonts/agfa/burin-sans/</a> is nice and light and though the K, S and E are off it’s still pretty close.</p>
