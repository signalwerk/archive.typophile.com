      <p>I’m not 100%, but this might have been done freehanded. The S and C have some really wobbly looking curves and the B is constructed rather weirdly (usually the top portion is slightly smaller than the bottom.) </p>
      <p>The K is the answer, find a font with that K and you’ll probably have what you’re looking for.</p>
