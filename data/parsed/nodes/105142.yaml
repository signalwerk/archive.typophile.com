      <p>That’s the system font of your OS with no <a href="http://en.wikipedia.org/wiki/Anti-aliasing" rel="nofollow">anti-aliasing</a>. That makes it not easy to identify. Which system are you using?</p>
      <p>Meanwhile, compare your font with the <a href="http://en.wikipedia.org/wiki/Anti-aliasing" rel="nofollow">list of windows fonts</a>.</p>
