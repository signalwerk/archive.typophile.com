      <p>Mr. Walcott himself <a href="http://marketplace.veer.com/font/Adage-Script-JBT0000002?skeywords=adage&amp;stermids=100005080#" target="_blank" rel="nofollow">tells us (see the About tab)</a> that this is a revival of a "vintage photo-typesetting face. I'm going to look through the Filmotype catalog right now.</p>
      <p>Mike Allard created some of the earliest digital shareware revivals. I don't believe he created any original designs - but I might be wrong.</p>
      <p>Edit - It wasn't a Filmotype face.</p>
