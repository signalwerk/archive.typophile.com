      <p>This design has also been revived in a commercial font <a href="http://www.myfonts.com/fonts/jawfonts/adage-script-jf/" rel="nofollow">Adadge Script JF</a> by Jason Walcott, which is perhaps more polished. AFAIK Lauren Script was produced as an original work previous to Adage Script and thus is in no way a rip of Adadge script. No info on the pre-digital original. Perhaps a photo lettering era design?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AdageScript_5346.jpg"></div><br>
      Don<p></p>
