      <p>Nice way to compromise any font, Bill: set it in a solid block with a large character count per line :-)</p>
      <p><em>...extended text, in paragraphs, which is what I mean by text.</em></p>
      <p>Why not use the proper typographic terms?<br>
      When speaking of size, "text" means small, and "display" large -- so your statement "Even though it's small, on Rand's card it's used in a display fashion," doesn't make sense.<br>
      If what you really mean is that it's not running text, then say so.</p>
      <p>At the moment, you appear to be saying that this non-running small type is display-fashion because it was designed by Paul Rand. However, the non-running text of ALL stationery, not just that designed by the great man, is generally set with care and attention (due to the repeated scrutiny it will be subjected to), which is a quality that may be applied to type at all sizes, not just display.</p>
      <p>Yeah, I know, only extended, running text in learned journals and the canon of literature, e.g. Kafka, is worthy to be considered "text".<br>
      This is the traditional bookist, anti-jobbing snobbery.<br>
      But there are many, many other genres of *body copy* that are quite legitimate forms of commercial text typography, where Helvetica works well, even if one may prefer to see something different.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nutrition_4741.png"></div><p></p>
