      <p>What I'm trying to do here is to prove these "negativities", The negativities mentioned in the film Helvetica are opinions of what the designers feel towards the font. It is very much personal perspective. </p>
      <p>I am hoping that by gathering more of these "opinions" and analyses them to see if there's a common trend to it. Like I'm pretty sure everyone agrees it's a corporate typeface, which can be seen from the numbers of large companies adopting it. I mean like seriously, as a student I couldn't be bother whether which typeface I chose, I could jolly well use Helvetica in any design work and pull it off. I don't believe in Helvetica being a font for all. </p>
      <p>What I'm targeting at is actually the way students design, We tend to conform when we are designing. For instance, I'm guilty of using only one typeface for all of my design works. Not Helvetica... It is also another sans serif. I've been exposed to the word Helvetica quite often during my course of study and that it became known to me as a "designer" typeface. You will not go wrong using Helvetica, everyone uses it. You can justify the reasons on why you use it. But it is not necessary the most appropriate font to use...</p>
      <p>I could easily do a thesis on how designers design but Helvetica presents to me as a manifestation of these behaviors and more. Students can't be bother with their choice of typeface they use, as long as it works its fine. That's one reasons I see to why Helvetica is so widespread. My point here is to bring awareness of this problem through understanding the negativities that arises from Helvetica. For example, I read somewhere that, design in Helvetica no longer stands out, as everyone is using Helvetica, it will not win an award. Too much of something is not good. People don't realise it and they carry on doing so.</p>
      <p>Thanks again guys for the suggestions for my topic. This is for my thesis paper, but for my studio project I'm taking it in 2 parts.<br>
       1) Finding out the negativities and presents to the target audience in a bid to convince or reveal what's going on with the Helvetica trend.</p>
      <p>2) The general idea is "how can I get students to explore other typefaces apart from Helvetica". I'm still working on it.</p>
      <p>"Helvetica works as a text face, as does anything you can decipher, it just doesn't work *well*."</p>
      <p>Helvetica is perceived as neutral by alot of people hence it suitability for a wide range of application. It could work for anything, but is it the appropriate font that best communicates the intended message?</p>
      <p>Nick, imo the reason Helvetica is chosen here is perhaps it was intended for the masses to read, which of course is true. Since many corporate use Helvetica to appeal to the masses though their branding. But in terms of readability, it might not be the best font to use. It kinda feels like it looks all the same, except for the bold and varying text size. I do apologise for making any noob comments here...</p>
