      <p>@Nick: I've read the article, uniformity while I was researching about the topic Helvetica. Admittedly Helvetica is really a very dead and done with subject to do on, many discussions, debates have been spawned from it, yet Helvetica remains one of the few favorite font a designer must have. </p>
      <p>I'm know that Helvetica in the US is particularly overwhelming, but in Singapore, Helvetica is not as widespread but its still there, invisible to the ignorant. I'm looking into this in the local context of my school whereby students tends to fall back to using Helvetica regardless the reasons. I'm not saying that they shouldn't use Helvetica, but rather they should understand the reason why they choose it.</p>
      <p>I was hoping that by finding out the negativities that surround Helvetica today, I could use it to convince students and make them see Helvetica in a different light. Eventually make them realise that Helvetica is not working as well as they thought... Possibly getting them to move out of their comfort zone and explore other typefaces.</p>
      <p>I'm not that great a designer and I'm not that up to date to the latest design trends or issues that's going on. Talking about Helvetica is definitely over and done with... It is kinda hard to find substantial information regarding the "dislike", "negative" sides of Helvetica, many are opinions and while some have concrete evidence, many don't. </p>
      <p>What I'm hoping to achieve here is to find out as many negative aspects involving Helvetica and proceed on to conduct investigations to back up these claims. And through these results, create a set of outcomes to convince my target audiences.</p>
      <p>@Christopher Dean: I'm studying at Lasalle College of the Arts, doing my final degree year. I do know that Helvetica is a very dead and done with subject to do on, but the information regarding the negative aspects of Helvetica are very few and little.</p>
      <p>I broken the negative aspects into 3 parts:<br>
       1) Physical traits of Helvetica (which William mentioned above, thanks William =))</p>
      <p> 2) The phenomenon part of Helvetica, like why did it became known as corporate, conformist, fail safe etc. Is there more?</p>
      <p> 3) The possible impact, what would happen if Helvetica took over the world... (I know won't happen but one thing is that Helvetica has popularise the use of sans serif typeface I believe. Forgive me if I got this part wrong...</p>
      <p>Thanks alot guys, really I gained a lot of new insights and ideas =)</p>
