      <p>Nick, I acknowledge that my terminology has been imprecise, but I don't think that the term "text type" is that precise, and only used to refer to size. For example Mitchell &amp; Wightman's Book Typography defines "text font" as "font designed for setting continuous text." </p>
      <p>Of course fonts designed for setting continuous text are usually also intended to be used small, so the notion, indeed based on book typography, overlaps. Display type is usually used large, and for short text. </p>
      <p>In Paul Rand's card, he was using Helvetica bold in short text, with a lot of white space, small, so that breaks my dichotomy. But I don't think it too much of a stretch to think that Rand was referring to continuous text when he warned his colleague not to set "text" in Helvetica. </p>
      <p>You have a good point that my terminology was imprecise, but I don't think it's generally as precise as you say, given the evidence of Mitchell &amp; Wightman.  </p>
      <p>In any case, my point is that Helvetica is poor for continuous text. Your setting (is that Neue Helvetica light, tracked out?), while vastly improved is still far short of any real book face, including mine. But more relevant, I think you could use Meta or Frutiger or Myriad and have it more readable than Helvetica, for uses like your label. Helvetica performs all right at the top, but with the lowest part, where the text is more crowded, it falls down. </p>
      <p>I don't have time to do more settings now, though this is pretty fun.</p>
