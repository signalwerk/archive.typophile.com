      <p>Helvetica became a synonym for font in all circles (professional and amateurs) and we can argue as much as we want, but that's just a fact.</p>
      <p>I have a great respect for Helvetica, as a historical piece of art that's very useful in big % of commercial or non-commercial situations. The fact that Helvetica became so wide used doesn't make it a bad font (or typEface :)), it just became overused and it became popular, even if you ask someone who doesn't have a clue about design or typography, he/she will say: "Yeah, there's Times New Roman, Arial, Helvetica..". </p>
      <p>I think also that one important thing about Helvetica isn't understood well (maybe)... it's the moment when it was made and what it meant in those years, it was a revolutionary move and that moment was enlightening for many designers then (some of them are also alive now) and how they passed on students, colleagues, companies they worked... their impression about Helvetica, so it "survived" in the head of many designers now-days.</p>
      <p>My point is that such a font as Helvetica can't become bad itself (when it's obviously not, maybe here and there needs some modern touch for some details (IMHO)). When I was a student, I couldn't stand Helvetica, I though it's an overrated bastard who sits in every chair. Now I think about Helvetica as one of the typographic mover of it's time and don't have a problem with it or cause it's being so used.</p>
      <p>About Metalica... well, it's a tricky cause if you look, for example, at Picasso now and try to analyze his paintings for example, you can't tell that they are modern for the time we're living in, just like Metalica in some time lines, but you can't go over without not learning about them.<br>
      Same as for Helvetica.</p>
      <p>- - - -</p>
      <p>I mean... you can't "remove" Helvetica or disable it somehow... you just need to find font that's fitting into your taste :) But you can ignore and don't have a opinion about Helvetica, like with any of 1.000.000 fonts today :)</p>
