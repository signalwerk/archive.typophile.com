      <p>Nick, I agree that Rand was saying that Helvetica is particularly poor for text, and other sans can be used more effectively. </p>
      <p>I do think sans, well set, can be used successfully for multiple line text in print, but just not for a whole lot of text. The more text you have, the more you run up against the limitations of sans. </p>
      <p>One problem with sans is that the reader tends to more easily "lose the line" by his or her eye jumping to the wrong line. The designer can counteract this weakness with short lines and a lot of leading, which is what Rand does in the example you show. (Many books on typography also mention the need for this.) But I think that example is too black for extended reading, and it is also not very economical for a long text. Also the advantage of good serif text faces is not just novels but any long text, including non-fiction and magazines and newspapers. At least that is the verdict of the public, and I agree with it.</p>
      <p>Wong Shiqin, (ken-) I am wondering from your latest post whether you are missing an important point that Nick and I agree on: the important question is not just which typeface is used but *how* it is used that is critical, both for readability and aesthetics. </p>
      <p>I don't object at all to Rand's use of Helvetica on his business card, where it looks great. I think Erik Spiekermann's point in the movie is that Helvetica is very limited as to where it can be both readable and look good. Some people assert that it is "neutral" and can be used everywhere successfully. But in fact it is a "prima donna", and requires very specific conditions to look really good and be easy to read. Otherwise you are better of going with something else, aside from the issue of cultural baggage. </p>
      <p>So my fundamental objection to Helvetica is not that it is inherently ugly, but that it has limited successful use, and is constantly used where it doesn't work that well and other faces, including other sans, would work better. Of course there is also the cultural baggage of overuse and stale uniformity, though that's not inherent in the design. </p>
      <p>The most horrible thing, which is pretty common, is that people fill a whole page of a report on letter sized or A4 paper with Helvetica or Arial, set solid at small size, and with no tracking. That's really painful to read.</p>
