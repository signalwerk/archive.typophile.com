      <p>This thread has got me thinking now that this actually is a good topic for a student thesis. Helvetica has such a huge presence and is so controversial that it has plenty of food for thought. </p>
      <p>Not to create another firestorm, but I think that Times New Roman is a quite different story. It is a great typeface, overused and incorrectly used, but to me not stale. I think the fact that Helvetica is basically as a display face means that even well used it gets stale and goes in and out of style. I think text faces are more like comfortable walking shoes, rather than show-off fashion shoes. As such, I don't think they get stale in the same way and to the same extent as display faces.</p>
