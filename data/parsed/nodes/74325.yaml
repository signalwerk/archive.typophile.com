      <p><em>I don't see why so many people dislike Helvetica.</em></p>
      <p>In the context of this thread, there are better type issues to study now than the Helvetica trilemma Bill describes.<br>
      Sure, it is a "good subject", because you can go round and round in circles forever appreciating the different points of view.<br>
      But wouldn't it be better for students to get their teeth into something more current -- both a more recent type design and issue? </p>
      <p>To use your analogy, Metallica were an innovative band 25 years ago.<br>
      I still enjoy cranking up Master of Puppets occasionally, but if I were studying contemporary music now, I wouldn't spend too much time on it.</p>
      <p>As for disliking Helvetica, I've outlined my position, as a non-corporate living designer of original typefaces, as to why its ubiquity pisses me off, many times -- which has nothing at all to do with its functional or aesthetic qualities.</p>
      <p>This is not just a question of business self-interest -- ideologically (which Bill omits from his trilemma) there is a problem with mass standardization.</p>
      <p>The ideological issue, as it applies to Helvetica, is still current, but I don't think it justifies a student (other than of art history/cultural criticism) delving too deeply into an old typeface. If you have precious time to spend getting to know a typeface, surely it makes more sense to acquaint yourself with what's going on now. That doesn't omit studying history and type revivals, merely tired history. Helvetica has been done to death, why not mine an untapped seam of history? </p>
      <p>With regards to use of Helvetica, note that Akzidenz Grotesk has become more popular recently (the "posh" Helvetica, as termed by Phil Baines), with designers who are too cool for Helvetica, but don't mind riding its pleasability.</p>
      <p>Also, several type designers have explored the idea of the "Ur-grot", going back to design original works in a neo-Victorian style.<br>
      James (Dunwich) and myself amongst them:</p>
      <p>Armitage<br>
      Figgins Sans<br>
      Founders Grotesk<br>
      &amp;c., &amp;c.</p>
      <p>This is all more interesting than examining the mechanics of Helvetica, I would say.</p>
