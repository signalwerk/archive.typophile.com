      <p><em> I grant you that another sense of "text" is just small text used in short bursts...</em></p>
      <p>Again, that is your own interpretation, not one of the meanings generally understood by typographers:</p>
      <p>- the encoded text (characters, not glyphs)</p>
      <p>- the counterpart to display, display being defined as a size larger than body type</p>
      <p>- the cut of type intended for use from around 8 to 14 pt size, as designated in typefaces with optical sizes, generally Display, Text and Micro (you yourself recently posted a display cut of your Caslon, indicating that you accept the principle that the term "text" relates to size -- unless you intend to name the display version Williams Caslon Text Display :-).</p>
      <p>All these meanings are far more specific and precise, typographically, than the idea that "text" type is meant for books.<br>
      Indeed, one speaks of "book faces" for books, rather than text faces, although that is equally sketchy.</p>
