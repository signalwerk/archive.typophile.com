      <p>Helvetica has three different kinds of problems. One is the problem of overuse so that it looks stale. I'm sure that is the basis of a lot of the objections to it. </p>
      <p>The second problem has to do with its unsuitability for extended text. Its horizontally, tightly closed counters, with wide round shapes lead, especially in bold weights give it in display a vibrancy and punch that I think accounts for its popularity. But these qualities, with the tight spacing make it horrible for text. The late Paul Rand said that it "looks like dogshit in text." My own theory is that if you space it more widely the words fall apart visually, so that it still isn't good if you try tracking it out in text. I think that sans that are narrower, based on the oval, work better in text. </p>
      <p>(The screen version of Helvetica, and Arial, its sister, are so hinted as to be different faces, so this discussion doesn't really apply to the screen.)</p>
      <p>The third problem had to do with its drawing. It was early on adapted to Linotype, then Phototype, and then redrawn as Neue Helvetica. This resulted in various problems and solutions regarding both its drawing and spacing. </p>
      <p>In <a class="freelinking external" href="http://www.christianschwartz.com/haasgrotesk.shtml" rel="nofollow">this fascinating discussion</a>, with examples, Christian Schwartz explains how he tried to recapture, and in fact improve on the merits of the original. Note that he drew a different version for text. Unfortunately, in the link he doesn't give a comparison of the text and display. I guess we'd need a scan of Bloomberg Business Week, where it is now used, for a comparison. </p>
      <p>I am still dubious that even with redrawing it can be much good for extended text, but your question has made me curious enough to get a copy of the magazine.</p>
