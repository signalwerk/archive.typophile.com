    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : David Quay</strong></p>
    <p>David Quay was born in London, England, and studied graphic design at the Ravensbourne College of Art &amp; Design. After graduation he worked in various London design studios until he became a freelance designer in 1975, specialising in lettering, logotype and graphic design.</p>
    <p>In 1987 he formed David Quay Design in London. Clients included <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a>, H. <a href="/wiki/Berthold" class="freelinking" rel="nofollow">Berthold</a> AG, and the <a href="/wiki/International%20Typeface%20Corporation" class="freelinking" rel="nofollow">International Typeface Corporation</a> (ITC). In 1990 he co-founded <a href="/wiki/The%20Foundry" class="freelinking" rel="nofollow">The Foundry</a> with <a href="/wiki/Freda%20Sack" class="freelinking" rel="nofollow">Freda Sack</a> and <a href="/wiki/Mike%20Daines" class="freelinking" rel="nofollow">Mike Daines</a>, to design, manufacture, and market PostScript fonts.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/fonts/designer/david_quay/" rel="nofollow">David Quay</a> at FontShop</p>
