    html: "<p>I have an old book of letterpress type/ornaments with a lot of this stuff, including whole alphabets. There must be books in a library near you with this, perhaps a scan or a good photocopy would get you going? The original copyright would most likely be expired and if you set your own text with the letters (rather than reproducing a whole page of the book), you would (caveat: I'm not a lawyer, please check) not breach the publisher's copyright on the book.</p>"
