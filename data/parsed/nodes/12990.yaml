      <p>Nick has said it already, but I'll go ahead and put a fine point on it: To be effective, a wayfinding system depends on consistency, sign location, distinctiveness of color, contrast, layout, etc. and on expert spacing of type and other typographic details. The typeface choice will only go so far to bring cohesion; without attention to the arrangement and application of the typeface, it can't do the whole job. In fact, the usefulness of a typeface can be destroyed or minimized by bad application. Develop a strong system, and you'll find that almost any typeface can be plugged into it.</p>
      <p>If you are lucky, there will be an excellent typeface waiting for you:</p>
      <p><a href="http://www.yale.edu/printer/typeface/typeface.html">http://www.yale.edu/printer/typeface/typeface.html</a></p>
