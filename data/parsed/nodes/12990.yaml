      <p>Ralf's blurry tool is interesting, but until you bring it all outside and take a look at it from down the road under real-world conditions, you cannot predict how the any of it will perform. </p>
      <p>What type and grad of retro-reflective material is the simulation based on?</p>
      <p>Believe me there is a big difference between computer simulations and a real sign mounted at the proper height with headlights shining on it from 600+ feet.</p>
