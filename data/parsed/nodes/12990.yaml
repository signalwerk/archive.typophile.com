      <p>I agree with Nick that most typefaces can be used for wayfinding signage, and that as he said it`s important to avoid arbitrarily using a generic utilitarian sans.</p>
      <p>I just would that that altough most typefaces can be used, not all will be appropriate for the specific needs of each project. Some of this factors could be important enough to be accounted in the type selection of a project: the visual and perceptual characteristics of your audience, the environmental noise, visualization distances and conditions, the material and production technique of the signals among others.</p>
      <p>I personally find hard to read signs set in sans serif faces with very enclosed counters such as Helvética at certain lenght of distance (bad eyesight), also all caps I find more difficult at the distance.</p>
      <p>I have found ITC Garamond as well as other roman faces with lower contrast and large x height to work fine in signage because faces like Times with too much contast tend to get fuzzier from far.</p>
      <p>Héctor</p>
