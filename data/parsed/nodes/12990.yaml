      <p>For people on foot, or bicycle, you can use just about any typeface, sans or serif, upper and lower case or all caps. A good designer will make it work, choosing the right weight, size, spacing, leading, colour, layout, etc.</p>
      <p>Only cars and the absurd speed at which they travel make "optimum" typefaces a necessity for certain kinds of highway sign.</p>
      <p>It's important to have a bit of local personality, rather than just use a generic utilitarian sans, because these give an impersonal quality to public space, which makes it unloved and unsafe.</p>
