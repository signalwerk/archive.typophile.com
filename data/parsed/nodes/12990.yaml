  html: <p>Hey all, I'm curious to see the differing opinions on what you think are the best typefaces for wayfinding/information signage. Also, why is it (or why are they) the best? Flaring? Immediate character recognition? Open characters? Let's hear some viewpoints.</p>
  html_clean: <p>Hey all, I'm curious to see the differing opinions on what you think are the best typefaces for wayfinding/information signage. Also, why is it (or why are they) the best? Flaring? Immediate character recognition? Open characters? Let's hear some viewpoints.</p>
