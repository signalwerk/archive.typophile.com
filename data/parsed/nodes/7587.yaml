    date_raw: null
    votes: null
    html: <p>I think you are using the term choke incorrectly. In the situation you describe the dark type will remain unchanged, and you will "choke" the background to created the trap. If you had light type overprinting a dark background you would "spread" the light type into the dark background to create the trap.</p>
