  html: <p>I have a question about trapping type.  <br> <br>I am printing on the surface of a clear plastic "bottle" which has a reflective core. It makes for a great effect although I am fighting the obvious, readability. I wonder whether or not to place the dark type against a white ground to bring out the brand. I worry about problems with registration with a second ink and whether to trap  (choke) the type.  <br> <br>Any thoughts, or experience?</p>
  html_clean: <p>I have a question about trapping type.  <br> <br>I am printing on the surface of a clear plastic "bottle" which has a reflective core. It makes for a great effect although I am fighting the obvious, readability. I wonder whether or not to place the dark type against a white ground to bring out the brand. I worry about problems with registration with a second ink and whether to trap  (choke) the type.  <br> <br>Any thoughts, or experience?</p>
