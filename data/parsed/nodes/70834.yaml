    html: |-
      <p>But the AFDKO autohinting program is probably not setting the stem and blue values automatically, but expects, that they are present in the font. As far as I remember it only computes the glyph individual hints, but not the font global hinting parameters. I assume, that you can set the alignment zones and stem values also with FontForge.</p>
      <p>The AFDKO contains a program, with the help of which you can compute the heights and depths of glyphs and the frequences of stem widths.</p>
      <p>But if you are not experienced with the AFDKO, I recommend, that you first use TypeTool for autohinting. It probably is setting the stem width values automatically and (if it uses the same procedure as FontLab!) in my experience it does a relative good job there. And then you can use the AFDKO for regenerating (overwriting) the hints.</p>
      <p>----------</p>
      <p>Have a look at this: <a href="http://forum.fontlab.com/typetool/turn-off-blue-alignment-zones-t7007.0.html" title="http://forum.fontlab.com/typetool/turn-off-blue-alignment-zones-t7007.0.html">http://forum.fontlab.com/typetool/turn-off-blue-alignment-zones-t7007.0....</a></p>
      <p>Seems to be, that at least displaying the alignment zones with TypeTool is undocumented.</p>
