      <p>Good question. I don’t find anything about that in the manual and the font info dialog does not have a hinting section. For the case, that it is not possible to set the alignment zones with TypeTool, you can decompile the font with TTX and insert the zones manually. They are stored in the cff table.</p>
      <p>Example:</p>
      <p><code>&lt;Private&gt;<br>
      Primary Zones (in this example you have four): &lt;BlueValues value="-250 -240 -10 0 420 435 590 600"/&gt;<br>
      Secondary Zones (in this example you have two): &lt;OtherBlues value="460 470 570 580"/&gt;</code></p>
      <p>Other important hinting parameter:</p>
      <p><code>&lt;BlueScale value="0.04"/&gt;<br>
      &lt;BlueShift value="7"/&gt;<br>
      &lt;BlueFuzz value="1"/&gt;<br>
      &lt;StdHW value="80"/&gt;<br>
      &lt;StdVW value="110"/&gt;<br>
      &lt;StemSnapH value="80 90"/&gt;<br>
      &lt;StemSnapV value="70 110"/&gt;<br>
      &lt;ForceBold value="1"/&gt;<br>
      …<br>
      &lt;/Private&gt;</code></p>
      <p>But it would be odd, if you can set hints with TypeTool, but no alignment zones. Or can you autohint your font with TypeTool only? If yes, I recommend to autohint the font with the autohinting program belonging to the AFDKO.</p>
      <p>No, you can edit hints with TypeTool. It would be very odd, if you can’t edit alignment zones likewise.</p>
