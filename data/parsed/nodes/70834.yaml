      <p>Does anybody know, if there is a way to unlock the alignment layer in TypeTool? The shortcut for viewing the layer is ctr-shift-z on Windows. That is undocumented but it is the same shortcut as in FontLab. But there is no default shortcut for unlocking the alignment layer in FontLab. So I wonder, whether the shortcuts are stored in the registry. If they are stored there, it is maybe possible to store a key with the unlocking shortcut in the registry for TypeTool. I cannot understand, that you can change the individual hints in TypeTool, but not the global hinting parameters.</p>
      <p>---------------</p>
      <p>By the way, I dislike it, that the FontLab tools share the directory with the encoding files and other important files. I wish, that each program would store its data in its main installation directory only.</p>
