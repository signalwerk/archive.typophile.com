      <p><cite>i am just looking to be able to set a global overshoot per font</cite></p>
      <p>The alignment zones are global. All glyphs, that are in a zone with their tops/bottoms are aligned to the same height/depth (in low resolutions).</p>
      <p>You need different alignment zones for the capitals and small letters for example, where both groups share the same bottom zone. So you had three alignment zones in this case. Additionally you may need an alignment zone for the ascenders and descenders and small caps. Maybe also for certain groups of figures.</p>
