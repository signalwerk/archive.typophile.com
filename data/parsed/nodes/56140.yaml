  html: |-
    <p>In comparison, to lets say Arabic typography, or Japanese typography what do you think is a more appropriate name for typographical systems of the western scripts ?</p>
    <p>Do we call it Latin typography ? Western typographical systems ? Typography of English letters etc.?</p>
    <p>I am stumped because I cannot find one word which encompass the typography of Latin based scripts.</p>
    <p>Your kind comments are solicited.</p>
