      <p>I would echo Florian — of all the possible dashes &amp; hyphens, the one that belongs in the middle of a range (this year to that year) is an en-dash, with half spaces to a full space before and after. I'm not sure if you're in the States, but that's the convention here.</p>
      <p>I personally prefer the Neutra, with perhaps more tracking on the first names. </p>
      <p>It looks like, when the time comes, 4 digits for a death year won't fit under Mary E and still align right — not sure if you want to adjust for that.</p>
