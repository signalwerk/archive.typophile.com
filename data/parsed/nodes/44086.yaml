    <p>Perhaps this is the wrong forum, but it's a follow up to <a class="freelinking external" href="http://typophile.com/node/39537">this thread about designing my father's gravestone</a> that was originally in general discussion. The urgency of a font selection froze along with the earth, so I've been able to obsess far too long on this decision. I need fresh eyes.</p>
    <p>Due to family vetoes, these are the only two approved typefaces; Aichel or Neutra Text. Opinions? Kerning issues? Aghast for any reason? Feedback of any kind is welcome. It would be great to hear from an actual stonecarver, if there's one here. The stone itself is a mock-up, but it is nearly identical to the gravestone my mother chose. </p>
    <p>Thanks,<br>
     Eileen</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Burke-gravestone-NEUTRA-550px_5736.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Burke-gravestone-AICHEL-550px_4513.jpg"></div><p></p>
