      <blockquote><p><strong>JamesT: </strong>So if I were to buy "abcd" I presume I would download a font containing "abcd" if I then return and buy "efghi" would I get a new font containing "abcdefghi" which would require me to uninstall "abcd" and hope the versions don't conflict or that all caches have been cleared (even though that isn't always a guarantee).</p>
      <p>How would the average user go about dealing with multiple variations of the same font?</p></blockquote>
      <p>Hey James. Great question. This was actually one of the tests we performed in our testing phase. We wanted to make sure users could easily upgrade an abridged font without too much hassle. To the operating system, two different abridged versions of the same font will appear to be identical. Thus, when you install the upgraded version, it will overwrite the older version. Some software applications will need to be restarted before they will recognize the upgraded font, but this is the case when installing any new font, abridged or not.</p>
