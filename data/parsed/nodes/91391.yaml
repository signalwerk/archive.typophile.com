    html: <p>Yes as part of my old day job I had to vectorise loads of crappy pixelated logos. If we didn't have the font, it was often way more cost effective to trace the characters needed (it's what got me into making fonts in the first place) than buy the font. In this situation a pay-by-glyph system would be useful. I wonder how big this specific Market is. If this system took off I wonder how long it would be before section, paragraph, currency symbol and all the other virtually pointless glyphs we feel obliged to include in our (display) fonts cease to be made.</p>
