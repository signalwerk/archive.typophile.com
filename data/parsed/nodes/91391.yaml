      <blockquote><p><strong>tourdeforce: </strong>Or if I understood it well (just saw your website), you will establish first the price of an font (i.e. $25 for full character set, like from i.e. MyFonts). Then based on (total) font price, you'll assign an "glyph price"?</p></blockquote>
      <p>Great question. The price for an unabridged font is established by the foundry. In most cases, it will be the same price as MyFonts and other distributors. When a user makes a purchase, the price is calculated using the following formula:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/formula_5691.jpg"></div><p></p>
      <p>PF = The price of the unabridged font (set by the foundry)<br>
      GO = The number of old glyphs (purchased by the user in the past)<br>
      GN = The number of new glyphs (not yet purchased by the user)<br>
      GT = The total number of glyphs in the font<br>
      b = The sharpness of the pricing curve (normally set to 2)</p>
      <p>Note that if the user purchases all glyphs in the first purchase, then GO must equal zero and GN must equal GT. Thus, the formula reduces to PF (the price of the unabridged font set by the foundry).</p>
      <p>I hope this helps! Let me know if you have any more questions.</p>
