      <p>Recently, Google has launched its web fonts site, with the emphasis on the functionality of the site as a design tool, and the functionality of the font formats and licensing model, but has been <a href="http://www.typographyforlawyers.com/?page_id=3207" rel="nofollow" class="link-external">criticized</a> for the overall quality of the fonts available. Nonetheless, its fonts are being used; because Google is massive, a beneﬁt you don’t have.</p>
      <p>I would suggest you either solicit particular foundries with product that you think will give you a distinct design proﬁle to match and complement your business model (curation option), or approach a foundry/publisher which can provide you with a large collection that spans the major type categories. </p>
      <p>Actively seeking speciﬁc content would, in my opinion, be better than just saying “open for business” and taking what comes.</p>
