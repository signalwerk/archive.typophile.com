      <p>The “designer fonts” with which you intend to populate your site seem to have been left to the last minute, as if the product, in contradiction, is generic.</p>
      <p>In my experience there are two models a new distributor can adopt: either a small, select, carefully curated group of typefaces—or a large enough volume of common styles in which keyword searching can come into play.</p>
      <p>The ﬁrst option grows into the second over time.</p>
      <p>For instance, when Apple launched DTP, part of its success was having Helvetica and Times bundled with the LaserWriter software: instant cred.</p>
      <p>Recently, Google has launched its web fonts site, with the emphasis on the functionality of the site as a design tool, and the functionality of the font formats and licensing model, but has been <a href="http://www.typographyforlawyers.com/?page_id=3207" rel="nofollow">criticized</a> for the overall quality of the fonts available. Nonetheless, its fonts are being used; because Google is massive, a beneﬁt you don’t have.</p>
      <p>I would suggest you either solicit particular foundries with product that you think will give you a distinct design proﬁle to match and complement your business model (curation option), or approach a foundry/publisher which can provide you with a large collection that spans the major type categories. </p>
      <p>Actively seeking speciﬁc content would, in my opinion, be better than just saying “open for business” and taking what comes.</p>
