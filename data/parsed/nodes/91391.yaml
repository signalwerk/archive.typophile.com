      <p>Great questions Jackson. I hope the following helps.</p>
      <blockquote><p><strong>Jackson: </strong>Does your iTunes model mean you only take 30% commission?</p></blockquote>
      <p>Our commission <em>can</em> be as low as 30%, but the exact percentage will depend on a number of factors, such as the level of exclusivity (there will be three) and whether or not the font is being actively promoted. We also realize that there's probably not a one-size-fits-all distribution agreement, so we plan on working with each foundry individually to come to an agreement that works for both parties. We want to treat our foundries like royalty, even if that means hiring more employees to handle all of our accounts.</p>
      <blockquote><p><strong>Jackson: </strong>How would this work with modern fonts (i.e.: OT Kerning and OpenType features)? What about version control, particularly with customers who need to share documents?</p></blockquote>
      <p>It took months of careful programming to create the algorithm that produces abridged font files. In a nutshell, the algorithm analyzes each line of the original font file and determines what type of information it contains. The algorithm won't even consider altering the line unless it contains spline data, which is the only data within a font file that is absolutely necessary to reproduce the shape of a particular glyph. If a user has rights to a certain glyph, then the spline data is left untouched. If a user doesn't have rights to a certain glyph, then the spline data is removed. All other information (including kerning and OpenType data) is left untouched. As long as the user has rights to the necessary glyphs, all OpenType functionality will remain intact. The abridged font is identical in every way to the original file, save the missing spline data for unlicensed glyphs. This means that version control would be handled the same way it is now.</p>
      <blockquote><p><strong>Jackson: </strong>Have you done any research that suggests there are enough customers setting only headlines for this model to make any money for a foundry partner?</p></blockquote>
      <p>It's true that FontSlice will be <em>most</em> useful to users that are typesetting display copy. However, assuming a user is able to predict which character ranges would be required for a particular application, there's no reason why FontSlice wouldn't be used for larger amounts of text. We also believe that users will prefer to consolidate their font property in one place, whether they're buying abridged or unabridged fonts.</p>
