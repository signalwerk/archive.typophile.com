      <blockquote><p><strong>aluminum: </strong>I can see the niche use where one needs to deal with a slogan or logotype or sign, perhaps. But I don't quite see how this would have much mass appeal.</p></blockquote>
      <p>I definitely see where you're coming from, but I do believe the mass appeal is there. If you look through the top 100 most-downloaded fonts of all time on dafont.com (a free font website), you'll find that most of these fonts are downloaded hundreds or thousands of times <em>per day</em>. You'll also notice that nearly every font in that list is a display font (very few would actually work for body text). The font market is <em>massive</em>, but I don't believe its currently in equilibrium; consumers can either pay $25 or $0 with very little in-between. FontSlice offers a simple model for bringing the market into equilibrium. People who may have never paid for a font before might be able to justify paying a dollar or two for a font through FontSlice. This will acclimate consumers to the idea of paying for high-quality fonts in general, which may expand the market even further.</p>
