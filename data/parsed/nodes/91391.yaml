    html: |-
      <p>Being an old fart and remembering what it used to cost to get a few lines of text set for one-time use, I have a tough time seeing how $25 dollars could be a barrier to anyone for the purchase of a font.  I made a little experiment.  I started off the sale of a display font with 640 glyph character set at what to me was a very under-priced $20 ( I felt that $35 was the fair price I should have set to begin with).  Later, I put it on sale at half price [as in 50% off or only 10 bucks].  The funny thing is, I sold more fonts [units]  in less time at $20 dollars that I did at half price by a two to one margin! Here is an example:<br>
      20 units @ $20 sold in TEN days equals $400<br>
      10 units @ $10 sold in THIRTY days equals $100 [this also came with added advertising on MyFonts on Sale list].</p>
      <p>Clearly, the scrapbookers are not interested enough in my $10 dollar font to get anywhere near close to matching either sales or profits from the real professional type users who were happy to pay only $20 and perhaps were wondering to themselves, "There must be something wrong with this font if it only costs $20."</p>
      <p>There are two ways to look at this.  I could drop the price to a ridiculous five dollars to entice the scrapbookers or decide they are not worth the effort.  For me to make five dollar fonts, they would need to be bare-bones minimum character set and not all that carefully done. There are plenty of folks happily making money doing this who are content with themselves and their work doing this.  Hats off to them.  For me, I just don't want to make shit and call it type just to make some money.  I would so hate that!  I might as well work at McDonalds and serve shit food at minimum wage.  I would rather just ignore the hobby market and try to appeal to the people who really care about type.  Maybe I will fail at that and misunderstand what the professional market wants, expects, and is willing to pay, but I can live with that kind of failure.  I could not live with the other kind of failure though, where I make shit type that sells for shit but makes a profit because that market does not give a shit.</p>
    html_clean: |-
