      <p>Well, as the skeptics already have spoken (consider me one too), I’ll play the devil’s advocate here and picture a scenario where this kind of service might be of benefit:</p>
      <p>As a graphic design studio, we receive a number of logotype files from different institutions/companies, to include them in some brochure or poster. Dealing with graphic laymen, the problem is that these files aren’t fit for print: pixelated GIF, embedded DOC, you name it. Very often, this is about a few characters only, from an easily identifiable and common typeface, without any modifications. It would be a matter of minutes to download the font and re-set the damn line. We don’t do that, because we don’t want to spend money on lame ‘classic’ fonts that we don’t like, and won’t ever need again. I prefer spending money on good fonts.</p>
      <p>So, what to do? Lose hours of time trying to reach someone who can send us a good file? No, that’s hopeless (“But I already sent you our logo twice!”, “Just grab it from our website! It’s on the top left.” “Speak to our IT guy. He’s back next week.”). Simply send the crappy files to the printer and not care? Hardly.  </p>
      <p>This may sound far-fetched, but it happens all the time. In these cases, I wish for a pay-by-the-letter service. As a workaround. The critical points raised (versions, kerning, OT features, hinting) all hardly apply.</p>
      <p>I doubt that this is enough to build a business model on. But maybe the target group of FontSlice is not us professionals, anyway?</p>
