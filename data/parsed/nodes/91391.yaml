      <blockquote><p><strong>riccard0: </strong>So all glyphs are equal under the sky?</p></blockquote>
      <p>You make a fair point Riccardo. Our pricing model does assume that each glyph represents an equal amount of effort, which is certainly an oversimplification. We realize that some characters require a great deal more effort than others. For example, building an accented character takes far less time than designing the components that it references. When we were designing our pricing model, we considered adding terms that would account for these different levels of complexity. In the end, however, we decided that the addition of such complexity would breed further complexity. We didn't want to end up with something akin to the U.S. tax code, so we decided to stick with a simple formula. However, our ears are open. If this pricing model doesn't work for the type community, then let's start that discussion.</p>
