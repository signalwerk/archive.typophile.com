      <blockquote><p>To the operating system, two different abridged versions of the same font will appear to be identical. Thus, when you install the upgraded version, it will overwrite the older version. Some software applications will need to be restarted before they will recognize the upgraded font, but this is the case when installing any new font, abridged or not.</p></blockquote>
      <p>I wonder if, even still, you'll run into the caching problems that JamesT brought up. In my experience, if you keep reinstalling fonts with the same name, eventually you'll run into trouble like disappearing glyphs, etc.</p>
