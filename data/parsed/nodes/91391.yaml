      <blockquote><p><strong>Florian Hardwig: </strong>As a graphic design studio, we receive a number of logotype files from different institutions/companies, to include them in some brochure or poster. Dealing with graphic laymen, the problem is that these files aren’t fit for print: pixelated GIF, embedded DOC, you name it. Very often, this is about a few characters only, from an easily identifiable and common typeface, without any modifications. It would be a matter of minutes to download the font and re-set the damn line. We don’t do that, because we don’t want to spend money on lame ‘classic’ fonts that we don’t like, and won’t ever need again. I prefer spending money on good fonts.</p>
      <p>So, what to do? Lose hours of time trying to reach someone who can send us a good file? No, that’s hopeless (“But I already sent you our logo twice!”, “Just grab it from our website! It’s on the top left.” “Speak to our IT guy. He’s back next week.”). Simply send the crappy files to the printer and not care? Hardly.</p>
      <p>This may sound far-fetched, but it happens all the time. In these cases, I wish for a pay-by-the-letter service. As a workaround. The critical points raised (versions, kerning, OT features, hinting) all hardly apply.</p>
      <p>I doubt that this is enough to build a business model on. But maybe the target group of FontSlice is not us professionals, anyway?</p></blockquote>
      <blockquote><p><strong>daverowland: </strong>Yes as part of my old day job I had to vectorise loads of crappy pixelated logos. If we didn't have the font, it was often way more cost effective to trace the characters needed (it's what got me into making fonts in the first place) than buy the font. In this situation a pay-by-glyph system would be useful.</p></blockquote>
      <p>You both bring up a good point. The problem of vectorizing old logos is certainly one of the many applications of FontSlice. In this case, the underlying problem is that your limited usage of an asset doesn't justify the cost. This argument could be made whether you're designing logos or any variety of other media, such as advertisements, blog headers, brochures, covers, invitations, or posters; all of these applications may only require a small subset of glyphs. Of course, if you only purchase 'good' fonts, then you can use them time and again, but fonts are often chosen for specific projects and designers may not want to commit to a font if they're unsure how useful it will be to them in the future. FontSlice lowers that initial barrier to consumption and allows the user to make this commitment over time. While professional designers are certainly a part of the target market, I believe FontSlice will attract people who previously may have never even considered paying for a font.</p>
