      <p>I’m not sayin’ this kind of purchasing model isn’t right for anyone:</p>
      <p>but for those who need to finalize the simulation of a design before the editorial work is complete, like, e.g. Roger Black, stopping composition to “buy a vowel” is a joke we talked about in the past. </p>
      <p>there are 300,000 free, 80,000 commercial, 400,000 floating on the web and 5,000 or so people offering custom fonts, fonts &amp; fonts. I think, and there’s plenty of evidence to back it up, that $25-$40 for great commercial fonts is not a barrier for someone who wants to pay something; while 15¢-$1.00 is too much of a barrier for someone who doesn’t want to pay anything.</p>
      <p>technically this model is not a big deal for those who serve subset fonts to speed their way along the web. Off the web, serving identically named fonts potentially with 1,000’s of different glyph repertoires, and having those loose legally or illegally in local and wide area networks — is an IT/IP/I think/IC a nightmare. </p>
      <p>it should be interesting, what vendors and what users will go for it. </p>
      <p>Good luck David Jones!</p>
