      <p>There are certainly some similarities in our business models, but there are some <em>major</em> differences. At its core, FontSlice is just another font distributor. At any given time, FontSlice users could own any number of abridged <em>and</em> unabridged fonts, meaning that our platform could completely replace their previous distributor of choice. Our sights are set high: we want to be the MyFonts replacement. (I know, I know — that may take divine intervention — but why dream at all if you can't dream big?) We think we can get there by giving consumers more options.</p>
      <p>Every font distributor has their niche — something that sets them apart from other distributors in hopes of encouraging consumers to shop there. Our niche will be incremental ownership; you can think of it as zero-interest financing for fonts. This concept doesn't come into play at Photo-Lettering. When a user purchases an abridged font on FontSlice, they are actually purchasing a font rather than a vector image. If they already own a portion of a font, they will have incentive to use it again for future projects, purchasing new glyphs as they go. Most importantly, users can still purchase entire fonts as they always have. Thus, FontSlice will be one-stop shopping for the font industry. Like I mentioned earlier, FontSlice will be the gateway drug into the font world. When users are ready to try the hard stuff, they'll already know a dealer. (Okay, maybe I should stop with the drug analogies...)</p>
