      <blockquote><p><strong>brianskywalker: </strong>Jason, what about them? You include only what is necessary for the purchased glyphs. Why include the hints for 'a' when you only bought 'c' and 'd'?</p></blockquote>
      <p>Your right Brian. Its really only necessary to include hinting, metrics, and OpenType information for purchased glyphs. The upside of this technique is that it would result in smaller font files. The downside is that it would take a bit more processing power since the algorithm would need to make a few more decisions about what information to include or omit. It's not clear at this point which method is more advantageous on a large-scale platform, and we may choose to alter the algorithm after we gather server statistics for the first few months. In any case, the end result will be the same: a fully-functioning abridged font that is otherwise identical to the original file.</p>
