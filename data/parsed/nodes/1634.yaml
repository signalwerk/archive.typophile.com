    html: |-
      <p>I E-mailed Fidel Peugeot thanks to this thread. I contacted him because I was looking for a fashion editorial that featured a girl in a fur parka. It was either in SPRUCE or LINE, I couldn't remember which. (LINE &amp; Spruce being 2 Wallpaper* spin-offs from the early 200's). </p>
      <p>I thought such a weird request would easily be ignored.</p>
      <p>But guess what? He still has a copy of the first issue of LINE magazine! And snapped a pic!</p>
      <p><a href="http://i48.tinypic.com/2d8kp35.jpg" title="http://i48.tinypic.com/2d8kp35.jpg">http://i48.tinypic.com/2d8kp35.jpg</a></p>
      <p>That's right! The girl in the fur parka!</p>
