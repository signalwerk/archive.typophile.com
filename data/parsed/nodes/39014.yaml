      <p>I work for a global professional services firm, and so see an *awful* lot of management- and business-speak gibberish. My current favourite is from an ad for Unisys which appeared several times in The Economist. It was a plain orange page with this block of text set in the centre:</p>
      <p><cite>UPGRADE YOUR BEST-CASE SCENARIO.<br>
      UNLEARN OUTSOURCING.<br>
      Even outsourcing's benefits have benefits. The best way to realize them is to unlearn your misconceptions about outsourcing. Unisys Outsourcing Solutions offer the proven processes, unique methodologies, and the innovation you need to manage risk, adapt to change and accelerate the benefits of your best-case transformation scenario. Our Solutions for Secure Business Operations can optimize your business performance and your competitive advantage. For maximizing your full business potential, outsourcing is a win-win scenario. Unlearning is just the beginning.<cite></cite></cite></p>
      <p>Fabulous, isn't it?</p>
