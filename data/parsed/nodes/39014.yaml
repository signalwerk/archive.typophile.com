    <p>Another thread about Veer and Corbis brought me to this wonderful example of babble speak, which is 22% meaningless corporate air. <a href="http://www.corbis.com/corporate/pressroom/PressReleasesDet.asp?ID=71" title="http://www.corbis.com/corporate/pressroom/PressReleasesDet.asp?ID=71">http://www.corbis.com/corporate/pressroom/PressReleasesDet.asp?ID=71</a></p>
    <p>The following were the words I found to be meaningless, or corporate catch phrases ... 131 words out of the original 596.</p>
    <p>Leading Brands for Every Market Segment<br>
    creative resource<br>
    reaffirmed its commitment<br>
    a provider of visual elements and design-related products<br>
    strategic market approach<br>
    network of brands<br>
    accelerate its growth in the commercial space.<br>
    seizing this opportunity<br>
    period of market disruption<br>
    take bold steps toward capturing momentum<br>
    fastest growing, leading brands across the entire spectrum<br>
    leverage Veer’s brand<br>
    resonates strongly with the creative community<br>
    industry-leading integrated brand marketing capabilities<br>
    increase its North American market penetration<br>
    advertising and design space<br>
    its global infrastructure<br>
    to accelerate the growth<br>
    maintain distinct customer propositions<br>
    leverage cross-selling opportunities<br>
    industry-leading<br>
    accelerate our long term growth goals<br>
    bolster our ability to connect with creatives worldwide<br>
    innovating our business<br>
    long-term commitments<br>
    a “network” of brands<br>
    flagship brand<br>
    world’s leading rights services offering<br>
    preeminent collection<br>
    award-winning<br>
    help creatives diverge from the norm</p>
