    html: |-
      <p>James, I don’t think you’re seeing this right.<br>
      You had a similar problem with the S in Recovery.<br>
      This is the way the S is supposed to look in this style, if you’re doing a fairly close revival.<br>
      Try and keep the personality and balance it according to your eye (use drag skew tool), rather than departing from the model entirely.<br>
      BTW, the SB grots are distinctive and British, but not typically British, as there were other sans faces at the time that weren’t so funky.</p>
