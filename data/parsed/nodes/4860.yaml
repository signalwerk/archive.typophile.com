    html: <p>What if the lc_a wasn't connected at the top instead of the bottom? I'm thinking about fast girls at thirstype. not that yours is like that, but the letters are disconnected, similar to the idea of stencils. I think it is fast girls c-cup.  <br> <br>Of your sketches, I think the more rigid the better. Flat and crisp in the join, but curve only in the letter where necessary. The dot over the lc_i helps.</p>
