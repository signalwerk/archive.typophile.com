  html: <p>working on logo for a project that will soon be known as Viral Media.   <br> <br>This organization will be responsible for creating an interchange between professional and amateur artist to share and sample materials from one another. Mainly music.  In a sense, this could become a record label of sorts. <br> <br>Main goal with logotype, have it work as a stencil and have all letters be connected.  This is both to fit the concept of 'continuum' and future stencil applications of the brand (in urban contexts).  <br> <br>I have been having some problems with the A.  I've tried to have have the left side curve back to the right and almost meet it (#0).  But then it looks too chunky between the R and A. <br> <br>In 1, I was trying to have it swell at the bottom to meet the R.  Somewhat successful, but still looks wonky to me.  I had a crossbar in there at one point, but that didn't look right at all. <br> <br>In 2, I have the left side coming straight down to meet an adjusted R (no swell at the bottom).  But then it looks like the right side of the A is higher up, due to its curvature.  Also looks too wide. <br> <br>So, now i am thinking either talk the client out the stencil idea or go for a more traditional monocular lower case A with two cuts (one at the top, and one at the bottom). <br> <br>Your help would be greatly appreciated. <br> <br><img src="http://www.typophile.com/forums/messages/29/36428.gif" alt=""></p>
