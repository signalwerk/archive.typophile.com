    <p><em>My first such request, but sure an important, personal one.<br>
    ( Ooh, And, 'Sorry' for the almost nameless thread title. )</em></p>
    <p>Dear fellow Typophiles,<br>
    What would be your first choices, typeface wise, for / in setting a classic Latin phrase? <em>( Think 'One Sentence Poetry'. Think 'Slightly Smelling Leather Books'. :) Think 'Vintage'. )</em></p>
    <p>I am thankful, as ever, for every single suggestion and hint.</p>
    <p>Thanks,<br>
    Dav</p>
