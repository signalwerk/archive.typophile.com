      <p>Alternatives to Trajan:</p>
      <p>Mario Feliciano's <a href="http://vllg.com/Feliciano/Garda/mudTyper+Weights/" rel="nofollow">Garda</a>;</p>
      <p>Typophile Kris Sowersby's <a href="http://www.klim.co.nz/content/type/karv_01.html" rel="nofollow">Karv</a> (if he feels it is finished).</p>
      <p>Perpetua is always very strong.</p>
      <p>Finally, I don't know what exactly is happening with <a href="http://www.dutchtypelibrary.nl/VanKrimpen.html" rel="nofollow">Romulus</a>, but that would be great. It seems like Frank Blokland is doing optical sizes, and it is not released yet.</p>
