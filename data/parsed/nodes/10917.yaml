    html: "<p>Am I missing something, or are 95% of those keyboard shortcuts actually listed in the Finder menus anyway? <br> <br>Here's a couple of \"hidden\" freebies from the old skool: <br> <br>cmd-up arrow - open a widow for the parent folder (when you have an active Finder window) <br> <br>opt-double-click - folder - opens new folder window while closing the previous one <br> <br>opt-double-click - file/app - opens file/app while closing current window <br> <br>cmd-right arrow on folder in list view - open one level of disclosure arrows (cmd-left arrow reverses) <br> <br>cmd-opt-right arrow on folder in list view - opens full tree of disclosure arrows (cmd-opt-left arrow reverses) <br> <br>cmd-click folder name in title-bar discloses pop-up of folder path <br> <br>cmd-opt-click (select) folder name in title-bar pop-up opens parent/grandparent/... folder while closing current folder <br> <br>opt-click-close widget - closes all wndows <br> <br>cmd-opt-w closes all windows... <br> <br>... <br> <br>and on <br> <br></p>"
    html_clean: "<p>Am I missing something, or are 95% of those keyboard shortcuts actually listed in the Finder menus anyway? <br> <br>Here's a couple of \"hidden\" freebies from the old skool: <br> <br>cmd-up arrow - open a widow for the parent folder (when you have an active Finder window) <br> <br>opt-double-click - folder - opens new folder window while closing the previous one <br> <br>opt-double-click - file/app - opens file/app while closing current window <br> <br>cmd-right arrow on folder in list view - open one level of disclosure arrows (cmd-left arrow reverses) <br> <br>cmd-opt-right arrow on folder in list view - opens full tree of disclosure arrows (cmd-opt-left arrow reverses) <br> <br>cmd-click folder name in title-bar discloses pop-up of folder path <br> <br>cmd-opt-click (select) folder name in title-bar pop-up opens parent/grandparent/... folder while closing current folder <br> <br>opt-click-close widget - closes all wndows <br> <br>cmd-opt-w closes all windows... <br> <br>... <br> <br>and on <br> <br></p>"
