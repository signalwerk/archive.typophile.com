    html: "<p><i>Anyone know a shortcut to getting to the beginning and end of a line (like when editng text in the \"Post\" window of this forum?</i> <br> <br>command + left arrow = move to beginning of line <br>command + right arrow = move to end of line <br>command + up arrow = move to beginning of text <br>command + down arrow = move to end of text <br>option + right and left arrows = move forward or backward one word at a time <br> <br>When you're not in a text box on a web page, these also work: <br> <br>command + left arrow = same as back button <br>command + right arrow = same as forward button <br>command + up arrow = scroll to top of page <br>command + down arrow = scroll to bottom of page <br>option + up and down arrows = scroll up or down one page at a time</p>"
