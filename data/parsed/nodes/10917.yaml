    html: "<p>Photoshop: more or less the same with all Mac graphics apps: <br> <br>cmd-space bar - invokes zoom tool <br> <br>cmd-opt-space bar - invokes negetave zoom <br> <br>ie you're now in the zoom tool, click somewhare to make it work. <br> <br>I think cmd-+ and cmd-- also work for Photoshop (6/7). <br> <br>The exception to this general rule is XPress, where the \"control\" key invokes the zoom tool and \"control-opt\" is negative zoom.</p>"
