  html: <p>This is posted from an OS X help email that I receive daily. <br> <br>Shift-Command-Q - Apple Menu - Log out <br>Shift-Option-Command-Q - Apple Menu - Log out immediately <br> <br>Command-H - Finder Menu - Hide Finder <br>Option-Command-H - Finder Menu - Hide Others <br>Option-Shift-Command-Delete - Finder Menu - Empty Trash without dialog <br>Shift-Command-Delete - Finder Menu - Empty Trash <br> <br>Command-A - Edit Menu - Select All <br>Command-C - Edit Menu - Copy <br>Command-V - Edit Menu - Paste <br>Command-X - Edit Menu - Cut <br>Command-Z - Edit Menu - Undo <br> <br>Command-D - File Menu - Duplicate <br>Command-E - File Menu - Eject <br>Command-F - File Menu - Find <br>Command-I - File Menu - Get Info <br>Command-L - File Menu - Make Alias <br>Command-N - File Menu - New Finder window <br>Command-O - File Menu - Open <br>Command-P - File Menu - Print <br>Command-R - File Menu - Show original <br>Command-T - File Menu - Add to Favorites <br>Command-S - File Menu - Save <br>Command-W - File Menu - Close Window <br>Command-Delete - File Menu - Move to Trash <br>Shift-Command-S - File Menu - Save as <br>Shift-Command-N - File Menu - New Folder <br>Option-Command-I - File Menu - Show Attributes Inspector <br>Option-Command-W - File Menu - Close all Windows <br> <br>Command-1 - View Menu - View as Icons <br>Command-2 - View Menu - View as List <br>Command-3 - View Menu - View as Columns <br>Command-B - View Menu - Hide Toolbar <br>Command-J - View Menu - Show View Options <br> <br>Command-K - Go Menu - Connect to Server <br>Command - [ - Go Menu - Back <br>Command - ] - Go Menu - Forward <br>Shift-Command-A - Go Menu - Applications <br>Shift-Command-C - Go Menu - Computer <br>Shift-Command-F - Go Menu - Favorites <br>Shift-Command-G - Go Menu - Goto Folder <br>Shift-Command-H - Go Menu - Home <br>Shift-Command-I - Go Menu - iDisk <br> <br>Command-M - Window Menu - Minimize Window <br>Option-Command-M - Window Menu - Minimize All Windows <br> <br>Command-? - Help Menu - Open Mac Help <br> <br>ENJOY !!</p>
