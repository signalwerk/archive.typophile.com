    date_raw: 9 Apr 2003 — 1:49pm
    votes: null
    html: "<p>Hmm. Your problem is not your system. (FYI, I run OS  <br>X.2.4, 644MhZ G4, 512MB RAM)  <br>  <br>Next question: are you running Classic apps (OS 9 Apps) or   <br>OS X native apps? I suppose if you're a FOG user (unless   <br>you've switched) then you're using OS 9 for some apps and   <br>OS X for others...  <br>  <br>If that's the case, you will see your Classic apps bog down   <br>under OS X. I'll try to explain. When you launch an OS 9   <br>application from inside OS X, you are launching another   <br>operating system that runs in tandem with OS X. In other   <br>words, OS X and OS 9 are both taxing your processor. Even   <br>simple things like the clipboard occasionally get hung up   <br>when switching between the two OSs. (Sorry if I'm telling   <br>you stuff you already know.)  <br>  <br>I became a happier camper when I quit using OS 9  <br>apps altogether.</p>"
    html_clean: "<p>Hmm. Your problem is not your system. (FYI, I run OS  <br>X.2.4, 644MhZ G4, 512MB RAM)  <br>  <br>Next question: are you running Classic apps (OS 9 Apps) or   <br>OS X native apps? I suppose if you're a FOG user (unless   <br>you've switched) then you're using OS 9 for some apps and   <br>OS X for others...  <br>  <br>If that's the case, you will see your Classic apps bog down   <br>under OS X. I'll try to explain. When you launch an OS 9   <br>application from inside OS X, you are launching another   <br>operating system that runs in tandem with OS X. In other   <br>words, OS X and OS 9 are both taxing your processor. Even   <br>simple things like the clipboard occasionally get hung up   <br>when switching between the two OSs. (Sorry if I'm telling   <br>you stuff you already know.)  <br>  <br>I became a happier camper when I quit using OS 9  <br>apps altogether.</p>"
