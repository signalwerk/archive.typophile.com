    html: <p>To better undersand a "gesture", I usually follow a few links and may also read comments in source files. Those source files can be obtained at the URL <a href="https://github.com/girish-dalvi/Ek-Mukta">https://github.com/girish-dalvi/Ek-Mukta</a> (click on "download zip"); the README.md file is worth reading, with explicit thanks for "support and encouragement". In the <a href="https://github.com/girish-dalvi/Ek-Mukta/blob/master/CONTRIBUTORS.txt">CONTRIBUTORS.txt</a> file it is written that the copyright holders are listed in the <a href="https://github.com/girish-dalvi/Ek-Mukta/blob/master/AUTHORS.txt">AUTHORS.txt</a> file, which contains Girish Dalvi and Ek Type. The link <a href="http://www.idc.iitb.ac.in/~girish/index_en.html">Girish Dalvi</a> may help seeing the link between the Industrial Design Center IIT Bombay and Ek Type.</p>
