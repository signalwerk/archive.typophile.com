    <p>Hi!</p>
    <p>I am new to this forum. VOLT User community recommended this site.</p>
    <p>Mangal is the only Unicode compatible Telugu (Indic) language font released by MS. Two other Unicode compatible fonts Pothana2000 and Vemana are available and are created by Desikachari (Canada). Government of India also released some Unicode enabled fonts on their website.</p>
    <p>I am a TeX user and when I compile documents using the above fonts and XeLaTeX (SIL) except Mangal, Pothana and Vemana the other fonts (Govt of India) are giving bad results. That means they are not properly coded.</p>
    <p>So I started creating a font for this Language. I am following the Pothana2000 layout (glyphs as per Pothana) and using VOLT.</p>
    <p>By trial and error basis I learnt many things. Now my font is working in VOLT Proofing Tool. But when I shipt out the font and install it and use it using WordPad etc. the font is not working.</p>
    <p>I want help in this respect. Please help me.</p>
    <p>The following images help you how I coded my font</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Telugu_volt_one_6302.JPG"></div><p></p>
    <p>Another image</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Telugu_volt_two_6143.JPG"></div><p></p>
    <p>Another image showing font in Proofing tool</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/duvvuri_3504.JPG"></div><p></p>
