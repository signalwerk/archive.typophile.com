  html: |-
    <p>We have a font created in FontLab, generated as an OpenType PS which is being used mainly in InDesign but also in Microsoft Word 2003 and 2010.</p>
    <p>I have the FontLab option turn ON to generate the non-OpenType kern table but for some reason Word is not “seeing” the kerning. If I generate the font as TrueType or Type1 Word using the kerning just fine.</p>
    <p>We have another font that is being used in exactly the same way and that one is fine.</p>
    <p>The other oddity is that Word 2010 grays out all of its OpenType controls on the Font dialog for this problematic font. I’m guessing the two are related but I’m stuck as to what’s going on.</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Thanks,<br>
    Ken</p>
