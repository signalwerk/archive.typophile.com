      <p>Well, while we're on the subject of TTX…</p>
      <p>As some of you may know, one of the things that I would like to implement with my new LUV line (now a Registered Microsoft Vendor!) is a unique serial number for every font sold. Am I correct in assuming that this task could be accomplished at point of sale, simply by converting the font to XML, appending a ten-digit serial number to the Type 1 XUID field, converting the font back to OTF or TTF format, then delivering the finished product via download link? A separate database would, of course, tie the serial number to purchaser data.</p>
      <p>Then, there's the separate issue of dsig. It would be nice to offer digitally signed fonts, but the mechanics of how to implement this element escape me at the moment. Big surprise.</p>
