      <p>None too sure. If you have ttx (which requires Python), you could probably use that to dump the fonts to text and see what tables are there. It's possible, if short of likely, that the TTF child font has a remaining 'kern' table that never got thrown out. 'Course, there may be a checkmark somewhere deep inside the editor that lets it add a 'kern' table to a PS-flavoured OT font. Should be possible as long as there are some kerning pairs. 'kern' can only handle pairs, not classes, it seems.</p>
      <p>Edit: FontForge can do it. Surely the big names can sneak in a 'kern' table, too.</p>
