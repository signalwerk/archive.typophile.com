    html: |-
      <p>Thanks Theunis, but no, I don't think that's the problem. We do, indeed, have a liga feature in the font.</p>
      <p>Té Rowan, I have actually used TTX on the OTF to make sure that kern table was still there as that is what Word would use. It looked to me like it WAS there so I'm still perplexed as to why Word would not be applying the kerning.</p>
      <p>I did solve at least part of this. That being that Word 2010 was graying out its OpenType controls on the font dialog. I'm embarrassed to report that when Word 2010 opens a file created in an earlier version of Word by default it disables the OpenType features. In the Options, in the "Advanced" area, down at the bottom of the page is "Layout options." In that humungous list is the option to disable OpenType features.</p>
      <p>In the little investigating I've managed to do with Word 2010 it definitely treats files created in an earlier version significantly different than doing a new document. I have, for instance, a document created in an earlier version of Word in which I can get NO kerning to work. However, do a new file, use the same font, in the same size and Word uses the class kerning. I've not looked very far into this one as of yet.</p>
      <p>Thanks again guys for the help.</p>
      <p>Ken</p>
