    html: "<p>Hrmmff...! That explains it. Quoted from the MS OpenType spec v1.6: \"OpenType™ fonts containing CFF outlines are not supported by the 'kern' table and must use the 'GPOS' OpenType Layout table.\" Guess you're stuck  with TrueType-flavoured OpenType, then.</p>"
