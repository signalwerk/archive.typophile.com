      <p>I believe some font vendors are already shipping fonts with serialisation, in custom tables, and have been for some time. Workflow is presumably something like this: generate the table, merge it into the font with something like TTX, then apply a digital signature.</p>
      <p>The sfnt table structure enables one to put pretty much anything into a TTF or OTF binary. Even pictures of kittens.</p>
