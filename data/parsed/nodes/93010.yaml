      <p>Although a font made by a Greek person is certainly more likely to exhibit Greek characteristics, the important thing (I assume) is finding the right Greek-looking font no matter who made it. The reader will get more out of the font itself (which he cannot escape) than simply knowing that the designer is Greek (which he might never even find out anyway).</p>
      <p>If you can get in touch with Michail Semoglou* he might be able to furnish you with a nice Hellenized Latin font he showed me a few years ago.</p>
