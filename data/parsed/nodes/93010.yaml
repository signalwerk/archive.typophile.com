    <p>I design a magazine, each issue is about a specific city. The next issue will be about Athens, Greece. I am trying to get in touch with any type designers who live and/or work in Greece, preferably Athens. Do you know of anyone? </p>
    <p>The past 2 issues of the magazine have used typefaces created by high profile type designers in appropriate cities and I wish to continue this precedent by representing the city through the typography. </p>
    <p>Any help or opinions on Greek type please get in touch! thanks. Feel free to email me here: <a href="mailto:hello@luketonge.com">hello@luketonge.com</a></p>
