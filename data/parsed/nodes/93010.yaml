      <p>Hey everyone! thanks so much for the quick responses! Some great leads to explore and follow up. @Nick Shinn you're spot on, for me it is more important to have an authentic greek-designed typeface to use as a headline font throughout the mag than it is to have a 'greek-looking' font. </p>
      <p>Here's Alex Sheldon's 'Detroit' we used for our Detroit issue – <a href="http://typographica.org/typeface-reviews/detroit/" title="http://typographica.org/typeface-reviews/detroit/">http://typographica.org/typeface-reviews/detroit/</a><br>
      and for our latest issue, London, Seb Lester's 'Soho' – <a href="http://www.formfiftyfive.com/2012/05/boat-magazine-london/" title="http://www.formfiftyfive.com/2012/05/boat-magazine-london/">http://www.formfiftyfive.com/2012/05/boat-magazine-london/</a></p>
