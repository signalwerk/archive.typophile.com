      <p>The Detroit font nicely evokes Detroit. Soho sort of evokes London, but surely there are other fonts -probably including some by type designers from London- that evoke it better. I'm wondering what the rationale could be for focusing so much on the geography of the designer. Is there after all any person that's "pure" Athenian for example? What's the criterion for being "from Athens"?</p>
      <p>More useful than a cute play on the idea of a font physically coming from a city would be a font that evokes that city no matter where it was made. For example if you find a font that somehow evokes Athens, but it was made in Thessaloniki, would you rather use a Parisian-looking font made by somebody was born in Thessaloniki but currently lives in Athens? If so, how do you justify that beyond your own whim? This path is clearly fraught with peril...</p>
      <p>A suggestion that's only partly serious:<br>
      <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100000&amp;itemID=200029&amp;cpuCount=" title="http://www.typography.com/fonts/font_styles.php?productLineID=100000&amp;itemID=200029&amp;cpuCount=">http://www.typography.com/fonts/font_styles.php?productLineID=100000&amp;ite...</a></p>
      <p>Related: <a href="http://ww.typophile.com/node/89329" title="http://ww.typophile.com/node/89329">http://ww.typophile.com/node/89329</a></p>
      <p>hhp</p>
