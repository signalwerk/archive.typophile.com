    html: |-
      <p>@hrant, this is all very subjective and i'm not sure that i've explained my position incredibly well... Yes, Detroit the typeface accurately evokes Detroit the city, as it was intended to do. Soho was not meant to represent London, but it does so very well and is hugely versatile for magazine headlines. As for other typefaces 'evoking London better' – perhaps – but I am trying to avoid trite and painfully obvious choices that remove any element of subjectivity or sensitivity from the work. Detroit you could argue does this, but its versatility and complexity elevate it above this. </p>
      <p>The basic rationale is one of authenticity. Of wanting the magazine to truly be 'of the place' Each issue is dedicated to a city, and so when possible I like to match a great typeface or family by a local type designer, to represent that place. In answer to your question, No, I'm not so daft that i'd pass up a great typeface by someone from another Greek city, and go with something less-suited to the issue from a 'pure-athenian'. So yes, the primary task is to find a typeface that represented both the look and feel of the city – but to narrow the huge pool of options a good place to start is by looking at type designers from that city. They are also usually more interested in their type being used to represent 'their' city, and as such generally are happy to donate their typeface in exchange for the exposure the magazine gives them. </p>
      <p>And yes, as the art-director of the magazine, my whim also plays a part. </p>
      <p>The tricky part is finding a typeface that represents a city I've never visited. We spend time in the city making the magazine but time constraints sometimes dictate needing to get a head-start on the process, hence me doing some research and investigation in advance. </p>
      <p>Anyway, enough waffle. A modern, Greek, authentic typeface is what I'm after :) thanks so much for taking the time to engage with me about this! I hope i've made sense.</p>
