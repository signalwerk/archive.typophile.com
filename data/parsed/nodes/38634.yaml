    <p>Hi everyone<br>
    I’m quite a fan of Phil Baines’ work — as an author, a teacher and a graphic designer — and I recently read that he also designed several typefaces, some of which I already knew — Vere Dignum for Linotype, FF Can You for FontFont. Yet it appears that his typographic œuvre is wider than that and I wondered if anyone at Typophile had ever seen two other designs by Baines I’ve heard about, Toulon and Horncastle (both 1994).<br>
    Thank you very much.</p>
