    <p>hello,</p>
    <p>i´m searching for a good font to accompany an akzidenz grotesk logo. i had "ag book bq" in mind but would rather use something a bit more different to that... any ideas wellcome! the purpose is to use the font for longer texts as in contracts and agreements so that legibility is quite important...</p>
    <p>curious, lina</p>
