    html: |-
      <p>In the sixties, they might have used News Gothic (or Trade Gothic) for text. Frequently, the face used for display may not have been readily available, so they would use something relatively similar for smaller sizes. (This suggestion is based on an actual example--the original cover the the book 2001 A Space Odyssey.)</p>
      <p>If you want it to look "'60s architectural" I would stick with sans serifs.</p>
