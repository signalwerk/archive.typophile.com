    html: <p>They used to mix fonts in ways that would now be considered odd, mostly out of practical necessity. I forgot to mention that the largest type (the title) on that cover was Futura Bold. I think when there is a difference in scale you can get away with type combinations that would not work if they were the same size or close to the same size.</p>
