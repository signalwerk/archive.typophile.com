      <p>I bought the Mendoza book a few weeks ago and there is one mention of a book using Photina:<br>
      Methods of Book Design, by Hugh Williamson (Alden Press).</p>
      <p>Also a mention that the Oxford University Press adopted Photina for their books.<br>
      Photina was launched in December 1971, so that should give you a start of that period…</p>
      <p>Cheers,<br>
      Bert</p>
