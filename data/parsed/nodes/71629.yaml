    html: '<p>One importand book typeset in Photina is the third edition of <em><a href="http://yalepress.yale.edu/yupbooks/book.asp?isbn=9780300030358" rel="nofollow">Methods of Book Design</a></em> by Hugh Williamson (New Haven and London: Yale University Press, 1983). Williamson was a great fan of Photina, ‘an early example of a type-face originally designed for photo-composition’.</p>'
