    <p>Hi all,</p>
    <p>I have recently bought Photina, and I'm totally in love with it. I've been trying to do some research on Photina and it's designer, and really appreciated the article over at I Love Typography on Jose Mendoza de Almeida. But the one thing I haven't found yet are books or other printed matter set in Photina. Especially I would be interested in examples of combinations of Univers and Photina. Can anyone help me out?</p>
    <p>Thanks<br>
    Jeffrey</p>
  html_clean: |-
