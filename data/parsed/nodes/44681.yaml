    html: |-
      <p>Kent's improvements on Joanna are very subtle; I admire his work here very much, especially the larger counter for the lower case a, which sets a tone of clarity and balance throughout all Whitman usage. For me, the Joanna italics, which seem to belong to another family, serve as an unwelcome speed-bump for the reader, though others love them for precisely that effect...also Joanna's figures seem crude, whereas Whitman's figures look right to the point of transparency. </p>
      <p>All in all, the appearance of Whitman allowed me to get the Joanna roman look without the Joanna problems. Whitman seems so right it achieves transparency.</p>
    html_clean: |-
