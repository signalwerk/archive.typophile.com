    html: |-
      <p>From the sublimity of "Victorian Review," I take you to what many consider the height of ridiculousity: ice fishing. Book designer Brian Donahue has submitted sample pages for a photo book on that subject, and he's used Joanna as his text face:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Joannaicefishing_6688.jpg"></div><p></p>
      <p>I was not thrilled when I read his note before opening the file, for Joanna has never been a favorite of mine. I like the "idea" of Joanna, but have rarely seen it used well. But this book may help me appreciate the face. It is well suited to the matter. Its overall sharpness evokes that first great lungfull of cold winter air. Its "f" looks like something one could catch an eelpout on. I'm really happy with the choice.</p>
      <p>My dislike of Joanna goes back to metal days. Few USA Monotype houses had mats for Joanna,  so if one wanted Joanna, choice was limited. Los Angeles Typefounders set a lot of horrendous Joanna for me once. It appeared that sorts had been cast on wrong set widths, and the line composition had to be re-worked by hand.</p>
      <p>&amp; the first versions I saw for photo and digital also had major problems. So I just put it out of mind. "Victorian Review" and this ice fishing book suggest I should re-look at the face.</p>
      <p>At times in the past when I wanted the "feel" of Joanna I used Chaparral. Whitman is, of course, a much better face for text setting.</p>
      <p>powers</p>
