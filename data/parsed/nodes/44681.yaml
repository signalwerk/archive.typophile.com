    html: |-
      <p>Joanna has been used a number of times with University Press books -- I designed a book for the University of Illinois Press, set using Linotron 202 Joanna. I forget the title, but can look it up if you really need it.</p>
      <p>In spite of that, Gill's best text font available in major foundry form (i.e., Linotype, Monotype) was probably Pilgrim. I remember a lecture by Ron Costley where he remarked that none of Gill's fonts was a very good for setting book-length text. Afterwards, I asked him about Pilgrim, &amp; as I remember, he did allow it could be quite good for text, just damaged by the poor character fit in the Linotron 202 offering. With PostScript, that could be easily fixed.</p>
      <p>FWIW</p>
