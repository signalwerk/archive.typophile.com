    <p>Greetings, fellow typophiles. I have a question that verges on the edge of legality, but I believe remains within the realm of moral responsibility. If you believe that this is not so, let me know, and I'll gladly withdraw the request. My situation is this: I've bought a suite of Mrs Eaves a while ago, with ligatures and small caps as separate TT files, and would now like to combine them into one OT font. I know of the existence of the official OTF version offered by the foundry, but can't justify spending so much for something I already own. I've just started learning FontLab, and wonder if the process would have to be too labor intensive, of if there were a trick in combining fonts.<br>
    Thanks in advance.</p>
