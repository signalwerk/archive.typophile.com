      <p>Um. last time I looked, Adobe Garamond didn't have small cap figures, just oldstyle and lining. But last time I looked, Mrs. Eaves had all three. So what feature did you use to access them?</p>
      <p>As far as "stealing" Adobe's feature code, I don't think they would mind particularly. The old code from AG is pretty much the same as the examples that come with FontLab. Beyond that, we discuss ways to write code on this forum; we expect others to use what is helpful.</p>
      <p>And the naming conventions aren't exactly Adobe's property either, but it does pay to read what they've published about how an extraction of text from a PDF file works.</p>
      <p>What everyone is concerned about is that you agreed to abide by certain conditions when you licensed the right to use some software -- in this case, a font -- and have now shown a willingness to go back on your word.</p>
      <p>Charles Ellertson</p>
