    html: |-
      <p>This is pre-digital, so any suggestions will likely be close but not exact.</p>
      <p>"BACKED WITH" appears to be Futura Book (or Light) Italic.</p>
      <p><a href="http://new.myfonts.com/fonts/adobe/futura/book-oblique/" title="http://new.myfonts.com/fonts/adobe/futura/book-oblique/">http://new.myfonts.com/fonts/adobe/futura/book-oblique/</a></p>
      <p>"DANNY KAYE" is Century Schoolbook Bold Condensed. Bitstream's is good, but the strokes are a tiny bit heavier than in this image.</p>
      <p><a href="http://new.myfonts.com/fonts/bitstream/century-schoolbook/bold-condensed/" title="http://new.myfonts.com/fonts/bitstream/century-schoolbook/bold-condensed/">http://new.myfonts.com/fonts/bitstream/century-schoolbook/bold-condensed/</a></p>
      <p>"MYTI KAYSI" and "SONG"...based on the S and M, I like Railroad Gothic or Gothic No. 13. However, Railroad's A has a much thinner crossbar.</p>
      <p><a href="http://new.myfonts.com/fonts/redrooster/railroad-gothic-rr/" title="http://new.myfonts.com/fonts/redrooster/railroad-gothic-rr/">http://new.myfonts.com/fonts/redrooster/railroad-gothic-rr/</a><br>
      <a href="http://new.myfonts.com/fonts/adobe/gothic-13/" title="http://new.myfonts.com/fonts/adobe/gothic-13/">http://new.myfonts.com/fonts/adobe/gothic-13/</a></p>
      <p>"DODGERS" appears to be Akzidenz Grotesk Bold Condensed, or one of its derivatives.</p>
      <p><a href="http://new.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/bold-condensed/" title="http://new.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/bold-condensed/">http://new.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/bold-condensed/</a></p>
      <p>Agree that "Oh, Really?" is Century Schoolbook Italic.</p>
      <p><a href="http://new.myfonts.com/fonts/bitstream/century-schoolbook/italic/" title="http://new.myfonts.com/fonts/bitstream/century-schoolbook/italic/">http://new.myfonts.com/fonts/bitstream/century-schoolbook/italic/</a></p>
      <p>I would hazard a guess that "R-20,105" is News Gothic Bold. It could also be Franklin Gothic, bue News Gothic's 1 seems to me to be a better match.</p>
      <p><a href="http://new.myfonts.com/fonts/bitstream/news-gothic/bold/" title="http://new.myfonts.com/fonts/bitstream/news-gothic/bold/">http://new.myfonts.com/fonts/bitstream/news-gothic/bold/</a></p>
      <p>-NJ</p>
