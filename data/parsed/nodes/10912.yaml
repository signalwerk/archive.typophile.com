    html: <p> Numerical influence aside, i really like some of the forms. the second s is really great. It seems like most type designs play with the veneer of letterforms, but don't challenge the basic form. i don't typically care for faces that use numerical elements to mimic letters, it's a trick that's been done before, but i think that you have taken it one step further here. there are a few really unique shapes. i also dig the f and the second a. <br> <br>cr </p>
