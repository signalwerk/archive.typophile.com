  html: <p>Numerica was inspired by Herbert Bayer, , Paul Renner, and JanTschichold and the Bauhaus deconstruction-simplification movement. I thought  ..what if these designers had been doing type in the 1960's and not 1920's. Add to that the element of numerical forms. And I would guess you would end up with Numerica.  <br>I used this for Design Alchemy collateral until Dec. 2001. <br><img src="http://www.typophile.com/forums/messages/29/849.jpg" alt="Numerica.jpg"></p>
