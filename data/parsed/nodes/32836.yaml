    html: <p>You may find it interesting that both the Euro symbol and the Estimated sign were not to be tampered with, but to have precise forms in all use. This was then immediately ignored by type designers in the case of the Euro. Tradition has normally had currency symbols styled to match the faces they are a part of.</p>
