      <p>&gt; <em>and what typefaces carry this</em></p>
      <p>You'll find the <a href="/wiki/estimated" class="freelinking" rel="nofollow">estimated</a> symbol in all Adobe's (alphabetic) fonts. Some of these fonts even carry "alternates" of it, like the small cap variation in Minion Pro, and the alternate form in Garamond Premier Pro. These were just made to harmonize better, but such variations are uncommon.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/estimated_3740.png"></div><p></p>
