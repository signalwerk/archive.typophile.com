  html: |-
    <p>Hello all,</p>
    <p>I am a newcomer to this forum and look forward to learning from you. I have been working in the industry for a while as a packaging designer. </p>
    <p>My co-worker and I are stumped as the official name for this symbol and what typefaces carry this. It has been identified as the "euro" but that is for currency. This is often used in weight claims in beauty / body products. Anyone can help with this one?</p>
    <p>Thank you,<br>
    C</p>
