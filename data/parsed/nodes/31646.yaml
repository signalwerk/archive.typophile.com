      <p>"Aluminum - sounds cool. Some time to explore, I like it. Have any examples of type projects you’ve been up to? I’m still new so I’m not quite sure how to hunt people down through these networks yet."</p>
      <p>I used to play with a lot of type when I worked at Blinc Publishing:</p>
      <p><a href="http://blincpublishing.com/" title="http://blincpublishing.com/">http://blincpublishing.com/</a></p>
      <p>and got to make some fonts for chank while there:</p>
      <p><a href="http://chank.com/font_detail.php?sku=5483" title="http://chank.com/font_detail.php?sku=5483">http://chank.com/font_detail.php?sku=5483</a></p>
      <p>And by 'make fonts' I really mean just trace some beautiful old wood type. I wouldn't call it grand design. Just fun.</p>
      <p>These days I spend more type hacking ASP.net code and the like with the odd freelance gig and typophile to keep me sane. ;O)</p>
