    <p>Hello everyone!</p>
    <p>New to the typophile world, have some work on my personal site, still working on getting some type up. I'm into raw hand drawn type, new and old swiss, bauhaus, and all the weird custom type from the northwoods / wisconsin area.</p>
    <p>Looking forward to posting / crits.</p>
    <p>You can get an idea for the trouble I'll cause here:</p>
    <p><a href="http://www.kylefletcher.com" title="http://www.kylefletcher.com">http://www.kylefletcher.com</a></p>
    <p>Cheers!</p>
