      <p>If this is from a film (and especially an old film)<br>
      the possibilities are it's hand-made<br>
      and it may not be available as a digital font.</p>
      <p>You can look for something similar,<br>
      like e.g. <strong>Cluff Hmk Bold</strong></p>
