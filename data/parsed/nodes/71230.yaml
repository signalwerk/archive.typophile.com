    html: |-
      <p>I've written a Python macro for FontLab Studio 5 that calculates the linespacing values using the same method as the one that will be built into Fontographer 5. </p>
      <p>It follows John Hudson's recommendations and refines them a bit. It assumes the default leading of 120% and distributes the LineGap so that as little clipping occurs as possible. </p>
      <p>I'm planning to add a simple user interface to it, and make it work across an entire family, but the current version only works on one single font:<br>
      <a href="http://www.fontlab.net/downloads/NewLinespacing.zip" title="http://www.fontlab.net/downloads/NewLinespacing.zip">http://www.fontlab.net/downloads/NewLinespacing.zip</a></p>
      <p>I'll appreciate any feedback. </p>
      <p>Best,<br>
      Adam</p>
