    date: 2007-09-30T11:48:00
    votes: null
    html: <p>This was hand lettered -- or custom designed if you will. Nowadays it is easy as pie to enlarge the font in your design program at will, but back then every size had to be cut and cast. We're talking entirely different production methods here. Any type quite large -- especially magazine nameplates and slogans in advertisements -- was done by hand.</p>
