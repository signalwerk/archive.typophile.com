      <p>You might like <a href="http://www.fontshop.com/fonts/downloads/font_bureau/californian_3_display/?sample_text=TIME&amp;sample_size=96" rel="nofollow">FB Californian Display</a> or <a href="http://www.fontshop.com/fonts/downloads/richard_beatty/goudy_saks_sc_osf/?sample_text=TIME&amp;sample_size=96" rel="nofollow">Goudy Saks</a> as well. <a href="http://www.fontshop.com/fonts/downloads/monotype/goudy_std/?sample_text=TIME&amp;sample_size=96" rel="nofollow">Goudy Oldstyle</a> has the correct type of M, but the serifs are too pronounced.</p>
      <p>When I compare all these options, I get the impression this nameplate may have been done by <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a> himself.</p>
