    <p>Hello all -- I recently found this site and I am pleased to have stumbled upon you gurus.</p>
    <p>I was hoping someone could help me ID two separate fonts, or suggest possible alternatives: 1) company logo (attached), and 2) Smythson's custom "Brook Street" lettering -- can be found at <a href="http://www.smythson.com" title="www.smythson.com">www.smythson.com</a> while customizing "Personalised Stationery." </p>
    <p>Thank you for your time and help!</p>
