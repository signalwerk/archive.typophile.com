    html: |-
      <p>1) As previously said, very generic, nothing really specific. Suggestions by Alex look fine to me.<br>
      2) sorry, don't understand what you want exactly... Do you mean "Bond Street"? Because I wasn't able to spot any "Brook Street" lettering anywhere... For the rest, Smythson identity has been designed by <a class="freelinking external" href="http://saturday-london.com/category/clients/smythson/" rel="nofollow">Saturday</a>. They may use some bespoke typeface for all their materials. On their website, thery're using <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/brandon-grotesque/" rel="nofollow">Brandon Grotesque</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/electra/" rel="nofollow">Electra Display</a> but I suppose it's not the one you're after.<br>
      For the rest, can't get out of my head that main woodmark SMYTHSON could be easily done starting with some <a class="freelinking external" href="http://www.myfonts.com/fonts/efscangraphic/futura-sh/xlight/" rel="nofollow">Futura Extra Light</a> manually extending differently each letter. It's some sort <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/blair/" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/sackers+gothic/" rel="nofollow">Sackers Gothic</a> extended.<br>
      Some more "Futura-like" (letters needing to be stretched: <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/semplicita-pro/" rel="nofollow">Semplicita</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/agenda/" rel="nofollow">Agenda</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeinnovations/contax-pro/" rel="nofollow">Contax Pro</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/wordshape/okojo/" rel="nofollow">Okojo</a><br>
      Some "Extended Engravers Gothic": <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/aviano-sans/" rel="nofollow">Aviano Sans</a>,  <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/montag/" rel="nofollow">Montag</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/sweet/sans-pro/" rel="nofollow">Sweet Sans</a>, <a class="freelinking external" href="http://www.houseind.com/fonts/luxuryfonts" rel="nofollow">Luxury Gold</a>, <a class="freelinking external" href="http://typography.net/try/?ff=42&amp;f=410" rel="nofollow">Capline</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/zeppelin/" rel="nofollow">Zeppelin (41)</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/betatype/doublewide/" rel="nofollow">Doublewide</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/adrianna/" rel="nofollow">Adrianna</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/biondi-sans/" rel="nofollow">Biondi Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/positype/halogen/" rel="nofollow">Halogen</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100043" rel="nofollow">Idlewid</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/burin-sans/" rel="nofollow">Burin Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/ronsard-crystal/" rel="nofollow">Ronsard Crystal</a></p>
