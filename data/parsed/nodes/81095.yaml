    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MPF_Realist_specimen-1_4722.png"></div><br>
    <code> </code><br>
    <strong>Realist</strong> from <a class="freelinking external" href="http://www.martinplusfonts.com" rel="nofollow">MartinPlusFonts.com</a> is a straightforward typeface that speaks in a simple voice without being stern. It’s ideal for corprate design as well as editorial work, for headlines that speak of simplicity or for product design with an exclusive touch. It works for all expressions where the message plays the leading role.<br>
    <code> </code><br>
    <strong>Three Widths:</strong> Typical for a grotesque is the availability of an additional Wide version, while the humanist sans serifs tend to be more narrow. So it made much sense to draw three widths: Realist, RealistNarrow, as well as a RealistWide.<br>
    <code> </code><br>
    <strong>Eight Weights:</strong> The availability of a good amount of weights makes the designer’s work so much easier. This is why Realist comes in eight weights: Thin, Light, SemiLight, Regular, Medium, Bold, ExtraBold and Black.<p></p>
