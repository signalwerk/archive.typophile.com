    <p>Many years ago I released a freeware font that allowed for commercial usage, but not any modifications. </p>
    <p>I've seen it used by a company in a new line of products (printed handbags, umbrellas, etc) and it appears different — as if they put a 3pt stroke around it in Adobe Illustrator. </p>
    <p>There's no way for me to know if they modified the font, creating a new font from it for use, or just simply added strokes in graphics software for print. I'm assuming the latter doesn't count.</p>
    <p>Any advice on how to find out?</p>
