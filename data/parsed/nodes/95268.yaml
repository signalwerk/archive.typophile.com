    html: |-
      <p>Any change to the font is important if you have not permitted it under the terms of your license agreement or general terms and conditions.</p>
      <p>Most foundries seem to allow modification of outlines in a vector art programs like Illustrator, as long as that modification is not then re-introduced to the font.</p>
      <p>Other foundries allow modification as long as the resulting modified font is used for internal business purposes only.</p>
      <p>Some foundries do not allow any manipulation of the outlines, either within the context of the font or any mode of output.</p>
      <p>If you are unhappy with the way in which the outlines have been used, whether modified within a font editing tool or a vector art program then, as Hrant suggests, you should try and contact them about the nature of the modifications and discuss whether some kind of deal can be worked out.</p>
