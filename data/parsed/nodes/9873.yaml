    date: 2003-03-03T18:18:00
    date_raw: 3 Mar 2003 — 6:18pm
    votes: null
    html: "<p>Isn't it about time to redefine what discretionary ligatures are? It sounds like maintaining even the most basic discretionary ligatures used to be a monumental task, and as such, little experimentation with additional ligatures was practically possible. <br> <br>But today with Opentype, I think inevitably someone will bring us new ideas about what discretionary ligatures should include. The first step could be to implement all the f+ascender ligatures, ex: fh, fb, &amp;c. After that, why not move on to very common two character combinations of your target language? english examples: th, ch, ll, ed. Of course these new ligatures wouldn't be generally accepted but could be the thing to give that edge to magazines more indiscrete in their typography. Out of this experimentation, the more useful discretionary ligatures could be identified and implemented more widely. <br> <br>This seems to be one of those areas where typography could push forward and escape some of the tradition it's mired in. Why are 'ct' and 'st' the only standard discretionary ligatures? Shouldn't we have more?</p>"
    html_clean: "<p>Isn't it about time to redefine what discretionary ligatures are? It sounds like maintaining even the most basic discretionary ligatures used to be a monumental task, and as such, little experimentation with additional ligatures was practically possible. <br> <br>But today with Opentype, I think inevitably someone will bring us new ideas about what discretionary ligatures should include. The first step could be to implement all the f+ascender ligatures, ex: fh, fb, &amp;c. After that, why not move on to very common two character combinations of your target language? english examples: th, ch, ll, ed. Of course these new ligatures wouldn't be generally accepted but could be the thing to give that edge to magazines more indiscrete in their typography. Out of this experimentation, the more useful discretionary ligatures could be identified and implemented more widely. <br> <br>This seems to be one of those areas where typography could push forward and escape some of the tradition it's mired in. Why are 'ct' and 'st' the only standard discretionary ligatures? Shouldn't we have more?</p>"
  - id: 62907
    user: 1567
    date: 2003-03-03T19:12:00
    date_raw: 3 Mar 2003 — 7:12pm
    votes: null
    html: <p>When I discovered what I could do with ligatures and automatic substitution in OpenType, I nearly wet my pants. I've been conceptualizing a face that's almost entirely ligatures, with many 3 character and a couple of 4 character composites.  <br> <br>My first attempt will be, most likely, a display face but a closely-related text face is a possiblility. The only problem I forsee with text faces is letterspacing. If you're opening up a bit to air out the paragraph, a ligature with its set width is going to clunk like the liberty bell. (And no, I haven't stolen sheep in a long time.) <br> <br>This may be the future of typography.</p>
    html_clean: <p>When I discovered what I could do with ligatures and automatic substitution in OpenType, I nearly wet my pants. I've been conceptualizing a face that's almost entirely ligatures, with many 3 character and a couple of 4 character composites.  <br> <br>My first attempt will be, most likely, a display face but a closely-related text face is a possiblility. The only problem I forsee with text faces is letterspacing. If you're opening up a bit to air out the paragraph, a ligature with its set width is going to clunk like the liberty bell. (And no, I haven't stolen sheep in a long time.) <br> <br>This may be the future of typography.</p>
