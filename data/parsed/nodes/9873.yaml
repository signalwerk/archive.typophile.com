    html: "<p>Regardless of whether or not Goudy is misquoted about this, I've rarely found letterspacing to be tasteful, except of course in setting something for display or subheading, etc. But I really hate when people use it merely because it's a slightly better-looking alternative to huge word spaces. <br> <br>I do understand their necessity in setting magazines and newspapers, due to deadlines and such: but such situations often don't have much to do with fine typography, eh? <br> <br>I would be extremely interested in counter-examples, though (that is, examples of tasteful letterspacing in running text). <br> <br>Regarding discretionary ligatures</p>"
