  html: |-
    <p>I would love to find a way to generate diacritic glyphs in Fontlab. The issue is that most of my base glyphs (eg. a, n, r, A, N &amp;t.) are constructed from components, which means Fontlab's 'Generate Glyphs...' does not work. Other people must surely have been in this situation before, and I would imagine that one could script ones way out of this. Now the thing is that I can't write scripts, so does anyone know a workaround that does not involve decomposing the components in all the baseglyphs? Or does anyone have a script, or know of one, that would be available to do this?</p>
    <p>Thanks,<br>
    Claus</p>
