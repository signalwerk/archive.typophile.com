      <p></p><div class="imageWrap"><img src="http://typophile.com/files/construction1_6264.png"></div><p></p>
      <p>I then drew a series of accents:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/construction2_5217.png"></div><p></p>
      <p>In the font view I selected all of the accented A glyph slots, then from the Element menu chose Build &gt; Build Accented Glyph. The following were generated automatically:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/construction3_3966.png"></div><p></p>
      <p>Is this the sort of procedure you had in mind?</p>
