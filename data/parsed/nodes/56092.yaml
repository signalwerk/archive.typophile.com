    html: |-
      <p>"I really have to keep it that way when I take it to Multiple Master."<br>
      I think, if I understand you, and I've been there having made an entire serif old style font from components, if you want to keep the base glyphs as components so you can get their design correct all the way through to multiple styles in a variation technology (MM in this case), then you really do not need to see accented versions yet. I mean, I've never made changes to the base glyphs based on what I saw in accented characters, it's always the other way around. So, short of some helpful script that decomposes and recomposes, maybe there's no problem? :)</p>
      <p>Cheers!</p>
