    html: "<p>Re: OpenType... Be mindful of your feature order, and keep it consistent among the weights. Putting fractions at the end of the chain means that activating any other feature that substitutes figures will override the fractions. If that’s not desired, you could simply move ’frac’ further up in the ranks. Another option would be to include the tabular and oldstyle figures within the fraction substitutions.</p>"
