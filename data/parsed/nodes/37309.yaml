    <p>I’m trying to understand the ins and outs of producing proper OpenType fonts. And it’s looking like a damned long, time consuming process.</p>
    <p>So I am just throwing this font out there…<br>
    <a href="http://www.woodardworks.com/type13.html" title="http://www.woodardworks.com/type13.html">http://www.woodardworks.com/type13.html</a><br>
    I’ll post new versions as I process whatever advice and critique you typophiles might generously provide.</p>
    <p>Laconic is my attempt at the basics. A super simple physical design in three weights with as many OT features as I could deal with. They all work on my system (mac) but I’m sure they still need a lot of work to conform to proper cross platform OT code. </p>
    <p>I started playing with the physical design of Laconic while reading some of the bitmap pixel font threads. After a while I backed off the idea of making an actual pixel font (way too confining) and designed a font that only LOOKED like it conformed to a really tight grid. I tried to keep curves and diagonals down to a bare minimum and still be legible. </p>
    <p>I know it’s dry but I think it has a little bit of charm and it’s a great place to start with the whole OT features programming thing.</p>
