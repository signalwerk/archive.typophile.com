    html: |-
      <p>Who cares, it's all letters, letters are all the same, am I right?! =D</p>
      <p>We should point blkkkkk to some noticeably different glyphs between Helvetica (which is used in the sample) and Interstate: <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/helvetica/?testdrive=dock%3Dfalse%26size%3D41%26w%3D720%26src%3Dcustom%26text%3DSAINT%2520CYR%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%252Cot.liga%26seed%3D23" rel="nofollow">notice S, C and R</a>. See how Helvetica is closed with horizontal terminals and Interstate is not? See how the leg on the R waves?<br>
      Coming to Typophile trying to willingly teach someone something is a faux-pas. :P We all learn with one another, but we usually don't intend to actually teach. :P</p>
      <p>That being said, today I'd probably say my favourites are:<br>
      - Freight (the whole family, Sans and Micro included)<br>
      - Columbus (I've liked it for ages, there's something about it…)<br>
      - Mommie<br>
      - Auto (let's be honest, it's actually “anything from Underware”)<br>
      - Fedra (the whole family)<br>
      - Taz III (doesn't really work for me when on a screen, but printed I find it just wonderful)<br>
      - Lexicon? (“anything from TEFF” applies, I just picked one; the new Geronimo is beautiful, and designed by a fellow portuguese to boot!)<br>
      - Parisine (loving it)<br>
      - Stern (also loving it)<br>
      - Quadraat (the whole family), Fairfield, Californian, Electra, Mr. K, Requiem, Brioso, Rialto, Caecilia, Seria, Poetica, Brokenscript, Vista, Malaga, strong calligraphic cursive scripts like Polenta or Marigold…</p>
      <p>Ok, I give up, I can't possibly pick just ten.</p>
