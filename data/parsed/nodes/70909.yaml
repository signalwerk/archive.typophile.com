      <p>My faves in no particular order:</p>
      <p>1) Sabon<br>
      2) Univers Condensed<br>
      3) Clarendon<br>
      4) Stag<br>
      5) DIN<br>
      6) Caslon<br>
      7) Helvetica<br>
      8) Gotham<br>
      9) Avant Garde<br>
      10) Rockwell</p>
      <p>Now I do not advocate the overuse of Helvetica, or more recently, Gotham, but they are both extremely beautiful typefaces when used appropriately. I added Univers Condensed specifically because I think it has a better balance than Helvetica's condensed set, but I like the Helvetica regular lowercase much better than Univers'</p>
