    <p>What are your ten favorite or mostly used fonts?</p>
    <p>I'm a third year design student &amp; don't have that many fonts.</p>
    <p>This are my favorite/most used fonts.</p>
    <p>1) Scala (Own some of the wights)<br>
    2) Myriard (Comes with Adobe Software)<br>
    3) Helvetica (Own some of the wights)<br>
    4) Futura (Own some of the wights)<br>
    5) Mrs Eaves (Own the full family)<br>
    6) Didot (Planning to buy)<br>
    7) Scala Sans (Planning to buy)<br>
    8) Lubalin Graph (Planning to buy)<br>
    9) Dax (Planning to buy)<br>
    10) Caecilia (Planning to buy)</p>
    <p>I know for a student it's hard when it comes to buying font's, but what are your favorites or if you own which ones? Just curious:-)</p>
