      <p>@hrant<br>
      I disagree that color has nothing to do with type. I'd say that designing notan for a pure black text is different that designing notan for some yellow text, and if not the notan then certainly some of the optical effects that come into effect when using light on dark color schemes.</p>
      <p>Here's a connection to type:<br>
      Leslie Cabarga wrote "Learn Fontlab Fast" and "Logo, Font and Lettering Bible", both highly recommended and respected books amongst typophiles.</p>
      <p>Leslie also wrote "Designer's Guide to Color Combinations - 500 Historic and Modern Color Formulas in CMYK" a FANTASTIC look at _real_ color combinations that exist in the real world around us.</p>
      <p>But you are correct, this thread should be at least in the "Design" category.</p>
