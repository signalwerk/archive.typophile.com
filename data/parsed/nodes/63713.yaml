      <p>Color naming is about as far away as you can get from exact science, which makes it interesting to study on other levels. It's highly culturally specific too. For example the boundary between green and blue differs between different cultures/languages, or the importance of differentiating light and dark blue. And it's interesting to see which hues are attributed their own names while others aren't (German for instance has a commonly used word for a certain very dark gray, <em>anthrazit</em>, which I realized when in Japan other cultures don't have a special word for).</p>
      <p>So go ahead and learn color names, but if you want it to be practically useful, stay within <em>one system</em>, and one that makes sense to use in your specific context.<br>
      Just be aware it's going to be one system, arbitrary like all the other ones. No god-becoming involved.</p>
