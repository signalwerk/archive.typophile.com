      <p>For an artist, names of pigments work quite well as reliable bench marks. Zinc White is the colour of zinc oxide and thalo blue is the colour of Pathalocyanine. There is no ambiguity because one is referring to colours of pigments that remain consistent all the time. </p>
      <p>But in the design world, names of colours, such a coral are too ambiguous and subjective to be useful. There is no common benchmark for what they mean. As a matter of interest, different suppliers of materials for the sign industry have the same or similar names for some very different colours. One company's sunflower yellow is Pantone 116, another's is close to Pantone 130 which is more orange than yellow. You can never specify a colour by a descriptive name, you always have to use an industry standard such as Pantone, hexidecimal, RBG or CMYK values. My sky blue could be your tropical blue, but Pantone 299 is always Pantone 299. </p>
      <p>I'm sure the Pantone site will have some resources, but here are some sites I've bookmarked to play around with:<br>
      .. <a href="http://www.cbu.edu/~jvarrian/applets/color1/colors_g.htm"> Additive Color Applet by S.Kamikawa.</a><br>
      .. <a href="http://www.colortools.net"> Colour Tools.net</a></p>
      <p>…<br>
      -=®=-</p>
