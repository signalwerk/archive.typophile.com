  html: |-
    <p>Hi,</p>
    <p>I am having an issue with one OpenType font. When I turn on Small Caps in Indesign or Illustrator, it just puts the fake small caps instead the real ones, but the real ones exist in glyphs and I can add them into text when putting glyph by glyph.<br>
    Any ideas how to make the ID or AI use the real Small Caps instead the fake.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/smallcaps.jpg" width="1000" height="509" alt="">
