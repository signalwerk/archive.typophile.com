    html: <p>First, just to make sure, you see that there are two places in the menu in the screenshot where you can select the small caps, right? I assume you tried the one in the OpenType sub menu and not the one that is two items down from it? OK, in that case the font you are using is missing the OpenType feature cod, which should substitutes caps to small caps or turn everything into small caps. Call the foundry and ask them for support.</p>
