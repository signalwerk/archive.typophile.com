      <p>Apologies for misunderstanding / misinterpreting. Ironically, i don't think you caught my original points too well either :)</p>
      <p>The obvious distinction is between the <cite>nuts and bolts</cite> of the web, (e.g. the software that runs the web, provides the structures, routes, platforms, etc), and the <cite>content</cite> of the web (e.g. the stuff people 'consume' on the web).<br>
      The <cite>nuts and bolts</cite> of the web is predominantly 'give away' stuff (Free Software). What the WC3 proposals can do is enable the building on top of that base, a more 'proprietary-centric' web layer for 'content' to be consumed in.<br>
      Fonts can fall into either category.</p>
