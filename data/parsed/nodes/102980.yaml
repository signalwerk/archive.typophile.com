      <p>"...webfonts could only be properly served...once things like a "permissions table" was imposed onto..."</p>
      <p>"Only" and "imposed" were not used, "permissions" were never proposed alone or as the DRM that's coming to other media, and recommendations have been quite important, many of them are part of, as I said they would become, our private data, in a private service that benefits our clients, alone. </p>
      <p>Almost all of the then recommended recommendations have become issues in dealing with the web, and/or responsive media in an increasingly typographically enabled but resolutionarily fractured browser market. We expect to make use of all of the recommendations as functionality creeps on. </p>
      <p>In these still-early stages of the web, many thousands of dead type designers have 'given up' their 'intellectual property' via the font freedom of the web, and this has encouraged live type designers to do so as well. That, and a huge player supporting them was welcome contrast, but not expected. </p>
      <p>And obviously some people were all talk, while others were not.;)</p>
