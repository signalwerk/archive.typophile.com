      <p><cite>You mean, everybody who wants internet font exclusivity just gets an app embedding license.</cite></p>
      <p>No, not really.<br>
      I'm not sure how specifically it would work, (horses for course i would bet) but i suspect that the W3C DRM proposals could introduce a few things, including;<br>
      • the normalisation of 'ring fencing' web content for proprietary only use (something that, so far, allways tended to flounder on the web)<br>
      • browser-side operations that permit / deny web object usage.</p>
      <p>Just those 2 would probably provide enough of a secure environment where font providers could sell more traditional licenses for web font use, and the licensee could then serve those real fonts to the web, without the font provider fearing that their intellectual property was simply being set free into the wild.<br>
      The above scenario is exactly why film and music publishers are hoping the W3C proposals come to fruition; then they can start selling web-based music and film to users with far less risk of their content going walkabout.</p>
      <p>A product like 'ready-media' must be itching for this scenario? to roll out a joined up &amp; uniformly protected typographic solution, from paper to web?</p>
