    <p>I am interested; how have people's standpoints and views have changed on webfont usage and licensing over the last few years? If we look at a Typophile post such as <a href="http://typophile.com/node/67790" title="http://typophile.com/node/67790">http://typophile.com/node/67790</a> it's interesting to see what may have changed.  If we go back  say, 5 years, it's even more revealing. </p>
    <p>-v</p>
