      <p>EOT is just a wrapper for a TTF file, and the (optional) compression is lossless. The format even supports additional metadata (allowed roots etc.) - so you can really think of EOT as WOFF version 0.9. :-) </p>
      <p>So if a TTF file is okay then an EOT file should be okay. However, I think the only people the FUD hurts is Google, which I find even more ironic. :-/</p>
