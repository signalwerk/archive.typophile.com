      <p>Thanks Rich,<br>
      The function and role of copyright in digital product is for sure an interest in this. Same would be the function and role of 'intellectual property'. Both of those are finding it difficult to maintain the old levels of territorial security, in the web age, that they had in the pre-web age.<br>
      Going back a few years, i remember one of the main arguments from prominant type figures against the use of the CSS rules that allowed dynamic embedding of common font files, was that type designers would not 'give up' their 'intellectual property' via this type of font freedom, and thus the widespread use of free, dynamic embedding would just not happen. I think many designers took comfort in feeling that the type industry would be able to steer type on the web away from the free and easy-ness that was threatening. SO... was that free and easy-ness as big a threat as people were expecting?</p>
