      <p>I think my question is clear enough. It's probably just that the subject is not that interesting to many.  If you go back 3-5 years and look at the sort of discussions around ways 'the type industry' was viewing how type could be set on the web, and compare that to how type is now being set on the web, i am curious how the views and attitudes of type designers may have changed towards type on the web.</p>
      <p>Just 2 examples;  go back to around 2009 and there were prominant voices stating that they were, e.g., "100% against @font-face", or that webfonts could only be properly served to the web once things like a "permissions table" was imposed onto, and accepted as an opentype/truetype/web standard, by type designers, web engineers &amp; users. So...e.g., what happended to things like @font-face and the permissions table? and, for example, how did type end up managing with them and / or without them? </p>
      <p>The post of <a href="http://typophile.com/node/67790" title="http://typophile.com/node/67790">http://typophile.com/node/67790</a> seemed like a fair taste of the way things were, i.e. people not really knowing how to react, what to think, what to do, which side to be on, etc etc. And maybe most importantly not allways seeing the route that was likely.</p>
      <p>I'm guessing that people are now more sure of what they think, and may even now be acting in ways they would not have imagined 3-5 years ago. Basically i'm curious on how people's views, attitudes, and actions may have changed about type on the web.</p>
