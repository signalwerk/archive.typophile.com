      <p>The silence is deafening, eh?<br>
      Vern - if you were to give an idea of the kind of change in standpoint and view you suspect might have taken place, maybe it would help get the ball rolling.</p>
      <p>For myself - getting involved with fonts led, for me, to a complete re-thinking about the function of copyright as it is being applied (or mis-applied, as it were) to digital goods. </p>
      <p>FWIW - I think that, on the whole, those who spend a goodly amount of their time making typefaces, don't like the move from type on paper to type on screen and never will.  They prefer a medium where the size of the type is known and fixed.<br>
      End of story. That's their druthers, their preferred medium.<br>
      The question, however, is how much of that kind of graphics design work will be around in ten, twenty, or thirty years.<br>
      Hakon Wium Lie made a wry joke in a post on the W3C mailing list that touched upon this issue. He said that they better hurry up and get the multi-column and other print-friendly standards nailed down and implemented or otherwise there won't be any more books printed.<br>
      His point being that the digital "web" version of the "book" is, even today, the primary product, with a paper version feasible only if the stylesheet capabilities are there to port the thing to paper. </p>
      <p>The world has been flipped upside down.</p>
