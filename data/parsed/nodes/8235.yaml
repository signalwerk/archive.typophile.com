    html: <p>Galin, this post would do better in the <a href="http://www.typophile.com/forums/messages/30/30.html?1103556144">general discussions</a> thread, rather than in the Logo/ID Critique thread. <br> <br>I'd do a google search on Sessions.edu before making the decision. I saw a few things, such as <a href="http://www.complaints.com/june2003/complaintoftheday.june2.9.htm">this</a>, and wasn't impressed. Also, I don't think that online certificates are seen as valuable in the design field. Most importantly, this isn't a Master's program in the way you mean. Notice that you get a "certificate" for it, not a degree. I smell a scam here.</p>
