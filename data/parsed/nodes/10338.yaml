    date: 2005-04-15T13:11:00
    date_raw: 15.Apr.2005 1.11pm
    votes: null
    html: "<p>The drawback in linking to FontFonts at MyFonts is that it requires <br>the user to use more clicks to buy because it eventually sends  <br>them offsite to FontFont.com which is pretty antiquated and not  <br>as usable as FontShop.com. So if possible, I'd link to FontShop  <br>for all FFs. <br> <br>Patricia - About <a href=\"http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=FF%20Nexus\" target=\"_blank\">FF Nexus</a> and <a href=\"http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=ff+seria\" target=\"_blank\">FF Seria</a>: they are indeed <br>very similar. Both from the same designer, Martin Majoor. <br><a href=\"http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=ff+scala\" target=\"_blank\">FF Scala</a> is also similar, but with a larger x-height. <br>The key differences lie in the fact that FF Nexus is newer,  <br>designed from the ground up in <a href=\"http://www.fontshop.com/index.cfm?fuseaction=virtual.content&amp;area=sf_fonts&amp;content=fonts/ff35/index.html\" target=\"_blank\">three styles</a> (slab, serif, sans)  <br>and available in  OpenType Pro with lots of features.</p>"
