      They are:</p>
      <p>=&gt; Brassfield [Regular] - Copyright 1991, Atech Software, Carlsbad CA<br>
      =&gt; Endangered [Regular - (C) 1991 Sterling Court Publishing<br>
      =&gt; Zaandam [Regular] - (C) 1994 Brendel Informatik GmbH</p>
      <p>I attached an image of the ampersand to take a look</p>
      <p>Fivos</p>
