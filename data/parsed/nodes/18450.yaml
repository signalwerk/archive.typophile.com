    html: <p>You are looking for an archetypal [Modern] type that is purely derived from mathematical ratios. One example you should look at is Bodoni (Didot and to a certain extent, Bulmer, closely follows). Albeit Bodoni isnt the greatest for textface in my experience. The hairline serif simply diminish when under 8 pt. It seemed like you wanted a serif-face but I would recommend some Humanistic sans that is also very geometrical such as Frutiger. Good Luck.</p>
