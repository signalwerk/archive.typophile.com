      <p>Dear Ioana,<br>
      whilst there are many excellent suggestions in the above thread, it would seem to me that a slightly different approach might be applied to this problem.</p>
      <p>As you know, D’Arcy Thompson’s book, On growth and form, looks at the relationships between form and proportion. There are well known parallels between certain of Thompson’s drawings, and the plates which Durer published concerning the proportions of the human face. In each case, a grid is placed upon the (biological) form, the lines of the grid are displaced, and the resulting transformation applied to the underlying biological struture.</p>
      <p>The closest approximation to this kind of transformational approach is expressed typographically in a rather beautiful book called “L’art et la science de la vraye proportion des lettres attiques” written by Geoffroy Tory (1480 - 1533) and which you may consult in pdf format at the French National Library at:</p>
      <p><a href="http://visualiseur.bnf.fr/Visualiseur?Destination=Gallica&amp;O=NUMM-52553" title="http://visualiseur.bnf.fr/Visualiseur?Destination=Gallica&amp;O=NUMM-52553">http://visualiseur.bnf.fr/Visualiseur?Destination=Gallica&amp;O=NUMM-52553</a></p>
      <p>You will see that there are strong typographic similarities here to the work of both Durer and Thompson.</p>
      <p>If you wish to infuse your typography with these ideas, I would suggest searching for a typeface whose design is itself inspired by the relations and proportions of the human face and body. This would mean searching for a truly Renaissance letter, ie: one designed between 1480 and perhaps 1580. One revival which comes to mind is the face “Tribute” by Frank Heine, based on his studies of a type specimin of François Guyot’s, printed in the Netherlands, around 1565. </p>
      <p><a href="http://www.emigre.com/EF.php?fid=196" title="http://www.emigre.com/EF.php?fid=196">http://www.emigre.com/EF.php?fid=196</a></p>
      <p>Other faces of this period might also comme to mind, like those of Claude Garamond, or of Nicolas Jenson, but Heine always felt that certains of these recent versions are highly interpreted. His design remains in certain respects rather more archaic, and perhaps closer to a sense of this period.</p>
      <p>If you use a truly Renaissance face, I think you will incarne a deep sense of proportion in your book, close to the spirit of both Durer, Tory and Thompson.</p>
      <p>I will be very interested to learn of your final choice,</p>
      <p>best wishes,</p>
      <p>pete</p>
