    <p>Hi!<br>
    I was wondering if anybody could help me. I’m helping publishing a book that follows a conference on architecure, called “On Growth and Form” (after D’Arcy Thompson’s book) and I’m looking for a font that would fit the idea. I was thinking of Mrs. Eaves because of the ligatures ... but, well I’m an architect, I don’t know that much about typography, so any help will be very appreciated. I’m looking for something a little bit organic but not very loud that would bear a resemblance to subject of the book ... hmmm ... I guess I don’t know the adequate graphic design language. Anyways thanks!</p>
