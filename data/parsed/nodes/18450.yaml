      <p>The ideas: architecture and form, architecture as form, relations with biological forms (cells, tissues, skeletons) and mathematics (mathematical distorsions, stretchings, shiftings), etc.<br>
      A few titles: Phenomeno-logical garden: A work in morpho-logical process, The skin of the “sky bubble” at Expo ‘67, Old and New Organicism in Architecture - the metamorphoses of an aesthetic idea, Naturalization in Circles: Architecture, Science, Architecture ... and so on.</p>
