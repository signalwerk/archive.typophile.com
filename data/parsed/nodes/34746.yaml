    html: <p>Could it be <a href="http://www.myfonts.com/fonts/linotype/new-caledonia/">New Caledonia</a>? Or rather <a href="http://en.wikipedia.org/wiki/Caledonia_(typeface)">the original Caledonia</a> by William Addison Dwiggins from 1938?</p>
