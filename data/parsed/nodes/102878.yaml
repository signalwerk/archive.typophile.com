    <p>Hello.</p>
    <p>I am trying to find the font used by Greek Olympic Air for their airplanes' registration.</p>
    <p>I thought DIN and Arial Monospaced would be a good start. But DIN doesn't match at all and I am not really satisfied with Arial either. </p>
