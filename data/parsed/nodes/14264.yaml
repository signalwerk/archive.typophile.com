      <p>It seems I'm not the only one that feels somewhat penalized. In development, I can prepare many PDFs. Taking each one and re-opening in Acrobat to add password protection takes real time. I feel like I spend increasingly more time trying to keep my end of the deal. I also don't stray much from very commonly available type with my lower end clients because of the hassle.</p>
      <p>This makes me think of what people say about a police state, that you craft enough laws that everyone is in violation of a few at any given time.</p>
      <p>I think this thread and others are a testament to the fact that all the efforts to protect the type sellers and designers are creating a drag on the industry. I find it odd that as the promise of technology has paid off, the time saved having functioning hardware and software can be spent fussing with EULAs and patching up PDFs to prevent font theft. I don't even know how to pull a font out of a PDF. Now I feel I should figure out how it is done so I can best try to prevent it. The burden is on the honest, which doesn't seem fair. But then again, what's fair?</p>
