      <p>Laurence: good, useful post - thanks.</p>
      <p>&gt; Frank seemed to avoid the subject of what terms might be “reasonable”</p>
      <p>Makes sense, for a lawyer. But nobody else.</p>
      <p>&gt; ... deeply humiliating</p>
      <p>This I believe is quite relevant. I think it comes from the detrimental "artist's pride" psychological complex. Font houses have to tame their egos to make more financial sense. When you get stung, you need to become wiser, not more cavemanlike.</p>
      <p>&gt; I, a foundry, will sue you, a user, for using my software.</p>
      <p>This is, of course, exactly what's wrong with the thing.</p>
      <p>&gt; This could be safer</p>
      <p>Only in the most short-term, legalistic way. To me, the most dangerous thing is telling your legit customers you don't trust them. The other ones barely know you exist.</p>
      <p>&gt; Customers have to get over the feeling that a EULA<br>
      &gt; that consists of list of “what is not allowed” is unfair.</p>
      <p>1) In reality, customers have to do jack. The problem is the font house's. Customers can elect to become "pirates" quite easily (especially if they're treated as such from the get-go) and an antagonistic EULA only pushes them towards that. And this is related to why most individuals (I mean non-lawyers) don't read EULAs: it's not worth the effort.</p>
      <p>2) I haven't seen anybody complain about that. I have seen people complain that: EULAs are (intentionally?) hard to understand; and some clauses are nothing short of fascist.</p>
      <p>We need our users more than they need us.</p>
      <p>hhp</p>
