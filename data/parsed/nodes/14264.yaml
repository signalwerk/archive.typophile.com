  - id: 81038
    user: 711
    date: 2005-07-31T04:21:00
    date_raw: 31 Jul 2005 — 4:21am
    votes: null
    html: |-
      <p>Chester:<br>
      Your EULA is what I, as a user, want.</p>
      <p>I _do_ read EULAs. I won't buy fonts that forbid embedding in PDFs - it's not worth it to me to buy a font if I can't send a client a PDF proof, and besides, I don't want to keep track of which ones are forbidden, so I just won't buy them. </p>
      <p>And modifications: </p>
      <p>Just yesterday I was going to buy Monticello from Linotype, until I noticed that the EULA doesn't allow modifications. Now, the Linotype EULA offered at MyFonts does allow modification, but Monticello isn't offered there.  It's a pain.</p>
      <p>It's a pain, especially now, as we hover halfway between OpenType and Type 1. If I buy Monticello (type one only), I can't combine the smallcaps with the roman into OT for convenience in InDesign. The fractions are a separate font. How...quaint.</p>
      <p>Meanwhile,  I have FontFont's Absara Sans OT. I'd like to can get at the smallcaps to use on a form in FileMaker, but that isn't possible in FileMaker without rearranging the font. </p>
      <p>Now, I have a nice guide put out by FontShop Canada some time ago: "FontShop's Guide to Legal Typeface Use". It states the "most font manufactures will allow you the right to produce a modified version." It then goes on to give an example: producing swash caps for Baby Teeth, they suggest, would be all right as long as everyone involved is within the EULA for the original.</p>
      <p>So, I can just go ahead and rearrange the position of the small caps in Absara, right? NO! The FontFont's EULA requires me to obtain _written permission_ first. I have asked, and Danny Dawson is looking into it for me, but my inquiry  was made a couple of weeks ago, and I wouldn't be surprised if I have to wait a few more weeks to get an answer. </p>
      <p>Surely this isn't good for me, or profitable for FontShop. </p>
      <p>Will I buy from FontFont again? Probably, especially if they solve my problem. Will I consider the added hassle when deciding between a FontShop face and, say, one from Village or ShinnType? For sure.</p>
      <p>I know that all designers are free to set whatever conditions they want on their work, and it's up to me to make my decision based on these conditions. </p>
      <p>If more people read the EULAs, and took them to heart, the marketplace might function properly. EULAs that allowed me to actually USE the fonts would boost sales, and other designers would follow suit. </p>
      <p>Unfortunately, I get the feeling that many buyers blithely ignore the EULA and make their purchases without reference to them, and make use of the fonts outside of the EULA. There's no reasonable possibility that LinoType is ever going to know if someone slipped a couple of the nut fractions into the roman cut of Monticello, and most designers wouldn't even know (or care) that they had broken the EULA if they did so. </p>
      <p>I, on the other hand, end up feeling like a sucker for abiding by it.</p>
