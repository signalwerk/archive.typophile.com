      <p>I thought it might be helpful to this discussion to post a summary of what Frank Martinez (an experienced lawyer whose words have ended up in most foundries' EULAs) had to say on the subject of the EULA. Frank attended TypeCon2005 and participated in a panel discussion in which Tiffany, Bruno Steinert, Si Daniels, Rich Kegler and I also participated.</p>
      <p>I must make it clear that this is a personal impression of Frank’s remarks, and there is some elaboration by me, hopefully clarifying things.</p>
      <p><strong>EULAs address three parties</strong><br>
      Frank reminded us that EULAs are written with three parties in mind, the last often forgotten in these discussions. 1. The designer/foundry. 2. The customer. 3. A judge. That third party will not accept vagueness: in a court, any imprecision will be interpreted in favour of the defendant. So EULAs, particularly from the long-standing foundries with experience of courtrooms, do not easily get rewritten in “friendly language”.</p>
      <p><strong>No silver bullet in writing EULAs</strong><br>
      As a composer of EULAs, do not imagine there is a magic form of words which offers “100% protection”.</p>
      <p><strong>EULAs as a component of the foundry’s business model</strong><br>
      Frank noted that a foundry composes its EULA not just to conform to its business model, but as a key part of its business model. You, as a EULA writer, decide to what extent a customer may exploit your work, thereby adding value to their work. This set of decisions relates strongly to what kind of customer you want to attract. Frank seemed to avoid the subject of what terms might be “reasonable” for a customer to expect from a font EULA, and seemed perfectly content with the idea of a diverse EULA world.</p>
      <p><strong>EULAs as psychological protection</strong><br>
      It seemed that many of the foundries with whom Frank has worked have had a specific case or two in mind - from the years they’ve been in business - when rewriting their EULAs. It is as if the type designers were taking special precautions not to be stung twice in the same way. Perhaps (I’m paraphrasing now) repeated exploitation on the same basis would be deeply humiliating - not only financially painful. This method of writing leads to texts that seem overflowing with arbitrary exclusions, yet lacking in descriptions of how users are supposed to use the fonts. Thus one sees how the pleasant and readable EULA from a new foundry evolves only in the ugly direction.</p>
      <p><strong>Assumption of legal sophistication in the customer</strong><br>
      Frank also mentioned that EULAs expect a degree of legal sophistication in the buyer. More sophistication, for example, than the buyer of “consumer” software such as music CDs, movie DVDs, and videogames. There seems then to be this tension from the buyer, exemplified by Tiffany and others here, where buyers are not exactly casual, but nor are they necessarily buying with business and contract law at the forefront of their minds. They see a typeface they’d like to use, the price seems fair, and would like that to be the end of it. (This seems to be to be a general problem, one that may cause surprises in the courtroom, as acceptance of unread EULAs and terms of service becomes universal.)</p>
      <p><strong>Small fry=red herring</strong><br>
      Frank seemed to suggest that an experienced foundry would not go after customers for small (i.e. non-piratical) infractions of the EULA. A good EULA protects against serious abuses by those worth suing. Almost all small-fry abuse is piratical anyway, protection against which does not require a EULA.</p>
      <p><strong>The EULA is a declaration to sue</strong><br>
      I, a foundry, will sue you, a user, for using my software. Oh, except in certain specific circumstances, I agree not to sue. Perhaps the allowable circumstances are not defined explicitly(!), but instead the EULA is a list of what is forbidden. This could be safer than statements of what is allowed, since technological advances mean old allowed usages might, in the future, add much more value than originally intended by the foundry. For example, "editable embedding" did not seem terribly dangerous in 1992. Customers have to get over the feeling that a EULA that consists of list of “what is not allowed” is unfair.</p>
      <p>-- Laurence</p>
