      <p>LettError fonts and artwork are licensed for use on 6 rasterizing devices connected to the same network. A device may be, but is not limited to, a printer, rasterizer, video display terminal, CPU, workstation or any device where the font software is rasterized or display of the LettError Font is generated from font software outlines. </p>
