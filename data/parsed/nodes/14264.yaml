    <p>If you were to make a manifesto for the <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a>, what would you include? I'm talking about the basic EULA, not the multi-server, multi-user, EULA. Do you think manifesto too strong a word? I don't, I want to make a statement. Do any of you really read the EULA before licensing type? Do any of you really NOT license type from a given foundry because of their EULA? Which foundry? Don't be shy. Let's dish!</p>
    <p>Just wanted to toss this idea into the pit and see what came back.</p>
