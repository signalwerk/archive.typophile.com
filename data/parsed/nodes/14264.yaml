      <p>Si:<br>
      I think that fonts, as individual designs, add more value to a printed piece than an electronic one, so I don't really buy your arguments.</p>
      <p>The fonts on the cover of a book, the look of a printed page, help convince the browser in the bookstore to pick up the book and buy it. (Or, at least, they engage me.) _That's_ added value for the book producer.</p>
      <p>I doubt that many PDFs are sold because of the format. The person buying a PDF is more likely focused on the content, rather than the look.  If it all shows up as Adobe Sans, (or Verdana or Georgia) on their system, they'll still get the content, and probably won't be disappointed. The "functional" nature of the font, its search-abilty, its compact format, aren't tied to its individual design qualities.</p>
      <p>So, one might say the fonts, qua individual designs, have _less_ value, not more in an electronic doc. One certainly might have a hard time convincing someone holding the purse strings to spend extra for the "restricted" fonts, over easily available unrestricted ones.</p>
      <p>Again, market forces should discourage restrictive EULAs, but I suspect that much of the market is already treating fonts as unrestricted regardless of the EULAs.</p>
