      <p>Hrant, to your point on article 6, the sentence that follows this restriction has more to do with article 9 where Emigre states they won't be held responsible for somebody using their fonts or derivative works for fitness for a particular purpose . . .</p>
      <p>Imagine an ad agency uses an Emigre font or creates EPS outlines from an Emigre font and runs an ad campagin for a major client like MegaFlicks in a national campaign and it reads in the paper as MegaF*cks and the agency gets fired and blames it on the font rather poor art direction and decides to sue Emigre. Legally, Emigre would still be on the hook for this unless articles 6 and 9 were in their EULA.</p>
      <p>It's a totally unlikely scenario, but the language is clear that there is no guarantee that font software licensed to an end user is guaranteed to work for any specific purpose. I believe this is one of those misunderstood passages that comes off as 'license everything from us or else' . . . </p>
      <p>On the flip side of the coin, lets say one of the many Digital Scrapbookers (the fastest growing new trend) decides it's OK to make a digital alphabet from an Emigre font and resells it for $6 for a set of .EPS letters. This becomes a derivative work which is being resold and redistributed as software and for all intents and purposes violates the EULA to say the least . . .</p>
      <p>I'm not sure Emigre's EULA is that dogmatic, but it does in very general terms create enough of a statement to the end user that should they need to bring suit to get them to stop selling these digital alphabets, they have a strong case to do so with . . .</p>
      <p>Think of a EULA like a 3 year-old child . . . If you don't specifically say 'NO' or 'DON'T DO THAT', the child assumes the answer to every question is 'YES' or 'YOU HAVE MY PERMISSION' - And make no mistake, most end users are very generous in their assumptions about what is allowed and what is not.</p>
      <p>At least twice a week I am pleased to get questions from folks wondering if their use falls under our standard EULA and I make sure to answer them thoroughly . . .</p>
      <p>Also, I'm not inclined to debate Emigre's EULA point by point, but I prefer to explain to the best of my understanding as to what each passage means to both the foundry and the end user. Often times from what I read about EULAs on boards, it does come off as an us vs. them kind of deal when in reality it's more like defining the terms of a relationship between two parties kind of like a pre-nupt.</p>
      <p>As a foundry owner I feel responsible for defining this, else its my own fault if I don't provide any information on what the purchase price entitles you to. And, for any fonts that do NOT have EULAs, many of them end up on CDs for sale at eBay for $15 and the creator is often none the wiser that somebody else may be profiting off of their work, EVEN if the creator intended that nobody should pay for it and distributed it as freeware to the masses.</p>
      <p>So I guess what I'm saying in not so many words is that the buyer and the seller need a EULA. How clear or restrictive it is, is solely the responsibility of the foundry and as the creator of the products they are selling they have the ultimate last word in how they wish their products be used.</p>
      <p>Here is an interesting snippet from the House Industries Vector Image EULA that demonstrates how specific a foundry can define their use:</p>
      <p>'If images featuring a person will be used in connection with unflattering or controversial subject matter, or used to imply connection to or endorsement of a product, the image must be accompanied by a statement that states the person is a model used for illustrative pruposes only.'</p>
      <p>My 2¢</p>
      <p>Stuart :D</p>
