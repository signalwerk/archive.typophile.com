      <p>What's the difference between (a) fonts embedded in a PDF or Flash and (b) fonts embedded in games, software, operating systems or mobile devices?</p>
      <p>The difference is that the latter (b) are products, where the font software enhances the value of the product in measurable terms like usability (closely related to aesthetics), file size and functionality. With the former (a) I see no difference between web sites with GIF fonts or Flash embedded fonts and something with ink on a page.</p>
      <p>Since the laws around font licensing center around protecting the software (and not the design copyright) then it's out of necessity that font licensing has evolved the way software has -- versus the way other creative usage rights have evolved. </p>
      <p>Now, speaking as an end user, I appreciate the foundries who are thinking about how I will use their fonts. In general, it is really irritating when there are stipulations about PDF or Flash embedding (or EPS outlines!) and I'd say get over it, because I'm going to find another foundry to deal with. Using Chester's analogy, that means I would not buy the car that won't go over 45mph when I know that most often I will need a highway legal car!</p>
      <p>* Regarding piracy issues with embedding (not the topic of this thread), I say get over it. Piracy is going to happen and just because some hacker kid will pull your fonts out of a PDF or Flash file doesn't mean you should hamper your font sales by getting so tight with your EULAs. This issue is something for the software makers (Adobe and Macro- er, Adobe) to figure out, not to punish the legitimate font licensees over.</p>
