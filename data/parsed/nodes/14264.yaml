      <p>Here's an interesting one... </p>
      <p>LettError fonts and artwork are licensed for use on 6 rasterizing devices connected to the same network. A device may be, but is not limited to, a printer, rasterizer, video display terminal, CPU, workstation or any device where the font software is rasterized or display of the LettError Font is generated from font software outlines. </p>
      <p>...so I have one computer and one printer.</p>
      <p>The computer is a workstation = 1 device<br>
      The computer has one CPU = 1 device<br>
      The computer includes Windows, which comes with TrueType and PS raterizers = 2 devices<br>
      The computer has Adobe Acrobat Reader which has a rasterizer (cooltype) = 1 device<br>
      The computer has Avalon beta installed (two rasterizers) = 2 device<br>
      The computer has Adobe InDesign installed (one rasterizaer) = 1 device<br>
      I have two screens attached = 2 devices<br>
      The printer is a laserprinter = 1 device<br>
      The printer has a rasterizer = 1 device</p>
      <p>So under this license one computer and one printer = 12 devices? </p>
