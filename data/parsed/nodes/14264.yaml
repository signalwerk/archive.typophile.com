      <p>Hmmmm... I see Suart's point about "live versus static", but I would say that this kind of extra payment scheme is akin to one's bank taking extra money for every transaction. It's beyond the pale. </p>
      <p>I mean, imagine paying FontLab extra money every time you generate a font; this is the final task of the software, and we expect this functionality. And we should. Which is why we ship out OTF or TTF or PST1 files to our licensees, not VFBs. (Not everyone has a copy of FontLab lying around to roll their own fonts.)</p>
      <p>The more restrictions we place on the potential licensees of our types, the less interested they are going to be in abiding by those restrictions.</p>
      <p>Time for another analogy: You're in the market for a new car. The EULA for the car stipulates that you cannot drive above 45 miles per hour, but you want to drive your car on the highway. So you have to decide: do you buy the car knowing that you can't exceed 45 mph, or go look elsewhere for a car without such a restriction?</p>
      <p>I know I've posted this elsewhere, but David Foster Wallace wrote a very interesting piece for Harper's magazine about dictionaries taking either a descriptive or prescriptive approach. If you have a couple of spare hours, you can read it here:<br>
      <a href="http://instruct.westvalley.edu/lafave/DFW_present_tense.html" title="http://instruct.westvalley.edu/lafave/DFW_present_tense.html">http://instruct.westvalley.edu/lafave/DFW_present_tense.html</a></p>
      <p>We publishers each have to decide if we're going to focus on describing  - our approach at Village - or prescribing the allowable use of licensed types.</p>
