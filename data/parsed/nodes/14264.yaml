      <p>I have a few thoughts too...</p>
      <p>1. having digital fonts (bitmap fonts or outline fonts) embedded in eBooks, video games, help systems, etc., clearly adds value to these products. The fonts reduce file size (no need to pre-render flat bitmaps for each page of content), they aid modification (easier to fix typos without regenerating bitmaps), make localization easier (update a linked text file ratehr than a bitmap), are easily searchable (no need to jump through the additional hoops Octavo do/did in their eBooks by having searchable text 'behind' the bitmap pages) etc., etc.,</p>
      <p>2. Embedding permissions in fonts relate to "document" embedding. Clearly a video game is not a document, but for a commercially sold eBook some font vendors make the case that eBooks are “products” and not documents in the embedding sense. </p>
      <p>So on the one hand because eBooks were not really covered by older EULAs (which talk about document embedding) font vendors could take advantage of this and put restrictions around the eBook embedding without visibly taking away existing rights from customers.   </p>
      <p>On the other hand clearly embedding fonts in eBooks adds considerable value and functionality to these products so it's not unreasonable for customers to pay more for these rights.</p>
      <p>Fears of extraction of fonts from eBooks is really a red-herring - the restrictions are based on the value the fonts add to the products.</p>
      <p>Cheers, Si</p>
