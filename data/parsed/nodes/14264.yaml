      <p>Dan:<br>
      In what way would fair use be violated if I acted within the agreement I made with FS when they took my money and mailed me a font? I would say that altering software to ensure fitness of purpose would be "fairer" than an after-the-fact prohibition on alteration. </p>
      <p>Really, please explain the fair use objection. When I made the agreement with FontShop, they were distributing literature (unsolicited—just because I was on their mailing list) telling me it was okay to alter fonts for personal use. I purchased  a licence, sending the money to FS Canada. Um, would it not be "fair" for me to assume I was allowed to do what they said I could do?</p>
      <p>If software vendors wish their agreements to have the force of contracts, they can't possibly expect be able to re-negotiate them without, well, negotiating. It doesn't take an Oliver Wendell Holmes to know that a binding agreement is binding on BOTH parties.</p>
      <p>I'm no lawyer, but I suspect that any contract that suggested "we reserve the right to modify our license" would, if it ever came to court, be difficult to defend. It would be tantamount to stating that the contract, as written, did NOT "constitute the whole of the agreement" (ever notice how often you see that in software agreements?).  It would leave the whole thing up for grabs. </p>
      <p>You can't have an agreement if one party says: "I agree now, but I might not agree later". That's not an agreement, that's a discussion.</p>
