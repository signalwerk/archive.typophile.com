      <p>Here's another restriction that pops up in a few EULAs: some allow the use of the font software on 5 computers but only ONE PRINTER. So, if you've got a laser and an inkjet, I suppose one of them has to go!</p>
      <p>This condition appears, for example,  in the EULA offered for E&amp;F and Linotype fonts at Myfonts, but not the Linotype EULA offered at Lynotype.com. (!?) Anyone else know of examples of this?</p>
      <p>Unfortunately for me, Linotype.com doesn't allow font modifications without special permission, while the Linotype EULA at Myfoonts does, so I'm forced to choose between colour printing and say, custom kerning. Hmmm...</p>
      <p>BTW, for those of you who may think I'm overstating the import of modification restrictions in EULAs, I'd like to point out that Porchez Typofonderie's EULA specifically forbids altering the kerning of a font:<br>
      "The fonts must not be altered in any manner whatsoever, including the manipulation of any of the following: The digital font data in order to mix it with another; its composition; its forms, outlines, or its characters; the position of the characters (in all cases, including spacing and kerning which leave the original font intact)"</p>
      <p>It would seem that even using optical kerning within InDesign violates this EULA: note that kerning is forbidden even if it leaves "the original font intact"!</p>
