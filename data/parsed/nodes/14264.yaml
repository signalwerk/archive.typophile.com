      <p>Of course, most foundries are protecting themselves with their EULA, which is as it should be. The foundry is making explicit their demands of the end user.</p>
      <p>In my opinion, it doesn't hurt for the foundry to reflect the reality on the ground. (Many foundries will disagree with me.) The EULA for Village was written to protect the foundry, the end user, and the designer of the typeface. The language is simple and clear, and not legalistic, and above all it acknowledges that this kind of agreement is "faith-based". As a small foundry, we can't afford to prosecute those who infringe the agreement; we therefore ask that customers agree to comply with the terms of the agreement to the best of their ability, and in good faith.</p>
      <p>The full text of the EULA follows. I'd love to hear feedback and comments. Especially from you, Tiffany. Does this EULA do anything for you as an end user?</p>
      <p>/ / / / /</p>
      <p>Village End User License Agreement / version 1.2, July 2005</p>
      <p>This is an agreement between you, the purchaser, and Village Type &amp; Design LLC (Village). In accepting the terms of this agreement, you acknowledge understanding and promise to comply with its terms. If you do not accept the terms, please do not complete the purchase transaction.</p>
      <p>What you are purchasing from Village is the license to use digital typeface software - hereafter "fonts" - on a certain number of computers within your organization; you are not purchasing the copyright to the design of the fonts, but the rights to use the fonts.</p>
      <p>If you are purchasing 1 license, you may use the fonts on a maximum of 4 computers within your organization; If you are purchasing 2 licenses, you may use the fonts on a maximum of 10 computers within your organization; If you are purchasing 3 licenses, you may use the fonts on a maximum of 25 computers within your organization; If you are purchasing 4 licenses, you may use the fonts on a maximum of 50 computers within your organization; If you are purchasing 5 licenses, you may use the fonts on a maximum of 100 computers within your organization; If you are purchasing 10 licenses, you may use the fonts on a maximum of 500 computers within your organization; If you are purchasing 20 licenses, you may use the fonts on an unlimited number of computers within your organization. You can purchase additional licenses at any time, which grant you the rights to use the fonts on additional computers, as noted above.</p>
      <p>You can make archival copies of the fonts for your own purposes. You will not distribute the fonts to people outside of your organization. A copy of the fonts may be sent as part of a file release to a prepress bureau, if absolutely necessary. The fonts can be embedded in other software files, such as Portable Document Format (PDF) or Flash files, but you will take all reasonable care to embed the fonts in such a way that they cannot be extracted from the files you create.</p>
      <p>You may modify the fonts for your own purposes, but the copyright remains with Village, and the number of computers covered by the license remains the same. You may not commission a third party to modify the fonts without first gaining permission from Village. You may not sell or give away modified versions of the fonts.</p>
      <p>We have done everything we can to produce our fonts to the highest and most up-to-date technical standards, and we test the fonts extensively in the latest versions of technically-compliant applications. If you do experience any difficulties with our fonts, we will do everything that we can to work with you to resolve any issues. If, after we have worked to resolve any technical issues, you are still not satisfied with our product, we will be pleased to refund your money, which shall be the limit of our liability in this transaction.</p>
      <p>We grant the rights of use of our fonts to you in good faith, and request that you promise to adhere to the terms of this agreement to the best of your ability, and in good faith.</p>
