      <p>Modification should be allowed in some cases but there must be a clear definition of what is allowable. Anything involving redistribution after mods is not permitted. Mods to make an off-the-shelf face a corporate face should not be permitted without specific written permission and payment. Mods to make language variants is fuzzy to me. If you are adding say Greek or Cyrillic, this is clearly value added and requires payment. If you are adding a few alternate characters for local dialects, this seem fair to me. If you are doing CE where none existed before, I think you need get written permission.<br>
      All of your other points (location, embedding, service bureau) involve current work procedures which were not likely when the original EULAs were written. To me embedding fonts in PDFs (with password protection) is not only common practice but a must. It makes more sense to embed a font than send a copy of the font to a service bureau. Editing on site is the big issue. Today designers may be in city A, client in city B, and Printer in city C. In this “I need it yesterday” world, mistakes happen. “Whoops! the figure for net profit for 2005 is wrong on our annual report. Can we change it at the printer’s site?” So what to do? I think printers and service bureaus who do not already own a font should be charged a small “Temporary use fee” by foundries when making mods on site. Sounds fair? but! What a pain to collect and oversee!<br>
      Regarding location/CPU/Device—We need to come up with a better term. Perhaps we are talking “Workgroup” or “Project-group”? Meaning the small group in the design office in the project chain (Art Director, Designer, Production artist) including their laptops and all of their proofing devices.  I don’t mean an entire ad agency or large corporate design staff, I mean the 1 to 5 people who really work on that project. Most design offices are small anyway and larger ones outsource often to avoid adding full time staff. The sad truth is that a font costs only 20 bucks, a few hundred for a big family.  The font designer gets the smallest piece and has the least say . . .—Whoops, soap-boxing again, sorry.</p>
      <p>ChrisL</p>
