      <p>I wouldn't call it a tease, well, ok, <em>maybe</em>, but after reading so many EULAs, and not calling myself a lawyer or legal-eagle or expert, it seems to me it is in the best interest of foundries and users to have some text left vague. Perhaps more for the foundries, but it leaves it open to the user to create dialogue and develop a relationship. You could disregard the help which Mr. Dawson has offered. You could read into it and find a rationalization. It seems to me he hasn't given you a final NO, so maybe you could wait a little longer?</p>
