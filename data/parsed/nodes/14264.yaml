      <p>People are listening...</p>
      <p>Press release                                                                                                                          </p>
      <p>August 2005</p>
      <p>New Liberal License Conditions for FontFonts</p>
      <p>FontShop International (FSI) has updated the license terms and conditions for their FontFonts. The new rules acknowledge two important user requests regarding the use of fonts on laptops and working with service bureaus and printers. These changes are valid immediately, and even cover FontFonts licensed in the past. </p>
      <p>“Many of our customers now work at different locations, they take documents on business trips, work at home, and, in the end, they send documents for output to a service bureau,” says Jürgen Siebert, member of the FontFont Typeboard. “Font licensing should be compatible with these flexible working conditions.”</p>
      <p>FontFont’s updated End User License Agreement (EULA)  respects this new environment. Users who work both at the office and at home may load their fonts on their laptop — without any effect on the number of licensed users. Licensing is no longer applied per workstation (CPU), but rather on number of users. Supplying FontFonts used in a specific document to a service bureau or printer for outputting is subject to an important condition: the service bureau may output the given document but not make any modifications. After outputting, the fonts must be deleted.</p>
      <p>There are also new rules for the internet. If you embed FontFonts in a non-commercial secured PDF, you may put the PDF on your website for viewing and downloading. </p>
      <p>The rights of FontFont designers will also be strengthened by the new license conditions. Without FSI’s permission, FontFont data may not be renamed or modified.</p>
      <p>You can read and print the new FontFont EULA at <a href="http://www.fontfont.com/eula/license.html" title="www.fontfont.com/eula/license.html">www.fontfont.com/eula/license.html</a>.</p>
      <p>About FontFonts</p>
      <p>The FontFont library of digital typefaces was launched in 1990 by Erik Spiekermann and Neville Brody with the goal of producing cutting-edge typefaces by designers for designers. Now representing the work of over 100 designers, the FontFont Library contains over 3,000 contemporary fonts - many of the most popular typefaces in use today - including FF Meta®, FF DIN®, FF Scala®, FF Eureka® Sans, FF Kievit™, and FF Fago™. FontFonts are available at <a href="http://www.fontfont.com" title="www.fontfont.com">www.fontfont.com</a></p>
      <p>FontFont and FontFont typeface names are trademarks of FSI FontShop International. Other trademarks mentioned for informational purposes are the property of their respective owners.</p>
      <p>===</p>
