      <p>Embedding is a problem word as it can be in reference to PDF and/or formats similar to SWF. I do think these are two different kinds of embedding, but I wonder if foundries see embedding as a value add when used in SWF and so reason they should be able to get more money. (That could also be a question.)<br>
      --<br>
      I appreciate, as a user, that Chester, you and Village, have approached this with new thought and reason. You are right most of the time people, even I, click agree without thinking. Bad habits die hard. There are basic uses which designers hope they can do with there fonts. Your EULA, Chester, seems to make sense in that maybe designers will meet you half-way and will read your EULA.<br>
      --<br>
      What are those basic things we, designers, need to be able to do with our fonts when we license them?<br>
      - Print: I have several printers in my office. But, according to some EULAs I have to choose a printer. This seems antiquated.<br>
      - Embed for proofing and service bureau output.<br>
      - Archive<br>
      - Modify: At my own risk. This one isn't so important to me, but John does make a good case for it. My situation is such that I wouldn't trust myself to modify the font. I'd rather have the foundry do that for me so if something is wrong I can talk to them.<br>
      - Transferability: This is important to me. (Read below)<br>
      - More than 1 user, at least 2: I have no idea how to rationalize this beyond my own personal experience as someone in a small office.<br>
      --<br>
      What about resale? If I were to create a book, for online sale, as a PDF. Is it reasonable that foundries charge extra for this? Should their be a resale EULA? Or is this yet another case of trying to get us to pay more? I think it is fair. But, what do you think?<br>
      --<br>
      I'd be interested to actually see someone crack a PDF and find out how useful the font is once cracked. It seems to me that those who can crack open a PDF to get a font aren't designers but bored geeks out to prove something.<br>
      --<br>
      It seems to me that Chester, you, are trying to infuse trust into your EULA. I appreciate that. This is not to say that I don't find trust in other EULAs.<br>
      --<br>
      There are two people in my office that might be considered "designers". I use quotes because he is more or less in charge of production. However, when I license type from a foundry, such a The Font Bureau, I have to make sure that the other "designer" doesn't copy the fonts off of my machine as I only license them for my machine. I also pay for the licenses myself with the understand, from all of the foundries from whom I license, that I will take the fonts with me when I leave. Am I creating a nightmare for them? Probably. But, I've taken the time to create relationships with these foundries based on trust and common understanding. It needs to be said that I have searched his hard drive and have deleted fonts that I know he shouldn't have. I feel a little guilty, but I doubt he even notices. I'm the police in my office. I take the steps necessary to respect my associates and friends.<br>
      --<br>
      Another tangent. If more people actually took time to create relationships with the foundries, and vice versa, I think more people would find themselves wanting to abide by the rules.<br>
      --<br>
      Should I be speaking to the technical forum at ATypI? Or, am I already talking to the converted? This is, in a nutshell, what I am trying to figure out.</p>
