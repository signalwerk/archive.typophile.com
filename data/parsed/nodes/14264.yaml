      <p>For what it's worth, I've heard back from Danny Dawson at FontShop USA about modifications to FF fonts, and the short answer is, no, you can't do any.</p>
      <p>I have found my dealings with Danny to be very satisfactory, and I believe he is trying his best to help me and explain the Fontshop terms to me. It's a thorny area, and I get prickly when I enter it. He's spent a lot of time replying to my pesky queries. Fontshop has a good and patient worker there.</p>
      <p>Specifically, you may recall that I wanted to be able to rearrange the font to allow me to use the smallcaps in Filemaker. Danny says that modifications have to be done by the designer, or by Fontshop staff, and that I am "effectively prohibited from making the changes yourself." He says there may be some situations where FontShop might allow user mods, but he doesn't know of any.</p>
      <p>I've asked him how much such a modification would cost, but he hasn't replied to me yet. Practically, I'm sure it would be much cheaper to just buy the Type 1 smallcap font, but I was curious. </p>
      <p>I've also asked him what it would cost to have the ff ligatures from Seria Sans added to the regular font, something I would have done myself in about 5 minutes. I also wondered why FontShop persists in putting ff ligs in a separate font when, for example, Storm includes them in the regular font (even the Type 1), and names them properly so that InDesign finds and uses them.</p>
      <p>I haven't asked, but wonder how much time and money it would cost me to have kerns for smallcaps to numerals added to a Fontshop font. Canadian postal codes alternate letters and numerals, like this "M5W 7V6". It doesn't take an obsessive compulsive to find fonts that end up with ugly spaces with these babies! Do all the FontShop fonts cover these pairs? I don't know, but I doubt it. Since I'm not allowed to modify the fonts, I'm going to be stuck reviewing addresses individually if I do mailing labels with a Fontshop font. Hmmm, maybe I'll use an Adobe font, or Panoptica! Life's too short.</p>
      <p>So, I'm disappointed in FontShop. I think their EULA is a tease. It states "If you want to make modifications to the Font Software, you must obtain the prior written consent of FSI." Am I the only one who thinks this implies that one  _might_ obtain that consent? Shouldn't it state "you are effectively prohibited from making the changes yourself", since that is, in fact, the policy?</p>
