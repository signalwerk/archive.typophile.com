      <p>I agree you've got some good points here Hrant. The question is, how can one craft a EULA that reads at an end user 'understandable' level yet has enough weight to hold up in a court of law if need be.</p>
      <p>Something else to consider is that all EULAs were written long before the indie internet foundry boom of the mid 90s becuase at that time most foundries selling fonts were selling them to art directors whereas todays audience is quite honestly anybody with a computer so the language of EULAs has not evolved to meet this new audience.</p>
      <p>For myself, when I started my foundry in 1996, I did a cut/paste job and subbed my foundry name for the one that was there. Certainly years later when I GOT the purpose of a EULA, I did get saavy about understanding what I wanted mine to say. I think this holds true for many foundries from that time period as well as plenty of the current MyFonts foundries who don't totally GET EULAs but think they should have one to seem 'official'</p>
      <p>In part, I don't think many font creators totally get the concept of a EULA and I think most of the spanning of the gap occurs from the foundry side, not the end user side and I certainly agree with Hrant on this. And to this point, as I mentioned earlier, the end user is becoming a more sophisticated buyer than ever before so EULAs are being read by end users.</p>
      <p>Tiffany made a point earlier about embedding and this one is tricky. The idea of somebody selling an ebook with an embedded font, does this warrant additional licensing fees? What about a computer gaming company using a font prominently in their product? What about embroidery machines that will sew your name on a shirt using a specific font? What about a network running promos for a TV show using a specific font?</p>
      <p>In all of these cases, the end user is enhancing or creating a product using the font as part of the product. As the creator of the font being used, I do honestly feel that using the font in these manners does warrant the need to extend licensing since part of what is being sold or promoting the sale is the font.</p>
      <p>Stuart :D</p>
