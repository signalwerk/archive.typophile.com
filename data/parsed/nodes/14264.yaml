      <p>Type designers can set the embedding bit in TTFs to one of four options. These options affect how you can use and share a font from a license standpoint. The option in Acrobat to embed fonts is more of a toggle button, and the embedding rights in the font need to agree with it:</p>
      <p>1. Downloadable: Anyone can squeeze the fonts out of a PDF and install them on their machine for unlimited use in other docs</p>
      <p>2. Editable: The whole (not subsetted) font is embedded in the PDF, enabling co-authors to edit the file but not download it</p>
      <p>3. View and Print: Subsetted fonts are embeddable in PDFs for distribution, but no editing is possible</p>
      <p>4. Restricted: Font can't be embedded, so fonts revert to system or substitution fonts when PDF is shared. </p>
      <p>Obviously the first is horrible for a type designer, and the last is horrible for the document user and author.</p>
      <p>The term 'embedding' for fonts needs a qualifier to discuss meaningfully. </p>
      <p>Adobe allows downloadable embedding in all its new font products. Adobe's main business is Acrobat. See?</p>
