      <p>Two thoughts I have on this are:</p>
      <p>1) Because technically it's still a form of software distribution which is forbidden in most EULAs. Different than sending PDFs with embedded fonts to a service bureau or client, when an eBook author sells a book, they are selling the font(s) as well. Both sides could be argued to death, but it's clearly an issue that requires discussion . . .</p>
      <p>As far as eBooks go, it's is no different than a game developer embedding a font in a video game or a kiosk developer embedding a font in a stand along kiosk or digital slot machine. If they are intending to sell something or make money with something the software is part of, I personally feel it's still a form of software distribution that requires additional licensing.</p>
      <p>2) I think the difference between a printed book is that the font is no longer accessable and the product is truly 'finished' - In cases of eBooks, the font software outlines are still 'live' because they are required to render text to output devices like monitors and printers via computers. So, for all intents and purposes, the font is still very much a part of what is being sold.</p>
      <p>Stuart :D</p>
