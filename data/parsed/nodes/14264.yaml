      <p>To keep this ticking along here’s a summary of items for the manifesto – these cover the “moving the goalposts” scenarios.</p>
      <p>1.	Easy access to the standard font EULA on every font foundry site – a link to the EULA should have the same hierarchical status us ‘contact us’, ‘home’ etc., on a web site. EULA should clearly declare date it went into effect.<br>
      2.	Easy access to deprecated EULA’s – what were the rules when I actually licensed the fonts?<br>
      3.	A EULA that matches the information encoded within the font – most obviously embedding bits – don’t make the EULA contradict the embedding bits set in the font. Make sure ownership © and TM, vendor ID, links, embedded description and license are accurate and match the EULA.<br>
      4.	Don’t set restrictions like “may only be embedded securely” – I don’t want my documents to suddenly become illegal the moment a hacker beyond my control works out how to extract the fonts or outlines from a given file format. </p>
      <p>Cheers, Si</p>
