      <p>I've been thinking "constructively", but pragmatically<br>
      as always, and I'm coming to the conclusion that EULAs:<br>
      - Are useful to the user only in helping him not get sued.<br>
      - Cannot be made reasonable/intelligible beyond a certain limit inherent in Law/Capitalism.<br>
      - Are here to stay, even if most people don't read them.</p>
      <p>As a result, I propose the following: leave the EULA field in its "negativist" domain, with all its legalese trappings, but have a <strong>second</strong> document for decent individual humans. This document (can't think of a name right now) would explain in a normal conversational manner what the font house would like to see happen, and not happen. It might even explain why, and propose direct contact to resolve conflicts or ambiguities. It might start something like this: "Thank you for bothering to read this; it means you're a decent person, hopefully with reasonable expectations. We also have expectations, and we hope they're reasonable. #1) Please..." I can picture somebody who wouldn't read a EULA going to the trouble of reading such a document, making everybody happier. And if they do bother to initiate direct contact, that just means you have a decent customer on your hands, to whom you can sell [more] stuff in the future, with peace of mind. Open, sincere communication is the best long-term strategy I think.</p>
      <p>I've loved seeing some font houses try to be more reasonable in their EULAs, but I think it might be better to split the effort into two angles.</p>
      <p>hhp</p>
