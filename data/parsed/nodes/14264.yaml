    date: 2005-07-30T21:14:00
    date_raw: 30 Jul 2005 — 9:14pm
    votes: null
    html: |-
      <p>I blush.</p>
      <p>Tiffany, I'm sure that there are foundries out there who would find the Village EULA to be too reasonable and permissive. As a recovering graphic designer I am well aware of the way things work out in the world, and I felt that our EULA should reflect that experience.</p>
      <p>Retail type design is a gamble: type designers work on types for months or years, getting them just right aesthetically and technically, in the hope that they will make money from sales for years to come. We invest in time and hope for return on investment in the form of money. (This is very similar to artists and writers, except we small guys never get advances.) The end user most likely doesn't know this. Readers of Typophile probably do, but they're in the minority. </p>
      <p>Many graphic designers use their fonts illegally, either because they have not licensed them at all, they are using them more widely than their licenses allow, or they are embedding or doing other things the licenses don't allow. The huge majority of these people didn't read the EULA, just as they didn't read the EULA for their page layout software, or the privacy statement on the back of their credit card bill. People are immune to legal documents; they click the "Agree" button automatically, never intending to follow the agreement: they don't even know what they're agreeing to.</p>
      <p>My hope is that by simplifying our EULA people will actually read it. And that by making it easier to actually comply with its terms, people will uphold their end of the agreement.</p>
      <p>At Thirstype, I once devised a really complex sliding pricing table for multiple-user licensing. It was a logirithmic nautilus affair, and was hard for purchasers to swallow. We would often get calls from people wanting to license a font for, say, 8 computers, but once they learned the price they changed their minds and would only license the font for one computer. If our licensing was more reasonable, customers would have been more willing to ante up for the correct licensing for their needs. And hopefully they would respect us for understanding their situation.</p>
      <p>This is what I was thinking in drawing up the Village EULA and licensing table. I wanted them to reflect the way that designers actually use type. Type publishers just don't have the time to go around enforcing the correct licensing of their types, so we have to place our trust and faith in our customers. We have to believe that they will try their hardest to follow the terms of the agreement, that they will purchase the right number of licenses for the number of computers on which they plan to install the fonts, and that they will try not to let the fonts loose.</p>
      <p>As for an End User Manifesto... I think it's a good idea. There are too many EULAs out there which are egregious in some or all of their stipulations. Should one cross one's fingers while clicking "Agree", or should one cancel one's order/installation, etc.?</p>
