    html: |-
      <p>&gt; would that constitute 20:80 ownership?</p>
      <p>It's not percentages, it's more like a set - I mean of people who have a say in the use of the end-result. I agree it's not very slick, but ignoring the "rights"* of people who make some contribution is unfair. I guess this all goes back to the idea of Original Contribution, where I for one think ANY font owes something to other people - and the fact that some of them are dead does not make it OK in my mind. I'm not saying fonts are public property, but I am saying we're all living on the same planet, and a font designer shouldn't belittle the value of somebody who pays money for his stuff and is interested enough to try to improve it (even if the original designers thinks it's not an improvement).</p>
      <p>* Quotes because I don't like the usual meaning of the term, I just couldn't find a better one right now.</p>
      <p>hhp</p>
