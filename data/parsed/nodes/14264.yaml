      <p>I'm sure you know what my two cents look like on this: The EULA is "ratified" by the foundry stating it and the customer accepting it. The customer agrees to the terms set forth by the foundry. If one of those terms states that the terms of the agreement may change in the future, then caveat emptor big time. The customer is responsible for sticking to the terms of the EULA she accepted at the time of purchase, not any subsequent EULAs.</p>
      <p>And if you see a "terms are liable to change" term in an agreement of any kind, run far far away: you may end up losing your first-born or a pound of flesh.</p>
