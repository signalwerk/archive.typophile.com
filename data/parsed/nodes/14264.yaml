    html: |-
      <p>The co-property thing would be a nightmare to administer. What would James do if two or three customers sent fonts back with similar mods, say they add Vietnamese support – would this become a four-way kind of deal? What if someone made an interesting but badly executed mod, which James might at some future date implement properly – would that constitute 20:80 ownership? </p>
      <p>The original designer should have the right to maintain control over their IP, but at their discretion they could certainly find some way to compensate a good repeat customer who provides constructive feedback, ideas and re-usable mods – I’m sure a lot of vendors do this already, through discounts and access to beta fonts.</p>
