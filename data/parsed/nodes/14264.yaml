      <p>Just like with regular OSS there's a risk of the IP becoming polluted with someone else’s IP - perhaps someone will paste in some characters from another font. You'd probably need to have people fill out and sign an IP declaration form stating that modifications were all their own work. </p>
      <p>However just getting the modified fonts back, without ever merging the mods into the shipping fonts would still be useful. It would show the designer what direction licensees are taking the fonts, and the designer could choose to follow that direction if he/she thought it would be of interest to the broader customer base.</p>
    html_clean: |-
