      <p>John, is the license from FS Canada, or FSI (FontShop International)? I believe that the FontFont library is owned by FSI. If that is so then FS Canada was merely the intermediary—your agreement was with FSI. If you had bought a font from a non FontShop-related foundry through FS Canada (Adobe, Monotype, Shinn, etc), your licenses wouldn't be voided just because FS Canada closed.</p>
      <p>Like I said, I really don't know what your situation was exactly. But even if the literature (flyers, etc) said that fonts were modifiable, those were the license. And it is the license that counts, isn't it?</p>
