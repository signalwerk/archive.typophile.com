      <p>Sorry. I'm a little late to the party. </p>
      <p>I agree generally with Chester's sentiments. </p>
      <p>I don't have a problem with modification. I will happily modify my fonts for users, but I do charge for that. If a user thinks they can do it themselves, I don't mind. If someone thinks they can improve the kerning, good for them. If they think the K should have a swash, fine. The only thing I require is that they have a legitimate original license for the modified font and that they don't give copies of the modified font to anyone who also doesn't have a legitimate license to the original. I also do not offer free technical support for a modified font.</p>
      <p>Something that keeps coming up in this discussion is the so-called "value added" problem: To my mind, anyone who uses my fonts uses them because it adds value to whatever it is they use it for. If someone uses it in a highly prominent way, say for a logo or national campaign, how exactly am I losing out? Because they used an off-the-shelf font instead of hiring me to make a custom font for them? If I see a font of mine used in a prominent way, I am extremely happy, even though it's quite possible that only the minimum 5-user license was purchased. To me, it's free advertising. If anything, for such cases, I would request that the name of the font be mentioned somewhere, as in a colophon.</p>
      <p>My biggest concern is that users not distribute my fonts <em>as fonts</em> beyond the limits stated in the EULA (i.e., the number of users). I don't mind embedding of any kind as long as the fonts cannot be practically extracted and installed as fonts separate from the document (or software) in which they were embedded. Incidentally, fonts may technically be extracted from PDFs, but such fonts are diminished versions of the original fonts (no kerning tables, OT features, etc.), so I don't worry much about that.</p>
      <p>When I say font, I also don't mean just in the particular format it's in. If someone started selling and distributing rub-down type in one of my fonts, I would have a problem with that, though I'm not sure exactly what I could do about it given that typeface designs have such limited legal protection (in the US at least).</p>
      <p>I really don't understand the attitude of some type designers who seem to want to put up all sorts of restrictions about how their fonts may or may not be used. To me, the more you can do with a font, the more valuable it is and the more potential customers I have. A font is not a work of art that needs to be protected to preserve the vision of the artist. It's a tool to be used by others to create things. A font has more in common with a tube of paint than it does a painting.</p>
      <p>I noticed that my EULA was mentioned in passing by James H. I agree that it could be better and less ambiguous. Occasionally, I have been asked for a clarification from a customer. In fact, I don't think much of what I outlined above could be deduced from it. I wrote it (or, more precisely, reworded someone else's) years ago when selling fonts was only a tiny part of my livelihood. This discussion has given me a lot of food for thought about how I will rewrite it.</p>
