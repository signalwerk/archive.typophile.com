      <p>Tiffany:<br>
      Of course I've spent more time (=money) on this than if I had done a search and replace. My point is that I shouldn't have to jump through such hoops. </p>
      <p>The fact that you don't feel comfortable with FontLab is unfortunate. I'm no expert, but the kind of modifications I'm talking about aren't difficult, and aren't dangerous. </p>
      <p>Believe me, it takes far less time to add ff ligs to a font for use in InDesign than it does doing S&amp;R every time you use the font, and then remembering to redo the S&amp;R if you change fonts. If I switch my headings from Seria to Seria Sans, I'm going to have to go over to the Sans "expert" (ha!) set to get the ligs again. </p>
      <p>Am I the only one who's printed a piece with a word like "office" showing up as "oVce" because I missed a expert set switch after changing fonts? Thanks, but no thanks.</p>
      <p>I don't mind terribly that they haven't compiled the ligs into the fonts. I _do_ mind that they won't let me do it for my own work. I'd be happy if they said modifications "voided the warranty". (Oh, that's right, there is no warranty, is there?)</p>
      <p>The FontShop EULA I'm referring to is the one offered if you go through the checkout process at FontShop USA. You, or anyone else, can view it there if you wish. I can email it to you if you'd like.</p>
      <p>I don't know the current status of FSI Canada. I don't get the impression that the current Canadian terms are different from the USA ones. I was referring to a pamphlet sent to me several years ago by FSI Canada entitled "FontShop's Guide to Legal Typeface Use". I had, naively, relied on it in the past.</p>
      <p>I can't find EULAs for any FS Canada font purchases. I have FF Clifford on floppies from them, but the disks don't seem to have EULAs on them. I have some original compressed packages sent to me by FontShop on my hard drive, but, unfortunately, they will no longer open on my Mac, even in Classic. The floppies may have come wrapped in a printed EULA, but it's no longer to be found. I suppose I thought the pamphlet told me what I needed to know. Ah, youth!</p>
