    html: <p>&gt;Letterwise reading is for little boys. <br> <br>And bouma reading is for the mentally fuzzy, my friend! <br> <br>In identifying a word by its sequence of letters, the reader does not proceed "letterwise", but gathers only as much information as is necessary, by rapidly scanning back and forth, with saccadic eye motions, and combining foveal and parafoveal information. <br> <br>You assume that parafoveal vision is used to identify words by their overall shape, but there is no proof of this.  <br> <br>In the "letter sequence" model of reading, parafoveal vision is used to provide a rough set of options as to how many letters there are in a word, and what the individual letters might be. If the context of the sentence does not provide closure on a particular interpretation, then foveal examination is used to determine the word.  <br></p>
    html_clean: <p>&gt;Letterwise reading is for little boys. <br> <br>And bouma reading is for the mentally fuzzy, my friend! <br> <br>In identifying a word by its sequence of letters, the reader does not proceed "letterwise", but gathers only as much information as is necessary, by rapidly scanning back and forth, with saccadic eye motions, and combining foveal and parafoveal information. <br> <br>You assume that parafoveal vision is used to identify words by their overall shape, but there is no proof of this.  <br> <br>In the "letter sequence" model of reading, parafoveal vision is used to provide a rough set of options as to how many letters there are in a word, and what the individual letters might be. If the context of the sentence does not provide closure on a particular interpretation, then foveal examination is used to determine the word.  <br></p>
