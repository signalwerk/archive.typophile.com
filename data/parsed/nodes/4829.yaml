    html: "<p>&gt; bouma reading is for the mentally fuzzy <br> <br>Exactly. All human minds. <br> <br>&gt; You assume that parafoveal vision is used to identify words <br>&gt; by their overall shape, but there is no proof of this.  <br> <br>Oh yes there is. How much have you studied readabilty? <br> <br>&gt; parafoveal vision is used to provide a rough set of options <br> <br>Have you been listening to Larson? Too much, it seems. <br>His view is certainly convenient: it makes type design much easier (and more artsy). <br> <br>Letterwise reading fails in the light of both empirical and anecdotal evidence. <br>It cannot explain for example how: <br>1) Empirical: saccades span about three times the coverage of the fovea, with the parafovea unable to convey individual letters. <br>2) Anecdotal: Serifs helps readabililty, and loose letterspacing utterly destroys it. <br> <br>And there's something even worse about the letterwise model: it goes against the general heuristic mechanism of the brain, which is a fuzzy, guesswork-based system. Reading is like Chinese cuisine: nothing gets wasted - even the chicken feet are consumed. With the aid of linguistic context, the parafovea provides enough clues to identity <i>clusters</i> of letters (which is all it can convey anyway), speeding up reading - why not use the available information? <br> <br>Immersive reading is a liminal, performance-based task: there is no time for separate letters (most of the time). <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; bouma reading is for the mentally fuzzy <br> <br>Exactly. All human minds. <br> <br>&gt; You assume that parafoveal vision is used to identify words <br>&gt; by their overall shape, but there is no proof of this.  <br> <br>Oh yes there is. How much have you studied readabilty? <br> <br>&gt; parafoveal vision is used to provide a rough set of options <br> <br>Have you been listening to Larson? Too much, it seems. <br>His view is certainly convenient: it makes type design much easier (and more artsy). <br> <br>Letterwise reading fails in the light of both empirical and anecdotal evidence. <br>It cannot explain for example how: <br>1) Empirical: saccades span about three times the coverage of the fovea, with the parafovea unable to convey individual letters. <br>2) Anecdotal: Serifs helps readabililty, and loose letterspacing utterly destroys it. <br> <br>And there's something even worse about the letterwise model: it goes against the general heuristic mechanism of the brain, which is a fuzzy, guesswork-based system. Reading is like Chinese cuisine: nothing gets wasted - even the chicken feet are consumed. With the aid of linguistic context, the parafovea provides enough clues to identity <i>clusters</i> of letters (which is all it can convey anyway), speeding up reading - why not use the available information? <br> <br>Immersive reading is a liminal, performance-based task: there is no time for separate letters (most of the time). <br> <br>hhp <br></p>"
