    html: "<p>&gt;How much have you studied readabilty? <br> <br>Hrant, please zip your fly. <br> <br>You present your reading theories as if they are reality supported by all the latest scientific research, when in fact the issue is wide open. As Matt Davis of the Cognition and Brain Sciences Unit at Cambridge University put it, citing various recent scientific research, <br> <br>\"Clearly, the debate about whether we read using information from individual letters or from whole words is far from over. <br>  <br>In this thread, I suggested that the \"ligebility\" phenomenon presented in the hoax could be explained without recourse to the deep level of physiological reading theory, which is contested, but at the level of the problem -- which is solving anagrams. <br> <br>It's Occam -- the simpler explanation is better. <br> <br>But I don't think we're so far apart as you would imply with your \"letterwise little-boy\" diss. <br> <br>Consider these two statements from earlier in the thread:  <br> <br>1 (mine) In the \"letter sequence\" model of reading, parafoveal vision is used to provide a rough set of options as to how many letters there are in a word, and what the individual letters might be. If the context of the sentence does not provide closure on a particular interpretation, then foveal examination is used to determine the word. <br> <br>2 (yours) With the aid of linguistic context, the parafovea provides enough clues to identity clusters of letters <br> <br>What's the difference between a sequence of letters and a cluster of letters? </p>"
