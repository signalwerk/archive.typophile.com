      <p>&gt; since it seems this is for a corporate identity,<br>
      &gt; [vector] would be preferable over a bitmap</p>
      <p>That's a good point; logos are generally vector art.</p>
      <p>Another thing to keep in mind is that while the map itself would be in the public domain due to its age, the actual photograph of it might be copyrighted by the photographer. And this would make sense as the photographer may have gone to some time and expense to find, photograph, and retouch it. And in some cases the photographer might be able to easily tell you're using his photo due to a digital watermark, or some specific retouching he's done to it, etc.</p>
      <p>So be sure that both the map AND the photo of it are in the public domain (or use a licensed photo, like from a stock photo company, and be sure the license agreement permits use in logos). Or use a vector image made specifically for the identity.</p>
