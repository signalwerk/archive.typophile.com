    <p>There are many types of maps out there. I'm sure many more than I could conceive of. A quick example is a topography (not typography!) map versus a simple map showing country borders (of which, of course, there are many variations of!).</p>
    <p>Does anyone know how I might go about finding a map that has a bit of a crafty, old-world feel? </p>
    <p>I don't mean a one simply thrown onto an old manuscript (as a super clean vector will never really look that old).</p>
    <p>I have a client for an identity who is going with a bit of a traveler/mariner theme--we need a good map.</p>
    <p>There's something about the 7th one in this list that I like, perhaps the illustrative quality (which would be appropriate) is drawing me in. (forgive the pun)</p>
    <p><a href="http://www.webresourcesdepot.com/free-vector-world-maps-collection/" title="http://www.webresourcesdepot.com/free-vector-world-maps-collection/">http://www.webresourcesdepot.com/free-vector-world-maps-collection/</a></p>
    <p>I know it's a shot in the dark but I'm hoping someone out there has some knowledge of geological or cartological terminology--because I just don't know how to ask for what it is I'm looking for. (and NO "illustrated maps" as a search term generates results that are way off the mark)</p>
