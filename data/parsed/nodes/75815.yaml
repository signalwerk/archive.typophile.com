    html: <p>The Library of Congress has a few old maps on <a href="http://www.flickr.com/search/?q=map&amp;w=8623220%40N02" rel="nofollow">their flickr photostream</a>, but I bet if you called them they could help. Actually, any big, old library or historical society would be a good place to start. Just bring a digital camera - photocopiers won't do! Some old library's even have a <a href="http://www.marietta.edu/~mcshaffd/macro/copy.html" rel="nofollow">copy stand</a> available to mount your camera.</p>
