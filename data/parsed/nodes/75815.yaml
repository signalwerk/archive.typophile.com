      <p>Evan,</p>
      <p>Pictures of real Ye Olde Worlde maps are by definition bitmaps (as said above, photographs of actual old maps). They didn't think in the 15th century of supplying vector files :-)<br>
      However, the samples you point to are all vector files, and since it seems this is for a corporate identity, that <em>would</em> be preferable over a bitmap.</p>
      <p>Using data from <a href="http://en.wikipedia.org/wiki/GSHHS" rel="nofollow">GSSHS</a>, I can produce high-quality Illustrator files in just about any map projection you can think of (Mercator -- deprecated, actually --, Mollweide, Robinson, Werner, and loads more), and even throw in country borders. But there are two huge "howevers":</p>
      <p>1. The data is contemporary. I don't think Dubai's Palm Islands are incorporated (I'd have to check), but the Netherlands for example have all of their polders filled in. .. Come to think of it, I don't think that's visible on a global map ...</p>
      <p>2. The country <em>borders</em> are contemporary as well! In your link of examples, the Illustrator file 'with borders' clearly shows Yugoslavia as one big country (but not the Soviet Union). Whether or not that makes it "ye olde worlde" depends on your age ...</p>
      <p>A third 'however' is that it'd require you to manually make it old style. Sepia? Blurry lines? It mainly depends on the intended target size &amp; usage.</p>
