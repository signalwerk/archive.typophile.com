      <p>Blueflag--that is just about the perfect link. Those maps look great. Now to see if we can use them--which shouldn't be too hard to figure out since I live in Austin and have access to UT's great libraries. That points me to a question I was greatly curious about, thank you to James. Some maps might need a credit for usage, some can't be used at all for this. We'll see.</p>
      <p>But what the map is actually needed for, at this point, is the landing page background of the client's webpage. We're going with a compass for the mark, and this will tie together with that mark. I suppose it would be nice to use it on the business card design as well, but at the very least, for the website, perhaps its not too bad a thing to have a small, somewhat unnoticeable credit in the bottom corner. Maybe if it comes down to it they'll let me go take my own pictures so I can have infinite use.</p>
      <p>And Joe, thank for the link to Tierra Nueva. I'm not sure if my client is looking for that direction with the type, we'll come to that bridge. They would like a nice script for their name and my first thought is to checkout Sudtipos and see if something will match the mark--but I'll certainly check out if this could work as well.</p>
