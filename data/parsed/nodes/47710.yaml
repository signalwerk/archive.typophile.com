    <p>Hi All,</p>
    <p>I'm sure I've seen fonts around that have letters made from people bending and twisting to form the shapes of the letters. But now that I need it I can't seem to find one anywhere. Specifically I need the numbers from such a font. Does anyone know the name of such a font or where I could find it.</p>
    <p>Thanks in advance.</p>
    <p>John</p>
