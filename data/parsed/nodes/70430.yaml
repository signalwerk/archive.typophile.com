      <p>I think you can make the /R/ with a swash look alright, it will just take a lot of work to get it perfect. Editing letterforms is no small task. I would say do not mix the serif/sans, as the first logo looks wayyy more cohesive than the second. It just needs a bit of kerning as "River" seems way more tracked out than "land."</p>
      <p>Here's an /R/ with a swash I've done in the past, and it took forever. I considered swooping the /R/ all the way through the logo, but it was just too much, so I kept it really tight within the rest of the logo: <a href="http://www.studioimbrue.com/images/portfolio/trattoriarustica/1.jpg" title="http://www.studioimbrue.com/images/portfolio/trattoriarustica/1.jpg">http://www.studioimbrue.com/images/portfolio/trattoriarustica/1.jpg</a></p>
