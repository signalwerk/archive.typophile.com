      <p><cite>I'm definitely no typography expert, so I appreciate your educated opinion.</cite></p>
      <p>I am likewise no typography expert.</p>
      <p><cite>I do find that most Rs, especially ones with swashes, end up looking like Ps with tails if you stare at them for long enough.</cite></p>
      <p>This is partly true. But if the tail is not in harmony with the rest of the R, the eye disconnects both parts. The second tail is slightly better, but it still does not work.</p>
      <p><cite>I'm also curious as to what you think of combining serif and sans-serif faces in the Riverland word.</cite></p>
      <p>Why do you think, that splitting the word could improve the look? Why do you want to drag attention to the meanings of river and land? And if you use a sans serif and a serif for two parts of a word, the one font really should like the other. But the difference should be clearer. And therefore you can additionally change the contrasts between the fonts in such a couple word by choosing another weight or another color for one of the fonts. But here it is a bad idea. The whole thing looks cobbled together.</p>
    html_clean: |-
