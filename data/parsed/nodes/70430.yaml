      <p>Why does it have to have two visual tweaks - the swash of the R and the two type styles? It's too complicated, simple as it may look.</p>
      <p>I would go back to the concept: does a hearing clinic need a classic type treatment? Then do it so with proper swash characters and/or maybe small caps. Try Poetica. Or does it have to be a little hi-tech? Try mixing a modern or neoclassic with a light neo-grotesque sans.</p>
