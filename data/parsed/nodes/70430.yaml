    html: <p>I think it's better to keep everything serif for better unity. Furthermore, the problem with the R is that it stands out to much. I would make that swash continue in the right diagonal of the v and create a small gap between the swash/right diagonal and the left diagonal. The second swash is the one you should work with.</p>
