      <p>I remember the Letraset Catalogue (just because I am an old geezer) and have used it many times myself to choose transfer type to spend fortunes on. The genre of lettering is related to old baseball team names but there were plenty of old "commercial art" sources as well. Doyald did a splendid job of drawing and bringing Eclat to life.</p>
      <p>ChrisL</p>
