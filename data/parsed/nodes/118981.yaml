    <p>I’m trying to identify a font that appears on both the Mendl’s pastry box in the movie The Grand Budapest Hotel and on a contemporary poster for a beer festival. Images attached.</p>
    <p>(This post is a bit duplicative, but the Typophile comment system gave me an error message every time I tried to include new images in a comment.)</p>
    <p>(In case anyone is curious, “Mendl’s” on the Mendl’s box is almost certainly hand lettered, and “Brucknerplatz No. 12” is either Modern 735 or Bodoni Campanile, which appear to be identical.)</p>
    <p>Many thanks.</p>
