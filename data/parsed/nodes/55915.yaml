    <p>Hi,<br>
    in the last day I started to draw these letters. I started with a sketch I made while thinking about the recent Legato thread. I don’t know if I will be able to transform these in a complete set of characters, so I decided to start the thread.</p>
    <p>The idea is behind my initial sketch was the contrast between an upright counter and a stretched contour (the dashed lines, more or less).</p>
    <p>That’s all, I must say that I quite hate the 'a'.</p>
