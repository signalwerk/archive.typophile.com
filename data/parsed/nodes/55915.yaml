    html: |-
      <p>This looks pretty charming, although frankly I'm not seeing the essence of Legato click yet (assuming that's something desirable for you). And Avance is certainly echoing in your design. Enough so that I might make this practical suggestion: make this into a direct companion for Avance - maybe even a font somebody might use for special emphasis in place of Avance's own italic. To do this you would have to match the apparent size and color of Avance (or possibly its Italic).</p>
      <p>As for your slant, I think it's a good deal outside the barfogenic zone* (although it does depend on point size, and you seem to be aiming small, which makes the zone larger). You might still want to increase it though (especially if you go with the idea above).</p>
      <p>* For the record, I got that term from a book about multimedia, in reference to animations with frame rates of between 8 fps and 15 fps, which can actually induce physical nausea (because the human "firmware" can't decide if its moving or not).</p>
      <p>hhp</p>
