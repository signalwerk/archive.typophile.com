      <p>The Wikipedia article about <a class="freelinking external" href="http://en.wikipedia.org/wiki/Latin-derived_alphabet" rel="nofollow">Latin-derived alphabets</a> is the nearest single source I know (I'm assuming you are searching mainly for Latin script languages).</p>
      <p>For deeper information, you can take a look on each letter and language article published in Wikipedia. Each <a class="freelinking external" href="http://en.wikipedia.org/wiki/A" rel="nofollow">letter article</a> brings a table with diacritical combinations.</p>
      <p>About transliterations, there is an <a class="freelinking external" href="http://transliteration.eki.ee/index.html" rel="nofollow">excellent archive</a> made by Thomas Pedersen. It's almost hidden in the Estonian Language Institute site, the same cited by Kentlew. </p>
      <p>I'm concluding a survey about glyphs needed to support all Latin-script languages and also phonetic systems (IPA, APA, etc.). Unhappily, I did not keep information about the languages, just took the glyphs.</p>
