    <p>Hello all,<br>
    I've done a search and can't find exactly what I'm looking for.</p>
    <p>I am trying to find a single source that has a list of diacritical marks, their unicode and corresponding languages.</p>
    <p>Wikipedia seems to have a good source of quantity but its not necessarily user friendly to sort through.<br>
    <a class="freelinking external" href="http://en.wikipedia.org/wiki/Diacritic" rel="nofollow">http://en.wikipedia.org/wiki/Diacritic</a></p>
    <p>Thanks!</p>
