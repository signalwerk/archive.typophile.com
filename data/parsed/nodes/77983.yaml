    html: |-
      <p>The appendices to Bringhurt's Elements of Typographic Style are very useful for this, though I admit I don't remember if he lists Unicode values for all of them. And of course, this is only for Western alphabets. You could also try the Unicode site itself — for instance:</p>
      <p><a href="http://www.unicode.org/charts/PDF/U0300.pdf" title="http://www.unicode.org/charts/PDF/U0300.pdf">http://www.unicode.org/charts/PDF/U0300.pdf</a></p>
      <p>Though the code tables don't identify languages that the diacritics are used in, Bringhurst does, so between the two resources you may have what you need.</p>
      <p>Josh</p>
