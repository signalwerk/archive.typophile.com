      <p>I don't lean toward any of these particularly but rather a combination of few:</p>
      <p>1. Take the lettering of #1<br>
      2. Remove the symbol to the left<br>
      3. Just take the crown from the symbol an put it on top of /E/ as you did #3 which is too playful and they don't make toys<br>
      4. Set /Marble &amp; Granite/ whole width and make it a bit more prominent - maybe even using tricks from #2 but I'm not too sure how to do it mayself (yet).</p>
      <p>Do not forget that this logo should be possible to be cut into marble/granite. Light type (especially /Marbe &amp; Granite/) may be too problematic. Make it applicable for their business. What good would be a logo for i.e. fashion if it couldn't be sufficiently sewn on fabric?</p>
      <p>But to look at all these I think that #3 and #4 are too playful for the business they do and don't work with this type.</p>
      <p>As I said in AD3 to put the crown on /E/ I would also try putting it on the last /e/ which would balance the whole word as it gets smaller to the right because /e/ is not full high. Putting a ballanced subtle crown on it may help with that.</p>
      <p>edit: Sorry I just noted that this is a very old thread long gone and finished. Forget what I just said.</p>
