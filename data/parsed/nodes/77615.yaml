    <p>Hello everyone, working a small project for a family friend. Company name is Elite Marble &amp; Granite. Name pretty much what they do. They want to come across a professional and established company. "Simple" and "Clean" are the two most used words when describing the feel. Because of the name "Elite" I thought number 1, top notch and royalty. I explored with granite slab idea in the #1. Three slabs making an "E" and crown. #2 takes on the "number 1" idea. Converted the "I" into a one and used a rectangle to show the slab of granite/marble. #3 is a play on the letter "E" and swirls of color/pattern variations in the stone work. #4 focus on the royalty idea. </p>
    <p>Here are some first draft ideas. Do anyone of these jump out at you? Thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/elite_5740.jpg"></div><p></p>
  html_clean: |-
    <p>Hello everyone, working a small project for a family friend. Company name is Elite Marble &amp; Granite. Name pretty much what they do. They want to come across a professional and established company. "Simple" and "Clean" are the two most used words when describing the feel. Because of the name "Elite" I thought number 1, top notch and royalty. I explored with granite slab idea in the #1. Three slabs making an "E" and crown. #2 takes on the "number 1" idea. Converted the "I" into a one and used a rectangle to show the slab of granite/marble. #3 is a play on the letter "E" and swirls of color/pattern variations in the stone work. #4 focus on the royalty idea. </p>
    <p>Here are some first draft ideas. Do anyone of these jump out at you? Thank you.</p><div class="imageWrap"><img src="/files/elite_5740.jpg"></div><p></p>
