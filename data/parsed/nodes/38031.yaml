      <p>You might like <a href="http://www.fontshop.com/fonts/singles/creative_alliance/handle_old_style/">Handle Old Style</a>, <a href="http://www.fontshop.com/fonts/downloads/monotype/belwe_std/">Belwe</a> or <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/trieste_ot/">Trieste</a>.</p>
