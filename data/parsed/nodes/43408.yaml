    <p>Graphic design has been a huge interest of mine for the last few years and after attending a couple different colleges in non design related programs, I’m thinking about switching over to a design school. The only problem is I’ve looked into most area graphic design schools and they are a lot more than I can afford. That being said, there’s a local art school that offers a bachelors in illustration that is less expensive than the other schools. They have a decent amount of graphic design classes. So my question is, would this illustration program be a good way to go? My plan is to run my own graphic design studio, but just in case, would I be able to land a job as a graphic designer with that degree?</p>
    <p>Thanks!</p>
