      <p>Thanks everyone, </p>
      <p>I’m gonna go to FF Cocon, which I was going to get before and now it’s a good excuse to do it.</p>
      <p>Also, in regards to GE Inspira, after looking closely at GE site and some GE product PDFs I can only see about 4 weights (Regular, Regular Italic, Bold, Bold Italic). 90% of design is set in Regular weight, which seems a little too thin (which doesn’t work very well in small size or negative space) and Bold is a pretty heavy. I think they’ll need a Semibold pretty soon…</p>
