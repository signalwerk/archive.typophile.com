    html: |-
      <p>my feeling: no rules, whatever looks good in context, less is preferable.</p>
      <p>the po box question depends on context, styles, weights, overall block layout,<br>
      any other uses of smallcaps ? does it stand out ? how many pieces of contact info need to appear, etc.</p>
      <p>i try to keep some sort of rhythm to the whole thing, with consistent weights,<br>
      prefixes, labels (or not) so it all holds together. </p>
      <p>i prefer to leave off the word “e-mail” as it’s usually self explanatory,<br>
      as are phone numbers, but on occaision you have a list of several contact options:</p>
      <p>office:<br>
      cell:<br>
      fax:<br>
      e-mail:   </p>
      <p>in which case consistency suggests giving them all the same status, but you’ve got to balance simpicity with clarity. if one piece of info stands out as odd from the rest, there’s probably a better way.</p>
