      <p>Use small caps if the letters are meant to be read as letters, not as words. So in this case, small caps PO, u&amp;lc Box works.</p>
      <p>As to business cards, simplicity is best. The less text you have, the easier it is to find what you are looking for without wading through it. People look at business cards specifically to find your email address, so they probably can identify it at first sight without a label.</p>
