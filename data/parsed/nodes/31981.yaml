      <p>I would do neither, PO Box would be acceptable to me, especially if the other lines of the address are title case, numerals might influence my choice as well.</p>
      <p>For the numbers urls and e-mail I quite often use<br>
      t:<br>
      m: (for mobile, I guess c: would be better for US)<br>
      f:<br>
      e:<br>
      w:<br>
      etc.<br>
      ranged right on the colon.</p>
      <p>Tim</p>
