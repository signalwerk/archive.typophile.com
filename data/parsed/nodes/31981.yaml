      <p>Nothing <em>per vim</em> is wrong as long as the address on the business card can be used. My interpretation is based on the fact that an address will be made up of a selection of numerals and words and each word will be in title case. So to introduce another level, especially at the beginning of a line, might affect the harmony of the setting, more significantly it might also affect the usability of the card, while not gaining anything.</p>
      <p>Tim</p>
