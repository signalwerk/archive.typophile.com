    <p>I’m designing a biz card and just had a question concerning the address block. The client has a PO Box and my question is; Is it correct to set ’PO’ in small caps <em>and</em> set the word ’box’ with a capital ’B’ or should I set the entire word in small caps. Also, when setting an e-mail address on a biz card, is it necessary to type ’e-mail’ in front of it? Is it something that is obvious or will it be confused with a web address? I personally would like to do without the ’e-mail’ title for simplicity’s sake. </p>
    <p>Welcome any and all input you may have. Thanks in advance.</p>
    <p>IM</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/31820" class="topic-previous" title="Go to previous forum topic">‹ Newspaper typography</a> <a href="/node/27388" class="topic-next" title="Go to next forum topic">Mono &amp; Lino Together At Last ›</a></div>
