      <p>I don't think I've ever seen this in digital form (or any other form — not in PL catalogs I have either). In searching MYFonts I found <a href="http://new.myfonts.com/fonts/pintassilgo/cuadrifonte/" rel="nofollow">Quadrifonte Fill</a> as about the closest to this feel. <a href="http://new.myfonts.com/search/Freddo/fonts/" rel="nofollow">ITC Freddo</a> is also quite a bit in this vein.</p>
