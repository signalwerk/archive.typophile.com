    html: |-
      <p>Also of note are designs with repeating letters (usually in a circular arrangement) to form patterns, arguably the most famous being Licko's Hypnopaedia:<br>
      <a href="http://emigre.com/EF.php?fid=98" title="http://emigre.com/EF.php?fid=98">http://emigre.com/EF.php?fid=98</a></p>
      <p>And then there's a site that dynamically renders snowflakes (although with 8 sides instead of 6) out of phrases that the user types in:<br>
      <a href="http://www.typeflake.com/" title="http://www.typeflake.com/">http://www.typeflake.com/</a></p>
      <p>hhp</p>
