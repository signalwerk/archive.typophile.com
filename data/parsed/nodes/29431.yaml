    html: |-
      <p>Check out "Bembo's Zoo" - a book and a site:<br>
      <a href="http://www.bemboszoo.com/" title="http://www.bemboszoo.com/">http://www.bemboszoo.com/</a></p>
      <p>Also see traditional Arabic calligraphy, which sometimes uses long -and legible- phrases (often from the Qur'aan) to form pictures of various things (including animals). The book "Arabic Script" by Gabriel Mandel Khan  has great examples.</p>
      <p>Lastly, our Chris Lozos has a penchant for making pictures (such as his own face) out of letters.</p>
      <p>hhp</p>
