    html: <p>This morning, while making my bed, I was thinking about the impossibility of even attempting to point out highlights for TypeCon. I did mention two above, but realized this morning, while showering, that those weren't the only highlights, and maybe not even the top two for the whole of the last few days. Maybe the top two if we are just thinking in terms on the presentations, but even still ... Every presentation that I attended left me with more questions and thoughts and inspiration.  <br> <br>I've been visually emotionally physically intellectually and even spiritually (on some level) saturated. I'm sitting here trying to organize my day realizing that I can't because I'm already going through withdrawals.</p>
