    html: <p>&gt;<i>For those of you who weren't at the first 2, (I don't think anyone here except maybe Kent has,)</i> <br> <br>I didn't make the first, but I've been at every Con since. Things were really quaint the second year, not much different from the first (from what I understand). Things really took a leap forward when you took it on, Tony, and moved things to Rochester. And it just keeps getting better and better. My only fear is that it'll get too big and we'll lose the intimacy. I think this year was just about perfect.</p>
