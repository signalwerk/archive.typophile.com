      <p>I agree with Hrant. This needs a lot more work.</p>
      <p>To me the basics of typography are proportions, balance and great detail. I understand your intent, but I think it's just not working. The wobbly appearance of your font keeps me from seeing the good elements in there.<br>
      Try fixing the unbalanced curves and only than take it to the next level.</p>
  - id: 517892
    user_id: 54527
    user_name: PabloImpallari
    user_path: null
    date_raw: 3 Aug 2012 — 4:23am
    date: 2012-08-03T04:23:00
    votes: null
    html: |-
      <p>Hi Rian,<br>
      This is nice.<br>
      I like the wide proportions, and the almost semi-bold weight.</p>
      <p>Of course, still needs a lot of polish here and there.<br>
      Here are some recommendations:<br>
      - In your /n and /m, the top of the curve are too close to the first stem. Move them to the center, or closer to the second stem. Also, the transition from curve to stem looks unnatural.<br>
      - /m and /w are too wide.<br>
      - Maybe you can remove the spur on the /w last stem (and, why not, also in the /u)<br>
      - The /c has to much weight on the middle, move the outer curve 4 or 5 units closer to the inner curve.<br>
      - The ending angle on the /e and /s mach each other, but the /c looks like its from a different font.<br>
      - The /g and /s are unbalanced, try to find a better balance.<br>
      - The bottom curve on the /k need more work.<br>
      - The /y descenders is to much, make it shorter.<br>
      - The dots inside the dots doesn't make sense at small sizes<br>
      - The angle cut on top of the /l should mach the angle of the others (/b, /d, /h, /k)<br>
      - The /f crossbar should be shorter in the outside and larger in the inside (more like the one in the /t).</p>
