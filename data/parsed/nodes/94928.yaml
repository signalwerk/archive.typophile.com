      <p>PDF update:</p>
      <p>This s is pissing me off.  Udged and nudged it out a bit, looking better, not great.  g looks a lot better, imo.  Scaled the e and o down vertically to facilitate solid x height and baseline better.  Started some punctuation, large rounded squares.  Scaled back the overhangs of f and y slightly.  Extended lower leg of k, and lengthened primary stroke of f.  Tightened spacing a bit (wondering if too much?)  Didn't like the way the 'humps' of the u and w sloped to the right, but the m and n sloped to the left, so centered up the humps on the w and u.  Other small fixes and changes unremembered...</p>
      <p><a href="http://nonbookfonts.com/xtra/DetroitAFspecimen.pdf" title="http://nonbookfonts.com/xtra/DetroitAFspecimen.pdf">http://nonbookfonts.com/xtra/DetroitAFspecimen.pdf</a></p>
      <p>Critical comments appreciated.</p>
