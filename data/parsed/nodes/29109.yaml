    html: |-
      <p>It looks quite a bit like Canada Type’s revival of ‘Signum’ by Georg Trump that they call <a href="http://www.myfonts.com/fonts/canadatype/trump-gothic/">Trump Gothic. </a>. Look at the Bold weights set in the letters ‘SARTRE’. The A is a bit different in width, but the overall appearance is quite similar, I think.</p>
      <p>- Mike Yanega</p>
