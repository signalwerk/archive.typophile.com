    html: |-
      <p>SARTRE cover type+<br>
      Just a little more info on this face : I believe that it comes from a book published by Gallimard in France in or around 2005. The face makes me think of Garage gothic, which also has this slightly rounded feel. But this particular face is also slightly more angular, for example in the construction of the R, or in the S. I’ve checked the T-26 listing, and there are a couple of slightly similar faces by Jim Marcus (Arete Mono and Tempus gothic), but neither corresponds exactly.<br>
      thanks again,<br>
      pete</p>
