    html: '<p>It has been done: <a href="http://roostertypes.com/prod_display.asp?group_id=HelserifURW">Helserif</a>, designed by Phil Martin in 1976. Not completely successful, in my opinion. A better, similar font is <a href="http://www.fontshop.com/search/?q=serifa&amp;x=0&amp;y=0">Serifa</a>, designed around the same time by Adrian Frutiger. It is basically Univers with serifs.</p>'
