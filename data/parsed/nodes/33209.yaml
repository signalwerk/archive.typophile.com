      <p>Sounds like an interesting idea, but I don’t think it’s been done. Snapping serifs on to the letters wouldn’t be that hard, but making them look good and still be recognized as Helvetica is another matter.</p>
      <p>This sort of thing has been done with other fonts, or at least remarkably similar fonts in sans and serif versions (e.g. Avant Garde and Lubalin Graph, or Officina).</p>
      <p>I do recall a magazine article featuring design challenges (I think it was HOW, in a mid 1990s issue somewhere) featuring a redesign of Helvetica Italic that looked very nice, but I have no idea if that design was ever released as a font.</p>
