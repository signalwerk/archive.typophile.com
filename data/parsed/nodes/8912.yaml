    html: <p>Patricia your link needs to be modified to work <br><a href="http://www.apple.com/trailers/newline/sonofthemask/" target="_blank">http://www.apple.com/trailers/newline/sonofthemask/</a> <br> <br>I am not sure that is a commercially available font (i.e. it may be custom), but it's a style you might find at <a href="http://www.fonthead.com" target="_blank">Fonthead Design</a>, or <a href="http://www.pizzadude.dk/home.php" target="_blank">PizzaDude</a>, or maybe <a href="http://www.fontdiner.com/main.html" target="_blank">FontDiner</a>. <br> <br>It looks like a modification/distortion of something really familiar, like <a href="http://www.myfonts.com/fonts/linotype/lithos/black/testdrive.html?s=SON+OF+the+MASK&amp;p=48" target="_blank">Lithos</a>.</p>
