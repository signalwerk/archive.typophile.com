  html: |-
    <p>It's been great hearing from <a href="/wiki/Gerard%20Unger" class="freelinking" rel="nofollow">Gerard Unger</a> this week. At lunch he told a joke i found quite humorous:</p>
    <p>Q: what do making love in a canoe and american coffee have in common?<br>
    A: they're both too close to water.</p>
    <p>For a few more insights, you can check out <a href="http://www.pilcrowtype.com/blog" rel="nofollow">my other blog</a> (still very much a work in progress).</p>
