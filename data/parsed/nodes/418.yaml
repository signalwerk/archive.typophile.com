    html: "<p> Not quite. \"Grotesque\" is used in the \"primeval\" sense of the word, from the Italian 'grottesco' (\"of a grotto.\") Grotesque types were so named at the beginning of the nineteenth century because of the vogue for antiquity -- the Napoleonic conquest of Egypt ended in these years, and the craze for antiquities led manufacturers of all sorts to attach ancient sounding names to anything novel. Different typefounders chose their own historical names for this new sans serif style, among them \"Egyptian,\" \"Doric,\" \"Antique,\" and \"Gothic.\" The last two terms live on to this day, e.g. \"Franklin Gothic.\" <br> <br>Most of the new type styles developed during these years have antique names, too: slab-serif \"Egyptians,\" wedge-seriffed \"Latins,\" bracketed-seriffed \"Ionics,\" floriated \"Tuscans,\" octagonal \"Grecians,\" inverted \"Italians,\" and so on. <br> <br>For more on all of this, read James Mosley's \"The Nymph and the Grot,\" an essay now expanded and thankfully republished by the Friends of St Bride a few years ago. </p>"
