    html: '<p> A tangential question: <br> <br>What to call a serif like in Charter? Jim Parkinson has been using "Latin" to cover that type of serif (look at the description for his wonderful Azuza), but to me a Latin serif is pointy, not sheared off bluntly on the sides. But neither can it be called a slab, because there is a definite tilt. <br> <br>"Slab Latin"? <br> <br>hhp </p>'
