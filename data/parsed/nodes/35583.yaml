    html: |-
      <p>A belated report on our last meeting:</p>
      <p>Everything went swimmingly. Mark from Veer attended and offered great advice on moving our club forward, participated in the Name Debate, reported on TypeCon and gave insights into Veer's workings. Mark, thanks for attending. And thankyou for your generosity! Completely uncalled for but still much appreciated. We bought a round to toast your health!!</p>
      <p>Mark left a bag of Veer-Swag, including Activity Books and buttons, which will be available to attendees of our September meeting.</p>
      <p>Dave B. reported that he was moved to leave the lurker pool and become a member of Typophile. I don't think he's posted anything yet, but it's nice to have another Calgary face on Typophile. (If I can get on my soapbox for a bit...this is exactly how I see a type club working. It's a chance for people with an interest in type to meet, share resources and foster enthusiasm. Oh, yeah, and there's beer.) Congratulations, Dave, and welcome to Typophile!</p>
      <p>The great Name Debate is still ongoing. We've short-listed our favourites and we'll decide on one of those in September. Dave apparently wasn't satisfied with merely submitting names...he showed up with logos! So, in typical type-geek fashion, we've picked a logo already even though we haven't settled on a name. How does that work? (Hopefully Dave will post the logo for critique on this forum.)</p>
      <p>Lex was unable to attend, and we want his input on the Name Debate. So, Lex, you've got a month to come up with something better than what we've short-listed!</p>
      <p>On the agenda for the September meeting: Mike's illustrated letters, discussion of a membership push at the local Art+Design College, the possibility of getting a local gallery to host a Type Show. And Lex's report on how the movie is going ;-)</p>
