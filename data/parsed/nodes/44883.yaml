      <p>In Europe VAT is required if the vendor and the customer have their address in a country of the European Union. If the customer is from outside the European Union or if he is in a different EU country and can provide a Value added tax identification number, no VAT is/shouldn't be charged.<br>
      But only "consumers" care about VAT anyway, the B2B "customers" don't. Therefore FontShop Germany shows the prices without VAT, because their B2B customers don't care about the VAT.<br>
      In my shop all prices are shown including VAT, but if you register and your address is outside the EU or you have a Value added tax identification number the VAT will automatically be removed from your invoice.</p>
