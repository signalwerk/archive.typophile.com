    html: <p>If a business actually operates in more than one country (as opposed to selling internationally from one country), they may be required by law to list prices in the local currency. Unless they want to keep changing prices every day, the different local prices are going to get out of sync due to exchange rate fluctuations. A lot of prices treat the euro as roughly equivalent to the dollar, which was true some years ago - it isn't true now, but why change if Europeans are still willing to pay? It's not so much that European prices are high as that American prices have, in effect, sunk recently.</p>
