      <p>"why large foundries such as Veer and FontFont charge different prices for typefaces depending on what country you live in."</p>
      <p>To maximize profits. The Standard of Living varies so widely from nation to nation, it makes sense to price accordingly based on region.</p>
      <p>This is true of most software companies and other 'virtual' products. Not to mention a variety of physical products as well. You can buy MS Office in the US for maybe $150 and in some countries, it'll cost you $5.</p>
      <p>Purchasing products out of country is typically called the 'grey market'. Not necessarily illegal, but usually voids things like warranties and EULAs.</p>
