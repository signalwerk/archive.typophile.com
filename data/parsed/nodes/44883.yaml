    <p>Greetings fellow typophiles!</p>
    <p>I'm a pretty new member here, and not sure if this has been addressed before. I did a search before and nothing came up, so here goes.</p>
    <p>I was just wondering if anyone had any knowledge of why large foundries such as Veer and FontFont charge different prices for typefaces depending on what country you live in.</p>
    <p>I've purchased alot of type in my time when I lived in the states, and this was never an issue. However I recently relocated to Australia and recently encountered this curious situation. It hasn't been an issue with independent foundries that have flat prices, but with the bigger houses, its another story.</p>
    <p>Take Veer for example. I spec'd some typefaces for a job and went to the veer site to get the price which came up as 50.00 USD. I put the cost on the estimate to a client which gets signed off, and when it comes time to actually buy the typeface, I register with the site with my new Australian details, and the same typeface comes up as 50 Euro.</p>
    <p>I emailed Veer about it, and this was the response I got:</p>
    <p>"When you are not a registered user, you will be on the North American<br>
    website and therefore see the North American prices in USD. Previously<br>
    all transactions were based on USD but with a recent change in our<br>
    organization we started our operation in Europe/Asia/Australia. With<br>
    this start-up we also changed the website and introduced different<br>
    currencies.</p>
    <p>This expansion means that we have started our business officially in<br>
    Europe/Australia with a Sales and Service Center in Berlin, Germany. In<br>
    the future customers in Europe as well as Australia will be supported by<br>
    the team in Berlin. This also means that territories supported by our<br>
    European call center will see the transactions in Euro. The currency and<br>
    the support is linked to the billing address. The prices are different<br>
    in several countries and adjusted to reflect the competition and the<br>
    price structure in Europe and also Australia."</p>
    <p>The thing is, that the population of the entire country of Australia is about that of Manhattan alone. Budgets here are much, much, much smaller than North America. For one typeface, its not a big deal I know, but when you look at a collection, take Umbrella Type for instance which is around 5,000 USD for a US resident, is now 5,000 Euro for a European or Australian resident. A difference of thousands of dollars. No client here would ever sign off on that.</p>
    <p>Fontshop also has differences in pricing, but at least its not just switching the currency sign, and the conversions come out a bit closer.</p>
    <p>I am a passionate supporter of Veer and all their wonderful stuff. I love nothing more than buying type when I can, especially single faces for personal projects and experimentation. A practice like this just seems unsustainable to the community, and a bit annoying as well, as I have to get my family back in the states to buy type for me :)</p>
    <p>I just wondered if anyone else had any thoughts on this. Am I just over reacting? Is it another case of a designer who has no grasp of basic economics? This just seems like a curious practice to me, essentially for something digital that has no extra costs associated with it (like shipping, etc). I'd love to hear anyones opinions or experiences! :)</p>
    <p>Thanks!</p>
