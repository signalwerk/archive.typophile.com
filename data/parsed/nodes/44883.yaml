      <p><cite>Is it another case of a designer who has no grasp of basic economics?</cite></p>
      <p>Well, yes. No product has a "universal value". Prices may only "suggest" a certain value. But the perfect price is based on supply and demand. And the demand is different is every nation. When a European customer is willing to pay 200% of the price in the U.S., then he probably also earns 200% for his job, compared to a designer in the U.S.<br>
      When the font vendor would try to raise the prices to 200% everywhere, they would loose their U.S. customers. When they keep it to 100% everywhere, they loose money, because the European customer is willing to pay more. So it's perfectly normal charge different prices in every nation.</p>
