      <p>&gt;<em>How do taxes play into this equation? Would say a VAT increase the retail price of a font bought in Euros or from a European country?</em></p>
      <p>I think so! If you buy a font from a European website, they will include the VAT in the amount they charge you. I think that, if you are not a European, you can get your VAT back, but not from the company you bought from, but rather from the country in which that company operates. I have never tried this myself, however.</p>
      <p>Alternatively, you may be able to call up the company, and prove somehow that you don't have to pay VAT. They they could sell you the font VAT free offline I guess. But I'm not a tax specialist! Anyway, I think that the onus is on the buyer to prove he doesn't have to pay VAT tax. Europeans selling goods have to collect the VAT tax and pass it on to their governments.</p>
      <p>VAT can be like 20%, too. It varies from country to country. IIRC, the price difference between Apple computers sold in the US and Germany for a time was pretty much just the different between with VAT and without. For Americans who live in states with low (or no) sales taxes, VAT may be difficult to understand. Different countries operate under different systems. If you shop from a company in a different country, you have to accept the way that their system operates, not expect them to change their business to operate the way that you are used to (this would be illegal for them anyway…).</p>
