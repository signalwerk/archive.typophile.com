    <p>I need a new font for our corporate letterhead contact details. Here’s the logo:</p>
    <p></p><div class="imageWrap"><img src="/files/logo_fortypophile.jpg"></div><p></p>
    <p>Both the graphic and the name Alembic need to stay the same (though I think they are too close and crowded looking in the picture above). Our old letterhead is very 80’s: a gradient strip on the left with the line art and contact details reversed. The font was Futura. </p>
    <p>This time, we’ll be using the full color logo, a return to our original ID. I need a font that is classy, since we are a high end guitar maker. But it shouldn’t be harsh, since our product is handmade and sensual. Any suggestions of specific fonts or general styles that would fit the bill?</p>
