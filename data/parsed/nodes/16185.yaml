      <p>Are there other typefaces you’re currently using on other print materials (brochures, etc.) that would work? It’s always good to have a selection of approved typefaces to use on all your materials, the letterhead is one piece within your overall identity, so consider faces that will work on a wide range of materials, not just the letterhead. Sounds like there may not be a corporate guidelines book for you to follow, so now is your chance to start establishing those guidelines.</p>
      <p>By the way, have you seen this?<br>
      <a href="http://www.psyops.com/html/spec_alembic.html" title="http://www.psyops.com/html/spec_alembic.html">http://www.psyops.com/html/spec_alembic.html</a></p>
