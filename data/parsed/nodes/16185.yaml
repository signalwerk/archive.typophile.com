    html: |-
      <p>Wow, thanks for the great suggestions everyone. This is not an easy job for me, and the help is really welcome.</p>
      <p>Chris, we use a variety of fonts for the brochures, website, etc, and you’re absolutely right for the need for guidelines, and so I start on the simple part of letterhead and business cards, which are the first items I’ll actually produce. Right now I’m enjoying things as different as Tankard’s Alchemy and Simonson’s Grad. I use Minion for our owner’s manuals.</p>
      <p>Tiffany, I do agree that it needs to be almost anti-decorative, or least only very subtle. All the serif fonts I tried weren’t looking quite right. </p>
      <p>Chester, your list of suggestions produced quite a suprise in Solpera - it’s now on my short list with Stella. Spalted type? Heh, that won’t last for many impressions. Lignum vitæ, now you’re talking.</p>
      <p>Nick and Dan, I think I’m not brave enough for Emigre. I <em>want</em> to like them, but then there’s always some design aspect I don’t seem to understand. </p>
      <p>Here’s the worst thing: our address.</p>
      <p>3005 Wiljan Ct.<br>
      Santa Rosa, CA 95407</p>
      <p>“Wiljan” was made up by the developer of the buildings on our street. It combines all the goodness of “William” with the beauty of “Janet” and smashes them into one ugly word. </p>
      <p>It’s likely the paper will be a sort of parchment-like antique color, because that’s what my mom wants and she is the boss. In that case, the type will be set in a nice woody brown tone. I’m still evaluating papers, each part helps form the whole, and all aspects influence the others.</p>
