      <p>If you're happy with a traditional choice (yes, Freight is grande …) –<br>
      Bulmer MT – <a href="http://new.myfonts.com/fonts/adobe/bulmer/" title="http://new.myfonts.com/fonts/adobe/bulmer/">http://new.myfonts.com/fonts/adobe/bulmer/</a></p>
      <p>Another one – Hercules – with nice quirks made by Mr. Storm – <a href="http://new.myfonts.com/fonts/storm/hercules/" title="http://new.myfonts.com/fonts/storm/hercules/">http://new.myfonts.com/fonts/storm/hercules/</a></p>
      <p>Borges, i want to see this typeface in a mag, prominently – <a href="http://new.myfonts.com/fonts/pampatype/borges/" title="http://new.myfonts.com/fonts/pampatype/borges/">http://new.myfonts.com/fonts/pampatype/borges/</a><br>
      and Knockout is so multi-style, that this combo could work also, … it depends. Might be to colorful for the nice quirky Knockout Series …</p>
      <p>Regards</p>
