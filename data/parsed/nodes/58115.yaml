    <p>Hello All,</p>
    <p>Just a quick question, are the 'ODEON' fonts (ODEON headline and ODEON lette gothic) the same as ITC Machine and Letter gotic. I e-mailed the company and recieved the following reply:</p>
    <p>Dear Mr Storey, </p>
    <p>Thank you for your subsequent email. The font used in the ODEON sign is not a commercially available font.  It is a unique font owned exclusively by ODEON and is used in all of our designs and most importantly forms our ODEON logo.  We actually use 2 different fonts: </p>
    <p>ODEON Headline - This is the most recognisable font and is used in our name signs. It only has capital letters. </p>
    <p>ODEON Letter Gothic - This is our secondary font and is used in sub-headings, etc.  Again, it only has capital letters. </p>
    <p>We hope that this answers your questions. </p>
    <p>Yours</p>
    <p>----------------------------------------------------------------------------------------</p>
    <p>Please find the images they sent me as well.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/headline_4896.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/letter_g_4488.gif"></div><p></p>
