    votes: null
    html: |-
      <p>Really nice font :)</p>
      <p>Since the first image has sentences with Romanian diacritics (my language), may I say that while the distance between them and the letter is good (so keep it the same) the comma-accent of lowercase |ț| and |ș| are too heavy – they should be a bit smaller – around 90% or even 80%, I'd say. (And FYI, most of the time the comma-accent diacritical mark should be smaller than the "regular" comma anyway).</p>
      <p>Also, the circumflex of |â| should be nudged a bit to the right, to be centered to the upper extrema point of |a|.</p>
      <p>cheers  :)</p>
    html_clean: |-
