      <p>Very respectable for a first font!</p>
      <p>Some letters feel too wide to me; {u h z E F M Z} in particular. You seem to have a different arch design in {h} than in {n m u}; the latter look better in my opinion. Your previous {g} seemed more in character than the new open one. The {t} is a bit timid. {C G} look like they bit into a lemon; maybe relax their apertures a bit?</p>
      <p>Cheers!</p>
