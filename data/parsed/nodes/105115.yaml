      <blockquote><p>I've always wanted to find a chart of standard widths of letters as they relate to the m. If you know of anything, I would appreciate it.</p></blockquote>
      <p>The trick is in learning to see and balance the counter spaces. If you look at the beginning of "phonmusik" in that last image, the /o/ captures less interior space area-wise than the /p/, and the /p/ less than the /h/. The closer those are to visually balanced, the better. No chart needed, just your eyes!</p>
