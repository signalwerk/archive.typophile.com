    html: |-
      <p>This one is worth doing. Pretty nice, even.</p>
      <p>About the grid coarseness issue: if you really get pushed into a corner you could give the font a negative talus (like script fonts often do), probably by making the x-height (mostly) fill the Em and letting the extenders go over. Especially since this thing will probably only be used to set one like at a time, this isn't unsafe.</p>
      <p>hhp</p>
