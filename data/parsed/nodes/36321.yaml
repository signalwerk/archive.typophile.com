    votes: null
    html: |-
      <p>Sorry for the joke :(</p>
      <p>Yes, in my experience, companies tend to set all correspondence in the same typeface; there is only one company image. Some companies have also "correspondence" cuts of their corporate typefaces, i.e., a version of their typeface that looks more like a typewriter, to make the secretaries feel more comfortable (this is not a joke). At a Berlin Typostammtisch, Ole Schäfer from PrimeType said that they still make these for some of their clients.</p>
      <p>I don't see what benefit you'd have from setting some documents in Charter and others in Bembo. Both typefaces are just fine. Depending on what laser printers you use in house, one may look more readable on your company stationary than the other, but that is about it. As far as I am concerned, it would be better to use either one of the faces, and just stick with that. It helps build up brand consistency a little bit.</p>
      <p>On the other hand, what really matters in your contracts is what they say, not in what typeface they are set in. I know that this sounds a little blasthemous, butreally, as long as you are using a nice legible and readable typeface (consitenctly?), the rest really does not matter all that much. Document layout matters a little, too, as do fine typesetting aids, like perhaps small caps, old style figures, ligatures, etc.</p>
