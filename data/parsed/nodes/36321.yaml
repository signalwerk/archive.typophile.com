  html: <p>I am designing a standard legal contract to give to my freelance clients. Should I set the contract in cold, serious font or set all the business documents in the same font for consistency?</p>
  html_clean: <p>I am designing a standard legal contract to give to my freelance clients. Should I set the contract in cold, serious font or set all the business documents in the same font for consistency?</p>
