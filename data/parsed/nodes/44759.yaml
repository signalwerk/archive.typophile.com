    html: |-
      <p>I'm not a big fan of changing the weight of letters progressively within a word, because i always hits a breaking spot where it just looks hokey.</p>
      <p>It's like that Coca Cola product 'Zero'.  Yeah, it has a very very very nasty type treatment hat I think originally was supposed to indicate weight loss, but I won't touch the stuff because it's such an abonimation of type.</p>
      <p>I really strongly second 'all about seb's suggestion, having a fun vector comic-book boom would be wonderful.</p>
      <p>You could also look at colouring treatments like comic book titles, big letters with half-tine gradients in them (which still hold up in B&amp;W)</p>
      <p>my first thought when I saw your rounded sansserif was intense sadness.  It looks like it's trying to be too cliché, or too trendy, but I'm not certain of the freshness or longevity of a trend like that.  Best of luck!</p>
