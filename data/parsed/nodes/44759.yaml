      <p>For such an explosive word (pun intended) I'd personally like to see the work less rigid and locked down. While your version is clean and well constructed, it doesn't convey any energy, fun or excitement that could come with a moniker like Boom.</p>
      <p>I might be repeating what a lot of others have said, but this is one of those projects that people love to get. It allows them to explore the less confining guidelines in logo design. Get creative and throw some passion into this less than stellar first attempt.</p>
