    <p>Yves and Stephen have been wonderful over at <a class="freelinking external" href="http://fontfeed.com/archives/screenfonts-january-2009/" rel="nofollow">The FontFeed</a> helping to id the type used in Valkyrie, but i would like to know if the title type is a font or lettering. </p>
    <p>You can see the first 6 mins over at Apple:</p>
    <p><a href="http://www.apple.com/trailers/mgm/valkyrie/" title="http://www.apple.com/trailers/mgm/valkyrie/">http://www.apple.com/trailers/mgm/valkyrie/</a></p>
    <p>If anyone has seen the movie and can remember what the type used for the ending credits was, i would love to know. i can't find a vid/pic of it online.</p>
    <p>thanks!</p>
