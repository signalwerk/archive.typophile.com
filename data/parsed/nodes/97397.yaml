    html: |-
      <p>Hi Luma,</p>
      <p>Thanks for feedback, I suppose I'll start from the top. </p>
      <p>Basically, my boss has just bought over two other print companies and is currently running them from the same building but under different names. I figure this is a great opportunity to take the metaphorical bull by it's metaphorical horns and sell him a really nice concept to unify the three (partly for ease of running and partly for a little consistency in their approach toward clients).</p>
      <p>As for the company themselves, they will take on any job so long as it's paid, big or small. They do quick turnaround on a regular basis if deadlines call for it (at the expense of their staff's sanity!) and they rarely make mistakes. I think I probably worded it badly in my OP. What I'm really trying to create is something bold, reliable and trustworthy. Clarendon's fine balance of 'softened solidity ' is what led me to choose it initially. Clarendon does have a retro feel, although it strikes me as a face that can be made to appear fresh if treated correctly (off-hand I remember seeing a job on Behance for a recruitment company called 'nice' that handles Clarendon particularly well).</p>
      <p>I should also make it clear that I've purposefully only been working with around 15 sans, 15 serif and 15 display faces until I get a little more comfortable with each (hence the novice remark earlier!) Once these become familiar, I intend to add fonts occasionally by way of a treat rather than wading through thousands of sub-par fonts and confusing myself in the process.</p>
      <p>The name itself works well as it has all sorts of extensions in terms of copywriting. First im<strong>press</strong>ions count and <strong>press</strong>ure on deadline day? Could have all sorts of fun with it. On it's own though, it may not have enough merit as you say. Possibly needs a prefix of sorts to make it a little more unique.</p>
      <p>Wasn't too keen on the 'e' lowered myself and had to add a thin stroke around the /p/ and /r/ to even the balance as /ss/ in Clarendon seems quite heavy. Does it strike you as particularly noticeable?</p>
      <p>Sorry for the wall of text and appreciate the response : )</p>
