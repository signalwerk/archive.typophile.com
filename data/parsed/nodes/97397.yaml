      <p>I agree with Luma - the name is just way too generic. </p>
      <p>It will be very hard to market online, but more importantly it is going to be very hard to make it memorable. Say someone notices the company and makes a note to use its services when the time comes. How likely do you think that they won't be able to tell if it were "press" or "print" or "ink"? Aside from the visuals, the logo needs to carry a concept, because in the end of the day that's what's getting remembered. Unless of course you are a <a href="http://upload.wikimedia.org/wikipedia/commons/c/ce/Coca-Cola_logo.svg" rel="nofollow">LocaGola</a> and can afford to pound an arbitrary image into your customers brain on a daily basis. Unfortunately, I think none of your four options has a strong concept behind it.</p>
      <p>I'd consider either tweaking the name or tying the logo to the word "press" in a more direct way.</p>
