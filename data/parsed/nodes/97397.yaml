      <p>&gt;  I figure this is a great opportunity to...<br>
      &gt; sell him a really nice concept to unify the three </p>
      <p>So you're not sure if he wants to combine them? Having separate companies might be an advantage if they each have their own identity and/or appeal to different segments of the market. Plus when a company does a merger and changes its name, it might be unnerving to some existing customers. And you may end up with some layoffs (such as "why do we need 3 receptionists now that we're one combined company?")</p>
      <p>Not saying its a bad idea, maybe he'll like it, but there are probably pros and cons.</p>
      <p>Agree with the others that "press" is pretty generic, and would suggest that you look carefully at the names and logos of other printers in your region to make sure you come up with something different from them.</p>
