    html: <p>The name has the danger of being too generic sounding that people won't realize it is the actual name. From what I am seeing, clerendon is giving a decidedly retro feel, which may be your definition of fresh and fitting. Lowering the /e/ feels a bit too gimmicky to me. Do they want to attract the bargain hunters or the 'price is no object' clients?</p>
