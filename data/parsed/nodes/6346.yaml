    votes: null
    html: <p>What threw me is that a while ago I came across a font called Jubilee Wood. In the copyright area it mentioned both Solotype and Alphabets Inc. It also had the alphabets W. Like I mentioned above, this may not have been an authorized version of Jubilee Wood and may simply have been A*I's BoxGothic renamed. I do realize that these designs existed looong before digital.</p>
