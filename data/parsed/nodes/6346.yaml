    votes: null
    html: <p>James, I'm surprised at your statement about Solotype licensing something from Alphabets, Inc. Some of my old Photo-Lettering books show styles a lot like 'Box Gothic' from long before A*I digitized Box Gothic in 1990.  To me it seems more likely that A*I digitized from an existing source, and Jubilee Wood (the Solotype name) may have been the original name of the wood type that pre-dates film type or digital fonts that copied the style.</p>
    html_clean: <p>James, I'm surprised at your statement about Solotype licensing something from Alphabets, Inc. Some of my old Photo-Lettering books show styles a lot like 'Box Gothic' from long before A*I digitized Box Gothic in 1990.  To me it seems more likely that A*I digitized from an existing source, and Jubilee Wood (the Solotype name) may have been the original name of the wood type that pre-dates film type or digital fonts that copied the style.</p>
