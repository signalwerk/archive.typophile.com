    html: <p>Since my original <a href="http://www.typophile.com/forums/messages/83/33179.html" target="_blank">Shins</a> post, I've found out that this typeface has been known many different names. Alphabets, Inc. called it Box Gothic, but it's also been known as Alwood Box Gothic, Jubilee Wood and Gothic Bold. I've seen the Alphabets version (with the cooler w) as Box Gothic and Jubilee Wood. I suspect the Solotype version may be licensed from Alphabets with a different name since Alphabets was mentioned in the copyright but maybe some miscreant simply renamed it.</p>
    html_clean: <p>Since my original <a href="http://www.typophile.com/forums/messages/83/33179.html" target="_blank" class="link-lost">Shins</a> post, I've found out that this typeface has been known many different names. Alphabets, Inc. called it Box Gothic, but it's also been known as Alwood Box Gothic, Jubilee Wood and Gothic Bold. I've seen the Alphabets version (with the cooler w) as Box Gothic and Jubilee Wood. I suspect the Solotype version may be licensed from Alphabets with a different name since Alphabets was mentioned in the copyright but maybe some miscreant simply renamed it.</p>
