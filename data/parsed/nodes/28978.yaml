    <p></p><div class="imageWrap"><img src="files/liber_librorum_4868.jpg"></div><p></p>
    <p>I’m interested in the typography of Genesis 1:1–2:4a, and would love it if someone would supply me with scans of the 42 offerings in the <em>Liber Librorum</em> package. Other exemplars are welcome as well.</p>
    <p>Years ago I did a set of typographical exercises with the passage as base, using Futura and layering, Stefan Themerson’s principle of Internal Vertical Justification, variations of font size, weight and colour to reflect levels of discourse and patterns of repetition / disruptions of strict repetition. Here’s an excerpt:</p>
    <p></p><div class="imageWrap"><img src="files/vast_array_5102.jpg"></div><p></p>
    <p>I dream of making a presentation out of this sometime, and direct access to the <em>Liber Librorum</em> items would help me out.</p><div class="imageWrap"><img src="files/"></div><p></p>
