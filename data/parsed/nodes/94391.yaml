    html: <p>I wrote to Iñigo back in 2008 with the same questions. He did explain the fonts were developed to exclusive use of Suite magazine and are not commercially available. Although he said the fonts may be available for sale in a near future, I think this will not happen (at least for now) as since then he developed more fonts for Suite and none became available. It's a pity as his designs are really impressive. Hope Suite staff know how lucky they are.</p>
