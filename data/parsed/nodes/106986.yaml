    date: 2013-11-14T02:48:00
    date_raw: 14 Nov 2013 — 2:48am
    votes: null
    html: <p>Adam, I found something that I consider a bug with Mavericks and Studio 5.1.4. I downloaded the latest drive of my bamboo tablet so that it can work for Mavericks. The Tablet works just fine like before on every Adobe products except in Studio 5.1.4. The screen shifts while you approach to the tablet on a glyph window. And I tried every single option on the tablet. Since this “artwork area shifting” problem occurs only in Studio but not in any other vector based softwares I feel like there is an incompatibility. If I can't fix this I'm going to revert to the previous operating system and get rid of mavericks.</p>
