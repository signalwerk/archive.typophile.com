    html: |-
      <p>We've done some internal testing, with positive results. Moreover, we rely on actual users' findings which are more valuable since they are based on real-world scenarios. </p>
      <p>So currently I can say: we believe FontLab Studio 5.1.4 is compatible with Mac OS X 10.9, and no users have so far reported any compatibility problems.</p>
      <p>Ps. As for 3rd party products such as Python macros, we also have received no complaints, but I recommend consulting with the vendor of the 3rd party product for a definitive answer.</p>
