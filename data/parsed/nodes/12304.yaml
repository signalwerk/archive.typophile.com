  html: |-
    <p>I was wondering if anybody has worked out a technique for search &amp; replace in FontLab that allows you to replace something without the replace causing an offset in the replaced object. I always seem to get a increase in height &amp; negative horizontal position relative to the source &amp; the target. Is Python the answer or is there a clever way of setting up the search to avoid this shift?</p>
    <p>Thanks!</p>
