    html: |-
      <p>Norbert, I think you basically have it. I think it is an extra dark version of Bembo that was issued by FontBank called <a href="http://www.buyfonts.com/value_for_money/bianca.htm" rel="nofollow">'Bianca'</a>.(They also had a similar one with a lower x-height called 'Benson'.)</p>
      <p><em>(Whenever there seems to be a very heavy weight of a text font, that's one of the first collections I look at.)</em></p>
      <p>- Mike Yanega</p>
