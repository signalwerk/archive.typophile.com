      <p>Confirming Fivos' suggestion of Compacta, any version but <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/compacta-lt" rel="nofollow">Linotype</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/compacta" rel="nofollow">Monotype</a>. I can't see the differences between your sample and for instance, Scangraphic <a class="freelinking external" href="http://www.myfonts.com/fonts/efscangraphic/compacta-sh" rel="nofollow">Compacta Sh</a>.<br>
