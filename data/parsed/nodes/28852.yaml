    html: |-
      <p>Thanks for all replies :)</p>
      <p>Since it is a free font that I threw together rather quickly I decided to give it for free as a marketing strategy. I practically want people to surf to my website, get to know that there is a new type studio "out there". To connect and make some contacts – and (as a reciever of the font said) – make the world a little happier place :)</p>
      <p>All kinds of embedding is allowed if it means that the user can embedd the font in a PDF or Flash-file. Embedding is btw something that I feel should be allowed in every font we buy, I think it should be 100% legit to send a PDF with the embedded fonts in it, so everybody could see what the designer did (if that‘s what you mean). Otherwise it’s pretty meaningless to buy a font (in a users perspective) :) But maybe I miss something here? Are there other ways of embedding fonts?</p>
      <p>I’m not really confident in what all this means, but modifications sounds in my ear that a user opens the font in Illustrator and maybe change a little of the curves to maybe do a logo. If that’s what embedding means, it is very much allowed. This is also something I feel should be legit to do with every font. I also work as a graphic designer and more than often when doing a logo I change small things to make it more unique. As long as you dont change the font itself and distribute it.<br>
      Practically i just wanted something that claims it’s not freeware but licenced by Autodidakt.</p>
      <p>Regarding how many users could use the software; If the font is personal for the person who got it, isnt it obvious that the font is only for the user that gets it? Or do we have to be very clear in these matters?<br>
      The only thing I really want to prevent is that some "scam-person" or company makes a copy and distribute it further, or sell to make money. That is the only thing that I would get upset if someone does. Do you think that’s clear enough in the EULA? </p>
      <p>I’m not very used with the "legal" terminology, and I also feel that if these kind of EULAs are to complicated, people just dont read them. I read the Village Eula and from a user point of view it was really great, I felt more sympathy for the font makers with an EULA like Village had. It was human in a nice way :)<br>
      I tried to make some kind of mix of that. Dont know if I succeded. Do you feel I should add something to the EULA?</p>
