      <p>Goran,</p>
      <p>I should add that I'm not a lawyer and I can only make recommendations based on my own experience as user of EULAs.</p>
      <p>To distribute your font as freeware is generous, and it could generate traffic to your site as well. But, a few more thoughts for you to consider:</p>
      <p>- You should create a section in your EULA for embedding and then define it. Something simple such as Embedding is allowed in portable document files (PDF) and shockwave files (SWF). </p>
      <p>- Modifications in EULAs mostly (always) means opening the font in a program such as FontLab, making changing and regenerating a new font. Adobe allows for modifications, but they do not allow for distribution of the files. It might be useful for you to read Adobe's EULA (it is long, be prepared to read it calmly).</p>
      <p>- You might consider a clause dis-allowing people sharing it for download anywhere. There are so many crappy free font sites out there your font will just get pulled along into the muck and you will also lose traffic to your site.</p>
      <p><a href="http://www.adobe.com/aboutadobe/antipiracy/ff_faq.html" rel="nofollow">Adobe's Frequently Asked Questions About Font Licensing.</a></p>
