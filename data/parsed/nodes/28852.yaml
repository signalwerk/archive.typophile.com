      <p>&gt;I wonder which is the best way to build an EULA from zero.</p>
      <p>I've been thinking about this. We have a tool here where you answer a series of questions and out pops a EULA. Unfortunately I have to go to the paralegals office to answer the questions (maybe they don't trust me or maybe it's a Washington State Bar rule?) also some of the questions don't relate well to fonts. </p>
      <p>But given the work that's already been done to encode the EULA (by FontLab et al) it should be possible to answer a set of questions and have a EULA pop out - sounds like a great project for MyFonts, FontLab or someone else to tackle.</p>
      <p>Of course the lawyers will hate this, but realistically they should spend their time going after the bad guys and not writing EULAs.</p>
