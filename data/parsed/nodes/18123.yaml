  html: |-
    <p>I am posting lettering I want to include in a prize promotion flyer I am designing for the summer reading club at my library. The theme for this year's club is Paws, Claws, Scales, and Tails. </p>
    <p>This is all play right now, so no flyer or tickets yet.</p>
    <p>I guess I want to know first if you can read it easily.<br>
    It's display size only, and won't be used as a logo.</p>
    <p>Are the primary colors distracting? First character too angled? </p>
    <p>Your feedback is appreciated.</p>
    <p>Andrew</p>
