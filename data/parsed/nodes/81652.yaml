  html: |-
    <p>My friend Bruce Bowers and I are just about wrapping up a font that we collaborated on called Mocha Script. It is a Sign Painters script that is based on the city and state lettering used on Truck doors but it looks good wherever a script is needed. This font has over 243 characters which includeds alternates, ligatures and end characters. Coming May 18th to Letterhead fonts.</p>
    <p><a href="http://www.letterheadfonts.com/" title="http://www.letterheadfonts.com/">http://www.letterheadfonts.com/</a></p>
    <p><a href="http://borgeslettering.com/" title="http://borgeslettering.com/">http://borgeslettering.com/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mocha-Script_3957.jpg"></div><p></p>
    <p>Thanks for looking.</p>
