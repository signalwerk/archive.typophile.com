    html: "<p>Joseph Pemberton said <br> <br>&gt;Typeright is doing something similar,  <br>&gt;but I don't know if they target educators.  <br>&gt;<a href=\"http://www.typeright.org\" target=\"_blank\">http://www.typeright.org</a> <br> <br> <br>Yes, thanks. We're a member of it. I appreciate your suggestion, nontheless. (<a href=\"http://www.typeright.org\" target=\"_blank\">www.typeright.org</a> does a wonderful job, by the way. A suggestion to readers here: check it out if you haven't previously.) <br> <br>What I meant was an organization such as AIGA, that design instructors would already belong to. And get to them through a house publication such as an existing organization newsletter. <br> <br>Nick, perhaps you could ask at the University, whether there's a publication for design instructors, or whether all there is for something like this are just general instructor/teacher magazines. <br> <br> <br>Mr Pemberton, I like your picture that you post here, by the way. It fascinates me every time I see it. <br> <br> <br>Sean Glenn said <br> <br>&gt;When I was in school, we had access  <br>&gt;to any typeface you could find  <br>&gt;a complete copy of... in a book. <br> <br> <br>Yes, I rather enjoyed those days. You can actually do a lot with a Pilot Razor Point pen, and sometimes, a Sharpie. <br> <br>As much as I love electronics, I pine for those days. Four or five hours with those thicker markers could really take its toll on one's nose, though. <br> <br>Thanks! <br> <br>Joe <br> <br></p>"
