  html: "<p>I was in a web design firm the other day, and the talk turned, naturally, to typefaces. I asked the web designer about typefaces and the prolific pirating of pretty much all typefaces, especially in design schools. He had an interesting and insightful comment about paying for typefaces, that \"it's against the spirit of typography\". It is probably quite indicative of a lot of people's attitudes towards type: to expect payment is nonsense because one creates type for the love of it.  <br> <br>it was quite crushing. when i asked my type tutor whether he paid for his typefaces he scowled and said \"don't get all purist on me. how am i supposed to teach if i don't have the fonts?\" <br> <br>It starts from the ground up. How do other type tutors instill a sense of ethics in their students?   </p>"
  html_clean: "<p>I was in a web design firm the other day, and the talk turned, naturally, to typefaces. I asked the web designer about typefaces and the prolific pirating of pretty much all typefaces, especially in design schools. He had an interesting and insightful comment about paying for typefaces, that \"it's against the spirit of typography\". It is probably quite indicative of a lot of people's attitudes towards type: to expect payment is nonsense because one creates type for the love of it.  <br> <br>it was quite crushing. when i asked my type tutor whether he paid for his typefaces he scowled and said \"don't get all purist on me. how am i supposed to teach if i don't have the fonts?\" <br> <br>It starts from the ground up. How do other type tutors instill a sense of ethics in their students?   </p>"
