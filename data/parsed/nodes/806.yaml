    html: <p>When I was in school, we had access to any typeface you could find a complete copy of... in a book. I comped a lot of headline type by hand. Even in the early 90s, it was assumed that the body type would be provided by the typesetter. You didn't key in your own type, if it was a headline you either drew it or ordered it. So, essentially, the fonts were free, you paid for someone's time, or you did it yourself.  <br> <br>When we all (us graphic designers) migrated to the computer, took the work away from the typesetter, we didn't ever think about why we would need to pay for fonts. Thus the corundrum about teaching an old dog new tricks.  <br> <br>I buy lots of fonts now, because I respect the work that goes into creation of type. It doesn't bother me to drop some cash to get something great like HTF Gotham or FF Scala Sans. <br> <br>Plus, it keeps me from having to comp type by hand.</p>
