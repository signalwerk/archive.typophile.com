    html: <p>What spirit of typography is this individual referring to?  <br> <br>I suppose it's a bit like insurance, folks think someone else is paying for it. Same for worker's compensation fraud. I lump all these criminals together and find no need to associate with them. <br> <br>As far as students pirating fonts, it seems that design schools should either supply legitamate fonts as part of the tuition, that instructors should require that the student supply a copy of their license to the legal department of the school for records, and that anyone using an illegal font receives an incomplete for the lesson.  <br> <br>I am mean. </p>
