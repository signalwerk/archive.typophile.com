    html: "<p>&gt;How do other type tutors instill a sense of ethics in their students? <br> <br>I teach a course at York University that's part of a BA program in graphic design. The course is \"design a typeface\". This shows students what goes into making a typeface/font. <br> <br>It also helps that I am a type designer: putting a face on the victim should make the crime less likely.  <br> <br>As well as myself, Val Fullard and Paul Sych are two other published type designers who teach this course.</p>"
