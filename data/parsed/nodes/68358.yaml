  - id: 401382
    user: 8008
    date: 2010-03-15T07:27:00
    date_raw: 15 Mar 2010 — 7:27am
    votes: null
    html: |-
      <p><em>I would consider eliminating the space between the words, or at the very least reducing it.</em></p>
      <p>I think Myriad is a little over-kerned. Plus with this mark, where you have tightened the characters still further, the space is now too wide (add to that the fact that Myriad is not kerned between y and space and probably needs to be) and you have got a gaping hole that need attention.</p>
      <p>I like the colours and the 'chubby' stars. Smile rather than frown? I'm not bothered. Wonder if the final star needs to not point straight down (upside down stars are a problem). Maybe have it at a jaunty angle (with the uppermost point in between twelve and one o'clock)? Or is the point that the point points in the direction of the flow of the woosh?</p>
      <p>Client will no doubt have a preference for whether they want a space or not. If they want a space, you can still afford to close it up a lot before the space finally disappears.</p>
      <p>Just because the client wants Myriad, there is a lot to be said for doing something to it to make sure it's not Myriad by the time you've finished with it. What is it that make this particular ten characters Lucky Store's and no-one else's? Do you chop all the ascenders (L,k,t) at the same angle or something else?</p>
