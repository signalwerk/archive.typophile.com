      <p>well it may need a bit more exploration to be honest.</p>
      <p>the colors and font choice immediately make me think of amazon. </p>
      <p>i assume you used stars because of the phrase "lucky stars" or the image of "shooting stars", however the arc created by the stars seems to be indicating a downward movement. this makes me feel a) that it's falling flat, and b) it almost looks like a frown (especially when compared to amazon's smile). also, you mentioned international markets. do you happen to know what shooting stars mean in other cultures? it may mean nothing so some might not get the reference, and it's even possible that it may have other (negative) meanings you didn't intend. don't know specifically, but just saying. </p>
      <p>just my 2 cents. </p>
      <p>good luck</p>
