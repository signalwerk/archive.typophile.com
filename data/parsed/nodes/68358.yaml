      <p>I think this is nice and well executed, but perhaps not super-unique/memorable. And maybe it's just me, but I still get way too much of an instant <em>amazon</em> feel.<br>
      I think it could still really benefit from more exploration in the type; the serif+sans idea for instance seems interesting. I don't know your client, but I might go the extra mile and just take the chance to present some alternatives with other fonts («just as a suggestion, to open up the field a bit»). Sometimes clients are very sure they want something a certain way, but it's also our job to show them if it could work better some other way. They can still decide against it, but then at least you've tried :-).</p>
