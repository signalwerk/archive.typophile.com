      <p>Of course you can specify H&amp;Js without using a style sheet. It's in the flyout menu on the far right of the paragraph/character toolbar at the top of the screen.</p>
      <p>You can also build custom kerning into a paragraph style by using GREP styles. (Yes, it's a little roundabout.) You build a character style with the kerning you want and use GREP to apply this style to a certain character (with or without the provision, only when followed by a certain character).</p>
