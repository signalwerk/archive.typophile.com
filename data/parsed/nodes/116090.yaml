    html: |-
      <blockquote><p>you can't specify H&amp;J parameters outside of a Paragraph Style Sheet</p></blockquote>
      <p>Not <em>entirely</em> true - all paragraph attributes can be applied "directly", i.e., as a local override, on any text. Look in the menu of the Paragraph panel. Changing settings through a "style sheet" (called "Paragraph Style" in ID's native lingo) is useful if you want to have the same settings throughout your document; but occasionally, you might want to override them.</p>
      <blockquote><p>the keybord shortcut for "thin space" doesn't involve using the space key at all</p></blockquote>
      <p>InDesign supports more spaces than there are hot key combo's. If you find you need one sort on a regular base, create a Keyboard Shortcut set of your own and select any combo you find useful.</p>
      <blockquote><p> etc.</p></blockquote>
      <p>InDesign ≠ Quark XPress. The sooner you let go of the idea that A is DTP software and B is also DTP software, "therefore" both options and usage (... and keyboard shortcuts!) should be the same, the better.</p>
      <blockquote><p>Quark also used to allow tweaking the kerning pair table for a specific font, a feature which I've always found very handy</p></blockquote>
      <p>Granted, this is one thing ID (natively) lacks. Note that Quark <em>did not allow</em> this natively either; it was an external, commercial Quark Xtension.</p>
