      <p>-ix or IX<br>
      -a 9 that looks like a droopy 3 without the bottom curve (the back part is indented)<br>
      -a 9 that is a basically an underlined zero<br>
      -in arabic, from which the conventional numbers came the nine's leg curves to the right.<br>
