    <p>I’m working on a mark that prominently features the number 9. We've reached a point in the project where we're demonstrating to the client that we have explored every possible option!</p>
    <p>Do you guys have any thoughts on the different types of '9' formations that exist? There appear to be three general structures: the 9 that looks like a lower case 'g,' the 9 with the straight-angled leg (like Futura), and, in some less conventional typefaces, the 9 that looks like a lower case 'q' with a vertical leg . Are there any alternate structures that I missed?</p>
    <p>Thanks,</p>
    <p>Sam</p>
