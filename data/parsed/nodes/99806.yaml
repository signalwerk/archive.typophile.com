    html: <p>Arctic appears in the Solotype catalog. Digitizations include the unattributed one cited above as well as those by  Fantazia, Sam Wang and Reasonable Solutions, and, under other names,  Marlo (A&amp;L/ComputerServices) and Garfield (Brendel). It was a Photolettering typeface named Rambler Brush Light.     Note that all of these "foundries" are known for questionable copies. But there doesn't seem to be any digitizations from more respectable sources.  - Herb</p>
