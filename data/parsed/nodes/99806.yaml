    <p>Hey, everyone.</p>
    <p>I cannot for the life of me find a particular font. Judging from the way it looks, I figured it would be easy to locate, but it appears I was wrong. I'm currently trying to update one of my father's album covers (he's a musician), and the only instance of the cover with the preferred font is very small. My goal was to remove the font from the higher resolution version I have and replace it with the new font, if I can find it. I've attached an image of what it looks like. Apologies for the low quality, but unfortunately it's the only two instances of the font I can provide. </p><div class="imageWrap"><img src="http://typophile.com/files/bvxk2knv copy_3706.jpg"></div><p></p>
    <p>Thanks, guys. Hope someone knows where I can find this thing and what it is!</p>
