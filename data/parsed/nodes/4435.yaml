    html: "<p>Comic books are an interesting case because legibility is always prime in the lettering: the different roles of inker, letterer, etc keep personality down to a comfortable minimum. Contrast comic book lettering with comic strip lettering and one thing is readily apparent: personality of the strip is very present in the lettering (until it is turned into a font, though this statement is very open to debate). Imagine Winsor McKay lettering in Comic Sans or the EC template... <br> <br>Plus, did you ever notice that American strips printed overseas oftentimes mimic the English handlettering? I seem to recall some Calvin &amp; Hobbes in French that were this way...</p>"
