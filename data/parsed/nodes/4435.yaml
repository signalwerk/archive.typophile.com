    html: <p>EC comics is an interesting case. Their horror comics were lettered using lettering templates, which is what gives them their distinctive look.  <br> <br>The Comics Code, which came down hard on EC, had an interesting effect on EC's <i>Mad</i>. They changed the format early on calling it a magazine instead of a comic book, thereby exempting themselves from the Comic Code. To make it look less like a comic book, all the word balloons were typeset (in News Gothic).</p>
