    html: <p>Comics were originally handlettered because it was cheaper. Now that look is just tradition. Some comics (EC for instance, making classic horror comics) didn't use this handlettering, though.  <br>I think a reason for sticking with the handwritten look is that the texts in comics mostly represent speech. Lettereres (if you can still call them that) also use different styles/balloons/colours and whatever for different characters. Look at Neil Gaiman's 'Sandman' for instance. (Embarrasing that I don't know the name of the letterer.) <br>A funny thing is that comics usually are lettered in all caps, except when representing small sounds like 'Oh' and 'Uck'. there are also two types of 'I' in comic book typography, one with serifs, only used for first person stuff like 'I'm going down to the pub to get legless' and one without serifs for everything else. </p>
