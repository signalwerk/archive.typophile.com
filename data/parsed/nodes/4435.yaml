  html: <p>I grew up in Thailand and spent more than half of my reading time on  <br>Thai &amp; Thai translated version of Japanese comics. <br>Now I've been in London for several months and have begun to <br>enjoy reading western comics very much. <br> <br>In western (DC, Marvel) handwriting-like all caps are so common. <br>I think this is an attempt to preserve the look &amp; feel of hand lettering. <br> <br>But in Japanese comics (Manga) they often use formal, serif-like typefaces. <br>I don't understand the reason behind this but when I see  <br>English translated version of manga with western comic style typefaces, <br>I can feel some contradiction there. <br> <br>Just wanna hear some opinions on this issue.</p>
  html_clean: <p>I grew up in Thailand and spent more than half of my reading time on  <br>Thai &amp; Thai translated version of Japanese comics. <br>Now I've been in London for several months and have begun to <br>enjoy reading western comics very much. <br> <br>In western (DC, Marvel) handwriting-like all caps are so common. <br>I think this is an attempt to preserve the look &amp; feel of hand lettering. <br> <br>But in Japanese comics (Manga) they often use formal, serif-like typefaces. <br>I don't understand the reason behind this but when I see  <br>English translated version of manga with western comic style typefaces, <br>I can feel some contradiction there. <br> <br>Just wanna hear some opinions on this issue.</p>
