  html: |-
    <p><a class="freelinking external" href="http://forums.lakersground.net/" rel="nofollow">LakersGround</a> is the premier online community for fans of the Los Angeles Lakers.  The current logo is getting long in the tooth so I've decided to whip up something new.</p>
    <p>Goals:<br>
    -Purple &amp; Gold as the primary color palette<br>
    -Work equally well on dark and light backgrounds<br>
    -A wide version (for the website header) and a stacked version for shirts, etc.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SEX2_4660.png"></div><p></p>
    <p>I like them all but only one of them can make the coveted website spot. Still I'd like to offer at least two as T-Shirt options (one of the versions with purple "Lakers" and one of the versions with gold "Lakers".)</p>
    <p>Any comments or critiques would be very appreciated. (Even from Celtics fans ;)</p>
