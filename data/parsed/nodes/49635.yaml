    html: <p>The two font choices are too similar to contrast but different enough to feel wonky next to each other. I would stay with one or choose a second that provides true contrast. Otherwise, I like the oblique, lining versions for their suggested movement and ability to fill the top of a web page layout. But the stacked versions perhaps will offer a bit more versatility. Go Raptors!</p>
