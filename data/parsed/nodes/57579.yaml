    <p><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000429">Matogrosso</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/matogtypoph_6157.jpg"></div><p></p>
    <p>A new rustic calligraphic script from Argentine calligraphy team Koziupa and Paul. Ideal to use on wine labels or organic food packaging, stationery and old maps. It also makes a great choice for designs relating to outdoor activities and rugged travel, where the concept of the wild is to be accentuated.</p>
    <p>Matogrosso’s OpenType programming combines several alternate lowercase characters to generate perfect fit and more natural textures.</p>
    <p>Visit <a href="http://www.sudtipos.com">Sudtipos</a>.</p>
