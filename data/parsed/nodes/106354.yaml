  html: |-
    <p>I'm in the final stages of a serif typeface where the light weights are practically monoline, and contrast is added as it gets bolder, creating a transition from an almost Egyptian style light slab to a Modern black. Do you know of any other typefaces that do this, and what classification would you give the typefamily?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/UrgeText_4224.png"></div><p></p>
