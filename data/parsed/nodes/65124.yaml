  html: |-
    <p>I recently upgraded my personal brand with Stratum 1 to compliment my <a href="http://i50.tinypic.com/1r5bg1.jpg" rel="nofollow">wordmark</a>, but I am not really happy with it at small sizes as a body copy typeface.</p>
    <p>If nothing comes to mind right away, another alternative I would be interested in pursuing is a typeface from FontFont that is a good match for my wordmark as well as works in both large and small sizes.</p>
    <p>Thank you.</p>
    <p>- corey</p>
