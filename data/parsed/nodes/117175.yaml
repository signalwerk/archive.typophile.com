      <p>That’s <a href="https://www.google.com/fonts/specimen/Belgrano" rel="nofollow">Belgrano</a> (available via Google Fonts).</p>
      <p>Here’s one handy thing to know: If you want to identify a webfont, you can select the text that uses it, right-click on your selection and then select ‘Inspect Element’ from the context menu (in Firefox and Chrome). The font name will be shown on the right-hand side in the panel at the bottom of the screen. You might want to click on the tab ‘Fonts’ in Firefox or ‘Computed’ in Chrome for a neater overview.</p>
