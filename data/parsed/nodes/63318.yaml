    html: |-
      <p>Hello everybody,</p>
      <p>yes, that's indeed Tramway. Very cool, my own stuff in the ID forum :-). </p>
      <p>Where is the sample from? So far, it's only been used for a handful of projects. The only people who use it on a regular basis are <a class="freelinking external" href="http://www.11freunde.de" rel="nofollow">11 Freunde magazine</a> and, for a couple of weeks now, the <a class="freelinking external" href="http://www.museum-joanneum.at" rel="nofollow">Universalmuseum Joanneum</a> in Graz.</p>
      <p>I'm currently working on the final version (I'm on it right now actually), which will just be called "Tram". It will have seven weights, possibly also corresponding italics, and yes, it WILL be released, as soon as possible ;-)</p>
      <p>I'll keep you updated...</p>
      <p>Cheers,<br>
      Hanno</p>
      <p>PS: Here's a preview (a couple of months old now, but all the new weights are in there, as well as an unfinished italic): </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tram2009_5465.jpg"></div><p></p>
