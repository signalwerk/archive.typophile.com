  - id: 389352
    user: 50776
    date: 2010-01-16T08:07:00
    date_raw: 16 Jan 2010 — 8:07am
    votes: null
    html: "<p>I like your progress and considering the fact that you're new to type, etc, its not bad. The point size overall can be scaled down I think. I'm never a fan of photoshop filters, however I think it works with the nostalgic feel. The ultralight type gets a bit distracting when placed next to the linear elements of that mic and when placed between the bolded faces. You're using all caps as- maybe as a resolution, experiment with creating that hierarchy with lower and all caps. Good that you got rid of the greyed back rules coming in from the side... But yes, I'd say, scale something back, there's too much competition right now between the three element: the display, the subtext and the imagery. Let them work together. Oh and alt+right and left keys for tracking and kerning.</p>"
    html_clean: "<p>I like your progress and considering the fact that you're new to type, etc, its not bad. The point size overall can be scaled down I think. I'm never a fan of photoshop filters, however I think it works with the nostalgic feel. The ultralight type gets a bit distracting when placed next to the linear elements of that mic and when placed between the bolded faces. You're using all caps as- maybe as a resolution, experiment with creating that hierarchy with lower and all caps. Good that you got rid of the greyed back rules coming in from the side... But yes, I'd say, scale something back, there's too much competition right now between the three element: the display, the subtext and the imagery. Let them work together. Oh and alt+right and left keys for tracking and kerning.</p>"
