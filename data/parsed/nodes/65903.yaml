    html: |-
      <p>I'm liking the improvements, but the text beside the microphone needs some contrast adjustments in my opinion. You can make lines of type stand out in two ways: make it bold or make it big. In this case, you've got bold type competing with bigger type, and the eye doesn't know which information to read first. I would personally make the "1st Sunday of every month" type the same size as the address, both to keep sizes consistent throughout the poster and also to let the bold "A free monthly..." stand out and attract the eye like it should. I would also spell out "First" instead of use the "1", but that could be just personal preference.</p>
      <p>Other than that, I like the alignment you've chosen for the text. It helps keep things looking simple and professional, and I think it's a great font choice for the headline, as long as that's the feel you want the poster to convey. (You're likely going to get more jazz musicians interested in this than rock musicians.)</p>
