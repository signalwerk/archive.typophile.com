      <p>Everywhere! <a href="http://flickr.com/photos/stewf/sets/72157594386592999/" rel="nofollow">Here are some of my pics.</a> </p>
      <p>Stop by <a href="http://www.fontshop.de/sukr.php3?ch=%2Ffontproductdetailc.php3%3Fns%3D1%26sns%3D0%26ns%3D1%26sns%3D0%26co%3D%26co2%3D%26id%3D6047147" rel="nofollow">FontShop Germany</a> for some free goodies.</p>
      <p>Do not miss the <a href="http://www.bauhaus.de/shop/index.htm" rel="nofollow">Bauhaus museum</a>. Small but important.</p>
      <p>Uncover some vintage printed stuff at a <a href="http://www.berlinfo.com/Lifetime/Shopping/flea_markets/index.htm" rel="nofollow">flea market</a>.</p>
