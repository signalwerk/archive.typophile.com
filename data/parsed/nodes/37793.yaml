      <p>I agree with Sii, it's not embedding it is linking. But this makes it even worse!<br>
      Web designers could then use ANY font they will find on ANY server. If they find a FF Meta on a Russian server they can use it in their website and no one can prevent this from happening. The List Apart article already shows how you can import external CSS files which may contain links to hundrets of fonts. I guess these files will become very popular.<br>
      And since the links are all in plain text in the code, everyone can easily download the fonts or someone could write a Firefox Plugin that will download all fonts linked in the CSS.</p>
      <p>I think the font industry should take action against this use of the font-face command. At least limit the use of the font-face links to the domain of the website. So you could still easily use any freeware fonts by uploading them to the webspace, but you could not link to commercial fonts on other servers.</p>
