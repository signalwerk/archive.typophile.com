    <p>According to a post from developers yesterday, Apple's Safari browser will now support "downloadable" fonts -- meaning that users can specify a font of choice on a web page and deliver it to someone viewing a web page.</p>
    <p>Not sure how this will change the font landscape, but you can read all the details here:</p>
    <p><a href="http://webkit.org/blog/124/downloadable-fonts/" title="http://webkit.org/blog/124/downloadable-fonts/">http://webkit.org/blog/124/downloadable-fonts/</a></p>
    <p>and here:</p>
    <p><a href="http://www.alistapart.com/articles/cssatten" title="http://www.alistapart.com/articles/cssatten">http://www.alistapart.com/articles/cssatten</a></p>
