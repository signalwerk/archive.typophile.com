      <p>No discussion enumerating free fonts is complete without at least a mention of the excellent work going on in the free software font community. There are a number of very high quality fonts available under such licensing terms, and they will be a welcome addition to the "core web fonts" that designers are forced to rely upon.</p>
      <p>I've long felt that these fonts are particularly important to increase international coverage. The Greek Font Society fonts are among the best available for Greek, and for many minority langauges, good fonts are simply not widely available at all.</p>
      <p>I'm very happy to work with Web designers to make my OFL licensed fonts work well in these kinds of settings. Clearly the license <em>allows</em> that kind of use, but it's always nicer when it's explicitly encouraged by the designer as well.</p>
      <p>Now if only this initiative reaches other popular browsers besides Safari.</p>
