      <p>sii: While some licenses may be murky, I believe the current version of the OFL makes it crystal clear that embedding is allowed and encouraged. From a <a href="http://www.linux.com/articles/60919" rel="nofollow">linux.com article</a> about the 1.1 revision:</p>
      <p><cite><br>
      The question of whether licenses permit embedding has come up frequently, and Spalinger and Gaultney wanted to make clear that the OFL permitted it. "This was always the case," Gaultney says, "but we made it clearer because there was some confusion." The prohibition against releasing OFL fonts under another license now adds the sentence, "The requirement for fonts to remain under this license does not apply to any document created using the fonts or their derivatives" in order to clarify the status of embedded fonts. In addition, version 1.1 specifies that embedding is not incompatible with selling the font.<br>
      </cite></p>
      <p>If there are real concerns, I of course want to see those addressed. But as far as whether license issues are a barrier to the use of OFL fonts in Web pages, I think the main barriers are demand and the political will of Microsoft to support the @font-face Web standard.</p>
    html_clean: |-
