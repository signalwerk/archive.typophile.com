      <p>ty for the referral ralf. i just registered last week and opened a blog question about the status of @font-face and was referred here ...</p>
      <p>i was excited to see it in the css spec a year or two ago to use on our intranet domain and reference our corporate typeface (eurostile) for certain h# tags and an occasional announcement. i published it on our internal development wiki only to find it was not receiving the support i had hoped.</p>
      <p>i agree with several above suggestions to restrict use to the site's domain server only; however, i see many difficulties in securing this type of use. perhaps if the feature only worked with relative uri addressing, i.e. the use of "http://" in the src reference would nullify the object. the license key idea above looks interesting, as well.</p>
      <p>and on the topic of license purchasing versus pirating, you would think most "professionals" would know better and support proper licensing; however, when i arrived at the company and discovered eurostile had been chosen as the corporate typeface and in our company logo, i asked corporate communications if they realized this was not a standard (installed with windows typeface). the response was something like, "yes, and your point is?". after i let them know it would require licenses for anyone developing web applications, not just print media, they were actually surprised?!?</p>
      <p>bottom line is they received an invoice for about three dozen licenses from veer the following month ... ;)</p>
      <p>Wynne Hunkler<br>
      Principal | <a href="http://www.wynnefields.com/" rel="nofollow">Wynnefields Creative</a><br>
      Web Design &amp; Visual Communications</p>
