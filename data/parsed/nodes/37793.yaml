      <p>While I certainly appreciate the concerns of the font industry, I certainly hope they don't go down the path of the RIAA screaming that the sky is falling and being totally oblivious to the reality of the situation.</p>
      <p>Who buys fonts these days? Does Mary purchase a font to design her garage sale signs? Does Bob in accounting purchase a font to format his quarterly reports to the CEO? Does Sarah who's in the 7th grade purchase an extensive font family to type up her book report?</p>
      <p>Or is it mainly graphics professionals?</p>
      <p>If it's the latter, I really don't see how (even though I'm not necessarily advocating it) embedded licenses would really hurt the 'real' sales numbers. One could argue that they'd perhaps go up as graphics professionals purchase more typefaces for web sites. Yes, the drawback is that Mary COULD--if she was skilled and cared enough--grab that font off of your web site for her garage sale posters. But is that REALLY a lost sale?</p>
      <p>(And to be clear, I'm not necessarily advocating a completely 'open' download license on every font for every web site...just tossing out some ideas for discussion...)</p>
