      <p>Raph, the OFL may allow embedding, but this isn't embedding in the way the term is commonly understood. Unlike the established forms of font embedding nothing here ties the font to the document - it's not embedded in the document, neither is a URL binding system used to lock the font to the document. </p>
      <p>That’s not to say the OFL might not allow other forms of distribution compatible with this scheme.</p>
      <p>&gt;main barriers are demand and the political will of Microsoft to support the @font-face Web standard.</p>
      <p>This seems rather disengenious - MS has supported @font-face for over ten years. No one else seemed interested until Hakon started his crusade.</p>
