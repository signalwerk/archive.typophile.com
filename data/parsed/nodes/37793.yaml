      <p>Here's a SWAHBI: Perhaps the fonts could be hosted on the foundry's website and served up on demand. Instead of downloading the whole font as a TTF or OTF file to everybody and anybody, something like a font tester could create the text on the fly and deliver only the specific characters as (for instance) an SVG graphic or something else that the browser could render but wouldn't be a font file. The foundry would be able to track who was using their fonts and charge them for it, or cut off access if the user didn't pay up. This would work for both static and dynamic pages.</p>
      <p>More broadly, I guess what I'm suggesting is middleware that font owners would use to convert the font to something a browser could interpret but isn't a TTF, OTF, or PS file, and couldn't be converted back to a usable font file -- the typographical equivalent of the trapdoor functions used in cryptography.</p>
      <p>Later edit: Of course this is useless for those fonts already loose on the web, but it might be better than doing nothing.</p>
