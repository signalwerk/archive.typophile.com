      <p>sii: I'm not trying to provoke a flamewar here - we talked about this issue extensively in person about a year and a half ago, and I think we share a real concern for quality and doing the Right Thing. And I certainly agree that this feature will be misused and we'll see lots of poor typography that wouldn't have otherwise been possible.</p>
      <p>But on the specific question of whether there is a legal issue with using downloadable OFL fonts as part of Web pages, I think you're raising fear, uncertainty and doubts where there is no cause. From the <a href="http://scripts.sil.org/OFL-FAQ_web" rel="nofollow">OFL FAQ</a>:</p>
      <p>Question: 1.2  Can I make web pages using these fonts?</p>
      <p>Answer: Yes! Go ahead! Using CSS (Cascading Style Sheets) is recommended.</p>
      <p>Simon, are you making the claim that there's language in the actual license which is at odds with the clearly expressed intent of the license's creators? That the drafting and review of the license was somehow sloppy? The fact that people have crafted, reviewed and revised the license specifically for the needs of font creators is the main reason I've chosen the OFL, as opposed to for example adapting an existing free software license.</p>
      <p>&gt;This seems rather disengenious - MS has supported @font-face for over ten years. No one else has seemed interested until Hakon started his crusade.</p>
      <p>You're right here, which is why I cited "demand" as the first barrier to adoption. And just because it's a Web standard doesn't mean that it's necessarily a good idea to support it. But now that WebKit is shipping it, Microsoft is arguably very much now on the critical path.</p>
