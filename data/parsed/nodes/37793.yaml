    html: |-
      <p>&gt;We’ll have this same discussion all over again if electronic paper ever goes mainstream.</p>
      <p>I don't think we will, as the medium here is so closely related to PDF and eBooks and font-makers made up their minds and adjusted their EULAs in response to the eBook hype of a few years back. </p>
      <p>In general most EULAs allow document embedding, the TrueType and OpenType specs have defined document embedding permissions for about 15+ years, and some vendors (Monotype I think led the trend) charge extra for document embedding rights if the document is being sold (like an eBook or eMagazine subscription). </p>
      <p>Back to the original point, linking a raw font to a web page is not embedding, it's redistribution - disallowed by font EULAs.</p>
