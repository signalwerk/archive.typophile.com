    html: |-
      <p>“Isn’t that already covered in the standard EULA?”</p>
      <p>Good laughs - The difference here is that most EULAs define "use" as allowing the user to install the font software on an allowed number of computers, with some provisions to allow or not allow for embedding. </p>
      <p>The traditional definition of "font embedding" covers the use of a font incorporated into an electronic document. So the font travels with the document.</p>
      <p>There are "DRM" provisions already available in TrueType and OpenType technologies. Yes, the famed embedding bits. Software developers today can look a the embedding bit to check the embedding permission and decide if its OK to use a particular font, or not.</p>
      <p>If Microsoft opens up EOT, and the W3C approves it as a standard, then that would be a very good thing. EOT provides many benefits as a mechanism for all of us to protect our font IP. </p>
      <p>Allowing raw fonts or zipped fonts to be linked/downloaded to web pages WITHOUT any kind of methodology of checking font embedding permissions, copyrights, etc. is a disaster waiting to happen for all of us the type design community. </p>
      <p>Call me Chicken Little if you must, but I believe this is a serious issue and as the thread above illustrates there is a lot of confusion, concern and misunderstanding.</p>
    html_clean: |-
