    html: |-
      <p>&gt;Is this different? </p>
      <p>Yes, the fonts are embedded <em>inside</em> the PDF and therefore follow the OpenType spec definition of document embedding, only get inside the PDF if the font vendor has set the embedding permissions to allow this, and in general font EULAs are in line with the embedding permissions in the font. Extracting a reusable font from a PDF requires hoops to be jumped through and malicious intent. </p>
      <p>Contrast this with the raw font support where a font is simply linked to a web site in exactly the same way as other assets are (eg. Images). No hoops to jump through, just click on the link and permanently save the linked fonts to your local machine.</p>
