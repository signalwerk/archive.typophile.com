      <p><em>Designers who buy fonts now aren’t doing it because the fonts are hard to pirate, they do it because they want to compensate the designers.</em></p>
      <p>I've no doubt that may be true, but I don't think it's main factor.<br>
      People have a moral compass with regards to theft, that gets set at an early age.<br>
      It's our education from parents, teachers and other authorities, of what is socially unacceptable.<br>
      Consequently shame, fear and guilt are more the inhibitors to piracy, rather than paying for your fonts being a positive act of goodwill. Pardon my cynicism of human nature, but in this case negative reinforcement plays a stronger role than positive.<br>
      In adults, there is a spectrum of inclination to cheat or steal.<br>
      In that situtation, it makes sense for a society to reduce the opportunity to steal, rather than make it easy, because making it easier has a corrupting effect on those who might consider an itsy-bitsy little cheat, that snowballs en masse, as what were once deemed vices become widespread habits, a form of consensus-building. As we've seen post-Napster.</p>
