    html: <p>Posting fonts in a form that allows open access and use and relies on the honor system for compensation isn't new. Some of you may remember it as "shareware". Maybe it would be unfair to call this model a fad, but it isn't very common any more especially with respect to fonts. But even then shareware fonts (and many freeware fonts) have to be redistributed with their 'readme' files, something missing in this technology, but possible if the fonts are .zipped.</p>
