      <p>Years ago we used Java applets for stuff like scrolling news articles on websites. You could download these applets for free from the developer, but to make them fully functional at your website you had to buy a license. You then got a license key which you would have to put as a parameter in you HTML source code. Of course, everyone could see this license key but since it was linked to the domain, no one could steal it.<br>
      The same system would work for fonts. We would just need a converter (like WEFT) to make these fonts, and the browser would have to check the license key.<br>
      <code><br>
      @font-face {<br>
        font-family: "MyFontName";<br>
        src: url(fonts/myfontname.eot) format("truetype");<br>
        license-key: "1234567890ABCDEFGHIJKLM";<br>
      }<br>
      </code></p>
      <p>For the font industry this could be a really good market, and as a web designer I would love the opportunity to license good fonts for my client's websites.</p>
