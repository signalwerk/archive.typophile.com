      <p>I doubt it. Independent font designers lack the resources to prosecute their patents and copyrights now, dramatically increasing the number of offenders seems unlikely to change that. But it would be easy to develop tools that would spider the web for fonts, check to see if the user had paid for them, and alert a law firm which could then demand payment on behalf of designer clients. In a roundabout way, this could actually allow designers to make a lot more money from pirates than they do now. It reminds me of a story I heard about a photographer who realized that he could make money by tracking down and threatening to sue design people for using his images than he could by just selling stock.</p>
