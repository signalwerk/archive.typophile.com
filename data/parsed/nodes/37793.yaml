      <p>"how much to charge a Web site for placing an unprotected font online accessible to everyone on the Internet?"</p>
      <p>Maybe someone should ask Ascender. They've had a <a class="freelinking external" href="http://www.ascendercorp.com/fontlicensing.html" rel="nofollow">server font</a> license available since June 2007. The license "allows the fonts to be installed onto a server for use with an application that is accessed by an unlimited number of users."</p>
      <p>While I agree that being able to openly link to fonts on public servers is a worry for type publishers, now's the time to accept that @font-face is something that designers really need to do - and have wanted to do for the last 9 years. Sticking heads in sand is not going to make it go away, so start talking to browser manufacturers - work out a solution that gives designers and their customers what they need, while still protecting the intellectual property of the font houses. And I don't mean DRM.</p>
