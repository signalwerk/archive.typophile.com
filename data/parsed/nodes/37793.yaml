      <p>Raph makes a good point regarding the fact that there are some reasonable quality fonts for non-Latin usage, and in fact that's where existing font embedding technologies (like EOT) are most commonly used today. However as noted even in the Open Source and freeware space, licenses need to be amended to allow fonts to be subsetted and redistributed without the readme attached. </p>
      <p>&gt;Simon, is there any chance of IE implementing @fontface Or is Microsoft likely to keep pushing its own font embedding technology?</p>
      <p>Those who were at ATypI this year or TypeCon last year may recall the discussions on this subject. MS is still looking at opening up EOT as a standard to the W3C (specs are complete but we're still going through the internal approval process). We think EOT (if supported broadly) will offer web designers access to at least some commercial fonts where EULAs allow web embedding.  As for IE ever supporting raw or zipped TTF’s – can’t rule that out. I think the policy is likely wait and see.</p>
