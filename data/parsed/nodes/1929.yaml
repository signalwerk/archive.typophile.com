    html: <p>Helvetica is actually Latin for Swiss, not Switzerland (which is Helvetia). The coin you have probably reads Confoederatio Helvetica, which translates as Swiss Confederation, the Latin version of the official name of the country, which is printed on the coins and banknotes of the local currency. <br> <br>FWIW, the typeface, which had been known as Neue Haas Grotesk during initial development at the Haas'sche Gie</p>
