    <p>Hi there,</p>
    <p>I'm wondering if this font wasn't based on a commercial previous design. The author gives it for free at his website:<br>
    <a href="http://www.ericolebedenco.com/yellowmag.htm" title="http://www.ericolebedenco.com/yellowmag.htm">http://www.ericolebedenco.com/yellowmag.htm</a></p>
    <p>Downloading the font and looking into, I can clearly see the Times figures there. Then, for this limited charset and lack of proper figures, I would think that this is a student/beginner/free font work. But a few pointers are leading me to think that this was based on someone else's work. For example, the right serif on F top is slightly bigger than on E - to compensate the bigger counter space - but hey, no dummy would know that...</p>
    <p>Can you think of anything that could be the source of this?</p>
    <p>Thks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture4_4128.png"></div><p></p>
