    html: <p> While Melior was the first thing that entered my mind when I saw Verona as well, both Fellow Designer and Stephen Coles have made some pretty serious allegations. It may not be necessary for a food critic to know how to cook, but it is still the burden of one making charges like these to supply some evidence of proof of the charges, and "they look similar" isn't enough to meet the charges. If so, the designer of Apple Garamond may have some explaining to do as well. <br> <br>Fellow designer makes the allegation that Miles started with Melior and altered it -- a very serious charge. Stephen charges that Verona and Melior "have some exact points and curves" in common. Are you sure, Stephen? Were to somehow able to compare the two, point by point? If so, please show the evidence as you make the charge, and we will be able to see for ourselves. Otherwise, it is a baseless, and purely circumstantial on appearance, allegation. <br> <br>As an established professional designer, Miles deserves at very least the presumption of innocence on this one until proof can be supplied otherwise. With (so far) groundless charges like this hurled at him immediately upon his participation in the Typophile forums, it's no wonder he hasn't commented. I wouldn't blame him if he never returned. <br> <br>I'm with BJ. I'm disappointed and embarrassed with this critique. <br> <br>David </p>
