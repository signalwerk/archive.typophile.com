    html: "<p> To coin a cliché: I feel like we need some closure here. This was one of the most interesting discussions I've seen at Typophile. On the one hand I feel vindicated by Miles' revelations about the direct link to Melior - although he is still short on the technical details of his work - but on the other hand I realize it's a  serious charge if you accuse a designer of wholesale \"borrowing\" of another designer's specific bezier curves and points and it shouldn't be made lightly.  <br> <br>I don't think, however that we should automatically get down on our hands and knees if and when a *name* designer happens to speak up here. The Typophile forums are not like a fan club where, if a celebrity makes an appearance then everyone lines up to get their autograph and basks in the glory of their brief attention; it's more like (I'd hope) a place of learning and interaction that experienced practitioners might frequent and be subject to interesting and sometimes difficult questions from the students. <br> <br>Back to Verona: From his words, Miles is clearly revisiting the design but it is not a revival but a reinterpretation. His integrity shows in the work itself (but we could do with a sample text setting at 12 point, don't you think) and in the fact that he came here to discuss the work. Unfortunately, I don't think the hard core font rip-off artists are likely to frequent Typophile, except perhaps for trolling, and so it's unlikely their \"work\" will be put under the Typophile microsope in the same fashion. </p>"
