  html: "<p><!---Attachment: verona.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Verona.swf<br><a href=\"http://www.typophile.com/forums/messages/29/verona.swf\"><b>verona.swf</b></a> (9 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br>Verona is a typeface in development for a corporate client. I'll soon be creating an italic for it, and am considering an upright script concept. Verona features square punctuation that is shared with a sans serif that I've also designed.  <br>I'm thinking of designing the italic/script so that it could be shared between Verona and the sans. <br>In respect of the use of Verona, I hope it to fulfill the same role that the Apple Garamond has done for Apple.  <br>I'm also thinking about adding more weights, but Apple's successfull use of one weight leads me to believe that as part of a corporate identity it would be stronger and more identifiable if there were only one.<!--!-/attachment-!--><!--!-attachment:--><p></p>"
  html_clean: "<p><!---Attachment: verona.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Verona.swf<br><a href=\"http://www.typophile.com/forums/messages/29/verona.swf\" class=\"link-lost\"><b>verona.swf</b></a> (9 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br>Verona is a typeface in development for a corporate client. I'll soon be creating an italic for it, and am considering an upright script concept. Verona features square punctuation that is shared with a sans serif that I've also designed.  <br>I'm thinking of designing the italic/script so that it could be shared between Verona and the sans. <br>In respect of the use of Verona, I hope it to fulfill the same role that the Apple Garamond has done for Apple.  <br>I'm also thinking about adding more weights, but Apple's successfull use of one weight leads me to believe that as part of a corporate identity it would be stronger and more identifiable if there were only one.<!--!-/attachment-!--><!--!-attachment:--><p></p>"
