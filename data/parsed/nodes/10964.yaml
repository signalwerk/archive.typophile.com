  - id: 69283
    user: 967
    date: 2002-03-04T13:15:00
    date_raw: 4 Mar 2002 — 1:15pm
    votes: null
    html: "<p> I must apologise to all contributors. <br>I'm only able to get to the web perhaps twice a week for the pleasure of surfing and forums like typophile. If I'd have been able to get back here sooner I'd have been able to stop a lot of people's time being wasted. I was under the impression that the sans/serif etc. forums were a discussion about the aesthetic merits typography, not the issues of originality. <br>I'll put a much clearer intro to my posting for Modena on in the sans forum soon. <br> <br>So here's the background: <br>Some years back I was asked to produce a logotype based on Melior. The job never went ahead and I decided to develop the few letters into a typeface. This was called Torino, and after finding that that name had been used for another typeface (a condensed serif, must have been at the back of my mind), I named it after another Italian city, Verona. In not nameing the typeface Melior____ or ___Melior I had obviously considered the design to some degree not Melior at this point, and that has been the discussion here. <br> <br>The design had been sitting on the hard drive for some years and I'd forgotten about it. When I was approached by the client for which Verona is now intended, I remembered the design, and to my eye it immediately fitted their requirements. Only minor though important changes were made to Torino in aligning some design features with the sans I was also developing for the same client.  <br> <br>In posting Verona here, a far greater number of helpful suggestions have been made than I'd hoped for, and I'm certainly respectful of the focus that it has brought to the source of the design, Melior has some truly wonderful features and I've long been a fan of the super-elipse. I also looked at Century, Renault, Monanti and Marconi whilst drawing Verona. <br> <br>Those are the details that come to mind at present, I bet there's something important that I've missed. <br> <br>I'm certainly don't feel worthy of the kind of defense my name has received above, I'm a type designer that works very much as part of a design team, and in that sense I'm not the kind of self sustaining artist that many of my heroes are; Tankard, Licko, Barnbrook, Blockland(both)to name but a few. The thing is, it's a huge and very confident step to say \"I'm a type designer, and I'll have my own studio and do my own thing, and I hope people will buy it.\" I did that in the early ninties, and the typeface's that came out were pretty abstract, not the sort of designs that I can make a living from. Having said that, those designs and designs of that ilk (Lee Schulz's work I'm in awe of) are my passion.  <br>In what seems great number of years I've been modifying existing designs for clients simply because very few of them have an understanding of the time it takes to do a new design, and throughout this I've either arranged the proper licence myself, or have had to pester brand managers in countries that have much 'softer' attitudes to licensing to get the proper licence. <br>Type design is a relatively anonymous art at the best of times, and anyone involved in the creation of new expressions through the letterform deserves credit, those contributors that have raised Melior here are doing exactly that.I doubt we'll ever get to the wonderful copyright/credit model that photographers seem to have maintained. </p>"
