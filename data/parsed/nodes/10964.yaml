    html: "<p> Stephen: <br> <br>I agree with the vast majority of your last post, and I think it puts the discussion in the proper context. I'm not sure this is a particularly creative design, nor do I think that it is necessarily particulalry ethical, especially considering that it does derive so much from a font while that font's designer/estate still holds a copyright, and to date we still haven't seen any attribution. <br> <br>But I also think that if the two fonts were laid transparently one on top of the other, the points and curves would not match precisely. (Check the bowl of the lc \"b\" and the structure of uc \"H\".) Technicality? Absolutely. *Should* it be legal to do? I'm not sure, but probably not, even for non-retail work, as I suspect that the original designer (Hermann Zapf) will see no compensation for this extremely close use of his work. But in taking this approach, as far as I can tell, Mr. Newlyn hasn't done anything different than was done in the design of Adobe Garamond or the design of a custom version of any existing font for a magazine, television network, or any business. <br> <br>I still stand by my criticism that the original critiques made allegations that were careless and unsubstantiated. As the discussion has worn on, those critiques have become more refined, and that has been my intent in making my posts. I think that can only help Mr. Newlyn's work as well. <br> <br>David </p>"
    html_clean: "<p> Stephen: <br> <br>I agree with the vast majority of your last post, and I think it puts the discussion in the proper context. I'm not sure this is a particularly creative design, nor do I think that it is necessarily particulalry ethical, especially considering that it does derive so much from a font while that font's designer/estate still holds a copyright, and to date we still haven't seen any attribution. <br> <br>But I also think that if the two fonts were laid transparently one on top of the other, the points and curves would not match precisely. (Check the bowl of the lc \"b\" and the structure of uc \"H\".) Technicality? Absolutely. *Should* it be legal to do? I'm not sure, but probably not, even for non-retail work, as I suspect that the original designer (Hermann Zapf) will see no compensation for this extremely close use of his work. But in taking this approach, as far as I can tell, Mr. Newlyn hasn't done anything different than was done in the design of Adobe Garamond or the design of a custom version of any existing font for a magazine, television network, or any business. <br> <br>I still stand by my criticism that the original critiques made allegations that were careless and unsubstantiated. As the discussion has worn on, those critiques have become more refined, and that has been my intent in making my posts. I think that can only help Mr. Newlyn's work as well. <br> <br>David </p>"
