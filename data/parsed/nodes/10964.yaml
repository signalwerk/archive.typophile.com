    html: "<p> Hey fellas. Interesting discussion brewing here. <br>I'm not sure that it's helpful to Mr. Newlyn, but <br>it's certainly intriguing enough to stimulate <br>some impassioned posts. <br> <br>To be clear, in my first post I said that the <br>design \"does seem to share some exact points  <br>and curves with Melior.\" I stand by this  <br>judgment. I thank marcox for making the effort  <br>to show a direct comparison, because, for me,  <br>it adds credibility to my theory. <br> <br>I certainly feel that everyone who posts work <br>here should be respected, regardless of their <br>reputation or experience. I believe I wouldn't  <br>do Mr. Newlyn justice if I wasn't honest about  <br>how I see his work. By posting Verona here  <br>he's asking for feedback. I expressed my first <br>impression and concerns. <br> <br>That said, I think it's a successful design. It <br>would do any organization good. It's unique  <br>and useable. If incorporated well I'm sure it  <br>could lend to brand recognition and esteem.  <br>The notion that it's derivative of Melior (in some  <br>way) might not be a problem. If points were  <br>copied there may be legal issues, but we need  <br>to remember that this font isn't for retail sale.  <br>Surely it wouldn't be the first time a company  <br>customized an existing digital typeface for its  <br>own use. <br> <br>Stephen <br> <br>Some questions: When does a \"revival\" become  <br>ethically unsound? How different must it be?  <br>Can we only reissue a design that wasn't  <br>available digitally? Can we only revive type of a  <br>certain age? How old must it be? 500 years? 100?  <br>50? I'm sure these questions have been asked  <br>and answered before. Anyone know of a good  <br>reference? </p>"
