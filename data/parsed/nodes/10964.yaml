    date: 2002-03-01T13:14:00
    date_raw: 1 Mar 2002 — 1:14pm
    votes: null
    html: "<p> Miles, very nice - although you should know that I have a weakness for narrow, rigid designs. <br> <br>It's hard to make significant suggestions to something of such high professional finish (noting for example the slight taper in the lc \"v\"'s thin arm), so I'll go into \"super-picky\" mode - which does however mean that my suggestions might hold [even] less water than usual. <br> <br>The lc Letterforms: <br>I like the strong square terminals. And the vertical proportions seem to be well matched to the narrowness. Maybe the descenders could be a bit shorter. The half-serifs seem to be completely flat, as opposed to the full-serifs, which have a slight concavity. Maybe go flat for all. Also, I think either the \"a\" and \"u\" foot serifs should be flat, or the \"d\"'s should turn up instead. The \"a\" is very classy. The \"e\" might benefit from a stronger top-right curve, and the strong terminal seems to be closing things up too much. The \"g\" is one of the best bicameral forms that I've ever seen - very elegant - maybe a bit too humanist here? The ear could be stronger. The dots on the \"i\" and \"j\" (and maybe even the period) are really too sharp, but I don't know what would work here - maybe rounding the corners a bit. I like strong tails, so the \"j\" is somewhat of a turn-off (although it contrasts nicely with the \"y\"). The \"k\" doesn't seem to fit just right: it's too busy at the base (you might consider giving it the staggered arm structure that the UC has), and the upper arm's flare on the left seems too humanist here. On the other hand, the \"k\" you have is a very classy form, which does go with the overall feeling - so if you keep it as is, you might want to make the UC \"K\" have similar armature (not that I think that type of consistency is critical). The \"m\" might not need to be so narrow. The \"r\" might benefit from a stronger beak, and maybe a longer righthand foot serif to go along. The \"s\" is amazing - like a beautiful boa. The \"t\" initially bothered me, but now I like it a lot. I think the \"x\"'s lower-left arm being pulled in like that is unbalancing it. The \"y\" is superb - my attempt at a \"y\" of that structure for Patria was a fiasco. The \"z\" is class. <br> <br>The UC letterforms: <br>Very solid, without being brutal. The \"B\" -always a challenge- is masterful. The \"G\" might benefit from a double-serif. The \"J\" was bothering me, but now it's fine. The \"M\" has a problem with being too frail and open. You probably want to control its width in this design, but I really think the middle part has to go lower. The \"P\" is classy, but a bit recessive. The \"Q\" -which I should probably reserve judgment on until I see it in text- is a sharp attempt (noting the modulation of the body at the bottom-right), and I guess you want to keep it above the baseline, but I'm not sure you can get away without bringing part of the tail inside. The \"R\" is killer. The \"S\" seems to be leaning rightward. The \"T\" is nice and narrow, but the \"V\" maybe too narrow. The \"W\" has a milder version of the \"M\"'s problem, and it also seems to be skewed left on the inside. <br> <br>The numerals really work, man. The \"5\" is amazing. Just the \"4\" is a bit too shy for me. The \"fl\" seems a bit tight, and I worry about its strong corner (top-right). The BP seems to be leaning rightward. The \"@\" is surprisingly nice. Have you thought of making the asterisk upside-down (to draw more attention)? <br> <br>The spacing is probably not finished, but it seems a hair to loose to me (especially in the rounds). And the blank space character relatively too narrow. Nice quote, btw. <br> <br>I think the single italics idea is really great, but I have to see a working upright one before I'm convinced of that aspect of it. The closest (viable) thing I've seen is Majoor's Seria, and assuming it actually works in context, it still has a slant (which actually varies, between about 1-2 degrees). A couple of *nearly* upright italics (~4 degrees) that do work are Gill's Joanna and Unger's Flora. G Noordzij might have made something, but I'd be surprised if it's non-calligraphic enough to work for text. <br> <br>Your point about the one weight is interesting. I think it might have great validity for large settings, but for subheads and such it might backfire. One place where multiple weights definitely help is when you're mixing different sizes together but want to maintain color (like in simulating smallcaps). <br> <br>Overall, great stuff - no surprise. I hope the client deserves the high craftsmanship. <br> <br>hhp </p>"
