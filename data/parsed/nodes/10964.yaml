    html: <p> Of course we're looking at the same font. When I said that it looks different enough to me, I meant that it looks different enough to disprove the accusations of lifted points and curves. I do agree, however, that it is too close to Melior to not give some attribution to it and Hermann Zapf. <br> <br>&gt; But I think he should make the Melior connection clear and perhaps he just omitted to say that when posting. Established designer or not, this work is undoubtedly based on Melior and it does Hermann Zapf a discredit not to acknowledge Verona's origin.  <br> <br>I agree with that statement completely, and as I said before, it is completely clear to me as well that Verona is derived from Melior, just as Mrs Eaves is derived from Baskerville and Adobe Garamond (as well as ITC Garamond, et al) is derived from several of Jannon's and Garamond's Romans. <br> <br> But I think you have illustrated with your first paragraph that the allegations of points and curves being lifted just aren't true. Were they *derived* from Melior? Looks to me as though they were, but as you seem to agree in your statement below, the points and curves are not identical. <br> <br>&gt; And while the curves in the letterforms are not *exactly* the same as the squeezed original, there is no mistaking the DIRECT correlation. <br> <br> The charges made by the anonymous Fellow Designer and also by Stephen Coles of direct lifting of the font itself (changing only a few characters and condensing the rest), or lifting the points and curves, however, are serious ones, as they would indeed constitute plagiarism. I think those charges were made recklessly, especially as they seem to have been shown to be less than accurate. <br> <br>David </p>
