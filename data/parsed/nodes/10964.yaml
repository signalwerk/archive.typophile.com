    html: "<p> So I guess Verona and Miles are pretty much in the clear. The only thing some people might ask is: Should Zapf have been asked for permission (even though Melior is paid for)? To me the answer is a clear \"no\": that sort of thing can hurt type design more than it can help. <br> <br>BTW, I'm a huge fan of Schulz too: I think his work is a tantalizing glimpse into the future. <br> <br>BTBTW, if the italics will be shared, it might be nice to have a name for it. What about \"Rimini\"? It's a small Adriatic city with a unique sensuality about it. <br> <br>&gt; the food critic example is not a good choice. <br> <br>Well, maybe no analogy can be prefect. I just have a weakness for culinary ones!  :-) <br> <br>Let me rephrase it: A food critic doesn't need to be a master chef. But you know, even that's flawed: haute cuisine is like display typography - it doesn't cover sustenence: the world of text. So maybe I should say: A dietician (somebody who helps his cliencts to balance taste and nutrition) doesn't need to be a farmer. ? <br> <br>&gt; we haven't disabled anonymous posting. <br> <br>As I've said before, I think anonymity does bring a unique flavor to the table. On the other hand, I also think it should be a privilege, not a right - as in something that can be taken away if abused (even though no preventive measure can be fool-proof). <br> <br>hhp </p>"
