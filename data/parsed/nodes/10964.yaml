    html: <p> I looked at some thumbnails on myfonts, but you're missing the point. <br> <br>Miles Newlyn does not have anything to prove! <br> <br>To you, to me, or to anyone. <br> <br>He's been there, done that. To paraphrase Jack Nicholson, "extend some f---ing courtesy."* <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>(parenthetical here to say, I'm trying to say this nicely) Miles Newlyn comes in for the first time and you are welcoming him to prove you wrong? <br> <br>I don't know what to say anymore... <br> <br>But while we disagree, please don't take this personal. That's not what it's about. Same thing with Mart, whom I met in person (along with Hrant) last week in LA. (Yes, a secret meeting of the So-Cal Typophiles.**) <br> <br>I just feel strongly that to suggest plaigarism or point theft, especially to someone of MN's caliber is harmful and completely inappropriate. Also, there's something called a Chilling Effect. If every time someone posts something, their post is followed with "This looks like the work of SOMEBODY ELSE" or "is this ORIGINAL" it makes people reluctant to post something, thus a Chilling Effect.  <br> <br>It's fine to point out faces that are similar, but going beyond that takes Typophile in an unfortunate direction. <br> <br>just my opinion. <br> <br> <br>bj <br> <br> <br>* yes, another JN reference. <br>** not secret anymore. </p>
