    html: <p> I'm disappointed to see how this critique has gone. People are way too quick to judge the work of others as being 'similar'.  <br> <br>Okay, it's fine to say, "This reminds me of Melior," but you cross the line by suggesting that Miles Newlyn took Melior and squeezed it or stole some points. Do you all actually believe that? This is cynicism eroding logic, it's jealousy preying on your common sense. If you people want to play detective and take a bite out of crime, Typophile is not the place. <br> <br>Surely, criticize what you don't like, point out similar faces, but we should NEVER make assumptions as to how a face was created. <br> <br>That's one of the worst things you can do in a forum like this. <br> <br>C'mon now people. Miles deserves some apologies. <br> <br>bj <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":("> </p>
