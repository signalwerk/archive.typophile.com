    html: <p> Hrant obviously spent lots of time studying the work before he makes comments. He is critical, as he should be and clear in his explanations and suggestions. This is exactly the point of this forum.  <br> <br>I contacted Miles Newlyn directly to get his work up on typophile a few weeks ago. He is one of my own favorite designers in the field.  <br>For anyone not familiar with the work of Miles Newlyn, he has 2 typefaces distributed through Emigre, which is as far as I know the hardest distributor to get work accepted by in the industry, their fonts are all completely original designs, innovative, contemporary and of the highest standards, so I would say it is safe to say that Verona is completely original. I think it is important to consider the end user. It is a corporate client and I think there is a good chance they used to use something similar to Melior and just wanted something similar. Well that would make the challenge to design exactly that, a type face that is something similar and  original at the same time. I doubt they would be satisfied with spending $1000's of dollars for a couple of tweaks here and there.    <br> <br>I think it is valid to ask if a design is original or if it is a modified existing design.  <br>I am still working on Unicratica (which I posted last month) there are signature elements from other sans faces in it but this is intentional, as the design as a whole is supposed to be a hybrid of my favorite sans faces, drawn from scratch.   <br> <br>I would suggest that when a designer places a post it is stated when the design is a revival or a modification as to avoid the speculation of plagarism. </p>
