    html: "<p> Not that Fellow Designer (FD) doesn't allude to an interesting -and vexing- point about type design in general, but I personally have to suspect some hidden motivation here. <br> <br>Dear FD, I would ask that you please: <br>1. Read the passage in Alexander Lawson's \"Anatomy of a Typeface\" where he points out that Optima -arguably Zapf's most notable contribution to type design- is similar to a design of Dwiggins from three decades prior (noting that Lawson enjoys the credibility advantages of not being anonymous). <br>2. Tell us what you think of Excoffon. <br>3. Post some of your own work-in-progress. <br> <br>hhp </p>"
    html_clean: "<p> Not that Fellow Designer (FD) doesn't allude to an interesting -and vexing- point about type design in general, but I personally have to suspect some hidden motivation here. <br> <br>Dear FD, I would ask that you please: <br>1. Read the passage in Alexander Lawson's \"Anatomy of a Typeface\" where he points out that Optima -arguably Zapf's most notable contribution to type design- is similar to a design of Dwiggins from three decades prior (noting that Lawson enjoys the credibility advantages of not being anonymous). <br>2. Tell us what you think of Excoffon. <br>3. Post some of your own work-in-progress. <br> <br>hhp </p>"
  - id: 69266
    user: 617
    date: 2002-03-02T10:36:00
    date_raw: 2 Mar 2002 — 10:36am
    votes: null
    html: "<p> In Fellow Designer's defense: Melior was the first thing I thought of as soon as I saw this design. It really is too close. I don't normally like to chime in with negative criticism here, but seeing as FD has started I thought I should speak up. If you look at the \"weak\" letters - meaning the ones that attract the eye for the wrong reasons - like the M, W and Q, it looks to me like the designer has chosen to alter the Melior originals but made amateurish design choices. The lc is more consistent, but when you look at the similarities to Melior, particularly at the tell-tale junction of the thick and thin strokes of the y, and of the myriad similarities in the curves and bowl/counter shapes of the g then what else can you conclude?  <br> <br>Melior is a widely used font, but I don't think it is so widely used as to result in it's letter shapes melting into the general unconsciousness of designers by osmosis in the way that a font like, say, Microgramma/Eurostyle has done. You can almost forgive people for perpetually coming out with \"new\" designs which look like that. <br> <br>Paying tribute to an earlier designer is one thing - and if you're going to, then surely you have to acknowledge it - but this seems to me like a blatant squeeze of Melior with insufficient alteration to differentiate it to be able to, in good conscience, call it something original. </p>"
    html_clean: "<p> In Fellow Designer's defense: Melior was the first thing I thought of as soon as I saw this design. It really is too close. I don't normally like to chime in with negative criticism here, but seeing as FD has started I thought I should speak up. If you look at the \"weak\" letters - meaning the ones that attract the eye for the wrong reasons - like the M, W and Q, it looks to me like the designer has chosen to alter the Melior originals but made amateurish design choices. The lc is more consistent, but when you look at the similarities to Melior, particularly at the tell-tale junction of the thick and thin strokes of the y, and of the myriad similarities in the curves and bowl/counter shapes of the g then what else can you conclude?  <br> <br>Melior is a widely used font, but I don't think it is so widely used as to result in it's letter shapes melting into the general unconsciousness of designers by osmosis in the way that a font like, say, Microgramma/Eurostyle has done. You can almost forgive people for perpetually coming out with \"new\" designs which look like that. <br> <br>Paying tribute to an earlier designer is one thing - and if you're going to, then surely you have to acknowledge it - but this seems to me like a blatant squeeze of Melior with insufficient alteration to differentiate it to be able to, in good conscience, call it something original. </p>"
