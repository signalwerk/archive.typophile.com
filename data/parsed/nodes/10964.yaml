    html: "<p> Are we looking at the same font here? \"It looks different enough to me...\" To me it's as clear as day. If he didn't use the actual digital points and beziers, then what he's done is squeezed Melior digitally then perhaps traced by hand over printouts of the shapes and redigitized, altering the x-height and making the cosmetic changes that we can all see. The subtleties in Melior's terminals and serifs have been replaced wholesale with a straight-edged and smoother-curved aesthetic, which though artfully done, it has to be said that this is far easier to do than designing new and different curved terminals. And while the curves in the letterforms are not *exactly* the same as the squeezed original, there is no mistaking the DIRECT correlation. The g for instance is uncannily similar: Don't tell me it isn't!  <br> <br>On the question of calling it plagiarism, I for one don't see much wrong in what he has done, save for my observations above that I thought the M W and Q are misfits. Certainly Melior is not one of Zapf's best pieces of work and is worth a revisit. But I think he should make the Melior connection clear and perhaps he just omitted to say that when posting. Established designer or not, this work is undoubtedly based on Melior and it does Hermann Zapf a discredit not to acknowledge Verona's origin. </p>"
