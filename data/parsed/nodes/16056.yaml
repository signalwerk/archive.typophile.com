    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Frederic Warde</strong></p>
    <p>Frederic Warde (1894-1939) is best-known for two things: being the husband of <a href="/wiki/Beatrice%20Warde" class="freelinking" rel="nofollow">Beatrice Warde</a>, and designing the italic typeface <a href="/wiki/Arrighi" class="freelinking" rel="nofollow">Arrighi</a>, which was later adapted to be the italic counterpart of <a href="/wiki/Bruce%20Rogers" class="freelinking" rel="nofollow">Bruce Rogers</a>' <a href="/wiki/Centaur" class="freelinking" rel="nofollow">Centaur</a> for <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a>.</p>
