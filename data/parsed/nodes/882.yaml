    html: <p>I have a habit of collecting type specimen PDFs. <br> <br><a href="http://www.fontbureau.com">FontBureau </a>have PDFs specimens for all their fonts. <br> <br>James Montalbano's <a href="http://www.teminaldesign.com">Terminal Design</a> too. <br> <br>And the <a href="http://www.dutchtypelibrary.nl">Dutch Type Library</a>. <br> <br><a href="http://www.underware.nl">Underware</a> <br> <br><a href="http://www.stormtype.com">Storm Type Foundry</a> has some really good PDFs, but they are offline right now. <br> <br>There are lots around. I'll make a directory.</p>
