    <p>I'm stuck with Walkway for a brand and I'm not all that keen on it. It's used in the logotype, and is suggested for headers, but I was wondering if there was a similar typeface out there that it may have been based on, that I can substitute in?</p>
    <p><a href="http://www.fontsquirrel.com/fonts/walkway">http://www.fontsquirrel.com/fonts/walkway</a></p>
