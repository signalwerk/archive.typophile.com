    html: |-
      <p><cite>Why doesn’t Cycles have bold and bold italic? What are you thinking, Mr. Stone?</cite></p>
      <p>Well, I’m sure Sumner Stone didn’t just forget about them. ;-)</p>
      <p><cite>For 2600 years of making and re-making, the breeding of the Roman letter has been under way …</cite> [from the introduction to the <a href="http://www.stonetypefoundry.com/Resources/CyclesSpecimenBook.pdf" rel="nofollow">Cycles Specimen Book</a>]</p>
      <p>Though this passage actually is on optical sizes, I think it shows that Cycles is meant to be a book face in a <em>very very</em> classic sense. The idea of having bold weights (for serif text faces), in contrast, is quite young; in traditional book design there is/was no need for having a bold, let alone a bold italic.</p>
      <p>I can understand that you miss those weights and find it <cite>utterly useless</cite> for <cite>commercial work</cite>. But then, maybe Cycles never was made for loud advertising? And there are myriads of comparable faces that offer that ‘modern’ R-I-B-BI-variety. You always require boldface? Go with those alteratives! I, for one, appreciate the idea of making a nice text family with 7 (!) optical sizes, all featuring italics, small-caps, lining and os figures … And I’d prefer it over just another ‘nuclear members’-quadrumvirate – with one or two members of such a ‘value pack’ gathering dust untapped.</p>
      <p>Further reading: <a href="http://typophile.com/node/31036" rel="nofollow">Where do bold typefaces come from?</a><br>
      There are also some interesting quotes in this thread, <a href="http://www.typophile.com/node/8029" rel="nofollow">Why doesn’t Swift have a Bold Italic?</a>:</p>
      <p><cite>Some designers don't make a Bold-Italic as a form of functional romanticism, or you could call it capricious (or rebellious) anachronism.</cite> — Hrant H. Papazian</p>
      <p><cite>Bold is type on junk food.</cite> — Giampa the Great</p>
      <p><cite>As a type designer it's hell to make the bold italic weight.</cite> — Stefan Hattenbach</p>
