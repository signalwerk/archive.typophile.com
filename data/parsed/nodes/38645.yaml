    html: |-
      <p><cite>...that’s why it’s so unjustified...adding a bold and bold italic does nothing to detract from the classical beauty of the face...</cite></p>
      <p>Actually, no, I think at times it does indeed "detract from the classical beauty of the face". By way of illustration, have a look at Alex Kazcun's 1991 expansion of Rudolf Růžička's <a href="http://www.linotype.com/420/fairfield-family.html" target="new" rel="nofollow">Fairfield</a>, which in part "delicately tilt[ed] it from a pre- to a postmodern design", as noted by Bringhurst in his <cite>Elements</cite> (3.0, p. 227). </p>
      <p>I have tried using Kazcun's Fairfield, but it's just not the same typeface. I suspect Cycles might also lose as much as it would gain were it to be expanded similarly.</p>
      <p>Cycles is my favorite face for setting books. I've never missed the bold or bold italic styles, no more than I regret the same "deficiency" in other classic faces such as HF&amp;J's Requiem or the Carter &amp; Cone version of Galliard. As others have stated, the optical sizes, italics, small caps and various formatting options afford more than enough opportunity for emphasis and contrast.</p>
      <p>By the way, <a href="http://www.stonetypefoundry.com/sfploverview.html" target="new" rel="nofollow">SFPL</a>, the four-style version of Cycles that Sumner Stone created for the San Francisco Public Library, does indeed contain a beautiful bold style, but still no bold italic.</p>
