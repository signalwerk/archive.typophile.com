    html: <p>A quite untenable and out-of-date distinction...commercial work can be just as elegant as fine book design...I know; I do both. Mr. Stone did a bang-up job with the two bold weights and bold italics for Stone Serif...in fact, those bold italics look better than the bold romans. Truncating the offering like this just means he won't get the market penetration Cycles really deserves...that's why it's so unjustified...adding a bold and bold italic does nothing to detract from the classical beauty of the roman text face; it just gives the customer options he is entitled to have for the fancy price charged. Ditto for Requiem, which would be used all over the place by now if the foundry had enough sense to complete the family. Josh Darden's re-think of Fournier, Corundum, comes with three weights and full italics and he shows no hesitation at applying his VERY classic face to these helpful additional options. It's just good business. Nobody wants to live in a world without boldface any more than they want to live in a world without air conditioning!</p>
