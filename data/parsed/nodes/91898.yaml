      <p>James, I find that fascinating. Did you zoom in on a corner? And yes I always save my work as .psd files. I've been doing that since back-in-the-day starting with Ps 7. I then burn them to disks. Do you? It's great looking back at some of the old .psd files, my stacks and stacks of layers - lol!! I used to be so afraid of deleting any layer just in case I needed it to retrace a thought process ... :)</p>
      <p>hrant, I'm a second gen tortured soul of that I'm sure. Raised up in my father's studio I learnt early on that being driven by the Idea is a 'tao' all in itself. </p>
      <p>There doesn't seem to be an off switch. </p>
      <p>And if I can, I'll take on several ideas at a time. What a contrast that must be to a type designer who can focus and focus for hours and days on end upon one goal / idea.</p>
      <p>For instance, today I got a little pissed off with all the yuppies lounging with their latest ipads over at star bucks. So, I got this idea to rebel in my own way - lol. I searched all around town and finally found a vintage portable typewriter - in great condition too - Royal Companion circa 1960. Went over to staples picked up a pad of paper and some white out - and then headed back over to star bucks . Bought a high octane coffee and sat down right in the middle of no less than five ipad yuppies, plunked down my most awesome Royal Companion, open up the case, fed in some paper and started typing. I had the coffee in one hand and banging on these really difficult keys with the other - only stopping to either get out the white out, or to feed in another sheet of paper.</p>
      <p>:)</p>
      <p>After a very short while I had everyone's attention including the manager who couldn't stop laughing! Unfortunately though, it only provoked the ipads to search online - vintage stuff and steam punked stuff and begin a communal discussion.  Which as I look back now might have been the Idea's goal after all. I finished my coffee, packed up my most awesome companion and left somewhat contented...</p>
      <p>I think that is my only - good place - the brief moment(s) after an idea has been successfully brought to live in the light of day.</p>
      <p>n.</p>
