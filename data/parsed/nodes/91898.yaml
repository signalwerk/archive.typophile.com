      <p>Neil, thanks for the additional info. </p>
      <p>I followed your procedure exactly (I'm using Photoshop CS 5) and still got no perceivable artifacts. I wonder if maybe your original background wasn't pure white. </p>
      <p>I know this doesn't change your original point, but I'm just wondering if maybe something in your technique is causing artifacts to be more a problem than they should be. </p>
      <p>In your everyday work, you're saving your working files as native Photoshop files .psd files aren't you? (Unlike your test procedure, in which you "saved for web" twice to increase degradation; in effect making a Xerox of a Xerox). </p>
      <p>Normally you should never save a file in the JPG or GIF formats (which are lossy) until the very final step, and the working file should remain .psd, so if you need to make further changes you can do it to the .psd file so you'll be working with a pristine image.</p>
