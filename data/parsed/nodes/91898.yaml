    <p>Artifacts ... that's what in graphic design is know as those wondering almost rebel pixels of information that somehow manage to stray from the norm in a raster (a.k.a. bitmap) format.</p>
    <p>But make no mistake, Artifacts, no matter how much 'freedom' they think they represent/enjoy are still a product of being mathematically generated and are fostered via synthetic means. Still though, they are not quite as, or allow me to say 'obediently consistent', as are all the other family raster members that go on in a more orderly fashion to create a harmonious bitmap composition.</p>
    <p>Artifacts.</p>
    <p>According to my savvy interwebs searches through various dictionary sites - there are other definitions.</p>
    <p>But...</p>
    <p>It is my understanding that the freest of free individuals, not only in America but around the world, are those Artifacts that live a daily grind normally associated with the common life cycle of birth-school-work-die ... somehow find brief moments of unattachment from the 'normal' drudgery whilst maintaining a relationship and true association to the whole!! Truth being, if not for the 'whole' there would not a be a single Artifact pixel itself!</p>
    <p>Again, please make no mistake, Artifacts are still part of an artificial existence.</p>
    <p>As an interesting footnote, the more you squeeze raster / bitmap pixels of information in various formats (a.k.a. file compression), and reduce quality - there seems to be more and more Artifacts.</p>
    <p>n.</p>
