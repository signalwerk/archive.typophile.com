    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : George E. Thompson</strong></p>
    <p>George Everet Thompson is the founder of the No Bodoni type foundry (I felt bad because I had no shoes until I met a man who had no Bodoni). His typefaces appear in "Indie Fonts II," and among them are Isbellium, a sans serif version of Dick Isbell's Americana, Parma Typewriter, Nirvanium, and Tinman, his first attempt at an OpenType font. He teaches graphic design, design history, and typography at Columbia College Chicago where he is Associate Chair of Design Practices.</p>
    <p>Website: <a href="http://www.nobodoni.com" title="http://www.nobodoni.com">http://www.nobodoni.com</a></p>
