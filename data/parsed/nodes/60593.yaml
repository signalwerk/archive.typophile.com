    html: <p>I'm probably the least qualified to critique a sans design, but I will attempt it anyway. To my eye the horizontal weights are a tad too heavy for the verticals. The verticals need to be slightly heavier than horizontals to balance out optically. This is most noticeable on rounded bottoms like the nine or five.</p>
