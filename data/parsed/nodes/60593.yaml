    html: |-
      <p>Ahhhhh, good point. I'll mix them up the next time I post them.</p>
      <p>Yes, these are to go along with an alphabet (more or less).</p>
      <p>They're part of a font that's just numbers and uppercase letters placed within circles. It's hardly an original idea, but all the stuff out there wasn't to my liking for some reason or another. I need to label diagrams for my job, and I wanted something that was neutral, and was also easy to use. So I figured I'd come up with my own version. I'd get everything the way I wanted, and it would a good learning experience.</p>
      <p>I was thinking the letters looked really good, but some of the feedback about the numbers will apply to the letters, so I'm going to clean those up some more and post them as soon as I get the numbers finished.</p>
