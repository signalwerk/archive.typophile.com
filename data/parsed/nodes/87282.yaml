      <p>That's what I meant by "triangulated chapter endings." Not sure if there's a better term.</p>
      <p>Also, and still from wildly different periods:</p>
      <p>Double-em dashes for interruptions: "But I think——"</p>
      <p>And for anonymity: Mr. K—— (still see this sometimes)</p>
      <p>Periods after headings</p>
      <p>Double space between sentences</p>
      <p>Cent sign, "per" sign</p>
      <p>Pointing printer's fingers ("index")</p>
      <p>&amp;c.</p>
      <p>Roman caps with italic lc</p>
      <p>Tables where the vertical rules stop to let the horizontal ones through, or vice versa</p>
      <p>Of course, if you're in England, lots of current American punctuation looks like a charming old fashioned idiosyncrasy: Mr. (instead of British Mr), 1,000 (instead of British 1 000 or 1000), etc.</p>
