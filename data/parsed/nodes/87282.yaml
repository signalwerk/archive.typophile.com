    html: |-
      <p>Various degrees of oldness and extinctness:</p>
      <p>Running heads that were bigger than the main text. Never see that anymore.</p>
      <p>Also, signature numbers printed at the bottom of the first page of a signature.</p>
      <p>Use of dot leaders rather than solid rules for blanks (in tables, etc.)</p>
      <p>Triangulated headings and chapter ends.</p>
      <p>Text set solid.</p>
      <p>Turnover lines brought up or down, and set flush right with one left parenthesis or bracket (still see this sometimes)</p>
      <p>"Block quotes" with quote marks down the whole lefthand side</p>
      <p>Italics for all names</p>
      <p>To-morrow, rôle, co-operate or coöperate, etc.</p>
      <p>The word at the bottom of the page is called a catchword: <a href="http://en.wikipedia.org/wiki/Catchword" title="http://en.wikipedia.org/wiki/Catchword">http://en.wikipedia.org/wiki/Catchword</a></p>
