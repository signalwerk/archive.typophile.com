    <p>Hi all,</p>
    <p>I'm starting a thread about bygone quirks in book design. </p>
    <p>When I say quirks I mean things like endpapers, a note on the typeface at the back of the book, vignettes for each chapter opener, the first word of the next page at the bottom of the current page etc etc. </p>
    <p>Can anyone think of some others?</p>
