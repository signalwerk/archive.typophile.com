    html: |-
      <p><cite> &gt; 'Color plates/tip ins': a separate signature of better-quality paper, specifically for taking color illustrations, all grouped together.</cite></p>
      <p>Yes, that describes color plates — a separate signature of color printing gathered and bound together as a section in an otherwise one-color book (or sometimes two-color: I’ve done that before). </p>
      <p>“Tip-in” usually refers to a color illustration/photo that has been printed by a separate process and then affixed onto a blank page set aside for the purpose in an otherwise one-color book.</p>
      <p>Color plates are still common in certain genres. Tip-ins, however, require hand work and so are almost never seen these days.</p>
    html_clean: |-
