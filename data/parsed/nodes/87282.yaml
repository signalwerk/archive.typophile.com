    html: |-
      <p>In the Monotype machine, Tolbert Lanston initially implemented a justification system that applied even spacing between all characters. However, nobody liked it and it was never put into production, they were happier with the familiar practice of justifying by adding to word spacing. It seems they were comfortable with the integrity and consistency of words in fixed-width fonts, and not bothered by wild variation in word spacing.</p>
      <p>However, when Quark XPress launched with justification-by-character spacing as default, there was no comment. By that time it seems that variability of letterspace and evenness of overall “fit”, as effected by kerning, was preferred.</p>
      <p>A somewhat different kerning effect than I had originally proposed (although I still think that plays a part). As Hrant says, it’s something to do with “the looseness of fixed width fonts”, but I would modify that to “openness” or “spaceyness”, because of the consistency of glyph fitting, which was precise and very tight in many combinations.</p>
    html_clean: |-
      <p>In the Monotype machine, Tolbert Lanston initially implemented a justification system that applied even spacing between all characters. However, nobody liked it and it was never put into production, they were happier with the familiar practice of justifying by adding to word spacing. It seems they were comfortable with the integrity and consistency of words in fixed-width fonts, and not bothered by wild variation in word spacing.</p>
      <p>However, when Quark XPress launched with justification-by-character spacing as default, there was no comment. By that time it seems that variability of letterspace and evenness of overall “fit”, as effected by kerning, was preferred.</p>
      <p>A somewhat different kerning effect than I had originally proposed (although I still think that plays a part). As Hrant says, it’s something to do with “the looseness of fixed width fonts”, but I would modify that to “openness” or “spaceyness”, because of the consistency of glyph fitting, which was precise and very tight in many combinations.</p>
