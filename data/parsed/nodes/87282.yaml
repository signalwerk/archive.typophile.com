    html: |-
      <p>The kerning-killed-double-spacing theory:</p>
      <p>Without kerning, many words that begin sentences (in mixed case, of course) have a large gap between the capital and the lowercase letter immediately after. The culprits are most notably T, V, W and Y followed by a vowel. Double spacing avoided the effect of said capitals appearing to be evenly isolated between the end of the previous sentence and the rest of their word.</p>
      <p>Typewriters had nothing to do with it, as the practice was widespread before their invention.</p>
      <p>The demise of double spacing began with Linotype’s two letter logotypes for the problem capital-vowel combinations.</p>
