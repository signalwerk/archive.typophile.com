      <p>'turnover lines brought up or down...'<br>
      I used to see this in old dictionaries a lot, to save space. Something like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Document1_4345.jpg"></div><br>
      ...where there's three-quarters of a line of empty space after the entry for "turnout...", while the entry for "turnpike..." only wraps to a second line by a short distance, so they turn it <em>up</em> (and right-align it) instead of down, and indicate it with a bracket.<p></p>
      <p>'Color plates/tip ins': a separate signature of better-quality paper, specifically for taking color illustrations, all grouped together.</p>
