    html: |-
      <p>Extra spacing between sentences, killed by kerning.<br>
      However, I wouldn’t call that a quirk, as it served a purpose.</p>
      <p>**</p>
      <p>Reference symbols have been largely replaced by numbers.<br>
      Again, I wouldn’t call them a quirk—they were a practical way for printers to make reference calls by means of characters doing double duty—without recourse to a special sort of superior figures or packing a smaller size figure.</p>
      <p>Similarly:</p>
      <p>Roman figures in italic text.<br>
      Old-style figures in all small caps.</p>
      <p>**</p>
      <p>I would say that “dumb” quotes and faux italic/bold have become (not so nice) old-fashioned quirks, relics of the early days of DTP.<br>
      Perhaps they will acquire a quaint cachet in time.</p>
      <p>**</p>
      <p>A new quirk is how “smart” layout apps abbreviate numbers incorrectly, with a single left quote mark.</p>
