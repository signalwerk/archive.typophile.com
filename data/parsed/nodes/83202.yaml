    <p>Come and join ISType 2011 in Istanbul! September 11-14, 2011</p>
    <p>We are pleased to announce that <a href="http://istype.com/" rel="nofollow">ISType.com</a> is launched and works fine on iPhone and Android as well.</p>
    <p>ISType (Istanbul Type Seminars), conceived by Onur Yazıcıgil (Sabancı University) and Alessandro Segalini (Izmir University of Economics), is a lecture and workshop series devoted to encouraging typographic literacy in Turkey.</p>
    <p>This first annual event will hold lectures and practical workshops meant to set structured approaches to typographic education and theory by embracing history, calligraphy, technology, math, programming, and drawing and art. It will provide students, professionals and enthusiasts with an international gathering where ideas and inspiration can be shared. Moreover, ISType aims to contribute to the development of a typographic heritage in Turkey in which future generations can explore and create further contributions to typographic design and practice. </p>
    <p>In an ever-changing world, people inherently continue to alter their voices in order to adapt to the prevailing needs and tastes of the time. Typography is also not unaffected. Now is a crucial moment to enhance typographic literacy. By valuing an international exchange of ideas and practices, we act to explore typography's origins and to better understand the direction it is heading.</p>
    <p>For detailed information about this year's workshops and lectures please visit the Program and Speakers pages. To attend ISType please complete the form on the Registration page. ISType 2011 will be held in conjunction with ISEA Istanbul 2011, and would like to thank its other sponsors Sabancı University and Mas Matbaa.</p>
    <p><a href="http://istype.com/2011/poster.pdf" rel="nofollow">Click here</a> to download the PDF version of the event poster.</p>
    <p>Follow us on <a href="http://www.facebook.com/ISType" rel="nofollow">Facebook</a>.</p>
    <p>Thanks!</p>
    <p>Alessandro and Onur<br>
    ISType 2011</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ISType_3642.jpg"></div><p></p>
