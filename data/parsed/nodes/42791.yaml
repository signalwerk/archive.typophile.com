    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 4.Mar.2008 8.13am </div>
      <p>TypeSHED11, Wellington, New Zealand<br>
    11-15 February 2009</p>
    <p>We are delighted to announce the first of our invited guest speakers on our website: <a href="http://www.typeshed11.co.nz" title="http://www.typeshed11.co.nz">http://www.typeshed11.co.nz</a></p>
    <p>++watch our website for guest speaker announcements every few weeks++</p>
    <p>+++++++++++++++++++++++++++++++++++</p>
    <p>What else is happening?<br>
    The dialogue continues with typographers, type designers, designers, and those in other disciplines with a connection to typography, as we construct the programme, and gather sponsors.</p>
    <p>+++++++++++++++++++++++++++++++++++</p>
    <p>Proudly sponsored (thus far) by</p>
    <p>silver<br>
    Springload<br>
    sponsor-a-speaker<br>
    Strategy Design and Advertising<br>
    bronze<br>
    Experimenta<br>
    Wellington City Council<br>
    base<br>
    City Gallery Wellington<br>
    FontLab<br>
    Gordon Harris - The Art and Graphic Store<br>
    Massey University<br>
    with the support of<br>
    Designers Institute of New Zealand</p>
    <p>+++++++++++++++++++++++++++++++++++</p>
    <p>Sponsor TypeSHED11<br>
    We offer sponsors the opportunity for promotion and international visibility with TypeSHED11, New Zealand’s first-ever international typography symposium. For more information, contact us at:<br>
    <a href="mailto:sponsor@typeshed11.co.nz">sponsor@typeshed11.co.nz</a></p>
    <p>+++++++++++++++++++++++++++++++++++</p>
    <p>TypeSHED11, Wellington, New Zealand<br>
    11-15 February 2009<br>
    A five-day international typography symposium<br>
    in collaboration with Typevents LLP<br>
    <a href="http://www.typeshed11.co.nz" title="http://www.typeshed11.co.nz">http://www.typeshed11.co.nz</a></p>
