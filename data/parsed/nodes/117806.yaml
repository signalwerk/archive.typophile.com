    <p>So I'm attempting to to redesign the corporate identity for this brand <a class="freelinking external" href="http://imgur.com/z4j0YES" rel="nofollow">here</a>.</p>
    <p>The logo is currently used for a professional gaming team that has been around for many years. In terms of what the brand should represent: professionalism, edginess &amp; competition/sportiness with perhaps a bit of a futuristic vibe given the industry it's in.</p>
    <p>As you can see, the text version of the logo is quite tacky and outdated (currently uses Concelian Jet).</p>
    <p>While the core shape of the logo is unlikely to be changed, I've been considering trying to change the font used in the main logo and move it *beneath* the logo instead of on top. However, I've been struggling to find something that really fits well visually.</p>
    <p>I've played around with Eurostile Extended, Magistral and even typefaces like TradeMarker. I just don't know what will work well visually with such a round, sharp logo. Keeping the brand qualities in mind, does anyone have any suggestions? I was thinking trying to stick with something bold &amp; oblique, but would that be a bad idea?</p>
    <p>Furthermore, our assisting brand font is currently DIN but I've been thinking about switching to the less sterile and softer Roboto although I worry that it may not mesh well with the logo.</p>
    <p>Thanks in advance to anyone who offers their input.</p>
