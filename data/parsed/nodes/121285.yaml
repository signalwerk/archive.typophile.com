      <p>I’m assuming you mean for the main title, as you don’t want to go any lighter on the small stuff or you’ll risk unreadability. If that’s the case, consider oldstyle serif typefaces designed for large sizes:<br>
      <a href="http://www.myfonts.com/fonts/adobe/garamond-premier/?refby=typographica" rel="nofollow">Garamond Premier Display</a><br>
      <a href="http://www.myfonts.com/fonts/adobe/arno/?refby=typographica" rel="nofollow">Arno Display</a><br>
      <a href="http://www.myfonts.com/fonts/stone/cycles/?refby=typographica" rel="nofollow">Cycles Thirtysix</a><br>
      <a href="https://commercialtype.com/typefaces/lyon/lyon_display" rel="nofollow">Lyon Display</a><br>
      <a href="http://www.typography.com/fonts/quarto/webfonts/quarto-light/" rel="nofollow">Quarto Light</a><br>
      <a href="http://www.webtype.com/font/big-caslon-fb-family/" rel="nofollow">Big Caslon</a><br>
      <a href="http://www.myfonts.com/fonts/garagefonts/freight-big-pro/?refby=typographica" rel="nofollow">Freight Big</a> / <a href="http://www.myfonts.com/fonts/garagefonts/freight-disp-pro/?refby=typographica" rel="nofollow">Display</a></p>
