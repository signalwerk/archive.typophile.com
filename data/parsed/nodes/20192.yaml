    <p>about zeixs «</p>
    <p>zeixs - portal for designers world - created by Feierabend Publishing and 12ender agency.<br>
    what is zeixs? zeixs is an inseminatting confusion of differently media.Typography, Illustration, Graphic Design, Logotype<br>
    just as much as Industrial Design and Photography constitute zeixs. </p>
    <p>how does zeixs work? Show us your work - we´ll show it to the world. </p>
    <p>what does zeixs stand for? far away from mainstream. Latest project are four books. Topic: Typography, Logotype, Graphic Design<br>
    and Illustration. If you think that your work deserve beeing published utilize zeixs.<br>
    See more information on <a href="http://www.zeixs.com" title="www.zeixs.com">www.zeixs.com</a><br>
    Would be nice if you could forward this link.<br>
    We need input as much as possible.<br>
    Thanks a lot.</p>
