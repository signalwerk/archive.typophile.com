  html: |-
    <p>A full-color art quality book about wood type, including 120 classic and rare fonts shown both in proof and in full color photographed from the actual font. The 330-page book also contains extensive background material on the history and development of typography, the evolution and use of wood type, and portraits of current wood type printers, artists, educators and collectors. 84-year-old collector, printer and writer Greg Ruffa designed the book himself, and oversaw production from start to finish. The book is only available directly through Greg. Price is $50, plus $5 shipping and handling (there are significant discounts for teachers and students). For more information, or to place an order:</p>
    <p><a class="freelinking external" href="http://www.theartofwoodtype.com" rel="nofollow">http://www.theartofwoodtype.com</a> </p>
