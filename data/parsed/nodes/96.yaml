    date: 2003-05-13T09:05:00
    date_raw: 13 May 2003 — 9:05am
    votes: null
    html: <p>Thanks for your feedback... sometimes an outside opinion is just the ticket. Vive le Typophile! <br> <br>Hhp, Hector &amp; Santi; Botanical, eh? I like that. <br> <br>Adriano; I created the typeface in Illustrator but it was based on the circular forms found in the Bauhaus typeface... or maybe it was just based on circles :o) Bauhaus looks alot like the Lisboa logo you'd posted, though... then again, I'm still kind of new at noticing the subtle differences between seemingly similar faces. <br> <br>Randy; I also made this connection and was afraid that everyone else would too... it's not a bad thing to be, but, for this project I was looking for something else. I was really surprised to see that not everyone made the youth-culture connection, but, I was mostly relieved. <br> <br>-craig</p>
