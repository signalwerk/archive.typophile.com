    date: 2003-06-06T22:57:00
    date_raw: 6 Jun 2003 — 10:57pm
    votes: null
    html: "<p>I just spent seven thousand hours writing a post in response to all of your comments and now, by no fault of typophile.com and for reasons too boring to explain, it's all gone. Lame. <br> <br>Anyway... <br> <br>Brian, <br> <br>It's funny how generic the clover pattern is. Thought I was being kind of clever with this, but, I guess it's true what they say: It's all been done before. <br> <br>I like the first image you've posted. It's exactly the clean geometric stuff that I like to see. I know it's not up for critique or anything, but I must say, that is one sweet icon. Your book also sounds great. <br> <br>Paul, <br> <br>If anyone asks, you could tell them that you're \"crazy... like a fox!\" That bit never gets old. <br> <br>Tiff,  <br> <br>Great! Wasn't offended by the nbc comparison at all. I'm a big fan, no, huge fan of the nbc/peacock logo. <br> <br>Typophile.com, <br> <br>I'll be a paying member soon. Promise. <br> <br>_craig <br> <br>P.S. Issue one will be out next monday, June 9th @ <a href=\"http://www.formandform.net\" target=\"_blank\">http://www.formandform.net</a>. This logo, probably, wont be used. <br> <br></p>"
