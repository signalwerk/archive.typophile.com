      <p>I always cover CMYK vs RGB, regardless of the class. And I always throw in as much typography material as I can since they haven't had any. The other thing I try to work in is chapter four from the Dondis book. Such great stuff, and it is dry and difficult to read, but great anyway (I love Univers generally, but the use of it in PoVL is not that great. It's very fatiguing).</p>
      <p>Some of the books I've been looking at from Amazon are poster collections (handmade and otherwise), books about how to use grids, and album cover design collections. I finally realized that I was looking for books to inspire rather than instruct, like eeblet mentioned. <a href="http://www.amazon.com/flatnessisgod-Ryan-McGinness/dp/1887128344/ref=wl_it_dp?ie=UTF8&amp;coliid=I2MKO87R3L1KLP&amp;colid=1PX0QJ3CQTQI9" rel="nofollow"> Flatnessisgod</a> by Ryan McGinness did that for me a few years ago, but unfortunately it isn't widely available.</p>
      <p>Field trips are difficult since all of my classes start at 6PM.</p>
      <p>Off topic: Ricardo, are you a Boca fan? My son is nuts about the team. He wears his official Boca Juniors socks any time he gets a chance, and is constantly kicking a ball around the yard pretending to score goals against River. Everything has to be blue and yellow.</p>
