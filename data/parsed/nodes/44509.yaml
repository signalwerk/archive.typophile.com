      <p>Well, if you aren't going to bore them, where are you going to find your fun? :)</p>
      <p>A couple printing technology things that worked for me were: tearing apart an old hard cover book ($1 at a flea market) to see how it work, especially how the pages were imposed.</p>
      <p>Getting a piece of newspaper (this might cost more than the book) and having everyone tear out an ad or article. Great teaching moment on paper grain, and why you can tear easily one way, and not the other. Follow up with folding a piece of bond paper with and against the grain to see the difference. Finally, show the wrapper from the ream of bond (hopefully it will show the grain direction with an underline).</p>
      <p>Less exciting stuff involved looking at colored halftones with a loupe to see the angles of the halftone screens. Looking at black and white halftones to find the shape of the dots and the angle.</p>
      <p>My students hated my course while they were taking it, but tended to rave over it when they got a job and found out that this boring stuff was important, and they moved ahead quicker than the students from other schools who didn't know it.</p>
