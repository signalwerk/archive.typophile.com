      <p>Isaac, </p>
      <p>Will you be teaching your students the difference between RGB colors and CMYK colors? I'm not kidding -- it seems that lots of practitioners don't know something as basic as that these days...</p>
      <p>At the risk of boring your students <strong>even more</strong>, when I went to design school in the 80s one of the first books we had to read for design class was <a href="http://mitpress.mit.edu/catalog/item/default.asp?ttype=2&amp;tid=7264" rel="nofollow"><em>A Primer of Visual Literacy</em></a>, by Donis A. Dondis. It covers the basic elements of visual communication (dot, line, shape, direction, tone, color, texture, scale, dimension, movement), the dynamics of contrast, visual techniques (i.e., balance-instability, symmetry-asymmetry, regularity-irregularity, neutrality-accent, etc.), and so on. I think that 99% percent of my class complained about how boring it was, but one of my friends later admitted that he'd learned quite a bit by reading it. This book is mostly text with a few simple diagrams, but there are two alternative titles that have more graphics (and have more recent publication dates): <a href="http://www.papress.com/bookpage.tpl?cart=110&amp;isbn=1568985819" rel="nofollow"><em>Visual Grammar</em></a>, by Christian Leborg, and <a href="http://www.viget.com/inspire/graphic-design-the-new-basics/" rel="nofollow"><em>Graphic Design: The New Basics</em></a>, by Ellen Lupton and Jennifer Cole Phillips.</p>
      <p>And Eeblet mentions Jan White! I borrowed some of his books from the library when I was just out of school; he has a few (one of them was called <em>Editing By Design</em>... it was for newspaper editors, but had a great chapter on design and layout). I think they are great for beginners -- they aren't densely packed with text or theory. Just what your action-seeking students might be into.  :-)</p>
      <p>[EDIT] And wait a minute, beyond books, is there any way you can make a field trip to a local print or letterpress shop? How about a local magazine or newspaper? Those things are usually eye-opening experiences when you are still in school.</p>
