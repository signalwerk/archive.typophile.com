      <p>Some info on technology and process would be good, and I agree a designer should know something about it, but I fear a massive mutiny if I make these people "bored." I don't want to bore you with a list of my complaints and problems (kids these days!), so I'll just say that <a href="http://www.tricity.wsu.edu/dtc/" rel="nofollow">the program itself</a> is not a regular graphic design program. Most of the projects will undoubtedly be output on the laser printers available at the school or on home printers. It's not bad to learn how to make something turn out good on a cheap ink jet printer, but some higher end or out of the ordinary stuff would be good as well. Lead type is definitely out. Boo-hoo.</p>
      <p>Anyway, any suggestions---no matter how technical or off-beat---are welcome and appreciated.</p>
