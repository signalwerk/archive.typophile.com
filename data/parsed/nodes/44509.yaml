      <p>For this particular class though, I need to stay less type focused (so why am I posting on typophile if I'm looking for general design books? Because there are a lot of smart people here, that's why). Amazingly, this school has exactly zero typography classes, so the students are not up to speed in that area. And a few other areas as well, but that's another issue. I just need them to go from the basic basics (form, line, etc, etc) to the mid-basics, like compositional basics.</p>
      <p>As a side track, you wouldn't believe how many students are just not interested in anything off-screen. "Can we use Photoshop for this?" "When can we learn Dreamweaver?" Depressing.</p>
      <p>Good night.</p>
