    <p>Hey everyone,<br>
    I'm looking for some input on good books, and not just text books (I get frustrated with "traditional" text books sometimes, for a variety of reasons). The class I'm wondering about specifically is called Print Based Media. The course description: <em>Principles and processes of visual communication in digital print; may include typography, image/text relationships, layout design and book arts.</em></p>
    <p>I've only taught it one time before, but didn't require a book. Since it's a pretty basic class the projects stay pretty basic—event posters, redesign book covers, one color, etc. I think the students would benefit from having a book to reference, especially since they generally haven't had much conscious exposure to design yet. Last time I taught it they were screaming for Photoshop tricks and computer gizmos, so a book that has some historical leanings might be nice.</p>
    <p>I probably haven't been very clear, so I apologize. Any input is appreciated.</p>
