      <p><em>Off topic: Ricardo, are you a Boca fan?</em></p>
      <p>That's a dang funny question, Isaac! No, I'm not, but my father was. I have a funny story about this. We moved to the States when I was 3 years old, then moved back to Buenos Aires when I was in third grade. I had no idea my dad was a Boca fan. So on my first day of class in Buenos Aires all these kids ask me what soccer team I am a fan of, and I don't know any teams. A bunch of them, obvious River fans, start shouting "River! River!" Next thing you know, I am at home having dinner with my folks and I tell them how I've become a fan of River. My dad's jaw drops, and after a beat he says, "But I'm a Boca fan!" Poor dad... I'm sure that was harder for him than when I told him I wanted to study graphic design.  :-D</p>
      <p>So anyway, for a while I was a River fan. My little brothers became fans of Racing. I have to say, though, I'm not much of a soccer fanatic.</p>
