      <p>I've read a lot of Type &amp; Design books this year, and the one that made the biggest impression on me was Jan White's Graphic Idea Notebook.  It's just so weird and cool and inspiring, while at the same time reviewing the nuts and bolts of graphic communication (mostly in the context of pre-Photoshop magazine art direction).   To be fair, the version I read was the 1980 edition and not the more recent 2004 edition.  I'd love to take a look at that... although I prefer the older cover (the bigger img).</p>
