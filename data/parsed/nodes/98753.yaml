      <p>According to <strong><a class="freelinking external" href="http://abfonts.freehostia.com/solo/solopedia-h.htm" rel="nofollow">Solopedia catalog</a></strong></p>
      <blockquote><p>(Page 72)<br>
      <strong>Name:</strong> Hong Kong<br>
      <strong>Aliases:</strong> Orient1 (A&amp;L), Konfuzius (Brendel), Taipeh (Brendel), Orient (WSI), Rickshaw (Fantazia). Orient1 and Orient have multiple variations. Bonzai (anon)<br>
      <strong>Notes:</strong> The two Brendel fonts have numerous differences. Original was 1935 Chop Suey by Ross F. George, based on a previous face named Peking.</p></blockquote>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
