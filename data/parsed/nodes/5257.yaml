    html: "<p>The new one is 100 times better! I like how the italic angle matches the paper angle. <br> <br>My only complaint is the spacing: a bit uneven, and a bit loose for the \"Starke\". <br> <br>Also, I would lower the ascender of the \"k\" to match the height of the \"S\". <br>And I might use a non-descending \"f\" in the claim. <br> <br>&gt; The corners of paper will be adjusted to <br>&gt; the type-corners in the final version. <br> <br>Do you mean they're going to be less sharp? Yes, that's needed (even of its own). <br> <br>hhp <br></p>"
    html_clean: "<p>The new one is 100 times better! I like how the italic angle matches the paper angle. <br> <br>My only complaint is the spacing: a bit uneven, and a bit loose for the \"Starke\". <br> <br>Also, I would lower the ascender of the \"k\" to match the height of the \"S\". <br>And I might use a non-descending \"f\" in the claim. <br> <br>&gt; The corners of paper will be adjusted to <br>&gt; the type-corners in the final version. <br> <br>Do you mean they're going to be less sharp? Yes, that's needed (even of its own). <br> <br>hhp <br></p>"
