    date_raw: 18 Jun 2004 — 1:16am
    votes: null
    html: "<p>Here an other one for wireality (<a href=\"http://www.wireality.com\" target=\"_blank\">http://www.wireality.com</a>): <br>Author: Bogdan F Iliescu <br> <br>(...) <br>As I see it in your sketch the type means to state solid business and the <br>paper creativity. I would change first the colors. I would make the name red <br>and the paper blue. I would go further and I would try a red/blue scheme for <br>the paper itself. Blue in the name conveys a somehow negative feeling. It is <br>not the happiest of colors especially so full-bodied. <br> <br>The last modification I made would be to try to link the symbol with the <br>name a little tighter (make it come underneath the name and go top right or <br>something). I would also make it a little more stylized and a little more <br>dynamic. I don't think the twists and curves really help (they may create <br>the \"toilet paper\" effect <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">. Try as little as necessary to make it clear is <br>a sheet of paper and a really fast one and that should do it in my opinion. <br> <br>Bogdan</p>"
    html_clean: "<p>Here an other one for wireality (<a href=\"http://www.wireality.com\" target=\"_blank\" class=\"link-external\">http://www.wireality.com</a>): <br>Author: Bogdan F Iliescu <br> <br>(...) <br>As I see it in your sketch the type means to state solid business and the <br>paper creativity. I would change first the colors. I would make the name red <br>and the paper blue. I would go further and I would try a red/blue scheme for <br>the paper itself. Blue in the name conveys a somehow negative feeling. It is <br>not the happiest of colors especially so full-bodied. <br> <br>The last modification I made would be to try to link the symbol with the <br>name a little tighter (make it come underneath the name and go top right or <br>something). I would also make it a little more stylized and a little more <br>dynamic. I don't think the twists and curves really help (they may create <br>the \"toilet paper\" effect <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">. Try as little as necessary to make it clear is <br>a sheet of paper and a really fast one and that should do it in my opinion. <br> <br>Bogdan</p>"
