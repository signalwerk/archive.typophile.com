  html: "<p>Hi, <br> <br>please comment this logo (sketch). <br> <br>Is there an other Logo, coming up into you mind, if you look at this? <br>I'm anxious; there could be something similar out there. =) <br> <br>Client: <br>press, printers office <br>only for designers <br>cheap, fast, anonymous <br> <br>Colors must stay: <br>Red &amp; Blue <br> <br>Name: <br>Starke <br>Founders surname <br> <br>Claim: <br>printers for creative <br> <br>The corners of paper will be adjusted to the type-corners in the final version. <br> <br>Old: <br><a href=\"http://www.cidoc.net/work/starke_old.png\" target=\"_blank\">http://www.cidoc.net/work/starke_old.png</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/38556.png\" alt=\"The Old\"> <br> <br>New: <br><a href=\"http://www.cidoc.net/work/starke_without_claim.png\" target=\"_blank\">http://www.cidoc.net/work/starke_without_claim.png</a> <br><a href=\"http://www.cidoc.net/work/starke.png\" target=\"_blank\">http://www.cidoc.net/work/starke.png</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/38557.png\" alt=\"The New\"> <br> <br>Best Regards, <br> <br>Robert Salzmer <br> <br>  visit my magazine: <br>  corporate identity documentation <br>  <a href=\"http://www.cidoc.net\" target=\"_blank\">http://www.cidoc.net</a></p>"
  html_clean: "<p>Hi, <br> <br>please comment this logo (sketch). <br> <br>Is there an other Logo, coming up into you mind, if you look at this? <br>I'm anxious; there could be something similar out there. =) <br> <br>Client: <br>press, printers office <br>only for designers <br>cheap, fast, anonymous <br> <br>Colors must stay: <br>Red &amp; Blue <br> <br>Name: <br>Starke <br>Founders surname <br> <br>Claim: <br>printers for creative <br> <br>The corners of paper will be adjusted to the type-corners in the final version. <br> <br>Old: <br><a href=\"http://www.cidoc.net/work/starke_old.png\" target=\"_blank\" class=\"link-external\">http://www.cidoc.net/work/starke_old.png</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/38556.png\" alt=\"The Old\"> <br> <br>New: <br><a href=\"http://www.cidoc.net/work/starke_without_claim.png\" target=\"_blank\" class=\"link-external\">http://www.cidoc.net/work/starke_without_claim.png</a> <br><a href=\"http://www.cidoc.net/work/starke.png\" target=\"_blank\" class=\"link-external\">http://www.cidoc.net/work/starke.png</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/38557.png\" alt=\"The New\"> <br> <br>Best Regards, <br> <br>Robert Salzmer <br> <br>  visit my magazine: <br>  corporate identity documentation <br>  <a href=\"http://www.cidoc.net\" target=\"_blank\" class=\"link-external\">http://www.cidoc.net</a></p>"
