    <p>Letterpress: Forward thinking<br>
    =============================</p>
    <p>   * Friday 19 November 2010<br>
       * 9:30 am (registration from 8.45)<br>
       * In the Bridewell Hall, St Bride Foundation<br>
       * Tickets £75/£60 FoSB members * concessions £30/£25 FoSB members</p>
    <p>Join us for a day packed with talks, demonstrations and discussion celebrating new ideas and practice in handset typography.</p>
    <p>Book tickets online: <a href="http://letterpresssforwardthinking.eventbrite.com/" title="http://letterpresssforwardthinking.eventbrite.com/">http://letterpresssforwardthinking.eventbrite.com/</a></p>
    <p>Programme now online: <a href="http://stbride.org/events/letterpress_1/programme" title="http://stbride.org/events/letterpress_1/programme">http://stbride.org/events/letterpress_1/programme</a></p>
    <p>Letterpress, we were once told, was a thing of the past. Yet, now letterpress is very clearly the focus of renewed enthusiasm. Interest in setting types by hand continues to grow, with an increase in letterpress activity further fuelled by an ongoing concern with visual authenticity. For many, letterpress offers something beyond straightforward graphic reproduction. It offers the means to create hand-made objects of worth.</p>
    <p>But to what extent are we still looking backwards rather than forwards when we consider our expectations of letterpress? Much contemporary practice certainly seems to have settled into something of a retro-groove. In the midst of all the nostalgia though, there are people who offer alternatives to this potential dead-end, reinventing their practices and working in more exploratory ways.</p>
    <p>Our speakers will share with us their excitement at the possibilities before us. Together we can discover what is genuinely new in letterpress thinking across areas such as education, design, printing practice and mechanical futures. Having begun to find out what innovation in letterpress might mean, the challenge will be for each of us to then consider how we might creatively respond.</p>
    <p>Speakers include:</p>
    <p>Dafi Kühne, a Swiss graphic designer and letterpress printmaker who, as well as being an intern at the legendary Hatch Show Print poster shop in 2008, explored the experimental boundaries of 'Woodtype Now!', the title of his graduate dissertation.</p>
    <p>Edwin Pickstone, a young designer based in Glasgow whose graduate work, featured in Eye 57 back in 2005, embodied a potential new direction for letterpress that he has followed through in more recent projects.</p>
    <p>JMG, Typoretum and Patrick Randle who have followed individual paths into garages, sheds and outhouses in the pursuit of a love of letterpress printing and who together comprise the creative collective of the Occasional Print Club.</p>
    <p>Catherine Dixon, a designer and teacher from London who will tell something of the so-far so-good survival story of Grafica Fidalga, the only remaining typographic 'lambe-lambe' printshop in São Paulo, Brazil.</p>
    <p><a href="http://stbride.org/events/" title="http://stbride.org/events/">http://stbride.org/events/</a></p>
