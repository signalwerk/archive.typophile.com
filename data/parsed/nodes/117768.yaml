    html: <p>The 2 second impression is that if I were in the store, I would not even pause to look at this wine. If I were to rationalize, it'd be due to the use of red on the label, or rather its particular shade, which is desaturated and pink-ish. It just doesn't associate with a glass of wine *at all*. It does however associate well with "Sale" stickers that they frequently use to label discounted products.</p>
