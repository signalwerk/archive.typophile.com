    html: |-
      <p>Yeah I understand what you're saying but it seems as though a lot of the other students do that..."Big Barrel Winery", so they incorporate a "Barrel" in the design somehow. I try not to do the most obvious idea but then again it can sometimes be the best idea hey? It may help if I explain why I designed it this way...? Understand if it's too much reading...personally I hate reading ;-)</p>
      <p>Firstly djama Moscato will be produced in Maleny, Sunshine Coast Hinterland, QLD at the Big Barrel Winery. The traditional owners of this land is the aboriginal Kabi Kabi mob which is why the brand name of the wine has been given ‘djama’ which means ‘drink’. It is also why the label has adopted the colours of the aboriginal flag (black, red and yellow) and the graphic is made up of aboriginal symbols (sun, rain, mountain and running water).</p>
      <p>Whilst googling images of wine bottle labels I found that I was most drawn to labels that allowed the viewer to see the colour of the bottle/wine via a cut out or a split – it’s captivating. I believe that if two bottles of the exact same wine were side by side the viewer would choose the one with the most creative or eye-catching label. I also realised that the important/must have information is found on the back of the bottle leaving the front/main label clutter free/minimalistic. </p>
      <p>As wine has been around for thousands of years I chose to have ‘Big Barrel Winery’ and ‘Moscato 2010’ in a serif font (Book Antique) as it too has been around for a similar timeframe. You will notice that the winery, the wine type and the information on the back is in capitals, this is showing the consumer that this information is locked in and won’t change. The brand name, however, is in lower case and a display type as it can change from wine to wine.  Blackadder ITC was used for the word ‘djama’ to differentiate it from the rest of the type.</p>
      <p>The three elements that draw the consumer in most is the colour combination, the use of aboriginal symbols and the Glasshouse Mountains silhouette cut-out which reveals the wine/bottle colour. It is most intriguing.</p>
