  html: |-
    <p>Ever since I “upgraded” to FontLab 5.2, when I do quick font tests, I get an error message saying that the OS/2 ascender and descender values don’t equal the bounding box, and it happens whether or not I choose the automatic calculation (as recommended), or choose custom values, and let FontLab recalculate.</p>
    <p>If I ignore the message, the fonts that are generated generally clip the accents on uppercase letters, and the cedilla on the uppercase AND lowercase C. At the risk of sounding somewhat Seinfeldish, what’s up with that?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/21155" class="topic-previous" title="Go to previous forum topic">‹ InMath vs MathMagic vs MathType</a> <a href="/node/20954" class="topic-next" title="Go to next forum topic">pencil drawings in illustrator? ›</a></div>
