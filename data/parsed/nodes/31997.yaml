      <p>It seems that the presentation is over already anyway, if the date given in the poster is correct…<br>
      Apart from that, I like it as it is. The names list seems a little too long for the picture, though. And I am wondering if the only names you chose white for are referring to some special people (I mean this white is the only instance that is brighter than all the rest of your poster, which says 'something with light').<br>
      Nice work with the 3 UC 'F' in <strong>F</strong>riday, <strong>F</strong>ebruary, <strong>F</strong>ountain, btw. The 'organic' feel of the arc you are playing with seems reasonable in connection with these. But then again, why have the names list as straight as it is, left aligned? What about putting it to the upper left? Nah, it strangely fits, anyway, so just forget it ;-)</p>
