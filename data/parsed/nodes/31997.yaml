    <p>I would like to get some feedback on this poster. The poster invites people for a display of work done by some students in a workshop called 'playing with light'. I would especially like to get some views on the font used...if it works for the poster or not and also about the overall look of the poster. Please spare a couple of minutes of your time to tell me what you think.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/playing with light_4251.jpg"></div><p></p>
    <p>Vinu Chaitanya<br>
    Graphic Design student<br>
    India</p>
