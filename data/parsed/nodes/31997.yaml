    html: |-
      <p>I'd darken the color of the title to make it stand out more, it gets lost down there in the corner. That might not make it work, but its a start. That said, I agrees with the previous comments about alignments and scale.</p>
      <p>I think that there's a much bigger flaw in your concept for the piece; neither of your typefaces integrate with the decorative elements they're attached to. The way you've just extended straight portions of strokes and serifs and attached the decorations makes them look like they were tacked on without much thought; you really need to either find fonts that can make the connection smoothly or really start tweaking the outlines to make them work smoothly with the fonts you're using now.</p>
    html_clean: |-
      <p>I'd darken the color of the title to make it stand out more, it gets lost down there in the corner. That might not make it work, but its a start. That said, I agrees with the previous comments about alignments and scale.</p>
      <p>I think that there's a much bigger flaw in your concept for the piece; neither of your typefaces integrate with the decorative elements they're attached to. The way you've just extended straight portions of strokes and serifs and attached the decorations makes them look like they were tacked on without much thought; you really need to either find fonts that can make the connection smoothly or really start tweaking the outlines to make them work smoothly with the fonts you're using now.</p>
