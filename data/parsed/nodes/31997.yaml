      <p>I like the atmosphere it has. But I agree with some of the comments above.<br>
      I also think that the overall size of the type may be a bit small. Usually, a poster should catch peoples eye from a small to medium distance. With this poster you really would have to get up close, which in itself is fine. But the poster will have to get peoples attention first, for that to happen. :)</p>
