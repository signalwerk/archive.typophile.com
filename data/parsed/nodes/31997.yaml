      <p>nice image...........</p>
      <p>i wouldnt run your type into the darker parts like you have done with the last few names on that list. Im not sold on the placement of 'playing with light' ....for me top left would work better with the image, because the image pulls the eye from left to right, so i would put the main title at the beginning of that line of path, which would probably have a knock on effect onto your other text. But at the moment i just feel it lacks a hierarchy. But i like the overall feel, just think it needs some 'playing with layout' ho ho</p>
