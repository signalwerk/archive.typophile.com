  html: |-
    <p>The Call for Entries - ART BOOKS WANTED is organized by the international publisher EDITION LIDU with the goal of supporting Art and Book culture worldwide. EDITION LIDU focuses on producing quality ART &amp; GRAPHIC BOOKS, CHILDREN'S BOOKS and NEW MEDIA PROJECTS.</p>
    <p>EDITION LIDU search for author's books, graphic books, art comic strips, illustrated short stories, photo books, hand-printed books and other original book forms which haven't been published yet or has been self-published in limited edition.<br>
    The Call for Entries is open to established and emerging ARTISTS, ILLUSTRATORS, GRAPHIC DESIGNERS, TYPOGRAPHERS, PHOTOGRAPHERS, WRITERS, ART and DESIGN STUDENTS.</p>
    <p>SUBMIT YOUR PROJECTS AT:<br>
    <a href="http://www.editionlidu.com/artbookswanted/" title="http://www.editionlidu.com/artbookswanted/">http://www.editionlidu.com/artbookswanted/</a></p>
