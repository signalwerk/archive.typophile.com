    html: <p>Have you tried selecting a glyph from an OTF font other than the bullet character itself in the Define New Bullet selection? I'm suspecting it will also not work, but it would be one of the variables I would try to isolate. The whole bulleted list mechanism in Word is a bit unusual in that the bullets are part of the formatting rather than part of the text, so it is entirely possible that the Word programmers included or inherited an assumption that the 'symbol' option source in this mechanism is a TrueType font.</p>
