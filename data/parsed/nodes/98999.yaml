    html: |-
      <p>Hi John</p>
      <p>To input the bullet glyph from a certain font to a list in Word 2010, I:</p>
      <p>1) Choose the bulleted list icon, then choose Define New Bullet.</p>
      <p>2) Click the Symbol button and set the font to the font I wish the bullet to be taken from.</p>
      <p>3) Choose the bullet glyph (U+2022) from the glyph overview and press OK.</p>
      <p>Best<br>
      Elias</p>
