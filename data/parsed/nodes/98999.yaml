  - id: 541396
    user: 1262
    date: 2013-01-29T11:13:00
    date_raw: 29 Jan 2013 — 11:13am
    votes: null
    html: <p>I think it is more likely an example of how software developers have inherited code written by people who ignored PS Type 1 fonts in the past, and hence made assumptions about TrueType fonts as sources. In a case like this, I would guess that the symbol insert is somehow grabbing a TT glyph direct from the font's glyf table, rather than inserting a character code and mapping via the cmap table. So when it encounters a CFF font it can't find the glyf table and is unable to insert the symbol.</p>
    html_clean: <p>I think it is more likely an example of how software developers have inherited code written by people who ignored PS Type 1 fonts in the past, and hence made assumptions about TrueType fonts as sources. In a case like this, I would guess that the symbol insert is somehow grabbing a TT glyph direct from the font's glyf table, rather than inserting a character code and mapping via the cmap table. So when it encounters a CFF font it can't find the glyf table and is unable to insert the symbol.</p>
