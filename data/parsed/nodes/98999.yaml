    <p>Hi all</p>
    <p>When customizing bullets in Word 2010 on a PC, Word will replace the bullet (U+2022)with a lower case o. This seems only to be an issue when the bullet is picked from an OTF-font. If picked from a TTF-font, the bullet works properly (I have tested a dozen OTFs up against the same amount of TTFs, all with the same result).<br>
    Now, when producing an OTF-font, is there any way to solve this issue, other than, as I have done, adding a bullet with a different unicode value to the font?<br>
    And would you happen to know why this issue exists in the first place?</p>
    <p>Your help will be much appreciated.</p>
    <p>Warm regards<br>
    Elias</p>
