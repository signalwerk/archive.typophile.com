      <p>In regard to Georgia/Miller.</p>
      <p>I think Georgia was commissioned by Microsoft in TrueType format in the early-1990s. I know Miller (which is somewhat identical, in regard to basic letterforms) was not available then. I think in 1995 or 1996, I had asked Matthew if he had a PS1 Mac/PC convertible roman with a companion Greek (there was nothing available at the time) and he said he had the beta Miller and Wilson Greek but they were not sized to each other and Miller did not have an italic at that point. What I needed was a full roman and italic (with all Latin forms and characters that had been used by the Aldines—including arcane incunabular) and a Greek. Carter bit the bullet and provided the needed typeface/s as Manutius, which was later commercially available as Miller and Wilson Greek (without all the alternate characters). Manutius was decommissioned with the completion of the project in 2000/01. As I recall Carter ran most of it through Font Bureau.</p>
      <p>I think Manutius is referenced in Typographically Speaking or some other recent issue devoted to Matthew but I have not otherwise seen mention of it.</p>
      <p>With Matthew’s permission though, I wrote an article on it for Printing History (Journal of the American Printing History Association). Includes some typographic specimen showings of the book project, The Aldine Press.</p>
      <p>Gerald</p>
      <p>The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
