      <p>You might want to look into this... </p>
      <p><a href="http://www.microsoft.com/typography/links/news.aspx?NID=5819" title="http://www.microsoft.com/typography/links/news.aspx?NID=5819">http://www.microsoft.com/typography/links/news.aspx?NID=5819</a></p>
      <p>Some chaps at a gallery/studio in Seattle, wanted to do some kind of font exhibit during TypeCon and I suggested that Matthew’s Microsoft work might make for a good subject. When I contacted Matthew he noted that there’s very little source material, drawings etc., for these fonts and that there’s a lot of misinformation about them floating around out there. He thought telling the story of these fonts might set the record straight, so a possible approach they’re looking at is interviews with the people involved, along with visuals of the fonts themselves. We’re also keeping John Berry in the loop, re. a possible book or article related to this.</p>
