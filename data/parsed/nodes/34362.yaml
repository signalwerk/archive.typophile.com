      <p>Great topic! Maybe one day you can make it into<br>
      something as famous as the Helvetica movie!  :-)</p>
      <p>Here’s one thing - an interesting old interview:<br>
      <a href="http://www.will-harris.com/verdana-georgia.htm" title="http://www.will-harris.com/verdana-georgia.htm">http://www.will-harris.com/verdana-georgia.htm</a></p>
      <p>In terms of history, like Claus says it’s related to Miller,<br>
      and they’re both what’s called “Scotch” type - you might<br>
      like to read up on that in chapter 21 of A Lawson’s classic<br>
      “Anatomy of a Typeface”.</p>
      <p>And if you have the time/patience to sift through a great deal of<br>
      writing you might find some interesting things here on Typophile,<br>
      but use Google’s search, like this: “site:typophile.com georgia”</p>
      <p>Lastly, a big part of Georgia’s essence is of course related to its<br>
      on-screen quality, so you might do some research into bitmap<br>
      fonts, hinting, etc. not least by searching Typophile, but also<br>
      via Microsoft’s superb type section:</p>
      <p><a href="http://www.microsoft.com/typography/default.mspx" title="http://www.microsoft.com/typography/default.mspx">http://www.microsoft.com/typography/default.mspx</a></p>
      <p>hhp</p>
