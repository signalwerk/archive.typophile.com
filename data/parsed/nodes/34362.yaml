    <p>hi guys,<br>
    I’m a student of design at Politecnico di Milano.<br>
    I will make a video aboutGeorgia  font, but I don’t have enough info about it.<br>
    I’m searching the web, but find more info about Carter and poor articles about Georgia, asking to teachers but they told me always the same short infos:</p>
    <p>“It’s one of the best serif screen type,designed by Mr. Matthew Carter for MS after long studies and experiments about screen res.”</p>
    <p>Can you help me with info and good links?</p>
    <p>thanks,</p>
    <p>Andrea</p>
