      <p>I know everyone is bashing the "neutral" idea. The logo looks like it belongs on the sleeve of a tee shirt...so as a t-shirt company's logo it would be wonderful. Those are meant to be simple.</p>
      <p>I'd say if you are designing it yourself, put yourself into it. Helvetica is a great default font because it is (#1) a GREAT font, lots of history and refining went into this. (#2) it's a sponge. It can be anything, in a sense. SOOOOO MANY companies use Helvetica in their logos. So it's not a bad font per se, but if you get the choice why not play around and explore some other fonts? A logo should speak without you there, especially a band logo I would think.</p>
      <p>I also think a big problem with the logo is the word. I mean Central doesn't shout "band"! Paired with helvetica in a lower caps, gray background, white lettering, overall smooth feeling, I'm thinking coffee shop. I'm not suggesting you change your band name of course, I am just laying that out there on the table as a possible issue to consider.</p>
