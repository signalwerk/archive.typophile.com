      <p>Thanks a lot for the replies.</p>
      <p>I get the same feeling as Nick, that it "wants" to have more going on, but I can't quite put my finger on what that "more" is yet.</p>
      <p>Evan, I spent about six hours on this. I stayed with my original idea of tight, bold lowercase Helvetica but the look went through some changes. I also played around with various "worn" looks, from worn paper to worn cloth before settling on the clean version. Once that was done, I played around with the box around it for quite a while.<br>
      I love design and especially working with type, but I'm a musician and I don't do this for a living, so the gaps in my education have to be filled with a lot of tinkering. I understand that it probably would've taken a designer twenty minutes to go through the process I went through, but I'm slow with this stuff. :) (And paper's not an option. I can't draw my way out of a wet paperbag.)</p>
      <p>By "neutral," I meant that it's not like grunged up blackletter -- you see something like that, you know it's going to have distorted guitars and screeching on it.</p>
      <p>So -- any ideas for some kind of "more" for this, anyone?</p>
      <p>And the kerning's OK then?</p>
