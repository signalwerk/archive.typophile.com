    html: |-
      <p>1.  I think esthetic is spelled aesthetic.</p>
      <p>2.  Why does your band need a logo?</p>
      <p>3.  Not enough space between the "ntr".</p>
      <p>Boring? not quite.  The logo says web2.0, which in turn says corporate target market 18-24, which in turn says conventional.  Of course, I would avoid doing anything else to it.  My take is that logos are not very rock and roll, as they traditionally used to sell stuff to people you haven't met.  Most people like to think of music as a one off gig, a relationship, a two-way thing. Logos say the opposite. They say "I know I can't pick you out of a crowd and even if you spoke back I can't hear you.  This is great when purchasing hemorrhoid cream, not so great when trying to get a band off the ground.  Even INXS needed to start facing the crowds. </p>
      <p>This does not mean that band logos never work.  Radiohead, after Kid A has used the same hand drawn all caps logo in subsequent albums without feeling corporate.  Who can forget Weezer's successful co-option of the Van Halen logo in a clever juxtaposition of indie rock and 80's mega band.  The success stories are few and far between however, for every one radio-heads there are 10 Maroon-5s.</p>
      <p>If what you are going for is an element of subversion, I can see your logo working well.    Especially for un-listenable noise rock.  A kind of "ha-ha we tricked you with our logo" bent.  If that is not the case, I would move away from perfection and introduce some esoteric elements to suggest that you don't care so much about the logo.  It would be far more rock and roll.</p>
