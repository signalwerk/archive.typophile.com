  - id: 591419
    user: 52182
    date: 2014-10-23T10:15:00
    date_raw: 23 Oct 2014 — 10:15am
    votes: null
    html: |-
      <div class="comment-spam-body"><p>I agree with that sentiment. I'm greatly looking forward to it myself.</p>
      <p>Besides, I don't know how the hierarchy between type designers manifest in other countries, but I feel that in the Netherlands we have a long tradition of emulating the masters or working with their theories, for a while, anyway. For example, Gerrit Noordzij's theories are prevalent even if few directly follow his theories and emulate his style.</p>
      <p>"The method of teaching type design at the Royal Academy is still largely based on Noordzij's theoretical model today, as several of his former students are now the professors at the department."</p>
      <p>So it seems to some extent at least the sentiment Hrant is concerned about has always been prevalent, in the Netherlands and quite possibly in other countries as well, though I wouldn't really know. Now I think about it, I want to emerge myself into their world. I've dabbled with type myself for years now and I got some insight from one of Noordzij's students but he never became a type designer, unlike some of the other students. I want to know how to masters see and work with type and in fact I want to perpetuate some of their traditions and values which they learned from their masters. Certainly I will make their theories my own — like I have been doing — but it might even be essential to let them influence you and your work in that one year course.</p>
      <p>I don't usually care for traditions, but in this case I value being able to pass on their wisdom, or at least become very familiar with their philosophy, their work method, their knowledge and their style — if only to do the exact opposite.</p>
      </div>
