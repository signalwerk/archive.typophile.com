    html: <p>Great work shown by all the graduates.  As in many teaching situations, you have to now allow a time for the tea to steep.  It is not unusual for students to unintentionally emulate the work of their professors for a brief time. Let us leave them now to their own personal struggle with their own work to emerge as individual designers.  This is the most exciting time for them, the time to totally steer the ship without their trusted pilot looking over their shoulder. Give them a chance.</p>
