    votes: null
    html: |-
      <div class="comment-spam-body"><p>I think Nina is right to put Hrant down there, but honestly I tend to agree with Hrant's premise—since earlier today, actually. I've always been impressed with the work coming from the KABK media course and in fact I'm planning on getting my degree there when I've finished my BA in graphic design.</p>
      <p>However, today I saw something which gave me the exact feeling Hrant expressed rather clumsily here. I'm actually hesitant to point you to this designer's work though; I'm not sure if it's justified for me to state this person's name, so I will be diplomatic for now and just tell you what I observed.</p>
      <p>A friend of mine pointed me to one of his typefaces, presumably because he admires it. I however couldn't admire it at all as there were simply too many problems, such as characters that are either too condensed or too wide, an S falling backwards and an Y of which the the join was way too low so it was noticeable that the Y was forced into V's metrics, where he just cut off the bottom part of V and attached a stem to it. All of this just told me he has a lot to learn still.<br>
      He had another 3 typefaces with similar problems, one illustrative typeface which was admittedly awesome and then there was a typeface which was still under revision but made during his type course (not at KABK though) and it features no problems at all. Now, you would obviously expect his teachers and classmates to give him the feedback to make his typeface perfect, but what surprised me is the clear difference in quality between his typefaces. The typeface he made during his course was perfect, while his other typefaces excluding the illustrative one are not up to the same standard. This shouldn't be the case. You ought to apply what you learned at school. So perhaps Hrant has a point here. The course seems way too short for some to actually become versed in type design, rather than be guided to one good product and not be able achieve the same quality again.</p>
      <p>This doesn't apply to people like Nina, I think. I've over 4 years experience with type design now and I have a lot to learn still, but for me this short course would be ideal I think because I have the experience to fully grasp what I will learn there and I will be in the perfect environment to get feedback and learn and breathe type with like-minded people. Probably this environment will aid in polishing up your designs, which Hrant apparently has clear concerns about. I feel it's not a problem at all as long as you can apply what you learned during the course. What I observed on the aforementioned designer's portfolio does concern me a bit though, but as I said I have no worries of this happening to me.</p>
      <p>Nina, I assumed you already had a degree in typography. It's a bit unfortunate you just graduated. I don't know you, but it would be fun to do a course with people I'm already familiar with on Typophile and whose work I admire. However, having seen the typefaces coming from the KABK course in recent years, I'm sure the appreciation part is going to manifest either way. What did you think of the course?</p>
      </div>
