      <p>The 1923 <em>Manual of Linotype Typography</em> featured early 20th century historicist design alluding to speciﬁc earlier eras, demonstrating how typeface, ornament and layout work together to create a cohesive style.</p>
      <p>Download the PDF:<br>
      <a href="http://vitor.io/its-a-gift-never-lend-books#mergenthaler" title="http://vitor.io/its-a-gift-never-lend-books#mergenthaler">http://vitor.io/its-a-gift-never-lend-books#mergenthaler</a></p>
      <p>Better yet, buy your own copy for less than $100.<br>
