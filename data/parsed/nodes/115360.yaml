    <p>I saw the font "Extrafette Bernhard Fraktur 2013" here: </p>
    <p><a href="http://sugarscroll.de/all/work/rekonstruiert/attachment/rekonstruiert_1/" title="http://sugarscroll.de/all/work/rekonstruiert/attachment/rekonstruiert_1/">http://sugarscroll.de/all/work/rekonstruiert/attachment/rekonstruiert_1/</a></p>
    <p>Here is the full alphabet:</p>
    <p><a href="http://luc.devroye.org/ChristophSchwedhelm--ExtrafetteBernhardFraktur-2013--after-LucianBernhard-1921.png" title="http://luc.devroye.org/ChristophSchwedhelm--ExtrafetteBernhardFraktur-2013--after-LucianBernhard-1921.png">http://luc.devroye.org/ChristophSchwedhelm--ExtrafetteBernhardFraktur-20...</a></p>
    <p>It is based on the font "Extra Fette Bernhard Fraktur 1912" (Source: <a href="http://luc.devroye.org/fonts-27018.html" title="http://luc.devroye.org/fonts-27018.html">http://luc.devroye.org/fonts-27018.html</a>).</p>
    <p>The font was revived in 2013 by Christoph Schwedhelm, who renamed it "Extrafette Bernhard Fraktur 2013. </p>
    <p>He used it in his book on frakturs titled "Rekonstruiert" - the first image in this message is the front cover:</p>
    <p><a href="http://buchlabor.net/de/buchdarstellung/rekonstruiert#" title="http://buchlabor.net/de/buchdarstellung/rekonstruiert#">http://buchlabor.net/de/buchdarstellung/rekonstruiert#</a></p>
    <p>My question is:</p>
    <p>Can anyone help me find "Extrafette Bernhard Fraktur 2013" - or a font which resembles is very, very similar?</p>
    <p>Thanks a lot for any help!</p>
