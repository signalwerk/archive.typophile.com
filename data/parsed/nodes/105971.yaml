    <p>I'm pretty much sure that in at least one regard we are all the same. No matter what. And that regard is an ongoing questioning/expression to/of a  higher power ... a.k.a. GOD. </p>
    <p>I thought I'd offer up a means by which we all (as in the whole world at large) could express what we think/believe/know what GOD is ... so I created a little something called ...The GOD is Project.</p>
    <p>It's pretty simple really, not much more than one page website. A site where visitors can state a comment as to what to them GOD is by typing in text and then clicking the Publish button.  The best way for me to explain/demonstrate what I'm trying to say is by this gif...</p>
    <p><img src="http://www.graphicdeclaration.com/images/TheGodIsProject_FS_2.gif"></p>
    <p>...albeit scaled down from this full page gif: </p>
    <p> <a href="http://www.graphicdeclaration.com/images/TheGodIsProject_FS.gif" title="http://www.graphicdeclaration.com/images/TheGodIsProject_FS.gif">http://www.graphicdeclaration.com/images/TheGodIsProject_FS.gif</a></p>
    <p>The gif shows a quick look see at the page blank, the page with cursor hover-over ABOUT, and the page with cursor hover-over ARCHIVES. If my code genius guy gets it all done asap, the website The GOD is Project dot com will be upped in few weeks coming!</p>
    <p>Do you think the typeface is appropriate for this project? And, what are your impressions of the site's appearance and the project in general?</p>
    <p>Thanks in advance.</p>
