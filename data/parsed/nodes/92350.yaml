      <p>I hope you Typophiles will review my new document and tell me what you like and what you don't. What works? What's confusing? What's inelegant or clunky?</p>
      <p>I'll appreciate whatever feedback you provide.</p>
      <p>Thanks again,<br>
      Zack</p>
