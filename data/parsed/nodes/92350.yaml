    <p>Hi everyone!</p>
    <p>I've lurked here for years but I think this will be my first post. </p>
    <p>I'm a lawyer and I'm about to start a new job search. </p>
    <p>I searched the Typophile archives for inspiration. A lot of the discussion seems to deal with résumés for designer types, but I suspect a lawyer's résumé ought to be a bit different.</p>
    <p>The book Typography for Lawyers by Matthew Butterick has had a profound influence on my work in general. In drafting this new version of my CV, I've taken a lot of his advice. Butterick includes a sample résumé in his book, but I've tried to avoid using that as a template. Instead of just aping the ideas of the leading law typography guru, I want to come up with something fresh.</p>
    <p>At the same time, I think it's important that my CV not be over-designed. I want the document to look professional--even elegant--but definitely not arty. This CV will be reviewed by people who are accustomed to working with lawyers, and I want it to stand out for the right reasons.</p>
    <p>If you have any thoughts about my type design choices or about the substance of the CV, I'll appreciate hearing them.</p>
    <p>Thanks,<br>
    Zack</p>
