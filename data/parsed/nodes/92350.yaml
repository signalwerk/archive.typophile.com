      <p>I don't know anything about legal resumes, but I'd avoid having bullet text (or any text) run the full width as you do now. You could try a format of 2 columns of equal width (similar to the 2-column bullet list in the "additional coursework" section), or you could try a narrow left column (perhaps about 1/3 the available width) holding the subheads and a wider right column (around 2/3 the width) holding the text.</p>
      <p>Should the resume have a photo? If so you could make the main head flush left (which would be more in keeping with the overall layout than the current center alignment) and put your photo to the right of it.</p>
