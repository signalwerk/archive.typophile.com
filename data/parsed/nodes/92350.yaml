      <p>Thanks for your thoughtful advice, TurtleType. I've made changes based on your ideas.</p>
      <p>I started using Sabon after Butterick recommended it for lawyers on his website a few years ago. It looks great for some papers I might file in court, but now I think it's wrong for my CV. Sabon has gravitas--it's elegant and graceful and traditional and all that. But the most important feature of the typeface I use for my CV has to be legibility. I wouldn't pick Sabon for a road atlas or for subway graphics. I don't think I want it in my CV anymore.</p>
      <p>I'm not sure why I chose Gotham. I guess it's because I notice it on movie billboards all the time. But that feels like the wrong reason to use it in my CV. </p>
      <p>So now I've switched everything to Absara Sans. I think the effect is kind of profound. What do you think of Version 3? Again, I'm focusing on the design issues and not so much on the substance yet.</p>
