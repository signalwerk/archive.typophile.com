      <p>On page 1 you're using hanging indents, but in "Other Work Experience" on page 2 you aren't. I'd be consistent with your paragraph styles.</p>
      <p>Maybe this is just personal taste but to me all the hanging indents give it a busy look. I'd suggest experimenting with some alternatives like making the paragraphs flush left (maybe add slightly more space between paragraphs; get it by reducing leading very slightly), or maybe use bullets instead. </p>
      <p>Also you might try bumping up the size of your main heads (like Core Professional Experience) slightly.</p>
