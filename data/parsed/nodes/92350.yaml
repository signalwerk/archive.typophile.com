    html: |-
      <p>Hi everyone. Since I started this thread two months ago, I've been slowly working on my résumé. I've just posted two new versions of it here.</p>
      <p>In trying to fit this thing on a single page, I took out a lot of nonessential information. I know many people insist it's better to use more pages rather than cram too much on one page. But I have some good reasons to make my CV a one-page document.</p>
      <p>I think I've come up with a sensible layout. Now I'm trying to decide whether to use a serif font (Sabon Next) or sans serif font (Whitney). Both fonts are set at 10.5 pt with 14.5 pt line spacing and very wide margins on letter size paper.</p>
      <p>Sabon Next is elegant and traditional, lawyerly and easy to read. But I still have a lot of text and I'm worried Sabon will make the document too busy, even at 10.5 pt.</p>
      <p>A while ago, I had a fantasy of setting the whole thing in Absara Sans, but some friends persuaded me that Absara is too informal. Whitney is a great alternative. Somehow it's more formal than Absara without feeling impersonal. </p>
      <p>But is Whitney too spare and modern? One person who saw my CV set in Whitney said it looked too daring, too different. He also said lawyers shouldn't use sans serif fonts, except maybe for headings. He's pretty old and his sense of style is different from mine, but guys like him are probably part of my target audience. </p>
      <p>Looking at the two documents side-by-side, I think the Sabon version is warmer. It's old fashioned in the right way. But the Whitney version is definitely more legible for me at this size.</p>
      <p>You experts gave me lots of valuable criticism in April. Now I'm back again to see what you think. Which font do you prefer? Any advice on my layout? I'll appreciate getting whatever feedback you care to offer.</p>
      <p>Thanks!</p>
