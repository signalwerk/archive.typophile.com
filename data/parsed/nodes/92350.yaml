      <p>I'm not an attorney, but I'd think that while they might like small print in contracts, they wouldn't even read a resumé that needed a magnifying glass. My initial impression was that it was too small, probably reduced in order to fit everything into two pages.  Can't tell exactly what font you used, or in what size, since it's not embedded. If you're submitting your resume as a pdf, I'd strongly recommend that you either embed all fonts used or convert to outlines. In that way it can be enlarged at will without displaying the jaggies.</p>
      <p>As far as content is concerned, when I was reviewing resumés I looked for activites that pertain to the positions I had available. I also looked for signs of success. Phrases like "involved with" or "worked on" don't carry as much impact as phrases such as "which led to obtaining a $40 million contract" or "as a result of which I was named Senior Partner".  People who tailor their CV to the company and position they're interested in have a better chance of getting that personal interview (which is just about the ONLY thing a resumé is good for).</p>
      <p> - Herb</p>
