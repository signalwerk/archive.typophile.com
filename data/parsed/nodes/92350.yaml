      <p>Good effort. A few suggestions:</p>
      <p>Reconsider the relative visual importance of the headings vs. the body text. Right now, the headings look more like captions. After your name, those headings should be the most prominent features of the page. People reading your résumé want to establish a few facts quickly —&nbsp;did he go to good schools? Has he been employed at good firms? Make it easy to figure that out. Also, to that end, I would start the name of your employers &amp; schools on the left edge.</p>
      <p>The hanging indents don’t add anything. If you need to make paragraphs more distinct, reduce the line spacing of the body text and increase the space between them. (I notice that the lines in each column align vertically, which is a nice detail)</p>
      <p>Don’t bury the lead. I'm not a fan of bland “objective statements” like “Looking for a dynamic, challenging position driving outcomes for clients.” Still, it’s never a bad idea to summarize who you are and what you want, because you have about three seconds before the hiring partner moves to the next résumé in the stack. So if you’re selling yourself to a particular firm as an experienced FDIC ligitator, why not just say "Zachary Brown | Experienced FDIC Ligitator"? Don't assume that anyone will read the content and reach that conclusion.</p>
      <p>Finally, as pointed out above, when you use OpenType fonts with Word’s built-in PDF generator, they get rasterized. This is bad, because it makes your file large, and it makes it display poorly on screen &amp; printed. Solution: use a dedicated PDF print driver, like the one included with Adobe Acrobat, or one of the many third-party options that are cheaper.</p>
