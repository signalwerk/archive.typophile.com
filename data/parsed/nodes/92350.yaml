      <p>"How can I make sure I'm embedding the fonts correctly? "</p>
      <p>I'm not familiar with Word 2010, but once you figure out how to untie its 'ribbons', this is how it's done in earlier versions:</p>
      <p>Tools / Options / Save<br>
      Click on the box labeled "Embed TrueType Fonts"<br>
      This should also work for OpenType fonts; I'm not sure about Type 1.</p>
      <p>When you generate the PDF, it will inherit the embedded fonts as well.</p>
      <p> - Herb</p>
