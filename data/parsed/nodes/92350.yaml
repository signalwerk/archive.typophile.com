      <p>It's looking good. I think Gotham is a good choice for san serif, but I feel it conflicts with your Sabon Next type choice. If you're set on using Sabon Next, <a class="freelinking external" href="http://bonfx.com/" rel="nofollow">Douglas Bonneville</a> has a book/pdf on type combinations. He suggests pairing Sabon with either Franklin Gothic, Helvetica, Lucida Sans, Monotype Grotesque, Myriad, Stone, Trade Gothic, or Univers. I don't think it's the end all but it's a start. </p>
      <p>It's a design faux pas to put more than two type choices (usually a serif and a san serif) in a layout unless, of course, you have a good reason. I don't know why you put Caspari in the body text, but it has a nice authoritative feel (just as long as you increase the line spacing AKA leading).  Type combinations seem to be one of the hardest to learn for a designer. </p>
      <p>I'm not sure how much control you have in Word, but you need to align the baselines  between the two columns, that will help tighten up the layout. </p>
      <p>Also, think about the heading/pinline/sub-heading areas. Try flipping the lighter for the heavier weight and vise versa. Basically, you need to think where you want your eyes to go first, second, third, and act accordingly by increasing/decreasing the weight, point-size, indents, spacing etc. </p>
      <p>If you have time find a copy of Robin Williams <a class="freelinking external" href="http://www.amazon.com/s/ref=nb_sb_ss_i_0_7?url=search-alias%3Daps&amp;field-keywords=the+non+designers+design+book&amp;sprefix=the+non%2Caps%2C780" rel="nofollow">The Non-Designer's Design Book</a> it's one of my favorite books for providing a clear, accessible, run down of layout principles.</p>
