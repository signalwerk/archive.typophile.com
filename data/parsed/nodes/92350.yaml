      <p>Hey everyone!</p>
      <p>I've experimented with your suggestions on how to improve my CV. Now I'm back to see what you think of my revisions.</p>
      <p>In this new version, I've tried to make better use of columns and I've taken out the bullets in response to your suggestions. I can't figure out how to attach the new version down here in this part of the thread--instead the attachment is next to the original attachment up at the start of the thread.</p>
      <p>Right now the actual content is not exactly what will go in the final version--especially on the first page. The content is similar to what I think will go in the final version in terms of number of words per sentence and number of sentences. But please understand that the first page still has some filler text just to make it easier for you to evaluate the document design.</p>
      <p>I think I figured out how to use Word to embed my fonts in my PDF correctly. In case the PDF doesn't say it clearly, I'm using different weights of Gotham for my headings.</p>
      <p>The serif type that I'm using is SabonNext at 11pt. In some places, I've experimented with SabonNext's true small caps and with old style figures, as some of you advocated.</p>
