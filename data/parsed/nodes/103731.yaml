    html: '<p>Reminds me of <a class="freelinking external" href="http://e-daylight.jp/design/fonts/type/o/othello.html" rel="nofollow">Othello</a> by Morris Fueller Benton. Main difference is the /L. Some of its modern interpretation: <a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/dohrma" rel="nofollow">Dhorma</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/reserves/velvet" rel="nofollow">Velvet</a></p>'
