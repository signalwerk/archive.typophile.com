    html: |-
      <p>@ SuperUltraFabulous: Good call on checking the true PDF cover.</p>
      <p>TIP: If you open it in Acrobat Pro and use the ’Touchup Text Tool’ and highlight the type and right-click and get ’properties’ it will tell you the font, font-size, horz scaling, color, etc.<br>
      </p><div class="imageWrap"><img src="/files/tungsten_5752.jpg"></div><p></p>
      <p>In this case:</p>
      <p>THE = HobokenHigh-SemiSans<br>
      NEW RULES = Tungsten-Semibold</p>
      <p>FOR = HobokenHigh-SemiSans<br>
      DIGITAL GENTLEMEN = Tungsten-Medium</p>
      <p>AND OTHER = HobokenHigh-SemiSans<br>
      HIGHLY EVOLVED HUMANS = Tungsten-Medium</p>
      <p>HOW TO AVOID thru BRAD PITT = Tungsten-Medium</p>
