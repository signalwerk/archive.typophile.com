    html: <p>&gt; <i>I'm curious to see it, but it just loads some Snapfish logo</i> <br>&gt; <i>when I view it with Safari or IE on Mac OS X.</i> <br> <br>Same thing happens using IE under Mac OS 9. I don't even see the Snapfish logo using Mozilla or Netscape 7. There doesn't seem to be any platform specific issues indicated in the help section of the <a href="http://www.snapfish.com/helpindex/t_=0">Snapfish</a> site. <br> <br>The only thing I can find is this note regarding <a href="http://www.snapfish.com/helpviewing#friend">Viewing a Friend's Photos</a> - apparently you may have to be signed up for a Snapfish account to be able to view images hosted on the Snapfish site. <br> <br>The heck if I'm going to do that. <br> <br>Shana, could you just post a GIF or JPEG please?</p>
