    html: <p>I like it. Don't let the lack of constructive response on this board get you down. <br> <br>One suggestion. It looks as if the face's irregularities are one of its most interesting features. Have fun with that and take chances! There are a million and one boring serif fonts, and yet people continue to crank them out. Take a chance and make yours unique.</p>
