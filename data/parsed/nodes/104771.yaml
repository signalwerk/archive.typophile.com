    html: |-
      <div class="comment-spam-body"><p>News about this lettering.<br>
      It's a trademark for "Alessandro Vitalle" in the form of  "the wording Alessandro Vitalle in a stylized form" by A &amp; V Casting Inc. in New York, NY, 10018. Filed in the category jewelery products, on  July 02, 2013, serial number 86000442.<br>
      USPTO source:<br>
      <a href="http://tsdr.uspto.gov/#caseNumber=86000442&amp;caseType=SERIAL_NO&amp;searchType=documentSearch" title="http://tsdr.uspto.gov/#caseNumber=86000442&amp;caseType=SERIAL_NO&amp;searchType=documentSearch">http://tsdr.uspto.gov/#caseNumber=86000442&amp;caseType=SERIAL_NO&amp;searchType...</a><br>
      After a rather full search of possible fonts I have fond nothing that matches these letters.<br>
      I conclude that there is no font that matches the "Alessandro Vitalle" logo/wordmark and that it is lettering designed to create a corporate identity in the jewelery products industry.<br>
      Don</p>
      </div>
