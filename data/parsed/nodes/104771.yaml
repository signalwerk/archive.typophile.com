      <p>A rounded easy to read script with almost no variation in contrast. There are quite a few that resemble your sample, but I have not found an exact match. Ryuk's list has some good alternatives. An early script in this genre is <a href="//www.myfonts.com/fonts/mti/monoline-script-mt/" rel="nofollow">Monoline Script MT</a> from 1933. The flavor of your sample seems to match a font by Mark Simonson based on an old movie title. It's called <a href="http://www.marksimonson.com/fonts/view/lakeside/" rel="nofollow">Lakeside</a>.<br>
      Don</p>
