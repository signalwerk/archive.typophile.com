      <p>&gt;I quite don’t understand how devising type is possible at all, without this.</p>
      <p>As explained in 'Printers Type in the 20th Century' Knuth's 'metafont' effort to define fonts in terms of a line plus rules for expansion was a failure, and the approach of directly designing outlines has succeeded.</p>
      <p>Though type has an 'underlying force' of the pen in it, to quote van Krimpen, almost all roman typefaces from Jenson on cannot be written with a pen. Something approximating them can be, but the departure from the pen is critical to type, in particular to achieving the even color that improves readability over handwriting.   </p>
      <p>For these reasons, perhaps, my impression is that most type designers do not start with lines, but rather with outlines, and then 'sculpt' these until they are satisfied with them. I don't mean to say that there is anything wrong with starting with lines, but it is not necessary, and later the sculpting process I think is critical.</p>
