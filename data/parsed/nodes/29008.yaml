      <p>Right. Now you're at the core of what I am aiming at.</p>
      <p>It's not because Southall says so (that METAFONT was a failure—to him), that this is sacred truth. His book devotes only eighteen pages to professor Knuth's (and Hermann Zapf's) endeavours, whereas Knuth wrote four volumes. Moreover, the relevant chapter (18) is very incomplete and vague, apart from the fact that it is by far outdated and doesn't mention recent research. Southall deemed type design by computer programming to be a failure, already back in 1985, in an embryonic Stanford report.</p>
      <p>Things have changed ever since. At the moment a Polish group of programmers is successfully working on the next-generation metafont, using the vector based (PostScript) METAPOST, so as to render Type 1 fonts, rather than Knuth's original bitmap fonts. There are other ventures too.</p>
      <p>I strongly support the idea of parameterisable, programmed fonts. Much contrary to the perhaps prevailing practice of tediously sculpting outlines. This is archaic and certainly will not last.</p>
      <p>I do not claim that the stroke of the pen is of primordial importance to type. In fact, I disagree with Knuth's approach of using the pen as a modifier for the glyph shapes. I am no supporter of all too calligraphic/chirographic type. But because contrast, the relation from thick to thin strokes, is directly deducted from the pen (either broad nib or split pen), it remains crucial. Likely some optical and other modifications will have to be devised by the type designer still, but he would benefit enormously if his skeleton strokes would be shaped by a virtual pen, of which he could alter the parameters, in advance.</p>
