      <p>William — Though you're viewing my device at a very small scale/resolution, on screen, you're quite right about its fallacies (balance, colour). But we programmed (!) it a few months ago, during our first tray-outs with METAFONT. It was clear from the start that METAFONT is unpractical (e.g. by lack of a proper GUI, you have to rely on the good old command line) and that its concepts are inefficient to design type properly. I am looking forward to learn more about MetaType1 (the Polish project I mentioned), which uses other concepts.</p>
      <p>The optical corrections you are rehearsing, can be programmed as well. The "rules of the eye" sure are governed by logic; we do not perceive things randomly. If we can analyse this logic, we can program it. I guess the translation and expansion of a moving front (an elliptic pen or yet something different), determining the transitions from thick to thin, is only part of that, while our perception of what good letter shapes are to be, has become used to those.</p>
      <p>ChrisL — The fact that drawing the skeleton is the "easiest and fastest part of the job" implicitly proves my point. Why should we do that over and over again? Apart from probably lots of alternate shapes per character, these skeletons are an unchangeable given (e.g. an uppercase E ought to consist out of one vertical stem, with three cross bars on its right side). They build the core of each and every typeface and are the sole reason why we can read and recognise glyphs, whatever the outer shapes in which they are dressed. Now, couldn't we just build a library of skeletons (some sort of extended Unicode), feed those to a type processor and extract out of it, according to the style parameters of our choice, the typeface we want, just on the fly?</p>
      <p>Yes, perhaps programming it all is more complex than just going ahead and sculpting. Time and again. But once this huge task has been done, type design will be a piece of cake. No more laboriously sculpting contour curves. I agree that there is no need for mass production. But then again, the volume is quite big already—which Bodoni am I to use? However, once one decided to go with one particular face, then it becomes clear that there is not enough: no opticals at each and every instance of possible sizes, no Cyrillics or IPA in the glyph palette and so on. And then there is the x-height that I need to be a little larger for this particular job, and the descenders in the bottom line have to be just a bit longer. Just change the value of the proper parameters, and there I am, with the exact font I needed, complete with all those hundreds of glyphs.</p>
      <p>Now back to sculpting. I am progressing too slowly.<br>
      Adam — FontLab "Expand Strokes": really no workaround?</p>
