      <p>Chris, I agree with you about the article; I think it is one of the best expositions of G. Noordzij's views. </p>
      <p>Ludwig, in light of Adam's posting, I think the most that could be hoped for, in light of our weak understanding of the visual logic of type design, is that the 'spine and parametric expansion' approach could give us additional ways of sculpting letters. As you point out, now there are now such tools as interpolation, multiple masters, etc. A tool that would define a spine for a character, or take an indicated one, and then enable manipulation of the expansion rotation, etc of the front for each letter, under the control of the designer, might be helpful.</p>
    html_clean: |-
