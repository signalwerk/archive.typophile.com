      <p>The part of type design which you refer to--making the skeleton--is the easiest and fastest part of the job.  The "some degree of sculpting" is what takes the time in drawing the outlines. Type design as a mass-production effort seems pointless to me.  There just isn't the need for that much volume. That is not to say that you should not pursue your idea.  By all means, do it. But "devising type without this" is certainly possible as well as desirable, unless we want to bury ourselves in only the archaic practice of the broad-nibbed pen. This is not the time to shut out non chirographic possibilities, but the time to embrace them. We should be at least as open to non-calligraphic forms as we are to your theory. It is clearly possible to design type either way and there is no point in building a fence around perceived methods of today and yesterday. There just might be something better out there. My guess would be that scratching in the dirt with a stick may have been the first writing method.  We did not stop at the dictates of the stick in mud then, why should we stop at the dictates of the broad-pen on paper now?</p>
      <p>ChrisL</p>
