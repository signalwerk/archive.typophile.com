      <p>Adam — I plan to go to the EuroTeX 2007 conference in Bachotek, Poland. Jackowski and Nowacki will have a talk there. I look forward to meet them and learn more about the concepts behind MetaType1. Do you think they welcome an exchange of thoughts on this topic?</p>
      <p>&gt; they had to admit that it was too difficult for them to come up with parameters<br>
      &gt; that could effectively describe both the regular and the bold in a pleasant way.</p>
      <p>I have no clue on which parameters they are using, neither on the method they use to draw the outlines. I can't really figure out either, reading their articles. (Did they publish something recently?) But judging form your description, to me, it looks the approach is erroneous. Regular and bold can't be expressed by the same parameters, precisely because the bold weight should be a function of a set of parameters that differs from the regular weight. It seems as if they are describing each singular glyph in a parametric way, very much like Knuth 'drew' each glyph separately (in particular the s), rather than really parameterising the concept of a typeface as a whole. Also, I don't expect the program to generate exactly the same shapes in the bold weight, starting from the regular, as those that are in the designs of the original. Revivals, I guess, can't be programmed, simply because the original designer likely wasn't consequent with his own design parameters.</p>
