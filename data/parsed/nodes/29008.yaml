      <p>Ludwig, </p>
      <p>unfortunately, to me, the MetaType1 project by my good friends Janusz Nowacki and Boguslaw Jackowski is a perfect confirmation of Southall's assertions. Nowacki and Jackowski attempted to revive Adam Poltawski's pre-WWII Polish "Antykwa Poltawskiego" typeface using a parametric approach. IMHO, they failed massively, and ended up with a catastrophically hideous bold style which bears no resemblance to Poltawski's original. When I inquired them why the bold is so hideous, they had to admit that it was too difficult for them to come up with parameters that could effectively describe both the regular and the bold in a pleasant way. Nowacki and Jackowski are really smart people, Jackowski a brilliant mathematician and a great mind. I read it as: if they failed (and so has one of the brightest minds alive, Knuth, because Computer Modern is simply hideous) then I think it is sufficient enough of a proof that the concept has massive flaws. </p>
      <p>As for the FLS5 workaround, I can't think of any. But you might want to take a look at the skeletal strokes technology in Microsoft Expression Graphic Designer (<a href="http://www.microsoft.com/products/expression/en/graphic_designer/" title="http://www.microsoft.com/products/expression/en/graphic_designer/">http://www.microsoft.com/products/expression/en/graphic_designer/</a> ). Before the application went to Microsoft, it was quite popular among illustrators (it was known simply as "Expression", and before that, "Fractal Design Expression"). The skeletal strokes are vector-based parametric strokes that you can control using a graphic tablet, and also reuse. You can then export the results as EPS and import them into FontLab Studio. </p>
      <p>I'd be curious to hear of your findings. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
