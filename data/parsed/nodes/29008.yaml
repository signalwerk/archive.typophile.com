      <p>Peter — Thanks a lot for the Parida article. That's one I didn't knew of. Really interesting!</p>
      <p><a href="http://www.nowacki.strefa.pl/" rel="nofollow">These</a>are the Polish researchers I mentioned; there is a Wiki on their project as wel, <a href="//en.wikipedia.org/wiki/METATYPE1" rel="nofollow">here</a>. As you can see, they succeeded in so far that they developed three font families already.</p>
      <p>William, Chris and Goran — The fonts generated by MetaType are offered free of charge to the public. Not much marketing needed, isn't it?</p>
      <p>In the days that Expert Sets were introduced, I guess, there must have been sceptics like you, who laughed at the idea that within a decade they would be abolished by magic OpenType fonts that would carry a vast amount of glyphs, so much that even the fastest processors of the day would become obsolete, added to the inconceivable miracle of automated contextual glyph substitutions.</p>
      <p>Of course I have been exaggerating. I depicted the whole idea as a caricature, since it is very unlikely that we will have such a fully operational piece of software soon. There is yet a long way to go, and in the end, manual editing will be necessary still. But then again, are you, contour sculptors, using Multiple Master technology, interpolations, transformation operators? So, what's the big deal?</p>
