      <p>&gt;If we can analyse this logic, we can program it.</p>
      <p>I have a feeling that you have no idea how difficult it is to analyse and pin down visual logic. </p>
      <p>Even ideal spacing between letters has never been programmed with full success--and that's just one variable. Design of letters is way more complicated. For example, how you are going know visual logic so well as to program how the cross bar on the A should differ in height and thickness from the H? And how it should vary with the width of the A, the contrast, the degree of taper, the style of serifs? That's just one of thousands of decisions, and only a few rules, such as about overshoots--are known--and these can have exceptions and are debatable.</p>
