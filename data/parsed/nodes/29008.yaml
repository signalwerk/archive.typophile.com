      <p>If I read you rightly, think you are conceding to some extent Southall's point, but saying that it is possible to revive the idea in an improved way and make it practical. I am skeptical, but if you and others can make it work, more power to you. </p>
      <p>I am not any authority, but in my opinion the fact that in its formative period type was sculpted rather than written, and continued to be sculpted for 500 years shows in our concept of what good type is. Though I have great admiration for Noordzij, I don't agree with him that punchcutting is irrelevant to understanding letters. </p>
      <p>It is not signs of the tool in old type that is crucial, but rather that by sculpting they were able to violate the rules of the pen in order to produce type that conformed better to the 'rules of the eye' than any handwriting. </p>
      <p>If I remember Southall rightly (I read a library copy), his account was that in order to adjust for optical effects, eg the need to thin strokes at joins--and a hundred others--it became so complex to program the effects that it was more efficient just to sculpt. </p>
      <p>My philosophy is 'let a hundred flowers bloom', so I will be happy if you can make this approach work. But as I say, I am skeptical. </p>
      <p>As an example, to my eyes your printer's device does not look satisfactory from a typographic point of view. It lacks balance and good color in my opinion. For instance, for the strokes in a + sign to look balanced the vertical has to be thicker than the horizontal. But in your icon, the vertical cross in the middle has the vertical look considerably thinner. This not only makes the middle weaker, but also goes against the 'logic' of the roman capitals. Of course, I am looking at it on screen, my assessment might be unfair. </p>
      <p>By comparison, at left in my icon is my version of Caslon's italic ampersand in his Pica II type. It looks very pen drawn, but I doubt very much if you could draw it with one pen moving continuously, even with complex rotations. Of course with the combination of any mathematically possible rotation and expansion of a moving front you can describe any closed two dimensional shape. But when it gets so complex, it seems that programming it is much more trouble than just drawing it. The key problem is that the 'rules of the eye' as regards color and balance and harmony with other letters are complex and not fully understood. Hence sculpting and looking, and letting the eye be the arbiter still seems to be the most efficient way, as pains-taking and time-consuming as it is. </p>
      <p>The ampersand is 90% Caslon (including with Caslon whomever he was imitating!) so I am not claiming a lot of credit, but I do think it looks more satisfactorily typographic than your icon. And this is a reflection of the by then 200 years of punch-cutting letters, with each person drawing on the achievements of his predecessors.</p>
