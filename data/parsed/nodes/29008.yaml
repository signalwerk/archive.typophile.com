    <p>FontLab has a feature called "Expand Strokes" which simulates the movement of a calligraphic pen (brush) over a given curve (path). The prime parameters are restricted to the pen's width, its angle and thickness (which FL calls "Roundness"); and then there are "Join", "Cap" and "Body".</p>
    <p>One important parameter is missing, though. Namely the relative position of the pen (brush) on/along (!) the path. By default that position is the centre of the brush (both Width and Roundness, I guess). Not so in FontLab's "Make Parallel Path", where you have three options ("Relative Position"): Left, Right, Both. The latter equals the default setting of the "Expand Strokes" feature.</p>
    <p>Now, suppose you draw a curve which has to be the outer (Right) contour of a shape. Along this path you want a parallel path, not a linear one (parallel in the strict sense), but one according to the parameters of a given pen (width, angle and thickness).</p>
    <p>The "Make Parallel Path" feature won't do the trick, because you can't set the pen's parameters. The "Expand Strokes" feature will neither, because you cannot set the relative position of the pen (brush).</p>
    <p>I am looking for a workaround. I use FontLab 4.6.0 demo version. I looked into the User's Manual for FontLab Studio 5 and there is no change.</p>
