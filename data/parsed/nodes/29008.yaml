      <p>[Ludwig] "the right algorithm for it"</p>
      <p>I wonder if the Vinyas code would be of help. It's an old software and I don't have a copy. Not sure if it still exists. But Vinyas implements (I believe) "Type A.3" of Laxima Parida's 'Sweep Rule Variations', shown <a href="http://www.enneson.com/public_downloads/pe/typophile/trans_expansion_rot.pdf" rel="nofollow">here</a> along side of Gerrit Noordzij's triad of translation, rotation and expansion; and described <a href="http://www.enneson.com/public_downloads/pe/typophile/laxima_parida.pdf" rel="nofollow">here</a>. I think Type A.3 is the one you're after. (There are other nice ones too.)</p>
      <p>But, in line with Bill and Chris's comments, read the cautionary notes on the final page of Noordzij's 1991 RIDT contribution <em>The Shape of the Stroke</em> available (by me) <a href="http://www.enneson.com/public_downloads/pe/typophile/gn_ridt_1991.pdf" rel="nofollow">here</a>.</p>
      <p>Peter Enneson</p>
