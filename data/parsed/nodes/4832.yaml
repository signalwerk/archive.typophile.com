    html: "<p><i> On a personal note, I also think that the labyrinth was a metaphor for life, getting through it without getting lost and that.</i> <br> <br>There are two kinds of labyrinth: the classic maze in which one can get lost and the form often found on the floor in mediaeval cathedrals. The purpose of the latter is clearly symbolic or metaphorical: the design looks complex and like something in which one might get lost, but in fact there is only a single path through all the twists and turns, arriving at a single destination, the centre, symbolising the path of the soul through the distractions of life to rest in Christ. <br> <br>By the way, there is no evidence that people walked these labyrinths in the Middle Ages: their role was symbolic and decorative. You didn't need to walk the labyrinth in order to understand what it meant: you just had to look at it.</p>"
    html_clean: "<p><i> On a personal note, I also think that the labyrinth was a metaphor for life, getting through it without getting lost and that.</i> <br> <br>There are two kinds of labyrinth: the classic maze in which one can get lost and the form often found on the floor in mediaeval cathedrals. The purpose of the latter is clearly symbolic or metaphorical: the design looks complex and like something in which one might get lost, but in fact there is only a single path through all the twists and turns, arriving at a single destination, the centre, symbolising the path of the soul through the distractions of life to rest in Christ. <br> <br>By the way, there is no evidence that people walked these labyrinths in the Middle Ages: their role was symbolic and decorative. You didn't need to walk the labyrinth in order to understand what it meant: you just had to look at it.</p>"
