    html: <p>You probably all know this but the Swaatika was widely used in Europe before the Nazis adopted it, If you're in Copenhagen, go see the Carlsberg brewery with two giant stone elephants with huge swastikas on their flanks. Opposite the house I live in there's an early 1900s building decorated with all sorts of swastikas, It's sort of strange that these haven't been painted over. An annoying twist to this is that this building (and my home) is halfway between the city center and the stadium, so every other Sunday Neonazi soccerfans walk by, saluting these pre-3rd Reich swastikas.</p>
