    html: <p>When I looked at the image I saw a knot and four pre-Colombian-type figures.  <br>As I remember Daedalus designed Minos' Labyrinth on Crete based on floor plans in the Palace at Knossos. A true labyrinth, as opposed to a maze, does not have false trails, basically a long walk in 7 (and later more) decreasing circles. What tickles me most about labyrinths is the link between a ball of wool and a clue. <br>This site is very interesting <a href="http://www.labyrinthos.net/f_homepage.htm" target="_blank">http://www.labyrinthos.net/f_homepage.htm</a> it debunks some claims for early labyrinths <br> <br>I had a quick search and came up with some information on finnish swastikas - I double checked it as far as possible but I cannot say it is accurate.  <br>The Finnish blue swastika was originally the symbol of luck of the family of Count von Rosen, who donated to the Finnish "White Army" it's first plane, in 1918, during the War of Independence.  <br> <br>It was adopted as the official national marking of the Finnish Air Forces and later on, the Army. Only after the Nazis adopted it as their emblem did it acquire political significance. In other words, the Finnish swastika had nothing to do with the Nazi party, Nazi ideology or fascism in general.  <br> <br>After the fall of the 3rd Reich, the Finnish Defense Forces abandoned the disreputable swastika in favor of the new national marking; the blue and white roundel. <br> <br>Tim <br></p>
    html_clean: <p>When I looked at the image I saw a knot and four pre-Colombian-type figures.  <br>As I remember Daedalus designed Minos' Labyrinth on Crete based on floor plans in the Palace at Knossos. A true labyrinth, as opposed to a maze, does not have false trails, basically a long walk in 7 (and later more) decreasing circles. What tickles me most about labyrinths is the link between a ball of wool and a clue. <br>This site is very interesting <a href="http://www.labyrinthos.net/f_homepage.htm" target="_blank" class="link-external">http://www.labyrinthos.net/f_homepage.htm</a> it debunks some claims for early labyrinths <br> <br>I had a quick search and came up with some information on finnish swastikas - I double checked it as far as possible but I cannot say it is accurate.  <br>The Finnish blue swastika was originally the symbol of luck of the family of Count von Rosen, who donated to the Finnish "White Army" it's first plane, in 1918, during the War of Independence.  <br> <br>It was adopted as the official national marking of the Finnish Air Forces and later on, the Army. Only after the Nazis adopted it as their emblem did it acquire political significance. In other words, the Finnish swastika had nothing to do with the Nazi party, Nazi ideology or fascism in general.  <br> <br>After the fall of the 3rd Reich, the Finnish Defense Forces abandoned the disreputable swastika in favor of the new national marking; the blue and white roundel. <br> <br>Tim <br></p>
