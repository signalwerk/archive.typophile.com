    html: "<p>Thanks, Alessandro, it's an interesting thread. <br>BTW. When I researched that Icelandic symbol, I also found a symbol that people carved in butter to keep it from going bad. <br>John: I was speaking of the ones the vikings used, but I was probably a bit vague. You're right about the two kinds! that thought never occured to me. The viking ones were of the single-path kind so my labyritnh-as-life theory doesn't really hold up. I'm not a 100%, but I read somewhere that people 'danced the labyrinth'. (Again: the vikings, slightly pre-medieval times. (In Scandnavian terms.)) These labyrinths were also circular and the dancers started in the middle. These dances could take quite a while. When they finally came out the real party began. <br> <br>Does anyone know when the earliest known labyrinths/mazes appeared?</p>"
