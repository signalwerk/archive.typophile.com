  html: <p>Itself is from "pagan era" meaning from time  <br>before christianity. It was a symbol people used <br>as a protection against evil. By using it in  <br>jewellery or as a symbol carved or drawn on  <br>buildings it protected not only people but  <br>cattle, homes etc. <br> <br>Hannun Vaakuna might have come to Finland from  <br>Germany, that's not 100% sure but very likely.  <br>You may find Hannun vaakuna�s symbols in  <br>medieval churches as well (some symbols etc.  <br>from non-christian era were painted on the walls <br>side by side with christian symbols, one of the  <br>best examples of this "primitive" style is  <br>Marian kirkko (Church of Virgin Mary) in a place <br>called Maaria near Turku; <br> <br>There is so called Jatulin tarha symbol, spiral- <br>like labyrinth figure). Kalevala koru uses  <br>Hannun vaakuna in their jewellery and models for <br>the older types of Kalevala koru are taken from  <br>old jewellery (bronze-age) found in Finland. <br><img src="http://www.typophile.com/forums/messages/30/36224.gif" alt="Kalevala Koru"></p>
