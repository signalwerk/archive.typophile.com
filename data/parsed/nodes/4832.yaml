    html: "<p>Is this a continuation of another thread? I see two symbols on that button or whatever it is, the labyrinth 'swastica' and something behind it. The symbol at the back I saw hundreds of times in Iceland a couple of years back, the first time (that's what got my attention) tattoeed on a girls wrist, I researched it, but I've lost the data, It has eight 'arms' of which you only see four on the button and it's meant to ward of 'abuse of power'. it's a classic in Iceland. on labyrinths: In viking mythology, labyrinths are a cool piece of work because evil spirits are kind of dumb and can't find their way out of a labyrinth, sort of like the same idea with those Japanese gardens with running water and everything. On a personal note, I also think that the labyrinth was a metaphor for life, getting through it without getting lost and that. <br>I don't think the pattern has any relation to the swastika. <br>Sorry if I'm budding in on something. <br></p>"
