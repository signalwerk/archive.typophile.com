    <p>WNY Typo Fest May 8-11<br>
    A celebration of the graphic and typographic arts Featuring the Western New York Premier of Helvetica: A Documentary Film by Gary Hustwit</p>
    <p>May 8 - Tuesday 7pm<br>
    -Buffalo- Pecha Kucha Night<br>
    Featuring a host of Graphic Designers discussing their work, presented by Hallwalls in the basement of The Church â€” 341 Delaware Ave. at Tupper. Gen. Admission - $4. Students - $2. Free for members of: Hallwalls, WNYBAC, AIGA, Brainstorm<br>
    From Wired magazine:</p>
    <p>    “The key to the success of the Pecha Kucha evenings springing up across the world over the last two years — they now exist in around 30 cities, from Bogota to Buffalo — is simplicity. Participants get a six-minute pitch in which they can show 20 slides, and talk for 20 seconds about each one.”</p>
    <p>May 9 - Wednesday 2pm<br>
    -Buffalo- Studio Visit to Paradise Press<br>
    Hand-set metal type Helvetica demo &amp; tour of Paradise Press located at Printing Prep - 12 E. Tupper at Washington St. Free: RSVP required 716 885 4490</p>
    <p>May 9 - Wednesday 7pm<br>
    -Buffalo- Helvetica: A Documentary Film<br>
    w/ Director Q&amp;A. Market Arcade Film &amp; Arts Centre - 639 Main St. Reception following at Hallwalls - 341 Delaware Ave. at Tupper. Gen. Admission - $8. Students - $5. Members of: Hallwalls, WNYBAC, AIGA, Brainstorm - $4.</p>
    <p>May 10 - Thursday 7pm<br>
    -Rochester- RIT Cary Graphic Arts Press<br>
    Dedication of its new Alexander S. Lawson Publishing Center, featuring a glass wall design by Hermann Zapf. 2nd floor, Wallace Library, Rochester Institute of Technology. Free event</p>
    <p>May 11 - Friday<br>
    -Rochester- Helvetica: A Documentary Film with Director Q&amp;A. Rochester Institute of Technology</p>
    <p>    Presented by Hallwalls and WNY Book Arts Collaborative with support from the American Institute of Graphic Arts, Advertising Club of Buffalo,Daemen College Department of Visual &amp; Performing Arts,Veer, Society of Typographic Aficionados, Pecha Kucha Buffalo, P22 type foundry, Swiss Dots, Market Arcade Film &amp; Arts Centre, Dipson Threatres &amp; Printing Prep.</p>
