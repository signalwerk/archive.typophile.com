    <p>Greater Albion has just released ‘Great Bromwich’ at <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/great-bromwich/ " rel="nofollow"> MyFonts.com</a>.</p>
    <p>Great Bromwich takes the ideas in Greater Albion’s Bromwich family that little bit further. It can be used on its own, or as a compliment to Bromwich. Great Bromwich uses specially re-designed large and small capitals, to enable that bold headline statement to be made with impressive Edwardian flair. In the spirit of railway travel posters and illustrated news journals, its a wonderful font for poster design, or for book covers and other work with a period theme.</p>
    <p>There are some examples of ‘Great Bromwich’ in action on its own and alongside the Bromwich family on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
