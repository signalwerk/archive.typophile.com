    <p>Hello.</p>
    <p>First of all I’m new here, so hello to everyone, great forum you have here.</p>
    <p>Now back to the topic. I’m designing a logotype for a company that produces and sells medical devices. We’re gonna have a a new line now tho, and we’re needing a logo for it. This line is called “Pakline” and it’s purpose is to include several products into one pack (eg. Surgical procedure pack). The following are the logotypes we designed so far.</p>
    <p>Any critique would be appreciated, along with some ideas for new concepts.</p>
    <p></p><div class="imageWrap"><img src="/files/logopak_4465.png"></div><p></p>
    <p>Thank you.<br>
    Pedro Peixoto</p>
