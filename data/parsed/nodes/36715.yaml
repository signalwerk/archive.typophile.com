      <p>Hercules/Herkules. The most readily available version is <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/h/herkules.htm" target="_blank" rel="nofollow">Dieter Steffmann's Herkules</a>. The download link says T1, but there's an Opentype font in the download as well.</p>
      <p>It was also available from Opti as Huk Light.</p>
