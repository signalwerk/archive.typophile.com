    html: |-
      <p>Buyfonts.com sells the old Fontbank collection and I think that their ‘Skinny’ is about as legitimate a version as you are going to find.</p>
      <p>Other versions I’ve seen have been Duo Line by Weatherly Systems (WSI) and Twinkie Display by Southern Software SSi). Both were wholesalers of ripoff clone fonts and, at least in SSi’s case, are pretty much out of business because of that. I mention these only because it seems like they had Mac versions of “their” fonts.</p>
      <p>It seems to me, too, that there is font conversion software out there that, for Mac users anway, is free. Another option.</p>
