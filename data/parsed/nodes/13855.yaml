  html: |-
    <p>I have identified this font as “Skin &amp; Bones”, apparently a VGC font designed by Douglas F. Jones. I have not been able to purchase it anywhere. Does anyone have any idea where this font can be purchased. “BuyFonts.com” has it under the name “Skinny” for Windows machines, but I need it for Mac.</p>
