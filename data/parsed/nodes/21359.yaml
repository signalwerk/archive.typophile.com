    <p>Fellow typographers,</p>
    <p>I'm trying to track down a full listing of thai typeface examples (to purchase), and also if there is a translation tool that is also available.</p>
    <p>I have travelled to Thailand (more than once), and think the typefaces are very lyrical, and some, beautiful.</p>
    <p>Thanks in advance!<br>
    J</p>
