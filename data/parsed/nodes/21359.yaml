    html: |-
      <p>On Adobe's behalf I commissioned a four-member family of Thai fonts ("Adobe Thai") a few years back. It ships as a language pack for Acrobat 7.05 and later. I was very pleased with how they turned out - the design was done by Fiona Ross and production by Tiro Typeworks.</p>
      <p>Unfortunately, the Acrobat licensing precludes you from using these fonts with other applications for authoring purposes.</p>
      <p>Cheers,</p>
      <p>T</p>
