    html: <p>Incidentally, I've learned from Gerald Giampa's P22 web site that American Caslon and New Caslon were closely related - American Caslon is stated there to be "the same face with longer ascenders". Actually, as can be seen from the specimen images on <a href="/wiki/https%3A/%252Fwww.p22.com/lanston/giampa/NewCaslon.html" class="freelinking" rel="nofollow">that site</a>, the <em>descenders</em> are (also?) longer for American Caslon.</p>
