      <p>Picas and points are the north American system. I think there is a different French/European system using Didot points and ciceros. I don't know the rules on that.</p>
      <p>Points were developed in the late 19th century, and at the time metric was largely unknown in the Americas. Points were chosen to provide a means of expressing type measurements. Up to that time, type was measured arbitrarily with measurements called agate, pearl, primer, and many more. I think Pica was one of those type sizes and the point worked out to be 1/12 of this.</p>
      <p>Until 1970-80 there was a point that was 72.27 to the inch. Computer programmers didn't like that, and they rounded it to 72 to the inch, which makes it much easier for you to remember. The changeover was hell on typesetters though, as we had to compensate for the difference, which builds up to a third of a line on a full A4 page.</p>
      <p>Now, if you really want to be confused, look up the dimensions for the en and em.</p>
