      <p>Not sure where you read that in Designing With Type but there are 12 points in a Pica and 6 Picas in an inch. Exact measures have changed over time but this is the current standard.</p>
      <p>It's possible you're confusing points (typographic) with pixels (digital) or dots (halftone printing) which are not the same. Both pixels and dots are a variable measure and can contain any number per standard measure (e.g. 300 ppi or 1200 dpi).</p>
