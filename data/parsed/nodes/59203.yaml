      <p>Points and picas are artifacts of an archaic technology, like cubits and furlongs. "Point size" refers not to any measurable dimension of the letters themselves, but to the pieces of metal the letters would be sitting on, if they were sitting on pieces of metal, which they're not.<br>
      Look at this diagram. At the lower right it shows why two alphabets that differ visibly in size can both be called 24-point type.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/type_5489.gif"></div><br>
      When designers had to write specifications to be carried out by typesetters, it was very important to specify point sizes precisely, especially because there often were no intermediate sizes: If 24-point was too big, you had to use 18-point.<br>
      Now that designers do their own typesetting, and can adjust sizes in minuscule increments, you can customize size and spacing any way necessary to make the type look good, read well, and fit the required space. Points and picas are just a way to measure what you did so you can do it that way again.<br>
      <em>Designing with Type</em> is a great book--I used to use it for a course I taught--but it's a revised edition of a book published 38 years ago, and it still assumes its readers have letterpress as a frame of reference. Don't get hung up on the imaginary slab of metal. Just make it look good, read well, and fit.<p></p>
