    html: |-
      <p>Jpad, right on about antibiotics.</p>
      <p>How about?:</p>
      <p>The telegraph - enabled for first time, really, the coordination of distant events &amp; schedules/trains.</p>
      <p>Seaworthy clocks - allowing for rationalized navigation. </p>
      <p>There’s a BBC show that I used to watch, where this guy would take one simple “technology” (something we take for granted and see as rather mundane and obvious), and shows how revolutionary it was and how much it effected history.</p>
      <p>The modern world is such an amazing web of such a myriad of interdependent inventions &amp; discoveries, it’s hard to prioritize them.  Take the discovery of antibiotics - I’ll bet we can name ten prior inventions/discoveries that the discovery of antibiotics depended upon - take away one of them and no antibiotics.</p>
      <p>And that interests me too: what is the difference between a discovery or an invention?  Are all inventions merely discoveries?  Was the airfoil invented - or did we merely discover it in nature?</p>
