      <p>WhatTheFont comes up with these:</p>
      <p>  Poster Bodoni (Bitstream, others)<br>
               doesn't have square cornered counter in the 'D'</p>
      <p> Bodoni SH Ultra and Bodoni SB Ultra (Scangraphics)<br>
              has the counter, but the serifs are different.</p>
      <p> - Herb</p>
