  html: |-
    <p>I know there must be hundreds of variations of the so-called English “fat faces”, but is there a close relative - or perfect match! - to these three letterforms? And yes, the resolution and detail in one of the attached files are unfortunately both lousy.</p>
    <p>The smaller “4AD” file was taken from the official website. The “larger” one seems probably an stylization or maybe an earlier incarnation, as the counters seems to occupy much more space.</p>
    <p>Thanks in advance and have a good day, typophiles!</p>
    <p>:  )</p>
