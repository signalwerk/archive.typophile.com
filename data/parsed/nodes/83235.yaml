    html: |-
      <p>Here's an example:</p>
      <p>"İsa Yasa’yı Yok Etmek İçin Mi Geldi? "</p>
      <p>Notice that the capital "I" can sometimes have a dot above it. Lowercase has both dotted and non-dotted i. I suppose I could do a find and replace for every dotted lowercase "i". But that would change each character in the body text too, and those are showing up fine with the body font. It also replaces the dotted "i" differently by font WEIGHT as well. So when I replace every "i" with Sava Pro Regular, some of them are Sava Pro Light. So I end up doing it manually anyway.</p>
      <p>I was just thinking there might be a way to say "Ok InDesign, I'm working in Turkish today." and it would respond with a friendly "tamam".</p>
