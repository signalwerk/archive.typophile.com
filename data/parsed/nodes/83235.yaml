  html: |-
    <p>I have a challenge with a brochure series I designed awhile ago. It was originally in English, but now the client wishes it to be translated into Turkish. I used Sava Pro for the font. As an all CAPS font, it doesn't show the dotted or non-dotted "i" in Turkish. However, it DOES include a dotted "i" (both CAPITAL and lowercase) in the character map. </p>
    <p>Am I going to need to go to EVERY single dotted and non-dotted "i" and manually change the character? Any advice is greatly appreciated.</p>
    <p>I guess a plan B would be to find a similar font to replace it, but I really don't want to do that.</p>
    <p>thanks-<br>
    paul</p>
