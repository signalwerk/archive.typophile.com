    <p>As stated. Whoever can offer advice, what is the best way of displaying type in a gallery setting. I’ve got a 20 foot span_(10 more than I asked for) , 10 ft high, dead center of senior show, surrounded by fine art. I’d like to emphasize my process. </p>
    <p>Thx</p>
