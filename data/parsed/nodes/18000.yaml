      <p>Somewhere on his site, Erik van Blockland has photos from last years Type [ Media master’s degree student exhibition. Maybe that could give you some ideas? They seem to all plot out large, tall banners showing off their type in various sizes.</p>
      <p>I know someone in Offenbach who filled a room with his thesis typeface. He had a foot high banner running around the room, black, with white type on it. I think it was a continuous text about typography. Then made three foot high blocks, sort like the chips in scrabble. These were all black, each with a white letter on them. They stood in the middle of the room, and spelled out the typeface’s name. Lastly, he had a podium behind these blocks. On that was a book, which described the process behind the typeface’s design.</p>
      <p>I have made posters in the past myself. 6 x DIN A0 (I think). Each was framed, and they hung in two rows of three.</p>
      <p></p><div class="imageWrap"><img src="/web/20080907064622im_/http://typophile.com/files/2004 Rundagang Poster Hanging2.jpg"></div><p></p>
      <p>And then there is <a href="https://web.archive.org/web/20080907064622/http://www.typeoff.de/?p=9">this project of mine</a>. Better  photos from the exhibition are in <a href="https://web.archive.org/web/20080907064622/http://www.typophile.com/node/6868">this Typophile thread</a> (scroll down a little).</p>
    html_clean: |-
