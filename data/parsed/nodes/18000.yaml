      <p>You could also look at using your designs in a practical way, maybe making your space a catalogue or wayfinding system for the rest of the exhibition, I’m thinking of distinguishing the craft from the art. </p>
      <p>Is there an opportunity for an interactive work, a projector, a computer and a keyboard inviting the audience to contribute (criticism, rambling thoughts, probably obscenity etc)? </p>
      <p>Alternatively you could create words/letters on a magnetic medium – kind of huge fridge poetry.</p>
      <p>I’m not entirely sure that this gives you the opportunity to demonstrate your process (in fact I’m not clear what you mean by that).</p>
      <p>Tim</p>
