    html: <p>Check out <a href="https://web.archive.org/web/20080907064622/http://www.theconnection.org/shows/2003/09/20030904_b_main.asp" title="http://www.theconnection.org/shows/2003/09/20030904_b_main.asp">http://www.theconnection.org/shows/2003/09/20030904_b_main.asp</a> and look at View display panels. Also think about matting and framing a few specimens just like a drawing or print. Mat or mount with plenty of space around your work so it is isolated and can be looked at without distractions. If you use 32x40 inch panels five or six in a 20 foot area are enough with space between.</p>
