      <p>&gt; large, tall banners</p>
      <p>Sounds anti-type, even anti-human.<br>
      Portrait format is fine for... portraits, but for<br>
      type especially I suspect the main reason it’s<br>
      prominent is that you don’t (sometimes) have<br>
      to go to two columns to make things readable.</p>
      <p>Horizontality is much better. Like picture a continuous thick line going around the room, at a gentle incline, so that it wraps around repeatedly without a break: people can follow the spiral, sort of becoming part of the motif even.</p>
      <p>hhp</p>
