  html: |-
    <p>We would like to invite you to our new book project "Typoversity."</p>
    <p>"Typoversity" wants to get you an insight into interesting and varied selection<br>
    of projects<br>
    from the university (thesis or semester project). The focus of attention is on<br>
    typography!<br>
    Submission deadline: 15.03.2010</p>
    <p>Attendance / Release is completely free!</p>
    <p>Please send your suggestions in form of visual material (screen-pdf) to mail (at) typoversity.de</p>
    <p>www.typoversity.de</p><div class="imageWrap"><img src="http://typophile.com/files/typoversity_6306.png"></div><p></p>
