      <p><a href="http://www.underconsideration.com/brandnew/archives/miller_high_life_overhaul.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Brand New/Underconsideration</a> article on the 2010 rebranding of Miller High Life. New lettering was performed by Totonto-based famous lettering artist <a href="http://www.ianbrignell.com/miller-high-life-redesign" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ian Brignell</a>.<br>
