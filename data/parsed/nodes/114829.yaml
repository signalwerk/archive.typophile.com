      <p><a class="freelinking external" href="http://www.underconsideration.com/brandnew/archives/miller_high_life_overhaul.php" rel="nofollow">Brand New/Underconsideration</a> article on the 2010 rebranding of Miller High Life. New lettering was performed by Totonto-based famous lettering artist <a class="freelinking external" href="http://www.ianbrignell.com/miller-high-life-redesign" rel="nofollow">Ian Brignell</a>.<br>
      Some more candidates for substitution: Boston Truckstyle, Posada, Flange, Beaufort, Silverado, Goudy Sans (probably my candidate for a customization), Memo, Triplett (almost perfect, my 2nd pick), Elan, Formata, Chipping, Symbol, Hensler 2, Modesto</p>
