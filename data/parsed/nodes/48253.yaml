    <p>I just came up with a special pangram for election time. I challenge anyone who is interested to set the following text in the typeface or faces of their choice and post a PNG or GIF on this thread. The idea is to see which font is best suited for election time prattle. You can go serious if you like but I am hoping for comic relief from the way-too-long barrage of campaign rhetoric that we have been suffering through this year.<br>
    Keep the width of the file to less than 575 pixels to avoid scrolling please. </p>
    <p>Here is the text:</p>
    <p>“Awakened voters quip, botched president big sleazy jerk—fix him!”</p>
    <p>ChrisL</p>
    <p>PS: So as not to leave you hanging, the judges will all be Florida voters over the age of 80 who are named Chad. :-)</p>
