  - id: 591312
    user: 52182
    date: 2014-10-22T19:15:00
    date_raw: 22 Oct 2014 — 7:15pm
    votes: null
    html: |-
      <div class="comment-spam-body"><p>Perhaps I've been over-thinking things. I tried many things for the /yp combination particularly, but in the end I merely blended the serifs horizontally and I think it works. At the size the logo would be presented online you wouldn't see the ugliness of the letter combination as I had it before anyway, but I felt it required a solution anyway. I'm also more or less happy with how the other characters turned out.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Silvertype logotype p4_5935.jpg"></div><p></p>
      <p>I tried the cube idea for the tittle; I tried several things but none of them worked. Right now I have a symmetrical diamond shape which I feel does work, though I actually might switch back to a semi-circle later. I just don't know. I'm working with two considerations regarding the shape of the tittle. The first is to emulate the ball terminal in /r, and the other is to make the tittle fit with the sharpness of the other letter forms. I'm combining sharp with rounded, so I don't know exactly which direction works best for certain details. The tail of /y could be a bit sharper as well, possibly.</p>
      <p>As for /ty, the ligature is growing on me but I feel the bar of /t is too heavy for this letter combination. I already made it thinner and I feel it forces me to make the left side of /t thinner as well, which is not ideal as it should be a bit thicker than the top serifs of the other letter forms. Initially I tried to shorten the bar of /t but it looked ridiculous; in order to bring /y close enough I was forced to reduce the bar by way too much, so a ligature seems to be the only solution.</p>
      <p>General criticism is still very welcome.</p>
      </div>
