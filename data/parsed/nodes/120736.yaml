      <p>Ohh certainly. Actually I'm fascinated by the occult, but more so for its richness of concepts. I often look into the Book of Revelations, Qabalah or Jewish mysticism for inspiration when I do illustration work for specific clients. However, I'm too rational to indulge into rituals or naive thinking about spirituality so I rather not communicate that with my business. I like the current symbol not necessarily for its aesthetic forms (they're circles after all) but because to me it looks like there is some association with physics. I initially didn't have that in mind when designing the logo but it fits very well with my interests.</p>
      <p>One objection I do have to the symbol is that it's too simple and therefor not recognizable enough. At the other hand, a simple symbol may be exactly what I need but it will greatly depend on the layout and concept for presenting the typefaces whether it will work. Klim and Storm have the most boring type foundry logos I've seen but I feel particularly in Klim's case it works really well. How do you go about this? Do you feel you need a prolific symbol?</p>
