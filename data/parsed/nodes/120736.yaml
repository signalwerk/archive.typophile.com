      <div class="comment-spam-body"><blockquote><p>I think it's pretty nice. Just move the "i" slightly to the left.</p></blockquote>
      <p>For why? I think it's spaced evenly. Moving /i to the left would make the gap between i_l too big I think. I would move S closer to /i, but then the Sil part is kerned tighter than the other letters. I had to go for looser spacing because of the gaps in /typ.</p>
      <blockquote><p>BTW are there other symbols for silver, that might be more interesting?</p></blockquote>
      <p>Did you see the link I provided? Here's the link without formatting: <a href="http://files.abovetopsecret.com/images/member/2512f83e7980.png" title="http://files.abovetopsecret.com/images/member/2512f83e7980.png">http://files.abovetopsecret.com/images/member/2512f83e7980.png</a></p>
      <p>Those are the 7 symbols I could have chosen from. I first tried to moon but couldn't make it work. The second symbol looks too much like a lady's butt with her legs moved up to me and the eye and triangles I feel are too esoteric to use as a main symbol. However, I might use the other symbols as well at some point.</p>
      <p>Initially I had the idea of using the periodic table but considering the symbol for silver is Ag from argentum, that didn't work for a logo. I'm still going to use the periodic table for branding though. Perhaps use that concept to show off OT features in PDF specimen, or something like that. Either way, I have some things to work with when I expand the branding. For now it's just a logo so I can submit it to MyFonts.</p>
      <p>For the circles symbol what I had in mind was to have the smaller circles go outward when you hover over the logo or just have the circles rotate indefinitely. I haven't yet figured out what to do with it but it's a concern for later.</p>
      </div>
