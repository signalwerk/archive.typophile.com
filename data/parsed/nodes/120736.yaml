      <div class="comment-spam-body"><blockquote><p>Funny your comment about making the tittle a little bit bigger because I also instinctively thought about that when I first saw the design but I failed to mention it in the comment.</p></blockquote>
      <p>I often observe mistakes when I'm uploading pictures here rather than when I'm working on it. It's like I can suddenly take a step back and see my work a bit more objectively, though I still definitely require more sets of eyes to work out all the kinks, usually.</p>
      <blockquote><p>I don't like the connected il and the sharp drop on the r.</p></blockquote>
      <p>I don't like the connected /il either, but it seems necessary to bring the letters closer together. What can I do? The only solution I can think of is shortening the serifs. Perhaps that's what's required.</p>
      <p>As for /r, the previous version is rather ugly, but I'm trying to find ways to fill more white space in that area without compromising the shape of the ball terminal. The ball terminal of the initial /r is too small I think. I feel the latest /r is close, but I will make the ball terminal more rounded. I have a slight bend on the top of the terminal to emulate the diamond shape of the tittle a bit, but I don't think it's working.</p>
      <blockquote><p>As you suggested yourself I would fiddle a bit with the stem of the p. The curl seems like a crazy idea.</p></blockquote>
      <p>I did fiddle with it and I'm satisfied with the /yp part. Is it still obtrusive to you then? Also, you mean crazy idea in a bad way, right?</p>
      <blockquote><p>I feel there's some disconnect between the sharpness of the corner at the top right of /S/ and the "filed-down" look to right side of the head serifs of the other letters.</p></blockquote>
      <p>What would you suggest? Just sharpening it? I'm a bit afraid of making it visually too sharp. I do want a bit of a contrast between sharp and rounded.</p>
      </div>
