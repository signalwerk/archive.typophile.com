  html: |-
    <div class="node-spam-content"><p>So, I've been designing typefaces for about 4 years now but soon I'm finally going to put some of my designs up for sale. I don't have the time to set up a proper foundry right now and may not wish to do so, but if I am to sell through MyFonts I would like to brand myself. Considering my last name is Silvertant I've decided on the name Silvertype. I would just like to know what you think of the logotype I designed for it.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Silvertype logotype_5946.jpg"></div><p></p>
    </div>
