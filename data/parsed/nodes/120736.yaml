  - id: 591269
    user: 52182
    date: 2014-10-22T12:25:00
    date_raw: 22 Oct 2014 — 12:25pm
    votes: null
    html: |-
      <div class="comment-spam-body"><p>I agree, I've been treating this too much like a typeface. I suppose I got inspired by some of the simpler logotypes around, like the one from Commercial type. Storm and Canada Type are too simple for my taste. I also considering a script logo like Kostic and Suomi, but I don't trust my skills regarding script and it doesn't seem to fit with my "rational" approach to type design.</p>
      <p>I took your feedback into consideration but I'm running into problems. The diamond shape isn't working for me, though I'm not sure if that's my lack of skill or the style of the typeface to blame. The /r I'm unsure of. It compensates for the white space underneath the shoulder better, but I can't really get the shape right. Perhaps I should make it sharper anyway, together with the tail of /y. The /ty ligature I don't like, so I might just decrease the length of the bar in /t. I suppose I could find solutions to all these problems myself, but right now I just can't think of a way to solve the problem in /yp. The only solution I see is aligning the right side of the serif of /y with the left side of the stem of /p and just connect it straight down. It's not the most elegant solution though. I tried to connect the serifs horizontally in several ways but they all look equally horrible. The last solution I can think of is either raising the stem of /p or possibly make a swirl to connect it with /y, but I don't see that working well for this type. Extending the stem looks odd here. I would probably only dare to do that with a garalde.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Silvertype logotype p3_6418.jpg"></div><p></p>
      </div>
