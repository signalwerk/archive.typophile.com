    html: "<p>Pretty nice. The only negative I see is the slight backslant. You might nudge the forms half a degree forward to counter it. <br> <br>Also, I'd do the weight distribution differently: make the Bold slightly darker, make the Heavy between the burrent Heavy and Black, and go even blacker with the Black. <br> <br>BTW, I think you might increase the \"dance\" in the lighter weights as well - otherwise this might end up as a \"me too\" design. <br> <br>hhp <br></p>"
