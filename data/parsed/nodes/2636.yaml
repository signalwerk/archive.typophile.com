  html: <p>Here is the beginnings of a sans family designed for the possibility of use with my recent serif project. In many ways it is unrelated though. It isn't just a version with the serifs ripped off. The x-height is the same, cap height the same, asscenders shorter, decenders slightly shorter. The forms are a complete redraw. <br> <br>The thing I especially like about this sans as a stand alone project is the black weight. It developes a playful brushy quality that is evident, but only hinted at in the regular weight. It is that quality I'm hoping will differentiate this offering. Some of the black glyphs were inspired by a collaborative project between Kyle Johnston and I that is now growing cobwebs.  <br> <br>I am not even through the lower case yet, so there is a long road ahead. Before embarking, I wanted to get your impressions. <br> <br><img src="http://www.typophile.com/forums/messages/29/23701.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/23702.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/23703.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/23704.gif" alt=""> <br> <br>Cheers, <br>Randy</p>
  html_clean: <p>Here is the beginnings of a sans family designed for the possibility of use with my recent serif project. In many ways it is unrelated though. It isn't just a version with the serifs ripped off. The x-height is the same, cap height the same, asscenders shorter, decenders slightly shorter. The forms are a complete redraw. <br> <br>The thing I especially like about this sans as a stand alone project is the black weight. It developes a playful brushy quality that is evident, but only hinted at in the regular weight. It is that quality I'm hoping will differentiate this offering. Some of the black glyphs were inspired by a collaborative project between Kyle Johnston and I that is now growing cobwebs.  <br> <br>I am not even through the lower case yet, so there is a long road ahead. Before embarking, I wanted to get your impressions. <br> <br><img src="http://www.typophile.com/forums/messages/29/23701.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/23702.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/23703.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/23704.gif" alt=""> <br> <br>Cheers, <br>Randy</p>
