      <p>“I think that it is easily one of the most aesthetically horrific structures I have ever seen.”</p>
      <p>That’s a very common reaction to most modern architecture from any era. People hated the Eiffel tower, the St. Louis Arch, etc. I’m sure there was a group of Romans arguing about the Acropolis when it was being built.</p>
      <p>Iconic architecture is just as much art as it is design and art, at times, is meant to cause a reaction more than anything. You spoke of FLW and his Guggenheim was hated by many folks at the time as well.</p>
