      <p>The grid structure and square monolithic shape suggest a handmade strength. But the meandering lines of the grid also suggests nature or natural elements. Those same lines however strong they really may be, suggest weakness and the protruding top on an uneven grid makes the stomach feel as queasy as looking up at Pisa’s leaning tower. It definitely provokes thought and is not something to overlook.</p>
      <p>As far as representing China, I can’t say since my opinion is solely based on other people’s experiences or lack thereof in the country.</p>
      <p>As far as representing the direction of architecture as a whole, I would have to guess that was probably not the goal of the project. Although it might in so far as architecture today seems to be more focused on meeting the needs of it’s specific client, upsetting traditional hierarchy of work environments, and letting computational algorithms drive design, especially in it’s facade or “skin”. </p>
