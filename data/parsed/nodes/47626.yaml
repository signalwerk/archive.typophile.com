      <p>Well, it’s all about taste. Some people don’t like modern architecture, and some people love it. I think it’s far too personal of an opinion to be able to categorize it generally. Yes, I admire the CCT building more for its industry and it’s oddity than I do for its architectural design. But, that’s what I think, perhaps other think it’s the greatest building since the Pantheon…! </p>
      <p>Jon.</p>
