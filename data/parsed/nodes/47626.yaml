      <p>I think it’s a really cool design. I’d like to see some more pictures, but they all seem to be from the same angle.</p>
      <p>Even if you don’t like it, I think one must remember that one building does not a direction make. I think it’s important for all kind of designers to explore “design space”, and even if not every experiment is a success, we learn something from it. We make progress and establish direction from an aggregation of previous designs, and in every generation, there have to be some things that turn out to be bad ideas and some that remain good in retrospect.</p>
