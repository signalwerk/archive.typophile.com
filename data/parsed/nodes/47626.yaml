    <p><a href="https://web.archive.org/web/20080906160332/http://www.thecityreview.com/nuchin12.jpg" title="http://www.thecityreview.com/nuchin12.jpg">http://www.thecityreview.com/nuchin12.jpg</a></p>
    <p><a href="https://web.archive.org/web/20080906160332/http://news.yahoo.com/s/mcclatchy/20080720/wl_mcclatchy/2994196" title="http://news.yahoo.com/s/mcclatchy/20080720/wl_mcclatchy/2994196">http://news.yahoo.com/s/mcclatchy/20080720/wl_mcclatchy/2994196</a></p>
    <p>The building above is the headquarters of China Central Television. I think that it is easily one of the most aesthetically horrific structures I have ever seen. Yes it’s a tribute to modern technology and how far we have developed, but that’s it. I think it this building is an eyesore on the horizon of Beijing, much like the Lloyd building is an eyesore to London (having seen that first hand, it really does look like a cigar that has its end chopped off and was stuck into the ground.) </p>
    <p>When you compare this architecture with the classic work of Wright, Le Corbusier, Mies van der Rohe, Oscar Niemeyer, Alvar Alto, Antonio Gaudi (I could go on and on) this building is a great reminder of the fact that just because you can do something, doesn’t mean you should. My grandfather was a wonderful architect in Moscow, and growing up with him I would go through his books of late 19th and 20th century architecture. If he would see this building, he would be horrified. I am not an architecture expert, but knowing a bit about the era that preceded modern day architecture, I can say it’s not a testament nor a credit to modern day architecture.</p>
    <p>Anyone else agree/disagree?</p>
