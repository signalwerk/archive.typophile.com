    <p>Hi there!</p>
    <p>I am trying to figgure out what this font is. It is used widely in Yen magazine. I already e-mailed the magazine, but did not hear back from them yet. If anyone can identify this it would be of great help!</p>
    <p>If you can't see the attached image, please go to <a class="freelinking external" href="http://www.yenmag.net/artaward/index.php" rel="nofollow">http://www.yenmag.net/artaward/index.php</a>, it's the font on the right side of the page, all thin caps, it says YOUNG AUSTRALIAN ART AWARD. </p>
    <p>Thanks a million!</p>
