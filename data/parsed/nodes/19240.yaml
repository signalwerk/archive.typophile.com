    html: |-
      <p>Your glyph names and Unicode values are not entirely correct. You should use these:</p>
      <p><strong>Ș</strong> — <strong>Scommaaccent</strong> (U+<strong>0218</strong>)<br>
      <strong>ș</strong> — <strong>scommaaccent</strong> (U+<strong>0219</strong>)<br>
      <strong>Ţ</strong> — <strong>Tcommaaccent</strong> (U+<strong>0162</strong>)<br>
      <strong>ţ</strong> — <strong>tcommaaccent</strong> (U+<strong>0163</strong>)</p>
      <p>Some more info on the subject, from the Fontlab Forum:<br>
      <a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065">[Tips / Glyph Naming] Glyph naming and encoding</a></p>
    html_clean: |-
