    <p>Hello.<br>
    I am on a mac and using fontlab 4.5<br>
    I have added in four extra characters with the generate glyphs:</p>
    <p>T comma uppercase &amp; lowercase<br>
    S comma uppercase &amp; lowercase<br>
    ( the characters with a comma centered under them)</p>
    <p>They had no naming as far as unicode goes once it made them so I typed in the correct values the glyph properties. They still do not show up.</p>
    <p>Is there a something that I need to indicate in the font info area? Like language support? or make it a unicode font. I have run out of ideas...</p>
    <p>thanks in advance</p>
