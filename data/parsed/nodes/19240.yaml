  - id: 118058
    user: 1844
    date: 2006-04-13T12:03:00
    date_raw: 13.Apr.2006 12.03pm
    votes: null
    html: |-
      <p>Fontlab’s (v4.5) <code>alias.dat</code> file inside the folder “Mapping” might not have the necessary entries.</p>
      <p>Use <code>T+commaaccent  t+commaaccent  S+commaaccent  s+commaaccent</code><br>
      instead of <code>Tcommaaccent  tcommaaccent  Scommaaccent  scommaaccent</code></p>
      <p>Of course, you’ll need to have the necessary glyphs (T t S s commaaccent), before you use the command “Generate Glyphs...”</p>
    html_clean: |-
