      <p>Possibly a local graphic designer, they tend to be generalists.<br>
      Look for one who has done work with special printing processes such as embossing, foil stamping, spot colors, unusual paper stocks—or "environmental" graphics i.e. signage. This would indicate that they would have some experience relevant to the tactile requirements of gravestones, even if they have never designed one. </p>
      <p>Alternatively, an architect? </p>
      <p>If you chose someone local, you can look at stone samples together and discuss with the mason/stonecutter.</p>
      <p>You may have to go further afield for a specialist in stone carving.<br>
      From the top: <a href="http://www.johnstevensshop.com/" title="http://www.johnstevensshop.com/">http://www.johnstevensshop.com/</a></p>
