    <p>Please help me to choose a typeface to use for my daughter's gravestone.<br>
    She was 22, she loved reading, horseback riding, skiing, diving. She was intellectual, and had many interests in life.<br>
    She was brave and adventurous - and fragile and vulnerable at the same time.<br>
    She never was into any frills, hearts, "girly" things, etc.</p>
    <p>I think there will be a stylized image of a young tree in a strong gush of wind on the granite panel and her name and years of birth and death. Everything kept very simple.</p>
    <p>There will also be place left for my and my husband's names.</p>
