      <p>Getting the assistance of a designer is an excellent idea, but most graphic designers will have zero experience with this kind of project. </p>
      <p>I think Nick's idea of talking to local masons/stonecutters might be your best bet. You could also check with a local arts council or college art department to see if they know any local artists who work in stone. Also if your community has a yearly arts festival, the organizers might know some stonecutters they could recommend. You might also try phoning some local funeral homes to see if they can recommend anyone.</p>
      <p>I'd suggest taking your time to make sure you find someone good. Temporary grave markers are available to mark graves until a permanent stone is ready.</p>
