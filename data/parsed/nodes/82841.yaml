      <p>A lot depends on how smooth the stone will be, and how patterned.<br>
      If the surface is polished and there is no pattern, then a finely detailed face will hold up.<br>
      So the choice of typeface (and size and layout) should work in concert with the choice of stone.</p>
      <p>As you intend to deviate from off-the-shelf template options, it may be advisable to engage the services of a professional designer.</p>
      <p>What would she have thought of the image you suggest? Depending on the execution there is the possibility it could become overly sentimental.</p>
      <p>A contemporary* type in the classic "stone-chiselled" mode is <a href="http://cartersans.com/index.html" rel="nofollow">Carter Sans</a>—very robust and un-girly. It would hold up well, even on dark, coarse stone.</p>
      <p>*Cousin to the Internet face Verdana, by the same designer.</p>
