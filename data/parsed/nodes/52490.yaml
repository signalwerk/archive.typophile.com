    <p>It seems that nobody has mentioned yet here at Typophile that he died on December 2nd.</p>
    <p>I never understood why he squandered away his fame by affiliating with Harvey and Melissa Hunt for a few dimes. That's why I refrain from composing an obituary.</p>
