      <p>ZOW-EEE! I'd never heard of the Hunt pair before, but after reading up on them a little I got the impression they are/were not on many Christmas card lists ... because if they were, they'd probably sue  you for the word "Christmas" being too close to the name of the typeface "Nordling."</p>
      <p>What I couldn't ascertain, however, is whether these two have a long history in this industry or just business people who stumbled on what they saw as a potential gold mine. I read something about one of them being a member of Atypi, but am not sure if that group would approve membership for my goldfish as quickly as they would someone who made a fortune on a typeface they named "Goldfish."</p>
      <p>Whatever the case, I also got the impression the Hunts were the proverbial 1600 pound gorillas in the room since to speak of them seems to be on the taboo side here. Maybe I'll get lucky and one of them will threaten to sue me for some screwball indiscretion. Perhaps I'd even read about it in the DAILY NEWS, or maybe even the Visalia Times-DELTA in Visalia, California . . .  you know, that place where a few decades ago the town big-wigs decided to prosecute a girl named CHRISTIANA for loitering naked in CITY Hall and telling everyone she was waiting for the CONCORDE to take her to see Pele at a New York COSMOS game? (think they heard me?)</p>
      <p>As for Mr. Lange, I always thought he was so distinguished looking, his image alone was better than any logo could have been. He just looked like the kind of person from whom nothing but outstanding work flowed. It's disappointing to hear that image seems to have been tarnished in recent years.</p>
