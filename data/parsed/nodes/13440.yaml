    <p>hello</p>
    <p>im one of the guys producing the first swiss art pdf magazine, <a href="http://www.artstuebli.ch" target="_blank">artstübli</a>.</p>
    <p>we released number one and are working on number two, which will have illustration as a main subject. number three will probably be about typography, so im looking for some help from you: if you think of switzerland, who do you think of? weingart (born in germany..)? frutiger (well known)? im looking for "fresh heads", if you know some..</p>
    <p>thanks!</p>
