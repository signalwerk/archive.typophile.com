  html: <p>Leopard has a new way of previewing fonts. Not the total solution but very fast and fun way of briefly looking at the basic design in a font. I just decided to translate one of my little articles to English <a href="http://font.is/?p=290" title="http://font.is/?p=290">http://font.is/?p=290</a> because I thought maybe some might find this useful. For many this is just obvious stuff but I am pretty sure that for some it will be a discovery.</p>
