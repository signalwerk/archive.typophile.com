  html: <p>It reminds me of <a href="http://www.myfonts.com/fonts/urw/windsor/" target="_blank">Windsor</a> or <a href="http://www.myfonts.com/fonts/agfa/musketeer/" target="_blank">Musketeer</a>/Milton, but if one of those was used, it was only as a starting point for 'inspiration'. This has a rather 'mutilated' look to it, where width and maybe long distance legibilty, were apparently more important than esthetics.</p>
  html_clean: <p>It reminds me of <a href="http://www.myfonts.com/fonts/urw/windsor/" target="_blank" class="link-external">Windsor</a> or <a href="http://www.myfonts.com/fonts/agfa/musketeer/" target="_blank" class="link-external">Musketeer</a>/Milton, but if one of those was used, it was only as a starting point for 'inspiration'. This has a rather 'mutilated' look to it, where width and maybe long distance legibilty, were apparently more important than esthetics.</p>
