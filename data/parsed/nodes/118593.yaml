      <p>I was involved in the purchase of several EditWriters back then. Bob, that citation you quote mentions “font disks” but the EditWriter used font strips, which were strips of film negative, about 18 inches by 4 inches, with metal clips on the ends, that fit around a metal drum inside the machine. Each strip held four fonts, usually a single family with four styles. You could fit two strips in the machine at once, for a total of eight fonts. There were also ROM cartridges (called a “width card” for each font strip containing spacing and kerning information that needed to be inserted into the machine. </p>
      <p>When you ordered a machine, if I recall correctly, you got two font strips as part of the deal. They could be anything from the CG library, but the default was Helios II (CG’s Helvetica look-alike) and English Times (CG's Times Roman look-alike). Beyond that, it cost $380 for each font strip ($45 extra for each ITC font to pay for the royalties). If you bought several at once, there was a price break.</p>
      <p>Compugraphic didn't use the CG prefix until the 1981 when they released exact copies of “typefaces most frequently specified in the graphics industry” in a series they called the “Typographers Edition.” These included CG Century, CG Century Old Style, CG Century Schoolbook, CG Frontiera (Frutiger), CG Goudy Old Style, CG Melliza (Melior), CG Omega (Optima), CG Palacio (Palatino), CG Plantin, CG Times, CG Trade (Trade Gothic), CG Triumvirate (Helvetica), and CG Trump Mediaeval. </p>
      <p>I have a CG catalog from 1977 that has a bunch of Bodoni styles, but no condensed. They did release <a href="http://typophile.com/node/59473">ITC Condensed</a> (a.k.a. ITC Fat Face Condensed) in 1981, which was a very condensed fat face style, and also Manchester Condensed (a.k.a. Madison Condensed), another Bodoni-like modern face.</p>
