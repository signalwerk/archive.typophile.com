    html: |-
      <p>I don’t recall why they used ROM cartridges. Competing machines from AM/Varityper didn’t need them. The film fonts were on spinning discs that somehow had the spacing info encoded (some kind of tick marks or whatever). I used both at various times. </p>
      <p>A useless but possibly interesting footnote: What sold me on the Compugraphic machines was the fact that they used discrete lenses for each point size. The AM machines used a zoom lens. This was great in that it allowed many more type sizes, but it also was less reliable. The sharpness of the type depended on whether you went up to a point size from a smaller size or down to a point size from a larger size. So, depending on which way you were going, you might need to insert an extra size change beyond the size you wanted to make sure the type was in focus.</p>
      <p>People have no idea how much simpler certain things are than they used to be.</p>
