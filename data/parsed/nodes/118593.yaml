      <p>1977 • The Compugraphic EditWriter 7500 is introduced and becomes an instant succes. This phototypesetter combines a keyboard and photo unit in one piece of equipment, enabling one job to be typeset while the operator simultaneously keyboards another. Separate units such as the Mini-Disk Terminal (MDT) and Mini-Disk Reader (MDR) allow off-line text entry and phototypesetting using 8″ floppy disks. The output  is imaged onto photo paper which is up to 8 inches wide. TYPE CAN BE SET IN SIZES FROM 6 TO 72 POINTS, USING A SYSTEM OF SWAPPABLE FONT DISKS AND VARIOUS FIXED LENSES MOUNTED ON AN INTERNAL TURRET.</p>
      <p><a href="http://www.prepressure.com/prepress/history/events-1970-1979">http://www.prepressure.com/prepress/history/events-1970-1979</a></p>
