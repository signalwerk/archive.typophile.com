      <p>Since that was a photo machine which used filmstrip fonts, it is highly unlikely anything "stock" came with the machine. That was before the days of the 35 Basic Postscript fonts and whatever fonts you bought when you placed an order for the machine would be what you started with.</p>
      <p>I think your best bet would be to scan the type in question and place it here: <a href="http://www.typophile.com/typeid " title="Click to visit an external URL." class="freelink freelink-external freelink-internal"> TypeID</a></p>
