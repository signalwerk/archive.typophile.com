      <p>Thanks Mr. Simonson! I suspected that CompuGraphics might have supplied a few strips with their machines. I didn't realize that those ROM cartridges carried spacing and kerning information, that's wild! I can see how that would have saved typesetters a lot of time in those days. I'm glad that the information you provided is now on the net. Recently, I had hit a pretty stern dead-end on any detailed typeface information about this machine.</p>
      <p>The typeface I'm looking for is in the Bodoni Poster Compressed/Onyx/Arsis neighborhood. I'm finally starting to embrace the typographic community's aggravation with aliases and knockoffs. They make for too many needles in too many haystacks.</p>
