      <p>It could have been they used ROM cartridges because putting tick marks on the negative was patented.</p>
      <p>Or, it could have been that tick marks on the negative would work for spacing information... but if you also wanted to do <strong>kerning</strong> you needed too much information for that, and so the ROM cartridges contributed to typographic quality by allowing automatic kerning, as opposed to manual kerning.</p>
      <p>Also, I see that Circuitous Root is planning to scan a Compugraphic type catalogue; I hope they do manage that soon.</p>
