    <p>First time on logo design part of the forum, hello to the regulars and all.</p>
    <p>Below are first sketches of the logo for a company which operates on numerous grounds: publishing, conferences, training courses, learning courses, e-learning, on the subject of management. </p>
    <p>Company operates for about 5 years on the local market and its name and BI were changed several times, thought products they sell remain constant and have high reputation and are well recognized among aimed target group.</p>
    <p>This time they need another name change and drop some associations. (see img of <strong>current</strong> logo, NOT a subject to critique!)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CIMI_6584.jpg"></div><p></p>
    <p>The name will be <strong>ICAN</strong> and is ment to be meaningless noun. Dropped Canadian associations from previous BI.</p>
    <p>ICAN must not have any associations with: <strong>iSomething</strong> bandwagon, <strong>I can</strong> mistakes, broken word <strong>...can...</strong> (Ameri<strong>can</strong>, <strong>can</strong>on, etc.) Knowledge of english is common among target audience.</p>
    <p>Logo must be accompanied by taglines specifying the branch of the product (eg. publishing, education, institute, etc.) Variety of repro targets: offset up to billboards size, desktop, fax, screen, engravings. Extreme small repros without tagline.</p>
    <p>And here are said proposals:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ican_5554.jpg"></div><p></p>
    <p>Anyone willing to share thoughts on the sketches is most welcome.</p>
    <p>Thanks,<br>
    Antoni Adamowicz</p>
