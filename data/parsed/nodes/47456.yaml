      <p>Hi all, I'm on holiday till next Monday, so forgive me not keeping the thread alive. I'm trying to avoid internet and displays for two weeks ;-).</p>
      <p>Jay said: "Why use a name without meaning and fight the most basic of principles of identity design -- using the name to derive meaning."</p>
