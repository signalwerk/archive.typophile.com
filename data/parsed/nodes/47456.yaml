      <p>Hi Antoni</p>
      <p>The company does so many things. Are there things that are common to all of them? </p>
      <p>What I see now misses a soul, a feel.<br>
      Sure it is a nice picture perhaps, but logo (lets say: identity) design should be more than that.</p>
      <p>What kind of a company is it? A happy one where the people wear jeans and shirts? Or a rigid business with suits? Or something in between? What are their products? For whom are they for? How does it communicates with their customers now? (in that you can often see what kind they WANT to be, but the question should be: who are they really)<br>
      Find out who they realy are and what their mission and vision for the future is. </p>
      <p>I would like to see some actual pencil sketches. Do you have them?</p>
      <p>Based on these two pictures I would explore the second one. The ornamental style may fit the company better.</p>
      <p>The name ICAN is not a meaningless noun. In a world full of iPods, iStockphoto etc. it has a meaning and some association with all of them.</p>
      <p>I like your choice of dropping things like dropshadows, gradients etc. since they can make it harder to use the logo on so many media.</p>
      <p>Hope this helps.</p>
      <p>Good luck!</p>
      <p>Raymond</p>
