      <p>Hi Raymond, thanks for your replay.</p>
      <p>"The company does so many things. Are there things that are common to all of them?"</p>
      <p>The only common thing is a subject of management, leadership, etc. The publications, conferences, trainings all are about it. A character of business is formal and strict – corporate look, feel and behave. Communication channels are printed media (brochures, magazine ads) and internet.<br>
      But the company lacks its identity – it sells known products with its logos (Harvard Business Review, Harvard Business School Publishing) and there's no real local competitors in this area (Poland). </p>
      <p>"Find out who they realy are and what their mission and vision for the future is"<br>
      As I can see, there's no coherent vision of the future, corporate culture or aspirations, apart from pragmatic running business. The company grows very fast and is charging lots of money for its services. Clients are mostly top dogs with no much choice between various products from competitors. It seems CEOs and VPs got no time and urgent need to seek for ICAN's identity. The main and only reason for the design project is a company name change and dropping Canadian symbols. All I have written are my assumptions, I haven't even got any real brief for this work. It seems no one cares:)</p>
      <p>Oh, and I got some "on paper" sketches, but alas I don't have running scanner for a while, besides they won't help much I'm sure.</p>
      <p>Cheers,<br>
      Antoni Adamowicz</p>
