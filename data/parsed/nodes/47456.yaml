      <p>While your mark is improving, I think the name's still very problematic. I immediately thought of ICANN as well, but most people won't. A bigger problem is that there are numerous Canadian businesses already using this name, such as:</p>
      <p><a class="freelinking external" href="http://www.icanhelps.com" rel="nofollow">ICAN</a> - an international charity based in Toronto<br>
      <a class="freelinking external" href="http://www.ican.nf.net" rel="nofollow">ICAN</a> - a marine tech company based in the Maratimes<br>
      <a class="freelinking external" href="http://www.icangroup.ca" rel="nofollow">ICAN</a> - Canadian auction network<br>
      <a class="freelinking external" href="http://www.ican.nfld.net" rel="nofollow">ICAN</a> - Institute of Chartered Accountants of Newfoundland</p>
      <p>...all this from the first 10 results on Google. Your client might have difficulty getting a trademark for the name.</p>
      <p>If ICAN is "meaningless", and almost certain to be confused for an acronym by anyone (when it's not), why use it? You may have already argued this matter with the client, but it seems that the business would benefit greatly from a name that's both distinctive and prestigious (which would match the direction you seem to be headed graphically).</p>
    html_clean: |-
      <p>While your mark is improving, I think the name's still very problematic. I immediately thought of ICANN as well, but most people won't. A bigger problem is that there are numerous Canadian businesses already using this name, such as:</p>
      <p><a class="freelinking external link-external" href="http://www.icanhelps.com" rel="nofollow">ICAN</a> - an international charity based in Toronto<br>
      <a class="freelinking external link-external" href="http://www.ican.nf.net" rel="nofollow">ICAN</a> - a marine tech company based in the Maratimes<br>
      <a class="freelinking external link-external" href="http://www.icangroup.ca" rel="nofollow">ICAN</a> - Canadian auction network<br>
      <a class="freelinking external link-external" href="http://www.ican.nfld.net" rel="nofollow">ICAN</a> - Institute of Chartered Accountants of Newfoundland</p>
      <p>...all this from the first 10 results on Google. Your client might have difficulty getting a trademark for the name.</p>
      <p>If ICAN is "meaningless", and almost certain to be confused for an acronym by anyone (when it's not), why use it? You may have already argued this matter with the client, but it seems that the business would benefit greatly from a name that's both distinctive and prestigious (which would match the direction you seem to be headed graphically).</p>
