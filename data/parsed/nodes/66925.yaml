    <p>New FontExplorer X Pro and Server Releases feature Expanded Capabilities and Improved Ease of Use</p>
    <p>WOBURN, Mass., &amp; BAD HOMBURG, Germany, Feb. 2, 2010 – Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, and its subsidiary, Linotype GmbH, have unveiled version 2.5 of the award-winning Linotype FontExplorer® X Pro font management application for individual users, and version 1.5 of the FontExplorer X Server solution for workgroup administrators. </p>
    <p>FontExplorer X Server 1.5<br>
    Designed for workgroups requiring flexible font management and control capabilities, FontExplorer X Server 1.5 debuts with a lockdown feature that allows administrators to limit certain functions of connected FontExplorer X Pro client users. Features include the ability to hide Linotype’s integrated font store and the workgroup’s local library from view, as well as prevent the ability to import fonts at specified client workstations. Administrators may also define fonts for automatic installation and activation on selected clients. Also new is a server replication feature, which enables larger installations to distribute workload across multiple servers. In this scenario, “slave servers” are connected to a “master server,” which enables data to be distributed amongst a defined subset of networked clients.</p>
    <p>Backup functions have also been enhanced in the latest release. Administrators may now assign without restriction the time of day and locations relating to when backups are conducted. Additionally, the LDAP (Lightweight Directory Access Protocol) connection has been revised to allow administrators to authenticate users directly from the LDAP server through the use of a domain password. In addition, the interface that controls system settings has been redesigned for improved clarity and handling.</p>
    <p>FontExplorer X Pro 2.5<br>
    Designed for easy organization and management of fonts for individual users, FontExplorer X Pro, which received a Macworld® Editors’ Choice Award as one of the 13 best software products launched in 2009 for Macintosh® computers, now includes expanded capabilities that are also designed to improve ease of use. A new print function allows users to create font sample books without having to activate fonts in a separate application. This feature allows users to simply drag and drop individual elements into a print preview mode, which can also be pre-configured through a comprehensive set of options. Alternatively, users can choose from a menu of readily available templates when creating font sample books. </p>
    <p>Version 2.5 introduces the ability to classify fonts. For example, users may choose to sort fonts and thereby create “smart sets” through keywords such as “serif,” “cover sheet” or other self-defined words or phrases. This feature also allows for automatic downloads of available font classification information from Linotype. The main window of FontExplorer X Pro has been reworked and includes new features, such as a “wide mode,” which allows users to take advantage of the extended image area of widescreen monitors. The main window can also be set to a transparency mode, enabling the ability to overlay fonts directly on documents.</p>
    <p>“FontExplorer X continues to earn exceptionally positive feedback. Receiving one of the coveted Macworld Eddy awards has been an amazing honor. It’s a strong endorsement that speaks to our commitment to offer the best possible font management products,” said Frank Wildenberg, managing director of Linotype.</p>
    <p>Availability and pricing<br>
    Available for Macintosh computers running Mac OS® X 10.4 or later and available in English and German, FontExplorer X Pro 2.5 may be downloaded and purchased from <a href="http://www.fontexplorerx.com" title="www.fontexplorerx.com">www.fontexplorerx.com</a> for $79 U.S. or 79 EUR (including VAT), or 59 GBP (excluding VAT) for a single user license. A 30-day trial version of FontExplorer X Pro is also available for download for new customers.</p>
    <p>Available for Mac OS X 10.4 or later and available in English and German, pricing for FontExplorer X Server 1.5 starts at $1,599 U.S., 1,199 EUR or 999 GBP for a server license that includes 10 FontExplorer X Pro client licenses (excluding VAT).</p>
    <p>Existing FontExplorer X Pro and Server customers may obtain updates free of charge through the update function of their installed software.</p>
    <p>Further information can be found at <a href="http://www.fontexplorerx.com" title="www.fontexplorerx.com">www.fontexplorerx.com</a>. Customers in Europe may contact Linotype in Germany at +49 (0) 6172 484-418. Customers in the U.S. may contact Monotype Imaging toll-free at 800-424-8973. UK customers may dial (+44 0)1737 765959 or 001781 970-6020, option 2. Customers in other parts of the world may contact Linotype at +49 (0) 6172 484-418. </p>
    <p>About Linotype<br>
    Linotype GmbH, based in Bad Homburg, Germany and a wholly owned subsidiary of Monotype Imaging Holdings Inc., looks back onto a history of more than 120 years. Building on its strong heritage, Linotype develops state-of-the-art font technology and offers more than 10,000 typefaces, covering the whole typographic spectrum from antique to modern, from east to west, and from classical to experimental. All typefaces (in PostScript® and TrueType® format as well as more than 7,000 fonts in the OpenType® format) are now also available for instant download at <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. In addition to supplying digital fonts, Linotype also offers comprehensive and individual consultation and support services for font applications in worldwide (corporate) communication.</p>
    <p>About Monotype Imaging<br>
    Monotype Imaging is a global provider of text imaging solutions for manufacturers and developers of consumer electronics devices including laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras and software applications and operating systems. The company also provides printer drivers and color imaging technologies to OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 10,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative and business professionals through custom font design services, direct sales or e-commerce portals. Monotype Imaging offers fonts and industry-standard solutions that support all of the world's major languages. The company is based in Woburn, Mass., with regional offices in the U.K., Germany (Linotype), Japan, China and Korea, in addition to U.S. regional offices in Mt. Prospect, Ill., Redwood City, Calif. and Boulder, Colo. Information about Monotype Imaging and its products can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>.</p>
    <p>Linotype and FontExplorer are trademarks of Linotype GmbH registered in the U. S. Patent and Trademark Office and may be registered in certain jurisdictions. Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Macintosh, Mac OS and TrueType are trademarks of Apple Inc. registered in the U.S. Patent and Trademark Office and other countries. PostScript is a registered trademark or trademark of Adobe Systems Inc. in the U.S. and/or other countries. OpenType is either a trademark or registered trademark of Microsoft Corp. in the U.S. and/or other countries. Macworld is a registered trademark of Mac Publishing, LLC and International Data Group. All other trademarks are the property of their respective owners. © 2010 Monotype Imaging Holdings Inc. All rights reserved.</p>
