    html: <p>I'm not too crazy about the swashes myself, so I'm trying to get rid of as many swashes as possible. They were supposedly there to compensate for a very inconsistent baseline. <br> <br>I've tweaked the design some more, reduced the swashes, with what I hope is a much more consistent x-height, and now it looks like this:<img src="http://www.typophile.com/forums/messages/29/68120.png" alt="second design"> <br> <br>It seems better to me now, though "paradise" still leaves much to be desired. <br> <br>I think it's an improvement, anyhow. I'll see how it turns out with a different type of blackletter, but that'll take some time, as I'm pretty clumsy with manipulating bezier curves.</p>
