    html: <p>I think your design would be helped by making a consistent x-height, using a kind of blackletter style with thick and thin strokes and reduce the swashes to the minimum needed. You have a difficult task making the m from 4 letters it leaves p with too much work, try to develop the m from se. <br>Tim</p>
