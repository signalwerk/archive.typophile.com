  html: "<p>Hello, I'm currently a physics student in my college, and I'm getting this design done for a college event. It's an ambigram that reads mechanics on one side and paradise the other way.  <br> <br>I'm wondering how the design stands typographically (I'm a complete amateur to typography), and would definitely welcome all comments/suggestions, especially if it would enhance legibility. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/67902.png\" alt=\"Mechanics/Paradise\"><img src=\"http://www.typophile.com/forums/messages/29/67903.png\" alt=\"Paradise/Mechanics\"> <br> <br> <br>For convenience, the design maps this way: <br>'m' on 'dise' <br>'e' on 'a' <br>'ch' on 'r' <br>'a' on 'a' <br>'nics' on 'p'</p>"
  html_clean: "<p>Hello, I'm currently a physics student in my college, and I'm getting this design done for a college event. It's an ambigram that reads mechanics on one side and paradise the other way.  <br> <br>I'm wondering how the design stands typographically (I'm a complete amateur to typography), and would definitely welcome all comments/suggestions, especially if it would enhance legibility. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/67902.png\" alt=\"Mechanics/Paradise\"><img src=\"http://www.typophile.com/forums/messages/29/67903.png\" alt=\"Paradise/Mechanics\"> <br> <br> <br>For convenience, the design maps this way: <br>'m' on 'dise' <br>'e' on 'a' <br>'ch' on 'r' <br>'a' on 'a' <br>'nics' on 'p'</p>"
