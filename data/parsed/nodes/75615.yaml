    html: |-
      <p>Most of my posts don't include a plug for Shinntype fonts.<br>
      When I do recommend one of my fonts, it is for a particular brief that I think it may be appropriate for.<br>
      Being on topic, that's hardly wanton interjection.<br>
      If a topic is being discussed, I will often use one of my own fonts as an example, because I'm familiar with its design process; that's not a sales attempt, it's primarily sharing knowledge -- although it is also publicity.</p>
      <p>Spam is indiscriminate, blanket promotion. As a term, it may have derogatory overtones, and hence be ungracious to mention, but I use it quite literally.<br>
      Posting a marketing newsletter in General Discussions is spam.<br>
      I've also criticized TypeTogether for this before.<br>
      Perhaps it's not my job to be so officious, as I'm not a moderator, so in future I will draw it to a moderator's attention "in private", rather than in the thread.<br>
      Where is the link to contact a moderator?<br>
      I couldn't find one.</p>
