      <p>Nick,<br>
      while alerting an admin by leaving a comment in the thread works out most of the time (like it did here), sending a direct message certainly is quicker and more effective. You can contact any of the admins via this page: <a href="http://typophile.com/moderators" title="http://typophile.com/moderators">http://typophile.com/moderators</a> (Yes, I agree that there should be a link to it in the footer or sidebar of every page.)</p>
      <p>I have sent a message to the original poster, but haven’t heard back yet. I  will delete this thread, but first want to point TypeTogether to this discussion and your (fair) remarks – otherwise, we will see another accidentally posted ad in the General Discussions very soon (as I believe this has happened out of ignorance, not with bad intentions).</p>
      <p>Florian</p>
