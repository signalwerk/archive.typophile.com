    date_raw: 11 Dec 2003 — 2:12am
    votes: null
    html: "<p>for 80's: fonts designed by <a href=\"http://www.identifont.com/show?16X\" target=\"_blank\"> Neville Brody</a>. <br> <br>for 90's: fonts designed by <a href=\"http://www.typedifferent.com/\" target=\"_blank\"> Bureau Destruct</a>. <br> <br>for 00's use <a href=\"http://www.myfonts.com/fonts/ef/din-1451/\" target=\"_blank\"> DIN</a>. <br> <br>for all 3 decades you could also shop <a href=\"http://www.emigre.com\" target=\"_blank\"> Emigre</a>.</p>"
    html_clean: "<p>for 80's: fonts designed by <a href=\"http://www.identifont.com/show?16X\" target=\"_blank\" class=\"link-external\"> Neville Brody</a>. <br> <br>for 90's: fonts designed by <a href=\"http://www.typedifferent.com/\" target=\"_blank\" class=\"link-external\"> Bureau Destruct</a>. <br> <br>for 00's use <a href=\"http://www.myfonts.com/fonts/ef/din-1451/\" target=\"_blank\" class=\"link-external\"> DIN</a>. <br> <br>for all 3 decades you could also shop <a href=\"http://www.emigre.com\" target=\"_blank\" class=\"link-external\"> Emigre</a>.</p>"
  - id: 18837
    user: 1256
    date: 2003-12-11T11:01:00
    date_raw: 11 Dec 2003 — 11:01am
    votes: null
    html: <p>For the 80s, I'd go with Serif Gothic and Helvetica as prime choices. <br> <br>For the 90s, it's all about Emigre, either Matrix or one of the other totally ubiquitous designs they created. <br> <br>For the 00's, how can you go wrong with Crackhouse from House Industries? That was everywhere!</p>
