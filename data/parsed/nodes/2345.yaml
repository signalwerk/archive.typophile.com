    date: 2003-12-10T06:53:00
    date_raw: 10 Dec 2003 — 6:53am
    votes: null
    html: <p>The <a href="http://www.veer.com/products/type/jbt/">Jukebox</a> collection has some especially nice vintage scripts and other retro display faces. <br> <br><a href="http://houseind.com/house.php?page=fonts">House Industries</a> has a voluminous pile of pop-culture, period-inspired collections as well.</p>
