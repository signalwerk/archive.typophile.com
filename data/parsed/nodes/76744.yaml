  html: <p>Think you can distinguish between Helvetica and Arial? Try this interesting quiz by <a class="freelinking external" href="http://www.ironicsans.com" rel="nofollow">Ironic Sans</a>, called "<a class="freelinking external" href="http://www.ironicsans.com/helvarialquiz/index.php" rel="nofollow">So you think you can tell Arial from Helvetica?</a>". Here they take regular logos originally designed with Helvetica and replaced all of the words in the Arial typeface.</p>
