    votes: null
    html: <p>It must be a reaction to the cold, mechanical mainstream of contemporary western society. Same goes for so called "vernacular" type, where badly crafted letters are seen to have charm. <br> <br>I think warmth and imperfection can be good things, but the way they're coveted these days seems like an escape, not a true valuation of those virtues. People who now cherish wood type still can't live without their chrome gadgets. <br> <br>hhp</p>
