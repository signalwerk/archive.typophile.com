  html: <p>Why is wood type so popular again? In just a few short months, its everywhere. Is it this poker tourney or is Jesse James haunting the typophiles' minds? <br>Discuss.</p>
  html_clean: <p>Why is wood type so popular again? In just a few short months, its everywhere. Is it this poker tourney or is Jesse James haunting the typophiles' minds? <br>Discuss.</p>
