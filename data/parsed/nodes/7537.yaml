    html: <p>to me type is like color. you use color to evoke certain moods and responses. you can use type the same way. beck's odelay album is not totally country, but i think you can feel it's influence. i think that the titling for the album art helps convey this visually as beck does in the music on this one sonically. <br>does type have to be relevant? i believe it <i>should</i> be, but does it <i>have to</i> be? i don't think so.</p>
