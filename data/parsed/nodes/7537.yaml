    html: <p>Stephen.. <br>That was the point of that image, sorry. Someone mentioned Poker as acceptable for woodtype, and I agreed, but I found that image that had nothing relevant to it in its typography, even though, that is one of the more famous tournaments I know of (I don't watch much television). I should have labeled my images. <br>Paul.. <br>Please refer to the * in EVERYTHING. <br>But on the subject, do you find the use of Beck's album cover relevant? Do you find it relevant that type SHOULD be relevant? Just curious, as I am still in school and our school lives and dies for Swiss typography and the International Style. Everything must have a purpose...yadayada. I agree with it, but slowly I have been suceeding from the rigor of it. For instance, I have forced myself to cut Helvetica by 75% because even she can not identify Beck.</p>
