    html: |-
      <p>Hey, Typophilics -- this is an old thread, <a href="http://www.typophile.com/node/6777" title="http://www.typophile.com/node/6777">http://www.typophile.com/node/6777</a>, but it's funny because I just found it. I was looking for something else, and this came up. To the nature of the font, it's not Trajan -- it's a customized Girvin titling font; surely, it's based on 1st century epigraphy, but not on Twombly's Trajan. Trust me, I've had so many of my logotype renderings converted into Trajan solutions by agencies, it's a joke. </p>
      <p>I've been working as a designer for motion picture marketing since 1978-79, and Apocalypse Now, Francis Coppola. And what happens is that you create solutions that are endlessly juried and judged by either the directors, the studio leadership, the talent, whomever is involved in the proposition -- and toned down. The art fullness, diminished. So, doing a rendering of the Last Samurai, or Lord of the Rings, Gladiator -- The Ghost and the Darkness -- or Lemony Snicket's A Series of Unfortunate Events, each of these treatments is entirely customized -- tuned and built by hand. And if there's an agency conversion, the customized solutions move to easily built imitation solutions by the agencies, and...the work is gone. </p>
      <p>More here on that: <a href="http://www.girvin.com/portfolio/identity/matrix/matrix.php" title="http://www.girvin.com/portfolio/identity/matrix/matrix.php">http://www.girvin.com/portfolio/identity/matrix/matrix.php</a>, or here: <a href="http://www.girvin.com/portfolio/identity/beowulf/beowulf.php" title="http://www.girvin.com/portfolio/identity/beowulf/beowulf.php">http://www.girvin.com/portfolio/identity/beowulf/beowulf.php</a>. Or this notation on process: <a href="http://www.bizjournals.com/seattle/stories/2006/05/08/story8.html" title="http://www.bizjournals.com/seattle/stories/2006/05/08/story8.html">http://www.bizjournals.com/seattle/stories/2006/05/08/story8.html</a>. I'm not touting, I'm talking. <a href="http://blog.girvin.com/?p=997" title="http://blog.girvin.com/?p=997">http://blog.girvin.com/?p=997</a>, or: <a href="http://blog.girvin.com/?p=712" title="http://blog.girvin.com/?p=712">http://blog.girvin.com/?p=712</a></p>
      <p>Nuff said, as they say in the comics. </p>
      <p>I started working on Lemony Snicket as a production designer for Count Olaf's eyes -- which then became part of the logo, then from there, building out the fonts and related work to create the master -- for a committee and client team of 15. </p>
      <p>Rough, but done.  </p>
      <p>Reach, as you will | TSG</p>
      <p>Tim Girvin | Seattle+NYC+Tokyo</p>
