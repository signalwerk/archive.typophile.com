      <p>Patrick, sweet, your comments -- thanks for your generosity of spirit. I claim nothing, really. Simply that the idea of creating a logo for a film is like creating an identity for something else -- except that, perhaps, it gets a little more out there. The exposures are bigger, and perhaps even in some instances, international. </p>
      <p>But the real telling is in the telling itself. Any motion picture identity treatment is about telling the story in a kind of compressed concretion of space. The motion picture logo can be, literally, the first thing that comes into play. It's the teaser for what's to come. Then, finally, months, if not nearly a year later, the film logo is the last thing out, that tiny little space ad that you see. Last week! </p>
      <p>Iron man, I'd attest, will be in play much longer. </p>
      <p>More on that, later -- except for now, there's this: <a href="http://blog.girvin.com/?p=768" title="http://blog.girvin.com/?p=768">http://blog.girvin.com/?p=768</a></p>
      <p>Thanks, Patrick -- more soon. </p>
      <p>Tim Girvin | Strategy+Design | NYC+Seattle+Tokyo</p>
