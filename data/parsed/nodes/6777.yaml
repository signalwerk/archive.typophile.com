    html: "<p><i>Yeah, I thought Trajan too (which is used in EVERY movie poster)</i> <br> <br> <br>List 20 titles  <br> <br> <br><i>Ever notice that they use the same voice for all the previews too? No imagination.</i> <br> <br>Every book/cover with the same old golden section. No imagination. <br> <br>The voice for the previews/theatrical tralier:  the \"rule\" is very simple. Clear voice, sharp voice, deep voice, no \"hungry\" voice (that is - you can understand &amp; hear every word, and the person dosen't \"eat\" words) <br>no slang style like - see ya, how are ya? etc etc <br> <br>The same as book design. You use text typeface and not display.  <br> <br>So this is not about imagination. This is about how to sell.</p>"
