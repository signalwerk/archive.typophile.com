      <p>Thanks Tim for bringing this post back to life.  I remember reading a list in a "Print" column years ago, written by a design God of the moment. It was about things that were great and things that sucked in design.  Top of his list for the sucky was "any movie poster." That was at least 10 years ago and those unfortunate words come to mind every time I see one.  And while it's not always true (think Juno and Little Miss Sunshine for refreshing departures) I've tended to agree with him most of the time.</p>
      <p>I had to double check to make sure it was actually you posting, for as I was reading the earlier entries I knew that they were talking about some of your work. What the "movie voiceover guy" (as he is actually known) is to trailers, you've been to movie logos. And just as others try to imitate him, you've created a look that the industry feels the need to bastardize and perpetuate. </p>
      <p>I wasn't aware of the scope of your film work and the quite successful niche you've created until a few years back when I came across your name and remembered you for all the fantastic hand drawn logos and type treatments that were all over the design and type annuals back in the day. That was a rare gift of beauty and wit you showed us.  Would love to see more of that again.  Throw away that computer.</p>
      <p>cheers<br>
      Patrick</p>
      <p><a href="http://typographyshop.com" title="http://typographyshop.com">http://typographyshop.com</a></p>
