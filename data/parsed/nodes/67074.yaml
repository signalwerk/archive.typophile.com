    html: <p>Thanks for pointing it out, but I had never assumed any of my sample text was correct in any language. I use a program called <a class="freelinking external" href="https://web.archive.org/web/20150123043535/http://www.fika.org/davew/judebear/MacLorem/" rel="nofollow">MacLorem</a> to generate dummy text that is more varied than the usual Cicero passage. I had thought the Finnish option (and all the options, for that matter) only generated blocks with a pattern resembling typical letter frequencies rather than a specific text. I guess I should be more careful on how I use that thing.</p>
