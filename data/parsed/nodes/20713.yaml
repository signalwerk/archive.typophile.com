    html: |-
      <p>"and 'Univers' is pronounced wrong in a majority of the world languages?"</p>
      <p>In fact, you can pronounce Univers as you like, they specifically chose a name that is pronouncable in many languages, instead of "Monde" as it was proposed by Frutiger. After all, Univers was meant to be a "typeface for all people and all times" (or similar). This is also the reason why they introduced the numbers system: They only needed packaging and price lists in one language, which the French would read as "Univers cinquante-cinq", the English as "Univers fity-five" and so on.</p>
