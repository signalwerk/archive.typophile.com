    html: |-
      <p>&gt; <em>Benquiat - Ben-goo-at</em></p>
      <p>EEEK!<br>
      It's BEN-gat, unless you are a Spaniard, then it's BEN-gee-YAT!</p>
      <p>The threads listed by Tim D cover a lot of previous discussions.<br>
      The problem you will have with pronunication is that many typefaces were named after actual people and places... something that always gets confused in pronunciation depending on the language it is spoken in.</p>
      <p>Key points to consider would be --</p>
      <p>If it's the name of the person, it should be pronounced the way that person (or those who knew that person) would say it.<br>
      (Like the old Monty Python skit-- "It's spelled Luxury Yacht, but it's pronounced Throatwarbler Mangrove.")</p>
      <p>If it's named after a place, then it's based on the designer's pronunciation, <em>n'est pas</em>?<br>
      Example: Depending on whether the designer is from NYC or Lyon, typefaces named "France" "Nice" "Paris" would all sound different.</p>
      <p>Each language has it's own way of inflecting and pronouncing, so does that mean that "Frutiger" and "Univers" is pronounced wrong in a majority of the world languages?</p>
      <p>For the most part, I think many of us do NOT want to sound like idiots, especially when speaking with learned or experienced type directors and designers. The thing is, even when you listen carefully at International conferences, pronunciations vary slightly.</p>
      <p>I'm surprised you didn't have "Lubalin" in the topic thread list.</p>
