    html: <p>I thought Apple's garamond was a custom <br>face. A quick seach brought up this link <br>about the history of Apple Garamond. Turns  <br>out, yes it was custom drawn, and yes it is <br>ITC Garamond.  <br> <br><a href="http://www.myfonts.com/fonts/itc/garamond/" target="_blank">http://www.myfonts.com/fonts/itc/garamond/</a> <br> <br>I respectfully disagree with you Hrant. It is  <br>unfortunate to see Apple Garamond gone.  <br>In a market dominated by sans-serif Dells  <br>and Compaqs, it was refreshing to see  <br>someone thinking different. Tech != Sans  <br>(or doesn't have to). <br> <br><a href="http://store.apple.com/1-800-MY-APPLE/WebObjects/AppleStore/" target="_blank">http://store.apple.com/1-800-MY-APPLE/WebObjects/AppleStore/</a> <br><a href="http://www.gateway.com/home/index.shtml" target="_blank">http://www.gateway.com/home/index.shtml</a> <br>(Yes, I did see those serifs on the new Gateway logo) <br> <br>Noooo!!! <br>At least what is inside the box is still different. <br> <br>I don't want to sidetrack this great thread, so  <br>carry on. More underused gems please! <br> <br>Randy</p>
