    user_image: /files/pictures/picture-1215.gif
    date_raw: 9 Apr 2003 — 6:10am
    date: 2003-04-09T06:10:00
    votes: null
    html: <p>Vectora is around here in the States, in certain pockets of use. It was used to great effect for a few years in <i>Critique</i> magazine, where I was first introduced to it. I used it extensively in the program guide for a yoga/wellness center several years ago, shortly after which, it was picked up by Yoga Journal (I like to think my use influenced them, though it may have just been coincidence). I seem to remember seeing it picked up in another, more mainstream magazine recently, but I can't recall which offhand. <br> <br>There are a handful of books in production for the publisher I work with which are using Vectora as the sans-serif for secondary elements. <br> <br>But, thankfully, it is far from overexposed. It's a great face, very sturdy and serviceable. The one drawback is that the excessive x-height can make it tricky to mix with other faces. <br> <br>-- K. <br></p>
