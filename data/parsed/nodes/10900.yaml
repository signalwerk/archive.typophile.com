    html: <p>That's pretty funny. Found it in a nineteenth-century German dictionary once as "Boy-child" (archaic). The citizens of the Swiss city Biel are known as Bielers.  <br> <br>But it is only common in the northeastern shore area of Wisconsin as a slang word for young boys. My dad defined it as "a boy who has his own mind about how he does things." I was the bieler of the family. When I started my press it seemed as good a name as any.  <br> <br>Just to stay on topic, I should set it in the inglorious Mrs Eaves once. </p>
