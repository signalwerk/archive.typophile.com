    html: <p>"DTL was distributed in the US, at least for a short while, by FontHaus back in 1996." <br> <br>Interesting. DTL must have been a bit problematic but this would seem to indicate that they hardly "intentionally" avoided US distribution. I checked my DTL fonts, and five of them, marked 1994 indicate receipt from Monotype Typography, and two more, marked 1995 seemingly came from the old URW. These were sent for review and I remember having trouble at the time because I could not get any literature on them that was written in English. Monotype didn't provide any and I can't read Dutch. And DTL would not respond to my inguiries.</p>
