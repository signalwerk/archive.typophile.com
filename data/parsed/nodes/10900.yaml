    date: 2003-04-07T15:12:00
    votes: null
    html: <p>Antique Olive Nord by Roger Excoffon (1962) <br>Gill Sans by Eric Gill (1929 ish) <br> <br>I notice that Gill Sans turned up in the most overused font thread too.  Whenever I see anything trying to evoke a 1930s feel (which is quite a lot at the moment), they always use a font with Deco in its name.  Some of these fonts are nice, but they're much less common in real objects from the 30's than you would think.  From 1935 Gill Sans was used for the Penguin book covers which epitomise good quality 1930's design and (because they were in every house right up to recent years) really bring out that time period in the mind of almost everyone over 20. (In the UK at least - don't know if they are the same in the US). <br>  <br></p>
