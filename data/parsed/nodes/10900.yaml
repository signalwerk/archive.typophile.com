    date: 2003-04-23T14:45:00
    votes: null
    html: <p>I believe the thinking is that they sell fonts in the Netherlands to people who are willing to pay real money for fonts and want to use Dutch ones. Having spent some time browsing in Dutch bookshops, I realised just how few non-Dutch fonts are widely used in the Netherlands. It's quite refreshing.</p>
