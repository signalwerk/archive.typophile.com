    user_name: pstanley
    user_path: null
    user_image: null
    date_raw: 8 Apr 2003 — 3:18pm
    date: 2003-04-08T15:18:00
    votes: null
    html: "<p>What goes around comes around. For decades Plantin was a dreadfully overused face; now it is undeservedly neglected. CUP use it for some law books where it works well, in a setting that demands conservatism (mostly Times, or Sabon which seems to be the new Times for law texts). For decades Gill was underused, and now it's both overused and badly used, at least here in the UK: the EasyJet adverts are dreadful -- but the new Church of England 'Common Worship' book is rather fine. <br> <br>I'd say that pretty much all modern post-1980 text faces (with the exception of Minion and maybe FF Scala) are more or less underused, at least in books. Everyone using weedy looking grey Bembo with chubby semibold and half the ligatures missing ...</p>"
