    date: 2003-04-23T11:25:00
    votes: null
    html: <p>I do find it weird, given the great quality of their types, that DTL doesn't use any other European language in the web site (except for the 'shop'.) I could manage with French or German, and of course English, but who knows Dutch except the Dutch?  <br> <br>Also, they have promised a digital version of Romulus - the most beautiful roman typeface ever IMHO - in a few months hence for over two years. That I can easily understand. It's the pricing I don't. If there are any Dutch readers of this who actually know the Dutch thinking - and it seems to be all Dutch foundries - about this, I would be interested to hear. </p>
