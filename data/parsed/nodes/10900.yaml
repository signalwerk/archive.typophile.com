    date_raw: 11 Apr 2003 — 8:43am
    date: 2003-04-11T08:43:00
    votes: null
    html: "<p>The best part about Mrs. Eaves: <br> <br>The client comes to you and says, <i>We think <br>the type is looking a little small (so is the logo <br>by the way) could you 'up the font'?</i> <br> <br>You get to say, <i>Great! How about I 'up' it to <br>13 or 14pt, </i>and it winds up looking ok because  <br>of the small x height. Meanwhile, the client says, <i>15?</i>  <br>Then you say, <i>sure we'll keep the logo at 15 pt.</i>  <br>Next thing you know they want you to take a  <br>little off of the CFO's double chin?  <br>(yep, happened once). <br> <br>Randy \"Plastic Surgery\" Jones <br> <br>Oh, we were suggesting undeused type. David  <br>Thometz mentioned ITC Mendoza (Bitstream <br> version) as a suggestion for book work. I like <br> it. I like it alot.</p>"
