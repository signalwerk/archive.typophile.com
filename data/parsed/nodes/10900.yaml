    votes: null
    html: <p>Charter by Matthew Carter? I really love this type... a very elegant workhorse type and works well in low and high resolution. Now that's quite an achievement.  It's really underused. I use it quite a lot myself. <br> <br>I think I mentioned this somewhere else already. <br> <br>I'll think of some other ones... <br> <br> <br> <br></p>
