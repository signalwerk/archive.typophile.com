    html: <p>&gt;TEFF and/or DTL [intentionally] don't have distribution in the US.  <br> <br>What do you mean? You can order their stuff on their web sites. And when I asked for the A3 sheet on Trinite, they mailed it to me with a gracious note in the elegant hand of PMN.  <br> <br>I don't understand how the high prices make economic sense. I would think that you are going to make more money from selling to a lot of small users than a few sales to corporations or magazines who will use it a lot more, but buy it only once.  <br></p>
  - id: 68872
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 23 Apr 2003 — 8:18am
    date: 2003-04-23T08:18:00
    votes: null
    html: "<p>My information might be outdated. It had something to do with -intentionally- not having a representative in the US. As for getting specimens, TEFF* is indeed highly gracious. Did you notice the paper they use for the specimens? Wow. But note that I said \"and/or\". I remembered at least <i>one</i> of them not selling [directly] to the US - it could have been DTL and not TEFF. <br> <br>* And DTL provides all you need in PDFs online. <br> <br>&gt; intention <br> <br>I can't be sure, but maybe it has to do with higher rates of piracy and/or lack of copyright protection. Basically it's a matter of <i>controlling</i> the dissemination of your product, and that goes hand in hand with: <br> <br>&gt; I don't understand how the high prices make economic sense. <br> <br>Well, the price point of something depends on many things, and in a niche market for example higher prices will yield greater profits. I think in this case higher prices do two things: elevate the prestige of the foundry above the seething masses, \"justifying\" future [high] pricing; reduce the rate of piracy (not just by reducing dissemination, but also because the more you pay for something the less likely you'll share it). <br> <br>hhp <br></p>"
