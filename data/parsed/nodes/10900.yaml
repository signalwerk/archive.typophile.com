    html: <p>Gill Sans is definitely NOT underused... Antique Olive Nord, maybe. <br> <br>Poppl Laudatio is very underused. I haven't found a use for it though! <br> <br>URW Grotesque by Hermann Zapf is extremely underused. I don't think I've ever seen it used in fact! <br> <br>Plantin is not seen much these days. Neither is Trump Mediaval. <br> <br></p>
