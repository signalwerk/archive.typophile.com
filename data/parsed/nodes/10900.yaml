    html: "<p>This topic is really country related. <br> <br>For example: Bembo and Electra are NEVER NEVER used by any large publisher in France. Hard to find a book in French composed in Bembo. <br> <br>About Gill Sans, its everyhere here, for long. In pas two days, I received two documents from various sources composed in Gill Sans! <br> <br>I'm glad to don't see FF Wunderlich so much.</p>"
