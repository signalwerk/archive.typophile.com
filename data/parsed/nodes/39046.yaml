    <p>Hello,</p>
    <p>I’m look for a single letter to match a logo. I’m a designer but have never understood the nuances of typography. I’ve also a bit of a passion for cars. My perennial project car is a 99 Porsche Boxster.</p>
    <p>I would like to personalize my Porsche Boxster “S” to a Boxster “K”.  All Porsches of late (Including mine) have the same distinctive type face for there product name/logo. The type face is incomplete alphabetically. Of all the model names currently available, none have a  letter “K”.</p>
    <p>All I’m looking for is the letter “K” in the same vein as the Porches script logos. I can provide 5 or 6 of these logos for reference.  I’ve really little to pay for this indulgence, but I do 3d graphics’ and 3d modeling and more (krokodesign.com) and could trade time for time…dunno…</p>
    <p>Below is the type face as used for my car.</p>
    <p>Let me know if you can help, Thanks </p>
    <p>PK<br>
    </p><div class="imageWrap"><img src="/files/porsche-boxster_emblem_5044.jpg"></div><p></p>
