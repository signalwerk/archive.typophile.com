      <p>Yes, I agree with Lex and Frode. There are many free sites for fonts where you might find something close to your "GREAT SOUTHERN.." font, but when we try to ID fonts we look for them where it is easiest to see selections based on styles or keywords, and we look for them where they can be licensed properly, not stolen, unless they were meant to be free fonts.</p>
      <p>I think you might just want to try designing a font before you complain about how much they cost. If you want hand-lettered fonts, that's easy to do, but anything else takes a great deal of skill and time, not to mention expensive design tools.</p>
      <p>- Mike Yanega</p>
