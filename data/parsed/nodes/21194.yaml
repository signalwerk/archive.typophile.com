    <p>Combining fonts, football, F1, **** (cigarettes) and beer...</p>
    <p>This Telegraph <a href="http://www.telegraph.co.uk/money/main.jhtml?xml=/money/2006/07/10/cclife10.xml" rel="nofollow">article</a> on western beers in Russia mentions Heineken's Champions League advertising campaign that used a made up brand "ChapionsPlanet" to circumvent French laws on liquor advertising. The fictional brand uses the distinctive Heine font and colour scheme. </p>
    <p>This kind of thing has been going on for years in Formula 1 (<a href="http://www.sporteconomy.it/files/image/foto2005/midlandf1(1).jpg" rel="nofollow">example</a>) to avoid tobacco advertising bans. I've always thought this practice shows the power of typography, and would make for a great magazine article, coffee table book or undergraduate dissertation subject. </p>
    <p>Does anyone have any interesting examples of this genre they’d care to share?</p>
