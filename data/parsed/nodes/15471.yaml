    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 3.Oct.2005 10.39am </div>
      <p>For October 2005</p>
    <p><strong>34 New Lanston fonts!</strong></p>
    <p>This month brings re-mastered versions of the venerable <a href="http://www.p22.com/lanston/products/kennerley.html">Kennerley</a> font family by <a href="/wiki/Frederic%252BGoudy" class="wiki-create">Frederic Goudy</a> and the classic <a href="http://www.p22.com/lanston/products/cloister.html%20">Cloister</a> family by <a href="/wiki/Morris%252BFuller%252BBenton" class="wiki">Morris Fuller Benton</a>. Revised <a href="http://www.p22.com/lanston/products/twentiethcen.html">Twentieth Century Medium</a> features alternates based on the original experimental <a href="/wiki/Futura" class="wiki">Futura</a> by <a href="/wiki/Paul%252BRenner" class="wiki">Paul Renner</a>.<br>
                                                  Brand new digitizations of classic Lanston metal faces include <a href="http://www.p22.com/lanston/products/artscript.html">Artscript</a>, <a href="http://www.p22.com/lanston/products/cochin.html">Nicolas Cochin</a>, <a href="http://www.p22.com/lanston/products/remington.html">Remington Typewriter</a> and <a href="http://www.p22.com/lanston/products/goudytext.html">Goudy Text</a>...all with alternates and all optionally in expanded OpenType format. Additionally we have an exclusive digitization of the very rare <a href="http://www.p22.com/lanston/products/hmonoblack.html">Hess Monoblack</a> plus new <a href="http://www.p22.com/lanston/products/ornaments2.html">Ornaments 2 </a> and remastered <a href="http://www.p22.com/lanston/products/ornaments3.html">Ornaments 3.</a></p>
    <p>                                              <a href="http://www.p22.com/lanston/catalog.html">The full Lanston collection</a> is currently over 135 fonts PLUS over 40 OpenType fonts. Purchased individually, the fonts would cost over $2500. Buy them all now for only $999.95 (current owners of previous Lanston collections may upgrade at a very reasonable price. Please <a href="mailto:p22@p22.com">inquire</a> for details). <em>BUT WAIT</em> there’s more! If you license the full Lanston Collection this month, you will get the next installment at no additional charge (plus the <a href="http://www.p22.com/products/cds.html">William Caslon Experience CD</a>). Planned for early 2006, the next installment will include most of the remaining digital fonts from the Giampa era Lanston Type Co. including: <a href="http://www.p22.com/lanston/Giampa/Record-Title-Goudy.html">Record Title</a>, <a href="http://www.p22.com/Lanston/Giampa/Kaatskill.html">Kaatskill</a>, and <a href="http://www.p22.com/lanston/Giampa/JensonRoman.html">Jenson Oldstyle</a>. In all, over 30 fonts will be included in the next installment. Final selection is still under consideration.                                                </p>
    <p>                                              <strong>A New Foundry!?<br>
                                                  </strong>Many Lanston fonts were originally digitized by the multi-talented<a href="http://www.heavenlymonkey.com/Rimmer.htm" target="_blank"> </a><a href="/wiki/Jim%252BRimmer" class="wiki">Jim Rimmer</a>. Other titles offered by Lanston over the last two decades included the original Jim Rimmer designs: <a href="http://www.p22.com/lanston/Giampa/Albertan.html">Albertan</a>, <a href="http://www.p22.com/lanston/Giampa/Alexander-Quill-Font.html">Alexander Quill</a> and <a href="http://www.p22.com/lanston/Giampa/Posh-Initials.html">Posh Initials</a>. These design plus many more Jim Rimmer fonts, will be offered exclusively through P22 in January 2006. The <em><strong>Rimmer Type Foundry</strong></em> at P22 will feature all of Mr. Rimmer’s digital type designs while he spends his time working on <a href="http://www.heavenlymonkey.com/Rimmer.htm" target="_blank">making metal type and fine press books</a>.</p>
    <p>                                              <strong>Roycroft Book Arts<br>
                                                    </strong><em>So what is the allure of metal type and fine press books in the digital age?</em> We ask that question ourselves all the time. <a href="/wiki/P22" class="wiki">P22</a> makes digital fonts, but the source for so many P22 fonts goes back to the days of hand crafted printing. As part of the continuing tradition of connecting the old and the new, P22 is proud to be the co-organizer of the <strong><a href="http://www.p22.com/bookarts.htm" target="_blank" class="style19">“Roycroft Book-Arts Weekend”</a></strong> in East Aurora New York. October 14-16. Spots are still open for this historic Arts and Crafts renaissance workshop series on the very campus that helped launch the American Arts and Crafts movement in the late 19th century. But Hurry!<br>
                                                  <strong>Fonts-in-Use Contest<br>
                                                  </strong>Have a look at September’s winning entry in our ever-popular <a href="fontsinuse.html">Fonts-in-Use Contest</a>. You can enter too. <a href="contest.html">Click here for details</a>.</p>
