    html: |-
      <p>David, your hwair is quite respectable looking. One thing to check: the two counters should be slightly narrower than those of the h and u, in the same way that the counters of the m are usually narrower than that of the n. This stops the letter from being too wide overall.</p>
      <p>I recently had to design an ezh for my SBL BibLit typeface. Earlier, in the unreleased IPA portion of Sylfaen that I made for Microsoft in 1998, I reversed the contrast on the upper strokes, which seems quite common and follows a natural broadnib ductus. But for textual harmony I think it is better to match the stroke contrast of the z. I've put an image of the SBL Biblit ezh online at <a href="http://www.tiro.com/John/ezh.gif" title="http://www.tiro.com/John/ezh.gif">http://www.tiro.com/John/ezh.gif</a></p>
  - id: 82612
    user_id: 7689
    user_name: euginb
    user_path: null
    date_raw: 8 Aug 2005 — 1:39pm
    date: 2005-08-08T13:39:00
    votes: null
    html: |-
      <p>Well, John, that's exactly what I feared would be inevitable: Meddling with those tricky Bézier curves! (I was hoping I could somehow cobble the glyphs together with parts of other, existing glyphs ...)</p>
      <p>Interestingly enough, the lc "m" in Minion consists of almost exactly two "n" glyphs together! The basic "n" form is consistent in other glyphs, as well -- an "m" in the mask layer of the "hv" glyph (which consists of "h" and "u") fits it exactly!</p>
      <p>Still, as you will observe in the uploaded picture "m_vs_hv.jpg", the "hv" glyph appears to be somehow wider, even too wide, and less dark than the "m". Hrm.</p>
  - id: 82621
    user_id: 7689
    user_name: euginb
    user_path: null
    date_raw: 8 Aug 2005 — 2:17pm
    date: 2005-08-08T14:17:00
    votes: null
    html: |-
      <p>Oh, that's because the serifs close the "m" glyph, whereas the smooth curves and the absence of serifs open up the "hv" glyph. Clever.</p>
