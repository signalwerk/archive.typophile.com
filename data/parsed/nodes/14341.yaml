    <p>I'm currently trying to construct two very unusual glyphs to go with the Minion font family.</p>
    <p>The first is the IPA character for the sound <em>j</em> as in "les <em>j</em>eux sont faits", sometimes called "ezh", Unicode 0292. Unfortunately, I haven't found a suitable example. The glyph looks like the top of the z glyph combined with the bottom of the numeral 3.</p>
    <p>The second is the character "hv" used in Gothic transliteration. It looks like a combination of the h and u glyphs but without the lower right foot/serif of the u. Unicode  scalar value is 0195, plus I've attached my first feeble attempt at creating one.</p>
    <p>Unfortunately, I have no experience at all in designing type.<br>
    Are there any language/letterform aficionados who have dealt with these characters and who have two minutes to drop a comment?</p>
    <p>Thank you!</p>
