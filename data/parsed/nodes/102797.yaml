  html: <p>I’ve been drawing these Capital Eszetts for fonts lately. And I am aware there is a bit of controversy weather or not to use the Capital Eszett or simply replace it with SS. That being said, how do you deal with substituting the Cap for the lowercase in the OpenType code? Which way makes the most sense and why?</p>
