    <p>Hi all,</p>
    <p>Wondering if anyone might have some recommendations on fonts that have a similar tone to Italia. It seems almost rounded, giving it a very friendly feel (particularly combined with the large x-height) while retaining some of the 'pomp' of a serif font.</p>
    <p>Any suggestions appreciated.</p>
    <p>*serif* *friendly*</p>
