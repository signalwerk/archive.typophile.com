    <p>Hi all,</p>
    <p>I'm drawing glyphs for a stars and stripes font that started off from an entry for the type battle. I'm still very new to all this, so I'd really appreciate any advice or critiques that you can offer.</p>
    <p>Specific points: do the uc and lc go well enough together? Would it be better without the stars - or with them kept as stylistic alternates perhaps? How about without the stripes? I'm not sure I like how the descenders look, going clear again below the stripes.</p>
