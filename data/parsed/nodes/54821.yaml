    html: |-
      <p>The upper and lower case go together fine. </p>
      <p>Add more stars. Dot the i and j with them. Do more like the uppercase X... I love that. </p>
      <p>The white and black stripes should be the same thickness, a bit thicker than they are right now. The descenders are fine below the stripes. What if the part of the descender below the stripes were solid black instead of solid white?</p>
      <p>I prefer the fatter C and G, although for the C you might settle on a single one that's halfway between the C and G's thickness. The bowls of the R, B and P seem off-center and too small. I hate both Js... don't know how to fix them, though. Not sure if I like the hole in the uppercase O. </p>
      <p>That's my two cents. Take what you like and ignore the rest. :)</p>
