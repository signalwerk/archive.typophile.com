  html: "<p><i>Sorry, I may not be able to help, because I dont really know a way to change the type definition from 'Melior' to 'Times New Roman', in Word, is there no option to specify a different, alternate font.? ( I am also not too sure about 'Times New Roman' being such a good alternate successor, replacing 'Melior', concerning the formatting / setting / spacing / aligning of the original Word file.. )</i> <br> <br>But, just in case you are looking for the original type, '<a href=\"http://www.linotype.com/1222/melior-family.html\" target=\"_blank\">Melior</a>', itself.: <br><i>&gt; <a href=\"http://www.myfonts.com/fonts/linotype/melior/\" target=\"_blank\">www.myfonts.com/fonts/linotype/melior/</a> <br>&gt; <a href=\"http://www.linotype.com/1222/melior-family.html\" target=\"_blank\">www.linotype.com/1222/melior-family.html</a></i></p>"
