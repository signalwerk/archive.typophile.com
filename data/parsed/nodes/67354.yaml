      <p>Martin,</p>
      <p>Superpolator is €250, not 'incredibly expensive'. It literally pays for itself in a week.<br>
      That said, Superpolator does not make interpolation possible, just easy.</p>
      <p>If you have the incredibly expensive software FontLab Studio, you have a Python API for that. Install the incredibly free <a href="http://robofab.com" rel="nofollow">RoboFab</a> and start writing your own interpolation code. It's actually rather easy:</p>
      <p><code></code></p>
      <pre>from robofab.world import NewFont
      f1 = <a href="/wiki/your%20one%20font" class="freelinking" rel="nofollow">your one font</a>
      f2 = <a href="/wiki/your%20other%20font" class="freelinking" rel="nofollow">your other font</a>
      x = <a href="/wiki/interpolation%20percentage" class="freelinking" rel="nofollow">interpolation percentage</a>
      interpolationfactor = float(x) / 100
      f3 = NewFont()
      for n in range (0, len(f1)):
      -- c = f1[n].name
      -- g = f3.newGlyph(c)
      -- g.interpolate(interpolFactor, f1[c], f2[c])
      -- f3[c].mark = f1[c].mark
      -- g.update()
      -- bar.tick()
      f3.update()
      print "whee, free new font!"

      </pre><p></p>
      <p>Replace "-- " with a tab.(What, no indentation? No syntax colouring?) </p>
      <p>The <a href="http://robofab.com" rel="nofollow">Robofab website</a> has a bunch of reference about Python programming, the RoboFab libraries, "glyph math" and interpolation.</p>
      <p>Hope this helps,<br>
      Kai</p>
