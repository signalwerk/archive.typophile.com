      <p>@nickshinn wrote: <cite>because it's likely that you will want to have the alignment zones the same for all weights.</cite></p>
      <p>Huh. I think there is some difference of opinion on this point. Or maybe I misunderstand you? If you mean, the amount of overshoot is likely to be consistent, that may be. But if you mean, the x-height, cap height and descender depth are likely to be the same, at least some designers disagree. For a heavier weight, one might compensate with either a greater x-height (my preferred solution, one I've seen from a number of type designers whose work I appreciate), or a smaller cap height (the approach preferred by Robert Slimbach, another type designer I respect a great deal). Or one could do a smidge of both, I suppose.</p>
      <p>Regards,</p>
      <p>T</p>
