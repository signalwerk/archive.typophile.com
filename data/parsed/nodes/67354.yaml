      <p>There’s no way to avoid manual work. Computers cannot make aesthetic judgments, and combined with rounding errors generated letters get ugly quickly. Using tools like KLTF Glyph Tweaker will allow you to add or remove weight and width while maintaining contrast, but there are limits to what it can do. For example, you can go from a regular weight to a rough start on a bold weight, but if you try to jump to a black weight it’s going to take as much time to clean it up as it would to just draw it. It is also much easier to add weight than to take it away, because once you start pushing strokes in on themselves all the computer can do is overlap them. </p>
      <p>Extrapolation/interpolation tools are a great way to flesh out a family after you already have a few fonts drawn. Font Remix Tools, Superpolator, and UFOStretch can really speed stuff up, but if you’re using them to create entire fonts they’re limited to expanding a family into a much bigger family.</p>
