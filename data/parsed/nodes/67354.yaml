      <p><cite>I am surprised that such things are not corrected after the interpolation is output.</cite></p>
      <p>It’s pretty common—if you start cracking open fonts by some of the best-regarded type designers you’ll find lots of stems and sidebearings off by a unit here or there in the in-between weights. I think that with a lot of these little interpolations errors, if it’s not a high-contrast typeface being used at large sizes, nobody will notice. But for some of us it’s just hard to let go and not tweak every little detail—I just have a compulsion to do it.</p>
