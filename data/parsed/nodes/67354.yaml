      <p>So far I drew the alternate weight manually on individual glyph. I use the lighter weight as a master and I enlarge horizontally and vertically nodes by nodes to be sure there are always in the same position. To make a better interpolation you have to have the same amount of nodes in each alternate glyph. I've already tried to expand individually, but this method seems doesn't fit to me. An other way I find pretty good an efficiency is to work with the “Interpolate nodes” under the Contour menu. You start from a lighter or bolder weight and move the nodes at the distance you want and it keep on background the original as long you work on.<br>
      Hope this will be helpful.</p>
