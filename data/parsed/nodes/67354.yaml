    html: |-
      <p>I generally start with Regular.<br>
      Then I make an Extra Bold by adding as much weight as I can with the "change weight" feature, without it looking too weird, and then manually adding more weight by a combination of nudging stems and dragging points and vectors.<br>
      At the other end of the spectrum, I make a Hairline weight by drawing a path and adding a stroke value.<br>
      Then I interpolate between these three "weight nodes" to create the other weights.<br>
      It's important to develop the metric parameters of all three base weights at the same time, especially the alignment zones, because it's likely that you will want to have the alignment zones the same for all weights.</p>
    html_clean: |-
