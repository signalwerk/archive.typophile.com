      <p><em>So, in order to get more weights, I need to have two weights to base the rest on? Is there no way to go from Regular to Light with interpolation software?</em></p>
      <p>Correct - that's what interpolation is: taking two points of data and generating a new one on the line between them.</p>
      <p>Note that the aforementioned tools in the Action submenu includes a Bold action, and you should know that negative numbers can be used there to thin rather than thicken strokes.</p>
