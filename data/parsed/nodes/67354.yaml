      <p>It's nice if interpolation and extrapolation use hinting to avoid inconsistencies in interpolated/extrapolated stem widths due to rounding.</p>
      <p>Adobe's internal tools used to do this, and it was something they lost in the move to FontLab. It probably explains why in a newer version of Myriad Pro the vertical stroke of the lower-case "d" is one unit thicker than the vertical stroke of the cap "D" (something that came up in passing in another thread).</p>
      <p>Cheers,</p>
      <p>T</p>
