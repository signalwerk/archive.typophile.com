    html: "<p>I don't think there is only one way to do that task. You could use some tools in the Action submenu In Fontlab but that's not a perfect solution.  What I do: I draw the first weight, for instance the light, when I'm satisfy of it I draw a bolder weight, black one for instance. After I interpolate those two the get the regular one. Do the same with the regular and the black one to get the bold weight. Even with the interpolation method, you still have to make some adjustment or retouch on all glyphs.</p>"
