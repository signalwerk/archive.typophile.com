  html: |-
    <p>I recently came across some software with which you can easily make additional weights and styles for your font. I don't know if you have to trace your font again in the program or that it just uses your original vector points. In any case, the software was incredibly expensive, there was no trial version and I couldn't find a place to download it to try it out, so I forgot the name of it.</p>
    <p>That aside, I'm actually wondering how you make your additional weights and styles. Do you draw them manually or do you use software for it? If it's the latter, which? Is it also possible in Fontlab Studio 5? If it's the former, is there a source that describes the process to do it appropriately? Manually making weights and styles seems an awful lot of work, while the process of making a single font is incredibly time consuming already.</p>
