      <p>Right, I often make the x-height of the Bold bigger than that of the Regular.<br>
      However, if you're new at this, you would probably want to start out with consistent alignment zones across different weights.</p>
      <p>Later, you can experiment, but whatever the case, it's a good idea to figure out what the relationship of the alignment zones is fairly early in the design process.</p>
