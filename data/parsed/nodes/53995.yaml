    html: <p>This is a desperate cash-in by an industry that’s justifiably one step away from annihilation. I’d much rather see all the big record labels go chapter 7 and just stream the back-catalog from Corbis for a fee than have the government levy a piracy tax on me. It’s pathetic that no matter how bad it gets these companies will try crazy ideas like this but can’t be persuaded to just stop screwing over musicians and consumers alike.</p>
