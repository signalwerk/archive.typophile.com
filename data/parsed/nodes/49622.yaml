      <p>Philadelphia was home to one of the first successful typefoundries in our young republic. From the Binny &amp; Ronaldson foundry issued the face that is the forerunner of Monticello. Read more here:</p>
      <p><a href="http://press.princeton.edu/Monticello/" title="http://press.princeton.edu/Monticello/">http://press.princeton.edu/Monticello/</a></p>
      <p>*********<br>
      &amp; wasn't it in his Philadelphia years that Ben Franklin cut Franklin Gothic? Have I got that right?</p>
      <p>powers</p>
