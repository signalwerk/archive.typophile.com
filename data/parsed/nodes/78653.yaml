    <p>Anybody know the name of the typeface or similar? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Swiss_Poster_4777.png"></div><p></p>
    <p>In general I am looking for a nice early 20th Century Sans Serif used in Alpine Posters such as the iconic Swiss Alps Ski Resort posters. Secondary area to find typefaces would be from people like Herbert Matter &amp; Herb Lubalin. </p>
    <p>Thanks in advance.</p>
    <p>AB</p>
