      <p>It's not clear if you're specifically looking for vintage-style pointing fists, or if you're referring to the typographic fist itself as a vintage relic.</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_hands/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FF Scala Hands</a> is a great collection of variations.</p>
      <p>David Jonathan Ross included some pointing fists in his recently released <a href="http://www.fontbureau.com/fonts/Trilby/charset" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Trilby</a> from Font Bureau.</p>
      <p>Jonathan Hoefler's Fell Type Roman, from the <a href="http://Historical Allsorts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Historical Allsorts</a> set, has a couple vintage pointing fists (but I don't see any way of inspecting them via their website).</p>
    html_clean: |-
