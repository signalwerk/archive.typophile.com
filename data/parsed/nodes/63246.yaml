    <p>Hi all,</p>
    <p>New to the forums but I've been looking at the site for some time. I know this thread already kinda exists <a href="http://www.typophile.com/node/7703">http://www.typophile.com/node/7703</a> but I was wondering if anyone has come across any good examples of the pointing finger within a font?</p>
    <p>Either free or licensed, I'm not bothered just can't find much reference.</p>
    <p>Actually, this is one but there must be more.</p>
    <p><a href="http://new.myfonts.com/fonts/steve-mehallo/alta-california/">http://new.myfonts.com/fonts/steve-mehallo/alta-california/</a></p>
