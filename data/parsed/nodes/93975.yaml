      <p>Now have this running under GNU/Linux (fedora + ubuntu). To get this running i installed latest 'Robo_Fab560M_plusDependencies' from robofab.org, then typefacet is running without hitch.</p>
      <p>My experience so far, is that typefacet can create the appearance of adequate-good spacing, but it is relying too much on kerning pairs to achieve that :D (not good practice). However, by running the scripts selectively with the --only-modify-side-bearings arg on e.g. just lowercase, uppercase and both, i think i can see useful potential for the tool. It seems to do a pretty good job of getting the widths right, even when the side bearings are off :) so potentially very usefull for pre- manual spacing. Also potentially good tool for primary stages of font development to space glyphs in order to aid the optical widths etc of new glyphs and the emerging face. Certainly better than other auto spacing tools imho. Pretty sure this will get better. Maybe needs to be forked into separate 'spacing tool' and 'kerning tool'??</p>
