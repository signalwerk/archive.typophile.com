      <p>Charles - yes, i agree actual separate 'apps' are not necessary. For those interested, i've been testing on trying to get the amount of kerning pairs generated, way down, to anywhere between 200 - 1500 pairs, and still produce good spacing and kerning throughout a font. With that scenario i can see much better if the tool is able to produce good, funcional, and practical results. Takes a lot of tweaking ;) but i think i can see it does work, though i'm getting some results (a few kerned pairs) that are not what i would probably do manually, and i think i would manually tweak these later. So with simple sans-serifs (serif faces would likely respond differently) i'm getting best results with parameters like<br>
      <code>--intrusion-tolerance-ems 0.0<br>
      --min-distance-ems 0.094<br>
      --max-distance-ems 0.095<br>
      --kerning-threshold-ems 0.0135<br>
      --max-x-extrema-overlap-ems 0.0<br>
      --precision-ems 0.0030</code></p>
      <p>Also helps to use something like<br>
      <code>--glyph-categories-to-ignore  P* S* C* N*</code><br>
      to ignore numerals, punctuation, symbols, etc and then target these separately.</p>
      <p>-vernon</p>
