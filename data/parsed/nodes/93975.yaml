      <p><em>…i never see the point of individuals just lamely dissing tools or practices they have no interest in ever using. </em></p>
      <p>I wouldn’t say my opposition to auto kerning is lame.<br>
      I’ve argued against it many times on Typophile, especially against Adobe’s “optical kerning” in InDesign.<br>
      This is a forum and I’m critiquing in a reasoned manner, not merely dissing.<br>
      Perhaps the criticism will lead to a better product.<br>
      But the only way of telling is by seeing the results.<br>
      If someone is going to launch a new product half-cocked, with samples of what it does, rather than focusing on how it works and letting people try it, they must expect criticism based on the samples.</p>
      <p>I recall when Apple started out, the typesetting trade dissed the new technology for its poor quality.<br>
      Fair enough, and the quality improved.</p>
      <p>But not every new thang obsolesces the dinosuars.<br>
      Remember Multiple Masters?<br>
      The world was not ready for that much parametrics then.</p>
      <p>I wouldn’t go so far as to say auto-kerning will never produce as good results as manual kerning.<br>
      And I don’t believe that auto-kerning is entirely non-manual, or vice versa.</p>
      <p>But TypeFacet is presently wishful thinking.</p>
      <p>Frank, thanks for the kind offer.<br>
      No need to purchase, I’ll send you the font.<br>
      What’s your email address?<br>
      Mine: nick “at” shinntype.com</p>
