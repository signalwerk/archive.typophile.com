      <p><em>…another coarse attempt to mystify the profession of the type designer.</em></p>
      <p>You are the one doing the mystifying, hypothesizing a secret knowledge of the ancients.<br>
      I’m merely describing how I work, which I ﬁgured out by analyzing the different spacing schema that occur in type design and typesetting, rahter than relying on my conditioning.<br>
      I have identiﬁed at least different strategies for spacing:<br>
      - proximity<br>
      - stroke regularity<br>
      - center of gravity<br>
      In any given glyph combination (including more than two glyphs), these principles may contradict, and it’s the purpose of taste and judgement to resolve those conﬂicts. That’s what design is, and it can’t be reduced to magic formulæ. Even if one starts from a matrix-based premise, one still has to decide which unitary value to assign to the awkward letters such as binocular g and s.</p>
      <p>It’s OK to work numerically, but it’s not the best way to exercise taste in matters of spacing.</p>
      <p>Let’s keep the humanity in type design, striking a balance with automated tools (such as class kerning), but leaving plenty of room for manual skills and visual sensibility to breathe. The alphabet certainly helps, in the way that its letters resist regimentation, as evidenced by those which don’t comfortably pigeon-hole into kerning classes. </p>
      <p><em>…A classic "glass almost empty" statement.…</em></p>
      <p>I was being polite. Really, I don’t think there is anything at all in the glass, a deﬁcit even, as the examples of modiﬁcations are worse than the originals. </p>
      <p><em>The point of the tool is to provide a way to automate kerning so that it might be integrated into the design process of some typefaces.</em></p>
      <p>Not so. It conceives of kerning as polishing that may be applied to any typeface after it has been designed.</p>
