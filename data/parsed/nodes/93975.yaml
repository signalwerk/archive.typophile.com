      <p>Nick: ‘<em>[…] I must point out that there is no objective test of kerning.</em>’</p>
      <p>It will not come as a surprise when I totally disagree with this statement. Kerning is a reﬁnement of the spacing and the spacing comes forth from / is part of the design. </p>
      <p>Every type design has an optimal spacing, which –if the design has been made properly– results in an even stem-interval combined with uniform spaces between and within the letterforms. If the type design was originally made for text purposes, the spacing can be made somewhat more compact for display purposes, but this will hamper the stem-interval a bit (when one looks at Renaissance type, then for instance in Garamont’s <em>Parangon Romain</em> the serifs seem to be longer than in the French Master’s <em>Gros Canon Romain</em>, so the serifs probably were used as wedges [and as indicators for the casters for the setting of the ﬁxed mould-registers], and their lengths were relative to the ‘point size’).</p>
      <p>Taking into account that kerning is relative to the design, I expect that the output by <em>Kernus/KernMaster</em> will not differ too much from your ‘manual’ kerning. Of course, there can be some discussion about how tight one kerns combinations like ‘Ty’, and perhaps also about the kerning of some punctuation marks, but I expect that overall the results of both approaches will be quite similar.</p>
      <p>At the TypoTechnica 2007 conference in Frankfurt Miguel Sousa and I compared the kerning of <em>Hypatia</em> with the one that was generated on the ﬂy by <em>KernMaster</em>. Miguel was impressed by the fact that the artiﬁcial kerning-values came quite close to the ones he generated. (This reminds me of the nice duo-presentation we gave at the ATypI conference in Brighton in 2008, in which we compared the <em>FontLab Studio</em> / <em>AFDKO</em> based workﬂow at Adobe with the <em>FontMaster</em> based workﬂow at DTL –but that is another story).</p>
      <p>FEB</p>
