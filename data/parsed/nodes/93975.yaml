      <p>John: ‘<em>[…] a user has to work by trial and error, not really understanding how varying different parameters affects outcomes.</em>’</p>
      <p>In <em>KM 2012</em> the user can see the outcomes of the parameter-settings on the ﬂy.</p>
      <p>Nick: ‘<em>[…] kerning is inherently a manual, intuitive operation performed deep within a zone where the designer communes with the spatiality of the typeface […]’</em></p>
      <p>Ah, here we go again: another coarse attempt to mystify the profession of the type designer. Kerning is nothing more than making rhythmical corrections on variants of structures and patterns that were ﬁxed sometime in history. Kerning becomes necessary when type is not completely coherent and consistent, like roman and italic type are by deﬁnition. The rhythmical corrections are for the rest purely relative to the (spacing of the) design; this is no hocus pocus or high level stuff, but simply explainable matter. That is why a lecturer can discuss the details of a student’s type design (including the kerning) after he agrees with the design’s basic principles. </p>
      <p>And for all the religious people on this forum who (want to) believe that the early punch cutters and casters purely relied on their eyes (like they [want to] believe they do themselves, which they don’t because they are conditioned to look at type as they do), some recent ﬁndings of my research are published <a href="http://www.facebook.com/dutchtypelibrary" rel="nofollow">here</a>.</p>
      <p>FEB</p>
