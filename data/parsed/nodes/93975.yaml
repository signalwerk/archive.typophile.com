    html: <p>I've long thought that a necessary function of any autokern tool should be the ability to set up non-kerning control pairs. So, for instance, if one assumes that the sidebearings of H are correctly set, then there should never be kerning between HH, so that distance provides a control value for kerning. For each script, the user of the tool should be able to define the control glyphs between which no kerning should be applied and which provide the distance model for kerning in the font.</p>
