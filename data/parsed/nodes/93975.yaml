      <p>I had a look at it, but briefly, because I quit immediately I came across the philosophical proposition that the technocrats are wont to argue: <em>…that’s all the brain is: a machine.</em> </p>
      <p>There are many arguments against this, but the one I will mention here is that, from an historiographical perspective, culture can be seen to evolve as a progressive dialectic between the tendencies of art and science, with whatever the one creates being questioned by the other. </p>
      <p>Art says: OK, science, technology and capitalism, you’ve standardized and commodiﬁed That, but we decline to use your tools as you intended—so suck on This!<br>
      And Science says: Shape up, you wayward Mess of biology and culture; we are on the threshold of discovering your hidden mechanism and Making It Work.</p>
      <p>And so it goes, so it goes, so it goes, and where it’s going no one knows.</p>
