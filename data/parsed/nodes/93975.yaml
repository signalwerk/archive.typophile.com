      <p>Nick: ‘<em>There is a lot more to spacing than even-stem intervals and uniform white space [...] </em></p>
      <p>Yes, you are right: I forgot to mention the inﬂuence of the inferior conjunction of the moon at a certain moment during the creation of type, the humidity in general and in the working space of the type designer in particular, and the undeﬁnable relation between Voodoo and type design. But for the rest I was spot-on, I reckon.</p>
      <p>Nick: ‘<em>I would like to see a comparison of your auto-kerning for two of my “manually kerned” types—Scotch Modern and Richler […]</em>’</p>
      <p>Basically I would like to go further than kerning alone additional to your spacing, by also applying auto-spacing on another example. It is in my opinion more interesting to use a ‘translation’ and an ‘expansion’ typeface from your œuvre. The two typefaces you mention are basically from the latter category. Shall we say that we both select one?</p>
      <p>Charles: ‘<em>We've reached the logical positivist argument for kerning. Might be fun in theory, but 'tools' implies use.</em>’</p>
      <p>I have not the faintest idea what you mean here, but I assume that the nature of this message is positive.</p>
      <p>Charles (after an edit): ‘<em>I'm with Nick. The test would be interesting.</em>’</p>
      <p>The test was my idea, wasn’t it?</p>
      <p>FEB</p>
