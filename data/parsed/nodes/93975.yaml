      <p>FEB:<br>
      </p><blockquote>I strongly believe that most of the type design process can be automatized/parametrized. If one can describe the matter, it can be programmed –that is, if enough resources are available.</blockquote><p></p>
      <p>Well, i've found Typefacet pretty handy this week, using it as a quick way to space the ufo files of a new face, 'on the fly', as i work on them in Robofont &amp; Prepolator; tweak, shape, autospace, look .... tweak &amp; shape more, autospace again... etc. Ok so it's probably a forgiving face for an autospacer, but i have been impressed by the spacing Typefacet gives (see below).</p>
      <p><img src="https://lh5.googleusercontent.com/-Qt_skzhUtsk/T-4G9NUeSXI/AAAAAAAADt0/MLDjSbmpCRA/s300/Screen%2520Shot%25202012-06-29%2520at%252020.48.41.png"><br>
      <img src="https://lh3.googleusercontent.com/-eAWJ6Zq1lKM/T-4G8UBn8KI/AAAAAAAADto/ghEF-59A4EA/s300/Screen%2520Shot%25202012-06-29%2520at%252020.38.29.png"><br>
      <img src="https://lh4.googleusercontent.com/-4e6rDybTuG8/T-4G8-E-CrI/AAAAAAAADtw/B5B6iKOpJhc/s300/Screen%2520Shot%25202012-06-29%2520at%252020.47.58.png"><br>
      <img src="https://lh4.googleusercontent.com/-_1GcJnSpNek/T-4G8Zek1AI/AAAAAAAADtk/t_VNufTC1jI/s300/Screen%2520Shot%25202012-06-29%2520at%252020.47.46.png"><br>
      <img src="https://lh4.googleusercontent.com/-nn_fcv_FD9U/T-4G8VboaMI/AAAAAAAADts/TJhxPSIzljo/s276/Screen%2520Shot%25202012-06-29%2520at%252020.47.34.png"></p>
      <p>I can throw a whole ufo at Typefacet and it will return workable spacing across all glyphs (unlike the autospacers in fontog, fontlab or fontforge). Also, equally balanced glyphs (e.g. 'o', 'A', 'H', 'M', etc) get equally balanced side bearings, and unequally balanced glyphs get the 'correct' ratio of side bearing values. Other autospacers aren't allways that sensible. It's not the final spacing, and i will manually adjust some values, but it's doing a pretty good job, and the optical values of 'the usual' kerning pairs look ready for kerning later (auto and/or manual).  I would say it's saving me lots of time and compensating for my usually not so great attention span for spacing ;)</p>
