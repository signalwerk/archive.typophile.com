      <p>What’s the point of this?<br>
      What does it add that classes don’t already accomplish?<br>
      The examples are certainly not a good testimonial for the product.</p>
      <p>However, although I believe that (good quality) kerning is inherently a manual, intuitive operation performed deep within a zone where the designer communes with the spatiality of the typeface, I do think that there are ways in which automated kerning might be integrated into the concept and design process of certain kinds of typeface. For instance <a href="http://www.myfonts.com/fonts/shinn/softmachine/" rel="nofollow">Softmachine</a>, in which every glyph is equidistant from its neighbour, at the closest proximity. I did that manually, but it would seem to be the sort of thing that could be automated.</p>
