    <p>Hi there,</p>
    <p>   I'm working on an auto-kerning tool.  It's free and open source.  If you're interested in taking a look, I'd love to hear your feedback.  </p>
    <p><a href="http://charlesmchen.github.com/typefacet/topics/autokern/index.html" rel="nofollow">TypeFacet Autokern Project Pages</a></p>
    <p>   As a demonstration, I've used Autokern to re-kern two popular open source fonts: League Gothic and Linden Hill (both from the League of Type).  Here are direct links to before-and-after comparisons:</p>
    <p><a href="http://charlesmchen.github.com/typefacet/topics/autokern/league_gothic/sample_texts.html" rel="nofollow">League Gothic</a></p>
    <p><a href="http://charlesmchen.github.com/typefacet/topics/autokern/linden_hill/sample_texts.html" rel="nofollow">Linden Hill</a></p>
    <p>   I took the fonts' original kerning as a point of departure when configuring Autokern.</p>
