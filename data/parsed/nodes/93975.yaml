      <p>I don't think exempting pairs or classes is sufficient, because all that does is make the algorithm ignore them; what one really wants is for the fact that they are not-kerned to influence the kerning of the pairs that are kerned.</p>
      <p>Autokern tools like this one and DTL KernMaster offer parametric controls of the algorithm, but in my experience these are only readily understandable and predictable to the person who created the algorithm: a user has to work by trial and error, not really understanding how varying different parameters affects outcomes. Type designers spacing type don't think in terms of parameters, but of iteratively refining spacing and kerning relative to standard distances established by key shapes. Ergo, it seems to me that a good autokern tool should try to find a way to make such distances a kind of front-end UI to the algorithm parameters.</p>
