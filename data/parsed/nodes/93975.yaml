      <p>I was being sarcastic :) Good kerning obviously requires high standards, skill, and a lot of work. But the high standards some designers preach down to others are often far from the standards they deliver themselves ;p  Also, i never see the point of individuals just lamely dissing tools or practices they have no interest in ever using. Experimentation, trying things out, making mistakes, crossing borders, are all valuable exercises (for those who do it, and more so for those who may eventually benefit from it). Conversely, trotting about on some high horse is rarely good exercise.  Auto-tools can be very usefull and creative parts of a design process, so new tools and new methods of automation should allways be encouraged and criticised positively. -v</p>
