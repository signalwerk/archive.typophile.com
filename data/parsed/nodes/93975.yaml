    html: |-
      <p>PabloImpallari : Great! It's early days and the manual isn't very complete or well written.  Please feel free to get in touch if you have questions of want help. <a href="mailto:charlesmchen@gmail.com">charlesmchen@gmail.com</a>.<br>
      Thomas Phinney: It's not linear.  The algorithm uses linear calculations only for the upper and lower bounds of glyph spacing. ie. the user set a hard lower bound for how close two glyphs can be, and this is enforced linearly. The actual spacing algorithm is rather complicated. I intend to document it once I've settled upon some of the details...</p>
