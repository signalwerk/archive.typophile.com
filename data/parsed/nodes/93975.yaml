      <p>@John Hudson<br>
      I have been having some 'success' using the tool in this way; First i run Typefacet just targetting the side-bearings, tweaking the different parameters untill i get bearings that i 'know' are how side-side bearings should be, e.g. with a sans face, the left side of the 'H' 'B' 'D' 'E' 'F' etc are same(-ish), and all the bowls are same-ish, etc etc. Then i can run that .ufo through Typefacet, to kern only, and setting parameters to ignore certain pairs and/or glyphs. Like you say, by that point i know that e.g. the H-H etc should not be kerned, but i do know that e.g. the L-T will, or that an array of lowercase glyphs will need kerning to the right side of some uppercase glyphs. Of course this sort of routine would be sooo much easier when classes are introduced, and the user can exempt e.g. all glyphs in the 'H-left side' class, or kern only 'T' 'W' 'V' against a 'lowercase left sided bowl' class, i.e. 'c' 'd' 'e' 'o' 'q', or similar. A function that defined glyphs (or just left or right bearings of glyphs), or the space between certain pairs,  as 'controls' would be very handy. Good point!</p>
