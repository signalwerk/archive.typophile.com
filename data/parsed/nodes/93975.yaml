      <p>@vernon adams  I'm surprised any of that was necessary.  I'm going to try a clean install now on a 10.7 box and will update the installation guide (<a href="http://charlesmchen.github.com/typefacet/topics/autokern/typefacet-autokern-install.html" title="http://charlesmchen.github.com/typefacet/topics/autokern/typefacet-autokern-install.html">http://charlesmchen.github.com/typefacet/topics/autokern/typefacet-autok...</a>) if necessary.<br>
      Anyhow, please let me know if you need any help.</p>
      <p>@eliason Thank you.  One thing I've tried (but failed) to avoid in the examples was confusing Autokern's algorithm with its configuration. Autokern behavior is very dependent on its configuration (ie. its arguments, collectively). I believe many of the problems you've identified can be fixed by altering the configuration rather than modify Autokern itself.  I'll try to update the examples accordingly when I can.</p>
