      <p>Nick: ‘<em>[…] rather than relying on my conditioning.</em>’</p>
      <p>You will always rely on your conditioning, I reckon, because everything we do with type is relative to models which we learned to interpret. As David Kindersley stated in <em>Optical letter spacing</em> (London, 1976 | p.35): ‘<em>It is a commonplace that we see only what we know […]</em>’.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Elasmosaurus_Cope_Typophile_3593.jpg"></div><p></p>
      <p>In the nineteenth century the palaeontologist Edward Drinker Cope reconstructed an Elasmosaurus and he erroneously placed the head on the tail (see illustration above). The tail turned out to be shorter than the neck and obviously for Cope this was an unexpected proportional relationship of the two body parts.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The moral of Cope’s mistake is that the power of the human eye is purely relative to the anatomy of the things perceived. In <em>Art and Illusion</em> (Oxford, 1987 | p.255) Gombrich notes on this phenomenon: ‘<em>The stimulus patterns on the retina are not alone in determining our picture of the visual world. Its messages are modiﬁed by what we know about the “real” shape of objects.</em>’ </p>
      <p>Nick: ‘<em>You are the one doing the mystifying, hypothesizing a secret knowledge of the ancients.</em>’</p>
      <p>My measurements of Renaissance type and matrices and actual casting provide so far ample proof for my hypotheses. If you don’t (want to) believe in this scientiﬁc method, then you can throw away the majority of books on art history, architecture, paleontology, archeology, et cetera, because most knowledge presented is the result of reconstructions. Also the technical descriptions on the working methods of the early Renaissance punch cutters as described so far, are merely based on nothing more than assumptions and projections of the scarce seventeenth- and eighteenth-century treatises, like Moxon’s and Fournier’s. </p>
      <p>Charles: ‘<em>I haven’t seen any good examples yet.</em>’</p>
      <p>Shortly I will purchase one of Nick’s fonts, probably <em>Pratt Pro</em>, and I will objectively test whether artiﬁally spacing and kerning generated in a couple of nanoseconds can compete with his manual, intuitive operation, which is performed deep within a zone where the designer communes with the spatiality of the typeface. I will use <em>Kernus/KernMaster</em> for this, and also my own method based on ‘cadence-units’, which I brieﬂy described <a href="http://www.lettermodel.org/wordpress/?p=316" rel="nofollow">here</a>. Sometime coming week I will publish the results, if Nick agrees.</p>
      <p>Vernon: ‘<em>Auto-tools can be very usefull and creative parts of a design process […]</em>’</p>
      <p>I strongly believe that most of the type design process can be automatized/parametrized. If one can describe the matter, it can be programmed –that is, if enough resources are available.</p>
      <p>FEB</p>
