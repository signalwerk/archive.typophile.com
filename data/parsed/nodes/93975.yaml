      <p><em>I forgot to mention the inﬂuence of the inferior conjunction of the moon at a certain moment during the creation of type, the humidity in general and in the working space of the type designer in particular, and the undeﬁnable relation between Voodoo and type design.</em></p>
      <p>Also what I had for lunch, whatever meds I might be taking, and last month’s font sales.</p>
      <p><em>The two typefaces you mention are basically from the latter category.</em></p>
      <p>They do both have vertical stress, but their spacing strategies are quite different, which is why I thought they’d both be interesting to compare with automated kerning.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/vaool_4107.png"></div><p></p>
      <p>Scotch Modern<br>
      Richler<br>
      Goodchild</p>
      <p>For a “translation” face, might I recommend my Jenson (Goodchild)?<br>
