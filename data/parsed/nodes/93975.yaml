    votes: null
    html: |-
      <p>now up and running on OSX 10.7 :) using the git source of Typefacet from github.</p>
      <p>Some pointers for those needing help. I followed the following (nabbed from http://mirror.umd.edu/roswiki/electric(2f)Installation(2f)OSX(2f)Homebrew.html) to get the proper dependencies, e.g. libyaml &amp;  pyyaml installed.</p>
      <p>1. Change the permissions of your Python, Ruby, and Perl library directories to prevent the need for sudo when running pip. This is recommended by the Homebrew developers.</p>
      <p><code>sudo chown -R $USER /Library/Ruby /Library/Perl /Library/Python </code></p>
      <p>2. Add the following line to your ~/.bashrc file (make a .bashrc file if you dont have one)<br>
      <code>export PYTHONPATH="/usr/local/lib/python2.7/site-packages:/usr/local/lib/python:$PYTHONPATH"</code></p>
      <p>3. Install cmake for build systems and libyaml for reading configuration files:</p>
      <p><code>brew install cmake libyaml --universal</code></p>
      <p>4. Install pip, which is a package manager for Python, using easy_install:</p>
      <p><code>sudo easy_install pip</code></p>
      <p>5.Install PyYaml, the python interface to libyaml:</p>
      <p><code>sudo pip install pyyaml</code></p>
      <p>6. now all is well when running<br>
      <code>env PYTHONPATH=dependencies/robofab:dependencies/pystache:dependencies/svgwrite:python/src-main python python/src-main/autokern/Autokern.py -h"</code><br>
      in the Typefacet directory.</p>
      <p>now off to play ;)</p>
