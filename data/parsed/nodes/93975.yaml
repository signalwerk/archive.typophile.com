      <p>georg: I believe I've resolved your locale issue.<br>
      vernon adams: by default autokern does both auto-spacing and auto-kerning.  If you just want the auto-kerning, use the --do-not-modify-side-bearings argument. </p>
      <p>To be clear, Autokern is very early in its development process.  The results are not very good yet, and I'm still in the process of trying new approaches.  I think the results have improved quite a bit in the last few days alone.</p>
      <p>Right now, I'm looking for two things:<br>
      a) critiques (as detailed as possible) of the current output from a type designer's point of view.  See the samples:<br>
      <a href="http://charlesmchen.github.com/typefacet/topics/autokern/league_gothic/sample_texts.html" title="http://charlesmchen.github.com/typefacet/topics/autokern/league_gothic/sample_texts.html">http://charlesmchen.github.com/typefacet/topics/autokern/league_gothic/s...</a><br>
      <a href="http://charlesmchen.github.com/typefacet/topics/autokern/linden_hill/sample_texts.html" title="http://charlesmchen.github.com/typefacet/topics/autokern/linden_hill/sample_texts.html">http://charlesmchen.github.com/typefacet/topics/autokern/linden_hill/sam...</a></p>
      <p>b) anyone who'd like to discuss kerning theory and automation.</p>
      <p>Cheers!</p>
