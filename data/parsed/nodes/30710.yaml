      <p>If the school's goal is to brand itself as a non-accredited, mail order, diploma mill, they're on the right path. It reeks of that casual, not-quite-with-it trendiness that seems about 20 years behind the curve.</p>
      <p>Something that puzzles me is the school's regular revamping of the logo. Branding is a long-term effort with benefits that accrue over many years as the brand becomes known and identified with the organization. The relevance of this concept should be especially important to an academic institution whose goal, I think, would be to foster an image of stability, competence, quality and distinguished tradition. Instead, this new logo accomplishes the opposite.</p>
