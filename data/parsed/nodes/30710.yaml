      <p>Juan Pablo, that is a very sensitive reworking of a design, with nice improvements in clarity and balance. </p>
      <p>What a contrast to the pathetic new logo of Concordia.</p>
      <p>The thing that disturbs me most about the Concordia logo, even more than its 'hey look at my swashes' absurdity, is that it goes against the what a University should stand for. A University should be about passing along the knowledge, skills and experience of past generations to the rising new generation of young adults. As such, it needs to be above superficial trendiness. By straining so hard for trendiness the logo seems to me to say, "We don't understand or care about the true value and mission of a University."</p>
      <p>The New School logo linked above misses by trying to be trendy--and the trend has already passed!--but at least it is well done, which is a mitigating factor. </p>
      <p>I am curious about Concordia's own design department; were they consulted at all?</p>
