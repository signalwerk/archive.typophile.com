      <p>98K? Nice work if you can get it. I would've advanced the A a hair, but technically I suppose I'd be wrong. Of course, I think I'd have not tried to make it look like that at all. When I am forced to work with only 4 letters, I try to find a style that doesn't accentuate the kerning problems potentially in that combination.</p>
      <p>Each college needs to do it's own thing, but they seem to be in a crisis as a service industry. What do they sell, how do they convince the market their version is better? How do they make certain that the market knows what they are looking at when they see the mark? Standard questions, and interesting in the context of universities as a sector.</p>
      <p>With the need for the college industry to rebrand itself, might be a coming demand for the friendlier postmodern blackletter trend, which for now seems to be largely a thought experiment. The new blackletters might be an excellent compromise that holds some old colonial feel (which I don't think is necessarily bad, <em>from the client's perspective</em>), and the hipness they feel they need to now cater to.</p>
