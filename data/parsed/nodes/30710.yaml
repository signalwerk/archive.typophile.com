      <p>Hi Linda,</p>
      <p>Yes, we still produce a hard copy Calendar. In fact, our online version is produced from the files used to create the hard copy. </p>
      <p>This year there was some mumbling from above about making it available online only and adding interactivity between the Calendar and the Class Schedule from the registration interface. Hehe, and bilingual. However, we have neither the expertise nor the budget to make those kinds of changes. At least not now. We would all (the 4 of us in publications) need some heavy-duty training. And certainly extra staff and cooperation with the IT department. Since we are unionized and permanent, they can't simply replace us with someone more savvy (knocking on wood and keeping appendages crossed).</p>
      <p>How's the online-only going at U of C? We did the same with our admission application. Printed only 2000 copies, all long gone, and are now insisting students apply online. I guess for the most part it hasn't had a negative effect, but the decision has certainly impacted the way we process applicants.</p>
      <p>Personally, I prefer to read most everything hard copy. Professors constantly refer to the Calendar from offices with no computer or internet access, so what would they do? And, c'mon, in comparison to other things, it's not that expensive to print.  </p>
      <p>K.</p>
