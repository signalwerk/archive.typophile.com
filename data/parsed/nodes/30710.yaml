      <p><em>Why would one want a bilingual approach for a word like that. The words are practically the same…?</em></p>
      <p>Because in Quebec, it's the law.  You can be fined and be charged to have the sign removed if it doesn't conform to the Language Laws. (No, I'm not kidding: French has to be at least as big if not larger than the English, among other things.)</p>
      <p>Kristina, it's a truly ugly piece of crap.  If it's any consolation, I think almost every university who looks at rebranding themselves as "hip" and "with-it" -- whatever that means! -- goes for this faux-minimalist BS, finds soon (2-3 years) that it makes their degrees look like something you'd get in a box of no-name cereal, and smartens up by going back to a traditional crest with funky logo and ad campaigns.</p>
      <p>Heck, U of C's done it more than once -- the current incarnation is, I think, the third time they've rebranded the formal crest since I started there in the early 70s.  The "new" slogan is "This Is Now".</p>
      <p>Whatever that means....  ;-(</p>
      <p>(As the Canada goose said after eating a field of green grass "this too shall pass"!)</p>
