      <p>Certainly for internal/on-campus distribution, I'd think that hard copies would be most useful, but if you consider the cost in postage to send 'em even within Canada, it could get prohibitive in a big hurry.  </p>
      <p>[As an example, I took over a newsletter almost two years ago that had been distributed exclusively in hard copy and that cost upwards of $850/year.  After converting it to pdf and email, it now runs under $200 (we still print 20 copies for the non-technos and for library archives).  And I'm talking really small (&lt;100) runs.]</p>
      <p>That being said, when I applied to grad school in 1998, it was all hard-copy and from my sources still is, but then again, Environmental Design is somewhat a law unto itself: it bestows Masters and Ph.D.s but isn't subject to the Faculty of Graduate Studies' rules (where they still decree that your thesis has to be in Courier, believe it or not!), as they are considered a "professional" faculty like Law or Medicine.  </p>
      <p>As well, I had to submit a number of forms filled in by hand throughout my program, although they did (and still do) require graduates to have some minimal computer skills.</p>
