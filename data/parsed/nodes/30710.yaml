      <p>Thing is, I don't think our switch to a bilingual logo had anything to do with the language laws. As I understand it that law has to do with signage in a public space. (But I don't really know and am now curious.) Outside the school we always used a French logo. I perhaps should check this out before saying anything, but given the incredible amount of unilingual English stuff we produce -- and I'm including huge banners inside the school announcing events, recruitment and application materials -- I doubt the French on the logo was motivated by sign laws. Also, "university" is not smaller than "université". </p>
      <p>I think it has to do with a push to make everything we produce bilingual... to attract more students? because our new president is quebecois? who knows. I'm dreading the day they decide we need to have a bilingual Academic Calendar.  </p>
      <p>Although you are right, Linda. According to the law, the English text must be smaller by a certain percentage than the French. There have been ridiculous cases with restaurant owners being fined for "illegal" beer coasters.</p>
