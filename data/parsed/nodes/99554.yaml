      <p>I'm afraid that's what I saw at first too...</p>
      <p>I think you could add a dot to the /i/ without compromising the /n/.</p>
      <p>Hiding the tail of the /g/ that way is probably not necessary, either...</p>
      <p>Then maybe downplay the connection between the /l/ and /i/, or add connections between other pairs to make that look less like a /u/ and more like a linking stroke.</p>
