  html: <p>I would like to label some doors with letters. The idea I have is to have red circles with white sans serifs capitals in them. But that is not a must, I just want them to be well made and clear. I have looked for something that is pre-made like this but with not much luck so far. Maybe this is always a bespoke product. Still, I thought maybe someone here knows a good vendor that has nice pre made ones. Thanks!</p>
  html_clean: <p>I would like to label some doors with letters. The idea I have is to have red circles with white sans serifs capitals in them. But that is not a must, I just want them to be well made and clear. I have looked for something that is pre-made like this but with not much luck so far. Maybe this is always a bespoke product. Still, I thought maybe someone here knows a good vendor that has nice pre made ones. Thanks!</p>
