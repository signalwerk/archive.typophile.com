    html: "<p>All good points! The doors are inexpensive standard american painted lightweight wood laminate office doors. The are inside, not in the weather. They are the letters: A B C D E. I thought about hand lettering but in this context I think that like a UI on a web page fancy or interesting is not what is called for. In fact the opposite. I don't think that vandalism is a big concern in this case. I think in some ways the ideal thing would be for them to be made from plastic or vitreous glass on metal. They should be simple and clean looking but not attention getting. Darrel, you are right. CNC may be the way it has to be. I will look a little more before deciding.</p>"
    html_clean: "<p>All good points! The doors are inexpensive standard american painted lightweight wood laminate office doors. The are inside, not in the weather. They are the letters: A B C D E. I thought about hand lettering but in this context I think that like a UI on a web page fancy or interesting is not what is called for. In fact the opposite. I don't think that vandalism is a big concern in this case. I think in some ways the ideal thing would be for them to be made from plastic or vitreous glass on metal. They should be simple and clean looking but not attention getting. Darrel, you are right. CNC may be the way it has to be. I will look a little more before deciding.</p>"
