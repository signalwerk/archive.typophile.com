      <p>Visit a local sign shop that specializes in interior graphics. You have an entire range of possibility including cnc routed letters and backgrounds, photo etched plastics and metals, vinyl letters on acrylic, etc. There are also some nice two layer plastics for use with engraving machines. I'm certain that they will find something to meet your aesthetic and monetary requirements.</p>
