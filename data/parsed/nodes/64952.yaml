      <p>How many of these will you need? You process can be pretty labor-intensive if you're doing a half-dozen, not if you're doing a hundred.<br>
      Will they be indoors or outdoors? What material are the doors made of (wood/metal/glass)? Are they going in a public space where they need to be vandal- and theft-proof?  How long do they need to last? Affects your choice of materials, inks/paints, and method of attaching them to the doors.</p>
