    <p>Hello,</p>
    <p>I have been working for a while on a book where I use a custom typeface. Recently I upgraded to InDesign CS5, and when I opened my book project all the spaces (especially En/Em dash) had shrunk a lot! Suddenly 2xEm dash is as narrow as maybe half of an En dash. Since the design of the book is almost finished, I really want the typeface to display as before, or else I will have to remake a lot of typesetting... Does anyone know why this happened? Can I change it somehow? Can I set these measurements somewhere in fontlab? What has changed since before?</p>
    <p>Hope that someone have knowledge about this, thanks in advance!<br>
    /<br>
    Aron</p>
