  html: |-
    <p>Hello all,</p>
    <p>I posted this in news but, in case anyone misses it, I have a solo show<br>
    at Electrik Sheep Gallery in Newcastle (UK) starting tomorrow.<br>
    It's original 'type art' and limited edition prints. Any Geordies<br>
    reading come along and say hello if you get the chance.</p>
    <p>Sneak preview of one print here:</p>
    <p><a href="http://www.youtube.com/watch?v=cVhP1J2BA5M" title="http://www.youtube.com/watch?v=cVhP1J2BA5M">http://www.youtube.com/watch?v=cVhP1J2BA5M</a></p>
    <p>Further details at <a href="http://www.seblester.co.uk" title="www.seblester.co.uk">www.seblester.co.uk</a> and <a href="http://www.electriksheep.co.uk" title="www.electriksheep.co.uk">www.electriksheep.co.uk</a></p>
    <p>Off to get a train,</p>
    <p>Seb</p>
