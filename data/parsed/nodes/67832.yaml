      <p>Well, what’s missing from the comparison above are the intermediate members that make the connection — Mr Eaves Modern (a geometric variation of the Mr Eaves sans), Mrs Eaves XL (the large x-ht version), and Mr Eaves XL (the large x-ht version of the Gillesque sans version):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mrs_5105.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/mrsans_4700.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/MrMod_4101.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/MrsXL_3482.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/MrXL_4720.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/mrmod_6516.png"></div><p></p>
      <p>&nbsp;<br>
      Derivatives can indeed wander far from the original. Think of it as Evolution. Milking past success? Most definitely.</p>
