      <p>I find this kind of thing odd. My question would be: how is this last addition part of the same family? It looks like the cap height and overall colour have been usefully matched with those of Mr and Mrs Eaves, but to me that makes it a companion face rather than a member of the same family. </p>
      <p>I'm no expert in font marketing but perhaps Modern XL would stand a better chance as a typeface in its own right: connecting it this way might actually limit its potential market. We'll see.</p>
