      <p>It's a companion face.</p>
      <p>If you're under the impression that Mr Eaves <strong>shouldn't</strong> remind you of Mrs Eaves, I think you need to reevaluate what it is you think marketing is... It's not misleading at all.. it's about as directly leading as it can be... The faces look to have a similar color and features and it's not as if they're made by different foundries...</p>
      <p>They're living in the same world. Just let them live happily, separatist klaxon.</p>
      <p>:)</p>
