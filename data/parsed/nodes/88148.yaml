      <p>I think I see what you mean. Your sample is not a dot matrix font, as most similar styles are. In yours, the dots do not line up matrix-style, but rather like they were hand-punched in order to space the dots very evenly.</p>
      <p>I seem to remember questions like this in the past, and I thought someone found a good digital version. Maybe someone else here remembers this?</p>
      <p>- Mike Yanega</p>
