      <p>I wrote this to automate the naming and fill in the TrueType Unique ID - Saves me time when I'm naming families.</p>
      <p><code><br>
      from robofab.world import CurrentFont<br>
      from robofab.interface.all.dialogs import AskString<br>
      f = CurrentFont()<br>
      #<br>
      fontName = AskString('Font Name')<br>
      Weight = AskString('Weight')<br>
      #<br>
      def naming( short, weight, weight2 ):<br>
      	f.info.familyName = fontName+" "+short<br>
      	f.info.widthName = "Normal"<br>
      	f.info.styleName = weight<br>
      	f.info.fontName = fontName.replace(' ', '')+"-"+weight2.replace(' ', '')<br>
      	f.info.fullName = fontName+" "+weight2<br>
      	f.info.menuName = fontName+" "+short<br>
      	f.info.fondName = fontName.replace(' ', '')+" "+weight2.replace(' ', '')<br>
      	f.info.otFamilyName = fontName<br>
      	f.info.otStyleName = weight2<br>
      	f.info.trademark = fontName+" "+"is a trademark of RachelR"<br>
      	f.info.ttUniqueID = "RachelR:"+" "+fontName+" "+Weight+":"+" "+"2009"<br>
      #<br>
      #<br>
      if Weight == "Thin":<br>
      	naming("Th", "Regular", "Thin")<br>
      	f.info.weightName = "Thin"<br>
      	f.info.weightValue = 250<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Light":<br>
      	naming("Lt", "Regular", "Light")<br>
      	f.info.weightName = "Light"<br>
      	f.info.weightValue = 300<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Regular":<br>
      	naming("Rg", "Regular", "Regular")<br>
      	f.info.weightName = "Regular"<br>
      	f.info.weightValue = 400<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Medium":<br>
      	naming("Lt", "Bold", "Medium")<br>
      	f.info.weightName = "Medium"<br>
      	f.info.weightValue = 500<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Bold":<br>
      	naming("Rg", "Bold" ,"Bold")<br>
      	f.info.weightName = "Bold"<br>
      	f.info.weightValue = 700<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Thin Italic":<br>
      	naming("Th", "Italic", "Thin Italic")<br>
      	f.info.weightName = "Thin"<br>
      	f.info.weightValue = 250<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Light Italic":<br>
      	naming("Lt", "Italic", "Light Italic")<br>
      	f.info.weightName = "Light"<br>
      	f.info.weightValue = 300<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Italic":<br>
      	naming("Rg", "Italic", "Italic")<br>
      	f.info.weightName = "Regular"<br>
      	f.info.weightValue = 400<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Medium Italic":<br>
      	naming("Lt", "Bold Italic", "Medium Italic")<br>
      	f.info.weightName = "Medium"<br>
      	f.info.weightValue = 500<br>
      	print f.info.fullName+" "+"Named"<br>
      elif Weight == "Bold Italic":<br>
      	naming("Rg", "Bold Italic", "Bold Italic")<br>
      	f.info.weightName = "Bold"<br>
      	f.info.weightValue = 700<br>
      	print f.info.fullName+" "+"Named"<br>
      else:<br>
      	print "Ooops that's not a weight"<br>
      	print fontName+" "+"is not named"<br>
      #<br>
      f.update()<br>
      </code></p>
