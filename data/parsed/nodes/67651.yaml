      <p><a href="/wiki/Hubert%20Jocham" class="freelinking" rel="nofollow">Hubert Jocham</a>’s <a href="http://new.myfonts.com/fonts/hubertjocham/safran/?refby=mfde" rel="nofollow">Safran</a> is another, slightly more broad-pen-flavoured option. The family spans 9 weights, and also the italics have a double-storey ‘g’.   There’s a <a href="http://www.hubertjocham.de/item.php/type/sans/SafranPro/" rel="nofollow">Pro version</a> with small caps and extended language support.<br>
