      <p>More charming by the minute!</p>
      <p>I'd make the gap between the top and bottom of the "g" a bit larger.<br>
      There's room to raise the tittles a bit.<br>
      The "k" rules, but it might give you spacing trouble. Drop the leg below the baseline?<br>
      The "v" of the "y" might benefit by being larger (taller).<br>
      Maybe lower the bar of the "A".<br>
      That white circle in the "Q" is dangerously small.<br>
      The "S" seems out of character. Funk up the serifs?</p>
      <p>Also:<br>
      1) You might want to hold off on the trapping until the very end.<br>
      2) In order to make this stand out more from the crowd (especially in the lc) have you considered making all the head serifs (like on the ascenders) that signature shape that's at the top of the caps? Maybe at least as alts?</p>
      <p>hhp</p>
