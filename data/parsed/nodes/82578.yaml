      <p>I quite like the open /Q/.<br>
      I know you envision this tight, but I think there are some glyphs where the white space gets crowded out too much, I think. For example top counter of /a/, between ball and stem of /r/, top counter of /5/.<br>
      I think the idea of putting in that characteristic terminal in the lowercase is good. But I wonder if, everywhere it appears, that shape might benefit from moving the notch sideways closer to the middle of the stem (as was discussed a bit upthread).<br>
      Counters on /W/ and especially /w/ look out of whack--relatively small above and large below--so those glyphs look "like they're wearing their pants too high" (as somebody once said about one of my letters).<br>
      (By contrast, the /g/ could stand to pull its pants up a little.)</p>
