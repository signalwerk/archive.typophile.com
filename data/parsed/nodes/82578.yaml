      <p>To my eye the straight stems seem heavier than the thicks of the bowls. So letters like /l/ seem much heavier than letters like /e/, and letters like /b/ seem unbalanced. To be optically the same, curved thicks have to be mathematically thicker.</p>
      <p>I like the concept and think it's working well. (I agree with cerulean about moving the notches.) I'll be interested to see how you treat /U/.</p>
