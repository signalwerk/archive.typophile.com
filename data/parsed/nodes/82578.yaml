      <p></p><div class="imageWrap"><img src="http://typophile.com/files/brag3_5110.jpg"></div><p></p>
      <p>New sample above with complete (for now) upper and lower case, and alternates of lower case letters with the upper case flavour spurs.  I'm quite happy with how it's progressing, at least in that I like the shapes of the individual letters.  Spacing is very hard, and I'm beginning to think it will need a lot of kerning and ligatures to look how I want it too, but...  I would like to get spacing as good as possible first (at the moment it's just very rushed spacing and no kerning) so if anyone knows of a similar font in terms of weight and serif size (ie not thin enough that serifs can overlap all that easily without looking bad) then I'd like to know so I can see how they deal with spacing.</p>
      <p>Any other points and criticism gladly accepted.  What do you think of uppercase options:  which Q is better?  I like alternate N but trying to copy that style to the M doesn't look great and the W looks horrible.  I'm thinking the middle U but with shorter serifs on top.  I prefer the normal shape without spur in its own right, but with other letters the lack of weight is very distracting.</p>
      <p>So that's it for now.  Numbers next...</p>
