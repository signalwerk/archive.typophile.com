    html: |-
      <p>Okay, mostly negatives to look at but that is usually the way of critiquing – doesn't mean it is all bad!</p>
      <p>Not sure about using Gridnik along with the other typeface. Your usage of it looks good, but doesn't go with the serif (I guess it is too old fashioned, a more modern serif would work).<br>
      Body text seems fine in terms of spacing, your standfirst (article intro) is a bit too tight in terms of leading. Not sure about starting paragraphs bold and bigger, one too many things, try either/or (and take out completely). Not sure about it being fully justified either, again it is old fashioned and can look really clumsy (eg page 8).<br>
      Use apostrophes (’), not feet marks (') (page 21 headline, between 'n' and 's').</p>
      <p>Afraid that is all I have time for, good luck!</p>
