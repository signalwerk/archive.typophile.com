    <p>Hello!</p>
    <p>I'm studying graphic design in Norway (seccond year),  currently  I'm designing a magazine about Café Racers, both the history and present.  I'm going for a stripped down, fast look.</p>
    <p>I've attached a few sample pages with typography and I would very much like to get some feedback on the typography. Does the font's fit the type of magazine, is size, spacing, kerning good? etc… </p>
    <p>Opinions on layout is also welcomed :)</p>
    <p>- Even Dragsten</p>
