      <p>You make a good observation about how delicately Baskerville sits on paper; John Baskerville created it in the 1750s for use on calendared papers, which were new at the time. 18th-Century critics wailed that it would cause blindness in readers accustomed to Caslon.<br>
      It's difficult for modern readers to understand how Baskerville could once have been so controversial. Nowadays it falls into the limbo of Transitional types, neither as graceful and warm as the Aldine types that preceded it, nor as elegant and dramatic as the Moderns that followed it.<br>
      For decades Baskerville was a workhorse for book and publication composition, though now there are many better choices. It suggests a quiet dignity, that quintessentially British virtue, and it's right for certain jobs. One of my clients used it on their holiday cards last year, and it was the perfect choice.</p>
