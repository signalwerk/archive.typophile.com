    html: <p>LT Baskerville is not a design that I think holds up well for use as copy—it’s just too light in the 8-11 point range. MT Baskerville (comes with Mac OS) is a little better but still not great. Storm’s John Baskerville and ITC New Baskerville are both much better options for text and the lighter Baskervilles can be used at display sizes. And there’s also the new Mrs. Eaves XL from Zuzana Licko, designed just for text settings, which I’ve only seen onscreen and won’t comment on further.</p>
