      <p>@James Deux<br>
      Your observation, and James' comments, should help you to understand that types listed in Type 101 books are general, and cannot replace direct observation. Text faces in particular are hard to fully understand until you see a solid chunk of text using a particular cut of a particular font family, Baskerville in this case.</p>
      <p>But you're going to have to qualify the "it’s much more readable than some of the older fonts out there" statement, since the typefaces prior to that, IMO, were much easier to read.</p>
