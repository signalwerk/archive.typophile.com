    <p>So one of the types features in my Type 101 book is Baskerville (the Linotype variety I believe...) and I really don't understand it.</p>
    <p>It certainly has appeal because it's much more readable than some of the older fonts out there, but I still am having trouble determining if its useful for (concise) paragraphs.</p>
    <p>It sits so delicately on paper that I'm also reluctant to use it for something other than a header. Thoughts?</p>
    <p>Any general advice on transitional fonts, period?</p>
