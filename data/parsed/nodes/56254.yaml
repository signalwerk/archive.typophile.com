      <p><cite>. It suggests a quiet dignity, that quintessentially British virtue</cite></p>
      <p>Now THAT is a statement I'm going to have to chew on for awhile! Which font is quintessentially Briton... that's an interesting question and it has me puzzled.</p>
      <p><cite>But you’re going to have to qualify the “it’s much more readable than some of the older fonts out there” statement, since the typefaces prior to that, IMO, were much easier to read.</cite><br>
      For my own purposes I've just done a quick comparison of Time, Adobe Garamond, and Baskerville and it becomes immediately apparent that the contrast in the strokes of BV are much greater than either of the other two fonts. For that reason, there are sizes were you can barely notice the letters are present. At least that's my theory; I haven't copyset a book with it lately!</p>
