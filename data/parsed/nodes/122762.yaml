    html: |-
      <p>Herrmann made his own tool for the purpose, which is not available for purchase but is visible in function here:</p>
      <p><a href="https://vimeo.com/6376765" title="https://vimeo.com/6376765">https://vimeo.com/6376765</a></p>
      <p>I think you can get quite far along the same styles (although in a more cumbersome way) in Photoshop, just using Gaussian blur for distance, outer glow (in layer style, set it to black for black text and darken) for overglow, and a contrast layer for contrast.</p>
