      <p>If it's a huge highway sign I can see using simulations. But for ordinary signs, why not make a mockup? Graphic designers do it routinely. And for some large signs, it's possible to mockup small portions of them to test legibility.</p>
      <p>Also legibility will vary not only with the weather but also with the viewer. Eyesight gets worse as we age. If it's a sign that's meant to be read by older folks, use some of them in the test.</p>
