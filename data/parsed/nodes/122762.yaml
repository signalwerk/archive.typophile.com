    html: |-
      <p>For signage just make a full-size mockup on paper and hang it temporarily in place. I've done it many times. </p>
      <p>If it isn't huge you may be able to print or Xerox it to size. Or project the image on cardboard (or plywood painted the appropriate color) and use marker pens or paint. It doesn't need to match exactly but should be reasonably close.</p>
      <p>The advantage of a full-size mockup is you can view it realistically from different distances, different angles, while walking, while driving, etc.  </p>
      <p>Also your client can view it along with you and sign off on the sizing.</p>
      <p>Yes it's some work, but you don't want a client buying expensive signs and then blaming you they aren't legible.</p>
