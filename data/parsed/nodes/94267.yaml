  html: |-
    <p>Does anyone have a suggestion for a body font that will pair well with a headline made in Knockout ?</p>
    <p>Preferably:<br>
    a)  a simple clean, legible sans (e.g. helvetica or news gothic)<br>
    b) a beautiful, pretty serif (e.g. sabon or georgia)</p>
    <p>The headlines will be using one of the Knockout styles 26/46/66 or 27 /47/67</p>
    <p>thankyou!</p>
