    html: <p>Those are extremely condensed faces, so whatever you use will contrast in several ways. Therefore, just about anything will work, but each in its own way—play around with leading, size and line length. This is an opportunity to become familiar with a face that you ﬁnd interesting and attractive, and develop the best setting for it vis-a-vis these very condensed styles.</p>
