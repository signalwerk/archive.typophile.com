    <p>This summer, Daniela Marx and I are co-teaching an experimental design course completely on-line.</p>
    <p>We want to see how it might be possible to teach a full studio course on design using only the internet.  Utilizing the Loyola University New Orleans Blackboard format as the administrative center, we are teaching the studio experience through reading, writing and creating with blogs, MySpace and Youtube.  The Media Services department is videotaping tutorials for us which will be uploaded to Blackboard, and, we are creating our own mini-tutorials through ScreenFlow.</p>
    <p>Each week the students have to create a digital “sketchbook” entry 5 days a week and post to their account in MySpace.  Also, we all work on a weekly collaborative project that is shared and exhibited in the class MySpace account. Each student is responsible for posting a 200 word blog in their Typophile account and for commenting on 2 peer’s blogs and 2 professional blogs weekly as well.</p>
