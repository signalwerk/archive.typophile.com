  html: <p>Does anyone have a preference between Superpolator or UFOstretch? Does anyone use both? Just curious, looking into both right now.</p>
comments:
  - id: 456491
    user: 14722
    date: 2011-03-20T12:52:00
    date_raw: 20 Mar 2011 — 12:52pm
    votes: null
    html: <p>They are very different tools. UFOStretch is for modifying subsets of characters by scaling and interpolating on a single axis. It is useful for tasks like creating small caps and figures.  Superpolator is a multi-axis interpolation tool that's mostly useful for interpolating and extrapolating entire fonts from an arbitrary number of master fonts.</p>
