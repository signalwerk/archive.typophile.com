    <p>I have been working on a freelance project for a close friend of mine. She’s starting up her own small local record label. Only problem is that out of the sketches that I showed her, this was the one that she happened to like. Three weeks later I notice that it looks phallic. Anyone have any ideas? The name of the record label is Black Catalyst Records. Long text to work with. Yet another design challenge. </p>
    <p></p><div class="imageWrap"><img src="/files/img008_3824.jpg"></div><div class="imageWrap"><img src="/files/blackcatalyst_4763.jpg"></div><p></p>
