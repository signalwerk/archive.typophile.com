    <p>I wanted to thank folks here for pointing out some great specimens, giving me some idea about what you like and for designing some great specimens. I must admit that as of a year ago I didn't even really have a clue. </p>
    <p>  This is my latest attempt. Good, bad or indifferent, please let me know what you like and/or dislike. </p>
    <p>Here are the first and last pages. If you are interested in seeing the rest you can download the pdf here...</p>
    <p><a class="freelinking external" href="http://cdn.myfonts.com/s/aw/original/42/0/21920.pdf" rel="nofollow">Eccentric French PDF</a></p>
