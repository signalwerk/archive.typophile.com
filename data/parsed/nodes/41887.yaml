    html: |-
      <p>Although Jos’ approach also works, Dan is quite right to say that this can be solved by contextual code, too. Personally, I’d consider that simpler and more elegant than adding an extra glyph, though both approaches work.</p>
      <p>So, you want the l_l ligature to take precedence over the e_l ligature. There are probably at least three ways to do this in AFDKO/FontLab code. Here’s one:</p>
      <p>ignore sub e’ l’ l<br>
      sub e l by e_l<br>
      sub l l by l_l</p>
      <p>(Note: I haven’t time to test this right now, but I *think* it should have the desired effect.</p>
      <p>Cheers,</p>
      <p>T</p>
