      <p>The problem is that ’el’ in the sequence comes before ’ll’, despite the order written in the feature code. </p>
      <p>So that means that I need to write a contextual something or another that says, “If the string el is followed by the string ll, do NOT substitute the e_l ligature.”</p>
      <p>I know it can be done, I just don’t know how to do contextual stuff.</p>
