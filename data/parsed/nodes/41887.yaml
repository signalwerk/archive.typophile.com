    <p>I’m working on a font that has multiple ligs, and I’m running into a problem. I have <code>l_l</code> and an <code>e_l</code> ligs, set up like so:</p>
    <p><code>sub l l by l_l;</code><br>
    <code>sub e l by e_l;</code></p>
    <p>Ostensibly, the order should make the <code>l_l</code> come <em>before</em> the <code>e_l</code>, but this is what I get:</p>
    <p></p><div class="imageWrap"><img src="/web/20080828095826im_/http://typophile.com/files/Picture-2_4400.png"></div><p></p>
    <p>Any suggestions?</p>
