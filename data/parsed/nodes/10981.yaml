    html: <p>I hate to see a graphic designer struggeling like that. It also reminds me of myself from some years ago.  <br>I see you start to produce a battery of logos that have no meaning. Just to change the font make no sense. <br> <br>How about something like this? I agree with the earlier posts that you, with a name like that, need no sign / swoosh or any other kind of destraction. The name for itself is strong enough and can be modified to something interesting. <br> <br><img src="http://www.typophile.com/forums/messages/29/11886.jpg" alt="YESYES by LucidDream"> <br> <br>This is just a quick sketch bases on your earlier post. I liked that font, easy, uncomplicated, but interesting. <br>My 'S' needs some plastic surgery, but I think you know what I mean. <br>Just by playing with the anatomy of the font you can, with little means, create something interesting. The first thing I do with creating logos is converting the font to vectors. Then the party really starts. <br> <br>I hope I could help you a little bit. <br> <br>Ren</p>
