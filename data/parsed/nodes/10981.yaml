    date: 2003-04-23T09:21:00
    date_raw: 23 Apr 2003 — 9:21am
    votes: null
    html: <p>I agree with JFP about the letters. The e looks like it is sticking it's chin out, and the s does seem so soft next to the semi-rigidity of the y &amp; e -- The tonality of the orange seems too dark compared to the grey. Maybe add a little more cmy to the grey. Or tone down the orange. However, if you are trying to be a friendly and service-oriented agency, and saying that with your logo, you might want to kick the saturation up a bit. <br> <br>Are you asking about the smile in your logo and why it might not be such a good thing? I'm glad you changed your colors. It did look a bit like an airline. But, I wasn't entirely opposed to the concept behind the usage.  <br> <br>Here are a couple places to visit.  <br> <br><a href="http://www.thestreet.com/tech/internet/986150.html" target="_blank">http://www.thestreet.com/tech/internet/986150.html</a> <br><a href="http://www.splorp.com/critique/" target="_blank">http://www.splorp.com/critique/</a> <br> <br>But, on the otherhand...in my opion...while some logos don't need concept...well, I think a concept is highly important. A good concept, even hinted at in your logo, can set the stage for a strong identity for the company. I'm sure I'll get shot down for saying this, but take for instance the Amazon logo. The smile that they incorporated in their logo reflects what they do for their clients (me). When I get home and see that box on my doorstep, I do smile. </p>
