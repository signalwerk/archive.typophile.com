    html: <p>I'm coming into this late so I've probably missed something. <br> <br>I like the YESYES treament. Bit of class to it. I'm assuming there is a similar reason for the idea of the "bubble dots." Instead of the crown though (reminds me of hotel signage or a soda pop logo) you might consider stressing the horizontal treatment you've already established and use them (the bubbles) as an interline rule between the two text lines. Perhaps going from small to large and then from large to small to provide a bit of a break in the tension between the lines. Keep the largest solid sphere the same size as the stem weight of the YESYES letterform, yes?  <br></p>
