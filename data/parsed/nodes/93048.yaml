  html: <p>Please help identify a font that would emulate a US Civil war era period letter style used by US newspapers (New York Times) and books or other publications of the time. Also, interested in knowing if there was an UC/lc letter style typically used for signage in public buildings of the time. I know Baskerville was used by the government for a time, but don't know if the use extended into the 1850's. I intend to use the font to carve a quote by Mr. Lincoln into wood and would like to be correct to the period. Thank you!</p>
