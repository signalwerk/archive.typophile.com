      <p>This has been a great help! As a newbie to the world of typography, reading through these and other posts has been quite educational (and mildly addictive). Since I will be carving this in flat stock, I need to use a lighter weight letter style and will need to stay away from the display or slab selections. In carving the letters, the play of light on the carved letters is one key to a good result. Carvers often work with a 60 degree v-groove to create a shadow --essentially "coloring" the letter. When working with a more open v-groove, the shadows can be washed out and make the lettering difficult to see and read. Working with a larger overall letter size and a 60 degree v-groove on a thick letter style could mean I would carve right through the piece. One of the text styles should work well, but I might need to take some artistic license and thicken up the thinner lines a bit. Now all I need to do is choose!<br>
      Thank you all.</p>
