      <p>In the mid 19th Century, newspapers were usually printed in what were then called "modern" faces, similar to Bodoni. (A 21st-Century version is <a class="freelinking external" href="http://www.myfonts.com/fonts/shinn/scotch-modern/regular/" rel="nofollow">Scotch Modern</a>).<br>
      "Modern" faces have extremely thin horizontal strokes and hairline serifs, so they'd be a b**** to carve in wood. I'd recommend some of the heavier display faces popular in Lincoln's time, such as <a class="freelinking external" href="http://www.woodentypefonts.com/Pages/egyptbld.html" rel="nofollow">Egyptian Bold</a>, <a class="freelinking external" href="http://www.identifont.com/similar?49A" rel="nofollow">Latin Bold</a>, or <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/clarendon/" rel="nofollow">Clarendon</a>.</p>
