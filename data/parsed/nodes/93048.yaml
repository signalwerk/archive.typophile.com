    html: <p>All caps sans serifs (or “Sans surryphs,” as Stephenson Blake labeled them) began showing up in the 1830s. The Egyptian Bold referenced above was alternately called Ionic, and  Clarendon came in several flavors, neither of which was quite like the sample referenced. <a href="http://www.myfonts.com/fonts/woodentypefonts/clarendon-condensed-bold/" target="_blank" rel="nofollow">English Clarendon</a> dates from around 1845, while French Clarendon—more like Barnum or Playbill—didn't arrive until around 1865. Grecian is another style which emerged in the 1840s.</p>
