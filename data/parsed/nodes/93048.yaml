      <p>Although newspapers were most often set in a Scotch Modern style of type in the early 1860s, modernized Caslons, usually called Old Style, were often used for some kinds of publications, especially books and magazines with literary pretensions. Examples of this style include Old Style 7 and Bruce Old Style.</p>
      <p>Public buildings back then tended to have much less signage than now; either you knew where you were going, or you asked someone. However, where signage was necessary, it would probably have been hand-painted by a professional sign painter. The display types that Victor and Nick have described are generally derived from sign painters' lettering; they would be much easier to carve in wood than the text faces of the era. All-cap bold sans serifs or Tuscans would have been common, with hand-painted compositions often making use of curved baselines.</p>
