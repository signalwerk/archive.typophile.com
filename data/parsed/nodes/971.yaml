post:
  id: 971
  user: 2177
  date: 2003-08-19T06:20:00
  date_raw: 19 Aug 2003 — 6:20am
  votes: null
  html: "<p>indesign users: y'all remember how easy it was to make global changes to kern pairs in qxp -- i've spoken w adobe reps &amp; they assure me that indesign will NOT have this feature in any future revs. this means that altering kern pairs has to be done at the font level, thus: <br>1. leave indesign app <br>2. turn off font in suitcase or other font manager <br>3. open font in font editor <br>4. make change(s) to font's kern pairs <br>5. turn font back on in font manager <br>6. return to indesign &amp; get back to work. <br> <br>am i missing something? can anyone offer a better method? this seems way too time-consuming and troublesome. <br>HELP! <br> <br>thanks much, folks.</p>"
  html_clean: "<p>indesign users: y'all remember how easy it was to make global changes to kern pairs in qxp -- i've spoken w adobe reps &amp; they assure me that indesign will NOT have this feature in any future revs. this means that altering kern pairs has to be done at the font level, thus: <br>1. leave indesign app <br>2. turn off font in suitcase or other font manager <br>3. open font in font editor <br>4. make change(s) to font's kern pairs <br>5. turn font back on in font manager <br>6. return to indesign &amp; get back to work. <br> <br>am i missing something? can anyone offer a better method? this seems way too time-consuming and troublesome. <br>HELP! <br> <br>thanks much, folks.</p>"
