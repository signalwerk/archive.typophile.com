    html: <p>Hrant said... <br> <br>"It's not so foolish." <br> <br>I should've said, "sounds foolish to me." <br> <br>"Spacing is a 99% technical thing (at least for text), so  <br>a really smart algorithm could do it fine. In fact, the  <br>current one in InDesign does better than 90% of type  <br>designers." <br> <br>and I suppose this smart algorithm could rely on the  <br>same advanced measures that helped you arrive at  <br>your percentages? ;) really though, I'm sure there is  <br>some magical formulaic way to decode great kerning --  <br>but who has the formula? don't you think typographers  <br>are still going to want a global override for some letter  <br>combinations? if Adobe wants to steal Quark's  <br>customers, maybe they should consider these  <br>customers' requests. <br> <br>I really should hold judgement until I am able to work  <br>further with ID (I'm still stuck with QXP here in the  <br>office). the optical kerning functions that I have seen  <br>are tremendous, and it really looks like a promising  <br>development. at the same time, I think we need to  <br>remember that there is a great deal of subjectivity to  <br>this profession and incorporate that into our  <br>applications.</p>
