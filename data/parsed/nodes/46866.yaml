      <p>Thanks for your opinions!  Adam, I’m particularly grateful for your careful suggestions. </p>
      <p>Theunis, regarding the single library: HarfBuzz implements a lot of the OpenType layout features missing from FreeType.  The software is an unglamorous bit of code shared between Pango and Qt4, with little documentation or development at the moment, but it does its job; and the developers of the two libraries (and myself, if I can be proficient enough) want to make it the standard way of doing OpenType magic across all FLOSS, even on non-FLOSS operating systems.</p>
      <p>Pango currently has almost everything sitting on the cusp of implementation.  It seems the current developers haven’t seen much demand for these features, or at least have (quite justifiably) been focusing on getting basic support for all languages before concentrating on advanced features for Latin scripts.  Currently, I’m working on finding the best way to alter the Pango API to enable access to the OpenType features; I’ve got a couple good ideas, but since Pango is used by thousands of applications, there’s probably going to be some back-and-forth before an API is settled on.  In any case, this API will allow access to and inspection of any OpenType feature listed in the OpenType specs, and will also include some short aliases in order to let non-typographically-inclined developers use “small-caps” to get real small caps.</p>
      <p>Implementing this in Pango-based applications should be relatively straightforward from that point.  The biggest challenge has nothing to do with typography, actually: the file formats will most likely have to be changed to accommodate the additional information, and that always involves a lot of testing to ensure no corruption (and backwards-compatibility, if possible).  In any case, I’ll start with Inkscape (I use it myself frequently) and move on from there.</p>
      <p>Of course, many excellent applications aren’t Pango-based (notably Scribus, OpenOffice.org, and the KOffice suite).  I’ll tackle these after working on Inkscape, along with Win32 and OSX support if it is necessary.</p>
    html_clean: |-
