      <p><cite>[..] mark, mkmk [..]</cite></p>
      <p>— that would put InDesign CS3 to shame :o)</p>
      <p>Pango uses FreeType 2.0 for drawing, doesn’t it? I was a bit disappointed by the lack of OTF support for FreeType, although that gets a fairly reasonable explanation in their documentation.</p>
      <p>A robust OTF engine should have no problem with RTL languages, although — as with some more OTF features — that overlaps with User Interface, physically drawing strings, way of data storage, etc..</p>
      <p><cite>[..]what these OpenType abbreviations mean [..]</cite></p>
      <p>I wouldn’t have no problem with selecting the correct abbreviation per feature (not being part of the “general end-user population”), but I’m pretty sure Adam didn’t mean quite that.</p>
      <p>Best would be a single general programming library that does all of the above!</p>
