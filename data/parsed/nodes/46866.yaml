    html: |-
      <p>Features that should be applied by default to simple scripts (Latin, Cyrillic, Greek etc.), even if there are no UI controls for advanced typographic features: <code>kern, mark, mkmk, mset, ccmp, rlig, liga, clig, calt</code>. If the application offers the ability to specify the language of a certain text run, also <code>locl</code>. </p>
      <p>If there are UI controls, the following should be on by default and have no UI controls to turn off: <code>kern, mark, mkmk, mset, ccmp, rlig, locl</code>. </p>
      <p>The following should be on by default but have UI controls to turn off: <code>liga, clig, calt</code>. </p>
      <p>At least the following should be off by default but should have UI controls to turn on: <code>smcp, smcp+c2sc, sups, subs, sinf, onum, lnum, tnum, pnum, salt</code>. </p>
      <p>It would be also great if the following had UI controls, off by the default, <code>frac, numr, dnom, ordn, ss01-ss20, swsh+cswh, titl, case+cpsp, dlig, hist+hlig, pcap, pcap+c2pc, unic, zero, ornm</code> as well as “positional forms” which would apply <code>isol, init, medi, fina</code> at the appropriate positions within words. </p>
      <p>Adam</p>
