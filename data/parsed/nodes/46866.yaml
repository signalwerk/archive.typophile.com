    html: <p>Pango 1.17 and newer support the locl tag. Vesion 1.x of freetype used to do this, but in version 2 the authors decided that glyph substitution and the like are better hadled a layer above. So, Pango now implements support for OpenType features itself! See brief <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Pango#Support_for_OpenType_features "> demo</a>.</p>
