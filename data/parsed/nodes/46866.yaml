    <p>Hey, all.</p>
    <p>I’m looking to improve support for OpenType features in free/open-source software.  While strong support for Unicode and internationalization is starting to appear, the more advanced features for Latin alphabets have yet to be tackled.</p>
    <p>I’m going to begin work on fixing the more glaring (and trivial) oversights, like the unimplemented support for true small caps in Pango (a library which powers a number of free programs like Inkscape). After that, however, things get more challenging—so I want to make sure I’m fulfilling the most-wanted features.</p>
    <p>A quick search indicates that free software applications aren’t widely used by members of this forum, most likely due to their inferior feature-sets when it comes to typography.  Here’s a chance to change that.  If you’ve tried Inkscape, Scribus, OpenOffice.org, or similar programs in the past, and found them wanting, please let me know what missing or broken features caused you to switch away.  If you’ve never given these applications a spin, consider doing so, and let me know what you’d like to see in them.</p>
    <p>Thanks for your help!</p>
