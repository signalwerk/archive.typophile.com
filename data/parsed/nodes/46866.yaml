      <p>Hi,</p>
      <p>Maybe a bit late to revive this old thread, but let’s try...</p>
      <p>I’ve been looking for a font rendering engine with OpenType support myself when I came across this thread. I suppose “rendering” is the wrong word, since Freetype2 already does rendering, but what is missing is a way to look up the font features that Miguel Sousa posted above.</p>
      <p>Has anybody come across any sort of open source library at all that allows something even as basic as loading the ligature table from a font?</p>
      <p>The idea would be to write a typesetting library that takes an input character string and performs all the necessary lookups in the font to create a glyph string, which then in turn will be kerned and rendered by Freetype2. I would appreciate any previous experience or information you might have on that matter.</p>
      <p>Thanks!</p>
