    <p>Today, the co-founder of ParaType, prolific type designer and teacher <strong>Vladimir Yefimov</strong> has died in Moscow. </p>
    <p>Both his original typefaces and his masterful Cyrillic extensions of existing Latin faces were truly impressive. He even attempted multi-script extensions such as that of <a href="https://lh6.googleusercontent.com/-WvheupD2B8c/Tfm4pEUhMnI/AAAAAAAAADM/SP9JVG-tKFs/s500/Picture-2-2.jpg" rel="nofollow">ITC Avant Garde</a>. </p>
    <p>Among my favorite text faces (or actually, serif screen faces) is Vladimir’s <a href="http://www.myfonts.com/fonts/paratype/octava/" rel="nofollow">Octava</a>. Matthew Carter praised Vladimir’s Cyrillic version of <a href="http://www.paratype.com/pt/pdfs/fonts/ITC_Charter.pdf" rel="nofollow">ITC Charter</a>, which I think is one of the finest Cyrillic alphabets ever designed. I was also very fond of Vladimir’s Cyrillic extension of <a href="http://www.paratype.com/pt/pdfs/fonts/Kis.pdf" rel="nofollow">Kis</a>, which John Hudson described as “one of his favourite Cyrillic text types as well as a remarkable exercise in historic imagination”. </p>
    <p>Vladimir often collaborated with other designers, many of them were his former students. One of the last projects that he participated in was the monumental <a href="http://www.paratype.com/public/" rel="nofollow">PT Sans and PT Serif</a> project. </p>
    <p>But he was not only dedicated, skillful and artistically refined — but also kind, generous, modest, warm and funny. I first met him in 1998 at the ATypI Lyon conference, and greatly enjoyed all the subsequent occasions that I could spend some time with him. </p>
    <p>It's been a great pleasure and a true privilege knowing him (a bit). </p>
    <p>Goodbye, Володя. </p>
    <p>His biography at <a href="http://www.paratype.com/help/designers/designer.asp?code=PT_EV" rel="nofollow">ParaType</a> and on his own <a href="https://profiles.google.com/VladimirJeffYefimov/about" rel="nofollow">Google+</a> account (now sadly orphaned). And some of his typefaces at <a href="http://myfonts.us/td-eO8arV" rel="nofollow">MyFonts</a>.</p>
