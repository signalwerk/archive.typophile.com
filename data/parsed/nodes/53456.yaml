    html: |-
      <p>I had a conversation about this very topic with one of my teachers yesterday. Her advice was that the first person to look at your resume will probably be someone in HR, not necessarily a design-minded person, so you shouldn't get too "cute." Just do everything you would do for a conservative text design; keep it clean, and be just as anal over the little things as you normally are. You can maybe get a little creative with your name, but not too much.</p>
      <p>I've actually seen a pretty cool design that uses a two-column layout. It's just distinctive enough to be unique, but still a bit conservative. I'm trying to work my own resume into that sort of design now, but I don't think I have enough content to warrant it.</p>
      <p>Oh, and do it in InDesign, not Word.</p>
    html_clean: |-
