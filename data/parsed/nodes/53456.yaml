    <p>Hello all:</p>
    <p>I need inspiration— really bad!</p>
    <p>A case of designers block.</p>
    <p>I can find great business cards, brochures, annual reports, and even a fabulous poster here and there.</p>
    <p>But...</p>
    <p>I can’t seem to find résumé designs that are not tacky or from MS Word templates.</p>
    <p>I would like see designs from actual graphic designers.</p>
    <p>Please post links and images if you can.</p>
    <p>Mikey Diaz :o)</p>
