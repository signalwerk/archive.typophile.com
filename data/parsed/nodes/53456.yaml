      <p>I'm on the job hunt these days and have two resumes. My pretty PDF that I tend to send to design firms and the plain Jane .doc file that I tend to send to more IT related firms and recruiters.</p>
      <p>I had a recruiter the other day say that "Oh, can you send me the nice version with the graphics and stuff?". It's nice to be reminded that, at least when put side-by-side, people do notice the better designed piece. </p>
      <p>I guess my next challenge is to make my .doc resume a bit more 'designed'.</p>
