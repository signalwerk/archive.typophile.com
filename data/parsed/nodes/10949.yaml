  html: <p> looking for suggestions on what fonts (sans-serif) to use for on-screen anti-aliased use at small type sizes (10-12pts). <br> <br>any ideas? <br> <br>I know aliased faces such as from miniml or silkscreen, mini 7, sevenet would all be much more readable, but I really need to find an anti-aliased font to use at those small sizes as well.... are there any that have been designed for on screen use? </p>
  html_clean: <p> looking for suggestions on what fonts (sans-serif) to use for on-screen anti-aliased use at small type sizes (10-12pts). <br> <br>any ideas? <br> <br>I know aliased faces such as from miniml or silkscreen, mini 7, sevenet would all be much more readable, but I really need to find an anti-aliased font to use at those small sizes as well.... are there any that have been designed for on screen use? </p>
