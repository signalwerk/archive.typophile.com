  - id: 150136
    user: 1160
    date: 2002-02-26T21:44:00
    date_raw: 26 Feb 2002 — 9:44pm
    votes: null
    html: "<p> Many faces work at that size on screen, provided  <br>you lean toward the bold/medium/demi/heavy side.  <br>Avoid stuff with lots of fine details or  counters  that <br>tend to fill in. Thus Meta and Univers work well. <br>Even Caflisch Script holds up nicely. <br> <br>Curious: do you need anti-aliased fonts because  <br>they need to work in Flash? (There are  <br>Flash-ready bitmaps out there... fyi.) <br> <br>If it's for PhotoShop, recent versions have  <br>multiple settings for anti-aliasing--very handy  <br>when it comes to maximizing readability. </p>"
    html_clean: "<p> Many faces work at that size on screen, provided  <br>you lean toward the bold/medium/demi/heavy side.  <br>Avoid stuff with lots of fine details or  counters  that <br>tend to fill in. Thus Meta and Univers work well. <br>Even Caflisch Script holds up nicely. <br> <br>Curious: do you need anti-aliased fonts because  <br>they need to work in Flash? (There are  <br>Flash-ready bitmaps out there... fyi.) <br> <br>If it's for PhotoShop, recent versions have  <br>multiple settings for anti-aliasing--very handy  <br>when it comes to maximizing readability. </p>"
