    html: "<p>I used to use Poppl-Laudatio for many years, and I still like it (not least because you can also use it large on the same \"page\", since it has a lot of visual interest), but then to my pleasant surprise I found that Rotis (specifically the Sans Ultra Bold) is simply *amazing* at the tiniest sizes! <br> <br>Here's how: <a href=\"http://www.themicrofoundry.com/other/rotis_12.gif\" target=\"_top\">http://www.themicrofoundry.com/other/rotis_12.gif</a> <br> <br>hhp</p>"
