    html: "<p> Thanks for the suggestions! <br> <br>Yup. This is for Flash use, but it's not because it's a workaround. (I know there are fonts designed to stay aliased in flash). <br> <br>A few of my explorations have turned up the following fonts that render very well: <br> <br>Linotype Fruitger NEXT <br>Linotype Univers <br>FF Balance <br>FF Kievit <br> <br>I also want to test out Linotype Compatil, but I currently don't have a copy. Anyone with experience in using this font for screen? </p>"
