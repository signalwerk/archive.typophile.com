      <p>This is obviously custom work by <a href="http://en.wikipedia.org/wiki/Herb_Lubalin" rel="nofollow">Herb Lubalin</a>. I don’t know where it originally appeared. I doubt this form has made it into a font. You might like the ampersand in Pistilli Roman, <a href="http://blog.fayeandco.com/2009/04/pistilli-realized/" rel="nofollow">recently revived as Eloquent</a>.<br>
      F</p>
