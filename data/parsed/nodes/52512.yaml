    <p>Hi all</p>
    <p>I don’t know if I will express myself well about this.</p>
    <p>The question is, I’m using image/text placeholders on masters pages, that I used to place contents in the document pages. I supposed this way I would be able to move the contents later using that frames placed in the masters. Until now is working fine and I can move things around controlling them from the master pages frames.</p>
    <p>The problem comes when I add or move pages in the document, and the links between the page contents and master frames get broken.<br>
    I’m using facing pages layout, and it seems to me that if i had started working with single pages layout this problem wouldn’t occur.</p>
    <p>I’ve been reading some tutorials but couldn’t find any answer on this.</p>
    <p>Hope someone understands what I’m saying</p>
    <p>Any help will be much appreciated<br>
    Regards</p>
