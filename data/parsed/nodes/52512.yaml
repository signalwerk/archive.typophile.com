      <p>Kiko, I think I understand the problem, but I’m not sure I have the solution. The frames on pages lose the links to their corresponding Master frames when the page moves, due to adding or moving pages. </p>
      <p>I believe it only happens if, in the process of adjusting pages, any given page moves from being a Right to being a Left (or vice versa), even if only for a moment while other pages are being moved or added. Are you moving/adding in complete spreads only?</p>
      <p>I think the solution may have to do with *disabling* the Allow Pages to Shuffle command in the Pages palette. This makes it so that Right cannot become Left or vice-versa. And I think it will prevent your problem from happening. Just be sure you don’t end up with single, floating pages in the middle of your booklet.</p>
      <p>On the other hand, if you’re changing a Right to a Left, or a Left to a Right, on purpose, then there’s no solution, as it will then always break from the Master.</p>
      <p>HTH</p>
      <p>— K.</p>
