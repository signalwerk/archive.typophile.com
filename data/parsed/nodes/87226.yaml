    html: |-
      <p>I scaled your image down 50%. It might have just been too big to load before.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3beUD_5832.jpg"></div><p></p>
      <p>Definitely not Art Deco. It's a Victorian style that probably pre-dates the more fluid look of Art Nouveau.</p>
      <p>The spirals made me think of <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/kismet/" rel="nofollow">Kismet</a>, but that is rounder, or <a class="freelinking external" href="http://new.myfonts.com/fonts/solotype/penelope/" rel="nofollow">Penelope</a>, but that is squarer. If you click on Solotype, in the publisher credit of Penelope, you might find something closer. The B looks familiar but I think the rest is either modified or 100% custom.</p>
