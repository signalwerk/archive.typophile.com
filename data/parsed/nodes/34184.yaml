    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 1.Jun.2007 11.26am </div>
      <p>For Immediate Release:<br>
    Buffalo, NY, June 1, 2007:</p>
    <p>P22 and the Lanston Type Company proudly announce LTC Obelysk Grotesk.</p>
    <p>Obelysk Grotesk was originally released by the Lanston Drawing Office in the late 1980s as “Obelisk Gothic”. This face is a reconstruction of Spire (1937) drawn by Sol Hess. The skeleton of Spire Roman stands with the serifs removed. Like Spire, this font has no lower case, but does offer alternate cap styles in some of the lower case positions. Spire and Obelisk have both been use prominently in the fashion industry.</p>
    <p><a href="http://www.p22.com">http://www.p22.com</a><br>
    <a href="http://www.p22.com/lanston/products/obelysk.html">http://www.p22.com/lanston/products/obelysk.html</a></p>
    <p></p><div class="imageWrap"><img src="/files/obelyskgrotesk_6183.gif"></div><p></p>
