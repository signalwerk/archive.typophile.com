    <p>Hello,</p>
    <p>I posted a thread a few days ago with two logos in it. I decided to redo one.</p>
    <p>This is for a production company that makes action b-movies. We decided to make it look as serious as possible even thought the movies are made for fun.</p>
    <p>I've haven't really found a font that I like yet. So I thought that some of you might have some suggestions. The two fonts I've used here are Utopia and Sabon.</p>
    <p>Utopia makes it look like a newspaper logo :)</p>
