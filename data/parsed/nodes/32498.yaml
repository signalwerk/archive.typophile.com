      <p>&gt;and remove the sprocket holes on the top side</p>
      <p>Well, technically that would be right, however, for ease-of-recognition purposes you might keep them in and just rotate the area, nearly every image representing film uses two sets of sprocket holes and the general public will recognise that best. A photographic image might be best if you can achieve it. When considering the ‘emptyiness’ try reducing the logo to the size it might appear on a business card before you add to it and make it too busy.</p>
      <p>Tim</p>
