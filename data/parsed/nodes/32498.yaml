    html: |-
      <p>The first thing to do is get the proportions of the strip correct, landscape rather than square, sprocket holes on the short sides, and add some flexibility to it.<br>
      <a href="http://en.wikipedia.org/wiki/Image:The_Kiss_1896_Film_Strip.jpg" title="http://en.wikipedia.org/wiki/Image:The_Kiss_1896_Film_Strip.jpg">http://en.wikipedia.org/wiki/Image:The_Kiss_1896_Film_Strip.jpg</a></p>
      <p><a href="http://www.swish-db.com/tutorials/view.php/tid/628" title="http://www.swish-db.com/tutorials/view.php/tid/628">http://www.swish-db.com/tutorials/view.php/tid/628</a></p>
      <p>Probably not as much flex as the photoshop tutorial, just enough to stop it looking ladderish. I would stick with the vertical format the horizontal is (even in the current digital camera boom) too like stills film.</p>
      <p>If you have the opportunity, try jamming some film in a projector, the heat of the bulb melts stationary film, and take shots of the screen as it goes – quite spectacular, (unless it’s a major part of your final degree show then it’s heartbreaking).</p>
      <p>You could also try animating the explosion or a spark travelling along the fuse before exploding from the frame, I see that following the name of the company.</p>
      <p>Tim</p>
    html_clean: |-
