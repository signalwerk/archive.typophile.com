      <p>In the USA, one generally found Linos in newspaper composing rooms and commercial printers, while Monotype was found more often in book composition shops. But there was a further split in which book shops used which machine. Book composing rooms that worked more with scholarly work and high-end work more often used Monotypes. Really big composing rooms used both. I am resting my left elbow on the 3-volume set of Kingsport Press type specimen books (no date, dang it). The Lino book has many more pages than the Mono. The pagination is weird, and there's not enough lunch-hour time for me to do the counts. (The 3rd volume is display, with types from many foundries, as well as Mono and Ludlow faces.)</p>
      <p>Lino was much easier to handle at the composing bank and to lock up on the stone. A line 'o type could contain 65 characters and spaces, all set into one piece of metal. For the Mono, that same line would have 65 individual metal sorts. The ease is obvious. Mono was a bitch to get to lift if the forme had lots of cuts or mitred boxes or if the Mono had been poorly worked by the bankman.</p>
      <p>Mono faces could have more elegant kerns than Lino faces. The same degree of kerning beauty could be achieved with some Lino faces, but the machine guy had to insert special mats ("side sorts") by hand.</p>
      <p>Mono faces also allowed for much easier insertion of odd sorts in the line. If a sort could not be placed in a Lino slug on the machine, the slug was cut up and space cut out for the insertion. With Mono, the keyboard operator could insert bogus type to the correct width. The bankman then removed that deadwood and dropped in the appropriate Chinese, Greek, Coptic, or whatever sorts were needed. See my point about scholarly work?</p>
      <p>One also tended to find Lino more common in the USA, and Mono in the UK (and its colonies). There was an American Mono manufacturer, as well as several European manufacturers of Linos [or rip-offs thereof in the Soviet Union; maybe they ripped off the Mono design also. I don't know).</p>
      <p>On press, Lino was easier to makeready. Again: a factor of the number of pieces of metal in the forme, hitting the paper.</p>
      <p>Each system had its flaws. I was in a shop in Missoula a few days and was astonished that the Lino slugs were not the same thickness at the right end as the left. By a small amount. But when locking up 40 lines in a page, the difference was terrible. Lots of thin paper spaces had to be inserted. Monotype was subject to the phenomenon known as "bottle-assed type," which I think was discussed here some time back.</p>
      <p>There is nothing like the fearsome beauty of a 9" x 12" page of 8/10 Monotype in two columns. Maybe 9000 sorts, all gleaming, asking for a neat coat of ink. All tied up with string, demanding to be handled sweetly lest it collapse. </p>
      <p>I hope this helps you think about this.</p>
      <p>powers</p>
