      <p>Linotype "slugs were easy to handle, but less easy to correct, and Linotypes were more commonly used for setting newspapers than books....The Monotype ... cast separate sorts, and so it could be used for both text setting and for filling cases for hand-setting; and corrections were simpler than with Linotype slugs." S. Carter, 20c Type Designers, pp. 16-17.</p>
      <p>My impression is that printers would invest in one or the other system but not both, though either might be paired with a Ludlow typograph for larger letters.</p>
