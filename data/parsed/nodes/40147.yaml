  html: <p>In the days when casting was done with these machines, were they ever in competition for efficiency? was one better to work with than the other in being thrifty with time and cost? i can see the benefits of having both a line of type and an individual piece of type but was one used more frequently than the other or in conjunction similar to display faces vs. text faces collaborating together to make a nice layout? forgive me if i've confused the whole process altogether as my knowledge is limited to a few really great books I read a couple of years ago.</p>
