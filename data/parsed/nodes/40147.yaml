      <p>Linotype was more efficient, yes. However, a lot of a typesetter's finesse went out the window with the slug-set line. No more brasses, coppers, and paper thins. No attention allowed to be given to the fine art of letterspacing. If compositors ever paid attention to these details in the first place, their expertise was no longer in demand. I suspect that there were few who cared too terribly much, just as your average Joe desktop publishers (and some lesser designers) don't really pay attention to those details today. Either way, I'd guess that Linotype could be credited with squelching any momentum that existed regarding the art of fine typesetting in the commercial world.</p>
      <p>Both were created with softer metal than ATF type and therefore, by nature, were often used once and then tossed in the melting pot for recasting. Say hello to recycling and good bye to the unwinding meditative practice of type distribution. As is the custom, efficiency and profit took precedence over fine craft for the masses.</p>
