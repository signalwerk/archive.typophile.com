    html: <p>Matt has pretty much said it all. The University of Toronto Press (book publisher) used monotypes (long before I showed up there). Apparently they could do multiline maths (think of your college physics or calculus text). But every newspaper I knew used Linotypes, or the cheaper clone, Intertype.</p>
