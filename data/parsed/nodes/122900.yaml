    html: |-
      <p>Preferences &gt; Glyph window &gt; Dimensions</p>
      <p>That will bring you to a dialogue box were you can enter the "Grid step." I'm assuming that this is what you're after. There's also the more fundamental grid that everything aligns to that's determined by the font's UPM size.</p>
