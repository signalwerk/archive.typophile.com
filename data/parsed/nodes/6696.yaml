    html: <p>The hyphen/female symbol is interesting, though your solution is unbalanced. What if you simply made the t a plus sign and kerned it flush to the o. That way you get the hyphen (sort of) and the symbol. <br> <br>Alternatively, you could shift the baseline on the word ture enough so the crossbar froms the plus on the o. The shifted baseline would give the word distinction, but wouldn't be too unbalanced. <br> <br>I think the second idea is the better of the two. <br> <br>Good luck!</p>
