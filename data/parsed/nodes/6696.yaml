  html: <p>Hi everybody, <br>my sister asked me to design a logo for her new company, selling fashionable clothes for women during pregnancy.  she chose the name, so i can't change that, and i have to work with the hyphen, because if it were just cooture (and not coo-ture), it would look wrong.  (it's supposed to play off couture, but with the word "coo," like baby talk) <br> <br>anyway, i'm having trouble with it. if you have any suggestions, i would really appreciate it. <br><img src="http://www.typophile.com/forums/messages/29/49049.gif" alt="two cooture logos"></p>
