    <p>The monospace font <a href="http://www.schriftgestaltung.de/index.php?inhalt=Schriften&amp;seite=OlivegreenMono" rel="nofollow">Olivegreen Mono Light</a> by <a href="http://www.reets.de" rel="nofollow">Georg Seifert</a> is on a 100% discount for the next 45 days, available immediately from <a href="http://www.myfonts.com/fonts/schriftgestaltung/olive-green-mono" rel="nofollow">myFont.com</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/olivegreen_freefont_420_3830.jpg"></div><p></p>
    <p>The rather upright geometric design of the monospace font is contrasted with the very vibrant, playful italic.</p>
    <p>Schriftgetaltung.de [germ, Typedesign] is a small foundry that published fonts by Georg Seifert and offers a platform for friends to present their own fonts.</p>
    <ul>
    <li>Specimen: <a href="http://www.Schriftgestaltung.de/seite/Schriften/OliveGreenMonoSpezimen.pdf" rel="nofollow">Schriftgestaltung.de/seite/Schriften/OliveGreenMonoSpezimen.pdf</a></li>
    <li>Purchase: <a href="http://www.myfonts.com/fonts/schriftgestaltung/olive-green-mono" rel="nofollow">myFonts.com/fonts/schriftgestaltung/olive-green-mono</a></li>
    <li>Georg Seifert’s Website: <a href="http://www.reets.de" rel="nofollow">reets.de</a></li>
    </ul>
