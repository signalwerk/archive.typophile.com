      <p><a href="http://typophile.com/node/19680" title="http://typophile.com/node/19680">http://typophile.com/node/19680</a></p>
      <p><a href="http://typophile.com/node/27803" title="http://typophile.com/node/27803">http://typophile.com/node/27803</a></p>
      <p>A couple of threads with suggestions for elegant, luxury typefaces, I think a script would create the competition that you want to avoid.</p>
      <p>Looking at your mark I wonder if those scissors aren't a bit strong for the rest of the mark, they seem a little more like paper-cutting, general purpose scissors than hair-cutting which are thinner and more pointed. Maybe with a bit more detail to work with the swashy shield rather than silhouette. In terms of usefulness, I mean printing well at most sizes, I would consider placing the type outside the shield, below or to the side possibly. Your kerning looks good (difficult to see at the small size of you post) ALO is always going to present problems kerning, essentially what you are trying to achieve is to have visually similar spaces between characters, a good practice is to view the setting with a squint so you can see the spacing as a blur you should be able to pick out particularly dark or light areas.</p>
      <p>Tim</p>
