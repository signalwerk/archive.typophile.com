    html: <p>Tobias, <br> <br>I like it, really. But if you ask me personally, I think it's the kind of font that anyone can make. If you understand the basics it's kinda 'easy'. It still means that you did a great job and I think you should finish it. It's worth it. <br> <br>What do you 'want' with this font? Is it made for a client, as an experiment, or just for fun? I personally miss something exotic (if that's the right word), something that makes this font stand out from the rest. Maybe try to put something of your own personality in, make it yours. You've come this far, so it's perhaps not possible.  <br> <br>I only speak for myself, don't see this as negative critics on your font, which is a good job. <br> <br>Regards, <br></p>
