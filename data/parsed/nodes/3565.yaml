    html: <p>It's very clean. I only noticed a couple of things I would change.  <br> <br>-The arm on the r needs a little more weight. <br>-You may want to make the bowl smaller on the g to give more room between it and the lower arm. <br>-The spine on the s could be smoother. <br>-On the base curve of the t and top curve of the f, I would make them a bit more subtle to work more with the rest of the font. <br>-Maybe try something different with the z. <br> <br>I think it has potential, it's very simple and neat. Bring on the uppercase.</p>
