    html: <p>The contrast looks ok. You will probably have to increase the difference between the thicks and thins if you do bolder weights.  <br> <br>The contrast of the v, w, and x look ok. They look a bit weak where the strokes meet though. You may want to move the strokes in closer to each other before removing the overlap, if that makes sense.</p>
