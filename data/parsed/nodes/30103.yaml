    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : Elementos do Estilo Tipográfico</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/3167661_4618.jpg"></div><br>
    Escrita, projetada e composta pelo tipógrafo, ensaísta e poeta norte-americano <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a>, esta obra reúne e discute em profundidade os conhecimentos que a história da tipografia ocidental transformou em tradição ao longo dos últimos 600 anos, respaldado por uma linguagem deliciosamente acessível, que a tornou uma unanimidade entre os designers gráficos do mundo inteiro. O título é inspirado em conceitos do filósofo <a href="/wiki/Walter%20Benjamin" class="freelinking" rel="nofollow">Walter Benjamin</a>.<p></p>
