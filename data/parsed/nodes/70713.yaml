    html: |-
      <p>@ Karsten</p>
      <p>I don’t directly contradict to you, but I would like to complement:</p>
      <p>1. In my opinion it is better to program the features in a text editor. I comment my features. If I import them in FontLab, it depends on the position of comments (before or after a feature), where they are displayed on the feature panel. Sometimes a comment is regarding to a group of features. But in FontLab it looks like the comment is regarding to one feature only.</p>
      <p>2. The languagesystem statement "DFLT dflt". FontLab is not able to compile it, isn’t it?</p>
      <p>3. Stylistic set features and names for stylistic set ('ss01 - ss20') features are cool, but not supported by FontLab.</p>
      <p>4. If you use the AFDKO only, if FontLab does not support a special thing, you need more time to make use of the AFDKO, when you need it. So why not directly use it? (The training aspect.) Doing anything from the command line is wrongly scaring for many people, because it is not difficult, but just a bit unwonted. It is not a loss, but a win of comfort, if you learn how to use the command line and how to program batch files.</p>
      <p>5. The AFDKO is free software and partly OpenSource. If you have not FontLab, but TypeTool or another font editor only, that is unable to compile features, you have to use the AFDKO, if you want to put OT features into your font. I would say, that the syntax, as it is expected by the AFDKO should be the standard, when code snippets are posted here. As more people use the AFDKO, as more people explore its possibilities. When others wait for a new version of FontLab with a later version of an OT compiler, you and me always have the latest. The AFDKO furthers the competition between the developers of software.</p>
