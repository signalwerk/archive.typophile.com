      <p>Yes, I would contact Gerard, and also Jean François Porchez.</p>
      <p>Are you familiar with the <a href="http://www.rencontresdelure.org/" rel="nofollow">Rencontres de Lure</a> gatherings in the foothills of the French Alps, which have been a cornerstone of French typographic culture since 1951? Excoffon used to attend, as did many people who knew and worked with him. Of course, most if not all of that generation is now gone, but there may still be people involved who met him.</p>
