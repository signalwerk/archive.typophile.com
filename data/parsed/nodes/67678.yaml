    <p>Hello everyone,</p>
    <p>I am currently writing a major book about the life and work of Roger Excoffon, that will be published by Atelier Perrousseaux in french and english at the spring 2011. It will feature a never-published before interview of Excoffon, participations by designers and friends such as Jose Mendoza y Almeida, an introduction by Massin, and a lot of high quality visuals. I have acquired an important iconography, but I am still missing some items, so I need your help.</p>
    <p>If you have ANY documents regarding Roger Excoffon (type specimen, metal fonts, drawings, letters, photographs...), I would be glad to hear about it; any photograph or scan provided would of course be aknowledged, and a copy of the book would be on your way as soon as it's released.</p>
    <p>Many thanks in advance,<br>
    David Rault</p>
