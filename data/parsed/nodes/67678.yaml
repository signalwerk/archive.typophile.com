      <p>Miss Tiffany: it will be big, thick, printed on a white matte paper, full of never-seen before texts and great illustrations - but unfortunately, it's very, very hard to locate good documents, for most of them basically disappeared. I am working as hard as possible to retrieve everything I can. I will contact Gerard Unger; in order to save time, would you by any chance have an email where I could reach him?</p>
      <p>John: I did contact Jean-Francois, he will actually participate to the book as well. I am very familiar with the Rencontres de Lure, I was actually in Lurs a few month ago, at Francois Richaudeau's house, overlooking the very house of Roger Excoffon. As you said, most of them are now gone, and I contacted the few remaining ones without much success, apart from Yves Perrousseaux and Jose Mendoza y Almeida.</p>
      <p>Wolfgang: I did send an email to Sebastien Morlighem, and am now waiting for an answer.</p>
      <p>Thanks to everyone,<br>
      david</p>
