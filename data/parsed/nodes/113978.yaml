    <p>Hey guys, i'm going nuts trying to figure out what this font is. I've used Identifont and WhatTheFont with no success.</p>
    <p>Here's a screenshot:<br>
    <a class="freelinking external" href="http://cl.ly/image/1y0E2Q1H0f3O" rel="nofollow">http://cl.ly/image/1y0E2Q1H0f3O</a></p>
    <p>It's also used hear, and you can type in and see all different letters:<br>
    <a class="freelinking external" href="http://www.thestationerystudio.com/index.cfm?fuseaction=catalog.viewProduct&amp;productId=38782&amp;catId=1175" rel="nofollow">http://www.thestationerystudio.com/index.cfm?fuseaction=catalog.viewProduct&amp;productId=38782&amp;catId=1175</a></p>
    <p>I'm getting married, and someone bought us these as an engagement gift. I'd love to make other things match if I can figure out what it is!</p>
    <p>Thanks,<br>
    Matthew</p>
