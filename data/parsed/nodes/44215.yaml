    html: <p>Right. Not a tilde. That’s what I was thinking. I recognize it now as a mathematical symbol for similarity. In fact, I feel sort of dumb for not recognizing that without posting this post. I can also imagine it used as a symbol of repetition. Certainly not a hyphen, dash, or worst of all, a bullet. Thanks for answers.</p>
