      <p>Bringhurst has it as a <em>swung dash</em>, despite it being named <em>asciitilde</em> in a digital font. He says,</p>
      <p>“A stock keyboard character used in mathematics as the sign of similarity (a ~ b) and lexicography as a sign of repetition. [...] Not to be confused with the tilde.”</p>
