    <p>This thing makes me nuts: ~.</p>
    <p>This “sort” was never a part of the ol’ California job case, and I’m wondering where it came from, what it represents, and whether or not it should ever be employed as an alternative for a hyphen, en, or em dash.</p>
    <p>I see it (mis?)-used more than I’d like to see it (at all), and I’d love to have some ammunition to stop the madness.</p>
    <p>Please excuse me for not investigating this elsewhere (Chicago Manual of Style?) and taking the easy way out by asking the ’philes.</p>
