      <p>I think they probably used Garamond Light Italic (Ludlow) and and Swash ones for the 'A' and 'R' for the inside title, and <a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/american-garamond/" rel="nofollow">American Garamond</a> for the text is a good possibility....</p>
