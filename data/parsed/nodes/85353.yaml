    html: "<p>WINE ROUTE isn't Empire, which is more monoline. The thick-thin thing was pioneered by Radiant, though if I remember rightly it was originally a sign painter's thing, and this I think is a condensed version, like this later version: <a class=\"freelinking external\" href=\"http://www.identifont.com/list?2+radiant+8+7OJ+1+8YT+1+65M+1+5C0+1+8RX+1+7FZ+1+8RZ+1+5AJ+1+5AK+1+5AL+1+6IV+1\" rel=\"nofollow\">Radiant Extra Condensed Light</a>.</p>"
