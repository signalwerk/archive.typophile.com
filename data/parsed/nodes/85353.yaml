    <p>Heeeelp! I really need to identify several different typefaces from a book. it's a 1988 release, printed using offset lithography method.<br>
    *Sorry for using photobucket, The file attacher just won't do the job...</p>
    <p>1. What are the names of these two different display typefaces? (for the word "Adventures" and "Wine Route")<br>
    <a href="http://i297.photobucket.com/albums/mm224/shinnggo/Title.jpg" title="http://i297.photobucket.com/albums/mm224/shinnggo/Title.jpg">http://i297.photobucket.com/albums/mm224/shinnggo/Title.jpg</a></p>
    <p>2. What are the names of the swash serif used for the on the word "Advetures" and "Wine Route"?<br>
    <a href="http://i297.photobucket.com/albums/mm224/shinnggo/Insidetitle.jpg" title="http://i297.photobucket.com/albums/mm224/shinnggo/Insidetitle.jpg">http://i297.photobucket.com/albums/mm224/shinnggo/Insidetitle.jpg</a></p>
    <p>3. What are the names of the serif on the for the body text? it's quite a heavy (but not too much) for a body text with a dark font colour.<br>
    <a href="http://i297.photobucket.com/albums/mm224/shinnggo/Bodytext.jpg" title="http://i297.photobucket.com/albums/mm224/shinnggo/Bodytext.jpg">http://i297.photobucket.com/albums/mm224/shinnggo/Bodytext.jpg</a></p>
    <p>Any help will be greatly appreciated, thanks in advance!</p>
