    html: |-
      <p>All the serif stuff is Garamond, and at that date would have been photo type. I'm not sure which Garamond. An "earmark" of Garamond is the angled serif on the left of the T and vertical on the right of the T. </p>
      <p>Just checking further the "Adventures," which has some lovely swash characters, seems to be Ludlow Garamond, though I'm assuming it would have been a photo version. The rest may well be a different version of Garamond.</p>
