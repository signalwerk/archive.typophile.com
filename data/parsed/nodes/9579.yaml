    html: <p>Your point in earlier mails seems to be that fonts can’t be copyrighted, despite the fact that courts have supported font copyright.  <br><br>But the above case, even if true, seems to relate purely to trademarks. The fact that font vendors go to extreme measures to avoid using or referencing other people’s trademarks is understandable. Trademarks add more protectability to 100 year old designs than copyright, design patent, <span class="caps">EULA</span>s and big sticks combined. <br><br>Even if it turns out that copyright strings in fonts are worthless, I think including them sends a good message to the uninformed that the font isn’t public-domain and was probably provided under some kind of license.  <br><br>Cheers,&nbsp;Si</p>
