  html: '<p>Regarding LinoLetter 03/05 — “Designs Determined to Inspire” uploaded by Mr. Thorsten Weil on 3rd March 2005 to this Typophile forum, I would like to add the following remarks to Section 2 on “Basic Commercial”: <br><br>     2. The Typeface in the New York Subway System — Basic Commercial <br><br>     As far as sans serif text faces go, you’ll always be on the <br>     safe side with this old favorite: the Basic Commercial font <br>     family epitomizes clear and objective design. These classic <br>     forms have very few unusual qualities, and remain both <br>     lively and legible in all weights. Perhaps this anonymity is <br>     the reason that Basic Commercial’s style has been popular <br>     with graphic designers for decades! <br><br>     Basic Commercial’s design has a century’s worth of history <br>     behind it. The typeface was distributed for many years in <br>     the United States under the name Standard Series, where it <br>     worked its way into many aspects of daily life and culture: <br>     for instance, it was the face chosen for use in the New <br>     York City subway system’s signage.  <br><br>     Grab all eight Basic Commercial font styles together in one <br>     low-price value pack:  <br><a href="http://www.linotype.com/6-2387-6/basiccommercialvp.html" target="_blank">http://www.linotype.com/6-2387-6/basiccommercialvp.html</a> <br><br><br>1) “Akzidenz Grotesk” by Adobe <br><br>More than 15 years ago, in 1989, Adobo published the font “Akzidenz Grotesk” with the following copyright notice: <br><br>“Copyright (c) 1989 Adobe Systems Incorporated. All Rights Reserved. The digitally encoded machine readable software for producing the Typefaces licensed to you is copyrighted (c) 1989 Adobe Systems. This software is the property of Adobe Systems Incorporated and its licensors, and may not be reproduced, used, displayed, modiﬁed, disclosed or transferred without the express written approval of Adobe.” <br><br>Mr. Thomas Phinney of Adobe Inc. contends with reference to this Adobe copyright notice that it was Adobe that created in the year 1989 this “font software program” as “original work of authorship”. <br><br><br>2) “Basic Commercial” by Linotype <br><br>About 5 years ago, in 2000, Linotype published exactly the same font. “Exactly the same” means that both fonts (Adobe’s “Akzidenz Grotesk” and Linotype’s “Basic Commercial”) have completely identical glyphs and that both fonts are completely identical “font software programs”. <br><br>However, in the “Basic Commercial”, Adobe’s copyright notice was removed and replaced by this notice: <br><br>“Copyright (c) 2000, 2002, 2003 Linotype Library GmbH, <a href="http://www.linotype.com" target="_blank">www.linotype.com</a>. All rights reserved. This software may not be reproduced, used, displayed, modiﬁed, disclosed or transferred without the express written approval of Linotype Library GmbH. Basic Commercial is a trademark of Heidelberger Druckmaschinen <span class="caps">AG</span> which may be registered in certain jurisdictions, exclusively licensed through Linotype Library GmbH, a wholly owned subsidiary of Heidelberger Druckmaschinen <span class="caps">AG</span>. This typeface is original artwork of Morris Fuller Benton. The design may be protected in certain jurisdictions.” <br><br>Mr. Bruno Steinert of Linotype GmbH contends with reference to this Linotype copyright notice that it was Linotype that created in the year 2000, i.e. 11 years later, this “font software program” as “original work of authorship”. <br><br>Is it possible that Linotype, more than 10 years later and completely independently created a “font software program” that is hundred percent identical with a “font software program” created by Adobe more than 10 years ago&nbsp;??? <br><br><br>3) Morris Fuller Benton <br><br>Bruno Steinert of Linotype contends with reference to “Basic Commercial”: <br><br>    “This typeface is original artwork of Morris Fuller Benton.” <br><br>For instance at the website <br><br><a href="http://www.myfonts.com/fonts/linotype/basic-commercial-lt/" target="_blank">http://www.myfonts.com/fonts/linotype/basic-commercial-lt/</a> <br><br>we read about “Basic Commercial”: <br><br>    Design Credits <br>    First seen on MyFonts: April 10th, 2002 <br>    Designed by: Morris Fuller Benton <br>    Designed when: 1990 <br>    Design owned by: Linotype <br><br>And if you enter the following keywords at <a href="http://www.google.com" target="_blank">www.google.com</a> <br><br>    Basic Commercial Morris Fuller Benton Akzidenz Grotesk <br><br>Google displays a link to a Linotype website, whose contents has been modiﬁed, but if you click on the “cache”, Google displays the old contents of website on 8. Apr. 2004 23:28:15 <span class="caps">GMT</span>. Here we read the cached contents of the Linotype website of 8th April 2004: <br><br>   “Basic Commercial <br>   Designer Morris Fuller Benton, 1900  <br>   About Basic Commercial(tm) <br>   Basic Commercial font is based on the design for Akzidenz Grotesk, <br>   which appeared with Berthold in 1900, designed by type setters whose <br>   names have not been recorded, but whose skill cannot be overlooked.” <br><br>This means that Bruno Steinert contended that “Basic Commercial” was designed by the Berthold designer Morris Fuller Benton in the year 1900. <br><br>However, Morris Fuller Benton never designed the “Akzidenz Grotesk”, nor did he design Linotype’s “Basic Commercial” which is 100% identical with Adobe’s “Akzidenz Grotesk”. <br><br>In “LinoLetter” of March 2005 “Designs Determined to Inspire”, Bruno Steinert now tells a new story. Now, he does not mention “Akzidenz Grotesk”, “Berthold” and “Morris Fuller Benton”. These names are now discarded by him. Instead, now in 2005, Bruno Steinert contends that the “Basic Commercial” is identical with the font “Standard Series”. He declares: “The typeface was distributed for many years in the United States under the name Standard Series”. <br><br>Let’s summarize: According to Bruno Steinert, the font “Basic Commercial” by Linotype, which is identical with the font “Akzidenz Grotesk” by Adobe, was created by Morris Fuller Benton in 1900 as “Akzidenz Grotesk” for Berthold, and Bruno Steinert distributed this font for many years in the United States under the name “Standard Series” and Bruno Steinert created the “font software program” for this typeface in the year 2000. Correct? <br><br><br>4) The Funny Font Forging Industry <br><br>Professor Devroye at his website <br><br><a href="http://jeff.cs.mcgill.ca/~luc/legal.html" target="_blank">http://jeﬀ.cs.mcgill.ca/~luc/legal.html</a> <br><br>draws the attention to the report “The Funny Font Forging Industry”, which is downloadable as forgers.pdf from the website <br><br><a href="http://www.sanskritweb.de/fontdocs" target="_blank">http://www.sanskritweb.de/fontdocs</a> <br><br>In this report, Linotype’s “Basic Commercial” alias Adobe’s “Akzidenz Grotesk” alias Berthold’s “Akzidenz Grotesk” is seen from the point of view of public prosecutors and criminal court judges. In this report, Bruno Steinert is described as a font forger who forged the “Akzidenz Grotesk” by the “Linotype Method”. <br><br><br>5) name removed by moderator <br><br>Those who want to have a look at the “Basic Commercial”, but who do not want to waste money on this font forgery by Bruno Steinert, may visit name removed by moderator <br><br>url removed by moderator <br><br>These fonts do not contain the copyright notices so that criminal investigators cannot decide whether the fonts at the name removed by moderator are Adobe’s “Akzidenz Grotesk” or Linotype’s “Basic Commercial” or Berthold’s original “Akzidenz Grotesk”. This is no surprise, since all these fonts are identical with the exception of the copyright notices. <br><br>If you open Berthold’s “Akzidenz Grotesk” with a font editor and replace the Berthold copyright notice by the Adobe copyright notice, you create Adobe’s “Akzidenz Grotesk”. <br><br>If you open Adobe’s “Akzidenz Grotesk” and replace the Adobe copyright notice by the Linotype copyright notice and additionally replace the name “Akzidenz Grotesk” by “Basic Commercial”, you create Linotype’s “Basic Commercial”. <br><br>If you open the name removed by moderator fonts and replace the name “Basic Commercial” by “Basic Crimes” and if you insert the notice “Copyright by Criminals”, you create a general-purpose version for the criminals in the font forging industry. <br><br>Any lawsuits instituted against the name removed by moderator would be most interesting from the legal point of view, since all three fonts are identical: <br><br>Mr. Harvey Hunt of Berthold would contend at court that it was he, who wrote the “font software program” of “Akzidenz Grotesk” (“Copyright by Berthold…”). <br><br>Mr. Thomas Phinney of Adobe would contend at court that it was he, who wrote the same “font software program” of the same “Akzidenz Grotesk” (“Copyright by Adobe…”) <br><br>Mr. Bruno Steinert of Linotype would contend that it was he, who wrote the same “font software program” of the “Basic Commercial” (“Copyright by Linotype…”). <br><br>Wilhelm Ohnesorg,&nbsp;Germany</p>'
