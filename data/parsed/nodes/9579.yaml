    html: '<p>Dear Mr. Gianotten, <br><br>Thanks for your interesting reply. <br><br>Morris Fuller Benton made a lot of Gothic typefaces, e.g. Alternate Gothic, Bank Gothic, Clearface Gothic, Franklin Gothic, News Gothic, Raleigh Gothic and others. I examined all these fonts, but none of these Benton fonts is identical with Linotype’s “Basic Commercial”. <br><br>As regards the Franklin Gothic by Morris Fuller Benton, to which you refer by quoting Ansel M. Olson’s chapter on “Franklin Gothic” from the book “Revival of the ﬁttest”, we see that Olson writes “… intended to <span class="caps">COMPETE</span> with … e.g. Akzidenz Grotesk”. But a font that <span class="caps">COMPETES</span> with another font is <span class="caps">NOT</span> <span class="caps">IDENTICAL</span> with another font, <span class="caps">UNLESS</span> it is a pirated copy or a knock-oﬀ imitation of the other font.  <br><br>Furthermore Ansel M. Olson does not mention “Basic Commercial” at all in connection with Morris Fuller Benton and therefore he does not answer the question whether Mr. Bruno Steinert’s legally binding copyright notice declaration “This Basic Commercial typeface is original artwork of Morris Fuller Benton” is a false fraudulent copyright notice or not. <br><br>If a judge at a criminal court looks at the comparison picture attached below, he will easily recognize that “Akzidenz Grotesk” and “Basic Commercial” are completely identical, whereas “Basic Commercial” and “Franklin Gothic” are completely diﬀerent, and hence the criminal court judge will easily recognize that Mr. Bruno Steinert’s declaration that “Basic Commercial” is “original artwork of Morris Fuller Benton” is a false fraudulent copyright notice intended to make gullible font buyers believe that “This typeface is original artwork of Morris Fuller Benton”. <br><br>If an art seller declares: “This painting is original artwork of Vincent van Gogh”, although this artwork was not made by Vincent van Gogh, then this art seller is a criminal. And if the font seller Bruno Steinert declares “This typeface is original artwork of Morris Fuller Benton”, although this artwork was not made by Morris Fuller Benton, then Bruno Steinert is a criminal. <br><br>Cheers, <br><br><span class="caps">W.O.</span> <br><br><img src="http://www.typophile.com/forums/messages/4102/66730.gif" alt="Comparison of Basic Commercial with Franklin Gothic"></p>'
