    html: '<p>Dear Mr. Daniel, <br><br>I am very surprised about your message, and I am astonished that the moderator removed the name of the website which oﬀers the “Basic Commercial” font <span class="caps">WITHOUT</span> <span class="caps">THE</span> <span class="caps">FALSE</span> copyright notice. <br><br><br>1) Copyrightability of Computer Programs in <span class="caps">US</span> <br><br>&gt; Your point in earlier mails seems to be that fonts can’t be copyrighted, despite the fact that courts have supported font copyright. <br><br>I did not say so! On the contrary: In the <span class="caps">US</span>, computer programs (which, by the way, are deﬁned by <span class="caps">US</span> courts as “literary works”) are copyrightable since 25 years (since the enactment of a certain amendment in the year of 1980) <span class="caps">PROVIDED</span> <span class="caps">THAT</span> certain requirements, which I have described, are fullﬁlled, namely (1) ﬁrstly that a computer program is only protected by copyright if it is a creative work, and (2) secondly if the author of this creative work is a human being that has written the source code of this computer program. <br><br>Regarding the <span class="caps">SOURCE</span> <span class="caps">CODE</span> requirement which was rejected by other members of this forum as “so scurrilous and wrong”  (William Berkson), I give a short example: <br><br>My grandmother does not know the PostScript programming language and she cannot write the source code of a PostScript program. Therefore she can never be the programmer (=author = copyright owner) of a PostScript program. <br><br>The same is true for PostScript Type 1 fonts: My grandmother cannot write the source code of PostScript Type 1 fonts, and therefore she can never be the programmer (= author = copyright owner) of a PostScript Type 1 font. <br><br>A computer programmer, who reads this “grandma example”, will be most astonished to learn that the other members of this Typophile forum are of the opinion that persons who are <span class="caps">NOT</span> computer programmers and who do <span class="caps">NOT</span> know the PostScript programming language and who are <span class="caps">NOT</span> able to write the source code of PostScript Type 1 font software programs, claim to be the programmers (= authors = copyright owners) of PostScript Type 1 font software programs. This is very, very strange indeed! <br><br><br>2) Trademark Notice <br><br>&gt; But the above case, even if true, seems to relate purely to trademarks. <br><br>No, no! Copyright law and trademark law are two completely diﬀerent laws. By stating <br><br> “Basic Commercial is a trademark of Heidelberger Druckmaschinen <span class="caps">AG</span>” <br><br>Mr. Bruno Steinert made it clear that “Basic Commercial” is a trademark. This statement is correct and it is legally suﬃcient, but this trademark notice refers to the trademark law, not to the copyright law. <br><br><br>3) Copyright Notice <br><br>&gt; Even if it turns out that copyright strings in fonts are worthless <br><br>Here begins the crucial part of the case. The copyright notice is not a declaration that you can add to a font just for fun. This would be highly dangerous: The copyright notice is a fully binding legal declaration which must contain the whole truth and nothing but the truth, since the copyright notice is similar to making a declaration in lieu of an oath. <br><br>In the “Copyright Law of the United States of America” downloadable as Circular 92 at the website of the Copyright Oﬃce (I do not mention the link for fear that the moderator removes the link), you will ﬁnd the regulations concerning the copyright notice in&nbsp;sections </p>'
