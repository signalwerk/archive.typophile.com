    html: <p>Mr. Ohnesorg. My phrase ‘scurrilous and wrong’ referred to your accusations against Mr. Phinney, not to your claim of a “<span class="caps">SOURCE</span> <span class="caps">CODE</span> requirement” for  fonts.  <br><br>Your ‘source requirement’ seems to me just wrong as far as the current state of the law. I confess I know little about this whole matter, but I do know that the law is determined not by any person’s theories about it, but rather by what legislators enact and judges rule in interpretation of the law. You do not seem to grasp that whatever the logic or illogic of your argument, it is not the law unless a court agrees with it.  <br><br>Currently Judge Whyte seems to have the last word, and he doesn’t agree with you. So for your argument to become law in the <span class="caps">US</span> you would have to convince another court in the <span class="caps">US</span> that you are right, and Judge Whyte&nbsp;wrong.</p>
