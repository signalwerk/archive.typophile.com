    html: <p>In grade school, we were taught to draw the $ on the baseline, same size as a capital S. But all the (non-teacher) adults in my life drew a small '$' raised up (and slightly skewed) in their handwriting. For this reason I thought of the smaller raised $ as more sophisticated- adult.</p>
