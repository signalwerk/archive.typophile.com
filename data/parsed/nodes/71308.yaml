  html: |-
    <p>Can anyone shed some light on the tendency to set the dollar sign smaller and above the baseline? It's a widespread enough practice that I wonder how it all got started. I think it can look fairly decent on signage/ads if the proportions are handled well but I could see how this might be a typographic sin to others. Would you do the same in certain situations?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/399_4612.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/6a00d83451b3c669e201347fb68773970c-800wi_5162.jpg"></div><p></p>
