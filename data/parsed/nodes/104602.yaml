    html: |-
      <p>Creative Suite ME or InDesign ME is now defunct. Perhaps, you seek an older version. The drawback though may be that they are not compatible with newer versions of operating systems. Many older versions of software programs can not be run on newer versions of operating systems. For example, since there were ME versions of  Creative Suite or InDesign, many versions of Macintosh and Windows operating systems have been released.</p>
      <p>I have used the very latest versions of Creative Suite or InDesign with the Hebrew right-to-left features enabled. I have found these newer versions able to everything the ME versions could do, and much more. New versions of Creative Suite or InDesign are of course much better than the older ME versions.</p>
      <p>Remember however to enable these features BEFORE you download these later versions from Adobe, as explained earlier by Dov Isaacs.</p>
