    html: |-
      <p>FontWorld discontinued as we knew it. I founded Font World, Inc. with my late father and my late brother, Mark, in 1989. Different corporate incarnations of Font World, Inc. transpired many times over the years until last year, when Mark passed away from a long sickness at an early age. He was well loved, and will be greatly missed</p>
      <p>A new corporate incarnation brings many of FontWorld's and GoHebrew's qualities and products to the public at the under construction web site, called: <a href="http://www.fontsfurnitureandmore.com" title="www.fontsfurnitureandmore.com">www.fontsfurnitureandmore.com</a>.</p>
      <p>Adobe InDesign ME can be had by downloading the latest version of Adobe InDesign CC from <a href="http://www.adobe.com" title="www.adobe.com">www.adobe.com</a>. The Hebrew user must however first edit the preferences in the Adobe download program to enable Hebrew or Arabic text processing. This is explained in the Adobe Support Forum for Adobe InDesign for Hebrew text input. I will post the specific instructions here soon.</p>
      <p>Adobe offers substantial educational discounts.</p>
      <p>If you have any technical questions, you can email them to me at <a href="mailto:info@fontsfurnitureandmore.com">info@fontsfurnitureandmore.com</a>.</p>
