      <div class="comment-spam-body"><p>From adobe.com -&gt; support &amp; learning -&gt; indesign - hebrew text processing</p>
      <p>3. Dov Isaacs, Nov 3, 2013 12:42 AM   in reply to gohebrew1390 Report<br>
      OK. The first thing you do is to uninstall InDesign 9.</p>
      <p>If you want the English-Hebrew version (the equivalent of the old ME versions), you change the language preference in the Adobe installer to English-Hebrew and then reinstall InDesign. If you want only Hebrew, you set the language preference to Hebrew.</p>
      <p>(I assume that this is being installed by the Adobe Application Manager for the Creative Cloud!)</p>
      <p>          - Dov</p>
      <p>PS:     Same procedure for Illustrator and Photoshop!</p>
      </div>
