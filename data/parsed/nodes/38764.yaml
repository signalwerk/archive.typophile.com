      <p>I'm actually a little curious what people here think about that EULA.</p>
      <p>As I mentioned on another forum, for the *standard licensing* we have put some unusual restrictions on its use:</p>
      <p>Not to be used for logos, signage or major ad campaigns (billboards, TV) where Restraint is the main or sole element of the design; and not to be used for items for sale for profit (e.g. t-shirts, jewellery, cards, wrapping paper, etc.)</p>
      <p>As type designers, do you think this is outta line?</p>
      <p>I'm actually very convinced of the latter: I would be extremely pissed off to have someone profit from products for sale made of my work, which they paid $45 for. So that seems like a no-brainer. But what about the rest?</p>
      <p>-marian</p>
