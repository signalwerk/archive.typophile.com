      <p>Marian,<br>
      I think the issue is that your lovely artwork/font has so much of your own self in it that, as a logo, it would be hard to make it work for someone else. Someone would be giving over their identity to become you if they used it.  If they made enough changes to make it their own, chosing your art as a basis would make no sense. I would imagine a logo would need to be less you and more whatever the brand was about.<br>
      For tshirts and jewelry, you have a real case though. Their is no brand involvement, only the visual appeal of the elements. Your work has plenty of visual and artistic appeal which is clearly part of your being and rightfully so. I think the issue is that this is not so much a typeface as a conceptual work of art who's parts can be rearranged in verbal or just textural patterns. By billing it as a typeface, you open yourself to the weak copyright protections of typefaces in general. You may want to promote it as artwork in the form of software instead. I would talk to a good lawyer like Frank Martinez about it and get a more professional opinion.</p>
      <p>ChrisL</p>
