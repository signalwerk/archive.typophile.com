    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123204834im_/http://typophile.com/files/pic_restraint-2_4754.jpg"></div><p></p>
    <p>This is Restraint. I'm not calling it a typeface because it doesn't have a full character set, so I'm calling it an ornament font which happens to contain letterforms. I've been developingthis thing with Ross Mills for a while now. I think he announced it at aTypeI in 2004, I announced it again at Typecon in August of this year, and we're finally done. We're selling it through Tiro Typeworks at <a class="freelinking external" href="https://web.archive.org/web/20150123204834/http://www.tiro.com/" rel="nofollow">http://www.tiro.com</a>, and you can see/read a bit more about it at <a class="freelinking external" href="https://web.archive.org/web/20150123204834/http://www.bantjes.com/index.php?id=174" rel="nofollow">http://www.bantjes.com/index.php?id=174</a>.</p>
    <p>It's either extremely useful or completely useless, depending on your point of view, and it comes with instructions. Seriously.</p>
  html_clean: |-
