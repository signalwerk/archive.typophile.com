      <p>I am coming in late, but congratulations, Marian and Ross!</p>
      <p><em>But even with a CD (or digital file) there are restrictions on how you can use it: but most people understand that while they can play the CD at home or at a party, if they want to use it for their radio commercial, they need to pay more: usually a lot more...</em></p>
      <p>Marian, you raise a lot of interesting questions. On the practical ones, I think that Chris Lozos and William Berkson have already spoken for me. I just want to add this pre-digital example of usage restrictions placed on clip art distributed in book form:</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123204834im_/http://typophile.com/files/enciso_4073.jpg"></div><p></p>
      <p>Notice that the back cover states that the artwork is copyright free, and yet "You may use up to 10 items for any single use without fee or special permission." So anything above that amount will entail contacting the publisher and either getting permission or paying an extra fee.</p>
      <p>So this issue has precedents, and others have gone down this road too.</p>
