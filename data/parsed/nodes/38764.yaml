    html: |-
      <p>I had very mixed feelings about the EULA, because as a designer I had never even read an entire EULA. When I had a studio, I used to skim to find the part re. number of computers &amp; output devices, and that's it. For that reason I have made the unusual exceptions as up-front as possible: they're listed on my web site, again in the instructions and highlighted in red in the EULA. (I will see if Ross can provide a link to the EULA from the site.)</p>
      <p>The vast majority of applications are not problematic: magazines, menus, packaging etc. If someone did have a problem with the EULA, I would question their intent: so you *did* want to plaster it all over billboards or make jewellery? And in such case I feel justified in feeling indignant. And we do say "Please contact us for additional licensing." Despite my unease, in the end I thought "**** it, do I care if Designer X decides not to buy it because they wanted to use it for a logo?" I don't care.</p>
      <p>Messy, unfortunately, yes. There are problems that Ross and I may have to untangle one day.</p>
      <p>But in a bigger sense, I'm curious about the question of what is a [digital] font? Is a font a delivery system of artwork? Or is it a thing in and of itself with inherent or implied rights, or lack thereof?</p>
      <p>When teaching typography I have sometimes made the analogy between a typeface and a piece of music, where the typeface is the music owned by the artist, and the font is like the CD: a delivery system of that music. You own the CD, but not the music. But even with a CD (or digital file) there are restrictions on how you can use it: but most people understand that while they can play the CD at home or at a party, if they want to use it for their radio commercial, they need to pay more: usually a lot more.</p>
      <p>P22's licensing is interesting in that they make a distinction between the dingbats and the letterforms. Presumably this has to do with the long battles over copyright in typeface design, but it's interesting to me that at some point there is this distinction between what is licensable art, and what is not. </p>
      <p>These larger questions of art vs. letterforms and what it means to create a Font are much more interesting to me. Is Restraint art that we can understand should be licensed accordingly, or is it a Font that essentially has no rights, or very few, once the purchase price has been paid? And if so, why? These are largely rhetorical questions, but things that I've struggled with over the past few months as we've hashed out the EULA.</p>
      <p>-marian</p>
