      <p>As Eben mentioned earlier, if the EULA spells out positive options, rather than focusing on the negative prohibition, the EULA will be clearer, as well as less likely to raise hackles. The P22 EULA clause I quoted above I think is a good model: it invites the reader to buy the higher level licenses for those purposes. </p>
      <p>Now you have: "However, under this license *you may not use* the font software:" and the list prohibitions follows--with the prohibition that I have put asterisks in red.</p>
      <p>Instead: </p>
      <p>"Tiro licenses this software on two levels. The basic level includes the following uses: ....</p>
      <p>The second level includes the following uses. These are not authorized by the basic license, and require an additional license specific to the usage: ...</p>
      <p>To buy the basic license only and download the software, click here. For the additional licenses contact us."</p>
      <p>Now that I look at it again, I think the biggest problem with the EULA is that it is not clear enough. "Most personal and commercial applications" gives us no specifics on what is permitted. And as John wrote above, the "identities" is not clear as everything a business publishes is part of its identity. </p>
      <p>Perhaps, "'commercial products' and 'identities' require an additional license, and are not permitted under the basic license only.  'Commercial products' and 'identities' are defined as follows: ..."</p>
