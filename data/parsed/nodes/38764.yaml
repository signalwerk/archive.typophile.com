      <p>Don't get me wrong - I don't think that Marian aught not to have the EULA she prefers. Far from it! I just think that practically speaking people generally expect to be able to do &amp; not do certain things with a font. At least I do. I expect that I may or may not be able to modify a font I license. I expect to be able to use it for one glyph or to print a book. But I really don't expect to be told not to use it in an ID or logo. Unhappy surprises are avoidable. So why not avoid them with a special notice of what is an admittedly unusual EULA? </p>
      <p><cite><br>
      Restraint isn’t the most useful typeface when it comes to serious commercial applications<br>
      </cite></p>
      <p>It depends. For a computer services company - probably not. But for a Bar, Restaurant or Quilting store or even Soap packaging. It could be legitimately &amp; seriously used. </p>
      <p>I also think it could be hard in some ( not all ) circumstances to say if the font is or is not the 'main' element. I mean, who is going to decide? It just seems messy to me. I don't know though. Maybe Marian want to review all the pieces that use her font/design. If it was me I would not.</p>
