      <p>I am a confused by one term in the EULA:</p>
      <p>"you may not use the font for the creation of ... identities".  I suppose that the word identities has a very specific, limited meaning for real designers, but being a layman, I'm not too sure where normal use ends, and identity begins. </p>
      <p>If I used Restraint to set my company letterhead, that would be an identity use, right? So I can't use it for business forms like invoices, can I? Okay.</p>
      <p>Now, if I wanted to use it in a brochure advertising my new puppet play, I would probably want to use it throughout the material for the show, i.e., the teacher's guides, info sheets, programmes - but then, am I not using it to create an identity for the play? If I can't use it throughout, won't it look rather out of place where I do use it? Hmm ... then purchasing the font would seem like a bad idea. I'm not sure when I could use it.</p>
      <p>Or am I just not understanding the word "identity". If so, maybe you could gloss it in your EULA.</p>
