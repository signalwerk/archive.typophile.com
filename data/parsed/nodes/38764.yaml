      <p>Marian and Ross are talented artists who also happen to be generous and all-around nice people. While their EULA may differ from the norm, Restraint is not exactly a "typical" typeface and surely that has to be taken into consideration. As has been said by others here, if someone doesn't agree with the EULA, they are not forced to license this typeface. I think it's cool that Marian and Ross have released it at all. It's been in the works for several years, and Marian's star as an illustrator and lettering artist has risen greatly during that time. They could have opted not to release Restraint at all and Marian could stick with custom lettering projects which offer more lucrative compensation and less potential for headaches than single font sales accomplished over time.</p>
      <p>A reasoned argument or suggestion on clarification is helpful and leads to a positive dialog that informs and assists everyone in the type business and those who use type. Name-calling, insults, and the cheering on of said name-calling is mean-spirited, pointless, and not appropriate to this or any other discussion on Typophile.</p>
