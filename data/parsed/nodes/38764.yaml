    html: |-
      <p>Re: the EULA as a PDF: it is posted so that it is perfectly readable online; a printable version is supplied with the font. This is a small detail that Ross has set up for his own reasons.</p>
      <p>&gt;if a font is designed to make “type art” it’s a bit silly to discourage it.</p>
      <p>Not even remotely. Make as much art with it as you want, just don't sell it for profit without negotiating compensation with me. With Restraint you can make fancy borders or shapes or headlines for magazines, brochures, company stationery, CDs, band posters galore. You can even make tiles for your own personal fireplace, but if you want to sell "art" that is actually my art, I deserve a cut in that.</p>
      <p>Some people here, and some people not here have looked, or will look at the EULA and say, No Way. Not only am I not concerned, I'm happy to have turned those people away. I really don't need their $45 that badly. For those who want to use it in good faith, have fun with it, and make some clients happy I say Hello and Welcome; I'd love to see what you make and how you found working with the font. </p>
      <p>I have to say, as a font it's piles of fun. Once you get the hang of the system, it's highly addictive. Myself, I'm still discovering the possibilities.</p>
      <p>But hey, Check It Out! I made the top of the Hottest list on Typophile! Too bad it wasn't all slavish devotion, but the discussion has been interesting. I've always had a fascination with issues of copyright.</p>
      <p>Oh and one last thing ... wouldn't it be cool if my EULA prompted future font buyers to actually notice and read their EULAs? Because I can tell you, right now they don't. The vast majority of people in the design community don't even know what a EULA is, even when you spell it out.</p>
      <p>-marian</p>
