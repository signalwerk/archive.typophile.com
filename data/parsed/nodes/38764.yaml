      <p>Allow me, if you will, to add a few comments on this.</p>
      <p>I am perfectly aware that some of these clauses in the basic EULA may cause consternation amongst some. I am perfectly aware that these clauses may well not be legally enforcible in some jurisdictions.</p>
      <p>Also, I am not suggesting that the fair use clause be applied to all other fonts. It is included due to the unique nature of this particular design.</p>
      <p>The usage restrictions that apply to the basic license are an issue of fairness. Fairness both to those who have become accustomed to purchasing font licenses at industry-average prices which under-value the work of living designers. Fairness also to us as creators of both a tool and intellectual property. Or of course to those who are just obtaining some entertainment value from the font.</p>
      <p>In the case of Restraint, nowhere have we said that you absolutely can not use it as a principal design element or identity. What we have said is you can't necessarily do it for $45. No where have we said you absolutely can not modify it (or have it modified). We have simply requested you ask first and give us first refusal. And if any of the terms are unclear to you, you can exercise your fingers by sending us an email, although I realize that some find it easier to complain to the aether which isn't enabled to help them with their complaints. And for those that have a problem with the legality of the agreement, well then we will have to start charging a hell of a lot more to be able to hire a lawyer who can then write a nice long convoluted license agreement which no one will read and then we're back at square one.</p>
      <p>So, given these issues, we welcome constructive, thoughtful feedback on how the license may be improved or clarified.</p>
      <p>Part of what I would like is to re-establish understanding between us and our (retail font) customer. The EULA is an agreement between us--a base contract which serves both you and us. Like most any contract, it is open to reasonable discussion; it is not a blind or brick wall, but a starting point. We have a limited, fair license fee and so therefore also have a limited, fair license. The fair use restrictions, which are unusual in the font world, are indications that if you intend to make obscene amounts of money off the basis of our work that we would like to be compensated. Likewise, if you ask 'can I use this for my puppet show?' under the basic license, chances are we will say yes. It is a pretty simple concept in the face of so many click-through agreements.</p>
      <p>If someone ignores the intent of the license agreement that is on their conscience. We will either give them the opportunity to give us fair compensation or revoke their license. Or any number of other possibilities. We do not want to vet every instance of use. And as Marian says, if someone thinks they can't use it for a logo and decides not to buy it, I'm not going to sweat it for the loss of $45. If re-entering the retail font business becomes too onerous by virtue of those who find the terms unfair or intellectual property valueless or price too high etc., then I can do without it. I hope that won't be the case and that those who like and respect what I have to sell will continue to be served well by it.</p>
