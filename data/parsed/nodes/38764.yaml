      <p>I have to disagree. The EULA does allow Marian and Ross the right to control how the font is used in a basic license situation. Art or not. </p>
      <p>In regards to established ways of selling. I say buck the trends. Reinvent the wheel. Make a better wheel. Not every EULA works for every font design. I once argued for a single EULA, but I know after doing more reading and delving deeper into this black art that it just isn't possible. Why? Because you cannot separate the typeface designer's perceived value from the actual value. They are one in the same. Font A will never be the same as Font B. Even Wedding Font A will never be the same as Wedding Font B. Foundries value and price their fonts differently. If the people shopping and licensing aren't saavy enough to understand the differences it isn't the foundries fault.</p>
