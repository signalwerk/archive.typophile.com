      <p>Personally, I think that the EULA makes a lot of sense. Restraint isn’t the most useful typeface when it comes to serious commercial applications—unless the application happens to be trying to get the look of a Marian Bantjes design without actually spending money on an artist. Type design is not your primary source of income, so it makes plenty of sense to let people know up front that they can’t just go the cheap route and use your font to cash in on your popular work.</p>
      <p>On a related note, this font seems to be catching on with design students including you in their thesis/dissertation work. I already know more than one person who purchased it just for that.</p>
