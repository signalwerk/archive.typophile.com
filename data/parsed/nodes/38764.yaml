      <p>So I was immediately anticipating a prohibited use with no Malice in my heart. Really! </p>
      <p>Now I see that's not your intention I confess that I see how you might feel that way. Especially not being a font maker most of the time. But I am not sure if it's an advisable position because unless you make the unusual terms of the EULA extra-clear you could end up spending too much time litigating and not enough time having fun.</p>
      <p>Maybe you should allow the currently prohibited uses by making a clear path to an explicit special license for each kind of use. That would be 'rights managed' photo model of licensing.</p>
