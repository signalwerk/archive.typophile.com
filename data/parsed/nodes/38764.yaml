      <p>Even though you are right that this is the way 99.9% of font users think about their fonts I have to disagree. EULAs are just culture. Culture is invented &amp; reinvented. It's is true that there is an established culture in font sales.  And Marian is clearly bucking the established cultural assumptions*. But the culture of type sales has changed over &amp; over. There is no reason to think that it will remain as it is today forever, or that it can't be split into a variety of modes in the future.</p>
      <p>Obviously what people actually do is a whole other issue as well.</p>
      <p>It might be that following the established mode is smartest, or most lucrative, or satisfying. Or not. But irrespective of how it turns out in the end I respect Marian's right to try new models of Font licensing. Perhaps it will be a useful lesson to us. Hopefully we will pay attention not simply to the EULA itself but to the way the buyer experience is crafted.**</p>
      <p> * That is of course why I suggested going well out of the usual way to point that out to a buyer before they buy.<br>
      ** If that sounds creepy then - tough.</p>
