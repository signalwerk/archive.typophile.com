      <p>In response to Hasan's original inquiry regarding information on the designer of Simplified Arabic fonts included with Windows, I have the following information:</p>
      <p>During Typecon conference in Seattle in 2007<br>
      <a href="http://www.flickr.com/photos/ebensorkin/1204185570/" title="http://www.flickr.com/photos/ebensorkin/1204185570/">http://www.flickr.com/photos/ebensorkin/1204185570/</a></p>
      <p>I asked David Berlow, founder of Font Bureau, if he did any design work on Arabic fonts and he told me that he did Simplified Arabic some years ago. He downplayed his contribution because he thought that he did not have much knowledge about Arabic, however, I think his work has much merit for its time. </p>
      <p>When I read Hasan's inquiry, I remembered this conversation and wrote to David to request more specific information about this typeface. His response was brief: The font was designed around 1986 while he was working for Bitstream, and Matthew Carter supervised his supervisor. I don't have information about his inspiration or sources for this design, or about the route of licensing from Bitstream to Agfa Monotype to Microsoft.</p>
      <p>Simplified Arabic typeface included with Windows and used as the Arabic complement in Arial and Times New Roman is a specific typeface design which is not the same as the general term "simplified Arabic" used to describe the genre of fonts discussed earlier in this post. Simplified Arabic fonts produced by Linotype and other vendors before 1986 must be considered the models on which this typeface is based.</p>
      <p>During the past couple of years, I have been doing work for Microsoft to differentiate the Arabic of Simplified Arabic, Arial and Times New Roman. This work aims to make the Arabic in each of these fonts recognizable from the other fonts, and to make the Arabic more related to its Latin companion especially in Arial which is a monoline design. I do not have information about when these revisions will be released by Microsoft.</p>
