      <p>Thanks, Vladimir.</p>
      <p>It is really exciting, and somewhat challenging, to be part of these discussions. For a small post, one has to face up to the downpour of intellect that comes in response. I hope I have the means and time to be up to it. I also think that it is an exciting time to be around in the field of Arabic Typography at large. There is so much to be done about it.</p>
      <p>In transferring to type using Western technology, Arabic script might have not retained its original calligraphic elegance and has been adulterated with the “incompatible” system as some have commented. But the influence of this technology is inevitable, and to me it is even welcome. As a designer of Arabic type, I see my role in adapting the writing system to the new technologies, and not necessarily in a defensive or reductionist manner. There is scope for much innovation in the adaptation process and it is very possible to come out with products that are useful, relevant, and expressive of our times.</p>
      <p>The Simplified Arabic approach seems reasonable to me. It has served its purpose in its application in metal type, and has even helped in reintroducing classical Arabic to the masses. It is still offering a viable solution for using the Arabic script in modern digital technology. Computer applications, such as Tasmeem, which try to bring in the calligraphic elegance of Arabic script, show the way to many possibilities.</p>
      <p>&gt;&gt; John Hudson: “reading accuracy (measured in terms of fewer reversed saccades and comprehension testing) is improved when the vowel diacritics are included.”</p>
      <p>The finding, in fact, does not surprise me and seems logical. However, I don’t know how that lab-controlled finding would apply to contemporary usage of printed or hand written Arabic text. Diacritics are now only used in exacting texts such as that of the Quran. Most contemporary writing is devoid of diacritic marking, and I had already cited an example of modern journalistic Arabic. But you know what, I am already visualizing that moving news subtitle on the BBC Arabic TV channel with diacritcs.</p>
