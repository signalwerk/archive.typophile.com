      <p>Back to the first question. Although the design of Simplified Arabic has a number of good typographic qualities, the font is actually no more than a marketing exercise. Microsoft needed a robust Arabic font that would make their IE and Office Suite usable by the millions of users in the Arab world (not that they will all actually buy it as Microsoft knows better than me and you). That is why you do not find any designer credited in the font info.</p>
      <p>Telling from the correct interpretation of Arabic letters, the font was most likely designed by an Arab designer who submitted the original designs in paper format. The design was then probably digitized by Monotype as the outlines reflect the usual high quality found in the Latin fonts.</p>
      <p>The paradigm above also applies to other widely used Arabic fonts such as Yakout, Al Harf Al Jadeed, and Muna by Abdulla Faris. Although Nahib Jaroudi is credited by Linotype, but the font was created to promote other products that use the fonts.</p>
      <p>Good and practical Arabic fonts that are driven by the aim of achieving typographic excellence are hard to find.</p>
  - id: 504072
    user: 50554
    date: 2012-04-05T10:25:00
    date_raw: 5 Apr 2012 — 10:25am
    votes: null
    html: |-
      <p>In searching for information about Arabic typography, to get a better idea of what is required and what is lacking, one of the things I came across was Titus Nemeth's dissertation on the state of newspaper typography in the Arab world.</p>
      <p>Having a type element for a Selectric typewriter for Arabic, I had thought it seemed like "Simplified Arabic" was a <em>good</em> idea, since <em>on a typewriter</em>, where successive characters can overlap, merging final and isolated, and initial and medial, by putting the connecting stroke between letters entirely on the first letter of the pair appeared to me to give results indistinguishable from the use of four versions of each letter in hot-metal typesetting.</p>
      <p>However, from this dissertation, I've learned that the "Yakout" typeface on Linotype took the "Simplified Arabic" idea to where it <strong>did not belong</strong> - to the world of hot metal typography, where letters cannot overlap. Even I could see that the result was a travesty of the Arabic script. Worse yet, according to that dissertation, the Arabic characters provided in common Microsoft typefaces with Unicode support like Arial (mentioned in the dissertation) and Times Roman (not mentioned, but looks identical on my computer) are patterned after Yakout.</p>
      <p>However, to be fair, <em>some</em> of the worst features of Yakout aren't in fact included in the Arabic characters in Arial; you won't see a little stub of a connector on the initial form of letters. But the distortion of the letter shapes so that on Linotype, where that stub connector couldn't be avoided, at least it would be small, still remains.</p>
      <p>Of course, just having the basic four versions of each letter or the equivalent is still not the same as respecting a larger proportion of the calligraphic rules, but it is a reasonable minimum to ask.</p>
  - id: 504202
    user: 1262
    date: 2012-04-06T10:45:00
    date_raw: 6 Apr 2012 — 10:45am
    votes: null
    html: <p>I think it is misleading to say that Linotype 'took the Simplified Arabic idea to ... hot metal typography'. Simplified Arabic was invented by Linotype precisely as a mechanism to fit Arabic onto existing newspaper composing machinery. The Yakout newspaper type is the paradigm of Simplified Arabic which, by the way, does not consist simply of two forms per letter instead of four, but of a varying number of forms (e.g. the heh takes four forms).</p>
