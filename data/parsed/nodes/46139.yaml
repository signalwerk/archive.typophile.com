      <p><em> ...the modernism movement (in design and communication) </em><br>
      I think in this context the operative word is 'communication'.  As type was exported from the pages of books to newspapers and TV screens and now to computers, certain constraints are imposed on the design. Marshall McLuhan's dictum "the medium is the message' applied to modern typography and one example in the 1960's was when Arabic type was simplified to adapt it to the limitations of the Linotype typesetting machines. Now of course the 'medium' is so sophisticated that almost any kind of graphic communication is possible to display and print, so we are in a new era of possibilities where 'anything goes' and   statement about experimentation rings true. In the end however it is human beings, not machines, that read type, and the choice of what is right must come from what people feel most comfortable with.</p>
