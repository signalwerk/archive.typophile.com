      <p>I know that I've read claims that replacing Arabic script with Latin script in Turkey helped improve literacy in that country. The argument usually given is that Latin is "more legible"; people used to the Latin alphabet think that some Hebrew letters - and many Arabic letters, at least not in their final forms - look too much alike and are hard to read.</p>
      <p>While this seems to be valid to me, I also think that it's very easy for someone to fall into the trap of thinking that whatever he is used to must be the best.</p>
      <p>Both the Hebrew and Arabic scripts omit vowels. This seems bad from the viewpoint of a speaker of a western language. but in Semitic languages, a lot of the vowels in a word change when one goes to a related form of the word, such as would be obtained by the simple addition of a suffix in another kind of language. So denoting the vowels by full-fledged letters in line with the consonants would make it hard to quickly see the root of a word.</p>
      <p>In the case of the Hebrew alphabet, some consonant letters which were not applicable were instead used to represent vowels when it was used to write Yiddish, a dialect of German, an Indo-European language.</p>
      <p>At least in the case of Urdu, also a language belonging to this family, this was not done, so there is an additional problem with the suitability of Arabic writing to the language in addition to legibility. However, Hindi is also written with the vowels as accents to the consonants, so this can't be a very big problem.</p>
      <p>Changing from one alphabet to another is a lot of trouble, and for a small future benefit. Usually, countries don't change their mode of writing for greater efficiency. If it does happen, it is usually because of religion or politics. Thus, just as the Arabic script followed Islam, Latin script followed Roman Catholicism, Cyrillic script followed the Orthodox church, and scripts derived from Devanagari (including the Tibetan and Thai scripts) followed Hinduism and Buddhism.</p>
      <p>Turkey, of course, is still a Muslim nation, unlike, say, Malta. But while the force was nationalist politics instead of religion, if it hadn't been for a leader who, like Russia's Tsar Nicholas, wanted the country to make a break with the past it is unlikely the change to the Latin alphabet would have taken place. I don't think that such changes could be justified by a rational calculation, except, <em>possibly</em>, in the case of non-alphabetic scripts.</p>
