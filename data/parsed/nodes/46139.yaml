      <p>Claudio (piccic) This thread was started by Hasan from Gaza, so it is approriate that you mention it here. See <a href="http://typophile.com/node/53068" title="http://typophile.com/node/53068">http://typophile.com/node/53068</a><br>
      <em> a propositive idea cannot establish what is universal by preconceived simplification.</em><br>
      It depends: according Occam's Razor the simplest solution is often the best...but how you arrive there depends on the specifics of the situation. Sometimes by willfully paring down extraneous material or ideas in one step, and sometimes it happens quite naturally by invisibly small steps over a long period of time.  We cannot generalize about this without giving examples. By 'constraints' I meant practical issues such as legibility, that a font for a computer should consider the pixels at small sizes, that the shapes of an alphabet meant to teach children should be easy to learn, etc. In addition such concepts as clean design by simplification may be a sort of fashion, but they have their place.</p>
