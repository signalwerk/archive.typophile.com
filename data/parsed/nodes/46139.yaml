      <p>Khalid: <em>The omission of the short vowels that are represented in the writing system as diacritics still renders Arabic text completely readable, and indeed very compact.</em></p>
      <p>However, one of the few things that have been determined about Arabic script through systematic empirical testing is that reading accuracy (measured in terms of fewer reversed saccades and comprehension testing) is improved when the vowel diacritics are included. This shouldn't surprise us: when more linguistic information is available, we read more accurately. The fact that mature readers are also able to read reasonably accurately when the text is not fully vocalised says more about the amazing human cognitive capacity than it does about the virtues of the script.</p>
