      <p>Claudio, we probably agree about this more than our words reflect. It is so easy for us to get lost in words to describe our creative processes and attitudes to type design. This is paradoxical since type is what makes printed words possible :-) I looked up Futura and its sparse simplicity (that word again!) is something I tried to achieve in my font.  </p>
      <p>Strictly-speaking you are right, John. I was using the expression rather loosely in one of its modern variants (see <a href="http://en.wikipedia.org/wiki/Occam%27s_razor" title="http://en.wikipedia.org/wiki/Occam%27s_razor">http://en.wikipedia.org/wiki/Occam%27s_razor</a> ).  There is a more appropriate Arabic phrase I should have used السهل الممتنع (lit. impossibly easy). It is used to describe something that looks deceptively simple but is so perfect it is very difficult to achieve or imitate.</p>
