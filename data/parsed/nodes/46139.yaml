      <p>I mentioned this discussion to <a href="/wiki/Fiona%20Ross" class="freelinking" rel="nofollow">Fiona Ross</a>, who directs us to her 2002 St Bride conference presentation on Linotype non-Latin font development:</p>
      <p><a href="http://stbride.org/friends/conference/twentiethcenturygraphiccommunication/NonLatin.html" title="http://stbride.org/friends/conference/twentiethcenturygraphiccommunication/NonLatin.html">http://stbride.org/friends/conference/twentiethcenturygraphiccommunicati...</a></p>
      <p>This is what she had to say regarding the development of simplified Arabic type:</p>
      <p><cite>In the 1950s, the Arabic typeface design <a href="/wiki/Yakout" class="freelinking" rel="nofollow">Yakout</a> was developed. It was produced in 1956 by Linotype &amp; Machinery for hot-metal typesetting, being specifically intended to function as a newspaper text face (dispensing with diacriticals and ligatures). With the dual intention of fitting the Arabic script onto a Linotype linecasting machine for setting type for rotary printing, and of maximizing keying speeds in creating copy for daily newspapers, much effort was concentrated on reducing the normal Arabic character set of over 100 characters. Yakout was designed in a similar manner to Arabic typewriter fonts created during this period: used a limited range of letterforms to represent the full Arabic character set. The resultant style of type design became known as 'Simplified Arabic'. The number of characters was reduced to 56, which enabled the typeface to fit into one 90-channel magazine. A brochure at the time claimed that 'the output of work may be increased by as much as 30 per cent'. Yakout was manufactured in six different point sizes and became, indeed remains, one of the most popular Arabic typefaces.</cite></p>
      <p>The PDF of slide images accompanying the text includes a couple of relevant illustrations.</p>
