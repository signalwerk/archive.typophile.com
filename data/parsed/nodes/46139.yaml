      <p>Thank you Hasan- this innocent question of yours has blossomed into a discussion of the roots of modern Arabic type design! Thanks Saad and John for the details you provided. Fiona Ross's pdf has a lot of interesting detail- I wonder if the Linotype sample sheet therin is available in greater resoltion?</p>
      <p>&gt;&gt;&gt;&gt;[Yakout] type design became known as ’Simplified Arabic’. The number of characters was reduced to 56, which enabled the typeface to fit into one 90-channel magazine.&gt;&gt;&gt;</p>
      <p>Around that time I presented Monotype and Letraset with a proposal to abridge the number of glyphs needed to print Arabic using common swash-like endings for final letters like beh teh theh, and for hah kha jeeem, etc. I also obtained a patent for my idea (UK Pat. 1011006 Improvements in Printing)<br>
      <a href="http://www.ne.jp/asahi/tamari/vladimir/arabictyppatent.pdf" title="http://www.ne.jp/asahi/tamari/vladimir/arabictyppatent.pdf">http://www.ne.jp/asahi/tamari/vladimir/arabictyppatent.pdf</a></p>
      <p>&gt;&gt;&gt;It is sort of funny, in a bleak way, that this technical improvisation resulted in the propagation of a new ’style’ of Arabic&gt;&gt;&gt;</p>
      <p>I would not say that the trend towards what one might also call 'sans-serif' Arabic fonts was exclusively influenced by the technicalities of automated typesetting. I know well the clutter of those magnificent Linotype machines and their smell of molten lead, but the resulting text on newsprint did not appear too different from the older letter-press.  Around the 1950's and 1960's there was a surge of interest in modernizing the Arab world, and the reform and simplification of printed  Arabic  was one important aspect. For me as an art student at the time the concern was for a  modern look to the printed word (think Bauhaus and Gill Sans Serif), and that meant simplifying the outlines.  The resulting abridgement of the number of glyphs needed came as an additional bonus.</p>
      <p>&gt;&gt;&gt;... subsequently implemented in technologies which did not have the same limitations&gt;&gt;&gt;</p>
      <p>Exactly, John - these days computers can 'do anything' and almost anything has being done!  With all these fonts around the need for a systematic and critical appraisal of Arabic fonts is more important than ever.</p>
