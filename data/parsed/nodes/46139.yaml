      <p>As typographers (and typohiles), we discredit ourselves when we link Arabic script with the levels of illiteracy in the Arabic script using world. Having worked in the area of poverty for over 12 years, I know that illiteracy is the product of more serious social and economic factors. I encourage those interested in illiteracy in the Arab world, and indeed, in illiteracy in the world in general, to familiarize themselves more with Poverty issues and the Millennium Development Goals.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/literacy-small_5945.jpg"></div><p></p>
      <p>It is actually unfair to blame the Arabic script for illiteracy. In fact, if the Arabic script has anything do with literacy levels, it should be in a positive way for the intrinsic powers that the Arabic script has.</p>
      <p>To start with, Arabic script might be the closest script that represents the way the language is spoken. The omission of the short vowels that are represented in the writing system as diacritics still renders Arabic text completely readable, and indeed very compact. In my blog writing, as an example, (<a class="freelinking external" href="http://arabictype.wordpress.com" rel="nofollow">http://arabictype.wordpress.com</a>), I only use the Dhamma to disambiguate passive voice, and the tanween as an embellishment. An additional diacritic that I use is the shadda (which is not a short vowel). Arabic journalistic writing today does away with all three with no complaints about the clarity of meaning or the linguistic quality.<br>
      <a class="freelinking external" href="http://arabictype.files.wordpress.com/2010/02/alhawadeth.jpg" rel="nofollow">http://arabictype.files.wordpress.com/2010/02/alhawadeth.jpg</a></p>
      <p>Arabic spelling is relatively easy and is somewhat forgiving. The major difficulty in Arabic spelling is probably only with the way that the hamza is represented. Writing  مسئولية instead of مسؤولية does not look as silly or unprofessional (in professional writing) as spelling mistakes would be in English writing.</p>
      <p>Arabic handwriting is close to the printed script, and the compact ruq’aa-based handwriting style is probably the ultimate in its flow and its balanced mix of catenation and separation.<br>
      <a class="freelinking external" href="http://arabictype.wordpress.com/2010/03/25/arabic-handwriting" rel="nofollow">http://arabictype.wordpress.com/2010/03/25/arabic-handwriting</a></p>
      <p>On the readability of the Arabic script, I have to say now that I “believe” that it also very easy to read. This is mostly because of the catenation of letters, the wide variation of letter shapes, and the form of terminal letters. These characteristics contribute to easy recognition within saccades as the eyes scan the text. I am hoping to validate my “belief” with an empirical study if I could. I honestly encourage those who could afford doing legibility and readability studies to generate more knowledge in this area.</p>
  - id: 448395
    user: 23584
    date: 2011-01-21T05:54:00
    date_raw: 21 Jan 2011 — 5:54am
    votes: null
    html: <p>Khalid, welcome to the Typophile Arabic Typography and Type Design Special Interest Group. A group of us Arabic typographers (who were associated with the Tasmeem software fonts released by Winsoft) made a big effort to start this Group a few years ago. That was partly in response to the Matchmaking program some aspects of which threatened to take Arabic type design in the wrong direction. I find your defense of Arabic script above and in your blog encouraging and refreshing. During the past few years I was really depressed by the recent trends to Latinize Arabic typography with squared up shapes and even with serifs! This is an unhealthy trend that you have called 'touristic' in your blog. The genius of Arabic script is in its compactness and richness of forms that create unique word-shapes that are indeed helpful for legibility. In <a class="freelinking external" href="http://www.ne.jp/asahi/tamari/vladimir/harfalquds1974article.html" rel="nofollow">this article that published in 1971</a> I pointed out that in  Arabic types the dots tended to become smaller and smaller at the expense of legibility.  One very 'popular' (ie default) Microsoft  Arabic font is scandalous in this respect with dots so tiny they might as well not be there. Nadine Chahine of Linotype was doing her PhD thesis on the legibility of Arabic type. I wonder what her conclusions will be, as she is in a position to promote Arabic typography in the right direction.</p>
  - id: 448406
    user: 50554
    date: 2011-01-21T06:29:00
