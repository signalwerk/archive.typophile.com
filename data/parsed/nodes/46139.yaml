      <p>It may indeed be that the term "Simplified Arabic", as used in this discussion, refers specifically to what Yakout implemented.</p>
      <p>However, Yakout does date from 1956, while Wikipedia claims the first Arabic typewriter was made by Philip Wakid and Saleem Haddad in 1914.</p>
      <p>(EDIT: Remington was selling Urdu typewriters, and possibly Arabic typewriters, in India back in 1910, I've since found out.)</p>
      <p>I know that there was an Arabic element for the Blickensderfer, as well.</p>
      <p>And so, my point, that reducing most letters to only two forms actually works reasonably well on a typewriter, not requiring the letter forms to be as distorted as they were in Yakout, I believe remains valid.</p>
