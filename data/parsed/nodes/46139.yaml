      <p>As I understand it, the concept of simplified Arabic, in which the number of variants of each letter is reduced by having isolated/final and initial/medial forms share the same glyphs, originated at Linotype in the context of adapting newspaper typesetting machines to set Arabic. Only a small number of Linotype's Arabic types followed this model (Yakout being the best known example), and it was specific to the mechanical issues involved with these machines. It is sort of funny, in a bleak way, that this technical improvisation resulted in the propagation of a new 'style' of Arabic, subsequently implemented in technologies which did not have the same limitations.</p>
      <p>I'm not sure of the origins of the Microsoft/Monotype 'Simplified Arabic' design. It follows the same simplified model as Yakout, using different shapes. I believe it is older than the work on Arial, and was adapted for inclusion with that font from existing Monotype sources, so neither Robin Nicholas nor Patricia Saunders are likely responsible. It is the nature of a lot of things produced by the older type companies that no designer is credited.</p>
