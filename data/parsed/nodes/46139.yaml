      <p>Vladimir: <em>according Occam’s Razor the simplest solution is often the best</em></p>
      <p>That's not actually what William of Occam said. The principle known as Occam's razor is that when faced with multiple explanations for a phenomenon <em>none of which are testable</em> one must give preference to that which involves the fewest assumptions external to the phenomenon.</p>
