      <p>@khalid:<br>
      <cite>As typographers (and typohiles), we discredit ourselves when we link Arabic script with the levels of illiteracy in the Arabic script using world. Having worked in the area of poverty for over 12 years, I know that illiteracy is the product of more serious social and economic factors.</cite></p>
      <p>Even <em>if</em> the common attitude of users of the Latin alphabet that Arabic has legibility problems is entirely correct, of course it is really the social and economic factors that are the primary cause of illiteracy. The example of Japan proves this.</p>
      <p>The people who blamed China's writing system for widespread illiteracy in China were not, by doing so, claiming that it was impossible for the average person to learn to read and write in Chinese characters. They were <em>merely</em> claiming that, given China's poverty, learning to read and write properly with Chinese characters would not be possible given the limited amount of formal education with which China was capable of providing its citizens.</p>
      <p>If the English-speaking countries were as poor as China was, it would be just as possible for someone to observe that the system of English spelling was such as to ensure that only the wealthy elite could afford to keep their children in school long enough to learn to spell properly.</p>
      <p>As you note, Arabic writing is a close match to Arabic phonology. Thus, full literacy, the ability to express oneself in writing as well as to passively read, should indeed be as easy to obtain in Arabic as in Finnish or Italian, instead of as in English or Chinese.</p>
      <p>And, of course, typewriters and even printing presses are recent inventions.</p>
      <p>One can indeed make the claim that different letters in the Arabic alphabet are objectively hard to distinguish. If one is talking about Naksh <em>as it is usually typeset</em>, in forms that have been stripped down to be compatible with mechanization designed around the Latin alphabet.</p>
      <p>Thus, in Pakistan, where the newspapers had been prepared by calligraphers instead of typesetters, because of the national preference for Nastaliq', rather than being quaintly primitive, as Westerners would assume on first impulse, they have the right idea. Preferring Nastaliq' is as rational for people in Pakistan as preferring newspapers in 8-point type instead of 6-point type is for English speakers.</p>
      <p>Thus, if there is anything about Arabic script that promotes illiteracy, it is the fact that it is ill-suited to the hand-me-down printing and typesetting equipment from the West the Arab world has had to make do with until recently.</p>
      <p>But "illiterate" is not the right word for a literate person whose eyesight simply cannot cope with common printed matter - although a dearth of readable printed matter certainly can contribute to real illiteracy.</p>
