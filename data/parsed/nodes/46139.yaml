      <p>Vladimir: <em>I would not say that the trend towards what one might also call ’sans-serif’ Arabic fonts was exclusively influenced by the technicalities of automated typesetting.</em></p>
      <p>To clarify, I wasn't talking about a style of 'sans-serif', which I take to mean a kind of low contrast stroke model that is itself applicable to different kinds of letter shapes (in Arabic type as in Latin), but of simplified Arabic in the sense of using a reduced number of forms -- prompted by technical limitations -- coming to constitute a new style with its own grammar. The actual shape or contrast pattern of the letters used is in most respects accidental to the style understood as a system, i.e. the simplified Arabic system doesn't imply particular shapes, only their number and relationships. So long as the same shape can function as both isolated and final or as both initial and medial, then the system is satisfied. Historically, as you say, there was a coincidence between a cultural interest in modernisation and this technically motivated innovation, but the two are independent: altering the visual appearance of the Arabic script to make it resemble Latin sans serif types fashionably associated with modernisation does not require simplification of the structure of the script, and such simplification can be applied to letterforms that continue to carry at least some residue of the traditional ductus (as seen in Yakout).</p>
