    <p>Hello. I`ve got an school assignment in typography where we are going to write a sentence on something (pillow, caps, table, tree, cup, paper bag) by using foundation hand. And i have about 0 ideas that is easy to perform as well as good looking. Any ideas / inspiration links?</p>
    <p>I`ve got <a href="http://www.lettermade.com/photos/" title="http://www.lettermade.com/photos/">http://www.lettermade.com/photos/</a> <a href="http://typographi.com/" title="http://typographi.com/">http://typographi.com/</a></p>
    <p>I`m not asking you to do this for me. Well, that would be impossible anyways :)</p>
