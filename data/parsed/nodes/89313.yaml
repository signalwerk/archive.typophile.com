      <p>&gt;"the black background which does not equate with children playing card"</p>
      <p>This is just the backs, isn't it?</p>
      <p>It looks "serious", as in those expensive Magic the Gathering cards or some high stake poker game -- not "fun". "Serious" <em>does</em> appeal to children, but I would say it depends on the design of the fronts (*). Are those featuring low-rez Little Doggy/Red Ball/Happy Sunshines in primary colours, or do they match the stark design of the backs?</p>
      <p>(*) Design-wise. I assume you know who your target audience is -- if this is for 6-8 yrs old I would totally advise against yellow/white-on-black, geometric, bleak, uncompromising, astute, "serious".</p>
