    html: <p>Vyaz’ is not just another decorative style. It finds its use in, and is generally limited to, the opening pages of the clerical books (including Gospels), icon painting, various holy vessels, church bells, gravestones, monumental lettering, and the like. Both Eastern Orthodox and Roman Catholic Churches strongly disapprove gambling. I personally find the use of vyaz in playing card design rather inappropriate.</p>
