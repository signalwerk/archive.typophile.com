      <p>@ Hrant , How are you ? Long time Hrant ... (What was your personal e-mail?)<br>
      I always like what you have to say .  I chose to do play cards to give parents and kids  to do  something together. I thought Parents can teach their children their heritage language in non formal setting and incrementally thru a game. </p>
      <p>@ Theo Thanks, nice suggestions, will post my latest work this week .<br>
      As designers sometimes we have to design things out of our cultural boundaries,  Which should appeal to the intended audience. In this project I have to do Persian and Kenyan teaching material too. I think it would be nice to have  discussion here on typophie what is authentic ,what is global and what is universal . By universal I mean like a comment you made "the black background which does not equate with children playing card"<br>
      What do you think?<br>
      Thanks,<br>
      Aleme</p>
