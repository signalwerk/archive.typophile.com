      <p>I must say that, as an adult, my personal taste appreciates the complexity of the design.  And yet,  one can only wonder why such an esoteric lettering style was chosen as a backboard (of sorts) for the most fundamental level of learning?  Would this not be similar to writing complicated mathematical equations on the back of flash cards for children learning basic addition?  </p>
      <p>In this design case (still applies):  Loosen up; Lighten up.</p>
      <p>Cheers,<br>
      Theo</p>
