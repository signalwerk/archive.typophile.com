      <p><cite>there are also two kinds of book design, the cover and the interior.</cite></p>
      <p>Depending on what sort of book you are designing. This is true of most Trade publishers - they even have separate departments to handle the covers and the interiors. But with the sort of books I do, illustrated books (which means a book that is illustrated throughout, whether with photography, graphics, or illustrations), the cover and interior are done together and relate strongly.</p>
