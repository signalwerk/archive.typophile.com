      <p>The Hochuli (with Robin Kinross) book is still one of the best I’ve read. But Rich Hendel’s is the best, followed closely by Bringhurst. I know that we don’t normally think of <em>The Elements of Typographic Design</em> as a book design book, but there’s a lot of practical advice in it for the book designer—things on page dimensions and proportions (Chapter 8, Shaping the Page) are of particular interest.</p>
