    html: |-
      <p><cite> &gt; there are also two kinds of book design, the cover and the interior.</cite></p>
      <p>There are also several sub-kinds of interior book design. The design considerations and parameters of a trade illustrated book (like Patty’s bread-and-butter) are different than those of scholarly typographic (more like Charles’ sort of thing). How-to and illustrated reference (of which I’ve done my share) are very different from poetry. Cookbooks are different from fiction. Gift books are a different breed from trade nonfiction. Etcetera, etcetera. </p>
      <p>It occurs to me that we frequently fall into the trap of contrasting book design &amp; typography with other design genres (<em>“Please suggest a good font for books”</em>) as though books comprised a homogeneous monolith. Which of course they do not. </p>
      <p>— K.</p>
