    html: |-
      <p>Patty raises a good point. There are at least two kinds of books on *book design*. One variety is a how-to, which in many ways is a set of rules you should follow, and perhaps a list of typefaces. The problem with this is there is no one set of rules even at a given time, and moreover, the rules change with both technology and fashion.</p>
      <p>A second kind of design book chronicles more how designers think about their work, what they see as problems, and how these problems are resolved. The problem with this is you need some background before you have an understanding of what the process is about; before you can glean very much from them.</p>
      <p>I’d put Robert Bringhurst’s book in the first category, Rich Hendel’s in the second. You should probably have both, Though I’d prefer Tschichold for a “rules” resource.</p>
      <p>And depending on you perspective, there are also two kinds of book design, the cover and the interior. The two should perhaps relate, but the question is how much? In university press publishing, by in large the function of the jacket is viewed to be the same as that of a poster. That is an advertising function, and ephemeral. With obvious exceptions, the interior is suppose to be timeless (though that too is in some real ways an illusion).</p>
