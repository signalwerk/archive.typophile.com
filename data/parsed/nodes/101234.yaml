    <p>I'm looking for the font I lost that I used in a design. I'm pretty sure I downloaded or paid for it somewhere but I've lost the file and have been searching online for the font for 17 hours. Please help! I don't know the name. I need it for a couple products I'm making for a client and the deadline is by tomorrow. The font has to match, as I used it as his logo on all his other products. It will be a huge let down if I can't reproduce this for him. Here's my email address: <a href="mailto:SpittingImageGraphics@gmail.com">SpittingImageGraphics@gmail.com</a><br>
    THANKS FOR ANY HELP OR INFO!</p>
