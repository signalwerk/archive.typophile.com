      <p>I know this font. It is unhelpfully called "Handwriting" and I don't have any foundry info on it. Obviously if you enter that into a search engine you get too much.</p>
      <p>Some more info: it's by Sam Wang, you can find a sample here (it's on the left), and they say you can download it but I found the instructions confusing. It's a shareware font.</p>
