    html: |-
      <p>That font looks very much like Sulki &amp; Min <a href="http://www.sulki-min.com/wp/?p=571" rel="nofollow"><strong>Politie</strong></a> about which they say:</p>
      <p>Typeface, self-published, 2002. Politie is a monospace adaptation of the typeface Wim Crouwel designed in the 1960s for the typewriter manufacturer Olivetti, which was released after decades as digital fonts by the Foundry in London (Foundry Gridnik). Although neither the original nor the Foundry’s interpretation was designed as a fixed-width typeface, its rigid, modular letterform seemed apt for a monospace adaptation.</p>
      <p>The font <a href="http://www.foundrytypes.co.uk/foundry_gridnik/gridnik.html" rel="nofollow"><strong>Foundry Gridnik</strong></a> looks different though (and Sulki &amp; Min write that Politie was never released commercially)</p>
