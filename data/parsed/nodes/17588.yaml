    <p>I just purchased DTL Unico. It was a significant investment.</p>
    <p>However, I am getting discouraged because I can’t seem to print the font, or make a PDF for that matter.</p>
    <p>I buy fonts frequently, and have never had a problem before. Is there something I am not doing? Has anyone else had this happen to them?</p>
