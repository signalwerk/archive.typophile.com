      <p>It’s the PS1 version. And I have only bought the roman at this time (125 Euro) as I was intending to try it, and then buy the other weights I need after testing. However, even 125 euro for a single weight is a large investment considering the excellent full families  I can get at that price.</p>
      <p>I already had to email them after my purchase when I didn’t receive a link for a download page 6 hours after buying the font. Now I can’t use the font, so I am a feeling a little aggravated with my purchase. However, to DTL’s credit, it looks beautiful on screen and sets easily.</p>
