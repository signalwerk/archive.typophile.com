      <p>I have been troubleshooting the issue and have discovered the following:</p>
      <ul>
      <li> The font prints from Illustartor CS and QuarkXPress
      </li><li> The font does not print from Suitcase, Font Book, Word or OmniGraffle
      </li></ul>
      <p>I have no idea what that means, however...</p>
