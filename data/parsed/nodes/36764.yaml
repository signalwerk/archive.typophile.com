  html: |-
    <p>Hello,</p>
    <p>I have been browsing the forums for a few months in an effort to become acquainted with fonts for a business name.  For a numbers person I have realized the uses, types, and presentations are larger than I realized.</p>
    <p>I have a small business that specializes in backoffice work or data tracking in the oil and gas industry.  Trusts, individuals, and attorneys are areas I have gained work.  My business name is “Oildat”.  I have browsed the Parsine and Daxline fonts yet I am unsure how the short name presents.  Assurance, trust, yet modern or upbeat is a few meaning I would like to convey in the font and name.</p>
    <p>Any ideas, suggestions or a direction you could point me would be appreciated.</p>
    <p>Thank you again for providing a great atmosphere for learning.<br>
    Michael</p>
