      <p><cite>fonts for a business name</cite></p>
      <p>Do you mean for a logo? If so, I'd suggest a designer. Many will give you "unlimited revisions", so your satisfaction is practically guaranteed. </p>
      <p>Seriously though, they can make some subtle tweaks, even to simple words that make it work better. Some portfolios could probably be suggested to find someone whose work you admire.</p>
