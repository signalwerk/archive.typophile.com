      <p>Maxim Zhukov produced some years ago two editions of a book dealing with multilingual typography. I have found them helpful. There is comparative data about relative lengths of languages as well as commentary about special considerations for each language under consideration. I do not know if Norwegian is included [the book's at home; I'm at work].</p>
      <p>The book is "Typography: Polyglot" (1991, Cooper Union), written with George Sadek. The second edition is "Typographia Polyglotta" (1997, ATypI / Cooper Union). It may be tough to find this many years on.</p>
      <p>powers</p>
