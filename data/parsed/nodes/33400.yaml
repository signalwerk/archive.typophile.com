  html: |-
    <p>Hi<br>
    Does anyone know of a comparison of languages in terms of how much space they occupy in text? I once designed a bilingual annual report, with both norwegian and english text. The  english part was an unabbreviated translation of the norwegian version. </p>
    <p>When i started the project, i figured the norwegian version would need more space. It turned out the opposite was true. </p>
    <p>An index for different languages would sure be useful, especially when planning larger projects. it could look like this (i set english=100)</p>
    <p>German    =     112<br>
    English   =     100<br>
    Norwegian =      93</p>
    <p>Of course, this wouldn't apply for poetry etc, and i guess there would be differences between e.g. fiction and scientific litterature.</p>
    <p>alex</p>
