      <p><em>The english part was an unabbreviated translation of the norwegian version.<br>
      When i started the project, i figured the norwegian version would need more space. It turned out the opposite was true.</em></p>
      <p>This is generally true. The source language is the most compact, as it is using native words for native ideas.</p>
      <p>There is a table of lengths for translations from English <a href="http://www.cucumis.org/help_1_h/p_le_.html" rel="nofollow"> here</a>. (Note that the Asian languages at the bottom seem very compact, but in fact they are longer on the page.)</p>
