    <p>Please save the date for Sunday, December 5th, because <a class="freelinking external" href="http://cinemaspeakeasy.com/" rel="nofollow">Cinema Speakeasy</a>, <a class="freelinking external" href="http://www.echoparkfilmcenter.org/" rel="nofollow">Echo Park Film Center</a>, <a class="freelinking external" href="http://kernspiracy.com" rel="nofollow">KERNSPIRACY</a> and <a class="freelinking external" href="http://machineproject.com" rel="nofollow">Machine Project</a> are planning on taking you on <strong>THE TYPOGRAPHY JOYRIDE</strong>.</p>
    <p>There are a few things in this world that you will probably never live without: Oxygen, people, and words. </p>
    <p>It's this last element - well, typography, if you wanna split hairs - that we're especially interested in this month, and we want to help you learn more about the wonderful, esoteric, magical world of typeface design. </p>
    <p>So, Cinema Speakeasy is teaming up with Machine Project, the Echo Park Film Center, and KERNSPIRACY to present THE TYPOGRAPHY JOYRIDE, a combination workshop and screening event. </p>
    <p>We promise that when we're done with you, you'll never look at a billboard, book, magazine, food truck logo, street sign or potatoes in the same way again. </p>
    <p>===</p>
    <p><strong>POTATO-TYPE &amp; RANSOM NOTES:<br>
    A hands-on typography workshop with a <em>verrry</em> practical application</strong></p>
    <p><strong>Sunday, December 5th, 5PM- 7:30PM<br>
    Machine Project</strong><br>
    (1200 D North Alvarado St, Los Angeles 90026)<br>
    Class size limit: 32 people<br>
    Tickets (to cover materials cost): $20*<br>
    Workshop registration available online at: <a href="http://machineproject.com/events/2010/12/05/potatotype/" title="http://machineproject.com/events/2010/12/05/potatotype/">http://machineproject.com/events/2010/12/05/potatotype/</a><br>
    <em>* Workshop registration also gives you free entry to <em>Typeface</em> screening</em></p>
    <p>If you ever want to see your _______  alive again, join designer Micah Hahn, KERNSPIRACY's Spencer Cross, and the Cinema Speakeasy girls at Machine Project's first ever potato type ransom note workshop, where we'll cover the dangerous intricacies of type-design – from Daggers to Graves -  and learn a little about counters, kerning and some things in-between.</p>
    <p>Award-winning broadcast and graphic designer Micah Hahn will lead the group in a lighting typography tutorial - from counters to kerning, daggers to graves, ogoneks to carons, cedillas to commas, and everything in between. Each student will then be assigned a knife, and a letter of the alphabet, and a potato of their choice - and will be charged with making one element of what by the end of class will become Machine Project's brand-new <em>Communal Potato-Type Typeface</em>. </p>
    <p>But wait- there's also a practical application! </p>
    <p>Remember that ghost stories book that your best friend borrowed last year and never returned? Well we have a way of helping you get that back. It's called extortion, and nothing helps extortion like <strong>a beautifully crafted ransom note</strong>. </p>
    <p>So, at the end of class, we'll help each and evey one of you get your way by helping you lay out a ransom note, to be set on [fancy paper here] for you to send to someone you want something from. </p>
    <p>Envelopes will be provided. Legal protection will not. </p>
    <p>===</p>
    <p><strong>SCREENING OF <em>TYPEFACE</em><br>
    Great Characters, Both Wooden and Human</strong></p>
    <p><strong>Sunday, December 5th, 7:45PM - 10PM<br>
    Echo Park Film Center</strong><br>
    (1200 North Alvarado St, Los Angeles 90026)<br>
    Ticket cost (available at the door): $5*<br>
    <em>*Or free with workshop registration. All revenue from screening to be split between the Echo Park Film Center and the 'Typeface' filmmakers.</em></p>
    <p>After you have honed your extortion and potato carving skills, walk next door to take a load off, pop a beer and kick back with some new friends at Cinema Speakeasy's screening of <em>Typeface</em>. As with all Cinema Speakeasy events, drinking is highly encouraged, as is sharing of alcohol. </p>
    <p><em><strong>TYPEFACE</strong></em><br>
    Feature-length documentary<br>
    Dir./Prod. by Justine Nagan</p>
    <p>In rural Wisconsin, a lone employee waits in a cavernous old museum for visitors to come. A few individuals straggle in every few days and then, come Friday, the museum fills with life. Machines hum, presses print, artists buzz about. One weekend each month, the quiet of Two Rivers is interrupted as carloads of artisans drive in from across the Midwest. The place comes alive as printmaking workshops led by, and filled with, some of the nation’s top design talent descend on the sleepy enclave.</p>
    <p>In a time when people can carry computers in their pockets and watch TV while walking down the street, Typeface dares to explore the twilight of an analog craft that is freshly inspiring artists in a digital age. The Hamilton Wood Type Museum in Two Rivers, WI personifies cultural preservation, rural re-birth and the lineage of American graphic design. At Hamilton, international artisans meet retired craftsmen and together navigate the convergence of modern design and traditional technique. But the Museum’s days are numbered. What is the responsibility of artists and historians to preserve a dying craft? How can rural towns survive in a shifting industrial marketplace where big-box retailers are king?</p>
    <p><em>"Typeface the movie is like porn for designers."</em> (- <a class="freelinking external" href="http://twitter.com/varsko/status/17657643710" rel="nofollow">Varsko!</a>)</p>
    <p><em>"It's a well-crafted film, with human characters that are funny and sad, lovely camera work and taut editing... a movie that's equally appealing to art school hipsters and to lovers of rural America."</em> (- <a class="freelinking external" href="http://host.madison.com/ct/news/local/education/blog/article_cb9016e4-4bd1-11df-ae45-001cc4c03286.html" rel="nofollow">Susan Troller, The Capital Times</a>)</p>
