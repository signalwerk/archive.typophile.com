    html: |-
      <p>feature fina { # Terminal Forms<br>
       # Latin<br>
          sub Q by Q.end; # Changes a glyph from midword to a terminal<br>
          sub @k_mid by @k_end; # The same with class (k kcommaaccent to k.end kcommaaccent.end)<br>
       language TRK ;<br>
       language ROM ;<br>
       language MOL ;<br>
       script grek; # Greek<br>
          sub sigma by sigma1; # changes midword sigma to a terminal form<br>
      } fina;</p>
      <p>if you use calt feature that may affect the terminal form, then undo it in fina and don't forget to place fina below calt in open type features window.</p>
