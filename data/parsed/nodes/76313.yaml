      <p>My Lobster free font has a "fina" features that replaces the last letter of each word with their non-connecting alternate.<br>
      I included it under the "liga" feature, so it's ON by default.</p>
      <p>Download the font and have a look at the OT code.<br>
      <a href="http://www.impallari.com/lobster/" title="http://www.impallari.com/lobster/">http://www.impallari.com/lobster/</a></p>
      <p>Hope it helps</p>
