    html: |-
      <p>Jason, </p>
      <p>indeed, in the "fina" feature, it is the application that is responsible to determine the context where the feature should be applied, not the font. (In "calt", it is the font.) So the "fina" feature will always be applied at what the application considers "the end of the word". You don't need to check for that in your OT code. Note, however, that your "fina" code is free to make further checks, e.g. try to differentiate whether the final form is being applied before a space, a punctuation sign, or at the end of the line. The "fina" code can check for *additional* context (beyond the mere "end of word") but should not check for the end-of-word context. </p>
      <p>Also, note that there is a bug in InDesign that prevents the application from differentiating the end of a word and the end of a line effectively. I've discussed this here:<br>
      <a href="http://www.typophile.com/node/74544" title="http://www.typophile.com/node/74544">http://www.typophile.com/node/74544</a></p>
      <p>Best,<br>
      Adam</p>
