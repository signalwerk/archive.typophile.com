  html: <p>I wonder if someone would be kind enough to walk me through setting up the .fina OT feature. The font I'm building, a revival of a 16th-century italic, has a variety of word-ending glyphs, and while I'm familiar with the basic OT features (liga, calt, c2sc, frac, etc.), I've never set up .fina before. My uncertainty is how to set up a substitution based on the end of a word (followed by space/punctuation/etc.). Any help will be greatly appreciated.</p>
