    <p>Museo Bodoniano</p>
    <p>Palazzo della Pilotta<br>
    Strada alla Pilotta, 3<br>
    43100 Parma</p>
    <p>E-mail: <a href="mailto:mubodoni@unipr.it">mubodoni@unipr.it</a></p>
    <p>The museum is housed in Palatine Library inside the Palazzo della Pilotta, and it is entirely devoted to the work of typographer Giambattista Bodoni, director of the ducal printing house from 1768 to 1813. It contains tools, steel pushers, the original copper types and the alphabet cases belonging to the Royal Printing House (the same still used today for de luxe editions). It also keeps archives documents, letters and a very valuable edition of an Iliad printed in Greek dating back to 1808.</p>
