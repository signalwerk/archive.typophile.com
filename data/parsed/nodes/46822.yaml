      <p>I feel that Officiana Sans is a slightly condensed font as compared to Caslon. I think that Caslon is also a little too intricate to compliment a font as neat as Officiana Sans... </p>
      <p>Is there any particular reason that you aren't looking at Officiana Serif? That is a nice simple Slab serif Font that i think would work (it is a type system!) but then again it also depends on the context of it all.</p>
      <p>If i had to pick a, I think Century Old Style?</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/scangraphic/century_old_style_sh/" title="http://www.fontshop.com/fonts/downloads/scangraphic/century_old_style_sh/">http://www.fontshop.com/fonts/downloads/scangraphic/century_old_style_sh/</a></p>
