    <p>Hello everyone i am new in logo design andi know this theme is very old but i didn´t find any solution.<br>
    The big question is... can a designer use a font in a logo and tweaking the letters?(just move some anchor points adding sone round borders etc).When i mean tweaking the letters is just for a phrase not for redesign all the letters for create a "new font file".<br>
    I know it depends in some by the EULA but i see some design studios like DUOH here is an example <a href="http://www.duoh.com/graphics/news/fabulis-logo-start.png" title="http://www.duoh.com/graphics/news/fabulis-logo-start.png" class="link-external">http://www.duoh.com/graphics/news/fabulis-logo-start.png</a><br>
