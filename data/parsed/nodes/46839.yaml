      <p>i've been both, often at the same time. as an art director i work more conceptually, clarifying the meaning of choices, identity points, the meaning of visual decisions. as a graphic designer i work more hands-on; nudging pixels, tweaking layouts, kerning fonts.</p>
      <p>i think that's the key: an art director has more conceptual and contextual responsibility. a graphic designer should understand and employ that sort of thinking but works more directly with the hands-on process, often under the direction of an art director.</p>
