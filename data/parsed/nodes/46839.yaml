      <p>In the advertising agencies I've had expereince with it's basically the same role. The designers the work is sent to finish (ie no concept development) is usually called "production" or "the studio".</p>
      <p>I have a sneaky suspicion the only reason the 2 titles are used is so companies can pay you less as a designer but make you do the exact same work as an art director under guise that it will help you move up.</p>
      <p>I use both titles when people ask me what I do. Apparently it's more prestigious in the industry to be called an Art Director, but if you're looking for freelance work people want to hire a Graphic Designer.</p>
