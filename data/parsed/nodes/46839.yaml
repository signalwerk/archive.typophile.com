      <p>I see very few design companies still using that title art director. To clarify our roles we use the term Director for our people that manage an entire team (a development team, our visual design team, our interaction design team). The equivalent of art director in our company is Senior Designer, Senior Interaction Designer.</p>
      <p>You have to also understand the distinction in titles is not just about experience and talent. The longer a designer is in her/his field the more they have to hone their concepting skills (idea creation), their communication skills (idea selling) and their mentoring skills. </p>
      <p>Our team looks like this: </p>
      <p>Design Intern<br>
      Designer / Motion Designer / Interaction Designer<br>
      Senior Designer / Senior Interaction Designer<br>
      Associate Director<br>
      Director</p>
