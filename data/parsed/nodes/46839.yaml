      <p>Where I work, it's a meaningless title - from the moment someone is trusted to design work that will be shown to a client, that person has Art Director on their business card. There is a hierarchy, but it is not officially delineated. Some designers consider themselves junior Art Directors, others very vehemently declare they are senior Art Directors. Everyone's business card is the same, it just says Art Director. And between you and me, no one should have the title Art Director as no one but the Creative Director of the company directs anything, we're all just regular designers. But the title on the card makes people feel better I suppose.</p>
      <p>I think that the area where they cross over would be in designing the work. Certain AD's that I've worked for would set the tone of the design work, and then you as the designers would follow their lead, adding little bits of your own in there, but mostly following.</p>
      <p>But it really depends on where you work, how the roles are perceived.</p>
