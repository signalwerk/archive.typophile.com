      <p>"Artwork" was traditionally (pre-digital) considered to be the bits and pieces that were assembled on artboards.<br>
      Therefore, an art director directed the assembly (by the paste-up artist, a.k.a. mechanical assembly artist), as well as directing the art contracted out to type houses, illustrators and photographers, especially directing photo shoots. In those days, the art director's rough layout provided direction to all these people. Other work contracted out included the production of comps (comprehensive layouts), which were intended to be very close to what the finished thing looked like (although many art directors had sufficient skill with markers to do slick comps themselves). Also, comps could be made from dry transfer products and colored paper.<br>
      Art directors could also "direct" the selection of stock photography, although this was far less used before PhotoDisc came along.</p>
      <p>Not to forget directing another aspect of production--film and printing. Proofs that are made directly from digital files, rather than from film used to burn the plates, are a fait accompli not requiring much direction. </p>
      <p>So in the past, there was literally a lot more directing involved in art direction, before software telescoped and subsumed so many job functions. The distinction between advertising art direction and graphic design was more clear cut, now there seems to be more overlap and "globality" of branding.</p>
    html_clean: |-
