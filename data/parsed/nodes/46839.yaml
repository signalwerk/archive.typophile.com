      <p>My findings from freelancing as a designer at large agencies</p>
      <p>Creative director, Copywriter(s), Suits (account managers, marketing and strategic, R&amp;D), Art director, Studio manager, Graphic designer, Mac op, Trolley person, media placement and production managers... tv, programmers, animation</p>
      <p>The most important is the trolley person, especially on a Friday... when they push the trolley over full of beer, wine and snacks at 3.30pm... it is well received.</p>
      <p>In large agencies...</p>
      <p>Creative director(s) and suits.<br>
      Creative director (initial ideas/concepts... how did you think of that) works with art directors and designers together. or steals the designers ideas and wins an award for it.</p>
      <p>Once designed designers as semi final art (templates) then pushed out to mac ops to create the various media and final art watched and directed by art directors, studio manager.. with the occasional suit getting involved.</p>
      <p>Art directors will stay on the campaign and design other rough ideas and formats, though art directors are like the creative director(s) pets.</p>
      <p>Designers will work with the art directors to make the art director look good...<br>
      Mac ops will make anyone else on mac look really slow.</p>
      <p>Now the new term from where I am standing is not art director or graphic designer... just 'creative' </p>
      <p>Creative Director<br>
      Suits (account managers, marketing and strategic, R&amp;D)<br>
      Creative - copy writer(s)<br>
      Creative(s)<br>
      Mac Ops... plus all the others</p>
      <p>my all time favourite is the client who wants to art direct.........! or thinks they can!!</p>
      <p>sorry I am tired and waffling on... none of this makes sense if I re-read it.</p>
      <p>I like creative</p>
