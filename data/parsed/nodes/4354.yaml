    html: "<p>You know what gets me? Spamglish. You know, the language spammers use to get past filters, except it's evolved way beyond that now, where plain old harebrained spelling seems to be the goal itself. Like look at this: <br> <br>\" <br>Have you ever wanted to own a h ome?  Well here's your chance to get the ho me of your choice. <br>If you already own a hom e, we've got the be.st de.als possible... <br>\" <br> <br>Nobody with an IQ above 9 could think for example that the word \"home\" would cause a filter to kick in, and even if it did, misspelling it three different ways isn't gonna help. Then there's those periods. <br> <br>Here's another one: <br>\" <br>R u not satis.fying your mate... <br>R u unhappy with your size... <br>If so, we've got the answer <br>\" <br> <br>Who comes up with this crap? Maybe they just think it's cute. <br>What's scary is that maybe many people DO find it cute... <br> <br>hhp <br></p>"
