    html: "<p>&gt;&gt; Finnegans Wake anybody? Apostrophe or no?  <br> <br>If I'm reading you right, you're hitting the point bang on: Joyce made an<i> educated choice</i> about how to punctuate (as did e.g. J P Donleavy, probably under a heavy Joyce influence; or Burroughs with cut-up grammar, or Burgess with A Clockwork Orange, etc.). Knowing the rules and playing with them for your own and the reader's pleasure isn't the same as repeating received mistakes. <br> <br>&gt;&gt; And speaking of DFW and his cute &amp; precious ilk  <br> <br>Yeah, it's got that way recently. I'm no fan of the whole McSweeney's thing, and DFW is certainly susceptible to cuteness (and to the kudos of a coterie). I think he's capable of really great writing though, and a few people I know who are writers themselves agree with me. As you say, though, his style is infectious and there are lesser versions of it springing up everywhere. <br> <br>&gt;&gt;I'd rather be infected by Shakespeare or Samuel Beckett any day <br> <br>Surely any remotely widely-read person already is? <br> <br>R <br> <br></p>"
