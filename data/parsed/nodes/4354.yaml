    html: <p>I've just returned from a vacation in England, where, because this book was in featured in the news on the occasion of its US release, and my host had a copy, I read about half of it. I found nothing to justify claims that of "laughing at non-native English speakers" or linguistic imperialism. Surely the <i>British</i> National Union of Teachers, the <i>British</i> Broadcasting Corporation, and the <i>British</i> government - examples from the CNN article -  ought to be able to write English to native English speakers with native English fluency. <br> <br>Typophile readers might be amused that the author writes that she wishes she'd been around to have Aldus Manutius' babies.... <br> <br>Finally, can anyone identify the typeface used in the text? Its bowls are shaped like those of Melior/Zapf Book but it has various distinctly calligraphic features. <br></p>
