  - id: 32210
    user: 3480
    date: 2004-04-22T01:53:00
    date_raw: 22.Apr.2004 1.53am
    votes: null
    html: "<p>&gt; Just surf around places were \"common\" people go <br> <br>Well, let he who is without sin cast the first stone (only joking Chris <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> ). <br> <br>I don't think it's necessarily about purism, or linguistic imperialism (I'm sure Polish speakers get equally wound up about greengrocers' ogoneks or whatever). To me it's about supposedly qualified people who are quite well paid to do one thing (copyeditors) not doing it properly and thereby ultimately making language less beautiful and useful.  <br> <br>I'm most certainly not a lingua-purist -- I'm quite content with neologisms and I'm quite content to let archaisms like 'an history' and the don't-end-a-sentence-with-a-preposition rule slide. But it annoys the hell out of me to be reading a quality newspaper and find redundant parentheses (commas all over the place where they're not, needed) and the like. It confuses meaning and annoys a close reader. <br> <br>It is actually the job of the copyeditor to uphold certain values in language and punctuation. He/she should know not just the correct usage of colons and semicolons, but should be able to, e.g: distinguish em and en dashes; correct 'three period' ellipses; remove redundant punctuation; etc. <br> <br>I think when these skills decline -- as they are declining -- we lose a certain amount of precision from our language, and are thus less able to be precise in our communication. That's important, and worth getting wound up about. Wack apostrophes in the local supermarket, not so much. <br> <br>R <br> <br>(Please mark this post with red pen, give it a mark out of ten and send it back to me with your comments <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> ) <br> <br> <br></p>"
