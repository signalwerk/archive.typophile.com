    html: '<p>This is the Post-modern era, and the authority of printed text is not what it was. <br> <br>So the "sloppier" grammar of speech (and the "semi-speech" of email) finds its way back to the printed medium, dumbing it down, but also making it closer to the mainstream of reality. <br> <br>Two landmarks: the Watergate Tapes, and the Roger Clemmons and the Boston Press Incident, really showed up the difference between corrected, edited, proper grammar, as it is supposed to be done in print, and the vagaries of language as it is spoke. <br> <br>It was quite revealing to see, from transcriptions of the Watergate tapes, just how un-proper real speech is. (Of course, the plays of Beckett and Pinter made the point a lot earlier.) <br> <br>Clemmons was always complaining how he was mis-quoted by the sports press in Boston, so they decided to report his utterances verbatim, without the benefit of normal "speech-to-text" copy-editing, thereby making him come across as a complete neanderthal. <br> <br>The point is not that normal people are "morons", but that printed text has for a long time been mis-representing normal speech, and this is a correction.</p>'
