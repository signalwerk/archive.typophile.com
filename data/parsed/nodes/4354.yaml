    html: <p>&gt;&gt;when these skills decline -- as they are declining <br> <br>Are they declining? <br>In England there was a neglect of teaching English properly at primary schools throughout the 1980s &amp; much of the 1990s, but under the new National Curriculum, standards seem to be improving, and going beyond the levels that were prevalent before the decline. My kids learn grammar in a much more formal way than I ever did. <br>I think we (in the 1970s) were expected to pick up the rules through osmosis, via exposure to correct English, rather than by actually being told what they were. <br> <br>I <i>am</i> concerned about cultural imperialism (even within England, the language police have been, and continue to be, busy suppressing regional and class variations in speech and writing). <br>On the other hand, I think that where precision is important, it is necessary to be able to write exactly what you mean, and to expect others to be able to correctly read what you have written. The primary purpose is communication, and if the rich tapestry of cultural variation gets in the way, then maybe that's not a good thing.</p>
