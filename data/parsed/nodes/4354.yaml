    html: <p>&gt;&gt;Maybe we should rethink using words such as "damage" and "proper" <br> <br>Yeah, agreed. That's sloppy on my part. Variation and innovation in language is of course inevitable. But variation/innovation can be beautiful and intelligent -- when it makes its own kind of sense and/or grows out of a love and deep understanding of communication and language -- or it can be just dumb, lazy mistakes that get to seem OK because they're repeated often enough by 'authoritative' sources. E.g. I really enjoy reading David Foster Wallace's stuff. He has an amazing ear for language. You find yourself eventually thinking the way he writes, which is very far from 'proper' usage a lot of the time (beginning sentences with 'And but' etc.). And regional vernaculars often have their own grammatical tics which make total sense within their contexts. <br> <br>But there is usage, I think, which is just plain wrong and ugly -- generally usage which is trying to be transparent and authoritative but which falls over owing to lack of knowledge or skill on someone's part (either the writer, who can be excused, or the copyeditor, who can't). <br> <br>R <br></p>
