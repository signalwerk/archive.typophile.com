    html: "<p>\"Hey, if you want your language to become the lingua franca of the entire world, purity is the first thing you gotta give up. All your base are belong to us. \" <br> <br>But you see, I think the majority of the damage is coming from native speakers more than nonnative ones. <br> <br>Just surf around places were \"common\" people go; eBay for instance.  The spelling and grammar of the people who use eBay, on average, is just this side of a moron with an IQ of 10. <br> <br>I'm always chastising my brother for his atrocious correspondance to eBay members.  Even if they don't look intelligent, he should. <br> <br>And then of course you have the AOL/SMS/Scriptkiddie generation.  WaT r U lOkInG aT?!?!?!  DiS iZ nOrMlE sPeEk 4 uS!!!!111!11!  We DoNt NeD SkOolL!!!!!!  L8R! <br> <br> <br>:shudder: <br> <br>Don't get me started on \"1337\".</p>"
