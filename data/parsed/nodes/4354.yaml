    html: <p>David,  <br>check this out. <br><a href="http://www.planettribes.com/allyourbase/index.shtml" target="_blank">http://www.planettribes.com/allyourbase/index.shtml</a> <br> <br>"History of 'All Your Base' <br> <br>1.	Toaplan creates the Zero Wing video game.  <br>2.	Toaplan releases a port for the Sega Genesis console with the addition of an intro scene, which is then translated into english (very poorly) and released in the United States.  <br>3.	Toaplan goes out of business.  <br>4.	Someone from a Zany Video Game Quotes website notices the poor translation, and highlights the game.  <br>5.	Overclocked.org does a humorous voiceover of the Zero Wing intro in a fake Wayne Newton voice.  <br>6.	Dozens of game-related messageboards begin to post quotes from the parody, and images altered to show the phrase.  <br>7.	Most of the threads lose interest and die off quickly as the trend is pronounced dead countless times.  <br>8.	The Flash movie/video is released with images from the threads and music taken from the origional game someone had added the phrase "all your base" to.  <br>9.	AYB explosively expands to the general (non game messageboard-reading) public.  <br>10.	The origional site for the video is shut down within hours due to excessive traffic, and moves to PlanetStarsiege.  <br>11.	Lycos ponders how "All your Base" was transformed from obscurity to a top 50 search practically overnight.  <br>12.	Mainstream media begin to notice the trend, and stories appear in Time Magazine, USA Today, Fox News, The Los Angeles Times, Tech TV, Wired, and many others.  <br>13.	As the 'remix' used in the video goes from 58 hits a day to several thousand per day, mp3.com notices the track has been ripped directly from the video game and pulls the music off their site due to copyright violations. It is later returned unchanged.  <br>14.	The trend continues to grow as it expands into nearly every corner of the web.  <br>15.	Large websites like Angelfire and Hewlett Packard sneak "all your base" references into their designs.  <br>16.	"All Your Base" is pronounced dead several times every day, yet it's 15 minutes of fame continue for some reason...  <br> <br></p>
