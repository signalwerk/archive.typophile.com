    html: <p>This is pretty interesting. <br>Some of the shapes need a bit of taming (like the "4") but I would actually emphasise the ambiguity overall; specifically I'd increase the "componental" aspect, for example how the "B" is a bracket plus a "3". I think you can get an interesting texture with a line of type set in a font like that. <br> <br>The other thing is that the numerals are slanted in an otherwise upright alphabet. <br> <br>hhp</p>
