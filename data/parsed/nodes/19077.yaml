  html: |-
    <p>Can anyone justify the use of making specific word(s) within sentences bigger? I have a page of text, set in two columns. The writer and I want to call out specific phrases. The layout I’ve generated does this: Garamond 11pt throughout but 2-3 word phrases are 16pt. Leading is 14pt throughout. I see this used in many publications and in advertisements all the time. Most everyone here likes it. But there are a few conservative folks who find it distracting. Anyone know of articles from typographers or designers discussing mixing big and small sizes together? Thanks so much.</p>
