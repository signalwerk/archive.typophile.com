      <p>"This is because in Europe, there are different laws pertaining to font designs and public domain Unicode data that are not applicable in the United States."</p>
      <p>There are different laws pertaining to intellectual property in that outlines in fonts are not copyrightable in the U.S. as they are in some other countries (the names are however and the software is). The EULA is not affected though. The individual EULA is binding in all locations.</p>
      <p>ChrisL</p>
