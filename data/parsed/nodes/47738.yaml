      <p>Usually, most major manufacturers of fonts in the United States include in their licensing agreement (that comes with your purchase of the right to use their fonts) also the right to embed their fonta in a PDF (although some manufacturers of Arabic fonts do not include this common right).</p>
      <p>There is however another difficult legal problem when you use some US font manufacturers' font designs or even public domain Unicode data in Europe. This is because in Europe, there are different laws pertaining to font designs and public domain Unicode data that are not applicable in the United States.</p>
      <p>So, if your magazine PDF uses legally licensed fonts obtained in the US, the PDF file may contain embedded illegal fonts in Europe.</p>
      <p>I am unaware of a legal court decision or precedent regarding this. Hence, there will be a an unwillingness to enforce action because the issue is so unclear.</p>
