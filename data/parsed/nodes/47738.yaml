      <p>According to my limited understanding of the extra time and expense that Linotype of the USA devoted to the creation of seemingly engineering drawings of each character and letter form to meet the requirements of the US Patent &amp; Trademark Office, this was done so their actual design of characters and letter forms are admissible “design patents”.</p>
      <p>This seems like a lengthy, time-consuming, and costly, approach to protecting ones design patents. A company as large as Linotype, or Monotype, or Agfa, maybe even Adobe, could do this. But smaller type foundries certainly can not.</p>
      <p>In Eurupe, I don't know what are their requirements to secure a design patent. Perhaps, it is the same, or perhaps it is rather less lengthy, less time-consuming, and less costly.</p>
      <p>Apparently, in Europe a letter form's design is recognized as intellectual property, like Unicode data from a public domain text. In the United States, it is not.</p>
      <p>Why?</p>
