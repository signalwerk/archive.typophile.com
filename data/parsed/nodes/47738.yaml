      <p>&gt;&gt; I’ve been around the font licensing biz for a while, but this is the first I’ve heard of this. Any sources for these claims?</p>
      <p>&gt;&gt; the *digital* vector outlines of letters were indeed subject to copyright, based on point placement. </p>
      <p>I would have to clarify for SII, disagree with Dezcom, and agree with Thomas.</p>
      <p>We are discussing two issues here:</p>
      <p>1) the software instructions, which are subject to US copyright like any verbal expressions are subject to US copyright, to describe "intellectually" the shapes of letter forms.</p>
      <p>In years prior to the the advent by Adobe of PostScript fonts, the prevalent font format was bit maps. The US Copyright Office ruled that the software instructions which made up bit map font technology were not "intellectual" or verbal instructions, and not subject to registration for US Copyright. Instead, bit map fonts were "mere digital data depicting letter forms.</p>
      <p>However, when Adobe introduce outline typeface software, fonts took on a totally new meaning. Outline typeface software was not "mere digital data depicting letter forms". Rather, they were "intellectual" verbal instructions, like any verbal expressions are subject to US Copyright, and in deed subject to full US Copyright without any disclaimers.</p>
      <p>Years ago, I worked at Font World, Inc. of Rochester, NY. I was engaged in a fascinating correspondance with the head of the US Copyright Office about my registration of various sets of typeface software programs. That head person of the US Copyright Office wanted me to add a disclaimer to my registration application that I was only registering the software programs, but not the instructions which rendered the shape of the letter form. She insisted that such descriptions were not "intellectual" verbal instructions, but "mere digital data depicting letter forms", and hence not subject to US Copyright.</p>
      <p>I refused. I argued that this is comparable to retelling a story. One person's account os different than another person's account. One storyteller embellishes the story by choosing certain words, and another person tells the story differently. Similarly, two type designers describe exactly the same type design, in two different ways. Although the typeface software programs are the same in a sense that they describe the very same design, nevertheless the typeface software programs are very different, as Thomas points out that "Judge Whyte seemed to say that the *digital* vector outlines of letters were indeed subject to copyright, based on point placement." The key  words are choice "point placement."</p>
      <p>In the end, the refusal to add a disclaimer was accepted, the typeface software programs were accepted for registration, and the US Federasl Court ruled in Adobe's favor to protect their intellectual property rights.</p>
      <p>2) the actual design of the letters - there is no law protecting one's ownership to a design of a letter form, according to US Copyright law. On Europe, however, there are laws which protect one's ownership to a design of a letter form. At Linotype, in Haupage, Long Island, NY, I saw fascinating technical drawings of letter forms of popular Linotype designs for submitting to the US Trademark Office. This is a novel and costly approach, but in the US Trademark Office a design can be registered and protected. This may be a way to solve the whole issue.</p>
