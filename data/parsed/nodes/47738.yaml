    <p>Hi all</p>
    <p>Can anyone answer this?</p>
    <p>We are opening an overseas office to publish local editions of UK magazines along with reprinting one-shots. We own licensed copies of all the fonts to be used on the local editions but not the titles which we intend to reprint from PDF's, though creating new covers, and some additional pages.</p>
    <p>Legally are we supposed to own the fonts used in the PDF's? It seems to be a grey area. If I needed to amend pages, I could theoretically extract from the PDF's the areas I don't need to affect/can't as we wouldn't have fonts. The question is, would this technically be illegal or could I argue that we are reprinting material with small changes??</p>
    <p>Look forward to your thoughts.</p>
    <p>Thanks</p>
    <p>p.s. I should point out we are not trying to dodge the bullet on cost, just trying to understand the legalities.</p>
