      <p>A few considerations. Fonts are generally licensed for a particular site - ie for workstations at one location. Obviously outmoded in today’s world of laptops but none-the-less that's what the licenses say.</p>
      <p>Most licenses allow PDFs to be passed around organizations, so you're probably okay sending PDFs to the overseas office. </p>
      <p>But the editing of covers etc., seems to be tricky part. You don't open PDF's, right? You send InDesign of XPress files plus a bundle of fonts? If so I don't think the overseas office can avoid licensing these fonts for use locally. If they want to stay legal.</p>
