      <p><cite> &gt; According to my limited understanding of the extra time and expense that Linotype of the USA devoted to the creation of seemingly engineering drawings of each character and letter form to meet the requirements of the US Patent &amp; Trademark Office, this was done so their actual design of characters and letter forms are admissible “design patents”.</cite></p>
      <p>I've spent some time studying Linotype drawings such as you describe, as well as other aspects of Linotype manufacture in the mid 20th century. It would not surprise me to learn that copies of these may have been submitted for the purpose of design patent application.</p>
      <p>However, I've never before heard the contention that these drawings were done expressly or primarily for this purpose.</p>
      <p>Mechanical drawings were created for every character of every size of every typeface design as a critical part of Mergenthaler Linotype's manufacturing process. And it was just that, a manufacturing process. Creating fonts of Linotype matrices was a complex machining process, with very minute and precise tolerances, and required complete and thorough blueprints for every piece. </p>
      <p>I doubt that MLCo would have maintained an extensive drawing office -- with two levels of management and scores of workers, not to mention an extensive q.c. process -- just for the sake of preparing patent applications.</p>
      <p>-- Kent.</p>
