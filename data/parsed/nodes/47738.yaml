      <p>Submitting design patents is really not that difficult. It costs a bit of money, though. I find the fee schedule a bit hard to decipher, but I gather the total cost will be several hundred dollars. Luckily design patents don't have the major maintenance fees which apply to utility patents.</p>
      <p>If anyone wants to see what a recent Adobe patent application looks like, go to the USPTO Web site, and do a search for patents with the title "Type Font" (we use the generic title for all of them), or for inventor "Slimbach; Robert". Unfortunately, it costs money to actually acquire a copy of the patent filing.</p>
      <p>(Usual disclaimer: I'm not a lawyer and am not offering any legal advice here.)</p>
      <p>Cheers,</p>
      <p>T</p>
