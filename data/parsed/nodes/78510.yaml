  html: |-
    <p>I'm working on an OpenType font in FontLab 4.5, and the dot on the j, and the top dot of the colon is appearing and printing small when loaded into an app.</p>
    <p>The dot on my i looks okay though. The top dot on my ; looks swell.</p>
    <p>What the holy hell?</p>
    <p>I have deleted and replaced these dots and yet they still continue to shrink. God help the font designer who also receives this wretched curse.</p>
