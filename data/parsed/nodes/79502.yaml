  html: |-
    <p>Hi,</p>
    <p>In the last issue of Fortune Mag (Feb 2011), you can see a 3D version of what I believe is the Solano font.</p>
    <p><a href="https://skitch.com/aldo/r1n76/venture-2" rel="nofollow"><img src="https://img.skitch.com/20110228-dirnf4k7at838n5e41eq9x585c.preview.jpg" alt="venture-2"></a></p>
    <p>Are you aware of a 3D version of this font? If yes, where could I find it.<br>
    Do you know a quick way to achieve this kind of effect? (ie an illustrator plugin)<br>
    Is there similar font out there? What would be the keyword to dig those out? (English is not my primary langage)</p>
    <p>Thank you.</p>
    <p>3D text effect here:<br>
    <a href="https://skitch.com/aldo/r1n76/venture-2" title="https://skitch.com/aldo/r1n76/venture-2">https://skitch.com/aldo/r1n76/venture-2</a></p>
    <p>Solano font on myfont here:<br>
    <a href="http://new.myfonts.com/fonts/mvbfonts/solano-gothic-mvb/" title="http://new.myfonts.com/fonts/mvbfonts/solano-gothic-mvb/">http://new.myfonts.com/fonts/mvbfonts/solano-gothic-mvb/</a></p>
