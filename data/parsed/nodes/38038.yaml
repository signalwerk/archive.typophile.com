    <p>Can anyone identify this face? The image is a scan of a letterpress-printed sample.<br>
    It bears some similarity to <a class="freelinking-external" href="http://www.myfonts.com/fonts/ef-typeshop/wichita/bold/charmap.html">Wichita TS-Bold</a>, so perhaps this is M.F. Benton’s Wichita? I have not been able to find a sample of the metal version of Wichita to confirm.<br>
    </p><div class="imageWrap"><img src="/files/metal_4056.png"></div><p></p>
