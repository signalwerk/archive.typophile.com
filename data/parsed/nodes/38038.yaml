    html: <p>Just to clarify, I mainly just need the name for this typeface, I know there is probably no digital version of it. It is for a metal type shop at a school where I teach. We have this face only in this weight (and sadly one size), and we would love to know the name of it. All of the other metal type has been identified, except for this one. If it is any help, most of the other type in the shop seems to be predominantly from ATF. Hoping someone out there might recognize it.</p>
