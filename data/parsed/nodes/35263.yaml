  html: |-
    <p>I’ve got a very picky client who wants everything right. By everything, I mean the fonts are targeted for use on Mac and Windows, and for print. By right, I mean the regular and bold are the proper distance in weight from each other on both platforms, and when printed. </p>
    <p>I can solve everything except this one thing: is it possible to use one digital outline for the screen, but when it goes to print (a word document), another font is substituted? This is to get around the problem that I can make a regular and bold that work on the Mac, but regular is then too light for Windows, so it gets hinted to be heavier for windows, no problem. But then the printing of regular is too light if I do it thus so we want a bolder regular to be used only for that purpose...</p>
    <p>Any route known for this, or should I start mixing some Cool-Aid, just like the big guys do? ;-)</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080705153857/http://www.typophile.com/node/21292" class="topic-previous" title="Go to previous forum topic">‹ Double Mapping Greek Glyphs?</a> <a href="/web/20080705153857/http://www.typophile.com/node/35280" class="topic-next" title="Go to next forum topic">Fontlab - how do you delete a segment between nodes? ›</a></div>
