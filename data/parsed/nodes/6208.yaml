    html: <p>In response to the first question, no the SIL series are certainly not the best typefaces out there with IPA characters. For body text, a far better typeface than those Times and Courier clones would be the amazing <a href="http://www.sil.org/~gaultney/Gentium/"> Gentium</a>, which, coincidentally, is also free. For heads and facts etc, there is as mentioned Lucida Sans Unicode, which comes bundled with Windows and possibly other Microsoft products, and which works just as well in print as on screen.</p>
