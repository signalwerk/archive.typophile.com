    html: |-
      <p>Very nice, Tim! You're correct on all counts. It was designed by Robin Nicholas at <a href="http://www.customfonts.com/csview.asp?cs=Opel" rel="nofollow">Monotype Custom Font Solutions</a> after test characters designed by Gary Scriven and his team at Interbrand Newell &amp; Sorrell. In fact it's a modified Metro/Geometric 415 (hence the subway hint).</p>
      <p>I picked this one as I recently found out <a href="http://www.terrastone.be" rel="nofollow">a local business</a> used Opel Sans for its logo. Some graphic designer obviously was asleep at the wheel when selecting the face for the logo, though the name "Opel Sans" in the font menu must've set off some warning signal. Can't believe they missed that. :^/</p>
