    <p>Hi everyone!</p>
    <p>I needed a few suggestions for fonts that can be used in relatively low sizes of 6&amp;7. I have come across two fonts which are clear and maintain the readability. They are the Garamond Premier Pro Caption and ITC Berkeley.</p>
    <p>I would really appreciate if some of you can suggest me a few more. Please do mention a few Sans serifs too along with the serifs.</p>
    <p>TIA</p>
