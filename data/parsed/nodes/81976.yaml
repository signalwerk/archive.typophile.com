    <p>hey guys,</p>
    <p>I've been working on a personal project lately, and thought I'd share it here,</p>
    <p>It's been more of an experimental project, combining different programs, using Typography and Fluids. I was interested in seeing the outcome of letterforms made out of fluids and liquids, or even better, what if you had some paint in the form of a letter and let it explode? Well, this has been a really fun project to work with, here are a few letters from the project, I’ll be publishing the final results of the project soon.</p>
    <p><img src="http://www.skyrill.com/blog/wp-content/uploads/2011/05/a.jpg"></p>
    <p><img src="http://www.skyrill.com/buffer/abc/c.jpg"></p>
    <p><img src="http://www.skyrill.com/buffer/abc/k.jpg"></p>
    <p><img src="http://www.skyrill.com/buffer/abc/s.jpg"></p>
    <p><img src="http://www.skyrill.com/buffer/abc/x.jpg"></p>
    <p><img src="http://www.skyrill.com/buffer/abc/z.jpg"></p>
    <p>More experimenting, images, and even videos on the next update!</p>
    <p>Original topic: <a href="http://www.skyrill.com/blog/?p=571" title="http://www.skyrill.com/blog/?p=571">http://www.skyrill.com/blog/?p=571</a></p>
