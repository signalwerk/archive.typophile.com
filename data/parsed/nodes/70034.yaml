  html: |-
    <p>Hello.<br>
    My book is a technical manual for an art technique that has 4 large chapters and each chapter has several sections and some of the sections have subsections within them. Instead of the traditional table of contents I would like to make an index page with maybe a sentence-long summaries of each chapter or/and section... What are some other ways to make the traditional TOC a better, more useful experience for the reader?</p>
