    html: |-
      <p>If you're using Photoshop, there is an even easier way and it leaves the text editable.</p>
      <p>To mimic this example:<br>
      1. Make the background blue<br>
      2. Add your text in dark gray (as Northbay previously stated, this automatically creates a new layer)<br>
      3. Add a layer style to the text layer – Outer Bevel, direction down<br>
      4. There is no stage four</p>
      <p>This is not necessarily the best way, but it's quick.</p>
      <p>The general rule of thumb is to add a softened drop-shadow of the text in a lighter colour to mimic a highlight. You can even get an approximation of this effect in CSS (see <a href="http://www.reynoldsftw.com/2009/03/text-embossing-technique-with-css/" rel="nofollow">here</a>) and throughout the iPhone UI, for example.</p>
      <p> My quick example here is:<br>
      —Style: Outer Bevel<br>
      —Technique: Smooth<br>
      —Depth: 1%<br>
      —Direction: Down<br>
      —Size: 3 px (this is only a small test image, a higher-res image will be different)<br>
      —Soften: 5 px (same)<br>
      —Angle: 90º<br>
      —Highlight Opacity: 65%<br>
      —Shadow Opacity: 50%</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/outerbevel_4032.jpg"></div><p></p>
