    html: |-
      <p>Here's a simple way:</p>
      <p>1. Make the background black<br>
      2. Create new layer and add the blue color and add bevel&amp;emboss/contour to it.<br>
      3. Write the text (a new layer is automatically created)<br>
      4. Rasterize this layer<br>
      5. Use the wand, mark the type and select the blue layer..<br>
      6. ..and hit delete.</p>
      <p>Voilla!</p>
