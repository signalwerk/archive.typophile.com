  html: |-
    <p>Hey, I have been trying to figure out how to create this embossed/punched out effect (below) and I can't seem to find any useful tutorials. Is there anything out there that you guys could point me to?</p>
    <p>Or could you give me a quick run-down? Thanks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Embossed_5538.png"></div><p></p>
