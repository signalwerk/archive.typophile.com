    html: |-
      <p>I do think at least the large serif lettering is a font, because I can't see differences in identical letters. The closest I found was <a class="freelinking external" href="http://new.myfonts.com/fonts/typadelic/jot/">Jot</a> by Ronna Penner of Typadelic. It's possible she made a custom version for this company -- it seems that close to me.</p>
      <p>- Mike Yanega</p>
