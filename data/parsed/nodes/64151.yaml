      <p>There's about 3 fonts there. I was looking at the connected script as 'handwriting', but then I guessed you were talking about the serif and sans fonts that looked hand-drawn. Did you check out Stephen Coles' list of hand-drawn text fonts? In my Script Guide they would be found in <a href="http://www.bowfinprintworks.com/Script06Pg1.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Part 6</a>, if I collected them.</p>
      <p>- Mike Yanega</p>
