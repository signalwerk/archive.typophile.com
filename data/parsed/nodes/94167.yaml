    html: |-
      <p>Thanks for the reference -- I was unaware that longs + dotaccent had its own codepoint.</p>
      <p>The other characters in this range are mediaeval scribal abbreviations. Just to clarify, I wasn't planning on adding additional codepoints to support mediaeval usage. I was just wondering which s+diacritic sequences which are currently in use were also used at the time when long s was used, since many modern diacritical marks are relatively recent innovations.</p>
      <p>André</p>
