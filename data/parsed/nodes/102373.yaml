    html: |-
      <p>@quadibloc:</p>
      <p>As I remember, Linotype Times was available in the States with long descenders. There were some photocomp fonts -- A-M, for one -- that offered Times with long descenders as well. Whether by agreement or theft, the A-M Times was a Monotype version.</p>
      <p>There was also a Times wide, can't remember if that was Monotype or Linotype, and if it had long descenders available.</p>
      <p>As a sidenote, somebody had an absolutely beautiful 14-point version of Times that used long descenders. I came across a book set in it the stacks at Duke library some 40 years ago, &amp; now wished I'd written down the publishing information.</p>
      <p>As for Goudy Oldstyle, Lanston Monotype offered a PostScript version that had "long" descenders.</p>
      <p>* * *</p>
      <p>For so many metal fonts, it could/can be hard to know what was drawn &amp; then cut, and with photocomp anyway, what was available over time.</p>
      <p>Remember that at Monotype, little errors happened -- the wrong capital R was sent down with Bembo, and (perhaps) the wrong version of Fournier was what was cut. My acquaintances from the Linotype U.S. drawing room are silent on details that might embarrass management, but I do know similar things happened. I believe Kent knows the old New York drawing room people better than I. And of course David Berlow, who sometimes posts here, worked there in it's later years.</p>
