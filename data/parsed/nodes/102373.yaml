      <blockquote><p>in the Linotype hot metal days, you could order long descenders for some fonts. As best I remember, this was always where the hot metal was itself a revival of an earlier foundry font. Odd in a way, because the ascender size wouldn't change. Whether this was a matter of commerce or aesthetics, I don't know.</p></blockquote>
      <p>Neither commerce nor aesthetics, per se. </p>
      <p>For metal Linotype, the vertical location of the baseline within the em was standardized and absolutely fixed for each nominal size. A standardized alignment was a practical necessity to enable matrix mixing inline. I believe that Linotype’s alignment closely followed ATF’s “American Standard Lining” alignment from the turn of the 20th century — it was a widely adopted standard. But that alignment happens to have given short shrift to the allotment for descenders.</p>
      <p>(Somewhere deep in the bowels of Typophile there should be a previous, long thread about Standard Lining — I don’t know if it’s still intact or discoverable.)</p>
      <p>Later, to accommodate evolving tastes and desires (primarily concerning book work), provisions were made to outfit some Linotype faces with longer descenders. Note that for these fonts, the baseline alignment remains fixed by the standard and these descenders actually protrude beyond the nominal em — and so these fonts *must* be cast on slugs with at least 1 pt leading.</p>
      <p>Charles — The provision of long descenders as an option was not tied to the existence of an old foundry exemplar. Many designs original to Linotype were outfitted with both short and long descenders — Electra, Caledonia, Fairfield, Eldorado, Primer, probably others. </p>
      <p>With certain faces, the long descenders were considered the defaults and the “available-upon-request” option was for short descenders in order to allow the font to be set solid.</p>
