    html: <p>I think it will be helpful to properly understand the origins of the tall ascenders in many typefaces. It is not that the ascenders are made tall relative to the cap height, but that the cap height and ascender height are independently determined relative to the x-height. This means that virtually any relationship of cap to ascender height is possible so long as each, independently, looks good relative to the x-height. The tendency in the humanist manuscript hands on which the first roman and italic types were based was that extenders tended to be quite long relative to the x-height, while caps tended not to be overly large, presumably so as not to dominate the page. These proportions were translated into type, and persisted in serif book hands for a long time. In 18th Century England this begins to change, and Caslon's and Baskerville's caps are larger relative to the x-height, and hence the difference between the caps and the ascenders is less.</p>
