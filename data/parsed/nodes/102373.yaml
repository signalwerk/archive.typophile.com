      <p>Don't know if this will help, but an essay by Martin Majoor might be interesting for you:</p>
      <p><a href="http://www.typotheque.com/articles/my_type_design_philosophy" title="http://www.typotheque.com/articles/my_type_design_philosophy">http://www.typotheque.com/articles/my_type_design_philosophy</a></p>
      <p>Note that the first (modern) sans was envisioned as a display face, where the relationships of the ascenders and descenders to the caps usually fill a different role.</p>
      <p>The shortening of ascenders has another modern component. Revivals of classical faces such as Bembo (and even Baskerville), first in photocomp, then PostScript, used shorter ascenders. Whether this was a stylistic decision or simply made considering the marketing of fonts for uses other than book composition, I do not know. It would have been great fun to have been a fly on the wall where those decisions were made -- which likely wasn't the drawing room.</p>
      <p>Also, remember that with photocomp &gt; PostScript, the size of the metal font used for the one-master-for-all sizes was a consideration. I believe the 8-point master was selected for Bembo, at least as offered by Linotype for their L-202 typesetting machine. </p>
      <p>The smaller masters usually had a design where the character contrast worked better with offset printing from photographic repro,  as opposed to repro pulled from metal type on a proofing press. But the smaller masters also usually had a larger x-height, which is essentially equivalent to shorter ascenders.</p>
      <p>* * *</p>
      <p>If you follow the Majoor essay on down, note his reasons for drawing Seria, which he considered a classically proportioned font, better for bookwork. For whatever reason, Seria hasn't caught on -- at least in the States -- which I find a bit sad.</p>
      <p>John,  or others, may know more more details, these remarks are essentially only my observations, and I offer them based on how I think marketing decisions for the sale of fonts have affected the extender lengths, and also by the increased use of type for signage and advertising. I'd add that at our shop -- bookwork only -- and where the license permits, we go into the fonts and restore the ascender/descender proportions of the 10-12 point metal fonts.</p>
      <p>FWIW</p>
