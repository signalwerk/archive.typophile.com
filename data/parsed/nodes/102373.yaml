      <p>Some things:<br>
      - As has been said the main reason to make the ascenders and caps match or not is whether you're shooting for a display or text font, respectively. This is because when people are consciously looking at something they generally like things to line up, but for immersive reading that makes the caps jump out.<br>
      - Sans fonts are generally more for display than text, so they make the heights match more often.<br>
      - The larger the x-height, the more reason for them to match.<br>
      - If they're coming close enough, just make them snap; somebody could be using your text font for display (you're not there to stop him) and the slight difference will look like you messed up.<br>
      - You can of course make the caps narrower (but not much lighter) to compensate for too much height. But be careful not to make them look like lc.<br>
      - For writing systems you don't have nativity in, check with a native concerning acceptable proportions. In Armenian for example caps can look narrower than in Latin without being freaky (although I myself prefer them low and wide nonetheless).<br>
      - Sometimes caps are made unusually large because the designer wants the font to be more usable for scanning/searching a document (as opposed to reading it fluidly) since proper names stand out more. Think of a history reference book.<br>
      - Sometimes caps are made unusually large because you want all-caps setting to stand out more. There are some fonts where the caps are also/alternatively made unusually dark. Credit where due: I learned this last bit from David Berlow on Typophile, a while back (but I can't find the thread).</p>
      <p>hhp</p>
