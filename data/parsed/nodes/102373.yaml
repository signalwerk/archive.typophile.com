      <p>To address the OP:<br>
      The dialectic you propose between old style serif typefaces and 20th century sans serifs is way off the mark.</p>
      <p>“Jenson”, not Bembo, may be considered the beginning of typographic time (pace blackletter), and Jenson’s ascenders were cap height.<br>
      The pertinent questions to ask:<br>
      *Did Bembo make the caps smaller or the ascenders taller, vis-a-vis the prevailing Jenson style?<br>
      *Why did he do that?</p>
      <p>Cap height ascenders reappeared in the 18th century (e.g. with Baskerville) and may be considered modern.<br>
      Again, why?<br>
      It’s interesting to note that 18th century modernist (aka neoclassical) page layouts had substantial leading between lines, whereas previously the style was to set solid.<br>
      A before-and-after comparison of 18th century book page layouts may be helpful.</p>
