      <blockquote><p>I believe the 8-point master was selected for Bembo, at least as offered by Linotype for their L-202 typesetting machine.</p></blockquote>
      <p>Strange … my Linotype catalogue from 1984 shows a rather skinny Bembo. Apart from the ascenders and descenders being rather short, it does not look like an 8 point design at all. The Monophoto / PostScript version has also always been rather skinny (as is Jan van Krimpen’s Spectrum for Monophoto / PostScript). Recently, Bembo book has been re-introduced. Apparently that design was based upon a master for smaller sizes. The ascenders and descenders are somewhat longer that the roman, so having Bembo book for text and Bembo roman for display sizes makes Bembo roman look rather funny. As if in its underpants …<br>
      I’d highly recommend to read Tim Ahrens’ fantastic <a class="freelinking external" href="http://markbattypublisher.com/books/typography-monographs-volume-2-size-specific-adjustments-to-type-designs-an-investigation-of-the-principles-guiding-the-design-of-optical-sizes/" rel="nofollow">book on optical scaling</a> for an overview on what has been done for smaller sizes (both historically and recently).</p>
      <p>More recently, Monotype released quite a promising range of <a class="freelinking external" href="http://www.fonts.com/search/all-fonts?searchtext=etext#product_top" rel="nofollow">eText</a> typefaces. As far as I can judge from the screen, they would also serve as a ‘caption’ size, as Adobe and others call it. They are primarily marketed as Web or e-Reading fonts,  available as Webfonts only though, but I suppose that many of these fonts would also do better in small print than their regular companions.</p>
