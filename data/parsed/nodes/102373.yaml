      <blockquote><p>Strange … my Linotype catalogue from 1984 shows a rather skinny Bembo. Apart from the ascenders and descenders being rather short, it does not look like an 8 point design at all.</p></blockquote>
      <p>Yes, I think -- but only that -- that in the times of the Linotype 202, 505, &amp; maybe the earlier V-I-P, the various font offerings differed. Perhaps what was used/offered even varied by country. </p>
      <p>I distinctly remember having to check master sizes -- for example, a designer friend of mine was briefly taken with Vendome, and wanted to use it for a text. The only "Vendome" available for the L-202 was based on an 18-point master -- at least, in the States. We tried it, once.</p>
      <p>The Bembo we had for the L-202 was listed in the catalog, as an 8-point master. It was "skinny" not in width, but in weight. Sometimes Linotype offered choice of master sizes for a font, but these were usually between a size clearly for text, and a size clearly for display. Don't remember, but Bembo may have been an exception, with an 8, 12, and 18 point master size available. If so, the other masters were even thinner in weight.</p>
      <p>For anyone studying the the proportions of type, esp. as they occur with metal and hot-metal revivals in photocomp &amp; PostScript, best to go and check the old specimens &amp; catalogs.</p>
      <p>Looping this back to the question of the thread, in the Linotype hot metal days, you could order long descenders for some fonts. As best I remember, this was always where the hot metal was itself a revival of an earlier foundry font. Odd in a way, because the ascender size wouldn't change. Whether this was a matter of commerce or aesthetics, I don't know. Probably a bit of both.</p>
