  html: <p>Since the beginning of time, ie Garamond, Bembo, Caslon and all the old style serif typefaces. The ascenders, on for example, the "h", "d" "b" rise above the caps height on all the capital letters. However, for Futura, Gill Sans and Helvetica, this is not the case. Why did Futura, Gill Sans and Helvetica opt for a different style and how does the extended ascender affect readability?</p>
