      <p>There might be some typos, I trully apologize about that :(<br>
      You might be right about the birds as well. The logo is, unfortunately, in its finished state, but before that it was viewed by various people from this "comix-community". I didn't consider that they wouldn't have a problem recognising the pigeons, but for "first-see-ers" it might be puzzling...<br>
      Thank you for bringing that up, I will be interested to hear if someone else also had a problem with this? :/</p>
      <p>I also thought someone might find the "dot" of the "i" a bit strange :/ When I look at it now, I think it could have been.. more consistent with the rest of the type. It seems a bit "slim" compared to the rest, doesn't it? :/</p>
      <p>ps: The site is far from fantastic right now, you are not missing much ;)</p>
