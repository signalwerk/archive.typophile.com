    html: |-
      <p>I recognised the shapes as birds, and eventually as pigeons, however pigeons aren't a symbol of freedom (in the UK at least), doves are used as symbols of peace.<br>
      The logotype looks strong, though I would look at the counters of the B and the bottom right of the G, as well as the dot on the i (I wonder if you need that at all). As for the text to the right try using the logotype (possibly without the pigeons) instead of the approximation of it. The actual text has a problem with the narrow measure, especially the second paragraph which is very ragged, making it broader should help, if you can bring incorporated up to the line above. The third paragraph seems to have a fourth paragraph (I chose this…) without a line break.<br>
      Tim</p>
