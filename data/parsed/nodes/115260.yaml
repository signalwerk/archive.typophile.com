      <p>I worked with <em>Suitcase Fusion 5</em>. I created four separate libraries.</p>
      <p>As an example, find my <strong>Library #1</strong>:</p>
      <p>I first applied the Vox-AtypI system coupled with a shade of the Sanders/McCormick system, Erik Spiekermann's FontShop system and alternate contemporary systems.<br>
      I also subdivided the Vox-AtypI system with individual historical designers, art movements and geometric (weight, width and else) and stylistic properties.</p>
