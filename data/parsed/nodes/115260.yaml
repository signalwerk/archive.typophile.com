    html: |-
      <p>I use Suitcase also, since version 2. For many years I have organized my fonts alphabetically, in folders to be loaded Temporarily as needed. For basic fonts, which are the 35 which come with most Postscript printers along with fonts I use on an everyday basis such as Helveticas, Garamonds, Centuries, Futuras, Pi fonts, etc., I have in a set called, of all things, "Basics". If I have a large project which uses many fonts not a part of the Basics set on a recurring basis I will set up a special set for those fonts. If the project ever returns for revisions then I will have the fonts all set up and ready to go; just reactivate them.</p>
      <p>Suitcase makes life in the type-users world so much more efficient. I could not get by without it.</p>
