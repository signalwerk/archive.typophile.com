    <p>How do you organise your fonts?</p>
    <p>By class?</p>
    <p>By use?</p>
    <p>By client/job?</p>
    <p>I'd be interested to know how others do it.</p>
    <p>I'm at a point where I need to find a better organising system than just 'sans-serif'.</p>
