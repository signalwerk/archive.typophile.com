    html: <p>Personally I'd darken the column for the amount and drop the title all together. Without seeing it it's difficult to say, but given the subject of the table (an invoice) provided the emphasis is placed on the column it's unlikely the reader would misunderstand the figures were the cost. <br> <br>If you are worried about that then I'd suggest you seperate the cost into two columns (second one for the decimals) then right align the cost column, left align the decimals next to it, and right align the title against the right edge of the cost column.</p>
