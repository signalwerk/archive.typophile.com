  html: <p>I'm doing a form with a few columns.. an invoice. The columns include things like Date, a Services description, and Time spent. These look nice left-aligned, but then I get to the Amount column. If I left align everything, the decimals won't align. Some figures are just 20.00, others are 200.00, so if I align the decimals, I can't left-align it. Anyone have suggestions? Right now I'm just left aligning "Amount" on the longest figure, with the decimals aligning. But this makes Amount look centered, so I'm wondering what my alternatives are. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Thanks!</p>
  html_clean: <p>I'm doing a form with a few columns.. an invoice. The columns include things like Date, a Services description, and Time spent. These look nice left-aligned, but then I get to the Amount column. If I left align everything, the decimals won't align. Some figures are just 20.00, others are 200.00, so if I align the decimals, I can't left-align it. Anyone have suggestions? Right now I'm just left aligning "Amount" on the longest figure, with the decimals aligning. But this makes Amount look centered, so I'm wondering what my alternatives are. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Thanks!</p>
