    html: <p>You should be able to assign a keyboard shortcut to the Duplicate command, inside of the Customize dialog. Command/Control-D is set to Deselect by default, but that can be changed or deleted. You can also adjust the Duplicate offset (how far from the original the copy appears) in the Preferences under Glyph Window &gt; Dimensions.</p>
