  html: |-
    <p>Is there a way, I can get a second objet, portion of outline or line without having to use the two command cut &amp; paste in Fontlab as I can do in Illustrator by using the “alt” key, selecting an object and simply dragging it?</p>
    <p>Thanks!</p>
