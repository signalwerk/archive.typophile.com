  html: |-
    <p>Most of the inter-lowercase exceptions arise when there's some /i accent involved: í ĭ ǐ î ï ì ī ĩ ĵ<br>
    But should I kern between themselves? Since while it would take a lot of time, I don't think there's that much combos involving 2 accents apart from one I know: Ukrainian double ïï.<br>
    Is there any more?</p>
