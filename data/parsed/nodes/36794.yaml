    html: |-
      <p>Hi T Bones,<br>
      yeah, the Typophile search is kinda crappy.<br>
      Reading <a href="http://www.typophile.com/node/32357" rel="nofollow">this thread</a> will surely help.</p>
      <p>So, make yourself a bookmark with the following as the address:<br>
      javascript:void(q=prompt('Search%20Typophile:',''));if(q)void(location.href='http://www.google.com/search?q=site:typophile.com'+'%20'+escape(q))<br>
      [Kudos to <a href="http://www.typophile.com/user/1011" rel="nofollow">Grant Hutchinson</a>]</p>
      <p>And in case you don’t like Google, feel free to replace its url with that of a competitor …</p>
