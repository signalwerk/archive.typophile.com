  html: |-
    <p>To @font-face or not to @font-face...</p>
    <p>I am designing a CSS for a site I am building and was going to just designate the type to be serif (Georgia, Times etc). The I thought about using their typeface instead.</p>
    <p>The face is Casablanca Antique and it is a Corel font from 1992. I have no idea where I got it from but it appears to be distributed widely for free (I know I did not buy it).</p>
    <p>I have not done web in a long time and am not sure of the pros/cons of using @font-face.</p>
    <p>Can anyone please advise?</p>
    <p>Thanks,<br>
    Jay</p>
