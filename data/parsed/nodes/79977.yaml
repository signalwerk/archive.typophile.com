    <p>Not sure if this is the right section for this, but, here goes!</p>
    <p>This is my resume! I'm still a student in college (hence the tiny "experience" section) so I'd be using this resume to apply for graphic design internships and entry-level summer jobs.</p>
    <p>What do you think? Is the body type too light? Is everything aligned okay? Are there any obvious mistakes? How does it compare to other resumes that you've seen? Did I put too much stuff in there from HIgh School?</p>
    <p>Would YOU hire me?</p>
    <p>Thanks for your constructive criticism... go easy on me!</p>
