      <p>I am not a designer, just a technical writer. This design does not work for me.</p>
      <p>The everything centered style, particularly on the first page, is difficult to decipher. Pushing the dates to the right, to look centered, to me, looks awkward. The large indents in the text, to make everything look centered, looks awkward. I just don't get it. I would make everything left-aligned, and move the dates next to the places, because that's what they go with. (Keep the things that go together, together.) Then the columns could be a little thinner.</p>
      <p>The top graphic, a big green piece of wood or tree stump, what is that saying? I don't have any idea. There's nothing wrong with white space.</p>
      <p>Consider leaving the babysitter listing off. References on request is just assumed for many modern resumes. Self Employed is misspelled.</p>
      <p>Under school involvement, will listing your religious affiliation hurt of help you in the design community? Also, I don't know what a lot of this groups are: Key, Bet, Interact, American Classical League...</p>
      <p>Under Community Involvement, why are you saying constituent instead of member?</p>
      <p>There are two things noticeably missing here. One is your home website. If you don't have one, be sure you have a good explanation why.</p>
      <p>The other thing that's missing is any design experience. And you should be emphasizing this! From this resume, I cannot identify one thing that you have designed, professionally or in school. Make the top left section "Freelance design experience". Amplify and expand to explain your design experience, whatever it is. What did you design? Maybe listing school projects would be appropriate. Move the first two lines of your community involvement section into this new section. Delete the Other section if you need more room.</p>
      <p>If you cannot sell your design capabilities on page one, nobody is going to look at page two. Take a good look at everything on both pages. Is it selling your design capability? Move all that stuff that does into the new Freelance Design Experience section. </p>
      <p>Maybe a two or three line Summary at the top would be appropriate, summarizing your good people skills, your initiative, design qualifications, and business experience.</p>
