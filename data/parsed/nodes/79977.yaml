      <p>Cool. Not a designer here, but some teeny tiny things still catch my eye. Specifically, the space between the hyphen-bullets and the first letter of entries seems to vary some. For example, under the "James Madison University" heading on the first page, compare the spaces directly preceding the "Harrison, Virginia" and "Expected Graduation" items. Similar inconsistencies elsewhere also. Another note: all of the date ranges really ought to use en dashes rather than hyphens.</p>
      <p>Good luck!</p>
