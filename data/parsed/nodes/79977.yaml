      <p>Think the body type is indeed too light, and it might look better to make your middle initial the same color as the other two. Otherwise it kind of jumps out a little. You might even make it the same color as the rest of the "enae" or just scrap it entirely.</p>
      <p>Otherwise it's pretty stylish. </p>
      <p>Possible typo: flyying.<br>
      Consistency nitpicking: Other skills section has an unpredictable mix of Title Case and Sentence case.</p>
      <p>Also, this is more a matter of personal taste... but I find garamond kinda old-looking and played out :) Got a more modern face (as long as it's legible)?</p>
