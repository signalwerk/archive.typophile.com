      <p>I have a small print shop (12’x20’) with 2 Vandercooks, and I’m fairly conscious of the solvent vapours when I’m cleaning the presses. Generally speaking I take the rollers outside and set them on a work-bench I’ve rigged up to hold them during cleaning, and when I’m really on the ball I wear my respirator (I’m not on the ball all that often). When I have to clean the rollers &amp; press inside, I leave the door open and turn on a ceiling fan, and I’m more conscious of wearing the respirator then. I have to admit, though, that this is more to avoid the dizzyness &amp; headache I sometimes get without the respirator, rather than concern about long-term effects.</p>
      <p>The thing is, this is only when I’m 2 feet from the solvent and it’s splashing around and turning to vapour right in front of me. Other than this, what I get is the smell of ink and solvent, and, quite frankly, I love that smell.</p>
      <p>Besides, I smoke, so this stuff is the least of my problem.</p>
