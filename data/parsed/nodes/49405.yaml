      <p>Elzadra:  Please take with a grain of salt the ill-informed, sassy comments posted here.</p>
      <p>The thing is, only each individual can assess her or his health needs. If you are at all concerned about the health implications of your employment, then all your questions are valid. </p>
      <p>Conditions in many printing and design shops can indeed be hazardous. Not perhaps to me, not perhaps to bieler. But they may be to you, and no one should dissuade you with flippant comments from your concerns. Each of us has different tolerances for solvents and air quality. It may sound flippant in a different way, but keep in mind that one of our main responsibilities is to take care of our own health in this nasty world. Employers won’t, unions won’t, government won’t.</p>
      <p>I have worked in a wide variety of printing &amp; design shops for 40 years. Some people thrive in toxic conditions. Others succumb rapidly to what may seem to be only moderately malignant conditions. There is just no way to know what will get to whom when. I hope you can resolve this to your satisfaction.</p>
      <p>&amp; given the state of the economy these days, it is just irresponsible to say such things as “why work on-site?” or “walk, and let some other mug get sick.” That set of comments shows a poor understanding of the reality of work. Sure, some folks get to work off-site. But that is a dream more than a reality in the work world of 2008. &amp; Sure, some folks are willing to let others take the fall; that just ain’t a responsible attitude.</p>
      <p>Good luck; stay healthy. Keep your eyes open for a better job.</p>
      <p>powers</p>
