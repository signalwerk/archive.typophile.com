      <p>I doubt there is any risk. Probably less than sitting in front of a computer monitor all day or putting a cell phone to your head. Smells aren’t toxic, fumes are. If the print shop takes care to keep its solvents in safety cans, that’s pretty much it. And that is only to prevent fire. Most solvents used today are fairly non-hazardess. And most printers seem to live an awfully long time.</p>
      <p>That green stuff that jazzhustler put up is standard media greenwash. </p>
      <p>Gerald</p>
