    <p>I’ve been working casually in a printing company that dates back to 1880 (some of their equipment looks almost that old) and am considering working there more regularly. But one thing concerns me: air quality. The reek of ink and solvents is constantly present and the room where the Macs are, where I would be working, has no windows.</p>
    <p>Are there known stats on printers and lung afflictions? Am I just being paranoid (or is my ambivalence about this $15/hour job showing itself) or is there actually some risk?</p>
