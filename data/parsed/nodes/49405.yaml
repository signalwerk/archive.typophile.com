      <p>From a quick Google search:</p>
      <p>“<a href="http://www.cdc.gov/niosh/hc24.html">Press operators and other workers in printing establishments</a> are exposed to airborne solvent vapors generated when the press is cleaned. Press-cleaning solutions are generally a mixture of chemicals that include various solvents, some of which are carcinogens. Adverse health effects from inhalation or skin contact include dermatitis, headaches, nausea, vomiting, dizziness, respiratory failure, central nervous system depression, coughing, difficult breathing, chest pains, unconsciousness, and death. Chronic effects may include kidney and liver damage. Many press operators in small print shops have excessive exposures because these shops frequently have inadequate ventilation or other controls for the vapors.”</p>
      <p>“<a href="http://72.14.205.104/search?q=cache:BjCt_YHy1LEJ:www.orosha.org/pdf/pubs/3119.pdf+printing+industry+health+hazards&amp;hl=en&amp;ct=clnk&amp;cd=2&amp;gl=us">In printing and related industries,</a> a variety of chemicals — including alcohols, glues, inks, dyes, cleaners, ammonia, lead, formaldehyde, paper dusts, and many types of solvents — can be found. Employee exposures to chemicals have been shown to be higher when associated with press wash-up tasks, use of isopropanol, using poor or improper work practices, and inadequate or improper use of ventilation systems. Workers should close containers for blanket wash, alcohol, or used shop towels. Recirculating pressroom air may save on heating or cooling costs; but it also increases concentrations of chemical contaminants in the air that workers breathe.”</p>
