      <p>just found this on an Eco-Friendly printer’s site.  Maybe it will provide some insight into what they’re doing health and ecologically - wise that maybe other printers aren’t but should be implementing for their staff;</p>
      <p>“We use an inert water based protective coating sealant on our products which is an eco-friendly alternative to polymer based coatings, “litho seal” and plastic laminates.</p>
      <p>We run IPA - isopropyl alcohol - free on our printing presses, as opposed to the industry average of 8%.</p>
      <p>Our inks are vegetable oil based - specifically linseed oil - as opposed to mineral oil.</p>
      <p>The removal of IPA alcohol and use of vegetable ink has virtually eliminated our emissions of VOC’s - Volatile Organic Compounds - into the atmosphere. These VOC’s are a major source of ozone pollution and are a potential a health hazard to our staff.</p>
      <p>We promote full colour printing which uses significantly less chemicals, solvents and paper in job setup and press cleaning than traditional one or two colour printing.</p>
      <p>We offer quality Digital Print solutions when appropriate to the job.”</p>
      <p>JH</p>
