    html: <p>Some of your new alternatives looks very good to me. New "K" and "R" with the first version of "Q" are perfect. You should look for the alternative tail in "Q" to your shorter "K" and "R"  <br>I don't think that your new alternatives "M" and "Y" is a good idea. <br>Please check out the "AMNVW" in New Aster Medium <br><a href="http://www.myfonts.com/fonts/adobe/new-aster/medium/" target="_blank">http://www.myfonts.com/fonts/adobe/new-aster/medium/</a> <br>Check out the "Y" in Book Antiqua too. <br>The "H" is better <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>The "A" still needs work. May be there is a problem with the horizontal position of the bar in A, may be you shoud change a little bit the shape of the bar in the "A" and "H"...</p>
