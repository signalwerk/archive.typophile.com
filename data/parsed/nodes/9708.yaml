    html: <p>Your new, regularized version is beautiful. I don't know that you had to go so far in totally eliminating the spikes on your vertical serifs and the square to thin joins of AVW.  <br> <br>Another interesting effort on a 'Forum' style of caps is the <a href="http://www.secretonix.pt/ftf/catalogue/FTFgarda00.htm" target="_blank"> Garda</a> series by Mario Feliciano. Here he has serveral variations. I guess you could consider something similar.</p>
