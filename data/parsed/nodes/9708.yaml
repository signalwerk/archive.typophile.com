  - id: 61893
    user: 1551
    date: 2005-03-12T06:06:00
    date_raw: 12 Mar 2005 — 6:06am
    votes: null
    html: <p>I'm a big fan of your designs, but I don't like this one.  <br> <br>To me the bent vertical serifs are overdone and draw too much attention to themselves. They're like knives that threaten to cut you if you get near them. The bending serifs on the tops of the M, N also seem droopy. And the construction of the AVW distracting. The A also looks too squat. Aside from this, your letters have elegance, but all the showy bits are too distracting for me, without being attractive. I know my reaction is very subjective.</p>
    html_clean: <p>I'm a big fan of your designs, but I don't like this one.  <br> <br>To me the bent vertical serifs are overdone and draw too much attention to themselves. They're like knives that threaten to cut you if you get near them. The bending serifs on the tops of the M, N also seem droopy. And the construction of the AVW distracting. The A also looks too squat. Aside from this, your letters have elegance, but all the showy bits are too distracting for me, without being attractive. I know my reaction is very subjective.</p>
