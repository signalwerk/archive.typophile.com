    <p>Hello fellow typophiles. This is Karv, based on the KLIM logotype. (Later there will be his sister, Kurv, who is a softer and rounder.) <br> <br>Have a look at the pdf to see the current character set. I intend it to be used for titling and display, and will probably make some juicy ligs. Enjoy! <br> <br>kris. <br><img src="http://www.typophile.com/forums/messages/29/67135.gif" alt=""> <br> <br></p>
