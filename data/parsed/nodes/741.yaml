    html: "<p><b>And lo ho ho, it was mightily proclaimed from on high, once mo...</b> <br> <br>&gt;It's a shame Joe couldn't seem  <br>&gt;to handle to heat (...) <br> <br> <br>I haven't posted further because I had nothing more to add. <br> <br>As I had said earlier, I'd thought that Mr. Giampa had made his point expertly, and perfectly. <br> <br>When a couple of other forum members requested on the thread that the oddly escalating battle of words stop or get back on topic, I exited abruptly. As requested. <br> <br>Don't you be dissin' my lurkin'.   :-) <br> <br> <br><b>And, whilst the trumpets played sweetly, perhaps by the angels themselves...</b> <br> <br>&gt;I think most people who don't participate  <br>&gt;in public discussion groups have much more <br>&gt;rational reasons than avoiding personality <br>&gt;conflicts. Usually, they simply don't see  <br>&gt;much to gain for themselves. <br> <br> <br>Oops! There's that creeping 'personal gain', 'profiteering' magma again.  <br> <br>Again: We're here and able to discuss typography today because typefounding is, historically and presently, a business. Not a hobby. Not a non-profit. It's a for-profit industry made up of for-profit businesses. <br> <br>There's nothing to apologize for in that. <br> <br><b>PSA</b> <br>(By the way, a number of foundries out there right now would appreciate your business. When you finish here, log off and go show your commitment to typography by buying 10% more of whatever you would normally purchase in type ...er, fonts... today!) <br><b>/PSA</b> <br> <br>I tell you: the reason for my not posting more, is that I have a business to run.  <br> <br>A real, honest-to-goodness business. In the real world. Pretty demanding.  <br> <br>Just as many today are surprised to see a typewriter for the first time, you may be surprised to find that running a typefoundry requires more than typing onto keyboards or speaking into MacSpeech or ViaVoice, and clicking the 'Post this Message' button. <br> <br>While these forums are great get-togethers, I'd be very surprised if they were most (read: any) type designer's primary pursuits, or primary business responsibility. <br> <br><b>Nor should they be.</b>  <br> <br>For me and I'd bet for other business-oriented type designers, showing up here (and at other forums) is tantamount to using some of one's 'leisure time'. 'Some' time that often ends up requiring a lot more time. Teaching - and learning. Even for the teacher! <br> <br>So, yes, when I can, I'll try to post. And hopefully, something that's on topic and generally beneficial. <br> <br>I started spending time here and later contributing because it seemed to me that this was a premier, professional forum.  <br> <br>I believe that it is.  <br> <br>Although the degree to which font piracy is conceptually upheld - directly or with strong innuendo - and by those whose posts betray them as folks who really should know better - is one quite offputting aspect, though. <br> <br>(For the record: I will no longer be responding to this thread, nor others, unless it grooves me.) <br> <br>:-) <br> <br>Joe <br> <br> <br></p>"
