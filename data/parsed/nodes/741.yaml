    html: "<p>In it flew, over the transom.  <br> <br>Look, a note!  <br> <br>Sigh, it's not from Will Ransom.... <br> <br> <br>&gt;...and I'll continue pointing out  <br>&gt;that you're wasting it. <br> <br>Thanks. I guess that's why people are currently buying our fonts twenty and more at a time. At the retail prices, to boot. <br> <br>Here's your own pill back: <br> <br>\"Don't try to decide things for other people.\" <br> <br> <br> <br>&gt;BTW, Typophile doesn't  <br>&gt;\"conceptually uphold\" piracy. <br> <br>I did not say that Typophile itself (the mechanism) did. Did I? <br> <br>No, I did not. The phrasing purposely pointed to individual posters, who will undoubtedly recognize themselves. <br> <br> <br> <br>&gt;But it is an open-minded, tolerant place,  <br>&gt;where rabid, blind, self-righteous  <br>&gt;protectionists tend to be as shunned as  <br>&gt;wormy dyed-in-the-wool pirates. <br> <br>And shunned they should be. <br> <br> <br> <br> <br>&gt;If you want to be culturally relevant, ... <br> <br>Here's your own pill back, yet again: <br> <br>\"Don't try to decide things for other people.\" <br> <br>Oh, yes, and see above: I guess that's why people are currently buying our fonts twenty and more at a time. <br> <br> <br> <br>I decided to take a look at this list's content, as I said, because I thought it was a professional list. (I still think so.) <br> <br>It would be a mistake to think that I started contributing to this list for the purpose of seeking out respect. As I said earlier on, I don't try to build an ersatz career out of showing up on listservs. <br> <br>And as I'd even earlier said, when I see disinformation being doled out, especially where students and those new to the profession might well be tainted by it, I'll seek to set the record straight.  <br> <br>Nothing more than that, really. (Well, I might have a question of my own, from time to time. Hopefully, if I need help, the group might reply accordingly.) <br> <br> <br>&gt;This is not a bazaar.  <br> <br> <br>I should think that those aware enough of type's nicety and variety to be on this list would welcome the opinion and guidance of actual experts working commercially in the field, and for decades, as being - well - expert. That it doesn't seem to, evenly, is striking. <br> <br>It's generally been an attitude of not allowing the record to be set straight, plus considerable overt baiting, that has continued argument in counterproductive fashion. Ending up wasting a lot of space. <br> <br>I realize that you don't see that. <br> <br> <br>Looking back at some archives here, and on other type related lists, I have come to realize, this week, that the agenda of baiting has been going on for many years now.  <br> <br>That the baiting recently turned personally prejudicial adds to the lopsided unfortunateness of it all. <br> <br> <br> <br>&gt;You don't want respect from people like me?  <br>&gt;Then we're set. <br> <br> <br>If you do prove yourself to be a type professional eventually, as you claim to want to be, you will have my innate respect for that. You already have my respect for trying hard. <br> <br>From where you seem to be currently in your apparently very limited type appreciation spectrum, I have no idea how to suggest you get there. <br> <br>Pack your box with more than just six liquor jugs, though. It's a long journey. <br> <br>Joe <br> <br></p>"
