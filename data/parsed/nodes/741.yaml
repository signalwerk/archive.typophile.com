    html: "<p>Yves Peters  <br> <br>My issue is not with the your usage of \"man\". It is the usage of  the word \"male\" as referred to in Hrants posting not to far above where we are now. And, to be sure, it is \"sex\" specific. <br> <br>Quote, Hrant. Quote within the quote is mine. <br> <br>\"Demographic: middle-aged white American 'male'. It must've been something in the air while they were growing up, but they generally: salivate over obese disco fonts; refuse to admit the relevance -sometimes even the existence- of trapping; can't stand me\" <br> <br>End of Hrants quote. <br> <br>I have no use for comments from people hiding under white sheets and burning crosses. I need not remind you of the plight of American \"Blacks\", for that matter American \"Women\". Granny bashing is a no no as well. <br> <br>For instance would the Typophiles condone this? <br> <br>\"Demographic: middle-aged black American woman. It must've been something in the air while they were growing up, but they generally: salivate over obese disco fonts; refuse to admit the relevance -sometimes even the existence- of trapping; can't stand me\" Gee, I wonder why? Comment: My own. <br> <br>Get the point. <br> <br>I realize that Hrant does not believe in democracy so why should he allocate sympathy to fact. <br> <br>Mr Lange appears to have the same problem. All I can say to him is read my previous posting and weep. <br> <br>Your input is thoughtful. I think that there should be room for differences in opinion, contrary to one of Hrants stated opinions otherwise. <br> <br>By the way I am a fan of your regular postings. They stand out in the crowd. <br> <br>Don't lose what you've got, it's something special. <br> <br> <br>Gerald Giampa <br>Lanston Type Co. Ltd. <br> <br></p>"
