    html: <p>At the risk of getting my (virtual) head smashed for this comment... the most absurd about all this is that the whole flame war began with a discussion about hot metal tye. I mean, how few folks in the Western World share a love for metal type? How few folks still work with it -- couldn't be much more than a few dozen, maybe hundreds, right? I know I only get to work once with it (not me personally, but with a printer realising a design with movable type) and I loved it, just as I ove steel engraving and all that old-school stuff. But still, from the few folks left who in this digital age dig the idea of handlettering with lead letters and all that, you still manage NOT to celebrate the joy of your common fondness for type, but instead you argue and quarrel. Reminds me a lot of the comic-book-forums where in a dying medium fnas and creators alike are rather often thannot at each others throats. This has absolutely NOTHING to do with personality (e.g. John Byrne and Peter David both are nice guys individually, but get them together online and they can't keep from ... cyber-vomiting on each other). Same story here. Sometimes its fun to watch, mostly it gets depressing after a while as it is the internet-age counterpart of pissing in the snow.  <br> <br>If this is actually keeping people like Joe or Erik or whoever fromposting here, we're all loosing out big time. There's a lot of folks hanging round here whose work I positively admire (and some whose work Ilearned to admire by getting to know them here :-), and I frankly fell off my chair when I saw that Erik Spiekermann had written a post or that Yves Porch</p>
