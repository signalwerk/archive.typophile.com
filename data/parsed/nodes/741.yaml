    html: "<p>*commerce impedes cultural progress.* <br> <br>The dictionary in our office provides this definition of \"commerce\":  <br>1. The buying and selling of goods, esp. on a large scale, as between cities or nations. 2. Intellectual exchange or social interaction. <br> <br>Although the first definition might not serve to encourage cultural progress directly, I have trouble understanding how the second aspect of \"commerce\" could do anything but encourage cultural progress. Isn't it difficult to engage in the \"buying and selling of goods\" without involving some social intercourse? This \"social\" part of commerce, admittedly along with many other things, is what I believe contributes to cultural development. It's not the money changing hands, it's the dialogue that preceeds the exchange of money.</p>"
    html_clean: "<p>*commerce impedes cultural progress.* <br> <br>The dictionary in our office provides this definition of \"commerce\":  <br>1. The buying and selling of goods, esp. on a large scale, as between cities or nations. 2. Intellectual exchange or social interaction. <br> <br>Although the first definition might not serve to encourage cultural progress directly, I have trouble understanding how the second aspect of \"commerce\" could do anything but encourage cultural progress. Isn't it difficult to engage in the \"buying and selling of goods\" without involving some social intercourse? This \"social\" part of commerce, admittedly along with many other things, is what I believe contributes to cultural development. It's not the money changing hands, it's the dialogue that preceeds the exchange of money.</p>"
