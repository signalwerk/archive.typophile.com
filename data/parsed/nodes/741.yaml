    html: "<p>&gt; Nor should they be. <br> <br>Don't try to decide things for other people. You continue living your life the way you want it, and I'll continue pointing out that you're wasting it. <br> <br>BTW, Typophile doesn't \"conceptually uphold\" piracy. But it <b>is</b> an open-minded, tolerant place, where rabid, blind, self-righteous protectionists tend to be as shunned as wormy dyed-in-the-wool pirates. <br> <br>I'm not a listmom, I'm just a member, but one with many opinions which I'm not afraid to air in public, including this: I think your participation here is great, except when you're too much of a salesman. This is not a bazaar. We're mostly here because we love type, and I for one believe that commerce impedes cultural progress. If you want to be culturally relevant, you better start making fonts that don't [necessarily] sell very well, but will open up new (as opposed to 30 years dead) avenues in the craft. If you don't, then don't expect too much respect from people like me. You don't want respect from people like me? Then we're set. <br> <br>hhp <br></p>"
