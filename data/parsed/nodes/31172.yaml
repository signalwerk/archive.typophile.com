    <p>Hi all;</p>
    <p>I'm a product designer going for another degree in graphic/communication design. Forgive me if I'm slightly behind the curve -- I'm trying to learn a lot at once and am taking it all very seriously. Although I've been working with type/graphics for years I am now trying to be more rigorous about my choices. </p>
    <p>I'm working on a logo and graphic standards for a small NYC branding firm who does projects from very hip to very square (art to corporate). I keep coming back to Sackers Roman as a foundation for their logo/ID work. I think it's a beautiful typeface and the company does have a sort of eclectic/vintage-meets-modern/cool vibe about them. </p>
    <p>My question is whether there are other typefaces which are not quite so 'old fashioned' as Sackers -- perhaps a newer typeface that would be more appropriate for titling and larger text/words/logo. Or are people of the opinion (and I know there are many) that there's a basic elegance to the old faces that trancends the vintage signifiers. Bottom line is that I just don't want to be too 'costumey' if you know what I mean.</p>
    <p>Second question, is if I do use Sackers Heavy Roman, what is a good companion face for body text? I am imagining something like Trade, although again, I wonder if the Sackers/Trade thing is going to make everything feel to 'vintage'?<br>
    Any thoughts would be appreciated. And please be gentle, I've been beaten to a pulp over on DPReview forums for posting as a novice.</p>
    <p>Many thanks.<br>
    Rem.</p>
