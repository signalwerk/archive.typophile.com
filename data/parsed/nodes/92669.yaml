    html: <p>Ask about the scope of distribution. Recently, I was contacted by an individual about rights for securely embedding one of my fonts in an e-book. Illustrating the truth of ass·u·me, I assumed that this was a personal project which would have limited distribution. Only after I quoted my terms did I learn that said “individual” was working with NBC Universal. Oops...</p>
