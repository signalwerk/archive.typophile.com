    <p>Please direct me to the appropriate thread if this topic already exists.</p>
    <p>I was contacted by a company that wants to license my typeface for distribution in their software package. The typeface is currently available for free and has a very limited character support (caps only and no diacritics, but that doesn't seem to concern them).</p>
    <p>How do I price something like this? What follow-up questions might I ask?</p>
