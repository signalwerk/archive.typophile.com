  - id: 551183
    user: 9636
    date: 2013-04-16T20:57:00
    date_raw: 16 Apr 2013 — 8:57pm
    votes: null
    html: <p>Frode's right, this is a hinting issue. I assume that in your TrueType generating preferences you have "autohint unhinted glyphs" checked. Try unchecking that and re0-generating the fonts. If this is a distressed font, it probably won't benefit from autohinting.</p>
    html_clean: <p>Frode's right, this is a hinting issue. I assume that in your TrueType generating preferences you have "autohint unhinted glyphs" checked. Try unchecking that and re0-generating the fonts. If this is a distressed font, it probably won't benefit from autohinting.</p>
