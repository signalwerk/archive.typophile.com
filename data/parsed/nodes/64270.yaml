    </p><div class="imageWrap"><img src="http://typophile.com/files/typophile-mark_4820.png"></div><p></p>
    <p>And the type is:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typophile-type_3526.png"></div><p></p>
    <p>Please ignore the mismatching colors for the moment.</p>
    <p>One thought that has crossed my mind was if these two were simply not complimentary, and that's why they were so tricky to combine. </p>
