      <p>Stephan, thanks for the opinion. The symbol is actually meant to refer to time, wax seal and a check mark (indicating things being authentic) at the same time. I tried but I cannot simplify it any further. I personally do not see it as playful. If there is one thing I am concerned about is for it not to look like a clipart.</p>
      <p>Customized Ts - yep, they are customized to use single sided T crossbars in all versions except for the last one.</p>
      <p>Eric, I agree that the horizontal layout works better. With regards to the shape of the clock and hands - amorphous is the wax seal (stamp) reference, and the hands <em>are</em> tapered, though obviously not enough to be noteceable. I tapered them further in newer versions, thanks.</p>
