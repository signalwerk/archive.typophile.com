      <p>Regarding to your <a href="http://typophile.com/node/63410" rel="nofollow">previous thread</a> I am wondering whether a more 'digital' logo would improve the identity or not.</p>
      <p>I 'googled' the word 'timestamping' because I could not make any sense of it and found out that a typical timestamp looks like this:</p>
      <p><cite>2005-10-30 T 10:45 UTC<br>
      2007-11-09 T 11:20 UTC<br>
      Sat Jul 23 02:16:57 2005<br>
      1256953732</cite></p>
      <p>It is this criptical way of documenting the logging events that makes me think about seperating the 'cert' and 'time' by insertig a colon. Maybe not only inserting a colon but form one by customizing the t's.</p>
      <p>Basically I am doubting the use of the good old classic clock. Allthough the symbol communicates 'time' and 'stamp' it seems a little too playful for me and as far as I understood timestamping -- I could be totally wrong -- it's all about documenting logging events in a very effective way (displaying time like 'hh:mm' instead of displaying it by using a classic clock.</p>
      <p>Nevertheless this is just my opinion and as mentioned above, I don't really now what timestamping is all about.</p>
