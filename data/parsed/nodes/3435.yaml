  html: <p>this typeface is inspired by native american pottery painting. i'm going for a hand-painted, geometric feel. i believe it looks kind of hieroglyphicish, if you will. any suggestions and comments would be greatly appreciated! <img src="http://www.typophile.com/forums/messages/29/27818.jpg" alt="pottery design typeface"></p>
