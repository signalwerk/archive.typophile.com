    html: |-
      <p>&gt;The trouble is that every foundry has its own definition of “Pro”. </p>
      <p>History from September 2000... <a href="http://www.microsoft.com/typography/links/news.aspx?NID=1474">http://www.microsoft.com/typography/links/news.aspx?NID=1474</a></p>
      <p><cite><br>
      But what exactly makes an OpenType font a Pro font? </cite></p>
      <p>An Adobe OpenType font only gets the Pro designation if it has a minimum base character set and a reasonable number of OpenType features. The minimal Pro character set includes ISO-Adobe and Adobe CE character sets, plus the euro, litre, foursuperior and estimated symbols. </p>
      <p>Can I call the OpenType fonts I make Pro fonts? </p>
      <p>According to the OpenType list postings Adobe is not claiming any trademark on the Pro designation with reference to OpenType fonts. Although anyone is free to use the word, it would reduce end-user confusion if the type community remains consistent in their use of the term.<br></p>
