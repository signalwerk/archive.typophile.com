    <p>I'm looking at buying Meta, and would prefer to get it in Opentype format so I can use it on my mac or PCs...</p>
    <p>I'm not really sure what the difference is between the normal "FF Meta OT 1" collection fontfont sell for $235 bucks or the "FF Meta Pro 1" they sell for $305 bucks?</p>
    <p>I've noticed with other typefaces like Garamond and Garamond Pro, but have never really understood the differences. I know I should probably know this, but it's something I have never looked at until now... </p>
    <p>Thanks for any pointers.</p>
