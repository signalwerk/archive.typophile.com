      <p>The trouble is that every foundry has its own definition of "Pro". For FontFont it means additional language support -- CE, as Vincent said, but sometimes Greek and Cyrillic as well. You can check the PDFs on any OT font page at <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=FF%20Meta">FontShop</a> to see what's included.</p>
      <p>The <a href="http://www.fontshop.com/virtual/newsletters/nov2006_b/FF-OpenType-Library-2.5.pdf">FF OT Collection brochure</a> includes a handy matrix of language encodings.</p>
