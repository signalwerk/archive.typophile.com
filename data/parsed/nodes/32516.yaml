    html: |-
      <p>Both will be OpenType, but the 'Pro' version usually contains Central European characters on top of the standard set. So if you need Central European characters I would go for the Pro version.</p>
      <p>'FF Meta OT 1' could've easily be called 'FF Meta Std 1'. Hope this helps.</p>
