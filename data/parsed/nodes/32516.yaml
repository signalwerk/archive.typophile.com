      <p>&gt; ‘FF Meta OT 1’ could’ve easily be called ‘FF Meta Std 1’</p>
      <p>Except that every foundry has their own Std definition too. OT FontFonts include features and characters not found in the legacy formats, so they aren't a simple conversion to OT. </p>
      <p>And "Std" is such a horrible name anyway.</p>
