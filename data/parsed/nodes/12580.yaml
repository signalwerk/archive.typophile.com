  - id: 72706
    user: 7029
    date: 2005-05-20T06:55:00
    date_raw: 20.May.2005 6.55am
    votes: null
    html: |-
      <p>a good 2 1/4” film scanner will set you back atleast £2000-4000. The only one you can get that’s cheap and usable is one like the Canoscan D2400UF that is a flatbed scanner that supports film up to 4x5” </p>
      <p>I’ve been using an Epson something or other with a film attachment that works ok but has a tendancy of cropping 35mm and 6x7cm negatives and doesn’t seem to recognize some slides at the end of a strip or dense negatives. It likes underexposed ones better. </p>
      <p>I’ve compared 35mm prints to prints from a 4.1mega pixel <a href="https://web.archive.org/web/20081013182628/http://www.dpreview.com/reviews/nikond2h/" target="_blank">Nikon D2-H</a> and the prints from the digital are BETTER than the 35mm ones. </p>
      <p>I’ve scanned some 6x7cm negatives and that works well. </p>
      <p>I’ve also shot some 6x7cm negatives from a <a href="https://web.archive.org/web/20081013182628/http://www.mamiya.com/cameras.asp?id=1&amp;id2=1&amp;id3=8" target="_blank">Mamiya RZ67 pro II</a> and scanned them to various resolutions with success.</p>
      <p>Right now most professional photographers are shooting 50-100% digitally. Some are still shooting film since thier magazine requires it. But, even fashion photographers are using Leaf or other digital backs on medium format cameras. These are in the £17,000 (17megapx)-20,000 (22megapx) range.</p>
      <p>The new Canon and Nikon pro cameras are in the 12.5 - 15 mega pixel range. But 4-5 mega pixel is good enough for most magazines. </p>
      <p>I’ve recently submitted a portrait photo for <a href="https://web.archive.org/web/20081013182628/http://www.sueridermanagement.co.uk/presenters/Hannah/hannah.htm" target="_blank">Hannah Sandling</a>  to a magazine and they requested the image be under 2 mega bytes!!!  </p>
      <p>I shoot in RAW format (NEF) and so don’t most fashion pros. They usually have a photographer and a techy editor that cleans the images. </p>
      <p>RAW formats let you adjust the exposure, white balance and lots more than you can do with compressed jpgs.</p>
