    <p>We all take pictures, not just of type events but of things that inspire us and moments we want to preserve. Thanks to companies like Nikon we won’t be able to use the digital images we take now, a few years or decades from now.</p>
    <p>Here’s a link to an organization that tries to fight this moronic behavior of obfuscating image formats. <a href="https://web.archive.org/web/20081013182628/http://www.openraw.org/" title="Open Raw">OpenRaw.org</a></p>
    <p>What can you do to help? I would say stop buying cameras from companies that lock-up their formats.</p>
