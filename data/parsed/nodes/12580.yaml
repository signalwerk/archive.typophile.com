      <p>Also many of the ink jet paper companies like Kodak are saying some of thier papers will last 100 years. </p>
      <p>No one has ever said a colour print will ever last. Only B&amp;W prints were archivally processed (converting the silver to something more stable). Colour will always fade. </p>
      <p>So the current technology with <a href="https://web.archive.org/web/20081013182628/http://www.naturalworldphotos.com/giclee.htm">giclée prints</a> and pigment based prints without the use of photo chemicals that could contaminate the paper these prints will be more stable than silver, dye or chemical based prints. </p>
      <p>I also am finding that 400 ASA or higher black and white negatives (Ilford or Kodak films) scan a bit grainier than they would print directly from a negative to print. <a href="https://web.archive.org/web/20081013182628/http://www.virtualtraveller.org/epson2450.htm"> (see this review of an Epson scanner)</a> This can be corrected in Photoshop.</p>
