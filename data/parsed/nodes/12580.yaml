      <p>I believe there is presently a massive drop in the sale of digital cameras.<br>
      Cellphones/mobiles are taking over.</p>
      <p>I’ve been using a Ricoh for 3 or 4 years, it’s cool, but I am considering getting a classic Rollei twin lens reflex as my next camera. My grandad used to have one, and I was recently at the Lee Miller exhibit at the National Portrait Gallery, and it’s what she used. All I need now is a good 2 1/4’ film scanner.</p>
      <p>The way I figure it, a 35 mm frame is the equivalent of 15 megapixels, and a Nikon film scanner will get all that, plus the film grain. So it’s still OK to use film.</p>
