  html: |-
    <p>Besides the previously-mentioned Seattle workshop, there are coming workshops in three more cities! Cities, dates, instructors and hosting schools are listed below.</p>
    <p>Seattle Sep 19–21  (Thomas Phinney, Eben Sorkin, special guest John Hudson, at Seattle Central Community College)<br>
    Dublin Oct 4–6  (Thomas Phinney, Dave Crossland, possibly Aoife Mooney, at Dublin Institute of Technology)<br>
    Chicago Nov 16–17 (Eben Sorkin, Octavio Pardo, possibly more, at Harrington College)<br>
    Boston Nov 22–24 (Eben Sorkin, Octavio Pardo, possibly more, at Boston University)</p>
    <p>These are three-day intro type design workshops for complete beginners, taught by the Crafting Type anarcho-syndicalist collective. Each workshop is taught by a team of two or three (occasionally four) instructors to provide a variety of viewpoints and feedback.</p>
    <p>The workshops are sponsored by FontLab, FontForge and the TeX Users Group.</p>
    <p>Previous workshops have included Edmonton, Kiev, Lviv, Boston, Chicago, Portland, New York City, and Singapore.</p>
    <p>More details at: <a href="http://craftingtype.com" title="http://craftingtype.com">http://craftingtype.com</a></p>
