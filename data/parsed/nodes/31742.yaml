      <p>I agree with Lex, if you're looking for connection Helvetica is not the most "connected" type.<br>
      I'm with Chris on the redundacy topic, if the "connection" has a priviledge in the verbal expression, maybe you can focus the graphic into another, complementing concept, and not just make it redundant.</p>
      <p>I would suggest either making the verbal more "plan" like, and show the connection graphically, or viceversa. OR work on a clearer verbal expression and compliment graphically with a different concept (not plan or connect, which is what you do, but a concept based on the particular way you do those things).</p>
      <p>As is, maybe the one I like most is C, beacause as I see it, the treatment is in much more accordance to the typeface than the others.<br>
      Be aware that the way you are proposing this "connection", sacrifies some legibility, just have that in mind.</p>
      <p>Also, maybe the particular weight of Helvetica you chosed doesn't favor some movent you are trying to generate. Think for instance in the "tail" of the lowercase "a", it is caracteristic of Helvetica and its better observed in regular to light weights; here it is almost invisible.</p>
      <p>I'm not against the verbal solutions you came out with, but I do think it could be clearer.</p>
      <p>Regards,</p>
