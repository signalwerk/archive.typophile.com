      <p>my opinion: use of helvetica is fine. i'm not hater of the font; if it works, it works.</p>
      <p>but i'm not crazy about the joining devices. they seem forced and redundant. the word is already joined. a joiner spanning all the letters might work, if you can make it seem natural and not some sort of helvetica/sanskrit hybrid.</p>
      <p>but, my unknown friend, the real bad news is that i don't like the word itself. it's awkward and hard to say, creating an impression of mild confusion - exactly the opposite of your intent.</p>
      <p>i think because the "pl" leads you to one mouth form and then the "ect" suddenly forces another. somehow the n or nn doesn't really bridge comfortably. it also reminds me of too many other arbitrary words: planet, yech, heck, etc. the "ect" sound is unpleasant when isolated from its familiar source. again, it feels forced.</p>
      <p>i suspect i would respond better without the graphic nn bridge being so emphasized.<br>
      understatement can be more powerful.</p>
      <p>sorry, just my reaction. what about a more elegant design of the two complete words combined ? i know the HEAVYlite combo is used a lot, but something along those lines might work here. best of luck with your venture, however it may be logo'd !!!</p>
