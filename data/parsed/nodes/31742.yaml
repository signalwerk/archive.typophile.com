      <p>Chris,</p>
      <p>Thank you for putting so much thought into your critique. I have no problem at all with your distaste for the design and the word. It helps me a great deal.</p>
      <p>I agree that phonetically, the word's beginning and ending sounds conflict. But that brings up an argument I've been having internally: does the word, regardless of phonetic grace, conjure the message that the brand allows people to connect with one another through their plans?</p>
      <p>In other words, if a web user were to come across the word Plannect in an article, would it give that reader a plain idea of what the brand's service was?</p>
      <p>Normally, I am a huge persuer of aesthetics, and that includes the way words combine in speech. But in this case, I tried to put communication above that.</p>
      <p>As for the connectors, I was using Helvetica's own 'u' in condensed form, for just the reason you describe the logo violating: a natural, family of curvatures.</p>
      <p>That said, I certainly don't want to turn people off with the name!</p>
