  html: <p>Is it possible to manipulate your preferences or shortcuts in InDesign so that shift + arrow nudges 12 PS points instead of 10?</p>
  html_clean: <p>Is it possible to manipulate your preferences or shortcuts in InDesign so that shift + arrow nudges 12 PS points instead of 10?</p>
comments:
  - id: 257915
    user: 16911
    date: 2008-02-11T06:26:00
    date_raw: 11 Feb 2008 — 6:26am
    votes: null
    html: |-
      <p>Hi Eric,</p>
      <p>afaik (and in ID4), you cannot change the factor 10 that is triggered by ‘shift’. But you could adjust the value for the arrow itself (Preferences &gt;Units &amp; Increments); 1.2pt × 10 = 12pt.<br>
      F</p>
