    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : TypeTogether</strong></p>
    <p>Founded by <a href="/wiki/Veronika%20Burian" class="freelinking" rel="nofollow">Veronika Burian</a> and <a href="/wiki/Jose%20Scaglione" class="freelinking" rel="nofollow">José Scaglione</a> in 2006. The founders are based in Argentina and Prague (Czech Republic), respectively. From their description:</p>
    <blockquote><p>"The company developed out of the desire to create an independent platform for publishing high quality typefaces and to collaborate on new type projects together. Hence the name. TypeTogether's focus is on finding innovative and stylish solutions to old problems for mainly the professional market of text typefaces. However, there are also a couple of more experimental display faces in the make. TypeTogether also aims for excellent technical performance, broad language support and at least the standard Opentype features."</p></blockquote>
    <p><strong>External Links</strong><br>
    <a href="http://www.type-together.com/" rel="nofollow">Official Site</a></p>
