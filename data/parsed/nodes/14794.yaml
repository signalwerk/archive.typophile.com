    html: |-
      <p>There is a marked difference in the way that glyphs are described in TrueType and Type 1. </p>
      <p>If you are going to be generating TTFs or TTF-flavoured OpenType fonts, you should convert your glyphs to TrueType curves, and also reverse the directions — Transformation / Reverse All / Set clockwise direction. </p>
      <p>If you are going to be generating PST1s or CFF-flavoured OpenType fonts, you should convert your glyphs to Type 1 curves, and also reverse the directions — Transformation / Reverse All / Set counterclockwise direction. </p>
      <p>TransType should do this work for you, but I would get the files tight and clean in FL before using TrT, if that is your preferred generation tool.</p>
