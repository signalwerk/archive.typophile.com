    html: |-
      <p>I’m not very good at identifying type. However, one should mention that the layout of the «Suhrkamp» series, done by legendary designer Willy Fleckhaus, is one of the most famous German book designs ever. Unfortunately, since a couple of years, they have changed and distorted the original look.</p>
      <p>If you can read German, there are plenty of articles on Fleckhaus, «Germany’s first Art Director», and «Suhrkamp»—even a whole book on the designer: </p>
      <p>Michael Koetzle, Carsten M. Wolff (Hrsg.)<br>
      Fleckhaus. Deutschlands erster Art Director<br>
      Verlag Klinkhardt &amp; Biermann, 2000 </p>
      <p>And I am sure that someone will soon identify the font.</p>
