      <p>Aiaia </p>
      <p>Sometimes spelled as Aeaea. The name of Circe's island in Homer's <em>Odyssey</em>.</p>
      <p>A lot of words in the 1969 Marshallese orthography looked really weird -- actually, they first looked like encoding errors to this non-reader -- because the ampersand was used as a vowel:</p>
      <p>Yi'yaqey y&amp;q! Yij yetal gan Hay&amp;l&amp;gļapļap. (Hello! I'm going to Ailinglaplap.)</p>
      <p>Actually, 'Ailinglaplap' is a pretty fun word even without the ampersands.</p>
      <p>In a more recent orthographic reform the ampersand was replaced by ę, presumably under the slogan 'Ogoneks. Not just for Poles.'</p>
