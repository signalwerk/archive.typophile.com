      <p><cite>hasn’t the new(est) spelling reform done away with all those (except Schneeeule and Teeei)?</cite></p>
      <p>No, quite on the contrary, IIRC: while the old orthography only allowed triple consonants when they are followed by another consonant (‘Sauerstoffflasche’), now all the <em>Duden</em> has to say about this is to advise to separate compound words with a hyphen, in order to improve legibility (‘Sauerstoff-Flasche’). Triple vocals (‘Teeei’) always have been compulsive.</p>
      <p>Additionally, a lot of new triples were introduced by replacing ‘ß’ with ‘ss’ in some words (Paßstraße &gt; Passstraße, also all the other triple-s words that Tim has mentioned. It’s a ‘Missstand’!)</p>
    html_clean: |-
