      <p><cite>«But seriously, I don’t recall seeing capital letters in the middle of words when I was growing up in Wales, but I may have simply missed this aspect of the orthography. Can you give me some examples, Patricia?»</cite></p>
      <p>I think she might possibly be mixing up one Celtic language with another (well, two others): in both Irish and Scottish, when initial consonants are eclipsed, only the original consonant is capitalised, not the eclipsing consonant.</p>
      <p>So, for example, <em>bróg</em> ‘shoe’, <em>dlí</em> ‘law’, <em>grá</em> ‘love’, <em>poll</em> ‘hole’, <em>teach</em> ‘house’, and <em>cill</em> ‘church’, if eclipsed and capitalised, would be written thus:</p>
      <p><em>a mBróga</em> ‘their shoes’<br>
      <em>a nDlíthe</em> ‘their laws’<br>
      <em>i nGrá</em> ‘in love’<br>
      <em>i bPoll</em> ‘in a hole’<br>
      <em>i dTigh</em> ‘in(side) a house’<br>
      <em>i gCill</em> ‘in a church’</p>
      <p>Even if written in all-caps, it should still be <em>A mBRÓGA</em>, <em>A nDLÍTHE</em>, &amp;c.</p>
      <p>I can’t think of any instance in Welsh where a similar situation would arise, either. Eclipses (or soft lenitions, or whatever you call them in Welsh—Welsh initial mutations confuse me a bit) are, to my knowledge, capitalised normally in Welsh, on the rare occasion that they result in multiple letters. I have a song called <em>Yng Ngolau Ddydd</em>, for instance; not <em>Yng nGolau Ddydd</em>.</p>
