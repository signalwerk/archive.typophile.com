    html: |-
      <p>This post just doesn't want to die! It seems to have taken a break between 2008-2010 and again from 2010-2013....and now it's making the rounds on Twitter again.</p>
      <p>Has anyone suggested turning this into a Type Challenge for February 2013?.....Come on, throw-down! How about taking just one of the first 20 words in this post and trying to pick the most interesting text setting to submit?</p>
      <p>The winner is picked based on choosing the face that best visualizes the inherent rhythmic interest in the word and showcases its own interesting glyphs, the most interesting interaction with the word's semantic meaning, and most refined aesthetic setting.</p>
      <p>LIST:<br>
      savvy<br>
      assesses<br>
      aggregate<br>
      modern<br>
      filling<br>
      banana<br>
      punctuation<br>
      filigree<br>
      graffiti<br>
      titular<br>
      boondoggle<br>
      representative<br>
      look<br>
      pool<br>
      room<br>
      marmalade<br>
      geostasis<br>
      spoon<br>
      palpate<br>
      sportsl</p>
