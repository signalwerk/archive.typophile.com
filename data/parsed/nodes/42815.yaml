    html: |-
      <p><cite>«illigitimate»</cite></p>
      <p>Illegitimate—not quite as bad when you remove one of the i’s.</p>
      <dl>
      <dt>In English only</dt>
      <dd>diminishing</dd>
      <dd>Mississippi</dd>
      <dd>syzygy</dd>
      <dd>imminent</dd>
      <dd>swimming</dd>
      <dd>balaclava</dd>
      <dd>horror-romance</dd>
      <dd>Milli Vanilli (not sure if “through no fault of their own” applies here)</dd>
      <dd>Bananarama (ditto)</dd>
      <dd>Lananeeneenoonoo (intentionally ditto!)</dd>
      <dt>In other languages</dt>
      <dd>tagetage <em>Danish</em> (‘top floor/garret’ – interesting because you read it as tage-tage, but it’s actually tag-etage)</dd>
      <dd>ffwndwr <em>Welsh</em> (‘commotion’)</dd>
      <dd>ffwr-bwt  <em>Welsh</em> (‘without warning’)</dd>
      <dd>dŵr dwfn <em>Welsh</em> (‘deep water’)</dd>
      <dd>actually just pretty much everything in Welsh</dd>
      <dd>töllöttää <em>Finnish</em> (‘look around a bit’)</dd>
      <dd>… and pretty much everything else in Finnish, too, especially on <a href="http://www.alphadictionary.com/fun/tongue-twisters/finnish_tongue_twisters.html" rel="nofollow">this page</a></dd>
      <dd>oiseau <em>French</em> (‘bird’)</dd>
      <dd>Angstschweiß <em>German</em> (‘anxiety sweat’)</dd>
      <dd>jäääär <em>Estonian</em> (‘edge of the ice’)</dd>
      <dd>töööö <em>Estonian</em> (‘night of work’)</dd>
      <dd>Råå (river in Sweden), hence rååål <em>Danish/Swedish</em> (‘eel from the Råå river’) (before 1948, this was written as raaaaaal in Danish)</dd>
      </dl>
      <p>Most of those are ‘interesting’ in print more because they contain such very odd combinations (or repetitions) of letters than because of the shape of the individual letters, of course.</p>
