      <p><cite>«in German: Schneeeule, Sauerstoffflasche, Passstraße, Schifffahrt, Betttuch, Schritttempo, Kussszene, Bassstimme, Fetttropfen, Teeei, Kohlenstofffaser, Eisschnelllauf, Fußballländerspiel, Klapppult, Geschirrreiniger, Essstäbchen»</cite></p>
      <p>My German is quite bad, so I might well be wrong, but hasn’t the new(est) spelling reform done away with all those (except <em>Schneeeule</em> and <em>Teeei</em>)? I thought I’d read somewhere that in the new orthography, triple consonants were always reduced to double consonants.</p>
      <p>&nbsp;</p>
      <p>There is of course always the lovely Welsh town of Llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogoch, which, quite apart from being ridiculously long, contains <em>-(b)w<strong>llll</strong>an-</em> with no less than four l’s in a row. And then goes on to end in <em>-ogogogoch</em>, which, in combo-Scandinavian, would mean ‘andandandand’.</p>
      <p>Cauaiauaia (place in Angola) looks odd, too.</p>
