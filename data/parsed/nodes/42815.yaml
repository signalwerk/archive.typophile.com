      <p>John: <cite>As I understand it, German typographic convention is not to form ligatures across word-boundaries</cite><br>
      Yes, you’re right; and yes, H&amp;FJ seem to be aware of that.</p>
      <p><cite>four or more ascender letters in a row</cite></p>
      <p>Alkflasche <em>coll.</em> [booze bottle]<br>
      Fellkleid [fur coat]<br>
      Kaffklatsch – a synonym for ‘Dorfgeschwätz’? [jerkwater gossip]<br>
      Stoffblume [fabric flower]<br>
      Vollblut [thoroughbred]</p>
      <p>One could make up a lot more compound words like these.</p>
      <p>I found <a href="http://de.wikipedia.org/wiki/Benutzer:Nitnatsnok/Liste_mit_Wörtern_mit_drei_aufeinanderfolgenden,_gleichen_Buchstaben" rel="nofollow">a great list of German triples</a>, compiled by Konstantin Stephan.<br>
      Then there is the dazzling <a href="http://faql.de/rechtschreibung.html#dreigleiche" rel="nofollow">German language FAQL site</a> by Ralph Babel. It provides us with four – at least theoretically possible – quadruples:<br>
      ‘Raaaar’ – an eagle sitting on a rig, ‘Sanaaaal’ – an eel from Sanaa, capital of Yemen), ‘Unfalllloyd’ – a crashed vintage car) and ‘Zoooologe’ – an oologist working in a zoo (those words were found by Gerhard Horriar, Matthias Opatz and Martin Gerdes).</p>
      <p>By the way, what do you think of ‘palaeooölogy’? It even has got a <a href="http://en.wikipedia.org/wiki/Palaeooölogy" rel="nofollow">Wikipedia entry</a>!</p>
      <p>The FAQL site has even more ooddities to offer; see the <a href="http://faql.de/sonstiges.html#rekorde" rel="nofollow">‘Rekorde’ page</a>: For example, Richard Sokal made up a word with 15 consonants in a row, describing a combined Russian soup meal: ‘Borschtschschtschi’.</p>
      <p>Textwrap: <cite>How does one pronounce the triple f?</cite><br>
      Basically, not different than a single or double ‘f’. The vocal before (‘u’) is short, and one could insert a subtle pause between ‘Auspuff’ and ‘Flamme’, to make the compound clear.</p>
