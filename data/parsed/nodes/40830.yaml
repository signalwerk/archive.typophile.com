      <p>Thank's for pointing that out. I glanced at the letters if something stands out. It was "e". I didn't see the "a" because it's at the beginning of the line. So. Thank for teling me. I think both are too different.</p>
      <p>OR</p>
      <p>"s" is completely wrong. they don't complement each other. And if you'd change "s" you'll find other letters that would need adjusting as well.</p>
      <p>BUT</p>
      <p>changing "a" and "e" to complement "s" would make it too boring and have-seen-it-too-many-times-before...</p>
