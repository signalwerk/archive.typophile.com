    html: |-
      <p>You think? The 'a' and 'e' are sort of reciprocated versions of each other, adjusted for weight and balance of course. True that the diagonal stroke does not make an appearance anywhere else in the lowercase alphabet, but I like the character that they provide... I've a few other versions of both of those characters that are more in-line with the rest of the system (think lowercase 's'), but they just seem too rigid and bland to me. I will post them soon so you can see.</p>
      <p>I also think those particular characters seem to work well when they are in context. I will also post some specimens of the font in use so that you can see what I'm talking about.</p>
      <p>I will definitely adjust the "M," I definitely deliberated on that stroke-length for some time.</p>
      <p>Thanks for looking, and thanks for the feedback!</p>
