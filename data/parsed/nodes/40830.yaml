    <p>Hello!</p>
    <p>Up for critique today we have Cataglott Sans, a sporty sans-serif with a geometric basis. This started as a logotype for a piece of athletic apparel, but I just couldn't stop and suddenly had an entire alpahbet. So then I decided to make two. And I would like to make a few more before all is said and done.</p>
    <p>It's construction is largely mathematical, with the usual optical tweaks and ink traps at all the acute joins. I left most of the right angles alone.</p>
    <p>Two weights for now, regular and bold, though I would like to add a light and all three obliques. Nobody has seen this yet besides me, so I'd love some feedback.</p>
    <p>Word up!</p>
    <p>Darrin</p>
