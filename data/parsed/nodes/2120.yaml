    html: "<p>Paul: <br> <br>I think the general direction works, however, I'm feeling Hrant's remarks. If you continue in the direction you're heading I would have two possible suggestions: (1) extend the \"E\" horizontally, as it appears too small relative to the other letter forms, and (2) increase the serifs of \"x\" to be slightly larger than that of the \"y\" (or just lose the \"y\" serifs), as the \"y\" appears gargantuan compared to the other letterforms. If you decide to move a little further, you may try softening the serifs so there are less hard angles (again, maybe losing the \"y\" serifs). One more thought</p>"
    html_clean: "<p>Paul: <br> <br>I think the general direction works, however, I'm feeling Hrant's remarks. If you continue in the direction you're heading I would have two possible suggestions: (1) extend the \"E\" horizontally, as it appears too small relative to the other letter forms, and (2) increase the serifs of \"x\" to be slightly larger than that of the \"y\" (or just lose the \"y\" serifs), as the \"y\" appears gargantuan compared to the other letterforms. If you decide to move a little further, you may try softening the serifs so there are less hard angles (again, maybe losing the \"y\" serifs). One more thought</p>"
