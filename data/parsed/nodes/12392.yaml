  html: |-
    <p>Today’s <cite>National Post</cite> featured this image of Jebel Ali ‘Palm Island’ being built on the coast of Dubai. As you can see, some of the floating islands are in the shape of Arabic text, making up what must surely be the largest piece of lettering in the world.</p>
