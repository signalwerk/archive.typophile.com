    html: |-
      <p>I’ve heard it said that size doesn’t matter (but I haven’t heard that from a typophile).</p>
      <p>According to <a href="http://www.thepalm.co.ae/"> the palm’s website </a> the “elevated retreat homes linked by boardwalks” spell out a passage from a verse by H.H. Sheikh Mohammed bin Rachid Al Maktoum, “Take wisdom from the wise — not everyone who rides a horse is a jockey.”</p>
      <p>Helpful, if you thought all horse riders were jockies.</p>
