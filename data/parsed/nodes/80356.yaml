    <p>Hi guys,</p>
    <p>I recently bought Letterror's <a href="/wiki/Superpolator" class="freelinking" rel="nofollow">Superpolator</a>. I've seen all the <a class="freelinking external" href="http://letterror.blip.tv/file/1909019/" rel="nofollow">video's about it</a> from the Robothon 2009 event, but still the program stays a bit of a mystery to me. Since there is no (known) manual for Superpolator, other than the Robothon 2009 video's, I hope there are some people out there willing to share tips and tricks. Perhaps we could even build a wiki page for it.</p>
    <p>These are the issues I'd like to be enlightened on:</p>
    <p><strong>1) Importing/updating individual <a href="/wiki/UFO" class="freelinking" rel="nofollow">UFO</a> glyphs</strong><br>
    If you edit your masters in Fontlab and and want to update them in Superpolator, do you replace the existing master or can you update just the glyphs you editted in <a href="/wiki/Fontlab" class="freelinking" rel="nofollow">Fontlab</a>?</p>
    <p><strong>2) Automatic update master in Superpolator</strong><br>
    Is the master automatically updated when you export the UFO file again from <a href="/wiki/Fontlab" class="freelinking" rel="nofollow">Fontlab</a>? Since the files should be in the same folder with the .spe file, does Superpolator check them and automatically update the master?</p>
    <p>Feel free to dump your Q&amp;A here. </p>
    <p>Thnx,<br>
    Rene</p>
