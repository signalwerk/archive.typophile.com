    <p>Normally I would never consider using -- let alone drawing -- this type of 'ultra-geometric' lettering. But for this application (a sign manufacturer) I think it is the most appropriate solution.</p>
    <p>I'm eager to hear you throughts on the weight distribution and such. I have taken the top arm of the S glyph and brought it in a bit, to counter balance the character so it doesn't look like it it falling forward. I wonder if this is appropriate, etc.</p>
    <p>Your thoughts?</p>
    <p>[Edit: I attached another PDF which details what they mark will look like in normal application]</p>
    <p>[Edit: I have posted the finished results]</p>
