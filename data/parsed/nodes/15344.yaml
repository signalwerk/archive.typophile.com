    html: |-
      <p>I attached a new PDF.</p>
      <p>I agree, the G needed to be thinned up a bit. But I dont think the vertical arm needs to be the same size as the horz arms on the S. I think it need to be a tad bigger optically. I opened up the counters on the S. Technically it looks better, but I think I might like the sophocating looks. This needs to be really tight and compact. The hacked off serif on the 1 doesnt work. There is a nice flow that is maintained from the top of the one through the S and the T. I want to try to kep this flow.</p>
      <p>Your thoughts?</p>
