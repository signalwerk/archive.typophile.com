    html: "<p>Stalking the world of type like a paparazzi chasing a speeding car... ;-) But actually, that bit was opinion more than knowledge. In fact some people (including me a few years ago) would have counted one pixel of \"internal leading\" as part of any bitmap font (so Micromorph would be a 9), but then I realized that: <br>1) The \"big boys\" (like the MS core fonts) measure it flush. <br>2) It's rare for the descenders of a line to run into the ascenders of the following line, so it's not worth \"wasting\" the measure. <br> <br>hhp <br></p>"
