      <p>I think there might be places that can do a comp for you but it may end up being to expensive. If its to show a client, you could simply do a color comp and show samples of the process. If you have a printer in mind, ask them for samples from extra runs or misprints. They would likely have a book available with samples of foil to choose from.</p>
      <p>Sometimes foil-stamping , sometimes referred to as Hot Stamping, is combined with embossing or even litho. One important thing to be mindful of is line weight and counters in type. Very thin hairlines in type are apt to drop out leaving the undercoating showing. The counters in the loops of e’s and such can plug with foil if they are very small in size. These effects vary some from one printer to the next so seeing printed samples of your printers work is a good idea.</p>
      <p>Stephen</p>
