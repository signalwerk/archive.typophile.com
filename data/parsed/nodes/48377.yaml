      <p>Very difficult to comp foil-stamping yourself. </p>
      <p>As for service bureaus, Allan Wahler’s company, A2A Graphics, does exactly this sort of thing. I know them for comping trade fiction covers — lots of stamping and embossing, etc., . . . you know the style. They also mock up credit cards and such, comping holograms, etc.</p>
      <p><a href="http://www.a2a.com/home.html" title="http://www.a2a.com/home.html">http://www.a2a.com/home.html</a></p>
      <p>(Looks like they’ve just moved out of NYC.)</p>
      <p>P.S. Allan Wahler is husband to Carol Wahler, long-time director of the Type Directors Club. Many typophiles may have met him at various conferences without realizing what he does.</p>
      <p>— Kent.</p>
