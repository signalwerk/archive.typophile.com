      <p>I recall these sheets too. One brand was called “Copy FX”. There were these sheets of film you could attach to a laser print or photocopy, run them through the printer’s fuser a second time (by making a blank print) and the foil would adhere to the toner. </p>
      <p>I worked for a while in a shop that had a semi-automated system that did this with the film on rolls, but it was a terrible mess, constantly jamming.</p>
      <p>Letraset had a hand operated system for a time with a similar material and a special hand iron.</p>
