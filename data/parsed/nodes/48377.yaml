    <p>Hello,<br>
    Does anyone know if there is a way to accurately make a comp of a foil-stamped piece, showing the actual foil you plan to use (or a close facsimile), prior to the printing? Are there service bureaus that can do this, (preferably in the U.S.)?</p>
    <p>thanks for any ideas....</p>
