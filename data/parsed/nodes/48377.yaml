      <p>I’ve used laser foil tons of times.  It works great.</p>
      <p>1. Print out your art using a laser printer<br>
      2. Cut out a piece of laser foil slightly larger than the area you want foiled<br>
      3. Tape it over the graphic using the provided tape.<br>
      4. Load the paper back into the laser printer.<br>
      5. Print a blank page<br>
      6. Remove excess foil from page.</p>
      <p>The toner and the foil will fuse together leaving a foil graphic.  Pretty cool stuff.  I did about 150 certificates using this method.  Worked great.  </p>
      <p>I’ve used the stuff from paper direct.  But I’ve only used gold.<br>
      <a href="http://www.paperdirect.com/Using+Laser+Foil/id=52/shop.axd/Content" title="http://www.paperdirect.com/Using+Laser+Foil/id=52/shop.axd/Content">http://www.paperdirect.com/Using+Laser+Foil/id=52/shop.axd/Content</a></p>
    html_clean: |-
