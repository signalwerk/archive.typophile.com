  html: |-
    <p>Hi there Typophiles!</p>
    <p>This is a type I've been working on lately. It's a somewhat "mechanic" approach to a very analogue technique used mostly on sales posters in shop windows. Im looking for critique/suggestions on the basic design. I know there are many flaws and some bad spacing, but this is only the first draft. I'll post the whole alphabet in one or two weights later if wanted.<br>
    What do you think? Is there a place for a type like this?<br>
    All suggestions are welcome.<br>
    <a class="freelinking external" href="http://typophile.com/files/rea_pres.pdf" rel="nofollow">sample.pdf</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/sample_4462.gif"></div><p></p>
    <p>Christian</p>
