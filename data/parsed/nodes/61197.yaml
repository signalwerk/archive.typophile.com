  html: |-
    <p>Now at just over two, my son, Erik, is in love with letters.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/erik_2009-08_5879.jpg"></div><br>
    He's tracing the letters on the side of the train car we rode at Train Town in Sonoma. I think he liked the sign more than the train ride!<p></p>
    <p>Some things I'm learning from him:<br>
    Z is N<br>
    W is M<br>
    3 is M and sometimes E<br>
    8 is B<br>
    Every F should transform into an E<br>
    Every C should transform into an E<br>
    When you pronounce "R" it needs to really sound like a pirate, "AAAAAARRRRRR!"</p>
