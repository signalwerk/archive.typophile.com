      <p>It's a logo so expect heavy editing.<br>
      Not a blackletter, but a Roman face.<br>
      The double swash on F is found in Bookmania as an alternate.<br>
      But base font is something different. Serifs don't match.<br>
      Swash on B is found in Bookmania and several others, including Fairfield.<br>
      Don</p>
