    <p><img src="/sites/default/files/old-images/d0a3ffb08429a26f0937e547e4b917d3_4123.8391.png"></p>
    <p>The text is on a curve... but it should be good enough to identify.  If you cannot suggest an exact match then something very similar would be very much appreciated.  I'm not a font expert... but it looks like an italic rounded blackletter font with very extended and curvy serifs.</p>
    <p>This comes from the National Bohemian Beer label.</p>
    <p><a href="http://2.bp.blogspot.com/-NESQN7E7J1Q/TkaPc8Mp29I/AAAAAAAABEQ/2DuDbFlN0Vk/s1600/IMG_9446.JPG" title="Click to visit an external URL." class="freelink freelink-external freelink-external">See this link</a> for a high resolution photo that shows the font as used on the top of the label.</p>
