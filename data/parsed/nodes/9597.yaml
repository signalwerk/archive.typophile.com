    html: <p>I think it's custom, but I think you could simulate it pretty closely with the S from Quay Sans Black (as an example) and the other letters from Avant Garde Gothic. I will be back with the simulation soon.</p>
    html_clean: <p>I think it's custom, but I think you could simulate it pretty closely with the S from Quay Sans Black (as an example) and the other letters from Avant Garde Gothic. I will be back with the simulation soon.</p>
  - id: 61369
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Ok, here is what I came up with. I used a book weight of Avant Garde and thickened the stroke. I used the Black weight of Quay Sans and thinned the stroke, and rotated the S back a bit (these were the only weights I had). That was pretty close, but in order to make a better match I ultimately had to move the leg of the R (after converting it to outlines) and use a triangle to fill in the point where the bowl almost touches the stem of the R.  <br> <br>So it wasn't as easy as I thought, but then I am not very skilled at outline manipulation of letters.  Bottom line, I still think it's custom lettering, but what I did might be a way to re-create it.<img src="http://www.typophile.com/forums/messages/83/66709.gif" alt="Sirius Simulation"></p>
    html_clean: <p>Ok, here is what I came up with. I used a book weight of Avant Garde and thickened the stroke. I used the Black weight of Quay Sans and thinned the stroke, and rotated the S back a bit (these were the only weights I had). That was pretty close, but in order to make a better match I ultimately had to move the leg of the R (after converting it to outlines) and use a triangle to fill in the point where the bowl almost touches the stem of the R.  <br> <br>So it wasn't as easy as I thought, but then I am not very skilled at outline manipulation of letters.  Bottom line, I still think it's custom lettering, but what I did might be a way to re-create it.<img src="http://www.typophile.com/forums/messages/83/66709.gif" alt="Sirius Simulation"></p>
