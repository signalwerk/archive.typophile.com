      <p>While experimenting with color placement the "el bee" thing really started to stand out to me, and it was really bothering me. i had a problem with having "bee" in there in the first place. So I've done a few variations with a different spelling. I think I'm going to go with it unless people seem to think it doesn't read correctly.</p>
