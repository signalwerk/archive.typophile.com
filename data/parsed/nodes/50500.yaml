    html: |-
      <p>So I think I'm set on colors and color placement. I thought I was set on spelling but it seems others like the original "ellbee" better. So, here's a version of both with the original "e"s and with the small tap removed. I really liked that characteristic of the "e" but I also agree that it doesn't work at a small size. Would it be weird to have an alternate logo for printing at a small size? </p>
      <p>I've come up with a quick mockup so you can see the two different spellings in action. The left has the tap on the "e" while the right doesn't. </p>
      <p>Kirsten, I agree about using the black over the color, luckily I also think it looks best that way anyhow. Two me, with the syllables in two different colors it plays up the idea that it standing for the intials anyhow. </p>
      <p>Thanks everyone for the suggestions and help. I think I'm coming to a final here. Just a little bit more tweaking.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_bc_4918.gif"></div><p></p>
