    html: |-
      <p>thanks Rodrigo. for a second i thought everyone was going to get hung up on the pound issue. i appreciate the critique and suggestions.</p>
      <p>I've decided to let go of the second option and continue perfecting the first. I agree that color isn't there yet. it's kind of arbitrary at the moment. i will try out your suggestions and post my work soon. </p>
      <p>to address the pound issue since it seems to be an important one. I agree, "lb" is an abbreviation for pound. and alone the symbol may be read that way. but if i can establish a strong enough brand i think i can redefine how people read "lb". the symbols are not so be used by themselves. they would be a secondary element to the logo. if i can establish a strong presence in the name ellbee i don't think anyone would read "lb" as pound. and if they do...well as a friend of mine pointed out...maybe it just symbolizes that my design has weight.</p>
      <p>if i seem cranky, sorry. i just thought i would get better feedback here. the lack of response is disappointing, aside from rodrigo's.</p>
  - id: 306559
    user_id: 17904
    user_name: Kirs10
    user_path: null
    date_raw: 15 Oct 2008 — 12:25pm
    date: 2008-10-15T12:25:00
    votes: null
    html: <p>Nice designs, I like the first version best, as well as it's 2 color versions. I'm not 100% sure about the terminal of the l surprinting the black b. It's so delicate, it may be tough to trap, and possibly do some funky things when printed. The lb does make me think of pounds but what I find more of a challenge is going from ellbee to lb. When I sound it in my head of course it makes sense. But it's a little jarring visually - in seeing it, the natural inclination is to think the initials should be eb. That said, I keep going back and forth between the two like it's a private joke, and getting people to spend so much time thinking about your logo isn't a bad thing.</p>
  - id: 306598
    user_id: 14556
    user_name: cuttlefish
    user_path: null
    date_raw: 15 Oct 2008 — 4:41pm
    date: 2008-10-15T16:41:00
    votes: null
    html: "<p>Regarding the tagline \"design solutions\": The word \"solution\" when not relating to an liquid mixture of ionized solids in a solvent, or an answer to a specific problem, has come in not so recent years to read as a marketing gobbledygook substitute for \"thing\", that is, it is devoid of meaning. If you are a designer who believes that you are in the business of solving your clients' visual communications problems, keep the tagline. Otherwise, give it a second thought.</p>"
  - id: 306602
    user_id: 37791
    user_name: petiteminotaure
