    <p>alright. I went back to the drawing board with names for my freelance design business. I settled on "ellbee", which is my initials written phonetically. </p>
    <p>I'm working on using just the name as a logo. I haven't really figured out what type of symbol to incorporate into the mark if any. After a few rounds of trying out different fonts I've narrowed it down to these two and am now playing with color. I feel like they are both still lacking but I'm stuck. The marks to the right are not meant to be incorporated into the main logo but may be used as secondary design elements in my branding.</p>
    <p>begin critique.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ellbee_logo3_5798.gif"></div><p></p>
