    votes: null
    html: |-
      <p>kristin- you're probably right about the trapping issue. do you think it would be bad to use different versions of the logo? i don't really want to give that up and can probably use it for most purposes. maybe i just use a solid colored one when printing the logo small. i guess the first step is to see what happens when i print it. i appreciate your feedback on using the lb and ellbee together. i'll give it some thought. </p>
      <p>cuttlefish- i was actually just trying to brainstorm something to replace "design solutions". the reason i chose solutions is because through my experiences, one thing i've come to realize that defines me is my passion for solving problems. any type of problem really, but especially in my field. but you are right about the marketing gobbledygook, i know since i just left a marketing firm who used "creative solutions". i'm having trouble coming up with something else. i'm leaning away from something generic like "designs", "graphic design", etc. I don't know. Any suggestions? Should I just go with "Print &amp; Web Design"?</p>
