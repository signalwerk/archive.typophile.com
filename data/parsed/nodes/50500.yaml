      <p>Choices...mmmm </p>
      <p>The first group of designs looks more straight foward<br>
      The second one more creative and free, but, I don't think the spacing between characters is correct, some fine tunning needed.</p>
      <p>Personally I rather do simple and clean so I would keep the first group probably option right on the second row &amp; left on the third row.</p>
      <p>Regarding color, this is the best of the options you presented earlier, but, to me it looks very institutional, too proper and not necessarily stylish or modern, ( this might be a good thing , I don't know what kind of clients you wish to attrack )</p>
      <p>Also some of the coloring options you present are quickly dismissed because they make you read something that just isn't there, such as 3rd row right which reads "el bee" "el" being "the" in spanish, not sure an image of a spanish bee is what you are trying to communicate...lol</p>
      <p>Design solutions is by far more stylish that print &amp; web design , print &amp; web sounds more narrow less creative etc...</p>
      <p>Design alone might be a good option, or design + something else.</p>
      <p>Rodrigo Aguadé<br>
