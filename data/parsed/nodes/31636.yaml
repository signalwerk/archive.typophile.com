    <p>Hey all im trying to find a tutorial that can allow me to curve the baseline but leave the X-height alone kind of thing in Illustrator.  I feel that this should be pretty simple in illustrator, but its one of those things I have never had to do.  A link to a tutorial would rule.  I will make you coffee next time your jantzen beach.  Thanks Casey.</p>
    <p>I provided a link to show what Im talking about.  Mainly with “Rose Festival”.</p>
