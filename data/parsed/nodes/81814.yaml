      <p>Interesting. </p>
      <p>How about averaging the measurements of different cuts of Baskerville and Garamond to see whether this holds true more generally?</p>
      <p>Also, you should look at the regular, rather than the light, weight of Garamond. Light weights need to keep a certain amount of weight on their hairlines or risk drop-out.</p>
