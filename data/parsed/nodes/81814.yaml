    <p>hi,<br>
    i hope you can help me, i´m analyzing some fonts and i have no idea, why these results are like they are. i alnalyzed the stroke contrast of urw baskerville and itc garamond. i take the width of the vertical stroke of the lowercase "n" and the hairline in the middle of the "e", divided the results, so that i get the stroke contrast. I hope still that point i didn´t make any mistake.</p>
    <p>the stroke contrast of the garamond is getting higher per growing stoke thickness (sorry my english is not the best) garamond light 1: 1,87. garamond ultra: 3,33. ok that make sense to me, there ist not so much space, the letter would getting to dark, therefore the stroke contrast is getting higher.</p>
    <p>but at the baskerville the results are contrary: baskerville regular 1:3,5. baskerville ultra bold 3,17. and that´s the point i don´t unterstand, why is the stroke contrast getting less, which optical cause has it?</p>
    <p>i hope you can help me and understood my lously english.<br>
    thank you very much,<br>
    juli</p>
