    html: <p>One thing to remember is that when those fonts were originally designed (by Garamond and Baskerville) there was no bold, light, ultra, etc, just regular and (maybe) italic (and variations between designs of different size type). So the changes in contrast you are talking about were the result of decisions made in the 20th century (probably) by someone else.</p>
