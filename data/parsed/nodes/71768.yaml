    html: <p>Hi. Had a look at your font. First of all you should figure out a step by which the size shrinks. Your typefaces width of stem for bold is 117. You should figure out a width for hairline, for example 117 - 20 (97 - regular) - 20 (77 - light) - 20 = 57 hairline. Then draw it. Then you could use option blend fonts to make light and regular. Then redraw the results (they will not be very perfect). At least it is how I do it.</p>
