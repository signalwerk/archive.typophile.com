  html: |-
    <p>My feeling is that the font used in a text would have a certain weight in how an assessor or supervisor views, reads, relates and marks etc a written text.<br>
    This fascinates me as there may be considerable differences in the humanities and sciences. And in the sciences, between the soft and hard sciences something like psychology or economics may need a different font for top appeal and presentation to something like physics or mathematics to be as convincing as possible. Then there are the health sciences and nursing where maybe<br>
    empathy and other centeredness and practicality a certain organic life centredness is valued more than in say philosophy or theosophy where self consciousness is written in capital letters. I would like to get input and views from others on this?</p>
