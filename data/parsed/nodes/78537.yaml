      <p>&gt; My feeling is that the font used in a text would have a<br>
      &gt; certain weight in how an assessor or supervisor views,<br>
      &gt; reads, relates and marks etc a written text.</p>
      <p>In the context of a teacher or supervisor reading a report, I doubt if the font choice would make much of a difference in grading, as long as the font was not wildly inappropriate and the layout was reasonably easy to read.</p>
      <p>However if there is a professional publication that your teacher/supervisor reads and respects, perhaps using similar font &amp; layout choices might be an approach you could try.</p>
