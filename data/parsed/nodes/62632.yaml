      <p>I buy fonts, but admittedly probably have never fully read through a EULA. I'm not sure many people do. We usually just click ACCEPT when we're installing software, for instance.</p>
      <p>So, I usually hear about EULA clauses after-the-fact. </p>
      <p>Personally, licenses that prohibit embedding in PDFs would make me think twice about purchasing the typeface...especially if it's a text face where I may very well have reasons to keep the text text.</p>
      <p>I have mixed feelings about the 'no logo' clause in things like House's licenses. If there work wasn't otherwise stellar, I'd probably hold it against them. ;)</p>
