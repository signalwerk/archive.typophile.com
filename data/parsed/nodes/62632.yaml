    <p>Hi Guys,<br>
    Just like some of your wisdom please on things you have seen in relation to 'prohibited uses' and additional license agreements within Commercial EULAs.</p>
    <p>I have looked through as many EULAs as I can find and searched our Wiki here, but I'd love to know what people have seen in the way of category defining limitations on Commercial EULAs.</p>
    <p>I understand that there is basically 2 ways of approaching/viewing/creating a Commercial EULA, from the 'all you can eat' EULA where you can just go for it for the price of the Licensing Agreement (or Font), then there are the Commercial EULAs that have stipulations on the distinct areas you are allowed to use the Font via the EULA. Within the latter there can be areas commercially you cannot encroach without purchasing a secondary license or Agreement. And that is what I'd like to know.</p>
    <p><strong>What areas or categories of Commercial License Agreements have you seen that have had listed categories that are interesting, making sense, ridiculous, or being unusual in the way of restrictions within it?</strong></p>
    <p>I understand people have their various opinions on EULAs, but at this stage I'm just interested in what you've seen in your travels on the web or within the Font Industry, not what you think. I have already read enough opinion, just seen very few details.</p>
    <p>Any insights, observation, anecdotes, or wisdom, would be greatly appreciated.</p>
    <p>Thanks in Advance guys.</p>
    <p>Cheers<br>
    DrJ</p>
