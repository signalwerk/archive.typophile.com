    html: |-
      <p>I also see 'Derivative' used a lot as a term placed in Commercial Licenses.<br>
      I know what the word means, but the way some foundries use it throws me.</p>
      <p>Sometimes the way the foundry has worded it sounds ambivalent, like..<br>
      (A) Basically you can't create a thing with the font!!! Sounds like you cannot place it on anything. lol.<br>
      OR<br>
      (B) Do not take the font and turn it into some other identity. Presumably another font.<br>
      I've read a couple of EULA's and wondered if the foundry knows what it means.</p>
      <p>What is your opinion &amp; understanding of the phrase 'Derivative Works'? (Usually prohibited)</p>
      <p>Cheers</p>
