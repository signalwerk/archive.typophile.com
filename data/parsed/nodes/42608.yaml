    html: |-
      <p>Where+When working with Arabic, always do:<br>
      1. Try importing instead of Copy+Pasting.<br>
      2. Make sure that the Text:<br>
      • goes right to left in direction (Justification is another issue).<br>
      • is Arabic-Spaced not Latin-Spaced, and<br>
      3 the Language of paragraphs is also Arabic.<br>
      All the Best with Flowers</p>
