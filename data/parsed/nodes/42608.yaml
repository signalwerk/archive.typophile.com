  html: |-
    <p>Now, that's my problem: I have an arabic text in word and I'm trying to paste that text in a Indesign layout but  the text is displayed left to right. I wonder if it is some way to set text direction. I searched the internet for a solution and found a script that reverse the text in a single paragraph.<br>
    Somebody have a better solution?</p>
