    html: |-
      <p>You need to use another version of InDesign, called InDesign ME, from a company called WinSoft. This will let you work with scripts that are right to left running, like Hebrew and Arabic.</p>
      <p>Alternatively, you can make a PDF from Word and place this as a graphic.</p>
