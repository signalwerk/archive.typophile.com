      <p>Do you need the exact font?<br>
      For the formatting all you need is a monospaced font at the right point size. Note the width of the space is identical for a very narrow letter like i and the widest letters, both upper and lowercase. Note that some letters, like m, are compressed to fill the space, while others like r are expanded to fill it.<br>
      My fonts has 310 fonts with the monospace tag <a href="http://www.myfonts.com/search/tag%3Amonospace/fonts/" title="http://www.myfonts.com/search/tag%3Amonospace/fonts/">http://www.myfonts.com/search/tag%3Amonospace/fonts/</a><br>
      Quite a few are sans with some similarity to your image.<br>
      If you want an i without serifs top or bottom you have  Telegramo <a href="http://www.myfonts.com/fonts/volcano/telegramo/" title="http://www.myfonts.com/fonts/volcano/telegramo/">http://www.myfonts.com/fonts/volcano/telegramo/</a><br>
      There is also a collection at Dafont <a href="http://www.dafont.com/theme.php?cat=503&amp;text=StartTimeEnd%3A&amp;fpp=100" title="http://www.dafont.com/theme.php?cat=503&amp;text=StartTimeEnd%3A&amp;fpp=100">http://www.dafont.com/theme.php?cat=503&amp;text=StartTimeEnd%3A&amp;fpp=100</a><br>
      If you want an i without serifs top or bottom you have ElroNet Monospace<br>
      <a href="http://www.dafont.com/elronet-monospace.font?fpp=100&amp;text=StartTimeEnd%3A" title="http://www.dafont.com/elronet-monospace.font?fpp=100&amp;text=StartTimeEnd%3A">http://www.dafont.com/elronet-monospace.font?fpp=100&amp;text=StartTimeEnd%3A</a> and Crystal <a href="http://www.dafont.com/crystal.font?fpp=100&amp;text=StartTimeEnd%3A" title="http://www.dafont.com/crystal.font?fpp=100&amp;text=StartTimeEnd%3A">http://www.dafont.com/crystal.font?fpp=100&amp;text=StartTimeEnd%3A</a><br>
      If you are lucky a font detective will track down an exact match to your image.<br>
      Don</p>
