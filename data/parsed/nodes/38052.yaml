    <p>Hey everyone,<br>
      I’m just writing to find out if anyone knows what these two fonts are.  The first one is from the new SMALLVILLE Opening Credit sequence and the second is the font used in the SUEPRMAN RETURNS Opening Credit sequence.  The SR font is an outline font.  Here are two screen grabs.</p>
