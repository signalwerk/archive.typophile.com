    html: <p>Bren, I think there might be no specific location for the "estimated" symbol. That's probably because it is considered more of a symbol/logo than a glyph. The only place were you can find it is in specific logo- and symbolfonts, and its location varies. <br> <br>And I must disagree with your opinion about the "euro", there are some fine designs in currently issued typefaces. It's very similar in concept to the dollar or yen-sign. You just have to stay away as far as possible from the official geometric Euro "logotype" as found in Adobe Euro Sans... ugh. <br> <br>If you wanna find out which currencies became obsolete, check <a href="http://www.xe.net/currency/" target="_blank"> The Universal Currency Converter(tm)</a>. When you select one of those currencies, it gives you a warning.</p>
