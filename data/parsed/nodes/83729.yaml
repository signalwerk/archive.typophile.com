      <p>Thank you all, nice suggestions all around.</p>
      <p>I didn't consider Relato because I thought it was too humanistic. I love it, but it didn't fit as well.<br>
      Agilita and Flex also have more or less the same problem; they are too detailed, too humanistic.</p>
      <p>Primetype has some interesting stuff towards what I was looking for; but it all seems to be a bit over the budget for this, too (unless I could negociate a different package with them). And Zatro doesn't have small caps.</p>
      <p>I'll have to study this. :P</p>
      <p>Anyone else? Further suggestions will be thoroughly appreciated.</p>
