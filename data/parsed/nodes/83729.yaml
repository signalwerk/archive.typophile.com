    html: |-
      <p>It's a shame Foundrytypes doesn't have a better showcase for their typefaces; I really can't see that much. I've been a fan of those Architypes for quite some time, now.</p>
      <p>I had considered Tabac and Alright Sans, but they still have this same problem: not enough of that “technological” touch of cold precision (which in Gloriola came possibly from the almost monolinear design and lack of perfectly rounded shapes). Quay is also too detailed (tapering of ends of strokes, etc.).</p>
      <p>Parka and Agile look closer to what I was looking for.</p>
      <p>I have to further analise all these. At some point I'll have to give up on finding Gloriola going by some other name… :P</p>
      <p>Thank you all for all your very helpful suggestions. :)</p>
