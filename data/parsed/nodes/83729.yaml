      <p>Yeah, I saw all of those too: at least at the time I rejected all of them for some reason and/or other (too pricey comparing with my cheapest alternatives, no small caps, not really what I was looking for, etc.). I really love most of these and most of what I considered, but I guess love is not enough! :P</p>
      <p>I've been playing since yesterday with the idea of forgetting this and just designing the most needed characters myself. The job didn't really ask for a typeface; I just thought it would be a nice touch. And the client isn't spending-inclined, either, so maybe that's that.</p>
      <p>What I designed came out pretty well, so this alternative is now becoming the most likely candidate…</p>
