    <p>I have this job for which I thought <a class="freelinking external" href="http://typographica.org/2008/typeface-reviews/gloriola/" rel="nofollow">Gloriola</a> was perfect. I needed something which was forward looking – futuristic in a present kind of way, if that makes sense – but down to earth; elegant, not too youthful but not too classical; a bit of an optimistic young adult in typeface form (again, if that makes any sense). It needed to have a “techno-logical” edge to it, but still not fall too far away from the humanist tree. And of course, it had to have small caps.<br>
    Anyway, I thought it was perfect in all the right ways.</p>
    <p>But then I discover it's not available for licensing until 2013. =(</p>
    <p>So I start looking for an alternative. There's <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/dstype/leitura_sans_complete/" rel="nofollow">Leitura</a>, which is great and cheap (and from a fellow portuguese), but I find it's not perfectly designed (the width of the stroke seems irregular, at least in the small caps, which is my main concern, here); <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100026&amp;path=head" rel="nofollow">Whitney</a>, which I can't get as single weight files; <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/process_type_foundry/seravek_medium/" rel="nofollow">Seravek</a>, which is a bit too cute and frankly expensive; <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/just_another_foundry/facit_ot/" rel="nofollow">Facit</a>, which also has the right price but just doesn't cut it for various reasons; <a class="freelinking external" href="http://www.typotheque.com/fonts/fedra_sans_alt" rel="nofollow">Fedra Sans Alt</a>, which is too expensive and has too high of an x-height; and I also considered <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/process_type_foundry/klavika_ot/" rel="nofollow">Klavika</a>, which lacks warmth, and <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/underware/auto_complete_family_ot/" rel="nofollow">Auto</a>, which has too much of a personality for the job.</p>
    <p>So that should give you a quite clear idea of what I'm looking for; any suggestions?</p>
