      <p>It's unlikely you need to resort to a libre font... and you might end up spending more time/money modifying it!</p>
      <p>Avant Garde: Beware, super low readability!</p>
      <p>You might look at the Sassoon fonts. But: handwriting varies between countries.</p>
      <p>A good layout program can vary the wordspace independently. But you could also ask the designer of Mentone (who actually used to hang out here, but couldn't stand yours truly so he left) if he'd be willing to make you a special version (assuming his EULA does not allow modification - if it does, <em>and</em> he's not willing to do it for you, then somebody like me could do it for a small fee).</p>
      <p>Lastly, if you have the budget, you can get <em>exactly</em> the font you need, custom-made. At your service:<br>
      hpapazian at gmail dot com</p>
      <p>hhp</p>
