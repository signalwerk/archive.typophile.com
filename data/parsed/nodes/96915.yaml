    html: |-
      <p>Maybe try: Cronos or even Optima.</p>
      <p>Futura is very close to Avant Garde. You can always adjust the spacing yourself (software permitting).</p>
      <p>Using a bold font will not help in photocopying, and may actually become harder to read than a normal font as the weight of the strokes increases.</p>
      <p>I also would not limit myself to sans serif fonts, even for people with reading difficulties.</p>
