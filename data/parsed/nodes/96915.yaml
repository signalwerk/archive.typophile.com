    html: |-
      <p>Sorry, my English is very bad, I don't know how to exprime myself well! :)</p>
      <p>We make school books and games and our first goal is for people with learning problems. Habitually, we use Comic Sans MS for kids books, not a good font but near of kids writing. We want to find a font more serious for adults. We use only Bold fonts because teachers need to photocopy some pages. </p>
      <p>We like the letters of Mentone, the letters are geometric, near of letters we learn at school, so easy to read. Sometimes the G or the F are special in some fonts, but it's not good for us. We also like AvantGarde, but the text is too compact with it. </p>
      <p>For Mentone, the space between the words and the sentences is too near. For the space, we prefer Univers. Each word is far from each other, we can easily fond a word in the text. </p>
      <p>Maybe I have to reformulate my question: I need a font with geometric or very simple letters, easy to read in bold and small size, a lot of space between each words and good space between each sentence.</p>
      <p>So, with all the fonts, it's hard to find one good. Maybe you have suggestions. Or maybe we want something that is not existing :).</p>
