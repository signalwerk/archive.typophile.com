      <p>Igor, those two happen on a lot of copyright pages, and copyright pages are included in most books.</p>
      <p>^ ^ ^<br>
      Moving on from there, I'd say the biggest lack in fonts today (though likely not yours) is a full set of combining diacritics, 0300 through 036F, and spacing modifiers, 02B0 through 02FF.</p>
      <p>It doesn't matter what a book is about, the author may want, say, to thank some Vietnamese guy in the acknowledgments. Or there may be a author or title in the bibliography where an accent is required. The comp can set these words, borrowing from another font if needed. But it's nice to have characters in the fonts used, to avoid losing a lot of time investigating size, weight, and to some extent, position.</p>
      <p>Precomposed characters aren't necessary if there are just two or three occurrences, but having the <strong>right</strong> bits &amp; pieces is a real help. The files sent off to the printer for a book become the basis for any eventual XML files for archival or research purposes. They may well be the basis for any digital editions. As such, they should have the correct Unicode characters -- for example, not use U+2019 for a glottal stop, but preferably, U+20BC. (Or U+20BB in Hawai'ian [Polynesian]). A base character plus a combining diacritical is syntactically correct, even if there is also a Unicode assignment for a precomposed character.</p>
      <p>So, you can have a trade book on flower-growing and still run into a name or two needing such, and the author wants it right -- after all, they can get things "right" on their word processor, can't they.</p>
      <p>Beyond that, things can get pretty specialized, and may not be worth the type designers time.</p>
