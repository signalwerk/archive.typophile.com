      <p>Glyphiac, a font contains a lot of information besides the glyphs. One of these is a set of OpenType features –actually, codes saying exactly what you asked: alternative glyphs, substitutions and specific styles.</p>
      <p>Features are pre-defined OpenType groups of commands. Take for example the <strong>hist</strong> feature. It is used to replace regular glyphs with its historical, archaic versions. A quite common code is:</p>
      <pre>feature hist {
          sub s by longs;
      } hist;</pre><p>
      The substitution above replaces the regular s with the old longs.</p>
      <p>Another feature is <strong>smcp</strong>, which means "small caps". It defines all substitutions the application should apply when the user set this style. A sample:</p>
      <pre>feature smcp {
          sub a by A.sc;
          sub b by B.sc;
          sub c by C.sc;
      } smcp;</pre><p>
      Here, you have the A.sc, B.sc, and C.sc glyphs in your font, and say they will replace a, b, and c when using small caps. Of course, a proper code will define this change for the whole alphabet, not just a-b-c. And the code must actually include some additional info, like the script used (Latin, Greek, etc.) and the language context.</p>
      <p>To make things easier, there is another portion of codes included in fonts: the OpenType <strong>classes</strong>. A class is just a reunion of several glyphs into a name. For example, you can create the class "lowercase" with all a-z alphabet and "smallcaps" with the corresponding A-Z small caps. Then, you abbreviate the <strong>smcp</strong> feature just referencing the class:</p>
      <pre>feature smcp {
          sub @lowercase by @smallcaps;
      } smcp;</pre><p>
      Font editors, like FontLab Studio, Glyphs and Robofont, offer a panel or window to let the designer edit these codes, which are embedded into the .otf file when the font is generated. Type designers must carefully choose the features the font will offer and include all needed glyphs into it.</p>
      <p>This is just a small explanation about OpenType codes. There are fonts with very few instructions like these and other with tons of replacements. You can find a lot of material regarding this on the web, especially here in Typophile. To find them, use the "site:typophile.com" as an argument in Google search:</p>
      <p><code>OpenType features site:typophile.com</code></p>
      <p>Hope this helps.</p>
