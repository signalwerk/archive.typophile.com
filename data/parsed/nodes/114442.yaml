      <p>George, I suspect the font you're using is to blame for that. I opened up CS6, created a "new" document, and picked Minion Pro - regular as the font for the text block. </p>
      <p>In the Glyph pallet, the dieresis shows as Unicode 00A8 (not what I'd use, but it is valid...). In the glyph pallet, even the case and small cap diereses showed, and <strong>not</strong> as NULL -- they were "associated" through the case and the c2sc &amp; smcp features in the font.</p>
      <p>As far as accents go, when I remake a font, I take out this legacy encoding and have two diereses, one a spacing modifier, one a combining diacritic. (Our fonts aren't for sale, so "legacy" issues don't come up.) Again, both have the proper Unicode number assigned. I don't have the "case" associated, as I always make up a component glyph in FontLab and access it either directly (if in the Unicode index) or through ccmp. If you use mark and mkmk, you won't be making up precomposed characters, so you'd probably need to include any .case or .smcp accents in the appropriate OT features -- case, and  scmp &amp; c2sc.</p>
      <p>In short, I still think that if <strong>in the font</strong> the glyphs have either the proper Unicode assigned, or are associated with such a glyph, all will work. Not had this approach fail me yet, and we do a lot of scholarly books that get into some strange languages, including Native American ones.</p>
