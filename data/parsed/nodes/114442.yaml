    html: |-
      <p>George: Sure.</p>
      <p>Let's suppose you're using the open source Alegreya bold (not the HT-Pro). You are using it for the chapter number in a book, just the numeral itself. But you want the lining figures, not the default, which are old style.</p>
      <p>So you click on it in the glyph pallet, notice that the lining figure has a GID number but is otherwise given as NULL. No matter, up it pops in the file, you screen it back, place it where you want the chapter number, and everything seems to be working.</p>
      <p>Now open the file on another machine. No telling just *what* NULL character you'll get.</p>
      <p>On the other hand, if you build a lnum feature, it works perfectly. I surmise that at some level, InDesign needs a Unicode number to function properly. By having the lining glyph "1" associated with 0031 via a OT feature (lnum, in this case), that is done. Without the feature, it's just another NULL character, and they're all the same -- NULL.</p>
      <p>You could use a stylistic set, or calt, or ccmp, whatever is appropriate. For something that is purely an ornament -- has no legitimate relationship to any character as given by Unicode -- we assign a private-use Unicode number.  At least that alerts anyone making further use of the file that some investigation is needed. </p>
      <p>Some of the old Type 1 fonts are particularly problematic in this -- they'll have ornaments in Latin character positions. Of course, as soon as you change fonts, or create an XML file, etc., you get that Latin character. And sometimes adding a character results in a different word still in the language, which can be an oops (Say, for example, "P" is taken up by an ornament. So, you have "ornament" then "oops"...Indeed.</p>
      <p>The rule in our shop is any glyph in a font either (1) has a Unicode number or is, via a valid OpenType look-up, (2) associated with a character that has a Unicode number. Further, if it's an ornament, that will be a Private Use number, which has no syntactic meaning. In no case will any Unicode assignment be a "lie."</p>
