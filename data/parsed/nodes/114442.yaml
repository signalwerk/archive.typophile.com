      <blockquote><p>...and whether the .alt glyph(s) appear in an OTF feature within the font.</p></blockquote>
      <p>That's the key. Ultimately, InDesign seems to have to associate a character name with a Unicode number. If a glyph itself does not have a Unicode number, it needs to use a feature definition to so associate.</p>
      <p>We've have trouble with this issue. Take a font where the lining numbers are not the deault -- that is, don't have any Unicode number. If they are not hooked up to the numbers with a feature -- say lnum, they wind up with the name NULL in the InDesign pallet. </p>
      <p>Worse, if you enter one via the glyph pallet, it will give you the right character on that machine only. Put the file on another machine, and all NULLS being equal, there is no telling what you'll get, but it likely won't be what you want.</p>
      <p>We helped a customer track down a problem with a jacket they had prepared that had just this problem. Took me a while. Actually, all I really know is that as soon as I associated the glyph with another glyph that had a Unicode number via a OT feature, the problem went away. Take out the feature, it came back. QED...</p>
