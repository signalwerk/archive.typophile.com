      <p><cite>If the fonts are embedded in the PDF, as is almost always the case in professional work, then everything will be just fine.</cite></p>
      <p>I suspect I'm getting too far off topic, but this happened to a customer of ours, who asked for help diagnosing a problem with a book jacket she'd prepared. She had wanted a prime -- usually not included in fonts these days -- and had sort of found one, but it was neither encoded nor linked to an encoded character. It was caught in the printer's preflight as a strange character. Certainly not a "primey thing." When I looked at her files, it was there, as a NULL character. I assumed that was the problem.</p>
      <p>Now with a four-color jacket, the printer had almost certainly taken things apart to make the separations. What was sent to the printer was a (single) PDF. I assumed it occurred at that step, even though the printer was using the same fonts, but on a different system.</p>
      <p>We had a similar instance occur within our shop, no color work involved. I don't remember the character, but it was one glyph on one machine, a different one on another. We just made a rule that no NULL characters could appear in any final file.</p>
      <p>Of course, I had some tidying up to do as well, as I'd put things in the font file with no linkage, such as the .case accents I use only to make up glyphs within Fontlab. It's the sort of thing that can happen to anyone if they're not thinking about consequences. I fully understand it is hard for a small shop type designer to anticipate all this, esp. as I've done it myself.</p>
    html_clean: |-
      <p><cite>If the fonts are embedded in the PDF, as is almost always the case in professional work, then everything will be just fine.</cite></p>
      <p>I suspect I'm getting too far off topic, but this happened to a customer of ours, who asked for help diagnosing a problem with a book jacket she'd prepared. She had wanted a prime -- usually not included in fonts these days -- and had sort of found one, but it was neither encoded nor linked to an encoded character. It was caught in the printer's preflight as a strange character. Certainly not a "primey thing." When I looked at her files, it was there, as a NULL character. I assumed that was the problem.</p>
      <p>Now with a four-color jacket, the printer had almost certainly taken things apart to make the separations. What was sent to the printer was a (single) PDF. I assumed it occurred at that step, even though the printer was using the same fonts, but on a different system.</p>
      <p>We had a similar instance occur within our shop, no color work involved. I don't remember the character, but it was one glyph on one machine, a different one on another. We just made a rule that no NULL characters could appear in any final file.</p>
      <p>Of course, I had some tidying up to do as well, as I'd put things in the font file with no linkage, such as the .case accents I use only to make up glyphs within Fontlab. It's the sort of thing that can happen to anyone if they're not thinking about consequences. I fully understand it is hard for a small shop type designer to anticipate all this, esp. as I've done it myself.</p>
