      <p>"We've have trouble with this issue. Take a font where the lining numbers are not the deault -- that is, don't have any Unicode number. If they are not hooked up to the numbers with a feature -- say lnum, they wind up with the name NULL in the InDesign pallet."</p>
      <p>Yes, that's right. InDesign uses the Unicode value, or the Unicode value plus the features, required to access the glyph via the glyph panel. If the glyph is unencoded AND not accessible via OpenType features, then InDesign stores just the glyph ID.</p>
      <p>Of course, that's not consistent across unrelated fonts, and unless the designer takes care, it may even change across different builds of the same font. But then, what would one expect?</p>
