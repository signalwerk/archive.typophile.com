      <p>Thanks for Typophile 2 guys!  I've been awaiting this eagerly for a long time!  I really appreciate all your hard work!</p>
      <p>Okay, here's the bug report.</p>
      <p>* It seems that both on IE and FF (on PC) that the first post in every thread wraps around the avatar image (if it's long enough) and in subsequent posts it doesn't wrap around the image at all.</p>
      <p>* When using FF on the Forums home page when you drag your mouse pointer over the links in the Prolific Posters and Active forum topics sections the headlines (or second versions of them) flicker above them (around 100 pixels).</p>
      <p>* At the bottom of the page where you're able to send instant messages the Go! button is located underneath the grey box instead of inside it.</p>
      <p>I love the news section, and everything else about the site... I haven't had a chance to explore too much yet.  Plus the headlines are really great-looking (where you use that font-substition tech).</p>
      <p>Will we be able to use our real names (next to the messages) when we post?  I really liked that about Typophile, that people weren't hiding behind aliases and you know who's who.</p>
      <p>Thanks again for all the great work... this is all I can think of at the moment.</p>
      <p>&gt;&gt; Lauri Johnsen</p>
