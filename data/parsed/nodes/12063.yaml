    html: |-
      <p>This is sort of related to the the bug I was experiencing before. As long as the URL does not get prefixed with the www subdomain, I appear to be logged in. If I go away from Typophile for a while (say, I actually have to get some work done...) and return using a link or bookmark which includes the www subdomain, It appears that I am no longer logged in. Once I click another link within the Typophile site, the www is not used and I am magically logged in again.</p>
      <p>This must have something to do with the domain specificity of your cookies. Perhaps redirecting or doing a mod_rewrite on all www.* requests to a subdomainless address would resolve the issue.</p>
      <p>You guys are running this site on Apache, right?</p>
    html_clean: |-
      <p>This is sort of related to the the bug I was experiencing before. As long as the URL does not get prefixed with the www subdomain, I appear to be logged in. If I go away from Typophile for a while (say, I actually have to get some work done...) and return using a link or bookmark which includes the www subdomain, It appears that I am no longer logged in. Once I click another link within the Typophile site, the www is not used and I am magically logged in again.</p>
