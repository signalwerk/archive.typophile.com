  date_raw: 28 Oct 2003 — 8:28am
  date: 2003-10-28T08:28:00
  votes: null
  html: "<p>This morning's spam: <br> <br>From: \"Neil Walker\" &lt;<a href=\"mailto:nb76c@aol.com\">nb76c@aol.com</a>&gt; <br>Subject: Get your business logo in an hour! <br>Date: Tue, 28 Oct 2003 15:44:58 +0000 (GMT) <br> <br><a href=\"http://www.ukpoint.biz/jkhkj/1000/\" target=\"_blank\">Get your business logo in an hour!</a> <br> <br>Do you need a logo for your company, website, or event? Then you've already talked to several design firms that asked you from $500 to $2000 for 3-5 mockups, and promised to have your logo done in a month or two. But why spend a lot of time and money on a logo you may not finally like at all, just because it is custom? <br> <br>Now you have an opportunity to have a great logo that you really like in just a few minutes, risk-free, and at unbeatable price. Swift Logos offers pre-made logo designs that allow you to create your own custom logos without having to hire an expensive design studio. <br> <br>You can choose the logo you like most from hundreds of great pre-made logos created by our professional designers, and instantly receive it in editable Adobe Illustrator and Corel Draw files. Write in your company name and slogan, and in no time you will be able to use it for your company letterheads, brochures, website, and other marketing materials. Do it yourself or have us customize it to fit your needs. <br> <br>Get Your Logo Now! <br>Neil Walker <br>Swift Logos.com</p>"
