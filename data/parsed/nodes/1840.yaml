    date_raw: 28 Oct 2003 — 8:55am
    date: 2003-10-28T08:55:00
    votes: null
    html: '<p>What a great idea! <br> <br>In fact the "templates" are just clip art in standard AI, Corel formats. <br> <br>So the business plan is related to stock imagery, with varying levels of licensing/exclusivity. <br> <br>However, there would certainly be copyright issues down the road if two separate businesses licensed the same image from Switf and thought they had made sufficient changes to it qualify for a unique copyright. <br> <br>And of course, the font police should be alerted: <br> <br>"Please remember to intall the font prior to attempting to edit the logo. You can use any font you choose but for your convenience, we supply you with the font that we use in the sample." <br></p>'
