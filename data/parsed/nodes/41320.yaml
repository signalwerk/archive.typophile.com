    <p>Bryant <a href="/wiki/Condensed" class="freelinking" rel="nofollow">Condensed</a><br>
    Designed by <a href="/wiki/Eric%20Olson" class="freelinking" rel="nofollow">Eric Olson</a> 2002–2005</p>
    <p>Bryant <a href="/wiki/Condensed" class="freelinking" rel="nofollow">Condensed</a> is the mid-width family of the <a href="/wiki/Bryant" class="freelinking" rel="nofollow">Bryant</a> series.Though <a href="/wiki/condensed" class="freelinking" rel="nofollow">condensed</a> in name, this family shares a page color and body width similar to many standard <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a>s. In other words, it's equally suited for <a href="/wiki/text" class="freelinking" rel="nofollow">text</a> and <a href="/wiki/display" class="freelinking" rel="nofollow">display</a> work.</p>
