    html: |-
      <p>Others who have actually done this are much more capable of discussing this with you, but it seems to me that you can ask most large foundries to distribute your fonts. MyFonts <a href="http://www.myfonts.com/info/prospectus" rel="nofollow">here</a> lays out the terms pretty clearly. It seems like they do take fonts from "any old person" as long as that pe rson has the rights to them. MyFonts is probably the most popular foundry for small type designers to sell with, maybe because the creator receives 65% of all sales. Other possibilites I found are <a href="http://www.linotype.com/2064/submitfonts.html" rel="nofollow">Linotype</a> and <a href="http://fontbureau.com/submissions" rel="nofollow">The Font Bureau</a>. However, they frankly seem much more discerning about which fonts they will add to their libraries, which means they'll probably take longer to vet your typeface for sale and might want changes made.</p>
      <p>As to protecting your rights to your typeface, that's what the <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a> (End-User License Agreement) is for. But I don't know if there's any way to make sure that no one rips you off illegally by just opening it in FontLab or Illustrator. But a thorough EULA should make sure that this is kept to a minimum and that you're as protected as possible.</p>
