    <p>hi,</p>
    <p>i've designed my own typeface and was hoping someone will have some advice on how i would go about selling it on the web for people to use.</p>
    <p>is there an established service i can use that would make the font available for download and take care of the payments? do linotype [or similar site] take fonts submitted by any old person?</p>
    <p>also, what about protecting intellectual property [???] and preventing people from copying the design of the font?</p>
    <p>cheers,</p>
    <p>dave.</p>
