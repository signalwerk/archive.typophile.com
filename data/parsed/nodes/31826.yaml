    html: |-
      <p>OK-</p>
      <p>here are two samples of the font. the first is the font typed which i just knocked up, the second [scaled down from A1 size] in a similar way for which it was designed- for a birthday card, hence the name Happy 1st Birthday. perhaps the next version would be Happy 2nd Birthday!</p>
      <p>its my first font so its pretty cruddy &amp; clunky. the monospaced and blockiness are inherent to the design of the birthday card, the sole purpose and conception of the typeface and its form. it only exists in capitals although i've done the numbers and some punctuation. i doubt i'll do a lowercase version.</p>
      <p>there are a few improvements to be made, for example i need to set a height value [i'm not sure which] so that when the leading is set 'solid' the top of the letterform butts up against the bottom of the letterform in the line above- that is how it was originally designed to be. i might also change the 'I' so it has a serif and fills the space better. it was designed to be big [and have only ever used it for titles] but i'm surprised at how legible it is at 10pt despite the letterforms often melting into one-  think thats less to do with my design and more the nature of the roman alphabet!</p>
      <p>anyway, i really enjoyed making it, its nice to have a second outcome evolve from a first, especially one you can keep re-using. all constructive feedback welcome, nothing too harsh though please! maybe i'll even try and sell it...</p>
      <p>cheers,</p>
      <p>dave.</p>
