    html: <p>The slant is one of the ways we can differentiate between i j t l f r and the like.  Think of its use (or lack there of) as part of a larger system that must sensibly create glyphs appearing as a family, adjoining harmoniously with neighbors, yet retaining a sufficient self image to not be confused with a cousin.  With sans serif, the historic slant of the pen is less important than shapes that fit and play nice together. It isn't a case of either always or never use the slant but a case of use it well and sensibly when you do.</p>
