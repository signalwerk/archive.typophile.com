      <p><em>As far as I know, “Dimensional Typography by J Abbott Miller” was published in 1996. [. . .] However, I’m searching for something newer.</em></p>
      <p>Well, not to flog a dead horse, but the <em>Univers Revolved</em> book is from 2004.</p>
      <p>But I can also recommend a newer book: <a href="http://yalepress.yale.edu/yupbooks/book.asp?isbn=9780300117752" rel="nofollow"><strong><em>New Typographic Design</em></strong></a> (2007), edited by Roger Fawcett-Tang. There are several examples of dimensional typography scattered throughout it, especially in the Type In Motion section at the end.</p>
