    html: <p>Well, I know a site, runned by a portuguese designer named Victor Quelhas who has given a conference on dynamic typography in 2006, at Atypi Lisbon. The site is <a href="http://www.dyntypo.com/" title="http://www.dyntypo.com/">http://www.dyntypo.com/</a>, which is open to everyone who wants to share theirs experiments on the subject. It has a lot of links and the possibility to comment and interact with the objects and the creators. Hope it helps!</p>
