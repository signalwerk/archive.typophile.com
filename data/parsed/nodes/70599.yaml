    html: "<p>Possible. However: while differences between repeating characters can be an indicator for lettering (with lots of exceptions), keep in  mind that this is not so clear the other way round. In lettering – especially when it’s digital – it is very easy (and common) to copy and reuse glyphs.</p>"
