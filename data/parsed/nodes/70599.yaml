    votes: null
    html: <p>I doubt it's custom. All the letters are the same except the two C's, which are next to each other, so it could be a ligature, or hte designer customized one so they don't look the same. The letterforms are nice and smooth and well-proportioned, but the swashes of the /P/D/A/ all connect to the circle with awkward angles (especially the /A/). I think a not-so-detail-oriented designer got a hold of a script typeface and did this, but I just don't know what typeface it is. Looks like something from Veer.</p>
