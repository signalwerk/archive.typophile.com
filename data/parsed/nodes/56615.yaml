      <p>Queneau, those don't have Arabic or Hebrew though.  I'm working on a font that's designed precisely for situations like this, but it's still a loooong way from being released.  Good to know though that it will have a market I suppose.</p>
      <p>Though I don't know any off hand, perhaps looking at fonts designed for biblical studies, as they should have at least the hebrew, greek, and latin, and if a font has greek and latin there's no reason it shouldn't have cyrillic as well.  Then you'd just have to grab a somewhat matching arabic font.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
