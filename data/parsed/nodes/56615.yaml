    html: |-
      <p>Charles: <em>Anyway, the Latin character set included in these fonts turns out to be Minion. To use them as full-blown fonts, you probably don’t want to merge just the glyphs into Minion, since they only work as intended with the OT features in the “special” fonts. But the size of the characters and their fit will be the same as the Minion Latin characters.</em></p>
      <p>That's not actually the case. The Minion used in the Adobe Arabic, Adobe Hebrew and Adobe Thai fonts are specially derived instances from the multiple master sources, which in some cases have also been scaled to harmonise with the non-Latin design. The latter were designed, and then we spec'd a width/weight instances of Minion to serve as companion Latin.</p>
