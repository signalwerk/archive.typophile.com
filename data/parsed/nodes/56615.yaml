  html: <p>I've just been given the interesting task of redesigning a multilingual book series. The client was talking a lot about TNR Unicode and how it almost covers all the languages needed (Russian, Greek, Arabic, Hebrew, various languages with Latin script but special glyphs…, everything bar Chinese and Japanese). I'd love to be able use some font other than TNR, but is there an option?</p>
