    html: |-
      <p>Minion.</p>
      <p>When we bought CS4, two of the fonts included were (something like) "Adobe Hebrew" and "Adobe Arabic". Sorry, I'm at home &amp; not planing to go back to work until Monday for once, but somebody can come up with the exact names.</p>
      <p>Anyway, the Latin character set included in these fonts turns out to be Minion.  To use them as full-blown fonts, you probably don't want to merge just the glyphs into Minion, since they only work as intended with the OT features in the "special" fonts. But the size of the characters and their fit will be the same as the Minion Latin characters. </p>
      <p>I do a fair bit of special language work with the Latin alphabet. I always use Adobe fonts, for the simple reason that the EULA allows the end user to modify the fonts, subject to some restrictions -- the modified font counts as one of the allowed copies, no redistribution, etc. </p>
      <p>Some other foundries allow this as well. I don't know if Miss Tiffany has updated her EULA listings. If you really want to use a certain font, is worth asking the smaller foundries, a few I've talked to (some under the Village umbrella) have no problem with such a EULA.</p>
      <p>Making up "special characters" usually involves simply adding a diacritical, which is pretty easy. To have a properly encoded text file for any later "repurposing," you do have to be able to modify the OT features (lookups) to get the characters without a Unicode codepoint, just how depends on the font editing program you use. It isn't that hard with most of them.</p>
      <p>Hope this helps</p>
