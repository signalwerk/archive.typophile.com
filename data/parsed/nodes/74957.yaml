  html: |-
    <p>Hello,<br>
    When I first exported my typeface (in OTF), it looked very distorted and pixelated. I managed to solve that problem by going back to Fontlab, and making all the glyphs 50% smaller. In that way I got the desired result (I would like to take the opporunity to show it to you), but now my typeface is significantly smaller than any other.</p>
    <p>My question is: why is this happening and how to make the typeface bigger whithout damaging the quality?</p>
    <p>Also feel free to comment on the typeface itself.</p>
