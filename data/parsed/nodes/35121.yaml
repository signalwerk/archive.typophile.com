    html: '<p>I haven’t heard of colors being “locked” to a TrueType font as you want. One possibility: You could look into <a href="http://www.fontlab.com/font-editor/bitfonter">photofonts</a>, which are a relatively new phenomenon. Honestly, I’ve never used a photofont, so I can’t comment on their feasibility, but it could be what you’re looking for. There are some examples at photofont.com .</p>'
