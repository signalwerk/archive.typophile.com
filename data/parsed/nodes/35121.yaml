    <p>I have created a True Type font from some bitmapped icons my client supplied. They need these icons in a font file to use in their GIS mapping application. If the icons were ONE colour, this excercise would be easy BUT... the icons they have are MULTIPLE colours. Does anyone know how to “Lock” colours right into a font character? For example, one icon is of a building. The building has a black outline, brown inside and yellow inside the windows. I don’t know how to save the true type character with these exact RGB colours. It only wants to save it as black. Does anyone know if this can be done? I would be thankful for any advice / tips that can be offered to me. thanks!</p>
