    html: |-
      <p>Confirmed. Eurostile Bold Condensed. Dark Side of the Moon and FOR ALL FESTIVAL… are set in different weights of the extended. The lighter text in the lineup is Eurostile Condensed.</p>
      <p>I used the Adobe Open Type version and optical kerning set to 0 for the lineup unless a small adjustment needed to be made.</p>
      <p>GOLDENVOICE PRESENTS is set in Berthold Akzidenz Extended, COACHELLA is hand done, COACHELLA VALLEY ARTS… is set in DIN and then I believe I got back to Eurostile.</p>
      <p>pbc</p>
