      <p>Some of this was done so long ago Patty (the logo and surrounding type) that it was a bit hard to remember… :)</p>
      <p>The identity grew like a weed - finally the city of Indio demanded that we give them some props or they wouldn't let us hold the festival there. Gotta love design decisions forced on you by bureaucrats. They were mad that the festival was called Coachella even though it was actually in Indio.</p>
      <p>pbc</p>
