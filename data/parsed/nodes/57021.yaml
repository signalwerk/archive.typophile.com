  html: |-
    <p>Hi All</p>
    <p>I am creating a book and wonder what your favorite character was</p>
    <p>The book will be a collection of typographer's work that will focus on the beauty, elegance and construction of letterforms.  </p>
    <p>The purpose of the book is not to look at whole fonts but rather examining and appreciating the small details and characteristics of the designs. </p>
    <p>It is about appreciating fonts as forms rather than letters. The beauty of curves and construction. </p>
    <p>At the moment this project stands as a hypothetical project in the hope that it could be put into bookstores or featured in magazines. </p>
    <p>Its critical agenda is to look at font formation rather than fonts themselves. How does the construction of a font create a certain characters, feel or tone?</p>
    <p>The images - are very very very intial ideas for my spreads<br>
    <a class="freelinking external" href="http://typophile.com/files/g.jpg" rel="nofollow">http://typophile.com/files/g.jpg</a></p>
    <p>If you would like to show me your own favorite character that would be even cooler</p>
