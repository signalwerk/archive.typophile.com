  - id: 413719
    user: 1551
    date: 2010-05-31T11:30:00
    date_raw: 31 May 2010 — 11:30am
    votes: null
    html: "<p>Frutiger says in Frutiger: The Complete Works that the oblique italics are more suitable for a sans. So the recent Neue Frutiger (2009) is more faithful to his vision than Frutiger Next (2000). It also reversed compromises that were made for the Linotype photo unit system, I believe.</p>"
