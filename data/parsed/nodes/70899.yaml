  html: <p>Could someone advise an alternative to Myriad Pro font family, with a support of central european and cyrillic glyphs, especially I am interested in bold italic font. Thank you all very much.</p>
  html_clean: <p>Could someone advise an alternative to Myriad Pro font family, with a support of central european and cyrillic glyphs, especially I am interested in bold italic font. Thank you all very much.</p>
