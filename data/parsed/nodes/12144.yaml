    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/31465" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writers</a>&nbsp;: Robert&nbsp;Bringhurst</strong></p>
    <p>Typographic expert, poet, translator of Native American lore and designer, Robert Bringhurst is known best for his typographic reference work <cite><a href="/node/12145" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Elements of Typographic Style</a></cite>, a frequently-updated book widely considered to be the definitive handbook for contemporary typographers. He also extensively updated Warren Chappel’s <cite><a href="/node/add/wiki?edit%5Btitle%5D=Brief%20History%20of%20the%20Printed%20Word" title="Create node &quot;Brief History of the Printed Word&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Brief History of the Printed Word</a></cite> and wrote a short book / long essay on written communication and meaning, <cite><a href="/node/add/wiki?edit%5Btitle%5D=The%20Solid%20Form%20of%20Language" title="Create node &quot;The Solid Form of Language&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Solid Form of Language</a></cite>. He collaborated with <a href="/node/12409" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Letterpress</a> printer <a href="/node/add/wiki?edit%5Btitle%5D=Peter%20Koch" title="Create node &quot;Peter Koch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Peter Koch</a> on <cite><a href="/node/add/wiki?edit%5Btitle%5D=Carving%20the%20Elements" title="Create node &quot;Carving the Elements&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Carving the Elements</a></cite>, a commentary on the <cite>Fragments of Parmenides</cite>. He has also written many volumes of poetry and translated&nbsp;lore.</p>
    <p>Bringhurst’s varied experience as a writer serves him well in his efforts to corral typography; his work as a poet gives him a clear, deft command of English, and his experience as a translator working with some uniquely difficult scripts gives him valuable insight into life beyond the Latin alphabet. His advice is sometimes idiosyncratic but never dogmatic, he sees typography as subservient to the text it sets, and above all he advocates humility as a typographer’s greatest strength. His typographic writings are not perfect, but they are clear-eyed, graceful, and always&nbsp;useful.</p>
