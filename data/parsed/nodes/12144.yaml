    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writers" class="freelinking" rel="nofollow">Writers</a> : Robert Bringhurst</strong></p>
    <p>Typographic expert, poet, translator of Native American lore and designer, Robert Bringhurst is known best for his typographic reference work <cite><a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a></cite>, a frequently-updated book widely considered to be the definitive handbook for contemporary typographers. He also extensively updated Warren Chappel's <cite><a href="/wiki/Brief%20History%20of%20the%20Printed%20Word" class="freelinking" rel="nofollow">Brief History of the Printed Word</a></cite> and wrote a short book / long essay on written communication and meaning, <cite><a href="/wiki/The%20Solid%20Form%20of%20Language" class="freelinking" rel="nofollow">The Solid Form of Language</a></cite>. He collaborated with <a href="/wiki/letterpress" class="freelinking" rel="nofollow">letterpress</a> printer <a href="/wiki/Peter%20Koch" class="freelinking" rel="nofollow">Peter Koch</a> on <cite><a href="/wiki/Carving%20the%20Elements" class="freelinking" rel="nofollow">Carving the Elements</a></cite>, a commentary on the <cite>Fragments of Parmenides</cite>. He has also written many volumes of poetry and translated lore.</p>
    <p>Bringhurst's varied experience as a writer serves him well in his efforts to corral typography; his work as a poet gives him a clear, deft command of English, and his experience as a translator working with some uniquely difficult scripts gives him valuable insight into life beyond the Latin alphabet. His advice is sometimes idiosyncratic but never dogmatic, he sees typography as subservient to the text it sets, and above all he advocates humility as a typographer's greatest strength. His typographic writings are not perfect, but they are clear-eyed, graceful, and always useful.</p>
