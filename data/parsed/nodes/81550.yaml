    html: |-
      <p>It could all be the same font. I went back and looked at the <a href="http://www.bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a> and came up with a couple of candidates that seem pretty close, but it's hard to be sure either is a true match, because the details are hard to see in the smaller letters: <a href="http://new.myfonts.com/fonts/fontfont/milo-serif/" rel="nofollow">Milo Serif</a> and <a href="http://new.myfonts.com/fonts/storm/comenia-serif-pro/" rel="nofollow">Comenia Serif</a> are pretty close to my eyes, and match better than Amasis, I think. The one feature that makes me unsure is the upper counter of the g seems rounder in your sample than in the fonts I am suggesting.</p>
      <p>If you have a clearer image, or more letters, perhaps you can use the Serif Guide and find a better choice.</p>
      <p>- Mike Yanega</p>
