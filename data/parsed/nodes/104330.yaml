    html: |-
      <p>1970, the era of photo-composition lettering. The closest available design is from Letraset, Compacta Bold Outline, designed by Fred Lambert for Letraset in 1963-5:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CompactaBoldOutline_5902.jpg"></div><br>
      It has been published by Eisner + Flake as <a href="http://www.fontshop.com/fonts/singles/elsnerflake/compacta_bold_outline_ot/" rel="nofollow">Compacta Bold Outline OT</a>.<br>
      There was also a Compacta Outline which was slightly narrower &amp; with lighter lines. AFAIK no digital version, but I stand to be informed.<br>
      Don<p></p>
