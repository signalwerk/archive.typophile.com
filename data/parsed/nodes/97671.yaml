      <p>I think that the easiest way to do this is to compress the current installed version in your Applications folder and then install the other version before expanding (unzipping) the existing one. I think this should allow you to run both at once. It looks like this is the recommendation made in the guidelines posted by Adam Twardoch here:</p>
      <p><a href="http://forum.fontlab.com/index.php?topic=8561.0" title="http://forum.fontlab.com/index.php?topic=8561.0">http://forum.fontlab.com/index.php?topic=8561.0</a></p>
