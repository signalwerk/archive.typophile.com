      <p>&gt; whatever happened to DTL Kernmaster 2012</p>
      <p>All I can say is that I sympathize with our colleagues at DTL and URW++. We at FontLab know that developing complex software applications is hard work, and we've learned it the hard way — especially recently. Despite the fact that we've had the largest team of developers and internal QA testers ever — it took us more than two years of full-speed work to move from FontLab Studio 5.0.4 to the current public preview build of 5.1.3. </p>
      <p>So I keep my fingers crossed for the new version of DTL KernMaster! </p>
      <p>Best,<br>
      Adam</p>
