    <p>Is there an easy way to have two different versions of FontLab Studio installed at once on Mac (Mountain Lion)?</p>
    <p>The current 5.1.3 version I'm using has less bugs and is nice and stable, but many of the RoboFab Macros seem to be broken, so I'd like to additionally install 5.1.2. and use when needed for certain Macro tasks.</p>
    <p>Is it just a matter of installing in a new location, or will it still overwrite some of the source and preference files regardless? Or can it be installed to an external drive and launched from there?</p>
