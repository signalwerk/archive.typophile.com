    html: |-
      <p>We <strong>believe</strong> that FontLab Studio 5.1.3 Public Preview build 4692 is better than any previous version of FontLab Studio 5.x for Mac, but we cannot yet <strong>confirm and guarantee</strong> it. This is why the build has the "beta status". The officially released, confirmed to be stable at the point of its release, is version 5.1.2 build 4447. </p>
      <p>Between build 4447 and 4692, we released a number of intermediate builds in which, unfortunately, as it turned out, some things got fixed yet others got broken. </p>
      <p>Currently, we believe that we have fixed <strong>all</strong> the things that got broken after build 4447 — and that’s build 4692. It includes all the "good fixes" after 4447, as well as all the "fixes of the things that got broken". </p>
      <p>(In addition, I can say that we have taken some organizational steps that we believe will prevent such things from happening again.) </p>
      <p>So far, the feedback on build 4692 has been very good. We at FontLab would really like to thank all the people who have submitted their problem reports and participated in the discussions on our forum over the course of the last 15 months. </p>
      <p>We've come a long way since build 4204, our developers fixed over 500 problems, and — again — we believe that build 4692 already is the most stable FontLab Studio ever to exist on Mac OS X. </p>
      <p>Many thanks,<br>
      Adam</p>
