    html: "<p>William, those are the Longhorn fonts. <br> <br>Satyen, font files can be large if they contain a lot of codepages (especially certain expansive non-Latin scripts). As for modifying, it's illegal (at least with those fonts), but if it's for purely internal use I personally say go for it - just make sure they don't end up \"floating\" onto other people's drives... <br> <br>The main question is: What's it for? Titles, lots of text, or what? And are you supposed to embed it in something, or just look at it yourself? <br> <br>BTW, I remember when I first saw Berling chosen as the main Reader font I was disappointed, but then I realized it has more going for it than it seemed. <br> <br>hhp</p>"
