    html: <p>At Typotechnica, Microsoft gave out a pamphlet on the new typefaces that will ship with their new release of Windows. These are especially designed for Cleartype. They are a very impressive collection, including John Hudson's superb Constantia. I haven't seen them on screen, but as they were designed for Cleartype, they promise to be a major improvement.</p>
