  html: <p>&lt;font class="dontLookLikeCrap"&gt;What do you think are the best fonts to use with Cleartype?  I know the canned answer is the Microsoft Reader fonts Berling Antiqua, Lucida Sans Typewriter, and Frutiger Linotype.  Berling and Frutiger are okay, except the numerals aren't level height which I can't stand.  Lucida Sans doesn't do it for me either- would rather use Courier.  So I'd like an alternative for my own desktop. <br> <br>This Longhorn Frutiger-clone Segoe UI looks good.  Don't understand why its TTF files are so large (330k).  And I see that this Cleartype Font Collection is 'coming soon', but not that soon. <br> <br>So what do you recommend as a Cleartype-friendly font?  Is there a free font out there that works well?  Would it be straightforward for me to alter the existing Berling/Frutiger fontfiles to make the numerals evenly spaced and consistent height?  Or should I just wait for Longhorn?&lt;/font&gt;</p>
