    html: <p>The ClearType team looked at hundreds of fonts when picking fonts for the Microsoft Reader (eBook reader) the best available fonts were Berling Antiqua and Frutiger.  <br> <br>Humanist sans seem to be the best all round for this type of rendering - hence Lucida, Myriad, etc., being used elsewhere. But these are also the best for b/w and regular antialiasing too - Tahoma, Verdana, Prima etc., <br> <br>A font is normally large if it has a lot of charaters in it. Modifying the Reader fonts would break the EULA. <br> <br>Cheers, Si</p>
