    html: <p>Chris, I'm talking about the scripts, not the languages. The Klingon script is not very interesting, in the same way that the Latin script is not very interesting, i.e. structurally. It's just a bunch of independent signs in a row. Structurally interesting scripts are things like Devanagari and the other Brahmi-derived scripts of India and Southeast Asia, and Arabic, and old Byzantine Greek cursive in which signs interract contextually, change form, move around, etc. Tengwar is of interest to script encoding engineers because it poses challenges and pushes the boundaries of technology. Developing an encoding for Klingon, on the other hand, would take about five minutes and wouldn't pose any challenge at all.</p>
