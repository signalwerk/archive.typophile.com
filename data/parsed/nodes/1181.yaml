  date: 2003-09-05T20:30:00
  date_raw: 5 Sep 2003 — 8:30pm
  votes: null
  html: "<p>I happened upon this interesting page today:  <br><a href=\"http://www.tlg.uci.edu/~opoudjis/unicode/unicode_mixing.html\" target=\"_blank\">http://www.tlg.uci.edu/~opoudjis/unicode/unicode_mixing.html</a> <br> <br>The author (who is Australian) is primarily interested in Unicode and the Greek language, but this page covers the interesting topic of script mixing. Sub-topics of note: <br> <br>- Kurds in the ex-USSR use Cyrillic script with the additional latin \"q\". However, the capital Q is usually drawn like a big lowercase q. Does it deserve its own unicode slot? (I say yes!) <br> <br>- Wakhi, a central Asian language, has a mixed script of Latin, Cyrillic, and Greek letters. <br> <br>- The Byzantine Greeks used to use a lot of Latin-script words in their documents, but with Greek affixes and diacritics. Eventually, the \"Greek-style\" of writing certain words caught on among Latin scribes! <br> <br>- Certain Greek dialects use a Latin letters to represent sounds not present in standard Greek. <br> <br>Cases like these could really push Unicode and type design to their respective limits. <br> <br><i>However</i>, the real reason I'm posting is that this is the first website I've seen with all content available in English, Greek, Latin, Esperanto, Lojban, and Klingon!!! [Yes, that fact deserves a Triple-bang.] I wonder what his target readership is. <br> <br>Paul</p>"
  html_clean: "<p>I happened upon this interesting page today:  <br><a href=\"http://www.tlg.uci.edu/~opoudjis/unicode/unicode_mixing.html\" target=\"_blank\" class=\"link-external\">http://www.tlg.uci.edu/~opoudjis/unicode/unicode_mixing.html</a> <br> <br>The author (who is Australian) is primarily interested in Unicode and the Greek language, but this page covers the interesting topic of script mixing. Sub-topics of note: <br> <br>- Kurds in the ex-USSR use Cyrillic script with the additional latin \"q\". However, the capital Q is usually drawn like a big lowercase q. Does it deserve its own unicode slot? (I say yes!) <br> <br>- Wakhi, a central Asian language, has a mixed script of Latin, Cyrillic, and Greek letters. <br> <br>- The Byzantine Greeks used to use a lot of Latin-script words in their documents, but with Greek affixes and diacritics. Eventually, the \"Greek-style\" of writing certain words caught on among Latin scribes! <br> <br>- Certain Greek dialects use a Latin letters to represent sounds not present in standard Greek. <br> <br>Cases like these could really push Unicode and type design to their respective limits. <br> <br><i>However</i>, the real reason I'm posting is that this is the first website I've seen with all content available in English, Greek, Latin, Esperanto, Lojban, and Klingon!!! [Yes, that fact deserves a Triple-bang.] I wonder what his target readership is. <br> <br>Paul</p>"
