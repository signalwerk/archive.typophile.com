    html: <p>How does this differ from "Blend Fonts"?</p>
    html_clean: <p>How does this differ from "Blend Fonts"?</p>
  - id: 548617
    user: 1043
    date: 2013-03-27T08:45:00
    date_raw: 27 Mar 2013 — 8:45am
    votes: null
    html: <p>Blend fonts is a one shot deal, working from two source fonts. You need to re-blend whenever you make a change to one of the source fonts to see what effect it has. The MM facility in FL is "live" so you can see what happens with the interpolation while you're editing your masters. It's more interactive.</p>
