    html: <p>You can use four masters and ignore one of them, being careful to only interpolate along a single axis at a time between light and regular, and regular and bold. Tricky, but it works. This is why things like Superpolator were created, which can handle masters placed arbitrarily in a design space. Glyphs also has some ability to handle intermediate masters.</p>
