  html: |-
    <p>Hi everybody,<br>
    I'm currently struggling with the following problem - I have ultra light, regular and ultra bold and want to interpolate them in Fontlab  MM space, so I could create an extensive family. As it seems, Fontlab MM space does not allow for the use of intermediate design (Normal) to be place between the two masters - ultra light + ultra black. (or am I mistaken?) </p>
    <p>So that leaves me with two choices:<br>
    1) to keep two MM files with light - normal and normal - black interpolations and constantly troubling about consistency<br>
    or 2) use two weight axis in same MM font and do mind-bending slider-switching so I could achieve tri-master interpolation in four-master space ?!?</p>
    <p>The discussed type family is still in design stage and  I have developed a habit to work/design in MM space, so what should I do... anyone wiling to share some experience, workaround or .. call it trick... how tri-master interpolation could be made possible in Fontlab?</p>
    <p>Thank you in advance!</p>
