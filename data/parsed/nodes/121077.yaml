    html: |-
      <p>I agree that finding all the characters in single typeface is unlikely—very likely a custom bit of typography.</p>
      <p>Futura Condensed Oblique, with the substitution of the same typeface’s non-condensed |O|, gets you most of the way.</p>
      <p>For the |S|, I'd say the one from this typeface is a close match:<br>
      <a href="http://www.myfonts.com/fonts/latinotype/uomo/condensed-italic/" title="http://www.myfonts.com/fonts/latinotype/uomo/condensed-italic/">http://www.myfonts.com/fonts/latinotype/uomo/condensed-italic/</a></p>
