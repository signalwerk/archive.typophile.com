  html: <p>What is the correct way of emphasizing (with italics) a word followed by a punctuation mark like ,!?)" ? Do you emphasize it including the mark or only the word itself?</p>
comments:
  - id: 434674
    user: 14722
    date: 2010-10-17T10:44:00
    date_raw: 17 Oct 2010 — 10:44am
    votes: null
    html: <p>I generally italicize/embolden punctuation as well. This is something you should discuss with the editor of the text because it can get weird with lots of quotations or complex citation system.</p>
  - id: 434677
    user: 46071
    date: 2010-10-17T11:03:00
    date_raw: 17 Oct 2010 — 11:03am
    votes: null
    html: |-
      <p>It depends on context and meaning. For example, there is difference between:<br>
      <em>Should I emphasise everything?</em> – and – Should I emphasise <em>everything</em>?</p>
  - id: 434692
    user: 56900
    date: 2010-10-17T12:45:00
    date_raw: 17 Oct 2010 — 12:45pm
    votes: null
    html: |-
      <p>I meant rather something like the second example. In this case should I emphasise also the comma?</p>
      <p>I emphasised <em>everything,</em> but I wasn't sure.<br>
      I emphasised <em>everything</em>, but I wasn't sure.</p>
  - id: 434693
    user: 17101
    date: 2010-10-17T13:05:00
    date_raw: 17 Oct 2010 — 1:05pm
    votes: null
    html: <p>I've learned to italicize the punctuation mark - not because it is a crucial part of the emphasis but because it shouldn't draw attention to itself (like your second comma example does). I'll obviously reconsider if italicizing draws more attention to it.</p>
  - id: 434694
    user: 6470
    date: 2010-10-17T13:06:00
    date_raw: 17 Oct 2010 — 1:06pm
    votes: null
    html: |-
      <p><em>I meant rather something like the second example. In this case should I emphasise also the comma?</em></p>
      <p>Strictly speaking, no: the comma is not part of the expression getting emphasis, but rather a structural element of the entire sentence. However, in some instances an italic comma will fit better than a Roman one so, aesthetically, using the italic comma might look better. If the project is not academic in nature, I would go with what looks best, rules be damned...</p>
