    html: |-
      <p><em>I meant rather something like the second example. In this case should I emphasise also the comma?</em></p>
      <p>Strictly speaking, no: the comma is not part of the expression getting emphasis, but rather a structural element of the entire sentence. However, in some instances an italic comma will fit better than a Roman one so, aesthetically, using the italic comma might look better. If the project is not academic in nature, I would go with what looks best, rules be damned...</p>
