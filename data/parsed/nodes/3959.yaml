  html: <p>Checked some stuff here and there, but it's quite possible that these are custom drawn. The script is nice, love that hybrid shape on the lowercase "s". The serif reminds me of a bit of <a href="http://www.myfonts.com/fonts/bitstream/windsor/" target="_blank"> Windsor</a>, but serifs at top <i>and</i> bottom of centre  strokes of the uppercase "W" are unusual.</p>
