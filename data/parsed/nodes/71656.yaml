      <p>Blocko is now Corsair. Check out the new PDF in the original post. I've done a lot of work on a many of the previously seen characters, and I've also added a bunch more, as well as punctuation. I haven't done a ton of work with spacing at this point, and no kerning. I'm mainly concerned about shapes, widths, and weights at this point.</p>
      <p>And input is greatly appreciated.</p>
      <p>thanks!</p>
