    <p>If you have a chance, please check out Blocko (not its permanent name) and let me know how things are looking.</p>
    <p>It's a fat sans with some definite Eurostile influences.</p>
    <p>I think it's safe to assume that the B, G, and g need the most work (and you will most likely find more).</p>
    <p>Please excuse my lame sample page.</p>
    <p>thanks!</p>
    <p>Jonathan</p>
