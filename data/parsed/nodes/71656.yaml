    html: <p>I'm not a pro so you might want to forget about this, but the top horizontal stroke of the a (is there a name for that) seems to be a bit to long to me. It's like an overshoot. Because the bowl of the a more round (less squared) than the rest it needs more overshoot. For the 5 I'd try to make the line of the inside of the bowl continue in the vertical stroke next to it.</p>
