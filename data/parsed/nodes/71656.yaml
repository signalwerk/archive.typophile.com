    html: |-
      <p>Nice, I like it.</p>
      <p>Weights of straight strokes in your capitals need attention. The verticals of D and P (and maybe also B and R) are too thin. X, Y, Z are light, lighter, and lightest. Crossbar of H is heavy (match L).</p>
      <p>The lowercase is in good shape, even the g, I think. It might be nice for the crossbar of the f to be a little heavier, but not necessarily. I like the short ascender of k.</p>
