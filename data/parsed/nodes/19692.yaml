      <p>Assuming it is supposed to read – me dwarsig – it isn’t working, specifically the z just doesn’t read s to me, I can just about buy e=a and m=w. I don’t understand the significance of the rz in merz but the rotation/reflection falls down because the r won’t let you do that. I don’t know if you could find a better typeface, but I suspect a simple monoline would perform better something like <a href="http://www.myfonts.com/fonts/madtype/variable/">Variable</a>. As it stands I am not getting any sturdy tradition, let alone nimbleness.<br>
      Tim</p>
