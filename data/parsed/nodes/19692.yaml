    <p>Hello everyone,</p>
    <p>I’m in my first year graphic &amp; typographic design at KABK, and I’m working on a project which is to develop my own logo.</p>
    <p>I want it to have a very actual look, yet with a good sense of tradition. Nimble yet sturdy.</p>
    <p>I found the Silom a quite appropriate typeface, very ’electronic’ but quite round.</p>
    <p></p><div class="imageWrap"><img src="/files/medwarsig_5481.jpg"></div><p></p>
    <p>What do you think of it?</p>
