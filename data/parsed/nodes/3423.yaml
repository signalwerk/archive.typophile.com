    html: <p>The Gutenberg Bible was in Latin, and didn't have any Roman text mixed with the blackletter. <br> <br>The typography looks plausible to be the 1611 King James Bible, though I've never seen a sample, so I don't know. It's hard for me to tell from the small size, but the Roman font and the wording both seem a little late to be from the early 1500s (first English bibles start around 1526). I'm thinking somewhere between 1570 and 1800. <br> <br>But must get back to work.... <br> <br>T</p>
