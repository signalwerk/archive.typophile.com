      <p>Others who frequent this forum are better qualified to identify the original woodtype fonts used on this poster. </p>
      <p>Some digital options for recreating the central type:<br>
      <a href="http://www.typography.com/fonts/champion-gothic/styles/" title="http://www.typography.com/fonts/champion-gothic/styles/">http://www.typography.com/fonts/champion-gothic/styles/</a> [Lightweight]<br>
      <a href="http://www.myfonts.com/fonts/flat-it/rama-gothic/" title="http://www.myfonts.com/fonts/flat-it/rama-gothic/">http://www.myfonts.com/fonts/flat-it/rama-gothic/</a> [Heavy]</p>
      <p>The look of the type at the top and bottom of the poster could also be replicated using Rama Gothic Condensed Bold, Champion Flyweight, or one of the following:<br>
      <a href="http://www.myfonts.com/fonts/itc/roswell/" title="http://www.myfonts.com/fonts/itc/roswell/">http://www.myfonts.com/fonts/itc/roswell/</a> [Standard Three]<br>
      <a href="http://www.typography.com/fonts/knockout/styles/" title="http://www.typography.com/fonts/knockout/styles/">http://www.typography.com/fonts/knockout/styles/</a> [46 Flyweight]</p>
