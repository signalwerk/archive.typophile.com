    html: |-
      <p>England 1908 -- the _1D_ means one pence and confirms the location.<br>
      This would have been a large scale font, perhaps wooden, inspired by the model of the Grotesque types that had been in use since Thorowgood's Grotesque of 1832. Stephenson Blake's various Grotesque font's may have been the source.  Grotesque No. 9 <a href="http://www.identifont.com/show?62O">http://www.identifont.com/show?62O</a>  is similar to the main heading, but is slightly too wide.<br>
      The original specimens of the grotesques released by Stephenson Blake were used by David Berlow and others to produce a series for Font Bureau called Bureau Grot. <a href="http://www.identifont.com/find?font=Bureau+Grot&amp;q=Go">http://www.identifont.com/find?font=Bureau+Grot&amp;q=Go</a><br>
      But none of these is an exact match.<br>
      For the light weight condensed type you might consider the rather similar, but slightly too wide, DTD Silvertone Woodtype<br><img src="/sites/default/files/old-images/DTDSilvertoneWoodtypeAsVOTES_6699.gif][img:sites/default/files/old-images/DTDSilvertoneWoodtypeAsMRS_6526.gif"><br><a href="http://www.myfonts.com/fonts/thometz/silvertone-woodtype/">http://www.myfonts.com/fonts/thometz/silvertone-woodtype/</a><br>
      which is based on Ludlow 6-EC Gothic Extra Condensed woodtype.<br>
      Sorren Bold, a neo-grotesque from 2012, is surprisingly close and would be my recommendation as a substitute <img src="/sites/default/files/old-images/SorenBoldAsVotes_4995.gif][img:sites/default/files/old-images/SorenBoldAsMRS_4960.gif"><br><a href="http://www.myfonts.com/fonts/reserves/sorren/">http://www.myfonts.com/fonts/reserves/sorren/</a><br>
      Still looking for a closer match to _WELCOME CHRISTABEL PANKHURST_.<br>
      Don</p>
