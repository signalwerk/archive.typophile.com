      <p>Reforma Grotesk Bold,  based on the letterforms of Russian pre-1917  hand composition typefaces<br><img src="/sites/default/files/old-images/ReformaGroteskBoldAsWELCOME_4683.gif][img:sites/default/files/old-images/ReformaGroteskBoldAsCHRISTABEL_5698.gif][img:sites/default/files/old-images/ReformaGroteskBoldAsPANKHURST_3791.gif"><br><a href="http://www.myfonts.com/fonts/paratype/reforma-grotesk-bold-e/">http://www.myfonts.com/fonts/paratype/reforma-grotesk-bold-e/</a> is a very good match for the letterforms.<br>
      EDITED:<br>
      But it is too light.<br>
      Don</p>
