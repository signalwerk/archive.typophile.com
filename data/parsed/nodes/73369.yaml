      <p>Thanks, that would be appreciated.</p>
      <p>"White Out" is BudHand.</p>
      <p><a href="http://www.dafont.com/budhand.font?nb_ppp=50&amp;text=White+Out" title="http://www.dafont.com/budhand.font?nb_ppp=50&amp;text=White+Out">http://www.dafont.com/budhand.font?nb_ppp=50&amp;text=White+Out</a></p>
      <p>"Penn State" is, judging by the registered trademark symbol, a custom job. However, GreyWolf has a dingbat of the logo.</p>
      <p><a href="http://www.fontspace.com/greywolf-webworks/big-ten-mania" title="http://www.fontspace.com/greywolf-webworks/big-ten-mania">http://www.fontspace.com/greywolf-webworks/big-ten-mania</a></p>
      <p>Though it is not the font used for the Penn State logo, Gerald Gallo's Display Intense is similar, and with some modifications could approximate the letterforms in the Penn State logo.</p>
      <p><a href="http://new.myfonts.com/fonts/gallofonts/display-intense/" title="http://new.myfonts.com/fonts/gallofonts/display-intense/">http://new.myfonts.com/fonts/gallofonts/display-intense/</a></p>
