      <p>I'm having a hard time understanding what sine waves have to do with investment consultancy. That said, I wouldn't have ever thought of anything like that graph from your icons. If that means that you took it that much farther beyond your inspiration then good. But don't forget to get back to your brief and ensure you are communicating the core message of the brand. What I am seeing in 01 is arrows pointing back and forth, a kite, skewed bowtie, triangles intersecting, and a graph depicting a slow rise followed by a sharp drop and another slow rise. </p>
      <p>Have you tried to make a W from the letters IN. Seems like a simple type solution and possibility a allusion to WIN. It could easily take a form much like your graph ideas.</p>
