      <p>To: Gräfenberg </p>
      <p>Thank you very much for comments. I have to admit I see some points you mentioned. Some letter spacing is wrong (I will take care of all details once I am close to final version). I know it s not an excuse. </p>
      <p>03.1, 03.2 and  cosists of elements representing rise as well as letters I and W. But it s prob too many combinations. 03.1a should stand for some sort of securement. So that s to explain. </p>
