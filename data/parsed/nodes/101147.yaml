      <p>The solid versions certainly seems more dependable. I wonder why you began exploring the triangles as movement. It also paints a nice story of zig and zag ... zig when then market zags etc ... though I don't know if that's wise investment advice, it seems like a nice story.<br>
      I also wonder why you decided to switch to outlined versions?  They seem to begin suggesting a loop. I understand the infinity symbol is a strong icon, but it is lost in this approach.</p>
      <p>Pretty much getting:<br>
      smart, modern, serious</p>
      <p>A little bit of:<br>
      trustworthy, luxurious</p>
      <p>Not really getting:<br>
      young, openmined, dynamic</p>
