    <p>Hi everyone, </p>
    <p>I am making a logo for a friend who is starting a business in investment consultancy. They are two partners. Young people, smart and openmined.</p>
    <p> They wanted to get dynamic, modern but serious looking at the same time. Also trustworthy with elegant or luxurious touch. They don t want any tag line explaining the business which I think is a shame.</p>
    <p>Def. not an easy task. I ve been busy with it for 3 weeks. All should be ready in a week and I am just stuck with too many ideas! All is explained in the entouchments. Thank you for feedback! A d really appretiate it.</p>
    <p>Kristin</p>
