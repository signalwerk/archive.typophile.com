      <p>The second image appears to have a graph with a downward trend. Certainly NOT the image you want to present to potential investment customers. The logo graphic in the first one has no connotations at all - it's just a pretty picture, which shouldn't be where it is. Instead, it should be vertically centered with the text, or else (with some resizing, possibly) be over the text, left aligned, or below the text, right-aligned.<br>
      - Herb</p>
