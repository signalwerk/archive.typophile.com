      <p>My opinions for what they’re worth.</p>
      <p>The graphical elements in <strong>03.1</strong>, <strong>03.2</strong> and <strong>03.1a</strong> do nothing for me. I can’t figure what they’re supposed to represent — stylised |W|? in which case what's with <strong>03.1a</strong>? — and I don’t think any of them hang together particularly well.</p>
      <p>Question: any specific reasoning behind not making the graphic a more direct representation of that graph? Straight-line elements only for some reason?</p>
      <p>As far as the type goes, I much prefer that in <strong>02</strong> over that in <strong>01</strong>. I think it just looks more dynamic here however I’m not sure if that’s due to an innate preference for points on the |W|, but the wider spacing is definitely part of it; I do prefer the type in <strong>03</strong> over <strong>01</strong> for this reason. </p>
      <p>Just to mention, the graphic in <strong>01</strong> (and <strong>01.1</strong>, which I prefer) may have unintended nautical associations for some viewers.</p>
