  html: |-
    <p>Ok, so it is that inevitable time in every brand's life when it must be made into a website.</p>
    <p>In this case the printed materials would use Gotham Narrow as a body copy font. The question is, which is more like Gotham Narrow: Tahoma or Verdana, and why?</p>
    <p>I have adjusted size and tracking to get all three into the same basic space and configuration. Please forgive any little issues. </p>
    <p>I am eagerly awaiting interesting comparative notes. Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypefaceComparison_6347.jpg"></div><p></p>
