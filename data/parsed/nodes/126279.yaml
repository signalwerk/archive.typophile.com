    html: <p>You've got a good start. I'd suggest breaking out of some of the more rigid modularity; the letters aren't going to feel so stiff if they're less "perfect." Also watch out for optical correction; many of your round letters look lighter than your rectangular letters — this is especially apparent in the NO pairing. I actually like the "clumsiness" of the capital G — it's less rigidly geometric than the other letters.</p>
