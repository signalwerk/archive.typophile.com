      <p>There are some elements here that reminds me of Art Deco (or perhaps late Art Nouveau – not the overly curly style, but the straighter variants such as ITC Anna (<a href="https://www.myfonts.com/fonts/itc/anna/">https://www.myfonts.com/fonts/itc/anna/</a>)). You can press that yet further by making the /O and /Q distinctively egg-shaped. Slightly curving the legs of /K and /R would also move you more into that direction, if that's where you want it to go.</p>
      <p>I'd love to see a slightly lighter variant as well!</p>
