    html: <p>Hi Keith, what I mean is that right now you're all squares and circles, and if you ease up on that rigid geometry a bit your letters will feel a little more comfortable. Futura works because it's *not* actually perfectly geometric; it makes allowances for the human eye. Some of your joins on letters like the m and n are really heavy optically; see if you can give them some air by deviating from your geometry a bit.</p>
