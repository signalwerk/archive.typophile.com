    html: |-
      <p>Hi<br>
      Nice looking typeface. It has a sort of wood type thing to it.<br>
      Like others have said maybe slightly work on softening up the geometric feel. Maybe by adding some contrast and varying the widths of the strokes (slightly) based on a broad nib pen rule.<br>
       I would also suggest you make some optical adjustments. For instance:I think you need to add some overshoot to the round shapes (G, O, Q, U, b, c, o ... etc. )<br>
      I do see some overshoot in the lowercase o and on the uppercase C but the rest needs it as well.<br>
      Also "symmetric/mirrored" shapes such as the S, s, Z and z would probably benefit from enlarging the bottom part a bit to balance the letters more. Right now the top and bottom parts are identical in size and that kind of makes the top look bigger/heavier.</p>
