    html: <p>Hi Theunis - what you say sounds logical and I did start out with a flattish topped /G, but because it's a much broader character than the /C and /S it just didn't look right.  That's how I came up with this rather 'clumsy' /G in the first place!  Some of you claim to like it, and it's beginning to grow on me too.  A touch of overshoot should solve the 'crouch' problem.  But thanks again for your thoughts.</p>
