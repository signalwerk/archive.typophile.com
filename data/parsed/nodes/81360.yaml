    html: |-
      <p>Arguably the most prestigious digital typeface around given how the EULA reads: </p>
      <p><cite>You agree not to give or allow the Typeface to be used by non-Yale individuals or organizations for non-Yale purposes.</cite><br>
      <a class="freelinking external" href="http://www.yale.edu/printer/typeface/terms.html" rel="nofollow">http://www.yale.edu/printer/typeface/terms.html</a></p>
      <p>A little while ago I did a survey of the fonts used in a number of prominent journals. The majority of them use TNR, though Harvard uses Old Style Seven.</p>
      <p>A fun fact about Penn's LR (I'm a 1L here): we're using fake small caps and system Baskerville. The right font for a school founded by Ben Franklin—just a little botched in execution.</p>
