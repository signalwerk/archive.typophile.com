      <p>Matthew — </p>
      <p><cite> &gt; It looks like a combination of Dante, Bembo, and Galliard, but it's not any of those.</cite></p>
      <p>For good reason. This is the custom face that Carter drew for the Yale identity, based on their long association with Bembo.</p>
      <p>I can’t remember what he called it. Might just be “Yale” something-or-other.</p>
