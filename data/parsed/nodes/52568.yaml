  html: |-
    <p>I'm getting really bored of the overuse of Avenir. In an effort to not use Helvetica, people have been trying to show how Type-smart they are and use the superbly designed geometric Avenir instead of Helvetica. And now it's overused.</p>
    <p>Like the good song thats played over and over and over on the radio until you hate it. Poor Avenir. I did love you.</p>
