      <p>Avenir is an excellent font and so is Myriad, however I prefer most if not all of Adrian Frutiger fonts.<br>
      I see allot of Helvetica usage these day's, it's so overused.  However it remains as one of the top fonts no matter how much it's been used.  Gotham is also great, however it is not as over used as the fonts mentioned above.</p>
