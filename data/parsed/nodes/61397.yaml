  html: |-
    <p>The Artvod font family is a graduate project of Dusan Jelesijevic on the topic Museum of Digital Art. The whole project included a 15 minute interactive presentation through building of Artvod Museum, consisting of 15 posters and the font in two weights (Regular and Bold).</p>
    <p>The Artvod font family also appears in IndexBook’s book Homage of Typography by Pedro Guitton.</p>
