    <p>Some time ago I made a Open Type font family, regular, italic, bold and bold italic. When I export a pdf from InDesign CS2 everything looks ok on screen, but when I print the pdf with Acrobat 7.08 to our Canon C2620 color printer I get a strange mix-up of italic and regular glyphs. It’s not in a random way, the scheme is as follows:</p>
    <p>For Regular I get this:<br>
    ABCDEFGHIJK<em>LM</em>NOPQ<em>R</em>STUVWXYZ<br>
    <em>abcde</em>fghij<em>klmno</em>pq<em>r</em>s<em>tu</em>vwxy<em>z</em><br>
    1234567890</p>
    <p>Same result with italic:<br>
    ABCDEFGHIJK<em>LM</em>NOPQ<em>R</em>STUVWXYZ<br>
    <em>abcde</em>fghij<em>klmno</em>pq<em>r</em>s<em>tu</em>vwxy<em>z</em><br>
    1234567890</p>
    <p>Bold behaves as it should:<br>
    <strong>ABCDEFGHIJKLMNOPQRSTUVWXYZ</strong><br>
    <strong>abcdefghijklmnopqrstuvwxyz</strong><br>
    <strong>1234567890</strong></p>
    <p>Bold Italic behaves like regular and italic:<br>
    ABCDEFGHIJK<em>LM</em>NOPQ<em>R</em>STUVWXYZ<br>
    <em>abcde</em>fghij<em>klmno</em>pq<em>r</em>s<em>tu</em>vwxy<em>z</em><br>
    1234567890</p>
    <p>One of our printshops had similar results, that’s the reason I jumped in and started to do some testing. I observed the following:<br>
    Printing the doc straight from Indesign CS2: OK, results as you should expect.<br>
    Exporting the doc from InDesign CS2 to pdf, and print that with Acrobat 7.08 to our Canon Color printer: NOT OK, see above.<br>
    Exporting the doc from InDesign CS2 to pdf, and print that with Acrobat 7.08 to our Canon B/W non PS-printer: OK<br>
    Exporting a similar testdoc with InDesign CS and print that with Acrobat: OK<br>
    Distilling the InDesing CS2 doc and print that with Acrobat: OK<br>
    Printing to pdf with Ghostscript: OK</p>
    <p>I changed the font subsetting from 100% to 0%, no effect. All four styles have unencoded glyphs in the private use area, but I can’t see the relation with this strange behaviour. If I print to file with the canon printer and open the postscript dump, I can’t see anything strange (I am not a PostScript expert however). This postscript file will distill perfectly.<br>
    It all hints at an encoding issue but I can’t see why yet: the characters are in place, it’s the glyphs that are mixed up. Maybe an internal naming issue? The fonts were originally created with Fontlab 4.6, generating again with Studio 5 gave the same results.</p>
    <p>Anybody any thoughts on this one?</p>
    <p>Best regards<br>
    Paul</p>
