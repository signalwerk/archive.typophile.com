    html: |-
      <p>Problem solved:<br>
      It appeared some of the fonts shared the same "Type 1 Unique ID number". Those id's (remnants of the original Type 1 fonts) were originally unique for each font, but somehow they must have gotten mixed up in Fontlab, but how, I truly don't know. A slip of the (Wacom) pen I guess.<br>
      Anyway, this is easy to fix, I just removed them (Adobe doesn't seem to use them as well). But why the described problem shows up under the given circumstances (exported CS2 pdf), that's what I'd like to know.</p>
      <p>Thanks<br>
      Paul</p>
