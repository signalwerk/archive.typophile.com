    html: <p>Paul, the issue sounds like one of encoding and Unicode indexing. First off, make sure that all of your glyphs have the correct Unicode index, and that all PUA-codepoint glyphs have the same index across all 4 fonts. Then, before generating, switch all fonts to Codepages view, and choose the MS Windows 1252 Western (ANSI) codepage. (After much trial-and-error, selecting this codepage results in correct behaviour on both Macs and Windows computers.)</p>
