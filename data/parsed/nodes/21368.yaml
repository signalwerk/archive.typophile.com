    html: |-
      <p>Village:<br>
      I usually apply Fontlab's default encoding, switching to ANSI doesn't change the erratic behaviour. regarding the use of PUA glyphs I believe there is some debate whether or not to apply them. In the original fonts, generated with FL 4.6 all PUA glyphs had PUA unicode entries, stripping them in Fontlab Studio 5 made no difference. Anyway, like I said, the characters are in place, there seems to be some strange interaction between the fontstyles. If there would be a real problem regarding encoding, it doesn't explain why all pdf files I create will print OK, <strong><em>except</em></strong> for the one I export with InDesign CS2. To add to the confusion, some further tests showed that point size also makes a difference in the kind of behaviour!<br>
      To be continued<br>
      Paul</p>
