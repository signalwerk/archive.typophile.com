    <p>Seeking feedback on an article I wrote about a word illustration challenge: how to express the meaning of EDIT?  Some questions addressed in the article are: How to superimpose two letters while maintaining the legibility of both?&nbsp; What parts of a letter can be concealed while retaining the letter's visual identity?&nbsp; There are 57+ illustrations of my steps toward a solution to the challenge.</p>
    <p>Here's the link: <a href="http://rudiseitz.com/2012/12/16/wrestling-words/" title="http://rudiseitz.com/2012/12/16/wrestling-words/">http://rudiseitz.com/2012/12/16/wrestling-words/</a></p>
    <p>I'm very interested in 1) comments on what you found interesting or provocative so I can concentrate on those points in future work,<br>
     2) suggestions for improving the article (things I've overlooked, things that aren't clear, mistakes, etc.),  3) any references to articles or papers that address similar topics.  (And, if anyone else is inspired to devise their own solution to the challenge, that would be great as well!) </p>
    <p> As a mostly self-educated typophile, I'm glad to join this forum and am looking forward to learning from the community.</p>
    <p>-Rudi</p>
