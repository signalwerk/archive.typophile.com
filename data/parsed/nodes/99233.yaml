      <p>Chris, you asked another question--how to enter the irony mark on a Mac.  I see you found a way.  For anyone else interested, the easiest way I know is copying and pasting the character from somewhere else.  You can also do CMD+OPTION+T to get the Characters menu -- you'll find it under Punctuation, but (for me at least) it doesn't show up at the top with the other question-mark-like symbols--it's near the dotted "therefore" symbols.  You can also search for Unicode character 2E2E.  </p>
      <p>Since I started experimenting with the irony mark, I've learned that it doesn't render properly in many current browser/platform configurations.  I just posted an "Irony Test" so you can see if it's rendering in yours: <a href="http://rudiseitz.com/2013/01/04/irony-test/" title="http://rudiseitz.com/2013/01/04/irony-test/">http://rudiseitz.com/2013/01/04/irony-test/</a></p>
      <p>Moderators -- should we move this to a different thread?  I've had no takers so far re: my original question, but I'm sure there are some folks around who'd like to discuss irony punctuation.</p>
      <p>This is a related typophile thread from 2006-7: <a href="http://typophile.com/node/28817" title="http://typophile.com/node/28817">http://typophile.com/node/28817</a></p>
