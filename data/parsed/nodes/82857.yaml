    <p>Hi, </p>
    <p>I really like the Felix Titling font, I want to use it on a logo I am designing but I also wanted to use lowercase letters, but Felix Titling only has uppercase.</p>
    <p>Does anyone know of any similar fonts that also have a lowercase? Or can anyone recommend any stylised Serif fonts that they like to use for logos?</p>
    <p>Thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/FelixTitling_4815.jpg.gif"></div><p></p>
