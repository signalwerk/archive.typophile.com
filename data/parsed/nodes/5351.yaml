    html: <p>Hi, Hrant. <br> <br>I've come back. <br> <br>"Who was more/less civilized, the American Indians, or the invading Europeans and settling Americans?" <br> <br>The American Indians had their words, their laws and their "writting". That's American Indians Civilization. <br> <br>I think it's very easy to forget that we, europeans, were invaded a lot of times, and with every invasion a lot of important things were completly lost. <br> <br>Iberians, for instance, had their words, their laws and their writting. That was, or is, Iberian Civilization. You can see some of its productions in archaeological museums. <br> <br>Every cultural environment has its own laws and any individual inside this environment knows she or he gets in a bad situation if she or he forget that. <br> <br>By the way, I forgot the Berne Convention in my previous post... <br> <br>jmc _=+</p>
