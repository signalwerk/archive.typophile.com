    html: |-
      <p>I think it’s easier to pair DIN with a slab or serif than another sans. Bembo is a bit too humanist maybe and Gotham not a good match, no. Try more squarish, rational typefaces. Republic, Ibis, Adelle, Marconi or Melior come to my mind.<br>
      <a href="http://myfonts.us/td-dUWl0c/?refby=i" rel="nofollow">Search for squarish serifs on MyFonts.</a></p>
