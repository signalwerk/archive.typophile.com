      <p>Nice! Just a few remarks:</p>
      <p>- The small block on letters like a, y, e, z, looks uncertain. Either do something daring with it, or get rid of it. The terminals on letters s, c, r, k, x are much more attractive, so I'd keep those.<br>
      - I think it would make more sense to make the left part of e and c like the left of d.<br>
      - I would like to see the right bottom part of g and y, similar to the right bottom of j.<br>
      - x is too wide<br>
      - J and L are too wide.<br>
      - Spacing/kerning is too tight.<br>
      - The dot on the i and j is quite close to the stem now. Perhaps make it a bit flatter, to create a bit more white.</p>
      <p>Keep it up! Cheers, jasper.</p>
