      <p>Hi Sean. Welcome to typophile!</p>
      <p>If you ask me, this is more than a 'nice exercise'. This has serious potential. Something I rarely see with newcomers typophile, so you must be talented. I absolutely hate All monospaced font, except yours. I don't know how you've done it, but you did a great job.</p>
      <p>Now, enough for the praising part. First of all, ask yourself this. Do you want a monospaced font, or a font that LOOKS like a monospaced font. The latter would involve optical adjustments in width and spacing, which will make it look more 'monospaced', but, when a line is typed underneath a previous line, they won't align.</p>
      <p>An actual monospaced font has it's charms, and is closest to what you've already made, so I'd go for it.</p>
      <p>I like your idea to make a high-contrast version as well, but it inevitably causes an uneven 'colour'. I'd stick with it though, because it's something I haven't seen before. Originality is always good, bodoni doesn't have an even colour either :-)</p>
      <p>High-contrast feedback:</p>
      <p>[1] First of all, I think your high-contrast version would look better if you'd stick to the shapes of the low-contrast version. (Q U J P B)</p>
      <p>[2] For /C E F L S/ are all too light. I suggest to attach a small square serif-like thing to the top and bottom horizontal bar, too add some colour. It's not THE  answer, but it's worth trying IMO.</p>
      <p>[3] For /Z/, also too light, I suggest a more daring solution. Just forget about the grid and give the diagonal the same OPTICAL thickness as the stem (vertical part) of I. Also remove the short vertical bits, first. Another solution for /Z/ would be to go with [2].</p>
      <p>[4] To make this into a functional family, you want the low-contrast and the hihg-contrast version to look like they belong together. Although the /O/ in low-contrast, technically doesn't have a horizontal bit in it, it does appear to have a horizontal bit. Thus, the high-contrast /O/ should have a horizontal bit as well. This means that the diagonals in high-contrast /O/ will be shorter. Thus, the diagonals in /A C Q U E F J P R D S G B/ should be shorter as well. </p>
      <p>Work step by step. Doing all this at once will give you headaches. Don't blindly do as I say, but at least give it a try. Always save backups of old versions. Good luck.</p>
      <p>Cheers,<br>
      Jasper de Waard</p>
