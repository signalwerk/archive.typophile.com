    html: |-
      <p>Those are nice starts, but with capitals you quickly run into the system. It's a good training ground, so go slow, try different contrast systems, try to look into lower case. Try to find the contrasts which will turn from display to legible, how thick can you make the high contrast and how thin? Try to enlarge the grid and have a look what kind of shapes you can make.</p>
      <p>In all, when learning, try to have fun first, and only focus on the more theoretical parts later. I must say that handwriting route isn't bad, but this serves just as well.</p>
      <p>So keep on going!</p>
