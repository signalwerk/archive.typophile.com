      <p>Hello everyone,</p>
      <p>Managed to make some updates to the drawing.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ss_1_5685.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/ss_2_6111.png"></div><p></p>
      <p>As before, looking forward to your comments and suggestions, particularly ‘T’, and the little serif-y strokes on ‘i’, ‘j’, ‘l’? I think the main challenge was in trying to balance the space around each letter caused by the rigid grid, but not sure if that created inconsistencies across the entire set.</p>
      <p>@Jasper I introduced a thick diagonal as suggested, along with the little serifs. Is there an identity crisis happening? :D And due to the introduction of the lowercase, I guess mono-spaced is not ideal for now?</p>
      <p>@hrant I have not ventured onto the layering approach yet. Going slow, but hope to get there :)</p>
      <p>@Arthus Thank you. Yes, with this update, I explored the lowercase, and sort of “broke” the grid in a lot of places. Hope this is an improvement!</p>
      <p>Blessings,<br>
      Sean</p>
