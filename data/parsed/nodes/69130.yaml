      <p>Incidentally, the first article you linked talks about the redesign of România Liberă, a well-known paper in my native country. I'm currently abroad, so I cannot assess the redesign firsthand, but from the photographs on Mr. Garcia's site, it's not "stellar" work by any means (especially considering some of the other work produced by this agency.) Alas, Romania seems to be condemned to missed opportunities. </p>
