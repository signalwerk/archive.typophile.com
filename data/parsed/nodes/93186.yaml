      <p>Aah, i love feedback.<br>
      You are right, this is just the basis of something that CAN grow larger, having the sufficient time and sources. In photography it is often said, that the tools you need to make something possible, are the ones that you already have. Its a nice sentiment, but you can't work on natural light all the time, a blunt model and an empty room. You can't tell a whole story with only a white background. Then again, that might be the challenge.</p>
      <p>"Would it suffice to make a visual story out of its sources or should the time and requirements it was actually designed in/for be part of it as well?" -- I had only 3 days to get in the studio, get into studio lighting and 1-2 hours with each model. I had objects around as a plan B with which I wanted to portray the time Gotham was build for.. but you can't do it any justice in a rush. Again, I second your "this is only a basis" comment.</p>
      <p>"I'm curious what the restrictions are exactly. What would/could a type catalog without type look like?" -- I might just dig into this more carefully and with a clearer view (and not thinking about university deadlines). I think it is important to make such a thing because we can understand something better when we are able to relate to it meaning, as graphic designers we could find the right type for something if it would be a lot more tangible to our nature.</p>
