      <div class="comment-spam-body"><p>I would be curious to see a whole series indeed. Right now I think the choice of typeface serves as a nice basis for photography, but it's not like without a doubt these photos say Gotham. It's perhaps representative of a certain time and culture, but I don't think you could represent all typefaces this way. The photos of Futura would probably look more German and perhaps Bauhaus-inspired, but the time is about the same. When you've done Gotham and Futura, what would a third typeface that draws inspiration from the same sources look like? What about typefaces like Erbar, Nobel and Tempo? What about Verlag and Neutraface? Would it suffice to make a visual story out of its sources or should the time and requirements it was actually designed in/for be part of it as well?</p>
      <p>Some typefaces look subtly different so it may be a lot more challenging to translate that to photography. On the other hand, with photography you can visualize a back story which is a lot harder to do with just a typeface. Because the typeface is hard to translate into a visual story, I'm curious what the restrictions are exactly. What would/could a type catalog without type look like?</p>
      </div>
