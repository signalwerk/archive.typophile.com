      <p>Is there something wrong with today’s type designers, that you don’t think our work is capable of representing our age?</p>
      <p>Futura was designed as “the typeface of our time” in the 1920s, as an antidote to the historicism then prevalent in the graphic arts.</p>
      <p>Presently, too, we have a lot of historicism, namely a nostalgia for “mid century modern”.</p>
      <p>However, if you judge the tenor of the times by the work of contemporary type designers, rather than the types that are popular with graphic designers (which includes many old faces such as Helvetica and Futura), I think you will ﬁnd that some of us are creating work that addresses today’s issues, rather than those faced by Paul Renner, and such work is more likely to be “Type for our Age”.</p>
      <p>Here is a pioneering recognition by a cultural institution of contemporary (with a slight lag for respectability) type design within the canon of art and design in general:<br>
      <a href="http://www.moma.org/explore/inside_out/2011/01/24/digital-fonts-23-new-faces-in-moma-s-collection" title="http://www.moma.org/explore/inside_out/2011/01/24/digital-fonts-23-new-faces-in-moma-s-collection">http://www.moma.org/explore/inside_out/2011/01/24/digital-fonts-23-new-f...</a></p>
