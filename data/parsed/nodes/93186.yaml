      <p>If you're looking for a sans serif, perhaps Gotham would be a more appropriate choice than Futura. It's a relatively new font that was inspired by fonts like Futura, and was heavily used by the Obama campaign. I also see a lot of corporate use. </p>
      <p>You also might try checking lists of the best-selling fonts from 2011, although the fonts that actually receive the most use are often the old standbys rather than what's hot at the moment.</p>
      <p>&gt; i feel like 2012 is more about colors and having 'fun'</p>
      <p>Design trends are partially influenced by the technology available to graphic designers. I see far less black-and-white because 1) on the internet color doesn't cost more than b&amp;w, and 2) the increased use of digital printing. Also you see color transparency effects everywhere because InDesign makes it easy. In the old days of QuarkXPress (and the early days of InDesign) creating transparency effects was more iffy. You also see more 3D effects with type because it's easier to produce these days, more motion graphics, etc.</p>
