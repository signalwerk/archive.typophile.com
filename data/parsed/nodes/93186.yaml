      <p>I think the typeface of the age we are currently living in is obviously Times Roman.</p>
      <p>It is certainly true that Stone Sans, for example, is a typeface of the present moment. But I don't think we've yet caught up with Futura, let alone Optima - these are still typefaces that, although "dated" in the sense that we can point to the past time when they were designed, still look out of place - and futuristic! - when used for ordinary typographic purposes.</p>
      <p>So the original poster has a legitimate question as to whether or not now is yet the time for Bifur or Futura - but the answer, I think, is no!</p>
      <p>The ages of typography move slowly; we have gone from the Age of Caslon to the Age of Scotch Roman (and Phemister's Oldstyle) to the Age of Century Expanded (and Linotype's Number Eleven, and Caledonia, and Baskerville) to the Age of Times Roman.</p>
