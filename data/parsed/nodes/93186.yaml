    <p>Hello Everybody,</p>
    <p>Short: would you think a Sans-Serif, Futura, Bifur Type describes our time today? </p>
    <p>Explanation:<br>
    I have a question which I would be very grateful if you could give me an answer to, a tip, your point of view. I am about to do my Bachelor this semester and I would like to do a Font Specimen 'in/with' pictures i.e involving human faces/models. It should be something like bringing fashion photography and typography together, on both booklet and poster.</p>
    <p>I wanted to do something for the age, like portraying a feeling of today, like contemporary people.<br>
    For me - and of course for all of us I can guess - Types are more than just Fonts, forms and words put together, there is a soul, a character behind and there is only one accurate or the right one for a topic.</p>
    <p>I was guessing that, seeing as the world is today, we were going back to some sort of Bauhaus when it comes to graphics and architecture - design in general. I see more and more a going-back-to-simple-shapes aesthetic, geometric forms are everywhere. I see it more often in combination with a Black and White theme, and although i feel like 2012 is more about colors and having 'fun' (when it comes to fashion, too) you can never go wrong with black and white and some sort of mystery/dark look to attract attention or sell (think also drama/exagerated poses in fashion, Hollywood, raw european films, books about burn out - thinking also that everything is part of a cycle and everything infuences one another in society...)</p>
    <p>So would you think a Sans-Serif, Futura, Bifur Type describes our time today? </p>
    <p>Much appreciation if someone takes the time to read and share thoughts.</p>
    <p>Kind regards!<br>
    R.V</p>
