      <p>Yes, that’s the kind of thing I had in mind when I said “address today’s issues”.</p>
      <p>Speaking of Futura, it is considered iconic of its era, yet during the most famous years of the Modernist movement, Modernism was a cultural sideshow. During the 1920s, the dominant style of design was historicist, and the most used types were such as Kennerley, and, still, the plain early 19th century Roman we now call Scotch. (I’m not quite sure where the Art &amp; Crafts/proto-modernist Cheltenham ﬁts in.)</p>
      <p>There are at least three ways a type can represent its age:</p>
      <ol>
      <li>Address contemporary issues</li>
      <li>Popular in the dominant style: revival/older design</li>
      <li>Popular in the dominant style: contemporary interpretation</li>
      <p>For today:</p>
      <ol>
      <li>Verdana</li>
      <li>Helvetica</li>
      <li> Gotham</li>
      <p>Of course, one has to decide how long an age is…</p>
      </ol></ol>
