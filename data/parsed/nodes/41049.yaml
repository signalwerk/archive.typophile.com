    <p>Hi guys,</p>
    <p>A while ago I mentioned a little book I designed for an MA project on the history of writing. Here is the finished thing (which unfortunately I could not complete in time for the final assessment). The idea, originally, was to design a map to guide type designers through the British Museum to every piece of writing in order for them to get inspiration for typefaces based on historical records. To get it into context:</p>
    <p>The project was about the evolution of writing from the very beginnings up until the present days. I mapped the location and characteristics of all the pieces in the British Museum (the ones I could find) that had some for of writing on them. Once I had all the information, I produced a catalogue, which showed the location, characteristics (origin, description of the subject, classification of the object itself, etc) and chronological order. These lists were then divided accordingly in different scripts. The end result was a 20 chapter book listing all the pieces in the Museum, their location and characteristics and a brief introduction to show the reader how every script works/ed (how the characters evolved, where they came from, the culture they developed from, etc.)</p>
    <p>Ok, enough rambling.</p>
    <p>After the MA, I went back to the British Museum to see what I had learned and went to visit my favourite pieces, copying one character from each. I had LOTS of favourites, but limited myself to five for reasons I won’t go into.</p>
    <p>Hope you like it:</p>
