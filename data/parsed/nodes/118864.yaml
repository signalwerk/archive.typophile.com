    <p>I'm designing a cover for a historical novel about Mary Todd Lincoln that begins after the Civil War (1865) and ends in 1880. I'm searching for a script and companion serif for the title/subtitle that suggests that period. Any suggestions?</p>
    <p>Thanks so much!<br>
    Sandra</p>
