      I've observed this trick in a number of designs. It's as though the sideways flick of the tail starts above the join.<p></p>
      <p>Re the /u/, it's an illusion to do with the transition from curve to straight. The straight section looks as though it's bending right in the middle (blue dots show where I see it waisting inwards). Actually I think a good solution might be to make that stem curve ever so slightly all the way through, and do away with the straight sections.<br>
