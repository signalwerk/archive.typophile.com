    html: |-
      <p>Impressive. First off, study Lexicon. The more I study it, the more I see the brilliance of it. It's also really helping me with my own serif typeface, although I'm wary of getting to close to the design of Lexicon. A few notes:</p>
      <p>- The 'flatness' of your bowls is a bit exagerated, IMO. This causes a few problems: /c and e/ fall backwards, The white notch between the bowl and the stem on the top of /m n p and alikes/ is very small. I'm afraid it might completely disappear when printed with a lower quality of paper/ink/printer. The top of the stem, tilting to the right, only makes this worse. De Does cheated his way out of this problem by making the top of the stem extend (yes, optically) above the shoulder. It looks fine in text, but it's anoying at display size.<br>
      - The serifs on your uppercase could be wider/larger. They're a bit fragile now.<br>
      - The top vertical serif of E looks really small next to Z.<br>
      - Top of A looks a bit weak. Check Lexicon's A.<br>
      - Second stroke in W and /w/ looks too thin.<br>
      - I would like to see a version where the top serif on /i/ is shorter. About half its current length, I'd say. Keep the top serifs on ascenders the same, though.<br>
      - I get the system, but that serif on the very left on /v and alikes/ looks too long.<br>
      - The top counter of /a/ is quite small compared to the very open counter of /e, for example/. Perhaps make the terminal shorter.<br>
      - The bowl of /a/ has a very horizontal flow, compared the the diagonality of the top of /a/.<br>
      - Terminals are inconsistent. Try to get /f c a r y/ to work together a bit closer.<br>
      - /r/ looks a lot like /n/. I would make it join the stem at a much lower point.<br>
      - /g/ is too thin on the top right (just right of the very top).<br>
      - /v/ is wide.<br>
      - That little outward turn on the bottom right of N looks odd.</p>
      <p>It's a very original and functional typeface as it is. As always, take my comments with some salt. You know your shit better than I do ;-) Cheers! jasper</p>
    html_clean: |-
