    html: |-
      <p>It's very well thought out with some clever details and nice proportions. Reminds me more of Trinite than Lexicon. I'd personally suggest the very sharp outstrokes could be bevelled (e.g. on the lowercase /e/ and /t/) but I guess you're liking it really spiky! Also, have you tested the contrast on the actual stock intended? It looks as though overall it might be rather shiny, maybe more like a display cut??</p>
      <p>Rounds/diagonals seem a bit darker than long straights. Look at /c/, /o/ or /v/ next to /l/ or /h/. </p>
      <p>/a/ I'd trim a little off the outstroke, at the notch, so the spur starts a little narrower than the main stroke width. I think Lexicon does that, and yours seems a little like the weight is pulling the stroke down rather than flowing out gently.</p>
      <p>/b/ counter at bottom left looks slightly unresolved? Can't quite tell what the tool is doing, it's continuous but suddenly changing rotation? Or perhaps the pen angle round the bottom left is just too steep?</p>
      <p>/u/ I'm seeing some boning on the left stem.</p>
      <p>/t/ Short?</p>
      <p>Great to see your skill, Frode! I think Gerard would approve :^)</p>
