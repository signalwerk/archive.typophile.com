      <p>R is brilliant. What appened to the upper counter of B?</p>
      <p>Pay a little more attention to stroke modulation and contrast, I'd say. The top of the bowl of /p/ isn't working yet, for example (especially next to /q/). The stroke that goes into the stem is much thicker in q than it is in p. The thin strokes in /x/ are even thinner. </p>
      <p>The top right stroke on the /x/ needs to move a little to the left for it to look like a continuous stroke in text. </p>
      <p>/r/ perhaps a bit exagerated?</p>
      <p>Bottom of stems in /n/ (left) and /q/ and /q/ look a bit helpless. Perhaps a slight angle would help.</p>
      <p>The top counter of /k/ seems quite large.</p>
      <p>Not sure about the figures...</p>
      <p>Nice work!</p>
