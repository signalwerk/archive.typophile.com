    html: <p>quoting someone's instructor <br> <br>"A logo is a good logo if you can draw it in the sand with your toe". (<a href="http://www.typophile.com/forums/messages/29/40717.html?1089984427" target="_blank">http://www.typophile.com/forums/messages/29/40717.html?1089984427</a>) <br> <br>I kind of agree with this, allthough sometimes a logo results in a more complex form, i think  a logo should be a form easily to draw with a bad pencil in a napkin. <br> <br>think about it <br> <br>CG</p>
