    html: <p>Hi glenn <br> <br>i am not usually a fan of a "photographic logo", it always carries a lot of printing dificulties. The leaf concept i like it a lot but i always value more a simplification of it. try working on a simpler version.  <br> <br>Drip Irrigation SYSTEM works for me, try puting the green of SYSTEM a little bit darker. <br> <br>good luck <br> <br>CG</p>
