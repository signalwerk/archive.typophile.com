  html: <p>This is my first post. I'm doing a logo for a drip irrigation company in Sydney and this is what i've done so far. They specialize in irrigation for plants not for lawns. There's next to no budget which i think many can identify with, and it well end up being used on business cards, Letterheads etc. Basically i'm after your critique <br><img src="http://www.typophile.com/forums/messages/29/41354.jpg" alt="Logo"></p>
