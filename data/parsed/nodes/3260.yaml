    html: <p>I didn't see the mean at first, either. And I kept wondering what the split represented through the a and r (almost a swastika).  <br> <br>I like the idea though. It reminds me of my aunts' house. She had the word Jesus knitted on a rectangle on top of her TV. <br> <br>I think the 1/3 sizes work better in helping to see the whole picture. Perhaps, the larger size should have larger counters and apertures.</p>
