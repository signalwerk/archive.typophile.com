    date_raw: null
    votes: null
    html: <p>CIRA, the Canadian Internet Registration Authority, took acceptation to the declared ownership of the typographi.ca domain, which they have the right to do according to their charter and rules. The domain wasn't exprired, per se, but suspended - and the name server entries deleted from the domain record. Without those entries, your browser can't locate the server. Regardless of the rational behind the situation, the way that CIRA deals with these issues is extremely heavy-handed. <br> <br>I mentioned some more tidbits regarding this debacle over <a href="http://blog.veer.com/archives/000512.html">here</a>.</p>
