    html: |-
      <p>Make a new font.<br>
      Go to Element/Font info<br>
      Choose Lookups/GPOS<br>
      and Add Lookup<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/111_4879.jpg"></div><br>
      Choose Pair position (kerning)<br>
      <div class="imageWrap"><img src="http://typophile.com/files/222_5032.jpg"></div><br>
      In window Kerning format choose Use a matrix of kerning classes<br>
      <div class="imageWrap"><img src="http://typophile.com/files/333_3417.jpg"></div><br>
      In fields First character I put D and O, and in Second character C G O Q. FontForge set the kerning to -110, I changed it to 10.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/444_4720.jpg"></div><br>
      In Kerning Metrics window I wrote OQ<br>
      <div class="imageWrap"><img src="http://typophile.com/files/555_5269.jpg"></div><br>
      You can change the kern value moving the green line between chosen letters<br>
      <div class="imageWrap"><img src="http://typophile.com/files/666_3440.jpg"></div><br>
      In window Kerning by classes you can see the result<br>
      <div class="imageWrap"><img src="http://typophile.com/files/777_6261.jpg"></div><br>
      In window Font information/Lookups/GPOS you can right-click the lookup and choose Save Feature File (or only choosen lookup)<br>
      <div class="imageWrap"><img src="http://typophile.com/files/888_6113.jpg"></div><br>
      Saved<br>
      <div class="imageWrap"><img src="http://typophile.com/files/999_6371.jpg"></div><br>
      The important part of this file looks like this:<p></p>
      <pre>lookup kernHorizontalKerninginLatinloo {
        lookupflag 0;
          @kc0_first_1 = [\D \O ];
          @kc0_second_1 = [\C \G \O \Q ];
          pos @kc0_first_1 @kc0_second_1 22;
      } kernHorizontalKerninginLatinloo;

      feature kern {

        script DFLT;
           language dflt ;
            lookup kernHorizontalKerninginLatinloo;

        script latn;
           language dflt ;
            lookup kernHorizontalKerninginLatinloo;
      } kern;</pre><p>
      As you can see there is one class -left=first- with /D/O and one class -right=second- with /C/G/O/Q and the kern value between them is set to 22.</p>
