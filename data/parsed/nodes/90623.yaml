    <p>I'm a complete newbie at opentype features. Trying to learn as much as I can, but there doesn't seem to be that much information on the web for beginners. </p>
    <p>I'm looking for an explanation of the logic and basic syntax of class-based kerning. Something in the style of this wonderful <a class="freelinking external" href="http://ilovetypography.com/OpenType/opentype-features.html" rel="nofollow">article about substitution features</a>, but for kerning. I would also love any resources on specifically doing this with fontforge, but I can figure out this easier if I understand what's going on in the background (tables? subtables? what?)</p>
    <p>Any pointers will be very much appreciated</p>
