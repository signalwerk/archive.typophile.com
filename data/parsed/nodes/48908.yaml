    date: 2008-08-29T12:27:00
    date_raw: 29 August 2008 - 12:27pm
    votes: 0
    html: |-
      <p>If Neutraface is the display face, a modern (didone) would be a good text complement.<br>
      Or possibly a non-geo slab serif, e.g. Archer or Bodoni Egyptian.</p>
      <p>If Neutraface is the text, you could try matching a modern where the hairline corresponds to the weight of the text monoline.<br>
      To see this effect, set up some 72 pt text in <a href="http://www.shinntype.com/scotch.html">Scotch Modern Display</a> in the type tester, and put the window next to a showing of <a href="//www.houseind.com/index.php?page=showfont&amp;id=18&amp;subpage=viewfontspecimens">Neutraface Light</a></p>
      <p>But really, any true ("optically sized") display face with lots of fine detail would complement the strong personality and sparkle of Neutraface text.</p>
