  html: |-
    <p>Indento is a multi-purpose modern geometric slab serif for headlines, posters, branding but fairly legible to be used as longer text. The straight and rounded corners combined with deep cuts and asymmetric serifs gives it a distinctive look while still keeping its rigorousness and legibility.</p>
    <p>The family consist of three weights, each with a companying italic. The extensive character set—513 glyphs in each font—includes support for Central and Eastern European languages and OpenType features like small caps, ligatures, fractions, slashed zero, stylistic alternates and more. See <a href="http://mugurmihai.com/pdf023/Indento.pdf" rel="nofollow">PDF specimen</a>.</p>
    <p>Available for purchase at <a href="http://new.myfonts.com/fonts/mugur-mihai/indento/" rel="nofollow">MyFonts</a>. Make sure you try the free bold version.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/indento-gallery1_6066.jpg"></div><p></p>
