  html: |-
    <p>A disclaimer: this is my first shot at designing a face. </p>
    <p>Scintilla Slant was loosely inspired by a section of reverse-italicized text on a gravestone in the Daughters of the American Revolution cemetary in Savannah, GA. My plan was to take two features of the typeface on the stone (the reverse-italics and contrasting stems) and make a more modern looking typeface. Please, let me know how you think I did.</p>
    <p><a href="https://web.archive.org/web/20150124071346/http://penguins-and-polarbears.com/ScintillaSlant_for_typophil.jpg" title="http://penguins-and-polarbears.com/ScintillaSlant_for_typophil.jpg">http://penguins-and-polarbears.com/ScintillaSlant_for_typophil.jpg</a></p>
