    html: |-
      <p>The purpose was twofold: it was in an attempt to emulate fonts like leftist and cipher (both can be found at dafont.com) and the way they handle serifs, and secondly, I wanted to give the letterforms a chance to interlock on occasion, like they do with the N and T in Scintilla.</p>
      <p>I agree with your comment on spacing them out more...they do look nice with more breathability, but then that does sacrifice any interlocking. I'll have to think on this one...</p>
      <p>Thanks for the comment. :)</p>
