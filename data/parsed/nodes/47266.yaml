      <p>The abstract for the "Optimum Alphanumeric" thesis you mentioned refers to a Lincoln/Mitre font, which is a dot matrix font. <a href="http://These are the results" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://These are the results</a> of a Google search for 'Lincoln/Mitre font'.</p>
      <p><a href="http://This NTIS document" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://This NTIS document</a> refers to a comparison of Lincoln/Mitre to another font named Leroy. Lincoln/Mitre was not found to be better than Leroy. I found a <a href="http://www.caddepot.com/cgi-bin/cfiles/cfiles.cgi?0,40,0,0,47" title="Click to visit an external URL." class="freelink freelink-external freelink-external">zip file</a> for Leroy, but it's in Autocad shx format.</p>
      <p>Apart from all that, I found a source that names fonts that probably aren't dot matrix. <a href="http://aerospacedefense.thomasnet.com/Asset/MIL-M-18012.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MIL-M-18012B</a> (324 KB pdf), "Markings for Aircrew Station Displays," says this (spelling variations in original):</p>
      <p>Letter design:</p>
      <p>a) Fonts for engraving:(1) Gorton extended (2) Groton normal (3) Gorton condensed</p>
      <p>(b) Fonts for printing and other reproduction methods: (1) Airport semibold (2) Futura demibold (3) Vogue medium (4) Lining Gothic No. 66 (5) Alternate Gothic No.3</p>
      <p>Numeral design:</p>
      <p>a) For engraving: (1) Gorton extended (2) Gorten moderne </p>
      <p>(b) Fonts for printing and other reproduction methods:(1) Futura medium (2) Futura tempo</p>
      <p>Gorton may never have been digitized, but a font called Technic may be similar.</p>
      <p>Some other miscellaneous stuff:</p>
      <p><a href="http://True 3-D displays for avionics and mission crewstations" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://True 3-D displays for avionics and mission crewstations</a>:</p>
      <p>"...true three-dimensional (T3D) display. The concept of font describes the approach adopted here, but whereas a 2-D font comprises pixel bitmaps, a T3D font herein comprises a set of hologram bitmaps. The T3D font bitmaps are pre-computed, stored, and retrieved as needed to build images comprising symbols and/or characters. Human performance improvement, hologram generation for a true 3-D symbol font (see-through 3-D stick images), projection requirements, and potential hardware implementation schemes are described."</p>
      <p><a href="http://An innovative tool for designing fault tolerant cockpit display symbology" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://An innovative tool for designing fault tolerant cockpit display symbology</a>:</p>
      <p>"This research focuses on the design and development of a software package to aid display designers in creating fault tolerant fonts and symbology for monochrome dot-matrix displays....The software package developed for the design of fault tolerant fonts, referred to herein as FontTool, operates on an IBM PC..."</p>
      <p>You might also try the <a href="http://www.icao.int/ANB/humanfactors/Documents.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">ICAO human factors</a> site.</p>
      <p>Re getting a copy of the "Optimum Alphanumeric" thesis from NTIS, US$48 is pricey. Is there such a thing as an international interlibrary loan? Alternatively, perhaps the <a href="http://www.afit.edu/library/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">AFIT library</a> would photocopy or scan the thesis for you.</p>
