      <p>You can <a class="freelinking external" href="http://www.ntis.gov/search/product.aspx?ABBR=ADA053447" rel="nofollow">buy the document</a> for US$48 from NTIS.</p>
      <p>I don't know if they specifically address fonts, but these are documents are also available from NTIS:</p>
      <p><a class="freelinking external" href="http://www.ntis.gov/search/product.aspx?ABBR=ADA235818" rel="nofollow">Report on Head-Up Display Symbology Standardization</a></p>
      <p><a class="freelinking external" href="http://www.ntis.gov/search/product.aspx?ABBR=ADA058207" rel="nofollow">Joint Tactical Information Distribution System (JTIDS). Standard Symbology. Cockpit Display Presentation Formats and Flight Test Symbol Set.</a></p>
      <p>The FAA has a number of documents available for free that might be of interest:</p>
      <p><a class="freelinking external" href="http://www.hf.faa.gov/Portal/techrptdetails.aspx?id=1293" rel="nofollow">Font Requirements for Next Generation Air Traffic Management Systems</a> (313 KB pdf).</p>
      <p><a class="freelinking external" href="http://www.hf.faa.gov/Portal/techrptdetails.aspx?id=1318" rel="nofollow">Technical Annex- An Experimental Methodology for Selecting Fonts for Next Generation Air Traffic Management Systems</a> (286 KB pdf).</p>
      <p><a class="freelinking external" href="http://hf.tc.faa.gov/technotes/dot_faa_tc_07_11.pdf" rel="nofollow">Human Factors Criteria for Displays</a> (368 KB pdf), particularly paragraph 5.1.8.</p>
      <p><a class="freelinking external" href="http://www.hf.faa.gov/docs/508/docs/cami/0117.pdf" rel="nofollow">Human Factors Design Guidelines for Multifunction Displays</a> (1 MB pdf). Many good references to other documents.</p>
      <p><a class="freelinking external" href="http://www.hf.faa.gov/Portal/techrptdetails.aspx?id=30" rel="nofollow">Human Factors Design Guide Update</a> (2.5 MB pdf), particularly paragraph 8.2.5.7.</p>
      <p><a class="freelinking external" href="http://www.hf.faa.gov/Portal/techrptdetails.aspx?id=1021" rel="nofollow">Symbol Development Guidelines for Airway Facilities</a> (8.5 MB pdf), particularly paragraph 3.1.1.</p>
      <p><a class="freelinking external" href="http://www.hf.faa.gov/docs/milstd1787b.zip" rel="nofollow">MIL-STD-1787B: DoD Aircraft Display Symbology</a> (4.5 MB zip file), particularly paragraph 4.3.3.</p>
