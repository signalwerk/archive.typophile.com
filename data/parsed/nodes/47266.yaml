      <p>You can <a href="http://buy the document" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://buy the document</a> for US$48 from NTIS.</p>
      <p>I don't know if they specifically address fonts, but these are documents are also available from NTIS:</p>
      <p><a href="http://Report on Head-Up Display Symbology Standardization" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Report on Head-Up Display Symbology Standardization</a></p>
      <p><a href="http://Joint Tactical Information Distribution System (JTIDS). Standard Symbology. Cockpit Display Presentation Formats and Flight Test Symbol Set." title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Joint Tactical Information Distribution System (JTIDS). Standard Symbology. Cockpit Display Presentation Formats and Flight Test Symbol Set.</a></p>
      <p>The FAA has a number of documents available for free that might be of interest:</p>
      <p><a href="http://Font Requirements for Next Generation Air Traffic Management Systems" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Font Requirements for Next Generation Air Traffic Management Systems</a> (313 KB pdf).</p>
      <p><a href="http://Technical Annex- An Experimental Methodology for Selecting Fonts for Next Generation Air Traffic Management Systems" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Technical Annex- An Experimental Methodology for Selecting Fonts for Next Generation Air Traffic Management Systems</a> (286 KB pdf).</p>
      <p><a href="http://hf.tc.faa.gov/technotes/dot_faa_tc_07_11.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Human Factors Criteria for Displays</a> (368 KB pdf), particularly paragraph 5.1.8.</p>
      <p><a href="http://www.hf.faa.gov/docs/508/docs/cami/0117.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Human Factors Design Guidelines for Multifunction Displays</a> (1 MB pdf). Many good references to other documents.</p>
      <p><a href="http://Human Factors Design Guide Update" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Human Factors Design Guide Update</a> (2.5 MB pdf), particularly paragraph 8.2.5.7.</p>
      <p><a href="http://Symbol Development Guidelines for Airway Facilities" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Symbol Development Guidelines for Airway Facilities</a> (8.5 MB pdf), particularly paragraph 3.1.1.</p>
      <p><a href="http://www.hf.faa.gov/docs/milstd1787b.zip" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MIL-STD-1787B: DoD Aircraft Display Symbology</a> (4.5 MB zip file), particularly paragraph 4.3.3.</p>
