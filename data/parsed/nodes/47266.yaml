      <p>most typeaces are designed with sharp corners, which is not very suitable for screens, because screens have smaller resoulution then printed stuff. and they use light, which is the opposite to ink. thus, slightly rounded typefaces might be a good solution, if sharp corners don't look good on the cockpit screens.</p>
      <p>however, there are typefaces designed for screen use even if they have no rounded corners.</p>
      <p>ff unit might be a good starting point:<br><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_rounded/">http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_rounded/</a></p>
