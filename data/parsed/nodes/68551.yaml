    <p>Two more workshops are being offered at Cooper Union this spring in lettering: "Organic Capitals" April 17 &amp; 18 and "Compressed Styles (Black letter)" May 1 &amp; 2. To see complete workshop details <a href="http://www.cooper.edu/ce">www.cooper.edu/ce</a></p>
    <p>These workshops are appropriate for people who have some background in lettering or calligraphy and are already<br>
    comfortable using a broad edged pen. Absolute beginners will struggle but if you're up for the challenge Julian is an excellent teacher to begin with. </p>
    <p>Julian Waters is the son of calligrapher Sheila Waters and bookbinder/conservator Peter Waters. He also studied extensively with the legendary type designer Hermann Zapf, who later picked Julian as his successor to teach the summer master classes at Rochester Institute of Technology (RIT). Julian’s clients have included the U.S. Postal Service, National Geographic, and many agencies, institutions and companies. His typeface designs include Adobe Waters Titling Pro and a custom typeface family for the new Visitors Center at Jefferson’s Monticello where he was the typographic designer/advisor. He has received many awards from the Type Directors Club, Gra¬phis, Art Directors Club, Print, and Letter Arts Review, among others.<img src="/sites/default/files/old-images/Bismarck_4950.jpg"></p>
