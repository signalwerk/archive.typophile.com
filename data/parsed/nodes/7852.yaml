  - id: 53062
    user: 3480
    date: 2004-11-25T08:30:00
    date_raw: 25 Nov 2004 — 8:30am
    votes: null
    html: "<p>Thanks guys, <br> <br>Yeah, Opentype works fine (I think OTFs are entirely cross-platform anyway, aren't they?). Haven't tried TT as I never use TT fonts for work (old school prejudice). <br> <br>But -- this, from <a href=\"http://www.macdisk.com/fontsen.php3\" target=\"_blank\">www.macdisk.com/fontsen.php3</a>: <br> <br>'Indeed, for some time, it was already possible to put PC fonts (True Type <i>as well as Type 1</i>) in the font folder of some Adobe applications, like Illustrator and InDesign. The drawback was that the fonts were only visible for those applications, and not from all other.' <br> <br>I'm sure I've heard this elsewhere as well.  <br> <br>R</p>"
    html_clean: "<p>Thanks guys, <br> <br>Yeah, Opentype works fine (I think OTFs are entirely cross-platform anyway, aren't they?). Haven't tried TT as I never use TT fonts for work (old school prejudice). <br> <br>But -- this, from <a href=\"http://www.macdisk.com/fontsen.php3\" target=\"_blank\">www.macdisk.com/fontsen.php3</a>: <br> <br>'Indeed, for some time, it was already possible to put PC fonts (True Type <i>as well as Type 1</i>) in the font folder of some Adobe applications, like Illustrator and InDesign. The drawback was that the fonts were only visible for those applications, and not from all other.' <br> <br>I'm sure I've heard this elsewhere as well.  <br> <br>R</p>"
