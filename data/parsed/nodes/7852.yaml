  html: "<p>From the InDesign manual: <br> <br>'You can make fonts available in InDesign by copying the font files into the Fonts folder <br>inside the InDesign CS folder on your hard drive. (In Mac OS, you can even make Windows <br>fonts available by copying the font files into the Fonts folder.)' <br> <br>Has anybody actually managed to make this work? When I've tried copying Windows PFM and PFB files to \\InDesign\\Fonts on OSX, they still show up as missing. <br> <br>Thomas? <br> <br>R</p>"
