    html: |-
      <p>The print is good, and when I make outlines it's also the right height, so it's only an on-screen issue.<br>
      It can't be bad hinting cause the letters "S" and "E" are pretty straightforward as you can see on the image, they have type 1 hints. This is not my first font and I can't remember having this problem before.<br>
      It's as if fontlab adds a negative overshoot to these letters.</p>
