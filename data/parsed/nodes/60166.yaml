    <p></p><div class="imageWrap"><img src="http://typophile.com/files/What is going on here_4263.png"></div><p></p>
    <p>As you can see above, a few letters like the "S" and "E" are at a lower height than the rest of the letters when I use them at small point sizes in MS Word or Illustrator. I can't figure out why, because all of the letters have exactly the same height in Fontlab (see "H" and "E" above). It's an opentype PS font. Does anyone know how to correct this?</p>
