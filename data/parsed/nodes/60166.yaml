    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Extra negative horizontal hint_4108.png"></div><p></p>
      <p>I seem to have fixed it. I used an extra negative horizontal hint on top of the horizontal hint that was already their. This levels the height to that of the other letters.<br>
      Maybe not the best method, but it works. If anyone has an better method that will fix this problem (preferable only with the use of Fontlab) I'd like to know, thanks :)</p>
