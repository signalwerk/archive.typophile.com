    <p>Originally devised by François Ambroise Didot, the cicero is a linear unit of measurement that is approximately equal to 12 points or: </p>
    <p>4.512 millimeters<br>
    0.1776 inches<br>
    1.07 picas<br>
    1.066 picas (PostScript)<br>
    17.12 pixels</p>
