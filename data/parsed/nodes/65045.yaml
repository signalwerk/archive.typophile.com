      <p>I have no points, but since John Hudson does, I’ll answer him. This is a vegan stuffing I concocted for my daughter and her tree-huggin’ vegan friends. I quote from an email I sent to her:</p>
      <p>“Chop or tear a loaf of dark bread (ideally dark rye) into sugar cube size pieces.</p>
      <p>Add a cup of chopped pecans, or some other nut, to the bread.</p>
      <p>Slice about a pound of portabello mushrooms into large bite size pieces, and chop a head of anise into something similar.</p>
      <p>Dice a couple of onions.</p>
      <p>Using too much olive oil, sauté the mushrooms, onions and anise along with:<br>
      1/2 tsp. each of dried sage, rosemary and fennel seed,<br>
      1/4 tsp. ground ginger<br>
      1/8 tsp. ground clove.</p>
      <p>Once well wilted, mix in a tbsp. of black bean paste. If you don’t have black bean paste, add some salt or soy sauce.</p>
      <p>Remove from heat, maybe mix in some molasses. (1-2 tbsp?)</p>
      <p>Crush 3 large cloves of garlic.</p>
      <p>Mix vegetables and garlic with bread (and a tbsp. of walnut oil if you have it*), moisten mixture with oil and some cider, apple juice or vinegar if it seems too dry, and finally, bake at 350 F.  Leave it uncovered if you want some crunch, or covered if you’re going for moist.</p>
      <p>*If you didn’t have any walnut oil for the mix, but you do have sesame oil, you could add some of that; but I’d wait until it came out of the oven since sesame oil doesn’t hold its flavour very well when heated.</p>
      <p>Hmmm .... You could add some black beans to the mix, if you feel like going for a sort of meal in one.”</p>
      <p>There. </p>
      <p>Sorry Joe.</p>
      <p>God Bless us everyone.</p>
