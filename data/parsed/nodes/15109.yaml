      <p>I see the second as a warning sign, spectacles ahead, kissing snakes, (mainly because of the yellow diamond, I think), while the first has potential, it needs some work to it. Trying a B with uneven bowls might work and trying to get the shapes at top and bottom of the B to relate as serifs to the C or try a ball terminal on the C, the counter also needs work. I think it does read fairly instantly and it is a mark that is going to appear with your name, as to whether it is exciting, does it need to be? More important that it is well created and shows a good appreciation of letterforms, after all you are not going to need to use it for long, hopefully.<br>
      Good luck on the job seeking.<br>
      Tim</p>
