    html: |-
      <p>just a word of advice...i’m always very dismissive of resume’s, letterhead and business cards that bear the mark of the person. 95% of other designers i work/worked with feel the same way. why? i think it’s usually because they are bad and due to the fact they are poorly designed and not well thought out, it shows even more the designer is unfamiliar with symbols, shapes and letterforms. these are usually two letters of someone’s name combined in some juxtaposed way creating one unified shape. i’d much much much rather see time and effort put into organizing information well on a page such as your letterhead and/or business card than a symbol that is usually non-representative of you as a person or you as a designer. </p>
      <p>to sum up your design skills, your talent, your past 2 or 4 years and your personality into one mark is a tough job. coming from someone who sees portfolios and resumes on a semi-frequent basis, stick to your design of your collateral. leave the identity branding to the corporations and let your design skills represent you.</p>
      <p>my 2 cents...if you really want some feedback on what youve posted, let me know via email or a post here and i’ll help out where i can. i would just recommend staying away from this route</p>
      <p>w|m</p>
