    html: '<p>I have designed two dictionnaries with last winter using some newspapers fonts that I have designed 10 years ago. I see good similarities in booth medium: narrow columns, hierarchy, strong contrast between various elements, economy, small sizes used, etc. <br> <br><a href="http://www.typofonderie.com/alphabets/view/LeMondeJournal" target="_blank">http://www.typofonderie.com/alphabets/view/LeMondeJournal</a> <br><a href="http://www.typofonderie.com/alphabets/view/LeMondeSans" target="_blank">http://www.typofonderie.com/alphabets/view/LeMondeSans</a> <br><a href="http://www.typofonderie.com/alphabets/view/LeMondeJournalIpa" target="_blank">http://www.typofonderie.com/alphabets/view/LeMondeJournalIpa</a> <br> <br>If interested, I be will be probably able to post some images of the results on the web. <br> <br>"ie, how much does the publisher want to minimize the number of pages" <br> <br>At my big surprize, the publisher wanted more pages than what my fonts and design proposed: to give to the potential buyer the feeling that he got heavy, so a complete dictionnary. If it was too light and thin, the future reader "impression on the object" can be very wrong: "Hey, for the same price between two dictionnaries, this one is more heavy and features more pages, its better one for sure!"</p>'
