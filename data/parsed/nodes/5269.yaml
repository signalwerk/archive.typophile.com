    html: <p>So much depends on the size/leading of the type (ie,  how much does the publisher want to minimize the number of pages), and the paper stock. <br> <br>My old Penguin Dictionary from the '60s is set in 7/7 Plantin, and the stock is little better than newsprint, but the general effect is excellent (were it not disintegrating). <br> <br>Chris Burke's new "Celeste Text" looks quite interesting for small size work.</p>
