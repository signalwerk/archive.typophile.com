  date_raw: 18.Jun.2004 7.50am
  votes: null
  html: "<p>Can I get some opinions about something I've been thinking about for awhile?... <br> <br>A typeface optimally tuned for foreign-language dictionaries; here are some of the primary concerns that I can see: <br> <br>1)  Length of reading time.  This depends on the kind of reading (definitely not long-term literature reading, but 2 or 3 pages of speed reading, or \"speed-glancing\", in order to find the desired item, which leads us into #2). <br> <br>2)  Vertical, rather than horizontal, reading.  This poses the biggest question to me...  the vertical motion is similar to that which we experience while browsing a scrolling website (which, of course, uses a sanserif--could any respectable work on paper use sanserif and be taken seriously?)   <br> <br>I believe typefaces with heavy or bulky serifs make a dictionary's usability difficult (it's an industry concerned way more with content than practical aesthetics).  I wonder, what about a face with soft serifs (that is, something less obtrusive than, say, the in-your-face serifs of an \"s\" in Times Roman), something somewhere just on the edge of having no serifs at all...</p>"
  html_clean: "<p>Can I get some opinions about something I've been thinking about for awhile?... <br> <br>A typeface optimally tuned for foreign-language dictionaries; here are some of the primary concerns that I can see: <br> <br>1)  Length of reading time.  This depends on the kind of reading (definitely not long-term literature reading, but 2 or 3 pages of speed reading, or \"speed-glancing\", in order to find the desired item, which leads us into #2). <br> <br>2)  Vertical, rather than horizontal, reading.  This poses the biggest question to me...  the vertical motion is similar to that which we experience while browsing a scrolling website (which, of course, uses a sanserif--could any respectable work on paper use sanserif and be taken seriously?)   <br> <br>I believe typefaces with heavy or bulky serifs make a dictionary's usability difficult (it's an industry concerned way more with content than practical aesthetics).  I wonder, what about a face with soft serifs (that is, something less obtrusive than, say, the in-your-face serifs of an \"s\" in Times Roman), something somewhere just on the edge of having no serifs at all...</p>"
