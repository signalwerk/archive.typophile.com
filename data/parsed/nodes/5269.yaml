    html: <p>Involved arguments from me (theoretical, rhetorical, gastronomical, any kind really :-) will have to wait until July 6, but what I can advise is to read anything you can find by Paul Luna, a major heavy at Oxford Dictionary, and a devout typophile. FYI, Luna is a big fan of Unger's work, but also recommends good 'ol Nimrod as a fallback. <br> <br>As for multi-script work, you're right, there's a huge lack of thoughtfulness and quality, and you can't blame the typographers entirely, because they lack the "tools" (ie fonts) to do it right. <br> <br><a href="http://www.themicrofoundry.com/ss_rome1.html" target="_blank">http://www.themicrofoundry.com/ss_rome1.html</a> <br> <br>hhp <br></p>
