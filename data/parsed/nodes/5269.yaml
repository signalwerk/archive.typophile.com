    date: 2004-06-18T09:13:00
    date_raw: 18.Jun.2004 9.13am
    votes: null
    html: <p>Lexicon--looks like a nice face; to be honest I was unaware of its existence until you pointed it out, so thanks Victor.  But the post wasn't a riddle, I can see the cryptic tone after looking at it now.  What I really want is some opinion on what might work best (or better than that used currently) in dictionaries, especially foreign-language dictionaries, and specifically dictionaries covering indigenous languages of the Americas. <br> <br>Having worked directly in the field of lexicography for the past 3 or 4 years (and still going--much to the dismay of my eyes!), I've noticed the distinct tendency on the part of publishers to give a dictionary's typeface very little thought at all.  I believe the criteria at present is the same as any other work of literature--and this just isn't right. <br> <br>Just wanted to pool the "in-the-know" expertise of typophiles.  And of course, theoretical arguments between Hrant Papazian and John Hudson on legibility are welcome.</p>
