  html: |-
    <p>Christian Robertson designed <a href="/wiki/Pill%20Gothic" class="freelinking" rel="nofollow">Pill Gothic</a> and <a href="/wiki/Dear%20Sarah" class="freelinking" rel="nofollow">Dear Sarah</a>, both available through <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>, as well as the <a href="/wiki/Roboto" class="freelinking" rel="nofollow">Roboto</a> typeface family, used in the Android mobile operating system. More of Christian’s type designs can be seen at <a href="/wiki/Betatype" class="freelinking" rel="nofollow">Betatype</a> (<a href="http://www.betatype.com" rel="nofollow">www.betatype.com</a>).</p>
    <p>Christian joined <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a> as Senior Media Designer in December 2004. He is the mastermind behind the development of the new <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a> platform.</p>
