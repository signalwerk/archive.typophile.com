    <p>The DINfun Pro fonts are special versions of the classic DIN 1451 Mittelschrift, far removed from the original typeface's serious and no-nonsense roots. I have made them as companions to the classic, with some some very different expressions, complete with a large multilingual character set. Time to spice up that DIN profile! :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-DINfun_Pro_450_6447.jpg"></div><p></p>
    <p>4 themed packs have been made so far:<br>
    <strong>Effects Pack:</strong> a collection of "simple" transformations of the basic font, but with plenty of manual corrections to make them work well.<br>
    <strong>Removed Pack:</strong> a collection where parts of the letters have been removed to create different effects.<br>
    <strong>Grunge Pack:</strong> a collection with some typical grunge style treatments.<br>
    <strong>Halloween Pack:</strong> a collection of scary, sharp and disturbing variants - perfect for seasonal party invitations, ads, and whatnot.</p>
    <p>The packs are just $30 each (and includes the Plain cut as a bonus) - or get the single fonts for our usual $10 each.<br>
    <a href="http://www.cheapprofonts.com/Newsletter_11_03" title="http://www.cheapprofonts.com/Newsletter_11_03">http://www.cheapprofonts.com/Newsletter_11_03</a></p>
    <p>Like the idea behind CheapProFonts? Like our selection of multilingual fonts? Like our friendly and reasonable licensing? Like us to inform you about every new font? Like us! :)</p>
    <p>Roger</p>
