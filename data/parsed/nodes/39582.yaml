      <p>————————————————————————————————-<br>
    Call for Submissions for Program Content for TypeCon2008<br>
    ————————————————————————————————-</p>
    <p>TypeCon2008: Punkt<br>
    July 15-20, 2008<br>
    Hyatt Regency Downtown<br>
    Buffalo, New York</p>
    <p>The Society of Typographic Aficionados (SOTA) is now accepting programming proposals for its tenth annual conference. TypeCon2008 will be held July 15-20 in Buffalo, New York. We are partnering with many local and international organizations in presenting TypeCon2008, and look forward to offering a variety of affordable program designed for type makers and type users from all walks of life.</p>
    <p>We are currently reviewing proposals for contemporary and historical presentations and panel discussions, as well as focused hands-on workshops in both the digital and non-digital realms. Topics at TypeCon cover a broad range of interests, including typography, type design, font production, graphic design, new media, printing history, calligraphy and hand lettering, the book arts, advertising, type in motion, literacy, type sales and marketing, legal issues, type and design education, and other related areas.</p>
    <p>Standard programming formats are as follows:</p>
    <p>Full-length presentation - 40 minutes, including time for audience Q+A</p>
    <p>Type in 20 presentation - 20 minutes, including time for audience Q+A (if any)</p>
    <p>Type and Design Education Forum - a separate call will be issued with full details on programming types</p>
    <p>Panel discussion - a minimum of 3 panelists that represent a range of experience and expertise in a given topic. An experienced moderator is required for all panels. A moderator may also serve as a panelist where appropriate. Panel discussions range from 45-60 minutes, depending on the topic.</p>
    <p>Full-day workshop - 7 hours (with break for lunch at midday)</p>
    <p>Half-day workshop - 3.5 hours (no break)</p>
    <p>The main program of presentations and panels will run Friday-Sunday, July 18-20. Pre-conference workshops will take place Wednesday-Thursday, July 16-17, with tours running throughout the week.</p>
    <p>You may submit multiple proposals.</p>
    <p>In order to consider your proposal, we will need the following:</p>
    <p>- presentation/workshop/tour title<br>
    - a concise one-paragraph description of your topic (up to 100 words)<br>
    - complete supporting materials for review - visuals, theses, articles, abstracts - the more details you provide, the better<br>
    - your biography (100 words maximum)<br>
    - speaking references (if you have not previously presented at TypeCon)<br>
    - a print quality headshot in TIFF or JPEG format - must be a minimum of 300 dpi at 2 inches wide<br>
    - any other material that supports your proposal</p>
    <p>Please use PDF, RTF, or ASCII text for text. Compress all files in a single ZIP archive labeled with your name (example: TC08_LastNameFirstName). If your ZIP archive is larger than 20 mbs, please send a link for downloading instead of transmitting through email.</p>
    <p>Email proposals to info [at] typesociety.org by January 15, 2008. The programming committee will review all proposals for possible inclusion in the conference schedule.</p>
    <p>More information about SOTA is available at <a href="http://www.typesociety.org" title="http://www.typesociety.org">http://www.typesociety.org</a>. The TypeCon website is located at <a href="http://www.typecon.com" title="http://www.typecon.com">http://www.typecon.com</a>.</p>
