      <p>@ Werfer</p>
      <p>I am not a nostalgic, but what you are calling <em>feeling</em>, is, what I call <em>functionality</em>. There is a connection between beauty and functionality. From a certain point of view beauty can be interpreted as functionality. If the other circumstances are the same, beauty has an evolutionary advantage. Books are closer to our nature, because they are closer to the stuff, from which we are made. Paper is more life than plastic, isn’t it? When plastic still was alife, the days were shorter. But I don’t know, how important the human ability of adaption is in this context. It also may be dependent from the content of the books. There is a contradiction between poems about sex, love and nature on the one and the cold smoothness of computers on the other side. (The preference of natural proportions is verified. Even the iRex can not change its proportions. I already did talk about that.)</p>
