      <p>One thing I’ve noticed that gets left out of the equation when comparing the sustainability of digital communication to print is transportation. With electronic media we just have to push a few electrons around. With printed media you have to transport raw materials to a mill, then from the mill to the printing plant (which also needs ink transported). Then the finished printed material is shipped to a distribution point before being sent to stores and/or readers. If that material is to be recycled then it is shipped back to a recycling center and the whole transport cycle is done over.</p>
      <p>That’s a lot of in-between steps versus skipping all that raw materials transport and just taking the same electronic communication and piping it directly to the reader using electrons. To me that seems like an exponentially more efficient way to communicate. We all know that the current ebook media is primative, and society in general isn’t used to reading on them. But kids learning to read today are more accustomed to reading electronic media and as they grow up the media is going to get far better than we can imagine. </p>
      <p>I thought Pong was the end-all, be-all, greatest video game ever when it first came out. My brain would’ve oozed out of my ears if someone had shown me today’s current video gaming systems back then. Printed books will survive though. I can still find an old-school pinball machine too.</p>
