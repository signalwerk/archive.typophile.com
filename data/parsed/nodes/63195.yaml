      in this case, it's "your reading won't be distracted."</p>
      <p>whether that marketing _works_ or not...  that is a<br>
      different question entirely.  since i believe there are<br>
      a lot more people who want web browsing even if<br>
      web browsing is a "distraction" from their reading,<br>
      i'm inclined to think such marketing will not work.</p>
      <p>when i add in the other things an apple tablet will<br>
      enable -- including a myriad of stuff that we have<br>
      not even thought of -- i think the choice is clear...</p>
      <p>&gt;   I take it as a given that the iTablet, or whatever<br>
      &gt;   it's called is going to have Safari on it<br>
      &gt;   with 3G web connectivity built in.</p>
      <p>3g seems like a safe bet, but even still, i've learned<br>
      not to assume or speculate about what apple will do.<br>
      most of the time, you're wrong, and even if you are<br>
      right, there's no payoff, usually because you didn't<br>
      understand the consequences of the choices made.</p>
      <p>often times even apple itself gets wildly surprised...<br>
      for instance, they had no idea the app store would<br>
      get huge with crazy and imaginative stuff that gave<br>
      customers added value for their iphone purchase...</p>
      <p>&gt;   I'm also very interested to see the quality of the<br>
      &gt;   text rendering on a larger backlit LCD like the iPhone.</p>
      <p>again, it's unwise to assume that apple will use an l.c.d.<br>
      they might, or they might not.  or some models might,<br>
      and other models might use o.l.e.d.  or a pixel qi screen.<br>
      (i've got the original o.l.p.c. machine, which used the<br>
      pixel qi screen, and it's a fascinating combination of<br>
      technologies that enable both inside and outside use.)</p>
      <p>-bowerbird</p>
