      <p>@ Richard</p>
      <p>According to Wikipedia an one-unit-mover is a typophile who is not contented with the design of his glyphs, because the stroke width is one unit to small. So the typophile decides to move a node by one unit.</p>
      <p>But one unit more or less – even a high resolution printer cannot solve it in body text sizes. And for sure not an ebook device. So the sense of many discussions here is questionable in my opinion, because the reason for them would be pure aesthetics (visible in big sizes), but not legibility. In fact I think, that there is a hand full of fonts only, that are highly legible (round about 0.005%), because most font families miss optical styles or are made for big point sizes.</p>
      <p>Don’t take me more seriously than I do, please. I am just an amateur. And maybe there is a necessity to make thin, highly contrasted and highly detailed body text fonts.</p>
