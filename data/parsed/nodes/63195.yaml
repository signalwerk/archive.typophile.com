      <p>@thomasphinney</p>
      <p>Once very skeptical, I subscribe more and more to bb's baloney and coincidentally, the guy who was best man at my wedding is also a novelist. (We've known each other since the cradle - his father and my father were in first grade together.)<br>
      He also teaches creative writing at a university. Tenured.<br>
      He just finished a new book, sent it to his agent, and has palpitations every time his phone rings because it might be his agent with bad news. This is because the book biz is in such bad shape.<br>
      I asked him why he doesn't try to publish digitally on his own. What's he got to lose?<br>
      He said there's "no points" for self-publishing. In other words, unless he goes through the established, formal channels and has a "real" publisher - whatever that is these days - he would lose Whoofie.<br>
      I asked him what was more important, the "points" or having people read his stuff.<br>
      He didn't answer and I didn't press it.<br>
      Writing has not been his "day job" for many years - his work as an educator covers the tab but he gets very liberal sabbaticals and such to write without the distraction of teaching.<br>
      Has the guy who was best man at your wedding made a living from his writing alone?</p>
      <p><em>The number of new books in any form with quality content will diminish if there’s no way for authors to get paid.</em><br>
      <em>Authors, like type designers, or rock musicians, need to buy groceries. If they can’t get the money to do that from their art, it won’t be their day job.</em></p>
      <p>There's more quality writing being freely shared than I can consume in what's left of my lifetime, so who cares? Those who absolutely must express themselves will do so, they will find a way. And today, the costs of distribution are near zero so all you need to cover is the time it takes. Those who can't or won't or don't find a way can disappear for all the difference it will make to anybody.<br>
      Half the time I find the comments from readers at the NYTimes more insightful and better written than the articles themselves - written by those for whom it *is* a day job.<br>
      I'm a musician with years of formal training. Nearly no musicians are or were ever able to make a living as musicians, it's a given. Didn't stop anybody. Didn't stop me. You don't get into it for money. And if you have to stop doing it, nobody misses you.<br>
      I'm tired of hearing about this ideal world that never existed where everybody had a way to "get paid".<br>
      That's the real baloney.</p>
      <p>Cheerfully, rich.</p>
