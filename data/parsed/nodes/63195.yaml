      <p>With regard to the pollution through the production of the paper used for books, my arguments are these:</p>
      <p>1. The production of paper needs much energy and water, but most of the paper is used for magazines, newspapers, toilet products and in offices. That’s just an assumption. It should be clarified.</p>
      <p>2. The production of computer controlled devices also needs energy. Additionally it needs unrenewable resources. The mining of some of these resources needs water. Additionally the regions, in which the biggest deposits exist, are politically instabil. I am talking about the raw material <a href="https://web.archive.org/web/20181126003539/http://en.wikipedia.org/wiki/Coltan">Coltan</a> and oil (for the plastics).</p>
      <p>3. Paper can be easier recycled than computer devices.</p>
      <p>4. a) You never buy a computer device for the eternity. (This also means, that it is harder for the user of ebook devices to get a personal relationship to the ebook device.)</p>
      <p>b) For optimal legibility of different kinds/genres of literature you probably need more than one device. (Think about the meaning of the page margins in a book.)</p>
      <p>How often do pure ebook readers have to buy new devices?</p>
      <p>5. Electrosmog because of wireless connections (download of ebooks).</p>
      <p>6. The operation of an ebook device needs energy.</p>
      <p>7. The servers, on which the ebooks are stored, need energy.</p>
      <p>-------------------</p>
      <p>And I have another good argument for printed books:</p>
      <p>You can comment the text in a much more immediate way. A graphic tablet or a keyboard is less immediate than a pencil.</p>
