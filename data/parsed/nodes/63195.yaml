      <p>@dezcom<br>
      Every time I get into one of these copyright discussions - which always lead nowhere - I think of the picture you've got up on Facebook from Vietnam. (No bull, I really do.)<br>
      Luckily for me, Nixon ended the thing right before my number was coming up.<br>
      In light of the shit you and so many other guys endured, palpitations and protestations over who's going to buy my font and then, heaven forbid - subset it, convert it, stick it up their backside, whatever they're going to do with it is, in contrast, inconsequential garbage.<br>
      Actually, all I was trying to do was get a rise out of Phinney. He's so unflappable. (At least <em>I've</em> never seen him flap, have you?) Hah!<br>
      But hey, let's continue, 'cause it's fun...</p>
      <p>@william berkson<br>
      <em>Rich, your seeming idea that this high quality type would have happened if they all could only afford to do type as a hobby, is just ridiculous.</em><br>
      Maybe so. Let's presume you're right. But if the trade-off for keeping John Hudson on full-time in a digital world is that I must accept invasions into my privacy and have *less* rights as a consumer of information than I did before distribution was digital, then John Hudson and the rest of the guys you mention can all become hobbyists as far as I'm concerned. I'll be fine. The world will be fine.<br>
      You've got your priorities, I've got mine. I'll take my chances.</p>
      <p><em>What if we take the “get paid” out of the equation for a minute and focus on the concept of copyright as protecting the rights of a creator to determine (to some extent, anyway) the fate of their creation?</em></p>
      <p>Alright, I'll bite - a little. Besides, I still owe Bill Berkson at least one suggestion vis-a-vis copyright reform.<br>
      This thread has done so much bobbing and weaving already, what's a little more.<br>
      BTW - I have two patents and a trademark obtained during my previous life in the fashion industry. I fully understand wanting to protect your baby. (It was a heat-sealing system that actually was licensed and marketed. And the one company besides my own that licensed the thing would never have done so if I hadn't had the patent. So I understand the value of IP. I'm no purist. I, too, will take my corporate welfare whenever I can get it.)<br>
      And I do think proper attribution, at the very least, is a part of good online citizenship. It serves the creator and the people to whom you're recommending or redistributing the creation. Not giving credit is bad manners, period.<br>
      I had a long discussion with somebody recently urging me to become familiar with "open" licensing in relation to the whole @font-face thing. And I've come to see his point: the legal realities being what they are, if you *do* want to keep some control over a work - even if it's to prevent somebody else from repackaging it and start charging money for it - you've got to take steps to clearly license it otherwise you can run into trouble exerting whatever claims you might have. If enforcement is an option, that is. And that's what really sticks in everybody's craw with digital distribution - enforcement is really impossible without imposing restraints on consumption that drive everybody to the free stuff that might not be "high quality" - however you define that - but at least it's free.</p>
      <p>How about we start by protecting everyone's creations the same way we protect the creations of fashion designers and the great chefs of the world?<br>
      Where would that leave us? We don't seem to be at a loss for innovative clothing or having to endure ratty meals. Geez, look at all the cookbooks!</p>
      <p>How does that strike you?</p>
