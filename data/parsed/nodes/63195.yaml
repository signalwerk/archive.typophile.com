      <p>Richard</p>
      <p>"[…] but the glyphs are as clear and sharp as print."</p>
      <p>If this would be true, the very most stuff, posted on Typophile, would be waffle. The iRex 1000 has a relative resolution of 160 dpi. I have not hold the iRex 1000 in my hands, but I doubt, that it can preserve the fineness of the very most typefaces, which are designed for body text (sizes), with such a low resolution; doesn’t it need typefaces, which are optimized for it? Can all existing body text typefaces be optimized for it? And if, are those optimized typefaces still the same typefaces with regard to the design, or are they new typefaces? And if they are new with regard to the design, why do some type designers invest years in the fineness of the curves of their typefaces? Do they invest the time for improving the beauty or for improving the legibility. Or are beauty and functionality ever the two sides of the same medaillion?</p>
      <p>I am not an enemy of technology. Ebook devices have big advantages in comparison to books. There may be people like you, for that ebook devices already are useful. But for the case, that they replace books, before they are on the same level of legibility and feeling, and I am forced to buy one, because books don’t exist anymore, I solemny promise, that I will not pay for ebooks, as long as I can get illegal copies. And for sure I don’t let force me from the industry, to make me to a test object. If an ebook device is good as a hammer and if it does not cost much more than a hammer, then I will buy one and then I am willing to pay a price, that is comparable to the price of a printed book.</p>
      <p>I hope, that the European Union will not forbid books. We are already loosing the classic light bulbs; no, not for the environment, but for the wallets of the lightning industry. And the whole world wants to build new nuclear power stations for the environment. CO2 beats radioactive contamination. It is absurd. Maybe the strategy of our "democracies" is, to make books too unlegible and too expensive for the "electors". And even if one device would cost 100 Euro, it is much more than the price for the taste of reading in form of a paperback. So the poor ones can be kept stupid. And our governments can continue to castrate democracy in the fight against the enemies of democracy.</p>
      <p>However, I don’t make books, but I just would miss them. And how much are 20 years?</p>
