      <p>&gt; There’s more quality writing being freely shared than I can consume in what’s left of my lifetime, so who cares?</p>
      <p>This strongly depends on the <em>kind</em> of quality writing you're looking for. Yes, people do write quality serious fiction without being paid. And there are also textbooks on many subjects that have fallen into the public domain, or which are written under versions of the GPL.</p>
      <p>It is, however, also true that there are other kinds of book which take enough effort of an uninteresting kind to write that people who have a requirement for those kinds of books do expect to have to pay for them. Those books need an appropriate distribution system, and for them, paper is still best.</p>
