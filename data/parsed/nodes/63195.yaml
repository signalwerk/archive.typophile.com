      <p>David</p>
      <p>In my opinion it is easier to find non environment arguments against the ebook devices. Ebook devices are not as legible as printed books and I doubt, that they will be in the coming 20 years. I can imagine, that the problem of the low resolution will be solved, but I doubt, that the problem with the size will be solved then. The margins of the pages have a function. If they are too big, your impression of the contrast between text and background is different, at least I assume, that it is.</p>
      <p>"The number of readers who buy books and do not already own and plan to continue the use of their computer, is tiny and shrinking."</p>
      <p>But actually you need a special device because of the backlight (?) of TFT and the extremely low resolution. And a computer is not as easy to handle and hold as a printed book in the same size.</p>
      <p>„This is not to say all printed books are bad, but if the reader wants them digitally, and they are not available except in print, isn’t that bad?“</p>
      <p>The reader? I don’t know, which kinds of paper you can buy in the office shops of Massachusettes, but in Germany you can decide between high bright and low quality recycling paper only. If you want to have a natural paper, you have a problem. Why? As more white as better it is. That’s the way, the reader buys his paper on one of his non eco days. On the other days he buys the recycling paper. (You can order natural colored paper online. There is one semi good German online paper shop.) I am talking about the paper, that people buy for their laser and inkjet prints. Most readers think, that the content of a text is complicated, if they don’t understand it. They never think, that the typography or the printing quality are the reason. So it is not enough to trust in the market. Do you mean, that those things are the best, which are sold the most? No. That’s not the way, in which capitalism works, at least not the capitalism of these days.</p>
