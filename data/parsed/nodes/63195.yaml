      <p>A very long time in the future, it may indeed be that digital books will almost completely replace paper books. The preconditions for that are, of course:</p>
      <ul>
      <li>Digital books, while they may be protected by some form of DRM, will be freely movable between display/storage devices,
      </li><li>A digital book, since it doesn't consume paper which is heavy to move around, will be somewhat less expensive than its paper counterpart, and
      </li><li>Digital book readers will be comfortable for reading, suitable for almost all types of book, inexpensive and convenient.
      </li></ul>
      <p>We're not quite there yet. But if these conditions are met, then the great advantages of digital books - the ability to carry a library of thousands of volumes in your pocket, rather than building an edifice to house it - would take over.</p>
      <p>However, for a long time to come, many older books will be available secondhand in paper form for as little as a dollar. Even if the DRM for digital books is such as to let one keep one's library when one buys a new digital book reader, and eliminate any concern over losing one's library if something happens to that book reader, it is not likely to also permit a market in secondhand copies of digital books to exist. Since every secondhand book started life as a new book, and purchasers of new books will have their own utility in mind when buying a new book, this in itself will not inhibit the success of the digital book.</p>
      <p>But until the last paper book either falls into the public domain, or becomes an expensive collector's item, even long after new books have stopped being printed on paper, there will be a robust market in secondhand paper books.</p>
