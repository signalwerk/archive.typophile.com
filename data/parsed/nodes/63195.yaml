      <p>A thought here: when I worked at the University of Toronto Press, we produced the Canadian Math Bulletin. The editor told me that while the journal had several thousand subscriptions, generally to university libraries, occasionally papers were published where only four mathematicians in the world would have an interest in the material (and only a few dozen would even be able to understand it). But the publication was the only way to communicate that knowledge about, since you couldn't know which four of the thousands would be interested.</p>
      <p>This was pre-Web, and today I assume that those papers are only published electronically, since that provides an alternative to the wastefulness of broadcasting something to such a narrow audience.</p>
