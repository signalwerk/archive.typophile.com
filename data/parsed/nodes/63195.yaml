      <p><cite>A photo can look great at 300 dpi and type look like mud.</cite></p>
      <p>Exactly that. Additionally the distance, that you have to a photo, is often bigger. (Although unimportant in this context: The low resolution can be a method of style and you cannot compare the resolution of a photo, taken with an analog camera and the resolution, taken with a digital camera. The most impressive photos, that I have seen, are photos from wars. The grain was often very coarse there. The difference between grain and pixel or print dots is the evenness of their spreading. The one is "nature" [the chemical reaction in the film] and the other is technology [a matrix].)</p>
