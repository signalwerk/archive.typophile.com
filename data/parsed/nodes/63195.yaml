      <p>No trick. It's a little tougher on the eyes than print, but the work, overall, goes a little faster as compensation. At least that what happened to me. I do zoom up the font size usually, yes, but not a lot. And once in a while, if I'm fatigued, I'll change the font to Cambria - a screen font with a larger x-height and very even hinting at any size. Times New Roman and Courier are relics - but that's what APA says to use. So it gets changed back to that before submission. I also edit with everything left-aligned. Much easier than the wackiness that happens onscreen when you edit a paper justified and without hyphenation. The body of the paper gets justified right before submission.<br>
