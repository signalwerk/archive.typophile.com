      <p>Boy, this is the thread that never dies...</p>
      <p>quadiblock said:<br>
      &gt; The number of new books in any form<br>
      &gt; with quality content will diminish<br>
      &gt; if there’s no way for authors to get paid.</p>
      <p>I, for one, am perfectly willing to take the chance that less will be produced if DRM goes bye-bye or if copyright becomes nullified by the behavior of the public at large. Alternative copyright schemes might provide a fairer result for authors, but will never happen politically. They'll die defending the Alamo.<br>
      Dig this: As reported on Boing Boing, in Denmark it's legal to make a copy of your DVD's for backup. But it's illegal to crack the encryption code to do so. So the guy cracked the code and then turned himself in! Absolutely true. He did it, he said, because he wanted to find out which of the two laws counted for more. After all, they can't both be "the law".<br>
      The funniest part is - he has yet to hear anything definitive from the authorities. They're not quite sure what to do with him.<br>
      (This one had me rolling on the floor.)<br>
      And I think bb is absolutely correct - until DRM is ditched entirely, E-Books face an unsurmountable hurdle no matter how good the devices get. IMHO.</p>
      <p>@werfer<br>
      &gt;However - I am not a Kindle owner (yet) - has anyone here<br>
      &gt;ever settled down in front of a nice fire, with a good<br>
      &gt;glass of whiskey, a nice blanket, and has read a really<br>
      &gt;GOOD book... on an E-Reader? How did it FEEL?</p>
      <p>Sans the fire, and the whisky, but with a blanket, yes. How did it feel? You're kidding, right? Maybe not - well, the ideas the author was trying to convey to me through words managed to make their way through without any more of a problem than had they been presented using ink on paper.</p>
