      <p>@bill<br>
      &gt;I just don’t understand what you are so exercised about, and it must be something.</p>
      <p>I'm not all that excercised. Just concerned - as are many, many others and for good reason. (I'm going to come back and post a couple of books I recommend. Good reads. One's free.)<br>
      Strangely, as little as a year ago I was probably in the same place as I think Kent is, opinion-wise. I don't think I've done as big a turnaround on anything in my entire life - it's like a switch got flipped in my head. As ex-General Ariel Sharon put it questioned about his marked change in stance vis-a-vis Israelis and Palestinians, "I can see things from over here that I couldn't see from over there." I guess it's a vantage point thing.<br>
      A major reason I got involved in the fracas over web font formats was because I understand and still do understand the concern about posting raw TTF/OTF files on web sites. Thankfully, it bore fruit and now, in addition to EOT - which now looks something that will ultimately fade away -  there's WOFF, which is an arguably better format. I wanted talent like yours, Kent's, everybody's, working as freely as possible on typefaces for not only print, but screen.<br>
      Fonts are a peculiar specialty, really. Type designers are like the air traffic controllers of written language and I really don't want to fly knowing that less than the best are in the control tower. But I will if I have to. And I'll get by just fine. What choice does anybody have? We have to communicate and without typefaces, there are no written words.<br>
      There's still a lot of hesitation in the biz, but the more I think about where digital publishing is going the more I think things are going to be quite OK for type designers. We're in a transitional phase of a transformation that's unprecedented. Exciting but unsettling. When someone feels that their paycheck is on the line, waxing eloquent about the common good and a bright future doesn't get you far.<br>
      (I just wanted to explain a little of where I'm coming from.)<br>
      I think bb's mention of the ASCAP/BMI/Harry Fox nexus for collecting royalties in the sphere of music publishing might provide a model down the road.</p>
      <p>Viva La Revolución!</p>
