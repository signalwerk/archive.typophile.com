      <p>Well, it is comparable with plebiscites. If you take a vote on death penalty, it would get a majority. If you would vote on waterboarding for the national security, it would be the same. It is a classic dilemma. I am against plebiscites. But the problem is, that our leading politicians miss competence, humanity and respect for the constitution likewise. I think, that the only solution is, that you give the people access to education (knowledge) independent from their origin (and for sure not for the price to go to the army). But just that is not wanted by our political leaders, because an intelligent plebs would not vote for incompetence, avarice and slavering lust for power. Politicians want to have a stupid plebs.</p>
      <p>I don’t think, that the free market can guarantee advanced civilization. On the other side an overcontrolled market neither can guarantee advanced civilization. But, and there is a difference between artists and politicians: A person, that works for his audience, but not for his spiritual welfare, is no artist, but a corrupt politician. While the politician should be responsible for his electors, the artist is responsible for himself only. That’s the reason, why many artists, that mix they work with politics, are dilettantes.</p>
      <p>Well, I don’t think, that book typography should be art, but there should be more typographers, that talk with the readers about their trade. But my impression is, that they have a tendency to prefer the talk with other typographers, because they miss the respect of the reader and they avenge with arrogance. In book typography it is part of the profession of the typographer, to stay in the background. </p>
      <p><cite>print-on-demand books have the same quality as offset books,<br>
      or at least they can... </cite></p>
      <p>That sounds promising, although offset printing is no guarantee for quality likewise.</p>
