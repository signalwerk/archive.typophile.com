      <p>"Go" seems to be the right expression. They don’t go to the internet. They simply go or the online editions don’t have the same content as the print editions (target group orientated production). In the German debate about the pseudo barrier of "child pornography", the theme was more present in the online editions and the reports more critical with regard to the aims. The (printed) German magazine <em>Spiegel</em> is not the same as <em>Spiegel Online</em> with regard to the content. At the moment my position is relatively neutral with regard to the going of printed newspapers, but not with regard to the different content. But there are themes, that require much money for a good recherche. However, my knowledge about the coherencies is very limited.</p>
