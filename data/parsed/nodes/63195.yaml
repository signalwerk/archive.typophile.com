      <p>thomas said:<br>
      &gt;   I basically agree with quadibloc<br>
      &gt;   and think BB’s full of baloney.</p>
      <p>well, you know, things could be much worse,<br>
      if charles brock decided he didn't like me.    ;+)</p>
      <p>&gt;   <a href="http://www.youtube.com/watch?v=qJwyBmu-O-o" title="http://www.youtube.com/watch?v=qJwyBmu-O-o">http://www.youtube.com/watch?v=qJwyBmu-O-o</a></p>
      <p>that kindle went up in a million pieces from<br>
      just one swing of the baseball bat, didn't it?</p>
      <p>&gt;   And to answer the rhetorical question posed to quad</p>
      <p>it wasn't a rhetorical question.  i don't know quad.<br>
      perhaps he/she is a writer, or does know some writers.</p>
      <p>i know lots of writers, including many who make their<br>
      living from writing.  i even know some "award-winners".</p>
      <p>i also know lots of writers who don't make a penny<br>
      from their writing.  i also know writers who _should_<br>
      or _could_ be making a very good living by doing writing,<br>
      except that's not how they decided to arrange their lives.</p>
      <p>and what i know, from knowing all of those writers, is that<br>
      the ones who are writing stuff that is worthwhile will do it<br>
      even if they aren't paid to do it.  they do it because they<br>
      love it, or they do it in spite of the fact that they hate it,<br>
      but they do it, and they will continue to do it no matter what.<br>
      they do it because they cannot not do it.  it's that simple...</p>
      <p>and the ones who are writing just because it is "a paycheck"<br>
      aren't turning out anything worthwhile.  awards or not...</p>
      <p>now, i'm not saying it's "impossible" to write well for cash.<br>
      i come up against well-written stuff all the time that i expect<br>
      was written for cash.  "how cute / are these boots" is a rhyme<br>
      from a target commercial i love -- it's chanted repeatedly<br>
      by a bunch of kids stomping a stage -- and i presume that the<br>
      copywriter for that job was paid well.  and yet for all i know,<br>
      s/he might hate it, and would quit in a minute if not paid.</p>
      <p>but yeah, i'm willing to give up all the writing from people<br>
      who are writing just to get paid, and who'd stop otherwise...</p>
      <p>&gt;   I know a LOT of writers. The best man at my wedding has<br>
      &gt;   won more awards for his novels than I can keep track of.</p>
      <p>first, you didn't really say if he's _making_a_living_ at it.</p>
      <p>but i assume that he'd keep writing even if he wasn't paid.</p>
      <p>however, all of that is really beside the point, isn't it?</p>
      <p>because we all _want_ quality writers to be paid for writing;<br>
      we all want quality font-makers to be paid for making fonts,<br>
      we all want quality musicians to be paid for making music.</p>
      <p>so we have to put into place the mechanisms that allow that<br>
      to happen.  we must build the infrastructure to make it so.</p>
      <p>d.r.m. is _not_ that infrastructure, _not_ that mechanism.<br>
      d.r.m. doesn't work; it just gums the machine unnecessarily.</p>
      <p>and the only way to make d.r.m. work, even if just half-assed,<br>
      is to clamp down on "intellectual property" so hard we will<br>
      all suffer, in countless ways.  and even then, the cost of<br>
      "enforcement" will fritter away the cash we'd hoped to gain.<br>
      there are easier ways to decide who should get paid, and<br>
      how much.  as one example, you could look toward the model<br>
      on which b.m.i./a.s.c.a.p. is based.  (don't look at those<br>
      organizations per se, but rather the model, because they're<br>
      bureaucratic nightmares that rob artists rather than pay 'em.<br>
      but the transparency an open digital infrastructure could<br>
      guarantee could ensure that kind of thievery didn't happen).</p>
      <p>_everyone_ wants to be paid for their intellectual property.</p>
      <p>fine.</p>
      <p>we can make it happen, without d.r.m.  this false dichotomy,<br>
      where d.r.m. is pitched as "the answer" for starving artists,<br>
      needs to be swept away so we face the problem intelligently.</p>
      <p>so anyway, thomas, there you go.  buy yourself some bread<br>
      and you can have a baloney sandwich.</p>
      <p>-bowerbird</p>
