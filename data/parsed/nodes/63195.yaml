      <p>Another thing to add to my earlier - I do quite a bit of proofreading of academic work. At first I asked for paper copies, marked that up first. And then the changes were incorporated into the digital.<br>
      For some reason, and I really don't know why, I found collaboration was just as easy when I skipped the paper step and now just work from the digital.<br>
      A lot of this, undoubtedly, has to do with the willingness to break old habits. Of course "willingness" can be imposed in a number of ways.<br>
      Cost of ink cartridges, etc...</p>
      <p>Sad to say, but I think near-geezers like me will have to die off before paperless starts getting real traction. And the schools should be the first environment to go paperless but the technology and the budget - you've got to see the quality of the equipment in the computer rooms at some elementary schools - isn't there.</p>
