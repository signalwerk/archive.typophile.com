      <p>Naturally not. <em>Most of</em> was exaggerated. But I was regarding to the details of the letters in body text, at least that was my intention. I know, that they should not be as contrasted and detailed as letters in display sizes, but even the optical styles of <em>Arno Pro</em> probably variate in stroke width in a way, that can’t be displayed with 160 dpi. And how good a typeface works with regard to the legibility, is also dependent from the surface of the paper. So what do you mean with "sharp and crisp"? My TFT also is sharp and crisp. It even would be sharp and crisp, if it would display 2 pixel per 20 inches only.</p>
