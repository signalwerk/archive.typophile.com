      <p>&gt; Is the future of the book digital?<br>
      &gt;...the future of the digital booked?<br>
      I think we book digitally now, like hotels and car rentals, and sometime in the future more people will recognize how many books are already digital. I agree that it's moving from over our feet, I don't envisage the digital coffee table book anymore, more people can see a screen. There is also the misapprehension, I think, that the digital book is mostly text, perhaps rightly brought on by the ample evidence of specialized devices for presentation of mostly digital books of text. This too, @fontface will change I think, right now they are all in Times on the web. Has anyone here read a whole book on the web?</p>
      <p>Arno&gt;And I have another good argument for printed books:</p>
      <p>But your first, environmentally-based argument is flawed, in my opinion, in a basic way. Nearly all printed books start as digital books. The number of readers who buy books and do not already own and plan to continue the use of their computer, is tiny and shrinking. So, if nearly all books start digital on computers, and some of them go directly to people's existing general-purpose computers, or even to specialized computers for reading, removing the printing and recycling process, is not bad, is it?</p>
      <p>This is not to say all printed books are bad, but if the reader wants them digitally, and they are not available except in print, isn't that bad?</p>
      <p>Cheers!</p>
