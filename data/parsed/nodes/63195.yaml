    html: <p>Printing on demand seems to be laser printing. This confirms me in my doubts. I don’t know, if this happens with all laser printers, but the text, printed with my laser printer, is sensible with regard to the direction of the light, because the toner is <em>on</em>, but not <em>in</em> the paper. More to the point – there is no deep connection between toner and paper. There is a 3D-effect, that is more or less visible and that is dependent from the direction of the light. The paper doesn’t seem to be saturated with color, because the toner is not evenly spread out. Additionally there is a slight uneven brightness, because the toner doesn’t seem to melt completely. Although the printer prints very precise, there is something missing in comparison with professional offset printing. (Laser printing is also offset, isn’t it? But I miss the right term.)</p>
