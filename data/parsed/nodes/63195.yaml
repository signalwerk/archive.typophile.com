      <p>well, it's entertaining for someone to come in<br>
      to a 2-page thread as if it had just started...</p>
      <p>but let me interact with a few of the points<br>
      from the post just entered by quadiblock...</p>
      <p>&gt;   very long time in the future, it may<br>
      &gt;   indeed be that digital books will<br>
      &gt;   almost completely replace paper books.</p>
      <p>it's really best, most of the time, to think of e-books<br>
      as _supplementing_ p-books, not _replacing_ them...</p>
      <p>&gt;   Digital books, while they may be protected by<br>
      &gt;   some form of DRM, will be freely movable<br>
      &gt;   between display/storage devices,</p>
      <p>e-books aren't going to go anywhere until publishers<br>
      give up an insistence on d.r.m., totally and completely.</p>
      <p>d.r.m. adds to the cost, and subtracts from the utility,<br>
      and there's already a bad tug-of-war going on between<br>
      the buyers and sellers of books, in regard to pricing, so<br>
      there's no wiggle-room in which d.r.m. can inject itself.</p>
      <p>&gt;   A digital book, since it doesn’t consume paper<br>
      &gt;   which is heavy to move around, will be<br>
      &gt;   somewhat less expensive than its paper counterpart</p>
      <p>e-books will be _far_ less expensive than paper-books...<br>
      an e-book is essentially a file, at most a collection of files.<br>
      the costs are creation, editing, and maybe fact-checking...<br>
      everything else is fat from middlemen that'll be eliminated.</p>
      <p>&gt;   the great advantages of digital books - the ability to<br>
      &gt;   carry a library of thousands of volumes in your pocket,<br>
      &gt;   rather than building an edifice to house it - would take over.</p>
      <p>carrying a library in your pocket is an amazing thing, for sure.</p>
      <p>but in an age where people carry the _internet_ in their pocket,<br>
      it's really not that big of a deal.</p>
      <p>the _real_ advantage of e-books -- like all digital content --<br>
      is that the reproduction and distribution cost is nearly zero.</p>
      <p>we can now give a book to every person on the planet, and<br>
      i mean it quite literally.  indeed, we can give _every_ book to<br>
      every person on the planet, if we decide that's what we want.</p>
      <p>when we are finally able to wrap our heads around _that_<br>
      -- books being a primary vehicle for communicating our<br>
      knowledge and culture -- the potential should boggle us.</p>
      <p>&gt;   However, for a long time to come, many older books will be<br>
      &gt;   available secondhand in paper form for as little as a dollar. </p>
      <p>actually, i think they will be available, but not for a dollar.</p>
      <p>here's what's going to happen.</p>
      <p>the big publishing houses -- which of course are all owned<br>
      by corporations -- are dinosaurs which will soon experience<br>
      the occasion of their extinction.  they will stop making money.<br>
      and when corporations stop making money, they exit the scene.</p>
      <p>when that happens, a flock of new mammals will emerge, but<br>
      they won't be able to maintain the vast industry we now know.</p>
      <p>so the number of new paper-books printed will plummet...</p>
      <p>however, the number of books that are released as e-books<br>
      will skyrocket.  since many people will still have a preference<br>
      for the paper-book experience, they'll use print-on-demand<br>
      to get a hard-copy of the books that they really want to read.</p>
      <p>so even though the number of new books being printed in<br>
      big print-runs by big publishers will drop, the total number<br>
      of books being printed will still remain rather high, relatively,<br>
      meaning that paper-books will still have a visible presence...</p>
      <p>however, they will become more _valuable_.  even books that<br>
      are now available for a mere dollar will see their price double.</p>
      <p>so there _will_ be a strong market in second-hand p-books.</p>
      <p>of course, at a print-on-demand cost of a-penny-a-page,<br>
      there will be a firm ceiling on how high used prices will go.</p>
      <p>but for truly old books (anything printed in a large print-run,<br>
      not just bona fide "antiques"), there'll be a collectors' market.</p>
      <p>***</p>
      <p>the thing is, the people who love paper-books are probably<br>
      in for an extremely difficult time, at least in the short-run...</p>
      <p>because the corporations are gonna opt out, and that means<br>
      very few large print-runs, which means huge price increases.</p>
      <p>you might crave the hard-copy when it costs $20, even $40,<br>
      but what about when it costs $50, or $60, or $80, or $100?<br>
      how many p-books are you gonna purchase at those prices?<br>
      your loyalty to ink-on-paper is going to be severely tested...</p>
      <p>just like all of the people who love their printed newspapers,<br>
      and are sad to see them go, p-book people are gonna weep.</p>
      <p>corporations don't care, though; they'll find something else<br>
      to sell to you so that they can still make their bloody profits.</p>
      <p>-bowerbird</p>
