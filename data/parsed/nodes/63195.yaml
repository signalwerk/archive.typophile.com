    html: |-
      <p>Rich: <em>But it seems I wasn't far off - at a UPM of 2048 fussing over moves of one-unit seems a bit nit-pickishly anal retentive. However, if I ever actually design a typeface (unlikely) or more probably edit an existing one, I will be a one unit mover.</em></p>
      <p>I've now worked on two projects in which we settled on a UPM of 4096, because the 2048 grid didn't provide for fine enough adjustments. These were both display types with fine features, so one would expect them to be used at larger sizes at which the construction of these details would be visible, but the other aspect of the design in which ‘fussing’ over single unit movements is important is in relative weight of thin strokes. Rather than thinking about the single unit movement relative to the UPM, you should think about the single unit movement relative to two thin strokes, one horizontal and one vertical: suddenly that single unit makes the difference between these strokes being optically balanced or not.</p>
      <p>I remember many years ago listening sympathetically to Luc(as) de Groot's complaints about the difficulty of designing a super-lightweight sans on a UPM of 1000. If the stems were on average 20 units wide, a shift of a single unit represented a 5% difference in stem weight, and that's much too big a jump when trying to optically balance horizontal and vertical stems. Again, in design what matters is not the distance of a move relative to the UPM size, but the distance relative to other distances.</p>
      <p>Type design is an excellent example of Marx's principle that cumulative quantitative changes result in qualitative change. :)</p>
