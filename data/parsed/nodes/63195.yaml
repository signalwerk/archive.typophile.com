      <p>i can't help but notice that thomas phinney<br>
      never did respond on whether his best man<br>
      actually makes a living from his writing --<br>
      his _award-winning_ writing, for the record<br>
      -- because that would seem to have bearing<br>
      on the thread, would it not?</p>
      <p>since -- in my experience -- award-winning<br>
      writing is the very type of stuff that is _not_<br>
      all that salable in the marketplace (if it even<br>
      manages to make it to the marketplace in the<br>
      first place), i'm guessing that that best man is<br>
      pulling his paychecks out of academia instead.<br>
      probably by teaching even more writers how to<br>
      not make a living off their writing...  ironically...</p>
      <p>and this brings me to my much bigger point...</p>
      <p>which is that _copyright_ doesn't really "protect"<br>
      individual artists all that much, precisely because<br>
      _copyright_ is the first thing that the corporations<br>
      have you _sign_over_ to them when they sign you.</p>
      <p>corporations are the big beneficiaries of copyright.</p>
      <p>you'll also notice that the legal system rules that<br>
      employers own the rights to intellectual property<br>
      created by their employees, even when the work<br>
      was done offsite, in their own time, in areas that<br>
      are only vaguely related to the employee's job...<br>
      like the work thomas did while he was at adobe.</p>
      <p>none of this will surprise anyone, though, since<br>
      the law always sides with the rich and powerful.</p>
      <p>-bowerbird</p>
