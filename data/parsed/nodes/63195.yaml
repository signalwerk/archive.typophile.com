      <p>@bowerbird</p>
      <p>OK. I promise not to post after the New Year. But it has to be unanimous. If anybody else posts, I'm back. ;)</p>
      <p>@william berkson</p>
      <p>I promised you a couple of book recommendations regarding copyright issues.<br>
      I would suggest James Boyle's very recent <strong>The Public Domain: Enclosing The Commons Of The Mind</strong><br>
      It was just named Book of the Year by the American Society for Information Science and Technology. (Oy, more awards, the financial kiss of death!)<br>
      It's available for free as a PDF and a raw HTML version at:<br>
      <a href="http://www.thepublicdomain.org/" title="http://www.thepublicdomain.org/">http://www.thepublicdomain.org/</a><br>
      And also at Feedbooks.com where, also for free, you can get it formatted to fit a variety of e-reading devices. It's also for sale at a modest price from Amazon.<br>
      Of earlier vintage is Jessica Litman's <strong>Digital Copyright</strong> written in 2001. The great thing about Litman's book is that, because it was written in 2001, we sort of know, as readers, how the story ends and whether or not Litman's predictions come true. But it covers all the conundrums that copyright law has us still struggling with today.<br>
      Both beautifully written books - really good reads - and Boyle's book even has one of the best little bits of musicology, of all things, that I've ever read.<br>
      (Boyle and Litman don't write in the tortured prose of the lectern like so many academics do. It's the straight-to-the-point talk of the private tutorial. Don't get me started!)<br>
      Anyway, if you read these books with an open mind and then come back to me and say something akin to, "So? I still really don't see any problems." You're either a schmuck (and you're certainly not that) or myopically blinded by self-interest, Mr. Fancy-Pants type designer.</p>
      <p>So there.</p>
      <p>Happy New Year To All!</p>
