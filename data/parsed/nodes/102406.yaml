    <p>I was wondering if anyone knows where the sail on the lowercase t originated from.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-04-19 at 8_4418.17.02 AM.png"></div><p></p>
    <p>I get that its an attempt to unify the t into one stroke, but is their anymore to it than that? Why is the sail on the left? Why does the stroke begin at the right and move left (opposed to the left --&gt; right motion we use to cross our "t"s and "f"s)?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-04-19 at 8_3544.19.24 AM.png"></div> (not too strange)<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-04-19 at 8_5610.20.35 AM.png"></div> (very strange)<p></p>
