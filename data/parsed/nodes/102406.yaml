      <p>It derives from calligraphy, which was the driving stylistic element for the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Carolingian_minuscule" rel="nofollow">Carolingian Miniscule</a>:</p>
      <p><em>“The script ultimately developed from Roman half uncial and its cursive version, which had given rise to various Continental minuscule scripts, which were combined with features from the "Insular" scripts that were being used in Irish and English monasteries.”</em></p>
      <p>The quill pen was cut so it provided a flat area. Due to the position of the right hand, the quilt’s tip was causing an angled stroke, which provided strong strokes downwards and softer strokes sideways, although the goal was probably to keep both strokes equal in force.</p>
      <p>The minuscle “t” derives from the <em>Roman Capitalis</em> “T”, and the first stroke of the quill was downwards, followed by the second stroke sideways from left to right. Slight inaccuracy caused a little bump on the top where the T-downstroke began, which led to the slightly crossed shape. The sail shape in serif fonts, as you have shown it, is a result of both angled strokes melting into one area at some point of type development. Just like the curve at the bottom of the lowercase “t” and the lowercase “a” derives from swift motions when writing minuscule scripts.</p>
    html_clean: |-
      <p>It derives from calligraphy, which was the driving stylistic element for the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Carolingian_minuscule" rel="nofollow">Carolingian Miniscule</a>:</p>
      <p><em>“The script ultimately developed from Roman half uncial and its cursive version, which had given rise to various Continental minuscule scripts, which were combined with features from the "Insular" scripts that were being used in Irish and English monasteries.”</em></p>
      <p>The quill pen was cut so it provided a flat area. Due to the position of the right hand, the quilt’s tip was causing an angled stroke, which provided strong strokes downwards and softer strokes sideways, although the goal was probably to keep both strokes equal in force.</p>
      <p>The minuscle “t” derives from the <em>Roman Capitalis</em> “T”, and the first stroke of the quill was downwards, followed by the second stroke sideways from left to right. Slight inaccuracy caused a little bump on the top where the T-downstroke began, which led to the slightly crossed shape. The sail shape in serif fonts, as you have shown it, is a result of both angled strokes melting into one area at some point of type development. Just like the curve at the bottom of the lowercase “t” and the lowercase “a” derives from swift motions when writing minuscule scripts.</p>
