    html: <p>The ‘sail’ origins in writing :–) as shown <a class="freelinking external" href="http://www.flickr.com/photos/albert-jan_pool/8674982388/in/set-72157629679838154/" rel="nofollow">here</a>. I prefer to write the horizontal stroke first (no matter if I write T or t). Doing so, I can more easily avoid the vertical stroke causing a bump in the horizontal one that the other way round. Also I think it it is easier to find the right starting point for the horizontal stroke than for the vertical stroke of T or t, because the further I am away from the preceding letter, the more I have to guess about the size of the inter-character space.</p>
