      <p>This is definitely a display face I'm working on so I'm sure the mathematical glyphs won't be used often, but I've got a bit of a completionist streak in me so I want to make sure all of the basics are covered. I will probably ignore anything past the commonly-used glyphs (plus, minus, multiply, divide, etc). Your comment regarding the differences in baseline made a lot of sense so I think I will do the two different slashes, it's not like they are complex glyphs. </p>
      <p>Thanks for the insight on spacing, too!</p>
