  html: <p>I'm designing my first typeface and I'm at the point now where I'm working on punctuation, math symbols, etc. The not-so-major stuff that's actually kinda major in making a proper functional font. The face is an early 20th century flared serif. It's very close stylistically to <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/symbol/std-black" rel="nofollow">ITC Symbol Black</a> and I noticed in researching Symbol as well as other faces in the same vein that there is a difference between the solidus glyphs and the mathematical slashes. It looks to me like many of these fonts are using generic math symbols that don't match the design of the rest of the font. Maybe I'm overthinking but is there some kind standard when it comes to math symbols like the division slash, or is it fine to use the same glyph for the solidus and the math slashes?</p>
  html_clean: <p>I'm designing my first typeface and I'm at the point now where I'm working on punctuation, math symbols, etc. The not-so-major stuff that's actually kinda major in making a proper functional font. The face is an early 20th century flared serif. It's very close stylistically to <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/itc/symbol/std-black" rel="nofollow">ITC Symbol Black</a> and I noticed in researching Symbol as well as other faces in the same vein that there is a difference between the solidus glyphs and the mathematical slashes. It looks to me like many of these fonts are using generic math symbols that don't match the design of the rest of the font. Maybe I'm overthinking but is there some kind standard when it comes to math symbols like the division slash, or is it fine to use the same glyph for the solidus and the math slashes?</p>
