      <p>Hrant: <em>I personally don't think anonymous people should have privacy rights - that's like eating your cake and having it too.</em></p>
      <p>Uh, no. It's like taking proactive steps to be private. Are you saying that a right to freedom of movement should only be had by people who don't move?</p>
      <p>Now, I happen to think that being anonymous on, say, Typophile, is lame, but there are plenty of places in the world in which anonymity or pseuodonymity is a matter of personal safety, and is a necessity in part because privacy rights are abused or denied. And as the Google/YouTube account linking debacle shows, there may be good reason to be anonymous even in places where you don't think what you say might get you into trouble.</p>
