      <p>John, I did notice it was a pretty high-compression JPEG (from the cruddy white-on-gray text on the left) but I'm assuming that can be reproduced reliably enough to be able to reverse-engineer it.</p>
      <p>George, thanks for that - interesting.</p>
      <p>Justin, some offensive/incriminating (live) content has been removed since the screengrabs were made, and some people are hoping to salvage the reputation of a certain (minor) political aspirant by casting doubt on the authenticity of the screengrabs. My image above judiciously avoids the offending passage.</p>
      <p>The more interesting aspect of this story BTW is that apparently this person's YouTube account was an anonymous one when the alleged offensive comments were made, but some time after Google acquired YouTube he decided to link the two accounts... not realizing that would cause all his old YouTube comments to get a real name! :-/  I wonder if somebody will sue somebody for that "privacy violation". Check that: I wonder <em>when</em> somebody will sue somebody for that "privacy violation". I personally don't think anonymous people should have privacy rights - that's like eating your cake and having it too.</p>
      <p>So the moral of the story might be: Don't make anonymous comments - it's better to face the consequences of your desire to express your controversial opinions immediately... Or an even a better one: Don't run for public office because even if you did nothing wrong Democracy will make you pay.</p>
      <p>hhp</p>
