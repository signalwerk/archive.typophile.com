    html: |-
      <p>Much better! I feel one shouldn't innovate for it's own sake. Frutiger is a classic, and like all classics it still remains quite robust.</p>
      <p>A couple of observations:</p>
      <p>1. A dark, warm-grey may be an improvement over black. </p>
      <p>2. You'll have to evolve some sort of relation between the logo and the descriptor (Independent Marine...). Right now it's somewhat hanging in the air. There's also too much contrast in scale between their sizes. In a business card, for instance, the descriptor may go too small. </p>
      <p>3. The kerning looks a little awkward in a few places. You may want to work on the first A (CAP) and the R which comes right after the O (compass).</p>
    html_clean: |-
