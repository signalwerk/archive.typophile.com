      <p>"How about this?"<br>
      Nice concept. however there's too much happening. Since the compass is your focus, it may be better to have a nice unfussy sans serif. Perhaps the third colour (the brown) and the staggered layout could be reconsidered.    </p>
      <p>"I wonder if the font could be more “wavy” to reflect the maritime business they’re in."<br>
      That may be making it too literal. Unless you want to make that your concept and not have the compass at all.</p>
      <p>" Do you think it will still be visible when scaled down to smaller sizes"<br>
      Shouldn't be a problem. You might need to tweak the forms a bit, but very do-able.</p>
