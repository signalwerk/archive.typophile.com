    <p>Hi,</p>
    <p>a client asked me to re-design their logo. The company is an "Independent Marine and Cargo Surveyor Company" based in Germany and I am going to create a new logo and website for them. For the website, I will probably go for a blueish colour scheme, with images of cargo ships and containers. What I still haven't found though is a font for the new logo. It should have a somewhat maritime or wavy feel to it, maybe a bit like the British Airways typeface, but more focussed on shipping and everything that's involved with it. Can anybody give hints as to what typeface I should use? Thanks for any input...</p>
  html_clean: |-
