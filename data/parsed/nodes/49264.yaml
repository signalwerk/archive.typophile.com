      <p>Hi all,</p>
      <p>it turned out that after some research we still didn't find any font that was working for us at all. So, loosely based on Eurostyle, and on our requirements – it had to be bold, striking and compatible with a western font – we comissioned a custom-built typeface for the client, including three weights and Italics.<br>
      It was primarily used in news graphics, channel programming and on-air menus, but soon found it's way to the website, you can see some examples here: <a href="http://www.1tv.ge" title="http://www.1tv.ge">http://www.1tv.ge</a></p>
      <p>Unfortunately the font is used exclusively in-house and not out there, as far as I know.<br>
      We hired a native speaker/reader and tried our best to judge the effort, but if there are any mother-tongue readers out there, it would be interesting to hear their opinion about it!</p>
      <p>Keeping my fingers crossed for more good fonts in that alphabet,<br>
      Thomas</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Eurostyle_GEO_6330.jpg"></div><p></p>
