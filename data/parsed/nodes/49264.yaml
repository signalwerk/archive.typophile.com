    html: |-
      <p>1) I'm not an expert, so not the best person to give feedback. I have however made two Georgian fonts (one a "progressive" display face*, the other a run-of-the-mill text face), and as a non-native I appreciate what sorts of issues can go ignored (I was lucky to have the help of a semi-native professor at UCLA, as well as a native reader) and I see some of that here.<br>
      2) A native reader helps a lot when you're lacking a native type designer, but it's not enough by itself.<br>
      3) Most of all: it's too late. Any feedback at this point is largely academic. Certainly not a total waste, and it's nice to see a post-factum request for feedback, but I'd rather spend my own (inadequately managed) energies on things that can make a difference to a lot of people.</p>
      <p>* <a href="http://themicrofoundry.com/f_akhalkalak.html" title="http://themicrofoundry.com/f_akhalkalak.html">http://themicrofoundry.com/f_akhalkalak.html</a></p>
      <p>hhp</p>
