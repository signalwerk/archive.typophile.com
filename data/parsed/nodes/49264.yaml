      <p>Well, you're right there with me Hrant. Usually if the project's deadline allows it, I naturally prefer a discussion during the progress. Since my team initially didn't plan to create a custom font, we didn't have the time to develop the font with the help of expert eyes and the broader discussion as we have it here.<br>
      Given the enormously short development time, I'm really happy with the results, as is the client. But I'm sure that the font is imperfect. Meticulous analysis would be disproportionate - it's too late after all. However, if some native reader or native designer stumbles upon this discussion thread, I'd still be very interested to hear which impression it left on them.</p>
      <p>Through a partnering company in Russia, we got in contact with Merab K. Getsadze who is the type designer. He is as far as I know Georgian or of Georgian descent.</p>
