    <p>Dear typophiles,</p>
    <p>for a special project I am currently looking for a contemporary <a href="/wiki/Georgian" class="freelinking" rel="nofollow">Georgian</a> (=Mkhedruli) font.<br>
    Are there any professional (maybe even screen optimized) font famlies out there, that offer different thicknesses or "caps"? Alternatively, is there any family or cut of a solid "western" font (like Helvetica, Meta, Frutiger...) that includes letters of this exotic alphabet?</p>
    <p>Thanks in advance!<br>
    Thomas</p>
  html_clean: |-
