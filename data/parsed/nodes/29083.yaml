      <p>Certain letters that I didn't see in your sample would make identifying it easier, such as C, Q, y, M, K, R and W. You could try using the <a href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>, if you have some of those letters, since they are shown in the key samples. You can select 'close' ones and compare them further against each other, including the italics for many of the fonts.</p>
      <p>- Mike Yanega</p>
