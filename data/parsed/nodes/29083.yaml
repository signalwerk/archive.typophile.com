      <p>I think <a href="http://www.myfonts.com/fonts/bitstream/caslon-old-face/" rel="nofollow">Caslon Old Face</a> looks very close. Notice the top of the A, and certain other earmarks, such as the Roman and italic 'g'. There is a Lanston version called Oldstyle 337, which may be closer, looking at the FontBook sample, but I couldn't immediately find it online. There is likely to be a disconnect between existing digital type and the metal type that was probably used for printing the books, but that is my pick so far, as the closest version of Caslon.</p>
      <p>- Mike Yanega</p>
