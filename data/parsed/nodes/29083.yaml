    <p>Hi, I'm new here.<br>
    I have admired for a long time Oxford University Press books (not talking about World's Classics), particularly books published in the '60s and was wondering<br>
    if anyone here is familiar with them. It's a font I've seen in most of their books from that period, it is perhaps a version of garamond or janson.<br>
    I'll try and post some photos tomorrow if no one is familiar with the topic offhand.<br>
    Cheers.</p>
