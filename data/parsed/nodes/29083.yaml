      <p>I'm reading Trevelyan on <em>England Under Queen Anne</em>, Oxford U P 1930, and found this discussion after wondering about the typeface.</p>
      <p> This book (see link below, I'm not grasping the HTML instructions below) suggests that the font may be a variant of Caslon called "Imprint," designed in 1913 by Ernest Jackson and Edward Johnston; it "later became the favorite typeface of Oxford University Press." The capital "J" in my book resembles Imprint more than it does the Caslon Old Face.</p>
      <p><a href="http://books.google.com/books?id=qrElYgVLDwYC&amp;pg=PA389&amp;lpg=PA389&amp;dq=%22oxford+university+press%22+caslon+font&amp;source=bl&amp;ots=4hvBt_6XLO&amp;sig=Dhp-t2e20WrcJsG-jO9s0vSWcWg&amp;hl=en&amp;sa=X&amp;ei=vxlfUoD3HebQ2QW-moGYDw&amp;ved=0CDoQ6AEwAg#v=onepage&amp;q=%22oxford%20university%20press%22%20caslon%20font&amp;f=false" rel="nofollow">Fonts &amp; Encodings</a></p>
