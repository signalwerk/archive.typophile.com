    html: <p>The Jpeg process has been unkind to both, but to my eyes, the one on top's fuzzy around the edges. It was probably screenshotted from a nice scan and sampled down. <br> <br>The one on the bottom shows a *great* sharp cleaving to the pixel, looking a lot more like print to my eye. If "soulless" means ignoring subtleties on the altar of Speed and Progress, sure, the above sucks more. The only other difference I can see is the spacing. <br> <br><img src="http://www.typophile.com/forums/messages/4100/16676.gif" alt="difference filter between old and new logos"> <br>The upper one was a tad bigger so I scaled it down - still - I can't really see the different cut to Franklin onscreen. The only difference besides the fuzzy edges is the obvious letterspacing. No comment on that though I'm reading <u>Stop Stealing Sheep</u> (great stuff). <br> <br>'Hideous' means shockingly ugly. Both designs are competent and have similar 'boumas'. The difference seems more of a gnat's whisker/RCH. Please, someone scan the new and old ones and REALLY compare the difference.</p>
