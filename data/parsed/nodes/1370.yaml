  html: <p>Jared posted this to News and Events. Discuss it here. <br> <br><img src="http://www.typophile.com/forums/messages/4100/16672.jpg" alt=""> <br> <br>Why is the logo on top "digital," "soulless" and downright  <br>"hideous," while the logo on bottom shows "character,"  <br>"warmth" and a "profound respect for the past?"   <br>  <br>Read <a href="http://www.nytimes.com/2003/09/21/arts/design/21BLUM.html?ex=1065148517&amp;ei=1&amp;en=1be8df3acdcde974" target="_blank">The Modern's Other Renovation</a> by Andrew Blum. <br>(The New York Times)</p>
