      <p>A couple of things you can do in this case:</p>
      <p>1. If you don’t want the dash to be at the beginning of the line at all, insert a discretionary linebreak after it; this will almost always cause it to jump back up to the previous line. Only if that line is too tight already will the dash be left on a line by itself using this technique.</p>
      <p>2. If you don’t mind the dash being at the beginning of the line, but just don’t want it to hang in the margin, insert a discretionary linebreak before the dash, and then insert a hairspace or zero-width space.</p>
    html_clean: |-
