      <p>Our journals use space before and after en-dashes for stylistic reasons, and we too ran into the problem of lines beginning with dashes in InDesign.</p>
      <p>We adjusted text production so that we always have non-breaking spaces before en-dashes, and that solves the problem nicely.  If you can’t do it on the pre-production side, a simple InDesign script to replace (space)(your choice of dash) with (nonbreaking space)(your choice of dash) should work.</p>
      <p>I know that in Days of Yore, some programs would not recognize the nonbreaking space as a “space” and not extend or contract it for justification or best glyph placement.  I don’t believe InDesign has ever had that problem.</p>
