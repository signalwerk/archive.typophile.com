    html: <p>There are different rules with different languages. In Finnish the common practice is, that en-dash – marking an addition, quote etc – should be at the start of the line. Otherwise it can be confused with hyphen. Usually it’s flush left, I have never seen it in the left-hand magrin.  There are a lot of long words in Finnish (eg. saippuakauppias, a nice palindrom), so we use hyphens a lot.</p>
