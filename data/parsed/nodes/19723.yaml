      <p>John, </p>
      <p>a much better solution is to mark the space before the endash with the “No Break” attribute in InDesign. BTW, due to the French Resistance (i.e. intense lobbying of French users of InDesign), the InDesign developers team made the silly decision of defining the non-breaking space as fixed-width. For Czech and Polish, there is exceptional treating and when the text is tagged as being set in one of these languages, the non-breaking space is variable-width. I always felt it’s a silly decision: non-breaking space should always be variable-width just like the normal space. </p>
      <p>All: </p>
      <p>Henryk Jursz has written an excellent free script for InDesign called UseMyTypo. It’s written in JavaScript and works in both Mac and Windows versions of InDesign CS and CS2. The script does tons of useful microtypographic stuff: removes double-spaces, replaces double hyphens and hyphens between digits with proper long dashes, reformats quotation marks, recognizes e-mail addresses and URLs and applies custom styles to them, replaces regular spaces with non-breaking spaces in specific situations (between digits, before one-letter words or long dashes, between digits and certain abbreviations) and finally replaces the (non-stretching) non-breaking spaces into (stretching) normal spaces with the “no break” attribute turned on. </p>
      <p>You can download the script for free from:<br>
      <a href="http://www.jursz.com/skrypty_free_en.htm" title="http://www.jursz.com/skrypty_free_en.htm">http://www.jursz.com/skrypty_free_en.htm</a></p>
      <p>Download the .zip file and place the extracted files into the Presets/Scripts/ folder inside of your InDesign folder. Then the script will become available from the InDesign Scripts palette (Window/Automation/Scripts). </p>
      <p>Adam</p>
