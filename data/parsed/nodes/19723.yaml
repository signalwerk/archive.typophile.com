      <p>I know the rule, and it makes sense if a dash introduces an addition to a sentence:</p>
      <p>XXXXX XXXX XXX XXXXXX X XXX<br>
      XXX XXX XXXXX XX XXXXX —<br>
      XXXXXX XXXXX XXX. XXXXX XXX<br>
      XXX, XXXXX XXXXX XXX XXXX.</p>
      <p>But sometimes it is hard to avoid a dash at the beginning of a line. Despite Tschichold and Bringhurst.</p>
      <p>In case that two dashes contain an inclusion, I’d place the first dash at the beginning of a line even if there is some space in the preceding one — this makes clearer that the two dashes are a pair and include something:</p>
      <p>XXXXX XXXX XXX XXXXXX. X XXX<br>
      XXX XXX XXXXX XX XXXXX XXXX<br>
      — XXXXXX XXXXX X — XXXXX<br>
      XXX XX. XXXXX XXXXX XXX XXXX.</p>
      <p>[removed silly suggestion]</p>
