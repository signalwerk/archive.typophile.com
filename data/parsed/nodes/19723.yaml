      <p>I often wish that there was a way to “tweak” InDesign’s optical margin settings. Some punctuation hangs further out than others. Obviously Adobe’s made some decisions about what they think looks optically correct, but with some of the punctuation (in some settings), it seems to hang too far into the margin. </p>
      <p>Ideally, we’d be able to set how optically far out each piece of punctuation sits — setting a different global margin adjustment for quote marks than the adjustment it uses for a dash.</p>
