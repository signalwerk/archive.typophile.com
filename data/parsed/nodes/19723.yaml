      <p>There are different rules with different languages.<br>
      In Poland the em dash, followed by a en space, is the method of marking dialogue. New paragraph with dialog en dash at the beginning of the line should always has left indent.</p>
      <p>In case that two dashes contain an inclusion. The em dash should never be set at the beginning of the line. All dashes inside the paragraph should be  set inside the line or at the end of a line.<br>
      In InDesign we f&amp;r all ’space’^_’space’ to ^s^_’space’ and after that we f&amp;r all ^s to space with NO BREAK attribute. Because of fact that the ^s has always fixed width when you justify line.</p>
      <p>When we have dash inside the word like for example ’pre-digital’ in English, we have to hyphen such word first at the dash. And in this case we need to repeat the dash at the beginning of the next line.<br>
      That’s why in such words we have to f&amp;r all ’–’ to ^-^~.</p>
      <p>InDesign hanging punctuation method is very hard to use in this case. Right margin is rather OK, but at the left margin I have to use my own patent. Before the beginning em dash in dialog paragraphs I always set ZERO WIDHT SPACE [u+200B]. </p>
      <p>The same you can do before the bulets, numerals, quotation marks  and any characters at the begining of the line and at the begining of the paragraph.</p>
