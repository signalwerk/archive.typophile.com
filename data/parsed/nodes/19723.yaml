    <p>I often use Indesign’s optical margin alignment feature in book settings. I like the way the right-hand margin looks with punctuation hanging out a little. But I also sometimes get en dashes (with a space on either side marking parentheses) that jut out into the left-hand margin. I’m not sure how I feel about this. Is there historical - pre-digital - precedence for it? Could you/ would you do it with a letter press for example? Interested to hear what people think.</p>
    <p>Toby</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/20257" class="topic-previous" title="Go to previous forum topic">‹ Grids</a> <a href="/node/20323" class="topic-next" title="Go to next forum topic">Fonts similar to Garamond Simoncini ›</a></div>
