      <p>I was a bit too fast. The current version of UseMyTypo allows you to automatically insert non-breaking spaces *after* specific one-letter words but not before long dashes. You need to manually run Find/Change and replace ” ^&gt;” by “^s^&gt;” or ” ^m” by “^s^m”, and then run the UseMyTypo script which will replace the (non-stretching) non-breaking spaces into (stretching) normal spaces with the “no break” attribute turned on. This way, you will prevent long dashes to appear at the beginning of the line when they’re preceded by a space. </p>
      <p>I did send Henryk a suggestion to add this particular feature to his script. Perhaps he’ll add it in near future. </p>
      <p>A.</p>
