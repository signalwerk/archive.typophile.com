      <p>Hi Nick - So I guess my question is just about those dashes. I’m quite happy with quotation marks hanging out from the left margin.</p>
      <p>You wrote:</p>
      <p>&gt; But you should never start a line with a dash, if it occurs in the middle of a sentence.</p>
      <p>This is news to me, though not something I’d ever thought about until InDesign started sticking them out into the margins and made them more noticeable. I’ve just now had a look at Bringhurst to see if he has anything to say on it. I don’t think he does, but I did find several examples of lines starting with dashes.</p>
      <p>Do other people on the list use this rule? I’d think it would be kind of tricky to enforce ...</p>
      <p>Like I say I’ve only noticed it since I started using InDesign. And now I’ve grown quite used to it – I’m only thinking about it now because a proofreader of a book I’m working on brought it up.</p>
