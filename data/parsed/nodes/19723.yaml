      <p><em>Where necessary and when economically practical punctuation such as commas, periods, hyphens, apostrophes, quotes, asterisks, copyright and register marks should be hung outside the measure on flushed right settings. Opening quotes should be hung outside the measure left.</em></p>
      <p>—Howarth &amp; Smith’s New Standards for the Printed Word, Carl Brett, Toronto, 1968.</p>
      <p>But you should never start a line with a dash, if it occurs in the middle of a sentence.</p>
