    <p>hi there, i’ve been using suitcase for a wee while now (on os x) and have amassed far too many downloaded fonts. i try using suitcase to create a font catalog that i could perhaps print off, but it always finds a font that is corrupt and the whole thing goes bung (now there’s a technical term). is there another piece of software or approach that other smarties out there use to do this sort of thing.</p>
    <p>thank you!</p>
