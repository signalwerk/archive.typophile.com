    html: <p>I agree with both other postings. You have accomplished exactly what you didn’t want to do. While your design is stylistically attractive, it looks geared for the extreme mountain biker, not a seasoned NYC cyclist nor someone new to biking as an alternative means of transportation. It does not say “safe cycling”. Step back from it for a little bit and look at it with fresh eyes. I understand you’ve been through tons of versions already but ask yourself the question Does this logo really say what we want it to say, or does it just look cool?</p>
