    html: |-
      <p>It seems to me your target market - those most likely to consider cycling to work - are the environmental greenies. You know, the type that believes if we all rode bikes instead of cars, it would bring about world peace AND bring John Lennon back to life?  To that end, if I were you, I’d go walk through Whole Foods and look at logos. This logo is more grungy dirt biker than enlightened urban hippie.</p>
      <p>Of course I could be characterizing your target market entirely wrong?</p>
      <p>Also, at first glance, the ring immediately evoked a steering wheel on a sports car; and, don’t tell anyone, but I consider myself and enlightened urban hippie...</p>
      <p>One more idea; have you considered an “alternative to a taxi” concept? Perhaps a campaign built around why bikes are better than taxis?</p>
