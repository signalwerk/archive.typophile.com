    <p>Hello all,<br>
    I am tasked with designing a logo for a bicyclist outreach campaign for a non-profit in New York City.  The targeted audience is both seasoned cyclists and those contemplating shifting modes to cycling as a form of commuting.</p>
    <p>It shouldn’t be too esoteric (ie. not using bike parts that only real bike fanatics will be able to read).  </p>
    <p>Ultimately, the goal of the campaign is to highlight both safe cycling as well as the upside of biking.  </p>
    <p>The logo should be friendly, inviting and slightly playful.</p>
    <p>We’ve been though a million iterations and the consensus has been to follow in the direction attached below.  If anyone has any suggestions for further font, color or layout directions, it would be greatly appreciated. </p>
    <p>Thanks...</p>
