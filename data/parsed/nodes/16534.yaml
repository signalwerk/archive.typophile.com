      <p>I love edutainment - it's just had to pull off well, to strike the needed balance between gaminess and learning. But I think you're doing pretty good, overall. Some comments:</p>
      <p>Face Off: Too slow-paced. Put a count-down. Or maybe even a way for the grid to "regrow", increasingly quickly, so you could actually lose (if it fills up again). Which means you might have to start with the top row empty. BTW, the little "Font Library" sidebar thing is cool.</p>
      <p>Serif: Fine, except it's hard to judge good/bad kerning at such lo-res. You might turn it into a (quickly-changing) sequence of larger settings instead?</p>
      <p>Type Invaders: Looks cool! And those daggers are great. The thing is though, although the instructions contain great education, the game itself is just Space Invaders; it would be much better to put "educational decisions" in the actual game as well. Lastly, a small thing: that pixelfont is too blurry.</p>
      <p>Another thing: it's taking too long just to bring up the "Loading..." messages.</p>
      <p>Anyway, I hope I don't seem to negative, because<br>
      I think you're doing a really good thing here.<br>
      So please make more!  :-)</p>
      <p>hhp</p>
