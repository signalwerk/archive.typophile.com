      <p>Hi Norbert,</p>
      <p>Interesting that the "If Typography was a video game" discuss appeared two days after my thesis defense. I should have started that discussion back in January.</p>
      <p>The topic of whether education games can really be effective in teaching typography is untested and why I developed these. After developing these, I am interested in whether anyone has used or is willing to use <a href="http://www.typehype.net" title="www.typehype.net">www.typehype.net</a> in the classroom. I want to measure the level of success. I feel that for game-based learning to be truely effective, each game must have clearly defined learning objective(s).<br>
      _______________________________________</p>
      <p><strong>Problem Statement</strong><br>
      College undergraduate communication design students are producing deficient typography. These deficiencies are specifically related to the rapid identification of typeface design and inplemenation of kerning and proper typographic punctuation. </p>
      <p><strong>Root Cause Analysis</strong><br>
      Since the computer has been integrated into design education, there has been more of an emphasis on software competency than that of letterform structure and typographical nuances. The design industry has pressured educators to mold students who are technically adept by raising the entry-level job requirements. In addition, typography was taught mainly through lecture and hand skills however this methodology does not attract current design students due to the expanse of technology in existence today.</p>
      <p><strong>Needs Analysis</strong><br>
      Due to college undergraduate communication design student’s technological capabilities and its saturation upon their social lives, design education would benefit by incorporating an alternative teaching methodology that appeals to the student’s learning and life styles.</p>
      <p>_______________________________________</p>
      <p>My intention of applying game-base learning was sparked by analyzing the habits of the 18-22 design student population. These individuals are "plugged in" 24/7. The games are to increase their knowledge on a more subminal level. Each style of game was chosen due to its addictive quality...come on who doesn't love a little Tetris or Bejeweled. All of the rewards in my games are used to help the user play the games better by reiterating guidelines of "good" typography. </p>
      <p>I would love it if my students (...or anyone else's) would take a break from their design projects and play a little "Serif" or "Faceoff" to take their mind off things. I hate to say it but...edutainment may be part of the future.</p>
