    html: "<p><a href=\"http://www.myfonts.com/fonts/linotype/neuland/\">Neuland</a> (or <a href=\"http://www.myfonts.com/fonts/p22/koch-nueland/\">Nueland</a>) might work in a pinch. Letraset's <a href=\"http://www.myfonts.com/fonts/letraset/arriba/\">Arriba</a> also comes to mind. <br> <br>As for Image Club faces (besides the aforementioned Fajita) you could try the Chilada family: <a href=\"http://www.imageclub.com/font/405825\">Uno</a>, <a href=\"http://www.imageclub.com/font/405826\">Dos</a>, <a href=\"http://www.imageclub.com/font/405827\">Tres</a> &amp; <a href=\"http://www.imageclub.com/font/405828\">Cuatro</a></p>"
