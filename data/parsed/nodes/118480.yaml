    html: |-
      <p>Short answer: I don't know.</p>
      <p>Long answer: As far as I've been able to tell, InDesign only creates separate groupings for Arabic, Hebrew, Thai, Chinese, Japanese, and Korean. Everything else simply gets grouped together with Latin. I suspect this may have to do with the fact that the menu was designed with Adobe fonts in mind, and that the menu architecture was finalized sometime after the release of Adobe Thai but before the release of their more recent Indic fonts. Presumably Greek and Cyrillic don't get separate menu ranges since all adobe fonts which cover these languages also cover latin.</p>
      <p>André</p>
