      <p>I am pretty sure Andre's explanation is right.</p>
      <p>I was involved in vetting the heuristics back in the day, with Sairus Patel who was creating them.</p>
      <p>In the end, I came to the conclusion that <em>any</em> such effort to simply segregate the font menu into static sections based on language support was doomed to create more problems than it solved, but I was told the client apps insisted on it. So here we are.</p>
      <p>Allowing the user to filter by support for some particular writing system or language would be cool, though. But a lot more work to implement the interface.</p>
