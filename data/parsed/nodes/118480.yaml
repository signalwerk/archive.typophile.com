  html: <p>On my system, the Adobe InDesign font menu is sorted according to supported languages. Japanese, Chinese, Hebrew &amp;c. has it’s own list below the Latin, but when I tried to install a Bengali font, it sorts under Latin. Can anyone enlighten me on exactly how the font menu and encoding settings are linked?</p>
  html_clean: <p>On my system, the Adobe InDesign font menu is sorted according to supported languages. Japanese, Chinese, Hebrew &amp;c. has it’s own list below the Latin, but when I tried to install a Bengali font, it sorts under Latin. Can anyone enlighten me on exactly how the font menu and encoding settings are linked?</p>
