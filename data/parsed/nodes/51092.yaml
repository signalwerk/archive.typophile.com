    <p>So, I'm starting a redesign of a boutique winery logotype, which was quickly thrown together years ago in Word using Kuenstler Script, and some Times New Roman (Windows default fonts). </p>
    <p>The label looks terribly generic, but I'm thinking to refine the type overall and give the composition a designer's touch because the winery has some brand equity in the design.</p>
    <p>If the timeline wasn't so crazy, I would really like to hire out the script to a calligrapher to get a totally custom and ownable logotype, I don't think I know enough about scripts to do it myself from scratch. I need some suggestions of types that look similar to Kuenstler, but are more unique and boutique than the Windows-installed font. I'm familiar with Shelley and Novia from other threads...</p>
    <p>What do you guys think?</p>
