      <p>thanks everybody! Epixs, your stuff is really nice, if we had more time, I'd consider sourcing the script out. The logotype needs to be very close to their existing, but with a little more character. I'm really liking Burgues Script for the alternates and will probably go with that, Shelley is pretty close as well.</p>
      <p>Generally speaking, are there 'rules' with how you should design flourishes and connect letters? It seems like calligraphic lettering is more an art and there aren't necessarily hard/fast rules or a 'correct' way of going about rendering a word. I have a great Doyald Young book at home that I'll consult, are there any other resources I should refer to when tackling this logotype?</p>
