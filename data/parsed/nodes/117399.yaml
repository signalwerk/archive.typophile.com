    <p>I have an antique custom-lettered / engraved book cover that I'm trying to trace and use the general style of the type to create a logo for a band.</p>
    <p>Right now I'm trying to turn a capital P into an R. I'm not sure if this is the kind of leg I should use or not, but so far it's the only one that has looked ok. Hoping for some advice / critique on this. Thanks so much!</p>
