    html: |-
      <div class="comment-spam-body"><p>Your design of the leg has a lot of flair, No matter how you make it narrower it's going to loose some of this. Here is one possible starting point. This is clip &amp; paste on a jpeg image. In vector the curves of the leg could be improved considerably.</p><div class="imageWrap"><img src="http://typophile.com/files/P2Rtest_4311.jpg"></div><br>
      The bowls on _R_ are often do not descend as far as the bowls on _P_. An idea might be to shift the bottom of the bowl on _P_ upward before doing this type of leg for the _R_.<br>
      Don<p></p>
      </div>
