    html: <p>Thanks George, I appreciate the useful feedback. Spot on. I'd love for you to take a look at the finished design when it's done (I'm about 1/3 of the way through the rest of the letters now) and tell me if you still think the leg extends too far. I agree with you that normally it shouldn't, but as the leading character in the logo I wonder if it won't end up looking better over-extended as it is now. Can't wait to get the rest of the characters finished so we can see in context!</p>
  - id: 581175
