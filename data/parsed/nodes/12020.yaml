    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Dear Sarah</strong></p>
    <p>Dear Sarah is a <a href="/wiki/Victorian%20era" class="freelinking" rel="nofollow">Victorian era</a> <a href="/wiki/handwriting%20font" class="freelinking" rel="nofollow">handwriting font</a> designed by <a href="/wiki/Christian%20Robertson" class="freelinking" rel="nofollow">Christian Robertson</a> in 2004. The typeface is based on his own handwriting and named after his wife, Sarah Robertson. Dear Sarah was developed in both <a href="/wiki/AAT" class="freelinking" rel="nofollow">AAT</a> and <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> versions.</p>
    <p>Dear Sarah is sold exclusively through <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://www.typophile.com/dear_sarah" rel="nofollow">Dear Sarah</a></p>
