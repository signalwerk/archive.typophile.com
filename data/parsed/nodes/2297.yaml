    html: <p>Cocon rules. <br> <br>Bloemsma has in fact been fighting the backwards lean in his design style for a while - and with Avance has found one solution. But a few degrees is too much, try half or one degree. Syntax for example leans forward by half a degree, while Seria's "upright italic" leans by [an average of] one. <br> <br>That's unless you want to make the lean visible. In that case I've found that about 3 degress is the comfortable minimum (at normal reading sizes). <br> <br>hhp <br></p>
