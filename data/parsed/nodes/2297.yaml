    html: "<p>The color combo and layout seems awfully familiar. IIRC there's a similar logo in use by some IT or management consulting outfit but I can't for the life of me remember which...not terribly helpful, I suppose, but maybe something to research if you haven't. Or not. <br> <br>On a more substantive note, I agree with Eduardo regarding Cocon, though I also like Dutch 809, modulo the ampersand which isn't among my favorites. <br> <br>The symbol has been approved, so I probably should keep my mouth shut. Discretion, however, is not one of my virtues. So, what is it? How does it relate to coaching?  <br> <br>(aside: am I the only one whose skin crawls upon reading/hearing that word? too much time on Ryze and eCademy amongst the throngs of 'life coaches', perhaps) <br> <br>Back to substance, I'm not feeling any real relationship between it and the type in any of the  mooted solutions. Perhaps it should be closer to the type? The two elements just seem to me to 'float' in space. I'd try mucking with both larger and smaller text and see what that does. <br> <br></p>"
