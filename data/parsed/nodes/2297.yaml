    html: <p>Hey. <br> <br>The Cocon definitely gives a more informal feel, it's warmer. But is it just me, or does it feel like it's leaning to the left? I think the logo is pulling it some, and combined with the terminals... <br> <br>Is it heresy to suggest putting a few degrees of right lean into it to optically straighten it? <br> <br>I do like the logo. It looks like 4 people in very nice chairs gathered around a very small table, or maybe a big group hug. <br> <br>David Roughs <br></p>
