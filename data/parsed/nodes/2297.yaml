  html: <p>Hi people, <br> <br>I'm doing an identity-package for a newly formed company called Hoffmann &amp; Rich. They do coaching-tasks for medium and large companies - a very experienced couple <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Well, so far the colours and the symbol have been approved but I could really use some feedback on the typography. Any suggestions for alternatives? <br> <br>As always, thanks for your help and time! <br> <br>Cheers, <br>/Henriko <br> <br><img src="http://www.typophile.com/forums/messages/4100/21736.jpg" alt="Hoffmann &amp; Rich - various logos"></p>
