    <p>A friend of mine, who shall remain nameless, recently mentioned that he thought there were four American type foundries that were truly top notch. </p>
    <p>He listed Font Bureau, House Industries, H&amp;FJ, and Emigre, and implied that there weren’t really any others that came close.</p>
    <p>I mentioned a couple that I thought were contenders, but he contended that these four were THE rock stars, and that any other than them were more like ’indie rock.’</p>
    <p>There are obviously lots of talented individuals outside of these, but what about other companies?</p>
