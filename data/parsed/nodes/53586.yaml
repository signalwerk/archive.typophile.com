      <p>Saw this thread and figured I'd chime in with my .02 cents although some of you are looking to have this thread end. However, <a class="freelinking external" href="http://www.brandpackaging.com/CDA/Articles/Packaging_that_Sells/BNP_GUID_9-5-2006_A_10000000000000504262" rel="nofollow">Brand Packaging</a> has an interesting ad/article featured on page 40 of last month's issue regarding <a class="freelinking external" href="http://www.glowelle.com/home.html" rel="nofollow">glowelle</a> by Nestle. There seems to be a shifting to what is referred to as Beauty Juice. It's possible that Pepsi may be considering the jump to a different audience.</p>
      <p>The new design may be more palatable to an older crowd rather than the younger generation fixed on energy drinks. While I think the old design was great for a more "sporty" look, this one may just look a bit dull up against other brands with bold reds, and yes...the use of gradients and shadows. But if the move is to produce a product more appealing to a different audience, then it's a good move; if not then it won't get much attention save for those who prefer the contents rather than the image. </p>
      <p>Glowelle's bottle was created by <a class="freelinking external" href="http://www.vitro.com/vitro_corporativo/ingles/portada.htm" rel="nofollow">Vitro</a> and the bottle design by <a class="freelinking external" href="http://www.kuproductions.com/" rel="nofollow">Kenneth Ussenko Productions</a>. </p>
      <p>I would rate this design logo at a 6.5 adn the type layout at a 7.5 on a scale of 1-10 for many reasons already listed here in regards to the icon and typeface used.</p>
