    html: <p>A friend and I were actually discussing the new logo when we stumbled upon it in the supermarket a few months ago. I am a fan of the old logo and its two-dimensional look. But it has been around forever, at least as far as I can remember, so maybe my experience with pepsi is limited compared to those who are "older" than I am. I think that the new logo works better on some packaging versions more than on others. One thing that was off-putting to me was how on the regular cola packaging, the shade of blue that is used in the logo is different than that of the rest of the box/can. Whereas on the silver (diet) packaging it looks right at home - clean, modern, time for change. Pepsi Corp. has been revamping several of its logos and packagings lately. And while some enjoy the little swerve that the 'e' has, imitating the circular logo with its 'swoop', I really, really don't like that at all. Had I been in the room when they were making decisions on this I would have insisted that they not change a thing.</p>
