  date_raw: 16 January 2009 - 5:26pm
  votes: 0
  html: |-
    <p><img src="/sites/default/files/old-images/pepsi_5268_4921.jpg"></p>
    <p>I was in the supermarket last week and had the chance to take a photo of the new PEPSI logo side-by-side with the old version (see attachment).</p>
    <p>Do you feel it's a successful redesign? If you had to grade it, would would you give it? </p>
    <p>I've read reviews of this new logo on other websites and to my surprise I found that many people didn't like the change. For those who are wondering, the PEPSI circle is supposed to be a smirk (or smile face). There are two other PEPSI products that have similar circles, meant to express a smile, to a varying degree.</p>
    <p>In my opinion, I love the new sans-serif geometric typeface in all lower case. I think it's forward-thinking. Does anyone know what font that is? The salient feature is that lowercase "e."</p>
    <p>My score: A</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Pepsi%20logo.jpg" width="1600" height="1107" alt="">
