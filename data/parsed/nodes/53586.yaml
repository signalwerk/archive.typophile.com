      <p>I don't think getting rid of the gradients automatically makes the new identity an improvement.</p>
      <p>Personally, I think pretty much everything of the new logo(s) is poorly executed. The smile concept of the logo doesn't really work; it hardly resembles a smile. The only nice element I can see in these is that the logo changes for the different types of cola.</p>
      <p>Then the typography... it just looks slightly off. It tries too hard to fit with the logo. But the waving crossbar of the 'e' is over the top. It's just one element too many in my opinion. The letters themselves also became strangely geometrical because they tried to fit it to the logo.</p>
      <p>Underconsideration's <a href="http://www.underconsideration.com/brandnew/archives/brand_new_best_worst_2008.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">'Best &amp; Worst of 2008'</a> placed it on no. 1 of the Worst section, rightfully so in my opinion. More posts about Pepsi on Underconsideration <a href="http://www.underconsideration.com/brandnew/archives/the_new_pepsi_challenge_guess.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> and <a href="http://www.underconsideration.com/brandnew/archives/pepsi_revealed_sort_of.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
      <p>It seems they are trying to follow <a href="http://www.underconsideration.com/brandnew/archives/the_real_thing.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Coca Cola</a> again by going back to a more classic, retro look. Where Coca Cola succeeds, Pepsi fails.</p>
