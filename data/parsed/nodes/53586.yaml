    html: |-
      <p>The mark itself didn't need a redesign, but the new asymmetry feels fresh. (@mili I laughed about the airline comment, I thought the same thing). To Nick's point, this really is a new identity system, not a logo redesign. It should be considered as a whole, and is a huge improvement over where they've been. All over the place. Pepsi now has some class, in its own way, without having to copy Coca Cola's retro (classic) look. </p>
      <p>As for the history of Pepsi-Cola, I agree it had some class back then as well. But when you're number two, you have to diferentiate and you have to try harder. Pepsi gets a high mark from my point of view on both counts.</p>
      <p>I enjoyed discovering that the mark changes with each drink in the Pepsi line-up -- although subtly. The unity of the new Pepsi line makes the Coca Cola, Vanilla Coke, Diet Coke and Coke Zero brands seem disjointed by comparison. Consider especially how the caffeine free (gold) flavors have always been the ugly after thought of soda brands. Pepsi has made caffeine free as appealing as the rest, and if not, more appealing. (I predict a resurgence of gold and white, in part thanks to the new "<a href="http://www.youtube.com/watch?v=qM5_r786kUQ">white gold</a>" milk campaign.)</p>
      <p>The advertising release on the other hand is odd to me. The advertising features a color palette foreign to any other Pepsi material (reminds me of Comcast's new FanCast site and palette). The advertising gives no mention of Pepsi, only vague references to love, sweet, pop, xoxo, &amp;c. It generates intrigue, I'm sure as it's intended, but as Mili said earlier it looks like an airline mark.</p>
      <p><a href="http://www.flickr.com/photos/joepemberton/3216089966/" title="New Pepsi mark by Joe Pemberton, on Flickr"><img src="http://farm4.static.flickr.com/3527/3216089966_0408ecf146.jpg" width="500" height="500" alt="New Pepsi mark"></a><br>
      Image taken in the Bart station, Powell Street station, SF.</p>
    html_clean: |-
