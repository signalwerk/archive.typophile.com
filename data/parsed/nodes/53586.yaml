      <p>My question is, why have there been so many iterations of Pepsi's [packaging] identity including the logo? Plenty of design elements on the packaging can be changed without warping the logo. The logo, by the way, is the visual representation of a corporation and the building block of any strong identity. The changes in Pepsi's logo says to me that they are desperately trying break into some new demographic, struggling to compete, or trying find an identity that works. </p>
