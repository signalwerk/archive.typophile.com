      <p>Logos establish identities, and it is a bit foolish to switch identities<br>
      without an excellent reason. But there is a phenomenon called executive fiddling<br>
      and this seems a prime example of it. </p>
      <p>My wife who does the shopping and drinks the Pepsi will pay no attention to the logo.<br>
      She likes the taste. I don't care much one way or the other. If I were doing the buying<br>
      and the drinking I would look for the caffeine free diet drink with the lowest price. </p>
      <p>If you have a new product trying to crack a market then obsessing over the logo makes sense.<br>
      Coke, Pepsi, Mercedes Benz and Chevrolet should stick to the tried and true.</p>
      <p>John Culleton<br>
      Able Indexers and Typesetters</p>
