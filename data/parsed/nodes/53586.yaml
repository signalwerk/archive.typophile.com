    votes: null
    html: "<p>I have been complaining about the rebranding since it debuted. What strikes me is that all of the non-designers in my life (a fairly sophisticated bunch) are all giving the new designs a thumbs-up. \"But… but… but,\" I stammer, \"That's not clean and minimal! It's generic! It's got no personality. It's an un-identity!\" Then I cross my arms, stamp my feet, and glare.</p>

      <p>In my opinion, the worst crime of the new logo is that the asymmetrical swoosh (grin, whatevahyacallit) <strong>visually references Coca Cola's trademark Dynamic Ribbon</strong>. It's like they sliced off a length of it, encircled it, and—pow!\x1f—new logo. </p>

      <p>I understand what they were going for and appreciate that they attempt to achieve a more modern and mature sensibility. I like that someone, somewhere up the chain, wanted to defy what other beverage companies are doing and simplify their packaging. I like the consistency across the product line, something Coke sorely lacks. But as a whole I think the rebranding falls short.</p>

      <p>That said, I actually think the Tropicana redesign and accompanying campaign (\"squeeze\") is great and is a nice step forward for orange juice branding and marketing. </p>

      <p>Same goes for the Gatorade \"G\" campaign, which abandons the now all-too cliché images of sports stars at the height of exertion.</p>"
