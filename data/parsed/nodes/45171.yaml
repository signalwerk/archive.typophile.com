    html: |-
      <p>Not sure about sources, but some errors I have heard of are letters upside down, like the ’e’, and space characters that rode too high on the stick, and resulted in a black box printing instead of a space. (And of course the wrong letter chosen from the case.)</p>
      <p>Others here probably know more.</p>
