      <p>Hi Jelma,</p>
      <p>thanks for your link of Arnhem etc. Very nice site I think.<br>
      Impressing, almost discouraging ;-) if you know what I mean.<br>
      I would stick with Arnhem. For me its a good example for a good working and charming textface with modern feeling. Its always the netherlands which (in my eyes naturally) produce those kinds of smooth (not slick) faces which strikes the eye in a positive sense when seen in a book. Just as Lexicon No2 for example and others.<br>
      Arnhem is great.<br>
      Good link.</p>
      <p>Stefan</p>
