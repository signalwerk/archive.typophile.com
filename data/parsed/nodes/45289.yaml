      <p>1) me!</p>
      <p>2) Educating font vendors as to how these technologies work can be painful, especially when the font vendor primarily supplies fonts to graphic designers. Add to this the technical challenges around character sets, OpenType and hinting and the field narrows. </p>
      <p>So my advice (and people will criticize me for this) is to talk to vendors who understand the technology - so that would be Ascender, Monotype, Font Bureau, maybe Bitstream &amp; H&amp;FJ.   </p>
      <p>Second piece of advice would be to go custom - own the font/s outright (not necessarily exclusively) and you can avoid future licensing issues as technology and your plans change.</p>
