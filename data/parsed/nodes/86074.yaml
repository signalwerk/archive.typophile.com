      <p>Oak Knoll press has a good selection, generally in very good shape; consequently, their inventory tends to command premium prices.</p>
      <p>You can—if you are patient and persistent—find good deals on eBay; however, please note that even patience and persistence are no guarantee that you will find what you're looking for at a price you're willing to pay.</p>
      <p>On the other hand, when I was building my collection of specimen books via the eBay method, I often bought duplicates simply because the price was too good to pass up. To paraphrase Aretha: "What you want, maybe I got it." Or maybe not…</p>
