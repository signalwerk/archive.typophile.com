  html: <p>Hello, I'm wanting to enhance by collection of printing specimen books but have no idea where to get them from other than lucky finds at bookstores etc.  Are there any websites that sell such books?</p>
  html_clean: <p>Hello, I'm wanting to enhance by collection of printing specimen books but have no idea where to get them from other than lucky finds at bookstores etc.  Are there any websites that sell such books?</p>
