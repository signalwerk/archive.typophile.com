    html: |-
      <p>On eBay, check Business and Industrial &gt; Printing and Graphics Essentials &gt; Books and Manuals.</p>
      <p>Within Books, searches which usually yield results, if the books are available…</p>
      <p>type specimen<br>
      specimen -hunter -days<br>
      typographic<br>
      typography</p>
      <p>Again, persistence and patience are needed. I bought a copy of Photo-Lettering's Alphabet Thesaurus #3 for $75.00; the going price, retail, is $250.00.</p>
