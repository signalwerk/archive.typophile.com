    html: |-
      <p>@Dunwich Type</p>
      <p>The value of an item is not what you pay for it, but what it's worth to you. For me, the PLINC catalog is worth $250.00; so what I paid for it reflects an incredible value.</p>
      <p>The 1912 American Specimen Book of Type Styles is larger—at 1301 numbered pages vs. 1148 for the 1923 edition—and contains typefaces and other material simply not found in the later edition. Again, the value is determined by what the difference is worth to an individual. I have two 1923 specimen books: one is in excellent condition; the other, not so much, but I got it for $50.00. I also have the 1912 edition in very good condition, which I got at auction on eBay for 1912 for $125.00. As a reference book, I think that it's easily worth twice what I paid for it. Just sayin'…</p>
