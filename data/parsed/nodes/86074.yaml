      <p><cite>I bought a copy of Photo-Lettering's Alphabet Thesaurus #3 for $75.00; the going price, retail, is $250.00</cite></p>
      <p>On that note, don’t buy expensive books unless you have solid knowledge that they are  worth the money. Those Alphabet Thesaurus books have some cool stuff in them, but the bulk of the content is artificially condensed/extended/slanted versions of common typefaces. Unless you absolutely must have the PLINC specimens, there are better options for your money. Likewise, a 1923 ATF specimen can be had for $100 and contains most of the better fonts that appear in the much more expensive 1912 Book.</p>
