    html: |-
      <p>Amazon.com and its international brethren are a great way to get them cheap. Use terms vaguely similar to what you want and dig through page after page of search results and you can sometimes find incorrectly listed books for 2 or 3 times less than what they sell for on eBay.</p>
      <p>Keep in mind that some stuff is much harder to find than other stuff. ATF and Monotype are easy to get because so many books were made. Pre-WII European stuff can be very hard to find, and small/obscure European foundries are really tough. The best thing to look for are large-format specimen binders from typesetting shops. I have a set of specimens like this that is just amazing; hundreds of foundry types, printed as complete alphabets in every available size.</p>
