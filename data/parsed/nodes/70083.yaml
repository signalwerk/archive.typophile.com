      <p>I don't see why you should force your mark to resemble a star. It seems to be limiting the potential of the design. An abstracted mark that looks more like a football player would be much more compelling than a star that is trying (and sort of failing) to look like one.</p>
      <p>I just took your images and transplanted them together. I know you can't really use this particular football player graphic but you may agree that this could be a useful direction.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kmsport_5671.gif"></div><p></p>
