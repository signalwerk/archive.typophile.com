    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : FontExplorer</strong></p>
    <p><em>Are you looking for information about <a href="/wiki/FontExplorer%20X" class="freelinking" rel="nofollow">FontExplorer X</a>, Linotype's free Font Management application</em>?</p>
    <p>During the late 1990s, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> created a product called the FontExplorer, which was a catalog plus CD. On the CD, customers could sift through Linotype’s font library by using subject keywords and descriptive terms. FontExplorer was and is an aide for those looking to find speciific fonts. In 2004, Linotype placed the contents of the CD online (<a href="http://www.linotype.com/2393/fontexplorer.html" title="http://www.linotype.com/2393/fontexplorer.html">http://www.linotype.com/2393/fontexplorer.html</a>) for free download (c. 180 MB). By that time, over 1 million catalogs and CDs had been distributed.</p>
    <p>FontExplorer and <a href="/wiki/FontExplorer%20X" class="freelinking" rel="nofollow">FontExplorer X</a> are two different products that both aim to help font users find the right fonts for their needs.</p>
