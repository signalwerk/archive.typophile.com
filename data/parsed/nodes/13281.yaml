      <p>I agree with tbiddy about Nexus. But I'm a sucker for Dutch type (and Majoor's Scala), so take that into account.</p>
      <p>Vista may actually be a more broadly applicable face, though. It's got a strong flavor of Meta to it, which I think might make it more readily accepted by people used to Meta's structure and character. Plus the alternate sets that Dupré designed allow Vista to do some fun, interesting stuff that's unique to the family.</p>
      <p>Legato's got the high legibility thing going for it, but its design makes me think of <a href="http://www.eff.co.uk/M/P/PrsLR.htm">the font used in the BBC series <em>The Prisoner</em></a> too much. I know, I'm weird like that. But I can't get past it, for some reason.</p>
      <p>It's a tough choice between some great fonts that, as tbiddy said, is a matter of specfic desires.</p>
