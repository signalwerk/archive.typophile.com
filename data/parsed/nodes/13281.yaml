      <p>Terry, I haven't licensed Vialog myself, but I've gotten to design with it twice. A few years ago, when I was first just an exchange student in Germany, Linotype and the school I was studying at collaborated on a project. Students in this project created advertising &amp; brochure proposals for the Vialog typeface (Werner Scheider, Vialog's designer, was the school's retired typography professor). So the fonts were given to the school for our use.</p>
      <p>Since working at Linotype, I have designed a few small ads and marketing materials (posters for conferences, etc) for Vialog.</p>
      <p>I don't think that Vialog is directly based off of any traffic signs. In the 1980s, Werner Schneider created a proposal for a European Highway signage face that was not put into use. During the 1990s, he reworked this face into Vialog, which became the house face of the Munich transit system before it became available for licensing. Since 2001–2, everything related to public transportation in Munich is set in this face (from signs down to the fold-up maps that fit in your pocket). This completed face, already tested and optimized for Munich, is available from Linotype as part of its Platinum Collection.<br>
      __<br><a href="http://www.typeoff.de">www.typeoff.de</a></p>
