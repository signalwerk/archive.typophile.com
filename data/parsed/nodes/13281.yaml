      <p>Legato looks a little bit "different" to us because we're hypersensitive to fonts. Laymen think it's Arial. Especially at text sizes. This doesn't mean more than one font on this planet is a "luxury" (how preposterously animalistic), but it does mean it won't be consciously rejected by the reader; it just applies its functional and aesthetic attributes "below the radar" - like any good text[ish] font.</p>
