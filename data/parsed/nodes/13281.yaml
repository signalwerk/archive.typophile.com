      <p>Well, I didn't want to jump in until Simon prompted me.</p>
      <p>We are revising our entire catalog at the moment. Both our catalogs, and our PDFs are auto-generated by databases. After the catalog is complete, I'll try to make the next step the PDFs. The new catalogs will be more detailed in their display than any of our older auto-generated ones. In theory, with the PDFs, anything that can be programmed can be done.</p>
      <p>Linotype's new OpenType font standard has a character set of somewhere between 300–375 glyphs (all Western, CE, and a few more, sorry for not having the exact number handy) instead of the old 256. So we are looking for ways to bring out these new standard glyphs into our displays. </p>
      <p>In other words, we're working on it… the leader of our e-commerce team will be at TypeCon. I'm sure that he would love to hear any suggestions that you (or anyone else) have.<br>
