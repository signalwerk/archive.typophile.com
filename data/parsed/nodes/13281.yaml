    <p>Well, I am my own boss now and I finally have a budget to build my font library. My current collection has a decent smattering of this and that, but I feel I'm lacking a complete sans family. While I anticipate Mark Simonson's <a href="http://www.marksimonson.com/article/118/proxima-sans-going-nova">Proxima Nova</a> family will provide an excellent choice for a geometric sans, I haven't settled on a humanist sans.</p>
    <p>I know there is a great variety out there, but I'd really like something in OpenType -- not just because of the features, but because I frequently switch back and forth between Mac and PC. Here are a few I'm considering:</p>
    <ul><li><a href="http://www.emigre.com/EFoIVisOT.php">Vista Sans</a></li>
    <li><a href="http://www.stormtype.com/sebastian.html">Sebastian</a></li>
    <li><a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.11482.0.0">Nexus Sans</a></li>
    </ul><p><a href="http://www.secretonix.pt/ftf/catalogue/FTFstella.htm">FTF Stella</a> and <a href="http://www.evertbloemsma.nl/legato/legato_family/legato_regular.htm">FF Legato</a> are two that I especially admire -- I only wish they were availble in OpenType.</p>
    <p>I'd appreciate any advice from those that have used any of these or can recommend other options.</p>
    <p>Thanks,<br>
    Addison</p>
