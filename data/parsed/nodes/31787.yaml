    html: |-
      <p>As I already mentioned in your deleted post;</p>
      <p>I like this, the geometric feel it has, without it becoming too impersonal.<br>
      Some crits:<br>
      The lc 'a' might benefit from a little bit smaller bowl. It's not needed per sé, but I think the contrast would be better, when you compare it to the size of the counter of the 'e'. Something like that would maybe be better.<br>
      The uc 'L' arm should be shortened a bit. The left shoulder of your 'm' has some bumps in the curve. The 'r' is a bit wide (maybe chop some of the arm).<br>
      The crosscurl in the 'Q' somehow doesn't look natural at the moment.<br>
      Both 's' and 'S' have some minor issues, although I cannot pinpoint exactly what it is at the moment.<br>
      I'm not sure it's a problem, but some of your (nice looking) inktraps could probably be made a tad bigger. Especially on characters where the shoulder joins the stem like on the 'n'. So the 'p', 'h', 'm', etc. To prevent the stems that extend above the shoulder clogging up.</p>
