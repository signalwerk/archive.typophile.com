      <blockquote><p>Huh, interesting. When Beaumarchais brought Baskerville's punches to France to cast new type, it was to print Voltaire's complete works! BTW if you need any French passages translated just send them over.</p></blockquote>
      <p>I don't know if you misunderstood me here. I meant, I read that the first printed thing those Didot types (fonttype Didot itself that Firmin released) were used was the Henriade and that it was printed by his brother Pierre with sterotype method. I don't know what you mean with this. Voltaire's work is older then Didot and already was printed some times before of course. I didn't mean "La Henriade" was printed first by Firmin Didot but the first thing he printed with the new typeface was "La Henriade"<br>
      But this are facts I also only read at the www. I want books that tell me more about it. And if possible in English or German.</p>
      <p>Thanks for offering me translations, but I couldn't even find the passages I need, I don't understand one word. So I can't use French books.</p>
