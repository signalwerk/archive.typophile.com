      <p>First of all: try to get in touch with Jean François Porchez. Frutiger you can contact via Linotype; but he <em>is</em> pretty old now.</p>
      <blockquote><p>I am desperately looking for books or other sources that are based on scientific evidence. Especially on some facts.</p></blockquote>
      <p>Out of context this sounds reasonable enough, but in <em>this</em> context I'm having a hard time figuring out what you're really looking for... Could you explain?</p>
      <blockquote><p>I want to show when it first got revealed, by whom, why, where, how popular it was, its ....</p></blockquote>
      <p>A small -and very old- tidbit you might enjoy:<br>
      <a href="http://typophile.com/node/138" title="http://typophile.com/node/138">http://typophile.com/node/138</a></p>
      <p>About the Baskerville connection: Bodoni was a great admirer of John Baskerville, and went on a trip to visit him. But he got sick along the way (in fact even before even leaving the borders of Italy) so he never made it.</p>
      <blockquote><p>First printed thing with Didot font was "La Henriade" (Voltaire)</p></blockquote>
      <p>Huh, interesting. When Beaumarchais brought Baskerville's punches to France to cast new type, it was to print Voltaire's complete works! BTW if you need any French passages translated just send them over.</p>
      <p>Concerning what might be fruitful to pursue: since the Didone style is so "dramatic" it would be interesting to see how much compromise is required when shooting for text sizes (since smaller sizes of type benefit by having features anathema to the Didone style). I believe a style have its preferred size range, and outside of that range it's not really itself. Can a Didone still be a Didone at 10 point?</p>
      <p>Lastly, I would offer this favorite quote of mine:<br>
      "Bodoni would be an admirable letter for a death notice."<br>
      – W. G. Ovink</p>
      <p>hhp</p>
