      <p>This could be interesting. But maybe I need more original prints to compare.</p>
      <p>That quote. True. Didn't look at the typeface like that till now. Always thought about soldiers, esp. because I read about that comparison already, but it could be gravestones too, indeed. I think it's even the better metaphor because it includes that gravestones can look elegant and beautiful.</p>
      <p>About the graph:<br>
      It's interesting that the gap between use and revival becomes smaller over the years. Maybe the need of more different typefaces was rising at about 1900. What does "Modern" mean? Modern, maybe already "digitzed" typefaces? Bodoni revived before Baskerville, it followed then. Hm.<br>
      Why can't I find Didot in it? And in books it is missing sometimes too. I recently bought a book "Wegweiser Schrift", and it tells some facts about specimen and stuff, of course Baskerville, yes, and Bodoni, and OH YES, Walbaum, too. But Didot? No. Why?</p>
      <p>Btw: I just wrote an e-mail to Mr. Porchez.</p>
      <p>Sorry again, I know my English is hard to understand. Thanks for going through it though.<br>
      Thanks for helping me, I admit it!</p>
