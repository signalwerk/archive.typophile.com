      <p>Thank you for your  fast answer.</p>
      <blockquote><p>Out of context this sounds reasonable enough, but in this context I'm having a hard time figuring out what you're really looking for... Could you explain?</p></blockquote>
      <p>I mean I need primary sources, not secondary sources because of academic integrity.<br>
      It should be a scientific research, at least as far as I am able to do so. So I'm looking for proves for the facts I wrote, for example the ones I found at ilovetypography.com because this source would not be scientific.</p>
      <blockquote><p>About the Baskerville connection: Bodoni was a great admirer of John Baskerville, and went on a trip to visit him. But he got sick along the way (in fact even before even leaving the borders of Italy) so he never made it.</p></blockquote>
      <p>Okay. You say that. But where is the source for this information? I know I can believe you, but I don't think that you found that out yourself, did you? So I'm looking for primary sources that prove these facts. Did you read this in a book? Is there another good book that is English or German and tells such interesting facts?</p>
      <blockquote><p>Huh, interesting. When Beaumarchais brought Baskerville's punches to France to cast new type, it was to print Voltaire's complete works! BTW if you need any French passages translated just send them over.</p></blockquote>
      <p>I don't know if you misunderstood me here. I meant, I read that the first printed thing those Didot types (fonttype Didot itself that Firmin released) were used was the Henriade and that it was printed by his brother Pierre with sterotype method. I don't know what you mean with this. Voltaire's work is older then Didot and already was printed some times before of course. I didn't mean "La Henriade" was printed first by Firmin Didot but the first thing he printed with the new typeface was "La Henriade"<br>
      But this are facts I also only read at the www. I want books that tell me more about it. And if possible in English or German.</p>
      <p>Thanks for offering me translations, but I couldn't even find the passages I need, I don't understand one word. So I can't use French books.</p>
      <blockquote><p>I believe a style have its preferred size range, and outside of that range it's not really itself. Can a Didone still be a Didone at 10 point?</p></blockquote>
      <p>This could be interesting. But maybe I need more original prints to compare.</p>
      <p>That quote. True. Didn't look at the typeface like that till now. Always thought about soldiers, esp. because I read about that comparison already, but it could be gravestones too, indeed. I think it's even the better metaphor because it includes that gravestones can look elegant and beautiful.</p>
      <p>About the graph:<br>
      It's interesting that the gap between use and revival becomes smaller over the years. Maybe the need of more different typefaces was rising at about 1900. What does "Modern" mean? Modern, maybe already "digitzed" typefaces? Bodoni revived before Baskerville, it followed then. Hm.<br>
      Why can't I find Didot in it? And in books it is missing sometimes too. I recently bought a book "Wegweiser Schrift", and it tells some facts about specimen and stuff, of course Baskerville, yes, and Bodoni, and OH YES, Walbaum, too. But Didot? No. Why?</p>
      <p>Btw: I just wrote an e-mail to Mr. Porchez.</p>
      <p>Sorry again, I know my English is hard to understand. Thanks for going through it though.<br>
      Thanks for helping me, I admit it!</p>
