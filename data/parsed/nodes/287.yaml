    html: <p>Hi Josh, <br>my first impression was very good. what i lked very much is the way the wheights extend, when they become fatter.  <br> <br>The round serifs and the drop-endings will probably be to heavy for running text. Maybe you should make the stems a little more thicker, so that the overall contrast (=difference between the thin and fat strokes) will be higher. <br> <br>Mathematically the widths of your roundings (bowls), should be more then the widths of your vertical stems, so that optically they wont look thinner. <br> <br>v, w, y, and the x need serifs or something else to fit in with the rest. You can leave the inner stem of the 'm' without serif, but i wouldn't shorten it the way you did. <br> <br>For the 'z' i could think of a tail inspired on the tail of the 'k'. Thus dropping under the baseline. <br> <br>Maybe you should also try a version with shorter upper strokes. <br> <br>I am curious about the capitals. <br> <br>--Jacques</p>
