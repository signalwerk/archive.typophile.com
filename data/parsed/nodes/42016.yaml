      <p>If you are talking about general principles about the arrangement of footnotes to tables, see "Chicago Manual of Style," 1.184 and 13.43 through 13.50.</p>
      <p>If your use of "Tables" with a capital T refers to some kind of software for making tables, then I don't know nothin'.</p>
      <p>powers</p>
