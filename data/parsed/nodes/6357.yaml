    html: <p>I wanted to let you guys know that Gerald Lange (former master printer for <span class="caps">USC</span>) will again be teaching his letterpress class at the ArtCenter in Pasadena (at the new “wind-tunnel” location). It’s 14 weeks of some serious type and cylinder press printing. Gerald is as fun as he’s educational, and even though I took the class about a year ago, I still feel the new insight into old type trickling down to me almost every day. The stuﬀ you realize when actually holding metal type in your hand, putting the sorts in the stick and not to mention rolling the paper on the inked form, can actually put a smile on your face. <span class="caps">BTW</span>, it starts in mid-May, and there’s a limit of ten students per semester. <br><br>hhp <br></p>
