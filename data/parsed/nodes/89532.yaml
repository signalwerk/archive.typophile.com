      <p><cite>What are the must have characters/glyphs before releasing a font on the market?</cite></p>
      <p>For language support look at the large encodings of successful vendors like Vllg, H&amp;FJ, etc. Display fonts can sell well with a smaller character set, for example, you can cash in on American design trends and sell well with a stripped-down Latin-1 font. Unless you are being paid to address them it is safe to ignore things like old Irish orthography, Esperanto, and Klingon.</p>
      <p><cite>What's the market looking for when buying fonts?</cite></p>
      <p>That depends entirely on the design of the font. Publication designers, package designers, and sign shops buy entirely different stuff.</p>
      <p><cite>Thoughts on font scalability? What is the lowest size do you test your typefaces out on.</cite></p>
      <p>This is determined by the style, weight, and purpose of the font. A font optimized for text gets tested at text sizes. A hairline sans serif has to be tested at large sizes because even a 2400 DPI laser printer can’t render it correctly below 18 points, and that’s if you have a $30,000 color Xante and the humidity is just right.</p>
      <p><cite>Is there much profit to be made in selling at foundries?</cite></p>
      <p>Sure. Especially if you don’t have the inclination to set up a business, create an online store, etc. etc.. You can do pretty well selling through vendors like Fontspring and Font Bros. that pay a bigger royalty if you can promote yourself.</p>
      <p><cite>Any tips/advice would be greatly appreciated.</cite></p>
      <p>Most people in the font industry are friendly, trustworthy, and not the least bit interested in screwing anybody over. That said:<br>
      - Read a contract repeatedly before signing it. Talk to a lawyer if you don’t understand any of it.<br>
      - Don’t sign a deal for a royalty rate below 50%.<br>
      - Don’t sign a deal that allows the vendor to deduct any business costs, including marketing, from your royalties.<br>
      - Only sign an exclusivity agreement if the vendor is doing a lot of finishing and production work that you would never get done yourself. Or if the vendor is willing to commit a lot of money to marketing your font.<br>
      - Don’t sign any contract that never expires. You have no way of knowing what a vendor will be doing in five years, or who might own the vendor.<br>
      - Never sign away ownership of your copyrights or trademarks.</p>
