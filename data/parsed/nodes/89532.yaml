      <p><cite>What's the difference between an OEM license and a 'normal' license, whatever that may be?</cite></p>
      <p>An OEM license is a license for a software maker to include the font in software packages. These licenses are quite expensive. The big foundries claim that they do a lot of negotiating for these licenses and so royalties on OEM sales are in the 20 –&nbsp;30% range. This is one of the biggest drawbacks to selling through foundries, and it’s not a bad idea to just not allow foundries to sell OEM licenses so that you can keep all of the money.</p>
