    <p>What are the must have characters/glyphs before releasing a font on the market? What's the market looking for when buying fonts?</p>
    <p>What are the benefits of creating multiple weights? Are there drawbacks to waiting to release other weights?</p>
    <p>Thoughts on font scalability? What is the lowest size do you test your typefaces out on.</p>
    <p>What foundries are popular for contacting about retailing typefaces?</p>
    <p>Is there much profit to be made in selling at foundries?</p>
    <p>Any tips/advice would be greatly appreciated.</p>
    <p>Thanks, guys.</p>
