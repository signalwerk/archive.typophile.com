    <p>Found this sample in <a class="freelinking external" href="http://dl.lib.brown.edu/mjp/render.php?id=1158591480633184&amp;view=mjp_object" rel="nofollow">Blast Magazine</a> by Wyndham Lewis.</p>
    <p>Later digital versions that are similar but not quite (see the large ear in  /g/ for example) include <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/hawthorn-lt/" rel="nofollow">Hawthorne</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/romana/" rel="nofollow">Romana</a>.</p>
