    html: |-
      <p>It's probably not in the spirit of the battle for me to admire my opponents, but I think Christian's Zebramond is really charming. It kind of reminds me of Kris Sowerby's <a href="http://klim.co.nz/custom_hoko.php" rel="nofollow">Hokotohu</a> with its ornamented letterforms, but it also has an organic inked-in quality to it. I can picture it being used on a logotype somewhere.</p>
      <p>With my entry, I concentrated too much on combining Garamond's outlines and Zebrawood's internal patterns so that the allusion to each design was as clear as possible. It serves the purpose of this battle, but I doubt it's going to amount to much outside it.</p>
      <p>And so far, no one has called me out for cheating and only using lowercase letters confined to the x-height. It was unintended, I swear...</p>
