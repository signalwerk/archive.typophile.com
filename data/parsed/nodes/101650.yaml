      <p>#1 looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Apple&amp;ffam=SI%20New%20-%20Regular&amp;fid=eaa52210817d4955de38753fd31bb64e&amp;fsize=60&amp;text=Obenwelt%20Der%20Silberne%20Faden&amp;wrap=2" rel="nofollow">SI New</a></strong> Apple font manually condensed and modified.<br>
      More specifically the copyright of SI New font says: "1990-91 Apple Computer Inc.   1990-91 Type Solutions Inc.   1990-91 The Font Bureau Inc."</p>
      <p>#2 must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Letraset&amp;ffam=Scriptek%20-%20Regular&amp;fid=2c358e446161db38ac7c49006ffdd7be&amp;fsize=60&amp;text=Stellt%20euch%20einen%20Schrank&amp;wrap=2" rel="nofollow">Scriptek</a></strong> by  David Quay (Letraset, 1992) also available from ITC</p>
      <p>#3 looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=Mendoza%20Roman%20OS%20ITC%20TT%20-%20Book&amp;fid=36f6b0becabacea7f25c620314bc2049&amp;fsize=60&amp;text=aber%20keines%20ein%20Rumos%20Alleinh%20gemei&amp;wrap=2" rel="nofollow">ITC Mendoza Roman (Book)</a></strong> by  José Mendoza y Almeida (ITC, 1991) also available from Adobe &amp; Monotype</p>
