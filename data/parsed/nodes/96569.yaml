      <p>Re-reading that, I have to apologize for being too dismissive. I guess Michael's frothing berserker philosophy of life can be infectious.</p>
      <p>Ideas never die - at most they go dormant. And I'm not even sure I would enjoy the total absence of chirography. There will always be a place for it - always some people who will make chirographic type, much of it nice to look at. My real contention is -and has long been- that the idea of chirography gets too much mileage it doesn't deserve, and there's not enough exposition of its drawbacks. I often position myself at extremes not because I'm an extremist at heart, but essentially as a well-meaning slap in the face, aimed at people I expect more from.</p>
      <p>Thankfully there is a growing, if rag-tag guerrilla army of what I've been calling "liminographers": designers who consciously violate chirography in favor of the direct creation of notan. This "anti" stance is merely an initial reaction. Eventually type will be made by people who simply ignore chirography, and it will be my own favorite kind.</p>
      <p>hhp</p>
