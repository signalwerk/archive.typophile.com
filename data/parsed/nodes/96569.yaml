      <p>I believe I’ve captured the uniqueness and genius in Legato in a way Evert might have embraced. </p>
      <p>See the more fully elaborated background to my analysis and the functionality-for-reading comment here:<br>
      <a href="http://typophile.com/node/16140#comment-97148" title="http://typophile.com/node/16140#comment-97148">http://typophile.com/node/16140#comment-97148</a><br>
      i.e., my post page 2, 25 Nov 2005 — 3:04pm<br>
      “[…] the tension caused by Bloemsma’s rotation seems to make the white of the word more active or salient vis a vis the black. Here he is in a line that includes W. A. Dwiggins. If I am right (in my understanding of perceptual processing in reading) about the place of 'the map of salient whites' in reading (see the “bouma as bounded map thread’) we can see why Bloemsma is justified in thinking he is reconnecting (optically, ‘after-helvetica’) the single units of our scripts, or restoring and extending the optical integrity of the wordform.”</p>
      <p>In saying “Bloemsma’s rotation seems to make the white of the word more active or salient vis a vis the black,” I am alluding to the notan characteristics of the font and reflecting my contention that both the black and white of the word are information for vision.</p>
      <p>I think what I want to argue in this thread on “hardware” is that one doesn’t have to negate what Noordzij has called, in an as yet untranslated essay, the primacy of the pen, in order to be progressive, inventive and experimental, or embrace what makes Legato so unique. In fact, my analysis reveals rather than reduces it and gives a basis to articulate it's genius.</p>
