    html: |-
      <blockquote><p>But breaking the black is a crap shoot, unless it’s done systematically</p></blockquote>
      <p>This is something I've wrestled with for a while. And it is in fact the flaw in Bloemsma's work (which I might have actually opined to him once - I forget). Like most designers, he's too Modernist. You have to let go. <em>Life</em> is a crap-shoot. Which is actually harder for me to work with than it is for most people, even for most designers. But that's not the same as random (which I'll never be a fan of).</p>
      <p>So you take you <em>liminographic</em> tool of choice, you clear your mind of chirography, and you make notan. That's it.</p>
      <p>Progress is hard.</p>
      <blockquote><p>Nothing that we’ve seen from you so far shows me that your method brings you any closer than Dwiggins or Bloemsma, or ....</p></blockquote>
      <p>Not an once of doubt about that. I haven't publicized the proto-implementations of my ideas yet (for various reasons). In fact my usable output remains firmly in the realm of parachirography (for which I publicly reprimanded myself during my talk in Mexico City by slapping my own hand :-). But admitting the problem is the first step (and -unlike most practitioners- I've gone quite a bit beyond that).</p>
      <p>Maybe I'll never make anything usable with these ideas. But to me that's still better than never having good ideas to begin with; better than running a school to teach others to perpetuate a misconception (which really chaps my hide).</p>
      <p>hhp</p>
