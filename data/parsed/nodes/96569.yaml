      <p>No, genuinely fit. We disagree. </p>
      <p>Good affordance for reading is a wide plateau, but optimality within the fluent range explored by Bigelow and Legge recently, can perhaps be incrementally fine-tuned with inventive, neuro-mechanically and perceptual psychophysically aware, strategic feature-manipulation. </p>
      <p>I do not advocate chirography. Denialism of the prospects for building exceptionally fit alternative forms on an intrinsically convention-breaking premis has nothing to do with it. I sometimes think your anti-chirographic stance is oedipal. I think your strongly polarizing stance is more ideological, divisive and non-inclusive than conceptually obvious, sufficiently experientially grounded and motivated or tested in practice. </p>
      <p>I am interested in what happens to contrast and construction historically and the beneficial purpose manipulating these serve in human factors terms. The construction and contrast styling templates circumstantially produced by writing give me an priviledged window into plotting and getting an accurate handle on what happens to contrast and construction historically. The beneficial purpose manipulating these serve in human factors terms is the reason for my immersion in the science of reading.</p>
