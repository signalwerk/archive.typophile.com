      <p>Joel<br>
      You may wish to search John Neal Bookseller for canted edge nibs. The Parallel pens are very forgiving, free-flowing and responsive. He also has books by various artists on left handed calligraphy which may facilitate your experience.A less expensive route may be some of the chisel edge markers. Elegant writer by Speedball is by far the most durable/long lasting but there are others that come in larger sizes.</p>
