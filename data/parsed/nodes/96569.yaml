      <p>The “para” comes from me, but I don't remember when I first introduced it.</p>
      <p>In the contention-laden forum which Hrant highlighted earlier — <a href="http://typophile.com/node/48843" title="http://typophile.com/node/48843">http://typophile.com/node/48843</a> — I wrote: “As I understand it, chirography is paraphrastic of the pen. This is different than saying some type is para-paraphrastic. Etymologically <em>para-</em> is <em>beside</em>, <em>alongside of</em>, <em>by</em>, <em>beyond</em>. For me para-paraphrastic is not a program or stance, but a [adding now: <em>universal</em>] type-historical fact.”<br>
      <a href="http://typophile.com/node/48843#comment-299053" title="http://typophile.com/node/48843#comment-299053">http://typophile.com/node/48843#comment-299053</a><br>
      i.e., my post (last page) of 1 Sep 2008 — 4:01pm</p>
      <p>Much of this is serious word-play. The root word in all of this is <em>paraphrase</em>.</p>
      <p>In the next paragraph I wrote: “Legato is para-paraphrastic” and explained what it might mean to say this.</p>
      <p>Elsewhere I wrote that what Hrant calls chiro-graphic is actually <em>chiro-referential</em>.</p>
      <p>Legato is para-paraphrastic without being directly chiro-referential. Hrant likes to use the phrase anti-chirographic. Anti-chirographic is a stance or attitude —which Hrant is keen to promote — that I would call anti-chiro-referential or post-chiro-referential.</p>
      <p>The importance of saying Legato, for instance, and Turnip too, are para-paraphrastic is that it recognizes that nothing is from scratch, and encourges one to trace how the contrast in and construction of Legato deviate from conventional writing in it’s variants. In the thread I used the <em>para</em> word “parasitical” and discussed the essence of type-design as feature manipulation that involves positive and productive or beneficial norm-violation, which —adding to this now — in digital technologies is splino-graphic or bezier-o-graphic or vector-based. [same thread, starting with 1 Sep 2008 — 6:40am, point 4 of the second set of points.]</p>
      <p>The shapes produced by actual conventional writing with a broad-nibbed or pointed-nibbed pen can, if they are well-understood, function as a template for understanding the nature of the forms in faces that are produced by para-paraphrastic feature manipulative work or play. The goal can be enhanced readability or expression.</p>
      <p>Understanding the <em>nature</em> of the forms as shapes in para-paraphrastic / non- or anti- chiroreferential instances is <em>not</em> achieved by trying to write these forms with varying pressure on, or twists and turns of the broad-nibbed or pointed-nibbed pen, but seeing the para-paraphrastic / non- or anti- chiroreferential instances against the background of the form-templates — as form-analytic foils — these tools produce.</p>
      <p>Gerrit Noordzij showed me the heuristic value of this in relation to the “clipped” forms of Henk Krijger's Raffia Initials and the similar forms of his contempory Helmut Salden.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hk_ri_G_clipping_5958.jpg"></div><p></p>
      <p>I tried to do something in a similar vein for Legato here:<br>
      <a href="http://typophile.com/node/55783#comment-335821" title="http://typophile.com/node/55783#comment-335821">http://typophile.com/node/55783#comment-335821</a><br>
      i.e., my post (last page) of 17 Mar 2009 — 7:55pm</p>
      <p>So let's not put the hardware aside.</p>
      <p>Peter</p>
