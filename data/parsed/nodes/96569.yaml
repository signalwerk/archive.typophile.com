      <p>Thanks for the link to that old thread, Hrant. I'd forgotten all about it. I suspect there is enough content for a book among the things that I've written on Typophile that I don't remember writing. Heck, some of it I don't even remember thinking. I am particularly proud of this contribution to that thread, though, which I think is one of the best things I've said on the subject of the 'software' of type design:</p>
      <blockquote><p>I think that Gerrit Noordzij's theory of the stroke provides one very strong analytical tool: one which I use every day when making decisions about shapes. Perhaps more importantly, I was instinctively looking at shapes in this way for many years before I read Noordzij's formulation of the theory. What Noordzij did was to expand my analysis, so that I saw and understood things that I had previously missed. Crucially, I think Noordzij has described the hermeneutic tradition within which type design exists, and has done so in a way that is independent of the lore, legend, personalities and advertising copy that make up much 'typographic history'. As I wrote earlier in this thread, a hermeneutic tradition is not something from which one can escape, and in some ways one is most deeply embedded in that tradition when one is critiquing it and finding reasons for rejecting it or extending it.</p></blockquote>
