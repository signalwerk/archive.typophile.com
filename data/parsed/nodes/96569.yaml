      <p>I don't think "we read notan" requires a precise technical definition; I think it's more of an abstract truism - not very actionable except for laying a foundation for further thought. What does require a precise technical definition is "bouma", and I firmed that up back when I wrote the piece "The Bouma Supremacy — they should have left Herman alone" :-) for Typo magazine (issue #13):</p>
      <p>A bouma is a cluster of letters that is recognized -in parallel with other boumas- as one thing, anywhere in the field of vision, thanks to a combination of frequency, contextual expectation, distinctiveness and clarity. It can be a single letter (in the fovea, where single letters are fully clear), it can be a whole word (deep into the parafovea, thanks to high frequency, expectation and distinctiveness) but is not necessarily either. So a letter is a special-case bouma, and so is a whole word.</p>
      <p>As for "notan is determined solely by the border", I mean "determined" in the mechanical design sense: it is what we make when we're making a glyph (a reality that [para]chirography contradicts). The border isn't what is perceived by the reader; that would be notan.</p>
      <p>hhp</p>
