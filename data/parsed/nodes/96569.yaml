      <p>“When you shear the internal organs of a person, he dies.”</p>
      <p>So Legato is lifeless? Or does it just mean Legato is post-chiro-referential, and my analysis show to what degree and what effect? It is doubly so, systematically across the letter set, and to beneficial effect, as most of us agree. There is no dead King, because the precedent of tool-based writing is originary, but not dictatorial. The proud handmaiden or humble butler of analysis that writing-derived heuristic-templates provide is not dead.</p>
      <p>You may not want to talk about this more, but dismissive gestures are no substitute for argument. I am however satisfied with having providing a bit of push-back. Your truism about notan could use some of that as well, as John's engagment on that score suggests. Despite my caveats, I think calling the attention of type designers to notan and to the importance of not being beholden to the pen-based coupling of inner and outer contours is absolutely apt, timely and laudable.</p>
      <p>“The particular convenience of the broad-bin pen, French curve, bézier, copy-paste or coarse grid creeps in to our work because there are limits to how much we want to fight their limits.”</p>
      <p><strong>And</strong>, besides being virtually intracable — to the point of causing the design equivalent of writer’s block (and so inconvenient as a practical technique) —, <strong>liminography</strong>, from scratch, <em>without</em> successfully functional conventional para-paraphrastic or just paraphrastic (chiro-referential) forms as reference points, <strong>isn't limited</strong>? </p>
      <p>At some point — even, or especially in a from-scratch process — the designer has to get a handle on or structural understanding of the formal characteristics or logic of his or her positive and negative shapes, if he or she is going to exploit the products of his or her liminographic explorations intelligently and productively and make them into an internally cohesive font that promotes internally cohesive boumas.</p>
