      <p>Jason, the Typowiki entry on notan is a good explication of the word's common meaning and origins. Hrant's usage carries with it a number of additional assertions, which I think result in question begging when presented as such, but which are due proper consideration when posed as questions. So, for example, near the beginning of this thread Hrant asserts that notan ' is determined solely by the border between black and white', from which he infers then that outline drawing ('liminography) is the only way to attain notan in type design. Now, clearly, neither the first assertion nor the inference is implied by the common understanding of notan as derived from East Asian aesthetics of dark and light, as outlined in the Typowiki. Notan is something that exists whenever light and dark are present in direct relationship, so obviously exists in all typically contrasted text, whatever the means of its making. In terms of traditional use of the term, what matters are canons of beauty associated with notan, and hence it makes eminent sense to talk about notan in the context of calligraphy; indeed, this is one of the main uses of the term in Japanese aesthetics, and serves to link calligraphy with sumi-e  and other styles of painting that make use of light and dark relationships, and with traditional design practices. Hrant's use of the term, then, must be seen as novel or idiosyncratic, although I don't think there's anything wrong with that and find it a useful shorthand term for referring to something like 'the relationship of structure and space in type design, in which structure is presumed to be black and space white, or some similar dark/light contrast'. The problem I have with Hrant's use isn't its novelty or its independence of the common usage, but the question begging that goes into his secondary assertions and inferences. When these are rephrased as questions, the whole topic becomes more interesting to me and opens on to possible dialogue:</p>
      <p>Is notan a functional concept in reading? In what way?</p>
      <p>Is this functionality enhanced or impeded by (para)chirographically achieved notan?</p>
      <p>What other design processes might be used to create typographic forms?</p>
      <p>How do you establish criteria for functionally good notan in a writing system independent of writing?</p>
      <p>There are other questions that follow from these.</p>
    html_clean: |-
