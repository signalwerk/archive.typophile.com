      <p>Sadly I think that's almost 100% true. Almost. It's that tiny remaining glimmer that somehow drives us. Very little of type design makes sense devoid of the reasons type designers greatly exaggerate -or simply invent- to keep doing what they like. The consolation is that nothing anybody ever does is only about money.</p>
      <blockquote><p>odds are, none of these peoples' work'll get in the way.</p></blockquote>
      <p>Dunno, I think Constantia has a pretty big installed-base.  :-)<br>
      Me, I rely on my ambitions as a svengali.</p>
