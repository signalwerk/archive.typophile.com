      <p>Peter, Legato's genius is rooted firmly in the conscious "breaking" of the black. This is a clear break from chirography, and any subversive chiro-apologism is not welcome by me, because it keeps us in the dark ages.</p>
      <blockquote><p>one doesn’t have to negate what Noordzij has called, in an as yet untranslated essay, the primacy of the pen, in order to be progressive, inventive and experimental</p></blockquote>
      <p>It's certainly possible to be all those things within the confines of chirography. But it's still the same old boring over-populated continent, one where both style and reading performance are inhibited due to psychological lethargy, to an unwillingness to stop celebrating the established and start working on the possible.</p>
      <blockquote><p>you have to explain how it relates to functionality</p></blockquote>
      <p>I'll try to be more specific (eventually). But this might be where the constant reprimand I get to "put my money where my mouth is"* does kick in.</p>
      <p>* Although most people who say that are theory-free between the ears...</p>
      <blockquote><p>If all you are saying is that relationship of contrasting shape and ground is what we read, well, duh!</p></blockquote>
      <p>Well, I think it's "duh" too! But the implications remain largely avoided by most people, who insist on continuing to paint the black.</p>
      <p>hhp</p>
