    html: <p>Hrant, it doesn't seem either impossible or unlikely that Evert might have produced, in the process of creating Legato, first some outlines that corresponded to more 'normal' modulation patterns and then edited these using a variety of techniques to produce the inner and outer relationships that he sought. I don't think such impurity of process implies anything about the idea or the results of the design, but simply seems efficient. It is <em>much</em> easier to shape something in front of you into what you want than to try to create what you want ex nihilo, on a blank piece of paper, relying only on the idea in your head. There's never been a craftsman in history who didn't appreciate a procedural shortcut invisible in the finished result.</p>
