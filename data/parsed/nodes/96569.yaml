      <p>Subversive chiro-apologism? Psychological lethargy?</p>
      <p>Hrant, If you read my posts carefully, and with a hermeneutical ethic of generosity rather than pre-judice or suspicion, you would know I am an energetic apologist for constructive feature manipulation and untrammled exploratory norm-violation, with the internal, optical consolidation and ‘divergification’ of the bouma or word-form for visual processing as the principal goal, when it comes to text type. In our digital environment such feature manipulation is spline- or bezier-o-centric, which is what Bloemsma worked with.</p>
      <p>Where I said “the tension caused by Bloemsma’s rotation seems to make the white of the word more active or salient vis a vis the black,” I could have said “the tension caused by Bloemsma’s deliberate de-coupling of inner and outer contours — your “breaking of the black” — seems to make the white of the word more active or salient vis a vis the black.” In his own write-up Bloemsma talks of the “outer and inner forms behaving relatively independently.” The idea that skewing or shearing and rotating were involve at the bezier level comes from Jan Middendorp’s graphic in the "What makes Legato so Unique" forum: <a href="http://typophile.com/node/55783#comment-334509" title="http://typophile.com/node/55783#comment-334509">http://typophile.com/node/55783#comment-334509</a>, and the discussion that followed Middendorp’s 12 Mar 2009 — 11:31am post. I think the graphic comes from Bloemsma himself.</p>
      <p>Is your analysis of the functional effect fundamentally at odds with my analysis relating to notan and readability?</p>
