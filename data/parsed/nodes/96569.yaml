      <p>Notan exists whenever a mark with more than one dimension is made. Liminography is limited on account of this. The key is the distribution, and in type, the equipotency and resolvability into tractable positive and negative shapes (strokes or ‘role-units’ like bowls and stems, counters) of the light and dark. Liminography <em>adjusts</em> the light / dark distribution and manipulates the tractability of both the black shapes and the whites, but doesn’t <em>create</em> notan. We ‘read,’ in the sense of ‘perceptually process,’ the shapes but not the distribution. Visual or optical equi-potency in the distribution guarantees that both the white and the black have a proper salience and a proportionate cue-value for efficient visual processing within the framework of the word-gestalt. This is what, in my analysis, the user needs.</p>
      <p>The written forms that have been effectively built upon para-paraphrastically in the typographical era do not persist in their typographic progeny because of authorial preference or narcissistic indifference, but because they proved to be fit for reading as a visual task. The contrast and construction options they engendered facilitated the psycho-physical unitization of the word-object, a language-appropriate level of bouma-divergance, and guaranteed the automaticity of rapid and effortless visual word-form resolution for skilled, non-dyslexic readers,  That is, what the visual cortex of the end-user needs for rapid automatic visual word-form resolution —aka word recognition — has always been the principal countervailing pressure or hidden hand in the determination of what scriptorial conventions survived.</p>
      <p>Every part of the reading / writing matrix is thoroughly circumstantial or conditioned by circumstance, including the evolved structure and plasticity of the brain, right down to the very first layers of the visual cortex and structure of the retina. The reading-ware of the brain both adjust to and disciplines the products of the writing hand and the typographic multiversity that flowed from the first retranscriptions of it in type.</p>
