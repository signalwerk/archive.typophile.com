      <p>Hrant, I appreciate your gradual efforts to refine and present your ideas in more precise form, but I still think you are a long way from making sense. You can't insist that notan is a <em>functional</em> concept in reading, and then retreat to saying that 'we read notan' is an 'abstract truism', a phrase which prompts even more questions.</p>
      <p>In order for an idea to be a functional concept, you have to explain how it relates to functionality, in this case how it relates to the perceptual and cognitive processes of reading (or, at least, to a particular model of how such processes function). If you can't do this, you have not got a functional concept, but only a borrowing of a word from Japanese aesthetic philosophy and that ends up meaning 'black and white relationship' in the context of typography and reading. If all you are saying is that relationship of contrasting shape and ground is what we read, well, duh!</p>
