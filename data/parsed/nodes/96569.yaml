      <p>You claim that 'notan is the only thing that is read'. But that really does demand a very precise technical definition of notan from you, one which accounts for letter recognition as well as bouma recognition, since both are pretty clearly activities within reading. I'm not sure if I've ever seen such a definition from you.</p>
