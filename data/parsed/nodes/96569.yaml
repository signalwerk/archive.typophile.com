      <p>“constructive feature manipulation” is manipulation of things like contrast, construction, boldness, proportion that promotes readability, or what the visual cortex needs for effortless immersive reading.</p>
      <p>“exploratory norm violation” is any break with existing norms or conventions in the realms of contrast styling and construction, or co-ordinating inner and outer contours.</p>
      <p>”internal optical consolidation” is making the positive and negative shapes in the word fit or work together so the word doesn’t fall apart optically.</p>
      <p>"divergification of the bouma” is making the complexes of positive and negative shapes that form the word and word stems or morphemes distinct enough optically so we can easily tell them apart and don’t readily confuse orthographic neighbours with eachother.</p>
