      <blockquote><p>Is notan a functional concept in reading? In what way?</p></blockquote>
      <p>Yes, because it is the only thing that is read.</p>
      <blockquote><p>Is this functionality enhanced or impeded by (para)chirographically achieved notan?</p></blockquote>
      <p>Since parachirography is an arbitrary design constraint, essentially it can only hurt. When it helps (for example through the manifestation of "stroke" contrast, which I believe helps reading) that's just dumb luck.</p>
      <blockquote><p>What other design processes might be used to create typographic forms?</p></blockquote>
      <p>Others have had some good ideas. I've been working (in the loose sense of the word) on my own. I had an epiphany on April 13 of this year. I'm not saying what it is.</p>
      <blockquote><p>How do you establish criteria for functionally good notan in a writing system independent of writing?</p></blockquote>
      <p>Lacking convincing empirical findings either way, the only way is lucid thought.</p>
      <p>hhp</p>
