      <p>First off Hrant... lettering is not painting, so just put that out of your mind! Still, you persist in trying to sway others with misnomers.<br>
      Secondly, do you think that lettering artists/calligraphers go willy nilly into the dark when designing a font. That tells me you are thoughtless, and or ignorant of my "ilk's" process.<br>
