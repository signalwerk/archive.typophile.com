      <p>May I offer a suggestion?</p>
      <p>Take a series of typefaces that you admire, set up as actual text made up of words; make a composite image if their proportions are compatible; introduce a large amount of blur, so you can't tell where the edges were; bring the resultant image into your font creation software as a template to draw over, or overlay a printout with tracing paper. Find notanically sensitive path-ways liminographically against / inside / in relation to the highly blurred template. Try to get an analytic handle on and formalize the resultant black and white shapes; throw it away and do it again with a different word.</p>
      <p>Your shapes will be anchored in convention, but not directly disciplined by frontal arithmatic.</p>
      <p>This is limino-palimsest.</p>
