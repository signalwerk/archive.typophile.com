      <p>@joelsantos &amp; chrisburton: Hands down, that pencil was the siht. I <strong>highly</strong> recommend it. The choice of lead is up to you. I prefer a 2B. As a lefty, I’d recommend an F.</p>
      <p>And don’t forget the “<a href="http://www.staedtler.ca/Mars_lead_pointer_tub_ca" rel="nofollow">lead pointer tub</a>.”</p>
      <p>It makes a bit of a mess if you carry it around as the lead shavings can fall out, so you’ll have to wrap it tightly in a small plastic bag. And see that little white thing? That’s similar to a (replaceable) cigarette filter you stick and twist your freshly sharpened lead into to remove excess shavings. </p>
      <p>*sigh*</p>
      <p>I miss the days when carrying around a cool pencil and sharpener made you look bad-ass in front of your friends.</p>
