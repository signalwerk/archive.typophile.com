      <p>“I'm not interested in grazing on a plateau.” </p>
      <p>Listen, Hrant: I admire your tenacity and appreciate your restlessness. I think most of us are with you here. But breaking the black is a crap shoot, unless it’s done systematically in followable and well-considered / well-motivated ways. And liminography is even more of a crap shoot, unless the critical opening drag-line paraphrases something you’ve assimilated — perhaps with modifications — from past designs. Progressive evolution is descent with modifications. The farther you go back into typographical lines of descent, the closer you get to actual successful species of writing, so a Noordzij style analysis of form is actually very relevant, and your opening move already evokes writing. I'm assuming your opening drag-line (the opening line a spider puts down) is not a context-less ‘random-walk’ line. Nothing that we’ve seen from you so far shows me that your method brings you any closer than Dwiggins or Bloemsma, or Matthew Carter, or David Berlow, or Lucas de Groot, or Peter Verheul, or Gerard Unger to the optimal zone on the plateau that Matthew Luckiesh’s research and hints from ‘noisy accumulator’ models of perceptual processing suggest exists. What we've seen from you is interesting amd idosyncratic, but not monumentally compelling.</p>
      <p>Notan is only one of the things the visual cortex needs for effortless and automatic word-recognition. It also needs well-formed and tractable positive and negative shapes, at the level of stems and bowls and counters, that it can readily assimilate or understand. </p>
      <p>I would like to see your notan-sensitive liminography in action, preferably on you-tube, where I can see what you're doing, with a play-by-play voice-over of what you are thinking when you are doing, and an mri. I'm not interested in finished forms, just the self-imposed constraints and decisional feedback loops.</p>
      <p>But perhaps its time for me to step back.</p>
