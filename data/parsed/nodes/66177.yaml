  html: |-
    <p>I know this is shameless self-promotion, but I can not help feeling pretty proud; Suomi Script is now number eight in MyFonts Hot New Fonts-list. It's the first of my fonts ever to climb that high. </p>
    <p>Tee Franklin went pretty high, but never got to top ten. Suomi Sans and Suomi Slab Serif are on the list as well, but at the bottom half.</p>
