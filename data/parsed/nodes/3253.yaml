  html: <p>Sign up for Typeface Tag <br> <br>Each player will have 24 hours to contribute to an  <br>original typeface 3 new characters inspired by previous  <br>letters. Over many turns where the most desirable traits  <br>are emphasized players should evolve a mutually  <br>agreeable alphabet. When the typeface is complete, it  <br>will be compiled and distributed to all. Submit name  <br>and email for play at <a href="http://www.typeclub.org" target="_blank">Type Club</a>. <br> <br>News bite courtesy <a href="http://www.typographi.ca" target="_blank">Typographica</a> and Brett Jackson.</p>
