    html: |-
      <p>Signmakers and memorial makers use adapted fonts that are often lower contrast than familiar faces. They sometimes use names for their fonts that differ from the common font names.<br>
      You could try some Google searches such as "letters for signs" and check out companies such as <a href="http://www.buysignletters.com/signdesigns/shopping2/default.asp" rel="nofollow">BuySignLetters.com</a>. Major sign letter companies have several font lists for example <a href="//www.buysignletters.com/signdesigns/shopping2/shopdisplaysubcat.asp?id=25&amp;cat=Cast+Bronze+Letters+Click+Font+For+Sizes+And+Pricing" rel="nofollow">Cast Bronze Letters</a>.<br>
      Also you could search for "sign making fonts" and check out the offerings to people with machines to cut fonts in plastic. See for example<a href="http://artandsignstudio.com/faqs.html" rel="nofollow"> Signfonts.com</a>.<br>
      This is helpful if you are looking for some additional signage. If you want to print something with the font shown for the letters you might be lucky and find it under a name that relates to a standard font. But when the company uses a term like "architectural" to refer to letters that match, I can see that this would be frustrating.<br>
      As oldnick says the you may have to settle for "close." You might look at fonts categorized as Old Style, rather than Modern. The letters have a lower contrast and an angled axis for example the"O", like your specimen, rather than the high contrast and vertical axis of "Modern" fonts. Here Modern means the style popular in the 19th century -- Bodoni etc -- and Old Style refers to much earlier styles.<br>
      Don</p>
