      <p>Mark, thanks for this compilation. There are even more, I can assure you!</p>
      <p>Yes, both #1 and #2 are the East Berlin style. #3 is the former West Berlin style that now has spread to the Eastern parts aswell. It is the <a href="http://www.flickr.com/photos/hardwig/2439882179/" rel="nofollow">most common one</a>, coming in a number of flavours. #4 is the same, just (untypically) scaled down so that the long name fits in.</p>
      <p>#8 is at <a href="http://www.flickr.com/photos/52362783@N00/3777298143/" rel="nofollow">Bahnhof Schlesisches Tor</a> in Kreuzberg, most likely a relic, or an exception.</p>
      <p>I don’t know if there is a rule when to use blackletter (#11–14; I doubt it), but those signs pop up all over the city, <a href="http://www.flickr.com/photos/hardwig/2159499218/" rel="nofollow">in all kinds of substyles</a>. #12 is in Tiergarten. I’d say #13/14 is the most common blackletter style on Berlin street signs.</p>
