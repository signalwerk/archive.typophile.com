      <p>Kris, if I recall correctly, I heard Verena mention in a lecture that the West Berlin signs (3 and 4) are  a design that predates the war. The letters used are from a specific version of the Erbar typeface. [I don't know if that means "custom" in the same sense that it would today.]</p>
      <p>I assume that today, the signs are made with a digital font (because some signs in the city look artificially compressed, and also because, as Florian mentions, they scale the letters down sometimes, like in number 4). But, it could be done without a font, of course.</p>
