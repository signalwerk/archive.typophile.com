      <p>From <a href="http://www.fontfont.com/cgi-bin/showfont.pl?id=12224&amp;aid=2" rel="nofollow">FontFont.com on FF City Street Type</a>:</p>
      <blockquote><p>For decades two different signage systems divided East and West Berlin. The West used a sans serif dating back to the 30s, while the East preferred a technically-tinted sans face from the 50s. Ole Schäfer and Verena Gerlach based their designs on the street signs themselves rather than the sketches from which the signs were made. This resulted in there being two versions for the East and a single version for the West. The FontFont character set includes many characters that would never be found on a street sign so Schäfer and Gerlach designed the missing letters, punctuation and symbols. They also designed special headline fonts for both East and West available in three weights: Regular, Medium and Bold. In addition, they created lining figures and, for the expert sets, a series of arrows and other useful symbols.</p></blockquote>
    html_clean: |-
