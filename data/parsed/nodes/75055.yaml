      <p>Kris, this is what I wrote in <a href="http://www.flickr.com/photos/hardwig/3635998322/" rel="nofollow">another related thread on Flickr</a>:</p>
      <p>One has to keep in mind that those signs are subject to constant renovation and replacement – and have been for decades. There is no sole source font, but rather a fuzzy model that every manufacturer innovates upon. Just compare the other letters, ‘s’, ‘r’, ‘a’ … none of them is congruent to those on the other sign. Some newer signs (neither of these) show a noticeable reworked version of the typeface; cleaner, a tad narrower, and less geometric.</p>
      <p>--</p>
      <p>As far as I know, FSI was involved in that reworked version, which can be <a href="http://www.flickr.com/photos/offshore/4404142671/" rel="nofollow">seen here</a> – the extent of modification becomes evident when comparing the ‘y’ to the <a href="http://www.flickr.com/photos/brouk_pytlik/62518541/" rel="nofollow">one in the old version</a>.</p>
      <p>If there ever were sketches, I am pretty sure they are gone now. Verena would know. You can find some more information about FF City Street Type in <a href="http://www.atypi.org/30_past_conferences/06_Lisbon/presentations/verenaGerlach.pdf" rel="nofollow">this English pdf</a>.</p>
      <p>Nina, eat this:<br>
      <a href="http://media.smashingmagazine.com/cdn_smash/wp-content/uploads/uploader/images/signs/berlin-street-signs/full_berlin-street-signs.jpg" rel="nofollow">3 × tz + 1 × ß on one pole</a>!</p>
      <p>Ian, yes, <a href="http://www.flickr.com/photos/hajo-ed/2739652794/" rel="nofollow">we have some DIN</a>, too</p>
