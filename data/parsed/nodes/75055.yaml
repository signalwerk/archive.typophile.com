      <p>@dberlow:</p>
      <p>"Too bad Berlin can't find a world heritage level, respected and influencial master typographer who lives in town, who would probably be willing to solve the issue.;)"</p>
      <p>They do. Erik Spiekermann is involved in a lot of Berlin projects (he has an office there) and did the signage for the underground system. He is about as much a type guru as there is in my opinion. </p>
      <p>I am not sure however that Berliners find this to be a bad thing, it is not something that needs "solving" as you suggest, for many. Berlin is a unique city with lots of culture and cultures and I think many probably embrace the mish mash of various styles of signage rather than long for a uniformity of style. There are certainly a lot of good arguments for developing a consistency, but it would take some of the charm of Berlin away I think.</p>
