      <p>Roald,</p>
      <p>this has been asked before. Dan provided a good answer:<br>
      <a href="http://typophile.com/node/20905#comment-131113" title="http://typophile.com/node/20905#comment-131113">http://typophile.com/node/20905#comment-131113</a><br>
      As he writes, it is a lettering job, i.e. the letters are not from a font, but have been made just for this occasion. Dan is also right in that it is a so called <a href="http://de.wikipedia.org/wiki/Gebrochene_Grotesk" rel="nofollow">Schaftstiefelgrotesk</a> (a simplified, stripped-down blackletter style that was popular in 1930s Germany, and is still associated with the Third Reich by many). <a href="http://www.delbanco-frakturschriften.de/" rel="nofollow">Delbanco</a> has a digital version of Tannenberg. So does <a href="http://www.romana-hamburg.de/Fraktur.htm" rel="nofollow">Romana Hamburg</a>, which also offer a National. Plus there are a few freebies, one by the name Potsdam. I don’t know about the quality of these digitizations.</p>
