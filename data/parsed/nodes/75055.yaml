      <p>Amazing, one year later (and a day late), it's really nice to find this discussion via Florian's post on Flickr. My Type II class last year was fortunate enough to work with Verena's FF City Street Type, focusing our attention on the theme, "20 Jahre Mauerfall." See the full story with final poster images here: <a href="http://geotypografika.com/2009/10/16/typonauts-in-space-20-jahre-mauerfall/" title="http://geotypografika.com/2009/10/16/typonauts-in-space-20-jahre-mauerfall/">http://geotypografika.com/2009/10/16/typonauts-in-space-20-jahre-mauerfall/</a></p>
      <p>I was lucky enough to visit with Verena and Alex this past summer as well, and uploaded some more images of Berlin (mostly Kreuzberg) here, hope you enjoy! <a href="http://www.flickr.com/photos/geotypografika/sets/72157624419812998/" title="http://www.flickr.com/photos/geotypografika/sets/72157624419812998/">http://www.flickr.com/photos/geotypografika/sets/72157624419812998/</a></p>
