    <p>Hi typophiles,</p>
    <p>I'm on the testing-stage of a font family (consisting of four fonts), but have problems to make it work well under Microsoft Word. My family's Italic version shows up as default (Italics are deactivated), and there is no way of getting the Regular version on the page. When I turn on "Italics", I get a slanted version of my Regular font. Bold works, but Bold Italic is again slanted. This concerning the OT version. The TT family shows similar results. I have tested my family in two Windows machines, and there is no difference.</p>
    <p>I have tested the font on Mac apps like TextEdit, InDesign and Photoshop and it works flawlessly. WordPad on Windows is also ok.</p>
    <p>I have tested my fonts with fontQA (no worrying output) and used the Karsten Luecke font naming convention.</p>
    <p>Any suggestions?</p>
