    <p>Hi I am new to this site, its really useful to have a forum like this if we ever need to identify a type face isn’t it?!</p>
    <p>Anyway, I am looking for a particular typeface. I’m sure you’ve all seen it, it is used in a lot of science fiction contexts (it is the typeface used on the battle star galactica dvd boxes underneath the title) and I think the commonly found Terminator 2 font is a mod of it, however the the “A”’s are most definitely very different. I’ll post an image of it too just to clear up any doubts.</p>
    <p>Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="/files/fontExample_5401.jpg"></div><p></p>
