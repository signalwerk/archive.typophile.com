  html: <p>I know they had to do it. I know it makes perfect sense in a clever way. But that don't make it purdy. <br> <br>Co-branding gone bad. <br><img src="http://www.typophile.com/forums/messages/4100/23410.gif" alt=""> <br> <br>I'm not going to bother stepping up to any soap boxes over this one. But it's just more evidence that co-branding, while it may make absolute pefect business sense, rarely looks good. It rarely bolsters either brand's image. (Speaking from purely a visual-branding perspective.)</p>
