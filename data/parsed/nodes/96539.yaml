  html: |-
    <p>Hello!</p>
    <p>We're 3 second year graphic design students from Kymenlaakso University of Applied Sciences, from Kouvola, Finland. We are making our own student magazine as a school project and the subject of the magazine will be about graphic design. The magazine will also be published in the internet. (We'll announce it later.)</p>
    <p>We have chosen typography in movies as our subject for the magazine.</p>
    <p>We would like to find some people, who are somehow involved with typography in movies; whether you're very enthusiastic about it or even working with typography in movies to interview. We'd hope to learn more about this subject through your views and opinions. It would also be interesting to hear about your work or projects.</p>
    <p>Thank you in advance!</p>
    <p>For further information and questions about the interview; you can contact us by sending email to:</p>
    <p><a href="mailto:johanna.kuusisto@student.kyamk.fi">johanna.kuusisto@student.kyamk.fi</a></p>
