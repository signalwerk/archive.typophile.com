    <p></p><div class="imageWrap"><img src="http://typophile.com/files/8531959666_1ac561bc4a_c_3623.jpg"></div><p></p>
    <p>Saturday, March 16, 2013<br>
    7:00pm<br>
    1801 N Quaker Lane Alexandria, VA 22302</p>
    <p>Convergence - A Creative Community</p>
    <p>A fundraising concert will be at Convergence in Alexandria, VA. Proceeds go to help the 7 Sopranos® perform at Carnegie Hall in New York in October.  Come join the 7 Sopranos® for an evening of music, art and champagne!<br>
    Ruth Locker, my wife, is the Pianist and will accompany the 7 Sopranos® concert</p>
    <p>Enjoy the performance, take a sip of champagne during the intermission and experience the artwork of Chris Lozos. Free admission, but donations are accepted. Donations will go toward supporting Convergence and help 7 Sopranos® get one step closer to Carnegie Hall!</p>
