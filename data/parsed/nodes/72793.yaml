  - id: 430145
    user: 45826
    date: 2010-09-18T19:11:00
    date_raw: 18 Sep 2010 — 7:11pm
    votes: null
    html: |-
      <p>Good overall feel, looks especially good at larger sizes. I like the m, o and a especially and the cuts on the m, n, etc. look great. </p>
      <p>Not entirely keen on the w; I think the right hand stem makes it look too much like an upside down m. The bowl of the uppercase R seems a tiny bit too tall - I'd like to see it maybe a little bit smaller to make it less identical to that of the P (looking at word 'APPROACHES' here). The f seems to interact somewhat awkwardly with the other letters ('fun', 'coffee', 'shuffle) but maybe some looser spacing would help this. </p>
      <p>Coming along nicely!<br>
      - Claire</p>
