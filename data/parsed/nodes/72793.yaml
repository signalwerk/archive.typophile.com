      <p>New Revision (12/Sept/2010): <a href="http://typophile.com/files/SpecSheet.pdf" title="http://typophile.com/files/SpecSheet.pdf">http://typophile.com/files/SpecSheet.pdf</a></p>
      <p>This version differs significantly from the ones I have uploaded previously. Strokes now thin when they near the verticals, giving the font a look that reminds me of the Danish State Railways (DSB) font, and, for some odd reason, Kontrapunkt.</p>
      <p>Your comments would be most appreciated on how this is progressing!</p>
      <p>Kind regards<br>
      Cale</p>
