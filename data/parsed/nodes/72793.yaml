    html: "<p>The cut details in top and bottom of stems are interesting. Just some quick observations: (a) S needs work, its curves seem irregular; (b) r is too wide; (c) your ft ligature actually appears to be a long s+t ligature. Even if you don't include long s in the font, this may be confusing.</p>"
