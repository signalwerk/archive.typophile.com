    html: <p>Contextual alternates take into account the characters on either side of the character in question. They are useful, for example, in connected scripts where certain letter combinations require different forms to make a smooth connection.</p>
    html_clean: <p>Contextual alternates take into account the characters on either side of the character in question. They are useful, for example, in connected scripts where certain letter combinations require different forms to make a smooth connection.</p>
  - id: 233385
    user: 14829
    date: 2007-10-14T11:34:00
    date_raw: 14 Oct 2007 — 11:34am
    votes: null
    html: "<p>Also: contextual alternates (meaning the 'calt' feature) are intended to be \"on by default\". Applications which recognize this feature are expected to have it enabled by default. Stylistic alternates (the 'salt' feature, or stylistic sets, 'ss##') are expected to be discretionary, or off by default.</p>"
