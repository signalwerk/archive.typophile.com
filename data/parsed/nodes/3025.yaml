  html: |-
    <p>I am wondering who else on the forums is interested in the fonts from ephemera &amp; mechanical/modular sources - Receipts, LCD displays, Transit Systems signs &amp; tickets, Airport Flight displays, Baggage Stickers etc. Anything else? <br> <br><a href="http://www.lineto.com" target="_blank">http://www.lineto.com</a> seem pretty keen on this sort of thing. <br> <br>Maybe it's playing Tempest, Galaxian &amp; Pac Man &amp; as a youth that has me smitten with this category. Obviously some of these fonts are pretty awful but some of them seem pretty peachy to me - if only because they do as well as they have in their confined set of options. To me that kind of success has it's own odd beauty.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/3071" class="topic-previous" title="Go to previous forum topic">‹ Trade Gothic pairing</a> <a href="/node/2885" class="topic-next" title="Go to next forum topic">Ban Comic Sans ›</a></div>
