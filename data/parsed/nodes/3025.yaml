  - id: 24078
    user: 2942
    date: 2004-02-10T23:08:00
    date_raw: 10.Feb.2004 11.08pm
    votes: null
    html: <p>The distinction you seem to have made seems false to me.  <br> <br>Even if you are working strictly within a grid you can innovate. There have been some really beautiful pixel fonts made in the last few years.  <br> <br>In a related vein - think of arabic tiles! Some of that work is magnificent even if it is really geometic &amp; mathematical. <br> <br>But back to pixel fonts - some of whats nice about pixel fonts for instance is how well they mimic something that looks hand drawn (brushwork, or classic roman forms or woddtype forms) but in some cases whats nice about them is how they work on their own pixely terms. Those are the interesting fonts for me. <br> <br>In these cases new interesting &amp; colorful forms evolve that result in part from the constraint or environment (pixels). Rather than chafe on the pixels - the pixels are embraced. <br> <br>I'm not saying you would want to set a novel in these fonts - but that shouldn't be the only criteria for virtue.  <br> <br>What's nice about fonts from ephemera is their potential for evoking a feeling like any display face. They have a personality. Too much for a book of text. &amp; it may be somewhat industrially tinged personaility but that doesn't mean there can be no humanity coming through. <br> <br>You seem to be saying that typographic virtue can only flow from the hand. The logical extreme of which is that we should all be using fonts that mimic handwritting ( beautiful handwriting of course). You can really mean that.  <br> <br>On the other hand beauty is in the eye of beholder I suppose. <br> <br>What is this 'naturally' you refer to anyway? What do you think of Base 9 &amp; Base12?</p>
