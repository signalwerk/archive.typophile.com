    html: <p>I think it's beautiful only when it comes naturally. <br> <br>For example the funky German license plate font to me is very natural, probably because it was made a non-designer. A "designer" would never have made something so non-selfconsciously functional. Beautiful. <br> <br>hhp <br></p>
