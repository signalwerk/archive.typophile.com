    votes: null
    html: "<p>&gt; You seem to be saying that typographic virtue can only flow from the hand. <br> <br>? <br>I believe in exactly the opposite! <br> <br>I love pixels (I guess because they're still new), and I also think that embracing them (and not just black pixels either) is the key. <br> <br>Natural: Well, in the end everything is natural, I guess. But what I'm talking about is something that flows more from the medium than the person creating it. A lot of design is made for other designers, not the user - to me that's \"unnatural\". I like the Base stuff. One \"unnatural\" thing in it though is the overly narrow \"m\" in the 9: I know it's to fit the grid, but it could just have been like two \"n\"s - it seems that Licko was trying to make an ideological point - which is fine in an experimental face, but not one \"for the masses\". <br> <br>hhp <br></p>"
