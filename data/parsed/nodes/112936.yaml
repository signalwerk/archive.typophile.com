    <p>أصدقائي الأعزاء<br>
    في حديقة الورد هذه ثلاث وردات ، لكل وردة 16 تويجة<br>
    المطلوب: إدخال 96 كلمة ، عربية، أو إنجليزية ، أو ملاوية جاوية ، سداسية الأحرف، حرفا حرفا ، ، حرفا في كل خلية، على طريقة الكلمات المتقاطعة، حتى تنبعث في كل تويجة كلمتان، إبتداء من طرف الوردة، حتى قريبا من قلبها، على / في قوسين باتجاهين : أحدهما باتجاه عقرب الساعة ، وأخرى باتجاه معاكس لعقرب الساعة، أي أن الأحرف الأولى للكلمات  ستكون أقرب لأطراف الورود ، والأحرف الأخيرة أقرب لقلب كل واحدة منها<br>
    مثال : التويجة الأولى في الوردة الأولى ستقرأ مستدير (مـ سـ تـ د يـ ر) باتجاه عقرب الساعة، ومستطيل (مـ سـ تـ ط يـ ل) باتجاه معاكس لعقرب الساعة، والتويجات الآخرى تقرا: مستحيل ، مستقبل، وكلمات لغوية مختارة قابلة للترجمة بواسطة مترجم گوگل<br>
    <a href="http://translate.google.com/" title="http://translate.google.com/">http://translate.google.com/</a><br>
    آخر موعد لتبادل الورد: 12.05.2014<br>
    الجائزة: برنامج الخطوط العربية المتحركة<br>
    أداة مساعدة  <a href="http://www.eleqtriq.com/2011/03/css3-text-warping/" title="http://www.eleqtriq.com/2011/03/css3-text-warping/">http://www.eleqtriq.com/2011/03/css3-text-warping/</a><br>
    سيفوز كل من يتبادل ورد<br>
    تحياتي وتمنياتي للجميع بالفوز مع باقات من الورد المحمدي (ورد الجوري)</p>
