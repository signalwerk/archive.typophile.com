      Translating into English<br>
      Dear Friends,<br>
      When completed, each 16-petal flower in this garden will contain 32 six-letter English or Arabic words reading from the tips of the petals to the heart of the blossom, one letter per space. Half the words will proceed clockwise, the other half counterclockwise. Juggle not less than 3x32=96 words into the 3 flowers. No word duplicates and All words must be translatable by <a href="http://translate.google.com/" title="http://translate.google.com/">http://translate.google.com/</a><br>
      Deadline : 12.05.2014<br>
      Prize: Dynamic Arabic / Jawi Fonts<br>
      Every one is a winner<br>
