      <p>just a pet peave of mine, but, when someone posts up a work in progress, i feel it is better not to offer any feedback at all rather than state something negative, and then offer no constructive feedback on where the designer might turn to make improvements.</p>
      <p>i have no trouble reading this text at all. it requires some effort, for sure, but i do not equate effort with trouble. there are many highly regarded designs and works of art that require effort on the viewer's part to get the most out of it.</p>
      <p>now, i'm not saying that this or any pixel font is a work of art, but i say, push the envelope. don't be afriad of anything. it's only an idea, after all. experiment. in the long run, you, as a designer will have more fun, and develop your own style that can always be polished over time.</p>
      <p>in the mean time, i like your design jordan, it strikes me as a playful little titling font. it may not be the most original design, but there are many directions you may take it to make it your own.</p>
      <p>i think it might be served better by gaining in x-height, and even experimenting with rounding off some corners. not all corners, just enough to give the face a unique style.</p>
      <p>in the future, if you want your titling fonts to be treated as titling fonts, don't typeset them as paragraph text.</p>
