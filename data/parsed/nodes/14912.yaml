    html: |-
      <p>Jordan,</p>
      <p>I like your revisions. The font is looking really funky!</p>
      <p>(I like funky.)</p>
      <p>That said, I think the top set is a little tighter than the bottom one, simply because the bottom one is a tad random with its ascenders and descenders. </p>
      <p>However, I don't want to discourage your experimental spirit. So I suggest going the other way. Go further with your experiments. Maybe you'll find new things you like. Maybe you'll pull your hair out and curse your monitor. That's all part of it, I suppose.</p>
      <p>The bottom f looks wide to me. the h throws me, when compared to the rest of its 'kin' characters—the b, d, p, and q. I'm not sure if it throws me in a good way or a bad way.</p>
      <p>Same thing applies to the s. I like the s, but not the z. To me, the z wants to follow the funkiness of the s.</p>
      <p>I'm not sure how I feel about the short stem on the v, but I like your willingness to share your experimentation.</p>
      <p>As it stands, and please note that I am not an authority on the greater virtues of type design and its rich history, this set hasn't achieved the look and feel of a 'family' yet.</p>
      <p>Keep working on it though. See how far you can take the different ideas you show in different characters throughout this set, but try and apply each idea throughout the entire set, such that you end up with potentially for or five completely unique sets.</p>
      <p>Whether or not this ever turns into something you want to hang your hat on, you will have learned a lot, not only about the demands of type design, but the unique nuances of your own workflow.</p>
      <p>Onward, man. Post up more work!</p>
      <p>Tyler</p>
