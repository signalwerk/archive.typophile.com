    <p>Yep, another face from me. Sorry for hogging the critiquing attention everyone.</p>
    <p>I wanted to design a square face, unicase, monoheight, monowidth, though the more are started working on the glyphs I realised that putting in non square characters -- ascenders, descenders, narrow 'i's, even alternate stroke weights -- didn't distrub the feel too much.</p>
    <p>So here's my boxy typeface*, comments welcome.</p>
    <p>Jord</p>
    <p>* The text in the sample comes from my website, hence the 'third' bit, don't worry, I shan't be posting up the other face :)</p>
    <p><strong>EDIT</strong></p>
    <p>Boxybit_family added, showing roudned letters.</p>
