    <p>Hi, I’m making a short film where people pose as letters, to make words in groups, that respond to a voice over poem.. I’ve been trying to research images, typogreaphys, or other people who might have done something similar.. have found nothing... The work is to be filmed with the people standing up, not laying down... was wondering if any people here had any ideas on how to design the people letters.. maybe collaborate a bit.. I’ve done a similar film before, but it didn;t really work as the people didn;t really look that much like the letters, i need to design them more strongly. Also was thinking fo puuting in some kind of elastic band thing, that they pull to give the letters an outline, though only an idea at mo. Please hlep as woule love to make something great, looking at this site made me realise I know nothing about typ.. here is link to previous work.....thanks</p>
    <p><a href="http://youtube.com/watch?v=PJ4sI2_amM4" title="http://youtube.com/watch?v=PJ4sI2_amM4">http://youtube.com/watch?v=PJ4sI2_amM4</a></p>
