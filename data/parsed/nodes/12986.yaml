    <p><strong> <a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> : Fette Fraktur</strong></p>
    <p><a href="http://www.linotype.com/424/fettefraktur-family.html" rel="nofollow">http://www.linotype.com/424/fettefraktur-family.html</a></p>
    <p>Fette Fraktur is probably the most used Blackletter typeface today. This probably has more to do with marketing decisions than with any instrinsic merits the design has. Fette Fraktur is a very 19th Century Fraktur. It has been described by some as "Victorian," even though it was designed before the Victorian-era (and in Germany instead of Britain). Others have described it as Neo-Classical or Romantic (in the sense of 19th Music and Art forms, not necessarially in that other romantic sense, i.e., love).</p>
    <p>Fette Fraktur is probably bestly described as a Fat Face variant on the Fraktur theme. Hey, fat face worked <em>so</em> well for Didones…</p>
    <p>Fette Fraktur was first released sometime before 1842 by <a href="/wiki/Joh.%20Peter%20Nees%20%2526%20Company" class="freelinking" rel="nofollow">Joh. Peter Nees &amp; Company</a> in Offenbach, Germany. The foundry was later purchased by the Ruhard'sche Gießerei, which during the early 20th Century because the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry.</p>
    <p>Klingspor was absorbed into the <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> by the 1950s. Stempel converted Fette Fraktur into a photosetting face, which was later converted into a digital font. This digital font was part of a very popular bundle that Linotype and its partners (including Adobe) distributed during the 1980s and 90s.</p>
    <p><a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a> now sells Fette Fraktur via its website, amoung other places.</p>
