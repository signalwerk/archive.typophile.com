    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>&nbsp;: Fette&nbsp;Fraktur</strong></p>
    <p><a href="http://www.linotype.com/424/fettefraktur-family.html">http://www.linotype.com/424/fettefraktur-family.html</a></p>
    <p>Fette Fraktur is probably the most used Blackletter typeface today. This probably has more to do with marketing decisions than with any instrinsic merits the design has. Fette Fraktur is a very 19th Century Fraktur. It has been described by some as “Victorian,” even though it was designed before the Victorian-era (and in Germany instead of Britain). Others have described it as Neo-Classical or Romantic (in the sense of 19th Music and Art forms, not necessarially in that other romantic sense, i.e.,&nbsp;love).</p>
    <p>Fette Fraktur is probably bestly described as a Fat Face variant on the Fraktur theme. Hey, fat face worked <em>so</em> well for&nbsp;Didones…</p>
    <p>Fette Fraktur was first released sometime before 1842 by <a href="/node/add/wiki?edit%5Btitle%5D=Joh.%20Peter%20Nees%20%26%20Company" title="Create node &quot;Joh. Peter Nees &amp; Company&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joh. Peter Nees <span class="amp">&amp;</span> Company</a> in Offenbach, Germany. The foundry was later purchased by the Ruhard’sche Gießerei, which during the early 20th Century because the <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> foundry.</p>
    <p>Klingspor was absorbed into the <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> by the 1950s. Stempel converted Fette Fraktur into a photosetting face, which was later converted into a digital font. This digital font was part of a very popular bundle that Linotype and its partners (including Adobe) distributed during the 1980s and&nbsp;90s.</p>
    <p><a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a> now sells Fette Fraktur via its website, amoung other&nbsp;places.</p>
