    <p>Hey there, </p>
    <p>I'm working on logo for my friends graphic freelnacers.<br>
    Theirs collective is called Rawflava, what means more or less pure gold.</p>
    <p>I thought about something simple and friendly and it should look good in print and on screen.</p>
    <p>Then I started searching something in symbolism about interpretation of gold and I found that in the past people were using same symbol for<br>
    Sun and gold.</p>
    <p>I'm still not 100% sure about it, so I'm asking you for critique (mainly on rythm and kerning).</p>
    <p>Sorry for my bad english.</p>
    <p>Cheers,<br>
    Adas</p>
