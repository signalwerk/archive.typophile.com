  html: "<p><img src=\"http://www.typophile.com/forums/messages/4100/36385.gif\" alt=\"\"> <br> <br>The new FedEx Kinko's design is being discussed at: <br> <br>Foreword: <a href=\"http://www.ospreydesign.com/foreword/archives/000897.html\" target=\"_blank\">http://www.ospreydesign.com/foreword/archives/000897.html</a> <br> <br>Typographi.ca: <a href=\"http://typographi.ca/000845.php\" target=\"_blank\">http://typographi.ca/000845.php</a> <br> <br>My own take is that it's a huge improvement over Kinko's old logo, but the font choice for Kinko's is a bit strange. I'm wondering why Landor would take steps to find something similar to Futura without just using a lighter cut of Futura.</p>"
  html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/4100/36385.gif\" alt=\"\"> <br> <br>The new FedEx Kinko's design is being discussed at: <br> <br>Foreword: <a href=\"http://www.ospreydesign.com/foreword/archives/000897.html\" target=\"_blank\" class=\"link-external\">http://www.ospreydesign.com/foreword/archives/000897.html</a> <br> <br>Typographi.ca: <a href=\"http://typographi.ca/000845.php\" target=\"_blank\" class=\"link-external\">http://typographi.ca/000845.php</a> <br> <br>My own take is that it's a huge improvement over Kinko's old logo, but the font choice for Kinko's is a bit strange. I'm wondering why Landor would take steps to find something similar to Futura without just using a lighter cut of Futura.</p>"
