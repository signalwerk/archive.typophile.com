    html: <p>I had a chance to visit Landor the day after FedEx announced their buying out Kinko's... Initially the mark was more like the ETrade logo. They were playing off the arrow in the "K" in Kinko's and used the colors FedEx currently uses with their different services. After some time they plan on dropping the "Kinko's" and just have it say FedEx Office and Print Center. </p>
