    html: <p>&gt;After some time they plan on dropping the "Kinko's" and just have it say FedEx Office and Print Center.&lt; <br> <br>Then why bother with the stupid flower asterisk thing? Why not just the word Kinkos in simple type and be done with it.  Now it is a cluttered mess.  Perhaps this was just "corporate fencing" trying to appease the old Kinkos bosses and the designers were just along for the ride. <br> <br>ChrisL</p>
