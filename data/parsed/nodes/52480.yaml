    html: |-
      <p>Hi Martin,</p>
      <p>only glyphs which have a unicode assigned can be inserted in Word. If your dingbats are in the ornament OT feature in your font, they probably have no unicode. You could assign them unicodes from the Private Use Area to make them accessible.</p>
