      <p>Mike, I think you're right. </p>
      <p>The C, a (top), and t (top) are a dead-on match, the top of the l has been angled to match the top of the t, the o cleaned up, and the bottom of the vertical strokes of the l, a, n, and t spiked.</p>
      <p>Great eye.</p>
