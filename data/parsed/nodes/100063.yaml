  html: |-
    <p>HI guys,<br>
    I've started this ladproject, it's a "letterform a day" project. I was hoping to see if anyone else would like to join me in this experiment/project. The basics of it are, to "find" or make a letterform a day for 50 days. It can be found anywhere or in anything. You can make one or draw one. Paint one or just find one that's already made. An exercise to open up the possibilities of what can be considered typography, or where we can find typography. Inspired by Stefan Sagmeister and Michael Beirut, I've dedicated myself to find or make a letterform a day. You can follow the progress here... <a href="http://nicolascervantes.wordpress.com/" title="http://nicolascervantes.wordpress.com/">http://nicolascervantes.wordpress.com/</a>  Post your letterforms there and also comment. Thanks guys, here's aB that jumped out at me today.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/b_small_5629.jpg"></div><p></p>
