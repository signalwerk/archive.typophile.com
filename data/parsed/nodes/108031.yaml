      <p>You've come to the right place (even though so far you've only received advice from somebody who has never designed a font). It's only recently that Typophile has become sufficiently usable again, so hopefully you'll get some real help soon.</p>
      <p>The thing is, a really good book on type design has yet to be written. But Cheng's "Designing Type"* does a good job of opening eyes. As does what we around here call The Triumvirate: <a href="http://typophile.com/node/15349" title="http://typophile.com/node/15349">http://typophile.com/node/15349</a></p>
      <p>* <a href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509" title="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509">http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509</a></p>
      <p>Mostly learning to design type seems to involve a great deal of observation, and a necessarily personal development of style. Just be prepared to invest a lot of time, with only a small likelihood of substantial material reward.</p>
      <p>hhp</p>
