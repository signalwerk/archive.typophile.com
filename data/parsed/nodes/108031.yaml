      <p>The main reason that I created this topic was not to let other people search for me, but to ask designers who have been making typefaces for a long time on their opinions of must-read books about creating typefaces. I would rather have the opinion of a professional instead of '8 must-read tips about typefaces', if you know what I mean.</p>
      <p>The article you link to is very interesting. Thank you very much.</p>
