      <p>Good for you, the Typophile wiki you cite is a very good place to start. Much better than internet musings.</p>
      <p>The only thing I'd add, that shows up all too rarely, is the fit of letters, esp. in running text (rather than in a few letters or words, as found in headlines or advertisements). </p>
      <p>The letterforms themselves, and how to draw them for various implementations (many ways to put ink on paper or pixels on a screen), are one thing. The fit of them in all their possible combinations, and the inevitable compromises that occasions, is something that just doesn't make it into print. Probably this is because because compromise is always involved, and compromise always means more than one solution is possible. As best I can tell, this is a skill you have to develop yourself, and for most of us, it does not come quickly.</p>
