  html: <p>Hello! <br> <br>We suspect that we have some corrupted fonts that are  freezing up our computers at work. <br> <br>Is there any software that would catch corrupted fonts? Norton Utilities is not doing complete job on that... <br> <br>I appreciate your help. Thank you!!</p>
