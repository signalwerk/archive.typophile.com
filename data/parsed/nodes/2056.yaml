    html: <p>I'm guessing Misa's having problems with her Macs, but for those who think a messed up TrueType or OpenType font may be messing with their Windows machines this tool might help locate the offending font... <br> <a href="http://www.microsoft.com/typography/developers/validator/default.htm" target="_blank">http://www.microsoft.com/typography/developers/validator/default.htm</a> <br> <br>Also the more recent versions of Windows with all the security patches in place do a much better job of identifying the bad fonts and stopping them from screwing things up, than say Windows 98. <br> <br>Si</p>
