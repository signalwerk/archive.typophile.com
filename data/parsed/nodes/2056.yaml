    html: <p>You might consider FontDoctor, if you're on a Macintosh. Like any other powerful "fix-it" application, it is important to be knowledgeable about what you're "okaying", otherwise you could do some damage. <br> <br><a href="http://morrisonsoftdesign.com/fd_mac.html" target="_blank">http://morrisonsoftdesign.com/fd_mac.html</a> <br></p>
