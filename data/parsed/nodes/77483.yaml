  html: |-
    <p>Hello!<br>
    Im looking for a gothic inline font with open ends.<br>
    Preferably with optical equal strokes. Any suggestions?<br>
    Dessau Pro Plakat is the closest, but I don't like the A's and W's.<br>
    Neutra no.2 suffer with the same M &amp; W's, and got a to thin inline.</p>
    <p><a href="http://www.fontshop.com/fonts/singles/fountain/dessau_pro_plakat/" title="http://www.fontshop.com/fonts/singles/fountain/dessau_pro_plakat/">http://www.fontshop.com/fonts/singles/fountain/dessau_pro_plakat/</a><br>
    <a href="http://www.houseind.com/fonts/neutrano2/viewfonts" title="http://www.houseind.com/fonts/neutrano2/viewfonts">http://www.houseind.com/fonts/neutrano2/viewfonts</a></p>
    <p>Any helps appreciated:)</p>
