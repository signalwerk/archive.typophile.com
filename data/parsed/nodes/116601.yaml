    <p>Hey folks,</p>
    <p>This is probably not even possible, but I'm trying as a last resort. A client doesn't have a vector of their logo and I'm trying to match up the TM in their logo. I've managed to figure out/match up all other fonts but this. I know this isn't much to go on, but I cannot seem to find anything that's close to this. Any ideas at all, besides 'just use whatever' :)</p>
    <p>Thanks so much!</p>
