    <p>Hello,</p>
    <p>I'm currently working on a typeface based on what I believe to be late 1800s, early 1900s british railway signage. Below is a sample of the sort of lettering I hope to recreate.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/P1090070edit_6226.jpg"></div><p></p>
    <p>There are some variations on this theme that I have found so far. I can only assume that some are old version and some more recent?<br>
    I think this style of lettering may sit somewhere between Figgins san serifs and possible Johnston's Underground lettering.</p>
    <p>I was wondering if anyone new any information about this style of lettering that would be of use to my project?</p>
    <p>Thanks. Jonathan</p>
