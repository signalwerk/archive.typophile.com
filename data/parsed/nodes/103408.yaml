    html: |-
      <p>I intend to take the characteristics of these letters and get them working as a display typeface, not directly mimic them. I would certainly take care to optically adjust the letters so that they aren't as clumsy as the examples.</p>
      <p>The image was taken in Moore St station in Birmingham which has apparently been restored back to it's original 1930s appearance - whether the signage is historically accurate I'm not sure but I presume it is.</p>
      <p>I have plenty of other samples of this kind of letter and it is all railway signage and as I say from what I can gather at the moment this style of lettering was used around late 1800s / early 1900s  - before Johnston and Gill's typefaces.</p>
