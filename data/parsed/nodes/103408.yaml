      <p>There are foundries that specialize in dorky letters such as those. I'm not sure if it would be an insult or a compliment to mimic or stay away from their precedents.</p>
      <p>In terms of how to make such fonts: just use a grid and "expanded skeletons" and do no optical correction whatsoever. That's how you would arrive at a horrible "A" like that for example.</p>
      <p>hhp</p>
