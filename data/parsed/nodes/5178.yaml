    html: <p>Mark, how different is MS Sans Serif from Tahoma? Visually comparing my XP desktop with the Win 95 screenshots on Marcin Wichary's wonderful <a href="http://www.aci.com.pl/mwichary/guidebook/">GUIdebook</a> site, the two look very similar.</p>
