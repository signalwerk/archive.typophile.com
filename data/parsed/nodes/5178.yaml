    html: <p>MS Sans Serif was eventually made into an outline font as well. I think it first appeared as an OpenType font with Windows 2000, and is titled "Microsoft Sans Serif" (no abbreviation). The old bitmap MS Sans Serif is named sserife.fon on my system. The outline version is named micross.ttf. <br> <br>I think Tahoma made its debut with Office 97, at least that's when I first recall seeing it. </p>
