    date: 2004-06-11T07:31:00
    date_raw: 11.Jun.2004 7.31am
    votes: null
    html: <p>At screen resolution, they are pretty similar. However, MS Sans Serif is bitmap only. I think Tahoma replaced it when they decided to go with an outline font.  <br> <br>Tahoma was created by Matthew Carter (who, as we all know, also did Verdana, which is very similar). I imagine Microsoft wanted to keep it fairly similar to MS Sans Serif and that may be why they look similar. </p>
