  html: |-
    <p>Greater Albion has just launched Flapper, a family of four faces on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/flapper/ " rel="nofollow"> Fontspring</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/flapper/ " rel="nofollow"> Myfonts.com</a>.</p>
    <p>Flapper is family which embodies a great deal of fun and more than a little spirit of the roaring 20s.  If ever a set of typefaces could dance a high kicking Charleston, these are they.  Flapper is offered in regular, condensed, oblique and outline forms, and they all bring a great deal of fun and life wherever they are used.  The Flapper family (yes, think of one of those dancing 20s girls with a long string of pearls...) is ideal for casual heading, bold captions, poster work and anywhere else a sense of fun is required.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Flapper-1_6170.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Flapper-2_4100.png"></div><p></p>
