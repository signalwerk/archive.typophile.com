    votes: null
    html: |-
      <p>It is the white background that reveals the black letters.<br>
      To get better pattern in a block of text the letters should be<br>
      designed to do justice to the white spaces.<br>
      It is the white spaces that determine the best spacing.<br>
      The length of the foot of the L should dictated by what the space<br>
      around it wants even if the L on it own looks out of proportion.<br>
      The whole should always be more important than the part.</p>
      <p>Ieuan Rees</p>
