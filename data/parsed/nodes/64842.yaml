    html: <p>Spacing is not normally mathematical, nor do letter shapes need to be the same width (unless that is a design feature you are seeking). In the sample above, the fact that the L is so wide, and the fact that the right side of the letter is so open, means that you would probably want to kern that space more than the other side. I would also look at shortening 20 to 25% of the bottom line of the L.</p>
