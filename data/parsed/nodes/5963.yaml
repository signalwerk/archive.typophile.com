  html: "<p>Hi there! I've been lurking around here for quite some time but now I've finally registered.. <br> <br>I'd love to get some comments and critique on the Corporate Identity for my Webpage. <br> <br>It's called bloobseven.. the left symbol stands for an abstract b and the right one for an abstract 7.. <br> <br>I rounded the edges to make it easier to look at it and added a bit perspective to make it look more interesting and recognizable.. what do you think? <br> <br>Also I'm struggling with the Font Type <br>Currently I'm using Microgramma which was modified a bit in the top left logo version <br> <br>c&amp;c appreciated <br> <br>thx, mike  <br> <br>Edit: somehow the html code doesn't work properly.. anyway here's the link: <br> <br>http://sile.dhcp.at/bloob_ci.jpg</p>"
