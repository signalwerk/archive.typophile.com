    html: "<p>Michael, <br> <br>Try a few other fonts like Infinity ExtraBold from Thirstype:  <br><a href=\"http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=bloobseven&amp;p=48\" target=\"_blank\">http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=bloobseven&amp;p=48</a> <br>Infinity isn't over-used like Microgamma and Eurostyle.  <br> <br>I think if you used \"creative\" or \"design\" with bloobseven it would work better. There is nothing wrong with using a name that has no real meaning, but I would put a word that does have meaning with it. Try placing it under bloobseven small with about 1000 points of tracking: <br><a href=\"http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=CREATIVE&amp;p=16\" target=\"_blank\">http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=CREATIVE&amp;p=16</a> <br> <br>Also experiment with possibly having rounded corners on your card. That would fit your design. <br> <br>On the back of the card I would use a different font than what your logo is done with and separate your name from the icon.</p>"
    html_clean: "<p>Michael, <br> <br>Try a few other fonts like Infinity ExtraBold from Thirstype:  <br><a href=\"http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=bloobseven&amp;p=48\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=bloobseven&amp;p=48</a> <br>Infinity isn't over-used like Microgamma and Eurostyle.  <br> <br>I think if you used \"creative\" or \"design\" with bloobseven it would work better. There is nothing wrong with using a name that has no real meaning, but I would put a word that does have meaning with it. Try placing it under bloobseven small with about 1000 points of tracking: <br><a href=\"http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=CREATIVE&amp;p=16\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/thirstype/infinity/stextra-bold/testdrive.html?s=CREATIVE&amp;p=16</a> <br> <br>Also experiment with possibly having rounded corners on your card. That would fit your design. <br> <br>On the back of the card I would use a different font than what your logo is done with and separate your name from the icon.</p>"
