    html: "<p>I guess the biggest concern I would have on your behalf is in the mark. In the 50's \"squares\" (brainiacs, nerds, mamma's boys) were called \"L-7s\", and your mark distinctively looks more like an \"L-7\" than a \"b-7\". This might not have been such a big deal, but this \"L-7\" identity had somewhat of a revival in the 90's, as an abbreviated version \"L\" (Loser) was popularized to the masses by Smashmouth's #1 single. The mark is achieved by pointing up and extending the thumb outward to create the \"L\" shape, similar to how the youth of the 50's created an \"L\" with one hand and a \"7\" with the other to form a square. I guess my point is that I think too many people still recognize what \"L-7\" represents. <br> <br>Aesthetically, it does make a nice shape</p>"
    html_clean: "<p>I guess the biggest concern I would have on your behalf is in the mark. In the 50's \"squares\" (brainiacs, nerds, mamma's boys) were called \"L-7s\", and your mark distinctively looks more like an \"L-7\" than a \"b-7\". This might not have been such a big deal, but this \"L-7\" identity had somewhat of a revival in the 90's, as an abbreviated version \"L\" (Loser) was popularized to the masses by Smashmouth's #1 single. The mark is achieved by pointing up and extending the thumb outward to create the \"L\" shape, similar to how the youth of the 50's created an \"L\" with one hand and a \"7\" with the other to form a square. I guess my point is that I think too many people still recognize what \"L-7\" represents. <br> <br>Aesthetically, it does make a nice shape</p>"
