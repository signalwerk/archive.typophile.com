    html: <p>I agree with Scott, although I was not aware of the historical significance of L7. But that is what your logo looks like. A simple solution may be to fill up the negative space between the two characters with the bowl of the b. However that may throw off the balance and look cartoonish. <br> <br>Would you please post a link to your page, it will help the forum give a more informed critique. I tried bloobseven.com but got some kind of on-line coupons site, so the name is not so unique. Also tried bloob7 which linked back to bloobseven and was unsucessful searching on Google as well. <br> <br>look back at other critiques "Klim", "TY (self identity)" and "Munoz" are especially good. I'd send you to mine but I haven't developed a sucessful solution yet. <br> <br><a href="http://www.typophile.com/forums/messages/29/33935.html?1091697787" target="_blank">http://www.typophile.com/forums/messages/29/33935.html?1091697787</a> <br> <br><a href="http://www.typophile.com/forums/messages/29/20969.html?1089339624" target="_blank">http://www.typophile.com/forums/messages/29/20969.html?1089339624</a> <br> <br><a href="http://www.typophile.com/forums/messages/29/27518.html?1083707071" target="_blank">http://www.typophile.com/forums/messages/29/27518.html?1083707071</a></p>
