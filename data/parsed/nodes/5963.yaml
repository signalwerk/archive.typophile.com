    html: "<p>hi! thx for your replies!  <br> <br>well bloob7 doesn't necessarily mean anything.. It just popped into my head and I liked it, cause I think it's quite unusual and therefore pretty catchy <br> <br>Bloobseven is my online portfolio , which is currently offline though, where I showcase my work such as CI,websites etc. <br> <br>I didn't go into the direction of calling it Michael Nagy Design on purpose, cause personally I think it sounds too serious <br> <br>@Mark: Personally I'd prefer a logo rather than a wordmark but in this case I think that the wordmark doesn't necessarily fit the logo <br> <br>@ Scott: I can see your concern but as far as I know the L7 stuff started in America and since I live in Europe, the concern shrinks a bit. <br> <br>Keep the comments and ideas coming please.. I'll then try to rework it</p>"
