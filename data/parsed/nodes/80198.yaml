  html: |-
    <p>Hello all -</p>
    <p>Working on a small publication that needs to have a bit of a mid-century modern feel.<br>
    Using Neutra for some of the heads and subheads, and I'm looking for a good font to pair with that for the body text - preferably a serif.</p>
    <p>There are many large blocks of copy throughout the piece, so I was looking for something with a decent x-height for readability.<br>
    I'm not liking the feel of several traditional faces: Schoolbook, Clarendon, Garamond, etc.  </p>
    <p>Wondered if anyone might have some suggestions for a fresh serif with a lovely italic...I'd be most appreciative!</p>
