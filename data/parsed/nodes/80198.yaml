    html: |-
      <p>While there are many ways to build a type palette, one approach is to look into other typefaces designed by the same foundry. Sometimes this will give you clues toward a possible solution. Eames Century Modern (created by House as well) could be a good match for Neutra, evoking some of the attitude and personality associated with mid-century design stalwarts Charles and Ray Eames. It has an x-height that lends itself to small text sizes and the italics are very attractive in use.</p>
      <p>I should mention that Eames has a very distinct personality. This may not suit your purposes if you are looking for a more subdued serif.</p>
      <p><a href="http://www.houseind.com/fonts/eames" title="http://www.houseind.com/fonts/eames">http://www.houseind.com/fonts/eames</a></p>
      <p>Neutra also has a complimentary slab version as well, which would not work as effectively as Eames in large blocks of small copy, but may work in a supporting role if you want to give your publication a bit more texture without being busy. Be forewarned that adding a third typeface and making it work is never an easy task to accomplish.</p>
      <p><a href="http://www.houseind.com/fonts/neutrafaceslab" title="http://www.houseind.com/fonts/neutrafaceslab">http://www.houseind.com/fonts/neutrafaceslab</a></p>
      <p>Also look at historical references of work done during that time. That can also help refine your choices in styles since you are looking to reflect that era.</p>
      <p>. . . . . . </p>
      <p>Building a typographic palette requires a lot of research, experimentation, and looking at the finer details, but I look at it as one of the more enjoyable aspects of typography.</p>
      <p>~ A</p>
