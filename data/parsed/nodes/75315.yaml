  html: |-
    <p>Hi folks.</p>
    <p>When it comes to hyphenation while my case-feature is active (and positioning some glphys a 100 units higher) a missing glyph right after the hyphen occures. “.notdef” is displayed. This only happens when case-feature is active (positioning the hyphen). </p>
    <p>My theory is that this may be because case feature is described in the spec as GSUB features, not GPOS. Can anyone confirm or discard this? Sadly I couldn't find the OT specs for this on my own.</p>
    <p>If not: What is the reason for this missing glyph? How to fix this? </p>
    <p>I really hope someone can help me with this problem. </p>
    <p>PS: This does not happen if I insert a hyphen manually.</p>
