    <p>Hello,</p>
    <p>I would love to use the font Jacobean Initials <a href="https://web.archive.org/web/20080720062706/http://www.p22.com/lanston/jacobeaninitials.html" title="http://www.p22.com/lanston/jacobeaninitials.html">http://www.p22.com/lanston/jacobeaninitials.html</a> however it does not include numbers. </p>
