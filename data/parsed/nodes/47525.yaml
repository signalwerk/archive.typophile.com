      <p>I can confirm that using the unusual method ;-) of saving the picture, </p>
      <p>&gt;&gt;Viewing the Word document, press [Print Screen], Open Powerpoint, Paste image. Crop the image in Powerpoint and save as png. </p>
      <p>This method will result in the image being scaled by Powerpoint, which does indeed introduce GreyPixels into the image. A print screen, pasted into Paint for example then saved as .png, will give correct results, which is Gentium displayed in Black and White, when the system is set to standard smoothing.</p>
