      <p>Isn't it true that the data (e.g. the outlines) used to render type (print or on screen) is always the same?<br>
      If this is the case, then what makes screen type difficult to read? I think the answer is <a class="freelinking external" href="http://en.wikipedia.org/wiki/Dot_pitch" rel="nofollow">dot pitch</a>. I think if in the future we have screens with smaller dot pitches of over 300 dpi, screen type will get more legible (the contrast for example is already good enough I think). I think the greater the dpi, the smaller the visible difference between anti-aliased and non-anti-aliased, right?<br>
      And then type would look good on screen, even in Word! :)</p>
      <p>Jurriaan</p>
