      <p>If you are looking at enlargements of screen types, you must be sure to enlarge by powers of 2. 100%, 200%. 400% or 800% are all the 'accurate' enlargements there are. </p>
      <p>Jurriaan's image, and account of its creation, reminds me that others say their screen font developments are in the interest of presenting the closest image to the printed page, which they claim as an achieved goal. But, when one views a photo of a printed page on the screen, it always looks much better than the wysiwyg version...</p>
      <p>Try it, you'll see. </p>
      <p>Cheers!</p>
