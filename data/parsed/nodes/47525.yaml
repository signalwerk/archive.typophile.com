    html: |-
      <p>The problem, as was suggested earlier, is from hinting.<br>
      Verdana TNR and Calibri were all manually hinted, meaning a person applied all the truetype instructions, assessed the results, and adjusted as necessary, for every letter in the font, especially at screen display sizes. </p>
      <p>Gentium looks passable in the Roman, but displays more problems in the italics. The fonts were probably autohinted. An autohinter can be tuned to give decent results in more predictable situations, like most traditional upright designs, but when the same algorithms are applied to the italic designs, they often make incorrect decisions, and the results look worse than unhinted at display sizes. The issue is that the autohinter is applying hints in either the horizontal or vertical direction within the character, so it doesn't know what to do when it finds an oblique stem. In the lower case "a",. it obviously made a very poor "choice"<br>
      Human hinters can apply diagonal hint instructions to alleviate those problems, but obviously this is a time consuming process.</p>
    html_clean: |-
