    <p>Hi All,</p>
    <p>This is my debut post on typophile, and I'd like to post a question about Gentium, the free font I suppose most of you know about.</p>
    <p>Trying out this font, I thought it looked strikingly crappy in Word, compared to when you print it (the same page from Word). This difference may be common, but it seems greater for Gentium. I think it's beautiful on paper, but it's just horrible and not very legible in Word.</p>
    <p>So I wonder, how come? What is it about Gentium that causes this?</p>
    <p>The difference I'm talking about is for example smaller for Verdana or Calibri, typefaces designed to be legible on screen as well as on paper.</p>
    <p>Jurriaan</p>
