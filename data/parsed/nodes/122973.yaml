      <p>Can't agree more with Kevin, very "Avant-Gard-ish" or rather Futura with some earmarks of Avant-Garde Gothic (open /R, /G...). Wasn't able to spot a match either so maybe it'd be not so hazardous to conclude it is bespoke and exclusive for Acura which could make sense when talking about (high-end) car manufacturing.</p>
      <p>EDIT: confirmed. Embedded as webfont on their <a class="freelinking external" href="http://www.acura.com/FutureVehiclesILX.aspx" rel="nofollow">website</a> under the name of 'Acura bespoke'.</p>
      <p>EDIT2: should have been designed by half of VoidWreck <a class="freelinking external" href="http://www.voidwreck.com" rel="nofollow">Karl Nawrot</a> for <a class="freelinking external" href="http://www.mullen.com/tag/acura" rel="nofollow">Mullen</a></p>
