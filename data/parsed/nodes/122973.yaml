    <p>This font is in a new Acura commercial called "Drive like a boss." It flashed for a few seconds on screen. I also found a "making of video" released by Acura on Youtube and it also has the same font with even more characters. I included all the possible text from the videos in the image.</p>
    <p>Please help me identify this font. And if you know of similar fonts, please suggest those as well.</p>
    <p>Here is the "making of video" on youtube:  <a href="/wiki/https%3A/%252Fwww.youtube.com/watch%3Fv%3D8jZOJDupNIw" class="freelinking" rel="nofollow">https://www.youtube.com/watch?v=8jZOJDupNIw</a></p>
    <p>Thanks.</p>
