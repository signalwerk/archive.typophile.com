  html: |-
    <p>I have a student that has written a report about Nebraska at home and has brought it in to be turned in today.  He is not sure what font he used at home and it is showing up as gibberish when I open it here at the school in word.  Any help identifying the font, or pointing out how to find the correct font would be greatly appreciated.</p>
    <p>Thanks,<br>
    Dan</p>
