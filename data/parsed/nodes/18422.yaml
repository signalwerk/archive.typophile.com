  html: |-
    <p>When I copy-paste a (1-bit) bitmap from Photoshop<br>
    to FontLab on Windows, I get a nice full-resolution<br>
    image in the background. But when I do the same on<br>
    OSX I get an extremely coarse image. What gives?</p>
    <p>hhp</p>
