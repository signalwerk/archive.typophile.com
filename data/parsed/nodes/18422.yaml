    date_raw: 9.Mar.2006 10.44am
    votes: null
    html: <p>Apparently, FL looks at the physical dimensions of the image (in inches, points, whatever) and converts it to 72 dpi before pasting. The only way to get all the pixels is to make the conversion yourself beforehand. It doesn’t make much sense, but that’s how it works.</p>
