  html: |-
    <p>hi!</p>
    <p>i’m a graphic design student from berlin.</p>
    <p>can anybody tell me which font was used on the dvd cover of “inside bjork”?</p>
    <p>and where can i get it? maybe for free with an education license for the font...</p>
    <p>it’s not the “FIG script”...</p>
    <p>with very best and thanx for your help</p>
    <p>rm</p>
