  html: <p>I am using the latest Font Explorer (4.1) and CS 5 and was wondering if anyone knows a way to hide the system fonts from the font menus in InDesign. It's so irritating to have to scroll through Gujarati and Chalkduster when I'm trying to select a font.</p>
