    html: |-
      <p>I use Font Explorer, not Font Book. But AHA! I just figured out how to deactivate the ones the system doesn't need!</p>
      <p>View: System Fonts: Show in Smart Sets. </p>
      <p>Then you can deactivate most of them (a few are clearly required, and are greyed out) then go to Hide Smart Sets et voila! Thanks Ralf.</p>
    html_clean: |-
