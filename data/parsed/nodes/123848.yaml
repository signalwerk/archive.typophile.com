    html: |-
      <p>Assuming this comes from a Leica lens and according to this <a class="freelinking external" href="http://www.l-camera-forum.com/leica-forum/customer-forum/46666-whats-font-name-used-leica.html#post497098" rel="nofollow">post</a>, font should be 'LG 1045/1050', proprietary and exclusive to Leica.<br>
      Alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/vox-round" rel="nofollow">Vox Round</a> (and mixing it with <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/sol-pro" rel="nofollow">Sol</a> could work), <a href="/wiki/https%3A/%252Fwww.fontshop.com/families/basic" class="freelinking" rel="nofollow">Basic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/btn/zolan-mono-btn" rel="nofollow">Zolan</a> (Mono)</p>
