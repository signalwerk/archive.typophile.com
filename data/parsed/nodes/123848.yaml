    html: |-
      <p>Can't find an exact match either. Take into account that this is probably a custom OEM font of the lens manufacturer designed for the lens production machine and not a commercially available digital font.<br>
      You may like one of the following replacement candidates, here is a square looking one:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Suomi%20%2F%20%28Commercial%29&amp;ffam=Thud%20-%20Medium&amp;fid=3f6e746c92f5fae0c339a0d953677eda&amp;fsize=60&amp;text=DC%20ELMARIT%201%3A2.8%2F10.2%20ASPH&amp;wrap=2" rel="nofollow">Thud (Medium)</a></strong> by Suomi Type Foundry [2010]<br>
      ...and some more round ones:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=PlayType%20%2F%20%28Commercial%29&amp;ffam=Zetta%20Sans%20-%20Regular&amp;fid=705f45f9b8eb0dbbe506d35e98219f42&amp;fsize=60&amp;text=DC%20ELMARIT%201%3A2.8%2F10.2%20ASPH&amp;wrap=2" rel="nofollow">Zetta Sans</a></strong> by Jonas Hecksher [PlayType]<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Google-Web-Fonts%20%2F%20%28Freemium%29&amp;ffam=Coda%20-%20Regular&amp;fid=fc5514afc8b9a2cc39776e68b28b39d7&amp;fsize=60&amp;text=DC%20ELMARIT%201%3A2.8%2F10.2%20ASPH&amp;wrap=2" rel="nofollow">Coda</a></strong> by Vernon Adams [Google Web Fonts, 2010]<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=URW%20%2F%20%28Commercial%29&amp;ffam=EurostileTMed%20-%20Regular&amp;fid=562e0f2e786533bc0ea0cd8189456961&amp;fsize=60&amp;text=DC%20ELMARIT%201%3A2.8%2F10.2%20ASPH&amp;wrap=2" rel="nofollow">Eurostile Medium</a></strong></p>
      <p>PS: I now see that Ryuk confirmed it's a custom font...</p>
