      <p>Assuming this comes from a Leica lens and according to this <a href="http://www.l-camera-forum.com/leica-forum/customer-forum/46666-whats-font-name-used-leica.html#post497098" title="Click to visit an external URL." class="freelink freelink-external freelink-external">post</a>, font should be 'LG 1045/1050', proprietary and exclusive to Leica.<br>
      Alternatives: <a href="http://www.myfonts.com/fonts/canadatype/vox-round" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Vox Round</a> (and mixing it with <a href="http://www.myfonts.com/fonts/canadatype/sol-pro" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sol</a> could work), <a href="https://www.fontshop.com/families/basic" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Basic</a>, <a href="http://www.myfonts.com/fonts/btn/zolan-mono-btn" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Zolan</a> (Mono)</p>
