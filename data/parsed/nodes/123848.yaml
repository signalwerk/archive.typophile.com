    html: |-
      <p>Can't find an exact match either. Take into account that this is probably a custom OEM font of the lens manufacturer designed for the lens production machine and not a commercially available digital font.<br>
      You may like one of the following replacement candidates, here is a square looking one:<br><strong><a href="http://Thud (Medium)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Thud (Medium)</a></strong> by Suomi Type Foundry [2010]<br>
      ...and some more round ones:<br><strong><a href="http://Zetta Sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Zetta Sans</a></strong> by Jonas Hecksher [PlayType]<br><strong><a href="http://Coda" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Coda</a></strong> by Vernon Adams [Google Web Fonts, 2010]<br><strong><a href="http://Eurostile Medium" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Eurostile Medium</a></strong></p>
      <p>PS: I now see that Ryuk confirmed it's a custom font...</p>
