      <p>This is probably a hand-made illustration - not a font (if you take a look at repeating letters, they are all different).<br>
      You may want to search the Dafont.com  "handwritten" category for similar fonts:<br>
      <a href="http://www.dafont.com/theme.php?cat=603" title="http://www.dafont.com/theme.php?cat=603">http://www.dafont.com/theme.php?cat=603</a></p>
      <p>or you may like one of the following similar fonts:<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-7%20%2F%20%28Freemium%29&amp;ffam=Scuffle%20-%20Regular&amp;fid=2a5003dfad50ad3b85f7bcb21e2692cc&amp;fsize=60&amp;text=THE%20GRUFFALO%20Julia%20Donaldson%20Axel%20Schefler&amp;wrap=2" rel="nofollow">Scuffle</a></strong> free font by Rosie Tea [2014]<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Various%20%2F%20MagpiePaperWorks%20%28Commercial%29&amp;ffam=Sullivan%20-%20Regular&amp;fid=3d3137dafc8c9e561c6edcdf4f2b3ccd&amp;fsize=60&amp;text=THE%20GRUFFALO%20Julia%20Donaldson%20Axel%20Schefler&amp;wrap=2" rel="nofollow">Sullivan</a></strong> by Magpie Paper Works [2011]</p>
