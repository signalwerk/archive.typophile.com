    html: <p>Actually, even though I think there are other genres more worthy of effort, to me a good, relatively readable Grotesque isn't nearly as cliche as a humanist sans. If you resist making it cloyingly grot (which however is somewhat fashionable now) and keep readability in mind, you might end up with a new workhorse. That binocular "g", the "k", and those angled stems for example make me think you're on the right track. What I might do differently is making it slightly narrower, and pulling in the descenders a bit. And keep an eye on Franklin Gothic, both for inspiration and to avoid coming too close to it. <br> <br>hhp <br></p>
    html_clean: <p>Actually, even though I think there are other genres more worthy of effort, to me a good, relatively readable Grotesque isn't nearly as cliche as a humanist sans. If you resist making it cloyingly grot (which however is somewhat fashionable now) and keep readability in mind, you might end up with a new workhorse. That binocular "g", the "k", and those angled stems for example make me think you're on the right track. What I might do differently is making it slightly narrower, and pulling in the descenders a bit. And keep an eye on Franklin Gothic, both for inspiration and to avoid coming too close to it. <br> <br>hhp <br></p>
