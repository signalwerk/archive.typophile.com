      <p>Thanks again for the input. I dropped all the glyphs into fontographer to set some text. I hit auto space and auto bitmaps so it kinda stinks. Anyone have advise for strategies on this (perhaps a new thread). Particularly in getting decent bitmaps so you can make intelligent design decisions. I haven't the first clue about hinting.  <br> <br>I've made some changes based on your feedback: <br> <br>- Adjusted the tails. They are truely spurs now, but not high heels ( a turnoff in Franklin Gothic) <br>- Adjusted the bulging "a" <br>- Lightened and hopefully corrected the v, w, x <br>- Narrowed the "y." I wanted to avoid the standard tail, but hopefully it doesn't look to stomped anymore. <br>- Re-drew the binocular g. The curves are much better now, but the bottom is light - grrrr. <br> <br>I haven't got a laser printer at the home office yet. Does it look ok printed? The 6 pt type was a little hopeful probably. <br> <br>Thoughts? <br>Randy <br></p>
