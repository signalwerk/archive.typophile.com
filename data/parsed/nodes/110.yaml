    html: "<p>&gt;to me a good, relatively readable Grotesque  <br>&gt;isn't nearly as cliche as a humanist sans.  <br> <br>I'll disagree, I think that's the opposite. Imho, the grotesque style is  <br>almost a cliche in itself. Minimum stroke-contrast, closed shapes,  <br>horizontal terminals, all these characteristics from grotesque typefaces  <br>restrain the rising of *new* grotesques. In the other hand, you can  <br>experiment more with humanist sans and achieve much more useful  <br>results. Open and cursive shapes allow that.  <br> <br> <br>Anyway, Randy:  <br>-\"k\" and \"y\" doesn't fit;  <br>-\"y\" is wide;  <br>-reconsider that spur/finial (?) in \"a\";  <br>-\"s\" looks odd (work the BCPs, man! use your fontographer :-)  <br> <br>Good luck.</p>"
    html_clean: "<p>&gt;to me a good, relatively readable Grotesque  <br>&gt;isn't nearly as cliche as a humanist sans.  <br> <br>I'll disagree, I think that's the opposite. Imho, the grotesque style is  <br>almost a cliche in itself. Minimum stroke-contrast, closed shapes,  <br>horizontal terminals, all these characteristics from grotesque typefaces  <br>restrain the rising of *new* grotesques. In the other hand, you can  <br>experiment more with humanist sans and achieve much more useful  <br>results. Open and cursive shapes allow that.  <br> <br> <br>Anyway, Randy:  <br>-\"k\" and \"y\" doesn't fit;  <br>-\"y\" is wide;  <br>-reconsider that spur/finial (?) in \"a\";  <br>-\"s\" looks odd (work the BCPs, man! use your fontographer :-)  <br> <br>Good luck.</p>"
