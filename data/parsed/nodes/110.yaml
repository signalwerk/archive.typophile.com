  html: "<p>Hi All. <br> <br>So here's my story: I've made a resolution of sorts with myself to stop design work early on fridays to start up a font ideas. So, this last friday I started in on a grotesque (purely for the name of course). Just making one little design decision after another I arrived at what follows. About 20 glyphs into it realized I'd just drawn helvetica. Lame. <br> <br>At that point obvious differences were the: a, k,  s and y. So I started working on variants some of which are included in the gif (really the only successful one is the two story g which is rough when you get up close). So I guess I'm looking for feedback of two kinds, 1) how could what I have be better drawn technically, and 2) any other ideas on how this could change. We need something like this about as badly as we need another humanist sans. I thought  about turning it into a slab serif? Thoughts? <br> <br>BTW, this is the first time I have ever made it all the way through a lower case so if only for that reason it was worth it :-) <br> <br>Thanks. <br>Randy <br> <br><img src=\"http://www.typophile.com/forums/messages/29/10695.gif\" alt=\"Neweue?\"></p>"
  html_clean: "<p>Hi All. <br> <br>So here's my story: I've made a resolution of sorts with myself to stop design work early on fridays to start up a font ideas. So, this last friday I started in on a grotesque (purely for the name of course). Just making one little design decision after another I arrived at what follows. About 20 glyphs into it realized I'd just drawn helvetica. Lame. <br> <br>At that point obvious differences were the: a, k,  s and y. So I started working on variants some of which are included in the gif (really the only successful one is the two story g which is rough when you get up close). So I guess I'm looking for feedback of two kinds, 1) how could what I have be better drawn technically, and 2) any other ideas on how this could change. We need something like this about as badly as we need another humanist sans. I thought  about turning it into a slab serif? Thoughts? <br> <br>BTW, this is the first time I have ever made it all the way through a lower case so if only for that reason it was worth it :-) <br> <br>Thanks. <br>Randy <br> <br><img src=\"http://www.typophile.com/forums/messages/29/10695.gif\" alt=\"Neweue?\"></p>"
