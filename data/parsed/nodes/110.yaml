    html: "<p>Excellent! Don't know why but this design makes me smile. <br> <br>Stuff I dig: <br>- Double-story g. <br>- Alternate j. (I'm not so brave) <br>- Alternate i and j in text. Especially in the word little. <br>- Slanted ends on the c, e, s. (Maybe make them parallel?) <br>- The k (Star of the set) <br> <br>Stuff to notice: <br>- I think the tail on the a works ok. Maybe it should be a bit <br>bigger. It extends ok to the b and d, but it feels out of <br>place up top on the p and q, and a little less weird on n <br>and m. Hmm... what am I saying. Make the bigger every- <br>where. Helvetica needs all the help it can get. <br>- The arm of the a bulges near the end. I think the arm on <br>that BCP needs to be slanted to the right a bit instead <br>of pointing straight up. <br>- The y really does look like it got stepped on. It looks ok <br>in the text sample though, but I suspect it's because it <br>sits next to the g. <br>- Speaking of the g, neither version descends as far as the <br>rest of the descenders. Here's a chance to open things up <br>a bit more if that's your wish. <br>- The outer curves of some characters, o, e, c, look a bit <br>square. This makes the strokes at 45 degrees seem too <br>thick. I like to call this the square marker effect since you <br>get this sort of stroke modulation from drawing with a fat <br>square sharpie) <br>- The v, w, and x look like they're falling to the left and <br>they're a bit dark. <br> <br>I dig this design on the whole. I called my second list stuff <br>to notice because I have a natural inclination to turn any <br>design into its closest relative, in this case helvetica, so <br>ignore any advice that might have this effect. <br> <br>The beziers on the s look right on. The lower curve at the <br>left end of the spine is a bit too square compared to the <br>its sibling.</p>"
