  html: |-
    <p>I just saw in another thread that Shinntype released Sense on Fontspring. I really like it, but as I buy my fonts at MyFonts or Type.co.uk (because of PayPal) I was wondering if it will be released through one of these sellers any time soon.</p>
    <p>Thanks a lot, and congrats on what looks to be a great typeface.</p>
