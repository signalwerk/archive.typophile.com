    html: |-
      <p>Red Rooster's <a href="http://www.fontshop.com/search/?q=banque" rel="nofollow">Banque Gothique</a> adds additional widths.<br>
      Eric Olson's <a href="http://www.fontshop.com/search/?q=stratum%20ot" rel="nofollow">Stratum</a> offers lowercase and two variations, #2 with flat terminals.<br>
      <a href="http://www.fontshop.com/fonts/singles/monotype/sackers_square_gothic_std_regular/" rel="nofollow">Sackers Square Gothic</a> predates Bank Gothic for an older, more rigid, yet handmade look.</p>
