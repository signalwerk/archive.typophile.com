      <p>Dear Saad,</p>
      <p>My apologies for taking so long to respond.  Yes, my father was in Manhattan in 1947 when he came to his groundbreaking idea which led to the patented design called Unified Arabic (TM).  This is very strange indeed!  He also married my mother there, and that is where I and my siblings were born.  We are all U.S. citizens.</p>
      <p>Khattar then spent the rest of his life creating up to seven other typefaces based on Unified Arabic, some of which actually connect automatically, without any ligatures, and some of which remain disconnected.  Since he was also an architect and disciple of Frank Lloyd Wright, he continued to practice architecture as well.</p>
      <p>In no way did he wish to replace any previous forms of Arabic; his wish was to *add* the printed form of Arabic which still does not exist as in Indo-European languages.  His eight typefaces are easily read by anyone who can read Arabic characters, used in many other languages besides Arabic, as you know.</p>
      <p>I am taking up his work now after a long hiatus since his passing in 1998, and will soon be creating a new Web site, <a href="http://www.unifiedarabic.com" title="www.unifiedarabic.com">www.unifiedarabic.com</a> on which I will post samples of each typeface.  You can see a small sample today here:  <a href="http://www.unifiedarabicalphabet.com" title="www.unifiedarabicalphabet.com">www.unifiedarabicalphabet.com</a>.</p>
      <p>I sincerely hope that we can continue this discussion.  Since I cannot see your e-mail address here, would you like to follow us on Twitter at <a href="http://twitter.com/unifiedarabic" title="http://twitter.com/unifiedarabic">http://twitter.com/unifiedarabic</a>?  Otherwise, I would send you an invitation.  I will see if you are there so that I can follow you as well.</p>
      <p>In all sincerity,</p>
      <p>Camille</p>
      <p>Camille Khattar Hedrick<br>
      President, Daughter of Nasri Khattar<br>
      Unified Arabic, LLC</p>
