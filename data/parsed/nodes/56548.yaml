    <p>I have been reading the postings from this group, and recently received a Google alert that I have set up with my father's name.</p>
    <p>Let me introduce myself:  I am Nasri Khattar's daughter, and would be delighted and honored to be accepted as a full-fledged member of this group.  Although I work in a completely different although related field - marketing communications - I do know some things about type, obviously, from my father, and did study Arabic.  A U.S. citizen, I live in the U.S. after growing up in Lebanon and then living in France for 25 years.  My father was a dual national, American-Lebanese, and my mother is American - her family is in Illinois. </p>
    <p>I now have time to dedicate myself to my father's work.  He designed several typefaces during his lifetime - he was also an architect and disciple of Frank Lloyd Wright - and the later fonts were connected systems, *based* on Unified Arabic (TM), and they connect beautifully.  He designed them to meet the ASMO 449 standard.  Since he passed away in Lebanon in 1998, I have been slowly recovering his originals, and am now ready to, hopefully, begin to market them, and I am very interested in this group's discussion to learn more about the industry.</p>
    <p>I believe that his work is by no means "extreme" but rather in advance for his time, although I do know that font systems available on the Web show only his very first designs used to obtain his patent.  At the time, in 1947, his font system was considered an "invention," since there was no Arabic form of printed type, resembling Indo-European characters.</p>
    <p>I sincerely hope to receive some replies to this posting, and welcome all discussion and comments.</p>
    <p>In all sincerity and respect,</p>
    <p>Camille Khattar Hedrick</p>
