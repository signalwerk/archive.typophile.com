      <p>Dear Camille,</p>
      <p>It is great that you have started this thread to discuss the work of your father Nasri Khattar. When i was a student at AUB in the late fifties and early sixties he organized an exhibition (and perhaps a lecture) about his Unified Arabic Script. I forgot the exact date but remember that the exhibition was held at West Hall, where I met him. I was very impressed by his work and the zeal with which he promoted his ideas. الله يرحمه.</p>
      <p>In fact that really inspired me to start my own research in Arabic type design. That was the start for me, thanks to that wonderful man's dream. Over the years, and further inspired by the writings and example of Eric Gill I designed connected simplified letter shapes that were the median between all the different ways of writing Arabic, but then after the 1967 war other interests diverted me from type design. A few years ago the advent of computers and the Internet revived my interest and I have made digital versions of my AlQuds font more or less based on the same pen-and-ink designs of 45 years ago. </p>
      <p>Through this forum and by email contacts I have made many friends from those who are now expert and active in the flourishing field of Arabic typography. They gave me much valuable advice about the technical aspects of digital typography. Things have changed a lot since since the days of lead type and Letraset (and not always to the better). The question of abridging the number of glyphs is no more a technical necessity, and there is a bewildering abundance of Arabic types, both connected and unconnected, of variable quality and legibility and graphic sense. I am sure you will find valuable support and advise to continue to honor Nasri Khattar's legacy by introducing his very elegant designs as digital fonts and making his writings available on your website. Good luck!</p>
      <p>Vladimir</p>
