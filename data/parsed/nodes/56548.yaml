      <p>Dear Camille</p>
      <p>Welcome to this group, I have visited your introductory page about the late Khattar designs a year ago through Nadine's blog.  Thank you for preserving his work. I think he had truly loved Arabic.</p>
      <p>Although I had never heard about your father's work or others in 1990s when I started working on my project to design Arabic fonts sharing similar in principle to his, I was happy to learn in 2003 about Mr. Khattar's hard work, through an article by Ma'mun Saqqal. I was born in the US and have been living in New York for the past 30 years.  You can visit my site: <a href="http://arabetics.com" title="http://arabetics.com">http://arabetics.com</a> </p>
      <p>It is interesting to know that the first known attempt ever to design an Arabic font with isolated letters was made by an American engineer and typographer, Homan Hallok, who lived in New York (Manhattan) back in the 1865s. He had also designed great traditional Arabic fonts in the 1830s. I am an engineer too, and I have started my design work in Manhattan! It must be some thing about the air here -:)  Was your father living in Manhattan, too, when he worked on his Unified Arabic in the 1950s?</p>
      <p>&gt;&gt;At the time, in 1947, his font system was considered an “invention,” since there was no Arabic form of printed type, resembling Indo-European characters.</p>
      <p>My approach to Arabic fonts is that we must keep type design open and must not impose any rigid rules. Calligraphic and non calligraphic fonts are both beautiful and NEEDED. There should be no "allowed" and "not allowed, or "extreme" and "non extreme" work.  We need to keep options open and let users choose. This approach was the secret behinde the success of the magnificant Arabic calligraphy long centuries ago. The Arabic script is by nature flexible and open to change. New Arabic type design styles should be added not as replacements of the "old", but as additions to enrich the it. </p>
      <p>The only clear red line that no one should cross is attempting to "replace" Arabic letters by Latin or other scripts letters, like the work of Saad Akel on the "Lebanese font", or Turkish the fonts created under Kamal Atatatuk, with the pretext that Arabic can not support modern needs. </p>
      <p>Your father perseverance and design works were not extreme at all. His project was a pioneering work. If the internet was around during his peak working days, his fonts would have had much better chance to succeed. The best way to enrich Arabic typography today is to get to work and introduce more Arabic fonts and designes to ensure that Arabic is fully prepared and compatible with current known, and future unknown, developments. </p>
      <p>-Saad</p>
