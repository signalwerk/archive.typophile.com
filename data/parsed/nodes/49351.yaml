    <p>hello !<br>
    I am collecting typographic books-</p>
    <p>since a longer time i would like to buy a book on<br>
    typography, sort of recent fonts - not only the classics.</p>
    <p>modern elegant well designed quality typefaces for practical use.<br>
    serife/sanserif but definitely other than for example the fontshop<br>
    catalogue.a book you can work with when doing businesscards/letterheads<br>
    /Ci work.</p>
    <p>the market is big and i didnt find anything really with a good<br>
    overview </p>
    <p>thanks for any suggestions.<br>
    manu</p>
