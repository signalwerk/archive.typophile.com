    html: |-
      <p>Tylor, while Anagrama may be known for basing their logos on actual fonts, there is the possibility that this was hand-drawn or a custom font by local designer, and not commercially available. </p>
      <p>The folks on this board are fairly perspicacious--if anyone had recognized it straight off, they'd have spoken up.</p>
      <p>I've scanned through all 1000+ calligraphic scripts on Myfonts, and no match. Also no match to the 140+ fonts that supposedly include "tail" ornaments in their character sets. The following two fonts, however, may be closer to the feel of the original than Metroscript:</p>
      <p><a href="http://www.myfonts.com/fonts/eurotypo/lavinia/" title="http://www.myfonts.com/fonts/eurotypo/lavinia/">http://www.myfonts.com/fonts/eurotypo/lavinia/</a><br>
      <a href="http://www.myfonts.com/fonts/laura-worthington/samantha-upright-script/" title="http://www.myfonts.com/fonts/laura-worthington/samantha-upright-script/">http://www.myfonts.com/fonts/laura-worthington/samantha-upright-script/</a></p>
