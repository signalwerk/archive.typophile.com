      <p>I agree Johan that it's probably a catchword. Previous thread <a href="http://typophile.com/node/108085" title="http://typophile.com/node/108085">http://typophile.com/node/108085</a> on _The_.<br>
      There are various catchwords in the the fonts at <a href="http://www.myfonts.com/search/tag%3Acatchwords/fonts/" title="http://www.myfonts.com/search/tag%3Acatchwords/fonts/">http://www.myfonts.com/search/tag%3Acatchwords/fonts/</a> but a quick skim through did not spot a match.<br>
      More links to catchwords <a href="http://blog.hadilaksono.com/post/3106855136/catchwords" title="http://blog.hadilaksono.com/post/3106855136/catchwords">http://blog.hadilaksono.com/post/3106855136/catchwords</a><br>
      There are many more in the image results for a Google Search of "fonts catchwords" and some digging through the results might match your _The_.<br>
      Don</p>
