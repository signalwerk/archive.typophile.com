    html: |-
      <p>If it is sufficient to recreate the word _The_, then use the _Th_ ligature and _e_ from Gelato Script <a href="http://www.myfonts.com/fonts/schizotype/gelato-script/" title="http://www.myfonts.com/fonts/schizotype/gelato-script/">http://www.myfonts.com/fonts/schizotype/gelato-script/</a> add a swoosh from another font like Casey [it's at the summation sign Unicode: U+2211 (∑)] <a href="http://www.myfonts.com/fonts/fontbureau/casey/" title="http://www.myfonts.com/fonts/fontbureau/casey/">http://www.myfonts.com/fonts/fontbureau/casey/</a> combine into a single glyph, rotate the new catchword glyph left 20 or 30 degrees, and edit any details you may wish to adjust for a closer match to your _The_.<br>
      Don</p>
    html_clean: |-
