    <p>Hi Guys, please help...<br>
    I need some insights on the typeface „Avisto‟ that BVD used for their Stores <a href="http://bvd.se/stories/">http://bvd.se/stories/</a>.<br>
    I've never heard of this typeface before, the only proof i've got of it's existence is from the book „I Love Type 01 - Futura‟.</p>
