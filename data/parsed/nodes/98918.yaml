      <p>I see that the link you've provided references the same BVD client as is featured in the photo from the book: Götgatan Stories, apparently a café franchise on the order of Starbucks or Second Cup (although apparently it <em>is</em> also a store).</p>
      <p>Indeed, Google, even Google Books, comes up dry when asked for a typeface named Avisto.</p>
      <p>The client itself shows up at <a href="http://www.cafestories.se/gotgatan.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.cafestories.se/gotgatan.html</a> - and in fact it appears that the client is actually Caféer Stories, with Kutlturhuset Stories, Hamngatan Stories, and others belonging to the same group.</p>
      <p>From here</p>
      <p><a href="http://www.packagingdesignarchive.org/archive/pack_details/1586-gotgatan-stories" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.packagingdesignarchive.org/archive/pack_details/1586-gotgatan-stories</a></p>
      <p>some more details become apparent; this was the first location. But it opened in 2007, so what was that typeface doing between the 1930s and 2007?</p>
      <p>WhatTheFont didn't give any results that resembled it; however, a look through the typefaces at MyFonts turned up <a href="http://www.myfonts.com/fonts/mostardesign/sofia-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sofia</a> from Mostardesign, which does have a slight resemblance.</p>
