    html: |-
      <div class="comment-spam-body"><p>Good find Kevin. PL Barnum Block is a reverse contrast design -- top and bottom strokes thicker than side ones. So when you expand the width by something like 150%, you get a normal contrast ratio that looks like this </p><div class="imageWrap"><img src="http://typophile.com/files/PLBarnumBlockInUsewidth150pct_6724.jpg"></div> Some minor tweaking and you have the wordmark.<br>
      Don<p></p>
      </div>
