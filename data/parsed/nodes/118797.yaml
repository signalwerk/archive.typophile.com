      <p>You'll have to do some manual widening and make other modifications to this, but not a bad base from which to start:<br>
      <a href="http://www.fonts.com/font/monotype/pl-barnum-block/block" title="http://www.fonts.com/font/monotype/pl-barnum-block/block">http://www.fonts.com/font/monotype/pl-barnum-block/block</a></p>
      <p>Same goes for this typeface:<br>
      <a href="http://www.myfonts.com/fonts/philatype/gravity/nova/" title="http://www.myfonts.com/fonts/philatype/gravity/nova/">http://www.myfonts.com/fonts/philatype/gravity/nova/</a></p>
