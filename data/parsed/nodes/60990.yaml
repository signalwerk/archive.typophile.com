  html: |-
    <p>If I have a font that has <a href="/wiki/swsh" class="freelinking" rel="nofollow">swash features</a> that differ at the beginning and ending of words, how should I set it up in FontLab? I see that InDesign has swash as an OpenType option; should I use that and use some coding trickery to try to deduce whether a given letter is at the beginning or ending of a word? When a graphic designer chooses "swash," does he or she do so with a single letter selected, or with whole words selected, expecting the font to know which letters should be ornamented?</p>
    <p>Or should I use two different stylistic sets, one for beginnings and one for endings? Or some other setup?</p>
  html_clean: |-
    <p>If I have a font that has <a href="/wiki/swsh" class="freelinking link-lost" rel="nofollow">swash features</a> that differ at the beginning and ending of words, how should I set it up in FontLab? I see that InDesign has swash as an OpenType option; should I use that and use some coding trickery to try to deduce whether a given letter is at the beginning or ending of a word? When a graphic designer chooses "swash," does he or she do so with a single letter selected, or with whole words selected, expecting the font to know which letters should be ornamented?</p>
    <p>Or should I use two different stylistic sets, one for beginnings and one for endings? Or some other setup?</p>
