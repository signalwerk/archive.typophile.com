    html: |-
      <p>My experience with fonts that have open type features such as these is that it's up to the designer to decide which type of swash or character to use on their own (by selecting individual characters). I have utilized the feature most often in Illustrator where there is an open type window with separate buttons for each of the kinds of alternates (contextual ligatures, swashes, alternate character, etc.) Fonts like Affair and Burgues by Sudtipos are set up this way.</p>
      <p>penn</p>
