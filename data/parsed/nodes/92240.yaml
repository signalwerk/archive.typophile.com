  html: |-
    <p>On some sheet music that my orchestra is doing (we're including some film classics in this concert, we normally do completely classical... which I prefer, to be honest), I saw this nice type. I'm unsure of its origin, seeing the irregularities in the third and fourth "As" (left leg/crossbar junction, left crossbar tip) and the "T" and "U" (irregularities), so I'm wondering if this header was actually hand-drawn. Does anyone recognize it (it's quite possibly obvious to most of you awesome type pros!)</p>
    <p>Thanks! -Joe</p>
