    html: |-
      <p>Hi Joseph</p>
      <p>You can set this quite easily with two adjacent characters in the same text frame; the first one is the black circle/bullet – try 'L' in Zapf Dingbats. The second one is the M, C, or E in whatever font you like (I tried Myriad), sized slightly smaller, coloured white and baseline shifted by a small increment – maybe half a point. Position the text cursor between the two, and either key shift-option-left arrow or enter a large negative value in the kerning field in the control palette (about -500). The second character will kern right back over the top of the first one. </p>
      <p>I doubt you could define these two together as a character style, but you can certainly select them both, copy and paste them wherever you like. Alternatively you could create outlines from these characters, group them together, select, copy and paste as an inline graphic into any text frames.</p>
