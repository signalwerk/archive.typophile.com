    <p>Good afternoon type freaks.</p>
    <p>I'm trying to create a character style or custom glyph that will let me easily insert a black circle/bullet containing a white text into my InDesign document. I need to have 3 different versions, each with their own respective letters (M, C, E) and colours.</p>
    <p>I first tried using paragraph rules and a custom stroke with rounded ends. I managed to make a circle around the letter, but positioning was not working.</p>
    <p>I'm also thinking a circle shape with text inside, then save as object style? </p>
    <p>Any tips would be much appreciated.</p>
    <p>Thanks!</p>
