      <p>There are regular codepoints available for the sorts you need: block 2460 for A-Z encircled positive (white), range 1F100 for A-Z in negative (default black, hence suitable for colouring).</p>
      <p>[wanted to upload an image but it didn’t… ]</p>
      <p>either<br>
      – use a font which contains the glyphs (e.g. Symbojet)<br>
      or<br>
      – modify a chosen font to contain them.</p>
      <p>Then you can type the characters via glyph palette or: edit a custom keyboard layout to instantly hack them in.</p>
