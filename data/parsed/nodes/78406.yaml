    <p>Greater Albion Typefounders have just released tow new Typefaces on Fontspring and Myfonts:</p>
    <p><a class="freelinking external" href="https://web.archive.org/web/20140713171131/http://new.myfonts.com/fonts/gatf/bertolessi/ " rel="nofollow"> Bertolessi</a>, is a Roman face made fun, with a healthy dose of filigree curves thrown into the mix. It's an ideal compliment to our extensive Bertoni family, but can be used anywhere a bit of humour and flair is required.  </p>
    <p><a class="freelinking external" href="https://web.archive.org/web/20140713171131/http://new.myfonts.com/fonts/gatf/tulks-victorian-banner/ " rel="nofollow"> Tulk's Victorian Banner</a> revives the tradion of 'Banner' typefaces-lettering within their own lozenge or cartouche, that nmade such an appealing feature in many old type foundries catalogues.  Tulk's Victorian Banner makes a wonderful feature of lettering in any piece of period inspired design.  It compleiments our recent Fitzgerald space especially well, but can be used alongside any typeface of your choice where you want to bring a touch of period flamboyance.</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20140713171131im_/http://typophile.com/files/Document5_6604.png"></div><p></p>
