    <p>Am working on my portfolio for design school reviews and wanted to create a 'mark' to represent me. Did something really simple and solid - My initials AR. Wanted the mark to be solid so that it can work well independently as well as when layered over patterns and textile print designs.</p>
    <p>Will add my name beneath it..This is the first time I've tried to design a logo from scratch. This is sort of a crude illustrator trace from my sketch. </p>
    <p>Let me know what you think..</p>
