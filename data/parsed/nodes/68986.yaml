    html: <p>Wow I just found this site no longer than 5 minutes ago.  I am actually having the same exact issue as you, because my initials are AR and I am currently working on a personal logo myself.  I actually think the LOGO is perfect it just needs to be skewed or distorted.  It seems like your trying to be symmetrical and if that is the case you could try reflecting either the A or the R across the Y axis</p>
