    html: |-
      <p>The forms are sortof strange, but your initials, AR have a lot of potential. The mixing of lowercase/capitals doesn't really work here but it is possible and can turn out really nicely.</p>
      <p>I think your issue at the moment is that your glyphs are just way too diffrent, and especially the R looks strange, the stroke that is forming the leg is pasted on and makes the form feel bulky.</p>
      <p>Think first on what kind of style you want to use for your branding/monogram, stick with the modern style ? then I'd try to come up with some more interesting shapes and the balance of the letters.</p>
