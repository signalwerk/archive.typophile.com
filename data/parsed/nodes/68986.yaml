    html: <p>It’s plumb. It cries for more symmetry, especially with regard to the width of the two letters. And the combination of lower case and uppercase does not work here, at least not actually. And the strokes are unclean. I mean, they vary in a unnatural way. Really, because I don’t see potential for improvements, because there is too much wrong, I recommend to draw it on paper and then to optimize it in Illustrator, especially if you are not experienced in Illustrator.</p>
