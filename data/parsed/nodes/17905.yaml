    <p>FONTPARTNERS.COM: NEW TYPO-WEBSITE!</p>
    <p>This new released fontsite presents customfonts, FontFonts and current typography-news from the two Danish founders and partners, Ole Søndergaard and Morten Rostgaard Olsen, whose designs include FF Signa, FF Max, FF Olsen and others. Fontpartners.com also presents examples of fontdesigns and their implementation, and offers creative and technical solutions within most areas of fontdesign and typography.</p>
    <p>Ole Søndergaard studied graphic design at the Royal Academy of Fine Arts, Copenhagen. After working as a graphic designer at an architect's office, he established his own design practice. Ole has also taught graphic design at the Royal Academy of Fine Arts, Copenhagen. Between 1985 and 1995 he was co-founder and partner of Eleven Design A/S, designing signs and signposting systems for banks, office blocks and public buildings in Denmark, Sweden, and the Middle East. He has designed corporate identity programmes, logotypes, annual and environmental reports, brochures, packaging and magazines for Danish and international companies, as well as designing complete alphabets and pictogram systems.</p>
    <p>Morten Rostgaard Olsen is an graphic designer living and working in Copenhagen. After five years studing at The Danish School of Art and Design, he now runs a design studio where he supplies solutions for corporate design, typography, and typefaces. He's also become a teacher in all these subjects. Among his clients at home and abroad are The Ministry of Education in Copenhagen, the first user of his typeface FF Olsen.<br>
    Morten is a member of The Association of Danish Designers MDD.</p>
    <p>Look &amp; Buy: <a href="http://www.fontpartners.com" title="www.fontpartners.com">www.fontpartners.com</a></p>
