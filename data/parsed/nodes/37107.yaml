      <p>Aside from any difference in contrast (which was debated at length in that other thread), another thing that strikes me about the comparison of digital Electra with the original is the difference in some character widths. Granted, these are pretty subtle; but the cumulative effect is noticeable.</p>
      <p>Metal Linotype had no unitized width constraints (just the duplexing constraint on paired roman and italic, or roman and bold). However, the earliest Linofilm photocomposition machines adopted an 18-unit system. This was partly a mechanical requirement, due to a constant drive motor. I believe the decision to divide the em into 18 units was influenced by the Monotype's 18-unit system. Later, with the advent of the Linotype V-I-P, a stepping motor allowed a more refined system and the constraint was changed to a 54-unit system for advance widths. </p>
      <p>I contend that, in the evolution from metal to photocomposition, designs like Electra and Caledonia were adapted to the unitized systems, and that these versions were then the sources for the digitizations now available. If one examines the l.c. character widths in digital Electra, for instance, it can be seen that they correspond neatly to 54-unit increments:</p>
      <p>f i j l t = 278 (15 units)<br>
      r s = 333 (18)<br>
      v x y = 426 (23)<br>
      a = 444 (24)<br>
      c e g k = 463 (25)<br>
      o = 500 (27)<br>
      b d p q = 519 (28)<br>
      h n u = 556 (30)<br>
      w = 667 (36)<br>
      m = 833 (45)</p>
      <p>I did not analyze the capitals, but I'm sure you'd find more of the same. This unitization would account for the difference in rhythm between texts set in digital Electra compared to the original.</p>
      <p>Of course, this subtle difference in character widths is not what leads me to assert that the face is no longer suited to book text -- that would come primarily from the spindly contrast (and the fact that a relatively large master was probably used). But this difference in rhythm is part of my disappointment in digital Electra compared with the original design.</p>
      <p>-- K.</p>
