      <p>Many of the most popular typefaces used for books in American publishing in the 1950s were Linotype. </p>
      <p>In his column, "The Pi Channel," in the January 6, 1958 issue of <cite>Publishers' Weekly,</cite> Paul Bennett (who, it should be noted, was on the marketing staff with Mergenthaler Linotype) touted the presence of Linotype faces in the AIGA Fifty: "The total score for Linotype in the Fifty since 1946 is, in fact, a whopping two-thirds of the exhibit -- 394 of the 600 honored selections."</p>
      <p>Some of the stats Bennett cites:</p>
      <p>"By far the most popular were two fine transitional types: the contemporary Caledonia, designed by Dwiggins, and the classic Baskerville. It's interesting to note that though Linotype Baskerville has been available ten years longer than Caledonia, the latter was used for seven more books: 72 to 65.</p>
      <p>"Among the preferred old styles, the ranking is Janson, Granjon and Times Roman. TR is the youngster here, being available just ten years -- yet it was used for nineteen books. The others: historic and classic Janson for 57 books; and the compact, space-thrifty Granjon, 35.</p>
      <p>"Seemingly, there are but two moderns that are really accepted by our better bookmakers: the Dwiggins-designed Electra, and the lighter rendering of Bodoni's historic letter, Bodoni Book. Electra, though available eighteen years later than Bodoni Book, outscored the latter, 33 to 25."</p>
      <p>As Nick cautions, however, the current digital versions of Caledonia and Electra are sadly lacking in the vitality of the originals and no longer well-suited for book text work, in my opinion.</p>
      <p>If you're trying for 1950s facsimile, I'd probably try a Baskerville or Linotype Janson Text.</p>
      <p>-- Kent.</p>
