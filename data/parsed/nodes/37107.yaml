      <p><em>what do you think it’s lacking?</em></p>
      <p>The irregularities and artefacts of the letterpress process, which in my opinion are a necessary part of historical ambience. Electra was an elegant face, but it nonetheless had a robust quality when set -- particularly apparent at this large (12pt) size, on uncoated stock with a bit of texture and some ink spread.<br>
      The digital version is fine and slick, which is a different effect, and may be useful today -- but I don't think it captures the old mood.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/WarholPage_4994.jpg"></div><br>
      .<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Warhol2_6044.jpg"></div><br>
      In this enlargement, the scan from the 1957 book is on the left, and my facsimile using digital Electra is on the right.<p></p>
