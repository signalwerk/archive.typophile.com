    html: "<p>BJ -- <br> <br>1) As JFP mentioned, there was a catalog published in conjunction with the traveling exhibit of Matthew Carter's work, <i>Typographically Speaking: The Art of Matthew Carter</i>. This included a complete checklist (well, complete as of last year -- it doesn't include the most recent designs, like the Monticello revival). The checklist was compiled by Carter himself. <br> <br>John Berry wrote an article about the exhibit, which you can read at <a href=\"http://www.creativepro.com/story/feature/18099.html\" target=\"_blank\"> http://www.creativepro.com/story/feature/18099.html</a> <br> <br>The catalog may still be available. You can try contacting Cynthia Wayne, Curator of Exhibitions at the Albin O. Kuhn Library &amp; Gallery -- e-mail: <a href=\"mailto:cwayne@umbc.edu\">cwayne@umbc.edu</a> or telephone (410) 455-2270. I think the cost is $20 + $3 S&amp;H. <br> <br>The checklist lists 72 designs, including the ITC Greeks. And the Shelleys are counted as one. <br> <br>Too bad you didn't inquire before doing all that googling. <br> <br>2) The typeface for <i>El Pa</i></p>"
