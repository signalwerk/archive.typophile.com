      <p>Actually, I have Wilson Greek &amp; just converted it to OpenType, with the ligatures applied via a series of stylistic sets. Carter offered some basic help with the project &amp; has seen it, but not commented. At least he didn't suggest I'd done it harm (he's a nice man).</p>
      <p>I was unaware Wilson Greek is no longer available; that is a shame. They took out some of the Greek text in the final version, but I used it with Quadraat for <cite>Household and City Organization at Olynthus</cite>.</p>
      <p><a href="http://books.google.com/books?id=YenwwRfce9YC&amp;dq=household+and+city+organization+at+olynthus&amp;pg=PP1&amp;ots=8-8ao7y0O2&amp;sig=sYXliPBVBN1Vy3QPb2vpqubY72A&amp;hl=en&amp;prev=http://www.google.com/search?hl=en&amp;q=household+and+city+organization+at+Olynthus&amp;btnG=Google+Search&amp;sa=X&amp;oi=print&amp;ct=title&amp;cad=one-book-with-thumbnail#PPR7,M1" title="http://books.google.com/books?id=YenwwRfce9YC&amp;dq=household+and+city+organization+at+olynthus&amp;pg=PP1&amp;ots=8-8ao7y0O2&amp;sig=sYXliPBVBN1Vy3QPb2vpqubY72A&amp;hl=en&amp;prev=http://www.google.com/search?hl=en&amp;q=household+and+city+organization+at+Olynthus&amp;btnG=Google+Search&amp;sa=X&amp;oi=print&amp;ct=title&amp;cad=one-book-with-thumbnail#PPR7,M1">http://books.google.com/books?id=YenwwRfce9YC&amp;dq=household+and+city+orga...</a></p>
      <p>for a sample of Wilson Greek, see the preface (page vii), and chapter 1 (page 1).</p>
      <p>BTW I disclaim the title page. Yale took out the subtitle at the last minute &amp; didn't allow a redesign.</p>
