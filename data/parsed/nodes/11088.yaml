    html: <p>bj <br> <br>I sent a post previously but it hasn't shown up. Probably hit the wrong button. <br> <br>One item you are missing is LeBe, a Hebrew that was used in the Pennyroyal Caxton Bible. Not available otherwise. There are also beta fonts that have been around for a while that have not appeared and probably won't until there is some commercial interest.  <br> <br>I was involved in the Manutius face mentioned by Kent. At the time Miller Text and Wilson Greek were in beta and we needed a roman/Greek face. Matthew configured them for us and also supplied every glyph we could find that existed in the 16th, 17th, and 20th century. It grew to be quite a monster. It is no longer available. I wrote about the project in an issue of Printing History. The beta fonts I mentioned above were also discussed in the article. Not sure how Matthew felt about that so I will only refer you to the article. <br> <br>Skia was initially a QuickDraw GX font and had much more extrapolative potential (amazingly so) than what was eventually made available as a TrueType font. Might want to somehow deferentiate this?</p>
    html_clean: <p>bj <br> <br>I sent a post previously but it hasn't shown up. Probably hit the wrong button. <br> <br>One item you are missing is LeBe, a Hebrew that was used in the Pennyroyal Caxton Bible. Not available otherwise. There are also beta fonts that have been around for a while that have not appeared and probably won't until there is some commercial interest.  <br> <br>I was involved in the Manutius face mentioned by Kent. At the time Miller Text and Wilson Greek were in beta and we needed a roman/Greek face. Matthew configured them for us and also supplied every glyph we could find that existed in the 16th, 17th, and 20th century. It grew to be quite a monster. It is no longer available. I wrote about the project in an issue of Printing History. The beta fonts I mentioned above were also discussed in the article. Not sure how Matthew felt about that so I will only refer you to the article. <br> <br>Skia was initially a QuickDraw GX font and had much more extrapolative potential (amazingly so) than what was eventually made available as a TrueType font. Might want to somehow deferentiate this?</p>
