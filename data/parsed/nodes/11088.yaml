    html: <p>Matthew mentions in his introduction that he doesn't include several faces that have been attributed to him but that he doesn't consider that he really designed -- including things like Auriol and Cochin and Optima Greek. But they show up in the index that I counted earlier. Go figure. <br> <br>He also omitted a couple designs that he did for corporate identities (such as the one I think you are calling Airport in your list) because they were never manufactured as fonts for typesetting, but instead only pasted up from photostats -- so he says. <br> <br>I see no mention of Century 725. Elephant was renamed Big Figgins for general release. He says New Baskerville is wrongly attributed to him; John Quaranta directed that one. The <i>Washington Post</i> Bodoni is called Postoni (no 'd'). He doesn't mention Rocky.  <br> <br>He did Ionic Number One in 1999 for Carter &amp; Cone. You're missing Wrigley for <i>Sports Illustrated</i>. He also includes the Manutius Latin supplement to Miller that he did for UCLA. There was Benton Bold Condensed for <i>Time</i>, Foreman Light for <i>The Philadelphia Inquirer</i>, and Newsbaum for the New York <i>Daily News</i>. <br> <br>It is now clear to me that the index I counted earlier is not a definitive list -- it's just an index; and several entries are faces that he doesn't claim. So that 72 count I mentioned earlier is incorrect. I don't have the time to assemble a more definitive list from the 16-page specimen. <br> <br>But get the book. It's well worth it. <br> <br>-- K. <br></p>
    html_clean: <p>Matthew mentions in his introduction that he doesn't include several faces that have been attributed to him but that he doesn't consider that he really designed -- including things like Auriol and Cochin and Optima Greek. But they show up in the index that I counted earlier. Go figure. <br> <br>He also omitted a couple designs that he did for corporate identities (such as the one I think you are calling Airport in your list) because they were never manufactured as fonts for typesetting, but instead only pasted up from photostats -- so he says. <br> <br>I see no mention of Century 725. Elephant was renamed Big Figgins for general release. He says New Baskerville is wrongly attributed to him; John Quaranta directed that one. The <i>Washington Post</i> Bodoni is called Postoni (no 'd'). He doesn't mention Rocky.  <br> <br>He did Ionic Number One in 1999 for Carter &amp; Cone. You're missing Wrigley for <i>Sports Illustrated</i>. He also includes the Manutius Latin supplement to Miller that he did for UCLA. There was Benton Bold Condensed for <i>Time</i>, Foreman Light for <i>The Philadelphia Inquirer</i>, and Newsbaum for the New York <i>Daily News</i>. <br> <br>It is now clear to me that the index I counted earlier is not a definitive list -- it's just an index; and several entries are faces that he doesn't claim. So that 72 count I mentioned earlier is incorrect. I don't have the time to assemble a more definitive list from the 16-page specimen. <br> <br>But get the book. It's well worth it. <br> <br>-- K. <br></p>
