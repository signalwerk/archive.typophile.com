  html: |-
    <p>I wanted to know how to add diacritic marks when typing arabic words using the english alphabet.  For example a dot needs to be placed under various letters like H and T to indicate that they are guttural sounds.  I've been trying to figure this out for months and have been unable to.  Any help would be GREATLY APPRECIATED.</p>
    <p>Thanx</p>
    <p>"Non-pure abjads (such as Hebrew and Arabic script) and abugidas use diacritics for denoting vowels. Hebrew and Arabic also indicate consonant doubling and change with diacritics; Hebrew and Devanagari use them for foreign sounds. Devanagari and related abugidas also use a diacritical mark called a virama to mark the absence of a vowel." - WIKIPEDIA</p>
