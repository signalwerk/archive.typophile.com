      <p>The font in need is a transliterating tool in deed? Elaborating:<br>
      Arabic transliteration needs dots below d,h,s,t+z and dashs above a,e+o, but it needs  no c,i,g,p,u,v nor x. So 7 gained opposite (8-3) in need ?!<br>
      ______________________<br>
      Rules of Transliteration:</p>
      <p>1. Sokôn — the a vowel-less sign —  is transliterated into (-), making the consonant stationary as there is no vowel after it,  as n is gun + d in bad</p>
      <p>2. Shadda is transliterated by doubling the letter it hovers above.<br>
      When Shadda appears over any consonant, that consonant is voiced twice, as n in run-ner. But in Arabic , the letter is voiced separately, run-ner, fod-der, the first is stationary.</p>
      <p>3. [a and â], [e and ê], [o and ô]<br>
      Fatha that sounds like u in cut or but is transliterated into (a).<br>
      Fatha+Alif that sounds slightly longer as in far is transliterated into (â)<br>
      Fatha+Alif+Mad that sounds like extra long aa is transliterated into (ââ) </p>
      <p>Kasra that sounds like i in pin or sin is transliterated into (e) .<br>
      Kasra+ya that sounds slightly longer as ee in seen is transliterated into (ê)<br>
      Kasra+ya+Mad that sounds like extra long ee is transliterated into (êê) </p>
      <p>Zamma that sounds like u in put is transliterated into (o) .<br>
      Zamma+Waw that sounds slightly longer oo as in soon is transliterated into (ô)<br>
      Zamma+Waw+Mad that extra long oo is transliterated into (ôô)</p>
      <p>In the beginning of a word or syllable (after a dash), a, e and o are consonants. But, if they appear after a consonant they are vowels.</p>
      <p>4. 3ain — voiced from middle throat — is transliterated into (‘). Thus<br>
      (‘a) and ‘â], [‘e and ‘ê], [o and ‘ô] are consonants wherever they appear.<br>
      (‘a) sounds like aa<br>
      (‘e) sounds like ee<br>
      (‘o) sounds like oo<br>
      (‘-) Consonant only<br>
      (‘â) sounds like ‘a+a<br>
      (’ê) sounds like ‘e+e<br>
      (‘ô) sounds like ‘o+o<br>
      _____________________________<br>
      Peace with Flowers</p>
