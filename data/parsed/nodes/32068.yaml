      <p>Just got into the office &amp; checked. Palatino (TT) does <cite>not</cite> have the needed diacritics. Gentium does, including the ones for transliterated Indic Scripts (Devanagari). Gentium is fine for casual use, but as mentioned, not quite up to the task of typesetting books. In pasing, I  have seen translitertated Arabic that also uses a dot below the "D" as well as H S T and Z. Lower case and small caps also needed.</p>
      <p>The "lines" over "a" "e" and "o" can be handled routinely with the macron over the Latin vowels, included in many OpenType fonts in upper &amp; lower case, though often not with small capitals.</p>
      <p>I haven't seen any commercial fonts that include hamzas and ayns; the usual convention is to use an apostrophe (/quoteright) &amp; single open quote (/quoteleft); special sorts can be made up, but of course, once you get into making up your own characters for a font, you can pretty much make anything you need.</p>
