      <p><cite>I needed the underdot h and H (regular, bold, italic, bold italic and small caps) for Hebrew transliteration. I asked John Hudson the best way to do it. He recommended doing a separate font with the characters. </cite></p>
      <p>Bill, was this back in the days of FontLab 4.2 or so? As I remember, the older versions of FontLab had trouble with preserving an existing features file, esp. where the "line length" of an item was long. FontLab 5.X doesn't seem to have this problem.</p>
      <p>I think it is as much work to make a separate font as to add to the existing font. While an "h" usually doesn't need much kerning if the sidebearings are correct, adding the small-cap glyphs to the c2sc and smcp features is a plus. So too is having only one font with everything in it.</p>
      <p>AzizMostafa</p>
      <p>Nice. You can do the transliterations easily with TeX, though I'm far less sure about setting the Arabic script. TeX allows the user to write macros &amp; not in assembly language!</p>
