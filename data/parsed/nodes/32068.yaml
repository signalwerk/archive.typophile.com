    html: <p>I needed the underdot h and H (regular, bold, italic, bold italic and small caps) for Hebrew transliteration. I asked John Hudson the best way to do it. He recommended doing a separate font with the characters. The font, Adobe Jenson, already has a dot accent over some letters, and that  (not the dot over the i) matches the glyphs as an underdot also, so using FontLab I just copied these to the right spot. It works fine.</p>
