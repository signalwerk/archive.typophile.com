    html: |-
      <p>Best way is to make up the characters in a program like FontLab. Most of what you want already has a Unicode number -- see the Latin Extended Additional code sheet. For characters that are not precomposed in Unicode, you need to make up the character and give it a glyph NAME (it will not have a Unicode index) of its Unicode components. Take a look at Adam's writeup on this method at the MSN FontLab site, he also covers how to write the feature in the font that will allow them to be more easily entered in a program like InDesign.</p>
      <p>Most existing commercial fonts I know of do not have these characters. Probably your best bet is Gentium, available from the SIL site -- but Google "gentium" for the download info. Alas, Gentium does not have ligatures or kerning -- which takes you back into making your own characters in the fonts you want -- where the EULA allows, as with all Adobe fonts.</p>
      <p>I believe Adobe has some plans to revisit some of their fonts and add these characters, but that will be for the future. Maybe the people who frequent this forum know of fonts where they already exist, but a lot of our work involves setting texts where such characters are needed, but not available, so I know a good bit about what is not available in traditional fonts. Linotype Palatino (TT) may have the underdots for transliterated Arabic, but not, I think, the underlines (not used in Arabic are they?) -- but used in Sanskrit.</p>
      <p>As far as entering them in InDesign, you can use the glyph pallet (the worst way), or enter them directly by using the Unicode number. You can also have them in the text you import, and they will work fine.</p>
      <p>Good luck.</p>
