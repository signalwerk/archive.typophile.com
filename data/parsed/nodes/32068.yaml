      <p>Actually, there is a way to typeset these marks. The same way we had to use in the old days of photocomp. Set your "d", then set a period, kern it back, lower it, make it smaller if you need to. Now, when you set your next letter, it will likely collide with the "d", so you will have to kern it forward. And so on. With the macron over an "r", same technique. And again the same for an "r" with both a macron &amp; underdot.</p>
      <p>A lot of work, and one reason why the older editions of the Chicago <cite>Manual</cite> recommended not using the underdots in transliterated Arabic.</p>
      <p>Simon, I doubt the fonts that have Arabic include the characters for <cite>transliterated</cite> Arabic. Why transliterate when you can have the real thing? And finally, I take exception to "hack." I think of myself as a little Norse gnome, going into fonts &amp; fixing all the little things the creative genius's got wrong.</p>
