    html: <p>In Word (2007 version on previous version with service packs) use a font that either has these characters pre-composed or supports combining diacritics, such as the latest version of Times New Roman, or one of the fonts from SIL. Use the insert symbol dialog to insert pre-composed characters or combine the "dot accents" as needed.</p>
