    html: |-
      <p>Hi there Alex,</p>
      <p>I also attempted to contact Roc way back when I first posted about his Corporate/Logos typeface on the DaFont forums. Glad to see you got a reply but also sad to hear that there is still no way to purchase his 1999 digitization. My experiment on FontStruct was merely to see if it were possible to reconstruct that style of typeface within the limitations of the block/grid system. It is in no way an accurate replication of his original type as I was unable to properly reproduce the letterforms. It took a lot of FontStruct hair-pulling trickery just to get it as close as I did.</p>
      <p>I'd also like to mention that Quad Typographers, Inc. (New York) seem to have copied or licensed Alphabet Innovations typefaces around 1974. Their versions of Corporate and Corp Image were titled Limited and Limited View - which may explain the naming of Dan X. Solo's Solotype Catalog sample. I've still no definite answer on who originated the stencilled version known as Preview (later digitized as Airlock by Computer Safari). Unfortunately, I don't have any Alphabet Innovations catalogs but would also love to see scans of Vol. 4 if possible. The California Historical Society displayed some of Vol. 1 here:<br><a href="https://californiahistoricalsociety.blogspot.com.au/2015/05/type-tuesday-timely-typography.html">https://californiahistoricalsociety.blogspot.com.au/2015/05/type-tuesday...</a></p>
