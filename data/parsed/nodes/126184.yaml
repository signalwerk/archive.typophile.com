    <p>Hello! I've been looking for a digital version of AI Corporate/Corporate Image for a long time and it seems I've long missed my window with Roc Mitchell's official digitizations Logotext and Logostyle since his website no longer exists and the phone numbers I've found associated with his company's Texas address don't work.</p>
    <p>I know there exists an Opti version, Limited View, based on Dan X. Solo's collection, and AV Perth made a pretty close digitization as well, AV05 Logotype, but I'd like to improve mine (New Era Software). I'm unable to find a copy of Alphabet Innovations Collection vol.4 (1971/1972), which AV Perth cites as demonstrating both Corporate and Corporate Image. Would anyone here know where I may obtain either a decent quality copy of this book and/or the phototype itself and/or Mitchell's digitizations in 2017?</p>
