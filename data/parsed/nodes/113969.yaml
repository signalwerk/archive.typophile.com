  html: |-
    <p>Good morning good people,<br>
    My department of designers are aggressively reassessing the brand image of the company we work for, starting with consistency of visual language. The Senior Designer established that the current corporate typeface, Helvetica Neue (or is it properly Neue Helvetica?), is perfectly suitable for our needs. It works quite well with all the various weights and styles for the US market, however our international offices are just frustrated. Characters are missing for the Bosians and the Russians do not have enough variation with the basic cyrillic family they have and so on and so on. Many of the offices have elected to use Myriad Pro as a substitute and it's just destroying our brand objectives. This must stop.<br>
    I found this:<br>
    <a href="http://www.fonts.com/font/linotype/neue-helvetica/paneuropean-complete-family-pack" title="http://www.fonts.com/font/linotype/neue-helvetica/paneuropean-complete-family-pack">http://www.fonts.com/font/linotype/neue-helvetica/paneuropean-complete-f...</a></p>
    <p>...and am curious if I were to purchase licenses for each office, if will be sufficient enough for the US as well. Or would I also need to purchase:<br>
    <a href="http://www.fonts.com/font/linotype/neue-helvetica/complete-family-pack" title="http://www.fonts.com/font/linotype/neue-helvetica/complete-family-pack">http://www.fonts.com/font/linotype/neue-helvetica/complete-family-pack</a></p>
    <p>My own view is that it's time for a modern family to be introduced but unfortunately... I am not the shot caller.</p>
    <p>Any advice is much appreciated.</p>
