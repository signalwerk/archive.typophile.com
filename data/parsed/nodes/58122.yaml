      <p>Those were the two that came to mind, though I was hoping to nail it with just one.  The first one would probably work for all intents and purposes, but the programmer in me hates it.  I guess I'll go ahead with the second one, as I suppose it's not too much messier than ligatureless ligatures when you have a three-deep f design.</p>
      <p>I wonder if such regex-style matching could be added into an OpenType 1.7 (image what you could do with it) or if we'll have to look beyond OT.  I can think of quite a few uses beyond my eample and a few handwriting things.</p>
