      <p>This is a really difficult one. There's two possible approaches:</p>
      <p>1. Presuppose a limit on the number of combining marks that might be applied to the first glyph, and then include multiple context strings along the lines of</p>
      <p>[process -marks-]<br>
      X -&gt; Y<br>
      ...<br>
      | -marks- -marks- -marks- -marks- Z -marks-<br>
      | -marks- -marks- -marks- Z -marks-<br>
      | -marks- -marks- Z -marks-<br>
      | -marks- Z -marks-<br>
      | Z -marks-</p>
      <p>2. Include duplicate glyphs for the Z triggers and first perform a separate substitution when Z is followed by a mark:</p>
      <p>[process -marks-]<br>
      Z -&gt; Z.premark<br>
      | -marks-</p>
      <p>[process NONE]<br>
      X -&gt; Y<br>
      | Z</p>
