      <p>Yes, the 'A', and while what initially caught my eye was the lowercase P——the K, italic V, capitol X (so wide at the base!) and the punctuation, especially the question mark are all rather unique.</p>
      <p>I'm wondering whether this could be classified as early humanist although the l/c E doesn't fit.</p>
