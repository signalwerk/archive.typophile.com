  html: |-
    <p>Can anyone provide me with the name of this font?<br>
    Unusual wooden poster type. Depth of letter 48 line, outline, possibly victorian gothic design with the bottom fifth left solid making a decorative baseline. This could be part of a two colour set.</p>
    <p>Thank you.</p>
