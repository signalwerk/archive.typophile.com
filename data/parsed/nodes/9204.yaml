    html: <p>Gerald <br> <br>Somewhat irrelevant to your question, but Paul Hayden Duensing engraved it in 14 point from the drawings which he borrowed from his friend, Robert Hunter Middleton. I believe the matrices have been dispersend between two or three friend of Paul. It is possible the Andromaque mats are with Rich Hopkins, publisher of the ATF Newsletter, and founder of The American Typecasting Fellowship. <br> <br>Jim Rimmer</p>
