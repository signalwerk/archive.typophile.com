    html: <p>An old post, but still . . . as I was curious about Baker's Andromaque as well . . . I thought I would add for the sake of posterity that the original Andromaque matrices are at Wells College in Aurora NY. When I was director at their Book Arts Center plans with in motion to purchase from Stan Nelson a hand mould outfitted to hand-cast metal sorts from the original matrices. (Yes, I was channelling my inner James Mosley a la Rare Book School demonstrations.) Plans fell through when a new Dean took over and withdrew support for the Center in hopes of shutting it down and selling off its assets.</p>
