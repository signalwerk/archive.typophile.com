  html: |-
    <p>Hi everybody</p>
    <p>I and a friend are gathering a bunch of chilean and some select international group (Matthew Carter, Milton Glaser, Nick Shinn, Underware, Gerard Unger, Gabriel Martinez Meave, Eduardo Omine, Akira Kobayashi, Xavier Dupre, Christian Schwartz, Andreu Balius, and more) to participate un PROYECTO DEMO.</p>
    <p>Is the first DEMO and for this first time qe are celebrating the font "Australis" by Francisco Gálvez, the same one that won the MORISAWA contest on 2002.</p>
    <p>we have allready 136 designers, and everyone is making a 13x15 cms artwork to publish on a 16x16cms book in 2 colors, we want to show in a short future all the works in the DEMO website <a href="http://www.proyectodemo.cl" title="www.proyectodemo.cl">www.proyectodemo.cl</a>, i will anounce it when it reafy.</p>
    <p>bye</p>
    <p>Cristian Gonzalez Saiz</p>
