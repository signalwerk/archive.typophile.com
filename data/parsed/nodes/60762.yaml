      <p>Further research (anything is better than working) suggests that this is more likely to be a "saltire ragulée," saltire meaning diagonal cross and ragulée meaning knotted. I note that you're in Austria. That doesn't mean the castle is, of course, but if it's someplace in the former Holy Roman Empire, the symbol may be derived from Charles V, who, having inherited the Burgundian Netherlands, incorporated the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Cross_of_Burgundy_flag">Cross of Burgundy</a> into his <a class="freelinking external" href="http://en.wikipedia.org/wiki/Coat_of_arms_of_Charles_V,_Holy_Roman_Emperor">coat of arms</a>.</p>
      <p>I’d earlier thought your logo looked like a budding branch or cross, which would have heavy Christian symbolism, and then I found the coat of arms of the <a class="freelinking external" href="http://www.ngw.nl/int/dld/s/stockach.htm">city of Stockach</a>. The stick is a visual pun (in heraldic terms, a cant) on the name of the town – stock in German means stick. And of course the stick is itself canted – a double pun.</p>
      <p>Your logo could also be a bilateral form of a <a class="freelinking external" href="http://de.wikipedia.org/wiki/Hirschstange">Hirchstange</a> (stag horn), as in the coat of arms of <a class="freelinking external" href="http://commons.wikimedia.org/wiki/File:Blankenburg-Regenstein.PNG">Blankenburg-Regenstein</a> (any chance your client is <a class="freelinking external" href="http://en.wikipedia.org/wiki/Regenstein">Regenstein castle</a>?)</p>
      <p>OK, I'm done now.</p>
