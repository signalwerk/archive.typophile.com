      <p>Thanks gus. Sorry for not answering earlier - i've been in some remoter areas lately and was cut from the internet for more than two weeks.<br>
      Wow. I'm deeply impressed what you found on your research. Yes, you are right, I'm from Austria and the castle is, too. It's the castle of <a class="freelinking external" href="http://www.mittersill-tourismus.at/S94_Nationalparkregion-Ausflugsziele-Schloss-Mittersill_1.html">Mittersill</a>.<br>
      Some piece of history:The castle was founded in the 12th century, but was burnt down by rioting peasants in 1525 and most of what remains today is from the 16th century (and some addons from the 20th century).<br>
      While the founders of the castle were the family of Lechsgemünd (Bavaria), from 1228 onwards the castle belongt to the Hochstift Salzburg, which means it belongt to the archbishopry of Salzburg. in 1806 the archbishopry was secularised, but up to 1850 the castle was still inhibited by clergy. from 1880 onwards the castle was sold to private owners. 1935 to 1967 the castle housed an international sport- and shooting club and was accomodation to well known people like Bob Hope, Clark Gable, Soraya, Schah of Persia and Henry Ford. today it belongs to the International Fellowship of Evangelical Students.</p>
      <p>thanks again for your research.</p>
      <p>@theplatypus: the illustration is my rendition. i tried to stick as close to the original as i could, though. </p><div class="imageWrap"><img src="http://typophile.com/files/gege04_Mittersill_blind_3507.jpg"></div><br>
       there are variations, though, on other window/door-blinds. <div class="imageWrap"><img src="http://typophile.com/files/gege04_Mittersill_blind2_4060.jpg"></div><br>
       The idea of crossing branches or Hirschstangen might be correct after all. for me the most important is, that it has no deeper meaning that might disagree with the evangelical foundation of my customer.<p></p>
      <p>thanks</p>
