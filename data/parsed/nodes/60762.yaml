    <p>hi,</p>
    <p> i'm just working on a corporate design for a mideval castel that is beeing transformed into a christian conference center. the windowblinds of the castle have a very strong and characteristic graphic design (see image) which i would like to take up for the new logo. unfortunately i have no idea if this is just a nice pattern or whether there is some symbolic meaning attached to this. has anybody come across this sign yet? I'm thankful for any comment on this. </p>
    <p>thanks<br>
    gerhard</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gege04symbol_6400.jpg"></div><p></p>
