      <p>In the olden days some combinations of fonts were duplexed (eg Linotype — in which cases identical glyphs would have the same widths). I know there is some evidence somewhere in my library… : (</p>
      <p>I also remember that some corporate fonts use the measures of standard fonts (such as Times or Helvetica), to make sure that texts — in fall back situations, where the corporate fonts are unavailable — have the same lengths. Which is a concern for legal texts and such.</p>
