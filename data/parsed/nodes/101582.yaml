      <p>I vote the basic idea is flawed. I think more important for readability is a balance of size and weight. </p>
      <p>What you could do, with the font mentioned, is to try the different weights for screen and print. My guess is that with the ASAP fonts, the normal for print &amp; bold for projection might work. You'd have to experiment. I believe there may be other fonts that have the same setwidth for different weights, at least, to a point.</p>
      <p>You could also experiment with one of the old Adobe Multiple Masters fonts, changing the width axis to, in effect allow the type to be larger/heavier for screen usage with the same character widths. The "optical size" axis in MM could also help; use a 6-7 point for the screen &amp; a 10-12 point for print.</p>
      <p>Not sure that will work technically, or for that matter, to solve your problem, but if you're willing to try, it could be worth a shot.</p>
