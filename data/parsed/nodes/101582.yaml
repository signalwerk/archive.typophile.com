      <p>I certainly agree (with Craig as well) that it's a marked compromise, but the proof is in the pudding: when you look at a setting of Compatil, can you point out cases of damage being done? Maybe when the compromises are properly managed the end-result is within a threshold of acceptability? Which is, of course, a variable thing, but I'd like to be shown that "the 'i' is too tight/loose/wide/narrow" for example. With that "wide/narrow" nicely reminding us that serifs can vary in size (something I did in Patria). Which of course brings us to the perennial existential question: What is a serif?  :-)</p>
