    html: <p>Type design isn't isolated from the worlds of graphic design, marketing, advertising, etc. Aesthetic trends are part of that and always will be. Aesthetically, jumping on stylistic bandwagons can be see as tired by those in the industries, but it is also often just plain good business appealing to the pop-culture desires of the particular period in time.</p>
