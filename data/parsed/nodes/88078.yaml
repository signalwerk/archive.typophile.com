      <p>Hey guys!<br>
      Well, thank you all for sharing your opinion on this .jpg</p>
      <p>So... No it is not Brawler or any other font out there, it is my Review. The image you see here is typed in one of the first digitized versions of it. It look a bit different now, but it is not finished yet. All the lines are typed in Review Regular (the first line is in small caps).<br>
      Why is it still in this first version and not in the corrected one? Well, because I'm not really active on any forum or blog or whatever site out there where my web site is mentioned I didn't think that anyone will see it, so I've left it by the time I finished the web site. Seems I was wrong :)  Anyway, Review was designed to be used in newspapers. It was my school project last year. And now, I'm trying to correct it where needed. Also I'm designing some other cuts of the text and some of the display version. </p>
      <p>P.S. Thant you Nick Cooke  :)  You are right, it was drawn with thought and consideration. I am sorry that you've all seen this really bad and compressed jpg of an early version, but still... I am glad to hear an opinion. I'll post you some examples when I finish it. Ok? :)</p>
