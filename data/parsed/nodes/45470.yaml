    <p>Hi,</p>
    <p>I am developing a new website for a hairdresser chain in Germany and I wonder if I'm on the right track. Please have a look at <a class="freelinking external" href="http://rub.designbits.de" rel="nofollow">the website</a> and let me know what you think could be improved.</p>
    <p>The logo was developed years ago by another company so there's no way of changing it. The typeface I chose is Helvetica but I'm not sure if it will render OK on Windows machines. I'm also keen to know if the price list is well formatted or if it should be given more structure.</p>
    <p>Sorry for the site being in German only, but you should be able to get the gist of it.</p>
    <p>Thanks for any feedback!</p>
    <p><a class="freelinking external" href="http://rub.designbits.de" rel="nofollow">Link to Website</a></p>
