    html: "<p>hey alejandro, i think this is a great face. i must agree with Juan Pablo, however, that it is more of a display face than a type for text. If your goal is for this to be a display face you just need to iron our a few kinks. If you want this to be usable for text, I'm afraid you'll have to lose some of the more decorative features. <br>This critique assumes that this face will be used for display, I'm no pro, so take all I say with a grain of salt or two. <br>Firstly: I love the g! However, I feel that the \"eye\" of the g may be too small. <br>Secondly: I like the breaks on the legs of the h, l, m and n. I think they add cohesiveness to the design as you used similar serifs for characters such as a, etc. However, i think that the breaks should probably descend a bit below the baseline because the breaks make these legs look shorter than the normally serifed legs. <br>Finally: The r looks like an amputated n. Take a look at <a href=\"%20http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=17#pictloader\" target=\"_blank\"> this</a> to see how you can rework this character. <br>Hopefully someone with more experience will take a look at this and give you some more in depth criticism. Keep up the good work!</p>"
    html_clean: "<p>hey alejandro, i think this is a great face. i must agree with Juan Pablo, however, that it is more of a display face than a type for text. If your goal is for this to be a display face you just need to iron our a few kinks. If you want this to be usable for text, I'm afraid you'll have to lose some of the more decorative features. <br>This critique assumes that this face will be used for display, I'm no pro, so take all I say with a grain of salt or two. <br>Firstly: I love the g! However, I feel that the \"eye\" of the g may be too small. <br>Secondly: I like the breaks on the legs of the h, l, m and n. I think they add cohesiveness to the design as you used similar serifs for characters such as a, etc. However, i think that the breaks should probably descend a bit below the baseline because the breaks make these legs look shorter than the normally serifed legs. <br>Finally: The r looks like an amputated n. Take a look at <a href=\"%20http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=17#pictloader\" target=\"_blank\" class=\"link-lost\"> this</a> to see how you can rework this character. <br>Hopefully someone with more experience will take a look at this and give you some more in depth criticism. Keep up the good work!</p>"
