    <p>Hi everybody. After finish Kautiva set I wanted start  to make my first serif font.. This one began based in Kautiva (see at the bottom of the image) and I incorporated some kind of serif that I felt works good and made the weight a little lighter changing the contrast of the curves. <br>I still wanted to mantain some strong references from the original sans like the angle of some ends. <br>Not uppercase yet, not kerning, just this. <br> <br>Any comment, help will be really apreciated. Gracias!!!!!! <br></p>
