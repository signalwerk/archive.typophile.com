  html: |-
    <p>I've been working on creating my freelancer/personal brand. I posted <a class="freelinking external" href="http://typophile.com/node/56560" rel="nofollow">my business card</a> last week and going off the logo I developed there and the current typography I am using there, I've redesigned my resume. Right now my business card is designed in Lane, so I've used that typeface here as well. Unfortunately Lane doesn't include a bold or italic, so I'm relying on all caps when I want to make a typographic differentiation. </p>
    <p>Here's the current version:<br>
    <a href="http://i41.tinypic.com/k9eyw6.jpg" title="http://i41.tinypic.com/k9eyw6.jpg">http://i41.tinypic.com/k9eyw6.jpg</a></p>
