    html: |-
      <p>My answer would have to be "It depends". I'd like to have the option to choose between this and current standard licensing. I'm assuming that you wouldn't be able to license an entire library for $100, so if I could choose maybe 2 full families in fully-featured OpenType and a handful of single-style fonts (probably display but not necessarily) this offer may be worth it. I'd much rather be able to pick a few things that I think would work for me than be saddled with whatever a default licensing package might be. Of course, I'm speaking as someone who is currently a hobbyist user of type, not a professional.</p>
      <p>The biggest obstacle I see would be enforcing this licensing scheme. Have self-obsolescing fonts been developed? How would you retrieve the fonts after 1 year? Would this system be based on the honor system?</p>
