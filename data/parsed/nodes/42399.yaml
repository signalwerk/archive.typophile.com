    user_name: dan_reynolds
    user_path: null
    date_raw: 25 Feb 2008 — 3:07am
    date: 2008-02-25T03:07:00
    votes: null
    html: |-
      <p>&gt; Hopefully, my license will transfer with the next font format change; does that work?</p>
      <p>That depends on the foundry. Many foundries do not upgrade you for free. Many more do not even offer discounts. On the other hand, an OpenType font often has far more in it than a normal PostScript Type 1 font may have. So a free upgrade there wouldn't really be fair in a lot of cases.</p>
      <p>There will inevitably be a lot that changes in the next generation font format, and a lot that stays the same… just like every other technological step. But I personally don't expect the attitude toward the terms "licensing" and the idea of protecting intellectual property to change. In fact, if I were betting, I'd say that the next format will offer foundries even more protection somehow.</p>
