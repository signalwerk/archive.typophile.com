    date_raw: 23 Feb 2008 — 11:40am
    date: 2008-02-23T11:40:00
    votes: null
    html: <p>You know, now that I think about it, the number of fonts would have to be only about as big as the Underware library. They only have  about fix or six typefaces out, but they all have what I consider a lot in them, and I like all of them a lot. I'd pay a hundred bucks a year for that. Hope this helps a little.</p>
