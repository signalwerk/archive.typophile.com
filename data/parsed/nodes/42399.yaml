    html: |-
      <p>Thank you for all your comments. I was just trying to gauge your opinions. </p>
      <p>Currently for several of our clients, we offer a licensing deal as follows: For a yearly fee they gain access to our entire library. As we come out with new fonts, they get access to those as well. When they use our fonts in their client's work, they bill price of the relevant fonts to their client. We offer them a discount on the font price that they can either pass along to their client, or take as a sales commission. </p>
      <p>We also work with them to develop designs that they feel are useful.</p>
      <p>So far it is working nicely.</p>
      <p>James</p>
