    html: |-
      <p>As a student, it would depend on the library, but probably. I’ve already dropped $400 on fonts this semester—and it’s only a month in! It would have been even better during my sophomore and junior years when I had less money to spend and was just using whatever bootleg fonts were going around. I also think professors would be less likely to give fonts to students if the cost of a years worth of fonts was about equal to two good textbooks. </p>
      <p>This would also be a great deal for the organization I work for. We don’t have a huge budget so our display types don’t change much because we can’t justify dropping money on a font to use it once or twice. Paying a subscription fee would make a lot more sense, and allow me to avoid getting every font purchase approved. I would have very little trouble getting $100 per <em>month</em> approved if the collection were big enough.</p>
      <p>Edit: On a related note, I would be especially likely to use it if the whole thing operated using FEX.</p>
