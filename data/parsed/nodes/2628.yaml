    html: "<p> I don't know if Tanya is kidding, but the quote is <br> <br>   : to me design is merely a language. : <br>       : a means of communication : <br> <br>tibor kalman <br> <br>John, the concept is good and the context/readability/legibility question is worthy of a book. (book deal: Hrant, you should write a book on some of this stuff.) I call this process of creating letterforms the Lineto/fusion method. Everybody I'm sure has seen the great stuff at lineto.com. I think every gridchild has messed around with Digital variations. Miles Newlyn has a pretty good one. <br> <br>You're posting this for criticism...so some of the letters -- b, k, m, v, x -- well they seem too dark. But unless you stray from the beginning forms, what can you do? <br> <br>the 'b' could be light like the 'd'  <br> <br>the k and the x, wow, those are difficult using the forms. <br> <br>I understand your context point, but maybe there's another solution to some of those darker letters to make it the forms more legible. <br> <br>bj </p>"
