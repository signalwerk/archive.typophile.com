    <p><strong>The Khatt Foundation Symposium on Arabic Visual Culture</strong><br>
    <strong>24 August 2007, Amsterdam</strong><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/khkuka-logo_6023.jpg"></div><p></p>
    <p>The Khatt foundation in collaboration with Mediamatic will host a full day of lectures, presentations and celebration of new Arabic cultural expression.</p>
    <p>The day events will include:<br>
    - <a class="freelinking external" href="http://www.khtt.net/artefact-415-en.html" rel="nofollow">the one-day symposium</a><br>
    - <a class="freelinking external" href="http://www.khtt.net/artefact-106-en.html" rel="nofollow">the launch of 5 new Arabic typefaces</a><br>
    - <a class="freelinking external" href="http://www.khtt.net/article-266-en.html" rel="nofollow">the Typographic Matchmaking book</a><br>
    - the international online community,<a class="freelinking external" href="http://www.khtt.net" rel="nofollow">the Khatt Network for Arabic Typography</a><br>
    - <a class="freelinking external" href="http://www.mediamatic.net/artefact-18263-en.html" rel="nofollow">the El-Hema Exhibition</a><br>
    - workshops<br>
    - the El-Hema design competition</p>
    <p><strong>The aim of this symposium is to discuss the positive role of design and typography in Arabic youth culture, how it can generate positive perceptions and productive collaborations that bridge the gap between Eastern and Western cultures.</strong></p>
    <p><strong>Speakers</strong></p>
    <p>A selection of scholars and designers from the Middle East, the US and Europe will discuss the impact of historical and contemporary visual culture on Arabic identity. New forms of visual expression, such as new Arabic typefaces, and other cross-cultural design experiments will be the focus of the symposium. The symposium will introduce the Khatt Foundations’ collaborative pilot design project <a class="freelinking external" href="http://www.khtt.net/artefact-106-en.html" rel="nofollow">Typographic Matchmaking</a>. Among other topics the symposium will cover topics that vary from history of European printing of Arabic books, to expressive calligraphy, to the relation of typography and dance, to the relation between culture and technological advancement in the printing arts, to political activism through visual communication in the Middle East, to case studies of inter-cultural design project between Dutch designer and Arab institutions (or designers), and statistical information about the visual arts, design, new media and typographic expression in the Arab world.</p>
    <p>The symposium’s speakers:<br>
    - Huda Smitshuijzen AbiFarès (Khatt Foundation, Dubai-Amsterdam)<br>
    - Willem Velthoven (Khatt Foundation / Stichting Mediamatic, Amsterdam)<br>
    - Dr. Goeffrey Roper (Institute for the Study of Muslim Civilisations, Aga Khan University, London)<br>
    - Jelle van der Toorn Vrijthoff (President of AGI &amp; principal of QuinX bv. Amsterdam)<br>
    - J.R. Osborn (University of Callifornia, San Diego)<br>
    - Brody Neuenschwander (Artist/Calligrapher, Brugges)<br>
    - Jacques Koeweiden (Koeweiden Postma, Amsterdam)<br>
    - Zeina Maasri (American University of Beirut)<br>
    - Nadine Touma (Dar Onboz publishers, Beirut)<br>
    - Peter Bilak (Typotheque, Den Haag)<br>
    - Nadine Chahine (Linotype Library, Germany)<br>
    - Fawzi Rahal (Grey Worldwide, Dubai)<br>
    - Tarek Atrissi (Atrissi Design, Hilversum)<br>
    - Pascal Zoghbi (Notre Dame University, Lebanon)</p>
    <p><strong>Registration &amp; Fees</strong></p>
    <p>The cost of the symposium is 45 Euro (20 Euro for students with valid ID).<br>
    Registration includes a free copy of the book Typographic Matchmaking and bonus CD (which has a retail price of 30 Euro), a lunch, and a reception.<br>
    Registration will be available as of next week at <a href="http://www.khtt.net" title="www.khtt.net">www.khtt.net</a>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/KhattFonts-poster_4969.jpg"></div><p></p>
    <p><strong>El-Hema Exhibition</strong></p>
    <p>The symposium will be followed by an exhibition entitled El-HEMA which will take place in Mediamatic’s gallery space (on the ground floor of the PostCS building). The exhibition will open on the night of the 24th of August and will go on until the 26th of October.</p>
    <p><em>The symposium and related events, have been generously supported by the Fonds BKVB, the Khatt Foundation, Stichting Mediamatic, the Openbare Bibliotheek van Amsterdam, and BIS Publishers.</em></p>
