      <p><cite>(is there a difference between the digital releases by DTL and Monotype?)</cite></p>
      <p>Albertina was a text family comprising Latin, Greek and Cyrillic, designed by Dutch calligrapher Chris Brand in 1965 and issued by Monotype for photocomposition.</p>
      <p>The face was first digitized by Frank Blokland at the Dutch Type Library and released in 1996. The DTL version offers Greek as well as a book weight of the Roman. Blokland is credited as the designer of Albertina MT, so the underlying data for the common weights should be the same.</p>
