      <p><cite>What accounts for the difference in price of the MT Albertina and the DTL Albertina?</cite></p>
      <p>Three letters: D—T—L</p>
      <dl>
      <dt><a class="freelinking external" href="http://www.typophile.com/user/2263" rel="nofollow">crossgrove</a> reported in <a class="freelinking external" href="http://www.typophile.com/node/16474" rel="nofollow">another thread:</a></dt>
      <dd>Monotype and DTL collaborated on the digital revivals of both Albertina and Haarlemmer. Frank Blokland oversaw both projects. Both were originally developed by Monotype, and DTL did the production, so that would explain their release by both companies. Both are considered definitive...</dd>
      </dl>
      <p>You may want to pose your query directly to the Dutch Type Library.</p>
      <p><cite>What’s about Dante Pro?</cite></p>
      <p>It's a fine piece of work.</p>
