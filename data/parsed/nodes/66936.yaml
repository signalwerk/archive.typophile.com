    <p>Hello,</p>
    <p>my favorite serif typefaces up to now are in particular Albertina (is there a difference between the digital releases by DTL and Monotype?) and Scala, but also Minion. Bembo and Dante are as well fine typefaces with fine italics, but have in my opinion a too literary tone.</p>
    <p>I’m in search of »my« typeface and have compared a lots of fonts. Albertina, Scala and Minion are clean, clear and neutral typefaces with (and that’s importent) wonderfual crisp italics! I consider to purchase a license for the MT Albertina Pro, but first want to be certain that I didn’t ignore an alternative.</p>
    <p>If you have some alternatives in mind, please let me know! Thank you.</p>
    <p>Kind regards</p>
    <p>Mario</p>
