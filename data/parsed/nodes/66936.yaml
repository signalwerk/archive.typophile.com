      <p>I like Minion very much and used it a lot. As usual in Slimbach's works, it's a very well designed typeface –although I never liked the wide kerning for digit 1 in both lining and oldstyle variants.</p>
      <p>Dante is also outstanding, but there isn't a pro version of this family. So it lacks useful OT features.</p>
      <p>I think Scala italics works perfectly in small amount of texts. But if you have to format a whole paragraph with it, the appeareance becomes a bit obstrusive. Scala's numbers are also good just if you use it rarely due to its somewhat ornamental oldstyle approach.</p>
      <p>I'd consider two alternatives:</p>
      <p><strong>Iowan Oldstyle</strong> has a design similar to Minion, but with wider glyphs. Works very well in books. The family went pro recently. Anyway, as many Bitstream/Monotype/Linotype fonts, the pro version is not so complete as Adobe's ones.</p>
      <p><strong>Novel</strong> is another great alternative (probably my pick nowadays). The family is very complete and was released in late 2009 with a large set of OT features. You can see more here: <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/buro_dunst/novel_pro_family_complete_ot/" rel="nofollow">http://www.fontshop.com/fonts/downloads/buro_dunst/novel_pro_family_complete_ot/</a>.</p>
