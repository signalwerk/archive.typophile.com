    <p>Although typeface intrigues me, I’ll admit, I do not have an eye for it. My strength lies mostly in illustration. I’m working on a wine label for a computer graphics class and I can’t figure out what to use for the name. </p>
    <p>Feel free to critique the heck out of the design itself while your at it, I’m more than open to it.<br>
    </p><div class="imageWrap"><img src="/files/wine lable_3992.gif"></div><p></p>
