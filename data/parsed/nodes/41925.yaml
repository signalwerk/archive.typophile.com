    <p>Hi Everyone,</p>
    <p>I have been playing around recently with giving digital text a 'been printed' look where it has bled - I have tried several different approaches but haven't really been happy with any of them.</p>
    <p>Does anyone have some tips or know of a tutorial for Illustrator or Photoshop in bleeding stuff onscreen as if it was printed on paper?</p>
    <p>Thanks!</p>
    <p>Rafe</p>
