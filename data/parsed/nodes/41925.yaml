    html: |-
      <p>Perhaps a far better way to explain it is by focussing on the differences between printing from metal and digitally - I am tired of everything printed from a digital source being so perfect, and just as the designer intended. With material printed on a press there is always an element whereby the work is just as it is, and whereby there is only so much control a designer can have over the final product; as such, material printed manually tends to have more personality. The imperfections and inconsistencies created when printing digitally are in general uninteresting and do not create any remarkable effects bar that of making the work seem substandard.</p>
      <p>However when printing stuff from metal, wood or whatever material takes your fancy with a manual printing press, you get interesting variations created from how the ink is spread over the surfaces, which paper you use, how firmly you apply the press, etc.</p>
      <p>I want to introduce this type of inconsistency to digital media, in an effort to create what I suppose you could call an 'accidentalism' - an effect or final appearance which was, to a certain extent, created by accident. Obviously the nature of digital layouts means such accidentalisms are almost impossible; thus I want to simulate it in Photoshop/Illustrator, starting with making stuff look like it has been printed on paper.</p>
      <p>This is the start of a personal project I suppose; any help would be greatly appreciated.</p>
      <p>-Rafe</p>
