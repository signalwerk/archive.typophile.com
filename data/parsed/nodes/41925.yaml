    html: |-
      <p>There are several threads about OpenType and alternate characters used to make a handwriting font look more like handwriting. I suspect this method could be employed with any font to add subtle variation.</p>
      <p>Also, there are are many ways to distress a font and add irregularity. One very basic approach is to rasterize the type, add noise, blur the image to soften/fatten the edges, convert to bitmap, then redraw using the curves.</p>
      <p>The problem is that a distressed edge means more points. This could be a real issue in a book face, for example.</p>
