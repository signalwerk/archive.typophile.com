    <p>Hi Typophiles,</p>
    <p>After incessant delays, I'm finally getting around to working on my own studio's logotype. I previously conducted exhaustive typeface research, surveying the sans landscape for fresh and worthy entries into that classification.</p>
    <p>Considering the studio's core capabilities are user experience consulting and interaction/information design for screen-based media, I was looking for a typeface inspired by screen and with a single-story "a" and "g."</p>
    <p>The main goal of the studio is to provide superlative online experiences through interaction/information and visual design, by way of customer-centered methodologies and Web standards. I would also like to focus on type direction for corporate/brand identity, and logotypes in particular.</p>
    <p>As far as usage of the logotype, again, it will mainly be screen-based and for basic Corporate ID materials.</p>
    <p>I have happily settled on Our Type's/Fred Smeijers' (<a href="http://www.ourtype.be/" title="http://www.ourtype.be/">http://www.ourtype.be/</a>) excellent Sansa/Sansa Condensed. Our very own Hrant cemented the deal for me, remarking:</p>
    <p>"I just took another look at that design, and I had to smile at how much it seems to be inspired by the screen!  :-)" </p>
    <p>Yes, he did use an explanation point and an emoticon. :)</p>
    <p>I've done some sketching and exploration of the forms, and decided to set the logotype in all caps for a couple of reasons that will become apparent. My present agenda is twofold, to decide between Sansa and Sansa Condensed and to choose a weight -- or a weight between weights. I have yet to purchase the fonts, so the gifs are not the final outlines, but generated by way of Our Type's (innovative, yet slightly unwieldy) Flash GUI and screen captures.</p>
    <p>I'll begin work on a more polished sketch of the primary concept after choosing a width and weight. To explain it literally, I'm seeing an all caps setting with no spaces between the words, and an "HD" ligature. Additionally, I want to shape either the "D" itself or it's counter to resemble a droplet ala/originating from "SPLASH." I'm also visualizing "SPLASH" and "DESIGN" in different colors, probably blue (think tropical water) and gray respectively. Other considerations are the possibility of lowercase forms for "e" and/or "n" in DeSIGn, but this remains to be seen as it may distract the eye from the central "HD" focus.</p>
    <p>So, tell me what your eyes like for width and weight Typophiles...</p>
    <p>As always, I look forward to all of your input, tutelage, humor, criticism, sketches and anything else you'd like to throw at the wall.</p>
    <p> -tim</p>
