      <p>Hi Typos -- I've emailed OurType three times with questions about Sansa and they have failed to reply. I'm not too excited about buying a typeface from them if they are unable to so much as reply to my mails. Perhaps it's a glitch with their Flash interface? </p>
      <p>This got me to perusing specimens again, and I came across an interesting face by Thomas Mettendorf called <a href="http://www.garagefonts.com/typespecimens_2.html?sku=GF061008X1P2&amp;charsets=T&amp;start=1" rel="nofollow"><strong>Fono</strong></a> in the Indie Fonts 2 book.</p>
      <p>I really like the character of this font. I think it might work even better than Sansa for my purposes (screen-based logotype and headlines/corporate identity. I'm not sure how it would do as a text face, but I can always choose another with which to pair it.</p>
      <p>What do <em>you</em> think of <a href="http://www.garagefonts.com/typespecimens_2.html?sku=GF061008X1P2&amp;charsets=T&amp;start=1" rel="nofollow"><strong>Fono</strong></a>? Is it too funky?</p>
