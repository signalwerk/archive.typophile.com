      <p>Thanks for your comments.   I had a sneaking suspicion it was too hard to read... I only tried regular Helvetica, as this is the only one I have on my laptop, but the lighter weights will probably be available on campus, so I'll give it a go. I guess I was shying away from Helvetica because it seems to divide so many designers - it seems that people love it or hate it. </p>
      <p>I considered tracking a more dense font, but wasn't sure whether that was a good solution. Are there any pitfalls to watch out for when tracking fonts?</p>
