    html: |-
      <p>I would honestly stick to something a little easier to read for body text. One issue I could potentially see using Century Gothic would be the similarity between characters like the lowercase "a" and "o". My one concern with using a sans-serif font for body copy in print is readability- its usually easier to read serif set copy rather than sans-serif.</p>
      <p>Out of curiosity, which weight of Helvetica did you try? What happens if you play around with a lighter weight (45, maybe?) and track it a little loose, just to keep that open, free feel to the text?</p>
