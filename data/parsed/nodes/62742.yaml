  html: <p>I'm designing a book containing a list of interviews, so the body text is made up from questions (in bold), followed by the answers (sometimes one word, sometimes several paragraphs).When I initially typeset a sample chapter, I used Georgia for the chapter titles, and Century Gothic for the body text - but am beginning to worry that this may be difficult to read in large chunks (I'm using 8pt text with 12pt leading; see sample below). I'm sure some readers are cringing at this choice, but many of the sans serif fonts (I've been asked to use sans serif for the body) I tried look quite dense on the page (futura, frutiger, helvetica, gill), and I like the roundness of Century Gothic with Georgia, but obviously what it looks like doesn't matter if nobody can read it!<br><img src="/sites/default/files/old-images/SampleText_6435.jpg"></p>
  html_clean: <p>I'm designing a book containing a list of interviews, so the body text is made up from questions (in bold), followed by the answers (sometimes one word, sometimes several paragraphs).When I initially typeset a sample chapter, I used Georgia for the chapter titles, and Century Gothic for the body text - but am beginning to worry that this may be difficult to read in large chunks (I'm using 8pt text with 12pt leading; see sample below). I'm sure some readers are cringing at this choice, but many of the sans serif fonts (I've been asked to use sans serif for the body) I tried look quite dense on the page (futura, frutiger, helvetica, gill), and I like the roundness of Century Gothic with Georgia, but obviously what it looks like doesn't matter if nobody can read it!<br><img src="/sites/default/files/old-images/SampleText_6435.jpg"></p>
