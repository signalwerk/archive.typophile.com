    <p></p><div class="imageWrap"><img src="http://typophile.com/files/type-tables_6360.jpg"></div><p></p>
    <p>These type tables probably aren't very practical, but they sure look cool. They're by Alessandro Canepa and Andrea Paulicelli, two designers from Italy. They're available for sale. The height is adjustable so you can overlap letters.</p>
    <p>I saw them here:<br>
    <a href="http://lookslikegooddesign.com/type-tables-canepa-paulicelli/" title="http://lookslikegooddesign.com/type-tables-canepa-paulicelli/">http://lookslikegooddesign.com/type-tables-canepa-paulicelli/</a></p>
    <p>Page at the designer's site that describes them:<br>
    <a href="http://www.outdoorzgallery.com/aa_font" title="http://www.outdoorzgallery.com/aa_font">http://www.outdoorzgallery.com/aa_font</a></p>
