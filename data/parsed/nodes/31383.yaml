    html: |-
      <p>Hi All.</p>
      <p>Yes, they are being used in InDesign. I made sure they put the fonts into the Fonts folder in the Library for the User. I also had them do a search for other versions of the font and get rid of all of them except the one.</p>
      <p>She’s now getting fonts printing out strangely. Selecting Minion for example and it prints out really weird. I told her to try printing that font from another app first. Then also printing that same text in a new InDesign file, in case the current one is currupt….to at least see if it’s an app problem or a font problem or a doc problem.</p>
      <p>I could try suggesting that they put  the fonts in the Apps folder. Still seems like there’s something wrong. I know FontBook isn’t that great. </p>
      <p>Has anyone heard about font issues with 10.4.7 or .8? A friend who upgraded to Tiger a while back did the .7 updater and had tons of font problems. She downgraded to .3 or something and all the font problems went away.</p>
      <p>But I don’t know about .8.</p>
      <p>One last thing…is it possible anyone is using a printer these days that isn’t postscript compatible? Seems she is getting errors that a font she has used isn’t available when she goes to print OR make a pdf, even though the printer font is there in the folder, seems to be there in FontBook and doesn’t get an error message when trying to choose the font in InDesign. This is nuts. I get an error message on selecting a font if the printer font isn’t available…as it should be.</p>
      <p>thanks,<br>
      Jane</p>
