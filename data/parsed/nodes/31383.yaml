  html: |-
    <p>Hi all-<br>
    I’m trying to help a friend who adopted a system<br>
    unfamiliar to them. They’re having two similar problems.</p>
    <p>An OpenType font they purchased is not working. They<br>
    open it in Font Book but they’re getting some kind of<br>
    postscript error when trying to print. As a test, I gave<br>
    them an alternate font to see if that worked and FontBook<br>
    only enables some but not all of the styles in that font.<br>
    Both work fine on my computer.</p>
    <p>I have been through everything: dumping other versions<br>
    of it in other folders, repairing permissions, quitting apps<br>
    before opening fonts, restarting. To no avail.</p>
    <p>The ONE difference between us is that I’m on 10.4.3 because<br>
    I heard there were font problems in 10.4.7. They are running<br>
    .8. I suggested they re-install the original version of Tiger<br>
    but they’re afraid to do it. They don’t have an easy backup method.<br>
    Neither are experienced Mac people.</p>
    <p>I’ve spent hours tech supporting them and I need to get this<br>
    solved so I can do my own work! : (</p>
    <p>Any ideas?<br>
    Thanks!<br>
    Jane</p>
