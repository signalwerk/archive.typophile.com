    html: |-
      <p>I don't think this was based on a pre-existing font. The p's are just inverted d's. The line weight and end strokes are inconsistent. The G is just horribly outlined, and really bumpy. I think the l was flipped for some reason. The stroke on the o is as thick as the G.</p>
      <p>If it was based on a font, it was then horribly mangled into what we see today.</p>
      <p>I would believe that it was hand done and then scanned digitally. </p>
      <p>For something similar, you might want to check : <a href="https://web.archive.org/web/20141113044353/http://www.sudtipos.com/home" title="http://www.sudtipos.com/home">http://www.sudtipos.com/home</a></p>
