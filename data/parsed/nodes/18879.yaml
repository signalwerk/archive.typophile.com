      <p>&gt; <em>I looked at FF DIN but it seems to me the ‘H’ and ‘E’ are fairly different, with the middle stem(?) being a lot lower in the font I posted.</em></p>
      <p>That’s because the type size is really small in relation to the pixel size. Quite often the horizontal stems “jump” up or down a pixel when anti-aliasing. I’m positive this is DIN.</p>
