    html: <p>I think your logo is very nice! I love logos in which the word itself is set in such a singular way that it becomes a unigue trademark and requires no additional symbol. I especially like the way the descender on the “t” and the bottom of the cap “C” follow the curve of the baseline. Mind sharing how you went about shaping the letters? Did you set the type on a curved line, convert it to outlines and then shape and redraw the “C” and the “t”?</p>
