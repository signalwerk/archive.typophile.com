  html: <p>Hello, I need some help to resolve some situation. <br> <br>Some client send me a work to do with cyrilic text (Microsoft Word), and when I open the file text the characters are change, the computer don't reconize this letters. This situation was repeted with the Macromedia Freehand. The original file was written with Times New Roman and works well with windows XP. I'm using a Mac OS 9.2 (English Keyboard) at my work but I'm confuse with the origin of the problem because Its my first time that I'm use cyrilic text. Did I must change the keyboard language? Or I must get a cyrilic version of Times New Roman to Mac OS? <br>thanks for any advice. <br> <br>Ricardo</p>
