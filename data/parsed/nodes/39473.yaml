      <p>I find myself using a combination of approaches, but philosophically at least I favour the contextual glyph option over ligatures. I think ligatures are essentially an artifact of metal type, and probably not veru helpful moving forward. There are exceptions, of course: where ligation of two or more characters results in a completely new, merged shape, as sometimes happens in traditional Greek or Devanagari ligation, then ligature glyphs are necessary. But if the component characters are essentially maintaining their independent identity and only linking together in some way, then I think contextual substitution makes so much more sense. It took a few years of dealing with Arabic to confirm this view, and I think it is only because the typical Latin ligature set is so small that it has not been more of an issue.</p>
      <p>By the way, Jelle Bosma used the contextual alternate approach in Cambria, but associated the lookups with the 'liga' lookup, rather than with 'calt'. I queried this at the time, but in retrospect I think it was the right choice.</p>
