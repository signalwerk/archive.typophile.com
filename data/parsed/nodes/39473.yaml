    html: <p>PS. re. Devanagari and some other Indic scripts. There is a secondary usefulness for ligature glyphs in Devanagari, Bengali, Gujarati, etc., which is as triggers for width variants of the prepostional short ikar (vowel sign), which in traditional writing reaches over the full width of a ligated conjunct.</p>
