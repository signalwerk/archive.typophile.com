    <p>jumping off from the discussion on <a href="http://typophile.com/node/39470" rel="nofollow">How Many Ligatures?</a>, i have my own question. are precomposed ligatures preferable to using contextual glyphs that can combine with other letters the way that a ligature would? for example: would it be better to have an f_f ligature, or a contextual first f that would change to a linking version when followed by another f. we already do this for cursive styles, why not for roman?<br>
    one positive i can see from this scheme is that you can keep the glyph count down if you have a lot of character combinations that need to be solved with contextual forms, especially if these involve characters that may have diacritical forms. one drawback is that throwing diacritical forms into the mix might actually necessitate precomposed ligatures, thus duplicating work in some situations. anyone else have thoughts on this?</p>
