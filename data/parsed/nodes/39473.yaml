      <p>thanks John. my current thinking follows yours, i would say. i'm leaning toward the opinion that contextual forms should be used wherever they can be and that true "ligatures" (perhaps more properly "logotypes"?) should be a last resort in instances, as you specify, the merged shapes morph so much as to make a simple contextual alternate form more difficult to work with than than it's worth.</p>
      <p>interesting the insight on Bosma's work. i'll have to think on that a bit more. thanks again for sharing your experience.</p>
