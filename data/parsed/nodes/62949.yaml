    <p>Hi all,</p>
    <p>I am a website / graphic designer and are just interested in how others keep up to date with the latest released fonts. What is your habit? Is there a few must visit websites you visit each week that does a round up of the week/months releases etc?</p>
    <p>I’d love to be able to go to one or two website each week, or be email once or twice a week with the latest releases without having to go and visit every font designers website etc.</p>
    <p>Any help would be great</p>
