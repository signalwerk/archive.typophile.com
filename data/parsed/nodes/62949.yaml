      <p>You can start by subscribing to MyFonts.com or Fontshop.com mailing list. Furthermore, you can try visiting each distributed type foundry’s websites and subscribing to their blog feeds.</p>
      <p>This forum also host a ’Release’ section at <a href="http://typophile.com/forum/7" title="http://typophile.com/forum/7">http://typophile.com/forum/7</a></p>
      <p>ILoveTypography.com also reviews newly released typeface every once in a while.</p>
