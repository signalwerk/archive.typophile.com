      <p>wow. i've been in the think tank for the last week or so, and i come back to some cool new features here!</p>
      <p>thank you all for your feedback here. i agree that this font has its problems. sometimes i have a lot of fun though, with problematic designs. i don't know what that says about my design sensibilities, but i think it helps me grow over the long-term.</p>
      <p>can anyone clarify for me what is meant by setting? type setting a few sentences perhaps? or actually seeing it function as a titling font over some paragraph text?</p>
