      <p>I've selected this design for the "Bitmap Display/Script" category in the first <a href="http://typophile.com/node/14678" rel="nofollow">Critique Thursday</a> because I think it is a great experiment.</p>
      <p>It goes to show that, maybe in some display cases, legibility isn't really everything…</p>
      <p>In letter combinations (how text always works anyway), I find the text above to be quite legible. What do you think?</p>
