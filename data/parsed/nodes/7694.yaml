    html: |-
      <p>In small doses -- display purposes -- this could be quite fun. I am a sucker for black weights, and I find the E and G variants to be the most interesting. I'm always impressed by those who design typefaces with pixels.</p>
      <p>In those two -- E &amp; G -- I find the U and V, the c and e, the t, the u and v, the x and z -- to be the weakest or rather in need of a little more work for differentiation. What about a setting?</p>
