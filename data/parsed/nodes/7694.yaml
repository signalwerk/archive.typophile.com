  html: "<p>Sometimes readability just isn't the point! <br> <br>I've been bingeing on pixel fonts for three days now, and am getting a bit punchy. <br> <br>Interesting to me sometimes, how one font will jump out of a single letter from another font: <br> <br>A. Trixie. I've been tinkering with this idea for months. Different sized pixels within a letter form. <br> <br>B. I wanted to spread out the letters with a better balance of little pixels to big pixels. The S and Z led the way, and ended up leading me to an interesting P and R. <br> <br>C. I decided to follow the P and R and see where it would take me. I thought it might make for an interesting unicase. the p and q looked okay. the b and d looked terrible. but they led me to consider a five pixel wide grid instead of a seven-wide. <br> <br>D. The lower case set just jumped right out of my mouse. The upper case isn't as good, but I felt good about getting an UC regardless. <br> <br>E. Woo-hoo! A bold works too! (three days and counting, remember?) <br> <br>F. WOW! Italics works too! <br> <br> <br>Ah, well, it's fun pushing pixels anyway. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53571.gif\" alt=\"\"></p>"
