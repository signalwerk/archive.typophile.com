      <p>Ute, concerning Lavazza, stop looking for a computer font and take the time to read. First read carefully about the <a href="http://www.lavazza.com/corporate/en/lavazzastyle/design/logo" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lavazza Logo Timeline</a> on Lavazza's site; in particular this logo is dated 1950:<br><img src="/sites/default/files/old-images/Lavazza_logo1950_5776.jpg"><br>
      If you look at the <a href="http://www.lavazza.com/corporate/en/company/history/1933-1955.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lavazza 1933-1955</a> history page, you see at the right this logo from 1945-1946.<br><img src="/sites/default/files/old-images/storia_logo_lavazza_5788.gif"><br>
      If you just look for <a href="http://en.wikipedia.org/wiki/Lavazza" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lavazza on Wikipedia</a> you get this picture from the beginning of the 19th certury: <a href="http://en.wikipedia.org/wiki/File:Lavazza_0002782_m.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">La grande storia...</a>. Look at the logo on the bottom left. I call that a company with a sense of continuity.</p>
      <p>Now <a href="http://en.wikipedia.org/wiki/Adobe_Illustrator" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Adobe Illustrator</a> dates from 1986. There were no digital fonts in the 1950s. There were no electronic computers outside "laboratories" in 1945-46.</p>
