      <p>Ute, concerning Lavazza, stop looking for a computer font and take the time to read. First read carefully about the <a class="freelinking external" href="http://www.lavazza.com/corporate/en/lavazzastyle/design/logo" rel="nofollow">Lavazza Logo Timeline</a> on Lavazza's site; in particular this logo is dated 1950:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Lavazza_logo1950_5776.jpg"></div><br>
      If you look at the <a class="freelinking external" href="http://www.lavazza.com/corporate/en/company/history/1933-1955.html" rel="nofollow">Lavazza 1933-1955</a> history page, you see at the right this logo from 1945-1946.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/storia_logo_lavazza_5788.gif"></div><br>
      If you just look for <a class="freelinking external" href="http://en.wikipedia.org/wiki/Lavazza" rel="nofollow">Lavazza on Wikipedia</a> you get this picture from the beginning of the 19th certury: <a class="freelinking external" href="http://en.wikipedia.org/wiki/File:Lavazza_0002782_m.jpg" rel="nofollow">La grande storia...</a>. Look at the logo on the bottom left. I call that a company with a sense of continuity.<p></p>
      <p>Now <a class="freelinking external" href="http://en.wikipedia.org/wiki/Adobe_Illustrator" rel="nofollow">Adobe Illustrator</a> dates from 1986. There were no digital fonts in the 1950s. There were no electronic computers outside "laboratories" in 1945-46.</p>
