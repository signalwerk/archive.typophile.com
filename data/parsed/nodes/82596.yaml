    <p>Hi guys,<br>
    URGENT</p>
    <p>Wow - I just signed up - how wonderful that you exist! I am a new graphic design student from Sydney so at this stage I will probably ask more questions than providing answers but hopefully that will change soon.</p>
    <p>I have to do a design audit, comparing the two coffee companies and I need to find out what logo font they are using (see attachment). Have they been especially created?</p>
    <p>Also - maybe you can help me: I am puzzled why the logo Vittoria is in a 30 degree angle?</p>
    <p>What significance has that? And how about the bar on the left of the Vittoria logo? Is that just to draw you to the logo?</p>
    <p>Re Lavazza logo: Looks like a logo for Ben Hur!! Why would they emphasize the A so much?</p>
    <p>Can't wait to read what you have to say...not sure how I will find out about it? Do I log in again? Btw - ned to finish the audit over the weekend.</p>
    <p>MANY THANKS,</p>
    <p>Ute</p>
