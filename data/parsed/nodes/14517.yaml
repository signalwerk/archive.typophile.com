    <p>I am doing some work for The UPS Store and am really liking their font "UPS Sans".</p>
    <p>I wouldn't want to use UPS Sans on another project so can anyone tell me what typeface it is based on.</p>
    <p>Let me know if you need more of a sample.</p>
    <p>Thank you.</p>
