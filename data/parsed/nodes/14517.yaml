    html: <p><a href="/web/20191007065213/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FutureBrand" title="Create node &quot;FutureBrand&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">FutureBrand</a> did the UPS rebranding a couple of years ago. Featured on their site is the casestudy claiming that " a custom typeface was develloped", when in fact, even here on Typophile, a lot of us noticed that it is merely, if at all, an adaptation of the ubiquous FF Dax. So I guess it is safe to suggest you use this typeface if you can't get the "UPS Sans" corporate typeface.</p>
