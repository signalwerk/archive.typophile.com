    html: |-
      <p><code>dberlow writes:<br>
      "The best way to avoid this issue is to have native drawing of TT in FL" </code></p>
      <p>You can draw TT natively in FL since its first release, even TT MM, but it is unconvenient. We are still waiting for meta control points to control curvature, tension and distances between TT off-curve points.</p>
      <p>dberlow writes:<br>
      "TT losslessly converts to T1"</p>
      <p>That is not correct for various reasons.</p>
      <p>TT can have a much higher UPM than PS, then you'll have rounding to a coarser grid. </p>
      <p>In theory, between 2 TT off-curve points a PS on-curve point can be placed, but this new point must be rounded to the grid, just as any new BCP. With all this rounding you lose the quality of your TT curve.</p>
      <p>When you edit quadratics (TT) in FL, you might notice you can do things that are not possible in cubic curves (PS) e.g. an optically pleasing connection between a straight and a curve, and this will never convert loslessly.</p>
      <p>Before converting from PS to TT, up scaling the UPM will give a much better curve fidelity. At the same time you get more off-curve points per curve segment, and all these off-curve points are rounded to the grid, giving a subtle warm wobbliness, that won't be there when you go back to PS :-)</p>
      <p>TT curves and fonts *can* be superior to PS, it is just too much work.</p>
