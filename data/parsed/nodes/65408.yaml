      <p>&gt;When you edit quadratics (TT) in FL, you might notice you can do things that are not possible in cubic curves (PS) e.g. an optically pleasing connection between a straight and a curve, and this will never convert loslessly.</p>
      <p>I don't see how this can be correct. PS curves are cubic equations, of which quadratic equations are a special case. So whatever you can do in outlines with quadratic--and TT outlines are quadratic--you should be able to do with cubic PS curves, if you are on a grid with the same resolution. You may need intermediate points off the extrema in PS Beziers, but there is no barrier to adding intermediate points--or working in 2048 units per em, right?</p>
