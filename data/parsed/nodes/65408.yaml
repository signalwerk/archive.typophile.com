    html: |-
      <p><em>When I ’Generate Font’ fontlab adds nodes to all my curves.</em></p>
      <p>Yes, that usually happens when you convert from PostScript curves (which you probably use for drawing in FontLab) to TrueType curves.</p>
      <p>But when you convert a font to outlines in Illustrator, the curves get converted to PostScript again, and even more points are added. That means what you see in Illustrator after converting isn't what's actually in the font.</p>
      <p>Solution is a) to generate PostScript-based OpenType fonts (no curve conversion necessary) or b) convert manually to TrueType inside FontLab before generating OT/TrueType fonts. In the latter case you get the chance to check the converted curves for bumps and waves (copy the actual PS outlines into the mask layer to see the differences) and correct them by hand before generating.</p>
