  - id: 385931
    user: 1133
    date: 2009-12-28T14:31:00
    date_raw: 28 Dec 2009 — 2:31pm
    votes: null
    html: |-
      <p>&gt; TT can have a much higher UPM than PS</p>
      <p>How so? You can make OpenType PS (.otf) fonts with a UPM of from 16 to 16,384 units, same for Type 1 -- exactly as with TrueType fonts. The maximum coordinates limit in OpenType PS (.otf) fonts and Type 1 fonts is ±4,095, so converting a 16,000 UPM TT font to PS may indeed pose a problem. But for the most common cases, there is none. Adobe Arabic is an .otf font with PS outlines based on a 2048 UPM, just like most Microsoft-made TT fonts. Conversely, many TT fonts are based on a 1000 UPM, just like most Adobe-made PS fonts. But both PS and TT fonts can have pretty much any UPM, within the set limits. </p>
      <p>See <a href="http://www.typophile.com/node/30913" title="http://www.typophile.com/node/30913">http://www.typophile.com/node/30913</a> for more discussion on this. </p>
      <p>Cheers,<br>
      Adam</p>
