    html: |-
      <p>calvintennant, </p>
      <p>every type design tool will change the contours slightly when converting PostScript curves to TrueType curves. It is due to the nature of the curves. </p>
      <p>These curves are based on different geometry. Each PostScript node has up to two control points, while in TrueType, there are on-curve points and off-curve points: between two nodes there may be often just one off-curve "control point". It's just a different way to draw curves, and some PostScript curves cannot be represented 100% exactly on the same UPM size (i.e. on the same grid of units per em). </p>
      <p>This is somewhat similar to a situation when you convert a PNG image to a JPG image, or to a situation when you export a movie into a different format, with different compression/encoding. You'll never get pixel-for-pixel fidelity. </p>
      <p>If you want better fidelity in the conversion, you could increase the UPM size in Font Info / Metrics and Dimensions before generating the .ttf font (you need to enable "Scale all glyphs..." there). You can use 2000 or 3000 UPM rather than 1000. </p>
      <p>I recommend reading the FontLab Studio manual for more information about the difference between PostScript and TrueType curves. </p>
      <p>Cheers,<br>
      Adam</p>
