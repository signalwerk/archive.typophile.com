    <p>I am a newborn in the world of type design.<br>
    I'm using FontLab for the first time to design my own typeface.<br>
    When I 'Generate Font' fontlab adds nodes to all my curves. This causes visible waves in my curves when printed large format (tabloid). I have attached two files that I created in Illustrator to demonstrate what I mean, one using glyphs from my ttf file, the other contains the glyphs I drew myself.<br>
    How can I avoid this, I see this as a major issue.</p>
    <p>Thanks for your help,</p>
