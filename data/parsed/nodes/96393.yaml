    html: |-
      <p>Have you tried saving (save as) the existing .vfb file under a different name and then changing the relevant metadata in the new file? Alternatively you could choose different encoding options until you find what you are looking for in terms of characters.</p>
      <p>You might find it useful to look at the PDF code charts for <em>Controls and Basic Latin</em> (range 0000–007F) and <em>Controls and Latin-1 Supplement</em> (range 0080–00FF) which can be found through the <a class="freelinking external" href="http://unicode.org/charts/" rel="nofollow">Unicode Consortium Code Charts page</a>.</p>
      <p>You might also find the posts below useful:</p>
      <p><a href="/wiki/Adobe%20Glyph%20List%20%28AGL%29%20authoritative%20version%3F%3F" class="freelinking" rel="nofollow">Adobe Glyph List (AGL) authoritative version??</a></p>
      <p><a href="/wiki/Adding%20custom%20Unicode%20values%20to%20FLS5%27s%20list..." class="freelinking" rel="nofollow">Adding custom Unicode values to FLS5's list...</a></p>
