  html: <p>I have a font I'm working on, basically all I have is upper and lowercase, figures, some puncuation.  Now that I'm just about happy with these glyphs I want to expand the set.  I have noticed that none of the empty glyph spots have names anymore in names mode.  What I basically want to do is take my glyphs together with their metrics info, and I guess kind of paste them into blank font file with the basic latin 256 standard unicode layout.</p>
