    html: |-
      <p>From your description, I guess the letters in FontLab's Names view are all showing up (with blank names) clustered together at the bottom, and the yellow-labelled cells showing glyph names are currently sitting empty?</p>
      <p>If so, you can just highlight your glyphs and drag them onto the proper name cells using the mouse.  You can even do them in batches as long as the consecutive target cells match up with how the glyphs are currently ordered...</p>
      <p>You can do the same thing in Unicode view to make sure their codepoints are correct as well.</p>
      <p>(The above at least works in Windows, I assume it does under MacOS as well.)</p>
