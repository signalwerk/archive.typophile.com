    html: <p>Squirrel is a great name for it. It really says Squirrel to me.   <br>  <br>As for the design, I rather like it for it's utilitarian qualities. I could find a use for it.   <br>It reminds me of the paper clip.  Which I also really like. It's a beautiful thing if you think about it. So well designed you hardly stop to think about it. But, when you do, you just have to say <i>wow</i>.  <br>  <br>But I digress.  <br>  <br>The UC *Y* throws me off a bit but I see how you got there. Same thing with the *?*. In the latter case I would like to see more space in the bowl. But again, I see what you are after - its in the style of the design.  <br>  <br>Nice face, Very pleasant.  <br>  <br>smc</p>
