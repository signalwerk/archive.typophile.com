    html: |-
      <p>Extensis Suitcase version 12 (“Fusion”) has worked at my office since about 2007. It takes some configuring and some getting used to, but once that’s through it’s fantastic. Each of our computers is usually working on several projects at once, so we need quick activation and deactivation of font sets.</p>
      <p>In order to reduce conflicts, uninstall or remove as many system fonts as you can; you can activate them as you need them through Suitcase.</p>
      <p>I’d recommend <em>against</em> Linotype Font Explorer — every computer that I’ve seen it installed on has been riddled with conflicts and phantom fonts. Usually the system font software is better.</p>
      <p>As for keeping your computers in sync and organized, for me that’s more of a personal choice. Any method of transferring files should work, right?</p>
