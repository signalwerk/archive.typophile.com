  html: |-
    <p>Hello,</p>
    <p>I`ve created a fashion logostyle for a young fashion designer,<br>
    who is oriented for men and women clothing. From briefing this identity must<br>
    reflect classines, fashionableness. Must be wearable, but not quirky and not<br>
    too high luxury. For the understanding “fuchs” is in german fox, so I tried<br>
    to avoid typical association of logo with fox. I plan fox-heraldy-sign for<br>
    a monogram or for jeans-sub-brand, where fox is in the right place I think :o)<br>
    So I`m ready to be beaten with critics and would be happy to get some<br>
    tips and ideas. How good is kerning? Color is replaceable.</p>
