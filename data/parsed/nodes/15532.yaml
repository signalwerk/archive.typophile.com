    html: |-
      <p>Yes Miles, I see now the accent is to0 definitive. It have to be discreet. I modificated accident grotesk extended`s “F” to avoid reading “f…s”, that we get at small sizes and fast looks. :o) After that, the result of ligature must adumbrate the infinity sign, that signified the christine`s vision how clothing have to be. But if that don`t occured, then I go wrong way. Thank you for precise tips.</p>
      <p>One thing you must confess… Are you Miles Newlyn, the owner of <a href="http://newlyn.com">http://newlyn.com</a> ? Then you are my logo-god! Your “3” is number one in my logolist and “ish”, “unilever” top 10. Respect. My answer to your logostyle, better to say the try, you can see here: <a href="http://www.kahlkopf.com/deu/vita">http://www.kahlkopf.com/deu/vita</a> .”Kahlkopf” means skinhead in german. So it was near idea to create skined and nacked “K”, but what could stand infinite times without boring.</p>
