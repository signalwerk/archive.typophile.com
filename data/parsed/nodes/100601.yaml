  html: |-
    <p>I recently came across a book, c. 1990, typeset in A. Frutiger's Iridium (Linotronic 500), and realized what a beautiful typeface Iridium is. Like a happier Walbaum, a more humane Bodoni, a better-crafted New Caledonia...</p>
    <p>As the Linotype specimen sheet, as always, isn't too helpful -- has anyone has ever used the digital version, or seen a book typeset in it? </p>
    <p>thanks in advance!</p>
