    html: <p>If you’re in Berlin or in Mainz, you can probably find a copy of »Adrian Frutiger – Schriften. Das Gesamtwerk«. It contains a sample of the digital Iridium (p. 241). For my taste the hairlines are a tiny bit too thin in &lt; 10 pt. Depending on your printer it might work though.</p>
