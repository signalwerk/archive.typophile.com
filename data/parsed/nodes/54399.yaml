  html: |-
    <p>So I've taken my first shot at designing a face.  This is very much trial by fire for me so there are many mistakes in here and any criticisms would honestly be excellent.  Outside of just general criticism I was also looking for advice on how to make the z and x work because they seem to fly in the face of what had been done previously with the serifs, and also if there is a better way to handle the letters r-v because they seem much too small in relation to the other letters.</p>
