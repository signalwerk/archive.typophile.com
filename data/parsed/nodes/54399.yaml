    html: |-
      <p>Like the typeface, the second I saw it my eyes just shot open. The contrast between thick and thins is really nice. </p>
      <p>The only thing that I saw that was vaguely odd was the way the "r" and the "f" don't have the slant serif at the bottom like the "h" and the "m", for example, do. Just noticed the "l" does the same, is there a reason you did those particular letters different from the others?</p>
