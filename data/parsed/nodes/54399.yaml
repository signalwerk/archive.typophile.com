    html: |-
      <p>I don't think the "R" and the "S" need to be based on a more narrow circle than the other circular letters. It might be worth a try to make the top right of the R curve down, instead of drop off. Also, maybe incorporate your slanted serif/terminator strokes into the R and S. Just my 2 cents.</p>
      <p>It's like blackletter meets Futura! I like it.</p>
