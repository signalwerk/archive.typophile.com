    html: |-
      <p>A just short of half of the white on the baseline closer to K. This also implies a bit more space between A and D.<br>
      That should do the trick.</p>
      <p>(Kerning is balancing the area's between the glyphs. Consider the white space between M and I &amp; between A and D — these should be identical. That's two pairs fixed. Now try the same with the other pairs &amp; you'll come to the same conclusion as I have.)</p>
