    html: |-
      <p>I had a visual formula based on viewing through the middle of the line.<br>
      Imagine a basic unit of space being a 1 unit. Vertical letters next to each other is 1 unit of space. A round to a vertical letter would have 3/4 of the unit and round to round would be 1/2 of the unit. Just determine how wide 1 unit is.</p>
