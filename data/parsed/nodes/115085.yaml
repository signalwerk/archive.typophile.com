      <p>Just to help you along. The u and n are in a style called uncial -- from the latin word “uncus” meansing hook-shaped like a beak or talon. Two fonts have very nice u and n shapes that could be adapted to your project. English Garden SG <a href="http://www.myfonts.com/fonts/spiecegraphics/english-garden-sg/" title="http://www.myfonts.com/fonts/spiecegraphics/english-garden-sg/">http://www.myfonts.com/fonts/spiecegraphics/english-garden-sg/</a>  and Testament CT <a href="http://www.myfonts.com/fonts/canadatype/testament/" title="http://www.myfonts.com/fonts/canadatype/testament/">http://www.myfonts.com/fonts/canadatype/testament/</a><br>
      Don</p>
