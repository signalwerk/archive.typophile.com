    <p>Hey everyone,</p>
    <p>can you help identify the fonts used on the Infosys  (<a href="http://www.infosys.com/">http://www.infosys.com/</a>) website for the headlines and the company logo?</p>
    <p>I tried to put it into identifont but the closing thing it could come up with is Lucida Sans, which I guess looks like it except this font is much more narrow.</p>
    <p>The logo font I have no idea because some of the letters connect with each other a little bit.</p>
