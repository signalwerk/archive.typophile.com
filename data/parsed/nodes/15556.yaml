      <p>That's roughly what I suspected. That they deliberately <em>didn't</em> use the original oblique is interesting, but disappointing.</p>
      <p>As far as the part about Adobe using a slanted version to begin with, that was their standard method in the early days with all sans serifs. No doubt it saved memory in the early PostScript laser printers and imagesetters and was considered a neat and practical compromise. </p>
      <p>On the other hand, it is ITC's design. Why should they follow Adobe's lead on what it should look like? Like I said in my Typographica post, ain't what ITC used to be.</p>
