      <p>I'm back from my meeting with next year's TypeCon planning committee with Tamye Riggs and Allan Haley.</p>
      <p>I had the chance to take Allan aside and show him the posts on ITC Avant Garde Gothic found on Typographica's forum.</p>
      <p>Allan said that Monotype Imaging had discussed the oblique versions for a long time, and in the end, it came down to two main considerations:</p>
      <p>1- They felt that the Adobe versions of AGG Oblique had become the <em>de facto</em> standard, thus the Pro version would be consistent; and</p>
      <p>2- Developmental expenses.</p>
      <p>OK, that's fair enough. How many designers are still setting with digitized versions of the 1977 release. But why did Adobe decide on slanted versions in the first place? Any insights anybody?</p>
      <p>(BTW -- Allan's comments to me was his sincere explanation of reasons for corporate decisions and should not be considered as an "official statement" by Monotype Imaging on the issue.)</p>
