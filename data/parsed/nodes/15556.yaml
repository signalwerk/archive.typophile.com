    date: 2005-10-22T13:47:00
    date_raw: 22 Oct 2005 — 1:47pm
    votes: null
    html: |-
      <p>Mark wrote:</p>
      <p>"As far as the part about Adobe using a slanted version to begin with, that was their standard method in the early days with all sans serifs. No doubt it saved memory in the early PostScript laser printers and imagesetters and was considered a neat and practical compromise."</p>
      <p>This is absolutely dead on. Remember, ITC Avant Garde was one of the original 35 PostScript Type 1 fonts.</p>
      <p>Si wrote:</p>
      <p>"On the one hand part of the reason for adding ‘std’ and ‘pro’ to font names was to reinforce the “no guarantee of backwards compatibility” message - so ITC could have broken with the past on a pro font."</p>
      <p>Very true. </p>
      <p>"However in reality the re-issued Adobe fonts are mostly mergings of the existing Type 1 fonts with only a few extensions. So ITC’s treatment of AG really isn’t any different from the Adobe re-issues."</p>
      <p>If you look at the entire Adobe Type Library, this is true. But every typeface with "Pro" in the name had its character set extended. And if you look at Adobe Originals, most of them got reworked, many of them extensively. Notably for this discussion, Cronos Pro got the italic completely redone. Adobe Garamond, Minion, Myriad and many others got some revisions. We treated our real flagship typefaces with great care.</p>
      <p>Amusingly, our OpenType "Standard" version of ITC Avant Garde is based on the Avant Garde MM outlines, rather than the single-master outlines. So we were already not worrying about matching the old one that most people know.</p>
      <p>That being said, these things are a lot of work, and as digital type users were already used to the mechanically slanted obliques for ITC Avant Garde (which Adobe popularized), I can understand why ITC/Monotype didn't want to spend the substantial work to redraw them.</p>
      <p>Si also wrote:</p>
      <p>"Fortunately Adobe has extended the rules of the game with Garamond Premier Pro, which leaves the door open for a “Premier Pro AG” at some point in the future. :-)"</p>
      <p>Huh? Please understand that Garamond Premier Pro has exactly three things in common with Adobe Garamond: it's a Robert Slimbach design, a revival of Garamont's romans and Granjon's italics, and it's an Adobe Original. But it is a completely different design, and otherwise unrelated to Adobe Garamond - not an updated version of it in any way.</p>
      <p>Cheers,</p>
      <p>T</p>
