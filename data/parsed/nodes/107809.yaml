    <p>Hello, I am looking for an alternative to Acid by Stephen Baum. I realize it is an incomplete work in progress and I'd really like access to more glyphs.</p>
    <p>I really like how this type has a clean, scientific almost medicinal, sterile feel to it. I like how it is very geometric as well. Please if anyone has any alternatives to this typeface it would be awesome if you could share.</p>
    <p>Extra credit if you can find me one with a web-font alternate as well.</p>
    <p>You can find Acid here:</p>
    <p><a href="http://26plus-zeichen.de/fonts/acid-type/" title="http://26plus-zeichen.de/fonts/acid-type/">http://26plus-zeichen.de/fonts/acid-type/</a></p>
    <p>Thanks for the help!</p><div class="imageWrap"><img src="http://typophile.com/files/fonts-148_6058.jpg"></div><p></p>
