  html: |-
    <p>"Simeon Out West" is the foundry name for fonts by Brett T. Johnson. </p>
    <p>Brett T. Johnson began with Latin alphabet fonts based on letter forms from hand-lettered Eastern Orthodox manuscripts. Additional fonts are based on Egyptian Coptic lettering. Most, if not all, also contain a full set of Cyrillic letters.</p>
    <p>Simeon Out West sells fonts through <a href="http://www.myfonts.com/browse/foundry/simeonoutwest/" rel="nofollow">myfonts.com</a>.</p>
    <p>Available fonts include:<br>
    	Svati Nikolai<br>
     	Muscovite Manuscript<br>
     	Pravoslavnie<br>
     	Kniga Molitva<br>
     	Suzdal<br>
     	Vladimir<br>
     	Thebes<br>
     	Alexandria<br>
     	Scetis</p>
