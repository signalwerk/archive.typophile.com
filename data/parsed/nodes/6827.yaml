    html: <p>Another close approximation could be <a href="http://www.myfonts.com/search?search[text]=koloss">Koloss</a>. <br> <br>There are also a couple of free versions (which I don't believe are rip-offs, just different digitizations) -- one by <a href="http://moorstation.org/typoasis/designers/steffmann/index.htm">Dieter Steffmann</a> and also "Phat Phreddy" by <a href="http://moorstation.org/typoasis/designers/curtis/pages/p.htm">Nick Curtis</a>.</p>
