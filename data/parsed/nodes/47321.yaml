      <p>I think the S is more closed than Avenir's, but not as much as Helvetica/Arial. With that said, these letters are not the best for ID purposes, because there may be too many candidates. Maybe that's the good news, because it would be hard to prove them wrong.</p>
      <p>For the sake of argument I will pick <a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?pid=406034&amp;grab_id=0&amp;page_id=35232&amp;query=Felbridge&amp;SCOPE=Fonts" rel="nofollow">Felbridge Bold</a> and say that it would match if you just widened it a bit. The truth is it could probably be many fonts, with no other letters for comparison.</p>
      <p>- Mike Yanega</p>
