      <p>I think the S is more closed than Avenir's, but not as much as Helvetica/Arial. With that said, these letters are not the best for ID purposes, because there may be too many candidates. Maybe that's the good news, because it would be hard to prove them wrong.</p>
      <p>For the sake of argument I will pick <a href="http://Felbridge Bold" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Felbridge Bold</a> and say that it would match if you just widened it a bit. The truth is it could probably be many fonts, with no other letters for comparison.</p>
      <p>- Mike Yanega</p>
