  html: |-
    <p>This is my first post here, so go easy on me! ;)</p>
    <p>I design live events and have been searching for a font to replace <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/itc-edwardian-script/" rel="nofollow">ITC Edwardian Script</a> for a while now. It gets used for a lot of awards shows, but it doesn't hold up well on projection, especially when it's been animated in Powerpoint.</p>
    <p>So, I'd like to find an elegant awards font that's legible (no small x-heights, please) and not excessively florid or italic or condensed. The thin strokes should be thicker than 1pt. </p>
    <p>I thought I had found a winner today with <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/lily-wang/regular/" rel="nofollow">Lily Wang</a> but on closer inspection, it's too "grunge"/rough. I may go with<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/script-bq/medium/" rel="nofollow">Berthold Script Medium</a> for this template to see how it flies (of course, it would still have to be approved by the client, so it may be back to Edwardian)</p>
    <p>And finally, the font would have to have the full character set as this awards show will also be in French.</p>
    <p>I know, not asking much, am I? Thanks in advance for your advice and suggestions!</p>
