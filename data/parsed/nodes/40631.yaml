      <p><a href="http://www.fontshop.com/fonts/singles/monotype/bickham_script_pro_bold/" rel="nofollow">Bickham Script Bold</a> might have the stroke weight to hold up, but it doesn't have a large x-height. </p>
      <p><a href="http://www.fontshop.com/fonts/singles/emigre/dalliance_script/" rel="nofollow">Dalliance Script</a> is far more interesting than the others, but maybe <em>too</em> interesting.</p>
      <p>And here's <a href="http://www.fontshop.com/fontfeed/archives/bold-formal-scripts/" rel="nofollow">a list of formal scripts that have heavier weights</a>. Ballantines or Sloop seem like good candidates for your needs.</p>
