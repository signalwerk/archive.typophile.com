    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Franko Luin</strong></p>
    <p>Born to Slovenian parents in Trieste, <a href="/wiki/Italy" class="freelinking" rel="nofollow">Italy</a>, in 1941, Frank Luin immigrated to <a href="/wiki/Sweden" class="freelinking" rel="nofollow">Sweden</a> in 1961. He died in Tyresö on September 15, 2005, at the age of 64.</p>
    <p>After studying at the Grafiska Institutet during the 1960s, Franko Luin spent two decades honing his skills as a print designer for Ericsson before branching out on his own. He spent much of the 1990s perusing two passions: multimedia and typeface design. In 1996, he founded his own typographic studio, <a href="/wiki/Omnibus%20Typografi" class="freelinking" rel="nofollow">Omnibus Typografi</a>. That same year, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> began distributing his fonts, which rank among the 20th Century’s most remarkable digital revivals of classic typefaces like <a href="/wiki/Caslon" class="freelinking" rel="nofollow">Caslon</a>, <a href="/wiki/Baskerville" class="freelinking" rel="nofollow">Baskerville</a>, and <a href="/wiki/Bodoni" class="freelinking" rel="nofollow">Bodoni</a>. Although he played a withdrawn role in the international community of type designers, his work is sure to remain an inspiration for decades. In addition to this visual legacy, Franko Luin was proactive as an influence on future generations of designers, for instance he engagingly led a course in Web Typography at the <a href="/wiki/Berghs%20School%20of%20Communication" class="freelinking" rel="nofollow">Berghs School of Communication</a> in <a href="/wiki/Stockholm" class="freelinking" rel="nofollow">Stockholm</a>.</p>
    <p>A third passion of Franko Luin’s was <a href="/wiki/Esperanto" class="freelinking" rel="nofollow">Esperanto</a>, which he began learning at age 15. His involvement in Esperanto organizations even acted as an inspiration for his design work—he named a type family after the language in 1993.</p>
    <p>More information about Franko Luin and his typefaces is available at<br>
    <a href="http://www.linotype.com/7-1527-7/frankoluin.html" title="www.linotype.com/7-1527-7/frankoluin.html">www.linotype.com/7-1527-7/frankoluin.html</a> and at <a href="http://www.omnibus.se" title="www.omnibus.se">www.omnibus.se</a>.</p>
    <p><a href="http://typophile.com/node/16293" rel="nofollow">Franko Luin (1941-2005)</a></p>
