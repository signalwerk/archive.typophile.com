    html: <p>Wise words from Mr. Lew. <br> <br>Just don't use ITC Stone <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I agree with Hrant, there's something really fishy with those pulpy terminals. I designed a book last year and ITC Stone was forced upon me by the corporate style manual. And to top it all off, I had to use Helvetica for headlines! Me, using ITC Stone <i>AND</i> Helvetica on the same job! Argh... (The book was a success though. Oh, the irony of it all.)</p>
