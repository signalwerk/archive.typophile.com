  date_raw: 12 Feb 2003 — 1:36pm
  date: 2003-02-12T13:36:00
  votes: null
  html: "<p>I'm doing what in some ways may be my first \"real\" typographic job - the layout of a 194-page book.  I could use some suggestions for typefaces. <br> <br>Subject: herbal remedies and \"high-tech\" aromatherapy techniques <br> <br>My client wants a \"modern and high-tech\" look, which I will achieve partly through layout and secondary fonts. <br> <br>Text fonts I'm currently considering include: Scala, Raleigh, Stone, Minion, Apollo <br> <br>I would consider others, but price may be an issue if a given font is expensive for my client. <br> <br>Any recommendations or analyses of these fonts' strengths is appreciated. <br> <br>Paul</p>"
comments:
  - id: 59759
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 12 Feb 2003 — 1:45pm
    date: 2003-02-12T13:45:00
    votes: null
    html: <p>Scala is OK, although overused. <br>Don't use Raleigh or Stone. Please. <br>Minion is boring (except if you're gonna milk its MM axes). <br>Apollo is an interesting departure, but too stodgy here. <br> <br>To me "modern and high-tech" implies a certain honest, rigid feel, so I would go with a wedge serif design, like FF Zine, Foundry Form Serif or FF Olson. If your text will be smallish, consider Swift as well. <br> <br>hhp <br></p>
  - id: 59760
    user_id: 1258
    user_name: capthaddock
    user_path: null
    user_image: null
    date_raw: 12 Feb 2003 — 2:40pm
    date: 2003-02-12T14:40:00
    votes: null
    html: <p>I love Avance and I like Olsen.  I don't own either font, so I'd have to buy them, and the Olsen package doesn't come with an italic (I'd have to buy the $130 Olsen Italic package just for the one font). <br> <br>Hrant, why don't you like Raleigh or Stone? <br> <br>Paul</p>
