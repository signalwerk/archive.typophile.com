  - id: 148214
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    user_image: /files/pictures/picture-103.gif
    date_raw: 12 Feb 2003 — 3:10pm
    date: 2003-02-12T15:10:00
    votes: null
    html: <p>Think I figured it out. I dislike the lighter weights of   <br><a href="http://www.on-idle.com/foundry/foundry_form_serif/formSerif.html" target="_blank">Form Serif</a> for the same reasons why I dislike those of   <br>Berthold's <a href="http://www.bertholdtypes.com/bq_library/090160000.html" target="_blank">Corporate A</a>. It's just too delicate and   <br>mechanical at the same time.   <br>  <br>And the heavier weights look like they were interpolated  <br>by some unhuman font-o-matic machine. <br> <br>If Stone is too mushy, Form Serif is too cold.</p>
