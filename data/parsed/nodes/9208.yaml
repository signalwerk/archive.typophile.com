    date_raw: 8 Apr 2003 — 10:14pm
    date: 2003-04-08T22:14:00
    votes: null
    html: <p>I realize that this suggestion probably comes too late to help you on this project, but give some consideration to Mendoza Roman as well. Use Linotype's version -- it's more complete, and includes small caps and old-style figures.  <br>  <br><a href="http://www.myfonts.com/fonts/linotype/itc-mendoza-roman/" target="_blank">http://www.myfonts.com/fonts/linotype/itc-mendoza-roman/</a>  <br>  <br>It's an elegant font that has a nice, clean look.  <br>  <br>And it's French, which is sort of like Canadian. ;) (And yes, I love French Fries and French Toast, thank you very much, U.S. Congress notwithstanding. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> ) <br> <br>David</p>
