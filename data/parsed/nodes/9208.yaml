    html: "<p>M'sieur Porchez: Yes, maybe I should consider a Canadian face.  That's one reason I considered Raleigh in the first place. <br> <br>I don't think any of Hudson's faces would work for this project. <br> <br>As for Shinn's work (<a href=\"http://www.shinntype.com\" target=\"_blank\">http://www.shinntype.com</a>), I would consider Goodchild or Beaufort, but I don't know what either looks like in text blocks.  Too bad his quirky Richler isn't for sale. <br> <br>Maybe I should use Cartier, my favourite Canadian typeface. <br> <br>Paul</p>"
