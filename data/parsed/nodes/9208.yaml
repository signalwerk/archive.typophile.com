    html: <p>admitting it's a bit more classical, why not   <br>consider <a href="http://www.philsfonts.com/showing.html?sku=FF011178X1P2&amp;start=1">Seria</a> in place of Scala. it was   <br>designed specifically to correct aspects of  <br>Scala that were less effective in extended  <br>text settings. Hrant will likely take issue with  <br>its nearly upright italic, but I understand a  <br>more slanted version is in the works  <br>(besides, it works just fine as it is, IMO).</p>
