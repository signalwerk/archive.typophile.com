  - id: 59768
    user_id: 1215
    user_name: kentlew
    user_path: null
    user_image: /files/pictures/picture-1215.gif
    date_raw: 13 Feb 2003 — 5:07am
    date: 2003-02-13T05:07:00
    votes: null
    html: "<p>I have to point out that this sort of thing is a little like going on-line and saying \"I have a fever, my throat is sore, and I have small rashes on my skin. What would you guys recommend that I take for it?\" Beware any diagnosis over the internet. <br> <br>Obviously, there's a lot more to choosing a book face than just what looks interesting. And without a lot more details about the book brief ('modern and high-tech' are very vague terms and could mean a lot of different things to different people, including your client, these suggestions are only stabs in the dark. <br> <br>Nevertheless, let me offer my two cents' worth: <br> <br>Scala has turned out to be a decent face in books. It's spareness gives a character that many would characterize as contemporary. As Hrant points out, the downside is that it is a bit heavily exposed right now -- but that's not really a primary consideration in book text. I have found it tricky to pair a good display with it because of it's idiosyncracies. And although I've considered it for a couple jobs before, I've yet to actually decide to use it. <br> <br>Stone and Minion are both solid workhorses. I've used both with success. (I just finished a book with Stone). But I suspect neither is unique enough to give the character that your client seems to be requesting. <br> <br>Apollo is a good text face, although I find setting it requires a little more care in handling. Utopia and Kepler both set well right out of the box. Although all three are more unique, uncommon choices, I don't think any of these are going to give the character you want. I think they're all a little too soft and classical in feeling for what you're describing. Apollo feels very oldstyle and usually gives a delicate text. Utopia yields a fairly dark setting and seems a bit too squarish for what I think you might be after -- it seems better suited to manuals and textbooks than trade books. Kepler is a nice readable Didone, being a more jovial take on the class, but I don't think it is sharp enough to convey \"modern, high-tech\" (whatever that actually means).  <br> <br>I haven't worked with Avance or the other FF faces mentioned, so I can't speak from direct experience. I think Avance might make a nice text, but it does seem a little congenial for your title. I don't think I could advise either Olsen or Zine as book faces. Olsen is very monotone and the x-height seems too large for extended text; I'm sure it's a fine 'jobbing' face. Zine looks interesting, but I only see a Display cut, which is too narrow for book text in my opinion. (I hope Sch</p>"
