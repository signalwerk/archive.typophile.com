      <p><cite>Oft times I see the difference as being street comes with the dot and saint without.</cite></p>
      <p>There are different style conventions using periods (full stops) with abbreviations in English. British style tends to put periods when a word is simply cut off at the point of abbreviation, but not otherwise. So this could be the reasoning:</p>
      <p>Street → St____ → St.<br>
      Saint → S___t → St</p>
