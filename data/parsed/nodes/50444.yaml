      <p>I'm with Jongseong on this one – I'd tend to go for Saint – St and Street – St. . As for the missing apostrophe, In English place and institutional names, there are a number where the apostrophe was never there at all, or has been lost over time – for example St Martins College or St Andrews University. As always in the wonderful, rich, growing English language, it's best to double check...</p>
