      <p>Well, as it is I have been thinking lately about using a centred low dot as a kind of doubling sign. In this case the second example (South Street) would warrant that dot, because there is a final T and an intermediate T in the word Street.<br>
      In the same sense Saint would NOT get a low dot.</p>
      <p>Now for some typedesigners to program their OT-fonts to do this (and the gods-who-are-writing-up-the-unicode-database to implement it too).</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
