      <p>Luckily the french use 'Ste-' are their abbreviation for Saint... Saint David would be Ste-David.</p>
      <p>Here in Canada, we often just use St for Saint and Ste for the french. I doubt anybody would notice if somebody used a '-' in english usage.</p>
      <p>St-James St. would read as Saint James Street, and I don't think you could mis-read that.</p>
      <p>More often than not though, on a street sign you might find 'rue St-James St.' which would be bilingual.</p>
      <p>French only would read 'Rue Ste-James'</p>
