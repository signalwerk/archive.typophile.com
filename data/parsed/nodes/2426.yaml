  html: "<p>Article about \"Euroface\" at Mr. Bil'ak's site: <br> <br>\"The research included continuing reevaluation of existing  <br>type designs (Helvetica, DIN Schriften, Universe etc.) The  <br>results are revealing. For instance: Helvetica failed in all the  <br>laboratory tests, obtaining only 0.4 ISRU. Consequently, the  <br>European Committee for Uniformity of Type Design and  <br>Type Safety decided to abolish Helvetica for the 21 century  <br>as absolutely non-functional and dangerous for the new <br> generation. As we have emphasised, this total systems  <br>viewpoint is necessary in order to avoid proliferating design  <br>which, whilst independently effective for regional problems,  <br>conflict with the current overall system.\" <br> <br><a href=\"http://www.typotheque.com/articles/euroface.html\" target=\"_blank\">http://www.typotheque.com/articles/euroface.html</a> <br> <br>hehehe. Helvetica is dangerous for the new generation! </p>"
