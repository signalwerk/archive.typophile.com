      <p>Christoph’s Heimat Sans is one of those rare gems that can set your brand apart, if you dare. It’s certainly not overused, but it is an awesome design. Most other "experimental" sans serifs just employ a cheap trick and leave it at that. This on the other hand … It could work especially well if you pair it with one of his other more muted designs (like the prev. poster suggest.)</p>
      <p>That said, be careful when selecting fonts for text on the web. The quality varies.</p>
