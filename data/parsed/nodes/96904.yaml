    <p>Hi Typophiles,</p>
    <p>I'm currently designing a brand for a corporate client, in the vein of the new Avois or Eurostar brands. It's shiny, fast, car badge-esque etc,  but not so much that it shouldn't appeal to a family friendly/female market, and I need suggestions for a corporate font. Criteria includes: </p>
    <p>- Must be by a reputable foundry<br>
    - Not be overused already (my biggest problem)<br>
    - Be fairly recent (in the last 2-4 yrs?)<br>
    - Available from MyFonts as a webfont or TypeKit<br>
    - Have enough quirks to be used as a header font but also for text (not essential - if its not suitable for text we can specify a second font)<br>
    - Contain multiple weights and italics<br>
    - Price range is up to about $50-60 AUD<br>
    - Stylistically in the vein of Klavika / Clio / Square sans / Rubrik (Newlyn) / FS Joey etc<br>
    - If possible with half rounded terminals, i.e., going to a point on one side and not the other. See attached for an example. Again, not essential!</p>
    <p>I know this is a lot to ask, but any help would be much appreciated! Thanks in advance guys.<br>
    Matt</p>
