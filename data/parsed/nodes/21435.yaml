    <p>Hello everyone,</p>
    <p>I am working on a logo project for an non-profit organization that will help less fortunate people (mostly children) have musical instruments to learn on. Any ideas on a font or fonts that may have the feelings of children and/or music would be greatly appreciated.</p>
    <p>Thank you in advance,</p>
    <p>Duncan Robertson</p>
