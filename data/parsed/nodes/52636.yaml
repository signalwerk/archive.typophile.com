    html: |-
      <p>This is pretty good. Granted, I'm not a big fan of the square bodied sans (with some exceptions), but for one of that genre it stands up well.</p>
      <p>The space inside some of the ligatures is kind of tight, and I don't think making ligatures off the arm of the "r" is such a good idea. I know that r makes a big negative space that wants to be filled, but doing so makes it hard to recognize. Some end-user might even foolishly kern the r too close to the n in an attempt to make it match the other r ligatures, which would result in a shape indistinguishable from the m.</p>
