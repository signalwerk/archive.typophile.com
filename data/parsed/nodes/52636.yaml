    html: |-
      <p>Thanks for commenting cerulean!</p>
      <p>The isolated s has terrible hinting, and even though I tried hard to fix it (it was even worse before), it still looks bad, especially on small sizes. I guess this is why you suggested changing it, right? It doesn't actually look that bad... If only I figure out how to correctly hint it...</p>
      <p>Thanks to your comment, I noticed that actually, the double (triple, etc...) esses don't have the same distance from the joining stroke (it's very apparent on the logo), which increases the effect that you mentioned. I'll add that to the list of things I need to fix (together with cuttlefish's suggestion), thanks. :) I can't ditch them completely though, especially for them I considered the readability issue a lot since they are in the logo too, designed LOTS of alternative joins (more than 20 I think!) and finally decided to go with looks on this particular one (by the way, the logo in the demo picture is a mix of contextual alternates and a ligature, not a copy-paste of the original one. In the actual logo, the esses have equal distance from the joining stroke). Its the only glyph (actually it consists of more than one, but that's a technicality) that I have given so much thought about, and designed so many alternatives, so I won't ditch it, sorry. Tell me to change anything in the font, any glyph, any metric, just not my beloved esses (and the ff ligature), these are my favorites! :'-(</p>
