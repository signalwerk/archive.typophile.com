    html: |-
      <p>It's the "re" combination that stands out the most to me. It's not entirely illegible, but it is odd, the combination not quite being readable as the letters separately. </p>
      <p>Besides, there's also my pet peeve about a "rn" couple getting slightly overinked or kerned too close and becoming an "m", a problem I've seen happen with many font. I'm mentioning it in hopes you can take steps in the design to prevent that sort of collision.</p>
