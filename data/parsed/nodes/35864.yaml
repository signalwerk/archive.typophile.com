      <p>EDIT: This post should be the one before last, not the last. My typo-editing shoved it to the end of the thread, sorry. </p>
      <p>To be honest: Everything digital can be copied and spread all over the internet. So every font, too, of course. But if you find a commercial font fro free download somewhere means someone has stolen it. It's like finding a wallet in the streets with the address in it. Of course you could keep it, and spend the money. But that means you become a thieve, too. </p>
      <p>The better solution is to purchase the font, sleep well at night and be sure to have supported at least one of the typedesigners guild. Only with this behaviour one can be sure that tomorrow will be some new typefaces.</p>
