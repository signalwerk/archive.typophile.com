    <p>Hello everyone! I just downloaded some custom DVD covers for Buffy the Vampire Slayer, and I realized that I need to make another one to hold some of the bonus discs I have. I want to make it uniform with the other seven I have downloaded, though, so I need to use the same font. The problem is, I don't know what font it is! I thought it was Morpheus at first but there are quite a few differences from this font to that one (different J's, different M's, etc.) so I decided to come to you guys, the experts, for help.</p>
    <p>I took a screenshot of the font and you can find it here:</p>
    <p><a href="http://smg.photobucket.com/albums/v65/aero_ziggy/?action=view&amp;current=BuffyFontHelp.jpg">http://smg.photobucket.com/albums/v65/aero_ziggy/?action=view&amp;current=Bu...</a></p>
    <p>Thanks!</p>
