      <p><em> Once I add serifs, I figure this contrast between busy and boring letters might be easier to balance out.</em></p>
      <p>The potential flaw in this argument is that you're also making the busier letters even busier, since they're getting serifs, too. (And letters like o and e remain as "boring" as originally, so arguably you're *increasing* the range of busyness.) </p>
      <p>I agree with Hrant, the one-story g is one of the more likable letters in the original font; seems to me like you're struggling to find a solution to a problem you don't need to have.</p>
      <p>It's also a good point to think of a target size for this. That would help decide whether and what size serifs, I imagine.</p>
