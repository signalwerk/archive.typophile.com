      <p>Danke für den Kommentar! Handzeichnen hab ich jetzt erstmal aufgegeben – ich bin da einfach zu langsam, zu obsessiv und zu ungenau. Von Baldinger kam das weniger mit dem Handzeichnen, er arbeitet meines Wissens eher digital, während Hunziker (die beiden unterrichten den Projektunterricht gemeinsam bzw. abwechselnd) sehr vom Handzeichnen her kommt. Gemeint ist das auf jeden Fall so, dass man intensiv mit Handzeichnungen anfängt, aber am Ende, denke ich, muss ja auch jeder seinen Workflow finden und ich komme da am Screen halt schon immer besser klar (obsessiv bin ich auch da, aber ich verzweifle nicht ganz so schnell ;-) ).</p>
      <p>So just to follow this through in English, I put my sketches on a big pile and actually started building letters in FontLab today – which was hugely liberating! I'm just too brainy sometimes, and tend to agonize over details &amp; decisions forever instead of just trying them out (for which the pen &amp; paper definitely felt like more of a barrier than the screen, even FontLab, is now). I've been playing around, trying stuff, finding some shapes and details I actually (roughly) like, and please forget about that metal face because it's fading into the distance quite rapidly.</p>
      <p>The funny thing is I just re-read this thread, as well as <a href="http://typophile.com/node/50660">the one about the Ss serifs</a>, and what many of you said to me almost two months ago makes perfect sense now. I guess I was just too much in agonizing and brainalyzing mode back then.<br>
      So, I will be back with this … shortly. :)</p>
