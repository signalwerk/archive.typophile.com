      <p>Other options for a two-story g that may be worth considering:</p>
      <p>1) make the upper bowl very small (and not wide) and rely on the lower, enlarged bowl to match the width of the other letters.</p>
      <p>2) an unfinished lower bowl, as can be seen in this <a href="http://www.forthehearts.net/Kulby" title="Click to visit an external URL." class="freelink freelink-external freelink-external">"Kulby"</a> font.</p>
      <p>I have my doubts whether either of these would be workable stylistically with the existing alphabet, but you may want to play around with them.</p>
