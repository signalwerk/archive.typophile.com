      <p>Jörg,<br>
      Unfortunately, Basel is pretty much dead (or hibernating, hopefully), type design wise.<br>
      Closest from Basel is the type design course in Zurich (<a href="http://vvk.zhdk.ch/castypo.html">Website</a>), which is part-time (berufsbegleitend); it takes place on two days (Fri/Sat) every two weeks for two semesters (10 months or some such, from September to June or July). I only started about a month ago, so I can't say too much yet except that it's really good, although you'd likely learn even more if you can do a full time course (Reading or Den Haag).<br>
      Let me know if you have any more specific questions, I'll be happy to answer them :)</p>
