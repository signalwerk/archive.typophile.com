      <p>Concerning the "g", huh. I must say that, and I feel quite unprofessional saying this, Kabel gives me the creeps. Seriously – that is one g I cannot stand looking at, so chances are pretty slight I'm going to use it. ;) To use a more serious objection, it is very constructed and I'm trying to get away from the geometric model a bit. (I know Koch has used the same principle for the "g" in other fonts that aren't as geometric, so there goes this line of argumentation, but I still can't stand it.)</p>
      <p>I'll try your second suggestion tomorrow (it's 1am here, so no more work today), that sounds interesting, although I can't quite picture it yet.</p>
      <p>Regarding the original "g", that's quite interesting. It was one of my favorite letters from the beginning. Apparently it is also so distinctive that people either love it or hate it. Most people I've shown the original sample have commented on the g very quickly and in very extreme ways, favorable or not. So I'm not sure this g should be the default g at least – also because it is distinctive in a way that recalls its historical roots (it feels very Jugendstil to me).<br>
      I will definitely try and see how it works, though.</p>
      <p><em>Also, if you maintain that huge x-height, you need to either shoot for a display face (tight spacing), or shoot for small sizes (8 and under) and give it more weight.</em></p>
      <p>Aah, unsolved question number one. I kind of like that extreme x-height, but you're right in that it does suggest being used for either very large, or very small sizes. And I have to admit that picturing actual uses for this font is totally beyond me at the moment. I guess I have to do some more thinking there. ;-&gt;</p>
