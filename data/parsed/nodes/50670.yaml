      <p>&gt; I decided I would just give the idea a shot of not just copying the sans,<br>
      &gt; but trying to design a slab serif font that would still be based on this<br>
      &gt; one, albeit more loosely.</p>
      <p>Beautiful.</p>
      <p>Concerning the "g" I would try these:<br>
      1) A Koch "g"*, which we don't see nearly enough.<br>
      2) Start the join just left of 6 o'clock (the very bottom of the bowl), keep the join short**, and make the end of the tail overshoot the join on the left.</p>
      <p>* <a href="http://www.myfonts.com/fonts/adobe/kabel/book/opentype-ps/386937/character/0067/CP2/1/">http://www.myfonts.com/fonts/adobe/kabel/book/opentype-ps/386937/charact...</a></p>
      <p>** And probably make it angular.</p>
      <p>That said, the form in the original is charming and distinctive, so I might go with that monocameral form, especially if this is a display face (see below). Emancipation is one thing, shunning is another.</p>
      <p>Also, if you maintain that huge x-height, you need to either shoot for a display face (tight spacing), or shoot for small sizes (8 and under) and give it more weight.</p>
      <p>hhp</p>
