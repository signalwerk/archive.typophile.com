      <p>Hrant said, two and a half months ago:<br><em>Concerning the “g” I would try these:<br>
      1) A Koch “g”*, which we don’t see nearly enough.</em></p>
      <p>The craziest thing just happened.<br>
      You know how it is when you hate spinach as a kid, &amp; then avoid spinach for years and years until at some point, you get into this awkward situation where you just can't refuse it – and then you realize it's actually really, really good! And then of course, you've missed half a lifetime of spinach.<br>
      I had that with the Kabel g last night. Totally crazy. That is one wild and wicked g! And here was I thinking all the time that it was 'ugly', just because it was different. Very, very strange.<br>
      (I hope that doesn't happen with the Rotis e, otherwise I'll get worried.)</p>
      <p>I started making g's at some point last night, and next thing I knew it was morning. (-:  I now have seven different g's; I think two or three of those may be usable (though of course they're not uh, final yet). I actually really like the Kabel-based ones (although I still have to figure out how to make them look less like Kabel itself).<br>
      Yeeh, I did Souvenir too. More for fun and to try out more variants&nbsp;… It's, uhm, enormous.</p>
      <p>Oh, I lengthened the ascenders and descenders. Considerably.</p>
      <p>Will post the complete lc alphabet, hopefully, within the next few days (m, v, w, x, y, &amp; z are still missing). Until then, here are a few g's.</p>
      <p><img src="/sites/default/files/old-images/gagging_3503.jpg"></p>
