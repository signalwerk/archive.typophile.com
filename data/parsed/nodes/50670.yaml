      <p>&gt; people either love it or hate it.</p>
      <p>As Spiekermann has expressed many times (concerning the "g" in Meta) that's often exactly what you want! When people argue about something, that's superb free publicity. And love* from a minority is much better than tepidity from a majority. Dieu vomit les tiedes.</p>
      <p>* Which I personally believe cannot exist without hate.</p>
      <p>&gt; picturing actual uses for this font is totally beyond me</p>
      <p>The more experience you have, the more that's OK, because your instincts can tell you if something is viable if your logic is unwilling. In your case, even though your speedy progress seems impressive, I would suggest deciding which way to go before doing too much more work. Making an interpolated weight range and postponing the decision on the final weight(s) is often a great idea, but spacing does affect the ideal letter bodies greatly.</p>
      <p>hhp</p>
