    html: <p>aargh. ok. i will have to open the wallet one more time for foglamp. don't wanna lose all the stuff since way back. seems a hassle to find an old komputter with fog and generate a font, plus transfer it to my new laptop every time for every font. i am just going to start working on yet another weight to malmo sans... thanks guys</p>
