  html: |-
    <p>I work in the library for the College of Design, Architecture, Art, and Planning (DAAP) at the University of Cincinnati and was approached by my boss, the head librarian, who asked me to identify the font used in an email she received. She thought that I would be interested in the hunt because I am a graphic design student. However, I have exhausted my resources and cannot figure it out. Any help would be greatly appreciated.<br>
    Thank you.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/whatfont_5758"></div><p></p>
