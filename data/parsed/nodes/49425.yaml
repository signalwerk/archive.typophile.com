    html: <p>I don’t think you’ll find a digital font that matches this perfectly as the forms were probably created specifically for these letters. Helvetica comes close, as would many in <a href="http://fontfeed.com/archives/helvetica-and-alternatives-to-helvetica/">this list</a>.</p>
