    <p>Hi there.  I was referred to this forum by a friend; I’m trying to find a certain font.</p>
    <p>You know how whenever you went to the skating rink or the carnival, the snackbars would always have backlit signs with plastic letters that looked like this:</p>
    <p><a href="http://i304.photobucket.com/albums/nn191/codytebaldi/menuboard.jpg" title="http://i304.photobucket.com/albums/nn191/codytebaldi/menuboard.jpg">http://i304.photobucket.com/albums/nn191/codytebaldi/menuboard.jpg</a></p>
    <p>Is there a font I could obtain which is identical to this lettering style?  Helvetica looks close, but I’m not sure it’s a 100% match.  Perhaps someone a bit more studied in typefaces could identify the font?</p>
    <p>Thanks in advance...</p>
