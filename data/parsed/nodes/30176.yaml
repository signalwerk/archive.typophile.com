    <p>I like to make mine with five points, but in most fonts I see them done with six. Conceivably seven could work, but eight or four wouldn't in most cases. Three might, though.</p>
    <p>What do you think about <a href="/wiki/asterisk" class="freelinking" rel="nofollow">asterisks</a>?</p>
