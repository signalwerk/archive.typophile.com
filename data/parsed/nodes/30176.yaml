    html: |-
      <p>I always felt 5 did the trick.<br>
      When the font is well thought-out - normally the asterick has been as well.</p>
      <p>One of the ugliest I ever came across was a font named Caledo - it was Alphatype's version of Caledonia. It was one of the three characters they changed to call it a new font. They made an 8-pointed mess of it. I did find great use of it one day. Ballantine Books had one of their "Inspirational" book covers to design and they needed a dingbat to separate the author and title on the spine -- I gave them Caledo's asterick - it was the only place I could ever see it be used.</p>
      <p>Glad others think along these lines. You know - the regular people out there would consider us all nuts...</p>
