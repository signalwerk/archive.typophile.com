      <p><cite> Well, I’d vote for 6 pointed, since it’s easier to hint in TrueType, in very small display sizes. </cite></p>
      <p>Ihad wondered about this but then I saw you they did 5 pts in Myriad &amp; I wasn't so sure. Can you give an example? </p>
      <p>I had a quick go looking at who does what: </p>
      <p>6: Univers, FranklinG, Interstate, Udo, Petras Script<br>
      5: Quadraat Sans, Legato, Lutz Headline, Meta, News Gothic, Ronnia, Tiptoe Toy, Azdindenz, Wunderlich, Clan,</p>
      <p>As much as you can draw conclusions there seem to be exceptions. Maybe it's just my skewed sample set but there seem to be far more 5 than 6... And newer fonts seem to favor 5 points. Looking at petras script made me skeptical about Bringhursts' point since it is far easier to make a 3 stroke hash than to make a star by hand...</p>
