      <p>Nice thread (thanks Simon for the heads-up).</p>
      <p>Surely the number of points -and the orientation- depend on the font. To me a Didone likes 6, vertical. In my own fonts I tend to use a 5, upside down; the latter because the thing needs help doing its job (getting attention). Sometimes an off-kilter one makes most sense. I can even see a 4 making sense - maybe with strongly flaring ends, like that German cross - what's it called again? Hmmm, how 'about a 3?</p>
      <p>The x-height of the font affects these decisions too: when it's big the asterisk can/should be bigger too, which makes a sixer less problematic (in terms of clotting), and reduces the need to make it ask for extra attention (allowing it to be right-side-up).</p>
      <p>&gt; six is more man made</p>
      <p>Hmmm, snowflakes? Some flowers are sixers too.</p>
      <p>&gt; The design of the asterisk may be related to the “f”</p>
      <p>Good point.</p>
      <p>BTW, just like there's an asterism, we should have a special thing for two asterisks - maybe something where they lock together nicely.</p>
      <p>hhp</p>
