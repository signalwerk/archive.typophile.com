      <p>Reference marks in order of use:</p>
      <p>* asterisk<br>
      † dagger<br>
      ‡ double dagger<br>
      § section<br>
      || parallel<br>
      ¶ paragraph<br>
      [<em>'printer's fist'</em>] index<br>
      *** asterism</p>
      <p>Order varies slightly according to sources. You can see why superior figures replaced this system. But what a great make-work project for idle characters, and how quaint!</p>
