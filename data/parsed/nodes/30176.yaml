    votes: null
    html: <p>I've seen quite a lot of 5 point asterisks &amp; in the 3 fonts I've made so far I've made them with 4, 5 &amp; 6 points. I guess it mainly depends on the font &amp; what the designer feels fits it best (as long as it's recognisable as a star).</p>
