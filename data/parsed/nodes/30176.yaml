      <p>Speak for yourself, Chris!  ;-)</p>
      <p>Since the asterisk has represented a star as far back as the Sumerian civilization (some 5,000 years ago), the five-pointed version is so familiar to us.  There's no reason why some other number of points wouldn't work (although I'd vote for an odd number), but when we see something else, it rates low on the comfort scale.</p>
