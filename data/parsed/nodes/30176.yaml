      <p>Looking through some old specimen books, the six-pointed asterisk seems to be most common traditionally, at least 50% more than five pointed ones. I also saw the occasional oddball with four or eight points.</p>
      <p>I usually make them with six points in my own fonts. I write them that way, too. It takes only three strokes.</p>
