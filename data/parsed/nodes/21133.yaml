      <p><em>Why is it that we say Gutenberg invented movable type (or at least most people say that) when in fact it existed almost 400 years before Gutenberg in China by Bí Shēng?</em></p>
      <p>Different people can independently invent similar processes at different times and places, and it is true to say they both invented these things. Saying that Gutenberg invented moveable type doesn't imply that Bí Shēng didn't, or vice versa. It is generally acknowledged by anyone who knows anything about the history of printing that the Chinese use of moveable type preceded the European, but invented does not automatically mean invented <em>first.</em> At some time in our childhood, most of us invent something that has already been invented by someone else. My niece invented pre-cut spaghetti a few years ago. :)</p>
      <p>The other reason we say that Gutenberg invented moveable type, without making a corresponding reference to the Chinese invention, is that it is Gutenberg's invention, not Bí Shēng's, which led to the development of European typography as we know it and practice it. The invention of moveable type in China is an interesting historical fact, but of no direct significance for westerners; the invention of moveable type in Mainz is a major cultural event that affected pretty much all subsequent western history.</p>
      <p>Gerald, pretty much all scholars -- including Dutch ones -- discredit the Koster claim.</p>
