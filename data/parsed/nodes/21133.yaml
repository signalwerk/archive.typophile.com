      <p>Hi Matthew</p>
      <p><cite>what is really the best system here, and which is more widely used and understood?</cite></p>
      <p>Part of my MA research last year involved a survey of different schemes for type classification; after hitting at least two dozen different schemes I realised that I was working towards a classification of classifications... but as Walter Tracy says in Letters of Credit, <cite>...any classification is simply an aid to study, not an end in itself. Once the student has got the characteristics of the groups firmly in mind and can 'place' any type face without difficulty the actual names of the groups, and their precision and logicality [or lack of it] cease to be important.</cite></p>
      <p>George and William rightfully point out that these differing systems are complimentary rather than exclusive; from where I'm sitting, the old Vox-based system (garalde, transitional, modern et al), although now woefully out of date, is perhaps still the most widely used and understood. Its chief advantage at the time of its inception (1967, BS 2961) was that the nomenclature was roughly equivalent in French, English and German standards. It also serves to remind us that until the 19th century, there was only a pressing need to identify the 'old face' from the 'modern' – and maybe something inbetween, ie, a 'transitional'.</p>
      <p>Bringhursts classification is elegant and has a good rationale, but as you say, it's not readily translatable to the (old?) professors, and as George H points out, it is not entirely flawless. The work done by Catherine Dixon that Tim cites at the St Brides conference is very interesting, quite complicated and seeks to redress some of the bias evident in older classification schemes. However, that 'Typeform Dialogues' project is not yet published in its own right, one can only find out more by reading the coverage of it in Baines and Haslams 	<a href="http://www.amazon.com/gp/product/0823055280/qid=1152448748/sr=2-2/ref=pd_bbs_b_2_2/002-1701602-4475220?s=books&amp;v=glance&amp;n=283155" rel="nofollow">Type and Typography.</a></p>
      <p>Both of these newer initiatives may be better in terms of addressing the current complexity of typeface classification, now that there are simply so many more typefaces and kinds of typefaces to choose from. I also teach typography, but whether one is in class or in a busy commercial studio, frankly any kind of system is better than a default font directory listing A-Z. Having said that, I no longer believe that there is likely to be a single 'best' scheme for classifying typefaces.</p>
