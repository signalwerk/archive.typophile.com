    html: "<p>I like Bringhurst's classification, but his \"baroque\" is a bit of a catch-all. There are at least four strands within baroque type: some maintains the French Renaissance tradition (like Van Dijk's), some moves towards concentrated force (like Kis's), some towards distortion (like Jannon's) and some is rococo (like Rosart's and Fleischman's).</p>"
