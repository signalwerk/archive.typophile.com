      <p>Different systems of classification have different guiding principles. No one system is 'ideal'. It is just a matter of what your purpose or interest is. </p>
      <p>That being said, there is some soundness in an historical approach, since most type designs, as all kinds of design, are influenced by reaction to designs of the previous generation, as well as new technology. </p>
      <p>Guttenberg invented a system using metal type and oil-based ink, and a press. The Chinese and Korean systems it seems used water-based ink, and rubbing. According to the <a href="http://en.wikipedia.org/wiki/Movable_type" rel="nofollow">Wikipedia article</a> it was less suited to mass production. That article credits Guttenberg with the press, not the invention of moveable type. The study of any invention usually shows that the key inventor was in fact key, but there were a lot of precursors that he draws on. That seems to be the case here. The fact is that all mass printing has followed Guttenberg's method, until offset printing with photo type, then digital type, replaced it.</p>
