      <p>This needs clarification. Some say the "form" was metal, others say the "form" was wood. The Gutenberg Bible was not PRINTED from "movable type" (dictionary definition), either in wood or metal. (Hint—early stereos) Although, setting the type may have been movable either in wood or metal but—not—printed—from—it. I know this is confusing.</p>
