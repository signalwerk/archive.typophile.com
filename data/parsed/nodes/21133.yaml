    html: <p>Credit should be given to the Koreans (not the Chinese, who worked in wood) for the development and perfection of moveable metal type in the first half of the 13th century during the Buddhist Goryeo dynasty. The Koreans printed the entire Buddhist canon, which was then exported to China and was largely responsible for the preservation of the Buddhist texts there. Some of these texts are extent in good condition and are fine examples of the art of printing. (The Koreans also made significant improvements in paper and ink technology.) Because there was more East-West interchange than has traditionally been acknowledged, I'm not ready to say that word of this achievement did not percolate back to Europe -- after all, the Mongol empire (<a href="http://en.wikipedia.org/wiki/Mongol_Empire" title="http://en.wikipedia.org/wiki/Mongol_Empire">http://en.wikipedia.org/wiki/Mongol_Empire</a>) had direct contact with both Korea and Europe. Korean wood and metal printing was in part a response to Mongol invasion.</p>
