      <p>Throughout the history of print, it has been debated as to who developed the first system of movable type and the production of the first typographic book. We know that in the early 12th century scribes produced books. The Italians were experimenting with silver plate engraving and block printing, possibly before 1400, producing manuscripts with wood block print. Evidence exists to support the theory that Gutenberg did produce the first typographic book and develop the technology that allowed this to be possible.</p>
      <p>We know that he perfected the technique of moveable block type. We also know that he made great advancements in the technology of the press. There is evidence to support this in transcipts from his trial with his two business partners, Dritzhen and Hellmann.</p>
      <p>The process of Gutenberg’s creation of type was derived from the defects of wood block printing. Since the wood absorbed the ink it was necessary to invent a substrate that would be soft enough to press the letter forms but strong enough to withstand multiple press runs. Gutenberg developed a type material that was 80% lead, 5% tin and 15% antimony; the metal type was moveable and reusable. The process for creating the letters was first to select the letter style. Then each character had to be engraved into a steal bar to make the punch. The letters including all capitals, lowercase, punctuation symbols and ligatures.  The punch was then pressed into the metal material to make a negative impression of the type. Gutenberg also invented the type mold. The mold allowed each letter to be placed into the mold and allowed for the thin or wide letters such as “l” or “w”.</p>
      <p>So just as it was said before that we credit Columbus with discovering America, we can definantly understand why we credit Gutenberg with movable type. However, his greatest invention was not the movable type but creating a cohesive system that is one of the greatest achievements in type history.</p>
