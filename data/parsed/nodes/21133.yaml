      <p>The anthropoligist Claude Levi-Strauss has pointed out that we are the only beings on the planet who feel the need to classify things. Most man-made things don't fit neatly into categories, but we put them there as a way of defining them for ourselves so we can talk about them. I teach typography and I would find it much more difficult if I could not generalize about styles of type even if typefaces don't neatly fit into particular styles.</p>
      <p>You have to look at every system of classification and be able to move back and forth amongst them. The Baroque-Romantic of Bringhurst helps define certain aspects of historical types, but in the end it's only a way of talking about the characteristics of the types, not a way of separating them from one another.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
