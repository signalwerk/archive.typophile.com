    html: |-
      <p>Stefan, i think your design has some real potential for a nice display font. there are forms that i find interesting and beautiful in a strange way.<br>
      if, however, your goal is a non-digital look you are on a completely wrong track. it is exactly the bumpy curves that make your typeface immediately recognizable as a digital one. that bumpiness has a typical Bezier flavour to it. just as the razor sharp intersections, like at the tail of the g.<br>
      i don’t say this is a bad thing. but maybe it is not what you inteded.</p>
    html_clean: |-
      <p>Stefan, i think your design has some real potential for a nice display font. there are forms that i find interesting and beautiful in a strange way.<br>
      if, however, your goal is a non-digital look you are on a completely wrong track. it is exactly the bumpy curves that make your typeface immediately recognizable as a digital one. that bumpiness has a typical Bezier flavour to it. just as the razor sharp intersections, like at the tail of the g.<br>
      i don’t say this is a bad thing. but maybe it is not what you inteded.</p>
