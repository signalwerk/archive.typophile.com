    html: |-
      <p>Hi again,</p>
      <p>sorry I was in a hurry a bit.<br>
      Your idea with the broad nip pen is certainly good and right.<br>
      Yet I am orientating myself with other forms that I want to achieve/understand/simulate.<br>
      I attach another photo. Look at the part of neck, where those tiny vertical muscles (very thin and sharp) only a little bit make themselves visible under the skin. Then there are others more evident. This is what I am searching for: Beauty.<br>
      Zapf did some ver precise and good calligraphic typefaces, and others, too. I find them boring, I am sorry.<br>
      Beauty for me is different. You don’t construct it. You feel it, try to catch it, but then you let it. One wonders why a form is beautiful, inspiring - and another is not. It has to do with secrets, doesn’t it?</p>
      <p>you say: - …as WE say.<br>
      I am sorry, but I will probably never make part of this WE.<br>
      Therefor I will never be a digital typeface designer who may sell his fonts.<br>
      It’s ok for me.</p>
      <p>Thanks again<br>
      Stefan</p><div class="imageWrap"><img src="http://typophile.com/files/Skin_surface_6056.gif"></div><p></p>
