      <p>Hi Thomas, hi Matthew!</p>
      <p>Thanks (again) for your compliments and critics!<br>
      I am very glad that you feel interested in my very personal characters.<br>
      Good feeling! Makes courage to go on in times like these where my inspiration seems a bit low. ;-)<br>
      Thomas, what’s wrong with Jenson? He did the most inspired and perfect roman type in history of humanity!<br>
      (I am sorry for the Aldus folks, but his rhythm of letters is unbeaten up today! ;-)<br>
      Yet, I believe its personal enough and specially with this character I am almost afraid of changing anything.<br>
      Even making it better. It came so suddenly to me and everytime I tried to modifiy something it turned out to loose something of its freshness (I hope). Matthew, you are certainly right what concerns ‘e’ and ‘c’. I tried to do so and returned to the start after all.<br>
      So I have decided to make little changes. I hope you stay with it nevertheless. Thanks again for your critics and interest!<br>
      Very very nice from you both.</p>
      <p>When I return from work I look to place some pictures of its process.</p>
      <p>Matthew: You definitely have to translate the sentence that you cited in Spanish above.<br>
      Seems very very interesting to me! Currently I am trying to gether some thoughts for a book more about beauty and its research in general. This thing with the thin line (my Italian permits me to understand something vaguely) is definitely of great interest for me!</p>
      <p>Thanks again<br>
      hear you</p>
      <p>Stefan(o)</p>
