    html: "<p>The two things that most stand out two me are related, the bottom stroke of the c and the e.  They just look a little like they're tumbling over on themselves, and so while the rest of the letters look almost like impossibly perfectly balanced wire statues of sorts, those two seem a little too impossible.  (okay, on retrospect, that description might make no sense whatsoever ha).  I think if you can extend the strokes a little bit more it'll balance those letters again.  But I love the overall feel.</p>

      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>"
