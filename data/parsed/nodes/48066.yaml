    user: 19151
    date: 2008-08-22T00:21:00
    date_raw: 22 Aug 2008 — 12:21am
    votes: null
    html: |-
      <p><cite> if, however, your goal is a non-digital look you are on a completely wrong track. it is exactly the bumpy curves that make your typeface immediately recognizable as a digital one. </cite></p>
      <p>Hm. Interesting this thought. I never saw it this way around. Could be, too.<br>
      Maybe I am too digital (for I also never do drawings by hand, immediately design on the monitor with bezíérs). You gave me a very interesting point of view with this remark.</p>
      <p>For what regards the bumpiness I think I didn’t explain me right. I am designing now for years and years with these curves and what I meant is the following:<br>
      Everytime I use these curves in a correct way (so that near the points there are no bumps etc. - and believe me, please, I am able to do so;-) for my eyes I cannot achieve the overall form that I wanted. The relation between the tangents in their length to each other always lead to a certain character of form (to me). If one makes them smooth without allowing them to offer points of critique in a way (from a technical point of view) they secretely make curves more elliptical - really hard to explain my feeling here: the letters become digital looking. You will agree with me that nearly all typefaces on the world by now are in a certain way very similar to each other. They will never look like lets say for example a handcut Van Krimpen face or a Jenson and so on. To me (maybe I am terribly wrong here - almost like to say: I hope so) they all have this defect of being too elliptical - in  a way they look strangely stretchable, smooth but not round. Not like a beautiful handdrawn circle would. Thats why I attached those woman fotos. Look at their body forms, the way the skin moves, muscles. Those forms are different to those of digital letters.<br>
      In a word I still believe that there is something wrong in a digital bezier curve. (By the way here: have you heard about Raph Levians alternative curves?) And I try under an artistic aspect to experiment with it. Making them with bumps: BUT that the overall form of letter seems to me agreeable. If you said there is something strangely beautiful (and it is far from being the result of what I wanted) in them: it is that. I refused bettering Beziers in zones where I observed that this would change the original spontaneous form.<br>
      First sketches were made in FontStudio (version 92 I think) Although I love FontLab there it is more simple to find those originary forms. Maybe because the defects of beziers show less obviously in the first steps of work.<br>
      Maybe I will never make it to explain my feelings about it.<br>
      Did you ever designed a form and then later you recognize that you are afraid of changing it?<br>
      With this character I made this experience. Everytime I tried to make something better it became worse. But now this is becoming too personal I guess.. ;-)</p>
      <p><cite> But I disagree that bezier curves changes natural forms </cite></p>
      <p>Just believe me: THEY DO!</p>
      <p>Stefan</p>
