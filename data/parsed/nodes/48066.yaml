      <p>I kind of like the feeling of this, especially when it's small, but I think that you have to work more on the details to get “smoother curves” – as we say ;-)</p>
      <p>And perhaps also experiment (or study) a little with the angle that a pen would have wrote those letters in. That is if you imagine a broad nib pen, how would you have hold it? In what angle? And what effects would it have on your letters. Then of course, you can move on away from that, but as a start it is good to think a little bit on that.</p>
      <p>Good luck with your letters!</p>
