    html: |-
      <p>Hallo Thomas!</p>
      <p>Danke für Deine sehr interessante und sehr treffende Kritik (=Lob).<br>
      Origami? hm, da war ich noch nicht drauf gekommen.<br>
      Aber zum einen finde auch ich, dass sie eine klassische, „romane“ (lustig, wie Du das auf den Punkt bringst) Orientierung hat.<br>
      Tatsächlich trieft meine Bewunderung für die Jenson Antiqua (Roman) ihr aus allen Poren.<br>
      Nicht nur das typische e sondern auch die Ausbalancierung des g etc.<br>
      (das hat seit 1470 niemand mehr hinbekommen!)<br>
      Mit den perspektivischen Verschiebungen hast Du es auch ziemlich gut getroffen.<br>
      Tatsächlich war ich bei dieser Type von einer Fotoserie (ich arbeite immer nach Frauen/Modefotografien) inspiriert von Steven Meisel aus der Vogue Italia (Titel „Reflections..“)<br>
      Mit merkwürdigen Filtern glitten die sehr klassischen Aufnahmen in bestimmten Bereichen ins Ungewisse, teils Verzerrte ab. Schätze, das hat irgendwie seinen Weg in die Schrift gefunden. Tatsächlich finden sich Doppelungen von einigen Innen und Aussenformen an verschiedenen Stellen der Buchstaben wieder (an Stellen, wo sie nicht hingehören).<br>
      Wenn Du willst kann ich Dir mehr Bilder dazu schicken/bzw. reinstellen.<br>
      Das mit dem g war mir auch aufgefallen. Keine Ahnung woran das liegt.</p>
      <p>Danke nochmal<br>
      Stefan</p>
