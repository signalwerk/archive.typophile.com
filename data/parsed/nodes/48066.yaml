      <p>Hallo Stefan,</p>
      <p>ja das war als Kompliment bzw. Assoziationkette gedacht und soll(te) anregen!</p>
      <p>Ich hatte das letzte Posting auf deutsch geschrieben, das ich in dieser Art nicht auf Englisch hinbekommen hätte. </p>
      <p>Interessieren würde mich besonders dein Inspirationpart „Reflexions“ (wenn du Lust hast, könntest du mir ein Foto bzw. ein Scan per PM zukommen lassen). </p>
      <p>Ja mehr Ansichten deiner Schrift, auch s/w, wären reizvoll.<br>
      Vielleicht versteife ich mich etwas zu sehr auf Origami, aber diese Richtung gepaart mit „pure roman“ könnte doch schlussendlich zu einer eigenständigen (Display?)-Schrift führen, ein bisschen künstlich dürfte das schon sein für meine Geschmacksnerven, sich nur keinem Jenson zu sehr hingeben ;)</p>
      <p>Viele Grüße und frohes Schaffen, wie man in Württemberg so sagt ;)<br>
      wünscht Thomas</p>
      <p>PS Die Latinos machen solche Design-Threads auch immer gerne in Muttersprache, also diesmal teutonisch von meiner Seite aus …</p>
