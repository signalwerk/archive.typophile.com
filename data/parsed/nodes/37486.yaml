      <p>&gt; <cite>Michel, I use LaTeX regularly but I haven’t used Computer Modern in years.</cite></p>
      <p>The same is true with me; I mainly use pdflatex with utopia. However, the sans serif CMU Bright should in my opinion not be overlooked. <a href="http://www.iro.umontreal.ca/~boyer/typophile/CMUbright-vs-Myriad.pdf" rel="nofollow"><strong>Here</strong></a> is a parallel between CMU Bright and Myriad Pro, that I made to get a feeling of how both handle diacritics. </p>
      <p>&gt; <cite>custom modifications to a font sounds wonderful but also pricey</cite></p>
      <p>It is my feeling that you could do that yourself. Copying two letters, shrinking them to 65% horizontally and 55% vertically, moving them up and fixing the sidebearings is in my opinion no big deal. Moving around a few diacritics is (still in my opinion) closer to editing than to font design. I am certainly no font designer but that's the kind of thing I can do (as well as adding a custom GSUB table to get the character variants I want). One problem with CMU Bright is that it is not class kerned and so, if you add a "ligature" x_hat, you cannot add it to the same left and right kerning class as x, but I think that's a minor problem.</p>
      <p>Michel</p>
