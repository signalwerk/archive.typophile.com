      <p>You could also check the Computer Modern family of fonts. To see what the version of the American Mathematical Society looks like, you can have a look at the file <a href="http://www.iro.umontreal.ca/~boyer/typophile/cmsample.pdf" rel="nofollow">cmsample.pdf</a> which is the pdflatex output from the AMS .tex sample file.</p>
