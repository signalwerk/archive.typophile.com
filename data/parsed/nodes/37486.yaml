      <p>Another interesting project is the <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page" rel="nofollow"><strong>DejaVu fonts</strong></a>. The characters you need are all there (but no small caps). The diacritics are anchor positioned. The dot under the lslash (0142 0323 combination) is way off but all you need to do to reposition it is to add the proper anchor at the lslash's bottom (you copy the anchor at l's bottom and paste it at lslash's bottom); <a href="http://www.iro.umontreal.ca/~boyer/typophile/dejavu.pdf" rel="nofollow"><strong>here</strong></a> is a xeLaTeX output (after repositioning).</p>
      <p>Michel</p>
