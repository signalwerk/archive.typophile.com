    <p>I'm looking for fonts suitable for use in my master's thesis, which will deal with the computerizing of an Aleut-English dictionary.  Modern Aleut orthography has only two tricky characters, g with a circumflex and x with a circumflex.  However, I anticipate needing to include several sample entries from the dictionary, and the dictionary uses a plethora of accented or otherwise special characters, some of which are only supported in Unicode via combining diacritics.  So criterion number one is to find a font that supports (most of) the characters I need.</p>
    <p>Criterion number two is that it have bold and italic variants.  Small caps sure would be nice, as would the complete International Phonetic Alphabet.</p>
    <p>There are a handful of free fonts that meet criteria one and two; the best one I have so far is Charis SIL.  I've also looked at Doulos SIL, Aboriginal Serif and Aboriginal Sans (from languagegeek.com), Junicode and Linux Libertine.  In the absence of anything better, I'm really glad to have these fonts, but I wonder if anybody knows of some other (more professional) options.  Ideally I'd like to have a sans-serif font and a serif font that complement each other; it seems to be popular in lexicographic typesetting to have a bold sans-serif font for headwords and source-language material and a serif font for most of the other stuff.</p>
    <p>I'm attaching a file showing the characters used in the dictionary.  If anyone knows of fonts that might fit the bill, I'd love to hear about them.</p>
    <p>Thanks,<br>
    Aric</p>
