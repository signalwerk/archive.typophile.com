    html: |-
      <p>In fact there are two parts: positive and negative.<br>
      On the left is a made of plastic and there were other examples, but in worse state.<br>
      On the right is made of lead. The was another piece there, but it was broken.</p>
      <p>TEFF is one of Hollands "top" font foundries. Their quality has always been high and still is. The museum is more like a secondhand-shop... Strange...</p>
      <p>Does anyone know the book? Could it have to do with 'embossing'?</p>
      <p>I only found some names via Google, no images (bookcovers):<br>
      <em>Spectrum Romulus Lutetia Romanee Open Kapitalen. Lettergieterij Joh. Enschede en Zonen. Haarlem, Holland. z.j. or.omsl. Rijk geillustreerd.</em></p>
