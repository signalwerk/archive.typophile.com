    <p>Today is was at a museum in Terschuur: <a href="http://www.ambachtenmuseum.nl/" title="http://www.ambachtenmuseum.nl/">http://www.ambachtenmuseum.nl/</a><br>
    The owner collects a huge variety of old tools, etc and puts everything in the museum. It is pretty messy, but one is allowed to touch things (gently) and that makes a visit worthwhile.<br>
    I found something in "the printing corner" which seemed pretty interesting for anyone here, but I'm not sure what it is and where it came from, but it says 'Lettergieterij Enschedé'. Some kind of frontpage for a typespecimen? Any other ideas?</p>
    <p>Edit: I reduced size of the pictures and added another:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TEFF_01_4102.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/TEFF_02_6369.jpg"></div><p></p>
