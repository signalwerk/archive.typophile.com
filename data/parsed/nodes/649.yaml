    html: <p>Wired Magazine used to use a combo of Meta and Filosofia, and managed to do a lot with them. <br> <br>I've used it with Bodoni 12 to effect as well. <br> <br>I'm using Meta and Trajan on an identity system right now, but of course Trajan isn't going to help you out in your average text setting.</p>
