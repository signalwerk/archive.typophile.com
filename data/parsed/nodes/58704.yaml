  html: |-
    <p>Hello,</p>
    <p>I have created <a class="freelinking external" href="http://compoundeye.org/font/Display.otf">this font</a> to use in an osx application.</p>
    <p>It contains only the 26 standard English upper case letters.</p>
    <p>I drew the letters in illustrator and and imported the shapes into font forge (on osx leopard)<br>
    I have tried to export my font in a number of formats, but font book doesn't like any of them. I've used font book's validate file option, which found no errors. But font book won't install the file.</p>
    <p>some people have told me they are able to install the font, but absolutely nothing happens when I try to get font book to open it.</p>
    <p>any suggestions?</p>
    <p>thank you</p>
    <p>Mathew</p>
