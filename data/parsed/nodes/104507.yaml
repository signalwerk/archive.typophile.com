      <p>Note that the scorn of the industry is usually directed just at ITC's particular cut of Garamond, not at Garamond altogether. You might try Garamond Premier Pro (which is an Adobe font, but not the same as Adobe Garamond) for a more authentic, and arguably more "elegant" and "smart" alternative.</p>
      <p>Apart from these adjectives, is there any particular aesthetic / time period / culture / mood you're aiming for? Have you thought about other aspects of the design — trim size? kind of paper? margins? measure? layout? second color? All these things will have an impact on how your design feels.</p>
