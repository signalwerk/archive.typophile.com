      <p><cite>the page numbers</cite></p>
      <p>They're called "folios"</p>
      <p>There is no way to teach you how to design a book in an internet post, just like you can't teach me -- a good book interior designer -- how to make an effective print ad with a post or two.</p>
      <p>BTW, in the book world, ITC Garamond is generally considered a joke.</p>
      <p>Having said that, for an Optima-like variant, take a look at Sumner Stones's <strong>Magma</strong> -- I think a weight in the *compact* family  might serve you best, perhaps the semi-bold for the smaller type, normal for anything over, say, 24 point, but use you own judgement.</p>
      <p><a href="http://www.stonetypefoundry.com/magmaoverview.html" title="http://www.stonetypefoundry.com/magmaoverview.html">http://www.stonetypefoundry.com/magmaoverview.html</a></p>
      <p>For the text, it kind of depends if you want to emphasize that historical feel with a traditional typeface, or use something that would appeal to a post-2000 audience. I've heard people say of Scala, for example "Oh, it's so 1990s..."</p>
      <p>In any case, it is best to be sure of your text face first, then select a display. Here's an off-the-wall suggestion I have used, Magma for display and Quadraat for text. It is elegant, but definitely not elegant old-school-British (i.e., Caslon, Baskerville, Scotch). I have used the Quadraat/Magma pairing several times for an academic works, once I believe for a university press book on an analysis of the I Ching. It met it's audience &amp; I think looked quite nice.</p>
      <p>Pretty sure this is the one, but sadly, you can't "look inside."</p>
      <p><a href="http://www.amazon.com/Fathoming-Cosmos-Ordering-World-Evolution/dp/0813927056" title="http://www.amazon.com/Fathoming-Cosmos-Ordering-World-Evolution/dp/0813927056">http://www.amazon.com/Fathoming-Cosmos-Ordering-World-Evolution/dp/08139...</a></p>
      <p>FWIW</p>
