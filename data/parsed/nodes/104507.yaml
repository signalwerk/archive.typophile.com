      <p>This is wide open, so I would trust your own judgement.<br>
      Peruse a large bookstore and ﬁnd some books with type treatments that you think will be appropriate to the task in hand, and that you also like the look of. The trick is to then identify said fonts—which you can do here in the ID forum, or at MyFonts “WTF”.</p>
