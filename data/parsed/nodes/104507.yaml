      <p>It is indeed very hard to give good advice here, but any advice is better than none.</p>
      <p>To narrow down your search, I would offer these beliefs of mine:<br>
      - Don't use a sans for a large amount of text.<br>
      - One way to look "elegant" is to use a (relatively) narrow font.<br>
      - Another way is to use a font with long extenders (i.e. small x-height).<br>
      - The category of type that best conveys "trust" is wedge serifs.<br>
      Some mentioned here: <a href="http://typophile.com/node/39407" title="http://typophile.com/node/39407">http://typophile.com/node/39407</a></p>
      <p>hhp</p>
