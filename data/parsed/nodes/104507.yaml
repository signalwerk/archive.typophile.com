    <p>I've been working on a book for a client that's a 'brief' (read, 400 pages) history of trust that links one of the old English Universities with a Japanese bank. Up till this point I've been using ITC Garamond Std for the main body of the text and Optima LT Std for other things on the page, the page numbers, book title in the top left corner etc. I'd been using these because this is what the client told me to use, but she's sent an email asking for suggestions for changing the 'look' of the page. She wants to keep it very "elegant, smart and artful" so I was wondering if anyone had suggestions for alternatives, particularly for Optima - I usually work with sans serif fonts so this is pretty new territory for me.<br>
    If anyone knows a good combination using Garamond - or an alternative, I'm not too rigid at this point - that'd be a lifesaver!</p>
