    html: "<p>The OT features compile just fine, I'm almost positive it's not related to that. <br> <br>I think I figured it out: I decomposed all the composite characters and merged all the paths and now it works. I like to keep things flexible by using composites and overlapping paths during development, but I guess Illustrator CS is picky about one or both of those things (the composites, most likely). <br> <br>If this is actually what's going on, it's not a big deal because I always do those things as a final step anyway.</p>"
