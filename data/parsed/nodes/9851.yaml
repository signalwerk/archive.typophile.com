    html: <p>Illustrator CS handles alternate characters better in one way. You can select a range of text and select Stylistic Alternates from the OpenType palette, similar to the way you apply small caps or discretionary ligatures. In InDesign CS, the only way to get alternate characters is from the Glyph palette, which displays them with a little pop-up menu on characters that have more than one design. But it only works for single characters. It does mean that you can get access when there are multiple alternates, something which you can't do in Illustrator CS. Adobe should have both methods in both programs, as well as a better way to handle multiple alternates. Cycling through would work for me.</p>
