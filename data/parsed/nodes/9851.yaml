  html: "<p>I'm developing some OpenType (CFF) fonts in FontLab. Suddenly, I'm getting a strange error when I try to print samples from Illustrator CS: <br> <br>\"Can't print the illustration. There's a bad font used in the document.\" <br> <br>I've looked all over the web, but I can't find any explanation as to what this error means. <br> <br>The font prints fine from InDesign CS. If I save as PDF from Illustrator CS, that prints okay, too.  <br> <br>Certain characters seem to be causing the problem, but it's difficult to say. If I change one word to small caps, it prints. If I change a different word to small caps, it prints. But, if I change both words to small caps, I get the \"bad font\" error. <br> <br>I've tested this on two Macs, so I know it's probably a problem with the font. But what the heck does that error mean? It would be helpful to know what kind of flaw I'm looking for.</p>"
