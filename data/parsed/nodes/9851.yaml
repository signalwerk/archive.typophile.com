    html: <p>I work the same way with composites.  I sometimes make a copy of my final FontLab file and keep it as composites just in case I need to fix something.  It would be nice if FontLab would decompose and merge on the fly when you output but keep the editing advantage of maintaining composites in your file. <br>BTW, I have also noticedthat AI-CS handles type differently than InD.  The way OT fonts group is not the same and sometimes a weight is ommitted. Maybe Adobe will tighten up there OT look-and-feel amoung their CS apps in the next rev. <br> <br>ChrisL</p>
