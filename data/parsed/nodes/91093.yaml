      <p>This topic has come up before. Might want to search through the archives.</p>
      <p>My go-to simple binding system has been 'prong fasteners' which are the things you used to see in medical folders:</p>
      <p><a href="http://www.officemax.com/office-supplies/clips-fasteners-rubberbands/fasteners/product-prod1600015" title="http://www.officemax.com/office-supplies/clips-fasteners-rubberbands/fasteners/product-prod1600015">http://www.officemax.com/office-supplies/clips-fasteners-rubberbands/fas...</a></p>
      <p>They look nice when bound and come apart easily to pass individual pieces around if need be.</p>
