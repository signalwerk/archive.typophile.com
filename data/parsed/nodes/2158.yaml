  html: <p>I've been wondering, has anybody discerned the logic (assuming it wasn't formally documented in the first place) of the Petrine reform of Cyrillic at the beginning of the 18th century? Like why was the cap U (the one that looks like a big Latin lc "y") left/made into a form different than the Latin cap "Y"*, while something like the EM was made totally Latin? Was there some system to it? <br> <br>* BTW, wassup with the code point 04AE in Unicode? <br> <br>hhp <br></p>
  html_clean: <p>I've been wondering, has anybody discerned the logic (assuming it wasn't formally documented in the first place) of the Petrine reform of Cyrillic at the beginning of the 18th century? Like why was the cap U (the one that looks like a big Latin lc "y") left/made into a form different than the Latin cap "Y"*, while something like the EM was made totally Latin? Was there some system to it? <br> <br>* BTW, wassup with the code point 04AE in Unicode? <br> <br>hhp <br></p>
