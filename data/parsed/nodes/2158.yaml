    html: "<p>Further, regarding the Azerbaijani orthography: <br> <br>When written in the Arabic script, Azerbaijani uses letters as vowels, not Arabic vocalisation marks (like the Yiddish and Ladino use of the Hebrew script). The close vowels discussed above, <i>u</i> and <i>ü</i>, as well as the vowels <i>o</i> and <i>�</i> are all written using the Arabic letter <i>waw</i> which may be optionally distinguished by the addition of superscript marks: <br> <br>o = <i>waw</i> with <i>sukun</i> <br>� = <i>waw</i> with <i>hamza</i> <br>u = <i>waw</i> with <i>damma</i> <br>ü = <i>waw</i> with <i>hamza</i> <br> <br>Obviously the distinction between the quality of the vowel sound is considered more important than the actual position of the sound, since both the <i>�</i> and <i>ü</i> are written the same way in the Azerbaijani Arabic orthography.</p>"
