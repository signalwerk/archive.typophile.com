    html: "<p>Sorry, I confused it with Turkish. <br> <br>BTW, didn't Azerbaijan \"officially\" switch to Latin a few years ago? I'd guess they've modeled the switch on the Turkish precedent. But is Cyrillic still the de facto script? I remember that the switch was seen as a long-shot political ploy; which was in fact the case with Turkish, although having a strong leader -and the high illiteracy back then- made that one more effective. <br> <br>In fact here's a story: <br><a href=\"http://news.bbc.co.uk/2/hi/europe/2165547.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/europe/2165547.stm</a> <br> <br>hhp <br></p>"
