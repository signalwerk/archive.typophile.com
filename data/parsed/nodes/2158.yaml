    html: <p>Obviously, I haven't read Yefimov's chapter yet. :-/ <br>I'll have to bump it up my reading list... In fact I can make it second in line (after part 3 of that Ovink thing), not least because Typophile threads get "closed" after a month of inactivity... <br> <br>And thanks for the VL references. I recently finished "mining" Quaerendo all the way back to the beginning, and VL/JoTR can be next. Long live UCLA! Well, at least their libraries... <br> <br>&gt; at the final stage Peter the Great simply picked up a pen and crossed out a pile of stuff <br> <br>That's what I suspected. But I guess the preparatory stuff by "advisors" did guide the process to a large extent (at least I hope so). Nonetheless, what might be called the erratic, "human" nature of the process probably resulted in some strangeness. For example, for the cap U, I wonder if Peter saw a lc Latin "y", and since it's "tall" he thought it was a cap, and he just took a fancy to it? But this is mostly just my imagination for now - I'll read up that material soon. <br> <br>&gt;&gt; 04AE <br>&gt; Take a look at the lowercase form <br> <br>Huh, it looks like a van Krimpen Greek gamma. <br> <br>&gt; All three languages were written in variants of the Latin script in the 1920s and 1930s <br> <br>It seems that this is what would have made them used a more Latin form, although <br>that lc is still strange - maybe it was to differentiate it from the mainstream/Russian form. <br> <br>hhp <br></p>
