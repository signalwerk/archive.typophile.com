    html: <p><i>It seems that this is what would have made them used a more Latin form, although  <br>that lc is still strange - maybe it was to differentiate it from the mainstream/Russian form.</i> <br> <br>The differentiation was necessary because they're different letters in a single orthography. All three languages use this straight-leg form <i>and</i> the typical Cyrillic U. In the new Azerbaijani Latin orthography (1992), the latter is written <i>u</i> while the straight-leg letter is written as <i>ü</i>. I'm not sure of the exact phonetic value.</p>
