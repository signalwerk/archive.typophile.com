    votes: null
    html: "<p>Have you read Vladimir Yefimov's essay on the Petrine Civil Type in <i>Language Culture Type</i>? It doesn't directly address the capital U question, but it does provide a fairly detailed history of the reform. Of course, at the final stage Peter the Great simply picked up a pen and crossed out a pile of stuff: alphabet reform by royal fiat, and I don't suppose the Tsar felt any need to explain himself. <br> <br>You might also track down volumes 3:4 (1969) and 4:2 (1970) of the journal <i>Visible Language</i>, which contain a two-part essay on 'The Genesis of Russian Grazhdanskii Shrift or Civil Type' by Ivan L. Kaldor. I don't have my copies to hand, so I can't check what information they might include about the alphabet reform. Kaldor was principally interested in identifying the specific Latin types on which the Civil Type was based. <br> <br><i>BTW, wassup with the code point 04AE in Unicode?</i> <br> <br>It's used in the Cyrillic orthographies of Azerbaijani, Bashkir and Kalmyk. Take a look at the lowercase form, U+04AF. I'm not sure when this developed. All three languages were written in variants of the Latin script in the 1920s and 1930s, until Stalin decided that the USSR should be a Cyrillic-only zone. But if you take a look at the images at <a href=\"http://www.pmicro.kz/~library/unicode/index.html\">this site</a>, taken from M.I. Isaev's <i>Yazykovoe strointel'stvo v SSSR</i>, you'll see that the 'Y' is shown with a typical Russian U form. It is difficult to tell whether this represents the form used for these languages in the 1920s and 1930s or if this was simply what Isaev had available in 1979.</p>"
    html_clean: "<p>Have you read Vladimir Yefimov's essay on the Petrine Civil Type in <i>Language Culture Type</i>? It doesn't directly address the capital U question, but it does provide a fairly detailed history of the reform. Of course, at the final stage Peter the Great simply picked up a pen and crossed out a pile of stuff: alphabet reform by royal fiat, and I don't suppose the Tsar felt any need to explain himself. <br> <br>You might also track down volumes 3:4 (1969) and 4:2 (1970) of the journal <i>Visible Language</i>, which contain a two-part essay on 'The Genesis of Russian Grazhdanskii Shrift or Civil Type' by Ivan L. Kaldor. I don't have my copies to hand, so I can't check what information they might include about the alphabet reform. Kaldor was principally interested in identifying the specific Latin types on which the Civil Type was based. <br> <br><i>BTW, wassup with the code point 04AE in Unicode?</i> <br> <br>It's used in the Cyrillic orthographies of Azerbaijani, Bashkir and Kalmyk. Take a look at the lowercase form, U+04AF. I'm not sure when this developed. All three languages were written in variants of the Latin script in the 1920s and 1930s, until Stalin decided that the USSR should be a Cyrillic-only zone. But if you take a look at the images at <a href=\"http://www.pmicro.kz/~library/unicode/index.html\" class=\"link-external\">this site</a>, taken from M.I. Isaev's <i>Yazykovoe strointel'stvo v SSSR</i>, you'll see that the 'Y' is shown with a typical Russian U form. It is difficult to tell whether this represents the form used for these languages in the 1920s and 1930s or if this was simply what Isaev had available in 1979.</p>"
