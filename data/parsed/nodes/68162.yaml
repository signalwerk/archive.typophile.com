    votes: null
    html: |-
      <p><cite>It's just that when people say "Adobe did this" or "Microsoft did that", it didn't. Employees made those decisions.</cite></p>
      <p>Well, there's one thing we can agree on. Generally, *somebody* makes a decision.</p>
      <p>Although actually there are also cases where there's never or rarely a conscious decision, just a cumulative effect of lots of little decisions (either independently, or building on top of each other).</p>
      <p>I don't see bundling of fonts by OS or app vendors as any of those things Nick mentioned. However, I do largely agree with the argument that such bundling tends to drive down the perceived value of fonts in the minds of end users, which is the concern underlying Nick's harsh verbiage.</p>
      <p>If the company either has a retail font business (like Adobe, even if it is tiny compared to their app business), or has a strategic interest in there being a healthy marketplace for fonts (Adobe, Apple and arguably Microsoft), then they need to think hard about how many and which fonts they bundle.</p>
      <p>One part of font bundling that makes particular sense for Adobe is fonts as registration incentives. Those fonts get far more publicity/mileage and attention then the other bundled fonts, and they encourage product registration which is of special value to the company. They are actually perceived and marketed as added value in a way that the "everyday" bundled fonts are not so much.</p>
      <p>Cheers,</p>
      <p>T</p>
