      <p>Generally speaking, a bundled font can be covered by the EULA for the application with which it was bundled -- as opposed to a separate font EULA. This means that the font is essentially part of the application. For example, while a regular font EULA might permit installation on five computers in a work group, a bundled font might be restricted to just one. And it might mean the font is not a "gift"; if you sell the software or give it away, the font has to go with it, and you don't get to keep and use it.</p>
      <p>(As always, consult your own EULA!)</p>
