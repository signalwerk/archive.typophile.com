    <p>Hello, all. I posted this query in the wrong forum, and am reposting. I have a partial answer.</p>
    <p>mbcohen<br>
    8.Jul.2008 12.09am<br>
    Can anyone help me identify the slab-serif typeface used on so many Bantam paperbacks of the 70s? Always with outline and heavy shadow. It resembles a condensed bold Clarendon, but the R is distinctive.</p>
    <p>You can kind of see it in a terrible image here, from the 1970 edition of Ross MacDonald’s THE GOODBYE LOOK: <a href="http://www.yesterdaysmuse.com/shop_image/product/067351.jpg" title="http://www.yesterdaysmuse.com/shop_image/product/067351.jpg">http://www.yesterdaysmuse.com/shop_image/product/067351.jpg</a></p>
    <p>To which SuperUltraFabulous very kindly replied:</p>
    <p>SuperUltraFabulous<br>
    8.Jul.2008 1.28am<br>
    Hello there:</p>
    <p>Just so you know this topic should be posted in the Font ID forum not in the Design forum.</p>
    <p>No problem tho, this is Profil (not a misspelling)</p>
    <p>Get the Bitstream version here:</p>
    <p><a href="http://www.myfonts.com/fonts/bitstream/decorated-035/" title="http://www.myfonts.com/fonts/bitstream/decorated-035/">http://www.myfonts.com/fonts/bitstream/decorated-035/</a></p>
    <p>Enjoy!</p>
    <p>Mikey :-)</p>
    <p>However, while Profil/Decorated 035 is definitely a recognizable paperback titling font from the era, and I can definitely use it, it's not quite the one. It is too much of an oblique.  </p>
    <p>I would appreciate any further assistance anybody might be able to give.</p>
    <p>Malachi</p>
