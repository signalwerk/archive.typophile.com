    <p>Hi, I've read the guidelines, but I apologize in advance if I'm doing some incorrectly. I'm trying to figure out the font used on <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/2/28/SheMayLookCleanBut.jpg" rel="nofollow">this poster</a>. Near as I can tell, it's the same font for all the text, save for "VDgraphic - 9" in the bottom left corner, which isn't important.</p>
    <p>I've tried to identify this font myself, and I've tried using WhatTheFont! and Identifont, but, to no avail. The guide here also linked me to Type Navigator at typenav.fontshop.com, but that appears to be down.</p>
    <p>Anyhow, this poster is from the early 1940s, no later than 1945, made by the government as a VD propaganda poster. It's been posted <a class="freelinking external" href="http://www.nlm.nih.gov/exhibition/visualculture/infectious21.html" rel="nofollow">here</a>, which has a small amount of information about it. This is probably an easy one for many of you, but, I can't figure it out, and I'd greatly appreciate any help anyone can provide. Thanks. :D</p>
