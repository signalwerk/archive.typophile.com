    html: <p>Besides there being other propaganda posters from the same era with this same font, the letters used there are the exact same as other instances of the same letter- even when the size is different. Unless hand-painted has some special font-related meaning I'm not aware of, there seems to be a typeface that is being used here- or they had a savant "paint" this.</p>
