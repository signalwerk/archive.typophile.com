    html: |-
      <p>I appreciate the information. I don't know much about hand-painting text, but, considering the perfection between same letters on this poster, and considering some of the other posters <a class="freelinking external" href="http://www.nlm.nih.gov/exhibition/visualculture/venereal.html#21" rel="nofollow">here</a> (reachable from the page I linked in my original post), I'm disinclined to believe the letters themselves were painted.</p>
      <p>Titling Gothic Skyline Medium is incredibly close, the only differences I was able to notice were things like the gap in the A, which seem as though they could be explaining by bolding. Ryuk's post introducing it mentioned them as similars, though, and I'm sure he has a more educated opinion than I about why they could not be the same. I remain of the opinion from looking at the posters, however, that there does exist some sort of typeface that was used for this- though I'm not sure how it'd be evident what media they may have used to utilize said typeface.</p>
