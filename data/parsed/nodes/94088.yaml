    html: "<p>@ Joseph: Riccardo seems to be using the widely-accepted definition of a <em>font</em> as a set of letterforms used to replicate letters by a mechanical, optical, or digital device. If an artist makes the letters without any such device, then no <em>font</em> is used (although the artist may use a <em>font</em> as the model for the letters he/she draws by hand, as the artist for this poster may have done with Titling Gothic Skyline Medium).</p>"
