    html: |-
      <p>Just to wrap it up, I just had a private discussion with Mr. Brown.</p>
      <p>&gt;What is it about Calibri you don't like?</p>
      <p>The problem with Calibri is that text looks "fat" in offset print, especially at typical text sizes (9–11 pt). There is nothing wrong with the design but it's just not designed for print. So this</p>
      <p>&gt;You Can use Georgia or Arial Black..</p>
      <p>wouldn't work either.</p>
      <p>Mr. Brown offered his client some samples in TheSans ("another condensed roundy humanist sans-serif"), Myriad Pro, and one other sans serif he couldn't recall.<br>
      The client went with Myriad, so my guess would be the other fonts just showed 'too much personality' :D</p>
