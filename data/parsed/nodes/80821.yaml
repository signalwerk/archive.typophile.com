    <p>Hello, I am attempting to create a logo for a publishing company. Company name is called Publishing Network. The organization is a membership based company which allows members to access multiple publications and educational material throughout the US. </p>
    <p>Key workds: network, access, global, books, publications, </p>
    <p>My approach has been to create a visual that conveys that message. So far, i've only concentrated on the mark. i'd love to hear your thoughts on what is working and what is not.</p>
    <p>Thanks in advance. </p><div class="imageWrap"><img src="http://typophile.com/files/APN-1-1_3461.jpg"></div><p></p>
