      <p>Mauro, I may be jumping into this thread too late to be helpful, but here are my thoughts for what they are worth. Publishing is not one business. In broad terms, it's two businesses with very different (though overlapping) markets.<br>
      First, there's entertainment, where you find books like you used to find in your corner bookstore (fiction, literary nonfiction, travel, humor, children's books, etc.). This segment of book publishing provides the same value to its audience as magazines, movies, television, and games.<br>
      The other publishing business is information and education, such as textbooks and reference books. People don't buy these for fun, they buy them because they need the <em>content</em>. And they'll choose the cheapest and most efficient way to get the content. Although <em>information</em> and <em>education</em> are missing from your keywords list, they are (or should be) part of your client's mission. The value your client offers their audience isn't the delivery system, it's the <em>content</em>, and the convenience of getting it without the limitations of a physical document.<br>
      A logo that reminds me of physical documents (books, pens) might undermine the client's value proposition. Ideas and learning are intangibles, and therefore hard to incorporate into a visual symbol, but that's what your client is offering.</p>
