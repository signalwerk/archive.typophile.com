    html: <p>There's also URW's <a class="freelinking external" href="http://en.wikipedia.org/wiki/Nimbus_Sans#Nimbus_Sans_L">Nimbus Sans L</a>, which pretty much is Helvetica. A subset of it was released under a free licence to be included with Ghostscript. There are numerous (legal) derivatives floating around the web, e.g. <a class="freelinking external" href="http://www.gnu.org/software/freefont/">GNU FreeFont</a>.</p>
