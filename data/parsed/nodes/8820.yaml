  html: <p>i am by no means a type designer. i don't pretend that this is good or useful. <br>i was messing around trying to force glyphs into an 8x10 grid, just an excersize <br>in solving problems created by strict guidelines. i sort of cheated when i created <br>some diagonal shapes, but hey, they were my rules to begin with. so i was wondering <br>whether anyone had some different solutions to some of the more <br>obvious (or boring) problems. <br> <br><img src="http://www.typophile.com/forums/messages/29/6367.gif" alt="shapesgif"></p>
