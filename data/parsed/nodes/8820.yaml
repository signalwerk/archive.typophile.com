    html: "<p>Isaac: (1) Of the Xs, I'd say I prefer the first. The other 3 look like they're wrapped around an orb. Which could be cool - but in my mind it doesn't make sense with rest of the letters. (2) The first 2 Bs I think are less successful than the others because of the extreme(?) variation in their strokes. (3) Are the Zs on the same grid? They look wider. (4) You might think of adding square/slab-type serifs in the 'I.' <br> <br>Overall I think it's a great start. Why is it that you're bothered by the diagonals exactly? And I'm with bj: The W is rockin' like Dokken. <br> <br>Cheers, mate.</p>"
