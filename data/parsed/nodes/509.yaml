  html: <p>Here is a very interesting and stylish font from the cover of the Bauhaus quarterly magazine. Scan from Typography/Basic Principles by John Lewis, published in 1966. This is the only book on typography I have in the house, as I am a poor student. Sniff. Still, some of the typographic ideas are stimulating, and this font inspired my font Feynman Regular. <br><img src="http://www.typophile.com/forums/messages/83/1245.gif" alt="bauhaus"> <br>Matthew Brown</p>
