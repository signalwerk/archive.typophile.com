    html: <p>Matthew, <br> <br>Here are some of the digital interpretations of  <br>Schmidt's design that I'm aware of... <br> <br>The beautiful people at Type-Ø-Tones did the most <br>authentic Joostian <a href="http://www.type-o-tones.com/p_fonts/p_joost.htm" target="_blank">alphabet</a> I've run across. There's  <br>a bit of history at that page too. <br> <br><a href="http://www.fonts.com/findfonts/findfonts_frame.asp?con=getfont.asp?pid=243426" target="_blank">Jocelyn</a> by Johannes Birkenbach is a another take  <br>on the look. <br> <br>Those zany lowercase 'a's can be found in much <br>of Finnish designer Tomi Haaparanta's work.  <br>See <a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=878&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">Tantalus</a> and <a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=807&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">Target</a>, both at T-26.  <br> <br>And here are some other wild variations, mostly <br>based on the Type-Ø-Tones' Joost forms... <br> <br><a href="http://www.fontalicious.com/shopping/FONstore.cgi?user_action=detail&amp;catalogno=fam-0003" target="_blank">Gemini</a> and <a href="http://www.fontalicious.com/shopping/FONstore.cgi?user_action=detail&amp;catalogno=fam-0004" target="_blank">Tiajuana</a> by Ben Balvanz of Font-a-licious <br> <br><a href="http://www.fontfont.de/packages/marten1060/marten1060.html" target="_blank">FF Marten</a> by Martin Wenzel <br> <br><a href="http://www.philsfonts.com/phils/sectionssep00/typegf9.html" target="_blank">Gaffe</a> by Rodney Fehsenfeld. (I'm not sure if this is  <br>available from GarageFonts anymore. Many of  <br>Fehsenfeld's fonts are gone from their site. This link  <br>is from a Google search which led to an old page at  <br>Phil's Fonts.) <br> <br><a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=980&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">Leger</a> by Bill Dawson <br> <br>Stephen</p>
