    <p>Hi Guys, </p>
    <p>Just want to share my latest releases.</p>
    <p>Mangerica<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Poster_2_4392.png"></div><br>
    A sans serif, fresh and summery, tried to mix different influences (humanistic, script, geometric) into a consistent look<br>
    <a href="https://www.behance.net/gallery/16573521/Mangerica-Typeface" title="https://www.behance.net/gallery/16573521/Mangerica-Typeface">https://www.behance.net/gallery/16573521/Mangerica-Typeface</a><br>
