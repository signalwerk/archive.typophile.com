    <p>Genica<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Sample_myfonts-04_4755.png"></div><br>
    A sort of brush display font, tryed to convey a happy feeling on this one too<br>
    <a href="https://www.behance.net/gallery/12084847/Genica-Typeface" title="https://www.behance.net/gallery/12084847/Genica-Typeface">https://www.behance.net/gallery/12084847/Genica-Typeface</a><br>
