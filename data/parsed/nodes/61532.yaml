      <p>yes, maybe the "r" needs to be sharper at its top right curve or it needs to be more condensed over all. It just connects so tightly to the shape of the C.<br>
      Another solution would be to have the ascender height be further from the x height  so the opening of the C is more prominent. </p>
      <p>Its bugs me a bit that the right half of the "m" is larger than the left.</p>
      <p>Besides that I think the heaviness of the strokes look nice and well balanced. The forms flow well together. </p>
      <p>Maybe try a few variations with the notes too. Maybe some are connected by a bar like eith notes. You may have already done that.</p>
      <p>Great start.</p>
