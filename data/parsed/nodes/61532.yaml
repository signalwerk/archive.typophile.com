    <p>Hello!</p>
    <p>I'm making a logo for a female choir consisting of five women. They usually sing choir versions of various pop songs. The name is spanish and means "with cream" suggesting that they are that little extra, coffe with cream as an example.</p>
    <p>This my first rough scetch of a possible version. The five notes represent the five members of the group. Tried some colours as well.</p>
    <p>Feedback much appreciated</p>
    <p>peter</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/concrema_v1_5801.2.jpg"></div><p></p>
