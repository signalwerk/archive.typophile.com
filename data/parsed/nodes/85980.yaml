      <p><em>"De gustibus non est disputandum,"</em> Thomas Aquinas rightly said. Matters of taste cannot be disputed.</p>
      <p>Some would argue that ragged right is, indeed, casual; it is justified text which has no sense of humor. And what is "humor'? Slapstick? Self-deprecation? Sarcasm? Irony? Are the intended readers so dense that, unless the style is obviously humorous, they will have no idea at all that the content is meant to be?</p>
      <p>In other words: don't overthink it, dude. If it looks good as it stands, then go with it. Or, simply change the font to Comic Sans: even people whose sole intellectual achievement is typing LOL in some social media space will get it, Oh: this is supposed to be funny! Umm. Wait a minute: where are the cat videos?</p>
      <p>Okay: maybe they<strong> won't</strong> get it. But you get it, don't you?</p>
