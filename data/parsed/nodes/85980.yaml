      <p>I agree with oldnick; I don't think a humor book needs to scream "funny" to its readers via typography. But if your friend's book was looking too business-like, perhaps a more casual or quirky headline font might help. You could also make use of photos, illustrations, pulled quotes, etc.</p>
      <p>You might want to check out the humor section at your bookstore for examples. For example, here's a page from a best-selling humor book by Steve Martin.</p>
