    date: 2004-09-14T11:52:00
    date_raw: 14 Sep 2004 — 11:52am
    votes: null
    html: "<p>They're sort of just called \"constructed\" fonts, although that also makes one think of the 20th century \"Soviet-style\" stuff, or the cut&amp;paste fad of the 90s. But if you're looking for a term for fonts that include the \"scaffolding\" so to speak in there, I don't know a term for that - probably because I know of only one such design: Agfa's Rubino. <br> <br>In terms of references, Matthew Carter has written one of the very few substantial articles about the topic: \"Theories of Letterform Construction\", in issue #26-27 (AKA Volume 13-#2 &amp; Volume 14-#1) of the APHA Journal*. That was \"Part 1\", but unfortunately it looks like part 2 won't happen. Carter lists Pacioli, Durer and Tory as having tried their hand at geometrically constructed capitals. <br> <br>* <a href=\"http://www.printinghistory.org/htm/journal/contents.html#26_27\" target=\"_blank\">http://www.printinghistory.org/htm/journal/contents.html#26_27</a> <br> <br>A harder reference to find is Oldrich Hlavsa's amazing \"A book of type and design\" of 1960. Part of it is dedicated to geometrically constructed alphabets, and besides Tory and Pacioli he covers Pierre le Be, Jean de Vingle, and Damiano da Moille. Besides that, Hlavsa's book contains many \"lost\" gems of type design as well, plus some interesting personal thoughts on type. <br> <br>BTW, I once bought a facsimile of Durer's \"Of the Just Shaping of Letters\" for $10, and it contains comprehensive sketches and full discussions of the whole A-Z, and even an attempt at geometrically constructing blackletter lowercase at the end. I just checked bookfinder.com and it looks like it's available for as low as $3.50. <br> <br>hhp</p>"
    html_clean: "<p>They're sort of just called \"constructed\" fonts, although that also makes one think of the 20th century \"Soviet-style\" stuff, or the cut&amp;paste fad of the 90s. But if you're looking for a term for fonts that include the \"scaffolding\" so to speak in there, I don't know a term for that - probably because I know of only one such design: Agfa's Rubino. <br> <br>In terms of references, Matthew Carter has written one of the very few substantial articles about the topic: \"Theories of Letterform Construction\", in issue #26-27 (AKA Volume 13-#2 &amp; Volume 14-#1) of the APHA Journal*. That was \"Part 1\", but unfortunately it looks like part 2 won't happen. Carter lists Pacioli, Durer and Tory as having tried their hand at geometrically constructed capitals. <br> <br>* <a href=\"http://www.printinghistory.org/htm/journal/contents.html#26_27\" target=\"_blank\" class=\"link-external\">http://www.printinghistory.org/htm/journal/contents.html#26_27</a> <br> <br>A harder reference to find is Oldrich Hlavsa's amazing \"A book of type and design\" of 1960. Part of it is dedicated to geometrically constructed alphabets, and besides Tory and Pacioli he covers Pierre le Be, Jean de Vingle, and Damiano da Moille. Besides that, Hlavsa's book contains many \"lost\" gems of type design as well, plus some interesting personal thoughts on type. <br> <br>BTW, I once bought a facsimile of Durer's \"Of the Just Shaping of Letters\" for $10, and it contains comprehensive sketches and full discussions of the whole A-Z, and even an attempt at geometrically constructing blackletter lowercase at the end. I just checked bookfinder.com and it looks like it's available for as low as $3.50. <br> <br>hhp</p>"
