  html: "<p>Hello, all! I am not a type designer and my level of knowledge about fonts is relatively scant. I've run into a question/problem that I have not been able to find an answer for, so I'm here hoping you'll help. <br> <br>When designing fonts, I've seen various geometric shapes (circles, lines, curves, etc) used to create the shape of the font. For example, notice the words \"Da Vinci\" in this image: <a href=\"http://www.keynotethemepark.com/content/pages/T3/davinci/davinci_01.jpg\" target=\"_blank\">http://www.keynotethemepark.com/content/pages/T3/davinci/davinci_01.jpg</a> <br> <br>What is this process called? Where can I find more information about it? My final goal is to perhaps locate a font that looks like this for a \"Roman Architecture\"-style website. <br> <br>Any hints or clues? <br> <br>Thanks in advance for any help offered. <br> <br>Peter <br>Columbus, Ohio USA</p>"
  html_clean: "<p>Hello, all! I am not a type designer and my level of knowledge about fonts is relatively scant. I've run into a question/problem that I have not been able to find an answer for, so I'm here hoping you'll help. <br> <br>When designing fonts, I've seen various geometric shapes (circles, lines, curves, etc) used to create the shape of the font. For example, notice the words \"Da Vinci\" in this image: <a href=\"http://www.keynotethemepark.com/content/pages/T3/davinci/davinci_01.jpg\" target=\"_blank\" class=\"link-external\">http://www.keynotethemepark.com/content/pages/T3/davinci/davinci_01.jpg</a> <br> <br>What is this process called? Where can I find more information about it? My final goal is to perhaps locate a font that looks like this for a \"Roman Architecture\"-style website. <br> <br>Any hints or clues? <br> <br>Thanks in advance for any help offered. <br> <br>Peter <br>Columbus, Ohio USA</p>"
