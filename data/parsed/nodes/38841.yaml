    <p>Hello everyone,</p>
    <p>I am really glad to be part of this forum and I know I will learn a whole lot from everyone which is the major reason why I joined...to learn.</p>
    <p>I am new to making fonts and I’ll like you guyz to please forgive me if my questions are kinna frustrating...anyways...I’ll try to make them reasonable...</p>
    <p>I have some questions to ask and will be glad to read from somebody soon...</p>
    <p>1. As a font artiste how do I start a project (I mean how do I start designing a set of fonts and glyphs). I think there has to be some sketches on paper of alphabets/characters, numerals and glyphs before drawing begins on my computer.</p>
    <p>I know there are some pros In this forum, can you please share some beginning tips with me...</p>
    <p>2. I am still not clear on the differences between characters and glyphs...can someone please break it down for me.</p>
    <p>3. Let’s say I want to create an EPS file for a set of alphabets in Illustrator to be used in Fontlab (my preferred font-making and editing application), does this mean an eps file will be for an alphabet and 26 eps files for the 26 alphabets.</p>
    <p>If yes, cant I have them in a single illustrator file.</p>
    <p>Regards,<br>
    ’kk’</p>
