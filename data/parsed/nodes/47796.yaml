      <p>I like your website.  I remember you working up a logo for this a while ago.  I think your solution works great.</p>
      <p>It's interesting for me to read about paella from a German point of view, considering that I am an American of Spanish descent (separated, admittedly, by many generations, and the establishment of family roots in the colony of Puerto Rico).</p>
      <p>A major issue I have with the site is your use of the red chili peppers as part of your menu navigation.  Paella doesn't call for red chili peppers (at least none of the traditional recipes I'm familiar with).  Plus, with my American eyes, it reads as a reference to Mexican food, and not Spanish food.  Or it could read as a reference to <a class="freelinking external" href="http://en.wikipedia.org/wiki/Chili%27s" rel="nofollow">Chili's restaurant</a>, an American restaurant chain.  It could be fun, instead, to have little images of the traditional ingredients of paella: chicken, chorizo sausage (from Spain and Portugal, again, not the Mexican kind), clams, shrimp, mussels, etc.</p>
      <p>Additionally, the image of the paella bowl on the right side of the screen seems not to balance the rest of the elements on the left.  I would be more satisfied to see the menu and content div centered.  It's feeling a bit lopsided right now.  If you can think of arguments to keep it as it is, I would be open to hearing them, of course. </p>
      <p>--<br>
      Nick Hladek</p>
