    <p>Hi,</p>
    <p>Please rip my <a class="freelinking external" href="http://pedros-paella.designbits.de" rel="nofollow">new website</a> apart.</p>
    <p>It's essentially a one-man business of a guy who comes to people's homes to cook a fabulous paella for them. The focus in this project was on the website itself. Along the way, we also decided to brush up his logo a little.</p>
    <p>Please can you give me some feedback as to what could be improved further in this website?</p>
    <p>Thanks a lot for any input!</p>
    <p>P.S. Sorry for the website being in German only, but most of you will get the gist of it!</p>
