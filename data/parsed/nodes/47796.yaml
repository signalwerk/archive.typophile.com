    html: |-
      <p>Now, I'm just an Irish woman who grew up in New England so take (or toss) my opinion with that in mind. </p>
      <p>When I think of paella, I see family gatherings. I see earthy warmth, generations of tradition, and the gathering of family itself is the very cause to prepare this feast. I see aprons spattered with sauce, oversize wooden picnic tables cluttered with colorful plates, and children hovering relentlessly for hours. Stone fireplaces, cast iron skillets, and rugged clay tiles. Heck, there's even a big headed dog wagging about. I can feel the silky fingers of a scrappy grandmother, warmly clutching my wrist as she feeds me a taste off a wooden spoon. I can't see any reason to be anywhere else on earth. (I smile and sip red wine from a clunky goblet made of blue glass...)</p>
      <p>Your website is clean and almost plastic looking. Where's the texture? Where's the tradition? Where's the fun? The unity? It just feels way too sterile.</p>
      <p>Again, <em>my people</em> gather around cold steel kegs of beer - so maybe my impression of a paella feast is way off. Is it?</p>
