      <p><em>"the answer to a question that nobody asked…"</em></p>
      <p>In this instance, “What available font would most closely substitute for the font in this document, were it not available or embedded in the document?”</p>
      <p>Panose, for all its proﬁling, doesn’t deal with the most relevant parameter of this problem, which is character count, offering a mix of descriptions in several unrelated categories, and using the upper case /O as the basis of its measurement. Given that arguably the most pertinent substitution issue is reﬂow of U&amp;lc text, Panose almost completely fails to address the issue.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Panose3_6678.jpg"></div><br>
      If a typographer were designing a substitution algorithm, it would include a U&amp;lc character count, just like the type specimens that type shops used to produce in the mid 20th century.<p></p>
      <p><em>"…makes my brain hurt…"</em></p>
