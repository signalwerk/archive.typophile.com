    html: |-
      <p>Character count is the average number of characters in a given amount of line length at a particular size. Ideally, it is weighted for individual character frequency in a given language. It is important for font substitution <em>if</em> one of the goals of font substitution is to avoid, as far as possible, document reflow. In other words, if font substitution should not make a document appreciably longer or shorter, or bump content that fits on one line with font A onto two lines with font B.</p>
      <p>Panose, as Nick notes, fails to address character count. Instead it tries to match something like 'look and feel' of typefaces according to their proportions, weight and some stylistic features.</p>
    html_clean: |-
