    <p>Hello everybody,</p>
    <p>Today we are releasing new version of Microsoft VOLT 1.3. There are lots of new features and improvements in this version, here are just a few: </p>
    <p> - New font explorer allows font designer to quickly search and navigate through the project.<br>
     - Usability improvements, including lookup comments, new UI options, and detailed error messages.<br>
     - Huge performance improvements on complex font projects.<br>
     - Uniscribe and sample files are updated to match ones shipped with Windows Vista SP1.</p>
    <p>I am copying full release notes below. If you did not use VOLT before and want to try it now, you will have to join <a class="freelinking external" href="http://groups.msn.com/MicrosoftVOLTuserscommunity" rel="nofollow">Microsoft VOLT users community</a>. Download link and release notes are available on version history page.</p>
    <p>Thanks,<br>
    Sergey</p>
    <p><strong>Microsoft VOLT 1.3.254 release notes</strong></p>
    <p><em>Overview</em></p>
    <p>Since last public VOLT release two years ago, we have added various features and made improvements across the entire product. Here is quick list of changes, followed by detailed description:</p>
    <p>  -	Font explorer, allowing users to quickly search for glyph references inside lookups.<br>
      -	Usability improvements, including lookup comments, new UI options and detailed error messages.<br>
      -	Compilation improvements in quality, compatibility, and performance.<br>
      -	Overall performance improvements, including import, export, and font size.<br>
      -	Updated supplemental files and tags list.<br>
      -	Multiple bug fixes across VOLT including the compiler, project import and export and across the UI.</p>
    <p><em>Font Explorer</em></p>
    <p>Font Explorer allows font designer to instantly search project lookups for any appearance of the glyph, wherever it referenced directly or as part of glyph group. Users may also search for a sequence of glyphs. Search can be controlled by several parameters in the Explorer window. </p>
    <p>From search results, a font developer can quickly jump to a particular line inside a lookup input or context. This can be done by Ctrl-clicking on the corresponding line in the search results. By Alt-clicking on a lookup or group name, user can open the corresponding lookup or glyph group. When user clicks on glyph name, VOLT will jump to glyph definition inside glyph editor. Same Alt-Click is also enabled in the lookup window (inside both input or context fields).</p>
    <p>Font Explorer can be accessed by clicking 'Explore' button on the toolbar or from Tools menu.</p>
    <p><em>Lookup comments</em></p>
    <p>Font designers can now add comments to each lookup in font project. If one of comment lines starts with “TODO:”, it is considered special to-do item for this lookup. Lookup comments can be added from lookup window menu.</p>
    <p><em>Main window</em></p>
    <p>Main window now supports view options allowing the display of detailed information about lookups and glyph groups right inside main project window. Lookup list can also display lookup content, comments, or to-do action items. Glyph group can show group content. View options can be controlled from the redesigned options dialog.</p>
    <p>VOLT now remembers main form size and position, view options, and font sizes used in other VOLT windows. Overall form layout had changed, giving more space to lookup and group lists. Feature tree opens in compact state, with lookup lists collapsed by default.</p>
    <p><em>Project improvements</em></p>
    <p>Performance is significantly improved for project compilation, loading and saving. It is now several times or even tens of times faster on complex fonts. Font file size is also improved by avoiding keeping intermediate compilation tables.</p>
    <p>Option had been added to avoid overwriting the cmap table from VOLT, allowing cmap editing by other font tool like FontLab.</p>
    <p>Support had been added for FontLab glyph syntax in lookups and the proofing tool. ‘/’ is now allowed as a separator between glyph along with space and comma, enabling simple copy-paste from FontLab.</p>
    <p>Detailed error messages for various problems with project import and editing have been added.</p>
    <p><em>Compilation</em></p>
    <p>Detailed error messages added for some compilation errors and invalid project sources.</p>
    <p>Maximum number of components per ligature is increased from 6 to 16.</p>
    <p>Vertical form substitution features ‘vert’ and ‘vrt2’ are compiled in a way that is compatible with GDI.</p>
    <p><em>Other changes</em></p>
    <p>Updated usp10.dll and sample fonts to versions shipped with Windows Vista SP1.</p>
    <p>Tags.txt file updated, including recently added features and the new Indic v.2 tags .</p>
    <p>Kern2Volt updated to support longer glyph names (up to 255 characters).</p>
    <p>Multiple bug fixes.</p>
