      <p>Good point :). I was just announcing new version of the tool, assuming people know what it is. </p>
      <p>VOLT is a free tool released by Microsoft allowing font designers to develop OpenType layout features. It is widely used by people creating fonts with complex layout logic, especially fonts for complex scripts.</p>
      <p>You can read more about it on <a class="freelinking external" href="http://www.microsoft.com/typography/VOLT.mspx" rel="nofollow">Microsoft VOLT home page</a>.</p>
      <p>Thanks,<br>
      Sergey</p>
