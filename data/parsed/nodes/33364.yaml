      <p>It's no fun being discouraging to a student, but I would advise running away from this as fast as you can. Besides the ethical issues, the main thing is this type of effort is boring as hell. :-/  Yes, look at existing fonts, but make your own forms from your own head - that's what makes it interesting.</p>
      <p>That said you have a very good point concerning the static nature of most sans designs (including Frutiger). When you're making your forms from scratch try sheared/concave terminals but also experiment with a slight slant.</p>
      <p>hhp</p>
