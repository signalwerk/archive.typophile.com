    <p>Hi, everyone. This is my first foray into typeface design. I've designed this for a class I'm taking.</p>
    <p>It is inspired by Frutiger. My idea was to add an arc to the ascenders and an opposite arc to the descenders to create a sense of movement. I've felt that sometimes sans serifs are too static and could use a little excitement. </p>
    <p>I appreciate any constructive criticism you can offer.</p>
    <p>Thanks,<br>
    Doug</p>
