      <p>To me it looks like Frutiger created on a bad press. I like the little flashes but don't think they're suitable on a font like this. Frutiger was designed for legibility - Charles de Gaulle Airport I think (I suspect Stephen will have more idea than me) Hence it was never intended as a font with "movement". My personal opinion is that it is deathly dull, but we suffer from a total overload of it in the UK and I'm using it on a particularly uninspring project at the moment so I'm a little biased. It is however very successful at it's job (without opening up the legibility debate AGA!N)</p>
      <p>I think you need a more suitable typeface to "inspire" your idea.</p>
