      <p>Two problems you might have:</p>
      <p>1. There is already a typeface called <a href="http://emigre.com/EF.php?fid=87" rel="nofollow">Dalliance</a>.</p>
      <p>2. It's considered unethical to use the outlines of <a href="http://www.fontshop.com/fonts/singles/monotype/myriad_pro_regular/&amp;sample_text=sans%20arc&amp;sample_size=110" rel="nofollow">another font</a> to create your own.</p>
      <p>I think you have some interesting ideas with the stroke endings, but you need to build your typeface from scratch.</p>
