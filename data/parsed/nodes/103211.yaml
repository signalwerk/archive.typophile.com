    <p>I am using Dicot Medium in a logo, but the client asked if this is a system font. Honestly, I don't know. Nor was was I concerned... if it looks right, what does it matter if it is or isn't?<br>
    But I understand the need for exclusivity and the safety of a custom or rare font for logo designs (it didn't stop Instagram... until recently). So I turn to you, fellow font friends. What are the origins of Dicot?</p>
