    html: |-
      <p>If it's a system font (but which system? :-) then you don't need to install it (which might further involve licensing it). Dicot isn't a system font on any system AFAIK but -being a freebie- isn't exactly custom or rare either... And I don't understand your search for its "origins".</p>
      <p>My advice: Find a good font that's not free (which helps make it less common) and convince people it's a good idea to use it.</p>
      <p>hhp</p>
