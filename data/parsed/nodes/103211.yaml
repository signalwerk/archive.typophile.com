      <p>The key words are "no budget" with the client. As soon as I mentioned purchasing a font, he shook his head and said Dicot is fine. I think my mistake was not anticipating the need to purchase a new typeface in the proposal. I'll remember to include this in the next gig.</p>
      <p>@George: Yes, I think we're all adults here and realize one would normally find all of life's questions on Google. The answer is 42, by the way.</p>
      <p>@Michael: So Dicot is basically a ripoff or potentially a font from Photo Lettering?</p>
