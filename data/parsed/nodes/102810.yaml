  html: |-
    <p>Hello there,</p>
    <p>I'm trying to find the subtitle font(s) used in the Italian theatrical version of "Star Wars" (around 1978). The attached images show a few shots of it. To me it looks like a mix of letters from both Gill Sans and Johnston... but I'm not sure. Is there possibly a single font that represents this?</p>
    <p>Thanks in advance!</p>
