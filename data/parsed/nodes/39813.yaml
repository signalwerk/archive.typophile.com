      <p>Well, scientist already tried that with human faces. Take 100 portraits and morph them togheter. You will get a face, that everyone will consider beautiful. But still, most people will prefer a beautiful face of a real person.<br>
      I guess the same is true for typefaces. A "perfect" typeface is one that fulfills its purpose. An avarage typeface will never be perfect, because it is not optimized for a certain purpose. </p>
      <p>But nevertheless I would love to see a this typeface! :-)</p>
      <p>Ralf</p>
