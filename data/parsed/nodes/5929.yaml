    html: "<p>Here's the image, adjusted to fit this forum in a way that the letterforms are more recognizable: <br> <br><img src=\"https://web.archive.org/web/20081121161804im_/http://www.typophile.com/forums/messages/83/42127.gif\" alt=\"mcdonnell\"> <br> <br>My guess is that it was custom-drawn some 40 years ago. It bears similarities to various faces, but there's an unevenness that I think either speaks to the original design or a bad digitization of the original. Either way I don't know what would match it.</p>"
