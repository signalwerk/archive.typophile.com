    <p>Hi everyone. I once again came here for help. I registered too cause you guys always helped me solve my problems, and I'm sure I'll be coming back for more. <img src="https://web.archive.org/web/20081121161804im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I'm stuck with the font of McDonnell Douglas. I have an eps file from <a href="https://web.archive.org/web/20081121161804/http://www.brandsoftheworld.com/" target="_blank">www.brandsoftheworld.com</a> but that only contains those main charachters. <br> <br><a href="https://web.archive.org/web/20081121161804/http://web.brandsoftheworld.com/download/?id=4838" target="_blank">http://web.brandsoftheworld.com/download/?id=4838</a> <br> <br>I used the "whatthefont" function of myfonts.com but couldn't find the font. I was hoping someone could help me.</p>
