    <p>When I was coding features for Frode (<strong><a href="http://typophile.com/node/71588" rel="nofollow">Automatic indexed numerals</a></strong>), I have noted, that they only work, if I put the substitution rules into lookups. In case of the ss01 feature, I need at least one lookup, because I wanted to make use of the same rules in the ss02 feature. But I absolutely don’t know, why it was required to create more than one lookup in the ss01 feature. And in case of the calt feature my consideration was, that I don’t need lookups at all. So I would like to know, why the ss01 and the calt feature don’t work without lookups and how I can determine, how many lookups I need and how many rules I can put into a lookup. With regard to the lookups the three feature files are the result of try and error, but this is not an effective working method, because it costs time and additionally I am not sure, whether my lookups are the best way with regard to the compilation or compression of the font (the aesthetic of the code).</p>
    <p>And another thing, that I don’t understand is, why I cannot call a lookup more than one time (where the one time is the definition itself) in a feature. With regard to that question have a view into <a href="http://typophile.com/files/2_Features%20%5Balternative%20ss01%20and%20ss02%5D.fea_.txt" rel="nofollow">2_Features [alternative ss01 and ss02].fea_.txt</a>.</p>
    <p>Here are all the three files (They work exactly as intended; tested in FLS.):</p>
    <ul>
    <li><a href="http://typophile.com/files/1_Features%20%5Bss01%20and%20ss02%5D.fea_.txt" rel="nofollow">1_Features [ss01 and ss02].fea_.txt</a></li>
    <li><a href="http://typophile.com/files/2_Features%20%5Balternative%20ss01%20and%20ss02%5D.fea_.txt" rel="nofollow">2_Features [alternative ss01 and ss02].fea_.txt</a></li>
    <li><a href="http://typophile.com/files/3_Features%20%5Bcalt%5D%20%5Bbased%20on%201%5D.fea_.txt" rel="nofollow">3_Features [calt] [based on 1].fea_.txt</a></li>
    </ul>
