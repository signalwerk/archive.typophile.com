      <p>To answer your original question: </p>
      <p>In AFDKO 1.6 (and 2.5) syntax, which works in FLS5, you can write: </p>
      <p><code>feature ss01 {<br>
      lookup ss01a {<br>
      sub a by a.ss01;<br>
      } ss01a;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      lookup ss02b {<br>
      sub b by b.ss02;<br>
      } ss02b;<br>
      } ss02;</code></p>
      <p><code>feature salt {<br>
      lookup ss01a;<br>
      lookup ss02b;<br>
      } salt;</code></p>
      <p>but you cannot write</p>
      <p><code>feature ss01 {<br>
      lookup ss01a;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      lookup ss02b;<br>
      } ss02;</code></p>
      <p><code>feature salt {<br>
      lookup ss01a {<br>
      sub a by a.ss01;<br>
      } ss01a;<br>
      lookup ss02b {<br>
      sub b by b.ss02;<br>
      } ss02b;<br>
      } salt;</code></p>
      <p>i.e. at the first occurance of a lookup, you need to <strong>define and use it</strong>, and in later occurances, you can just <strong>use</strong> it by referring to it by its name. But you cannot just "use" a lookup before defining it. </p>
      <p>In AFDKO 2.5 syntax (but not in 1.6), which will work in FOG5 and FLS6 but not in FLS5, you can also write: </p>
      <p><code>lookup ss01a {<br>
      sub a by a.ss01;<br>
      } ss01a;</code></p>
      <p><code>lookup ss02b {<br>
      sub b by b.ss02;<br>
      } ss02b;</code></p>
      <p><code>feature ss01 {<br>
      lookup ss01a;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      lookup ss02b;<br>
      } ss02;</code></p>
      <p><code>feature salt {<br>
      lookup ss01a;<br>
      lookup ss02b;<br>
      } salt;</code></p>
      <p>so you "just define" the lookups first — outside of any feature definitions —, and then you "just use" them within the feature definitions. Using this form, you don't have to worry about the ordering of your feature definitions — because the <strong>ordering of the lookups</strong> is always the only thing that matters. </p>
      <p>In the AFDKO 1.6 syntax, the ordering of lookups was implied by the ordering of the feature definitions, but in some cases it was impractical: imagine that you have three lookups: <code>alpha</code>, <code>beta</code> and <code>gamma</code>, and that the lookups <code>alpha</code> and <code>gamma</code> are associated with the <code>smcp</code> feature, while the lookup <code>beta</code> is associated with the <code>ss01</code> feature. When only <code>smcp</code> is applied, then the lookups <code>alpha</code> and <code>gamma</code> should be executed, when only <code>ss01</code> is applied, then the lookup <code>beta</code> should be executed, but if both features are applied at the same time, the lookups should be executed in the order <code>alpha</code> (that is associated with the <code>smcp</code> feature), then <code>beta</code> (that is associated with the <code>ss01</code> feature), and then <code>gamma</code> (that is associated with the <code>smcp</code> feature). With the AFDKO 1.6 syntax, where you can only define lookups inside of feature definitions, it was impossible to order the feature definitions in such a way that could achieve such a goal. This is why I asked Adobe to allow lookup definitions to be written outside of feature definitions in AFDKO 2, and they so did — which is handy.</p>
