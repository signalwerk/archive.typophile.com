      <p><code>&gt; feature calt {<br>
      &gt; sub bracketleft one one' bracketright by A;<br>
      &gt; sub one' A by A;<br>
      &gt; } calt;</code></p>
      <p>&gt; But with the code above [11] results in [1A].</p>
      <p>There is one lookup defined in your <code>calt</code> feature (implicitly). Your feature definition is equivalent to: </p>
      <p><code>feature calt {<br>
      lookup delta {<br>
      sub bracketleft one one' bracketright by A;<br>
      sub one' A by A;<br>
      } delta;<br>
      } calt;</code></p>
      <p>You have the input glyph run <code>[11]</code>.</p>
      <p>The lookup <code>delta</code> steps through the glyphs one by one: </p>
      <p>1. First, the glyph <code>[</code> is "current". The lookup is searched for the best match, and finds none. </p>
      <p>2. Then, the first glyph <code>1</code> is current. The lookup is searched for the best match, and finds none. </p>
      <p>3. Then, the second glyph <code>1</code> is current. The lookup is searched for the best match, and finds the match in the rule <code>sub bracketleft one one' bracketright by A;</code>, so it executes it. The current glyph is substituted by <code>A</code>. </p>
      <p>4. Finally, the glyph <code>]</code> is current, and no match is found. </p>
      <p>So the output run is <code>[1A]</code>. </p>
      <p>The code</p>
      <p><code>&gt; feature calt {<br>
      &gt; lookup alpha {<br>
      &gt; sub bracketleft one one' bracketright by A;<br>
      &gt; } alpha;<br>
      &gt; sub one' A by A;<br>
      &gt; } calt;</code></p>
      <p>defines two lookups, so it's equivalent to</p>
      <p><code>feature calt {<br>
      lookup alpha {<br>
      sub bracketleft one one' bracketright by A;<br>
      } alpha;<br>
      lookup beta {<br>
      sub one' A by A;<br>
      } beta;<br>
      } calt;</code></p>
      <p>You have the text run <code>[11]</code>. </p>
      <p>First the lookup <code>alpha</code> is executed, and after skipping the first two glyphs, the second <code>1</code> gets a match for the rule <code>sub bracketleft one one' bracketright by A;</code>, so it's executed. At the end of the lookup execution, the output run is <code>[1A]</code>. </p>
      <p>Then the lookup <code>beta</code> is executed on the <strong>output run</strong> of the previous lookup, i.e. on the glyph run <code>[1A]</code>. After skipping the glyph <code>[</code>, the glyph <code>1</code> hits a match for the rule <code>sub one' A by A;</code>, so the rule is executed, and the glyph gets substituted by <code>A</code>. So the final output run is <code>[AA]</code>. </p>
      <p>Very simple and logical. But only if you remember that the <code>lookup</code> statement in the AFDKO syntax is always implied if it is not defined. In fact, I recommend using it explicitly, especially in contextual substitutions, to keep track what's going on. </p>
      <p>It's kind of similar to our previous discussion about languagesystems, when I recommended to always spell out <code>script latn</code>, <code>language dflt</code> and <code>include_dflt</code> in feature definitions that define different behaviors for different languagesystems, rather than relying on the implied use of those statements. </p>
      <p>The general rule is: the implicit definitions are useful for simple situations, when you mean to say "all languagesystems" (in case of languagesystems) or "one lookup" (in case of lookup definitions within feature definitions). But mixing explicit and implicit definitions is a road to hell when it comes to debugging, so it's always better to spell everything out explicitly if your code becomes more complex. </p>
      <p>Best,<br>
      Adam</p>
