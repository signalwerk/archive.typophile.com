      <p>@ Adam</p>
      <p>Well, the principle seems to be indeed simple, but it can be hard, not to loose the overview. In case of the lookups "Index 1" and "Index 2" from <strong><a href="http://typophile.com/files/3_Features%20%5Bcalt%5D%20%5Bbased%20on%201%5D.fea_.txt" rel="nofollow">the calt feature</a>,</strong> that I have coded for Frode, the comprehension was much harder. I really had to comprehend step by step, why the one and only rule of lookup Index 2 cannot be put into the end of lookup Index 1, although the last rule of lookup Index 1 can be put in the begin of lookup Index 2.</p>
      <p>(Notice to myself: Check, if only lines can be commented in code [with the number sign] or also whole blocks with begin and end markers.)</p>
      <p>I think, that I meanwhile understand the very most of your explanations and extra information except from the problem, about which I was talking in the second paragraph of my previous message.</p>
      <p>The first call of the lookup beta is the definition of the lookup beta and it cannot be called more than one time with the same languagesystem statement.</p>
      <p><code>feature calt {<br>
      lookup beta { #Definition of lookup beta AND call of lookup beta.<br>
      sub one' A by A;<br>
      } beta;<br>
      lookup beta; #unsuccessful call of lookup beta, that was defined above.<br>
      } calt;</code></p>
      <p>The substitution is not well chosen, but that is unimportant in this context. There are cases, in which it would be useful to call a lookup a second time in the same feature and under the same languagesystem statement without defining it a second time. Not only with regard to the comprehension of the own code, but probably also with regard to the file size.</p>
