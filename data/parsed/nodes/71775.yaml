      <p>Okay, I am simplifying my questions.</p>
      <p>Why is the lookup needed in the following code?:</p>
      <p><code>feature calt {<br>
      lookup alpha {<br>
      sub bracketleft one one' bracketright by A;<br>
      } alpha;<br>
      sub one' A by A;<br>
      } calt;</code></p>
      <p>[11] is replaced by [AA] as intended.</p>
      <p><code>feature calt {<br>
      #lookup alpha {<br>
      sub bracketleft one one' bracketright by A;<br>
      #} alpha;<br>
      sub one' A by A;<br>
      } calt;</code></p>
      <p>But with the code above [11] results in [1A].</p>
      <p>Second question: Why can’t I call a lookup registered with the same languagesystem statement?</p>
      <p>I cannot code …</p>
      <p><code>feature calt {<br>
      lookup alpha {<br>
      sub bracketleft one' bracketright by A;<br>
      sub bracketleft one one one' bracketright by A;<br>
      sub bracketleft one one' bracketright by A;<br>
      } alpha;<br>
      lookup beta {<br>
      sub one' A by A;<br>
      } beta;<br>
      lookup beta;<br>
      } calt;</code></p>
      <p>… but I have to code</p>
      <p><code>feature calt {<br>
      lookup alpha {<br>
      sub bracketleft one' bracketright by A;<br>
      sub bracketleft one one one' bracketright by A; #The first one will be substituted in lookup gamma, the second one in beta.<br>
      sub bracketleft one one' bracketright by A; #The first one will be substituted in lookup beta.<br>
      } alpha;<br>
      lookup beta {<br>
      sub one' A by A;<br>
      } beta;<br>
      lookup gamma {<br>
      sub one' A by A;<br>
      } gamma;<br>
      } calt;</code></p>
      <p>How can I make out, that I manually have to add a lookup without testing?</p>
