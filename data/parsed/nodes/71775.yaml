      <p>If you're paying close attention, you might ask why I wrote</p>
      <p><code># Variant 1</code></p>
      <p><code>feature ss01 {<br>
      lookup ss01a {<br>
      sub a by a.ss01;<br>
      } ss01a;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      lookup ss02b {<br>
      sub b by b.ss02;<br>
      } ss02b;<br>
      } ss02;</code></p>
      <p><code>feature salt {<br>
      lookup ss01a;<br>
      lookup ss02b;<br>
      } salt;</code></p>
      <p>when I could have just written: </p>
      <p><code># Variant 2</code></p>
      <p><code>feature ss01 {<br>
      lookup ss01a {<br>
      sub a by a.ss01;<br>
      } ss01a;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      lookup ss02b {<br>
      sub b by b.ss02;<br>
      } ss02b;<br>
      } ss02;</code></p>
      <p><code>feature salt {<br>
      sub a by a.ss01;<br>
      sub b by b.ss02;<br>
      } salt;</code></p>
      <p>which would be equivalent to</p>
      <p><code># Variant 2 explicit</code></p>
      <p><code>feature ss01 {<br>
      lookup ss01a {<br>
      sub a by a.ss01;<br>
      } ss01a;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      lookup ss02b {<br>
      sub b by b.ss02;<br>
      } ss02b;<br>
      } ss02;</code></p>
      <p><code>feature salt {<br>
      lookup saltab {<br>
      sub a by a.ss01;<br>
      sub b by b.ss02;<br>
      } saltab;<br>
      } salt;</code></p>
      <p>In other words: why did I choose to use two lookups in <code>salt</code> (in Variant 1), when the output run of the first lookup is not related to the input run of the second lookup. Indeed, I could have used Variant 2. </p>
      <p>Basically, Variant 1 means that I save a little bit of space in the font (because I only define two lookups instead of three), but it means that I lose a tiny bit of performance, because the <code>salt</code> feature executes two lookups one after another, rather than just one. On the other hand, Variant 2 menas that I speed up the performance a tiny bit, but I lose a few bytes of space in the font size. </p>
      <p>The differences are so minute that I wouldn't worry. It's just a matter of code optimization vs. code brevity. If I want code that is simpler to read and edit, I choose Variant 1. If I want perfect speed optimization, I choose Variant 2. </p>
      <p>Hope this helps,<br>
      Adam</p>
