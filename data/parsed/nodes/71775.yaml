      <p>Arno, </p>
      <p>I think what you're really asking for is when to put substitutions into one lookup vs. separate lookups. After all, </p>
      <p><code>feature ss01 {<br>
      sub a by a.ss01;<br>
      } ss01;</code></p>
      <p>really is equivalent to</p>
      <p><code>feature ss01 {<br>
      lookup ss01_01 {<br>
      sub a by a.ss01;<br>
      } ss01_01;<br>
      } ss01;</code></p>
      <p>On the other hand, </p>
      <p><code>feature ss01 {<br>
      lookup ss01_01 {<br>
      sub a by a.ss01;<br>
      } ss01_01;<br>
      sub b by b.ss01;<br>
      } ss01;</code></p>
      <p>is equivalent to: </p>
      <p><code>feature ss01 {<br>
      lookup ss01_01 {<br>
      sub a by a.ss01;<br>
      } ss01_01;<br>
      lookup ss01_02 {<br>
      sub b by b.ss01;<br>
      } ss01_02;<br>
      } ss01;</code></p>
      <p>The statement <code>lookup</code> in the AFDKO syntax can be omitted for brevity — then all substitutions within one feature definition (or those before an explicit <code>lookup</code> opening or after an explicit closing of a lookup) are treated as one lookup. However, I recommend always at least thinking in terms of lookups, i.e. as if the <code>lookup</code> statements were always there. </p>
      <p>&gt; How can I make out, that I manually have to add a lookup without testing?</p>
      <p>That's very easy. </p>
      <p>1. The OpenType Layout engine splits the line into "runs" of glyphs of the same font formatting (family, style, size, color etc.), script (writing system) and directionality (LTR, RTL). For continuous Latin-script text set in the same font, one line is one run. </p>
      <p>2. Within each run of glyphs, all lookups associated with the features that are being applied to the run, are executed in the order defined within the font (the ordering of the lookups, or in the AFDKO syntax, the order of the feature definitions and the lookup definitions within them). </p>
      <p>3. Each lookup is executed in one pass through the current run of glyphs. </p>
      <p>4. Each pass proceeds through the run glyph by glyph. The substitutions defined in the lookup are searched for the "best match" for the current glyph, and if found, that best match is executed. This modifies the run and proceeds to the next unprocessed glyph. If no best match is found, it proceeds to the next glyph (without modifying the run).  </p>
      <p>5. After one lookup has been executed, the next lookup is executed in the next pass on the *output* run of the previous lookup. </p>
      <p>So if you have the code</p>
      <p><code>feature calt {<br>
      lookup calt_01 {<br>
      sub A by B;<br>
      sub B by C;<br>
      sub C by D;<br>
      } calt_01;<br>
      lookup calt_02 {<br>
      sub B by E;<br>
      } calt_02;<br>
      } calt;</code></p>
      <p>and you have the glyph run</p>
      <p><code>A B A B A B A B</code></p>
      <p>and the <code>calt</code> feature is being applied, then first the <code>calt_01</code> lookup is executed on the input glyph run, so the output glyph run is: </p>
      <p><code>B C B C B C B C</code></p>
      <p>and then that output glyph run becomes the input glyph run of the <code>calt_02</code> lookup, which is executed and the final output glyph run is: </p>
      <p><code>E C E C E C E C</code></p>
      <p>In short: <strong>Each lookup is one “pass” through the text. Within one lookup, the “best match” is found for each glyph, and then the next glyph is processed, until the end of the text. The next lookup is executed on the text that comes out of the previous lookup</strong>. </p>
      <p>To make a very rough analogy, substitutions within one lookup are mutually exclusive when stepping through each glyph, while substitutions in separate lookups are executed one after another so that the next lookup takes notion of the modifications done by the previous one. </p>
      <p>I hope this helps,<br>
      Adam</p>
