    html: "<p>Well, I wouldn't say it looks so legible. <br>There is a lot of odd stuff, for instance: <br> <br>-t is too high, and its crossbar too; <br>-it's too tight for this size. try 2 pixels spacing, \"stem-to-stem\"; <br>-vwyz are wide (or are the other letters too narrow?); <br>-VW are really wide; <br>-bdpq looks strange: the bowls should be similar to o; <br>-x is narrow; <br>-A's counter is too closed; <br>-the numbers seems to differ in style from other characters... <br> <br>I think you still have a lot of work to do here. <br>Good luck.</p>"
    html_clean: "<p>Well, I wouldn't say it looks so legible. <br>There is a lot of odd stuff, for instance: <br> <br>-t is too high, and its crossbar too; <br>-it's too tight for this size. try 2 pixels spacing, \"stem-to-stem\"; <br>-vwyz are wide (or are the other letters too narrow?); <br>-VW are really wide; <br>-bdpq looks strange: the bowls should be similar to o; <br>-x is narrow; <br>-A's counter is too closed; <br>-the numbers seems to differ in style from other characters... <br> <br>I think you still have a lot of work to do here. <br>Good luck.</p>"
