    html: |-
      <p>As with all Christian Schwartz's designs, it's a good solid, contemporary and sleek design. I like its rhythm and rigour and it has plenty of widths and weights to suit different purposes. I'd love to have the chance to licence it.</p>
      <p>I'm not sure the massive x-height makes it very useful for extended reading.</p>
