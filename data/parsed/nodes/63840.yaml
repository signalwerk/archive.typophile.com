      <p><cite> &gt; Do you know about any 'famous' usage of that typeface?</cite></p>
      <p>I don't know what would qualify as "famous" for you, but Amplitude has been used in a number of high profile publications, too numerous to mention.</p>
      <p><em>Wallpaper</em> was already mentioned. Another is <em>Rolling Stone</em> magazine.</p>
