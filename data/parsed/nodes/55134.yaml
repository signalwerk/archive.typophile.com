    html: "<p>A character is much more relatable to a grapheme and is a more technical term.</p>

      <p>A letter is a letter depending on many more factors and is a more of a laymen's term.  For instance, in Spanish, \"ch\" is a single letter made of two characters.</p>

      <p>A letterform is an individual style of representing a letter/character.  So Helvetica has one letterform of \"a\", and Times has another and so forth and so on.  This can be either at the specific level of types of serifs, etc, or at a more general level, single or double storied, etc.</p>

      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>"
