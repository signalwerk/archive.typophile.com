    <p>I hear a lot of the terms used interchangeably. Let's say someone is referring to the letter 'a'; I hear it called letter, character, &amp; letterform. Are there industry accepted definitions for these terms, or are they interchangeable? </p>
    <p>I also hear Helvetica (for example) being referred to as a typeface/type/font. A font is typically the digital file that represents a certain typeface. Is that also the correct definition, or can someone elaborate on that?</p>
