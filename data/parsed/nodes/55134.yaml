    html: |-
      <p>Helvetica (for example) = Typeface<br>
      Helvetica 18pt Bold = Font</p>
      <p>Type (the noun) is similar to the term letter or character. It came from a time when letterforms were being cut from metal and wood for use on printing presses. You could say "I've lost my piece of Bodoni type". The term has been carried over to the digital realm and is used more liberally now to refer to a character or set of characters. </p>
      <p>Hope I did not confuse you any further.</p>
