      <p>Not sure if I can give an absolutely definitive answer, but here is my take. There might also be something in the wiki part of Typophile. </p>
      <p>The term character refers to the digital coded version of your letter a. Some fonts may contain many *glyphs that represent the shape of that letters a. Characters in a font are not necessarily letters even though an a happens to be. If you can just wrap your head around the idea of a character being what we know language wise as the letter a and the glyph or glyphs are the visual representation of that character, then you will get the basic concept.</p>
