    html: |-
      <p>My understanding is that character is a little confusing, because it can refer to two things. A letter is a character, but not necessarily vice versa (e.g., 1, % &amp; are characters but not letters). Both refer to things in the abstract (as opposed to glyphs, which are the visual instantiations of characters). However, characters also refer to the digital representation of characters.</p>
      <p>I think of letterforms as being something a bit more abstract than even letters or characters, encompassing letter-like designs, or features of letters.</p>
      <p>Similarly, a font is a digital file that codes for a particular type or typeface.</p>
      <p>I normally think of a "type" as the sort of image itself, not its instantiation, although is it correct to talk about "metal type" in the same way as "digital font"?</p>
