  html: |-
    <p>I'm reading an autobiography set in this face, and I find it really distracting -- not nearly as invisible as a book face should be -- because in my eyes the lc <em>d</em> and <em>p</em> are well below the x-height. It isn't that noticeable in this scan (possibly because it's bigger on screen).</p>
    <p>Anyway, I'd like to know what it is.</p>
