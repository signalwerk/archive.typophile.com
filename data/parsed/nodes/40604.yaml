  html: |-
    <p>I'm designing a book and would love to use <a class="freelinking external" href="http://www.fountain.nu/catalogue/alita_reg.asp" rel="nofollow">Alita</a>, but alas the family is quite limited. Any suggestions for a (super) close alternative?</p>
    <p>I've considered <a class="freelinking external" href="http://www.ourtype.be/" rel="nofollow">Amalia</a>, <a class="freelinking external" href="http://www.suitcasetype.com/index.php?lmut=en&amp;part=fonts&amp;font=9" rel="nofollow">Dederon</a> and <a class="freelinking external" href="http://underware.nl/site2/index.php3?id1=dolly&amp;id2=overview" rel="nofollow">Dolly</a>, but they don't quite make up for Alita's unique postmodern qualities. I've also considered <a class="freelinking external" href="http://www.psyops.com/html/spec_oxtail.html" rel="nofollow">Oxtail</a> but it's way on the other end of the spectrum.</p>
    <p>I understand I might just be stubborn, but thought I'd seek advice. Anything helps, thanks!</p>
  html_clean: |-
    <p>I'm designing a book and would love to use <a class="freelinking external link-external" href="http://www.fountain.nu/catalogue/alita_reg.asp" rel="nofollow">Alita</a>, but alas the family is quite limited. Any suggestions for a (super) close alternative?</p>
    <p>I've considered <a class="freelinking external link-external" href="http://www.ourtype.be/" rel="nofollow">Amalia</a>, <a class="freelinking external link-external" href="http://www.suitcasetype.com/index.php?lmut=en&amp;part=fonts&amp;font=9" rel="nofollow">Dederon</a> and <a class="freelinking external link-external" href="http://underware.nl/site2/index.php3?id1=dolly&amp;id2=overview" rel="nofollow">Dolly</a>, but they don't quite make up for Alita's unique postmodern qualities. I've also considered <a class="freelinking external link-external" href="http://www.psyops.com/html/spec_oxtail.html" rel="nofollow">Oxtail</a> but it's way on the other end of the spectrum.</p>
    <p>I understand I might just be stubborn, but thought I'd seek advice. Anything helps, thanks!</p>
