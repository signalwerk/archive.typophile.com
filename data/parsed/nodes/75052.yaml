      <p>Jasper, once you have a few years type design experience you will look back on this post and laugh with embarrassment. OK, so you've had some positive feedback on the Critique forum - it doesn't mean Expletus is the best thing since sliced bread. </p>
      <p>Pomposity is not an admirable trait in the young, (nor the old for that matter).</p>
      <p>The strange thing about type design is that when we first start down that path we all think we've just created the most brilliant, wonderfully original font ever, and praise and admiration must surely immediately follow. With a few typefaces under your belt you may revise your original opinion and think "Hmmm, it's OK I suppose". A few more years down the line you may think to yourself "I'm not too bad at this now, I might even be pretty good eventually".</p>
      <p>This post reminds me of that Mark Twain quote about experience and the passage of time:<br>
      “When I was a boy of fourteen, my father was so ignorant I could hardly stand to have the old man around. But when I got to be twenty-one, I was astonished by how much he'd learned in seven years.”</p>
