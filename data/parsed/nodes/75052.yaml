      <p>@Nick: I know that expletus is far from what I consider a good typeface, but judging your own typeface is much harder than someone else's. "The strange thing about type design is that when we first start down that path we all think we've just created the most brilliant, wonderfully original font ever, and praise and admiration must surely immediately follow." Yes, I've had that to, but I believe I'm over it now. You didn't know this yet, but I've already released two VERY ugly fonts. <a href="http://new.myfonts.com/foundry/Designtown/" title="http://new.myfonts.com/foundry/Designtown/">http://new.myfonts.com/foundry/Designtown/</a><br>
      I realise, that I won't be able to release a succesful typeface untill I have a degree from an art school. Now let me ask you a question. Not becease I think I already know the answer, but because I want to know the truth. Do you think this (knul) is a good typeface? How is it compared to expletus?</p>
      <p>I never said that I consider expletus worthy to be in the Hot New Fonts, nor do I think so. I just think that this (knul) typeface isn't either.</p>
      <p>"This makes me seriously reconsider Myfonts as a platform to sell my expletus." This does sound very arrogant at a second look, but all I meant was that Myfonts atracts the kind of customers that I might not want to be associated with. If I do have an art school degree and a good font in the future, maybe I don't want to be 'that guy from myfonts'.</p>
      <p>The rest is just my opinion about the font with, what i thought, are good arguments. I posted it on typophile, because i wanted to know what you thought about it, hence the question above in this comment.</p>
