    <p>Hello everybody,</p>
    <p><a href="http://new.myfonts.com/fonts/northernblock/knul/" title="http://new.myfonts.com/fonts/northernblock/knul/">http://new.myfonts.com/fonts/northernblock/knul/</a></p>
    <p>Am I the only one who thinks this doesn't belong in the Hot New Fonts? I think it has very poor spacing and it doesn't take optical illusions in account. For example the strokes don't get thinner where they meet the stem, which creates a very ugly dark spot. If you're wondering why I post this: Well, I'm just very frustated crappy fonts like this actually sell. It seems as if the people who are supposed to be selecting the typefaces, do so without enough knowledge, which makes typedesign based on fashion, instead of lasting beauty. This mkes me seriously reconsider Myfonts as a platform to sell my expletus.</p>
