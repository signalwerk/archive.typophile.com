      <p><b>Agfa Monotype Releases Fonts from Australian Type Foundry, Patricia Lillie and Nerfect Worldwide on Fonts.com</b> <br> <br>Wilmington, Mass. and Salfords, Surrey, England, Sept. 18, 2003 - Agfa Monotype Corp. has introduced font collections from three type foundries, adding 79 new fonts and font packages to Fonts.com. This is the third installation of foundry collections in three weeks. The fonts from Australian Type Foundry, Patricia Lillie and Nerfect Worldwide follow the releases from Fontsmith, Baseline Fonts, Bannigan Artworks, Chris<!--
