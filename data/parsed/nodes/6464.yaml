    html: <p>Tim -- Your intuitions are correct. It's very difficult to do your own logo. Your idea to just use type may be the best solution. After all, you're not American Airlines. They need a logo but do you? Paul Cutler has an idea -- let your subconscious do the work. Who knows? Just don't sweat it. <br> <br>PG <br> <br><a href="http://giambarba.com/bizimage.html" target="_blank">http://giambarba.com/bizimage.html</a></p>
