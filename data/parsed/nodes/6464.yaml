    html: <p>Yeah, it's the designer/typographer equivalent of the self-portrait. <br> <br>I say pick a font that you unabashedly love, if you can't find one that seems 'you'. <br> <br>This may make it more enjoyable and lead you in a direction you were unable to think of before. I feel for you. I've hit some walls recently too, but now I'm over them and the view is great.</p>
