  html: <p>I'm starting my freelance business in graphic designing and am having trouble finding fonts for my logo.  For now the logo will just be my name, J.A. Hull (letters moved around to protect the innocent.)  I was thinking that under the name, in a different font, I would place the word "Advertising" formated to stretch from the "J" to the "l". <br> <br>I'm sure everyone can relate, I've created many, many printed pieces for others making fearless decisions.  As soon as I have to make a decision for myself...Brick Wall! <br> <br>Any advice?</p>
