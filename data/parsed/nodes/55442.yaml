      <p>"Is there a maximum allowable character width for any given glyph position?<br>
      There are maximums for each of the kinds of glyph data in fonts. </p>
      <p>Each glyph of the Type 1 font must exist in a maximum 8,000 X 8,000 space with a 1000 unit em. How the glyph relates to the em is up to the designer as long as they stay within the 8,000. </p>
      <p>Each glyph of the TrueType font must exist in a maximum 64,000 X 64,000 space (divided evenly between - and +), with an adjustable em.  How the em and glyphs relate to the 64k space is up to the designer as long as they stay within the 64k. </p>
      <p>The maximum area beyond the side-bearings that a character can extend must fit in this description. </p>
      <p>Cheers!</p>
