    html: |-
      <p>Yes, there are maximums defined for these. Maximum width is given by the 'hhea' table and is stored as an unsigned 16-bit integer with maximum capacity of 65535 (em units). Max left and right sidebearings (which are actually named 'minLeftSideBearing' and 'minRightSidebearing') are given by *signed* 16-bit integers, so the allowable range is -32768 to +32767 (again, in em units).</p>
      <p>However, you should note that these are merely the limits of the OpenType data structures. The actual/practical limits imposed by operating systems, font-creating applications, and font-consuming applications may be smaller. There are also other values within the 'hhea' table and within other tables that probably prevent you from, say, starting a glyph at the furthest possible point left of the LSB and extending across the max advance width to the furthest possible point right of the RSB.</p>
