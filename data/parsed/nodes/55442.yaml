      <p><em>However, you should note that these are merely the limits of the OpenType data structures. The actual/practical limits imposed by operating systems, font-creating applications, and font-consuming applications may be smaller.</em></p>
      <p>I was a little concerned about this when designing some of the large flourish ornaments for Gabriola, the widest of which is 11,796 units. This is well-within the limits of the TT spec, but since I hadn't seen any glyphs that wide in other fonts I wasn't sure what might happen ‘in the wild’. So far, so good, and I have not encountered any problems in apps etc.</p>
      <p>I also have zero-width combining versions of these flourishes, and again I have not encountered any problems with the massive negative side-bearings.</p>
