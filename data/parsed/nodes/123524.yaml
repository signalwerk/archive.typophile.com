      <p>It's very close to Proto Grotesk, yes — but the figure 0 is perfectly round here (see “20th century”, third line). I think Ryuk got closer by working the ECAL network…<br>
      And since Alta Semi Display seems to be some kind of “lapidary” display font<br>
      (see pic below), my Grot must be Intermedium Text, indeed.<br><img src="/sites/default/files/old-images/Testino_3508.jpg"></p>
