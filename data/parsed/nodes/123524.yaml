      <p>“purposefully awkward”, that's why I instantly thought about Radim Peško. Jonathan Hares works with Nicole Udry at <a href="http://www.by-communique.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Communiqué</a> and is referenced at <a href="http://lineto.com/The+Designers/Jonathan+Hares" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lineto</a> as the designer of Superstudio so maybe it's one of its own creation.<br>
      Another sample: <a href="http://mikasavela.tumblr.com/post/95160223274/another-exhibition-in-the-2014-venice-biennale">http://mikasavela.tumblr.com/post/95160223274/another-exhibition-in-the-...</a></p>
