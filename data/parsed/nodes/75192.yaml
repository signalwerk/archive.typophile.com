    html: <p>I don't particularly like Stam, and it is not generally read. But it is one authentic scribal font, so it is of some interest. The <a class="freelinking external" href="http://www.amazon.com/Book-Hebrew-Script-Palaeography-Calligraphy/dp/1584560878/ref=sr_1_1?ie=UTF8&amp;qid=1287029533&amp;sr=8-1" rel="nofollow">Book of Hebrew Script by Ada Yardeni</a> has a lot more, but it's not on line. Misha Beletsky's essay in <a class="freelinking external" href="http://www.amazon.com/Language-Culture-Type-International-Unicode/dp/1932026010/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1287029722&amp;sr=8-1" rel="nofollow">Language Culture Type</a> is very nice, giving a good short history and a discussion of Zvi Narkis's fonts.</p>
