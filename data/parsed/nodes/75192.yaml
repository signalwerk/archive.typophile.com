    html: <p>Brian, I think you are on the right track in overlaying letters. The *relative* widths and spacing within a font, and then comparing how different fonts handle the different designs will tell you a lot. <a class="freelinking external" href="http://www.templesanjose.org/JudaismInfo/writing/Calligraphy.htm" rel="nofollow">This web site</a> by a Sofer lays down rules for the widths of the characters relative to nib width, for writing the STAM style. I don't know how valid they are, and in any case different designs will be different.</p>
