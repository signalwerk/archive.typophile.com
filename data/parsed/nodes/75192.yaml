    <p>Has anyone studied the proportions (width) of <a href="/wiki/Hebrew" class="freelinking" rel="nofollow">Hebrew</a> letters - obviously they are not simply based upon squares. The letters of Koren seem to have fairly different proportions than other typefaces. Hadassa is set quite wide. For the spacing of hebrew fonts, is it all done by eye? Has anyone ever made comparisons oh existing Hebrew typefaces? Are there perhaps any guidelines?</p>
    <p>I think if someone made some comparisons of several fonts, by overlaying letters which are scaled to the same body-height, we could understand proportions of Hebrew fonts more easily. Prime examples of "serif" fonts like Koren, Hadassa, and Frank-Ruhl - and any other very common examples - and "sans-serif" fonts, with which I am less familiar, but may include Narkis Tam, Erica Sans, and Jan LeWitt's Chaim.</p>
