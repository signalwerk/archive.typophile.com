    html: |-
      <p>A lighter weight, Brian, yet with very wide widths like Stam (in proportion to its height), may have disasterous results. There may be way too mush white space within the letter forms.</p>
      <p>Do you see how Stam has strong thick vertical strokes. This creates a pleasing color balance between the wide open white spaces within the letters, and the thick strokes.</p>
      <p>Try to use some of the Stam proportions with 2/3 to 3/4 of the Stam widths, and it should work.</p>
