      <p>Square letter typically means a block-like letter form, as opposed to script typeface design like Rashi or David Nitui which are called round letters.</p>
      <p>Vilna though is very wide, more than other letter designs, appearing to close to square. Plus Vilna is claimed to be an exemplary and earliest of the square letters.</p>
      <p>This suggests that the square-like proportions are not simply block-like.</p>
