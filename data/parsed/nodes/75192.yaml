      <p>I think I understand what you mean.</p>
      <p>You are referring not to the appearance of the Stam font, ie its design. Rather, you are refering to its raw height and width proportions, and perhaps also to the thickness of its strokes.</p>
      <p>They are 3 x 3 square grid. Most Hebrew typefaces are more rectangular, as in a 4 x 3 grid, where the height is more than the width.</p>
      <p>The Stam design is the Hebrew scribal design, and specific laws pertain to it in the Codes of Jewish law.</p>
      <p>I believe that you are suggesting to use Stam's proportions, or some of them, and to superimpose a different design within those proportions.</p>
      <p>To me, this is fascinating. Only the Romm Vilna does this to a certain degree, and was mimicked to a less degree by Henri Friedlaender in Hadasa.</p>
