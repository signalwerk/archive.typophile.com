    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12207" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">History</a>&nbsp;: German&nbsp;nationalism</strong></p>
    <p>Sometimes, this has reared its head and turned out to be a bad, bad thing. However, one could make the case that almost any form of nationalism is inherently&nbsp;bad.</p>
    <p>Like nationalism in almost every other country, German nationalism has had various forms over time. Each has had different characteristics. For instance, before 1871, Germany had never been a unified country. So, nationalism pre 1871 in Germany took the form of a strict drive toward unifaction. The German language and the German scripts (<a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>) were seen as binding elements across all German peoples at this time. This sort of German nationalism was support by people like Beethoven, Wagner, and Strauss, but also Otto von&nbsp;Bismarck.</p>
    <p>Since the end of the second World War, many West Germans have been skeptical of nationalism. However, in recent years, German nationalism has come on the scene again in two forms, both mostly amoung younger people. One branch of German nationalism is very small, and is overtly right-wing (Neo-Nazi). Another has been “proud of being German,” recognizing Germany’s cultural, technological, political, and business successes of the modern era. Interestingly enough, both sides seem to draw some sort of inspiration from the fall of the Berlin Wall and the reunification of the country in&nbsp;1990.</p>
    <p>While too many Neo-Nazis embrace <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> types, too-many younger Germans in the other camp seem to associate them with German nationalism instead of seeing them in some positive cultural&nbsp;light.</p>
