  html: <p>This project had a very short deadline, so I had no time to present it here for feedback, still here you have part of it. It's a logo for a new recyclable inkjet cartridges and tonner product for the portuguese market. In here you have the logo and some stickers to place on the cartridges. The packaging design is almost finished also. tell me what you think about it.<img src="http://www.typophile.com/forums/messages/29/16702.gif" alt=""></p>
