  html: |-
    <p>Is there any way in FLS to copy or duplicate hints from one .vfb to another? </p>
    <p>I have a regular and italic weight and I'd like the hints to be the same on the italic minus vertical hints. It would be nice to not have to do it all manually.</p>
    <p>(This is with Type 1 hinting)</p>
