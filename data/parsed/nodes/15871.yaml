      <p>Yeah! I agree with Chris G! Tell your teacher to shove it! Ask for a proper reason why you shouldn't use it. I remember a teacher telling me not to use Clarendon because it looks too old-fashoned, and it's now one of my favourite typefaces and used on my logo! Rebellion!</p>
      <p>I prefer the tighter letter spacing on the 2nd two ideas and think there's more in them than the first. </p>
      <p>The positioning of the seedling in the first breaks up the word in the wrong place, whereas in the other 2 it breaks the 'agro' from the 'tec' which I imagine is the idea.</p>
