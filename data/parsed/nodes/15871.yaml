      <p>If your teacher's dislike of Avant Garde is purely due to its age and popularity I would say that is a pretty bad reason to start altering it. The trick is to make well known types fresh again through good design.</p>
      <p>I think that the success of your treatment should be based on contrasting the geometric, technical quality of the letterforms with a more organic leaf shape. The first leaf looks a bit too 'drawn', and the diamond shaped leaves seem a bit unorganic. </p>
      <p>Maybe a leaf should grow from the stem of the 't' to form the cross bar?</p>
      <p>If you do decide to change the letterforms then you need to look at where the stems and bowls of the 'a' and 'g' meet. If you look closely there is a lot more white space in the original because the stroke that forms the bowl is not actually a consistent width. This may help avoid the 'a' looks like 'o' problem that you mentioned.</p>
