  html: "<p>&gt;&gt; Client &lt;&lt; A company, which specializes in preparation of students for the exams : TOELF, SATI, SATII, GMAT, GRE, Cambridge Certificate, etc. <br>&gt;&gt; Task &lt;&lt; To create an logotype that is lively and oriented to students. <br> <br>The correct pronunciation of the company name is \"Exam\", but it is written \"Xam\". Also, the client wants to use the logotype in various colors. <br> <br>Please comment on the following. <br><img src=\"http://www.typophile.com/forums/messages/29/53394.jpg\" alt=\"xam\"> <br>Salute  <br> <br>P.S Tanya, sorry about the slight gradient I just couldn't resist. ;)</p>"
