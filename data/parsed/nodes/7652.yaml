    date: 2004-11-16T05:52:00
    votes: null
    html: <p>Thanks for the post, Ivan. <br>&gt;&gt; Do they plan to use it to send mail or this is SASE?  <br>&lt;&lt; I haven't asked if it is going to be SASE or not. ;) But I guess a "self-addressed, stamped envelope" wouldn't harm anyone.</p>
  - id: 51956
    user_id: 2923
    user_name: hughfire
    user_path: null
    date_raw: 30 Dec 2004 — 1:43pm
    date: 2004-12-30T13:43:00
    votes: null
    html: "<p>Galin - I like the look of it, but I'm a sucker for dancing figures. I'm not sure why the airplane is relevant - is it just to show aspiration and rising to meet challenges or is there some reason to hold onto the airplane symbol. If not then maybe concentrate on the dancing figure and X within the mark. Adding that third requirement of the glyph increases its workload dramatically. If it is important however - then I think the configuration of #3. It feels very young - but I think the playfulness could still work. I like the idea someone had of simplifying learning center - it needs to form a good base for the figure to dance upon. <br> <br>As far as # of corporate IDs a year it depends on the firm. I work in a small department that gets a great deal of its work from small to medium business (under 1.5mil) and some work from larger. As a result I get a great deal of Identities (at least 10-15 a year) sometimes they aren't of a very high level, but its good experience.</p>"
