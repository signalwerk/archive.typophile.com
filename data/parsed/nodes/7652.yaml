    html: "<p>I think if it should look like an airplane than make it look like an airplane. If it should look like a man ( which is to me what it looks like) than it should look more like a man. I am slightly frustrated with this inkblot type of logo design. Frustrated because in the end you end up with something that looks like too many things. This causes the company to have an indecisive look.  Indecision is bad. Confidence is good. I definatly feel that #3 is the most succesfull. But is still not there. What age group is the xam center targeting?</p>"
