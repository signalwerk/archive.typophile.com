    date_raw: 15 Nov 2004 — 3:43am
    date: 2004-11-15T03:43:00
    votes: null
    html: "<p>Yes, I can confirm that every single word Galin wrote is true...we work for SUCH money. And Tanya: it's a normal workload for country, where words like \"brand\" or \"mark\" were some sort of gibberish 15 years ago. I can fully understand what Galin goes thru each &amp; every day, because I'm a native Bulgarian too and I live &amp; work in here, not in USA, as Galin presumed. <br> <br>Galin: drop the khaki version. As for the envelope, do they plan to use it to send mail or this is SASE? And - heh, Kres doesn't mean anything for foreigners <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
