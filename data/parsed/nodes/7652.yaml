    html: "<p>Aside: You know, I'm amazed at how many corporate ID projects you have going on at the same time. How it is so? <br> <br>Most Designers have maybe 4 a year..if that. <br> <br>your workload is insane.</p>"
  - id: 51953
    user_id: 5011
    user_name: serene
    user_path: null
    date_raw: 14 Nov 2004 — 2:10pm
    date: 2004-11-14T14:10:00
    votes: null
    html: "<p>To Tanya : The assinments come from various of sources. I have some very powerful friends here in Bulgaria, who are in the same kind of business (people from Ogilvy &amp; Mather, McCann Erickson, TBWA, Kres, etc.). They introduce me to potential clients and I have to work out the rest. ;) (the clients they give me are usually ones with money in their bank accounts, but I don't use my connections very often, because like everything goes : A favor for a favor. <br> <br>Note : The typical client is any incentive businessman, who needs to look professional. <br>Unfortunately the profit is insufficient, because of the unwillingness of people to pay tantamount to the work that was done.  <br>How would you react to a cost of 70$ for Corp.Id (and 50$ for a logotype)?  <br> <br>Of course, now and then, more generous clients come, but I believe you got the picture. <br> <br>Salute to all</p>"
