  html: <p>Hi <br> <br>This is actually for a five star hotel in Mauritius. They wanted a logo that reflects the concept of unity, harmony in diversifiation as is the multicultural Mauritius. By mixing both uppercase and lowercase I wanted to convey this message. I actually like the 'i' that i think keep on altering from being a candle, the Indian 'Bindi' (forehead decoration)  to even a drop of water.  <br> <br>Although I like the joyful 'Es', I am not really sure about the first one that looks out of its place with an awkward spacing, but the client saw it and like the 'E' in particular, my boss doesn't have any objection to let it go. <br> <br>What do you guys think? <br> <br>Thanks <br> <br>Jean-Lou <br> <br><img src="http://www.typophile.com/forums/messages/29/43025.gif" alt=""></p>
  html_clean: <p>Hi <br> <br>This is actually for a five star hotel in Mauritius. They wanted a logo that reflects the concept of unity, harmony in diversifiation as is the multicultural Mauritius. By mixing both uppercase and lowercase I wanted to convey this message. I actually like the 'i' that i think keep on altering from being a candle, the Indian 'Bindi' (forehead decoration)  to even a drop of water.  <br> <br>Although I like the joyful 'Es', I am not really sure about the first one that looks out of its place with an awkward spacing, but the client saw it and like the 'E' in particular, my boss doesn't have any objection to let it go. <br> <br>What do you guys think? <br> <br>Thanks <br> <br>Jean-Lou <br> <br><img src="http://www.typophile.com/forums/messages/29/43025.gif" alt=""></p>
