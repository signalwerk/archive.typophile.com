    html: <p>Jean-Lou, if any type designer sees what you did with the first e they will kill you. That character is only to be used at the end of a word. Also I don't like the relationship between the caps and lowercase. Use normal capitals, its a 5 star hotel not an amusement park. The letter spacing is terrible, but fix the first problems first.</p>
