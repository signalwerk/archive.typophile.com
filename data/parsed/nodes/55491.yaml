      <p>The font is American Greeting Script, which was revived as Altast Greeting by NovelFonts. You can see the sample on <a class="freelinking external" href="http://www.bowfinprintworks.com/Script01Pg1.html" rel="nofollow">Page 1 of Part 1</a> of the Script Guide. Several other digital versions exist including one by Opti.</p>
      <p>- Mike Yanega</p>
