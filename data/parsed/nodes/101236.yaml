    html: |-
      <p>Thank you for the suggestions.</p>
      <p>Regarding Trinité: It is calligraphic and not a general workhorse like Iowan Old Style or Minion (the latter really isn't so invisible, but its multilanguage support might make it good enough to use as a generic text font).<br>
      Although Trinité is a good choice in the book "Turning over a New Leaf: Change and Development in the Medieval Book", and is good for poetry (as was suggested in "Book Typography: a designer's manual", I think it is more versatile than that. It is hampered by its high price, older format (postscript), lack of ligatures, and weights (the medium is too bold). I think those are the major reasons one does not see it used more. In smaller sizes, the peculiarities of its calligraphic elements are diminished. Like various Garamonds, it requires some care in size, leading, layout, etc - maybe more than some other fonts, but that does not make it limited to poetry and whimsical text.</p>
      <p>Matching a sans is not easy. Maybe that is why Microsoft substituted Calibri for Times/Arial for its default Office (on the Windows side): it was good enough for short text, tables, and headings and pretty versatile in just four weights.</p>
      <p>I have seen the recommendations in "The Big Book of Font Combinations" for matching serif and san serif. Personally, the only nearly perfect match I've seen is with Scala. (It is my favorite for books that require a lot of tables and text). Even Documenta and Haarlemmer sans/serif variants clash a bit. When the Sans and Serif are clearly from different periods and very different, they can go fairly well together; and as they get closer, they start to clash. It is like colours.</p>
      <p>Foundary Sans is the closest I see to Trinité in letterforms, but the lowercase "a" has a slanted bowl that really doesn't fit with the other letters nor with Trinité. Syntax has a very different x-height and the "a" is even more different and the angled feet on "M" and "N" doesn't work for me. </p>
      <p>So, if there is not a good letterform match between a Sans and Serif, how does one pick a good match that is complementary and not clash? Arial/Helvetica and Times or Myriad and Minion are complementary but not even close to the same letter forms or even vintage but they work more or less.</p>
