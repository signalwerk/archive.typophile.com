      <p>If you like Foundry Sans also look at the venerable Syntax, which AFAIK was the "official" inspiration for Foundry Sans; their main difference is that Syntax is very gently inclined (1/2 a degree I think) whereas Foundry Sans is fully upright (partly to avoid funny jaggies/anti-aliasing onscreen I think). And since Trinité is inclined, Syntax might actually be a better choice. If you like that sort of thing.  :-)</p>
      <p>If you really want a super neutral sans check out Kievit.</p>
      <p>hhp</p>
