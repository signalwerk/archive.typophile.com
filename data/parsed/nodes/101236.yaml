  html: <p>Could you recommend a san serif to go with TEFF Trinite Roman Wide for a resume? I have used DTL Caspiri in the past, but its limited weights, cost, and imperfect match got me to thinking about a change. I have considered Whitney (maybe too large x-height and too small descenders), Ideal Sans (but the lowercase g would match more a transitional typeface, and Syntax (since it is based loosely on Stempel Garamond and has lowercase a and g that sort of match Trinite). Any suggestions from someone with a better eye than I have?</p>
