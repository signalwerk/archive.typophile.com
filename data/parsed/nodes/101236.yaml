    date: 2013-03-09T15:03:00
    date_raw: 9 Mar 2013 — 3:03pm
    votes: null
    html: "<p>Finding typefaces that are \"harmonious in spirit\" is difficult, because that requires a real understanding of the essence of several  typeface families. So assuming one is looking for a humanistic sans, if one wants to keep with Dutch typeface families, once comes up with one list, but Dutch typefaces are too broad to be the only limiter. Caligraphic typefaces would be another starting point, but that doesn't seem to work (Cronos or Beorcana for example). Scala Sans is not bad, and both derive from French old style, but some of the choices in modernization that went into Scala Serif are quite different than Trinité. Whitney is what Myriad should have been, and is the opposite: fairly bland and corporate looking. Ideal sans is not so ideal, because although it may be one of the most readable sans, many serifs are more readable, and most of the subtle curves get lost at small sizes. (it also has a distinctive \"M\" and \"g\" which make it not blend well with other fonts, and I think its individual letter forms look better than words using it.) Probably that is why finding good graphic designers is neither easy nor cheap.</p>"
