  html: |-
    <p>I just got word yesterday that "Behind the Typeface: Cooper Black" was one of the victims of YouTube's purge of 100,000 videos this week that allegedly violate Viacom's copyrights. (Viacom owns VH1, which owns "Behind the Music," which my movie parodies.) When you're dealing with a number like 100,000, it's awfully difficult to evaluate each one on its merits. Furthermore, it's a privilege -- not a right -- to be on YouTube, so getting kicked off isn't something that I can get that self-righteous about. They don't want to be sued, and I can't really blame them, though I do think they could have taken a better stand than they did.</p>
    <p>However, as an indirect target of Viacom's bullying, you'd better believe that I am extremely upset that Viacom doesn't recognize the fair use doctrine of the U.S. Copyright Act. This is one more case of a giant corporation throwing its weight around just because it can, and I'm not willing to be a victim of it.</p>
    <p>So I'm taking my case to the street. With any luck, news will spread and Viacom will get the bad press it so richly deserves.</p>
    <p>Many thanks to that other company that begins with V for its support. You guys are the best.</p>
