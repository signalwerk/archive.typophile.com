      <p>Best of luck with your push Cheshire. Long live parody and long live independent publishing!</p>
      <p>I am a big fan of the <a href="http://www.eff.org/" rel="nofollow">Electronic Frontier Foundation</a>. Citing the EFF has helped protect forum sites and blogs from libel claims. Some people (possibly they're greedy, possibly they're just whiners) still believe that a forum or blog site is accountable for comments and statements made by visitors and contributors. The EFF demonstrates this is not the case and that blogs and forums cannot be treated like editorial publications that have centralized control of what gets "published."</p>
      <p>Of course I'm not talking about any specific incident that I'm aware of, but to the general environment blogs and user-generated sites operate in.</p>
