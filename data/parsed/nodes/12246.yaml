    <p>May 10, 1854–October 28,&nbsp;1899</p>
    <p>Ottmar Mergenthal was born in southern Germany. During the 1870s, he moved to Baltimore. In 1886, he invented the <a href="/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a>, the world’s first commercially-viable typesetting machine that would later be mass produced by an America company called <a href="/node/13676" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mergenthaler Linotype</a>. Newspapers were the primary users of these&nbsp;machines.</p>
