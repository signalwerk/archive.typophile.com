      <p>Interlock lettering in the style made famous by Ed Benguiat but I can't recall offhand whether this precise one was made into a font<br>
      Ed Interlock from House is good <a href="http://www.houseind.com/fonts/edbenguiatfonts" title="http://www.houseind.com/fonts/edbenguiatfonts">http://www.houseind.com/fonts/edbenguiatfonts</a>. As are the several Interlock fonts at Myfonts.</p>
      <p>Don</p>
