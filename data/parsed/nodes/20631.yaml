    <p>Hi all,</p>
    <p>I am a designer working on a poster for an in-house program that's promoting employees to take alternative transportation to work. The program is new so there are no set standards on style except I must use Trade Gothic Bold Condensed as one of my main fonts since it appears in their logo.</p>
    <p>I am looking for a good, complimentary font to Trade Gothic. I had initially assumed I'd be using this additional font for the text, but I'm open to the idea of using it as a headline instead if it fits the bill.</p>
    <p>Thanks to all ahead of time!</p>
