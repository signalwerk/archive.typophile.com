      <p>Dolly was my first instinct aswell when I heard the<br>
      combination of 'straight-laced' but 'fun'. Also look at<br>
      Plantin Schoolbook. I think it was Stephen Coles who<br>
      posted it in a another post the other day, and I now<br>
      absolutely love that face. It's another serif that has a 'fun',<br>
      slightly quirky feel to it with its single story 'a' and 'g'.  </p>
      <p>On a side not, do people think Dolly is going to become<br>
      one of those overused, see it anywhere and everywhere<br>
      typefaces? I really like it, but it almost seems like it is<br>
      becoming the default typeface for 'fun' serifs. </p>
      <p>Phil</p>
