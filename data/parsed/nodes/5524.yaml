    html: <p>I think that if this was your first post for this critique, I would be very impressed with the concept on the left. I like it. It works as static print and I can see a world of potential motion applications for interactive media (eg. previous/next buttons, animated arrows directing the user, etc.). <br> <br>Have you considered any alternative colors for the logotype (eg. cool gray 11, 534, 548)? We all know, how difficult it can become to use black and orange in an identity without crossing the Halloween line. You don't have that problem with the logo here, but it might become an issue with other applications. <br> <br>Aloha! <br>Scott</p>
