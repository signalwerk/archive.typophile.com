    html: <p>Hi all, <br> <br>thanks again for the feedback. <br>First let me try to explain what i would like to convey with a symbol for my firm. It should symbolize attributes like motion, energy and excitement. Not only because that is connected to the word rush, but also because these are desirable attributes for the work i do - at least in the case of excitement. If you haven't done so you can go to rushmedia.de to get an idea of my work. <br> <br>That said, it seems my attempts so far didn't work well. As Soren pointed out the symbols i used are still too static. <br>I still like the idea of a vortex, and i wonder if i could change it in a way to make the element of motion apparent enough. However i also think about other images that could be used to symbolize motion. I want to stay with simple abstract shapes if possible. <br> <br>I will work on new/improved symbols. If you have any further suggestions i am happy to hear them.</p>
    html_clean: <p>Hi all, <br> <br>thanks again for the feedback. <br>First let me try to explain what i would like to convey with a symbol for my firm. It should symbolize attributes like motion, energy and excitement. Not only because that is connected to the word rush, but also because these are desirable attributes for the work i do - at least in the case of excitement. If you haven't done so you can go to rushmedia.de to get an idea of my work. <br> <br>That said, it seems my attempts so far didn't work well. As Soren pointed out the symbols i used are still too static. <br>I still like the idea of a vortex, and i wonder if i could change it in a way to make the element of motion apparent enough. However i also think about other images that could be used to symbolize motion. I want to stay with simple abstract shapes if possible. <br> <br>I will work on new/improved symbols. If you have any further suggestions i am happy to hear them.</p>
