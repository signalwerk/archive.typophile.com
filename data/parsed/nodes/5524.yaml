    html: <p>Thanks for the continued support. <br>Some of you liked the idea of my pixel symbol, hinting to screen design and using the gradient to convey an idea of movement. I took the idea one step further to add the kind of rush i was looking for. Putting the square in perspective i think it combines the impression of motion and of the pixels as the elements of screen design. <br>I made two versions for now, with slightly different angles. Also i tried if i could place the symbol behind the word in the smaller version. Just food for thought. <br>I really prefer the rounded corners on the symbol for a number of reasons. First, it gives a nice resemblance to the image of a screen. Second, it "holds together" the single squares, making it look more like one unit. And last, it works well together quite well with the font used imho. I also made the dot between the words into a rounded rectangle to go along with the symbol. <br> <br>Below, there is different versions of the vortex symbols. I tried to add more motion to them. I am not convinced though and the approach maybe just doesn't work. No matter what it always looks more like a flower than anything else. I wanted to put them here anyways though. <br> <br>I am very much leaning towards the "pixel and screen" symbol, it looks fresh and clean, and i really like the abstract approach. <br>Your comments? <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/40648.jpg" alt=""> <br></p>
