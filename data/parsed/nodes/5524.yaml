    html: "<p>I don't think the period should be yellow. It is almost invisible as it is here, let alone if it should be photocopied. <br> <br>But the main thing that bothers me is your symbol. It is static. <br> <br>What do you want the symbol to convey? If it is swiftness and energy (thus acting together with the word 'rush'), I don't think you can achive it by using this symetric vector graphic. <br> <br>I think motion can be designated two ways with graphics: <br> <br>A <br>The picture designates a thing that is moving. (Examples: a drawing of hunting falcon, a picture of Superman with his one arm outstretched). Explanation: we see the thing move because we know it moves. <br> <br>B <br>The picture is an arrangement of elements placed dynamicly (Example: a line of dots placed with increasing distance) Explanation: The gestalt laws determine this arrangement \"moves\" before our eyes. <br> <br>Your abstract symbol does not move. On level A, it could be a fan, rotating very slowly -- but it resembles a flower just as well. On level B, it hardly moves, because it is too symetric. <br> <br>If you want your symbol to tell a story, and the story has to be swiftness, I think you should reconsider it. Or else, let the symbol tell another story (like when you started to draw pixels instead). <br> <br>-- <br>S</p>"
    html_clean: "<p>I don't think the period should be yellow. It is almost invisible as it is here, let alone if it should be photocopied. <br> <br>But the main thing that bothers me is your symbol. It is static. <br> <br>What do you want the symbol to convey? If it is swiftness and energy (thus acting together with the word 'rush'), I don't think you can achive it by using this symetric vector graphic. <br> <br>I think motion can be designated two ways with graphics: <br> <br>A <br>The picture designates a thing that is moving. (Examples: a drawing of hunting falcon, a picture of Superman with his one arm outstretched). Explanation: we see the thing move because we know it moves. <br> <br>B <br>The picture is an arrangement of elements placed dynamicly (Example: a line of dots placed with increasing distance) Explanation: The gestalt laws determine this arrangement \"moves\" before our eyes. <br> <br>Your abstract symbol does not move. On level A, it could be a fan, rotating very slowly -- but it resembles a flower just as well. On level B, it hardly moves, because it is too symetric. <br> <br>If you want your symbol to tell a story, and the story has to be swiftness, I think you should reconsider it. Or else, let the symbol tell another story (like when you started to draw pixels instead). <br> <br>-- <br>S</p>"
