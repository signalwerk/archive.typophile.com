    html: "<p>In keeping with many of the other postings I agree that the spiral versions of your logo are not quite hitting the mark. They seem more representive of spinning (which can be more of a negative ie: spinning one's wheels but getting nowhere) than \"rushing\" or getting from here to there. At first I wasn't wild for the dot. Depending upon your clients, it could be confusing for them as they look for the url rush.media. Who are you branding yourself to? If they are tech savy it's not an issue of course but on the whole the general public still finds the web a little overwhelming and confusing. On your second go-around with the colored dot it became more of a graphic element and therefore less likely it would be misinterputed as part of an address.  <br> <br>So far I like the square/pixel version however, I would suggest making the dot a small square.  <br> <br>Overall perhaps you should re-think your design elements. In your first posting you said these were refinements from previously used designs, are you trying to keep the old elements simply for recognition?  <br> <br>Just went to your web site. The spiral logos do look like flowers and you use a lot of floral imagery on your site, perhaps it's the name that should be re-thought, flowers don't really convey the concepts of speed and energy. <br> <br></p>"
