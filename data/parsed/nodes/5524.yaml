    html: <p>Following your advices i thought about different or changed symbols to use for the logo. <br> <br>On the first one i did something completely different. Basic idea is to use a gradient to again convey the idea of movement or speed. I decided to make it a mosaic to give it a nice touch. Of course you could also read it as reference to screen design, i.e. pixels. Now, i am not sure if that is all too far fetched to make sense. <br> <br>The second one is taking the vortex idea a little further and making it more prominent. Also that way the symbol is more simple and easier to grasp than in the original. <br> <br>Third is basically the original, i just took out one layer of shapes to make it a little less complex as well. Those of you that said they got an impression of organic growth from it are right. There is a certain resemblance to a flower as well. I actually had this in the back of my mind when i made it. <br> <br>For the type, i really liked the suggestion by Sally to use a different color on the dot. I think it works well because it makes the dot less dominant so you don't trip over it when looking at it, while it still works to separate the two words. <br>In earlier incarnations of design i did use italics and bold type on rush and media like suggested, but this time i would rather not do that as i found it makes the name look unbalanced. <br> <br><img src="http://www.typophile.com/forums/messages/29/40321.jpg" alt="Variations"> <br> <br>What are your ideas on these designs, what direction do you think i should go?</p>
