  html: <p>Hi everybody, <br> <br>i just came across this great forum the other day. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>As i am currently working on creating a new logo for my own (web)design business i thought i would post the current status here for criticism. Its basically a refinement of ideas that were used before. I just now finally went to use plain vectors ;) <br> <br><img src="http://www.typophile.com/forums/messages/29/40125.jpg" alt="rush.media logo"> <br> <br>The symbol stands for energy and speed, attributes that are linked to the word "rush". <br>I am interested in hearing your opinions on this logo, how does it work? <br> <br>Thanks, <br>Martin</p>
  html_clean: <p>Hi everybody, <br> <br>i just came across this great forum the other day. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>As i am currently working on creating a new logo for my own (web)design business i thought i would post the current status here for criticism. Its basically a refinement of ideas that were used before. I just now finally went to use plain vectors ;) <br> <br><img src="http://www.typophile.com/forums/messages/29/40125.jpg" alt="rush.media logo"> <br> <br>The symbol stands for energy and speed, attributes that are linked to the word "rush". <br>I am interested in hearing your opinions on this logo, how does it work? <br> <br>Thanks, <br>Martin</p>
