    html: <p>Hi everybody, <br> <br>i have spent some days thinking about this design and how to improve on its weak points. Also thanks to your input that i value a lot. <br>I have been stuck with the screen symbol that on one hand carries some good ideas but also has its shortcomings. Main point in question is the impression of movement it conveys. I could not come up with any convincing solution to fix that lack of motion. I tried with Andrew's suggestion, but the breaking point was to create a mark that is not becoming too complex. <br>I am still all for the idea of animating a symbol on the web and want to stick with the use of visible pixels. However the mark also has to work for print use in a non-animated state, which turns out to be a problem. <br>Following these thoughts i decided to come up with more distinct shapes. Since previous pixel designs were already hinting to arrows, this is what i went with here. <br>The right one is something that just happened when playing around and i found it looks interesting. The left one is the serious suggestion, which is easy to recognize as arrows. At the same time i have made changes to the type, as it seemed that with a small and light symbol it works better to combine the two words and distinguish them by font weight. <br> <br>Please let me know how your impression is. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/41380.jpg" alt=""> <br></p>
    html_clean: <p>Hi everybody, <br> <br>i have spent some days thinking about this design and how to improve on its weak points. Also thanks to your input that i value a lot. <br>I have been stuck with the screen symbol that on one hand carries some good ideas but also has its shortcomings. Main point in question is the impression of movement it conveys. I could not come up with any convincing solution to fix that lack of motion. I tried with Andrew's suggestion, but the breaking point was to create a mark that is not becoming too complex. <br>I am still all for the idea of animating a symbol on the web and want to stick with the use of visible pixels. However the mark also has to work for print use in a non-animated state, which turns out to be a problem. <br>Following these thoughts i decided to come up with more distinct shapes. Since previous pixel designs were already hinting to arrows, this is what i went with here. <br>The right one is something that just happened when playing around and i found it looks interesting. The left one is the serious suggestion, which is easy to recognize as arrows. At the same time i have made changes to the type, as it seemed that with a small and light symbol it works better to combine the two words and distinguish them by font weight. <br> <br>Please let me know how your impression is. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/41380.jpg" alt=""> <br></p>
