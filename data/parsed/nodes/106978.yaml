    html: |-
      <p>OK everyone, as the person responsible, let me clear a couple of things up.</p>
      <p>@ quadibloc/Thomas Phinney  'The revival of the design is a separate question from trademark.'/'Yes. But it should be clear what I find objectionable: making the original name of the face a trademark, to place anyone else who would revive the typeface at a disadvantage.</p>
      <p>Not that I can't see why it's tempting; after all, they've done the work of cleaning up the design, and locating it as worthy of revival.'</p>
      <p>I also appreciate quadibloc's kind words, but I will explain my decision to trademark the name.</p>
      <p>The revival is a separate issue, but also the nub of the problem. I am not trying to disadvantage anyone – go ahead, give a revival a try! (BTW not a '*claim*' –  the trademark is registered with IPO.gov).</p>
      <p>It wasn't a case of 'cleaning up the design' as I had also initially thought. I soon realized that to produce a good, serious, useable typeface, I had to pull it apart and rebuild it, in order to discover how the relationships in geometry, strokes, alignments &amp; spacing worked. Not easy when all you've got to go on is impressions of a 16pt typeface, produced using linseed based ink on rag paper.</p>
      <p>But what I personally object to, having put all that work in – 3 solid years – is someone coming along, a big foundry for instance, and using my drawings as a basis for another revival. And I can't stop anyone doing that, as you know.</p>
      <p>All I can do is trademark the name to protect my work in the commercial sphere, thus differentiating it as the first commercial digital revival (William Morris's Golden Type name is registered with ITC, but it hasn't stopped others doing their own versions). </p>
      <p>Also to clarify: I have never claimed this is the first digital revival in any of the press I've done – those facts seem to get lost in sub edits and transcription – I'm quite blatant about this on my blog <a href="http://7thsealblog.wordpress.com/2011/09/10/reviving-the-doves-type-%E2%80%93-part-i-2/" title="http://7thsealblog.wordpress.com/2011/09/10/reviving-the-doves-type-%E2%80%93-part-i-2/">http://7thsealblog.wordpress.com/2011/09/10/reviving-the-doves-type-%E2%...</a> It is the 1st commercially available revival though.</p>
      <p>@ quadibloc 'Also, that they trademarked the name of a typeface by which it was known originally (and before they existed) is distressing'</p>
      <p>It is now known as the Doves type, Doves or the Doves font, but it had no particular or agreed name during its existence as a metal fount. This period lasted from around 1900 to 1916, when it was variously known to the owners &amp; employees of the Doves Press as ‘the type’, ‘the Type’ and, according Doves Press co-founder TJ Cobden Sanderson’s diary, ‘the Doves Press Fount of Type’ [T.J. Cobden-Sanderson, 21 March 1913. Journals, II, 214.] </p>
      <p>Emery Walker referred to it in his court hearing (Walker vs Annie Cobden-Sanderson) in 1923 at Lincoln's Inn as 'Doves' ('... my contention is that supposing by a miracle the type could have been recast exactly similar to the original Doves, the reputation which had accrued to the latter could not be transferred to any copy. Mr Prince, who cut the type and many other typefaces for private presses since the days of the Kelmscott Press, is now dead.'). </p>
      <p>As late as 1924 In a letter to Chatto &amp; Windus dated 4 February [Marrianne Tidcombe, The Doves Press (2002) pp.84], Coben-Sanderson’s son Richard refers to it as the ‘D.P. Type’. </p>
      <p>In fact, the most common contemporaneous description/name for it appears to be, from TJCS's journals, the 'Doves Press Fount of Type'.</p>
      <p>Finally, Marianne Tidcombe, in her aforementioned book, The Doves Press, refers to it as ‘the type’ &amp; ‘the Doves type’. I would also argue that the latter is in description, a shorthand generic term by which it has retrospectively come to be known (as I have said it is also called 'Doves' by more than a few people.) It is a generic term and if someone wants to use it, I can't really stop them. As long it's not my drawings copied, pasted &amp; repackaged or a large foundry piggybacking on my work, I probably wouldn't try either.</p>
      <p>@celeste The one used by the Walker Trust, Tobjörn Olsson's revival, Doves, is mentioned in my blog as I have said. It's never been commercially available. I stumbled upon it early on during my project &amp; was considering not carrying on with mine, until I became more familiar with it. The below image from Olsson's PDF is a comparison with mine – it's very much of its time, around 1995 I believe. It appears to be auto-traced with some common features, the serifs mainly.</p>
      <p>Thanks</p>
      <p>Best</p>
      <p>Robert Green</p>
