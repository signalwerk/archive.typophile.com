      <p>When I saw the original typeface in books on the history of printing, I thought it was a very beautiful one in need of a revival; looking at the link you provided, the revived digital typeface appears to be quite beautiful.</p>
      <p>Of course, though, it's somewhat expensive - not really that bad in price for the one-user print license, but the fact that embedding even in PDFs is treated like embedding in applications makes me suspect that <em>that</em> will be expensive.</p>
      <p>Also, that they trademarked the name of a typeface by which it was known originally (and before they existed) is distressing. A typeface in the public domain can be revived by anyone.</p>
