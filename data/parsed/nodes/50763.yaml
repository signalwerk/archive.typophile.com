      <p>This is really nice. I agree with Ben and like the lowercase n better than the upper, but I disagree with you and like the more conservative D than the really quirky one. And I usually really like quirkiness in typefaces. I just fear that it could be difficult to real in certain situations. I think if you are going to just create enough for the logo, than the really quirky D works.</p>
      <p>Is this all that you are going to create or do you think you are going to make a complete typeface?</p>
