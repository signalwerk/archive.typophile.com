    html: |-
      <p>Don — </p>
      <p>ITC Avant Garde was never intended as a text face, except perhaps in brief ads. Everything about it makes it hard to read en masse. It's too big, too round, too undifferentiated (the character shapes are designed to look as much like each other as possible, which is the opposite of what makes a text face easy to read). And it comes from a period when extra-tight spacing was in vogue, which made for some interesting display type (in talented hands) but wreaked havoc on text typography.</p>
      <p>The default spacing in the lighter weights of Avant Garde — including the Book weight and even Medium — is much too tight. To make Avant Garde readable in text (it <em>can</em> be done), you need to apply noticeably loose tracking (looser the lighter the weight), and you need to give it a lot of extra leading. And keep the lines short.</p>
      <p>But why bother? Use a good, readable text face, not one designed to draw attention in display use. For listings like the course descriptions in your PDF, Myriad might work, or FF Meta or FF Profile or ITC Stone Sans, if you want a sans serif face. Helvetica would be a poor choice, because the numerals look too much alike. (That's why Helvetica is one of the worst commonly available typefaces for things like letterheads and business cards, no matter how often you see it used.) Any of these typefaces need careful spacing: enough leading, short enough lines, comfortable tracking and kerning. </p>
      <p>The problems with Avant Garde aren't related to how it looks onscreen; it's inappropriate in print, too, for this kind of use.</p>
      <p>Everything that can be said about ITC Avant Garde applies to Century Gothic, which is essentially an imitation of the same sort of overblown geometrical typeface.</p>
      <p>John Berry</p>
