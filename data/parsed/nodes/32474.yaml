    <p>I'm looking for comments on the use of Century Gothic or Avant Garde as body text, on both web pages and print documents.</p>
    <p>I am hoping to get some professional opinions from typographers, designers, editors and even students who feel they have gained enough experience to comment on this. I will not state which side of the issue I am on, to prevent leading opinion one way or the other.</p>
    <p>(It would be really useful to me if you could tag your messages with your name, position, and perhaps number of years in Graphic Design ... i.e., Nick Shin, type designer, 87 years experience. (only kidding Nick).</p>
    <p>A sample of the web page use is <a href="http://lambton.on.ca" title="http://lambton.on.ca">http://lambton.on.ca</a>.</p>
    <p>A print link (PDF) is usually here, but for some reason is coming up blank to me now (but that is another issue) <a href="http://www.lambton.on.ca/documents/FT_course_descriptions_jan07.PDF" title="http://www.lambton.on.ca/documents/FT_course_descriptions_jan07.PDF">http://www.lambton.on.ca/documents/FT_course_descriptions_jan07.PDF</a></p>
    <p>Thanks for any comments you folk can come up with.</p>
    <p>Don</p>
