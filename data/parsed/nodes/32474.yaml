      <p>I'm not a designer, but I do edit a newsletter, so I have to make font choices. My reaction is that Century Gothic is a poor fit in terms of feel for a very long course description document. Something more neutral, like Helvetica or Myriad, would convey the information more effectively. Century Gothic feels a bit too "arty", particularly when it's used to describe science courses. And on the website, it just doesn't look very legible - Arial, Verdana or Tahoma. Maybe because the College is of "Applied Arts", they wanted to go with an arty feeling font? But did they forget the "Technology"?:-)</p>
      <p>Sorry if this is too subjective to be helpful.</p>
