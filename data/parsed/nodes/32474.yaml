      <p>That website shows how typefaces shouldn’t be mixed without at least examining them together. That aside, I am not a web designer nor a type designer so I don’t know the technical reason, I suspect it is partly hinting, although there isn’t much to hint with at that size, but Century Gothic and Avant Garde never seem to work on screen unless it is much, much bigger than that or a heavier weight, I have a client who uses Century Gothic to send me his corrections and in running text it really is too light to follow.</p>
      <p>The pdf is let down by the format, flow, print it philosophy, no care has been taken to keep paragraphs together or to keep headings with text and poor judgement of the correct measure increases the hyphenation problems that riddle it, those shortcomings all contribute to what is ultimately a poor choice of typefaces in extended text.</p>
      <p>Tim Daly, designer/typographer, 25 years of paid slog (crafting)</p>
