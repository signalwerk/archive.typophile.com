    <p>WOBURN, Mass.--Dec 14, 2011 -- Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, has introduced the Arial® Unicode® MS Bold typeface. Comprised of nearly 50,000 characters, the newest addition to the Arial suite marks a typographical first — the ability to use a true, bold version of Arial Unicode.</p>
    <p><a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=918517" rel="nofollow">Arial Unicode MS Bold</a> complements Arial Unicode MS, the regular weight of the same design, which is included in Microsoft® Office® products and is shipped in various applications.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Arial-Unicode_5096.png"></div><p></p>
    <p>"The expression, ‘everything but the kitchen sink,' applies to Arial Unicode, as it contains thousands of characters used in major commercial markets across the globe," said Allan Haley, director of words and letters at Monotype Imaging. "Designers and developers can now turn to a genuine, bold version of Arial Unicode, without having to apply a computer-generated affect to achieve a bold look, or switch to a different typeface. Whether the intent is to create typographic hierarchy or harmony, Arial Unicode and Arial Unicode Bold will work beautifully together."</p>
    <p>Like its Arial Unicode counterpart, which Monotype Imaging has licensed to hundreds of companies worldwide for use in millions of products that provide multilingual support, Arial Unicode Bold is a sans serif design that contains all the characters, ideographs and symbols defined in version 2.1 of the Unicode Standard, the character encoding system defined by the Unicode Consortium. The Arial Unicode fonts can also serve as fallback fonts, which are used when a system encounters characters that are not contained in other available fonts. For example, a user creates a newsletter with an Arabic font and sends it to another user, who displays the document on a different computer. Arabic characters not contained in the viewer's system will then display using Arial Unicode.</p>
    <p>A wide range of languages are supported by Arial Unicode fonts, including Western European languages, Simplified Chinese, Traditional Chinese, Japanese, Korean, Arabic, Hebrew, Thai, Vietnamese, Greek, Cyrillic and Indic languages. Arial Unicode fonts are an extension to the original Arial typefaces created by Robin Nicholas of Monotype Imaging and Patricia Saunders.</p>
    <p>Availability</p>
    <p>Arial Unicode fonts are available in TrueType® and OpenType® formats. Software and hardware developers may contact Monotype Imaging at <a href="mailto:oem@monotypeimaging.com">oem@monotypeimaging.com</a> to request licensing information. Creative professionals may purchase and download the fonts from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>. Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973 or in Europe at 44-1737-765959 (U.K.). Linotype may be reached at 49-6172-484-418 (Germany). Customers from other parts of the world may dial 1-781-970-6020 (U.S.).</p>
    <p>About Monotype Imaging</p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, automotive devices, tablets, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers, page description language interpreters, printer user interface technology and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica®, Frutiger® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>.</p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Arial and Times New Roman are trademarks of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica and Frutiger are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Unicode is a registered trademark of Unicode, Inc. in the U.S. and other countries. TrueType is a trademark of Apple Inc. registered in the U.S. and other countries. Microsoft, Microsoft Office and OpenType are either registered trademarks or trademarks of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. ©2011 Monotype Imaging Inc. All rights reserved.</p>
