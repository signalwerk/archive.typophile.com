    <p>I took some photos while I was visiting Jim Rimmer in BC Canada to learn about casting metal type after TypeCon. They are here:</p>
    <p><a href="http://www.flickr.com/photos/ebensorkin/sets/72157601705177162/" title="http://www.flickr.com/photos/ebensorkin/sets/72157601705177162/">http://www.flickr.com/photos/ebensorkin/sets/72157601705177162/</a></p>
    <p>Here's a sample:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chip_6484.sm.jpg"></div><p></p>
    <p>This 'a' is from the monospace I had critiqued at TypeCon.</p>
    <p>I found the experience fascinating. All the materials awareness is amazing. The wrong brass. Your done. Wrong mix of Lead, Tin &amp; Antimony. It's over. Done. It goes on &amp; on. There are so many ways to go wrong. It really shows you what was involved in getting superior printing. The machines themselves are amazing too. They are hugely precise - to the thickness of cigarette paper, 1/1000th of an inch. And Jim was a very very nice guy. </p>
    <p>Thanks again Jim! </p>
    <p>Here's hoping you will be at TypeCon in Buffalo.</p>
