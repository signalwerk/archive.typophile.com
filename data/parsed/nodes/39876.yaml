      <p>Hi, thanks for comments!<br>
      Miss Tiffany, here it is centred under the two people with no water. I added a little weight to them to see what happened since I thought they looked a bit skinny. I also removed the small text for now. The mark is in no way set in stone except that it must be Cooper Black for the “SURK TSI” part, or all text if possible. I’m all ear about kerning and spacing, to me it looks fine, you think the space is to wide between the two words?</p>
      <p>Lex, Comic Sans in a logo may be stretching it a bit to far. Thanks for the font tips. I like the liveliness of the bubbles for this logo, but I see that they may be to small and to many. I do not think that they seem out of place as they are randomly distributed and as a group they have an organic presence.</p>
