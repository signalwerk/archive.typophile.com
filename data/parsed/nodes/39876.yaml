      <p>I'm jumping in a bit late (and there hasn't been an update to this article in about 3 weeks) so I don't know if this will be helpful or not.</p>
      <p>First off I love the progression of the illustration. Bjorn, you have quite a talent, it was very impressive to see the slight variations over time.</p>
      <p>But, I'm afraid you haven't hit it with the type. It almost seems like the type is an after thought (which I suspect it is.) For starters the layout seems a bit neutral. Since you've created such a beautiful image, you should have type that helps not hinders the final product. If you're going with stacked type look, consider reducing the size of the tag-line so it's not the same width as the name. This will hint of a pedestal for your image to "sit on".</p>
      <p>Also, I think you might want to consider more contrast between your type selections. Cooper Black with another rounded sans for the tag is almost too similar. Rugby isn't a gentle sport, where it might be more graceful in the water, I'm sure there is still high levels of aggression during play. I'm envisioning a black chiseled slab-serif for TSI SURK with a muted rounded sans for the tag-line. It'll have the aggression I expect from rugby with softened effect that helps illustrate the water arena.</p>
      <p>suggestion: <a href="http://www.fontshop.com/fonts/downloads/emigre/malaga_black/?sample_text=TSI%20SURK&amp;sample_size=74" rel="nofollow">Malaga black </a>for TSI SURK and maybe <a href="http://vllg.com/JoshuaDarden/Omnes/mudTyper+Weights/" rel="nofollow">Omnes medium</a> for the tag-line.</p>
      <p>Good luck.</p>
