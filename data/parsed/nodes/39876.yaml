      <p>Hi and thanks for suggestions and feedback, inspiring and very appreciated! Sorry for not keeping you updated, I was hoping to have something to show before posting.</p>
      <p>I have been looking on all the fonts suggested, thanks Wesley.Bancroft and gabssnake, all of them is for sure nice. Sadly I have not been able to implement any of them.</p>
      <p>The logo has been resting for a while and in that time I got an idea that we'll try to follow through:<br>
      We are in the progress of sampling handwriting from the members in order to make a tag line from the samples. Due to holidays and no deadline we have not been able to collect the samples yet.<br>
      I'm a bit excited about this concept for the tag line.<br>
      First because it make a nice connection between the members of the team and the logo since they get to participate and see their own graphics in the design.<br>
      Second because I finally have a defined "concept box" to work inside.<br>
      Third because of the challenge, vectorizing the samples, putting them together and see how it turns out.<br>
      It may be a total fiasco, time will show.</p>
      <p>The typography is indeed an afterthought Asvetic. I find typography very difficult and interesting.</p>
      <p>I do not think that we will scrap Cooper Black. I will on the other hand definitely try out your suggestions concerning adjustments. Rugby is pretty brutal but we do not want to focus on the brutality. The team want to encourage female players to join and we hope a friendly logo is better than a brutal one.</p>
      <p>For the record: placing this logo on the chopping block, in the critique section of Typophile, means that I welcome any critique, in any shape or form. </p>
      <p>Again thanks for critique and suggestions from all of you, I'm learning a lot from them. The team love the logo and says hello! I'll post back once I have something to show.</p>
      <p>Best regards<br>
      BjornH</p>
