    <p>Hi, this is a logo for a local under water rugby club. Made the symbol a while ago and now I'm trying to get the typography right.<br>
    Teams for women and men. They have a solid community with a lot of social activity besides the sport. Easy going friendly bunch that loves a loud party.<br>
    They insist on Cooper Black, and I think it suits them well, but I think having all the text in CB is to heavy. I need a second font that goes well with CB and the spirit of the team. I think Comic Sans might work, although, after hanging around this place I should maybe know better.<br>
    Wide open to suggestions/critique on fonts, kerning, sizes or the logo in general.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/uwrugby_5205.gif"></div><p></p>
  html_clean: |-
