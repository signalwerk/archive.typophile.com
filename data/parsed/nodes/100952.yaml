    html: <p>Sounds "lazy" but looks very close to <a class="freelinking external" href="http://myfonts.us/td-H7BzyQ" rel="nofollow">Times</a>, some details remaining off (/E bottom finial, /G spur, /S finials...). You may like also <a class="freelinking external" href="http://www.myfonts.com/search/MILLER" rel="nofollow">Miller</a> (Text and Display), <a class="freelinking external" href="http://commercialtype.com/typefaces/austin/austin" rel="nofollow">Austin</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100031" rel="nofollow">Chronicle</a> and <a class="freelinking external" href="http://www.myfonts.com/search/baskerville+old+face" rel="nofollow">Baskerville Old Face</a>.</p>
