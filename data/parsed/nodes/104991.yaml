    <p>When the new font Nirmala was announced with Windows 8, one expected it to be better than Kartika, its unaesthetic predecessor with unacceptable shapes. But Nirmala Malayalam adds insult to the injury inflicted upon earlier.</p>
    <p>Sample these:<br>
    1. One conjuct has a missing stem<br>
    2. Has a confusing stroke ending style<br>
    3. Invents a clumsy way to handle descender portions<br>
    4. Substandard design quality, no optical corrections or proper stroke modulation</p>
    <p>Please see the jpg attachment for details</p>
    <p>Did the type designer(s) consult some one who knew Malayalam? Or did they think whatever they design will be accepted by others?  I had pointed out the design problems in Kartika years back, but from repeating the same mistakes and making it worse it seems the people concerned donot care.</p>
    <p>I am not competent to comment on other Indian scripts in the font, but I hope they are not designed as mindlessly</p>
