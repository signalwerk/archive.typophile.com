    html: <p>David, the few old/out-of-print books I have gotten from bouquinistes seemed reasonably priced. Dunno, I'd suspect the people who sell those books won't be equally savvy about all of the more specialized books they sell, and type, for one, might just be an obscure enough area to make for some good deals?</p>
