    html: "<p>This is more of a general suggestion: I highly recommend checking out the <a href=\"http://www.sitebits.com/2007/paris-bouquinistes.html\" rel=\"nofollow\">bouquinistes</a>' book stands next to the Seine. They sell lots of old and out-of-print books – you might be able to find some type related stuff there as well. Last time I was in Paris, I found a gorgeous, out-of-print (afaik) book about embroidery alphabets there, and it was pretty cheap too.</p>"
