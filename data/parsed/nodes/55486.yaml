      <p>i am surprised to see the bord de seine's bouquinistes considered "cheap", though they are indeed a good source. for modern typographic stuff, you might also take a look at "artazart" on the canal saint martin (and plus, the area is very nice to stroll around), and the library at centre pompidou - lots of choice, but quite pricey. for the old typo books, i have no idea. i get mine from the net.</p>
      <p>dr</p>
