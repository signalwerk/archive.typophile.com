      <p>One of the criticisms levelled at the original post is reasonable enough. A thesis does need to be more than sitting down at the piano and singing "We need a guy like William Morris again"... instead, one should investigate why it is that, even though much that William Morris produced is acclaimed, attempting to follow in his footsteps is not where the action is at present.</p>
      <p>Thus, the expression of typographic creativity at present is often found in areas like advertising and signage. Books, particularly books of any length, remain constrained by the cost of paper. If anything, the situation is significantly worse than in the 19th Century, given our declining forest resources - thus, the emphasis on the use of recycled paper.</p>
      <p>A recent Canadian news story, about temporary availability problems for the book "The Sentimentalists" by Johanna Skibsrud, after it won the Giller Prize, might also be worth looking at as a starting point.</p>
