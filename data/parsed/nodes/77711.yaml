      <p>The statement "how we need a revival in Biblical typography and literary type at large" is indeed an interesting one.</p>
      <p>The subject of typography for the Old Testament in the original Hebrew is a fascinating one, because of the complexities introduced by vowel points and Masoretic annotation. But I think that what you are talking about is very different from that. However, the situation in which Jewish editions of the Tanakh are found provides a hint at the issue. In that realm, typefaces of a calligraphic and lapidary nature are often resorted to, such as David, Koren, and Hadassah.</p>
      <p>An English-language edition of the Bible, on the other hand, is likely to be set in... the 4 1/2 point size of a modern typeface from the 19th Century, some modified Clarendon designed to be especially easy to read, or Times (New) Roman.</p>
      <p>Most people, when they read narrative fiction, do so in the form of paperbacks which are set in either Times Roman or Caledonia.</p>
      <p>Imagine the joy of being able to go to a bookstore, and pick up a copy of <em>The Lord of the Rings</em> set in Cloister Lightface, or something else resembling Morris' Golden type.</p>
      <p>Isn't it time that it should be possible to purchase a family Bible that shows that respect - by means of care and attention - was given to the Word of God by displaying beautiful typography? The choice of face is part of that - Centaur, Bembo, even Garamond are examples of choices that would indicate an intent to make the printed page a thing of beauty.</p>
      <p>And, of course, these days computers make it so easy to accomplish at least some of the steps involved in producing masters for a publication that would at least resemble a private-press production of yesteryear. The effort is so much less, and yet the typography of so many books is bland and nondescript, when it could be... a selling point, if nothing else.</p>
