    html: <p>Through out most history prior to the modern era, Bibles were set in the writing style or type available to Bible producers and approved by client authority.  Today, we have hundreds of thousands of options but most Bibles are just printed in the most traditional ways because that is what is expected. That also makes some sense since the words (barring new translations) are the same as they were for generations. I would imagine that if there were enough interest in a more modern typographical presentation, that someone could do it and not lose money by printing it. I think you need to ask who might be such an audience for the Bible and count heads to see if it is worth printing? If your purpose is not that of fulfilling a need of readers but fulfilling a desire of producer, then just do it and put it on one of the "on demand" publishing places.  You will get what you crave and if enough others like what you have done, you will recoup your losses. Otherwise, approach assorted Christian groups to see what interest may exist?</p>
