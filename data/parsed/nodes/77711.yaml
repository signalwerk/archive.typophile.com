      <p>If it's for outreach, then clearly the church doing the outreach needs to be able to afford as many copies as possible.</p>
      <p>I'm going to assume the publisher's agenda is to sell a nice-looking Family Bible as a treasured heirloom in which a family can keep a record of the births of its children and so on. Such a Bible is likely to have a few pages with illustrated plates in color, with paintings of various dramatic events. Notes are likely to be present, of a traditional and non-controversial nature: one is more likely to see Ussher's chronology than doubts about I John 5:7. The text will probably be that of the King James Version (unless the target market is Roman Catholics).</p>
      <p>Having thus moved the issue out of the upper reaches of devotion and theology to a cultural neighborhood where paintings of Elvis on black velvet are found, we can then ask: since this is an artifact intended to "look pretty" (and, despite the proletarian nature of its surroundings, its purchasers likely are sincere in their faith), why isn't more attention being paid to the typeface?</p>
      <p>The answer is probably "well, duh, if we had to typeset this giant book again, it would eat up our profit margin, and we wouldn't be able to sell it for $29.95 any more". Given that there are public-domain etexts of the KJV out there, and you can do wonderful things with laser printers these days, that might change someday.</p>
      <p>There is a market for more upscale printed Bibles of good appearance, but I suspect it's very limited.</p>
