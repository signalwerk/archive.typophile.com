      <p>Weidemann’s madness about neutrality is a common phenomenon amongst German designers of his generation (as a side note, Otl Aicher was born in 1922, the same year as Weidemann). Their aspiration for neutrality can only be understood in this context.<br>
      So their <cite>objectivism</cite>, being their way of coping with their innermost experiences, is highly subjective and emotional.</p>
      <p><cite>One cannot not communicate</cite>, as Paul Watzlawick put it.</p>
      <p>That said, I always found ITC Weidemann had a certain warmth to it.</p>
