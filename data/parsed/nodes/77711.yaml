      <p>@ John and Ivan: very interesting, thank you. I found some other clarifications on Google Books:</p>
      <p>Georg Rörer (without »h«), a collaborator of Luther, introduced those typographical distinctions between good and evil in a Bible printed in 1541 by Hans Lufft in Wittenberg. Luther disapproved this innovation and this is why this typographical rather unique experiment has been withdrawn in further versions of Luther's Bible (see Marion Janzin / Joachim Güntner (2006): Das Buch vom Buch: 5000 Jahre Buchgeschichte. P. 186).</p>
