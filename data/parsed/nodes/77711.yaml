      <p>It wouldn't surprise me if the version of the "Luther Legend" contained in that .PDF about Fraktur were true. Many unusual versions of the Bible have been published; one that used an "Antiqua" initial letter to begin a chapter (or verse) about a negative topic would not be surprising given that Fraktur was identified with Lutheranism, and Roman types with its rival, Roman Catholicism.</p>
      <p>Ah: Google has brought me to the truth. <em>A New History of German Literature</em> by Judith Ryan and Hans Ulrich Gumbrecht reveals: "In the revised German Bible of 1541, Röhrer introduced a system of setting some words in Antiqua, others all in upper-case Fracture, and the rest in ordinary mixed Fraktur. In an afterword, Röhrer explains that whenever scripture speaks of Christ, it is set in upper-case Fraktur, whereas passages referring to evil or death are set in Antiqua."</p>
