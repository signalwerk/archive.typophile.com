      <p>First of all, thanks for the useful feedback. I should be more concise in how I explain what I'm studying. A brief overview of typographical emotion will be discussed leading into the topic of Biblical typography and why it's important.</p>
      <p>Do typical reading typefaces (those built for legibility) differ enough to produce any substantial psychological response?</p>
      <p>If so, in a book as important as the Bible, why do we continue to put cost over reader response? (I'm using Leeuwen's "Typographical Meaning" as a basic approach.)</p>
      <p>Lastly, I'd like to explore experimental typographical layout and see if it's a valid approach to the Bible.</p>
