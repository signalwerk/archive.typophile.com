      <p>Kurt Weidemann had some interesting but provocative opinions about emotion and typography:</p>
      <p><cite>Weidemann, Kurt, ‘Biblica — designing a new typeface for the Bible’, Baseline, 6 (1985), 7–11</cite></p>
      <p>My poor summary and response: He felt that a typeface for the Bible must be devoid of romantic emotion and not impose any emotional quality to the text. A neutral face would allow the text to communicate more faithfully and without additional influences of typographic emotion.</p>
      <p>Personally, I disagree. There is no such thing as 'neutral' typography. The design and use of type always adds a layer of emotion to the text, and even 'neutral' designs affect the perception and response of the reader. </p>
      <p>The Bible is a highly emotional book that is intended to elicit a deep spiritual - and intellectual - response in its readers. The values and variety of that response are affected by its typography and type. That is unavoidable. Type for the Bible can enhance or dampen the response. Fraktur vs. Antiqua is an obvious example, but there are modern ones, too, such as Brian Sooy's excellent <a class="freelinking external" href="http://www.alteredegofonts.com/veritas-font/index.htm" rel="nofollow">Veritas</a>, used by Tyndale House, which enhances the text's dynamic, exciting properties. Unfortunately, Biblica (a.k.a. ITC Weidemann) tends to impart a colder, more distant quality (for a number of reasons). While I myself bought and used ITC Weidemann years ago for a number of jobs, I would not use it if I were typesetting a Bible. </p>
      <p>This also holds for non-Latin Bible type. John Hudson's <a class="freelinking external" href="http://www.sbl-site.org/educational/BiblicalFonts_SBLHebrew.aspx" rel="nofollow">SBL Hebrew</a> is amazing in how it mixes warmth with grandeur, and (I hear) makes the text seem less stodgy then some more traditional designs.</p>
    html_clean: |-
