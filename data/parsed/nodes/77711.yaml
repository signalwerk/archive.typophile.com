      <p>An interesting aspect of Biblical typography is that typically readers are not reading in uninterrupted spells for long periods of time. How often does someone sit down and read the entire book of Isaiah in one sitting? More typically a person will read a verse, or several verses, or a chapter, then have a good think, or flip to another related verse.</p>
      <p>Which is to say, the demands on the type are more like a reference book than a novel.</p>
      <p>Note: I've always wanted to see a bible printed in Storm's Biblon, does one exist?</p>
