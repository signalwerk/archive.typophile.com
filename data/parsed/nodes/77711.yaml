      <p><cite>Isn't it time that it should be possible to purchase a family Bible that shows that respect - by means of care and attention - was given to the Word of God by displaying beautiful typography?</cite></p>
      <p>It would be a wasted effort. Few people still study the bible by sitting down at a desk with a twenty-pound bible in front of them. They do it in groups, in church, whole commuting, or other situations that make portability more important than fine typography. Others use computers to study multiple digital bibles simultaneously. For the minority who actually want a huge, beautiful bible there are plenty of antiques floating around in bookstores and various collectible presses crank out good facsimiles of old editions.</p>
