  html: |-
    <p>Welcome to the second newsletter this year! :)</p>
    <p>Half of the releases this time are fonts made by Levente Halmos - a designer from Hungary, and a welcome newcomer to the CheapProFonts stable. The font industry sees more and more new type designers coming from eastern Europe, but surprisingly few of them actually cater for their own home markets by including all the necessary glyphs... CheapProFonts to the rescue! ;)</p>
    <p>In this news release I present the following 9 fonts:<br>
    - 5 from Levente Halmos<br>
    - 2 from Kimberly Geswein<br>
    - 1 from Brian Kent<br>
    - 1 from myself! ;)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-NEWS-09-02_5174.gif"></div><p></p>
    <p>We've had our first real "hit": Danube Pro has sold really well since its release, and actually peaked at 3rd place in MyFonts' Starlets list! At that time CheapProFonts actually had 3 fonts on this top50-list! :)<br>
    Business on our own site has also increased, so it seems the public has started to take to the idea of our improved, multilingual fonts. Brilliant!</p>
    <p>CheapProFonts is dedicated to supplying high-quality OpenType and TrueType fonts for setting "foreign" languages (languages requiring more than the basic A-Z characters) for professional Mac and Windows users.<br>
    Check our site for constant new releases, and see you in the next newsletter!</p>
    <p>Roger S. Nelsson<br>
    --<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
