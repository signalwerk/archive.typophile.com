      <p>I believe they were intended for overprinting on printing terminals. Why else would there be a free-standing cedilla in Latin-1?</p>
      <p>Current use? Well, the backtick (U0060) is used in Unix shells when you want to assign the output from a pipeline to a shell variable.</p>
      <p>Words=`wc -w "$1" | cut -d " " -f 1`</p>
