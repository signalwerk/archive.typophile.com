    <p>I've found these <strong>spacing</strong> characters in Unicode. What are they for?</p>
    <p>005E - CIRCUMFLEX ACCENT<br>
    0060 - GRAVE ACCENT<br>
    00A8 - DIARESIS<br>
    00B4 - ACCUTE ACCENT</p>
    <p>and others.</p>
