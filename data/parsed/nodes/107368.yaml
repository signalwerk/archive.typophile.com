      <p>Yes. Spacing modifiers -- the characters under their own "name" -- are sometimes needed. Problem is, the assignments noted by Mr. Belloc are mis-located as spacing modifiers. They seem to have a legacy purpose only.</p>
      <p>circumflex should be at 02C6, not 005E<br>
      grave should be at 02CB, not 0060<br>
      acute should be at 02CA, not 00B4<br>
      macron should be at 02C9, not 00AF</p>
      <p>Apparently 00A8 is all Unicode made available for the encoding of a "spacing" dieresis, the others I take out, for reasons given above.</p>
