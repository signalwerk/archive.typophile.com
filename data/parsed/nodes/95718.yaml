      <p>Could be wrong but looks like a custom job to me (part of the obvious too many rounded corners of course), something between <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-dax/" rel="nofollow">Dax</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/daxline/" rel="nofollow">Daxline</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/sancoale/" rel="nofollow">Sancoale</a>/<a class="freelinking external" href="http://www.fontsquirrel.com/fonts/ubuntu" rel="nofollow">Ubuntu</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/font-fabric/solomon/" rel="nofollow">Solomon</a> for /u, /m and /n and <a class="freelinking external" href="http://www.myfonts.com/fonts/tipografiaramis/decima-plus/" rel="nofollow">Decima+</a>.<br>
      For what it's worth, I would probably start with Decima+ and recreate it completely using /a to redraw /n, /m and /u.</p>
