    html: |-
      <p>You can't actually create a custom glyph. Rather, you move pieces closer together with kerning, perhaps with a spot of re-sizing and moving the baseline up and down. Done that a zillion times, for special accents and the odd math :-(</p>
      <p>You can store most settings in Character styles; also (always mention your CS version!), in CS3 you can replace anything by the Clipboard contents. That's proven to be quite useful when there's lots of the same stuff in your doc.</p>
