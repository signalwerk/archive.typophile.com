  html: <p>Anyone have any advice about creating custom glyphs in InDesign such as a proportional fraction alternate a particular typeface doesn't offer? And how to use this new glyph  in a find/change operation? Thank you for your help.</p>
  html_clean: <p>Anyone have any advice about creating custom glyphs in InDesign such as a proportional fraction alternate a particular typeface doesn't offer? And how to use this new glyph  in a find/change operation? Thank you for your help.</p>
