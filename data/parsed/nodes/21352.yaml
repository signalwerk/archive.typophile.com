      <p>This is very nice. I generally don't like letters that begin or end with flat terminals, but they seem to suit this one very well.</p>
      <p>-q- needs to be more open, could be the stroke is too heavy<br>
      -g- both seem to sit too high on the baseline. I'd say both thin and bold need a little larger upstairs counter.<br>
      -E- (thin more than bold) Visually it is leaning to the left, probably because the stems appear to increase in length from top to bottom</p>
      <p>I really don't like st ligatures, but yours is working. Would love to see it in a paragraph of text. I think they are generally over-designed and call too much attention to themselves.</p>
      <p>Love both U/lc zeds.</p>
