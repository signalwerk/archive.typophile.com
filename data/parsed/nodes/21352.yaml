    <p>Hi fellow Type nerds.</p>
    <p>I've been working on these 2 weights of a new family called 'Avocet'.</p>
    <p>As I've been slaving away in my artist's garret with no feedback, I was just wondering if I'm heading in the right direction. I think the ligated characters could look pretty good if used sparingly. I find that I get slightly irritated if I'm reading long text passages with lots of these. Does anybody feel the same?</p>
    <p>The caps are a bit quirky, but I think they look unified nonetheless.</p>
    <p>Any (positive) comments gratefully appreciated.</p>
    <p>Thanks</p>
    <p>Nick Cooke | G-Type</p><div class="imageWrap"><img src="http://typophile.com/files/Avocet_3626.jpg"></div><p></p>
