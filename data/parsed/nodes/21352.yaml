      <p>Stephen has already mentioned Chianti, which this reminded me of; also look at Goudy Sans and Gary Munch's new Candara for Microsoft.</p>
      <p>I think this is still busy with conflicting directions: pleasingly informal at times (VRac) and rigid at others (EMSAbox). I'd like to see it moved in the direction of informality, with less straight stems. Then, you might find that some of the little in-strokes (EFPZ) aren't necessary. I'd also consider allowing those entrance strokes to be at various angles, instead of strictly vertical. They could also have varying thicknesses, since you've introduced some tapering elsewhere.</p>
      <p>The bold looks a little cramped in its character widths. LC 'a' especially doesn't feel as playful in the bold as in the roman. The bold shows a very predominant vertical stress, which I think fights the informal elements.</p>
