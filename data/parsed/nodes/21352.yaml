      <p>This is lovely, Nick. Very much in the style of <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=Chianti" rel="nofollow">Chianti</a> and <a href="http://emigre.com/EF.php?fid=200" rel="nofollow">Vista</a> but more playful. As for the long reading potential, it would be good to have a PDF with 9-11 pt. type so we could print and test.</p>
      <p>- The Q tail seems to straight next to the ears and tails of the other caps.<br>
      - Some of your straight stems (i, j, b) - especially in bold - could use the flaring found in other verticals (m, n, u) - but maybe that's just the low-res image playing tricks<br>
      - The bold 'g' could use some squaring to increase the counter size</p>
