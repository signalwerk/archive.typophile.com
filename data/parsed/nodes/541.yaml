  html: "<p>Featured Font - Hesperides <br><a href=\"http://www.fontcraft.com/scriptorium\" target=\"_top\">http://www.fontcraft.com/scriptorium</a> - follow link <br> <br>Making the Captain Kidd Font <br><a href=\"http://www.fontcraft.com/scriptorium/kidd\" target=\"_top\">http://www.fontcraft.com/scriptorium/kidd</a> <br> <br>New Fonts Available Online <br><a href=\"http://www.fontcraft.com/store/display.html\" target=\"_top\">http://www.fontcraft.com/store/display.html</a> <br> <br>Spring Specials <br><a href=\"http://www.fontcraft.com/store/specials.html\" target=\"_top\">http://www.fontcraft.com/store/specials.html</a> <br> <br>Will Low Borders <br><a href=\"http://www.fontcraft.com/scriptorium/lowsamp.jpg\" target=\"_top\">http://www.fontcraft.com/scriptorium/lowsamp.jpg</a> <br> <br>New Renaissance Fonts &amp; Art Collection <br><a href=\"http://www.fontcraft.com/scriptorium/renaissance\" target=\"_top\">http://www.fontcraft.com/scriptorium/renaissance</a> <br> <br>FontClub Info <br><a href=\"http://www.fontcraft.com/fontclub\" target=\"_top\">http://www.fontcraft.com/fontclub</a> <br> <br> <br>NEW FONT RELEASE - Hesperides <br> Hesperides is based on samples of Colonial period calligraphy. Rather than being entirely based on any one sample, some common characteristics have been emphasized to give it a more coherent and distinctive look, with the accentuated single-looped strokes on many of the characters suggesting a fully flourished style, but not going quite as far as a font like Platthand or John Speed. The ultimate  effect is really striking, in the tradition of our Queensland and Allegheny fonts, but even more distinctive. The full font includes alternate versions of many of the key characters designed to reduce loop interference and add variety <br> To try out Hesperides for free, just follow the links from our main page at <a href=\"http://www.fontcraft.com\" target=\"_top\">http://www.fontcraft.com</a> <br> <br>CAPTAIN KIDD FONT PROJECT - Part 2 <br> The saga of the development of the Captain Kidd font continues.  The second article carries on to the challenges of developing a more extensive character set from 8 good character samples and a number of very hard to work with and indistinct screen captures. <br> You can find both installments of the article article at <a href=\"http://www.fontcraft.com/scriptorium/kidd\" target=\"_top\">http://www.fontcraft.com/scriptorium/kidd</a> <br> <br>MORE NEW SINGLE FONTS ONLINE <br> We've just added another slew of single fonts to our online ordering system.  This time the goal was to make the Display Fonts section as complete as possible.  The result is the addition of 22 more fonts, some of which are fairly obscure  To get to the Display Fonts section just go to <a href=\"http://www.fontcraft.com/store/display.html\" target=\"_top\">http://www.fontcraft.com/store/display.html</a> <br> The added fonts include: <br> Acadian - Lovely ornate Victorian font <br> Adamantine - Very dramatic heavy weight title font <br> Asphodel - Ornate Art Nouveau font <br> Atkinson Eccentric - Interesting Art Nouveau sign lettering font <br> Averoigne - Attractive Victorian capitals <br> Bad Acid - Classic psychedelic lettering font <br> Chambord - Attractive Victorian titling font <br> Circuit - Decorative font with electrical circuit patterns <br> Dunsany - Fantastical and dramatic lettering <br> Engrossing - Classic early 17th century script style <br> Iphegenia - Very nice classic script font <br> Joyeuse - Attractive Arts &amp; Crafts titling font <br> Manegrim - Heavy Germanic uncial <br> Mayhem - Rough and demented font <br> Mazarin - Attractive Victorian titling font <br> Praitor - Unusual Roman lettering font <br> Primer - Reminiscent of embroidered lettering <br> Rousseau - Very nice Arts &amp; Crafts font <br> Slither - Modern stylized title font <br> Tenebris - Attractive titling script <br> Terpsichore - Appealing script style <br> Vasilisa - Type in the style of Russian calligraphy <br>This brings the selection of single fonts on the ordering site to a pretty impressive level.  Every single font isn't there yet, but we're getting much closer. <br> <br>SPRING SPECIALS <br> We've also put a new selection of products on special discount for the Spring season.  They include some really good deals on popular items.  For example, we've got the phenomenal Arthur Rackham CD reduced, plus the Celtic Fantasy package for those who have the first Celtic package and want to get the new one as well, and even an extra special deal on the Horror Fonts and Art collection because it's so very non-seasonal.  There are more than a dozen sale items all together.  You can find out what's on special by going to <a href=\"http://www.fontcraft.com/store/specials.html\" target=\"_top\">http://www.fontcraft.com/store/specials.html</a> <br> <br>WILL LOW BORDERS <br> We're working on a special new package of borders based on the designs of Will H. Low.  This package isn't ready yet, but you can see some nice samples of his works from his illustrated edition of Shakespeare's 'As You Like It' on a page at <a href=\"http://www.fontcraft.com/scriptorium/lowsamp.jpg\" target=\"_top\">http://www.fontcraft.com/scriptorium/lowsamp.jpg</a> <br> Look for this package to be ready for release in a few weeks. If it goes well we may even include a font based on his lettering. <br> <br>RENAISSANCE FONTS &amp; ART <br> We're slowly filling in the gaps in our chronologically based historical fonts collection, and this time we have a key entry which many have been anticipating. <br> The Renaissance saw the development of new lettering styles which combined rediscovered Roman period calligraphy with the needs of a very active literary community for efficient, readable scripts. The result was the move away from medieval gothic lettering to the humanistic forms which are the ancestors of modern handwriting. <br> Our Renaissance fonts collection features 10 fonts based on lettering styles of the period, from humanistic and Italian cursives to formal Roman styles.  It also includes a set of Renaissance decorative initials, and as a bonus a collection of Renaissance frames and borders by Evelyn Paul.  Alltogether this makes it just what you need to create documents with a Renaissance look. <br> The Renaissance package is available at a reduced price for a limited time.  To check it out and see samples of the fonts and the frames and borders, go to <a href=\"http://www.fontcraft.com/scriptorium/renaissance\" target=\"_top\">http://www.fontcraft.com/scriptorium/renaissance</a> <br> <br>GET NEW FONTS EVERY 2 WEEKS w/ THE FONT CLUB <br> A lot of people seem to like the idea of getting the full versions of all our new featured fonts as they're released.  You can join the Font Club too, and get new fonts every two weeks, plus a bonus font for joining.  You can get all the info at <a href=\"http://www.fontcraft.com/fontclub\" target=\"_top\">http://www.fontcraft.com/fontclub</a> <br> We're also offering a special package deal.  If you order the new release of our complete fonts CD you can get a one year Font Club membership thrown in for only $20 more.  That's a holiday treat that's hard to pass up.  Just go to <a href=\"http://www.fontcraft.com/store/specials.html\" target=\"_top\">http://www.fontcraft.com/store/specials.html</a></p>"
