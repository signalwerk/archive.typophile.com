dung, <br>she began to realize how warm she was.  The dung <br>was actually thawing her out!  She lay there all <br>warm and happy, and soon began to sing for joy, <br>\"the ABCs of love...\" (<a href=\"http://tinyurl.com/4f84f\" target=\"_blank\" class=\"link-external\">http://tinyurl.com/4f84f</a>). <br>A passing Art Director man heard the girl singing <br>and came to investigate. <br>Following the sound, the AD discovered the girl <br>under the pile of reindeer dung, and promptly dug <br>her out and took advantage on her. <br> <br>Management Lesson : <br> <br>1. Not everyone who shits on you is your enemy. <br>2. Not everyone who gets you out of •••• is your <br>   friend. <br>3. And when you are in deep ••••, it is best to  <br>   keep your mouth shut !</p>"
