      <p>I had the opportunity to speak with the designer directly. (Contact info was on the back of the Calendar.) She told me it was indeed Tango. However, I think she may have thought I was the font usage police. I have been unsuccessful in trying to find a place to purchase Tango, but really the link displaying Tasmin Bold will do very nicely!</p>
      <p>Thank you very much!</p>
