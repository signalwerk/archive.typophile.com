    html: |-
      <p>Nope. That's an old typeface called Tasmin (Bold, I believe). Unfortunately, the only digital version I'm aware of is called Tango Regular by WSI - a company that made its living selling batches of knockoff fonts to software companies who then bundled them with its software.</p>
      <p>Edit: Mike Yanega offers a <a href="http://bowfinprintworks.com/BauhausFaces6.html" target="_blank" rel="nofollow">showing of Tasmin</a> including numerals.</p>
