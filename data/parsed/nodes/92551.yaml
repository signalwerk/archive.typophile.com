      <p>The gimmick is that the common glyphs are double-height, which is a clever design idea that draws attention to itself but makes reading either of the scripts ﬂuently more difﬁcult than if they were each the same height, one on top of the other.</p>
      <p>Is there an alternate version with Cyrillic on top?</p>
