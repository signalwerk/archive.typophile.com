      <p>I like it because the idea has meaning in this context, otherwise it would just be a gimmick.</p>
      <p>On the other hand, since this is about a font (right?) I have to ask: how is the Cyrillic influencing the Latin? To me it seems one-sided, even if I take into account that Cyrillic came from the same place (Greek) and was furthermore Westernized by Peter the Great.</p>
      <p>hhp</p>
