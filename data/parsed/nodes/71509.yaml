      <p><cite>Most people wouldn't be able to edit such a document, but it is possible.</cite></p>
      <p>You don’t have to worry about the possibility that someone will crack open your PDF and edit it when you clearly create it to not be editable. As long as you get things right the first time around you’re ok.</p>
