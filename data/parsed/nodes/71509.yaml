      <p>'If I embed a font in a PDF document created with MS Word or InDesign, is it allowed for me to put this PDF online?'</p>
      <p>Those four conditions that a number of font-makers treat as standard are generally recognized as being sufficient, certainly by Adobe and FontShop; they vary from 'anything goes' to 'no embedding'. Word honours them, and Acrobat at least warns you about disregarding them.</p>
