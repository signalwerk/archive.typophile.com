  html: |-
    <p>Below are excerpts from font licenses from the Adobe shop and Fontshop.  If I embed a font in a PDF document created with MS Word or InDesign, is it allowed for me to put this PDF online?  Most people wouldn't be able to edit such a document, but it is possible. Any guidance is appreciated</p>
    <p>-- F</p>
    <p>"Preview &amp; Print: A font with an embedding permission of Preview &amp; Print allows the font, either fully or as a subset, to be embedded in an electronic document solely for the purpose of viewing that document on screen and/or printing that document. While a font with a Preview &amp; Print embedding permission (either through data in the font file or the font’s license agreement) may be embedded in an electronic document, the embedded font may not be used to further edit the document it is contained in or to edit or create other documents. Most fonts in the Adobe Type Showroom are set for Preview &amp; Print embedding."</p>
    <p>"Embedding. You may embed the Font Software in documents, applications or devices either as a rasterized representation of the Font Software (e. g., a GIF or JPEG) or as a subset of the Font Software as long as the document, application or device is distributed in a secure format that permits only the viewing and printing but not the editing of the text. You need an additional licence from FSI or its Distributors (i) for the use of the Font Software in documents, applications or devices permitting editing of the text, if such documents, applications or devices shall be distributed to third parties or (ii) if the Font Software is embedded neither as a subset nor as a rasterized representation."</p>
