      <p>"encoded in LIGA"</p>
      <p>In one way of looking at it, this is a perfectly logical phrase. But it is easily confused with "encoded" as in "having a codepoint assigned to the glyph." So for clarity I think one might want to use a different verb there, or just leave out that word entirely.</p>
