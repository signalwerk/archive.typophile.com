  - id: 543321
    user: 188621
    date: 2013-02-14T08:00:00
    date_raw: 14 Feb 2013 — 8:00am
    votes: null
    html: <p>In Octant, only the f_* ligatures, Q_u, and T_h are encoded in LIGA (standard ligatures), whereas the rest are in DLIG (discretionary ligatures). Typographically unsavvy applications such as PowerPoint typically have LIGA enabled but DLIG disabled, and no option to change that. In Octant Ligatures, all ligatures are encoded in LIGA, so they will work in PowerPoint. You can switch them on and off by switching between the two font versions.</p>
    html_clean: <p>In Octant, only the f_* ligatures, Q_u, and T_h are encoded in LIGA (standard ligatures), whereas the rest are in DLIG (discretionary ligatures). Typographically unsavvy applications such as PowerPoint typically have LIGA enabled but DLIG disabled, and no option to change that. In Octant Ligatures, all ligatures are encoded in LIGA, so they will work in PowerPoint. You can switch them on and off by switching between the two font versions.</p>
