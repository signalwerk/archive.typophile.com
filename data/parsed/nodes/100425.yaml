  html: |-
    <p>In case you haven't followed my thread in the Critique section, I'd like to introduce my first typeface: Octant, a display font inspired by Victorian brass-and-steel engineering as well as blackletter ornamentation. It comes with wide-ranging language support and decorative ligatures, and is now available on MyFonts at a 51% introductory rebate. :)</p>
    <p><a href="http://www.myfonts.com/fonts/catharsis-fonts/octant/" title="http://www.myfonts.com/fonts/catharsis-fonts/octant/">http://www.myfonts.com/fonts/catharsis-fonts/octant/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/poster_promo_3852.png"></div><p></p>
    <p>By the way, I'm new to selling fonts — what does one do to promote a new font, apart from what MyFonts does on their own? Any key fora, newsletters, platforms, etc that one should send a note to?</p>
