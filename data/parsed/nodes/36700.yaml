    <p>I know there have been some older threads on this subject but does anyone have up to date information on what’s the best laser printer for checking type? I’m looking for a highresolution printer ideally A3 size. I know they are pretty expensive but I’m tired at looking at fuzzy B/W prints...</p>
    <p>Thanks!</p>
