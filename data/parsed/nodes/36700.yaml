      <p>That 5200 that Duncan uses was mine, but it is totally useless for proofing type. For layouts &amp; design, however, it is excellent. I was absolutely furious to find that it was rubbish for proofing type, especially buying it new. So I am on the lookout for a decent proofing printer. Sigh.</p>
      <p>I have also heard from a few other designers that they are having problems with new HP cartridges printing ’wispy’ type. Be interesting to know if anyone else is having the same problems. </p>
      <p>—K</p>
