    html: |-
      <p>I use an HP 5000. I’d switch to an HP 5200 but this sucker is seven years old and just keeps on ticking. Slower than the latest iteration but these days speed is relative.</p>
      <p>I had considered an Xante, for a number of reasons, including film processing (at 2400dpi), but specimens that were sent by the company revealed an awful lot of toner scatter, and since I was mainly interested in camera ready reproduction (back in 2000) I opted for the HP. Actually, can’t say I regret it. At an institution where I teach they have an Xante with film capacity (actually on my recommendation) and they have a lot of software connection problems with it plus repair maintenance is unbelievably expensive.</p>
      <p>Plus, even with 2400dpi and film capacity, the Xante still can’t anywhere come near the quality of an imagesetter.</p>
      <p>Gerald</p>
