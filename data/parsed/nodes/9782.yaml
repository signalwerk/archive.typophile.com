  html: "<p>I promised myself I wouldn't have my first post be an ID question, but I am stumped. <br> <br>The sample is both here and attached: <br><a href=\"http://img201.exs.cx/img201/2919/mysterytype2xe.png\" target=\"_blank\">http://img201.exs.cx/img201/2919/mysterytype2xe.png</a> <br> <br>I've been looking for a few days now, but all I can find are dumb-looking \"free\" chalkboard stuff. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/67427.png\" alt=\"Chalky mystery type\"></p>"
