    html: <p>The font is called Eraser Dust. It is on <a href="http://bowfinprintworks.com/Script12Pg3.html" target="_blank">Page 3 of Part 12</a> (Childish Lettering) of the Script Font ID Guide.   <br> <br>It was a David Rakowski font, which can sometimes be found on shareware/freeware sites, and was also sold by Intecsas.</p>
