      <p>hola, que bien encontrarte aqui,</p>
      <p>no se si puedes usarlo, pero a buscar info sobre la veloz encontre esto y me parece bastante modular: <a href="http://www.modulo75.com/nueveminutos/valencia04/09.htm">http://www.modulo75.com/nueveminutos/valencia04/09.htm</a><br>
      son fuentes de José María Cerezo</p>
      <p>y algo en aleman (te puedo traducirlo en la escuela)<br><a href="http://www.xs4all.nl/~maxb/benzin/indexdu.html">http://www.xs4all.nl/~maxb/benzin/indexdu.html</a><br>
      abjo hay una imagen de "la ikea black" de M. Schweitzer</p>
      <p>y las fuentes modulares mas facil naturalmente son los "pixelfonts". solo de rectangulos</p>
      <p>ademas: FF Stoned de fontshop o fontfont<br>
      y: Modula de emigre tambien parece ser solo de modules fijos y es como "Bauhaus" aunque no se si los modules de estos dos estan (demasiados) variables</p>
      <p>hasta luego,</p>
      <p>robin</p>
