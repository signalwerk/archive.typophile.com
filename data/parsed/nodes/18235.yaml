  html: <p>Estoy realizando un proyecto coordinado por M. S. para la asignatura  de tipografía en Bau (universidad en Barcelona); el briefing de este proyecto consiste en realizar un catálogo sobre "Tipografía y tipógrafos del S.XX", el motor para empezar a desarrollar este proyecto fue el SupertipoVeloz de Trochut, un ejemplo sin par en las tipografías modulares; agradecería recibir cualquier tipo de información sobre este campo, las tipografías modulares ya que principalmente lo que encuentro son tipografías experimentales de principios de siglo(vanguardias). Tanto en español como en ingles. Gracias y saludos a la comunidad hispana. Por cierto, al habla una gallega.</p>
