      <p>La joya de la Corona.</p>
      <p>Ya se que estas buscando información sobre tipografías modulares y que a lo mejor, por la fecha de tu post, que ya vamos fuera de tiempo. Pero he creído que te seria de utilidad el siguiente librillo sobre tipografía - <a href="http://www.catatomik.com/arxius/El_detalle_de_la_Tipografia_IMP.pdf ">El detalle de la Tipografia</a> -. Es un librillo sobre los principios de la tipografía que rescaté de la biblioteca de la Universidad Pompeu Fabra de Barcelona. Pertenece a COMPUGRAPHIC y como esta empresa fue absorbida por AGFA es complicado poder encontrar dicho librillo. Tuve la paciencia de transcrivirlo en su día y te/os lo dejo para vuestra utilidad.</p>
      <p>Saludos y espero que sea de tu ayuda o curiosidad.</p>
      <p>Marc</p>
