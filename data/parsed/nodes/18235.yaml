      <p>Buenas noches Andreu,<br>
      Gracias por los enlaces; en realidad mi búsqueda había comenzado aquí, y con el catálogo de Super-Veloz. Más tarde TIPOGRAFÍA DEL SIGLO XX, donde he completado un poco más la información sobre tipografías modulares (quedándome en los años 30), MÁS ALFABETOS Y OTROS SIGNOS ABZ, donde he encontrado pequeñas joyas, para mi desconocidas como la fuente de un catálogo de fuentes italiano, Fregio Mecano. Sin embargo, a nivel actual no encuentro ningún tipo de información escrita, tan solo son imágenes de Typography (nº)- The Annual of the Type Directors Club, entre otros. Te agradecería que si tienes alguna pista que me pueda ayudar la compartieras conmigo.</p>
