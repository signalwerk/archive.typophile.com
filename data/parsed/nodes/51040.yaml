      <p>I like the concept.</p>
      <p>O, Q, and D look too similar. N looks dark (maybe widen it?) W looks bottom-heavy. Top counter of A is probably too slight.</p>
      <p>Straight-left-side counters in P, R, B aren't consistent with E, F.</p>
