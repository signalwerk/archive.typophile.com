    date: 2008-10-29T09:40:00
    votes: null
    html: |-
      <p>Given that it feels to be a very strong display face, a lowercase may not be all that important.</p>
      <p>It definitely has a nice personality.</p>
      <p>The only nitpik that I have is that there is some inconsistency with how the edges of the counters are treated. Some are rigid and straight, some are bowed in, and some (like on the B) are a mix. I'm not saying that's good or bad...just that it's something that seems to stick out.</p>
      <p>I agree with cuttlefish and eliason's comments as well. Do more with the Q and maybe vary a few of the others. The C might not need such large stems on the open side.</p>
