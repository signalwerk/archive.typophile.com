    html: |-
      <p>The tail on the Q is quite stubby. I want to put a little notch above it to make it read better. Some little bulb shaped ink traps in the tight angles might help too.</p>
      <p>A nice tall gothic overall. the little blobs on the stroke corners almost make this a serif font. It could easily be one if they were exaggerated a touch more.</p>
