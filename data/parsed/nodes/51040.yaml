    html: |-
      <p>The ampersand still needs work - the long horizontal in the middle isn't serving you well.</p>
      <p>I think I preferred the previous @. Yes, I think * could still be reduced.</p>
      <p>The bottom two strokes of the 2 look heavy to me.<br>
      Is the middle of 2 and S truly horizontal? I suspect it is, but it appears "overtorqued" as an optical illusion from the treatment of the corners, etc. I'd be curious to see what those glyphs would look like if you rotated the center to get an optical horizontal. </p>
      <p>Another thing you could consider would be redrawing the 2 with a diagonal (so the bottom is more like Z).</p>
