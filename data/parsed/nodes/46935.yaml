      <p>Is that the only image they supplied you with? That doesn't scream luxury to me at all. The blues make this very cold; it's almost mono-chromatic...when I think of a luxury home I think of warmth; something inviting. It's also very flat...it seems there could be more depth.  I also agree with ZUZ3L and tina's suggestion of a script font or possibly something clean and modern.</p>
      <p>Could you possibly work in smaller photographs of the inside of one of these luxury homes?</p>
