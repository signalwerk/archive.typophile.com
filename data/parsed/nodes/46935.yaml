      <p>If it was up to me, I would've colored the roofs bright red. Other than that, think scale: 'luxury' - much larger, that comma is a disaster (closer and smaller). There are kerning issues in the title. 'Lifestyle &amp; location': either bring it closer to the top line or give it an oversized pretty ampersand, maybe a color accent on the ampersand. I think it was Philip Stark who said that helvetica/(arial) when used as small paragraph text looks like shit. Try Arno maybe. </p>
      <p></p>
