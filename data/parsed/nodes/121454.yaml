    <p>Hello,</p>
    <p>I’m searching for resources on designing typefaces for screen (books, websites, blog posts, etc.). I’ve looked here and there and didn’t find anything so I wondered if someone here could be of some help. This question is curiosity-driven since I’m not working on such a project, this is why I wanted to focus on the design part of the issue. I know of course that hinting comes into play for the rendering process on screen and that every screen and situation (based on software, etc.) is different, but this not a technical question (and that’s why I’ve put it in the Design section). I’m talking about the forms of the letters. What are the design principles for type design for screen? For instance, if I take a look at Px Grotesk by Optimo (<a href="http://www.optimo.ch/typefaces_Px-Grotesk.html" title="http://www.optimo.ch/typefaces_Px-Grotesk.html">http://www.optimo.ch/typefaces_Px-Grotesk.html</a>), I can deduce that it is grid based and that there is a strong emphasis on the squareness of the stems to match the pixels. This is the kind of information I’m looking for. I can look around and compare typefaces of course but I wanted to know if there was some kind of exhaustive resource like there is <em>Size-specific adjustments to type designs</em> for the subject of designing for specific sizes.</p>
    <p>I hope I was clear enough and thanks in advance.</p>
