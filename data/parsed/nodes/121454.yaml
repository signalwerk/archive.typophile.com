    html: |-
      <p>It's a good question. </p>
      <p>I mostly agree with Mike and Frode,  though "quantification (which is a variant of the same thing I’m talking about – only he seems more interested in the x-direction", is not quite all right. I quantize quantifiably.;) </p>
      <p>My interest in x is no more than Latin's greater complexity there. I think Latin glyphs exhibit uniqueness in their combinations of x and y things. But in y there are a few alignments, their over/undershoots, and waistbands, while in x, each letter has something unique.</p>
      <p>It's slightly more comforting a design process than normal though, as the way a normal font may be used off-screen, it's nearly impossible to test everything that may be done with it, while designing for, e.g. small size use, only on the web, the designer is much more free to really look at, and address everything likely to happen in recommended use, for a change. ;)</p>
