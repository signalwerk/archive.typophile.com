    html: |-
      <p>Dear Emmanuel, </p>
      <p>I don’t think PX Grotesk is a very relevant example. I like it very much. However, it is not <em>drawn for,</em> but <em>inspired by,</em> the æsthetics of lowres. I would rather look into Font Bureau’s RE series, or other initiatives like H&amp;FJ’s ScreenSmart fonts,  Typotheque’s Screen fonts, Letter From Sweden’s Core fonts or our (Monokrom’s) Screen series (admittedly not much of a series, yet). You can read a little bit about <a href="https://monokrom.no/fonts/aften/design" rel="nofollow">my process with Aften Screen here</a>.</p>
      <p>I went far with Aften Screen, and perhaps I will tone it down in the future when medium resolution screens are more common, but there are still lessons to be learned. With anti-aliasing, letters start to behave very much like they do in small sizes on paper. When blurry edges overlap and multiply, you end up with a fuzzy image. One can counteract this by moving things further apart: enlarging the x-height, drawing wider shapes, increasing the spacing, simplifiying shapes, opening the apertures, “trapping” the corners &amp;c. The ideal weight of a text cut differs from browser to browser and system to system, but better results can generally be achieved with a slightly lighter weight than the ideal print weight. You’ll want to focus mainly on simplifying things that cause fuzz in the y-direction. The computer doesn’t have eyes – it sees only coordinates. If some vertical alignment differ only by a few units across your styles, it is bound to be rounded differently by different browsers and different systems at different sizes. David Berlow preaches a different, but related, idea (and I’m not indifferent, just focus slightly differently): quantification (which is a variant of the same thing I’m talking about – only he seems more interested in the x-direction). </p>
      <p>Another thing, that is not directly design related, but crucial to contemporary web fonts: keep the points as few as possible, keep your hinting effective, and use components whenever possible – in short, keep the file size as tiny as possible.</p>
