    html: |-
      <p>This is looking nice. The numerals are fun. Here are my observations. Remember the salt, Frode!<br>
      B is lovely.<br>
      C might be a bit wide. And F.<br>
      J has a bumpy curve.<br>
      Tail of Q could be a bit longer?<br>
      Leg of R meets the waist a bit too far out — I think you could bring it in a notch.<br>
      X could do with the uphill stroke offset a bit.<br>
      N, Z, 6 and 9 look wide to me.</p>
      <p>Lowercase:<br>
      f could benefit from a wider hood.<br>
      Two storey g is great.<br>
      Single storey g could need the tail to be longer; the bowl looks wide in comparison.<br>
      k looks a bit wide.<br>
      l has some problem with hinting on my screen:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/l-problem_5339.gif"></div><br>
      m and n are really good.<br>
      q looks wider than p, perhaps.<p></p>
      <p>I agree the oldstyle figs look a bit too tall. I'd make the tail of comma heavier.</p>
