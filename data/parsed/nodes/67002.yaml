    votes: null
    html: |-
      <p>I am cutting the terminal of a lowercase 'a' in the same fashion.</p>
      <p>My logic for designing this way was cutting after the extreme of the curve as opposed to before, and depending on the character and orientation of the curve I didn't feel I needed to cut each terminal at the same point or also, importantly, in the same direction. I know that sounds really inconsistent but it generates four possible endings as opposed to one. Two possible terminals (before and after the extreme of a curve) makes complete sense to me.</p>
      <p>I'm not really ready to show my drawing, but I hope you understand what I mean. If not I will try to illustrate what I mean. To apply my description to Frode's type sample the terminal in 2 is cut after the curve has reached it's extreme but 6 is cut before. The terminal of the 2 is also cut at an angle, the 6 is not. Two variables, each employed at once. To make it more logical as Tomi puts it might be to vary only one of these options.</p>
      <p>Sorry that was such a mouthful, I'm not very well, and a bit nervous about contributing.</p>
