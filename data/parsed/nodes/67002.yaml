    html: |-
      <p>x-height of OSF looks better. Maybe the extenders of three, five, six, eight, and nine should be brought in too. I love the height of your lining figures.</p>
      <p>The joining of O and E in /OE/ looks wooden (compare /d/).</p>
      <p>I think many of your diagonal vertices look like they're pulling apart; the counter gets too close to the outer contour at the acute angles. I see this in /A/V/W/AE/v/w/.</p>
      <p>Very diagonal shears on two and three might be a bit out of character.</p>
      <p>/K/'s arm looks a little thin to me.</p>
      <p>The subtle pulling back of the stem near the joins (as in the top right of one-story /g/ or top left of /n/ is quite nice.</p>
      <p>Could /D/ stand to be a little wider?</p>
      <p>Ampersand looks very "loose" for this font, is that purposeful?</p>
