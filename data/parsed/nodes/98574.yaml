    html: |-
      <p>Zemaitis has such amazing hand engraving (the real stuff, not like the directed scratches you get at a trophy shop), that it must have been hand drawn Tony Zemaitis himself. You might even write the company in England and see if they know (Tony passed away a few years ago). It sort of reminds me of lettering I've seen on western saddles, which probably doesn't help much in finding a similar font. </p>
      <p>My specialty is our own guitars, but I do love musical instruments of all types!</p>
