      <p>You are totally right, Hrant, I forgot to say that: the typeface is supposed to look elegant for big titles, like 48 pt size, for magazines of Arts &amp; Crafts.<br>
      The aims of my project have to do with unbracketed serifs, certain contrast, humanist axis and a x-height relatively small. At first, I will develop a regular weight and later, variations like bold and italic.<br>
      So far, this is all I have.</p>
      <p>Thanks again,</p>
