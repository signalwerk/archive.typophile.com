    <p>Hi everybody, this is my first post.<br>
    I will develop a Serif Display to my post Graduation final project. It will be projected for a Craft magazine and I am looking for some good typefaces that I could use as a reference for my studying.<br>
    Do you have any suggestions?</p>
    <p>Thanks in advance, </p>
    <p>cheers,</p>
