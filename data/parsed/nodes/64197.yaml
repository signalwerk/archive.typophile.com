      <p>Just to clarify, the <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Masthead_(publishing)">masthead</a> of a newspaper lists the staff. The flag or <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Nameplate_(publishing)">nameplate</a> is what you are presenting.</p>
      <p>I like that you aren't having the flag span the entire page width, so have you considered a vertical arrangement where the logo/mark/bug is focused presented on top of the word  "bulletin"? I feel like you can make that "BCFE" mark your flag and keep it to 1/4 or a 1/3 or the page width. Below is a rough  and dirty example: </p><div class="imageWrap"><img src="http://typophile.com/files/bulletin_6116.jpg"></div><p></p>
