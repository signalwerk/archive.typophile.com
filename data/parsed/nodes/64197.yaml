      <p>At this stage, I would think primarily in terms of creating a solid full-page grid. The masthead works in conjunction with the rest of the page.</p>
      <p>In your attached example, the baseline of the "bulletin" portion of the masthead feels weak, because of the lowercase "bu". I would definitely not use lowercase with that particular typeface (and most faces will have the "bu" problem).</p>
      <p>By the way, you can do a lot with the free and or stock fonts. A combination of grid and appropriate sizing and weighting can yield great results.</p>
