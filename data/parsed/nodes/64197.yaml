    <p>Hi, I'm a Production Editor currently working on a masthead for my college newspaper and would appreciate some critique of how it's looking so far.</p>
    <p>Background information: The paper will be a tabloid (not a red-top) and I'm using the Franklin Gothic family for headlines. The college contains mostly art and media courses so I'm trying to shy away from the typical newspaper masthead. I can't spare any funds on buying fonts so I'm stuck with what we already have which is mostly default and a few free downloads. The masthead won't stretch fully across the page, it'll go about halfway, positioned at the very top of the page.</p>
    <p>I included both colour and black &amp; white versions in the attachment.</p>
    <p>Any and all critique is much appreciated. As long as you can back your opinions up be as harsh as you want!</p>
