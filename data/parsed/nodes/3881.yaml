  html: <p>Hi, <br> <br>I created this logo a couple of years ago and I would like to hear what you think about it. <br><img src="http://www.typophile.com/forums/messages/29/3059.gif" alt="SpicySpoon logo"> <br>The font is Meta and the spoon is drawn by hand and vectorized. <br>The company sells spices and spice grinders etc. <br> <br>Regards, <br>Jacob</p>
