    html: "<p>Structurally nice, but too mild, man! <br>The obvious  thing would be to use a spicy font, like something with flames, like Sotoflame: <br><a href=\"http://www.typophile.com/forums/messages/29/3025.html\" target=\"_top\">http://www.typophile.com/forums/messages/29/3025.html</a> <br> <br>A more tasteful thing would be to change the top flat part of the spoon's head into something with small flame-like protrusions. Or at least do something with that \"p\" close to the spoon. <br> <br>hhp</p>"
    html_clean: "<p>Structurally nice, but too mild, man! <br>The obvious  thing would be to use a spicy font, like something with flames, like Sotoflame: <br><a href=\"http://www.typophile.com/forums/messages/29/3025.html\" target=\"_top\" class=\"link-lost\">http://www.typophile.com/forums/messages/29/3025.html</a> <br> <br>A more tasteful thing would be to change the top flat part of the spoon's head into something with small flame-like protrusions. Or at least do something with that \"p\" close to the spoon. <br> <br>hhp</p>"
