  html: |-
    <p><a href="http://typophile.com/node/32680#comment-196874" title="http://typophile.com/node/32680#comment-196874">http://typophile.com/node/32680#comment-196874</a> Bill Troop writes:<br>
    Postscript will sooner or later move to floating point because it has nowhere else to go -- in fact, David Lemon has explained that to a certain extent it already has done so. (I don't recall exactly how to get it to work, but apparently it _can_ work.) I can see all kinds of benefits to this precision even where there the output cannot resolve the available precision. For example, hinting algorithms could be much more accurate, couldn't they?</p>
    <p>I made an experiment, I shifted one control point a bit:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1B35_6314.jpg"></div><br>
    "a bit" is 0.0007324 of EM<br>
    I generated an OT CFF font.<br>
    In CorelDraw 9 I placed two identical (besides that one point moved) letters one onto another.<br>
    Black letter is unmodified and yellow with one BCP shifted lays beneath:<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2C25_3750.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/340_6022.jpg"></div><br>
    Font 1000 EM, Windows XP, FontForge, CorelDraw 9<p></p>
