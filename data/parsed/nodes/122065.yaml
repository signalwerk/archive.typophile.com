      <div class="comment-spam-body"><p>The base font for this lettering is CastleType's Latin CT, and uses a blend of the condensed width </p><div class="imageWrap"><img src="http://typophile.com/files/LatinCTCondAsClot_5953.gif"></div> and regular width <div class="imageWrap"><img src="http://typophile.com/files/LatinCTAsClot_6653.gif"></div><br>
      CastleType's products are well make and worthy of purchase.<br>
      Through an oversight I did not mention the foundry in my earlier post. Here is a link to the fonts <a href="https://www.myfonts.com/fonts/castletype/latin-ct/" title="https://www.myfonts.com/fonts/castletype/latin-ct/">https://www.myfonts.com/fonts/castletype/latin-ct/</a><br>
      The spurs are added to demonstrate the ease of making something similar to the "Bowery" style of lettering that Nike has used for its clothing <a href="http://typophile.com/node/103278" title="http://typophile.com/node/103278">http://typophile.com/node/103278</a><br>
      Have fun making your own version.<br>
      Don<p></p>
      </div>
