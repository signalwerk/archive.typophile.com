  - id: 595838
    user: 205259
    date: 2014-12-18T08:58:00
    date_raw: 18 Dec 2014 — 8:58am
    votes: null
    html: |-
      <div class="comment-spam-body"><p>Thank you Tylor for the kudos.<br>
      The result seems to be successful as a Latinate serif with spurs, but I find the spiky tone of the resulting design to be somewhat aggressive and appropriate mainly for bikers, angry rock bands and the ilk.<br>
      When the same spurs are used on a font with a softer serif treatment, such as a plush fish tail Tuscan, the effect is more of an ornamented space filler that producdes a font that has a tone suitable for applications from stock certificates to restaurant menus. The spurs might also work for a similar wide range of applications if it is used on font with a Clarendon or thick slab serif.<br>
      Don</p>
      </div>
