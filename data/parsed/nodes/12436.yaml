    <p>I don't know how I overlooked this, but typophile <a href="/wiki/Grant%20Hutchinson" class="freelinking" rel="nofollow">Grant Hutchinson</a> has created a slick bookmarklet/favelet that lets you search Typophile (via Google) while we tinker under the hood to get our official search tool back into action. With the wealth of content to sift through (100,000+ posts in the Forums alone), I can't recommend this tool more during the interim. It even crawls our newest feature, the <a href="wiki" rel="nofollow">TypoWiki.</a></p>
    <p>Simply drag the link Grant provides to your browser's favorites or bookmarks bar, and it will pop a small Typophile search window every time you click it. Google does the rest.</p>
    <p>Grant, you deserve a medal.</p>
    <p><a href="http://splorp.com/blog/archive/2005_05_01_archive.html" title="http://splorp.com/blog/archive/2005_05_01_archive.html">http://splorp.com/blog/archive/2005_05_01_archive.html</a></p>
