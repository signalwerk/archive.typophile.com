    <p>Hi there, I'm currently looking for a geometric sans serif with a design similar to Kabel Light, but, if possible, with some alternate glyphs to give it more personality. I'm inspired by a typeface designed by Ian Party, named Sang Bleu 5, which unfortunately is not for sale:</p>
    <p><a href="http://www.ianparty.com/index.php?id=6" title="http://www.ianparty.com/index.php?id=6">http://www.ianparty.com/index.php?id=6</a></p>
    <p>I'm also fascinated by the design of a late 60's British team, Bentley/Farrell/Burnett, and the use they made of (apparently) hand-made variations on the Avant Garde / Kabel lineage:</p>
    <p><a href="http://mikedempsey.typepad.com/.a/6a00e5532538c48833011169029392970c-800wi" title="http://mikedempsey.typepad.com/.a/6a00e5532538c48833011169029392970c-800wi">http://mikedempsey.typepad.com/.a/6a00e5532538c48833011169029392970c-800wi</a></p>
    <p><a href="http://mikedempsey.typepad.com/.a/6a00e5532538c48833011169028bb7970c-800wi" title="http://mikedempsey.typepad.com/.a/6a00e5532538c48833011169028bb7970c-800wi">http://mikedempsey.typepad.com/.a/6a00e5532538c48833011169028bb7970c-800wi</a></p>
    <p>Any suggestions?</p>
    <p>Thanks!</p>
