    <p>May seem a bit strange to talk about illuminated manuscripts on the radio, but <a href="http://www.kqed.org/programs/program-archive.jsp?progID=RD19&amp;ResultStart=1&amp;ResultCount=10&amp;type=radio" target="_blank">Forum</a>, my local public radio talk show managed to do so for an hour. This was brought about by an exhibit at the Legion of Honor in San Francisco. <br> <br>Scroll down to the  July 1st show and you can listen to the archive. <br> <br>Wanna find out more about the exhibit, here's the <a href="http://www.thinker.org/legion/exhibitions/exhibition.asp?exhibitionkey=252" target="_blank">Legion of Honor site</a> <br> <br>I assume the radio show was *ahem* illuminating as it frequently is, but I was a bit preoccupied when I heard it live so will have to follow the link myself and give it another listen. <br> <br>Haven't seen the show yet, but I plan to (I've got until August)</p>
