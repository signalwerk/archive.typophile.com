      <p>Pardon my French.</p>
      <p>The way I understand VOX, Humanist is a subset of Old-Style – more specific, the first generation of antiqua types. We also use the term <em>Humanist</em> to describe similar skeletal structures, as well as traces of handwriting,  in sans serif designs. </p>
      <p>A better term, perhaps, is <em>Dynamic</em> (as opposed to <em>Static</em> – Grotesques, Transitionals, Moderns – or <em>Geometric).</em> The reason is, these terms can be applied to sans serifs, serifs, slab serifs, blackletters, scripts &amp;c without historical conflict. This is especially relevant when a lot of contemporary type design combines elements from multiple – or even breaks out of – established genres.</p>
      <p>PS: It has been pointed out previously that there are often skeletal similarities in geometric and humanist designs.</p>
