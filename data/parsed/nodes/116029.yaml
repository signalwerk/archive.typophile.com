    <p>Hi there,</p>
    <p>I'm a somewhat newbie to the world of typography - hence the eventual question - but have always been an admirer of fonts and their uses in everyday mediums. I'm currently studying graphic design, and on my holidays have taken up some time to do some extra research on type classification because, well I just like it! Anyway, I'm reading about Humanistic/Venetian typefaces, and how that led the way to Old Style typefaces which were less calligraphy based and more refined etc. However, in half of the articles I read online, they refer to the Humanist typeface phase as being labelled 'Old Style'.... so I'm naturally confused a little right from the get-go. Is this just a result of the proximity and chronological order of these two styles blending into one another in some people's eyes, or is there an obvious distinction or answer to this that I'm completely oblivious to?</p>
    <p>Any kind of clarification will be very much appreciated. I really want to grasp this stuff as it interests me greatly.</p>
