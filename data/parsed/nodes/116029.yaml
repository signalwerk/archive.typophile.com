      <p>The term "Humanist" has more than one meaning in typography.</p>
      <p>The earliest Old Style typefaces were based on a manuscript hand to which the term "Humanist" was applied. But that term is not applied to <em>those</em> typefaces.</p>
      <p>Instead, when a typeface is called "Humanist", it's something like Gill Sans or Optima - a sans-serif typeface which, instead of being a classic Grotesque, a more attractive Gothic (a deprecated term as it's also applied to blackletters) like Franklin Gothic or News Gothic, or a Geometric like Futura or Kabel, borrows many of the proportions and characteristics of serif typefaces for more comfortable reading.</p>
      <p>Note that I didn't mention Helvetica and Univers, which belong to yet another category of sans-serif faces the name of which I don't recall offhand at the moment.</p>
