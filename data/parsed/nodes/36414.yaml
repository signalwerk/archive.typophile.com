    html: |-
      <p>Two suggestions:</p>
      <p>1. Audio record the talks and workshops. The recordings, combined in a package with slides from the speakers could be sold afterwards, or given to attendees and sold to others. I think that particularly technical workshops would sell, as people on Typophile who couldn't get to conferences has said so. </p>
      <p>The speakers would need to number slides and identify them as they talk. This approach might be easier to pull off and cheaper than trying to film the presentations, which would cost more. Often speakers are in the dark anyway. </p>
      <p>2. Have a panel to discuss optical size and type design. How do different designers treat problems of optical size--x height, contrast, spacing etc.? Does it vary with the intended use: Does what is desirable hange with newspapers, magazines, books, the web? What is the recent history of this--Adobe, FontBureau, H&amp;FJ, etc.? Are there trends?</p>
