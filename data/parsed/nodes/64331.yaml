    html: |-
      <p>Actually, Bill, the Benton Gothic/Benton Sans series was based more on Morris Fuller Benton's various sans serif series for ATF (including News Gothic, Franklin Gothic, and Lightline Gothic); hence the name.</p>
      <p>Trade Gothic was Jackson Burke's variation on the theme, designed for Linotype a couple decades after Benton's.</p>
