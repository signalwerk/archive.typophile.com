      <p>Have a look at the condensed styles of Cyrus Highsmith's <a class="freelinking external" href="http://www.fontbureau.com/fonts/Antenna" rel="nofollow">Antenna</a>. They have a fresh look, and the angularity of Highsmith's style seems to work particularly well in condensed styles.</p>
      <p>I was very impressed with how well the different weights and styles of <a class="freelinking external" href="http://www.fontbureau.com/fonts/BentonSans" rel="nofollow">Benton Sans</a> worked together in Armin Vit's catalog for this year's TypeCon. This design was worked on first by Tobias Frere-Jones and then Highsmith. It is originally based on Trade Gothic, but worth a look.</p>
