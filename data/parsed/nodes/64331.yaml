    <p>I need some help finding good new condensed fonts.<br>
    I am a book-cover designer and space economy is often important in my trade.<br>
    I´ve been using DIN Engschrift and Trade Gothic Condensed for a looong time now<br>
    and I feel it´s time to update my fontlibrary.</p>
    <p>/p</p>
