    <p>Hi all,<br>
    I am looking for a Sans that is not Futura, Helvetica, or Gill (paying for it is fine).  I would like something that would work well with a circus-themed yearbook, and would work well with these fonts: Cast Iron (<a href="https://web.archive.org/web/20080830085858/http://www.abstractfonts.com/fonts/static_Circus_1.html" title="http://www.abstractfonts.com/fonts/static_Circus_1.html">http://www.abstractfonts.com/fonts/static_Circus_1.html</a>), Circus (<a href="https://web.archive.org/web/20080830085858/http://members.fortunecity.com/jlindgren/page07ccircus.html" title="http://members.fortunecity.com/jlindgren/page07ccircus.html">http://members.fortunecity.com/jlindgren/page07ccircus.html</a> near the end), and Big Top (<a href="https://web.archive.org/web/20080830085858/http://www.shamrocking.com/fonts.html" title="http://www.shamrocking.com/fonts.html">http://www.shamrocking.com/fonts.html</a> under “Free” and half-way down the list; it is sort of hard to see).</p>
    <p>Thanks!</p>
    <p>-Will</p>
