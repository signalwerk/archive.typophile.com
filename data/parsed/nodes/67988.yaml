    <p>Hi, longtime lurker here, best type site in the world!</p>
    <p>I did a search but had no luck, even searched google using the site: command, topics came up, but when clicked on, did not go where it should, so I am posting here. I am a web designer and with some down time, I have been focusing more on type. Do you have any favorite css typography sites that you visit and can recommend? </p>
    <p>I found a these and enjoy them.<br>
    <a href="http://webtypography.net/" title="http://webtypography.net/">http://webtypography.net/</a><br>
    <a href="http://www.webdesignerwall.com/tutorials/typographic-contrast-flow/" title="http://www.webdesignerwall.com/tutorials/typographic-contrast-flow/">http://www.webdesignerwall.com/tutorials/typographic-contrast-flow/</a><br>
    <a href="http://www.alistapart.com/topics/design/typography/" title="http://www.alistapart.com/topics/design/typography/">http://www.alistapart.com/topics/design/typography/</a></p>
    <p>Thanks</p>
