    <p>Hi, </p>
    <p>I have a dense, very Excel-looking reporting project that is auto-generated into a pdf for screen and crappy printer use.  For the text labels, which are typically all caps (not even small caps), I'm looking at using Calibri (or: Verdana, Trebuchet, Orator).</p>
    <p>Most of the report is taken up by numeral blocks filling the resulting grid cells.  They'd be at most 3 characters (0.00) and have a color coding scheme ranging 30%-90% gray, but usually at about 50%.  Not every cell is filled, ranging from 30% - 90% filled, depending on the report (the sparser ones are naturally easier on the eyes).  The attached <a class="freelinking external" href="http://typophile/files/matrix.gif " rel="nofollow">image</a> is an approximation.</p>
    <p>What would be a good, legible font for the numerals?  </p>
    <p>Thanks,<br>
    Julie</p>
