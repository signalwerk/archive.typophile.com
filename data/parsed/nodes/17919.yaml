      <p>Eric, you're doing very well. Be patient: Rome wasn't built in a day, and neither are Roman types.</p>
      <p>One thing that sticks out to me is the top right curve of the counter in d and q: It's a bit off somehow. Play with the node and BCP placement; try pulling the node up with the option key depressed to move the node but leave the BCPs where they are. This will crisp-ify that corner a bit.</p>
      <p>The initial work on the Italic is very good. Don't work yourself into a frenzy on this. I would hate for you to end up like your avatar.</p>
