    html: |-
      <p><em>...faceting...</em> <em>...fracturing...</em></p>
      <p>These are different things. Fracturing involves breaking a stroke, usually inside and outside. Faceting is more akin to chiselling a concave or straight bevel onto a convex profile---like the underside of your "a". I've drawn sample facets onto r, a, d, b, u, q. Watch for different examples of the same letter. Have also shifted areas of weight around (most noticable on "r") to go with the cursive flow as indicated by arrows.</p>
      <p>Shortening the "q" bowl is optional.</p>
      <p>Faceting the "o" is too tuff to simulate with pixels :)</p>
      <p>Not all changes are marked-up (Eric, please keep inline pics to 620 pixels or less. Check the FAQ. Sorry admins):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ewest.gif"></div><p></p>
      <p>Faceting on the outside of bowls:</p>
      <p>* creates more contrast between inside and outside shape---shape contrast<br>
      * adds potent design and styling opportunities<br>
      * adds micro-detailing</p>
      <p>This treatment looks rough or "ugly" up close---not unlike many other highly-regarded text fonts. The gouge in the second "r" is the kind of small detail that goes unnoticed at normal reading speed, but helps readablility by adding randomness to the picture (or so we think). I would make 3 or more different r's with differing details (vary not just the facet but also the terminal geometry and weight) and program them as random OT alternates.</p>
      <p>BMW's industrial designers used faceting on the rear of the new 1 series car. This is a strong styling motif in the rediscovery of sculpting in metal the company is applying to other models in their range, and which rival manufacturers will be mimicking right about now. The "flame sculpting" on the side of this car was also originated by BMW. Flame sculpting places a convex curve inside a concave curve---a bulge within a facet---for extra fun, or "Vorsprung en technic" as they say in Germany.</p>
      <p>Love!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BMW1.jpg"></div><p></p>
      <p>j a m e s</p>
