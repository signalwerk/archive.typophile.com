      <p>Eric;</p>
      <p>Have you added kerns to any character pairs yet? I'm guessijng you haven't. It looks like your spacing problems are due to side bearings being incorrect. Get the side bearings right first---for basic letter fit.</p>
      <p>Kerning comes last to fix any spacing problems that can't be solved with side bearing settings. For example, the "l-i" combo is bad because the left side bearing on "i" is too wide. I can tell by looking at other combos with "i".</p>
      <p>The fractured arm treatment on your "a" is interesting (I like it) but disturbing in context of all those other smooth glyphs. It would fit in in a gothicized roman. Smooth it into a curve, or fracture all the other glyphs with curved bowls to match. The fractured upper stroke of the "a" bowl can stay---it matches m, n, h, b. Consider fracturing the arm of "r" to match those.</p>
      <p>My brain hurts too sometimes ;)</p>
      <p>best regards,<br>
      j a m e s</p>
