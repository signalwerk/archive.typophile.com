    html: |-
      <p>To fix your side bearings, open up a good commercial seriffed text font and study the side bearing settings. They generally conform to a consistent plan. Rounds all take similar values, relative to straights, which all fall into a consistent range. Diagonals are always very close or negative. Try to ignore distances from side bearings to serif tips---concentrate on the distance from the stroke. Distances from serif tips are more relevant with diagonal letters and bars like t, f, L, T, F, E etc.</p>
      <p>When you've figured this scheme out, copy it---the scheme, not actual values. Follow the scheme and adapt to suit your font.</p>
      <p>Certain letter combinations will always be problematic. Ignore. Set for good spacing overall.</p>
      <p>j a m e s</p>
