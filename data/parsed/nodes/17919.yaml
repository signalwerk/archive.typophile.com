      <p>Eric, you're very welcome. </p>
      <p>With a text font like this don't be afraid to take risks.</p>
      <p>You can take the word of the internal consistency brigade ("all huff and puff" according to Hrant) and be totally consistent for the sake of stylistic unity---at exteme close-up.</p>
      <p>Or ignore some of that and accept that text fonts are, by neccessity, crude by design in parts for the sake of performance---at text sizes, especially in print.</p>
      <p>The "o" could be faceted alright, or left unfaceted, then tested under realistic conditions. If no problems crop up, fine.</p>
      <p>Integrate as needed.</p>
      <p>j a m e s</p>
