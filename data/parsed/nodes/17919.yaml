      <p>Eric, I think you need to seriously re-evaluate the whole deadline/timetable thing.</p>
      <p>Type design takes years to master. While several MA programs have now been able to create a rigid, one year program, this cannot simply be ported over to an undergraduate degree program, especially when one is working alone—which I suspect you are. Several European students do manage to do great first typefaces as degree projects, but most of these students are really getting combined undergrad/graduate degrees, and have both more time to work on the project, and more experience as well.</p>
      <p>Typefaces can perhaps be said to never be finished ;-)<br>
      Whatever the case, I'm sure that you'll keep working on this after graduatation, especially if you want to bring it into distribution, which I hope you do.</p>
      <p>But perhaps your presentation and exhibition should deal with the <em>process</em> behind designing your typeface, rather than the actual glyphs themselves. That would be easier to realize in a short timeframe, and would also be more of interest to the other students and attendees, I suspect. Lastly, even if you finish a knockout typeface in a month, will your professors be able to properly evaluate it? What I'm suggesting is not to set yourself up for heartbreak either way… rather, focus on explaining your great work.</p>
