    <p>i'd really appreciate if someone help me identify the headline font used on these covers of Playboy Poland Edition</p>
    <p>My closest match would be Dharma Gothic - <a href="http://www.myfonts.com/fonts/flat-it/dharma-gothic/" title="http://www.myfonts.com/fonts/flat-it/dharma-gothic/">http://www.myfonts.com/fonts/flat-it/dharma-gothic/</a><br>
    But Iam pretty sure I see some minor differences. </p>
    <p>Thank You </p>
