    <p>Seattle avant-rap project Shabazz Palaces is the newest act on the Sub Pop Records roster. The mysterious crew is led by Palaceer Lazaro aka Ishmael “Butterfly” Butler, formerly of 1990s boho-hop group Digable Planets and Cherrywine.</p>
    <p>- Pitchfork</p>
