    html: <p>Collect well-designed stuff from other churches and have it on hand to make the distinction from your church's stuff. Is there something like an "Evangelism Committee"--lay leaders who are interested in spreading the word about what's happening at your church? That might be a place to start such conversations, at least about the "outward-facing" stuff your church is producing.</p>
