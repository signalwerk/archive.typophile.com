    html: |-
      <p>Traci, I've done some design work for churches and have a few thoughts. </p>
      <p>This first step I'd suggest is research. Think about the history of your church and the direction it's going in the future. Explore the websites of large, well-known churches, everything from St. Pauls in London to the the Washington National Cathedral, etc.(their sites are far bigger than what you'll need but are usually professionally designed), and also look for nicely designed websites of small churches too. You're looking for examples of professionally designed church logos, websites, publications, etc.  </p>
      <p>I would suggest keeping quiet about this project in the early stages, or you run the risk of a church member saying "let's let the youth [or whoever] design our logo!", or "Mr. Jones came up with a [terrible] logo and everyone thinks we should use it!" Before talking to the congregation about it, I'd suggest giving this project some careful thought and then approach the appropriate committee to get their support for a systematic approach to this project. </p>
      <p>One big difference between designing for business and designing for a church is that in business the company's president can decide what design direction to take and everyone else better follow his/her lead or else. In a church setting, things are often a little messier, with committees and individuals who have strong feelings and who don't want to be pushed into something they don't like. So for a pastor it's probably a good idea to approach this carefully and make sure that before you implement your new logo &amp; identity system that your designs have the support of key committees and then present the designs to the congregation at a business meeting to discuss and hopefully approve.</p>
      <p>(I'm talking mainly about the logo; the congregation doesn't need to see or approve every detail, such as the layout of the bulletin or newsletter.)</p>
      <p>Another consideration is that church positions such as newsletter editor, bulletin editor, web editor, etc. are often filled by well-intentioned volunteers who may not have much design experience. Or these jobs may be done by the pastor who already has a very, very busy schedule. So my advice for those things is to create templates and easy-to-follow guidelines, and be prepared to accept that although they look a lot better than they did before, they're never going to be perfect. (Unless you hire someone with design experience to prepare them each time, which is beyond the budget of most smaller churches.)</p>
      <p>If you do hire a designer, some general advice is to look carefully at their portfolio, check out their references, ask if you can contact some of their previous clients to see how the projects went, and be sure to talk about budgets and timeframe. And some may disagree with this, but I'd suggest getting someone local, if possible, as I think you can better size up the person you're hiring when you can talk to them in person, plus certain things like designing signage (I presume you'll update your signs) are easier in person.</p>
