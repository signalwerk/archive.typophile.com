    html: <p><i>IF</i> it is a typeface, it's most likely been customized. <br>Check <a href="http://www.myfonts.com/fonts/bitstream/normande/italic/testdrive.html?s=Crazy%20Penis&amp;p=72" target="_blank"> Normande Italic</a> for similarities, but notice for  <br>example the extravagant shape of the lc 'z'. The  <br>dotting of the lc 'i' by the tail of the lc 'y' is quite  <br>nifty, I must say.</p>
