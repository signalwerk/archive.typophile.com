    html: <p>i've been comparing it more with normande and checking out a few similar typefaces of that era. it has a very distinctive "z" and i haven't been able to find many other typefaces which are similar. <br> <br>if it is normande as yves said it has been heavily customised ie. the uc "C" and "P", the "a", "z" and "n" etc. also normande italic has more of a slant than the logotype characters. <br> <br>the other instance i've seen the typeface used the uc "H" and "S" had serifs that curled into dots. unfortunately i don't have an example at hand, i'll have to check it again.</p>
