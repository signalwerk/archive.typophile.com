  html: <p>This typeface originated from the handwritten form of the letter "B".  It consisted of a series of upper and lower case B's written out on a large piece of paper. I searched for letter forms within the original letter. When the letters were cut out there was an area of negative space left surrounding the form. This is just a preliminary sketch and I would like some feedback before I continue. Thanks.<img src="http://www.typophile.com/forums/messages/29/7418.gif" alt="Bb."></p>
