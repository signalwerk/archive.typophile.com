    html: <p>sean, i'm working with jori on this project, and she's planning on doing the positive/negative switch once she gets things digitized fully.  <br>i think the concept is good, and the fact that you're finding all the forms from those b variants is pretty amazing. they all have a consistent feel, which is obviously good. it's interesting how the negative shapes aren't totally enclosed by the black, due to the cutting of them.  that becomes a bit distracting on the "o" and i want to say it looks like a "p", but like sean said, it would be good to see some words. he's right about the "v", but again, it would help to see it used in context. utilizing tight letterspacing, with the black areas touching will probably affect things quite a bit, so the samples will be important. </p>
