    <p>Hello all!</p>
    <p>I am looking for a font similar or exactly like those 3D alphabet fridge magnets. It needs to be in color as well. If I cant find it, we will need to render in 3D.<br>
    Any suggestions?<br>
    Thanks so much for any help at all!</p>
    <p>Best,<br>
    A</p>
