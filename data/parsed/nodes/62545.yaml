      <p>&gt; However, characters with small x height blend together over a long word, making long word less readable.</p>
      <p>This might be a factor if all the letters in the word have no ascenders or descenders, but this is rare. I am not sure that word length alone is a factor in recognition.</p>
      <p>I assume you are aware of the term bouma, which is what most scholarly papers use to describe word shape/recognition studies. I mention this as it might help you find more references to study. The value of Bouma is contentious, with some studies claiming that word shape is irrelevant (I do not agree with them, however).</p>
