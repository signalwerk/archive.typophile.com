    html: |-
      <p>I have no idea if your hypothesis is right or wrong, but I think it is a great hypothesis as it can be studied and shown to be either right or wrong.</p>
      <p>It is already well known that shorter words are recognized faster than longer words, but that is irrelevant to your hypothesis. The question is, if you present shorter words with a smaller x-height font, will they be read faster than shorter words with a larger x-height font? And if you present longer words with a larger x-height font, will they be read faster than the longer x-height words with a shorter x-height?</p>
      <p>What length words are you imagining for the short and long words? And what fonts are you imagining for the small and large x-heights?</p>
