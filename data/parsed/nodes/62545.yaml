    <p>:)</p>
    <p>I am putting forward a hypothesis that might be ridiculous.</p>
    <p>It occurred to me that small x height is good for short words because it can emphasise word shape. However, characters with small x height blend together over a long word, making long word less readable.</p>
    <p>Conversely, large x height brings attention to individual letters in short words, creating distractions while reading. However, the same letter distinctiveness benefits long words because the word retains a distinctive readable shape.</p>
    <p>Consequently, a suitable x height might be directly proportional to the average word length. Am I talking nonsense? :)</p>
