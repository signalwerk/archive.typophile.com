  html: |-
    <p>hi. i need to design a vintage style travel poster for a major wine brand based in argentina.. any suggestions on what to use? im thinking the whole steamer trunk,vintage luggage tag, romantic travel 1930’s time period.. i want to use two faces that really compliment each other for the headline (something like “experience BRAND NAME HERE”)… </p>
    <p>thoughts? ideas?</p>
