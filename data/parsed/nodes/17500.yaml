      <p>How appropriate - I’m designing a book on Vintage Ocean Liners and it has lots of samples of luggage tags, stickers and posters. One font I think works very nicely is the Neutraface and Neutraface Condensed family from House Industries. I’m using them in combination with Stuyvesant Open script and Corvinus Skyline.</p>
      <p><a href="http://www.houseind.com/index.php?page=showfont&amp;id=94&amp;subpage=viewfonts">http://www.houseind.com/index.php?page=showfont&amp;id=94&amp;subpage=viewfonts</a></p>
