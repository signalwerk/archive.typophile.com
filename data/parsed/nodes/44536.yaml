    html: <p>Probably, maybe, you need to "Apply style, clear overrides" In CS2 anyway, you sometimes don't see a plus by the paragraph style name, but somethings don't take effect until you clear overrides. BTW, if you do this, any direct formatting you have done will be lost.</p>
