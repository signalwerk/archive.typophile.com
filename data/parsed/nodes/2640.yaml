  - id: 21095
    user: 1316
    date: 2004-01-31T08:27:00
    date_raw: 31 Jan 2004 — 8:27am
    votes: null
    html: "<p>The average graphic designer in general is very superficial in the use of type. That's why in the end they always end up using faces mostly for logotypes or to achieve a quick emotional effect. Many Emigre designs, abused as they are, aren't used at all in their full potential. Of course, overtly decorated letters dont' leave so much space for the typographer, but I'm sure interesting experiments (benefitting from OpenType, which is all to discover) like the one from Christian, here, will be overlooked and will make more the joy of type addicts and collectors instead of being used in actual interesting ways. <br>It's not to be pessimistic, but people tend to be very superficial, especially with historically inspired designs. <br> <br>Christian, did you really designed the first lowercases in a single night? If so, I'm just saddened to death (and very glad for you!): sometimes it takes me a whole afternoon to fix just a few letters...</p>"
    html_clean: "<p>The average graphic designer in general is very superficial in the use of type. That's why in the end they always end up using faces mostly for logotypes or to achieve a quick emotional effect. Many Emigre designs, abused as they are, aren't used at all in their full potential. Of course, overtly decorated letters dont' leave so much space for the typographer, but I'm sure interesting experiments (benefitting from OpenType, which is all to discover) like the one from Christian, here, will be overlooked and will make more the joy of type addicts and collectors instead of being used in actual interesting ways. <br>It's not to be pessimistic, but people tend to be very superficial, especially with historically inspired designs. <br> <br>Christian, did you really designed the first lowercases in a single night? If so, I'm just saddened to death (and very glad for you!): sometimes it takes me a whole afternoon to fix just a few letters...</p>"
