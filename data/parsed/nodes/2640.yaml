      <p>I have added a bold weight and all the punctuation, etc., and polished the characters. The spacing isn't done, and the bold is still a little wonky. I've worked a little more on the character mixing. I've set five different combinations here, but there are a lot of possibilities. I have worked out some OpenType features that will allow the different sets of characters to be turned on or off. Again, I wish that OpenType implementations would allow designers to define their own sets. InDesign currently doesn't have a "More Uncial" feature built into it, so I'm using the Titling, swash, and contextual alternates features. <br> <br></p>
