    date: 2004-03-26T16:42:00
    date_raw: 26 Mar 2004 — 4:42pm
    votes: null
    html: "<p>It's super. I think the bowl of the d is fractionally too small, too. It may rather be that the curve into the stem is too steep (compare it with the curve on c, g, e) giving d the appearance of a rather small o with a stem. <br> <br>I think the superscript 1 may be a bit big (noticeable in the fractions). To my taste the os 3 is rather wide (especially compared to the 5, which is admirably narrow). But this may just be me: the modern taste in os figs often seems to me to produce rather overemphatic 3s.</p>"
