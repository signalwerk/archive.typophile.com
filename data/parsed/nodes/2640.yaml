      <p>I hadn't heard of Victor Hammer. I had seen his fonts  <br>before, though. American Uncial is fine; I just don't like  <br>calligraphy fonts that much. I can't get over the random,  <br>free shapes repeated over and over mechanically. It seems  <br>like an oxymoron to me. Maybe as OpenType takes off they  <br>will get better. <br> <br>Here is another PDF. I added some Roman Upper and Lower  <br>case. The idea is that you can make it as uncial or not uncial  <br>as you want. It's still rough; there are some weight issues  <br>and some lumpy curves. <br> <br></p>
