  html: |-
    <p>Here is an uncial I started last night. I think it's got promise.  <br>I would like to trick it out with all kinds of opentype  <br>substitions. With this one I wanted an updated, not very  <br>calligraphic look. I started with a humanist sans in mind. <br> <br>I have to admit, I have never actually used an uncial font for  <br>anything other than playing around. None of them seem  <br>appropriate for anything other than Dungeons and Dragons  <br>or Saint Patrick's Day. This one seems a little more like St.  <br>Paddy, but could be used comfortably in a Dungeon  <br>Master's Guide. That being said, I love uncials. There aren't  <br>many fonts that I like, though. <br> <br></p>
