    html: |-
      <p>Hi,</p>
      <p>My guess is that this logo was a custom design for the company. The "Brands of the World" website has very little background info and states that the designer is unknown, but a scalable vector eps of the logo is downloadable from here:<br>
      <a href="http://www.brandsoftheworld.com/logo/gola-0" title="http://www.brandsoftheworld.com/logo/gola-0">http://www.brandsoftheworld.com/logo/gola-0</a></p>
      <p>As for an actual font that it may be based on, the only idea I can come up with is - maybe have a look at Koloss and any similar typefaces, available @ <a href="http://www.identifont.com" title="www.identifont.com">www.identifont.com</a>.</p>
      <p>As a customer, maybe you could even contact Gola direct via:<br>
      <a href="http://www.gola.co.uk/" title="http://www.gola.co.uk/">http://www.gola.co.uk/</a></p>
