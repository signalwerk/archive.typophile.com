    html: <p>Agree with Doghouse. Definitely custom (and not a good one in my opinion, /a looks terrible). Koloss might be a good choice for a customization. You might also consider <a class="freelinking external" href="http://www.myfonts.com/search/bodoni+poster" rel="nofollow">Bodoni Poster</a>. /G could be created with /O, right cutting and adding a crossbar to it. The rest is really easy. Keep /o, a vertical bar as /l and recreate from scratch /a (basic geometric shapes), just needs to keep /o counter shape.</p>
