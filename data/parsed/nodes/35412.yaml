    html: <p>But let me be clear, I'm not much of a sports person in general, so I'm not an authority on this, but the selection of Copperplate Gothic and Engravers Old English seems very "country club"-ish as far as sportyness goes. Golf, tennis, yachting, polo, that sort of thing. Sporty? Perhaps, but not at all active and youth-oriented. These are faces I associate more with "security" than "confidence".</p>
