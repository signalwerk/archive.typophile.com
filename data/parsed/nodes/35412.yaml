  html: <p>I have been set with the task of designing a logo for a sporting goods company and was wondering what font says what the title of the thread says.  "Font that asserts confidence and is sporty too."  Copperplate Gothic was an initial suggestion because an emblem using "Engraver Old English Font was being used.  Is there another font that would be better suited for asserting confidence and sporty too?</p>
