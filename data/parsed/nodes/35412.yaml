      <p>Copperplate is Edwardian and, in my view, has no futuristic qualities, while it might be used as part of a corporate id it is more likely to be seen in a more sedentary arena than sporting goods, especially if linked to a blackletter emblem. I would look at sans (or possibly slab) faces, avoiding swashy script with a banner tail and Machine derivatives.</p>
      <p>Tim</p>
