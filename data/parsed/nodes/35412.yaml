      <p>&gt;not really sure if these are more acceptable.</p>
      <p>Never acceptable to use the faux italicise or bold options, apart from the chance of it not printing properly, they are a distortion rather than the intended oblique.</p>
      <p>While Futura is more sporty than Copperplate it isn’t that far away from a generic sports font and italic or oblique is regularly used as a metaphor for motion/sporting – it isn’t necessarily a bad thing to use an obvious style.</p>
      <p>Tim</p>
