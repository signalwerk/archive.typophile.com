    <p>Hello everyone,</p>
    <p>I'm going to do my first year Graphic design at the Academy of art and i really like typography, i'm just starting out so i try to read as much as i can about typography in books and here on typophile, very much aware that i still need to learn tons i also try and keep busy by having fun with type, trying out tutorials, drawing letters...etc</p>
    <p>i was wondering if someone here might try and help me explain how the effect in the bottom image was don "Guerra quality meats" (its painted on the window but wondering if its possible to achieve the same effect in illustrator)</p>
    <p>i tought i could get the same effect using the "type on a path" tool in illustrator by just typing the words on a curved line. Obviously it didn't work as you see (the word quality meats), the letters don't stand up as in the example where parts of the type looks slanted (?)</p>
    <p>Its not for a project or anything, purely for the fact of having some fun and trying out/learning new stuff.</p>
    <p>I would immensely appreciate it if someone would be kind enough to explain how to acheeve this effect in illustrator (if its even possible ofcourse)</p>
    <p>Thank you all in advance</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/quality meats_4392.jpg"></div><p></p>
    <p>*image comes from Bohemia signs</p>
