    html: |-
      <p>I doubt if this is a font. The 'm' is the only repeated letter and it seems identical, but it might have been copied from the first m, or drawn by someone good enough to make them seem identical.</p>
      <p>The connected casual quality reminded me of Emmascript by Mark Von Bronkhorst, but it is not really similar in the letterforms.</p>
      <p>- Mike Yanega</p>
