      <p>It’s pretty evident, that “readability” depends on training and that some might read allcaps better than lowercase (supposing they read little modern printed matter, and by some chance read a lot of uppercase text).</p>
      <p>lowercase and uppercase are just two sets of forms for the same idea (which incidentally have common roots). Similar to different styles:</p>
      <p>We have late medieval, early modern accounts of Dutch and German readers not coping with Antiqua. Probably one could find newer ones from the 19th century as well.<br>
      On the contrary, nowadays most untrained readers of today have serious problems with Fraktur.</p>
      <p>It’s all a question of practice.</p>
      <p>Actually, what I discovered after developing a secret alphabet as a child was, that not only was it possible, that someone is more proficient in reading than writing (this is evident. So many people read, but can barely write, or if so, unrecognizibly), but you can also be more proficient in writing than reading! I mostly took some notes in my secret alphabet when I was scribbling something (in boredom) and others should not be able to read it, so I rarely read it. Even though I made up the alphabet myself, I could fluently write it, but only decipher it sign-by-sign!</p>
      <p>It was quite a relevation on how the human mind works!</p>
      <p>Actually, we know, that medieval copyists worked the following way: one read (aloud), many wrote (that was time-saving... multi-tasking/parallel processing, if you will). I would not be surprised, if the latter were less fluent in reading (of course depending on how much they read in the time not spent with writing).</p>
