      <p>Dan,<br>
      What “rule” about not setting things in all caps do you mean? I guess you mean the generally accepted notion that all caps typography is less readable than lower case.</p>
      <p>That one applies more to type than handwriting. The flipside (and here we go again with topic drift into a discussion of readability) is the matter of familiarity. Despite Hrant’s non-acceptance of the idea, I can’t find fault with Zuzana Licko’s maxim, “We read most what we read best”, because it’s basically true. I have met people who insist that lower case type is harder for them to read than all caps. It turns out these individuals read very little book typography and write in “printed capitals”, and these handwritten caps are the principal form of lettering they read. By near-complete lack of exposure to what we know as typography (book settings using lower case with caps for capitalised words), these people read best the form of lettering thay are most familiar with. It makes sense. I think Hrant’s rejection of Zuzana’s maxim has more to do with his unfortunate experience with one of Emigre’s fonts than his capacity for rationale and readability theory.</p>
      <p>Notwithstanding, lower case forms are inherently more legible and inherently more readable on both a technical and aesthetic basis. This much we know. So what an individual finds more legible or readable is a matter of personal experience.</p>
      <p>In the example above there’s a lot of rounded corners, gently curved straights, and variation of alignment, and I’m sure those factors help make it more readable than type capitals with their profusion of straight lines.</p>
      <p>I devised a test one time where I took a seriffed roman font I was working on and ran a grunge filter on it—-a combination of randomize nodes and envelope. That grunged all the letters up nicely, thinning them in spots, thickening in other spots, warping of straight lines, size variation, off-zenith alignment, and characters moved off the baseline. The auto-grunged font was easier to read than the straight one I had arrived at purely by design. </p>
      <p>Did Hrant or someone else at some point offer up a theory as to how randomness, noise and distortion (in the right amounts) enhances the readability of a font?</p>
      <p>j a m e s</p>
