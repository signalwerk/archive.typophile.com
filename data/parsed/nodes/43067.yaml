      <p>When I reached the ripe old age of six or seven years, one day one of my teachers made my mum come in to the school and made her watch me write out the letters of the alphabet, because they were concerned about me drawing my stems from top to bottom instead of bottom to top like all the much-alike kids, and presumably adults, did. There were a few other unusual ways I had of drawing characters which they pointed out and made my mum observe me comitting to paper with a pencil.</p>
      <p>She looked at this jerk teacher and said, “Yes?” The teacher hummed and hah-ed, but was unable to really say that what I was doing was bad. He shrugged and said, “It’s just unusual that’s all. No big deal, but we would like him to draw his letters the same way everybody else does.” My mum laughed and told him what a ridiculous waste of everybody’s time he had made. My method of writing letters was different but my letters did not look substantially different from accepted norms.</p>
      <p>Had I been armed at the time with the kind of language skills acquired by the age of thirty-three, I would have told that teacher to “stick your draconian pendantry up your arse for nothing and fack off while you’re doing it.” </p>
      <p>So instead I had to settle for staring at him as if he had green skin and antennas coming out of his head.</p>
      <p>j a m e s</p>
