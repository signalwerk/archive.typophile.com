      <p>I found quickly when I started my job in Madrid that kids around the Latin-script-writing world don’t learn to write the same.</p>
      <p>I’m used to using cursive majuscules when I write my lowercase in cursive as well, but some of them (the Z, G, F, T, Q and I in particular) are unintelligible for them.  They also teach cursive here before printing (???) and don’t connect all the letters.</p>
      <p>The only thing I remember doing was to cross my Z and 7 like my dad did ’cause he was a mathematician, whereas all my classmates continued to write them normally.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
