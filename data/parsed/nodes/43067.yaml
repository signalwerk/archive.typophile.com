      <p>I cannot speak for myself, but this topic hits home because my daughter, Katrina, age 4 1/2, just started drawing her name using lowercase letters this week. When she asked me how to make an a, I showed her the two-story a, and as far as she knows, that’s the only way to draw a lowercase a, and she does it pretty well. I haven’t heard yet what her pre-K teacher thinks about it, but I’m hoping she’ll be impressed! I know I am.</p>
      <p>Her t also includes the little forward hook (for lack of my knowing the technical term) on the bottom of the vertical stroke, which looks pretty great.</p>
      <p>What I do remember about my early letters is that I couldn’t wait to learn how to write in cursive. In first grade, I went to the second grade for reading class, where the cursive letters were posted above the blackboard. I took careful note of the illustrations and began proudly writing in cursive in first grade. I guess that was my intro to italics.</p>
