      <p>James,</p>
      <p>“When I reached the ripe old age of six or seven years, one day one of my teachers made my mum come in to the school and made her watch me write out the letters of the alphabet, because they were concerned about me drawing my stems from top to bottom instead of bottom to top like all the much-alike kids, and presumably adults, did. There were a few other unusual ways I had of drawing characters which they pointed out and made my mum observe me comitting to paper with a pencil.”</p>
      <p>You were the deviant by drawing the stems top-to-bottom?<br>
      In your region they teach to write the stems bottom-to-top?</p>
      <p>Also, the double/single storey “a” is not a real question around here, as most of Europe (at least German speaking countries and Eastern Europe) they teach to write running hands rather than “printed” style, separate letters; in running hand only single-storey version works.</p>
      <p>I remember we were only thaught to read “printed” style letter, and learnt parallelly writing (and reading) running hand.</p>
      <p>My brother (who went to his first years in school in a different country than I did) learnt in the first year to write “printed style” letters along with reading them in the first year, just to learn to write running hand in the second year (and after that running hand was demanded).</p>
