      <p>We were taught in the 1940s using pointed steel pens which we dipped in ink bottles. The hard part was that the desks were old and badly scratched and whittled. This caused pen-points to get stuck in a crevasse and splot blobs of ink. Given that we were writing on the grand canyon, my writing was quite good early on. As time went by and I grew older and wrote faster, my penmanship degraded to its present state of illegible scrawly mess.</p>
      <p>ChrisL</p>
