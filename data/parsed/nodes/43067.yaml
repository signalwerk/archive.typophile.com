      <p>James,<br>
      Here is Quote from Kevin Larson’s paper,  “The Science of Word Recognition, or how I learned to stop worrying and love the bouma”</p>
      <p>“The weakest evidence in support of word shape is that lowercase text is read faster than uppercase text. This is entirely a practice effect. Most readers spend the bulk of their time reading lowercase text and are therefore more proficient at it. When readers are forced to read large quantities of uppercase text, their reading speed will eventually increase to the rate of lowercase text. Even text oriented as if you were seeing it in a mirror will quickly increase in reading speed with practice (Kolers &amp; Perkins, 1975).”</p>
      <p>ChrisL</p>
