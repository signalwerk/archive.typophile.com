      <p>I was in year 1 (or whatever it might be called in various other parts of the world, when you are five and start school) only 15 years ago, and even that recently I was very clearly told that you do not write the letter a with two stories. Only single storey. And until a few months ago I have done just as I was taught. Now I use double-stories in my handwriting and I hugely prefer them.</p>
      <p>Can’t say I got in trouble though, I was always one to try and please the teacher back in primary school :P</p>
      <p>-Rafe</p>
