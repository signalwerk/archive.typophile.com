      <p>My teachers wanted me, and the other 5 wacky kids from the other public school where we started out, to follow the copperplate-based models everyone else was using, instead of the chancery-based models we used. Fortunately someone must have pointed out the meaninglessness of the distinction, and we were allowed to continue as before. Turns out the chancery hand is useful, allowing quite fast writing without much deterioration. It’s pretty efficient. </p>
      <p>I think if kids persisted in writing all caps, they would have been re-trained.</p>
