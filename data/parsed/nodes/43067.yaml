      <p>For some reason they expected our stubby tiny hands to have an easier time gripping monstrously thick crayons and pencils, at least for the first couple years. We were taught a strange hybrid cursive printing, making upright disconnected letters using cursive stroke order, and were brutally chastised for making looping ascenders. Then we were taught proper cursive with normal pencils in second grade. All this discipline was quite literally painful for me, giving me a powerful psychological aversion to handwriting to this day. </p>
      <p>By fourth grade I had abandoned it all for all-caps printing when I couldn’t get on a typewriter.</p>
