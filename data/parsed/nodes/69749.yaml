    <p>Hi folks, this looks like something I thought I had seen before, but I have had no luck locating it. The letters seem rather crudely shaped, but they appear consistent enough to think it's a font. I searched Dafont, and "1800s" at MyFonts, as well as several of my type books. I suspect a revival, perhaps by an amateur.</p>
    <p>Anyone recognize it?  </p>
    <p>Thanks, </p>
    <p>- Mike</p><div class="imageWrap"><img src="http://typophile.com/files/joannie_young_4756.gif"></div><p></p>
