      <p>Thanks Lex. I see the resemblance, especially the 'a'. My own candidate for a starting point was Ray Larabie's <a href="http://new.myfonts.com/fonts/larabie/goodfish/" rel="nofollow">Goodfish</a>, with a substituted 'a', but if either of these were used, then strange things were done to the 'u' (maybe a flipped and tweaked 'n'?)</p>
      <p>If I were trying to re-create this I think I'd use letters from both fonts, but I have to say the work looks very clumsy and amateurish. (Probably about what I'd be capable of ;-))</p>
      <p>- Mike Yanega</p>
