  html: |-
    <p>Hi everyone,<br>
    I'm a graphic designer living in France, have been following the forum for a while and am finally making my first post!</p>
    <p>I need to put together a typeface catalogue for the agency I work for, and I'm wondering what type management software would be the best for this. I would like to print the font name, an alphabet in uppercase and lowercase, and a sample sentence for each font we have (keeping the different weights together, not on separate pages if possible). </p>
    <p>I have fontbook, Font Explorer and Suitcase available, and no budget to buy new software. What could you all suggest to make this task as easy as possible? I was thinking of creating PDFs with font explorer and printing them; but the problem is that only the sample sentence or alphabet is in these PDFs... </p>
    <p>Thanks for your suggestions! :)</p>
