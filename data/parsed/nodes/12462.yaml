    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Avenir </strong></p>
    <p><img src="http://image.linotype.com/cms/avenirnext_weights1_d16599i130.gif" img=""></p>
    <p><a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> designed <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> for <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a> in 1988. It is a typeface based on <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>, which was designed during the 1920s by <a href="/wiki/Paul%20Renner" class="freelinking" rel="nofollow">Paul Renner</a>. Frutiger had never been bappy with the cold, modern appearance of Futura, so he "humanized" it. </p>
    <p>Avenir has no true <a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a> styles were made though, just <a href="/wiki/oblique" class="freelinking" rel="nofollow">oblique</a> ones. This seems in keeping with most of Frutiger's other typefaces. Avenir also has no small caps, oldstyle figure, or condensed styles. These three features may be found in the 2004 redesign of Avenir that was produced by Frutiger and <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a>, <a href="/wiki/Avenir%20Next" class="freelinking" rel="nofollow">Avenir Next</a>.</p>
    <p>Here is the <a href="http://www.linotype.com/90672/avenirnext-family.html" rel="nofollow">URL to Avenir Next</a>, and here is one to <a href="http://www.linotype.com/72/avenir-family.html" rel="nofollow">Avenir</a>.</p>
