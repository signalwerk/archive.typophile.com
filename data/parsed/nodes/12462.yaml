    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/12270/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Typefaces</a>&nbsp;:&nbsp;Avenir </strong></p>
    <p><a href="/node/12118/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adrian Frutiger</a> designed <a href="/node/12462/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Avenir</a> for <a href="/node/12172/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype Library</a> in 1988. It is a typeface based on <a href="/node/12494/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Futura</a>, which was designed during the 1920s by <a href="/node/12191/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Paul Renner</a>. Frutiger had never been bappy with the cold, modern appearance of Futura, so he “humanized”&nbsp;it. </p>
    <p>Avenir has no true <a href="/node/12463/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Italic</a> styles were made though, just <a href="/node/12475/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Oblique</a> ones. This seems in keeping with most of Frutiger’s other typefaces. Avenir also has no small caps, oldstyle figure, or condensed styles. These three features may be found in the 2004 redesign of Avenir that was produced by Frutiger and <a href="/node/12234/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Akira Kobayashi</a>, <a href="/node/12461/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Avenir Next</a>.</p>
    <p>Here is the <a href="http://www.linotype.com/90672/avenirnext-family.html" class="link-external"><span class="caps">URL</span> to Avenir Next</a>, and here is one to <a href="http://www.linotype.com/72/avenir-family.html" class="link-external">Avenir</a>.</p>
