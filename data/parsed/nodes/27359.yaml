    <p>Lanston Type Co. Summer 2006 releases!</p>
    <p>Nothing says summer like a tall cool Pabst. Pabst Italic that is!<br>
    To accompany the ever popular LTC Pabst Oldstyle is Pabst Italic and Swash<br>
    <a href="http://www.p22.com/lanston/products/pabst.html">http://www.p22.com/lanston/products/pabst.html</a></p>
    <p>These and 35 other new fonts may not really cool off the summer heat, but some classic faces mixed with a few unusual twists will go down easy with a 25% introductory discount.</p>
    <p>LTC Bodoni 175 - 4 fonts of classic Bodoni + 2 OpenType Pro fonts<br>
    <a href="http://www.p22.com/lanston/products/bodoni.html">http://www.p22.com/lanston/products/bodoni.html</a></p>
    <p>LTC Broadway - 2 Art Deco standards, newly digitized<br>
    <a href="http://www.p22.com/lanston/products/broadway.html">http://www.p22.com/lanston/products/broadway.html</a></p>
    <p>LTC Creepy Ornaments - Just like the name says<br>
    <a href="http://www.p22.com/lanston/products/creepyorn.html">http://www.p22.com/lanston/products/creepyorn.html</a></p>
    <p>LTC Glamour - Somewhat glamorous with 8 styles<br>
    <a href="http://www.p22.com/lanston/products/glamour.html">http://www.p22.com/lanston/products/glamour.html</a></p>
    <p>LTC Fournier Le Jeune - A decorative French indulgence<br>
    <a href="http://www.p22.com/lanston/products/fournier.html">http://www.p22.com/lanston/products/fournier.html</a></p>
    <p>LTC Goudy Sans - 6 variations of a Goudy classic<br>
    <a href="http://www.p22.com/lanston/products/goudysans.html">http://www.p22.com/lanston/products/goudysans.html</a></p>
    <p>LTC Jenson - Wm. Morris inspired 5 styles + 2 OpenType fonts<br>
    <a href="http://www.p22.com/lanston/products/jenson.html">http://www.p22.com/lanston/products/jenson.html</a></p>
    <p>LTC Kaatskill - Another Goudy classic in 3 styles + 1 OpenType<br>
    <a href="http://www.p22.com/lanston/products/kaatskill.html">http://www.p22.com/lanston/products/kaatskill.html</a></p>
    <p>LTC Law Italic - Stately and dignified<br>
    <a href="http://www.p22.com/lanston/products/lawitalic.html">http://www.p22.com/lanston/products/lawitalic.html</a></p>
    <p>LTC Ornamental Initials - Decorative Capitals<br>
    <a href="http://www.p22.com/lanston/products/ornamentalinitials.html">http://www.p22.com/lanston/products/ornamentalinitials.html</a></p>
    <p>LTC Squareface - 2 geometric Slab Serifs, also as 1 OpenType<br>
    <a href="http://www.p22.com/lanston/products/squareface.html">http://www.p22.com/lanston/products/squareface.html</a></p>
    <p>LTC Tourist Gothic - 2 Modern Condensed Sans Serifs, + 1 OT Pro font<br>
    <a href="http://www.p22.com/lanston/products/touristgothic.html">http://www.p22.com/lanston/products/touristgothic.html</a></p>
    <p>To get your 25% discount off of these titles, just use the<br>
    code:<br>
    Summer25 during checkout in the online shopping cart.</p>
    <p>Valid until August 31, 2006<br>
    ——————-<br>
