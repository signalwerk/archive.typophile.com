    <p>Google thinks I'm inquiring about gang life, and the Typophile search isn't turning up anything either.  I'm sure this has been covered some where in these forums, but for the life of me, I can't find it.  I'm a noob, and the resources I've found in books and on the Internet haven't been terribly explicit on this. </p>
    <p>Should <a href="/wiki/bullet" class="freelinking" rel="nofollow">bullets</a> be hung in the gutter beyond all of the text, OR should they align with the header and body copy, OR should they be indented. In the latter two options the bullets would be hung beyond the bulleted text, but not the regular body copy.  The first one it would be hung all the way out into the gutter, beyond the grid. </p>
    <p>I'm being redundant because I'm trying to be clear.   </p>
    <p>My first impression was that they should be hung all the way out the gutter, and the bulleted text should remain aligned with regular text, but now I'm not sure.</p>
    <p>Also, an en-dash between the bullet and the text?</p>
    <p>I'd appreciate the education I didn't receive in college.<br>
    Thanks!</p>
