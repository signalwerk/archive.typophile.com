      <p>Two things to say here:</p>
      <p>#1:<br>
      YES: the smaller bullet is also known as a centered period. &amp; Yes: it is at shift+option+9 on a Macintosh. I don't know from Windows.</p>
      <p>#2:<br>
      If you get deeper into your program, and use a variety of indents, you will not need to drop the bullet list into a separate text box. Then you can keep all text in the same text flow, and as you make changes to text before the bullets, you'll not need to move that box by itself.</p>
      <p>powers</p>
