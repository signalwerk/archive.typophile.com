    html: |-
      <p>There is no rule. Each job will have different possibilities. As Dan says, if you have a wide enough gutter so the bullets will not get lost in the bind or trim, then they can hang. &amp; that is a perfectly fine position for them, as long as the rest of the design, the design as a whole, supports this position.</p>
      <p>An en space is a very good idea.</p>
      <p>Another good idea is to use a center dot instead of a bullet. 99% of bullets are way too fat. Of course, for a lot of uses the center dot may be too small. In that case I like to scale the bullet down or the dot up to some middle weight. Or screen the bullet or run it as a softer color to lessen its impact.</p>
      <p>powers</p>
