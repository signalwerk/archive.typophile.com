      <p>I tend to go with Option 1, indent and align. I think it makes the information easier to scan through. However, it does get confusing if you have multiple levels of indenture (I've had a document with 6 starting I. A. 1. a. i. 1.) ), so having hanging bullets/numbering does make things cleaner.</p>
      <p>I would consider this decision to be at the designer's discretion. Thought, if someone disagrees I'd be very interested in hearing the reasoning (for or against). I also didn't learn everything I probably should have while in school.</p>
