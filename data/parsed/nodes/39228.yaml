      <p>Thanks for the responses. Very enlightening.<br>
      I've done it both ways in the past, and wasn't sure if either one was correct. I like Option 1 simply because it's easier to set, and won't get messed if there are content changes in the document later on down the line. </p>
      <p>When I did hang the bullets in the gutter in the past, I either put the bulleted text in a separate text box, and moved it's x-location to the left and then tabbed the bulleted text to line up with the rest, or I added each of the bullets manually in separate boxes.  Neither way was very ideal since the copy I get to begin with hasn't been finalized. It's a pain, but I do like the way it looks.  </p>
      <p>Anyways, thanks again everybody for the input.  This had been bugging me. </p>
      <p>Kevin</p>
