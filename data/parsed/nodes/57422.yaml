    <p>I appreciated reading the discussion about <a href="http://typophile.com/node/53701" target="_blank" rel="nofollow">Accurate glyphs for Romanian diacritics</a>. Especially the (so far) last post by <a href="http://typophile.com/node/53701#comment-343913" target="_blank" rel="nofollow">Florin Florea</a>, to me, raises a crucial issue: How helpful are samples that are contemporary and of typefaces that are not of, in this case, Romanian origin?</p>
    <p>Couldn't typophiles whose languages use of diacritics or "special" character --&nbsp;including non-Latin scripts like Cyrillic&nbsp;-- search local libraries for <em>historical</em> documents and show scans or photographs, together with bibliographical data?</p>
    <p>Ideally, these documents would be pre-digital. Pre-Linotype/Monotype. Even better, manuscripts. Not only those that conform to what may be considered as good examples by <em>current</em> standards but also those that do not conform. Personally, I am particularly interested in the variety of possibilities.</p>
    <p>Since many letters and diacritics are used in multiple languages, I think that there is no way around a certain amount of compromise. But with some background at hand one could at least make <em>informed</em> decisions.&nbsp;&nbsp;;-)</p>
    <p>Comments and samples are most welcome!</p>
