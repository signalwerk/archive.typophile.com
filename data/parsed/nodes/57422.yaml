    html: <p>Hi Karsten, I plan to scan samples of pre-digital diacritics used in the Czech language. I have many books, specimens, magazines, but the overall quality of the accents is often very poor due to many limits of the technology, printer skills etc. Once I will finish the scanning, i will upload the images to the database of the Diacritics Project at <a href="http://diacritics.typo.cz" title="http://diacritics.typo.cz">http://diacritics.typo.cz</a>.</p>
