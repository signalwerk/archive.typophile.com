      <p>@Chris: I mucked about with the logo in Illustrator and there is no system to this thing at all. The squares have a 7:8 ratio, the whole something like 2 to not quite 1.<br>
      But this may be something to be expected: swiss is what became of Swissair after their bankrupcy. Somebody probably slapped this together in a hurry. ; )</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
      <p>PS Swissair had a really tight identity… Too bad.</p>
