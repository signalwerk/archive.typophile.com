  html: <p>Hi everybody ! This is my first post on typophile, and I would greatly appreciate to get some feedback on this design. I've been working on it for a few weeks. It is my first serif typeface, although I think small text sizes won't work. thanks in advance for comments !<img src="http://www.typophile.com/forums/messages/29/20709.jpg" alt="Gentry specimen"></p>
