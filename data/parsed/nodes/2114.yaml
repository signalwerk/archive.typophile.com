    html: <p>Whow, that is reactivity ! <br>Well, about the strokes on the number four, these are just crossing paths which were not merged, as I wasn't sure of the overall design of this numeral so far. <br>Here is a further sample of some lines... If you meant smaller text sizes and longer lines, I'll provide. <br>I have doubts on the uppercase K and the Euro symbol...<img src="http://www.typophile.com/forums/messages/29/20722.jpg" alt="Gentry - Test drive 2"></p>
