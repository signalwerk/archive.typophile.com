    html: <p>There was a NovelFonts typeface from the 1994 Expresiv Ornate Font Collection called 'Carolissa' that looks like the medium weight of whatever font this is (see below). Of course, those fonts did not use the original names, and my notes mention a resemblance to Technotyp (p.215 in Jaspert's 'Encyclopaedia of Type Faces'), although neither 'Carolissa' nor Technotyp show the flat-bottom 'd'. <br><img src="http://www.typophile.com/forums/messages/83/67520.gif" alt="Carolissa sample"></p>
