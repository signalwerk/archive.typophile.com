    html: <p>Except for the flat bottom on the d, this looks almost exactly like an old Headliners face called Cardiff. You might check with Joe Treacy at Treacyfaces/Headliners ( <a href="http://www.treacyfaces.com" target="_blank">http://www.treacyfaces.com</a> ). Treacyfaces aquired the rights to the old Headliners type library a while ago. Some of the old Headliners faces have been digitized, but not Cardiff as far as I know.</p>
