  html: |-
    <p>Hello,</p>
    <p>I'am currently working a publication where some of the texts have extensive footnotes, I have the footnotes set up to have a 4mm gap between main text &amp; footnote. However it appears as if the space is increasing in some situations, for instance, if i set the space to 1mm everything is fine but as soon I increase it 2mm the 4th footnotes goes to the next along with the reference text but for some reason the page containing footnotes 1-3 the space increases to about 10mm, can anyone shed some light on how to fix this?</p>
    <p>Thanks,</p>
    <p>TL</p>
