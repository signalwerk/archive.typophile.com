comments:
  - id: 570619
    user: 32723
    date: 2014-04-09T11:09:00
    date_raw: 9 Apr 2014 — 11:09am
    votes: null
    html: |-
      <p>The 4th footnote reference was placed as the first one of the next page? If so, probably you got more space between text and footnotes on previous page simply because there is no text to add there (as the remaining lines were transferred to the next page).</p>
      <p>These transfer-to-next-page are common when notes are extensive. ID needs to show references and notes in the same page. When you increased the space, it couldn't show both reference and note to the 4th one, so the transfer was mandatory. This causes different lenghts of main text areas, which can be avoided if you choose the vertically justified text box option.</p>
      <p>Also check if you did let ID break footnote texts through pages. Large footnotes produce ugly results without this option turned on.</p>
