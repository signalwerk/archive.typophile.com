    html: |-
      <p>Originally, Gabriele, Hans Möhring, 1938 or 1947 (references differ) for Wöllmer Type Foundry.</p>
      <p>Yves - Years after joyfully discovering the delightful font offerings of Steffmann, I and a more respected source have come to the conclusion - looking at points and curves -  that many, if not most, of his fonts were digital improvements to Opti fonts. Per the Devroye link that Michel provides, Steffmann himself states that, "I am not a designer but I add missing letters to public domain fonts in order to get a complete character set and I hint the fonts and create new weigths ... "</p>
      <p>Opti created nothing original, either. They were simply the first to digitize lots of pre-digital faces. And they're long gone as a business.</p>
      <p>Nothing is ever black and white in this font realm, eh? Nevertheless, Steffmann's Gabrielle is the only digital version I'm aware of for this face and likely as 'legitimate' as you're going to get.</p>
