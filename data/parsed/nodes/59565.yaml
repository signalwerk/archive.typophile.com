      <p>I think it does look like a key, i would suggest a few improvements though; The key does look good but it needs some kind of end that should be added to the F that makes it look like a trumpet. I would suggest a circle or a oval. The typeface is a tad heavy and the ampersands is very nasty, i suggest Trajan pro. Both elements the type and image need to be moved closer the line separater by a lil tiny bit. The top type is very nice but text underneath really needs to look cleaner and crisper. The top font needs to reflect the bottom. You should try and find fonts that match or are the same.</p>
      <p>In conclusion you have a fantastic idea and the final product will look great.</p>
      <p>-Oliver</p>
