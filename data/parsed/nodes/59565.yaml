    <p>Hey there people.</p>
    <p>Been a while! Just spent 4 hours plodding around the site as air con has broke and its just tooo hot to be creative today!</p>
    <p>Anyway. thoughts on the attached please. Pro Bono job. New Estate agents setting up in Manchester. 3 experienced guys. They wanted to move away from the cliche big friendly colourful brands and go for a more classy/established feel. The sting in the tail is they have a marketing/copywriter who used to work for the Economist so he's hopefully gonna bring the money making to the party.</p>
    <p>This is obviously not just banging out a logo. A lot of my time has been put into the overall brand feel. I have sent a sketch over to them which they were very happy with. Below is the digital version. I obviously can't ask my fellow designers about this being freelance. Awkward name but thoughts please...</p>
    <p>Thanks in advance.</p>
