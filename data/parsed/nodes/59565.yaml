      <p>I think it's a good concept and it does have an 'ah' moment (so to speak) where you see the key. But then again, the fact that I already knew it was an estate agent before I saw the picture means I was impartial from the start.</p>
      <p>I know you've left a gap between the shaft of the key and the top half of the F to imply the key going into a lock (or at least that's how I see it), but maybe try losing the gap, widening the shaft of the key and making the handle look like a key handle (don't worry about it not being consistent with the rest of the F), then you'd definitely lose the trumpet that people seem to be seeing.</p>
      <p>Then again, all those things I've suggested might not look good if implemented. Just trying to give some ideas.</p>
