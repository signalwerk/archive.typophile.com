    <p>Hi,<br>
    I am trying to put together an all-star classis/retro alphabet and I am very interested in some ideas from you. What is your favourite A, K, Ampersand etc.</p>
    <p>Work in progress just did it <a href="http://www.workinprogressblog.com/?cat=11" title="http://www.workinprogressblog.com/?cat=11">http://www.workinprogressblog.com/?cat=11</a>, but I think it would be cool to make a better one, which shouldn't be a problem, with a little help from all you expert fontheads : )</p>
    <p>I enclosed a picture of the letters I have done so far, just to give you an idea of where I want to go with this, but it is very far from done.<br>
    As you can see, most of it is already custom-made, so it doesn't have to be an existing font. It can be a scan from an old magazine etc. Anything goes!</p>
    <p>// Mark</p>
