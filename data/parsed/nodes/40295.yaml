      <p>AFAIK, as long as the designs from each source are original, there's no legality issue. The clearest problem would be if someone took another digital font and used a glyph as the base for one of your letters, but taking inspiration from others' type is more than okay.</p>
      <p>EDIT: And in a more helpful vein, there are actually several threads on Typophile that have been about favorite letters, favorite ampersands, favorite characters in a favorite font, etc. A Google search of Typophile for "favorite letter" and the like should turn up some good results.</p>
