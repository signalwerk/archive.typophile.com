      <p><cite>I can’t see what should be illegal about it. I am nothing putting it up for sale or anything like that...</cite></p>
      <p>Copyright law is really messed up. Unless the letters are released under a free license like GFDL or CC or copyright has expired, you may want to get permission from the creators, even if you're not using the work for non-commercial purposes. <a class="freelinking external" href="http://en.wikipedia.org/wiki/Fair_Use" rel="nofollow">Fair use</a> might not allow you to use the letters.</p>
      <p><cite>Notwithstanding the provisions of sections 106 and 106A, the fair use of a copyrighted work, including such use by reproduction in copies or phonorecords or by any other means specified by that section, for purposes such as <strong>criticism, comment, news reporting, teaching (including multiple copies for classroom use), scholarship, or research</strong>, is not an infringement of copyright. In determining whether the use made of a work in any particular case is a fair use the factors to be considered shall include—</cite></p>
      <p><cite>1. the purpose and character of the use, including whether such use is of a commercial nature or is for nonprofit educational purposes;</cite><br>
      <cite>2. the nature of the copyrighted work;</cite><br>
      <cite>3. the amount and substantiality of the portion used in relation to the copyrighted work as a whole; and</cite><br>
      <cite>4. the effect of the use upon the potential market for or value of the copyrighted work.</cite><br>
      (<a href="http://en.wikipedia.org/wiki/Fair_Use" title="http://en.wikipedia.org/wiki/Fair_Use">http://en.wikipedia.org/wiki/Fair_Use</a>)</p>
      <p>This reminds me of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Girl_Talk_%28musician%29" rel="nofollow">Girl Talk</a>.</p>
