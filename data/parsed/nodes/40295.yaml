      <p>I think we typophile's jump the gun a tad too quick when issues of 'OMG...he copied a letter' pop-up.</p>
      <p>Even if this was literally taking the best letter from 26 commercial fonts and putting them in to an 'all-star' face, I don't see how that really is a big deal. It seems to be an homage done for fun...not profit in any way. It's fun. </p>
      <p>Yea, yea, any of the foundries could make a stink if they wanted to, and they'd probably be within their rights, but I can't possibly see how Lubalin has any intention of doing anything malicious here (at least based on what I've read in this thread.)</p>
      <p>I'm not against protecting copyright...I just cringe when I see 'copyright!' used as a way to shout down creativity.</p>
