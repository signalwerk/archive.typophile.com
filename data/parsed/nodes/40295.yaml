      <p>"To each their own..." forum, perhaps?<br>
      Collage is a valid art form. Song remixes are too. Sampling, I guess.<br>
      If the final form of a 'collage' were whole or part of previous works not owned by the 'artist' but given to the viewer to make a collage — is that 'giving' a 'valid art form'? ;-. </p>
      <p>I like this work by the way, the letters in composition are well worth looking at. If one were to say, let's make squares out of our favorite letters and talk about 'em, I might think otherwise. But an 'homage' ransom note font would not be so unless each person who viewed or used it knew, or could find from the work itself who made each letter, would it?</p>
      <p>Cheers!</p>
