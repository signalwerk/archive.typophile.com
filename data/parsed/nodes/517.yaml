    html: <p>Right under my nose here. The LA Times redesign <br>was back in January (?) The Times introduced a <br>new Ionic typeface for body copy and the new <br>type for Section heads. <br> <br>But...there was never a mention of who did <br>the redesign.  <br> <br>Anyway, I liked the letters sooo much, I started <br>an alphabet resembling the section heads... <br>never got around to any other letters. <br> <br> <br><img src="http://www.typophile.com/forums/messages/83/12354.jpg" alt="LA.jpg"> <br> <br> <br>But the G? I never saw it in a section <br>head (CALIFORNIA, SPORTS, CALENDAR, BUSINESS) <br>No G.  <br> <br>Good one Jesus! <br> <br>good job Eduardo!</p>
