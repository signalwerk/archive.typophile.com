    html: <p>Well done. I would agree that it could use some uniqueness, but the letters look very well drawn, and the weight range is impressive. I'm not a type designer, but I think if you can infuse this with a bit more individuality, you'll have a very nice workhorse typeface. I would keep working on this. I would use it.</p>
