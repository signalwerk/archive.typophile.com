    <p>Hi guys! </p>
    <p>I’ve actually already got an identity ( <a href="http://www.typophile.com/node/27464" title="http://www.typophile.com/node/27464">http://www.typophile.com/node/27464</a> )<br>
    but I’m not happy with the name “bloobseven” since a lot of people and clients ask me what it stands for.. and it doesn’t really stand for anything but is rather a “back-in-the-day-.com-hype” name.</p>
    <p>So I’ve decided to make it more personal and switch to my name “michael nagy” I’ve already sketched a few ideas </p><div class="imageWrap"><img src="/files/3_4861.png"></div> and after a lil bit of doodling I came up with this idea <div class="imageWrap"><img src="/files/4_6147.png"></div><br>
    The M,N and G form the pencil. MN stands for my name “Michael Nagy” and the G stands for “Grafiker” which is german for graphic designer.<br>
    However. In the cleaned up versions a lot of people read ECO insted of mng. Any ideas on how to make it more legible?<br>
    <div class="imageWrap"><img src="/files/1_3529.png"></div><br>
    <div class="imageWrap"><img src="/files/2_6216.png"></div><p></p>
    <p>The font for the name is Myriad Pro. Is this a good solution in your opinion? I like Myriad cause it’s versatile and not overused but I’d gladly take any typo suggestions into consideration.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/42368" class="topic-previous" title="Go to previous forum topic">‹ Carpenter Company Logo</a> <a href="/node/42413" class="topic-next" title="Go to next forum topic">Logo for help desk application ›</a></div>
