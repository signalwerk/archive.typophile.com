      <p>It looks lke ECO also because of the angle. Maybe you should straighten it</p>
      <p>In fact symbol/logotype relation is a little awkward. They don’t seem to share the same language. If that’s your symbol, you should probably try something like Neo Sans for the name.</p>
      <p>But isn’t a pencil a rather too obvious solution anyway? I much rather preferred the initial typographic options. The last two of the first set looked quite stylish.</p>
