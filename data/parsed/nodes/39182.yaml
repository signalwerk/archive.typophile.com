    html: |-
      <p>I think the reason people are seeing “ECO” is that the letters are stacked vertically. I’d try something horizontal instead.</p>
      <p>As for Myriad, I see it used everywhere, simply because it’s the default typeface in Photoshop and Illustrator. It still looks nice though. You might want to either go with a typeface closer to the letters you’ve drawn in the pencil shape, or make the letters in the pencil look closer to the typeface used for your name.</p>
      <p> - Lex</p>
