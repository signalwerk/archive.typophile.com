    <p>Este es mi primer POST, probando probando...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/detalles_4393.jpg"></div><p></p>
    <p>OK. He estado trabajando en un logotipo, que quisiera fuera un fuente nueva. En un principio, sin querer, quedó muy similar a Bodoni Poster, pero con serias deficiencias. Ahora la he estado remodelando un poco, y al parecer está mejor.</p>
    <p>Todo esto de lo tremendo es parte de un proyecto mayor relacionado a educación de diseño gráfico en Chile. Ha dado bastante resultado entre los profesores y alumnos, su principal sitio es <a href="http//www.tremendotaller.cl" rel="nofollow">tremendotaller</a> y en este URl confluyen los demás proyectos, <a href="http//www.tremendoreferente.cl" rel="nofollow">tremendoreferente</a> y pronto <a href="http//www.tremendaeditorial.cl" rel="nofollow">tremendaeditorial</a></p>
    <p>Todo basado en las redes sociales y web 2.0</p>
