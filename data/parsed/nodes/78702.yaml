    html: <p>I'd say decide on a target use (and especially size) for this. The heaviness of it offers the legibility at smaller sizes that Birdseeding mentioned, but there those "ideosyncratic features" are lost (if not counterproductive). On the other hand if you are aiming at a larger display font, you may want to reduce the heaviness.</p>
