      <p>sergej wrote:</p>
      <p><cite>(No, I’m not going to read any EULAs.)</cite></p>
      <p>I have read it (although the German version), and one section made me wondering:</p>
      <p><cite>2.5 No modification. […] You are not authorized to integrate or use the Software with any (a) plug-in software not developed in accordance with the Adobe Integration Key License Agreement or (b) other software or enhancement to programmatically interface with the Software for the purpose of (i) saving data locally (on the same Computer), except when allowed through the use of Document Feature(s) that have been activated using enabling technology from Adobe, (ii) creating a file that contains data (e.g., an XML or comments file), or (iii) saving modifications to a PDF file.</cite></p>
      <p>Does a desktop publishing system that generates PDF files (with the included fonts) <em>programmatically interface</em> with the Adobe Reader?</p>
      <p>By the way: Did someone compare the included fonts with their commercial counterparts? I remember that one version of the Microsoft Reader came with Frutiger but this included font had a very bad kerning (if at all) so it was quite useless outside this application.</p>
      <p>Gunther</p>
