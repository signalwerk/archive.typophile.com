      <p>This business of high quality fonts bundled with Acrobat Reader 7.0 has set me wondering. I do not like mumbo-jumbo any more than Sergej, but I thought it worth a look, in case it is OK to use the bundled fonts in the normal way.</p>
      <p>When I first installed Acrobat Reader 7.0 on Linux, it was a pre-release version or something, available on an Adobe ftp site, but not through their usual download area. This version had a short license agreement about the fonts, as below:<br>
      <cite><br>
      The font software contained in this package is being licensed to you solely<br>
      for use with the Adobe Acrobat Reader product ("Acrobat Reader") subject to<br>
      the terms and conditions of the Electronic End User License Agreement<br>
      accompanying the Acrobat Reader.<br>
      </cite><br>
      I assumed from this that you are not allowed to use the fonts in any other application, so I did not make them accessible to my other applications. I did not read the main EULA.</p>
      <p>Since the first install, my Linux distribution has packaged Acrobat Reader 7.0, and I am now using the packaged version. I looked for the font license, to post it here, but I could not find it. I had an old system with the original Acrobat installation on it, and copied the license stuff from there. Having read the old EULA, it looked as if it was OK to distrubute the fonts to others by embedding. You could also distribute the fonts to, say, a print company, provided they have a valid license for the fonts. These are the clauses about the fonts:<br>
      <cite><br>
      2.6. Font Software. If the Software includes font software -<br>
      2.6.1. You may Use the font software as described above on the Permitted Number<br>
      of computers and output such font software on any output devices connected to<br>
      such computers.<br>
      2.6.2. If the Permitted Number of computers is five or fewer, you may download<br>
      the font software to the memory (hard disk or RAM) of one output device<br>
      connected to at least one of such computers for the purpose of having such font<br>
      software remain resident in the output device, and of one additional such<br>
      output device for every multiple of five represented by the Permitted Number of<br>
      computers.<br>
      2.6.3. You may take a copy of the font(s) you have used for a particular file<br>
      to a commercial printer or other service bureau, and such service bureau may<br>
      Use the font(s) to process your file, provided such service bureau has a valid<br>
      license to Use that particular font software.<br>
      2.6.4. You may convert and install the font software into another format for<br>
      use in other environments, subject to the following conditions: A computer on<br>
      which the converted font software is used or installed shall be considered as<br>
      one of your Permitted Number of computers. Use of the font software you have<br>
      converted shall be pursuant to all the terms and conditions of this Agreement.<br>
      Such converted font software may be used only for your own customary internal<br>
      business or personal use and may not be distributed or transferred for any<br>
      purpose, except in accordance with the Transfer section below.<br>
      2.6.5 You may embed the font software, or outlines of the font software, into<br>
      your electronic documents to the extent that the font vendor copyright owner<br>
      allows for such embedding. The fonts contained in this package may contain both<br>
      Adobe and non-Adobe owned fonts. You may fully embed any font owned by Adobe.<br>
      Refer to the font sample sheet or font information file to determine font<br>
      ownership. See the Documentation for location and information on how to access<br>
      these sheets and files.<br>
      </cite><br>
      This appears much more permissive than I had assumed.</p>
      <p>The new EULA says very little about the fonts. They are mentioned in the list of stuff that constitutes the Software, but there are no specific clauses about embedding, printing, etc. The only bits that look relevant say:<br>
      <cite><br>
      ..."Use" or "Using" means to access, install, download, copy or otherwise benefit from using the functionality of the Software in accordance with the Documentation.<br>
      ...<br>
      2. Software License. As long as you comply with the terms of this Software License Agreement (this "Agreement"), Adobe grants to you a non-exclusive license to Use the Software for the purposes described in the Documentation.<br>
      </cite><br>
      Trouble with this, I cannot find anything about the bundled fonts in the documentation, which I assume means the user manual available within Acrobat.</p>
      <p>Anybody know the score here? Is Adobe really giving away 8 fonts that would normally cost $35 a pop?</p>
