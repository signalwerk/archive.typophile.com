    html: <p>Thanks Nick for your feeedback. I would definitely agree with your observations in regards to the overshoots of the n and u. I of course noticed it while engineering the mark and its grid, but did not know how noticeable it was. I think shortening the straights at the bottom of the n and the top of the u will help or fix this. I will try that out next.</p>
