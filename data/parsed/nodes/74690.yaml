      <p>Love the engineering style drawings but a couple of early observations on the logo:</p>
      <p>The lack of overshoots make the n look too low and the u too high. The answer may be to round the terminals. Otherwise you will need to cut the straights off higher and lower on the n and u respectively.</p>
      <p>I like the thickness of the space between the letters to be (or at least look) the same as the counters but I may be in the minority. Then we are talking fifth down out of the six you have provided (or is it fourth down?) </p>
      <p>The reality is that the engineering approach may not be helping you get something that actually looks right.</p>
