    html: <p>In my opinion, some overshoots are overplayed by some designers (just like some fonts are overkerned). It depends on the curvature of the curve for one thing. Your curves are quite tight so you might be looking at a little more than the 2.5 - 3% of x-height which seems fairly typical. It's gotta look right. You may not have gone far enough.</p>
