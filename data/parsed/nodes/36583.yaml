    <p>I just downloaded a font – FreightSans – and noticed to my horror that the following Danish characters – æøå, ÆØÅ – aren’t where they’re supposed to be. I can see in the character setting, that they are there, but when I press the ÆØÅ characters on my keyboard I get something like Ê_  Â. </p>
    <p>When I look in the detailed view in FontExplorer and press on one of the mentioned characters I can see that they not assigned to any keystroke, but only have glyph ID’s, so that’s a little weird.</p>
    <p>However, the mentioned characters come out fine when I set a sample on the Joshua Darden website, so what’s going wrong?  I have the truetype version on a mac. Other truetype fonts work fine, so I don’t thing it’s related to the format.</p>
    <p>Does anyone know what I can do? I’ve also written to Joshua Dardens site, but I’m guessing you guys in here are faster.</p>
