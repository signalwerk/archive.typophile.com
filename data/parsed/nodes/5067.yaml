    html: <p>Hi, Frank! <br> <br>I suppose you are keeping the spacing tight to maintain the feeling that one is looking at graffiti, right? <br> <br>I like the curve of the "Y"...  <br> <br>And that's an interesting "E"! But I don't think I know enough to say whether you should keep it the way it is or modify it a bit... basically, you might want to open up the counter spaces just a wee bit. Same goes for the top of "C" and "G"... those parts will tend to "clog up" at smaller sizes... <br> <br>Anybody else have an opinion on this?</p>
