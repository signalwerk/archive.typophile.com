    html: <p>Thanks for the comments guys. Ricardo, yes I wanted the look of graffiti for my typeface so I kept the spacing tight on the example, although I haven't properly grappled with spacing yet. I understand the 'E' is different from the other letters in some ways, but I liked the aggressive look it had and decided to keep it. I will try and open up the counter spaces on the 'E', 'C' and 'G'. These were some of the toughest letters for me and I came up with many versions. <br> <br>Hrant, I looked up Excoffon as I wasn't familiar with his name, but I'm certainly familiar with his work. I can see quite a few similarities with his 'Banco' typeface, thanks.  <br> <br>I'm not very clued up on the technical terms yet, by 'optional alternates', do you mean making for example 3 styles of the letter 'E'? I might have this totally wrong, please bear with me. <br> <br>Cheers guys. <br> <br>Frank <br> <br>UK</p>
    html_clean: <p>Thanks for the comments guys. Ricardo, yes I wanted the look of graffiti for my typeface so I kept the spacing tight on the example, although I haven't properly grappled with spacing yet. I understand the 'E' is different from the other letters in some ways, but I liked the aggressive look it had and decided to keep it. I will try and open up the counter spaces on the 'E', 'C' and 'G'. These were some of the toughest letters for me and I came up with many versions. <br> <br>Hrant, I looked up Excoffon as I wasn't familiar with his name, but I'm certainly familiar with his work. I can see quite a few similarities with his 'Banco' typeface, thanks.  <br> <br>I'm not very clued up on the technical terms yet, by 'optional alternates', do you mean making for example 3 styles of the letter 'E'? I might have this totally wrong, please bear with me. <br> <br>Cheers guys. <br> <br>Frank <br> <br>UK</p>
