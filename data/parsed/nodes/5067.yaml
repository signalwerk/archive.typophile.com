  html: <p>Hi all, I've just found out about this place through looking for some type critism. The standard of type design here is incredible and makes me feel very humble. <br> <br> <br>I've been working on a face for a couple of weeks, on and off. I wanted to produce a graffiti style display font. It started out as graffiti style handwriting which I scanned but  became more disciplined as problem and inconsistancies started to emerge. As I began to place the letters side by side, they didn't fit together, so the overall style gradually became more uniform. Any critisms are appreciated. <br>&lt;br&gt; <br>&lt;br&gt; <br> <br>&lt;img&gt;</p>
  html_clean: <p>Hi all, I've just found out about this place through looking for some type critism. The standard of type design here is incredible and makes me feel very humble. <br> <br> <br>I've been working on a face for a couple of weeks, on and off. I wanted to produce a graffiti style display font. It started out as graffiti style handwriting which I scanned but  became more disciplined as problem and inconsistancies started to emerge. As I began to place the letters side by side, they didn't fit together, so the overall style gradually became more uniform. Any critisms are appreciated. <br>&lt;br&gt; <br>&lt;br&gt; <br> <br>&lt;img&gt;</p>
