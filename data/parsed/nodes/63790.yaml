      <p>Hey guys,<br>
      Thanks for your suggestions,<br>
      It turns out since the font is a kind of pixel font, I had to uncheck the "use subroutines to compress outlines in the CFF table" from the preferences panel. Don't ask why :S</p>
      <p>A friend had the same problem once...</p>
      <p>Anyways </p>
      <p>Thanks</p>
      <p>Kj</p>
