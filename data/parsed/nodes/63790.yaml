    html: |-
      <p>What exactly do you mean by 'appear and disappear'?</p>
      <p>If you mean that some glyphs are showing up blank, this often indicates a problem with the interaction between your hinting and the start-point of your paths. Try relocating all start-points to the bottom left-hand corner and then rehinting the font.</p>
      <p>André</p>
