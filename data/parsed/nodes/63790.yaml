    <p>Hello people,</p>
    <p>I've been working on an arabic typeface and everything was fine until suddenly our beloved Fontlab started exporting the font corrupted. It makes some characters appear and reappear when I use it in indesign.</p>
    <p>My encodings are corrected coz I have used it before, and had no problem.</p>
    <p>Would anyone by any chance know what's going on and how can I solve this?</p>
    <p>Thanks in Advance</p>
