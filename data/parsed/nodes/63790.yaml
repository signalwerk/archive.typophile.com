    html: |-
      <p>You might try various types of generating, exporting, and importing to see if you can strip the offending portion of code.</p>
      <p>As a last resort, you could export your vectors and then re-import them, and then re-do all the info and metrics.</p>
      <p>Or maybe it is the format. Have you tried generating different formats?</p>
      <p>While it's true that your font "works", it sounds like it has a bug.</p>
