    html: <p>Just thorn? Or eth also? Old English, like Icelandic to this day, had two letters denoting two different pronunciations that we now write with the pseudo-digraph <i>th</i>. The complication of modern English is that the contribution of other languages has multiplied the pronunciations that we represent with this pair of letters. To make any phonetic sense, one would want a separate letter to represent each phoneme. English may be too much of a mongrel tongue to support such systematic phonemic representation.</p>
