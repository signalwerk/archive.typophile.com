  html: |-
    <p>I'd be interested in hearing the opinions of Typophile regulars concerning the potential for reviving the "thorn" character, or creating a new "thorn-like" character, for use in our western alphabetic system? <br> <br>I've always found it curious that with the frequency that the "th" combination occurs, and how common compound "th" characters are in other alphabets, that it isn't a part of our Roman character set. This, despite the fact that for many centuries a compound "th" character was popular within the Latin abbreviatory system; and, of course, utilized within the English alphabetic system practically up till the 19th-century. <br> <br>Thoughts? <br> <br>dm</p>
