    votes: null
    html: <p>No, not eth too, just thorn. Actually, not really thorn either. Merely a new single character condensing the "th." I agree, English is too much of a mongrel language to start niggling such phonimic details (lest we end up with 40 more characters in our alphabet). Since we don't establish such distinctions now with our current usage of the "th" combination I see no reason to start. I'm thinking more along the lines of how the English employed the "Y" character as a pseudo-thorn as a space saver. <br> <br>Certainly not a critical typographic issue. Just a little design project I've flirted with for personal entertainment off and on over the years. <br> <br>dm</p>
