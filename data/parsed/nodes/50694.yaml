      <p>I agree with everything that has been said. I'm not a web designer, but I do try to educate myself concerning best web practices and standards. I'm not even a real graphic designer. I'm more of an enthusiast. But when it comes to the internet, I applaud most attempts to make the web look more like print if they end up being accessible too. A good example would be <a class="freelinking external" href="http://www.jasonsantamaria.com">Jason Santa Maria</a>. </p>
      <p>All of this brings me to my point: I dislike the idea of overriding the font choices consciously (and hopefully wisely) made by the designer of the site with your preferred setting. While that might not be a problem in fluid layouts (which almost invariably look awful), it can be with a fixed layout. I myself "care about type aesthetics" and that is why I never change the browser's viewing preferences to my liking because I want to view the site the way the designer intended. He chose, per se, Georgia over Verdana, because that's what compliments his layout and design best. </p>
      <p>Let me add a disclaimer, Nick, in that your short-sightedness warrants tampering with these settings, but wouldn't Ctrl+scroll do enough while, at the same time, "preserving" the design? I'd find the web to be extremely bland were it set in just Verdana (or Arial!)... It's an interesting topic nonetheless, so if anyone cares to share their opinion, please do.</p>
