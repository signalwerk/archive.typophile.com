    <p>Howdy everyone!<br>
    As my Google-Fu did not turn up too much useful info in the subject, I was wondering whether somebody might recommend a good specimen book for american poster typography covering the era from around 1840-1900. </p>
    <p>I am especially interested in the kinds of ornaments that have been used. So far however, I have mostly seen remakes of the style and am now wondering what really rolled of the presses back then.</p>
    <p>Any input much appreciated.</p>
