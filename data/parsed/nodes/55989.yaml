      <p>It's kind of a pain in the butt, because you have to download these huge files and then they really slow down your computer (or at least my computer—a couple of years old macbook pro) but the <a href="http://www.archive.org/search.php?query=subject%3A%22Type%20and%20type-founding%22" rel="nofollow">internet archive</a> has some fantastic typeface resources.  They have scans of a whole bunch of original type catalogs (the resolution is low, but tolerable) and manuals and stuff.  I'm sure you could find original wood type sources there.  </p>
      <p>For example, you might try "<a href="http://www.archive.org/details/specimenbookcata00inlauoft" rel="nofollow">Specimen book and catalog; a price list of printers' supplies, showing types and rules in which are embodied all the latest ideas that enable the printer to produce superior work</a>" from the Inland type foundry, St. Louis, 1897.</p>
      <p>I haven't downloaded that one, but I did download an 1895 <a href="http://www.archive.org/details/cataloguebookofs00clevrich" rel="nofollow">Cleveland Type Foundry book of specimens</a> which has a wood type section with some ornaments including those I've uploaded.</p><div class="imageWrap"><img src="http://typophile.com/files/Cleveland_4087.png"></div><p></p>
    html_clean: |-
