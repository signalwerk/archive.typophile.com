      <p>Thinking in terms of rules ... like there is some great cosmic code that's in violation here ... is a setback in effective design. The main relevant questions are: Is it distinctive? Does it represent the product's character? Does it appeal to the intended audience? Can the client afford it? Will it work in the medium where it will appear? In regards to MS Silverlight, I would answer these questions as:</p>
      <p>Distinctive: Acceptably ... I recognize it right away, but it does seem a little generic<br>
      Representative: Doubtful ... but I haven't used Silverlight web apps enough to know for sure<br>
      Appealing: Hard to say (who is the intended audience? web developers, mostly?)<br>
      Affordable: Definitely<br>
      Practical: Mostly ... it's mainly used online</p>
      <p>I work in broadcasting, and broadcast logos, while they often have a static counterpart, can be very colorful, fluid, organic, and especially these days, animated. The animated logos can be good or bad, but as a viewer I think some of them are really cool and represent their show or channel or station very well. And there is no doubt they fit the primary medium very well. Paper is not everyone's foremost concern ... nor should it be.</p>
    html_clean: |-
