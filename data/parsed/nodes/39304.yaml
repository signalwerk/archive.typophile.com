      <p>"Earlier the printing was a big problem, and we used to prefer flat logos but why now?"</p>
      <p>Satya, I think in practise it still is quite a problem, and will remain so for the foreseeable future. </p>
      <p>Even with the most exhaustive implementation guidelines, a logo of that sort is almost guaranteed to get distorted. Implementation standards, production processes, and approaches to quality vary wildly from region to region. This is particularly true in a place like India. </p>
      <p>With even fairly straighforward identities suffering from poor or inconsistent implementation, these more complicated ones don't stand a chance. </p>
      <p>I'd design something like this for a little web start-up or a boutique brand, but not for a major brand that has to work across applications and geographies.</p>
