      <p>The question is a bit confused here at the outset in that Silverlight is a product and not a company. So while the art may be subjected to some of the vagaries of a logo's life, it is essentially functioning more as the packaging and advertising of a commodity than as the identity of an organization.<br>
      That said, there is no questin that we are seeing more dimensionality in logos thanks to advances in software, media and mechanical reproduction. One could argue, however, that dimensionality only changes the way the logo <strong>looks</strong> and doesn't change the thing itself. Just as adding any degree of dimensionality to a letter changes its appearance but not our understanding of what it <strong>is</strong>. Which means that the essence of logo design—the creation of a symbol—remains unchanged and as difficult an art/science as ever.</p>
