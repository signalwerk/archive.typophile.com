      <p>Moving away from this particular example, this broad approach to brand identity does indeed encourage a kind of laziness. You tend to substitute rigour of exploration with the latest filter or effect. </p>
      <p>In place of an idea you have a look. The problem, of course, is that like any other fashion, it goes out of fashion quite soon. There's an intro on Michael Johnson's website which puts it rather nicely: "...nothing dates quicker than a style and nothing dates slower than a great idea"</p>
      <p>Which, by the way, is not be all bad. The need for organizations to redo identities every couple of years ensures that those of us in that line of work earn enough to pay our bills ;)</p>
