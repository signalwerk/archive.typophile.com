      <p>I've thought about this before—that the traditional sense of how a logo should function has been steamrolled by cheap 4-color printing. </p>
      <p>So we used to have to design a simple logo so faxes and one-color business cards etc. could use the logo. Now, products like this one may never appear in one color, or need to be shown small. Maybe this mark will function in all the intended usage situations. I can see that it would completely fail used small in a K only newspaper add.</p>
      <p>I guess my lingering problem is that at some point a company will need some of its identity to work in the classic ways a mark used to be designed to work, and photographic/photoshop marks like this can't fit into that identity.</p>
      <p>I also think that there must be a super saturation point with all the craptastic photoshopish over illustrated detritus that floods my eyes. Let's hope this look goes out of vogue just like everything else.</p>
      <p>^Total rant.</p>
