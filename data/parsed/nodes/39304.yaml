    <p>Hello Typophiles,</p>
    <p>Now a days it has almost become a trend of having those glossy,<br>
    shiny and stylish gradient logos. The Microsoft Silverlight logo<br>
    would be a perfect example to give. I know that lots of people<br>
    didn't liked it and were screaming when it was released. But why?<br>
    Why can't we have such logos? Personally I loved it and have no<br>
    problem with having such logos even in the future also. Logo<br>
    is just an identity and anything can be logo as far as its unique<br>
    and easy to remember. Earlier, the printing was a big problem<br>
    and we use to prefer flat logos but, why now?</p>
    <p>What you all think?</p>
    <p>Satya</p>
