      <p>I enjoyed reading this discussion on the Silverlight logo and thought I'd add my perspective. I managed the development of the Silverlight brand name and identity at Microsoft.  To be clear - I am not a designer nor an expert in production. I’m a brand strategy guy. We worked with an outside partner on the logo design and rely on in-house and external partners to design and produce content that incorporate the logo.</p>
      <p>What I can comment on is what our thinking was as we developed this logo. Silverlight is a tool for designers and software developers who are creating something of their own. Ultimately they control the design of the experiences they create with Silverlight.  We explored a wide range of options for the logo including more traditional approaches like those designed around real objects (e.g. the shield shape of the UPS logo or the Apple of the Apple logo) that some on this forum noted.  We ultimately decided that a design that was more open and without boundaries was more fitting with the Silverlight concept. I’m going out a bit on a limb here but in some respects Silverlight is somewhat amorphous, only taking shape after a designer creates something using it. We didn’t want to box it in by creating an overly literal logo. </p>
      <p>We entered into the design process thinking animation first, static online second and print a very distant third. The static logo you see above was taken from a frame of an animation that we created. While technology and bandwidth doesn’t always make it possible to display the logo in high quality animated form, that’s our goal when possible. We knew that we would need to create static versions, print was not a priority. Silverlight was designed to be native to the Web. The idea of printing it black and white in newsprint is totally counter to what Silverlight is about.</p>
      <p>There are certainly downsides to this approach but overall we’re pretty happy with the results and the response we’ve seen/heard to the design. We’re aware of the challenges in using this logo effectively and I’ve already seen some scary examples of “design” that are off-brand. We work hard to limit this by creating guidance that we provide to our design/agency partners and in most cases they do great work.</p>
      <p>I hope this gives you a glimpse into how we approached this project. Feedback on the forum or via mail is welcome.</p>
      <p>Mason Flint<br>
      Microsoft Corp.</p>
