      <p>If I'm understanding your problem correctly, I think it's because each of your groups is effectively equivalent to the next. A better example would be</p>
      <p>*****</p>
      <p>@default = [a b c d];<br>
      @calt1 = [e g h i];<br>
      @calt2 = [j k l m];<br>
      @calt3 = [n o p q];</p>
      <p>*****</p>
      <p>where each of the groups contain unique characters.</p>
      <p>so, aaaa becomes aejn.</p>
