    <p>Hello all,<br>
    I like to build a random feature in a typeface I'm working on.<br>
    Every character has four alternates and I like the fontsoftware to choose between them.<br>
    Can I do this in OpenType? And if so, how?<br>
    Thanks.<br>
    Pieter</p>
