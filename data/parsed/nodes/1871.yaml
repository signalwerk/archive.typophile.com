    html: <p>Great resource, thanks for that one. <br> <br>I've updated it... and I'm beginning to think I've got the "important" characters done... <br> <br>If I'm missing anything crucial, please tell me. <br> <br><img src="http://www.typophile.com/forums/messages/29/2084.gif" alt="sans.gif"> <br> <br>any comments appreciated of course. <br> <br>I was thinkning about an italic for this one, but not necessarily a slanted one. I was thinkning of a slightly rounded version with connections between the letters, like in a script typeface... good or bad idea?</p>
