    html: <p> I don't think upright italics work, especially in a coarse medium like the screen. On the other hand, slant looks like crap on-screen, which is why I recommend using a darker (or lighter) weight - and that goes together with my recommendation of using 2-pixel-stem fonts as the text weight. <br> <br>hhp </p>
