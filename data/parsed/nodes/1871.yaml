  html: <p>I found myself without any sensible work yesterday, so I decided to draw a quick sans-serif in Photoshop... <br> <br><img src="http://www.typophile.com/forums/messages/29/1950.gif" alt="sans-serif"> <br> <br>I'm not sure about the relationship ascender and cap height... Is it okey, or do I need to increase the cap height (I would like to stay away from decreasing the ascenders, tried it already and it looked odd)? <br> <br>Comments welcome.</p>
