    date: 2002-08-12T04:47:00
    votes: null
    html: <p>Richard -- <br> <br>The best resource I know about for the design of the thorns is <a href="http://briem.ismennt.is/2/2.1a/2.1.1.thorn.and.eth.htm" target="_blank"> Gunnlauger SE Briem's pages</a>. <br> <br>I would suggest making the descender and ascender of your lc thorn equal at 3 px. I think the cap Thorn should have a larger bowl; try 3x3 or 3x4 for the counter, but keep the 2 px extenders. This will push it up into the accent region a little, but I don't think that will be a problem. <br> <br>Mind you, I'm not Icelandic. Perhaps someone who is can offer better solutions. <br> <br>-- K.</p>
