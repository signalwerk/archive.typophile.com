    html: <p> Thanks. <br> <br>I don't know about the "y" now that I look at it, it looks sort of strange.  <br> <br>As for the ascender height, I really don't have a problem with it, it just looks a bit funny when it's an uppercase character followed by an ascending lowercase ("The" for instance). <br>"Jumped" looks much better for some odd reason...  <br> <br>Oh well.  <br> <br>Hmmm, Looked around for the design mentioned -  couldn't find anything.  <br> <br>Care to share a link or something? </p>
