    html: <p> Hey, pretty nice. <br>I love the vertical proportions as they are (even the longish descenders). Very clean, and the caps seem to work very well in running text. For some reason it reminds me of Koch, or one of Hoefler's recent designs - I think the Gugenheim one. It has this quaint (but nonetheless Euro-rigid) air about it. <br> <br>hhp </p>
