  html: |-
    <p>Hi guys,</p>
    <p>I did a logo for a condo about 4 years ago (pre-well-rounded design education...) utilizing a dafont special (roughly a copycut of futura).</p>
    <p>The client just emailed me to inform me they're changing their lightboxes etc, so there's opportunity to swap in a better typeface.</p>
    <p>I ran through the usual suspects, wasn't wild about any. Started getting away from geometrics and grotesques to the quirky dutch guys (quadraat, documenta, scala) and these didn't quite seem to fit either.</p>
    <p>Any ideas?</p>
    <p>Condos are in a relatively revitalized bohemian neighbourhood in Vancouver, Canada. Concrete with a bit of exposed wood, decorative plaster lobby and hallways. Demographic is fairly young semi-professionals (nurses, teachers, burgeoning business owners etc).</p>
