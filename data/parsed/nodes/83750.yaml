      <p>Hi Mark,</p>
      <p>We've tested OpenSans with Universal Type Server 2.1.3 and above, and haven't seen any issues. It's possible that there was a corruption issue with the font when downloaded. We recommend that you re-download and re-add the font to the server.</p>
      <p>For any additional support, I recommend contacting our support team directly at:<br>
