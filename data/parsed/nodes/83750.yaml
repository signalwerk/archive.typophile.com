    <p>Anyone had any luck using them offline, ie downloading them and using them in Illustrator/Photoshop to do mockups?</p>
    <p>I've used Lobster fine from the OTF you can download, but I'm struggling with OpenSans. 11 weights as Windows TrueType, but I'm thinking it's an OpenType file because it's 940-odd glyphs. When I import into Universal Type Server it says the font is damaged and can't be imported. I've run Font Doctor and the font is fine. I've tried opening and resaving in FontLab (great licensing model from Google lets me do this) but I don't know enough to make this work.</p>
    <p>Anyone using using UTS with Google fonts?</p>
