    <p>Hi<br>
    What do you think of the letters? What can i do better? i draw letters very seldom, so any feedback is welcome. I have a feeling the ’s’ and   the’e’ could  be better. I looked at a couple of fonts that at first glance looked suitable, but wouldn’t do the trick. So I started drawing myself, keeping an eye at the features i liked in the initial fonts. </p>
    <p>The logo is for a industrial design company. Serious but friendly etc. THe name is Kode Design.</p>
    <p>Thanks!</p>
    <p>alex<br>
