      <p>I think it´s very nice. And for the “serious but friendly” part, it´s right on the spot. I think you should keep the colors.<br>
      Here´s some suggestments:<br>
      The ascender on the bottom d may be too short, make a printout in small sizes to check!<br>
      The ending on g should be more like that of e, at least in thickness.<br>
      The ending on e looks a bit flat in the middle, try shortening it for a more fluent ending.<br>
      The s needs some more weight in the middle. This will also make the endings less flat, which is a good thing.<br>
      The flared stroke on d and k may be applied on i, for consinstency<br>
      Maybe you could do a whole typeface out of this?</p>
