      <p>Well, I’ll get the crit started.</p>
      <p>Obviously, your d’s aren’t the same, is that on purpose? Also, your ascenders/descenders seem rather staunch. </p>
      <p>What kind of products do Kode Design design? I’m curious also about the decision behind choosing Blue and Black for the color scheme. if you’re flexible with color choices, I’d consider something more subtle. It’s clever that you picked out KO and DE, but the color choices feel as if you’re pushing this idea down my throat instead of me slowly realizing it. Make it more subliminal.</p>
