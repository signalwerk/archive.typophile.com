  html: <p>Wanted to get your opinions on this.  The final answer will of course be solicited from the actual font designers. <br> <br>I own a company that licenses fonts for the purpose of making alphabet stamps from them.  I contact the designers of each font, and pay them to license the font for that specific use, and do not retain any ability to redistribute the font electronically. <br> <br>One of my customers recently contacted me and asked me the legality of using the stamps (created from the licensed fonts) in a commercial venture (making handmade greeting cards).  Would this be considered an extension of our license since it uses the product that we specifically licensed for? <br> <br>Thanks <br>Tim</p>
  html_clean: <p>Wanted to get your opinions on this.  The final answer will of course be solicited from the actual font designers. <br> <br>I own a company that licenses fonts for the purpose of making alphabet stamps from them.  I contact the designers of each font, and pay them to license the font for that specific use, and do not retain any ability to redistribute the font electronically. <br> <br>One of my customers recently contacted me and asked me the legality of using the stamps (created from the licensed fonts) in a commercial venture (making handmade greeting cards).  Would this be considered an extension of our license since it uses the product that we specifically licensed for? <br> <br>Thanks <br>Tim</p>
