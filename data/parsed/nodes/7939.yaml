    html: <p>I'm with Stuart on this one. The rubber stamps are essentially the font in another format. The licensing of the design is appropriate for rubber stamp makers. The end user uses the stamps to spell out words on a commercial product...fine, they are using the tool (the font design) to make something else. If someone bought a die cutting system with a specific font design to then make an alppahbet set of rubber stamps from, then there would be an issue about a derivative commercial product. But "printed goods" should not really be considered derivative products (in most cases).</p>
