    html: <p>Hi Tim, <br> <br>We do license our fonts specifically for the creation and use with of rubber stamps and die cut alphabet systems (Mostly for Scrapbooking Comanies) and as you are aware this is usually a more significant license due to the reproduction ability of the medium. <br> <br>Should a customer of yours decide that they want to start a greeting card company using a rubber stamp alphabet, I personally would have no problem with them using the rubber stamps commercially. <br> <br>Think of it, if they buy the rubber stamps and decide to hunch over an ink pad and jam out a pile of greeting cards, it's no different than if they decided to set the font in Word and print 1,000 of 'em from their ink-jet printer. <br> <br>As the designer what I'm most interested in protecting is the 'manner of reproduction' not so much the usage thereafter. If due dilligence is taken care with the licensing with the maunfacturer and distributors, then it's essentially a side effect of reselling this type of product. <br> <br>Stuart :D</p>
