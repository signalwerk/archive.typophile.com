  html: |-
    <p>While what I am posting here is likely not to be news to most of the regulars of this forum - and it might even be viewed as bad news rather than good news - I think it's likely to be something some visitors here will be looking for.</p>
    <p>First, at</p>
    <p><a class="freelinking external" href="http://pakdata.com/products/arabic-font-holy-quran" rel="nofollow">http://pakdata.com/products/arabic-font-holy-quran</a></p>
    <p>a free Arabic font is available that provides the features necessary to typeset the Quran.</p>
    <p>Second, the Pak Nastaleeq font, still available online, although the official government site of the project is down, or may simply have been renamed, while somewhat simplified, still offers about 200 ligatures, and, thus, it should at least be adequate for many purposes.</p>
    <p>(EDIT: I misremembered what I had read. There are 200 glyphs in the font, but <em>no</em> ligatures.)</p>
    <p>One site from which it may be downloaded is:</p>
    <p><a class="freelinking external" href="http://www.urdujahan.com/font.html" rel="nofollow">http://www.urdujahan.com/font.html</a></p>
