    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Type%20Technologies" class="freelinking" rel="nofollow">Type Technologies</a> : OpenType</strong></p>
    <p><strong>About OpenType</strong><br>
    OpenType is a type format designed by <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a> and <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> which attempts to resolve the limitations of the two dominant outline font technologies (Adobe's <a href="/wiki/Type%201" class="freelinking" rel="nofollow">Type 1</a> <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> fonts, and <a href="/wiki/Apple" class="freelinking" rel="nofollow">Apple</a> and Microsoft's <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> fonts), as well as serving the needs of its two creators. From Microsoft it gets its focus on global language support: OpenType uses as its basis <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a>, and does away the complicated system of code pages found in older digital font formats. Something like OpenType's advanced typographic features are needed for even basic support of certain languages. From Adobe OpenType gets its emphasis on advanced typographical controls for western and East Asian languages, providing support within a font for such features as alternate character forms, discretionary ligatures, variant figures (tabular and proportional, lining and old style), and small caps. In this OpenType benefits from the work done by Apple on <a href="/wiki/TrueType%20GX" class="freelinking" rel="nofollow">TrueType GX</a> (lately known as <a href="/wiki/Apple%20Advanced%20Typography" class="freelinking" rel="nofollow">Apple Advanced Typography</a> or AAT), which had a similar model for advanced typographical features.</p>
    <p><strong>Limitations</strong><br>
    As a technology, OpenType suffers from some unfortunate compromises, as well as benefiting from the concentrated wisdom of two of the computer industry's two most experienced implementors of typographic technology. Both Adobe and Microsoft had their own technologies for encoding and rendering fonts, and instead of hammering out a new rendering technology to match the new format, they instead decided to allow OpenType fonts to contain either Type 1 or TrueType outlines, resulting in two types or <a href="/wiki/flavor" class="freelinking" rel="nofollow">flavors</a> of OpenType fonts. Also, they opted to use as a basis for the file format TrueType, which uses a binary encoding that is much more opaque that Type 1's relatively easy to parse textual representation. This has made support for OpenType in type designers' tools (such as <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a>) slow to develop, and has also impeded the adoption of some of OpenType's more sophisticated (and useful) typographic features by software developers in general. Even Microsoft and Adobe's flagship applications do not support all of the registered OpenType features (which would in any case be difficult, as new features continue to be registered).</p>
    <p><strong>Advantages</strong><br>
    The benefits of OpenType to end users (whether graphic designers or not) are immediately apparent: users of non-Latin scripts are able, sometimes for the first time, to have their native scripts represented properly on the computer. Languages with flowing scripts (such as Arabic and Devanagari) and ideographic glyphs (such as the Chinese-derived languages of East Asia) are much better supported by OpenType, with its many features for proper positioning, reading flow (right-to-left versus top-to-bottom, right-to-left versus left-to-right), and glyph substitution. OpenType fonts can also replace the complicated system of <a href="/wiki/expert%20font" class="freelinking" rel="nofollow">expert font</a>s, <a href="/wiki/swash" class="freelinking" rel="nofollow">swash</a> fonts, <a href="/wiki/small%20caps" class="freelinking" rel="nofollow">small caps</a> fonts, and fonts containing <a href="/wiki/old%20style%20figures" class="freelinking" rel="nofollow">old style figures</a> with a single file, and makes it much easier to use the complicated sets of <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligature</a>s found in fonts such as <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a>. Glyph substitution and character positioning are as useful for flowing scripts in English as in non-Latin languages, as seen in the somewhat unnerving <a href="/wiki/Zapfino" class="freelinking" rel="nofollow">Zapfino</a> Extra Pro and <a href="/wiki/Bickham%20Script" class="freelinking" rel="nofollow">Bickham Script</a> Pro, which simulate the appearance of handwritten calligraphy through a complex and sophisticated set of substitutions.</p>
    <p>For font developers, OpenType has had several key benefits. Several of these are the same things that some people think of as limitations. For example, the fact that fonts with outlines in either of the previous main formats (TrueType and Type 1) are easily converted to OpenType without loss of outline fidelity or hinting is seen as an advantage to them, even while purists complain about the "dual formats."</p>
    <p>Similarly, adopting the "sfnt" table-based binary file format of TrueType requires that fonts be compiled from source and decompiled to edit, but also makes them much more compact. It also makes the OpenType format highly extensible, but in a modular way which can be more easily backwards compatible. Finally, because the "sfnt" format has been publicly documented for about 15 years, there are many tools for working with it.</p>
    <p>Finally, although Apple's competing AAT/GX format is slightly more capable in some areas, programming the state tables needed for AAT/GX typographic features is considerably more complicated than the simple declarative nature of OpenType layout. Adobe's early decision to license both tools and source code at no charge for OpenType layout has also helped OpenType development considerably, although one might wish that the visual approach of Microsoft's VOLT software was more widely used.</p>
    <p><strong>The Future of OpenType</strong><br>
    Even though OpenType has been a finished standard for several years as of the time of this writing, adoption is still in progress. The natural conservatism and healthy caution of the printing industry, combined with the reluctance with which OpenType has been embraced by software vendors, has slowed adoption. However, as it has been embraced by virtually all major font developers, as well as both the Mac and Windows operating systems, and the most critical software developers (Adobe, Quark, Microsoft, Apple), it is likely to become the de facto standard technology for digital fonts, and remain such for some time.</p>
