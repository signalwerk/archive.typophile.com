    <p><strong><a href="/web/20190924014104/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20190924014104/http://www.typophile.com/node/13082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Technologies</a>&nbsp;:&nbsp;OpenType</strong></p>
    <p><strong>About OpenType</strong><br>
    OpenType is a type format designed by <a href="/web/20190924014104/http://www.typophile.com/node/20191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Microsoft</a> and <a href="/web/20190924014104/http://www.typophile.com/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> which attempts to resolve the limitations of the two dominant outline font technologies (Adobe’s <a href="/web/20190924014104/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Type%201" title="Create node &quot;Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type 1</a> <a href="/web/20190924014104/http://www.typophile.com/node/14482" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">PostScript</a> fonts, and <a href="/web/20190924014104/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Apple" title="Create node &quot;Apple&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Apple</a> and Microsoft’s <a href="/web/20190924014104/http://www.typophile.com/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> fonts), as well as serving the needs of its two creators. From Microsoft it gets its focus on global language support: OpenType uses as its basis <a href="/web/20190924014104/http://www.typophile.com/node/12237" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Unicode</a>, and does away the complicated system of code pages found in older digital font formats. Something like OpenType’s advanced typographic features are needed for even basic support of certain languages. From Adobe OpenType gets its emphasis on advanced typographical controls for western and East Asian languages, providing support within a font for such features as alternate character forms, discretionary ligatures, variant figures (tabular and proportional, lining and old style), and small caps. In this OpenType benefits from the work done by Apple on <a href="/web/20190924014104/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=TrueType%20GX" title="Create node &quot;TrueType GX&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">TrueType <span class="caps">GX</span></a> (lately known as <a href="/web/20190924014104/http://www.typophile.com/node/49349" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Apple Advanced Typography</a> or <span class="caps">AAT</span>), which had a similar model for advanced typographical&nbsp;features.</p>
    <p><strong>Limitations</strong><br>
    As a technology, OpenType suffers from some unfortunate compromises, as well as benefiting from the concentrated wisdom of two of the computer industry’s two most experienced implementors of typographic technology. Both Adobe and Microsoft had their own technologies for encoding and rendering fonts, and instead of hammering out a new rendering technology to match the new format, they instead decided to allow OpenType fonts to contain either Type 1 or TrueType outlines, resulting in two types or <a href="/web/20190924014104/http://www.typophile.com/node/12946" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">flavors</a> of OpenType fonts. Also, they opted to use as a basis for the file format TrueType, which uses a binary encoding that is much more opaque that Type 1’s relatively easy to parse textual representation. This has made support for OpenType in type designers’ tools (such as <a href="/web/20190924014104/http://www.typophile.com/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a>) slow to develop, and has also impeded the adoption of some of OpenType’s more sophisticated (and useful) typographic features by software developers in general. Even Microsoft and Adobe’s flagship applications do not support all of the registered OpenType features (which would in any case be difficult, as new features continue to be&nbsp;registered).</p>
    <p><strong>Advantages</strong><br>
    The benefits of OpenType to end users (whether graphic designers or not) are immediately apparent: users of non-Latin scripts are able, sometimes for the first time, to have their native scripts represented properly on the computer. Languages with flowing scripts (such as Arabic and Devanagari) and ideographic glyphs (such as the Chinese-derived languages of East Asia) are much better supported by OpenType, with its many features for proper positioning, reading flow (right-to-left versus top-to-bottom, right-to-left versus left-to-right), and glyph substitution. OpenType fonts can also replace the complicated system of <a href="/web/20190924014104/http://www.typophile.com/node/40309" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Expert Font</a>s, <a href="/web/20190924014104/http://www.typophile.com/node/17514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">swash</a> fonts, <a href="/web/20190924014104/http://www.typophile.com/node/12584" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small caps</a> fonts, and fonts containing <a href="/web/20190924014104/http://www.typophile.com/node/40308" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Old Style Figures</a> with a single file, and makes it much easier to use the complicated sets of <a href="/web/20190924014104/http://www.typophile.com/node/12055" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ligature</a>s found in fonts such as <a href="/web/20190924014104/http://www.typophile.com/node/12210" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mrs Eaves</a>. Glyph substitution and character positioning are as useful for flowing scripts in English as in non-Latin languages, as seen in the somewhat unnerving <a href="/web/20190924014104/http://www.typophile.com/node/12422" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Zapfino</a> Extra Pro and <a href="/web/20190924014104/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bickham%20Script" title="Create node &quot;Bickham Script&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bickham Script</a> Pro, which simulate the appearance of handwritten calligraphy through a complex and sophisticated set of&nbsp;substitutions.</p>
    <p>For font developers, OpenType has had several key benefits. Several of these are the same things that some people think of as limitations. For example, the fact that fonts with outlines in either of the previous main formats (TrueType and Type 1) are easily converted to OpenType without loss of outline fidelity or hinting is seen as an advantage to them, even while purists complain about the “dual&nbsp;formats.”</p>
    <p>Similarly, adopting the “sfnt” table-based binary file format of TrueType requires that fonts be compiled from source and decompiled to edit, but also makes them much more compact. It also makes the OpenType format highly extensible, but in a modular way which can be more easily backwards compatible. Finally, because the “sfnt” format has been publicly documented for about 15 years, there are many tools for working with&nbsp;it.</p>
    <p>Finally, although Apple’s competing <span class="caps">AAT</span>/<span class="caps">GX</span> format is slightly more capable in some areas, programming the state tables needed for <span class="caps">AAT</span>/<span class="caps">GX</span> typographic features is considerably more complicated than the simple declarative nature of OpenType layout. Adobe’s early decision to license both tools and source code at no charge for OpenType layout has also helped OpenType development considerably, although one might wish that the visual approach of Microsoft’s <span class="caps">VOLT</span> software was more widely&nbsp;used.</p>
    <p><strong>The Future of OpenType</strong><br>
    Even though OpenType has been a finished standard for several years as of the time of this writing, adoption is still in progress. The natural conservatism and healthy caution of the printing industry, combined with the reluctance with which OpenType has been embraced by software vendors, has slowed adoption. However, as it has been embraced by virtually all major font developers, as well as both the Mac and Windows operating systems, and the most critical software developers (Adobe, Quark, Microsoft, Apple), it is likely to become the de facto standard technology for digital fonts, and remain such for some&nbsp;time.</p>
