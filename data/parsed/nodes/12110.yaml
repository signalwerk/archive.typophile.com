    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Conferences" class="freelinking" rel="nofollow">Conferences</a> : TypeCon</strong></p>
    <p>TypeCon is the annual event of the non-profit <a href="/wiki/sota" class="freelinking" rel="nofollow">Society of Typographic Aficionados</a> (SOTA).</p>
    <p>TypeCon is held in a different host city each year. <a href="/wiki/SOTA" class="freelinking" rel="nofollow">SOTA</a> partners with local and international organizations to produce a low-cost event featuring some of the brightest names in type, design, and the related disciplines. TypeCon offers a warm and inviting atmosphere where students and novices can mingle comfortably with seasoned professionals.</p>
    <p>TypeCon allows type lovers from all walks of life to get together — to listen, to learn, to teach, to network, and to take renewed inspiration into their own work.</p>
    <p>TypeCon has been held in North American cities to date, but draws a growing number of speakers, exhibitors, and attendees from outside North America.</p>
    <p>The growing <a href="http://www.flickr.com/groups/85628044@N00/pool/" rel="nofollow">flickr TypeCon pool</a> documents not only the event but local venue signage and other lettering as well. </p>
    <p><strong>Upcoming:</strong></p>
    <p>TypeCon2014 — Washington, DC</p>
    <p><strong>Past Conferences:</strong></p>
    <p>TypeCon2013: Portl&amp; — <em>Portland, Oregon</em><br>
    TypeCon2012: MKE Shift — <em>Milwaukee, Wisconsin</em><br>
    TypeCon2011: Surge — <em>New Orleans, Louisiana</em><br>
    TypeCon2010: Babel — <em>Los Angeles, California</em><br>
    TypeCon2009: Rhythm — <em>Atlanta, Georgia</em><br>
    TypeCon2008: Punkt — <em>Buffalo, New York</em><br>
    TypeCon2007: Letter Space — <em>Seattle, Washington</em><br>
    TypeCon2006: The Boston T Party — <em>Boston, Massachusetts</em><br>
    TypeCon2005: Alphabet City — <em>New York, New York</em><br>
    TypeCon2004: Type High — <em>San Francisco, California</em><br>
    TypeCon2003: Counter Culture — <em>Minneapolis, Minnesota</em><br>
    TypeCon2002: The Medium and the Message — <em>Toronto, Ontario</em><br>
    TypeCon2001: r/evolution — <em>Rochester, New York</em><br>
    TypeCon2000: <em>Westborough, Massachusetts</em><br>
    TypeCon1998: <em>Westborough, Massachusetts</em></p>
    <p><strong>Conference Site:</strong></p>
    <p><a href="http://www.typecon.com" title="www.typecon.com">www.typecon.com</a></p>
