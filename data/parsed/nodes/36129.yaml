      <p>Sounds great. I grew up in buffalo and still visit friends and family there every summer. I know what kind of amazing things Buffalo has and also know how hard it can be to convince people that have never been there of them. On the other side of that though, when I mention Buffalo to anyone that has visited there, they always light up and mention how wonderful a place it is; whether they are an art lover who has actually made the trip to see the Albright Knox, or just someone who enjoys camping in western New York because “It’s beautiful country.” So I was shocked when I heard typecon would be there next year. I mean, San Francisco, New York, Boston, Seattle, ... Buffalo. It is a bold and surprising choice. And a great idea.</p>
      <p>Derek</p>
