    html: |-
      <p>I’ve been to Buffalo about half a dozen times and enjoyed every visit. This trip, we zoomed out to the Roycroft campus (in East Aurora, just 20 minutes from the conference hotel) and toured one of the Karpeles manuscript museums (Buffalo has two). Had dinner at Empire - great food, well-priced, and a menu of deliciously colorful specialty martinis. Went to a networking shindig on the fantail deck of the USS Little Rock - on the waterfront - a gorgeous sunset experience. Played trivia for glory and ate and drank on the cheap at a wings-specializing bar. Took the kiddos bowling at Kenmore Lanes (they have the best bowling alley signage I’ve seen in a long time). Down by the water again to sugar up the boys at a custard stand much beloved by seagulls. Drove around the city to scope out the beautiful architecture, ghostly lettering on brick walls, and plethora of funky neon. Will hit more museums and check out the wee-hours entertainment when I return in the fall.</p>
      <p>There are so many venues for special events and field trips that we are going to have a hard time fitting it all in. But we’ll do our best :)</p>
