      <p>I just wanted to say, that the detail used in Tesla's name, has been probably intended as a "protection" of the honoured person against the "misuse". The small community wants to emphasize its cultural "separateness in memory". This is what I call politics.</p>
      <p>Offtopic, but anyway linked: Kościuszko's Monument in Chicago shows Polish hero of American Revolution sitting on the horse with his legs outstretched. That's the way of horse riding called the spanish school, while our riders sat on a horse on the bent legs. It's not a matter of philately difference. It's British and Prussian officers, general's opponents, who used to ride horses spanish way! So his rigid pose on the monument isn't anyway a portrait of victorious volunteer, but of an imperial general - with all implications.</p>
