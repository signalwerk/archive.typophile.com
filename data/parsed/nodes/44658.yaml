  html: |-
    <p>Hi eveybody,</p>
    <p>I´m trying to learn how to use this page at the moment but the reason that have been taken me to write you is because i´m trying to find the best typeface to represente John Ruskin Gallery in Cambridge School of Art,</p>
    <p>I was thinking to bring up the connotations from the Art &amp; Crafts Movement with William Morris influences as well. I´m not sure whether i should be using Calligraphy or Lynotype. The sign for the Gallery is going to have Ruskin Gallery written on it but as well I´m thinking to create a symbol with just R G in a circle to be recognised by all the viewers</p>
    <p>Looking forward to hear your comments!<br>
    Kind regards</p>
