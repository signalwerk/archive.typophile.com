      <p>did you get your "rri" problem sorted out? can you show us how you're coding this and maybe we can help.</p>
      <p>if you want two alternate r's before the i, there are a couple ways you could do this</p>
      <p>feature calt { # contextual alternate<br>
      sub r' r [i j] by r.alt;<br>
      r' [i j] by r.alt;<br>
      } calt;</p>
      <p>or</p>
      <p>feature calt { # contextual alternate<br>
      sub r' [i j] by r.alt;<br>
      sub r' r.alt by r.alt;<br>
      } calt;</p>
      <p>i'm not sure if one of these is preferred over the other, but it it were me, i think i'd pick the first. hope this helps...</p>
