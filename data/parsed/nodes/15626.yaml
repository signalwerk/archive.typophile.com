    <p>Here is one of the new type families I have been working on for the past few months. It started out as a display face but I pushed towards the text face side.  There are 3 weights in the posted PDF: light, regular and bold. There are small caps and oldstyle figures as well as all the CE glyphs. See if you can tell what I have "almost" done.<br>
    Any help would be greatly appreciated.  I really benefitted from my first font here last year and am hoping the comments will be as fruitful this time.</p>
    <p>Regards,</p>
    <p>ChrisL</p>
