    html: |-
      <p>Nick, Please Don't go! :-)</p>
      <p>The V on the regular version is correct.  The other weights I meant to flip but forgot. The rule is set by the lc v and the others should match it.  Only the regular  does so.<br>
      I tried both the diagonal M and the squared W and found both too jarring so I went back to the conventional straight M.<br>
      The s fits neighboring characters better slopped the way I have done it.  I tried the other way and the stroke just didn't pull around enough.<br>
      I fought with the 2 c's many times.  When the size is small the narrower way works; when the type is large, the wider c seems better.  It was more of a color issue and I found I just had to compromise.<br>
      I don't understand your comment about the slopes on the EFGKPR terminals. They all slope the same way.  Perhaps you mean it goes against the calligraphic flat pen angle model? The slope direction I gave it gives a bit more air to the lower counter as opposed to the upper making the vertical balance better to my eyes. I didn't feel that the flat pen model had a bearing on such a non-calligraphic face. I just used positive to negative space reasoning (dare I say Notan:-) The angle cuts help reduce dark spots at the joins. This face was intended as more of a tech/corporate as opposed to a warm humanistic face. I think that traditional type and calligraphy savvy users would probably agree with you on that though.</p>
      <p>Thanks Nick for taking the time and care to comment and by all means stay :-)</p>
      <p>ChrisL</p>
