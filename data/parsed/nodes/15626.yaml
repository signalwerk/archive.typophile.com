      <p>Héctor and Dan, thanks for your kind words and helpful suggestions. I will give them a try. Thanks to your encouragement, I am hoping to submit it to foundries soon.</p>
      <p>The first version I drew was the light caps and small caps. I was looking for a squarish face for smallcaps and couldn’t find what I wanted so I started designing my own.  I did a few characters in Adobe Illustrator for a simple heading on the job I was working on.  I then brought it to FontLab to extend.  I did two kinds of Lights, this one which is very regular and squared with equal proportions and another (which I will post soon as a separate face) in classic Roman proportions and much rounder. The lowercase in both was an afterthought at the time. I then did the bold and went back and forth with the light a few times before starting the regular.  I did a “medium” too but it needs work.<br>
      Dan, I will try an alternate single-story g which should be quite easy to add. What bothers you about my double-bowl g? I know it is a bit out of mainstream but what else is troubling to you?<br>
      Héctor, I will look at the S and &amp; again to see if I can fix them a bit. I understand what you mean about long text.  I would not intend this face for a novel.  You and Dan are right It is a more corporate or technical face.</p>
      <p>Has anyone figured out what I “almost” did yet? A hint is in the name and is somewhat apparent on pages 5, 6, &amp; 7 of my PDF.</p>
      <p>ChrisL</p>
