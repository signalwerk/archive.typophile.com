      <p>Hi Kyle, thanks for the input.  I actually started out with a square dot and felt it was too similar to the rest. Since all the strokes are so rectalinear, i thought it would be good to oppose them with a "Dot-Line" treatment (kinda' Morse Code :-).  As the weights get bolder, you may notice that the dots get more square.  I needed to hold the weight within the narrow space so that was my compromise.  </p>
