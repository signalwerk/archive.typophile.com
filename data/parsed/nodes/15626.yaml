      <p><em>&gt;most families that employ this use them for maybe only a small range of weights (2-3 max?)</em></p>
      <p>The reason for this is that, on an old <a href="/web/20150123031539/http://typophile.com/wiki/Linotype%20Machine" class="freelinking" rel="nofollow">Linotype Machine</a> matrix, you could have two different fonts. But the characters had to have the smae width. The Roman would either be duplexed with the Italic, or with the Bold. This is why Times Bold looks so cramped.</p>
      <p>Sometimes, a newspaper Serif face would be duplexed with a Sans. This sort of thing can still be seen in some digital faces, like <a href="/web/20150123031539/http://typophile.com/wiki/Compatil" class="freelinking" rel="nofollow">Compatil</a>.</p>
    html_clean: |-
