    votes: null
    html: |-
      <p>Uniwidth is a great feature, but it tends to exert too much pressure (on the "natural" widths of the black bodies) on the outlying reaches of color. In the first version of Patria for example all four weights were uniwidth, but I couldn't get the Light to be tight enough without making the letterforms too wide and I couldn't get the Bold to be loose enough without making the letterforms too narrow. A good solution I arrived at was to leave the Regular and Demi uniwidth, but make the Light/Bold spaced tighter/looser by a fixed amount (tracking +/-10) thus giving the user an easy way to force uniwidth if desired.</p>
      <p>hhp</p>
    html_clean: |-
