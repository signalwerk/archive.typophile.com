      <p>"you “almost” made the charwidths the same for all three weights!"</p>
      <p>Dead on Paul!</p>
      <p>The "almost" is that I did not do it intentionally.  It just happened.  I am a very "optical" kind of guy and just judge everything by eye.  When I did each weight, I did the metrics as I felt would be best for the way it looks.  I didn't even notice how similar the fit was until I printed the above PDF! Now that I see it, I think I will try to push the "almost" a bit more and see if it works. This "Align" concept would be a good way to insure fit in text when you were adding bold or light in the copy and then changed your mind.  You would not have to worry about reflow! I am sure someone else must have thought of this before though.</p>
      <p>ChrisL</p>
