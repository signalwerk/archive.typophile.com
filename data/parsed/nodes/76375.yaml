      <p>In short: No.</p>
      <p>I've had mixed results with first converting LaTeX to RTF, then importing the RTF into ID, but it <em>totally</em> depends on how "good" the LaTeX writer was. The more complicated the document is and the more 'tricks' the writer used, the smaller is the chance <a href="http://latex2rtf.sourceforge.net/" rel="nofollow">Latex2rtf</a> can do something -- or anything.<br>
      The RTF files it generates should be checked anyway, because at times it seems it forgets the odd closing brace.</p>
