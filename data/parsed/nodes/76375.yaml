    html: |-
      <p>Copy/pasting of formatted TeX code isn't really the best way ... you'd have to manually clean up all codes -- that's what LaTex2RTF might be able to do for you. TeX' syntax can be used in exceedingly weird ways; it needs a program to make sense of it. Search and Replace is not gonna cut it ... (Personal experience: Been there, Done that, Given up, Went to do Something else.)</p>
      <p>Second best, however, <em>may</em> be to get hold of a PDF. It might be possible to use Acrobat Pro to "Save As" the PDF to Word text. It's also fairly unpredictable, because it depends on what software produced the PDF in the first place. As with all things related to TeX, there are "proper" and "good ol' quick 'n dirty" ways to do so.</p>
