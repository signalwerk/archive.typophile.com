    html: |-
      <p>Well, yes and no.</p>
      <p>First off, I don't know LaTex. We used our own implementation of TeX for 20 years, which, like LaTeX, was based on plain TeX. Anytime you add macros to plain TeX, as LaTeX does, you up the work for someone who doesn't use your particular implementation. So I don't really know LaTeX.</p>
      <p>With that caveat, TeX sets better text type than InDesign. Just one example: InDesign's line-breaking algorithm is not quite as good as what TeX uses, but takes up less memory. That was the basis for the patent Adobe got. TeX isn't WYSIAYG. The control is unbelieveable, but so too can be the amount of work needed to exercise that control.</p>
      <p>Practically speaking, TeX is less good with embellishments. I'd hate to use it to set a popular magazine or advertisements -- or for that matter, a high school text book as such have developed in the States -- all pictures, tints, sidebars, etc. If that's the kind of book it is, you'd be right to move it to InDesign.</p>
      <p>But if it isn't, if it's a science book along the lines of a monograph, what you might consider is doing the design with whatever system you're comfortable with, then have it set by a compositor who uses LaTeX.</p>
      <p><a href="http://www.tug.org/texshowcase/" title="http://www.tug.org/texshowcase/">http://www.tug.org/texshowcase/</a></p>
