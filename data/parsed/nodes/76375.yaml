    <p>Hello everyone,</p>
    <p>This week, someone asked me to design a science book, which is all set in LaTeX. I don't have any prior experience with this markup language and I might lack time to learn it comprehensively. </p>
    <p>Having gathered some information about the language and downloaded the software at <a href="http://www.latex-project.org" title="http://www.latex-project.org">http://www.latex-project.org</a> I'd say that, with respect to typesetting of scientific formulas, LaTeX can be very helpful. But when it comes to over-all book design and typographic details, I'd rather stick to InDesign (CS3, it is).</p>
    <p>Is there an easy and reliable way to 'translate' LaTeX-documents into InDesign?</p>
