    <p>I'm currently working on a project at university, trying to create a typeface in both English and Japanese that work with each other seamlessly. What Im curious to find out is;</p>
    <p>- Your thoughts on the idea<br>
    - Any suggestions or recomendations<br>
    - Any really good or even really bad examples of these two languages at play.</p>
    <p>Thanks for your help.</p>
