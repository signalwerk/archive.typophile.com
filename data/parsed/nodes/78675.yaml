      <p>Virtually all Japanese typefaces include a Latin component, meaning that it is a problem that is tackled by every Japanese type foundry, Adobe included.</p>
      <p>Given that the Latin glyphs are an add-on to the Japanese glyphs, meaning that the Japanese glyphs are primary, if you need to compromise the design of the glyphs for one of the scripts, it should be for the Latin glyphs, because they are not primary. But, there shouldn't be a need to compromise the glyphs of either script.</p>
      <p>There are a few things to consider. One is to match the style, followed by the weight. Next, consider that the Japanese glyphs (kana, kanji, symbols, and punctuation) are optically centered within a square, but that the Latin glyphs rest on a baseline that is offset to some degree from the bottom of the square, anywhere from 10 to 20 percent, with 12 percent being the most common.</p>
