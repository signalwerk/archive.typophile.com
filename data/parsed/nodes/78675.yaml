    html: |-
      <p>This sounds like a difficult project.</p>
      <p>I'm definitely not an expert in this area, but I've got a little experience in mixing the two.<br>
      almost always Latin character sets included in Japanese fonts, but they tend to be either:</p>
      <ul>
      <li>fixed-width characters designed to be used for single words, acronyms, etc. within longer passages of Japanese text, or</li>
      <li>just copies of some existing, nondescript Latin typeface.</li>
      </ul>
      <p>I think there are also often both. You'd think that if you're setting a little Japanese in the middle of a bunch of Latin, you'd want that second character set. Sometimes this looks just fine, but since the Japanese characters are usually cap height, it can also look really awkward. I don't know if anyone else feels the same way, but in many cases, my eye expects to see the Japanese text at something closer to the height of small caps.</p>
      <p>I think that in order for a single typeface to include Latin and Japanese characters and look good all the time, it would need full caps, small caps, fixed-width versions of everything, and two heights of Japanese characters. Ugh.</p>
