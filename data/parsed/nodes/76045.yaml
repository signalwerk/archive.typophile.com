      <p>No offense intended to Ezra, who doubtless was trying to be helpful, but the above post is &gt;50% nonsense. Please beware.</p>
      <p>Exporting text in PDF as text rather than converting to outlines is usually preferable, and results in better rendering of the text on low-res devices, including on screen.</p>
      <p>Your problem almost certainly has to do with the vertical metrics built into the font being a bit odd. </p>
      <p>(1) The font has large bounding box settings, quite possibly legitimately (because it has some capitals which extend a whole lot further up or down than the most common letters). Some "office" type applications use this information for spacing, and will clip anything that extends beyond that. You can override the default spacing in Word by setting spacing to be a specific number of points instead of "auto." This may result in clipping, however.</p>
      <p>(2) Additionally, there may be something else weird about the vertical metrics which is causing some odd shifting between what you see on screen and creating the PDF. Bringing it into FontLab Studio or the like and regenerating it with "auto" settings for metrics will probably fix the problem.</p>
      <p>(3) What are you using to create the PDF?</p>
      <p>It is true that more advanced applications will tend to do a better job of line spacing on screen, without clipping on screen, but this has little to do with PDF output per se.</p>
      <p>Post your original misbehaving Word doc and I'll be curious to check it out.</p>
      <p>Regards,</p>
      <p>T</p>
