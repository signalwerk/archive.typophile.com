    <p>I have a font called Estrya's Handwriting that has particularly interesting font metrics.  When using it in Word it seems to behave in a very strange way, especially when you compare it to PowerPoint.</p>
    <p>In PowerPoint when I lay out it seems to auto-clip the whitespace at the bottom. The Save as PDF produces what I would expect.</p>
    <p>But in Word it's a different story where it seems to put in some extra space (or is not intelligent enough to remove unnecessary space). Word's PDF output is even worse.  I had to do a really strange hack with a textbox to get it to output correctly in PDF and print formats.</p>
    <p>Any thoughts on what about the font may be causing this?</p>
