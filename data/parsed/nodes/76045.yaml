      <p>This may be an issue with how the font renders in the PDF. MS Office most likely exports the words as <em>text</em> rather than <em>outlines</em>. In better layout programs you have the option to export the shapes of the letters rather than embedding the text. This will ensure your exported PDF looks the same as your original layout.</p>
      <p>There is a great free program called <a class="freelinking external" href="http://inkscape.org/" rel="nofollow">Inkscape</a> that is easy to learn and will let you have more control over the PDF output.</p>
