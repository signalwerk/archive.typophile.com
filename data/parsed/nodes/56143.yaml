  html: |-
    <p>Some CEO dumps a logo on my desk and tells me to make a new one with an entirely different text but using the same font. Me: "Sure. So... what's this font?" Him: "How should I know? That's your job innit?"</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-bw_3579.gif"></div><p></p>
    <p>It <em>could</em> be a custom job; however, I rate that as unlikely, given the subtleties -- the left and right leg of the "U" are of slightly different widths, and the "N" has some surprising curves I just know I've seen before (perhaps Friz Quadratish?). OTOH, I'm not too wild about those "E" and "F"s. Still, I'd like to know.</p>
