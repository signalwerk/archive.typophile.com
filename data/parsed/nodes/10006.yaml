    html: <p>Hm, I'm trying the demo, and so far, it's not doing what I expected. <br> <br>When I tried importing, it didn't just import the fonts from my system font directories. It also imported all the other font collections I have on-disk. I ended up with over a thousand fonts I didn't want installed, all lumped together with the ones I did want. The program was so slow as to be unusable; and then it locked up and had to be force-quit. <br> <br>Since I had merely copied my fonts when importing them, I decided to move my inactive fonts to another volume, delete the Fontagent font directory, and re-import. Now half my applications have crashed, FontAgent still thinks all those non-existant fonts are still installed, and I'm not sure what to do.</p>
