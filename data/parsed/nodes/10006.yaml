  html: "<p>I've decided I need to weed out some bad fonts and keep things organized, so I was comparing Mac font management software and decided that FontAgent Pro seems like the best one for my needs. <br> <br>Version 3 is out now and I can't find many reviews. Is anyone here using it? Is it fast, and does it stay out of the way?  <br> <br>Also, a question about uninstallation: can it simply be dragged to the trash without screwing up your fonts, or does the practice of using special font directories make it more complicated?</p>"
