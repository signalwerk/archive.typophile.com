    date: 2005-03-29T18:33:00
    date_raw: 29 Mar 2005 — 6:33pm
    votes: null
    html: <p>I'm using FAP 3, and if you liked previous versions, you'll probably like this version, which isn't very different. It seems like they wanted to split it into a simple edition for individual users, and create an enterprise product for design shops, with the extra price they can charge for that being the clear motivation. <br> <br>I prefer FontReserve's options for previewing fonts to FAP's relatively paltry options. Also, FAP's preview panes support neither TrueType GX or OpenType's features (I think it's still a Carbon app at core, which would explain this), so if the font you're looking at has all kinds of fancy-pants features, you're not going to see them there. <br> <br>Also, despite Insider's claims, it is occasionally possible to corrupt the FontAgent database. I have a problem where fonts have started becoming unpreviewable, which causes them to be culled when they're "audited" (a new feature in FAP 3). My solution was to start over again, and I haven't seen the problem since. <br> <br>Those are my only quibbles, and after dealing with FontReserve, they seem very minor in comparison. I used to love FontReserve, but these days it feels so ungainly, and it's crash-prone, in comparison to FAP, which is stable as a rock. <br> <br>FAP will manage your system fonts for you, and put them in its own special folders, but once you turn off system font management, it puts them all back where they belong. And there's nothing too extraordinary about the organization of the master repository it uses, so deinstalling the program is a matter of turning off the system font management and dragging the program (and its support files in your Library) into the trash. Just make sure you copy fonts rather than move them into the library.</p>
