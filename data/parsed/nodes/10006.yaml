  - id: 63645
    user: 5605
    date: 2005-03-29T22:45:00
    date_raw: 29 Mar 2005 — 10:45pm
    votes: null
    html: "<p>Almost everybody seems to have that problem with FontAgent the first time they use it, which is part of the reason why I included that link to the FontGeek article up above. The first time you run FontAgent, it tries to initialize itself by scanning all the fonts on your disk. If you have it set to \"activate fonts upon import\", then yeah, having 1,000 fonts suddenly active is going to cause problems. <br> <br>If you truly want to start over, try deleting the FontAgent Pro directory in your Library and then firing it up again. I don't know if there's any way to keep it from scanning your disk when it goes to initialize its database, but if you turn off \"activate fonts after import\", you shouldn't end up with too many problems. I've imported upwards of 16,000 fonts into FontAgent (to test it), and that makes the browser very slow to start up, but as long as only a small subset of those fonts are active at any given time, the rest of the system's performance was unaffected. <br> <br>IMPORTANT: if you do decide to do this, make sure that you've disabled \"manage system fonts\" before you trash the Library folder, and then reactivate it after you've reinitialized FontAgent by running the browser and importing some fonts. I don't know if it keeps track of that state in its database, but better safe than sorry! Good luck!</p>"
