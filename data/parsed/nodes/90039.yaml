      <p>I toyed with the idea of getting a kickstarter going for my typeface. It went as far as getting everything approved by Kickstarter – I just never launched it. </p>
      <p>My intention was to help fund my research. As my typeface is intended to cover many latin orthographies which are normally ignored (and have a very limited amount of available information), I thought it might be a good idea to use something like Kickstarter to help raise funds to make my typeface as useful and accurate as possible (to both expedite the development process and as I have nearly exhausted my own "research" funds).</p>
      <p>At the present time, I still go back and forth about whether or not I should go through with the idea but in the end, I don't see a problem using Kickstarter is the purpose is something other than "drawing a typeface takes a long time and I want money now", in which case, I'd suggest finding something other than type design as a source of income.</p>
