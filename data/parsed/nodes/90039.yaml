      <p>&gt; Signage restrictions? An identity-standards<br>
      &gt; manual for all businesses? </p>
      <p>Most cities have signage restrictions (size, location, illumination, etc.) and require businesses to obtain permits before erecting new signs. The rules are typically much more restrictive in upscale or historic areas.  </p>
      <p>But requiring that all merchants use the same typeface would not only be a dumb idea but also would certainly result in a rebellion by local merchants and city officials would get the boot at the next election.</p>
      <p>But using it for official city signs and projects would be a more realistic and doable goal.</p>
