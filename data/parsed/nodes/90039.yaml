    html: |-
      <p><cite>Trying to charge twice for the same product is shady and unfair.</cite></p>
      <p>Managing to charge twice for the same product is utterly clever, from a merchand’s point of view ;-)</p>
      <p>We should not turn to unduely moralize about it. Frankly, at the end of the day it’s about marketing our work. To possibly develop new channels of gaining profit. What’s wrong with that?</p>
      <p>Having said this, I still feel kickstarting a font project may be an intersting option to go for. Why? Well, the fontist sits in his/her laboratorium breeding upon a new groundbreaking font idea. He estimates the amount of labour neccessary to get it done, to get it shipped to the market. He (she) estimates the time it will take, the costs of that time ... you understand. “Will the market pay back?”<br>
      But now he turns to ask the public *in advance* what they make of the concept. Is it any good? Is it worthwhile, promising? Is it wanted? Would anyone give a penny for its success? Worthy questions, i.m.o. Maybe Kickstarter functions similar to a stock exchange: people deal with estimations and expectations. – I’m just curious.</p>
      <p>It’s fairly new and fragile. Let’s monitor it with care.</p>
      <p>Recently I thought about announcing a typeface which would get licenced only to a fixed number of licencees. A kind of limitation, similar to local limitation (“Chattanooga”), which may or may not add value to the product by the implementation of shortage. Which means: exclusivity.</p>
