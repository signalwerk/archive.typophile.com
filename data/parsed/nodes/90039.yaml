      <p>Kickstarter will promote your project if it is novel or interesting, and has nothing to do with the raised amount. Trying to raise money for a pre-designed font for sale isn't that interesting. </p>
      <p>Some people have seen some success trying to kickstart font production for personal profit, but I don't think that will last long. People will tire of it. The pre-existing model of creating fonts "on spec" will be the predominate model after Kickstarter's novelty wears off. That said, kickstarter and it's ilk are fantastic entrepreneurial tools that will start many businesses and ideas over our lifetimes. </p>
      <p>The <a class="freelinking external" href="http://en.wikipedia.org/wiki/Invisible_hand" rel="nofollow">invisible hand</a> will choose.</p>
      <p>A kickstarter's value is in the idea or the utility of the idea, and a font idea probably won't float if the idea benefits just the designer; a community generally needs to benefit.</p>
      <p>From a pure dollars and cents perspective, the Chatype project is being done at a (huge) loss. But the utility to the Chattanooga community will be enormous, and the collateral benefit to the typographic and design community will be even larger. The press response Chatype has received is amazing, and I think the idea will spark custom, limited typefaces all over the USA.</p>
