    <p>I hope I didn’t miss that this has been discussed here before.</p>
    <p>There is an initiative to create a local typeface for Chattanooga, TN. Perhaps more interesting than the mere fact is the way they try to gain funds for it (-&gt;<br>
    <a class="freelinking external" href="http://www.kickstarter.com/projects/chatype/chatype-a-typeface-for-chattanooga-tennessee?ref=category" rel="nofollow"> see on Kickstarter</a>)</p>
    <p>I think it is worth getting backed by more people. And I think, if they succeed, this will be a nice showcase for the type industry as a whole.<br>
    The general market for fonts is over-saturated. There is more potential in customfonting, perhaps.</p>
