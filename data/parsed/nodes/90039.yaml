      <p>There are many economic models for type production.</p>
      <p>I’ve never come across a criticism of arguably the predominant North American method, which is a typeface commissioned by a publication, exclusively licenced for a few years, then retailed. And yet this model tends to commit accomplished type designers to producing unimaginative conservative designs, often “revivals”. </p>
      <p>Similarly, OEM types commissioned by digital device manufacturers tend to a perfunctory and corporate blandness. </p>
      <p>Such designs are extremely useful and functional, but IMO (and I’ve contributed to these genres) uninspiring.</p>
      <p>Even designing retail fonts without any form of pre-payment, one can readily strightjacket oneself by catering to the ecology of the market with a me-too style.</p>
      <p>Kickstarter-funded type designs have a degree of autonomy, in that the type designs themselves are only part of the funders’ engagement, with rewards such as letterpress specimens being a strong carrot.</p>
      <p>The most interesting new types identify sparsely populated or emergent niches, create new breeds (e.g. Ambicase), or demonstrate virtuosity informed by taste, style and drawing ability, such as the work of von Döhren and Hernández.</p>
      <p>**</p>
      <p>Unless they are down on their luck, I don’t see why established type designers would require kickstarting, as their accumulated body of work (not to mention commissions) provides ongoing income during the development of new types. So Kickstarter appears to function for those outside the mainstream, or novices.</p>
      <p>Nonetheless, an established type designer might use Kickstarter to connect with customers, or as a medium for developing specimens, which as we all know are a huge part of type culture.</p>
