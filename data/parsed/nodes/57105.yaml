    html: <p>I'd think Eureka might actually work. Since DIN is so ... rigid, you need an angular serif (can't think of any at the moment) and maybe a semi-bold weight to match your DIN Bold Condensed. Baskerville is far too rounded and delicate to really "compliment" DIN.</p>
