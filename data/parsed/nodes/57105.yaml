    <p>Hi,<br>
     Currently I am creating a letterhead and resume for myself. I've used the typeface Din Bold-Condensed for my name, and important copy. I'm looking for something that pairs really well with it. I've been using Baskerville thus-far but something seems a little off. Does anyone have any suggestions? I think what is throwing me of is the fact that Din is so condensed. I would prefer not to change this because I'm happy with it, I just need to find the copy that goes well with it.</p>
    <p>Thanks</p>
