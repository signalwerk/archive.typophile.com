      <p>Klaxon by Ryan Hughes (Device) is interesting.<br>
      With the exception of a couple of letters, the units don't change position, they just "toggle" on/off.<br>
      I always thought it would be interesting to animate something like that, and have started a few designs with that in mind, but never finished them.<br>
      Also: Delay, Airport, LCD, and the legendary Fregio Mecano (CG Section)</p>
