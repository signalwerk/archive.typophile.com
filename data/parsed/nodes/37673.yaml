      <p>Hi Jakob, am a student too :)</p>
      <p>Of course you can develop a whole typeface out of this image just by cutting and pasting various elements. And while designing this typeface(specific) you don't even need to keep the rules in your mind.<br>
      I made a similar typeface in a day while attending a conference in Mumbai last year. I took rail ticket window as an inspiration and built a complete face out of that. I posted it on the Typophile also. Though I didn't get much time to work on the design further, Its incomplete.</p>
