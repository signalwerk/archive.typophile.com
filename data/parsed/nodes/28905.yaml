      <p>Yeah, no kidding.  I don't want all of it, but some of my fave faces would be great.  ;-)</p>
      <p>We had this one posted on BOOK_ARTS-L yesterday....</p>
      <p>I have a copy of boxes of type that I never seem to use and would like to get some that I might rather have. If anyone would like to trade for these please e-mail me off list at trade at bookbinder.ca</p>
      <p>The first is a box labeled "Western Type 928 Central and consists of percent signs, check boxes, slashes and cent and "@ signs in numerous sizes from about 24 point to 10 point as well as some fairly small  round bullets, checks, numerical operators and asterisks.</p>
      <p>The second was labeled when I bought it as " 20th Century Ultra Bd Cnd l/c 24 pt." There is also another word scribbled on the label that I think says "Detroit"</p>
      <p>These can be viewed at <a href="http://adobe.kodakgallery.com/I.jsp?c=barpvxc3.bkpse50j&amp;x=0&amp;y=vc149w" title="http://adobe.kodakgallery.com/I.jsp?c=barpvxc3.bkpse50j&amp;x=0&amp;y=vc149w">http://adobe.kodakgallery.com/I.jsp?c=barpvxc3.bkpse50j&amp;x=0&amp;y=vc149w</a> and clicking on the first photo</p>
