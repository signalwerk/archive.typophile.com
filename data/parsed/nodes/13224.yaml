    html: |-
      <p>Dot accent is a quite common diacritical mark in some European languages. It is used in Maltese (over ‘c’, ‘g’, ‘z’), Lithuanian (over ‘e’), Polish (over ‘z’) and Turkish (they distinct between  i/İ — ı/I — i with and without dot). And actually, the dot as a diacritical mark can be found in every language using Latin script over ‘i’.<br>
      More at <a href="http://diacritics.typo.cz/index.php?id=15">Project Diacritics</a></p>
