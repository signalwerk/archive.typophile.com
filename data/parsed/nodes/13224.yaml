      <p>Catalan (u/c &amp; l/c I and U for diaeresis and u/c &amp; l/c L for dot) and Turkish (u/c &amp; l/c O and U for diaeresis and u/c I for dot) use both but not on the same character and Hungarian uses the diaeresis (umlaut) and double acute (Hungarian umlaut). Macron seems to be Lithuanian and Latvian also used for transliteration of Arabic.<br>
      Tim</p>
