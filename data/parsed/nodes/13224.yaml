      <p>Spooky, just last week I was thinking that in German one could get away with making the umlaut one dot… It would be especially helpful in caps. If you did this at the type design level, the font would not be [easily] usable for a language that uses <strong>both</strong> single and double dots [on the same vowels]. Are there any such languages Filip? While if you did this at the composition level, you’d have to worry about circumventing spell-checking issues.</p>
      <p>Or what about using a macron-style umlaut?</p>
      <p>hhp</p>
