  html: |-
    <p>I was looking through an old type specimen book, and found a typeface called Ionic Shaded.   It didn't have a full alphabet, and I haven't been able to find any additional information on it. I redrew some of the letters, omitting the "shaded" part:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bluered_4600.gif"></div><p></p>
    <p>Is this face found under another name? Is there a digital equivalent somewhere?</p>
