      <p>Since I'm not a believer of sans for text, I would try to find the most<br>
      readable slab, and see if it works with Prelo Slab. Or you could try a<br>
      wedge-serif font, like my multiple-award-winning Patria, which has<br>
      a sober, no-nonsense feel while maintaining very high readability.<br>
      Charset in this Creative Review spread: <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a></p>
      <p>hhp</p>
