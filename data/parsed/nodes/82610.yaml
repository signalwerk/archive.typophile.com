  html: |-
    <p>Hello guys </p>
    <p>I'm trying to find suitable life partner for one good looking guy, call Prelo Slab.<br>
    He will be the highlight, the head, the headline in my brochure print work, for local property developer. I try to find him a suitable, easy on the eye partner, for the body part of the design, anything head down. </p>
    <p>I'm not certain it's a right choice to start with, but the developer's projects are very grey, glass, concrete, minimalist like designs, which I find very suitable for Prelo use. </p>
    <p>Would you be kind to please make some recommendations, which other typeface I could marry with it, one that also looks fine in small print ? </p>
    <p>Your time and expertise greatly appreciated. </p>
    <p>Best regards</p>
    <p>Sebastian</p>
