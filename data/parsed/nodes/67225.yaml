      <p>Hermann Zapf's <strong>Medici Script</strong> takes its name from the famous Florentine family.</p>
      <p>While not particular to Florence, you might have a look at some script styles such as Adrian Frutiger's <strong>Ondine</strong>, or a <em>rotunda</em> such as <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/san-marco/" rel="nofollow">San Marco</a></strong>.</p>
      <p>Apropos of your first examples of lettering styles: <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/urw/florentine/urw-t-regular/" rel="nofollow">URW Florentine</a></strong></p>
