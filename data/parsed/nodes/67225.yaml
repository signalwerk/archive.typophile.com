      <p>Antonio di Bartolommeo Miscomini (c. 1445–1495) was a Bolognese punchcutter and printer who worked in Venice, Modena and above all <strong>Florence</strong>, where he cut roman and orthotic Greek types.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/4187284898_220cef8b96_5966.jpg"></div><p></p>
      <p><cite><a class="freelinking external" href="http://www.flickr.com/photos/bookhistorian/4187284898/" rel="nofollow">1482 Firenze - Antonius Mischomini, type 3,4</a></cite> cc-by History of the Book, Amsterdam (<a class="freelinking external" href="http://www.flickr.com/search/?q=Mischomini&amp;w=43719536@N02" rel="nofollow">more on Flickr</a>)</p>
      <p>I am uncertain if any revivals of his types exist.</p>
