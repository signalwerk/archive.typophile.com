    <p>I'm looking for historical fonts related to Tuscany or Florence.<br>
    I know LetterPerfect offers some historical reproductions of tuscan fonts, like <a class="freelinking external" href="http://www.letterspace.com/LETTERPERFECT_FONTS/beata.htm" rel="nofollow">Beata</a>, <a class="freelinking external" href="http://www.letterspace.com/LETTERPERFECT_FONTS/donatello.htm" rel="nofollow">Donatello</a> and <a class="freelinking external" href="http://www.letterspace.com/LETTERPERFECT_FONTS/ghiberti.htm" rel="nofollow">Ghiberti</a>, and that's just a good deal.<br>
    Just wondering if there are other fonts with the same historical background.<br>
    Thank you!</p>
