    html: <p>Hehe, I can understand your feelings Miguel, but please consider  <br>this. Each and every one of these beautifully designed typefaces  <br>took hours, days, weeks, months, sometimes years to develop and  <br>produce. This means a lot of talent, dedication, skill and relentless  <br>work. Plus, not only do they look great, but they perform well too -  <br>they set nicely in your graphics software, they don't make your  <br>printer crash, hey, they simply make you and your work look good. <br> <br>So, ask yourself, if you were a type designer, would you be willing  <br>to give the fruit of your labour away for free? I can imagine you  <br>as well have rent or mortgage to pay, phone and electricity bills,  <br>the computer you work on, you like to go out or go see a movie  <br>once in a while... <br> <br>I think it's only fair you pay a very reasonable fee to use these  <br>wonderful communication devices.</p>
