    <p>:)</p>
    <p>Which typeface and other design considerations would you like to see accompanying anthropological photographs &amp; video frames?</p>
    <p>I am linking low resolution examples of my fieldwork: <a class="freelinking external" href="http://www.facebook.com/album.php?aid=136095&amp;id=748207703&amp;l=d740ca539c">Gallery @ Facebook</a>. Please tell me if it doesn't work.</p>
    <p>The people you see in these images face imminent genetic extinction and ongoing cultural erosion. For clarification, DNA migration may stem from outside tribes joining this tribe to evade western influence. There have also been accusations of brothel rape. You can see in the photographs that children do not share grandparent's physical traits. Only 155 surviving individuals reflect the ancestral appearance - most of whom are elders who have had their children.</p>
    <p>Which typeface, and do you think any particular layout should be considered? :)</p>
