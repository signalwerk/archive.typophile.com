      <p>It's a difficult question. I'm slightly familiar with the Batak people since my manager used to live in Sumatra and is married to a Batak woman.<br>
      I like the idea of choosing type that looks like a field report; but perhaps for captions only. I don't think Officina Sans works well for long text blocks — all those rectangular serifs get in the way for me.<br>
      I'm not sure if you're producing an academic essay, a trip report or something larger so I won't advise on layout.<br>
      I worked on a project a couple of years ago for an international peace organisation that was concerned with endangered communities in Colombia. I chose Dolly, which I chose for its feeling of humanity and compassion, and the fact I really like it. Not sure if that's very helpful ;)</p>
