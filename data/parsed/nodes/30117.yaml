      <p>“Maybe it’s a particular vanity that I have because I approach web design from a print design background. Fluid layouts? Yuck. 40 pica column measures? Disgusting. I want everything locked down tight, especially the text.”</p>
      <p>That’s not really embracing the medium properly. That’s fighting it.</p>
      <p>“But I want everything to scale in proportion to MY design. “</p>
      <p>It’s not YOUR design. It’s your suggestion of a design. The browser, the monitor, the user, the display device, etc. all have a say in how your design will eventually look to each individual person.</p>
      <p>Don’t try to dictate to the pixel online. It will only drive you crazy.</p>
