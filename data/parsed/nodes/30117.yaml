    html: |-
      <p>“But I’ll argue that it IS my design, browser be-damned.”</p>
      <p>You’re sounding like a typical frustrated print designer on the web. ;0)</p>
      <p>On paper, yes, it is your design. It can only look one way. And you know it’s going to look exactly the same for everyone that picks up that piece of paper.</p>
      <p>Online, you simply do not know that. You don’t know what fonts a person has installed. You don’t know what size their web browser is. You don’t know the size of their monitor. You don’t know if they are using a wide screen plasma monitor or a 2” cell phone screen. You don’t know if they prefer 18pt type for their aging eyes or prefer 8pt type. </p>
      <p>You simply can’t dictate anything online. Only suggest. By all means, use your training and skills and knowledge to suggest the best option, but also realize that it might change, and design to accomodate that whenever you can.</p>
      <p>“Browsers are still in the crappy 4-color offset press with bad rollers stage.”</p>
      <p>It sounds like you are equating ’I can’t force this design on everyone’ with meaning ’it’s a crappy browser’. A good browser gives more control to the end-user than the designer.</p>
      <p>And while zooming sounds good, it’s not necessarily better or worse than the usual font size zooming in other browsers. They both serve a purpose, but people may prefer one over the other.</p>
