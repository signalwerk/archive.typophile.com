      <p>&gt;I want to dictate with an Iron Fist the structure.</p>
      <p>Zooming -<br>
      You can do that somehow * with defining the whole site css with the unit <em>em</em> instead of <em>px</em>. With <em>em</em> you can make a layout “fix”, but enable the zoom functionality for the user via Browsermenu (fontsize), Wheelmouse, Shortcuts for ALL browsers.</p>
      <p>The initial fontsize defines the “largeness” of the whole site. If the user decreases/increases the fontsize, the whole sitelayout is zooming. Like opera did that for years or IE 7 now (jumped on the bandwagon)</p>
      <p>* there is a javascript-experiment available, that reduces dynamically the line-height, if the user changes the font-size. It is a “weak beginning”, but it is a beginning.</p>
