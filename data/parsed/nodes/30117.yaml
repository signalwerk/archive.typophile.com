    html: |-
      <p><em>What’s different now? IE will always suck, that I know. </em></p>
      <p>ROFL!  But now there’s Firefox and upgrades to Safari, and a swack of other minor browsers.  And I won’t even go into what you need to do to make sites useful for the visually impaired.</p>
      <p><em>But spec’ing sizes is still the same code, isn’t it?</em></p>
      <p>Type size hasn’t changed much but monitor sizes have.  It’s quite unusual now to spec for small monitors, whereas that used to be much more standard.  Part of that’s because the prices have come down, at least here in the industrialized world.</p>
      <p>I dug out one of my early web design books — it’s pretty funny the way it talks about HTML 2.0 as “cutting edge” — and when one considers the explosion of XML et al, I’d want to see this site updated within the last six months to be really useful. </p>
      <p>Plus it’s not just designers who have made great strides — users are a lot more savvy (and discriminating) about what they will and will not deal with.  Even with many folks switching from dial-up to some flavour of high-speed, monster Flash-only sites still have a limited audience: personally, I usually skip ’em....</p>
