      <p>It’s a futile thing.</p>
      <p>The web is not about dictating design, but suggesting design. Suggest something, and assume it will change to an extent by the time it’s rendered for the end-user.</p>
      <p>“Type size hasn’t changed much but monitor sizes have.”</p>
      <p>True, but while they’ve gotten larger, they’ve also gotten smaller (PDAs, Cell phones, Blackberries, compact laptops, etc.)</p>
