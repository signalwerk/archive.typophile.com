    html: |-
      <p>I don’t want to dictate the pixel. I want to dictate with an Iron Fist the structure. I see far too many piss-poor webpages that treat type as if it were a second thought, because quite frankly it is to most people. If I dictate structure with the end browser and user in mind, and the design <cite>of the text</cite> comes out properly, then I have done my job.</p>
      <p>Embracing the medium does not have to include throwing out all of our knowledge of how people read and what makes for best readability. That means structuring everything to scale properly according to best usage. Good structure and design transcends all mediums.</p>
      <p>But I’ll argue that it IS my design, browser be-damned. It’s the same as printing on a crappy 4-color offset newspaper press. You know something is going to get screwed up if you call for 12pt Bodoni in full color on both page 1 and 2 flats. The color is going to mis-register, everything will look like mud, etc. It’s STILL my design, and I have to accept responsibility for ignoring the limitations of the medium, and adjusting accordingly.</p>
      <p>Browsers are still in the crappy 4-color offset press with bad rollers stage. We are all waiting for the Heidleburg browser to come out, but until it’s here, we still have to have accountablility for our designs.</p>
