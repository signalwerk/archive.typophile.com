    html: <p> mark, ricardo, thanks guys, <br>i was afraid that i was never gonna get any feedback on the subject. nobody seems to have encountered this before. <br> <br>mark, <br>i've posted my problem on the fog usenet group, but so far no reply. but it seems to be a great resource as well. thanks for the hint! <br> <br>ricardo, <br>i've checked the font before with mac encoding and it worked just fine. i also checked for open paths - no problems. i even checked for stray points that might've been located way above the ascender or way below the decender which could cause leading problems - didn't find any. <br> <br>i've just received a short e-mail from the guy who's testing the fonts and it looks like setting the fog file to adobe encoding but generating it in original encoding solves all problems! i'll keep you posted  if this is really the end of my painstaking journey into cross platform font country. </p>
