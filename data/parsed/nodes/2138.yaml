    html: <p> OK, so i figured out, that using the adobe standard encoding solves the leading problem. but unfortunately this encoding causes a postscript error when i try to print the font. i can't find anything on this subject at macromedia's fontographer support, the fontographer manual, not even in stephen moye's fontographer book. any ideas how to solve this new problem? </p>
