    html: <p> Hello Simon, did you tryed to used the Macintosh encoding only. Check if you can convert to curves a sample of text with your font, sometimes some letters don't have the forms totally close and make some problems.  <br> <br>Good luck and tell us something how you resolve your problem.  <br> <br>Best regards Simon </p>
