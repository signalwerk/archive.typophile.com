  html: <p> i'm currently having some trouble with a font modification job where i'm not even sure that the trouble is from my side. my job was to modify the regular and bold weights of stone sans for a local ad agency so that it would run identically on mac os and win nt. with help from a very dear friend i managed to get the encoding right so that the "new" font displays and prints identically on both systems. although i've imported all metrics and bitmaps from the original stone sans including ascent and descent, their tests showed different values regarding the leading of the font. the bold weight for mac os seemed particularilly off but apperently only when tested in filemaker. the values were identical when tested in word 98. i modified and generated the font in fontographer 4.1.5 on a mac. <br>i'm curious to know whether anybody else has experienced problems like this and verify my assumption that this is a filemaker problem and not a problem with the font. possible solutions would be greatly appreciated. </p>
