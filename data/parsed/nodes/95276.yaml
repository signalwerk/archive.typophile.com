      <p>Jodie, Georgie has many more styles than Annabel Lee, and looking at the "Glyph coverage" icons it seems that it additionally has some OpenType features and smallcaps. And it's only $3 more (per style). But neither one of those is super close to the sample.</p>
      <p>Bisque: I doubt Georgie / Annabel Lee is derived from that. That said, the Jonahfonts library <em>does</em> happen to make me mildly uneasy - but I'd have to look closer to have something to really complain about.</p>
      <p>Chris, I'm just going by the designer's own admission here:<br>
      <a href="http://www.dafont.com/font-comment.php?file=zebra_110" title="http://www.dafont.com/font-comment.php?file=zebra_110">http://www.dafont.com/font-comment.php?file=zebra_110</a><br>
      See in particular the last comment (2/25/2010).</p>
