    html: |-
      <p>I was shocked to receive the invite to Chris Stern's show and eulogy at the School of Visual concepts for today, as I had seen him in October and had not a clue that he was ill. I'm so glad that Jules Faye, his wife and artistic partner, remembered me and that I was still on the Grey Spider Press mailing list.</p>
      <p>I had the pleasure of working with, and becoming friends with Chris, while working as a typographer with him in the mid 80's at Thomas &amp; Kennedy Typographers in Seattle. As desktop publishing took over the industry, he was inspired to move on to his true love: letterpress.</p>
      <p>I stumbled upon the press that he delighted in cleaning up and using for Grey Spider, in a damp, scary basement during the estate sale of a crazy local eccentric. It had it's perfect new home. I'm so glad that I braved lifting up the rubble, rat shit and tarp that covered it.</p>
      <p>Oh, man, I wish I had recordings of his late night tirades against the "bastardization of classic fonts", by graphic designers of the time! If you didn't know him, you would have either thought he needed to be locked up or you would have fallen in love with him, as so many of us did. He will be sorely missed. A true artist in his own right!</p>
      <p>Thanks for remembering him. _Steve Wells</p>
