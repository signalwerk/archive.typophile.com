    <p></p>
    <p>For the second time in a month we have lost a fine typographer. Chris Stern of Grey Spider Press in Sedro Wooley passed away last night after a short battle with cancer. He was 56 years of age. As he was to many, Chris was a good friend. His passion for the craft and in perticular the typefounding part of it was intense. He is survived by his wife, Jules, a sister in Seattle and a daughter.</p>
    <p>He was much too young to leave, and I'll miss his infectious chuckle and ready grin.</p>
    <p>Jim Rimmer</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
