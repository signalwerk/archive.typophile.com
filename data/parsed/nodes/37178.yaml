    html: |-
      <p>I totally agree with James and Gordon, what you need is just a typographic logo. You already have such a stunning typographic composition that you can use for the logo. Such as in version 2, apart from the legs illustration. The taglines placement should be flexible. But, you need to create a guidelines how to place the taglines, like the sizes comparison between the logo and the taglines, the line breaking in the taglines and the amount of spaces in between.  You could show them examples of the composition of the logo and the taglines, but remind them that it is depends on the applications. </p>
      <p>The illustrations should be use as the brand elements only not part of the logo. In this way, you could use the illustrations applied into different applications in more elaborate way, not just restricted with certain composition.  </p>
      <p>Just keep it clean and simple for the logo.  I am sure you will create a stunning visual identity.</p>
