    <p>Hi,</p>
    <p>I’m working on a logo for a communitarian fitness center and I would like to have your opinion. For those which do not speak French, the center’s name mean "Legs in the air". </p>
    <p>The center is opened to everyone, men and women, 16 years old and more.</p>
    <p>It is exercise on apparatuses as in a gym.</p>
    <p>Thanks for your opinions.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Propositions1_4139.jpg"></div><p></p>
