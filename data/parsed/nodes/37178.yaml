    html: |-
      <p>I think the legs in the air are dynamic, but I feel that it is a bit literal. The name is Legs in the air. And the image is legs in the air. What could you do that adds another dimention of interest to it or more information than just an illustration of what the words say? What if it conveyed more motion, showed team work, strength / empowerment developing over time, flexibility or ...?</p>
      <p>I agree with what James is saying about the configuration, as this looks more like an ad or illustration. When you see a bunch of logos together, say, on the back of a charity event T-Shirt or at the bottom of a poster, certain ones work because of their shape and proportions. For instance, if you sized down #1 or #2 to be on another application or with other logos, you would not be able to read the tag line at all. It can be a crazy shape, but generally if it fits inside some invisible boundaries, it will work on other applications such as business cards etc. better. </p>
      <p>I hope this is helpful.</p>
