      <p>That’s not a logo, it’s an advertisement. How is it supposed to work printed on a membership card, business card, or stitched onto a polo shirt? Or even just printed small on a busy page?</p>
      <p>The tag line needs to come out of the logo—otherwise there’s just too much type. If the client absolutely demands it stay, then you’re going to have to make a typographic logo—there’s just too much type to have it battling with dancing legs.</p>
