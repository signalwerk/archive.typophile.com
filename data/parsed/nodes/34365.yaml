  - id: 208037
    user: 110
    date: 2007-06-10T16:48:00
    date_raw: 10.Jun.2007 4.48pm
    votes: null
    html: <p>BTW These are not “fonts” as you might know them, but alphabets specifically designed for the stamping machines that make those plates. So if they have not been digitised afterwards — which is what happened with the FE-Schriften — they don’t exist as digital fonts. It’s another world entirely.</p>
