    html: <p>hmmm, i'm in no means an expert at this, but here's a bit of code i wrote trying to do something similar, except i only had 2 alternates for lower case letters that switched off with eachother. <br> <br>feature calt { <br>  sub @class0 @class0' by @class1; <br>  sub @class1 @class1' by @class0; <br>  sub @class0 space @class0' by @class1; <br>  sub @class1 space @class1' by @class0; <br>  sub @class0 space @UC @class0' by @class1; <br>  sub @class1 space @UC @class1' by @class0; <br>} calt; <br> <br>one thing in here is that i didn't make 2 variations of the space character, but wrote code to "skip over" the space character. This should work for your t_z lig too just make a class of characters that only have one form and place them in the code above where it says "space". But it's late and maybe that won't really work... <br>Also, it's too late for me to think this through, but what happens if you put the t_z lig in every set? <br>okay, i'll go to bed and let the pros sort out the confusion i caused in the morning. nite!</p>
