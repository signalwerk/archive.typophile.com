    html: <p>Yes, I could make 9 versions of the t_z, but that is one of 30-some ligatures that don't have 9 versions yet. So that's a bit of added work, and on a philosophical level it's not ideal for what I'm doing. But I think that's a very reasonable suggestion, and would save my brain a bit of work, if not my hands. <br> <br>As for including the t_z and other ligatures in every glyph class, I don't really think that would work. The OT font is not saying, "does t_z belong to SET_FOUR? ... yes". It's saying, "which class does t_z belong to? ... um, all of them?" So I don't think that will be the best solution in this case. <br> <br>Thanks for your feedback!</p>
