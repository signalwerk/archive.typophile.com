  html: "<p>This post really should be in \"Build\", but for some reason I'm not allowed to start a topic there. News to me. Anyway ... <br> <br>Hi everyone, <br> <br>I'm looking for a little bit of advice on a handwriting font I'm currently working on. The font uses contextual substitution to \"flip\" through a series of alternates for each glyph, much like LettError's Kosmik, if you're familiar with that. Instead of three variations of each letter, there are nine, but the idea is the same: a kind of controlled randomness (which really isn't random at all). <br> <br>In addition to the nine variations of each letter, some letters have up to three initial forms and/or up to three final forms. There are also quite a few ligatures, which themselves may have initial and final forms. The ligatures are always constructed of only two letters, no more. <br> <br>One last detail about the design of the font: it is unicase, so I'm converting all uppercase input to lowercase, for simplicity. <br> <br>**** Skip down to the next section if you already know how Kosmik works **** <br> <br>Here's how it works: <br> <br>First I ask the font to convert all of the letter combinations that will *always* result in a ligature (that is, there are at least nine variations of that ligature). These combinations are: en, er, ju, on, or, te, th, tt. This is contained in the 'liga' feature. <br> <br>Then I ask the font to begin swapping alternates, using the 'calt' feature. Each glyph belongs to a class of glyphs. There are nine alternates of each letter, so each of the nine glyphs gets put into a separate class. All of the \"default\" glyphs get put in the \"SET_ZERO\" class; all of the glyphs ending in \".alt1\" get put into the \"SET_ONE\" class; glyphs ending in \".alt2\" are put in the \"SET_TWO\" class, and so forth. <br> <br>My 'calt' feature says this: <br> <br># first, get rid of all that nasty uppercase stuff <br>\tsub @UPPERCASE by @LOWERCASE; <br> <br># then use the same method that Kosmik uses to \"flip\" through classes glyphs <br>\tsub @SET_ZERO @SET_ZERO' by @SET_ONE; <br>\tsub @SET_ONE @SET_ZERO' by @SET_TWO; <br>\tsub @SET_TWO @SET_ZERO' by @SET_THREE; <br>\tsub @SET_THREE @SET_ZERO' by @SET_FOUR; <br>\tsub @SET_FOUR @SET_ZERO' by @SET_FIVE; <br>\tsub @SET_FIVE @SET_ZERO' by @SET_SIX; <br>\tsub @SET_SIX @SET_ZERO' by @SET_SEVEN; <br>\tsub @SET_SEVEN @SET_ZERO' by @SET_EIGHT; <br> <br>So, if a user types \"mmmmm\", they will actually get \"m m.alt1 m.alt2 m.alt3 m.alt4\". This should be nothing new to many of you. <br> <br>Please note that the line: <br>\tsub @SET_EIGHT @SET_ZERO' by @SET_ZERO; <br>is omitted, because returning to the original set is understood implicitly. <br> <br>Every time the user types a glyph, the font looks back at the last glyph, figures out what class it belongs to, and uses that information to determine which variant of the next glyph to place down (at least, that's how I think of it). Even the space character is included in this merry-go-round (yes, there are nine variations of the space character). That way, typing \"yes yes yes\" won't result in the same three glyphs appearing over and over. <br> <br>**** This is the next section, welcome back **** <br> <br>Thanks for your patience if you've gotten this far. Now I'll try to describe some of the issues I've run across. <br> <br>In order for the flipping to work correctly, every single glyph needs to belong to one of the nine classes (SET_ZERO through SET_EIGHT). That way, when the next letter is layed down, the font knows which version to use by looking at the class of the last glyph. If there were a glyph that ended up on the page which did not belong to any of the nine classes, the next glyph would have no point of reference, and would default to the first variant of that letter. This could have the inconceivably catastrophic effect of the same glyph appearing twice within a relatively small proximity!!!! AAAAAAAAAAHHHH!! <br> <br>It's something I'd like to avoid. The problem is that not all of the ligatures have nine variations. I have a \"tz\" ligature that only exists in one form. I can easily write a lookup that says, \"whenever an 'a.alt5' is followed by a 't.alt6' and then a 'z.alt7', replace the 't' and 'z' with 't_z', unless it's at the end of a word\". And so forth. These specific cases are tedious, but simple to write, as shown in the Bickham Script feature file that Adobe released recently. <br> <br>But! The \"tz\" ligature must belong to one of the nine classes so the flipping can continue undisturbed. But there is only *one* \"tz\" ligature, and the classes used for flipping must each contain the same number of glyphs, or flipping is not allowed! <br> <br>It's the same case for initial and final forms: not all letters have three of each, but the glyphs all have to belong to a specific class, and the classes cannot have different numbers of glyphs contained within them. <br> <br>One way to simplify things would be to create the same number of alternates, initials, and finals for every single letter that can be typed with this font. That would eliminate the need to worry about differing numbers of alternates and specifying certain cases where they can and cannot appear. However, this is a handwriting font created from an actual handwriting sample, and making lots of extra letters and ligatures that are convincing is a non-trivial task. I'm willing to do it, if there isn't a way of resolving these issues with OT features. <br> <br>I'm hoping to work out all the OT features *before* cleaning up the auto-traced characters and tidying up the font, so right now the font is just a cesspool of mismatched character shapes and sizes and weights, with an external text file serving as my underground mad-scientist OT laboratory. <br> <br>If anyone has any insight, I would greatly appreciate it. <br> <br>Thanks, <br>Alan</p>"
