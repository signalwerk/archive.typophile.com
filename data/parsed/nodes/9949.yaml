e to avoid. The problem is that not all of the ligatures have nine variations. I have a \"tz\" ligature that only exists in one form. I can easily write a lookup that says, \"whenever an 'a.alt5' is followed by a 't.alt6' and then a 'z.alt7', replace the 't' and 'z' with 't_z', unless it's at the end of a word\". And so forth. These specific cases are tedious, but simple to write, as shown in the Bickham Script feature file that Adobe released recently. <br> <br>But! The \"tz\" ligature must belong to one of the nine classes so the flipping can continue undisturbed. But there is only *one* \"tz\" ligature, and the classes used for flipping must each contain the same number of glyphs, or flipping is not allowed! <br> <br>It's the same case for initial and final forms: not all letters have three of each, but the glyphs all have to belong to a specific class, and the classes cannot have different numbers of glyphs contained within them. <br> <br>One way to simplify things would be to create the same number of alternates, initials, and finals for every single letter that can be typed with this font. That would eliminate the need to worry about differing numbers of alternates and specifying certain cases where they can and cannot appear. However, this is a handwriting font created from an actual handwriting sample, and making lots of extra letters and ligatures that are convincing is a non-trivial task. I'm willing to do it, if there isn't a way of resolving these issues with OT features. <br> <br>I'm hoping to work out all the OT features *before* cleaning up the auto-traced characters and tidying up the font, so right now the font is just a cesspool of mismatched character shapes and sizes and weights, with an external text file serving as my underground mad-scientist OT laboratory. <br> <br>If anyone has any insight, I would greatly appreciate it. <br> <br>Thanks, <br>Alan</p>"
