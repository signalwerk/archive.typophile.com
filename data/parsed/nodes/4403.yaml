  - id: 32565
    user: 1215
    date: 2004-04-23T13:57:00
    date_raw: 23 Apr 2004 — 1:57pm
    votes: null
    html: <p>Dylan -- <br> <br>Naturally, I'm pleased with your choice. I hope Whitman behaves well and performs to your expectations. <br> <br>Incidentally, if you are still working in Quark, I have customized suitcases that I'd be happy to give you. They are modified to allow Quark to do its auto fi- and fl-lig substitution. They are also combined into two suitcases -- one for LF and the other for OsF -- and are style-linked for Bold and Italic.  <br> <br>Let me know and I'll send you copies. <br> <br>(That's one downside of the FB model which allows you to purchase individual styles and weights -- it means that you get delivered all these individual suitcases. As opposed to the very nicely combined and linked families from HTF, for instance.) <br> <br>If you're working in InDesign, then it's moot -- Indy will do f-lig subs anyway (but not the ff-ligs, because they're nonstandard FB encoding). And style-linking is screwed in Indy. It's a known bug. I don't know if they fixed it for CS. (Thomas?) <br> <br>-- K. <br> <br> <br></p>
    html_clean: <p>Dylan -- <br> <br>Naturally, I'm pleased with your choice. I hope Whitman behaves well and performs to your expectations. <br> <br>Incidentally, if you are still working in Quark, I have customized suitcases that I'd be happy to give you. They are modified to allow Quark to do its auto fi- and fl-lig substitution. They are also combined into two suitcases -- one for LF and the other for OsF -- and are style-linked for Bold and Italic.  <br> <br>Let me know and I'll send you copies. <br> <br>(That's one downside of the FB model which allows you to purchase individual styles and weights -- it means that you get delivered all these individual suitcases. As opposed to the very nicely combined and linked families from HTF, for instance.) <br> <br>If you're working in InDesign, then it's moot -- Indy will do f-lig subs anyway (but not the ff-ligs, because they're nonstandard FB encoding). And style-linking is screwed in Indy. It's a known bug. I don't know if they fixed it for CS. (Thomas?) <br> <br>-- K. <br> <br> <br></p>
