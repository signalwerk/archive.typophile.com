    html: "<p><i>&gt;This style-linking issue - I'm not aware of it, but I'm curious.</i> <br> <br>In Indy, you can only style type italic or bold (i.e., from the keyboard) when there is an actual designed version. This is, in general, a good thing -- no faked obliques or smeared bolds. <br> <br>But the bug is that with nonstandard family structures, Indy makes some weird decisions. So, for instance, with Whitman, if you're working with text in RomanOsF and then style a word to italic, Indy will make it ItalicLF. Then if you unstyle it by repeating the italic command, you'll get RomanLF. Or, under certain circumstances, you'll go back to SmallCapsLF. This sort of thing. <br> <br>I seem to remember that which fonts change to which varies depending upon how you have your fonts loaded (font management vs. system vs. Adobe app folders). Mark Record (FB tech guy) and I spent a bit of time trying to troubleshoot this until we finally realized it was a bug that we couldn't do anything about. <br> <br>And it's not just Whitman. I experienced the same problem with Frutiger (from Adobe). IIRC, Frutiger 45 (Light) went to 56 (Italic), then back to 55 (Roman) -- or something similar.  <br> <br>Bottom-line: the style-linking is screwy. Which is a pain for someone who does a lot of formatting from the keyboard or with tagged text. <br> <br>Thomas, glad to hear it's better in CS. I'll have to upgrade one of these days (just too lazy) and try it out. <br> <br>-- K. <br></p>"
    html_clean: "<p><i>&gt;This style-linking issue - I'm not aware of it, but I'm curious.</i> <br> <br>In Indy, you can only style type italic or bold (i.e., from the keyboard) when there is an actual designed version. This is, in general, a good thing -- no faked obliques or smeared bolds. <br> <br>But the bug is that with nonstandard family structures, Indy makes some weird decisions. So, for instance, with Whitman, if you're working with text in RomanOsF and then style a word to italic, Indy will make it ItalicLF. Then if you unstyle it by repeating the italic command, you'll get RomanLF. Or, under certain circumstances, you'll go back to SmallCapsLF. This sort of thing. <br> <br>I seem to remember that which fonts change to which varies depending upon how you have your fonts loaded (font management vs. system vs. Adobe app folders). Mark Record (FB tech guy) and I spent a bit of time trying to troubleshoot this until we finally realized it was a bug that we couldn't do anything about. <br> <br>And it's not just Whitman. I experienced the same problem with Frutiger (from Adobe). IIRC, Frutiger 45 (Light) went to 56 (Italic), then back to 55 (Roman) -- or something similar.  <br> <br>Bottom-line: the style-linking is screwy. Which is a pain for someone who does a lot of formatting from the keyboard or with tagged text. <br> <br>Thomas, glad to hear it's better in CS. I'll have to upgrade one of these days (just too lazy) and try it out. <br> <br>-- K. <br></p>"
