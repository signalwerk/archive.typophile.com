    html: "<p>Dylan -- <br> <br>Thanks for your private message asking about a sans complement for Whitman. I'm pleased that you're considering it. I thought I'd reply on the forum, since I get this question frequently. <br> <br>Pairing sans and serif is, I think, one of the most basic ways to create a sense of typographic style; and as such, it can be very much a matter of personal taste. So, don't take anything I say about this with any more weight than anyone else just because I designed Whitman.  <br> <br>Nevertheless, here are some pairings that I've seen or tried myself: <br> <br>Will Powers paired Whitman with Franklin Gothic Condensed in a book he did for MnHS Press. In general, I think anything along these lines -- Franklin Gothic, FB's Benton Gothic/Sans, Nick Shinn's Brown Gothic -- makes a solid companion. <br> <br>In my own work, I've paired Whitman with Vectora -- one of my favorite sans. It's a tricky combo if you mix them in line, since the x-heights are vastly different. But I like the forms together. <br> <br>I'm working on a how-to book right now for which I'm using Whitman paired with Gotham. I rather like it. I've also seen this combo used pretty well in a small startup magazine called <i>Revenue.</i> <br> <br><i>The Virginia Quarterly Review</i> pairs Whitman with Bliss to great success. <br> <br>A more unusual combo is Whitman with Cyrus Highsmith's Relay, used by a Finnish young women's style magazine, <i>Trendi</i>. <br> <br>I've also wanted to try pairing Whitman with FF Kievit. I think the neutrality of both would make a nice combination where transparency is desired. But I haven't found the right opportunity yet. <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/34154.gif\" alt=\"Whitman Pairings\"> <br> <br>HTH <br> <br>-- K. <br></p>"
