      <p>I work with other designers and different design firms and I’ve noticed this myself—but it varies from firm to firm (and city to city) and it might have something to do with experience. </p>
      <p>When I was at Chermayeff &amp; Geismar (47 years in the design business), it hardly ever happened—those guys knew what they wanted and were never afraid to experiment—one project would be Garamond, another in DIN, while we’re were doing a CI in Charlotte. One designer there did go through an Interstate phase, though.</p>
      <p>But at newer firms with younger designers, or outside NYC, I’ve noticed that not only will a designer stick with a typestyle over several projects, but everyone else in the studio will start using it (or similiar), too. Actually makes my job easier.:)</p>
