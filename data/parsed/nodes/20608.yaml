    html: |-
      <p>I think typefaces are a bit like clothing.</p>
      <p>Some kinds of clothing, like jeans, go with a lot of stuff. You can wear tennis shoes, loafers, boots, sandals or just go barefoot while wearing jeans. Pleated slacks aren’t quite so versatile. The same kind of thing occurs with typefaces. Some faces can be safely used with many other kinds of fonts without drawing reactions like, “dude, what were you thinking that day?” It’s just like that clothing comment, “you’re not going to wear that shirt with those slacks, are you?”</p>
      <p>I think playing it safe is the biggest source of one repeating himself. Of course, one may just fall in love with a particular typeface and just have to use on all sorts of stuff.</p>
