      <p>Agreed.   I find myself doing this and as Michelemiller suggests, im my case its to do with experience.  </p>
      <p>I mostly typeset lightweight trade ads for newsprint (so i guess it doesnt matter!) and find myself relying on a fairly solid set of 2-plate process colours, and more often than not i’ll set body copy in gill or officina sans with Univers or Gill Compressed, or maybe DIN for headings and Chaparral Italic for leadlines and accents. </p>
      <p>I’m sure this will change over time, as I become exposed to more styles and experiment more.  But for the meantime I think its okay so long as I’m aware.</p>
      <p>Maybe good typefaces are like like good wine, in that you dont start to appreciate the finer points of its characteristics until you’ve had the same (good) one a few times?</p>
