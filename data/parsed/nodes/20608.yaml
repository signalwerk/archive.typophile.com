    <p>Do you ever find yourself going through phases of using specific type styles/faces for almost every job you work on (for a while)? Same with colours etc.</p>
    <p>I do. Most recent is compressed sans serif for identities.</p>
    <p>Atleast I’m aware of it occuring, so will open up a whole new world through the awareness.</p>
