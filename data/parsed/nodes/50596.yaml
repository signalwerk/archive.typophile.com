    html: "<p>Here's a good if hard-to-parse response on this exact question from the ATypI list, when I asked about it last January. Victor Kharyk is a type designer and scholar of Cyrillic letterforms.</p>

      <p>He wrote:</p>

      <p>Look, if anybody, for example, ask here what is the form of Latin g -<br>

      you will answer:<br>

      \"it is a lot of forms relative to typestyles, history, different<br>

      national traditions etc\". The same is with Cyrillic letters, especialy with<br>

      ghe ang its sisters.<br>

      \ CAPS is the same in all \"Cyrillic Slavonic countries\" and Greece.<br>

      Roman-styled lower case is the same, exept modern Bulgaria (circa last<br>

      30 years), where \"reversed s\" is prefered (naturaly the direction of stress must be<br>

      corrected).</p>

      <p> Italic lower case have reversed s-form in all countries, exept Serbia<br>

      and Macedonia, where prefered form looked as i macron (and the<br>

      same with macron and acute together for Macedonian u0453)</p>

      <p> Ukrainian \"explosive\" ghe u0491 is relatively new letter and its<br>

      developement were stoped in soviet time, thats why research of its<br>

      forms not finish till now. There are some historical forms relatived to<br>

      some forms of Greek gamma (with long tale under the baseline)- this<br>

      form and its development seems good for \"quill tradition\", other<br>

      \"dropped pen tradition\" come in early 20th century (we can see it in<br>

      works of Georgiy Narbut) - this form used in modern school-books. New<br>

      form (reversed s with \"strich\" bottom left) was proposed few years ago<br>

      by Hennadij Zarechnjuk (Hennadiy Zarechniuk) from Lviv and also in use. It is mean that<br>

      italic form of this letter must be designed in every font relatively<br>

      to its style, as like as any other letter:)</p>

      <p>&gt;From my presentation in Helsinki:<br>

      (you got it also in goody bag)<br>

      <a href=\"http://www.ljplus.ru/img/v/i/viktor_kharyk/UL32.jpg\" title=\"http://www.ljplus.ru/img/v/i/viktor_kharyk/UL32.jpg\">http://www.ljplus.ru/img/v/i/viktor_kharyk/UL32.jpg</a><br>

      <a href=\"http://www.ljplus.ru/img/v/i/viktor_kharyk/UL33.jpg\" title=\"http://www.ljplus.ru/img/v/i/viktor_kharyk/UL33.jpg\">http://www.ljplus.ru/img/v/i/viktor_kharyk/UL33.jpg</a><br>

      <a href=\"http://www.ljplus.ru/img/v/i/viktor_kharyk/UL33a.jpg\" title=\"http://www.ljplus.ru/img/v/i/viktor_kharyk/UL33a.jpg\">http://www.ljplus.ru/img/v/i/viktor_kharyk/UL33a.jpg</a></p>

      <p>Best wishes<br>

      Viktor Kharyk,<br>

      Country Delegate for Ukraine :)</p>

      <p>(ps. bad English does not mean bad information :)</p>

      <p>Tuesday, January 22, 2008 you wrote:<br>

      TP&gt; Hey all you Cyrillic experts,</p>

      <p>TP&gt; In its italic form, does the ghe with stroke take the same \"reversed-s\"<br>

      TP&gt; shape as the regular (non-stroked) ghe?</p>

      <p>TP&gt; I would have thought so, but I believe I've seen some examples where the<br>

      TP&gt; ghe had this change to the reversed-s form but the ghe with stroke did<br>

      TP&gt; not.</p>"
