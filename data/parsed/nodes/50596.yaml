    html: |-
      <p>Hi Thomas</p>
      <p>Thank you very much, though I am not sure exactly what to conclude regarding ghe stroke, since this Viktor's answer is concerned with u0491 and not u0493.</p>
      <p>As I see it, there are two options: a) no final conclusion has been reached as how to draw this letter (either oblique or "reversed s") and therefore it is optional, or is it b) that the ghe stroke should follow the shape of ghe. In my case, a sans serif, I have a "reversed s" ghe and an oblique ghe upstroke. So I guess that, if option a is valid, I could go for the oblique ghe stroke without making Uzbek eyes sore...</p>
