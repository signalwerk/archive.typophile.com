    <p>Dear all (and especially those of you familiar with <a href="/wiki/cyrillic" class="freelinking" rel="nofollow">cyrillic</a>)</p>
    <p>Making italics for a typeface that contains the cyrillic letter ghe stroke, I am having difficulties finding any information on what the (lower case) italic version of this letter looks like.<br>
    Is it just a slanted version of the upright, or does it follow the rule of ghe (and in that case: how is the stroke applied), or is it something third?</p>
    <p>Your help will be deeply appreciated.</p>
  html_clean: |-
