      <p>The first things that stand out is that some of the character shapes follow other blackletter/antiqua styles, although to good effect.  Specifically those are the lowercase K, and X.  The K is normally based off the L, as you have it, but with a stroke the same height as the bar in the F, and an additional stroke above.  Certainly more readable to the modern reader how you have it, but I just point it out depending on your exact goal.  The R is often the basis for the X, simply with a tail.  Again, your version is far more readable, but depending on your goal...</p>
      <p>I really like the ascender terminals in the lowercase B, K, L, and H.  The descender on the Y I think could be a little bit more curvy, it seems too straight.  Often times the Y is more based on the H, but with an ascending left stem.  I tried copying and pasting your H descender to the Y, but since you have a relatively short descender on it it doesn't fit the style at all on the Y.</p>
      <p>Without a doubt your second Z is better.  The swash is great in the first one but just doesn't fit the letter for me.  It would make a nice swash for hyphens or other such things though.</p>
