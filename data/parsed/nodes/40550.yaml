      <p>Hey Charles, welcome to Typophile. I'm an '02 KU grad, CD of course. I'm not surprised to hear that there isn't anyone available to help you professionally at the school. My impressions were that it's a formula teaching school, not a concept learning school. So anything outside the curriculum is often approached as a independent study. A fellow student (Nicki Stager) had attempted to do a type face of her own as an independent study. She worked with Todd McFeely, who isn't exactly a type professional by any means, but he might be worth approaching.</p>
      <p>As for your work, it looks remarkable. You might want to try and create characters that aren't pieced together from other characters and some that are a single stroke, not a combination of multiple strokes (it's starting to look like a stencil version Fraktur.) Your line thickness is consistent, which is good, and your curves are elegant. </p>
      <p>You'll also need to consider spacing between the letters, I'd open it up a little, these seem a bit tight and with the broken look, make the letters blend together too much.</p>
      <p>Would you mind attaching your images using the "insert image" link on this site. You can add it to the original post if you click on edit and then insert image. This will help preserve the history of the post if something should ever happen to your Flickr page, or if you remove the image for the page.</p>
      <p>Good luck, this looks awesome and I would love to see what becomes of it. Are you planning to do uppercase letters or numbers also?</p>
