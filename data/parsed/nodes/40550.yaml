    html: "<p>Thanks for your compliments!</p>

      <p>I was happy with the support I got from The professor that oversaw my project (It was Karen Kresge) but it was new territory for the both of us and we both were guessing at solutions. I wasn't aware that Prof. Mcfeely did this before otherwise I would have asked him to oversee it for sure.</p>

      <p>I tried to attatch it as an image with the insert image but it said there was an error so that's why i posted the link. I will keep trying to get it on there.</p>

      <p>I think you are right about the pieces. When \x10I began it I thought part of the concept would be that my counters were open and that you could stencil it if you wanted so I broke it at each thin stroke. Now that I look at it I can see how the letters could curve better If they were fluid along those lines so I'm going to try that. also the f and the t (the only solid characters) seem very heavy and rigid to me and the t I feel doesn't fit the rest of the letters yet.</p>

      <p>I was trying to find the common strokes in the letter and use them to assemble the other letters. not out of laziness but because i thought it was correct. The y I know Is a disapointment In that regard I think I'm going to go back to the original shape if closing these gaps helps...</p>

      <p>I would love to do the uppercase and numbers to really finish it off but I think i still have a lot of work here yet. I can't do it quickly yet so be patient for an update...</p>

      <p>Thanks again</p>"
