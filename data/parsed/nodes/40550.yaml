      <p>It's a very nice beginning. I basically like Fraktur and just used it in a project. A decent program to create a font in is Fontographer: <a href="http://www.fontlab.com/font-editor/fontographer/" title="http://www.fontlab.com/font-editor/fontographer/">http://www.fontlab.com/font-editor/fontographer/</a>  and it works somewhat like Illustrator but it lets you test strings of characters and put in spacing – which is the second part of font design. But i would also close those characters and heavy up the hairlines in the "e" and the "z" just a bit.</p>
