      <p>I would recommend that you revert to the kerning in your previous post for the RO space it is so tight on the smaller version that the bowl of the R is almost touching. The angled stroke of the P and R seems to be a touch clumsy where the curve meets the straight it perhaps needs to be thicker.<br>
      Tim</p>
