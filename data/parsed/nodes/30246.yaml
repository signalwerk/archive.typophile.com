    html: <p>The distance between the P and the R is slightly too big as well IMHO, but do the spacing around the O first and see if it still is. Try squinting while looking at the logo and see if it "breaks up" into separate words, if it does, the letters where it breaks up are too far apart compared to the others. Also try turning it upside down, sideways, looking at it from at great distance etc., helps you see kerning problems.</p>
