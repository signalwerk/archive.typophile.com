      <p>Norbert,<br>
      Well done!  It has your touch of humor.<br>
      Frankly, I quit reading U&amp;lc about the time of the format switch. At the time, I felt it had run its course. I wish the book focused more on the earlier years when U&amp;lc was a real force in the industry.  I guess the editor felt he needed to focus on what he knew best (his own era) but I would like to see more from the Lubalin years when U&amp;lc was breaking new ground.</p>
      <p>ChrisL</p>
