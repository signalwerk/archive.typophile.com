      <p>Carl, those are good points and put well.</p>
      <p>However; and this is going to sound like forelock pulling... but I am pretty sure it's true so I will say it anyway. I think would rather read a novel set in Beorcana than any Garamond I know of. Partly this is because the gramonds I know are digital and probably 'lesser' in a variety of ways. Partly this is because Beorcana has optical weights available which is no small advantage. And also it's true that the relationships of ascender &amp; x height are more to my liking and probably more fashionable too. But finally, at least to me, it's just a better and more humane face. Put another way; when I am reading Garamonds I find my eye is just less accomodated than it is with Beorcana. Beorcana feel natural in a way that Garamonds can't match. And I don't think it's merely fondness etc. I think it's a case of being less visible as 'type' and thus doing the job better.</p>
      <p>Just in case anyone wants a gander ( Carl doesn't need to look I would bet... ) :</p>
      <p><a href="http://www.beorcana.com/specs3.html" title="http://www.beorcana.com/specs3.html">http://www.beorcana.com/specs3.html</a></p>
      <p>Obviously there are more reasons than sheer utility to consider. 'Voice' or style etc is important too. </p>
      <p>But anyway. That's how I feel today.</p>
