      <p>Personal opinion about Garamond -<br>
      Overused and Overrated.<br>
      The x-height is very low, much lower than other well designed serif typefaces, making it more difficult to read -- not easier. ITC increased the x-height, but not by any great leaps. URW redid ITC Garamond and even increased the x-height a hair more... but.</p>
      <p>Now Nigella - weren't you part of the bonfire party that burned all your vinyl Beatle LPs - back in the days when John Lennon said the Beatles were more popular that Jesus Christ? I swore that was you there.</p>
      <p>Meanwhile, back in NY two decades later, designers like Mike Stromberg and Tony Russo were using Garamond and Cheltenham on every masculine book cover you could think of. For a while there - if it wasn't for Mistral sneaking in to soften the look, you would have thought that was all mass paperback bookcovers had to offer in the way of type.</p>
