      <p>I don't think anyone sees Claude Garamond derivatives as exciting; they're just kind of baseline old-styles. Since the mature Garamond's intention in his romans was, I think, to produce neutralised, better cut and multi-size versions of the De Aetna type - even inheriting over-dark caps from a book for which Griffo had only finished his new design's lowercase - that characterisation goes right back to the originals. Garamond Premier Pro, at least in the roman, therefore seems inherently odd to me - it aims for the authentic character of a body of work that was meant to be unsurprising except in the competence of its production. In a sense, Sabon Next, with its almost masochistic neutrality, is the digital type truest to Garamond's intentions. </p>
      <p>But then I could be entirely wrong about this.</p>
