  html: <p>I hope I don't get a bashing for asking this, but what is so freaking great about <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a>? I mean, I know someone who goes to a design school, and they literally worship Garamond. I just look at it and go, "Great. That's a nice font." Personally, there are so many others I would prefer to use. I didn't go to design school so I didn't study all the history of the typeface and the intricacies of the typeface's bowl, stem, and whatever. I've read books about the typeface but nothing as interesting as they make it out to be.</p>
  html_clean: <p>I hope I don't get a bashing for asking this, but what is so freaking great about <a href="/wiki/Garamond" class="freelinking link-lost" rel="nofollow">Garamond</a>? I mean, I know someone who goes to a design school, and they literally worship Garamond. I just look at it and go, "Great. That's a nice font." Personally, there are so many others I would prefer to use. I didn't go to design school so I didn't study all the history of the typeface and the intricacies of the typeface's bowl, stem, and whatever. I've read books about the typeface but nothing as interesting as they make it out to be.</p>
