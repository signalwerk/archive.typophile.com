      <p>Nick Shinn put it quite well. Garamond has become pedestrian in a sense, for the simple reason that it was so successful. It enjoyed such wide use and became the basis for so many offshoots and revivals and such, that today it seems boring due to its ubiquity. </p>
      <p>Sabon Next, hwever, is a work of beauty. It is a much warmer, richer Garamond (or garalde?), and the ornaments, ligatures, and swashes that come with it make it a typeface that is not only beautiful without being gaudy, but also quite versatile.</p>
      <p>And then you have Bembo Book . . . not much in the way of swashes and ornamentation, but since when did Bembo need any?</p>
