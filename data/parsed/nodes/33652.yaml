      <p><a href="http://www.beorcana.com/specs3.html" title="http://www.beorcana.com/specs3.html" class="link-external">http://www.beorcana.com/specs3.html</a></p>
      <p>Obviously there are more reasons than sheer utility to consider. 'Voice' or style etc is important too. </p>
      <p>But anyway. That's how I feel today.</p>
