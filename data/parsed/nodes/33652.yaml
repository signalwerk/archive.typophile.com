      <p>Wasn't the amazing thing about Claude's types that they were exquisitely cut? Seems to me that no types had been so balanced, nuanced, graceful and even-textured before. At the time this would be a major feat since every punch was hand-cut. Since we have infinite control over outlines now, this doesn't impress us, and we have literally thousands more types to choose from, so the presence of even a very true Garamond among them also doesn't impress us. There are so many types to choose from, many of them variations on Garamond, that Garamond has become a genre itself. The times are very different now. And our idea of what is beautiful and even-textured has evolved. For instance, in Garamond's time there weren't a slew of humanist sans designs to choose from, or even any sans designs to select from.</p>
      <p>Really, Garamond (the genre) is a very sturdy and readable kind of type, so it's had longevity. That long life is one reason it's admired.</p>
