      <p>You're in a restaurant and they're playing a jazz singer from the 1930s.<br>
      Guess what, it's Billie Holiday.<br>
      Time distills culture, and certain works become representative, far more so than they were at the time.<br>
      Of course, it's because they're the most excellent and significant, it has been argued, but this institutional process of criticism is just the mechanism which creates Lotka curves of hypertrophied popularity.<br>
      "Garamond" (/Jannon) is not really a typeface in the way that Futura is. Garamond has come to represent traditional typographic form, type's first three and a half centuries (with a nod to Jenson and Griffo at the begining and Caslon at the end). It is the quintessential oldstyle face, and in as much as Western culture has durability, Garamond embodies that quality.</p>
