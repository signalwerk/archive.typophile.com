    <p>Hey all! Was wondering in you can give me some feedback on this nameplate I'm designing for a monthly news letter for a public library system. This is not a final version, it still needs work but it is the general direction I'm headed to.<br>
    Any suggestions?</p>
    <p>I was thinking something purely typographic that will in no way rely on cliched book imagery.  I thought the lowercase 'k' and 'd' would serve to illustrate bookends and also serve to describe the diversity in reading material through different case settings. Does this make sense? Anywho, would greatly appreciate any critique.</p>
    <p>Ivan</p>
