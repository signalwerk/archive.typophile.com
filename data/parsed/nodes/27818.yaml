    html: |-
      <p>When I said, "contrast in scale," I was referring to the size difference from the word "bookends" to the sentence.</p>
      <p>If you shorten the ascenders anymore than they are you will eliminate some legibility as you are already interrupting the legibility by putting words in between them.</p>
      <p>If the books are donated, I think the phrase "from the friends of" is very nice and you should use it.</p>
      <p>You could also try using a lowercase b at the beginning and switch the k to be a unicase K and then have that additional space for the friends of to breathe a little more. While you are at it, does it have to be bookends? I guess you'd usually find two and so the need for plural, but if you made it singular you would have bookends implied by the ascender of the b and the d.</p>
    html_clean: |-
