      <p>I'm all for contrast in scale, but I think this is a little too much. The concept is fun, but I think it needs a little more work. </p>
      <p>One idea would be to break the second smaller line so all three lines read:</p>
      <p>From the friends of<br>
      BERKS COUNTY<br>
      PUBLIC LIBRARIES</p>
      <p>You could then play a bit more with the ascender height of the _k_ and the _d_ and at the same time enlarge the type of the smaller text.</p>
