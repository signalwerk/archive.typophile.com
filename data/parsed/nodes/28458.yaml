    html: |-
      <p>Camingo has a lot of nasty little attention getters that bug me. For example:<br>
      - There's too much flourish in the descender of f. I love f with a pretty descender–I make my handwritten f descenders so crazy that my notes are often illegible. But it doesn't fit with the rest of the letters.<br>
      - The A is gross–the internal and external apexes are too close–it's annoying. It's worse on the bold weights, where it looks like a little white triangle fighting for freedom.<br>
      - Why are the outer vertical strokes of the M diagonals? It's like the M from Lithos snuck in when nobody was watching.</p>
      <p>I could stay up all night nitpicking at the letterforms in this one. I'll just keep using Unit instead.</p>
