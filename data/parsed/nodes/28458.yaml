    <p>I was checking the new releases on myfonts yesterday and found <a href="http://www.myfonts.com/fonts/jan-fromm/camingo/" rel="nofollow">Camingo</a>. Any thoughts on this? Has anyone used it? I bought ITC Tabula a while back and have been disappointed (I should have bought Section from Village). But this has a similar geometric structure that I am drawn to, but is more subtle. Considering this was designed by a student of Lucas de Groot I am a bit more confident that it will be a well-made typeface. Just wondering what your thoughts are.</p>
      <div class="forum-topic-navigation clear-block">
              <a href="/node/84563" class="topic-previous" title="Go to previous forum topic">‹ How many of those "extended" characters do you really need?</a>
