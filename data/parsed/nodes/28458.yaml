    html: |-
      <p>The genre of sophisticated square sans faces, where squareness is integrated into a conventional sans effect by subtle drawing, has come on strong since I investigated square types in a magazine article, <a href="http://www.shinntype.com/Writing/Hip2BSqr.pdf" rel="nofollow">Hip 2B Square</a>, 10 years ago </p>
      <p>Dave Farey's Cachet was one of the first of this new breed, IIRC, and may even have been released when I wrote the article, but I didn't anticipate the way things would develop enough to mention it. In fact according to Dave, squareness wasn't the main theme of Cachet.</p>
      <p>A lot of ideas that were raw ten or 15 years ago have been cooked up nicely.</p>
