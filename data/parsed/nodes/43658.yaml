      <p>The answer to your original question is no. No one can give a scholarly definition of “type size.” What a scholar could do is chronicle all the different ways the term “type size” has been used. It would be a longish chronicle.</p>
      <p>BTW, the digital era is from 1990 to 2008 — or, if you include the likes of the Linotron 202 in “digital” as opposed to “photocomp,” the mid-1960s to 2008. Even 48 years covers only about 10% of the period of “movable type” in the west, and that ignores China.</p>
