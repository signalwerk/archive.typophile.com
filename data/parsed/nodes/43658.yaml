      <p>This is implied by David’s excellent explanation, but I wanted to further emphasize that the notion of “point size” which you refer to, should not be considered an absolute measurement. The only true absolute measurement within a font is the pixels per em size (ppm).<br>
      You can request 10 point type, but the number of pixels used to represent the height of the capital “H” will still vary, depending on whether you’re displaying 10 point on a 96dpi display, a 72dpi display, a 600dpi printer, etc etc. The ratio of the em square to the cap height (and other height zones) within the font will remain roughly the same in each of these scenarios, but it won’t be exactly the same. This is mostly due to the effect that hints can have on glyph height zones. </p>
      <p>There are 2 factors that determine the exact ratio of height to em square, displayed ultimately as some number of pixels. First, the outline is scaled, as David described, by scaling the height of the font (which could be derived from several different values, but that’s a complication for another discussion), with the outlines scaled proportionately. Then hints are applied. Remember that hints are specific to a ppm size not a point size (since they need to be related to an absolute value.) You could potentially have hints within a font that nudge x heights, cap heights, descenders, etc, by X number of pixels at Yppm size. This will normally only happen at display sizes, but could happen at up to 72ppm.</p>
      <p>Hmm, I suppose you’re sorry you asked by now! But this might help explain why you may see variations in cap height to x height ratio, or cap height to em square ration, at different smaller point sizes.</p>
      <p>thanks,</p>
      <p>Jason C</p>
