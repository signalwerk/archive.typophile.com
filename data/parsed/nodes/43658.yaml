    html: <p>The classic definition is the distance from ascender to descender, with the caveat that real fonts don’t necessarily conform to this. When fonts were metal, it was the height of the slug. Sometimes there would be a little more room on the top and bottom, by design or by necessity. The software equivalent of that block of lead is the em consisting of 1000 units. Type is sized according to that em, relative to which all the glyph outlines are drawn. If the type designer draws the glyphs smaller relative to the em (possibly out of a worry that diacritics on capitals could collide with descenders at zero leading), a 10pt setting of it will look smaller.</p>
