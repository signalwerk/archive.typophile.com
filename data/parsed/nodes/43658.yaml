      <p>Uli, I don’t think it is possible to come up with a scholarly definition of <em>type size.</em> The phrases you listed are not specific enough to be defined in any absolute way. Forty years ago when I started messing about in type, the meaning was pretty clear. It was whatever read-off my line gauge when I hooked it over the top edge of the piece of metal I had in my hand.<br>
      Body size, cap height, and x-height all refer to something specific and unambiguous. However, today type size and point size do not. Type size is whatever you choose to measure and point size is that something measured in points. Although, generally speaking, the terms you asked about refer to the notion of body size, where body size is understood to be the native (unleaded) vertical measurement of the font including, in the case of metal type — which is the only place such measurements make any sense at all — all glyphs/strokes/elements that will be set from that singular font. Here font refers to a set of mechanical pieces used to produce printed letters of one style and a pre-determined system of vertical alignment and lateral spacing of those glyphs/strokes/elements.<br>
      Two years ago, I asked a similar question about why on earth when some digital fonts are set solid do descenders collide with ascenders of the subsequent line. I received an answer that included the phrase “large on the body,” which I understand as a possible reality in type setting, but fail to understand as a desirable aspect of a system for the reproduction of letters.<br>
      Thus, any definition of <em>type size</em> will depend on whether you are talking about the system to control the size of the letters to be produced, the letters produced, or even some part of the letters produced. Take your pick and stick with it.</p>
