      <p>&gt;In my view, such notions do not make sense for non-American fonts.</p>
      <p>In digital fonts ’large’ or ’small’ on the body is just a question of how the glyphs are scaled in relation to the em. ’Larger’ or ’Smaller’ is in comparison to other fonts in a similar script. It is not a matter of the nationality of the designer. It is true that many fonts today have the height of the A ring or A circumflex greater than the em—a common recommendation is that the total of highest and plus lowest points are up to 20% greater than the em. This is based on the default leading in many applications, including Microsoft Word. <a class="freelinking-external" href="https://web.archive.org/web/20081013234931/http://typophile.com/node/13081">See this</a> for a detailed explanation. </p>
      <p>Therefore many digital fonts will not set solid without clashes in the diacritics—they often need something between solid setting and 20% leading to keep the highest diacritics clear of the above line of text. Some script fonts have swashes that greatly exceed the em—by more than 20%.  </p>
      <p>You seem to want all fonts scaled on the em so that they can set solid, as was the case with metal. But what is so sacred about setting solid? If you rescaled the font by 80% in font software, regenerated it, and put the point size in the application 25% larger you would get the same result. Isn’t what matters what is on the page or screen?</p>
      <p>&gt;it is no longer possible to “set solid” (e.g. 10 on 10 point) without time-consuming experiments.</p>
      <p>If you don’t want time consuming experiments, you can’t set type well—at least not without a lot of experience, which amounts to the same thing. Fonts, whether in metal or film or digital, have never had the same apparent size at the same point size. This has to be taken into account by the designer wherever you are in the world.</p>
      <p>&gt;Is the font depicted here “large on the body” or “small on the body”?  </p>
      <p>You can’t answer the question of how big a font is on the body by one line. It doesn’t matter whether the font in question is latin, greek, arabic, and indic script or whatever. But you can answer by looking at it in font software, or by setting it on successive lines with highest and lowest extending characters—provided you know what rules your application software follows. And the question does make sense in any script. It doesn’t matter whether the designer is American or German or Indian. The question is the scale of the glyphs relative to the digital em.</p>
