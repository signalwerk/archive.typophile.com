      <p>Type size at output is controlled by two factors. </p>
      <p>One is the relationship between the glyphs and the em square, the default space upon which all glyphs of all fonts are defined and positioned. This definition and positioning of glyphs at a single scale, is done by the type designer, so that all output of a given size of a font will be compatible across all glyphs. </p>
      <p>The other factor is the size input by whatever method is offered to the user, so that the user may control the size(s) of the output. The first factor is non-standard, or, not all font families share the same relationship to the em square. The size relationship to the em square should, however, be standard across the styles of a family. The second factor has multiple standards, but the predominent one is the point system, (72.289, or so, to the inch). </p>
      <p>This second factor allows the user to define consistent measure from baseline to baseline between any two fonts of the same size and leading, regardless of the first factor, or size on the em. But the first factor often causes baseline to cap height, e.g., variation within the same point size across font families.</p>
      <p>From the energetic use of the two factors, both confusion and completness are found, somewhere.</p>
      <p>Cheers!</p>
