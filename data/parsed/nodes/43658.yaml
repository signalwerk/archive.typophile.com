      <p>Mr. Bergson:</p>
      <p>&gt; Word. See this for a detailed explanation.</p>
      <p>The “Update to the update to the update” clearly shows that the “vertical metrics” is a mess. Even Apple and Microsoft application programmers do no longer know what is meant by what metrical values.</p>
