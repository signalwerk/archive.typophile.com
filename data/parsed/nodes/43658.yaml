      <p>&gt;the “vertical metrics” is a mess.</p>
      <p>I agree. This mess seems to be a legacy of the old ’font wars’ with different standards for Windows, Mac, PS1, True Type, and now open type. I understand that such messiness is typical in the software industry. </p>
      <p>&gt;Could you please give a concrete numerical example for what you mean by “digital em”?</p>
      <p>The font contains a number called the “font upm value”. In Font Lab you can navigate: Font Info/ Metrics and dimensions/ Font UPM Value. It is commonly either 1000 or 2400. Thus the em is really a unit of measurement within the font such that ’one em’ is either a 1000 units or 2400 units, and the nodes, handles and metrics of the font are specified in terms of whole numbers of these units. </p>
      <p>What is confusing here—to me at any rate—is that the digital em is not defined as a box going from one place to another in the glyph window. You can’t say “the em in this glyph starts here and ends here,” as you could in foundry metal type—it was generally just the height of the metal slug. </p>
      <p>But in fonts the ’em’ is just a unit of measurement. The ’em’ isn’t a thing that starts at the lowest descender and goes to the highest point in the tallest character. That’s got another name—’bounding box’ I think, but I’m not sure. And the ’bounding box’ may measure more or less than one em—and thus be “bigger or smaller on the em.” It would really be better to say “bigger or smaller as measured in em units.”</p>
      <p>What happens that complicates things is the different applications may define the ’top’ of the font differently. For example, I think Adobe puts the top of the text block at the ascender height. But another application might take the cap height or the highest point in the font. </p>
      <p>What all applications are *supposed* to do, anyway, is to make it so that if you specify the font size at ’12 point’, and specify the leading as zero points, then when you print it out, it should physically be 1/6 of an inch from baseline to baseline on the paper. </p>
      <p>So that’s what the ’em’ really is: it is an instruction to scale the output so that the ’em’ as defined in the ’upm’ value is printed out at the correct physical point size as internationally defined.</p>
      <p>Thanks, I think I now understand this myself!</p>
