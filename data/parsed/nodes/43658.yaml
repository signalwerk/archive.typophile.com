    <p>A text typeset in 9 on 10 point using font A may look, as if it were identical with the same text typeset in 10 on 10 point using font B. This phenomenon is exemplified by me in this document:</p>
    <p><a href="https://web.archive.org/web/20081013234931/http://www.sanskritweb.net/temporary/helve90.pdf" title="http://www.sanskritweb.net/temporary/helve90.pdf">http://www.sanskritweb.net/temporary/helve90.pdf</a></p>
    <p>Who can give a scholarly definition of the notion of “type size” (or “size of type”, “font size”, “point size”), taking into considering this phenomenon as exemplified above.</p>
