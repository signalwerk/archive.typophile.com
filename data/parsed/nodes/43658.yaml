      <p><cite>“Two years ago, I asked a similar question about why on earth when some digital fonts are set solid do descenders collide with ascenders of the subsequent line. I received an answer that included the phrase “large on the body,” which I understand as a possible reality in type setting, but fail to understand as a desirable aspect of a system for the reproduction of letters.”</cite></p>
      <p>1)</p>
      <p>That nobody can supply a satisfactory definition of “type size” is due to the fact that the digital font formats (PS Type 1 etc.), have been primarily developed for American font users only with the consequence that, for instance, nowadays in European languages (French, German etc.), it is no longer possible to “set solid” (e.g. 10 on 10 point) without time-consuming experiments.</p>
      <p>see <a href="https://web.archive.org/web/20081013234931/http://www.sanskritweb.net/temporary/solid.pdf" title="http://www.sanskritweb.net/temporary/solid.pdf">http://www.sanskritweb.net/temporary/solid.pdf</a></p>
      <p>2)</p>
      <p>Are “large on the body” and “small on the body” also applicable to non-American fonts?</p>
      <p>see e.g. <a href="https://web.archive.org/web/20081013234931/http://www.sanskritweb.net/temporary/body.gif" title="http://www.sanskritweb.net/temporary/body.gif">http://www.sanskritweb.net/temporary/body.gif</a></p>
      <p>Is the font depicted here “large on the body” or “small on the body”?</p>
      <p>In my view, such notions do not make sense for non-American fonts.</p>
