      <p>Uli, what I think may be puzzling you is that a face may be ’large on the body’ or ’small on the body’. In the case of metal type this meant the height and depth of the type relative to the vertical dimension of the metal slug. </p>
      <p>In the case of digital type, the ascender of the h + descender of the g may be less than the digital em. And the height of the A ring, for example, may take the extremes of the characters beyond the limits of the digital em. </p>
      <p>It looks like in your examples of Helvetica 90 and 100, these are simply scaled differently in relation to the digital em. Then boosting the point size and reducing the leading in your application program can get the size and leading of the 90 and 100 to match. As David explained, the final result comes from the combination of the inbuilt size together with the user specified size. </p>
      <p>If you look at it in a font making program like Font Lab, it will take the mystery out of it. You will see how the upm is defined (typically 1000 or 2400), and where the character outlines fall on the grid. Your application program will interpret the character point size and leading—distance from baseline to baseline—according to the user specification of the upm and baseline.</p>
