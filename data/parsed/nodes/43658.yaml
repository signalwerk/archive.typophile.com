      <p>“Both “Helvetica” words on the last page are congruent, i.e. have the same mathematical size and shape, but they are typeset in different point sizes. “</p>
      <p>Thank you for the example. I think the terminology you are using in describing the phenomenon you see, is backwards. I would say, both samples are typeset in the same point size, but they do not have the same mathematical size and shape. You might also say, the two samples were set at the same mathematical point size, but are typesetting at different sizes. </p>
      <p>In this particular instance, it might be assumed that URW, who produced Nimbus, decided to scale the whole face to fit the accented uppercase into the Em, a common practice, and the first kind of sizing I mentioned. </p>
      <p>“The only true absolute measurement within a font is the pixels per em size (ppm).”<br>
      You are heading out of type space and into device space though it counts eventually, this issue, is size measurement across fonts. </p>
      <p>Cheers!</p>
