    <p>Hi all,</p>
    <p>is there any known design studio, I could immagine in Paris, that is specialized in doing custom made font elaborations for fashion logotypes for perfume packaging and so on? I mean often you see special refined things done by the great masters of fashion industry Armani, Valentino etc. and I wonder who is doing it. Is there THE ONE studio somewhere?<br>
    I know Bianco&amp;Cucco (formerly I think) at Milan. And then there is Baron but I heard something vague about a specialized studio for packaging in Paris. Maybe they do something like this also. But I don’t recall its name.</p>
    <p>Thanks for information<br>
    Stefan</p>
