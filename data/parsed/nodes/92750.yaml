    html: <p>I claim no special expertise, but I am reasonably confident that what <em>appears</em> to be the problem is not the real problem. Feature coding follows the same format as CSS coding. CSS code ignores irrelevant spaces, so I imagine feature coding would as well. Some other bad juju must be at work…</p>
