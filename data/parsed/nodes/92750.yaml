    <p>On a Mac running 10.6.8 and FontLab Studio 5.0.2, after a system restart yesterday began to see very bizarre behavior in the OT features panel. It's hard to describe, but the OT panel seems to be inserting extra spaces into all the text in the OT panel, so that nothing compiles correctly, and clicking on any of the text or typing causes more extra space to appear to the left of the cursor. In other words it's impossible to format correctly, because any action I take just creates more bizarre spacing. I cannot edit, add, or compile OT features.</p>
    <p>I went and upgraded to the newest version of FontLab, 5.1.1, and the problem stays the same. Don't know if the problem is with FontLab or the computer itself, but the keyboard and trackpad seem to be behaving normally in all other applications. </p>
    <p>I used Screen Record to make a movie of the behavior, but it's much too big to post. Has anyone seen this behavior before or have any ideas?</p>
