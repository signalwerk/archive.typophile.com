      <p>Are you sure it's inserting spaces as opposed to simply *displaying* extra space?</p>
      <p>When I first switched from FL4 to FL5, I found the OT panel to be completely unusable due to bad spacing/extra space issues which resulted in the cursor's apparent and actual positions not matching; I quickly discovered the reason for this -- they'd changed the default font for the OT panel to Courier New which I did not have installed and apparently it doesn't have an effective fallback mechanism.</p>
      <p>Try changing the font in preferences-&gt;general options-&gt;fonts-&gt;python and opentype editors.</p>
      <p>If you're seeing the same problem which I remember, it's possible that your compilation problems are the result of some inadvertent editing (a carriage return in the wrong spot, perhaps) which occurred while the spacing was screwy.</p>
      <p>André</p>
