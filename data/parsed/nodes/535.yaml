    html: "<p>Hmm... thanks BJ. Went back and examined a bunch of faces:  <br>Myriad, Frutiger, Adobe Garamond, Sabon. The width of the  <br>n and u are almost exactly the same. <br> <br>I think I remember seeing something on this subject at the <br>Underware site. But when I went back it looked like they  <br>had taken it down. 10% is probably a bit much. Even in  <br>these cases where they are exactly the same the result is  <br>that the u looks optically wider. Bear in mind, I don't  <br>pretend to know more than Frutiger, Tschichold, Slimbach  <br>and Twombly.  <br> <br>Regards, <br>Randy</p>"
