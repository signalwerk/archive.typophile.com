    html: <p>I'd like to see a version of "b" without the tail/spur, to distinguish it from the "d". You might try leaving it rounded, or bringing it to a subtle corner instead of using a spur or a tail. <br> <br>Also, whatever solution you use for "h", "m", "n", "r" and "u" should harmonize with the "y", at least in the form you have chosen for it. <br> <br>I would also suggest shortening to top end of the "s" slightly, to avoid the appearance that it is about to fall over to the right. <br> <br>I'd be curious to see what roman serif faces this design might complement. It seems to me to be a fairly original sans serif design. I'm excited to see what you can do with it. <br> <br>David</p>
