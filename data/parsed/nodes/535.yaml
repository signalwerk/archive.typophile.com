    html: <p>Jim, I think you may have taken a step backward here, or maybe you're just evolving the face in a direction that doesn't suit my personal taste.  <br> <br>I preferred the tail-less b, h, i and spur-less g. (The t is too tall, but that looks like it might be scaling mistake, not a design decision.) I also miss the flared join that you used on the m, n and u. (The new m is kinda homely. Consider using a common approach on both arches.)  <br> <br>Finally, the descenders on the g and y seem too deep for the shortish ascenders.</p>
    html_clean: <p>Jim, I think you may have taken a step backward here, or maybe you're just evolving the face in a direction that doesn't suit my personal taste.  <br> <br>I preferred the tail-less b, h, i and spur-less g. (The t is too tall, but that looks like it might be scaling mistake, not a design decision.) I also miss the flared join that you used on the m, n and u. (The new m is kinda homely. Consider using a common approach on both arches.)  <br> <br>Finally, the descenders on the g and y seem too deep for the shortish ascenders.</p>
