    html: <p>&gt; the u looks optically wider <br> <br>Yes, and that's because the tops of letters bear more weight. And of course in a serif face the inside has two half-serifs in the "n" but only one in the "u", and that amplifies the effect. <br> <br>If somebody has made the counters of the "n" and "u" mathematically the same, it means he's either oblivious to this optical issue... or he simply wants the "u" to look wider! <br> <br>hhp <br></p>
