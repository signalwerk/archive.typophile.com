    html: "<p>Hi Jim, <br> <br>some little things come to my eye seeing your font: <br>- In all the ascenders are diagonally cut of at the top. Why not do the same with the 'L'? <br>- the lower part of the 'e' could be a little shorter. Like this it optically gives you the feeling of 'falling backwords'. (*Maybe* then you could keep the tilted bar??? I kind of liked it.). The same goes for the 'c'. The lower part just a little shorter. (blue arrows) <br>- the 'a' is now the only glyph with a tail. Why not remove that also? This optically makes the bulb a little bigger. That also benefits the readability. (yellow arrow) <br>- I would think about making the dots on the 'i' and 'j' a little less higher. Keeping them under the body height doesn't optically stretch those glyphs too much.  <br>- the 't' looks a little bit to unsofisticated, 'simple'. you should try to get a little more character in there. <br>- Can it be that the 'x' is too thin compared to the oter glyphs? You also have to optically correct the center of it, where all the legs come together. Try looking for other fonts. There you will see that those legs don't really meet in the middle. But optically they seem to do so. <br>- Maybe it's the display, but the 'n', 'u', 'v', 'x' seem all a little too thin to me. <br>- Last but not least. It looks like the round parts are half circles. Maybe you could just take the symmetry out of them by pushing one side a little bit out (look for the red arrows). By doing that they will look a little bit more like the 'b' and 'd'. Because they have a little straight part in their bulb, the tend to look more squared. I think you want it to look a little bit squared, so try to force the glyphs to do that. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13539.gif\" alt=\"Corrected\"> <br> <br>Phoei, that took me some time to write that out. I hope this makes sence and will help you a little farther on the way.  <br>I like the font and would like to see it ready. I'm very curious about your numbers. <br> <br>Regards, <br>Ren</p>"
