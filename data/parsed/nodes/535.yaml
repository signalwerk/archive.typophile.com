    html: <p>Hi Jim, <br> <br>I like the basic idea, but I think you are using two different styles. The 'a h m n y' are a little flattened on the top and/or bottom and have a very nice serif. But with the 'b d g p q' you use a different kind of serif. Perhaps you should try to use the same serif style. <br>I would also remove the lower serif on the 'q'.  <br>I can't really see if the serifs have a pointy or block end. I kind of like the look on the 'n'. But I see that the 'm' has a block-end serif (does this make sence? My English is rosty). <br> <br>How about serifs like this? <br><img src="http://www.typophile.com/forums/messages/29/12598.gif" alt="Richmond serifs"> <br> <br>Keep it up, I think you're on the right way. <br> <br>Ren</p>
