      <p>Typodermic, first: I agree with you, established font category schemes are AGES behind.<br>
      Example: Myfonts. </p>
      <p>To simply tag the fonts is not the solution. </p>
      <p>I guess, nothing will happen until a case can be made for better categorization increases finding and sales.</p>
      <p>A sensible categorization for the future would have to be, in my opinion, two- or three-dimensional. That means, one can combine a feature 1-“Venetian” with a feature 2-“florated” or 3-“shaddowed” and so on. Perhaps it would only work (for searching = finding = sales) when fonts get tagged systematically and not arbitrarily. *Inside* the font info data, possibly.</p>
      <p>If one looks for, e.g.: “a blackletter connected script Greek” – you’re lost.</p>
      <p>Has anybody an overview about what has been done in this respect during the last ten years?</p>
      <p>How big is the interest of font producers to work out and agree upon a new categorization scheme?</p>
