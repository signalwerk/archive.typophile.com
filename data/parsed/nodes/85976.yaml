      <p>I don't know if categorization is important to everyone else. What I've always found frustrating is since they stopped making new font categories the 20th century happened and hundreds of new categories blossomed. I don't know what makes a font category. Some fonts are so special, that nothing comes close to them. It doesn't happen much these days but in the 20th century new font categories happened a lot.</p>
      <p>If I treat a font as a category it means nothing to anyone else. As far as most people are concerned it's a tribute, knock-off, "inspired by" or whatever you want to call it. You think I'm making a tribute to Stop, in my ad copy I tip my hat to it. But in my mind, I'm just making a Stop. In my mind Stop is a category like a clarendon. When I think about Stops, I not only consider the original Stop but all the other Stops I've seen in my life. The way graffiti artists interpreted it. The way it was incorporated into the square sans (Roland). Amiga intros: lots of Stop influenced fonts there. And, as I mentioned, in Japan, Stop wormed its way into the visual culture and it fed back into western techno culture.</p>
      <p>Nick: damn, I just lost 10 font geek point because I have no idea. But I ended up finding this which is fascinating.</p>
      <p><a href="https://web.archive.org/web/20150123211713/http://jvedesign.posterous.com/amelias-adventure-by-luc-devroye-cat-daughter" title="http://jvedesign.posterous.com/amelias-adventure-by-luc-devroye-cat-daughter">http://jvedesign.posterous.com/amelias-adventure-by-luc-devroye-cat-daug...</a></p>
      <p>They must still sell a shitload of Amelia. Those were different times and font piracy, like doing tons of coke, was super cool. Yet those crap versions still persist.</p>
