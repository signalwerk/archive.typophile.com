      <p>Too often, I see classifications that seem odd or even wrong to me.  It seems as though classifications have noting to do with what the designer had in mind and more to do with whatever the person doing the categorization seems to feel is important.  I think I will just make stuff and not bother giving it a category.  If someone else later puts it in a category, I am fine with that as long as I don't have to be involved in the nit picking arguments that come with such a chore.</p>
      <p>In his day and age, their is technology that can figure out much of the "what is this thing" problems.  My only problem is assigning search terms or meta-data that will help a person find my type if it fits their needs.  I can't be sure I have covered the correct bases to make a reasonably intelligent search. When I have gone to a vendor like MyFonts and typed in search criteria, I am often amazed at what shows up!  I look at faces out there which I think are capable of doing the same kind of job as faces I am working on and see what search terms they have used.  It is not unusual for me to see terms that don't seem to fit my intention.  That is not to say that "My Way" is the right way, it just indicates how hard it is to get enough of the search terms that any given font buyer would use to find what they want.  I hate the guys who put every search term on earth in all their type just to be included in everyones searches, no matter what.</p>
