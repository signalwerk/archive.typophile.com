    <p>Conventional font categories are practically useless to me. Almost every font I make falls under decorative, sans-serif or both. That's not much of a category range. Pretty much anything before Morrison I throw into the Ancient category. I don't have any need to subdivide that category. For my purposes, those fonts have a common thread: not particularly interested. Most if not all font categories deal with pre-Morrison archetypes.</p>
    <p>Old sans (Franklin Gothic and other sans with ancient flav)<br>
    Geo-classical (Futura, Gill, Bernhard Gothic)<br>
    Helveticas (Arial, and hundreds of other mid-century neutrals)<br>
    Frutigers (Museo Sans, Verdana)<br>
    Humanist sans (Easy. If the baseline is straight, it ain't humanist. Most of what I see categorized as humanist are just Franklins.)<br>
    Geo-gothic (Avant Garde)<br>
    Square Sans (EF Digital, Bank Gothic, Chimes)<br>
    Superelliptical (Microgramma, Eurostile)<br>
    Brush Sans (Flash, Balloon)<br>
    Techincal (DIN, Highway Gothic, stencils, elevator buttons, template lettering, labels &amp; other "ugly" lettering)<br>
    Pixel (early computing retro, including segmented LED)<br>
    MICR (Data 70)<br>
    Rounded Sans (V.A.G., Arial Rounded)<br>
    Compacta (Impact, Helv Inserat)<br>
    Industrial slabs (Memphis, Museo)<br>
    Stops (Stop and similar minimalist variants produced in the 70's &amp; 80's. I didn't think it was a category until I moved to Japan. Bored font historians looking for a subject should try tracking Stop's influence on car emblems, videogames, graffiti and the circa 1990 4k demo scene.)<br>
    Geo slabs (Lubalin Graph)<br>
    Structured scripts (Magneto, Deftone Stylus)<br>
    Scripts (boo)<br>
    Decorative (Actually decorative. Fonts that look like fire or chrome etc. It's often used as a catch-all category by the ancient ones)<br>
    Misc (a better name for a catch-all category)</p>
    <p>These are the categories I use in my work. Unfortunately, other people don't see these as categories. A famous font grump called my Pirulen font a Bank Gothic knock-off or something but he probably wouldn't call every transitional font a Times knock-off. Categories are important. Exploring a category sounds better than knocking off.</p>
    <p>In the future, people and machines will make more Geoslabs. They will all resemble Avant Garde Gothic a bit. Geometry, baby. People will make Compactas that look somewhat like Compacta. They'll make hundreds more MICR and Stop inspired fonts and there will always be those who will place them in the Decorative category and call them knock-offs while they toil away on the next great, slightly-different Garamond.</p>
