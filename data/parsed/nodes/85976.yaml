    html: <p>Can someone explain to me why the baseline can't be straight in a humanist sans? It may be that this was an original definition of it for one classification scheme or the other, but I can't think of anyone that ever defined it to me like that. For a modern classification, it doesn't seem to make much sense to exclude for example Frutigers from that category; for most people I know, they're actually one of the leading examples for humanist sans serifs.</p>
