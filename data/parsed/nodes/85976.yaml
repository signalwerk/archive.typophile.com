      <p>The problem comes when you "think" you know what "Humanist Sans" means.  I had no idea that they required stems that were not square on the baseline.  I thought it had to do with variable proportions that were more akin to serif faces historically, and a looser, less rigid structure and perhaps a bit of a departure from the straight line.</p>
      <p>It makes me want to figure out what kind of jobs I would want to do with a humanist sans as opposed to say a grotesk.</p>
