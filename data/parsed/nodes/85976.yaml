      <p>In some ways, categories are too limiting. Several of my own typefaces are difficult to categorize because they are hybrids of traditional categories. I find the areas outside of established categories are the most interesting to explore.</p>
      <p>As a type designer, sticking to established categories is actually a quite difficult way to make a living. If a category is established, then there probably already exists a face that exemplifies that category and will be the default choice for designers looking for something in that category. Overthrowing the king of a type category isn't impossible--it happens--but the odds are against it.</p>
