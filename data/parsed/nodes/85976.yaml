      <p><cite>how can interested people be helped with finding what they look for?</cite></p>
      <p>Indeed. Most type classification efforts, PANOSE included, define fonts in terms of morphological and historical characteristics that make sense to hardcore typographers, but don't have much utility to someone who wants to know "what's a good font for this project?" or "what font would go with this one I already have?" </p>
      <p>In other words, putting fonts in  a "humanist sans" category is great if you already know what a humanist sans is and what it's good for. If you don't, then the category might as well be "florble-glorks."</p>
