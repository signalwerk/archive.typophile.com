    date_raw: 9 Oct 2011 — 6:21pm
    votes: null
    html: |-
      <p>It certainly is true that traditional typeface categories tend to neglect even the recognized subdivisions of sans-serif types (Grotesques, Geometric sans-serif, Humanist sans-serif), never mind attempting to subdivide the endless chaos of display faces.</p>
      <p>Instead, they're mostly occupied with Roman faces, and even there, the classification is focused on the serif style. So we might get...</p>
      <p>Sans-serif<br>
      Egyptian slab-serif<br>
      Clarendon<br>
      Latin (wedge serif)<br>
      Modern<br>
      Transitional<br>
      Oldstyle</p>
      <p>as a list of classifications.</p>
      <p>Some additional categories...</p>
      <p>Weighted sans (i.e. Radiant, Globe Gothic)<br>
      Flare serif (i.e. Optima)</p>
      <p>Grotesque (early sans-serifs)<br>
      Gothic (News Gothic, Franklin Gothic)<br>
      Geometric sans<br>
      Humanist sans</p>
      <p>are obvious enough, but to really subdivide today's sans-serif faces might be considered by some to be akin to creating a division similar to that between oldstyle and modern for last week's fashions.</p>
      <p>And what Stone Sans and Lucida Sans have in common seems to be rather subtle, in any case...</p>
