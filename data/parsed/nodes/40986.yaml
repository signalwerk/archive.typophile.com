    html: |-
      <p>Yep, Destin is a city in Florida.</p>
      <p>Blueprints of Destin is/was the original name.  The owner wants to keep it but the very fact that the word Blueprints is used twice hurts it some.  Others feel it is too redundant.</p>
      <p>Blueprints are not exactly a dying product.  You'd think that they were because we are in the digital age but contractors cannot take large computer screens on the job site and they'd prefer to not have to scroll around on a tiny micro computer either just to view the job details.</p>
      <p>What we do is reprographics, specializing in printing architectural blueprints, either through reproduction or first time plans.  The lines on the left represent the lines that architects use in their drawings.</p>
      <p>The fonts used was an attempt to go away from our current corporate feel.  I wanted to let our clients understand that we love what we do, we do our job quickly, and we can help them with their needs as general contractors, sub-contractors, owners, and architects.</p>
      <p>One thing I do not want to do is to flat out tell them what we do just by looking at the logo.  I'd like for them to be intrigued and to wonder about us.  We already have a large clientel base but for those that have never heard of us, then the first time they see that logo, I want it to stand out so by chance, one day they decide to have plans designed for their own residence or commercial, they will remember the name, Blueprints Now!</p>
