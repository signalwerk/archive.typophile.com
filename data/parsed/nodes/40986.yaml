      <p>To tell you the truth, this logo looks like one of those DIY logos, that are normally very bad and tell me only one thing: "We are either short of money or tight or ignorant. Or a combination of the above."</p>
      <p>You're doing blueprints, yet your logo tells people that your blueprints are inaccurate, your business is a mess and it'll be expensive since you're cheap, but we'll have to get blueprints somewhere else to get the right ones. So paying twice. And that's what your logo tells me.</p>
      <p>I'm being frank on purpose because I don't think this current logo has any potential worth pursuing. Try to get new ideas in your head and on the paper. Or get a designer to do it for you.</p>
