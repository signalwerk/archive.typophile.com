    <p>Hi everyone.  New here.  Found this through, none-other, Google.</p>
    <p>I've been working on a logo design for a small business that I started with back in March 2006.</p>
    <p>Since June 2007, the business sold and now the new owner is actually utilizing me rather than letting me sit around and do paperwork.</p>
    <p>First off, I am no graphic designer.  I have taken classes but I'm far too hard on my own work to ever accept anything I do as good enough.</p>
    <p>Well, except for this one.  I actually love this design but I felt that I needed to get more opinions, specifically opinions from designers.</p>
    <p>I will not tell you what we do though as I want to see what people think about this concept as well as if they can figure out what services we provide.</p>
    <p>Thanks.  I'll be keeping this page open all day.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2008-01-15-_4319.-Blueprints-Now.gif"></div><p></p>
