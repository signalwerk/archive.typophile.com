      <p>"I will not tell you what we do though as I want to see what people think about this concept as well as if they can figure out what services we provide."</p>
      <p>A logo doesn't need to literally describe the specifics of the business. If it does, great, but you don't want to over-detail the logo to do that. A logo really only needs to represent you.</p>
      <p>As such, the current logo seems crowded and busy. If I had to guess, you do something with blueprints, but given that blueprints are kind of a dying product, I'm not entirely sure. ;0)</p>
