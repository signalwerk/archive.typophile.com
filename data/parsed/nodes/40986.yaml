      <p>The company has both names.  The new owner wants to phase Blueprints of Destin out of the name slowly.  He took over in June of 2007 and the very first store opening was called Blueprints of Destin.  Since then it has grown to five stores.  I'm not sure of when the first store opened but the new owner wants to keep the tie to our roots (or something like that) for the time being.</p>
      <p>Apparently, he has decided to stick with my design which can be modified as we move forward.  For now he wants to get business cards made up for the two stores that currently need them.</p>
      <p>He never asked me to design the logo.  I just thrust it upon him one day to get his opinion and he loved the idea.</p>
