  html: |-
    <p>Is there a font based on H.Bayer’s lettering for the Bauhaus building signage(in Dessau)?:</p>
    <p>ex:<br>
    <a href="http://www.thebreman.org/exhibitions/online/1000kids/Bauhaus.JPG" title="http://www.thebreman.org/exhibitions/online/1000kids/Bauhaus.JPG">http://www.thebreman.org/exhibitions/online/1000kids/Bauhaus.JPG</a></p>
    <p>It looks like what the uppercase version of his “universal” font would look like - but the original (and P22’s digital version) only contain lowercase, from what I can tell.</p>
    <p>this one is close, but the “S” is different:<br>
    <a href="http://www.fontshop.com/fonts/downloads/fountain/dessau_pro/" title="http://www.fontshop.com/fonts/downloads/fountain/dessau_pro/">http://www.fontshop.com/fonts/downloads/fountain/dessau_pro/</a></p>
    <p>Thanks in advance</p>
