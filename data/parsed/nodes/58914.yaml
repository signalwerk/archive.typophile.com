    <p>...............................................................................................................................<br>
    MAC RHINO FONTS – New Site – New Design – New Typeface<br>
    ...............................................................................................................................</p>
    <p>BACKGROUND<br>
    MRF have had five happy years since the launch in 2004. Several typefaces have seen the daylight and become popular among the design community around the world. MRF look forward to continuing this tradition — for many years to come!</p>
    <p><a href="http://www.macrhino.com" title="http://www.macrhino.com">http://www.macrhino.com</a><br>
    ...............................................................................................................................</p>
    <p>NEW SITE/NEW DESIGN<br>
    We say it's new because the content is mostly different from the earlier website. Due to a couple of productive years, several new designs have now been featured and displayed properly. Apart from the core type section (which have been expanded and optimised) several galleries of type in use have been added. One for Retail type in use and another for custom type in use. Last (but not least) is a section called The world of type, showing off sad, ugly and just beautiful typography surrounding us. </p>
    <p><a href="http://www.macrhino.com/retailtypeinuse.html" title="http://www.macrhino.com/retailtypeinuse.html">http://www.macrhino.com/retailtypeinuse.html</a><br>
    <a href="http://www.macrhino.com/customtypeinuse.html" title="http://www.macrhino.com/customtypeinuse.html">http://www.macrhino.com/customtypeinuse.html</a><br>
    <a href="http://www.macrhino.com/worldoftype.html" title="http://www.macrhino.com/worldoftype.html">http://www.macrhino.com/worldoftype.html</a><br>
    ..............................................................................................................................</p>
    <p>TYPE SPECIMEN ETC.<br>
    Merchandise is another priority taken care of. MRF know from experience that customers like specimens t-shirts and other goods. Now MRF have started up sales in a small scale and offers a few goodies to begin with. This section will be expanded in the future.</p>
    <p><a href="http://www.macrhino.com/merchandise.html" title="http://www.macrhino.com/merchandise.html">http://www.macrhino.com/merchandise.html</a><br>
    ...............................................................................................................................</p>
    <p>NEW TYPEFACE<br>
    Euroglory – a smooth sans serif with rounded edges. Straight enough to be a corporate workhorse and built as a solid companion for magazine work. Made in two steps and part two of this family became available as a retail typeface through Veer Inc, earlier this year. See the full story behind it and be sure to download the pdf-specimen.</p>
    <p><a href="http://www.macrhino.com/euroglory.html" title="http://www.macrhino.com/euroglory.html">http://www.macrhino.com/euroglory.html</a><br>
    ...............................................................................................................................</p>
    <p>FREE STUFF<br>
    As before MRF still have a few single weight typefaces to offer for free. </p>
    <p><a href="http://www.macrhino.com/free.html" title="http://www.macrhino.com/free.html">http://www.macrhino.com/free.html</a><br>
    ...............................................................................................................................</p>
    <p>ABOUT MRF<br>
    The foundry operates as an independent studio, collaborating with its partners in various disciplines whenever necessary. Apart from the retail designs MRF also specializes in custom type design. The founder Stefan Hattenbach have been focusing on type design ever since his first typeface in 1996.</p>
    <p><a href="http://www.macrhino.com/services.html" title="http://www.macrhino.com/services.html">http://www.macrhino.com/services.html</a></p>
