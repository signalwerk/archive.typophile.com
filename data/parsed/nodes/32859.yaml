      <p>Gerry Leonidas has been collecting examples of Greek handwriting from different periods (mainly modern examples, i.e. since renaissance and earlier periods are well covered by palaeography studies). From what I have seen of recent Greek handwriting, most of it is disconnected, but there are some interesting shape distinctions from typical typographic forms, most notably the lowercase sigma, which when written quickly has a shape similar to a loosely formed Latin G.</p>
      <p>Microsoft's new Segoe Script font seems to do a pretty good job of imitating modern Greek handwriting.</p>
      <p>Gerry has some lovely examples of fine penmanship from earlier in the 20th century.</p>
