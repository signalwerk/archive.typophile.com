      <p>Thanks to Gerry and others for wonderful explanations.</p>
      <p>Besides the examples posted here, I haven't seen any examples of formal, connecting scripts for Greek (the elegant kind you associate with copperplate, wedding invitations, etc.) either as typefaces or handlettering. Reading through this thread makes me wonder if there is much to be found. It's interesting that Greek forms seem more flowing and fluent than the Latin and Cyrillic counterparts, yet it's the latter two scripts that have a strong tradition of formalized connecting script forms.</p>
      <p>When I was learning to write Greek the one manual I saw was based on upright letterforms, so this was a question I had, too. Have there ever been script models for teaching based on connecting scripts? You know, like for learning 'cursive' for Latin and Cyrillic?</p>
      <p>Also, does anyone know where I can see samples of the Segoe Script Greek? Don't have Vista yet..</p>
