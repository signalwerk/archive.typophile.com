      <p><em>It’s interesting that Greek forms seem more flowing and fluent than the Latin and Cyrillic counterparts, yet it’s the latter two scripts that have a strong tradition of formalized connecting script forms.</em></p>
      <p>It's worth remembering that the dominant Greek writing styles that emerged in the Byzantine empire and which persisted for several hundred years were a mix of connecting and unconnecting forms. The early formal book hand is entirely unconnected, but around the end of the first millennium AD a connected uncial form developed. The letters are still very upright and formal, but there are a lot of x-height and baseline connections and some exciting x-height cross-strokes that connect more than two letters. In Barbour's <em>Greek Literary Hands,</em> almost all the manuscripts between 850 and 1400 are variants on this style. During this period, some writing speeds up, with the usual results of horizontal compression, slant and abbreviation, laying the groundwork for the style that Aldus adopted in print, and which became to dominant writing hand in the Renaissance.</p>
      <p>Unfortunately, almost no Greek palaeography texts cover anything after 1600. Still, that's 800 or so years of resolutely connected Greek script.</p>
    html_clean: |-
