      <p>Segoe Script is script more in name than in cursive quality. With its discrete letters, it's closer to block printing. </p>
      <p>A formal style based on the Bergling model would be quite appropriate if it were kept tight and "professional" -- in the same way that 18th century Roman scripts still have typographic currency.</p>
      <p>However, for the typographer there is the matter of historical allusion, of mixing types from the same era and style to provide an innate harmony. So the question would be, which serifed or sans fonts have the classical gas to run alongside a Berglingesque script? One of the GFS Bodonis, for starters. As with Snell, the capitals would make great initials, so I'd say go for it Paul. The interesting part will be using OT to deploy the alternates, such as the tall tau, which goes in the middle of words only, AFAIK, and tall zeta at the beginning?</p>
