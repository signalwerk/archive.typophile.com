      <p>Its source was <em>Das Buch der Schrift</em> by Carl Faulmann, which was an interesting find on <a class="freelinking external link-external" href="http://books.google.ca/books?id=7jhbAAAAQAAJ" rel="nofollow">Google Books</a>.</p>
