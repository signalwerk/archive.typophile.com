    <p>Two Books and One Exhibition.</p>
    <p>Edited and curated by <a href="/wiki/Peter%20Bain" class="freelinking" rel="nofollow">Peter Bain</a> and <a href="/wiki/Paul%20Shaw" class="freelinking" rel="nofollow">Paul Shaw</a>.</p>
    <p>The books/exhibition deal with the history of <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> typefaces, the nationalist tendencies that became associated with them, and those typefaces that were intended to embody this.</p>
    <p>The first monograph, published by Princeton Architectural Press, is a series of essays contributed by authors such as Hans Peter Willberg and Christopher Burke; the second book is the exhibition catalogue, published by the American Printing History Association as part of its journal <em>Printing History</em>. Copies of the monograph are available from <a href="/wiki/Peter%20Bain" class="freelinking" rel="nofollow">Peter Bain</a> and <a href="/wiki/Paul%20Shaw" class="freelinking" rel="nofollow">Paul Shaw</a>.</p>
    <p>The exhibition was held in 1998 at the Herb Lubalin Study Center of Design and Typography at <a href="/wiki/Cooper%20Union" class="freelinking" rel="nofollow">Cooper Union</a>.</p>
