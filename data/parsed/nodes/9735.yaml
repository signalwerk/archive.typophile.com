    html: <p>Well crud, I thought I was splashing around in the shallow end of the pool, but I appear to have slipped oﬀ the shelf into the deep end. “Palazzo Original”, for those who don’t know, is one of the ten zillion typefaces found on the Megafont <span class="caps">XXL</span> <span class="caps">CD</span> from SoftMaker. The <span class="caps">CD</span> is chock full of shameless copies of classic typefaces (Newcastle -&gt; News Gothic, Opus -&gt; Optima, <span class="caps">O801</span> Flare -&gt; also Optima, etc). Also, somehow Berthold Types is tied into the whole mess, for good or *cough* for ill. <br><br>Given the tremendous respect I hold for Hermann Zapf, and given that all of the fonts on Megafont <span class="caps">XXL</span> are TrueType (they don’t even list the Mac as a supported platform, even though Mac <span class="caps">OS</span> X can handle Windows TrueType fonts no problem), I guess I’m just outta luck unless I want to kick down for a <span class="caps">CD</span> that contains a lot of stuﬀ that makes me queasy. Either that, or revive the old style of Palatino myself. Does anyone have any words on the quality of Palazzo Original? Is it good enough to justify the purchase of the Megafont <span class="caps">CD</span>? Is there any way to purchase SoftMaker fonts individually? <br><br>Thanks anyway, Mr.&nbsp;Stie</p>
