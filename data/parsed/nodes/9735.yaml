    html: '<p>To Mr. Peters: <br><br>You did <span class="caps">NOT</span> overreact. It is <span class="caps">CORRECT</span> what you said. <br><br>To Mr. Norvell: <br><br>There exists yet another font which seems to be closest to the original of 1950. Unfortunately I presently do not have enough time to make a detailed time-consuming letter-by-letter comparison. However, I attach an example (italic letter “d”): To the left of this picture you see the font that is extremely close to the original of 1950, and to the right you see the present-day derivative sold by Linotype. <br><br>The use of the word “original” requires a precise deﬁnition. An “original” is deﬁned as “the <span class="caps">FIRST</span> form of something, from which other forms are derived”. <br><br>Example: Bruno Steinert does not assert that he is selling “A <span class="caps">FEW</span>” or “<span class="caps">MANY</span>” originals. No, Bruno Steinert asserts that he is selling “<span class="caps">THE</span> originals” and that Linotype is “<span class="caps">THE</span> source of <span class="caps">THE</span> originals”. However, since an original is the <span class="caps">FIRST</span> form of something, it goes without saying that the present-day “Palatino” is a derivative form, i.e. a form derived from the original. <br><br>To the left of the picture, you see an extremely close digital version of the original foundry type, whereas to the right you see the present-day Linotype derivative. Professor Zapf made both the original and the derivative, but there always exists only <span class="caps">ONE</span> original, namely the <span class="caps">FIRST</span> form of something, in this case the original of 1950. <br><br>The distinction between original and non-original is crucial, because Bruno Steinert’s outﬁt is the only font company claiming to be “<span class="caps">THE</span> source of <span class="caps">THE</span> originals”. (Adobe, Monotype etc. do not make this legally binding claim.) <br><br>Example: In the German Copyright Act we read: <br><br>“It shall be punishable by imprisonment up to three years or by ﬁne, insofar as the conduct may not warrant a more severe penalty pursuant to other provisions, for any person to aﬃx a designation of authorship <span class="caps">WITHOUT</span> the author’s consent on the <span class="caps">ORIGINAL</span> of an artistic work, or to distribute an <span class="caps">ORIGINAL</span> bearing such designation”&nbsp;(</p>'
