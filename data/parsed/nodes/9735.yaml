    html: '<p>I’m going to follow the honest and humble road and say that I’m just not qualiﬁed to evaluate your legal arguments, as fun as it would be to play pocket lawyer. Thank you for taking the time to explain the issues to me, though. <br><br>You do raise a good point about Linotype’s claim to be “the source of the originals”; my question would never have arisen if Linotype were actually selling the original version (for even a semi-loose deﬁnition of “original version”) of Palatino. However (again, leaving aside the legal arguments), the version of Palatino that Linotype sells is one that was devised and blessed by Hermann Zapf himself, so it’s not like Linotype is lying. They’re saying, “we don’t sell clones and knockoﬀs”, and in this particular case, they’re correct. I’m disappointed because the only vendor who is selling the font I want is selling a knockoﬀ; my quandary is that the “original” cut is unavailable digitally in a form authorized by Hermann Zapf. It’s an ethical matter, not a legal one. (Also, a practical one: I’d still like to know if Palazzo Original is high enough quality to use in print.) <br><br>In general, I think it’s best to leave the resolution of the legal issues you raise to the foundries, type designers, and lawyers aﬀected. If your overarching point is that the laws regulating ownership of type are a mess, then I completely agree with you. After having studied the material made available by Luc Devroye and Ulrich Stiehl, as well as reading the American copyright law on the subject, I’m frankly at a loss as to what the ideal solution would be. And, in the speciﬁc case of Akzidenz Grotesk / Basic Commercial, I assume the foundries’ lawyers have their reasons for not taking action. To say more would be to cover ground already covered amply in <a href="http://www.typophile.com/forums/messages/4102/65553.html?1109794421">other</a> <a href="http://www.typophile.com/forums/messages/4102/66616.html?1110678242">threads</a>. Thanks again for answering my&nbsp;question!</p>'
