    html: '<p>Postscript: <br><br>I forgot to deal with the question whether it is <span class="caps">LEGALLY</span> permitted to publish a font which is a very close or even a totally identical copy of Professor Zapf’s original of 1950. The answer is <span class="caps">YES</span>: Since Professor Zapf is a German, the German laws is applied. (For non-Germans, international conventions are applied). However, in 1950 there did not yet exist any laws protecting the design of typefaces by copyright law or by design patent law or any other German law. This legal situation has completely changed in recent decades, but this does no longer aﬀect typefaces that were created many decades ago. Due to lack of space, I cannot go into legal details of German laws, but in a very <span class="caps">SIMPLIFIED</span> way we can say that all German fonts that were created more than 25 years (<span class="caps">ROUGHLY</span> before 1980) are not protectable by any German law. However this is a very <span class="caps">SIMPLIFIED</span> statement, but suﬃcient for all those who only need a legally simpliﬁed answer. <br><br>A diﬀerent question is whether it is <span class="caps">MORALLY</span> permitted to to publish a font which is a very close or even a totally identical copy of Professor Zapf’s original of 1950, without having obtained his express permission to do so. The answer is <span class="caps">NO</span>. Since Professor Zapf does not want to re-publish his original of 1950, this means that nobody is <span class="caps">MORALLY</span> permitted to do so. <br><br><span class="caps">W.O.</span></p>'
