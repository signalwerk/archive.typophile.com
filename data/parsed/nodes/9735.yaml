  html: '<p>For Christmas I got my mom a copy of Robin William’s <i>Non-Designer’s Type Book</i>, with the promise (or maybe that’s “threat”) that I’d get her a copy of Bringhurst’s <i>Elements of Typographic Style</i> when she ﬁnished the ﬁrst book. So it’s not so unusual that periodically she and I have rambling discussions about how to use type in the various periodicals she edits, and occasionally she leaves me a cryptic message about fonts in my inbox or voicemail. <br><br>This week was no exception, when she left me a cryptic message about her recent fondness for Book Antiqua. The name rang a bell, softly, despite the determined genericity of both the typeface and its name, and a little googling yielded Luc Devroye’s discussion of <a href="http://cgm.cs.mcgill.ca/~luc/palatino2.html">Palatino and its many knockoﬀs</a>. So that’s that. Book Antiqua is a strange anachronism (read: “rip-oﬀ”) that should never have existed in the ﬁrst place, and my mom has discovered Palatino, which she already liked, all over again. <br><br>But still, Devroye’s essay left me with a question: why has nobody revived / digitized a version of Zapf’s original cut of Palatino? It’s a much more interesting font (to me) than the modern equivalents, with Zapf’s characteristic calligraphic strokes, the absent serifs on the p and q, and the overall humanist feel of the face. It would be a natural serifed complement to Optima, and I can think of all sorts of situations where it would make a natural and beautiful text face. <br><br>I know Zapf himself decreed the Linotype digitization to be the ultimate version of Palatino, but whatevs, what does he know? Those symmetric serifs and the overall classicization of the typeface sucked out a considerable amount of its style; only the italic retains any of the original’s spunk. Anyway, has there ever been anything like <a href="http://www.foundrytypes.co.uk/foundry_architype/architypes.html">The Foundry’s</a> <a href="http://www.foundrytypes.co.uk/foundry_architype/architypes.html">Architype collection</a> for Palatino, or any of Zapf’s other designs? <br><br><i><span class="caps">PS</span> </i></p>'
