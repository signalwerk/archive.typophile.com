    html: |-
      <p>"The best argument I have heard for using it (as a straightforward replacement) is that it looks more familiar to children who have been learning to write"</p>
      <p>Yes, that's the best argument (such as it is). But as children who have been learning to write generally already know how to read, and have been exposed to both forms of the "a" the argument does not make much sense, except in the limited case that the typeface is intended as a model for writing.</p>
      <p>There are plenty of reasons to believe that the two story "a" is usually preferable for legibility, and what little research has been done says that beginning readers prefer it anyway (Sue Walker did a study on the question).</p>
