    html: |-
      <blockquote><p>Nor in Latin based languages.</p></blockquote>
      <p>Balderdash. Immersive reading isn't about taking seconds to consciously decipher individual letters; it's about taking a fraction of a second subconsciously deciphering multiple boumas, more than half of them blurry. This is why for example all-caps is harder to read.</p>
      <p>Every writing system has problems (and ways to subtly minimize/avoid them).</p>
      <p>hhp</p>
