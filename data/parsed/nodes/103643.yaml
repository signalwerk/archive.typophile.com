    html: |-
      <p>In educational publishing (that I am familiar with) that style of lc /a is often referred to as an 'infant' or 'ball and stick' a. It is often used in texts for children as it falls in line with the requirements of educational institutions or bodies, though I am not aware of any specific standards that require it. The best argument I have heard for using it (as a straightforward replacement) is that it looks more familiar to children who have been learning to write, e.g.,</p>
      <p><a href="http://www.handwritingforkids.com/handwrite/manuscript/animation/lowercase.htm" title="http://www.handwritingforkids.com/handwrite/manuscript/animation/lowercase.htm">http://www.handwritingforkids.com/handwrite/manuscript/animation/lowerca...</a></p>
      <p>That said, my son has no problem with the more traditional /a (and /g) which is used (with greater frequency) in his favourite story books.</p>
      <p>If you want to seek out other examples, searching for infant and ball and stick might help.</p>
