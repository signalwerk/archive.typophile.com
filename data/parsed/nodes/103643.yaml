      <blockquote><p>2) what program would i need? is there a free version?</p></blockquote>
      <p><a href="http://fontforge.github.io/en-US/downloads/" rel="nofollow"><strong>FontForge</strong></a>. It is free.  For the license, see <a href="http://www.fontforge.org" title="http://www.fontforge.org">http://www.fontforge.org</a>.</p>
      <blockquote><p> 3) how can i ensure that this 'new a' will look in-line with the other letters in the ROBOTO font?
      </p></blockquote>
      <p>Just copy the small letter alpha from Roboto itself and paste it where the small letter a is. Some would argue it is not really a small letter alpha, anyway. You can do that with all the Roboto fonts from thin to black, condensed or not. If you are not too fancy, there is not much else to do (but the aogonek will come out quite wrong).</p>
