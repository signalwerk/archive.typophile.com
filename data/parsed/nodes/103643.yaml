    <p>i'm really liking the ROBOTO font but have never liked the 'a' that many fonts use.<br>
    i would like to replace this 'a' with an a that has a single circle and a near verticle line on the right hand side.</p>
    <p>1) how can i find fonts with that type of 'a'<br>
    2) what program would i need? is there a free version?<br>
    3) how can i ensure that this 'new a' will look in-line with the other letters in the ROBOTO font?</p>
    <p>OR, maybe there is another way since i'm totally new to messing around with fonts.</p>
    <p>thanks for any and all suggestions :)</p>
