      <p>&gt;Has anyone told the Greeks?</p>
      <p>I think the alpha is a different story. In Greek there's no danger of confusing it with /d/, /g/ or /q/.</p>
      <p>&gt;what little research has been done says that beginning readers prefer it anyway (Sue Walker did a study on the question).</p>
      <p>I don't remember Sue Walker's research reaching that conclusion. As I understand, she found that letterspacing and linespacing had a significant impact on children's reading performance, but the single- versus double-storey /a/ and /g/ didn't make a difference. The children understood from an early stage that we use different forms in reading (typefaces) and writing.</p>
      <p><a href="http://www.kidstype.org/?q=node/44" rel="nofollow">Here</a>'s a link to Walker's findings.</p>
