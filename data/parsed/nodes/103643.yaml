      <p>Agreed with Bendy on the alpha.</p>
      <p>Bendy, Walker’s research found no difference in reading performance for schoolbook/infant vs traditional forms. It did find a difference in preference, where 10 children preferred the traditional forms, vs 6 preferring schoolbook/infant forms (and 8 having no preference).</p>
      <p>The previous linked page just mentions a couple of Walker’s findings; the research is presented in full in: Sue Walker and Linda Reynolds (2002/3) “Serifs, sans serifs and infant characters in children's reading books,” Information Design Journal 11, 2/3, pp. 106-122</p>
      <p>Also, it is written up pretty well in her book, which is available as a free PDF here: <a href="http://www.kidstype.org/?q=webfm_send/4" title="http://www.kidstype.org/?q=webfm_send/4">http://www.kidstype.org/?q=webfm_send/4</a></p>
