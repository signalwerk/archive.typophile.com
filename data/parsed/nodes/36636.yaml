      <p>&gt;similar to Berthold Akzidenz Grotesk<br>
      Linotype offers »Basic Commercial« as a similar. Okay, less weights etc.<br>
      Maybe you find a Bitstream Knock-Off of AG … search Corel Draw for that:)</p>
      <p>&gt;Myriad Pro<br>
      Take Myriad Pro ;)</p>
      <p>&gt;they paired a (sans) serif with …<br>
      if you want that »working within the same line« check:<br>
      x-height, weight(s), the form of the glyphs, spacing, the »vibe« … and more</p>
      <p>BTW I saw PMN Caecilia working good together with FF DIN …</p>
      <p>Good luck</p>
