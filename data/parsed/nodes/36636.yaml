    <p>Hi,</p>
    <p>I was wondering if someone could help me out.</p>
    <p>I need to find some fonts that are similar to Berthold Akzidenz Grotesk and Myriad Pro. </p>
    <p>Basically I need to pair a sans serif with a serif typeface... similar to what RealSimple magazine does.. they paired a sans serif with Caecilia.</p>
