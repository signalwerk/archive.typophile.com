    html: <p>I don't think it's so much the extra work as the fact that, traditionally, small caps were only included in the regular weight of a font. So, including them in the italic or bold styles simply doesn't have a lot of precedent. Personally, I don't see any reason not to include them, although they they don't get used much (yet).</p>
