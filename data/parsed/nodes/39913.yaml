    html: |-
      <p>I like to have a few faces around that carry italic smalls, even semibold italic smalls.</p>
      <p>Each year a couple of projects come along that require them, and I can start those projects knowing this need can be filled.</p>
      <p>More of a trouble is the book that, in ms, seems not to need them, so is specified in a face that does not have them. Then at first page proofs, author or editor decides to make an edit that then requires italic smalls. Perhaps this is an addition that (had it been set all roman) would have used roman smalls, but because the entire addition is ital, requires maybe one word in italic smalls.</p>
      <p>For most book faces in our repertoire, I find I can fiddle Minion or Miller italic smalls to get a fairly decent match. But it is a patch, and thus not fully satisfactory.</p>
      <p>powers</p>
