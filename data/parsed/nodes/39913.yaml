      <p>Sometimes you like a typeface's roman weight, but aren't so hot on the italic. The small caps present a nice alternative for when emphasis is required. I often do this for the bibliography section of an academic article; the journal or book title is set in small caps instead of italics. For example, I always do this with Times, since I despise Times' italic weights.</p>
      <p>I can't think of much use for bolder weights of small caps other than the occasional titling application, and even then, I am more likely to use all-caps for titling.</p>
