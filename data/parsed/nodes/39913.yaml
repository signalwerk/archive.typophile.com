      <p>Why? Tradition.<br>
      The vast majority of classic typefaces (and especially <a href="/wiki/family" class="freelinking" rel="nofollow">families</a> has been made for body text, often as in books.<br>
      This is related to <a href="http://www.typophile.com/node/38645" rel="nofollow">this issue</a>, why certain faces don’t have a bold and/or a bold italic.</p>
      <p>Why don’t Helvetica, AG etc. have small caps and osf? Because that would look totally out of place, in a historic sense. Same goes for those whimsical small caps in an already inherently odd extra bold garalde, and even the most traditional italic serif face, yet in regular weight, starts to scream ‘pomo!’ when set in small caps, imho.</p>
      <p>I don’t say it’s not nice to have them (i.e. black or italic sc) for <em>some </em> cases, but you don’t need them very often, at least when you’re doing rather traditional things like books or scientific publications.</p>
