    <p>I suppose in some cases, the combination of heavy bold weights and the reduced proportions of small caps might just be too much to be legiable, but Minion appears to have small caps in every weight.</p>
    <p>Any particular reason? I can't imagine it's got anything to do with the work involved, since I've seen this phenomenon in typefaces with otherwise massive, sprawling character sets.</p>
