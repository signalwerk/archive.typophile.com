    html: |-
      <p>I think the newer typefaces are more likely to include smallcaps in all the weights. Book faces dones in the last 5 years, mostly the OpenType fonts done in the past 4 years, are better candidates for full inclusion than older faces.<br>
      There is a good bit of work involved if you consider diacritics and kerning. The downside is that the time to market gets drawn out doing all the extra work and the profit difference is small.<br>
      Here I sit doing smallcaps in bold, italic, and bold italic when I could be out on the town living the high life instead :-)</p>
      <p>ChrisL</p>
