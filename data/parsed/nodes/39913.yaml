      <p>There just aren't that many reasons to use small caps in bold (or italic, for that matter). Small caps aren't a simple reduction of cap size, so there is real development required, and every new glyph adds more time to the overall production effort (spacing, mastering, display). </p>
      <p>Most foundries believe that the most important glyph sets should be completed and released first, and if there is sufficient demand, the family can expand.</p>
