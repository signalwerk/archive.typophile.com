    date: 2004-02-01T13:43:00
    date_raw: 1 Feb 2004 — 1:43pm
    votes: null
    html: "<p>Hmm. I learned it the other way around: that \"em\" and \"en\" came first. But in a noisy print shop, especially if there were Linotypes or Monotypes clattering away, these two sounded too similar and nicknames like \"mutton\" and \"nut\" were used to make them more distinct. (Sort of like the purpose of \"alpha, baker, charlie, delta . . .\") <br> <br>I don't recall where I first heard that explanation. <br> <br>I've also heard of \"mary\" or \"molly\" used for an em; but I've only ever heard of \"nut\" for an en. <br> <br>-- K. <br></p>"
    html_clean: "<p>Hmm. I learned it the other way around: that \"em\" and \"en\" came first. But in a noisy print shop, especially if there were Linotypes or Monotypes clattering away, these two sounded too similar and nicknames like \"mutton\" and \"nut\" were used to make them more distinct. (Sort of like the purpose of \"alpha, baker, charlie, delta . . .\") <br> <br>I don't recall where I first heard that explanation. <br> <br>I've also heard of \"mary\" or \"molly\" used for an em; but I've only ever heard of \"nut\" for an en. <br> <br>-- K. <br></p>"
