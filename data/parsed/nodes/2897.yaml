    html: |-
      <p>If any style of fraction is to be called "Vulgar," it'd be those ones I see in mss all the time, with all 3 elements on the baseline. As in: 1/2 or 17/32. Now that's Vulgar.</p>
      <p>I think the "standard fraction" Tiffany asked about has generally in typography/typesetting been called a "case fraction," for once upon a time they were common enough that they could be found in a many typecases for use by hand comps.</p>
      <p>Piece fractions had several manifestations in metal type, both machine-set and hand-set. Take a look at these pages to see what a Linotypist had to do to compose some piece fractions.</p>
      <p>Linotype horizontal-stroke piece fracs:<br>
      <a href="http://books.google.com/books?id=XxcPAAAAIAAJ&amp;pg=PA171&amp;lpg=PA171&amp;dq=%22piece+fractions%22&amp;source=bl&amp;ots=I6q75-c90O&amp;sig=Jq682MH1a-YAH70PrqX88ctVQRQ&amp;hl=en&amp;ei=vkcLStwlkoKZB8ecmQw&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=3#PPA171,M1" title="http://books.google.com/books?id=XxcPAAAAIAAJ&amp;pg=PA171&amp;lpg=PA171&amp;dq=%22piece+fractions%22&amp;source=bl&amp;ots=I6q75-c90O&amp;sig=Jq682MH1a-YAH70PrqX88ctVQRQ&amp;hl=en&amp;ei=vkcLStwlkoKZB8ecmQw&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=3#PPA171,M1">http://books.google.com/books?id=XxcPAAAAIAAJ&amp;pg=PA171&amp;lpg=PA171&amp;dq=%22p...</a></p>
      <p><a href="http://books.google.com/books?id=eTJ8khmZie0C&amp;pg=PA617&amp;lpg=PA617&amp;dq=%22piece+fractions%22&amp;source=bl&amp;ots=g5Fh_ZQrx0&amp;sig=hrlpDJIJ6lIl_nUwwkyL5CmU5YI&amp;hl=en&amp;ei=vkcLStwlkoKZB8ecmQw&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=6#PPA617,M1" title="http://books.google.com/books?id=eTJ8khmZie0C&amp;pg=PA617&amp;lpg=PA617&amp;dq=%22piece+fractions%22&amp;source=bl&amp;ots=g5Fh_ZQrx0&amp;sig=hrlpDJIJ6lIl_nUwwkyL5CmU5YI&amp;hl=en&amp;ei=vkcLStwlkoKZB8ecmQw&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=6#PPA617,M1">http://books.google.com/books?id=eTJ8khmZie0C&amp;pg=PA617&amp;lpg=PA617&amp;dq=%22p...</a></p>
      <p>I seem to recall that in hand-set type there were numerator sorts that carried the number plus half the virgule and denominator sorts that carried the number plus the other virgule half. Then there were fraction superior sorts for 2-digit numerators or denominators. These had none of the virgule, and were placed left or right of the other digit as needed. It was complex work back then.</p>
      <p>powers</p>
