    html: <p>What's a nut fraction? Is that when the superior figure is directly above the inferior, and the "virgule" is horizontal?</p>
    html_clean: <p>What's a nut fraction? Is that when the superior figure is directly above the inferior, and the "virgule" is horizontal?</p>
  - id: 23111
    user: 1262
    date: 2004-01-30T00:09:00
    date_raw: 30 Jan 2004 — 12:09am
    votes: null
    html: "<p>Yes, Nick, that's it. So called because it is typically an en width. 1) There are two practical drawbacks to nut fractions: the numerator and denominator are typically smaller than in regular fractions, often too small for use at the littler sizes. For example, here is a comparison from Palatino Linotype: <br><img src=\"http://www.typophile.com/forums/messages/30/25200.gif\" alt=\"Fraction comparison\"> <br>2. There is easy way to make arbitrary fractions, because the bar has to stretch over the denominators. To do this sort of thing you need a mathematical layout tool, whereas regular fractions of any size can be fairly easily made, with the right components, in any page layout or word processing application. Nut fractions are only good for a limited number of 'standard' fractions.</p>"
    html_clean: "<p>Yes, Nick, that's it. So called because it is typically an en width. 1) There are two practical drawbacks to nut fractions: the numerator and denominator are typically smaller than in regular fractions, often too small for use at the littler sizes. For example, here is a comparison from Palatino Linotype: <br><img src=\"http://www.typophile.com/forums/messages/30/25200.gif\" alt=\"Fraction comparison\"> <br>2. There is easy way to make arbitrary fractions, because the bar has to stretch over the denominators. To do this sort of thing you need a mathematical layout tool, whereas regular fractions of any size can be fairly easily made, with the right components, in any page layout or word processing application. Nut fractions are only good for a limited number of 'standard' fractions.</p>"
