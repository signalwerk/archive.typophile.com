  - id: 313270
    user: 1043
    date: 2008-11-18T19:59:00
    date_raw: 18 Nov 2008 — 7:59pm
    votes: null
    html: <p>That's a good question. I don't know the answer. I just remember that the early Adobe fonts were a little uneven. I still have the floppy disks. I got my "Futura 2" disk from Linotype through a service bureau. The Linotype and Adobe font data was identical, as I recall. I'm sure the tools they used to make those early fonts was nothing like what we have now. They probably had to work out the outlines on graph paper, type raw PostScript code into a terminal and send it to a Laserwriter to see what it looked like, for all I know.</p>
