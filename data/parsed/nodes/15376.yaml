    html: <p>From what I can make out on the <a href="http://www.nypl.org/" target="new" rel="nofollow">website</a> the logo looks like it's set in <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a>'s <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=ITC.119127.0.1&amp;attributes.sampleSize=48&amp;sampleText=The+New+York+Public+Library&amp;sampleSize=24" target="new" rel="nofollow">ITC Galliard</a>. Can you post a scan or direct us to an online PDF that displays the typeface you're referring to?</p>
