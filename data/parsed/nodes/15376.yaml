    html: |-
      <p>I got some information on the NYPL's brand identity from their Communications and Marketing Deptartment and they said, "Galliard Bold and BoldItalic are used for extreme emphasis, and should only be used on documents such as report covers, presentation materials etc. They are not to be used in the letterhead nor when creating our logotype.  Otherwise the font Library, in Italic, Romand and Smcaps is used for the NYPL name".  </p>
      <p>I can not find any examples because I am not sure what Library looks like, who designed, etc...which is the info I was hoping someone knew.</p>
