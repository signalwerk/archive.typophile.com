  html: "<p>The Building Letters charity project is now only a week from Launch, we've posted some type samples on the site : <a href=\"http://www.buildingletters.org\" target=\"_blank\">http://www.buildingletters.org</a> <br> <br>One thing which I think you'll all be interested in is the magazine which Max Kisman has put together for us. It has articles about African Alphabets and a great piece on the Highfield Art Club. <br> <br>Start the buzz, it will help us sell copies and raise the cash to build the orphanages which the project is all about.</p>"
  html_clean: "<p>The Building Letters charity project is now only a week from Launch, we've posted some type samples on the site : <a href=\"http://www.buildingletters.org\" target=\"_blank\" class=\"link-external\">http://www.buildingletters.org</a> <br> <br>One thing which I think you'll all be interested in is the magazine which Max Kisman has put together for us. It has articles about African Alphabets and a great piece on the Highfield Art Club. <br> <br>Start the buzz, it will help us sell copies and raise the cash to build the orphanages which the project is all about.</p>"
