      <p>As it happens, I was hacking a bit on Heilhveiti (a renamed Vollkorn) a short while ago. Its design height is 1000 units (750A+250D), so one can take that as its em height as well. Its space (#32) is 200 units, making it one-fifth of an em.</p>
