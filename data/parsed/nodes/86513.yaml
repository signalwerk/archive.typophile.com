      <p>The colophon of my 1975 edition of the <em>Lexique des règles typographiques en usage à l'imprimerie nationale</em>, that has been <em>the</em> reference for many years, says it was printed in monotype Baskerville  by Imprimerie nationale. Presuming they applied their own rules, I looked at a few of their semicolons and started doubting their thin space was really as much a fourth of an em. Now, the top is a picture of the end of a line (page 38), so that no space has been squeezed or expanded for justification. At the bottom is the Monotype Baskerville I have on my mac. The point size I used is 10. To get the same spacing as the original, I had to add a kern of 150 before the blanks; and to get the semicolon where it is, I had to add a kern of 80. Now you tell me the size of the space added before the semicolon; I don't know what units inDesign is using.</p>
