      <p>A thin space has never been any one thing. If you ask an old Linotype (linecaster) operator, he'll tell you a "thin space" is an unexpanded spaceband. The linecasters weren't on an em system; if thin spacebands were used, an unexpanded spaceband was about 2 points. IIRC, Monotype was a 5-to-em space. Some took it as 6-to-em. The Chicago Manual at one time specified a thin as a 4-to-em, but no good comp I knew ever used that. Oddly enough, in those days Chicago used someone not at Chicago for there typesetting/printing definitions, and that person (a designer) happened to be at odds with the world. See <cite>Glossary of Typesetting Terms</cite>.</p>
      <p>* * *</p>
      <p>I believe the way InDesign works is if the space characters aren't in the font (most fonts lack them), InDesign uses a formula. It is documented. If the spaces are in the font, InDesign will use them. Unicode now defines the values, though of course, you can use what you want. I usually use about .055 em for a hair space, and .160 for a thin (close to 6-to-em). The 3-to-em, 4-to-em and I believe 5-to-em are also provided for by Unicode, in addition to "thin" and "hair"</p>
      <p>BTW, CS4 for windows had a nasty bug. If (1) you did have the space characters in the font, and (2) used 9 of them on a single line -- say, ens, as happens on a cip page, and (3) had "view invisible characters" (close to that, anyway,) "on," the program would crash every time. Miguel Sousa at Adobe checked it out, and reported that bug isn't in CS5, and wasn't in CS3. Life is strange.</p>
