      <p>Here are a few examples that show more clearly the problem of defining thin spaces (or at least punctuation spacing) in terms of the em size. In all the fonts I looked at, the em size is 1000. In Arno Pro Regular, the width of the space character is 190. If you define the thin space as the fifth of the em size, you get 1000/5 = 200, and a thin space that is then larger than the space. With 1000/6 you get 167. With 1000/8 you get 125, which is 66% of 190 and may seem acceptable to some. </p>
      <p>However, if I run a script to get the width of the space character in other fonts I got from CS3, I get still smaller values for the space width:</p>
      <p>ArnoPro-Display.otf                 158<br>
      ArnoPro-BoldDisplay.otf             150<br>
      MyriadPro-CondIt.otf                147<br>
      NuevaStd-Cond.otf                   129<br>
      NuevaStd-CondItalic.otf             104</p>
      <p>With Nueva Condensed, the space width is approximately equal to  1000/8, not to mention the Condensed italic.</p>
