    html: <p>I must confess that I fail to see the relevance of those values for the spacing in French punctuation. Indeed all those values are defined in terms of the em size; however, the eye can't  judge the spacing before a semicolon or an interrogation point in terms of the em size; all it can do is compare it  to  close by inter word spacing; with LaTeX, the inter word spacing is easily accessible as <code>\fontdimen2</code>  and I feel no guilt in redefining the French spacing used by the babel package in terms of it (and other easily accessible parameters), especially with fonts for which  <code>0.16667em</code> (the LaTeX thin space) is almost equal to the inter word spacing.</p>
