    html: <p>If you are using InDesign, you will notice that, for appearances only,  it acts as if all fonts are on basis 1000 when it comes to manual kerning and displayed values.  Apparently, InD calculates (with rounding) what a 2048 font would be if it were rounded down to one thousand units.  This is what is displayed in the InD kern value.  I assume it does not really change the actual value but just shows you a conversion factor value.</p>
