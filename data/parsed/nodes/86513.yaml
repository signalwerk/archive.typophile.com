      <p><em>I still don't know how kerning units are calculated... anyone? :-)</em></p>
      <p>Visually is the most effective—and time-consuming—way. Perhaps DTL Kernmaster 2012 will break the mold, but most of the algorithmic kerning programs or functions now available tend to make a number of bad decisions, which need to be undone manually.</p>
      <p>Another flashback to Ye Olden Days of Dedicated Typesetting Machines: the fonts available did not contain any kerning data, as a rule. Kerning was done after all of the keystrokes had been input by a simple search-and-replace function, on the assumption that the limited number of search pairs would cover most instances. In general, this was true, but one always had the option of going back in and modifying the source file if the output shouwed any glaring errors and/or omissions.</p>
