      <p><cite>Here are a few examples that show more clearly the problem of defining thin spaces (or at least punctuation spacing) in terms of the em size. In all the fonts I looked at, the em size is 1000. In Arno Pro Regular, the width of the space character is 190 . . .</cite></p>
      <p>Which is too bloody tight. The compositor can change the value of a nominal space in InDesign by changing the percentage from 100% to another value in the justification menu. Or, since it is an Adobe font, go into the font and change the value there. In an ideal world, this wouldn't be a licensing issue -- the last time I used TeX, the spacebands used were not from a font character.</p>
      <p>* * *</p>
      <p>Elsewhere on Typophile, Kent Lew has given his technique for determining the spacing values to use in InDesign with a particular font -- I believe he started by setting a page worth of text ragged right, then print it out, evaluate, and adjust. Of course, the values picked are subjective.</p>
      <p>But you're right, to have the word space subject to the whim of the type designer but have the other spaces "fixed" by convention is an oddity. Again, if you go into the font, you can change the vales of "thin" and "hair." (Well, you *could* change them all, but you'd fly in the face of defined fixed spaces.) Anther oddity of fonts, perhaps a legacy from Type 1 fonts where fixed spaces were rare, is giving the nobreak space character a value of 3-to-em, or even 2-to-em.</p>
      <p>* * *</p>
      <p>For teaching, the best advice is to inform students that all spaces in typeset material interact. For printed texts, that would include margins. Digital editions lack a true page, so page/margin spacing tends to disappear. But the relationship of character spacing, word spacing, and line spacing remains. The "proper" space around punctuation is in large part set by these relationships.</p>
    html_clean: |-
      <p><cite>Here are a few examples that show more clearly the problem of defining thin spaces (or at least punctuation spacing) in terms of the em size. In all the fonts I looked at, the em size is 1000. In Arno Pro Regular, the width of the space character is 190 . . .</cite></p>
      <p>Which is too bloody tight. The compositor can change the value of a nominal space in InDesign by changing the percentage from 100% to another value in the justification menu. Or, since it is an Adobe font, go into the font and change the value there. In an ideal world, this wouldn't be a licensing issue -- the last time I used TeX, the spacebands used were not from a font character.</p>
