      <p>Back in Ye Olden Days, before the democratizing of typesetting, dedicated phototypesetting systems generally made numerals en-space width and punctuation thin-space width. Since WYSIWYG was a far-away dream, this arrangement made setting tabular material a little easier and far more predictable.</p>
      <p>So, fast-forward to today: use a period to indicate a thin space and set its fill to 0% black/paper/whatever…</p>
