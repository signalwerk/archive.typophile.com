    html: <p>Finding the best looking amount of space is not the same as trying to translate yesteryears thinspace to what InD can understand.  Different fonts have different kerning.  Some may have built in space to accommodate the French preference either in default kerning, with contextual kerning, or even using language specific contexts. It is always best to look at the actual font you are using as it comes from the foundry before deciding if you want to augment the spacing. After testing in the language and text you are dealing with, you can see what needs to be done.  You might also make a note to yourself about which fonts need what adjustments and make a style sheet for later use.</p>
