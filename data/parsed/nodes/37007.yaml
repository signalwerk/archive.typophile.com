    <p>Tomorow I plan to print 3 A2 posters. All 3 posters are made up photos I took on my digital camera. I have printed photos taken on my digital camera at A3 before and they have been fine, but never A2. So Im worried the images would come out all pixalted.</p>
    <p>The dpi of the photos is 180, and I will crop them all down to A3.</p>
    <p>Do you think it will be okay to print A2?</p>
    <p>Thanks salot</p>
    <p>p.s What do you think of the poster? There are going to be 2 more in similar vain.</p>
    <p></p><div class="imageWrap"><img src="/files/IMG_4618_6096.jpg"></div><p></p>
