    html: |-
      <p>Resolution in printing industry is expressed in lines per inch (lpi). Resolution in the digital world is expressed in dots per inch (dpi). As a rule of thumb, dpi should be twice the desired lpi, at 100% size.</p>
      <p>So, to print your A2 posters (with image covering entire poster) using a 150lpi screen (a typical screen for today’s printer), you’ll need the digital image to be 300dpi at 420mm x 594mm.</p>
