    html: |-
      <p>Resolution is in the eye of the beholder.</p>
      <p>Most people can’t really distinguish detail under 150th — 200th of an inch or so... unless they’re dealing with A) really small things, like 9 pt type, or B) aggregate details, like smooth gradients and the like.</p>
      <p>And kepp in mind that distance plays a factor... nobody’s gonna see 1 inch details on a Billboard, but they’ll notice a 1/200th dot on a business card.</p>
      <p>I doubt you’ll have any trouble printing a poster at 180 ppi, unless it’s going to be on display and highly scrutinized.</p>
