    <p>The <a class="freelinking external" href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> (SOTA) has announced that <a class="freelinking external" href="http://www.erinmclaughlin.com" rel="nofollow">Erin McLaughlin</a> of New York, NY, will be the recipient of the 2011 SOTA Catalyst Award. The award was created by SOTA in 2010 to recognize a person thirty years of age or younger who demonstrates significant achievement and future promise in the field of typography. Erin will present her work and receive the award at <a class="freelinking external" href="http://typecon.com/" rel="nofollow">TypeCon2011: Surge</a>, taking place in New Orleans, July 5th–10th.</p>
    <p><strong>Winner</strong><br>
    Erin McLaughlin, 26<br>
    New York, New York</p>
    <p>The judges were unanimous in recognising the qualities of her <a class="freelinking external" href="http://www.erinmclaughlin.com/" rel="nofollow">Katari</a> typeface design:</p>
    <p>“This style of type requires great care to maintain recognisable letter structures within the apparently informal, roughly faceted outlines, and to affect the correct balance of weight and harmony between letterforms and across the various weights and style members of the font family. This has been accomplished very well, not only in the various weights of the Latin type but also in the Devanagari script companion.”</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ErinMclaughlin-550px_3512.jpg"></div><p></p>
    <p>“The project is well presented, in a visually exciting specimen that mirrors the characteristics of the type design at the page level. The designer’s research into Indian writing systems and the historical development of their typography is demonstrated, but has not constrained her to follow safe, well-trod paths. In conclusion, Katari is a fine achievement, and especially remarkable for having been a student project. Erin McLaughlin is a young designer who fully deserves the encouragement of the SOTA Catalyst Award.”</p>
    <p>This year SOTA is also extending honorable mention status to three individuals whom the judges wanted to acknowledge:</p>
    <p><strong>Honorable Mention</strong><br>
    Ian Katz, 29<br>
    Dover, New Hampshire</p>
    <p>The judges were impressed by the approach taken by this self-confessed non-typographer to a practical problem: how to automate grouping of different typefaces based on design similarity, so that users can see them ‘in the context of the visual landscape they collectively form’. Ian Katz’s day job is creating software for underwater robots, and his <a class="freelinking external" href="http://tinylittlelife.org/?page_id=255" rel="nofollow">FontClustr</a> tool is an admirable example of an outsider’s analytical approach to the problem of typeface categorisation or grouping.</p>
    <p><strong>Honorable Mention</strong><br>
    Kriti Monga, 30<br>
    New Delhi, India</p>
    <p>If the SOTA Catalyst Award were presented solely on the grounds of passion and enthusiasm evident in the submission, <a class="freelinking external" href="http://turmericdesign.carbonmade.com/" rel="nofollow">Kriti Monga</a> would have easily won. The judges were delighted by the examples of hand lettering, sketches and tattoos in this submission, as well as by the overall quality of the presentation and evident enthusiasm. Her work is consistently playful but never becomes sloppy, and even her most informal letters are carefully balanced to create a pleasing composition.</p>
    <p><strong>Honorable Mention</strong><br>
    Maximiliano Sproviero, 23<br>
    Buenos Aires, Argentina</p>
    <p>Maximiliano Sproviero submitted the second most accomplished individual typeface design, <a class="freelinking external" href="http://new.myfonts.com/fonts/argentina-lian-types/reina/" rel="nofollow">Reina Pro</a>. This is a complex display typeface incorporating both inline variants and hairline flourishes to a nicely heavy romantic letterform. Great skill is shown in the detailing, and an excellent feel for the correct flow of curves and displacement of stroke weight. The submitted specimen is both stylistically consistent and technically informative.</p>
