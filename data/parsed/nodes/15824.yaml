      <p>I was drawn to typography by a long road of literary study &amp; writing mixed with some fine arts background, which eventually led to the combination of these in approaching the letterforms I’d been studying for years as text. This, anyway, is what brought me to publishing, and publishing to book design, and book design to typography and type. </p>
      <p>This has been the professional route anyway. Just as important, however, has been the personal process. Hrant will likely grunt at this, but it strikes me as no surprise that I’ve been drawn into this stuff as a profession as well as an interest. I say this because, well, I’m not all that sociable. I prefer to work from home, or, better yet, from the small cabin I live in during the summer. I prefer to work slowly on a project that is painstaking in its demands, yet quiet in its result. There is a huge sense of accomplishment when I finish a project I’ve worked on for months, yet a large part of my approach is to remove myself from the project as much as possible. I like the relative annonymity. The internet, of course, has made this much easier in terms of working with/for clients, but my laptop also allows me to work from that little cabin, or anywhere else. </p>
      <p>I suppose what I’m attempting to get at is that while graphic designers tend to be quite social, trendy, hipster types, typographers &amp; type designers tend to be a bit withdrawn &amp; quiet (I know, a gross generalization). At least for me anyway, as much as my aesthetic &amp; formal training led me here, it was my personality that pushed me to pursue the finer and more understated points.</p>
