      <p>Type is an integral part of my visual palette. But whereas the common observer can generally recognize and relate to the imagery of photos, illustration, color, graphic shapes — type remain the most subtle element yet strongest in influence.</p>
      <p>Type is a micro-study visible to only a few... it’s almost magical what can be done with it and even though I’m an expert, it never ceases to amaze me.</p>
