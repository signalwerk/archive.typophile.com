      <p>One of my favorite quotes about type (and one reason why I like it). Regiomontanus in 1475, from Carter’s <em>A View of Early Typography</em>, pp. 40—41.</p>
      <p><cite>In the workshop an astrarium is kept in continual motion: a thing marvellous to behold; and other instruments are being made for observing the heavens, as well as appliances for everyday use, whose names it would be tedious to recite. Last of all it has been decided to practise the wonderful art of making printing type for lasting records, and may God prosper it! Once that is mastered, though the workman die soon after, death will have no bitterness for him, knowing as he will that he has left to posterity a gift to save them for ever after from want of books.</cite></p>
