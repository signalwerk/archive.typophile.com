    <p>As announced on the OpenType List, but posted here as a reminder and as an FYI for those not on the list.</p>
    <p>At the request of some in the community we've organized opportunities for those interested in color fonts, color font formats and rendering technology to meet at TypeCon and ATypI. </p>
    <p>At TypeCon the organizers have kindly provided us a room on Saturday August 24th at 3pm (for two hours) - there will be a call in number for this meeting (contact me directly if you want to call in). </p>
    <p>At ATypI the organizers have also provided a room on Thursday October 10th at 1.40pm (for two hours twenty minutes) - there will likely be a call in number for this meeting too.</p>
    <p>I'd like to thank Grant (SoTA) and Barbara &amp; John (ATypI) for facilitating these meetings.</p>
    <p>Thanks, Si</p>
