    html: |-
      <p>At the moment, and unless things change drastically, I'd say there's a pretty good chance that we could end up with multiple solutions, each with its particular benefits and coverage areas.* On the whole, most attention seems to be on the two vector formats: Microsoft's glyf/COLR/CPAL model and the SVG-in-OT model from the W3C community group championed by Adobe and Mozilla. As Adam pointed out, though, Google's bitmap model is worth considering because, like the MS vector model, it is a small and nifty addition to existing sfnt structures.</p>
      <p>If anyone is going to compile a table of pros and cons for each model, I'd recommend distinguishing pros/cons for different parties. Obviously the SVG model has more pros for companies that have already invested in SVG support, and have most of the infrastructure they would need in place. Obviously the glyf/COLR/CPAL model has specific pros for rendering environments that still make use of hinting.</p>
      <p>And if things do change drastically? I think the biggest question is whether MS will expand their model to handle gradients and animation. If they do, then their approach will be in direct competition with the SVG model, and there would be less reason for the ISO MPEG committee to contemplate standardising both.<br>
      _____</p>
      <p>* At the meeting, I posited a use case in which a font developer might end up including both COLR/CPAL data and SVG data in the same font, for different ranges of characters.</p>
