    <p></p><div class="imageWrap"><img src="http://typophile.com/files/googWebFonts_4754.png"></div><p></p>
    <p>why's the "h" ascender above the capital "T" in some instances, but not in others?</p>
    <p>are there certain categories of typeface where this tends to be the norm?</p>
    <p>for example, looking at slab, they are more uniform in height -- at least from what i can see. But, then there's the occasional slab face that bucks the trend, and has ascenders taller than caps.</p>
