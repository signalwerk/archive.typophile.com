    html: <p>IIRC making the cap height lower than the ascender was an innovation of Griffo, in the Bembo type. This helps to make the 'color' (grey) of the caps more similar to the lower case. There are other ways to do this, and also it's a choice how much the designer wants to make the caps and lower case similar in color or different.</p>
