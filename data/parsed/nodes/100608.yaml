    html: |-
      <p>Also, since uppercase letters are generally wider (and contain more white) than ascenders, they tend to appear “bigger”. Reducing the size of the uppercase can help balance a word better. This gets less pronounced in large sizes. I suspect that has something to do with the trends you observe: e.g. intended for display vs. intended for text. </p>
      <p>Keep in mind not all type designers make concious decisions. Many just do whatever the others did.</p>
