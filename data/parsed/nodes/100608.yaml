    html: |-
      <p>What George said, plus:<br>
      - The smaller the x-height the more sense it makes to have shorter caps.<br>
      - If you want the text to be more "scannable" (which usually involves capitalized proper names) you should make the caps stand out; otherwise make them blend in.<br>
      - In onscreen rendering small differences between cap height and ascender height are made to disappear.</p>
      <p>hhp</p>
