    html: |-
      <p>gargoyle linked to a thread in which nick shinn makes a good post.</p>
      <blockquote><p>
      Note that Jenson's face had massive ascender-height capitals, but Griffo made the improvement soon after ("Bembo" the typeface).<br>
      550 years ago.</p>
      <p>However, the modern style put caps at ascender height, 200 years ago.</p>
      <p>So, a different strategy for oldstyle and modern.</p>
      <p>Carter's Olympian was the first 20th century news font to have ascenders taller than caps.<br>
      This trend has continued, and now faces like H&amp;FJ's Chronicle leverage this effect mightily.
      </p></blockquote>
      <p>"Reducing the size of the uppercase can help balance a word better. This gets less pronounced in large sizes. I suspect that has something to do with the trends you observe: e.g. intended for display vs. intended for text."</p>
      <p>i went through all the ads in a copy of esquire, which was laying around. in only one instance, ascenders were taller than caps for display faces -- and it was marginal.</p>
