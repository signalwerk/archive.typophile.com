      <p>Don, I don't believe that Walden did anything original - although I can't find the source of Beveled just now. Rick Mueller did only a few original fonts. Both were amongst the earliest digital revivalists.</p>
      <p>Regarding Octagon, see <a href="http://old.myfonts.com/fonts/intellecta/octagon-french/" target="_blank" rel="nofollow">Intellecta's version</a> - which includes some historical info. Jordan Davies created <a href="http://old.myfonts.com/fonts/woodentypefonts/octagon/" target="_blank" rel="nofollow">a version</a> as well.</p>
      <p>Oh, and these font are also known as prismatic, I believe. A search on that word will yield lots of such fonts. You don't see many narrow, modern prismatic fonts, but The Fontry offers a couple in its <a href="http://www.thefontry.com/racepak1b" target="_blank" rel="nofollow">Race Pak</a>.</p>
