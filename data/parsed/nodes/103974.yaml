      <p>Again mcfee, I don't know if its a font or artwork. The are a number of similar fonts, which are commonly described as angled/angular and beveled/faceted. Google will pop them up for you. Allen R. Walden's Beveled of 1993 and Rick Mueller's Angles Octagon of 1992 are cleanly executed. I believe they are  original but I am not certain. So no links. Most angular/breveled are heavier in weight than the net magazine version and, so far, the only one I have found with a similar v is, <a href="http://www.hypefortype.com/browse-fonts/font-categories/experimental/bd-emerald.html" rel="nofollow">BD Emerald</a>.<br>
      Don</p>
