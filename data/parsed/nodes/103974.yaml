      <p>Well Vic, I didn't recognize this as a font off hand so I started a check of the usual sources. I suggest that the font was made by eroding a monoline slab serif like <a href="http://www.myfonts.com/search/rockwell/fonts/" rel="nofollow">Rockwell, Nexa Slab, Brix Slab, Stafford Serial, </a> or something else.<br>
      The main problem is an eroded font has no particular style, and when it is tagged for sale by vendors such as MyFonts it could be tagged as any of the following: eroded, antique, vintage, rough, distressed, grunge, or something else. Also many typewriter fonts receive a destructive treatment and some end up looking similar to _net_.<br>
      Searching tags at MyFonts, and similar themes at dafont and elsewhere, yields quite a few similar fonts but nothing identical that I was aple to ID as an exact match.<br>
      Magazines sometimes commission a font for exclusive use, and may release it for public sale by the designer after a period of years.  For example, Martha Stewart commissioned the polar opposite of this logo when it bought a severe geometric sans serif now sold as Benton. You can still see the font in use in the magazine logo and throughout the magazine. For the second time today, I can say "it's a good thing!"<br>
      The _net_ logo lettering seems not to be in use elsewhere in the magazine, which makes it unlikely that it is a special font.<br>
      But I have been wrong before.<br>
      In any event you can produce something similar from the victim font of your choice by various techniques. Here is a link to one: <a href="http://fontfeed.com/archives/tip-the-wornweatheredstamped-look/" title="http://fontfeed.com/archives/tip-the-wornweatheredstamped-look/">http://fontfeed.com/archives/tip-the-wornweatheredstamped-look/</a><br>
      Don</p>
