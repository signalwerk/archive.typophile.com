    html: |-
      <p>Helvetica spelled with a K is incorrect. The mythology around Helvetica's nazi roots and the so-called "german spelling" has been explored <a href="http://typophile.com/node/32405" rel="nofollow">here on typophile</a>. I wrote about its <a href="http://starwarsmodern.blogspot.com/2010/03/helvetica-is-not-fascist-font.html" rel="nofollow">misidentified fascist history</a> in the spring, and mention this as well. </p>
      <p>Oh Suzy Rice, who let you in the party?</p>
      <p>Don't know much, myself, about Windows 7 or its typographic platform. I know MS introduced a slew of nicely designed albeit sort of bland new fonts with either Vista or 7, but it's all fuzzy to me. There are, however, lots of folks on here who could probably answer this.</p>
