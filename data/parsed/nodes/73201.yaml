    html: |-
      <p>If you run Mac OS, Apple has already licensed it from Linotype for you. If you don't, you'll have to license it from Linotype (or someone else with another cut) yourself.</p>
      <p>And FWIW, "Helvetiker" sounds like a cheap knock off... letter forms may be copied but the rest of the font may be junk.</p>
