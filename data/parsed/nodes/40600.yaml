      <p>Stefan, we often locate fonts there, and link to them, because we get many ID requests for things that are obviously made from amateur/freeware fonts. Dafont organizes their fonts by categories, and lets you set a test phrase and search the entire category — one of the most useful capabilities for IDing fonts. They have also been very good about removing any font that you tell them is a rip-off.</p>
      <p>- Mike Yanega</p>
