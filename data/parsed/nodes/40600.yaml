      <p>Sorry, but If you ask me to be a supporter of Dafont, That will never happen. They used to have a rip-off of Oxtail (called Cleopatra) up before. I have to be quite angry before they removed it. And of course the rip-off is still around in other “free-fonts sites”...</p>
      <p>I could imagine a site with all the “official” free-fonts from respectable foundries in one place. With a clear definition of the usage etc. Maybe with registration etc. But to me sites like Dafont is and will be sites with low morale and respect for all of us that are trying to make a living on type design.</p>
