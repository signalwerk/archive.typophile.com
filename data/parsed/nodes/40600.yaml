      <p>Dennis, the problem with saying it was just innocence is that we both know that it is not always just innocence. Especially here on Typophile where most (if not all) of us know that it is wrong. Continuing to say it is innocence is also, in a way, brushing it under the carpet and letting the practice continue. </p>
      <p>I think sites like DaFont, who have been removing fonts when they are told about their questionable origins, should take a stronger stance if they wish to ever be considered a reputable source for free fonts. Otherwise, I cannot in good conscious and without hesitation recommend them as I’ll never be able to guarantee the true origins of the fonts. </p>
      <p>The dafont links are left on Typophile as Stephen has said they are doing what they can to remove links when told to do so.</p>
