  html: |-
    <p>Hello... Im designing a logo and have been experimenting with Areplos... which I really like.</p>
    <p>The company is B2B, high tech, makes interactive sales tools for Merchandising companies.<br>
    Most of these companies in the consumer electronics field.</p>
    <p>So, Ive used Areplos and it really looks fab... now I'd be interested in seeing if I could couple it with another face.<br>
    Perhaps a face that is just a touch less serif....... maybe not.</p>
    <p>If a complimentary face to Areplos comes to mind, let me know... and thx!</p>
