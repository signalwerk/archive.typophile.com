    html: |-
      <p>Chris, that's a good question isn't it? One of my favourite quotes, by Beatrice Warde, is "People who love ideas must have a love of words. They will take a vivid interest in the clothes that words wear.” That's how I see it: We do see the words, but we see what they're wearing, too.</p>
      <p>When my husband woke up the next morning and I told him that he had fallen asleep in the middle of my *extremely* interesting story, he replied with, "Honey, it's like you're reading from the Sears catalogue". I was completely shocked.</p>
  - id: 130117
    user_id: 12577
    user_name: BruceS63
    user_path: null
    user_image: /files/pictures/picture-12577.jpg
    date_raw: 20 Jun 2006 — 8:21am
    date: 2006-06-20T08:21:00
    votes: null
    html: <p>My Dad is a retired commercial airline pilot, and flying is his reason for being. I told him this weekend that when I was a kid I remember him and other pilots standing around at an outdoor party talking about the pros and cons of different types of propellers. I had always wondered why they cared so much. One day I realized I was just as excited about different types of serifs as they were about props. And my wife is the one who rolls her eyes now.</p>
