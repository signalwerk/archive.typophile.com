      <p>I have recut <a href="http://omnium.danmilne.fastmail.fm/files/omnium_sans_107.pdf" rel="nofollow">omnium sans.</a></p>
      <p>I have further simplified the curves and terminals and have removed most of the flaring from the stems, so that it better matches its <a href="http://typophile.com/node/14576" rel="nofollow">serif counterpart.</a> I see this sanserif as a secondary typeface for the serif, so I don’t want it to compete for attention.</p>
      <p>I have also simplified the s, which I felt was disturbing the peace <a href="http://omnium.danmilne.fastmail.fm/files/omnium_sans_65_ital_44.pdf" rel="nofollow">before.</a></p>
      <p>Oh, and I’ve loosened up the spacing some.</p>
      <p>I appreciate any feedback you can provide.</p>
      <p>Thanks very much,</p>
      <p>Dan</p>
