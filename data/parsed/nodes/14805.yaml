    <p>This is Omnium Sans. He is the shy younger brother of Omnium Serif. He hasn’t actually talked yet but he seems very reserved and he has a much quieter personality than his sister. He has similar aspirations, but tends to follow in her shadow, supporting her and allowing her to have most of the glory. This dynamic makes them happy playmates, I think.  </p>
    <p>Like his older sibling, Omnium hopes to grow up to be a text typeface. His family history suggests that he’ll be about 10pt tall. His sister is a semi-light-- more of a book than a regular—and he hopes to follow in her footsteps, appearing the same colour on the printed page.</p>
    <p>They definitely have the same parents, or do you think the postman was involved?</p>
    <p>A PDF of Omnium Sans can be viewed here:</p>
    <p><a href="http://omnium.danmilne.fastmail.fm/files/Omnium_sans_30.pdf" title="http://omnium.danmilne.fastmail.fm/files/Omnium_sans_30.pdf">http://omnium.danmilne.fastmail.fm/files/Omnium_sans_30.pdf</a></p>
    <p>The Typophile Thread for Omnium Serif is here:</p>
    <p><a href="http://typophile.com/node/14576" title="http://typophile.com/node/14576">http://typophile.com/node/14576</a></p>
    <p>I’d love to hear your thoughts.</p>
    <p>Thanks,</p>
    <p>Dan</p>
