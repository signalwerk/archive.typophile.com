      <p>Here is a <a href="http://omnium.danmilne.fastmail.fm/files/omnium_sans_65_ital_44.pdf" rel="nofollow">revised version</a> of Omnium Sans. I’ve added the italic and small caps.</p>
      <p>Along with some minor changes to the character shapes, I’ve increased the weight of the roman slightly and tightened it up considerably. I’ve had a lot of trouble with spacing the roman: in trying to match the serif in colour. Any suggestions?</p>
      <p>I haven’t touched the kerning pairs yet.</p>
      <p>I'd love to hear your observations / criticisms.</p>
      <p>Cheers,</p>
      <p>Dan</p>
