  html: |-
    <p>Crafting Type is coming to Portland!</p>
    <p>A 3 day intensive class, morning to evening and Saturday-Monday, for anyone wishing to start designing type or to quickly move their existing skills forward.</p>
    <p>Instructors confirmed are Thomas Phinney, Dave Crossland and Octavio Pardo, with Eben Sorkin and Vernon Adams lined up to keep the student:instructor ratio low if a lot of people sign up.</p>
    <p>Pacific Northwest College of Art is hosting the event, and its priced low for students ($300) and professionals ($500) with good discounts for AIGA/ATypI/TUG members ($400)</p>
    <p><a href="http://craftingtype.com" title="http://craftingtype.com">http://craftingtype.com</a></p>
