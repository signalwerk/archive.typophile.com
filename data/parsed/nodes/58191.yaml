  html: |-
    <p><a href="http://dezcom.com/typefaces/squeeze/" rel="nofollow">Dezcom Typefaces</a> is happy to announce the release of its first commercial typeface and plans several more releases in the near future.</p>
    <p><strong>Dez Squeeze Fat</strong> is a full-figured display face. It is generous enough in weight and width to make you a knockout! Heads will turn from ho-hum to hard-hitting with this face. Don’t apologize for your size—the ample look will speak volumes to your audience.</p>
    <p>When you don't want to speak softly, Squeeze can shout above the crowd. Say it loudly and proudly, this face does not have a weight problem.<br>
    The Dez Squeeze Family was developed as a clean OpenType display face with a super-bold weight<br>
    Dez Squeeze has 483 glyphs with uppercase, lowercase, proportional lining figures, unicase, stylistic sets, alternates, ordinals, and case specific punctuation. It has a full range of diacritics and covers all European languages using the Latin script.</p>
    <p><a href="http://dezcom.com/typefaces/squeeze/" title="http://dezcom.com/typefaces/squeeze/">http://dezcom.com/typefaces/squeeze/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/KO-kid_550_5795.jpg"></div><p></p>
    <p>ChrisL</p>
