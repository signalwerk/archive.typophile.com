    html: "<p>Some suggestions after macro viewing <br> <br>R: Leg needs more weight and a hair more length <br>M: Try a traditional stroke modulation. Right now you have thick, thin, thin, thick. The traditional goes thin, thick, thin, thick. It can be minute modulation, but I think it will improve. <br>E: Hard to tell about the arms, they look like they might not be exactly horizontal based on the anti aliasing. The top arm may be a bit light. <br>g: Maybe less angle in the waist? <br> <br>Randy <br></p>"
