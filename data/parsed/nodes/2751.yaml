    html: "<p>This is nice. Generally I like the straight lines in the terminals. The exit on the a reminds me of Renaissance serifs, but the overall feel is kind of a friendly Realist type. <br>Specifically:  I like the two storey a better than the single one. It looks like the B is leaning bacwards just a tiny bit. Ww is cool. g is neat but maybe its ear could be bigger? <br> <br>Looking forward to more. <br> <br>Jon</p>"
