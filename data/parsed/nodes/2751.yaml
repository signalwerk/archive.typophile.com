    html: <p>Good point on the g ear, Jon.  It definitely needs to be a bit more defined - it looks weak at small sizes.  I just noticed that the lc e seems to be tipsy - I can't figure out whether it is tilting forward or backward.  It may be that you have attained a perfect equilibrium with it, but there seems to be almost a tension, and maybe that's what you were hoping for.  I don't see the B leaning backwards, but Jon may well have more refined eye on that one.</p>
