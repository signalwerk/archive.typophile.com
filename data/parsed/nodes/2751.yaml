  html: <p>Hi typophiles. I want to show you a typeface I'm currently working on. Her codename is Revista and her purpose is to be the "corporate face" for my studio. No figures, no punctuation, and not kerning yet (Illustrator phase). <br>Let me read your suggestions! <br><img src="http://www.typophile.com/forums/messages/29/24402.gif" alt="revista1"></p>
