    html: <p>"Every company has his own standards. Everyone typeset their docs as they want. I don't think there's a standard imposed by a law." <br> <br>Not quite. There is a minimum type size required by law, or the contractual information is not considered binding. I had an acquaintance get out of a contract based on this defense. I can't recall the measure off hand but it is based on old Linotype metal type size standards. Linotype was used in setting legal documents because of oft required line changes that were facilitated by the Linotype process. And, though not used much anymore, the metal type size is still the legal standard.  <br>  <br>Gerald</p>
