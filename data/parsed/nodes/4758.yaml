    html: <p>Avante Garde hurts my stomach every time I see it.  In the mid-eightys, when the computer industry chose Avante Garde as one of the original 35 "freebe" fonts included with every laser printer, it made me ill to think that the world would be flooded by pages of it instead of something well designed like Futura.  Luckilly, computer companies are more likely to consult good typgraphers these days. <br> <br>ChrisL</p>
