    html: |-
      <p>O no, on the contrary, it has very strict standards. So far as I can see, its idea of 11-point rests on either the x-height or the ascender height (not clear which) of 11pt New Century Schoolbook -- it's own preferred typeface. There seems to be some degree of confusion as can be seen from the following extract from the <a href="http://www.supremecourtus.gov/casehand/guidetofilingpaidcases.pdf" target="_blank"> guide to filing paid cases</a>. <br> <br><br>
      </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>The petition shall be typeset in traditional Roman 11-point or larger type with 2-point or more leading between lines. Footnotes must be 9-point or larger with 2-point or more leading between lines. Please note that computer generated �Roman� type is smaller than traditional Roman type and you may need to increase the font size. Any type that does not measure on a typesize finder to be 11-point for the body and 9-point for footnotes will not be accepted. There is a discrepancy between what traditionally is considered 11-point type and what today�s computers refer to as 11-point type. The problem encompasses both typeface and type size. The Roman type mentioned in the Rules refers to traditional roman type (as opposed to script or italics). It does not refer to computer-generated "Roman" such as "Times New Roman" font. Likewise, computer-generated 11-point type size does not always correspond to 11-point type size produced using traditional printing methods. The typeface should be similar to that used in the current volumes of the United States Reports. Rule 33.1(b). New Century Schoolbook 11-point type closely approximates the typeface used in the United States Reports. Times New Roman is acceptable if 12-point type is used for the body of the petition and 10-point type is used for footnotes.<!---/quote-!--></p><hr size="0"></blockquote>
       <br><p></p>
