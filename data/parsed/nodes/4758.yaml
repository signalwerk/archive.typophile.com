  html: <p>Heya 'philes, <br> <br>Can anyone explain (or point me somewhere that explains) about typographic standards in legal documents - such as End User License Agreements? They often contain HUGE BLOCKS OF CAPITALS THAT GO ON FOR SENTENCES AND SENTENCES. Ostensibly, these are in capitals because they are more important; the irony of course being that this type is the most difficult to read of all. <br> <br>I looked at this thread about business documents and wasn't led to believe that there were any legal obligations to the typographic standards (akin to cheques being invalid when signed in red ink). <br><a href="http://www.typophile.com/forums/messages/4100/28059.html" target="_blank">http://www.typophile.com/forums/messages/4100/28059.html</a> <br> <br>Is this simply an aesthetic default by the legal profession? Or are we free to improve the readability of our legal documents? <br> <br>Help is much appreciated.  <br> <br>Cheers, <br> <br>Jon Parker <br>Veer <br> <br>P.S. Thanks for everyone's input on my last query about word spaces. See the April catalog to see how I employed them. <br><a href="http://www.veer.com/download/pdf/veer200404.pdf" target="_blank">http://www.veer.com/download/pdf/veer200404.pdf</a> (16MB)</p>
