    votes: null
    html: "<p>It's a shame they dumped Eureka. I have this hunch that they -rightly- thought its readability is low, but they -stupidly- didn't realize that it's just the loose letterspacing: negative-track it a bit, and it becomes the solid text face it was intended to be. <br> <br>hhp <br></p>"
