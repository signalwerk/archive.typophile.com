      <div class="comment-spam-body"><blockquote><p>It is not clear to me from your description what you are trying to learn from studying the type. What question do you have? What problem are you trying to solve?</p></blockquote>
      <p>I want to study how the shapes of letters but predominantly the details affect the rhythm, texture and color of text.</p>
      <p>I've done some experiments in extreme texture in the past but that's just one aspect of type. Right now I'm doing a study into typography in a more general sense but I also look up the extremes in weight, texture and color. What I want to do now is start a study that is an extension on that one but looks in a more particular area, rather than looking into typography as a whole.</p>
      <blockquote><p>Martin, are you dismissing Georgia because it is a “screen” font?</p></blockquote>
      <p>I haven't dismissed anything just yet. If you can make a point on how Georgia is the typeface I should pick, I'm willing to consider it. What I am dismissing is the notion that Georgia is the best option because it was marketed for its clarity on screen 20 years ago. I'm not at all convinced in those 20 years a better typeface for my current requirements hasn't presented itself.</p>
      <blockquote><p>I recommended Georgia because it is transitional, i.e. not favoring old style or modern, and because of its huge distribution as a Microsoft Core TrueType font.</p></blockquote>
      <p>Actually last week I was considering perhaps it's not about finding the typeface that is most standard in my requirements but about selecting a typeface that meets my requirements in some ways but is also prolific through its use. Why would I compare typefaces to Kristal (just a random example) if no one has ever heard of it? Perhaps I should stick with typefaces like Georgia because they've become a cultural standard.</p>
      <p>If that is the way to go, what sans would you recommend? Myriad has become a standard, but it might be too particular. Franklin Gothic is also too particular. Perhaps Akzidenz Grotesk?</p>
      <blockquote><p>I mentioned a typeface in a light weight simply because then the ascenders and descenders would be less visible, and that would contribute to uniformity.</p></blockquote>
      <p>How would that work? Aren't the core letter shapes going to be lighter in proportion to the ascenders and descenders? Shorter ascenders probably contribute to uniformity.</p>
      </div>
