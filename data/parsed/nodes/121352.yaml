      <p>I find the reply Delphic in its brevity.</p>
      <p>Had the original post come from a new poster, rather than someone who is a long time poster here and a typographic professional, though, I would have tended to give this kind of advice:</p>
      <p>Start with the basics. Overall texture might tend to be more uniform in two cases -</p>
      <p>A typeface with a large x-height;</p>
      <p>A typeface in a light weight - that is, one with thin strokes.</p>
      <p>In both cases, the ascenders and descenders are less prominent, although in the second case, that isn't really true <em>relative</em> to the part within the x-height, present for every letter.</p>
      <p>Only after the simple and obvious is dealt with can one look at non-obvious impacts on overall texture by the characteristics of specific typefaces. Of course, there's lots of room for other things to have an effect; how heavy the serifs are; the way letters like "e" and "c" are shaped that are open in part within the x-height region, and so on.</p>
      <p>But an approach that looks at one typeface at a time, and that subjectively, seems to risk getting lost.</p>
