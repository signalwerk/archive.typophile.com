    <p>I've recently been doing a lot more research and personal studies in type. I'm thinking of doing an elaborate study on the perception of text, where I set a page in a certain typeface and analyze why the text is being perceived in a certain way. For example, in Maiola has a rather rich texture so if I were to analyze this typeface, it would be predominantly a study in which specific elements cause the texture to increase.</p>
    <p>I would also be looking at why specific letters in a typeface are designed a certain way. J. Harris did experimental studies and found that serifs on the lowercase counters appear to reduce visibility, so in the typeface Spencer these elements are removed. Letters like h/m/n are missing the inner serif on the right side and features the suggestion of a serif on the left side and the /b features no spur. What are the benefits and what are the consequences of such decisions?</p>
    <p>This would probably be an ongoing study until I feel I've reached a point where the amount of analysis done results in meaningful insights. I could start with a random typeface but I thought it might be better to pick one typeface or perhaps one typeface from sans and serif to use as a standard which I can compare any other typeface I analyze to. I'm aware there's no neutral or standard typeface but which typeface I select is in some ways arbitrary. What I'm looking for is a typeface that doesn't do a lot of strange things, makes use of elements as we probably most expect it and has more or less standardized proportions. I think for the analysis it will be better if I select a typeface with a very consistent rhythm as well. I wouldn't want to select a humanist typeface because it takes too much time to explain the dimensions of a random typeface compared to the humanist typeface. Or quite possibly a humanist typeface is exactly what I need considering it's the first emerging style of typefaces and could therefor more or less be considered a standard. Frank E. Blokland makes an interesting case for the idea that the initial dimensions have been standardized during this period. On the other hand, the humanist model doesn't have the most even color so it probably fails my requirements in that regard.</p>
    <p>So my question was going to be whether you can recommend one or a few typefaces that could be used as a standard in my studies, but the issue is a bit more complicated. So any help in considerations in how to go about this are very much appreciated.</p>
