      <p>Nick, that's a rather disappointing answer. As far as I'm aware Georgia was designed for clarity on computer monitors and not to provide the most even rhythm and both most generic and most consistent features. It might equate to the same in some regards, but I'm also skeptical about Georgia still being my best choice after 20 years.</p>
      <p>I must also say, perhaps it's just me but I didn't even consider Georgia for a moment because I sporadically try to set my essays in Georgia, thinking it provides clarity and comfort but I'm always disappointed. I keep trying but I've never used Georgia successfully. It just provides a very wrong texture which I find uncomfortable to read.</p>
      <blockquote><p>A typeface with a large x-height;</p></blockquote>
      <p>My concern is that the large x-height is a trend of recent years while I'm looking for a standard sans and serif typeface to compare all typefaces with. I think it's actually impossible to find a typeface with my requirements. I think I should define standard typefaces for each bigger subclass. Perhaps define a typeface for old style and one for transitionals (ignoring Didones for a moment). I could also define a typeface for Venetian, Garalde and transitionals, making it possible to go into more detail about the distinctions between different typefaces within the same subclass. The problem I'm foreseeing with this is that a lot of modern typefaces can't be clearly categorized. I've seen interpretations of Jenson that are so far off I wouldn't even call them humanist anymore.</p>
      <p>And this is another reason why Georgia is perhaps not the best choice or not the only choice. Like I said, there are many considerations to be made here. I have my own ideas on how to go about this but I would like some validation and other people's opinions. I will get more insight into the issue by simply doing experimental research but I thought I would first ask you guys as I like to start with theoretical research first.</p>
      <blockquote><p>Had the original post come from a new poster, rather than someone who is a long time poster here and a typographic professional, though, I would have tended to give this kind of advice:</p></blockquote>
      <p>Do you feel I shouldn't have had to ask what I asked? I think my question isn't quite as simple as you make it sound by the kind of responses I'm getting.</p>
      <blockquote><p>A typeface in a light weight - that is, one with thin strokes.</p></blockquote>
      <p>Why do you feel that is important? A concern here is that not all typefaces I would be testing have a light range. Gilman, Maiola and Premiéra for example only feature the regular and bold weights.</p>
