    <p>Hello,</p>
    <p>I am currently thinking about ways to make my logo more memorable. I am running a web design business, but rarely venture out into logo design.</p>
    <p>The logo should be as simple as possible, so as to not distract from the portfolio on my website. It shouldn't be too high either, so it fits neatly in the header of the website.</p>
    <p>Please let me know if you think that I am on the right track here or what could be improved.</p>
    <p>Thanks for any feedback.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_6500.png"></div><p></p>
