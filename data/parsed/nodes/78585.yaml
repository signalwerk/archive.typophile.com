    html: |-
      <p>Well, these are certainly "designer gears" - they look pretty, but they can't spin! :)<br>
      Don't take it the wrong way. but have you considered talking to a logo designer? Some of the guy are incredible at twisting their brains and conceptualizing... you said you wanted it memorable, in which case it really needs an outstanding concept on top of great execution. </p>
      <p>What I am getting at is that a pair of gears is not exactly memorable, it needs something else, an AHA moment. For example, quirky locked-up gears could actually work if the lock-up condition is emphasized (and coupled with a semi-humorous tag line), but then it becomes a perception issue of your company being great at design but ignorant of engineering details. Another idea to explore would be to try and build gears out of, say, ampersands... </p>
      <p>In short - you need a better concept.</p>
