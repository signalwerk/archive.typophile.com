    html: <p>i most definitely cannot deny the fact this redesign is very nice. in the few times i've picked up older issues of print (including the one i borrowed from our little library today) it's easy to see this is much more clean and readable. eye-friendly. BUT, putting the fact aside that this is a change and improvement on something that already existed, i'm curious to know why, if this magazine made it's debut today, why we'd like it's design. unfortunately, i'm coming off as dense and uneducated which i regret to do, but i'm more curious as to what designers think about good page layout and design. like what makes those things click in our heads while the pieces fall together. as i work with a magazine currently doing design and layout i feel i can never learn enough, and it was the one subject of design education that always seemed to elude me, sort of like long division in 3rd grade. being able to design in the short term with the long term always in mind, and it always left me feeling like i was missing something. <br> <br>so if anyone would like to explain in depth the reasons for the enjoyment of this redesign, i, and hopefully others, would find it very informative. comparing the old to the new, or just stating reasons as to why you like or dislike what is happening within those pages. <br> <br>cheers to always feeling like you know nothing but can learn everything! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
