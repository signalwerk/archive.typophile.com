    votes: null
    html: <p>Interestingly, I don't care too much for the new Print logo redesign. While the typeface warmly reflects handprinting reminiscent of early years in elementary school, it is overall sterile and plain. As some of you have touched on, I think the magazine is becoming uniformly "sexless" and "unappealing" like so many others trying to increase its readership through formal conservatism. Whatever happened to design based on "personality" and "character"? A typeface can convey, conjure, and evoke emotional content as well as communicate at the same time. <br> <br>I feel the use of H&amp;FJ's Gotham Rounded gets lost in the cover, amist the photography or illustration, thus becoming difficult to read from a browsing distance. Also, the visual weight, both due to spacing and density of the letters "print" are too weak in my opinion. I also find it interesting that the color is yellow since it's commonly known that it's the first color to become indistinguishable for a male color blind person. <br> <br>I must admit that the new design is an improvement. I just think it could go even further.</p>
