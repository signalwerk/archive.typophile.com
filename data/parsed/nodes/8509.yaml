    date: null
    date_raw: null
    votes: null
    html: "<p>I've got to admit the redesigned issue of Print is one of the first I've actually paid attention to in quite some time.  When recent past issues arrived, I'd quickly flip through them and immediate make the decision that the text heavy articles made my brain hurt and I'd set the magazine aside for possible read later.  The new design caught my attention.  I actually sat down and started reading it as soon as I ripped it out of it's plastic mailing bag.  It seems that pentagram has put some new life into what was becoming a stale publication for me. <br> <br>The other F+W design publication, HOW, also got a going over by pentagram and I think the redesign is refreshing and gives the editors/art directors a lot more flexibility in presenting text and images.  I suppose, in the interest of \"full disclosure\" I should acknowledge that I am a member of HOW's Editorial Advisory Board - and it was interesting to be included in sneak peaks of the new design in process. <br> <br>Did ID get a redesign as well? <br> <br>- Jeff <br> <br>::  ::  ::  ::  ::  ::  :: <br> <br>Jeff Fisher :: Engineer of Creative Identity <br>Jeff Fisher LogoMotives <br><a href=\"http://www.jfisherlogomotives.com\" target=\"_blank\">http://www.jfisherlogomotives.com</a> <br> <br>::  ::  ::  ::  ::  ::  :: <br> <br>HOW Magazine Editorial Advisory Board :: 2005 HOW Conference Advisory Board <br> <br>Speaker: \"Tooting Your Own Horn\" :: 2005 HOW Design Conference :: Chicago <br> <br>Author: \"The Savvy Designer's Guide to  Success\" from HOW Design Books.  <br> <br> <br>::  ::  ::  ::  ::  ::  ::</p>"
