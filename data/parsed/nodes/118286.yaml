      <p>These repaints are for a flight simulator add on and are normally offered for free to the community which is quite large. I bet most graphic artist would charge money for such work, quite a few people don't including me.</p>
      <p>I am not creating these repaints for Qatar Airways or any other airline. Nor am I affiliated with them. I am working on these in my free time and my real profession is a complete different one.</p>
      <p>I am trying to get as much detail into those repaints and would love to get those names right, I thought at least somebody could draw or set those letters who is more into the symbology than I am. It does't even need to be the exact same font or require much work. Just something which appears right at the first glance.</p>
      <p>Since you seem to have lots of expertise you probably can enlighten me why it's so much more work than simply writing 'Hello World'?</p>
      <p>If I am taking completely wrong assumptions feel free to tell me where I am wrong so I can at least learn a bit and get my expectations right.</p>
