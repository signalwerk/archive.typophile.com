      <p>Thanks for the explanation.</p>
      <p>I myself don't have a lot of Arabic fonts installed, so finding just the right one would take time. If you're picky. I am.</p>
      <p>Some help I can provide freely: in that image it actually says "lahweela" (or "lahuwayla"). If it's supposed to say "alhuwalla" (but where's the "y"?) the initial alef is missing; here are strings (the first without the alef, the second with) that you can copy-paste into software and try your luck:</p>
      <p>لحوﻳﻟﺔ</p>
      <p>الحوﻳﻟﺔ</p>
      <p>Another bit of help: that genre of Arabic font is called "kufi".<br><a href="http://luc.devroye.org/HasanAbuAfash--HasanHiba-2007.jpg">http://luc.devroye.org/HasanAbuAfash--HasanHiba-2007.jpg</a></p>
      <p>hhp</p>
