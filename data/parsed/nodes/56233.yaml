      <p>Thanks for the comments, I'm already working on a few changes.</p>
      <p>I knew that Arabic has less defined vertical heights, so I tried to vary them, I guess I got too carried away with it.  It's interesting that most here are finding parallels with the Roman version, when actually most of the Arabic was based off of the Greek version :)</p>
      <p>Which of these final yehs do you think works best?  Also, when you say the R and waw should be more similar, is that just for the descender part (the curve is the same, just lower and wider) or also for above the base line?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/coruna_yeh_variations_4357.png"></div><p></p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
