      <p>I'm not sure what kind of comment you are looking for. Your friends were right. It's readable. This is impressive for a 2 days effort. But for another 2 years of effort, you will still be in the realm of 'readability' of your Arabic text... only slightly better!<br>
      You might be better off focusing on Roman languages for your font. I personally discourage using Arabic in a Roman font. Roman in Arabic font is more manageable -and more necessary.</p>
