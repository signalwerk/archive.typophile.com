    html: <p>It is heartening to see type designers seeking to match various scripts in one font. We have this problem in almost all Indian languages and it is yet to be solved. I cannot speak for Arabic or any of the other scripts included in the font, since I cannot read, write or speak those languages. They look quite well matched and have an even texture. But the structure of Roman script is quite puzzling as so many styles have been mixed making the composed Roman text look quite bizarre. I am sure, if you can spend more time on it, you may be able to improve upon it.</p>
