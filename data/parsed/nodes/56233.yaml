    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fy_3565.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Y_5650.jpg"></div><p></p>
      <p>the connected Y is wrong in what you have so far. In arabic calligraphy standards, it really shouldn't be pointed. The detached Y is better, I like the end of the tail (although it's not a traditional aproach)  it mimiks you roman. However the beginning of that Y, it's a little too thick up there. The bottom curve is beautiful, but the top curve has stroke thickness problems.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kurunya_4270.jpg"></div><p></p>
      <p>the Kaf is absolutely beautiful, again the top right tip isn't traditional but it looks like the roman. Now the Waw is perfect but the following letter the R it's totally off compared to the Waw. The descenders in the Waw and the R should be really the same. there's no reason why the R should be bigger. The R is one of those letter that are Huge in your typeface, the "Dal" on the other hand is slightly tiny, I can understand what happened in the case of the Dal, but the R should match the Waw.<br>
      The Nun is beautiful too, I can understand why it's slightly slanted and pointed (to match the Roman) but the middle Y that follows it is just too big again. It is both thicker and taller than the Nun and that makes it look like a hybrid. You might want to make a middle Y or a middle Nun straighter than a Beginning Nun or Beh but the x height should be the same really.</p>
      <p>The final Aleph like all the Alephs in your typeface I like it, it is coherent with the roman, however you should be super careful with the stroke thickness in proportion to other letterforms.</p>
      <p>There is still a lot more to be said. Overall at this point I can compare it to a roman typeface where some of the letterforms are slab and some are old-style.<br>
      Part of your challenge is that you can't speak or read the language but hey Herman Zapf designed a metal typeface for an Egyptian newspaper in the fifties and it was still used until not a long time ago. He didn't speak the language but his design was an influence on some digital Arabic typefaces. It's a very challenging task. I have never learned traditional Arabic calligraphy but if you have questions don't hesitate.<br>
      Good luck</p>
