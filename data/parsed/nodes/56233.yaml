      <p>Ok, the space after the Nun is slightly too big right now. I will say that number 4 is not bad at all, 1&amp;2 have weird proportions, in 3 the fact that there's that lift from the basline that is making the horizontal stroke thinner is very awkward.<br>
      So 4 is good: the tail is nice maybe a tiny bit lower. Now when you want to create your detached Y base it on number 4, cut the attaching area and replace it with the swash that goes all the way up to the x-height.</p>
      <p>Speaking of which, I think you should have a descender line an ascender line and an x-height. So descenders like the tails of the R and the Waw should be fairly similar if not exactly the same, kinda like the ascender on a "b" and a "d".</p>
      <p>I don't know if I mentioned that before but the two dots should align horizontally, I don't want to restrain your creativity, but really if you get rid of the upper dot on your three dots, that's how your two dots should look.</p>
