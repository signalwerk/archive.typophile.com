      <p>You will not find such a font. Your best bet is to find different fonts that convey a similar feel in different scripts.<br>
      This version supports Spanish: <a href="http://new.myfonts.com/fonts/efscangraphic/frankfurter-sb/" title="http://new.myfonts.com/fonts/efscangraphic/frankfurter-sb/">http://new.myfonts.com/fonts/efscangraphic/frankfurter-sb/</a><br>
      For Chinese/Japanese, there is a style called "nar" or "maru", with rounded terminals.<br>
      For Hebrew and Arabic, you could ask in the specialised boards of the forum:<br>
      <a href="http://typophile.com/forum/373" title="http://typophile.com/forum/373">http://typophile.com/forum/373</a><br>
      <a href="http://typophile.com/forum/366" title="http://typophile.com/forum/366">http://typophile.com/forum/366</a></p>
