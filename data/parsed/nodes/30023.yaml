      <p>But Aziz, listing them (<a href="https://web.archive.org/web/20150124005843/http://www.arabic-calligrapher.com/index.html" title="http://www.arabic-calligrapher.com/index.html">http://www.arabic-calligrapher.com/index.html</a>) as an example is very misleading.  They are talking about "Simple creation of complex calligraphic artwork" These guys want the old complex (and only the old complex) styles with any cost!</p>
