      <p>Off-topic: I think it's interesting that many of us spend a lot of time trying to convince people that English (and other "simple" Latin, Greek and Cyrillic based languages) should be considered as complex scripts. And others spend a lot of time trying to convince people that Arabic (and other complex scripts) should be treated like Latin-based languages. </p>
      <p>I think all written languages should be able to claim citizenship in both the "complex" and "simple" camps and people should not try to bar them entry.</p>
