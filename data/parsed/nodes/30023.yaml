      <p>&gt; Some very good looking work, if only I could read it.</p>
      <p>Timd, "Wonders of Creation" is what the 2 Arabic words mean and translate. They have been Calligraphied in mirror symmetry by:<br>
      1 Transforming and manipulating the main letters and Ligatures.<br>
      2 Welding Last letter of the 1st word (Ba) with its mirror and Combining their Nuktas (dots) into one.<br>
      3 Combing First letter of the 2nd word (ALif) with its mirror into a down-arrow to stand for Male.<br>
      4 Duplicating and scaling Last letter of the 2nd (Ta) to form a circle with the 2 dots to stand for Female.<br>
      5 Distributing Nuktas (dots) where space allows without sacrificing readability.<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150124005843im_/http://typophile.com/files/IranKhat3_4795.JPG"></div><br>
      <div class="imageWrap"><img src="https://web.archive.org/web/20150124005843im_/http://typophile.com/files/IranKhat1_5958.JPG"></div><br>
      <div class="imageWrap"><img src="https://web.archive.org/web/20150124005843im_/http://typophile.com/files/IranKhat2_5955.JPG"></div><br>
      Happy Exploring with <a href="https://web.archive.org/web/20150124005843/http://www.crauswords.com/flowers/WFlowers.htm" rel="nofollow">Flowers</a><p></p>
