      <p>Si wrote:</p>
      <p>&gt;&gt;I think all written languages should be able to claim citizenship in both the “complex” and “simple” camps and people should not try to bar them entry.</p>
      <p>Si, this wonderful statement is what I am working for since 1998. Option needs to be open to gurantee survival. Any use of a font is a very legitimate use. </p>
      <p>The grandfathers of Arabic calligraphy and scripts succeeded because they believed fully in this "open entry".  The varieties and styles are so different and endless. Why anyone should close the curtain now?</p>
      <p>Aziz wrote:</p>
      <p>&gt;&gt;That’s why people like these can claim simplifying the complex! and the fact of the matter, they are complicating the simplex. </p>
      <p>Personally I do not like to use the words "simple", "simplified", or "complex".  They are relative terms anyway. I one should look at it in term of open design and options. Thousands of Latin types today are so "weird" and "complex" when compared to mainstream types.  Are there complicating Latin? No.  It is about removing "any and all" artificial and arbitrary design limitations.</p>
      <p>-Saad</p>
