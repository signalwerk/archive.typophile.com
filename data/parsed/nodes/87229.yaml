  html: |-
    <p>So this is my first attempt at a full-fledged typeface. I'm using this as an educational tool, so I've kept it very simple and maybe somewhat generic. Not all of the characters have been created at this point, but I can already see that there are issues I'm having a bit of trouble resolving. I'm hoping more experienced eyes can help me identify where some of the issues are coming from and how to fix them. There are three f's and two n's because I'm not sure which ones work best (if any).</p>
    <p>Thanks!</p>
