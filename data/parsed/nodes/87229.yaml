    html: |-
      <p>I like it! A few remarks:<br>
      the flag on /r/ is too narrow; make it higher (not wider)<br>
      there's generally little contrast which will make it hard to read in small sizes. Try enlarging the contrast. For example, the join between the bowl of n and the left stem is very fat. Try thinning it. Also, it looks like that same bowl is fatter than the stem, which is unusual. /u/ is too wide (compare to /n/). Diagonals on /k/ are too thin. Dot on /i/ is too small.<br>
      Keep it up!</p>
