    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF City Street Type</strong></p>
    <p>Released by <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a><br>
    Designed by <a href="/wiki/Verena%20Gerlach" class="freelinking" rel="nofollow">Verena Gerlach</a>, <a href="/wiki/Ole%20Sch%C3%A4fer" class="freelinking" rel="nofollow">Ole Schäfer</a>, 2000</p>
    <p>For decades two different signage systems divided East and West Berlin. The West used a sans serif dating back to the 30s, while the East preferred a technically-tinted sans face from the 50s. Ole Schäfer and Verena Gerlach based their designs on the street signs themselves rather than the sketches from which the signs were made. This resulted in there being two versions for the East and a single version for the West. The FontFont character set includes many characters that would never be found on a street sign so Schäfer and Gerlach designed the missing letters, punctuation and symbols. They also designed special headline fonts for both East and West available in three weights: Regular, Medium and Bold. In addition, they created lining figures and, for the expert sets, a series of arrows and other useful symbols.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_city_street_type/" rel="nofollow">FF City Street Type at FontShop</a></p>
