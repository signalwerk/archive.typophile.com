    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span> City Street&nbsp;Type</strong></p>
    <p>Released by <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a><br>
    Designed by <a href="/node/add/wiki?edit%5Btitle%5D=Verena%20Gerlach" title="Create node &quot;Verena Gerlach&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Verena Gerlach</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Ole%20Sch%C3%A4fer" title="Create node &quot;Ole Schäfer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ole Schäfer</a>,&nbsp;2000</p>
    <p>For decades two different signage systems divided East and West Berlin. The West used a sans serif dating back to the 30s, while the East preferred a technically-tinted sans face from the 50s. Ole Schäfer and Verena Gerlach based their designs on the street signs themselves rather than the sketches from which the signs were made. This resulted in there being two versions for the East and a single version for the West. The FontFont character set includes many characters that would never be found on a street sign so Schäfer and Gerlach designed the missing letters, punctuation and symbols. They also designed special headline fonts for both East and West available in three weights: Regular, Medium and Bold. In addition, they created lining figures and, for the expert sets, a series of arrows and other useful&nbsp;symbols.</p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_city_street_type/"><span class="caps">FF</span> City Street Type at&nbsp;FontShop</a></p>
