      <p>The long f is an integral part of cursive latin script and it is not alone if you get by the anglocentristic view of latin script. There are other letters as well that have parts below baseline and above x-height at the same time: J, ſ, þ and often ß. Then there are letters with descenders with diacritics—many languages treat letters with diacritics as letters in there own right!</p>
      <p>&gt;Mainly because it creates boumas divergent from the Roman's, causing<br>
      &gt;extra readability issues. What other character does that so blatantly?<br>
      …<br>
      &gt; Not when you consider how much more Roman text we read compared to Italic.</p>
      <p>Ok, we read more roman text than italic. But how did you learn to write the f? (Almost) every child that learns to write does so with an f with descender and ascender at the same time. The readability issue can’t be that bad. What’s more, the special form should rather enhance readability, as you’d not have difficulties to discern the f from almost any other letter…</p>
      <p>Hrant, I like your theory a lot, that scripts do have their traditional style that shouldn’t be changed for looking more like an other script. What you argue here is the contrary from your theory. If this were about a slanted roman, i’d fully agree with you. But this is an italic which has its own rules and its own history. Of course it should match the roman, but not by giving up its italicness.</p>
