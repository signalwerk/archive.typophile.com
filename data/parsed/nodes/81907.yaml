      <p>I don't mind people breaking rules - I do it myself often! :-)  But it's important to know the rules, especially the ones you might like to break. "Bouma theory" is centered on expectation; since Romans (with non-descending "f"s) provide the lion's share of boumas, that's the expectation we form. Does the mind switch "expectation sets" based on whether it's reading Roman or Italic? If so, how quickly? Not having reliable answers to these esoteric questions, why bother with a descending form? Creative expression? Awesome. Mimicking precedent? Lousy.</p>
      <p>&gt; At some stage, someone must have propagated a short /s/. Are you saying they<br>
      &gt; were wrong or that it was bad design rationale to move away from the /longs/?</p>
      <p>I'm a big fan of reforming even the most basic things in life, as long as there's a benefit; note my work in alphabet reform. The long "s" was a readability/legibility disaster, so it's a good thing we got rid of it (in text fonts). And this case is a mellower version of that actually.</p>
      <p>&gt; The descending /f/ may actually function better given time than an /f/ which<br>
      &gt; sits on the baseline, based on the descender allowing for further differentiation.</p>
      <p>We think alike! But guess what: if you're going there, make the Roman "f" descend too! Fedra anyone? Repeat: I'm all for breaking rules to improve things. But I'm totally against "I do it like this because these other guys did."</p>
      <p>&gt; /thorn/ is not in the same bracket</p>
      <p>What I was saying is that the thorn spans the entire vertical span but because it's so rare it's not enough company for a full-span "f", so the latter remains too much of a stand-out in the alphabet - sort of like the [closed-bottom] binocular "g" we were discussing here:<br>
      <a href="http://typophile.com/node/81129" title="http://typophile.com/node/81129">http://typophile.com/node/81129</a></p>
      <p>&gt; my /f_j/</p>
      <p>It's charming. It looks like an Armenian letter. But I wouldn't recommend it for long text, and I suspect neither would you. UNLESS it's part of a concerted effort to improve readability via heavy use of ligatures (something I touched upon during my 2004 Thessaloniki talk, "Designers of the World, Ligate!").</p>
      <p>hhp</p>
