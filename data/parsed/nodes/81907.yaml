      <p>Isn't it all a question of what you are used to reading? As a child my Irish school books were set in uncial types with an accent called a bualta, which was a dot over a consonant instead of a "h" and which changed the pronunciation.</p><div class="imageWrap"><img src="http://typophile.com/files/Uncial_alphabet_3451.png"></div><br>
      This changed in the early 60s when we were hit with the double whammy of no bualta and no more uncial type. I remember how difficult it was initially to read the Irish set in roman (probably Times new roman) with no dots except for i. It looked unwieldy. Today I can hardly read a text set in uncial (or half uncial I'm nor sure which is which) There was also that old s which looks like an r which I never had a problem with. <p></p>
      <p>My point is you read most easily what you are accustomed to reading. Changes in the basic letter forms have always occurred slowly until relatively recently. Cursive sans were fairly rare until Syntax came along. Now it's almost a mortal sin to design a sloped roman. The descending italic f catches my eye because I'm not used to it. But with the new open type technology the type setter/designer will probably have a choice between a descending or non descending and the market as always will decide.</p>
