    user: 30114
    date: 2011-05-10T03:19:00
    date_raw: 10 May 2011 — 3:19am
    votes: null
    html: |-
      <p>Interesting discussion!</p>
      <p>We don't read that much text set in italic, but that should not change the way we look at designing italics. It only means that every mistake will be of less harm as opposed to a mistake in the Roman. But it's still a mistake.</p>
      <p>I went for cursive. Not because "some other guy did it", but because I have seen that slanted italics (oblique) don't differ enough from the romans, or have to be slanted so much that it becomes ugly. (<a href="http://new.myfonts.com/fonts/adobe/univers/" title="http://new.myfonts.com/fonts/adobe/univers/">http://new.myfonts.com/fonts/adobe/univers/</a> I understand the choice, but I don't really like those italics.) Sensato has it's roots in serif typefaces, which makes the choice for a slanted italic more logical. Slanted serifs must be really ugly! My plan is that (someday, in the end of times) I will also design Sensato Serif, so it would be nice if the two italics match somewhat.</p>
      <p>I simply don't like a the look of a non-descending italic f. It looks to much 'oblique' compared to the other letters. The reason why thi current f doesn't read nicely, is because it wasn't executed properly.</p>
      <p>I like the idea of an f that descends, but doesn't reach the descender line. I tried it quickly and choose for the one that went all the way, but I'll give it another shot.</p>
      <p>In the end, I'll make my decision based on what I see. I think this is something you shouldn't think about to much. Trust your eyes!</p>
      <p>I will not include an alternate f in my typefaces. I think this is a choice I have to make, since most graphic designers don't have the needed skills to make that choice.</p>
      <p>Just so you know. This is an interesting discussion but don't make it go on for ever, s'il vous plaît.</p>
      <p>Cheers!<br>
      Jasper de Waard</p>
      <p>@Gary: What is the typeface you used for the word 'Angelina' in the Bazaar magazine. I saw it on your website and it's beautiful, but I can't name it. You got some great designs on your website, but I think the 'Type' section needs to be updated ;-)</p>
