    html: <p>The current trend for cursive sans will probably pass. One of my favourite italics is Trump Mediavel which is not far of a true sloped roman. That sounds like a contradiction but it has just enough cursive characters to (imo) work both independently and as a companion to the roman. And its not to narrow. I use Swift a lot and am always surprised by how much text shrinks when the roman is changed to italic. My long winded way of saying it's too narrow. I'm trying to draw an italic at the moment so I could do worse than look at Trump Mediavel.</p>
