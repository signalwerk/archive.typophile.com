      <p>I agree with Georg. If Sensato had an oblique italic, rather than a cursive italic, I'd be inclined to go without a descender but I think Sensato has a true (cursive) italic so I don't have a problem with a drop on the /f/.</p>
      <p>Hrant, I very much like your typically tidy logic about the /f/ being the only letter whose bouma changes (with the potential exception of the eszett and perhaps long /s/) but it's not like we're not going to be ready for it in text, having seen long /f/'s since we started to learn to write as Georg states.</p>
      <p>As far as Sensato is concerned, the descending /f/ certainly works in this context, albeit there may be issues about how it finishes at the bottom, e.g. how far should it drop, how much (if at all) should it taper, should it go around the corner like the traditional cursive form? I certainly don't think this type of /f/ can be disqualified, and it led to one of my favourite characters in Camphor (/f_j/):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/f_j_6623.png"></div><p></p>
      <p>I doubt it'll get used much but there was a pleasing symmetry to it!</p>
