    html: |-
      <p>Jasper, I like this whole italic approach. I don't think it is too different from roman (upright) to lose the family likeness. But it's different enough to work well as an italic. The best test is not to put italic paragraph next to roman paragraph but to set a roman paragraph and intersperse it with some italic words and phrases to see if that works. Of course a paragraph set fully in italics has to work in its own right, but italics are mostly used to emphasise individual words and phrases to let's see some of those in your next pdf :)</p>
      <p>You may want to consider lowering the x-height fractionally, although that is not the kind of advice I have ever taken myself for italics, so please ignore me if necessary.</p>
      <p>/a/, /b/, /d/, /g/ etc. still too wide to my mind.</p>
      <p>/c/, /e/ and /t/ I think you may have overcooked the upturn on the lower terminal, plus /c/ is notably narrower than /e/ in roman but italic /c/ and /e/ look the same width (although I understand that the italic /e/ may be closer in width to the italic /c/ compared with romans. On the /e/ the upturn seems inconsistent with the (pen) angle of the bowl. One of Sensato's great strengths is its openness. This /e/ tail is closing up the white space a little too much IMO, needs opening up a little.</p>
      <p>/f/ Rightly or wrongly, the /f/ in Camphor doesn't go down as far as the descender line (it more closely echoes the height of the ascender in the /t/. Your /f/ descender looks very long and the longer it is the more it will interfere with Hrant's bouma problem, which may or may not be that important to you as you try to express yourself creatively. The angle of the cut-off at the bottom of the descender is certainly not helping with a perceived flaring. However, I think the angle is right but don't overcompensate the other way by over-tapering.</p>
      <p>/i/ and /j/ If you put the tittles in mathematically the correct place (as per shearing the /i/ and /j/ they will look like they are drifiting eastwards (accents also will do this). Suggest nudging tittles left a little. (You may have done that already but maybe try a few more units.)</p>
      <p>/k/, /v/, /w/, /x/, /y/ look like mathematical shears without further adjustments (compare with roman counterparts). Thin arms need bulking up and thick arms need thinning down a little (unless you want the italics to be deliberately higher contrast that romans).</p>
      <p>/o/ and other curves are maybe too thick on the downstrokes at 1 and 7 o'clock. Bit too thin at 11 and 5 o'clock.</p>
      <p>/z/ heavier on stroke form top right to bottom left (stroke 2).</p>
      <p>The problem with the dancing baseline would be lessened if you had more strokes/contours that actually ran along the baseline itself. At the moment it's just the /z/ which actually runs along the baseline. A number of fonts would have the first downstroke cut off horizontally along the baseline but allow the second (in an /n/) or third (in an /m/) to be cut off in that oblique fashion that you are seemingly employing on all downstrokes.</p>
      <p>N</p>
