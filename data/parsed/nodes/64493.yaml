      <p>Current undergrad student here:</p>
      <p>I buy Baseline, Eye, CA, and the odd Computer Arts. And SEED. Though it's more science/culture than design, I feel it often is highlighting areas where science, culture, and design meet and are making wonderful babies. </p>
      <p>Non design: National Geographic (good lord, they need an overhaul), Canadian Geographic, WIRED, The Walrus, and COLORS once in a while. The occasional issue of The National and Foreign Policy Review, too.</p>
      <p>I borrow the odd copy of Print, CMYK, HOW, I.D., and STEP, but haven't bought one for almost 2 years.</p>
      <p>I have a nice legalese letter waiting for G.D. USA telling them that if I receive one more mailing from them I will file harassment charges. GD USA is hands-down the absolute worst design magazine I have ever laid eyes on.</p>
      <p>Overall, I do read somewhat more online than in print, though I'm still reading a lot of books AND magazines. And I have the sagging bookshelves to prove it. I am a non-traditional student, according to the Admissions folks, which probably throws off the curve. I'm 6-8 years older than most of my fellow senior-level students.</p>
