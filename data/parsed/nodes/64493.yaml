      <p><cite>Is there anything going on in design these days…</cite></p>
      <p>There is, but by the time the magazines can get it into print we’ve already seen it online a hundred times.</p>
      <p><cite>…or is it just that the mags are out of touch?</cite></p>
      <p>Oh god yes. Most of them are trying to provide information and services that has been online for months or even years. History articles are often retreads about ornaments, Swiss modernists, and totalitarian propaganda. I wouldn’t mind if they were in the $5–$10 range, but why would I spend $30 on a redundant magazine when for $35 I can get a good book about something new?</p>
      <p><em>Eye</em> no. 68, Beyond the Canon, was the last interesting design magazine I saw. Someone needs to just make that concept a quarterly. I don’t ever want to read another magazine article about Helvetica, Wim Crouwel, Paul Rand, Stefan Sagmeister, or see another poster of a dictator.</p>
