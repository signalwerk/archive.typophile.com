      <p>1. Better content. Almost anything recent that ends up in a design magazine was probably seen online about 10,000,000 times in the last year. So if it goes to print, make it worthwhile. The writings of Alice Twemlow, Paul Shaw, and Rick Poynor are all examples of how to write the last work about a topic that’s already been covered elsewhere. And Eye No. 67 is a paragon for people who want to get off the beaten path. Give us more articles about postwar design history that doesn’t involve modernism. Minneapolis had designers before Prince needed album covers. Show me!</p>
      <p>2. If you want to practice book arts, go make books and not magazines. Stop using high-end paper that makes the magazines too expensive and too small. I don’t care if you have to print on coated TP, just accomplish my next point…</p>
      <p>3. Make design magazines ENORMOUS and get rid of all that white space. I am not buying another design magazine that discusses a designer’s use of type and shows her work at such tiny sizes that the type is barely legible without a magnifying glass. This problem is not new, people have been complaining about it a lot longer than I’ve been in design. The layouts in <em>Communication Arts</em> are one of the worst offenders. <em>Comm Arts</em> needs to be killed, dismembered, and brought back as a crazed Frankenstein’s monster based <em>Coilhouse</em>, <em>Idea</em> and <em>V</em>. To accomplish this we must also…</p>
      <p>4. Stop putting so much stuff into features and annuals! Everybody has already seen it and images will probably be archived online until we’re all dust. Putting less stuff in design magazines and making it bigger means that there’s actually some value to the images that do get run.</p>
    html_clean: |-
