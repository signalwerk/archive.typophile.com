    html: <p> Per, <br> <br>The glyphs I found myself liking the most were the dingbats. I don't think anyone has done "kitchen-tile" dingbats before; that might be a good direction. <br> <br>As far as the font itself goes, I think I've seen so many grid-based typefaces (and created more than my share!) that it didn't turn my crank so much. My favorite non-dingbat glyph was the zero, and if you could do a whole character set utilizing those spiked forms, that would be pretty neat. </p>
