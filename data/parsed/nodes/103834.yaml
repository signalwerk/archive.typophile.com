    <p>I've been working with Lunatix Bold recently. It has all the accents and special characters I need.<br>
    However, when I'm writing something in Photoshop, it doesn't support certain characters, such as ¡, ¿, Ñ and the acute accented vowels (to be precise, it doesn't accept anything that is not the standard English set of characters). Then I write the text, using the same font, in Word. It's fine. I copy-paste the text into Photoshop... and it's fine!</p>
    <p>Does anyone know why this happens? If this helps, I use FontCreator 5.6 to view the characters, and all non-standard characters are blue (the standard are green or sometimes red).</p>
  html_clean: |-
