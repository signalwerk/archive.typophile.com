    html: |-
      <p>The font has a MS Windows Symbol encoding. I have had some problems with some TTF barcode fonts with the same encoding and only with the gylphs beyond the 'z', where gylphs would appear white. After changing the codepage everything worked fine.<br>
      My guess is that Word is copying the unicode values to PS, so the same gylphs are used. When typing in PS, PS is using the unicode values to 'find' the special characters or character after the 'z'.<br>
      I looked into some old TT symbolfonts and most only go up to the 'z'. Only exception is ZapfDingbats. I have no idea if that was done to make typing the symbols easy or if there was a technical reason for it.</p>
