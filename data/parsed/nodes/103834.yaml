    html: |-
      <p>When you type (or paste) text in Word while you've selected a Symbol font, it automatically tries to convert the Unicode codepoints to Symbol codepoints. That is why copy/paste from Word does make it work in Photoshop.</p>
      <p>Symbol fonts are considered legacy nowadays. Besides it is plain wrong to have a Symbol font which contains letters.</p>
