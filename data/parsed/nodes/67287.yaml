    <p>Hello everyone!</p>
    <p>I'm redesigning a old project, a type family sketched in 2008. I would love to read your feedback, as I'm hoping on some really good insights as I share the redesign process here.</p>
    <p>So, here's the sketch:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Illiad_5598.png"></div><p></p>
    <p>First two cents, anyone?</p>
    <p>Thank you in advance. Cheers!</p>
