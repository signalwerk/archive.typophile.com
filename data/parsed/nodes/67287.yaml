      <p>james: I also love the italic, thanks!</p>
      <p>The "w" incoherence is something I'm struggling right now. The light version is very curvy, while the black is very orthogonal, and the resulting weights are interpolations of these two.</p>
      <p>As for the "a", your right. The top bar is too wide.</p>
      <p>Cheers!</p>
