    votes: null
    html: <p>What John said. <br>You need Pyrus BitFonter. <br>And avoid the T3 format. <br> <br>Or (if you have only a few colors in your design), you can layer regular outline fonts that are -very careful- made of parts, giving each "part-font" a different color. FontShop has one or two fonts like that. <br> <br>hhp <br></p>
