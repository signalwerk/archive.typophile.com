    html: <p>Using Type 3 fonts is problematic. ATM can't render them so you will only be able see on-screen whatever bitmap fonts were created for the font. As far as I know, these bitmap fonts can only be black and white. You will also only be able to print them on PostScript devices. And no hinting, either.</p>
