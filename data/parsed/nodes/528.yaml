    html: <p>Paul, <br> <br>One of the other things I did not mention, but you would figure out quickly, is the path direction after subtraction.  <br> <br>There are hinting considerations. I would have to think through them again. Unless you sell the fonts I would not worry much about that. <br> <br>The other method for colouring fonts is the kerning method.  <br> <br>You make the font in the same method but you assemble them differently. Colour the elements with the kerning off, turn the kerning on and the character assembles. For simple arrangements this is rather nice. Especially if you wish to make a subtle change in colour. The other method you must wade through layers. Both have advantages. <br> <br>This example is shown by the central birds and tree. <br> <br><a href="http://www.lanstontype.com/FleuronsBird.html" target="_blank">http://www.lanstontype.com/FleuronsBird.html</a> <br> <br>Gerald Giampa <br>Lanston Type Company <br> <br> <br></p>
