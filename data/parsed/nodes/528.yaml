    html: <p>Paul, <br> <br>Also I am not sure what you are aiming at. We have colour fonts but the designer has some work to do. Picking the colours is one of them and recommended  I would think. <br> <br>You may look at this and tell me if that is what you are after. I expect it will be a alphabet rather than the example shown here. <br> <br><a href="http://www.lanstontype.com/WaterGardenMulti.html" target="_blank">http://www.lanstontype.com/WaterGardenMulti.html</a> <br> <br>Gerald Giampa <br>Lanston Type Company</p>
