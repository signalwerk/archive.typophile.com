    html: <p>Paul, <br> <br>Think of it this way. Design the font in one colour. Determine how many colours are to be in the font. Make copies of your "finished" outline fonts. Then work by subtraction. <br> <br>"Keep notes." <br> <br><a href="http://www.lanstontype.com/JacobeanInitials.html" target="_blank">http://www.lanstontype.com/JacobeanInitials.html</a> <br> <br>Gerald Giampa</p>
