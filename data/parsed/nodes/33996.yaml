  html: |-
    <p>What is the best way to have a separate set of combining diacritics for capital letters?  I tried using the <a href="/wiki/case" class="wiki">case</a> feature, but it’s support is quite limited, as is for contextual substitution in Latin for most programs. Is there another way other than using a myriad pre-combined ligatures of base+mark?</p>
