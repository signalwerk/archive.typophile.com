  - id: 67942
    user_id: 1210
    user_name: dctroy
    user_path: null
    user_image: null
    date_raw: 28 Mar 2003 — 9:15am
    date: 2003-03-28T09:15:00
    votes: null
    html: <p>Karen, <br>I am now traumatized by the thought of the schools with the giant Comic Sans signs! Those poor students, I predict bad things in their future. <br> <br>On a related note (sort of), when I was in elementary school, around age 8, the school commissioned and installed an outdoor sculpture in the Mondrian / Doesburg / de Stijl vein. It was about 10 feet tall and consisted of a 3-dimensional black metal rectilinear framework and flat metal primary-colored panels. It was basically like Doesburg designed a jungle gym -- really cool looking and the kids were allowed to climb around on it. I thought it was great. Then a group of parents started making noise about the school not being traditional enough in its teaching methods. The administration responded in part by removing the sculpture ("too weird" I guess?) and hauling it off never to be seen again. What was it replaced by? Nothing but the hole in the concrete -- the art budget was spent and gone. I knew at that tender age that I needed to get the hell out of that burg. <br>Oy.</p>
