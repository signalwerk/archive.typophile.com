    date: 2003-03-26T20:50:00
    votes: null
    html: "<p>Speaking of O.D'ing on one face, if you haven't seen the movie \"Royal Tennenbaums,\" there's a funny running type gag in the movie: every written object you see, from signage to magazines to hand-written signs, is in Futura. It's everywhere -- creating a surreally uniform and bland environment. (I like Futura, but not that much.) Partly as an experiment, I ask non-design folks who've seen the movie if they noticed the consistent typeface use. So far no one has. </p>"
