    html: "<p>In the early 90s, Adobe came out with packages of typefaces that were aimed at general consumers. Aside from Image Club and Fontek disks (if you could find them), these were the only collections that were affordable for students/nonprofessionals at that time. As a result, Industria, Arcadia, Lithos, Copperplate and Tekton were absolutely everywhere. More recently -- for me, anyway -- it's been Bell Gothic and Avenir all over the place. <br> <br>Most noticeable for me: I can't go to a video store without being bombarded by Trajan. Any shelf you look at in the drama/action/suspense sections, you'll see it on at least 5-10 video boxes. Even if movies don't use it for the logo, they still use it as the headline font for all the review quotes. (Super-secret project to come on just this subject.)</p>"
