    <p>My specimen has finally joined the others on the MATD page. </p>
    <p><a href="http://www.typefacedesign.org/2009/" title="http://www.typefacedesign.org/2009/">http://www.typefacedesign.org/2009/</a></p>
    <p>Already there are mistakes to correct but have a look an feel free to comment in any way you wish. All feedback will be gratefully received. I am under no illusions that this is finished stuff. But I learned a great deal doing it which is deeply pleasing.</p>
    <p>The ROP document (reflections on practice) will join soon.</p>
