    html: <p>Thanks! I am looking forward to doing more with them as well as spending the time to weed out the ones that don't contribute enough to be worth leaving in. I am working on a way of looking at them that is more concerned with supporting glyph recognition than evenness for its sake. ( these two things are not opposed per se ). This comes out of reading Pelli and others on the subject of crowding and doing an reading speed experiment here at Reading.</p>
