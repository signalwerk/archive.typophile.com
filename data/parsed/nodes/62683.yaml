    date_raw: 6 Oct 2009 — 4:27am
    votes: null
    html: |-
      <p>I was at Barnes &amp; Noble today looking through a slew of new novels and trying to identify the typeface. What I noticed more than anything was how light so many of them were. Even if the printing was good, the typeface itself carried so many wiry and bony characteristics that I had to put the books down.</p>
      <p>A typeface shouldn't perfume the page with its wispy teasing; it should land on it like a large black hammer, all Götzen-Dämmerung-like and stuff, or How To Design Type with a Hammer.</p>
      <p>You had me at: "Perhaps a new type should be a bit heavier than other book types." Yes, heavier, weighted, workhorse. I have never seen italics like that! They look almost knitted and handmade. I need to slow my eyes down and study those.</p>
      <p>Congratulations, Eben! Looking forward to you nursing/releasing this baby into the wild.</p>
      <p>Rahim</p>
