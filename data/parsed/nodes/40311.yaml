      <p>Hi</p>
      <p>I like the crown and the letters, but the S should not cover the first vertex of the W. The S needs a bit of curve fine tuning. Personally, I don’t like the rhombuses, it makes the whole thing to busy. Do they stand for something? Most seal I’ve seen are placed in circles.</p>
      <p>Cheers!<br>
      __________________________________________________<br>
      Fischers Fritz fischt frische Fische, frische Fische fischt Fischers Fritz.</p>
