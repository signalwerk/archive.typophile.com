    <p>Dear Typophiles,</p>
    <p>I’ve recently decided to design and create a monogram for personal use. In the era of e-mails, IMs and text messages I find myself writing an old-fashioned letter more and more often. The personality of the handwritten letter is unparalleled by electronic communication, and its old-fashioned charm is lovely.</p>
    <p>Thus my decision to design a monogram, which will be made into a seal (you know, the kind with lacquer you stamp at the bottom of letters), and which will be printed on stationary.</p>
    <p>Please tell me what you think of this first design. The initials stand for Wouter Spaak, which is my name.</p>
