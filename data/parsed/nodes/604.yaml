  html: "<p> I was just taking a look at Grant Hutchinson's website and saw a post about Monotype suing Tom Murphy over this \"Embed\" app that changes embedding restrictions on a font. <br> <br>Grant's Site: <br><a href=\"http://www.splorp.com/blog/\" target=\"_top\">http://www.splorp.com/blog/</a> <br> <br>Tom Murphy's rebuttal to Monotype: <br><a href=\"http://www.andrew.cmu.edu/~twm/embed/dmca.html\" target=\"_top\">http://www.andrew.cmu.edu/~twm/embed/dmca.html</a> <br> <br>any comments on all of this? </p>"
