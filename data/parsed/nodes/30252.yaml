      <p>The image in the initial post reminds me of when I was a kid. I was playing at a friend's house, and at some point I noticed his mother had a small wood block placed on her TV as a decoration of some sort. The block had flat geometric sections removed from it- just like in that same image above, but with a low profile wooden base that kept the remaining pieces connected together, if I recall correctly. </p>
      <p>I stood there silent for quite a while, just gazing away at this curiosity- it was so abstract compared to the other decorations in the house. I was pretty fascinated with it, it reminded me of something out of an Escher book.</p>
      <p>My friend, who is wondering why I'm just standing there staring at a wood block, realizes I don't see it for what it really is, and fills me in: the negative space of the block spelled out "J-E-S-U-S". It suddenly became clear as day, and I was so mad at myself for not being able to see that :P</p>
