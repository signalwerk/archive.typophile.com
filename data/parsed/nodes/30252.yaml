      <p><cite>Do you think it would be a good idea to create a logo this way? Or do you know of any logos created this way?</cite></p>
      <p>It depends on who your audience is, what the logo's for, and how it will be seen. </p>
      <p>If I was designing for a billboard, creating a sign for a building, or making vehicle graphics, I would never do something like this. When short viewing time/motion is involved you have to make sure it can be read.</p>
      <p>For printed/web media: maybe use it as an attention getter for a header/intro to a layout of text, but I still wouldn't use it for a logo, not to that extreme at least. It gives an optical illusion/psychedelic vibe that I don't think many companies would want in their logo- which is their identity.</p>
      <p>There might be better examples of the theory than this one.</p>
