      <p><em>Closure</em></p>
      <p>Even though the totality of a shape as we define and anticipate it may not appear, we are still able to recognize a partial shape for what it is or would be in entirety. There may be a more specific gestalt term that someone has created for closure specific to letters, but the principle remains the same.</p>
