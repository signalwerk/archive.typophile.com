      <p>Hi Dan,</p>
      <p>If you are near a good library (can't remember where you are in school) see if you can get a copy of Richard Zakia's book about Gestalt theory and visual perception. It's been many years (uh . . . like maybe twenty!) since I read it but I LOVED it at the time! A couple of years later I even sent Prof. Zakia a photo that I'd found, which I thought perfectly illustrated one of his points. Although much of what he discusses has to do with photography, the book's scope is wider than that. Just a suggestion. (As if you didn't have enough to read already!)</p>
      <p><a href="http://www.amazon.com/Perception-Imaging-Second-Richard-Zakia/dp/024080466X" title="http://www.amazon.com/Perception-Imaging-Second-Richard-Zakia/dp/024080466X">http://www.amazon.com/Perception-Imaging-Second-Richard-Zakia/dp/024080466X</a></p>
