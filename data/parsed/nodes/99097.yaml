      <p>so i'm no lawyer, but from common sense:</p>
      <p>A creates a product from his own idea and craftsmanship. He does this to earn a living, get rich or die trying. He finishes the product and puts it on the market with his own terms and conditions that seem to be appropriate to him (use only if you pay price X, use only for your own but don't share, ...).<br>
      B looks for a solution for  his problem, and finds the product of A. He sees that it would solve his problem, and examines the terms and conditions to make use of it. If the conditions are appropriate to the problem (price, rights, etc.), B pays for the product and agrees to use it within the terms that are part of that contract.<br>
      So for commercial fonts this means: if the conditions to use it include that you must have payed for it – that's it, and there's no way around.</p>
      <p>On the special case to write some words in the font on the designers webpage and trace it: the use of commercial websites often contain ... terms and conditions, where might be written that you can use the word generator for preview purposes, but not use the generated images in commercial projects without purchasing the font.</p>
