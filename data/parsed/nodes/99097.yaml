    <p>i'm in the midst of a giant shitstorm (please excuse the expression) here with some other people and i need YOUR help.</p>
    <p>i have announced to these people that i will not knowingly use/touch ANY "illegal" softwares, including fonts. in my mind, this was pretty straightforward: there are 2 ways that i'm aware of to obtain a given piece of software--either pay for it, or steal it.</p>
    <p>this created the shitstorm, and now we're down to "what is legal? what is illegal?", so i'm asking you (many different professional type people) for input.</p>
    <p>can you direct me to anything that will explain to me CONCISELY and IN NO UNCERTAIN TERMS what precisely is allowed in font usage in the USA? do typographers/type designers get to make their own rules/laws? who/what governs this stuff? i was told that "these guys make up these rules and they SOUND like LAW but that doesn't MAKE them LAW."</p>
    <p>i was told that "if you go to a type designer's website, you can often set a sample word or line using their font(s)," which is obviously true. "furthermore, you can now outline that type or copy the rasterized result and what you've ended up with is NOT their intellectual property" etc … what do you think of this? or, more precisely, what do you KNOW about this, legally? </p>
    <p>one of the people i'm arguing with is under the impression that there are ways to legally circumvent having to pay for a type font (see outlining suggestion, above). do you know if there ARE? not necessarily what's "right", but what's LEGAL?</p>
    <p>me: "what would you say if you met one of these type designers face-to-face, knowing that you had their goods on your mac and you hadn't paid for them?"<br>
    the response: "i'd tell 'em straight to their face that i had pirated copies of their fonts and now maybe we can work together to create a better situation for everyone involved. they'd probably be glad that i was so honest and forthcoming about admitting it."<br>
    as THE TYPE DESIGNER, what WOULD you say to that?</p>
    <p>finally, i'm having to respond to "if you ask TYPOGRAPHERS about this, of COURSE you're going to get responses that agree with your viewpoint." … comments?</p>
    <p>MY viewpoint is simple. you either PAY or STEAL. i'm unaware of any other practical options for obtaining PAY FONTS.</p>
    <p>if you could take a few minutes from your undoubtedly busy schedules and help educate here, i'll be in your debt. i'm fighting for your rights, and because i'm ignorant (and do not understand legalese, typically), i'm in a battle that's going nowhere fast. i want to present an airtight case (SIMPLY, QUICKLY, and in a STRAIGHTFORWARD manner), if possible, proving that one HAS to PAY for a non-free typeface if they're going to be using it in any way.</p>
    <p>thanks very much for your consideration, and if you choose to respond, i thank you in advance for your help. </p>
    <p>i remain anonymous, for obvious reasons. but please know that i am trying to do the legal/morally sound/"right" thing here.</p>
    <p>frustrated</p>
