      <p>Generally, when it comes to all things law, you need to speak with a lawyer. This doesn't mean paying for one - perhaps you have friends who are practicing lawyers. You should speak with them.</p>
      <p>The reason is simple: law is complicated. Anyone who does not have the equivalent of an LL.B. or J.D. simply isn't qualified to inform you of legal matters. There's a reason why law is a 4 year degree in most jurisdictions. 'Bush lawyers' as some people call them – that is, people who think they know about the law because they've personally been involved in a contract dispute, have been to Court, have engaged in personal study of the law or have had legal problems themselves – can only provide you with their own experience. Law is double sided. Knowing what is relevant and irrelevant, and why something is relevant or irrelevant, takes a University degree. And when we're talking about IP law, this is an incredibly detailed area that only a professional lawyer can properly assist you with. </p>
      <p>Finally, what is legal and illegal is impossible to say unless you can provide us with the actual fact scenario.</p>
