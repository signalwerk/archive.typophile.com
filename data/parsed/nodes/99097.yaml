      <p>&gt; you either PAY or STEAL. i'm unaware of any other practical options for obtaining PAY FONTS.<br>
      You can also get commercial fonts that comes bundled with software (for example, Photoshop or Illustrator) as the designers where already compensated by software companies buying OEM licenses.</p>
      <p>And, you can also use Libre Fonts, released under the SIL Open Font License. In many cases the designers where also compensated in advance. In other cases, the designers released them for free without seeking compensation. Also, when a font has the SIL Open Font license attached, it makes it 100% legal for anyone to use it for commercial projects (as opposed to free fonts whiteout any license attached).<br>
      In many cases, Libre fonts used to be "Pay font", that have now been re-released under a Libre license (for example you can find font by Sudtipos, Type-together, TypeSetIt and many other commercial foundries on Google Webfonts)</p>
