    <p>Hi all,</p>
    <p>I think this may have been addressed before, but I can't find the thread if there is one. Anyway, does anyone know if the 'Nova magazine' masthead or 'Very' logotype is a font or is it custom drawn?</p>
    <p>As both logotypes were done by different studios at different times (Nova first) i am assuming it is a font.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Nova Magazine _ Big Active_5010.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Very_ Wolff Olins_6659.jpg"></div><p></p>
