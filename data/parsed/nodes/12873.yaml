      <p>&gt; I did try FontLab but my bezier drawings pasted<br>
      &gt; into it so badly that I may have well just drawn<br>
      &gt; them in FontLab to start with. Trouble was, I<br>
      &gt; had already drawn them in illustrator (which<br>
      &gt; I have experience with) and once I realised that<br>
      &gt; I had to use Illustrator 8, the curves went<br>
      &gt; into Fontographer perfectly.</p>
      <p>Paul, </p>
      <p>note however that Fontographer will also distort your glyphs -- when it generates the font. Fontographer allows non-integer coordinates during the drawing, so you can paste arbitrary artwork, and freely scale and move it in Fontographer. But when Fontographer generates the font, it will round all the coordinates to integers, causing your outline points change positions. It can be easily tested: just generate a Type 1 font in Fontographer and read it back in, then compare. </p>
      <p>FontLab does to rounding already at the beginning of the process. So if you scale the glyphs to the appropriate size in Illustrator and paste them into FontLab, you will see exactly what the forms will look like in the final font. In the end, whatever goes into the font from Fontographer or FontLab, is the same. The difference is that FontLab always shows you in full WYSIWYG what the font outlines will look like while Fontographer allows you more freedom in the design process but then does the coordinate rounding for you in an uncontrolled manner. Which usually means you will have to redraw the glyphs anyway so *you* decide where the nodes should snap rather than the application. </p>
      <p>There are some additional informations at:<br>
      <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
      <p>Regards,<br>
        Adam Twardoch<br>
        Fontlab Ltd. -- The home for Fontographer and FontLab</p>
