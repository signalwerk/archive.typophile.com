      <p>Thanks Adam, that makes sense now I have generated my font. I must admit that because I actually own Fontographer I could play around with it a lot more.</p>
      <p>I am pleased with how this has gone and the font does look like the artists original captions, right down to the spacing and kerning. It was a steep learning curve and I haven't even begun to scratch the surface.</p>
