      <p>Thanks for the reply.  I got the outlines into Fontographer by using Illustrator 8 and the scaling trick worked a treat.</p>
      <p>I find myself in the bizarre position of being asked to digitise an artists handwritten font which is going to be on a specific range of greetings cards for a company that has world wide distribution - and this is the first font I have ever digitised.</p>
      <p>I spent a long time tracing the scans and the spacing and kerning was fun to do as the font is emulating handwriting and requires a certain random look to emulate the original scans.</p>
      <p>Today I took the font in and within an hour they had approved it and the art team were using it on the range of cards, which is quite scary as I have not even finished making ALL the characters I would like to include with the font. Due to very long ascenders and descenders the font is quite small in comparison to other fonts at the same point size. I offered tho try and tweak this but they want to use the font now and say that it will only ever be used for captions and although it would be useless for body text it works very well for the captions.</p>
      <p>Three weeks ago I had never made or even attempted to make a font and I would like to thank typophile for the many hours of fine reading material. I am now hooked and although my first font is going to appear in a number of countries on an overwhelming number of cards, I am now seriously into type faces.</p>
      <p>I did try FontLab but my bezier drawings pasted into it  so badly that I may have well just drawn them in FontLab to start with. Trouble was, I had already drawn them in illustrator (which I have experience with) and once I realised that I had to use Illustrator 8, the curves went into Fontographer perfectly.</p>
      <p>Thanks again for the help.</p>
      <p>Paul</p>
