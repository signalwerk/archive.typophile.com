      <p>There's an easy way to fix this. (Sorry for my incorrect terminology and english in the following): In Illustrator make a rectangle the size which extends from the character which has the lowest point to the letter which has the highest (from the descender to the ascender). When you copy from Illustrator you should copy several letters (or all of them if your computer can handle it) together with that rectangle. </p>
      <p>Move to your font application and paste the characters into a slot. Now you should have your characters in Fontographer or FontLab. And they should all be proportionally aligned as you intended. From there on it’s just a matter of moving each letter into its own slot. I hope that helps.</p>
      <p>/Robert</p>
