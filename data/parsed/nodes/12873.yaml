    <p>Hi,</p>
    <p>I am very new to building fonts. I have converted a few for work and tweaked, but creating from scrtach is a whole new board game.</p>
    <p>Ok, so my task is to make a font from a hand drawn alphabet. I have two seperate scans one comprising of all the upper case characters, the other, lower case characters. I am running OS X and own Fontographer 4.1.4 and have access to FontLab 4.6. My Mac will boot natively into OS 9 if need be.</p>
    <p>Right, I placed the scan of the upper case characters into Illustrator 10 and have traced the characters to the point where I am very happy with them. I have done the same with the lower case and so have two Illustrator 10 files that make up my alphabet, all drawn and traced in proportion to each other. Now my problems start. Copying and pasting directly from Illustrator 10 into Fontographer doesn't want to work at all. I have read that doing this natively in OS 9 and using Illustrator 8 will cure this but have yet to try it, can anyone confirm this? I can import the whole EPS into fontographer but this means the whole alphabet is in one glyph space and the letters are tiny, and I mean really small (remember I had to trace a hand drawn image of the characters). When I split them up by copy and paste into individual lettersFontographer resizes which causes a huge problem with the lower case letters as they become the same size as the upper case characters and because the upper case is in one file and the lower in another, fontographer applies different scaling to each set.</p>
    <p>Now that I have traced and am happy with my bezier curve drawings in illustrator I could enlarge them proportionally but what is the optimum size for doing this that would make them appear at a decent size in Fontographer?  I imported the curves into FontLab but they got hideously mangled and aside from my scaling problem in Fontographer, the curves came into that damn near perfectly. And of course I own Fontographer and have used it before.</p>
    <p>So (sorry to ramble guys) this should be relatively simple but is driving me crazy. Because the characters are hand drawn they are all proportionate to each other and that is how I want them in fontographer but the scaling is all over the place when I finally get something into it. I have read the Fontographer manual and am looking forward to messing with getting the font spaced and kerned etc but I just cannot get my slaved over bezier curves out of illustrator and into fontographer without messing up the size and proportions I worked hard to keep in the original tracing.</p>
    <p>Any help to these novice questions wouold be very greatly received.</p>
    <p>Thanks for reading.</p>
