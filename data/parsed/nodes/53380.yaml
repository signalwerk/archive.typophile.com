    html: |-
      <p>Luciano, as you probably know, it's a foregone conclusion that you won't find a consensus of opinion about letterspacing -- and it's not just a matter of taste, or variations in the letterspacing sensitivity of various contributors (although both of these are important factors); but there is also the question of whether or not you take into account the interior spacing of the letters as you adjust the spacing between the letters. Some do, some don't.</p>
      <p>For what it’s worth, here are my thoughts: I don't agree that the D needs to be moved to the right. If anything, it needs to move to the left a little. But the main problem for me is that the letters ISU seem to me to be significantly tighter that either the letters at the beginning and end of the word.<br>
      &nbsp;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;~~~~~~~~~~~~~~~~~<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>When going from </em>A to Z,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>I often end up </em>At Oz.</p>
    html_clean: |-
