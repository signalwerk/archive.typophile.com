  - id: 322169
    user: 4886
    date: 2009-01-12T21:35:00
    date_raw: 12 Jan 2009 — 9:35pm
    votes: null
    html: <p>I think that, from a type design perspective, the cohesion of the letters is so wunky that a different face should be chosen as a starting point. The weight of the heavy serifs (proper term?) on the S vs L are mismatched, the inner counters/arcs between D U and S are inconsistent, and the blunt apexes on the A and V seems out of place to me. Also the S seems to wide.</p>
    html_clean: <p>I think that, from a type design perspective, the cohesion of the letters is so wunky that a different face should be chosen as a starting point. The weight of the heavy serifs (proper term?) on the S vs L are mismatched, the inner counters/arcs between D U and S are inconsistent, and the blunt apexes on the A and V seems out of place to me. Also the S seems to wide.</p>
