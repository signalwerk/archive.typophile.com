      <p>There's nothing unusual about liking that italic. It's gorgeous, and there's nothing quite like it in typeface form.</p>
      <p><a href="http://www.fontshop.com/showfont.cfm?fid=MVB.118647.0.0" rel="nofollow">MVB Sirenne</a> was inspired by similar map lettering of the 17th and 18th centuries. Otherwise you have to look to the <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=8&amp;displayfontid=C.995.0.0&amp;fontRendererText=Gardening+Issue" rel="nofollow">Bodoni</a>s, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.120939.0.2&amp;attributes.sampleSize=48&amp;sampleText=Gardening+Issue&amp;sampleSize=48" rel="nofollow">Didot</a>s, and other modern serif italics. <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=UR.109787.0.2&amp;attributes.sampleSize=48&amp;sampleText=Gardening+Issue&amp;sampleSize=32" rel="nofollow">Craw</a> has the wideness and monocular 'g'. But it's not nearly as elegant.</p>
