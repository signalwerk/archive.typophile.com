      <p>For what I have seen… Most of the blackletters that first came to Mexico were Rotunda, since this was the most popular blackletter in Spain at the time. This is a heavy but rounder letterform than Textura.</p>
      <p>“Rotunda was created at the beginning of the 14th century in Italy. It became very popular as a round gothic type, and its use extended for centuries. It is believed to be a transitional letterform from blackletter to roman.<br>
      The top and bottom ends of the stems no longer have the diamond shape that is present in Textura. The character a is double-storied with the lower part kept very small; the o is curved on the top right and bottom left, but remains broken on the bottom right and top left. In general, the shape of the letters is rounder and therefore more legible than in its predecessor.”<br>
      (From my book too.)</p>
