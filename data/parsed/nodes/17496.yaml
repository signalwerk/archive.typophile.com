      <p>Here is a little bit of history on how blackletter first came to the New Continent. Is from my book.</p>
      <p>America was discovered in 1492 and by 1521, Hernan Cortes, on behalf of the Spanish crown, conquered Mexico, establishing the Colony of New Spain.<br>
      The first printing press in the American continent was found in Mexico in 1538, by means of Juan de Zumárraga, first bishop of Mexico, and Jakob Kronberger (known as Jacobo Cromberger), the most important printer in Seville at the time, who, been of German origin, was the founder one of the first printing presses in Seville around the beginning of the 1500’s.<br>
      Jacobo Comberger supplied all the materials and tools, such as press, movable types, ink and paper and sent one of his closest technicians, Italian Giovanni Paoli (known as Juan Pablos) to be in charge of setting up and run the first printing press in the New World.<br>
      In 1544 the fist printed book in America was published: Doctrina Breve by Fray Juan de Zumárraga, which was set in Rotunda blackletter, proving that movable types of blackletter where taken to Mexico.</p>
      <p>Christian,<br>
      please don’t apologize. Your topic is super interesting!</p>
      <p>El dirto,<br>
      Thanks for joining typohile and welcome!</p>
