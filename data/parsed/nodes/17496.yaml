      <p>I just finished going through my copy. I enjoyed it, since the phenomena is something I’ve also been noticing on my trips to Baja. I especially enjoy seeing the one that are either very skillful, or very quirky, but obviously hand-painted.</p>
      <p>My favorite quote from the book, “Just raising the question of why they chose blackletter made some people uncomfortable under the pressure of having to verbalize an un-rationalized aesthetic whim.”- Somehow I can picture it.<br>
      ; )</p>
