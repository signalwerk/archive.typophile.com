      <p>&gt;Say more about your project Handselecta…</p>
      <p>Well' ok, but only if you bend my arm... Handselecta is a project that looks at graffiti and its geographic styles and differences. Each city has a different characteristic that unifies the scripts that writers employ. Less now with the cross polinization of the internet, but nonetheless, the roots are still there,</p>
      <p>As for the Cholo/Mexican American/Cailifornia style of graffiti, Handselecta is working with an artist named Mike Giant from Albequerque, New Mexico, who is very influenced by this lettering style in his artwork. <a href="http://www.handselecta.com/fonts_hsgiant_so.html">http://www.handselecta.com/fonts_hsgiant_so.html</a> <a href="http://www.mikegiant.com/">http://www.mikegiant.com/</a></p>
      <p>My understanding (please fill in any of the blanks or fuzzy facts if anyone knows) is that most of the early printing presses in Colonial Mexico were stocked with Dutch blackletter types, because of the political link between the royal families of Spain and the Netherlands. These printing types are the basis for what has become most of the vernacular blackletter that we find handlettered in this culture. It is ingrained in the culture and was adopted by the gangs of LA as early as the 30's according to Chaz's article, pre-spray paint and was executed in brush, or as Chaz conjectures, possibly the daubers of shoe-shine boys</p>
      <p>Another interesting iteration is the pichacao style of graffiti form Brazil, which is also a square-ish blackletter style executed with small rollers as opposed to spray paint.</p>
      <p>Attached is a cholo handstyle by Mike Giant, taken from his blog:<img src="/sites/default/files/old-images/header.gif"></p>
      <p>And here is a pretty good example of pichacao by Os Gemeos of Sao Paulo<img src="/sites/default/files/old-images/gemeos.jpg"></p>
      <p>Sorry, for opening it up to subject matter outside of Mexico, hope this is relevant to you.</p>
      <p>Best,<br>
      Christian</p>
