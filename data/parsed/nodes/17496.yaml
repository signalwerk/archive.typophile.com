      <p>The thing is, it’s not really a letter, it’s simply a way (an archaic way) to write the regular ol’ “s”, depending on where it falls in the word. And although I certainly haven’t looked carefully, I’d be surprised if the practice was completely absent from old Mexican typography (and even more so manuscripts).</p>
      <p>hhp</p>
