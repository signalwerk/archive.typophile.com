      <p>Aaron,<br>
      You are very kind. I’m absolutely thrilled with the responses that my work has produced. It was absolutely unexpected.<br>
      I had to do all this work in only 4 months, one of which was taking pictures in Mexico and trying to gather information on this phenomenon. The other 3 months were of sleepless nights of understanding the shapes, cutting and ‘cleaning’ the characters, overlaying them, reading and researching all I could about blackletter.<br>
      I literally dreamed with little colourful characters, that became black, or that I had to arrange… for three consecutive months. This project has been one of the most amazing journeys of my life, both in a creative and intellectual level.</p>
    html_clean: |-
