      <p>Hi everyone, just new to typophile</p>
      <p>In Germany Fraktur and Schwabacher are the predominant blackletter categories historically. Both have the extended f and s terminals below the base line. However I am unsure of the rare times blackletter is used in Germany which category they now hark back too.</p>
