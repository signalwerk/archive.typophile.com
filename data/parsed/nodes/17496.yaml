      <p>&gt;In my final year focusing on blackletter for the major project I have &gt;admired your work on mexican blackletter. Sounds like you have had &gt;good success now that you are publishing a book.</p>
      <p>&gt;Have you had alot of opportunities after completing your project?</p>
      <p>Yes Hanna. Actually loads of people are interested in blackletter, and I’ve had beautiful responses to my project, that have led to exiting projects and forums.<br>
      I’m really happy and overwhelmed with the success the project has had so far. </p>
      <p>&gt;I was interested in what kind of mark you got given for your final &gt;project? (an optional question).</p>
      <p>I got an A. And a beautiful pencil from my tutor inscribed with the word EXCELLENT. (I think I value more the pencil than the mark!)</p>
      <p>;-)</p>
