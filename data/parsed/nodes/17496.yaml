      <p>I agree with you on the importance of been clear and fair with the facts… I know that there are many theories (and some facts) about this encounters that you are pointing out; one of which is the ‘Bering Strait Theory’, that supports the idea that tribes from north-eastern Asia came to America between 12,000 and 60,000 years ago. I know there are many others from then.</p>
      <p>It is delightful to run into people that are keen on accuracy and clarity… but I’m not surprised: After all we are in a typographers/philes forum! </p>
      <p>So allow me to refrace:<br>
      In 1492 Christopher Columbus arrived to America and by 1521, Hernan Cortes, on behalf of the Spanish crown, conquered Mexico, establishing the Colony of New Spain.</p>
      <p>Now is clear that the 'discovery' that I’m referring to is the one of Columbus, which is directly linked to the Conquest and the Colony of New Spain.<br>
      (is funny… I decided to put the discovery of 1492 just to make clear to the reader that the Colony wasn’t immediate. It took many years, and many battles)</p>
