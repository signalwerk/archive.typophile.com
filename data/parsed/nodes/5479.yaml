    html: <p>Wow, first post and it's in the critique section... <br> <br>Andrew, this looks nice. It has a lot of stature. I like the straight sides of the letters and some glyphs like the e and the g are especially nice. <br> <br>The cap S looks a little top heavy to my eye, maybe the top could be smaller and/or the waistline of the glyph moved up a little. <br> <br>To get back to the e. I like it. The angled bottom on its eye is nice and the taper to the back is a nice touch. Where the taper connects to the vertical stem though it has a little blobiness. You might need to curve the stem into the intersection or employ some trapping to mitigate against this. At larger sizes, I think the eye looks a little large, but at the smaller sizes it seems to do well. <br> <br>You might want to bring the dot on the i down a little. <br> <br>The g seems to tip a little to the right. I'd also look at beefing up the bar on the f. <br> <br>Nice work Andrew. Welcome to the forums. <br> <br>Jon</p>
