      <p>I just found this again. I agree with Hrant - the g is really interesting but that yes - it should be stripped from this font for the overall effectiveness of the face. In general I find that the face is very pleasant - suprisingly so given the lack of humanistic contrasts in general. Maybe it's just the ratios in the shapes. It's very pleasing in running text. </p>
      <p>I wonder if it would be a good idea to soften some of the more unusual features a little such as in the lower case 'e'. The pure geometry of the C is causing an illusion to my eye which makes it appear weak or wobbly. Maybe a softer join would be better. ( G too) The same contruction is used in the O of course but it doesn't bother my eye there. Probably because it is closed. The on the bottom of the Cedilla the hook could feel more exhuberant and it would feel more at home in the face I think. Same with the tail of the Q and the ear of the g. I think the % sign needs to be weightier. Now it looks indecisive. Is it mean to be a ligher weight than the other glyphs for some reason or no? It's too liminal now. The a seems like it is maybe wider than it needs to be and I wonder if the e should take some of it's flavor from the a somehow. Please take all this witha grain of salt. It's all observed on a laptop screen I have no printer where I am today. I have some spacing comments too but I would rather wait to see what you do with some of what I see as the problem glyph shapes before mentioning anything. Keep going. </p>
      <p>Cheers!</p>
