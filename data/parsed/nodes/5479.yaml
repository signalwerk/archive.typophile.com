    html: |-
      <p>I think your right about it being possible to make things that are both distinctive &amp; which nevertheless work -  &amp; work well. In fact I think all really tasty/solid typographic innovation falls into this category. But it isn't easy. It seems like you are resonably close to having a viable face with Sooker that you could go for the low hanging fruit &amp; just concentrate on testing the font really well &amp; generally doing a solid workman like job of the thing. Which is no small feat in fact. If you do that really well then you may even create innovatiuon which is less obvious but valauble nonetheless. And then yes maybe a display font too.</p>
      <p>On the other hand you could stick to your guns 7 work &amp; rework the ideas until they fit into the face in a more organic way. Or you could put it down &amp; come back when you have trained your eye further... or ....</p>
      <p>Whatever keeps you working away at type is probbably the right choice.</p>
      <p> I hope you post the next edition for us to see. Cheers!</p>
