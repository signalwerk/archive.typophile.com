    <p>Hello! <br> <br>I've been lurking for a while now, but I reckon it's finally time to subject my fonts to scrutiny. <br> <br>I've been designing fonts on-and-off (mostly off) for a few years, purely as a hobby.  Most of my designs so far aren't hugely original - Sooker is my first attempt at something a little more unique. I wanted to try and create something idiosyncratic, yet legible too. <br> <br>Lower and uppercase characters are complete, as well as some punctuation. <br> <br>I would be extremely grateful for any comments and feedback before I start work on the bold weight. <br> <br></p>
