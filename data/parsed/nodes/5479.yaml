      <p>Thanks for the comments Hrant.  I'm loath to get rid of the g, but now I can see it doesn't quite gel with the rest of the font.</p>
      <p>I drew the k using the following method:<br>
      1) start with a letter l<br>
      2) copy it and rotate 40ish degrees clockwise, trim to size<br>
      3) copy the l in step 1, rotate 40ish degrees anticlockwise and trim<br>
      4) realise it doesn't look great, start panicking and move points around until I get something a bit better.</p>
      <p>I find that I rely on step 4 quite a lot when I draw glyphs!</p>
      <p>Need a bit of help here.  Where else do you suggest modifying the stroke contrast?</p>
