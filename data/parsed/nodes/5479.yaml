      <p>Thanks Eben - very helpful comments.  </p>
      <p>Perhaps there are two coherent fonts lurking in here somewhere - a straightforward text face and something a little more suited to display.  The latter could incorporate the unusual features of the a, e and, yes, that g.  </p>
      <p>I think at the moment I'm trying to negotiate that thin line between producing something distinctive and producing something familiar.  When can "unusual" be absolutely right?  If I knew the answer I'd be a happy man.  Anyway I shall certainly keep trying.  Thanks once again for the comments!</p>
