    html: <p>Hi all, <br> <br>Thanks for the comments - it's gratifying to know that it's worth taking this further. <br> <br>Usability is exactly what I was striving for.  The goal was to create something distinctive that could be used as body text but isn't too quirky. <br> <br>I'm trying to make the glyphs a bit more consistent at the moment (especially stroke width) and I've also toned down the t and f. It seems to work a bit better as a result. <br> <br>I will post another pdf when it's done. <br> <br>Thanks everyone <br>A</p>
