      <p>After nearly two years it's probably about time I updated this thread!</p>
      <p>Since my last post, my first fonts (Exuberance and Exuberance Primary) are now commercially available from <a href="https://web.archive.org/web/20150123133931/http://www.t26.com/" rel="nofollow">T-26</a> and I've rediscovered Sooker in an effort to add to my portfolio.  Sooker is now a four weight family, with italics to follow.</p>
      <p>The spacing and kerning have yet to be completed but would be grateful for your thoughts before I continue.  Who knows, it might even be ready by the end of the decade!</p>
      <p>Please take a look at <a href="https://web.archive.org/web/20150123133931/http://www.andrewgraham.co.uk/files/pdfs/SookerFamily.pdf" rel="nofollow">this PDF</a> and feel free to give your comments.</p>
      <p>Thanks in advance<br>
      Andrew</p>
