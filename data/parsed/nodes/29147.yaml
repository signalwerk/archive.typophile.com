  html: <p>Should the business card and compliment slip reflect the design of the letterhead? i.e. should the layout and positioning of text, logo be similar so it looks more like a set rather than 3 different pieces? or is it best not to?</p>
  html_clean: <p>Should the business card and compliment slip reflect the design of the letterhead? i.e. should the layout and positioning of text, logo be similar so it looks more like a set rather than 3 different pieces? or is it best not to?</p>
comments:
  - id: 165409
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Yes, it should look as if it is part of a set, i.e., all the pieces should reflect the save overarching corporate identity.</p>
    html_clean: <p>Yes, it should look as if it is part of a set, i.e., all the pieces should reflect the save overarching corporate identity.</p>
  - id: 165410
    user: null
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>The short answer is keep it as a suite, bearing in mind that a letterhead obviously has a different purpose to a comp. slip and a business card. </p>
      <p>The relationship of letterhead to comp. slip is much closer than the business card in that they will need the same information, postal address, registered address and registered number, probably with a generic telephone, fax, e-mail and url, wheras a business card has some of this information but with the name of the individual, with a direct line and e-mail and is not primarily intended to be written on.</p>
      <p>The logo should be the same unless you have a clear reason why it shouldn’t be, although you might consider if you have a particularly vertical logo you might require a horizontal logo for some applications, for example van graphics or website masthead. The treatment of the text needn’t be exactly the same although I would keep to the typeface family, the proportions of point size and leading the same. It really depends on the design and requirements of the client, as a student (and I am guessing this a college project) you are probably best off starting with keeping the elements the same. </p>
      <p>Try searching for stationery projects in some design agency portfolios.</p>
      <p>Tim</p>
