    html: <p>so does it mean that if a business card is portrait, then a compliment slip should be too? is there anything such as a vertical comp slip?</p>
    html_clean: <p>so does it mean that if a business card is portrait, then a compliment slip should be too? is there anything such as a vertical comp slip?</p>
  - id: 165412
    user: null
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>There are vertical comp slips, the <em>usual</em> format is landscape.<br>
      The problem with portrait business cards is that one will occasionally come across somebody with a double barrelled name whether inherited or due to a marriage and that can present a problem with the name, but more of a problem is the e-mail address a long name joined to a long e-mail url can be too long for portrait to contain in one line.<br>
      Tim</p>
