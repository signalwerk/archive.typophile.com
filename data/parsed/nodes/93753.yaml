    html: <p>Corporate typeface exclusively done for Mr Porter named Brook Porter. As you said, Engravers Gothic, as <a href="http://www.myfonts.com/fonts/mti/sackers-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sackers Gothic</a> (Heavy, the closest I guess) and <a href="http://www.myfonts.com/fonts/itc/blair/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Blair</a>, is very close though not matching.</p>
