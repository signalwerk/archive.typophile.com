    <p><a href="http://www.samsung.com/us/consumer/office/printers-multifunction/black-and-white-multifunction-printers/SCX-4500W/XAA/index.idx?pagetype=prd_detail" title="http://www.samsung.com/us/consumer/office/printers-multifunction/black-and-white-multifunction-printers/SCX-4500W/XAA/index.idx?pagetype=prd_detail">http://www.samsung.com/us/consumer/office/printers-multifunction/black-a...</a></p>
    <p>I’ll admit, it’s got curves in all the right places. But I’m a bit leery when it comes to all-in-ones. It uses SPL (Samsung Printer Language), so no PCL or Postscript. It does 1220 dpi “effective” output, so that already tells me that there are some compromises with respect to output quality. I’ve never seen 1200 dpi “effective” output (just true 1200), so I don’t know how well it can approximate true 1200 dpi. </p>
    <p>I have no experience with Samsungs, really, but I think I’d be hard-pressed to top what my HP Laserjet P2015 can do in terms of print quality (1200x1200 as well, and even the 600 dpi is oh-so-crisp and clear.) At least in the $300-$400 price range. This Samsung doesn’t quite seem like a workhorse, and I’m not too tickled about the 100-sheet tray, either. </p>
    <p>It seems incredibly well-mannered, though. Very quiet, and apparently very polite.</p>
    <p>Thoughts? Opinions?</p>
