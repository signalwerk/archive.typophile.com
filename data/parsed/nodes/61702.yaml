      <p><cite>...It does 1220 dpi “effective” output, ...</cite></p>
      <p>It’s probably really 610 dpi plus some tricks, like variable dot sizing or just running the paper through more slowly so the dot pitch can build up on the thru axis. I can’t tell for sure without checking the specs, which I didn’t. Those are old tricks I mentioned. There may be new methods of artificially boosting resolution that I don’t know about, or improvements to these.</p>
