    html: <p>Mark is absolutely right about this being a custom monogram. The interwoven characters is the proof it's not a font. <br> <br>If you have graphics software, like Illustrator or Freehand, you can do this sort of thing using any suitable font. (<a href="http://www.myfonts.com/fonts/bitstream/arrus/" target="_blank">Bitstream Arrus</a> has a somewhat similar serif style, but would need lengthening/narrowing if the letters were to approach this look. There are probably better candidates, if you don't worry about the serifs.) <br> <br>For Monogram fonts, you might consider the selection of Harold Lohner in his <a href="http://members.aol.com/fontner/monogram-collection.html" target="_blank">Monogram Collection</a>, especially the Script versions.</p>
    html_clean: <p>Mark is absolutely right about this being a custom monogram. The interwoven characters is the proof it's not a font. <br> <br>If you have graphics software, like Illustrator or Freehand, you can do this sort of thing using any suitable font. (<a href="http://www.myfonts.com/fonts/bitstream/arrus/" target="_blank" class="link-external">Bitstream Arrus</a> has a somewhat similar serif style, but would need lengthening/narrowing if the letters were to approach this look. There are probably better candidates, if you don't worry about the serifs.) <br> <br>For Monogram fonts, you might consider the selection of Harold Lohner in his <a href="http://members.aol.com/fontner/monogram-collection.html" target="_blank" class="link-external">Monogram Collection</a>, especially the Script versions.</p>
