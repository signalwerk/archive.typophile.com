    html: |-
      <p>You need to really pay attention to the kerning in your title.</p>
      <p>A crude but good way to start with kerning is to imagine water filling the spaces between the letterforms. You are attempting to adjust the spacing between characters so that the amount of water is about the same or similar between each letter. Over time you'll develop a keener sense of balancing out the negative space.</p>
      <p>It's a small detail but it helps to improve the tightness of the composition.</p>
