    <p>I'm designing a magazine and I'd like some critique on the fonts used so far.<br>
    I'm using Gotham and Stag together I like them as heads and standfirsts but I don't think either are quite right for body copy. Would using a third font for body be overkill?</p>
    <p><a href="http://farm5.static.flickr.com/4070/4292433135_0195d0c208_o.jpg">http://farm5.static.flickr.com/4070/4292433135_0195d0c208_o.jpg</a></p>
