    html: "<p>Maybe this: <br>Script fonts tend to need a lot of room for ascenders and descenders, and the normal practice of confining all the parts of all the glyphs (well, except like the UC A-ring or something) to the vertical Em-space makes things look tiny compared to non-script fonts (or other script fonts with projecting extenders). So try to find a happy medium between apparent size and confinement of extenders. Subsequent lines might have crashes, but you could say that's normal in a script anyway. <br> <br>hhp <br></p>"
