  html: <p>Salutations, <br> <br>I have been having some problems lately.  <br>I transfer my letters from Illustrator into Fontographer (holding down option while copying and pasting), clean it up, kern it, and finally suitcase it. Yet when I use it in  Illustrator it's always smaller than other fonts (ie. Any 24pt script font appears larger than my script font at 24pt ). <br> <br>Anyone have any suggestions as to what I am overlooking? I would greatly appreciate it if you could! <br> <br>Thanks <br>dave</p>
  html_clean: <p>Salutations, <br> <br>I have been having some problems lately.  <br>I transfer my letters from Illustrator into Fontographer (holding down option while copying and pasting), clean it up, kern it, and finally suitcase it. Yet when I use it in  Illustrator it's always smaller than other fonts (ie. Any 24pt script font appears larger than my script font at 24pt ). <br> <br>Anyone have any suggestions as to what I am overlooking? I would greatly appreciate it if you could! <br> <br>Thanks <br>dave</p>
