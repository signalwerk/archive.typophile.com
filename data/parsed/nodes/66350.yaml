      <p>I'd like to address a comment I received from a very particular typophile, regarding the impression in these cards.<br>
      And I seem to recall snark from the same quarters regarding my previous posted work as well. Snark is as snark does. You shall know them by their fruits.</p>
      <p>While I'm perfectly happy to listen to anybody's "rant" (at least for 30 seconds) I also feel like I have the right, particularly here, to explain my philosophy regarding the unwarranted strong opinions that seem to arise about deep impression in letterpress... as if it's really important considering the state of the real world, earthquakes, wars, poverty, and injustice.... Hello?</p>
      <p>I am a printer. I know how to control my press, and I can choose to print however I like. </p>
      <p>This is how I like to print, if there are no other considerations, ie, clients or juries, etc etc<br>
      Remember the First Amendment, eh?</p>
      <p>Why should I print like John Baskerville? I knew John Baskerville, and he was no lover of high-touch impressions.<br>
      He rejected the tactile paper of the 17th century in favor of his own invention. No problem with that. "De gustibus non est disputandum", eh what? The light chaste kiss can be quite charming. I know. I own at least three or four volumes printed by Mr Baskerville himself, including his last, Lucretius' <em>De Rerum Natura</em>. Lovely, but chaste. I prefer Aldus' edition of 1515. I have a copy of that as well.</p>
      <p>I do prefer the passionate embrace of the paper found in 16th C printing, sometimes messy, but full of life.<br>
      The paper was shoved by the quire into vats of water to soften the fiber enough that the lumpy mess of cellulose could all be brought in contact with the type in the form. And impress they most certainly did.</p>
      <p>So, for a pretentious interloper to tell me [candidly, says he] that my 'impression is abysmal in every sense" rather raises my hackles... to put it mildly.</p>
      <p>I choose to dampen my paper to allow the cellulose to relax fully into that embrace. I use a soft packing in this case, hard in others. I mix my oil-based ink with mag to shorten it, and make it lay perfectly matte and flat at the deep bottom of my impression and I set my rollers so that there is not a micron of excess ink on my plate.  A messy printer can't <em>afford</em> to go deep into the paper. The impression will prove their incompetence at controlling the ink and the rollers.</p>
      <p>My plates are 21st century high-tech polymer, perfectly suited to printing 100000 impressions just like this one, and a Windmill press which allows me complete control over a full 35 tons of impressional strength. Who dares to tell me I should not use it???</p>
      <p>Let's take a look at your printing with a 10x loupe, eh?</p>
      <p>I would have thought you would critique the letter spacing, where perhaps you have some semblance of expertise. (I did it 20 years ago, in metal, and now my eye sees all kinds of potential for improvement.)</p>
      <p>PF</p>
