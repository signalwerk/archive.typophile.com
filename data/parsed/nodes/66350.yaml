    html: |-
      <p>Hi @eliason<br>
      The Optima type is a very fine 36-point foundry metal acquired in the 1980s from an advertising typographer in Chicago. It has never been used for production printing.<br>
      In order to maintain the condition of the metal, I proofed it, much as it was used originally. My earlier (1990s) run on the Vandercook was a very limited edition.</p>
      <p>Indeed, the Deepdene is even more fragile, if somewhat easier to replace, as it's soft Monotype metal, again not intended for production runs, and particularly not on rough paper with some depth of impression. </p>
      <p>If I had easy access to hot-metal, then no problem to replace it after a few thousand impressions. But since the digital option exists, it is preferable.<br>
      Certainly the quality of the impression is perfectly acceptable in this context.</p>
