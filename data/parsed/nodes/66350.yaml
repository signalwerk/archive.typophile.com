    <p>The original design was hand-set in foundry Optima and a funky Monotype Deepdene back in the late 1980s, and printed in a small run on the Universal I Vandercook.</p>
    <p>I recently discovered the forms still standing in the galley. This new edition is printed on the 10x15 Heidelberg Windmill from photopolymer, made from new repro-proofs taken from the original type, and scanned at 2400 dpi. Minor artifacts from the proofing and scanning were cleaned up in Photoshop prior to making film and plates. However, the original design has not been altered, although it was awfully tempting to tweak the spacing once more before committing it to the press! ;-)</p>
    <p>The photo was taken in a strong afternoon sunlight. Apologies for the excessive contrast. Need to find my copy-stand!<br>
    The impression is deep, as the dampened paper encourages this, but it's not abysmal! ;-)</p>
    <p>These cards are available in packaged sets with Crane Lettra envelopes.</p>
    <p>US$9.95 / €12.95 including First Class shipping in stiff cardboard  (US &amp; Canada) (Note that even first class packets to Canada now seem to be taking two to three weeks. Hard to believe. Let's blame it on GWBush.)</p>
    <p>US$45 / €50 for 6 cards includes S&amp;H (First Class packet to US/Canada; Small packet Air to EU,  Surface Packet elsewhere)</p>
    <p><a href="http://slowprint.com/2010-koch-optima-cards" title="http://slowprint.com/2010-koch-optima-cards">http://slowprint.com/2010-koch-optima-cards</a></p>
