      <p>i don't know if this is the same thing, but i had a similar problem recently in Fontographer when i imported the glyphs via an illustrator eps. </p>
      <p>i was importing them just fine, but when i typed them out in the metrics window, they didn't show up. then when i exported the font, the glyphs showed up.</p>
      <p>i found that it had to do with the fill in illustrator. i went back to illustrator, turned the fill off (also went into outline mode so i could see the glyphs), and re-imported them into Fontographer. this cleared up the problem. i have no idea why, or if that's the problem you are having but i hope it helps.</p>
      <p>(side note)</p>
      <p>however, importing the glyphs from illustrator lead to another issue having to do with the scale. it seemed like the glyphs would change size depending on the amount and placement of the glyphs that made up the import groups.</p>
      <p>is this a common problem that is easy to fix? should i start a new thread?<br>
