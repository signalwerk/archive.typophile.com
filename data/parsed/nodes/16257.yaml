    html: |-
      <p>FontLab doesn't let you do anything but 100% black. The Fontographer capability is for the virtually obsolete Type 3 font format which allowed such things. Imported art from Illustrator sometimes causes values other than 100% black to be used, causing problems with export of other font formats which don't allow such things.</p>
      <p>Re: Your scaling problem. Are you working in FontLab or Fontographer?</p>
