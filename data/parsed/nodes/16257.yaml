      <p>Paul, are you in FLS5 Beta or FL45M?<br>
      I've seen some things in FLS5 where glyphs lose their identities, and the "regular" spaces of the Font window are blank. I just select all and choose "Glyph / Glyph Names / Reencode Glyphs..." Which assigns everything the right name and Unicode index.</p>
