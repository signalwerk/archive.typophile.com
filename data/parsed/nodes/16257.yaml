    html: |-
      <p><em>Scaling Problem<br>
      Importing (from illustrator- saved down to 3.0) groups of multiple glyphs into Fontographer.</em></p>
      <p>Fontographer normally will scale artwork to the height of the em square. The trick is to include, as part of your artwork, a box or line that corresponds to the ascent and descent of your font. As long as your artwork is not taller than this box (or line), it will always import at the same scale. (This is a very old FOG trick that many wish FontLab could do.)</p>
