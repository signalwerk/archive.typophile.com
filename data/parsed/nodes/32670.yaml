    <p>Hello I am currently studying typography at LCC and have been stumped by the following:</p>
    <p>I am currently designing a small poetry book containing all my strange junk mail (example below). As I receive this via e-mail I would like the face to somehow reflect that, but I would like this book set out in a classic poetry book style. I would prefer to use a serif font, any advice or comments on this would be great.</p>
    <p>So far I have stuck to my usual faces such as Garamond, Minion, Bembo etc... all of which do not carry the ’technological’ aspect....? I’m stuck!</p>
    <p>Example text..<br>
    “Mitch wagner stumble, elizabeth judge spooner.<br>
    Bea oracle join sponsor ee jason westradigg month ejb.<br>
    Half limited bott student standard, items suggestion? Nod obstacles overcome, xanother emulates, columnist rizzo, eweek.<br>
    Chairman gates early aspect finishing.<br>
    Bogged gone bugbears cripple msmvp, sandi hardmeier. Deals, inbox, unable ask appreciate effort wheres stufftrack recent!<br>
    Reiser, namesys ntfsg jatt, isms gsmutils, gsmlib?<br>
    Trust surfing friends family performing document creation. Continuity planning chicagos sized radio deal face breaches spur. Likewise similar anonymous having no identity client, why so?<br>
    Deutsch mxico espaa kingdom centerhelp, placesmsdn mappopular.<br>
    Changed acronym backronym authentic energetic reflective cleaner pleasing thumbnails. Ieee hlp considers prohibits roughly divided varying cater submarkets! Hugos pragmatic agility ledford, gear joyce carpenter.”</p>
    <p>Thanks in advance for any help!<br>
    Claire</p>
