      <p>Kepler is a beautiful typeface and very underused. Understated too. Could be very nice for poetry. </p>
      <p>Electra is a gorgeous little typeface and Dwiggins holds a special place in my heart. But, it is overused. This isn’t to say you shouldn’t use it, but that it has been done and it might be a more worthy challenge to use Kepler. Especially if you have the optical version. Do you?</p>
