    html: |-
      <p>Thanks Craig, I'm pleased you approve of the changes. You were definitely right about the widths.</p>
      <p>Comma, yes, somehow I'm quite demanding with my commas. It's so easy to overlook but really needs to fit in properly.</p>
      <p>I'll take a look at that M, now you mention it, I think that one has stayed a bit too close to Mint rather than finding its own voice. Do you see a problem with the tiny slope to its downstrokes?</p>
      <p>Kk, would you try a horizontal bar or have the upper arm joining the stem? Maybe I'll just try both.</p>
      <p>I was thinking the A might still be a bit wide, but I like the gradient of its strokes. I wonder if I can find a way to keep that gradient while making the overall shape narrower.</p>
      <p>EFLT, well, I suppose I was trying to add a more humanist tone, similar to Tankard's Bliss (which I'm seeing everywhere these days) or Nick Shinn's recent Sensibility. I'll see about reversing the angles or something. Thanks for the observation on the Xx, I'll see what can be done there.</p>
      <p>Yeah, forgot to tweak the alternate g, that's why it wasn't included in this specimen! </p>
      <p>Bold /S/ was causing some problems. Did it seem happy to you?</p>
      <p>Did you think the bold /a/ should be wider? It suddenly popped out at me...</p>
      <p>And I wonder if the numerals should be a bit wider (first pdf)?</p>
      <p>Many thanks indeed :)</p>
