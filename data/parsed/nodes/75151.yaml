    <p>Carnet is a new take on the classic British humanist sans, drawing inspiration from public signage faces as Gill Sans and the UK's ubiquitous Transport medium.</p>
    <p>With rather wide proportions and pragmatic architecture, Carnet expresses a feeling of openness and approachability. At the same time, it sparkles with sophistication.</p>
    <p>Its clarity of form makes it perfect for public signage and transportation uses. It performs well at text sizes (especially suitable for brochures, instructions and presenting information) and is also appropriate for corporate identity projects.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Angstrom-1_4040.gif"></div><p></p>
    <p>All comments and crit very welcome.</p>
