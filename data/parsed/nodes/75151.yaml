      <p><em>Hm, you could be right, but I'm rather attached to the large round eyes on the bowl-and-stick letters.</em></p>
      <p>Maybe then it's a matter of widening the other glyphs (e.g. /a/r/t/), if that's possible. And as I suggested, some breathing room between letters might also even things out.</p>
      <p><em>g.alt — you mean the single storey one?</em></p>
      <p>Yes.</p>
      <p><em>Short extenders, er, I hadn't really noticed! Do you think they might reduce the usefulness?</em></p>
      <p>Depends on the use you're talking about, I suppose. For "public signage and transportation," I might think lengthening the extenders would make clearer word-shapes and facilitate faster recognition. But other sizes and contexts would have different requirements.</p>
      <p>I think you need more weight adjustment when bolding those letters with tight spots in their structure. /g/ of course, is the biggest challenge, and it does look too dark here. Top of /f/ too. Actually I can see it working well to introduce a lot more contrast in the bold than you have here, particularly if "sophistication" is one of your aims stylistically.</p>
      <p>Did you consider other tittle shapes? The square looks a little rigid, like someone snuck some gothic into your humanist sans.</p>
