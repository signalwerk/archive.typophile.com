      <p>Here we go, I've drawn the bold...sorry no time to make a new pdf today, will do soon.</p>
      <p>I made a lot of changes to the regular proportions as you suggested, Craig. Bolw-and-stick letters have been narrowed a bit, along with c, e, k, s, v, x and y, and widened f, n, r and t. Thanks for that advice, I think it's really gelling much better now.</p>
      <p>The bold got quite a lot wider, and I think perhaps it needs even more overshoot still. It's got quite a different tone, more like Parisine, Bliss or Milo Sans. I added a bit more contrast, do you think it could take even more?</p>
      <p>Tittles: I think this started with round tittles when I first adapted it from Mint last year. I quite like that gothic/grotesque touch in there. I think it must be my fear of softness again!</p><div class="imageWrap"><img src="http://typophile.com/files/Carnet-Sample_6380.gif"></div><p></p>
