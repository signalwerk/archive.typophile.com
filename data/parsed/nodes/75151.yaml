      <p>This looks like it's going to be a great succes when it's released. Versatile, yet plenty of character. You're probably a better designer than I am, so don't take my comments to serious. I agree with eliason that the Xx needs some refinement. The bold S looks fine to me. I think the bold a should be just a little bit wider. All the underneath is for regualr and bold:<br>
      Zz looks a bit top heavy to me. I'd just make the bottom horizontal stroke a bit longer.  The point where the two diagonals in the k meet ( &lt; ),  looks a little bit to low to me.<br>
      The L seems a bit to wide.<br>
      The curve in the J seems a bit forced, not flowing nicely.<br>
      Mainly in the bold, the two story g looks to dark to me.</p>
      <p>I'm probably one of the few designers, if not the only, who thinks this, but I thought to let you know anyway:<br>
      The horizontal part of the g optically looks as if it goes up towards the right, making it look quirky. IMO it should go down slightly towards the right.</p>
      <p>Hope this helps.</p>
