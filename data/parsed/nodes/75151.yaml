      <p>Nina pointed out the wideness of /y/ on Flickr... I think the widths of all the lowercase should be reviewed, paying attention to counter area. The ball-and-stick letters, for example, are quite wide: look at /p/ next to /rag/ in "pragmatic."<br>
      That inconsistently appearing wideness is brought out by your (in my opinion) too tight letterspacing.</p>
      <p>Horizontal proportions of the caps are good, though perhaps /A/ could be narrowed a bit.</p>
      <p>The techno-ish squareness of /g.alt/'s tail seems out of place to me.</p>
      <p>What's the thinking behind the short extenders?</p>
