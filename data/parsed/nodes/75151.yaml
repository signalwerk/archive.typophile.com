    html: |-
      <p>This is looking good!</p>
      <p>The width changes you made are really good; the rhythm is more consistent now.</p>
      <p>Love the comma.</p>
      <p>Regular /M/: I think the upper vertices could be spread out (lengthen those horizontal bits at the tops) and let the angled counter underneath ride up a touch. (In other words keep the side strokes where they are but narrow the "V" in the middle - does that make sense?)</p>
      <p>Bold /C/ looks light. Bold /L/'s horizontal stroke could be heavier, I think.</p>
      <p>That chevron form of /K/ and /k/ seems out of character to me.</p>
      <p>Love the /P/ and /G/ - really a lot of letters to love.</p>
      <p>/A/ still looks a touch too wide to my eye.</p>
      <p>I don't quite get the arbitrary oblique terminals on letters like E, F, L, T. The asymmetry of T's terminals looks particularly odd to me. What really doesn't work to me are the terminals on /X/x/ - the slanted terminals on one stroke and horizontal on the other look really unresolved. There's promise in those ideas (it may be close to working in the legs of /R/K/k/) but it doesn't seem fully worked out yet.</p>
      <p>That bold /f/ looks much much better.</p>
      <p>I think retaining an alternate one-story /g/ would be useful. It would lend itself more to the "delicious roundness"!</p>
      <p>Hopefully others will pipe in here too!</p>
