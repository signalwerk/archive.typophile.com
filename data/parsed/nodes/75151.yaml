      <p>Thanks everyone for all the comments (and to Nick Job via e-mail) — this is getting much better (I hope you agree).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Carnet_5951.gif"></div><p></p>
      <p>The widths are getting much more coherent. I've redrawn some glyphs slightly, including the numerals (which hint at grotesque forms), the hood of the lowercase |a|, eye of |e| and spine of |s|. In the spirit of British wayfinding typefaces there's now an alternate |i| and |l|.</p>
      <p>I'll keep tweaking and post a pdf in a day or two.</p>
