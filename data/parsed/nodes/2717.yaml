    html: '<p>The identity for the 2000 "National Design Triennial: Design Culture Now" used tarzana quite well as the main signature typeface. It really capitalized on the 3 like form of the uppercase "E" The website for it can be found<a href="http://ndm.si.edu/triennial/triennial.html" target="_blank"> here</a>.  <br>(it is also used it in the animated intro <a href="http://ndm.si.edu/triennial/animation.html" target="_blank">page</a>) <br> <br>The book that accompanied the exhibition also used Tarzana. The book is called "Design Culture Now: National Design Triennial" you can have a closer look at the book on <a href="http://www.amazon.com/exec/obidos/tg/detail/-/1568982151/ref=pd_sim_books_2/102-6103632-2921754?v=glance&amp;s=books" target="_blank">amazon.com</a>  <br></p>'
