    html: "<p>Can't find a font that could match perfectly both \"CITIZEN\" and \"KANE\" at the same time. Here are some candidates that could fit these letterings in 2 different widths without squooshing it: <a class=\"freelinking external\" href=\"http://www.typography.com/fonts/font_overview.php?productLineID=100013\" rel=\"nofollow\">Knockout</a> (mainly redrawing /K plus some very little adjustments), <a class=\"freelinking external\" href=\"http://www.typography.com/fonts/font_overview.php?productLineID=100002\" rel=\"nofollow\">Champion Gothic</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be\" rel=\"nofollow\">Akzidenz-Grotesk Condensed</a> (mainly tweaking /Z), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/flat-it/rama-gothic\" rel=\"nofollow\">Rama Gothic</a> (/Z and /K to be tweaked), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/redrooster/block-gothic-rr\" rel=\"nofollow\">Block Gothic</a> (/Z)</p>"
