    date_raw: null
    votes: null
    html: <p>You know, if I'm not mistaken, this may be one of those "original" fonts that Dinc Type did. The site appears to be down or possibly gone forever. A lot of their fonts were existing fonts with various transformations done to them (as has been done to Snell here) to make them look "original."</p>
