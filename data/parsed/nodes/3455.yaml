    date_raw: null
    votes: null
    html: "<p>It appears to be <a href=\"http://www.myfonts.com/fonts/linotype/snell-roundhand-script/snell-roundhand-black-script/testdrive.html?s=So%a0now%2C%a0Israel%3B&amp;p=48\" target=\"_blank\">Snell Roundhand Black</a>, but it has been backslanted to make it upright. Here it is with the slant restored: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/27973.gif\" alt=\"snell\"> <br> <br>It also appears to be slightly spaced out so the connecting strokes aren't connecting, and some of the counters appear to be filled in. The sample is pretty small and low-res so it's difficult to tell for sure what's going on with the counters.</p>"
    html_clean: "<p>It appears to be <a href=\"http://www.myfonts.com/fonts/linotype/snell-roundhand-script/snell-roundhand-black-script/testdrive.html?s=So%a0now%2C%a0Israel%3B&amp;p=48\" target=\"_blank\" class=\"link-external\">Snell Roundhand Black</a>, but it has been backslanted to make it upright. Here it is with the slant restored: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/27973.gif\" alt=\"snell\"> <br> <br>It also appears to be slightly spaced out so the connecting strokes aren't connecting, and some of the counters appear to be filled in. The sample is pretty small and low-res so it's difficult to tell for sure what's going on with the counters.</p>"
