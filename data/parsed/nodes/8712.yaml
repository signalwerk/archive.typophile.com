    html: <p>What you're after is in general called "phonesthetics", so you could search for that. (Although you also seem to be mixing orthography in there, so the grapheme &lt;ll&gt; being used to represent [j] in Spanish wouldn't generally fall under phonesthetics, but more like the general trend that a high, front vowel is used in words for small items (teeny, tiny, etc.), while back vowels tend to be used for larger items (huge, etc.).) Since these deal with trends, you will find much that is inconclusive. That's the nature of the beast. <br> <br>Also, the Sapir-Whorf hypothesis might be of interest to you, but only the weak form (that there is an <b>influence</b>) is tenable,</p>
