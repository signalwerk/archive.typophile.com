    html: '<p>I have been told that in Russian culture 20th century <br>they have at least 3 person, who, like Goethe in Germany <br>18th cent., had a vision of colors of letter in alphabet. <br><br>- Marina Cvetaeva <br>- Velimir Khlebnikov (e.g., ‘L’ is white in his alphabet) <br>- Andrej Belyj <br><br>Best, <br><span class="caps">AS</span> <br><br><br><span class="caps">PS</span>/ <br><br>Jorrit Tornquist <br>(has been my professor at Politecnico of Milan)&nbsp;: <br><a href="http://www.tornquist.it/" target="_blank">http://www.tornquist.it/</a> <br><br>Jos</p>'
