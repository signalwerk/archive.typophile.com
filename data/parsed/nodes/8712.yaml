    html: '<p>Ah, synesthesia. Fascinating topic. Coincidentally, I saw another reference to this condition today, in a Guardian <span class="caps">TV</span> review of a recent documentary about the postmortem adventure’s of Einstein’s brain. It has been suggested that Einstein may have had some degree of synesthesia, prompting the documentary makers to interview a couple of synesthetics: apparently the name Albert Einstein ‘tastes like yoghurty wafers’. <br><br>I’ve heard that some synesthetics experience text as colours, but I don’t know of any&nbsp;references.</p>'
