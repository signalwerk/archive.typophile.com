  html: <p>I am undertaking some research to discover if there are any relationships between individual letters and particular colours.  I am also interested in how combinations of letters relate to particular colours, in this sense I am thinking of looking at linguistics, and the certain combinations of letters which correspond to particular sounds in various languages (for example ‘ll’=’y’ in spanish), th eproblem is that I have only been able to ﬁnd one article on the subject which seems very inconclusive.  Does anyone know of any thing else written on the&nbsp;subject?</p>
