      <p>I'm not sure how "elimination" and "addition" will help you. The "pairing" method you mentioned (comparison of different fonts) might be helpful.</p>
      <p>Remember that most people are not typography experts, and any emotions they get from fonts will just be a quick gut reaction based on the general look of the font. (Does the font look formal? Casual? Wild? Precise? Modern? Old fashioned? etc.)</p>
      <p>Are you a design student? Have you taken courses in typography or graphic design?</p>
