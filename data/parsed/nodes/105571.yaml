      <blockquote><p>...After that i will select fonts from different categories like serif, sans-serif, script, display and slab serif and start studying about there anatomy .</p></blockquote>
      <p>So, for you, "typography" equals "letterforms"?</p>
      <p>I'd be curious if you took the same general notion &amp; tried to investigate the emotional effects of spoken dialect within a group that spoke the same language. Isn't that the same question?</p>
      <p>Or, staying with type, how many novels are set in a sans-serif typeface in the States, esp. from a large New York publishing house? How about in Germany? So, if you asked a question about sans-serif fonts in the different countries, wouldn't you expect different answers? Or isn't "comfort" a significant element in any "emotion"?</p>
      <p>Etc.</p>
