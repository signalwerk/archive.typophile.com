      <p>If you <a href="http://bit.ly/17Bf3SC" rel="nofollow">Google emotions and typography</a> you’ll get several good hits on the first page. The journal Visible Language might be a good place for you to start as it is a bit easier to read that most peer-reviewed scientific journals in that is is also geared towards a design population. If your academic institution has certain database access you may want to read:</p>
      <p>Brumberger, E. (2004). The rhetoric of typography: Effects on reading time, reading comprehension and perception of ethos. <em>Technical Communication 51(1)</em>, 13–24.</p>
      <p>But this might not be for you, unless you are interested investigating things from a scientific or empirical perspective. </p>
      <p>Be mindful however, knowing how to conduct a proper literature review is critical to being able to conduct thorough research. You never know who or what might be providing you with misinformation…</p>
