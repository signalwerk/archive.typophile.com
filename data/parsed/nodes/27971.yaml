      <p>I would suggest more Myriad, less Frutiger.<br>
      In other words, because the interest in your typeface is in the letter shapes, and the curves are quite round, rather than grotesque, you should not add flaring to any terminals, but should instead concentrate on giving the entire face the appearance of a monoline.</p><div class="imageWrap"><img src="http://typophile.com/files/ee_6086.jpg"></div><p></p>
