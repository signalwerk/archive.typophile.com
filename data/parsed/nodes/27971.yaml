      <p>Ah, I really like the attitude in this font. Besides from the small corrections as other has already talked about, I also feel that you should maybe rethink regarding the letter "g". Maybe even do a "kill your darlings" here :)</p>
      <p>It steals the attention to much I believe and while all the other letters feel open and smooth round, the "g" is kind of like opposite. It’s good that it make the whole font personal, but maybe a little too much?</p>
      <p>So, my suggestion would be to make the "g" a little bit more smooth and also maybe just a little bigger upper bowl to make it sing-a-long with the other letters that have a more open feeling to them.<br>
      Great Work! I love the uppercase A with the not straight stem :)</p>
