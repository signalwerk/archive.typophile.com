    <p>(in English Below)</p>
    <p>Aquí por primera vez doy a luz una tipografía. Se llama kalidoscopio y es una familia corporativa para mi estudio de diseño. Algunos detalles todavía están por terminar de afinarse pero de todas formas me encantaría conocer sus sugerencias, críticas o lo que les plazca.</p>
    <p>Muchísimas gracias. Juan Pablo del Peral</p>
    <p>Here, for the first time my typography is viewing the sunlight. His name is kalidoscopio and is a corporative typography of the design studio that I have. Some details are being finishing but I want to listen your opinion.</p>
    <p>Thank you very much. Juan Pablo del Peral.</p>
    <p>(Sorry about my poor English)</p>
