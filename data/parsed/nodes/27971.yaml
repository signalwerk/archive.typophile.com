      <p>I like this font. With a bit tweaking here and there this will work very well.<br>
      Here are some of the things that caught my eye. Some might be caused by the screen, cut I'll give 'm to you anyway:</p>
      <p>- 'S' and 's' are hanging backworks. Like Hrant said they could be narrower, like your 'E'. Besides that you might wanna give it a bit of a rotation clockwise.<br>
      - Most important in a font IMHO are the proportions. It looks like you 'b' is wider as the 'd'. 'p' looks wider as the 'q'.<br>
      - Because you cut off the tail of the 'a' it look a bit smaller. By doing that you put the focus on the bowl. Perhaps you could try making the right lower side of the bowl less angled. If you open up the bowl a bit more you get more air in it and it might help balance the font again.<br>
      - I like it that you haven't descide whether to make a roman or an italic. Mix it baby. Some characters (A, V, W, y, x) have an italic feel to it that gives the font a swing.<br>
      - Perhaps you could move the accent in the 'i', it's hanging a bit to much left.<br>
      - Try correcting some weight problems. Some characters look like they are thicker than others. Look for the V, W, v,<br>
      - Who kicked that '8'? Personally I don't think you need the bent curve on the lower right bowl.<br>
      - Please change the mouth of the '5', I have the feeling this is a whale with an open mouth fishing for plancton. Perhaps you could bring it closer to the '3'.<br>
      - I don't know if the middle of the 'k' should be higher. Might be that takes the funk out and than you should leave it like it is.<br>
      - Although I like your accents, they might be to classical for this sans serif font. They would work very well on a serif font, but here they feel to sharp. Try getting the characteristix between the characters and the accents right.</p>
      <p>That's it for now. My time is up.<br>
      ®ené</p>
