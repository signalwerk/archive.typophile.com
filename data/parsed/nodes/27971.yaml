      <p>Juan, that looks really nice. I still like it like I did from the beginning. </p>
      <p>A few things caught my eye:<br>
      - perhaps you could make the italic 'e' round. The horizontal middle line is straight now. It might look better when this is round so it fits better to the italic character.<br>
      - to me, the 'z' and 'Z' don't really fit to the overall character of the font. Perhaps you just wanna make the diagonal straight?<br>
      - The italic 'a' is a difficult one. To the eye (at least my eye) it's to close to the 'o', therefor it makes the words harder to read. I get where you're coming from, but it might put to much strain on the eye.</p>
      <p>I see there are still little spacing problems that need to be resolved, but other than that I think it's just fine. It has a certain charme that you should preserve.</p>
      <p>Up to the next round.</p>
