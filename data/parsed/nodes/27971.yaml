      <p>Muchas gracias por el comentario. La propuesta de la tipografía, inicialmente se basaba en dar a los caracteres algunos rasgos asimétricos, de esta manera volver a las formas un poco más graciosas e impredecibles. A su vez darles como un patrón de crecimiento basado en el espiral. Esto quizá puede notarse en la asimetría de la curva de la c, que en la parte inferior se vuelve mucho más abierta.<br>
      Esta decisión tiene base en el movimiento del isotipo de kalidoscopio. De todas formas voy a hacer pruebas a ver que pasa.</p>
      <p>=|=|=|=|=|=|=|=|=|=|=|=|=|=|=|=|=|=|=|=|</p>
      <p>Thank you very much by the commentary. The proposal of the typography, initially was based on giving to the characters some asymmetric characteristics, to make the shapes a little more graceful and unpredictable. To give them like a pattern of growth based on the spiral as well. Perhaps this can notice in the asymmetry of the curve of the c, that in the inferior part becomes more open.<br>
      This decision has base in the movement of logo of kalidoscopio. Whatever, I’m going to test to see what it happens.<br>
      .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SC_5978.png"></div><p></p>
