    html: <p>Looking at the g again I notice that it feels a bit heavy. Maybe try making the join to the body at the base of the ear more narrow. If you wanted to keep the ear but make it less old style you could also make the ear shorter. The old ear or no ear could work too depending on what you want the text to feel like. Actually..... you could probably do well treating the ear differently at different optical sizes. The smaller the text the more it will benefit from the diagonal ear. At Headline sizes you could have a linear ear or a modified diagonal and at very large sizes you could loose the ear altogether as statement. Or not. Just thinking out loud.</p>
