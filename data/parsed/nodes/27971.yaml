      <p>Juan Pablo,<br>
      The form battles you are fighting with your Kalidoscopio remind me of the struggles I had with my Leporello a couple of years ago, particularly the m, n, u, and a. I hope you have more success than I did with it :-) Part of the problem is how the glyphs sit on the line. Tight now it seems a bit bouncy. Your s looks a bit brogen mostly in the lower curve. The most uncomfortable glyph is the "g". You need to really look at the outer curve as opposed to the inner curve and release that pinch between the bowls in some way.<br>
      Keep fighting with it.</p>
      <p>ChrisL</p>
