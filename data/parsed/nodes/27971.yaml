      <p>Juan Pablo, I agree with you that the old 'g' (26 december) looks better IMHO. It had more personality. You might wanna make it just a little bit narrower, because the inner forms seem a tiny bit to big in comparence to the other characters. But that could be the screen resolution playing with my eyes.<br>
