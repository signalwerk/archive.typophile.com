    <p>The context of this question is one of my experiments<br>
    to create a good legible font (NOT such a comic font) that is very readable on little formats.<br>
    To simulate a sense of  handwriting, it has to be a flipper font.<br>
    I want to look if it is possible to combine, and how far it is possible to go with.</p>
    <p>I thought I was smart enough to figure out how it had to be done in FontLab<br>
    but thanks to my limited knowledge of the English language, I'm not.<br>
    Also I have only a limited knowledge of FontLab, my previous fonts were without programming Python.<br>
    (I actually know FontLab only one year now, and on school the specialization Typography is in its childhood,<br>
    not a lot of people know FontLab in detail)</p>
    <p>I'm very interested in this part of fonts, but it would be stupid having to learn Python for one exercise,<br>
    I can better learn it later when I have more time.<br>
    So my question is; can someone provide a step by step way how to create flipper fonts in FontLab?<br>
    Starting with how to create multiple versions of one glyph (and the correct name it has to be given),<br>
    over how to write and insert the Python code,<br>
    and if needed, how to export it the correct way.</p>
    <p>I have found the code, but don't know how to implement it.<br>
    feature salt {<br>
    lookup rotate {<br>
    sub @set_1 @set_1' by @set_2;<br>
    sub @set_2 @set_1' by @set_3;<br>
    sub @set_3 @set_1' by @set_4;<br>
    sub @set_4 @set_1' by @set_5;<br>
    sub @set_5 @set_1' by @set_1;<br>
    } rotate;<br>
    lookup rotate;<br>
    } salt;</p>
    <p>I have done a search around, but couldn't find something easy;<br>
    <a href="http://www.typophile.com/node/19625" title="http://www.typophile.com/node/19625">http://www.typophile.com/node/19625</a><br>
    <a href="http://typophile.com/node/43634" title="http://typophile.com/node/43634">http://typophile.com/node/43634</a><br>
    <a href="http://typophile.com/node/13315" title="http://typophile.com/node/13315">http://typophile.com/node/13315</a><br>
    Even Google didn't give an easy answer.</p>
    <p>I'm sorry my first post has to be such an stupid easy thing, but so it be.<br>
    I think Typophile is the best place to ask this,<br>
    here I have found already a lot of information about font designing problems in the past.<br>
    I'm glad if someone could tell me.<br>
    Maarten.</p>
