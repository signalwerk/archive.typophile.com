      <p>Maarten,</p>
      <p>I don't claim any particular expertise on the subject, but sometimes the best way to get the ball rolling is to say something that someone else will feel obliged to correct. So...</p>
      <p>To make the code you show work, you have to create sets_1 through 5, then define them in the bottom right-hand frame of the OpenType panel in FontLab—for example,</p>
      <p>@set_1=[ a b c d e …];<br>
      @set_2=[ a.2 b.2. c.2 d.2 e.2 … ];<br>
      and so on…</p>
      <p>Or so I believe; correctives will follow as needed…</p>
