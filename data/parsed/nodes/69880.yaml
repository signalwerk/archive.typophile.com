  html: |-
    <p>So far, "Coming Together", the Font Aid IV font, has raised approximately $12,000. All of the money raised is being donated to Doctors Without Borders to help with their relief efforts in Haiti. Thanks everyone for your support!</p>
    <p>More information on the project can be found here:<br>
    <a href="http://www.typesociety.org/fontaid.html" title="http://www.typesociety.org/fontaid.html">http://www.typesociety.org/fontaid.html</a></p>
    <p>Book sales have been slow, but continue to climb. The book can be purchased online through Lulu: <a href="http://www.lulu.com/product/paperback/coming-together-font-aid-iv/6553234" title="http://www.lulu.com/product/paperback/coming-together-font-aid-iv/6553234">http://www.lulu.com/product/paperback/coming-together-font-aid-iv/6553234</a></p>
    <p>Please continue to help us spread the word about this project! We really appreciate the enthusiasm and support we've gotten from the entire type community.</p>
    <p>Michelle &amp; the SOTA board</p>
