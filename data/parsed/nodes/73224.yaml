      <p>I contacted Henri Friedlaeder before his demise.</p>
      <p>Itamar David (is he alive), Henri Friedlaeder zal, and Ẓvi Narkiss zal, were supreme Hebrew type designers, each from Europe.</p>
      <p>Frederik Goudy claims the famous and extremely popular Romm family printing press Vilna and Rashi typefaces were cut by Bodoni's students in Italy, based upon ancient drawings from earlier periods of the disapora.</p>
      <p>These designs predate the popular misconception of dating them from the invention of the printing press. Also, the so called invention of block print was actually much earlier.</p>
      <p>Yet, there are those who prefer to believe all Wiki incorrect scholarship they read on the Internet.</p>
      <p>For serious typography resource, dig into the collections at RIT's library (RIT is funded by the CIA for subterranean image tracking - nuclear weapons under ground) and those in Paris. Scott, where?</p>
      <p>I lived in Rochester, NY, very near RIT (NY's MIT - what MIT is in mathematics, RIT is in imaging, type, print, and paper.</p>
      <p>I saw actual historical documents, samples, and amazing maps, showing how nuclear weapons under ground for example could by determined from two images taken about ground in a jet at two opposite 45 degree angles, using custom plug-ins to Adobe Photoshop. The software could "remove" the surface dirt and identify the exact spot of the nuclear weapons under ground  by tracking its infrared 'heat'.</p>
      <p>Similarly, this technology is used for 'reading' the Dead Sea Scrolls, and archaeology.</p>
      <p>I also gathered there information that my family ancestors supplied the Romm family printing press with a 50 year very multi-million ruble paper contract from the department head, who was the world expert on paper.</p>
      <p>Bill, forget Wiki, and fly to Rochester for a week.</p>
