    html: "<p> Manual line-breaking is indeed a form of art. <br>But note this: it reaches true nirvana only <br>when one adapts the actual content to <br>create a pleasant block of text. <br> <br>Furthermore: a good paragraph is neither a <br>roller-coaster ride with huge gaps and juts, <br>nor is it a military tribunal with completely <br>straight sides; it is a pragmatic, human thing <br>that is neither frantic nor frigid. The Ancient <br>Greeks knew this; in comparison, the Romans <br>were juvenile. <br> <br>My maxim for the ASCII age is this: Write for the rag. <br> <br>But the reason I refuse to do it on Typophile is simple: the typing window uses the predictable, monospaced Courier, but the end-result uses a proportional font - this makes the creation of nice text blocks much too laborious. <br> <br>hhp </p>"
    html_clean: "<p> Manual line-breaking is indeed a form of art. <br>But note this: it reaches true nirvana only <br>when one adapts the actual content to <br>create a pleasant block of text. <br> <br>Furthermore: a good paragraph is neither a <br>roller-coaster ride with huge gaps and juts, <br>nor is it a military tribunal with completely <br>straight sides; it is a pragmatic, human thing <br>that is neither frantic nor frigid. The Ancient <br>Greeks knew this; in comparison, the Romans <br>were juvenile. <br> <br>My maxim for the ASCII age is this: Write for the rag. <br> <br>But the reason I refuse to do it on Typophile is simple: the typing window uses the predictable, monospaced Courier, but the end-result uses a proportional font - this makes the creation of nice text blocks much too laborious. <br> <br>hhp </p>"
