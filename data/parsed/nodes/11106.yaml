    html: <p> In both IE 5.1 and Netscape 4.7x on my Mac the discussion pages are almost always far, far too wide. I have to scroll right to read long lines of text that don't have any line breaks in them, and the limit on just how wide these pages can get seems to be infinite. In this PARTICULAR thread the page works fine - as if the frame it is in has a set pixel limit, but many other threads here don't seem to have any page/column width limit. Surely this can be fixed pretty simply by tweaking the templates. </p>
