    html: <p> By the way, I think I owe Jared an apology. <br> <br>On re-reading my previous post, it could be construed that I was complaining about a lack of assistance with my account and password. In truth, I sent only one e-mail regarding the problem, several months ago, and it was a secondary mention within a message about another topic. I didn't bother following up because I was getting along just fine on the boards entering my name and e-mail address manually with each post. <br> <br>It was only with the creation of this thread that I thought to ask about it again. As you can see, Jared fixed the problem for me immediately, for which I am grateful. <br> <br>My previous post was somewhat careless, and while Jared made no indication of taking offense, I wanted to clear the air anyway. <br> <br>Jared and Joe run a great organization, and I for one really appreciate their efforts. <br> <br>David (who once was lost, but now is found) Thometz <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
