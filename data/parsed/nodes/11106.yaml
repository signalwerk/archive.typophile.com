    html: <p> It does use cookies! Once you've logged in, you should never have to again. To activate it, click "Login/Register", enter your username/password and click "Log In" to open your account settings. Scroll down to "Preferences" and check the box marked "Remember my username and password in a cookie." <br> <br>I agree, the frames are a hassle, but we haven't had much luck trying to strip them out. A new version of the BB software is coming out, and we're hoping that is one of the new features. </p>
