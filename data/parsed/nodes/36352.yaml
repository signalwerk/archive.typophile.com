  html: |-
    <p>I asked this question to <a href="/web/20080705154015/http://www.typophile.com/wiki/James%252BGrieshaber" class="wiki">James Grieshaber</a>, <a href="/web/20080705154015/http://www.typophile.com/wiki/Kent%252BLew" class="wiki-create">Kent Lew</a>, and <a href="/web/20080705154015/http://www.typophile.com/wiki/Stephen%252BColes" class="wiki">Stephen Coles</a> with various results, but if there were ONE typeface on the face of the earth that you’d rather never see again, what would it be, and why?</p>
    <p>(If you list P*pyr*s, C*mic S*ns, or any other typeface that could be found on 2002 Free Fonts, you’re not trying hard enough.)</p>
    <p>So here’s mine:</p>
    <p><strong>ITC <a href="/web/20080705154015/http://www.typophile.com/wiki/Souvenir" class="wiki">Souvenir</a></strong> (Particularly the bastard mono.)</p>
    <p>This typeface is so ugly, yet it’s everywhere. The roundness doesn’t come across as round, it comes across as soft. And in that not-good soft way. Although designed by Morris Fuller Benton in the 10s, it’s too 70s, in the bad feathered hair and brown tinted eyeglasses way. I would rather live in a world where Souvenir does not exist.</p>
    <p>Your turn.</p>
