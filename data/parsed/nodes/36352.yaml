    html: |-
      <p>Once upon a time, about 8 years ago I had the pleasure of hearing a lecture given by Gerard Unger on the mid-century (last) typefaces from France. Before this lecture I hated Mistral (and many fonts from the late, great Excoffon). This hate was tied to a having to do DTP (as it was then called) with so few fonts available to me in the late 80s and early 90s. Silly and childish.  Gerard’s rich and detailed stories of driving through the French country side and visiting towns with traces of the old signage and even stories from his own youth mesmerized me. </p>
      <p>As it happened I was going to France for the first time only a short while later. I never thought I’d visit France, Paris seemed but a dream. I was in a frenzy of anticipation. He had opened my eyes to why the designs were originally created and I wanted to see them for myself. </p>
      <p>Now one of my favorite time periods in the history of the poster is Mid-century France. (Well, in fact, I have a huge bias now toward anything French.)</p>
      <p>The lesson to be learned: Before you go hating a typeface learn the history and the context. </p>
      <p>There are no bad typefaces, only poorly used typefaces.</p>
