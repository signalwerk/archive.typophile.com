    date_raw: 28.Aug.2007 11.48am
    votes: null
    html: |-
      <p>&gt;&gt;For a 500-600 pixel wide image like I use at my site,<br>
      &gt;&gt;can the difference you are talking about be seen?<br>
      &gt;&gt;If so, could I lay things out in PS, then open<br>
      &gt;&gt;the .psd in Illustrator and save as a .jpg there?</p>
      <p>JohnH is talking about text that is going to be sent to a RIP for offset printing, i.e., vector graphics. Keeping the text vector based, which it is natively, allows the Raster Image Processor to print it at the maximum native resolution of the image setter, which is super high in most cases. Thus, the file stays small and manageable until the end and becomes gigantic only at the very end of the line, at maximum resolution, when it needs to be.</p>
      <p>For screen rendering, however, you can just use Photoshop since the final output is intended to be a raster, or pixel, image. Photoshop CAN handle pixels very well, since that’s what it is intended for. </p>
      <p>But that’s the subject for another thread.</p>
    html_clean: |-
