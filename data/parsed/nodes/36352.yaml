      <p>I’m intensely relieved to see Mark and others cite Black Chancery. More than once, I’ve had to explain through clenched teeth why it bothers me so much, and been met with uncomprehending shrugs.</p>
      <p>I don’t recall specifics right now — but aren’t the horizontal/vertical stroke widths all wrong? To make a pen achieve those letterforms, the nib would have to be pivoting and expanding and contracting capriciously all the time. The type seems to have been designed by someone who wanted to make something look calligraphic, without even the faint grasp of calligraphic mechanics that I’ve attained (and believe me, that’s faint). Likewise, people use it instead of a better-designed script. Ugh.</p>
      <p>No fondness for Rotis, tired of Times Roman and the faces proscribed at the outset, but Black Chancery actually makes me feel queasy to look at it.</p>
      <p>As an aside, one of my least favorite faces in general is Antique Olive — which a publisher chose to set the titling for a recent book of mine. That would just be bad kluck, but one of the points of the book involves the relevance of page design to communication and meaning. . . .</p>
