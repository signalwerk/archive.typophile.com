      <p><em>Linda Cunningham: Benguiat</em></p><em>
      <p>DanGayle: Yeah, the Mono Souvenir-like thing is horrendously bad, but I hate even the regular face. It’s just so weak and flaccid.</p>
      </em><p><em>Don McCahill: Hey, I liked Souvenir when it came out in the 70s. It dated kind of quickly, though.</em></p>
      <p>Okay, let’s really bash Souvenir. First off, it was around since the beginning of the last century. When Fisher Price came to be, they commissioned Morton Sol (or was that Solomon) for a look. He took the old drawings he had (from 1913 and 1928) are redrew them calling them Solomon’s (or Sol’s) Souvenir. And that becameFisher-Price’s logo. (And yes, he was paid well for his efforts.)</p>
      <p>Next, it was redrawn by Ed Benguiat and licensed for sale by ITC. Linda, you might hate Benguiat because of Souvenir. One night in the backroom of Photolettering, Ed Benguiat with Herb Lubalin had a conversation about Souvenir. The drawings were pulled out, and given to Vladimir Remington along with suggestions (I guess we call this art direction) on how to redraw the face into a new face, which when finished Ed Benguiat named it after himself.</p>
      <p>Both Souvenir and Benguiat had a major role in Science Fiction paperback books. 1970s for Souvenir, and 1980s for Benguiat. Our trouble with it - they were so overused, that most of us in the industry wanted to puke.</p>
      <p>********</p>
      <p><strong>James R. Harris</strong> is no longer with us, but if he were, he’d be telling you right now the worse face EVER - was ITC Eras. He would ask you outright - “What is this? It’s not roman, it’s not italic. It just leans there — quick someone offer it a crutch to help it stand up already.”</p>
      <p>**********</p>
      <p>The font I could have lived with without ever seeing or using — that’s very hard to say. Yes, there are many I dislike, and so many more that are poorly used. People selecting typefaces that just don’t marry the artwork anymore. As a former typographer, I was taught not to single out typefaces — that somewhere there is a perfect place to use - yes, even that one.</p>
      <p>What I can’t stand though is poor typesetting. I cringe when I see Fette Fraktur used as all caps - or for that matter, and script used in all caps - and worse - letterspaced out...</p>
      <p>Thank you for my sanity moment.</p>
