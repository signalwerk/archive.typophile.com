      <p>I ignored this thread because I wasn’t bored enough. If I had to reply, my answer would be the same as Mark Simonsons! That “font” is so execrable It makes me angry. It’s obviously free; who would buy such a thing? </p>
      <p>Recently I saw a headline in Souvenir caps and had to remark sadly that it was well-drawn. Compared to a lot of the homemade stuff on myfonts, etc. now, Souvenir is actually well-crafted. Isn’t that sad?</p>
      <p>JLT: Thanks so much, PAL, for harping on my marginal involvement with Curlz. Let’s get the record straight: When I was still working in print production, just out of school, Steve Matteson would give me small custom type jobs for Monotype. One of them was finishing the character set of Curlz. I probably actually drew 11 of the alphabetic characters and filled out the punctuation. In other words, Steve Matteson is the designer of Curlz. I was a production monkey who finished it, much like my role with Woodtype 3. Not the originator, the slavey. </p>
      <p>One way for type designers to get experience is to finish the work others start. Matching someone else’s style is good exercise. In fact, that’s how new designs come about like Leslie Cabarga’s new Casey, and Mark’s new Kinescope. They start with example art and fill out the missing pieces. Great skill to have. In the case of Curlz, I never thought it would haunt me all my damn days. What did I do, God? Why am I being punished?... </p>
      <p>I’ll get you Josh, when you least expect it.  &gt;:(</p>
