      <p>Oh yes, going back to someone’s comment about setting type in Photoshop...</p>
      <p>I always, ALWAYS advise people not to do this, and it amazes me how many people don’t get it!  I tell them that because Photoshop is pixel-based, the fonts are going to look crappy even if you set them at 1200 dpi resolution in bitmap (not grayscale) mode.</p>
