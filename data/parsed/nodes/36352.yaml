      <p>Bad type ain’t the problem. People who use type badly is the problem.</p>
      <p>It’s like fashion. I don’t blame bell bottoms for the sixties. And I don’t blame Souvenir for the seventies. But somebody wearing bell bottoms in 2007, or using Souvenir in 2007, had better be going to a retro party!</p>
      <p>Admittedly some fonts have a quality that makes them appropriate over a large spectrum of projects. And some fonts are so well crafted that a person has got to be inept to set them badly. But most fonts suffer because of lazy or indifferent type specification.</p>
