      <p>OK, I hadn't read that.<br>
      But MOMA's recognition of him doesn't alter my contention that MoMA cannot "acquire" his repurposing.<br>
      Unless one agrees with its claim that it's theirs because they said so.</p>
      <p>MOMA is recognizing his concept, and cannot own or acquire it.<br>
      It's Tomlinson's, and he hasn't sold it to MOMA.</p>
      <p>However, I'm not going to engage in this futile discussion any more, because that's the game that the curator is playing, which validates her position, which is meaningless and banal IMHO.</p>
