    html: |-
      <p><em>We have acquired the design act in itself...</em></p>
      <p>AFAIK, a fellow called named Tomlinson was responsible for the conceptualization ("design act") of the @ symbol (applying the old @ symbol to email addresses), so I don't see how MoMA can acquire it from him, except by unilateral declaration of annexation.</p>
      <p>It is the act of curation, not initial creation, that the MoMA curator is appropriating as her own, a power-play for herself and her profession,  claiming centre stage for the latest reiteration of the tired old discourse, "But is it art?"</p>
