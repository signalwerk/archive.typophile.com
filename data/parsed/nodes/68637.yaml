    html: |-
      <p>This is mostly for the sake of conversation, but… I wonder what the implications are of the following statement from the announcement:</p>
      <p><cite>We have acquired the design act in itself and as we will feature it in different typefaces, we will note each time the specific typeface as if we were indicating the materials that a physical object is made of.</cite></p>
      <p>For instance, I've seen some EULAs that explicitly forbid using the font to create work whose primary function is reliant on that specific typeface (e.g. alphabet stamps, monograms, sometimes even logotypes are forbidden). I did a bit of pondering on the topic in relation to the series of <a href="http://blog.myfonts.com/83">glyph t-shirts</a> I designed for MyFonts a while ago.</p>
      <p>I rather doubt that many type producers would complain if the MoMA were to highlight their typeface with full credits, but I'm curious about what people think of the comparison between typefaces and other more traditional materials, like oil paint or charcoal.</p>
    html_clean: |-
