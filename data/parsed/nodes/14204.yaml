    html: <p>Futura, I find, looks very uncomfortable with too much old style usage. Also, Bitstream's Futura, depending on how you are using it, can be finagled. If you use the right weights and alter the percentage to which you set the smallcaps. But, large but, one can only get away with this if used sparingly.</p>
