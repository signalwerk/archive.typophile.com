    html: <p>welcome back forrest! and not that it's a look alike, but have you seen Mark Simonson's Proxima Nova? It was love at first sight for me and i've been raving about it since.</p>
  - id: 82330
    user_id: 5605
    user_name: Forrest L Norvell
    user_path: null
    user_image: /files/pictures/picture-5605.gif
    date_raw: 6 Aug 2005 — 4:56pm
    date: 2005-08-06T16:56:00
    votes: null
    html: <p>I checked out Proxima Nova, and while I like it, and it's certainly geometric in some ways, it feels more like a humanist sans to me. It's less rigid than Futura, and while I'm slowly getting tired of Futura's rigidity, I think its "precision" or "tightness" are probably the sources of its appeal to most people. It's definitely a more complete family than most of the easily available versions of Futura, though.</p>
