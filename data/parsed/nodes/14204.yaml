  html: <p>Some time ago we bought the Bitstream Type Odyssey which contains a very nice <strong><a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> </strong>version. Unfortunatly it doesn’t come with SC&amp;Osf. And <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a> doesn’t provide them either. So I stumbled upon the <strong><a href="/wiki/Neufville" class="freelinking" rel="nofollow">Neufville</a></strong> versions. But I wonna know if those versions play (formally) well together before I take out my Magic Plastic Card. Does anybody has any experience combining the two?</p>
