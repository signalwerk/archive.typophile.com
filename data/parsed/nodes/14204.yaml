      <p>I didn't post about the Berthold version because, well, sometimes it's hard to find good information about Berthold types, for reasons that are documented elsewhere. At some point I may do a followup to that article where I can talk about that, as well as talk about some of the Futura-alikes out there, as well as give my own (sure to be popular) opinion on that eternal question: Futura or Neutraface?</p>
      <p>And yeah, I've been missing, first because of vacation, then because of computer "issues" (had to replace my laptop's hard drive twice, had a bad backup that had to be worked around and which sort of required me to upgrade to Tiger, had to replace the motherboard and display, etc), then had to play catchup at work for a while, but now I'm back. I'm sure you're all relieved.</p>
