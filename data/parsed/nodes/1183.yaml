    html: <p>Johan, <br>looks nice, due to some details I recognize on the first view... The Uppercase C looks unbalanced compared to the rest of the alphabet. Try to increase the scale of the vertical axis a bit, and maybe also decrease the horizontal width a little bit. It's hard to tell... it could also be the antialiasing of the gif?  <br>The uppercase "S" are a bit low compared to the T. Increase the height a few steps. <br>The "A" feels a bit too condensed. <br>The "G" are nice! <br> <br>The lowercases looks charmy, but you could try a few alternatives on "a" "j" and maybe "f"? I think those letters are the main language of your font, but I think you can do better... Compare the x-height on your "f" with your ligatures...  <br> <br>Nice work. <br> <br>A</p>
