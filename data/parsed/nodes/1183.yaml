    html: "<p>Oh, I like them. Although they are a little bit different from the regulars (because you gave them a sort of serifs), they work great.  <br> <br>Some things you might want to look for: <br>- change the lc 'q' a little in relation to the lc 'p'. Try to give it a little more character. <br>- the lc 'a' seems to be to round in the upper left corner of the bowl. Optically it needs there the little 'serif' like on the lc 'm' and 'n'. If you take that away you might want to change the bowl a little to compensate. <br>- the angle of the lc 'o' is off balance with the rest of the type. Perhaps it is the jpg rasterization, but it seems to roll to much to the right.  <br> <br>My favorite: the lc 'z'. Sweet. <br> <br>With the regulars it seems the lc 'a' is a little bit to round compared to, for instance, the lc 'e'. Can that be? It seems to be more a 'wide' than a 'regular'. <br>Did you optically correct the crossing of the 'x'? It feels a little out of balance. <br> <br>I really like this type, personally. Congratulations on the name. Very nice. <br> <br>Some of my remarks may be the result of the jpg rasterization on screen. In your document it might be OK.  <br> <br>Regards, <br>Ren</p>"
