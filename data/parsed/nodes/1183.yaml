    html: "<p>Hi Johan, <br> <br>You really are still working on it. Nice update. I have some small suggestions for you: <br> <br>- spacing is too tight. I think you can give it some 20 em on both sides extra. Maybe more. <br>- I agree with Kevin on the lc a. Make it just a bit shorter. <br>- Have a look for the center of the UC's, they are not constant. Have a look at the middle bar of the A and the E. Try to find a hight that works for all the characters and be consequent. Take either the H or the R. <br>- Personally I think the bowl of the lc a is a bit big compared to the lc e. But note that that's personal. <br>- Perhaps you should make the leg of the lc l a bit longer? <br>- Have a serious look at the lc r. This is a tip Randy Jones gave me on my r: <br><a href=\"http://www.typophile.com/cgibin/show.pl?29/32542\" target=\"_blank\">http://www.typophile.com/cgibin/show.pl?29/32542</a> <br>- You need to work a bit on your numbers, they are a bit out of balance. Some seem to wide (2, 3) others to high (8). <br> <br>Other than that, I still like it.  <br> <br>Later, <br></p>"
    html_clean: "<p>Hi Johan, <br> <br>You really are still working on it. Nice update. I have some small suggestions for you: <br> <br>- spacing is too tight. I think you can give it some 20 em on both sides extra. Maybe more. <br>- I agree with Kevin on the lc a. Make it just a bit shorter. <br>- Have a look for the center of the UC's, they are not constant. Have a look at the middle bar of the A and the E. Try to find a hight that works for all the characters and be consequent. Take either the H or the R. <br>- Personally I think the bowl of the lc a is a bit big compared to the lc e. But note that that's personal. <br>- Perhaps you should make the leg of the lc l a bit longer? <br>- Have a serious look at the lc r. This is a tip Randy Jones gave me on my r: <br><a href=\"http://www.typophile.com/cgibin/show.pl?29/32542\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/cgibin/show.pl?29/32542</a> <br>- You need to work a bit on your numbers, they are a bit out of balance. Some seem to wide (2, 3) others to high (8). <br> <br>Other than that, I still like it.  <br> <br>Later, <br></p>"
