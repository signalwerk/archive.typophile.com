    html: <p>Hi Johan, <br> <br>I like it a lot. It's a friendly open type that, for me, is a good mix of the Helvetica, Din and Interstate.  <br>Perhaps the UC 'W' could be a little more open. For my feelings it needs a little bit more white space inside. It works in the italic lc weight though. <br>I agree with Andreas on the UC 'C'. But keep the first lc 'a', it's right for the type. The alternate 'a' has been done enough allready. <br> <br>I like the italics. Nice work on the little serif of the lc 'r'. Moving it diagonally is perfect. <br> <br>The type all together feels very Scandinavian. Perhaps find a name that comes from up there. <br>Waiting to see more. <br> <br>Regards, <br>Ren</p>
