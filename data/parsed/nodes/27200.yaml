  html: "<p>This week there are two programmes featuring typography to be broadcast in the UK. <br> <br>Thursday 10 February, 9pm, Channel 4: 'Blood On Our Hands: The English Civil War'. Printing features in this episode and Nigel Roche, Librarian of St Bride Library, demonstrates typesetting at the time in an atmospheric location (Kentwell's Bakehouse) - complete with smoke and fog for added drama. <br> <br>Friday 11 February, 11am, BBC Radio 4: 'From Arial to Wide Latin'. From the BBC web site: 'Ian Peacock explores how the fonts we chose are sending secret subliminal messages about who we are. He argues that the fonts we dress our words in are as much of a fashion statement as the clothes we wear.' <br> <br>If you're not in the UK you can still catch the Radio 4 broadcast using the BBC's listen again service: details on <a href=\"http://www.bbc.co.uk/radio4/\" target=\"_blank\">http://www.bbc.co.uk/radio4/</a> <br> <br>. . . . . . . . <br> <br>Information from <a href=\"http://www.stbride.org/index.htm\" target=\"_blank\">St Bride Printing Library</a></p>"
