      <p>I agree with most of James' comments.  The W shouldn't be a mirror image of the M -- start from the V to build the W. And M and W are too dark.  What if the center point of the M didn't descend all the way to the baseline?  Take the diagonals from the Y and put them in the M. </p>
      <p>Also, the 4 is too narrow. </p>
      <p>Now I want to see some lowercase.  :)</p>
      <p>-matt</p>
