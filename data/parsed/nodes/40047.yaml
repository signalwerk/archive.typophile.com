    html: |-
      <p>Hi Tom,</p>
      <p><em>Legible from a distance?</em><br>
      yep</p>
      <p><em>Even colour?</em><br>
      N, Y and W too heavy, A slightly heavy, M functional but lacks stylistic integration</p>
      <p><em>Any strokes look too fat or thin compared to the rest?</em><br>
      N verticals and joints, joints at baseline of W</p>
      <p><em>Do any curves look strange?</em><br>
      nothing overtly strange, but "wierd is good" in the sense that a lot more can be done with the curves you've got. There's a tameness and repetition that leaves a feeling you are holding back something more interesting. For example, the asymmetric theme used on E, F, L could be applied to the curves of C, G, O, Q, P, R, S---a faint wiff of Revue.</p>
      <p><em>Any letterforms ’out of place’?</em><br>
      N structure/style and heaviness, same for W</p>
      <p><em>What characters don’t sit next to each other well?</em><br>
      need to see more combinations, set words. N and W fail to integrate with most others.</p>
      <p>j a m e s</p>
