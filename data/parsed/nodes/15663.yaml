    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Linotype&nbsp;Univers</strong></p>
    <p>During the 1990s, <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a> worked together with <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> to expand and update his classic <a href="/node/13516" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Univers</a> family. The result, <a href="/node/15663" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Univers</a>, includes 63 different weights, each drawn carefully to ensure compatibility with all the&nbsp;others.</p>
    <p><a href="http://www.linotype.com/1560/univers-family.html">The original Univers type family</a> can be found online <a href="http://www.linotype.com/1560/univers-family.html">here</a>. Linotype Univers can be found on this <a href="http://www.linotype.com/6-1813-6/linotypeunivers.html">overview page</a>.</p>
