    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Linotype Univers</strong></p>
    <p>During the 1990s, <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> worked together with <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> to expand and update his classic <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a> family. The result, <a href="/wiki/Linotype%20Univers" class="freelinking" rel="nofollow">Linotype Univers</a>, includes 63 different weights, each drawn carefully to ensure compatibility with all the others.</p>
    <p><a href="http://www.linotype.com/1560/univers-family.html" rel="nofollow">The original Univers type family</a> can be found online <a href="http://www.linotype.com/1560/univers-family.html" rel="nofollow">here</a>. Linotype Univers can be found on this <a href="http://www.linotype.com/6-1813-6/linotypeunivers.html" rel="nofollow">overview page</a>.</p>
