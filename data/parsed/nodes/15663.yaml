    <p>During the 1990s, <a href="/node/12118/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Adrian Frutiger</a> worked together with <a href="/node/13697/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype</a> to expand and update his classic <a href="/node/13516/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Univers</a> family. The result, <a href="/node/15663/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Linotype Univers</a>, includes 63 different weights, each drawn carefully to ensure compatibility with all the&nbsp;others.</p>
