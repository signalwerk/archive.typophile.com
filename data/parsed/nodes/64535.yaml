      <p>Personally, I feel a blog like that is in poor taste.</p>
      <p>I have a sense of humor. And I, too, find many of these proposals to be ridiculous.</p>
      <p>But as a professional I feel that we should be ambassadors for our craft and recognize that many of these proposals are not as ridiculous as they seem. Unfortunately, many designers take these as an affront or an insult (or are simply looking for easy targets).</p>
      <p>The bottom line is that being an entrepreneur is rarely easy and it requires a lot of hustle. Most of these proposals are born out of the fact that many entrepreneurs have no budget for design. I applaud the hustle. If they can get the job done with a limited design budget... good for them.</p>
      <p>And the other side of this is that these people create opportunities for designers who are just starting out and want real-time experience. Very few skilled trades offer as many beginner opportunities as design.</p>
