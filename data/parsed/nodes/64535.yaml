      <p>I hear you. It’s good to get it out. I can 100% relate to this experience. The disconnect with our clients is an inevitable part of the business. Plumbers, we are not.</p>
      <p>The bottom line is that 9 out of 10 potential clients will not fully appreciate/understand quality design work.</p>
      <p>Design work is like dating. You gotta be picky or it’s not gonna work out.</p>
