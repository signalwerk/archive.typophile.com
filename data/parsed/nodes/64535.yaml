    html: |-
      <p>yes..  of course you are right!<br>
      but it is friday<br>
      and we all need a good smile or a laugh.</p>
      <p>personally I am through with the hustle..<br>
      I can compromize with a client, but when they start waving their money and expect me to lick.. then I just simply throw my gun and walk away. it ain’t worth it.</p>
      <p>I once had a client who wanted a site and they said: “You are the designer. Do whatever you want!” This was in 2001 before the advanced coding that came later, so it was not a large site.<br>
      I worked for 2-3 months with the site. The client was not satisfied so she kept wanting changes after changes...  which I did. That’s why it took so long time. It was minor changes..  but when the project had been going on for a while...  I said: “We must complete it now”.</p>
      <p>The client said we have to start over again and said she wanted to come to the bureau and we would do it together. She had an idea of what she wanted.<br>
      I said fine and we decided a day, a saturday because I knew it would take a whole day and I did not want other clients calling. I just wanted it over and done with.</p>
      <p>The client came and I did exactly what she wanted. I let her tell me how she wanted it, colours, text et al. She changed almost all of the text again.<br>
      So when she left the office she was all happy and thrilled. To me the site did not look good, but it was okay enough. The client was satisfied. And the last thing I said before the client left was: “So now the project is completed. Right?”. “Oh, Yes”, was the reply, “You can send me the bill now!” </p>
      <p>The next day I get a call from the client, begging me to take the site off the web. “It is a disaster...  and ugly!”<br>
      —”But you were here and you decided and I did exactly what you wanted!?” was my reply.</p>
      <p>The client said: “You cannot send any bill till we are finished. I am going on a trip next week and will call you when I get back.”</p>
      <p>I was somewhat irritated...  but what could I do?</p>
      <p>The client did not call back until a half year later (I amn’t kidding!!) and I had almost forgotten all about it and it was not even in my mind anymore.</p>
      <p>The client said: “I can come on saturday like last time. It was so fun, we had a great time and it went so good.”</p>
      <p>I said: “No thanks! I am not interested and I told them to find another designer.”</p>
      <p>(although I wanted to say something else. Untypable and untypophile words)</p>
      <p>so yes they create opportunities for designers...<br>
      but then they should treat the designers as designers</p>
      <p>but what the H...  sometimes you win, sometimes you lose. That’s life..<br>
      but I will never accept hustling anymore. period.<br>
      You can rattle all your jewellery + $$</p>
      <p>NO HU$TLE!!<br>
      No Money — No Honey</p>
