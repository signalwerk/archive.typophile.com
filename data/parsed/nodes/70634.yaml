    html: <p>Although it looks a lot like Serif Gothic, I think it was probably custom, at least for the "HALLOWEEN" part. The weight is somewhere between Serif Gothic Heavy and Serif Gothic Black, and the serifs are larger.</p>
    html_clean: <p>Although it looks a lot like Serif Gothic, I think it was probably custom, at least for the "HALLOWEEN" part. The weight is somewhere between Serif Gothic Heavy and Serif Gothic Black, and the serifs are larger.</p>
