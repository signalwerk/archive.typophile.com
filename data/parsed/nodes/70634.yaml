    html: |-
      <p>The W might have been made from flipping the M and spreading the arms. The rounded E can be made using the C. The N is another matter. I also notice that the font <a href="http://new.myfonts.com/fonts/urw/liberty/" rel="nofollow">Liberty</a> has some of these features already, but would need bolding with added stroke. In many ways Liberty's letters are  closer shapes than Serif Gothic for the HALLOWEEN lettering, but JOHN CARPENTER does look like Serif Gothic, with that R.Another possible alternative: <a href="http://new.myfonts.com/fonts/castletype/xavier/" rel="nofollow">Xavier Serif Black</a>, with some serif tweaking (at least for the letters except E).</p>
      <p>- Mike Yanega</p>
