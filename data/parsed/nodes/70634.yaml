    <p>Hello</p>
    <p>I realize this is Serif Gothic, but the specific letters seen in the word "HALLOWEEN" point to an older alternate set, as all those characters are unique.</p>
    <p>Does anyone know if there is a digital version available anyplace that features these characters?<br>
    thanks in advance<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/halloween_3903.gif"></div><p></p>
