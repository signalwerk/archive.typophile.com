    date_raw: 21 May 2010 — 10:30am
    votes: null
    html: <p>Serif Gothic does have a set of alternates that haven’t been digitized yet, at least not commercially.</p>
    html_clean: <p>Serif Gothic does have a set of alternates that haven’t been digitized yet, at least not commercially.</p>
  - id: 412295
    user: 1043
    date: 2010-05-21T10:44:00
    date_raw: 21 May 2010 — 10:44am
    votes: null
    html: <p>Yes, although it didn't have a "W" like that. I suspect what they did was start with Serif Gothic Heavy, clipped off the center stroke on the alternate "W", made it bolder (using an optical effect, analogous to adding a stroke to a digital font), and touched up the serifs to make them more pronounced.</p>
    html_clean: <p>Yes, although it didn't have a "W" like that. I suspect what they did was start with Serif Gothic Heavy, clipped off the center stroke on the alternate "W", made it bolder (using an optical effect, analogous to adding a stroke to a digital font), and touched up the serifs to make them more pronounced.</p>
