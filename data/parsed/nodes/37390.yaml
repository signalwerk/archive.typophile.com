    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LV_Icon_4541.png"></div><br>
    Hello:<br>
    I'd like to know what is the typeface of the L and V letters used in the pattern.<br>
    The logo "Louis Vuitton" is easier to recognize for me: futura.<br>
    However,this one is a difficult one. "L" is italice, but "V" is none. Could it be also a very classical typeface or it is a special design by the designer?<br>
    Does anyone have any clue about it?<p></p>
