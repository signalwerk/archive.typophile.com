    html: <p>Engela, you don't need a special version of a font to get tighter spacing. All graphics and layout programs allow you to change the spacing of any font using kerning. Check the manual for your program to find out how to do it. They also will allow you to shift characters up and down. Unless you are trying to do your graphics in a non-graphics program (Word, for instance) you should be able to get whatever effect you want.</p>
