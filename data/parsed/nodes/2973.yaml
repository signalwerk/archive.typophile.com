    html: <p>Here are three simulations of 'Making Love'. The first is Parade Script from Panache (used to be available through Agfa when I got it).  <br> <br>The Second is 'Fairchild' from an Expresiv Fonts Brush Script Collection, which has at least half a dozen closely related styles that were digitizations of film types. In some cases the width/height/weight were varied and serifs were added or removed, round or straight, but with very similar letterforms underneath. (Page 92 in the Dover Solotype Catalog shows a flock of these phototypes, including 'Orlando', that I think resembles 'Fairchild'). The baselines also were shifted (called Bounce variations), and you can see some of that between Parade and Fairchild. <br> <br>The third simulation is Parade Script with 'squooshing'. Using the special lenses with film type essentially gave many of the image manipulation capabilities we play with in our graphics programs, so you could have had any typeface squeezed or stretched to order. <br> <br>I know this diverts us from your question, but I thought the permutations of the lettering artists' work that will live on gives an interesting perspective to see this aspect of our digital 'culture'. <br><img src="http://www.typophile.com/forums/messages/83/25530.gif" alt="Making Love Font Simulations"></p>
    html_clean: <p>Here are three simulations of 'Making Love'. The first is Parade Script from Panache (used to be available through Agfa when I got it).  <br> <br>The Second is 'Fairchild' from an Expresiv Fonts Brush Script Collection, which has at least half a dozen closely related styles that were digitizations of film types. In some cases the width/height/weight were varied and serifs were added or removed, round or straight, but with very similar letterforms underneath. (Page 92 in the Dover Solotype Catalog shows a flock of these phototypes, including 'Orlando', that I think resembles 'Fairchild'). The baselines also were shifted (called Bounce variations), and you can see some of that between Parade and Fairchild. <br> <br>The third simulation is Parade Script with 'squooshing'. Using the special lenses with film type essentially gave many of the image manipulation capabilities we play with in our graphics programs, so you could have had any typeface squeezed or stretched to order. <br> <br>I know this diverts us from your question, but I thought the permutations of the lettering artists' work that will live on gives an interesting perspective to see this aspect of our digital 'culture'. <br><img src="http://www.typophile.com/forums/messages/83/25530.gif" alt="Making Love Font Simulations"></p>
