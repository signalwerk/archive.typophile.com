  html: "<p>I thought I was using generic MS True Type fonts that came with MS Window for this design done in early 2002.  After my computer crashed, I find I don't have the fonts anymore, and I can't edit the graphic without having the fonts.   <br> <br>I need the top font used for \"Making Love\" and the next font used for \"in Public, Engela, john, and john daniels, jr.\"  (The other font \"hilarious romantic comedy\" luckily is Garamond, so I still have it.)   <br> <br>I've have a font that looks somewhat similar to the \"in Public\" font.  Mistral isn't it, but it is close enough that I could use it if I had to.   <br> <br>Detective work:  <br> <br>I haven't found anything even close to the \"Making Love\" font.  This might be a clue, when I open the graphic a warning screen appears in Uleads PhotoImpact which says, \"Typeface Fairchild not found.\"  But I can't find a font called Fairchild to find out if that could be it.   <br> <br>Ok, now I've now deleted everything from the graphic except \"in Public\" and when I open the file the warning screens says \"Typeface Zephyr not found.\" <br> <br>So now I guess I don't really have a font identification problem, but I still have no clue where to obtain these fonts.   <br> <br>Any help would be appreciated. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/25514.gif\" alt=\"2 fonts to ID\"></p>"
