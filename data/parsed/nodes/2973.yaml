    html: <p>Making Love looks like Parade Script from Panache Typography (FontHaus) that has been stretched taller. This is one of a series of brush lettering scripts that were film type that were digitized. They have found their way into a variety of font packs of widely varying quality. Panache has some of the better digitizations of these, but you might have had a version in another package that was a renamed version of Parade that was taller (to make it look different). These things happen, especially when you buy bargain font packages.</p>
