    html: <p>What if you were to extend the red circle out a little, make it just a hair more elliptical?  The waist looks a little pinched to me; that might help make it feel more generous. <br> <br>On the i, I tend to agree with Chris - it occurred to me that you have a great opportunity there to use a right-triangle shape for the dot and reinforce your type's feel in what's right now not the most interesting glyph.  The t is excellent; all of "true" has a great diagonal force that "caliber" doesn't, maybe because you have two strongly vertical glyphs interrupting the diagonal movement.</p>
