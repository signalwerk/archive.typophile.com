  - id: 18212
    user: 2725
    date: 2003-12-04T13:38:00
    date_raw: 4 Dec 2003 — 1:38pm
    votes: null
    html: "<p>You guys are going to hate me, but I've fallen in love with my newest version, which I call the \"Swing C\": <br> <br><img src=\"http://www.typophile.com/forums/messages/29/21760.gif\" alt=\"swingc2\"> <br> <br>Now I agree with you guys about the red circle version and although aesthetically it does flow a little better it just didn't represent the company truthfully. To me it looks like a logo for some homogenized software company. Sometimes it's not about whther looks good, but whether it feels good. This could work for my film company if I wanted to be a little more freewheeling with the stories I want to tell, but I definately want to make hard-hitting and challenging movies. Think of flicks like Traffic, Fight Club, Seven or the commercial work by Chris Cunningham and Spike Jonze. Irreverant, experimental, but always, always unpredictable. <br> <br>So have I got you guys sold? How could I improve on this one? I did take into account your input on the 'i' so I stuck a dot right back in there. As far as the negative space in the middle of the ligature I like the fact it draws your eye to the middle and from there you discover the rest of the logo. I definately didn't want to stuff up the logo anymore then it had to be. <br> <br>tinch <br></p>"
