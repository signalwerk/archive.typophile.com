  html: "<p>Hey guys, <br> <br>I'm new to the board and this is my first post. I've read through quite a lot of these critiques and value your suggestions. I am starting my own film/commercial company and have had the name True Caliber for several years. I am just now hunkering down and trying to devise a logo. Here is my newest design, number 43,902: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/21610.gif\" alt=\"True Cal Red\"> <br> <br>No but seriously I have done logos for other companies, but can't seem to crack my own. Your feedback is greatly welcome. <br> <br>-Erik Tinch</p>"
