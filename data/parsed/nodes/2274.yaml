    html: <p>Hey Roger, welcome to typophile! <br> <br>This is a very interesting mark you having going. Good idea with the 't' 'c' lig. Should the red circle be a bit smaller? Or perhaps the glyph needs to be wider? It seems to me that there is too much red space on either side.  <br>As for true caliber, maybe try another typeface?   I'd like to see what everyone else thinks about that. <br> <br>As for the positioning of everything, the mark may work better beside true caliber, rather than being centered on top.  <br> <br>I like how the red circle is a bullet hole, or maybe the back of a bullet. Perhaps you could develop on that more, by adding a ring around the edge or something? <br> <br>Just some thoughts <br> <br>Drew</p>
