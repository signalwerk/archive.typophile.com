    html: <p>I'm liking Scott's solution to the 'aliber' as well, and I agree with him regarding the notch on the first 't'.  <br> <br>I'll also second the concerns about the e-t join. I'm not sold on the 't/c'-'a' join--though that's better than the other. Maybe try reworking the t-c lig to avoid joins with either word? Or maybe just flatten both curves a touch so they don't join at all? <br> <br>I also agree with you regarding the horizontal composition. Maybe you could dodge the joins and strengthen the horizontal in one swoop by reducing the x-height a touch? <br> <br>Regardless, I still find the 'lib' spacing a teensy bit awkward in Scott's version. I definitely like the independent dot on the 'i', tho. Maybe BJ is onto something with a triangle for the dot of the 'i'? Also, rather than reversing the serif on the 'l' I might try ditching it entirely--or maybe that's an opportunity to reuse the notch from the 't'? <br> <br>Finally, I think the 'er' join is a bit awkward with the tail (or whatever the correct term is) on the 'e' sticking up like that. Maybe eliminate it? <br> <br>All niggles and dodgy advice aside, it really is coming together nicely. <br> <br></p>
