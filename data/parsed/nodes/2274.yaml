    html: <p>Roger, I hate to be a partypooper, but I think that you have too much spice in your recipe. Did you switch to CINEMA from FILMS for a reason other than just to test the waters? It is probably too small for certain uses. The way you've created almost a ligature from the way you've joined the words and letters, while interesting, is perhaps too tricky. It could be read, by the casual glance as "true T caliber" or "true C caliber" it is almost redundant. In some ways, I think your original post is still the strongest. You used color and shape and placement to separate. You had a "mark" that could be used separately when necessary. The "nipping and tucking" you did to the emigre face is very nice, you should focus on that, and find a way to create a separate mark.</p>
