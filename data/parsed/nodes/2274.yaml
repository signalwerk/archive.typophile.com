    html: <p>I can't stress how much stronger your first concept is compared to these. <br> <br>Since this is a production company, some subtle animation would be appropriate. The logotype (from your first posting) lends well to animating appearing/disappearing pieces of type. One method might be to start with a solid block and tear out chunks to reveal the letterforms, then randomly have pieces/chunks of the block reappear, then disappear again, and so on (i.e. the counter of the "e's", the bowl of the "b", the chisel of the "t" arm, etc.)</p>
