    date: 2003-12-04T03:37:00
    date_raw: 4 Dec 2003 — 3:37am
    votes: null
    html: "<p>Hi Roger, <br> <br>I'm new here as well, so please forgive me if my insights aren't so insightful. I'm learning too (albeit slowly ;-). <br> <br>I'm agreeing with Daniel, Dominik and Scott: the red circle version is the strongest. I wouldn't sweat the swoosh thing. There are some swooshy shapes, but none is individually a dominant element, and the feel isn't that arcy, swooshy curve. It's more of a vortex feel, drawing the eye into the center of the logo. The square version of same is my second-favorite, though I like it more each time I look. Perhaps try using a similar but less-compressed face for the 'true caliber' to develop more horizontal motion, like the lig is a point on a timeline. <br> <br>The newer versions--the solid black type-only--don't do so much for me. The gothic 'TC' ligature reads as a 'T' to my eye, and there's too much whitespace between it and the 'aliber'; looks like a hole. Where the red circle/square draws the eye into the ligature itself, the later versions draw the eye into a hole. The first is better in that respect, but there the lig feels too heavy. Maybe slim/reduce the back side of the 'T'? Or use a contrasting color for the interior stroke? <br> <br>Also, you might try splitting up the 'ib' ligature. Part of the strength of that face is the verticality, and connecting the dot on the 'i' and the serif of the 'b' interrupts a particularly strong vertical and, to my eye, disturbs the rhythm of the face. <br> <br>Last, I think you're going to get 'gun' inferences from almost anything with your name. 'Caliber' is just very closely associated with firearms. <br> <br></p>"
    html_clean: "<p>Hi Roger, <br> <br>I'm new here as well, so please forgive me if my insights aren't so insightful. I'm learning too (albeit slowly ;-). <br> <br>I'm agreeing with Daniel, Dominik and Scott: the red circle version is the strongest. I wouldn't sweat the swoosh thing. There are some swooshy shapes, but none is individually a dominant element, and the feel isn't that arcy, swooshy curve. It's more of a vortex feel, drawing the eye into the center of the logo. The square version of same is my second-favorite, though I like it more each time I look. Perhaps try using a similar but less-compressed face for the 'true caliber' to develop more horizontal motion, like the lig is a point on a timeline. <br> <br>The newer versions--the solid black type-only--don't do so much for me. The gothic 'TC' ligature reads as a 'T' to my eye, and there's too much whitespace between it and the 'aliber'; looks like a hole. Where the red circle/square draws the eye into the ligature itself, the later versions draw the eye into a hole. The first is better in that respect, but there the lig feels too heavy. Maybe slim/reduce the back side of the 'T'? Or use a contrasting color for the interior stroke? <br> <br>Also, you might try splitting up the 'ib' ligature. Part of the strength of that face is the verticality, and connecting the dot on the 'i' and the serif of the 'b' interrupts a particularly strong vertical and, to my eye, disturbs the rhythm of the face. <br> <br>Last, I think you're going to get 'gun' inferences from almost anything with your name. 'Caliber' is just very closely associated with firearms. <br> <br></p>"
