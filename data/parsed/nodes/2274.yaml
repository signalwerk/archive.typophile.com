    html: <p>Thanks for all your feedback thus far. I'm actually trying to shy away from the whole gun connotation. I am using the word caliber for it's meaning of quality, thus "true quality". I have tried different scenarios with guns or gun imagery, but it's not the type of image I want to portray with the company. I want something along the lines of like the Psyop logo (<a href="http://www.psyop.tv" target="_blank">www.psyop.tv</a>) or Res (<a href="http://www.res.com" target="_blank">www.res.com</a>) Somethign that represents cutting-edge, but also can be a timeless mark if the company survives that long. <br> <br>Erik</p>
