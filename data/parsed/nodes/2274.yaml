    html: <p><img src="http://www.typophile.com/forums/messages/29/21878.gif" alt="tc2005"> <br> <br>HHP, You know what I was thinking about that too! For readability sake I am threw the 'c' back in, but also condensed some things to lessen the negative space in the ligature which was one of the main reasons we took the 'c' out in the first place. I was even able to incorprate the tail back into the 'c' which was a pleasant surprise. I re-did the ligature a bit and used the same arc for the top swoop that was used for the bottom swoop one to give it more sense of consistency and flow. Sorry if it seems if I keep going back and forth with stuff, but everytime I either step forward or backward it gets better so please bear with me. I am also trying the word cinema instead. Another stamp of 'seriousness' that I would like the company to have. Suggestions? Death threats? let me know. <br> <br>BJ, Jeff, Yes that is Senator Ultra font from the Emigre family slightly nipped and tucked. The ligature is an almagation of Old English T &amp; C. Cinema is in Linotype Extd Light. <br> <br>tinch</p>
    html_clean: <p><img src="http://www.typophile.com/forums/messages/29/21878.gif" alt="tc2005"> <br> <br>HHP, You know what I was thinking about that too! For readability sake I am threw the 'c' back in, but also condensed some things to lessen the negative space in the ligature which was one of the main reasons we took the 'c' out in the first place. I was even able to incorprate the tail back into the 'c' which was a pleasant surprise. I re-did the ligature a bit and used the same arc for the top swoop that was used for the bottom swoop one to give it more sense of consistency and flow. Sorry if it seems if I keep going back and forth with stuff, but everytime I either step forward or backward it gets better so please bear with me. I am also trying the word cinema instead. Another stamp of 'seriousness' that I would like the company to have. Suggestions? Death threats? let me know. <br> <br>BJ, Jeff, Yes that is Senator Ultra font from the Emigre family slightly nipped and tucked. The ligature is an almagation of Old English T &amp; C. Cinema is in Linotype Extd Light. <br> <br>tinch</p>
