      <p>Kristina, I had a similar issue with an ornament in Minion. I set the file up in CS and put my ornament in place. But when I opened the file in CS2 the ornament was replaced with the letter P. Each version of InDesign was calling on the font at a different location, and the two files were different; same bug as you: one was the newer, updated version.</p>
      <p>So, the trick might be to scan your hard drive for multiple Minions and check the dates, then move the old ones somewhere safe (or get rid of them), so that your system is only calling on the newest version.</p>
      <p>As for your printer, make them aware of the version issue, and tell/remind them tactfully that they should be installing YOUR fonts, not assuming their version of Minion is the same one you sent.</p>
      <p>ps. Plain old "swash characters" does the job, no need for the pesky "y" -- but I'm a grouchy old man who severely punishes my students if I can even <em>remotely</em> apply the word "cute" to anything they produce for class, so don't listen to me. Go ahead, swashy away.</p>
