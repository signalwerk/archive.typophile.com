    <p>I sent my files to the printer with several swashy alternate characters in the headers.</p>
    <p>The printer's blueprints have come back with those characters appearing as regular, superscript characters.</p>
    <p>He is suggesting that my font file is corrupt. Yet it is the one that came with CS2. Please help! Any suggestions would be good....I've got to get something to him by 9:30 tomorrow morning. I'd like to use the swashy characters if possible, but might have to go with the plain ol' regular ones if I can't find a solution to this.</p>
    <p>Please help!</p>
    <p>Kristina</p>
