    html: "<p>Kristina — Did you send an ID package or did you generate PDFs? I strongly recommend to provide PDFs only. If the glyphs you mentioned still don't show up in the printer's proofings, using your press ready PDFs, I guess the printer has to upgrade to the most recent version of Acrobat. (Let him at least upgrade his Adobe Reader.) If his RIP is not compatible, there is nothing left but to convert *all* your type to outlines. Or even better: generate TIFFs from each page yourself at the output resolution of your printer's plate setter.</p>"
