    html: <p>That rotated ’e’ is not a true font design. It was possibly rotated and had it lower part cut off by the logo designer. The logo mixes uppercase and lowercase characters, and possibly normal and condensed styles. Looks like Avant Garde, with the ’r’ possibly from many of the Geometrical fonts made during the 90’s, most of them found freely over the web.</p>
