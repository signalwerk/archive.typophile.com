    <p>A few weeks ago I started looking for a font so that I could recreated the logo below (I know it is not a good logo, as I have been told, but I am stuck with it). I wanted the letters to be white with a blue background (or better yet, a transparent background).</p>
    <p>If any of you experts could help as to exactly what this font is, I would be much obliged. </p>
