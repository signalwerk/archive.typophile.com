    html: <p>Some time ago I have the Rotis-family in CE, Greek and Cyrillic produced. Even the Italic styles of the SemiSerif (!). I have it offered M***type. But these have said NO after long negotiations and many examples. Want to make an in-house development which shall be offered as of 2007-2008. So licenser is Agfa-Monotype. Linotype and FontShop but also have produced CE customizations of the Rotis in the past. Enquire there...</p>
