    html: |-
      <p>Go for the Suisse.<br>
      The absence of a tail on “a”, straight legged “R”, and the more circular round forms in general, make all the difference. Your peers will appreciate your taste in such matters.<br>
      If it still seems a bit expensive, just get the extreme weights of Suisse and use Arial for the rest.</p>
