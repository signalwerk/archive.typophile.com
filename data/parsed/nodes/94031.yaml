    <p>I'm going round in circles! </p>
    <p>I work on a magazine, and use sans serif for copy such as box copy/ captions/ subheads/ technical features etc. </p>
    <p>I used to use interstate, but am redesigning the mag, and trying to choose a different font to use. </p>
    <p>I have been using the trial version of suisse (<a href="http://swisstypefaces.com/fonts/suisse-bp/all-styles/#suisse-bp-intl" title="http://swisstypefaces.com/fonts/suisse-bp/all-styles/#suisse-bp-intl">http://swisstypefaces.com/fonts/suisse-bp/all-styles/#suisse-bp-intl</a>) and like the look of it, but essentially it is very similar to swiss/helvetica. Do I ask my company to fork out £240 for it when I could just use one we already have???</p>
    <p>Does anyone have any preferences?</p>
    <p>Thank you</p>
    <p>Joanna</p>
