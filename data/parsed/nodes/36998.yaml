    <p>As I mentioned in <a href="http://typophile.com/node/19244" rel="nofollow">this thread</a>, I have begun planning an exhibition on the theme of type design and national identity, 1900-1960. I am pleased to report that we have a venue: the exhibition, "Face the Nation: How National Identity Shaped Modern Typeface Design," will take place beginning next summer at the <a href="http://mnbookarts.org/index.html" rel="nofollow">Minnesota Center for Book Arts</a>.</p>
    <p>I am now trying to round up objects to display that will convey the case studies I plan on having as parts of the show. Can you help? I am looking for offers to lend objects (specimens, other printed examples, type, matrices, etc.) related to:</p>
    <ul>
    <li>GENERAL: typecasting and -setting technology 1900-1960
    </li><li>NORWAY: Gerhard Munthe, medieval letterform revivals
    </li><li>GERMANY: Koch, new blackletter designs
    </li><li>GERMANY: 20s sans-serifs: Futura, Erbar, Kabel
    </li><li>ENGLAND: Gill Sans
    </li><li>FRANCE: Deberny &amp; Peignot sans, e.g. Bifur
    </li><li>SWITZERLAND: Helvetica, Univers
    </li><li>USA: Goudy
    </li><li>CZECHOSLOVAKIA: Vojtech Preissig
    </li><li>IRELAND: Colm O Lochlainn, new Irish/Gaelic script types
    </li><li>JEWISH DIASPORA: Hugh Schonfield, "New Hebrew Typography"
    </li></ul>
    <p>I can give assurances about security, insurance, climate control, etc. All loans will, of course, be gratefully acknowledged on exhibition labels and the checklist.</p>
    <p>Thanks in advance for any offers or leads you can provide. I appreciate the help, and I invite you all to come to Minneapolis next year to see the show.</p>
