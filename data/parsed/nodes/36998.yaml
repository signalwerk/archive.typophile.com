      <p>I think you'll be tough to get samples of Munthe. To my knowledge this type was never digitised and destroyed in a bombing during world war 2. I have never seen an actual sample but only reproductions. They would have to come from somewhere though. Let us know how you go. I would love it if you found some actual samples.<br>
      Any found samples should really be placed in a museum here in Norway afterwards.</p>
