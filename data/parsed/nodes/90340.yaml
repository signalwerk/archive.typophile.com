      <p>Andreas, linguistic frequency data tends to be quite plentiful.<br>
      But if you want to compile a list of "tricky" sequences you'd<br>
      have to be more inventive - like assign a trickiness level to<br>
      each character and write code to go through all the frequent<br>
      sequences and order them according to the total trickiness value.</p>
      <p>hhp</p>
