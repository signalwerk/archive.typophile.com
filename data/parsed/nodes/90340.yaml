    html: <p>Few years ago Typotheque released a software called "LetterFrequencyMeter" which did the job pretty well. You could instantly view which were the most used phonemes used in a text. If I remenber well you could choose the length of the phonems and analyze any text (I did some tests with some typical texts from different languages - Shakespeare/english - Balzac/french - Brecht/german…). But it is not Lion compatible :(</p>
