      <p>The “Just Another Foundry Text Generator” is indeed a funny and noteworthy tool! Thanks for sharing. To my great distress it does not allow to mix Latin with Greek or Cyrillic.<br>
      Anyway, it reveals not quite what I am looking for.<br>
      I try to be more clear. By “typical” I do not mean “most frequent”, but rather “most characteristic”, like <strong>heit lich ung</strong> in German, for instance.<br>
      Maybe, it’s a similar question like that for actual useful ligatures …</p>
