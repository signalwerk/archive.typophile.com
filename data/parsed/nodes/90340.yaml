    <p>I wonder if anyone has thought about compiling typical syllables or letter combinations of different languages, for the purpose of testing fonts. E.g.: <strong>keit sch ung</strong> for German; or <strong>ough</strong> for English or <strong>ghi</strong> for Italian.</p>
    <p>Here is a most humble beginning:</p>
    <li>Deutsch</li>
    <p>auch tz lich keit sch ich ver ung ehr</p>
    <li>English</li>
    <p>whe sh ough sty our thr ly the yth ould ing</p>
    <li>French</li>
    <p>eaux onne arde esse ente ndre</p>
    <li>Italiano</li>
    <p>ace ghi ghe chi che sc iamo enno ano azza ezza nza</p>
    <p>– contributions?</p>
