      <p>Polish:<br>
      ch, cz, rz, dz, dź, dż, sz<br>
      ść, ąc, ąć, dzi, szcz, cy, ły, wy, wz, ył, yt, zy<br>
      cki, icz, nic, nie, ski, wan</p>
      <p>(Polish syntax is too rich to to provide both short and characteristic list).</p>
      <p>I doubt in finding characteristic sets in all kinds of manuals (here I include the OUN Declaration) because of (1) repetitions, (2) formal language, (3) foreign words.<br>
      Here you have an example of such Polish text, where every fourth word comes from Latin (formal use) and English (technical loan):<br>
      <em>technologie, konfigurowanie, telefonu, laptopa, telewizora, internetowej, oprogramowanie, funkcję, minimalizmem, skomplikowane, aplikację, menu, projektowanie, humorem, praktycznymi, cytatami, organizowania, interfejsy</em>.<br>
      I suppose you understand the topic more or less, don't you?</p>
