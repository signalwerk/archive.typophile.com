      <p>I’m not sure exactly what do you intend with “typical syllables or letter combinations”.<br>
      If it’s typical as in “most frequent”, as Nina suggest, the database approach would be a sensible one (maybe starting here <a href="http://www.onelook.com/" title="http://www.onelook.com/">http://www.onelook.com/</a>).<br>
      If it’s typical as in “less found in other languages”, it could become a difficult task.</p>
      <p>As for Italian, one example of the latter type is "gli" (and also the common use of "l’" and "L’" followed by any uppercase or lowercase vowel, but that’s a different problem, I suppose). </p>
      <p>Edit: I looked at the generator Craig linked to and think it would be less effective than an actual (good) text, at least for Italian.</p>
