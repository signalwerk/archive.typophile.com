      <p>Very good.<br>
      I have to wonder if instead of trying to think of these off the top of our heads, this sort of data (frequent/«typical» letter combinations) should/could not better be retrieved from linguistic databases. I seem to remember linguistic data for frequent two-letter combinations (Hrant?) and of course frequent words; I can't see a reason why this shouldn't also exist (or be retrievable) for combinations of 3 or more characters.</p>
