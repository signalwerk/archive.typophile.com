    <p>From what little I've seen of the few different Lining Gothic's, I find the them charming.</p>
    <p>I really like No. 66 &amp; No. 545, but I haven't been able to look at them up close.</p>
    <p>Does anybody know a place on the net with some good specimens of the family?</p>
    <p>(I understand that Lining Gothic isn't a full-fledged family.)</p>
