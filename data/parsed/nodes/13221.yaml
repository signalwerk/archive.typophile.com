  html: <p>There are so many companies online to purchase color printing from these days.  It seems like every few weeks, a new one pops up, undercutting the previously lowest priced printer.  We've had our share of good and nightmarish experiences.  Is there a printer(s) you would highly recommend?  Lets get some epinions!</p>
