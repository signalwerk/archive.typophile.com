    html: |-
      <p>Because I live near their retail store (?!), I've used <a href="http://www.clubcardprinting.com/home.cfm" rel="nofollow">Clubcard</a> which offers both 1-day turnaround on digital printing, and longer turnaround on my new favorite thing; hi-res stochastic screened offset. Gives amazingly crisp type and unbelievable detail for photos. The screening is so fine, you need higher-res digital images than with normal offset, or pixels will show. </p>
      <p>Clubcard has a location in Vancouver as well as SF. Their presses aren't any trade secret, and actually their screening process isn't either (look around on their website). You could try to locate someone in your area that uses them.</p>
      <p>If you work with Clubcard, do make sure to provide all the crops and marks, as they gang many jobs and aren't necessarily pampering your job when it's run.</p>
