      <p>Have you tried <a href="http://www.vistaprint.com" title="www.vistaprint.com">www.vistaprint.com</a>?  I used them for postcard printing for my wedding photo thank you cards.  Most of their designs and templates are for business but I was able to design something myself by uploading photos and whatnot.  The quality was great and the price was unbeatable.  </p>
