  html: |-
    <p>Hi All,</p>
    <p>Here is a scan of an impression from debossed metal tag.</p>
    <p>I would like to have a few new ASCII symbol punches/dies made for my Graphotype (made by Adressograph-Multigraph) debossing machine and would like to have close matches for the style and size.</p>
    <p>The machines were used to make addressing labels (remember the little white gummed paper subscription labels on magazines) in the earlier 1900's and USA military DogTags from 1940 until recently.</p>
    <p>The font would have been made to match up with some contemporary typewriter fonts and some available hot metal font as well.</p>
    <p>It is a monospaced font 11 character per inch in this example<br>
    The Courier New sample was at 48 Point to match size.<br>
    The strokes are all single width as far as I can tell.</p>
    <p>Any ideas on a font I could use as a giude.</p>
    <p>Regards</p>
    <p>Kalle<br><img src="/sites/default/files/old-images/monospace-scan_5638.gif"></p>
