    <p>Probably a weird question about the levels-curve in Photoshop ...</p>
    <p>When I open a picture in Photoshop and then go to:<br>
    Image  –&gt;  Adjustments  –&gt;  Levels<br>
    This [see attachment] is what I get:<br>
    A curve with some peaks (in this case: one main-peak and several side-peaks).<br>
    I assume that each of these peaks represents a specific colour (or am I wrong?)</p>
    <p>Now here’s my question:<br>
    Is there a way to use this curve with peaks to get the colour definition (CMYK or RGB) of these colours?</p>
    <p>(Or am I mistaken and the curve is about something else?)</p>
    <p>Thanks for any comments.</p>
