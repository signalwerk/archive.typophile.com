    html: |-
      <p>The levels histogram shows you the value (light vs dark) distribution of an image. You use levels to adjust the value of colors by adjusting the black point, mid point and white point of the image (the colored triangles at the bottom of the histogram). You can also adjust these points on individual color channels as opposed to the combined composite channel (thus adjusting the values on the blue channel as opposed to the red and green).</p>
      <p>As to your question: I'm not clear on what you mean by color definition? Are you trying to identify an images color space from the Levels palette? Or are you trying to identify specific colors? If the latter, I'm not aware of how one could use the histogram to do that as, again, it shows the distribution of values of the image.</p>
