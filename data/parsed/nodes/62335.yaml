    html: |-
      <p>I think the peaks represent different brightnesses rather than colours. So you have here a lot of darkish pixels, from 30-50% brightness, a small range of medium brightness pixels (50-55% bright) and a low number of brighter pixels from 70-100% brightness. There are no pixels that are fully black. </p>
      <p>Best way to get the colours would be to select&gt;colour range on your picture, click the part of the pic that has a colour near what you want, using fuzziness to control the tolerance and then filter&gt;average will give you specific (average) colours.</p>
