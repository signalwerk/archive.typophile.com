    <p>hey all, i would love to design more books, but i honestly have no idea how to get these type of jobs. i try searching on some australian job sites and i cannot find any jobs.</p>
    <p>how do you find about this this?</p>
    <p>are there any special website for publishers and designers wishing to do this?</p>
    <p>thanks in advance!</p>
