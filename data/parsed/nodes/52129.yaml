      <p>Two years ago, my brother published a poetrybook with a local publishing house. He asked me to design and typeset it. The publisher in question liked the design, and asked me to design more books for him.<br>
      I'm bascially one of his permanent designers now. It's a small publisher (a two man business), but they put out quite alot of books.<br>
      Who knows the work I do for him now, can provide me with more book design work for other publishers. I think this is a good way to get into it.</p>
