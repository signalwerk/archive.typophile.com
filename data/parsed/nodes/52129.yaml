      <p>I started a small book publishing company, publishing modest local-interest books that I knew I could sell without much trouble (and wouldn't cost me a lot to have printed). I hired myself to do the design and typesetting. As time went by, self-publishing authors in my locale who saw my books and liked the way they looked, began hiring me to produce their books, and with a track record and portfolio now, I began bidding on book production projects for historical societies and corporations. Eventually I began landing contracts with book publishing houses, though these are a result of connections I've developed over the years with people in the industry.</p>
      <p>Gary</p>
