      <p>well it's as simple as this: you have to know people (connections, friends...), or you have to make yourself known to these people (self-published work, buzz, press articles, awards). it's a tough job to get contracts in the much sought-after business of book design, for it is (for most of the graphic design gurus wannabes) the pinnacle of artistic freedom and "look what i can do with my indesign and my avant-garde / gotham / helvetica".</p>
      <p>dr</p>
