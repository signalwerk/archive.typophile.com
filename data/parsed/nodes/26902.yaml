    <div class="info">Submitted by <a href="/user/3" title="View user profile.">Jared Benson</a> : 29.Dec.2003 12.12pm </div>
      <p>It's not too late to submit a design for the Typophile 2004 DIY calendar! In fact we're going to extend the deadline to January 15th in hopes of giving some of you the added time you need. You can start by designing and submitting your birthday month. <br> <br>The 2004 calendar is our first collabo for the new year. Typophiles will be able to download and assemble twelve 11"x17" PDFs to create their own 2004 calendar from all submitted designs. <br> <br><a href="http://www.typophile.com/forums/messages/72/19057.html">Full details here</a> <br> <br>We're looking forward to seeing what you come up with!</p>
