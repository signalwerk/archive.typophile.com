  html: |-
    <p>Hi,<br>
    I'm interested in anyone's opinions on when horizontally elongated letter forms first first started appearing. I'm not talking about fat faces with wide verticals like 'Blackoak', but forms in the same area as the P in the Pirelli logo.</p>
    <p>I've noticed a few faces of late on things like Ralph Lauren polos, F2 racing branding, and a private aircraft maker - Icon A5.</p>
    <p>So is this a very recent style?</p>
    <p>It seems to be useful for high performance cutting edge technology - prototype cars, planes and sailing.</p>
    <p>cheers<br>
    G</p>
