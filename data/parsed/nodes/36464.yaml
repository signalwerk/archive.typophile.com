    html: |-
      <p>I like chuckgroth's horizontal, cropped version. Cropping was an improvement.</p>
      <p>If I should take it from there, i would try:</p>
      <p>01<br>
      Scale down the 3d image approx 15%, so that (a) the uppermost edge of the 3d image not reaches the top edge of the card, and (b)the southwest corner of the card just shows a tiny bit of background (ie: you should be able to see the roundness of the 3d image down in this corner)</p>
      <p>02<br>
      Write all the text in the same size, which should be fairly small (ie the size of the email address or a bit larger)</p>
      <p>03<br>
      Lose the idea of having flush right type 'mirror' the right edge of 3d image ... make it flush left instead, and use the 15-odd % scaling of the image and the downsizing of the type to get ample space between the two elements</p>
      <p>04<br>
      Write all the text without emphasizing with small caps or blank lines ... you only got three lines - no need to diffenrentiate anything, people can easily navigate through the information ... and the more minimalistic the type, the more exclusive it gets. (And the more 'boring' the type, the more interesting the 3d image. This is my main point: let the image steal the scene!</p>
      <p>05<br>
      Just to pursue this line of thought, you COULD try to change the colour of the type to light grey ... 15-20 % black or something</p>
      <p>06<br>
      No matter if the type is grey or white - if you scale it down like I suggested, remember to give a few units of space between all letters</p>
      <p>07<br>
      In the same line of thought: you COULD try to write everything with lowercase ...</p>
      <p>08<br>
      BTW - how is the card going to be produced? Colour printer? Or offset printing ... this may influence some of the choices you make ... eg the colouring of the type</p>
      <p>09<br>
      Yes, I guess I am a minimalist ... ;.)</p>
