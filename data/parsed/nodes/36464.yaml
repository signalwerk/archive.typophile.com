      <p>01<br>
      on the back side: i think you suffer somewhat from 'horror vacui' - i mean you let the type get almost as big as it can, and you go right up to top edge and right down to the bottom as well ... it's as if you want to stretch whatever there is on a page, so that it can fill it completely ...<br>
      how about scaling down the type to, say, 80-85 percent ... and then placing it 5 mm from right edge and 5 mm from bottom edge - without the blank lines.</p>
      <p>02<br>
      what happened to @ in your e-mail adress ... couldn't you condense that, too?</p>
      <p>03<br>
