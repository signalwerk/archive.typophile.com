      <p>chuck groth may be right about a closer crop ...</p>
      <p>personally, i prefer the back side blank on a business card - so i would try to put all the type on the front (making the univers condensed was a right move imho) and then scale it down a little bit more if necessary. see how it looks. if it looks bad, then put it on the back side, but then i would certainly not place it right in the middle, rather i would place it nearer to the bottom edge - and definitely in a smaller point size.</p>
      <p>if you place all the text on the front side, ie four lines, then you could try emphasizing the first line, your nane, by writing it in univers condensed bold (and the three remaining lines in univers condensed regular)</p>
