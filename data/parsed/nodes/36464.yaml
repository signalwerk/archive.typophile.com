      <p>First off, I'd suggest using a typeface that's a little more readable at small sizes.</p>
      <p>Because you do 3D animation, I think that the 3D render on the card might be a good idea, especially if you're going with a CMYK card. If you're keeping it, you might want to keep at least your name set in Magneto. I don't know if the vector version is necessary, and I might put the dots above and below the 'E' in "Erven" instead.</p>
      <p>Play around with it and post your progress.</p>
      <p> - Lex</p>
