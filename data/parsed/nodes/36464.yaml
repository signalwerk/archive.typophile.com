    <p>Hello everyone, </p>
    <p>I’m brand new to the forum but in need of some help! (I posted this in the design section but was kindly referred here)</p>
    <p>I designed my own business card while I was still at university, and was pleased with it at the time, but it is beginning to show it’s age!</p>
    <p>The card consisted of a rendered 3d letter “e” with a black background. On the right side of the card, I wrote my name and details in white with Magneto for my font. Have a look below. It’s just not doing it for me. I am a video editor/3d animator living in London. I want to convey a modern, smooth image, without being too “out-there” for the average person that I might give my card to. I am still generally happy with this background image, but I welcome any and all advice in regards to colours, layout, font (ESPECIALLY font), etc.</p>
    <p>I humbly thank you in advance for taking the time to help me!</p>
    <p>~Erven<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/BusCard_help_4232.jpg"></div><p></p>
