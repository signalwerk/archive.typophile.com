    <p>Hi Folks! <br> <br>Maybe some of you are asking themselves the same thing... <br> <br>Does InDesign CS support Unicode? With InDesign 2, I just tried to write something in Hangul (Korean) with the Seoul font. The Glyph Palette shows the characters, but when I use PowerInput that came with Jaguar, and works in all of my newer apps, I get crippled %$</p>
