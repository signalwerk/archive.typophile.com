    date_raw: 2.Jan.2004 1.32pm
    votes: null
    html: <p>They all use the same type engine which handles how the applications access fonts and the glyphs within those fonts. Illustrator and Photoshop even use the same text layout engine (which is a separate component). However, compatibility with input methods and clipboards are still partly separate issues. <br> <br>Cheers, <br> <br>T</p>
