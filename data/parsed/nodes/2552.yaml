    html: <p>Unicode input in InDesign 2.0 on the Mac is not really feasible. It was deisnged around the lowest-common-denominator APIs that work on both OS 9 and OS X.  <br> <br>The new version may fix all or part of this problem. Try installing the free tryout version of CS and see if that works better. Alternately, try the Windows version of the program.</p>
