    <p>Hi Guys,</p>
    <p>I have a question about Fontlab and Opentype-features:<br>
    I want to make a OpenType-script for <a href="/wiki/swash" class="freelinking" rel="nofollow">swash</a> characters. One script for<br>
    beginning characters, and one for the last.<br>
    But whatever I do, not only the beginning character are changed, but also<br>
    other Uppercase-letters inside the text-string....<br>
    What's going wrong??</p>
    <p>Best regards and thanks for your help,<br>
    Morten</p>
