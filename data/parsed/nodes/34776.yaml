      <p>Morten, </p>
      <p>1. Your @call class should include all text glyphs, not just the plain uppercase and lowercase letters. </p>
      <p>2. You might consider adding simple-substitution "init" and "fina" features into your font. The "init" would substitute regular letters with their initial forms, and "fina" would do the same for the final forms. These features are supported now (on user's discretion) in InDesign CS3. </p>
      <p>A.</p>
