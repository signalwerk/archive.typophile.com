    html: |-
      <p>Hello Morten,</p>
      <p>I use this feature code for it and it works:</p>
      <p>feature swsh {<br>
      lookup cswsh {<br>
        ignore sub @call @cswsh1';<br>
        sub @cswsh1' by @cswsh2;<br>
      } cswsh;<br>
      } swsh;</p>
      <p>@call = all characters including the space<br>
      @cswsh1 = all uppercase character names<br>
      @cswsh2 = all uppercase character with swash names</p>
      <p>Pieter</p>
