    html: |-
      <p>I agree with Jeff, but in a way that's the good news. That also means it would be hard to say anything similar was not a match, based on those letters. The R has a straight leg. If it does not touch the stem, then you could use Franklin Gothic, for example. If the leg of the R does touch the stem, then you could use <a class="freelinking external" href="http://new.myfonts.com/fonts/berthold/ag-schoolbook-bq/medium/?testdrive=custom%3D0%26dock%3Dfalse%26size%3D118%26w%3D720%26src%3Dcustom%26text%3DLONDOR%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D40" rel="nofollow">AG Schoolbook Medium</a> (with some squooshing), or <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/fb-nobel/?testdrive=custom%3D0%26dock%3Dfalse%26size%3D118%26w%3D720%26src%3Dcustom%26text%3DLONDOR%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D27" rel="nofollow">Nobel Bold</a> (with squooshed O), or <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/praxis/?testdrive=custom%3D0%26dock%3Dfalse%26size%3D118%26w%3D720%26src%3Dcustom%26text%3DLONDOR%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D23" rel="nofollow">Praxis Bold</a>, with a little O squooshing.</p>
      <p>If you get any idea about a few other key letters, like M, G, S or C, you can use the beta version of the <a class="freelinking external" href="http://www.bowfinprintworks.com/SansGuide/sanssearch.php" rel="nofollow">Sans Serif ID Guide</a> to locate other candidates. As I did in this answer.</p>
      <p>- Mike Yanega</p>
