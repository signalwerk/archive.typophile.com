    <p>hey, how is everybody doing,</p>
    <p>i need some help guys, is it possible to print my grids from indesign (cs3) i'm working on this book layout but would like to print just the grids</p>
    <p>i tryed looking it up in the indesign manual and i think i have seen it in there somewhere but i can't seem to find it again.</p>
    <p>thanks in advance</p>
