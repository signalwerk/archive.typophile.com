    html: |-
      <p>I'm not sure about CS3, but on CS2, you can do it by enabling 'Print Visible Guides and Baseline Grids' (File &gt; Print Presets &gt; Define &gt; Edit &gt; General)</p>
      <p> <img src="/sites/default/files/old-images/Print_Preset_4348.jpg"></p>
