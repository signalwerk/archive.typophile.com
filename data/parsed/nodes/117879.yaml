      <p>At first, I thought the font wasn't designed by Erik, since it didn't appear to match any of his output. </p>
      <p>Then, I discovered this: <a href="http://usshop.gestalten.com/hello-erik.html" title="http://usshop.gestalten.com/hello-erik.html">http://usshop.gestalten.com/hello-erik.html</a></p>
      <p>The font is called Real, and was designed by Spiekermann specifically for this project. You get it free when you buy the book.</p>
