    <p>Original image:<br>
    <img src="http://i45.photobucket.com/albums/f71/sluggxp/GBAGameSharkLogo_zps27851c25.jpg"></p>
    <p>If you'd like to use OCR methods against the text only, here's a cropped and isolated version, including the stylized "A" characters:<br>
    <img src="http://i45.photobucket.com/albums/f71/sluggxp/gs1_zps2044e022.png"></p>
    <p>And without the "A":<br>
    <img src="http://i45.photobucket.com/albums/f71/sluggxp/gs2_zps2b57ba80.png"></p>
    <p>I just need a font that fits well, but it does not have to be exact. Any font that fits well with the stylized "A" would be fantastic!</p>
    <p>I thank you very much in advance.</p>
