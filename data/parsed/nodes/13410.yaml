  html: |-
    <p>I am learning some OT features, and the vkrn feature is very interesting, but I am having some problems.</p>
    <p>1. when I check the feature in FontLab 4.6, it raises all the glyphs following the one I want raised.<br>
    feature vkrn {  pos \uni053B \uni055E 120;} vkrn; should raise one \uni055E when it is after \uni053B, but everything that comes after it is also raised.</p>
    <p>2. I cannot get it to work outside FontLab. The feature should be on by default, but I don’t know how to do it.</p>
    <p>Anyone knows how to resolve these problems?</p>
