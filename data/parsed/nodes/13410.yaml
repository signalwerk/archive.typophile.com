      <p><cite>feature vkrn { pos \uni053B \uni055E 120;} vkrn; should raise one \uni055E when it is after \uni053B, but everything that comes after it is also raised.</cite></p>
      <p>I think you have to change your lookup to something like this:<br>
      <code>pos \uni053B \uni055E &lt;0 120 0 0&gt;;</code></p>
      <p><a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html#2.e.iv">http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html#2.e.iv</a></p>
