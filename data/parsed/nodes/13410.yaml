    html: |-
      <p>The Adobe FDK has the same limitations as FontLab, unsurprisingly as FontLab’s current OT generation is built on the Adobe FDK code.</p>
      <p>You can run VOLT under Windows emulation on the Mac.</p>
      <p>It is possible to use VOLT to develop CFF fonts. See my old Typophile post No.510 in this thread: <a href="http://www.typophile.com/forums/messages/4100/15453.html">http://www.typophile.com/forums/messages/4100/15453.html</a></p>
