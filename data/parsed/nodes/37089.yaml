    <p>Mind The Gap ...in your font collection<br>
    -------------------------------------------------------<br>
    P22 Type Foundry is proud to announce Underground Pro, an extensive font set based on Edward Johnston's historical type design for London Transport's Underground Railway system.</p>
    <p>Underground Pro is the most expansive P22 font system ever. It includes 6 weights with unprecedented language support for Latin (extended Latin, plus IPA, Vietnamese, symbols and stylistic variants), Greek (monotonic &amp; polytonic) and Cyrillic (extended inluding Russian, Bulgarian, Serbian, etc.) languages. Cumulatively, there are over 5,000 glyphs in each of the weights (Pro only).<br>
    Other features include Small Caps and Petite Caps for all weights, titling options that mimic London Transport signage and the addition of lower case characters to the bold weight. Underground Pro is also packaged with fonts in basic OpenType format for applications that do not support Pro Opentype features such as Microsoft Word.</p>
    <p>The overall design of Underground Pro, like the P22 London Underground Set (1997), is kept as intended by Johnston and builds upon the proportion system adhered to by Johnston in designing the London Underground face.<br>
    Although the regular and bold weights have been subtly redrawn for Underground Pro, the characteristics of the<br>
    1916 design remain intact. The possibilities of OpenType have also afforded a great opportunity to expand on this classic type design. The Pro version includes alternate caps from Johnston's lettering for Dryad, "humanistic" and "geometric" alternates and a stylistic set that replaces all the diamond-shaped punctuation and diacritic marks with circular ones. The font was designed by Paul Hunt who<br>
    adds:  "Ultimately, I wanted to make a typeface system which was thoroughly customizable so that the user could change its appearance to suit their particular needs."</p>
    <p>Both Underground Pro and the The London Underground Set are licensed exclusively to P22 from the London Transport Museum.  For more information:<br>
    <a href="http://www.p22.com/products/underground.html" title="http://www.p22.com/products/underground.html">http://www.p22.com/products/underground.html</a><br>
    ---------</p>
    <p>Cheers.<br>
    P22 Type Foundry<br>
    <a href="http://www.p22.com" title="http://www.p22.com">http://www.p22.com</a></p>
