  html: <p>I am doing some research on a printing press that was established in Thanjavur, India in 1803. In two sources the type used is called "stone type" (which I would assume was lithography) but a third reference from 1872 describes it as “cast Devanagari type imported from Madras.”  Anybody an expert on such and could clarify?</p>
  html_clean: <p>I am doing some research on a printing press that was established in Thanjavur, India in 1803. In two sources the type used is called "stone type" (which I would assume was lithography) but a third reference from 1872 describes it as “cast Devanagari type imported from Madras.”  Anybody an expert on such and could clarify?</p>
