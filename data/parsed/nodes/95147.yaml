      <p>In the category of the Borgward, Wartburg, etc. I like this <a href="http://www.remarkablecars.com/main/humber/humber.html">Humber</a>, one of which is parked on my street. Of course, these are all much more humble cars than the supercar class with which the thread began.</p>
      <p>Craig, while the subject of cars is categorically off-topic, I'd argue that getting a sense of the kind of cars that appeal to people who are also typophiles isn't any more off-topic than any other kind of design. Insofar as type design can be considered a branch of industrial design -- Briem first suggested to me this when he visited us in Vancouver many years ago --, this topic could be considered more on-topic than the graphic design talk here. Type and automobiles both have functional jobs to perform that are in part independent of their aesthetics (although their beauty may result from features that make them, respectively, more readable or more aerodynamic).</p>
