      <p>@ J. Weltin:<br>
      Aesthetics aside, though, it appears that the Vanquish does not use ordinary tires, but instead requires special tires that rest on a larger wheel, which are no doubt more expensive.</p>
      <p>Of course, that is unlikely to be a significant concern for those in that car's intended market.</p>
      <p>EDIT: Checking at a site called "Size My Tire", the Vanquish tires have an aspect ratio of 40%; this was shared by the first other type of car that I checked, a Chevrolet Corvette, although a Ford Econoline van had tires with an aspect ratio of 75%.</p>
      <p>I hadn't realized there were so many different sizes of tire; I had thought there were only a very few standard sizes, one for cars, and bigger ones for trucks and buses.</p>
      <p>But the rear tires on a Vanquish are wider than the front tires, which prevents normal tire rotation.</p>
