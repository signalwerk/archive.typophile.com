      <p>I like the curves of car bodies from around 1952, whether Caddy, Jag or Roller.<br>
      They look good driving down main street, catching reﬂections.<br>
      My soft spot for things of that era may be because it’s my vintage too.<br>
      I don’t think those shapes have had much inﬂuence on my type designs, though.</p>
      <p>I’ve long had a fascination with the wedge shape (mid-seventies: Countach, Esprit, Bricklin &amp;c.), and have tried to implement it in type designs over the years, but never got beyond sketches and rough prototypes.</p>
