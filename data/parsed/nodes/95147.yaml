      <p>In terms of contemporary car design, I think the <a href="http://www.evo.co.uk/news/evonews/203855/bristol_fighter.html" rel="nofollow">Bristol Fighter T</a> is a lot more beautiful than the Zenvo. It manages to pull off that clever trick of referencing the design tradition of the earlier Bristols (in turn based on pre-war BMW), while clearly displaying things that are possible with modern materials and techniques that were not in Bristol Cars' heyday.</p>
