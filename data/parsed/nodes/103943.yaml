    html: |-
      <p>Well, I admit it's impossible to be sure. But note the following:<br>
      - That's actually what a -simplified- curve/curve trap looks like. It's an approach favored by some people (including Carter AFAICT) even for straight/straight traps, for its simple elegance.<br>
      - Many people put shears at the ends of their traps, especially when they [have to] go too deep.<br>
      - When I look at the darkness of that area, it seems a bit too light to me, which means the curves <em>have</em> been pulled in (like you would do when trapping).<br>
      - That "B" seems to have gentle thorns (the inverse of a trap) so it seems to be attuned to output degradation (where trapping is most relevant). But I admit that could just be a stylistic thing.</p>
      <p>Here's a detail of the Ջ in Ernestine:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/twotraps_4091.gif"></div><br>
      Although we didn't use shears, note how the curve/curve and curve/straight traps are visibly lightening things up.<p></p>
      <p>--</p>
      <p>If it <em>is</em> filled-in, the reason is probably to avoid super-sharp corners, since they can cause rendering problems. I think Doyald Young recommended that any corner sharper than 30 degrees should have such a shear.</p>
      <p>It would be very helpful to see other glyphs, like the Bold "v".</p>
      <p>hhp</p>
