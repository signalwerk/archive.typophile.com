      <p>Nick expressed my motives for choosing this construction.</p>
      <p>Incidentally, I’ve always found it amusing that the term “ink trap” was originally used pejoratively for an attribute of a letterform that filled excessively on press, and it was precisely these ink traps that Griffith sought to *eliminate* and work around with the Linotype Legibility series of newspaper typefaces, ca. 1920s.</p>
