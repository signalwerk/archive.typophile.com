    html: |-
      <p>This is best thought of not as an angle that is filled in but as a crotch in which the confluence of two curves or diagonals is spread apart a little. The purpose is, as Frode says, to lighten the join and stop the area becoming too dark where the bowl or stems come together.</p>
      <p>[Ink] Trapping is something very particular, which I don't think applies in this case. The purpose of an ink trap is, as the term suggests, to capture ink during printing. It is a special treatment of an internal angle designed to compensate for the phenomenon of inkspread that would otherwise distort the letter shape at this point. As such, ink traps are properly designed relative to output technologies. They are related to but technically distinct from two other phenomenon: similar feature in designs for phototypesetting that compensate for photomechanical softening of corners, and more general, output-independent optical compensations of the kind used in Candara and many other designs. </p>
      <p>This illustration shows how this type of  construction enables one to open up the crotch while maintaining the shape of the curves further out. The same curves without the 'spreader' segment is in the background layer.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/crotch_5458.png"></div><p></p>
