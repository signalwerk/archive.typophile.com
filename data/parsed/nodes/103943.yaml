      <p>I understand the motivation (and Nick did indeed express it well) but I wonder whether this is another case of designers wanting more control than they can really have, resulting in the sacrificing of something more important than "consistency". Namely the quality of the form when it can be consciously appreciated (read: large) versus when everything just blends in (read: small).</p>
      <p>Note that this thread exists because somebody noticed something they weren't supposed to.</p>
      <p>hhp</p>
