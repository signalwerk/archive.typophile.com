      <p>Very sharp points in type outlines are, paradoxically, vague -- their appearance being determined to an extent by the resolution at which they are rendered. </p>
      <p>By pre-empting the blunting that press gain, for instance, may produce, the designer produces a more consistent design, with a nominal appearance controlled to be closer to the set result than the really sharp points that may otherwise characterize the typeface when closely inspected in, for instance, online PDFs.</p>
