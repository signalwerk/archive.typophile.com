    html: |-
      <p>If you look at Candara's "v" you will see a clear trap there, even in the Regular. Now look at the "k": no shears on those sharp corners... Plus, like I said, Candara even has thorns. So since it's a very "pointy" design with at least some trapping, I think the shear in the "B" is a classic way to finish off a trap (which might be done to avoid it going too deep). But we can always ask Gary.  :-)</p>
      <p>BTW whether you want to add a shear to avoid pointiness or not, the Trapping Flower can do it: once you decide how big you want the shear to be (see below) you can figure out which measurement ring it should fall on, and use that ring as the cutoff for all the inside corners. You can even use the Flower to make thorns BTW - in which case it would be a rose...  ;-)</p>
      <p>To decide the size of your shear: look at some respectable fonts, but do mind the point size range they're intended for, since fonts for display will have smaller shears than fonts for small text.</p>
      <p>hhp</p>
