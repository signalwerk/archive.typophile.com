    html: <p>The main Gaelic face looks like modified Uncial. <br> <br>Maybe something like <a href="http://www.myfonts.com/fonts/linotype/bernhard-schoenschrift-ef/bernhard-schoenschrift-light/testdrive.html?s=Restaurant+%26+Bar&amp;p=48" target="_blank">Bernhard</a> for that script (though it gets harder to discern as we move down the sample).. <br> <br>..and though the 3rd sample is almost totally intelligible, it almost looks like Helvetica with serifs?  Strange, but should get you started.</p>
