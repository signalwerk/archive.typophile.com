      <p>"In a hospital you don’t usually have to look at signs from long distances..."</p>
      <p>It could also depend on the particular hospital, and also the wayfinding model. </p>
      <p>We're working on signage for a hospital where corridors run for about a 100mtrs from main nodes (where directories are placed). Facility pointers need to be readable from at least about half that distance. For that project, by the way, Myriad has worked quite well.</p>
