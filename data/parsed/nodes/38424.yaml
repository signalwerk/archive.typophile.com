    html: |-
      <p>Hi there:</p>
      <p>Does the hospital have an existing identity? Your choice needs to fit in with existing graphics otherwise it may cause confusion and convey a “hodge podge” unprofessional quality. This can trickle down into how people perceive the hospital.</p>
      <p>Myriad and Frutiger are tried and true for the purpose, but hardly groundbreaking (I like Myriad better). Maurea is lovely. Scala Sans is excellent for way-finding, but if not used correctly can be industrial and clinical- use warm colors and graphics. Look at Metro.net as an example.</p>
      <p>Arrival does not have condensed weights yet.<br>
      Chevin may be too trendy if not used correctly for a hospital- it's nice tho. Clearview is just not attractive and too masculine for my taste- a Meta Highway? However, it does have a complement of extensive weights and styles.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PreviewofUntitled_5703.png"></div><p></p>
      <p>And speaking of Meta- if you combine Meta with Frutiger you get AXIS by Akira Kobayashi... it will cost you a pretty penny though, but its better looking than Clearview or Meta and fresher than Frutiger or Myriad. It is expressly designed for way-finding. I know- its an offbeat choice.<br>
      <a href="http://www.typeproject.com/index.html" title="http://www.typeproject.com/index.html">http://www.typeproject.com/index.html</a></p>
      <p>Others to look at are:<br>
      Locator by Process Type<br>
      Whitney by Hoefler and Frere Jones<br>
      All of Lucas de Groot's products<br>
      <a href="http://www.lucasfonts.com" title="www.lucasfonts.com">www.lucasfonts.com</a><br>
      All of Dalton Maag's products<br>
      <a href="http://www.daltonmaag.com/browse/fonts/dama/" title="www.daltonmaag.com/browse/fonts/dama/">www.daltonmaag.com/browse/fonts/dama/</a><br>
      Subtil- probably unreleased, but you could enquire about it<br>
      <a href="http://www.tdc.org/news/2007Results/Subtil.html" title="http://www.tdc.org/news/2007Results/Subtil.html">http://www.tdc.org/news/2007Results/Subtil.html</a></p>
      <p>Hope I helped,</p>
      <p>Mike Diaz :-)</p>
