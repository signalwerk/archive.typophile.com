      <p>Frutiger is often used for wayfinding, and is one of the great sans faces of all time. </p>
      <p>Frutiger is probably as close to 'perfect' as you are going to find, but I'm not sure if you want perfect. In a hospital you don't usually have to look at signs from long distances, so I would think that the mood or look you want to create is most important. Therefore, you have a very wide range of fonts that are possible. </p>
      <p>For example, Bliss is a warmer sans than Frutiger, and that might be a nice lift of mood in a Hospital.</p>
    html_clean: |-
