      <p>Yes, Renko, of course :)... At this point I am testing these fonts: Fago, Vektora, Transit, Frutiger, Scala Sans, and Maurea. I want to find a typeface that is clear, readable, legible and solid, that express effectiveness and that the site is «modern» and offer the best medical treatment. At the same time I´m looking for a human, friendly quality in the tyeface, and I want it to have an own «identity» (sorry, my English is not the best, but I want it to stand out a bit from the well known typefaces, Frutiger, etc, but still have that quality that it is effective in a wayshowing-system). Heh,well,  I want all!  And I want it to have a touch of elegance, that might give the patients and visitors less feeling of beeing in an institution. Ok, these are my thoughts and wishes, if you know a perfect of suitable typeface, please tell.  </p>
