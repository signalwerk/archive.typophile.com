      <p>It's creative. Not sure I understand why the O was deleted.</p>
      <p>One concern I have is that most folks (at least in the U.S.) transfer business card info to their computer and devices. How they would enter the name — "f      rmat", "frmat", "format", or what? And in the graphic below you spell it 2 different ways.</p>
      <p><img src="/sites/default/files/old-images/format_3825.jpg"></p>
      <p>Also your spacing between the "f" and "rmat" is very inconsistent. I know you're trying to vary it depending on the layout, but it creates a very inconsistent look.</p>
      <p>Not trying to sound negative, it's a creative solution, just pointing out a few things.</p>
