    html: |-
      <p>Why would you name a gallery "floormat"?</p>
      <p>My point is that I think it's a bad idea, from a branding perspective, to omit a letter, particularly a vowel, entirely from the logo. A logo should be easy to read, not difficult. While it's thought provoking and the conceptual idea is interesting and fun, you're really stretching the metaphor by applying it to the logo. </p>
      <p>I agree that you should not play with the spacing and it should be fixed. It's bad branding practice to "play" with the design of your logo in ways that undermine it's coherence as a symbol. That said, it *is* an art gallery and breaking those very rules might be part of it's mission or culture. I'm just quoting branding bible and verse.</p>
    html_clean: |-
