      <p>or this -</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/forrmat-2_5831.png"></div><p></p>
      <p>The main problem with the original is that if it appears on a routine document (rather than a business card), it will look like a formatting glitch rather than a logo. As if someone accidentally selected the o and hit Tab, pushing f and rmat to the left- and right-aligned tabstops at the sides of the page.</p>
