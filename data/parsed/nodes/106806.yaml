    <p>Hi Guys, </p>
    <p>This is my first post so excuse any problems as I'm new :)</p>
    <p>I am about to start a new brief for my BA Graphic Design course and I have chosen to do a competition brief set by the ISTD (link below).<br>
    There are a few briefs to chose from but I have chosen one which involves creating two contemporary and explorative type specimens for two of Monotypes fonts.</p>
    <p>In relation to this I wanted to ask here and see if anyone knows of any really good contemporary type specimens, that I can look at for inspiration. I have searched and found some, but wanted a second, third or fourth opinion :)</p>
    <p>Cheers</p>
    <p>Sam</p>
    <p><a class="freelinking external" href="http://www.istd.org.uk/education" rel="nofollow">http://www.istd.org.uk/education</a></p>
