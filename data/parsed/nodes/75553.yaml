      <p><cite>For example, if it is fine for author A to use a combining diacritical with an already accented character, and author B for using the base character plus two combining diacriticals, you have to provide for both. If it's not fine, you then have at last some excuse to tell the author to fix it, and more importantly, over time, authors will learn (not in my lifetime, of course).</cite></p>
      <p>Some fonts, like Gentium, have 'ccmp' feature to decompose accented characters then all mark positioning is done by 'mark' and 'mkmk' feature, so in addition to not worrying about all possible combinations, a sequence like amacron+tilde is equal to a+macron+tilde since the former will be decomposed to the later anyway.</p>
