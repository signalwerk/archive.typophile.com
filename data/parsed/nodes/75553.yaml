    html: |-
      <p><cite>.. since when do they dictate how accented characters are to be built; it seems to me that such decisions should lie with typographical professionals.</cite></p>
      <p>I don't think the authors dictate <em>how</em> the characters ought to be built. I'm in the same branch as Charles is (linguistics), and it's certainly not uncommon to have some text discussing a language containing multiple stacked accents -- his a macron tilde sure sounds familiar. The authors don't really <em>care</em> how the characters are built; typically, they use Word, which (it seems) allows stacking, or they use a mark/mkmk enabled font, or ... they use some self-made font! (And typically, they'd use Nick's hack of replacing any random character with theirs; even <em>more</em> typically, they forget to send that adjusted font together with their text...)</p>
      <p>Charles, I've had bad experiences with mark/mkmk, so I settled for this: I created a non-spacing macro/tilde and put it in the PUA. It being non-spacing means it'll almost never center nicely on every character, but a well-targeted manual kern takes care of that. For a few frequently occurring combo's I made 'special' versions -- i.e., the e, o, and a are nearly the same width in my base font, so I made one specially for these and have ccmp code replace the 'generic' macron/tilde with this one.</p>
      <p>I can't recall, off the top of my hat, if I set the proper Unicode for macron/tilde -- if there is one, I might have. If there isn't one, however, I should really have done the simple concatenation of the UC names. So far, I see no need to actually create glyphs from a_macron_tilde up to z_macron_tilde (and schwa_macron_tilde and opena_macron_tilde and more specialized phonetic characters than almost any type designer would care).</p>
