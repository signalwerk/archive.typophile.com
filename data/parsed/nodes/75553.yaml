    html: |-
      <p>Igor (if I may),</p>
      <p>Perhaps I can save you some time. The *named version* is not needed. Two possibilities: (1) you are importing text. In that case, the characters will be in Unicode. (2) Direct entry. Again, whatever you type on the keyboard, the characters in the file will be in Unicode. I suppose if you're using an old Type 1 font and non-OT layout program that wouldn't be true, but 99-44/100 of them wont support the needed accents anyway.</p>
      <p>Where *names* come in is with FontLab. For good or ill, FL substitution routines are written using character names. So, for example, the acute combining diacritical is U+0301. But in the Adobe Glyph list, is is named *acutecomb*. Unless you rename the character uni0301, "acutecomb," and only that, is what must be in your ccmp feature. There are about 5 or so combining diacriticals that have a name (other than uniXXXX) in the AGL.</p>
      <p>What I'm whining about is the lack of a standard for, what, correctly specifying characters without a codepoint and with multiple accents. Since an author has choices, unless you can limit those choices by saying "This is the right way," you have some obligation to provide for all those choices. </p>
      <p>For example, if it is fine for author A to use a combining diacritical with an already accented character, and author B for using the base character plus two combining diacriticals, you have to provide for both. If it's not fine, you then have at last some excuse to tell the author to fix it, and more importantly, over time, authors will learn (not in my lifetime, of course).</p>
      <p>Worse, for characters with accents above and below, which plane comes first is also a choice. That increases the number of ccmp substitution lines quite a bit.</p>
      <p>None of this is too bad if you're limiting yourself to European languages. But for people like Theunis in linguistics, or me who has to work with linguistics plus the Native American languages, Asian languages, etc., the number of lines in the ccmp feature goes up dramatically.</p>
      <p>What I was hoping for was that someone like John Hudson or Adam or Karsten etc. would post, indicating either any emerging conventions, or a correct procedure, if there actually is one.</p>
      <p>I do think you can insist on the inside-out ordering, as that is in Unicode.</p>
