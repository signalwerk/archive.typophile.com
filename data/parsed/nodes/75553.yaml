      <p>Thanks Charles! You surely saved a lot of time.</p>
      <p>Let me add two questions:</p>
      <p><strong>1</strong>. if you set ccmp substitutions in crescent order, the issue with author A/B wouldn't be avoided? I mean, if you already have the substitution a+macron=amacron in the code, a later amacron+tilde=amacrontilde in the same feature will not acts also as a+macron+tilde=amacrontilde? As long as I understand, the decrescent order in OT features is used exactly to avoid this kind of substitution, but in this case it's desired. If this is possible, it may save many lines of code.</p>
      <p><strong>2</strong>. there are the combining diacritics and also the spacing modifier ones (the five or so named accents you did mention). I believe the proper way to handle ccmp is always use combining diacritics, ignoring the spacing modifier ones. But for some keyboard layouts the input may use the spacing modifiers, so I`ll need both substitutions (a+acute and a+acutecomb). Is this true?</p>
      <p>Now I see that to build a font with support for all languages using Latin script is a kind of self trap. But now I'm engaged with this. Hope the <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">font</a> would be useful for professionals who work with linguistics.</p>
    html_clean: |-
      <p>Thanks Charles! You surely saved a lot of time.</p>
      <p>Let me add two questions:</p>
      <p><strong>1</strong>. if you set ccmp substitutions in crescent order, the issue with author A/B wouldn't be avoided? I mean, if you already have the substitution a+macron=amacron in the code, a later amacron+tilde=amacrontilde in the same feature will not acts also as a+macron+tilde=amacrontilde? As long as I understand, the decrescent order in OT features is used exactly to avoid this kind of substitution, but in this case it's desired. If this is possible, it may save many lines of code.</p>
      <p><strong>2</strong>. there are the combining diacritics and also the spacing modifier ones (the five or so named accents you did mention). I believe the proper way to handle ccmp is always use combining diacritics, ignoring the spacing modifier ones. But for some keyboard layouts the input may use the spacing modifiers, so I`ll need both substitutions (a+acute and a+acutecomb). Is this true?</p>
      <p>Now I see that to build a font with support for all languages using Latin script is a kind of self trap. But now I'm engaged with this. Hope the <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">font</a> would be useful for professionals who work with linguistics.</p>
