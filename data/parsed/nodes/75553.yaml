    html: <p>Not to disrespect you in any way, but aren't you overthinking this problem a bit? If the publisher wants a single exception character, why not simply create it in a seldom-used slot--such as florin or currency--and use FontLab's Get Component function to build it? And, no disrespect intended to authors either, but since when do they dictate how accented characters are to be built; it seems to me that such decisions should lie with typographical professionals.</p>
