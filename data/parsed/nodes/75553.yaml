      <p>"In an ideal world, all fonts would first deconstruct characters, then remap them."</p>
      <p>In an ideal world, normalization/decomposition would be done by OS or application, not by fonts. It is matter of Unicode (character level, text) rather than OpenType (glyph level, font). The line between them is pretty thin though.</p>
