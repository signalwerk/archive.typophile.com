      <p><cite>Right, I was only thinking of stacked marks above the base, so inside out should be more generalised.</cite></p>
      <p>It may just be I'm misundersanding you, but Unicode organized combining marks into 3 planes, one above, one below, and one through the middle. Within each plane, you work inside out. Which plane is specified first is not a Unicode requirement, though it apparently is with some applications. Since "those that care" tend to specify plane 1 (bottom) first, I go with them.</p>
      <p>Have I misunderstood what you're saying?</p>
      <p>* * *</p>
      <p>Nick, A lot of text editors -- I believe MS Word is one -- will render a character with combining diacriticals properly as long as the font has the components: the base character and the combining diacriticals. The positioning may lack a certain nicety, but it will be quite clear. I believe MS Word -- some text editors anyway -- will even go and get the needed characters from a system font if the specified font lacks them. Let's suppose that some people are reading primarily for content.</p>
      <p>Theunis -- With whatever small clout I may have, I try to steer customers away from fonts that forbid modification. So with permissible fonts, as each new character comes along, I add it to the font, properly named, and no Unicode index. The ccmp feature will sub the character just fine, so I just add it to the ccmp list.</p>
      <p>I suppose if there were only one or two instances of a character, we could do it in InDesign, but another rule is no private use characters unless the have a meaning for a special group. I have to assume everything we set will wind up as an ebook, or at least an XML file.</p>
