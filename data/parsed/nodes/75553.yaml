  - id: 436061
    user: 5094
    date: 2010-10-24T10:52:00
    date_raw: 24 Oct 2010 — 10:52am
    votes: null
    html: |-
      <p>Khaled -- thanks for that. Best I remember, older SIL fonts (Charis, maybe older versions of Gentium) used ccmp to combine all characters with base + accent to precomposed characters in Latin A, B, and Additional. I forget how they handled characters without a codepoint. In an ideal world, all fonts would first deconstruct characters, then remap them.</p>
      <p>This gets into expected workflows. One of the things so many font designers seem not to know are the workflows of people who use type. This even occurs with EULA's -- I've had several interesting discussions with people at Adobe, who seem unaware of typical production workflows in publishing. But that's a different issue.</p>
      <p>Consider: a manuscript is submitted by an author. It then goes to an editor. Next stop is the designer, and on to the typesetter. The result is "first proof." There will be a second proof, usually a third, sometimes more. The result is printed. At this point, the only file that is correct, that has been maintained through all the changes, is the final typeset file. Moreover, the printed book is no longer the end product of all this work. If there is an end product, it is that final (typesetting) file. Further uses will be made of that file, perhaps an ebook (perhaps even several forms of ebooks). Perhaps an html file intended to be read in a browser, perhaps a searchable xhtml file for research, etc. etc.</p>
      <p>Couple of points: In modern times, it is rare for the designer to even be aware of all the characters used in the text. Rarer still for s/he to check and see if the fonts selected have those characters. At some point, the compositor has to put everything together, resolving the decisions the editor made, and the decisions the designer made.</p>
      <p>Point two is that the typesetters decisions now become an issue for whoever is putting together the xhtml file for an ebook or archive/research purposes.</p>
      <p>That basically is the workflow. The opportunity to introduce error with characters -- either the wrong one, or the character dropping out, is uncomfortably high. While no single standard exists, the more we can standardize, the more we can both lessen the incidence of error and make life simpler for the people who have to resolve what remains.</p>
      <p>For font designers to assume they can resolve such things is at best naive.</p>
      <p>I like the notion that all composites are first broken into their components. But since not all fonts work that way, editors can't assume that. In fact, the vast majority of fonts don't even have the combining diacriticals. At the time the editor does his/her work, they don't know what font will be used -- not for the printed book, not for the ebooks, not for the browsers.</p>
      <p>As a jack-of-all trades (compositor), I don't know the Unicode standard as well as I should. I was hoping there was something in it, if not a requirement, at least a recommendation, that would address the original questions, and could become a basis for standardizing both editorial and OT feature practices.</p>
      <p>* * *</p>
      <p>@Igor -- I don't imagine you or anyone else is still reading this post -- I seem to have been caught into defending what it's about again -- but if so:</p>
      <p>The spacing modifiers have a different meaning. They should not be used to form accented characters. You cannot assume an author isn't using the acute, say, as a spacing letter, as does happen in linguistics. It is the old glyph/character distinction. </p>
      <p>I'd add that there are other traps here. For example, the raised comma may be the same glyph as the apostrophe, but it *is* a different character. A raised comma is one way to signal a glottal stop in some languages. If you use an apostrophe, then someone else who later uses the files and wants to change the way glottal stops are signaled has one hell of a job. If, on the other hand, you use the raised comma in the spacing modifiers, their task is far simpler.</p>
      <p>Practically, that there are so few fonts that cover spacing modifiers is an issue. Syntactically correct meaning is sacrificed to get some black stuff on the white stuff. The result is, just now, that even if you include it in your font, no editor will encode the text file that way. In time, maybe things will change.</p>
