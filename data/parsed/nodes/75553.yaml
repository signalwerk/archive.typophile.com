      <p>Charles, considering (1) the need to properly kern and position these multi-diacritical glyphs; (2) the possibility of different text inputs; and (3) the need to avoid unnecessary diacritical combinations, the solution I did adopt for my own font: </p>
      <p><strong>1</strong>. I did search for all accented letter used in the range of languages I focused.<br>
      <strong>2</strong>. I added all these glyphs as precomposed ones, even the non-coded.<br>
      <strong>3</strong>. I did not used mark and mkmk features.<br>
      <strong>4</strong>. I'm slowly adding all these glyphs to ccmp feature using bottom to top order (to diacritics above), top to bottom (to diacritics below), first top and then below (to diacritics in both positions).</p>
      <p>I guess one must include in ccmp feature the different ways to name a glyph –at least, the named (amacroncombtildecomb) and the Unicode method (uni006103040303). This task would make me crazy, but it seems to be needed.</p>
      <p>A good resource about these non-coded accented glyphs is Adobe Latin 5 table. <a class="freelinking external" href="http://typophile.com/node/74756" rel="nofollow">Here</a> you find more info about this.</p>
