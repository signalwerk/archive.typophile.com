      <p>@Nick: </p>
      <p>If the only task of a font is to put ink on paper, you might have a point -- except for that nonsense about leaving things to the "typographic professionals." But I prejudge. If by typographic professionals you mean the people who use type, I'll have more sympathy. Not what you meant, right?</p>
      <p>Text in the 21st century is not only about ink on paper. A "repurposed" text can't even assume a common font these days. </p>
      <p>As to authors, yeah, right. "I'm sorry Mr. (Stephen) King, we can't accept your latest manuscript, since your way of entering characters doesn't agree with our typographic professionals. You'd better find another publisher. Please return the $500,000 advance."</p>
      <p>@Kaled:</p>
      <p>As I read section 2.11 (Unicode 5.0), esp. fig 2.21 the order is inside out, not top down.</p>
      <p>See also 3.11, Canonical Ordering Behavior, particularly P2. Since they say [guideline], I suppose it is not a *requirement*. But sure as there are little green apples, somebody having to search a text for a word is going to appreciate a consistent ordering -- for Latin-based texts anyway.</p>
