    html: <p>I've no experience with Latin accents, but stacked vowel marks are common in Arabic and the order is always bottom to top (some fonts try to account for reversed order being the same but IMO this is wrong, and if one for some odd reason wants marks stacked backwards should be able to do that). In my fonts I usually build stacked marks using 'mkmk' feature so I don't have to foresee every possible combination.</p>
