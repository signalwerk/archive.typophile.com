    <p>I know nothing about engraving machine fonts, but I am curious to know whether the URW fonts supplied with Coreldraw X4 are technically faulty. Whosoever is familiar with engraving machine fonts may download the PDF file</p>
    <p><a href="http://www.sanskritweb.net/forgers/corel14.pdf" title="http://www.sanskritweb.net/forgers/corel14.pdf">http://www.sanskritweb.net/forgers/corel14.pdf</a></p>
    <p>and may zoom to 1000 percent and more a few typical letters which in my opinion are technically defective, e.g. on page 4 of font “G4L S14 Fette Din Mittel” these letters:</p>
    <p>6 (left downstroke at bowl intersection)<br>
    9 (right downstroke at bowl intersection)<br>
    ^ (top roof)<br>
    a (downstroke at bowl intersection)<br>
    b, d, g, h, m etc. (downstrokes at bowl intersections)</p>
    <p>etc. etc. etc.</p>
