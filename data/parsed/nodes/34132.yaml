      <p>&gt; <em>I also like seeing the old logo on the first slide.</em></p>
      <p>That's the cover of a binder that is lying around, which used to document all the in-house tools and processes. I thought it was cool, and so decided to take a picture of it for using in the cover slide. I'm glad you like it :^)</p>
      <p>&gt; <em>It kind of says, “Hey, we’ve been doing this for awhile.”</em></p>
      <p>Yep, Type at Adobe goes as far back as when the company debuted, which was about 25 years ago. And there are still people around from those early ages, like <a href="/wiki/David%20Lemon" class="freelinking" rel="nofollow">David Lemon</a> and <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach</a>, who have been working in the Type Department for more that 20 years each.</p>
      <p>BTW, <a href="/wiki/Thomas%20Phinney" class="freelinking" rel="nofollow">Thomas</a> is celebrating his 10th anniversary at Adobe. So please join me in a big round of applause. Congratulations Thomas, wish you stay 10 more year, at least!!</p>
