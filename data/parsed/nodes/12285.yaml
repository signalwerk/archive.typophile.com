      <p>here's the email i got from Macromedia:</p>
      <p>Dear Fontographer user,</p>
      <p>I am writing to inform you that Fontlab Ltd. has signed an agreement with Macromedia to become the exclusive distributor of the Fontographer product. This means that Fontlab will be assuming product support and sales for both the Macintosh and Windows versions of Fontographer effective as of May 9, 2005.</p>
      <p>Fontlab is a leading developer of digital typography solutions and has expressed a commitment to continue to sell and support the current versions of Fontographer, while it begins work on updates and improvements to the product. After a long search, we are very pleased that we have found such a strong partner in Fontlab and that Fontographer is now part of an entire family of products focused exclusively on the needs of the typographic community.</p>
      <p>The Fontlab site (<a href="http://www.fontlab.com" title="www.fontlab.com">www.fontlab.com</a>) will have information on Fontographer support and sales. If you wish to hear more about the future plans for Fontographer, or to request new features, interface improvements, or other product changes, the Fontlab team encourages you to contact them at <a href="mailto:fog@fontlab.com">fog@fontlab.com</a>.</p>
      <p>Sincerely,<br>
      David Mendels<br>
      Executive Vice President, Macromedia, Inc.</p>
