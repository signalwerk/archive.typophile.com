    <p>For some reason I can't post in the announcement of Pyrus' acquisition of Fontographer, so I'll do it here (oh, and one more thing, when's that automated password-sender-to-existing-members system going to be up and running?  I felt bad registering as a new member to do this).</p>
    <p>This is, of course, big news.</p>
    <p>So let me get this straight...<br>
    I'm not complaining, just curious...<br>
    Adobe acquires Macromedia; Adobe then sells Macromedia's Fontographer to Pyrus...<br>
    I think this is, ultimately, really great--if you keep Fog with its current tools and manner of performing.  It seems like a matter choice, and giving people a choice of performance style is only reasonable.</p>
    <p>I've never had the chance to use Fog--when are you going to make a demo available?</p>
