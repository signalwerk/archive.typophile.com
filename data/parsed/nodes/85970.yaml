    html: |-
      <p>I think this single subject matter is the one and only I feel worthwhile.</p>
      <p>That being - the Individual.</p>
      <p>When you have beaten down people in teaching positions schooling the anxious wannabes - mediocrity has won the day. There is no way in hell that at that young one's time of critical development their own sense of inner strength can be attained when being taught to comprise.</p>
      <p>And what falls along the wayside is the respect for other people's Individual creative acts.</p>
      <p>I was taught not to do what has already been done. If you look to a Master - seek what they sought, not do as they have done. Not because it is the intellectual property of someone else - but more importantly - because each of us has a unique contribution to give within our creative disciplines. It is there to be found and developed. </p>
      <p>Seriously, I don't want to talk like what's her name.</p>
      <p>Again, it's not about intellectual property - it's about being an Individual. It is the Individual who contributes something worthwhile. Not the imitator, the plagiarist, and certainly not the one who is paying homage. And when the Individual has been strengthened through proper schooling - there is no such thing as a "diminishing frontier" (cited from your linkage), because there simply is no such thing as a 'frontier' to begin with. </p>
      <p>There are no boundaries on creativity. Only the beaten generation talk in such terms as "diminishing boundaries". And on the note of 'style', this too comes from being aware, and having developed, your own language as an Individual. Which btw is part of an ever-on-going linage - graphic, or otherwise - because nobody stands alone and everyone "is part of the maine".</p>
      <p>So when someone condones, "imitation, influence, plagiarism, homage and coincidence...", they truly lessen us all by undermining the Individual. </p>
      <p>[/rant]</p>
