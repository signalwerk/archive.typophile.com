    <p>Hi everyone,</p>
    <p>I'd like to change the underline thickness in a compiled OT font automatically, since the AFDKO seems to have no keywords for this.<br>
    My tool of choice is fontTools.</p>
    <p>When decompiling the font to XML via ttx, this is setting that at least InDesign reads the value from:<br>
    <code><br>
    &lt;CFF&gt;<br>
      &lt;CFFFont name="Antithesis-Regular"&gt;<br>
        &lt;UnderlineThickness value="90"/&gt;<br>
    </code></p>
    <p>How to reach this setting via Python+fontTools?<br>
    I've come as far as this:<br>
    <code><br>
    ttf = TTFont(path)<br>
    ttf['CFF '].cff<br>
    </code></p>
    <p>Ant now what? I can't find out how to reach the said setting.<br>
    Thank you.</p>
