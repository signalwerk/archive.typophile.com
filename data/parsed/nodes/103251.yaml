      <p>Should anyone be interested, here are all the values I’d like to see changed in compiled fonts that are impossible to influence through makeOTF. I didn’t find that any application would ever care about the first four values, which is a shame. But hey, they’re there.<br>
      The last two lines overwrite this dreadful version string that the recent FDK creates.<br>
      Are there any more suggestions?</p>
      <p>Lines may be soft-wrapped.<br>
      <code><br>
      from fontTools.ttLib import TTFont<br>
      ttf = TTFont(ttpath)<br>
      ttf['post'].underlinePosition = int(instance.customParameters['underlinePosition'])<br>
      ttf['post'].underlineThickness = int(instance.customParameters['underlineThickness'])<br>
      ttf['OS/2'].yStrikeoutPosition = int(instance.customParameters['strikeoutPosition'])<br>
      ttf['OS/2'].yStrikeoutSize = int(instance.customParameters['strikeoutThickness'])<br>
      ttf['CFF '].cff.topDictIndex[0].UnderlineThickness = int(instance.customParameters['underlineThickness'])<br>
      ttf['name'].getName(5, 1, 0).string = "Version %s.%s" % (f.versionMajor, f.versionMinor)<br>
      ttf['name'].getName(5, 3, 1).string = "Version %s.%s" % (f.versionMajor, f.versionMinor)<br>
      </code></p>
