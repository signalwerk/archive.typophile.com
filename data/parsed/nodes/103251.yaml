    html: |-
      <p>This text from the <a href="http://www.microsoft.com/typography/OTSpec/post.htm" rel="nofollow">Microsoft spec of the post table</a> appears to answer my question</p>
      <blockquote><p>
      FWord	underlinePosition<br>
      This is the suggested distance of the top of the underline from the baseline (negative values indicate below baseline).<br>
      The PostScript definition of this FontInfo dictionary key (the y coordinate of the center of the stroke) is not used for historical reasons. The value of the PostScript key may be calculated by subtracting half the underlineThickness from the value of this field.
      </p></blockquote>
      <p>The value -100 is indeed ttf['post'].underlinePosition - ttf['post'].underlineThickness /2.0</p>
