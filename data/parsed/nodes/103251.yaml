    html: |-
      <blockquote><p>
      I didn’t find that any application would ever care about the first four values, which is a shame. &nbsp; [yanone]
      </p></blockquote>
      <p>The fact is that FontForge cares about those values but 'underlinePosition' is interpreted differently. Here is the correspondence </p>
      <pre>import fontforge
      f=fontforge.open(path)
      f.os2_strikeypos     % ttf['OS/2'].yStrikeoutPosition
      f.os2_strikeysize    % ttf['OS/2'].yStrikeoutSize
      f.uwidth             % ttf['post'].underlineThickness
      </pre><p>The additional parameter handled by FontForge and corresponding to [Uu]nderlinePosition (I did not look at the source, I just experimented with values), is</p>
      <pre>f.upos   % ttf['post'].underlinePosition + ttf['post'].underlineThickness/2
      </pre><p>in the cases I have tested (and the updates are correctly made with that interpretation). The interpretation of the Microsoft spec above may not, indeed, be crystal clear. The value of f.upos given by FontForge for ArnoPro-Regular.otf is neither -100 nor -75 but -50. (I am running the July 2012 version)</p>
