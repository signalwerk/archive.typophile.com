      <p>Michel: <em>Can you batch process with DTL OTMaster?</em><br>
      &nbsp;<br>
      Not really. OTM is basically a highly convenient tool for editing single fonts. The batch-stuff is in our production tools.<br>
      &nbsp;<br>
      At the coming ATypI conference in Amsterdam DTL/URW++ will release a new edition of DTL OTMaster. Also there will be a new OTM <em>Light</em> version. For € 49.95 this version will allow the editing of OpenType and TrueType  fonts, but the ‘import’/‘export’ (OT Layout features, Character Layout ﬁles, et cetera) and the glyph-editing functions will be only available in the <em>full</em> version.<br>
      &nbsp;<br>
      FEB</p>
