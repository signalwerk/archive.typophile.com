    html: |-
      <p>You must just have made a typo or inadvertently switched from one installation of python to another. The version of fonttools that comes with AFDKO 2.5 works just fine for me. With the following bash script made executable and in your path, which I'll call <code>chthickns</code> (for short)</p>
      <pre>-------
      #!/usr/bin/env AFDKOPython

      from fontTools.ttLib import TTFont
      import sys

      f=TTFont(sys.argv[1])
      d=f['CFF '].cff.topDictIndex[0]
      d.UnderlineThickness = int(sys.argv[2])
      f.save(sys.argv[3])
      --------
      </pre><p>the line command, after the % prompt,</p>
      <pre>% chthickns Myfont.otf 90 newfont.otf
      </pre><p>replaces UnderlineThickness of MyFont.otf by 90 and saves the result in newfont.otf. For <em>in situ</em> modification, cf <a href="http://typophile.com/node/102671" title="http://typophile.com/node/102671">http://typophile.com/node/102671</a> <em>mutatis mutandis</em>.</p>
