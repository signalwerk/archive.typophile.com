    votes: null
    html: "<p>Interesting request. 'Futuristic' and 'digital' seem to be other names for 'techno', which is not my favorite style, so when you said 'not too' in front of those I was intrigued. I would recommend looking in two places: <a href=\"http://www.psyops.com/html/specimens.html\" target=\"_blank\">Psy/Ops</a>, which has Reform, Reykjavik One &amp; Two, Transfer Sans &amp; Default Gothic. The other is <a href=\"http://www.veer.com/products/type/det/rs.asp\" target=\"_blank\">Device Fonts</a> (Rian Hughes), with September, Gravel, Quagmire, Range &amp; Register. <br> <br>Of course there are many other foundries with techno styles, but these two foundries come to mind as having some of the less stereotypical 'futuristic' looks, in my opinion. T-26, which also carries Device fonts, has one of the most varied Techno collections.</p>"
    html_clean: "<p>Interesting request. 'Futuristic' and 'digital' seem to be other names for 'techno', which is not my favorite style, so when you said 'not too' in front of those I was intrigued. I would recommend looking in two places: <a href=\"http://www.psyops.com/html/specimens.html\" target=\"_blank\" class=\"link-external\">Psy/Ops</a>, which has Reform, Reykjavik One &amp; Two, Transfer Sans &amp; Default Gothic. The other is <a href=\"http://www.veer.com/products/type/det/rs.asp\" target=\"_blank\" class=\"link-external\">Device Fonts</a> (Rian Hughes), with September, Gravel, Quagmire, Range &amp; Register. <br> <br>Of course there are many other foundries with techno styles, but these two foundries come to mind as having some of the less stereotypical 'futuristic' looks, in my opinion. T-26, which also carries Device fonts, has one of the most varied Techno collections.</p>"
