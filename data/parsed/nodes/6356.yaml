    html: "<p>From Norman Potter's <i>What is a designer</i> <br> <br>\"As Walter Gropius often explained, the modern movement was not some matter of dogma, fashion, or taste, but a profoundly wide-ranging attempt to encompass the nature of the twentieth-century experience and to meet its physical demands with a constructive response.\" (p. 36) <br> <br>Speaking of 'presentism', this is an interesting way to view a movement that's been sliced, diced, regurgitated and reinvented a million times, particularly by the Swiss-Modernist fetishism that hangs around some academic institutions in the US. There are many layers to examining modernist thought and work. And understanding some of the motives can lead to solutions and approaches that aren't set in Akzidenz Grotesk and bland as hell and don't seek to piggy-back on a pale echo of the modernist style. <br> <br>Tschichold was a very talented man, and he did what's being suggested in the <a href=\"http://www.typophile.com/forums/messages/30/48653.html?1095167946\">Breaking into the industry</a> thread: he was being bold. I know much less about Saville, but I imagine there's a theme that could be explored along those lines.</p>"
