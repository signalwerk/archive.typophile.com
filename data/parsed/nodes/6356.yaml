    html: "<p>It is a fun read� I've read it in both the original German and the English translation (the other way around, actually�). But, other than to offer further knowledge of history (always good), it is not relevant to today's designer. Many of the points in the book are offensive, and borderline fascist (as Tschichold himslef later reported), espectialy the idea that everyone should give up their scripts for the modern (i.e., German) sans serif! Imagine, one and a half billion Chinese should give up their writing system, because as he wrote, it = nationalism! Yet the sans serifs that he proported using (Akzidenz and the like) are full of cultural baggae themselves� Tschichold later became an amateur historian on chinese porcelians, which hints that he must have later taken the time to examine their culture. Just goes to show you that everyone can change for the better! <br> <br>Don't get me wrong, I enjoy looking at German Geometric Modernist art, and love its historical contribution� I've made two pilgrimages to Dessau and everything� but the work has a place: in the past, and in museums.</p>"
