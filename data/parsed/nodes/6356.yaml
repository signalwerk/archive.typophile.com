    votes: null
    html: <p>War and being pursecuted have a way of messing up your mind.  Maybe Tschichold was just longing for a gentler time.  <br>While some here seem to protest against modernism for being too dogmatic, I think it is funny how there are posts here on Typophile which are dogmatically anti modernist.   <br>All of these labels are just academic distinctions which we make for the convenience of discussion.  We should just take the entirety of Tschichold's work and enjoy it.  I wish he could have had the luxury of enjoying that difficult part of his life, perhaps he would have made an even different inroad into typography which we qould now have a new label for. <br> <br>ChrisL</p>
