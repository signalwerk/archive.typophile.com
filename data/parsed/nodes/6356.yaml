    html: <p>In Tschichold's 1967 revision of <i>Die Neue Typographie,</i> he appologizes for the overly fascist tone that he took when originally writing it. Germany during the 1920s was a maelstrom of political activities, ideologies, and false righteousness. Tschichold was just as adamant about the new typography as the NSDAP was about their socio-political issues. In 1933, when Tschichold himself became a victim of government imposed backlashes again the avant garde (suspected of communist sympathy), he got a taste of doctrinal rigidity first hand. <br> <br>Plus, while he was working in Britain (during the war), he had the chance to work with traditional subject matters, and I think he personally fell in love with the seeped-in tradition of Monotype typography that was popular among book-printers of the day there. Maybe it just felt safe. <br> <br>After the war, Max Bill (Dessau Bauhaus, then Zürich, then the HfG Ulm) accused Tschichold of apostasy for breaking with modernism, and Tschichold accused Bill of being too rigid for holding on so tightly. Paul Rand covers this nicely in one of his books.</p>
