  html: <p>Hi There <br> <br>We are working on a new website for Union Fonts, which we expect to go live in early March. We feel that it is important to get as many opinions about what we are doing as possible. So I hope some of you can spare the time to advise me on a few questions... <br> <br>Do you think that a flash based Typesampler is an important way to test a font before you buy? <br> <br>We are also offering desigenrs who sell through us 50% of the sale price, does this seem reasonable compared to other type site you deal with? <br> <br>We are also going to give the designer of the top selling font in 2004 (on Union) �1000, that roughly $2000 is that something which could make us a more appealing? <br> <br>Thanks for your help! <br> <br>DALE</p>
  html_clean: <p>Hi There <br> <br>We are working on a new website for Union Fonts, which we expect to go live in early March. We feel that it is important to get as many opinions about what we are doing as possible. So I hope some of you can spare the time to advise me on a few questions... <br> <br>Do you think that a flash based Typesampler is an important way to test a font before you buy? <br> <br>We are also offering desigenrs who sell through us 50% of the sale price, does this seem reasonable compared to other type site you deal with? <br> <br>We are also going to give the designer of the top selling font in 2004 (on Union) �1000, that roughly $2000 is that something which could make us a more appealing? <br> <br>Thanks for your help! <br> <br>DALE</p>
