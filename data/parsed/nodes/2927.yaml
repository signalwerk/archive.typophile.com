    html: "<p>Dynamic setting is very appealing, but also raises some complexities, like whether you should cripple the rendering, since some people will just set&amp;grab what they need, without buying the font. My own feeling is that -unless it's a bitmap font- you should give away high-quality renderings, and hope it creates a dependency (= sales) in users. Anything else is too protectionist in this hyper-competitive type design scene. <br> <br>Yes, 50% is good - if you take on some promotional costs. <br> <br>Top-seller prize: be careful, that might cause people to make <i>fewer</i> fonts. <br> <br>hhp <br></p>"
