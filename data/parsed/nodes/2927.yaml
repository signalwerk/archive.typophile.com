    html: <p>50% royalties seem reasonable.  For that number a designer such as myself would want lots of marketing going out, especially printed. <br> <br>Lay out all of the type showings the same way, like font bureau. If you want to show the font in use, design posters or other material to show them off on the site. Or even collect samples of the type in use and put those up there. <br> <br>PDF showings are a nice feature to have. <br> <br>Flash typesetters are cool, but I don't use them much. <br> <br>Definitely go for quality fonts over quantity. A good selection of average fonts will bring some people to the site. Unique designs will draw more traffic and sell better in the long run. <br> <br>The bonus incentive is very appealing.  I'm considering submitting fonts to the Bitstream New Font Collection, they give you the option for $2000 immediately or a royalty plan. That's a nice way to make a quick 2 Gs.</p>
