    html: <p><i>&gt;Font Bureau, at $40 per weight, is nearly double the $21 of many at MyFonts.</i> <br> <br>Yes, Font Bureau fonts are a little more costly than the average these days; I personally believe you get appropriate value for the additional cost. <br> <br>I would like to point out that the FB pricing structure is volume-based. The $40 price so often cited is only if you buy only one or two styles at a time. When you buy three styles, the per font price goes down to $35. If you purchase six or more, the price drops further to $30 each. These are the most significant break points; there are others as you increase the volume further.  <br> <br>This is, unfortunately, not immediately apparent from their website. To see the structure spelled out more clearly, go to <a href="http://www.fontbureau.com" target="_blank"> www.fontbureau.com</a> and click on the little Help icon in the lower right hand corner of the front page. From the new Help window, select the topic "Font Pricing" from the list on the right. <br> <br>So, when it comes to buying a family of FB fonts (which is really the better way to go about it) the price quickly comes down to a more reasonable territory -- never cheap, I admit, but reasonable. <br> <br>Note that these volumes apply regardless of whether the fonts are in the same family or not -- a unique circumstance, as far as I know. So you can buy just a handful of styles of Miller, for instance, and maybe a few weights of Interstate, and throw in Mantinia, and put together your own package for $30 each. That's not too bad, when you think about it. (Well, when *I* think about it, anyway.) <br> <br>Just felt compelled to clarify. <br> <br>-- Kent. <br></p>
