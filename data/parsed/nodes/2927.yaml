    html: "<p><i>Yes, 50% is good - if you take on some promotional costs.</i> <br> <br>I would expect a <i>lot</i> of active marketing from anyone taking 50%, and not just marketing of their own services: marketing of individual typefaces and foundries. In 'this hyper-competitive type design scene', the days when vendors could collect a substantial percentage just for reselling a font is over. Frankly, I wouldn't be inclined to let any reseller take more than 40%, and I would want to see copies of every marketing piece they produced to make sure that they were doing a good job and not just using my typeface to pad their library. There are a lot of font resellers now, and the Internet has largely levelled the playing field: foundries and individual designers can afford to be picky and demand that the resellers be competetive.</p>"
