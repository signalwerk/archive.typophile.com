    html: <p>The disadvantage of running your own e-commerce site is running your own e-commerce site. <br> <br>The advatages are that you only need to sell half as much if  50% is your discount level. Also you get paid quicker, know how much you are making as you make it. You get to know your clientel. And they are your clientel. Also you have a chance to actually sell something rather than let someone merely order from the order desk of a large impersonal vendor. <br> <br>Also I have found the customer can often add valuable input to your products, market changes etc. <br> <br>Plus you can build brand name.  With such you are in a better negotiating position when dealing with vendors. <br> <br>But before proceeding read my first line.</p>
