    html: "<p><i>... a more prestigious outlet than just their own little foundry.</i> <br> <br>As someone who once licensed fonts for sale by one of the most prestigious names in 100+ years of type, and who was soon counting down the days -- along with numerous colleagues -- until the contract expired and I could stop these inept parasites devaluing my work, I have long since realised that the 'little foundries' have a much higher prestige among serious customers than any reseller. You want prestige? Buy your fonts directly from the people who make them. What resellers like MyFonts, Union, etc. offer is not prestige but convenience. <br> <br>I greatly admire the way Jeremy Tankard handles resellers: he offers them a small percentage (usually less than 20%) and he demands results. If they don't adequately market his fonts, he reduces the percentage. If they don't sell enough, he cancels the contract. How can he do this? Because his 'little foundry' has established a prestigious reputation through the quality of his work and very active marketing.</p>"
