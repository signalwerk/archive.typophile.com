    html: "<p>From the perspective of a purchaser/ user, rather than creator, of fonts, I have a few general 'shopping experience' preferences and pet peeves: <br> <br>- Printable samples (PDFs): The impact of printed samples, showing the font actually in use (along with blown up, with ligatures, etc.) is much greater for convincing the people who provide the $$ (client and/or me). Like Randy, I find this is particularly true of text faces. <br> <br>- Flash preview sampler: For logotypes, I really like having this kind of tool available. It definitely helps my purchasing decisions. And while I understand that some people screenshot the type without paying, making it harder to do that by using weird patterns (as Hoefler does), or not offering the feature at all isn't going to get them to buy your fonts anyway. Plus, you can zoom in with Flash and see the juicy little details. <br> <br>- On-screen samples: Images of type in use, even if it's short strings of words, like FB does. I find these much more telling than \"Meta Book Roman\" set in Meta Book Roman, or a character chart (not that I don't want to see one of those as well). For quick browsing, (like you have on your site) I don't mind, but I like having them available to look more thoroughly. <br> <br>- Please don't hide the price: I don't mean put it on the first page per se, but don't make it tedious to access. I understand that there are different prices for different situations, but a single-user license price gives a good sense of price scale. <br> <br>I've been to the current Union Fonts site, so I know that a lot of this isn't news to you, and that some of these features are already in place. Consider this my plea on their behalf. I look forward to seeing what you guys do.</p>"
    html_clean: "<p>From the perspective of a purchaser/ user, rather than creator, of fonts, I have a few general 'shopping experience' preferences and pet peeves: <br> <br>- Printable samples (PDFs): The impact of printed samples, showing the font actually in use (along with blown up, with ligatures, etc.) is much greater for convincing the people who provide the $$ (client and/or me). Like Randy, I find this is particularly true of text faces. <br> <br>- Flash preview sampler: For logotypes, I really like having this kind of tool available. It definitely helps my purchasing decisions. And while I understand that some people screenshot the type without paying, making it harder to do that by using weird patterns (as Hoefler does), or not offering the feature at all isn't going to get them to buy your fonts anyway. Plus, you can zoom in with Flash and see the juicy little details. <br> <br>- On-screen samples: Images of type in use, even if it's short strings of words, like FB does. I find these much more telling than \"Meta Book Roman\" set in Meta Book Roman, or a character chart (not that I don't want to see one of those as well). For quick browsing, (like you have on your site) I don't mind, but I like having them available to look more thoroughly. <br> <br>- Please don't hide the price: I don't mean put it on the first page per se, but don't make it tedious to access. I understand that there are different prices for different situations, but a single-user license price gives a good sense of price scale. <br> <br>I've been to the current Union Fonts site, so I know that a lot of this isn't news to you, and that some of these features are already in place. Consider this my plea on their behalf. I look forward to seeing what you guys do.</p>"
