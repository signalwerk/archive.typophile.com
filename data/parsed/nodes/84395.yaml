  html: |-
    <p>Hello, I'm looking for the font in this image: <a href="http://img96.imageshack.us/img96/2565/038dhj.jpg" title="http://img96.imageshack.us/img96/2565/038dhj.jpg">http://img96.imageshack.us/img96/2565/038dhj.jpg</a> in which the text "WATER FUEL CELL" and "WATER POWERED CAR" is written. It is a Copperplate-like font, but without the serifs.</p>
    <p>Things that could help identify the correct font:<br>
    - The right stroke of the W and the left stroke of the A are parrallel.<br>
    - The middle stroke of the E is clearly shorter than the top and bottom one.<br>
    - The horizontal stroke of the A is rather low.<br>
    - The letters are quite wide, just like the Copperplate font.<br>
    I'd really like to see these three things in the font, since they are so distinctive.</p>
    <p>I tried the Sans-Copperplate Gothic font, but it's too narrow and the corners of the letters look "damaged". If there would be a bold version of this font with sharp corners, that would be the perfect one. Any ideas?</p>
