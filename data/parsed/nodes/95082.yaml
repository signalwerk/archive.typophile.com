    html: |-
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/remington-weather/weather/" rel="nofollow">Remington Weather</a> looks like it's  based on the same Remington typewriter; although it's not the same font. </p>
      <p>Hmm This one also looks like it, but on the other extreme of dirty typewriter: <a class="freelinking external" href="http://www.dafont.com/my-old-remington.font" rel="nofollow">My Old Remington, by John Holmdahl</a></p>
      <p>Still looking ...  <a class="freelinking external" href="http://www.fonthaus.com/fonts/vintagetype/Typewriter/VT10043/" rel="nofollow">Vintage Type's  VT Typewriter  Remington Portable</a>  (Susan Townsend) - a different level of 'used'</p>
      <p>Also see Inspire Graphics Remington Portable and Remington Streamline. Both by Lettering Delights (a scrapbooking co.). Some of their fonts may have been discontinued but widely available - need to go to their site and also search for them.</p>
      <p>There may be more.</p>
