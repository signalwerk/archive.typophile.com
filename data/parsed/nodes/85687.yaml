      <p>Something squarish: Hermann Zapf’s <a class="freelinking external" href="http://www.linotype.com/1222/melior-family.html" rel="nofollow">Melior</a> or Curus Highsmith’s <a class="freelinking external" href="http://www.fontbureau.com/fonts/IbisText/" rel="nofollow">Ibis</a>.</p>
      <p>Something top heavy (see the S in Ostrich): Sindre Bremnes’ <a class="freelinking external" href="http://typophile.com/node/81129" rel="nofollow">Satyr</a> or David Jonathan Ross’ <a class="freelinking external" href="http://www.fontbureau.com/fonts/Trilby/" rel="nofollow">Trilby</a>.</p>
