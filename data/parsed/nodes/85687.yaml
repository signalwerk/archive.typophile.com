  html: <p>I'm using Ostrich Sans and Ostrich Sans Black ( <a class="freelinking external" href="http://www.theleagueofmoveabletype.com/fonts/18-ostrich-sans" rel="nofollow">http://www.theleagueofmoveabletype.com/fonts/18-ostrich-sans</a> ) for headlines / titles and I'm looking for a body text font that would be a nice complement. Any ideas? I'm having a hard time finding a serif font that seems to go well with it and I'm almost tempted to use another sans-serif font, but i know that's generally not advisable. Any suggestions would be appreciated.</p>
  html_clean: <p>I'm using Ostrich Sans and Ostrich Sans Black ( <a class="freelinking external link-external" href="http://www.theleagueofmoveabletype.com/fonts/18-ostrich-sans" rel="nofollow">http://www.theleagueofmoveabletype.com/fonts/18-ostrich-sans</a> ) for headlines / titles and I'm looking for a body text font that would be a nice complement. Any ideas? I'm having a hard time finding a serif font that seems to go well with it and I'm almost tempted to use another sans-serif font, but i know that's generally not advisable. Any suggestions would be appreciated.</p>
