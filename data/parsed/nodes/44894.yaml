    html: <p>May be simply a matter of taste, this biz with the fi liature, but—honest to God—I'd vote for not using ligatures to escape the f in the liggie. Which makes me wonder that, since ligatures are kind of expected, how likely are you to avoid them when you find they're ugly? Do you tend to ignore your distaste and go with them because they're the convention now?</p>
