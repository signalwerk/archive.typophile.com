      <p>With notes, where they fall will always be a function of their editorial purpose and generally driven by the author. The challenge with several notes clumped together, or a long note, is to decide how to array them with the text. You have to try to balance the amount of note on the page with the amount of text. You want to avoid running a string of notes over a spread (or across a turn!) if that takes subsequent notes too far from their reference. But you also don't want to end up with a single page that has three lines of text and the rest notes, for example.</p>
      <p>Sometimes you can even find yourself in the impossible situation where a note reference falls at such a point that keeping the whole note on the page actually pushes the reference to the next spread; but then pulling the reference back to the page means you have no room for the note. Things like that. In such a case, you go back to try to find a spread or two earlier in the chapter to run short in order to push the note reference, or run short to pull back enough room. But that can lead to other problems.</p>
      <p>I'm sure Charles E. has encountered his share of tricky or cumbersome footnote situations. Maybe he'll stop by and offer his insights.</p>
      <p>-- K.</p>
