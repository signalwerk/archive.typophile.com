      <p>It looks to me like this book is set in Trump Mediaeval. I actually agree that the f-ligatures in Trump Mediaeval are in fact a bit overbearing and can appear out of keeping with the rest of the face. Their presence in the font is curious to me, since it sets just fine without the ligatures; and in fact, this is one of those faces I prefer to use without them. (Aldus is another that gets along fine without ligatures.) Since f-ligatures are primarily a solution to prevent crashing forms, the use of them in situations where there is no crashing to begin with is debatable. </p>
      <p>Regarding extensive footnotes: One question would be whether the kind of thing shown occurs regularly or not. If, in general, the notes are modest, then treating them as footnotes is a reasonable proposition; and then if there are occasional situations where several stack up in close proximity or there are a few that are overly long, sometimes this sort of thing is unavoidable. It's certainly difficult to solve in design if editorial insists that they need to be as they are.</p>
      <p>If this situation is more representative of the norm, then one could argue that they might have served better as endnotes.</p>
      <p>The subject of how to handle scholarly notes -- whether they should be footnotes or endnotes, whether the noted material is germane or not, whether content belongs in-line or in a note -- all of this is quite a bit of fodder for the editorial folks, too, and not just a consternation for designers. This is one of those overlap areas between typography and editorial. In the end, the design must do the best it can to serve the material.</p>
      <p>-- K.</p>
