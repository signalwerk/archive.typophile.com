    <p>Hello typhophiles!</p>
    <p>This is my first post in this forum so I'll go ahead with a quick presentation.<br>
    I'm a graphic design graduate. I'm cultivating my obsession with typography and I guess I've found here the best place to worsen my compulsion.</p>
    <p>I've been lurking for a while and I found this site an indispensable (and beautiful) resource.</p>
    <p>Asking mercy for my bad English and type terminology I'll go ahead with my first rant:</p>
    <p>I have been reading "Musicophilia" by Oliver Sacks for 5 weeks, I think it's  interesting and easy to follow book but I still stop reading when my eyes meet ligatures in the text particularly the "fi" glyph. Also footnotes are often spreading into multiple pages breaking my flow of thoughts.</p>
    <p>Here are some photos explaining what I'm talking about.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/cover_6402.jpg"></div><br>
    cover designed by Chip Kidd <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fligatures_5164.jpg"></div><p></p>
    <p>example of the "fi" glyphs</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/notes_5565.jpg"></div><br>
    footnotes<p></p>
    <p>What do you think?</p>
