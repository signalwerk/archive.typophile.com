      <p>Ah, footnotes. They are one of the special joys of book design &amp; composition. I mean that; I really enjoy the challenges they pose.</p>
      <p>There’s a chain of responsibility with footnotes that starts with the writer and ends with the compositor. The further you get from the writer, the less chance you have of being able to influence how footnotes are used and how they affect a reader’s use of a book.</p>
      <p>The first line of defense against poor notation systems should be at the editorial level. It’d be interesting to find why the acquiring editor and the ms editor let Oliver Sacks get away with this multitude of footnotes. Maybe Sacks has enough clout that he can get away with it. Maybe he is messing around with his readers. </p>
      <p>After an editor has had his or her way with a manuscript, next in line is the designer. An in-house designer may be able to influence the nature of notes used in a book. I can do this, for I work in a small house and I follow a book from early discussions through composition.* Designers at large houses may not have that chance. A freelance designer has even less chance to influence how notes are to be used, unless the designer has very close relations with an editor or production manager.</p>
      <p>By the time a book gets to the compositor there’s not much else to be done except to make the thing look as good as possible, with a few roadblocks to a reader’s trip through the text. Here it would indeed be good have charles_e’s comments, and to hear if he is able to intervene when he spies noting schemes that look bad. Again, few compositors other than those with very close ties at the publisher will be able to have any influence.</p>
      <p>powers</p>
      <p>* We recently took in a manuscript with an enormous amount of notes, at 4 levels. There were citation notes, which would ordinarily go at the back of the book (endnotes). There were two levels of expository notes, one level with greater immediate importance to the author’s method of writing history, and one lesser level. I suggested that we use a 7” x 10” page instead of the 6” x 9” that would be more usual for this sort of book. The extra inch was used to place as shoulder notes those comments the author deemed most immediate for readers. These are called with the usual sorts: * † ‡ §, and are set in Franklin Gothic Book Condensed (the text face is Clifford). Citation notes and “second string” expository notes are called with superior figs and placed as endnotes. There is another level of shoulder notes, short biographies; these had no calls, but the persons’ names were set in Franklin Gothic Condensed Bold. My decision to use shoulder notes made more work for me, but it makes for a visually dense and interesting page (I think). The extra inch was also helpful in a chapter that consisted almost entirely of photos; it let me run them that much bigger.</p>
