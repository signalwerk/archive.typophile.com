    html: <p>The ligature problem may be related to your age. Ligatures were much more common when type was metal. Younger readers are probably less accustomed to them due to digital type and typesetters. As the quality of digital type increases, I'm hoping we can bring back ligatures so they aren't a distraction, but part of the natural text flow.</p>
