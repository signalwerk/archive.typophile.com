      <p>Interesting. Typekit has a great reputation, from what I heard.</p>
      <p>I also found Genath, which is beautiful and offers Display and body text options. It's obviously more condensed but I really like it. The font is available on <a href="http://www.webink.com" title="http://www.webink.com">http://www.webink.com</a>. Webink don't offer a preview render, they only suggest a minimum size. Have you tried them?  </p>
      <p>I am still looking for a pretty neutral/geometrical font complement to use at approx 15px., and only uppercase. I found Avenir on MyFonts.com (I rather use Typekit or Webink) and Proxima Nova on Typekit (However I would prefer a font with no contrast at all...). If anyone has a good imput on this I'd be very grateful.</p>
