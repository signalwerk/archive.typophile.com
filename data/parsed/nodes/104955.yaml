      <p>You can get a web license for ITC Garamond here: <a href="http://www.myfonts.com/fonts/itc/garamond/" title="http://www.myfonts.com/fonts/itc/garamond/">http://www.myfonts.com/fonts/itc/garamond/</a> Disclaimer: MyFonts webfonts are usually shitty auto-conversions of print fonts. </p>
      <p>Depending on the context, it might be wise to not let the logo dictate the rest. A quick suggestion for a more versatile alternative: <a class="freelinking external" href="http://www.mvbfonts.com/mvb_verdigris_pro/" rel="nofollow">MVB Verdigris</a>. It has a relativly “silent” text variant, and a display variant with higher contrast and taller x-height. </p>
      <p>As for a sans serif companion: What roles should the different typefaces fill? Headlines, text? Serif and sans paired at text sizes?</p>
