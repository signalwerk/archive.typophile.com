    html: |-
      <p>Thanks for the advice. For web fonts, I am more familiar with Typekit, which allows to visualize instantly the render of the font on different browsers/systems. Is there a difference between typekit and fonts.com in term of web conversion?</p>
      <p>For the Sans serif companion, here's what I am thinking about:<br>
      Display Titles: ITC Garamond<br>
      Subtitles: sans-serif<br>
      body text:  ITC Garamond and I need an alternative for web texts. I currently use Adobe Garamond pro from Typekit.</p>
      <p>I will give some trials replacing ITC Garamond for another alternative, MVB Verdigris is effectively pretty close (I also looked at Plantin), but both are more "font for book" rather than "Display fashion-ish fonts", which is what I need. So I might maybe end up using ITC Garamond as the body text/secondary typeface and the sans-serif for Headlines.<br>
      Any thoughts about a sans-serif?<br>
      Thank you!</p>
