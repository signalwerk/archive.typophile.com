  html: |-
    <p>I am working with ITC Garamond (currently imposed by the existing material and especially the logo). I first tried to find alternatives that could be a close match to ITC Garamond (and could work well in the field of fashion....) but from all what I have seen (Sabon etc), at this point I decided to stick to ITC Garamond. </p>
    <p>I am now exploring a secondary typeface, a modern grotesque that could work well with ITC Garamond but breaks a little bit with its old-style mood. I was thinking about Avenir or Gill. Any thoughts on this? </p>
    <p>I also need a web font that reflects ITC Garamond, or at least not conflict with it, but for body texts. I am currently trying Adobe Garamond pro but I'm not sure this is the best match. </p>
    <p>Thanks in advance!</p>
