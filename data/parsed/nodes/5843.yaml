  html: <p>I need to know what font is used (or derived or the closest approximation) in the Milky Way candy bar logo. <br> <br>I have an assignment where I have to design a font from this logo.  To my sensibilities, there some bad design in the letterforms- the "a", for example, or the fact that some letters are curved upwards and others are not.  Any help is appreciated. <br> <br>Thanks.<img src="http://www.typophile.com/forums/messages/83/41712.jpg" alt="Milky Way wrapper"></p>
