    html: <p>It's a little-known fact that in the arctic and antarctic latitudes in their respective summers, the Milky Way Midnight bar is actually made with white chocolate, owing to the midnight sun. Also, the nougat swirls to the left in the southern hemisphere, whereas it swirls to the right in the northern, but that's a different force of nature altogether.</p>
