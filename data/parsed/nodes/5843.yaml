    html: <p>I guess it wouldn't necessarily be considered cheating since I was supplied with a font (Diamanti Condensed) by the art director to use as a basis/inspiration.  I believe the logo was designed 40+ years ago and appears to be a custom design, otherwise, I think a font would have been used or supplied by the company with no need for a newly created font.  But, as per your suggestion, I've already been sketching in pencil and in Illustrator possible ideas for characters and I'll probably post the results in the Critique section for feedback.</p>
