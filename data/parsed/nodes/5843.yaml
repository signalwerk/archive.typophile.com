    html: <p>It's been fun with all this kidding around, but the one thing they try to keep is enough continuity to maintain brand recognition. Patricia's link early in this thread showed that. The green lettering has been around a long time, even if the shape of the letters has changed. So has the use of chocolate and nougat (sortof) colors, behind those letters.  You see those things and you don't really need to see the lettering. You already know it's Milky Way. That kind of recognition is priceless in a competitive market. <br> <br>OK, now I have to go back and think about what Chesh said about the Midnight Sun and the Coriolis effect. Huh? ;-) <br></p>
