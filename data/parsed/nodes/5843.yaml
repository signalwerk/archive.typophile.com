    html: <p>As someone much older than 40, I can say that I don't think that Milky Way logo is that old. My recollection is that they used to have a script not that many years ago. It was the same color, but it wasn't that lettering (I think). <br> <br>The current lettering is almost surely a custom design, but I agree with Yves. If your instructor gave you something to use, then that should be all the 'help' you'll need. <br> <br>James, you're trying to learn design, not copying, right? And it doesn't matter if you disapprove of the letterforms, since your assignment is to design something based on it. Think of it as a client who loves this lettering and wants to expand the hand-drawn logo into a typeface for other ad copy, not someone asking you to design something you like.</p>
