    date_raw: 11 Nov 2001 — 3:09pm
    votes: null
    html: "<p> Hi all, <br>I am a newcomer for the forum and I was thinking to start a thread like this before I found this one. I LOVE OSX and I am using it from public beta. This OS is great, has something (speed, some rough edges...) to be improved, but it is great. The problem is that all the \"big guys\" doesn't like Apple too much. The applications on X are few and you cannot use it for your everiday work. Adobe, Quark and Macromedia are slow and dubious about supporting the new OS. Fontographer probably will never be ported as I read (between lines) on the macromedia forum. I think that Type designer community should start an open project with donation to self build a new font software for OSX, wich has a lot of power and beauty to give to a software like this one. I hope to have feedbacks from all of you. <br>Luke <br> <br>PS: sorry for my bad english </p>"
