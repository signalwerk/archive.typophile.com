    html: <p> Probably the most important thing to know about MacOS X and fonts is the ludicrous number of places that they can live - there isn't a single unified Font folder as there is in MacOS 9. Rather, they can live in one of about 5 different folders (as I recall). Also, Fonts installed under MacOS X are not automatically available to applications that are running under Classic. <br> <br>I'd advise on getting a copy of Suitcase which will help with arranging big collections. Plus it offers a bridge between font collections under X and Classic modes. <br> <br>Incidentally, I've heard of certain problems relating to kerning (lost kerning pairs) and type rendering over certain type sizes - might be worth Googling it. <br> <br>As for the font library, I dont think you will have a problem. X handles all modern formats for Mac (TT, OT, PS T1) and even PC format TT. <br> <br>Hope this is of some help! I've a few books on X in my bedroom somewhere, if you want, I can check out which ones discuss type matters and give you a recommendation. <br> <br>David (Running X since July 2001) <br>Currently running MacOS X 10.1.4 </p>
