    date_raw: 23 Apr 2002 — 5:08pm
    votes: null
    html: <p> I run OSX 10.3 and not being too savvy with operating systems I have found the change from 9.2 a bit confusing at times. However, the performance increase has made it well worth the upgrade as I run dual processor 533 G4/120 gig HD. Without OSX the second processor was practically useless. The OSX is a bit more stable as well (but still crashes occasionally as I drive it hard and long hours crunching 300 meg files all the time). I am guessing the real advantage is with Photoshop 7.0. I will be getting this within the next couple of weeks and I will report back if there is substancial performance increase. <br>I must say as far as type is concerned there is a few things i don't care for. You will need Extensis Suitcase, which will run fine on Freehand 10. I use FH10 as wellas Fh 5.5 (5.5 has less features and runs faster ) with FH 5.5 Extensis does simply not work, by that I mean it will not render screen fonts so it is hard to see what you are doing untill you convert to paths. I am guessing the tthat I could use ATM font manager but I am a bit scared of running 2 font managers as I think this would come with problems. </p>
