    html: <p> In regards to ATM, i believe that Apple will supply the same functionality ATM in the next major release (not x.1, perhaps x.?). The Font Panel is already halfway there in terms of organization, and Apple has very good Font engineers. Still, my office will be buying Suitcase X for now. <br> <br>What is more disconcerting is the lack of support from font creation software for OS X. We're likely to never see an update of any sort to Fontographer, and it runs very oddly in Classic, although it functions. And the DTL haven't even considered the option of making a version of the new FontMaster package for Mac OS X. </p>
