    date_raw: 13 Nov 2001 — 1:11am
    votes: null
    html: "<p> To Joe: <br>I am running 10.1 on a G4 400 with 2GB of RAM (that OSX uses in full, OS9 doesn't). It is definitely usable but not a speed demon. I also tried illustrator 10, a thing of a beauty but not a speed demon. Someone should shake Quark but, dunno how. Aniway InDesign (wich I prefer over XPress) is coming on X (with its version 2.0). I agree with you that it's a matter of time, but I think Apple has no lots of time. They need OSX to catch up and to do so they need apps. Running apps in Classic mode is not very nice, so my bucks goes only to ported products, I LOVE that \"new\" platform. <br>To Christian: <br>I dunno how to start the thing, but I am ready to donate too. We should probably start a website to promote the thing and see if any developer will get on board. This website is something related to Hoefler Type Foundry, could be a good to have the masters as testimonials. I have read on Pyrus website that they are available to developers to share knowledge at reasonable fees. My question is, why aren't they doing the OSX version? Probably someone will answer. I really think OSX will be a joy to work with for type designers. <br>Cheers, <br>Luke </p>"
