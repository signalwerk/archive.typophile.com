      <p><em> but I arranged them according to the guidelins in Designing Type(karen cheng).. in usage though… I think they are optically correct. thanks for the feedback</em> </p>
      <p>the criticism by glyphobet are totally legitimate. Those "guidelines" by Karen Cheng aren't rules, they are just observations. But those observations apply to typefaces for text usage. Look at some display faces with similar horizontal stroke positions. In most display typefaces the strokes are exactly or almost at the same height</p>
      <p>for example:<br>
      <a href="http://www.myfonts.com/fonts/linotype/industria/" title="http://www.myfonts.com/fonts/linotype/industria/">http://www.myfonts.com/fonts/linotype/industria/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/itc-anna/" title="http://www.myfonts.com/fonts/linotype/itc-anna/">http://www.myfonts.com/fonts/linotype/itc-anna/</a><br>
      <a href="http://www.myfonts.com/fonts/fontbureau/bodega-sans/" title="http://www.myfonts.com/fonts/fontbureau/bodega-sans/">http://www.myfonts.com/fonts/fontbureau/bodega-sans/</a><br>
      <a href="http://www.myfonts.com/fonts/marksimonson/mostra/" title="http://www.myfonts.com/fonts/marksimonson/mostra/">http://www.myfonts.com/fonts/marksimonson/mostra/</a></p>
      <p>and when you praise the observations by Karen Cheng as guidelines, why is your A backwards, and why does your O look so eggy!??!</p>
      <p>best regards: Steven</p>
