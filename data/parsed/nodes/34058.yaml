    <p>Hello All,</p>
    <p>This is my second typeface to design, and I am hoping for some feedback.  My inspiration was the cigar branding coming out of the Spanish Carribean in the the late 1800's and early 1900's.  Shown are all my fancy letters.. for the letters with large swashes I am creating "standard" letterforms so any swash interference can be resolved. </p><div class="imageWrap"><img src="http://typophile.com/files/hispaniola_3689.gif"></div><p></p>
