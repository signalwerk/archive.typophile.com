    html: |-
      <p>It’s a gorgeous design. I really hope you do some ligatures that take advantage of the visual grammar you created with the swashes and open counters on letters that are usually closed. </p>
      <p>My nitpicks follow:</p>
      <p>- The narrowness of <strong>S</strong> draws attention to itself and away from words.<br>
      - Where the upper and lower lobes of <strong>B</strong> connect there’s either a flaw in the drawing or just and optical problem that’s putting a tiny bulge inside the upper lobe. It may just be a rendering issue that would go away in a PDF specimen.<br>
      - Something funny is going on with the height of <strong>O</strong> and <strong>Q</strong>. In the word Hispanola the O extends above the capline and baseline, but when they appears in the alphabet the O and Q stop at those lines.<br>
      - <strong>3</strong> looks like it has been rotated about ten degrees.<br>
      - The gap in the counter of <strong>8</strong> is much larger than any of the other gaps in the typeface. All three of the gaps in the numbers are out-of-scale with the alphabet.<br>
      - The connection between the vertical stroke and tail of <strong>J</strong> needs to flow better. It would also play better with the other letters if moved down a little.</p>
