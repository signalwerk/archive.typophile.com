    html: <p>The diagonal stems of the <strong>A</strong> look backwards. If they are going to be different, the heavier stroke should be on the right. The rest of the letters look like they are supposed to have a uniform stroke weight, so the <strong>A</strong> should probably be the same on both sides. Also, the stem weights seem to vary slightly from letter to letter. Seems like some might need adjustment.</p>
