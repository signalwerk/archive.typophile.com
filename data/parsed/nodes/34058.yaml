    html: |-
      <p>I like it overall.  I especially like the horizontal stroke on the A and H extending to the left, the diamond in the center of the O, the center mark in the S and Z, and the curve of the D.</p>
      <p>The horizontals in the A, E, F, G, and H are all at slightly different heights, which looks accidental. (It's accentuated by the fact that EFGH are shown right next to each other.) I would pick one or two horizontal stroke positions and make these five letters conform to them.</p>
      <p>The lower horizontal swash in E, L, and 2 match, and the Z and Q's match, but I think the two slightly different swashes are going to look weird when they are close together, like in words like 'lizard' or 'equal.'  Either make them identical or make them more different.</p>
      <p>6, 8, and 9 are very flowing and freeform -- much more so than the rest of the font. Maybe make them more geometric, add some straight lines or a serif. </p>
      <p>Hope this is helpful. :)</p>
