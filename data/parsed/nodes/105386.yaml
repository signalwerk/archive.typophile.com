    html: |-
      <p>Hi John,</p>
      <p>My name is Or and I'm living in Israel.<br>
      To be honest, fonts provided with Microsoft's products are most of the time the ones that every graphic designer in Israel keep a fair distance from.<br>
      MS Gisha is not popular in Israel at all. For my opinion it is a little bit weird...<br>
      The shape of the letters Noon (נ) and Gimel (ג) looks a little bit awkward as well the letters, Yod (י), Vav (ו) and Final Noon (ן): </p><div class="imageWrap"><img src="http://typophile.com/files/Weird Letters In MS Gisha_6164.PNG"></div><br>
      The most popular font in Israel these days is:<br>
      "Spoiler":<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Spoiler_5406.PNG"></div><p></p>
      <p>- Or Harel</p>
