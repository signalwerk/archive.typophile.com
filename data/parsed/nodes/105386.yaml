  html: <p>A client is looking for feedback Microsoft's <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1575" rel="nofollow">Gisha</a>, which has shipped with Windows since Vista. They're particularly interested to know whether this design is popular at all, especially in Israel, and whether the design has any flaws that might affect its popularity. I told them I would ask here, and also contact some colleagues in Israel, since I don't have direct knowledge of how widely, or not, the font might be used there. General comments on the style of the design, on specific letter shapes, or on technical aspects of the fonts are all welcome. Thanks.</p>
  html_clean: <p>A client is looking for feedback Microsoft's <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1575" rel="nofollow" class="link-external">Gisha</a>, which has shipped with Windows since Vista. They're particularly interested to know whether this design is popular at all, especially in Israel, and whether the design has any flaws that might affect its popularity. I told them I would ask here, and also contact some colleagues in Israel, since I don't have direct knowledge of how widely, or not, the font might be used there. General comments on the style of the design, on specific letter shapes, or on technical aspects of the fonts are all welcome. Thanks.</p>
