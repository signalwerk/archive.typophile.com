    html: |-
      <p>"Hinterland" is - from the viewpoint of the center of whatever place - what is behind the frontier.<br>
      E.g. the "Hinterland" of a city is the belt of smaller villages around it. They all are in relationship to the center (the city), their farmers bring their products to the city's markets and buy whatever in the cities.</p>
      <p>Military-based "Hinterland" is the area behind "The Front", where e.g. in WW1 all wounded soldiers came first to be taken care of, ammunition-magazines and so on.</p>
      <p>In West-Berlin the problem was, that there was only a "Hinterland" from the communist site, but not from the West-Berlin site. There was the city with the wall around it.<br>
      Crazy times... and the communist custums was not joking. </p>
      <p>Georg</p>
