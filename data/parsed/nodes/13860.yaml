      <p><em>home.jpg</em><br>
      The coloring system which based on dark background with a lighten object inside the design which looks like if it is the light source of all the design is very ok in my opinion with the photography issue. It reminds me of the old camera when you get inside dark room and see the world from a rounded lence. I guess it will not remind all people with same but I guarntee the eyefish picture which make person say what a strange prespective? is a good way to drive people more that site is about photographer even before we read the text.<br>
      But personally before I read the text, I felt that it is a site about decoration.. because the image it self is for an indoor well modern decorated space, may be the font also drive me so.<br>
      At this manner I will advice you to change the picture with something more imaginative .. may be the sky? may be a strange portrait? something say that you are into artistic thing done by photography?</p>
      <p>I want to add that the white wall which has some value of lighten gray is not that rich color with browns and yellowish colors.. it looks alittle separated of the composition. may be the yellow light over is trying to break it.. and the dynamic curve of the form it colors makes a cool shock for the eye.. and make it move fast and dynamically inside the design, but I am still NOT 100% sure of it.</p>
      <p>I think regarding you put your picture in a circle, and regarding there is no straight vertical line inside the picture neither a straight horiziontal line, there is a very dynamic movement for eye and you need a strong CROSSED lines in your design. You already made horiziontal lines by the type.. but the only strong vertical element is being driven for me by “P” letter, and the 3 squares under it.. try to make a long line in gray in vertical under that line and make sure it will have some empty space between it and the bottom edge of the design, and enjoy the stability.</p>
      <p>I think the space between “T” letter (of word Pear Streer) and right edge is need to be more bigger just to give some air.</p>
      <p>In fonts I am not 100% agree with makeing a  contrast between serif and sans serif fonts in this dynamic design, I think you may use 2 sans serif fonts ( to increas the feeling of modernism ) but make the contrast is based on its form, a font based on letters that are shorter than the other font as an example. photography word may need to have better appear and you may make it italic.</p>
      <p><em>Nantucketgallery.jpg</em><br>
      This design is very prof. but I am still giving the same note &amp; advice about fonts.</p>
      <p>Thank you</p>
