      <p>Sharon,</p>
      <p>The examples look very good. Great to see tasteful restraint - especially on the web - it’s like balm for the eyes. I agree with Dan about the colour. Maybe the rounded shapes on the main page could be used in some way on the gallery pages to tie everything together.</p>
      <p>I would suggest using the same typeface that you’ve used for Pearlstreet Photography for the navigation and any other text, but in upper and lower case. The benefits being a unified, strong look to the pages (which seems to be the effect you’re after). A two typeface solution would be the way to go if there were pages with a lot of text, but from the examples you’ve posted I don’t think this is the case.</p>
      <p>Navigation wise, assuming that the two main sections of the site are Galleries and Contact I would be inclined to have a different type size for the gallery locations as they are a sub level of Galleries, and remove the coloured square from Contact. You could then use the two remaining colours to differentiate the gallery pages of the two locations. All you’d need would be another coloured square for Texas once you added it to the list.</p>
      <p>Hope this helps</p>
