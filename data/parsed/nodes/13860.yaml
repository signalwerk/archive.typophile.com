      <p>I’m not a gallery owner, just a photographer.  I started with that fisheye picture of the stairs on my home page as inspiration.  I pulled the colors from that.  I thought about the black/grey thing but I guess I thought the russet color would make it more distinctive.  </p>
      <p>My business identity would be how I see my work.  I have a unique eye and I prefer simple compositions.  I don’t shoot something because I think it will sell, but rather because I think it will be a good picture according to my standards. My Nantucket pictures have been described as evoking an earlier time here. My Texas pictures are more quirky. I do fine art photography only.</p>
      <p>So I want to frame my pictures as my art, how I see things, and that I think they will stand on their own.  I want to show my work simply, without apology.  </p>
      <p>You have made me think differently about this and I thank you for that.</p>
      <p>Sharon</p>
