      <p>Nice shots, Dan!</p>
      <p>I’m into the Lomo thing too, but I’m not sure about the rewind camera - why not just pick up a half-decent SLR, shoot a roll and manually rewind then shoot again to get your double exposures - then you’re not stuck with something with a dubious lens on it! I recently dusted off my Minolta XG-M SLR, and am going to try and use it more, it fell out of favour because of my little Lomo, so I’m going to run some slide film through it, get them cross-processed (with white borders, natch) and see what I get. I think because shops are pushing digital, it should adversely effect the prices of old-school SLRs (I’m sure now’s the time to try and get your mitts on an Olympus OM-1)</p>
      <p>I think the Lomo thing is fuelled by shrewd marketing... I’ve got an LC-A but having bought my girlfriend the coloursplash, it’s put me off the rest of their products, it feels nasty and the results haven’t been great from ours (I should’ve bought the coloursplash flash for the LC-A instead). Having said that, I like what I’ve seen from your pinhole camera, nice distinctive results.</p>
      <p>You might be able to answer this - what’s the best slide film to run through an LC-A? I keep experimenting but each brand seems to give a particular cast to the prints, most seem to give a greeny cast to the prints, even when you’ve got a strong sky blue for example!</p>
      <p>Sorry this post’s gone so wildly off topic! Ahem... back to the typefaces...</p>
      <p>Si</p>
