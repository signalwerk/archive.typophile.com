      <p>I think the colors - black brown cream &amp; white are a little too ’done’ in the photography world. This was fashionable in ’93.  I would choose different colors to be more distictive. I realize your is not the fashion business where you can be ( &amp; should be ) black one moment &amp; magenta the next - but even so. </p>
      <p>Galleries are always bloddy shirking the identity aspect ( YES, shirk!) and I cannot figure out why. Maybe it’s a lack of cash... But it’s like they all have to wear the same little black dress. Yes, it’s fine but isn’t there something more that could be done? Maybe this sounds too heavy. I hope not. I want to encourage. I really do.</p>
      <p>I think the buying public has been in enough Pradas, Anthopologies, L’Occtaines and other chain boutiques with wild colors - so now - an art gallery - even a photo gallery can &amp; should get do more. The bar has been raised! </p>
      <p>Chances are your customer has a vivid red, blue or green bedroom now. </p>
      <p>Do you see what I mean?</p>
      <p>Live a little.</p>
