      <p>Regarding the colour scheme, there’s of course a reason why so many photo galleries use black/grey/white: it foregrounds the work. I’d agree with previous comments about sticking to a neutral colour scheme and let the work do the talking.</p>
      <p>While I agree with Chris’s thoughts on the typeface(s), I can understand that you may wish to use a second typeface apart from the Orator on a purely technical basis: to avoid having to set text as images. (Unless you are intending of working in flash that is.)<br>
      I like the Orator, and would say that any more-or-less ’websafe’ type, whether sans (Arial, Verdana) or serif (Georgia, Courier), would do fine as a compliment. Since Orator is a typewriter font, perhaps Courier could be an interesting alternative?<br>
      You need to decide whether to use all-caps or not (compare the image caption with the section heading). Image caption, which is off-center, would perhaps be better left-aligned?</p>
      <p>Are all your photos portrait format? If not so, it would be interesting to see how you treat a landscape/square format image.</p>
      <p>You may be interested in looking at the work of <a href="http://www.adoptdesign.dk">adoptdesign</a>, who has made quite a few great gallery sites, for inspiration.</p>
    html_clean: |-
