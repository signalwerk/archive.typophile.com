    <p>Hey fellow typophilians,</p>
    <p>I am currently designing my own typeface, called expletus which can be viewed here: <a href="http://www.typophile.com/node/72368" title="http://www.typophile.com/node/72368">http://www.typophile.com/node/72368</a><br>
    I am confident with all upper- and lowercase glyphs, except the R. It used to have a straight leg, but no matter how I many varaitions I tried, it just always looks out of balance. So I decided to make it more like Myriad's R. At first glance I would say, the latest version (top) looks best, but I'm not sure if it looks 'clean' enough. What do you think? Any comments are welcome, including other critique on expletus-sans. Cheers!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Rpict_5544.jpg"></div><p></p>
  html_clean: |-
    <p>Hey fellow typophilians,</p>
    <p>I am currently designing my own typeface, called expletus which can be viewed here: <a href="/node/72368/" title="http://www.typophile.com/node/72368" class="link-kept">http://www.typophile.com/node/72368</a><br>
    I am confident with all upper- and lowercase glyphs, except the R. It used to have a straight leg, but no matter how I many varaitions I tried, it just always looks out of balance. So I decided to make it more like Myriad's R. At first glance I would say, the latest version (top) looks best, but I'm not sure if it looks 'clean' enough. What do you think? Any comments are welcome, including other critique on expletus-sans. Cheers!<br>
    </p><div class="imageWrap"><img src="/files/rpict_5544.jpg"></div><p></p>
