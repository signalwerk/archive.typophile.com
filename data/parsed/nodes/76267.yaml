    html: |-
      <p>How about just making the fancy terminal a straight cut -- at first.<br>
      Work out the whole glyph set that way (and test it in small text), and <em>then</em> apply the extra nuancing (if really necessary).</p>
      <p>That may seem like a lot of work and going backwards, at this point in time, but it would resolve design issues by separating letter shape and letter detail, shape being the more fundamental and having priority, and be more amenable to adding extra weights.</p>
      <p>Design the process.</p>
      <p>(Many people work this way when producing rounded fonts, by producing a "normal" sans, and then applying the rounding.)</p>
