      <p>I have not measured the widths of your strokes,<br>
      but it appears to me that the width of the widest<br>
      part of your curved strokes may be mechanically the<br>
      same as the width of the upright strokes?.</p>
      <p>For optical reasons the widest widths of curves should<br>
      be a fraction wider than the vertical width.<br>
      But this will be a visual decision and not a mechanical pecentage.</p>
      <p>Ieuan Rees</p>
