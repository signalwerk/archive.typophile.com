  html: |-
    <p>I am currently in the market to purchase a new desktop scanner. Many of the reviews name the CanoScan and Epson. I am not going to be scanning any negatives, so that isn't a crucial factor in my final decision. I have used a CanoScan Lide 60 and an Agfa Snapscan 1212u. The CanoScan interface was clunky compared to the SnapScan. The SnapScan software gave you the ability to select several small areas individually on a page and scan them as opposed to scanning an entire page. I found that to be very helpful as I do a lot of thumbnail sketching. However, it was loud. Obnoxiously loud, to be more precise.</p>
    <p>Do any of you have any suggestions on a good scanner? I'm not all that technically advanced and was wondering what ever happened to scanning from within Photoshop. That was another thing I liked about the SnapScan. It can with a driver that allowed you to do so. As far as I know, the CanoScan does not allow to scan from Photoshop. Am I wrong?</p>
    <p>Anyway, thank you very much for your time and any assistance you may provide.</p>
