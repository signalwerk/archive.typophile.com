      <p><cite>There is an English word for what you are doing: it is called “transliteration” from latin script to hangul.</cite></p>
      <p>Well, I use the word  <a href="http://en.wikipedia.org/wiki/Transliteration" rel="nofollow">transliteration</a> in the narrow sense of a mapping from one writing system to another, as opposed to <a href="http://en.wikipedia.org/wiki/Transcription_%28linguistics%29" rel="nofollow">transcription</a>, the mapping of the sounds of a language to the writing system of another language. Everyday usage conflates the two, but I want to maintain a distinction between the two terms since it's a somewhat specialist website.</p>
      <p>The rendering into hangul that I describe is theoretically transcription, since it is meant to be based on the pronunciation, but in practice it's a mixture of transcription and transliteration. The words <em>romanization</em> and <em>cyrillization</em> refer to such broad mixtures of the different modes of rendering words into the Roman alphabet and the Cyrillic alphabet respectively, so I'm using the analogous word <em>hangulization</em> to broadly describe any rendering of foreign words into hangul.</p>
      <p><cite>Shouldn’t be a problem with Shinn :-)</cite></p>
      <p>Indeed. 'Nick Shinn' is rendered 닉 신 in Korean, and 신 is actually a Korean surname as well!</p>
