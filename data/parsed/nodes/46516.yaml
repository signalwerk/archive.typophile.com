      <p>We really do take into account the original pronunciations at the phonetic level, including the devoicing rules, since Korean phonology is quite different from that of most European languages. Korean doesn't allow many consonant clusters, so epenthetic vowels (in most cases 'ㅡ' IPA [ɯ]) are inserted, after which the devoicing issue is moot since they are no longer consonant clusters. </p>
      <p>In addition, unlike most European languages, Korean consonant phonemes don't follow the voiced-devoiced distinctions but a three-tier distinction based on aspiration and tenseness. We don't have voiced consonants per se, but some consonants that are voiced in certain environments (and most Koreans won't hear the difference anyway). The idea that voiced and devoiced consonant pairs like 'v' and 'f' can be different realizations of the same underlying sounds is not at all obvious to Koreans.</p>
      <p>[edited to add:]</p>
      <p>Thank you Julien! It's great to hear from the man himself. The transcription has been corrected.</p>
      <p>David, as a rule we don't write the r's in English that are not followed by a vowel, since those r sounds are not strong enough for Korean speakers to hear or are not pronounced anyway in many accents of English. We don't write the r's in the Swedish and Norwegian combinations 'rl' either for related reasons.</p>
