      <p>Well, the r sound in Korean is rather different from that of English, and it can only be followed by a vowel (it can't come at the end of a word). So we usually transcribe r's in such positions only when they are trilled or gutteral. You might feel that the American r is strongly pronounced, but to us it just sounds like the preceding vowel is being modified rather than a separate consonant is being pronounced. The r in such Mandarin Chinese words as 'er' is not transcribed as an r in Korean, either, but as an l (it just doesn't sound really much like the Korean r sound to us).</p>
      <p>We don't write the r's at the end of words in German either, if that makes you feel better.</p>
