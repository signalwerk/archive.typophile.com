      <p>William, thanks for your explanation about the romanization of Hebrew being a mess. Koreans can't be depended on to romanize their own names consistently, either, and most do not follow any of the existing systems for transliteration. It would be good to know which spelling Iontef/Yontef himself uses though, if he does favour one over the other.</p>
      <p>From what I can gather, Henri Friedlaender was born in France and lived in Germany and the Netherlands before going to Israel. He has a French given name and a German surname. I'm going by the Hebrew spelling of his name (הנרי פרידלנדר), which seems to represent 'Hnri Fridlndr' going by a chart of the Hebrew alphabet. I was hoping a typophile could supply the missing vowels in the most common pronunciation of his name in Hebrew. I'm guessing 'Henri Fridlander' or 'Henri Fridlender'.</p>
