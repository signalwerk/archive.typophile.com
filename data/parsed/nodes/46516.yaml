      <p>Joan Barjau (Spain)<br>
      Laura Meseguer (Spain)<br>
      Josep Patau (Spain)</p>
      <p>The only difference between Spanish and Catalan pronuncation when rendering these into the Korean system would be that the J would be ㅈ instead of ㅎ.  Laura Meseguer would be slightly different but would be more representative in the Korean phonetic system to use ㅅ for the intervocalic S.</p>
      <p>I should add that, at least for Joan Miró, my modern art history professor (who was Korean) always used the Spanish version of his name, Juan.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
