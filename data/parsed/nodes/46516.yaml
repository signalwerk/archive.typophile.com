      <p>Thanks Szabolcs. I've corrected the transcription for Marecki.</p>
      <p>There are existing rules for hangulization of Polish, and Janiszewski comes out as /yanišefski/ as a matter of fact if taken as a Polish name. The transcription I'm using is not IPA but my own notation that I'm calling the <a href="http://pyogi.pbwiki.com/Hangulization-Auxiliary-Alphabet" rel="nofollow">Hangulization Auxiliary Alphabet</a> that shows the simplified pronunciation used for the hangul transcription.</p>
      <p>I currently have /yaniševski/ for Janiszewski on the theory that the French pronunciation will closely respect the Polish one but stop short of following the Polish devoicing rules that converts the /v/ into [f] in actual pronunciation.</p>
