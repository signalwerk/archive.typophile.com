      <p>&gt;to us it just sounds like</p>
      <p>That's the basic problem with doing proper names in a different language. In one language what is an essential difference is not even heard by the native speaker of another, and may not be representable in their orthography and sound system. </p>
      <p>I have helped some Chinese speakers to communicate in American English. At first what they are saying sounds to them just like what they are hearing. But they are actually often incomprehensible to native speakers of English. Of course after training and practice they get the sounds right enough to communicate.  </p>
      <p>We Americans try generally harder than the English to get foreign names closer to their originals. But sometimes I think the English have it right: just anglicize it shamelessly and don't pretend to pronounce it like a native.</p>
