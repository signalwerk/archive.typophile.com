      <p>The existing rules for hangulization uses ㅈ for the [z] sound of intervocalic 's' in French and Portuguese (but not in Italian, where some speakers may pronounce [s] and others [z]). I also feel that ㅅ would be closer to the [z] sound in many cases, but it's not up to me to make the rules.</p>
      <p><cite>I should add that, at least for Joan Miró, my modern art history professor (who was Korean) always used the Spanish version of his name, Juan.</cite></p>
      <p>Interesting. Maybe your professor just assumed that Joan was a Spanish name and pronounced it as such, so that it came out like Juan? How do non-Catalan-speaking Spaniards pronounce Catalan names in general?</p>
      <p><cite>looks like polish names: [maretski] and [yanišeuski]</cite></p>
      <p>English speakers with Polish names often pronounce them entirely unlike the original Polish pronunciations, so I would like to check if Marecki and Janiszewski use similarly Germanized and Gallicized pronunciations.</p>
      <p>What about the names of English-speaking types designers? Could anyone help with Montalbano, Summerour, Giampa, Giasson, Jamra, and Greishaber?</p>
