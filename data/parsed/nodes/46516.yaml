    <p>The issue of the correct pronunciation of names and terms has come up periodically on Typophile. Don't worry, this isn't going to be a rehash of those threads, I think.</p>
    <p>Recently, I started work on a pet project of mine, <a href="pyogi.pbwiki.com" rel="nofollow">a website</a> (almost entirely in Korean for now) to help standardize the spelling of foreign names using the Korean alphabet, hangul. There are certain rules and guidelines to this process set by the National Institute of the Korean Language, but most Koreans are not familiar with them and find them difficult to follow. The website will be a database of sorts with numerous examples of properly applied hangul transcriptions of names.</p>
    <p>Transcription of non-Korean names into hangul, a process I call hangulization, is based on the pronunciation of the names in the original language rather than the original spelling. For certain languages including Spanish, Dutch, and Czech, the pronunciation is fairly predictable from the spelling so there are rules for converting the original spelling into hangul. For English, French, and German names however, a knowledge of the original pronunciation is absolutely necessary.</p>
    <p>For fun, I started a list of type designers there, culling names from Typophile and other sources. I kind of went overboard with the list, so it has several hundred names; it is also very Typophile-heavy and not very objective or balanced.</p>
    <p>Anyway, I'm confident about the correct hangulization for most of the names, and I e-mailed a couple of people to get the pronunciations of names I wasn't sure about. But there still are a lot of names whose pronunciations need to be verified, and that's why I'm asking for your help.</p>
    <p>I would specifically like help with the pronunciation of any of the following names:<br>
    Marian Bantjes (Canada)<br>
    Gerald Giampa (Canada)<br>
    Patrick Giasson (Canada)<br>
    James Grieshaber (US)<br>
    Mark Jamra (US)<br>
    Gerry Leonidas (Greece) - Is the 'g' in 'Gerry' hard or soft?<br>
    Gérard Mariscalchi (France/Canada)<br>
    James Montalbano (US)<br>
    Neil Summerour (US)<br>
    Kai Oetzbach (Germany)<br>
    Thomas Marecki (Germany) - Is it 'Marekki' or 'Maretski'?<br>
    Julien Janiszewski (France)<br>
    Gérard Mariscalchi (France/Canada)<br>
    Thierry Puyfoulhoux (France)<br>
    Magnus Rakeng (Norway) - Is the 'k' pronounced 'k' or 'kj'?</p>
    <p>Also, was I right to hangulize the following names according to the Catalan pronunciations?<br>
    Joan Barjau (Spain)<br>
    Laura Meseguer (Spain)<br>
    Josep Patau (Spain)</p>
    <p>Israeli names are also confusing. Is it Yanek Iontef or Yontef? How is 'Henri Friedlaender' pronounced in Hebrew?</p>
    <p><a href="http://pyogi.pbwiki.com/%25EA%25B8%2580%25EA%25BC%25B4-%25EB%2594%2594%25EC%259E%2590%25EC%259D%25B4%25EB%2584%2588" rel="nofollow">The full list of type designers can be found here.</a> I included my own notation to show approximately what was transcribed into hangul for each of the names, so you can check if I'm using the right pronunciations.</p>
    <p>It's a huge list, so I'm bound to have made a number of mistakes. Let me know if you spot any. Let me know also if you want additions to the list. It will be better if you supply the correct pronunciations as well. Don't be too shy to suggest your own name if you are a published type designer.</p>
