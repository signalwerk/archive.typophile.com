      <p>I see the strict definitions of transcription and transliteration that you link to, but you are right they don't quite work, so maybe your word is indeed best. "Transcription" in English is normally from spoken to written, as when a court reporter takes down everything that is said for a court record. </p>
      <p>I am familiar with Hebrew transliteration, which is rarely done as the article defines it, namely as a system which enables you to reconstruct the original spelling in the other language. </p>
      <p>As <a class="freelinking external" href="http://en.wikipedia.org/wiki/Romanization_of_Hebrew" rel="nofollow">this article on Romanization of Hebrew</a> explains, the Romanization of Hebrew is basically a mess. There are so called 'scientific' ways of doing it, systematically, in the strict definition of 'transliteration', but they are rarely followed. There are a lot of different ways that are practiced, so 'Iontef' and 'Yontef' are the same in Hebrew, and he himself might not romanize it the same way all the time. Basically people today tend to romanize Hebrew roughly as it sounds spoken in modern Hebrew, but 'roughly' the operable word. </p>
      <p>Henri Friedlaender was raised in Germany and left because of the Nazis. So his name would I guess be properly pronounced as in German.</p>
