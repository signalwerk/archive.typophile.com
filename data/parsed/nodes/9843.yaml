    html: <p>Another idea I've entertained for the lower-case san is something like the following. <br> <br><img src="http://www.typophile.com/forums/messages/4100/67697.gif" alt="Alternate san"> <br> <br>For the most part, I like it more than either my or the "official" M-derived version, although it's not as fun to draw. <br> <br>Obviously, it's based directly on the miniscule mu. It also references the cursive version of the Cyrillic sha (English "sh", Slavic &amp;scaron;), a phoneme which is closer to the actual sound of san than is the literally referenced mu. <br> <br>However, this is further away from the shapes that the Unicode standard suggests for the letter, even if the reference glyph is itself a constructed form with no direct historic antecedents. <br> <br>Comments? <br> <br>Cheers, <br>Brent</p>
