    html: "<p>I'm drawing archaic Greek letters myself at the moment, and finding it quite challenging. Actually, the real archaic Greek letters are fine: the problem is the anachronistic casing forms. I'm working in the Byzantine cursive style for the lowercase, and the san is particular tricky. Brent, I quite like your lowercase san, but it gives the appearance of having one too many strokes in it. I'll try to remember to post examples of my designs when I finish them.</p>"
