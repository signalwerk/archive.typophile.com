      <p>You might be interested in reading my essay in issue #4 of Spatium magazine (soon to be republished in the Greek "Hyphen" journal) titled "Latinization: prevention and cure", especially since it deals with Greek to some extent. I'm not implying you're doing it all wrong or anything - in fact it seems like you're taking it very seriously, which is great. The thing is though that what we consciously think is "good design" is often not in the still-murky realm of multi-script type design (especially for text faces).</p>
      <p>hhp</p>
