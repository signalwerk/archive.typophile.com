    votes: null
    html: <p>Is there a reason the numbers don't match the letters? <br> <br>Are you planning on using open type to implement the alternate glyph variants?</p>
  - id: 22695
    user: 2289
    date: 2004-01-26T02:27:00
    date_raw: 26 Jan 2004 — 2:27am
    votes: null
    html: <p>At the moment it is set up as two fonts in the same family with the fully round letters in place of upper case for each of the fonts, I have no plans for using open type, although it might be something for the future when I'm happier with the way it looks. <br>As for the numerals, I tried out various ways of keeping in with the rounded style but the results were confusing (as were the original drawings for i, j and l) and I considered the best answer was to keep them as basic, following a similar weight. <br>Tim</p>
  - id: 22696
    user: 2876
    date: 2004-01-26T11:01:00
    date_raw: 26 Jan 2004 — 11:01am
    votes: null
    html: <p>Ok.  I can accept that.  My only suggestion is that since you have this implemented as two separate font files, that gives you the option of having both classic and matching number forms.  My criteria on a display face such as this would be whether I could write everything I wanted.  As is, I couldn't use Clam if I needed to write a date because the numbers don't sylistically match the letters - so what's the point? <br> <br>I guess I'm strongly urging you to consider at least making numbers that match as an option.  Also, in thinking about the open type features for Arabic, *if you wanted*, you could probably use the initial, medial, and terminal form support to map out the different glyph variants in Clam.</p>
  - id: 22697
    user: 2289
    date: 2004-01-27T08:23:00
    date_raw: 27 Jan 2004 — 8:23am
    votes: null
    html: <p>Here are the initial drawings of the numerals, I don't think they work, but maybe I should perservere. <br><img src="http://www.typophile.com/forums/messages/29/24997.jpg" alt="numerals"> <br>However, I feel that the current numerals do work with the characters, maybe not as a direct connection in style (although they do need work 1,5,7 need to be reduced in height). <br><img src="http://www.typophile.com/forums/messages/29/24998.jpg" alt="acme"></p>
