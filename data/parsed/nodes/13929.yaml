      <p><em>Solution:</em></p>
      <p>Newbies: ask early.<br>
      Pros: reply promptly.</p>
      <p>Actually, Hrant, the solution is not to try to argue with someone who says apples are oranges when it suits his argument.</p>
      <p>Show business is the only business like no other; all other business is business, and what works, works. Consider ATMs: when they first appeared, transactions carried no fees, neither by the owner of the terminal nor your bank. AFTER people started using them more and more, the fees appeared, and nobody kicked. Now, some poor slob will pay $4.00 in fees to get $20.00 out of his own bank account -- in effect, 20% interest to borrow the money from himself. Introductory offers work.</p>
      <p>If James feels that his livelihood is threatened by cut-rate fontoliers, that's one thing...I am sure he has NEVER sold any of his work at a discount. But EVERYONE has to start somewhere. If the buyer of Thierry's typeface likes his WORK, they'll come back to him, at which time he can explain the "special introductory offer," and ask for more. If the buyer likes his PRICE, they can find another newcomer looking for a feather in his cap, and cut a deal with him.</p>
