      <p>I have to agree with James on this one. It is an almost impossible job to change the opinion of the client, when you've made yourself cheap. I know, I've had exactly that over the last months. The client was always begging me to go down with the price, because he was a poor and needy starter. I went along with him, because the project was very interesting.<br>
      But now I'm stuck in his opinion as the designer who's price you can split in half and get away with it. I had a fight with him about that and told him not to work for him anymore. After he thought about it (and sadly tried some other designers) he came back to me. This time I won the fight. </p>
      <p>My argument is the same as James'. It makes no difference how long you've been in the type business and how many prizes you took home. Ask a fair and reasonable marketprice. It's the normal price and they will pay for it, because too they know it IS the marketprice!! You can be sure about that. </p>
      <p>Kesh, go for it, and ask the market price. If they like it that much, it's worth it.</p>
      <p>Good luck,<br>
      ®ené</p>
      <p>PS  I didn't see anything indicating that apples should be oranges...</p>
