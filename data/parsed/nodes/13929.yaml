    <p>hello</p>
    <p>im pretty much a beginner when it comes to typography, but somehow i got the chance to maybe see one of my fonts being used in a pretty big videogame. this is really exciting for me, but im being asked to tell them what im thinking of in terms of licensing fees.<br>
    now, i dont have much information about this business. i thought that they'd be able to buy a font and use it as much as they want (lets say helvetica neue for example), paying an amount of money for one time. but how much?</p>
    <p>i already did the font more or less, i "only" have to do kerning and add some accents so that they can make a spanish/french/german interface, etc.</p>
    <p>i dont want to say something that is too high or too low, thats why im asking here.</p>
    <p>thanks for ANY help!<br>
    thierry blancpain</p>
