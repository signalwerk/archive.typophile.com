      <p><em>as a freelance designer I think it might be unreasonable to go so low in price. After all, it sometimes actually does come down to eating. Why are you so upset?</em></p>
      <p>I fully realize that we all need to make a living: that's not the point. What the other "contributors" to this discussion fail to realize is that the typeface in question <strong>is not going to be marketed as a typeface</strong>: it's going to be used in a videogame interface. The manufacturer is not going to realize any additional revenue by using Thierry's typeface: they just happen to like it.</p>
      <p>If the manufacturer WERE intent on reselling the typeface, then I would agree that the suggested sale price was far too low; however, this is not the case, and the other voices here don't seem to GET that. Under these circumstances, my advice was perfectly reasonable and offered Thierry an excellent chance of making the sale, and putting that feather in his cap. Of course, he <strong>can</strong> ask for much more, but I sincerely doubt that he would get it.</p>
