      <p>Licensing IP and buying cable services are a bit different, no? Please be my guest and conduct your business anyway you want. I really don't care. </p>
      <p>But I have never seen "special introductory offers" work in a IP licensing model or for any design service for that matter. "Oh will you do this job on the cheap, I promise the next one will be for a higher price." The next one never really comes through does it? I always offer to do the first job at full price and once we establish a relationship I can give you a break on future jobs.</p>
      <p>Once you are identified as someone who asks for peanuts in exchange for your work, changing that perception is a very difficult job.</p>
