      <p>If you're a real rookie, with no track record of commercial success, that first sale is an important milestone. Unless you are totally convinced that the font would generate a LOT of income if you retained the rights, rather than selling them, try asking for 500€, but be willing to bargain down to half that amount.</p>
      <p>I am sure other people will tell you that 250€ is not enough, but it's 250€ more than you have now.</p>
