      <p>Since I don't read Hebrew I can't attest to the <cite>relative</cite> legibility between the two scripts*, but the Arabic itself is plenty legible. The only potential problem (which the Hebrew probably has too) is the possible confusion with the circles; you might try making them different - maybe make the Arabic ones diamonds. A bigger problem however is how the logo will look without color, since you're relying on that heavily for legibility.</p>
      <p>* Which probably is only of academic interest however.</p>
      <p>BTW:<br>
      <a href="http://typophile.com/node/32423" title="http://typophile.com/node/32423">http://typophile.com/node/32423</a></p>
      <p>hhp</p>
