    <p>Dear Design Forum,</p>
    <p>Me and my partner are designing a logo for a school project - a magazine/newspaper for Israeli and Palestinian youth (ages 9-14) called "Windows" (Chalonot / Shababik).<br>
    We came up with this logo treatment, and we're wondering about the Arabic - is it readable as the Hebrew (which is quite distinguished)?<br>
    Also any other comments are welcome.</p>
    <p>Thank you!</p>
