    html: |-
      <p><em>using a type outline to lasercut an item for sale commercially? What issues are there that would effect this?</em></p>
      <p>It would depend on the foundry and their EULA. That is the contract between the foundry and the user. </p>
      <p>It seems to me in general, that wall signage, alphabets made as stickers or the letterforms themselves as the object being resold with the font design being the only distinguishing factor from raw material (or unsellable without the font design): is a case of the type design being translated into another media and in need of additional licensing. The type design in .ttf, .otf, rub down transfer, or personal die cutting system is still the same type design, just another media.</p>
      <p>If the commercial product being sold was a teak chair with a name engraved into the backrest, then the item being sold is not the font but the chair. The font is not the "selling" component of the chair but rather an incidental component.</p>
