    html: <p>Many years ago, Adobe contributed a Type 1 version of Utopia to the X consortium. "In 2006, Adobe relicensed them to the TeX Users Group, under similar terms as the previous contribution, but now explicitly clarifying that the modifications to the fonts, and redistribution of the modified versions, was allowed." The PFB and AFM files are available <a href="http://www.ctan.org/tex-archive/fonts/utopia" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>. To use these fonts under Windows, you would need to generate a PFM from the AFM using a program such as Proxima Software's free AfmToPfm 1.0, available <a href="http://www.proximasoftware.com/afmtopfm/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>. A Mac-ready version of this free Utopia can be found in <a href="http://www.connectnw.com/redlers/fonts/cmfontsextra.dmg.zip" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this file</a>.</p>
