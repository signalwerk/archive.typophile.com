    <p>Not sure where the best place to ask is, but I need some help.</p>
    <p>I'm a great lover of Baskerville (Storm's is the best, though I like Baskerville Classico as well...even though the italic version is a bit wonky in places), and I also just recently fell in love with <a href="http://www.dutchtypelibrary.nl/PDF/M504/DTLElzevir_M504.pdf" target="_blank">Dutch Type Library's Elzevir font.</a></p>
    <p>I am particularly looking for a transitional font that has an italic with softer contours on letters like "w" and "v".</p>
    <p>I've tried ADF's Baskervald, but when printed @ 10pt, there's a lot left to be desired and I there are some kerning issues with the font as well, not to mention it doesn't work with Office 2010 very well (but that's Office's fault really).</p>
    <p>I've also tried Linux Libertine, which I like, but the italic version has very sharp angles for the "w" and "v".</p>
    <p>The rub is that the font must be free. It's not that I can't afford a really nice font like Storm's Baskerville (which I own), it's that it needs to be distributed for free. I am working on a project where multiple authors will contribute complimentary and secondary works. As such, I want a consistent display format (e.g. font) for all supplentary works, but I can't purchase copies of a font for each author.</p>
    <p>Any suggestions would be greatly appreciated. The font will be used to create PDF and printed works. Thanks in advance!</p>
