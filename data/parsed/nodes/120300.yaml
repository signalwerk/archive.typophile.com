    html: |-
      <p>My version of "Bambi" states in (c): " Copyright  1995. Gerard E. Bernor. "<br>
      "Bernstein-Serial-Heavy" states: "(c) 1996 SoftMaker Software GmbH"</p>
      <p>Note also  that the fact SoftMaker sell their fonts at MyFonts.com does not make them more legitimate than others, as it is actually the ancestor of Brendel Informatik GmbH, a well known font-forgery company.</p>
      <p>My assumption is that MyFonts.com cannot resist the opportunity to make some extra money from SoftMaker's collection and "legitimized" them by selecting about 1000 fonts of their 10s of thousands forged fonts they had in their collection. They actually selected the ones that are not "exact clones" (like Bamberg above) plus some original digitizations.</p>
      <p>My whole experience (by trying to exclude clones from Find my Font database) leads to the same result, expressed many times here in Typophile: The type publishing &amp; distribution industry is a total mess!<br>
      All big companies out there, have - at some degree or another - cloned &amp; sell somebody else fonts without permission and without respecting the designer rights!</p>
