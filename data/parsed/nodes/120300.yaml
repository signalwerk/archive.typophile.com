    html: |-
      <p>Softmaker, to me, is almost worse than Southern Software was. They currently offer two CD's full of ripoffs. One has 9,999 fonts, the other over 12,000. They even offer a PDF on the promotional site that shows each font and blatantly lists which commercial font is copied (ITC Benguiat, Algerian (Letraset), etc. I've complained about this to MyFonts before (it's kind of backstabbing their other large foundries, no?). I'd have to agree with your assessment of why MyFonts would look the other way, Fivos.</p>
      <p>Gerard Bernor was one of that pack making some early digital fonts that copied other fonts which didn't exist digitally yet elsewhere - so he was working from scratch. Back then, the fact that they weren't available digitally gave these new fonts some degree of legitimacy. Today, not so much.</p>
