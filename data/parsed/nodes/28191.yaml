    html: |-
      <p>How timely!<br>
      I used it as one of my slides in my ATypI talk on Wednesday. I was trying to show that organicity does not depend on chirography. The parts where the strokes bifurcate (and trifurcate!) are especially relevant towards that end. Oh, and I set it green.  :-)</p>
      <p>So again, Jason: thank you. Just one thing: some terminals are uncharacteristically stubby. I suggest cleaning up this baby a little bit and actually selling it. The original version could even remain as a free font alongside (which would additionally make it a nice illustration of how pay fonts are generally better).</p>
      <p>hhp</p>
