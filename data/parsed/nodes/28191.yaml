    html: <p>I adore this font and have used it for my etsy banner; "Mossmottle".  The only thing is the lower case "t" is rather cluttered looking on my banner, also Etsy blurs things a little too which is a bit frustrating, and I've deliberately made the word somewhat difficult to decipher by filling it with moss! :-) All in all though this is one of the best elaborate fonts I've ever seen. Thankyou so much for creating it!</p><div class="imageWrap"><img src="http://typophile.com/files/msmtlshopbanner_5662.jpg"></div><p></p>
  - id: 376225
