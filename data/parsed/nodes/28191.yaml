  html: |-
    <p>It's hard to classify this font that I made. I felt I was inspired by blackletter and uncial forms, but clearly this is not either, and it's far too hard to read to think of it as display type. Anyway, I'd just like to get your impressions on the thing.<img src="/sites/default/files/old-images/antherton-test_4811.png"><br>
    You can download the font at <a href="http://www.1001fonts.com/font_details.html?font_id=2586">1001fonts.com</a> and make something with it if you like. I don't know what to do with it.</p>
