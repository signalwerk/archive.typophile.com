    html: |-
      <p>Wonderfully original.<br>
      The "k" is rather ambiguous; it could read equally well as a "t".<br>
      The "t" itself may be a bit too obscure, too, especially since it is taller than the other ascenders, instead of shorter as is usually the case, so I keep wanting to read it as an "l".</p>
