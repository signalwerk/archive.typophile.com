      <p>This is very nice. I would:<br>
      1) Probably lose the slant.<br>
      2) Fix the overly-regular glyphs like the "M" (presuming there are others).<br>
      3) Mind the too-short extenders (like the "d").<br>
      4) Don't re-use parts, like you've done with "a"/"d".<br>
      5) Some other stuff.</p>
      <p>hhp</p>
  - id: 159647
