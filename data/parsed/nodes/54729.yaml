      <p>Sort of parallel to what Steve said: the ideal logo is not just a typeset font. You could just as well start with Helvomita Olde as long as you then take the canned result and craft it towards what the "iLab" string wants and most of all what the client needs (which is not the same as what the client says it wants).</p>
      <p>hhp</p>
