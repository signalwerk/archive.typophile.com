  html: "<p>A New Swedish Type Foundry! <br> <br>BACKGROUND &amp; INFO <br> <br>MRF (MAC Rhino Fonts) was established in 2003, but founder <br>Stefan Hattenbach has been producing fonts since 1997. <br>The foundry operates as an independent studio, collaborating <br>with its partners in various disciplines whenever necessary.  <br> <br>MRF has accelerated its type design efforts in recent months. <br>This will continue, along with our advertising and graphic design <br>work. In most cases, our typefaces are available from a variety <br>of quality vendors: Fountain Type Foundry, PsyOps Type Foundry, <br>and Veer. In the future, a unique collection of typefaces <br>will be available exclusively through MRF. <br> <br>.................................................................................. <br> <br>Retail typefaces: <br>A competitive collection have been produced since the start <br>(1997). Detailed showing on each typeface are available along <br>with a tasty pdf for each family. Soon you will also be able to <br>see examples of the retail typefaces used in real situations <br>such as print, web or others <br> <br>Custom type design: <br>Examples of custom type design are also displayed, including <br>various typeface- and logotype solutions. <br> <br>Scheduled typefaces: <br>Some find it interesting to see upcoming works. Therefor MRF <br>show several typefaces in progress. <br> <br>Typefaces for free: <br>Yes, MRF do offer some typefaces for free. And it's not just <br>wasted ideas or simple executions. All are in good shape and <br>could be used for various graphic solutions.  <br> <br>Find out all about the typefaces: <a href=\"http://www.macrhino.com\" target=\"_blank\">http://www.macrhino.com</a> <br> <br>.................................................................................. <br> <br>SERVICES  <br> <br>MRF is skilled in all typographic pursuits, including:  <br> <br>Custom type design: <br>The importance of custom typography is increasing. Your <br>organization's brand will be stronger and more unique as a <br>result of your own unique typeface. Time and money will be <br>saved in the long run. MRF can create distinctive original type <br>or modify and expand an existing design.  <br> <br>Editing/digitizing: <br>MRF can take unfinished projects and turn them into working <br>typefaces. We can also transform sketches, scans or any type <br>of analog artwork into digital fonts.  <br> <br>Technical services: <br>Through our vast network of digital type gurus, MRF offers <br>services such as Spacing and Kerning, Vector Checking, Bitmap <br>Building, Platform and Format Conversion, and Hinting. Contact <br>us for an estimate or additional information. <br> <br>.................................................................................. <br> <br>Newsletters: <br>Don't forget to sign up on our e-mail list to get regular updates <br>on new releases, special offers and other interesting events. <br> <br>.................................................................................. <br> <br>Please visit our website: <a href=\"http://www.macrhino.com\" target=\"_blank\">http://www.macrhino.com</a> <br> <br>======================================= <br>MRF {MAC Rhino Fonts} A New Swedish Type Foundry! <br>Tulegatan 29 * SE-113 53 Stockholm * SWEDEN <br>Phone: +46-8-31 50 31 * E-mail: <a href=\"mailto:info@macrhino.com\">info@macrhino.com</a> <br>Internet: <a href=\"http://www.macrhino.com\" target=\"_blank\">www.macrhino.com</a> <br>=======================================</p>"
  html_clean: "<p>A New Swedish Type Foundry! <br> <br>BACKGROUND &amp; INFO <br> <br>MRF (MAC Rhino Fonts) was established in 2003, but founder <br>Stefan Hattenbach has been producing fonts since 1997. <br>The foundry operates as an independent studio, collaborating <br>with its partners in various disciplines whenever necessary.  <br> <br>MRF has accelerated its type design efforts in recent months. <br>This will continue, along with our advertising and graphic design <br>work. In most cases, our typefaces are available from a variety <br>of quality vendors: Fountain Type Foundry, PsyOps Type Foundry, <br>and Veer. In the future, a unique collection of typefaces <br>will be available exclusively through MRF. <br> <br>.................................................................................. <br> <br>Retail typefaces: <br>A competitive collection have been produced since the start <br>(1997). Detailed showing on each typeface are available along <br>with a tasty pdf for each family. Soon you will also be able to <br>see examples of the retail typefaces used in real situations <br>such as print, web or others <br> <br>Custom type design: <br>Examples of custom type design are also displayed, including <br>various typeface- and logotype solutions. <br> <br>Scheduled typefaces: <br>Some find it interesting to see upcoming works. Therefor MRF <br>show several typefaces in progress. <br> <br>Typefaces for free: <br>Yes, MRF do offer some typefaces for free. And it's not just <br>wasted ideas or simple executions. All are in good shape and <br>could be used for various graphic solutions.  <br> <br>Find out all about the typefaces: <a href=\"http://www.macrhino.com\" target=\"_blank\" class=\"link-external\">http://www.macrhino.com</a> <br> <br>.................................................................................. <br> <br>SERVICES  <br> <br>MRF is skilled in all typographic pursuits, including:  <br> <br>Custom type design: <br>The importance of custom typography is increasing. Your <br>organization's brand will be stronger and more unique as a <br>result of your own unique typeface. Time and money will be <br>saved in the long run. MRF can create distinctive original type <br>or modify and expand an existing design.  <br> <br>Editing/digitizing: <br>MRF can take unfinished projects and turn them into working <br>typefaces. We can also transform sketches, scans or any type <br>of analog artwork into digital fonts.  <br> <br>Technical services: <br>Through our vast network of digital type gurus, MRF offers <br>services such as Spacing and Kerning, Vector Checking, Bitmap <br>Building, Platform and Format Conversion, and Hinting. Contact <br>us for an estimate or additional information. <br> <br>.................................................................................. <br> <br>Newsletters: <br>Don't forget to sign up on our e-mail list to get regular updates <br>on new releases, special offers and other interesting events. <br> <br>.................................................................................. <br> <br>Please visit our website: <a href=\"http://www.macrhino.com\" target=\"_blank\" class=\"link-external\">http://www.macrhino.com</a> <br> <br>======================================= <br>MRF {MAC Rhino Fonts} A New Swedish Type Foundry! <br>Tulegatan 29 * SE-113 53 Stockholm * SWEDEN <br>Phone: +46-8-31 50 31 * E-mail: <a href=\"mailto:info@macrhino.com\">info@macrhino.com</a> <br>Internet: <a href=\"http://www.macrhino.com\" target=\"_blank\" class=\"link-external\">www.macrhino.com</a> <br>=======================================</p>"
