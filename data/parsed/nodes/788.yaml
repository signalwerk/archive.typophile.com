  html: "<p>Indie Fonts 2 is the follow-up to the highly acclaimed Indie Fonts type <br>specimen book. The book is  hard bound and contains 400+ pages which <br>showcases a collection of over 1600 fonts from 19 diverse digital type foundries . Included are: <br>              <a href=\"http://www.secretonix.pt/\" target=\"_blank\">Feliciano Type Foundry</a> <br>              <a href=\"http://galapagosdesign.com\" target=\"_blank\">Galapagos</a> <br>              <a href=\"http://www.hollandfonts.com/\" target=\"_blank\">Holland Fonts</a> <br>              <a href=\"http://www.identikal.com/\" target=\"_blank\">Identikal</a> <br>              <a href=\"http://www.ingo-zimmermann.de\" target=\"_blank\">Ingo Fonts</a> <br>            <a href=\"http://JAWarts.com/\" target=\"_blank\">Jukebox</a>  <br>            <a href=\"http://www.mvbfonts.com/\" target=\"_blank\">MvB Fonts</a> <br>            <a href=\"http://neufville.com\" target=\"_blank\">Neufville</a> <br>            <a href=\"http://nicksfonts.com/\" target=\"_blank\">Nick's Fonts</a> <br>            <a href=\"http://www.nobodoni.com/\" target=\"_blank\">No Bodoni Typography</a> <br>            <a href=\"http://www.typedesign.com/\" target=\"_blank\">Parkinson Type Design</a> <br>            <a href=\"http://ms-studio.com/\" target=\"_blank\">Mark Simonson Studio</a> <br>            <a href=\"http://www.p22.com/sherwoodtype/index.html\">Sherwood Type Collection</a> <br>            <a href=\"http://stormtype.com/\" target=\"_blank\">Storm Type Foundry</a> <br>            <a href=\"http://terminaldesign.com\" target=\"_blank\">Terminal Design</a> <br>            <a href=\"http://www.underware.nl\" target=\"_blank\">Underware</a> <br>            <a href=\"http://www.unionfonts.com/\" target=\"_blank\">Union Fonts</a> <br>            <a href=\"http://youworkforthem.com/\" target=\"_blank\">You Work for Them</a> <br> <br> <br>Indie Fonts 2 comes with a companion CD-ROM, featuring 38 representative <br>fonts from the book's independent foundries (fully licensed and ready to <br>install).  For more information on Indie Fonts, visit: <br> <br><a href=\"http://www.p22.com/indiefonts/indie2.html\" target=\"_blank\">http://www.p22.com/indiefonts/indie2.html</a> <br></p>"
