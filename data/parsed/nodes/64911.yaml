  html: |-
    <p>Hi all,<br>
    I'm putting together a list of type styles which can be thought of as defining particular eras. It's for an etymological English dictionary project: every word set in type/lettering contemporary with when the word was first used. Since the Latin alphabet is first used in around 600BC, this is as far back as the list goes.<br>
    Preferably I'd like to use examples from the English-speaking world where possible.<br>
    I thought I'd put my list out there for your comments, improvements, suggestions, edification, that sort of thing.<br>
    2000+: FF Dax<br>
    1950 - 2000: Helvetica<br>
    1900 - 1950: Futura (Architype Renner)<br>
    1800 - 1900: Clarendon (Adobe)<br>
    1700 - 1800: Baskerville (Berthold)<br>
    1500 - 1700: Fell types (HF&amp;J)<br>
    1200 - 1500: Blackletter textura (HF&amp;J)<br>
    800 - 1200: Carolingian minuscule (Canada Type Luminari)<br>
    500 - 700: Half uncial (Linotype Neue Hammer Unziale)<br>
    300 - 500: Uncial (Linotype Omnia)<br>
    100 - 300: Classical Roman Lapidary (Trajan)<br>
    -100 - 100: Early Roman Lapidary (Lithos / Herculanum)<br>
    -400 - -100: Early Greek Lapidary (Any ideas? For an example see <a href="http://www.textism.com/writing/?id=2" title="http://www.textism.com/writing/?id=2">http://www.textism.com/writing/?id=2</a>)</p>
    <p>This list comes partly from:<br>
    <a href="http://www.designhistory.org/handwriting.html" title="http://www.designhistory.org/handwriting.html">http://www.designhistory.org/handwriting.html</a></p>
    <p>Any thoughts?<br>
    H</p>
