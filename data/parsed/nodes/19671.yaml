    <p>Hello,</p>
    <p>My friend who is a photographer, “Miss Kim Parker” has asked me to select a typeface that would represent her and the body of work she produces. Her work consists of musicians, live performances, and musical groups in the reggae genera. She is a wonderful person to be around, very easy-going, and laid back.</p>
    <p>Any suggestions would be greatly appreciated.</p>
    <p>Thanks You,<br>
    Emily</p>
