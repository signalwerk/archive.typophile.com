      <p>Tiffany Wardle once made a great document detailing/comparing EULAs. But things have changed since then (not least all this webfont action) so it should be revisited.</p>
      <p>Just one thing real quick: you don't own a font by buying a retail copy; you can only own a font if you commission a custom one.</p>
