    <p>Hello</p>
    <p>I couldn't find this topic, but my guess is it has been discussed before. If it has, then please point me in the right direction, and sorry.</p>
    <p>I'm starting up as a working graphic designer. I love typography and of course want to do right by the people who design type. However, reading, understanding and actually abiding to all the different EULAs is giving me a headache. Some are great, some are a pain in the ass, some are just not understandable. </p>
    <p>So, is there any blog, article or some resources online for getting your head around this?</p>
    <p>1)Why are there so many silly rules, like that you can only back up the file on one place? </p>
    <p>2)If I buy a typefaces, I have the license to use it on up to 5 workstations (I assume this is "at any given time"). What happens if I start working for a design company? Can I use my license if I make the work/type or do the company have to buy a new one?</p>
    <p>3)Why does it have to be so hard to keep up? I'm designing a magazine, and I found a beautiful body text. Ok, so out of respect to the foundry I'll cash out the 100 euros they want for two weights, it's well worth it. Ok, so now I got the font and the license to use it, BUT, when I want to put this free magazine of mine online, suddenly I don't own the font anymore. Now I have to rent it, with a price according to download. Now, I have some choices, I can not publish it online. I can change the font for online, or my free magazine doesn't get free. Whattheheck? I think this is the kind of stuff that makes people find free fonts tbh.</p>
    <p>That was the things that confuses me atm :P</p>
