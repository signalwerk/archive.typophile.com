      <p><cite>1)Why are there so many silly rules, like that you can only back up the file on one place?</cite></p>
      <p>Because it's complicated and a EULA has to cover a lot of scenarios clearly. Things that might be silly to you as an individual designer can mean a lot to a multinational corporation. </p>
      <p><cite>2)If I buy a typefaces, I have the license to use it on up to 5 workstations (I assume this is "at any given time"). What happens if I start working for a design company? Can I use my license if I make the work/type or do the company have to buy a new one?</cite></p>
      <p>If you can use the font on 50 workstations total (but only 5 at a time) you still need a 50 workstations license (depending on the EULA, but this is some weaselly bullshit). Also, your company needs to license the fonts if they are going to be used on their workstations. </p>
      <p><cite>3)Why does it have to be so hard to keep up? ....</cite></p>
      <p>First, you never owned the font, you've purchased a license to use it according to a specific set of rules (that the EULA). Next time you should read it before purchasing. Or you can email the foundry and ask for clarification.</p>
      <p>Yes, licensing fonts is confusing at first, it will take time to learn. But it's not *that* difficult to figure out.</p>
