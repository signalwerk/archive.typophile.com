  html: |-
    <p>In Quark 6.5, on Max OS 10.4.11, the bold weights of some fonts are not displaying correctly.<br>
    This issue is becoming too much to endure, and getting InDesign isn't an option.<br>
    Any advice or suggestions are most appreciated.</p>
    <p>Example:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/problem_3734.jpg"></div><br>
    As you can see, the bold version of the font doesn't seem to have its kerning info. I don't use the kerning table in Quark.<br>
    This is a PostScript Type1 font file. Only Quark seems to botch the kerning like this: Photoshop, etc. are fine.<p></p>
    <p>I've wiped the jaws folder, and that hasn't helped. This is how they appear in font lists.</p>
    <p>Font Book list:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/fontbooklist_3425.jpg"></div><p></p>
    <p>Quark list:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/quarklist_6317.jpg"></div><p></p>
    <p>Is the ITC and DTC difference an issue? Or are Font Book and Quark merely looking at different things to get a name?<br>
    In my Google searches I found out that DTC=Digital Typeface Corp. and that it is now defunct. Font Book's Info pane confirms that it is from Digital Typeface Corp. Some other DTC fonts have this same behavior. Could I have bum font files?</p>
    <p>The font doesn't appear to be corrupted though. No other applications display the type like this.</p>
    <p>Is there anything I can do to make Quark display this correctly? Thanks for the help.</p>
