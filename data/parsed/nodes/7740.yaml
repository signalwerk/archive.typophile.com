    html: "<p>Evert, indeed I think Lexicon is not a good news face. And I'm not alone! <br> <br>&gt; leaving away the strokes <br> <br>That's all fine and dandy, but what you've done with Legato is much deeper, in my mind coming the closest so far to the true essence of typography. <br> <br>To me the only real problem with Legato is that it's too constructed, too Modernist. I think one has to relinquish some control to make something that truly works with the human reality. This is what the Post-Modernists had a feeling for, but too many of them were more interested in simply discrediting Modernism, like misbehaving children. <br> <br>BTW, I like Avance! In fact it has one strong functional advantage over Legato: serifs. <br> <br>&gt; we certainly do not observe just with our <br>&gt; eyes but also with other senses, with our <br>&gt; body as a whole.  <br> <br>That sounds very spiritual (and I'm not being sarcastic) but I don't see how that's possible. But anyway discussing metaphysics has always seemed pretty hopeless to me.  :-) <br> <br>&gt; I always prefer to see type on rough paper which is not too white. <br> <br>This might be related to my idea about limiting contrast. I think not-too-white paper does indeed help offset, but not letterpress. <br> <br>BTW, that chart is pretty nice! <br> <br>-- <br> <br>&gt; Curves are not defining to femininity. <br> <br>I guess all I can do is disagree. <br> <br>Nothing is just a shape - everything has meaning, and not just through social conditioning either. Red alludes to blood. An inverted triangle grabs attention because of the nature of gravity. We are completely surrounded by snippets of physical realities such as these, and good design requires an appreciation of them. <br> <br>-- <br> <br>Legato is a landmark design because it finally gives the importance of the white more than lip service - it creates notan, as opposed to merely a sequence of pretty blacks. People like G Noordzij go on and on about creating the white as well as the black, but they essentially ignore that chirography is inescapably anti-notan. <br> <br>The difference between designing Black versus designing notan is the difference between Art and Craft, between wanting to make versus wanting to serve. Smeijers says that Design starts with the desire to create. No. <br> <br>hhp</p>"
