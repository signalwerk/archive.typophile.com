    html: "<p><i>What I'm trying to do is simply get people to admit that chirography is anti-readability.</i> <br> <br>But who reads chirography? We're not in a manuscript culture. We all read typography, and there are very, very few text faces that are chirographic in any way that suggests to me that the designers are not aware of the needs of readability. What they have recognised, though, is that the impact of type design on the readability of a text, presuming the design is within the range of typical text design, is <i>minimal.</i> I think Legato is a fine typeface, and I too appreciate the fact that it is a <i>thoughtful</i> typeface: but until you can actually demonstrate a statistically significant increase in reading speed and accuracy, all your talk about readability and anti-readability in type design doesn't convince me. Reader-ability so far outweighs readability as a factor in reading that insisting on addressing the readability in typeface design is like trying to say that all shoes should be designed primarily to make walking easier, as if walking were difficult. <br> <br>But I'm wondering why you characterised my message as 'always the same circular shenanigans', when the principal point of it was to suggest that you might get more mileage from concentrating on analysis of notan, rather than tilting at the windmill of chirography. I was trying to be helpful. Consider: let us imagine that everyone has accepted that 'chirography is anti-readability'. So now what? What do we do differently? These seem to me interesting questions.</p>"
