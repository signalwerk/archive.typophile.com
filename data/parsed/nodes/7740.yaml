    html: <p>No, even in a photograph I can tell it's letterpress. <br>(Which of course means the impression is way too much! :-) <br> <br>But the point is that there's no reason you couldn't use that paper, that binding, etc. in a book printed offset. And if we're talking about the <i>type</i>, I don't see how any of the non-visual things -at least of the ones you mentioned, and even the ones I can think of- can affect reading. <br> <br>As I said above, I do think there's a functional difference between letterpress and offset <i>even at the level of the type</i>. But it's not tactility, or smell, or anything else related to our non-visual senses; it's the nature of the border between black and white, the contrast of the notan. And I think it might actually be possible to acquire this positive attribute in offset - by slightly defocusing the imagesetter laser. <br> <br>BTW, come to think of it, there might in fact have been a short period during the phototype era just before the digital revolution when things were <i>just</i> as "fuzzy" as they needed to be to match the feel of letterpress "rendering" - except of course the actual fonts they were using were caricatures. I wonder, do typographers who were active at that time feel that what they had was "warmer" than the subsequent digital stuff, like how an LP is seen by some as somehow better than a CD? <br> <br>hhp</p>
