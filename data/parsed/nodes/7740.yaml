    html: <p>Incidentally, an extrema point is the point at which a curve is tangent to either the horizontal or vertical axis. This is the reason diagonal lines or curved lines which are diagonally oriented can't be hinted--no place to put an extrema point because the line or curve is never tangent to either the vertical or horizontal axis.</p>
