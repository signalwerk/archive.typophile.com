ou could say making it a healthy marriage, not an owner&amp;slave relationship. <br> <br>-- <br> <br>&gt; .... visible as on the photo.  <br> <br>That's too much impression - bad for readability. <br>The degree of pressing that I think helps readability is <i>subvisible</i>. <br> <br>Notan is indeed a Japanese term (there is no equivalent in Western lanaguages that I know of - and I think this is itself telling), but ironically the letter-making crafts in the Orient are even more Black-centric than in the West! On the other hand, cross-character relationships are a lot less important in Chinese for example than in Latin. <br> <br>&gt; In the same way offset will never be able <br>&gt; to replace all the aspects of letterpress <br> <br>I agree, but my personal concern is to replicate what <i>is</i> possible, and to me the readability advantage of letterpress is. Running your hands over the bumps (which should be barely tactile however, not impressed up the wazoo) is not replicable - although that doesn't make me very sad. <br> <br>Also, don't forget photopolymer letterpress, which allows digital type to replicate the whole deal. Unless you think irregularity (I mean the true kind, different than intentional variance) is anything more than bad craft. <br> <br>&gt; you could also try the effect of random irregularity <br> <br>No, that's not the type of thing I'm talking about. That is indeed fake. <br>Like Johnny von Neuman said, real irregularity can never be intentional anyway. <br> <br>&gt; the unsharpness of the phototype era <br>&gt; is the dark age of typography to me. <br> <br>Me too, but I'm speculating that that's what we're taught these days: the \"outstanding\" feature of phototype was blur, so that's what is remembered. But maybe there was a period towards the end that -were it not for the lousy fonts generally used- the effect was closer to letterpress than we're at now. I admit it's speculation though. <br> <br>hhp</p>"
  - id: 52496
    user: 1262
    date: 2004-12-06T13:04:00
    date_raw: 6 Dec 2004 — 1:04pm
    votes: null
    html: "<p><i>Even though some people, like Jan Middendorp, have gleefully exclaimed \"Look, the pen, look!\" But it's not there. Just like Gary Much once saw the pen in my Paphos \"j\", but I can assure you it's not there.</i> <br> <br>I'm not sure that a letter needs to be made with a pen in order for the pen to 'be there'. During my short talk in Prague, I focused on role of ductus in glyph identity, as against a conception of letter identity as a kind of skeleton on which the meat of the individuated glyph is hung. Of course, ductus shifts and changes, across historical periods and styles, and in the hands of individual designers, but within a particular style of lettering there is only so far from the expected patterns resulting from ductus that one can go before the letters start to look freakish. So when one 'sees the pen' in Legato, one is acknowledging the ductus in the identity of the letters, which is not mechanically consistent angle and weight, but is significant enough to establish a common relationship between the letters. Yes, Evert has manipulated the ductus -- most type designers do, in fact: Gerrit Noorzij might be unique in claiming that his type designs are as he writes them -- but nothing in Legato looks freakish. The idea of ductus fascinates me, because it is something that originates in tools, but which has become an idea in our comprehension of letterforms, and now exists to a large degree independent of tools. We observe ductus -- we see the artifact of the tool -- where the tool has not been.</p>"
