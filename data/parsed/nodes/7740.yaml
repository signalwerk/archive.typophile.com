    html: <p>I don't understand the concept of masculine/feminine here? Curves are not defining to femininity. Curves are just elements of form.  There are few typefaces which limit themselves by gender.  Legato certainly does not. Legato is a strong yet neutral type which has strong character yet does not interfere with the meaning of the text it is set in. I am just an observer who pretends to know nothing about what was intended in the design of the face.  My reaction is purely from what I see as an individual. I have not read about Legato or ever spoken with Mr. Bloemsma so what I say is just one man's interpretation. What I see is a face which gets its life by tension.  The counters seem to be ever-so-subtly moved off axis from their surrounding form, just enough to cause a tension but not so much to make it look like an error. The tension locks the two forms (form and counter) into life.  This is like the Keats poem, "Ode on a Grecian Urn" where the two lovers are locked for eternity just short of kissing--"bold lover, never, never, shalt thou kiss". <br>It may be that Gill attemted this in his Gill Sans but his lacks the tension present in Legato.  It appears to me that Gill was just trying to overcome weight and contrast problems when moving to bolder weights--where Evert is successfully using the tension for its own sake. <br> <br>ChrisL</p>
    html_clean: <p>I don't understand the concept of masculine/feminine here? Curves are not defining to femininity. Curves are just elements of form.  There are few typefaces which limit themselves by gender.  Legato certainly does not. Legato is a strong yet neutral type which has strong character yet does not interfere with the meaning of the text it is set in. I am just an observer who pretends to know nothing about what was intended in the design of the face.  My reaction is purely from what I see as an individual. I have not read about Legato or ever spoken with Mr. Bloemsma so what I say is just one man's interpretation. What I see is a face which gets its life by tension.  The counters seem to be ever-so-subtly moved off axis from their surrounding form, just enough to cause a tension but not so much to make it look like an error. The tension locks the two forms (form and counter) into life.  This is like the Keats poem, "Ode on a Grecian Urn" where the two lovers are locked for eternity just short of kissing--"bold lover, never, never, shalt thou kiss". <br>It may be that Gill attemted this in his Gill Sans but his lacks the tension present in Legato.  It appears to me that Gill was just trying to overcome weight and contrast problems when moving to bolder weights--where Evert is successfully using the tension for its own sake. <br> <br>ChrisL</p>
