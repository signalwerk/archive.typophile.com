    html: <p>Yes, I think letterpress (when not over-impressed) increases readability, and I think it's because it promotes a notan more naturally in tune with human perception. <br> <br>But I don't think Legato's main readability advantage has anything to do with that; to me it's due to the font's breaking of the Black, to its tying of the White - a better (if still somewhat simplistic, too Modernist) balance of notan. By reducing the relevance of strokes (chirography) the Black is made to accomodate the White -hence notan- much better. The letters are less themselves are more parts of boumas. <br> <br>hhp</p>
