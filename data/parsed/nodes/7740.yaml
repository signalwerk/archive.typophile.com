  - id: 52478
    user: 1250
    date: 2004-11-30T10:09:00
    date_raw: 30 Nov 2004 — 10:09am
    votes: null
    html: "<p>Evert, great to see you here. <br>Quite shocking that such \"big\" programs are ruining your outlines. <br> <br>-- <br> <br>The issue of rigidity, especially in offset, is quite interesting to me. I agree that gentle curves have a lot of potential, and I think this is two-pronged: they fight optical distortion (like a \"perfect\" rectangle looks fatter in the middle); and they add a certain feeling, even (especially?) when they're so subtle as to escape <i>conscious</i> perception. <br> <br>The problem I have with curves -and the reason I see a positive role for rigidity- is that they convey a style that might not be suitable to the given typography. One area is news. You don't want a feminine, ambiguous, suggestive voice giving you updates about Ukraine for example - you want some neutrality so you can make up your own mind, without a designer \"helping\" you think, or at least not helping you <i>feel</i>. <br> <br>It's no secret that I admire your work. But it's also quite feminine; and it's interesting to note that Avance -perhaps because it has serifs- seems sort of androgenous, which is why I think it was an incredibly good choice for the book \"John Kelly\"! <br> <br>-- <br> <br>As for the perceived advantages of letterpress, I actually think they're real, but have struggled to figure out why they exist. It can't be because of depth/tactility. And even digital fonts (like Evert's) can be \"soft\". The only thing I can think of is that the boundary between black and white is more gradual. Solution? I can only think of two: <br>1) Photopolymer letterpress. <br>2) Microscopically de-focus the laser in an imagesetter! :-)  Note that this is not the same thing as putting down gray dots, or using lower resolution; it would simply make the notan ever so slightly softer. <br> <br>hhp</p>"
    html_clean: "<p>Evert, great to see you here. <br>Quite shocking that such \"big\" programs are ruining your outlines. <br> <br>-- <br> <br>The issue of rigidity, especially in offset, is quite interesting to me. I agree that gentle curves have a lot of potential, and I think this is two-pronged: they fight optical distortion (like a \"perfect\" rectangle looks fatter in the middle); and they add a certain feeling, even (especially?) when they're so subtle as to escape <i>conscious</i> perception. <br> <br>The problem I have with curves -and the reason I see a positive role for rigidity- is that they convey a style that might not be suitable to the given typography. One area is news. You don't want a feminine, ambiguous, suggestive voice giving you updates about Ukraine for example - you want some neutrality so you can make up your own mind, without a designer \"helping\" you think, or at least not helping you <i>feel</i>. <br> <br>It's no secret that I admire your work. But it's also quite feminine; and it's interesting to note that Avance -perhaps because it has serifs- seems sort of androgenous, which is why I think it was an incredibly good choice for the book \"John Kelly\"! <br> <br>-- <br> <br>As for the perceived advantages of letterpress, I actually think they're real, but have struggled to figure out why they exist. It can't be because of depth/tactility. And even digital fonts (like Evert's) can be \"soft\". The only thing I can think of is that the boundary between black and white is more gradual. Solution? I can only think of two: <br>1) Photopolymer letterpress. <br>2) Microscopically de-focus the laser in an imagesetter! :-)  Note that this is not the same thing as putting down gray dots, or using lower resolution; it would simply make the notan ever so slightly softer. <br> <br>hhp</p>"
