    html: <p>I am not sure about some translations <br> <br><img src="http://www.typophile.com/forums/messages/30/54938.gif" alt="history english"> <br> <br>A typeface like "Template Gothic" is also mentioned to represent a movement or a foundry as a whole; in this case Emigre. <br> <br>The chart should be compact, and the "classifications" are rather unconventional. It is targetted at (future-) graphic designers; not type designers. <br> <br>I had a discussion with Martin Majoor who mentioned the fact that many typeface families have been published with a serifed and a sanserifed part, like Thesis. The two typefaces mentioned as "hybrid" however, are there because they embodie both sanserifed and serifed principals in one shape, for example FF Sari; it has the contrast of a serifed face, but lacks the actual serifs. <br> <br>Evert Bloemsma</p>
    html_clean: <p>I am not sure about some translations <br> <br><img src="http://www.typophile.com/forums/messages/30/54938.gif" alt="history english"> <br> <br>A typeface like "Template Gothic" is also mentioned to represent a movement or a foundry as a whole; in this case Emigre. <br> <br>The chart should be compact, and the "classifications" are rather unconventional. It is targetted at (future-) graphic designers; not type designers. <br> <br>I had a discussion with Martin Majoor who mentioned the fact that many typeface families have been published with a serifed and a sanserifed part, like Thesis. The two typefaces mentioned as "hybrid" however, are there because they embodie both sanserifed and serifed principals in one shape, for example FF Sari; it has the contrast of a serifed face, but lacks the actual serifs. <br> <br>Evert Bloemsma</p>
  - id: 52481
