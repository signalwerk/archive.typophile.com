    html: <p>That's right. Curves and lines don't actually exist as such in a font, but points do. Hints need something to "latch on to" so to speak, and if you don't put those extrema points in, you can't hint those parts of the outline.</p>
    html_clean: <p>That's right. Curves and lines don't actually exist as such in a font, but points do. Hints need something to "latch on to" so to speak, and if you don't put those extrema points in, you can't hint those parts of the outline.</p>
