    html: "<p>The FH outline conversion looks as if it has been converted via quadratics. The pattern of extra nodes is characteristic: more nodes on long, shallow curves, fewer on more rounded curves. Someone who has the font can open it in FontLab and test this hypothesis by converting all outlines to quadratics, then back to beziers, and comparing the result to the FH conversion.</p>"
