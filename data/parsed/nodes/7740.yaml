    html: "<p>&gt; But who reads chirography? We're not in a manuscript culture. <br> <br>1) Well, exactly. This makes the familiarity factor [increasingly] weak. <br>2) I'm talking about chirographic <i>type</i>, and in saying \"I'm not sure that a letter needs to be made with a pen in order for the pen to 'be there'.\", you are too. <br> <br>&gt; until you can actually demonstrate a statistically significant increase <br>&gt; in reading speed and accuracy, all your talk about readability and <br>&gt; anti-readability in type design doesn't convince me. <br> <br>That bar is unreasonably high, and furthermore not in tune with how humans come to believe things, and as a result how they <i>practice</i> things. Empiricism should be an assistant, not a master. But anyway, I'm not interested in convincing individuals - just making my case. <br> <br>&gt; as if walking were difficult. <br> <br>Walking is actually a great example: <br>- Better shoes help, a lot. <br>- You don't know how difficult it used to be until you get better shoes. <br> <br>&gt; I'm wondering why you characterised my message as 'always the same circular shenanigans' <br> <br>Sorry, I didn't mean you, but the whole thing, including me. As much as I admittedly like the sound of my own voice, I get tired of repeating myself droningly, and having to counter intelligent people who refuse to listen with self-doubt. I should really follow Brian Jaramillo's advice and set up a Hrant FAQ. So I can just simply and quickly point to it as needed. Hey, what about <a href=\"http://www.hhpov.com\" target=\"_blank\">www.hhpov.com</a> ? :-) It's all just a point of view after all. <br> <br>As for addressing notan versus chirography: both need elaboration, and they're strongly related. As I said, it is to promote better notan that chirography needs to be demoted. Few people (mostly outside the craft, like Kevin) think notan is limited to individual letters; overcoming that is the first step, but then you have to see the damage done by the moving front (to reading). <br> <br>&gt; What do we do differently? <br> <br>All kinds of stuff. For example, Underware would use their huge talent and skill to make really really great fonts, instead of wasting time shackled to a relic, making just very good fonts. Once you admit something, things inevitably change. I have no problem with a designer saying that he makes chirographic fonts because his clients want it, or his designer friends think it's cool. It might make me sad, but not angry. Denial makes me angry. <br> <br>It would be great though if this wasn't a hypothetical question - let's work on that. <br> <br>hhp</p>"
