    date_raw: 6 Dec 2004 — 1:16pm
    votes: null
    html: "<p>Of course chirography is not dependend on the actual use of a physical tool. My observation was about some pro-chirography people seeing what they want to see. <br> <br>There might be ductus is Legato, but I don't think so: I think it's merely a difference in width in different parts, and some people like to see ductus in that because it validates their ideology (and practice). And I <i>know</i> there's no ductus in my stuff, but that doesn't stop people from thinking they're seeing it. <br> <br>&gt; before the letters start to look freakish. <br> <br>I don't think unacceptable deviation from a \"norm\" has much to do with ductus, at least not at the text level. It has more to do with salient features of the letters (where ductus is coincidental). Not to mention the great capacity of humans to adapt to new forms. <br> <br>&gt; nothing in Legato looks freakish. <br> <br>Exactly!  :-) <br>I don't think he's manipulated the ductus. And if he has, its wasn't necessary. What I think he's done (and more to the point what I think <i>should</i> be done) is to manipulate notan, directly, without any limiting influences from archaic tools. The moving front is anti-notan. <br> <br>The need to demote chirography comes from the need to promote readability. <br>And also the need to get the 40-year-old man to move out of his mom's house. <br> <br>hhp</p>"
    html_clean: "<p>Of course chirography is not dependend on the actual use of a physical tool. My observation was about some pro-chirography people seeing what they want to see. <br> <br>There might be ductus is Legato, but I don't think so: I think it's merely a difference in width in different parts, and some people like to see ductus in that because it validates their ideology (and practice). And I <i>know</i> there's no ductus in my stuff, but that doesn't stop people from thinking they're seeing it. <br> <br>&gt; before the letters start to look freakish. <br> <br>I don't think unacceptable deviation from a \"norm\" has much to do with ductus, at least not at the text level. It has more to do with salient features of the letters (where ductus is coincidental). Not to mention the great capacity of humans to adapt to new forms. <br> <br>&gt; nothing in Legato looks freakish. <br> <br>Exactly!  :-) <br>I don't think he's manipulated the ductus. And if he has, its wasn't necessary. What I think he's done (and more to the point what I think <i>should</i> be done) is to manipulate notan, directly, without any limiting influences from archaic tools. The moving front is anti-notan. <br> <br>The need to demote chirography comes from the need to promote readability. <br>And also the need to get the 40-year-old man to move out of his mom's house. <br> <br>hhp</p>"
  - id: 52498
    user: 1262
    date: 2004-12-06T14:28:00
    date_raw: 6 Dec 2004 — 2:28pm
    votes: null
    html: "<p><i>The moving front is anti-notan.</i> <br> <br>So you keep saying, but this implies that notan cannot be achieved except by treating the boundary between black and white as an independent path. In other words, drawing outlines is the only sound approach to type design. Now who is being ideological? The problem with this view is that the vast majority of notan in the world is not created by drawing outlines, but with brushes and pens, and the whole notion of notan develops in arts of painting and calligraphy in which it is understood that black and white can be balanced or, for that matter, deliberately imbalanced, by the use of such tools. <br> <br>Most type designers are pragmatists: they'll use whatever methods, tools, and tricks they can. Watching Tim Holloway drawing Arabic letters was a thrill: the tools and tricks of the Walter Tracy's drawing office pulled out in the lounge of a London hotel: two pencils with shaved sides taped together to sketch initial forms, and <i>then</i> the outline drawn, following the sketched ductus sometimes and diverging where Tim felt it should, and then the thick black chisel marker to ink the form. Was it chirographic? Was it 'synthetic'? Or was it something in-between? To me, it was just type design, as practised by one person who I happen to think is one of the most brilliant designers I have met. <br> <br><i>...manipulate notan, directly...</i> <br> <br>Presumably, this is what I do almost all the time, since I design from scratch with digital outlines, and manipulate them until I am satisfied with the shape, weight and consistency of the letter. So I think you must be talking about something other than method, which makes me suspect that your crusade against chirography is misdirected. It seems to me that what you really want to focus on is <i>analysis of notan,</i> not how notan is made. As Gary Munch said to you on the ATypI discussion list, an experienced calligrapher isn't significantly limited in the kind of forms he can make with the various tools at his disposal. His point regarding your Paphos <i>j,</i> wasn't that he thought you had made it with a pen, but that <i>he could have made it with a pen.</i> So I tend to consider the method of creating the form from a purely pragmatic perspective -- not least because I'm a jobbing craftsman with deadlines --: what is the most effective way to arrive at the form? The question of what that form should be, what makes it more or less readable: these are much more interesting questions, regardless of how one goes about making the form.</p>"
