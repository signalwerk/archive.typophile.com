  - id: 52495
    user: 1250
    date: 2004-12-06T11:42:00
    date_raw: 6 Dec 2004 — 11:42am
    votes: null
    html: "<p>There seems to be a bit of confusion in this thread - maybe because we're all [positively] excited about the topic so we're reading things we anticipate into what others are saying... <br> <br>&gt; How does something that is not overly <br>&gt; constructed, but with reduced reference <br>&gt; to a traditional writing tool, make the <br>&gt; black accomodate the white? <br> <br>1) I think Legato is actually overly constructed! <br>2) I don't think its \"curviness\" has much to do with readability. <br>3) But indeed by demoting chirography it becomes possible to create better notan. Consider the core of the G Noordzij argument: the moving front. It creates the Black, and it favors the Black (even if you're keeping your eye on the White while doing it) because it ties the two edges (outlines) of the black body. By doing this it makes the White a byproduct, and this reduces bouma cohesion, hence readability. We are extremely lucky to be able to design individual outlines (as opposed to bodies) directly, since it's this border than defines notan. Sadly, Evert is the only person I know who has used this freedom to good effect so far. Hopefully though the floodgates will soon open, and chirography (at least in the realm of text) will be seen as the relic, the romantic inhibitor, that it is. <br> <br>Also: I don't think Legato's particular \"stress angle\" is very relevant*, and neither is vertical versus horizontal pattern**. To me the key to Legato is that it \"breaks\" the Black and connects the White, balancing their relationship***, thus creating better boumas. When Evert makes a serif font on this principle then we'll really see a new chapter in readability. <br> <br>* Even though some people, like Jan Middendorp, have gleefully exclaimed \"Look, the pen, look!\" But it's not there. Just like Gary Much once saw the pen in my Paphos \"j\", but I can assure you it's not there. <br> <br>** Note: not \"rhythm\", because there is no flow. <br> <br>*** You could say making it a healthy marriage, not an owner&amp;slave relationship. <br> <br>-- <br> <br>&gt; .... visible as on the photo.  <br> <br>That's too much impression - bad for readability. <br>The degree of pressing that I think helps readability is <i>subvisible</i>. <br> <br>Notan is indeed a Japanese term (there is no equivalent in Western lanaguages that I know of - and I think this is itself telling), but ironically the letter-making crafts in the Orient are even more Black-centric than in the West! On the other hand, cross-character relationships are a lot less important in Chinese for example than in Latin. <br> <br>&gt; In the same way offset will never be able <br>&gt; to replace all the aspects of letterpress <br> <br>I agree, but my personal concern is to replicate what <i>is</i> possible, and to me the readability advantage of letterpress is. Running your hands over the bumps (which should be barely tactile however, not impressed up the wazoo) is not replicable - although that doesn't make me very sad. <br> <br>Also, don't forget photopolymer letterpress, which allows digital type to replicate the whole deal. Unless you think irregularity (I mean the true kind, different than intentional variance) is anything more than bad craft. <br> <br>&gt; you could also try the effect of random irregularity <br> <br>No, that's not the type of thing I'm talking about. That is indeed fake. <br>Like Johnny von Neuman said, real irregularity can never be intentional anyway. <br> <br>&gt; the unsharpness of the phototype era <br>&gt; is the dark age of typography to me. <br> <br>Me too, but I'm speculating that that's what we're taught these days: the \"outstanding\" feature of phototype was blur, so that's what is remembered. But maybe there was a period towards the end that -were it not for the lousy fonts generally used- the effect was closer to letterpress than we're at now. I admit it's speculation though. <br> <br>hhp</p>"
