    <p>one of the most noteworthy font releases of this year has got to be <a href="/wiki/ff%20legato" class="freelinking" rel="nofollow">legato</a> by <a href="/wiki/evert%20bloemsma" class="freelinking" rel="nofollow">evert bloemsma</a>. being a curious sort, i had a peek at the outlines. i was surprised that rather a lot of points are being used to describe the curves.</p>
    <p>the green i is the legato outlines, the orange i is what i would have *expected* to see (ie minimum number of points)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/53823_6180.gif"></div><p></p>
    <p>i wonder if additional points are being added at the 'font development/output stage' (ie. after the glyph has been drawn). if that's the case, why exactly? is it something to do with format conversion?</p>
    <p>typophile input welcomed.</p>
    <p>cheers</p>
    <p>geraint</p>
