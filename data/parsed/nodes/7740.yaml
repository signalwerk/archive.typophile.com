p, but then you have to see the damage done by the moving front (to reading). <br> <br>&gt; What do we do differently? <br> <br>All kinds of stuff. For example, Underware would use their huge talent and skill to make really really great fonts, instead of wasting time shackled to a relic, making just very good fonts. Once you admit something, things inevitably change. I have no problem with a designer saying that he makes chirographic fonts because his clients want it, or his designer friends think it's cool. It might make me sad, but not angry. Denial makes me angry. <br> <br>It would be great though if this wasn't a hypothetical question - let's work on that. <br> <br>hhp</p>"
