    html: "<p>wow. thanks for this exposition, evert. the univers example you use is telling: i see the slightly 'cupped' terminals of this sample replicated in the legato outlines, for example. <br> <br>so, if i understand you correctly, these design features restore tension in the black/white balance: a more subtle thing than distressing/replicating letterpress artifacts. but what would legato look like if printed letterpress via polymer plates? <br> <br>the font can't have been easy to hint either<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> but the 'tension-giving' properties of the curves is only one of legato's innovations. i think you've done an amazing job.</p>"
