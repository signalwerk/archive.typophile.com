    html: "<p>Always the same circular shenanigans. <br> <br>I'm not talking about enforcing design practice. I'm not interested in condemning how some (most) people make fonts (or shapes) and how some people choose fonts, or anything like that. What I'm trying to do is simply get people to admit that chirography is anti-readability. That's all. That's plenty, since it will simply cause some people to make better fonts. Others can keep making their type any damn way they please. I'm talking about ideological integrity, about what type is, not how people should act. <br> <br>&gt; His point regarding your Paphos j, wasn't that <br>&gt; he thought you had made it with a pen, but that <br>&gt; he could have made it with a pen.  <br> <br>Wrong. Where did you get that? <br>He said he was happy that I'd come to incorporate ductus into my work. Puhleez. <br>It's in the Typo-L archives. <br> <br>And of course Gary can make any shape with a pen. Just like I can go to the grocery store crawling on my back, naked. The point is: why? The answer is: chirography is <i>easy</i>. It reduces the need to <i>think</i>, the need to <i>change</i>. <br> <br>Damn script fonts and revivals of Swiss grot junk sell much better than Legato, and get more peer accolade. That's all the reason <i>some</i> people need. Not me. <br> <br>hhp</p>"
