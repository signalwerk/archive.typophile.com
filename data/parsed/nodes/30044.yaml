    votes: null
    html: |-
      <p>Esta is a very nice looking font, and I’m sure it could work well, but I don’t think it will work _as_ well for on-screen PDFs. </p>
      <p>Warnock was designed with on screen use in mind. See the <a href="http://www.adobe.com/type/browser/pdfs/WarnockPro.pdf">specimen book.</a></p>
      <p>Also, the fact that it’s a very full featured OpenType font could matter, depending on the demands of your text, and if you’re using an OpenType savvy app.</p>
