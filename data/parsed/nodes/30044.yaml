  html: |-
    <p>I’m going to be typesetting a series of transcripts of discussions of latest trends in treatment of medical disorders. These will be published in PDF format for both on-screen reading and printing off the web. The audience will be physicians.</p>
    <p>I’m looking for ideas for fonts for the main body of text as well as headers, titles, etc. There should be a certain gravitas to the results, so I’m looking for thoughts on font combinations as much as individual recommendations.</p>
    <p>Thanks!</p>
