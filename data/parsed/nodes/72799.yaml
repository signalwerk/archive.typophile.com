      <p>Well, as for font suggestions, <a href="http://www.google.ca/search?q=celtic+fonts" rel="nofollow">google "Celtic Fonts"</a> or similar terms. You could also use the category/tag systems on sites like <a href="http://new.myfonts.com/tags/Irish/" rel="nofollow">myfonts</a>.</p>
      <p>I'm not sure whether "vector font creation" is the correct thing to look for. You will probably find tutorials for <a href="http://www.fontlab.com" rel="nofollow">FontLab</a> and <a href="http://fontforge.sourceforge.net" rel="nofollow">FontForge</a>, both of which allow you to design the single letters instead of whole pieces of artwork. Instead, get Inkscape and look through the <a href="http://inkscape.org/doc/index.php?lang=en" rel="nofollow">online documentation</a> (or just play around for a bit, that works too). There are also some great screencasts on Youtube that explain vector programs quite well.</p>
      <p>If you want typographic advice on how to draw good letters, I'd say look around in this forum. There are many threads like <a href="http://typophile.com/node/72465" rel="nofollow">this one</a> with plenty of links to type design tutorials.</p>
      <p>Cheers!</p>
