      <p>Wow. A 19-letter ambigram is a tough piece of work, and I think you did a pretty good job already. I would love to offer some help but I feel like I'd need a lot of time to find ways to improve it, and I really have to go to bed early tonight :-)</p>
      <p>One question though: Have you considered using a vector drawing tool to do this? If not, I'd suggest you do. <a href="http://www.inkscape.org" rel="nofollow">Inkscape</a>, for example, is free and awesome. It may take an hour to get used to, but it'll be worth the time, particularly for your project where you have to duplicate the halves all the time.</p>
