      <p><cite>"a good body/heading combination of fonts to me that would suit well the theme that I’ve described (if it makes any difference that is)."</cite></p>
      <p>Just an idea – how about porting the open source issue over to your design, i.e. resorting to open source fonts only? One former fellow student of mine did that – her thesis focused (inter alia) on collaborative design / content generation and public domain stuff, so she ended up setting the thing in Linux Libertine. It wasn't perfect in terms of looking super-sleek and "designed", but it was a statement that was true to the content.<br>
      Unfortunately I myself don't know enough about the OS font scene to make any cogent suggestions. Except you might look at <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a> for text.</p>
      <p><em>"I’m not even sure if there is a rule of using serifs for headings and sans for bodies, or vice versa"</em></p>
      <p>Most of the good text fonts are seriffed. For headings, you have more liberties.</p>
