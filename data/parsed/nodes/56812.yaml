      <p>Have you tried printing with Arno? It's a great text face, and has a nice color. But since you seem to be looking for something else, you could try Chaparral. It's a slab serif though, and it might look quite friendly. Or perhaps Warnock? They're usually packed with Adobe Creative Suites, so if you have InDesign or Photoshop, you'll probably have those that I mentioned.</p>
      <p>I haven't seen DejaVu Serif in print, nor Liberation Serif, but they're free. I think they also come with Fedora? Museo Sans could also be a viable header. Delicious kinda looks bad in print, though.</p>
      <p>Adobe InDesign doesn't compare to OOo or Word; it's great. You can even just load in the text from a source file. You can also access extra glyphs from your fonts (for example, Fertigo's F insignia, or Diavlo's little devil).</p>
      <p>But, of course, OOo will usually suffice for papers. :)</p>
