    <p>Hello,</p>
    <p>I've been working on a thesis paper for the past two years and I'm about to defend it in a week or so, and consequently print the sucker. This thesis is in architecture and it is focusing on the open source, the authorship paradigm, network practices, and other issues of collaborative design.(arch1k.wikidot.com)<br>
    Would someone be kind to suggest a good body/heading combination of fonts to me that would suit well the theme that I've described (if it makes any difference that is).</p>
    <p>So far I've been using Fertigo Pro for headings and switching between Calibri and AGaramondLT for body. On screen Calibri makes more sense it seems and Garamond is nice on paper.<br>
    I'm not even sure if there is a rule of using serifs for headings and sans for bodies, or vice versa.(Clearly I'm a n00b in the font world)<br>
    I have Helvatica Neue, Universe, Frutiger out of the fancy sans, and Constantia, Garamond Premiere Pro for fancy serifs. I can also use the fonts that came with Office 2007 or whatever else I can find in my linux system.</p>
    <p>Also, do all the cool kids use typesetting software or do the sometimes use OOo or MSWord and simply Find/Replace the all ligatures.</p>
  html_clean: |-
