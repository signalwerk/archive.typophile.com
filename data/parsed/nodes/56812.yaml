    html: |-
      <p>Since you're running a Word Processor with limited typographical capabilities, my suggestion would be to use a typeface that doesn't require ligatures. Also, since theses are usually required to be set at twelve points with ungainly wide textblocks, and you're probably not going to print at higher than 600pdi, you'd want something fairly sturdy looking. Constantia will work well under these circumstances, even without being able to use its more advanced features in OOo.</p>
      <p>If you have Arno, then you either have Adobe CS3 or you some version of Adobe FontFolio. If you have CS, your thesis would benefit greatly from using it (provided you know how to use it!). I am presently typesetting my thesis in InDesign with Arno Pro, and it is possible to get a very good result this way. <a class="freelinking external" href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1717" rel="nofollow">Chaparral</a> and <a class="freelinking external" href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1709" rel="nofollow">Warnock</a> would also suit your project well if you were using CS.</p>
    html_clean: |-
