      <p>&gt;&gt; Would simply substituting all the ligatures in OOo get a half decent result?<br>
      Unfortunatley, no. In OOo you still can't use proper superscript numerals for footnotes, and the hyphenation and justification in Open Office is poor, to name just two reasons. You'd be better off setting the text ragged right with no hyphenation.</p>
      <p>LyX (LaTeX) will give you very good results, too. But importing a long document into tex format might not be quite seamless. I've never tried it. Depending on when your deadline is, I could help you set up your templates in CS to get things working well. After Wednesday, I would have time to help you with this. </p>
      <p>Keep in mind that if you didn't use styles consistently in your OpenOffice doc, much work will be involved in adapting it in InDesign. Depending on your time constraints, this is definitely a factor to consider.</p>
