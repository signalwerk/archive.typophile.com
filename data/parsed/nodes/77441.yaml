    html: |-
      <p><em>So the term "design a font" is perhaps too ambiguous to properly criticize in this fashion.</em></p>
      <p>Not so.<br>
      If one is going to ask this sort of question at Typophile, then one should be apprised of elementary mistakes in terminology.<br>
      A collection of glyphs is not a typeface, especially if it has never been made into a font and never been used for setting type.<br>
      It could at best be described as "a design for a typeface", in the way that an architect's plans may be termed a design for a house.</p>
