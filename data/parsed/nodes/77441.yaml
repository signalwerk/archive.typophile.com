    html: |-
      <p>Getting the meaning of words correct is important. Thus, I will not criticize Kent Lew for pointing out that creating the outlines of glyphs does not, itself, constitute the creation of a font, even if it is the design of a typeface.</p>
      <p>However, while it isn't the creation of a font, if it is the design of a typeface, then it is also the design of the important part of fonts which implement that typeface. One can indeed say that designing a font may also involve setting up the hinting and the kerning, but it is possible to skip those steps and just push a button and have a font of sorts created from a set of character outlines. So the term "design a font" is perhaps too ambiguous to properly criticize in this fashion.</p>
