    <p>I have designed a font called Heisenberg and have the (limited) ability to transfer it from Illustrator into Fontlab. Just wondering what the next step is? I know professional foundries can master fonts (hinting etc) for you but it costs a bomb.</p>
    <p>Anybody know how one goes about geting in touch with the finer points of font making?</p>
    <p>Cheers</p>
    <p>Matte</p>
