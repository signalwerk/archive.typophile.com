    html: |-
      <p>I agree with frank. I've met several designers with great ideas for typefaces, but never coming to the point of realizing for lack of time and practice. A cooperation with either a type designer or a foundry would help to bring these fresh ideas into production.</p>
      <p>I also remember that igizio marini offers <a class="freelinking external" href="http://ikern.com/k1/" rel="nofollow">iKern</a>, a service for spacing and kerning, which would normally take up a bulk of time and a lot of experience to complete. I know that Jos Buivenga (of Calluna and Museo fame) has also used this service for some of his fonts and it seems to work quite well. You already need to have all your character set completed in fontlab though, so perhaps you could start on that.</p>
      <p>And if you plan to import your illustrator drawings in fontlab, make sure not to have to scale them in fontlab, as this will cause a lot of distortion. the x-height of your letter needs to be 1000 points high if I remember correctly, to import at 100 percent in fontlab.</p>
