      <p>Matte,</p>
      <p>If you decide to proceed on your own with this, I strongly recommend ScanFont, from the FontLab folks. It's only $99 or so and it makes importing Illustrator outlines into FontLab a breeze. If you set up your Illustrator outlines in any kind of alphabetical order, you can bring them all into the correct code points in FontLab in a blink of an eye.</p>
      <p>I never leave home without it.</p>
