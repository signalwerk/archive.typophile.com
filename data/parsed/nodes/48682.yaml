    <div class="info">Submitted by <a href="/web/20081122114801/http://www.typophile.com/user/1160" title="View user profile.">Joe Pemberton</a> : 21.Aug.2008 11.30pm </div>
      <p><a href="https://web.archive.org/web/20081122114801/http://www.punchcut.com/">Punchcut</a> presents the <strong>Typophile Film Fest 4 at ATypI ’08 St. Petersburg</strong>. The Film Fest is an unequaled selection of short typographic films hailing from designers in Portugal, The Netherlands, Austria, Canada and the US. The films are a mashup of motion design, typographic animation and short stories including broadcast motion design, documentaries and typographic eye candy from Trollbäck + Company, Strange Attractors, Heebok Lee, Nick Shinn, Juan Leguizamon as well as exclusive interviews and cuts from the acclaimed documentary film <em>Helvetica</em>. </p>
    <p><strong>THANK YOU FONTSHOP</strong></p>
    <p>Typophile owes its sincere gratitude to <strong><a href="https://web.archive.org/web/20081122114801/http://www.fontshop.com/">FontShop</a></strong> for making this presentation at ATypI possible. Thanks also to <a href="https://web.archive.org/web/20081122114801/http://www.atypi.org/">ATypI</a> for including the Film Fest in the 2008 conference programme. </p>
    <p>/////</p>
    <p><strong>DETAILS</strong></p>
    <p><em>ATypI ’08 St Petersburg</em></p>
    <p>Screening: 5:20-6:20pm<br>
    Date: Friday 19 September, 2008</p>
    <p>Beloselsky-Belozersky Palace<br>
    Nevsky Prospekt 41<br>
    Russian Federation</p>
    <p>Admission: Free to ATypI attendees</p>
    <p>/////</p>
    <p><strong>ABOUT ATypI</strong><br>
    ATypI, Association Typographique Internationale, is a global forum and focal point for the type community and business. ATypI’s annual conference draws hundreds of worldwide participants. // <a href="https://web.archive.org/web/20081122114801/http://www.atypi.org/">http://www.atypi.org</a></p>
    <p><strong>ABOUT TYPOPHILE</strong><br>
    Typophile is an international collaborative community of graphic designers, typographers and type designers. Typophile is driven by sharing and the idea that we’re always learning. Now in its eighth year, it is one of the oldest design communities online. Typophile is a Punchcut brand. // <!--
