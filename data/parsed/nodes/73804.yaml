    html: |-
      <p>PROOF 4</p>
      <p>option 1:<br>
      get rid of the tree all together. extend the line so it is the width of the 3 b's, or get rid of the line. The b's and your text are nice enough to stand on their own, right now they are in competition with the tree.</p>
      <p>option 2:</p>
      <p>get rid of the b's, and just focus on the tree, make it a lot smaller in proportion to the text (make it roughly the size that the b's are.</p>
      <p>PROOF 5:</p>
      <p>Ditch the tree all together. </p>
      <p>The tree makes a nice water color painting but not that great of a logo, its gestalt is not compact enough. unless you make it a really small element that compliments your nice type. but you're type is good enough to be a logotype for sure. just stick with that.</p>
