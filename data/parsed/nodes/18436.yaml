      <p>FYI --<br>
      the bouncy informal style lettering was known as <a href="http://www.myfonts.com/search?search%5Btext%5D=frisky" target="new" rel="nofollow"><em>Frisky</em></a> which yields over 1000 results (not all valid) when used as a search term on MyFonts.com.</p>
      <p>As Stephen listed above, several foundries are well know for that particular style (House Industries, Font Diner).<br>
      <a href="http://www.houseind.com/index.php?page=showfont&amp;id=150&amp;subpage=ed_features" target="new" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.houseind.com/index.php?page=showfont&amp;id=150&amp;subpage=ed_features" target="new" rel="nofollow"><img src="http://typophile.com/files/EdB.jpg"></a></div><br>
      One of the most prolific designers of frisky lettering is <a href="http://www.houseind.com/index.php?page=showfont&amp;id=150&amp;subpage=ed_features" target="new" rel="nofollow">Ed Benguiat</a> (though many of his designs from Photolettering, Inc. have not been digitized).<p></p>
      <p>A current designer with a passion for being frisky is Jakob Fischer, the <a href="http://www.pizzadude.dk/home.php" target="new" rel="nofollow">Pizza Dude</a></p><div class="imageWrap"><a href="http://www.pizzadude.dk/home.php" target="new" rel="nofollow"><img src="http://typophile.com/files/pizza1.gif"></a></div><p></p>
