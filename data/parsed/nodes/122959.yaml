  - id: 598553
    user: 205259
    date: 2015-01-31T05:58:00
    date_raw: 31 Jan 2015 — 5:58am
    votes: null
    html: |-
      <div class="comment-spam-body"><p>I am not clear as to whether you are looking for a rough or smooth base font to uses as a basis for redrawing.<br>
      For a rough font consider Chancellor </p><div class="imageWrap"><img src="http://typophile.com/files/ChancellorAsSGWREHNMAK_5624.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/pintassilgo/chancellor/" title="http://www.myfonts.com/fonts/pintassilgo/chancellor/">http://www.myfonts.com/fonts/pintassilgo/chancellor/</a><br>
      Also Berliner Grotesk BQ Med <div class="imageWrap"><img src="http://typophile.com/files/BerlinerGroteskBQMedAsSGWREHNMAK_6301.gif"></div><br>
      <a href="http://www.linotype.com/261314/BerlinerGrotesk-family.html" title="http://www.linotype.com/261314/BerlinerGrotesk-family.html">http://www.linotype.com/261314/BerlinerGrotesk-family.html</a><br>
      <a href="http://www.fonts.com/font/berthold/berliner-grotesk-bq/volume?SiteId=15" title="http://www.fonts.com/font/berthold/berliner-grotesk-bq/volume?SiteId=15">http://www.fonts.com/font/berthold/berliner-grotesk-bq/volume?SiteId=15</a><br>
      would work.<br>
      EDITED ADDITIONAL INFO:<br>
      This style of lettering seems have originated with Lucian Bernhard's  Sachplakat --object poster or Plakatsil -- lettering. From about 1908 onwards versions were produced by German type makers such as  Heinz Hoffmann, who designed the Block fonts <div class="imageWrap"><img src="http://typophile.com/files/BlockBQAsSGWREHNMAK_6507.gif"></div> <a href="http://www.myfonts.com/fonts/berthold/block-bq/" title="http://www.myfonts.com/fonts/berthold/block-bq/">http://www.myfonts.com/fonts/berthold/block-bq/</a><br>
      Don<p></p>
      </div>
