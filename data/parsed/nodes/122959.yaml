    html: |-
      <p>I am not clear as to whether you are looking for a rough or smooth base font to uses as a basis for redrawing.<br>
      For a rough font consider Chancellor <img src="/sites/default/files/old-images/ChancellorAsSGWREHNMAK_5624.gif"><br><a href="http://www.myfonts.com/fonts/pintassilgo/chancellor/">http://www.myfonts.com/fonts/pintassilgo/chancellor/</a><br>
      Also Berliner Grotesk BQ Med <img src="/sites/default/files/old-images/BerlinerGroteskBQMedAsSGWREHNMAK_6301.gif"><br><a href="http://www.linotype.com/261314/BerlinerGrotesk-family.html">http://www.linotype.com/261314/BerlinerGrotesk-family.html</a><br><a href="http://www.fonts.com/font/berthold/berliner-grotesk-bq/volume?SiteId=15">http://www.fonts.com/font/berthold/berliner-grotesk-bq/volume?SiteId=15</a><br>
      would work.<br>
      EDITED ADDITIONAL INFO:<br>
      This style of lettering seems have originated with Lucian Bernhard's  Sachplakat --object poster or Plakatsil -- lettering. From about 1908 onwards versions were produced by German type makers such as  Heinz Hoffmann, who designed the Block fonts <img src="/sites/default/files/old-images/BlockBQAsSGWREHNMAK_6507.gif"><a href="http://www.myfonts.com/fonts/berthold/block-bq/">http://www.myfonts.com/fonts/berthold/block-bq/</a><br>
      Don</p>
