      <p>Paul,<br>
      consumer goods, especially high tech goodies like cell phones and iPods, the unit price is so cheap, and by comparison the cost of labor so high---having them serviced doesn't make much sense.</p>
      <p>Scott,<br>
      the bearing of a hard drive collapses if the disk has done enough revolutions. A collapsed hard drive bearing makes a distinctive loud whining noise. When that happens it's time to get all the data off before it stops for good. Or if you hear that whining noise begin to develop it indicates a bearing on its way out. Hard drives also sometimes develop a condition known as "stiction"---a portemanteau word for static + friction. The simple cure for stiction is to pull the drive out, grasp it horizontally and give it an abrupt twist (in the horizontal plane) of your hand.</p>
      <p>Tiffany,<br>
      (much laughter) test load for a trebuchet, perfick! A mate of mine who makes computers calls a superseded computer a "boat anchor".</p>
      <p>j a m e s</p>
