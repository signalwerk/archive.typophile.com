      <p>I've used the blunt force method to resurrect several Macs and hard discs over the years (used to run a university lab full of 'em). When all else fails, the right amount of force applied to just the right spot can work wonders... or at least get you to a point where you can copy the files off.</p>
      <p>My question is this: what do you think is the best/most creative use for a dead hard drive mechinism? I've toyed with the idea of explosives, and toilet bricks, but I'm looking for more interesting ways to destroy them (excuse me... "recycle" them).</p>
