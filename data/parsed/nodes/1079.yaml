    html: <p>&gt;FontLab or DTL's FontMaster.  <br>&gt;The former is very powerful, the latter is designed by type &gt;designers.  <br> <br>With the amount of feedback given by the type design community in the development of FontLab, I think you can say that FontLab is designed by type designers as well <br> </p>
