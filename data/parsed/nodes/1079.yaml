    html: <p>I have spent only the last couple of weeks using FontLab, and I am quite addicted. It is a very intuitive program, and very user friendly. The bezier operations  <br>are so smooth and natural to use. I know it has a truck  <br>load more features to it, but I will get around to them. In  <br>short, it is probably the most kick a$$ program I have  <br>ever used. I am very much a beginner, with no  <br>experience of Fontlab or Fontmaster. (Man cannot live  <br>on fontlab alone...) <br> <br>And DTL have a free download  version of their  <br>software, so you could give them a blast and see what <br> you think.</p>
