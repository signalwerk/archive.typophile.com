    html: <p><a href="http://www.typophile.com/forums/messages/72/14945.html">FontLab</a> is the most commonly used professional tool now, and is probably the best bet. If you are looking for a cheaper alternative, and don't need all the features of FontLab, you might find their TypeTool to be appropriate.</p>
