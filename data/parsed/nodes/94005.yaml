    html: "<p>И: In isolation it looks unstressed, but in context you can see that the verticals are lighter than most verticals and the diagonal is heavier than most horizontals, which indicates the normal stress of a Latin N. For И, start with an H. With regard to the weight of the verticals and how far apart they are, you want it to be as similar to H as is reasonable.</p>"
