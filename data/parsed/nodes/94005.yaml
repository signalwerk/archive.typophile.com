    html: |-
      <p>Okay, I have just updated with a PDF sample of my work thus far. (Please forgive the poor spacing and lack of kerning!) It includes all the uppercase Latin and Greek as well as all but three of the basic Cyrillic capitals. At this point, I am already aware of a couple of issues. I have difficulty giving Xi enough weight and maintaining balance between the top/bottom strokes and the middle one. (Any advice?) I'm also feeling as though Theta and Phi (also Cyrillic Ef) aren't quite right. I also think that the whole Cyrillic alphabet has some width inconsistencies to it, but I can't tell which particular glyphs are producing this problem.</p>
      <p>Also, I've included a couple of alternates for Cyrillic (De and El) similar to the forms seen in, for example, Paratype's <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/quartal/extended-heavy/glyphs.html" rel="nofollow">Quartal</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/mellnik-text/heavy/glyphs.html" rel="nofollow">Mellnik Text</a> or 4th February's <a class="freelinking external" href="http://www.myfonts.com/fonts/4thfebruary/neultica-4f/black/glyphs.html" rel="nofollow">Neultica 4F</a>. My concern, though, is that these alternates might clash with the (purely stylistic) alternate Latin A. Would it be sufficient to simply separate these alternates using OpenType language-specific features, or is it better to omit the alternate A entirely?</p>
