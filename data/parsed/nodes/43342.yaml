    <p>Hello all,<br>
    Are you interested in Open Source Multimedia Trainings?</p>
    <p>I would like to inform you about TOSMI – an open source CGI and multimedia training for professionals organized by InterSpace. The 2008 training will cover the fields of 3D CGI, post-production, animation and special effects, media content for the web, web TV and e-marketing. The training is mainly based on open source software and provides skills in innovative and efficient tools and distribution channels allowing for achieving quality production and/or education process at low expenses. Therefore we believe the sessions can be of advantage to professionals, managers and trainers in the audiovisual production and marketing.</p>
    <p>In 2008 the training will take place in Thessaloniki (Greece) and Sofia (Bulgaria) and will be available in three sessions:</p>
    <p>  General Blender techniques, tips and tricks</p>
    <p>  Media content for the web, e-Marketing, streaming techniques</p>
    <p>  Advanced Blender techniques, external rendering engines, Python scripting</p>
    <p>Deadline for enrollment is 10th of April.</p>
    <p>Each session has a participation fee of 1000 Euro. Scholarships will be available.</p>
    <p>To learn more about the program, methodology, software included and trainers, visit <a href="https://web.archive.org/web/20080907032213/http://tosmi.org/" title="http://tosmi.org">http://tosmi.org</a><br>
    For more information feel free to contact us at <a href="https://web.archive.org/web/20080907032213/mailto:info@tosmi.org">info@tosmi.org</a>.</p>
