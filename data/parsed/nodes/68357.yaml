  html: |-
    <p>I'm trying to render following Indic Script unicode text :</p>
    <p>जितेन्द्र कुमार</p>
    <p>in a  a photoshop text layer. While this text in 'Arial Unicode MS' font gets rendered correctly in Firefox, IE, MS Word etc, text is rendered incorrectly in Photoshop CS3 (using the same font).</p>
    <p>Please see visual differences in this image. Please scroll it horizontally.<br><img src="/sites/default/files/old-images/unicode-error-photoshop_3932.PNG"></p>
    <p>And irony is that this text is rendered correctly in 'layer name'. Please see this image.<br><img src="/sites/default/files/old-images/unicode-error-photoshop2_6717.PNG"></p>
    <p>I've also tried all the combinations available in 'opentype' menu but still no luck. In fact most of the options are grayed out. Please see this image.<br><img src="/sites/default/files/old-images/unicode-error-photoshop3_4143.PNG"></p>
    <p>It truly seems some problem related to 'Ligatures' but only one ligature option ie 'Standard Ligatures' was available. Turning on/off that option didn't help either.</p>
