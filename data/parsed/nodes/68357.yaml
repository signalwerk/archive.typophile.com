    html: |-
      <p>understack:</p>
      <p>&gt; One thing which I don't understand if it doesn't support Indic scripts in CS3, how come text is rendered correctly in layer name. </p>
      <p>This because the "layer" name is rendered via XP renderer.</p>
      <p>If you only need those two words, you should use our backwards compatibility non-Unicode font "Sanskrit 99" downloadable at my Sanskrit website here</p>
      <p><a href="http://www.sanskritweb.net/itrans/#SANS99">http://www.sanskritweb.net/itrans/#SANS99</a></p>
      <p>After having installed this font, which also works with non-Unicode-savvy Adobe applications, enter the following</p>
      <p>ijteNÔ k…mar</p>
      <p>and mark it up with the "Itranslator 99" font. That's it.</p>
      <p>The result should look like this:</p>
      <p><a href="http://www.chillingeffects.de/temp4.jpg">http://www.chillingeffects.de/temp4.jpg</a></p>
