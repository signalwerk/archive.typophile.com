    html: <p>&gt;The drawing rooms came about as a result of the fierce composition between Lino and Mono. <br> <br>Perhaps, but there would have been no drawing rooms without the pantograph (or later, photographic techniques) to enable the division of labor. <br> <br>My point is that the division of labour in type design is a mainly 20th century phenomenon. Prior to that, type design and initial font manufacture were done by one person. The punchcutter was the designer. (With the exception of l'Imprimerie Royale typeface.)  <br> <br>Within the last 20 years, digital media has made the one-person model practical again, as it was for the first 400+ years of typography. So it's a little facile to diss today's one-man shop, when it has such a pedigree.</p>
