    html: <p>&gt;My point is that the division of labour in type design is a mainly 20th century phenomenon...The punchcutter was the designer. (With the exception of l'Imprimerie Royale typeface.)  <br> <br>Sorry, Nick - just the opposite. The Romain du Roi is but one of the earlier known examples of teamwork. The more we know about the design of any given historical typeface, the more it appears to be a matter of team work. Bell supervised his punchcutter Richard Austin, the Didots supervised their punchcutters Vafflard and [forgot his name for the mo], William Morris and his followers supervised Prince the punchcutter (at a shilling a letter), and so on.  <br> <br>Someone who is skilled at punchcutting is unlikely to be skilled at fitting, and those skilled at either are unlikely to be very sensitive to design. Punchcutting is a pretty dingy job, and it appears to have been undertaken primarily by drudges. To speak of a great pedigree for today's one-man shops is a bit of a stretch. Indeed, our one-man shops of today, most of which do not have the resources to build anything beyond fleeting novelty types, could do worse than follow their predecessors in the letterfounding industry, and amalgamate. This is especially true of designers who have not served long apprenticeships or received the comprehensive sort of education that the Dutch system gives and even that not necessarily with the ability to achieve anything of value as lasting as the works of van Krimpen and Hartz. Type is not for egomaniacs, really. Of course it is painful to have another pair of eyes standing over you, criticizing, perhaps, or even taking out of your hands, entirely, the fitting of your beloved design. But the design usually benefits. The more eyes, the better the design. <br> <br>To return to target, it has never been established that there is any author of the typeface Bembo. Since it is probable that Morison would have grabbed the credit if he possibly could, it is equally obvious that it must have been so collaborative a process that there was general agreement to describe it as a corporate achievement. But it would be nice to know more, and I am fitfully trying to find out.  <br> <br>One thing I'd say is that if you look at the display sizes of Bembo, or the drawings, the design seems much more its period, the late 1920s, than it does of any ancient time. Yet when text is printed by letterpress, many of those features are obliterated, and the type seems to have a more timeless quality.</p>
