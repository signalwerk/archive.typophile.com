    html: <p>There. You have summarized in remarkably few words and with incredible clarity the entire range of problems in digital type as applied to fine printing. As I think I have argued with Gerald before, the problem with photopol vis a vis letterpress is not, in the first place, the deficiencies of photopol, such as they may be. The primary deficiency is the vaccum of size-optimized types digital types. That said, there is now, in the entire digital universe, a single family which contains some correctly size-optimized types, namely Stone's Cycles. The primary goal of this family is obviously not to be ideal for photopol printing but, Gerald, have you tried them? Do they work with photopol? And regarding the darkness of Bembo Book and photopol, it would be interesting to know if it would come out darker than, say, the Bembo in Talley of Types, which I remember as too dark. <br> <br>The glory of letterpress is that the types were optimized by large teams of experts to work as best as possible for the printing machines of the day. The only problem with photopol is that nobody is out there optimizing type for these deserving workers. Why isn't this happening?  <br> <br>It is easy enough to say that the problem is money, but if that is so, where is the patronage? Why doesn't someone organize a foundation to provide future support for modern letterpress printing techniques?</p>
