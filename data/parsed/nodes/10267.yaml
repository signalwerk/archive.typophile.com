    html: "<p>Not for the first time, I wonder if people interested in digital fonts ever actually print books? If they did, they'd be using metal Bembo!  <br>Digital is for pikers!  <br> <br>That said, Robin appears to have supplied at last a correctly designed Bembo from Monotype. There have been excellent digitizations before: Berthold's, which had no f ligs, and Scangraphic's (on which Volker Küster worked) which had incorrect f ligs. Bembo without five f ligs is not Bembo. Word shapes simply aren't correct without them. I have no doubt that this Bembo supplies them.  <br> <br>The important issue here is that the forms are more or less correct. The question is the degree of interpolability with the bold? Stem width of metal Bembo varies tremendously, according to how deep or wet the impression is, and all varieties are welcome in metal. We need this freedom in digital as well.  <br> <br>My only criticism is that Robin appears to have missed the chance to correct one of metal text size Bembo's faults, which is that the stem of a seems to veer too far to the left. It needs just a slight adjustment to correct. On the other hand, it doesn't really seem to be important, does it? More beautiful books have been printed in metal Bembo in the last 80 years than any other font. <br> <br>Consider too that in metal, distance between letters will be the same no matter what the impression is, yet spacing will appear to be considerably tighter with a heavy impression, since ink spread decreases the spaces between letters substantially.  <br> <br>So you have a kind of variable spacing built into metal.  <br> <br>Still, no matter what you do, there is no beating metal Bembo. Nothing else comes close. <br> <br>Now all we need is a display size, and a small text size.</p>"
