    html: "<p><i>Do you have many fine books like these?</i> <br> <br>I don't have many books printed by the great names of the past like Baskerville: I mainly collect grammars and books about non-Latin writing systems, especially palaeography. I picked up four Baskerville volumes cheaply, because the bindings were damaged and two of the books were part of a set missing the third part. I'm going to keep the two Miltons and have the bindings repaired, but I'm intending to donate the two odd volumes to the ATypI fundraising auction. <br> <br>Of the digital Baskervilles, Storm's looks the most promising to me. In a similar neo-classical genre, but with more French influences, there is <a href=\"http://www.tiro.com/Plantagenet/plantagenet_index3.html\">Plantagenet Novus</a>. [Note that this webpage is preliminary, so some links are inactive and struck out.]</p>"
