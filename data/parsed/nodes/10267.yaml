    html: "<p>&gt;Not all, I think.  <br> <br>No, of course not. Did I, as usual, say 'all'? By that I usually mean most.  <br> <br>&gt;are there any copies of ATF cutting slips (data sheets) extant? <br> <br>I think Mac McGrew has some, though I haven't talked with him in a year or two; he wasn't doing well and was suffering from macular degeneration and is now I think well over 90. The Smithsonian has tons of material, but I doubt it would do you much good.  <br> <br>It is perfectly possible to determine the fitting pretty accurately by measuring prints, and that is probably faster than anything else.  <br> <br>It is usually the case that fitting of nearly any historical font follows well-established rules, so the principal interest is in establishing the values for straights and rounds, and the relationship thereof, and noting any interesting exceptions and overhangs. <br> <br>One thing to keep in mind: both Mono and Lino suffer from their respective unit systems and ATF does not. Unit restrictions may account for fitting differences between sizes that might at first glance seem counterintuitive in a Mono or Lino face, especially where there is reason to suppose that the master drawings are the same. (Regardless, the master drawing does not necessarily contain every optimization that was in practice made.) <br> <br>I still think Mono and Lino understood great printing better than ATF. There is little in ATF's text range that stands up to the best Lino and Mono designs. However, had the Mono/Lino teams not had their unit restrictions, they could have designed even better type.</p>"
