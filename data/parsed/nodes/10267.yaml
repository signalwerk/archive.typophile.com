    html: "<p>Bill, just in case you are unaware: Gerald Lange is a letterpress printer and, from what I've heard, a good one. So I doubt very much if he has 'trouble understanding the phenomenom of ink spread'. <br> <br>Most letterpress printers to whom I've spoken see ink spread as a result of overinking and too much pressure -- i.e. as errors, and poor printing -- not as a kind of 'variable spacing' feature. Can you really say that you are adjusting the apparent spacing of letters if, in the process, you are completely changing or obscuring the identity of those letters? <br> <br> <br>[As an aside, I used to have one of the old Chiswick Press books from first years of the 20th Century, and marvelled that they were responsible for the revival of interest in Caslon's types, because they printed them so heavily overinked on thick rag that the type was almost unrecognisable. This was an example of deliberate overinking, but their aim was not to tighten the spacing, it was to make Caslon look a black as a William Morris face, because that's what 'fine printing' meant in 1903.] <br> <br> <br>PS. Bill, did you see the response from Greg Hitchcock to the 'Visual Communication' thread, explaining the stem width variation?</p>"
