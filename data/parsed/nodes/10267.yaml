    html: "<p>The particular versatility you're ascribing to metal here is a bit misleading; the adjustment benefits you mention (like tighter spacing though intentional gain) come at the expense of certain things, like letterform fidelity/quality, impression pressure \"modesty\", etc. <br> <br>BTW, Stamperia Valdonega has a Bembo (along with a dozen or so other \"classic\" -read moldy- fonts) at multiple optical sizes. However, all their stuff is for \"internal\" use only: you can request their use when you have a book printed with them, but you can't use the fonts yourself. <br> <br>hhp</p>"
