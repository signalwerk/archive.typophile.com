  html: <p>So, has anyone had a chance to test the new <a href="http://monotype.co.uk/bemboAMT/">Bembo Book</a> from Monotype? (I wish Fonts.com would provide PDF samples, but the UK site does have one.)  <br> <br>If you have, can you say if the alternate (short-leg) cap R is included? The short-leg variant seems to be in the small caps only. That would be a shame.</p>
