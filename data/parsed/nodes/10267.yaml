    html: <p>I haven't looked at the new Bembo, but if it is thicker than the previous digital Bembo it is likely not that useful for letterpress (unless reconfigured with a font-editing program), which for some reason has gotten into this thread.  <br> <br>The orginal metal Bembo wasn't that great of a face technically as its design was a bit weak. Crossbars on lower case e's tended to disappear quite quickly. We were constantly ordering new sorts. Monotype, I think it should be pointed out, was never meant to be editioned with. It was initially simply a compositional strategy. Most early Monotype was printed via the stereotype process.  <br> <br>The photopolymer process, now often used in letterpress, provides a different structural relief, so the older digital Bembo actually performs better than the metal (with configuration) with this process.</p>
