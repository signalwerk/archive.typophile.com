    html: <p>&gt;size-optimized <br> <br>Size isn't the only "dimension" to the phenomenon. The quality of paper stock, and the quality of the press(work) have something to do with it also. <br> <br>An art director may specify a type for use at a size "larger" than its initial design would suggest, if legibility conditions are less than optimum. Printing in color or on colored stock, for instance. <br> <br>&gt;as best as possible for the printing machines of the day <br> <br>By the same token, with a high res digital workflow, printing offset on coated stock, a typeface like ITC Garamond Light Condensed works beautifully at small sizes, especially in catalogue work.  <br> <br>&gt;nobody is out there optimizing type <br> <br>Font Bureau's Poynter Old Style offers a range of weights for different press conditions, but may they not also be considered as size-specific variants? <br> <br>&gt;The glory of letterpress is that the types were optimized by large teams of experts <br> <br>Surely this division of labor only occurred after LB Benton's pantograph (1880s)? Prior to that, letterpress type manufacture was in the hands of the designer-punchcutter.</p>
