    html: <p>Bill <br> <br>Thank you for your explanation. However, I am somewhat familiar with the letterpress process. (I have been a practicing fine press printer-publisher for near thirty years now... <br><a href="http://BielerPress.blogspot.com" target="_blank">http://BielerPress.blogspot.com</a> <br> <br> <br>Ink spread is more the consequence of accumulated ink gain than it is impression. While a poor combination of the two will result in very pronounced ink spread it is quite possible to use a heavy impression with a light ink lay and have printed letterforms with no appreciable gain in their appearance. Conversely, a very light impression can have ink spread simply because the ink lay is too heavy. <br> <br>I can alter the thinness/thickness of the letterforms that I print on my laser printer by adjusting the toner density. Does this mean that digital type has built-in variable spacing? Of course not.</p>
