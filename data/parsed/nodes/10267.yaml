    html: "<p>&gt;Font Bureau's Poynter Old Style offers a range of weights for different press conditions, but may they not also be considered as size-specific variants?  <br> <br>Actually, POS is only one of many, many FB fonts that come in a variety of optical sizes. But Cycles remains the only family where optimization is taken out of the general realm and placed into the particular realm - which is the only way to do it right, although it means a phenomenal amount of work for the designer and is hardly economically rewarding. Only Sumner Stone has been willing to put this amount of time into contemporary design. Howes's Caslon is an attempt to get something like this going, but ... although it points the way, cannot be considered a usable type. Justin simply didn't know enough about type to do it right, in the time he had. <br> <br>&gt; especially in catalogue work <br> <br>Bingo: ITC Garamond is one of the most useful printing types and a wide variety of optical sizes can be effectively faked by skillful use of the existing MM from Adobe. As I have said a million times, if only it hadn't been called Garamond, a million more people would be using it. <br> <br>&gt;Surely this division of labor only occurred after LB Benton's pantograph (1880s)? Prior to that, letterpress type manufacture was in the hands of the designer-punchcutter. <br> <br>Not really. The drawing rooms came about as a result of the fierce composition between Lino and Mono. It simply was necessary to get better results than any one person could achieve. The great success of both companies funded the drawing rooms.  <br> <br>ATF was comparatively unsuccessful. It did not have those dozens of drawing girls drawing away (and probably deserving considerably more credit than they got - the question who really designed Bembo has never been satisfactorily answered). Moreover, although ATF size optimizations were nearly as good as Mono/Lino's, a skilled Pantograph operator did not need multiple drawings to make a range of size-optimized types. Mac McGrew has often told me how Benton would work from a single master drawing and make minute adjustments directly on the pantograph to accomplish the necessary optical adjustments. Some of these adjustments are recorded in existing ATF data sheets but nobody seems to know how to decrypt them. To give but one example, there is only one set of drawings for the typeface Benton (they now exist at the Smithsonian which kindly copied the huge italic drawings for Mac and me). All the adjustments necessary for small text up to display were made directly on the Pantograph. <br> <br>But there was only one Benton!</p>"
