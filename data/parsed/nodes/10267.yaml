    html: <p>Gerald and John, <br> <br>all I am trying to point out here is that the apparent spacing of a letterpress font varies _tremendously_ according to the method by which it is printed. This undeniably constitutes a feature of letterpress printing. It would be superfluous to add that where 'spacing is tightened' by overinking, there is also a kind of automatic bolding. I don't see why this should be in the least controversial.  <br> <br>Letterpress comes in countless variations. There is no right or wrong. Sloppy, overinked 17th century French presswork can be just as impressive and rewarding as the cleanest work of Baskerville or the Didots. It is just plain silly to criticize sloppy overinking when the results are nevertheless stunning. <br> <br>Gerald, although altering dot gain in a laser printer or an imagesetter can have useful effects, this does not come anywhere close to what can be achieved in letterpress. The lightest kiss impression on coated paper will have insignificant ink spread, but the same line of type printed wet can easily gain 30% density all round and still be within aesthetically acceptable boundaries. It is all a matter of taste and the demands of the moment. All I wish to point out is that there is a particular kind of flexibility in metal which does not correspondingly exist in digital offset printing. Would that it did!  <br> <br>I believe this is a silly semantical argument. Where are we ever going to get when every syllable is assumed to contain only its most literal meaning? That would correspond I suppose to a creationist view. <br> <br>John, I am mulling over what Greg had to say and the whole issue of variable stems on screen. One thing I have discovered is that on screens of lesser quality than those Dell 1920s, all type, including CT XP, can look rather worse than I thought it could. One is spoilt when one automatically buys the best screen available, because one is no longer in touch with what ordinary people are using. That said, I think new technology should probably be designed with the equipment of two years in the future in mind, rather than the equipment of two years in the past. Well, that's debateable, but at least as far as CT is concerned I think a forward compatibility rather than a backward compatibility view makes sense. An enormous amount of software seems to have flourished by being built such that only the fastest of today's machines could possibly use it.  I will post some letterpress inspired thoughts on stem width variability in the thread you mentioned.</p>
