    html: "<p>I have never printed letterpress from photopolymer plates. But GL may well be right that the fractional extra darkness of Bembo Book will cause problems. Indeed, I find that at 10pt (on a decent laser printer) the eye (is that the right word?) of the e, which is very small and high and fine is already getting troublesome. So to that extent the new digital version faithfully mimics a fault of the original. <br> <br>But, to be fair to the design, it is squarely aimed at \"flat\" printing methods. The only thing that worries me now is what one would do if one needed it at small sizes (say 9pt) not impossible for footnotes and suchlike in academic work where Bembo proved itself repeatedly in the mid-20th century. I'm not sure Bembo Book will work well so small (it seems to me to work best in the 11-18 pt range, frankly): Original MT Digital Bembo, however, though it has the right form, will not have good colour at that size. So it's back (I'm afraid) to the optical sizing problem again, which seems especially acute in text typefaces with relatively small x-heights.</p>"
