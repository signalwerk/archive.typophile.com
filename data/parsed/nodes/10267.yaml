    html: <p>If you ever come across copies of Fortune magazine from the 1930s, its text is Baskerville, just about solid leading. The middle of the mag is printed on a thick uncoated stock, and the ends (where the ads mainly are) are on very glossy coated. Same type, hugely different impression. And the heads in Baskerville too. All letterpress, of course. I'm not sure who the art director of the original design was, but it may have been TM Clelland.</p>
