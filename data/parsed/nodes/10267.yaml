    html: <p>I'm sorry, Gerald, but I simply cannot agree with this outrageous statement. If you are saying (and who knows, perhaps you are not?) that Monotype digital Bembo 1 (to distinguish it from the new Bembo Book) performs better, printed with photopolymer, than letterpress Bembo, then there is something drastically wrong with either your eyes or your aesthetics. Digital Bembo is a bastardized short descender variant design that has no functional equivalent in fine letterpress, no matter how it is printed. The design is so fatally flawed that no presswork or technique could possibly redeem it. Digital Bembo simply isn't Bembo (as I discovered in 1996 when Monotype sent me some scans of printouts that were used as the basis for DB; I was then working on a project to redesign DB which got as far as A-z for a 60 point master; I would also point out that prints for the 60 point were supplied to me by Ross Mills, not by Monotype). However, possibly I have misunderstood you?  <br> <br>On the other hand, Bembo Book does have the correct proportions, more or less, for text work.   It is said that the drawings for Bembo are uniform from 10 points to 18 or 24, or so. That  may well be. However, if you look at the actual types in that size range, especially 10, 11 and 12, it is clear at once that one is looking at substantially different types with substantially different optical effects. Clearly, in the actual types, substantial modifications of the drawings were made. <br> <br>However, that is quite beside the large point, which is that Digital Bembo is an atrocious design, neither fish nor fowl, that is not well-optimized for any size. Were it heavier, and more widely spaced, it might be acceptable in the 6 to 8 point range, but as sold, it is much too weak and too tightly spaced for those sizes and has no practical benefit. It is a poor 8 point design falsely optimized for 12 points, much like the original Adobe Garamond is a larger design falsely optimized for 12 points - an issue that will of course have been addressed in the new Garamond. <br> <br>If you are not, however, referring to Monotype's Digital Bembo, then the situation is different. Both the Scangraphic versions (there are two) and the Berthold versions are more or less correctly drawn. However, in both those cases, correct f-ligatures without which Bembo is not Bembo, need to be supplied. I cannot think of a typeface where correct ligature support is more important than in Bembo. I hate to use the odious word, but it really is a valid bouma issue, though there is no need of Dr Bouma or his lately constituted coterie to describe it or validate it. <br> <br>And by the way, can I ask why you consider it inappropriate that 'letterpress has somehow gotten into this thread' ? Do you consider that a discussion of a new digital Bembo that was explicitly designed to mimic letterpress Bembo should not include some discussion of letterpress? Even if that were not the design brief, how can any discussion of Bembo not include reference to letterpress?  <br> <br>Finally, one of the great optical features of text size letterpress Bembo (and text size letterpress Garamond) is the accretion of ink in the ball section of the f and the f ligatures. Digital designers, it seems, can never bear to duplicate this essential effect. It seems reasonably clear that Bembo Book does not get this feature quite where I would want it, but after all, it's easy enough to edit in.  <br> <br>&gt;We were constantly ordering new sorts.  <br> <br>Il faut souffrir pour etre belle, non?</p>
