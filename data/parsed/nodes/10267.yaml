    html: "<p>A report from the front; partly subjective. <br> <br>To report on what can be objectively verified: Yes Bembo Book does have alternate R, and two alternate Qs, and all the ff ligatures it needs. <br> <br>To report on how it does (treating it as intended to come as close as possible to well-set metal Bembo), it seems pretty good. It is certainly much better than the previous digital version which was truly yucky. I have a few doubts: I remain (even after trying it on another and better printer) not totally convinced about the spacing in some respects. There also seem to me to be a few letters which aren't quite right: for instance, the \"s\" seems a fraction short, while \"u\" seems a fraction high, which makes \"us\" combinations a little uncomfortable. But it may be my imagination and I may be looking too closely. I've checked it against a good metal sample, and I think at least some of these features were present in the metal type as well ... and no-one complained.  <br> <br>But the form is definitely an improvement on the previous digital version. As to colour, it's hard to judge. Certainly, I think, darker than the current digital version (which must be good). Whether it's right it's hard to say (and anyway, that depends I think on how and how well it ends up being printed, as well as personal taste; I have a personal vice for dark type). <br> <br>No-one's going to force anybody to use digital Bembo. Those who prefer metal can stick to metal, and can justly claim that it has some merits offset printed digital type will always lack. Those who have a rooted antipathy to facsimiles of old designs can use newer designs. I have sympathy with both views. For my part I think a decent digital Bembo would be a Good Thing. At least it might drive out the horrible current/original digital version, which really was a travesty of the metal face. But I'll need to spend much more time with it and see some properly printed before I know if this fits the bill.</p>"
    html_clean: "<p>A report from the front; partly subjective. <br> <br>To report on what can be objectively verified: Yes Bembo Book does have alternate R, and two alternate Qs, and all the ff ligatures it needs. <br> <br>To report on how it does (treating it as intended to come as close as possible to well-set metal Bembo), it seems pretty good. It is certainly much better than the previous digital version which was truly yucky. I have a few doubts: I remain (even after trying it on another and better printer) not totally convinced about the spacing in some respects. There also seem to me to be a few letters which aren't quite right: for instance, the \"s\" seems a fraction short, while \"u\" seems a fraction high, which makes \"us\" combinations a little uncomfortable. But it may be my imagination and I may be looking too closely. I've checked it against a good metal sample, and I think at least some of these features were present in the metal type as well ... and no-one complained.  <br> <br>But the form is definitely an improvement on the previous digital version. As to colour, it's hard to judge. Certainly, I think, darker than the current digital version (which must be good). Whether it's right it's hard to say (and anyway, that depends I think on how and how well it ends up being printed, as well as personal taste; I have a personal vice for dark type). <br> <br>No-one's going to force anybody to use digital Bembo. Those who prefer metal can stick to metal, and can justly claim that it has some merits offset printed digital type will always lack. Those who have a rooted antipathy to facsimiles of old designs can use newer designs. I have sympathy with both views. For my part I think a decent digital Bembo would be a Good Thing. At least it might drive out the horrible current/original digital version, which really was a travesty of the metal face. But I'll need to spend much more time with it and see some properly printed before I know if this fits the bill