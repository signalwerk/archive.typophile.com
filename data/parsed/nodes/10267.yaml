    html: "<p>I can't answer the question. But would someone with a really good printer have a look at the PDF and tell me if the spacing looks right? To my eyes it's rather uneven; but I don't know enough to say whether it's avoidably uneven. Superficially, it looks like they're kerning some combinations rather hard, and leaving others very loose. Or are they deliberately avoiding any kerning at all so that the spacing is \"as good as metal would be, but no better\"? If so, is this a good idea? (And I'm not sure anyway: compare \"ve\" and \"ev\"; and the uc/lc combinations are definitely and rather tightly kerned.) But maybe it's just my eyesight or my printer anyway. <br> <br>Apart from alternate R, I wonder whether we have ff ligatures?</p>"
