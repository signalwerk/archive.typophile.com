      <p>I agree with the notion that metal type when hit with more impression and more ink with look tigher in the fit. I've found this to be true with the current metal font that I am page proofing. When I pulled the first proof on a sheet of very thin mulberry tissue with a conservative amount of ink I was a little concerned at the openness of the fit. Using the same Potter proofing press I proofed the page on a sheet sheet of 250 GSM Arches Cover. Although the result was more impression that I would normally use, I found it encouraging that the stance of the type appeared to be somewhat tighter.</p>
      <p>I've had the full Centaur series for a long time and have always found that it is strengthened and more unified (in my eye) when given a little impression, even if the ink is still on the stingey side. Centaur has always seemed to me to suffer if printed too timidly. I do not ascribe to the "blast the hell out of it" approach to impression, but I want to know it didn't come from a copy centre.</p>
      <p>This is just the result I have found and is in no way the opinion of an expert.</p>
      <p>Incidentally I don't think that letterpress is an irrelevant subject to appear on this Forum. At present there is a lot of printing being done with photopolymer plate and the trend will most certainly grow.</p>
      <p>Jim</p>
