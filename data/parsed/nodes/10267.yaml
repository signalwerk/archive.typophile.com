ng. That said, I think new technology should probably be designed with the equipment of two years in the future in mind, rather than the equipment of two years in the past. Well, that's debateable, but at least as far as CT is concerned I think a forward compatibility rather than a backward compatibility view makes sense. An enormous amount of software seems to have flourished by being built such that only the fastest of today's machines could possibly use it.  I will post some letterpress inspired thoughts on stem width variability in the thread you mentioned.</p>
