    html: <p>It's interesting this topic came up, because at my library yesterday I was going through books trying to find books printed in metal Centaur to see what it was like. I had read the Alchemist in digital Centaur, and I could see Bringhurst's point about it looking weak and frail and all that. Finally I did find a largish book with a proportionately large font, maybe 16pt, set in metal Centaur. Its page numbers and headings were set in vermillion instead of black. It was simply stunning! I had thought it a bit much when Bringhurst describes letterpress as being `self-illuminating' or something, but really this page did have a glow, even more than usual. Even though the paper itself was not bright, the page was somehow illuminated and felt subjectively very bright. I was supposed to be studying, but I found myself reading several pages of it ... <br> <br>Although, I do not find this is the case with all fonts. For example, Baskerville's precise, fine features seem much better suited to offset (am I crazy?). Most philosophy journals are printed this way and they look quite nice. When I saw some older books with metal Baskerville, they seemed relatively inelegant. <br> <br>But, not having seen this new Bembo printed, there is no question that the metal version is so much lovelier than the old digital one. I always look forward to encountering books set in metal Bembo.</p>
