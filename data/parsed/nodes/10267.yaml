us that it must have been so collaborative a process that there was general agreement to describe it as a corporate achievement. But it would be nice to know more, and I am fitfully trying to find out.  <br> <br>One thing I'd say is that if you look at the display sizes of Bembo, or the drawings, the design seems much more its period, the late 1920s, than it does of any ancient time. Yet when text is printed by letterpress, many of those features are obliterated, and the type seems to have a more timeless quality.</p>
