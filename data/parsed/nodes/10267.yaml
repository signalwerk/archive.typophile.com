    html: <p>I have always preferred letterpress for books. <br>Much of the time, I buy old books printed letterpress, just because. <br>If musicians can still consider a Stradivarius or a Steinway to be the state of the art (as much as a Stratocaster), it would be nice to see more premium books, where the money is presently invested in fancy cover effects of embossing, foil, etc., pay more attention to the reading experience and offer the "Strad" of type, Bembo, and others such as Janson, Electra, Caledonia (reminds me of a recent thread on '40s type....) in letterpress. <br> <br>The quality of book letterpress is a constant inspiration to try and do something as good in digital font design. Different is no problem. High res on coated stock, no problem. Newspaper fonts, no problem. But quality letterpress book publishing is the one to beat.</p>
