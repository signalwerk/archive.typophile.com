    html: <p>&gt;This is nonsense. <br> <br>Really, Gerald? Could you explain why? <br> <br>Or are you having trouble understanding the phenomenom of ink spread?  <br> <br>In that case, let me explain. <br> <br>You have a line of type 4 inches long. <br> <br>If you press it lightly into the paper and ink it lightly, there will not be a lot of ink spread, and the spaces between letters will be large. If you press it heavily into the paper, and ink it generously, the spaces between the letters will be correspondingly small because of ink spread.  <br> <br>Ink spread may easily add as much as 30% to the density of letterpress fonts, when considering a light versus a heavy impression. Now, consider 30% bleed from both sides of two letters. Where in the light impression, there is a visible space between the letters, in the heavy impression, the letters may often now appear to be touching. <br> <br>However, the physical position of the letters has not changed. <br> <br>Is that difficult to understand?</p>
    html_clean: <p>&gt;This is nonsense. <br> <br>Really, Gerald? Could you explain why? <br> <br>Or are you having trouble understanding the phenomenom of ink spread?  <br> <br>In that case, let me explain. <br> <br>You have a line of type 4 inches long. <br> <br>If you press it lightly into the paper and ink it lightly, there will not be a lot of ink spread, and the spaces between letters will be large. If you press it heavily into the paper, and ink it generously, the spaces between the letters will be correspondingly small because of ink spread.  <br> <br>Ink spread may easily add as much as 30% to the density of letterpress fonts, when considering a light versus a heavy impression. Now, consider 30% bleed from both sides of two letters. Where in the light impression, there is a visible space between the letters, in the heavy impression, the letters may often now appear to be touching. <br> <br>However, the physical position of the letters has not changed. <br> <br>Is that difficult to understand?</p>
