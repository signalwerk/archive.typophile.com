    <p>Hey guys,<br>
    It’s been awhile since I’ve created a logo, and have been stuck on this one for my church. The logo on the left is our current logo which I did around 5 or 6 years ago. The 2 on the right are a couple of possibilities that I’m working on. </p>
    <p>The goal of the logo is to signify a bit of a fresh start, and attempt to make the logo / church look a little more approachable and friendly. </p>
    <p>Is it working? Too cliché? Any suggestions?</p>
    <p>Thanks!<br>
    Jesse</p>
