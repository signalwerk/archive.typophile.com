    html: |-
      <p>I feel that the original midle column was the one that struck me the most.  Blame the directionality on my laft-handedness but I felt that the action pointed towards the right (more dynamic or so I’m told) is better, but the question is, which is more important for a ’worship centre’, movement and advancing, or meditation and slowing down?  I feel strong arguments could be made for both, but you have to admit it’s far less common to see a left-leaning logo so it might stand out in the mind better.</p>
      <p>I never understood the whole ’worship centre’ thing.  In my experience it differs from a church because there isn’t ’crowd surfing’ or ’sprinting up and down the aisles’ in church.  Oh that was one scary experience having to dodge sprinters just to get a seat.</p>
      <p>I am somewhat turned off by the latest logo because to me, I see a tree, a flame and then the first combination that pops into my head is: Natural Gas / Environmental</p>
      <p>Also, I feel that the type choice (please don’t lynch me) in the first one will last longer than in the latest one.  I feel that the latest one has a shorter lifespan and will feel ’dated’ longer.</p>
      <p>I hope you will continue to develop the original middle column idea and see where that leads you as you explore other options too.</p>
