    html: |-
      <p>agreed.  All logos should work in 1 colour, and the gradient ones don’t allow for that.  Sure the logo can be spiced up to suit the occasion, but I feel that as a mark the previous incarnation with the separation lines worked better.</p>
      <p>I like the concept, and to address your fear of the cliché, I don’t think in this case the cross is being used out-of-context or in a clicé way.</p>
      <p>The cross will always remain relevant, but where it most cliché is when designers attempt to integrate it into a place where it doesn’t belong, at any cost. We’ve all seen crosses replace ’t’s in words that don’t need it, or incredibly cross-suggestive layouts where it doesn’t help the content.</p>
      <p>What you’ve done, create a cross through the joining of independent elements, or creating a cross-shaped-hole inbetween the rectangles so me is a first, you’ve surely found a new way to show the same image.  Far from cliché in my eyes.</p>
      <p>I think the proportions could use a slight amount of tweaking, but I have nothing to suggest other than the feeling that it’s not 100% done yet (sorry I can’t be of more help)</p>
      <p>Keep working on it, I’ll stick around to give my 2¢ as long as it’s helpful!</p>
