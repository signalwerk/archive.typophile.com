    html: |-
      <p>The font that Mottek and Cupertino (dafont.com) were based on is detailed here: <a href="http://en.wikipedia.org/wiki/Typography_of_Apple_Inc" title="http://en.wikipedia.org/wiki/Typography_of_Apple_Inc">http://en.wikipedia.org/wiki/Typography_of_Apple_Inc</a>.</p>
      <p>The Apple logo characters are the same general width as the characters in your sample logo, so I would say that someone has either used the Apple logo characters as a guide and drawn the logo by hand or they used one of the two free fonts (both of which are a lot wider) and created the logo that way, making the corners and some parts round in the process.</p>
      <p>Of the two free fonts, Mottek is the better quality one.</p>
