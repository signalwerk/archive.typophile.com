    <p><a href="https://web.archive.org/web/20150123091152/http://en.wikipedia.org/wiki/TrueType" rel="nofollow">Wikipedia (in the TrueType article):</a></p>
    <blockquote><p>Increasingly, new approaches to screen rendering have reduced the importance of extensive TrueType hinting. Apple's rendering approach on Mac OS X ignores almost all the hints in a TrueType font, while Microsoft's ClearType ignores many hints, and works best with "lightly hinted" fonts.</p></blockquote>
    <p>Will font rendering technologies eventually render hinting obsolete?</p>
