      <p>Hinting for low screen resolution will always be necessary. However, it seems that the process of finding out what to hint is moving towards the type <em>renderer</em>, rather than the <em>designer</em> (as seen in, for example, FreeType).</p>
      <p>I can think of various good reasons for this. A system-local hinting engine can consider local hardware issues such as resolution and pixel representation -- up to the order of RGB pixels on an LCD screen. I seem to remember FreeType's hinting works on both horizontally and vertically aligned LCD RGB pixels, where ClearType is focused onto horizontal alignment only. There's no way all this (excluding!) hinting can be built into every font.</p>
      <p>Another good reason is <em>consistency</em>: some fonts are very well hinted, others not at all. Using the type render engine to calculate hints means every font gets an equal chance to look good. (Or bad.)</p>
      <p>A final reason is, the two main hint types of TrueType and Type 1 are mutually exclusive. The designer has to pick one. FreeType can work directly with the 'raw curves'.</p>
      <p>(Note to everyone: this is all typed without resorting to manuals, web pages, and logn term memory storage. Feel free to argue.)</p>
