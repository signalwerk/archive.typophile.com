      <p>&gt;However, it seems that the process of finding out what to hint is moving towards the type renderer, rather than the designer (as seen in, for example, FreeType).</p>
      <p>That's where we want to be. </p>
      <p>If you go back to 1989, everyone was still thinking in terms of basic type libraries of only a very few hundred fonts. Even so, the TT developers' claim they would have parity with the Adobe library in a year proved delusory, and let's not forget the whole thing came about because Adobe was charging exorbitant licensing fees. </p>
      <p>In those days, when nobody thought of tens of thousands of fonts, it was tenable for Apple and MS to think of putting the hinting burden primarily on the font, rather than the rasterizer. But Adobe's philosophy, to put the burden on the rasterizer rather than the font, was always, one hoped, going to win out in the end -- otherwise independent type designers would go mad. It looks like TT is embracing this, thanks to better and better anti-aliasing. Nevertheless, even in ClearType, a tiny wrong instruction can wreak havoc, as shown by the error in Constantia revealed in a thread here some time ago. </p>
      <p>What it's looking like is that rasterizers are going to be doing a better and better job, but that hand-hinting will always offer opportunities for the best possible output -- unfortunately, of course, such hinting is always tied to a particular rasterizer. Could there ever be universal rasterizer?</p>
