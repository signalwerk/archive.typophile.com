    html: <p>A laser printer. They’re much less expensive to operate over time than inkjet printers. Just stay away from color lasers, as I’ve found that consumer models are prone to breakdowns.</p>
    html_clean: <p>A laser printer. They’re much less expensive to operate over time than inkjet printers. Just stay away from color lasers, as I’ve found that consumer models are prone to breakdowns.</p>
