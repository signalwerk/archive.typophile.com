  html: |-
    <p>I'm sick of using my cheap inkjet printer and having all of my text come out fuzzy.</p>
    <p>What I want in my prints is dark and crisp text.</p>
    <p>What type of printer do I need to achieve super crisp text? And what type of paper? I'm not looking to buy anything super-expensive, just the proper stuff that will meet my needs.</p>
    <p>I'm printing mostly high school coursework. Cost-effectiveness is also a plus, I'm sick of replacing my ink so often.</p>
