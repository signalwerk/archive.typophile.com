    date: 2009-04-10T16:52:00
    date_raw: 10 Apr 2009 — 4:52pm
    votes: null
    html: |-
      <p>If you really like to see dense, sharp text, you need a laser printer.<br>
      Toner cartridges are expensive, but if you're only printing text (no large solid areas), a cartridge should last 12 months.<br>
      You can also use less expensive paper.</p>
