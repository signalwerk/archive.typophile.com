    html: <p>I recently purchased an hp p2015 for a couple hundred bucks from newegg. It's 1200x1200 dpi and the text quality is really nice so far. My only complaint is that really thick black areas (+.5") lose density in the middle but I'm running garbage thin recycled paper through it. A smoother, brighter and more opaque paper would look great, try some Hammermill Great White if you want something decent.</p>
