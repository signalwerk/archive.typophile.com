    html: |-
      <p>What I love about Kris' typography it's I see it like something it could have happened should I have had the opportunity of seriously designing typefaces for a living.</p>
      <p>I mean, when in 1994 I had the basic idea which ended up in the release of Ottomat, it was all about the reversed relationship between vertical and horizontal strokes, in certain letters. In typefaces like Prokyon (is that the name? the one from the Dutch Type Foundry), the thing did not work so correctly applied in a textsetting face.<br>
      With Kris' work here (and I see Salamanca shares some of this "building grammar"), the thing has a degree of consistency previously undreamed of.</p>
      <p>I agree. It looks like something from the (early) 22nd centuty. While, maybe, Ottomat looked like a dream induced by peyote of the 1930s of an alternate reality.<br>
      Anyway, if Kris likes my opinion, this is more worth pursuing than Salamanca, to reply Paul's question on the approaching works order.</p>
