    date: 2006-04-19T21:47:00
    date_raw: 19 Apr 2006 — 9:47pm
    votes: null
    html: |-
      <p>I will add my compliments to the heap, and then get down to what I see.<br>
      •The tail of the y is a bit lo-fi. I have this issue with Joanna too. I don't think any harm would be done by narrowing it at the baseline to the same thickness as the other hairline, and letting it flare out to the thickness it's already at on the descender line. (Perhaps let it flare just a bit less than that, so it doesn't look too handsome.)<br>
      •On the b, I might raise by just a little the point where the top of the bowl meets the stem (make it flatter).<br>
      •The quotation marks are totally out of character. Give them a point. Harmonize them with your lowercase finials.<br>
      •I see nothing wrong with the bottom part of the s.<br>
      •While as a standalone the r looks pretty lousy, when I read it I didn't get stuck at it. This may be just me. I'm not sure if a more "normal" r would diverge from the font. But you never know until you try: invent one you think would harmonize, and then test it out side-by-side with the current. I'll think about this r and other possible forms.<br>
      •The t seems lifeless. A sort of t I've been using a lot in my sketches of fonts is the kind in (for lack of a better font that comes to mind) Slimbach, only with a right, not isosceles, spur on the top. I think you could make use of this. Also perhaps make it a bit wider. Worked for Galliard.</p>
      <p>That's all I've got for now. Bring us the rest of Karbon (tremendous name)--capitals, numerals, italic...<br>
      (when you can.)</p>
