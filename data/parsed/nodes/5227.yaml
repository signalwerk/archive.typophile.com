  html: <p>I have an old catalog from 1995 that features some fonts available from "bright ideas".  <br> <br>This was a subscription service where a disc was sent once a month containing various software clip art and fonts. The number provided is no longer in service. Anyone know if this company was bought out?  <br> <br>Some fonts in this catalog are "tamarin", "patton", "pinhead", "sapporo". Ring a bell?</p>
