      <p>&gt; Can you please tell me what this means?</p>
      <p>One needs to train one’s eyes. The eye tells the hand how to draw. Be it with a pen or a mouse, in any case.<br>
      If you master curve handling in the glyph window, this does, however, not enlighten you about *how an S-shape ought to be*.<br>
      I’d suggest a little experiment to you: print out a single letter S of a classical typeface at 400p. Take a second sheet of paper, ink and a pointed brush. Try to copy that letterform as exactly as you can, by eyesight only …</p>
      <p>Btw., for training I recommend to start rather with I, L, T, P… and not S. S is one of the hardest to draw, right next to O.</p>
    html_clean: |-
