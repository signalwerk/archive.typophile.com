    html: |-
      <p>It hardly matters. Usually, I have already done the uppercase C, so I begin the S by copying the top terminal of the C and using that as a basis for the upper right part of the S. Once I've done the top part so that it looks good, I'll usually copy it, rotate it 180 degrees, and use it as a basis for creating the bottom part. Obviously a lot of editing takes place to adjust the width, size and angle of terminal, etc.. Then I join the two segments and proceed as described in my previous post.</p>
      <p>As Hrant says, there is no one 'correct' way to design an S. This is just the process I have found fastest and most reliable, and which has the benefit of producting an outline structure that lends itself to hinting.</p>
    html_clean: |-
