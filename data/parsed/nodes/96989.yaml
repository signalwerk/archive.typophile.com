      <p>This is what I do, step by step. First I define the top and bottom parts of the letter, ignoring the middle section. I judge by eye where I think the upper left and lower right inner and outer curves should be, and place extrema points here.</p>
      <p><a href="http://www.tiro.com/John/S1.gif" title="http://www.tiro.com/John/S1.gif">http://www.tiro.com/John/S1.gif</a></p>
      <p>Then I am ready to define the middle section. I do this by moving just the vertical control handles from the extrema points, until the bend of the S is the height I want it and the distance at the middle is appropriate to the weight of the typeface.</p>
      <p><a href="http://www.tiro.com/John/S2.gif" title="http://www.tiro.com/John/S2.gif">http://www.tiro.com/John/S2.gif</a></p>
      <p>Then I draw guidelines between the opposite control handles of the inner and outer curves, noting where these cross the outline.</p>
      <p><a href="http://www.tiro.com/John/S3.gif" title="http://www.tiro.com/John/S3.gif">http://www.tiro.com/John/S3.gif</a></p>
      <p>Then I place nodes at these positions on the outline, and do constained movements of the control handles coming off these nodes in order to adjust the weight through the bend towards the extrema.</p>
      <p><a href="http://www.tiro.com/John/S4.gif" title="http://www.tiro.com/John/S4.gif">http://www.tiro.com/John/S4.gif</a></p>
      <p>That's it.</p>
      <p>You will find, if you are eventually going to make a TrueType font, that the structure resulting from this approach gives you everything you need to use the interpolate hint instruction to control the middle of the bend.</p>
      <p><a href="http://www.tiro.com/John/S5.gif" title="http://www.tiro.com/John/S5.gif">http://www.tiro.com/John/S5.gif</a></p>
    html_clean: |-
