    <p>I was wondering if someone could suggest me a good typeface that does well in print and also in webdesign. I'm planning on using Sifr for webpage headings (flashfile that replaces fonts). I want the type to be as easy on the eyes as possible.</p>
    <p>From what I found on the net, webfaces should have lots of white in the characters. That's  why my first thought was the Nexus family. But I'm not sure yet.</p>
    <p>Anybody got some better suggestions plz?</p>
    <p>many thnx</p>
    <p>Yves Peeters</p>
    <p>ps. I'm bored of seeing Din and Meta so they are no option ^_^</p>
