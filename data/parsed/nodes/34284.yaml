  - id: 208135
    user_id: 5882
    user_name: mike_duggan
    user_path: null
    user_image: /files/pictures/picture-5882.gif
    date_raw: 11 Jun 2007 — 9:10am
    date: 2007-06-11T09:10:00
    votes: null
    html: |-
      <p>&gt;Does hinting affect printing? Or is it a combination of modified forms and hinting that make a “proper” screen type family?</p>
      <p>Hinting can affect higher resolution output, especially for controlling undershoots and overshoots for instance. The effects of hinting however, if done well should not be noticable on the printer, but will have a noticalbe effect when the font is displayed on lower resolution screens, to control consistency of x-heights, stem weights, Cap Heights, middle bars etc. As far as I know the fonts you are referring to are TrueType hinted fonts, and will be different from their Type 1 cousins on screen as well as in print, however subtely.</p>
      <p>Mike</p>
