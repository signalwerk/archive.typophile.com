    html: "<p>Fontlab support got back to me and tested my vfb files and had no problems with kerning when the truetype were generated so I figured it was my stupidity (I assumed this from the start) messing them up. So I tried disabling and enabling some things while reading about them in the manual. When Options&gt; Generating Opentype &amp; TrueType: Automatically reorder glyphs was disabled my problem was fixed. I'm not sure if this was on by default or I accidentally clicked it when messing around. -Jess</p>"
