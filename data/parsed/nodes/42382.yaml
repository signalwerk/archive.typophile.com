  html: <p>I'm having this problem with the truetype fonts I'm generating using Fontlab 5.0 in Windows XP. The kerning is missing. I've tested them on Windows in Adobe Illustrator CS2, Corel Paint Shop XI and no kerning. On the Mac I tested them in Photoshop Elements 3 and the Font Book preview window and opened the ttf file in Fontographer 4.7.2 and no kerning. I tried every combination in the options &gt; kerning window when generating and nothing works. The kerning is there in the metrics window. When I make the truetype font an opentype truetype and create a kerning feature it works fine but I don't want this to be an opentype font. The kerning in the postscript opentype version works fine in all programs. What could I be doing wrong? - Jess</p>
  html_clean: <p>I'm having this problem with the truetype fonts I'm generating using Fontlab 5.0 in Windows XP. The kerning is missing. I've tested them on Windows in Adobe Illustrator CS2, Corel Paint Shop XI and no kerning. On the Mac I tested them in Photoshop Elements 3 and the Font Book preview window and opened the ttf file in Fontographer 4.7.2 and no kerning. I tried every combination in the options &gt; kerning window when generating and nothing works. The kerning is there in the metrics window. When I make the truetype font an opentype truetype and create a kerning feature it works fine but I don't want this to be an opentype font. The kerning in the postscript opentype version works fine in all programs. What could I be doing wrong? - Jess</p>
