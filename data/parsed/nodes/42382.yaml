    html: <p>Somehow stumbled on this thread trying to find out why my kerning wasn't working. Eventually I've fixed it. In case it's any use to others, I read somewhere that the OpenType kerning feature only works if there is some other OpenType feature defined. So I've put in a quick liga feature and hey presto, kerning now works in Adobe apps when exporting the .otf.</p>
