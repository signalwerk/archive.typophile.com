  - id: 386344
    user: 1133
    date: 2009-12-31T09:39:00
    date_raw: 31 Dec 2009 — 9:39am
    votes: null
    html: |-
      <p>Yes, older Adobe applications check for the presence of a "GSUB" table only to enable OpenType Layout. Kerning is present in the "GPOS" table, but it is ignored unless a "GSUB" table is present. Any OpenType Layout feature that performs substitutions (such as "liga" for ligatures) will create a "GSUB" table, and then kerning will work as well. </p>
      <p>This is a bug and I believe it has been fixed in newest Adobe apps (CS4). </p>
      <p>Note that this only applies to OpenType kerning done through the "kern" feature. Old-style kerning can be placed in the font file as well through the "kern" table. FontLab Studio allows you to control (in Preferences) whether to put both kinds of kerning, just one or none. Note that while OpenType "kern" feature kerning allows the use of classes, old-style "kern" table kerning only allows a flat pair list. So FontLab Studio allows you to decide how class kerning should be converted into flat kerning, i.e. whether all class kerns should be expanded into a flat table (which may result in a very long list if your font has many glyphs, which may overload some old applications such as QuarkXPress 4 or PageMaker), or if the old-style flat kerning should be a subset of the class kerning. </p>
      <p>Cheers,<br>
      Adam</p>
