      <p>John, not according to what I've been reading here: <a href="http://www.typophile.com/node/40041" title="http://www.typophile.com/node/40041">http://www.typophile.com/node/40041</a></p>
      <p>"The kern-table kerning is not officially supported by the OpenType specification, but I don’t know of any situation where it would actually break anything (the principle behind the OpenType font format is that you can put whatever table you want into the font, and applications must ignore the tables they cannot process). - Adam Twardoch"</p>
      <p>This is why I always include a basic kern table in my ot ps fonts.</p>
      <p>I'm wondering if Adam could go into some detail about what the "automatically reorder glyphs" does and when you would actually need it and why did it mess with my kerning when it was enabled? The manual says:</p>
      <p>"If this option is enabled, FLS will try to reorder glyphs to match the mac cmap encoding table. Technically, this is a requirement of the Apple TT specification but it is not required on Mac OS X or Windows"</p>
      <p>What would happen to a mac font on an older system if the glyphs were not reordered?</p>
      <p>-Jess</p>
