      <p>About glyph order:</p>
      <p>Rather then reordering glyphs upon font generation (with the option switched on), you could as well order glyphs <em>before</em>, and generate fonts with the reorder option switched off.</p>
      <p>AFAIK, it is not required that glyph are in some 'standard' order. The single issue with CFF-OT fonts whose first hundred or so glyphs are not in 'standard' order only affects CFF-OT fonts in OS9: the <em>Euro</em> cannot be accessed through the keyboard. Also see <a href="http://typophile.com/node/30303" title="http://typophile.com/node/30303">http://typophile.com/node/30303</a> and Thomas Phinney's comments.</p>
      <p><em>But</em> there is one requirement: In CFF-OT fonts, the first glyph must be <em>.notdef</em>. And in TT(-OT) fonts, the first four glyphs must be <em>.notdef</em>, <em>.null</em>, <em>CR</em> and <em>space</em>, see <a href="http://www.microsoft.com/typography/otspec/recom.htm" title="http://www.microsoft.com/typography/otspec/recom.htm">http://www.microsoft.com/typography/otspec/recom.htm</a></p>
