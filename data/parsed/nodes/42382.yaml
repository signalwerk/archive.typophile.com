      <p>I recently had the same problem with a new font. I did everything in Fontlab that has been mentioned in this thread, and also made sure the kerning was turned on in Word. I tried Word 2003 and 2007. Never succeeded in getting MS documents to read the kerning. I contacted Microsoft, too. They couldn't figure it out. The suggestion I received, from multiple sources, was that it was probably something in Word and I should not hold my breath expecting to see it fixed. The kerning worked in simpler text apps like Textedit and Notepad, as well as InDesign. My approach in kerning had been to set the spacing so the fewest kern pairs were needed. I redesigned the spacing in the font to look as good as possible without any kerning, then added kerning so it could look a little better in the apps that recognized it. This is not a economical an approach, but it made the font look better in Word.<br>
      Juliet</p>
