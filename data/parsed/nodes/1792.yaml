  html: <p>A couple of months ago, there was a thread discussing which was the sexiest letter, which presupposed a context of the Latin script. This thread is now buried in the archives, but I would like to revive it solely for the purpose of pointing out that <i>there are no sexy letters in the Latin script.</i> At least, not compared to these sinuous, copulating beauties from the Buginese, or Lontara, script. <br><img src="http://www.typophile.com/forums/messages/4100/19165.gif" alt="Buginese"></p>
