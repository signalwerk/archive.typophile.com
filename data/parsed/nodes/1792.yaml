    html: <p>The problem with symbols you don't know what they mean can best be illustrated by this story. I was given a jacket with an embrorded Dragon on it. I work in Manhattan, NY. I was comuting at the time to CT and on the train a business man who did alot of traveling to the far east asked me if I knew what the Dragon symbol ment. I told him I didn't. He told me it was a symbol of a gang and if I went into the wrong part of town I could get shot. I stopped wearing that jacket to work.</p>
