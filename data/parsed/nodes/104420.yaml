    <p>Hi, </p>
    <p>I found these samples online and I wonder if “Berthold” and “Lessing” exist as digital fonts under different names … I have some similar fonts (Super Grotesk, Bau, Venus etc.) but couldn't find anything that would match exactly. Unfortunately the type samples are also pretty small. </p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/berthold-lessing_5113.jpg"></div><p></p>
