      <p>fredrikrob: this is for "e-liquid", basically nicotine+flavoring used with electronic cigarettes. </p>
      <p>The companies get pretty poor treatment from regulators, first trying to get them shut down as making medical claims, and now they are treated as more harmful, conventional tobacco products. So, we are sort of trying to make a statement about this with the typeface(s).</p>
      <p>typodermic: I'm still not sure I like anything but the condensed DDT 100%, but looking at the label in your <a class="freelinking external" href="http://typodermicfonts.com/widefont-is-wide" rel="nofollow">Widefont is Wide</a> post made me like it more. I'll definitely consider these because it is close to one design I had in mind.</p>
      <p>Off topic, I like your <a class="freelinking external" href="http://typodermicfonts.com/magnetic-ink-wheaton-recognition" rel="nofollow">Wheaton</a>. I appreciate type but I've never and maybe never will create a face myself. For some reason a while back, I really wanted to make a face which is a mixture of that "60's computer font" with fraktur. Somehow they seem compatible and I want to see it made. If you do, I would totally buy it.</p>
