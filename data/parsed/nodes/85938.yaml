    <p>I'm looking for some ideas on font pairings for labels which will have a medicine type of look. I might go for a 1800's style, something like <a href="http://www.whale.to/a/chloroform.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this</a>, but probably something more modern like <a href="http://www.whale.to/a/biphetamine.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this</a>. Any suggestions at all are appreciated though. I'm kind of drawing a blank here.</p>
    <p>The final product will be printed at 180dpi, about 1" high and 1-1.5" wide. The composition will be a company name, then the main focus on the product name, with "drug information" below. The "drug information" will probably require a condensed font, and I need to pay attention to the form of "mg" and the % glyph. Thanks =)</p>
