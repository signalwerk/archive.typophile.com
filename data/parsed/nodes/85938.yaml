      <p>I did now, and those are neat but not what I was talking about. There's a unique "language" to both blackletter and that sort of MICR style fonts and I wanted to combine them. I probably shouldn't have said fraktur. I think it is other blackletter that has more of a wide-narrow "language" like MICR, then I wanted to draw on some of the quirky-unreadable aspects of both. This could be a horrible idea, and I don't know how to explain it better than that, but that was what I wanted to attempt.</p>
      <p>I was lucky to live near a "free bookstore" a while back and picked up some old ones on designing type. There was a name of this type of MICR font but with not only numerals, and I even made a few sketches before giving up, but I would have to go back to this when I have more time. Got enough hobbies I am bad at for now =)</p>
