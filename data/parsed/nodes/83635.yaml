  html: |-
    <p>So I've extended my Latin alphabet for my typeface to Greek. Initially some of the characters render poorly: β, μ &amp; θ. Don't know if that me, the screen, or the application I open the PDF with.<br>
    I guess I'm asking for as much direction as possible. I don't know any Greek so I'm banking on research that the letterforms are fundamentally correct. Clearly interpretations of what seems to be a primarily calligraphic language.<br>
    I want to expand the Greek with all proper diacritics and accents within the alphabet but want to know if the foundation is correct first.</p>
    <p>Looks like my ánō teleía could be taken up a little bit, might sit a little low.<br>
    As for lowercase alpha, I also want to create a truer letterform of the single stroke figure eight style.<br>
    Thanks in advance.</p>
