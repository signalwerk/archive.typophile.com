    <p>Hi typophiles,</p>
    <p>The new social video service vine.co features a fresh typeface used throughout their site. CSS inspection reveals the name "Verse Sans", but it doesn't appear related to the Verse typeface that you will find on myfonts if you google the name.</p>
    <p>Screen grab attached, or check out vine.co.</p>
    <p>Thanks for your help!</p>
    <p>Cameron</p>
