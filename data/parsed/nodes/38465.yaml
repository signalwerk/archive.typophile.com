    <p>Hey all,</p>
    <p>I'm in the baby stages of establishing myself as a freelancer (for design and words). I was perusing your Logo/ID critique forum and suddenly felt like I might do well to get up what I have so far. I've started with the business card and plan to apply my concept to a web site and stationary/notecards.</p>
    <p>Ultimately (over the next several years) I hope to grow from providing simple design and editing services to helping very small businesses establish their presence in print and online (along with my partner in crime and life, Patrick Beeson).</p>
    <p>My biggest concern: I don't think that what I have incorporates a logo, more represents a calling card. Is that a problem?</p>
    <p>Second biggest concern: Is it any good anyway? Really, I'm quite fond of it, but I'm open to tweaking. Even major re-thinking if it gets resounding "boos."</p>
    <p>I'm looking at a long road ahead on this project and I want to get a good start.</p>
    <p>Thanks in advance for your comments.<br>
    Lindsay</p>
