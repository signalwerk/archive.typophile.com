      <p>Erik</p>
      <p>Your sample seems to show an awful lot of hyphens, for what is not an exceptionally narrow column.</p>
      <p>Most of the Canadian newspapers I read have gone through redesigns in the past few years, and are fairly good, especially compared to the crud that existed back in the days when I was a reporter (1970s). There has been a general brightening up of the pages with lighter type, larger type, and wider columns in the redesigns. Ragged setting is used more, generally on opinion, rather than news.</p>
      <p>Kerning is all by machine, but the machines are getting better. I know most people here would consider it attrocious, but compared to what it was in the past.</p>
      <p>Trivia</p>
      <p>The best story about newspaper typography came in the early days of computerized typesetting, on a paper using a proprietary system, I think. The editor went ballistic when he discovered that the program had hyphenated the word God!</p>
