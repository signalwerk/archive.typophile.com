      <p>OK Erik, sorry about not picking up the text sample as Portuguese – I was in my scanning mode. My initial 'abstract' reaction was that the font and setting had an Italian, Spanish or French feel.</p>
      <p>As far as a day-to-day appreciation of newspapers, I usually take a glance at the design then just move on and read the thing. Following my initial comments on the Sydney Morning Herald, I had a good look at it over the last couple of days and realised that the design had in fact changed over the last year. And to a designer's eye not for the better. There is apparently a new editor with new ideas. Maybe his changes are considered better from a 'branding' or 'reader-appreciation' viewpoint. Heads have now reverted from the sans serif, Interstate, which I had liked, to the serif, Minion, which makes it all very ordinary. Charter has been maintained as the text font, though set without apparent logic as either justified or ragged (depending on who is setting it I think). </p>
      <p>I spoke to my friend James de Vries about his own recollection of the design development of the SMH, and as it turns out, it was actually his company that did the redesign in 2000. He is disappointed that his original designs have not been maintained or built on. Following some public debate about the new design in 2000, some adjustments within the first weeks of publication included an increase in the text size from 8.8pt to 9.2pt. His site is <a href="http://www.de-luxe.com.au" title="www.de-luxe.com.au">www.de-luxe.com.au</a>. He also mentioned a current design project where he has commissioned Christian Schwartz in NY to work on a family of serif and sans serif fonts – modifications of some existing ones I think.  </p>
      <p>Custom type action in Australia? From my perspective, not much goes on at all. There is always someone fiddling with existing fonts and a couple of collectives that 'pull a few faces', then they just slip away. A few names that come to mind... Australian Type Foundry, Jack Yan, Letterbox / Stephen Banham. Very few (if any) hard driving font designers.</p>
