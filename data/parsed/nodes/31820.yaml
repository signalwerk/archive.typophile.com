      <p>Yes, Folha de São Paulo is far superior to Estado de Minas (not only design-wise) and is probably the best newspaper in Brazil in terms of both typography and reporting. Still, it is far from perfect. I know newspapers in general have to grapple with space issues, but Folha is often guilty of excessive negative tracking.</p>
      <p>I recall reading something you (Hrant) wrote somewhere about a newspaper face that you found too humanistic. Would you care to expand on that a little?</p>
      <p>Most Brazilian typographers (an extremely rare species) and pseudo-typographers seem to be ignorant of text faces that are not romantic or romantic-leaning post-moderns (or Times Roman, of course). This affects a lot of books and almost all newspapers printed in Brazil.</p>
      <p>While I realize there don't seem to be a whole lot of newspapers out there using radically different typefaces from the ones commonly found in this country, I for one would be glad to see a little more humanism in newspaper and especially book typography in Brazil. But perhaps you have convincing arguments as to why Brazilian newspapers could be going in the right direction.</p>
