      <p><em>Erik’s sample -being from Newseum I’m guessing- is probably exhibiting problems with the PDF distillation.</em></p>
      <p>Yes, the sample's from Newseum, but in my experience (which is probably much more limited than yours) these distortions tend to happen at low magnifications. 300% ought to be enough to do away with most PDF distortions.</p>
      <p>In any event, here's another sample (again at 100% and 300%) which no doubt suffers from the same distortion problems (such as the little warts at the top of the a's at 300%, which disappear at larger magnifications):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/20070305210851_6101.png"></div><br>
      <cite> </cite><br>
      <div class="imageWrap"><img src="http://typophile.com/files/20070305210920_3638.png"></div><br>
      <cite> </cite><br>
      The colour is undeniably more even, and not only is some respect shown for proper letterspacing, but the ligatures and beautiful figures approaching three-quarter height (?) hint at superior typography. Is there anything better than The Guardian out there? Samples, anyone?<p></p>
