      <p>Erik, etc</p>
      <p>Your scanned sample is interesting. Much more 'magazine- like' to my Australian eye – tight leading, very condensed, wide column. Even though I dont read Spanish(?), I find it a little difficult for my eyes to just flow through. If I wanted to read 'all' the content I might find it a little difficult, but if I was just 'scanning' the information it would probably be OK, or even very easy.   </p>
      <p>The development of newspaper typography/layout, is always an intriguing one. As always there are cultura, media and technical considerations. </p>
      <p>My observation of newspaper design in Australia and to some extent in Western Europe and the US over the last 20 years is that if proprietors or editorial administration have 'commercial' or 'branding' interests, as well as funds, there will be onging considerations of their publication’s design. There will be thoughts about typographic fashion, concerns for a fresh style, or perhaps fine-tuning of an expected look for a particular publication. Even publications which are intended to appear conservative and so relatively unchanging (eg. the traditional dense look of 'The New York Times', the slightly fresher style of the UKs 'Guardian') have ongoing typographic 'tweaks'. </p>
      <p>In Sydney, The broadsheet 'Sydney Morning Herald' has had ongoing makeovers in the past couple of decades – in part, because of the where digital design could allow quicker production by less staff. The first change I really noticed was relatively subtle with introduction of sans-serf headlines and a dense high x-height serif setting of the text. I'm not sure, but I think the designer borrowed some of the look of what was then newly designed Guardian as well as what was happening in some more progressive US newspapers. The new look allowed for more hyphenations (automatic!) to fit text in traditionally small columns (and so less white rivers) and there was a little more white space around images, etc. This is where the 'design' would have been discussed with 'editorial' staff. I think they also introduced a slightly whiter paper to aid in image contrast. Some time around 2000 the look was modified with a new set of similar but different text fonts, a more dramatic titling font, and wider columns – all intended to be more readable for a general audience that were developing better skills in interepreting layouts and interesting looking fonts (largely an influence of our 'magazine' culture I suppose). There have since been some ongoing (degenerative?) changes.</p>
      <p>There are a couple of independent Australian design companies that specialise in editorial designs (ie. magazine, newspaper). One is de Luxe and Associates. James de Vries and his team have done some good solid work over the years with mostly Australian and Asian publications. They consider overrall design, including who will be setting the publications and how effectively the proposed design can be maintained, or developed. If anyone is interested their site has some interesting comments within their Editorial &gt; Neswpaper project samples: </p>
      <p>A sample of a site comment is:</p>
      <p>Project: FPC Couriers<br>
      “Mid-2006, we undertook one of our most ambitious projects yet – to redesign an entire suite of local newspapers. As well as the six existing titles, we also had to accommodate a “footprint restructure” and evolution of new titles.<br>
      Once the designs were completed and the processes behind them fully realised, they were then implemented across multiple offices, each with their own different set of staff and requirements. Once this was achieved, staff (including editors) were briefed and trained, with early issues monitored to iron out any wrinkles.”</p>
      <p>Cheers. Graham</p>
