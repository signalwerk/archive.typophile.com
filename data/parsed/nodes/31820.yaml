    html: |-
      <p>Well, I can comment on my recent redesign of my school's monthly paper. I ended up using Mercury Text Grade 2 for the body text (and Farnham Display for the headlines). Being a novice at news design and having just read Bringhurst, I decided to make the body text 9 pt on 11 pts leading. When I hear about news design nowadays, I often hear of much tighter spacing, usually between .5 pt to 1 pt. </p>
      <p>Although my choice of 9 on 11 might have diminished our ability to put enough words on the page, it ultimately ended up to our benefit. The reason is that the generous leading significantly lightens the typographic color of the page, so publishing a page of largely text, without many subheads, graphics, pull quotes, etc. to break up the gray monotony (which is usually condemned as being intimidating) ends up not feeling too oppressive. So ultimately I've been happy with my decision -- I think that it's ultimately made the paper more accessible to flighty student readers.</p>
