  html: |-
    <p>The 18th issue of the TYPO magazine is dedicated to British typographer Matthew Carter, who recently celebrated the fiftieth anniversary since the beginning of his career. The essay outlining Carter's lifelong work was composed by Margaret Re, American researcher of typography and a curator of the exhibition Typographically Speaking: The Art of Matthew Carter. It also includes an overview of all Carter's typefaces composed since 1963.<br>
    On further twenty pages of the magazine, Carter was interviewed by our Polish contributor Adam Twardoch, recapitulating his career, sharing his intimate views on the work of a typographer, and even revealing personal details from the life of this typographic star.  </p>
    <p>The TYPO magazine is published bi-monthly in English and Czech since January 2003. It contains 32-44 full color pages printed on high quality coated paper of 250 × 310 mm format. Information on subscriptions at <a href="http://www.magtypo.cz" title="www.magtypo.cz">www.magtypo.cz</a>. Contact: Linda Kudrnovska, editorial office manager, linda(at)magtypo(dot)cz.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo_obalka_18.jpg"></div><p></p>
