      <p>The <a class="freelinking external" href="http://www.myfonts.com/fonts/classic/copper/" rel="nofollow">Copper</a> font says it's based on copperplate script designs. Champion Script is based on the same script that Francoise Boltana used for his font of the same name. I have to say that this "Copper" family really does look to me like a hybrid of styles, rather than a unified script style.</p>
      <p>Trish, thanks for your comment, and for showing me a new Script font for the Guide. If you have this font, and would be willing to make samples for the Guide, I would be very grateful.</p>
      <p>- Mike Yanega</p>
