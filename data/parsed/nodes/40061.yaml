      <p>I will just note that there is a big difference between grad school for graphic design and grad school for type design (such as the Reading or KBK programs).</p>
      <p>In the latter, there probably isn’t anything you couldn’t learn other ways, but I am pretty sure you’ll learn plenty of valuable stuff in the program, and very probably much more quickly than trying to do it on your own. I suspect a student is also a lot less likely to come out with odd “holes” in your overall knowledge and understanding of type design and production than if they tried to do it on their own.</p>
