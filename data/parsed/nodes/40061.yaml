      <p>I didn’t attend graduate school but as an art director had ample opportunity to review portfolios of graduate students and I agree heartily with what Dan said above. I got really tired of seeing die-cut, 6-color, metallic, 5 kinds of paper thesis projects that no client in their right mind would ever let you do. I don’t disparage the theoretical education these students received, but in terms of preparation for a career in graphic design... not so much.</p>
      <p>I guess the question is, is going to grad school for design the equivalent of trade school (such as med school or architecture school) or is it more like an MFA in painting, about education for education’s sake and/or preparation for a career in academia?</p>
      <p>Personally, I think it’s a waste of money and potentially can teach you some things you will need to un-learn later on...</p>
