      <p>It might be beneficial to step back and remember the point of conferring these degrees. A Bachelor’s degree conferred means that the recipient is supposed to be expected to be able to perform tasks as a designer independently. A Master’s degree should mean that the recipient is a master of a certain subject, probably the area of design in which his thesis was undertaken. Masters should be able to be expected to contribute to the greater dialogue of the field, and also to move the field forward a bit. A Doctorate is conferred after one has taken independent research or has researched a topic in depth and contributed new points of view to dialogue. A doctoral recipient is required to move the dialogue of his field forward. There are not that many doctoral programs in design, so it might be best to leave that aside for now.</p>
      <p>My experience as a designer (a student at four universities in three countries on two continents, and as a professional designer who has also conducted interviews for three separate employers) does not align with Patty’s. In fact, I agree most whole-heartedly with Chris. </p>
      <p>But Patty’s experience must be genuine as well. Unfortuantely, not all schools, teachers, and institutions are created equally. Some degree-holding people are just not going to be very good. Sometimes, this is their own fault, and sometimes it is not. However, there are a lot of schools around the globe that do manage to graduate good students who have done excellent work for great reasons. Someday Patty, I hope you’ll meet more of these people.</p>
      <p>On the other hand, a little bit of “glitz and glamour” is not totally inappropriate for projects grad. stduents have done. They are expected to show mastery of their field. That they can manage four-color processing and normal print jobs should go without saying. They have to be able to do more than that.</p>
      <p>Graduate schools have had a profound impact on global design trends. The graphic design world of the early 1980s was in large part shaped by the work of designers who had studied in graduate programs at Yale and Basel. In the early 1990s, Cranbrook changed alot of things in graphic design, whether you agree with these changes or not.</p>
      <p>One does not need a degree in graphic to practice at all, much less practice well, and Patty, I think that this might be a bit of the reason that you don’t like design schools. They are establishments that tend to promote and institutionalise themselves. But we all know that your work is excellent! You needn’t fear the output of any school</p>
      <p>What graduate schools can be exceptionally good at is exposing people to a lot of things really quickly. If someone would take a year off from work, they might be able to expose themselves to almost as much, too. But it’d take more work. If you don’t take a year or two off from work, you can still expose yourself to most of these things and learn them, too… but it might take upwards of five to ten years. I think that the money is worth its value in time saved… but that is only my opinion.</p>
