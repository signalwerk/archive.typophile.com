      <p><cite>Institutional credentials are of immeasurable value to underachievers, but to the truly ambitious they are merely perfunctory obligations.</cite></p>
      <p>Rubbish. I dropped out of college to start my first career, and not having learned many of the things I would have learned in school held me back over and over again. Nothing stopped me from learning them on my own, but I had to stop doing other things to learn them. By attending a design school staffed largely by working designers I have been able to draw from their decades of experience and it keeps me from having to pick up a lot of little things on the job. </p>
      <p>An ambitious individual with a whit of common sense should realize that there is a great deal of efficiency in the model of learning first, then diving into work well-prepared for it.</p>
