      <p>Grad school is most important if you ever plan to teach at a university. Most design jobs are gained by portfolio and interview. Grad school does get you connected to many more people in the field and increases the odds of you knowing someone who knows about an opening. If you are planning to be a type designer, the University of Reading in the UK offers an outstanding one year graduate program in type design.</p>
      <p>ChrisL</p>
