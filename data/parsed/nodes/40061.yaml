      <p><cite>But we all know that your work is excellent! You needn’t fear the output of any school</cite></p>
      <p>Thanks! But I don’t fear the output. I just haven’t been all that impressed by it. And feel that academia tends to promote a certain hermetic quality, Cranbrook being a prime example. No offense to Cranbrook or its graduates, but the designs I see from them tends to favor theory over practicality. They need explaining. This may play well among the higher circles of design - and win awards and kudos from the AIGA - but in the real world of design I often find it labored. (I should add here that I wrote this last paragraph <em>before</em> I noticed that Dan mentioned Cranbrook as a positive example in his post above). I guess I don’t disagree with Dan in the fundamentals of what he says, but I have a different take on it.</p>
      <p>Design needs all types - theoreticians and practicians. Both move the field along. I would never tell someone not to go to grad school if that’s what they want to do, but I still can’t help questioning the wisdom of spending the money and time if what you really want is to work in the field. It seems like a bit of a racket to me.</p>
      <p>I was also lucky in that my first boss was a truly excellent teacher and guide.</p>
