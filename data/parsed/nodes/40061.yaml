      <p><cite>Wait, isn’t that supposed to be the same thing? I mean, whenever I worked hard to produce what I considered an “awesome” piece, I know that I was stretching myself and my capabilities, as well as working a lot!</cite></p>
      <p>Trying something new and really pulling of something awesome doesn’t always happen the first time. Especially when one is trying to learn the ins and outs of typography—learning to manage all those little details don’t come quickly. Sometimes I feel like design students are being pushed to do works that can be passed off as high-concept, expressive, or wildly creative because it can distract from weaknesses elsewhere. I get a lot more out of my work by trying to really learn something while I work on it during a semester, but it often only reaches the level of impressive afterward, when I dig it out again, have it critiqued by people I did not go to school with, and push it farther.</p>
      <p>Then again, it might be that I just worry too much about details that an undergraduate student shouldn’t be focusing on anyway.</p>
