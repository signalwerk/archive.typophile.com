      <p>Also, it is not just an issue of “should” someone attend grad school but “when” is the most beneficial time. I went to grad school 9 years after undergrad. I feel that it is best to get a bit grounded in your field with a few years experience before going back to school. If all you have known in your life is college, you are more likely to see things only in an academic way. I felt that I was able to bring more to grad school and get more out of it because I had 9 years of work experience to open me to real world conditions. There is no hard and fast rule for everyone or every school.  Working for decades has its downside too. Sometimes it can be refreshing and rejuvenating to take a long break and revisit your profession in a school which is a good fit for you.</p>
      <p>ChrisL</p>
