      <p>“I got really tired of seeing die-cut, 6-color, metallic, 5 kinds of paper thesis projects that no client in their right mind would ever let you do.”</p>
      <p>I have not seen this phenomenon with grad school portfolios in my 45 years of working in the field. I have seen it, much, much, more with people who have just had either a vocational school education or just a bunch of software courses and are trying to show every technique that software has to offer. The real wiz-bangy stuff is usually a coverup for the person who can’t problem-solve. Grad school people tend to be more big-picture and system oriented and have marketing and communications theory and research to help them communicate verbally with clients in a problem solving way. This kind of skill is less needed in a straight design job where the person just does book jackets all day. It is more suited for corporate identity work where a system of products is developed in a coordinated way that is purposively focused on customer groups.</p>
      <p>ChrisL</p>
