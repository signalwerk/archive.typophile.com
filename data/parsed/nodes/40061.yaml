      <p>I think Chris is making good points about the topic. The one thing I have to concede that graduate degrees can accomplish is developing the ability to write in depth about the subject. </p>
      <p>I also agree entirely with the notion that people should work in the field for years before going back to school for a post-graduate degree. My only knowledge is based on my limited exposure here in the US, but it’s very common for students to go directly from undergraduate school to graduate school and right into teaching without ever having to know anything practical about how graphic design works in the real world. An irony I see at the schools in my area is that the best and most passionate teachers in the universities are the professionals who only teach part-time, not the full-time professors.</p>
