      <p>I think Lex is right, but if I were re-creating the logo I think I'd oblique <a href="https://web.archive.org/web/20191005163700/http://www.myfonts.com/fonts/linotype/brody/">Brody</a> and maybe try to add some extra brush strokes to the left, and some 'distressing' to make the brush effect more exaggerated.</p>
      <p>- Mike Yanega</p>
