    <p>What’s used for the official D.A.R.E. Drug/Violence Program logo? <a href="http://www.dare.com/home/default.asp" title="http://www.dare.com/home/default.asp">http://www.dare.com/home/default.asp</a><br>
    The original is in red. Speedline (too much flourish) and Challenge Extra Bold (too clean) are underneath for comparison. It’s also not Buffalo Joe.<br>
    <a href="http://www.myfonts.com/fonts/typeart/buffalo-joe/regular/" title="http://www.myfonts.com/fonts/typeart/buffalo-joe/regular/">http://www.myfonts.com/fonts/typeart/buffalo-joe/regular/</a><br>
    If this has been answered before, apologies, but search doesn’t seem to work for me, and acronyms never work.</p>
