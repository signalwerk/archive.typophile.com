      <p>Those two buttons don't work for me, either, but you can access all the commands in them elsewhere.</p>
      <p>All the items in the Auto Menu are also in the Tools menu at the bottom of the Metrics window:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/automenu_6513.jpg"></div><p></p>
      <p>(If you don't see these menus at the bottom of the Metrics window, click on the little button with the square in it just below the right end of the Metrics window toolbar.)</p>
      <p>All the items in the Class Kerning menu are also in the Class Kerning menu at the top of the Classes panel:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/classkerningmenu_5253.jpg"></div><p></p>
