      <p>You can see that the new logo is hand-drawn, because at the larger size it's obvious that the i's and u's are not identical. The 's' is not really a script style letter either. Otherwise this resembles a simplified, thickened <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/itc-edwardian-script/" rel="nofollow">Edwardian Script</a>.</p>
      <p>- Mike Yanega</p>
