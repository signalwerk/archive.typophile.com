      <p>Hey Miguel,</p>
      <p>First off, I'm very excited to  hear you are going to consolidate your designs under your own brand. In my opinion, this is long overdue.</p>
      <p>The service you describe sounds expensive to me. 10% of sales is pretty high, and the fact that they hold your money until they decide to send it to you, less their fee, is also undesirable.</p>
      <p>Have you looked into verisign's payflow pro? It's a bit more difficult to implement an SSL certificate, and a bit more expensive to set up a merchant account at your bank, but once you go through the initial expense and hassle, you get a much better system that you control, and you only lose a percent or two per sale to bank fees and credit card fees.</p>
      <p>But most importantly, you get access to your sales the day after they occur. That's pretty quick, and no one is holding your funds hostage.</p>
      <p>I agree that Paypal leaves a lot to be desired. But, there are a lot of casual web users that use Paypal extensively. You'll probably make more sales if you offer Paypal as an option. But, I wouldn't go with them exclusively.</p>
      <p>That said, I don't offer PP as an option at MT.</p>
      <p>Also, check out GoDaddy's SSL certificates. They're much cheaper than Verisign's solutions, but there are compromises in the service that make me slightly uneasy. However, depending on your needs, they might offer the best balance of performance and price.</p>
