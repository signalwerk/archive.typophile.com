      <p>Miguel,</p>
      <p>Why not open a Merchant Account with your bank which will allow you to accept credit cards as payment. Your bank should also be able to recommend an on-line payment gateway that they accept.  Depending on the credit cards you accept, the "discount" they charge (discount is their clever term for fee) can range from around 3.5% and up. There are monthy minimums, but you just have to look at those fees as part of the "rent" for your online store.</p>
      <p>James</p>
