      <p>Hi Miguel,</p>
      <p>I would not use Western Union, they have earned a bad rep because a lot of scammers are using their services. This might not be their fault, but  then there are other services to consider, the biggest one being Paypal.</p>
      <p>You can set up your website to collect payments through Paypal and offer the fonts to download immediately after Payment has cleared, so you don't have the to send emails manually and people can get their fonts any time of the day.</p>
      <p>Paypal sure has it's problems too, but after coding some sites for clients, I have to say it's the best choice as of now.</p>
      <p>Cheers,<br>
      The Giraffe</p>
