    <p>Hello to everybody,</p>
    <p>I was thinking on this day, in which i am building my website to sell my font designs, to get a deal with an ecommerce service like e-sellerate. They get a 10 percent of the sales, and send them at the end of the month with a check. Checks here in Chile spends 3 weeks in been verified by a bank so its very slow. Wire transfers are slow and cost us$40 aprox. </p>
    <p>I think western union its the most fast and secure way to receive money direct from my customers, but i dont know if some typographer of foundry use this method. Dod you know someone?</p>
    <p>WU costs 10% to the customer. My idea is to receive the transfer code and email from customer, and then send an email to them in the same day.</p>
    <p>Do you think that customers will use this method? i think its more direct and its secure too but i dont know what customers will think about it. In fact any can send money via WU, no need to use a credit card and WU exists in almost any city..</p>
    <p>Cheers,</p>
    <p>Miguel Hernández.</p>
