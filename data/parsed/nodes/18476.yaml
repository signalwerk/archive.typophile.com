    html: |-
      <p><em>Verdana, is the way to go acording to them.</em></p>
      <p>They don't discount serifed type either.</p>
      <p><em>I am creating a typeface for this.</em></p>
      <p>While on principle I wouldn't want to discourage novices from designing type for the reading-challenged (two words: Louis Braille), I don't believe that their efforts will be any better than any standard typeface by an experienced designer, in fact, much less effective.</p>
      <p>Sure, it's great that some publishers are using such types, but it says more about committment and empowerment than pure functionality.</p>
      <p>From both a scientific and design process standpoint, it would make more sense to analyze exisiting typefaces for their suitability for the reading-challenged, and then base one's typeface design on that knowledge, rather than working from abstract principles such as "disambiguation of shapes".</p>
