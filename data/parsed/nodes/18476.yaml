    <p>Does anyone have any good sources for Typography and Vision related problems? My THESIS is creating "a designers guide" to vision related problems. Specifically, Central/Peripheral blurriness. In the end I am creating a typeface for this. I am familiar with the AIGA article but I could use more help.</p>
    <p>Thankyou,<br>
    Prakash Nair</p>
