    html: |-
      <p>A lot of free- and shareware fonts are of dodgy quality, but there are of course the exceptions that confirm the rule, and some reputable foundries have free fonts as well (sometimes for a limited amount of time). Please keep in mind that quite a few of those dodgy freeware fonts are actually rip-offs of legit commercial fonts and are hurting the type designers and the type industry in general, so be careful what you use. For example Creampuff is an illegal pirated copy, a big no-no in my book. Deftone Stylus is pretty safe.</p>
      <p>I have been thinking of building an archive of legit quality freeware fonts for this board, but I fear this won't be received very well by people who actually have to make a living out of designing fonts. :^/ What do other people think?</p>
