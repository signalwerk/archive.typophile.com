      <p>Are you looking for single fonts that each cost under $30? Almost every PostScript or TrueType format font on <a href="http://www.linotype.com" title="http://www.linotype.com">http://www.linotype.com</a> costs less than $30, and quite a high percentage, I think, of fonts at <a href="http://www.myfonts.com" title="http://www.myfonts.com">http://www.myfonts.com</a> are the same.</p>
      <p>Or do you want a package of fonts that costs $30 all together? That isn't quite realistic(although every month, Linotype has a value pack of five fonts around a certain theme that costs $30).</p>
