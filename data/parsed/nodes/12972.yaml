    <p>Hi, I am working on a design that needs some hand painted / brush letters.</p>
    <p>I found a sample, that has a nice blend of thick and thin. And irregularities, which makes me think it is   hand lettered.  Could anyone recommend a font with a similar flavor?</p>
    <p>I found one font, plz-print. Its alright.<br>
    <a href="http://www.myfonts.com/fonts/outsidetheline/plz-print-brush/" title="http://www.myfonts.com/fonts/outsidetheline/plz-print-brush/">http://www.myfonts.com/fonts/outsidetheline/plz-print-brush/</a></p>
    <p>Maybe I'd have more success finding a font as a template and painting my own letters on top of the guide.</p>
    <p>Well, any thoughts would be well appreciated.<br>
    -=Bookie</p>
