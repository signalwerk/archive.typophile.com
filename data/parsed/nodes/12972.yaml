      <p><a target="new" rel="nofollow">Part 14 (Strange, Distressed Scripts)</a> of the Script Font ID Guide might show you some fonts that would have the feel you are after. Linotype Seven is in there, but there are many others with the rough hand-painted look, and some are free fonts. (The Guide has no fonts, but its Reference List tells you where they came from). </p>
      <p>- Mike Yanega</p>
