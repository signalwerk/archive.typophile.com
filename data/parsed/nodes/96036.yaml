  html: <p>The font resembles Bernhard Modern or similar to Cochin, but it's not. The lowercase "g" seems to be unique – a clue to identifying this font. I already tried WhattheFont, but it failed to ID correctly. Unfortunately the JPEG compression artifacts make it difficult to ID. Anyone know this font?</p><div class="imageWrap"><img src="http://typophile.com/files/font_5604.png"></div><p></p>
