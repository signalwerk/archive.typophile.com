    html: "<p>(What's really frightening is that I have <br>a goatee too....) <br> <br><img src=\"http://www.typophile.com/forums/messages/30/15103.gif\" alt=\"Gulliver.gif\"> <br> <br> <br>I suppose in keeping with the typographic <br>application of the question, though, we're <br>looking for font like Copperplate Gothic, <br>Engravers Gothic, and Steelplate Gothic: <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/copperplate-gothic/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/copperplate-gothic/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/bitstream/engravers-gothic/\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/engravers-gothic/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/redrooster/steelplate-gothic-rr/\" target=\"_blank\">http://www.myfonts.com/fonts/redrooster/steelplate-gothic-rr/</a> <br> <br> <br>Or (forgive me for raising this one again) <br>Today Sans and Cronos: <br> <br><a href=\"http://www.myfonts.com/fonts/ef/today-sans/\" target=\"_blank\">http://www.myfonts.com/fonts/ef/today-sans/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/adobe/cronos/\" target=\"_blank\">http://www.myfonts.com/fonts/adobe/cronos/</a> <br> <br> <br>Or even Gill Sans, Tschichold <br>and Johnston's Underground: <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/gill-sans/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/gill-sans/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/presencetypo/tschichold/\" target=\"_blank\">http://www.myfonts.com/fonts/presencetypo/tschichold/</a> <br> <br><a href=\"http://www.myfonts.com/fonts/p22/underground/\" target=\"_blank\">http://www.myfonts.com/fonts/p22/underground/</a> <br> <br> <br>And all the Futura/Erbar/Spartan/Metro/ <br>Kabel/Bauhaus/et al geometric sans-serifs <br>of the early Twentieth Century. <br>(I mean, REALLY! Who would spend so much <br>time and effort on a geometric sans-serif...?) ;) <br> <br> <br>David <br></p>"
