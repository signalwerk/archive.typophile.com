      <p>Ethan: <em>Technology marches on.</em></p>
      <p>Well, yes, it does, but significant numbers of users of technology do not march on. They stay in their trenches. I say this as someone who made the mistake of ignoring a lot of rendering issues for a long time in the belief that everyone would be using higher resolution screens very soon. Not only did that not happen, but many users are still working with software that wouldn't scale effectively even if they were using higher resolution screens.</p>
      <p>As to ‘good enough’, we really don't know what constitutes that. What I'm reasonably sure of is that ‘good enough’ is not equivalent to what users will put up with or might consciously declare to be good enough. Where is the reading speed and comprehension testing? What is an ‘acceptable’ level of degradation of reading speed and comprehension, relative to Verdana and Georgia as standards, in order to obtain the mere novelty of different fonts on the web?</p>
