    html: |-
      <p>Bram, TT hinting was designed to enable a single outline to be adjusted at specific device pixel-per-em (ppem) sizes to obtain the best bitmap image at those sizes. As applied to an existing print type, e.g. Times New Roman, hinting enabled legible and consistent shapes in low resolutions. As applied to a new design intended specifically for screen reading, e.g. Georgia or Verdana, hinting enabled excellent readability building outwards from a base size for which the design was optimised.</p>
      <p>The kind of size-specific screen design to which you refer is certainly something we've been discussing with regard to web fonts. David Berlow has convincingly made the case that, given the vagaries of today's rendering methods and how they interpret or do not interpret hints, the only way to optimise text type for for screen (i.e. optimise legible shapes, spacing and stroke density) is to fit outlines to specific ppem grids. Here is a hastily made demonstration I put together for the CSS3 session at TypeCon:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SizeSpecificCompare_6375.png"></div><p></p>
      <p>Since a lot of the first offerings of web fonts are converted and autohinted PS print types, I started with Adobe's Caeciliae Regular font, converted to TTF and autohinted with FontLab. The size-specific outlines were made manually using a variety of FontLab shortcuts to get me close to the different ppem grids (including changing the UPM of each font so that the grid was always 100 units). [The usual caveats apply that looking at screenshots of subpixel rendering is not the same as looking at the same font(s) rendered natively on your own system. There are variables in gamma, device pixel size, ClearType tuning, etc. that affect this.]</p>
      <p>This image demonstrates two things: the first is that the size-specific designs are cleaner, sharper, blacker, have more consistent stroke density, are better spaced for low res, and generally more legible and more readable; the second is that size-specific designs do not scale linearly, which introduces a major problem. If you have experience looking at websites on mobile devices such as iPhones, this problem should be quickly evident. If text is displayed with size specific fonts, zooming text will cause one of two problems: either a font designed for a smaller ppem grid will be used at a larger ppem grid, which will look at best clunky, like this...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/zoomed_6669.png"></div><p></p>
      <p>...or, if the device is clever enough to somehow get the larger ppem size font for the zoomed size, the text will reflow because of the non-linear scaling of the type and its spacing. So, for example, you might zoom in on a paragraph in a web page, only to find that reflow has shifted much of that paragraph to somewhere else on the screen or, even, off the screen. That is presuming, of course, that the device has some way to get the appropriate ppem size specific design for the zoomed text. In fact, there is currently no way to reliably specify a ppem-specific design even for un-zoomed text, because there is no CSS measurement unit that actually corresponds to device pixels. [The px unit, which used to refer to device pixels, is being redefined in CSS3 as a pixel <em>at 96 dpi,</em> (i.e. an absolute size of 3/4 pt instead of a relative size) which means that specifying e.g. 11 px in CSS will only display the font at 11 ppem on a 96 dpi device; at 120 dpi it will display the font at 14 ppem, and so forth.]</p>
      <p>After discussing this with numerous people at TypeCon, I'm not optimistic that we're ever going to have a mechanism that will enable ppem size-specific outlines to be reliably used.</p>
