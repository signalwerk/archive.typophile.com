      <p>I'm not sure how this could help to focus the problem on quality and "good depending on the media", but which face do you use for writing in your ordinary word processor application, and which do you use most to set simple texts outside layout page programs, and at the same time you find comfortable on screen? (I'm sorry this does not apply to iPhone or similar things, since I use only an iPod nano).</p>
      <p>I used to find myself using more or less  constantly Verdana and Georgia. I ended up appreciating Georgia’s versatility (so much that I licensed Miller and tried to use its small capitals together with Georgia for eBook experiments. In the end, I bought Miller in Opentype OTF format rather than Truetype. I'm still unsure about that, since I have not enough familiarity with the behavior of Opentype on Windows).</p>
      <p>But since I tested Cambria, I ended up using Cambia for almost any of the aforementioned applications.<br>
      I would like to hear what you use, or use mostly…</p>
