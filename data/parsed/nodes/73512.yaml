      <p>fontsquirrel -- <cite>I noticed that GASP table settings are all over the place too.</cite></p>
      <p>Could you elaborate on this?</p>
      <p>You could as well say "there are OS/2 table settings all over the place" which however is saying nothing at all. Every OT font contains an OS/2 table. Which OS/2 table of course holds some settings.</p>
      <p>Or are you speaking about <em>specific</em> settings? GASP contains settings (per PPEM size range) for a) greyscaling &amp; gridfitting and b) ClearType &amp; ClearType gritfitting, with a) and b) being independent of each other. So it is still not clear what you are saying.</p>
