      <p><cite>I don't know, man. Selling something half baked seems very unadobish to me, at least when it comes to fonts.</cite></p>
      <p>To quote Benjamin Braddock: "No -- it's not. It's completely baked."</p>
      <p>We're quite happy with what we've put out there, but to repeat, one can realize a nearly limitless improvement in quality proportional to the time and effort spent. If we wanted to spend another two years on our web fonts, no doubt they would look better. (And maybe in two years they will.)</p>
      <p>Everyone has probably noticed that new super-hinted TrueType fonts are few and far between these days. They take an extraordinary amount of time and effort. Does one get a return on that investment with a super-dense iPhone screen? Nope. So, just to be clear, when I talk about "current-soon-to-be-old environments," I'm talking about old viewing environments, not font formats. I'm pretty sure 300 dpi laser printers and monochrome screens are not as important as they were 20 years ago, either.</p>
