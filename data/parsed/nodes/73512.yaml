      <p><em>I was surprised after taking a superficial look at the Adobe fonts on Typekit. They appear to be autohinted TTFs converted from CFF by FontForge.</em></p>
      <p>Ethan, it's not clear to me why you think that's what happened but the look you gave must have been superficial indeed because I didn't use FontForge at all. The Adobe fonts available through Typekit are TrueType fonts that were converted from carefully hinted Type 1 sources, with the help of FontLab. The conversion process within FontLab involves several steps which include removing all vertical glyph hints, setting the gasp table values and clearing the hmtx and vmtx arrays. The final TTF is actually built with AFDKO's MakeOTF, which assembles other tables such as GPOS, GSUB and name.</p>
