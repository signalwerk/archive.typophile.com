    html: |-
      <p>Miguel probably has thoughts. I'll add mine:</p>
      <p>As I mentioned elsewhere here, every foundry has to strike a balance between quality and opportunity. Every foundry has its own idea of quality and resources to achieve it. And every foundry could spend several years creating the best possible fonts, but not everyone will wait for them -- and many customers have their own perceptions of quality.</p>
      <p>As you might imagine, we're not pleased that the current state of web fonts requires TrueType. Adobe has decades of accumulated skill and knowledge in producing very nice Type 1/CFF fonts. Back in (IIRC) 1996-97 we had Monotype create some "superhinted" TrueType fonts, which we released as "WebType", but as everyone knows, those fonts are time-consuming (= expensive) to produce. (I was doing TrueType hinting for Monotype around that time, so I understand the process -- at least as well as memory permits.)</p>
      <p>For many reasons, Adobe can't put a lot of time and resources into TrueType production. (We're still looking forward to the days when CFF looks as nice as expected in Windows.) What we've done for our fonts on Typekit is found the best semi-automatic process we can (still a lot of work from Miguel and others here), which I think allows us to produce above-average quality with a realistic amount of effort, and is clearly superior to some other methods. Our skills might rest mostly with CFF, but some of that skill is also general; creating good font outlines and hint parameters are talents equally applicable to TrueType.</p>
      <p>Remember, too, that hints virtually don't matter on Mac OS at the moment. Even if it were possible for Adobe to allocate the necessary resources to produce really <em>really</em> nice TrueType fonts, that's still just for current Windows browsers. That's a significant percentage of browsers right now, but where will we be in just a couple years? We'll no doubt have nice CFF rendering with DirectWrite in new Windows browsers, and I don't know if anything will change for OS X. How much do we want to invest in <em>current-soon-to-be-old</em> environments?</p>
      <p>The bottom line is this: Quality is always a big priority here, but there are many practical matters which weigh in. What level of quality is "good enough" for those people who want to use Adobe fonts on the web right now? We'll find out. Luckily, it's as easy as it's ever been to get bug fixes and improvements into a customer's hands.</p>
