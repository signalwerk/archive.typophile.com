    html: |-
      <p>John's answer and very nice illustrations, describe how optimization may be accomplished via the ppm-specific idealizing of the outlines. When I did my experiments, it was only to show what was being lost by not having x-hints applied when rasterizing for users, (a whole long story, but trust me they are gone). It was never my intent that a raft of ppm sized outlines would be bundled up and made available to anyone, or that font management software of any kind should be trained to deal with this. </p>
      <p>In addition, in the process of drawing size specific fonts as John shows, I discovered if users  have idealized per pixel fonts, they  want another weight to compensate for their tastes. Thus the Franky demo was designed, a raft of 48 outline fonts representing sizes and weights of a gothic font from 8 to 16 pixels. A specimen exists here somewhere. This led me to redouble my efforts to get variation technology back on the radar. A good thing, as it is what Ralph Levine is referring to the need for at the end in Dave Crossland's notes on the Fonts WG meeting. </p>
      <p>It was never my intent to show anything other than what was being lost by Apple in 1999, and MS in '04 when their anti-aliasing techniques were released as Quartz and ClearType. FreeType still/now makes x hinting for effect possible. But, as John points out, idealizing a single outline causes it to become non-linear to itself. So using the idealized metrics then passes to the application, which must keep track of the non-linearity via the TT hdmx table. </p>
      <p>And application/OS using x and y hints on a font to produce the results John or I show would then be scaling according to what the per ppm instructions of the font said to do, per glyph, per width, presumably for a static page-based reading situation. In a zooming environment like the 365 dpi iPhone, or 185 dpi Pre, this kind of optimization would not be required, so it would not be a problem.</p>
      <p>It's almost like two different worlds, zooming places, and reading places. </p>
      <p>Examples of x hinting causing non-linear results are found on the Mac, I know, and probably continues on Windows when they are in aliasing modes. So, what hinting does to optimize reading in x at the cost of linearity, is hardly some kind of alien notion to the OS.</p>
      <p>Bram&gt;...why did designing fonts expressly for low res display purpose never became a popular choice?</p>
      <p>Little market existed with the exception of bespoke device/OS fonts, like hinted Times or Mac and Win OSs, custom designed and hinted Prelude for the Palm Pre and etc. </p>
      <p>Bram&gt;Or is it answered already?</p>
      <p>In a way, <a href="http://www.webtype.com/font/bentonsansre-family/" rel="nofollow">yes</a>. We made screen optimized version of some of our more popular faces, and one new one, and hinted these.</p>
