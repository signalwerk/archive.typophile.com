      <p>I was not present at the panel, but watched the discussion around it, mostly online, quite closely. The question I had after that was “If reading onscreen is important and growing, why did designing fonts expressly for low res display purpose never became a popular choice?”</p>
      <p>The biggest reason I could think for this is inefficiency. Why design new faces from scratch when you can hint existing ones?</p>
      <p>I was then thinking that this question could possibly be answered by tweaking the font’s outline to make a “screen” version of it—reducing contrast, increasing x-height, opening counterspaces, etc.—then hint afterwards. This benefits the foundry because they can “screen-version” their best sellers rather than invest a lot of money and time in the design of a new screen family.</p>
      <p>I’d like to hear this side of the argument be presented more. Or is it answered already?</p>
