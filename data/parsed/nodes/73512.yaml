    html: <p>I do wonder if Adobe released auto autohinted fonts because they don’t expect most of them to be used for running text. The novelty types and scripts become illegible at text size, so there’s no need to hint those manually. And the rest are fairly narrow text faces designed for print—no amount of hinting is going to keep the fine details of Adobe Garamond from turning to blobs at sizes where Georgia reads perfectly. Out of the whole bunch only Myriad seems likely to get used at text sizes because it’s loose metrics and wide design have proven themselves onscreen.</p>
