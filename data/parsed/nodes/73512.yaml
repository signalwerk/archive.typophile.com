      <p>But there is more than just autohinting one single (sans serif, rather light weight, rather simple) font and show A-Z.</p>
      <p>Serif/slab<br>
      Your example already shows that serif faces look much worse.</p>
      <p>Problematic glyphs<br>
      What about the usual suspects like ß, ae, OE etc? S already causes problems.</p>
      <p>Family<br>
      What about an Italic companion? Same behaviour? Stems jump at same sizes?</p>
      <p>Bolder weights<br>
      What about bolder weights?</p>
      <p>Critical PPMs<br>
      Your waterfalls are ok, but perfect would be when we could exactly see the ppms of the stems' jumps.</p>
