      <p>Sii - interesting, I suppose there is truth to that. But for what it is worth, the algorithm I'm using now isn't too smart yet: it strips out all previous hints and instructions, and recreates all the blues values. So from an autohinting perspective, I'm starting only with the outlines.</p>
      <p>As a test, I ran a bunch of Adobe OTF <em>print</em> fonts through and here is the result:</p>
      <p><a href="http://www.fontsquirrel.com/webfont_comparison/adobe_range.png" rel="nofollow">Autohinted Adobe OTF</a></p>
      <p>It is clear that monolinear-ish sans serif fonts do best. The serif fonts have issues here and there: clogging counters, some unevenness at a few point sizes. So the conclusion I come away with is: Duh, don't use Nueva Std as a text face.</p>
