      <p>&gt;What's the difference between a typographer and a graphic designer then?</p>
      <p>To me, the difference is that graphic design involves photos, charts and illustrations as well as type. "Typography" refers only to the arrangement of type on the page, not the other elements. So I would put it more accurately: </p>
      <p>Typography: the craft and art of laying out and setting text on the page or screen. </p>
      <p>A typographer is someone with expertise in typography. Will that do?</p>
