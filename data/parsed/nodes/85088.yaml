  html: |-
    <p>Like Robin Kinross quoted (<em>Modern typography</em>; p.22) from Josef Moxon in his <em>Mechanik exercises: or the doctrine of handy-works applied to the art of printing</em>: "By the typographer, I do not mean a printer, as he is vulgarly accounted, any more than Dr Dee means carpenter pr mason to be an architect: but by typographer, I mean such a one, who by his own judgement, from solid reasoning within himself, can either perform, or direct other to perform the beginning to the end, all the handy-works and physical operations relating to typographie."</p>
    <p>This typographer definition endures in time. But, what the definition of typedesigner? Is just someone who can preform, or direct others to perform the beginning to the end, the digital handy-works of designing  a typeface? or is just a 'modern' definition of typographer?</p>
