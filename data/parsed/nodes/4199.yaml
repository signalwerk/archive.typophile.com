  html: "<p>For the first time in 2 1/2 years, we're taking the Typophile Forums down. The programmers have been working long and hard, and we're going to do some long-needed revamps and improvements. <br> <br>We'll take it down tomorrow, Tuesday, 17 December at 5pm PST. A brand new Typophile Forums will open up on January 6, 2003. <br> <br>Here's a taste of what you can expect in the new forums: <br> <br>• NO FRAMES! (Everybody now, \"Hooray!!!!\") <br>• New Forum organization/architecture <br>• Improved interface <br>• User rank &amp; activity stats next to each post <br>• Define your own user icon! <br>• Automated forgotten password recovery! <br>• Exclusive private forums! <br>• Downloadable font Betas! <br>• One-click Image &amp; attachment uploads! <br>• and much more! <br> <br>We're taking advantage of the slow holiday time to make the upgrades. We hope you'll join us in January to break in the new system.  <br> <br>In the meantime, you can join us in some lively conversations <a href=\"/chat\" target=\"_blank\">here</a>. <br> <br>Happy Holidays! <br> <br>Jared and Joe <br>Typophile</p>"
  html_clean: "<p>For the first time in 2 1/2 years, we're taking the Typophile Forums down. The programmers have been working long and hard, and we're going to do some long-needed revamps and improvements. <br> <br>We'll take it down tomorrow, Tuesday, 17 December at 5pm PST. A brand new Typophile Forums will open up on January 6, 2003. <br> <br>Here's a taste of what you can expect in the new forums: <br> <br>• NO FRAMES! (Everybody now, \"Hooray!!!!\") <br>• New Forum organization/architecture <br>• Improved interface <br>• User rank &amp; activity stats next to each post <br>• Define your own user icon! <br>• Automated forgotten password recovery! <br>• Exclusive private forums! <br>• Downloadable font Betas! <br>• One-click Image &amp; attachment uploads! <br>• and much more! <br> <br>We're taking advantage of the slow holiday time to make the upgrades. We hope you'll join us in January to break in the new system.  <br> <br>In the meantime, you can join us in some lively conversations <a href=\"/chat\" target=\"_blank\" class=\"link-lost\">here</a>. <br> <br>Happy Holidays! <br> <br>Jared and Joe <br>Typophile</p>"
