    <p>This might seem a rather silly question, but I couldn't find an answer.</p>
    <p>What is TxN?</p>
    <p>For example, StormType sells Baskerville Ten, Baskerville Ten S.Caps, and TxN, as part of the Baskerville Ten family. At first I thought it was some sort of modified small txt version of the font, but Baskerville Ten is already designed for use at small sizes, so it might be something else.</p>
