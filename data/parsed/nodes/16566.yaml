      <p>Thanks, Aaron - 3 years later!</p>
      <p>I just wanted to know the same thing.....I have purchased Storm's JBW set, and I was just wondering the same thing. You can't see any difference between the TxN face and the text face in any type software....I suppose you wouldn't notice it until you set numerals. And I don't know of any other foundry that uses the 'TxN' designation...</p>
