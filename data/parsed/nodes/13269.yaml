  html: |-
    <p><a href="/wiki/Leslie%20Cabarga" class="freelinking" rel="nofollow">Leslie Cabarga</a>'s <a href="http://www.flashfonts.com/flashsite/fontspage.htm" rel="nofollow">FlashFonts</a> offers more than 30 fonts, with styles ranging from classic to crazy.</p>
    <p>The name FlashFonts might mislead one to think it refers to bitmap fonts designed specifically for screen use with <a href="/wiki/Macromedia%20Flash" class="freelinking" rel="nofollow">Macromedia Flash</a>. Cabarga's fonts are largely display fonts.</p>
    <p>URL: <a href="http://www.flashfonts.com" title="http://www.flashfonts.com">http://www.flashfonts.com</a></p>
