    <p>Hey I’m a graphic designer with my first real freelance job and I’m looking for a printer who specializes in printing mailing labels. The thing is the client doesn’t want them on a roll, he wants them die cut on a full sheet so he can print the mailing addresses on with his home laser printer. should I just spec full sheet label paper with die cuts or do printers have access to precut stock? I don’t know these things. </p>
    <p>Does anyone have a suggestion for a good printer or a place I can find a list of printers? they need not be local so I’m not concerned about where it is, as long as it’s in the US.</p>
