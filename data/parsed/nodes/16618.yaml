      <p>I think any graphic designer would definitely love the entire <a href="http://www.penguin.co.uk/static/cs/uk/0/articles/greatideas/" rel="nofollow"><em>Great Ideas</em></a> set from Penguin. Loverly typographic covers adorn some inspiring—if not downright revolutionary—texts from smarty-pants know-it-alls like Nietzsche, Woolf, Freud, Orwell, Marx and others. </p>
