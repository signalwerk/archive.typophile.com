    <p>i am trying to find something typographic (other than a CD of typefaces) that i can buy/steal/make/acquire for my graphic designer girlfriend for the holidays this year - any ideas?  i have already been through the Veer catalog, as well as some of the foundries, and a T-shirt is not really what i am looking for. something unique, beautiful, and made of or insipred by typography. It does not neccesarily need to be super cheap - id like to get her something nice. jewlery? handmade typographic clock? i am at a loss here.</p>
    <p>any thoughts?</p>
