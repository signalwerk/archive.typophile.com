    html: <p>eBay, under <strong>Business and Industrial &gt; Printing and Graphic Arts &gt; Graphic Arts Essentials</strong> has LOTS of letterpress cuts and woodtype up for auction at ANY given time. There's something charming and captivating about these "artifacts," and they can make quite attractive decor as well. Of course, going the auction route is always hit or miss -- someone else may REALLY want that item that has caught your fancy but, as often as not, some real gems gets overlooked and can be had at a VERY reasonable price.</p>
