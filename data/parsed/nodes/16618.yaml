    html: |-
      <p>I would move ahead with the "typographic clock". Find out her top 12 faces, and assign one to each hour (ransom note style). Or make all the digits in the same one. Or no digits at all -- assign letters and reinvent her concept of time. I'm sure she'll be into meeting you for a date at L:RC o'clock. Plus, making it yourself beats anything you'll find for sale at veer (sorry veer).</p>
      <p>The best typographic gift I recieved was the "CTS Photo display catalog" (a phone book sized type specimen collection). Not the most obscure collection, but for graphic designers, seeing a face in print helps with type choice far better than screen previews. Plus, there's a perverse collection of swashes and unseemly ligatures.</p>
    html_clean: |-
