    <p>The newly redesigned, by Marek Pistora, Czech magazine FONT invited José and Veronika to speak amongst other things about their beginnings, influences, approach to design and way of collaboration. The well designed four-page interview also shows some samples of our typefaces in use, such as in various newspapers and books.</p>
