  html: |-
    <p>The Oregon State Bar is the organization that serves the membership of lawyers in Oregon. While other attempts at this identity tried to incorporate icons having to do with the law, I tried to represent the bar in the feeling from the design. The goal here was to create an identity that would work well with communications, allowing the information to stand out with the logo as a backdrop. This will probably be a change of pace from the crazy cool identities in here. I've been a long time fan of the site but never posted before. Any comments or improvements are welcome. Thanks guys. Color palette hasn't been fully developed yet.</p>
