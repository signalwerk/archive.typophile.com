      <p>When the logo is printed at a small size and on cheap paper, or xeroxed and faxed, the word "State" will fill up with ink. </p>
      <p>Why is "State" being emphasized? </p>
      <p>How did you decide on the proportions of the black rectangle?  The rectangle is so strong that the words are being broken apart and not held together.</p>
