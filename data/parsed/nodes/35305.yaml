    html: <p>Good points. Thanks for asking intelligent questions. I have tried a lot of printing situations. I was concerned with that at first too. It seems that it holds up pretty well. I'll have to see what happens after we have it printed litho. I think the reason why I emphasized "state" was because the organization wouldn't be here today without the law handed down from the Oregon supreme court declaring that every Oregon lawyer must be a member of the bar to practice law in the state. I felt that was an anchoring factor. The proportions are based on three lines of type set within the rectangle and still having the same space on both top and bottom. (If that makes sense.) I never thought about the type seeming broken apart. Thank you for that point. I see what you mean. Really appreciate your comments thanks again.</p>
