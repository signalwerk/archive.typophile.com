    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Vincent Connare</strong></p>
    <p>Vincent Connare has been working professionally in the software industry producing font projects for corporations for over fifteen years. While working at Agfa/Compugraphic from 1987 till 1993 he was a member of the <a href="/wiki/Ikarus" class="freelinking" rel="nofollow">Ikarus</a>, <a href="/wiki/Intellifont" class="freelinking" rel="nofollow">Intellifont</a> and <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> font production teams. At Agfa he was one of the first type designers to learn TrueType <a href="/wiki/hinting" class="freelinking" rel="nofollow">hinting</a>. He finalized the hinting of four TrueType fonts to Apple's first TrueType font pack.</p>
    <p>In 1993 he joined <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a> Corporation as a Typographic Engineer and worked on custom type projects for Microsoft products. At Microsoft he designed and produced two of the most popular <a href="/wiki/typeface" class="freelinking" rel="nofollow">typefaces</a> of the 1990's, <a href="/wiki/Comic%20Sans" class="freelinking" rel="nofollow">Comic Sans</a> and <a href="/wiki/Trebuchet" class="freelinking" rel="nofollow">Trebuchet</a>. There he also wrote documents relating to TrueType hinting and font production. </p>
    <p>Today, Vincent is on the staff of <a href="http://www.daltonmaag.com" rel="nofollow">Dalton Maag Ltd.</a> A London based type design agency which specializes in corporate font solutions, branding, and type design.</p>
    <p>Vincent is also an accomplished photographer and photo technician. He has worked as a newspaper photographer and darkroom technician and currently photographs TV presenters, actors and comedians. He has been published in advertisements and articles such as:<br>
    <a href="http://www.closermag.co.uk/" target="_blank" rel="nofollow">Closer magazine - July..Aug 2005</a><br>
    <a href="http://www.spotlightcd.com/" target="_blank" rel="nofollow">Spotlight (2006)</a><a href="http://www.creativereview.co.uk/Home/Home.aspx" rel="nofollow"><br>
    Creative Review – July 2006</a><br>
    <a href="http://www.nivea.co.uk/" target="_blank" rel="nofollow">Nivea Fashion Police (UK) 2006</a> advertising campaign.<br>
    The University of Manchester (UK) 2006<br>
    BBC 'Radio Times' 2006</p>
    <p>Vincent was trained in painting and photography at <a href="http://http://www.nyit.edu/" rel="nofollow">New York Institute of Technology</a> in New York City and has worked as a newspaper photographer and photographic technician in Massachusetts and a silkscreen fine art printer in New York City. Vincent holds a Master's Degree in Type Design from the <a href="http://http://www.rdg.ac.uk/" rel="nofollow">University of Reading</a> in Berkshire, England. </p>
    <p>his website is : <a href="http://www.connare.com/" rel="nofollow">www.connare.com</a></p>
