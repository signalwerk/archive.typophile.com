    date_raw: 3.Dec.2004 6.00am
    votes: null
    html: <p>Now Ken I have one more bone to pick with your ads. Way too much copy. You need to tease the reader into action. In this case either calling the toll-free number or going to the web site. At the web site or the telephone operators can give the full story. Also I'm confussed do you only handle ground traffic or air traffic as well? If you handle air traffic you somehow have to make that clear too.  <br> <br>I like the two column format but not the justification. To justify copy it creates wholes throughout the paragraphs as letter spacing and word spacing is compromised to make it flush. Thats why the color of Flush left, rag right copy reads better. I don't think it matters if the serif has any relationship with Dax, the body text is not the logo and should probably be kept separate from it. Keep up the good work</p>
