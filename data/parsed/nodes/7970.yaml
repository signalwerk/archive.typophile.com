    html: <p>Ken, justifing that much text copy is hard to read. Make it Flush Left, Rag Right. Also (if you can) allow for some hypenation for better color. The banking industry here doesn't allow hypenation. You might also look into making a two column layout. Remember most people read newspapers and magazines and they generally don't have wide columns. Just because the logo is in a sans serif face it doesn't mean you can't have a serif face for the body copy. I would think the separation would help the communication. Think again about newspapers and magazines. <br> <br>One last thought the 97% ad is unreadable with the body text like that. Its also inconsistant with your other image ads. How about getting a picture of a rig and in photoshop put the 97% on the trailer of the rig. Reinforce that its about ground transportation.</p>
