    html: <p>Ken, <br>This is some good work. As a first comment I would make sure that you do not use double word spaces after a full point (or in any other place) this will improve the colour of your type, for certain combinations . W and . T it is worth kerning the space to help. As pointed out justified type can be a bit of a trial, for example, in your first (and to a lesser extent in the second) the second line of the righthand column is a bit spacy, if you are in a position to rewrite/have rewritten to suit that might help, or there is no reason that the two columns couldn't be different widths. To aid readers and potential clients I would try to get all three elements of the date in the same line. In the second layout the leading in the righthand column is not the same as that of the left not being the same results in an ugly step. To get picky, if you have a full point or comma at the end of a line in justified text it can make a step in the righthand vertical margin, an easy way to deal with this is to insert a white (or the same colour as the background) full point/comma at the end of each line to create hanging punctuation (remember that you have done this when it comes to changing/updating a piece of text). I might consider moving the logo so that the t of Connect aligned with the righthand margin of the body copy. <br>Tim</p>
