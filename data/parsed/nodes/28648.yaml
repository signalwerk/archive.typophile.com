  html: |-
    <p>I am designing a business card that needs to include an email address, which leads me to the dreaded @ symbol. I despise this symbol, and have been toying with a substitution,<br>
    (AT ligatures) especially since designing in faces such as Garamond, Hoefler etc.<br>
    Do not go with such a modern symbol. What are your thoughts on this?</p>
