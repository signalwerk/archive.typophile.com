    html: |-
      <p>You can certainly replace it with the word 'at'. Of course, then, to avoid any inconsistency, you have to treat the dot sign the same way. Yourname at hotmail dot com, for instance.</p>
      <p>My question is, do you have a good reason to do it?</p>
      <p>I, for one, wouldn't break the rule at the expense of clarity.</p>
