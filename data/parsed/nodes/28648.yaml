    html: |-
      <p>It's not as if the "@" is anything new. It has been around at least almost as long as there have been typewriters, if not longer. Only the usage is modern, and even that goes back to the late ’70s. I read some report on the history of the thing a while back. I wish I could recall the link.</p>
      <p>Anyway, if you don't like the way the character fits in with the typeface, redesign it, but make sure it will still be understood as what it is.</p>
