    html: |-
      <p>&gt;important role…</p>
      <p>I think this is right on point. I think that with the symbols in general--# % + © and so on, the point of them is partly to *not* look like the other letters, so they stand out as markers of the text as different in the way indicated by the marker. When they are well designed they harmonize, but are different enough to be noticed as markers.</p>
