      <p>In my designs, I've used a vertical 'at' ligature, as well as a lot of other ideas. One im nearly done with has a very low tail, extended-right tail extending into the next letter, another looks like an underlined 'a', a (c) or an (r) symbol. Since none of these have had any negative feedback whatsoever, I'd say theres a ton of freedom in what you want it to look like. The places were an @ is used are pretty well understood, and not normally inside of words, so you can get away with more.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
