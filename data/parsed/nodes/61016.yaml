    html: <p>I didn't say that OpenType Layout was not able to do the kind of things you want to do, I said it was not designed to be able to do these things. So if it can do these things it is only by chance, and you can't expect it to always be able to do everything you want in this regard, because you might eventually run into reasonable limitations. And even if you can do these things with OTL, I still maintain that you <em>should not,</em> because what you describe are properly text manipulations, which should be applied at the character level, not at the glyph level.</p>
