      <p>Yikes! So you're trying to do ketiv/qere distinction display in glyph substitutions? That seems to me a really bad idea. This is a text distinction, and if you want a text that includes both forms and can switch between different display options, then you probably should use XML tagging of the character strings and base your display options on that. OpenType glyph substitution isn't designed to be able to handle this kind of thing.</p>
      <p>Never mind hijacking layout features: you're hijacking the whole layout model.</p>
