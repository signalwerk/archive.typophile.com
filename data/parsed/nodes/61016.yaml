  - id: 362058
    user: 1262
    date: 2009-08-17T13:36:00
    date_raw: 17.Aug.2009 1.36pm
    votes: null
    html: <p>I wrote to my WinSoft contacts about the 'Stretched Alternates' function in InDesign ME. This is a legacy function that makes use to two private features, not part of the OpenType specification, to identify left and right parts of stretched connecting forms in a particular Arabic font. This was implemented to support this Arabic font, Decotype Naskh (not to be confused with the Naskh type from Decotype used in the new Tasmeem add in to InDesign), which was originally in the Middle East version of PageMaker and which used this mechanism because OpenType contextual substitutions were not available at that time. This function is only included in InDesign ME for backwards compatibility.</p>
    html_clean: <p>I wrote to my WinSoft contacts about the 'Stretched Alternates' function in InDesign ME. This is a legacy function that makes use to two private features, not part of the OpenType specification, to identify left and right parts of stretched connecting forms in a particular Arabic font. This was implemented to support this Arabic font, Decotype Naskh (not to be confused with the Naskh type from Decotype used in the new Tasmeem add in to InDesign), which was originally in the Middle East version of PageMaker and which used this mechanism because OpenType contextual substitutions were not available at that time. This function is only included in InDesign ME for backwards compatibility.</p>
