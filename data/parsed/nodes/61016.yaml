      <p>Oh, I see what you mean now. You want to know how to access the ‘Stretched Alternates’ function that appears in the InDesign ME OpenType menu. Good question. I've never noticed this before. I presume it is intended for use in Arabic, but I can't think to what OTL feature it corresponds. In Arabic, what we might consider stretched alternates are a class of swash letters.</p>
