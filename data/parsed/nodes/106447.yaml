    <p></p><div class="imageWrap"><img src="http://typophile.com/files/agatha_4264.png"></div><p></p>
    <p>Came across this lovely "g" (top). It's from the movie The Mirror Crack'd (1980).<br>
    The font is defenitely Friz Quadrata Bold (bottom), but I haven't seen this "g" before. I thought perhaps it's been derived from "3", but it's not ;)<br>
    Does anyone know if there's a different version of Friz Quadrata, or is this custom?</p>
