      <p>Yes.<br>
      Save your work first, because this can't be UNDOne.<br>
      Tools/Action/Contour/Shift<br>
      Vertical Shift -12 / Check the box 'apply to entire font' .</p>
      <p>If you don't like the result, File/Revert to the last saved version.</p>
