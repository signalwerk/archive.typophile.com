  html: |-
    <p>Hello,</p>
    <p>How do I globally shift the baseline position in FL? Currently, it seem that when I shift the baseline in a glyphs windows, the change is applied only locally to that particular glyph. Also I don't see any option to modify the baseline position in the font metrics.</p>
    <p>Thanks!</p>
