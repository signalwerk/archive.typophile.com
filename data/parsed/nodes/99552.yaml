    html: "<p>Technically speaking, the baseline can't be shifted —  notice that even when you move it in the glyph window, it stays at 0 and simply shifts the glyph itself. You can achieve the same effect on multiple glyphs with <code>Tools &gt; Action</code> (the very first one under Contour), or using the Transformation panel with the glyphs selected in the Font window. (Note: the Shift command in Transformation panel doesn't shift hints or masks, so if your glyphs have either of those, use the Action tool.)</p>"
