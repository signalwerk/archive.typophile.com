      <p>It was a one-off, John, and won’t be there forever. And <em>if only!</em> the LettError kidz had the sort of chops necessary to vary character shapes from position to position! <em>When</em> will these boys learn?</p>
      <p>Wait.</p>
      <p>Anyway, I actually don’t mind the phenomenon, which I think was cancelled out by the really well-considered size and positioning variations. Although legitimate calligraphy might also have been interesting, if unwieldy and expensive.</p>
