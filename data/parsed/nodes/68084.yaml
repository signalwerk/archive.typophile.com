      <p>The impact is very effective, although I wonder what it will be like for the residents, presuming the intention is to leave the text in place? Or is this only temporary, for the opening?</p>
      <p>Although the overall effect is good, it strikes me as a pity, looking at the close-ups, that this is a typeface with single forms for each letter: seeing identical shapes repeated in close proximity undermines the apparent handwritten quality of the text and, hence, its individual personality.</p>
