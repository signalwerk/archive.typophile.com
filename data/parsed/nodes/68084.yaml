  html: |-
    <p>Woodgreen Community Services bought an “<a href="http://www.woodgreen.org/support/Adopt-A-Family.html" title="Under the Adopt-a-Family program" rel="nofollow">atrocious</a>” old rooming house in east-end Toronto (at Queen and Carroll in Riverside), gutted it, and rebuilt it as well-finished transitional housing for homeless people.</p>
    <p>At last night’s unveiling (2010.03.04), I was surprised to see a transcription of an interview with an underhoused person written all over the walls…&nbsp;in Erik van Blokland’s <a href="http://new.myfonts.com/fonts/fontfont/ff-erikrighthand/?testdrive=dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dcustom%26text%3DMy%2520name%2520is%2520Bob%2520and%2520I%25E2%2580%2599m%252056%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D33" title="MyFonts sample" rel="nofollow">ErikRightHand</a>. Effectively used, with actual graphic design deployed on large canvases in unexpected locations, like stairwells. (I got to tell the manager I knew the designer!)</p>
    <p>(<a href="http://www.flickr.com/photos/joeclark/sets/72157623435726865/" title="Flickr set" rel="nofollow">More pictures.</a>)</p>
