      <p>These are not “typefaces” as such, but medium-dependent alphabets, which means they were specifically created for road signs and are unavailable for any other application.</p>
      <p>There <em>is</em> a slight possibility though that somebody digitised this, but I wouldn’t know. BTW These are the ugliest signage alphabets bar none I know of.</p>
