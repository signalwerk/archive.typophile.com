      <p>Exactly. I have to look at them every day! Then I saw them in Switzerland. But these were much better. The Belgian signs are old, they’ve been here for about 30 years or so. The Swiss are much more recent. They also have created different weights. The Swiss probably finetuned this old Belgian typeface, who knows... </p>
      <p>But it’s not because they look ugly that they are less interesting. And I’m intrigued by the flat ’a’.</p>
      <p>Does someone know the name or history or do you know a link or lead to the solution? Please help, it’s killing me!</p>
