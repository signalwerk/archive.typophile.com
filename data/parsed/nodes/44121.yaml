      <p><cite>People got by just fine not having access to smart quotes outside of books and magazines for what, a century-plus? </cite></p>
      <p>Not really. They got by when typewriting letters, since the typewriter only contained prime marks. But typewritten paper was not the bulk of most people's reading. Most of their reading would have been typeset, in books and magazines. </p>
      <p>Jason C</p>
