    html: |-
      <p>"Typewriter quotes" are ASCII quotes. "Smart quotes" are the raised comma and the turned comma. And by the way, the raised comma is also the apostrophe.</p>
      <p>It does matter when you use the Latin alphabet for some transliterated languages. Look at how Omniglot shows Apache: </p>
      <p><a href="http://www.omniglot.com/writing/apache.htm" title="http://www.omniglot.com/writing/apache.htm">http://www.omniglot.com/writing/apache.htm</a></p>
      <p>Now in Apache, that ASCII apostrophe should be a raised comma to signal a glottal stop. But not all orthographies use the raised comma for the glottal stop; for whatever reason, Polynesian uses a turned comma for just the same purpose.</p>
      <p>The confusion between ASCII apostrophe &amp; raised &amp; turned commas has let some web sites who fail to notice the distinction to make errors, and some publishers look at sites such as Omniglot to request the ASCII apostrophe to signal a glottal stop in some Native American languages -- which is flat out wrong.</p>
      <p>The typewriter is pretty dead. The ASCII apostrophe &amp; quotes should die with it.</p>
