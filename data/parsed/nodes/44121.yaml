    <p>Look at this as a reminder of what you're up against, when fighting the good fight for good design.</p>
    <p>This entertainment site, Quick Stop Entertainment, posted an item looking for some coding help with two "improvements" they'd like to make on their site. On the following page, look at item #2 (about 6 paragraphs down)</p>
    <p><a class="freelinking external" href="http://www.quickstopentertainment.com/2008/04/10/think-tank/" rel="nofollow">Fancy quotes. We hate them.</a></p>
    <p>to quote some of the highlights:<br>
    <cite>Fancy quotes. Whether you call them fancy or smart ... We hate them ... Trouble is, having to do a find and replace all for smart quotes to regular quotes is a pain in the ... We know Wordpress has the ability to “fancy-ize” regular quotes, but how can we get Wordpress to “unfancy-ize” smart quotes? In other words, anytime there’s a smart quote in a post, we want it to automagically change it whenever the post is generated on the site and viewed by you, the lovely public.<br>
    </cite></p>
    <p>Uggh. Luckily these guys aren't clients, but if they were - where do you even start?</p>
    <p>Jason C</p>
