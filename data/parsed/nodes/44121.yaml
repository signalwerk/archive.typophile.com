      <p><cite>Luckily these guys aren’t clients, but if they were - where do you even start?</cite></p>
      <p>Give them what they want. There are technical reasons why having real quotes in web sites can be a PITA, and things can look like crap when some people are using them and some aren’t. People got by just fine not having access to smart quotes outside of books and magazines for what, a century-plus? It’s a bit much to expect everybody to start caring about them.</p>
