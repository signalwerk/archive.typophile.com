      <p>Memo to James Puckett and everyone else who reiterates the same half-truth: If smart quotes are borking on your Web site, then what’s borked is your character encoding, not your smart quotes. There are enough Web sites you could Google on this topic to understand it. (Hint: The word “Unicode”&nbsp;is involved.)</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
