      <p>Gmail does what they want. I'd been using the Alt+0<em>xxx</em> method to enter various symbols under Windows, and Gmail puts nearly everything through as entered—except that I get "straight quotes" no matter what I enter. It's reasonable, I suppose, if the rest of the text can be straight-up ASCII, to make this change: some older mail-readers have trouble with non-ASCII symbols. But Google really should leave the curly quotes alone if the rest of the message requires Unicode anyhow…<br>
      —Joel</p>
