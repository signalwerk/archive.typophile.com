    <p>Hello there fellow Typophiles,</p>
    <p>I'm looking for advice on a typeface for the body text on a website I'm working on. The website is about wedding photography, so I'm thinking that an elegant (but legible) roman typeface would fit nicely. Though I would really like to use true small caps, something I'm having trouble finding in a web font. <strong>Question: Do you know any free or affordable web fonts with true small caps?</strong> (that fit my requirements)</p>
    <p>I've been looking at Typekit and Typotheque and the best I could come up with is <a href="http://www.typotheque.com/fonts/greta_text">Greta Text</a> or maybe <a href="http://www.typotheque.com/fonts/brioni_text">Brioni Text</a>.</p>
    <p>Any other recommendations?</p>
