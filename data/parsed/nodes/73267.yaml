      <p>There is currently no way to access true small caps in webfonts. Just the latest Firefox beta added this feature:<br><a href="http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype-features/">http://opentype.info/blog/2010/08/14/better-web-typography-with-opentype...</a></p>
      <p>I would recommend to stick with Typotheque because their backend allows you to convert the selected fonts to small caps, so every browser then can show the true small caps.</p>
