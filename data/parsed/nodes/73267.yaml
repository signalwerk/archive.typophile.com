      <p>All Web FontFonts have separate SmallCap fonts available so that Small Caps can be used by browsers.</p>
      <p>Check out these:</p>
      <p><a href="http://www.fontshop.com/search/?q=clifford+web+sc&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=clifford+web+sc&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=clifford+web+sc&amp;x=0&amp;y=0</a><br>
      <a href="http://www.fontshop.com/search/?q=milo+serif+web+sc&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=milo+serif+web+sc&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=milo+serif+web+sc&amp;x=0&amp;y=0</a><br>
      <a href="http://www.fontshop.com/search/?q=quadraat+web+sc&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=quadraat+web+sc&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=quadraat+web+sc&amp;x=0&amp;y=0</a><br>
      <a href="http://www.fontshop.com/search/?q=tisa+web+sc&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=tisa+web+sc&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=tisa+web+sc&amp;x=0&amp;y=0</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_web_regular_sc/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_web_regular_sc/">http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_web_regular_sc/</a><br>
      <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_yoga_web_regular_sc/" title="http://www.fontshop.com/fonts/singles/fontfont/ff_yoga_web_regular_sc/">http://www.fontshop.com/fonts/singles/fontfont/ff_yoga_web_regular_sc/</a></p>
      <p>You can host them via Typekit after you purchase them from FontShop.</p>
      <p>Hope that helps,<br>
      Jens</p>
