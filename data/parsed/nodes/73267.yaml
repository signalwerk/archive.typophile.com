      <p>Thanks for all the great suggestions :)</p>
      <p>I ended up using a typeface I found elsewhere though. The one I got was <a href="http://www.fontspring.com/fonts/fontsite/caslon-fs" rel="nofollow">Caslon</a> from Fontspring. Six weights, including two small caps weights for 20 bucks in total, pretty good deal if you ask me.</p>
