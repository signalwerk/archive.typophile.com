      <p>Black Monday is a distressed version of Eagle, a 1930s face, so yes, you're more after a mid-century look, which is less deco, more grotesque, 19th century retro. However, I do think that glyph alternates is a very important part of the Chez Panisse aesthetic.</p>
      <p><a href="http://christianschwartz.com/local.shtml" rel="nofollow">Local Gothic</a> has that, but the effect may be a bit too obvious for your needs.</p>
