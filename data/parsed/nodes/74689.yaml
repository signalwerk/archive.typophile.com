    html: |-
      <p>Stephen, those are fantastic and comprehensive suggestions. You're right that it's the combination of irregular/grotesque that I'm connecting with on the Chez Panisse website, which means Coldharbour feels nearly pitch perfect, but (on the irregular side) Toronto Gothic also suggests another direction, and Brandon Gothic nails the mood of the letterforms. I think I'll mock up all three – thanks and bravo.</p>
      <p>I agree with you about the instinct that this is a custom font. It's no surprise, I guess - Alice Waters is very particular about everything at her restaurants. I love the idea that her tastes are so highly developed that not only does the food have to be top-notch, but she needs properly-set Myriad, or at least can discern the designers who are going to be able deliver it for her. There's something about aesthetics and auteurs there that I love. I got to eat at the Café a few years ago, but was too fixated on my nettle souffle to notice the typography (for once!).</p>
      <p>Thanks again to everyone. I hope I can be as useful to you all one of these days!</p>
