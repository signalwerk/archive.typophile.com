    <p>Hi all,</p>
    <p>I'm working with clients who want to recall the farmhouse (or is it mid-century Parisian?) aesthetic they get from the typography on the website for Alice Waters' restaurant, Chez Panisse:</p>
    <p><a class="freelinking external" href="http://www.chezpanisse.com/reservations/" rel="nofollow">http://www.chezpanisse.com/reservations/</a></p>
    <p>Nothing on WhatTheFont quite matches the quirks of this one (the 'E' and 'P,' for instance). What are your best guesses? And how would you describe this aesthetic? We're shooting for something that "you would find on the side of a barn." Thank you all <em>so much!</em></p>
