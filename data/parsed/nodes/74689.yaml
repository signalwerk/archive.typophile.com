    html: |-
      <p>Chez Panisse pays a lot of attention to their typography. I was just at the Café the other day and was impressed with the menu that used proper optical sizes of Minion. They change often. I would not be surprised if this was a custom typeface.</p>
      <p>I think "irregular industrial grotesque" is a good way to describe this. It’s also more European than American. <a href="http://new.myfonts.com/fonts/device/coldharbour-gothic/?refby=typographica" rel="nofollow">Coldharbour Gothic</a> is the closest thing I know in digital font form.</p>
      <p><a href="http://new.myfonts.com/fonts/hvdfonts/brandon-grotesque/?refby=typographica" rel="nofollow">Brandon Grotesque</a> might be what you're looking for, but probably too polished. <a href="http://www.fontshop.com/fonts/singles/red_rooster/tempo_medium_grunged/?affid=99346" rel="nofollow">Tempo</a> is another option, but with contours based on the small sizes of metal type, probably doesn't cut it for headlines.</p>
      <p>How about <a href="http://www.fontshop.com/fontlist/families/rhode/" rel="nofollow">Rhode</a>? Too regular?</p>
      <p>A wood type sans like <a href="http://new.myfonts.com/fonts/ephemera/toronto-gothic/?refby=typographica" rel="nofollow">Toronto Gothic</a>, <a href="http://www.fontshop.com/fonts/downloads/typeotones/wilma_family/?affid=99346" rel="nofollow">Wilma</a>, or <a href="http://www.fontshop.com/fontlist/genres/distressed_weathered_wood_type/?affid=99346" rel="nofollow">this distressed fonts</a>, perhaps.</p>
