    html: |-
      <p>The Romain du Roi was a very considered design where every line making up an individual letterform was forced to fit to a standardised grid (lines for both horizontal and vertical axis) which was used for all letters. Before the Romain du Roi it is obvious that punch cutters made their types align to the various vertical heights required: descender, baseline, x-height, cap-height and ascender lines – but it was likely to be a more random consideration for how the letter would fit on the horizontal. This was more a matter of a judgement by eye. This was restricted somewhat by perhaps having a set of predetermined widths to fit types onto but this wasn't really necessary until machine manufactured type for the compositors [Speculation].  So perhaps up until Romain du Roi type widths were random - Can anyone confirm or deny this?</p>
      <p>Consider that Gutenberg had same letters of various widths so as to fill out lines. Setting type (by hand) always needs variables to make the system work. i.e being able to add in various widths of space to make a line of type fit its set measure.</p>
      <p>For Romain du Roi, fitting the design to a specified grid structure was less a mechanical requirement , but rather one of aligning letters to the 'high art' of geometry. [See Dürer, Albrecht (1471–1528), German engraver and painter also did an investigation into the geometry of letterforms]. The designs were being created in a time where geometric purity in architecture and the arts were desired, especially by the King, and the illuminati.</p>
      <p>I hope others can add a couple of references. Interesting topic.</p>
      <p>/michael</p>
