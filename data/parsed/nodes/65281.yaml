    <p>Hullo hullo,</p>
    <p>I have just been told that the Romain du Roi has a horizontal axis. It is the first time I ever hear of that. Can anyone enlighten me? I know what a vertical axis is but I don't get the idea of horizontality.</p>
    <p>Thanks in advance for your help!</p>
    <p>D.</p>
