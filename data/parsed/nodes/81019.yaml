    html: |-
      <p>The "size" OpenType Layout feature allows that, at least in theory. It works so that a font is switched to a different font automatically at a defined point size. However, none of the major applications support the "size" feature. To my knowledge, only XeTeX (the opensource automated typesetting engine based on TeX) supports it. </p>
      <p>Also, in small pixel sizes, you can adjust the screen appearance of the letterforms using hinting, especially in TrueType-flavored OpenType fonts. Different operating systems and applications will process the hinting in different ways, though. On Windows, the results of the adjustments will be more visible than on Mac OS X.</p>
