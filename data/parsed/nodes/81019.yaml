    html: <p>This is not only non-automatic, no way expressable at low resolution and small sizes, and unidentifiable for a range of sizes, but the only practical  way to inform the user of even the presence of a size master is in the font family name. And for a full picture of any such family, the entire family or it's marketing materials,  must be present if the user is to sort it out for proper use.</p>
