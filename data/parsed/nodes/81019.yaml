  html: |-
    <p>Is it possible in OTF to use two shapes of Diacritics, where each shape meant to display in a different point size.</p>
    <p>For example, I want to display 6,8,10 point sizes with different shape of diacritics, and for larger point size use other shape of Diacritics in same font face name.</p>
