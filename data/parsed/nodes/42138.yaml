    html: |-
      <p>Perhaps this font changes each month but the one used now (3-6-08) is not FF Clan Pro. Also, I don't see a right hand column listing the font name in my browser (Firefox).<br>
       What I did do is look at the coding of this web page and found that the heading font for this thread ("Typophle site fonts") is retrieved by the following shockwave-flash object:<br>
        <a href="http://www.typophile.com//sites/all/themes/typophile/swfs/Headline.swf" title="http://www.typophile.com//sites/all/themes/typophile/swfs/Headline.swf">http://www.typophile.com//sites/all/themes/typophile/swfs/Headline.swf</a><br>
      which you see uses the name "Headline". If you go to this URL you will see a bit of this font.<br>
        A similar bit of code using the name "GothamBold" retrieves that font elsewhere on the page.<br>
       What I haven't found yet is any font named "Headline" or with "Headline" in the name that matches this heading font. Does anyone know what this font is?<br>
       Thanks, Ray</p>
