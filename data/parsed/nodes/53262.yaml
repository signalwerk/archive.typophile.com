      <p>Why Frutiger? It seems totally irrelevant to American black history. It’s bland, corporate, and European; combined with the beige and brown tones this feels like a dated corporate piece. Gotham, Benton Sans, Titling Gothic, ITC Franklin, Trade Gothic, and News Gothic would all work better.</p>
      <p>And your use of positive/negative space seems completely random, governed only by how it’s convenient for you to cram stuff into the composition. If you’re using a grid, you need to do a better job of it; if you aren’t using one, you need to.</p>
      <p>Think about what you’re doing with punctuation. In many places it’s unnecessary and looks awful, making me wonder if these snippets were just copy/pasted from somewhere else.</p>
