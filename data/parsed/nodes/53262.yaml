    html: |-
      <p>Thanks for the comments everyone.</p>
      <p>Here is another update, only 50%.  I have decided to go with Benton Sans.  Frutiger was indeed too European and lacked any character.  I am going all caps to make the parts fit together better.  Since I am opting for NO negative space instead of pieces here and there I really needed stackable blocks to make the puzzle fit together.  I managed to be creative with the two descenders in there, the two Q's but if there were a whole alphabet of descenders and descenders, it would have been really dicey.</p>
      <p>I also really crazy with all the widths and most of the weights.  Even mixing up weights and widths mid sentence.  i may not be totally cohesive and clean, but at least there is some logic behind most of the type decisions.  I will also note that the subject of this is struggle, opresions and growth.  I didn't want it to be TOO clean, which is why I broke up some of the columns that were forming around the middle.</p>
      <p>Any further thoughts?  Thanks.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophiletest2_4383.gif"></div><p></p>
