      <p>There is a lot going on here but a couple suggestions would be:</p>
      <p>1. Add some white space. The spots where there is not text seem like there should be right now. In your original 'mashup' there was negative space to break up the black text and lead your eye. Even with the color difference I think there is some needed. </p>
      <p>2. Maybe reconsider some of the words you chose to highlight. For instance "the last SLAVE SHIP arrives" I would change to "THE LAST slave ship arrives". We already know by that time we are talking about slavery. Also, in that same line, if you are going to make the caps smaller I would match them to the x-height or some other grid line. You have a grid set up?</p>
      <p>3. I'm sure you planned to do this, but make sure you spell check this thing before you get it printed. "Rhode Island becomes the first <strong>colont</strong> to ban the import of slaves."  </p>
      <p>Hope this helps</p>
      <p>JB</p>
