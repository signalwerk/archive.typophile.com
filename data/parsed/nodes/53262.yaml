      <p>Thanks all for your comments.  Let me address them.</p>
      <p>No I am not using a grid.  I suppose I should though.  I didn't think it was too out of line though.  Even with a grid it would be tough to make it work visual with all the caps and non-caps in there.  I agree though that the spacing is a little messed up.  The breaks really only exist because I couldn't fit the type in there and make it work visually.  It DOES look like it's missing something.  Unfortunately I cannot afford to add negative space in there like the other mashup.  I am trying to fit something 12 feet long into something 4 feet long.  </p>
      <p>So does anyone have any suggestions about how to remedy thing?  I really don't want to leave out information.  </p>
      <p>There is no particular reason why I use Fruitger, I just use it a lot.  It its also very conducive to small screen printing and has great legibility at small sizes, very condensed.  Is it really irrelevant to black history?  Are other fonts more relevant?</p>
      <p>As for the overall design, It has to be compact to fit all the info in there.  Nothing I can do about it, I can't go any smaller with the type.  I am hoping that when it's al done and there is four feet of what you see it will look kinda random, like a blanket.  It is not supposed to read, like a book, from first statement to last, other wise it would be in book format.  But information can be picked out, with a glance or too.  Which is why the dates are in the format.  The statement "In 1619 the first slave ship lands." holds no relevance, its just a stat, but the statement "389 years ago, the first slave ship lands." carries weight because the time is references modern day, specifically, the first black president, which is where this piece ends.  So each statement, I think, can stand on it's own and doesn't have to flow to the next.</p>
      <p>I would love some more critique.  What do you mean by columns and line breaks?  Is there room for that?  And would a grid make things too orderly?  When I think of black history, I think hardship and struggle.  Perhaps adhereing to a strict grid would make it too..... "white man"</p>
      <p>Thoughts?</p>
