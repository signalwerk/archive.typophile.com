      <p>I don't usually troll the critique section, but I saw that speter was the last commentor so had to take a look!</p>
      <p>I think you need less white space and you need to find some fonts where you can really pack it in. More density would really add to this design. Drop the Frutiger and find something more elemental. A series of wood types would be more appropriate. I'm not a big fan of Knockout, but it might just be perfect for this.</p>
