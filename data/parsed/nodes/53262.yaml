      <p>Indeed, the biggest issue for me here is the use of space, and of course the choice of typeface. I should also mention the choice of colors - your palette is quite bland and could use a few hits of a hotter color.</p>
      <p>I am having troubles following the statements and my eyes get very tired and confused after just a short glance, so I don't want to look at it for too long. Currently, it is falling apart all over the place and I have no idea what you are trying to tell me with the design. All I can read is "389 Slave Codes in Rhode Island."</p>
      <p>In order to create a meaningful and expressive message, you need to adhere to some rules and guidelines in your typography. There are a number of things you really must do, such a creating a grid for structure and overall readability, and definitely take advantage of the ever-important white space. Columns and line breaks would be very useful here and could allow you to create a very strong composition.</p>
