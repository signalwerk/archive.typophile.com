      <p>I don't have any problem with the leaves=freshness symbolism. It also may generally relate to your photography (if you do landscapes and such (i don't know)). Really all that matters about meaning is if you're happy with it. I find that most people, when it comes to personal marketing endeavors, are willing to afford the artist a large amount of "symbolic &amp; thematic breathing room" (if you will) in his branding. So, if you're happy, the client/visitor is happy.</p>
      <p>The problem I have with this is with the blockiness of the lettering in relation to the fluidity of the leaves where they interact. The space with the leaves is quite beautiful, but then my eyes are attacked when they venture out into the spine of the "R" and both the top and bottom cleffs of the "G". I think if you refine those shapes and get more of a consistent fluidity flowing from the leaves it'll be much more cohesive. If it's not clear what I mean, let me know and I can do a quick example in illustrator (I'd do one now, but I'm in a bit of a rush).</p>
      <p>Hope that helps!</p>
      <p>penn</p>
