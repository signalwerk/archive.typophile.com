      <p>The star thing isn't really working I'm afraid. It just kind of floats there.</p>
      <p>You should probably find a typeface with true small capitals or manually adjust the weights, because right now the G, D, and P on the bottom line look very dark compared to the rest of their words.</p>
      <p>The modern serif face in your RG ligature and the older style in your name seem to clash.  I'd either choose more similar styles or go back to sans-serif.</p>
      <p>The horizontal line is good.  </p>
      <p>How about showing us the RG in a totally different font style? IMO the current rigidity does not lend itself to the natural motif.</p>
