      <p>This is a big step backwards. The serif face you now have for your name no longer matches your mark. The star means nothing and in no way relates to the rest of the mark. The top of the "G" looks unfinished.</p>
      <p>I liked the look of the Helvetica much better. To me, the serif face paired with the line reminds me of a law office logo.</p>
      <p>Forgive the crudeness of the sketch, but here is what I meant before about smoothing the serifs on the "R" and "G" of the mark:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rglogo-serifs_4042.png"></div><p></p>
      <p>I just used a face that had more curve to its serifs, but you can modify yours to have a crisper didot-like finish. I'm just thinking that if you add a curve to the serifs it'll soften the hardness and blockiness that, right now, plagues the mark.</p>
      <p>penn</p>
