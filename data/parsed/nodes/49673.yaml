      <p>RG/leaves is a great concept.  It would be good though to see some other type options there, perhaps something more freehand or casual.</p>
      <p>The size of the 'graphic design...' text is so tiny compared to the RG I just don't know how practical you mark will be unless displayed at every large sizes.  How about stacking the text or finding a narrower font you can set at a larger size?</p>
      <p>Finally and this is very much just a personal opinion, I think you can find a more interesting face than Helvetica for your name.</p>
