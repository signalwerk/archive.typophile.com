      <p>Overall the logo could use a few tweeks:<br>
      1. The upper lobe on the R seems too short, I would consider<br>
      bringing the waist down a bit closer to the baseline.<br>
      2. Line up the right edge of the upper serif on the G with the right edge of its throat<br>
      3. The upper serif on the G doesn't work with the other serifs.</p>
      <p>One final comment in terms of marketing... A basic principle of marketing is that divergence has more impact on consumers, and therefore more successful,than convergence. The description under your logo mentions both Graphic Design and Photography. You may want to taylor the focus on one area depending on the audience you are communicating too. In my own experience, what customers look for in a graphic designer differs from a photographer as they are really different mediums.</p>
      <p>-----------------------<br>
      Michael Browers<br>
      <a href="http://www.michaelbrowers.com" title="www.michaelbrowers.com">www.michaelbrowers.com</a></p>
