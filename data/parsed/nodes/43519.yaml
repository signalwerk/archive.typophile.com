    <p>I’m working on a logo for a Navy program called FAST (Fleet Assistance and Shipboard Training). </p>
    <p>I’m liking the direction I’m going with this one, but something about it seems off. The color palette they’ve asked me to use is Red and Blue (a horrible color palette). There wasn’t much direction after that. I originally did just a stand alone logotype (<a href="https://web.archive.org/web/20080706083458/http://typophile.com/node/43354" title="http://typophile.com/node/43354">http://typophile.com/node/43354</a>), but they powers that be said they wanted more blue in the logo. I added a nautical star compass element (a lot of allusions to direction which works with the assistance and training concept).</p>
    <p>Anyway, I’m at a stand still. I’m not happy with this, but I don’t have much time left to develop a new concept or look. I’d love to have some creative criticism in hopes of remolding this into something better. It has to work as a stand alone and a web logo.</p>
    <p>I’m not looking for brutal comments, and I have to apologize, I don’t have sketches to add.</p>
    <p></p><div class="imageWrap"><img src="/web/20080706083458im_/http://www.typophile.com/files/FASTLogo_6576.gif"></div><p></p>
