      <p>What seems off is the size of the word “FAST” compared to the compass. Unfortunately, there is nothing to bring the logo together. The word “FAST” It far too prominent and dominates the logo.  The colour pallet they have suggested is actually a good one. Keep the current red and go with a darker blue. No pun intended here but use a navy blue for the compass. Revers the compass using the Navy blue and white. The background in the centre of the logo, where you have the yellow (colour #3), use the Navy blue. Where you have the light blue, use white and where you have your mid tone blue use a screen of Navy blue at 50% or 60%. Remove the tile-esk edges on the circle and maybe work with placing the North (N), South (S), North East (NE) etc. out side that circle and relative to the compass. For the “FAST” text I would break it up so it looks like F.A.S.T. (sumilar to other military identities). Revers locations of  the Fast text and place it behind the compass so the compass becomes front and centre and diminishes the power of the FAST text.<br>
      This logo actually uses 4 colours to reproduce - Black, Blue, Rad, Yellow.</p>
      <p>Over all You have a really good design here. It has a lot of potential. Good luck!</p>
      <p>Patrick Davis Provisional R.G.D.<br>
      Owner / Senior Designer<br>
      Nexus Communication &amp; Design</p>
