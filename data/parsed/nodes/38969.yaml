      <p>Jeremy Tankard’s <a href="http://www.typography.net/commissions/arjowiggins.htm">Arjowiggins Inuit</a> is a good example of this. There are also a number of faux-Arabic, Hebrew, Chinese/Japanese, Sanskrit, etc. types that have been mentioned on Typophile. Try searching Typophile on Google (limit the search to just Typophile.com in Advanced Search) for these topics; they shouldn’t be too hard to find.</p>
      <p>Aside from these typefaces that incorporate “appropriated forms,” there are a number of types that are sympathetic to non-Western scripts. A number of the typefaces coming out of the University of Reading start with the idea of mating a Roman type with another alphabet/script. See the newest ones <a href="http://typefacedesign.org">here</a>; see Skolar and Vesper of the new ones, and look at some past PDFs for other examples.</p>
