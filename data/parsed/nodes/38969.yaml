    <p>Hello,<br>
    I am looking for Latin typefaces that incorporate appropriated forms initially found in ethnic/indigenous contexts (er, pardon that clumsy terminology?).<br>
    An example I was recently introduced to is the Churchward “Maori” face (thanks to David Bennewith at the Jan van Eyck Academie). Someone also mentioned a face based on Basque carvings.<br>
    Essentially I am looking to start a project that explores the ways type designers employ these sorts of forms (consciously or intuitively?) and what the implications of this could be in a larger context? Any literature on the subject or leads on specific faces or designers would be much appreciated.<br>
    Thanks v much</p>
