    <p>Dear typophiles,</p>
    <p>I am working on a book project in German, English and Japanese. </p>
    <p>For German and English, we intend to use Frutiger and Enschede Lexicon.<br>
    Does anyone have any suggestions which Japanese fonts could go with these two typefaces?</p>
    <p>Thanks for any ideas.</p>
    <p>Wolfgang</p>
