    html: |-
      <p>"Does anyone have any suggestions which Japanese fonts could go with these two typefaces?" </p>
      <p>In Japan at least, when the question goes the other way around: "What Latin face goes best with Ishi Mincho or Shaken Gothic?", it is usually answered but Frutiger or Univers for their great ability to offer specific weights and widths to appear smoothly alongside the Japanese as that is used at different sizes. That's high end stuff, but the fundamental point is: if you plan on having good looking mixed scripts, choose the Kanji first, and then a Latin with the proper style set to "match" at the Kanji's different sizes. These days, with single-mastered Kanji for all sizes, I think that it goes double.</p>
    html_clean: |-
