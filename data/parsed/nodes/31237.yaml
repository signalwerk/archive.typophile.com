      <p>My recommends:<br>
      Frutiger/<a href="http://www.typeproject.com/product/specimen.html" rel="nofollow">Axis</a><br>
      Frutiger/<a href="http://www.morisawa.co.jp/font/fontlist/?f=7" rel="nofollow">Shin-go</a></p>
      <p>You can check some examples...</p>
      <p><a href="http://www.apple.com/jp/" rel="nofollow">Apple</a> uses Axis with Myliad as corporate font in Japan.<br>
      It looks very nice.<br>
      I think Axis looks good together with Humanist Sans.</p>
      <p>Shin-go is one of the most popular sans serif typeface in Japan.<br>
      <a href="http://www.tokyometro.jp/news/2005/2005-32_1.html" rel="nofollow">Tokyo Metro</a> uses it with Frutiger for their new sign system.<br>
      <a href="http://mb.softbank.jp/mb/" rel="nofollow">Softbank</a> also uses it with Frutiger</p>
      <p>Sorry for my poor English.</p>
