      <p>Both German and English texts will be treated in the same way.<br>
      English and German texts will be only distinguished by colour - English in gray, German in black.</p>
      <p>Some texts are describing design projects (and there are pictures on these pages) - for these texts we intend to use a sanserif typeface, whereas other texts are written rather in a narrative style - therefore we think of using a serif typeface for these texts.</p>
      <p>I would like to have the same differentiation for these two kinds of text when choosing Japanese typefaces. </p>
      <p>I want to avoid any connotation with Gothic scripts. The whole thing should have a contemporary feel.</p>
