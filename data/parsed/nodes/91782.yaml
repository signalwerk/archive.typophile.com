      <p>Thanks, hrant. I see what you mean. (I looked stuff up based on your post; learned stuff.)</p>
      <p>I'm not looking for "a near-Palatino that's more suited to type." I'm more looking for a hybrid of sorts.</p>
      <p>I find no comments on this site about Open Sans (<a href="http://www.google.com/webfonts/specimen/Open+Sans" title="http://www.google.com/webfonts/specimen/Open+Sans">http://www.google.com/webfonts/specimen/Open+Sans</a>). I find plenty about its designer, Steve Matteson. Be that as it may, Open Sans works really well at text sizes on the web, to my eye, for whatever reasons. I tried it in print at display sizes, and... just, "no."</p>
      <p>So I find myself asking, what if there was a sans face that works well in print for captions, headings, and at display sizes, one that Open Sans could somewhat "pass for" for the purposes of websites. What if that face were the sans part of a superfamily, and its serif counterparts were influenced by the same era that influenced Zapf's designs for Palatino/Aldus? (And if not a superfamily, at least a handsome pairing.)</p>
      <p>Does such a creature exist?</p>
