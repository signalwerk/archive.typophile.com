      <p>No. Not the resolution. New resolution:</p>
      <p>Legacy (Serif and Sans).</p>
      <p>It perhaps loses some of the Golden Type chunky charm, but it makes up for it -- in spades -- in readability. And the sans, to my eye, does a lovely job of straddling Frutiger and Optima while harmonizing perfectly with the serif.</p>
      <p>Plus the wide variety of weights, plus I found Legacy Sans Condensed which looks awesome as a headline, and there's a "square-serif" in the family that looks like it has fun possibilities, perhaps for display use.</p>
      <p>This feels like it has been a long time a-comin'. I hope it sticks this time!</p>
