      <p>Thanks, Michael. I like Optima quite a bit.</p>
      <p>I don't think that's the direction I'm going, though. And someone just nudged me in this direction: they observed that Open Sans is Frutiger-esque. </p>
      <p>(There seem to be so many of them these days. I love the face! Except that I like a double-story /g/ (as well as /a/). Plus, many type designers are pushing the x-height quite large.)</p>
      <p>So! Frutiger! Or: I also love Avenir! (Though Open Sans has more of a chance of being mistaken for Frutiger, I think.) Especially if I find out that they have the double-story /g/ available as an alternate glyph. Paired with... <a href="http://www.myfonts.com/fonts/linotype/breughel-lt" rel="nofollow">Breughel</a>? <a href="http://www.myfonts.com/fonts/linotype/apollo" rel="nofollow">Apollo</a>? <a href="http://www.myfonts.com/fonts/linotype/meridien" rel="nofollow">Meridien</a>? <a href="http://www.myfonts.com/fonts/linotype/frutiger-serif" rel="nofollow">Frutiger Serif</a>?</p>
      <p>What would YOU do? (Monthly newsletter for local Jazz Society; various brochures and advertising; website.)</p>
