    <p>Hi, all:</p>
    <p>I'm still looking for a typeface for this project. </p>
    <p>I love Palatino's readability in print when set at typical body-text sizes, and I find it beautiful and full of character set at display sizes. </p>
    <p>Similarly, I really like Open Sans's screen readability for setting web body-text. Print and display, not so much.</p>
    <p>So I'm looking for something Palatino-like that harmonizes well with Open Sans. Or, I'm looking for a superfamily with serif fonts that have some of the same DNA as Palatino and sans fonts that the layperson might not notice is any different than Open Sans.</p>
    <p>Closest I've come: <a href="http://www.myfonts.com/fonts/paratype/orbi/" title="http://www.myfonts.com/fonts/paratype/orbi/">http://www.myfonts.com/fonts/paratype/orbi/</a>  <a href="http://www.myfonts.com/fonts/paratype/orbi-sans/" title="http://www.myfonts.com/fonts/paratype/orbi-sans/">http://www.myfonts.com/fonts/paratype/orbi-sans/</a>  I'm looking at some other typefaces by <a href="http://www.myfonts.com/person/Natalia_Vasilyeva/" title="http://www.myfonts.com/person/Natalia_Vasilyeva/">http://www.myfonts.com/person/Natalia_Vasilyeva/</a> to see if they look more Palatino-like to me. Orbi seems softer than Palatino; some aspect that I like about Palatino isn't there.</p>
    <p>I thought perhaps someone here would have some ideas without having to search too hard.</p>
    <p>Yours,<br>
    Amado</p>
