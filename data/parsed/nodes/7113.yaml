  html: <p>I have a project to design a short "zine" -  my tutors have given me the freedom to chose ANY subject I want!! I'm not sure whether to make it very personal or just choose an interest of mine. Just wondering if anyone has any good examples of magazines or online "zines" that have nice experimental typography?  I saw some stuff by Emigre that was very nice and also thisisamagazine.com.. any help is very welcome or tell me what you think would make an interesting zine.</p>
