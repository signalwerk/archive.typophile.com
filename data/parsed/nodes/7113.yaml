    html: <p>An empty magazine that encourages the reader to write/make their own contribution - interesting idea, pose more questions than answers. Or a crit-zine where you reproduce an article from a favourite magazine and invite a critique on the basis of typography, design, content &amp;c. contributors could post their observations and this would invite discussion from others, it could soon be enormous. <br>Tim</p>
