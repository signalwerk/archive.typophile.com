    html: "<p>Here's a crazy idea: <br>Make a zine that's recursively about itself. The middle spread will be like a regular zine about something or other, with pretty straightforward typography*. Then the sheets before and after the middle will be about the zine in the middle (talking about the discussion about whatever the \"center\" topic is), with 2-layered typography. And so on with the sheets outside of those engaging in increasingly removed/layered meta-discussion/-typography. <br> <br>* Or it could be about nothingness - empty. <br> <br>hhp</p>"
