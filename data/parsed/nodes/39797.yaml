  html: |-
    <p>Continuing <a href="https://web.archive.org/web/20080907001858/http://typophile.com/node/39564">this discussion</a> on font piracy, I have set up an anoymous <a href="https://web.archive.org/web/20080907001858/http://www.quibblo.com/quiz/mTpSFr/Typophile-Font-Poll-Which-is-most-true-for-you-all-answers-anonymous"> poll</a>, to offer insight into the the attitudes and actions of Typophile readers on this topic. The terms “Pirate, sharing or questionable” all refer to fonts not obtained in accordance with the font’s EULA. Please consider offering your answer so we may get a large enough sampling to deduct some meaning. It may not really conclude anything, but may be surprising.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080907001858/http://www.typophile.com/node/40294" class="topic-previous" title="Go to previous forum topic">‹ Manicules on Flickr</a> <a href="/web/20080907001858/http://www.typophile.com/node/40269" class="topic-next" title="Go to next forum topic">Introducing the "hr" ligature... ›</a></div>
  html_clean: |-
    <p>Continuing <a href="/node/39564/" class="link-kept">this discussion</a> on font piracy, I have set up an anoymous <a href="https://web.archive.org/web/20080907001858/http://www.quibblo.com/quiz/mTpSFr/Typophile-Font-Poll-Which-is-most-true-for-you-all-answers-anonymous" class="link-external"> poll</a>, to offer insight into the the attitudes and actions of Typophile readers on this topic. The terms “Pirate, sharing or questionable” all refer to fonts not obtained in accordance with the font’s EULA. Please consider offering your answer so we may get a large enough sampling to deduct some meaning. It may not really conclude anything, but may be surprising.</p>
