    html: |-
      <p>VAG Rounded has sloping verticals with its M. Bryant’s right-hand side of the G has a flat section. Gotham’s G too, and its M’s middle vertex additionally ends above the baseline.<br>
      Though I don’t think Cennerik in fact has anything to do with the creation of the posted sample, I still would say it’s closer than the others.<br>
      :°)</p>
