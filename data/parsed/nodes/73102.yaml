    <p>Hi folks,</p>
    <p>I'm new on here so excuse any blunders or assumptions i might make in my plea for help. I've just finished designing a logo for a client and was just about to get started on some stationary as you do and realised I've been using the same set of fonts for way too long.</p>
    <p>I'm asking for a bit of help with type selection to work as part of an identity, so initially stationary and a small brochure. The job is for a client who is about to open a Pilates studio on the UK's South coast. She's got uninterrupted views from the studio out to sea hence the concept for the logo.</p>
    <p>I was looking for sans serif that wasn't too slight/condensed to compliment the curves of Hermes used in the logo. But I'm totally open to all suggestions, that's why I'm here.</p>
    <p>Hopefully the logo and the nature of the clients work gives you enough to go on. If not I'm happy to give you more to go on.</p>
    <p>Any advice would be much appreciated.</p>
    <p>Cheers. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/shore_4153.jpg"></div><p></p>
