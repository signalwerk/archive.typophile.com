    html: |-
      <p>I find that the width of the S and R, and to a lesser extent the E, tend to make the circular window look a bit small, like a porthole.<br>
      It seems to me that if one is leveraging the circularity of "O" as a graphic shape, the best type choice is invariably Futura (or Avant Garde, or as mentioned, Avenir), which continue the geometric quality. Perhaps this is a rather obvious and banal logic, but the simplest solution is often the best. Occam. Why sweat it? -- the real work is the image in the O.</p>
      <p>I like the quality of breadth in the logo, but that is a result of the wide letterspacing as much as of the extended typeface.</p>
