    html: |-
      <p>Re: special plugins. I think before you commit to a large and complex project, you just do some tests to find out how much randomness you actually need.  I think for cartoon lettering, if your glyphset has 4-6 alternates it's doing just fine. When subs prevent glyph pairs, the eye is already 90% fooled.</p>
      <p>Re: special code to render glyphs. If you already have outlines for all the extremes, and they happen to be point compatible, you could use robofab and glyphmath (or Tal's FontMath) to make a collection of intermediates. This is probably the easiest to try out. Make a script which has access to all the masters, interpolate each glyph from all masters with random (or non-random) factors and store the results in a new font. Like a multiple master, but with more master. Or like Superpolator, but without the app.</p>
      <p>Re: illustrator pen tools. If you want to build something which applies a shape as a pen tool to a skeleton path, you're in very deep water. Tracing the shape made by the tool, collecting the points and building sane contours is heavy duty bezier math. Stuff like this exists, but it's likely that sharing goes beyond the polite help and discourse of this forum.</p>
      <p>My 2¢ would be: learn some robofab code and try stuff yourself, see where you end up. My hunch is you'll need much less than you think to get good results. It will also get you results faster than waiting for Adobe or FL to implement it :)</p>
      <p>Cheers, Erik</p>
