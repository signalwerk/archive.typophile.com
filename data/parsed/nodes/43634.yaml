      <p>I don't mean to be nagging, but I haven't yet given up on the randomness concept. As far as I see the situation, the only thing stopping randomly generated letters from appearing on screen is the OpenType format. </p>
      <p>So, I've been thinking, as Adobe applications support plugins, why not write a plugin for InDesign/Illustrator/Photoshop that simply takes randomly generated PostScript data and renders it on screen?</p>
