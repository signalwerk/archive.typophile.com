      <p>Benjamin,</p>
      <p>I'm afraid it is not possible to get true random in OpenType. The random effect of Beowolf used to be realized in old PostScript Type 3 font format.<br>
      You will have to include many alternative glyphs and switch them via layout features, so something at least similar to random will be happening.<br>
      <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_kosmik_ot_regular/" rel="nofollow">FF Kosmik OT</a>, <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_beowolf_ot_r24/" rel="nofollow">FF Beowolf OT</a> and <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_beosans_ot_hard_r22/" rel="nofollow">FF BeoSans OT</a> do it this way, more to come.<br>
      Best,</p>
      <p>Christoph</p>
