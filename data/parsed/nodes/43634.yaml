      <p>Actually, no, no one has, thanks Thomas. I googled this two or three weeks back when I was trying to figure out a way to alternate glyph outlines. </p>
      <p>I was a little irritated by you calling– I'm not sure what the right expression for that is– "function" so many times, like here (I tried to interprete what the script does in the comments):</p>
      <p>[…]<br>
      <code>feature calt {<br>
      # Connection or other contextual Forms<br>
      # Latin<br>
      </code><br>
      <code> lookup rotate {<br>
          sub @default @default' by @alt1; # shouldn't this be calt1?<br>
          sub @calt1 @default' by @alt2;   # shouldn't this be calt2?<br>
          sub @calt2 @default' by @calt3;<br>
          sub @calt3 @default' by @calt4;<br>
          sub @calt4 @default' by @calt5;<br>
          sub @calt5 @default' by @calt6;<br>
          sub @calt6 @default' by @calt7;<br>
       } rotate;<br>
      </code><br>
      <code># this creates a "function" called rotate<br>
      # that replaces a glyph from font 1 with one from font 2,<br>
      # one from font 2 with one from font 3, etc.<br>
      </code><br>
      <code> lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
       lookup rotate;<br>
      </code><br>
      <code># call aforesaid function a couple of times</code><br>
      <code><br>
      } calt;<br>
      </code><br>
      […]</p>
      <p>I'm not sure why you called the function multiple times, but I'm guessing you did it so the calt-block needs not to be executed so often.</p>
      <p>I really think that you can achieve great effects with contextual alternates and ligatures. Zapfino is living proof of their might.</p>
      <p>The only reason for me not to start using contextual alternates right away is that I wanted to give a font what handwriting has inbuilt by nature: a feature that would make <em>every glyph rendered different from the ones before</em>.</p>
      <p>I am currently drawing the key characters of the base font, so I will definitely go deeper on the calt-feature in future.</p>
      <p>Thanks again for sharing your code, Thomas, much appreciated.</p>
