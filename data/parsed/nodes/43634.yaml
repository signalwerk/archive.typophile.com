      <p>I completely agree with your view on total randomness being a fonts demise. After all, letters are supposed to be read and to fulfill that requirement they must adhere to a constant shape. Which is entirely the opposite of randomness.</p>
      <p>So what I want could be described as a <strong>randomized variation</strong>. You control the <em>degree</em> in which the changes take place, in my case by the variance in the master faces, but <em><strong>not</strong> the direction</em> in which it goes.</p>
      <p>I guess there will be no other choice for me but to give up on the random generation if I want to have an OpenType font in the end.</p>
      <p>Are there <em>any</em> other formats that could support what I need from them?</p>
      <p>I remember reading something quite awhile about a font or tool called "Metamorfont" that experimented with random glyph alteration. Was this thing just in an experimental stage? Has it been abandoned? Anyone know?</p>
