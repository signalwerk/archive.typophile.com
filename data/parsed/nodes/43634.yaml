      <p>This is an attempt to take you in a new direction complete with rationale so watch out! </p>
      <p>Real randomness may not be completely desirable speaking anyway. When you look at real comic book writing done by a pro the changes you see have an element of chance built in. I don't deny that. And that's the part that is interesting to you at the moment - but it isn't all chance. Not by a long shot! And less &amp; less so as the better the lettering artist is. I don't mean that they become more like a machine but that their lettering responds to context more. Put another way, the variations you get with real comic book lettering start to be the result of interactions between letters. I think it would be more pleasing &amp; powerful to detail what the interactions are and build on that. I am actually doing some like that but for text faces and it's hellaciously complicated. But fun! Very fun. With enough interactions the font will look quite random even if it is just psudo-random. And better than that it will feel more like real hand lettering and best of all it will please the eye more than a real random font can.</p>
      <p>You might want to look carefully at Tal Leming's work. It's not the same style but his programming for "Ed Interlock" is the kind of thing I mean.</p>
      <p>Good luck!</p>
