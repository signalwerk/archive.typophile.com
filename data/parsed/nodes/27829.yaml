    html: |-
      <p>The “Classroom in a book” series are available for various Adobe products, and are very solid.</p>
      <p>Also, I can highly recommend the book “Photoshop CS2 for digital photographers” by Colin Smith - best photo book I’ve come across.</p>
      <p>For some great insights in the use of Illustrator for typography as well as some excellent drawing techniques and shortcuts, read the “Logo, font and lettering bible” by Leslie Cabarga.</p>
