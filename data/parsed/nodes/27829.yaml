    html: |-
      <p>For Illustrator, I personally think you’re better off experimenting &amp; using online tutorials or forums in case of any problems. Or -worst case scenario- you can always read the manual ;-)<br>
      For Photoshop you might want to buy a book if you really want to make full use of its capacities (but for basic things, the same goes for Photoshop as for Illustrator).<br>
      There’s no better (or more fun) teacher than curiosity... mixed with a little stamina &amp; interest, that is.<br>
      If you’re used to working in older versions of these programs, it’s just of matter of staying up-to-date &amp; the Adobe-site features all the new stuff.<br>
      Good luck!</p>
