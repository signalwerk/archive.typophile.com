    <p>I have recently come into possession one of the 300 facsimiles of Jodocus Hondius’s <em>Theatrum Artis Scribendi</em>, a very rare book of European handwriting specimens. Seeing as how even the facsimile editions are hard to come by, I decided to photograph all of the original pages and put it online. Following are a few samples; the entire thing can be downloaded from <a href="http://www.dunwichtype.com/pdfs/tas.pdf" rel="nofollow">http://www.jpad.biz/pdfs/tas.pdf</a>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/title_5999.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/33_5262.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/41_3792.jpg"></div><p></p>
