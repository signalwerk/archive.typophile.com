    html: <p>In the USA, as far as I know, copyright applies to the font software, not the typeface design. You can trademark the name, and you can register a design patent for the design. However, registering patents and trademarks costs money, and even if you get a design patent it will cost more money to enforce it. <br> <br>Speaking as somebody who has recently designed a sort-of-geometric sort-of-sans serif typeface, I think there's still room for original design in this area. Of course, I went for a two-story "a".... <br> <br>Regards, <br> <br>T</p>
