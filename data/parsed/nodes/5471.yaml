    html: "<p>Lauri: <br> <br>Which work are you speaking of? I'm wondering if perhaps you have me confused with somebody else? My actual type design work has been seen by hardly anybody; most people know me mostly as a technical guy and occasional writer. This is not an entirely bad thing, since most of my early type design attempts were pretty uninspired.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>However, my latest typeface is not too bad, and will be released as an Adobe Original in, oh, maybe 5-8 months? The upright Latin portions are pretty much done, but I have more grunt work to do on the italics (though the Latin italic designs are pretty much locked down), the Cyrillic still needs some work, and the Greek is only now starting to not suck too badly. <br> <br>Cheers, <br> <br>T</p>"
