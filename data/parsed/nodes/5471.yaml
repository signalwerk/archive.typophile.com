    html: <p>Thomas, <br> <br>Thank you so much for your help.  That's all the push I need.  I think I will try to step away from Futura though, there are several Futura-inspired typefaces already... Avant Garde and Century Gothic to name a few. <br> <br>What I think I would want to create in my typeface is a sense of simplicity... something that could have been easily drawn using a stroke or two, but at the same time have a quality that says "I wish I could've thought of that". <br> <br>I will start working on the font and use it in my own work, and maybe put it on myfonts if it looks okay.  Because I know I would get a kick out of it if I saw other people using it as well. <br> <br>Thomas, thanks again.  I admire your work a lot!</p>
