  html: |-
    <p>I've been sketching on a typeface that is pretty heavily inpsired by Futura, but at the same time completely different.  It will be elegant yet futuristic. <br> <br>But has it all been done already?  There's only so many ways you can design a simplistic single-story geometric sans 'a' that you can design.  And would it be considered plagiarism if some of the glyphs share common features? <br> <br>I think, pretty much, that subconsciously I just want someone to give me an okay ("go and do it") before I can start on this project. =) <br> <br>Thanks! <br> <br> <br>P.S.  How long do typeface copyrights last?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/13223" class="topic-previous" title="Go to previous forum topic">‹ American Arlines using Sophisto for their magazine???</a> <a href="/node/13018" class="topic-next" title="Go to next forum topic">Looking for reversed out versions of Helvetica and Garamond ›</a></div>
