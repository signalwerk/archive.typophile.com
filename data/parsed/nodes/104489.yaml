      <p>What applications have you seen the bad behaviour in? Adobe applications will behave differently to Microsoft applications for some things.<br>
      Have you stepped through the lookups in the VOLT proofing tool to see if a lookup is shifting things in the same way as you are seeing in the application. Your shift values are obviously being interpreted differently by the application to how they are being used and displayed in VOLT, are they the correct way round?</p>
