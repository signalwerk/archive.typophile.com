    html: |-
      <p>Patil,<br>
      If you see the marks shifting position in Adobe InDesign then you need to open the "Diacritic Positioning" menu and check one of the "OpenType" options instead of the "Normal" default. </p>
      <p>In the settings of Loose, Normal, and Tight InDesign will position the marks where it sees fit. In the two OpenType settings it will use your OpenType lookups to position the marks.</p>
