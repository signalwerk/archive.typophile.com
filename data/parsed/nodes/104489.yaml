  html: |-
    <p>im trying to add Contextual Alternate feature to an Arabic font on Microsoft VOLT.<br>
    The font is shipping without any errors. However, the shipped font applies the marks differently then what i defined. plus the characters shift position either upwards or downwards, each set of glyphs behave differently.<br>
    N.B: everything seems perfect when i use the proofing tool to check if what ive done is right on VOLT </p>
    <p>What is the problem? and how can i fix it?</p>
