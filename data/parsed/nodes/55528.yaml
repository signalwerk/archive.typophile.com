  html: |-
    <p>Dear typophiles,<br>
    Here are two serif faces that came out of my calligraphy study with Edward Johnston's writing manual. The first type is based on his "simple-written" method and the 2nd on the "gothic" variation of the "built-up" method.</p>
    <p>These are intended to be used for continuous text (~8-12 pt) printed on paper. </p>
    <p>All comments welcome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/simple-written_built-up_3803.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/simple-written_5727.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/built-up_6459.png"></div><p></p>
