    html: |-
      <p>Thanks for your feedback, eliason. </p>
      <p>I added 20 units to the T-crossbar width (&amp; took out 10 from the bottom serif). I don't know if that makes any difference...maybe the crossbar should be thicker as well.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/simpleforexample_3521.png"></div><p></p>
      <p>&nbsp;</p>
      <p>Yes, the C G &amp; S terminals don't look like what they're supposed to. Perhaps the edge-stroke terminals are impossible (too ridiculous) to bring into type. I'm generally worried about doing a too literal calligraphy imitation anyway. On the other hand, I sort of like the 'drips' because they have a likeness to the thin baseline serifs in the lowercase. Here's a variation &amp; without:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/congos_6045.png"></div><p></p>
      <p>&nbsp;</p>
      <p>I did some numbers too:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/simplenumbers_6291.png"></div><p></p>
