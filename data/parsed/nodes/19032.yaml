      <p>Position and colour of the mark aside, I'm afraid that your kerning is too tight, if you take the spaces around the e of ier (because it is a  round character surrounded by verticals and cannot go much tighter) as the base, then the spaces between other letters should reflect the amount of white space around the e rather than have an equal space measured on the two closest points of the letters. I think you should loosen the space between At, li, and jr and tighten el, these should be only slight adjustments.<br>
      Tim</p>
