    html: |-
      <p>I think Tim brings up a good point - maybe experiment with a dividing device rather than a full stop. I had a look a few hours ago but didn't have time to post - I assumed on my first impression that this was web-based (.jr), having briefly skimmed the page. I'm afraid I can't really make head nor tail of the 'arch' graphic; I think you're trying too hard with it. Because of the form of the graphic, I half-read it as a letterform because at the moment it's competing with the letterforms, and the shape it has gives the impression of a letterform - therefore at the moment: 1) looks a bit like ratelier.jr, 2) looks like satelier.jr, 3) fatelier.jr and 4) patelier.jr</p>
      <p>So, the big question is: how to resolve it so it 'works'?<br>
      I like the name, the divider could be a colon instead of a full stop, so it would give some meaning to the divider - it would suggest that atelier comprises jr, which seems to work (atelier:jr).</p>
      <p>If you really don't want to lose the arch, I'd divorce it from the type so it doesn't get in the way; making it a strong symbol which sits away from the type would be one route (maybe put it in a box); another route would be to lose the arch and concentrate on a wordmark logo. I like the face you've picked, it looks rigid and strong (charcterisitcs desirable in a house!) and I don't think it would look too plain - you could play around with the divider to stop it looking too plain. The unusual suffix of 'jr' to the word already gives it a distinctive feel. Just don't make it too 'website URL' looking!</p>
      <p>Hope this helps!</p>
      <p>Si</p>
