      <p>5 and 6 are weakest in my opinion, the icon looks like blood drops that probably are not what a house buyer is looking for in a house design.<br>
      I like the icon shape in 2 and 3, but 3 (which I think the strongest) needs to have the relationship between icon and type sorted. I would also look at an alternative to the full stop, either have a space or possibly a rule dividing the words e.g. atelier|jr. On the uppercase A versions I think you need to tighten up the kerning on At.<br>
      Tim</p>
  - id: 116589
    user: 7561
    date: 2006-04-05T10:36:00
