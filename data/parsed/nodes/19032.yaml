      <p>I agree with the first statements, particularly that at present I instantly associate this with a URL due to the .jr. The semi-colon or vertical bar are two interesting alternatives to explore, unfortunately I don’t feel the icon works as a divider at present. </p>
      <p>I feel the icon's in #3, and #4 are the strongest. I personally like the hook on #4. I also feel that the icon needs to be moved away form the type and treated differently at this stage, because I also tried to read it as a letter at first glance. </p>
      <p>There are kerning issues between AT and also JR. Overall, this is a robust feeling logo, with a bold colour palate which will no doubt insist on attention!</p>
      <p>Best.<br>
      -nic</p>
