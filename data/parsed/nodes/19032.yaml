    <p>This is my first post to typophile. I hope it goes well!</p>
    <p>My wife and I design houses. My last name starts with J, hers with R. Throw in a little E.F. Schumacher "Small is Beautiful" shizz-nizz and we have: Atelier.jr.</p>
    <p>1. </p><div class="imageWrap"><img src="http://typophile.com/files/atelier_1.gif"></div><p></p>
    <p>2. </p><div class="imageWrap"><img src="http://typophile.com/files/atelier_3.gif"></div><p></p>
    <p>3. </p><div class="imageWrap"><img src="http://typophile.com/files/atelier_4.gif"></div><p></p>
    <p>4. </p><div class="imageWrap"><img src="http://typophile.com/files/atelier_5.gif"></div><p></p>
    <p>5. </p><div class="imageWrap"><img src="http://typophile.com/files/atelier_6.gif"></div><p></p>
    <p>6. </p><div class="imageWrap"><img src="http://typophile.com/files/atelier_7.gif"></div><p></p>
    <p>I probably don't need to explain this in this forum, but the form of the insignia is derived from the letters a, j &amp; r. It is vaguely reminiscent of a keyhole or archway, although I don't expect most people to notice that. Both are appropriate to the business. Which is weakest? Which is strongest? TIY.</p>
