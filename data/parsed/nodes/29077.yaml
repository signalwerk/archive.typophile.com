      <p>There's something about the brushes in Illustrator that never works in sharp corners. I've had the same problem trying to make a perfect dotted line &amp; it works well as long as you use it in right corners, but it deforms the dots in sharp corners. I've tried a couple of things to make a brush as the one you want, but I can't get it to work properly. I posted this problem here as well &amp; ended up using a dashed line with round corners to obtain a dotted line.<br>
      Seems to me that the best thing you can do is to just copy the center stroke &amp; make it as thick as the outlines of your drawing &amp; then use the blend tool to fill the space up with additional strokes. If you do the math correctly, you can end up with equally wide strokes as gaps between the strokes.</p>
