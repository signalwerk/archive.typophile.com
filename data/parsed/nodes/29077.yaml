      <p>As Ill Sans suggests, the best way to do this is with the blend tool.<br>
      • First, draw the paths and make them as thick as you need<br>
      [one tip i found by accident is that regardless what measuring system you use for stroke or text –&nbsp;or whatever –&nbsp;you can force it to mm or inches just by typing it. So if you want a 10mm stroke just type "10mm" into the size field and Illustrator will make it 28.346 pt/10mm. This makes it easier to calculate stroke widths for blends etc.]<br>
      •&nbsp;To accurately copy the example you post, you are best to keep the circles complete at this stage and make the stright paths separate so that they can be layered. The complete circles also blend more consistently.<br>
      • Next, outline the paths<br>
      • Change the stroke and fill colours to give you outlined "donuts" or curves<br>
      •&nbsp;Release the resulting compound paths<br>
      • Select one of the "donuts" you are left with and Blend (after you have adjusted Blend Options)<br>
      • Expand the blend<br>
      • Delete the parts of the circles you don't need –&nbsp;in your example, you just delete one quarter of each circle<br>
      •&nbsp;To the same with the straight paths (you may need to flip the direction of one path to avoid a "horizon" effect)<br>
      • Join up the lines if necessary.</p>
      <p>I have probbaly missed something crucial but I made this in about ten minutes using this method.<br>
      Sorry if I missed the point.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Blends_3511.jpg"></div><p></p>
