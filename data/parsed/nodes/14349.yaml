  html: '<p>For those of you who may have missed it at Typophile Film Festival #1, drop everything and go watch <a href="wiki/Cheshire Dave" class="wiki-create">Cheshire Dave’s</a> <a href="http://www.veer.com/ideas/etched/" target="new">Etched in Stone</a>, a journey through the seedy underworld of Hollywood poster design. Our generous pals at <a href="wiki/Veer" class="wiki">Veer</a> have been so kind as to host it for Chesh - the only question we ask is: Who gets to keep the Oscar?</p>'
