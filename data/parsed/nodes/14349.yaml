    html: |-
      <p>It was brilliant, audacious and wacky all in one short.</p>
      <p>Brilliant in the sense that one could create a mystery storyline around the overuse of a typeface (<a href="wiki/Trajan" class="wiki">Trajan</a> at that) and pull in a reference to Nero without getting too cerebral?</p>
      <p>Audacious in the daring use of a capital T, surrounded by flaming columns. <a href="http://www.imdb.com/title/tt0295701/?fr=c2l0ZT1kZnxteD0yMHxsbT01MDB8dHQ9MXxmYj11fHBuPTB8cT10cmlwbGUgeHxodG1sPTF8bm09MQ__;fc=1;ft=21;fm=1">Rob Cohen</a> eat your heart out.</p>
      <p>Wacky as in <em>the-calling-card-of-the-villain-is-a-chisel</em> wacky and <em>the-characters-die-from-using-the-wrong-font</em> wacky.</p>
    html_clean: |-
