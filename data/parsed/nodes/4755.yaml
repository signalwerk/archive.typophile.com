  - id: 34712
    user: 2508
    date: 2004-06-08T07:07:00
    date_raw: 8 Jun 2004 — 7:07am
    votes: null
    html: "<p>Hi Stefanie, <br> <br>how's it going? I'm interested in the progress, if there is any. <br> <br>My $0,02: <br> <br>Like Scott, I don't really see any of the four Info Office/Info Text concepts work well. <br> <br>1st one: spaced too tight. Base line of the two parts (divi and sign) doesn't seem to match. \"i\"s look like \"1\"s. <br> <br>2nd one: I don't see the two sides go very well together. Somehow I find the lettershapes of the \"divi\" part too cheap. <br> <br>3rd one: Base line problem again. I don't really like the serifs on the divi side either. <br> <br>4th one: Absolute no-go, if you ask me. Info Office and Info Text look way too similar in this one, building up zero contrast, but giving an uneasy, heterogenous look to the whole thing. \"i\"s look like \"1\"s again. <br> <br>Generally, I don't see why you're breaking up \"divisign\" into two parts and why the \"sign\" part is emphasized, particularly as you stated above that it's composed of three ingredients (digital, vision and sign). <br> <br>The divisign logo isn't bad as a variant of the mother company logo, but I think that there's room for improvement, especially when a very close resemblance between the two logos isn't mandatory. <br> <br>From a geometric point of view, the pseudo 3D logo isn't completely logical (with the vertical lines forming a square, one would intuitively expect the lines that indicate the sphere to flow both to the left and the right instead of exclusively to the right), but this isn't too big of a concern to me. <br> <br>Keep it coming. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>jpg</p>"
    html_clean: "<p>Hi Stefanie, <br> <br>how's it going? I'm interested in the progress, if there is any. <br> <br>My $0,02: <br> <br>Like Scott, I don't really see any of the four Info Office/Info Text concepts work well. <br> <br>1st one: spaced too tight. Base line of the two parts (divi and sign) doesn't seem to match. \"i\"s look like \"1\"s. <br> <br>2nd one: I don't see the two sides go very well together. Somehow I find the lettershapes of the \"divi\" part too cheap. <br> <br>3rd one: Base line problem again. I don't really like the serifs on the divi side either. <br> <br>4th one: Absolute no-go, if you ask me. Info Office and Info Text look way too similar in this one, building up zero contrast, but giving an uneasy, heterogenous look to the whole thing. \"i\"s look like \"1\"s again. <br> <br>Generally, I don't see why you're breaking up \"divisign\" into two parts and why the \"sign\" part is emphasized, particularly as you stated above that it's composed of three ingredients (digital, vision and sign). <br> <br>The divisign logo isn't bad as a variant of the mother company logo, but I think that there's room for improvement, especially when a very close resemblance between the two logos isn't mandatory. <br> <br>From a geometric point of view, the pseudo 3D logo isn't completely logical (with the vertical lines forming a square, one would intuitively expect the lines that indicate the sphere to flow both to the left and the right instead of exclusively to the right), but this isn't too big of a concern to me. <br> <br>Keep it coming. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>jpg</p>"
