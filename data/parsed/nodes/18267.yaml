    html: |-
      <p>In SF I got a profusely autographed copy of John Berry’s “Contemporary Newspaper Design” for pretty much retail price. And I donated something: tragicomically pretentious letterpress “Don’t Mention It” cards* that I’d printed like two days before the conference. I’m not a big auction buyer by any means, but at ATypI I’ve bought: old issues of TypeLab; Fiona Ross’s book; and a tight little Soviet lettering booklet. Oh, and I donated a German-Tibetan dictionary at ATypI-Leipzig (and I’m still dying to find out who ended up with it). So clearly I think these auctions are worthwhile. Just not worth 5 hours.</p>
      <p>* You send them in the true bourgeois spirit of oneupmanship in response to a “Thank You” card.  :-)</p>
      <p>BTW, I totally agree with David Berlow that TypeCon must<br>
      not loose sight of its sort of “blue collar”, populist essence.<br>
      The Nikko was a mistake.</p>
      <p>hhp</p>
