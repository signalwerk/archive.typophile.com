      <p>I have never been one to collect antiques so I guess I am not the kind of person who is looking for things of historic value or collectables. I am more interested in very well done typography even if it is recent. I am also interested in information, technical, historical, or scientific, which relates to typography, type design, readability, linguistics and the history of letterforms and scripts. I would be interested in a copy of Miles Tinker’s “Legibility of Print” since I can’t seem to find it.<br>
