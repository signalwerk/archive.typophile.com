    html: |-
      <p>In San Francisco, I found a copy of Big Red in one of the antique stores. I told Dave about it and we went over and he bought it for $175. A great price for Big Red. Anyway, he put that up for auction asking an opening bid of $175. NO ONE bid on it! He took it off the table, and not wanting to bring it back to England (he already had a copy) offered to sell it to me. I accepted.</p>
      <p>In order to have a good auction, you need people willing to spend some money. That is not been my experience with the TypeCon auctions.</p>
