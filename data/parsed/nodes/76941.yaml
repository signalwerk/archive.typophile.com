    html: |-
      <p>Thank you all very much for all your responses.  And yes, Nick, it is Houschka! l love it dearly.  (Sort of star-struck now:)). </p>
      <p>Regarding theme, I don't think the logo itself has to reference anything math related.  The aesthetic feel of it just needs to err a bit on the left-brained side of neutral, since the clients/projects do (for now).  As apposed to, say, a logo for a company specializing in tv spots for children's programming, which might want to be friendlier.  </p>
      <p>Name confusion: hasn't happened yet.  People are pretty used to weird spellings, and at present url typos don't resolve to anything troublesome.  </p>
      <p>People seem to prefer the thin version, overall, even though I don't feel it has enough ink in it to scale down well.  I've compromised with:<br><img src="/sites/default/files/old-images/l_e_6552.png"></p>
      <p>I think it solves some of the q/d counter problems.  Can't decide if the "s" is a smidge too far out, though.</p>
