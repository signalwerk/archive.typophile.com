    <p>Hello, </p>
    <p>Since one is often one's own worst client, I'm at a loss for branding myself.  Please help me choose my new brand <a class="freelinking external" href="http://sqrd.net/images/l_a.png" rel="nofollow">logo</a>!</p>
    <p>Customer: my interaction design consulting company: sqrd.  Located in Silicon Valley with clients/projects focusing heavily on data visualization, so a little more on the geeky/mathy side.  </p>
    <p>Logo will be used almost exclusively online and on business cards.</p>
    <p>Thanks,<br>
    Julie</p>
