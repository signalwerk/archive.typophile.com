    <p>Here's a typeface that a major German magazine has been using for a while. An old-school grotesque in the vein of the <a class="freelinking external" href="http://a1.dspnimg.com/data/l/2085910623030_Rp8aLgvk_l.jpg" rel="nofollow">Stephenson Blake</a> ones which have seen <a class="freelinking external" href="http://www.aisforapple.fr/fonts/grotesque-6/" rel="nofollow">several</a> <a class="freelinking external" href="http://www.fontbureau.com/fonts/BureauGrot/" rel="nofollow">revivals</a> <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/grotesque-no-9/" rel="nofollow">during</a> <a class="freelinking external" href="http://www.stormtype.com/family-trivia-grotesk.html" rel="nofollow">the past few years.</a> ...all of which I've had a close look at, but this is none of them. Note the rather tame /Q/ in contrast to most of the ones I mentioned. The /t/ is a good shibboleth too. The /g/, not shown here, is of course double-storey. Yes, it could be a custom typeface, but then again, none of the four other faces that they use (AG, Sabon, Freight) is.</p>
    <p><a href="http://imgur.com/HgQZAbE" rel="nofollow"><img src="http://i.imgur.com/HgQZAbE.png" title="Hosted by imgur.com"></a></p>
    <p><a href="http://imgur.com/NkmmYu8" rel="nofollow"><img src="http://i.imgur.com/NkmmYu8.png" title="Hosted by imgur.com"></a></p>
    <p><a href="http://imgur.com/efR8Edq" rel="nofollow"><img src="http://i.imgur.com/efR8Edq.png" title="Hosted by imgur.com"></a></p>
