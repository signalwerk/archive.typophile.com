      <p>"most graphic designers seriously lack the required knowledge.."</p>
      <p>One reason is that type is just one aspect of graphic design, and designers spend much of their time dealing with other things. </p>
      <p>Other aspects include gathering, organizing and presenting information, photography, illustration, layouts, dealing with clients, dealing with printers and other vendors, the business aspects of design, and many other things. Folks who focus full-time on fonts (like many of the folks here) are naturally more knowledgable.</p>
