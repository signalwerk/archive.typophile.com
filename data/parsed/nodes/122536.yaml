    html: |-
      <blockquote><p>Other aspects include gathering, organizing and presenting information, photography, illustration, layouts, dealing with clients, dealing with printers and other vendors, the business aspects of design, and many other things.</p></blockquote>
      <p>But we're not learning all of these things at school. When I studied at the art academy previously in 2007 we had photography and drawing classes. Not any longer. Typography is such an essential part of graphic design, it really is ridiculous that we don't get typography class. I constantly see the most basic typography mistakes everywhere around me. For a profession that has to make use of typefaces to do their job well, they know very little about our product and how to use it. You wouldn't make this excuse for a car dealer who knows nothing about cars but "knows a lot of other things about the industry, and the nature of mechanics have changed too". I don't really see how that has any bearing on the notion that graphic designers no longer possess the required knowledge and skill to do their job properly.</p>
      <p>In 2007 we also had to learn how to code our own portfolio website. This time the two coding classes we had so far in 1,5 year time were an absolute joke. As for animation, we haven't learned a thing. I'm glad about that though. I'm glad I can code, but I don't want to learn animation or 3D. It's just not my focus. I think it's quite ridiculous how the modern graphic designer seems to have to do just about everything, but doesn't become an expert at most of these things.</p>
