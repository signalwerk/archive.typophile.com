      <p>My experience, teaching type design to third year graphic design students fairly recently, was that they had studied typography in ﬁrst year, but had since lost the plot, presumably through inactivity in that area.</p>
      <p>For instance, when making a poster to showcase their type design in text setting, they would just dump the text in a text box with the Paragraph defaults: Auto Leading, and no Paragraph Indent or extra Paragraph Leading.</p>
      <p>Nothing wrong with that—it’s rather like what you’re reading now—but it does indicate a lack of subtlety and engagement.</p>
