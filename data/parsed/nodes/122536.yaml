  - id: 597627
    user: 52182
    date: 2015-01-19T11:21:00
    date_raw: 19 Jan 2015 — 11:21am
    votes: null
    html: |-
      <blockquote><p>I did — as much as time permitted — but it varies from college to college.</p></blockquote>
      <p>Apparently so. When I studied at the art academy in 2007 we had separate classes, so we did a lot more things. Now the system has changed and we work in projects rather than classes, and the layout of the school itself has changed to something much more open rather than separate rooms, so teachers and students may interact with each other more freely. As for working in projects, it means we get trained a lot better to function in our jobs, but academically speaking we're a lot less varied. As weak as the focus on typography on this academy is, last year I heard it's only getting worse. I was surprised to hear they're actually doing a third year course in Glyphs at the moment. I suppose it may indicate a return of focus on typography, but I think they're just going to let KABK do all the typography stuff.</p>
      <blockquote><p>Do designers know as much about typography as someone who deals with it full time? Of course not.</p></blockquote>
      <p>I certainly don't expect them to, but I don't expect them to use hyphens for various things that have nothing to do with hyphenation either, or to use faux bold effects and faux small-caps. There are some basic principles I think every graphic designer ought to learn. I also expect them to make wiser choices in typefaces. That is something I actually have yet to master myself. As much as I know about type design, my vision regarding what I would consider artistic or expressive typography has a long way to go in maturing.</p>
      <p>Also, I feel you're somewhat downplaying the relevance of typography for a graphic designer. Graphic design is not about shapes but ultimately about communication. How good can the communication be when one of the most essential parts of it is not getting the attention it requires?</p>
      <p>I often feel like we're being trained as artists while a large part of it is perhaps not an exact science, but a lot more rational and less emotional. That's something I'm missing generally. There's a lot of focus on our ideas and process but not a lot of focus and constructive feedback on the execution of our projects. They will tell you what's bad, but not how to be better. That's something you have to work on yourself, and some people struggle with that. I don't, but I do feel I could potentially get a lot more out of my education.</p>
