      <p>" But we're not learning all of these things at school."</p>
      <p>I did — as much as time permitted — but it varies from college to college. An art academy would have a different focus from my major which was Visual Communication Design.</p>
      <p>Do designers know as much about typography as someone who deals with it full time? Of course not. Just as they don't know as much about photography as a professional photographer.</p>
      <p>I agree with you that I see mistakes all the time. Designers today often set type themselves instead of using professional typesetters who were more skilled.</p>
      <p>I also see bad photo scans because designers do it themselves instead of letting a pro do it. In some ways desktop publishing has been a negative for graphic design.</p>
