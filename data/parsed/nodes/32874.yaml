      <p>I partly understand why you wanted to "prove" your statements with an article written by a regarded professional. Trying to make a point to a client using visual proof sometimes doesn't work. Not everybody is a visual person, especially non-designers, and the subtleties of explanations why a serif is better than a sans-serif sometimes doesn't make sense to a non-designer. They tend to think we're just inventing that, or it's a personal taste of ours. I guess I had some tough clients in the past...</p>
      <p>Besides, visual arts can be very subjective. People see and feel colors, layout, type in different ways and they tend to be more comfortable with what it's most familiar to them, almost always. Sometimes I just think when it comes to design, everybody wants to seems like they know something too, and they don't like to be educated. I agree with people that said try once or twice, if nothing comes out of it, move on to the next client.</p>
      <p>I truly enjoyed reading this thread. There were good points made.</p>
