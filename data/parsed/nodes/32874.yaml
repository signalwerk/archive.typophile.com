      <p>Obviously I would'nt want to stop your quest to 'educate' the non-design community, but in my experience you are probably better off trying to 'rise above it'. </p>
      <p>If you feel you want to see it through, I don't think a few bullet points will change opinions, in my experience 'clients' either appreciate the value of design or not, whichever you have to show them something material rather than just verbal/text descriptions. As a last resort do the design you want without their input, use dummy text, whatever it takes, just show them something that is immediately superior to what they have got. I have a personal rule, if you believe in something and the client says no, tweak it, show them again, if they say no again, forget it, move on.</p>
      <p>I'm sure your ultimate goal of doing this sort of project, is to show potential employers that you can bridge the gap between art school and the realities of professional design. I often look at portfolios and would not have a problem if a designer showed two examples of the same project, firstly what the client wanted and got! and second the non-client solution, especially if they could talk about the positives (and negatives) of BOTH. There are more factors in getting a job than just a great portfolio.</p>
      <p>I have worked with and employed junior designers over the years and one of the hardest lessons for most is the influence that clients have on our work, for some it can be a tough learning curve. I think, with experience, successful designers learn how to nudge clients 'softly' into doing what they want using a multitude of means, unfortunately that experience often only comes with trail and error, so what you are doing right now is a postive experience, if only for reasons that you might not expect.</p>
      <p>Good luck.</p>
