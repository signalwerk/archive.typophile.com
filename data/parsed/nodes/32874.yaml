      <p>Persa,</p>
      <p>At least the people you’re working with know how to increase the point size of Times New Roman from the default 12 to 14. Be thankful that they don’t want to decrease the size to 10 points, but still using their 0.25 inch margins, “to get it all on one sheet of paper”, or to change the font to Arial Narrow.</p>
      <p>As a non-designer who works in the decidedly non-design world of a state-run human services institution, I have to say that the vast majority of people do terrible things with type. I can’t begin to tell you how many documents I have had to look at that are set in all caps (because it’s faster to type if one uses the caps lock key rather than holding down the shift key periodically). Then there are the documents where someone has learned to change the font formatting to all small caps, for 7 pages. And of course they all have every heading and subheading set in all caps, boldface, and underlined. Don’t even get me started about 40 page documents set in 12-point Arial with microscopic margins and single line spacing. And we need not mention the flagrant misuse of decorative typefaces for body text, such as Comic Sans and others. Then there are two spaces after every sentence, using quotation marks or all caps in place of italic, and the list goes on. My point is that most people don’t know, understand, or have a clue about type, or about how to make their computer produce a decent looking document. And they believe that those who do understand the basics of type are some sort of font fanatics.</p>
      <p>I also want to voice my agreement with the point brought up by several of the posters above that the best way to try to convince people about typography is to show them how much better good type looks, and how much better it will convey their message to their target audience. I find it interesting that I have seen so many posts on Typophile that ask for ways to phrase written or verbal arguments to convince clients that good design rules should be followed, or for articles to give to them. I would think that designers, being highly skilled in visual communication, would prefer to persuade their clients through visual examples rather than verbal arguments.</p>
      <p>Finally, as a professional who has spent countless hours working with individual clients, I have learned that not everyone is able to make use of my services. In other words, not everyone who crosses the threshold of my office is an appropriate client. I have no doubt that the same is true for graphic designers.</p>
