      <p>Thanks for understanding dezcom, that is why I come here to vent. But as others have stated so well, non-designers really are mystified about such things. </p>
      <p>They were puzzled when I said if someone designs in MS Word, he really doesn't know graphic design. </p>
      <p>One said the "long list" of fonts on the Word menu was confusing, so she never used them. "Why don't you like Times Roman?" We didn't get into it, but since then I've tried to think of an analogy which would resonate with the average person. </p>
      <p>Maybe something to do with food? I notice in every bookstore and library, the largest sections are devoted to cookbooks - every nuance of food preparation. It's a topic I have very little interest in myself.</p>
      <p>These books must number in the millions world-wide, yet daily more cookbooks are published and snapped up - some people can never get enough. Thousands of websites and chatgroups exist for foodies trading recipes. Countless yuppie stores devoted to special cooking equipment and serving dishes like salmon-shaped mousse pans and boar-bristle basting brushes, whatever.</p>
      <p>Now: Suppose everywhere you went, people served potato chips? Your honey serves potato chips for dinner and potato chips at picnics. You encounter potato chips at friends' dinner parties and luncheons. Appetizer: potato chips. Dessert: potato chips. Potlucks: potato chips, potato chips, potato chips.  How long before you start ranting about potato chips?</p>
      <p>"What's wrong with potato chips? They taste good."</p>
