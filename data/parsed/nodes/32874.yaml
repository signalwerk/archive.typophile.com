    html: <p>You could show them how else it could be done &amp; maybe they'll admit there is a difference &amp; agree to your design... But to be honest, I wouldn't get my hopes up, non-designers are very easy to please &amp; they don't really care much about legibility and such. Maybe try to sell your ideas in a "pimp my flyer" kind of way, make it sound cool or something. Find their weaknesses and use them in your advantage (eg. for youthclubs you could tell them to make something more appealing to kids, for restaurants, try to focus on style,...). Find out whatever is important in what they do &amp; try to convince them the design should reflect that also. But again, don't get your hopes up, people are hopelessly uninterested in these matters. I can't begin to tell you the times I've sat down in what looked like a classy or trendy restaurant only to find Comic Sans on the menu (how's that for spoiling your appetite?).</p>
