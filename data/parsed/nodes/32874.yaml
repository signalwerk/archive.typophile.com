      <p>Lately I've found that it can also help to be a little cocky sometimes &amp; maybe even do a little bluffing. I've experienced this to be useful twice in the past few weeks. My neighbours from across the street own a restaurant here &amp; when I went there 2 weeks ago I told them their menu really needed approvement (trust me, it was the dreaded homemade Word kind) to fit the style of the restaurant. They admitted they didn't know anything about it &amp; gave me complete carte blanche to improve it. And then a week ago I saw the site of a bar I go to (which was probably even worse) &amp; I just tòld the owner I was going to make him a new site... He was obviously a little shocked, but I boldly told him it looks like crap &amp; needs to be redone. Again, he pretty much immediately agreed to let me do this after asking me what was wrong with the current site &amp; I only summed up a few flaws. Sure enough, this approach will not work on everyone, but with familiar faces you can even convince people to give you a job (not to mention carte blanche) without even having thought about doing anything about it themselves ;-)<br>
      You don't always have to wait for someone to ask you to do something, sometimes you can just TELL them you're going to do it &amp; they'll agree. The world can be your oyster if you just know who to pick as your next client ;-p</p>
    html_clean: |-
      <p>Lately I've found that it can also help to be a little cocky sometimes &amp; maybe even do a little bluffing. I've experienced this to be useful twice in the past few weeks. My neighbours from across the street own a restaurant here &amp; when I went there 2 weeks ago I told them their menu really needed approvement (trust me, it was the dreaded homemade Word kind) to fit the style of the restaurant. They admitted they didn't know anything about it &amp; gave me complete carte blanche to improve it. And then a week ago I saw the site of a bar I go to (which was probably even worse) &amp; I just tòld the owner I was going to make him a new site... He was obviously a little shocked, but I boldly told him it looks like crap &amp; needs to be redone. Again, he pretty much immediately agreed to let me do this after asking me what was wrong with the current site &amp; I only summed up a few flaws. Sure enough, this approach will not work on everyone, but with familiar faces you can even convince people to give you a job (not to mention carte blanche) without even having thought about doing anything about it themselves ;-)<br>
      You don't always have to wait for someone to ask you to do something, sometimes you can just TELL them you're going to do it &amp; they'll agree. The world can be your oyster if you just know who to pick as your next client ;-p</p>
