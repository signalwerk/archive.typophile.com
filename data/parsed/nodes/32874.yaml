    html: |-
      <p>I know exactly what you mean. I just finished re-doing an ad for a nonprofit peace group I belong to. </p>
      <p>The group had scraped together about $800 for a half-page newspaper ad in the form of a letter to our reps in Congress, signed by about 200.</p>
      <p>Someone had volunteered to make this ad for them. I was horrified at its utter ugliness. Of course it was done in Word - text in Times Roman, headline in Arial Bold reversed on a thick bar of black. Ugh!</p>
      <p>The long list of signers'names was in tiny italics, centered in their table rows. This text was overprinted on two photos (symbolizing war and global warming) the highlight of the piece, which were lightened to about 10% and completely unrecognizable.</p>
      <p>The group members viewed the "draft" and knew it wasn't great, but couldn't quite say why ("That's a polar bear? Where? I can't see it...") </p>
      <p>I just redid the whole thing decently, with a dramatic design, different images (NOT overprinted), three weights of Bookman for the letter, and a legible 8 point sans for the names.</p>
      <p>The one guy who has seen it loves it, but now is worried they need to come up with an excuse to the other guy why they didn't use his design, which he "worked so hard on".</p>
