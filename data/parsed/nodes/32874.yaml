      <p>I've had similar experiences, mostly with artists that aren't designers. A filmmaker client of mine is very big on Impact and Arial. It takes me awhile to explain why Univers and Helvetica are perfect substitutes that are for more legible and more thought out. Of course it's really hard to tell her that her favorites are knock offs of the ones I'm pitching for. </p>
      <p>With her, I've fought and fought numerous times [I somehow ended up working with this lady for two years straight] and it's incredibly ironic how she'll reject my ideas and then at the completion of a job she'll decide on my initial idea. It's absolutely absurd.</p>
      <p>That and she owns photoshop so she thinks she's a designer too. </p>
      <p>Don't be too persistent with them, and create multiples. What they want vs. your well thought out and finished product will be sure to get them to submit, even if just a little bit.</p>
