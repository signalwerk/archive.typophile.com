      <p><cite>“What? my nephew has a computer! he’ll do it for $50!”</cite></p>
      <p>You don't want this guy to hire you. Trust me, your much better off. I've found that the best course of action to take in these scenarios is to thank the person for the opportunity to present your work, and find another client. </p>
      <p>Social engineering is really the only way to educate these people. They won't listen to you. You just want their money. Besides, any fool teenager can drop a gradient on a swooshey sphere. No, in their mind you are simply a wandering soul asking for a handout in exchange for something shiny. The tables have to be turned. They have to come to a place where they are humbled.</p>
      <p>They have to get to a point where they ask, "why does competitor x get so much more credence in the marketplace?" Then someone who they trust has to say, "your branding looks like a high school hack-job." then they go, "oh."</p>
      <p>So when this epiphinal moment finally occurs, you will be vindicated and in a position to demand twice the rate for your services. (It's been a long time. You've won some awards, inflation, an evil fee, whatever you want to call it.) This of course assumes they hadn't given a copy of your comps to the kid to replicate. We all know where that discussion goes. But frankly, you are better off trying to make a living off of the lotto commission than this guy.</p>
      <p>Or I'm cynical.</p>
      <p>Jac<br>
      <em>"pronounced by saying 'Jake' without conjuring imagery of lumberjacks or mans best friend."</em></p>
