    <p>I am a student, but nontheless I occasionally volunteer my time to design for local non-profit organizations. Just a few minutes ago I recieved an email after asking for the body copy for a new leaflet to educatate people about how to reduce their carbon footprints and such and recieved a reply:<br>
    "I'm not sure if anything needs to be done with these three; I'm going to run them by<br>
    the committee this afternoon at 4:00 and ask what they think (whether they<br>
    want to add or subtract any text, or if they think any graphic design needs<br>
    to be added.  Considering that they'll be B/W, I shouldn't think so).  So<br>
    there may be nothing you need do."</p>
    <p>The text that they are running by the committe is two sheets per 8.5x11 page, double-sided, with huge line lengths and 14 point Times.</p>
    <p>I guess my question lies in this: how do you convince people who are unaware of the importance of typography and how type IS design and why they should care about it. How do I word something to say, line lengths and point size and typeface selection are all important in readability and capturing the audience's attention, keeping it, and helping disperse the information correctly without getting into heavy theory and mumbojumbo that they don't care about/don't have time to listen to? Is there some sort of article out there that is concise that I could send to them? Research that would make it credible? Or is this a venture I should take up on my own to try to create such an article that is easy to understand and not too terribly long?</p>
    <p>Your help is appreciated!<br>
    -Persa</p>
