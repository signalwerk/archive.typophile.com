    html: |-
      <p>In 2005, importing a 50-page text file into InDesign (CS or CS2, I don't remember) that used a "simple" font took some 15 seconds while importing the same file that used Zapfino Extra Pro (which had a "calt" feature consisting of 60 or so lookups) took some 5 minutes. But once the text was rendered, there was no visible delay. </p>
      <p>However, in a long document in Notepad on Windows XP at that time, Zapfino Extra Pro caused significant delay on every page scroll — because Notepad was re-running the OT code on every screen refresh while InDesign apparently did some glyph caching.</p>
