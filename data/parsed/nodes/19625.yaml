      <p>Yes. The <a class="freelinking external link-external" href="http://www.microsoft.com/typography/otspec/features_pt.htm#salt" rel="nofollow">Stylistic Alternates (salt)</a> feature should only contain one-to-one substitutions (GSUB lookup type 1) or one-from-many substitutions (GSUB lookup type 3), whereas the  <a class="freelinking external link-external" href="http://www.microsoft.com/typography/otspec/features_ae.htm#calt" rel="nofollow">Contextual Alternates (calt)</a> feature is meant to only contain contextual substitutions (GSUB lookup type 6). In other words, don't put contextual substitutions in 'salt', and one-to-one or one-from-many substitutions in 'calt'. Applications expect that the features in the font are constructed according to the specs, so you might not get the desired behavior if you don't follow them. (Disclaimer: some feature descriptions are not as clear as they needed to be, so some OT layout implementations might slightly differ.)</p>
      <p>&gt; <em>The more semantically correct would be salt, I believe,</em></p>
      <p>I disagree, but I think I understand why you say so. Think of 'calt' as the contextual version of 'salt' (which is similar to the relationship between <a class="freelinking external link-external" href="http://www.microsoft.com/typography/otspec/features_pt.htm#swsh" rel="nofollow">swsh</a> and <a class="freelinking external link-external" href="http://www.microsoft.com/typography/otspec/features_ae.htm#cswh" rel="nofollow">cswh</a>). If you apply 'salt' to a whole block of text, you might see wired things like this,</p>
      <p></p><div class="imageWrap"><img src="/files/salt_4723.png"></div><p></p>
      <p>On the other hand, if you instead apply 'calt' to the same block of text, you might get this result instead,</p>
      <p></p><div class="imageWrap"><img src="/files/calt_4367.png"></div><p></p>
      <p>(Of course, this assumes that the font has the right substitutions in the right features and the application has support for them and  applies them correctly.)</p>
      <p>To get the 'calt' result "automatically", the feature and the substitutions have to rely on the context. In the case above, all glyphs with a finial variant are being replaced whenever they are <strong>positioned at the end of the word</strong> (this is the context), but not when they appear elsewhere.</p>
      <p>&gt; <em>because the characters are not replaced in relation to their neighbours but simply by their order of appearance.</em></p>
      <p>And how do you determine their order of appearance? Don't you have to analyze what's around, and therefore "look" at the context?</p>
      <p>I should add that the result displayed in the 'calt' picture can also be achieved by using the <a class="freelinking external link-external" href="http://www.microsoft.com/typography/otspec/features_fj.htm#fina" rel="nofollow">Terminal Forms (fina)</a> feature. In this case the code of the feature is much simpler (see below), because the task of deciding when to apply the glyph substitution is left to the application. Unfortunately, very few applications support the 'fina' feature. (InDesign CS3 does)</p>
      <p><code>@ALL_LETTERS = [a-z A-Z];<br>
      @FINAL = [a.fina t.fina];<br>
      @NORMAL = [a t];</code></p>
      <p>feature fina {<br>
      sub @NORMAL by @FINAL;<br>
      } fina;</p>
      <p>feature calt {<br>
      ignore sub @NORMAL' [@ALL_LETTERS @FINAL];<br>
      sub @NORMAL' by @FINAL;<br>
      } calt;<br>
      </p>
      <p>As you see, to get the effect of the 'fina' feature via the 'calt' feature, the code get's more complex. This is because using the 'calt' feature we have to put the "intelligence" in the font, whereas using the 'fina' feature we can rely on the application's "intelligence".</p>
