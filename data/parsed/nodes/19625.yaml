    html: |-
      <p>Thank you for that sir, but perhaps I wasn't clear enough in what I was asking; I just wanted someone to check my code, to make sure it would work properly.</p>
      <p>I never expected two of the pioneers of this subject to answer. I'm humbled.</p>
      <p>Anyway, I finally had a chance to check out the code in FLS5, and discovered that it stopped subbing glyphs in the middle of the second set (where I have subsequently placed the third lookup break), and in order for it to complete all of the substitutions, I needed to split the code into the three lookups shown below.</p>
      <p>Here is the code:</p>
      <pre>feature calt { # Contextual Alternates
      # Latin
      lookup calt_one {
      sub @set_1 @set_1' by @set_2;
      sub @set_2 @set_1' by @set_3;
      sub @set_3 @set_1' by @set_4;
      sub @set_4 @set_1' by @set_5;
      } calt_one;

      lookup calt_two {
      sub @set_5 @set_1' by @set_2;
      sub @set_2 @set_2' by @set_1;
      sub @set_2 @set_1 @set_3' by @set_4;
      sub @set_4 @set_4' by @set_5;
      sub @set_5 @set_5' by @set_3;
      } calt_two;

      lookup calt_three {
      sub @set_5 @set_3 @set_1' by @set_2;
      sub @set_3 @set_2 @set_2' by @set_4;
      sub @set_2 @set_4 @set_3' by @set_1;
      sub @set_4 @set_1 @set_4' by @set_3;
      } calt_three;
      } calt;</pre><p>
      Here are my results (spaces are demarcated with a bar above the number):</p>
      <p>[EDIT]: I should clarify the image below; I created a typeface with the letter glyphs replaced with numerals - "1" for set_1 letters, "2" for set_2 letters, etc., and again, with spaces marked with bar above. Then, when the <code>calt</code> code was run in FLS5, you see the following:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/capture_4751.jpg"></div><p></p>
      <p>It seems to work perfectly, but does anyone have any thoughts on why the code needed to be separated into three blocks? Any other thoughts?</p>
