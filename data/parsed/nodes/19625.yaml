      <p><em>salt</em> can be accessed in Illustrator but not in InDesign, IIRC. I think what you're doing are not stylistic alternates. That would be more something like switching between a one- and two-storey "a" etc. Slight variations of the same drawing are not stylistically different in my opinion.</p>
      <p>I'd say, use <em>calt.</em> Applications should, following the feature specification, turn this feature on by default, so that's what you'd want.</p>
      <p>Jens.</p>
