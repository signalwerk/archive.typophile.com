    html: <p>Good question. AFAIK, marking the <code>@NORMAL' by @FINAL</code> substitution is more related with the fact that 1) when <code>ignore sub(stitute)</code> is used, at least one glyph or glyph class must be marked (<a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.ii" rel="nofollow">When no glyphs are marked, then only the first glyph or glyph class is taken to be marked</a>). Additionaly, in order for the exception to the chaining substitution rule (i.e. the <code>ignore sub</code> rule) to affect the rules that follow it, 2) they all must be of the same type so that they are put in the same lookup (<a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4.e" rel="nofollow">A lookup is a group of rules of the same type</a>). Since the exception will of type GSUB LookupType 6, the following rules need to be expressed in the same type, and that's achieved by marking the sequence.</p>
    html_clean: <p>Good question. AFAIK, marking the <code>@NORMAL' by @FINAL</code> substitution is more related with the fact that 1) when <code>ignore sub(stitute)</code> is used, at least one glyph or glyph class must be marked (<a class="freelinking external link-external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.ii" rel="nofollow">When no glyphs are marked, then only the first glyph or glyph class is taken to be marked</a>). Additionaly, in order for the exception to the chaining substitution rule (i.e. the <code>ignore sub</code> rule) to affect the rules that follow it, 2) they all must be of the same type so that they are put in the same lookup (<a class="freelinking external link-external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4.e" rel="nofollow">A lookup is a group of rules of the same type</a>). Since the exception will of type GSUB LookupType 6, the following rules need to be expressed in the same type, and that's achieved by marking the sequence.</p>
