    html: |-
      <p>For others who might wonder the same thing: I expect you'd just process the problem combo afterwards in a separate lookup. So for instance if you wanted whichever version of "g" came first to take precedence you could have a lookup that did:</p>
      <p>sub g g.alt' by g<br>
      sub g.alt g' by g.alt</p>
      <p>Cheers,</p>
      <p>T</p>
