    html: |-
      <p>In the Phinney method, with four versions of each character, there will be repetitions every 5th and 9th character, &amp;c.<br>
      For instance, in the phrase "this is the way the men think", all the "th"s will be identical.</p>
      <p>So, replace a (Sousa-termed) sequence of 1234 1234 1234 with:</p>
      <p>1234 1324 3142 </p>
      <p>In this sequence, there are no repeated combinations.<br>
      Here's how:</p>
      <p><code> feature calt { </code></p>
      <p>lookup calt_one {<br>
      sub @set_1 @set_1' by @set_2;<br>
      sub @set_2 @set_1' by @set_3;<br>
      sub @set_3 @set_1' by @set_4;<br>
      } calt_one;</p>
      <p>lookup calt_two {<br>
      sub @set_4 @set_1 @set_2' by @set_3;<br>
      sub @set_3 @set_3' by @set_2;<br>
      sub @set_2 @set_4 @set_1' by @set_3;<br>
      sub @set_4 @set_3 @set_2' by @set_1;<br>
      sub @set_3 @set_1 @set_3' by @set_4;<br>
      sub @set_4 @set_4' by @set_2;<br>
      } calt_two;</p>
      <p>(A longer "mixed up sets" sequence would be required to fully deal with "this is the way the men think".)</p>
      <p>In removing repeated combinations, the trade-off is a reduction of some of the distances between repetitions (the smallest here being "...212..." which occurs at the end of the sequence).</p>
      <p>So it may be better to have at least five sets, and a sequence such as:</p>
      <p>12345 21453 24135 </p>
      <p>Within this sequence of fifteen characters, there is only one repeated adjacent combination, and repeated sets are separated by at least three characters.</p>
      <p>**</p>
      <p>There is a way to cycle through the variants of a character each time it appears:</p>
      <p><code>feature calt { </code></p>
      <p>sub A A' by A.alt;<br>
      sub A @NoA A' by A.alt;<br>
      sub A @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt;<br>
      sub A.alt A' by A.alt2;<br>
      sub A.alt @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt2;<br>
      sub A.alt2 A' by A.alt4;<br>
      sub A.alt2 @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      sub A.alt2 @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA @NoA A' by A.alt3;<br>
      } calt;</p>
      <p>...and so on, where @NoA is all the letters, punctuation, etc. that may occur between instances of the character "A", but not A.</p>
      <p>This is rather long-winded, as it has to be done separately for every character one wishes to cycle, so one could end up with hundreds of classes of hundreds of glyphs each. (In practice, this may only be necessary for the most noticeably different of the most frequent letters, especially "t".) </p>
      <p>I wonder if so much coding would appreciably slow down rendering?</p>
