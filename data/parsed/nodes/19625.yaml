      <p>The glyphs are split into sets; the primary set (<code>@set_1</code> [A-Z, a-z, 0-9, etc.]), and four other 'alternate' sets of the same glyphs you wish to be swapped out; sets <code>@set_2</code> through <code>@set_5</code>.</p>
