      <p>Just a thought, Nick: For longer passages of text (i.e., temporarily setting aside your "this is the way the men think" example), wouldn't cycling sets of vowels be a better method of changing the most frequently occurring letters? </p>
      <p>Fine, it mightn't be ideal with transliterated Serbian ;)  </p>
      <p>Still, curiosity heightens: how could one order such cycling vowel lookups <em>and</em> the larger calt sets (viz., the numbered sets you've used above) to work neatly together? Or is the assumption that it could be done in itself a leap too large?</p>
      <p>Regards,<br>
      Ernie</p>
