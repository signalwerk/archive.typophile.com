    html: |-
      <p>&gt; <em>what does calling the “lookup rotate;” thing do?</em></p>
      <p>In terms of code, what it does is "makes a call" to the lookup defined above, which means that each 'sub' is "ran" again. <em>Again</em> because this part of the code<br>
      <code><br>
      lookup rotate {<br>
      sub @set_1 @set_1' by @set_2;<br>
      sub @set_2 @set_1' by @set_3;<br>
      sub @set_3 @set_1' by @set_4;<br>
      sub @set_4 @set_1' by @set_5;<br>
      sub @set_5 @set_1' by @set_1;<br>
      } rotate;<br>
      </code></p>
      <p>not only defines the lookup, but also "runs" each 'sub' included in it.</p>
      <p>==========================================</p>
      <p>In terms of result, the line “lookup rotate;” does nothing, really. If you analyze step by step what the code does, here's how it goes:</p>
      <p><strong>A.</strong> Let's consider a word with 10 letters as the input. Each of these letters have their default glyph, represented by "1", and four alternates glyphs, represented by "2", "3", "4" and "5". In the beginning, all those letters are taking their default glyph shape, since no feature is applied. So, our 10-letter word looks like this, <strong>1111111111</strong> (where "1" represents the default glyph of each letter).</p>
      <p><strong>B.</strong> After going through the first 'sub' (<code>sub @set_1 @set_1' by @set_2;</code>), our word now looks like this, <strong>1212121212</strong>, where "2" represents the first alternate glyph. What the code does here is replace the second default glyph (in a pair) by the alternate glyph.</p>
      <p><strong>C.</strong> The second 'sub' changes the displayed word to <strong>1231231231</strong>.</p>
      <p><strong>D.</strong> The third 'sub' changes it to <strong>1234123412</strong>.</p>
      <p><strong>E.</strong> The fourth 'sub' changes it to <strong>1234512345</strong>.</p>
      <p><strong>F.</strong> And the fifth and last 'sub' (<code>sub @set_5 @set_1' by @set_1;</code>) does nothing, because it's replacing the default glyph (a.k.a. "1") by itself.</p>
      <p><strong>G.</strong> Then the call to the 'rotate' lookup does nothing as well, because at this stage our word doesn't have any two default glyphs next to each other (i.e. "11"). Neither the first alternate ("2") appears followed by the default glyph ("1"). And so on...</p>
      <p>Bottom line, Pieter's code can be further reduced to just,<br>
      <code><br>
      feature salt {<br>
      sub @set_1 @set_1' by @set_2;<br>
      sub @set_2 @set_1' by @set_3;<br>
      sub @set_3 @set_1' by @set_4;<br>
      sub @set_4 @set_1' by @set_5;<br>
      } salt;<br>
      </code></p>
