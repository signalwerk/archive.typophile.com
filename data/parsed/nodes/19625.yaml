    <p>Ok, Opentype wizes…<br>
    I’ve been using Thomas Phinney's Opentype random code he posted in the Adobe user to user forums<br>
    <a href="http://www.adobeforums.com/cgi-bin/webx?50@755.561rfSM0Gas.1@.3bbc5ea4" title="http://www.adobeforums.com/cgi-bin/webx?50@755.561rfSM0Gas.1@.3bbc5ea4">http://www.adobeforums.com/cgi-bin/webx?50@755.561rfSM0Gas.1@.3bbc5ea4</a><br>
    and it works great! I’m working on a typeface that has one alternate for each Uppercase charicter and three alternates for each lowercase charicter making 2 different glyph forms for the Caps and 4 different glyph forms for the lowercase. My question is what is the logic behind repeating "lookup rotate;" 13 times? Does it relate to having eight different glyph forms?<br>
    my code looks like this:<br>
    feature calt {<br>
    lookup UCrotate {<br>
    	sub @default_UC @default_UC' by @UC_calt1;<br>
    } UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;<br>
    lookup UCrotate;</p>
    <p>lookup lcrotate {<br>
    	sub @default_lc @default_lc' by @lc_calt1;<br>
    	sub @lc_calt1 @default_lc' by @lc_calt2;<br>
    	sub @lc_calt2 @default_lc' by @lc_calt3;<br>
    	sub @lc_calt3 @default_lc' by @lc_calt4;<br>
    } lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    lookup lcrotate;<br>
    } calt;</p>
    <p>Thanks!</p>
    <p>Josh</p>
