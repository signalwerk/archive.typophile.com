    html: |-
      <p>[While I was writing, Miguel has already answered the question ...]</p>
      <p>The <em>ignore</em> statement does a nice trick when writing GSUB or GPOS tables. I'll try a simplified (so not entirely correct) description:</p>
      <p>In the compiled font's GSUB table, the "main" lookup for this <em>calt</em> feature will not only contain a subtable listing all the substitutions (here <em>"sub @NORMAL by @FINAL;"</em>), but also an additional subtable ahead of it. This additional subtable will list affected glyphs and their contexts (here <em>"@NORMAL' [@ALL_LETTERS @FINAL]"</em>) but no instructions about what to do with them. It does nothing, actually -- the sole purpose of this subtable is to "catch" all contexts listed in the <em>ignore</em> statement.<br>
      Layout engines follow the rule that if a glyph or glyph sequence has been consumed by a subtable, then all following subtables will be skipped for this glyph or glyph sequence. So the trick works like this: If the <em>ignore</em> context is matched for a glyph: substitutions for this glyph, as defined in the following subtable, will not be executed (they will be ignored). If the <em>ignore</em> context is not matched: substitutions for this glyph, defined in the following subtable, will be executed.</p>
      <p>(And to make sure that the real substitutions will go into the same lookup as the mere "context catchers" -- although into different subtables -- they must be of the same lookup type. Which is achieved by defining <em>"sub @NORMAL' by @FINAL;"</em> in pseudo-contextual form, as Miguel explained.)</p>
      <p>VOLT's <em>EXCEPT</em> does about the same thing, AFAIK.</p>
