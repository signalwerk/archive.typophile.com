    html: |-
      <p>BTW, if you remove the quote marks from the substitutions and then explicitly make them part of the same lookup, like this,</p>
      <p><code>feature calt {<br>
      lookup TEST {<br>
      ignore sub @NORMAL [@ALL_LETTERS @FINAL];<br>
      sub @NORMAL by @FINAL;<br>
      } TEST;<br>
      } calt;</code></p>
      <p>when you try to compile the code you'll get the following error,<br>
      <code>[FATAL] &lt;MyFont-Regular&gt; Lookup type different from previous rules in this lookup block</code></p>
      <p>Whenever I need to put together some code that involves using the 'ignore' statement, I tend to write the simpler subs first, and then figure out what the ignore sub needs to be in order to get the desired behavior.</p>
