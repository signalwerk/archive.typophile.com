      <div class="comment-spam-body"><p>Edited:<br>
      The nameplate of prop newspaper in the Sherlock Holmes move is an authentic reproduction of the engraved nameplate of a British newspaper called _The Penny Illustrated Paper and Illustrated News_. Compare to a letterhead from Nov. 5. 1881<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ThePennyIllustrated18811105DetailSM_5252.jpg"></div><br>
      I have not seen this particular lettering as a typeface. That is not to say that such a typeface was not made.<br>
      BTW the British Library announced in 2010 that this newspaper, and many others, will be available in digital form for online reading. Press release: <a href="http://blogit.realwire.com/british-library-and-brightsolid-partnership-t" title="http://blogit.realwire.com/british-library-and-brightsolid-partnership-t">http://blogit.realwire.com/british-library-and-brightsolid-partnership-t</a>... and <a href="http://chnm.gmu.edu/worldhistorysources/w/276.html" title="http://chnm.gmu.edu/worldhistorysources/w/276.html">http://chnm.gmu.edu/worldhistorysources/w/276.html</a><br>
      Edited:<br>
      Additional Information.<br>
      Unfortunately the links do not actually lead to the digitized newspapers.<br>
      By 1884 the idea of a concave lettering was made into a font by Marder, Luse &amp; Co, which they called Concave. A version of concave was digitized as Show <a href="http://www.myfonts.com/fonts/juan-jose-lopez/show/" title="http://www.myfonts.com/fonts/juan-jose-lopez/show/">http://www.myfonts.com/fonts/juan-jose-lopez/show/</a> But there are considerable differences between Show and the nameplate lettering _ILLUSTRATED PAPER_.<br>
      Don<p></p>
      </div>
