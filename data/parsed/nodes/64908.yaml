    html: |-
      <p>It embeds the font. But Helvetica Neue isn't well hinted* (at least for Windows).<br>
      PDF embeds the font proper (not an image of it).<br>
      If I remember correctly, there are settings in Adobe Reader to lessen the problem, but I understand it's not practical to share a PDF along some instruction on how to better view it…</p>
