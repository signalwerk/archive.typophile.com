  html: <p>Alright this has been plaguing me for years now and I've finally decided to do something about it. If I make a .pages document on Mac and export as PDF when I open on a Windows machine the font (helvetica neue) renders correctly except it seems to be wavy. Certain letters sit higher on the baseline than others, Is there anyway around this, I thought by exporting to PDF it somewhat embeds the font (like image) to the document. Any help or suggestions?</p>
  html_clean: <p>Alright this has been plaguing me for years now and I've finally decided to do something about it. If I make a .pages document on Mac and export as PDF when I open on a Windows machine the font (helvetica neue) renders correctly except it seems to be wavy. Certain letters sit higher on the baseline than others, Is there anyway around this, I thought by exporting to PDF it somewhat embeds the font (like image) to the document. Any help or suggestions?</p>
