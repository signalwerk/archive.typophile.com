    html: <p>The ring zero is one of the ways in which type designers at different times have tried to resolve the problem of confusion of lowercase o and oldstyle zero. It is a problem that has never been really adequately resolved, and we rely heavily on context to distinguish these two characters. In historic revival projects such as Garamond Pro, the designer has to ask 'Should I follow the approach of the original to this problem, or should I try to come up with my own solution'. The answer in most revivals seems to be to follow the original; after all, the selling point of the design is that it is a revival of something e.g. cut by Claude Garamond in the 16th century.</p>
    html_clean: <p>The ring zero is one of the ways in which type designers at different times have tried to resolve the problem of confusion of lowercase o and oldstyle zero. It is a problem that has never been really adequately resolved, and we rely heavily on context to distinguish these two characters. In historic revival projects such as Garamond Pro, the designer has to ask 'Should I follow the approach of the original to this problem, or should I try to come up with my own solution'. The answer in most revivals seems to be to follow the original; after all, the selling point of the design is that it is a revival of something e.g. cut by Claude Garamond in the 16th century.</p>
