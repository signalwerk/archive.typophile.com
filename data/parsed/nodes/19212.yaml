      <p>&gt;The design reflects earlier attitudes about the number zero itself. Western mathematics was not comfortable with the concept of zero for some time, and felt that it was not a number in the usual sense.</p>
      <p>According to <a href="http://en.wikipedia.org/wiki/0_(number)" rel="nofollow">this article</a>, the use of the zero came into Europe during the 13th century. Printing is 15th century, so the issue of the acceptance of zero is unlikely to be involved in the circular old style zero. I think it is for typographic reasons, to prevent confusion with the cap, small cap and lc 'o'. It is generally not, in fact, a perfect circle, though it is more circular than any of the o's.</p>
