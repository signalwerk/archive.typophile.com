    <p>I have used Adobe Garamond Premier Pro in a couple of recent books, and like it a lot. One thing that upsets me though is the oldstyle zero, which looks kind of unfinished to me. It looks like a perfect circle, with no 'shape' or modulation. Does it look odd to anyone else? The first time I saw it in print I thought it was a mistake.</p>
    <p>I've tried to attach a scan, but I'm not convinced it's going to show up. You can also find one here:</p>
    <p><a href="http://store.adobe.com/type/browser/landing/garamond/garamond.html" title="http://store.adobe.com/type/browser/landing/garamond/garamond.html">http://store.adobe.com/type/browser/landing/garamond/garamond.html</a></p>
    <p>Toby</p>
