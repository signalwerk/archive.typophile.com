      <p>It's a sophisticated form.<br>
      It makes aesthetic sense in faces such as Garamond that have long thin stems in various characters, such as the upper case M and N, and the em dash, and especially the 4 and 7, where the long thin stem has no finial. Because of these other instances, it is not an isolated quirk, but shares an element of the face's graphic language.</p>
