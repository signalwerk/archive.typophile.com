      <p>You'll find this "perfect circle" style in a number of historical revivals. Check out Carter's Big Caslon. The design reflects earlier attitudes about the number zero itself. Western mathematics was not comfortable with the concept of zero for some time, and felt that it was not a number in the usual sense.</p>
      <p>You can always substitute a lc "o".</p>
