    date_raw: 24.Jun.2010 8.08pm
    votes: null
    html: |-
      <p>Make three classes, for example</p>
      <p>@pre = [A H I M N T X]; # the glyphs you want to substitute out<br>
      @post = [A.alt H.alt I.alt M.alt N.alt T.alt X.alt]; # the glyphs you want to substitute in go here<br>
      @context = [S X Z s x z]; # the glyphs that trigger your substitution go here</p>
      <p>Then in your Contextual Alternates (calt) feature use the following code</p>
      <p>feature calt {<br>
         sub @pre' @context by @post;<br>
      } calt;</p>
