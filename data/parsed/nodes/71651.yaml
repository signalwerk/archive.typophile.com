    <p>I don't get out much, so pretty much everything I know about OpenType programming, I've learned here. Ergo...</p>
    <p>I'm working on a font that requires contextual alternates for certain characters (A, H, I, M, N, T, X and any accented characters associated with same) preceding EVERY instance of S, X, Z, s, x and z. I'm not sure what the easiest way to accomplish this is, and how to avoid recursive problems with X.</p>
    <p>Any suggestions would be greatly appreciated.</p>
  html_clean: |-
    <p>I don't get out much, so pretty much everything I know about OpenType programming, I've learned here. Ergo...</p>
    <p>I'm working on a font that requires contextual alternates for certain characters (A, H, I, M, N, T, X and any accented characters associated with same) preceding EVERY instance of S, X, Z, s, x and z. I'm not sure what the easiest way to accomplish this is, and how to avoid recursive problems with X.</p>
    <p>Any suggestions would be greatly appreciated.</p>
