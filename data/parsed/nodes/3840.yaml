    html: <p> I stumbled over here after reading elsewhere that a small band has formed around the hatred of Comic Sans and a raging discussion was going on... please let me in. <br> <br>Primarily a writer by trade, I'm not educated enough yet to tell you precisely why I hate it; I just do. I woke up one morning and had some sort of typographic epiphany. I confess! I used it once, long ago, to rough out some scripts. When I came across them the other day, it was like looking in the mirror and suddenly remembering what exactly you did the drunken night before, running into a one night stand or realizing that you're living on skid row, prostituting yourself for crack. I thought I was being cute. Now I want to cleanse myself of that dark period and lose the shame. Either forgiveness or flagellation is welcome. I do confess a deep and abiding love for Helvetica... hope that's ok...I've come here to learn. </p>
