    date: 2003-01-07T22:33:00
    votes: null
    html: <p>Wanting your favorite typeface to become part of the standard would be a wish granted by the Monkey's Paw. It would then join the ranks of dearly-beloved typefaces like Times, Helvetica, Avant Garde, Zaph Chancery and Comic Sans. <br> <br>Would you still like your favorite font the one-thousanth time you saw it on a lost-dog flyer? How many times would you like to see it used as a newsletter text face in artificial bold with too-tight leading? How often would you like to see it on a laser-printed price list with lots of sizes and underlines and outlines and drop shadows? How often would it take for you to see your favorite display face used for e-mail text or body copy (in all caps, of course)? How often would you enjoy seeing it artificially bolded or slanted? How often would you need to see it used for a 3-D spinning logo? <br> <br>Would you even want to touch it for serious projects any more? <br> <br>The people who wold commit these attrocities simply would never buy your favorite typeface, except by sheer accident, and they would never, ever buy fonts with expert sets. <br> <br>My greatest, secret fear is that a blackletter typeface will someday become standard - you know everyone would be using it in all caps whenever they wanted to be sophisticated or elegant. The fact that we don't have this now actually reflects good taste on somebody's part, because the masses would love it. Give me Comic Sans any day!</p>
