    date: 2002-11-06T23:48:00
    votes: null
    html: <p>I can't believe it! I haven't read all the posts... but it's just too much! I feel sorry for Vince. Although I'm not a fan of Comic Sans I must say, he had a reason to design Comic Sans and that was his job! Stop getting the designer involved in this... he isn't Comic Sans! It wasn't his fault! I'd like to also add that I went to the same grad school (University of Reading, UK) as Vince to do typeface design, so I do have some respect for his work (I don't know him personally though). <br> <br>I think there's much to be said about informal fonts. People just love Comic Sans. Most of my non-designer friends love it and use it for their PowerPoint presentations and emails. I don't blame them. They need typefaces that they think are useful for expressing themselves and that are freely available to them. With the popularization of computers (or maybe even the typewriter), all the friendliness and warmth associated with handwriting are gone. We began to have to 'typeset' personal letters and other informal things with official, cold looking typefaces. Do you expect them to use Times New Roman or other 'proper typefaces' for everything? I don't think they should somehow. They are not as educated in type as us graphic designers, and they simply choose what appeals to them. The criteria that they use when they choose typefaces are different... they tend to choose non-typographic and 'handwritten' type. There's nothing wrong with it, I think. But the popularity of Comic Sans just show how big an effect a software monopoly can have on the visual landscape. I think we urgently need a good workhorse informal font that is free for everyone to use. I'm quite happy to take that on myself. <br> <br>I don't agree with deleting Comic Sans on art schools' computers.... that's censorship! People, even designers, have to right to know what's available and to make decisions for themselves. Instructors who are fed up with seeing Comic Sans in their students' work should blame it on themselves, not the fact that the font is available on the computers. Education is key. I agree with Vince that Comic Sans could look really good if it is used well. I'm proud to say that I've used Sand in an email I sent on Halloween day! It worked! :-) I must say I'd rather see Comic Sans than Sand for running text. And trust me, I've seen Sand being used for running text! <br> <br>K.</p>
