    html: |-
      <p>Dada typographers used common fonts in f*cked-up layouts.<br>
      Subsequent radical graphic designers have often used wack fonts as well.<br>
      Would today's dadaists use prosaic typefaces such as Gotham?<br>
      That would be emulating the process, rather than imitating the historical artefact.</p>
