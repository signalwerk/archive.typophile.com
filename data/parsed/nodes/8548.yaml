    html: <p>Although I was actually a part of the 'historical' MA at Reading, I did observe and participate in some of the Type Design MA seminars/lectures. I would highly recommend this to anyone serious about learning about type design. <br> <br><a href="http://www.rdg.ac.uk/AcaDepts/lt/" target="_top">http://www.rdg.ac.uk/AcaDepts/lt/</a></p>
