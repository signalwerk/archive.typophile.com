  html: <p> i'm a portuguese student finishing a graduate in graphic design. <br> <br>Since the begining i'm really interested in type design and i'm looking for a post graduate (or something else) specif in typographic design. <br> <br>i have heard about Reading(UK) and some other i dont remember the names placed in Netherland (Aia) I think!?!! <br> <br>does any one know anything about these or other good courses? </p>
