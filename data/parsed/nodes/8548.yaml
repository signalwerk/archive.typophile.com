    html: <p> Hello Ruben, I'm not a expert about your question but I know that our compatriot Jorge dos Reis studyed at Royal college of Art, Clerkenwell and the Norwich Scholl of Art in London. Try to get the links of this schools and good luck for the informations. For your unhappiness we don't have a graduation or a post graduate in typography Design, in my case I have been learning alone and make some contacts and feed-backs here with the typophile community. I think we must join forces to get a strong typography environmment in our country!. See you soon and best Regards from your typography neightbour. <br> <br>Um abraço / Ricardo Santos </p>
    html_clean: <p> Hello Ruben, I'm not a expert about your question but I know that our compatriot Jorge dos Reis studyed at Royal college of Art, Clerkenwell and the Norwich Scholl of Art in London. Try to get the links of this schools and good luck for the informations. For your unhappiness we don't have a graduation or a post graduate in typography Design, in my case I have been learning alone and make some contacts and feed-backs here with the typophile community. I think we must join forces to get a strong typography environmment in our country!. See you soon and best Regards from your typography neightbour. <br> <br>Um abraço / Ricardo Santos </p>
