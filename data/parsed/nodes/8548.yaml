    html: '<p>The Royal collage of Art is at: <a href="http://www.rca.ac.uk/" target="_top">http://www.rca.ac.uk/</a> <br> <br>The only art/design college I know of in Clerkenwell is the LCP site at Back Hill, referenced above. <br> <br>I would imagine that the "Norwich School of Art" is in fact in Norwich, about 100 miles from London. <br> <br><a href="http://www.nsad.ac.uk/" target="_top">http://www.nsad.ac.uk/</a></p>'
