      <p>I was a heavy user before becoming a manufacturer, and I would imagine that most type designers have some experience as working typographers.</p>
      <p>Certainly, many of the factors above influenced me, to which I would add licensing considerations (under “practical”).</p>
      <p>Often typographers use types which are trendy, betting on a proven thing, as it were, and it’s easy to see what’s popular by going to the best seller lists at online resellers such as FontSpring and MyFonts.</p>
      <p>But ultimately, you’ve got to go with your gut.<br>
      As Jane Hope put it:</p>
      <p>“I’m not a big believer in rationalizing. The way something comes to life through design, every designer has a personal attitude. Rationalization is only as strong as the design’s credibility.”</p>
