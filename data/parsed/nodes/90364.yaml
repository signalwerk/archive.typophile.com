    <p>Hello everybody!<br>
    My apologies, in advance, for my lousy english. </p>
    <p>I'm doing a school project on the factors that influence the choice of a typeface. Robert Bringhurst, in his book The Elements of Typographic Style, refers to:<br>
    Technical considerations, Consider the medium for which the typeface was originally designed;<br>
    Practical typography, Choose faces that suit the task as well as the subject;<br>
    Historical considerations, Choose a face whose historical echoes and associations are in harmony with the text;<br>
    Cultural &amp; Personal considerations; Choose faces whose individual spirit and character is in keeping with the text.</p>
    <p>Michael Bierut, in his famous essay 'thirteen ways of looking at a typeface', considers more subjective reasons like 'because it's beautiful', 'because it's ugly', 'because it's boring', etc.</p>
    <p>Some designers, truly have a fascination with only one typeface and throughout their work they only use a very small selection of typefaces. </p>
    <p>I could enumerate many more reasons or examples but I don't want to limit or condition your answers. What do you considerer when choosing a typeface?</p>
