    html: '<p>Thanks for the response -- I dug bit more, and <a href="http://en.wikipedia.org/wiki/Dutch_Y">Wikipedia says you are correct</a>. So, I learned something new: "IJ" is a vowel sometimes called a "long y."</p>'
  - id: 141542
    user: 1203
    date: 2004-04-07T06:41:00
    date_raw: 7 Apr 2004 — 6:41am
    votes: null
    html: <p>see <a href="http://rudhar.com/lingtics/nlij_en.htm" target="_blank">http://rudhar.com/lingtics/nlij_en.htm</a> for a discussion. The status of this letter is not well described. <br> <br>I'd like to add that the main reason I see why it is not much used, is because most type writers (and most computer keyboards) do not support it or through a difficult key sequence. Neither the upper case nor the lower case character is present in iso-8859-1, the character set we're supposed to be happy with in the Netherlands :-) <br> <br>Most people simply type ij, but this poses a problem in sorting. <br></p>
  - id: 141543
    user: 909
    date: 2004-03-25T17:27:00
    date_raw: 25 Mar 2004 — 5:27pm
    votes: null
    html: <p>I'm not a Dutch expert, but I've been told that yes, it's a real character (like ae and oe) rather than a typographic nicety (like fi and fl). <br> <br>T</p>
