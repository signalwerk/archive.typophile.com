  html: '<p>I have a question for experts in Dutch language typography: <br> <br>Is the "ij" ligature (x0133 Unicode) an atomic element considered linguistically distinct from the sequence i-j (as "ae" is in Icelandic, I think), or is it simply a typographic ligature (as are the "fi" and "fl" we know so well in English)? <br> <br>Thanks, <br>Brent</p>'
comments:
  - id: 28678
    user: 1262
    date: 2004-03-26T11:18:00
    date_raw: 26 Mar 2004 — 11:18am
    votes: null
    html: <p>Yes, it is atomic. When letterspaced, it should appear as in R IJ N N, and when set vertically as in <br> <br>R <br>IJ <br>N <br>N</p>
  - id: 28679
    user: 1250
    date: 2004-04-08T21:03:00
    date_raw: 8 Apr 2004 — 9:03pm
    votes: null
    html: "<p>Let me ask a somewhat related question: <br>I've read (I don't remember where) that Dutch can mark syllable inflection through the use of the acute accent (sort of like italics for emphasis, but for single vowels). Is this true? If so, why is it not used much? And would it mean we'd need to have a \"j-acute\"?! (If the \"ij\" is indeed atomic.) <br> <br>hhp <br></p>"
  - id: 28680
    user: 1250
    date: 2004-04-08T21:11:00
    date_raw: 8 Apr 2004 — 9:11pm
    votes: null
    html: "<p>Here's the source - towards the very end of: <br><a href=\"http://www.typophile.com/forums/messages/30/18515.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/18515.html</a> <br> <br>hhp <br></p>"
  - id: 28681
    user: 1262
    date: 2004-04-09T01:49:00
    date_raw: 9 Apr 2004 — 1:49am
    votes: null
    html: <p>I'm not sure whether the ij gets an acute on both the i and j, or a single acute optically centered above them.</p>
