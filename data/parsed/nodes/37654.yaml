      <p>Hi everyone,</p>
      <p>Until a few months ago, there was a ladies’ strip club in the remnants of Boston’s Combat Zone called The Glass Slipper which used Stilla on its outside sign.  I wish I’d taken a picture of it, because it seemed so very appropriate to the venue...  The building it was in, got demolished and they moved across the street; now the sign is done in Zapfino, ALL CAPS!  =:-o</p>
      <p>Cheers,<br>
      John the Fontaholic<br>
      (who never stepped inside the place, just observed its typography from the outside!)</p>
