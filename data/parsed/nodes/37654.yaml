    <p>Doesn’t have to be this exact face, and there’s obviously been some work done to the characters, but if anyone’s got a similar font to this I’d be most grateful! It needs the funky twist to the letters, like the big drop endings to the cap serifs, so the simple black-poster fonts I’ve been trying (Fenice, Bodoni, Didot etc) won’t cut it I’m afraid.</p>
    <p></p><div class="imageWrap"><img src="/files/ultra-fat_3544.jpg"></div><p></p>
    <p>Thanks! Chris</p>
