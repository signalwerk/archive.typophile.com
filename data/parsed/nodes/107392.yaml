      <p>This is most certainly not called “a typography”. I have no idea what that means. </p>
      <p>Option 1: Give the pp ligature a unicode slot in the PUA area. This is the worst option, because it isn’t indexable, copyable or readable for the blind. So, some users may not be able to read it — but all users can see the decoration.</p>
      <p>Option 2: Write an OT liga feature to substitute two p’s for a pp ligature, and reference it with CSS. This is a somewhat better option. Text remains indexable, copyable and readable for all. Unfortunately, OpenType features are still not supported by all browsers. So, some users may not see the decoration — but all users can read it.</p>
