    <p>Hello everyone,<br>
    I try to explain you the problem.</p>
    <p>I created a typography that has both common (e.g. between "f" and "i") and custom (e.g. between "p" and "p") ligatures and used FontLab to export the font in ttf.<br>
    Now I want an HTML page to display the font and I write &amp; #xFB01 for common ligature between "f" and "i".<br>
    But where should I operate to display custom ligature between "p" and "p"?</p>
    <p>Thank you in advance for your attention!<br>
    Filippo</p>
