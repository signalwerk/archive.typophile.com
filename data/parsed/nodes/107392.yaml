    html: |-
      <p>To try to solve the problems I think I should tell you something more about my process in Fontlab, a software that I do not control very well yet.</p>
      <p>Here are the list of actions done:<br>
      1) Created glyphs in Illustrator and imported to Fontlab (only a few glyphs).<br>
      2) Specified the width of every glyph.<br>
      3) Set the settings in "Font Info".<br>
      4) Set the language system in the Open Type panel (languagesystem latn dflt;).<br>
      5) Created the ligatures features in the Open Type panel (and compiled).<br>
      6) Opened the Metrics panel and manually set the kerning between specific pairs of glyphs.<br>
      7) Saved and exported font in .otf e .ttf formats (the one I tried on the html+css page is the True Type .ttf).</p>
      <p>I ask you experts if there is something wrong. Maybe the kerning problems in different browsers originates from the fact I set kerning in this way?</p>
      <p>Thank you for the attention!<br>
      Filippo</p>
