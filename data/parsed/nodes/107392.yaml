    html: |-
      <p>I think, Frode, we can safely assume he meant typeface and font.</p>
      <p>Filippo: MUFI (the Medieval Unicode Font Initiative) assigned the PUA slots uniEED6 to the pp ligature and uniEEDD to the PP ligature in its character lists. So, if you take the first route, these slots are slightly better than others. They would, in HTML, be &amp;#xEED6; and &amp;#xEEDD; respectively.</p>
      <p>But as Frode says, the second option is better. Doing both may be even better, though.</p>
