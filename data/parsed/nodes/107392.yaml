    html: |-
      <p>Thank you guys and sorry for my English that is a bit unclear..! Yes I meant "typeface" instead of "typography".</p>
      <p>Returning to the problem I tried with the second option and discarded the first one! I created the glyphs (and ligatures) and kerning pairs in Fontlab and then activated them by css properties @font-face, text-rendering, font-variant-ligatures and font-feature-settings.<br>
      The result?</p>
      <p>Google Chrome on Mac: Ok but some kerning pairs are missing (e.g. between lowercase o and superscript 1).<br>
      Mozilla Firefox on Mac: Ok.<br>
      Opera on Mac: Ok but some kerning pairs are missing (e.g. between lowercase o and superscript 1).<br>
      Apple Safari on Mac: Fail, it does not render ligatures and, even more serious, kerning (!!!).<br>
      Internet Explorer: Still not tested.</p>
      <p>Google Chrome on iPhone: Ok but some kerning pairs are missing (e.g. between lowercase a grave and z_z ligature).<br>
      Opera on iPhone: Fail, it does not download .ttf font.<br>
      Apple Safari on iPhone: Ok but some kerning pairs are missing (e.g. between lowercase a grave and z_z ligature).</p>
      <p>As you can see, it is difficult to identify the problem because, where there are minor problems, only some kerning pairs are missing. Any suggestion to fix this problem in cross-browsing?<br>
      And what about desktop Apple Safari? Why doesn't it render kerning pairs?</p>
      <p>Thank you in advance for your attention!<br>
      Filippo</p>
