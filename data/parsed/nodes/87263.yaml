    html: |-
      <p>From the CSS:</p>
      <p>html, body { font: normal 35px menlo,'andale mono','courier new',sans-serif; line-height: 155%; }</p>
      <p>So it depends on whether you're viewing on a newer Mac or not. If so, Menlo. If not, Andale Mono. That's one reason we always prefer screenshots :)</p>
