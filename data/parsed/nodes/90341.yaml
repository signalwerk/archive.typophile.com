      <p>I guess I would wonder why a person would assume that font metrics from one font would work well for any font? Even if they were similar in style and proportion, I don't think I could trust the data to be correct.<br>
      I can understand looking at a few basic relationships of sidebearings to try to get a certain fit and color as a starting point but a wholesale lift from someone else just makes me very uncomfortable.  Not just for the property rights and honesty issues but just for the assumption that it would work to my liking. Even if Frutiger or Carter had come up with the original, I just could not assume that the outcome would be as good with some other set of outlines.</p>
