      <p>Hrant, that works the other way around. The purpose of it is to <em>exactly</em> match the original font metrics <em>as</em> a temporary workaround until the original font shows up again.</p>
      <p>The glyphs themselves get expanded and compressed beyond recognition--but they are in this case <em>less</em> important than keeping the correct spacing and word count.</p>
      <p>Adobe pulls off this trick by requiring that if a font is not allowed to be embedded, at least its metrics should.</p>
