      <p><em>So, is that an extra legal barrier?</em></p>
      <p>I didn't consider the legality of reproducing OT features, I was more thinking that it would be a design barrier ;) The more restrictions you have, the less you can diverge from the »original« design. For example, if OpenType substitutions occur that replace glyphs by other glyphs which have different metrics. You would have to emulate this behaviour exactly to avoid reflow.</p>
