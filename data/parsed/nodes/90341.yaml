    html: |-
      <p><em>Again: the central point of copying metrics is to replace the other font in typesetting.</em></p>
      <p>But how far do you go?</p>
      <p>If you have a specific target, it sounds viable. For example, replacing Arial with a custom font in a company's Word templates. (I believe there is a set of fonts in the DBType family that does exactly that.) You could be pretty sure that kerning isn't used, so keeping the horizontal glyph metrics (and vertical font metrics!) should be enough.</p>
      <p>If you're targeting InDesign, you need to take into account kerning and other OpenType features that are on by default (ligatures, contextual alternates).</p>
      <p>There can be some glyphs that severely limit your choices when you want to stay compatible. For example, an uppercase I with serifs in a sans face (e.g. Verdana). You just can't make it sans-serif and keep the advance width the same.</p>
      <p>On a side note, in the IBM Selectric Composer the characters were proportionally spaced, but every letter had to have the exact same width in all fonts! Frutiger notes in his big book that he had to compromise on his Univers adaptation because the engineers had chosen a Renaissance face as their model for the character widths. E.g. the s in the Composer Univers looks much too narrow.</p>
