      <p>A font has to be terribly close to an existing font to be able to use the same metrics, kerning, etc. However, I can see the point of temporarily using another font's metrics (and all the rest) when testing it during the design process, instead of constantly having to adjust the spacing and kerning as you change the glyphs. Furthermore, if the fonts are similar, I wouldn't mind at all if someone just took another fonts metrics and changed them a bit to fit his/her own font. It's more efficient in some cases and you can hardly call metrics intellectual property, right?</p>
      <p>Nick, just out of curiosity, does  Brown Gothic have a double story /g/ as well?</p>
