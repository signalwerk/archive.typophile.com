      <p>Since the question of two typefaces different in style, but designed to have the same metrics, has come up, I thought I might remind people of the IBM Selectric Composer, where faces designed to resemble Bembo, Times Roman, Optima, Century Schoolbook and Garamond, among others, all used exactly the same metrics.</p>
      <p>Oh, and here's a link to a page from which you can download a book of the typestyles:</p>
