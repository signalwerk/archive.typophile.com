      <p>Looks interesting so far.</p>
      <p>I find that the tail of /U/, along with its narrow opening at the top, makes it look a bit like a Q.</p>
      <p>I'd make the middle stroke of /W/ more pronounced.</p>
      <p>Also, the lower right leg of the /X/ feel oddly smooth to me, compared to the relatively sharp, small, and high frequency notching seen in the other glyphs.</p>
      <p>Anyway that's just my two cents, I'm new to this so all the standard disclaimers apply!</p>
