      <p>Thanks all!</p>
      <p>I did a revision last night and revised the /U/, /X/, and /W/. Also /F/.</p>
      <p>The /I/ is being a real bastard, though. It had started out with serifs, but no matter what I did they either looked awful, or just didn't fit in with the rest, or looked like a /T/, which is how it ended up just being a dagger shape. Right now I just decreased its curve so it's less intrusive on other letters.</p>
      <p>I whipped out an alternate W as well, which is in the bottom half of the screencap.</p>
