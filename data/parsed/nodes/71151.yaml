    <p>Hello everybody,</p>
    <p>I finished a draft of capital letters for my first font, Xiphactinus. </p>
    <p>It's intended as a display font for comic titles, specifically prehistoric or pirate themed ones (you know, The Land of the Lost Before Time That Time Forgot, with cavegirls and giant gorillas and stranded adventurers and such). It's inspired by several genre works, especially the works of William Stout. I included a few screencaps of those typefaces underneath mine.</p>
    <p>The lower case will be just small caps. I did the name in FontCreator to show what I'm going for, although I haven't braved sidebearings and kerning yet. </p>
    <p>Thanks for your help!</p>
