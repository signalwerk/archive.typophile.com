    html: |-
      <p>OEM = Original Equipment Manufacturer, so usually you'll see ISV (Independent Software Vendor) do describe companies like Microsoft and Adobe who include fonts with their software products. An OEM license might be appropriate to say someone making a GPS, a set top box or a phone. </p>
      <p>Sublicensing gives the licensee rights to further license. So for example you could license your font to a foundry giving them sub license rights to license the fonts to other people or companies. </p>
      <p>For a Web license the typical differentiator is the customer's right to host the font on a web server in a variety of formats. </p>
      <p>For games and apps you'd be looking at an ISV license, unless your standard license provides these rights.</p>
