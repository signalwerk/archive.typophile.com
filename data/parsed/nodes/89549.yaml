    <p>Can anyone explain this muck? Okay, What I think I know...</p>
    <p>OEM - An OEM license covers sales to users who are including a font as part of a package deal. The fonts that come with Windows OS and Adobe Illustrator. </p>
    <p>Web License - This license covers use of fonts on web pages. The cost is generally deterined by site hits.(?)</p>
    <p>Standard License - This is for general usage based on users at one location. </p>
    <p>What is sub licensing. What license covers phone apps and video games. </p>
    <p>Any help unraveling this confusion would be greatly appreciated.</p>
    <p>James</p>
