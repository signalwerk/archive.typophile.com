  html: |-
    <p>Happy President's Day! </p>
    <p>My "<a class="freelinking external" href="http://dailypangram.tumblr.com/" rel="nofollow">Daily Pangram</a>" blog is featuring a pangram about a different U.S. President every day of this month. Some of my favorites so far:</p>
    <p>* Roosevelt’s major buzzword: “Square Deal.” His maxim: “Speak softly and carry a big stick.”</p>
    <p>* Informed that Prez Calvin expired, a big jokester queried “how can they tell?”</p>
    <p>* Prez Hoover is acknowledged as a jerky executive, but his dam is quite fab.</p>
    <p>* On jaunty Franklin’s watch, government’s size expanded quite a bit.</p>
    <p>* Before quitting the prez job, Ike reviewed the military-industrial complex.</p>
    <p>* Defying the Soviets in a Berlin square, Prez JFK exclaimed he was a donut.</p>
    <p>* Prez Richard M. Nixon requests you avoid talking about JFK &amp; Watergate.</p>
