    html: <p>Here's <a class="freelinking external" href="http://www.youtube.com/watch?v=Iv69kB_e9KY" rel="nofollow">another good letterpress video</a>, featuring my fellow Cornellian John Kristensen of Boston's Firefly Press. The Press isn't in Somerville anymore, and the "apprentice" in the video is now the Book Arts Program Director at Wellesley College, but it's still a brilliant ode to letterpress.</p>
