    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CyrWkEnd_2012_Logo_Red_4079.gif"></div>Type Directors Club has posted an announcement of <em><a href="http://www.tdc.org/archives/4147/" rel="nofollow">TDC Non-Latin Weekends</a></em>, a series of professional seminars and workshops on non-Latin type design.<p></p>
    <dl>The first seminar in the series of four will address the problems related to the design of Cyrillic typefaces. It is scheduled to take place from Friday, March 2 to Sunday, March 4, 2012. Reservations to <em>TDC Cyrillic Week-End</em> are now open. Seating is limited.</dl>
    <dl>A similar series of seminars was offered by TDC five years ago. Detailed information on <em>TDC Cyrillic Week-End 2007</em> is available on the Type Directors Club’s <a href="http://www.tdc.org/events/education/non-latinweek-ends/2007nonlatzhukovcyrillic.html" rel="nofollow">Web site</a>. It was also discussed on <a href="http://typophile.com/node/31986" rel="nofollow">Typophile.com</a>. Photographs of Cyrillic classes taken by Adam Twardoch can be found <a href="http://www.flickr.com/photos/adamt/sets/72157594570229703/with/410731168/" rel="nofollow">here</a>.</dl>
