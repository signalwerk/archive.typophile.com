    <p>On Sale now at Creative Market: <a href="https://creativemarket.com/Borgeslettering/56658-Old-Stock-Adobe-Illustrator-Actions" title="https://creativemarket.com/Borgeslettering/56658-Old-Stock-Adobe-Illustrator-Actions">https://creativemarket.com/Borgeslettering/56658-Old-Stock-Adobe-Illustr...</a><br>
    If you are a Graphic or Type Designer you may be interested in these actions I wrote for Adobe Illustrator.</p>
    <p>Graphic Designers will benefit from the ease of use of Old Stocks Actions. Complex effects can be effortlessly produced in record time. This offers the Graphic Designer a wide array of effects for their logos and layouts.</p>
    <p>Type Designers- Type Designers can use Old Stock's Actions to add drop shadows and fills to their new or existing typefaces. Every Action is vectorized and separated for ease of use. Old Stock does all of the hard work for you!</p>
    <p>For the Type Designer you can use the actions to create stackable versions of your fonts (Graphic Designers can use these for their logos). The sample below consists of 4 fonts. The base font, a solid drop shadow, diagonal line drop shadow and a fill all made using Old Stock.</p><div class="imageWrap"><img src="http://typophile.com/files/K_5636.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Cover_5563.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Sample-1_5818.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Sample-2-good_4649.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Sample-3_6441.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Sample-4-reset_3488.png"></div><br>
    Thanks for looking :)<p></p>
