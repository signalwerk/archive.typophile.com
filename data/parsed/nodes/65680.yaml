      <p>There are many more of these, some starting with J, and they are almost every variation you can imagine. In addition, Photo-Lettering had many styles that seem to be extremely similar, with completely different names. Arctic seems quite close, but nothing I saw was absolutely identical. It's possible that custom lettering was done for them by one of the lettering artists who did these similar film types.</p>
      <p>- Mike Yanega</p>
