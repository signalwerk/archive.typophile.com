      <p>I have a German book of Script Types and it shows a range of A-named fonts, including Arctic, which are all very similar. The variations are in stroke thickness, width and slant. You can see small samples of many of them in the Solotype Catalog (p.88 and 89). I am trying to compare your images to these two sources.</p>
      <p>- Mike Yanega</p>
