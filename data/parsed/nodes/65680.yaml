    html: |-
      <p>The time period is during the film type era, and many of the film types were drawn freehand by lettering artists (without drawing instruments, that is). Of digital fonts I would say Arctic2, by Sam Wang is the closest I could find. URW has digitized a number of similar scripts, but in different weights, such as Arab Brushstroke, Contemporary Brush, <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/april/" rel="nofollow">April</a> (which is a lot like Arctic, but condensed), and Amber (which is like a bold April). I think these all were originally Filmotype typefaces.</p>
      <p>(I didn't link all of these, since most of them are less like your sample)</p>
      <p>- Mike Yanega</p>
    html_clean: |-
