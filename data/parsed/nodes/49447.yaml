    html: '<p>This is hand lettered as most signs from that era would be. Ideas for emulating the sans lettering: <a href="http://www.fontshop.com/fonts/singles/monotype/monotype_grotesque_by_adobe_std_bold/?sample_text=PASSENGERS%20ARE%20ALLOWED&amp;sample_size=24" rel="nofollow">Monotype Grotesque</a>, <a href="http://www.fontshop.com/fonts/singles/elsner_flake/granby_bold/?sample_text=PASSENGERS%20ARE%20ALLOWED&amp;sample_size=32" rel="nofollow">Granby</a>, <a href="http://www.fontshop.com/fonts/singles/device_fonts/ministry_bold/?sample_text=PASSENGERS%20ARE%20ALLOWED&amp;sample_size=32" rel="nofollow">Ministry</a>, <a href="http://www.fontshop.com/fonts/singles/p22/p22_underground_demi/?sample_text=PASSENGERS%20ARE%20ALLOWED&amp;sample_size=32" rel="nofollow">P22 Underground</a></p>'
