    <p>Hello all,</p>
    <p>I'm trying to identify two typefaces from an admittedly poor sample.  This is a signboard from a British ocean liner circa 1910-1920.  The first line is a rather distinctive decorative font.</p>
    <p><a href="http://typophile.com/files/fontnotice.jpg" title="http://typophile.com/files/fontnotice.jpg">http://typophile.com/files/fontnotice.jpg</a></p>
    <p>Your help is greatly appreciated.</p>
    <p>Best regards,<br>
       Ralph</p>
