      <p>Vicke,<br>
      I live in the Washington DC area.  The city was an overall plan designed from scratch and so was the Metro (subway system).  New York was a pioneering city that took on the task "after-the-fact" and dealt with unimaginable differences of opinion and perspective.  While the DC Metro is wonderful, it is nowhere near as convenient as the NYC Subway. The answer "you can't get there from here" is often heard when asking for metro directions in DC.  NYC Subway may be old and take some learning but you can always "get there". Because of its history, updates to signage is more complicated than it would be here in DC for example. The saving grace of NYC is its people. Contrary to what you may have heard about Big Apple coldness, the people who live here gladly help you with directions. Also, The NYC Police are always around and are very good at directions.</p>
