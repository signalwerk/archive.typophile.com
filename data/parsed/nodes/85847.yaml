      <p>I love this thread. Thank you to the NewYorkians here participating.</p>
      <p>I lived and worked in DC for three months and have to say being used to European cities, I find, although DC is almost all regards totally untypical for the US (east-coast, city-planning, building heights), already here the negative effects of sprawl are plainly obvious. I loved my DC experience, but hated the public transport there. Maybe part of it was the bad exchange rate and the price increase for the Metro right when I arrived ;) . (That brings me to the question: how do you punctuate and use parenthesis in combination with emoticons?)</p>
      <p>European cities are just much more condensed, in a comfortable way however, as size-maximizing is not the ultimate goal over here. </p>
      <p>In contrast to that, I have to say I absolutely love New York!</p>
