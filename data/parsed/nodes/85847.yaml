    <p>So I haven't been fortunate enough to be able to travel to New York yet but wonder if there is anyone here to enlighten me. Since Helvetica was implemented in 1989 as the official typeface for the system, how well is it faring now? Does it still have to compete with the mosaic tiled lettering of old or any other old enamel signed remnants of the past, or is it fairly well implemented and governed now that it's a much more coherent system? </p>
    <p>Thanks, all contribution and discussion on the matter welcome.</p>
