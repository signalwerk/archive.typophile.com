      <p>Long-time New Yorkers still refer to IRT IND and BMT.<br>
      Until the system is completely overhauled (which will never happen) those long-dead transport companies still influence the way stations and signage look and feel.</p>
      <p>If you want to examine a completely coherent US system look at the Washington DC Metro. Designed and implemented as a single system, it does work well, although it is a bit dark in places.</p>
