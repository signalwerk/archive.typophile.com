    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 3.Nov.2004 9.11am </div>
      <p><img src="http://www.typophile.com/forums/messages/72/52732.jpg" alt="logo of the conference"> <br> <br>FROM: Nathalie fallaha <br>RE: TYPO.GRAPHIC.BEIRUT 2005 conference <br> <br>We, at the Lebanese American University (LAU) in Beirut, Lebanon,  <br>are holding a graphic design and typography conference;  <br>TYPO.GRAPHIC.BEIRUT, from April the 14th till April the 16th 2005. <br> <br> <br>This is the CALL FOR PAPERS for the TYPO.GRAPHICS.BEIRUT conference 14th, 15th &amp; 16th of April 2005 Lebanese American University Beirut, Lebanon <br> <br>CONFERENCE THEME: <br> <br>This 3-day conference will be the first ever major graphic design event of its kind to be held in the Middle East. It will focus on various issues pertaining to typography and graphic design, such as:  <br> <br>*    design in a multi-lingual environment <br>*    socially responsible design <br>*    design history <br>*    graphic design and technology <br>*    visual communication in a global age <br>*    typeface design <br>*    moving type <br> <br> <br>Please note that the topics won't be limited to the categories listed above. <br> <br>TYPO.GRAPHIC.BEIRUT 2005 conference aims to provide a platform for students, professionals and graphic design educators from the region and the wider international range, to exchange new views and ideas. <br> <br>We are hoping to have participants and attendees from around 20 countries. Speakers include so far: Ken Garland, Gerry Leonidas, Huda Smishuijzen AbiFares, Reza Abedini, Nadine Chahine and many more. <br> <br>REGISTRATION: <br> <br>Attendance is free of charge, participants are required to register online through the conference website. <br> <br>TRAVEL AND ACCOMMODATION: <br> <br>Assistance will be provided for entry visas to Lebanon, reception at Beirut International Airport and hotel reservations. Special rates will be a</p>
