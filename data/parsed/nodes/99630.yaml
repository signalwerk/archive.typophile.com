  html: |-
    <p>Hi! I need help identifying a font that used to show up on a lot of record labels in the early to mid 60s (Roulette and London, for instance). Somebody told me it was Bell Gothic, but I'm not totally convinced; the numerals (especially the 3 and 8) are too unique (see pictures). Any help you can give will be greatly appreciated! </p>
    <p>Thanks!<br>
    furrball</p>
