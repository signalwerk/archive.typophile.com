    date: 2013-01-14T03:26:00
    date_raw: 14 Jan 2013 — 3:26am
    votes: null
    html: <p>No, I don't think it's Bell. The unusual appearances of the /3 and especially the /8 (where the top loop is not closed, but rather, for lack of a better word, untied) just don't look like Bell to me, and I've seen this font on enough old record labels to know. (Of course, we are talking the 60's, so maybe Bell Gothic was changed since then...)</p>
