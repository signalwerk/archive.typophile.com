    html: <p>That looks definitely to Bell Gothic to me. You could also switch to <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/griffith-gothic/" rel="nofollow">Griffith Gothic</a>, "revival of the 1937 Mergenthaler original, redrawn as the house sans for Fast Company." BTW, I don't understand why you're not convinced especially for /3 and /8, because, part of the artefacts probably due to time and bad scanning, they look the same.</p>
