    <p>Hi,</p>
    <p>when I try to make Mac TrueType fonts out of FontLab, the diacritic letters get all mixed up. The standard alphabet stays where it belongs, but all the letters with umlauts are in strange slots. The unicodes for the letters are right, but something like the codepage or encoding settings must be wrong. I just can't figure out where and how to set them correctly. </p>
    <p>Attached is a picture of the prefernce settings the way I have them right now. Is there something in this panel that needs to be changed?</p>
    <p>Also, does anyone know of a PDF or website where all the different FL settings are shown for producing any kind of font format out of FL? Something as nice as the KLTF documents on font naming.</p>
    <p>Thanks for any advice.<br>
    Henning</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/settings_4630.jpg"></div><p></p>
