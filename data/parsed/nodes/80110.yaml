    html: |-
      <p>"Use following codepage for first 256 glyphs" must be set to "Do not reencode first 256 characters". </p>
      <p>This option remaps the Unicode codepoints of the Windows 1252 codepage to something else (in you case, MacOS Roman), which results in a font that is not fully Unicode-compliant. Settings other than "Do not reencode" in this option are only for users who need to make custom-encoded TrueType fonts that should work with VERY old non-Unicode applications (such as, say, Adobe PageMaker 6.5 or Illustrator 7). </p>
      <p>A.</p>
