  html: |-
    <p>This is a logo I am working on for a literary conference. It is heavily type based because the inspiration comes from the opening spread of James Joyce's Ulysses. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JOYCE-S-logo-bag-ID_4087.png"></div><p></p>
    <p>Please note 2 things: </p>
    <p>1. I probably will not be able to make any drastic changes because we are coming down to the wire and we have gone through a lot to arrive at this concept.</p>
    <p>2. The concept is based on the original spread, but I have taken creative license in an attempt to help the concept work as a logo.</p>
    <p>That having been said, any feedback is greatly appreciated.</p>
    <p>Thank you in advance,</p>
    <p>Duncan</p>
