      <p>Your J seems a little flat at the base, emphasised in your second iteration by the text placed under it. My inclination for your first post would be to move the text up so that the fourth line lines up with the base of the J. I think the lack of asterisk in the second one is better, because that line looked a little spotty with the punctuation. I think it is worth adjusting the leading slightly.</p>
      <p>Tim</p>
