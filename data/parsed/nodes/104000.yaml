  html: <p>Indonesia yesterday accused Singapore of acting "like a child" over choking smog from forest fires in Sumatra that has triggered the city-state's worst environmental crisis in more than a decade. The escalation in tensions between tiny Singapore and its vast neighbour came as haze levels enveloping the island hit a record high, shrouding the whole city. The city-state ratcheted up pressure on Jakarta to take "definitive action" to extinguish the fires - but Indonesia, which insists that Singapore-owned plantations on Sumatra also share the blame, hit back.</p>
