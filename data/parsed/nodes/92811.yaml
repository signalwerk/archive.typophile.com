  html: |-
    <p>In the process of designing a typeface, I'm wondering if it's worth the effort to design glyphs for currencies that are not in use anymore, like pesetas and francs. I realize the symbols might still be in use for historical reasons, but in a display face, I think it's rather unlikely.</p>
    <p>How do you guys do? What do you think?</p>
