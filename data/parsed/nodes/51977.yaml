      <p>I did see that, part of it went with the type of descender used (I asked a question on that a while back because only some times it seems like the descenders are contrasting and if there was a logic or to whether it got a right-sided-, left-sighted-, spiked-, or cedilla- style descender though it seems like no one really knew) </p>
      <p>And yeah I know they’re not used.  But, I’m trying to be complete, since I’m one of the freaks who uses the odd character that tends to never be available I figure I might as well make sure it doesn’t happen to anyone with my font.  (and of course the standard “learning experience” from it all :) )</p>
      <p>Although rereading over the errata, while it mentions that some are changes due to current taste (the e with the tag and descender thingy) and others due to style consistency (uk lig), the broad omega changed but I’m not sure what the reason is for it.... the beautiful omega keeps the old open style while the others have changed to the W style.  Is the open style wrong or is it simply a readjestment for stylistic purposes?</p>
      <p>I guess I can just go ahead and make guesses and post the results ... for most I suppose I’ll just do them inclined with the more italic style curved terminals etc and see how that works.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
