    <p>Continuing my policy of NLLB I’m working on adding in italics for Coruña in the Cyrillic block.  I’ve already finished the standard cyrillic but I’m stumped on whether there are changes in the italic forms for certain older letters and if so what they might be.  </p>
    <p>For instance, the yat while normally looking like a b with a bar, turns into a shape more like an n with a loop.</p>
    <p>I figure many might not have changes, but since Cyrillic has some of the large changes like Latin best to check with the experts.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/38807" class="topic-previous" title="Go to previous forum topic">‹ Arabic Fonts</a> <a href="/node/51976" class="topic-next" title="Go to next forum topic">What kind of type style are these logos? ›</a></div>
