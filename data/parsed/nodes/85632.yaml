    <p>I assume that the typography is governed by different rules than calligraphy, and that the Arabic writing allows some flexibility and individuality. I observe that some of contemporary typefaces consist of elements of different historical sources, and I find it natural. But I would like to know the answer (or at least your opinions):<br>
    How is combining (of calligraphic styles, adapting solutions from one style to a typeface based on another, or [stronger] modification of certain shapes) percieved by native  readers or those familiar with Arabic script?</p>
