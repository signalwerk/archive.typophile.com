      <p>Thank you both.</p>
      <p>I had to analyze the basics of five calligraphic styles, to understand (at least superficially) the nature of Arabic script. And finally chose Roqah as a guideline for the future font. It's characteristic compression of forms seemed to correspond with my idea of reaching some highly expressive, biomorfic movement - with the minimum amount of resources. At the stage of reconciling the demands of the style, formal idea and the "readability in the eyes of Pole", I started to be in doubt as to whether introducing some new issues, doesn't look eclectic (like, say, cursive Blackletter in Latin). </p>
      <p>Nadine, I will think for some time about what you wrote; thank you.</p>
