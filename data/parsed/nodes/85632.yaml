      <p>Though easiest on the eye + smoothest in hand (maximum speed of movement?),<br>
      it is the most challenging to design because its letters go on piling, and consequently — in contrary to a boatload in water—, it is the baseline (surface of water) that has to be moved up and down, necessitating uneven line spacings.<br>
      -<br>
      That's why it is used for boatload headlines but never for text.<br><a href="http://typophile.com/node/84552">http://typophile.com/node/84552</a></p>
