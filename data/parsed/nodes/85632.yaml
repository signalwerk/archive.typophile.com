      <p><em>This style is extremally difficult, indeed. I had chosen it as an inspiration, rather than as a guideline, as I wrote... I am not able to manage it.</em></p>
      <p>But I would like to put my concerns aside, and ask another question, which is a part of my problem:</p>
      <p>In a simplified typeface, both words - النجوى and الفحوى - have the same form of Jeem and Hah. This situation is self-explanatory. But how would the possible introduction of stylistic alternates change the perception of the typeface? Is it more "human" then or more readable? I can learn some technical rules, but I can't get the insight, to understand them...</p>
