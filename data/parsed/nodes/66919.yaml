    html: |-
      <p>I like very much this typeface since it was released as Quadratta. Its horizontal colour and the gliphs design are very readable. Hope you could improve even more the family with a bold italic style in a near future.</p>
      <p>I think the upper C-cedilla has the diacritic positioned too much to left. The ligatures for ll and ch are very interesting. Do you know if is there some historical usage of these ligatures in Spanish? In Portuguese the ch is common but I never saw a ligature for it.</p>
      <p>(I'd like to write in Spanish as you are from Uruguay and I live very near, in Porto Alegre, but preferred to use English due to other users.)</p>
