    html: <p>I apologize if my comment was too accusatory, I can see how it could be interpreted that way. Without seeing the actual work you have done, and since you were asking for the name of such a design style, my mind went right to the hipster branding site that I came across recently. It is an interesting question to ask "what makes these designs 'hipster'?" I am not exactly sure myself, but I do get a sense of the style and feel that seems trendy. The image I posted seems like it was a bit confusing too. It reads "THIS IS the neue This." An attempt to show the Helvetica trend replaced by the left hand style. I didn't make the graphic, I just found it and thought it illustrated what I was trying to say. Hopefully I was still able to be helpful and provide some food for thought at the very least!</p>
