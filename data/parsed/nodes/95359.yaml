      <p>There was mention of title page designs earlier on in this thread. In the event you're still digging for possible inspiration, or you're just itching for a jolly good read on the subject, I'd recommend, <strong>"The practice of typography; a treatise on title-pages, with numerous illustrations in facsimile and some observations on the early and recent printing of books (1902)"</strong> by Theodore De Vinne: <a class="freelinking external" href="http://archive.org/details/practicetypogra02vinngoog" rel="nofollow">http://archive.org/details/practicetypogra02vinngoog</a></p>
      <p>It's a title you can choke on, but the book covers historical practises and how they became standard conventions; plus there's a turn-of-the-century plea for rational thought and a push for simplicity when typesetting those longer titles!</p>
