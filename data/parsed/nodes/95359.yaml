    html: |-
      <p>You have combined two treatments.</p>
      <p>One is what I have always considered to be the “title page” technique of breaking down a sentence into phrases/components which are given dramatically contrasting settings.<br>
      This does indeed appear to be quite popular now in all-type posters with clever/inspirational messages.<br>
      (These need not be symmetrical.)<br>
      I call the style “title page” because I believe that is where it originated, before becoming prevalent in posters and advertisements in the early 19th century.<br>
      Although “title page” is not a generic term, “tombstone” <em>is</em> a category I’m familiar with; I came across it early in my career in advertising, when symmetry was frowned upon as being dull, old-fashioned and unimaginative.</p>
      <p>The other is the escutcheon/cartouche/label, which is not a free-standing item, but generally adorns an object as a logo or label, and has a roundness which often informs the disposition of type and lettering on curved paths.</p>
      <p>As Joshua notes, there is also the dimension of “class”, which relates to the type styles used, more than the layout.</p>
