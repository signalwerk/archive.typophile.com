    <p>I’m beginning to suspect that this font is “hand drawn” (for what it’s worth, heh), but if anyone can identify it, it would be a great help.</p>
    <p>We had a graphic design firm do a logo for us originally, (who have since gone out of business) and they provided practically everything BUT the font to us.</p>
    <p>It bears a close resemblance to OCR A and OCR A II, but as you can see it’s not quite right.</p>
    <p>Please help!</p>
