  html: "<p>Thought I'd spread the word, courtesy of a release from Mr Harrison: <br> <br>--- <br>Free FontLab Update - both Windows and Mac <br> <br>Version 4.6 enhances GUI and adds workflow improvements <br> <br>     Fontlab Ltd. announces a new update to it's flagship product,  <br>FontLab 4. This new version is a free update from v4.5 and includes  <br>many bug fixes and GUI enhancements. In addition there has been a lot  <br>of improvement of the workflow features to increase efficiency and  <br>ease-of-use in a production environment. <br>     Changes include: <br>* An updated UI with expandable Properties panel, improved  <br>Transformations (applicable to font and metrics windows) and many less  <br>visible refinements. <br>* Two versions of the UI: when FL4.6 is run for the first time there is  <br>a choice to run it with the standard FL UI or with a simplified version  <br>with fewer toolbars and controls (this is Windows-only at present). <br>* Improved drawing: the drawing pen now has some AI features and  <br>appearance, so people who work in AI will feel more comfortable in FL. <br>* MM TT: It is now possible to convert a T1 MM font into TT outlines  <br>without damaging the MM structures. Users can then hint the MM TT font  <br>and apply TT hints to the intermediate designs. This makes it possible  <br>to use one set of hints for a multiple-weight family and can save a lot  <br>of time. <br>* Font blending is much improved and now includes automatic blending of  <br>composites and hints. This really speeds up the process of extending a  <br>font family. <br>* Users can now automatically generate a basic set of OT features for a  <br>simple T1 font. This makes T1-&gt;OTF conversion easier. <br>* Level 2 and Level 3 EPS I/O is supported, so it is much easier to  <br>exchange EPS files with the latest versions of AI. <br> <br>   Updates are free to licensed users of FontLab version 4.5x. Browse  <br>to <a href=\"http://www.fontlab.com/html/updates.html\" target=\"_blank\">www.fontlab.com/html/updates.html</a>. For version 4.0x users the  <br>upgrade is still just US$99 and for FOG and version 3.x users the  <br>upgrade is only US$299: <a href=\"http://www.fontlab.com/html/fontlab.html\" target=\"_blank\">www.fontlab.com/html/fontlab.html</a>. <br> <br>Regards, <br>Ted Harrison <br>FontLab Ltd. <br></p>"
  html_clean: "<p>Thought I'd spread the word, courtesy of a release from Mr Harrison: <br> <br>--- <br>Free FontLab Update - both Windows and Mac <br> <br>Version 4.6 enhances GUI and adds workflow improvements <br> <br>     Fontlab Ltd. announces a new update to it's flagship product,  <br>FontLab 4. This new version is a free update from v4.5 and includes  <br>many bug fixes and GUI enhancements. In addition there has been a lot  <br>of improvement of the workflow features to increase efficiency and  <br>ease-of-use in a production environment. <br>     Changes include: <br>* An updated UI with expandable Properties panel, improved  <br>Transformations (applicable to font and metrics windows) and many less  <br>visible refinements. <br>* Two versions of the UI: when FL4.6 is run for the first time there is  <br>a choice to run it with the standard FL UI or with a simplified version  <br>with fewer toolbars and controls (this is Windows-only at present). <br>* Improved drawing: the drawing pen now has some AI features and  <br>appearance, so people who work in AI will feel more comfortable in FL. <br>* MM TT: It is now possible to convert a T1 MM font into TT outlines  <br>without damaging the MM structures. Users can then hint the MM TT font  <br>and apply TT hints to the intermediate designs. This makes it possible  <br>to use one set of hints for a multiple-weight family and can save a lot  <br>of time. <br>* Font blending is much improved and now includes automatic blending of  <br>composites and hints. This really speeds up the process of extending a  <br>font family. <br>* Users can now automatically generate a basic set of OT features for a  <br>simple T1 font. This makes T1-&gt;OTF conversion easier. <br>* Level 2 and Level 3 EPS I/O is supported, so it is much easier to  <br>exchange EPS files with the latest versions of AI. <br> <br>   Updates are free to licensed users of FontLab version 4.5x. Browse  <br>to <a href=\"http://www.fontlab.com/html/updates.html\" target=\"_blank\" class=\"link-external\">www.fontlab.com/html/updates.html</a>. For version 4.0x users the  <br>upgrade is still just US$99 and for FOG and version 3.x users the  <br>upgrade is only US$299: <a href=\"http://www.fontlab.com/html/fontlab.html\" target=\"_blank\" class=\"link-external\">www.fontlab.com/html/fontlab.html</a>. <br> <br>Regards, <br>Ted Harrison <br>FontLab Ltd. <br></p>"
