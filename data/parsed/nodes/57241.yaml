      <p>Hey, Victor,</p>
      <p>In general, I like the bold look: the grid, the horizontal rows and rules, etc.</p>
      <p>Things I am not so keen about:</p>
      <p>1) I don't know what the custom is in Australia, but in the United States, at least, the word "Résumé" does not usually go on a résumé. This is even recommended in books about job-hunting. (Now, if you are going to keep it in there, I think it's much too big, and using all caps makes it stand out even more. Also, there should be accents on both instances of <strong>e</strong>.) I think it would be better if you gave the large, bold italic treatment to your name and contact info instead, without making the type as big as "RESUME."</p>
      <p>2) IMO, the city and date in the first column of "EXPERIENCE" should be vertically aligned to the top, like the two columns to the right.</p>
      <p>3) I don't like seeing the word breaks in the company names (AKOL Technologies, Avral Technologies). Maybe the type could be a bit smaller, or that column could be a bit wider.</p>
      <p>4) The column of text under "PERSONAL TRAITS" and "INTERESTS" is too wide to be read comfortably. And after the earlier, narrower columns on the first two pages, it's a bit of a jump: you get to page three and don't feel like reading anymore. You might want to split the width into two columns, and maybe even break up the "PERSONAL TRAITS" text into more than one paragraph. Or just shorten the text. Remember, it's a résumé, not a curriculum vitae -- you should try to keep things brief and pique the employer's interest, so that you get an interview.</p>
      <p>5) The white space beneath the rules should always be the same height.</p>
