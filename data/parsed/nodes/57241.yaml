      <p>I second Ricardo's suggestions. </p>
      <p>My observations have more to do with content than design, I recommend changing your Personal Traits and Interests paragraphs and meld them into an "objective" paragraph that first would state the kind of job you are looking for. This can be loose and a little vague, something like: It is my goal to work at a fast-paced design firm that specializes in both print and web design. then segue into "I embrace challenging projects that allow me to push myself creatively while meeting the needs of the client." and so on.</p>
      <p>Prospective employers may not be hiring you for your writing skills but don't let your writing shoot you in the foot either. And so, I would also recommend that you re-write your job descriptions. Almost all them begin with either "I have" or "I was" introduce some variety.</p>
      <p>It's probably a matter of personal preference, but I would only list the software and not the level of proficiency. They may say oh, he's not advanced at Java and not consider you when you truly have the skills required. The specific depth of your skills is probably best left for an interview.</p>
      <p>Finally, (and this may be a cultural thing since life seems to be very relaxed down under) but never tell a someone whom you are hoping will hire you that you enjoy hanging out with friends and having a couple of drinks. Even though almost everyone in the entire world enjoys that (including most bosses). It's unprofessional to put on a resume. </p>
      <p>Best of luck in your search.</p>
