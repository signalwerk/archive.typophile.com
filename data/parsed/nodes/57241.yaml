    <p>greetings, fellow typophiles!</p>
    <p>Today I would like to get some feedback on the design of my resume.</p>
    <p>I was always a big fan of various designs created with helvetica, it seems to make certain design treatments look very good. I am however not a big fan of the typeface, and never use it myself. I particularly hate the lc 'a'.<br>
    So with this resume, I wanted to try and recreate a common helvetica layout without using helvetica. </p>
    <p>The result uses Kris Sowersbys National.</p>
