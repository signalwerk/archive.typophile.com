  html: |-
    <p>You may recognize this as being the First Edition of Moby Dick printed in New York 1851. I am hoping to source typefaces that are from the period that have a very close DNA.</p>
    <p>Monotype Modern seems like a logical relative but I cannot find anything condensed/compressed enough.</p>
    <p>Your help on this is greatly appreciated.</p>
    <p>i-o</p>
    <p>P.S. Please omit the conjunction "OR," from your type identification.</p>
    <p>P.P.S. My apologies if I am not using the word "Transitional" properly.</p>
