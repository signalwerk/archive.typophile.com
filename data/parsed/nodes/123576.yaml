    html: |-
      <div class="comment-spam-body"><p>EDITED--AGAIN:<br>
      The large image shows a product as displayed by church supply houses such as Michigan Church Supply <a href="http://www.michiganchurchsupply.com/-c-100_842.html?sort=3d&amp;page=1" title="http://www.michiganchurchsupply.com/-c-100_842.html?sort=3d&amp;page=1">http://www.michiganchurchsupply.com/-c-100_842.html?sort=3d&amp;page=1</a> I obtained the remaining numbers from that source and combined all numbers into a single number-set. I removed the white on black optical illusion which alters perception of weight and produced the following reference:<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/HymnsetBonW_5092.jpg"></div><br>
      I trust it will be helpful in selecting a substitute font where most letters would be a rough match for the casual reader.<br>
      Octin College Semibold <a href="http://www.myfonts.com/fonts/typodermic/octin-college/" title="http://www.myfonts.com/fonts/typodermic/octin-college/">http://www.myfonts.com/fonts/typodermic/octin-college/</a>  could perhaps be the closest. Too wide, but it has a similar weight and has angles inside the counters. Octin College is the same as Octin Sports [already suggested] but lacks the non-conforming serifs, except on _1_.<br>
      Runner up: Directory Board JNL. It also has a similar weight and, but has rounded rather than angular corners inside the counters.<br>
      Don<p></p>
      </div>
