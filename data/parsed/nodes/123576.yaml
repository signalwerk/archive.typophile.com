      <p>Type made for such boards or marquees doesn’t always have an equivalent in the metal type/phototypesetting/digital type worlds. It most likely had a basis in large wood type of the 19th century.</p>
      <p>I found many similar fonts, but no spot-on matches. For the numbers, Octin Sports is very similar:<br>
      <a href="http://www.myfonts.com/fonts/typodermic/octin-sports/" title="http://www.myfonts.com/fonts/typodermic/octin-sports/">http://www.myfonts.com/fonts/typodermic/octin-sports/</a></p>
