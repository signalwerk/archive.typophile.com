    html: "<p>Brendel Informatik, I have come to learn, digitized quite a few typefaces that are otherwise unavailable digitally. I think that Plakette is a digitization of the Permanent typeface family (the g and, especially, the y are quite distinctive). This is Plakette DemiBold: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/69878.gif\" alt=\"\"> <br> <br>Using and stretching this, I was able to duplicate your 'panic' image. <br> <br>Permanent originally came in more than one weight and <a href=\"http://www.qbf.de/tceng.htm\" target=\"_blank\"> Brendel</a> offers Plakette in five. The only other digital version of Permenent I'm aware of is <a href=\"http://www.myfonts.com/fonts/urw/permanent/\" target=\"_blank\"> URW's</a>. Pre-digital Permanent also used to be offered in versions with and without descenders. URW's offering matches Plakette DemiBold, except that it is without descenders while Plakette is with descenders. <br><br></p>"
    html_clean: "<p>Brendel Informatik, I have come to learn, digitized quite a few typefaces that are otherwise unavailable digitally. I think that Plakette is a digitization of the Permanent typeface family (the g and, especially, the y are quite distinctive). This is Plakette DemiBold: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/69878.gif\" alt=\"\"> <br> <br>Using and stretching this, I was able to duplicate your 'panic' image. <br> <br>Permanent originally came in more than one weight and <a href=\"http://www.qbf.de/tceng.htm\" target=\"_blank\" class=\"link-external\"> Brendel</a> offers Plakette in five. The only other digital version of Permenent I'm aware of is <a href=\"http://www.myfonts.com/fonts/urw/permanent/\" target=\"_blank\" class=\"link-external\"> URW's</a>. Pre-digital Permanent also used to be offered in versions with and without descenders. URW's offering matches Plakette DemiBold, except that it is without descenders while Plakette is with descenders. <br><br></p>"
