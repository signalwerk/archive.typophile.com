    <p>Hello out there!</p>
    <p>I recently made a typedesign and try to make it work for text.<br>
    I am quite satisfied with the spaces for now even though I know there is much much room for improving.<br>
    Yet what strucks me most is how bad it works on screen (and also in small sizes printed I assume).<br>
    In certain size letters begin to jump up and down the lines. A disaster.<br>
    I know this is a thing to be solved with the hinting tool.<br>
    Yet, I have to admit I never learned how to use it correctly.<br>
    I tried to do something in all charactes similar to the u I show here. Obviously I tried to keep values equal.<br>
    I suppose I have to add other hinting lines that prevent the characters from changing sizes in a vertical direction.<br>
    Is this true and if so how is it to be made?<br>
    Anyone there eager to help me with this prob?</p>
    <p>Salute<br>
    Stefan</p>
