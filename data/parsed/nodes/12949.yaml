      <p>We only managed to shed http:// not so long ago.</p>
      <p>You'll be surprised when designing to reach the masses (eg for internet banking, govt sites, etc), you have to be very explicit. </p>
      <p>I don't know how old everyone else is, but I always use my parents as a gauge. They're not internet saavy at all. If my target audience include people like them, I feel I have to include www, just to make it that much more obvious that it's a website, not anything else.</p>
      <p>There are all kinds of confused people out there. Once I saw an email address like this <a href="mailto:email@www.domain.com">email@www.domain.com</a>.</p>
      <p>And another time, in a test, where we ask people to guess where clicking on each button will bring them. This nice lady said, "If I click here, I will get articles on home and cooking, etc..." It was the HOME button!</p>
    html_clean: |-
