    html: |-
      <p>I have a fascination with thresholds. You know those mini ketchup and mustard bottles, the ones that are short &amp; stout, with [relatively] very wide openings? Well, is such a container a bottle, or a jar? How short/shallow does the neck have to be before a bottle is actually a jar? And who decides, how? And if this sort of thing can be determined empirically, over how long a period would such a determination stay valid (within the confines of the margin of error of the experiment), considering that mindsets and terminology change over the generations, or even within one person over his lifetime? And all this applies to glyphs too: Can we design a glyph that people simply won't be able to decide if it's a "u" or a "v"? Some people will quickly be sure; others will refuse to make a determination. I think most people would deliberate about it, then eventually decide (if only because they're asked to). Now, there must be a 50-50 threshold, but would the bell curve be spiky enough to justify the time spent finding it? And most of all: how can such ambivalent glyphs be useful, I mean in the practical realm of communication? Can they say two things at once, or maybe say nothing, and as a result convey something fundamental about the human condition? Gorgias was right, really - to hell with my SMC philo teacher, historical-revisioning that he killed himself in a confused stupor (while in fact he retired to horticulture, like Sumner Stone), doubtless to give his own narrow existence less insignificance.</p>
      <p>hhp</p>
