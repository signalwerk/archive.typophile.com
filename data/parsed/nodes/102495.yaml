    <p>“Kamenica” - named after a beautiful small mountain river in Serbia - is a font family containing 3 weights: Light, Regular and Bold.</p>
    <p>The Kamenica river is only a few meters wide. Mostly shallow and cold, clear and green, it was the direct inspiration source for the creation of this condensed typeface. As our other typefaces, “Kamenica” also combines traditional shapes with modern forms, tall x-height and a collection of more than 300 glyphs. </p>
    <p>Comparing the river with the font, we could say that letters are the fishes that lives in the Kamenica river and that the font weights are the seasons in which this river shows most of its own character.</p>
    <p>Find out more at: <a class="freelinking external" href="http://www.tourdefonts.com/font-catalog/kamenica/" rel="nofollow">http://www.tourdefonts.com/font-catalog/kamenica/</a></p>
