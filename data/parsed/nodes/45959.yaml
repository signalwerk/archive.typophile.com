    html: <p>It does seem like type has a cycle of excitement over novelty and distinctive voice and then a return to core values and around again as the core values start to feel too staid. But the cycle may be disrupted now. Or the cycles may be getting closer &amp; closer so that you just have near simultaneous activity in several directions. This whole "decorative" cycle has lasted a remarkably long time! Simultanaity may have the effect of extending the life of all trends by ensuring that the point of over-exposure takes longer to get to. And yes, this is all just theoretical waffle just barely related to the topic.</p>
