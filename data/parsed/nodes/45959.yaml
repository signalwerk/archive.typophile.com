      <p>I think someone hit a nerve, but I don't think David intended to be disdainful to Rudy, Zuzana &amp;c. I'm a huge Emigre fanboy (proud owner of an Emigre tshirt-in Dogma no less), but that doesn't mean we can't offer some criticism. I prefer to think of Emigre's types as fashionable. Imagine what the clothes from high-fashion designers from Paris, Milan and New York were making in the late 80s and early 90s. Emigre was kind of the place where typefaces were rethought, and the result was a lot of experimental type designs. Some were successful in the short run, some not at all, and some that I don't think that I could work without. I'm actually starting to lean towards Mrs Eaves being sort of fad-y.</p>
