      <p>@David:</p>
      <p>Au Bon Pain uses Dalliance effectively, I've seen missionary used quite well in fashion magazines, and I think I'd have to outright disagree on Matrix II, Los Feliz, Eidetic, Council, and especially Priori (although <a href="https://web.archive.org/web/20150123061338/http://virusfonts.com/" rel="nofollow">Barnbrook's work</a> can be equally hit or miss). I also don't mind the caps for Ottomat, but that's pushing it. I don't think Poppi even qualifies,  I think it looks rather modern myself.</p>
      <p>There is a case to be made for a lot of the others; remedy looks like the paying man's Party LET. Most of the ones that you and I agree on were made more than ten years ago.</p>
      <p>Once again though, Filosofia, Mrs Eaves, Tarzana, Vista, &amp;c seem to be their recent breadwinners, so I'd count on Emigre producing those more-so than something like lunatix. I feel as if Emigre has done well recently distancing themselves from trendy/fad-y themes.</p>
