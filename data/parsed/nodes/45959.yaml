      <p>I recently purchased Matrix II Book to use in a contest entry that never got submitted because I got busy with other stuff. I’ll probably end up using it at some point, but very carefully, because any time I see it lately it’s on some low-budget ad or sign and looks dreadfully awful. </p>
      <p>As for the 1990s fonts, I wouldn’t go anywhere near them. Sometimes I use the Brody stuff from that era, but the wacky Emigre types are just horrid. Like the magazine they did a great job of inspiring importan discourse about typography, but like the magazine, no sane person wants to try reading them today.</p>
