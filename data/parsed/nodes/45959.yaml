      <p>Hey Zato, welcome back and congrats on your second post.</p>
      <p>- For me, "top of the hype" means "trendy, successful". sorry if it's not the actual meaning, english is not my mothertongue. doin' my best. looking back at the sentence, it was quite obvious, though.</p>
      <p>- When something is overused, it pays the price of success: well, yes, it's sad but true. when a talented artist makes something which totally fits its era and is overused, it gets so much associated with it that on the day the fashion changes, the work (in this case, a typeface) follows the path to oblivion and shame. You think i'm wrong? well, cooper black was "top of the hype" in 1968, and it was the synonym of cheap in 2000. brody was "top of the hype" in 1987, and you can hardly find one of his types in use today. 90% of aldo novarese's types are unavailable on a digital format today, because nobody wants them; even though he was a great artist, his types were so much used in the sixties and seventies that they are now "paying the price". it's very sad, yes; it is as sad as admitting that it's hard for me today to use typefaces i really, really loved, such as dogma or triplex, but it's a fact.</p>
