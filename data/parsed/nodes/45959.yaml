      <p>Some of their faces look dated, but they don't even have all the ones they originally started with (i think one was Berkley). They're constantly reinventing their typefaces (Matrix II) because I think they realize this. Licko, Keedy, etc. were some of the first good type designers on the digital platform, and thusly did a lot of experimentation. So I think their type shows a sort of progression through the late 80s to now. I guess my answer is yes, some do look dated, but I would count on them constantly updating and adding new, more contemporary faces. I wouldn't be surprised to look back at any foundry's work ten years from now and think the same thing. I still personally enjoy the italics for triplex as well as the caps. Those curves on the stems of the lowercase really bug me though.</p>
      <p>I remember seeing Citizen on the cover for the movie <a href="https://web.archive.org/web/20150123061338/http://www.impawards.com/2001/posters/black_hawk_down_ver1.jpg" rel="nofollow">Black Hawk Down</a>.</p>
