    <p>I was wondering about Emigre's types. A few years ago they were top of the hype, so much overused that they are now paying the price of success; I can't go through Emigre's catalog without seeing "1990" written everywhere. I mean, apart from a few types (Malaga, Vista, Mrs Eaves, Tribute), who can actually still use today types such as Triplex, Matrix Script, Keedy, Dogma, Democratica, Dead History or Citizen?</p>
    <p>dr</p>
