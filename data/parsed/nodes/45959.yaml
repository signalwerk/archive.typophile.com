    html: <p>Like every other foundry with a strong profile, you just have to pick and choose, and let them worry about their own shelf life. Cholla, Filosofia, Malaga, and Vendetta (tho it looks so small) all work well, stylish and just timeless enough. And, I should add, they're still gently priced. Storm Foundry's historical revivals also have eccentricities that require discrimination and care. And the point above about all those high-x-height ITC faces from the 70s, originally intended for advertising instead of regular editorial use--that's true too. You just have to pick and choose.</p>
