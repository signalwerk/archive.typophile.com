      <p>I am actually writing a book about typography, and in this book I wrote a full article about Zuzana Licko's Mrs Eaves, and another one about Xavier Dupre's Vista, in which I say a lot of nice things. I am actually in regular contact with Ms Licko herself, and everything is fine. I have been one of the biggest fans of Emigre since years, I have countless printed specimens, Emigre magazines, I receive their catalog and I actually have some of the typefaces licensed. I also wrote, and think, that it's becoming increasingly hard to use most of these types today mostly because of their success in the nineties, which is not rude or bad or whatever, but simply true. Read again, mate, because that is really what I said, asking the fellow typophiles around their point of view, which is sometimes the same, sometimes very different. I, for example, agree totally with Tiffany when she says that Emigre proudly stands by their old designs, and I didn't think of it that way before; I came to this different point of view through discussing with the clever people around. </p>
