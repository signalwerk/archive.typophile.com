      <p>Ha! Journal is hands down the best thing Emigre ever delivered. Emigre started out in the PostScript Type 3 years (the only free font format licensing around) and learned the lessons of optimizing for low-resolution output devices quite well. There are very few typefaces that actually look better at smaller size. Journal is one of them. If it looks slightly Czech, well, it is, can't do any better than that. As Goudy said, those old guys stole all our best ideas (I paraphrase).</p>
