    html: |-
      <p>Don't have an exact match. My first idea was <a class="freelinking external" href="http://www.houseind.com/fonts/chaletcomprime" rel="nofollow">Chalet Comprime</a> tweaked (mixing Milan 1960 and 1970 and adding an outline stroke to round it).<br>
      Here are some more similars: <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/" rel="nofollow">Gravur Condensed</a> (some details remain off), <a class="freelinking external" href="http://new.myfonts.com/fonts/parachute/pf-handbook-pro/" rel="nofollow">Handbook</a> (probably not enough condensed), <a class="freelinking external" href="http://new.myfonts.com/search/platelet/fonts/" rel="nofollow">Platelet</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/gestalten/naiv_ot/" rel="nofollow">Naiv</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/t26/selecta/" rel="nofollow">Selecta</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/artill-typs/luco-sans/" rel="nofollow">Luco</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/suomi/tame/" rel="nofollow">Tame</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/font-fabric/oval/" rel="nofollow">Oval</a></p>
