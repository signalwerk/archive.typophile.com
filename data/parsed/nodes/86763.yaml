    <p>Hi everyone,</p>
    <p>Here I am again, I have to recreate this logo for e-shop multiconnect,<br>
    and I'm looking for the font they used.</p>
    <p>I have tried WhatTheFont and Identifont, but to no avail.</p>
    <p>EDIT: It looks SO much like Variable, but there are small differences, for example the rounded lines.</p>
    <p>Thanks in advance!</p>
