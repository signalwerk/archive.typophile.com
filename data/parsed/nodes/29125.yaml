    html: |-
      <p>&gt; What is "flat kerning"? Is it the same thing as plain kerning?</p>
      <p>Yes.</p>
      <p>You can edit the "kern" feature in the OpenType panel. You can explicitly convert your class-based FontLab kerning into the "kern" feature in the OpenType panel flyout menu, "Generate kern feature". If you don't do that and the option "Generate "kern" feature if it is not defined" is enabled, then FLS will generate the "kern" feature when generating the font. </p>
      <p>But if you do it explicitly in the OpenType panel, you'll see exactly what goes into the font. </p>
      <p>A.</p>
