    html: |-
      <p>&gt; Allow the creation of class supersets/class groups</p>
      <p>I don’t think so. I cannot imagine how this could be represented in the user interface. </p>
      <p>&gt; In “Class kerning with exceptions” mode,<br>
      &gt; allow exceptions of key-glyph/key-glyph pairs,<br>
      &gt; or abandon the concept of key-glyph </p>
      <p>Again, we could run into UI problems. But perhaps we can do something about it. </p>
      <p>&gt; Compile kerning data on the fly, and<br>
      &gt; report kerning problems (class overlapping</p>
      <p>I think that the kerning problem should be solved in a completely different manner. The final classes embedded in the font do not, conceptually, have anything in common with the classes used in the design process. The classes in an OpenType font are a mechanism for technical compression. The classes used in the design are for the designer. I hope that we can find a solution that will separate those two entirely: the designer will be free to set up classes in the FontLab Studio interface in any possible way (such as, mix Cyrillic A with Latin A in one class), but in the process of the actual kerning compilation, the kerning will be composed in a different, optimal way, including both pairpos pairs and class pairs depending on the outcome of an automatic optimization algorithm. </p>
      <p>Unlike a handful of experts at Adobe, regular type designers do not have to, and should not be bothered with things like subtable breaks, class overlapping etc. </p>
      <p>We will keep the UI access and the programmatic access to the OpenType Layout feature definition source code (in AFDKO syntax). This means that people are free to develop their own Python code to transform the "visual" kerning information (Classes panel and Metrics window) into the AFDKO code -- just the way you did it Miguel. </p>
      <p>Best regards,<br>
      Adam</p>
