      <p>What is "flat kerning"? Is it the same thing as plain kerning?</p>
      <p>I am just now learning about the Glyph Positioning table (GPOS based kerning). All I know about it is that it's a table that microsoft will read to interpret the kerning values for my opentype-flavored opentype font. I know that in fontlab I can export it if I have the box checked next to "Generate "kern" feature if it is not defined" under the opentype export in the preferences, along with "export opentype tables", but where can I edit the GPOS kerning feature/table?</p>
      <p>Mr. Sousa - What is code optimization (for kerning)? How do you do it? Do you use the opentype panel and change the code in it? If so, why do that instead of use the metrics window, as I have been doing for all of my kerning adjustments? All you need to do is to click the button "Apply and Save" in Kerning Assistance to make adjustments made in the metrics window show up in the opentype panel, -- even if you have defined no classes at all, this will generate a "kern" feature, I believe. Or am I wrong about this? I'm getting confused about some of these things!</p>
      <p>BTW I am working on OTF-flavored OpenType fonts.</p>
