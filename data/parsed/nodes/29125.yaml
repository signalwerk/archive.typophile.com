      <p>Adam, here are some ideas, regarding kerning handling, for a future iteration of FontLab Studio:<br>
      -- Allow the creation of class supersets/class groups (classes that contain classes or classes+glyphs)<br>
      -- In "Class kerning with exceptions" mode, allow exceptions of key-glyph/key-glyph pairs, or abandon the concept of key-glyph (this might sound strange at first, but class kerning is about kerning classes and glyphs; the key-glyph is in a grey area, because it can act as glyph or as a class)<br>
      -- Compile kerning data on the fly, and report kerning problems (class overlapping, inaccessible kern pairs downstream, etc.)</p>
      <p>This will keep you guys busy for a while... :^)</p>
