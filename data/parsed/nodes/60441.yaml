    html: |-
      <p>Paul, I understand this is indeed confusing, especially since Internet Explorer has supported @font-face for a very long time, but very few people took advantage of this. But in a way, this is not so much different from another basic HTML code:  &lt;img src="url" /&gt;</p>
      <p>Not every browser supports all image formats (e.g. PNG, BMP), the designer has to choose the format that is best for the purposes. Hopefully, we'll soon have one font format that works in all browsers, so we don't have to specify two or more* font formats per single web page.</p>
      <p>Peter<br>
      <a href="http://www.typotheque.com" title="http://www.typotheque.com">http://www.typotheque.com</a></p>
      <p>* It is a fact that right now, we deliver subsetted and obfuscated TTF for some browsers, and the same font wrapped in EOT for other browsers. But because we aim for multilingual support, we realise that even this may not be enough, as Apple requires AAT fonts for correct shaping of some non-Latin scripts. I am just playing with Devanagari fonts, and while on Windows this sample (<a href="http://www.typotheque.com/hindi.html" title="http://www.typotheque.com/hindi.html">http://www.typotheque.com/hindi.html</a>) is rendered correctly in all browsers, on Mac the conjuncts are not correctly rendered. The sample is in fact Nepalese, not Hindi.</p>
