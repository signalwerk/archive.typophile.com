      <p><cite>can that really be considered @font-face support?</cite></p>
      <p>People often mix up @font-face, EOT and "raw fonts".  @font-face is the general technology; EOT, TTF, OTF, SVG and so on are possible formats which can work with @font-face depending on the browser support. (Similar to GIF/JPG/PNG and the IMG tag)</p>
