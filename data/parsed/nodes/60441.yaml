    <p>I was reading about Typotheque's forthcoming webfont delivery service here: <a href="http://www.typotheque.com/site/news_details.php?id=164" title="http://www.typotheque.com/site/news_details.php?id=164">http://www.typotheque.com/site/news_details.php?id=164</a><br>
