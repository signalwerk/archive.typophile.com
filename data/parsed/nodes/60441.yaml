      <p>JP: <em>...which might lead to designers leaning on Microsoft to support raw linking</em></p>
      <p>So far, the only pressure I've seen from web designers/authors has been on the other browsers to support EOT Lite, because it is the only format that offers a significant measure of backwards compatibility with well over 50% of browsers in current use.</p>
      <p>And I think the chances of MS supporting raw linking are now close to nil.</p>
