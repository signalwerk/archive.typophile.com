      <p>If I recall correctly, Peirce classifies signs according to these categories</p>
      <p>Symbol. A symbol is a sign related to the actual object by an artificial or very abstract convention. Words (printed or spoken) and abstract symbols such as the cross fall under this category. They have not actual relation to the thing.</p>
      <p>Indices. These are signs that refer to the actual object by indicating it’s existance such as smoke to the fire or a pictogram.</p>
      <p>Icon. Is a sign used in substitution of the actual thing by resembling  it’s qualities such as speed, color, texture, character, etc... most of brands fall under this category.</p>
      <p>Trademark and brandmark I suspect are more related to the US commercial and trading laws.</p>
      <p>Monogram is a logotype formed by the initials of a name.</p>
      <p>Logotype is type whose semantic quality exceeds that of a simple type labelling. Originally  logotypes were words casted in a single slug for type composition.</p>
      <p>Brand is the semantic construction of a corporation’s identity by means of it’s communication and way of being.</p>
      <p>Idetity is the perception built in the mind of a public of a corporation’s being.</p>
      <p>Mark is the core element of a Brand. It’s visual device composed of an icon or a logotype or both, a color scheme and a graphic system.</p>
      <p>Héctor</p>
