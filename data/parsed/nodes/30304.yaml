      <p>Since Index hasn’t been defined yet. It has several meanings, some of which are linked to typography and information design, the most obvious is probably an alphabetical list (of subjects in a book/article), it can also mean to create and use symbols which act with a key for a map or illustration, or the printer’s fist (the hand with the <em>index</em> finger pointing). there are also meanings linked to mathematics, a pointer in a measuring instrument or computing. Hopefully this hasn’t confused things even more.<br>
      Tim</p>
