    <p>Hello Typophiles,</p>
    <p>First of all wish you all a very happy and a prosperous new year.</p>
    <p>Right now we are having our “Symbol Design” course at the university.<br>
    Day before yesterday we were given an assignment to find out the definitions of few of symbol design related terms. I asked few people and searched on internet too but today when we had the discussion in my class regarding those terms everyone had a different definition for the same term. And thus I got confused totally. Day after tomorrow we have yet another session and before that i want myself to know what exactly these terms are and where to use what? </p>
    <p>Someone please explain these terms and the differences between them.<br>
    I’d also appreciate if you can drop some links where i can study these terms.</p>
    <p>Here are the terms.</p>
    <p>&gt; Symbol<br>
    &gt; Identity<br>
    &gt; Icon<br>
    &gt; logo<br>
    &gt; Index<br>
    &gt; Trademark<br>
    &gt; brand mark<br>
    &gt; brand<br>
    &gt; Monogram</p>
    <p>Thanks a lot.</p>
    <p>satya<br>
    student, graphic design</p>
