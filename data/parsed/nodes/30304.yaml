      <p>The problem with these terms is that to some people they have interchangeable meanings today. In the past, there were more meanings and differentiation. The term “Logo” is the biggest contender. Logo is short for logotype. Logo means “word” in Greek. To some degree, people use the term “wordmark” like the term logotype used to be used. It meant the name of the company or organization depicted typographically, like Ford. Later, the initials or acronym was also considered a logotype, like IBM. Monogram, like the TDC, is a style of configuration where initials may be superimposed on each-other or placed within a shape. This was a common practice years ago for stationary and even clothing (monogrammed shirts). A symbol was initially a graphic which represented some entity but letterforms were not required. The Nike swoosh is a symbol. A trademark was either a symbol or logotype which was legally endowed with the identification of a company or corporation. Trademarking involved government registry and search for availability. Brand used to mean a product brand like “Rice Crispies” but later came to mean the parent company which made the product as in the “Kellogg’s Brand”. The brandmark might be either the “Snap-Cracle-Pop” characters or the script “Kellogg’s” name.<br>
      Identity was all the things involved with identifying a company including symbol or logo, colors layout of print matter, etc.</p>
      <p>Today though, everything is called “Branding” even if no product is involved. Corporate identity is even called branding. Everything used to identify a company is acalled a logo even if no letterforms are involved. The whole Branding buzz seems-to have been kindled from the marketing angle and has come to mean positioning a given organization to appeal to a certain set of customers—trying to make them look like a duck.</p>
      <p>I am sorry for rambling so much (between phone calls here). I hope this helps clarify the very muddy waters that we now have in this business.</p>
      <p>ChrisL</p>
