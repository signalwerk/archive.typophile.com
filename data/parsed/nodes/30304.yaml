      <p>I knew using Chris’s picture would lead to trouble, but someone else started it. Since it looks like the animal handler at Bembo’s Zoo, though, its a most interesting example. I would call it a strong avatar.</p>
      <p>My proposed definition is based on the classical definition, adding in my suspicions of how it came to be defined like we use today, inspired by cyberpunk literature.</p>
      <p>I think the original vision was that by now we were supposed to have throbbing surreal 3D virtual-raves for an internet, that we waltzed about like supermen, while data and applications labored to serve our virtual identities. However, in reality, we never got hover cars by 2000, we don’t all “see” the matrix code as redheads (without decoding software), and we can’t even get one standard for instant messaging.</p>
      <p>But if the internet is indeed cyberspace, than the icons that represent “actual” people, would be avatars. When I describe them as such people always have distinguished them from other icons in a UI immediately with no pre-discussed scenario.</p>
      <p>In massively-multiplayer online RPG’s, the worlds are generally populated with hordes of 3D characters, each individually directed, but these similar things are rarely called avatars. Funny, since most of the activity bypasses the role-playing factor, and the characters are as distinct from their owners as the doggy in Monopoly. I think this is because the character is intended to be “not you” in this case, so it cannot be your avatar.</p>
      <p>I think there are various strengths of avatars, as well. Chris’s shows what he looks like and what he is ’about’ and some of his mirth, so it is strong. To glance up, Tiffany’s is fair, because it hints at what she does (it’s type-designey), and suggests some official relation to Typophile.com. Mine is okay. It shows a part of a logo, and some punctuation. But hey, how easy is it upload your essence into a 40x40 box?</p>
      <p><a href="http://www.chozcunningham.com">Choz Cunningham</a><br>
      <a href="http://www.exclamachine.com">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark">The Snark</a></p>
