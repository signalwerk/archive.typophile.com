      <p>HA, good old Pogo !<br>
      It seems that this will be as challenging as I thought.<br>
      I was hoping to avoid having to hand letter but, the more fonts I try I feel like I'm pushing myself to do just that.<br>
      I create the line drawings of the two characters with an old CAD program but, so far any text I place, just seems out of place.<br>
      I am able to make free hand sketches with the CAD program but, I don't have the correct mouse to make the lines and hand written text as if I was using a pen. (do they make such a thing?)<br>
      I am going to look at some of these digital sketch pads but, I'm just not sure they will give me what I'm looking for without going to a really high end device, and I'm not ready to lay out that kind of scratch just yet.<br>
      Thanks again for all the help !</p>
