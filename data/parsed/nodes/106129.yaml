    <p>Hey all.<br>
    Brand new here and already asking for help.<br>
    I'm developing a political/social commentary comic strip and I'm looking for suggestions for the dialog typeface for the two main characters.<br>
    Anyone care to share their personal favorites or make a suggestion as to where to look ?<br>
    I'm thinking about starting out on utube and using the response to the strip to decide whether or not to print a collection in letter press, hardcover bound, limited run, real books.<br>
    Not looking to make money on this. Just doing the print run for fun.<br>
    Right now I'm lettering the dialog by hand but, aside from being nearly illegible, my handwriting is not distinctive enough to create two different typeface styles to clearly indicate the two different characters.<br>
    I plan to use different fonts to emphasize certain emotions and so forth but, like I say the basic dialog is going to be the long hard road for me.<br>
    Any help would be great !<br>
    Merl</p>
