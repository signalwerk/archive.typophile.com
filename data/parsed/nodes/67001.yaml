      <p>The G and C look like (almost) Novel Gothic (A.k.a. <a class="freelinking external" href="http://www.qbf.de/dceng.htm" rel="nofollow">Nimrod</a> in QBF version). Some letters do look like a heavy Futura, maybe with extra stroke. I also thought of Berthold Block. </p>
      <p>I guess the point is that this seems like a mix of fonts, some with edited glyphs.</p>
      <p>- Mike Yanega</p>
