  html: <p>Hi, I'm doing some scripting with fonts and it just so happens that in the conversion, the glyph names will be the same as the unicode names, I've found that this seems to be okay (i.e. /a/ will be called uni0061 instead). Are they only for human-reabable purposes, or do they need to be the specific name that corresponds to the unicode number?</p>
