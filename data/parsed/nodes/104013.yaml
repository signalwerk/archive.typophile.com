      <p><cite>Can anyone comment on the reliability and accuracy of this mechanism?</cite><br>
      AFAIK it is good as long as no one to many substitutions or glyph reordering are involved. Also there should be strict one to one or many to one maapings between input characters and glyphs, e.g. if you have both <code>smcp</code> and <code>c2sc</code> features, there must be two smallcap glyph sets, one a.sc, …, z.sc and one A.sc, …, Z.sc respictively.</p>
      <p><cite>Said another way, what would break if all my fonts had format-3 post tables?</cite><br>
      PDF creators should build a non-version 3 post table when embedded such fonts in PDF files (some do), but if they don’t printing can break.</p>
      <p><cite>so I'm getting mixed messages here.</cite><br>
      CFF table contains glyph names, so there is no need for them in the post table.</p>
