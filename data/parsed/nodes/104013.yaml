    html: |-
      <blockquote><p>Since the output of the reverse mapping will be in the order of the glyphs, any [reordering] that affects the final glyph order will also affect the reverse mapping</p></blockquote>
      <p>Right. It is tempting to think that it might be possible to reverse reordering once one has the character identities of the glyph string, but in practice this fails in a number of ways, influenced by how the font has been built. It isn't unusual for post-reordering GSUB features to produce ligatures of glyphs that represent characters that are not sequential in the pre-reordered string. Adobe's glyph naming conventions do not cater for this.</p>
      <p>I think it would be possible to define glyph name conventions and rules for making Indic fonts that would make it possible to cleanly reverse reordering from parsed character strings, but I doubt if that would get much traction.</p>
