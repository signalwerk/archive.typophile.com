      <p>I'm pretty sure it was fixed back in 10.5. At least it was far back enough that a bunch of good folk at Apple had no idea what I was talking about when I inquired as to when this was fixed.</p>
      <p>As for problems today, the main one remains the classic: if a PostScript print stream or file is created, and then turned into PDF without the original font available, then glyph names are the only means to get the encoding from the print stream. If the font uses unrecognized glyph names, then the text in the resulting PDF will not be searchable, copyable, etcetera.</p>
