      <p>This thread has been very helpful -- thanks for the input.  One last (I hope) question:</p>
      <p>Other than the PDF text extraction previously discussed, what will break if the glyphs have names that are well-formed but are not names that are included in the <a class="freelinking external" href="http://sourceforge.net/adobe/aglfn/wiki/AGL%20Specification/" rel="nofollow">Adobe Glyph List Specification</a>?</p>
      <p>I am acquainted with AGL and AGLFN, and our policy is to conform to AGLFN when the font is shipped. (During development we may use non-AGL names, but those are replaced prior to shipping). But I am having an ongoing discussion with someone who dislikes the Adobe names and chooses to ignore the AGL conventions.  Is there any risk to his behaviour?</p>
