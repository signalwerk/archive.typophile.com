      <p>My interest in this issue has recently been rekindled, so I'd like to followup with some questions.</p>
      <p>1) The link above is to Thomas Phinney's suggestion that glyph names are important for glyph-to-Unicode mapping in certain PDF work flows. I have heard elsewhere that extracting text from PDF using glyph-to-Unicode mapping isn't all that reliable anyway -- especially for complex scripts. Can anyone comment on the reliability and accuracy of this mechanism?</p>
      <p>2) Other than the above-mentioned PDF issue, are there any reasons that ttf-flavored OpenType fonts need glyph names at all? Said another way, what would break if all my fonts had format-3 post tables?</p>
      <p>According to the <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/post.htm" rel="nofollow">post table spec</a> regarding format 3:</p>
      <blockquote><p>
      The printing behavior of this version on PostScript printers is unspecified, except that it should not result in a fatal or unrecoverable error. Some drivers may print nothing, other drivers may attempt to print using a default naming scheme.
      </p></blockquote>
      <p>which seems to suggest there can be printing problems. But then  <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/recom.htm" rel="nofollow">Microsoft's recommendations</a> later state:</p>
      <blockquote><p>
      OpenType fonts containing CFF outlines use only format 3.0 of the 'post' table.
      </p></blockquote>
      <p>so I'm getting mixed messages here.</p>
      <p>Why the question? The growing use of webfonts makes font size an issue again, and thus omitting glyph names can improve performance.</p>
      <p>Thanks for any help.</p>
      <p>PS: I know that glyph names are useful during development, e.g., for writing OT and Graphite feature code. My question relates to the final product, not the development process.</p>
