    html: |-
      <p><cite>By "one to many substitutions", are you referring to GSUB lookups of type 2 ("multiple")…</cite></p>
      <p>Yes. Generally you can reverse map a single glyph to a single or multiple characters, but you can’t reverse map multiple glyphs to a single character. The exact algorithm used is described in <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/archives/glyph.html#2" rel="nofollow">Adobe Glyph Naming convention</a>.</p>
      <p><cite>Does this includes character-level reordering as in what the Indic shapers for OpenType do?</cite></p>
      <p>Since the output of the reverse mapping will be in the order of the glyphs, any recording that affects the final glyph order will a;so affect the reverse mapping (except for RTL swapping, though some applications fail with that too and return reverse mapped text in the visual not the logical order).</p>
