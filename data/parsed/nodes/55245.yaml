  html: |-
    <p><a class="freelinking external" href="http://www.typoholism.com" rel="nofollow">typoholism.com</a> is a site I just created to diagnose the symptoms of typoholics.</p>
    <p>it's actually a twitter app that searches for the hashtag #typoholism and posts it on the site. just post a tweet with that hashtag and it will appear on the site</p>
    <p>some examples:<br>
    taking pictures of comic sans menus in fancy restaurants<br>
    if you plan on picking your child's name based on how easy it is to kern<br>
    Obsessive use of the Baskerville ampersand</p>
    <p>Anyways, I thought everyone here might enjoy this little app</p>
