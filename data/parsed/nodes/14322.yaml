      <p>Here’s what I’ve got so far:</p>
      <p><a href="http://gtmail.150m.com/baskervilles.gif" title="http://gtmail.150m.com/baskervilles.gif">http://gtmail.150m.com/baskervilles.gif</a></p>
      <p>I found some Baskervilles not previously mentioned (look near the top of <a href="http://jeff.cs.mcgill.ca/~luc/choice.html">this page</a>), including Timberwolf’s Baskerville 1757. My graphic compares this with ITC New Baskerville, Storm’s John Baskerville, and Mrs Eaves.</p>
      <p>Two Baskervilles I couldn’t find samples of, and would have considered, are the <a href="http://www.bertholdtypes.com/bq_library/90131.html">Berthold</a> and <a href="http://www.fonts.com/findfonts/detail.htm?pid=243211">Monotype</a> versions. Are these worth pursuing? </p>
      <p>So far, I’m favouring ITC New Baskerville, since it’s nearest to what we’re already using. The Storm design has a low small caps height, which I’m not keen on. I do really like Mrs Eaves, although it’s a bit of a departure. Viewed with the arms, they look like this:</p>
      <p><a href="http://gtmail.150m.com/Arms-version.gif" title="http://gtmail.150m.com/Arms-version.gif">http://gtmail.150m.com/Arms-version.gif</a></p>
      <p>I think what I might do, rather than giving the decision makers the choice between artificial small caps (as we have now) and genuine small caps, is to give them the choice between ITC small caps and Mrs Eaves. I’d be happy with either.</p>
