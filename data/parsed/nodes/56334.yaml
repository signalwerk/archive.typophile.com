  html: |-
    <p>Hi all (and especially Adam or Nick, if you're here ;)</p>
    <p>Anyone know when MyFonts will update their sample renderer to use (GPOS) class kerning for the samples?<br>
    Or should I re-generate my fonts to include expanded old-style "kern" tables just to make the samples on MyFonts look good? (With the added benefit of them perhaps better supporting older applications kerning-wise?)</p>
    <p>My "problem" at the moment is:<br>
    I have just released a batch of fonts on MyFonts.<br>
    A foundry's best selling font is used for the header on the foundry page.<br>
    My current best seller is a font called "Dynamic BRK Pro", and its design means that without class kerning applied my foundry name reads like "CheapP roF  onts"!<br>
    It does not look good, and I'm afraid customers will think my fonts actually HAVE such abysmal kerning (which they don't)...</p>
    <p>Hence my question.</p>
    <p>So... Should I wait for MyFonts to improve their sample engine, or should I put "legacy" information in my fonts?</p>
