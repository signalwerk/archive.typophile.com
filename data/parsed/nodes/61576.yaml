  html: |-
    <p>Indento™ is a multi-purpose modern geometric slab serif for headlines, posters, branding but fairly legible to be used as longer text. The straight and rounded corners combined with deep cuts and asymmetric serifs gives it a distinctive look while still keeping its rigorousness and legibility.</p>
    <p>The family consist of three weights, each with a companying italic. The extensive character set - 513 glyphs in each font - includes support for Central and Eastern European languages and OpenType features like small caps, ligatures, fractions, slashed zero, stylistic alternates and more. See&nbsp;<a href="http://mugurmihai.com/pdf023/Indento.pdf">PDF specimen</a> </p>
    <p>If you like to test it first go get the bold version, it's free. </p>
    <p>Available at <a href="http://new.myfonts.com/fonts/mugur-mihai/indento/">MyFonts</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/indento-gallery1_4691.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/indento-gallery2_5986.jpg"></div><p></p>
