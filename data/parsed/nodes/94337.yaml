    html: "<p>KALEIDOSCOPE: close to <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/bitstream/geometric-415/\" rel=\"nofollow\">Geometric 415</a>/<a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/linotype/metro-2/\" rel=\"nofollow\">Metro #2</a>/<a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/dsgnhaus/dhsans/\" rel=\"nofollow\">DH Sans</a>/<a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/grouptype/grosse-pointe-metro/\" rel=\"nofollow\">Grosse Pointe Metro</a>/<a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/nicksfonts/examiner-nf/\" rel=\"nofollow\">Examiner</a> for these letters only. They're actually using a font called <a class=\"freelinking external\" href=\"http://kaleidoscope-press.com/\" rel=\"nofollow\">AMB Kabel Ten</a> on their website so I guess they're also using it for their masterhead.</p>"
