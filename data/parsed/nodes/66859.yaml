    html: |-
      <p>Wow! I'm learning a bunch about fonts while researching this topic! FUN!</p>
      <p>Quick/Interim thoughts:</p>
      <p><strong>BabelMap</strong> is definitely worth having on your computer. It's small; is not even <em>installed</em> in the normal Windows sense, and you can't beat the price ($0.00)! Its UI is not elegant -- good for analysis in depth -- not so much for using "open on the side" while composing a doc in MS Word.</p>
      <p><strong>PopChar</strong> has a more polished and efficient UI. The trial version grays out most of a font's characters so it's a mite tough to be <em>totally sure</em> that PopChar is showing me <strong>all</strong> the available characters.</p>
      <p>PopChar's big selling point is its ability to enable you, fairly automatically, to select a "special character" in PopChar and have that character be instantly inserted "back" in MS Word or whatever program you're working in. It <strong>did</strong> do that, but I quickly determined that if I changed fonts and sizes while in PopChar, what was finally inserted "back" in my Word document was maybe not necessarily what I was expecting.</p>
      <p><strong>MainType</strong> While googling around researching my super Char Map need I came across MainType. Besides doing a a spiffy job of showing all the Unicode characters, etc it is also appears to be a competent font manager.</p>
      <p>Does anyone have experience with MainType?</p>
