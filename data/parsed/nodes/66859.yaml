    <p>I run on Windows XP Pro. Over the last few years I've been "collecting" some good quality OpenType fonts, many from P22 Type Foundry in their "PRO" format. The "PRO" .otf files include a lot of the special characters: ligatures, glyphs, swash caps. small caps, etc., etc.</p>
    <p><strong>Problem: The <em>Windows Character Map accessory program </em> will only show me the <em>standard</em> 256 characters usually included in .ttf fonts.</strong></p>
    <p>I use a page layout program (Serif PagePlus X3) that is able to display and implement a font's special characters. But, having to open large, fullblown software just to view a character's map is ponderous.</p>
    <p><strong>So, can anyone recommend a SUPER Character Map</strong> that will show fonts' special characters above and beyond the first 256; hopefully, enabling the user to see the fonts' "information" and permitting the copying and pasting of individual characters and symbols a'la the Windows Character Map.</p>
    <p>Thanks, Jim</p>
