    html: |-
      <p><cite> .. For instance, I'm wondering how any software knows how/when/where to "exchange" ligatures for certain character sequences if the font's ligatures are not mapped.</cite></p>
      <p>That's actually very simple. For non-OTF fonts, a program cannot know the position of <em>any</em> ligature at all, except "fi" and "fl". These are defined in the standard character mappings -- even in Unicode, although nowadays that's considered a judgment error.<br>
      If a program sees a font has characters on position "0xde" and "0xdf", it might use these as "fi" and "fl". Now usually, font designers stick to this position convention, but there are always some that put other characters in that place. So, with lots of "old" Type 1 fonts, you have to actually disable ligatures with a modern program such as InDesign.</p>
      <p>OpenType fonts solve this possible problem two-way: first, rather than a position, all glyphs (as characters are called in this context) are defined by a unique number -- their Unicode value. It's also possible not to assign a Unicode at all, or one in the Private Use Area; this in case the 'glyph' is a ligature that's not defined in Unicode. The other way is that the font itself contains the information which characters can be combined into which ligatures.</p>
      <p>As for your empty Character Map: well, not every font contains all those characters -- and Windows itself is quite unsure which fonts do and which ones don't ... If you select a font such as Arial, Arial Unicode, or Times New Roman, you should see lots and lots of characters beyond 255.</p>
