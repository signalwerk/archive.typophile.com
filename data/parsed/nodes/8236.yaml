    html: "<p>What's special about this milk? Anything that makes it unique? The only milk packaging that won me over purely on the packaging was Schroeders: <br> <br><a href=\"http://www.schroedermilk.com/products/schroeder_milk.cfm\" target=\"_blank\">http://www.schroedermilk.com/products/schroeder_milk.cfm</a> <br> <br>Otherwise, IMHO, milk is milk. It's from BST animals or it isn't. It's organic or it isn't.  <br> <br>So, I'm not helping much, but I guess my point is that if this brand needs to stick out, it really needs to be immensly different than the norm, or it needs to emphasize the unique properties of the milk. <br> <br>As for what you have, I really like the last one visually. But tend to agree that the hyphen isn't needed.</p>"
    html_clean: "<p>What's special about this milk? Anything that makes it unique? The only milk packaging that won me over purely on the packaging was Schroeders: <br> <br><a href=\"http://www.schroedermilk.com/products/schroeder_milk.cfm\" target=\"_blank\" class=\"link-external\">http://www.schroedermilk.com/products/schroeder_milk.cfm</a> <br> <br>Otherwise, IMHO, milk is milk. It's from BST animals or it isn't. It's organic or it isn't.  <br> <br>So, I'm not helping much, but I guess my point is that if this brand needs to stick out, it really needs to be immensly different than the norm, or it needs to emphasize the unique properties of the milk. <br> <br>As for what you have, I really like the last one visually. But tend to agree that the hyphen isn't needed.</p>"
