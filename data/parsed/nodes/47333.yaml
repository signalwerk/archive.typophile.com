    html: |-
      <p>For those with Office 2008 for Mac, or Vista installed on their Mac:<br>
      <a href="http://www.ascendercorp.com/pr/pr2008_04_17.html" rel="nofollow">bundled with the software</a></p>
      <p>For those with Office 2004 for Mac:<br>
      <a href="http://www.labnol.org/software/tutorials/free-download-calibri-font-on-mac/3684/" rel="nofollow">bundled with an optional Open XML Converter download</a>.</p>
      <p>For those without Office, but with a pre-Vista Windows system installed on their Mac:<br>
      <a href="http://labnol.blogspot.com/2007/03/download-windows-vista-fonts-legally.html" rel="nofollow">Available via the Powerpoint 2007 Viewer or the Microsoft Office Compatibility pack</a>.</p>
      <p>For those who have neither Office nor a Windows version:<br>
      <a href="http://www.ascendercorp.com/ctfonts.html" rel="nofollow">the CT fonts can be purchased via Ascender</a><br>
      F</p>
