  html: |-
    <p>This is something I've played with off and on all year in my sketchbook. I didn't think this would actually work as a font because it was drawn in an outline and overlapping the letters was impossible in font format, but then I discovered that if I removed the outline the letters could be pushed together and a background layered behind it. It's fun playing with colors. It may all be too much? The counters too thin?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/grafiti_slab_3496.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/grafiti_slab_two_5920.jpg"></div><p></p>
    <p>-Jess<br>
    bvfonts.com</p>
