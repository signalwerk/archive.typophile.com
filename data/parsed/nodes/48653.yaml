    html: |-
      <p>The tiny counters place a limit on how small this font will render successfully. Look at Ray's Tank. When he made that one he decided to make a sister version with slightly larger counters for small sizes.</p>
      <p>It works with the outline treatments but in plain guise it suffers from a clagged appearance. Rather than making two versions with different counter sizes, I would make just one version that scales better down to small sizes. </p>
      <p>The lower <strong>w</strong> is letting the side down, sorely in need of integration. Square up the vertices like the <strong>v</strong>. I love the oddball <strong>g</strong> and think you should exaggerate it even more. Make a quartet of alternate oddball <strong>g</strong>'s just like that one only four variations.</p>
      <p><strong>Q</strong> tail fits in just fine. <strong>t</strong> is interesting but have another go at it. I sort of want to like it, but I can't ;^)</p>
      <p>Keep it on the stove. Adorn it with squirrels. Kidding.</p>
      <p>Make an inline version! Yeah, make an inline. Think of the Starlet potential. Textured fonts sell; if enuff of us make inline fonts they will be the next big thing on the <em>Mefonts</em> Starlets chart. I think they should remoniker the reborn <em>Myfonts</em> site <em>Mefonts</em>.</p>
      <p>In several ways it's like some of the A &amp; S Sign font artbrush jobs, the hand-painted romans. Look at Bone Casual, Pen &amp; Ink Roman, Porkchop bold. </p>
      <p>And it's a bit House.</p>
      <p>j a m e s</p>
