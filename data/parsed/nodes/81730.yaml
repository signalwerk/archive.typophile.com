    html: <p>The UC/lc darkness balance is a delicate thing that should/can best be judged in text I think – print a sample and observe closely how much the caps stand out. Of course depending on intended use you may want them to stand out a little bit (it makes it easier to quickly scan a text for proper names, like people may want to do in nonfiction), or blend in entirely (like for really long text read immersively – or for languages, like German, that use lots of caps).</p>
