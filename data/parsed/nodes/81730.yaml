    html: |-
      <p>I know this is going to sound harsh, given the amount of work you believe you have done, but the whole thing still looks sloppy.</p>
      <p>From a proportional standpoint, look how much white space is present in the h, n, m, u, and then contrast that with the round forms (b,d,q,p,o,c,e). Either the round forms are too narrow or those others are too wide. The very vertical characterization of the p, b, d, q, seems at odds with the rounder o, e, c. The v and y look drunk in comparison those the other glyphs.The middle of the w is too wide compared to the right and left side. The f and t look to narrow, and the foot on the l does not need to be there. The bottom bowl on the g is too narrow and a bit square. the bottom diagonal of the k needs to move more to the left. The x is terrible, and overall the spacing is really, really bad.</p>
      <p>I tell my students that a properly spaced and poorly drawn font is much more useful than a beautifully drawn poorly spaced one. If you concentrate on spacing this sucker, it will give you more insight into how to draw it.</p>
      <p>Good luck.</p>
    html_clean: |-
