    html: <p>I don't normally comment on these threads, but I think you have some serious proportional issues that need working out. Your b,d,p,q don't relate well, your u looks like a y (it is a y) and they are both too narrow, and your caps are a mess. That M is going to kill you, and the J is going to catch itself on the ledge and break its neck. It would behoove you to show the caps and the lowercase at the same size. Sizing them to fit on one line does no one any good.</p>
