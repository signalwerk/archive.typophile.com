    html: <p>It is not usual English typographic practice to detach the period, and some other marks, from the word, though it certainly is, especially for some marks, in some other languages, French, for example. Though it is true that there are plenty of letterpress English books from the past that do detach some marks. But, assuming usual current English practice, I do wonder whether you really need to do this . . . you may have a special reason . . .</p>
