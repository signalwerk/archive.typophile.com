      <p>Well, I won't detach it to a degree similar to that in French. However, I do believe there is some room between a full space and a dot that forms a unit with the preceding latter, as seems to be the fashion in our poor day. My reason is aesthetic, or if you will it's a semantic sensibility. A period must render a rhythm to phrases, it must phrase them like a pianist does playing the score. To that end, it must not only be visible (I find even the visibility impaired when the dot seems a diacritic to an n or so), it must also be in some accord with the rhythm of the words. This doesn't call for a full blank space, but it does call for some air. Or so I feel. Cf. eg. attached beautiful setting.<br>
      Besides, while taking your assumption as a compliment, I usually work with german text.</p>
      <p><img src="/sites/default/files/old-images/IMG_0106_6541.JPG"></p>
