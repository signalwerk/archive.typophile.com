      <p>You’re right. I should have said that I hope a change equally achieved by perfectly legal means present in a typesetting application would turn out to be legal in most cases, which is what I hoped to indicate by calling it a minor issue.<br>
      But I realise instead of hoping, assuming and indicating I better had looked it up in advance and made explicit that I will restrict my interventions to what’s permitted. (To pursue illegal intentions in a public forum signing with my real name would be a display of rather questionable wits indeed. And I assure you, not only am I willing to respect the license, I’m actually without capacity to change letter shapes or the like to the better. So, simply, I won’t.)<br>
      To the kerning matter: Now that I did a quick search, I find that e.g. Adobe’s Garamonds are even “licensed for modification” (cf. <a href="http://www.adobe.com/products/type/font-licensing/additional-license-rights.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Additional License Rights</a>).<br>
      I apologise, and hope the offence isn’t too great.</p>
