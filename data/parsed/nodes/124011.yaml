    <p>Hello. </p>
    <p>I need to alter the kerning in some otf fonts I use (e.g. I consider punctuation a part of the sentence rather than of the word, so I'd like the period detached from the letter please). Of course I can do that manually throughout entire books (hair space not always being exactly the right width for each individual case), or use an extensive list of grep-styles in InDesign, disadvantage of the latter being that it leaves InDesign inert to the point of freezing. Using a font design application on the other hand is not only illegal (minor issue), but damages the font or takes away some of its features (or so the glyphs' manual claims). Would any of you know a reasonable way to tackle this problem?</p>
    <p>Thanks a lot.</p>
