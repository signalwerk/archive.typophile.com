    <p>The name says it all: <a href="http://www.fontfont.com/" rel="nofollow">FontFont</a>’s just published release <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_basic_gothic_ot/" rel="nofollow"><strong>FF Basic Gothic</strong></a> – a sans serif type family of eight weights plus matching italics – is a neutral American grotesque for all purposes, something between Gill Sans, Antique Olive, and Verdana. The two Berlin-based designers <a href="http://www.fontshop.com/fonts/designer/hannes_von_dohren/" rel="nofollow">Hannes von Döhren</a> and <a href="http://www.fontshop.com/fonts/designer/livius_dietzel/" rel="nofollow">Livius Dietzel</a> conceived a typeface that shows its 120 years old roots but at the same time presents itself as a contemporary state-of-the-art font family – which is exactly what future classics are made of! </p>
    <p>FF Basic Gothic has a functional, basic look, being willful but pleasant at the same time. The letters are stripped down to their basic forms, with precise curves and straight lines, making it perform especially well in small sizes. The heavy weights have stronger contrasts and unfold their strength in bigger sizes. They have an eye-catching appearance in newspaper or magazine headlines. Its extended weight range makes it interesting for corporate designers; Europe’s largest design conference <a href="http://www.typoberlin.de/2011/" rel="nofollow">TYPO Berlin 2011</a> already trusts on FF Basic Gothic. The <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_basic_gothic_web/" rel="nofollow">Web version</a> is very suitable for online body copy - thanks to the hinting experts of the <a href="http://vimeo.com/15232514" rel="nofollow">FontFont TypeDepartment</a>.﻿</p>
    <p>As a very special Christmas present, <strong>FF Basic Gothic OT Regular is now available for free</strong> for a limited period of time on <a href="http://www.fontfont.com/downloads/" rel="nofollow">FontFont.com</a>.</p>
