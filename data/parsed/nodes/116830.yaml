      <p>Wow!!! Thanks for the help Don!! :)))<br>
      I noticed the 'e' in Futura Extra Bold that's why I posted the picture here to identify the correct font!<br>
      You've made quite some work of it! :)<br>
      The unstretched version really looks like Futura although I like this 'e' more then the original... </p>
      <p>Here's another picture of a different product of that time made by Moog:<br>
      <a href="http://3.bp.blogspot.com/_rScBRKlTdoE/TAGeXU8aV1I/AAAAAAABFyw/sQME7_mf4xU/s1600/P5280013.jpg" title="http://3.bp.blogspot.com/_rScBRKlTdoE/TAGeXU8aV1I/AAAAAAABFyw/sQME7_mf4xU/s1600/P5280013.jpg">http://3.bp.blogspot.com/_rScBRKlTdoE/TAGeXU8aV1I/AAAAAAABFyw/sQME7_mf4x...</a></p>
      <p>Here I also like the lowercase 'g' more then in the Futura Extra Bold. The 'y' seems just a bit different too.<br>
      The rest seems to be similar when scaling the whole 50%.</p>
      <p>The Ol London font is a nice find too!! Maybe I'll just go for that one!</p>
      <p>Thanks Don!</p>
