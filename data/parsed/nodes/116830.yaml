      <p>The age of photo distorted fonts.<br>
      First I cleaned up your image<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UnknownTypophile116830SM_4034.jpg"></div><br>
      Then I reduced the width to 50% -- so that the dot on the I is round not a wide oval<br>
      <div class="imageWrap"><img src="http://typophile.com/files/UnknownTypophile116830Width@50Pct_6447.jpg"></div><br>
      Now it looks more familiar.<br>
      Very similar to Futura Extra Bold, but the _e_ is different.<br>
      Don<p></p>
