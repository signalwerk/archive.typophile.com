      <p>Wouldn't script be too similar to the Chris Craft logo?<br>
      Why not have an all caps roman type (sans or serif) to contrast with the logo?<br>
      <a href="http://new.myfonts.com/fonts/agfa/stellar/" rel="nofollow">Stellar</a> is an interesting mid-century American face, a little more animated than Optima.<br>
      I like the look of colored lettering on wood, but with a fine gold outline, the metallic effect acting as a buffer zone.</p>
