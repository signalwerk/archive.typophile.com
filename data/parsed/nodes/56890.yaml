    html: |-
      <p>Nick, the CC logo goes on the hull side, and doesn't really interfere with the transom type I think. Stellar is an interesting choice but perhaps more for a cruiser kind of boat.</p>
      <p>I'll try to explain what I am looking for...</p>
      <p>First please have a look at th boat. One of the smaller pleasure crafts/ski boats that CC built at that time. One of the models were named rocket and had a hand drawn rocket silhouette on the hullside. My boat will hopefully look  <a class="freelinking external" href="http://www.mlvr.com/cc/carrot.jpg" rel="nofollow">something like this</a> one day. The rocket model: <a class="freelinking external" href="http://www.mlvr.com/cc/cc2.jpg" rel="nofollow">http://www.mlvr.com/cc/cc2.jpg</a></p>
      <p>My intention is to have a simple, kind of naive and cartoon-esque feeling on the type. That's why I am looking at hand lettering - to add that homemade look to it. Here's some references of what I'm into:<br>
      'Thunderbolt' <a class="freelinking external" href="http://www.mlvr.com/cc/thunderbolt.jpg" rel="nofollow">http://www.mlvr.com/cc/thunderbolt.jpg</a><br>
      <a class="freelinking external" href="http://www.mlvr.com/cc/type1.jpg" rel="nofollow">http://www.mlvr.com/cc/type1.jpg</a></p>
      <p>The name of the boat is Libertine and will perhaps be typed with year i.e. "Libertine '46" and followed by "STOCKHOLM" where it is located, set in a complementing sans-serif. </p>
      <p>What do you think about Charbonne, any of the oblique styles: <a class="freelinking external" href="http://new.myfonts.com/fonts/typeart/charbonne/" rel="nofollow">http://new.myfonts.com/fonts/typeart/charbonne/</a><br>
      Or <a class="freelinking external" href="http://new.myfonts.com/fonts/larabie/superheterodyne/" rel="nofollow">http://new.myfonts.com/fonts/larabie/superheterodyne/</a>. When it comes to scripts I like these, without none of them being the right one: <a class="freelinking external" href="http://new.myfonts.com/fonts/alphabetsoup/metroscript/" rel="nofollow">http://new.myfonts.com/fonts/alphabetsoup/metroscript/</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/sideshow/coffee-service/" rel="nofollow">http://new.myfonts.com/fonts/sideshow/coffee-service/</a>.</p>
      <p>Cheers,<br>
      Max</p>
