    <p>Hi,</p>
    <p>I've been doing some research to find a typeface to match my 1946 chris-craft race boat that I am currently renovating. I haven't found the right one yet though. When it comes to typefaces I realize it was popular with sans-serifs and bold display type. Which is not too bad but I want something with a bit more edge. So either that or if anyone could put me in the know of some hand lettering inspiration/fonts popular in the 40s?</p>
    <p>Looking forward to some input, thanks!</p>
    <p>-<br>
    Max</p>
  html_clean: |-
