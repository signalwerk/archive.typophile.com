  html: |-
    <p>During the 3rd International Conference on Typography and Visual Communication (Thessaloniki, Greece, this June) an exhibition will be held with the aim of capturing current trends in the design of Greek typographic alphabets. The event, co-organised by the 3rd International Conference on Typography and Visual Communication and backpacker.gr, invite typeface designers to participate in a typographic exhibition centred on the "Greek alphabet" (εα). The participants are asked to submit Greek characters sufficient to set the following sentence:<br>
    ένα αναμφισβήτητα ξεχωριστό γεγονός<br>
    The selected entries will be exhibited during the Conference, and will be included in the exhibition catalog. After the conference the exhibition might travel to other selected venues in order to be presented to a wider audience.<br>
    More details can be found at <a href="https://web.archive.org/web/20150123092607/http://ictvc.org/3/97/&amp;pid=115" title="http://ictvc.org/3/97/&amp;pid=115">http://ictvc.org/3/97/&amp;pid=115</a></p>
    <p>(on behalf of <a href="https://web.archive.org/web/20150123092607/http://www.ictvc.org/" title="http://www.ictvc.org">http://www.ictvc.org</a> , where updates will be posted)</p>
