    html: <p>A good dictionary must contain entries for the the Swadesh 200 List (which obviously contains the Swadesh 100).  I don't know if you know what the list is (it's 100/200 items and/or concepts that every language has a word for, like 'sun' or 'hand'); most dictionaries for "larger" languages will obviously include these words, but some languages--indigenous ones, for example--require a little work and research to make sure all these words are present...  believe me, it isn't always as easy as it sounds. <br> <br>Now as for your personal philosophy, it's a good one.  Ultimately one's dictionary choice is going to depend on their own personal needs; I mostly compare notes on indigenous language dictionaries, so the Swadesh list is what I look for--because these languages are relatively new to the idea of having bilingual dictionaries, the important part in the first stages of creating literature is to establish the most basic of terms.</p>
