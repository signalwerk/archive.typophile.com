  html: "<p>In another thread, JFP said: <br> <br>\"At my big surprize, the publisher wanted more pages than what my fonts and design proposed: to give to the potential buyer the feeling that he got heavy, so a complete dictionnary. If it was too light and thin, the future reader \"impression on the object\" can be very wrong: \"Hey, for the same price between two dictionnaries, this one is more heavy and features more pages, its better one for sure!\" <br> <br>I'm sure people do this, but as someone who sometimes dabbles in foreign languages, I have a different method in choosing a translation dictionary, at least. Any dictionary that contains the words \"altruism\", \"vegan\" and \"quandary\" is probably a good bet. <br> <br>Anyone else have any \"tests\" they'd like to share? <br></p>"
  html_clean: "<p>In another thread, JFP said: <br> <br>\"At my big surprize, the publisher wanted more pages than what my fonts and design proposed: to give to the potential buyer the feeling that he got heavy, so a complete dictionnary. If it was too light and thin, the future reader \"impression on the object\" can be very wrong: \"Hey, for the same price between two dictionnaries, this one is more heavy and features more pages, its better one for sure!\" <br> <br>I'm sure people do this, but as someone who sometimes dabbles in foreign languages, I have a different method in choosing a translation dictionary, at least. Any dictionary that contains the words \"altruism\", \"vegan\" and \"quandary\" is probably a good bet. <br> <br>Anyone else have any \"tests\" they'd like to share? <br></p>"
