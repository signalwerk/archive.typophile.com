    html: "<p>Ah... Google's your friend? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> \"robofog\" gets just relevant hits in Google, the third being Just van Rossum's and Erik van Blokland's page:  <br> <br><a href=\"http://www.letterror.com/code/old/robofog/\" target=\"_blank\">http://www.letterror.com/code/old/robofog/</a> <br> <br>\"RoboFog <br>RoboFog is our own tool for font production. An updated version of Fontographer 3.5 welded on top of the Python programming language makes a scriptable typedesign tool. Designers can program the functionality they need themselves.  <br> <br>Development for RoboFog has stopped. The Fontographer code was too old to be ported to OSX. Also the requirements for a good font editor went up. In the mean time we've focussed our development effort into RoboFab, a toolkit for scripting and programming with fonts and glyphs, inside and outside of FontLab. \" <br> <br>The 6th hit:  <br> <br><a href=\"http://just.letterror.com/ltrwiki/RoboFog\" target=\"_blank\">http://just.letterror.com/ltrwiki/RoboFog</a> <br> <br>\"RoboFog <br>RoboFog is a version of Fontographer 3.5 that embeds a Python interpreter. RoboFog was developed by Just van Rossum, Petr van Blokland and Erik van Blokland. It is more or less discontinued, although we fix bugs for those still using it. It's based on very old source code, and while it has served its purpose well, we've reached the limits of what we can do with it. For example it can't properly support larger character sets, unicode or new font formats. It's a classic MacOS app and won't be ported to MacOSX. These days there is FontLab, and for all its quirks, it is much more powerful than RoboFog could ever be. Our RoboFab project should make Python scripting for FontLab more comfortable. \" <br> <br>Finally, the 4th hit delivers the resolution:  <br> <br><a href=\"http://www.letterror.com/code/robofab/intro.html\" target=\"_blank\">http://www.letterror.com/code/robofab/intro.html</a> <br> <br>\"RoboFab Intro <br>RoboFab is a library of Python code for manipulation and storage of font and glyph related data. RoboFab implements a new font file format, the Unified Font Objects or .ufo for short. UFO is a format for font sources (similar to something like .fog or .vfb) except that UFO is XML based (see Glyph Interchange Format), readable, well documented and easily extended to contain different kinds of data. (...)  <br> <br>What RoboFab is not.. <br>Not entirely RoboFog MkII <br>RoboFab is not a port of RoboFog to OSX, nor is it a complete font editor with interfaces, font and glyph windows etc. It is a toolkit that you can use to build your tools with. You can start by using RoboFab to make scripting in FontLab easier. But you can also use RoboFab to build elaborate tools (for instance MetricsMachine) that read and write UFO fonts and work on the data. Other RoboFab based tools are under construction. \" <br> <br>I hope this helps.  <br> <br>Best,  <br>Adam Twardoch <br></p>"
    html_clean: "<p>Ah... Google's your friend? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> \"robofog\" gets just relevant hits in Google, the third being Just van Rossum's and Erik van Blokland's page:  <br> <br><a href=\"http://www.letterror.com/code/old/robofog/\" target=\"_blank\">http://www.letterror.com/code/old/robofog/</a> <br> <br>\"RoboFog <br>RoboFog is our own tool for font production. An updated version of Fontographer 3.5 welded on top of the Python programming language makes a scriptable typedesign tool. Designers can program the functionality they need themselves.  <br> <br>Development for RoboFog has stopped. The Fontographer code was too old to be ported to OSX. Also the requirements for a good font editor went up. In the mean time we've focussed our development effort into RoboFab, a toolkit for scripting and programming with fonts and glyphs, inside and outside of FontLab. \" <br> <br>The 6th hit:  <br> <br><a href=\"http://just.letterror.com/ltrwiki/RoboFog\" target=\"_blank\">http://just.letterror.com/ltrwiki/RoboFog</a> <br> <br>\"RoboFog <br>RoboFog is a version of Fontographer 3.5 that embeds a Python interpreter. RoboFog was developed by Just van Rossum, Petr van Blokland and Erik van Blokland. It is more or less discontinued, although we fix bugs for those still using it. It's based on very old source code, and while it has served its purpose well, we've reached the limits of what we can do with it. For example it can't properly support larger character sets, unicode or new font formats. It's a classic MacOS app and won't be ported to MacOSX. These days there is FontLab, and for all its quirks, it is much more powerful than RoboFog could ever be. Our RoboFab project should make Python scripting for FontLab more comfortable. \" <br> <br>Finally, the 4th hit delivers the resolution:  <br> <br><a href=\"http://www.letterror.com/code/robofab/intro.html\" target=\"_blank\">http://www.letterror.com/code/robofab/intro.html</a> <br> <br>\"RoboFab Intro <br>RoboFab is a library of Python code for manipulation and storage of font and glyph related data. RoboFab implements a new font file format, the Unified Font Objects or .ufo for short. UFO is a format for font sources (similar to something like .fog or .vfb) except that UFO is XML based (see Glyph Interchange Format), readable, well documented and easily extended to contain different kinds of data. (...)  <br> <br>What RoboFab is not.. <br>Not entirely RoboFog MkII <br>RoboFab is not a port of RoboFog to OSX, nor is it a complete font editor with interfaces, font and glyph windows etc. It is a toolkit that you can use to build your tools with. You can start by using RoboFab to make scripting in FontLab easier. But you can also use RoboFab to build elaborate tools (for instance MetricsMachine) that read and write UFO fonts and work on the data. Other RoboFab based tools are under construction. \" <br> <br>I hope this helps.  <br> <br>Best,  <br>Adam Twardoch <br></p>"
