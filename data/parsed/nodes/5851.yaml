    html: "<p>Three Italic fonts die together in a bad <br>book design and go to Typo-Heaven. <br> <br>When they get there, St. Peter Karow says, <br>\"We only have one rule here in Typo-Heaven: <br>Don't step on the Dutch!\" <br> <br>So they enter heaven, and sure enough, <br>there are Dutch all over the place. <br>It is almost impossible not to step on a Dutch, <br>and although they try their best to avoid them, <br>the first Italic accidentally steps on one. <br> <br>Along comes St. Peter with the ugliest Roman <br>she ever saw. St. Peter put them together <br>in a suitcase and says, \"Your punishment <br>for stepping on a Dutch is to spend eternity <br>chained to this ugly Roman!\" <br> <br>The next day, the second Italic steps accidentally <br>on a Dutch and along comes St. Peter, who doesn't <br>miss a thing. With him is another extremely ugly Roman. <br>He chains them together with the same admonishment <br>as for the first Italic. <br> <br>The third Italic has observed all this and, <br>not wanting to be chained for all eternity <br>to an ugly Roman, is very, VERY careful where she steps. <br>She manages to go postscript months without stepping <br>on any Dutch. <br> <br>One day St. Peter comes up to her with the most handsome <br>Roman she has ever laid eyes on. St. Peter chains them <br>together without Word. <br> <br>The happy Italic says to the Roman, \"I wonder what I did <br>to deserve being chained to you for all eternity?\" <br> <br>The Roman says, \"Well, I don't know about you, <br>but I stepped on a Dutch!\" <br> <br> <br> <br>Copyright (c) Alessandro Segalini, 2004. <br> <br></p>"
    html_clean: "<p>Three Italic fonts die together in a bad <br>book design and go to Typo-Heaven. <br> <br>When they get there, St. Peter Karow says, <br>\"We only have one rule here in Typo-Heaven: <br>Don't step on the Dutch!\" <br> <br>So they enter heaven, and sure enough, <br>there are Dutch all over the place. <br>It is almost impossible not to step on a Dutch, <br>and although they try their best to avoid them, <br>the first Italic accidentally steps on one. <br> <br>Along comes St. Peter with the ugliest Roman <br>she ever saw. St. Peter put them together <br>in a suitcase and says, \"Your punishment <br>for stepping on a Dutch is to spend eternity <br>chained to this ugly Roman!\" <br> <br>The next day, the second Italic steps accidentally <br>on a Dutch and along comes St. Peter, who doesn't <br>miss a thing. With him is another extremely ugly Roman. <br>He chains them together with the same admonishment <br>as for the first Italic. <br> <br>The third Italic has observed all this and, <br>not wanting to be chained for all eternity <br>to an ugly Roman, is very, VERY careful where she steps. <br>She manages to go postscript months without stepping <br>on any Dutch. <br> <br>One day St. Peter comes up to her with the most handsome <br>Roman she has ever laid eyes on. St. Peter chains them <br>together without Word. <br> <br>The happy Italic says to the Roman, \"I wonder what I did <br>to deserve being chained to you for all eternity?\" <br> <br>The Roman says, \"Well, I don't know about you, <br>but I stepped on a Dutch!\" <br> <br> <br> <br>Copyright (c) Alessandro Segalini, 2004. <br> <br></p>"
