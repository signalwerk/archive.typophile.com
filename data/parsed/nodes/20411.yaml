    <p><a href="http://www.flickr.com/photos/46746624@N00/sets/72057594139789886/" rel="nofollow">Letras Latinas 2006 flickr pix</a></p>
    <p>The exhibition finished in Brazi, Chile, Mexico, Peru, Uruguay, Venezuela, Colombia and Argentina last week and is going to TypeCon in august. This pictures were taken by Miguel Angel Vivanco from Chile and they show the 70 works selected over a total of 425 summitions.</p>
