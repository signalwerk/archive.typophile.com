    html: |-
      <p>They're terrific Ray!<br>
      It is so good to see hand-work at that scale and level.<br>
      The beauty is in varying letterforms, hand-penned, not "perfect" or sterile... the viewer is reminded that EACH CHARACTER was crafted and like snowflakes none are identical.</p>
      <p>A good reminder that we needn't be so <em>font dependent</em> all the time.<br>
      ----------------------------------------------------------------------<br>
      <em>Can somebody tell me what font was used for the Coca-Cola script?</em> ;-)</p>
