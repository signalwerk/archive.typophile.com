  html: |-
    <p>Hey, I do a weekly comic published here in the foggy wonderland that is Halifax, Nova Scotia, and thought you guys might appreciate it. It's almost purely typographic, hand-drawn, and there are at least three people who like it alot. So let's make it upwards of five, and I'll have achieved everything I have eveer set out to do, and can go hibernate or something. </p>
    <p>It's called the hall of best knowledge and you can see the first 25 or so here:</p>
    <p><a href="http://www.flickr.com/photos/rayfenwick/sets/787564/" rel="nofollow"><strong>http://www.flickr.com/photos/rayfenwick/sets/787564/</strong></a></p>
    <p>Anyways, I hope you like it. I've lurked here for a long time (love the forum widget) so it's nice to *participate*. </p>
    <p>Respectfully,<br>
    Ray Fenwick</p>
