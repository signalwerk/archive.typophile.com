    <p>Hi<br>
    Making a logo for a medical centre named "Legenes Legesenter" (it is close to the real name). Initials are "LL". The sketch illustrates how I ended up with the symbol at the bottom right. It contains one positive and one negative "L", and a heart. Not sure if this is the best solution? I like some of the "calligraphic" shapes but they tend to look like eyes, mouths etc.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/brainstorm_6395.gif"></div><p></p>
    <p>Now I am searching for a "medical" font that fits this symbol. If anyone has a suggestion I'll be happy to try it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/legesenter_3575.gif"></div><p></p>
