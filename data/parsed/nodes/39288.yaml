      <p>I love the heart/stethoscope mark. The gradients dull the contrast in your logo, and make it look less clean - I'd get rid of them.</p>
      <p>I really like the reversed version - it looks much cleaner and appropriate for a medical centre than the top example. I think it could work on white if you just removed the outermost stroke. I'd also remove the black stroke around the centre circle to make it less busy.</p>
      <p>The green colour really evokes Starbucks to me. I'd go with blue instead. Try to work in some red or pink into the mark - maybe just in the small circle within the heart.</p>
      <p>Overall, great work.</p>
      <p> - Lex</p>
