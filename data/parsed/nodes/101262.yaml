      <p>Lanston Monotype also had a Modern Antique which was not condensed, although it doesn't look that much wider...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/26_modantique_4018.jpg"></div><p></p>
      <p>For comparison, Modern Antique Condensed from the same source:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/76_modantcond-good_4616.jpg"></div><p></p>
      <p>One can see that the lower case alphabet doesn't quite span as much of the upper case alphabet in the condensed version, but the difference is subtle.</p>
      <p>Of course, the note that the Condensed one uses the C1 case arrangement, and the regular one the C2 case arrangement, means that the metrics are fully specified:</p>
      <p>C1:</p>
      <p>5) il<br>
      6) fjt<br>
      7) I r<br>
      8) csz<br>
      9) $ 0123456789 J aegopqvxy<br>
      10) bdhknu<br>
      11) FLSZ<br>
      12) ABCEPTVXY<br>
      13) RU w<br>
      14) DGKOQ<br>
      15) H m<br>
      18) MW</p>
      <p>C2:</p>
      <p>6) il<br>
      7) fj<br>
      8) I rst<br>
      9) $ 0123456789 cevxz<br>
      10) J agoy<br>
      11) S bdkpq<br>
      12) EFLPZ hu<br>
      13) ABCTV<br>
      14) DNOQRUY w<br>
      15) HKX<br>
      18) MW m</p>
      <p>In the book "The Monotype System", C1 is described as applying to normal boldfaces, "those not extended", and C2 to the extended boldfaces. However, one can change the set width for a condensed or wide face with any matrix-case arrangement, of course.</p>
