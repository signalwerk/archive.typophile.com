      <p>But on the other hand, it has stroke contrast, so it isn't a typical "Egyptian".</p>
      <p>EDIT: Incidentally, I came across (or rather, was reminded of) a book typeset in Ionic No. 5.</p>
      <p>The book was "A Guide to Fairy Chess" by A. S. M. Dickins.</p>
      <p>As the book was originally published in a short print run, I'm thinking the likely cause is that it was simply the only typeface the typesetter chosen had in a small point size - and economy was sought.</p>
