      <p>From the Sentinel blurb: "[Clarendons are] tough to use — out of the question for setting text — because they lack italics."</p>
      <p>1) Some Clarendons do have Italics. Just because the first ones didn't doesn't set that in stone. There's nothing "anti-Italic" in the Clarendon genre, at least not more than many other genres.<br>
      2) That sounds very dogmatic. With enough weights one can avoid Italics, which I myself actually find unintelligent. Look at Typo magazine (still?) to see how. It's not that Italics is useless, but saying "out of the question" is a bit much.</p>
      <p>Anyway, is Sentinel "humanist" enough? It looks like just another Clarendon (albeit very complete and polished). That said, I think we need some more parameters, Rafael.</p>
      <p>BTW I think Parable is very beautiful in a more important way than mere looks: reading. To me Pretty has little place there.</p>
      <p>hhp</p>
