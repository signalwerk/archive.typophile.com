    html: |-
      <p>Sentinel</p>
      <p>I have a fondness for Clarendon's as they were used commonly in Scotland along with Helvetica in the early 1970s, and I associate them with happy times climbing around mountains there. I also have a pocket Oxford English Dictionary from 1939 that I really like - which is all in Clarendon. It may not be the most readable but is a lot better looking than the ugly Parable font. The problem is, I don't really know when Clarendon's are useful. I think they are better in advertising than for prolonged reading. I don't think they are as popular as they were in a more industrial time, and polishing up Clarendon may defeat that industrial look.</p>
