    <p>Hello, I'm looking for a type that looks similiar Clarendon but with a more humanistic and opened look to it, for printed long reading. Can anyone give me suggestions?<br>
    Thank you.</p>
  html_clean: |-
    <p>Hello, I'm looking for a type that looks similiar Clarendon but with a more humanistic and opened look to it, for printed long reading. Can anyone give me suggestions?<br>
