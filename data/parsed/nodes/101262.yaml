      <p>Before being replaced by a different version, the New American Bible (very shortly after the Confraternity version was completed, so it no longer had to rely on the Douay Old Testament) it was used widely in Catholic schools. (Actually, the next common Bible in Catholic schools used the New Testament from the New American Bible with the now-completed Old Testament from the Confraternity version.)</p>
      <p>What had made me so confident that it was a Lanston Monotype face to persevere till I found it was that the footnotes</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/books006_5759.jpg"></div><p></p>
      <p>clearly matched Lanston Monotype's No. 2.</p>
      <p>Incidentally, the Cincinnati Type Foundry used the name Modern Antique Condensed for a completely different typeface, which was a Latin (wedge serif) rather than a Clarendon.</p>
      <p>In looking for legible typefaces used in Bibles, I found Lucerna, Veritas, and Lexikon, none of them Clarendons. (The first two were specifically designed for Bible translations; the third, for a dictionary, and later used in Bibles.) Continuing on with the search, I encountered Nimrod - and Minion and Monticello, beautiful typefaces, but, not being designed for super-high values of optical legibility, stowaways in my search results.</p>
      <p><cite>is Medieval Clarendon specifically a letterpress type? I cannot find a specific mention of "Medieval" Clarendon in digital format</cite></p>
      <p>I didn't know the answer to that, but now I've found a page,</p>
      <p><a class="freelinking external" href="http://www.cambridge.org/index.php?cID=81572" rel="nofollow">http://www.cambridge.org/index.php?cID=81572</a></p>
      <p>which gives me some insight into the matter. The edition of the Bible in question is a photographic reproduction of one printed by letterpress means in 1920. However, it has been retouched to be as sharp and clear as if it were newly typeset.</p>
      <p>I had thought the face might be a proprietary digital one, because before I had thought this might be an entirely new edition, even if the style of printing is reminiscent of older Bibles. I think I have seen Bibles in a typeface which much more strongly resembles this particular face than Modern Antique Condensed does.</p>
      <p>A search finds several Bibles in this typeface, all from Cambridge. The Cambridge catalog also references one Monotype face, Goudy Old Style Bold 441, and two from Miller and Richards, Modern Number 2 and Old Style Antique. But the names Mediaeval and Clarendon are not used by them - but they are used by the Fann Street Foundry of Reed and Fox.</p>
      <p>Monotype New Clarendon and URW++ Volta are interesting light wide Clarendons.</p>
      <p>Ah, I've found a Clarendon Bible formerly published by Oxford, now brought out by R. L. Allan. And Domine, a Google Web Font with some Clarendon influence.</p>
      <p>Ah, I've found some references to a typeface called "Brevier Blackface".</p>
      <p>Also, I've seen one Bible set in Bookman Old Style, which seems to resemble a traditional legibility face.</p>
      <p>EDIT: I have now found this specimen book, from Bauer, which eventually bought Flinsch, online,</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/hauptprobeingedr00baue" class="freelinking" rel="nofollow">https://archive.org/details/hauptprobeingedr00baue</a></p>
      <p>which contains a typeface at least similar to the Mediaeval Clarendon:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bauer_med_5024.jpg"></div><p></p>
      <p>Interestingly enough, they have Jenson Old Style in that book too, and they call it Elzevir!</p>
      <p>However, the Petit size (8 Didones) of this face is number 1026; 1159 is a Petit as well, but of Enge Antiqua, a completely different and very condensed face.</p>
      <p>This is a 1938 specimen book, so it is after Flinsch and Bauer merged.</p>
      <p>Note that neither the Reed &amp; Fox Mediaeval Egyptian nor their Mediaeval Egyptian No. 2 resembles this.</p>
