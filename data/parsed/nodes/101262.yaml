      <p>I've seen more detailed references to that typeface now; it was used in the Cameo edition of the Bible from the press of the University of Cambridge, and it was called Petit Mediaeval Clarendon 1159. I suspect that the number means it is a Monotype face.</p>
      <p>EDIT: I've seen no references to a Monotype Series 1159. However, the Cambridge Bible catalogue does refer to another Bible as being set in Goudy Old Style Bold (the displayed sample doesn't look like it) 441, and that <em>is</em> a Monotype series number.</p>
      <p>Other Bibles are set in faces from Miller and Richards, such as their Antique Old Style (the face by Henry Taylor Wyse that was later revived by Alexander Phemister as Bookman) and their Modern Roman No. 2.</p>
      <p>EDIT: It was the Fann Street Foundry of Reed and Fox that was the successor to Belsey, so they had the right to the name Clarendon; and I see they used the name Mediaeval for their version of the Phemister Old Style, and, in addition, they had a Mediaeval Egyptian.</p>
      <p>So, although I can't find their later specimen books - or even, at the moment, a reference to indicate what their name was in 1920, if they were still in business - at the moment I am now going to suspect it was from them that Petit Mediaeval Clarendon was obtained.</p>
      <p>EDIT: Well, MyFonts tells me that Stephenson Blake took their stuff in 1906, so that settles it.</p>
      <p>EDIT: If one leaves off the Petit, the Flinsch typefoundry had a typeface called Mediaeval Clarendon which was designed in 1878 by one W. Kirkwood.</p>
      <p>Ah, here he is:</p>
      <p><a class="freelinking external" href="http://luc.devroye.org/fonts-41678.html" rel="nofollow">http://luc.devroye.org/fonts-41678.html</a></p>
      <p>and I've seen Windsor in a recent Letraset catalogue.</p>
      <p>EDIT: I've seen a showing of a specimen in a magazine about printing. Schmale Mediæval-Clarendon, from Flinsch, is highly condensed, and so it isn't the Petit Mediæval Clarendon used in Cambridge Bibles, which is quite wide.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kirkwood_4135.jpg"></div><p></p>
      <p>However, there is still hope. Perhaps while Schmale means condensed, Petit doesn't, and is the name for the point size (as illustrated in this image!) used by mistake.</p>
      <p>Unlike any other Clarendon I've seen before, it does have one important characteristic of the Bible face in question: a capital J that descends below the line.</p>
