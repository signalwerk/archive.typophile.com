    html: |-
      <p>This type of error message appears whenever a request is made for a file that can't be found. Usually it would be a direct request from a link or URL, in which case the page would actually display a google site-search for the missing file. In this case, it's the site's favicon file that's missing, which is requested through a link tag in the HTML. The frequency and nature of this request seems to vary between browsers.</p>
      <p>The link tag gives the location of the favicon as <a href="http://typophile.com/files/typophile_favicon.ico" title="http://typophile.com/files/typophile_favicon.ico">http://typophile.com/files/typophile_favicon.ico</a>, which does not exist. There is a favicon file at <a href="http://typophile.com/favicon.ico" title="http://typophile.com/favicon.ico">http://typophile.com/favicon.ico</a>, although it's different than the one cached in my browser.</p>
