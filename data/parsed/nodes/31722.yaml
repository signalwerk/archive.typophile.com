    <p>I’m revising an article for a journal whose main (well, only) typeface is New Caledonia (or a look alike; they managed to stop printing ligatures in 1999, so they may have changed printers and fonts or they dropped that drawer), and I’m looking for a companion sans serif for figures and maps. I know, I know, I should be using the body typeface for the figures as well. I go back on forth on that point with a rather regular frequency, and I’d like to at least see it in a sans that matches better than Gill, Futura, Cronos, or any of the others I’ve tried.</p>
    <p>As an aside, I’m rather disappointed that, of fonts I have (which includes the Adobe Type Classics collection), very few of them have a prime symbol. (Also used for feet and minutes lat/long.) Helvetica has one, and some faces’ apostrophes work, but not always.</p>
