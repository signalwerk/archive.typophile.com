  html: |-
    <p>So whatever this is, it's very close to Helvetica Bold or Arial Bold, but some of the glyphs are different. You can see the A, M, K, and S are all a bit different. This was not done on a computer, but probably some other kind of titling system in the analogue days, so a more direct match might not exist?</p>
    <p>In the picture, the top (the yellow) is the original, the bottom are my approximations using Helvetica and Arial. Overall, the original looks thicker...</p>
    <p>I'm working on restoring these credits, so any help in getting this closer to the original would be, well, helpful. :)</p>
