    html: |-
      <p>In a case like this its worth asking whether the film-maker wanted a special effect for the titles or merely wanted to inform.<br>
      If the latter then you could examine what the film-maker and his production people would probably consider as appropriate font options.<br>
      Helvetica would definitely have been familiar to a film maker in the 1990s.<br>
      As for Arial I am not certain precisely when it became widely known. It was designed in the 1980s for a laser printer and promoted as a font for IBM/Microsoft computers from the early 1990s onward.<br>
      BTW your film may predate the use of digital fonts for film titles.<br>
      In these circumstances I would go with Helvetica.<br>
      Don</p>
