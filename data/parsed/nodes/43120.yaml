      <p>I’d echo Patty, and add:</p>
      <p><cite>2. . . . Also the first paragraph under a head is usually not indented.</cite></p>
      <p>Unless you also indent the head. But generally, a flush subhead is more serviceable; less true for chapter head, unless, as in your case, chapters don’t start a fresh page.</p>
      <p><cite>3. Try to align your columns if possible.</cite></p>
      <p>And if you can’t, one accepted conventing is that the inside columns are shorter, which would also solve the problem of not having the last line of the paragraph start a new column.</p>
      <p><cite>4. I might adjust the proportion of your chapter title to your chapter number. As it is now, CHAPTER 2 stands out more than “Alphabets”. It’s less important. I’d try to reverse that emphasis.</cite></p>
      <p>Right. Pure size is one way. Another way to lessen the impact of a larger element is to screen it. If, for example, you are using a large figure for the chapter number, and you want it to balance better with a smaller chapter title, you  might screen it. The same would apply to a drop cap. Not to say you should, it is just one more tool.</p>
