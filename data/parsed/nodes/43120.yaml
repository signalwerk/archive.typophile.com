      <p>I think the gutter between the columns looks tight - as a result the two columns look jammed together in all that white space. Since you said this book is heavily illustrated it might be helpful to see how you intend to treat the pictures and captions as well.</p>
      <p>And a few design comments:</p>
      <p>1. Never start a column with the last line of a paragraph if you can avoid it.<br>
      2. Your paragraph indent is a little small - barely perceptible. Also the first paragraph under a head is usually not indented.<br>
      3. Try to align your columns if possible.<br>
      4. I might adjust the proportion of your chapter title to your chapter number. As it is now, CHAPTER 2 stands out more than “Alphabets”. It’s less important. I’d try to reverse that emphasis.<br>
      5. You have a mix of lining figs (in the text and main title) and osf (in the chapter number). I’d make those consistent - or spell out the numbers in the cn’s. Also be consistent within the body of the text about how you refer to the chapter numbers.</p>
      <p>OK that’s all for now.</p>
