    Hey guys, first post ever. Anyway.<br>
    Here’s a sample of a book I’m doing for a graphic design history class, and was just wondering what you guys thought. I chose that format because there will be tons of illustrations throughout the book, and not much body copy. Is that a good proportion for the copy in relation to the page size?<p></p>
