    <p>I'm curious to know what schools folks feel have the strongest graduate programs in type design (primarily in the US but also the UK). I'm personally not looking to apply in the immediate future, just interested in learning about places to consider down the line. </p>
    <p>Also, what are people's thoughts/arguments for the necessity of a concentrated masters in typography to practicing the profession? Are there shorter-term certificate programs out there you think would be as beneficial as a two-year graduate course?</p>
