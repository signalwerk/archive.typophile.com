    html: |-
      <p>Read the archives. There isn't really a dedicated type design program in the US. The only program in the UK is the one at Reading. I believe it is a faster way to boost your skills than practicing on your own, but as you see from James' comments above, that is not a universal opinion.</p>
      <p>I agree that you need to have spent some noticeable time up front doing type design and studying before going to grad school. You'd probably need to have done so just to get in, anyway.</p>
      <p>Cheers,</p>
      <p>T</p>
