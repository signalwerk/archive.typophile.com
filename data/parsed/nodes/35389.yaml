      <p>Peter, I was at a similar stage before I looked into coming to Reading for the MA — a lot of experience with design and typography, and perhaps just enough knowledge to be intimidated by type design itself. For me, the decision to go back to school had a lot to do with wanting to focus on type design without the distraction of other work once and for all. It’s a luxury to turn one’s back on earning a living for a while and devote all your time and attention to something new. Hopefully, the investment will also have a good return. What we get at Reading is advice from smart and talented people (which you can get elsewhere) and access to some really fantastic collections of historical artifacts (which you can see your own of you wished to), but most importantly we get the time to pour all of our energy into learning and a lot of support for doing that as efficiently as we can. </p>
      <p>It’s very, VERY self-directed here, which is important to consider. It’s not step-by-step instruction in calligraphy, using FontLab, or writing OpenType features. We get a lot of history, a lot of perspectives on how things have been done and how things are being done now, but it’s up to us to figure out what to do with all of that information. That’s great for some people, frustrating for others. (Well, it’s been frustrating for all of us at some point or another.) If we’re doing good work lately, it’s really because we’ve gotten the chance to keep at it, and we’ve gotten a lot of good feedback on the things we have tried.</p>
