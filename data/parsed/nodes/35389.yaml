      <p>I recommend the Reading programme pretty unreservedly to anyone who works well in a structured learning environment. I’ve spent some time running a workshop there, have visited several times, know several years-worth of graduates, and I’m very impressed with the programme.</p>
      <p>I’m self-taught in type design, learning from doing and from books and from colleagues, and I’m very much aware that this is not an efficient method to learn the stuff I have had to learn. If you work well in a structured learning environment, with a pretty heavy workload including not only design but a research and writing component, can handle British institutional lunches and English weather, I think Reading is an excellent opportunity.</p>
      <p>Some other people on this list have suggested that an internship might be better, but I don’t see a lot of internships in type design: what I see is companies hiring Reading graduates (Hoefler &amp; Frere-Jones, Porchez Typofonderie, DaltonMaag, Monotype, Linotype...)</p>
