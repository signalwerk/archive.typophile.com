      <p>It is also great in that it gives you an opportunity to develop a broad range of skills, both aesthetic/design and more technical.</p>
      <p>Also, you can add Adobe to the list of companies who have hired recent Reading grads. IIRC, three of the final five candidates for that position were Reading grads (and one went to KABK).</p>
      <p>Regards,</p>
      <p>T</p>
