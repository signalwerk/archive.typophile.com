      <p>&gt; they cannot usually afford to take on an intern inclusive of pay for much time because they are so busy themselves and don’t really have the time.</p>
      <p>That implies but doesn’t state what I think of as the “real problem” with internships, which is that the learning curve is so lengthy that we think a three to six-month period would be lucky to break even for Adobe - if we weren’t paying anything. Add a salary to the mix and it’s probably nine months to a year before the internship is a net benefit to us.</p>
      <p>At least, that’s what I remember coming up with as rough estimates the last time David Lemon and I briefly kicked the idea around.</p>
      <p>Now, that’s assuming the person is not yet at the skill level where we’d hire them if we had an opening. If somebody wanted to intern who was coming in with Miguel’s level of skills, that might be different. But if they’re that good, they’ll probably be able to find a real job, and I’d feel bad about exploiting them as an intern....</p>
      <p>Regards,</p>
      <p>T</p>
