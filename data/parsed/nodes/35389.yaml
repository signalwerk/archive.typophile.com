      <p>I am currently in the midst of my MA in typeface design at Reading so I can speak from firsthand experience about the program.</p>
      <p>It’s really fantastic. But, learning is a highly individualized process and what works for one person might not be right for another. I’ve personally benefited from being able to focus on type design for a year and not have anything else pulling for my attention. I’ve also met and learned from countless amazing people who would not have otherwise had the time to take a role in my learning process. And, having the world’s greatest set of eye’s - Gerard Unger - review your typeface isn’t bad either.</p>
      <p>&gt; That sounds like an awful lot of school to me</p>
      <p>As a woman working on her 2nd masters... school doesn’t always have to be about what career path you end up on, it can also be about the journey and the knowledge. Sometimes, it’s nice to take that journey with 14 others (the current class at Reading) rather than go it alone. But, just depends on you.</p>
