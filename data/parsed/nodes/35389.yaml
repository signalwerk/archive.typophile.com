      <p>An apprenticeship/internship is an good option, if you can find one. I went through the Reading MA years ago, and now occasionally lecture and give design crit there, but I’ve also taught a few apprentices. I personally prefer the long-term apprenticeship method. However, an apprenticeship tends to mold your knowledge around that of your ’master’. If the ’master’ is someone like Robert Slimbach or Matthew Carter that is a very very good thing. But it can be rather one-sided, and the expertise and tasks you may learn may only cover a portion of the knowledge needed for an independent type designer. It can also sometimes hold you back if your growing design sense differs from your master’s.</p>
      <p>The big benefit of a place like Reading is the breadth of voices speaking into your learning and work. I vividly remember times when Gerry would suggest I make this or that change, then have Gerard say the opposite! It forced me to understand <em>why</em> they suggested what they did - their experience, knowledge, personal taste, etc. - and come up with my own sense of design purpose. Now I find myself being a third or fourth voice, and helping the students in my particular strengths.</p>
      <p>I designed type for 9 years before going to Reading, and the main reason I went was my own dissatisfaction with my work. I needed a stronger theoretical and historical foundation, and regular, expert review of my stumbling efforts. That is very possible through an internship, but just be sure that you still have a variety of voices around you.</p>
