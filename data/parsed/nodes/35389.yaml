      <p>I think I may be echoing a my fellow class mates here, as this was an opportunity to concentrate on learning how to do this, wonderfully mysterious thing called type design for only a year of my life. Of course, I won’t feel like a type designer until I’ve worked on a variety of different projects, but definitely feel like I have the skills to go off on my own and explore further, and I hope to get a job in this field. Personally self-taught wouldn’t work for me, even with the all the reading I’ve done this year, the most valuable feedback has been from Gerry, Gerard Unger, Victor Gaultney and other lecturers all giving their own unique perspectives. The very fact you’re doing it every day, tunes your eyes into the details. Despite my graphic design background, I felt I was starting afresh, which was terrifying, but inspiring at the same time. </p>
      <p>Plus don’t underestimate the opportunity to do a non-Latin! This year we had Greek, Cyrillic, Gujariti, Tamil and Devanagari, I really enjoyed tackling an unfamiliar script.</p>
      <p>In the end, it comes down to self-discipline and access to willing and informed critics. Although the course requires mainly self-directed work, this would be easier to avoid in the real world with other projects on the go. Also having the receptive eyes and ears of the type designers we’ve had access to, may not be as easy as outside.</p>
