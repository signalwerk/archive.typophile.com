      <p>Are these even mutually exclusive? Just like applications grow more feature rich based on consumer demand, the demands for font technology will only rise. Users will be interested in highly automated, open-type loaded, multilingual faces that are suitable for text, but workable into display proportions. Super-superfamilies that extend beyond latin-based glyphs, that you can dial from historic to pomo, come after that. There may be some major innovations in font management interfaces that is required to permit that demand to blossom, but it will happen.</p>
