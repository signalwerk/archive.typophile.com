      <p>I think you have to just do it to see if is what you want to do. You say you are a stickler for tradition and don’t want to start messing with type as a hobby. To design type, you have to get your hands dirty. If you want to do it in a traditional way, fine. If you want to do it in a  different way, fine as well. You won’t know what any of that means until you do it though. If after you bang your head at it in the solitude of your own home for a year or so, you decide to attend a very fine school like Reading, you will know what to expect and be better able to absorb what the school has to offer. You must bring something to the school before you can carry even more away as you leave it. Schools are not a magic wand, they will not inject you with knowledge and skill. They will take what you bring using the effort you expend to expand who you are. </p>
      <p>ChrisL</p>
