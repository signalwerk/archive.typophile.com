    <p>I studied a BA in graphic design, then an MA in communication design (typography). I have done really well in the graphic design profession, but I also want to design typefaces. I have always been obsessed with type design, but every time I become inspired to design a typeface, there are so many questions which get thrown up due to my not having actually studied in-depth character analysis, that I lose confidence. I know a lot about type/history of, but the actual act of drawing a glyph I think you need proper training in. </p>
    <p>Yes, there are great type designers that never went to Reading for instance – Jeremy Tankard, Sebastian Lester, etc. But I feel like I need some formal training. </p>
    <p>What do people think? </p>
    <p>Feedback would be very welcome as I’m thinking of applying for an MA in type design.</p>
