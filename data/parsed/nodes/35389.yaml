      <p>&gt;I just don’t feel well enough qualified to draw type.</p>
      <p>I think this is a bit misguided. As James—<a class="freelinking-external" href="http://terminaldesign.com/">who knows</a>—says, the only way you can become good is by doing it *a lot*—and there are no guarantees. Schooling, apprenticeship, getting guidance from Foundries, calligraphy, going to conferences—all can help—but the central process is hours, days, months and years of drawing type. </p>
      <p>By way of illustration, Typophilers John Hudson and Eric Olson, both successful type designers, withdrew from sales their typefaces from their first seven years of work. They evidently felt that after seven years of drawing type their products were on a higher level. </p>
      <p>Another Typophiler, Kris Sowersby had been posting stuff here for four years, and is now collaborating with some of the best in the business. If you are interested, you can search here in the critiques and see the evolution of the skills of a very talented guy.</p>
