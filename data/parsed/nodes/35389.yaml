      <p>Hi, thanks for the feedback again – I have been to many type conferences in London, including many at St Brides, which were always great, (I will try and make it to the Atypi at Brighton). They are all very informative and very interesting, but I’m not sure how much it will aid me in the long run.</p>
      <p>With regards to an internship – very difficult to get by on – therein make enough money to exist! I’ve been to see Sebastien Lester at Monotype, Dalton Maag, The Foundry, Jeremy Tankard, I got offered some work at Barnbrooks studio a couple of years back, but unfortunately they cannot usually afford to take on an intern inclusive of pay for much time because they are so busy themselves and don’t really have the time.</p>
      <p>Outside of this it is my own hard work and graft granted, but I think especially within the field of type design, where having to learn the technique of drawing letterforms is integral to the work (as opposed to Graphic Design and Typography which are more instinctive/personally expressive to an extent, regardless of ’rules’). I would relish the environment of somewhere like Reading, it’s not just the teaching at Reading, it’s the network of similar minded students which you are less likely to find on other graphic design/typography courses – (even within my own group at St Martins, there was only one other student with an interest in type design).</p>
