      <p>Thomas hits the point squarely. A few years back, we used to hire interns from design schools. The problem was, by the time you had them trained well enough to help you, they were gone. The other end is, the time you spent training them was time you could not spend doing work so if you were in a crunch, they likely sat around bored until you met your deadline. It was tough meeting your mentoring obligation while making your deadlines. The interns that showed the most initiative and who were self-starters tended to get the most attention. Those who sat quietly, rarely got as much attention as the self-starters. The message is, if you are not given enough to do, do something on your own as a learning problem and ask for a quick crit. The other message is that design is a business that has to complete work to prosper. You have to be on the plus side, not the minus side, in your efforts as an intern. This is not easy and takes determination and team spirit. </p>
      <p>ChrisL</p>
