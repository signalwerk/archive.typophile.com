      <p>As far as books, I like most Bringhurst’s ’Elements of Typographic Style’, Walter Tracy’s ’Letters of Credit’ and Doyald Young’s ’Fonts and Logos’. The best single instructional manual is <a class="freelinking-external" href="http://briem.ismennt.is/2/2.3.1a/2.3.1.01.notes.htm">Briem’s great site</a> on line. </p>
      <p>These and other great links and resources you can find here in the <a class="freelinking-external" href="http://typophile.com/node/12369?">’How To’</a> section of the typowiki. </p>
      <p>I came to type three years ago with no formal training in art or graphic design. I can report that it took me two years before my eyes would tell me not only that something was wrong, but how to correct it. This was by constant constant drawing and re-drawing, and in FontLab comparing to outlines of typefaces I admired. </p>
      <p>Existing typefaces are the one indispensable teacher, and the font programs that give you the outlines are like x-rays. And you can paste one outline over another to compare. There are no secrets, except those in plain sight—which do take a lot of looking and thinking to understand.</p>
      <p>In a sense, all learning is self-instruction. The difference is whether you have guidance. I think guidance can save you a lot of work and grief, but it doesn’t have to come only from a formal program; there are other avenues. </p>
      <p>That being said, the advantage of a formal program if it is good—and Reading and KABK seem to be good—I would think is that ideally you will get all sides of the type design: the technical, the artistic, the craft, the historical, the commercial. Most people I think will find one or another area more difficult to get by self-instruction than another.</p>
