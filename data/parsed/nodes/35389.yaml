    html: <p>Just echoing what James said. I didn’t take classes to design type, the closest I got to education in type was typography, which is very useful and valuable, but it sounds like you’ve got that covered. So the only thing remaining is to get type design software, start sketching and digitizing, and keep refining your work. You don’t graduate from type school suddenly able to design large complex type systems anyway. Do a few manageable projects to get some experience. Start with a display face that you intend to use in layouts. And show your work here in the critique forums!</p>
