      <p>I am certainly getting the message that you want some structured, authoritative guidance. I understand that desire. What may not be clear from Simon’s message is that previous to about 10 years ago, there simply was NO PLACE such as you imagine; which is to say that in the 20th century, ALL type designers were self-taught, more or less. Now, undoubtedly someone will come along to nit-pick about that statement, but as a generalization, I can safely say that most type designers were never trained; they used the momentum of their own interest, sustained over years, and a lot of time spent looking, drawing, looking, reading, looking, drawing, digitizing, etc to develop their skills. </p>
      <p>There really is no magic bullet or neatly-encapsulated program in general; the possibility of a type design education is a very new thing. But people can get involved in type design from nearly any direction; there are mathematicians, calligraphers, architects, signpainters, dancers, advertisers, graphic designers, stonecutters, and programmers who have found their way successfully into type design. </p>
      <p>It sounds like you intend to then use the skills in type design in your business. I think you are already positioned to do this better than almost anyone; you have clientele in graphic design, you have experience in that industry, you have a connection to trends and client taste, and you have proficiency with graphic design tools. There is really very little left for you to acquire or add to that mix to successfully build lettering, type design and custom type into your practice. It’s really true; as scary or unsupportive as it may sound, simply start doing it. There is no licensing board!</p>
