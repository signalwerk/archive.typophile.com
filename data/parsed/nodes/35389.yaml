      <p>&gt;Yes, there are great type designers that never went to Reading for instance – Jeremy Tankard, Sebastian Lester, etc. But I feel like I need some formal training. </p>
      <p>You need a bit of history here. Until Gerry set up the Type Design MA a few years back there was no formal type design program at Reading. For sure the odd undergrad would do type design as their personal project, and FOG was installed on many of the Macs. I recall, and others can correct me if I’m wrong, that Prof. Twyman and others on staff would warn students away from seeking careers in type design - probably wise advice in 1993, before the Web allowed people like Jeremy the opportunity to prove and promote themselves without being part of the foundry system.   </p>
      <p>I think in five or ten years time when you look at active type designers, you’ll see that the Reading MA grads will make up a good portion of those at the top of the game.</p>
