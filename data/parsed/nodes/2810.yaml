    html: <p>AFAIK, in FL's Font Info window, in the 'OpenType-specific font names' window, you need to enter 'Stratum' as the 'Family Name', and the requisite style as the 'Style Name'. The info in the 'Basic set of font names' window should be entered as usual. (I.e., with four weights per family.) This has always worked in Photoshop, InDesign, etc. for me.</p>
