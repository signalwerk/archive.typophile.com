  html: "<p>This topic has come up before but... I'm still confused. <br> <br>I have a font with six weights: <br>Stratum-Thin <br>Stratum-Light <br>Stratum-Regular <br>Stratum-Medium <br>Stratum-Bold <br>Stratum-Black <br> <br>How do I make them appear under one menu name <br>and also be completely cross platform compatible? <br> <br>I know I need to style link them but... <br>I'm unclear as how to do it. <br> <br>I've studied Brioso Pro and Warnock Pro <br>but I've only come up dry. I understand <br>FDK is at work but it should be possible <br>with FL right? <br> <br>Any help would be great appreciated. <br> <br>Best, <br>Eric O.</p>"
  html_clean: "<p>This topic has come up before but... I'm still confused. <br> <br>I have a font with six weights: <br>Stratum-Thin <br>Stratum-Light <br>Stratum-Regular <br>Stratum-Medium <br>Stratum-Bold <br>Stratum-Black <br> <br>How do I make them appear under one menu name <br>and also be completely cross platform compatible? <br> <br>I know I need to style link them but... <br>I'm unclear as how to do it. <br> <br>I've studied Brioso Pro and Warnock Pro <br>but I've only come up dry. I understand <br>FDK is at work but it should be possible <br>with FL right? <br> <br>Any help would be great appreciated. <br> <br>Best, <br>Eric O.</p>"
