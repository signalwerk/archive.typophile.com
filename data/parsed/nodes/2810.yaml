    html: <p>You see the funny thing is... <br>I'm not really sure what I did. <br> <br>I followed Adam's instructions but used <br>the Style Name "Regular" for the first <br>four weights and the Style Name "Bold"  <br>for the next two weights. It works fine but <br>I wonder how this would work in a more <br>in depth family with say 20 variations? <br> <br>My fonts all show up with the specified  <br>names and organize themselves in the <br>menus nicely. I should add that the <br>third window "Additional OpenType Names" <br>is pretty important and seems to be part <br>of the OpenType naming puzzle. Again, <br>I followed Adam's instructions for this  <br>window and everything is working fine. <br> <br>I hope this makes some sense... <br> <br>I would love to hear how others do this.</p>
