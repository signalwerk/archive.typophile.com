    html: <p>Just a further note one this. <br> <br>For those of you with interest in metal type, several of the Nebiolo offerings (as well as faces from other European foundries, including Zapf's Virtuoso!!!) are still being cast at <br> <br><a href="http://www.schriftenservice-d-stempel.de/" target="_blank">http://www.schriftenservice-d-stempel.de/</a> <br> <br>including the Juliet mentioned by Berry. The specimen sheet, showing the face from 12pt to 60pt, is a great example of optical sizing. Incredible. <br></p>
