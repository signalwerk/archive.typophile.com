    date: 2003-05-23T00:00:00
    date_raw: 23 May 2003 — 12:00am
    votes: null
    html: <p>Marc <br> <br>These are kind of hard to find. Abe.com is a good general source op books but book dealers who specialize in this area are more apt to have them. Oak Knoll (US), Veatches (US), Francis Wakeman (UK), Minotaurus (Netherlands), etc. <br> <br>Prices for this probably run anywhere from $75 to $250 (I'm taking an educated guess) dependent upon condition and dealer knowledge. <br> <br>Some of the earlier Nebiolo (1930s?) are really something. Fat little suckers just packed with goodies. <br> <br>Hoping you have a happy birthday. <br> <br></p>
