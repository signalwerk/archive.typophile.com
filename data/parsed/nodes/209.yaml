    date_raw: 22 May 2003 — 7:07pm
    votes: null
    html: <p>I have a very nice copy of this particular specimen book. The Italian foundry specimen books are always wonderful to page through. Lots of faces there are relatively unknown in the Anglo-American sphere. <br> <br>One of the faces, Fregio Serie 900 was a grid construct. Very cool. Various pieces of the shapes of letterforms could be put together to form the actual letterform. Sort of like Sumner Stone's Means/Ends, but, as a metal face, I'd bet a lot more fun to put together. </p>
