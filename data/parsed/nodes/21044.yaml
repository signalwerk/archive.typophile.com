  html: <p>Do you know where/how the standard metal type sizes originated (8, 10, 12, 14, 16...24, 32, 36, etc.), and why those sizes? I can speculate but would like to read an historian's (or type nerd's) perspective. Lawson doesn't mention anything in "Anatomy of a Typeface." Perhaps Updike? Thanks for any light you can shed, or direction you can send me.</p>
