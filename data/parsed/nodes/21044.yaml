    html: <p>The sizes are mostly multiple of 6 or 12 (32 was not standard--it should be 30 in your list). 6 points is half a pica and 12 points is one pica, so basically it made the math easier. Below 18 point there are sizes that are not multiples of 6, but for practical reasons it was necessary to have finer steps.</p>
