    html: |-
      <p>Robert Bringhurst states in his bible that, during the 16th century, a series of common type sizes was developed by European typographers as a typographic equivalent of the musical <a href="http://en.wikipedia.org/wiki/Diatonic_scale" rel="nofollow">diatonic scale</a>. </p>
      <p>6, 7, 8, 9, 10, 11, 12, 14, 16, 18, 21, 24, 36, 48, 60, 72</p>
      <p>In the early days, the sizes were referred to by name rather than their measured point size.</p>
      <p>6pt: <cite>nonpareiel</cite><br>
      7pt: <cite>minion</cite><br>
      8pt: <cite>brevier</cite> or <cite>small text</cite><br>
      9pt: <cite>bourgeois</cite> or <cite>galliard</cite><br>
      10pt: <cite>long primer</cite> or <cite>garamond</cite><br>
      11pt: <cite>small pica</cite><br>
      12pt: <cite>pica</cite><br>
      14pt: <cite>english</cite> or <cite>augustin</cite><br>
      18pt: <cite>great primer</cite></p>
