    html: |-
      <p><strong>Without the title, the mark falls apart a bit.</strong> The order of the letterforms aren't easily discernable, and the "D" can easily be interpreted as an "O" because the reversed "D" opens up into the counter of the "C." </p>
      <p><strong>Give greater thought to the type that makes up your title.</strong> It seems like you typed in your title without considering modifications. Remember you have complete control over letter placement and each one of the individual characters that make up your title. Futura could be a nice starting point, but now consider how to improve upon it, making it unique to your logo.</p>
      <p>Perhaps you don't need a separate mark at all. Have you considered a wordmark? </p>
      <p>Hope this helps.</p>
