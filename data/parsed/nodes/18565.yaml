    <p>This is my first posting here and I am quite anxious to get involved with the community! Our instructor directed us here and I’ve actually gathered a great deal of information just reading in the forums. </p>
    <p>I’ve definitely moved a to a more confident feeling of my own designs, and I wanted to get some critique on my own personal logo that I will be using for my own freelance work. </p>
    <p>This is the first work I’ve actually posted beyond the critique outside my own peers and instructors, and I am definitely looking forward to getting some feedback on it.</p>
    <p>Thanks!</p>
    <p>Charles<br>
