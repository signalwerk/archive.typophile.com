      <p>Any Condensed gothic will tend to have a relatively low-waisted A (in order to keep the counter visible).<br>
      It is also a feature of some art deco typefaces (but they most likely will have a pointed A).<br>
      Here are some possibilities, none of which has such a low-waisted A:<br>
      <a href="http://new.myfonts.com/fonts/letterwerk/carrosserie/" title="http://new.myfonts.com/fonts/letterwerk/carrosserie/">http://new.myfonts.com/fonts/letterwerk/carrosserie/</a><br>
      <a href="http://new.myfonts.com/fonts/fontbureau/bodega-sans/" title="http://new.myfonts.com/fonts/fontbureau/bodega-sans/">http://new.myfonts.com/fonts/fontbureau/bodega-sans/</a><br>
      <a href="http://new.myfonts.com/fonts/btn/toasted-vein-btn/" title="http://new.myfonts.com/fonts/btn/toasted-vein-btn/">http://new.myfonts.com/fonts/btn/toasted-vein-btn/</a><br>
      <a href="http://new.myfonts.com/fonts/paratype/din-condensed/" title="http://new.myfonts.com/fonts/paratype/din-condensed/">http://new.myfonts.com/fonts/paratype/din-condensed/</a><br>
      <a href="http://new.myfonts.com/fonts/mvbfonts/solano-gothic-mvb/" title="http://new.myfonts.com/fonts/mvbfonts/solano-gothic-mvb/">http://new.myfonts.com/fonts/mvbfonts/solano-gothic-mvb/</a><br>
