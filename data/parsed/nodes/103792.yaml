    <p>Hi typopohile!</p>
    <p>I am working on a display block typeface that I started because I believe that no block-display type exists with full functionality.  For example baby teeth, the letters are great but the numbers arent so good, like the 7, in my opinion of course.</p>
    <p>Seeing this I decided to propose a new system where I though it would be a good idea to make it mono-spaced, so it blocks even more, however it doesnt work with the Hebrew and Cyrillic alphabets.</p>
    <p>The pdf that is attached shows what i have so far.</p>
