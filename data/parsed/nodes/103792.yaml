    html: |-
      <p>I like where you're going with it, quirky, a little art deco. I agree with the other comments.</p>
      <p>On the Hebrew: I think it is very angular and much less bold compared to the Latin and Cyrillic. You could try to be more elaborate with the shapes I think. I have no idea how readable this is, but I had toyed with the idea of Hebrew letter shapes like this a year or two ago.</p>
      <p>Here's an old sketch I did. You probably want to make sure to keep it heavy like the other scripts and also make sure you can read the letters. (My example my be a bit exaggerated here...)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/early_hebrew_sketch_3927.JPG"></div><p></p>
