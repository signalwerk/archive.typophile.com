    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Rudy Vanderlans</strong></p>
    <p>Rudy Vanderlans (b. 19--) is a graphic designer who has produced a few successful retail type designs. He co-founded <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a> with his wife <a href="/wiki/Zuzana%20Licko" class="freelinking" rel="nofollow">Zuzana Licko</a> in 1984. He acted as the chief editor and art director of the foundry's magazine through it's long lifespan from 1984 until 2001.</p>
    <p>Vanderlans designed the typefaces <a href="/wiki/Oblong" class="freelinking" rel="nofollow">Oblong</a>, <a href="/wiki/Suburban" class="freelinking" rel="nofollow">Suburban</a>, and <a href="/wiki/Variex" class="freelinking" rel="nofollow">Variex</a>, all of which are available through Emigre's font foundry.</p>
    <p>Born in the Netherlands, he lives today in northern California.</p>
