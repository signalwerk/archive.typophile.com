  html: "<p>ANNOUNCING: <br> <br>Emigre #63 <br>Scenic: The Acid Gospel Experience <br> <br>With this issue we turn once again to a long-time Emigre <br>collaborator. This time, however, we hope to expose a different <br>dimension of his work. <br>Bruce Licher is known mostly for his unique music packaging <br>designs (See Emigre 16 and 55). His hand-printed letterpress <br>covers have earned him two Grammy award nominations and have <br>been featured in major design magazines and exhibitions <br>around the world.  <br>Lesser known (particularly to graphic designers), but just <br>as distinctive, are Licher's ventures into music with his band <br>Scenic. For years Licher has integrated design and music, and <br>we are eager to share with you the aural dimension of his work. <br>In collaboration with Independent Project Records &amp; Press, we <br>are proud to announce the premiere release of \"The Acid Gospel <br>Experience,\" Bruce Licher's new Scenic CD. This is the fourth <br>and also concluding release in a series of audible Emigre issues. <br>Accompanying the CD is Emigre magazine #63, whose content was <br>largely determined by Scenic's evocative music. This time, we <br>invited three artists to each select or create work underscoring <br>the theme of landscape. Designer/illustrator Charles Wilkin, <br>photographer Jason Fulford and painter Shelley Hoyt provide the <br>images. <br>Also, Zuzana Licko presents her first new typeface design in <br>nearly two years. Fairplex, a sixteen font family, has been <br>a long time in the making. It was inspired by features found <br>in models ranging from the San Francisco Giants logo to Garamond. <br>With tapered serifs that become more distinct and decorative <br>as size and weight increases, and an overall low contrast, <br>Fairplex is designed to function as both an animated headline <br>font and highly practical text face. We're subjecting it to <br>its first road test in the packaging and design of this issue <br>of Emigre magazine. <br>Publication date: August 10, 2002. Price $7.95. <br> <br>To download a sample MP3 track from the new Scenic CD go to: <br><a href=\"http://www.emigre.com/EMag.html\" target=\"_top\">http://www.emigre.com/EMag.html</a> <br> <br>The subscription deadline for issue 63 is August 1, 2002. <br> <br> <br>-------------------------------------------------------------- <br>Please note: due to the high demand for our magazine, Emigre <br>has changed its free subscription qualification; only <br>customers who regularly order Emigre products will receive a <br>free subscription. For a minimum purchase of $39, a free <br>4-issue subscription will be automatically entered into <br>your account (limited to one subscription per customer, U.S. <br>only.) Or, you can simply buy a 4-issue U.S. subscription for <br>$16.00 at: <br> <br><a href=\"http://www.emigre.com/EMaSu.php\" target=\"_top\">http://www.emigre.com/EMaSu.php</a></p>"
