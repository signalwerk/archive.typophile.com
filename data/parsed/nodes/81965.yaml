  html: |-
    <p>Hi, typophiles! I usually use the term masthead to refer to the large logo at the top of a front page of a newspaper; I've recently found that masthead actually means something different (list of staff), and that I should be using the term "heading." This seems like a rather broad term, though. Is there a specific term for this section at the top of the front page with the logo, tagline, date, etc?</p>
    <p>Thanks,</p>
    <p>Josh</p>
