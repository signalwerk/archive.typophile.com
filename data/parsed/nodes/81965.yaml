    html: |-
      <p>Actually the word "masthead" applies to both. </p>
      <p>According to Webster, the first definition is nautical; the second definition applies to newspapers/newsletters, with sub-definitions of a &amp; b, with b being defined as the newspaper name at the top of the front page. It further mentions that the front page masthead is also called "nameplate".</p>
      <p>I've always used the word "masthead" to indicate the logo on the front page, but either use is correct.</p>
      <p>I agree that "nameplate" is best in order to avoid confusing people.</p>
