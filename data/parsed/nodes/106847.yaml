  html: |-
    <p>I took over the UX design at a company from a very amateur designer. He used a $ for an icon and I can't match it with any of the fonts installed on the system. I also can't find a vector version so I can resize it without messing with the quality. Any idea what font it is? I tried the automated apps but couldn't nail it with only one character to work with.</p>
    <p>- Sans Serif<br>
    - vertical line does not strike through the 'S'<br>
    - more like rounded corners to the 'S' than a smooth curve<br>
    - the vertical line 'caps' are offset from one another, if you extended them through they wouldn't meet it the middle</p>
    <p>Also, I only just discovered this site. Hopefully I won't have to avail myself of the font id forum too often but I look forward to lurking and learning.</p>
    <p>Thanks in advance,<br>
    - T</p>
