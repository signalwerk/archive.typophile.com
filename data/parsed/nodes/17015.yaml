      <p>jonathan, i hope you're ok with me using this thread for another question:<br>
      for a modern, humanistic sans (some would probably say its inspired by dax) im working on the &amp; at the moment. the one i have right now is a Et-ligature.. i mean changed an all, but its inspired by the Et-connection and not by the classic &amp; that evolved through time.<br>
