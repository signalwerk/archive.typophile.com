      <p>Regarding De Vinne, myfonts.com says “This revival of the Bruce Foundry’s No. 11 is typical of the nineteenth century types derived from the work of Didot and Bodoni; the face remains popular with lawyers and government printers. In fact, Theodore Low De Vinne opposed this kind of design as hard to print and read; he had Century designed to replace it.”</p>
      <p>I can’t tell whether the books I’ve got are set in De Vinne or Century, they’re so similar. I’ll look to see if they’ve got the very curly ? or the less curly one. That should be enough to distinguish the two, yes?</p>
