    <p>There was a modern type used by the US Government Printing Office for many different publications, particularly those published by the Smithsonian. A large number of the anthropology and linguistics books I read from the 1910s through to the 1970s were published in this typeface. I have no idea what it is, but I’ve been curious for a long time.</p>
    <p>Attached is a scan from a book printed in 1972 by the US GPO for the Smithsonian. I apologize for the poor quality of the scan, but it’s the only thing that I happen to have and I don’t have a working scanner at the moment.</p>
    <p>Can anyone identify this typeface? I can try to get a better scan in a couple of days if necessary.</p>
