    html: |-
      <p>I had wondered if it was Century, but was suspicious because the digital versions looked much more flimsy. I guess that’s the difference between digital type and real metal type pressed into paper.</p>
      <p>Did Century Expanded have Greek too? The stuff I read is full of IPA-ish and Greek characters in both upright and italic/oblique forms. If not then the GPO must have had a special set cut for them, at least in the 12 point used for body text. Some of the works I’ve read include lots of different diacritics too, so I’d guess that these were custom additions to the font.</p>
      <p>The reason I’m curious is that I have a dream of someday reprinting/republishing some of the old texts I work with, helped by the fact that many are either out of copyright or never were copyrighted being government works. I’ve seen photostatic reprints, but these make for absolutely horrible reading with the degrading, turds and hair, and lacunae. The books and articles are getting very hard to find, and were never printed in large numbers to begin with.</p>
