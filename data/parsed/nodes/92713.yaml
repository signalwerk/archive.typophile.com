    html: <p>Looks custom to me or at least customized (/A is a mirrored /U with a crossbar, /K done with /K top right part and /R bottom left). Thought the /K could have been original though but wasn't able to identify the right Didone. For what it's worth, something between <a class="freelinking external" href="http://commercialtype.com/typefaces/austin/austin" rel="nofollow">Austin</a> (the closest I've found), <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/carousel/" rel="nofollow">Carousel</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typofonderie/ambroise-std/" rel="nofollow">Ambroise</a>, <a class="freelinking external" href="http://marketplace.veer.com/font/Eloquent-Pro-Complete-JBT0001065" rel="nofollow">Eloquent</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typejockeys/ingeborg/" rel="nofollow">Ingeborg</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/mellediete/anne-bonny/" rel="nofollow">Anne Bonny</a></p>
