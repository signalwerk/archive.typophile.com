      <p>" it would be easy for students to research in a library as opposed to online"</p>
      <p>They still make libraries?</p>
      <p>I notice the list is (mostly) contemporary folks. Intentional? If not, there's probably some historical figures that could be added: Tufte, Rand, Carson, Glaser, Sagmeister, etc. </p>
      <p>And other areas to explore:<br>
      motion graphics<br>
      user experience designers<br>
      illustrators<br>
      editorial design<br>
      signage/wayfinding</p>
      <p>For UI, Susan Kare is a fun one given her creating the early Mac OS icons. John Maeda could be another one (less UI and more experimental, but still fun).</p>
