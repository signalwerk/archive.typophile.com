    <p>I am requiring all of my introduction to graphic design students to research a designer and his/her work within a specific practice area of design, write a 1,000-word essay about the designer, and develop the essay into a presentation. The designers I chose were picked primarily because it would be easy for students to research in a library as opposed to online. I ended up with a list that is mostly white Americans and I would like to add some diversity. </p>
    <p>Also, I still have not come up with a great interface designer for my list. Suggestions there would be especially helpful.</p>
    <p>Following is my list of designers and practice ares. Please suggest alternate designers and any practice areas that I have neglected. The most important criteria is that the designer has been written about in commonly-available, English language, books and magazines. This is not a research and writing class, so I do not have time to guide<br>
    students through interviews, translations, locating limited edition books, etc..</p>
    <p>Kenya Hara, art direction<br>
    Roger Black, publication design<br>
    Alejandro Paul, type design<br>
    Kyle Cooper, film title design<br>
    Jason Santa Maria, web design<br>
    Debbie Millman, identity and branding<br>
    Matteo Bologna, packaging<br>
    Jessica Hische, lettering<br>
    Jonathan Ives, product design<br>
    Paula Scher, environmental design<br>
    ?, interface design<br>
    Nicholas Feltron, information design</p>
