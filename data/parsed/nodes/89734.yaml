  html: |-
    <p>FOUNDFONT™ is a type project by Andy Hayes of Hucklebuck Design Studio (That's me). FOUNDFONT™ is dedicated to typographic archaeology, creating display OpenType fonts based on found and obscure examples.</p>
    <p>We are running a launch promotion through February 5th selling all fonts individually for $5 and the set of 8 for $35. </p>
    <p>Visit our storefront at <a href="http://www.foundfont.tumblr.com" title="http://www.foundfont.tumblr.com">http://www.foundfont.tumblr.com</a> and follow us on twitter at @foundfont.</p>
