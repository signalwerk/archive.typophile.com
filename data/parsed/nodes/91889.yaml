      <p>Here is a little background history on where the “curly quotes” came from:</p>
      <p>“Inverted commas were used for opening quotes in most founts until comparatively recent years, but now a separate pattern is provided in most founts. Reversed, instead of inverted commas now accompany many founts, particularly reproductions of the late nineteenth-and early twentieth-century types, at which time they were first introduced.” Bruce Rogers, <em>Paragraphs on Printing</em>, New York, 1943, <a href="http://books.google.com/books?id=T8GoGDGn27AC&amp;lpg=PP1&amp;dq=Paragraphs%20on%20Printing&amp;pg=PA64#v=onepage&amp;q&amp;f=false" rel="nofollow">p. 64</a></p>
