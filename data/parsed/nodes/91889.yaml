      <p>It's also possible that the font you're using doesn't have curly quotes. However, on the off chance it does and Omnes (which I've never heard of) is a Windows program, you can bypass Insert Special Characters and enter the proper forms with the ALT key and the numeric keypad, thusly...</p>
      <p>Single Quote Left = ALT+0145 = ‘<br>
      Single Quote Right = ALT + 0146 = ’<br>
      Double Quote Left = ALT+0147 = “<br>
      Double Quote Right = ALT+0148 = ”</p>
      <p>If Omnes is a Mac program...</p>
      <p>Single Quote Left = OPTION+] = ‘<br>
      Single Quote Right = SHIFT+OPTION+] = ’<br>
      Double Quote Left = OPTION+[ = “<br>
      Double Quote Right = SHIFT+OPTION+[ = ”</p>
