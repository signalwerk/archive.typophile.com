      <p>Perhaps the “wrong” left quotes could be included in an OpenType feature, such as Titling.<br>
      They look particularly good for a short centred title, on account of the symmetrical effect, whereas the correct form has an asymmetry which suits its use in running text, over more than one line.<br>
      Of course, although that would be good in America, it still wouldn’t be correct for many languages.</p>
