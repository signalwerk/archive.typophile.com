  html: <p>I'm doing a publication set in Omnes and I have my typographer's quotes in preferences on, but I keep getting inch marks even when I go through insert special characters! Does Omnes just not have typographer's quotes? If so do I leave it or fake it with a different typeface's typographers quotes? Thanks for your help!</p>
