    html: |-
      <p>In typography, what’s correct is generally considered to be ancient practice.<br>
      For quotes, that means a relationship with the comma, which did double duty in foundry type, becoming a left quote simply by rotating 180˚.<br>
      It also implies a relationship with the pen, so that in oldstyles, made with the broad pen, the comma/quote mark is more of a simple slash (see Palatino), without the blob and curl that are much more easily made with a pointed steel nib.<br>
      In a “round-nib” sans, such as Omnes, there’s not much precedent (a mix of geo and grot in the basic letter forms reinforces that idea), so the quote could go any way that a “Speedball” nib could make it, with or without blob, with or without curve. Joshua Darden made the call. But he took it a step beyond merely mimicking a pen stroke, and, as in Optima, executed a “tapered slash”, introducing a level of detail—typographic—beyond that of a the basic pen round-pen ductus that may be assumed to ground the style. </p>
      <p><a href="http://www.identifont.com/show?T9" title="http://www.identifont.com/show?T9">http://www.identifont.com/show?T9</a></p>
      <p>Below is an interesting example of how things originate; it’s a specimen of one of the earliest sans faces, from the 1830s. The designer was experimenting with different forms of the comma (and hence quote mark) at different sizes. The smaller comma, with the fine stroke that’s at a smaller scale than any other detail of the type, has become established as the standard grot comma. And I think it’s this idea that one also sees in types such as Optima and Omnes.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figgins_5420.jpg"></div><p></p>
