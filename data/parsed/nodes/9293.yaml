  date_raw: Fri, 2005-02-18 11:20
  votes: null
  html: "<p>I have been racking my brain trying to find a face that would be suitable (and look go with the characters at hand) for a new pop artist. <br> <br>I need only the word: Nichole Deborah OR nichole deborah <br> <br>I'm thinking something either thin geometric or humanist, or possibly a script. <br> <br>I have found a lot of great things, but nothing that looks appropriate with her actual name set in it. <br> <br>This will be the masthead for an upcoming album release. <br> <br>It needs to be graceful, stylish, mature, and slightly feminine. <br> <br>I'm attaching a promoshot of the artist for reference. <br> <br>Any thoughts you have would be ver helpful. <br> <br>We have around a $150 budget for the font. <br> <br>Kyle.<img src=\"http://www.typophile.com/forums/messages/4100/65541.jpg\" alt=\"Nichole Deborah Promo Shot\"></p>"
  html_clean: "<p>I have been racking my brain trying to find a face that would be suitable (and look go with the characters at hand) for a new pop artist. <br> <br>I need only the word: Nichole Deborah OR nichole deborah <br> <br>I'm thinking something either thin geometric or humanist, or possibly a script. <br> <br>I have found a lot of great things, but nothing that looks appropriate with her actual name set in it. <br> <br>This will be the masthead for an upcoming album release. <br> <br>It needs to be graceful, stylish, mature, and slightly feminine. <br> <br>I'm attaching a promoshot of the artist for reference. <br> <br>Any thoughts you have would be ver helpful. <br> <br>We have around a $150 budget for the font. <br> <br>Kyle.<img src=\"http://www.typophile.com/forums/messages/4100/65541.jpg\" alt=\"Nichole Deborah Promo Shot\"></p>"
