      <p>Narrow and/or small-on-body fonts (slant or no) save space in proportion to the infrequence of paragraph breaks; the more frequent the paragraph breaks the more you'll save more space by instead using a large-on-body font at a smaller size (which guarantees vertical space savings no matter the breaks). In fact, all else being equal large-on-body fonts are more economical (except for poetry where long lines that <em>have</em> to break just into a second line make the results wasteful, but most of all ungainly).</p>
      <p>hhp</p>
