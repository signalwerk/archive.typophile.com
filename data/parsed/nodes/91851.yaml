    html: |-
      <blockquote><p>Am I wrong in remembering that the Linotype could only contain four weights on the machine. </p></blockquote>
      <p>Don — Depends upon the model of the machine and how many simultaneous magazines it could accommodate. Lino mats were duplexed — i.e., two styles on one mat. So each magazine would carry two styles together (which were, technically speaking, a single font).</p>
      <p>Usually the pairings were typical Roman with Italic or Roman with Bold. </p>
      <p>Small caps were not provided as a separate font/style. Those faces that sported small caps were usually targeted at book work and were provided in fonts of Roman with Italic and Small Caps. I don’t know offhand exactly what the duplexing scheme was (and there may have been a few different arrangements).</p>
      <p>If there was a Bold Italic, it would be offered with the Bold. But there were not a lot of those in the library.</p>
      <p>And you could also get certain pairings across families (usually, two romans) — so, for instance, Excelsior with Memphis Bold&nbsp;—&nbsp;for jobbing work.</p>
