      <p>FWIW, in the heyday of photo-lettering, type designers merely designed the characters themselves; the matters of metrics and kerning were handled by the Typositor/compositor operator. </p>
      <p>Outlines  were created using a film positive, a film negative and, usually, an orbital cam contraption; adding shadows required another positive and negative and a bit of creative film stripping. Now those methods have gone the way of the horse and buggy…well, except in Amish country.</p>
