    html: |-
      <p>Historically, if you go 'way back, there was just one style of type in a given document. That style might have been blackletter, or it might have been Roman.</p>
      <p>I've seen printed books from the 20th Century (or maybe the 19th) that actually used blackletter for emphasis in a predominantly Roman text.</p>
      <p>Italics, when they first came along, thanks to Aldus Manutilus, were a way to print books more economically.</p>
      <p>Eventually, though, the use of italics for emphasis (as opposed to letterspacing for emphasis, a once-common practice) did become standardized.</p>
      <p>Boldface came along <em>much</em> later. Using blackletter, or a different Roman typeface with a heavier weight, for emphasis or headings preceded the design of bold weights of a given typeface.</p>
      <p>A very few typefaces later had bold italics designed for them, but this was generally regarded as a novelty. The frequent use of different levels of emphasis - italics, bold, small capitals - is generally deprecated, as good taste in typography has been generally regarded as that which is understated.</p>
      <p>Victorian posters, of course, are the extreme example of the opposite of this - and the needs of advertisers are one major reason why a few typefaces had a bold italic designed for them.</p>
