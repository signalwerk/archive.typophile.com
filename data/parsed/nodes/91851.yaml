      <p>Further to David’s exegesis: a big impetus to the concept of large families came about through the technological ability to photographically modify typositor fonts and settings. “Modding”.</p>
      <p>Headliners International, for instance, had in the 1970s and 80s small-x height “Neo-Mini- ” versions of all the classic typefaces, including even Gill Sans, in multiple weights, roman and italic (for use in heads, Marc!)</p>
      <p>Both slanting and bolding could be done photographically (outlines and shadows too); the results weren’t perfect, but the amount of manual clean-up work required was substantially less than drawing from scratch.</p>
      <p>The weight of a typositor setting could be varied during or after the setting process, and the same techniques used in font production.</p>
      <p>In the 1960s and 1970s, high-end typesetters provided hand lettering and typositor-set headlines, as well as body-text galleys. Often a headline setting would be modded and tweaked by lettering artists to the extent that it became a hybrid beast. Les Usherwood ran one such shop in Toronto, Typsettra, and used the technology and talent at his disposal to design and produce many different fonts based on the same modded body, both as stylistic variants (different serif treatments) and as family extensions.</p>
