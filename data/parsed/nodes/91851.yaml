      <p>Manutius and Manutilus were two different people, the later being a crazy submarine typographer of the 19th century.</p>
      <p>@dan "No, it is because some type designers know what is best for their typefaces"</p>
      <p>This is reasoning for both solutions. If I don't supply a BI I am saying to the user not to use one, if I do supply one I'm trying to make sure the computer doesn't supply it.</p>
      <p>Back at the original question, bold italic was something that was made in many display faces. Text bold italics were not common in the Linotype library when I arrived in 1978, but by 1986, all families intended for use in text and display use required a BI</p>
      <p>What happened was, i think three things;<br>
      ITC was producing large, for the time, families of matching roman and italic for each weight. Linotype and maybe others were digitally standardizing on 12 pt masters and at the same time expanding families like Caledonia, Century and Aster w/Ikarus, and while doing so added BI to keep up.</p>
      <p>WYSIWYG word processors were starting to catch on that used matching bitmaps for printer and screen fonts. Hand edited bitmaps had the ability to be boldened and slanted without damage being apparent to your average word processor developer. Software logic says R, RI and B should always make BI possible, so font developers were compelled to either see computer generated BI, or supply it.</p>
      <p>So when typesetting and word processing merged into desktop publishing, it placed the typographically mindful and mindless on the same platform while&nbsp;converting to digital outlines, and so the BI became&nbsp;expected.</p>
      <p>Same with fonts don't have I, B or BI today, like Brush Script... and look what happens.</p>
