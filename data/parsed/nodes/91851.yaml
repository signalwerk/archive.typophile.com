      <p>There just is not one answer.  In the area of possible need, there are variances between, book, magazine, brochure, advertising, web, etc.., for a given face.  This gets further compounded by a given users perception of what they need vs. what it costs to buy.  Using the same logic, a type designer might ask himself if there would be enough more sales just because the BI was included to more than offset the time and effort to make a BI. Sometimes a type designer might assume that a BI is not worth doing for a given face.  They may well be wrong by some counts but that was there perception at the time.<br>
      I you need a BI in a face that does not have one, contact the foundry and ask about it. They may just need a few nudges in that direction to produce that variation.  Otherwise, you may need to choose another face for the job.  I might also say that making a decent BI when a family has  only a bold roman and a regular italic is not just a few quick mouse clicks as someone implied above.  All good things require work.<br>
      When you need it, you need it.  That does not mean a type designer may think the time and effort was worth it at the moment of release.  They may change their mind if they get asked often enough.</p>
