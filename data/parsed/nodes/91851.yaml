      <p>One source - perhaps biased - would be the set of fonts offered for the IBM Selectric Composer.</p>
      <p>Having Medium and Italic:</p>
      <p>Pyramid</p>
      <p>Having Medium, Italic, and Bold:</p>
      <p>Aldine Roman<br>
      Baskerville<br>
      Bodoni<br>
      Century<br>
      Theme</p>
      <p>Having Bold Italic as well:</p>
      <p>Journal Roman<br>
      Press Roman</p>
      <p>And then there was Univers, which did not have a bold italic, but which did have condensed and light versions.</p>
