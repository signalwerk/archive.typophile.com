    <p><a href="http://arstechnica.com/gaming/news/2010/02/no-fix-for-mass-effect-2-text-issue-could-have-been-avoided.ars" title="http://arstechnica.com/gaming/news/2010/02/no-fix-for-mass-effect-2-text-issue-could-have-been-avoided.ars">http://arstechnica.com/gaming/news/2010/02/no-fix-for-mass-effect-2-text...</a></p>
    <p>An Ars Technica article on text legibility issues with the new Mass Effect 2 game. The discussion is interesting in regards to how much flexibility developers should give to the players over how the text is rendered and such impact on the game design. As we move beyond existing standards, I believe these types of problems will become much more commonplace.</p>
