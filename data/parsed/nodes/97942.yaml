  html: <p>Most impressive is intended to mean a specimen that you were really attracted to as far as design and layout.  A specimen where you thought the creators really went above and beyond.  Note that the question is about the design and layout of the specimen, and not necessarily the font, so it is entirely possible that the most impressive specimen you have ever seen was for a font you don't particularly like.  Single Font or Family specimens only please, no "foundry" specimens.</p>
