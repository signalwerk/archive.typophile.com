    html: |-
      <p>It's basically a halftone bitmap image masked within text. To create a bitmap, open an image in Photoshop that has varying levels of gray, if it's cmyk or rgb convert it to grayscale first.</p>
      <p>Here's how to make a halftone bitmap image.</p>
      <p>Image&gt;Mode&gt;Bitmap…</p>
      <p>Method, Use: Halftone Screen…</p>
      <p>Adjust the Frequency, Angle and Shape to achieve the results you want. Save as a bitmap .tif or convert back to grayscale .tif then proceed to masking your type in whatever program you prefer.</p>
    html_clean: |-
