      <p>How many times have you posted this question? I've seen it in at least two other forum sections.</p>
      <p>In Illustrator, make a large area of your screentone pattern. Put it under your text. Select both the text and pattern and "Make Clipping Mask". (You might need to have converted the text to outlines first.)</p>
      <p>You can do it with the screentone pattern above the text but it seems you need to make it into a Compound Path first.</p>
      <p>I use a fairly old version of Illustrator, from CS1, so there might be other ways in newer versions.</p>
