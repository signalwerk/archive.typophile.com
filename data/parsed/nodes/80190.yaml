      <p><cite>One can either create a halftone in Photoshop (which leaves us with a raster image) and optionally Live Trace it in Illustrator (which leaves us with irregular shapes)<cite></cite></cite></p>
      <p>If you want your screentone vectors to be perfect circles just make them from scratch, starting with a single dot and using the Move/Copy funtion. Gradients take a bit more work as you need to keep expanding the paths on different rows.</p>
