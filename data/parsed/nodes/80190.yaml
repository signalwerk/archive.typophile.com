      <p>What a coinkidink: Just this morning, I was noodling a project that will require a good technique for achieving this effect.</p>
      <p>I see two solutions proposed here and in the link above, and, unfortunately for me, neither seems really elegant. One can either create a halftone in Photoshop (which leaves us with a raster image) and optionally Live Trace it in Illustrator (which leaves us with irregular shapes), or one can buy an expensive plug-in.</p>
      <p>I don't mean to belittle the talent that goes into developing that plug-in (it looks really impressive), but the prospect of buying it for a single project isn't appealing to me.</p>
      <p>It's unexpected and disappointing that while Photoshop has had this functionality for a long time, Illustrator still doesn't seem to. It seems like an effect that is inherently more appropriate for vector images.</p>
      <p>Wasn't there a popular free font in the 90s that did this? It seems like there must be another way.</p>
