    html: <p>Yeah I'm laying them on a lightboard and using a loupe if I'm checking small text. The film is kind of expensive, but since we do it by the roll we always end up with less than a full broadsheet of film left, which I've started using for my proofs rather than throwing it out. Our laser printers at work suck, and so does the one I have at home, so this is really my only high quality hardproof option.</p>
