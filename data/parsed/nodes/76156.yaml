      <p>The Beatles were certainly aware of the avant garde. This is from the wikipedia article about <cite>Tomorrow Never Knows</cite>:</p>
      <p>&gt;McCartney supplied a bag of ¼ inch audio tape loops he had made at home after listening to Stockhausen's Gesang der Jünglinge. By disabling the erase head of a tape recorder and then spooling a continuous loop of tape through the machine while recording, the tape would constantly overdub itself, creating a saturation effect, a technique also used in musique concrète.</p>
      <p>That Stockhausen piece was realized in 1955-56. Terry Riley had also created what he called a Time Lag Accumulator (2 reel to reels with tape loops) in the 50s which achieved the same thing as disabling the erase head.</p>
      <p>It is also true that the BBC was using tape loops in the 1950s for sound effects so the phenomena was concurrent.</p>
      <p>Whatever the case - back then pop music was a very different animal, with the largest stars looking everywhere for information/inspiration. This was also true in early punk rock - as many musicians as came from the David Bowie/Iggy Pop school came from the avant garde (think Stockhausen, Mauricio Kagel, John Cage, Sun Ra, The Art Ensemble of Chicago).</p>
      <p>People that are serious about what they do tend to be aware of the history of their craft. Nick - you seem to be.</p>
      <p>pbc</p>
