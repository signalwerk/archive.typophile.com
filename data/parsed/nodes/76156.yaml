      <p>I am fairly confident that more than one old hippie (other than myself) has done a comprehensive study of the genre, and some dedicated Googling would probably turn something up.</p>
      <p>This old hippie's take is that the recognized masters of the art--such as Rick Griffin, Stan Mouse, Victor Moscoso and Wes Wilson--hand-lettered their posters, which were sometimes printed offset and sometimes silk-screened. At the tail end of the phase, commercial typesetters like Photo-Lettering Inc. got into the mix.</p>
      <p>As far as origins go, I would opine that Push Pin Studios was probably a strong influence. Their brash revivals of Art Deco probably prompted a look at other style of the past, notably Art Nouveau, which heavily influenced psychedelic poster work.</p>
