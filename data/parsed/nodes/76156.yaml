      <p>1965.<br>
      Lettering: Charles Front<br>
      Photo: Bob Freeman. The distortion is an imitation of a "mistake" when Freeman showed his photos to the Beatles, with a slide projector onto a 12" square of cardboard (album sleeve size), which became tilted backwards. Paul liked that effect and asked the photographer to duplicate it.<br>
