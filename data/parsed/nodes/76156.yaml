      <p><em>Why did they make it the way it was?</em></p>
      <p>LSD, magic mushrooms -- the psychedelic drugs.<br>
      These can cause a disruption of the sense of vision.<br>
      Other than taking the drugs, the scene in Terry Gilliam's <em>Fear and Loathing in Las Vegas</em> where the carpet comes alive gives a good idea of the kind of swirling distortions that may occur, providing artists with inspiration to transpose such interesting images to straight reality.</p>
