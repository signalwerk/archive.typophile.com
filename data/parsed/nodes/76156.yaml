      <p>"Why did they make it the way it was?"</p>
      <p>Like, I don't remember why, dude it was like a happening thing with orange sunshine and shit.</p>
      <p>Actually, since we old farts were not bound by what was on a pulldown menu and getting type set then was way too expensive compared to dirt cheap today--so we just took out brushes and paint and did it until it looked groovy.</p>
      <p>"Are there anyone here that used to design psychedelic art in the 60s ?"</p>
      <p>That would be a yes.</p>
      <p>You have surely heard about Peter Max an the others listed in previous posts.  They were just the commercial successes and the tip of the iceberg. Every headshop, macrobiotic restaurant, and tie--die joint had friends who would just do one-off of posters and menus for food or weed.  The REAL stuff got washed away by the rain decades ago--only the high end commercial stuff got printed and has survived until today. Picture a chemically altered 19 year old in 1969 with brushes and jars of Day-Glo paint.</p>
      <p><a href="https://web.archive.org/web/20150123203315/http://rogallery.com/Max_peter/max-posters.htm" title="http://rogallery.com/Max_peter/max-posters.htm">http://rogallery.com/Max_peter/max-posters.htm</a></p>
