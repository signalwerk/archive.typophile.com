      <p>AFAIK, the specific effect Paul invented was new, whereby an input was re-recorded over itself, slightly out of sync, for a progressive, echoey degeneration. After a certain number of over-dubs, the effect became too muddy, and it became necessary to manually ease up the recording head.</p>
      <p>I'm not sure the Beatles' interest in sound effects can be traced directly to contemporary classical music -- they grew up listening to the Goon Show, with sound effects by the BBC Radiophonic Workshop, and George Martin had worked with the show's comedians. Prior to his involvement with the Beatles, he had produced all kinds of music at the dog's body Parlophone, including classical, novelty, and "regional music", and under the moniker Ray Cathode, even released an electronic dance tune, recorded at the Radiophonic Workshop. </p>
      <p>So it's reasonable to assume that Martin turned the Beatles on to such experimentations and special effects, which came from a commercial recording studio milieu, rather than an avant garde classical source.</p>
