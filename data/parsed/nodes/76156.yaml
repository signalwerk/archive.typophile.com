  html: <p>Hi, does anyone know how they made psychedelic typefaces in the 60s? Was it all handwritten?  Why did they make it the way it was? Where did its origins come from? and how did they print the psychedelic art posters?</p>
  html_clean: <p>Hi, does anyone know how they made psychedelic typefaces in the 60s? Was it all handwritten?  Why did they make it the way it was? Where did its origins come from? and how did they print the psychedelic art posters?</p>
