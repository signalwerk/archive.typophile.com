      <p><em>Are there anyone here that used to design psychedelic art in the 60s ?</em></p>
      <p>That would be ditto, also...</p>
      <p>BTW, Phil Spector is credited with creating the effect called Flanging, wherein a second tape of the material was delayed intermittently by applying thumb pressure to the flange of the tape reel, creating a swirling--otherwise known as "The Big Hurt--effect.</p>
      <p>And, FWIW, something very much like the "Time Lag Accumulator" was marketed as the Echoplex in the 60s and 70s, as was used extensively on Led Zeppelin's first two albums.</p>
