      <p>That does look better. Cool.</p>
      <p>On the off chance that more can be done and you feel like it:</p>
      <p>- maybe pull the swash on the A slightly more to the left? Or reduce the amount it sticks out slightly. Either thing might help the A compete less with the under arc and improve coherence.<br>
      - maybe pull the cut where the leg of the R meets the bowl in further to let the R read better<br>
      - maybe tweak the ends of the S so they come slightly less close - again to make the Letter read better &amp; faster.</p>
