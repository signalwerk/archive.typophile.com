      <p>Apperson’s audience is big corporate down to a single K-12 and higher ed teacher.  </p>
      <p>“The industries that we are strong in for printing are: International Trade; Education; Finance (Credit Unions, Mortgage Companies, Pawn Brokers, etc).  For Data Collection (DTS): Hospitality; Medical; Education”</p>
      <p>If any of you are still awake... they want a “newer feeling”, but didn’t like the serifed options we had shown them.</p>
      <p>What exactly do they do?  Good question — they print forms and create the data capturing equipment and software to go with the forms.  They also do fulfillment and logistics ~ they store a company’s forms offsite at Apperson’s warehouses and build a custom ordering site for each client.</p>
