    html: <p>I would see if you can pull the letters out of the wave a little more maybe - but it’s probably too late. Another idea would be to make the wave taper more &amp; sooner to allow the text a chance to be read. The O N will take care of themseves but the P&amp;R suffer from the ’immersion’ in the wave. Still this would be mitigation rather than fixing. I would also look at move the word trade &amp; division just a litle to the left because the space between the L &amp; T is optically too wide even if it is digitally ’correct’. Or give the E &amp; D betwen Trade &amp; Division more space.</p>
