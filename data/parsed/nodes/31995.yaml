    <p>Hi All,</p>
    <p>Attached is a couple halfway polished concepts we’re giving to the client, who is a printing and related services company.  Client wants to have the divisions represented, and so far prefer the stacked version on page 3 — since they are not wanting to shorten the division names.  (Here is <a href="http://appersonprint.com/assets/body/body_01.gif">the original logo</a>.)</p>
    <p>All comments accepted and respected, of course!</p>
