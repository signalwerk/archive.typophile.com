    html: |-
      <p>@ All:  Thanks for the comments.  I posted it here because I’m not totally content with the direction (and am fishing for ideas), and it might be time to go back to the drawing board because it’s “ho-hum”.  Two are just subtle changes, and we’re fans of the classy serif’d version as well; but as you all know — it’s hard to get some clients to accept change.</p>
      <p>@ Lex Kominek: Good catch!  We’ll fix the swoosh on the “A” for the next version.</p>
      <p>@ garden:  The PDF was generated from Illustrator as direct print to PDF, so the vector art was conserved.  It’s just a line with a stroke of 0.6pt. Photoshop is a raster program at heart, and is probably what causes the blurring on your lines if you’re exporting from there.</p>
    html_clean: |-
      <p>@ All:  Thanks for the comments.  I posted it here because I’m not totally content with the direction (and am fishing for ideas), and it might be time to go back to the drawing board because it’s “ho-hum”.  Two are just subtle changes, and we’re fans of the classy serif’d version as well; but as you all know — it’s hard to get some clients to accept change.</p>
