    <p>Hi all,</p>
    <p>I am working on logos (long and abbreviated) for my new website. The website is pixelsift.com. There isn't anything there right now (I'm looking to settle on a logo to move forward with the site design) but I would like to put my portfolio together. The website is meant to promote my work as a freelance web developer/designer and I prefer a clean, professional look.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logos_4865.png"></div><p></p>
    <p>Any comments or criticisms would be appreciated. The logos in the right column differ subtly from those in the left in that the pixels have slightly rounded corners. What do you think?</p>
    <p>Thanks,<br>
    David</p>
