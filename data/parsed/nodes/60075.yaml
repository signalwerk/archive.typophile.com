    html: <p>Agree with Bert on that.  Not sure what the box/colors add to your concept, except make this look like FontShop. Consider a version that becomes more pixelated, perhaps it becomes more pixelated top to bottom? Also, the pixel grid is not really a grid, which is making the curves look strange. On one hand smoother, but at small size/ low resolution, it looks odd to me. Maybe if they were dots it would be less noticeable?</p>
