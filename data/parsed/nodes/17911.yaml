      <p>I recall hazily that as a crisp consuming child in the UK in the 80s/90s, the universal standard was dark blue for ready salted (plain), cyan for salt and vinegar and green for cheese and onion and all the leading brands (Golden Wonder, KP, Smiths) which were near identical, followed this scheme.</p>
      <p>Then Walkers swiftly rose to the top, the other brands disappeared or reappeared as "USP" brands (square/ridged/thick cut) and then Walkers then took advantage of their position to not only switch the Cheese and Onion and Salt and Vinegar colour schemes but also bring in red for Ready Salted.</p>
      <p>Don't get me started on Marathons becoming Snickers, or Opal Fruits becoming Starburst.</p>
