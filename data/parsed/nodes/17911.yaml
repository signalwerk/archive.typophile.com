      <p>In the US potato chip bag colors have changed a bit over the years but generally are Yellow for plain/salted, Brown to Black for BBQ, Cyan Blue for Salt and vinagar, and Orange for Cheese flavors. Of course there are zillions of other flavors, but those are the most common and long standing on potato chips in the US. Most other American chip companies seem to follow the lead of Frito Lay when it comes to the colors used on chip bags.</p>
      <p>Cerulean - I like that old Dorito bag too, everything since is just too...</p>
      <p>Geoff - Chicken flavors? On chips? Salt and Vinagar used to be represented by a Yellow-green, but it has recientlly changed to Cyan Blue, I think they needed Green for the Dill Pickle chip bag. I do think colours are localised, as well as spellings and tastes. Check out these:</p><div class="imageWrap"><img src="http://typophile.com/files/IndiaChips.png"></div><br>
      Yes, those are real! Chatpata Chaska flovored Kurkure (tasted like Cilantro/Coriander on a Cheeto-like substrate) and Magic Masala flavored Lays. No BBQ or meat flavors in India.<p></p>
