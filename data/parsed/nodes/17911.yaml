      <p><em>...what were they thinking?</em></p>
      <p>a) It seemed like a good idea at the time<br>
      b) Newness for its own sake (novelty, or "a change is as good as a holiday")</p>
      <p><em>I was actually going to say that it seemed a bit Japanese’d to me - Americanized? I guess these days that’s getting to be about the same.</em></p>
      <p>We have had a rash of the same kind of non-sensical generic food packaging makeovers here in Australia, particularly potato chip brands and quickie-snack products found in supermarket freezer aisles. So I guess this dubious style isn't uniquely American.</p>
      <p>For about the last 2 years there has been a lot of twaddle from brand managers I work with about brand positioning and re-positioning, niche consumer appeal and "leveraging" consumer products. It translates into lots of pointless and stoopid packaging redesigns.</p>
      <p>Quite possibly the font used on the new Walkers package is an attempt to differentiate the brand from other potato chip brands that use a flair serif (as the previous Walkers pack did). Flair serifs are common on chip packets.</p>
      <p>That, however, doesn't excuse the awful new font they've used. It isn't organic enuff for a food product. Nuts!</p>
      <p><em>Maybe they needed to stress the ready salted over the actual brand name. :^/</em></p>
      <p>:^) That is exactly the kind of thing I'm on about---brand sub-positioning and niche appeal. The brand image takes a back seat to the directive of some farcical "consumer focus group study".</p>
      <p>j a m e s</p>
