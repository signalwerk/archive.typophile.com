      <p>hi stephen,<br>
      last things first: in html, i do all tthe table styling via stylesheets. whenever i update my .css, i refresh the browser window, and see the changes instantly. </p>
      <p>the tables we're working on are really complex, with loads of exceptions, warying widths, and quite a few russian gold medalists with too long surnames for our layout.</p>
      <p>what i miss in indesign, is the ability to assign classes or styles to tables, rows, cells etc. </p>
      <p>tablestyles pro is supposed to work like this, but it seems far to unstable for me. also, it doesn't provide all the attributes that css does (padding, margin, typographic options etc.).</p>
      <p>alex</p>
