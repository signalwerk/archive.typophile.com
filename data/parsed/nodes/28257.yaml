    <p>Hi<br>
    We have just finished 60 pages of norwegian and international crosscountry and biathlon statistics from 1938 to present (believe it or not). All tables. We tried both Smart Cells  (woodwing) and Table-/Cellstyles pro, but they were both no good.</p>
    <p>Does anyone know a good plugin for handling tables in Indesign? I've been working quite a lot in html, in really miss the simpliccuty from that "world".</p>
    <p>Thanks!</p>
    <p>Alex</p>
