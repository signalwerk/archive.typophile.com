    html: |-
      <p>Padding, margin, typographic options etc are all available in InDesign's tables, without a plug-in. Nearly anything you can do with a regular text box, you can do with a table cell. </p>
      <p>As for styles, that I don't think is available. You can adjust any cell, row, or column just by selecting it and changing options either in the table palette or dialog box. I assume you have done this, but wish to adjust the same column on multiple tables at once. I see your dilemma.</p>
      <p>Something tells me we could teach each other quite a bit if we were only in the same office for a day. Now, for that ticket to Oslo...</p>
