    html: |-
      <p>I am reasonably confident that the order in which things are done in a video production haven't changed much since I worked in commercial television over thirty years ago (although the tools are entirely different). Graphics which will appear live during a production are usually among the last things done, since the turnaround time is relatively brief and rehearsal is rarely required to insert them properly.</p>
      <p>In this instance, it appears that POP in Hobo is merely a placeholder, just plopped in; the final presentation appears to have been designed...</p>
