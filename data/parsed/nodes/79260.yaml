    <p>Just a quirky typography tale and conundrum.</p>
    <p>The Eurovision Song Contest is easily the biggest televisual event of the year in Sweden. The national selection for what song will get to go stretches out over six weeks, with over a third of the population seeing each qualification round and almost half the final. It's an enormous production on a mastodon scale, with artists, dancers, choreographers, set designers and TV producers spending months trying out everything to perfection.</p>
    <p>Which is why I was so surprised when one of the performances switched typefaces in less than 24 hours.</p>
    <p>Eric Saade is hotly tipped to win the Swedish selection. On Thursday, he entered the first rehearsal for his qualification round, performing the song "Popular". He's the young kids' choice and has an amazing crew of dancers.</p>
    <p>On the big plasma screens behind him that form the main part of the set the word "POP" flashed in and out repeatedly. I saw clips from it at a preview show and was startled because the text was in... Hobo. :|</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1-saade-2-002_6690.jpg"></div><p></p>
    <p>But: at the dress rehearsal 24 hours later the Hobo was gone, replaced by an ultrabold condensed sans and giving off an entirely different impression:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/8-saade-004_5693.jpg"></div><p></p>
    <p>I wonder what made them change, that quickly and that late in the production cycle?</p>
