  html: |-
    <p>You know those single-page specimens the kool kidz at foundries gin up to exhibit many variants of a typeface family on the same page? Each line tells a little story and uses its own variation, as seen on the left-hand page of the illustration for <a href="http://www.fontbureau.com/books/dbspecimens" title="Book downloadable at Font Bureau" rel="nofollow"><cite>David</cite> (“Fools!”) <cite>Berlow Type Specimens</cite></a>.</p>
    <p>But sometimes all the lines put together tell a <em>big</em> story. I have a dim racial memory that one of our number used the lyrics of Duran Duran’s “The Reflex”&nbsp;in exactly this way. False-memory syndrome? If not, who did it? Don’t leave me answered with a question mark here.</p>
