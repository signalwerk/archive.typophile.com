    html: <p>In the Dover Solotype catalog there are a few candidates, but who knows if they are digitized -- 'Barnum Square" &amp; "Old Town" (p.25). On  the previous page there is one called "Warlord" and another called "Wigwam" that also have similar characteristics. The obvious digital fonts I know, like P.T. Barnum, Wanted and Playbill are not the same. <br> <br>What is the source of the image? Does it possibly come from before the 1990's? </p>
