    <p>I’ve been reading about type size and leading, but now I am faced with an interesting puzzle.  Instructions require for a document with body text in a roman typeface, 14 pt size, “double spaced.”  What would you consider double-spaced?  A couple of possibilities:  1) Line-spacing at exactly 28 pt because it’s twice the hieght of the 14 pt text?  2) Line spacing at 32 pt based on the theory that that single-spaced 14 pt type probably would be set 16 pt? </p>
    <p>No, there is no opportunity to ask for further clarification.</p>
    <p>I know there’s not a rigid right answer, but I am interested in how typophiles would approach this issue.</p>
