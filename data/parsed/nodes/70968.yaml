    <p>First of all, thanks in advance for any input you may have for me. I am new to Typhophile and I am having a bit of an internal struggle with the task in front of me!</p>
    <p>I am working on some logo concepts for an outdoor nightclub. The major overriding condition is that it has to have a neon influence. That is not particularly taxing, however the client is quite convinced that the lettering should be in a script face. The face that my client prefers is Rapier. </p>
    <p>Now this may not necessarily be a deal breaker either, but I find myself perplexed to find decent examples of this typeface used in any logos, let alone in neon. I look at this font and I think Pizza Hut. Not particularly modern. And the connectivity of the lettering does not seem to flow either. I have reduced the font down to a single stroke to help with legibility in the neon setting, but it just seems weak.</p>
    <p>This logo will need to be used in a number of places. My biggest challenge though, is bringing this logo to life on a 10 foot wide arching entrance sign. Yikes!</p>
    <p>I've included a couple of other rough examples for comparison. What are your thoughts? Any input would be greatly appreciated!</p>
