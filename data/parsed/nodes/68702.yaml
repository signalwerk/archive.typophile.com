  html: |-
    <p>Hi I am currently looking for a complemental font to go with Avant Garde Gothic Pro.<br>
    I will be using it for kind of short length text.<br>
    My problem is that AGGP Draws alot of attention to itself and I need to find a balance between the copy text and the display font (which will be AGGP)</p>
    <p>Right now I am thinking of using any of the web-safe fonts to have it a bit easier on my online portfolio.<br>
    But I am not quite shure any of them serifs will do the job.</p>
    <p>But what do you think am I stupid or do you have any suggestions?</p>
