    html: |-
      <p>Do you want to echo the geometric design? Then maybe take a look at Schadow and Candida.<br>
      Or a rather broad face like Century – not the most beautiful font ever, but it get's shipped with OS/Software.<br>
      Similar fonts from that category (Transitional) should work as well.</p>
