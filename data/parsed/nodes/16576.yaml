  html: |-
    <p>Hey guys,</p>
    <p>Upon submitting some typefaces to a foundry, they sent me a reply with a list of things to tidy up the typeface.<br>
    one of the suggestions was:</p>
    <p>Vector Check — About a dozen self-intersecting contours that should be<br>
    corrected. Correction time: 10 min.</p>
    <p>My question is how do i identify this glyphs? what should i look for.</p>
    <p>THANKS FELLAS.</p>
