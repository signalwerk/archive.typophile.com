  html: |-
    <p>Message threading is a necessity for any properly-functioning Web forum. It’s something neither Typophile <em>nor MetaFilter</em> has, so we could innovate here.</p>
    <p>It is difficult to set up properly, not least of all from a coding perspective, since it involves confusingly nested unordered lists. But for long threads, it makes the difference between “comprehensible” and “chatter.”</p>
