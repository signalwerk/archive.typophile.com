    date: 2010-01-24T19:38:00
    date_raw: 24 Jan 2010 — 7:38pm
    votes: null
    html: <p>If message threading is possible, and some people really want it, it could be a display option, but personally I do not want it. I like the cumulative and interweaving form of Typophile discussions, and I also like being able to respond to multiple previous messages in a single post, making connections as I go between the points made by various contributors. I've seen how threaded discussions work on Reddit, and what I see is potentially interesting discussions very quickly terminate as threads never generate the same critical mass as the glorious indiscretion of a good free-for-all.</p>
