      <p>I don’t agree with this observation. I find sites with nested replies to be very annoying, confusing, and jumbled. </p>
      <p>If there were other functional amenities added to facilitate more comprehensive quoting and comment-linking, as have been suggested elsewhere, then I think this would suffice to improve the flow of long, diverse conversations.</p>
