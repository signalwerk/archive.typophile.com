    html: <p>Sheesh, none of these are getting me exited at all. Not to be cruel but unless you're willing to look at the Luxury Brand comment and examples your were given more seriously I think you should move away from a type foucused mark here. You're not getting it yet. <br> <br>There's no reason not to try your hand at something more illustrative and potentially more explicit. Don't forget many logos have ideas embedded, so far these don't have any luxury ideas in them just flying ideas and that's already very common out there. This logo has a particular advantage. It hasn't been made yet. It hasn't filled Chapter 11, or lost luggage, or had to bump a passenger. Let the mark show that it's fresh and that luxury is something that is mysterious, especially in a time of fear and redundant securities and armed air marshalls. You have a lot of work to do here. Make the client earn this logo. <br> <br>Rock On.</p>
