    html: <p>As I was looking at a few magazines tonight I realized that this thread was in the back of my mind as I flipped the pages.  <br> <br>It is impossible to put the weight of selling anything as luxury solely upon the typeface--not that this is what is being done here--because a product is luxury because of so much more than just one part of it. However, the right typeface can set the stage...in fact, it does set the stage if nothing else has been done thus far. <br> <br>Do you have any information other than what you've shared that might shed more light? <br> <br>Lancome, for instance, uses an OCR font for the copy in combination with the serif logo (and sans sub-logo). But the thing that REALLY sells it as luxury--pretending that I know nothing of their actual products--is the enhanced lips shot. After you notice that gorgeous image you then notice that it is Lancome and then you read the copy.  <br> <br>What does luxury mean to you? Upper East Side or Tribeca? Palm Springs or Las Vegas? Cashmere or good cotton? Satin or Egyptian cotton? Who the target audience? Entrepreneurs or Tycoons? Or by luxury?</p>
