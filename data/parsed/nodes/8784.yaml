    html: <p>I liked the first ones better than the Helvetica or Clearface ones. <br> <br>This is a tough design challenge. The fuselage demands  <br>something short and wide and the tail demands something  <br>narrow and tall. Tough to find the right balance. <br> <br>The staccato letterspacing in your first example would be tough  <br>to balance with the similarly spaced windows running the length  <br>of the plane. (Not that it can't be done, but it takes caution.) <br> <br>Clearface doesn't say luxury as well as it says "maple syrup" or  <br>"corduroy" or maybe "strawberries and cream." And steer clear of  <br>Arial/Helvetica for this one. <br> <br>Luxury brands need luxurious type - extra large and hyper thin  <br>or elegant and understated. <br> <br><a href="http://www.aveda.com/" target="_blank">http://www.aveda.com/</a> <br><a href="http://www.chanel.com/" target="_blank">http://www.chanel.com/</a> <br><a href="http://www.saksfifthavenue.com/" target="_blank">http://www.saksfifthavenue.com/</a> <br><a href="http://www.prada.com/" target="_blank">http://www.prada.com/</a></p>
