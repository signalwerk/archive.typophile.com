      <p>This could turn out to be very useful. I especially like the way there are references at the foot of the page.</p>
      <p>I was plotting stem weight graphs recently, from large type families (including Soho, Apex, Guardian, Unit), and found that, instead of the weight differences increasing more in the blacker weights, the difference dropped off again, making an s-shaped curve with smaller differences at the extremes and larger steps between the weights around the middle. I supposed that this because the optical effect is bigger in the extreme weights: hairlines are noticeably different of course with only a few units added to stems, and presumably the same applies to hairline counters in the fattest weights. In the middle of a family, a couple of units will neither increase the stem weight nor decrease the counter sizes enough to warrant the inclusion of a new weight. </p>
      <p>This suggests to me that there are very divergent models of how the weight can be added, and wonder if there are any other references about this, or whether other models can be included in the calculator.</p>
      <p>I wonder if a preview function would be especially neat, using a live multi-master to generate instances? (Though that may be horrible to put together!)</p>
