      <p>So I figured to field-test this thing. Ernestine* doesn't have a lot of weights (only 4) but the exact determination of those four weights was a result of an unusual degree of back-and-forth refinement between three different parties (Nina, FSI and myself) so I think it makes for a decent test case.</p>
      <p>* <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a></p>
      <p>My suspicion that this algorithm is not complex enough -even within a text range- was confirmed; weights work largely in pairs, something not incorporated into this algorithm. One would need to use this algorithm in a more sophisticated way, possibly by running two parallel weight ranges that somehow intermesh. I did however manage to come up with a <em>progression</em> that nicely yields Ernestine's numbers:</p>
      <p>I put 53 (the Light) and 120 (the Bold) and 4 steps. The "25%" column came up with a Regular stem value (74) that matched, however the value for the Demi was way too light. So I ran it again from 74 to 120, but again with 4 steps (not 3) and then the "Luc(as) Style" column had the correct third value (the second interpolated one) which is 102.</p>
      <p>I believe I can reuse this progression to emulate the nice weight distribution of Ernestine in the future, but how to extend it to a face with more than 4 weights?</p>
      <p>hhp</p>
