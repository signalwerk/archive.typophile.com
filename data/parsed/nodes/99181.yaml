    <p>This is a simple little tool that will help you plan the stems weights values across a 9 styles family.<br>
    Input your thinnest and boldest stems values, and it will show you a wide range of possibilities to get you started.</p>
    <p>The first column will provide steps of equal size.<br>
    The last column will provide progressive steps.<br>
    The 3 columns in the middle will provide intermediate steps.</p>
    <p>You can use this values as a starting point to plan your family.</p>
    <p><a href="http://www.impallari.com/familysteps/" title="http://www.impallari.com/familysteps/">http://www.impallari.com/familysteps/</a></p>
