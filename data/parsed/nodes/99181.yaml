      <p>Hmm, that seems a bit fishy :) You've just fitted the equations around the maximum and minimum values for each data set, which means each progression pretty much has to fall within the area enclosed by the two equations.</p>
      <p>Here's a graph showing aggregated data. All data is aligned on step 4, the regular weight, as I'm uncomfortable with the way the graphs above show Luc(as)'s method to prefer relatively lighter middle weights (when in fact I think they're preferring relatively heavier dark weights). I've added a trend line in black (following the median values for each weight), which clearly shows less variance between weights at the extremes. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/graph1_6051.jpg"></div><p></p>
      <p>Hopefully others can add their findings, as I'm certain we need more data, especially for families with 9 or more weights.</p>
  - id: 535984
