      <p>Hi hrant,<br>
      Your first 3 steps (53, 74, 102) are a luc(as) progression.<br>
      √(53 × 102) = 73,53 (rounded to 74)</p>
      <p>The one that is not progressive, is your last one (120).<br>
      And that's totally OK. As it's a (subjective/personal/what look best to the eye) decision.<br>
      Other people may say that your Light is not light enough, or that your bold is not bold enough, or whatever... And at the end, it's a matter of (personal preference/what looks best to your eye/what work best in a certain situation or medium may not work in another different situation or medium) as there is not perfect solutions that can please all people in all different situations in all different mediums.</p>
      <p>This little tool is not intended to provide (out-of-the-box/plug and play) values. That's way it shows all the columns, instead of showing just 1 magic solution.<br>
      As stated on the About text:  "We will show you a wide range of possibilities to get you started ... The final decision, of course, is up to you!"</p>
      <p>What I have in mind for version3, is something like this:<br>
      First Column: Equal Steps<br>
      Last Column: Progressive Steps<br>
      And only one column in the middle, with a "slider" that you can use to move form 1% to 99% (replacing the 25%, 50% and 75% columns) so you can really explore all the space between Equal Steps and Luc(as) theory.</p>
      <p>Why the slider?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/grafico1_5579.png"></div><br>
      The first and last columns (Equal Steps and Lucas) are giving you only the limits<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grafico2_4966.png"></div><br>
      Currently in version2: the 25%, 50% and 75% columns, let you explore SOME of the intermediate space<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grafico3_5426.png"></div><br>
      In the next version, the Slider, will allow you to explore ALL the intermediate space (green area). Basically, because the best options may be at 66%, 72%, 82% or whatever other value (depending on how big or how small is the Thin-Black difference).<p></p>
