    html: |-
      <blockquote><p>Hmm, that seems a bit fishy :) You've just fitted the equations around the maximum and minimum values for each data set, which means each progression pretty much has to fall within the area enclosed by the two equations.</p></blockquote>
      <p>Bendy, the equations are not fitted. What I've done for each family, is to show the real weight distribution compared to Equal Steps and Lucas Steps calculated specifically for each family, in order <strong>to focus on the curve shape</strong>. So that it can be isolated of the number of steps, or of the Black-Thin difference.</p>
      <p>The result shows a lot of different approaches, but overall I think that it's starting to show a general S-shape trend:<br>
      - Stay near Lucas values in the Thinnest weights.<br>
      - Move closer to 50% for the middle weights.<br>
      - Move closer to Equal Steps in the bolder weights.</p>
      <p>However, there are notable exceptions:<br>
      - Soho: Inverted S-shape (Thinner weights close to Equal steps, Medium close to 50%, Black close to Lucas).<br>
      - Myriad: Really big steps from Thin to Medium, Really short steps form Medium to Black.<br>
      - Apex, Freight, Stag: Short steps first, then a big jump, then short steps again.</p>
      <p>We both agree that more data will help. But the number of weights should not be of much importance, as the formula has to work well with any number of steps, font 3 to ∞</p>
  - id: 536025
    user_id: 20652
