    date: 2013-01-02T02:17:00
    votes: null
    html: |-
      <p>The reason I think the number of weights is important is simply to show more of the curve (there's less data at weights 1 and 9 on my graph). Families with 9 or more weights will get into the really bold bolds and the really thin hairlines, and so reveal whether the progression curves upward or downward at those extremes. It's entirely possible all three models (equal steps, Luc(as) and the s-shaped curve) are correct, just concerned with different weight ranges, looking at the curve with different levels of zoom if you like.</p>
      <p>Soho is a strange thing. I would almost want to exclude that ultrablack from analysis for being such an outlier, with stems about 80 units wider than the median for any other fattest weight. It could even have been designed independently. Myriad is definitely interesting, as it seems to contradict all three theories by adding larger steps in the middle of the family. Those other three have the big jump exactly at the regular weight, either to the next weight down or the next weight up. As Hrant pointed out, those adjacent weights are not designed to be used together, which must factor in to the weight progression.</p>
