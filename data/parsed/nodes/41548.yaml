  html: |-
    <p>hi all,</p>
    <p>i noticed on the front page a question mark set in Borges Titulo - it<br>
    seems to be of the general form where the upper part wants to shoot off<br>
    into never-neverland rather than curling back down.</p>
    <p>it reminds me of the one in Scala Sans - my main disappointment/irritation<br>
    in an otherwise great typeface.</p>
    <p>does anyone know about this kind of question mark? is this style part of<br>
    a general class of question mark designs? does it have a name?<br>
    what is the history of it or inspiration for that form?</p>
    <p>thanks,<br>
    jarrod</p>
