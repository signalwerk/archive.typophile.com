    html: |-
      <p>Actually, Decadentia is not correct. That was one of Manfred Klein's filter-a-font experiments. The typeface he used was either <a href="http://www.moorstation.org/typoasis/designers/lloyd/index.htm" target="_blank" rel="nofollow">Paul Lloyd's</a> Ruritania or Dieter Steffmann's <a href="http://www.moorstation.org/typoasis/designers/steffmann/samples/r/rothenbg.htm" target="_blank" rel="nofollow">Rothenburg Decorative</a>.</p>
      <p>I'm not sure what the typeface's original name was, but, as a rule, Steffmann tends to use the original while Lloyd makes up his own names. Still, I like Lloyd's font Ruritania better. It seems a little cleaner.</p>
      <p>If you stretch either of these, you will get a match. Decadentia's distorted characters won't work. Look at the 'm' for the most obvious mismatch.</p>
