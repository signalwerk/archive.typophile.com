  html: "<p>a swedish colleague of mine recently purchased an opentype font. he's running windows NT. he wants to access things like the alternative figure styles.  <br> <br>some of his applications support unicode but not opentype layout features, so i advised him to insert the desired glyphs through character map. <br> <br>trouble is, his character map seems different to mine, and only seems to support the first 255 characters (ascii?) <br> <br>here's a screenshot of his charmap: <br><img src=\"http://www.typophile.com/forums/messages/4101/53419.gif\" alt=\"swedish\"> <br>here, for comparison, is my charmap, offering the full range of glyphs in the font: <br><img src=\"http://www.typophile.com/forums/messages/4101/53420.gif\" alt=\"british\"> <br> <br>any ideas would be greatly appreciated. thanks, geraint</p>"
