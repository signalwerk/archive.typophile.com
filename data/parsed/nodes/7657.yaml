    html: "<p>Geraint,  <br> <br>Encoding alternates (swashes, old-style ligatures, small caps, inital versions etc.) or ligatures should be done only through advanced typographic layout features. The by far most popular and relevant advanced typographic layout system is OpenType Layout.  <br> <br>Practically, alternates and ligatures should not be encoded via Unicode, but only by associating them with the basic glyphs using OpenType Layout features.  <br> <br>Assigining PUA Unicode indexes are just a hack, its aim is to allow the user to access the alternate glyphs in applications that do not support OpenType Layout features. The main problem is that glyphs inserted into the text corrupt the text logic: a small cap \"a\" inserted into the text using PUA Unicodes will not be recognized by the application's spell-checker, hyphenation algorithm, or the find-and-replace feature. Similarly, copying-and-pasting the text or changing the font will result in corrupted text: square boxes instead of the actual letters.  <br> <br>Regards,  <br>Adam</p>"
    html_clean: "<p>Geraint,  <br> <br>Encoding alternates (swashes, old-style ligatures, small caps, inital versions etc.) or ligatures should be done only through advanced typographic layout features. The by far most popular and relevant advanced typographic layout system is OpenType Layout.  <br> <br>Practically, alternates and ligatures should not be encoded via Unicode, but only by associating them with the basic glyphs using OpenType Layout features.  <br> <br>Assigining PUA Unicode indexes are just a hack, its aim is to allow the user to access the alternate glyphs in applications that do not support OpenType Layout features. The main problem is that glyphs inserted into the text corrupt the text logic: a small cap \"a\" inserted into the text using PUA Unicodes will not be recognized by the application's spell-checker, hyphenation algorithm, or the find-and-replace feature. Similarly, copying-and-pasting the text or changing the font will result in corrupted text: square boxes instead of the actual letters.  <br> <br>Regards,  <br>Adam</p>"
