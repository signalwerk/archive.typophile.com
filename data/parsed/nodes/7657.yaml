    html: <p>1. With Character Map, one is only able to access the alternate characters if they are encoded in the Private Use Area. While the Calaxie Polaris font (by Thirstype) supports this, not all OpenType fonts support PUA because, in a way, it is a sort of a "hack".  <br> <br>2. While the Windows NT character map looks different, it supports Unicode ranges -- just like the Windows XP character map. In the Windows NT character map, the Unicode ranges are shown in the list that in the Swedish version is labeled "Delm�ngd".  <br> <br>Tell your friend to scroll down that list to see something that says "Private Use Area" in Swedish. He should be able to find the alternate characters there.  <br> <br>Regards,  <br>Adam</p>
