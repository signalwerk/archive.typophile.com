    html: <p>IIRC, NT supports Unicode. However, the CharMap utility may be a bit different. It may be that the NT CharMap only views specific Unicode ranges one at a time, instead of being able to browse through all of Unicode. That might also make it hard to get to private use codepoints or other odd things. <br> <br>Your friend should poke about for an option like the "advanced view" that enables full Unicode browsing in the Win 2000 and later CharMaps. <br> <br>T</p>
