    <p>Wanted to see if anyone knows what two fonts are used on the Colorado license plate.</p>
    <p>I'm pretty sure a good fit for the main license number is: LicensePlate.ttf @ <a href="http://www.fontspace.com/dave-hansen/license-plate" title="http://www.fontspace.com/dave-hansen/license-plate">http://www.fontspace.com/dave-hansen/license-plate</a></p>
    <p>What's your thoughts, especially with the word 'Colorado?'</p>
    <p>Thanks!</p>
