    html: <p>Sure. <br> <br>The event was called Within 4 Walls. AIGA SF invited about 40-50 Designers to create posters for the event, under the theme "how does the street influence design?" Naturally the theme was widely and loosely interpreted (including my own humble submission which effectively answered the question in reverse). <br> <br>The poster was hand silk-screened in a signed and numbered edition of one. <br> <br>Now that you've seen it you can probably figure out which t-shirt submissions are mine as well. <br> <br><img src="http://www.typophile.com/forums/messages/4100/2813.jpg" alt="poster"></p>
