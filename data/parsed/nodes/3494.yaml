    html: <p>Very nice Stephen. Much better than Arial. <br> <br>Aren't there a few other faces out there that, like <br>Arial, come bundled on mac &amp; pc for free? <br>Trebuchet,  Andale Mono, Verdana, Adobe Sans? <br> <br>Does anybody more info on Adobe Sans? I don't <br>know a whole lot about it, but apparently it's the <br>multiple master font that shows up in PDFs when <br>a given font is not properly embedded. <br> <br>Best of luck Christopher. <br> <br>P.S. - We saw your poster at the AIGA SF poster show. <br>Very nice. Sorry I didn't get to meet you in person.</p>
