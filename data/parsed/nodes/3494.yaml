  html: <p> I've designed an identity system for a client using primarily Mrs. Eaves.  We had originally specified Scala Sans as a complimentary sans serif, but the client is unwilling to pay for a site license.  <br> <br>Can anyone recommend a decent free sans serif font? Otherwise they're going to use Arial and I'm going to hang myself. <br> <br>Thanks. </p>
