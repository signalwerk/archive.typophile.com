    <p><img src="http://grfx.cstv.com/schools/msu/graphics/auto/SpartanStadiumWeb.gif"> </p>
    <p>I'm working on a project that requires a typeface like the "500" in this example. Its usage will be more for letters than numerals but this sample here really captures the essence of what I'm looking for. Modern meets athletic.</p>
    <p>I ask all of you great wizards and gurus here for help identifying this font or pointing me to something close.</p>
    <p>The Under Armour typeface is another example of what I feel is modern meets athletic and what I'm looking for, although the style of the "500" is closer to what I need.</p>
    <p><img src="http://www.starrett-lehigh.com/wp-content/uploads/2013/07/under-armour-inc-logo.gif"></p>
    <p>All recommendations will be greatly appreciated. Gratitude in advance.</p>
