      <p>500 (from the Michigan Spartans University): see <a class="freelinking external" href="http://www.typophile.com/node/99339" rel="nofollow">here</a> for a previous discussion on this topic (confirming Machine ITC). More alternatives: <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Hoboken+High/Sans+Serif/" rel="nofollow">Hoboken Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ingrimayne/masheen/" rel="nofollow">Masheen</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/base-runner/" rel="nofollow">Base Runner</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/octin-college/" rel="nofollow">Octin College</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/superstar/" rel="nofollow">Superstar</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/k-type/nyc/" rel="nofollow">NYC</a><br>
      UNDER ARMOUR: to me that looks to be based on <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/eurostile/" rel="nofollow">Eurostile Extended</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/microgramma/" rel="nofollow">Microgramma</a>. Alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/eurostile-candy/" rel="nofollow">Eurostile Candy</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/naghachian/aban/" rel="nofollow">Alban</a> (another rounded Eurostile), <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/reversal/" rel="nofollow">Reversal</a> (another Eurostile clone), <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/saturn/" rel="nofollow">Saturn</a> (one more Eurostile), <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/reaction/" rel="nofollow">Reaction</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/phantom/" rel="nofollow">Phantom</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/stak/" rel="nofollow">Stak</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/light-c/" rel="nofollow">Geometry Soft Pro Light C</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/miedinger/" rel="nofollow">Miedinger</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/phat/" rel="nofollow">Phat</a></p>
