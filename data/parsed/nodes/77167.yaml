      <p>Perhaps it is because punch-cutting depends on a steady hand that there are few type designers with that particular distinction.</p>
      <p>As far as I know, this wasn't a problem of Goudy's, but given the saltier true version of the "stealing sheep" quote, I suppose that his biography would be one that is worth researching. Then we have Eric Gill, who, it is now learned, had rather worse weaknesses. I suppose if we really want to reach, we could even be suspicious of Beatrice Warde's choice of metaphors.</p>
