    html: |-
      <p>One of the inspirations for Fontesque was the furniture in a room in an old military building in Quebec City, an officer's club. All the chairs are distorted, some with legs of different lengths, others with a short arm on one side and a large on the other, and so on. It's like you're tipsy before you even start drinking. </p>
      <p>However, as with much substance-inspired art and design (although music is somewhat different), it's only the inspiration that occurs when high, the execution is done straight. There are some forms of art that can be done with shaky hands, but I don't think making glyphs is one of them.</p>
